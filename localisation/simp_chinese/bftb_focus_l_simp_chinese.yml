 BUL_collectivization_of_the_countryside_bs_support_requirement_tt: "[GetBsName]的派系忠誠度高於§Y70%§!"
 BUL_soviet_bulgarian_war_industry_research_sharing_tt: "從科研共享組織當中獲得§G5%§!的研究加成。"
 BUL_carry_the_revolution_abroad_tt: "任何獨立的巴爾幹§Y共產主義§!國家將會觸發§Y“保加利亞邀請我等加入其陣營”§!事件。"
 BUL_the_anti_capitalist_fight_ns_tt: "\n下列國家將被視為主要的歐洲民主國家：\n"
 BUL_the_anti_capitalist_fight_wargoal_tt: "獲得針對§Y歐洲主要民主主義國家§!的§Y顛覆政權§!戰爭目標。"
