 BUL_stability_impact_tt: "將會基於§Y共產主義§!的支持度與[GetBsName]的§Y支持率§!損失國家穩定度"
 BUL_form_a_regency_council_tt: "將成立攝政委員會代行國家政府職能並監護年幼的西美昂二世。"
 BUL_freedom_of_press_trigger_tt: "此前並未選擇規制新聞審查"
 BUL_appoint_right_wing_ministers_tt: "解鎖對[GetNsmName]展開合作的決議。\n解鎖對[GetNsmName]實施鎮壓的決議。"
 BUL_united_we_shall_prevail_tt: "[BUL.GetFlag][BUL.GetNameDefCap]及其所有巴爾幹共產主義盟友將獲得民族精神§Y統一的巴爾幹§!，其效果為：部隊組織度§G+10%§!，部隊核心領土攻擊§G+15%§!，部隊核心領土防禦§G+15%§!。"
 BUL_balkan_federation_of_socialist_republics_faction_tt: "觸發事件§Y“保加利亞邀請我等加入巴爾幹社會主義共和國聯邦”§!。"
 BUL_balkan_federation_of_socialist_republics_decisions_tt: "§Y巴爾幹聯邦之夢§!決議現在可將目標指向巴爾幹其餘諸國。"
 BUL_bury_the_grudges_of_the_past_explanatory_tt: "所有獨立的巴爾幹§Y共產主義§!國家將會觸發§Y“保加利亞邀請我等加入巴爾幹社會主義共和國聯邦”§!事件。\n§R保加利亞將會放棄對上述國家的領土宣稱§!。"
 BUL_bury_the_grudges_of_the_past_explanatory_democratic_tt: "所有獨立的巴爾幹§Y民主主義§!國家將會觸發§Y“[BUL.GetNameDef]邀請我等加入[GetDemocraticBalkanConfederationName]”§!事件。\n§R保加利亞將會放棄對上述國家的領土宣稱§!。"
 BUL_bury_the_grudges_of_the_past_decisions_tt: "解鎖影響並邀請巴爾幹諸國加入[GetBalkanFactionName]的決議。"
 BUL_bury_the_grudges_of_the_past_no_faction: "[ROOT.GetFlag]§Y[ROOT.GetAdjective]§!派系"
 BUL_bury_the_grudges_of_the_past_communist: "§Y巴爾幹社會主義共和國聯邦§!"
 BUL_bury_the_grudges_of_the_past_democratic: "§Y巴爾幹協約§!"
 BUL_balkan_trade_union_secretariat_tt: "所有與保加利亞結盟的巴爾幹國家將獲得民族精神§Y巴爾幹貿易聯盟書記處§!，其效果為：生活消費品工廠§Y-5%§!，經濟法案花費§G-35%§!，貿易法案花費§G-35%§!。"
