 BUL_crush_the_communists_tt: "解鎖對[GetBsName]實施鎮壓的決議。"
 BUL_crush_the_communists_no_cooperation_tt: "\n§R將會在未來阻止保加利亞政府與[GetBsName]展開合作§!。"
 BUL_state_is_in_the_aegean_sea_tt: "是愛琴海沿岸的地區"
 BUL_state_is_in_the_black_sea_tt: "是黑海沿岸的地區"
