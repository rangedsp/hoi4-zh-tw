 BUL_cooperate_with_the_zveno_tt: "解鎖對[GetZvenoName]展開合作的決議。"
 BUL_power_to_the_tsar_tt: "解鎖對[GetBsName]和[GetBznsName]實施鎮壓的決議。\n解鎖對[GetBznsName]展開合作的決議。"
 BUL_restrained_paramilitary_organizations_tt: "解鎖對[GetNsmName]展開合作的決議。"
 BUL_ban_far_right_organizations_tt: "解鎖對[GetNsmName]實施鎮壓的決議。"
