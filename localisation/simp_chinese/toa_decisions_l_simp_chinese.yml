 ARG_economic_reform_in_state: "在[FROM.GetName]進行稅制改革。"
 ARG_balancing_act_decisions: "平衡法案"
 ARG_balancing_act_decisions_desc: "隨著我們的新政府日漸穩固，我們再次面臨著試圖同時與同盟國和軸心國保持關係的問題。這場戰爭似乎沒有立即結束的跡象，因此明智地平衡我們的盟友關係非常重要。偏袒一方可能會招惹另一方。"
 ARG_balancing_act_decisions_AAT_tt: "解鎖§Y平衡法案§!決議，這會允許我們在安撫[USA.GetFlag]§Y[USA.GetName]§!和[ENG.GetFlag]§Y[ENG.GetName]§!，或者[GER.GetFlag]§Y[GER.GetName]§!和[ITA.GetFlag]§Y[ITA.GetName]§!之間取得平衡。安撫措施會為§Y國際市場§!提供§Y裝備補貼§!"
 ARG_balancing_act_decisions_tt: "解鎖§Y平衡法案§!決議，這會允許我們在安撫[USA.GetFlag]§Y[USA.GetName]§!和[ENG.GetFlag]§Y[ENG.GetName]§!，或者[GER.GetFlag]§Y[GER.GetName]§!和[ITA.GetFlag]§Y[ITA.GetName]§!之間取得平衡。"
 ARG_military_coup_decisions: "軍方紛爭"
 ARG_military_coup_decisions_desc: "我們新當選的政府慶祝選舉勝利時，軍方內部的不滿情緒開始增長。由於協和同盟內部存在如此多的腐敗，而且許多軍事精英都在爭奪權力，他們向布宜諾斯艾利斯進軍只是時間問題。"
