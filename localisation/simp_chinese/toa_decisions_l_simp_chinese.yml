 ARG_south_american_unity_decisions: "南美統一"
 ARG_south_american_unity_decisions_desc: "既然我們已經將南美洲的人民團結在同一面旗幟下，我們就可以通過把以前較大國家的領土逐一納入我們的版圖來確立我們在這片大陸的主導地位。"
