 mechanized_desc: "有輕型裝甲的步兵載具。"
 modern_armor: "現代坦克"
 modern_armor_desc: "現代坦克已經發展到可以應對大多數戰場情況。強大的火炮和傾斜的裝甲已經消除了對特定用途坦克的需求。"
 infantry: "步兵"
 infantry_desc: "刀俎上的魚肉。"
 bicycle_battalion: "自行車營"
 bicycle_battalion_desc: "絞肉機裡的肉，但含有一些額外的金屬。"
 paratrooper: "空降傘兵"
 paratrooper_desc: "空降傘兵已經加入了軍隊序列，現在我們可以強勢切入敵方防線，或是在以前無法抵達的地方部署關鍵部隊，這意味著新的戰術機會。"
 marine: "海軍陸戰隊"
 marine_desc: "這種配有兩棲作戰裝備的專業部隊日益成為軍隊不可或缺的力量。我們的海軍陸戰隊裝備特製的登陸艇並接受專業訓練，裝具簡陋和訓練不足已是過去時。"
 marine_commando: "海軍突擊隊"
 marine_commando_desc: "擅長兩棲突擊的部隊越來越不可或缺。臨時拼湊的手段與裝備已成歷史，我們的海軍陸戰兵現已接受相關訓練，並擁有專門的登陸艇支持。"
 mountaineers: "山地步兵"
 mountaineers_desc: "山區作戰使部隊面臨眾多潛在危險，總有猝不及防的情況發生。為士兵們提供這種環境的針對性訓練，可以把風險降到最低。"
 penal_battalion: "懲戒營"
 penal_battalion_desc: "投入絞肉機的絕佳材料。"
 irregular_infantry: "非正規步兵"
 irregular_infantry_desc: "武裝的地方民兵"
 militia: "民兵"
 militia_desc: "完全由志願者組成的義勇軍。"
