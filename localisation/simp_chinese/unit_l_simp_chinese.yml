 maritime_patrol_plane: "海軍巡邏轟炸機"
 recon: "騎兵偵察分隊"
 recon_desc: "在主力行進前派出小股斥候以獲得敵人位置和數目的情報。"
 mot_recon: "摩托化偵察連"
 mot_recon_desc: "利用輕型卡車和摩托車，偵察連可以在更遠的範圍內活動並覆蓋更廣的區域以保護部隊的側翼。"
 armored_car_recon: "輕型裝甲偵察連"
 armored_car_recon_desc: "裝備有輕型裝甲車的偵察連可以與敵軍作戰並阻止敵軍的偵察兵獲取任何有價值的情報。"
 light_tank_recon: "裝甲偵察連"
 light_tank_recon_desc: "在偵察單位中使用輕型坦克，我們能夠利用開火來實現一些火力偵察的目的，從而更好的瞭解我們面對的是什麼。"
 armored_car: "裝甲車"
 armored_car_desc: ""
 engineer: "工兵連"
 engineer_desc: "構建工事和排除障礙的專業能力使得工程兵在戰場上至關重要。培養工程部隊全面的技能，這讓我們可以把它部署到任何需要它應對的情況和環境。"
 field_hospital: "野戰醫院"
 field_hospital_desc: "在戰場上為傷兵提供緊急醫療處理。"
