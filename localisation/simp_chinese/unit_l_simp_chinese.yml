 rangers_support: "偵察遊騎兵"
 rangers_support_desc: "偵察遊騎兵是精銳游擊部隊，擅長滲透、偵察和近距離作戰。"
 ranger_battalion: "遊騎兵"
 ranger_battalion_desc: "遊騎兵是茂密植被地形作戰領域的頂尖高手。"
 rangers: "崎嶇地形專家"
 rangers_desc: "以滲透和戰術意識為導向，加強遊騎兵面對的敵對環境訓練，我們定能從中受益。"
 pioneer_support: "先頭工程部隊"
 pioneer_support_desc: "先頭工程部隊由有才幹的工程師組成，擅長鞏固海岸陣地、一般工程項目以及穩固成果。"
 marines_shore_parties: "灘頭部隊"
 marines_shore_parties_desc: "登陸作戰時，率先進入缺口的主要是灘頭部隊。這群專業戰鬥工程師小組將在炮火下建立立足點。"
 marines_jungle_troops: "叢林專家"
 marines_jungle_troops_desc: "這種海軍陸戰隊主要清理密集地形，並擅長在崎嶇地形上進行大規模進攻行動以及工程建設。"
 marines_recon: "嚴苛訓練方案"
 marines_recon_desc: "從來沒有完全準備好面臨戰爭的士兵。但作戰教官保證稱，這一點可以無限去趨近——只有最堅強的新兵才能抵達戰場之彼岸。"
 marines_commandoes: "海軍突擊隊"
 marines_commandoes_desc: "海軍陸戰隊在敵後的長期作戰中證明了其價值。如今應更進一步，將其實踐鞏固於學說之中，並按有效游擊行動來組織部隊。"
 marines_expeditionary: "遠征單位"
 marines_expeditionary_desc: "協同襲擊從跨部門的規劃和後勤中得益。隨著學說發展，我們定能從支持特遣部隊中獲益。"
 marines_expeditionary_blowtorch: "噴燈與瓶塞鑽"
 marines_expeditionary_blowtorch_desc: "海空與專業陸上部隊的完美協同可確保佔領任何目標。這種進攻戰爭的兵種聯合策略將彰顯我們強大的後勤能力。"
 marines_expeditionary_support: "遠征特遣部隊"
 marines_expeditionary_support_desc: "眼下，各部隊間密切合作的重要性再怎麼強調也不為過。後勤特遣部隊投入戰場後，我們真真切切地成為了一支不可忽視的力量。"
 marines_commandos_demolition: "爆破專家"
 marines_commandos_demolition_desc: "爆炸就是藝術，我們可以從中受益。破壞是件髒活兒，但也沒法不承認其十分有效。"
 marines_commandoes_mechanised: "機械化海軍陸戰隊"
 marines_commandoes_mechanised_desc: "只有先頭部隊裝備妥當，才能增強登陸成功後的海岸鞏固能力。這需要我們在生產戰略以及學說上進行轉變。"
 category_amphibious_tanks: "兩棲裝甲"
 SF_MARINES_exfiltration_effect_tt: "海軍突擊隊有能力滲透任何沿海省份."
 SF_marine_demoliton_effect_TT: "登陸作戰成功後，海軍突擊隊師將對戰術指定地區的所有建築造成§H1§!級破壞。"
 marines_commandoes_mechanised_non_mtg: "專門化訓練"
 marines_commandoes_mechanised_non_mtg_desc: "加強特種部隊的精英骨幹，儘管代價是犧牲掉其更廣泛的應用領域。"
 northern_territory_recon_support: "北領地偵察分隊"
 northern_territory_recon_support_desc: "憑藉本土地形熟知度與叢林生存專長，北領地偵察分隊可對最偏遠、環境最惡劣的地域實施偵察監視。"
 winter_logistics_support: "冬季後勤連"
 winter_logistics_support_desc: "為徒步步兵提供合適的裝備，以此適應冬季作戰條件。"
 long_range_patrol_support: "長程巡邏連"
 long_range_patrol_support_desc: "擅長偵察和摧毀任務的精英步兵隊。"
