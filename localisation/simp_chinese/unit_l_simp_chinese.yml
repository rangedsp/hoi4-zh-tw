 super_heavy_railway_gun_desc: "$super_heavy_railway_gun_equipment_desc$"
 land_cruiser: "陸地巡洋艦"
 land_cruiser_desc: "一臺裝備了戰列艦級別武器和最重裝甲的龐大戰爭機器，但極為緩慢且消耗大量資源。"
