 hq_recon: "偵察參謀"
 hq_recon_desc: "收集並分析從戰場收到的偵察數據。"
 hq_military_police: "憲兵參謀"
 hq_military_police_desc: "維持當地秩序並指揮集團軍作戰區域內的師級部隊調動。"
 hq_maintenance: "維修計劃參謀"
