 airborne_light_armor: "空降輕裝甲"
 airborne_light_armor_desc: "配備極輕裝甲載具和革新性的滑翔原理後，空降裝甲師已不再是異想天開。這種部署既快速又出人意料，所帶來的戰術優勢絕不容小覷。"
