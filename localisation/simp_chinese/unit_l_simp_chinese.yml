 category_self_propelled_anti_air_regimental_support: "團屬自行防空炮支援"
 category_regimental_support_artillery: "步兵炮與火箭炮"
 jungle_pioneers_support: "叢林先鋒連"
 sturmtruppe_battalion: "突擊營"
 sturmtruppe_battalion_desc: "分配給一般部隊作為突擊營受訓、裝備、使用的精英步兵單位。"
 assault_engineer: "突擊工兵連"
 assault_engineer_desc: "擅長突破防禦工事，他們將爆破技術與裝甲防護結合，在最惡劣的環境下也能確保機動性和攻堅能力。"
 armored_engineer: "裝甲工兵連"
 armored_engineer_desc: "配備多功能車輛，用於在戰鬥條件下建造防禦工事、清除障礙物並增強戰場機動性。"
 armored_maintenance: "裝甲維修連"
 armored_maintenance_desc: "擅長在戰場上直接回收和修理受損坦克及其他裝甲單位的專用車輛。"
 armored_signal: "裝甲通信連"
 armored_signal_desc: "這些專用車輛配備了先進的通信系統，能夠在前線提供戰場指揮和協調的作戰能力。"
 motorized_military_police: "摩托化憲兵隊"
 motorized_military_police_desc: "維持軍紀並鎮壓佔領區的抵抗，同時能夠在交戰區進行偵察。"
 helicopter_recon: "直升機偵察員"
 helicopter_recon_desc: "經過專門訓練的炮兵觀察員乘坐直升機，無論地形如何都能快速偵察特定區域，並在需要時引導精確打擊。"
 helicopter_transport: "直升機運輸"
 helicopter_transport_desc: "直升機經過改裝貨運機艙，或通過繩索懸掛貨物，可以將武器裝備快速送至需要的地點，無視地形限制。"
 helicopter_field_hospital: "直升機急救"
 helicopter_field_hospital_desc: "全體人員注意！傷員即將由直升機送達！醫療後送直升機能夠比普通救護車更快地將傷員撤離戰場。"
 helicopter_brigade: "直升機旅"
 helicopter_brigade_desc: "通用直升機支援旅，能夠在多個領域提供靈活的機動支援。"
 super_heavy_artillery: "超重型火炮"
 super_heavy_artillery_desc: "配備大口徑榴彈炮的特種部隊，用於摧毀敵方的防禦工事和堅固陣地。"
 self_propelled_super_heavy_artillery: "自行超重型火炮"
 self_propelled_super_heavy_artillery_desc: "大口徑榴彈炮，安裝在機動底盤上，將強大的火力與提升的機動性相結合，摧毀敵軍防線。"
