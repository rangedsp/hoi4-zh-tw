 JAP_national_army_dm: "帝國陸軍"
 JAP_national_army_dm_desc: "日本陸軍是我們的主要地面部隊，在明治時代的快速現代化進程中發揮了核心作用，並參與了日清戰爭、日俄戰爭以及世界大戰等多場衝突。它最初由明治維新後的藩兵整編而成，後受法國和德國模式影響，逐漸發展成為強大的現代化軍隊。"
 JAP_jungle_armor_tt: "\n§Y$category_all_armor$§!：\n§Y叢林§!：\n進攻效果變化：§G+10%§!\n防禦效果變化：§G+10%§!"
