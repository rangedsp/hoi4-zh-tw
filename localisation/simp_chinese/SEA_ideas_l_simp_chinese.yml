 idea_CHI_our_place_desc: "我們加入[ROOT.GetFactionName]增強了自身實力，但我們應當追求領導地位。這本就是我們的權利。"
 CHI_whampoa_military_academy_spirit: "黃埔主導"
 CHI_whampoa_military_academy_spirit_desc: "國民黨的黃埔軍事學院掌握著新兵入伍與軍內晉升的權力。雖然並非完全無效，但它確實包含大量制度化的腐敗。"
 CHI_the_political_tutelage_dm: "訓政"
 CHI_the_political_tutelage_dm_desc: "現在是全面貫徹孫中山思想的時候了，提高中國人民的識字率並喚醒他們的政治意識，以便在我們土地上建設並維持民國。"
