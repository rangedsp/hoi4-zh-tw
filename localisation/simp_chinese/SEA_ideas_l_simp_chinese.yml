 SIK_state_autonomous_prefecture: "自治區"
 SIK_state_autonomous_prefecture_desc: "此地由地方領袖治理，政府的干預較少。倘若戰事爆發，這些領袖未必會完全忠誠。"
 PRC_the_yulin_garrison: "榆林駐軍"
 PRC_the_yulin_garrison_desc: "儘管我們盡了最大努力將他們剷除，但由井嶽秀與高桂滋指揮的第86與第84師仍設法抵擋我們的攻擊，並有效地將該省北部維持在國民黨控制之下。要剷除他們並不容易，因為他們的陣地非常堅固。"
 ### military spirits  ###
 living_off_the_land_army_spirit: "就地補給"
 living_off_the_land_army_spirit_desc: "用己方武器消滅敵人固然不錯，但用敵方武器消滅他則更勝一籌。"
 rapid_emplacement_army_spirit: "快速部署"
 rapid_emplacement_army_spirit_desc: "就算擁有全世界最強大的火力，如果用錯了地方，那也毫無意義。"
 direct_fire_support_army_spirit: "直接火力支援"
 direct_fire_support_army_spirit_desc: "將射角歸零，直接通過機械瞄具接敵！"
 subsidized_contracts_army_spirit: "補貼合約"
 subsidized_contracts_army_spirit_desc: "從長遠來看，用坦克取代戰馬固然可取，但絕不能以國家經濟崩潰為代價。"
 subsidized_contracts_no_lar_army_spirit: "$subsidized_contracts_army_spirit$"
 subsidized_contracts_no_lar_army_spirit_desc: "$subsidized_contracts_army_spirit_desc$"
 all_arms_at_defense_army_spirit: "全武器反坦克防禦"
 all_arms_at_defense_army_spirit_desc: "裝甲部隊的突破可能隨時隨地在任何地方發生。戰神會庇佑那些自力更生的人。"
 spirit_of_defiance_army_spirit: "反抗精神"
 spirit_of_defiance_army_spirit_desc: "如果永不投降，一個民族就永遠無法被征服。"
 proxy_wars_army_spirit: "干預行動專員"
 proxy_wars_army_spirit_desc: "敵人的敵人就是朋友。"
 naval_tripwire_navy_spirit: "海上絆索"
 naval_tripwire_navy_spirit_desc: "我們或許無法完全阻止敵人靠近我們的海岸，但我們可以讓他付出慘重代價。"
 ship_to_shore_navy_spirit: "艦船到岸訓練"
 ship_to_shore_navy_spirit_desc: "任何陸地火炮都無法與數萬噸海軍鋼鐵所能帶來的火力相抗衡。"
 scouting_force_navy_spirit: "偵察艦隊"
 scouting_force_navy_spirit_desc: "海洋遼闊無垠。戰鬥中的勝利通常屬於先發現對方並果斷出擊的一方。"
 fleet_defense_navy_spirit: "艦載防禦"
 fleet_defense_navy_spirit_desc: "戰鬥空中巡邏與輕型艦艇的存在，是為了保障主力艦隊能夠不受干擾地執行任務。"
 fleet_interoperability_navy_spirit: "艦隊協作"
 fleet_interoperability_navy_spirit_desc: "快速的後勤補給和高效的損管系統本身並不能贏得戰鬥，但它們能讓勝利的炮火持續發射。"
 rapid_concentration_navy_spirit: "快速集結"
 rapid_concentration_navy_spirit_desc: "像蝗蟲群般迅速向敵人聚攏，動用一切可用武器開火：這是通往勝利的最快途徑。"
 aa_curtain_navy_spirit: "防空彈幕"
 aa_curtain_navy_spirit_desc: "如同古代的盾牆，艦隊中的每艘艦船不僅要負責自身防衛，更需協防相鄰艦隻。"
 stay_at_your_posts_navy_spirit: "堅守崗位"
 stay_at_your_posts_navy_spirit_desc: "只要還有一個螺旋槳在轉動，還有一門炮浮在水面之上，我們就仍在戰鬥。"
 selective_engagement_navy_spirit: "選擇性交戰"
 selective_engagement_navy_spirit_desc: "蠢人會在強敵面前停滯不前，任由自己被摧毀。別去打註定贏不了的仗。"
 sea_lane_denial_navy_spirit: "海上航道封鎖"
 sea_lane_denial_navy_spirit_desc: "沒有生物會捕食海膽，這自有其道理。"
 underdog_mentality_navy_spirit: "再接再厲心態"
 underdog_mentality_navy_spirit_desc: "如果第一發魚雷沒中，就再來一發。"
 cult_of_heroism_army_spirit: "英雄崇拜"
 cult_of_heroism_army_spirit_desc: "從古至今，士兵和市民都對同袍的犧牲懷抱深深的敬意。"
