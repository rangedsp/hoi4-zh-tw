 CHI_saco_desc: "中美合作所是一個以情報共享為核心的聯合小組，旨在促進雙方相互學習。"
 CHI_women_in_the_war_effort_idea: "女性參與民族鬥爭"
 CHI_women_in_the_war_effort_idea_desc: "現代化並非男人的專屬領域，我國女性已奮起崛起，在武裝部隊和她們自己的營隊中佔據了應有的位置。"
 CHI_chinese_womens_national_war_relief_society: "中國婦女慰勞自衛抗戰將士總會"
 CHI_chinese_womens_national_war_relief_society_desc: "一個國家的實力取決於其最薄弱的環節，因此社會致力於加強這一環節。"
