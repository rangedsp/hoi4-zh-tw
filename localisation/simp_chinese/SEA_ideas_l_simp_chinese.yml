 CHI_the_political_tutelage_upgraded_dm: "恢復共和"
 CHI_corruption_in_the_administration: "行政腐敗"
 CHI_corruption_in_the_administration_desc: "擦過油的輪子轉得更順，但這並不等同於高效。少數人掌握著不成比例的權力，而這正對一個國家產生著影響。"
 CHI_reorganized_administration: "行政已重組"
 CHI_reorganized_administration_desc: "我們為行政管理的車輪塗上了潤滑油，通過掃除前進道路上的障礙，使其能夠更高效地運轉。"
 CHI_switch_administration_modifiers_tt: "將§Y$CHI_corruption_in_the_administration$§!改善為§Y$CHI_reorganized_administration$§!"
 CHI_illicit_trade: "非法貿易"
 CHI_illicit_trade_desc: "地下市場和走私網絡削弱了政府權威，擾亂了經濟秩序。由於遏制行動零散而隨意，非法貿易的影響持續阻礙國家的統一與改革。"
 CHI_inefficient_economy: "低效的經濟"
 CHI_inefficient_economy_desc: "我國的工業化尚處於起步階段，因為歷屆政府都未能支持其良性發展。不過，我們能夠通過內外舉措來解決這個問題，我們的潛力確實無比廣闊。"
 CHI_neglected_countryside: "被忽視的鄉村"
 CHI_neglected_countryside_desc: "南京國民政府統治的十年間，我們的社會確實發生了令人矚目的變化。然而，現代化大多僅限於城市地區，農村地區則被忽視了。這可能會成為激進思想滋生的溫床。"
 CHI_corruption_in_the_armed_forces: "軍隊腐敗"
 CHI_corruption_in_the_armed_forces_desc: "國民革命軍源自黨的隊伍，因此也繼承了黨的一些問題。裙帶關係、賄賂和貪汙盛行，如果我們想要取得勝利，就必須將這些不良現象根除。"
 CHI_blue_shirt_society: "藍衣社"
 CHI_blue_shirt_society_desc: "三民主義實踐社（又稱藍衣社）將照亮我們獨特的道路，並掃除一切阻礙它前進的障礙。"
 CHI_ROCAF: "航空事務委員會"
 CHI_ROCAF_desc: "航空事務委員會自十年前成立以來，始終是我們掌控天空的機構。雖然尚未形成統一的空軍，但進步的腳步從未停歇，憑藉堅定不移的毅力，我們終將取得勝利。"
 CHI_an_appropriate_design_tt: "[GetAppropriateDesign]"
 CHI_appropriate_design_offensive_idea: "進攻性設計"
 CHI_appropriate_design_defensive_idea: "防禦性設計"
 CHI_protracted_warfare_idea: "持久戰"
 CHI_protracted_warfare_idea_desc: "有些軍隊認為，速戰速決能贏得所有戰爭；而另一些軍隊則明白，阻止對方速戰速決，就能讓對方意志崩潰。通過採取防禦姿態持久作戰，任何入侵者都將被擊退。"
 CHI_decisive_battle_idea: "決戰"
 CHI_decisive_battle_idea_desc: "沒有哪個國家能從長期戰爭中獲益，因此我們必須迅速找到進攻的著力點，快速擊敗敵人。進攻要迅速，打擊要猛烈。"
 CHI_gung_ho_idea: "工合運動"
 CHI_gung_ho_idea_desc: "我們擁有的資源之一是人力，而且我們已經將他們組織成小規模的工業合作社。這些基層組織將在我們當前的衝突中為我們帶來經濟優勢。"
 CHI_ROCN: "中華民國海軍"
 CHI_ROCN_desc: "中央海軍的傳統可追溯至清朝，在北伐之後，它與國民黨重新整合，如今將使我們能夠從大陸向外投射力量。"
