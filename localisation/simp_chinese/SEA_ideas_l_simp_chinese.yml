 SIC_a_loose_unity_desc: "儘管名義上以“川系”旗幟聯合，但省內存在數個不同的統治者，各自有自己的目標與野心。有些人，如劉文輝，甚至建立了與省內其他部分在功能上隔離的小王國，另一些人則對軍隊的管理有自己的見解。"
