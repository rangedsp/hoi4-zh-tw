 PHI_philippine_rule_cant_volunteer: "可以派遣志願軍：§R否§!"
 ## Philippine Army Air Corps
 PHI_philippine_army_air_corps_dynamic_modifier: "菲律賓陸軍航空隊"
 PHI_philippine_army_air_corps_dynamic_modifier_desc: "儘管這支力量在菲律賓軍中尚屬新生，但掌控天空的渴望並未因此減弱。"
 PHI_philippine_army_air_corps_dynamic_modifier_tt: "§Y$PHI_philippine_army_air_corps_dynamic_modifier$§!追加效果："
