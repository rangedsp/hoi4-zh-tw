 JAP_state_shinotism_dm: "國家神道"
 JAP_state_shinotism_dm_desc: "自從明治維新以來，我們一直使用對神社的崇拜來宣揚忠誠與發展。這個政策使得我們能夠建立一個為天皇犧牲的國家。"
