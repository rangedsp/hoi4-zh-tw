 CHI_correcting_a_hisotrical_wrong_idea: "糾正歷史錯誤"
 CHI_liberated_by_democratic_china: "由[CHI.GetNameDefCap]解放"
 CHI_liberated_by_democratic_china_desc: "我們國家終於從殖民者手中贏得了應有的獨立。在[CHI.GetNameDef]的幫助下，我們再次成為一個自由的國家。他們的行動顯然是在幫助我們，他們所宣揚的共產主義思想開始在我們的人民中紮根。"
