 ### MISC ###
 TIB_tibetan_politics_idea: "甘丹頗章"
 TIB_tibetan_politics_idea_desc: "在格魯派統一西藏核心地區、在曠日持久的內戰中擊敗藏巴汗後，第五世達賴喇嘛建立了政教合一的政府，而這一模式也延續至今，成為我們現行體制的基礎。雖然當時採取了閉關政策，但這一舉措確實帶來了更為穩定的局面。"
 TIB_tibetan_army_idea: "藏軍"
 TIB_tibetan_army_idea_desc: "儘管裝備簡陋且嚴重過時，我軍已協助平定白朗起義，並在名義上維持了對領土的控制。我們必須繼續擴充軍力，以保障地區安全，抵禦敵對軍閥的侵擾。"
