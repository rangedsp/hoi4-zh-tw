 ### Dynamic Modifiers ###
 ## Defense Strategy
 PHI_defense_strategy_dynamic_modifier: "防禦戰略"
 PHI_defense_strategy_dynamic_modifier_desc: "作為一個群島國家，菲律賓天然具備相當強的防禦優勢。但這並不意味著我們不應給任何入侵者設置更多障礙。"
 PHI_defense_strategy_dynamic_modifier_tt: "防禦戰略"
