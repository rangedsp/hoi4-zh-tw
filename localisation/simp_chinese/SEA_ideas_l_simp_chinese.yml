 JAP_imperial_army_dm: "帝國陸軍"
 JAP_imperial_army_dm_desc: "日本帝國陸軍是我國的主要陸上武裝力量，在明治維新期間的迅速現代化進程中發揮了核心作用，曾參與包括甲午戰爭、日俄戰爭以及世界大戰在內的大量衝突。最初由明治維新後各藩的地方軍隊整合而成，後在法德體制的影響下逐步發展為一支強大的現代化軍隊。"
