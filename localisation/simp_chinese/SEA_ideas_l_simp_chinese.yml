 PHI_add_defense_strategy_dynamic_modifier_tt: "獲得§Y$PHI_defense_strategy_dynamic_modifier_tt$§!，其效果為：\n"
 PHI_modify_economy_dynamic_modifier_tt: "[GetPHIEconomicModifier]"
 ## Great Depression
 PHI_the_great_depression_dynamic_modifier: "大蕭條"
 PHI_the_great_depression_dynamic_modifier_desc: "大蕭條給美國帶來了沉重打擊，而作為其附屬國，我們也未能倖免於這場金融災難。"
 PHI_modify_the_great_depression_dynamic_modifier_tt: "§Y$PHI_the_great_depression_dynamic_modifier$§!追加效果："
 PHI_the_great_depression_temp_construction_speed: "臨時建築業繁榮"
 PHI_ruling_ideology_ideology_drift_tt: "任何意識形態的偏移都將與執政黨保持一致"
 PHI_ruling_ideology_ideology_drift_tt_2: "每日執政黨變動：$RIGHT|+=2$"
 ##Shaken/Recovering Economy
 PHI_shaken_economy_dynamic_modifier: "動搖的經濟"
 PHI_shaken_economy_dynamic_modifier_desc: "大蕭條的影響仍在全國範圍內迴盪，經濟依舊動盪且易受衝擊。不過，也並非全是壞事，遠處已隱約可見經濟復甦的微弱曙光。"
 PHI_replace_depression_dynamic_modifier_tt: "將§Y$PHI_the_great_depression_dynamic_modifier$§!替換為§Y$PHI_shaken_economy_dynamic_modifier$§!\n效果變化："
 PHI_replace_depression_dynamic_modifier_no_modifiers_tt: "以§Y$PHI_shaken_economy_dynamic_modifier$§!取代§Y$PHI_the_great_depression_dynamic_modifier$§!"
 PHI_modify_shaken_economy_dynamic_modifier_tt: "§Y$PHI_shaken_economy_dynamic_modifier$§!追加效果："
 PHI_recovering_economy_dynamic_modifier: "恢復經濟"
 PHI_recovering_economy_dynamic_modifier_desc: "我們的經濟已開始從先前的金融困境中復甦，投資也已再度認真展開。雖然尚未看到真正的增長，但我們至少大致回到了大蕭條來臨前的水平。"
 PHI_replace_shaken_dynamic_modifier_tt: "將§Y$PHI_shaken_economy_dynamic_modifier$§!替換為§Y$PHI_recovering_economy_dynamic_modifier$§!\n效果變化："
 PHI_modify_recovering_economy_dynamic_modifier_tt: "§Y$PHI_recovering_economy_dynamic_modifier$§!追加效果："
 ## Economic Growth/Pearl of the Orient (Great Depression's lategame replacement)
 PHI_economic_growth_dynamic_modifier: "經濟增長"
 PHI_economic_growth_dynamic_modifier_desc: "我們終於開始看到真正的經濟增長，小企業和創業精神已站穩腳跟，引領國家走向財政繁榮。"
 PHI_modify_economic_recovery_dynamic_modifier_tt: "§Y$PHI_economic_growth_dynamic_modifier$§!追加效果："
 PHI_replace_economic_dynamic_modifier_tt: "將§Y$PHI_recovering_economy_dynamic_modifier$§!替換為§Y$PHI_economic_growth_dynamic_modifier$§!\n效果變化：\n加入陣營緊張上限： §G-[?PHI_the_great_depression_join_faction_tension|%0]§!"
 PHI_pearl_of_the_orient_dynamic_modifier: "$PHI_pearl_of_the_orient_seas$"
 PHI_pearl_of_the_orient_dynamic_modifier_desc: "我們的經濟正蓬勃發展，如今擺脫了殖民宗主國的束縛，我們得以自由做出決策，並證明了東南亞地區能夠實現的經濟繁榮。"
 PHI_remove_economic_recovery_dynamic_modifier_tt: "將§Y$PHI_economic_growth_dynamic_modifier$§!替換為§Y$PHI_pearl_of_the_orient_dynamic_modifier$§!\n效果變化："
 PHI_modify_pearl_of_the_orient_dynamic_modifier_tt: "§Y$PHI_pearl_of_the_orient_dynamic_modifier$§!追加效果："
 ## Philippine Army
 PHI_philippine_army_dynamic_modifier: "菲律賓陸軍"
 PHI_philippine_army_dynamic_modifier_desc: "菲律賓的陸上部隊主要負責保衛我們的本土島嶼。這支部隊最初由多個偵察單位組成，如今其掌控的兵力仍在持續擴充。"
