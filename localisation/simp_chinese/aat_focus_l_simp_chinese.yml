 NORDIC_overwhelming_numbers: "壓倒性計數"
 NORDIC_superior_ships: "優勢艦艇"
 NORDIC_superior_ships_desc: "TODO_NORDIC"
 NORDIC_expert_naval_mechanics: "海軍機械專家"
 NORDIC_expert_naval_mechanics_desc: "TODO_NORDIC"
 NORDIC_air_production: "空軍生產"
 NORDIC_air_production_desc: "如果我們希望在北半球及其他地區建立霸權，我們就需要趕上相對大國的儲備差距。值得慶幸的是，我們可以通過共享來得到用來超越敵人並縮小差距的經驗、知識和裝備。"
 NORDIC_naval_aircraft: "艦載飛機"
 NORDIC_naval_aircraft_desc: "海戰的未來在於天空。我們的海軍轟炸機將把敵人的艦艇送入海底，而我們的艦載戰鬥機將用敵人飛機的濃煙覆蓋天空。"
 NORDIC_air_exercises: "空軍演習"
 NORDIC_air_exercises_desc: "空戰開啟了戰爭的新時代，兩國合作的新時代必須伴隨著緊密執行的聯合空中行動。為此，我們的部隊需要一起訓練，直到他們合而為一。"
 NORDIC_bomber_command: "轟炸機司令部"
 NORDIC_bomber_command_desc: "建立聯合轟炸機司令部將使我們能夠更好地協調戰場上的地面支援以及轟炸機對敵後的入侵。這是我們北方國家能夠齊心協力對抗敵人的唯一途徑。"
 NORDIC_fighter_command: "戰鬥機司令部"
 NORDIC_fighter_command_desc: "正如我們的共同理想和總體使命一樣，我們共同享有我們頭頂的天空。我們必須一起飛行，保護彼此的領空，並獲得戰場上的制空權，這樣我們的聯繫就不會因為敵人的地面支援而中斷。"
 NORDIC_carrier_effort: "重視航母"
 NORDIC_carrier_effort_desc: "海戰的新前沿是他們上方的天空。我們需要集中資源，儘可能製造出最好的航母和最好的艦載機。這樣，我們才能主宰海洋，並以此為我國安全保駕護航。"
 NORDIC_ground_operations: "地勤"
 NORDIC_ground_operations_desc: "建造更多的基地，使我們能夠在聯合空中作戰中擁有更大的靈活性，並建造更多的防空炮臺，我們可以保衛我們的土地，並減輕飛行員的負擔。這就是我們如何創建一個相互關聯的地面支持系統，以最大限度地提高我們空中行動的效率。"
 NORDIC_naval_exercises: "海軍演習"
 NORDIC_naval_exercises_desc: "我們所有國家都擁有可以追溯到幾個世紀前的海軍遺產，波羅的海和北大西洋塑造了我們的文化和生活方式，但正如任何航海國家都知道的那樣，海洋可以同時成為護城河和高速公路。讓我們學習如何從海上防禦和進攻。"
 NORDIC_defend_the_danish_belt: "丹麥地帶防衛"
 NORDIC_defend_the_danish_belt_desc: "丹屬貝爾特海峽是通往波羅的海的門戶。如果他們無法從北大西洋到達波羅的海，我們的國家將更安全，免受海軍入侵，所以讓我們集中精力將其變成一堵牆，這樣我們就可以在波羅的海暢遊無阻。"
 NORDIC_control_the_northern_sea: "控制北海"
 NORDIC_control_the_northern_sea_desc: "挪威海和北海是通往大西洋的門戶。在那裡集中精力將使我們能夠與歐洲北部海岸的國家打交道，如果我們願意的話甚至可以直達北美。"
 NORDIC_baltic_sea_dominance: "掌控波羅的海"
 NORDIC_baltic_sea_dominance_desc: "波羅的海長期以來一直是我們的後院。如果我們讓其他國家自由支配它的浪潮，我們就沒有機會。讓我們建設海岸，這樣我們就可以統治這片寒冷而孤寂的土地。"
 NORDIC_naval_research_institute: "海軍研究機構"
 NORDIC_naval_research_institute_desc: "我們僅僅趕上敵人是不夠的，我們需要像以前一樣處於海軍技術的最前沿。讓我們接納並吸收我們地區的探險和海軍優勢的遺產。"
 NORDIC_submarine_cooperation: "潛艇合作"
 NORDIC_submarine_cooperation_desc: "若能讓敵人失去海運部隊和補給的能力，我們就已經贏得了戰爭的一半。實現這個目標最好的方式就是齊心協力生產最先進的潛艇。"
 NORDIC_naval_officer_academy: "海軍軍官學院"
 NORDIC_naval_officer_academy_desc: "一名優秀的軍官在海戰中比在大多數其他形式的戰鬥中更重要。如果沒有我們海軍艦艇和特遣部隊的軍官等級制度的協調，單個水兵是無能為力的。投資培訓這些人做出艱難的選擇並共同努力至關重要。"
 NORDIC_amphibious_forces: "兩棲部隊"
 NORDIC_amphibious_forces_desc: "通過確保削弱敵軍攻勢的方法，可以是確保我方有隨時予以打擊的能力。如果敵國總是顧慮海岸線遭到登陸，那其在前線就無法部署過多部隊。因此，我們應重點關注兩棲作戰和海軍陸戰隊。"
 NORDIC_joint_military_exercises: "聯合軍事演習"
 NORDIC_joint_military_exercises_desc: "我們的士兵和軍官從未遇到過像我們現在這樣的聯盟，他們必須作為一個整體進行訓練，直到合作成為第二天性。一旦達到這樣的成果，[NORDIC_get_alliance_name]軍隊將勢不可擋。"
 NORDIC_unified_recruitment: "統一徵兵"
 NORDIC_unified_recruitment_desc: "我們必須找到一種方法來標準化我們的徵兵工作，並簡化流程，以便我們能夠讓更多的人員儘快從招徵兵辦公室到前線。"
 NORDIC_mechanized_army: "機械化部隊"
 NORDIC_mechanized_army_desc: "如果我們集中精力訓練我們的士兵操縱和伴隨披鋼執炮的笨重車輛進行戰鬥，我們就能用更少的人力打出更大的拳頭。當然，只要我們能夠生產足夠多的這種龐然大物。"
 NORDIC_infantry_first: "步兵優先"
 NORDIC_infantry_first_desc: "世世代代以來，我們的士兵只帶著武器和制服走上戰場，與他們面前的另一個可憐的靈魂拼盡全力。如果我們的軍隊能夠看到敵人的雙眼，他們就會看到敵人所構成的威脅，併為自己的國家戰鬥至死。"
 NORDIC_expedited_training: "加急軍訓"
 NORDIC_mountaineers: "山地專家"
 NORDIC_mountaineers_desc: "北歐是訓練和運用山地步兵的理想區域。有了一支精通山地作戰的核心隊伍後，我們應該就能更輕鬆地防衛該區域，同時在有機可乘時反攻。儘管我國部分領土已淪陷於敵手，我們也決不投降。"
 NORDIC_nordic_construction_developments: "北歐建設研發"
 NORDIC_nordic_construction_developments_desc: "[NORDIC_get_alliance_name]還有很多事情要做，但距離末日到來的時間已經不多了。我們必須共同努力，找到我們需要的改進措施，以加快我們國家的發展。"
 NORDIC_materiel_design: "軍需品設計商"
 NORDIC_materiel_design_desc: "幾代人的時間，戰爭在很多方面都發生了變化，但幾個世紀以來，戰爭往往歸結為一個士兵和他的步槍。在這個新的戰爭時代，我們不能忽視[NORDIC_get_alliance_name]士兵的武器，通過設計更好的武器，我們將造就更好的士兵。"
 NORDIC_nordic_electronics: "北歐電子學"
 NORDIC_nordic_electronics_desc: "電子時代已經到來，它可能成為未來戰爭的決定性因素，我們不能讓敵人在電子軍備競賽中搶先一步。讓我們共同開發這些電子產品，讓這種新的力量站在我們這一邊。"
 NORDIC_research_investments: "聯合研究投資"
 NORDIC_research_investments_desc: "我們的新聯盟比任何其他聯盟都更加緊密，我們沒有理由將我們的技術進步保密。讓我們分享我們的研究成果，以便我們的戰爭工具擁有消滅敵人所需的優勢。"
 NORDIC_civilian_contributions: "民間貢獻"
 NORDIC_civilian_contributions_desc: "現在，廣大民眾對我們聯盟的其他成員有了新的共同認同感，我們知道他們將願意做出所需的貢獻和犧牲，為戰爭機器提供動力，為[NORDIC_get_alliance_name]帶來安全和榮耀。"
 NORDIC_nuclear_research: "原子能研究"
 NORDIC_nuclear_research_desc: "當原子分裂最終被武器化時，新世界必將降臨在我們身上，科學家們無法閉嘴。為什麼我們要遠離這一可以一舉結束戰爭的技術奇蹟呢？"
 NORDIC_nordic_rocketry: "北歐火箭"
 NORDIC_nordic_rocketry_desc: "如果我們的炸彈可以在沒有飛機干預的情況下投送怎麼辦？自行式武器是未來，如果我們願意，我們可以在[NORDIC_get_alliance_name]的舒適環境中消滅敵人。"
 NORDIC_standarized_parts: "標準化部件"
 NORDIC_standarized_parts_desc: "現在我們已經成為一體，我們可以從彼此共享標準中受益，這樣我們的工廠就可以儘快跟上步伐。設備和零件可以互換，從而大大簡化我們的生產。"
 NORDIC_fill_the_infrastructure_gaps: "填充基建空白"
 NORDIC_fill_the_infrastructure_gaps_desc: "在聯合之前，我們各國的發展水平不同，甚至[NORDIC_get_alliance_name]最發達國家的部分地區可以使用某些更好的基礎設施。我們必須齊心協力，眾志成城。"
 NORDIC_develop_resources: "開發資源"
 NORDIC_develop_resources_desc: "你永遠不知道努力能帶來什麼成果。如果我們集中精力，我們就可以挖掘出對戰爭至關重要的未被發現的資源礦藏，甚至開發出新的方法來從我們已經擁有的資源中提取更多資源。"
 NORDIC_military_industry_hub: "軍工樞紐"
 NORDIC_military_industry_hub_desc: "通過有效地集中我們的軍事工業，我們可以利用這種鄰近性和專業化來使我們的戰爭機器達到新的高度。只要我們保住工廠，我們的產量就將超過我們的敵人。"
 NORDIC_ad_hoc_military_industry: "自組織軍工"
 NORDIC_ad_hoc_military_industry_desc: "沒有時間規劃和建造巨大的工廠園區，或者大片的混凝土和煙霧。我們必須儘可能快地建立我們的工業，儘可能在[NORDIC_get_alliance_name]各地建立小工廠，這樣我們就不用承受在一場戰鬥中失去一切的風險。"
 NORDIC_railway_expansion: "擴建鐵路"
 NORDIC_railway_expansion_desc: "鐵路是我們國家的動脈，現在我們比以往任何時候都更需要這些儘可能廣泛的運輸通道。既然我們目標一致了，我們就必須通過機車的鋼鐵和速度在實際上團結起來。"
 NORDIC_naval_construction: "海軍建設"
 NORDIC_naval_construction_desc: "擁有悠久的航海傳統和世界一流的水手固然很好，但如果我們沒有船隻來使用它們對抗敵人，那就毫無意義。讓我們一起建立一支龐大的艦隊，用它來粉碎任何威脅我們的國家。"
 NORDIC_nuclear_production: "核彈生產"
 NORDIC_nuclear_production_desc: "既然我們有了分裂原子的知識，我們不妨使用它。但首先，我們需要生產足夠的材料和基礎設施，以扭轉戰爭局勢使其對我們有利。"
 NORDIC_jet_engines: "步入噴氣時代"
 NORDIC_jet_engines_desc: "噴氣發動機的新進步使頂級螺旋槳飛機看起來就像漫無目的地飄蕩的紙風箏。空戰的新時代已經到來，並將由噴氣發動機主導。如果我們將投資集中到該領域，我們就能超越我們的敵人，躋身戰機食物鏈的頂端。"
 NORDIC_machine_tools_research: "機床研發"
 NORDIC_machine_tools_research_desc: "人力只是等式的一部分。我們需要在產量上超過敵人，這樣我們才能彌補他們無法彌補的損失。這就是為什麼我們不能將自己侷限於開發新的戰爭機器，而是將精力集中在催生它們的機器上。"
 NORDIC_equipment_conversion_focus: "專注裝備改裝"
 NORDIC_equipment_conversion_focus_desc: "我們有巨大的倉庫，裡面裝滿了舊武器和車輛，這些武器和車輛要麼是封存的，要麼是從我們倒下的敵人那裡繳獲的。這些舊設備可以改裝成我們當前最新、最致命的戰爭機器。"
