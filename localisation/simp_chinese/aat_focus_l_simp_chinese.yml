 #Communist Path
 NOR_a_resurgent_labor_movement: "勞工運動復興"
 NOR_a_resurgent_labor_movement_desc: "[NOR.GetName]人民不再接受資本主義的矇蔽。他們終於看到了真相：他們一直在慢慢地淹沒在主人造成的貧困中。他們現在正抬起頭來，在他們的視野中看到了革命！"
 NOR_compromise_with_the_nkp: "與挪威共產黨妥協"
 NOR_compromise_with_the_nkp_desc: "鑑於我國安全似乎正懸於峭壁邊緣，也許與挪威共產黨達成妥協後，他們與斯大林主義的緊密聯繫能有助我們獲得[SOU.GetNameDef]的幫助。這總比一個被法西斯分子或資本家壓迫的未來好。"
 NOR_prosecute_the_nkp: "起訴挪威共產黨"
 NOR_prosecute_the_nkp_desc: "在挪威共產黨效忠於斯大林而非[NOR.GetName]工人成為眾目昭彰的事實後，工黨便與其斷絕關係了。我們已經放任其腐敗的軀殼潰爛太久了。必須在其把我國出賣給[SOU.GetName]前以全力粉碎這些叛徒。"
 NOR_the_seeds_of_the_revolution: "革命的種子"
 NOR_the_seeds_of_the_revolution_desc: "資本主義創造了毀滅自己的手段，這就是我們的切入點。現在我們的任務是為[NOR.GetName]人民播下更光明未來的種子。然後，我們將等待時機，直到我們能夠收穫自己勞動的果實。"
 NOR_the_voice_of_the_people: "人民之聲"
 NOR_the_voice_of_the_people_desc: "我們必須傾聽民眾，為他們提供放大聲音的工具，同時傳播馬克思的真理。這樣我們的革命才會自下而上地實現。讓人民在受到資本壓迫時大聲喊出他們對自由的需求。"
 NOR_organize_partisan_militias: "組織黨管民兵"
 NOR_organize_partisan_militias_desc: "很明顯，沒有鬥爭，資本主義就不會放鬆對[NOR.GetName]工人的掌控。讓我們武裝並訓練有意願的工人們，這樣當時機來臨時他們就能帶頭為打破資本鎖鏈的革命掃清道路。"
 NOR_consolidate_power: "鞏固權力"
 NOR_consolidate_power_desc: "既然我們有實力確保我們所尋求的未來，那麼是時候保證我們能夠保持這樣的實力了。通過清洗和財產再分配，我們將改造這個國家，讓我們成功和繁榮。"
 NOR_demand_nationalizations: "執行國有化"
 NOR_demand_nationalizations_desc: "資產階級政府還不知道集體所有制會對生產資料的產生多大的力量。我們應當要求將全國重要工廠國有化，這樣我們就可以在革命發生之前就開始革命。更重要的是，工廠越多，我們事業的工人和盟友就越多。"
 NOR_squash_dissent: "粉碎異議"
 NOR_squash_dissent_desc: "我們不能讓我們的努力成果被害蟲偷走。我們必須一勞永逸地發現並消除異議人士。畢竟，任何懷疑我們政府的人都是我們的敵人。"
 NOR_denounce_the_german_reich: "譴責[GetNorwegianThreateningFascist]"
 NOR_denounce_the_german_reich_desc: "我們不能讓[GetNorwegianThreateningFascist]踐踏世界人民。我們必須讓世界上的每個人都知道我們的立場，這樣他們就會加入我們反對法西斯主義的行列。"
 NOR_moscows_education_centers: "共產主義教育中心"
 NOR_moscows_education_centers_desc: "多年來，共產國際向來自斯堪的納維亞半島各地的同志傳授從地下推動革命所需的技能。現在我們可以把他們帶到光明中，教導他們如何繼續持續進行革命。"
 NOR_workers_and_farmers_rise: "工農崛起"
 NOR_workers_and_farmers_rise_desc: "根基已奠定，種子已種下，革命之火即將點燃。讓[NOR.GetNonIdeologyName]的工人和農民站起來，從資本家和地主的血腥手中奪取生產資料。"
 NOR_war_in_finland: "在芬蘭的戰爭"
 NOR_war_in_finland_desc: "芬蘭人民已經受夠了苦難，我們必須與[SOU.GetName]聯手，將他們從資本主義中解放出來。這只是解放所有北歐人民的第一步。"
 NOR_defend_finland: "保衛芬蘭"
 NOR_defend_finland_desc: "我們決不能允許卑劣的[SOU.GetName]染指我等驕傲的[FIN.GetName]民族。我們必須武裝起來，反抗假意服務人民、實則踐踏人民的暴政。芬蘭，必須保持獨立。"
 NOR_send_the_king_back_to_denmark: "將國王遣回丹麥"
 NOR_send_the_king_back_to_denmark_desc: "我們如果把王室留在身邊，就配不上共產主義者的名號。君主制篡取了權力和生產資料，是為反革命和異見集團的大本營。我們必須迅速處理王室問題。"
 NOR_worker_armies: "工人的軍隊"
 NOR_worker_armies_desc: "有許多工作要做，但沒有足夠的人口來同時完成所有工作。通過建立工人的等級制度，就像建立軍事連隊和軍事部門一樣，我們可以開始一個項目一個項目地重新站起來。"
 NOR_nationalize_the_hydro_plants: "水電站國有化"
 NOR_nationalize_the_hydro_plants_desc: "水力發電是[ROOT.GetAdjective]工業的支柱之一，但目前卻落入了資本家的手中！讓我們奪取發電手段，為下一階段的革命提供動力。"
 NOR_expand_military_industry: "擴建軍事工業"
 NOR_expand_military_industry_desc: "我們剛剛起步的軍事工業不足以摧毀全球資本主義。必須擴大軍工產業，以滿足我們不斷擴大的武裝力量的需求。"
 NOR_a_new_norway: "嶄新的挪威"
 NOR_a_new_norway_desc: "挪威人民終於擺脫了資本的枷鎖。在我們的新國家成形之際，這一事實需要得到體現。從現在起，挪威人民將掌握自己的未來。為了新挪威，也為了未來！"
 NOR_norwegian_engineering: "挪威工程師"
 NOR_norwegian_engineering_desc: "我們如果要想實現真正的不斷之革命，就必須擺脫與被剝削的兄弟姐妹們共同製造的戰爭工具。我們如果想把這場革命稱作真正屬於我們的革命，就需要開發我們自己的設計，製造我們自己的裝備。"
 NOR_reawaken_the_permanent_revolution: "喚醒不斷之革命"
 NOR_reawaken_the_permanent_revolution_desc: "托洛茨基告訴我們，革命不會停止，事實上革命也不能停止，直到無產階級掌控歷史的方向。讓我們鼓舞斯堪的納維亞及其他地區的無產階級！"
 NOR_crush_stalin: "[GetCrushStalinName]"
 NOR_crush_stalin_desc: "多年來，約瑟夫·斯大林為了一己私利歪曲馬克思和列寧的言論，在私設公堂上對敵人進行虛假判決，併為追求自我而犧牲了無數生命。我們必須在他毀掉無產階級的未來之前阻止他。"
 NOR_crush_stalin_canonical: "粉碎斯大林"
 NOR_crush_stalin_generic: "粉碎紅色巨熊"
 NOR_crush_big_communist: "粉碎[?GLOBAL.platonic_big_communist.GetNameDef]"
 NOR_crush_hitler: "粉碎希特勒"
 NOR_crush_hitler_desc: "沒幾個人像阿道夫·希特勒那樣犯下如此多的反人類罪行。他摧毀了無數人的生命，而且他的邪惡似乎永無止境。他最終將摧毀我們珍視的一切，所以我們必須在他終結我們之前終結他的意圖。"
 NOR_prepare_for_war: "備戰"
 NOR_prepare_for_war_desc: "現在看來，戰爭似乎是不可避免的，所以為什麼要自欺欺人地認為和平將是永恆的呢？戰爭會悄悄逼近像我們這樣的國家，所以我們必須做好一切準備。"
 NOR_join_the_allies: "加入同盟國"
 NOR_join_the_allies_desc: "因為當最壞的情況最終發生時，擁有強大和值得信賴的盟友將意味著征服與自由的區別。[FRA.GetName]和[ENG.GetName]在世界大戰中打贏過德國，我們相信他們能再次做到。"
 NOR_proactive_defense: "主動防禦"
 NOR_proactive_defense_desc: "防止敵人入侵的根本大法，就是先行幹翻敵人。在敵人有能力染指我國領土之前先將戰爭打包送過去，是為[NOR.GetName]民眾臨危時決意的最佳彰顯。"
 NOR_secure_the_swedish_iron_ore: "確保瑞典鐵礦"
 NOR_secure_the_swedish_iron_ore_desc: "[SWE.GetName]地下蘊藏著大量優質鐵礦石，在冬季北方港口結冰時經由納爾維克流通至全世界。讓這一礦石來源實在是過於暴露在外，使其之於一切外來暴政堪稱探囊取物。如此之事不可接受，我們必須在敵人有意染指之前先行奪取。"
 NOR_secure_denmark: "確保丹麥"
 NOR_secure_denmark_desc: "[NOR.GetName]南方的列強長期以來對我們的前宗主國[DEN.GetName]形成壓迫之勢。如果他們那點羸弱的投降，通往[NOR.GetName]的大門就會敞開。為了以防萬一，我們必須親自把守這道大門。"
 NOR_invite_secret_army: "拉攏秘密軍隊"
 NOR_invite_secret_army_desc: "過去，[NOR.GetNonIdeologyName]領袖建立了一支秘密軍隊，為的是在共產主義革命發生時保衛國家.但如今，為此事撥亂反正已無必要，畢竟其原初目的在現在看來已不再是值得擔憂之事。我們可以作出妥協，向那些願意同我等一道保家衛國而不是造我們反的人發出邀請。"
 NOR_revive_pomor_trade: "重振波莫瑞貿易"
 NOR_revive_pomor_trade_desc: "幾個世紀以來，我們北方的人民一直與白海的波莫爾地區進行貿易。這種貿易讓雙方人民繁榮昌盛，但帝國主義列強和資本主義停止了這種貿易。讓我們恢復與我們的長期兄弟的貿易吧。"
 NOR_join_the_comintern: "加入共產國際"
 NOR_join_the_comintern_desc: "共產國際是真正為世界無產階級革命而戰的保護傘。如果我們想打敗資本主義和法西斯主義，這就是最好也是唯一的途徑。"
 NOR_soviet_industrial_cooperation: "蘇聯工業合作"
 NOR_soviet_industrial_cooperation_desc: "尋求更大、更發達的國家的幫助並不可恥。在保衛革命的戰爭中，每一個工人、農民和工程師都是我們的同志，我們將歡迎他們幫助我們發展工業，就像我們將角色顛倒過來一樣。"
 NOR_field_hospitals: "野戰醫院"
 NOR_field_hospitals_desc: "[NOR.GetName]的人口並不像其他國家那樣是無底洞。物資可以更換，但是失去了一位同志，國際反資本主義鬥爭就少了一個靈魂。我們必須集中精力搶救受傷的士兵，儘快將他們送回前線，以免造成人員傷亡和土地損失。"
 NOR_expanded_conscription_drive: "擴大徵兵活動"
 NOR_expanded_conscription_drive_desc: "我們需要向戰場投入新的部隊，為我們的理念塑造歷史，直到鬥爭結束。每個有作戰能力的男人和女人都必須加入我們的軍隊，以免我們的家園被侵佔。"
 NOR_invite_soviet_designers: "邀請蘇聯設計商"
 NOR_invite_soviet_designers_desc: "我們的共產主義盟友擁有的技術知識比我們領先數十年，如果他們把專業知識提供給我們，我們就可以利用先進的武器和車輛超越我們的敵人，並避免不必要的犧牲。"
 #Allied
 NOR_vote_of_no_confidence: "不信任投票"
 NOR_vote_of_no_confidence_desc: "我們能相信尼高斯沃爾及其工黨有能力阻止布爾什維克和納粹嗎？他的這次裁軍，給人的感覺更像是希臘人打開了特洛伊城的大門，而不是一位準備保衛祖國不受共產主義侵襲的總理。我們不能任其將這個新生的國家拱手讓給[SOU.GetNameDef]。"
 NOR_liberal_conservative_alliance: "自由保守聯盟"
 NOR_liberal_conservative_alliance_desc: "儘管保守黨和自由黨分別代表右翼和左翼，但我們兩黨有足夠的共同利益，我們可以組建政府聯盟，並引開任何來自頑劣的勞動黨的攻擊。我們將共同把[ROOT.GetName]塑造成一個對資本友好且準備好在國內外作戰的國家。"
 NOR_sabotage_unions: "破壞工會"
 NOR_sabotage_unions_desc: "工人們所謂的人權，對我們來說卻是工業增長的障礙。我們能從內部和外部扼殺工團主義運動，如此我們可以輕鬆消除軍事備戰狀態的任何障礙。"
 NOR_invite_foreign_investment: "邀請外國投資"
 NOR_invite_foreign_investment_desc: "幾十年來，我們的工業一直被忽視，因此我們缺乏必要的資本來實現工業化，無法達到歐洲其他國家的水平。幸運的是，為了投資回報，國外有許多貪婪的投資家願意來押注我們的未來。"
 NOR_invite_transnational_manufacturers: "邀請跨國製造商"
 NOR_invite_transnational_manufacturers_desc: "曾經我們過於關注貿易，根本沒有充分利用我國全部的生產力。現在我們已經與工會達成一致，外國公司將湧入我們的國家，接納我們不受阻礙的勞動力市場。"
 NOR_contain_the_labor_movement: "遏止勞工運動"
 NOR_contain_the_labor_movement_desc: "只要存在為了工人階級利益的運動，我們就永遠無法全面掌控進入[NOR.GetName]的資本以及使其持續流動的手段。"
 NOR_uproot_secret_army: "根除秘密軍隊"
 NOR_uproot_secret_army_desc: "這支秘密軍隊於1918年由前任政府組建，一直潛伏在暗處等待一場從未發生的共產主義政變，與此同時，許多人已經激進化為堅定的法西斯分子。這些人就是一顆定時炸彈，隨時可能在我們臉上爆炸，我們必須要處理他們。"
 NOR_support_finland_in_winter_war: "支持芬蘭冬季戰爭"
 NOR_support_finland_in_winter_war_desc: "布爾什維克正在向芬蘭進軍，我們沒有理由相信他們會就此止步。我們必須支持我們的芬蘭兄弟對抗東方的紅熊，以免它吞噬我們所有人。"
 NOR_arrest_quisling: "逮捕吉斯林"
 NOR_arrest_quisling_desc: "前任國防大臣維德孔·吉斯林幾乎從未參與整理[NOR.GetName]危險分子名單。他逐漸縮小的黨派、稀少的盟友和對阿道夫·希特勒的盲目崇拜——一個在任何國家都能讓任何人成為危險的條件——愈發讓他顯得可悲。不過，儘管他是如此微不足道，我們也要杜絕後患。"
 NOR_protect_finnmark_from_the_bolsheviks: "芬馬克反布爾什維克防衛"
 NOR_protect_finnmark_from_the_bolsheviks_desc: "作為我們最北端和最東端的地區，如果[SOV.GetNameDef]認為欺凌[FIN.GetNonIdeologyName]還不夠的話，芬馬克郡將是明顯的切入點。"
 NOR_replace_laake: "撤換拉克"
 NOR_replace_laake_desc: "自任命以來，克里斯蒂安·拉克就一直是自由黨的工具人。他推動了大量削弱軍隊力量的措施，且似乎缺乏帶領挪威走向勝利的能力或意志。我們需要一個準備讓軍隊部署在[NOR.GetName]前線的領導人。"
 NOR_fde_intelligence_agency: "國防情報機構"
 NOR_fde_intelligence_agency_desc: "我們的士兵和軍官不能盲目衝向前線。他們需要了解將要面臨的敵人，並制定可迷惑敵人的作戰方案。這就是為什麼我們要在陸軍中建立一個情報部門，替士兵們操心這些麻煩事。"
 NOR_reform_the_army: "改革陸軍"
 NOR_reform_the_army_desc: "在克里斯蒂安·拉克和自由黨掌權下，數年的忽視已經讓陸軍只剩下了一副空殼子。我們必須重建我軍指揮層級、後勤系統、戰略戰術和行為準則，這樣我軍才可與可能面臨的現代陸軍一較高下。"
 NOR_improved_training: "改進訓練"
 NOR_improved_training_desc: "如果要把未經妥善訓練的人員送上戰場，我們還不如省略動員令，直接分發死亡證明。\n我們需要為新徵人員全面整改老舊的訓練項目，這樣我們才能更快更好地補充戰鬥力。"
 NOR_officers_academy: "軍官學校"
 NOR_officers_academy_desc: "優良的軍官可以倍增戰鬥力的效率，鑑於我國人口規模小，這將對於我國能否在外國襲擊下倖存至關重要。"
 NOR_offensive_doctrines: "進攻學說"
 NOR_offensive_doctrines_desc: "我軍的舊學說是依照我軍只需以逸待勞，坐等敵軍精疲力盡的假想設計的。這是我們的前輩所預想的，而這也會在我們未來敵人的預料之中，這就是我們必須開始轉向進攻型學說的原因。"
 #Historical
 NOR_continue_nygaardsvold_government: "延續尼高斯沃爾政府"
 NOR_continue_nygaardsvold_government_desc: "迄今為止，約翰·尼高斯沃爾領導的工黨政府履職得當，受人信賴。因此，我們應該繼續集中力量，暫且忽略南方鄰國緊張的政治局勢，努力帶領挪威經濟走出眼下的經濟危機。"
 NOR_weathering_the_storm_to_come: "黑雲壓城"
 NOR_weathering_the_storm_to_come_desc: "我們從前想過去改善國民福利，但如今周遭威脅不斷加劇，這一現實迫使我們得開始為即將席捲整個歐洲的風暴做好準備。什麼都無法守護的話，無論做出什麼事業來都是徒勞的。"
 NOR_broken_gun_policies: "斷槍政策"
 NOR_broken_gun_policies_desc: "為了避免在將來捲入任何衝突，我們必須證明自己只想保持中立，不準備入侵外國。只有這樣，大國強權才不會視我國為威脅，從而放過我國。我們相信，這個目標只能通過大規模去軍事化實現，不管[SWI.GetAdjective]和他們愚蠢的武裝中立論怎麼說。"
 NOR_leaving_the_hard_thirties_behind: "走出三十年代的磨難"
 NOR_leaving_the_hard_thirties_behind_desc: "數年來我們一直被大蕭條的餘波所困。沒有必要的工具和工業基礎，我們年輕的國家不可能迴歸穩定。是時候開始建設一個可供[ROOT.GetName]發展與興盛的基礎了。"
 NOR_cut_military_budget: "削減軍事預算"
 NOR_cut_military_budget_desc: "儘管世界似乎將要陷於戰火之中，但這不代表我們需要軍隊。明確的中立政策使我們得以轉移曾用於軍備與防衛的資源到促進[ROOT.GetName]平等與繁榮的目標上。"
 NOR_bail_out_towns: "城鎮援助"
 NOR_bail_out_towns_desc: "經濟危機打擊了許多[ROOT.GetName]小城鎮。它們正在承受永遠無法獨自克服的鉅額債務。我們有方法也有意願拯救這些社群並幫助它們回到通往繁榮的道路，所以讓我們動用這些方法吧。"
 NOR_restore_public_trust_in_the_storting: "恢復大議會公信"
 NOR_restore_public_trust_in_the_storting_desc: "幾十年的動盪和無為，一般大眾順理成章地不再信任我國議會。沒有公眾信任，我們就無力推動安邦興國的必要舉措。"
 NOR_the_neutrality_guard: "中立衛隊"
 NOR_the_neutrality_guard_desc: "他國可能利用我國的中立地位，乘我國尚未完善邊界防衛之機將我們拖入戰爭。一個專門的中立衛隊可確保交戰國無法踐踏我們的信任。"
 NOR_rearm_for_defense: "重整防禦"
 NOR_rearm_for_defense_desc: "我們可能錯判了局勢的危險程度。我們的海岸將無法阻擋強敵，亦不能盲目依賴我們的北歐鄰國可以當永遠的緩衝區。我們必須填補時間的空缺，重整[NOR.GetName]，準備自衛。"
 NOR_patrol_our_coast: "海岸巡邏"
 NOR_patrol_our_coast_desc: "我們的海岸前是廣闊的大海，而這一切都是入侵[NOR.GetAdjective]領土的可能路徑。我們當前的艦隊對於這些海域來說捉襟見肘。我們必須擴張海軍，這樣才能成功保衛這廣闊的區域。"
 NOR_social_incrementalism: "社會漸進主義"
 NOR_social_incrementalism_desc: "隨著三十年代的磨難已成為[NOR.GetAdjective]人民腦海中的記憶，我們必須開始推動社會進步，即便要因避免捅到保守主義的馬蜂窩而不得不放慢腳步。"
 NOR_print_more_money: "多多印錢"
 NOR_print_more_money_desc: "我們新興的金融系統尚未從三十年代磨難的緊縮政策中完全康復。我們必須利用各種手段避免情況惡化，包括印製更多現金供全國流通。"
 NOR_restart_public_investment: "重啟公共投資"
 NOR_restart_public_investment_desc: "現在不是忽視我國基礎設施與經濟並任其荒廢的時候，工黨政府必須再次為國家的未來下注至民事生產，或是為一場可能突如其來的戰爭做準備。"
 NOR_coastal_defense: "海岸防衛"
 NOR_coastal_defense_desc: "[NOR.GetName]有世界上最長的海岸線之一，因此沿岸築防將是一項令人骨軟筋麻的任務，但為了維持剛剛獲得的獨立，我們必須完成這項任務。"
 NOR_fortify_norway: "鞏固挪威"
 NOR_fortify_norway_desc: "我們已經忽視要塞太久了，我們必須組織施工隊儘快現代化改造乃至重建現有的要塞，並在有需要的地方新建要塞。"
 NOR_prepare_a_mobile_government: "籌備移動政府"
 NOR_prepare_a_mobile_government_desc: "戰爭已經打響，我國政府自然會成為目標。為了除掉我國領導人，征服[NOR.GetName]人民，敵人會使出千方百計。因此，做好讓關鍵政府部門遠離威脅的準備十分重要。"
 NOR_the_kings_no: "國王的拒絕"
 NOR_the_kings_no_desc: "我王哈康七世嚴詞拒絕了敵國侵犯我國主權的要求。[NOR.GetName]不是一個地點，而是一個民族；[NOR.GetAdjective]民族將繼續抗爭，直至收復一切故土。"
 NOR_prince_olavs_inspiration: "奧拉夫王儲的鼓舞"
 NOR_prince_olavs_inspiration_desc: "儘管時局艱難，[NOR.GetAdjective]人民依然相信他們的王儲。雖然沒有加入戰鬥，但他流亡時提供的支持對我們政府的正統性乃是無價之寶。"
 NOR_establish_milorg: "成立米洛格"
 NOR_establish_milorg_desc: "抵抗[NOR.GetName]佔領軍的活動依舊激烈，但缺乏組織與紀律。一個由流亡政府管理的、步調統一的軍事抵抗組織或許可以為我國政府迴歸[NOR.GetAdjective]土地奠定基礎。"
 NOR_approach_the_coordinating_committee: "接觸協調委員會"
 NOR_approach_the_coordinating_committee_desc: "鑑於我國領土被敵軍把控，我們需要一個能組織平民團體暗中抵抗佔領的地下組織。我們相信協調委員會的各類專家可以完成這項任務。"
 NOR_approach_kretsen: "同克雷斯滕接洽"
 NOR_approach_kretsen_desc: "有一些仍居住在淪陷區內的[NOR.GetAdjective]名流在戰前曾反對尼高斯沃爾政府，如今卻與我們有著共同的敵人。如果這些在格里默隆農場秘會的法官、官員、經理和商人能讓我們借用他們的影響力，他們就能為我國抵抗運動發揮至關重要的作用。"
 NOR_use_xu: "利用秘密臥底特工"
 NOR_use_xu_desc: "[NOR.GetName]佔領區內有一些有價值的信息。我們需要一個可以為抵抗運動戰士、盟友和在海外參戰的流亡軍提供情報的組織。"
 NOR_recruit_norwegian_refugees: "招募挪威難民"
 NOR_recruit_norwegian_refugees_desc: "成百上千的[NOR.GetAdjective]人正在逃離佔領區，以免被敵人壓迫。其中許多人是未撤離的保衛祖國的力量之一，另一些人則從抵抗組織學會了戰鬥，還有一些人雖然還不會，但是可以接受訓練。為了熬過這場戰爭，我們必須利用每個可用人力。"
 NOR_empower_sivorg: "賦權希沃格"
 NOR_empower_sivorg_desc: "鑑於克雷斯滕和協調委員會已經和我們聯手，是時候讓他們在同一旗幟下齊心協力了。希沃格將會成為接納各行各業平民在[NOR.GetName]策劃民事抵抗活動的組織。"
 NOR_preparing_the_return_to_norway: "準備迴歸挪威"
 NOR_preparing_the_return_to_norway_desc: "萬事俱備。有了在敵軍戰線後方翻江倒海的抵抗力量、佔領區高官的合作、訓練有素的流亡部隊和盟友的軍事支援，是時候回擊敵人，奪回[NOR.GetNonIdeologyName]了！"
 NOR_quislings_coup_happened: "吉斯林已經發動政變"
 #Fascist
 NOR_the_stumbling_storting: "大議會將傾"
 NOR_the_stumbling_storting_desc: "漫漫長夜，我們終於捕捉到了政局動盪這條隧道盡頭的些許曙光，但光芒未必是好的——閃爍的微光所指引的乃是不斷升級的混亂。約翰·尼高斯沃爾已經盡到了最大的努力，但大議會的內訌將卻越來越深地將我們陷入混亂的泥潭。"
 NOR_lurk_in_the_shadows: "深影隨行"
 NOR_lurk_in_the_shadows_desc: "大議會自掘墳墓給了我們可乘之機。議會的持續停轉正是我們號召[NOR.GetAdjective]人民加入全國集會黨，成為法西斯爪牙所需的託辭。"
 NOR_fascist_invasion_of_norway: "法西斯入侵挪威"
 NOR_fascist_invasion_of_norway_desc: "不可思議的事情發生了，我們以為離我們很遠的法西斯威脅已經出現在我們家門口，並已爆發擴散。我們只能希望我們能夠堅持足夠長的時間，直至援助的到來。"
 NOR_ask_for_foreign_support: "請求外國支援"
 NOR_ask_for_foreign_support_desc: "王國自古以來從未有過大規模的法西斯主義支持基礎，因此必須請求國外法西斯同袍的支援。在外國的干預下，我們可以為[NOR.GetName]指明一條通往泛日耳曼法西斯主義帝國之路。"
 NOR_approach_the_fatherland_league: "接觸祖國聯盟"
 NOR_approach_the_fatherland_league_desc: "多年以來，祖國聯盟一直在推動挪威的保守主義議程，但其缺乏吾等所擁之動力與決心。我們要向他們闡明雙方的相似之處以及齊心協力實現一脈相通的反共目標的願景。"
 NOR_cultivate_the_conservative_parties: "扶植保守黨派"
 NOR_cultivate_the_conservative_parties_desc: "儘管法西斯主義在[NOR.GetName]不受待見，但有許多保守主義團體覬覦著大議會席位。我們可以扶植他們，在其心中種下法西斯主義的種子，使其傾向我方，從而加強我們在[NOR.GetAdjective]政壇的影響力。"
 NOR_get_industrialist_support: "爭取實業家支持"
 NOR_get_industrialist_support_desc: "即使我國工業化水平十分落後，企業寡頭依舊在權力槓桿上舉足輕重。我們可以幫他們繼續坐大，只要他們願意支持我們。\n\n畢竟，資本唯一意識形態就是擴張資本。只要我們給足百分之三百的利潤，資本就敢於踐踏人間一切法律來為我們赴湯蹈火。"
 NOR_nasjonal_samling: "民族統一黨"
 NOR_nasjonal_samling_desc: "多年以來，[NOR.GetName]法西斯主義黨派的領頭羊一直被主流的中間派和左翼陣營排斥在外，而如今這一切都結束了。我們必須團結維德孔·吉斯林元首——那位既精幹十足又魅力四射的領袖——的身後，建立一個真正的[NOR.GetAdjective]法西斯政權。"
 NOR_the_secret_army: "秘密軍隊"
 NOR_the_secret_army_desc: "自1918年以降，一支獨立性極強的秘密軍隊長期隱蔽部署在[NOR.GetName]全國。一旦共產主義勢力興風作浪，有動搖國本之危，他們就會立即行動。儘管如此，其反共理念或可擰轉為對法西斯的支持；更重要的是，接管這支部隊之後，他們效忠的對象就變成我們了。"
 NOR_empower_hirden: "賦權黨屬衛隊"
 NOR_empower_hirden_desc: "黨屬衛隊是民族統一黨的準軍事組織，是黨部署下[NOR.GetName]未來的中堅力量。重點培養這支部隊，在將來奪權與作戰時意義非凡。"
 NOR_quislings_coup: "吉斯林政變"
 NOR_quislings_coup_desc: "民族統一黨那符合歷史發展潮流的崛起條件已然成熟。在維德孔·吉斯林元首的正確領導下，這將是我們完全控制[NOR.GetAdjective]領土，並最終擴展到整個斯堪的納維亞半島的初始要義。"
 NOR_required_prep_fascist_TT: "§Y對法西斯政變的總支持度§!高於$RIGHT|0Y$（當前支持度：$LEFT|0Y$）"
 NOR_quislings_regime: "吉斯林政權"
 NOR_quislings_regime_desc: "民族統一黨元首之舉止穩重有目共睹。儘管許多個人在政治及私人層面上看不起他，甚至他自己的內閣裡也時常發生這種事，但不可否認的是，他的固執和自信已經取得了成果。此人絕對有能力維持一個正常運轉的政權，但尚能多久？有待觀察。"
 NOR_get_rid_of_quisling: "踹開吉斯林"
 NOR_get_rid_of_quisling_desc: "吉斯林政變本就不是長久之計。從前如此行事，只是為了防範我們的法西斯盟友需要有人來給入侵披上合法的外衣，僅作權宜之計。現在，顯然，我們用不著這個自我意識過剩的小丑了，今早踹開了事。"
 NOR_elevate_hirden: "拔擢黨屬衛隊"
 NOR_elevate_hirden_desc: "黨屬衛隊，作為民族統一黨的準軍事部門，為我等貢獻良多。如今，黨領導下的法西斯政權正在蓬勃發展，我們應該考慮鞏固其在[NOR.GetAdjective]政府權力結構中的地位。"
 NOR_military_police: "憲兵隊"
 NOR_military_police_desc: "我們政權的反對派增加不少，亟需在其發酵前扼殺於萌芽狀態。在[NOR.GetName]民眾適應新秩序前，先進的軍事警察或為捍衛政權不被顛覆的唯一齣路。"
 NOR_extensive_recruitment: "廣泛徵兵"
 NOR_extensive_recruitment_desc: "帝國的擴張離不開在[NOR.GetAdjective]國內拔擢那些賡續諾斯先祖魂靈的戰士們。帝國當前，漁耕退避，有力氣幹活的人都應拿起武器，準備好與我們的敵人死抗到底。"
 NOR_the_weapons_of_conquest: "征服之戈"
 NOR_the_weapons_of_conquest_desc: "征服敵人需要的不僅僅是士兵和士兵的戰意。許多戰士將榮歸英靈殿，但生產戰爭的兵戈不僅能讓其在現世多多奮鬥，還意味著我國疆域進一步擴大之可能。"
 NOR_lynrytter: "馭雷悍馬"
 NOR_lynrytter_desc: "既然閃電戰已被證明是一種優秀戰術戰略，我們就必須予以接納，並駕駛我們的坦克碾過敵軍前線。我國裝甲為[NOR.GetNameDef]馭勝連連之時，奧丁本尊亦將與我等同在。"
 NOR_ulfhedhnar_wolf_coats: "狼皮勇士"
 NOR_ulfhedhnar_wolf_coats_desc: "這些新的狼戰士會像過去那支身披狼皮，保衛美髮王哈拉爾的狂戰士部隊一樣，成為戰士中的精英，帶領我們的部隊保衛和擴張我們的土地。"
 NOR_crackdown_on_civilian_life: "嚴打民生"
 NOR_crackdown_on_civilian_life_desc: "沒有躺平擺爛的時間了。戰爭已經到了眼前。新時代的戰爭是全面的戰爭，不循此道必將以我等滅亡與恥辱告終。為祖國大業計，區區民生又如何？"
 NOR_the_administrative_council: "行政理事會"
 NOR_the_administrative_council_desc: "誠然，[NOR.GetAdjective]佔領本可以變得更好，或許換個角度看就會起到奇效。與其直接統治，我們不如任命一個由當地合作者組成的委員會，讓民眾有一定的自治權。"
 NOR_abandoning_nynorsk: "放棄新挪威語"
 NOR_abandoning_nynorsk_desc: "儘管新挪威語看似沾點民族主義效果，但充其量不過是一種由許多農村落後地區和城市方言殘留物組成的混合語言。我們最好把重點放在大多數[NOR.GetAdjective]人已經會讀會寫的語言上，那些講少數民族語言的人只好去適應我等秩序吧。"
 NOR_pan_germanic_cooperation: "泛日耳曼合作"
 NOR_pan_germanic_cooperation_desc: "在文化上，[NOR.GetNonIdeologyName]屬於更廣闊的日耳曼世界，因此，與他們尋求更密切的合作具有相當大的意義。讓我們伸出援手，共同建立我們的帝國。"
 NOR_secret_police: "秘密警察"
 NOR_secret_police_desc: "現在是時候加緊對[NOR.GetAdjective]民眾的控制了。我們注意到存在一些小範圍的煽動。它們可能看起來微不足道，但有可能會在我們制定壓制的策略前，成為一個統一戰線。畢竟，保持刀刃鋒利的最好方法是經常使用它。"
 NOR_fascist_military_collaboration: "法西斯軍事合作"
 NOR_fascist_military_collaboration_desc: "國外的法西斯主義者幫助我們建立了目前的政權，而且幸運的是，我們現在能夠形成更緊密的，幾乎是平等的軍事合作。"
 NOR_frontkjempere: "前線戰士"
 NOR_frontkjempere_desc: "許多[NOR.GetAdjective]人渴望上前線，去幫助我們的解放者征服海外領土。雖然會有很多人犧牲，但這只是我們作為全球民族主義運動的一部分所付出的代價。誰知道呢，也許[NOR.GetName]會討好對方，讓對方相信自己能管好自己的地盤。"
 NOR_fascist_industrial_investments: "法西斯工業投資"
 NOR_fascist_industrial_investments_desc: "現代國家競爭需要先進的工業，我們的法西斯朋友擁有先進工業所需的知識和資本。我們可以利用這一點，成為更加有用的盟友。"
 NOR_norwegian_reichsprotectorate: "挪威保護國"
 NOR_norwegian_reichsprotectorate_desc: "多虧了我們取得的許多成功，[GetNorwegianFascistOverlord]認為[NOR.GetName]已準備好將我們的國家完全納入他們的帝國。這反映了他們的力量，以及我們對他們的尊重。我們將不惜一切代價滿足他們對權力和土地日益增長的渴望。"
 NOR_jonas_lie_coup: "約納斯·利政變"
 NOR_jonas_lie_coup_desc: "吉斯林的無能似乎無以復加。他在我們的政權成立之前，就已經造成了損害，他是我們指揮系統中最薄弱的一環。另一方面，我們也有約納斯·利這種角色，他從一開始就是[GetNorwegianFascistOverlord]佔領[ROOT.GetName]的有力支持者。在需要的時候，他是一個不可替代的統治代理人。他應該領導他的人民去追求我們盟友的目標。"
 NOR_bring_back_quisling: "邀回吉斯林"
 NOR_bring_back_quisling_desc: "許多人認為吉斯林是個愚蠢的小丑，但他的崛起透露出他所謂的失敗背後的狡猾計劃。需要讓這種人來掌舵，引導[NOR.GetName]進入新的富饒之地，就像古老的維京人一樣。"
 NOR_a_valuable_partner_to_germany: "[GetNorwegianFascistOverlord]的寶貴夥伴"
 NOR_a_valuable_partner_to_germany_desc: "國家的成功與[GetNorwegianFascistOverlord]的成功有著內在的聯繫。我們能幫他們做的越多，他們就會獎勵我們更多的戰利品。我們必須為自己指明道路，讓[NOR.GetNAme]成為不可或缺的夥伴。"
 NOR_invite_german_engineers: "邀請法西斯工程師"
 NOR_invite_german_engineers_desc: "[NOR.GetName]向來都不是工業強國。我等先輩比起自己搞生產，更注重去做貿易。這就是為什麼我們需要[GetNorwegianFascistOverlord]的幫助，以獲得趕超盟友，最主要是為了趕超敵人所需的知識。"
 NOR_the_kings_abdication: "國王退位"
 NOR_the_kings_abdication_desc: "在意識到侵略者那令人生畏的力量後，國王及其內侍已無可用之於民，亦無可取之於民。哈康七世國王罕見地公開宣佈，所有[NOR.GetAdjective]公民都要向那夥蜂擁而至的法西斯俯首稱臣。"
 NOR_reviving_the_norgesveldet: "復興挪威國"
 NOR_reviving_the_norgesveldet_desc: "曾經人們都害怕我們的祖先，祖先們掠奪並征服他們能看到並航行到的任何地方。我們必須回顧過去，找回這種精神。我們可能成為讓孩子們徹夜難眠的新一代維京威脅。"
 NOR_old_vinland: "舊文蘭"
 NOR_old_vinland_desc: "舊日的北歐探險家們不斷西進，終抵那富饒的文蘭之地，也即現今的紐芬蘭和拉布拉多。讓我們再次向西跋涉，征服本屬於我等的土地吧。"
 NOR_claims_on_scotland: "聲索蘇格蘭"
 NOR_claims_on_scotland_desc: "在蘇格蘭成為聯合王國的一部分之前，它只是我們先祖的後院。我們要從那些無力掩蓋它維京根源的手中奪回，然後再次漫遊在北不列顛的海岸和群山中。"
 NOR_claims_on_ireland: "聲索愛爾蘭"
 NOR_claims_on_ireland_desc: "北歐先祖曾在此間定居，併名之為都伊柏林（Duibhlinn）。在這個看似不起眼的地方，許多維京人曾在這片蓋爾部落的土地上繁衍生息，對他們掠奪，與他們融合。若我等用外交或軍事手段予以奪還，當地肯定是不會介意的。"
 ## Monarchist Path
 NOR_the_chamberlains_overture: "皇家內侍之諫"
 NOR_the_chamberlains_overture_desc: "在此大議會崩壞之際，貴族價值觀的典範、雅爾斯貝格封郡的第二順位繼承人、我們謙遜的哈康七世國王的大法官佩德·安克爾·韋德爾-亞爾斯貝格男爵提出我們應該以古為鑑。換句話說，王室或應掌控政府上下。"
 NOR_send_the_storting_home: "遣散大議會"
 NOR_send_the_storting_home_desc: "大議會早已奄奄一息，給它續命只會延長其痛苦，坦率地說，也會延長我們的痛苦。送那些政客們回家，與家人團聚吧，王的人馬會處理好他們留下來的爛攤子。"
 NOR_assure_the_population: "穩定民心"
 NOR_assure_the_population_desc: "[ROOT.GetName]似乎正在走向滅亡，但皇家大臣代表國王哈康七世希望民眾知道，君主制將會保持行穩的作風使這片土地恢復穩定。"
 NOR_demand_king_haakons_rise_to_power: "要求哈康國王掌權"
 NOR_demand_king_haakons_rise_to_power_desc: "由於韋德爾-雅爾斯貝格男爵振奮人心的演講，[NOR.GetName]民眾強烈要求一個意志堅強的君主制接管政府。唯一的問題是，哈康七世國王本人一直強調，國家應該由人民中產生的代表來治理。看來，我們還得給國王做一些說服工作。"
 NOR_the_crowns_executive_powers: "王冠裁決權"
 NOR_the_crowns_executive_powers_desc: "鑑於國王仍拒斥一切要求他行使絕對權力的請願，我們別無選擇，只能將裁決權授予他。在未來，當王上從政治上的沉眠中大夢初醒之時，他仍能保有引領[ROOT.GetNonIdeologyName]走向輝煌的手段。"
 NOR_a_warden_king: "守望之王"
 NOR_a_warden_king_desc: "無論是神授的還是議會授的領土，保護她是國王的責任，也是國王的特權。讓軍隊成為絕對王權的利劍，暫且躬耕於黑暗，直到國王選擇站起來，揮舞它。"
 NOR_the_kingdom_of_norway: "挪威王國"
 NOR_the_kingdom_of_norway_desc: "是時候了，無論哈康國王知情與否。讓我們剝去任何民主和人民統治的偽裝，讓君主制的鐵手套，將我們的敵人打得粉碎。如此國王將別無選擇，只能復辟。"
 NOR_appoint_prince_olav_to_army_staff: "奧拉夫王儲出任陸軍部"
 NOR_appoint_prince_olav_to_army_staff_desc: "既然王室已經加入了我們的計劃，我們需要利用起他們的技能，讓他們都參與到保衛王國的任務中來。如果我們指派奧拉夫王儲領導軍隊，我們能保證他可以充分發揮他的訓練才能和經驗，對付我們陸地上的敵人。"
 NOR_prince_olav_to_navy_staff: "奧拉夫王儲出任海軍部"
 NOR_prince_olav_to_navy_staff_desc: "儘管海軍一直在抵制我們的項目，但奧拉夫王儲對執掌王國海軍的想法仍保持開放的態度。畢竟，他曾在1928年奧運會上贏得帆船金牌，所有人都知道他與海浪有著不解的淵源。一旦王儲決意要領導我國海軍，可以想見我們的敵人最終都會被送去喂鮭魚。"
 NOR_promote_civilian_donations: "發動民間捐贈"
 NOR_promote_civilian_donations_desc: "就像古代的封建領地一樣，每個臣子都必須向他們的君主進獻貢品。當然，那種野蠻的時代已經一去不復返了，我們謙卑的君主制度比那更開明，所以這種進獻貢品在很大程度上是自願的。"
 NOR_research_funding: "資助研究"
 NOR_research_funding_desc: "我們高貴的[ROOT.GetAdjective]統治者致力於啟迪，因此他們樂於成為科學進步的贊助人，使我們的統治首先通過暴力，最終僅通過仁慈來擴張。"
 NOR_invite_cadillac_to_norway: "邀請凱迪拉克進入挪威"
 NOR_invite_cadillac_to_norway_desc: "許多年之後，面對凱迪拉克進駐挪威，奧拉夫王儲將會回想起，他得到一輛微型凱迪拉克的那個遙遠的嬰兒時代。如果我們邀請凱迪拉克加入[NOR.GetNameDef]，幫助我們開發和生產汽車，使得我軍實力遠超敵國，王儲本人一定會十分感激。願它能使王儲回憶起童年時代的快樂回憶。"
 NOR_enhance_coastal_defense: "強化海岸防衛"
 NOR_enhance_coastal_defense_desc: "我國蜿蜒綿長的海岸線是一把雙刃劍。一方面，它能讓我們的士兵在海洋裡茁壯成長，但另一方面，它也意味著敵人有了一個巨大的海軍入侵入口。"
 NOR_rule_the_northern_sea: "統治北海"
 NOR_rule_the_northern_sea_desc: "吾國當拓北海！艟艨鐵艦將是吾國伸向地平線的臂膀，為此要維持海軍基地以鞏固優勢，亦不可缺少能讓我們走的更遠的實踐和技術。"
 NOR_ramp_up_naval_production: "提速海軍生產"
 NOR_ramp_up_naval_production_desc: "儘管我們有著悠久的航海傳統，但目前的海軍力量與我們的野心並不匹配。我們必須不遺餘力地邁出第一步，建造船塢，為我們的王子和未來的國王奧拉夫的海軍提供燃料。"
 NOR_power_to_the_royal_guard: "賦權皇家衛隊"
 NOR_power_to_the_royal_guard_desc: "挪威國王衛隊，我們敬愛的國王的皇家衛隊，一直以來都是王國中訓練有素、戰鬥力最強的部隊。他們從國王和攝政王那裡汲取的靈感是顯而易見的，因此他們必須帶領我們的軍隊衝鋒陷陣，成為擊潰敵人的尖刀。"
 NOR_encourage_recruitment: "鼓勵應徵"
 NOR_encourage_recruitment_desc: "正如我們敬愛的內侍喜歡說的那樣，哈康國王活在我們心中，因此任何人都可以為他而戰，為他而死！讓他的精神鼓舞 [ROOT.GetNameDef] 中的每一個臣民，讓他們參軍為他們的君主而戰。"
 NOR_for_the_king_and_prince: "為了國王與王儲"
 NOR_for_the_king_and_prince_desc: "我們的國王哈康和他的兒子奧拉夫王儲激勵著每一個[NOR.GetAdjective]人。我們必須提醒我們的士兵，向前邁出的每一步、殺死的每一個敵人、流下的每一滴鮮血都不是徒勞的。這一切都是為了我們的王室、[NOR.GetName]的貴族以及他們所代表的一切。"
 NOR_the_kings_line: "國王防線"
 NOR_the_kings_line_desc: "我們王國邊境上的碉堡和碉堡是國王堅韌意志的具體體現。讓我們的戰士拋頭顱灑熱血，使國王的血脈延續，他的領土保持完整。"
 NOR_the_glucksburg_sea_wall: "格呂克斯堡海堤"
 NOR_the_glucksburg_sea_wall_desc: "亞爾斯貝格伯爵已經開始以我們光榮的國王哈康七世所屬的格呂克斯堡家族的名義修建海堤。它將代表王室的力量，抵禦我們的敵人，保護我們的峽灣和山脈不受傷害。"
 NOR_shield_of_the_north: "北境之盾"
 NOR_shield_of_the_north_desc: "劍不發鞘，不過寸鐵；盾不上臂，輒止片板。王室所要保護的不僅是[NOR.GetNameDef]，還包括其應負起責任列國諸土，縱使這未被法理所要求。"
 NOR_our_royal_claims: "王上的宣稱"
 NOR_our_royal_claims_desc: "[NOR_GetOurRoyalClaimsDesc]"
 NOR_our_royal_claims_desc_king: "能有這樣一位拒絕索取所有治外土地的國王是我們的榮幸。更幸運的是我們還有尊敬的佩德·安克爾·韋德爾-亞爾斯貝格伯爵願意為了將這些土地納入我們的疆域而盡一切努力推動這些主張。讓我們為國王的土地而戰！"
 NOR_our_royal_claims_desc_queen: "哈康七世國王已不幸離世，但我們必須牢記他留給我們的遺產，其中包括他在歐洲的眾多領土宣稱。幸運的是我們還有敬愛的瑪蒂爾德女王，她不僅有自己的領土宣稱，而且願意盡一切努力推動這些主張並將其納入我們的疆域。讓我們為皇家的土地而戰!"
 NOR_swedish_claims: "聲索瑞典領土"
 NOR_swedish_claims_desc: "[NOR_GetSwedishClaimsDesc]"
 NOR_swedish_claims_desc_mon: "我們的歷史和王室一直被迫與[SWE.GetNonIdeologyName]捆綁在一起。[SWE.GetAdjective]人在數世紀的糾纏中偷走了大片土地：耶姆特蘭、海里耶達倫和布胡斯蘭。無論此事應當歸咎於貝爾納多特家族、瓦薩家族、奧爾登堡家族還是其他哪個家族，我們都會報仇並奪回我們的土地。"
 NOR_swedish_claims_desc_fas: "斯堪的納維亞半島的君主制歷史悠久、錯綜複雜，但我們可以利用其來謀利。瑞典竊取了曾屬我國的零零圖，我們可以因著復仇的名義入侵[SWE.GetAdjective]，將本帝國發展到集[NOR.GetAdjective]歷史領土之大成之境。"
 NOR_claims_on_faroe_islands: "聲索法羅群島"
 NOR_claims_on_faroe_islands_desc: "[NOR_GetFaroeClaimsDesc]"
 NOR_claims_on_faroe_islands_desc_PAWJ: "由於[DEN.GetNonIdeologyName]和[SWE.GetNonIdeologyName]王室過去犯下的罪惡，我們被剝奪了法羅群島。該結束了。我們尊貴的內侍將付出鮮血確保群島的迴歸。"
 NOR_claims_on_faroe_islands_desc_ALT: "由於[DEN.GetNonIdeologyName]和[SWE.GetNonIdeologyName]王室過去犯下的罪惡，我們被剝奪了法羅群島。該結束了。我們正直的瑪蒂爾德一世女王將付出鮮血確保群島的迴歸。"
 NOR_eirik_raudes_land: "埃裡克·勞德斯領地"
 NOR_eirik_raudes_land_desc: "必須推翻海牙在1933年做出的荒謬決定。他們竟敢讓[DEN.GetName]擁有挪威人紅髮埃裡克早在千年前就發現的土地。就在幾年前，我們還擁有格陵蘭島東海岸的部分土地，但很快我們就會擁有它，甚至更多土地，當我們奪回屬於我們的土地時，紅髮埃裡克的傳奇將繼續下去。"
 NOR_iceland: "冰島"
 NOR_iceland_desc: "[NOR_GetIcelandClaimDesc]"
 NOR_iceland_desc_PAWJ: "卡爾馬聯盟解體後，冰島被不公正地從我們手中奪走了。儘管已經過去數個世紀，但我們仍未遺忘。在這一切得到糾正、冰島重歸挪威王國前，我們的內侍、國王和王儲不會安枕而臥。"
 NOR_iceland_desc_ALT: "卡爾馬聯盟解體後，冰島被不公正地從我們手中奪走了。儘管已經過去數個世紀，但我們仍未遺忘。在這一切得到糾正、冰島重歸挪威王國前，我們的女王、王儲和治下的人民不會安枕而臥。"
 NOR_bjarmeland: "比亞爾默蘭"
 NOR_bjarmeland_desc: "幾個世紀以來，[ROOT.GetAdjective]探險家們一直在拓展可能到達的邊界。比亞爾默蘭就是這樣一個例子，它最早由[NOR.GetAdjective]人探索過，但現在已經不在我們手裡了。我們必須再次出手，將這片土地奪回來。"
 NOR_claims_on_denmark: "聲索丹麥領土"
 NOR_claims_on_denmark_desc: "[NOR_GetDanishClaimsDesc]"
 NOR_claims_on_denmark_desc_mon: "丹麥或為我們敬愛的國王的故國，但我們心裡都有數，他真正的故國當為[NOR.GetNonIdeologyName]，甚至在他當選王位之前也是如此。無論如何，我們必須把他的故鄉納入他的王國，也許這會促使王上在本國的君主政體中發揮更積極的作用。"
 NOR_claims_on_denmark_desc_fasc: "[DEN.GetNonIdeologyName]的王曾經是我等主公，但現在什麼也不是。他們現在虛弱不堪，無足輕重，所以這片領土已然成為我等的囊中之物。以我等新賦強力，他們的軍隊就會像孩子手中的黃油酥餅一樣支離破碎！"
 NOR_consolidate_kingdom: "鞏固王國"
 NOR_consolidate_kingdom_desc: "[GetConsolidateKingdomDesc]"
 NOR_consolidate_kingdom_desc_PAWJ: "既然我們的皇家內侍、我們敬愛的哈康七世的左膀右臂、仁慈的侯爵佩德·安克爾·韋德爾-亞爾斯貝格已經擴大了我們的領土，我們必須向內鞏固我們的成果，用一種粉飾過的、穩健的、帶點嚴厲的方式統治我們的臣民。"
 NOR_consolidate_kingdom_desc_alt: "既然我們天命所歸的女王瑪蒂爾德一世，盡職盡責地管理著我們王冠下的廣大土地，我們必須向內鞏固我們的成果，用戴著天鵝絨手套的穩健手段統治我們的臣民。"
 ## The Rest
 NOR_start_rearmament: "開始重整軍備"
 NOR_start_rearmament_desc: "也許完全解除武裝並不如我們期望的那樣一定能避免戰爭。我們最好開始為一場潛在的進犯做準備。"
 NOR_kickstart_military_industry: "催生軍事工業"
 NOR_kickstart_military_industry_desc: "[ROOT.GetName]曾長期附屬於其他國家，因此從未發展出自有軍事工業。為了保護我們的自由，我們必須停止依賴其他國家供應國防用品，同時開始建造自己的戰爭機器。"
 NOR_build_supplies_network: "建設補給網絡"
 NOR_build_supplies_network_desc: "我國壯觀的山脈、湖泊與峽灣倍受世人稱羨，但補給運輸也因此更為艱難。我們需要自覺努力讓補給更快到達前線。"
 NOR_drobak_coastal_fort: "德勒巴克海岸要塞"
 NOR_drobak_coastal_fort_desc: "德勒巴克，具體來說是德勒巴克灣，可能是保衛我國首都的關鍵地點。說不定哪天一枚合適的魚雷就能拖延入侵行動夠久，讓我們得以做好回擊的準備。"
 NOR_modernize_fortifications: "要塞現代化"
 NOR_modernize_fortifications_desc: "有人說我們的要塞是“拿破崙時期”的，很明顯這不是在稱讚。我們的地堡可能已經過時，但我們敵人的武器可沒。現在花費精力和資源將我們的堡壘改進到當代標準，未來肯定會獲得回報。"
 NOR_artillery_development: "火炮開發"
 NOR_artillery_development_desc: "世界大戰證明了火炮的重要性。為了避免在面對敵人的彈雨時無能為力，我們不能再繼續落後下去了。"
 NOR_anti_air_support: "防空支援"
 NOR_anti_air_support_desc: "不管入侵者來自哪裡，他們都肯定會用飛機控制天空並轟炸我們的城市和軍隊。我們只有準備了防空措施才能抵消來自空中的打擊。"
 NOR_rikstanken: "王國坦克"
 NOR_rikstanken_desc: "悲劇的是，[ROOT.GetName]從未有過坦克。如果我們想有勝利的可能，裝甲是必不可少的。問題是我們應該怎麼做呢？採購大量坦克對於我國的體量來說過於昂貴了。也許我們可以先買一輛來試水？又或者我們可以用其他東西而非金錢換得坦克。"
 NOR_tank_procurement: "坦克採購"
 NOR_tank_procurement_desc: "我們的自主坦克項目明顯不足以應對20世紀的裝甲戰爭。好消息是許多有必需技術與產能的國家可能會出售他們的裝甲載具。這可能是讓[ROOT.GetAdjective]陸軍達到本世紀水平的捷徑。"
 NOR_norges_rikstanksfabrikk: "挪威國家坦克工廠"
 NOR_norges_rikstanksfabrikk_desc: "我們現已學得了裝甲戰爭的基礎，並準備發展自己的國家坦克製造項目，也就是國家坦克工廠。這是保證我國裝甲載具不中斷供應的唯一途徑。"
 NOR_improve_production_lines: "改進生產線"
 NOR_improve_production_lines_desc: "如果我們無法提供持續戰鬥所需的武器與裝備，光憑蠻勇對於保家衛國也是一無是處。現代戰爭的關鍵就是要有能用於反擊的彈藥，我們要確保彈藥的生產跟得上消耗。"
 NOR_the_royal_guards_battalion: "皇家衛隊營"
 NOR_the_royal_guards_battalion_desc: "王室衛隊作為我國最精英的戰鬥力量已經有一段時間了。我們可以擴編皇家衛隊並改進訓練技術，這樣他們就能成為我國武裝部隊的先鋒。"
 NOR_expand_Haeren: "擴大陸軍"
 NOR_expand_Haeren_desc: "我們現有的陸上力量和這片大陸上的其他陸軍對比相形見絀，[ROOT.GetName]一直都不是一個軍國主義國家。隨著全球戰爭的威脅增長，我們必須確保民眾已經準備好保衛我們年輕的國家。"
 NOR_improved_weapons: "改進武器"
 NOR_improved_weapons_desc: "我們的陸上力量使用的裝備處於慘不忍睹的狀況。這種規模的疏忽是無法接受的，甚至可能會讓我們失去獨立。我們必須在仍有餘力之時儘快扭轉這一趨勢。"
 NOR_building_an_independent_norway: "建設獨立的挪威"
 NOR_building_an_independent_norway_desc: "1905年開始，[ROOT.GetAdjective]才如現在一般，以獨立國家的形式存在，因此我們有許多國家建設工作要做，尤其是在對保障我國獨立至關重要的工業方面。"
 NOR_independent_norway_removal_tt: "如果[ROOT.GetNonIdeologyName]成為其他國家的附屬國，§Y$NOR_independent_norway_dmod$§!§R將被移除！§!"
 NOR_norwegian_school_of_economics: "挪威經濟院校"
 NOR_norwegian_school_of_economics_desc: "如果我們希望在世界經濟中建立自己的地位，就需要專業人士，而這需要時間來建設。建立一個挪威的商學院作為全國示範性經濟院校，這是讓我們的民生經濟以及隨後的軍事經濟繁榮的第一步。"
 NOR_hurtigruten: "“海達路德”"
 NOR_hurtigruten_desc: "無可置疑的是，[ROOT.GetNonIdeologyName]不僅異常狹長，還遍佈著崎嶇的地形。這種環境確實塑造了我們的國家認同，但也使得妥善修建基礎設施與鐵路成為不可能。作為替代，我們必須建立“海達路德”系統，即將人貨運送至[ROOT.GetAdjective]沿海各地的一系列渡輪。"
 NOR_norges_tekniske_hogskole: "挪威技術院校"
 NOR_norges_tekniske_hogskole_desc: "二十多年以來，位於特隆赫姆的挪威理工學院一直處於我國工程領域的前沿，但如果我們希望與我們的鄰國，甚至可能是我們的敵人競爭，就必須為技術教育提供更多資金。我們不能讓我們的產業界缺乏必要的專業人士。"
 NOR_empower_large_industrial_groups: "賦權大型工業團體"
 NOR_empower_large_industrial_groups_desc: "大規模的工業企業在建設和維護工廠方面有著良好的記錄，還負責生產普通[ROOT.GetAdjective]公民的日常必需品。很顯然，信任他們是[ROOT.GetNonIdeologyName]走向工業獨立的正確道路。"
 NOR_fund_local_construction: "資助地方建設"
 NOR_fund_local_construction_desc: "我們不能只讓首都和寥寥數個主要城市工業化。我們應該讓工業化進程儘可能均勻地覆蓋整個[ROOT.GetName]。因此，我們要投資小鎮和小型城市以刺激當地建設，從而豐富工業基礎並加強經濟穩健性。"
 NOR_aluminum_production: "鋁生產"
 NOR_aluminum_production_desc: "鋁的生產是一個能源密集型流程，雖然我們缺乏鋁土礦儲藏，但[ROOT.GetAdjective]的地形非常適合水電生產，這樣我們可以很容易地進口鋁土礦，並將其變成我們新生的軍事工業的寶貴資源。"
 NOR_build_the_northern_rail: "建造北方鐵路"
 NOR_build_the_northern_rail_desc: "我國的北部地區長期以來都被忽視。雖然地形使得基礎設施的建設成為了一項複雜的工作，但我們相信這一努力將在未來獲得回報。"
 NOR_complete_the_sourthern_railway_network: "完成南部鐵路網"
 NOR_complete_the_sourthern_railway_network_desc: "即使[ROOT.GetNonIdeologyName]的南部地區比北部地區要發達得多，但如果我們開始將其基礎設施與其他國家，甚至是鄰國的基礎設施相比較，顯然我們還有相當多的工作要做。"
 NOR_increase_research_funding: "提高科研資助"
 NOR_increase_research_funding_desc: "[ROOT.GetName]到目前為止從未成為過技術強國。如果我們希望趕上歐洲其他國家，我們必須投資新的研究，否則我們就要冒著過度依賴未來敵人的風險。"
 NOR_expand_norges_tekniske_hogskole: "擴建挪威技術院校"
 NOR_expand_norges_tekniske_hogskole_desc: "鑑於大規模衝突幾乎近在眼前，我們需要擴大我們的理工科院校的規模，以滿足日益複雜的戰爭的要求。"
 NOR_revamp_hydroelectric_capacity: "改進水電生產"
 NOR_revamp_hydroelectric_capacity_desc: "鋁對於製造飛機和其他戰爭工具至關重要，但將鋁土礦加工成鋁消耗的能源量過大，使其成為一個成本高昂的過程。幸運的是，[NOR.GetName]擁有完美的地形，我們的許多湖泊和河流可以建設水力發電大壩。這樣我們就能在鋁土礦藏不多的情況下生產所需的鋁材。"
 NOR_haerens_flyvevaaben: "陸軍航空隊"
 NOR_haerens_flyvevaaben_desc: "天空將是戰爭的新前線。如果我們讓敵人完全控制我們的空域，我們的地面部隊將無法有效行動。我們必須發展一支能夠支援我們地面部隊行動的空軍。"
 NOR_norwegian_planes: "挪威飛機"
 NOR_norwegian_planes_desc: "我們已經見識過，今天的盟友可能成為明天的侵略者，為此我們不能仰仗境外勢力來研發我們的飛機。畢竟，它們在現代戰場上的重要性太大。"
 NOR_foreign_plane_designs: "外國飛機設計"
 NOR_foreign_plane_designs_desc: "作為一個年輕且長期被忽視的國家，[ROOT.GetName]缺乏設計和製造現代戰爭所需的空中力量的基礎設施、專業知識和工具。我們必須轉向國際武器市場以供應[NOR.GetName]空軍的裝備。"
 NOR_anti_air_artillery_research: "防空火炮研究"
 NOR_anti_air_artillery_research_desc: "隨著全新的技術被部署在空中，我們必須確保那些從地面保衛我們空域的武器能夠與之匹配，這樣我們就不會在敵人的空中優勢下吃癟。"
 NOR_anti_air_construction: "防空建設"
 NOR_anti_air_construction_desc: "我國崎嶇的地形使得敵人若想入侵[NOR.GetName]將變得十分困難，但我們的天空卻暴露在敵人的飛機面前，這使它們成為潛在的外國入侵的優勢。我們必須建立必要的防空炮臺來防止這種情況。"
 NOR_invest_in_airfields: "投資機場"
 NOR_invest_in_airfields_desc: "如果我們沒有飛機起飛所需的基礎設施，那麼擁有飛機就沒有意義。空軍需求不斷擴大，而我們卻嚴重缺乏必要的基礎設施。"
 NOR_stavanger_airfield: "斯塔萬格機場"
 NOR_stavanger_airfield_desc: "斯塔萬格機場即將完工，其位置對於軍用機場來說堪稱完美。我們可以進行必要的調整，將這個民用機場作為一個軍用的空軍基地。"
 NOR_increase_air_production: "提高空軍生產"
 NOR_increase_air_production_desc: "[NOR.GetName]需要飛機，而且現在就需要！如果我們將全部的精力傾注到飛機生產上，那麼我們也許剛好能保護自己，並突破敵人的防禦。"
 NOR_buy_aa_from_sweden: "採購瑞典防空炮"
 NOR_buy_aa_from_sweden_desc: "東方鄰國[SWE.GetName]長期精於製造防空炮，實事求是地講，遠非我等所能望其項背。我們可以提出購買博福斯炮的請求，以便在即將到來的入侵中保衛我們的天空。"
 NOR_luftforsvaret: "$NOR_royal_air_force_dmod$"
 NOR_luftforsvaret_desc: "我國空中力量已經發展到了這樣的地步：不應僅作陸軍的輔助部隊而存在，而應成為獨立的兵種。空軍應擁有必要的資源，以有效的方式開展現代戰爭所需的一切行動。"
 NOR_radar_research: "雷達研究"
 NOR_radar_research_desc: "我國海岸線綿長，有效監控近海與灘頭至關重要。得益於雷達這一技術奇蹟，我們可以在長距離上提前探測到駛來的艦艇和飛機。"
 NOR_repurpose_lighthouses: "改造燈塔"
 NOR_repurpose_lighthouses_desc: "由於天氣和地質因素，[ROOT.GetAdjective]海岸各地缺不了燈塔，這也是我國獨具特色的靚麗風景。我們可以利用其作為雷達基站，幫助我們抵禦入侵者，使燈塔就此承載了希望。"
 NOR_pilot_training: "飛行員訓練"
 NOR_pilot_training_desc: "我國空軍剛剛起步，規模很小，發展欠佳，但仍能從我們可以從我們飛行員與探險家的民族精神與文化傳統中汲取靈感，激勵新一代[NOR.GetAdjective]飛行員，捍衛我國的獨立自主與長治久安。"
 NOR_the_royal_norwegian_navy: "$NOR_royal_navy_dmod$"
 NOR_the_royal_norwegian_navy_desc: "我國有世界上最長的海岸線之一，這固然有其優勢，但亦意味著需要付出更多的努力來捍衛之。我國海軍將是國防的第一道防線。"
 NOR_expand_the_dockyards: "擴建船塢"
 NOR_expand_the_dockyards_desc: "儘管我國擁有世界上最大的商船隊之一，但本土船塢的製造能力仍能提升，仍能優化，以便不僅勝任造貨船與造油輪那種簡單工序，亦能更適合於製造軍用艦艇。"
 NOR_battleship_focus: "重視戰列艦"
 NOR_battleship_focus_desc: "只有大艦巨炮才能保證我們真正統治海洋。海岸上望見的我軍戰艦在天際線的投影，會讓任何潛在的入侵者望而卻步。"
 NOR_kystvakten: "海岸監衛"
 NOR_kystvakten_desc: "我國海岸線蜿蜒曲折，十分漫長。為了保護之，我們需要大量艦船，如此才能看管好地地平線上的每一寸徒弟。我們應建立一個艦艇網絡，捍衛陸地免遭敵軍艦隻襲擊。"
 NOR_convert_merchant_ships: "徵用商船"
 NOR_convert_merchant_ships_desc: "商船是我國經濟的驕傲，但如果侵略者摧毀我們的土地，一切就都無所謂了。我國的航運巨頭必須為[ROOT.GetName]做出犧牲，把船交給我們，我們來武裝這些船隻。"
 NOR_expand_merchant_marine: "擴編商船隊"
 NOR_expand_merchant_marine_desc: "現代戰爭需要資源和裝備，而這些對於[ROOT.GetName]來說卻屬極缺。戰爭迫在眉睫，我們必須確保艦艇數量充足，保證我們生存所需要的物資運輸不受干擾。當然，我們確有超越大多數國家的民船數目，但預計戰時損耗亦為可觀——民船數量遭削這一損失，我們實在承受不起。"
 NOR_expand_naval_academy: "擴建海軍學院"
 NOR_expand_naval_academy_desc: "船多了，意味著領船參戰的軍官也要增加。多年以來，我國建成了許多海軍學院，但海軍擴張不可避免的意味著海軍軍官和水手也要擴編。"
 NOR_norwegian_carriers: "挪威航空母艦"
 NOR_norwegian_carriers_desc: "事實反覆可證，未來的戰爭很大程度上取決於制空權，陸上如此，海上亦然。航空母艦的意義就在於控制敵艦上方的天空，以天降正義之姿態迅速將其擊沉。"
 NOR_mine_laying_effort: "重視佈雷"
 NOR_mine_laying_effort_desc: "我國艦船不可能同時出現在所有戰略位置上，但水雷可以在人走燈滅之時持久捍衛沉默的水域，讓誤打誤撞進雷區的敵艦始終提心吊膽。我們需要更好的水雷，來克服迭代的水雷規避和失效技術。"
 NOR_submarine_fleet: "潛艇艦隊"
 NOR_submarine_fleet_desc: "潛艇，既高效又隱蔽，僅需一次攻擊、一枚魚雷就能扭轉海戰態勢。我們需要製造更多、更好的潛艇，以此最大限度地增加取勝機會。"
 NOR_naval_air_force: "海軍航空兵"
 NOR_naval_air_force_desc: "敵艦，有的因參與入侵[ROOT.GetName]而千瘡百孔，有的在和平的公海上慵懶無聊，這種境遇差別的關鍵就在我軍飛機。能主宰海域上空的，就能統治大海汪洋。"
 NOR_convoy_defense: "運輸船防衛"
 NOR_convoy_defense_desc: "商船隊乃我國之瑰寶，絕非食之無味、棄之不惜。我們需要加強商船隊護航工作，使其長久，如此使之在戰爭中發揮更大作用。"
 NOR_nortraship: "挪威航貿團"
 NOR_nortraship_desc: "戰爭將我們逐出了祖國，因而需要在同一面旗幟下整合我國航運能力。挪威航貿團能使我們身處遠方而投身復國大業，幫助盟國挺過更長的時間，幫助我們光復[ROOT.GetName]。"
 NOR_convoy_bombing: "運輸船轟炸"
 NOR_convoy_bombing_desc: "敵國商船隊規模越小，我們的大艦隊就能發揮更出色。破壞敵國航運，就有機會扭轉戰局。"
 NOR_rebuild_the_royal_navy: "重建皇家海軍"
 NOR_rebuild_the_royal_navy_desc: "故土遙遙，若要光復，海路是最可能的選擇。重建王室海軍，就是重建我們的祖國。"
 NOR_pan_germanic_entent: "泛日耳曼協約"
 NOR_emergency_conversions: "改裝商船"
 NOR_emergency_conversions_desc: "我們有一支龐大的商船隊，但由其獨自穿越危險海域將使之面臨巨大的風險。我們應該適當武裝部分船隻保護脆弱的航運。若有需要，我們也可以進一步改裝以用於更專業的任務。"
 NOR_emergency_conversions_tt: "解鎖§Y決議§!將§Y運輸船§!改裝為§Y驅逐艦§!"
