 NORDIC_research_tech_sharing_name: "北歐科研機構"
 ICE_expand_the_fishing_industry: "擴大漁業"
 ICE_expand_the_fishing_industry_desc: "捕魚一直是冰島人生活中重要的一部分。這是我們擁有的最主要也是最豐富的自然資源。因此我們應該集中精力在這一真正有開發潛力的領域精益求精。"
 ICE_mineral_prospecting: "礦產勘探"
 ICE_mineral_prospecting_desc: "理論上，群山中可能隱藏著自然資源。如果能開發這些自然資源，我們也許就能為冰島的主要產業提供除漁業與農業之外的另一個選擇。"
 ICE_international_trade: "國際貿易"
 ICE_international_trade_desc: "冰島需要在世界金融舞臺上更加活躍。通過擁抱自由貿易並打開國門接納外資，我們可以創造更多貿易機會，由此推動我們的經濟。"
 ICE_hydroelectric_power: "水力發電"
 ICE_hydroelectric_power_desc: "如果問這個國家還有什麼資源，那就是水了，具體來講，是河流與溫泉。進一步利用這些資源可以為我國的工業發展提供能源。"
 ICE_banking_on_the_future: "面向未來的銀行業"
 ICE_banking_on_the_future_desc: "銀行業是不需要海量資源的行業之一。我們需要做的就是吸引外資。通過補貼我們的銀行業，並盡我們所能讓冰島銀行更加吸引投資者，我們就能把這座島嶼建設成一個金融樞紐，只需幾年便可從中獲利。"
 ICE_infiltration: "滲透"
 ICE_infiltration_desc: "我們不斷延展的貿易網絡與逐漸融入他國的我國經濟，給予了我們在其他方面的機會。通過與遍佈全世界的關鍵人物與公司建立聯繫，冰島將處於獲取各式信息的絕佳位置。"
 ICE_develop_icelandic_shipping: "發展冰島造船業"
 ICE_develop_icelandic_shipping_desc: "我們在島上，島在大洋當中，無論誰來都會一門心思去搞造船業的。"
 ICE_heavy_industry: "重工業"
 ICE_heavy_industry_desc: "農業、漁業和船運已經是過去式了。為了加快我國邁入未來的腳步，我們需要重視重工業。雖然冰島常年霧鎖煙迷，但是擴建重工業將讓它擁有一個光明的未來。"
 ICE_advanced_technology: "先進技術"
 ICE_advanced_technology_desc: "我們的島太小了。它永遠無法與高度工業化的國家公平競爭。我們必須找到並專注於適合我們的產業——即相對新興、我們還沒遙遙落後的產業。先進技術與電子學就是這類我們可以賴以為生的產業。"
 ICE_reykjavik_dockyards: "雷克雅未克船塢"
 ICE_reykjavik_dockyards_desc: "我們首先要修建的就是大量現代化船塢。國家資金應當首先用於提高造船能力而非其他事項。"
 ICE_expand_the_harbour: "擴建港口"
 ICE_expand_the_harbour_desc: "更多更大的船隻正往返我島，這意味著我們需要更大的港口。國家應該資助擴建雷克雅未克港口，這樣我們才能進一步發展經濟。"
 ICE_local_arms_industry: "本地軍工產業"
 ICE_local_arms_industry_desc: "在本土生產軍備後，我們就能補給自己的軍隊或是在國際市場上出售，這就意味著我們不僅能加強自衛能力，也能促進經濟。因此，冰島軍工應成為我們的投資焦點。"
 ICE_infrastructure_development: "發展基建"
 ICE_infrastructure_development_desc: "現代化基礎設施，建立健全交通系統，我國高速公路將走向繁榮。"
 ICE_iceland_air: "冰島航空"
 ICE_iceland_air_desc: "在當代，寓居孤島並不意味著與世隔絕。現代航空業縮短了我們與歐美大陸的距離。空路即明日之航船。"
 ICE_allied_weapons_seller_trigger: "§Y同盟§!或§Y中立§!國家"
 ICE_expand_the_civilian_fleet: "擴張民船隊"
 ICE_expand_the_civilian_fleet_desc: "民船隊的強大有雙重好處，既能保持海軍傳統，又能為我國經濟降下福音。商船所承載的，在和平時期是一國之經濟，在戰時是一國之海軍水手。"
 ICE_industrial_research_school: "工業研究學院"
 ICE_industrial_research_school_desc: "這所大學乃是一個巨大的成功。國家需要在這一成功的基礎上，建設一個更有針對性的高等教育，目的也是為了工業發展。如此，我們就能確保獲得所需的工程師。"
 ICE_hrafninn_flygur: "渡鴉飛翔的時候"
 ICE_hrafninn_flygur_desc: "渡鴉翱翔天際，冰島之名將等同於航空工業與先進的飛行機技術——直抵全球。"
 ICE_agricultural_expansion: "擴張農業"
 ICE_agricultural_expansion_desc: "為了使冰島農業現代化，我們可以做很多改善工作。通過利用現代技術，以及容易獲得的天然溫泉加熱，我們可以提高農業產量，並將土地和勞動力解放出來用於其他用途。"
 ICE_off_shore_oil_drilling: "近海採油"
 ICE_off_shore_oil_drilling_desc: "石油越來越多地成為一種關鍵資源。今天的海軍正在消耗大量的石油。我們有理由相信，冰島周圍的海床可能有石油。這是一個高風險、高回報的選擇，但如果這種石油存在並能運輸到地表，那麼我們就值得據此展開調查勘探。"
 off_shore_drilling_tt: "解鎖在§Y冰島§!附近§Y開採石油§!的決議"
 ICE_the_kingdom_of_iceland: "冰島王國"
 ICE_the_kingdom_of_iceland_desc: "本國追索獨立自主已久，成立王國乃終抵自由之最後一步。如今，我們與丹麥共尊同一位國王，外交政策受其牽制。未來，這種聯繫將慢慢單薄，最終落到僅是一種形式的地步。"
 ICE_united_we_stand: "團結則存"
 ICE_united_we_stand_desc: "我等置身於世界大戰事外——丹麥恪守中立，冰島亦受失去所有市場準入而倍受影響。如今，丹麥正在重新武裝，而我們應準備好在必要之時予以幫助。這一次，冰島將在世界舞臺上大展拳腳。"
 ICE_declare_absolute_neutrality: "宣佈絕對中立"
 ICE_declare_absolute_neutrality_desc: "不管丹麥發生什麼，冰島都必須盡最大努力不捲入一場歐洲戰爭。通過宣佈絕對中立，我們將彰告天下，母島絕不會被拖入任何破事兒中。"
 ICE_declare_absolute_neutrality_tt: "如果§Y[ROOT.OVERLORD.GetNameDef]§!遭到入侵，§Y[ROOT.GetNameDef]§!將宣佈獨立。"
 ICE_joint_shipbuilding_programme: "聯合造船項目"
 ICE_joint_shipbuilding_programme_desc: "我們在幫助丹麥方面最好的選擇是通過海洋。我們可以共同保護北海。為了做到這一點，我們需要艦艇，因此共同努力建立一支艦隊是我們軍事合作戰略中的不言自明的步驟。"
 ICE_research_cooperation_tt: "聯合研究項目"
 ICE_overlord_research_cooperation_tt: "冰島聯合科研項目"
 ICE_royal_marines: "王室海軍陸戰隊"
 ICE_royal_marines_desc: "冰島軍隊的規模永遠不會很大。但我們可以專注於特定領域，對於一個島國來說，海軍陸戰隊是一個明顯的選擇。通過組建和訓練一支海軍陸戰隊，我們可以得到一支靈活的軍隊，可以根據需要在任何地方部署。"
 ICE_the_icelandic_police_force: "冰島警察力量"
 ICE_the_icelandic_police_force_desc: "冰島陸軍的規模永遠不會很大。但是作為一個替代選項，我們可以將抵禦入侵納入我國警察力量的職責。這樣我們就能更有效地運用有限的人力，同時更好地準備島嶼的防衛。"
 ICE_infrastructure_projects: "基建項目"
 ICE_infrastructure_projects_desc: "如果這個國家要變得強大，首先需要做的是建設基礎設施。良好的基礎設施是任何工業擴張的基礎。"
 ICE_engineering_projects: "工程項目"
 ICE_engineering_projects_desc: "如果冰島想要變得強大，就需要對本島進行開發。大型工程項目將會創造就業機會，併為冰島的工業增長打下基礎。"
 ICE_patrolling_the_atlantic: "大西洋護航"
 ICE_patrolling_the_atlantic_desc: "為了保護我們的商船艦隊，我們需要遠洋護航艦艇。我們應該與丹麥合作設計新的艦艇型號。"
 ICE_joint_military_training: "聯合軍事訓練"
 ICE_joint_military_training_desc: "我們在這個島上沒有足夠的經驗來適當地訓練現代戰爭所需的軍隊。因此，與丹麥合作對我們這樣一個小島來說是最好的方法。"
 ICE_industrial_cooperation: "工業合作"
 ICE_industrial_cooperation_desc: "邀請丹麥實業家在冰島開設子公司，並提供稅收豁免等優惠，可以在這裡創造就業機會。這也將給冰島的工業化發展帶來急需的刺激。藉助丹麥的幫助，我們可以推動這個國家向前發展。"
 ICE_gardhur_airfield: "加爾澤機場"
 ICE_gardhur_airfield_desc: "飛行器正在成為現代基礎設施的真正一部分。冰島絕不能落後。一個靠近首都的飛機場將是冰島邁向未來的關鍵。"
 ICE_the_merchant_fleet: "商船隊"
 ICE_the_merchant_fleet_desc: "船隻曾經是建立這個國家的核心成分。船隻在未來也將是其中的一部分。強大的商船隊將成為未來冰島經濟的核心。"
 ICE_not_standing_idly_by: "絕不袖手旁觀"
 ICE_not_standing_idly_by_desc: "無論我們喜愛與否，戰爭都在逐漸迫近。如果我們決心保衛島嶼，那麼我們必須將全國武裝起來。要麼戰鬥，要麼滅亡，這一點毋庸置疑。"
 ICE_expand_industrial_complexes: "擴建工業複合體"
 ICE_expand_industrial_complexes_desc: "我國軍事工業嚴重落後於其他歐陸勢力，如果我們不投入大量努力和資金用於擴建與補貼我國軍工機構，就其未充分發展與利用的現狀而言，我國工業或將永遠無法趕上。"
 ICE_political_unity: "政治統一"
 ICE_political_unity_desc: "危難時刻更需全國上下團結一致。我們必須放下政治分歧，盡一切努力讓[ROOT.GetName]遠離戰火。"
 ICE_anglo_icelandic_relations: "英冰關係"
 ICE_anglo_icelandic_relations_desc: "[ENG.GetNameDefCap]很可能是作為我們未來貿易伙伴的最佳選擇。無論如何，這都會嚴重損害我們的國家，並且與[ENG.GetAdjective]對抗可能是完全危險的。因此，我們必須盡力與隔海相望的鄰國保持良好關係。"
 ICE_anglo_icelandic_relations_tt: "如果§Y擴大漁業§!國策已完成："
 ICE_american_protection: "請求美國保護"
 ICE_american_protection_desc: "[GetAmericanProtectionText]"
 ICE_american_protection_desc_standard: "戰爭正在醞釀，而我國太弱小，無法獨善其身。[USA.GetNameDefCap]可以保護我們。我們應該同[USA.GetAdjective]政府進行接觸，向他們提出在當地駐軍以保護冰島。這將是我們在獨立道路上的一個退步，但這只是一個暫時的挫折。被入侵會更糟。"
 ICE_american_protection_desc_british_subject: "[ENG.GetNameDefCap]已經深陷這場戰爭的泥潭。如果敵對勢力決定入侵，他們可能無法保護我們免受其害。我們應該與[USA.GetAdjective]政府接洽，提出讓他們接管保護冰島的任務。"
 ICE_american_protection_tt: "§Y[ROOT.GetName]§!成為§Y[USA.GetNameDef]§!的傀儡國"
 ICE_fighting_as_equals: "比肩奮鬥"
 ICE_fighting_as_equals_desc: "我等比肩作戰，而冰島的能量遠超其力量。如今，丹麥應承認冰島不再是附屬國，而是共主聯邦中的平等成員。現在，是時候正式宣佈冰島是獨立國家了。"
 ICE_fighting_as_equals_tt: "§Y[ROOT.getName]§!宣佈獨立"
 ICE_expanding_the_university_of_reykjavik: "擴大雷克雅未克大學"
 ICE_expanding_the_university_of_reykjavik_desc: "知識就是鑰匙。一國要領先於世界，就需要集中力量辦大事。通過追加雷克雅未克大學經費，我們所要創造的是一個面向未來的發展平臺。"
 ICE_trade_relations: "貿易關係"
 ICE_trade_relations_desc: "一個小國是無法自給自足的。不過，通過與世界各國保持良好關係，並利用位於歐洲與北美中間這一戰略優勢後，冰島就能成為一個完美的金融與貿易樞紐。最大化利用這些聯繫應該可使我國更輕鬆地採購到急需的裝備。"
 ICE_keflavik_airbase: "凱夫拉維克空軍基地"
 ICE_keflavik_airbase_desc: "美國人想造個更大的空軍基地，這樣他們就能暢行無阻地巡視整個大西洋。我們應予以批准，因為這隻會使本國更加強大。"
 ICE_modernizing_the_island: "母島現代化"
 ICE_modernizing_the_island_desc: "新的理論需要實踐來檢驗，經濟需要改革。是時候推動變革了。"
 ICE_compensation: "應有之酬"
 ICE_compensation_desc: "我們已經向丹麥和世界證明，冰島已是個不可忽視的國家。無論最近還是幾個世紀也來，我們都盡到了應有的犧牲。坐落在大西洋上的冰島有能力保護丹麥王國的各個島嶼，如果相應責任能被轉交給我們，丹麥收穫的是一個更為強大的合作伙伴，並可更好地專注於保護其核心領土。"
 ICE_republicanism: "共和主義"
 ICE_republicanism_desc: "冰島用不著國王。攝政時代所證明的僅是沒有攝政時代的話，我們也能把事辦漂亮。如今，是時候取消這個中世紀的遺存，並著手籌建共和制的時候了。"
 ICE_american_investments: "美國投資"
 ICE_american_investments_desc: "讓數以千計的美軍駐紮在島上，這本身就對經濟有利。另外，這也意味著美國公司對設立子公司和投資冰島公司變得更加感興趣。總而言之，如果我們打好牌，當前情況對我們來說是非常有利的。"
 ICE_american_soldiers: "招待美軍大兵"
 ICE_american_soldiers_desc: "美國迫切希望將他們的影響力擴大到更遠的地方，以保護他們最珍視的價值觀。我們可以允許他們的士兵自由地在我們的土地上安家落戶，甚至一些人可以選擇入籍，服務建設我國自己的軍事力量。"
 ICE_iceland_defense_force: "冰島防衛軍"
 ICE_iceland_defense_force_desc: "在美國的幫助下，冰島可以建立一支現代化的軍隊。他們有知識、經驗和人力，可以訓練我們的部隊。與他們一起建立一支部隊有可能使我們的部隊成為真正的精英部隊。"
 ICE_state_owned_enterprises: "國有企業"
 ICE_state_owned_enterprises_desc: "現在，我們的島嶼可以更妥善地靠自己的力量支持自己，是時候開始考慮建立可以吸引工人和改善經濟的產業，同時國家機器的效率也要改良。"
 ICE_not_our_king: "他王非我"
 ICE_not_our_king_desc: "冰島王國——鬼話罷了。冰島用不著國王，尤其用不著丹麥佬。如今已是爭取冰島人支持之時，要大步邁進走向未來，就得同過去徹底決裂。"
 ICE_expand_the_industrial_base: "擴建工業基地"
 ICE_expand_the_industrial_base_desc: "通過減少我們對宗主國工業產品的依賴，我們可以擁有更強盛的工業，從而也可以擁有更強大的工人階級。沒有正確的工具，革命是不可能發生的。通過減少對宗主國的依賴，這個國家可以得到它需要的東西，包括自產武器來支持革命，當然還有聰敏的頭腦。"
 ICE_anti_capitalist_propaganda: "反資本主義宣傳"
 ICE_anti_capitalist_propaganda_desc: "資本主義給我們帶來了什麼呢？是的，它可能給國家帶來了些微的繁榮，但也導致了我國當前所深陷的危機。在過去我們過度依賴自由民主，以及宗主國只肯給我們一些殘羹剩飯的態度，我們應該很清楚未來必然要走其他的道路。"
 ICE_international_relations: "國際關係"
 ICE_international_relations_desc: "我們前進的道路將會艱難，這是肯定的。如果我們要孤軍奮戰，那將會更加困難。因此，我們需要尋找新的盟友。共產國際就是我們可以嘗試尋求新的聯盟的地方之一，但也有其他選擇。重要的是積極開拓新的領域，而這正是我們必須立即開始做的事情。"
 ICE_rally_the_workers_of_reykjavik: "動員雷克雅未克工人"
 ICE_rally_the_workers_of_reykjavik_desc: "冰島並沒有一支值得一提的軍隊，但首都的工人們肯定可以成為一支不可忽視的力量。如果工人們起來反抗這個體制，幾乎沒有什麼能夠阻止他們，因此贏得他們的支持就變得至關重要。"
 ICE_completion_break_with_the_crown_tt: "完成§Y$ICE_break_with_the_crown$§!國策時："
 ICE_prepare_for_the_revolution: "準備革命"
 ICE_prepare_for_the_revolution_desc: "一場成功的革命不會自己發生。它需要進行精心的規劃與準備。種子必須種植和澆水。人民需要知道何時起事，而革命者必須在他們站出來時引導他們。必須印製海報。招募和培訓職業的革命領袖，妥善存放武器，領導者必須作好掌控局勢的準備。"
 ICE_state_visits: "國事訪問"
 ICE_state_visits_desc: "不可否認，法西斯主導的國家目前正推動世界發生劇變。如果冰島要改變，也許可以從他們身上學到一些東西。我們應儘快建立正式關係，並立即探索任何合作的可能。"
 ICE_general_strike: "全面罷工"
 ICE_general_strike_desc: "讓我們向全世界，特別是我們那個惡毒的丹麥國王，展示冰島工人的團結和堅強。一次大罷工可以停止所有工業的運轉以及所有來往該島的航運，切實傷害傀儡政府，並向人們展示真正的力量所在。"
 ICE_general_strike_tt: "\n§Y全面罷工§!結束時："
 ICE_organize_a_march: "組織遊行"
 ICE_organize_a_march_desc: "人民已經被外國統治者奴役太久了。像反對羅馬的那次一樣，一場在首都的民族主義遊行將會提醒我們強盛的維京過往。如果我們能夠讓每一個熱愛自由的冰島人加入，我們可以向政府展示冰島人民是強大、豐富和團結的！共同努力，我們可以創造一個更美好的未來！"
 ICE_break_with_the_crown: "脫離聯統"
 ICE_break_with_the_crown_desc: "現在是與丹麥王室正式決裂的時候了。我們應該譴責丹麥國王及其腐朽的內閣，宣佈冰島再次成為一個獨立的國家，有權自由地追隨自己的夢想和選擇實現願望的道路。"
 ICE_break_with_the_crown_tt: "[ROOT.GetNameDefCap]獨立。"
 ICE_break_with_the_crown_workers_tt: "國策§Y$ICE_rally_the_workers_of_reykjavik$§!完成時："
 ICE_break_with_the_crown_revolution_tt: "國策§Y$ICE_prepare_for_the_revolution$§!完成時："
 ICE_embrace_the_workers_revolution: "走向工人革命"
 ICE_embrace_the_workers_revolution_desc: "工人的支持使這一變革成為可能。因此，工團、工會和工人在新生國家的領導層佔據一席之地是理所當然的。工人革命的領袖可以引領國家走向新的高度，給我們帶來比任何君主都更大的進步。"
 ICE_remove_dissent_in_the_working_class_tt: "將會移除§Y$ICE_dissent_in_the_working_class$§!"
 ICE_state_corporatism: "國家社團主義"
 ICE_state_corporatism_desc: "現在我們已經擺脫了虛弱的丹麥統治的最後殘餘，是時候建立一個新的國家了。確保我們國家的安全最好的方法是團結在一個強大的領導者後面，工會領導人、工業巨頭和政黨齊心協力為所有冰島人的共同利益而努力。國家將支持工業家們，而他們將回報支持國家。"
 ICE_international_brigades: "國際縱隊"
 ICE_international_brigades_desc: "儘管在這裡已經取得了勝利，但反對壓迫的鬥爭必須繼續進行。否則，我們的勝利可能只是暫時的。[ROOT.GetName]的子女們必須準備好在任何需要的地方提供援助，而國家必須盡最大努力支持他們，這可以通過頒佈必要的新法規，並提供所需的武器和裝備。"
 ICE_state_owned_industry: "國有產業"
 ICE_state_owned_industry_desc: "一個像[ROOT.GetNameDef]這樣的小國不能依賴資本家來生產所需的商品。為了效率最大化，並確保生產最需要的商品，國家需要介入並控制工業。國家不再依賴外國投資來生存。冰島國家將照顧其公民和武裝部隊。"
 ICE_organize_the_greyshirts: "組織灰衫軍"
 ICE_organize_the_greyshirts_desc: "從青年中訓練出一支裝備精良的民兵，有助於培育年輕人，使他們適應我們的新世界。除此之外，半軍事化訓練也會增強軍隊的實力，將在收回我國領土時證明自己的價值。"
 ICE_research_cooperation: "研究合作"
 ICE_research_cooperation_desc: "通過與我們結盟的大國合作，我們可以更好地發展技術，從而在未來的武器方面獲得優勢。我們可以向我們尊敬的合作伙伴學習，同時提供良好而隱蔽的測試場地，遠離窺探的眼睛。"
 ICE_infiltrating_the_british_isles: "滲透不列顛群島"
 ICE_infiltrating_the_british_isles_desc: "如果革命的火焰未被扼殺並隨後熄滅，那麼它必須傳播開來。明顯的下一個解放目標是不列顛諸島的受壓迫工人。[ROOT.GetNameDefCap]將幫助受壓迫地區的工人們起來反抗他們的帝國主義和資本主義的統治者。攜手合作，我們可以將革命的理想化為普通工人的現實。"
 ICE_infiltrating_the_british_isles_tt: "解鎖在威爾士、蘇格蘭和北愛爾蘭發動共產主義起義的§Y決議§!。"
 ICE_transformation_of_nature: "改造大自然"
 ICE_transformation_of_nature_desc: "電力是工業化的關鍵。冰島的自然環境需要像公民一樣為國家服務。河流和瀑布可以變成水壩，石頭可以開採，溫泉可以用來取暖。任何事情都不能阻止我們前進。"
 ICE_the_viking_spirit: "維京之魂"
 ICE_the_viking_spirit_desc: "古代的維京人總是與無畏和死亡聯繫在一起。他們橫渡大洋，踏上未知的征程，只有強者才能夠獲勝。今日的冰島人必須是無畏和勇敢的，因為我國唯有通過膽量和勇氣才能超越曾經，再度統治北海。"
 ICE_viking_spirit_tt: "解鎖§Y改進維京之魂§!的決議"
 ICE_recruiting_international_workers: "徵募國際工人"
 ICE_recruiting_international_workers_desc: "通過將我們的國家變成共產主義者和社會主義者的榜樣，並保持革命的火焰一如既往地燃燒，我們可以像蘇聯早期一樣吸引國際革命者。我們需要向工人和革命戰士表明，無論他們來自哪裡，[ROOT.GetName]都是他們歸屬的火炬。"
 ICE_international_research_community: "國際研究共同體"
 ICE_international_research_community_desc: "無論是通過共產國際，還是通過與世界各國的其他合作項目，都可以從其他人身上學到很多。通過與國際社會的接觸，[ROOT.GetName]將創造新的輝煌。集體主義是一條真正的進步之路！"
 ICE_international_research_community_tt: "所有未加入陣營或與[ROOT.GetName]處於同一陣營的共產主義國家："
 ICE_reclaiming_the_empire: "再造帝國"
 ICE_reclaiming_the_empire_desc: "格陵蘭曾經被來自冰島的維京人殖民。儘管挪威和丹麥對該島嶼沒有真正的權利，但他們之間一直為此爭吵不休。現在是時候要求將格陵蘭歸還給其合法的所有者了。如果他們真正重視自己的文化遺產和歷史，他們將無條件地將其割讓給我們。讓我們繼續走向輝煌的道路！"
 ICE_securing_the_north_sea_passage: "保護北海航路"
 ICE_securing_the_north_sea_passage_desc: "是時候奪回應該屬於冰島的財產了。北海的設得蘭群島和法羅群島是控制來往[ROOT.GetNameDef]航路的關鍵。"
 ICE_vinland: "文蘭"
 ICE_vinland_desc: "北大西洋帝國的理念緊隨萊夫·埃裡克松首次發現美洲而生，他本人也是冰島人的後代。令人惋惜的是，維京人的殖民地文蘭最終滅亡，但如今正我們重拾往昔舊夢之時。為了奧丁！"
 ICE_the_armed_forces_of_iceland: "冰島武裝部隊"
 ICE_the_armed_forces_of_iceland_desc: "冰島必須在戰爭降臨之時具備自衛能力，我們必須從零開始建立一支抵禦任何入侵者的軍隊。冰島人口稀少，但地理位置和麵積本身就是個優勢，畢竟敵人面對這種環境無法投入大規模兵力展開入侵。"
 ICE_an_airbase_in_the_sea: "海洋中的機場"
 ICE_an_airbase_in_the_sea_desc: "我們可以通過控制島嶼領空及周圍海域來確保敵方無法登陸。就算真的被登陸了，我國空軍也能確保敵軍缺乏必要補給。因此，要建設冰島武裝部隊，自然就需要建設一支現代化的空軍。"
 ICE_a_naval_hub_in_the_atlantic: "大西洋海軍樞紐"
 ICE_a_naval_hub_in_the_atlantic_desc: "冰島是個島——也就是說，由艦隊來充當武裝部隊主力合情合理。艦隊可以阻止敵軍到達我們的海岸，可以支持我們的盟友統治海洋，可以遣送遠征軍到任何戰場。建設一支強大的海軍，是為冰島的不二之選。"
 ICE_mine_iceland: "冰島佈雷"
 ICE_mine_iceland_desc: "就海運航道而言，除了北方以外，冰島在所有方向上都嚴重暴露在外。為了確保島上人民的安全，我們必須準備在開戰時廣泛佈設水雷以保護冰島的海域。"
 ICE_flying_boats: "飛船改造"
 ICE_flying_boats_desc: "如果我們在水中無法與敵人匹敵，那我們就會求助於下一個最好的選擇，即天空。因為如果我們控制了天空，我們的敵人就不會再需要他們的船隻了，因為它們將在一瞬間被擊沉。"
 ICE_modernizing_the_coast_guard: "現代化海岸警備隊"
 ICE_modernizing_the_coast_guard_desc: "冰島的海岸警衛隊一直是我們用於維護內外安全的主要力量。因此，我們應確保他們能夠跟上日新月異的現代化和技術換代。"
 ICE_low_cost_aircrafts: "低成本飛機"
 ICE_low_cost_aircrafts_desc: "我們所缺乏的是一個龐大的產業，但我們擁有一些精心篩選的專家，知道如何優化飛機的製備。我們應該利用他們的才能，這樣即使面對我們經濟薄弱的現實，我們也能在空中軍備競賽中跟上步伐。"
 ICE_support_equipment: "支援裝備"
 ICE_support_equipment_desc: "軍隊中的每個作戰單元，以及防暴警察都可以使用更重型的軍火，還可以配備適當的急救包和壓制性武器。因此，我們應儘快確保投資於這方面。"
 ICE_emergency_conversions: "緊急轉換"
 ICE_emergency_conversions_desc: "儘管這個國家並沒有建造重型艦艇的能力，但我們確實擁有大量的漁船、商船和私營企業船隻。在緊急情況下，我們可以在這些船隻上安裝機槍或輕型火炮，迅速高效地組建起足夠龐大的海軍力量，與大多數競爭者一較高下。"
 ICE_emergency_conversions_tt: "解鎖將§Y運輸船§!改裝為§Y驅逐艦§!或§Y巡洋艦§!的§Y決議§!"
 ICE_enact_conscription: "兵役"
 ICE_enact_conscription_desc: "鑑於我國前途渺茫，國防便成為了首要事項。為了彌補我國幾乎不存在武裝力量的現狀，我們要頒佈對所有青年的強制徵召令。"
 ICE_a_profesional_army: "陸軍專業化"
 ICE_a_profesional_army_desc: "我國陸軍目前過於弱小，無法妥善地防衛本島。解決這個問題的唯一方法就是確保我國陸軍只包含最精銳的、將戰至最後一刻的士兵。"
 ICE_thungur_hnifur: "重擊尖刀"
 ICE_thungur_hnifur_desc: "冰島陸軍從來都談不上大。為了彌補這一點，我們必須確保部隊訓練精上加精，集中全軍之力——如此一來，不擊則已，一擊驚人。"
 ICE_thungur_hnifur_idea: "精英部隊"
 ICE_civilian_war_duty: "民間防衛"
 ICE_civilian_war_duty_desc: "讓我國平民知曉當戰火或危機來到家鄉時該如何應對至關重要，這樣每個平民都能做好在危難之時履行其職責的準備，例如協助後勤、救火和物資分配。"
 ICE_doctrinal_studies: "學說研究"
 ICE_doctrinal_studies_desc: "兵法並非易事，更不是每個國家都能掌握的。我們需要研究全球的各個強國，並學習他們如何發動戰爭。"
 ICE_death_from_above: "死亡天降"
 ICE_death_from_above_desc: "如果我們贏得空中戰爭，我們就贏得了戰爭，而且我們很快就能贏得了勝利。如果我們加強空軍和陸軍部門之間的合作，並訓練特殊的傘兵射擊團，隨時準備儘可能摧毀敵人的補給線，那麼勝利的速度甚至會更快。"
 ICE_we_shall_defend_our_island: "我們將保衛我們的本土"
 ICE_we_shall_defend_our_island_desc: "我們的島嶼就是我們的家，沒有人比我們更瞭解它。通過使我軍專門從事山地作戰，我們可以從海岸撤軍，一旦敵人登陸並開始感到自信又得意，我們就可以立即消滅他們。"
 ICE_taking_the_fight_to_our_enemies: "引火焚敵"
 ICE_taking_the_fight_to_our_enemies_desc: "海洋包圍著我們，幾個世紀以來，大海塑造了我們的人民和我們的身份。通過利用我們從中獲得的知識，我們可以在敵人最不注意的地方與他們作戰。"
 #### DENMARK ####
 #Economical/Industrial Branch
 DEN_kanslergadeforliget: "延續《宰相大街協定》"
 DEN_kanslergadeforliget_desc: "由於失業率的飆升和農業部門的失敗，大蕭條仍然充斥於[ROOT.GetName]。我們需要跨越黨派的界限，就如何應對我們所處的危機達成共同協議。"
 DEN_devalue_the_krone: "貶值克朗"
 DEN_devalue_the_krone_desc: "通過貶值克朗，我們的農產品將在國際市場上更具競爭力，增加出口機會，這反過來將挽救苦苦掙扎的農民。"
 DEN_remove_economic_crisis_in_730_days_tt: "§Y$DEN_economic_crisis_dynamic_modifier$§!將在730天后移除"
 war_will_cancel_deal_tt: "§Y國家之間的戰爭將撕毀該協議§!"
 DEN_effects_after_fortify_our_borders_tt: "已經完成§Y$DEN_fortify_our_borders$§!國策："
 DEN_trade_with_britain: "對英貿易"
 DEN_trade_with_britain_desc: "[ENG.GetNameDefCap]歷來是我們最大的農產品出口市場，但在大蕭條之後，這種貿易幾乎停止了。隨著克朗的貶值，是時候聯繫英國人以嘗試重建我們從前的貿易聯繫了。"
 DEN_trade_with_germany: "對德貿易"
 DEN_trade_with_germany_desc: "[GER.GetNameDefCap]歷史上進口了我們大量的農產品，即使是世界大戰也沒有阻止這一點。但在過去幾年裡，兩國之間的貿易有所減少。也許是時候扭轉這一趨勢了！"
 DEN_agricultural_subsidies: "農業補貼"
 DEN_agricultural_subsidies_desc: "我們的農民一直在與債務危機和喪失抵押品贖回權作鬥爭。他們的無助和憤怒已經醞釀了很久，如果不加以控制，可能會發展成更危險的事情。我們必須解決這種情況，並盡我們所能地幫助農業部門。"
 DEN_industrial_investments: "工業投資"
 DEN_industrial_investments_desc: "城市中心也未能倖免於過去幾年的動盪。失業率飆升，企業要麼瀕臨破產，要麼徹底破產。我們可以為工業領域提供有針對性的一攬子援助，以穩定局勢。"
 DEN_support_schleswigian_farmers: "支持石勒蘇益格農民"
 DEN_support_schleswigian_farmers_desc: "在南日德蘭半島，邊緣群體的活動出現了日益增長的趨勢，這主要是由於緊張的經濟形勢，以及對集體身份認同的摩擦導致的；他們算德國人還是丹麥人？通過加強該地區的經濟刺激，我們或許能夠緩解一部分不滿情緒。"
 DEN_public_works: "公共建設"
 DEN_public_works_desc: "通過實施公共工程計劃，我們不僅可以通過修建橋梁來連接我們的島嶼，改善我們國家的基礎設施，還可以啟動新的住房項目的建設，降低仍然居於高位的失業率。"
 DEN_fortify_our_borders: "鞏固我國邊防"
 DEN_fortify_our_borders_desc: "歐洲各地的緊張局勢正在再次上升。雖然我們平安度過了世界大戰，但不能保證這種情況會再次發生。我們必須為最壞的情況做準備，同時希望得到最好的結果。捍衛我們的邊界和我們的獨立是我們的首要任務！"
 DEN_build_a_modern_dannevirke: "修建現代化丹麥土建工事"
 DEN_build_a_modern_dannevirke_desc: "丹麥人幾個世紀以來一直面向歐洲大陸建造重型防禦工事，其中最著名的是丹麥土建工事。隨著[GER.GetNameDef]再次武裝自己，並在我們周邊的數個大國激起動盪局勢，我們必須建造一座現代化的土建工事來保護我們的邊境。"
 DEN_unlocks_fortification_efforts: "解鎖決議：§Y重視要塞§!\n\n"
 DEN_refortify_tunestillingen: "重新修繕圖內斯蒂林根防線"
 DEN_refortify_tunestillingen_desc: "上一次歐洲被戰爭吞噬時，我們建造了圖內斯蒂林根防線來進行備戰防禦——這條防線由一系列保護哥本哈根港口的防禦工事組成。這些工事後來都年久失修，但通過對其進行重建和現代化改造，我們能夠保證首都的安全。"
 DEN_secure_our_supply_lines: "確保補給線"
 DEN_secure_our_supply_lines_desc: "任何一支軍隊都要靠吃飽肚子才能前進——這在今天和幾千年前一樣真實。值得慶幸的是，我們是一個主要的糧食生產國，只要對我們的後勤保障進行一些改進，我們就能保證對部隊的穩定補給。"
 DEN_fortify_the_islands: "鞏固群島"
 DEN_fortify_the_islands_desc: "整個丹麥東部位於數百個島嶼上，而我們的海軍還不足以保護它們免受鄰國更大規模艦隊的攻擊。通過在關鍵地點建造沿海防禦工事，我們也許能夠擊退潛在的入侵者。"
 DEN_unlocks_coastal_fortification_efforts: "解鎖決議：§Y重視海岸要塞§!\n\n"
 DEN_connect_the_islands: "連通群島"
 DEN_connect_the_islands_desc: "[ROOT.GetNameDefCap]由眾多島嶼組成，連接我們與大陸的唯一地點是日德蘭半島南部。為了促進全國各地的旅行，尤其是島嶼之間的旅行，我們必須建立橋梁，將我們更加緊密地聯繫在一起。"
 DEN_expand_institut_for_teoretisk_fysik: "擴建理論物理研究所"
 DEN_expand_institut_for_teoretisk_fysik_desc: "哥本哈根大學的理論物理研究所是世界領先的物理學研究機構，由理論物理學家尼爾斯·玻爾創建。通過資助該機構並對其設施進行擴建，我們可以獲得其回報，甚至有可能招募尼爾斯·玻爾本人加入我們的事業……"
 DEN_aalborg_portland_cement_plant: "奧爾堡·波特蘭水泥廠"
 DEN_aalborg_portland_cement_plant_desc: "丹麥的大陸部分自然資源貧乏，但水泥生產是我們擁有的一項資產。通過擴大奧爾堡·波特蘭水泥廠，我們能夠保障國內的建設能力。"
 DEN_improve_aalborg_portland_tt: "這將改善工業企業§Y$DEN_aalborg_portland$§!\n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$：§G+10.00%§!\n\n"
 DEN_expand_the_industries: "發展我國工業"
 DEN_expand_the_industries_desc: "丹麥傳統上依賴農業，這仍然是我們最大的出口產業。如果我們能夠實現產業多樣化並擴建其他行業，我們將會加強整體經濟，並使丹麥社會更能夠應對突發變化。"
 DEN_develop_remote_islands: "解鎖決議：§Y開發島嶼§!\n\n"
 DEN_support_the_faroes_industries: "支持法羅群島工業"
 DEN_support_the_faroes_industries_desc: "在我們所處的這個風雲變幻的時期，扶持位於法羅群島上的少數產業可能會是明智的決策，這將使我們對這個處於戰略位置的群島的主張不可否認。"
 DEN_support_bornholms_industries: "支持博恩霍爾姆工業"
 DEN_support_bornholms_industries_desc: "儘管博恩霍爾姆島缺乏重要的自然資源，但在其少數產業上投資仍然可能被視作一個好主意，順便提醒我們的所有鄰居，這是誰的島嶼。"
 DEN_develop_greenland: "開發格陵蘭"
 DEN_develop_greenland_desc: "丹麥本土幾乎沒有什麼我們可以在國內生產的過程中開發和利用的自然資源。另一方面，我們在格陵蘭島擁有的資源要豐富得多，如果我們投資並開發格陵蘭島，我們將能夠獲得好處。"
 DEN_expand_the_ivittuut_mine: "擴建伊維圖特礦業"
 DEN_expand_the_ivittuut_mine_desc: "伊維圖特礦山是我們唯一的鋁資源，鋁是現代飛機生產中至關重要的組成部分。通過擴建這個礦山，我們可以增加國內飛機生產或將鋁出口到其他國家。"
 DEN_prospecting_new_sites: "勘探新址"
 DEN_prospecting_new_sites_desc: "加爾蘇拉蘇克鎮的舊礦已經耗盡，但丘利薩特地區還有其他礦床。在這裡開採新礦不僅對格陵蘭的工業有很大好處，也能滿足我們國內的需求。"
 DEN_protect_greenland: "保衛格陵蘭"
 DEN_protect_greenland_desc: "格陵蘭島長久以來一直是我們領土的一部分，對該島嶼的主權聲索可以追溯到維京時代。失去這個島嶼將是一場全國性的災難，也將喪失巨大的聲望。為了阻止對該島嶼的任何潛在攻擊，我們需要加強其防禦力量。"
 DEN_danske_stalvalsevaerket: "丹麥煉鋼廠"
 DEN_danske_stalvalsevaerket_desc: "來自工業部門的幾位代表一直呼籲增加鋼鐵產量。如果我們建立一個新的鋼鐵廠，它將對經濟起到推動作用，並使我們在鋼鐵生產方面更加自給自足。"
 DEN_reorient_production_lines: "調整生產方向"
 DEN_reorient_production_lines_desc: "我們發現自己處於一個非常不穩定的世界局勢之中，很可能很快就需要更多的軍事裝備。為了滿足對軍事武器日益增長的需求，我們需要將民用工廠轉換為軍事裝備生產。"
 DEN_strengthen_military_industries: "強化軍工產業"
 DEN_strengthen_military_industries_desc: "從超前規劃的角度來看，投資一個有活力的軍事裝備產業可能是至關重要的。我們需要確保，當我們發現自己需要拿起武器來保護我們人民的時候，我們已經做好了充分的準備。"
 DEN_protect_the_faroe_islands: "保衛法羅群島"
 DEN_protect_the_faroe_islands_desc: "隨著世界緊張局勢的加劇，北海可能很快會發生一些激烈的衝突。法羅群島是我們控制格陵蘭及其眾多資源的重要紐帶。失去這個群島可能對我們造成毀滅性的影響，因此我們確保其防禦至關重要。"
 DEN_protect_bornholm: "保衛博恩霍爾姆"
 DEN_protect_bornholm_desc: "博恩霍爾姆位於[SWE.GetNameDef]的南部和[GER.GetNameDef]的北部，比與丹麥其他地區更接近這兩個國家。我們必須強化在波羅的海上這個戰略位置島嶼的建設，並確保我們對它的控制。"
 #Historical Branch
 DEN_declare_neutrality: "重申中立"
 DEN_declare_neutrality_desc: "在上次戰爭中，我們的不承諾政策為我們帶來了好處，使我們免於戰爭的荼毒。宣佈中立也許能再次拯救我們。"
 DEN_political_unity: "政治統一"
 DEN_political_unity_desc: "只有通過合作和跨黨派開展工作，我們才有希望確保我們的國家安全。拋開我們的政治分歧從來沒有比現在更重要，只有通過務實行事，我們才能保護丹麥。"
 DEN_policy_of_disarmament: "裁軍政策"
 DEN_policy_of_disarmament_desc: "我們已經追求了數十年的裁軍政策，這也是我們倖免於世界大戰荼毒的原因之一。通過表現出對任何鄰國都不構成威脅，或許這次我們也能倖免於難。"
 DEN_import_machinery_and_material: "進口機器和原料"
 DEN_import_machinery_and_material_desc: "如果我們希望與鄰國的工業巨擘競爭，我們必須要放聰明一點。從工業化程度更高的國家進口現代工具和材料將提升我們自身的能力，並使經濟得到進一步發展。"
 DEN_modernize_agricultural_machinery: "現代化農機"
 DEN_modernize_agricultural_machinery_desc: "現代化農業機械和技術可以提高效率，從而增加產量，帶來豐富的收穫。"
 DEN_develop_jutland_states_tt: "解鎖決議：§Y發展日德蘭區域§!\n\n"
 DEN_agricultural_reinvestments: "農業再投資"
 DEN_agricultural_reinvestments_desc: "通過機械化，將我們進口的新機械設備引進並投入使用，我們的農業變得更加高效。將這個部門增加的稅收進行再投資，可以進一步提高效率。"
 DEN_industrial_reinvestments: "工業再投資"
 DEN_industrial_reinvestments_desc: "現代化農業使人們從田地勞作中解放出來。在工業城市中心進行再投資將為這些人提供新的工作機會，這樣做可以增加我們的工業產出。"
 DEN_increase_produce_production: "提高糧食生產"
 DEN_increase_produce_production_desc: "我們的再投資取得了回報，從小農場到大合作社的每個人都享受到了繁榮發展的紅利。我們現在非常適合進一步增加糧食生產。"
 DEN_modernize_industrial_machinery: "現代化車床"
 DEN_modernize_industrial_machinery_desc: "丹麥傳統上是一個農業經濟體系，其經濟主要依靠食品出口，但城市工業在過去幾十年中變得越來越重要。通過投資現代化機械設備，工業可以進一步發展壯大。"
 DEN_develop_island_states_tt: "解鎖決議：§Y發展大貝爾特區域§!\n\n"
 DEN_increase_industrial_production: "提高工業生產"
 DEN_increase_industrial_production_desc: "隨著就業和經濟產出的逐漸增加，城市工業最近變得越來越重要。儘管我們的工業已經提高了自身能力，但仍有進一步提高效率的空間。"
 DEN_research_and_development: "投資研究和發展"
 DEN_research_and_development_desc: "石油和機械設備是維持現代社會運轉的關鍵，而我們在幾乎所有這些領域都已經落後了。我們必須確保本國沒有更進一步落後。"
 DEN_north_sea_oil_drilling: "北海石油開採"
 DEN_north_sea_oil_drilling_desc: "勘探者在丹麥的北日德蘭海岸外發現了石油貯藏。如果我們能夠開採這些石油貯藏，我們將減少對多變的貿易市場的依賴，變得更加自給自足。"
 DEN_potential_refinery_tt: "若已研究§Y$synth_oil_experiments$§!，在§Y$STATE_99$§!添加§G1§!個建築位和§G1§!座§Y$synthetic_refinery$§!。"
 DEN_increase_maritime_trade: "提高遠洋貿易"
 DEN_increase_maritime_trade_desc: "未來在於廣闊的海洋和我們的商船艦隊，後者將我們的產品遠銷世界各地。雖然我們國家的人口和政治影響力可能很小，但我們可以成為一個偉大的貿易強國。"
 DEN_full_employment: "充分就業"
 DEN_full_employment_desc: "在不惜一切代價投資工業和農業方面之後，我們現在終於可以收穫好處。我們已經挺過了經濟危機和高失業率的歲月。國家正全力運轉，人力市場供不應求。繁榮就在前方。"
 #Shared Political Branch
 DEN_social_stability: "社會穩定"
 DEN_social_stability_desc: "為了避免已經對其他國家造成影響的社會動盪，我們必須採取預防措施！在對各行業和整個經濟模式進行全面改革之前，我們必須確立堅定而穩定的立場。"
 DEN_welcome_foreign_scientists: "歡迎外國科學家"
 DEN_welcome_foreign_scientists_desc: "麻煩再次在歐洲醞釀，人們正在逃離那些意圖壓迫他們的政權。張開雙臂歡迎其中一些人，我們將獲得很多知識和競爭力。"
 DEN_build_motorveje: "建立國家公路系統"
 DEN_build_motorveje_desc: "最近關於國家高速公路的議論和規劃越來越多。建設一條高速公路網將有助於實現全國範圍內旅行時間的大幅縮短，使整個國家更加緊密地聯繫在一起。"
 DEN_heavy_market_regulations: "嚴格的產業管理條例"
 DEN_heavy_market_regulations_desc: "實業公司多年來已經變得龐大而富有。他們對經濟的控制已經讓很多人感到擔憂。我們需要限制他們，並對他們進行嚴格監管，以確保他們不會將公司的利益置於國家的利益之上。"
 DEN_limited_market_regulations: "有限的產業管理條例"
 DEN_limited_market_regulations_desc: "多年來，工業部門在國家經濟中變得越來越重要，甚至蓬勃發展。我們需要適度控制和引導它們，既不能妨礙其增長，又要足夠確保它們不會成為國家的安全風險。"
 DEN_no_market_regulations: "取消所有產業管理條例"
 DEN_no_market_regulations_desc: "我們的產業實現了增長和繁榮，這不是因為我們對市場進行的規範，而是因為他們沒有遵從我們的管理條例。如果我們真的想用我們的產業與世界其他國家競爭，我們需要取消對它們的任何和所有的規定。"
 DEN_industrial_research_bonus_tt: "工業研究加成：§G+5.00%§!"
 DEN_side_with_unions: "支持工會"
 DEN_side_with_unions_desc: "只有改善[Den.GetNameDef]所有人的生活條件，我們才能解決困擾勞動力市場的問題，而只有加強工會才能實現這一目標。"
 DEN_side_with_industry: "支持企業"
 DEN_side_with_industry_desc: "為了解決企業運營面臨的問題，我們需要降低工資，對進口商品徵收更高的關稅，否則企業主將要艱難求生。"
 DEN_five_year_plan: "推行五年計劃"
 DEN_five_year_plan_desc: "為了確保我們人民的未來，我們必須建立一個委員會，能夠為[DEN.GetNameDef]設計和實施一個大膽的新經濟模式。這個新的五年計劃將讓我們看到真正的騰飛和繁榮！"
 DEN_limited_social_mobilization: "有限社會動員"
 DEN_limited_social_mobilization_desc: "戰爭正在籠罩歐洲——但我們不能再次措手不及！我們必須進行必要的準備工作，以維護我們的主權，儘管這可能會很艱難。"
 #Rearmament Branch
 DEN_start_the_rearmament: "開始重整軍備"
 DEN_start_the_rearmament_desc: "[DEN.GetNameDef]已經忽視軍事，把自己的主權拱手交給鄰國掌控太久了。如今歐陸動盪不安，這樣做不會再管用了！我們必須再次加強我國軍事力量並確保自主掌控命運。"
 DEN_national_unity: "國民團結"
 DEN_national_unity_desc: "為了重新武裝並建設軍隊，我們需要全體丹麥人的支持。我們必須努力團結人民，堅定不移地向前邁進。"
 DEN_industrial_preparations: "工業準備"
 DEN_industrial_preparations_desc: "我們必須讓社會做好全面戰備——絕不能留給措手不及任何可乘之機。首當其衝的是工業準備，以此自給自足，並反過來增強軍力，使我們有足夠的時間來抵禦任何入侵者，以此等待救援。"
 DEN_military_preparations: "軍事準備"
 DEN_military_preparations_desc: "倘若我軍無法退敵，那為抗敵作戰所做的一切工業準備皆屬白搭。我們必須加強防禦，確保我國部隊擁有堅守陣地所需的紀律和勇氣。"
 DEN_civilian_preparations: "民事準備"
 DEN_civilian_preparations_desc: "軍事和工業部門的準備就算再充分，一旦民眾的決意一潰千里，一旦求和主張使得防線自後方瓦解，那麼一切都將化為烏有。我們必須淬鍊每一個丹麥人心中的堅毅，堅定他們的信念。"
 DEN_full_social_mobilization: "全面社會動員"
 DEN_full_social_mobilization_desc: "戰爭已經臨門。為了保護我等之自由，必須動員社會的方方面面。每個男人、女人和孩子都必須知道自己的責任和義務。如此必有代價，但我國一切工業產能都必須用於支持丹麥人民的重整軍備和安居樂業。"
 DEN_seek_protection: "尋求庇護"
 DEN_seek_protection_desc: "雖然我們可以做好一切準備，但我們周圍有更大更強的鄰國——我們無法真正確定他們的意圖。因此，在其他地方尋求保護以確保我們的獨立是一個明智之舉。"
 DEN_sign_non_aggression_deal: "簽署不侵犯條約"
 DEN_sign_non_aggression_deal_desc: "如果我們能夠結交一個更強大的國家，並與之簽訂互不侵犯條約，我們將受益匪淺。這可能不會在短期內改變我們岌岌可危的處境，但從長遠來看，更緊密的關係可通過進行貿易和加強合作而使我們受益。"
 DEN_sign_a_trade_deal: "談判貿易協定"
 DEN_sign_a_trade_deal_desc: "我們決意要再武裝軍隊，但這需要時間——時間正是我們最缺少的東西。我們必須多快好省地獲得裝備，只能求助於友好國家，以採購填補我國貧弱的產能。"
 DEN_science_pact: "啟動研究和夥伴關係項目"
 DEN_science_pact_desc: "隨著國家對工業愈發重視，我等在科技進步方面取得了長足的進步，但仍然落後於某些國家。與友好國家合作，我們可以開展互惠互利的研究和合作計劃，向未來持續邁進。"
 DEN_territory_for_protection: "領土換庇護"
 DEN_territory_for_protection_desc: "重整軍備計劃正在按部就班，但軍方仍擔心計劃趕不上變化。我們可以出賣掉部分領土，以此換得比互不侵犯條約更具體的庇護，甚至還有機會造福本國經濟。"
 DEN_strength_in_numbers: "人多力量大"
 DEN_strength_in_numbers_desc: "我們如果想在面對強大得多的敵人時有一戰之力，就必須尋求盟友——去尼瑪的中立！是時候拋棄天真，凝視這個世界的真實了。"
 DEN_military_cooperation_program: "軍事合作項目"
 DEN_military_cooperation_program_desc: "在確立同盟之後，兩國都樂於建立一個聯合軍事合作項目供互相學習。為這一協議錦上添花的是，我國的新盟友已同意為我國軍備重整採購提供補貼。"
 DEN_joint_military_drills: "聯合軍事訓練"
 DEN_joint_military_drills_desc: "由於自1864年以來一直處於中立，丹麥軍隊已經有些時間未見識真正的戰鬥了。如果能與我們的新盟友協商進行聯合軍事訓練，我們可以從他們那學到許多，而且雙方都能從對方獲取經驗。"
 DEN_nordic_security: "北歐安保"
 DEN_nordic_security_desc: "新的聯盟關係保證了我國獨立安穩，如今終於可以把注意力轉向北歐其他國家了。我們必須說服其加入我方陣營，以此相互照應；倘若他們不講道理，我們就有義務進行武裝保護，免得他們傷害到其自己。"
 #Monarchist Branch
 DEN_unify_the_right: "團結右翼"
 DEN_unify_the_right_desc: "[DEN.GetNameDefCap]政界那不負責任的做派已經持續太久了！惟有依靠丹麥民族的勇氣和毅力，我們這個國家才能繼續運轉。右翼政黨是時候團結起來，共同對抗左翼威脅了！"
 DEN_conservatives_support: "爭取保守派支持"
 DEN_conservatives_support_desc: "儘管大部分保守黨員中做夢也想不到要與農民黨或納粹黨這等組織合作，但還是有些人能意識到風暴將至，而[DEN.GetNameDef]毫無防備這一事實。我們必須說服這種人加入我們的事業。"
 DEN_conspire_with_the_officer_corps: "媾和軍官團"
 DEN_conspire_with_the_officer_corps_desc: "右翼聯盟統一之後，我們有了更大的政治授權和更一致的議程，如此即可與軍官團接洽，至少要說服其部分成員支持我們。"
 DEN_encourage_paramilitary: "鼓勵準軍事組織"
 DEN_encourage_paramilitary_desc: "鼓勵地方準軍事組織不僅能在戰時加強國家安全保障，也能提升民眾的社群和團結意識。"
 DEN_overthrow_the_government: "顛覆政府"
 DEN_overthrow_the_government_desc: "長期以來，我們的國家一直由貪婪的人統治，他們只顧自己的利益，而忽視了對丹麥人民構成威脅的各類險況。是時候建立新秩序，為[DEN.GetNameDef]開啟新時代了！"
 DEN_strengthen_the_officer_corp: "加強軍官團"
 DEN_strengthen_the_officer_corp_desc: "軍官在軍事行動的成功中發揮著舉足輕重的作用。為了確保我軍武裝部隊有效可靠，我們必須重新檢視強化我們的軍官隊伍。新一代的將校必須德才兼備——能力出眾，恪守職分。"
 DEN_king_assumes_power: "國王奪權"
 DEN_king_assumes_power_desc: "時代的不確定性要求我們以有力的大手指引祖國前行，這隻大手背後所代表的就是穩定和傳統。我們要說服國王，請他在這個動盪的時代全權負責政府工作。"
 DEN_konge_og_faedreland: "為了王上和祖國"
 DEN_konge_og_faedreland_desc: "克里斯蒂安十世陛下有著堅定不移的奉獻精神和榮譽感。在這個考驗我國的時刻，這對於人民群眾乃是希望之燈塔。我們必須團結一致，保衛祖國！"
 DEN_align_industries: "引導產業符合國家利益"
 DEN_align_industries_desc: "有效資源配置和集中工業產出的需求已變得至關重要。通過協調我們的人力並簡化生產流程，我們將確保每家工廠、每名工人和每一項資源都充分發揮潛力，旨在為[DEN.GetNameDef]做貢獻。"
 DEN_the_royal_guard: "擴編王室衛隊"
 DEN_the_royal_guard_desc: "王室衛隊肩負著保護國王及其王族安全的重任已近三百年，他們一次又一次地證明了自己在履職時的專注和堅定。通過規模上的擴編以及紀律上的緊抓，我們可以進一步加強我國武裝力量。"
 DEN_economic_mobilization_strategy: "經濟動員戰略"
 DEN_economic_mobilization_strategy_desc: "我們必須讓經濟和群眾為即將到來的戰爭做好準備。我們需要實施新的經濟戰略，以確保各行業儘可能高效地運行，同時說服丹麥人民為國王和國家履行職責。"
 DEN_expand_kobenhavns_university: "擴建哥本哈根大學"
 DEN_expand_kobenhavns_university_desc: "我們不能冒險讓[DEN.GetNameDef]的技術水平停滯落後。投資哥本哈根大學，致力於科學進步和技術開發，將確保我們在任何領域都不會落後於競爭對手。"
 DEN_scandinavian_security: "穩固斯堪的納維亞"
 DEN_scandinavian_security_desc: "在過去的幾個世紀裡，斯堪的納維亞半島和波羅的海一直是[DEN.GetNameDef]的主要地緣政治焦點。在將注意力轉向歐陸列強之前，我們必須首先征服上的主要歐洲強國之前，我們必須首先平定我國北翼。"
 DEN_reintegrate_iceland: "整合冰島"
 DEN_reintegrate_iceland_desc: "[ICE.GetNameDef]是我國不可分割的一部分——不久前如此，經久前亦如此。現在是時候說服[ICE.GetAdjective]加入我國，使兩國再次一統了。"
 DEN_develop_iceland: "開發冰島"
 DEN_develop_iceland_desc: "冰島地處北大西洋，是海軍遠征掌控公海的首選之地。通過向向當地投入更多資源資金，小小一島可以將其更緊密地融入更廣闊的領域，我們也能更好地利用其戰略地位。"
 DEN_sway_the_nordics: "影響北歐諸國"
 DEN_sway_the_nordics_desc: "筆桿子勝於槍桿子——這句俗語是有道理的。為說服其他國家支持我等事業，與其使用蠻力，不如試一下外交手段。"
 DEN_offer_protection: "提供庇護"
 DEN_offer_protection_desc: "為進一步增強我國在北歐地區和波羅的海周邊的影響與勢力，我們應為需要幫助的國家提供合適的庇護，在此基礎上建立丹麥之權威。保護北歐和波羅的袍國將鞏固全地區安全形式，並使我等諸國一併受益。"
 DEN_secure_swedish_steel: "控制瑞典鋼鐵"
 DEN_secure_swedish_steel_desc: "[DEN.GetNameDefCap]資源匱乏，缺乏建設現代軍事所需的材料。在隔壁，瑞典物產豐饒，且一度歸順在丹麥統治之下。現在是時候再次將[SWE.GetNameDef]納入我國統治了。"
 DEN_swedish_steel_production: "瑞典鋼產"
 DEN_swedish_steel_production_desc: "將[SWE.GetNameDef]北部礦產資源納入我們的統治範圍後，我們就能很好地利用所有的礦山來提高我們自己的開採能力，同時還能將部分財富出口到國外——以此換得安全保障。"
 DEN_finish_off_finland: "控制東線"
 DEN_finish_off_finland_desc: "除非東線安穩無虞，否則我等在斯堪的納維亞北境利益永遠要處於達摩克里斯之劍之下。我們必須先制行動，武裝保護芬蘭領土！"
 DEN_reclaim_norway: "收復挪威"
 DEN_reclaim_norway_desc: "丹麥王室統治[NOR.GetNameDef]達數百年之久，直到1814年才慘遭瑞典所掠。丹麥王仲、[NOR.GetNameDef]國王哈康一再申明不願直接控制挪威，也不願以“必要”的名義去專制保護其人民。那麼，是時候在丹麥治下一統兩國了。"
 DEN_train_mountain_infantry: "山地訓練"
 DEN_train_mountain_infantry_desc: "斯堪的納維亞半島的西部和北部地區多山，丹麥本土沒有這種地形。我們必須在這些山區進行軍事演習，以提高我們的作戰能力，更好地保護我們的領土。"
 DEN_pan_scandinavianism: "泛斯堪的納維亞主義"
 DEN_pan_scandinavianism_desc: "斯堪的納維亞，乃至全北歐，千年來相濡以沫、榮辱與共。唯經各族人民深沉的血脈維繫，我等方能向統一之路邁出步伐。"
 #Fascist Branch
 DEN_march_on_the_capital: "向首都進軍"
 DEN_march_on_the_capital_desc: "終於到了我黨站起來並掌控[DEN.GetNameDef]未來的時候了。我們必須向[ROOT.capital.GetCapitalVictoryPointName]進軍，讓我們的聲音被聽到！這將是[DEN.GetAdjective]歷史上一個強大而安全的時代的開始！"
 DEN_seize_power: "攫取權力"
 DEN_seize_power_desc: "[DEN.GetNameDefCap]終於準備好接受新的法西斯政府了。我們將廢除議會，並將我們偉大國家的未來交到$DEN_cay_lembcke$手中。然而，如果有一絲阻力，我們就必須做好永遠消滅它的準備。"
 DEN_ask_for_support: "尋求援助"
 DEN_ask_for_support_desc: "[GER.GetAdjective]是我們想要建成的那類國家的典範。因此，在政府陷入動盪的此刻，我們想不到誰能比他們更值得我們聯繫並尋求支持了。我們應該儘快派代表團前往[GER.capital.GetCapitalVictoryPointName]！"
 DEN_denmark_first: "丹麥優先"
 DEN_denmark_first_desc: "我們憑一己之力已經走到了這一步，何必向任何大國尋求支持呢？相反，[DEN.GetNameDef]將自力更生，併成長為與世界其他主要派別一樣重要的存在。丹麥萬歲！"
 DEN_rally_the_nation: "全國號召"
 DEN_rally_the_nation_desc: "現在我們已經控制了國家，最重要的是我們獲得人民的支持。雖然他們可能無法做太多事情來反對我們，但有一群民眾站在你一邊，準備為他們的國家而戰，比有一個人在你背後插著刀要好得多。讓我們恢復[DEN.GetAdjective]的自豪感，團結人民為國家而戰！"
 DEN_dano_german_military_cooperation: "丹麥-德國軍事合作"
 DEN_dano_german_military_cooperation_desc: "為了讓我們的軍隊發展到能夠實現我們的目標，我們可能有必要同我們的同盟[GER.GetNameDef]政府接洽，並請求軍事和技術合作。通過這項提議，我們對[DEN.GetNameDef]的未來設想將更接近現實。"
 DEN_institute_corporatism: "研究社團主義"
 DEN_institute_corporatism_desc: "在意大利模式的啟發下，來自不同經濟部門的工人和資本家必須參與國家政策的制定，這樣我們才能在這些群體之間進行斡旋，進行對國民經濟最有利的改革。這將幫助我們確保[DEN.GetNameDef]穩固的政治未來。"
 DEN_experimental_technology: "實驗性技術"
 DEN_experimental_technology_desc: "在我們開發戰爭機器的同時，我們還應該確保我們的研發部門繼續推進他們的實驗。我們必須向大學和實驗室提供他們所需的資金，以繼續推動我們的進一步發展。"
 DEN_assault_troops: "衝鋒隊"
 DEN_assault_troops_desc: "雖然軍隊可以堅守陣線並一點一點地擊退我們的敵人，但只有通過我們精銳部隊的力量，我們才能找到摧毀我們面臨的任何威脅所需的力量。我們應該優先訓練他們，確保我們有服從命令、紀律嚴明的特種部隊作為後備力量。"
 DEN_prioritize_navy: "重視海軍"
 DEN_prioritize_navy_desc: "本土只是一個小半島，如此，優先發展待命艦隊就顯得尤為重要。[DEN.GetAdjective]海軍有一天可以與[ENG.GetAdjective]或[JAP.GetAdjective]的海軍相媲美，但前提是我們花時間和金錢來改進它。"
 DEN_prioritize_army: "重視陸軍"
 DEN_prioritize_army_desc: "任何軍隊的中堅都是陸軍。如果我們將資源集中至士兵訓練和戰爭機器與裝備的生產上，就能為面對任何膽敢威脅[DEN.GetNameDef]之敵做好萬全準備。"
 DEN_total_war: "全面戰爭"
 DEN_total_war_desc: "我們目前在這場戰爭中的損失是不可接受的。然而，這還沒有結束。我們必須集結部隊，為全面克里格做好準備。如果我們能夠擊退敵人，並全力以赴，那麼我們就有機會抵禦這場動盪。團結人民並動員最後的產業，我們必須堅守陣地！"
 DEN_military_might: "復甦軍事力量"
 DEN_military_might_desc: "[DEN.GetNameDef]的軍事實力日益強大，但總有進步的空間。讓我們將資金集中用於陸軍和空軍，以改善他們的培訓和戰場效率。"
 #End Focuses
 DEN_avenging_1864: "雪恥1864"
 DEN_avenging_1864_desc: "1864年的恥辱性失敗給我們的國家帶來了半個多世紀的創傷。現在是時候了，讓我們一勞永逸地保衛我們的南部邊境，並確保沒有敵人能夠再次決定我們必須遵守的條款。"
 DEN_dominium_maris_baltici: "波羅的海主宰"
 DEN_dominium_maris_baltici_desc: "[ROOT.GetNameDefCap]曾經是波羅的海沿岸最強大的國家。我們曾與波羅的海國家、波蘭人、俄羅斯人，尤其是瑞典人作戰，爭奪海洋主導權。我們現在已做好準備，一勞永逸地將整個地區置於我們的控制之下。"
 DEN_establish_the_danelaw: "丹法區"
 DEN_establish_the_danelaw_desc: "曾有一時，我們的領土橫跨北海，英國人也服從於我們的法律。是時候重整旗鼓制霸海洋來保障我們人民的未來了。我們將復建丹法區並迫使所有其他國家重視我們！"
 #Occupation Branch
 DEN_collaboration_government: "合作政府"
 DEN_collaboration_government_desc: "簽署和平條約並與[?DEN.DEN_overlord_nation.GetNameDef]合作是使我們的人民免於破壞和毀滅的唯一途徑。通過建立一個與[?DEN.DEN_overlord_nation.GetAdjective]佔領軍密切配合的合作政府，我們將獲得比大多數處於類似情況的國家多得多的獨立和主權。"
 DEN_seek_independence: "尋求獨立"
 DEN_seek_independence_desc: "儘管已和[?DEN.DEN_overlord_nation.GetNameDef]達成合作，但丹麥獨立已非勢在必得。必須通過反抗佔領軍來捍衛自由，並在合適的時機發起突襲。"
 DEN_sanction_sabotages: "破壞制裁"
 DEN_sanction_sabotages_desc: "即使我們與[?DEN.DEN_overlord_nation.GetNameDef]合作，這也不一定意味著我們不能以和平方式反對佔領行徑。可以說，事實上我們有責任在不危及人民的情況下進行抵抗。"
 DEN_form_the_danish_freedom_council: "丹麥自由委員會"
 DEN_form_the_danish_freedom_council_desc: "我們必須同所有反對[?DEN.DEN_overlord_nation.GetNameDef]佔領的政治團體攜手組建一個廣泛的聯盟，以求組成聯合理事會。這個自由的理事會可以更有效地協調入侵後興起的不同抵抗運動，也可以協調任何潛在的獨立戰爭。"
 DEN_arm_the_resistance: "武裝抵抗組織"
 DEN_arm_the_resistance_desc: "自佔領開始後已經出現了無數的抵抗運動。如果我們想擺脫[?DEN.DEN_overlord_nation.GetAdjective]高壓統治的束縛，我們就必須武裝這些團體，並讓他們為重新宣告獨立的那一天做好準備。"
 DEN_escalate_the_sabotages: "加強破壞活動"
 DEN_escalate_the_sabotages_desc: "一個愈發明晰的事實是，為了重獲自由，我們必須再次戰鬥。我們必須加強對[?DEN.DEN_overlord_nation.GetAdjective]佔領的破壞活動。"
 DEN_expand_the_resistance: "擴大抵抗組織"
 DEN_expand_the_resistance_desc: "儘管自佔領開始已經有各種抵抗團體出現在各行各業，但是如果我們想將[?DEN.DEN_overlord_nation.GetAdjective]軍隊趕出我們的土地，還是要號召更多人加入這些團體。"
 DEN_declare_independence: "捍衛丹麥獨立"
 DEN_declare_independence_desc: "再度獨立之時已至。如有必要，奮戰奪還！"
 DEN_secure_danish_freedom: "保障丹麥自由"
 DEN_secure_danish_freedom_desc: "只是將[?DEN.DEN_overlord_nation.GetAdjective]軍隊趕出我們的土地無法完全保障丹麥的自由。我們必須確保[?DEN.DEN_overlord_nation.GetNameDef]永遠不再會成為威脅。"
 DEN_create_danforce: "成立丹麥流亡軍"
 DEN_create_danforce_desc: "[?DEN.DEN_overlord_nation.GetNameDefCap]已禁止我國擁有一支足以威脅其霸權的大規模軍隊。我們必須另尋一處自由且友好的國家，在那裡訓練並供給一支能參與從高壓統治中解放[DEN.GetNameDef]的力量。"
 DEN_buy_foreign_aircraft: "獲取外國飛機"
 DEN_buy_foreign_aircraft_desc: "我們必須加強丹麥旅，通過獲取飛機使之能與[?DEN.DEN_overlord_nation.GetNameDef]在[DEN.GetNameDef]的天空中一較高下。"
 DEN_rigid_training: "嚴格訓練"
 DEN_rigid_training_desc: "光靠數量無法讓我軍制霸天空。我們必須讓飛行員接受嚴格的訓練，這樣他們才能讓[?DEN.DEN_overlord_nation.GetAdjective]飛機遠離我們的天空。"
 DEN_strengthen_the_danish_brigades: "加強丹麥旅"
 DEN_strengthen_the_danish_brigades_desc: "我們不可能積攢與[?DEN.DEN_overlord_nation.GetNameDef]所擁相當的火力，因此我們必須以智取勝。我們必須研究敵人，找到他們的弱點，以便在戰場上利用之。"
 DEN_support_battalions: "支援營"
 DEN_support_battalions_desc: "如果丹麥旅要成為一支有效的部隊並有機會解放[ROOT.GetNameDef]，他們就必須擁有足夠的物資。步槍和機槍都很好，但在當今時代，火炮和防空支援是強制性的。"
 DEN_expand_the_brigades: "擴建丹麥旅"
 DEN_expand_the_brigades_desc: "為了確保丹麥旅有機會解放[ROOT.GetNameDef]，我們需要為他們的部隊增加更多的兵力。"
 DEN_establish_danske_flotille: "組建丹麥流亡艦隊"
 DEN_establish_danske_flotille_desc: "建立一支流亡艦隊後，我們就能訓練兵員、舉行海軍演習，從而為解放國土的目標磨鍊兵員技能。我們的艦隊將遭到[?DEN.DEN_overlord_nation.GetAdjective]海軍的強烈敵視，因此我們必須千方百計佔據上風。"
 DEN_buy_foreign_ships: "採購驅逐艦"
 DEN_buy_foreign_ships_desc: "為了保障[DEN.GetNameDef]的海岸線和眾多島嶼，我們必須先有一支能保衛航道的得力艦隊。通過與同情我國困境的國家暗中接洽，我們或許能採購其舊式驅逐艦用以加強我國海軍。"
 DEN_align_with_foreign_powers: "與外國勢力結盟"
 DEN_align_with_foreign_powers_desc: "[?DEN.DEN_overlord_nation.GetNameDefCap]不會拱手放棄哪怕一寸已征服的土地，我們也不可能獨力對抗他們的軍力。如果要擺脫臣服的束縛並重獲獨立，我們必須尋求能雪中送炭的潛在盟友。"
 DEN_seek_foreign_support_tt: "解鎖決議：§Y尋求外國勢力支持§!"
 DEN_intel_sharing: "信息共享"
 DEN_intel_sharing_desc: "通過共享情報與我們反對[?DEN.DEN_overlord_nation.GetNameDef]的盟友深化合作，將加強各方連結，提高顛覆[?DEN.DEN_overlord_nation.GetAdjective]高壓統治的能力。"
 DEN_ask_for_weapons: "請求武器輸送"
 DEN_ask_for_weapons_desc: "[?DEN.DEN_overlord_nation.GetAdjective]宗主一直在削減我國武器與彈藥儲備，這削弱了我們在時機來臨時反戈一擊宣佈獨立的能力。我們可以請求盟友空投所需補給，補充我們空空如也的庫存。"
 DEN_buy_allied_weapons: "採購盟國武器"
 DEN_buy_allied_weapons_desc: "作為一個小國，我們生產軍備的能力有限，因此我們必須外購儘量好的裝備來保障我們的獨立。也許我們能說服盟友按優惠價向我們提供所需的軍火。"
 DEN_align_with_overlord: "與[?DEN.DEN_overlord_nation.GetNameDef]結盟"
 DEN_align_with_overlord_desc: "雖然我們在與[?DEN.DEN_overlord_nation.GetNameDef]簽訂的和平協議中設法保持了高度的獨立性，但我們仍然只是一個傀儡。然而，這確實為我們帶來了迷人的機會。或許，如果我們與[?DEN.DEN_overlord_nation.GetNameDef]結盟，我們就能憑藉我們的強大宗主國，反敗為勝……"
 DEN_seek_industrial_investments: "尋求工業投資"
 DEN_seek_industrial_investments_desc: "我們與[?DEN.DEN_overlord_nation.GetNameDef]結盟並贏得了他們的部分信任和青睞後，我們發現自己處於一種有利的位置，我們可以要求我們的宗主國投資我們的工業並增強我們的生產能力。"
 DEN_pledge_allegiance: "宣誓忠誠"
 DEN_pledge_allegiance_desc: "為了充分利用好與[?DEN.DEN_overlord_nation.GetNameDef]間的關係，我們必須向其宣誓效忠——在毫不懷疑誠意的基礎上，建立一種共生的夥伴關係，使兩國皆能從發展中牟取利好。"
 DEN_seek_military_investments: "尋求軍事投資"
 DEN_seek_military_investments_desc: "在宣誓效忠並加強與[?DEN.DEN_overlord_nation.GetNameDef]的關係後，我們現在得到了[?DEN.DEN_overlord_nation.GetLeader]的青睞。這使我們能夠直接向他請求，讓[?DEN.DEN_overlord_nation.GetAdjective]對我們的軍事生產進行投資。"
 DEN_petition_for_independence: "獨立請願"
 DEN_petition_for_independence_desc: "我們有派上用場，有在各方面努力地幫到尊貴的[?DEN.DEN_overlord_nation.GetAdjective]主人。我們已證明自己是值得信賴和依靠的，因此現在該反過來請他們施捨我國獨立了。此後，我國將長期作為[?DEN.DEN_overlord_nation.GetNameDef]的忠實盟友而繼續戮力同心。"
 DEN_seize_the_production: "奪取生產資料"
 DEN_seize_the_production_desc: "非常時期需要非常措施。為了充分發揮我國工業潛力，我們就必須奪取生產資料。這將確保工業服務於國家需求，並在最大限度上高效運行。"
 DEN_adjust_industrial_prioritize: "調整產業優先級"
 DEN_adjust_industrial_prioritize_desc: "戰爭即將來臨，我們必須採取相應行動，調整我們的產業，為戰爭提供生產並做出貢獻。每個男人和女人都必須理解並毫無怨言地履行自己的職責，以服務國家的需要。"
 DEN_increase_cooperation: "擴大合作"
 DEN_increase_cooperation_desc: "儘管我們可能不願意承認這一點，但我們永遠無法阻止[?DEN.DEN_overlord_nation.GetAdjective]的入侵——而且通過投降，我們確保了[?DEN.DEN_overlord_nation.GetAdjective]統治下其他國家所不享有的一定程度的自治權。因此，我們應該努力與我們的宗主國更密切地合作，以確保這種獨立性並從這種關係中獲益。"
 DEN_acquire_military_equipment: "爭取軍事裝備"
 DEN_acquire_military_equipment_desc: "作為較弱小的國家，我們生產軍備的能力有限——但要真正為[?DEN.DEN_overlord_nation.GetFactionName]戰爭做出貢獻，我們必須獲得儘可能最好的裝備。也許我們可以說服我們的盟友按優惠價向我們提供必要的武器。"
 DEN_contribute_to_the_war: "戰爭貢獻"
 DEN_contribute_to_the_war_desc: "儘管我們已經向[?DEN.DEN_overlord_nation.GetAdjective]霸主表明了我們的立場和意圖，但他們不會允許我們進一步發展我們的軍隊。只有加入[?DEN.DEN_overlord_nation.GetFactionName]並承諾為戰爭做出貢獻，我們才能改善我們的陸軍、海軍和空軍。在[?DEN.DEN_overlord_nation.GetNameDef]的支持下，我們可以將目光轉向其他北歐國家……"
 DEN_secure_the_norwegian_coast: "控制挪威海岸"
 DEN_secure_the_norwegian_coast_desc: "往昔，丹挪合邦長達數個世紀之久。想要掌控北海，或者以北海為跳板對外擴張，就必須再度統合兩國。以稱霸大西洋作為我等夙願，挪威海岸是為漫漫征途的始於足下。"
 DEN_reclaim_atlantic_islands: "收復大西洋諸地"
 DEN_reclaim_atlantic_islands_desc: "法羅群島和冰島或無自然資源可言，但其為我國不可分割的一部分，具有重大戰略價值，是為統治北大西洋的墊腳之石。\n\n格陵蘭，則是我國唯一真正擁有建設現代化強軍所需資源的地區，因此是為重中之重，不可或缺。"
 DEN_claim_sweden: "聲索瑞典"
 DEN_claim_sweden_desc: "瑞典曾經是我等勁敵，也曾在數個世紀內臣服在我等膝下。與丹麥相反的是，瑞典坐擁豐饒的自然資源，是為建設一支現代化強軍不可缺少之物。也許是時候再次將瑞典納入我們的版圖了，要讓瑞典的資源對我等敞開懷抱……"
 DEN_safeguard_the_eastern_front: "東線衛士"
 DEN_safeguard_the_eastern_front_desc: "歷史上，芬蘭於我等一直是可望而不可即。但隨著我國霸業復現於斯，我們完全有能力將芬蘭收入囊中。控制了芬蘭就意味著穩住了東線安全，並能進一步加強我等對波羅的海的掌控。"
 #Military Branch
 DEN_sign_forsvarsforliget: "簽訂國防協定"
 DEN_sign_forsvarsforliget_desc: "鑑於歐陸局勢愈發緊張，我們必須坦白我國嚴重缺乏國防能力的現實。簽訂一份新的國防協定，為陸軍、海軍和空軍提供更多資金，將加強我國軍事能力並保障國土完整。"
 DEN_stockpile_oil: "儲備燃油"
 DEN_stockpile_oil_desc: "我們必須為最壞的情況，也就是戰爭做準備。即便我們未被捲入戰爭，在我國附近爆發的大規模衝突亦會影響我國。為了最小化這種影響，我們需要積聚大量戰略資源儲備。"
 DEN_potential_fuel_silos_tt: "若已研究§Y燃料儲存§!，在§Y2§!個地區添加§G1§!個建築位和§G1§!座§Y儲油罐§!。"
 DEN_sikkerhedspolitiet: "安全警察"
 DEN_sikkerhedspolitiet_desc: "建立情報部門將有助於在歐陸局勢日漸緊張，衝突有侵蝕我國主權之勢時提高我們的警惕。"
 DEN_expand_vaernepligten: "擴大徵募"
 DEN_expand_vaernepligten_desc: "我國軍隊目前甚至稱不上是一支象徵性力量，完全無法抵禦任何潛在的入侵者。如需讓其承擔國防重任，我們就必須迅速擴大徵募。"
 DEN_haeren_reorganization: "陸軍重組"
 DEN_haeren_reorganization_desc: "丹麥陸軍渺小而且對保衛國境毫無準備。為了保障我國獨立，抵禦潛在敵人，必須將其重組為擁有高效總指揮部的高效戰鬥力量。"
 DEN_expand_haerens_tekniske_korps: "擴大陸軍技術兵團"
 DEN_expand_haerens_tekniske_korps_desc: "陸軍技術兵團管理著軍械庫和生產武器彈藥的陸軍槍械工廠。擴建這些設施將提高步槍與火炮的產能，從而加強我國的軍事能力。"
 DEN_hjemmevaernet: "家園衛隊"
 DEN_hjemmevaernet_desc: "相當多的有志之士站出來，保衛丹麥免受任何侵略者的侵害。我們應該利用這些人的鬥爭精神，組建一支地方軍——以防有人愚蠢到想入侵我們。"
 DEN_expand_dansk_industri_syndikat: "擴大丹麥工業辛迪加"
 DEN_expand_dansk_industri_syndikat_desc: "丹麥工業辛迪加，通常被稱為步槍辛迪加，是我國最大的武器製造商，同時生產我軍裝備的麥德森步槍。投資並擴建他們的工廠是最符合國家安全利益的。"
 DEN_new_artillery_tactics: "新式火炮戰術"
 DEN_new_artillery_tactics_desc: "陸軍技術兵團現在已經能生產槍炮彈藥了。不過，如果在其中組建一支試驗型部隊，我們也許就能自主設計生產火炮。陸軍會因此獲益匪淺的。"
 DEN_convert_automobile_production: "轉換汽車生產線"
 DEN_convert_automobile_production_desc: "是時候命令丹麥汽車製造商支援國防，將他們的民用生產線轉向生產戰爭物資了。實現自主生產卡車並進一步提高我軍機械化程度將使我軍更加敏捷與靈活。"
 DEN_slaedepatruljen_sirius: "“天狼星”雪橇巡邏隊"
 DEN_slaedepatruljen_sirius_desc: "丹麥大陸冬季降雪很少，而且很少持續很長時間。然而，我們確實擁有格陵蘭島，那裡常年積雪厚達數公里。我們可以利用這一點，在那裡訓練我們的部隊，讓他們適應寒冷。"
 DEN_generalkommandoen: "總司令部"
 DEN_generalkommandoen_desc: "訓練有素、紀律嚴明、悉心畢力的軍官是一支成功軍隊的根基。我們應該力求培養世上最高效最精幹的軍官並讓他們加入總參謀部。"
 DEN_establish_domestic_tank_manufacturing: "締造國產坦克"
 DEN_establish_domestic_tank_manufacturing_desc: "20世紀的戰爭已經發生了天翻地覆的變化，我們必須與之俱進。如今取勝的關鍵是有一隻風馳電擎、勢如破竹的軍隊。實現自主坦克供應才能保證我軍在現代戰場上立於不敗之地。"
 DEN_expand_ubadsvabnet: "擴編潛艇部隊"
 DEN_expand_ubadsvabnet_desc: "保衛我國海岸線與眾多島嶼的最好措施就是敵人看不見的措施。一隻大型潛艇艦隊能讓我們出其不意地襲擊，然後毫髮無傷地撤退。"
 DEN_add_basic_submarine_tech_tt: "添加科技：§Y人魚級§!"
 DEN_refit_civilian_ships: "改裝舊式艦船"
 DEN_refit_civilian_ships_desc: "我國被海軍規模遠大於我軍的國家包圍。如果想追上他們的戰力，我們就需要建造更多艦船。有了足夠多的艦船後，我們就有能力與大部分海軍較量了。"
 DEN_refit_civilian_ships_decision_tt: "解鎖為軍事用途改裝運輸船的決議。"
 DEN_modernize_the_navy: "海軍現代化"
 DEN_modernize_the_navy_desc: "如果要和當今最強大的海軍一較高下，我軍就必須以質勝量。如果我們面對的是火力更猛、機動更強的現代艦船，數量優勢就幫不上忙。"
 DEN_sovaernets_operative_kommando: "海軍行動指揮部"
 DEN_sovaernets_operative_kommando_desc: "我們需要一個能高效協調我國海軍的中央指揮結構。這項重任只能託付給最優秀和最機智的軍官。"
 DEN_appropriate_odense_staalskibsvaerft: "挪用歐登塞鋼船廠"
 DEN_appropriate_odense_staalskibsvaerft_desc: "為了切實擴大我國海軍規模，我們需要額外產能。收購A·P·穆勒-馬士基位於歐登塞的造船廠將顯著提高我們的產能。"
 DEN_restructuring_sovaernet: "重組丹麥海軍"
 DEN_restructuring_sovaernet_desc: "數十年的和平時光掩蓋了我國海軍指揮結構中的大量缺陷。要解決這些問題，唯有全面重組丹麥海軍。"
 DEN_baltic_sea_domination: "掌控波羅的海"
 DEN_baltic_sea_domination_desc: "在俄羅斯帝國崛起之前，甚至在短命的瑞典帝國之前，丹麥就有望統治波羅的海。為了真正確保我們的獨立和保衛我們的家園，我們需要再次以海軍霸權控制整個波羅的海為目標。"
 DEN_north_sea_ambitions: "劍指北海"
 DEN_north_sea_ambitions_desc: "我們是一個從歐洲海岸到北大西洋海域的幅員遼闊的國家。為了保護這個廣闊的國家和我們海外領土的安全，我們必須開始一項大膽而雄心勃勃的計劃。我們的唯一目的必須是建立一支能夠與任何反對我們的勢力爭奪這些水域的北海艦隊。"
 DEN_with_refit_old_ships_completed_tt: "若已完成§Y$DEN_refit_civilian_ships$§!："
 DEN_with_modernize_the_navy_completed_tt: "\n若已完成§Y$DEN_modernize_the_navy$§!："
 DEN_naval_power_projection: "海軍力量投射"
 DEN_naval_power_projection_desc: "我等意志若不能投射於舉國上下，海軍再龐大再強大也徒勞無功。通過一連串海軍基地來串聯我國控制區，我們在四遭海域的統治地位將無比堅實。"
 DEN_baltic_sea_domination_completed_tt: "已完成國策§Y$DEN_baltic_sea_domination$§!並且擁有[DEN.GetNameDef]"
 DEN_north_sea_ambitions_completed_tt: "已完成國策§Y$DEN_north_sea_ambitions$§!並且擁有[DEN.GetNameDefCap]"
 DEN_fromandskorpset: "蛙人部隊"
 DEN_fromandskorpset_desc: "陸軍和海軍近來的改進大大加強了我們的軍事力量。我們發現自己完全有能力將力量投射到更廣闊的天地，越過海洋直抵外國的海岸——只要我們願意。"
 DEN_domestic_designs: "本國設計"
 DEN_domestic_designs_desc: "我們的空軍能力嚴重不足。這主要源於這樣一個事實——我們不生產自己的飛機，因此，如果情況變得更糟，我們將沒有足夠的飛機對敵。我們需要為我們自己的飛機建立一條國內生產線。"
 DEN_foreign_designs: "外國設計"
 DEN_foreign_designs_desc: "我們的兩支空軍都沒有能力設計和建造一架正常運行的戰鬥機或轟炸機。我們應該尋找其他地方購買飛機。如果設計令人滿意，我們就可以考慮獲得生產許可證。"
 DEN_unify_flyvevabnet: "統一丹麥空軍"
 DEN_unify_flyvevabnet_desc: "目前看來，我們有兩隻截然不同且互不相關的空中力量：陸軍的陸軍航空兵與海軍的海軍航空軍。雙方時有不和。將他們整編為一個獨立的空軍部門將確保戰略一致性並建立一個新的軍種。"
 DEN_flyvertaktisk_kommando: "丹麥空軍司令部"
 DEN_flyvertaktisk_kommando_desc: "僅僅把兩個不同的空軍分支合併成一個部隊是不夠的。為了讓這個新的軍事部門儘可能高效和協調，我們需要創建一箇中央指揮結構來適當地協調空軍。"
 DEN_air_force_power_projection: "空軍力量投射"
 DEN_air_force_power_projection_desc: "如今，丹麥空軍已被整合為我軍的第三個獨立軍種，我們可以專注於保護廣闊領土上方的天空。一支規模龐大、能打勝仗的空軍仍然需要依賴空軍基地，進行起飛和降落。"
 DEN_flyveskolen: "飛行學校"
 DEN_flyveskolen_desc: "為了將我們所有的空軍技能和知識整合進入丹麥空軍，我們應該通過創建一個聯合訓練學校，將這些專業知識傳授給有志於成為軍官的學員。"
 DEN_torpedofly: "魚雷機"
 DEN_torpedofly_desc: "我們唯一能夠維持海外領土的方式就是能夠在水面上展示我們的力量和意志。這需要大規模的海空協調戰略。"
 DEN_jagerfly: "獵空戰機"
 DEN_jagerfly_desc: "為了保護城市免受來自天空的破壞性轟炸，我們集航空資源於一體，建造盡己所能的最棒的戰鬥機。"
 DEN_luftstotte: "風中支援"
 DEN_luftstotte_desc: "空軍最能派的上用場的地方，是儘可能地支持地面部隊。空戰在當代戰爭中意義非凡，但戰爭之勝果依舊得靠地面部隊摘得。"
 DEN_bombefly: "天降正義"
 DEN_bombefly_desc: "保證[DEN.GetNameDef]絕對安全的唯一方法，是有能力轟炸並摧毀敵方工業能力。"
 DEN_advanced_flight: "飛行進步"
 DEN_advanced_flight_desc: "我軍航空能力在近幾年內進步斐然，但未來仍有更多的壯心和改進在等著我們。若要主宰天空，我們就必須主導技術進步領域。"
