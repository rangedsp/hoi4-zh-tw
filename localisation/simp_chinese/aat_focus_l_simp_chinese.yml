 FIN_socialist_welfare_if_laaltonen_tt: "\n如果完成該國策之前，§Y$FIN_aimo_aaltonen$§!被任命為國家領導人，則效果為："
 FIN_socialist_welfare_if_kuusinen_tt: "\n如果完成該國策之前，§Y$FIN_otto_wille_kuusinen$§!被任命為國家領導人，則效果為："
 FIN_military_aid_subsidies_tt: "為§Y[ROOT.GetName]§!添加[?ROOT.FIN_basic_subsidies_value|Y2]£GFX_civ_factory_output 的裝備補貼，與§Y每個主要盟國§!交易§Y$small_plane_airframe$§!、§Y$medium_plane_airframe$§!、§Y$light_tank_chassis$§!、§Y$medium_tank_chassis$§!、§Y$artillery_equipment$§!、§Y$anti_air_equipment$§!和§Y$anti_tank_equipment$§!時可用。"
 FIN_military_aid_equipment_tt: "\n我們將從盟國獲取裝備。"
 FIN_cooperation_with_germany_subsidies_tt: "為§Y[ROOT.GetName]§!添加[?ROOT.FIN_basic_subsidies_value|Y2]£GFX_civ_factory_output 的裝備補貼，與§Y[GER.GetName]§!交易§Y$small_plane_airframe$§!、§Y$medium_plane_airframe$§!、§Y$light_tank_chassis$§!、§Y$medium_tank_chassis$§!、§Y$artillery_equipment$§!、§Y$anti_air_equipment$§!和§Y$anti_tank_equipment$§!時可用。"
 FIN_strengthen_military_administration_history_entry: "軍功授勳"
 FIN_confederated_finno_russian_republics_dec_cat_tt: "解鎖§Y$FIN_confederated_finno_russian_republics_category$§!決議，允許我們整合擁有芬蘭人口的前[SOV.GetAdjective]地區成為§Y[ROOT.GetNameDef]§!的核心地區。"
 FIN_confederated_finno_russian_republics_state_modifier_tt: "\n§Y所有由[ROOT.GetNameDef]控制的[SOV.GetNameDef]核心地區§!："
 FIN_join_the_comintern_leader_tt: "\n當共產主義[ROOT.GetFlag]§Y[ROOT.GetNonIdeologyName]§!加入由斯大林的[SOV.GetFlag]§Y[SOV.GetName]§!領導的陣營時，§Y$FIN_otto_wille_kuusinen$§!會成為國家領導人。"
 FIN_foreign_aircraft_equipment_and_subsidies_tt: "\n從§Y願意向我們出售裝備的國家§!購入飛行器裝備。\n為§Y[ROOT.GetName]§!添加[?ROOT.FIN_basic_subsidies_value|Y2]£GFX_civ_factory_output 的裝備補貼，與§Y願意向我們出售裝備的國家§!交易§Y$small_plane_airframe$§!時可用。\n出售國：\n"
 FIN_foreign_armor_equipment_and_subsidies_tt: "\n從§Y願意向我們出售裝備的國家§!購入裝甲車輛裝備。\n為§Y[ROOT.GetName]§!添加[?ROOT.FIN_basic_subsidies_value|Y2]£GFX_civ_factory_output 的裝備補貼，與§Y願意向我們出售裝備的國家§!交易§Y$light_tank_chassis$§!時可用。\n出售國：\n"
 FIN_foreign_armor_equipment_only_tt: "\n從§Y願意向我們出售裝備的國家§!購入裝甲車輛裝備。\n出售國：\n"
 FIN_foreign_aircraft_equipment_only_tt: "\n從§Y願意向我們出售裝備的國家§!購入飛行器裝備。\n出售國：\n"
 SWE_loyalty_laws: "忠誠法案"
 SWE_loyalty_laws_desc: ""
 SWE_organize_a_putsch: "組織政變"
 SWE_organize_a_putsch_desc: "我們終於在[SWE.GetAdjective]人民中獲得了足夠的支持以控制國會。誤入歧途的民主派和社會主義者無疑會對此加以抵制，但我們的拳頭已經硬起來了，可以將這些忘記了什麼是[SWE.GetAdjective]人的傢伙置之不理。"
 SWE_delegation_to_berlin: "委託柏林"
 SWE_delegation_to_berlin_desc: "儘管我們已在號召群眾加入事業這一方面取得了巨大進展，但所獲的支持度仍未足以奪取國家政權。不過，傳言稱[GER.GetLeader]或有意派遣[GER.GetAdjective]軍隊援助我國鬥爭，當然這是有代價的。"
 SWE_civil_war_tt: "§R將在§!§Y[ROOT.GetFlag][ROOT.GetName]§!§R觸發民族社會主義者和現任政府之間的內戰！§!"
 SWE_delegation_to_berlin_tt: "如果§Y[GER.GetFlag][GER.GetNameDef]§!接受請求，他們會在該國內戰中加入§Y[ROOT.GetFlag][ROOT.GetAdjective]§!民族社會主義者一方，同時§R[ROOT.GetFlag][SWE.GetNameDefCap]將成為[GER.GetNameDef]的傀儡國！§!"
 SWE_king_in_council: "國王入主議會"
 SWE_king_in_council_desc: "古斯塔夫國王初登王位時，[SWE.GetAdjective]政壇中尚有龐大勢力供其驅使。然而在他統治期間，對民主制抱有烏托邦式幻想的理想主義政客一直在削弱他的權威。必須恢復國王自古以來的權力，扭轉這一逆天悖理的事態。"
 SWE_king_in_council_tt: "§Y保王派§!成為執政黨。"
 SWE_restoring_order: "恢復秩序"
 SWE_restoring_order_desc: "我們奪取權力不可不謂之英勇，但公共秩序也隨之崩潰。為了鼓動民眾加入我們的事業，必須讓其信服我們有能力讓我國再次偉大。那些依舊反對我們的人，則必須被斬草除根。"
 SWE_the_new_order: "新秩序"
 SWE_the_new_order_desc: "適者生存是我們的核心信仰。因此，是時候摧毀虛弱的[GER.GetName]並宣告我國再次以獨立自主的列強地位屹立於世了。"
 SWE_the_new_order_tt: "完成$SWE_the_new_order$後，我們將與[GER.GetNameDef]的所有敵國無條件和平。"
 SWE_the_new_order_tt_2: "§Y[SWE.GetName]§!將改名為§Y$SWE_the_new_order$§!"
 SWE_the_new_order_peace_message: "瑞典已經反抗德國"
 SWE_mythologize_swedish_history: "反向革命"
 SWE_mythologize_swedish_history_desc: "我們已奪取了對國家政權的控制，但之後須得確保對權力的控制，前路依舊漫漫。是故，我們須得實施一波改革，既讓政治上支持我們的人滿意，同時也能剷除掉抵制我等權威的頑固分子。"
 SWE_mythologize_swedish_history_tt: "解鎖決議並激活任務，以履行之前支持民族主義者崛起掌權的派系的義務。§R未能履行義務將對穩定度造成極大衝擊！§!"
 SWE_crisis_affecting_variables: "如果滿足以下條件他們會更有可能接受：\n-他們§Y對我們的評價較高§!\n-我們的§Y陸軍§!比他們更強\n-他們的§Y戰爭支持度低於40%§!\n-他們未加入陣營"
 SWE_narvik_crisis: "納爾維克危機"
 SWE_narvik_crisis_desc: "納爾維克是我國鐵礦石在冬季的主要出口通道，具有重要戰略意義。時代風雲變幻，為確保本國安全，當地須得置於我國管轄治下。若能順帶削弱[NOR.GetName]，那就再好不過了。"
 SWE_bornholm_crisis: "博恩霍爾姆危機"
 SWE_bornholm_crisis_desc: "幾個世紀前爆發的叛亂使我們失去了博恩霍爾姆群島，儘管我國從未在法理上將其讓與[Den.GetName]。群島控制著下波羅的海，具有重要戰略意義，而[Den.GetName]顯然守護不了這裡。為我國安全計，我們有能力且必須重新控制它。"
 SWE_the_aland_issue: "奧蘭問題"
 SWE_the_aland_issue_desc: "奧蘭人講瑞典語，把自己當瑞典人，要不是國際聯盟從中作梗，早就歸瑞典祖國了。他們怎麼得出的結論，覺得奧蘭人不是瑞典人的？是時候糾正這一歷史不公了。"
 SWE_join_the_anti_soviet_pact: "加入反蘇條約"
 SWE_join_the_anti_soviet_pact_desc: "大多數國家都擔心[SOV.GetNameDef]的崛起，但除反共產國際協定締約國之外，他們幾乎沒有採取任何措施來防止其影響力的傳播。我們也應該加入這個協定來表明我們的意圖。"
 SWE_join_the_anti_soviet_pact_tt: "我們將建立與[GER.GetName]的利益關係，使得他們在§Y2年內§!攻擊§Y[DEN.GetName]§!和§Y[NOR.GetName]§!的可能性大減。"
 SWE_demand_atlantic_resource_rights: "要求大西洋資源開採權"
 SWE_demand_atlantic_resource_rights_desc: "我們已成功損耗了[DEN.GetAdjective]的主權，如今須得採取下一步行動，以保護該國免遭入侵為由，入侵該國在大西洋當中的領土。"
 SWE_demand_demilitarization_of_finnish_border: "芬蘭去軍事化"
 SWE_demand_demilitarization_of_finnish_border_desc: "作為我們重新整合[FIN.GetName]計劃的一部分，我們須得在繼續損害其主權的同時，使其在面對東方[SOV.GetAdjective]威脅上仍保有一定防衛能力。因此，我們須得推動該國對我國邊界非軍事化，因此如若我等使出武裝干涉的下策，他們沒法就組織起良好的抵抗。"
 SWE_united_kingdoms_of_sweden_and_norway: "瑞典和挪威聯合王國"
 SWE_united_kingdoms_of_sweden_and_norway_desc: "納爾維克危機之後，我們爭取到了一系列成果，[NOR.GetName]如今既虛弱又失落。如今，我們必須對[NOR.GetAdjective]的獨立進行最後一擊，迫使兩國一統於同一領袖治下。"
 SWE_swedish_finnish_defense_agreement: "瑞典-芬蘭防衛協定"
 SWE_swedish_finnish_defense_agreement_desc: "[SOV.GetNameDef]威脅一日不止，我們同[FIN.GetAdjective]軍隊的合作就一日不休。總有一日我們會收復故土；但如今我們有亟需合力抵抗的外在威脅。"
 SWE_swedish_finnish_defense_agreement_faction: "瑞典-芬蘭防衛協定"
 SWE_danish_alignment: "瞄準丹麥"
 SWE_danish_alignment_desc: "[DEN.GetName]坐擁戰略性位置，國力卻顯著弱於其鄰國，鄰國攻略[DEN.GetAdjective]之獨立實乃天命難違。因此，我們得在機會白白跑走前先手出擊。"
 SWE_finnish_integration: "半壁江山"
 SWE_finnish_integration_desc: "近幾年，我國成功侵蝕了[FIN.GetAdjective]的主權。如今，我們須得做出最終處置，要求該國再次成為我國合法領土。如果他們不願如此，我們就只好用武力再要求一次了。"
 SWE_crusade_against_bolshevism: "[AAT_crusade_against_sov]"
 SWE_crusade_against_bol: "反布爾什維聖戰"
 SWE_crusade_against_rus: "反俄帝國主義聖戰"
 SWE_crusade_against_bolshevism_desc: "[SOV.GetNameDefCap]是數百年來對傳統歐洲價值觀的至大威脅。單純遏制已不足矣，我們亟需進行一場反布爾什維主義的新徵程，將其焚燬殆盡。"
 SWE_crusade_against_bolshevism_tt: "\n如果在§Y$SWE_crusade_against_the_eastern_threat$§!生效期間，§Y[SWE.GetName]§!或任意陣營成員佔領以下任意地區：\n§Y[195.GetName]§!、§Y[206.GetName]§!、§Y[202.GetName]§!、§Y[242.GetName]§!、§Y[219.GetName]§!、§Y[137.GetName]§!、§Y[218.GetName]§!、§Y[217.GetName]§!、§Y[252.GetName]§!、§Y[249.GetName]§!、§Y[229.GetName]§!、§Y[247.GetName]§!、§Y[408.GetName]§!、§Y[214.GetName]§!，它將會重置為完整的365日。"
 SWE_reclaiming_the_rus: "光復羅斯"
 SWE_reclaiming_the_rus_desc: "我們的祖先曾幾度沿西俄和烏克蘭的河流而上，在河岸邊定居。現在是時候將這些地區整合進我們的領地，並且完成他們通過殖民開始的事業了。"
 SWE_greater_nordic_reich: "大北歐國"
 SWE_greater_nordic_reich_desc: "僅憑武力，我們就證明了自己是斯堪的納維亞無可爭議的新霸主。但我族的時代方興未艾——團結於一國之下，世界瑟瑟發抖之始。"
 SWE_greater_nordic_reich_tt: "允許核心化併吞並§Y北歐§!附屬國"
 SWE_the_cross_we_bear: "共負十架"
 SWE_the_cross_we_bear_desc: "我們是北歐國家，我們是手足。親族有難，橫遭戕害；[SWE.GetAdjective]決不能漠視。當務之急乃是把他們從枷鎖中解放出來，如此，我們將在北境同生死共存亡，免受戰亂暴政。"
 SWE_the_cross_we_bear_tt_1: "所有被佔領的§Y北歐§!國家："
 SWE_the_cross_we_bear_tt_2: "所有被解放的§Y北歐§!國家："
 SWE_the_cross_we_bear_tt_3: "提高§Y$SWE_the_cross_we_bear$§!的強度："
 SWE_scandinavian_defense_union: "斯堪的納維亞防衛聯盟"
 SWE_scandinavian_defense_union_desc: "最近的衝突表明，墨守孤立之中立是極其危險的。我們如果想要避免未來遭四方之敵圍攻，就得同北歐鄰國共同締約：任一締約國受到的攻擊視作對所有締約國的攻擊。"
 SWE_the_threat_of_the_iron_curtain: "鐵幕的威脅"
 SWE_the_threat_of_the_iron_curtain_desc: "戰爭促成全球秩序重新洗牌，戰勝國之間的緊張局勢已開始醞釀。若我們想避免在波羅的海問題上被對手一一擊破，就亟需加入志同道合的國家間聯盟來阻止潛在的惡意企圖。"
 SWE_special_forces: "投資特種部隊"
 SWE_special_forces_desc: "現代戰爭時常需要小股特種部隊，其可在惡劣地形或敵後執行任務，且不需要增援。因此，我們應建立一個特種部隊兵種，必要時使其充任[SWE.GetAdjective]軍隊的急先鋒。"
 SWE_acquire_ww2_tanks_and_wrecks: "獲取戰場坦克殘骸"
 SWE_acquire_ww2_tanks_and_wrecks_desc: "隨著歐陸戰事平息，我們可將留在戰場上的無數廢棄坦克用於改進自主設計的研發項目中。我們也許應該在其他國家聲索這些戰利品前利用這一情況。"
 SWE_extend_the_time_of_preparedness: "延長戰備狀態"
 SWE_extend_the_time_of_preparedness_desc: "雖然有些人希望[ROOT.GetName]立刻迴歸常態，但地平線上依舊敵影重重。為了維持我等保家衛國的能力，我們仍須延續目前的戰備狀態和對全面防禦的投入。"
 SWE_increase_intelligence_funding: "增加情報投入"
 SWE_increase_intelligence_funding_desc: "[SWE.capital.GetCapitalVictoryPointName]近年來已成為間諜活動的中心之一。我們應該增加對情報部門的投入，使其開發新的諜報技術，並在各路間諜活動威脅到國家利益前發揮好積極的監測作用。"
 SWE_karnvapenprogram: "核武計劃"
 SWE_karnvapenprogram_bonus: "核武計劃加成"
 SWE_karnvapenprogram_nuclear_bonus: "核武計劃核研究加成"
 SWE_karnvapenprogram_air_bonus: "核武計劃空軍加成"
 SWE_ger_swe_nuclear_bonus: "德國-瑞典鈾工程增益"
 SWE_karnvapenprogram_desc: "核武器發展日新月異，保家衛國的唯一途徑就是自主研發核武器及其運載系統。通過開發原子能及常規武器來打掩護，我們或可在不驚動列強的情況下成功造出核武器。"
 SWE_specialized_equipment: "專用軍事裝備"
 SWE_specialized_equipment_desc: "新特種部隊的訓練進展順利。不過，如果能有合適的專用裝備與載具，他們就可以更加高效地執行任務。"
 SWE_specialized_equipment_tt: "基於先前選擇的特種部隊（遊騎兵、空降兵或海軍陸戰隊）解鎖專用裝備。"
 SWE_something_something_neutrality_butt_really: "中立性之臀"
 SWE_something_something_neutrality_butt_really_desc: "TODO"
 SWE_the_lion_of_the_north_rises: "北方雄獅崛起"
 SWE_the_lion_of_the_north_rises_desc: "長期以來，瑞典一直置身全球列強爭霸之外。正因如此，列強對我們橫加無理要求與各種封鎖。舊日不再——北方雄獅已經再度崛起，佔據北境霸主之位。"
 SWE_preemptive_strike: "先發制人"
 SWE_preemptive_strike_desc: "許多人希望我們置身事外，但我們不能承擔重蹈覆轍的代價了。我們要在對手壯大乃至自主研發出核武器前襲擊他們。只要以迅雷不及掩耳之勢襲擊，我們就能讓他們猝不及防。"
 SWE_war_games: "戰爭推演"
 SWE_war_games_desc: "我們已經沒有藉口向對手掩飾我們的地緣政治立場了。因此，讓軍隊參與模擬與對手交戰的戰爭推演也不會讓我們再失去什麼。"
 SWE_scramble_for_the_baltic: "爭奪波羅的"
 SWE_scramble_for_the_baltic_desc: "波羅的海國家現在佔據的領土在數世紀前曾是瑞典帝國的領域。如果我們想重塑在大波羅的海的霸權，就要搶在[GER.GetAdjective]或[SOV.GetAdjective]之前迅速行動收復這些領土。"
 SWE_economic_integration: "與[GER.GetNameDef]整合經濟"
 SWE_economic_integration_desc: "奪權之路鮮血淋漓，舉國蕭然百廢待興。我國工業已是支離破碎，自當併入更廣袤的[GER.GetAdjective]經濟，汲取他們強勁的經濟實力。"
 SWE_economic_independence: "保持經濟獨立"
 SWE_economic_independence_desc: "[GER.GetAdjective]為我們光榮的革命雪中送炭，十分感謝！但我們真的沒有給德國當行政區的打算。如果要重建我國經濟，經濟獨立的姿勢至關重要。"
 SWE_military_integration: "與[GER.GetNameDef]整合軍隊"
 SWE_military_integration_desc: "瑞典人早已忘卻如何發動戰爭，但如今可以通過[GER.GetNameDef]來重拾祖先的呼召。兩軍合併，齊頭並進，我們可以為將歐洲從布爾什維主義中解放出來的偉大事業中盡一份應有之力，而[SWE.GetAdjective]民族也將在這場考驗中更加堅強。"
 SWE_military_independence: "保持軍事獨立"
 SWE_military_independence_desc: "[SWE.GetAdjective]兵幹啥不好，非得跟著[GER.GetNameDef]去阿爾卑斯或者北非戰場送死？明明自家的事情都處理不過來。我們必須保持軍事獨立，為面對邊境上的威脅而積攢實力。"
 SWE_germanify_sweden: "擁抱日耳曼文化"
 SWE_germanify_sweden_desc: "愚人妄議兩國異族，但如今現實鐵證如山——瑞典民族實為日耳曼兄弟情誼的手足至親，血脈絕不會說謊。如今已是擺脫異族荼毒之時：自我淨化，重新擁抱日耳曼根源吧！"
 SWE_promote_nordic_identity: "推崇北歐認同"
 SWE_promote_nordic_identity_desc: "北歐和[GER.GetAdjective]文化雖有相似之處，但我們不是[GER.GetAdjective]。我們必須在異族文化的勢焰中珍重並捍衛斯堪的納維亞和芬蘭人民自古以來的獨特文化和傳統。"
 SWE_finland_claims: "再望芬蘭"
 SWE_finland_claims_desc: "[FIN.GetNameDef]乃我國理所應當的領土。藉助新近獲得的力量，我們可以重掌失地。然而，當地最近的衝突使得地緣政治局勢更加複雜，因此我們需要[GER.GetNameDef]的支持來為我們的聲索增添分量。"
 SWE_establish_nordland: "北方保護國"
 SWE_establish_nordland_desc: "我們自[GER.GetNameDef]執掌下的餘燼中重生，並比以往更加強大。如今，我們因忠於事業之名見授嘉獎，我們的霸業將向東方縱深擴展。"
 SWE_establish_nordland_tt: "§Y[SWE.GetNameDef]§!將改名為§Y$SWE_establish_nordland$§!"
 SWE_uranium_project: "[GER.GetAdjective]-[SWE.GetAdjective]鈾工程"
 SWE_uranium_project_desc: "[GER.GetAdjective]科學家數年來一直從事於核研究。他們聲稱原子所含的力量可以釋放為一場驚天動地的爆炸。有了實驗所需重水的獲取途徑和雙方科學技術的聯合，我們或許能幫他們創造這一奇蹟武器。"
 SWE_betray_germany_plan: "向瑞典國前進"
 SWE_betray_germany_plan_desc: "[GER.GetNameDefCap]已是強弩之末，註定要崩潰。因此我們應該制定計劃，通過加快他們的滅亡保障我們自己的未來。不過，只有[GER.GetNameDef]的敵人們願意與我們單獨講和，這個想法才有可能實現。"
 SWE_undermine_the_fascists: "削弱法西斯分子"
 SWE_undermine_the_fascists_desc: "那群互相爭奪權力的法西斯分子不過是一群憤怒的烏合之眾，若有機會定會把國家引向毀滅。我們必須削弱其支持度，確保真正熱愛祖國的人們都忠於國王。"
 SWE_revoke_anti_militia_laws: "撤銷反武裝組織法"
 SWE_revoke_anti_militia_laws_desc: "由於蒙克部隊的存在曝光，國會中鼠目寸光的政治家們在1934年禁止了準軍事組織的成立。由於我國出現越來越多的社會主義者和其他叛徒，為了確保國家的安全，我們必須撤銷這項禁令，併成立一支全新的衝鋒隊。"
 SWE_revoke_anti_militia_laws_tt: "創建一個§YStormtrupper§!民兵師編制並在[SWE.GetFascistParty]掌權後解鎖§Y招募衝鋒隊§!決議。"
 SWE_unify_the_national_socialist_movement: "統一民族社會主義運動"
 SWE_unify_the_national_socialist_movement_desc: "民族社會主義運動已經分裂成了諸多派系，因各種雞毛蒜皮的小事而相互攻訐，乃至街頭鬥毆。只有一位強而有力的領袖和堅定的主張，才有機會帶領他們成立一個合格的政府"
 SWE_unify_the_national_socialist_movement_tt_1: "下列事件之一將被執行："
 SWE_unify_the_national_socialist_movement_tt_2: "或者："
 SWE_unify_the_national_socialist_movement_tt_3: "解鎖在已招募衝鋒隊地區增加法西斯支持率的決議。"
 SWE_meet_with_the_king: "覲見國王"
 SWE_meet_with_the_king_desc: "[SWE.GetName]民族主義的崛起引起了國王的注意。他已要求召集支持者的領導者前往王宮，論述他們的意圖。"
 SWE_meet_with_the_king_tt: "解鎖通過[SWE.GetName]王室巡幸提高君主主義運動支持率的決議"
 SWE_attack_Landsorganisationen: "攻訐全國總工會"
 SWE_attack_Landsorganisationen_desc: "若想將祖國從布爾什維主義中解救出來，社會民主黨就是一座我們必須翻越的大山。與其在無休止的繁雜選舉中對抗他們，不如利用我們手中的資源來煽動民眾，讓人民敵視那些支持社民黨的工會。"
 SWE_appeal_for_support: "尋求支持"
 SWE_appeal_for_support_desc: "[SWE.GetName]貴族階層的權力與影響數十年來一直在衰退，但尚未消失。通過號召他們提供支持與資源，我們能讓國家迴歸到一個更自然的政府形式。"
 SWE_appeal_for_support_tt: "解鎖為民族主義運動獲取政治支持的§Y“尋求支持”決議§!。"
 SWE_align_more_closely_with_the_landsorganisationen: "與全國總工會加強合作"
 SWE_align_more_closely_with_the_landsorganisationen_desc: "任何現代勞動力都必須有強大的工會和工人保護。我們將與這些工會建立牢固的聯繫，以改善所有工人的生活。"
 SWE_align_more_closely_with_the_landsorganisationen_tt: "解鎖顧問：\n"
 SWE_socialist_reforms: "社會主義改革"
 SWE_socialist_reforms_desc: "我們已經在國會獲得了足夠的權力，是時候為一個真正的社會主義共和國奠定基礎了。為了鞏固地位，我們必須迅速推行改革，限制資產階級的影響力，並藉此贏得無產階級人民的支持。"
 SWE_socialist_reforms_tt: "§Y人民之家§!現在提供§Y科研§!加成，相當於§Y$MODIFIER_CONSUMER_GOODS_FACTOR$§!的25%。\n§Y人民之家§!現在提供§Y$BONUS_PRODUCTION_EFFICIENCY_CAP_FACTOR$§!加成，相當於§Y$MODIFIER_CONSUMER_GOODS_FACTOR$§!的50%。"
 SWE_ture_nerman_tt: "$SWE_ture_nerman$"
 SWE_fredrik_strom_tt: "$SWE_fredrik_strom$"
 SWE_zeth_hoglund_tt: "$SWE_zeth_hoglund$"
 SWE_police_reforms: "預防反革命行動"
 SWE_police_reforms_desc: "不出所料，我們的政策使得貴族與資產階級中出現了很多強大的反對者。如果我們想要防止他們發動反革命，就必須迅速將他們連同無產階級中的所有叛徒一起斬草除根。"
 SWE_refuge_from_war: "戰亂避風港"
 SWE_refuge_from_war_desc: "戰爭，不可避免地導致政權更易，總有一些人擔心自己生命安全而逃亡。許多逃亡者都有一技之長，可以為我們所受益。因此，我國肯定可以找到一個互利的安排。"
 SWE_refuge_from_war_tt: "依照該國共產主義支持率，從每個目前不是共產主義的國家獲得人力。§Y北歐國家§!和§Y主要國家§!可能提供大部分人力，§Y次要國家§!則提供小部分。可能獲得的人力總數上限：§G+80000§!\n基於目前世界局勢可獲得的人力總數：§G+[?SWE_refugee_from_war_total_manpower_gained]§!\n提供人力最少的國家：§Y[?SWE_refugee_min_manpower_country.GetName]§!：§G+[?SWE_refugee_min_manpower_gained]§!\n提供人力最多的國家：§Y[?SWE_refugee_max_manpower_country.GetName]§!：§G+[?SWE_refugee_max_manpower_gained]§!\n平均從每個國家獲得的人力：§G+[?SWE_refugee_from_war_average_manpower_per_country]§!"
 SWE_refuge_for_revolutionaries: "革命者的避風港"
 SWE_refuge_for_revolutionaries_desc: "儘管社會主義必將實現，但仍有很多失敗的革命運動，許多革命者被困在了那些背叛了無產階級的國家裡。我們的態度很明確，即所有革命者都能在[SWE.GetName]得到安全的住所和實現理想的希望。"
 SWE_refuge_for_revolutionaries_tt: "其他國家的共產主義顧問將視其本國政治局勢而被轉移至[SWE.GetName]。當前，以下顧問會被轉移至[SWE.GetName]："
 SWE_liquidate_the_monarchy: "清算君主制"
 SWE_liquidate_the_monarchy_desc: "是時候將君主制這一[SWE.GetName]的寄生蟲一網打盡了。王室與貴族階層將被剝奪頭銜，而他們的財產將被重新分配給人民群眾。"
 SWE_establish_politburo: "成立政治局"
 SWE_establish_politburo_desc: "資產階級與貴族精英們已經隨著他們的權力一同消亡了，為了清除他們殘存的影響力，我們將解散國會，並建立一個全新的工人政府以取而代之。"
 SWE_five_year_plan: "國家計劃委員會"
 SWE_five_year_plan_desc: "隨著政治局建立和工業國有化，我們現在需要一個可以監管經濟事務，並向政治局中央委員會提供政策建議的機構。"
 SWE_peoples_commissar_for_defense: "國防人民委員"
 SWE_peoples_commissar_for_defense_desc: "終有一日，全世界的工人將團結起來，所有國界都將消失。在那一天到來之前，我們必須保持警惕，防備任何對我國領土的入侵。為了監管國防事務，我們需要建立一個全新的、沒有前任貴族影響的國防部。"
 SWE_starve_the_fascists_of_iron: "斷供敵國鐵礦"
 SWE_starve_the_fascists_of_iron_desc: "我們絕不會重蹈他國為綏靖未來的敵人而向敵人提供資源，卻只讓敵人得以挑起戰爭的覆轍。從今天開始，我們將禁止所有資源出口至法西斯，包括他們覬覦的鐵礦石。"
 SWE_finnish_buffer_state: "芬蘭緩衝國"
 SWE_finnish_buffer_state_desc: "[SOV.GetNameDef]傾向於讓同與其利益瓜葛緊密的人來掌控[SWE.GetAdjective]國事。為防止兩國間爆發衝突，使得[FIN.GetName]成為兩國利益共在的緩衝國就是十分必要的了。"
 SWE_support_norwegian_communists: "支持挪威共產黨"
 SWE_support_norwegian_communists_desc: "在[NOR.GetName]掙脫資產階級的統治之前，我們的安全永遠無法得到保障。然而，他們不可能接受我們強加給他們的社會主義政府。因此，我們必須為[NOR.GetAdjective]的共產主義同志們提供支持，幫助他們推翻現有的秩序。"
 SWE_support_danish_communists: "支持丹麥共產黨"
 SWE_support_danish_communists_desc: "[DEN.GetName]作為連接北海與波羅的海的戰略要地，對於我們國家的安全至關重要。為了確保他們不會背叛，我們必須支持[DEN.GetAdjective]的共產主義運動，並扶持一個友好的政權。"
 SWE_sami_reconcilliation: "與薩米人和解"
 SWE_sami_reconcilliation_desc: "薩米人在過去的幾個世紀裡飽經苦難，國家剝奪了他們的土地和權利。我們將竭盡所能去彌補犯下的過錯，並嘗試推進與薩米人民的和解。"
 SWE_deep_mining_complexes: "深層採掘綜合體"
 SWE_deep_mining_complexes_desc: "[SWE.GetName]地底蘊藏著豐富的自然資源。我們應在礦業上加大投資，從而更好地利用當地資源。除此之外，我們也可以摧毀這些礦區，讓敵人永遠得不到他們想要染指的東西。"
 SWE_affordable_housing: "經濟適用房"
 SWE_affordable_housing_desc: "城裡的住房條件總體向好，但仍有大把大把的人被高額租金困在貧民區中。我們必須確保每個人都能住得起經濟適用房，以此姑且先補救下局面。"
 SWE_continue_the_second_industrial_revolution: "延續第二次工業革命"
 SWE_continue_the_second_industrial_revolution_desc: "持續工業化是促進我國繁榮與安全的關鍵。因此，我們必須利用新技術的力量並在全[SWE.GetName]進一步推進工業化。"
 SWE_paid_holidays: "公薪休假"
 SWE_paid_holidays_desc: "導致勞資關係緊張的一個重要因素是休假。私企為了利潤最大化，僅會在法律限制內按最低標準來給工人放假。如今已是國家干預，管理全國休假以造福工人的時候了。"
 SWE_paid_holidays_policy_tt: "年內大部分時間§G+3%§!§Y穩定度§!和§G+5%§!§Y建設速度§!。\n年內30日§Y+20%生活消費品§!"
 SWE_privately_managed_holidays: "企業自主排假"
 SWE_privately_managed_holidays_desc: "國家沒道理干涉企業決策。因此，我們得允許私企自己管自己的休假政策，工人要是不滿意的話，何不炒老闆的魷魚然後另找個班上。"
 SWE_kockums: "考庫姆"
 SWE_kockums_desc: "考庫姆已經證明其有能力為海軍生產艦船與潛艇。我們應該擴大他們的經營並提升他們的艦船產能。"
 SWE_gotaverken: "約塔韋爾肯"
 SWE_gotaverken_desc: "為了使海軍現代化，我們需要擴建在約塔韋爾肯的造船廠並投資用於建造戰艦的新式製造技術。"
 SWE_refit_gotaverken_for_rapid_repairs: "改建約塔韋爾肯以實現快速維修"
 SWE_refit_gotaverken_for_rapid_repairs_desc: "專用於維修的船塢可能降低我們建造艦船的速度，但這將改進我們讓艦隊保持戰鬥狀態的能力。"
 SWE_retool_dockyards: "改裝船塢"
 SWE_retool_dockyards_desc: "注重於小型艦船與潛艇而非嘗試與大國競爭才能發揮我們的優勢。"
 SWE_archapeligo_harrasment: "群島襲擾"
 SWE_archapeligo_harrasment_desc: "我國海岸阻擋了所有潛在的侵略者。不過，通過撥給海軍更多資源，我們可以善用對群島的熟悉程度，不斷騷擾該地區的敵艦。"
 SWE_unrestricted_submarine_warfare: "無限制潛艇戰"
 SWE_unrestricted_submarine_warfare_desc: "潛艇有能力侵擾敵方航運與艦隊，後者一旦受損，維修成本不低。我們應善用之，以此縮小我國海軍與敵軍裝備間的差距。"
 SWE_lindholmens_varv: "林德霍爾門造船廠"
 SWE_lindholmens_varv_desc: "林德霍爾門造船廠專注民船建造持續數年，略加調整即可改裝為海軍與現代化事業擴張的利器。"
 SWE_italian_destroyers: "購買意大利驅逐艦"
 SWE_italian_destroyers_desc: "從零開始新建船隻成本不可謂不高昂，但不少國家也許願意出手一批舊型艦艇。譬如[ITA.GetNameDefCap]，已經表示有興趣按極合理的價格向我們出手一批驅逐艦。"
 SWE_italian_ships_tt: "將導致[ROOT.GetFlag][ROOT.GetName]：\n"
 SWE_italian_ships_tt_2: "\n§R[ENG.GetNameDefCap]可能會攔截艦艇交付！§!"
 SWE_rule_the_baltic: "統治波羅的"
 SWE_rule_the_baltic_desc: "波羅的一日不受控，[SWE.GetName]就一日不寧。為此，我們亟需建造大型船舶的專業知識，這可以承接鄰國的先進設計來進行。"
 SWE_defense_act: "防衛法案"
 SWE_defense_act_tt: "§Y我們將能夠在即將到來的選舉中改換政治領袖。§!"
 SWE_defense_act_desc: "戰爭的陰霾再次籠罩在歐洲上空，國會亟需做出一系列艱難的抉擇，其中最要緊的莫過於對防衛法案的投票，以及其可能導致的執政聯盟分裂的問題。"
 SWE_strike_the_capitalist_beast_down: "打倒資本家"
 SWE_strike_the_capitalist_beast_down_desc: "瑞典工人階級困於資產階級枷鎖太久。儘管社民黨自以為能稀釋掉資本主義的剝削本性，但只有社會主義能給選民以真相。資本主義不能被修正，資本主義必須被廢除。"
 SWE_social_democracy: "社會民主主義"
 SWE_social_democracy_desc: "在對瑞典的願景上，社民黨人並非憑依於恐懼或憤怒，而是希望。希望，要支持社會中最弱勢的群體，如此可為所有人實現安穩幸福。經由多方合作與善意釋放，我們終將創建人民之家。"
 SWE_as_the_barometer_falls: "山雨欲來風滿樓"
 SWE_as_the_barometer_falls_desc: "我們承受不起敵國入侵時依舊措手不及，無論原因為何。因此，我們必須確保武裝部隊持有應急計劃並訓練充分，以此應對任何此類狀況。"
 SWE_the_old_enemy_stirs: "舊敵新歸"
 SWE_the_old_enemy_stirs_desc: "在經歷一場血腥的內戰以及一個十年的大規模工業化後，[SOV.GetNameDef]正試圖重掌前沙皇俄國的舊地並繼續外擴。如果我們希望避免陷入[SOV.GetName]的勢力範圍，就需要迅速行動，準備鬥爭。"
 SWE_license_skf_ball_bearings: "斯凱孚滾珠軸承"
 SWE_license_skf_ball_bearings_desc: "斯凱孚如今已是滾珠軸承製造的世界龍頭企業，而這種零件對許多現代軍用載具生產都無比重要。在與陷入戰爭中的國家進行貿易談判時，我們應利用這一優勢。"
 SWE_en_svensk_tiger: "瑞典虎"
 SWE_en_svensk_tiger_desc: "敵人能挖出來的任何我方信息都可能成為日後我們國家安全的威脅。為了防止這種情況，如虎一般的堅強與沉默必須成為[SWE.GetAdjective]國民性的一部分。"
 SWE_swedes_not_sweden_to_finlands_aid_post_fin_war: "援芬的是瑞典人，不是瑞典"
 SWE_swedes_not_sweden_to_finlands_aid_pre_fin_war: "瑞典志願軍團"
 SWE_swedes_not_sweden_to_finlands_aid: "[SWE_FinnishVolunteerFocusLoc]"
 SWE_swedes_not_sweden_to_finlands_aid_desc: "政府層面不可能在維護國家中立的前提下積極援助[FIN.GetName]軍隊，但仍有成千上萬的[SWE.GetAdjective]公民已經準備好成為志願軍，豁出性命去保衛我們的北歐鄰國。"
 SWE_swedes_not_sweden_to_finlands_aid_tt: "\n會自動升級為："
 SWE_swedes_not_sweden_to_finlands_aid_tt_2: "當[FIN.GetName]與主要國家交戰"
 SWE_finlands_cause_is_ours: "芬國猶我"
 SWE_finlands_cause_is_ours_desc: "[SOV.GetAdjective]的劍鋒所指，今天是[FIN.GetName]，明天就要輪到我們。宿怨當頭，遺恨不息；我們決不能漠視眼下門前的衝突，必須與[FIN.GetAdjective]並肩抗敵。"
 SWE_coalition_war_cabinet: "民主戰時內閣"
 SWE_coalition_war_cabinet_desc: "最近世界各地發生的事件震動了這個國家，人們擔心[SWE.GetName]會被捲入衝突。為了在這個艱難的時期促進團結，我們將建立一個由國會主要政黨的領導成員組成的聯合戰時內閣。"
 SWE_coalition_war_cabinet_tt: "§Y解鎖為我國現任領導人添加特質的決議§!"
 SWE_the_aland_question: "[145.GetName]問題"
 SWE_the_aland_question_desc: "[SOV.GetNameDef]打算重新染指[FIN.GetName]，我們可不能任其佔去[145.GetName]這一戰略要地。這片群島與我國一衣帶水，未來或將成[SOV.GetAdjective]空海實力投射進[SWE.GetAdjective]勢力範圍的大本營。"
 SWE_the_aland_question_tt: "相較於§Y§Y$SWE_the_aland_issue$§!§!，§Y[FIN.GetName]§!在此情形更有可能同意交出§Y奧蘭§!的控制權，除非§Y[SWE.GetName]§!的陸軍規模遠大於§Y[FIN.GetName]§!"
 SWE_the_nordic_defense_council: "北歐防務理事會"
 SWE_the_nordic_defense_council_desc: "如果僅依靠我們自己，每一個北歐國家都很容易成為某個擴張主義鄰國的獵物。但是，通過共同承擔集體防禦的責任，我們可以對任何未來的侵略者形成真正的威懾。首先，我們需要在潛在的組織成員間締結一項防務條約。"
 SWE_nordic_defense_fleet: "北歐防務艦隊"
 SWE_nordic_defense_fleet_desc: "隨著北歐防務協定的簽署，我們的海軍艦隊也將逐漸整合在統一的指揮系統之下。"
 SWE_nordic_defense_fleet_tt: "所有§Y北歐防務理事會成員國§!附屬國類型：\n轉移海軍給§Y[SWE.GetName]§!"
 SWE_nordljus: "建造北極光級"
 SWE_nordljus_desc: "我國海軍無法與波羅的海周遭其他強國相抗衡，因此亟需一艘新旗艦來與強敵相搏。如此龐大的工程定將對北歐經濟產生負面影響，但現實就是如此簡單直白：\n\n凡以兵起，必以兵終。"
 SWE_nordljus_tt: "所有§Y北歐防務理事會成員§!獲得："
 SWE_nordljus_tt_2: "該生產線將從§Y60%§!完成度開始"
 SWE_centralized_military_aid: "集中軍事產業"
 SWE_centralized_military_aid_desc: "我們需要提高我國和成員國的軍事能力。投資軍備生產將為各國軍隊提供保衛國境的工具。"
 SWE_centralized_military_aid_tt: "所有§Y北歐防務理事會成員§!獲得：\n    加§G1§!建築位\n    加§G1§!§Y軍用工廠§!"
 SWE_merge_army_complexes: "合併陸軍複合體"
 SWE_merge_army_complexes_desc: "集中我們的軍事複合體能提高效率，而讓各成員國自主運營則有在遭到入侵時失去產業的風險。"
 SWE_merge_army_complexes_tt: "每個§Y北歐防務理事會成員§!：§R-1§!§Y軍用工廠§!\n（§Y[SWE.GetName]§!）每有一個§Y北歐防務理事會成員§!§G+1§!§Y軍用工廠§!"
 SWE_nordic_centralized_air_command: "北歐中央空軍司令部"
 SWE_nordic_research_exchange: "北歐科研交流"
 SWE_nordic_research_exchange_desc: "北歐各國都有先進技術，不互相分享成果就太可惜了。"
 SWE_nordic_protection_complex: "北歐防務複合體"
 SWE_nordic_protection_complex_desc: "我們北歐國家都希望和平。我們唯一真正渴望的是在北方生活、在北方老去、在北方埋葬的基本權利。如果有人試圖奪走我們的權利，他們也會被埋在這裡。"
 SWE_nordic_protection_complex_tt: "所有§Y北歐防務理事會成員國§!獲得：\n  加§G1§!建築位\n  加§G1§!§Y民用工廠§!"
 SWE_decentralized_nordic_volunteer_group: "北歐志願軍組織"
 SWE_decentralized_nordic_volunteer_group_tt: "每個§Y北歐防務理事會成員§!獲得§G+5000§!人力\n每個§Y北歐防務理事會成員§!：每存在一個§Y北歐防務理事會成員§!§G+5000§!人力"
 SWE_decentralized_nordic_volunteer_group_desc: "北歐有許多有條件從軍的人才，比如獵人、神槍手以及其他從事類似行業的人。我們要找到並徵募他們。"
 SWE_nordic_centralized_air_command_desc: "空中的防線已成為現代戰爭的一條關鍵戰線，但在此領域追趕先進技術的成本卻高昂得很。為了兼顧強力防衛與可接受價位，我們應該組建聯合的北歐空指部。"
 SWE_nordic_centralized_air_command_tt: "所有§Y北歐防務理事會成員國§!附屬國類型：\n轉移空軍給§Y[SWE.GetName]§!"
 SWE_train_the_sheltered: "訓練難民"
 SWE_train_the_sheltered_desc: "北歐地區的衝突導致鄰國難民多來[SWE.GetName]避難。這些人中不少都在適役年齡區間內，我們可以要求他們協防本國。"
 SWE_the_narvik_solution: "納爾維克方案"
 SWE_the_narvik_solution_desc: "納爾維克對我國鐵礦石運輸至關重要，因而成為交戰國保護或破壞的目標。為了維持我國的中立和出口貿易，我們必須以[NOR.GetName]之名控制納爾維克，從而緩解該區域的緊張局勢。"
 SWE_icelandic_independence: "冰島獨立"
 SWE_icelandic_independence_desc: "TODO"
 SWE_cement_control_of_the_baltic: "鞏固波羅的海控制"
 SWE_cement_control_of_the_baltic_desc: "我們如果在波羅的海上建立海軍力量投射，就能確保戰爭永不會觸及北歐國家的海岸。"
 SWE_seek_foreign_guarantees: "尋求外國保障"
 SWE_seek_foreign_guarantees_desc: "TODO"
 SWE_ga_pa_tactics: "“Gå-på”突擊戰術"
 SWE_ga_pa_tactics_desc: "[SWE.GetName]曾經是戰場上運用高機動性部隊的先驅，這比坦克的出現還要早許久。現在是我們重燃創新精神，發展適於本國的閃電戰形式的時候了。"
 SWE_winter_drill: "冬季演習"
 SWE_winter_drill_tt: "§Y背水一戰§!花費§G-25%§!\n"
 SWE_winter_drill_desc: "唯有在徹底的意義上操練我軍將士，方能在徹底的意義上掌握[SWE.GetAdjective]地形、利用天氣作優勢。如此，縱使敵軍數倍於己，優勢不失。"
 SWE_research_slot_1: "[AAT_Sweden_royal_institute_name]"
 SWE_research_slot_1_desc: "在國家科學工程專業知識上精益求精，對於維持現代化強軍事業來說至關重要。為此，我們將投資擴建[AAT_Sweden_royal_institute_name]。"
 SWE_RIT_communist: "理工學院"
 SWE_RIT_historical: "王室理工學院"
 SWE_infrastructure: "基礎設施投資"
 SWE_infrastructure_desc: "[SWE.GetName]大部仍屬農村，欠發達程度令人堪憂。我們應該彌補這一不足，更好地利用我們的自然資源。"
 SWE_varnplikt: "兵役義務"
 SWE_varnplikt_desc: "合同兵的規模太小，不足以在侵略性鄰國面前捍衛我國主權。因此，我們將實施義務兵役制，確保所有適役年齡的男子接受最起碼的軍事訓練。"
 SWE_per_albin_bus: "[SWE.GetLeader]巴士"
 SWE_per_albin_bus_desc: "敵國火力兇猛，政府很有可能因空中的或地上的突襲而遭斬首。為了防止這種情況發生，我們需要一個可移動的政府總部，即使險象環生，仍能同武裝部隊和民眾保持聯繫。"
 SWE_per_albin_bus_tt: "創建一個可移動總部單位，使我國領導人能夠撤離。然而，如果巴士被毀，這對我國首相來說可不是好兆頭。"
 SWE_land_air_warfare: "地空作戰"
 SWE_land_air_warfare_desc: "武裝部隊各兵種的專業訓練和裝備大相逕庭，但如果以地空同時壓制的方式展開合作，區別在戰場上就顯得富有成效了。"
 SWE_totalforsvar: "全面防禦"
 SWE_totalforsvar_desc: "正如我們曾經懷疑的那樣，當下衝突正不可避免地發展為全面戰爭。因此，我們需要將經濟轉向戰時生產，以此為我軍部隊提供保家衛國所需的裝備。"
 SWE_totalforsvar_tt: "禁用解除經濟動員任務"
 SWE_jagartrupper: "獵手部隊"
 SWE_jagartrupper_tt: "允許消耗§Y人力§!派遣精英遊騎兵破壞毗鄰敵佔地區的港口和補給中心。\n沒有地形特質的陸軍指揮官將獲得§Y林地遊俠§!特質"
 SWE_jagartrupper_desc: "敵軍有數量優勢時，必須限制其機動能力或補給獲取能力後才能公平地交戰。我們可以利用小規模的特戰部隊滲透敵軍防線並破壞他們在關鍵地點的基礎設施。"
 SWE_hedgehog_defense: "刺蝟防禦"
 SWE_hedgehog_defense_desc: "我們將“刺蝟”戰術派上用場，以此提高我們在縱深作戰中的防禦效果。這種戰術主要是在在敵軍可能包繞的可防禦陣地上部署小股部隊。亮點在於，操縱這些小股部隊可以耗盡敵軍的機動性，使其十分容易受擊。"
 SWE_a_plea_of_desperation: "絕望的盡頭"
 SWE_a_plea_of_desperation_desc: "周遭皆是意圖毀滅我國主權之敵，如此走投無路之境，唯有苟且於潛在盟友身下，此乃絕境逢生的唯一齣路。"
 SWE_rapid_response_force: "快速反應部隊"
 SWE_rapid_response_force_desc: "通過維持一支快速反應的裝甲載具部隊，在必要時可以迅速在前線重新部署，我們既可以擁有坦克優勢，又不需要支持大量坦克列裝。"
 SWE_hemvarnet: "家園衛隊"
 SWE_hemvarnet_tt: "允許成立地方軍單位，在戰時可作緊急單位啟用"
 SWE_hemvarnet_desc: "志願者數以千計，可以將過時的裝備配發給他們，命令其保衛所屬區域戰略要地。這將在很大程度上防止軍隊在保家衛國的過程中一家獨大、過度擴張。"
 SWE_lottakaren: "婦女志願防衛組織"
 SWE_lottakaren_desc: "[SWE.GetName]的女性像男性一般願意保家衛國。我們可以資助一個組織，招募並培訓從事非前線任務的婦女，如此可補充武裝部隊的缺口，並提高我國的國防能力。"
 SWE_rapid_mobilization: "快速動員"
 SWE_rapid_mobilization_desc: "舉國因面對侵略者的威脅而害怕地喘不動氣。考慮到鄰國慘象，我們不能再有任何由於，必須充分動員武裝部隊來捍衛我國主權。"
 SWE_rapid_mobilization_tt: "允許在民主主義下將徵兵法案最高提升至§Y按要求服兵役§!"
 SWE_secret_mobilization: "秘密動員"
 SWE_secret_mobilization_desc: "如果調兵遣將過於明目張膽，有可能刺激到敵國，並使之發動我們最不願意見到的入侵。因此，我們必須謹慎行事，避免引起懷疑。"
 SWE_tank_development: "坦克研發"
 SWE_tank_development_desc: "雖然我們沒法如其他國家那般大規模裝備裝甲載具，但仍可以在設計與生產方面取得質的提升。"
 SWE_per_albin_line: "[SWE.GetLeader]防線"
 SWE_per_albin_line_tt: "在馬爾默及海峽附近的關鍵防衛區域、內陸維納恩湖與韋特恩湖附近的咽喉要道以及哥特蘭和斯德哥爾摩添加要塞。"
 SWE_per_albin_line_desc: "[SWE.GetName]的海岸線廣闊且缺少防備。為了防止敵軍登陸我們的海岸，我們需要沿岸修建一條防禦工事線，藉此將敵人趕回波羅的海。"
 SWE_swedish_shooting_movement: "瑞典射擊運動"
 SWE_swedish_shooting_movement_desc: "[SWE.GetAdjective]射擊運動近百年來組織的射擊場與射擊競賽提升了平民的射擊水平與必要時的戰鬥意願。鑑於眼下我們所處的混亂局勢，也許我們應該投資這個組織。"
 SWE_swedish_shooting_movement_tt: "每級家園衛隊§G+400§!人力\n每級家園衛隊§Y+100§!單位的$SWE_infantry_equipment_0$到儲備中。\n部署的家園衛隊師初始經驗從§Y10%§!提高到§Y30%§!\n部署的家園衛隊師初始裝備比例從§Y60%§!提高到§Y90%§!\n部署的家園衛隊師初始人力比例從§Y70%§!提高到§Y90%§!"
 SWE_mobilization_of_society: "社會動員"
 SWE_mobilization_of_society_desc: "從工廠工人到內閣大臣，每個人都必須願意為保衛祖國做出犧牲。為了[SWE.GetName]的延續，我們會無所不為，即使是要將資源轉移至軍備生產或是拿起武器。"
 SWE_end_the_fubkrieg: "現代戰術，現代戰爭"
 SWE_end_the_fubkrieg_desc: "近年來，戰爭日新月異，我們不能白費精力讓軍隊按照舊時的戰爭備戰。確保他們掌握最新戰術對保衛國家至關重要。"
 SWE_let_fly_all_guns: "全火力齊射"
 SWE_let_fly_all_guns_desc: "儘管我國沒有與他國一般豐富的產業種類，我國確有一些頂尖的武器製造商。通過一些額外投資，我們便可充分運用其才能，使我軍位於戰爭科技之前沿。"
 SWE_operation_save_denmark: "行動：拯救丹麥"
 SWE_operation_save_denmark_desc: "雖然我們曾與[DEN.GetName]有數世紀的分歧，但今日我們與之同在，並準備好將之從暴政中解放。"
 SWE_operation_save_norway: "行動：拯救挪威"
 SWE_operation_save_norway_desc: "數百年來，[NOR.GetName]與[SWE.GetName]的歷史相互交織。坐視外國勢力踐踏其人民是無法容忍的。我們必須制定在有機可乘時解放他們的計劃。"
 SWE_nordic_liberation_movement: "北歐解放運動"
 SWE_nordic_liberation_movement_desc: "TODO"
 SWE_central_nordic_army_command: "集中式北歐陸軍司令部"
 SWE_central_nordic_army_command_desc: "通過集中北歐防務理事會成員國的陸軍，我們可以將各國力量組成一個緊密相連的整體進行更高效的運用。"
 SWE_central_nordic_army_command_tt: "\n所有§Y北歐防務理事會成員國§!將轉移軍隊和人力給[SWE.GetName]。\n除§Y[SWE.GetName]§!外的所有§Y北歐防務理事會成員國§!獲得："
 SWE_central_nordic_army_command_tt_2: "如果滿足以下條件他們會更有可能接受：\n-他們§Y對我們的評價高§!\n-我們的§Y陸軍§!比他們更強\n-我們與他們的§Y政體§!相同\n-我們§Y保障他們獨立§!"
 SWE_decentralized_nordic_army_command: "分佈式北歐陸軍司令部"
 SWE_decentralized_nordic_army_command_desc: "集中北歐防務理事會的軍隊指揮權會帶來太多的利益衝突。每個成員國的國家安全的唯一保障是保持對其自身部隊的控制。"
 SWE_decentralized_nordic_army_command_tt: "\n所有§Y北歐防務理事會成員國§!獲得：§Y廣泛徵兵§!。\n所有§Y北歐防務理事會成員國§!獲得："
 SWE_decentralized_nordic_army_command_tt_2: "所有§Y北歐防務理事會成員國§!："
 SWE_neither_death_nor_dishonor: "不為玉碎，不作瓦全"
 SWE_neither_death_nor_dishonor_tt: "$MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$：§G+4%§!\n$MODIFIERS_ARMY_CORE_ATTACK_FACTOR$：§G+4%§!\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$：§G+4%§!\n$MODIFIER_INDUSTRIAL_CAPACITY_DOCKYARD_FACTOR$：每個與§Y[SWE.GetName]§!處於同一陣營的北歐國家或每個§Y$autonomy_aat_defense_council_member$§!§G+4%§!"
 SWE_neither_death_nor_dishonor_desc: "北歐正處於生死存亡之際。西有嗥叫不止的德國惡狼；東有虎視眈眈的布爾什維克，隨時準備將他們的紅色匕首插入我們的腹地。我們必須化筆為劍、以黠作甲。\n我們不會在兩隻惡魔間做選擇，玉碎或瓦全都是不可接受的。"
 SWE_prevent_a_red_dictatorship: "防範紅色獨裁"
 SWE_prevent_a_red_dictatorship_desc: "社民黨不過是共產黨的特洛伊木馬。若要防止瑞典落入蘇聯的勢力範圍，我們必須確保選民使民族主義政黨掌控瑞典議會。以任何必要的手段。"
 SWE_defense_in_depth: "縱深防禦"
 SWE_defense_in_depth_desc: "沒有任何一支軍隊擁有無限的動力，這基本上是因為補給線和士兵人體極限的限制。因此，更強大的防禦形式不是在被刺穿時即刻崩潰的剛性防線，而是逐漸剝奪敵人動力的多重防線。"
 SWE_beneath_sticks_and_stones: "木石之下"
 SWE_beneath_sticks_and_stones_desc: "如果敵機在戰場上看不到目標，它們就會失去很多效率。通過訓練我們部隊的偽裝技術，我們可以剝奪敵人這一關鍵優勢。"
 SWE_norma_projektilfabrik: "諾瑪彈藥廠"
 SWE_norma_projektilfabrik_desc: "諾瑪彈藥廠自上世紀以來就在為[SWE.GetName]和[NOR.GetName]提供彈藥。擴大他們的生產能力將長期有效地維持我們軍隊的穩定彈藥供應。"
 SWE_norma_projektilfabrik_tt: "§Y[NOR.GetNameDef]§!滿足以下條件時，獲得§G1§!座額外的§Y軍用工廠§!：\n與主要國家交戰\n投降進度超過0%\n§Y[SWE.GetNameDef]§!：未與§Y挪威§!交戰"
 SWE_government_weapons_contract: "政府武器合同"
 SWE_allow_landsverk_to_operate: "允許蘭斯韋克獨立經營"
 SWE_allow_landsverk_to_operate_tt: "§R與[GER.GetNameDef]交戰將使2間瑞典境內的蘭斯韋克工廠被廠內的[GER.GetAdjective]工人暫時破壞§!"
 SWE_government_weapons_contract_desc: "[SWE.GetName]舉國上下有不少擅長軍火製造的公司。我們如果要為全面戰爭做好準備，就需要通過簽訂軍事裝備合同來刺激這些公司發展壯大。"
 SWE_bofors_fly_swatter: "博福斯“蒼蠅拍”"
 SWE_bofors_fly_swatter_desc: "博福斯有為防空技術樹立全新標準的潛力。我們應該向他們提供資源為此努力，並確保敵軍飛機不會出現在瑞典的天空。"
 SWE_husqvarna_vapenfabrik: "胡斯克瓦那軍用工廠"
 SWE_husqvarna_vapenfabrik_desc: "胡斯克瓦那擁有為[SWE.GetAdjective]軍隊製造小型武器裝備的悠久歷史。是時候擴大他們的工業基礎並利用他們的專業知識推動軍隊現代化了。"
 SWE_work_projects_for_the_unemployed: "失業者復工項目"
 SWE_work_projects_for_the_unemployed_desc: "能自食其力者不得崗位，就會參與到激進主義運動當中去。我們如果不想民眾集體造當局的反，就得為失業者創設復工項目。"
 SWE_bofors_anti_tank_gun: "博福斯反坦克炮"
 SWE_bofors_anti_tank_gun_tt: "啟用§H博福斯反坦克炮§!\n反坦克炮支援連對裝甲攻擊：§G+10%§!\n反坦克炮支援連穿甲深度：§G+10%§!\n反坦克炮對裝甲攻擊：§G+10%§!\n反坦克炮穿甲深度：§G+10%§!\n摩托化反坦克炮對裝甲攻擊：§G+10%§!\n摩托化反坦克炮穿甲深度：§G+10%§!\n輕型自行反坦克炮對裝甲攻擊：§G+10%§!\n輕型自行反坦克炮穿甲深度：§G+10%§!\n中型自行反坦克炮對裝甲攻擊：§G+10%§!\n中型自行反坦克炮穿甲深度：§G+10%§!\n重型自行反坦克炮對裝甲攻擊：§G+10%§!\n重型自行反坦克炮穿甲深度：§G+10%§!\n超重型自行反坦克炮對裝甲攻擊：§G+10%§!\n超重型自行反坦克炮穿甲深度：§G+10%§!\n現代自行反坦克炮對裝甲攻擊：§G+10%§!\n現代自行反坦克炮穿甲深度：§G+10%§!"
 SWE_bofors_anti_tank_gun_desc: "博福斯在製造武器方面的精湛技術是我們不可或缺的寶藏。只需一些投資，他們就能創造出新一代反坦克炮，足以應對我國敵手可能部署的最厚重的裝甲車輛。"
 SWE_landverk_l_62: "蘭斯韋克 L-62"
 SWE_landverk_l_62_desc: "在蘭斯韋克坦克方案和博福斯反坦克炮的成功基礎上，我們可以創造一個世界級水準的移動防空平臺，即使是最嚴苛的調遣需求也能滿足。"
 SWE_form_saab: "建立薩博"
 SWE_form_saab_desc: "[SWE.GetName]有許多飛機制造商在競爭利潤豐富的政府合同。合併他們，我們就可以以高性價比的方式利用他們所有的專業知識。"
 SWE_domestic_designs: "國產飛機設計"
 SWE_domestic_designs_desc: "隨著薩博的建立，我們就可以利用他們的設計和工程專業知識來製造符合[SWE.GetAdjective]空軍特定要求的飛機。"
 SWE_foreign_designs: "學習外國飛機設計"
 SWE_foreign_designs_desc: "我們不應該浪費時間去重新發明其他國家已經擁有的東西。薩博的專業知識可以通過改型和製造從國外獲得許可的設計來更好地發揮作用。"
 SWE_foreign_designs_tt: "從每個與我們意識形態相同且未與我們交戰的主要國家獲得§Y1x§!用於§Y飛行器§!的§G35%§!科研加成。"
 SWE_formation_flying: "編隊飛行"
 SWE_formation_flying_desc: "維持堅固的空中防線需要組織良好的戰鬥機集群以快速應對潛在的威脅。"
 SWE_marauder_bombers: "掠奪者轟炸機"
 SWE_marauder_bombers_desc: "最近的經驗表明，從空中摧毀地面目標的能力往往在戰鬥中起決定性因素。它甚至可能被證明是徹底結束戰爭的手段。"
 SWE_airforce_modernization: "空軍現代化"
 SWE_airforce_modernization_desc: "如果我們的空軍不能充分利用最新式的裝備，那麼給他們配備最新式的裝備是沒有意義的。我們應該確保我們飛行員的最新經驗被納入我們的空軍學說。"
 SWE_the_barrel: "“圓桶”噴氣機"
 SWE_the_barrel_desc: "最近的衝突加速了航空領域的技術發展。因此，我們需要跟上潛在對手的步伐，開發自己的噴氣式飛機來保護我們的天空。"
 SWE_rockets: "火箭推進"
 SWE_rockets_desc: "雖然噴氣式飛機令人印象深刻，但火箭技術為我們提供了製造速度更快和射程更遠的一次性武器的能力，而無需進行昂貴的飛行員培訓。"
 SWE_radiojanst: "廣播電臺"
 SWE_radiojanst_desc: "廣播電臺每天都提供文化活動和新聞的廣播，事實證明其很受公眾歡迎。，我們可以通過增加節目種類來擴大廣播電臺規模，同時使得民眾跟得上時事熱點。"
 SWE_urbanization: "城市化"
 SWE_urbanization_tt: "解鎖使用§Y政治點數§!獲得§Y民用工廠§!和§Y海軍船塢§!的決議"
 SWE_urbanization_desc: "工業化和城市化實為一體之兩翼。城市裡的崗位越多，來自鄉村的人口遷移也就越多。我們如果要避免城市落得擁擠不堪的貧民窟的下場，就需要投資擴建基礎設施，為即將到來的人口增長做好準備。"
 SWE_hygenic_housing: "衛生住房"
 SWE_hygenic_housing_tt: "§Y衛生住房政策會隨著時間推移，從南曼蘭開始擴散，每兩個月將有一個新的核心州獲得該修正。§!"
 SWE_hygenic_housing_desc: "太多人居住在擁擠不堪的貧民窟中，這根本稱不上是人能住的環境。我們需要搞好整個地區的衛生工作，確保每個人都有機會獲得衛生而實用的住房。"
 SWE_vasa_ii: "[SWE_vasa_ii_loc]"
 SWE_vasa_ii_desc: "如今已是建造繼承傳奇之瓦薩號名字的戰艦之時。希望這次，它有機會能在戰鬥中證明自己的實力。"
 SWE_vasa_ii_communist: "紅色颶風"
 SWE_vasa_ii_default: "瓦薩II號"
 SWE_coastal_support: "海岸支援"
 SWE_coastal_support_desc: "我們的海軍應該進行完全的訓練以進行炮火支援對敵國海岸的兩棲攻擊。"
 SWE_all_cards_on_deck: "一擲乾坤"
 SWE_all_cards_on_deck_desc: "海上曠日持久的小規模衝突無法改變戰爭的進程。我國的海軍一旦出海，目標就該是一舉擊潰敵人。"
 SWE_decisive_battle_tactics: "艦隊決戰戰術"
 SWE_seize_landsverk: "奪取蘭斯韋克"
 SWE_kp_bill: "機械化裝甲越野車"
 SWE_kp_bill_desc: "近期的戰事發展已經證明在有需要時快速重新部署部隊的能力是十分必要的。目前我們正在使用改裝的民用卡車應付這項任務，但一個為此目的專門建造的裝甲運輸工具將能在戰鬥中起到更多作用。"
 SWE_lynx_winter_armored_cars: "山貓裝甲車"
 SWE_lynx_winter_armored_cars_desc: "如果戰火蔓延到了[SWE.GetName]，那麼機動性對於我們的防禦將至關重要。開發一種現代化的，專業生產的裝甲車將為我們的部隊提供一個在戰場上偵查和攻擊軟目標的必要工具。"
 SWE_lynx_armored_car_tt: "啟用§Y山貓裝甲車§!，其效果為：\n§Y裝甲車§!和§Y$armored_car_recon$§!：\n 對裝甲攻擊：§G+10%§!\n 穿甲深度：§G+10%§!\n 組織度：§G+5§!\n\n§Y裝甲車§!：\n§Y森林：§!\n 移動修正改變：§G+15%§!\n 攻擊修正改變：§G+20%§!\n§Y沙漠：§!\n 移動修正改變：§R-40%§!\n 攻擊修正改變：§R-20%§!\n§Y雪地：§!\n 移動修正改變：§G+35%§!\n 攻擊修正改變：§G+20%§!"
 SWE_lynx_armored_car_recon_company_tt: "\n§Y$armored_car_recon$§!：\n§Y森林：§!\n 移動修正改變：§G+5%§!\n 攻擊修正改變：§G+5%§!\n§Y沙漠：§!\n 移動修正改變：§R-15%§!\n 攻擊修正改變：§R-15%§!\n§Y雪地：§!\n 移動修正改變：§G+8%§!\n 攻擊修正改變：§G+5%§!\n\n"
 SWE_standardize_equipment: "標準化裝備"
 SWE_standardize_equipment_desc: "長期以來我們的軍隊使用著繁雜的小型武器，其中一些甚至來自於上個世紀。這使得保證部隊的彈藥供應變得極其困難且易受干擾。我們應當通過將武器彈藥標準化來解決這個問題。"
 SWE_standardize_equipment_trigger_tt: "陸軍正在使用的步兵裝備多於§Y13000§!"
 SWE_individual_liberty_and_prosperity_for_all: "減貧優先"
 SWE_individual_liberty_and_prosperity_for_all_desc: "很明顯，崗位越多，脫貧越快。話雖如此，此事仍得與國防之剛需進行平衡支出。"
 SWE_defense_above_all: "國防高於一切"
 SWE_defense_above_all_desc: "我們必須面對這樣的事實：世界和我們處在不同的時間表上。我們不能再忽視國防，拿國家的未來冒險了。"
 SWE_volvo: "沃爾沃"
 SWE_volvo_desc: "沃爾沃以製造堅固可靠的零部件和車輛而聞名。我們應該在其成功的基礎上，使其卡車和發動機的民用設計適應軍用。"
 SWE_allow_landsverk_to_operate_desc: "蘭斯韋克一直被[GER.GetAdjective]軍隊作為繞過凡爾賽和約限制發展裝甲車輛的漏洞運轉著。我們應該繼續允許他們運轉，以此與[GER.GetName]保持緊密聯繫並利用他們的技術發展。"
 SWE_sieze_landsverk: "奪取蘭斯韋克"
 SWE_sieze_landsverk_desc: "蘭斯韋克一直被[GER.GetAdjective]軍隊作為繞過凡爾賽和約限制發展裝甲車輛的漏洞運轉著。政府中的一些人主張我們應該奪取這家公司，以此與[GER.GetAdjective]戰爭機器保持距離。"
 SWE_saltsjobaden_agreement: "接受薩爾特舍巴登協議"
 SWE_saltsjobaden_agreement_desc: "勞資不和正變得一發不可收拾起來，使國家捲入進退兩難的境地。我們如果要抵抗來自邊境外的威脅，就需要團結一致。因此，我們必須出臺一部協議，儘量減少勞資糾紛帶來的麻煩與干擾。"
 SWE_reject_saltsjobaden: "拒絕薩爾特舍巴登協議"
 SWE_reject_saltsjobaden_desc: "這紙協議必須被駁回。它要剝奪資方自主經營企業的權利，要砍掉工人不滿時撤出勞動的權力。沒人能從這種安排中獲益。"
 SWE_ring_a_ding_ding: "軍用自行車"
 SWE_ring_a_ding_ding_desc: "自行車可能不像裝甲車或坦克那麼威風，但它們能以低成本提升機動性。"
 SWE_aquire_modern_panzers: "獲取現代裝甲車輛"
 SWE_aquire_modern_panzers_desc: "技術停滯是造成看似強大的國家在戰時崩潰的可信原因之一。因此，為了防止重蹈覆轍，我們要優先為陸軍獲取現代裝甲車輛。"
 SWE_military_academy: "軍事學院"
 SWE_military_academy_desc: "近年來，軍隊各部門都積累了大量經驗。通過建立軍事學院體系，我們可以確保他們的知識代代相傳。"
 SWE_surface_raiders: "水面襲擊"
 SWE_surface_raiders_desc: "只需一些可以快速建成的小型艦船，我們就能擾亂敵人的海運與部隊轉移，對他們的戰爭準備造成嚴重損害。"
 SWE_rationing: "配給制"
 SWE_rationing_desc: "我們仍然對世界大戰強加給[SWE.GetName]無辜人民的經濟鬥爭記憶猶新。我們需要建立食品、燃料與其他必需品的配給系統避免災禍重現。"
 SWE_rationing_tt: "解鎖以少量§Y戰爭支持度§!、§Y穩定度§!或§Y消費品§!為代價執行配給政策的決議。可以執行的政策包括：\n"
 SWE_folkhemmet_modification_tt: "§Y人民之家§!追加效果："
 SWE_education_reform: "城市兒童"
 SWE_research_slot_2: "擴建烏普薩拉大學"
 SWE_research_slot_2_desc: "烏普薩拉大學是北歐地區歷史最悠久的大學，安德斯-賽爾修斯、卡爾-林奈和雅各布-貝澤柳斯等名人都曾在此就讀。隨著世界的變遷，科學顯然是不確定世界中最強大的武器，投資於這樣一所著名的大學必將獲得成功。"
 SWE_education_reform_desc: "阿爾瓦·米達爾的著作《城市兒童》著重討論了國家在兒童發展中的作用，這在教育工作者中引發轟動。阿爾瓦與其丈夫貢納爾以他們的新書《人口問題的危機》也引發了一波有關社會政策的討論。或許，我們應該把這對著作等身的夫婦帶進內閣，使其理論成為實踐。"
 SWE_economic_deregulation: "放鬆經濟管制"
 SWE_economic_deregulation_desc: "國之存亡當頭，福利支出實為無甚所謂。因此，我們不得不砍掉一些預算，掐掉繁瑣的規矩，以此使私企能夠填上國家撤出後留下的空白。"
 SWE_economic_deregulation_tt: "移除§Y人民之家§!"
 SWE_approach_the_allies: "接觸同盟國"
 SWE_approach_the_allies_desc: "[ENG.GetNameDefCap]及其盟國最終定能拿下歐洲戰事的勝利果實。因此我們要明確表達無意為敵的態度。這才是穩妥的辦法。"
 SWE_join_allies_for_colonies: "交易殖民地"
 SWE_join_allies_for_colonies_desc: "我國與同盟國間關係日趨緊密，現有機會重獲往昔遍佈世界各地的殖民地，代價是加入他們的軍事聯盟。"
 SWE_universal_basic_income: "全民基本收入"
 SWE_universal_basic_income_desc: "每個男人和女人都應該至少能保證自己的存活，而且關心國民也是國家的義務。建立全民基本收入制度乃一舉兩得。"
 SWE_universal_basic_income_tt: "新徵服的地區初始獲得§G+25%§!順從度與§Y0%§!抵抗度"
