 ### JOINT FOCUS TREE ###
 NORDIC_form_joint_alliance: "成立[NORDIC_get_alliance_name]"
 NORDIC_form_joint_alliance_desc: "1864年未能團結一致，泛斯堪的納維亞夢想遭受嚴重挫折。[NORDIC_GetFormAllianceSecondParagraph]"
 NORDIC_form_joint_alliance_desc_dem: "然而，基於我們共同的民主價值觀組建一個新的聯盟可以成為世界各地民主國家的燈塔，同時仍然可以保衛自己並迅速戰勝自由的敵人。"
 NORDIC_form_joint_alliance_desc_com: "然而，通過無產階級革命的推動，我們可以通過將我們各國加入北方人民聯盟，將我們的人民團結起來，集中精力反對資本主義。"
 NORDIC_form_joint_alliance_desc_mon: "然而，植根於我們共同的長期傳統的皇家遺產使我們能夠看到更大的圖景並團結一致，保護我們摯愛的國王和王后。"
 NORDIC_political_cooperation: "政治合作"
 NORDIC_political_cooperation_desc: "口惠而實不至，不足以實現真正的合作。我們如果想要成為一支不可忽視的力量，就需要各系統都成為一個更大的、運轉良好的機器的齒輪。"
 NORDIC_consolidating_institutions: "機構聯合"
 NORDIC_consolidating_institutions_desc: "TODO_NORDIC"
 NORDIC_economic_union: "經濟聯盟"
 NORDIC_economic_union_desc: "我們必須集中資源，畢竟各國互相之間都有需於鄰國或有鄰國之需。打破長期以來將各國經濟隔離開來的壁壘後，我們將實現更高的效率。資源必須在各國之間流動，這樣我們才能更好地互助提攜。"
 NORDIC_procurement_fund: "資助採購"
 NORDIC_procurement_fund_desc: "主要的經濟和軍事強國有能力生產防禦和征服的手段，雖然我們有本土的軍事工業，但相比之下就相形見絀了。我們可能還無法匹敵這種工業實力，但我們可以集中資金來採購大量武器和車輛，這對我們的國防至關重要。"
 NORDIC_shared_intelligence: "共享情報"
 NORDIC_shared_intelligence_desc: "[NORDIC_get_alliance_name]的一切都圍繞著共享力量這一主題。如果說知識就是力量，那麼我們就應該共享對敵情報，以及我們所掌握的敵人所掌握的我們的情報——乃至於我們所掌握的敵人所以為的我們的情報。"
 NORDIC_northern_command: "北境警備隊"
 NORDIC_northern_command_desc: "為了更好地協調各國軍隊行動，我們必須建立聯合軍事司令部。武裝部隊需要順利地共同行動，需要在考慮到各方利益的情況下迅速做出決定。我們應確保司令部順利落成，以便為各國聯合武裝部隊制定進一步的計劃。"
 NORDIC_democratic_institution_1: "北歐部長委員會"
 NORDIC_communist_institution_1: "北方聯邦"
 NORDIC_monarchist_institution_1: "卡爾馬貴族"
 NORDIC_first_joint_institution: "[NORDIC_get_institution_1_name]"
 NORDIC_first_joint_institution_desc: "我們邁出真正一體化與合作的第一步時，[NORDIC_get_alliance_name]需要一個新的機構，[NORDIC_get_institution_1_desc]"
 NORDIC_first_joint_institution_desc_dem: "我們的超國家組織中不同國家的內閣成員可以在這裡討論如何更好地讓我們共同努力，並領導我們的人民應對歐洲日益緊張的局勢。"
 NORDIC_first_joint_institution_desc_com: "它可以團結我們各國人民並保證他們對生產資料的所有權，同時仍然賦予他們自決權。"
 NORDIC_first_joint_institution_desc_mon: "它可以理清我們的貴族關係網，並將它們放入我們貴族同儕的統一星座中，每個人都在權力結構中發揮作用。"
 NORDIC_democratic_institution_2: "北歐最高議會"
 NORDIC_communist_institution_2: "北方政治局"
 NORDIC_monarchist_institution_2: "北方雄獅秘密會議"
 NORDIC_second_institution: "[NORDIC_get_institution_2_name]"
 NORDIC_second_institution_desc: "我們的聯盟比以往任何時候都更加緊密、更加緊密，但這也意味著一個笨重而緩慢的整體。通過建立[NORDIC_get_institution_2_name][NORDIC_get_institution_2_desc]"
 NORDIC_second_institution_desc_dem: "我們可以設立一個代表我們各國選民的立法機構，它擁有面對戰爭迅速採取行動的行政權力。"
 NORDIC_second_institution_desc_com: "我們可以肯定，工人的意志將得到代表，少數人代表多數人一定會以無產階級的最大利益行事。"
 NORDIC_second_institution_desc_mon: "我們可以聚集我們聯合王國中最有權勢的貴族男女，這樣他們就可以勇敢而堅決地接受貴族責任的艱難妥協。"
 NORDIC_nordic_army_democratic: "地面行動部門"
 NORDIC_nordic_army_communist: "北方人民陸軍"
 NORDIC_nordic_army_monarchist: "進擊的雄獅"
 NORDIC_nordic_army: "[NORDIC_get_nordic_army_name]"
 NORDIC_nordic_army_desc: "[NORDIC_get_nordic_army_desc]"
 NORDIC_nordic_army_desc_dem: "[NORDIC_get_nordic_army_name]的作用將是為我們民主國家的不同陸軍建立參數，使其以互補的方式運作。因此，一個國家的長處可以抵消其他國家的弱點，目標是一次一個省份地擺脫整個大陸的壓迫。"
 NORDIC_nordic_army_desc_com: "無論他們來自哪個國家，[NORDIC_get_nordic_army_name]中的所有士兵都是[NORDIC_get_alliance_name]的一部分，並且將通過我們的共同力量和堅定的意志前進，直到消滅資本主義。"
 NORDIC_nordic_army_desc_mon: "[NORDIC_get_alliance_name]的力量不僅僅是軍隊，它們的意義遠不止於此。[NORDIC_get_nordic_army_name]將在同一面旗幟下勇敢戰鬥，為了他們的領主和他們所代表的土地。"
 NORDIC_nordic_navy_democratic: "海軍協調指揮部"
 NORDIC_nordic_navy_communist: "北歐海軍委員會"
 NORDIC_nordic_navy_monarchist: "王室無敵艦隊"
 NORDIC_nordic_navy: "[NORDIC_get_nordic_navy_name]"
 NORDIC_nordic_navy_desc: "[NORDIC_get_nordic_navy_desc]"
 NORDIC_nordic_navy_desc_dem: "海洋的浩瀚將使我們的國家相形見絀，但如果我們聯合起來，我們就可以協同行動，並以更有效的方式利用我們有限的資源，得到超越我們的力量。這將是[NORDIC_get_nordic_navy_name]代表的任務，這無疑是一項艱鉅的任務，但他們將得到[NORDIC_get_alliance_name]的所有資源和支持。"
 NORDIC_nordic_navy_desc_com: "大海屬於人民，[NORDIC_get_alliance_name]決心為北方人民解放而索取它。[NORDIC_get_nordic_navy_name]將確保我們的敵人最後看到的是我們的艦船在紅色地平線上升起。"
 NORDIC_nordic_navy_desc_mon: "[NORDIC_get_alliance_name]聯合海軍將統治我們境內的所有領海。[NORDIC_get_nordic_navy_name]將成為一股浪潮，衝擊我們的敵人，直到敵人只剩下沉船。"
 NORDIC_nordic_airforce_democratic: "北歐空防項目"
 NORDIC_nordic_airforce_communist: "北方空軍人民委員部"
 NORDIC_nordic_airforce_monarchist: "王室聯合空軍"
 NORDIC_nordic_airforce: "[NORDIC_get_nordic_airforce_name]"
 NORDIC_nordic_airforce_desc: "天空是我們聯盟的新疆域。[NORDIC_get_nordic_airforce_desc]"
 NORDIC_nordic_airforce_desc_dem: "這就是為什麼[NORDIC_get_nordic_airforce_name]將管理保護[NORDIC_get_alliance_name]各國公民所需的資源。他們還將確保我們的空軍相互合作並順利開展工作。"
 NORDIC_nordic_airforce_desc_com: "我們不能讓資本主義勢力奪取我們所有人都必須平等分享的自由典範。我們的空軍將席捲敵人的天空，向他們傾瀉地獄之火。"
 NORDIC_nordic_airforce_desc_mon: "如果我們發展我們的空軍規模，我們就能更好地引導我們的力量。我們將讓我們的敵人在我們聯合空軍的威力面前屈服。"
 NORDIC_nordic_research_democratic: "北歐研究理事會"
 NORDIC_nordic_research_communist: "北方人民大學"
 NORDIC_nordic_research_monarchist: "王師學院聯盟"
 NORDIC_nordic_research: "[NORDIC_get_nordic_research_name]"
 NORDIC_nordic_research_desc: "僅憑蠻力並不能贏得戰爭。技術進步賦予了20世紀國家在現代戰爭中的優勢。[NORDIC_get_nordic_research_desc]"
 NORDIC_nordic_research_desc_dem: "[NORDIC_get_nordic_industry_name]將把資金和資源交到正確的人手中，以便我們的士兵和將軍擁有最好的工具來應對戰爭挑戰。先進技術將保護我們免於讓我們的公民白白流血。"
 NORDIC_nordic_research_desc_com: "[NORDIC_get_nordic_industry_name]將成為開發最新破壞手段的研究所，並大規模生產最好的工具，以便這些工具在我們的人民手中可以成為法西斯主義和資本主義的斷頭臺。"
 NORDIC_nordic_research_desc_mon: "北方的王國一直為科學的進步提供空間，[NORDIC_get_nordic_industry_name]將延續這一傳統，將我們王國中所有最優秀的人才團結在一座建築中，他們將通過互相幫助來服務所有的領主。"
 NORDIC_nordic_military_industry_democratic: "北歐軍需品採購"
 NORDIC_nordic_military_industry_communist: "北方人民武器製造"
 NORDIC_nordic_military_industry_monarchist: "王室軍工廠"
 NORDIC_nordic_military_industry: "[NORDIC_get_nordic_military_industry_name]"
 NORDIC_nordic_military_industry_desc: "[NORDIC_get_nordic_military_industry_desc]。如果我們戰鬥到最後一個人，那麼這些人就會用正確的工具打出更強力的一擊。"
 NORDIC_nordic_military_industry_desc_dem: "[NORDIC_get_nordic_industry_name]計劃的建立將確保我們的戰爭機器始終配備其運轉所需的齒輪，並保衛我們的國家免受恐怖和暴政的侵害"
 NORDIC_nordic_military_industry_desc_com: "革命不會保衛自己，同樣，如果沒有我們[NORDIC_get_alliance_name]已經解放的工人的大力推動，革命也不會蔓延"
 NORDIC_nordic_military_industry_desc_mon: "在我們的現代，各個王國在不受控制地迅速衰落，單靠王室精神無法將其從遺忘中拯救出來。我們必須確保我們的國家擁有必要的武器來對抗自身的滅絕"
 NORDIC_nordic_industry_democratic: "北歐工業發展基金"
 NORDIC_nordic_industry_communist: "步調一致的工人們"
 NORDIC_nordic_industry_monarchist: "王室發展研究所"
 NORDIC_nordic_industry: "[NORDIC_get_nordic_industry_name]"
 NORDIC_nordic_industry_desc: "[NORDIC_get_nordic_industry_desc]"
 NORDIC_nordic_industry_desc_dem: "無論有沒有戰爭，我們各國都必須建設必要的基礎設施和資本來支持我們的平民人口並改善他們的生活質量。當然，一旦戰時來臨，它將成為我們戰時經濟的重要基石。"
 NORDIC_nordic_industry_desc_com: "工人是[NORDIC_get_alliance_name]的命脈，也是它存在的理由。通過[NORDIC_get_nordic_industry_name]，我們可以保證參與日常生活用品的生產，並在戰時支撐我們的戰爭機器。"
 NORDIC_nordic_industry_desc_mon: "貴族義務的概念要求我們為我們的臣民提供保障，並建立基礎設施，不僅會贏得他們的青睞，而且在戰爭時期它將成為我們戰時經濟的基礎。[NORDIC_get_nordic_industry_name]將履行此角色，直到不再需要為止。"
