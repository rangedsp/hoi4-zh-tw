l_simp_chinese:
 #Opinion modifiers
 #FINLAND
 FIN_suomalainen_sosialismi: "芬蘭社會主義"
 FIN_suomalainen_sosialismi_desc: "曼納海姆與其同夥在內戰期間犯下的反革命破壞罪行，使卑劣的資本主義苦難得以遍佈我國社會。我們決不能坐視不管，必須找到一條解放工人階級的出路。"
 FIN_towards_a_red_government: "向紅色政府前進"
 FIN_towards_a_red_government_desc: "1918年，當工人革命浪潮席捲全國時，無產階級遭到曼納海姆及其德國盟友反動勢力的出賣。是時候為我們陣亡的同志報仇，並最終創建我們一直想要的工人共和國了。"
 FIN_the_second_finnish_civil_war: "第二次芬蘭內戰"
 FIN_the_second_finnish_civil_war_desc: "通過不斷壯大的無產階級的階級意識的擴展和無產階級領導層的組織能力，我們終於聚集了資源，一勞永逸地推翻我們曾經的資產階級主子。"
 FIN_the_peoples_democratic_league: "人民民主同盟"
 FIN_the_peoples_democratic_league_desc: "人民民主聯盟一直是協調[FIN.GetNameDef]各左翼派系的領導力量。他們已為一個真正的工人同盟打好了基礎，而這個同盟將確保無產階級的意願得到貫徹。"
 FIN_cooperate_with_social_democrats: "與社會民主黨合作"
 FIN_cooperate_with_social_democrats_desc: "儘管社會民主黨人誤入了願意與資本家妥協的歧途，我們仍不能否認他們擁有來自無產階級的大量支持，而且他們中的許多領導者是其領域中的專家。我們應與其加強合作，共建工人共和國。"
 FIN_the_workers_state: "工人國家"
 FIN_the_workers_state_desc: "無產階級專政已經確立，我們可以開始以無產階級利益為先重建國家了。無論是教育下一代還是組織生產工廠，所有陳舊的習慣都需要徹底革新。"
 FIN_the_red_watch: "紅色守望"
 FIN_the_red_watch_desc: "為了重建資本主義暴政，有些人會暗中破壞我們自內戰結束以來所取得的一切成果。通過組建紅衛兵，我們可以確保在這類兩面三刀的行徑遍佈全國之前斬草除根。"
 FIN_approach_the_soviets: "接觸蘇聯"
 FIN_approach_the_soviets_desc: "我們的[SOU.GetNameDef]同志正處於反對資產階級帝國主義鬥爭的前線。我們應該聯繫其領導層，同時嘗試為我們反對[FIN.GetNameDef]資產階級的鬥爭尋求支持。"
 FIN_antagonize_the_soviets: "反抗蘇聯"
 FIN_antagonize_the_soviets_desc: "儘管[SOU.GetNameDefCap]用社會主義包裝自己，但其絕非工人的樂園。我們要找到自己的道路，改善工人階級的生活，同時對[SOV.GetAdjective]的恐嚇說不。"
 FIN_finno_soviet_pact: "蘇芬條約"
 FIN_finno_soviet_pact_desc: "不管歷史恩怨如何，[SOU.GetAdjective]人民已被證明是爭取社會主義鬥爭中值得的盟友。現在是我們兩國政府之間正式達成協議的時候了，為反動的歐洲不可避免的襲擊做好準備。"
 FIN_subsidized_national_industrialization: "補貼國有工業"
 FIN_subsidized_national_industrialization_desc: "[SOU.GetNameDef]已經通過工業化在大規模動員全國生產力上取得了長足進展。也許我們應該請求其專家援助，在芬蘭推出一個類似的計劃。"
 FIN_finnish_learned_societies: "芬蘭學術團體"
 FIN_finnish_learned_societies_desc: "儘管我國許多知識分子已逃往海外，但許多能接受社會主義思想的智者仍然留在國內。我們應該投資他們的研究，從而鼓舞並提拔這些知識分子。"
 FIN_finnish_federation_of_trade_unions: "芬蘭工會聯合會"
 FIN_finnish_federation_of_trade_unions_desc: "工會代表了產業的真正主人——工人群眾。通過與工會聯合會合作，我們將在重組整體經濟時堅持造福工人階級的理念。"
 FIN_defensive_preparations: "防禦性動員"
 FIN_defensive_preparations_desc: "不論意識形態如何，我們似乎註定要與東方鄰國發生衝突。我們必須即刻發展國防，防患未然。一旦有失，我國就將再次陷於敵手之中。"
 FIN_trade_agreements: "貿易協定"
 FIN_trade_agreements_desc: "許多國家願意與我國達成支持我國軍事現代化的貿易協定，即使他們並不總是支持我國國內政策——主要是因為這樣能削弱那些不受待見的我國鄰國的安全感。"
 FIN_finno_estonian_union: "芬蘭-愛沙尼亞聯盟"
 FIN_finno_estonian_union_desc: "我們與愛沙尼亞人民有著悠久的歷史，因此，看到他們被困在大國之間，等待他們的家園成為國際鬥爭的另一個戰場，我們感到痛心。也許通過聯合，我們可以將他們從這樣的命運中拯救出來。"
 FIN_social_democracy: "社會民主主義"
 FIN_social_democracy_desc: "我們已經見證了布爾什維克式革命爆發時將帶來怎樣的失敗和慘劇。如果我們要建立一個永遠為工人階級著想的社會，無論在何處都必須是通過民主且和平的方式。"
 FIN_pragmatic_socialism: "務實社會主義"
 FIN_pragmatic_socialism_desc: "雖然我們憎惡布爾什維克及其同類的方法，但我們並不否認必須採取更多措施將工人階級從現代資本主義的恐怖中解放出來。通過認真運用民主、務實的社會主義，我們將實現這一目標。"
 FIN_sosialistinen_eduskuntaryhma: "社會主義議會黨團"
 FIN_sosialistinen_eduskuntaryhma_desc: "社會主義議會黨團提倡與[SOU.GetNameDef]建立友好關係而非敵對。他們的建議可能是保持我國獨特的社會主義形式，同時不干涉[SOU.GetAdjective]的最好希望。"
 FIN_social_democratic_womens_union: "社會民主婦女聯盟"
 FIN_social_democratic_womens_union_desc: "自古以來，社會中女性的困境一直被忽視。通過讓社會民主黨婦女聯盟更深入地融入政府的核心，我們最終可以解決她們的擔憂，併為所有人創造一個更加公平的社會。"
 FIN_mineral_wealth: "礦業財富"
 FIN_mineral_wealth_desc: "[ROOT.GetNameDefCap]擁有大量未開發的自然資源。如果我們要維持一隻可靠的軍事力量，就應該運用這些資源，提高我國經濟自給程度。"
 FIN_funds_from_kalevala_koru_oy: "卡勒瓦拉珠寶公司資助"
 FIN_funds_from_kalevala_koru_oy_desc: "由社會民主主義婦女聯合會成員建立的一家精細珠寶製造商，卡勒瓦拉珠寶公司，已經成為了一項振奮人心的成功案例。通過運用其精湛技術，我們可以促進經濟並將這一財富用於資助其他事業。"
 FIN_join_the_comintern: "加入[GetSovietFactionForFinland]"
 FIN_join_the_comintern_desc: "我們必須放下對民族主義的過時成見以及伴生的不滿並與[SOU.GetNameDef]合作。我們將在攜手對抗歐洲反動勢力的同時保障自己的未來。"
 FIN_finnish_influence_in_the_baltic: "芬蘭在波羅的海的影響"
 FIN_finnish_influence_in_the_baltic_desc: "波羅的海區域的集體安全取決於與我們志同道合的人相互合作，以及確保各國維持一支可有效抵禦侵略軍的防衛力量。因此，我們要確保所有鄰國齊心協力。"
 FIN_approach_major_democracies: "接觸民主列強"
 FIN_approach_major_democracies_desc: "我們與世界上的自由民主國家有著共同的利益，它們希望遏制地緣政治中更具侵略性的參與者的不斷擴大的影響力。或許我們可以共同努力實現這一共同目標。"
 FIN_finnish_autonomy: "芬蘭自治"
 FIN_finnish_autonomy_desc: "即使是一些我國最忠實的共產主義者也對與[SOU.GetNameDef]的合作保持憂慮。他們擔心這將導致其對我國政治擁有事實上的主導權。不過，通過謹慎的外交活動，我們已經與盟友就保障我國自治權達成了一定程度上的共識。"
 FIN_integrate_kola_and_karelia: "整合科拉和卡累利阿"
 FIN_integrate_kola_and_karelia_desc: "雖然我們與[SOU.GetAdjective]同志建立了牢固的合作關係，但邊界爭端卻像即將爆發的雨雲一樣籠罩著我們。也許我們應該澄清誤會，最終以盟友而非敵人的身份解決這些問題。"
 FIN_keepers_of_the_baltic_countries: "波羅的諸國守護者"
 FIN_keepers_of_the_baltic_countries_desc: "波羅的人民沒有任何加入[GER.GetNameDef]或[SOU.GetNameDef]的意願。只有我們有能力憑藉共同的歷史和觀念以一種不會摧毀他們的方式和平地領導這些國家。"
 FIN_british_threat: "英國威脅論"
 FIN_british_threat_desc: "[ENG.GetNameDefCap]是全球資產階級經濟及其帝國主義魔爪的心臟所在。我們必須大力將匕首刺入這顆心臟，讓世界最終擺脫其壓迫。"
 FIN_red_finland: "紅色芬蘭"
 FIN_red_finland_desc: "通過建立一個真正的工人共和國，我們為倒在白色恐怖下的同志們報了仇。現在，我們要做的就是確保我們所取得的成就不被那些企圖摧毀它的境外勢力所破壞。"
 FIN_united_under_the_north_star: "團結於北極星之下"
 FIN_united_under_the_north_star_desc: "我們的北歐朋友和同志受到帝國主義列強的擺佈，他們不關心我們地區的利益。但只要齊心協力，我們就可以通過建立一個聯盟來確保我們人民的和平，這個聯盟甚至可以威懾最強大的帝國。"
 FIN_preserve_sapmi: "保護薩普米"
 FIN_preserve_sapmi_desc: "薩米人長期遭受帝國主義的壓迫，無論是在我國境內還是境外。我們應該向這些人民作出補償，幫助他們擺脫在鄰國手中持續遭受的苦難。"
 #FIN_confederated_finno_russian_republics: "Confederated Finno-Russian Republics"
 FIN_confederated_finno_russian_republics_desc: "現在有無數不同的人受到我們的管轄。為了防止我國內部人民等級制度的發展，我們將把政府重組為共和國聯盟。這將使所有人在治理中擁有公平的發言權。"
 FIN_secure_the_baltic_sea: "控制波羅的海"
 FIN_secure_the_baltic_sea_desc: "雖然我們經常關注我們的陸地邊界以及如何最好地保衛它們，但我們不能讓我們的努力白費，因為我們忽視了我們海岸線的脆弱性。因此，我們必須投資於大規模的海岸防禦計劃，以確保這一側翼的安全。"
 FIN_german_threat: "德國威脅論"
 FIN_german_threat_desc: "普魯士軍國主義在[GER.Capital.GetCapitalVictoryPointName]再次抬頭。當其他國家綏靖於歐洲列國首都接力淪陷於[GER.GetLeader]鐵蹄之下時，我們決不妥協。現在，是時候徹底解決這一和平威脅了。"
 FIN_socialist_welfare: "社會主義福利"
 FIN_socialist_welfare_desc: "通過對經濟和國防的精心管理，我們現在有足夠的資源來建立一個真正的福利國家來回報勞動人民。我們要保證人民幸福長壽。"
 FIN_aid_for_entrepreneurs: "援助企業家"
 FIN_aid_for_entrepreneurs_desc: "儘管我們應當削除資本主義中最壞的一部分，促進企業活動仍能讓我國經濟受益良多。我們能通過向重要產業提供補助和貸款刺激此類活動。"
 FIN_soviet_threat: "蘇聯威脅"
 FIN_soviet_threat_desc: "[SOU.GetNameDefCap]是對全世界勞動階層的威脅，為了征服更多土地，它會毫不留情地將勞動人民推入戰火。我們必須在其壯大前終結這一威脅。"
 FIN_proclaim_greater_finland: "宣佈成立大芬蘭聯邦"
 FIN_proclaim_greater_finland_desc: "我們的國境現在已經超出了我們幾年前的想像。有了如此多的新領土，我們有必要重組我們的政府，以便更好地反映其所管轄的多元化地區。"
 FIN_control_the_flux_of_iron_ore: "鐵礦流通管制"
 FIN_control_the_flux_of_iron_ore_desc: "自挪威輸送的瑞典鐵礦一直是戰爭席捲這片大陸乃至波及海外的誘因之一。我們必須在敵人掌控這一關鍵資源流動前先發制人。"
 FIN_finnish_neutrality: "芬式中立"
 FIN_finnish_neutrality_desc: "我國人民為其自由而戰的力量和決心是無法被磨滅的。不過，我們仍然應該堅持中立政策，這樣我們的鄰國就沒有理由扼殺我們來之不易的獨立。"
 FIN_the_finnish_swedish_peoples_party: "芬蘭瑞典族人民黨"
 FIN_the_finnish_swedish_peoples_party_desc: "芬蘭少數民族中的許多人都有瑞典血統。與最熱衷於為這些人請命的黨派合作或許能為我們的政策獲取支持，同時贏得瑞典的好感。"
 FIN_align_the_agrarian_league: "與農民聯盟結盟"
 FIN_align_the_agrarian_league_desc: "近一個世紀以來，[ROOT.GetNameDefCap]經歷了非同凡響的工業化進程，但是我們不能因此忽視靠農活餵養全國的幾百萬人所面臨的困境。通過與農民聯盟合作，我們能保證農民和城鎮居民的擔憂會被同等對待。"
 FIN_political_unity: "政治統一"
 FIN_political_unity_desc: "不論意識形態如何，所有人都是在為我國民眾著想。在此危難關頭，我們必須撇開無謂的政治爭吵通力合作。"
 FIN_collaboration_with_the_left: "與左翼合作"
 FIN_collaboration_with_the_left_desc: "疏遠左傾黨派對加強我國政府毫無用處。如果我們能找到與之合作的方法，或許就能集結更多的人到我們的事業中。"
 FIN_railways_and_infrastructure: "鐵路與基礎設施"
 FIN_railways_and_infrastructure_desc: "世界大戰證明，為了將資源和人力運送至所需地點，從而支援工業和軍事，必須要有強健的鐵路和公路網。經過數十年的佔領和流血衝突，我國的後勤網絡急需照料。"
 FIN_repurpose_small_industries: "改造小型產業"
 FIN_repurpose_small_industries_desc: "儘管我們不像大國那樣擁有龐大的產業，我們仍有無數的小型工廠正在運轉。與其另起爐灶，我們更應該引導這些小工廠轉向戰爭生產。"
 FIN_expand_state_military_factories: "擴建國家軍工廠"
 FIN_expand_state_military_factories_desc: "在此危難關頭，國營工廠難以滿足我國軍隊的需求。若要維持補給線，我們就需擴建生產設施。"
 FIN_a_new_course_for_kokoomus: "民族聯合黨的新道路"
 FIN_a_new_course_for_kokoomus_desc: "近期的事件使民族聯合黨的支持度倍增，因為人民渴望一個有力且明智的領導層和傳統價值觀的迴歸。我們應該利用這一形勢推進我黨的保守主義議題。"
 FIN_the_finnish_throne: "芬蘭王位"
 FIN_the_finnish_throne_desc: "民族聯合黨長期以來一直主張芬蘭君主制。隨著他們最近的支持增加和對權力控制的加強，他們現在有辦法解散當前的體系並建立一個王國取而代之。"
 FIN_strengthen_military_administration: "鞏固軍管行政"
 FIN_strengthen_military_administration_desc: "曼納海姆曾經英勇地領導我國度過難關，以軍人的精準剪除了政治上的繁文縟節。為了我國的延續，我們必須授予其與軍隊在必要時管理國家的權力。"
 FIN_dreams_of_expansionism: "擴張主義之夢"
 FIN_dreams_of_expansionism_desc: "里斯托·呂蒂正確地承認，除非我們控制了東部的卡累利阿土地，否則我們永遠不會有持久的和平。得到了那裡，我們能與鄰國建立更堅固的邊界。"
 FIN_reach_out_to_scandinavia: "聯絡斯堪的納維亞"
 FIN_reach_out_to_scandinavia_desc: "我們的大部分斯堪的納維亞鄰國與我們有共同的觀點，且沒有捲入大國衝突的興趣。通過與他們維持緊密聯繫，我們或許能建立集體防衛的基礎。"
 FIN_moderate_politics: "中庸政治"
 FIN_moderate_politics_desc: "隨著大國之間緊張局勢的加劇，我們需要確保我們的政府不會被視為對任何派系的意識形態過於寬容。因此，我們必須奉行溫和的對內政策。"
 FIN_join_the_allies: "加入[GetAlliesFactionForFinland]"
 FIN_join_the_allies_desc: "中立正在迅速成為一種過時的政策，這隻會成為大國的附庸。雖然考慮到我們的地緣政治地位，這是存在風險，但從長遠來看，加入同盟國可能會讓我們維護我們的主權。"
 FIN_northern_defense_front: "北方防衛陣線"
 FIN_northern_defense_front_desc: "我們橫跨斯堪的納維亞半島和波羅的海的鄰國很容易成為大國的選擇。但是，如果我們集中資源並進行軍事合作，我們也許能夠阻止最強大的敵人攻擊我們。"
 FIN_the_lone_wolf: "獨狼"
 FIN_the_lone_wolf_desc: "沒有人比[ROOT.GetAdjective]人民自己更關心[ROOT.GetAdjective]人民的利益。歷史證明，我們不能依靠別人來幫助我們，而是必須依靠我們自己。"
 FIN_military_aid: "軍事援助"
 FIN_military_aid_desc: "盟國擁有大量的武器製造商，我們應該利用它們來迅速實現我們的武裝部隊現代化。"
 FIN_mineral_wealth_development: "礦藏開發"
 FIN_mineral_wealth_development_desc: "鑑於我們的地理位置和鄰國，我們有可能被切斷與潛在盟友或經濟夥伴的聯繫。因此，我們應該利用我們國家未開發的資源，確保我們即使在孤立的情況下也能繼續戰鬥。"
 FIN_industrialize_the_region: "地區工業化"
 FIN_industrialize_the_region_desc: "雖然北方防衛陣線的綜合軍事力量相當可觀，但我們必須採取更多措施，確保我們的經濟能夠在持久戰爭中支撐它。為此，我們需要投資振興我們的產業。"
 FIN_increase_military_investment: "提高軍事投資"
 FIN_increase_military_investment_desc: "衝突的經濟和後勤部分與前線的戰鬥一樣對我們的生存至關重要。因此，我們應該投資我們的軍火工業，以確保他們能夠繼續為我們的軍隊提供所需的所有裝備。"
 FIN_cooperation_with_germany: "與德國合作"
 FIN_cooperation_with_germany_desc: "我們可以相信[GER.GetNameDef]和[SOU.GetNameDef]最終會爆發衝突的地緣政治現實。如果我們與[GER.GetAdjective]人合作，我們也許能夠為我們在之前與[SOU.GetAdjective]人的戰爭中所遭受的損失報仇，併為我們自己開闢新的機會。"
 FIN_wartsila_engine_production: "生產瓦錫蘭發動機"
 FIN_wartsila_engine_production_desc: "擁有為軍隊生產自己的發動機的技能和能力將改善我們的國家安全。通過與我們的盟友和瓦錫蘭等國內公司合作，我們可以達到那種安全水平。"
 FIN_german_military_advisors: "德國軍事顧問"
 FIN_german_military_advisors_desc: "由於機動設備和飛機的使用，戰爭正在迅速變化。也許我們是時候向我們的[GER.GetAdjective]戰友學習如何最好地利用這些新資源來為我們帶來優勢了。"
 FIN_finnish_march_of_conquest: "芬蘭征服進軍"
 FIN_finnish_march_of_conquest_desc: "長期以來，我們一直對[SOU.GetNameDef]及其前身採取守勢。現在是扭轉局勢、推進國境、不惜一切手段將卡雷利亞人民從[SOU.GetAdjective]壓迫下解放出來的時候了。"
 FIN_joint_scientific_program: "聯合科研項目"
 FIN_joint_scientific_program_desc: "發展對敵人的技術優勢可能是一個國家能否從衝突中取得勝利的決定性因素。通過與盟友共享我們的科學知識，我們可以確保技術優勢屬於我們。"
 FIN_modernize_the_industry: "工業現代化"
 FIN_modernize_the_industry_desc: "我們的技術勞動成果的用途超出了戰場應用。其中許多可以用來提高我們行業的效率。通過一些投資，我們可以利用我們新發現的知識開始大規模的工業現代化計劃。"
 FIN_modernize_the_army: "軍隊現代化"
 FIN_modernize_the_army_desc: "任何政府的首要任務都是保衛人民的安全。因此，當我們的軍隊被證明缺乏戰鬥力時，我們就有義務對其進行現代化改造和提高，使其能夠再次履行其首要職責。"
 FIN_weapon_caches: "武器藏匿處"
 FIN_weapon_caches_desc: "如果我們的武裝力量不堪重負，政府倒臺，我們必須制定應急計劃，以便我們能夠奪回國家。對此的一個建議是秘密儲備武器以供未來抵抗力量使用。"
 FIN_national_unity: "國民團結"
 FIN_national_unity_desc: "隨著戰爭逐漸逼近，我們必須動員我們偉大國家的人民並再次向世界展示身為芬蘭人的意義。"
 FIN_viron_kansa: "芬愛合併"
 FIN_viron_kansa_desc: "雖然[ROOT.GetName]和[EST.GetName]隔波羅的海相望，但兩族人民有著悠久的共同歷史。此外，我們在努力保持獨立的過程中也面臨著許多相同的挑戰。也許通過和平統一，兩族人民可以共免於戰爭。"
 FIN_ambitions_in_the_south: "南方野心"
 FIN_ambitions_in_the_south_desc: "波羅的小國正受鄰國的妒忌。如果它們一定要被征服，那最好是被我們征服，而不是我們潛在的敵國征服。"
 FIN_union_of_finnish_brothers_in_arms: "芬蘭袍澤聯盟"
 FIN_union_of_finnish_brothers_in_arms_desc: "芬蘭袍澤聯盟是民族社會主義運動的先鋒，隨著我國受到來自國外的威脅，他們正日益獲得支持。如果我們能與他們合作，就能為保衛國家贏得大量支持。"
 FIN_arm_the_lotta_svard: "武裝洛塔·施瓦德"
 FIN_arm_the_lotta_svard_desc: "事實證明，作為一支輔助部隊，洛塔·施瓦德發揮了巨大的作用。考慮到她們的能力和我們的嚴峻形勢，也許是時候更好地武裝該組織，並將其更有效地納入武裝部隊了。"
 FIN_parmis_devils: "佩爾米的惡魔"
 FIN_parmis_devils_desc: "事實證明，尼凱·佩爾米的刑罰營能夠有效利用人力，否則這些人力就會在監獄裡陷入困境。我們應該在他的工作基礎上擴大規模，建立一個由願意為國家而戰的囚犯組成的部門。"
 FIN_militarized_society: "軍事化社會"
 FIN_militarized_society_desc: "我國要在我們所面臨的攻擊中倖存下來，就必須撕下政治上偽善的面具，接受社會的全面軍事化。唯有如此，我們才能戰勝敵人。"
 FIN_a_cry_for_help: "窮勢疾呼"
 FIN_a_cry_for_help_desc: "國際聯盟未能履行其保護成員國免受衝突的職責。但是，國外仍有一些人可能會聽到我們的呼救，並向我們伸出援手。希望如此。"
 FIN_greater_finland: "大芬蘭"
 FIN_greater_finland_desc: "我們將不再受到覬覦我們土地的無情鄰居的掠奪。相反，我們將成為掠奪者，並將我們的邊界擴展到他們的自然邊界，遠超卡累利阿的土地。"
 FIN_right_wing_policies: "右翼政策"
 FIN_right_wing_policies_desc: "左派只不過是外國勢力的代理人。如果他們能贏得[SOU.Capital.GetCapitalVictoryPointName]的青睞，他們會毫不猶豫地出賣自己的祖國。如果我們的國家要繁榮和生存，我們就必須轉向右翼政黨和組織。"
 FIN_discredit_the_democratic_system: "詆譭民主制度"
 FIN_discredit_the_democratic_system_desc: "我們的民主制度只是從一場危機轉向另一場危機，而沒有采取果斷、有意義的行動。在我們所處的危險形勢下，我們不能再容忍這種弱點，必須教育群眾認識到這一政治制度的缺陷。"
 FIN_prepare_a_military_coup: "籌備軍事政變"
 FIN_prepare_a_military_coup_desc: "[FIN.GetNameDef]需要強有力、果斷的領導層，能夠在危機中做出艱難的決定。目前唯一有能力做到這一點的是軍隊。我們不應等待國家在民主黨人和社會主義者的統治下崩潰，而應為軍事政變奠定基礎。"
 FIN_a_fascist_regime: "法西斯體制"
 FIN_a_fascist_regime_desc: "由於國民議會受到軍方的影響，我們現在可以建立一個基於實力、榮譽和對[FIN.GetName]忠誠的政權。"
 FIN_seek_german_protection: "尋求德國保護"
 FIN_seek_german_protection_desc: "國際聯盟在維護國際法方面完全失敗了。我們必須承認，武裝力量的實力是國際關係的唯一決定因素。因此，為了我們國家的生存，我們必須尋求[GER.GetNameDef]等更強大鄰國的援助。"
 FIN_join_axis: "加入[GetFascistFactionForFinland]"
 FIN_join_axis_desc: "很少有人能夠對抗軸心國的力量。我們不應該袖手旁觀，而應該加入他們的聯盟，並利用它來實現我們自己的外交政策目標。"
 FIN_finnish_supremacy_in_the_north: "芬蘭北境霸權"
 FIN_finnish_supremacy_in_the_north_desc: "我們地區的其他國家爭論不休並通過談判將其征服於更強大的國家時，我們獨自可以提供替代方案。在我們的領導下，我們可以帶領我們的人民戰勝任何可能威脅我們的敵人。"
 FIN_finnish_legion_of_honor: "芬蘭榮譽軍團"
 FIN_finnish_legion_of_honor_desc: "我們的軍隊是阻擋我們邊境共產主義大軍的盾牌。我們應該採取更多措施來紀念他們的勇敢，建立一個精英榮譽軍團，讓他們中最勇敢的人都渴望加入。"
 FIN_tactical_wargaming_department: "戰術推演部門"
 FIN_tactical_wargaming_department_desc: "現代戰爭的需求日益擴大。如果我們的最高指揮部想要跟上潮流，我們需要建立新的部門，讓他們可以通過戰術兵棋推演來試驗新戰法。"
 FIN_advanced_jaeger_training_program: "先進獵兵訓練項目"
 FIN_advanced_jaeger_training_program_desc: "我們的“獵兵”部隊長期以來一直被視為武裝部隊的精銳，其起源可以追溯到世界大戰時，第一支“獵兵”部隊在德國接受訓練。也許現在是我們通過現代化來重振這些部隊的時候了，進而提高整個軍隊的士氣。"
 FIN_industrial_cooperation: "工業合作"
 FIN_industrial_cooperation_desc: "軸心國成員擁有豐富的知識和資源可供使用。現在是我們進行工業合作，更好地利用這些未開發資產來造福我們各自國家的時候了。"
 FIN_bring_foreign_armor_experts: "邀請外國裝甲專家"
 FIN_bring_foreign_armor_experts_desc: "坦克是任何現代軍隊的重要組成部分，但我們對坦克的經驗有限。也許我們可以通過邀請該領域的外國專家來幫助我們來提升我們的相應戰力。"
 FIN_military_research: "軍事研究"
 FIN_military_research_desc: "隨著新技術和新技術的出現，戰爭正在不斷被重塑。為了確保我們武裝部隊的持續實力和戰備狀態，我們聯盟的成員應該彙集我們的知識和技術。"
 FIN_patriotic_peoples_movement: "愛國人民運動"
 FIN_patriotic_peoples_movement_desc: "儘管受到前政權的抵制，愛國人民運動在教育群眾民族自豪感和保衛國家反對共產主義的必要性方面做出了巨大的努力。如果我們能夠信任他們，我們的政權就會獲得更大的支持基礎。"
 FIN_academic_karelian_society: "卡累利阿學術協會"
 FIN_academic_karelian_society_desc: "十多年來，赫爾辛基大學的知識分子和學生組織的影響力越來越大。他們的核心目標與我們的核心目標非常一致，即按照我們的歷史追求改善芬蘭。也許我們可以找到一種共同合作的方式。"
 FIN_mustapaidat: "黑衫隊"
 FIN_mustapaidat_desc: "社會的持續軍事化將確保我們的人民成為最強大的人。通過合併準軍事部隊，我們可以在社會各階層推廣軍事價值觀，宣傳對象包括從那些還太年輕而無法參軍的人到那些可能太老了的人。"
 FIN_take_over_the_suojeluskunta: "接管白衛軍"
 FIN_take_over_the_suojeluskunta_desc: "白衛軍是預備役軍人的輔助部隊，他們可以在危機時刻被要求幫助保衛國家。如果我們將該組織置於我們的控制之下，我們就可以利用它向成千上萬的人灌輸我們的事業。"
 FIN_maan_turva: "國土安全協會"
 FIN_maan_turva_desc: "只有通過對民眾的仔細監控，我們才能確保不發生任何背叛或顛覆行為。反過來，我們就能保護政權，確保國家不被從裡到外毀滅。"
 FIN_finnish_irredentism: "芬蘭民族統一主義"
 FIN_finnish_irredentism_desc: "儘管我們從前俄羅斯帝國中獲得了獨立，但一些理應由我們統治的土地和人民仍陷於敵人的奴役中。我們必須激勵我們的人民解放這些土地。"
 FIN_keepers_of_the_north: "北境守護者"
 FIN_keepers_of_the_north_desc: "我們是北方地區唯一有意志力治理並保衛該地區免受外部敵人侵害的政權。除非該地區所有人民都團結在我們的統治之下，否則我們永遠不可能擁有持久和平。"
 FIN_sotilaalliset_kappalaiset: "隨軍牧師"
 FIN_sotilaalliset_kappalaiset_desc: "獲得牧師的幫助是我們士兵所依賴的一項重要服務。這些牧師中的許多人也理所當然地關心我們國家的未來。如果我們與他們合作，我們不僅可以獲得身在前線的耳目，還可以確保正確的信息也傳達到部隊。"
 FIN_national_fanatism: "民族狂熱"
 FIN_national_fanatism_desc: "社會必須充滿對[FIN.GetAdjective]優越事業的狂熱和奉獻精神。我們一再證明沒有人可以阻止我們，當我們共同奮鬥時沒有什麼可以阻止我們國家走向偉大。"
 FIN_military_promotions: "軍隊晉升"
 FIN_military_promotions_desc: "我們的軍官以極大的榮譽和奉獻精神為國家服務。現在是我們獎勵他們中最優秀的人的時候了，因為他們為拯救我們免遭歷史宿敵的征服而做出了貢獻。"
 FIN_indoctrinate_the_workers: "工人宣教"
 FIN_indoctrinate_the_workers_desc: "隨著我們加強對民眾的監控，我們對有效的宣傳方法有了更深入的瞭解。我們應該利用這些知識向民眾灌輸思想，確保他們對政府和[FIN.GetNameDef]絕對忠誠。"
 FIN_intellectual_elite: "知識分子精英"
 FIN_intellectual_elite_desc: "通過軍隊和知識分子中更開明的成員的精心合作，我們成功地將國家從社會主義和墮落的魔掌中拯救出來。現在，我們投資學術活動，來獎勵那些支持我們的人。"
 FIN_enhance_southern_infrastructure: "加強南方基建"
 FIN_enhance_southern_infrastructure_desc: "[ROOT.GetAdjective]國家試圖穩住自己在世上的一席之地，必須專注於建設並改進工業能力。達成目標的第一步是改進南方地區的基礎設施狀況，以此確保當地能更好地滿足短期內輕重工業發展要求。"
 FIN_industrial_development: "工業發展"
 FIN_industrial_development_desc: "全世界工業化如火如荼，[ROOT.GetName]若要成為全球舞臺上的一個主要參與方，就必須不能落於人後。投資重工業不僅能創造大把就業機會並刺激經濟發展，還能為未來的挑戰提供必要的資源。"
 FIN_bank_of_aland: "奧蘭銀行"
 FIN_bank_of_aland_desc: "奧蘭銀行是[ROOT.GetName]經濟的基石，為經濟增長繁榮提供穩定與必要的支撐。\n[ROOT.GetName]投資奧蘭銀行，就是在投資未來，這為國家更強大、更繁榮奠定了基礎。"
 FIN_suomen_akatemia: "芬蘭科學院"
 FIN_suomen_akatemia_desc: "著名數學家萊奧·薩里奧為首的[ROOT.GetAdjective]知識分子推動成立了芬蘭科學院。這所學術機構系屬國內頂尖水平，能夠驅動科學創新並使[ROOT.GetName]處於技術發展的最前沿。"
 FIN_janiskoski_power_plant: "耶尼斯科斯基發電廠"
 FIN_janiskoski_power_plant_desc: "為了向科洛肖基鎳礦的電熔爐提供可靠的能源並助力[722.GetName]區域的開發，從而帶動[ROOT.GetName]北部的經濟發展，我們將在耶尼斯科斯基修建一座發電廠。"
 FIN_found_pohjolan_voima: "創立北方電力公司"
 FIN_found_pohjolan_voima_desc: "森林工業和重工業最近的擴張帶來了更多電力需求。我們應該集中管理能源生產並利用水電的無限潛能助力[ROOT.GetName]工業發展。"
 FIN_expand_imatra_hydropower_plant: "擴建伊馬特拉水電站"
 FIN_expand_imatra_hydropower_plant_desc: "事實證明，建於1922年的伊馬特拉水電站是[ROOT.GetName]工業發展的可靠能量來源。在加裝第五和第六套設備後，水電站的產能將更上一層樓，推動[928.GetName]區域的工業進一步發展。"
 FIN_makola_mine: "馬科拉礦脈"
 FIN_makola_mine_desc: "在馬科拉和希圖拉附近發現了豐富的鎳和銅礦藏。我們的專家認為這些礦藏蘊含可推動我國經濟發展和軍工快速擴張的大量潛能。他們建議儘快在馬科拉礦脈啟動建設工作，確立珍貴礦物的穩定來源。"
 FIN_power_from_the_dams: "大壩發電"
 FIN_power_from_the_dams_desc: "為了利用[ROOT.GetName]豐富的河流自然資源，一項意義重大的水電基礎設施擴建計劃已被提出。據我國專家所稱，投資建設新的水電站將為我們提供大幅擴張工業能力和推動我國經濟發展的手段。"
 FIN_tire_factory_at_nokia: "諾基亞工廠"
 FIN_tire_factory_at_nokia_desc: "衝突之時，[ROOT.GetName]需要保證我國軍隊的機動性和完備度，因此應當將確立可靠的輪胎供應來源列為優先事項。\n我們計劃擴建芬蘭橡膠廠在諾基亞的輪胎工廠，同時改造生產線以利用合成橡膠和回收材料，從而克服可能的短缺。"
 FIN_vaisala_radiosonde_tests: "測試韋伊塞萊無線電探空儀"
 FIN_vaisala_radiosonde_tests_desc: "維爾霍·韋伊塞萊教授指導下的開創性工作為無線電探空儀的商業生產奠定了成功基礎。在第一部芬蘭無線電探空儀於1931年成功發佈的基礎上，後續的研發工作已經帶來了顯著的技術進步。"
 FIN_oy_alkoholiliike: "酒精公司"
 FIN_oy_alkoholiliike_desc: "絕望的時代就要配上絕望的措施，如今已經輪到酒精公司來支持芬蘭軍隊了，他們要貢獻的是最基本的武器：\n精心提煉，專門釀造，生產卓越的燃燒雞尾酒。掃清一切敵軍輕型裝甲，讓步兵做回自己。"
 FIN_integrate_oy_tikkakoski: "整合蒂卡科斯基公司"
 FIN_integrate_oy_tikkakoski_desc: "為了加強[ROOT.GetAdjective]武器工業，蒂卡科斯基公司將被整合進國營軍武工廠。此舉將提高槍械產量，同時為[ROOT.GetAdjective]軍隊促進新式火器開發。"
 FIN_national_firepower: "舉國火力"
 FIN_national_firepower_desc: "鑑於我國目前面臨緊迫的外部威脅，我們必須加大投資新建軍用工廠。這些設施將專注於為陸軍和海岸炮臺生產最新的火炮，確保[ROOT.GetNameDef]有足夠火力保衛國界。"
 FIN_contract_with_yhteissisu: "西蘇汽車合同"
 FIN_contract_with_yhteissisu_desc: "我們將與[ROOT.GetAdjective]龍頭企業合作，成立西蘇汽車公司，以此為[ROOT.GetAdjective]國防軍提供可靠且高效的運輸服務。\n計劃將西蘇S-21卡車生產轉移給西蘇汽車，以此促進軍卡及軍用巴士生產，確保軍隊裝備著能應對任何情況的必要資源。"
 FIN_outokumpu_for_defence_industry: "奧托昆普國防產業"
 FIN_outokumpu_for_defence_industry_desc: "投資奧托昆普這家國家金屬工業公司，無疑將有助於改善[ROOT.GetName]國防預備狀態。\n建立波里國有金屬工廠以及附帶的電解銅廠來提煉原銅，將為[ROOT.GetName]的銅與黃銅生產帶來自足。"
 FIN_industrial_upgrade_in_harjavalta: "哈里亞瓦爾塔產業升級"
 FIN_industrial_upgrade_in_harjavalta_desc: "哈里亞瓦爾塔的鎳銅工業正著力於現代化與精簡流程。用上最先進的技術和改進過的生產方法，我們的目標乃是最大限度提高產量，鞏固[ROOT.GetName]作為鎳銅礦產大宗產地的地位。"
 FIN_expand_mining_prospection: "擴大采礦勘探"
 FIN_expand_mining_prospection_desc: "我們投資了現代採礦工具，擴大了礦山基礎設施，這為強大的採礦業奠定了基礎。增產回應了國防需要，使我國進一步為衝突做好了準備。"
 FIN_elijarvi_mine: "埃利耶爾維礦脈"
 FIN_elijarvi_mine_desc: "我們收到了在埃利耶爾維附近採礦中發掘的樣本，當地可能存在高鉻純度的鉻鐵礦。我們必須再當地開展新的採礦作業，以此確保為軍工產業提供可靠穩定的鉻供應。"
 FIN_tornio_steel_factory: "托爾尼奧鋼鐵廠"
 FIN_tornio_steel_factory_desc: "我們將在凱米礦坑附近的托爾尼奧建立一家鋼鐵廠，如此將有望徹底改變芬蘭的金屬工業。在獲得奧托昆普公司當前豐富的鉻鎳供應後，新工廠所生產的將是頂級的鋼鐵，以此彌補芬蘭工業能力的短板。"
 FIN_increase_military_budget: "增加軍事預算"
 FIN_increase_military_budget_desc: "國家安全至高無上。只要提高軍事預算，國防軍就能拿上更好的裝備，並未一切潛在威脅做好準備。"
 FIN_suomen_maavoimat: "芬蘭陸軍"
 FIN_suomen_maavoimat_desc: "我們必須強化芬蘭國防軍的實力，投資研發新一代軍事裝備和現代化訓練設施可以讓我軍準備好面對任何潛在的威脅。"
 FIN_operation_kilpapurjehdus: "帆船比賽行動"
 FIN_operation_kilpapurjehdus_desc: "根據國際聯盟的決定，奧蘭島自1921年以來一直處於非軍事化狀態，當地長期沒有軍隊駐紮，也沒有儲備的軍事物資。然而，歐洲局勢日漸緊張，敵軍登陸的威脅與日俱增。最高指揮部現擬定了一個奧蘭再軍事化並鞏固防衛的計劃。\n準備工作告一段落，部隊已經躍躍欲試！"
 FIN_extra_refresher_exercises: "老兵新練"
 FIN_extra_refresher_exercises_desc: "歐洲局勢日漸緊張，[ROOT.GetAdjective]的獨立性需要依靠密集的軍事訓練和演習，以此加強芬蘭國防，併為一切有可能爆發的衝突做好準備，向全世界伸張芬蘭人在迫不得已之時捍衛國家主權的決心和準備。"
 FIN_the_cold_front: "凜冽前線"
 FIN_the_cold_front_desc: "芬蘭冬季前線凜冽刺骨的條件亟需戰士們接受更妥當的訓練。補給線一定要穩，偽裝戰術一定要被改進，這樣國防軍才能在面臨冬季戰爭的挑戰時韌性十足。"
 FIN_jaeger_movement: "獵兵運動"
 FIN_jaeger_movement_desc: "[ROOT.GetAdjective]最高指揮部提出了一項有關重振國防軍的提案，即提拔從前受過獵兵訓練的軍官。這些軍官專擅游擊戰和敵後破壞行動，是為磨練新兵的非常規戰術能力並帶頭挺進戰場的不二之選。"
 FIN_salvaged_and_retooled: "搶修與改裝"
 FIN_salvaged_and_retooled_desc: "我們的武裝部隊若要在戰爭中取勝，就對專注於最大限度利用戰時資源。利用所繳、搶修所損，在必要的時候進行適應芬蘭戰術條例改裝並派上用場。如此能使我軍補給狀況大為改善，亦可加強我們的軍事能力。"
 FIN_winter_warfare: "冬季戰爭"
 FIN_winter_warfare_desc: "按最壞的情況準備，按最好的狀態戰鬥。我們需要強化寒冬條件下的補給能力，訓練部隊的寒冷條件能力，如此能在前線持續作戰。"
 FIN_motti_tactics: "柴堆戰術"
 FIN_motti_tactics_desc: "柴堆戰術包括包夾、孤立敵軍單位，其目的在於癱瘓其後勤和通信線路。實施此等戰術亟需在國防軍計劃與訓練上精心打點，確保其在戰場上能夠發揮作用。利用完善好柴堆戰術，我們將得以超越敵軍，在他們最難受的地方進行打擊。"
 FIN_foreign_armor: "外國裝甲"
 FIN_foreign_armor_desc: "[ROOT.GetAdjective]陸軍希望能夠加強其戰時裝甲能力，我們只能在國外尋找解決方案。譬如採購瑞典造蘭斯韋克L-62II型這類外國裝甲載具，既可為[ROOT.GetAdjective]軍火儲備添上一筆人見人愛的補充，又能展示一個國家在面對逆境時的智慧與適應。"
 FIN_utilize_the_sami: "利用薩米人"
 FIN_utilize_the_sami_desc: "我們必須承認薩米人的獨特技能，他們精於在北極嚴峻條件下導航尋路。只有利用他們對地形的瞭解，才能提高我軍偵察能力；只有僱他們當馴鹿牧民，才能改善偏遠地區的補給線。薩米人能在我軍國防戰略中發揮重要作用，我們必須確保其專精得以充分利用。"
 FIN_long_range_patrols: "長程巡邏"
 FIN_long_range_patrols_desc: "面對現代戰爭對[ROOT.GetAdjective]陸軍提出的新的挑戰，長程巡邏隊將成為偵察破壞工作中的重要組成。這些訓練有素的部隊擅長穿透防線、收集情報並發動破壞性的突襲，是戰時的重要戰力。"
 FIN_finnish_radio_intelligence: "芬蘭無線電情報局"
 FIN_finnish_radio_intelligence_desc: "戰爭烈度如火如荼，芬蘭軍方已經認識到收集可靠情報的重要性。在雷諾·哈拉馬的領導下，軍方召集了一群專業無線電操作員對敵軍通信進行攔截和解碼。這些操作員的技能和知識非常重要，將為芬蘭武裝部隊提供有價值的信息，以此幫助扭轉戰爭局勢。"
 FIN_sissi: "西西部隊"
 FIN_sissi_desc: "衝突持續不歇，西西輕步兵部隊已成芬蘭軍隊的寶貴戰力，其長程巡邏和伏擊專場十分適於打擊敵方目標。他們對地形瞭如指掌，行動起來迅捷無聲，是敵人的眼中釘，亦是芬蘭民眾的驕傲。"
 FIN_national_armor_focus: "國家裝甲部隊"
 FIN_national_armor_focus_desc: "隨著戰爭的投入不斷增加，[ROOT.GetName]必須將注意力轉向本國的軍事工業。我們專注於發展國內坦克生產能力，旨在加強我們的裝甲部隊並製造適合他們在戰場上的獨特需求的車輛。"
 FIN_underground_resistance_cells: "地下抵抗組織"
 FIN_underground_resistance_cells_desc: "敵人步步推進，但仍有不屈的芬蘭人在。組織雖小，五臟俱全；舉起武器，抗爭到底。他們能打伏擊，搞破壞；他們對地形瞭如指掌，對理想堅貞不屈——無論敵勢如何洶洶，地下抵抗組織能叫一切侵略者焦頭爛額。"
 FIN_mannerheim_line: "曼納海姆防線"
 FIN_mannerheim_line_desc: "為了加強防衛能力，我們必須將注意力轉向曼納海姆防線。這是一個複雜的防禦要塞網絡，橫跨國家東境，其安妥對於抵禦來侵之敵人十分重要。為此，軍方正努力改進要塞本身及維持其庫存和運作的補給線。"
 FIN_defense_in_depth: "縱深防禦"
 FIN_defense_in_depth_desc: "隨著敵人變得越來越強大和更加堅定，很明顯，單一的靜態前線可能不足以阻止他們。我們必須在主要前線後方建造新的防禦工事和更小的防禦線，提供多層保護，並使我們的部隊能夠根據需要靈活地進行反擊。我們會讓敵人為他們試圖奪取的每一寸[ROOT.GetAdjective]土地付出代價。"
 FIN_helsinki_air_defense: "赫爾辛基防空"
 FIN_helsinki_air_defense_desc: "戰爭的陰雲籠罩在[ROOT.GetName]之上，必須保衛赫爾辛基。城市及海岸易攻難守，防衛的任務就落在了[ROOT.GetAdjective]軍隊肩上。改進防空，修築沿海防禦工事，如此守護住的不僅是城市，還有保衛我們國家的決意。"
 FIN_suomen_ilmavoimat: "芬蘭空軍"
 FIN_suomen_ilmavoimat_desc: "我們必須重點提高[ROOT.GetAdjective]空軍的實力，在科研與訓練方面加大投資。\n我們的目標是建立一支現代化且靈活的空軍部隊，以此滿足現代戰爭的要求，同時在作戰行動中為地面部隊提供關鍵支持。"
 FIN_expand_air_bases: "擴建空軍基地"
 FIN_expand_air_bases_desc: "[ROOT.GetName]周遭國際局勢江河日下，我們必須確保國防軍能夠適應新時代新情況。\n我們向空軍承諾，將支持其在全國範圍內擴大空軍基地數量，以此確保能在衝突時期迅速部署飛行員。"
 FIN_pilot_training: "飛行員訓練"
 FIN_pilot_training_desc: "隨著現代戰爭對空中力量需求的增加，我們的飛行員需要更高級、更專業的訓練。[ROOT.GetAdjective]空軍通過投資新的訓練方法和設備，可以確保其飛行員躋身於世界一流之列。"
 FIN_naval_airforce: "海軍航空兵"
 FIN_naval_airforce_desc: "隨著[ROOT.GetName]海軍力量的增長，其航空能力也必須如此。建立一支專門的海軍航空隊將確保芬蘭海軍獲得主宰波羅的海所需的支持，協調空中力量和水面艦隊，以擊退任何威脅。"
 FIN_national_aircraft_production: "國有飛機生產"
 FIN_national_aircraft_production_desc: "[ROOT.GetName]面臨著戰爭威脅，一支現代化的空軍對國防之重要性越來越顯而易見。為此，我們啟動了一項生產飛機的國家計劃，意在為[ROOT.GetAdjective]飛機設計商和製造商提供必要的資源與支持，保證[ROOT.GetName]有能力與歐陸列強相搏。"
 FIN_expand_air_force_academy: "擴建空軍學院"
 FIN_expand_air_force_academy_desc: "作為國家層面上改進空軍的部分作為，我們應對空軍學院進行重大擴建。這次擴建不僅包括新設施，還包括改良飛行員培訓方案，以及在考哈瓦和蒂卡科斯基新建機場。"
 FIN_foreign_aircraft: "外國飛機"
 FIN_foreign_aircraft_desc: "[ROOT.GetAdjective]空軍必須提高保護國家主權和國土安全的能力。我們將引進外國飛機設計及相應的專業知識，以此服務於本國，開發本土造的飛機。"
 FIN_support_for_ground_forces: "支援地面部隊"
 FIN_support_for_ground_forces_desc: "戰爭如火如荼，地面部隊顯然需要更多的空中支援。為此，我們將在近距離支援機的開發和生產上追加投資，以此為我軍地面部隊提供重要的空中掩護。這將使陸軍在陣地戰中堅守和反擊時獲得雪中送炭般的支持。"
 FIN_dominate_the_skies: "掌控藍天"
 FIN_dominate_the_skies_desc: "[ROOT.GetAdjective]的天空屬於我們！生產新型戰鬥機，以及在現代空戰技術開發上追加投入，這些確保我方制空權穩如泰山，本土因此得以保全。訓練有素的飛行員將主宰天空，將戰鬥甩到敵人的臉上。"
 FIN_expand_production_lines: "擴建生產線"
 FIN_expand_production_lines_desc: "[ROOT.GetAdjective]亟需擴大生產能力，以此滿足戰爭中不斷增長的需求。新建一批生產線後，新型飛機可以增產，如此成為我國空軍與敵相搏的重大靠山。"
 FIN_modernize_production_lines: "現代化生產線"
 FIN_modernize_production_lines_desc: "我們的目標是建成一個世界級航空工業，能夠生產全世界最先進軍用飛機。[ROOT.GetAdjective]政府將投資升級一批負責航造的國有工廠，確保[ROOT.GetName]空軍背後有著最先進且最可靠的造機技術。"
 FIN_suomen_merivoimat: "芬蘭海軍"
 FIN_suomen_merivoimat_desc: "[ROOT.GetName]海軍必須時刻準備好保衛國土，抵禦一切潛在威脅。通過重點研究現代海軍裝備並制定改進訓練計劃，[ROOT.GetAdjective]海軍將成為一支強大的軍隊，有能力保護我們在海上的利益。"
 FIN_the_merchant_fleet: "商船隊"
 FIN_the_merchant_fleet_desc: "作為戰備的一部分，[ROOT.GetName]的商船隊必須與時俱進，確保重要物資交付通道暢行不斷。我們可以投資生產先進船型，在維持本國地位的同時確保衝突中不落下風。"
 FIN_conversion_of_civilian_vessels: "改裝民用載具"
 FIN_conversion_of_civilian_vessels_desc: "戰火連綿，我們必須利用好手頭一切可用的資源。通過改裝民用船隻，[ROOT.GetName]可以迅速增強其海軍能力，保護海岸線免遭敵人威脅。大型破冰船可以被改裝成岸防艦，小船可作驅逐艦或巡邏艇處理，如此可在[ROOT.GetAdjective]沿岸建立一個強大的防衛網。"
 FIN_coastal_defense: "海岸防衛"
 FIN_coastal_defense_desc: "外國侵略者虎視眈眈，在其面前最重要的是確保芬蘭的海岸線安穩如山。我們可以通過改進岸防基礎設施建設，以此為應對任何來自海上的潛在威脅做好準備。"
 FIN_marine_jaeger_divisions: "海軍陸戰獵兵"
 FIN_marine_jaeger_divisions_desc: "芬蘭海軍陸戰獵兵成立於1934年下半年，是隸屬於芬蘭海軍的精銳海軍陸戰隊。這群士兵訓練有素、適應性強、裝備精良，適於執行從海岸防衛到兩棲攻擊的各種任務，將是在波羅的海沿岸的一切可能戰爭中的關鍵一著。"
 FIN_rapid_raiders: "獵風捕手"
 FIN_rapid_raiders_desc: "世界日新月異，我國海軍不能落於人後。投資研發生產現代驅逐艦，裝備以最先進的魚雷科技，我們可以迅速而致命地打擊敵人。"
 FIN_deep_sea_raiders: "深海奇兵"
 FIN_deep_sea_raiders_desc: "戰局危在旦夕，[ROOT.GetAdjective]海軍必須緊抓現代潛艇的生產，以此破壞敵方補給線並保護我方貿易路線。此種艦艇光滑而致命，是敵艦水手的噩夢，亦是[ROOT.GetName]海權的奠基石。"
 FIN_sea_mines_strategy: "海中佈雷戰略"
 FIN_sea_mines_strategy_desc: "[ROOT.GetAdjective]海軍通過在戰略位置部署水雷，能使海岸周圍的水域對敵方艦隊來說宛若天險，難以觸及[ROOT.GetAdjective]海岸，同時亦能保證我國海上貿易路線的安全。"
 FIN_expansion_towards_the_atlantic: "向大西洋擴張"
 FIN_expansion_towards_the_atlantic_desc: "[ROOT.GetAdjective]造船業要面向大西洋擴建海上軍力，造大艦巨炮來投射大洋海軍力量。[ROOT.GetName]海軍的戰艦和航母接續下水，未來定將成為世界舞臺上一支不容小覷的軍事存在。"
 FIN_strengthen_the_naval_bases: "強化海軍基地"
 FIN_strengthen_the_naval_bases_desc: "在[ROOT.GetName]整軍備戰之時，其海軍基地裝備精良並受到良好保護至關重要。通過改善我們海軍基地的基礎設施和防禦，我們可以確保我們的艦隊保持安全並隨時準備與敵軍交戰。"
 FIN_expand_ship_building_industry: "擴建造船產業"
 FIN_expand_ship_building_industry_desc: "隨著對軍艦的需求上升，對軍艦製造廠的需求也在增加。隨著造船業的發展，[ROOT.GetName]將能更好地為其武裝部隊提供投射力量和保護海岸所需的船隻。"
 FIN_acquire_andros_dockyards: "併購安德羅斯造船廠"
 FIN_acquire_andros_dockyards_desc: "收購位於圖爾庫的安德羅斯造船廠將極大提升我國主要艦船設計商$FIN_crichton_vulcan_organization$的產能。有了這一添益，[ROOT.GetAdjective]海軍將能生產更多更好的艦船，提高在此區域內的力量和影響。"
 FIN_innovative_designs: "創新性設計"
 FIN_innovative_designs_desc: "在一次大膽的創新中，我國工程師揭示了雄心勃勃的“突擊坦克”計劃。這是一個旨在挑戰裝甲戰爭邊界的超重型坦克提案。儘管這個計劃似乎不合常規，這一大膽嘗試仍體現了[ROOT.GetNameDef]在探索開創性設計和推進戰場極限的決心。"
