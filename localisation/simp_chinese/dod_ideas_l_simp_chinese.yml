 YUG_idea_croatian_opposition: "克羅地亞反對派"
 YUG_idea_croatian_opposition_desc: "克羅地亞的政治代表長久以來都試圖推動在王國內部實現組織結構的聯邦化。除非滿足其要求，否則他們會持續抵制來自中央政府的一切決策，甚至會在某個他們認為“適當”的時機發動叛亂。"
 YUG_idea_slovene_nationalism: "斯洛文尼亞民族主義"
 YUG_idea_slovene_nationalism_desc: "斯洛文尼亞人長久以來都渴望著獨立建國，雖然他們眼下接受了我們的統治，但他們對我國卻並不是特別有認同感。正因如此，斯洛文尼亞的實業家們寧願將資金揮霍在海外，也很少對本地的產業進行投資。"
 YUG_idea_slovene_nationalism_2: "斯洛文尼亞自治政府"
 YUG_idea_slovene_nationalism_2_desc: "通過向斯洛文尼亞自治政府下放部分權力，將能使其更願意與我們攜手重整軍備，然而對其的讓步也意味著我們同時弱化了對當地工業運作情況的掌控。"
 YUG_idea_croats_suppressed: "鎮壓克羅地亞民族主義"
 YUG_idea_religious_freedoms_guaranteed: "保障宗教自由"
 YUG_idea_macedonian_opposition: "馬其頓反對派"
 YUG_idea_macedonian_opposition_desc: "馬其頓人如今尚還沒有接受自己作為塞爾維亞人的身份，持續索取著本族的特權。毫無疑問，保加利亞在其背後提供了政治上的支持。"
 YUG_idea_macedonian_opposition_1: "溫和的馬其頓反對派"
 YUG_idea_macedonian_opposition_1_desc: "通過給予馬其頓人一定溫和的政治讓步，並且停止對其進行塞族身份的強制同化，馬其頓地區此前的緊張局勢暫時有所緩和。"
