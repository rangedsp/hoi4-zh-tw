 HUN_treaty_of_triannon: "《特里亞農條約》"
 HUN_treaty_of_triannon_desc: "《特里亞農條約》在許多方面都與《凡爾賽和約》近似，它不僅削弱了我國的軍事力量，同時也嚴格限制我國對軍備的重整。對其進行修訂亦或者直接將其廢除，顯然是我們的首要目標。為達成這一目標，我們可以在同小協約國和解、提出《布萊德協議》亦或是直接撕毀條約幾個選項當中作出選擇。其中，撕毀條約被廣泛認為是激進之舉，並很有可能引發嚴重的後果。"
