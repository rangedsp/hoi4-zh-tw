l_simp_chinese:
 infrastructure: "基礎設施"
 infrastructure_plural: "基礎設施"
 infrastructure_desc: "此建築將改善所屬地區的基礎設施狀況，提高你在戰略要地的後勤能力及你的陸軍部隊在本地區的移動速度，並提升此地區的基礎資源產出。"
 arms_factory: "軍用工廠"
 arms_factory_plural: "軍用工廠"
 arms_factory_desc: "此建築可為所屬地區提供生產軍事裝備的工業能力，或可因需轉換為民用工廠。"
 dockyard: "海軍船塢"
 dockyard_plural: "海軍船塢"
 dockyard_desc: "此建築可為所屬地區提供建造新艦船的工業能力。"
 dam: "大壩"
 dam_plural: "大壩"
 dam_desc: "水壩為地區提供額外的電力，提高工業和資源產出。"
 dam_mountain: "$dam$"
 dam_mountain_plural: "$dam_plural$"
 dam_mountain_desc: "$dam_desc$"
 cataract_dam_mountain: "卡塔拉特水壩"
 cataract_dam_mountain_plural: "卡塔拉特水壩"
 cataract_dam_mountain_desc: "卡塔拉特水壩於1907年竣工，是澳大利亞殖民時期早期最具代表性的工程壯舉之一。這座水壩坐落於新南威爾士州南部高地的卡塔拉特河上，至今仍是向悉尼市提供淡水的四大主要水源之一。"
 canal_kiel: "基爾運河船閘"
 canal_kiel_plural: "$canal_kiel$"
 canal_kiel_desc: "為了使運河滿負荷運行，基爾運河船閘至關重要，破壞它們將會在很長一段時間內妨礙航運和交通。"
 canal_panama: "巴拿馬運河船閘"
 canal_panama_plural: "$canal_panama$"
 canal_panama_desc: "巴拿馬運河船閘是運河滿負荷運作所必需的設施，破壞它們將會長時間阻礙航運和交通。"
 industrial_complex: "民用工廠"
 industrial_complex_plural: "民用工廠"
 industrial_complex_desc: "此建築可為所屬地區提供生產民用商品或建造新建築的工業能力，或可因需轉換為軍用工廠。"
 air_base: "空軍基地"
 air_base_plural: "空軍基地"
 air_base_desc: "此建築可為所屬地區提供部署空軍飛行器的場所。"
 naval_base: "海軍基地"
 naval_base_plural: "海軍基地"
 naval_base_desc: "該建築可延長你的艦隊航程，進行艦船維修，進行海外後勤補給以及資源出口。海軍基地可隨等級的提升增加補給吞吐量。"
 bunker: "陸上要塞"
 bunker_plural: "陸上要塞"
 bunker_desc: "此建築可在戰鬥中對進攻方造成基於建築等級每級$VALUE|+%0$的進攻懲罰。同時受到來自多方向的攻擊時則會降低要塞效果。"
 coastal_bunker: "海岸要塞"
 coastal_bunker_plural: "海岸要塞"
 coastal_bunker_desc: "此建築可在登陸作戰當中對進攻方造成基於建築等級每級$VALUE|+%0$的進攻懲罰。"
 anti_air_building: "防空陣地"
 anti_air_building_plural: "防空陣地"
 anti_air_building_desc: "此建築可為所屬地區面臨轟炸機來襲時提供保護，並對敵軍飛行器發動打擊。"
 synthetic_refinery: "合成煉油廠"
 synthetic_refinery_plural: "合成煉油廠"
 #synthetic_refinery_desc: "This building provides the state with +1 £resources_strip|3 and +2 £resources_strip|1."
 synthetic_refinery_desc: "此建築可為所屬地區提供"
 synthetic_refinery_amount: "$VALUE|Y0=$"
 synthetic_refinery_resource: "£resources_strip|$FRAME$"
 radar_station: "雷達站"
 radar_station_plural: "雷達站"
 radar_station_desc: "雷達可使你獲得鄰近地區的敵軍部隊情報。\n提高所屬地區的雷達站等級，便可增加雷達的有效距離。\n雷達也能在所屬地區附近提供更好的對空偵察能力，提高己方戰機接敵的概率。\n此外雷達還會提升探測敵方艦隊的能力。"
 rocket_site: "火箭基地"
 rocket_site_plural: "火箭基地"
 rocket_site_desc: "此建築可為所屬地區提供部署火箭的場所。"
 nuclear_reactor_heavy_water: "重水核反應堆"
 nuclear_reactor_heavy_water_plural: "重水核反應堆"
 nuclear_reactor_heavy_water_desc: "此建築可為所屬地區提供用於製造核武器的濃縮鈾的生產能力。\n使用重水的核反應堆比石墨反應堆建造成本更低，但產出的可用於核武器生產的材料更少。"
 nuclear_reactor: "核反應堆"
 nuclear_reactor_plural: "核反應堆"
 nuclear_reactor_desc: "此建築可為所屬地區提供用於製造核武器的濃縮鈾的生產能力。"
 commercial_nuclear_reactor: "民用核反應堆"
 commercial_nuclear_reactor_plural: "民用核反應堆"
 commercial_nuclear_reactor_desc: "此建築不僅為國家提供用於製造核武器的濃縮鈾，同時也為民用經濟的發展提供電力。"
 nuclear_facility: "核研究設施"
 nuclear_facility_plural: "核研究設施"
 nuclear_facility_desc: "核研究實驗設施允許你啟動與利用核能有關的研究項目。"
 air_facility: "空氣動力學與航空電子研究設施"
 air_facility_plural: "空氣動力學與航空電子研究設施"
 air_facility_desc: "空氣動力學和航空電子研究設施允許你啟動飛機、火箭和相關電子產品的研究項目。"
 naval_facility: "海軍工程設施"
 naval_facility_plural: "海軍工程設施"
 naval_facility_desc: "海軍工程設施允許你啟動與水面艦艇和潛艇相關的研究項目。\n海軍工程設施只能在沿海省份建造。"
 mega_gun_emplacement: "多級加速大口徑火炮"
 mega_gun_emplacement_plural: "多級加速火炮"
 mega_gun_emplacement_desc: "這種大口徑火炮採用多級加速，旨在實現無與倫比的射程。它利用一系列地下隧道，將炮彈加速到超音速，然後向遠處的目標發射。"
 stronghold_network: "要塞群"
 stronghold_network_plural: "要塞群"
 stronghold_network_desc: "這是一處由大量地堡與堅固陣地組成的廣泛的防禦系統，其主要使命在於擊退來犯之敵，以及確保關鍵戰略區域的安全。"
 land_facility: "地面戰設施"
 land_facility_plural: "地面戰設施"
 land_facility_desc: "地面戰設施允許你啟動與地面戰各方面相關的研究項目，如特種坦克或火炮。"
 landmark_statue_of_liberty: "自由女神像"
 landmark_statue_of_liberty_plural: "$landmark_statue_of_liberty$"
 landmark_statue_of_liberty_desc: "自由女神像矗立在紐約港，是移民進入美國的主要入口之一，象徵著移民們追求新生活的夢想。因此，它已經成為美國人崇尚“生命、自由和追求幸福”的精神象徵。"
 landmark_big_ben: "大本鐘"
 landmark_big_ben_plural: "$landmark_big_ben$"
 landmark_big_ben_desc: "威斯敏斯特鐘樓，更常見的名字是大本鐘，是英國的文化符號。它是聯合王國和議會民主最突出的象徵之一。它最初以哥特式復興風格完工於1859年，是大不列顛第三高塔。"
 landmark_colosseum: "羅馬競技場"
 landmark_colosseum_plural: "$landmark_colosseum$"
 landmark_colosseum_desc: "鬥獸場位於羅馬市中心，是迄今為止建造的最大規模的古代圓形露天競技場。提圖斯皇帝在位時該建築完工，此後，羅馬人和羅馬衰落後的市民一直在這裡進行娛樂活動。"
 landmark_cristo_redentor: "里約熱內盧基督像"
 landmark_cristo_redentor_plural: "$landmark_cristo_redentor$"
 landmark_cristo_redentor_desc: "救世基督像高聳於里約熱內盧，於1931年完工。這是巴西的國家象徵，在當地的天主教徒中具有重要意義。"
 landmark_eiffel_tower: "埃菲爾鐵塔"
 landmark_eiffel_tower_plural: "$landmark_eiffel_tower$"
 landmark_eiffel_tower_desc: "埃菲爾鐵塔以其創造者古斯塔夫·埃菲爾命名，於1889年完工。位於巴黎戰神廣場上的這座“鋼鐵女士”已經成為法蘭西全球文化和國家自豪感的象徵。"
 landmark_kremlin: "克里姆林宮"
 landmark_kremlin_plural: "$landmark_kremlin$"
 landmark_kremlin_desc: "莫斯科克裡姆林宮是一個堡壘建築群。建築群內有大克里姆林宮，它曾是俄羅斯皇帝的皇宮。克里姆林宮俯瞰南邊的莫斯科河，東邊的聖瓦西里大教堂和紅場，以及西邊的亞歷山大花園。如今，它代表著國家的權威及其對人民的控制。"
 landmark_berlin_reichstag: "帝國議會"
 landmark_berlin_reichstag_plural: "$landmark_berlin_reichstag$"
 landmark_berlin_reichstag_desc: "德國國會大廈，也被稱為國會大廈，是柏林共和國廣場上的一座歷史性立法政府建築。直到1933年國會大廈火災之前，德國聯邦議會一直在此辦公，但即便如此，這座象徵性建築在人民的心中依然具有重要意義。"
 landmark_tokyo_imperial_palace: "皇居"
 landmark_tokyo_imperial_palace_plural: "$landmark_tokyo_imperial_palace$"
 landmark_tokyo_imperial_palace_desc: "東京皇居是自明治維新最後一任幕府被推翻以來天皇的主要居所，它是日本人民自豪與崇敬的象徵，激勵著他們努力工作。"
 landmark_national_diet: "國會議事堂"
 landmark_national_diet_plural: "$landmark_national_diet$"
 landmark_national_diet_desc: "國會議事堂是日本國會兩院開會的建築。它於1936年初完工，幾乎全部採用日本材料建造，僅有少數例外。其前身於1925年在一場大火中被毀。儘管國會大廈多次倒塌，這一次它必將屹立數百年！"
 landmark_hakko_ichiu: "八紘一宇塔"
 landmark_hakko_ichiu_plural: "$landmark_hakko_ichiu$"
 landmark_hakko_ichiu_desc: "八紘一宇塔為紀念日本建國2600週年而建，是象徵日本“八紘一宇”命運、將世界八方統一於一個屋頂之下的紀念碑。"
 landmark_hofburg_palace: "霍夫堡宮"
 landmark_hofburg_palace_plural: "$landmark_hofburg_palace$"
 landmark_hofburg_palace_desc: "霍夫堡宮是哈布斯堡王朝曾經的主要皇宮，面向英雄廣場。也許有一天，這座宮殿可以再次被奧地利的統治者使用，不論是總統還是國王。"
 landmark_berlin_volkshalle: "人民大廳"
 landmark_berlin_volkshalle_plural: "$landmark_berlin_volkshalle$"
 landmark_berlin_volkshalle_desc: "人民大廳象徵著我們民族不可戰勝的精神，以及他們征服世界的自豪意志。它將向全世界展示，通過征服的力量，一切皆有可能，祖國甚至可以使最不可能的任務成為可能。"
 landmark_sadabad_complex: "薩德阿巴德宮"
 landmark_sadabad_complex_desc: "德黑蘭北部的薩德阿巴德宮由卡扎爾王朝建造，並得到了巴列維王朝的擴建，是伊朗的皇宮和權力中心。它的宮殿和花園反映了伊朗政治格局從保守主義到現代主義的轉變。"
 landmark_taj_mahal: "泰姬陵"
 landmark_taj_mahal_desc: "泰姬陵是莫臥兒建築的傑作。其宏偉的白色大理石圓頂和錯綜複雜的花園使其成為印度最具標誌性的象徵之一，是帝國權力和恆久傳承的證明。"
 landmark_hagia_sophia: "聖索菲亞"
 landmark_hagia_sophia_desc: "屹立於帝國十字路口的聖索菲亞是拜占庭的主教座堂，是奧斯曼的清真寺，是伊斯坦布爾不斷變化的統治者的象徵。它巨大的圓頂和宏偉的大廳既反映了它的屬靈意義，也反映了自稱該城市之主的那些人的野心。"
 naval_supply_hub: "海軍補給中心"
 naval_supply_hub_desc: "此建築可在該基地為你的艦隊提供母港之外的補給與燃料，從而可能延長你的§Y特遣艦隊§!的行動範圍。\n海軍補給中心只能建在擁有至少8級海軍基地的沿海省份。"
 naval_headquarters: "海軍指揮部"
 naval_headquarters_desc: "此建築使你能分配一名海軍將官，以提升海軍指揮部影響範圍內§Y特遣艦隊§!的行動效率。\n\n最多可同時指派海軍將官的指揮部數量為$MAXNUM|H$座.\n‑當前已指派：$CURRNUM|H$座\n\n海軍指揮部只能建在擁有至少8級海軍基地的沿海省份。"
 landmark_great_wall_section: "萬里長城"
 landmark_great_wall_section_desc: "長城歷經數百年、數十個朝代修建而成，是一項後勤傑作；如今，它堪稱中華民族面對逆境時無畏與不屈的象徵。"
 landmark_great_wall_section_plural: "$landmark_great_wall_section$"
 landmark_nanjing_presidential_palace: "南京總統府"
 landmark_nanjing_presidential_palace_desc: "南京總統府是一座古老而莊嚴的建築群，清朝滅亡後，偉大的孫中山先生曾在此宣誓就職。"
 landmark_nanjing_presidential_palace_plural: "$landmark_nanjing_presidential_palace$"
 landmark_nanjing_presidential_palace_prc: "$landmark_nanjing_presidential_palace$"
 landmark_nanjing_presidential_palace_prc_desc: "$landmark_nanjing_presidential_palace_desc$"
 landmark_nanjing_presidential_palace_prc_plural: "$landmark_nanjing_presidential_palace_plural$"
 landmark_nanjing_presidential_palace_gen: "$landmark_nanjing_presidential_palace$"
 landmark_nanjing_presidential_palace_gen_desc: "$landmark_nanjing_presidential_palace_desc$"
 landmark_nanjing_presidential_palace_gen_plural: "$landmark_nanjing_presidential_palace_plural$"
 landmark_forbidden_city: "紫禁城"
 landmark_forbidden_city_plural: "$landmark_forbidden_city$"
 landmark_forbidden_city_desc: "作為明朝古都的紫禁城，是中國悠久和諧與繁榮歷史的象徵。如今，其中的珍寶與文物已被秘密轉移，以防再次遭受日本入侵的威脅……"
 landmark_prague_castle: "布拉格城堡"
 landmark_prague_castle_desc: "坐落於布拉格的古老城堡是當今世界上規模最大的城堡建築群。數個世紀以來，這座城堡先後作為歷代國王與皇帝的居所，如今則成為捷克斯洛伐克的總統官邸。從建築外觀便可看出，它並非用於軍事防禦的堡壘，而是彰顯權力的象徵性建築，其恢弘氣勢令人聯想到莊嚴的皇家宮殿。城堡圍牆之內，矗立著捷克斯洛伐克最宏偉的教堂建築，這座教堂於1926年正式落成。"
 landmark_bojnice_castle: "博伊尼采城堡"
 landmark_bojnice_castle_desc: "博伊尼采城堡曾接待過匈牙利國王及其他高級貴族，但自1920年從匈牙利獨立出來後，它已成為斯洛伐克最美麗的建築之一。"
