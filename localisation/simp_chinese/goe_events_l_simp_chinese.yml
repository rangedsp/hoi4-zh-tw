 #### INDUSTRIAL EVENTS ####
 ###########################
 PER_industrial_events.1.t: "[FROM.GetNameDefCap]提供資源開採權"
 PER_industrial_events.1.desc: "今天，[PER.GetAdjective]政府聯絡我們，稱要提供$STATE_413$的石油的開採區。該地區擁有豐富的重要資源，也許這個提議值得考慮？"
 PER_industrial_events.1.a: "聽起來不錯"
 PER_industrial_events.1.b: "我們沒這個需要"
 PER_industrial_events.2.t: "[FROM.GetNameDefCap]接受我們的貿易提案"
 PER_industrial_events.2.desc: "[FROM.GetNameDefCap]欣然接受了我們關於石油的提議。這隻會有助於發展我們龐大的石油帝國。"
 PER_industrial_events.2.a: "這筆交易不虧！"
 PER_resource_rights_on_war_tt: "§R如果我們兩國爆發戰爭，資源開採權和地圖外工廠將被移除！§!"
 PER_industrial_events.3.t: "[FROM.GetNameDefCap]拒絕我們的貿易提案"
 PER_industrial_events.3.desc: "很遺憾，[FROM.GetNameDef]拒絕了我們慷慨的[PER.GetAdjective]石油貿易協議。也許我們最好去別處談談？"
 PER_industrial_events.3.a: "這是他們的損失！"
 #########################
 #### IMPERIAL EVENTS ####
 #########################
 PER_imperial_events.1.t: "[FROM.GetNameDefCap]希望簽訂互不侵犯條約"
 PER_imperial_events.1.desc: "今天早上，一位來自[PER.Capital.GetCapitalVictoryPointName]的使者抵達[SOU.Capital.GetCapitalVictoryPointName]，轉達了[PER.GetNameDef]沙阿希望簽署互不侵犯條約，以確保兩國安全的提議。考慮到[PER.GetNameDef]與我國南部邊疆的距離，我們應該慎重考慮此事。"
 PER_imperial_events.1.a: "我們同意。這是最好的"
 PER_imperial_events.1.b: "我們不能同意"
 PER_imperial_events.2.t: "[SOU.GetNameDefCap]同意簽訂互不侵犯條約"
 PER_imperial_events.2.desc: "好消息。我們的外交官從[SOU.Capital.GetCapitalVictoryPointName]返回，並帶回了[SOU.GetNameDef]願意簽署互不侵犯條約的消息。這將允許我們繼續制定作戰計劃，而無需擔心[SOU.GetAdjective]干預。"
 PER_imperial_events.2.a: "好消息"
 PER_imperial_events.3.t: "[SOU.GetNameDefCap]拒絕我方提議"
 PER_imperial_events.3.desc: "很遺憾，我們未能說服[SOU.GetNameDef]簽署互不侵犯條約。這意味著我們在繼續擴張時必須提防來自北方的威脅。"
 PER_imperial_events.3.a: "不幸的轉折……"
 PER_imperial_events.10.t: "[FROM.GetNameDefCap]索取俾路支領土"
 PER_imperial_events.10.desc: "今天我們收到[PER.GetNameDef]沙阿送來的消息，要求我們將俾路支斯坦的控制權移交給他們。根據[PER.GetAdjective]政府的說法，這裡是他們自古以來的領土。我們必須謹慎應對，如果我們激怒他們，可以會引發戰爭。"
 PER_imperial_events.10.a: "我們別無選擇，只能屈服"
 PER_imperial_events.10.b: "也許我們可以要一筆錢？"
 PER_imperial_events.10.c: "他們只能從我們的屍體上拿走這裡"
 PER_imperial_events.11.t: "[FROM.GetNameDefCap]同意移交俾路支斯坦"
 PER_imperial_events.11.desc: "好消息，[FROM.GetNameDefCap]做出了明智的決定，將俾路支斯坦移交給我們。我們終於在印度河區域有了一處立足點。"
 PER_imperial_events.11.a: "幹得漂亮"
 PER_imperial_events.12.t: "[FROM.GetNameDefCap]提議出售俾路支斯坦"
 PER_imperial_events.12.desc: "看來沒有一定的補償，[RAJ.GetAdjective]政府並不想釋放俾路支斯坦。我們要麼滿足他們的要求，要麼直接對他們宣戰。選擇在於你。"
 PER_imperial_events.12.a: "好吧，如果必須的話"
 PER_imperial_events.12.b: "那我們就用武力奪取"
 PER_imperial_events.12.c: "這都太冒險了。終止談判"
 PER_imperial_events.13.t: "[FROM.GetNameDefCap]同意購買俾路支斯坦"
 PER_imperial_events.13.desc: "好消息！[PER.GetNameDef]沙阿同意購買俾路支斯坦的控制權。我們會損失一小部分領土，但這筆錢卻能派上大用場。"
 PER_imperial_events.13.a: "好極了！"
 PER_imperial_events.14.t: "[FROM.GetNameDefCap]威脅開戰"
 PER_imperial_events.14.desc: "看來我們賭輸了，在收到我們的通知後，[PER.GetNameDef]沙阿正式向我國宣戰。他們的軍隊準備猛攻印度河流域，以武力奪取想要的地盤。真是遺憾。"
 PER_imperial_events.14.a: "集結部隊！"
 PER_imperial_events.15.t: "[FROM.GetNameDefCap]退讓"
 PER_imperial_events.15.desc: "看來[PER.GetNameDef]認為不值得冒險以武力奪取俾路支斯坦。至少我們暫時可以擁有和平。"
 PER_imperial_events.15.a: "謝天謝地"
 PER_imperial_events.16.t: "[FROM.GetNameDefCap]拒絕移交俾路支斯坦"
 PER_imperial_events.16.desc: "看來[RAJ.GetAdjective]政府已直截了當地拒絕放棄俾路支斯坦的領土。是時候拿好手中的槍，對[RAJ.GetNameDef]宣戰了！"
 PER_imperial_events.16.a: "那麼，開戰吧"
 PER_imperial_events.20.t: "禮薩·沙·巴列維遇刺！"
 PER_imperial_events.20.desc: "今天下午，德黑蘭市中心響起槍聲，禮薩·沙·巴列維在發表全國演講時被子彈擊中，情況危急。儘管急救人員盡了最大努力，沙阿還是遺憾地因傷去世。據透露，刺客是反對沙阿領導的[PER.GetAdjective]軍隊軍官。禮薩·沙·巴列維的兒子穆罕默德·禮薩·巴列維將宣誓繼任[PER.GetNameDef]沙阿。希望他的統治不再如此動盪。"
 PER_imperial_events.20.a: "[PER.GetNameDef]悲痛的一天……"
 PER_imperial_events.30.t: "波斯帝國慶典"
 PER_imperial_events.30.desc: "為慶祝居魯士大帝建立阿契美尼德帝國，[PER.GetNameDef]沙阿組織了一場盛大的遊行，以凸顯[PER.GetNonIdeologyName]的古代文明與歷史，並展示國家在他治下取得的進步。世界各主要國家的領導人都受邀參加，但不滿情緒在[PER.GetNameDef]窮人中迅速蔓延，他們認為這場表演不過是浪費錢財。不過，所有賓客都度過了一段美妙的時光，他們享用了精美的食物，並參觀了一場傑出的閱兵式。"
 PER_imperial_events.30.a: "多麼美妙！"
 PER_imperial_events.40.t: "選擇沙赫巴努"
 PER_imperial_events.40.desc: "穆罕默德·禮薩·巴列維在準備接任沙阿期間有充足的機會尋找愛情。有三個女人入了他的眼，但只有一位可以成為沙赫巴努，作為[PER.GetNameDef]攝政與他一起統治。她們分別是：埃及蘇丹的女兒法絲亞公主；沙阿的初戀伊朗·泰穆爾塔什；前朝公主，與沙阿在瑞士相遇的伊朗多赫特·卡扎爾。"
 PER_imperial_events.40.a: "沙阿將與埃及的法絲亞結婚"
 PER_imperial_events.40.b: "沙阿將與伊朗·泰穆爾塔什結婚"
 PER_imperial_events.40.c: "沙阿將與伊朗多赫特·卡扎爾結婚"
 PER_imperial_events.50.t: "禮薩·沙·巴列維在刺殺中生還！"
 PER_imperial_events.50.desc: "今天下午，德黑蘭市中心響起槍聲，發表全國演講的禮薩·沙·巴列維在一場拙劣的刺殺中差點被子彈命中。刺客立即被逮捕，並查明是反對沙阿領導的[PER.GetAdjective]軍隊軍官。沙阿已利用這次刺殺團結人民支持他的事業。"
 PER_imperial_events.50.a: "謝天謝地！"
 PER_imperial_events.60.t: "[FROM.GetNameDefCap]希望簽訂互不侵犯條約"
 PER_imperial_events.60.desc: "今天早上，一位來自[PER.Capital.GetCapitalVictoryPointName]的使者抵達[GER.Capital.GetCapitalVictoryPointName]，轉達了[PER.GetNameDef]沙阿希望簽署互不侵犯條約，以確保兩國安全的提議。考慮到[PER.GetNameDef]豐富的石油資源，我們應該慎重考慮此事。"
 PER_imperial_events.60.a: "我們同意。這是最好的"
 PER_imperial_events.60.b: "我們不能同意"
 PER_imperial_events.61.t: "[GER.GetNameDefCap]同意簽訂互不侵犯條約"
 PER_imperial_events.61.desc: "好消息。我們的外交官從[GER.Capital.GetCapitalVictoryPointName]返回，並帶回了[GER.GetNameDef]願意簽署互不侵犯條約的消息。這將允許我們繼續制定作戰計劃，而無需擔心[GER.GetNameDef]干預。"
 PER_imperial_events.61.a: "好消息"
 PER_imperial_events.62.t: "[GER.GetNameDefCap]拒絕提議"
 PER_imperial_events.62.desc: "很遺憾，我們未能說服[GER.GetNameDef]簽署互不侵犯條約。不過，我們仍可以在未來加入他們的陣營。"
 PER_imperial_events.62.a: "不幸的轉折……"
 PER_imperial_events.70.t: "禮薩·沙·巴列維希望訪問[GER.GetNameDef]"
 PER_imperial_events.70.desc: "今天早上，我們收到一封直接從[PER.GetNameDef]德黑蘭的薩德阿巴德宮寄來的信。禮薩·沙·巴列維表達了善意，希望訪問柏林提高兩國間的關係。元首一直渴望與[PER.GetNameDef]友好相處。我們該怎麼做？"
 PER_imperial_events.70.a: "無比榮幸。發出邀請"
 PER_imperial_events.70.b: "我們沒時間浪費在這種無聊的活動上"
 PER_imperial_events.71.t: "[GER.GetNameDefCap]邀請訪問"
 PER_imperial_events.71.desc: "作為對我們致[GER.GetNameDef]的友好信函的回應，[GER.GetLeader]已表示有興趣邀請我們訪問柏林，以提高兩國間的關係。由於我們在德黑蘭事務繁忙，因此這注定是一次短期旅行，但考慮到世界的緊張局勢，拉攏[GER.GetNameDef]是值得的。"
 PER_imperial_events.71.a: "我聽說每年這個時候勃蘭登堡門都非常美！"
 PER_imperial_events.72.t: "[GER.GetNameDefCap]太過繁忙無暇接待"
 PER_imperial_events.72.desc: "作為對我們致[GER.GetNameDef]的友好信函的回應，[GER.GetLeader]拒絕了我們訪問柏林的提議。真是遺憾，我們未能獲得接觸這位領導人的機會。唉，本不該這樣的。"
 PER_imperial_events.72.a: "好吧，那就回去工作"
 PER_imperial_events.80.t: "[PER.GetNameDef]的形勢"
 PER_imperial_events.80.desc: "很不幸，[PER.GetAdjective]軍隊最近的一次推進給我們造成了相當大的損失，尤其是他們還宣稱控制了我們的部分地區。[PER.GetNameDef]的局勢對我們不利，我們也許應該考慮降低損失，從該地撤軍。然而，這也意味著我們需要割讓一些領土給[PER.GetAdjective]。"
 PER_imperial_events.80.a: "我們有其他更大的問題。撤軍"
 PER_imperial_events.80.b: "不！我們必須推進！"
 PER_imperial_events.100.t: "德黑蘭條約"
 PER_imperial_events.100.desc: "在成功擊退入侵者並推進到他們的領土後，我們得以與敵人接觸，邀請他們的外交官前往德黑蘭進行和平談判。幸運的是，他們接受了建議，並在數小時的討論後，同意停止進攻[PER.GetNameDef]，並割讓邊境領土作為賠償。"
 PER_imperial_events.100.a: "希望他們永遠別再發動攻擊"
 PER_imperial_events.101.t: "談判失敗"
 PER_imperial_events.101.desc: "在成功擊退入侵者並推進到他們的領土後，我們得以與敵人接觸，邀請他們的外交官前往德黑蘭進行和平談判。很遺憾，他們不願與我們進行和平談判，因此戰爭將會繼續。"
 PER_imperial_events.101.a: "我們會進軍他們的首都！"
 PER_imperial_events.110.t: "$PER_imperial_events.80.t$"
 PER_imperial_events.110.desc: "$PER_imperial_events.80.desc$"
 PER_imperial_events.110.a: "$PER_imperial_events.80.a$"
 PER_imperial_events.110.b: "$PER_imperial_events.80.b$"
 PER_imperial_events.111.t: "獲得緩衝區"
 PER_imperial_events.111.desc: "在成功擊退[SOV.GetAdjective]人，並攻入他們的領土後，我麼得以與敵人接觸，邀請他們的外交官前往德黑蘭進行和平談判。幸運的是，他們接受了建議，並在數小時的討論後，同意割讓邊境領土作為長期戰爭的賠償。"
 PER_imperial_events.111.a: "我們的計劃奏效了！"
 PER_imperial_events.112.t: "談判失敗"
 PER_imperial_events.112.desc: "在成功擊退[SOV.GetAdjective]人並推進到他們的領土後，我們得以與敵人接觸，邀請他們的外交官前往德黑蘭進行和平談判。很遺憾，他們不願與我們進行和平談判，因此戰爭將會繼續。"
 PER_imperial_events.112.a: "我們會進軍他們的首都！"
 PER_imperial_events.120.t: "[PER.GetNameDefCap]商討投降"
 PER_imperial_events.120.desc: "今天早上，我們收到[PER.GetAdjective]政府的消息，他們願意投降，並允許我們佔領他們的土地，而他們作為傀儡國保留君主制。我們該如何回應？"
 PER_imperial_events.120.a: "聽起來可以接受"
 PER_imperial_events.120.b: "決不，推進到首都"
 PER_imperial_events.121.t: "[ENG.GetNameDefCap]接受我方提案"
 PER_imperial_events.121.desc: "幸運的是，[ENG.GetAdjective]政府已同意我們在他們的監督下繼續管理[PER.GetNameDef]。希望這能結束流血與死亡。"
 PER_imperial_events.121.a: "這是一種解脫……"
 PER_imperial_events.122.t: "[ENG.GetNameDefCap]拒絕我方提案"
 PER_imperial_events.122.desc: "很遺憾，[ENG.GetAdjective]政府拒絕了我們的投降條款。這意味著我們必須繼續戰鬥，而如果我們輸了，就必須按照他們的條款投降。"
 PER_imperial_events.122.a: "黑暗的時代……"
 PER_imperial_events.130.t: "[PER.GetNameDefCap]商討投降"
 PER_imperial_events.130.desc: "今天早上，我們收到[PER.GetAdjective]政府的消息，他們願意投降，並割讓北部的領土。我們該怎麼做？"
 PER_imperial_events.130.a: "聽起來可以接受"
 PER_imperial_events.130.b: "決不，推進到首都"
 PER_imperial_events.131.t: "[SOU.GetNameDefCap]接受我方提案"
 PER_imperial_events.131.desc: "很幸運，[SOU.GetAdjective]政府同意了我們的提議。我們失去了北方的領土，但至少阻止了[SOU.GetAdjective]軍隊繼續前進……"
 PER_imperial_events.131.a: "這是一種解脫……"
 PER_imperial_events.132.t: "[SOU.GetNameDefCap]拒絕我方提案"
 PER_imperial_events.132.desc: "很遺憾，[SOU.GetAdjective]政府拒絕了我們的投降條款。這意味著我們必須繼續戰鬥，而如果我們輸了，就必須按照他們的條款投降。"
 PER_imperial_events.132.a: "黑暗的時代……"
 PER_imperial_events.140.t: "[FROM.GetNameDefCap]宣佈獨立"
 PER_imperial_events.140.desc: "[FROM.GetLeader]宣佈[FROM.GetNameDef]不再承認[ROOT.GetAdjective]的宗主國地位。[FROM.GetNameDefCap]希望儘可能同[ROOT.GetNameDef]保持良好關係，但[FROM.GetLeader]也聲稱他們已準備好武裝起來，以在必要的時候捍衛他們的獨立。"
 PER_imperial_events.140.a: "他們需要來點教訓"
 PER_imperial_events.140.b: "我們還有更重要的事情去關心"
 PER_imperial_events.142.t: "[PER.GetAdjective]榮光重現"
 PER_imperial_events.142.desc: "事態的發展令人相當驚訝，[FROM.GetLeader]接受了[ROOT.GetAdjective]的獨立聲明。從此刻起，[FROM.GetNameDef]將不再對[ROOT.GetAdjective]的政治施加影響，無論是從內部還是外部。激動的人們聚集在[ROOT.Capital.GetCapitalVictoryPointName]的主廣場上，慶祝[ROOT.GetLeader]的領導。"
 PER_imperial_events.142.a: "枷鎖已被掙脫"
 PER_imperial_events.141.t: "紛爭再起"
 PER_imperial_events.141.desc: "不出所料，[FROM.getLeader]拒絕了此前[ROOT.GetLeader]發出的獨立請求。按照計劃，[ROOT.GetAdjective]武裝力量已經控制了國家的戰略要點。這一次，國家做好了準備。"
 PER_imperial_events.141.a: "自由！我們將戰至最後一人！"
 PER_imperial_events.150.t: "[FROM.GetNameDefCap]要求無條件和平"
 PER_imperial_events.150.desc: "隨著戰爭推進，我們已無法在預定時間內達成戰爭目標。因此，最近我們收到了來自[FROM.GetAdjective]政府的消息，要求雙方結束敵對。我們可以繼續戰爭，但是我們也必須考慮己方的損失。"
 PER_imperial_events.150.a: "形勢對我們不利……"
 PER_imperial_events.150.b: "我們必須繼續下去！會贏的！"
 PER_imperial_events.151.t: "[FROM.GetNameDefCap]撤軍"
 PER_imperial_events.151.desc: "好消息！[FROM.GetNameDefCap]同意了我們的和平要求，已開始從我們的邊境撤軍。為了阻擋他們，我們進行了漫長而艱辛的抗爭，今天是值得慶賀的一天！"
 PER_imperial_events.151.a: "這將被視為勝利！"
 PER_imperial_events.152.t: "[FROM.GetNameDefCap]拒絕議和"
 PER_imperial_events.152.desc: "這是黑暗的一天。我們的敵人決定繼續進攻我們的領土，儘管他們損失慘重而我們要求和平。既然他們想要戰鬥，那就給他們戰鬥。"
 PER_imperial_events.152.a: "他們會後悔沒抓住機會退出！"
 PER_imperial_events.153.t: "[FROM.GetNameDefCap]呼籲和平"
 PER_imperial_events.153.desc: "今晨，我們收到來自戰時內閣的消息，稱主導對[PER.GetNameDef]攻勢的盟友要求我們在其與敵方舉行和談期間停止敵對行動。鑑於我們參與該衝突是為了支援[FROM.GetAdjective]政府，繼續戰鬥毫無意義。"
 PER_imperial_events.153.a: "立刻撤回所有部隊。"
 PER_imperial_events.160.t: "[FROM.GetNameDefCap]要求我們投降"
 PER_imperial_events.160.desc: "隨著戰爭推進，我們已無法在預定時間內達成戰爭目標。事實上，我們反被推回了自己的領土。因此，最近我們收到了來自[FROM.GetAdjective]政府的消息，希望雙方結束敵對。[PER.GetNameDef]要求我們投降，並割讓邊境的領土作為賠償。我們可以繼續戰爭，但是我們也必須考慮己方的損失。"
 PER_imperial_events.160.a: "形勢對我們不利……"
 PER_imperial_events.160.b: "我們必須繼續下去！會贏的！"
 PER_imperial_events.161.t: "[FROM.GetNameDefCap]撤軍"
 PER_imperial_events.161.desc: "好消息！[FROM.GetNameDefCap]同意了我們的和平要求，已開始從我們的邊境撤軍。他們也開始商討割讓邊境領土的流程。為了阻擋他們，我們進行了漫長而艱辛的抗爭，今天是值得慶賀的一天！"
 PER_imperial_events.161.a: "這將被視為勝利！"
 PER_imperial_events.162.t: "[FROM.GetNameDefCap]拒絕議和"
 PER_imperial_events.162.desc: "這是黑暗的一天。我們的敵人決定繼續進攻我們的領土，儘管他們損失慘重而我們要求和平。他們不願償還自己的罪行，這是對發生的一切的羞辱。既然他們想要戰鬥，那就給他們戰鬥。"
 PER_imperial_events.162.a: "他們會後悔沒抓住機會退出！"
 PER_imperial_events.170.t: "[FROM.GetNameDefCap]要求我們投降"
 PER_imperial_events.170.desc: "隨著戰爭推進，我們已無法在預定時間內達成戰爭目標。事實上，我們反被推回了自己的領土。因此，最近我們收到了來自[FROM.GetAdjective]政府的消息，希望雙方結束敵對。如果我們投降，可能會因為戰爭賠款過上幾年苦日子。我們可以繼續戰爭，但是我們也必須考慮己方的損失。"
 PER_imperial_events.170.a: "形勢對我們不利……"
 PER_imperial_events.170.b: "我們必須繼續下去！會贏的！"
 PER_imperial_events.171.t: "[FROM.GetNameDefCap]撤軍"
 PER_imperial_events.171.desc: "好消息！[FROM.GetNameDefCap]同意了我們的和平要求，已開始從我們的邊境撤軍。他們的戰爭罪行意味著我們將得到賠償。為了阻擋他們，我們進行了漫長而艱辛的抗爭，今天是值得慶賀的一天！"
 PER_imperial_events.171.a: "這將被視為勝利！"
 PER_imperial_events.172.t: "$PER_imperial_events.162.t$"
 PER_imperial_events.172.desc: "$PER_imperial_events.162.desc$"
 PER_imperial_events.172.a: "$PER_imperial_events.162.a$"
 PER_imperial_events.180.t: "[FROM.GetNameDefCap]提議宣誓效忠"
 PER_imperial_events.180.desc: "今天早上，我們收到[PER.GetAdjective]政府的消息，他們願意成為我們的傀儡國以結束敵對。這將迅速結束戰爭，並讓我們專注於更大的目標。"
 PER_imperial_events.180.a: "雙贏"
 PER_imperial_events.180.b: "不行，繼續戰爭"
 PER_imperial_events.181.t: "[FROM.GetNameDefCap]同意我們的條款"
 PER_imperial_events.181.desc: "看來[FROM.GetAdjective]同意了我們的提議，開始起草我們的投降條款。儘管這並不是最理想的局面，但我們戴上[FROM.GetNameDef]的枷鎖可以拯救無數生命。"
 PER_imperial_events.181.a: "苦澀的勝利，但這是我們能達成的最好局面"
 PER_imperial_events.182.t: "[FROM.GetNameDefCap]拒絕我們的條款"
 PER_imperial_events.182.desc: "這是黑暗的一天。我們的敵人決定繼續進攻我們的領土，儘管他們損失慘重而我們要求和平。他們不願允許我們認輸，真是令人失望，我們別無選擇，只能繼續戰鬥。"
 PER_imperial_events.182.a: "真是遺憾……"
 PER_imperial_events.190.t: "[FROM.GetNameDefCap]希望商討投降條款"
 PER_imperial_events.190.desc: "今天早上，我們收到[PER.GetAdjective]政府的消息，他們願意允許我們獲取大量他們的自然資源以結束敵對。這將迅速結束戰爭，並讓我們專注於更大的目標。不僅如此，有了他們的石油，我們在未來的戰爭將處於有利的位置。"
 #PER_imperial_events.190.desc: "[GetROOTMainInvaderOrNot190]"
 MainInvader190: "今天早上，我們收到[PER.GetAdjective]政府提議結束敵對狀態的消息，作為回報，他們將允許我們獲取其大量的自然資源。這將迅速結束戰爭，使我們能專注於實現更遠大的目標。不僅如此，憑藉他們的石油特許權，我們還能在未來任何軍事行動中佔據有利地位。"
 NotMainInvader190: "今天早上，我們收到[PER.GetAdjective]政府提議結束敵對狀態的消息，雖然眼下我們不會獲得利益或補償，但這將迅速結束戰爭。"
 PER_imperial_events.190.a: "我們可以同意這些條款"
 PER_imperial_events.190.b: "這對我們不利，繼續戰爭"
 PER_imperial_events.191.t: "[FROM.GetNameDefCap]同意我們的條款"
 PER_imperial_events.191.desc: "看來[FROM.GetAdjective]同意了我們的提議，開始起草我們的投降條款。這意味著我們將失去部分自然資源，但遠比成為[FROM.GetNameDef]控制下的完全附屬國要好得多。"
 #PER_imperial_events.191.desc: "[GetROOTMainInvaderOrNot191]"
 MainInvader191: "看來[FROM.GetAdjective]同意了我們的提議，開始起草我們的投降條款。儘管這意味著我們將損失部分自然資源，但比起完全淪為[FROM.GetNameDef]統治下的臣民，條件已經算相當優厚。"
 NotMainInvader191: "看來[FROM.GetAdjective]同意了我們的提議，開始起草我們的投降條款。我們本希望不必走到這一步，但就當前局勢而言，這已經是最好的結果"
 PER_imperial_events.191.a: "這是我們能為[PER.GetNameDef]達成的最好結果"
 PER_imperial_events.192.t: "[FROM.GetNameDefCap]拒絕我們的條款"
 PER_imperial_events.192.desc: "這是黑暗的一天。我們的敵人決定繼續進攻我們的領土，儘管他們損失慘重而我們要求和平。他們不願允許我們結束戰爭並給予他們資源，真是令人失望，我們別無選擇，只能繼續戰鬥。"
 #PER_imperial_events.192.desc: "[GetROOTMainInvaderOrNot192]"
 MainInvader192: "這是黑暗的一天。我們的敵人決定繼續進攻我們的領土，儘管他們損失慘重而我們要求和平。他們不願允許我們認輸並移交我們的資源，真是令人失望，我們別無選擇，只能繼續戰鬥。"
 NotMainInvader192: "這是黑暗的一天。我們的敵人決定繼續進攻我們的領土，儘管他們損失慘重而我們要求和平。他們不願允許我們雙方結束戰爭，真是令人失望，我們別無選擇，只能繼續戰鬥。"
 PER_imperial_events.192.a: "真是遺憾……"
 PER_imperial_events.200.t: "薩德阿巴德條約"
 PER_imperial_events.200.desc: "[SSB_leader.GetLeader]日前就達成一份互不侵犯協議的事由與[ROOT.GetLeader]展開了會談，這無疑為雙方未來的合作開拓了空間。[event_target:SSB_leader.GetAdjective]的外交官們顯然為此次會談煞費苦心，他們試圖通過宣揚兩國間的共有歷史和利益，以及兄弟國家間應和平共處等等來打動我國。這場冗長的會談雖然氣氛和諧，但是否同意簽署的選擇權，掌控在我國手中。"
 PER_imperial_events.200.a: "我們當然會簽署這份友好條約！"
 PER_imperial_events.200.b: "別和我們沾親帶故，[SSB_leader.GetLeader]：我們跟你不熟"
 PER_imperial_events.210.t: "[FROM.GetName]索取邊境領土！"
 PER_imperial_events.210.desc: "[FROM.GetLeader]給[ROOT.GetLeader]寫了一封長篇大論的信，要求我國將部分邊疆領土割讓給[FROM.GetAdjective]。這很明顯是對我國主權的惡劣侵犯，但也意味著如果我們拒絕，[FROM.GetNameDef]可能會採取激烈行動奪取這些土地。我們該如何應對？"
 PER_imperial_events.210.a: "割讓領土……"
 PER_imperial_events.210.b: "他們永遠無法奪走我們的土地"
 PER_imperial_events.211.t: "[FROM.GetName]同意我們的要求！"
 PER_imperial_events.211.desc: "今天早上，我們收到[FROM.GetNameDef]的消息，稱他們勉強同意了我們的要求，已開始割讓邊境領土的流程。他們完全不知道這隻會讓我們更進一步。"
 PER_imperial_events.211.a: "那些蠢貨……"
 PER_imperial_events.212.t: "[FROM.GetName]拒絕我們的要求！"
 PER_imperial_events.212.desc: "今天早上，我們收到[FROM.GetNameDef]的消息，稱他們斷然拒絕我們的要求。這不是什麼大問題，但也意味著我們必須通過老方法來奪取這些領土。"
 PER_imperial_events.212.a: "他們會後悔的"
 PER_imperial_events.220.t: "選舉季"
 PER_imperial_events.220.desc: "由於[PER.GetAdjective]政府進行了大規模重組，我國舉行了選舉，允許[PER.GetNameDef]人民選擇他們的新首相。隨著許多公民湧向投票站，有兩位候選人脫穎而出：穆罕默德·摩薩臺和穆罕默德·阿里·福魯吉。國家最終會如何投票？"
 PER_imperial_events.220.a: "摩薩臺是不二人選"
 PER_imperial_events.220.b: "也許福魯吉是更好的選擇？"
 PER_imperial_events.220.c: "卡沙尼會增強教士的支持"
 PER_imperial_events.201.t: "[FROM.GetName]簽署薩德阿巴德條約"
 PER_imperial_events.201.desc: "當我方提議簽署展現友誼的互不侵犯條約時，[FROM.GetLeader]表現得非常熱情，乾淨利落地便籤署了相關文件。隨著條約落定，我們向著國內和平乃至世界和平都前進了一大步！"
 PER_imperial_events.201.a: "誠應時刻和[ROOT.GetNameDef]親善友好"
 PER_imperial_events.202.t: "[FROM.GetName]拒絕簽署薩德阿巴德條約！"
 PER_imperial_events.202.desc: "[FROM.GetLeader]給[ROOT.GetLeader]回覆了封冗長的信函，稱簽署所謂展現友誼的互不侵犯條約的提議簡直一文不值。這還沒完，[FROM.GetLeader]繼續寫道，稱試圖在[FROM.GetNameDef]和[ROOT.GetNameDef]間構建聯盟簡直是浪費時間，若有機會，他們未來更願意選擇一個將[ROOT.GetAdjective]排除在外的方案。"
 PER_imperial_events.202.a: "……何不直截了當地說“不”"
 PER_imperial_events.230.t: "卡扎爾王朝迴歸"
 PER_imperial_events.230.desc: "在[ENG.GetNameDef]流亡多年後，卡扎爾王朝的王位繼承人，穆罕默德·哈桑·米爾扎，渴望重返[PER.GetNameDef]的王位。巴列維王朝的統治未能達到[ENG.GetAdjective]政府的期望，[ENG.GetAdjective]希望讓前朝王室家族重新掌權，以維護其在該地區的利益。"
 PER_imperial_events.230.a: "那還等什麼？準備加冕禮！"
 PER_imperial_events.230.b: "廢黜巴列維王朝是明智的舉動。"
 PER_imperial_events.230.c: "將巴列維王朝流放至[SAF.GetNameDef]。"
 PER_imperial_events.231.t: "巴列維家族被解除權力"
 PER_imperial_events.231.desc: "經過慎重考慮，巴列維王朝被趕下[PER.GetNameDef]的王位。儘管他們為國家服務數十年，但我們必須支持[ENG.GetAdjective]政府。雖然他們已不再屬於[PER.GetAdjective]王室，但仍試圖在國內政界佔有一席之地。"
 PER_imperial_events.231.a: "很好。現在我們必須為新任卡扎爾沙阿加冕。"
 PER_imperial_events.232.t: "巴列維家族流亡至[SAF.GetNameDef]"
 PER_imperial_events.232.desc: "依照將卡扎爾王朝重新扶上[PER.GetNameDef]王位的計劃，我們決定將巴列維家族流放到[SAF.GetNameDef]，這是對國家未來最有利的選擇。此舉將贏得[ENG.GetNameDef]的好感，或許能說服他們未來給予我們更多自治權。"
 PER_imperial_events.232.a: "真遺憾，但我們現在必須為新任卡扎爾沙阿加冕。"
 PER_imperial_events.233.t: "穆罕默德·哈桑·米爾扎的加冕"
 PER_imperial_events.233.desc: "今日上午，在[FROM.Capital.GetCapitalVictoryPointName]舉行的盛大加冕典禮上，穆罕默德·哈桑·米爾扎被加冕為[PER.GetNameDef]的新沙阿。在巴列維王朝統治數十年後，卡扎爾家族再次成為這個偉大國家的君主。我們恢復卡扎爾王朝的努力令[ENG.GetAdjective]政府感到滿意，他們希望此舉能讓他們更好地維護在[PER.GetNameDef]的利益。"
 PER_imperial_events.233.a: "敬我們的新沙阿！"
 PER_islamic_revolution_events.1.t: "教士內部不穩"
 PER_islamic_revolution_events.1.desc: "看來我們在國家發展方面做出的一些決定開始讓部分神職人員感到不滿了。他們的厭惡情緒持續發酵，我們必須謹慎行事，以免進一步刺激他們。"
 PER_islamic_revolution_events.1.a: "我們應該謹慎行事"
 PER_islamic_revolution_events.2.t: "伊斯蘭革命者活動"
 PER_islamic_revolution_events.2.desc: "我們繼續排擠教士的行動導致許多高階伊斯蘭教士開始在[PER.GetNameDef]民眾中召集支持者。我們的時間不多了，一場革命有可能爆發。我們該如何應對？"
 PER_islamic_revolution_events.2.a: "鎮壓這些革命者"
 PER_islamic_revolution_events.2.b: "立即安撫教士"
 PER_islamic_revolution_events.2.c: "讓他們試試！"
 PER_foreign_policy_events.1.t: "[FROM.GetNameDef]施壓"
 PER_foreign_policy_events.1.desc: "看起來[FROM.GetAdjective]政府對我方外交狀況愈發焦急。在上個星期裡，[FROM.GetAdjective]大使已經與[THIS.GetLeader]會晤了至少六次，並在最後一輪談判中實際遞交了一份最後通牒。\n\n要麼我們加入[FROM.GetNameDef]的防禦條約，並接受“就國內事務進行一定程度的磋商”，要麼[FROM.GetNameDef]很可能對我國訴諸武裝干涉。"
 PER_foreign_policy_events.1.a: "抵抗是徒勞的"
 PER_foreign_policy_events.1.b: "讓他們放馬過來！"
 PER_foreign_policy_events.2.t: "[FROM.GetNameDefCap]拒絕"
 PER_foreign_policy_events.2.desc: "我們試圖通過外交手段解決與[FROM.GetNameDef]的突出問題似乎已經行不通了。當我們的大使向[FROM.GetLeader]呼籲另一輪談判時，他被直白地告知[FROM.GetAdjective]已經清楚表明了其立場，沒有繼續討論下去的必要了。"
 PER_foreign_policy_events.2.a: "我們不會步步緊逼，至少不是現在"
 PER_foreign_policy_events.2.b: "準備入侵[FROM.GetNameDef]！"
 PER_foreign_policy_events.2.c: "我們必須準備與[SOU.GetAdjective]一起發動聯合入侵行動"
 PER_foreign_policy_events.3.t: "英國-[SOV.GetAdjective]入侵伊朗"
 PER_foreign_policy_events.3.desc: "我們收到了來自[FROM.GetNameDef]的外交照會，提議針對[PER.GetNameDef]發起一場聯合軍事行動。[FROM.GetAdjective]指揮部確認這次行動將會使我們確保伊朗的油田以及通向[FROM.GetNameDef]的補給線，同時可以阻止任何潛在敵人從[TUR.GetNameDef]通過[PER.GetName]進軍巴庫油田和[RAJ.GetNameDef]。"
 PER_foreign_policy_events.3.a: "我們必須保證波斯走廊安全無虞！"
 PER_foreign_policy_events.3.b: "我們應當尊重[PER.GetAdjective]的獨立"
 PER_foreign_policy_events.4.t: "英國-[SOV.GetAdjective]入侵伊朗"
 PER_foreign_policy_events.4.desc: "[FROM.GetAdjective]大使已經遞交了一份照會，稱[FROM.GetNameDef]同意組織併發起一場針對[PER.GetNameDef]的聯合軍事行動。[ROOT.GetAdjective]和[FROM.GetAdjective]指揮部都有信心，這將會是面對數量不足且科技落後的敵人一次快速有效的行動，並能使我們確保伊朗油田以及[FROM.GetAdjective]到[ROOT.GetNameDef]的補給線，同時可以阻止任何潛在敵人從[TUR.GetNameDef]通過[PER.GetName]進軍巴庫油田和[RAJ.GetNameDef]。"
 PER_foreign_policy_events.4.a: "開始準備工作！"
 PER_foreign_policy_events.5.t: "[FROM.GetAdjective]政府拒絕"
 PER_foreign_policy_events.5.desc: "經過[ROOT.GetAdjective]與[FROM.GetAdjective]數場毫無營養的外交會議之後，[FROM.GetNameDef]決定不參與我們對[PER.GetNameDef]的計劃。[FROM.GetLeader]本人甚至暗示這項提議不過是為我們領土野心的辯護。\n看起來我們得自己處理[PER.GetNameDef]了。"
 PER_foreign_policy_events.5.a: "他們總是這樣靠不住……"
 PER_revolution_events.1.t: "政變迫在眉睫"
 PER_revolution_events.1.desc: "今天早上，聯合起來的反對黨滲透入軍隊，拿起武器反抗我們！他們準備向薩德阿巴德宮進軍！我們必須準備好反擊，以保衛[PER.GetNameDef]的主權！"
 PER_revolution_events.1.a: "集結部隊！"
 PER_communist_events.1.t: "激進活動增加"
 PER_communist_events.1.desc: "最近幾天，主張獨立的激進派變得越發活躍。目前尚不清楚是什麼導致瞭如此情況，但街頭支持民族主義和社會主義的言論激增，地方當局對此十分擔心。如果我們想阻止事態升級，也許將不得不動手鎮壓。"
 PER_communist_events.1.a: "令人擔憂的發展"
 PER_communist_events_1_tt: "解鎖§Y$PER_anti_gulf_decisions_cat$§!決議以鎮壓抵抗。"
 PER_communist_events.2.t: "鎮壓庫爾德獨立運動"
 PER_communist_events.2.desc: "[FROM.GetAdjective]當局策劃了一場針對庫爾德獨立運動的鎮壓。我們在當地的聯絡人要麼躲藏起來，要麼跨越邊境逃往[ROOT.GetNameDef]。"
 PER_communist_events.2.a: "我們得加倍努力"
 PER_communist_events.3.t: "庫爾德叛亂迫在眉睫"
 PER_communist_events.3.desc: "最近，庫爾德分離主義者和社會主義者的活動已趨近白熱化。越來越多證據表明，全國各地都有武器被分發，為即將到來的叛亂進行準備。如果我們不快點採取行動，全面戰爭或許將不可避免。"
 PER_communist_events.3.a: "我們必須阻止事態升級！"
 PER_communist_events_3_tt: "§R我們必須鎮壓異見人士才能避免庫爾德叛亂和戰爭！§!"
 PER_communist_events.4.t: "[PER.GetAdjective]邊境抵抗活動增強"
 PER_communist_events.4.desc: "最近，我們佔領的[PER.GetAdjective]邊境周邊領土的抵抗活動明顯增加。雖然具體原因尚不明朗，但許多人擔心這是有人在煽動反[ROOT.GetAdjective]情緒，意圖削弱我們在該地區的存在。"
 PER_communist_events.4.a: "誰是幕後黑手？"
 PER_communist_events_4_tt: "§R我們在波斯灣的地區在接下來的幾個月裡抵抗活動會增強！§!"
 PER_communist_events.5.t: "波斯灣危機"
 PER_communist_events.5.desc: "似乎波斯灣及周邊地區最近的騷亂大部分出自[FROM.GetNameDef]之手。他們在該地區取得了一系列戰略勝利，現在看來已鼓足勇氣採取迄今為止最大的行動。[FROM.GetAdjective]向我國政府發出嚴厲警告，要求我們完全撤出阿拉伯半島和波斯灣，甚至表示如果我們拒絕，他們將封鎖波斯灣。"
 PER_communist_events.5.a: "我們只能撤離"
 PER_communist_events.5.b: "他們和……哪國的海軍？"
 PER_communist_events.6.t: "[FROM.GetNameDefCap]同意撤離"
 PER_communist_events.6.desc: "儘管口頭上咄咄逼人，但[FROM.GetAdjective]軍隊還是開始撤出波斯灣。這是我們政府巨大的戰略勝利，並被全球許多國家視為殖民主義衰落的標誌。"
 PER_communist_events.6.a: "我們的工作尚未完成！"
 PER_communist_events.7.t: "[FROM.GetNameDefCap]拒絕撤離"
 PER_communist_events.7.desc: "不出所料，[FROM.Capital.GetCapitalVictoryPointName]的蠢驢們拒絕撤出波斯灣和阿拉伯半島的爭議地區。他們似乎認為我們缺乏封鎖海上航線作為反制的決心。"
 PER_communist_events.7.a: "那麼，我們將展示我們的決心"
 PER_communist_events.7.b: "我們承擔不起事態升級的後果"
 PER_communist_events.8.t: "[FROM.GetNameDefCap]封鎖波斯灣"
 PER_communist_events.8.desc: "海灣危機顯著升級，[FROM.GetNameDef]兌現了威脅，開始封鎖該地區的海上和空中航運。此外，情報顯示他們的軍隊已提高戰備狀態，以應對與我們的衝突。"
 PER_communist_events.8.a: "準備炮艇"
 PER_communist_events.8.b: "他們表達了自己的觀點，下令撤離"
 PER_communist_events.9.t: "[FROM.GetNameDefCap]措辭軟化"
 PER_communist_events.9.desc: "看來我們堅決捍衛自己利益的行動揭穿了[FROM.GetNameDef]的色厲內荏。[FROM.GetLeader]在一場措辭謙卑的演講中，嚴正申明瞭他們維護和平的堅定渴望。他們的盟友很可能會對[FROM.GetAdjective]放棄原則而感到震驚。"
 PER_communist_events.9.a: "這會給他們一個教訓"
 PER_communist_events.10.t: "[FROM.GetNameDefCap]派出海軍"
 PER_communist_events.10.desc: "在[FROM.GetNameDef]決定派遣一支海軍特遣部隊打破我們對波斯灣的封鎖後，通過外交解決海灣危機已再無可能。如果我們想出其不意，可以立即發動先發制人的攻擊。否則，也許我們應該讓步服輸。"
 PER_communist_events.10.a: "我們會在擁有優勢時出擊"
 PER_communist_events.10.b: "只好賠禮道歉了"
 PER_communist_events.11.t: "[FROM.GetNameDefCap]請求軍事科技"
 PER_communist_events.11.desc: "[FROM.GetNonIdeologyName]政府請求對他們的反艦技術開發進行工程支持，以便他們能針對波斯灣殖民列強的威脅制定適當的對策。他們承諾與我們分享未來的任何開發。"
 PER_communist_events.11.a: "他們的安全對我們同樣重要"
 PER_communist_events.11.b: "我們不會交換國家機密"
 PER_communist_events.12.t: "[FROM.GetNameDefCap]同意轉讓技術"
 PER_communist_events.12.desc: "在[FROM.GetAdjective]決定與我們分享一些軍事技術後，我們的工程師熱切期待著機密[FROM.GetAdjective]研究和設計的到來。這將大大加快我們自己的設計。"
 PER_communist_events.12.a: "好極了！"
 PER_communist_events.13.t: "[FROM.GetNameDefCap]拒絕技術轉讓"
 PER_communist_events.13.desc: "[FROM.GetAdjective]政府拒絕了我們的要求，不肯支援我們能更好地對抗波斯灣外國海軍力量的科技。這打擊了我們的工程師，但他們現在打算自己繼續研發。"
 PER_communist_events.13.a: "沒他們我們也會成功"
 PER_communist_events.14.t: "[FROM.GetNameDefCap]交付設計方案"
 PER_communist_events.14.desc: "根據我們與[FROM.GetNameDef]的協議，他們交付了一種武器設計方案，認為這能將帝國主義者逐出波斯灣。該設計方案能否滿足我們的需要還有待觀察。"
 PER_communist_events.14.a: "他們能信守諾言真是太好了"
 PER_communist_events.20.t: "[KUR.GetAdjective]人民要求自治"
 PER_communist_events.20.desc: "為了抵制去部落化政策並響應整體自治訴求，新成立的庫爾德斯坦民主黨正式要求在[SOU.GetNameDef]內以獨立社會主義共和國的形式運作。我們面臨抉擇：是繼續維持對該地區的直接管控，還是將其移交給[KUR.GetAdjective]人民。"
 PER_communist_events.20.a: "給他們自治權。"
 PER_communist_events.20.b: "這片土地應保留在我們的管轄範圍內。"
 PER_fascist_events.1.t: "召開帝國議會"
 PER_fascist_events.1.desc: "我們已召開帝國議會，決定最適合的沙阿人選。一些人主張復辟卡扎爾王朝，另一些人建議讓巴列維王朝繼續執政以確保人民眼中的合法性。與此同時，還有一些人認為應該建立新王朝。"
 PER_fascist_events.1.a: "巴列維傀儡非常適合我們"
 PER_fascist_events.1.b: "新的伊朗，新的王朝"
 ### Iraq Events ###
 IRQ_political_events.10.t: "[FROM.GetNonIdeologyName]廢除條約"
 IRQ_political_events.10.desc: "1930年達成的《英伊條約》允許這個年輕的國家享有更大的自治權，同時也使他們在根本上受制於我們的外交政策。然而，[FROM.GetAdjective]政府廢除了這項條約，並要求我們完全撤出他們的領土。由於我們十分依賴該地區的石油，如果[FROM.GetAdjective]政府決定切斷我們的石油供應，可能會危及我們整個國家的安全。"
 IRQ_political_events.10.a: "我們應該出手干預，讓我們的朋友重新掌權"
 IRQ_political_events.10.b: "提出外交抗議"
 IRQ_political_events.11.t: "[FROM.GetNameDef]提出外交抗議"
 IRQ_political_events.11.desc: "讓我們驚訝的是，[FROM.GetAdjective]政府對於我們廢除《英伊條約》只是向我們的大使提出了措辭強硬的外交抗議。目前來看，我們無需畏懼來自[FROM.GetAdjective]的嚴重影響。"
 IRQ_political_events.11.a: "阿拉伯世界的勝利！"
 IRQ_political_events.12.t: "[FROM.GetNameDefCap]索要土地"
 IRQ_political_events.12.desc: "[FROM.GetNameDef]政府要求我們割讓擁有大量阿拉伯人的西部領土，並宣稱這是為了保護該地區的阿拉伯人。然而，這裡也擁有大量有利於經濟的石油基礎設施。如果我們拒絕這一最後通牒，他們很可能會試圖通過武力奪取土地。"
 IRQ_political_events.12.a: "我們會保衛我們的領土"
 IRQ_political_events.12.b: "不值得為此開戰"
 IRQ_political_events.13.t: "[FROM.GetNameDefCap]同意移交領土"
 IRQ_political_events.13.desc: "[FROM.GetNameDefCap]政府同意移交我們索要的領土。雖然我們已準備好為此開戰，但看起來不用戰鬥就已經贏了。"
 IRQ_political_events.13.a: "阿拉伯世界的又一場勝利！"
 IRQ_political_events.14.t: "[FROM.GetNameDefCap]拒絕移交領土"
 IRQ_political_events.14.desc: "[FROM.GetNameDefCap]政府拒絕移交我們索要的領土。看來如果我們想將這裡從[FROM.GetAdjective]的統治中解放，就必須依靠我們的部隊了。"
 IRQ_political_events.14.a: "那我們就用武力奪取"
 IRQ_political_events.14.b: "他們已經看出我們在虛張聲勢了"
 IRQ_political_events.15.t: "與[FROM.GetNameDef]的緊張關係緩和"
 IRQ_political_events.15.desc: "看來[FROM.GetAdjective]軍隊解除了邊境的高度準備狀態。儘管我們已準備好保衛領土，但暫時避免戰爭仍然讓人欣慰。"
 IRQ_political_events.15.a: "真是鬆了一口氣"
 IRQ_political_events.16.t: "[FROM.GetNameDefCap]索要[455.GetName]"
 IRQ_political_events.16.desc: "[FROM.GetAdjective]政府清洗了軍隊中的親[GER.GetAdjective]軍官，證明了對我們的忠誠，並藉此請求與相鄰的[455.GetName]一體化。兩國王室的聯繫已經存在，這會減輕我們的行政負擔。"
 IRQ_political_events.16.a: "我們應該獎勵他們，只要當地人沒意見"
 IRQ_political_events.16.b: "他們不值得信任"
 IRQ_political_events.17.t: "[FROM.FROM.GetNonIdeologyName]希望統治我們"
 IRQ_political_events.17.desc: "[FROM.FROM.GetNonIdeologyName]試圖接管[ROOT.GetNameDef]的行政權，擴大其在[FROM.GetAdjective]勢力範圍內的職責。如果我們統一，將不再直接對[FROM.GetAdjective]負責，但我們仍然缺少在世界舞臺上獨立行動的手段。"
 IRQ_political_events.17.a: "值得歡迎的變化"
 IRQ_political_events.17.b: "我們對現狀很滿意"
 IRQ_political_events.18.t: "[FROM.GetNameDefCap]同意移交"
 IRQ_political_events.18.desc: "今天對於我國是個好日子，我們正式接管了[455.GetName]的行政管理。這標誌著我們朝著統一大阿拉伯世界邁出了意義深遠的一步。"
 IRQ_political_events.18.a: "值得慶祝的時刻！"
 IRQ_political_events.19.t: "[FROM.GetNameDefCap]拒絕移交領土"
 IRQ_political_events.19.desc: "由於諸多複雜因素，[FROM.GetNameDef]拒絕讓我們接管[455.GetName]。儘管我們竭盡全力取悅[FROM.GetAdjective]，但他們似乎仍蔑視和不信任我們。"
 IRQ_political_events.19.a: "對[ROOT.GetNonIdeologyName]和[455.GetName]來說真是糟糕的一天"
 IRQ_political_events.20.t: "[FROM.GetNameDef]政府拒絕提議"
 IRQ_political_events.20.desc: "[FROM.GetAdjective]政府拒絕了將國家職責轉交給[IRQ.GetNonIdeologyName]的計劃。我們本以為這會讓他們高興，但看來他們寧願與認知中的魔鬼待在一起。"
 IRQ_political_events.20.a: "真是讓人驚訝"
 IRQ_political_events.21.t: "[FROM.GetNameDefCap]要求控制[454.GetName]"
 IRQ_political_events.21.desc: "[FROM.GetNameDef]政府要求我們在近期爆發的暴力事件後立即撤出[PAL.GetName]。他們認為自己更適合管理託管地，而我們正在傷害他們的阿拉伯同胞。雖然撤出在軍事上對我們有利，但在外交上卻會造成廣泛的破壞。"
 IRQ_political_events.21.a: "安排轉交控制權，但先諮詢當地人"
 IRQ_political_events.21.b: "他們忘記了自己的地位"
 IRQ_political_events.22.t: "[FROM.FROM.GetNonIdeologyName]計劃撤出"
 IRQ_political_events.22.desc: "[FROM.GetAdjective]政府計劃從[ROOT.GetName]撤軍，並將管理權移交[IRQ.GetNameDef]。除非我們立即中斷這一進程，否則我們會在幾天後接受[IRQ.Capital.GetCapitalVictoryPointName]的命令。"
 IRQ_political_events.22.a: "當前安排是站不住腳的……"
 IRQ_political_events.22.b: "我們有自己的議程"
 IRQ_political_events.23.t: "[ENG.GetNameDefCap]同意移交領土"
 IRQ_political_events.23.desc: "[ENG.GetAdjective]政府明白形勢對他們極為不利，因此已同意撤離[454.GetName]，並將這裡移交給我們。"
 IRQ_political_events.23.a: "今天，阿拉伯的團結取得了勝利"
 IRQ_political_events.24.t: "[FROM.GetNameDefCap]拒絕移交領土"
 IRQ_political_events.24.desc: "由於諸多複雜因素，[FROM.GetNameDef]拒絕讓我們接管[454.GetName]。儘管我們提出允許[ENG.GetAdjective]和平撤除該地區，他們仍選擇繼續血腥且不計代價地佔領這裡。"
 IRQ_political_events.24.a: "今天，阿拉伯世界在哭泣"
 IRQ_political_events.24.b: "不可容忍。我們與[FROM.GetNameDefCap]的合作結束了"
 IRQ_political_events.25.t: "[FROM.GetNameDef]政府拒絕提議"
 IRQ_political_events.25.desc: "[FROM.GetAdjective]政府拒絕將職責轉交給[IRQ.GetNonIdeologyName]。我們本以為他們會願意，但看來他們寧可堅持邪道。"
 IRQ_political_events.25.a: "帝國主義的走狗"
 IRQ_political_events.26.t: "[FROM.GetNameDefCap]提供聯邦成員資格"
 IRQ_political_events.26.desc: "[FROM.GetNameDef]外交官提議我們加入他們的聯邦。雖然加入毫無疑問會帶來經濟和安全方面的好處，但我們也將不得不放棄大部分自主權。"
 IRQ_political_events.26.a: "我們在一起會更強大"
 IRQ_political_events.26.b: "我們目前沒興趣"
 IRQ_political_events.26.c: "我們永遠不會放棄主權！"
 IRQ_political_events.27.t: "[FROM.GetNameDefCap]同意加入聯邦"
 IRQ_political_events.27.desc: "[FROM.GetNameDefCap]明智地決定加入聯邦。我們的公務員和外交官正在為倉促的一體化進程安排所有事項。"
 IRQ_political_events.27.a: "我們在一起會更強大"
 IRQ_political_events.28.t: "[FROM.GetNameDefCap]拒絕加入聯邦"
 IRQ_political_events.28.desc: "[FROM.GetNameDefCap]愚蠢地決定拒絕加入聯邦。不過，他們並未表示將來他們的人民對此更接受時也反對加入。"
 IRQ_political_events.28.a: "也許他們會改變主意？"
 IRQ_political_events.29.t: "[FROM.GetNameDefCap]反對聯邦"
 IRQ_political_events.29.desc: "[FROM.GetNameDefCap]嚴詞拒絕了我們的聯邦提議。他們堅稱由於擔心對國家的影響，他們永遠不會願意接受此類安排。"
 IRQ_political_events.29.a: "一群鼠目寸光的傢伙……"
 rejected_hashemite_federation_tt: "§R我們將不再能邀請[FROM.GetNameDef]加入我們的聯邦！§!"
 IRQ_regent_turned_down_absolute_powers: "§Y阿卜杜勒·伊拉§!拒絕了恢復專制君主制的機會"
 #Demand Leb
 IRQ_political_events.30.t: "[FROM.GetNameDef]要求控制[553.GetName]"
 IRQ_political_events.30.desc: "[FROM.GetNameDef]政府以他們有責任保護和統一黎巴嫩的阿拉伯人為由，大膽地要求我們放棄黎巴嫩的控制權。雖然他們名義上是為了泛阿拉伯主義，但很明顯該地的戰略位置和經濟潛力，包括其寶貴的港口和基礎設施，才是他們真正的目標。如果我們拒絕此要求，他們不太可能和平地擱置此事。"
 IRQ_political_events.30.a: "我們承擔不起另一場戰爭了"
 IRQ_political_events.30.b: "他們在虛張聲勢"
 IRQ_political_events.31.t: "[FROM.GetNameDefCap]要求控制[553.GetName]"
 IRQ_political_events.31.desc: "[FROM.GetNameDef]政府要求我們在近期爆發的暴力事件後立即撤出[PAL.GetName]。他們認為自己更適合管理託管地，而我們正在傷害他們的阿拉伯同胞。雖然撤出在軍事上對我們有利，但在外交上卻會造成廣泛的破壞。"
 IRQ_political_events.31.a: "安排轉交控制權，但先諮詢當地人"
 IRQ_political_events.31.b: "他們忘記了自己的地位"
 IRQ_political_events.32.t: "[FROM.FROM.GetNonIdeologyName]計劃撤出"
 IRQ_political_events.32.desc: "[FROM.GetAdjective]政府計劃從[ROOT.GetName]撤軍，並將管理權移交[IRQ.GetNameDef]。除非我們立即中斷這一進程，否則我們會在幾天後接受[IRQ.Capital.GetCapitalVictoryPointName]的命令。"
 IRQ_political_events.32.a: "當前安排是站不住腳的……"
 IRQ_political_events.32.b: "我們有自己的議程"
 IRQ_political_events.33.t: "[ENG.GetNameDefCap]同意移交領土"
 IRQ_political_events.33.desc: "[ENG.GetAdjective]政府明白形勢對他們極為不利，因此已同意撤離[454.GetName]，並將這裡移交給我們。"
 IRQ_political_events.33.a: "今天，阿拉伯的團結取得了勝利"
 IRQ_political_events.34.t: "[FROM.GetNameDefCap]拒絕移交領土"
 IRQ_political_events.34.desc: "由於諸多複雜因素，[FROM.GetNameDef]拒絕讓我們接管[553.GetName]。儘管我們提出允許[ENG.GetAdjective]和平撤除該地區，他們仍選擇繼續血腥且不計代價地佔領這裡。"
 IRQ_political_events.34.a: "今天，阿拉伯世界在哭泣"
 IRQ_political_events.35.t: "[FROM.GetNameDef]政府拒絕提議"
 IRQ_political_events.35.desc: "[FROM.GetAdjective]政府拒絕了將國家職責轉交給[IRQ.GetNonIdeologyName]的計劃。我們本以為這會讓他們高興，但看來他們寧願與認知中的魔鬼待在一起。"
 IRQ_political_events.35.a: "帝國主義的走狗"
 IRQ_political_events.40.t: "[FROM.GetNameDefCap]索要敘利亞"
 IRQ_political_events.40.desc: "[FROM.GetNameDef]政府已正式要求我們將敘利亞的控制權移交給他們。他們認為，敘利亞作為阿拉伯世界不可分割的一部分，應該與[FROM.GetNameDef]統一在同一政府下，以確保該地區的穩定和繁榮。雖然他們將自己的要求視為邁向泛阿拉伯團結的一步，但放棄敘利亞將大幅削弱我們在中東的影響力。拒絕他們的提議可能會使兩國的緊張加劇，並導致局勢升級。"
 IRQ_political_events.40.a: "我們沒有太多選擇"
 IRQ_political_events.40.b: "決不可能！"
 IRQ_political_events.41.t: "[FROM.GetNameDefCap]打算移交我們的控制權"
 IRQ_political_events.41.desc: "令人驚訝的發展，[FROM.GetNameDef]政府已同意將對我們的權力移交給[FROM.FROM.GetNameDef]。我們政府內部有許多人質疑這項協議是否真正反映了我們的利益，還是說我們被當成了更大的地緣政治遊戲中的棋子。現在是時候決定接受移交，還是堅決反對了。"
 IRQ_political_events.41.a: "如此最好"
 IRQ_political_events.41.b: "目前的安排很適合我們"
 IRQ_political_events.42.t: "[FROM.GetNameDefCap]拒絕請求"
 IRQ_political_events.42.desc: "[FROM.GetNameDef]政府無視我們對阿拉伯統一和地區穩定的願景，直截了當地拒絕了移交敘利亞的提議。這破壞了阿拉伯世界一體化的努力，剝奪了敘利亞人民加入一個更強大、更統一的國家的機會。現在的問題是，我們應該繼續訴諸外交手段，還是應該為通過武力解決這一爭端做好準備。"
 IRQ_political_events.42.a: "我們不應該推動該問題"
 IRQ_political_events.42.b: "我們有其他手段來取得這片土地"
 IRQ_political_events.43.t: "[FROM.GetNameDefCap]同意我們的請求"
 IRQ_political_events.43.desc: "[FROM.GetNameDef]同意將敘利亞轉交給我們，這標誌著阿拉伯世界統一的一大步。這一歷史性協議加強了我們作為阿拉伯領袖的地位，使我們更接近實現建立統一繁榮的阿拉伯的願景。"
 IRQ_political_events.43.a: "好極了！"
 IRQ_political_events.44.t: "[FROM.GetNameDefCap]要求合併"
 IRQ_political_events.44.desc: "[FROM.GetNameDef]政府要求我們加入他們。是時候決定要接受還是抵抗外國控制了。"
 IRQ_political_events.44.a: "$IRQ_political_events.40.a$"
 IRQ_political_events.44.b: "$IRQ_political_events.40.b$"
 IRQ_political_events.50.t: "[FROM.GetNameDefCap]索要科威特"
 IRQ_political_events.50.desc: "[FROM.GetNameDef]政府已正式要求我們將科威特的控制權移交給他們。他們認為，科威特作為阿拉伯世界不可分割的一部分，應該與[FROM.GetNameDef]統一在同一政府下，以確保該地區的穩定和繁榮。雖然他們將自己的要求視為邁向泛阿拉伯團結的一步，但放棄科威特將大幅削弱我們在中東的影響力。拒絕他們的提議可能會使兩國的緊張加劇，並導致局勢升級。"
 IRQ_political_events.50.a: "我們沒有太多選擇"
 IRQ_political_events.50.b: "絕對不行！"
 IRQ_political_events.51.t: "[FROM.GetNameDefCap]打算移交我們的控制權"
 IRQ_political_events.51.desc: "令人驚訝的發展，[FROM.GetNameDef]政府已同意將對我們的權力移交給[FROM.FROM.GetNameDef]。我們政府內部有許多人質疑這項協議是否真正反映了我們的利益，還是說我們被當成了更大的地緣政治遊戲中的棋子。現在是時候決定接受移交，還是堅決反對了。"
 IRQ_political_events.51.a: "如此最好"
 IRQ_political_events.51.b: "目前的安排很適合我們"
 IRQ_political_events.52.t: "[FROM.GetNameDefCap]拒絕請求"
 IRQ_political_events.52.desc: "[FROM.GetNameDef]政府無視我們對阿拉伯統一和地區穩定的願景，直截了當地拒絕了移交科威特的提議。這破壞了阿拉伯世界一體化的努力，剝奪了科威特人民加入一個更強大、更統一的國家的機會。現在的問題是，我們應該繼續訴諸外交手段，還是應該為通過武力解決這一爭端做好準備。"
 IRQ_political_events.52.a: "我們不應該推動該問題"
 IRQ_political_events.52.b: "我們有其他手段來取得這片土地"
 IRQ_political_events.53.t: "[FROM.GetNameDefCap]同意我們的請求"
 IRQ_political_events.53.desc: "[FROM.GetNameDef]同意將科威特轉交給我們，這標誌著阿拉伯世界統一的一大步。這一歷史性協議加強了我們作為阿拉伯領袖的地位，使我們更接近實現建立統一繁榮的阿拉伯的願景。"
 IRQ_political_events.53.a: "好極了！"
 IRQ_political_events.60.t: "[FROM.GetNameDefCap]提議和談"
 IRQ_political_events.60.desc: "面對同盟國越來越大的壓力，[FROM.GetNonIdeologyName]的篡權者提出了和平方案。他們提議恢復攝政，並重建我們的權威，以換取結束敵對並保留領土完整。該提議承認了進一步抵抗的徒勞，標誌著金方陣野心的破滅，可能會導致其支持者的動盪。"
 IRQ_political_events.60.a: "很好"
 IRQ_political_events.60.b: "他們不可信任"
 IRQ_political_events.61.t: "[FROM.GetNameDefCap]接受和平協議"
 IRQ_political_events.61.desc: "[FROM.GetNameDefCap]同意了我們的和平提議。該條款需要我們服從[FROM.GetAdjective]的權威進入結束衝突。雖然戰爭結束了，但這一決定可能會引發內部動盪，因為那些為主權和獨立而戰的人會反抗外國勢力對國家的重新掌控。"
 IRQ_political_events.61.a: "至少我們可以結束流血了"
 IRQ_political_events.62.t: "[FROM.GetNameDefCap]拒絕和平協議"
 IRQ_political_events.62.desc: "[FROM.GetNameDefCap]拒絕了我們的和平提議，不接受任何妥協。談判已經失敗，衝突將會繼續，我們不得不面對盟軍的全部力量。前方道路充滿挑戰，但我們獨立的決心堅定不移。"
 IRQ_political_events.62.a: "那我們就戰鬥到底"
 IRQ_political_events.70.t: "$IRQ_bakr_sidqi$在暗殺中倖存"
 IRQ_political_events.70.desc: "今天早些時候，在摩蘇爾，年輕的阿卜杜拉·塔拉法裡下士用槍對準了$IRQ_bakr_sidqi$和他的得力助手穆罕默德·阿里·賈瓦德，試圖暗殺西德基。賈瓦德受了重傷，但西德基毫髮無傷。"
 IRQ_political_events.70.a: "竟能如此幸運？"
 IRQ_political_events.71.t: "合法化我們的統治"
 IRQ_political_events.71.desc: "許多人仍不接受金方陣為他們的合法統治者，並視我們為篡位者和非法的惡棍。為了解決這個問題，我們的部長們提出了幾個方案。我們可以無視人民的呼喚，希望此事隨著時間淡去；也可以任命塔伊夫埃米爾為費薩爾二世的新攝政。此外，我們總是可以選擇改革為共和制，儘管這在宗教人群中不太受歡迎……"
 IRQ_political_events.71.a: "我們已經足夠合法了"
 IRQ_political_events.71.b: "就讓$IRQ_sharaf_bin_rajeh$上"
 IRQ_political_events.71.c: "我們需要一位總統，不是國王！"
 IRQ_political_events.72.t: "加齊一世之死"
 IRQ_political_events.72.desc: "有報道稱，今天早些時候，我們偉大的國王加齊一世在巴格達駕駛跑車時遭遇車禍，不幸身亡。一些人宣稱這只是一場意外，還有些人則猜測這可能是努裡·賽義德的命令，因為國王計劃與科威特合併，但沒有人知道事實到底如何。不過，有一件事十分明朗，既然他已離世，就必須有人接過火炬和他的位置。"
 IRQ_political_events.72.a: "阿卜杜勒·伊拉將會攝政"
 IRQ_political_events.72.b: "費薩爾二世將直接頂替他！"
 IRQ_political_events.73.t: "對哈希姆專制的支持激增"
 IRQ_political_events.73.desc: "近期為加齊一世舉辦的葬禮遊行導致人們在哀悼的同時君主主義情緒激增。這給予了阿卜杜勒·伊拉在長期反對專制的首相們制衡下統治的機會，這是全面恢復哈希姆家族對阿拉伯統治的第一步。"
 IRQ_political_events.73.a: "阿卜杜勒·伊拉將奪回哈希姆家族與生俱來的權利"
 IRQ_political_events.73.b: "我們必須維持君主國的憲政！"
 IRQ_political_events.74.t: "[FROM.GetName]邀請石油代表團"
 IRQ_political_events.74.desc: "我們新結識的[FROM.GetAdjective]朋友提議，派石油巨頭和工業高管組成一個代表團，前往他們的廣袤的資源產地尋求投資。這項條約將由初步的武器換取石油的互利交換協議來確保。"
 IRQ_political_events.74.a: "完美的時機。"
 IRQ_political_events.74.b: "我們承擔不起。"
 IRQ_political_events.75.t: "同意派遣代表團"
 IRQ_political_events.75.desc: "我們的[FROM.GetAdjective]朋友已同意派出代表團商討未來投資事宜，前提是我們需要立即簽署初步交換協議。事情進展得很順利。"
 IRQ_political_events.75.a: "太棒了"
 IRQ_political_events.76.t: "拒絕派遣代表團"
 IRQ_political_events.76.desc: "很遺憾，[FROM.GetAdjective]政府拒絕了我們用寶貴的石油換取武器的請求。他們的損失，也許是我們的收穫。"
 IRQ_political_events.76.a: "真遺憾"
 IRQ_political_events.77.t: "[IRQ.GetNameDefCap]征服[680.GetName]"
 IRQ_political_events.77.desc: "在[680.GetName]的快速軍事行動後，[IRQ.GetAdjective]軍隊奪取了所有主要定居點，宣佈該地區由他們掌控。"
 IRQ_political_events.77.a: "我們的力量在壯大！"
 IRQ_political_events.77.b: "哦，好吧"
 IRQ_political_events.78.t: "[IRQ.GetNameDefCap]撤出[680.GetName]"
 IRQ_political_events.78.desc: "由於面對重重困境，[IRQ.GetAdjective]軍隊已被迫從代爾祖爾撤退。這或許並不意味著衝突的終結，但目前該地區仍將處於[SYR.GetAdjective]控制下。"
 IRQ_political_events.78.a: "暫時的挫折……"
 IRQ_political_events.78.b: "代爾祖爾屹立不倒！"
 #Kurdistan
 IRQ_kurdistan_events.1.t: "庫爾德民族主義者向我們求助"
 IRQ_kurdistan_events.1.desc: "我們剛剛收到[IRQ.GetNameDefCap]的庫爾德民族主義者的通訊，請求我們援助他們的革命。"
 IRQ_kurdistan_events.1.a: "我們當然會幫忙！"
 IRQ_kurdistan_events.1.b: "我們對[IRQ.GetNameDefCap]的小小革命不感興趣"
 IRQ_kurdistan_events.2.t: "[FROM.GetNameDefCap]同意援助我們"
 IRQ_kurdistan_events.2.desc: "我們在[FROM.GetNameDefCap]的聯絡人回應了我們的求援，同意幫助我們的事業。"
 IRQ_kurdistan_events.2.a: "好消息！"
 IRQ_kurdistan_events.3.t: "[FROM.GetNameDefCap]拒絕援助我們"
 IRQ_kurdistan_events.3.desc: "我們在[FROM.GetNameDefCap]的聯絡人回應了我們的求援，很不幸，他們拒絕幫助我們，我們只能靠自己了。"
 IRQ_kurdistan_events.3.a: "我們不能因此而氣餒！"
 IRQ_kurdistan_events.4.t: "工會組織"
 IRQ_kurdistan_events.4.desc: "在我們近期推進工業化的過程中，多個工會組織相繼興起。工廠工人們聯合起來，要求他們眼中公平的工作條件。安撫他們或許對我們有利，但誰也說不好這會在政治上給我們帶來什麼影響。"
 IRQ_kurdistan_events.4.a: "工人們是對的。"
 IRQ_kurdistan_events.4.b: "我們不能容忍這種社會主義的做法！"
 ###
 ### News Events ###
 GOE_IRQ_news.1.t: "巴勒斯坦大起義"
 GOE_IRQ_news.1.d: "對[ENG.GetAdjective]的管理，以及世界大戰以來的移民的多年不滿，導致[PAL.GetName]的阿拉伯人爆發了叛亂。叛亂者要求[ENG.GetAdjective]撤出部隊，並允許巴勒斯坦完全獨立。儘管[ENG.GetAdjective]不太可能接受這樣的要求，但很明顯，對他們來說，管理該地區的成本將大大提高。"
 GOE_IRQ_news.1.a: "我們支持叛軍"
 GOE_IRQ_news.1.b: "[ENG.GetNameDef]會如何應對？"
 GOE_IRQ_news.1.c: "我們必須重新掌控局勢"
 the_1936_PAL_revolt_has_happened: "§Y巴勒斯坦起義已發生，並且[ENG.GetAdjective]驅逐了異議分子。§!"
 GOE_IRQ_news.2.t: "[FROM.GetNameDefCap]拒絕《安卡拉條約》"
 GOE_IRQ_news.2.d: "[FROM.GetNameDef]政府採取了大膽的舉措，正式拒絕了《安卡拉條約》，認為其領土協議不具備現實意義。這一決定直接挑戰了[TUR.GetNameDef]、[PER.GetNameDef]和[FROM.GetNonIdeologyName]之間的既定邊界和協議，使該地區陷入政治不確定中。這種挑釁在[TUR.Capital.GetCapitalVictoryPointName]和[PER.Capital.GetCapitalVictoryPointName]都引發了公憤，要求對[FROM.GetNameDef]的單方行動作出果斷回應的呼聲越來越高，緊張局勢正在加劇。"
 GOE_IRQ_news.2.a: "我們應該做好相應準備"
 ### Mughal peace Deal
 GOE_RAJ_mughals_peace_deal.1.t: "[UK_INDIA.GetName]提出領土讓步"
 GOE_RAJ_mughals_peace_deal.1.desc: "終於，戰爭導致的經濟困難讓[UK_INDIA.GetAdjective]政府難以維繫。儘管他們的宗主國反對，他們還是提出大量領土讓步以換取和平。"
 GOE_RAJ_mughals_peace_deal.1.a: "太棒了"
 GOE_generic_events.1.t: "[FRA.GetAdjective]政府垮臺"
 GOE_generic_events.1.desc: "[FRA.GetAdjective]軍隊未能成功保衛巴黎，這一失敗直接導致了政府的崩潰。在一項倉促達成的停戰協議之後，維希政府應運而生，建立了一個新的政權。然而，一些堅定的[FRA.GetAdjective]官員已逃離祖國，他們在海外建立了流亡政府，併發誓將繼續戰鬥，直到[FRA.GetNonIdeologyName]重獲自由。如今，我們的政府正面臨著一個艱難而重大的決策。"
 GOE_generic_events.1.a: "維希政府才是合法政權。"
 GOE_generic_events.1.b: "我們將援助流亡政府。"
 GOE_generic_events.1.c: "是時候徹底擺脫[FRA.GetAdjective]人了！"
 GOE_generic_events_1_tt: "§R維希法國可能向我們宣戰！§!"
 GOE_generic_events.2.t: "[FROM.GetAdjective]政府維持效忠"
 GOE_generic_events.2.desc: "[FROM.GetNameDef]政府已明確表示，他們將尊重我們作為[FRA.GetAdjective]人民唯一代表的權威，並繼續在所有外交政策事務上追隨我們的領導。"
 GOE_generic_events.2.a: "明智的決定。"
 GOE_generic_events.3.t: "[FROM.GetAdjective]政府背叛我們"
 GOE_generic_events.3.desc: "[FROM.GetNameDef]政府背信棄義，拒絕承認我們作為合法[FRA.GetAdjective]政府的權威，轉而向我們的敵人宣誓效忠。"
 GOE_generic_events.3.a: "這絕不能容忍！"
 GOE_generic_events.3.b: "他們無足輕重。"
 GOE_generic_events.4.t: "[FROM.GetAdjective]政府宣佈獨立"
 GOE_generic_events.4.desc: "[FROM.GetNameDef]政府利用最近的動盪宣佈脫離我們獨立。我們的武裝部隊雖因政府更迭而措手不及，但仍認為有可能重新控制局勢，迫使[FROM.GetAdjective]領土重回我們的掌控。"
 GOE_generic_events.4.a: "這種投機行為不可接受。"
 GOE_generic_events.4.b: "這種事遲早會發生。"
 GOE_generic_events.5.t: "捍衛我們的獨立"
 GOE_generic_events.5.desc: "我們曾經的壓迫者對我們宣佈獨立的行為怒不可遏，正開始動員他們的部隊以扼殺我們新獲得的自由。看來，我們的獨立之路必將伴隨流血犧牲。"
 GOE_generic_events.5.a: "我們終將勝利！"
 PER_ssb_events.1.t: "[SSB_leader.GetNameDefCap]要求我們加入薩德阿巴德同盟"
 PER_ssb_events.1.desc: "[SSB_leader.GetLeader]召集了所有薩德阿巴德簽署國的領導人召開會議。[SSB_leader.GetLeader]指出，薩德阿巴德條約最初只是我們國家之間的簡單互不侵犯協議，但隨著經濟和軍事合作的不斷深化，其意義已遠超初衷。如今，我們被世界強權從四面八方包圍，單憑一國之力難以抵禦。[SSB_leader.GetLeader]提議正式建立同盟，以確保全面的軍事協作和經濟一體化，強調這對我們的生存至關重要——否則我們註定失敗。"
 PER_ssb_events.1.a: "我們當然會簽字！"
 PER_ssb_events.1.b: "這不符合[THIS.GetNameDefCap]的最佳利益"
 PER_ssb_events.2.t: "[FROM.GetNameDefCap]加入薩德阿巴德同盟！"
 PER_ssb_events.2.desc: "議結束後，[FROM.GetLeader]明確表示，薩德阿巴德成員國之間的正式聯盟對我們國家的生存極為重要，並同意加入該聯盟。"
 PER_ssb_events.2.a: "太棒了！"
 PER_ssb_events.3.t: "[FROM.GetNameDefCap]拒絕了我們的聯盟提議。"
 PER_ssb_events.3.desc: "會議結束後，我們未能說服[FROM.GetLeader]加入聯盟。雖然現有的軍事和經濟合作將繼續，但[FROM.GetLeader]表示，[FROM.GetNameDefCap]不認為建立正式的薩德阿巴德聯盟符合其利益。"
 PER_ssb_events.3.a: "即使沒有他們，薩德阿巴德聯盟仍將繼續推進！"
 PER_ssb_events.4.t: "[FROM.GetNameDefCap]提議經濟一體化"
 PER_ssb_events.4.desc: "[FROM.GetLeader]召集薩德阿巴德條約簽署國召開會議，討論[FROM.GetAdjective]政府提出的經濟整合方案。[FROM.GetLeader]指出，我們正處於一個危險境地，四周被大國威脅環伺，因此他們提議進一步整合經濟，[FROM.GetAdjective]政府將投資資源擴展工業，並與成員國共享產能。"
 PER_ssb_events.4.a: "這是一項互利共贏的協議！"
 PER_ssb_events.4.b: "這顯然不符合我們的利益"
 PER_ssb_events.5.t: "[FROM.GetNameDefCap]同意！"
 PER_ssb_events.5.desc: "會議結束後，[FROM.GetLeader]表達了對該想法的激動之情，認為這是一項雙贏的協議。"
 PER_ssb_events.5.a: "太好了！"
 PER_ssb_events.6.t: "[FROM.GetNameDefCap]拒絕"
 PER_ssb_events.6.desc: "會議結束後，[FROM.GetLeader]表達了對該提案的懷疑，認為該提議的偏向性過重，顯然最終目的是在本地區確立[THIS.GetAdjective]主導地位。"
 PER_ssb_events.6.a: "真遺憾"
 PER_ssb_events.7.t: "[IRQ.GetNameDefCap]將柏林－巴格達鐵路向薩德阿巴德條約的成員國開放"
 PER_ssb_events.7.desc: "[IRQ.GetNameDefCap]今日通過立法，允許所有薩德阿巴德條約的簽署國使用柏林-巴格達鐵路進行貿易。這將為我們帶來與歐洲的廣泛、便捷、低成本的貿易，對各國經濟是極大的推動。"
 PER_ssb_events.7.a: "今天是屬於[ROOT.GetAdjective]的偉大日子！"
 PER_ssb_events.8.t: "[FROM.PREV.GetNameDefCap]對[FROM.PREV.FROM.GetNameDefCap]宣戰，撕毀薩德阿巴德條約！"
 PER_ssb_events.8.desc: "震驚消息傳來，[FROM.PREV.GetNameDefCap]對另一成員國宣戰，違背了薩德阿巴德條約的核心條款。因此，[FROM.PREV.GetNonIdeologyName]已被驅逐出該條約。至於此事對條約未來影響幾何仍未可知，或許會促使剩餘成員更團結，也可能觸發連鎖反應，導致薩德阿巴德條約的徹底瓦解……"
 PER_ssb_events.8.a: "希望這不會演變為條約的全面崩潰……"
 PER_ssb_events.9.t: "薩德阿巴德科研合作的曙光"
 PER_ssb_events.9.desc: "薩德阿巴德條約內部一直在討論建立聯合科研協議，如今經過長期磋商，終於達成共識。所有科研發現與信息將在線上共享，並建立機制以推動條約內部的聯合研究項目。這一舉措或將開啟我們科學發展的新時代，使我們站上世界科技前沿，成為科研創新的引領者。"
 PER_ssb_events.9.a: "太棒了！"
 SSB_resource_event_scripted_loc_oil: "$state_resource_oil$"
 SSB_resource_event_scripted_loc_chromium: "$state_resource_chromium$"
 PER_ssb_events.10.t: "[PER.GetName]簽署石油出口協議"
 PER_ssb_events.11.t: "[TUR.GetName]簽署鉻礦出口協議"
 PER_ssb_events.10.desc: "[FROM.GetAdjective]政府已與薩德阿巴德地區各大知名公司達成最終協議，以大量[SSB_resource_event_scripted_loc]換取多種資源。雖然大部分[SSB_resource_event_scripted_loc]將直接流向私營機構，但我國政府仍能保留一小部分作為行政費用。"
 PER_ssb_events.10.a: "該協議已開始對我國經濟產生重大影響。"
 SSB_if_join_tt: "接受此協議將啟用§Y互不侵犯條約§!並解鎖所有簽約國共用的§Y共享國策樹§!，同時授予我們民族精神§Y薩德阿巴德條約§!。隨著共享國策樹的逐步達成，該民族精神將不斷增強。"
 SSB_you_will_lose_the_bonus_tt: "§R對薩德阿巴德條約的成員國宣戰違反了該條約，你會因此被驅逐出該組織，失去“民族精神”並永久失去共享國策樹的使用權限。§!"


