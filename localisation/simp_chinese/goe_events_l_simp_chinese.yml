l_simp_chinese:
 AFG_industrial_events.10.t: "[FROM.GetNameDefCap]提供石油特許權"
 AFG_industrial_events.10.desc: "[FROM.GetNameDef]政府提議成立一家合資企業，我們將協助他們開發近期發現的油田，以換取對所產石油的長期特許權。雖然該提案看似真誠，但我們無法保證[FROM.GetAdjective]政府的政策變化不會影響我們持續獲得石油。"
 AFG_industrial_events.10.a: "這符合我們的戰略利益。"
 AFG_industrial_events.10.b: "我們無需捲入[FROM.GetAdjective]的內部事務。"
 AFG_industrial_events.11.t: "[FROM.GetNameDefCap]同意石油協議"
 AFG_industrial_events.11.desc: "[FROM.GetAdjective]政府已同意投資開發我們的石油資源，以換取開始生產後的長期股份。"
 AFG_industrial_events.11.a: "這將是邁向工業化的一大步。"
 AFG_industrial_events.12.t: "[FROM.GetNameDefCap]拒絕石油協議"
 AFG_industrial_events.12.desc: "目光短淺的[FROM.GetAdjective]政府拒絕了我們關於石油資源聯合開發的提案。"
 AFG_industrial_events.12.a: "我們將會為此項目尋找另外的合作伙伴。"
 AFG_industrial_events.13.t: "[FROM.GetNameDefCap]國有化石油產業"
 AFG_industrial_events.13.desc: "[FROM.GetAdjective]政府不顧我們對其石油產業的鉅額投資，將其國有化。國有化導致我們達成的長期石油特許權協議立即停止。該地區正屏息以待我們的回應。"
 AFG_industrial_events.13.a: "我們賭了一把，輸了。"
 AFG_industrial_events.13.b: "這些資源將被強行收回。"
 AFG_industrial_events.14.t: "[FROM.GetName]向[ROOT.GetName]宣戰"
 AFG_industrial_events.14.desc: "傲慢的[FROM.GetAdjective]政權已經宣佈，他們打算推翻我們正義的政府，罪名是利用我們的自然資源為我們自己的人民謀福利。目前還不清楚他們打算如何實施威脅，但我們應該開始為軍事入侵我國領土做準備。"
 AFG_industrial_events.14.a: "我們不會被脅迫屈服。"
 AFG_industrial_events.15.t: "[FROM.GetNameDefCap]對石油國有化幾乎沒有抵抗措施"
 AFG_industrial_events.15.desc: "[FROM.GetNameDef]政府就我們對石油產業的國有化發表了強硬言辭。然而，沒有任何跡象表明他們打算進一步採取行動。"
 AFG_industrial_events.15.a: "此事到此為止。"
 AFG_industrial_events.16.t: "暫停[FROM.GetAdjective]的石油開採特許權"
 AFG_industrial_events.16.desc: "由於兩國近期衝突，[FROM.GetNameDef]政府已暫停我們國家的石油開採特許權。即使衝突結束，他們也很可能希望繼續控制自己的資源。"
 AFG_industrial_events.16.a: "不出所料的發生了。"
 AFG_industrial_events.20.t: "[FROM.GetName]投資機會"
 AFG_industrial_events.20.desc: "[FROM.GetAdjective]政府正在推行一項吸引外資的政策，並就此聯繫了我們。雖然我們從這項協議中獲得的經濟利益可能並不巨大，但這將是一個極好的機會，可以影響[FROM.GetAdjective]政府，使其在制定政策時與我們步調保持一致。"
 AFG_industrial_events.20.a: "加強我們在該地區的影響力很重要。"
 AFG_industrial_events.20.b: "[FROM.GetNonIdeologyName]並非我們長期規劃的考慮因素。"
 AFG_industrial_events.21.t: "[FROM.GetAdjective]政府宣佈投資"
 AFG_industrial_events.21.desc: "[FROM.GetNameDef]的朋友們已宣佈計劃向我國工業化投資鉅額資金。這對我們經濟發展大有裨益，但我們必須保持警惕，防止[FROM.GetAdjective]利用此機會過分影響我們的政治。"
 AFG_industrial_events.21.a: "好消息！"
 AFG_industrial_events.22.t: "$bftb_greece.194.t$"
 AFG_industrial_events.22.desc: "$bftb_greece.194.desc$"
 AFG_industrial_events.22.a: "$bftb_greece.194.a$"
 AFG_industrial_events.30.t: "[FROM.GetNameDefCap]改變赫爾曼德河水流"
 AFG_industrial_events.30.desc: "近年來，[FROM.GetAdjective]政府在其河流沿岸實施了一系列水壩和灌溉項目。這導致赫爾曼德河（流經我方東部省份）發生了一系列變化。跨境水位逐年明顯下降，我方人民越來越擔心，如果這種情況持續下去，他們將無法再利用這條河流。我們需要決定是內部解決這個事情，還是向[FROM.GetAdjective]方提出此事。"
 AFG_industrial_events.30.a: "我們將要求與[AFG.GetNonIdeologyName]就河流開發進行談判。"
 AFG_industrial_events.30.b: "現在我們不能冒外交危機的風險。"
 AFG_industrial_events.31.t: "[FROM.GetAdjective]政府要求就河流問題進行談判"
 AFG_industrial_events.31.desc: "[FROM.GetNameDefCap]政府已就我們最近對赫爾曼德河的改動提出談判請求。他們聲稱，我們的水壩和灌溉系統正在減少跨境河流水量，使其降至危險水平。我們內閣的一些成員建議簽訂一項條約來規範跨境水流。這可能意味著減少我們目前沿河改動帶來的好處，但也將減輕這些改動對邊境另一側[FROM.GetAdjective]人民的影響。"
 AFG_industrial_events.31.a: "或許我們可以簽訂一份水資源條約？"
 AFG_industrial_events.31.b: "水是我們的，我們可以隨意處置。"
 AFG_industrial_events_31_tt: "§R此舉可能導致與[FROM.GetNameDefCap]開戰！§!"
 AFG_industrial_events.32.t: "[FROM.GetAdjective]政府提出水資源條約"
 AFG_industrial_events.32.desc: "[FROM.GetNameDefCap]政府提議締結一項兩國間的用水條約，以規範兩國用於灌溉項目的用水量，同時保證跨境水流的最低流量。雖然這些提議看似合理，但這可能意味著我們必須接受與歷史水平相比更少的用水量。"
 AFG_industrial_events.32.a: "這聽起來合理。"
 AFG_industrial_events.32.b: "只有完全反過來才會使我們滿意。"
 AFG_industrial_events.33.t: "[FROM.GetNameDefCap]拒絕進一步談判"
 AFG_industrial_events.33.desc: "[FROM.GetNameDefCap]政府拒絕就沿赫爾曼德河的開發進行任何進一步的談判，理由是流經其境內的任何水資源都由其自行處置。此時對其讓步最終可能會助長其日後完全切斷水流的囂張氣焰。然而，此時任何進一步的升級都將迫使我們訴諸武力衝突。"
 AFG_industrial_events.33.a: "我們沒有發動軍事升級的資源。"
 AFG_industrial_events.33.b: "那麼我們就採取武力解決。"
 AFG_industrial_events.34.t: "[FROM.GetNameDefCap]同意簽署水資源條約"
 AFG_industrial_events.34.desc: "[FROM.GetAdjective]政府同意簽署一份水資源條約，確保兩國都能獲得可接受的水流量。雖然這會迫使我們不能充分利用建造的大壩，但至少能避免兩國未來因赫爾曼德河發生衝突。"
 AFG_industrial_events.34.a: "危機得以避免。"
 AFG_industrial_events.35.t: "[FROM.GetNameDefCap]拒絕簽署水資源條約"
 AFG_industrial_events.35.desc: "[FROM.GetNameDefCap]拒絕簽署任何條約，反而要求我們完全放棄任何導致他們水流量降低的赫爾曼德河大壩項目。看起來如果我們拒絕，他們會使用武力來做到這一點。"
 AFG_industrial_events.35.a: "我們不能讓事態進一步升級"
 AFG_industrial_events.35.b: "既然他們不講道理，那繼續談判已經沒有任何意義了"
 AFG_industrial_events.36.t: "[FROM.GetAdjective]同意撤除赫爾曼德河工程"
 AFG_industrial_events.36.desc: "[FROM.GetAdjective]政府同意撤除對赫爾曼德河進行的許多改造工程。雖然這無疑激起了他們對我們的怨恨，但至少我們暫時避免了武裝對抗。"
 AFG_industrial_events.36.a: "早該如此"
 AFG_industrial_events.37.t: "[FROM.GetAdjective]部隊準備入侵"
 AFG_industrial_events.37.desc: "根據報告，在政府談判失敗後，邊境沿線的[FROM.GetAdjective]軍隊已開始動員，以入侵赫爾曼德河谷。看來我們別無選擇，只能同樣動員我們的軍隊了。"
 AFG_industrial_events.37.a: "事態升級得如此荒謬"
 AFG_industrial_events.38.t: "[FROM.GetAdjective]政府對赫爾曼德河改造工程保持沉默"
 AFG_industrial_events.38.desc: "在兩國政府進行了數週的激烈談判後，[FROM.GetAdjective]似乎暫時放棄了干擾我們的大壩和灌溉工程。他們將來是否會重提這一問題，只有時間能夠說明。"
 AFG_industrial_events.38.a: "看來改造工程暫時安全了"
 AFG_industrial_events.40.t: "大學畢業生愈發激進"
 AFG_industrial_events.40.desc: "我們大力發展高等教育激起了應屆畢業生的強烈反對。他們在畢業後發現找不到就讀專業的工作，進而幻想破滅，開始轉向激進的政治以發洩其挫敗感。"
 AFG_industrial_events.40.a: "令人不安的發展"
 AFG_industrial_events.50.t: "普什圖抵抗生根發芽"
 AFG_industrial_events.50.desc: "利用我們的普什圖人的跨境聯繫，我們成功煽動了他們在邊境另一方的親人進行反政府抗議，並要求統一在我們治下。"
 AFG_industrial_events.50.a: "他們很快就會得到解放！"
 AFG_industrial_events.51.t: "[AFG.GetAdjective]邊境的普什圖抵抗組織"
 AFG_industrial_events.51.desc: "來自[FROM.GetNonIdeologyName]的煽動者似乎一直跨越邊境在普什圖人中挑起動亂。他們宣稱普什圖人將在[FROM.GetAdjective]的統治下完成統一。"
 AFG_industrial_events.51.a: "令人不安"
 AFG_industrial_events.52.t: "[FROM.GetAdjective]政府要求移交領土"
 AFG_industrial_events.52.desc: "鑑於我們的普什圖人佔多數的領土緊張局勢加劇，[FROM.GetAdjective]政府大膽地提出要接管這些騷亂地區。有人懷疑他們就是這場動亂的幕後黑手。"
 AFG_industrial_events.52.a: "這片領土引起的麻煩已經超過它的價值了"
 AFG_industrial_events.52.b: "無論他們怎麼宣稱的，這是我們的主權領土"
 AFG_industrial_events.53.t: "[FROM.GetAdjective]政府移交領土"
 AFG_industrial_events.53.desc: "[FROM.GetNameDef]政府忙於其他更緊要的事務，已同意移交普什圖人動亂失控的領土。不過，我們也因為干預鄰國內政而不可挽回地損害了與[FROM.GetAdjective]的關係。"
 AFG_industrial_events.53.a: "太好了"
 AFG_industrial_events.54.t: "[FROM.GetNameDefCap]拒絕移交領土"
 AFG_industrial_events.54.desc: "儘管我們小心操控了與[FROM.GetNameDef]的邊境的局勢，但他們的政府仍拒絕移交普什圖領土的控制權。看來我們想獲取這片土地只能以軍事幹預作為威脅，而這無疑會讓局勢升級。"
 AFG_industrial_events.54.a: "我們不想讓局勢升級"
 AFG_industrial_events.54.b: "我們不懼怕以武力解放這裡"
 AFG_industrial_events.55.t: "[FROM.GetNameDefCap]威脅開戰"
 AFG_industrial_events.55.desc: "[FROM.GetAdjective]政府發佈聲明，譴責我們佔據了所謂的普什圖人領土，並表示他們已準備好武力解放這裡。當然，他們也可能是在虛張聲勢，但我們目前無法弄清他們的真實意圖。"
 AFG_industrial_events.55.a: "我們別無選擇"
 AFG_industrial_events.55.b: "我們已準備好不惜一切代價保衛領土"
 AFG_industrial_events.56.t: "[FROM.GetNameDefCap]拒絕最後通牒"
 AFG_industrial_events.56.desc: "不出所料，[FROM.Capital.GetCapitalVictoryPointName]的頑固蠢貨們拒絕將我們的合法領土交給我們。因此，我們要麼派遣軍隊付諸行動，要麼在國際舞臺上丟盡臉面。"
 AFG_industrial_events.56.a: "是時候付諸行動了"
 AFG_industrial_events.56.b: "我們不得不退讓"
 AFG_industrial_events.57.t: "[FROM.GetAdjective]政府放棄宣稱"
 AFG_industrial_events.57.desc: "[FROM.GetAdjective]政府最終恢復理智，決定緩和邊境局勢，撤銷了對激化矛盾的邊境領土的宣稱。"
 AFG_industrial_events.57.a: "國際法律和秩序的勝利。"
 AFG_industrial_events.58.t: "[FROM.GetNameDefCap]提議和談"
 AFG_industrial_events.58.desc: "[FROM.GetAdjective]外交官提出一份和平協議，要求我們認可他們對邊境沿線有爭議的普什圖領土的控制。他們目前佔領了這裡，而我們看不到短期內驅逐他們的希望。然而，這會開創一個先例，使[FROM.GetNameDef]可以逐步蠶食我們的領土。"
 AFG_industrial_events.58.a: "讓我們結束這場衝突吧"
 AFG_industrial_events.58.b: "我們會把他們逐出我們的土地"
 AFG_industrial_events.59.t: "[FROM.GetNameDefCap]拒絕和平條款"
 AFG_industrial_events.59.desc: "[FROM.GetNameDef]政府拒絕了我們最近提出的和平條款。他們顯然認為自己還有能力將我們趕出我們的法理領土。"
 AFG_industrial_events.59.a: "那我們就繼續保衛我們的領土"
 AFG_political_events.01.t: "中亞統一提議"
 AFG_political_events.01.desc: "[FROM.GetNameDef]代表向我們提出了重組中亞的大膽提議。這需要我們交出與[FROM.GetAdjective]接壤的部分地區，建立[FROM.Capital.GetCapitalVictoryPointName]管理下的新社會主義聯邦。這可以在該區域建立強大的緩衝國，減輕我們在這裡的防禦負擔，讓我們可以將軍隊部署到其他地方。"
 AFG_political_events.01.a: "有趣的提議"
 AFG_political_events.01.b: "我們對該地區有其他計劃"
 AFG_political_events.02.t: "[FROM.GetName]接受建議"
 AFG_political_events.02.desc: "[FROM.GetNameDefCap]同意了由我們將中亞整合為一個政治實體的提議。看來在經歷數十年的不穩定後，我們的人民將迎來一個新時代。"
 AFG_political_events.02.a: "好極了！"
 AFG_political_events.03.t: "[FROM.GetName]拒絕提議"
 AFG_political_events.03.desc: "[FROM.GetNameDefCap]拒絕了由我們將中亞整合為一個政治實體的提議。雖然這是一個巨大的挫折，但夢想仍未破滅。我們只需靜待時機。"
 AFG_political_events.03.a: "他們無法永遠阻止我們"
 AFG_political_events.10.t: "[FROM.GetNameDefCap]提議組建邦聯"
 AFG_political_events.10.desc: "[FROM.GetNonIdeologyName]政府提出了一項有趣的建議，即我們兩國建立邦聯以增強實力。這會使我們的經濟市場互相開放，合二為一，並且在世界舞臺上採取聯合對外政策。然而，這最終會限制我們的行動自由。"
 AFG_political_events.10.a: "我們支持"
 AFG_political_events.10.b: "我們已經擺脫了一個宗主，不想再要另一個"
 AFG_political_events.11.t: "[FROM.GetName]同意合邦"
 AFG_political_events.11.desc: "[FROM.GetAdjective]政府同意與我們建立邦聯。現在我們可以著手將兩個政治與經濟實體整合為一了。希望這能在不久的將來震懾我們的對手。"
 AFG_political_events.11.a: "好極了！"
 AFG_political_events.12.t: "[FROM.GetName]拒絕合邦"
 AFG_political_events.12.desc: "[FROM.GetAdjective]政府拒絕與我們建立邦聯。這是我們外交政策的巨大挫折，並引發了人們對我們與[FROM.GetNameDef]的長期關係的擔憂。"
 AFG_political_events.12.a: "錯失良機"
 AFG_political_events.20.t: "[FROM.GetName]尋求投資"
 AFG_political_events.20.desc: "[FROM.GetNameDefCap]外交官接觸我們，提議我們對他們的經濟進行投資。他們認為如果我們能幫助他們發展工業，將來我們就能從出口中獲益。此外，他們明確表示這絕對能打擊[SOU.GetAdjective]和[ENG.GetAdjective]，歷史上[FROM.GetNonIdeologyName]地區的重要博弈者。"
 AFG_political_events.20.a: "削弱敵人在該國的影響力對我們有利"
 AFG_political_events.20.b: "我們對[FROM.GetNonIdeologyName]沒有興趣"
 AFG_political_events.21.t: "[FROM.GetName]同意投資我國經濟"
 AFG_political_events.21.desc: "[FROM.GetAdjective]外交官宣佈他們的政府同意在[ROOT.GetNonIdeologyName]投資。工程師和企業家們已開始在全國各地建立新的產業。"
 AFG_political_events.21.a: "真是慷慨！"
 AFG_political_events.22.t: "[FROM.GetName]拒絕投資我國經濟"
 AFG_political_events.22.desc: "[FROM.GetAdjective]外交官宣佈他們的政府拒絕在[ROOT.GetNonIdeologyName]投資。他們聲稱我們的長期政策尚不明朗，他們不想為最終可能落入敵人勢力範圍的國家提供經濟援助。"
 AFG_political_events.22.a: "我們會記住此事的"
 AFG_political_events.30.t: "[ROOT.GetNonIdeologyName]的未來"
 AFG_political_events.30.desc: "經過多年的政治改革和國內各派系的妥協，現在我們有機會徹底斬除君主制的束縛。但在此之前，我們必須重新定義我們到底是什麼國家。"
 AFG_political_events.30.a: "這是新的開始，我們將成為[ROOT.GetAdjective]共和國"
 AFG_political_events.30.b: "我們首先是普什圖人的國家"
 AFG_political_events.30.c: "民主與伊斯蘭教的融合是前進的道路"
 AFG_political_events.40.t: "[FROM.GetNameDefCap]發出最後通牒"
 AFG_political_events.40.desc: "[FROM.GetAdjective]大使館派代表向我國政府發出最後通牒，要求我們限制可能危及[FROM.GetAdjective]利益的外國影響，否則我們將面臨更迭政權的軍事幹預。"
 AFG_political_events.40.a: "我們根本無力爭論"
 AFG_political_events.40.b: "這只是虛張聲勢，我們不會被嚇倒"
 AFG_political_events.41.t: "[FROM.GetNameDefCap]妥協"
 AFG_political_events.41.desc: "[FROM.GetAdjective]政府默許了我們的要求，限制他們國家可能危及我國利益的外國干預。雖然他們肯定對此不滿，但看起來不太可能馬上訴諸武力。"
 AFG_political_events.41.a: "我們應該繼續謹慎觀察"
 AFG_political_events.42.t: "[FROM.GetNameDefCap]拒絕要求"
 AFG_political_events.42.desc: "[FROM.GetAdjective]政府拒絕了我們要求限制他們國家的外國干預的最後通牒。他們宣稱我們無權干涉他們的內政，以及與他國達成的協議。"
 AFG_political_events.42.a: "我們將不得不尋找其他手段"
 AFG_political_events.42.b: "他們讓我們別無選擇"
 AFG_political_events.43.t: "外國干涉[FROM.GetNameDefCap]"
 AFG_political_events.43.desc: "我們的大使通知我們，最近[FROM.GetNameDefCap]與另一國家的代表在[FROM.Capital.GetCapitalVictoryPointName]簽署了某種協議。協議的具體細節尚不清楚，但毫無疑問[FROM.GetAdjective]政府受到了可能試圖破壞我們在該地利益的國家的影響。"
 AFG_political_events.43.a: "我們要密切關注局勢"
 AFG_political_events.51.t: "[AFG.GetNonIdeologyName]的$AFG_amunullah_khan$請求援助"
 AFG_political_events.51.desc: "[FROM.GetNonIdeologyName]前統治者$AFG_amunullah_khan$聯繫了我們的政府，希望我們能支持他復辟。他承諾，在德國的支持下，他會建立一個強大的、現代化的、符合我們利益的國家。"
 AFG_political_events.51.a: "我們在該地區需要更多盟友"
 AFG_political_events.51.b: "為什麼要干涉如此遙遠國度的事務？"
 AFG_political_events.52.t: "[FROM.GetNameDefCap]拒絕支持我們"
 AFG_political_events.52.desc: "[FROM.GetAdjective]政府對我們的請求做出了回應，很遺憾，他們拒絕為$AFG_amunullah_khan$復辟提供支持。[FROM.GetAdjective]出於對潛在糾紛和當前地緣政治環境的擔憂，決定將重心放在其他戰略優先事項上。"
 AFG_political_events.52.a: "他們竟敢背叛我們！"
 AFG_political_events.53.t: "[FROM.GetNameDefCap]同意支持我們"
 AFG_political_events.53.desc: "[FROM.GetName]政府對我們的請求做出了回應，決定支持$AFG_amunullah_khan$重登[ROOT.GetNonIdeologyName]王位。他們會給予軍事和裝備支持，以確保我們能取得成功。"
 AFG_political_events.53.a: "[AFG.GetNonIdeologyName]的未來屬於我們！"
 AFG_political_events.54.t: "[GER.GetAdjective]援助抵達"
 AFG_political_events.54.desc: "按照之前的約定，內戰爆發後，[FROM.GetAdjective]為我們提供了裝備。他們在[ROOT.Capital.GetCapitalVictoryPointName]的特工也向我們保證，[FROM.GetAdjective]軍隊很快就會趕來協助我們。"
 AFG_political_events.54.a: "好極了！"
 AFG_political_events.60.t: "$AFG_turko_persian_union$邀請"
 AFG_political_events.60.desc: "[FROM.GetNameDef]正在鑄就他們稱之為突波聯盟的新政治實體。他們似乎將土耳其和波斯傳承用作武器，以便將我們所有的人民團結在一個政府下。第一步就是建立軍事同盟。如果我們同意，毫無疑問他們最終會推動在其領導下的更深入的一體化。"
 AFG_political_events.60.a: "我們應該擁抱我們共同的命運！"
 AFG_political_events.60.b: "他們有什麼資格代表[ROOT.GetAdjective]的人民？"
 AFG_political_events.61.t: "[FROM.GetNonIdeologyName]加入$AFG_turko_persian_union$"
 AFG_political_events.61.desc: "[FROM.GetNameDefCap]同意加入突波聯盟。我們的軍隊將並肩作戰，更好地對抗共同敵人的侵略。但更重要的是，我們擁有了逐漸削弱他們獨立性的立足點。"
 AFG_political_events.61.a: "太好了！"
 AFG_political_events.62.t: "[FROM.GetNonIdeologyName]拒絕加入$AFG_turko_persian_union$"
 AFG_political_events.62.desc: "[FROM.GetNameDefCap]拒絕加入突波聯盟。他們將我們代表所有[TUR.GetAdjective]和[PER.GetAdjective]人的嘗試稱為傲慢，並對此感到十分憤怒。"
 AFG_political_events.62.a: "他們會認識到自己的錯誤"
 AFG_political_events.62.b: "不跟我們走，那就是我們的敵人！"
 AFG_political_influence_major_warning_tt: "如果[FROM.GetNameDefCap]在與我們不一致的意識形態上獲得了超過§R40%§!支持率，我們將可以通過§Y$AFG_foreign_intervention_category$§!決議干預和入侵他們"
 AFG_political_events_51_tt: "當[AFG.GetNonIdeologyName]內戰爆發："
 AFG_political_events.70.t: "[FROM.GetNonIdeologyName]拒絕承認杜蘭線"
 AFG_political_events.70.desc: "1893年劃定的確立了英屬印度與[FROM.GetNonIdeologyName]邊界的杜蘭線長期以來一直是爭論的焦點。隨著[FROM.GetAdjective]民族主義的崛起，以及邊界兩側普什圖部落的統一渴望，[FROM.GetLeader]的政府正式廢除了杜蘭線。現在，[FROM.Capital.GetCapitalVictoryPointName]以歷史錯誤和普什圖領土的不公正劃分為由，要求重新劃定邊界。他們甚至威脅稱，如果我們未能達成協議，就會發動戰爭。"
 AFG_political_events.70.a: "我們目前承擔不起衝突"
 AFG_political_events.70.b: "我們承擔不起一場戰爭，但需要[ROOT.OVERLORD.capital.GetCapitalVictoryPointName]的批准"
 AFG_political_events.70.c: "邊界問題已經解決了，我們不會再進一步商討"
 AFG_political_events.71.t: "[FROM.GetNameDefCap]同意重新議定邊界"
 AFG_political_events.71.desc: "儘管困難重重，[FROM.GetNameDef]還是同意了我們重新議定杜蘭線的要求。[FROM.GetAdjective]面臨著巨大壓力，不願冒險讓該地區陷入長期衝突，同意修改邊界，承認了我們對普什圖土地的合法宣稱。這一外交勝利不僅團結了我們的人民，也加強了[ROOT.GetLeader]統治的合法性。[ROOT.GetNameDef]比以往任何時候都更團結、更強大。"
 AFG_political_events.71.a: "阿富汗輝煌的勝利！"
 AFG_political_events.72.t: "[FROM.GetNameDef]提議領土讓步"
 AFG_political_events.72.desc: "[AFG.GetNameDef]的政治局勢已達到臨界點。他們的政府正式否定了杜蘭線，要求重新議定邊界，以統一普什圖部落。[AFG.GetAdjective]政府明確表示，如果這些要求未得到滿足就會宣戰。面對代價高昂且曠日持久的衝突，[FROM.GetNameDef]提議將有爭議的領土割讓給[AFG.GetNameDef]，以維護地區穩定，避免局勢進一步升級。"
 AFG_political_events.72.a: "我們必須避免捲入另一場衝突"
 AFG_political_events.72.b: "我們不會受到威脅就作出領土讓步"
 AFG_political_events.73.t: "[FROM.GetNameDefCap]同意領土讓步"
 AFG_political_events.73.desc: "鑑於全球目前的緊張局勢以及該地區可能發生代價高昂的衝突，[FROM.Capital.GetCapitalVictoryPointName]認為將爭議領土割讓給[AFG.GetNonIdeologyName]符合他們的最佳利益。我們受命遵守這一指示，以維護地區穩定，避免不必要的戰爭。"
 AFG_political_events.73.a: "務實的解決方案"
 AFG_political_events.74.t: "[FROM.GetNameDefCap]拒絕領土讓步"
 AFG_political_events.74.desc: "[AFG.GetNonIdeologyName]重新議定杜蘭線並割讓普什圖領土的要求遭到了[FROM.Capital.GetCapitalVictoryPointName]的堅決抵制。儘管有可能引發衝突，但[FROM.GetAdjective]政府認為割讓這些領土會製造危險的先例，削弱他們在該地區的地位。我們受命拒絕[AFG.GetNonIdeologyName]的要求，並準備在必要時保衛邊境。"
 AFG_political_events.74.a: "我們將行必要之事"
 AFG_political_events.75.t: "拒絕重新協商邊界"
 AFG_political_events.75.desc: "儘管我們擁有宣稱，且普什圖人民的統一意願強烈，但[FROM.GetNameDef]仍斷然拒絕了與我們重新商討邊界。他們的回應十分堅決，拒絕割讓任何旅途，並警告我們不要讓事態進一步升級。看來只有通過戰爭才能解放這些領土了。"
 AFG_political_events.75.a: "那我們就必須備戰了"
 AFG_political_events.80.t: "[FROM.GetNameDefCap]要求結盟"
 AFG_political_events.80.desc: "[FROM.GetNameDef]發出最後通牒，大膽地維護其在伊斯蘭世界的主導地位，要求我們加入他們不斷擴大的聯盟，在[FROM.GetAdjective]的領導下團結和增強伊斯蘭國家。拒絕這一要求顯然會導致全面入侵。"
 AFG_political_events.80.a: "這符合我們的最大利益"
 AFG_political_events.80.b: "他們無權對我們說三道四"
 AFG_political_events.81.t: "[FROM.GetNameDefCap]同意加入"
 AFG_political_events.81.desc: "面對我們的最後通牒，[FROM.GetNameDef]決定順從我們的要求。他們同意加入我們的同盟，承認[ROOT.GetNameDef]在統一伊斯蘭世界中的實力和領導。這一戰略舉措不僅擴大了我們的影響力，還鞏固了我們在本地區的支配地位。有他們站在我們一邊，伊斯蘭陣線統一的願景越來越接近實現了。"
 AFG_political_events.81.a: "實際上他們別無選擇"
 AFG_political_events.82.t: "[FROM.GetNameDefCap]拒絕加入"
 AFG_political_events.82.desc: "[FROM.GetNameDef]無視我們的最後通牒，拒絕加入我們的同盟。伊拉克政府堅決保持獨立，不願屈服於我們的權威。"
 AFG_political_events.82.a: "那他們將被摧毀"
 AFG_political_events.85.t: "[FROM.GetNameDefCap]請求保護"
 AFG_political_events.85.desc: "[FROM.GetAdjective]政府秘密聯繫我們，希望簽署共同防禦條約，在發生戰爭時彼此保護，並承認與我們的夥伴關係更符合他們的戰略利益。阿富汗成為伊斯蘭世界主導力量的野心與我們更廣闊的地緣政治利益是一致的。"
 AFG_political_events.85.a: "這對我們有利"
 AFG_political_events.85.b: "我們不想捲入[FROM.GetAdjective]的政治"
 AFG_political_events.86.t: "[FROM.GetNameDefCap]同意簽署條約"
 AFG_political_events.86.desc: "[FROM.GetNameDefCap]同意與我們簽署防禦條約。這將確保兩國在遭遇戰爭時互相支持，增強我們的戰略地位。有了[FROM.GetNameDef]的軍隊，我們成為伊斯蘭世界主導力量的野心將更容易實現。"
 AFG_political_events.86.a: "然後，我們就可以開始擴張了"
 AFG_political_events.87.t: "[FROM.GetNameDefCap]拒絕簽署條約"
 AFG_political_events.87.desc: "[FROM.GetNameDef]措辭謹慎地拒絕了我們的簽署防禦條約的提議。儘管意識到了潛在的戰略利益，但他們還是選擇優先考慮其他夥伴關係，並對與我們達成此類協議保持謹慎。"
 AFG_political_events.87.a: "這會花費不少時間，但我們將獨力實現我們的目標"
 AFG_political_events.90.t: "[AFG.GetNameDefCap]支持中亞反動分子"
 AFG_political_events.90.desc: "有報告稱，[AFG.GetLeader]統治的[AFG.GetNameDef]正積極推動我們的中亞各共和國內部的反動活動。[AFG.GetAdjective]特務在當地人口中挑起騷亂和反[ROOT.GetAdjective]情緒。這種顛覆行為是對我們在該地區權威的直接挑戰，並威脅到了我們中亞領土的穩定。我們必須反制這種外國干涉，維持對我們的共和國的控制。"
 AFG_political_events.90.a: "我們必須部署更多安全部隊來鎮壓暴動"
 AFG_political_events_90_tt: "解鎖§Y[AFG_get_turkik_people_name_key]§!決議，可以在中亞地區移除抵抗組織。§R如果我們未能移除抵抗組織，且與[FROM.GetNameDef]處於戰爭，這些地區會對我們發動叛亂！§!"
 AFG_political_events.91.t: "中亞各共和國叛亂"
 AFG_political_events.91.desc: "與[AFG.GetNameDef]的戰爭爆發後，我們的中亞共和國的形勢抵達了臨界點。數個共和國受到[AFG.GetAdjective]干預和當前衝突的鼓舞發起叛亂，宣佈從[ROOT.GetNameDef]獨立。這場大範圍叛亂對整個地區的穩定構成了威脅，並且讓我們的軍事資源更加匱乏。我們必須迅速採取行動，鎮壓叛亂恢復秩序，否則有失去中亞控制權的風險。"
 AFG_political_events.91.a: "我們必須鎮壓叛亂，恢復我們的權威"
 AFG_political_events.95.t: "[GER.GetAdjective]部隊出現在[FROM.GetNonIdeologyName]"
 AFG_political_events.95.desc: "陷入困境的[AFG.GetNonIdeologyName]最近爆發的內戰在[ROOT.Capital.GetCapitalVictoryPointName]引發了擔憂。然而，事態變得更加糟糕，據報道，[GER.GetAdjective]部隊正在協助[AFG.GetLeader]推翻合法政府。我們只能懷疑[AFG.GetLeader]與[GER.GetNameDef]結盟了，這將對我們在該地區的利益構成重大威脅。因此，軍方起草了方案上交我們批准，這將使我們能夠秘密援助合法政府，防止法西斯接管國家。"
 AFG_political_events.95.a: "這對地區安全至關重要，批准"
 AFG_political_events.95.b: "[AFG.GetNonIdeologyName]與我們無關"
 AFG_political_events.100.t: "呼羅珊緩衝國"
 AFG_political_events.100.desc: "[FROM.GetNameDef]政府已確定在[PER.GetNonIdeologyName]東部建立緩衝國的戰略必要性。為此，他們正式要求交出東伊朗的部分領土，以建立呼羅珊國。他們認為，這個新的緩衝國將為該地區帶來穩定。"
 AFG_political_events.100.a: "如果這能帶來長期的和平，我們有什麼理由反對？"
 AFG_political_events.100.b: "我們不會做這種事"
 AFG_political_events.101.t: "[FROM.GetNameDefCap]同意建立緩衝國"
 AFG_political_events.101.desc: "[FROM.GetNameDef]政府同意交出東[PER.GetNonIdeologyName]部分領土的控制權，讓我們按照計劃建立呼羅珊緩衝國。"
 AFG_political_events.101.a: "我們的西方終於安全了"
 AFG_political_events.102.t: "[FROM.GetNameDefCap]拒絕緩衝國倡議"
 AFG_political_events.102.desc: "很遺憾，[FROM.GetNameDef]政府拒絕交出東[PER.GetNonIdeologyName]的領土。他們對於這對區域穩定的影響表示擔憂。"
 AFG_political_events.102.a: "我們會使用替代方案推動議程"
 AFG_political_events.110.t: "[FROM.GetNameDefCap]索要領土"
 AFG_political_events_110_desc_balochistan: "[FROM.GetNameDef]政府向我們索取俾路支斯坦的領土，宣稱這裡在法理上屬於他們，而當前的邊界不公正地分離了他們的人民和領土。"
 AFG_political_events_110_desc_durand: "[FROM.GetNameDef]政府向我們索取相鄰的部分領土，宣稱這裡在法理上屬於他們，而當前的邊界不公正地分離了他們的人民和領土。"
 AFG_political_events.110.a: "如果這能讓他們遠離我們的後背"
 AFG_political_events.110.b: "我們寸土不讓"
 AFG_political_events.111.t: "[FROM.GetNameDefCap]同意割讓領土"
 AFG_political_events.111.desc: "[FROM.GetNameDefCap]同意移交我們索要的地區。經過幾十年的糾紛，我們終於可以歡迎失去多年的民眾重返家園。"
 AFG_political_events.111.a: "好極了！"
 AFG_political_events.112.t: "[FROM.GetNameDefCap]拒絕割讓領土"
 AFG_political_events.112.desc: "[FROM.GetNameDefCap]拒絕移交我們索要的地區。看來我們將不得不尋找替代方案，以便在將來奪回我們的法理領土。"
 AFG_political_events.112.a: "不枉一試"
 AFG_political_events.112.b: "那我們就用武力奪取"
 AFG_political_events.120.t: "[FROM.GetNameDefCap]請求援助"
 AFG_political_events.120.desc: "[AFG.GetNonIdeologyName]共產主義運動的代表已聯繫我們，請求我們支持他們蓬勃發展的革命。雖然這個深陷泥潭的國家能否支持社會主義經濟還有爭議，但我們不能無視將社會主義前線推進到中亞甚至更遠的重要性。"
 AFG_political_events.120.a: "這符合我們在該地區的戰略目標"
 AFG_political_events.120.b: "[SOU.GetAdjective]的鮮血永遠不會灑在[FROM.GetNonIdeologyName]！"
 AFG_political_events.121.t: "[FROM.GetNameDefCap]同意提供援助"
 AFG_political_events.121.desc: "為了履行他們對於國際團結理想的承諾，[FROM.GetNameDefCap]同意援助我們的鬥爭。他們通知我們，他們全副武裝的志願者部隊將在不久後向我國開進。"
 AFG_political_events.121.a: "謝謝你，同志！"
 AFG_political_events.122.t: "[FROM.GetNameDefCap]拒絕提供援助"
 AFG_political_events.122.desc: "[FROM.GetNameDefCap]拒絕了我們的求援。他們認為我們不具備革命條件，註定會失敗。在可預見的未來，我們的人民很可能會深深地怨恨[FROM.GetNameDef]。"
 AFG_political_events.122.a: "這是對社會主義理想的背叛"
 AFG_political_events.130.t: "[FROM.GetNameDefCap]索要領土"
 AFG_political_events.130.desc: "[FROM.GetNonIdeologyName]政府向我國提出了一項加強其國家實力的方案，即與我們部分毗鄰[ROOT.GetAdjective]邊境的部分領土組成邦聯。這將導致我們的邊界調整，但也可能在該區域結交一個強大的盟友。"
 AFG_political_events.130.a: "我們支持"
 AFG_political_events.130.b: "他們拿這事問我們可真夠蠢的"
 AFG_political_events.131.t: "[FROM.GetName]同意建立邦聯"
 AFG_political_events.131.desc: "[FROM.GetAdjective]政府已同意我們的邦聯提議。我們現在可以開始將新領土整合至我們的政治和經濟體系之中。這一舉措有望在未來對我們的區域對手形成威懾。"
 AFG_political_events.131.a: "好極了！"
 AFG_political_events.132.t: "[FROM.GetName]拒絕邦聯"
 AFG_political_events.132.desc: "[FROM.GetAdjective]政府拒絕了我們提出的邦聯計劃。這對我們的外交政策而言是一次重大挫折，並引發了人們對我們與[FROM.GetNameDef]的未來關係走向的擔憂。"
 AFG_political_events.132.a: "錯失良機"
 AFG_political_events.140.t: "選舉結果"
 AFG_political_events.140.desc: "由於之前缺乏相關經驗，這次選舉有些混亂。不過，一些受到廣泛支持的候選人已經成為領跑者。隨著投票站關閉，看起來選民更加支持："
 AFG_political_events.140.a: "年輕迷人的穆罕默德·達烏德·汗"
 AFG_political_events.140.b: "始終如一的薩達爾·沙阿·馬哈茂德·汗"
 AFG_political_events.140.c: "堅守傳統的穆罕默德·易卜拉欣·汗"
 AFG_political_events.150.t: "[FROM.GetNameDefCap]要求防禦條約"
 AFG_political_events.150.desc: "[FROM.GetNonIdeologyName]政府已就一項加強兩國軍事經濟有限整合的提案與我方接洽。此舉意味著雙方需在戰爭狀態下相互提供援助，但或許這是深化合作的合理代價？"
 AFG_political_events.150.a: "這隻會增強我們雙方的國力"
 AFG_political_events.150.b: "他們拿這事與我方接洽可真夠蠢的"
 AFG_political_events.151.t: "[FROM.GetName]同意擴大條約"
 AFG_political_events.151.desc: "[FROM.GetAdjective]政府已同意我們的防務提案。現在我們可以開始將雙方的軍事設施進行整合。這一舉措有望在短期內對我們地區的潛在對手形成有效威懾。"
 AFG_political_events.151.a: "棒極了！"
 AFG_political_events.152.t: "[FROM.GetName]拒絕條約"
 AFG_political_events.152.desc: "[FROM.GetAdjective]政府拒絕了我們協調國防工業的提議，因此，我們與[FROM.GetLeader]建立友誼的夢想也戛然而止。"
 AFG_political_events.152.a: "真是錯失良機。"
 AFG_political_events.153.t: "[AFG.GetNonIdeologyName]的$AFG_faqir_of_ipi$請求援助"
 AFG_political_events.153.desc: "[FROM.GetNonIdeologyName]的傳統派部落領袖$AFG_faqir_of_ipi$聯繫了我們的政府，希望我們能支持他登上王位。他承諾，在我們的支持下，他會建立一個強大的、符合我們利益的國家。"
 AFG_political_events.153.a: "我們在該地區需要更多盟友。"
 AFG_political_events.153.b: "為什麼要干涉如此遙遠國度的事務？"
 AFG_political_events_153_tt: "§Y當內戰爆發，[JAP.GetNonIdeologyName]會為我們提供武器，並派遣志願軍協助我們。§!"
 AFG_political_events.154.t: "[FROM.GetNameDefCap]拒絕支持我們"
 AFG_political_events.154.desc: "[FROM.GetAdjective]政府已回覆我們的請求，並遺憾地拒絕為$AFG_faqir_of_ipi$登上王位提供支持。[FROM.GetAdjective]政府以可能捲入潛在糾紛以及當前地緣政治局勢為由，決定將重心放在其他戰略重點上。"
 AFG_political_events.154.a: "他們竟敢背叛我們！"
 AFG_political_events.155.t: "[FROM.GetNameDefCap]同意支持我們"
 AFG_political_events.155.desc: "應我方請求，[FROM.GetName]政府已同意支持$AFG_faqir_of_ipi$繼承[ROOT.GetNonIdeologyName]王位。此項支持將包括軍事援助與裝備供給，以確保我方事業取得成功。"
 AFG_political_events.155.a: "[AFG.GetNonIdeologyName]的未來屬於我們！"
 AFG_political_events.156.t: "[JAP.GetAdjective]援助抵達"
 AFG_political_events.156.desc: "根據先前達成的協議，自內戰爆發以來，[FROM.GetAdjective]的裝備已提供給我方使用。其在[ROOT.Capital.GetCapitalVictoryPointName]的特工人員也向我們保證，[FROM.GetAdjective]的隱蔽部隊將很快抵達該國協助我方作戰。"
 AFG_political_events.156.a: "棒極了！"
 AFG_political_events.157.t: "[GER.GetAdjective]援助抵達"
 AFG_political_events.157.desc: "根據先前達成的協議，自內戰爆發以來，[FROM.GetAdjective]的裝備已提供給我方使用。其在[ROOT.Capital.GetCapitalVictoryPointName]的特工人員也向我們保證，[FROM.GetAdjective]的隱蔽部隊將很快抵達該國協助我方作戰。"
 AFG_political_events.157.a: "棒極了！"
 AFG_political_events.158.t: "[AFG.GetNonIdeologyName]的$AFG_faqir_of_ipi$請求援助"
 AFG_political_events.158.desc: "[FROM.GetNonIdeologyName]的傳統派部落領袖$AFG_faqir_of_ipi$聯繫了我們的政府，希望我們能支持他登上王位。他承諾，在我們的支持下，他會建立一個強大的、符合我們利益的國家。"
 AFG_political_events.158.a: "我們在該地區需要更多盟友。"
 AFG_political_events.158.b: "為什麼要干涉如此遙遠國度的事務？"
 AFG_political_events.159.t: "[FROM.GetNameDefCap]拒絕支持我們"
 AFG_political_events.159.desc: "[FROM.GetAdjective]政府已回覆我們的請求，並遺憾地拒絕為$AFG_faqir_of_ipi$登上王位提供支持。[FROM.GetAdjective]政府以可能捲入潛在糾紛以及當前地緣政治局勢為由，決定將重心放在其他戰略重點上。"
 AFG_political_events.159.a: "他們竟敢背叛我們！"
 AFG_political_events.160.t: "[FROM.GetNameDefCap]同意支持我們"
 AFG_political_events.160.desc: "應我方請求，[FROM.GetName]政府已同意支持$AFG_faqir_of_ipi$繼承[ROOT.GetNonIdeologyName]王位。此項支持將包括軍事援助與裝備供給，以確保我方事業取得成功。"
 AFG_political_events.160.a: "[AFG.GetNonIdeologyName]的未來屬於我們！"
 AFG_political_events.170.t: "莫臥兒王公的加冕"
 AFG_political_events.170.desc: "米爾扎·庫爾希德·賈·巴哈杜爾於數日前抵達我國，現正舉行盛大典禮，承認其對莫臥兒帝國和帖木兒帝國的繼承權，並加冕為阿富汗新任埃米爾。假以時日，或許我們將能重現這些古老帝國的榮光。"
 AFG_political_events.170.a: "新任埃米爾萬歲！"
 AFG_political_events.171.t: "布哈拉埃米爾的加冕"
 AFG_political_events.171.desc: "賽義德·米爾·穆罕默德·阿利姆汗自從被蘇維埃流放離開布哈拉後，就一直待在喀布爾。隨著他加冕成為新的阿富汗埃米爾，或許我們能夠利用他的主張，從[SOV.GetAdjective]的威脅中奪回中亞。"
 AFG_political_events.171.a: "新任埃米爾萬歲！"
 AFG_political_events.172.t: "[FROM.GetNameDefCap]佔領瓦濟里斯坦！"
 AFG_political_events.172.desc: "\n本週早些時候，隸屬於[FROM.GetNameDef]的部隊進入並佔領了我們的瓦濟里斯坦地區，聲稱他們執行的任務是保護該地區免受敵人的潛在佔領。這顯然是一種戰爭行為，但我們或許可以選擇無視，因為他們可能並非要與我們開戰，而是尋求統一四散的普什圖族人民。"
 AFG_political_events.172.a: "不值得為之開戰"
 AFG_political_events.172.b: "他們以為自己是誰？"
 AFG_political_events.173.t: "新任王室首相"
 AFG_political_events.173.desc: "由於$AFG_mohammad_hashim_khan$所做的決策遭到眾多質疑，現已決定通過任命他的一位兄弟為新的領導者來穩固王室統治，並服從於$AFG_mohammed_zahir_shah$。將由誰來接替他？"
 AFG_political_events.173.a: "始終如一的$AFG_shah_mahmud_khan$"
 AFG_political_events.173.b: "軍事的天才$AFG_sardar_shah_wali_khan$"
 AFG_political_events.173.c: "更進步的$AFG_mohammed_daoud_khan$"
 #RAJ
 #India wants to invade Bhutan
 GOE_RAJ.1.t: "[FROM.GetName]申請入侵[BHU.GetName]許可"
 GOE_RAJ.1.desc: "我們的附屬國[FROM.GetNameDef]看到了征服[BHU.GetAdjective]隱士王國，擴大我們在印度次大陸影響力的機會。這將打開通往內亞的大門。"
 GOE_RAJ.1.a: "好主意"
 GOE_RAJ.1.b: "這有點太具侵略性了"
 GOE_RAJ.2.t: "[FROM.GetName]同意"
 GOE_RAJ.2.desc: "[FROM.GetName]批准了我們擴張領土的申請。沒什麼能阻止我們了。"
 GOE_RAJ.2.a: "太好了"
 GOE_RAJ.3.t: "[FROM.GetName]拒絕"
 GOE_RAJ.3.desc: "[FROM.GetName]拒絕了我們擴張領土的申請，宣稱此時破壞次大陸的穩定不符合王室的利益。"
 GOE_RAJ.3.a: "真是遺憾"
 #India demands Bhutan protectorate
 GOE_RAJ.4.t: "[FROM.GetName]要求歸附"
 GOE_RAJ.4.desc: "隨著大陸局勢迅速惡化，[FROM.GetNameDef]要求我們王國穩固地融入他們的勢力範圍。\n[FROM.GetAdjective]政府強調，我們將保持一定的獨立性，但決不能危及國家。"
 GOE_RAJ.4.a: "不可接受的條款"
 GOE_RAJ.4.b: "我們只能讓步"
 GOE_RAJ.5.t: "[FROM.GetName]拒絕"
 GOE_RAJ.5.desc: "[FROM.GetName]拒絕了我們的要求，強調他們是獨立的王國，擁有自己的規則和秩序。"
 GOE_RAJ.5.a: "不可接受"
 GOE_RAJ.6.t: "[FROM.GetName]屈服"
 GOE_RAJ.6.desc: "[FROM.GetName]同意了我們的要求，在事實上成為一個附屬國。"
 GOE_RAJ.6.a: "非常好！"
 GOE_RAJ.7.t: "蘇巴斯·錢德拉·鮑斯提議推翻[GetRajAdjective]政府"
 GOE_RAJ.7.desc: "民族主義領袖錢德拉·鮑斯為爭取[GetRajName]獨立，向我們提出了一項破壞[GetRajAdjective]大陸穩定的提議。如果我們接受，實際來臨時，我們會被召喚協助推翻帝國對[GetRajAdjective]的佔領。"
 GOE_RAJ.7.a: "我們會援助他們"
 GOE_RAJ.7.a_tt: "§Y當蘇巴斯·錢德拉·鮑斯發動革命時，我們會被召喚加入針對[RAJ.GetName]的戰爭§!"
 GOE_RAJ.7.b: "我們另有打算"
 GOE_RAJ.8.t: "[FROM.GetName]同意幫助我們"
 GOE_RAJ.8.desc: "[FROM.GetName]表示會支持我們爭取獨立的鬥爭。"
 GOE_RAJ.8.a: "離獨立更近一步"
 GOE_RAJ.9.t: "[FROM.GetName]拒絕幫助我們"
 GOE_RAJ.9.desc: "[FROM.GetName]表示參與針對[ENG.GetAdjective]的戰爭會破壞他們的計劃，因此不會幫助我們。"
 GOE_RAJ.9.a: "反正我們也不需要幫助"
 GOE_RAJ.10.t: "[FROM.GetName]要求[JAP.GetName]履行諾言"
 GOE_RAJ.10.desc: "蘇巴斯·錢德拉·鮑斯發動了革命。我們收到一封電報，稱如果我們願意旅行承諾，現在就是時候了。\n這是徹底擊敗亞洲範圍的主要競爭對手的機會。"
 GOE_RAJ.10.a: "我們戰鬥"
 GOE_RAJ.10.b: "我們不得不背棄承諾"
 GOE_RAJ.11.t: "[FROM.GetName]履行承諾"
 GOE_RAJ.11.desc: "[FROM.GetName]正在完全動員，隨時準備幫助我們作戰。"
 GOE_RAJ.11.a: "鮮血與自由！"
 GOE_RAJ.12.t: "[FROM.GetName]背棄承諾"
 GOE_RAJ.12.desc: "沒有任何[FROM.GetAdjective]士兵前來幫助我們。承諾的幫助遙遙無期，東京保持沉默。看來我們要孤軍作戰了。"
 GOE_RAJ.12.a: "背誓者！"
 GOE_RAJ.13.t: "將安達曼群島交給[GetRajName]？"
 GOE_RAJ.13.desc: "自由印度政府需要一個遠離前線的首都來管理行政，直到其勝利得到穩固。\n最近征服的安達曼群島非常合適。"
 GOE_RAJ.13.a: "給他們吧"
 GOE_RAJ.13.b: "事實上我們需要這裡"
 GOE_RAJ.14.t: "[JAP.GetName]移交安達曼群島"
 GOE_RAJ.14.desc: "[JAP.GetAdjective]成功入侵了安達曼群島。他們決定將該地轉交給我們，讓我們可以在那裡建立政府。"
 GOE_RAJ.14.a: "太好了"
 GOE_RAJ.14.tt: "我們可以通過完成§Y$RAJ_shaheed_and_swara$§!國策將首都轉移至安達曼群島。"
 GOE_RAJ.15.t: "[RAJ.GetNameDefCap]保留[992.GetName]"
 GOE_RAJ.15.desc: "[RAJ.GetNameDefCap]通知我們，儘管之前打算將亞丁港交給王室，但現在他們傾向於保留這裡的控制權。\n不出所料，這在議會激起了相當大的震怒，尤其是溫斯頓·丘吉爾，但目前還沒計劃採取行動。"
 GOE_RAJ.15.a: "他們有什麼打算？"
 GOE_RAJ.16.t: "[FROM.GetNameDefCap]移交[992.GetName]"
 GOE_RAJ.16.desc: "按照《1935年印度政府法案》的計劃，[GetRajAdjective]政府將[992.GetName]的行政職責交給了我們。"
 GOE_RAJ.16.a: "降低行政負擔"
 GOE_RAJ.17.t: "[RAJ.GetName]對[TIB.GetName]採取行動"
 GOE_RAJ.17.desc: "[RAJ.GetName]在與[TIB.GetName]的邊界上擺出一副咄咄逼人的姿態，宣佈他們打算擴大安全區以保護其腹地。這完全破壞了我們在該地區的利益。"
 GOE_RAJ.17.a: "保障[TIB.GetName]獨立"
 GOE_RAJ.17.b: "我們支撐不起另一條前線"
 GOE_RAJ.18.t: "[RAJ.GetLeader]要求歸還殖民地"
 GOE_RAJ.18.desc: "[RAJ.GetNameDefCap]擺脫過去的枷鎖後，[RAJ.GetLeader]變得強硬起來，要求我們歸還在這裡的殖民地。統一次大陸成為一個強大的國家對這個新生國家來說似乎至關重要。"
 GOE_RAJ.18.a: "他們只能用武力來奪取"
 GOE_RAJ.18.b: "我們承擔不起距離如此遠的戰爭"
 GOE_RAJ.19.t: "[FROM.GetName]拒絕交出殖民地"
 GOE_RAJ.19.desc: "儘管我們一再警告現狀是不可接受的，但[FROM.GetAdjective]政府仍頑固地拒絕交出[GetRajAdjective]的法理土地。"
 GOE_RAJ.19.a: "那麼我們將不得不用武力來奪取"
 GOE_RAJ.20.t: "[FROM.GetName]交出殖民地"
 GOE_RAJ.20.desc: "[FROM.GetName]政府勉強接受了我們的要求。然而，他們明確表示，這種強硬的政治手段不會長期奏效，目前的讓步只是權宜之計。"
 GOE_RAJ.20.a: "正義得以伸張"
 GOE_RAJ.21.t: "枷鎖斷裂"
 GOE_RAJ.21.desc: "英帝國主義枷鎖下的舊政府已經投降，其管理者逃離了這個國家。隨著我們對次大陸的控制得到鞏固，我們需要決定如何應對過去的宗主。"
 GOE_RAJ.21.a: "提議和平"
 GOE_RAJ.21.b: "和帝國主義之間沒有和平"
 GOE_RAJ.22.t: "英屬印度陷落"
 GOE_RAJ.22.desc: "林利思戈勳爵發來一封慌亂的電報，由[RAJ.GetLeader]領導的叛軍已經控制了這個國家。\n林利思戈帶來了[RAJ.GetLeader]提出的無條件和平，前提是我們放棄對印度的所有宣稱。"
 GOE_RAJ.22.a: "決不妥協"
 GOE_RAJ.22.b: "東方淪陷了"
 GOE_RAJ.23.t: "[ENG.GetName]拒絕和平提議"
 GOE_RAJ.23.desc: "[ENG.GetName]拒絕了我們的和平提議。[ENG.GetAdjective]人打算繼續戰爭直到奪回他們的明珠。"
 GOE_RAJ.23.a: "那就這樣吧"
 GOE_RAJ.24.t: "[ENG.GetName]接受和平提議"
 GOE_RAJ.24.desc: "[ENG.GetName]不情願地接受了我們的和平提議。現在[GetRajName]可以鑄就自己的命運了。"
 GOE_RAJ.24.a: "我們付出了鮮血"
 GOE_RAJ.25.t: "[RAJ.GetName]與[ENG.GetName]達成無條件和平"
 GOE_RAJ.25.desc: "[RAJ.GetAdjective]與他們的前宗主國簽署和平協議，最終擺脫了帝國統治獲得了完全獨立。我們也可以與他們達成和平，從而獲得巨大的士氣勝利。"
 GOE_RAJ.25.a: "簽署和平條約"
 GOE_RAJ.25.b: "我們還沒完呢"
 GOE_RAJ.26.t: "蘇巴斯·錢德拉·鮑斯出獄"
 GOE_RAJ.26.desc: "我們成功將我們的領袖從監獄中解救出來。這是個好消息，我們的事業有了主心骨。"
 GOE_RAJ.26.a: "太好了！"
 GOE_RAJ.27.t: "[RAJ.GetNameDefCap]希望無條件和平"
 GOE_RAJ.27.desc: "擺脫了壓迫者枷鎖的[RAJ.GetNameDefCap]不希望我們國家陷入一場徒勞的戰爭。"
 GOE_RAJ.27.a: "不，戰爭必須繼續"
 GOE_RAJ.27.b: "聽起來不錯"
 GOE_RAJ.28.t: "[FROM.GetName]拒絕簽署無條件和平條約"
 GOE_RAJ.28.desc: "[FROM.GetName]拒絕了我們退出衝突的嘗試。這會是我們的垮臺，還是他們的？"
 GOE_RAJ.28.a: "不妙"
 GOE_RAJ.29.t: "[RAJ.GetName]的新總督"
 GOE_RAJ.29.desc: "弗里曼-弗里曼·托馬斯的印度總督任期即將結束，我們需要決定是要用合適的人選頂替他，還是延長威林登侯爵的任期。"
 GOE_RAJ.29.a: "維克托·霍普將頂替伯爵"
 GOE_RAJ.29.b: "讓弗里曼-弗里曼留任"
 GOE_RAJ.30.t: "英屬印度政府垮臺"
 GOE_RAJ.30.desc: "經過幾個世紀的統治，[ENG.GetAdjective]政府終於離開了印度。官員們收拾好辦公室，殖民地行政人員起草完最終報告，米字旗從政府建築上落下。但是，過渡遠稱不上平穩，關於邊界和軍事控制的問題尚未解決，導致最終獨立出現了延誤。"
 GOE_RAJ.30.a: "終於，我們自由了"
 GOE_RAJ.30.b: "不，我們喜歡這裡"
 GOE_RAJ.30_we_are_leaving_tt: "在§Y[RAJ.GetName]§!解決行政問題期間，他們會暫時處於我們控制下，但最終他們還是會擺脫束縛。"
 GOE_RAJ.31.t: "[RAJ.GetName]的價格混亂"
 GOE_RAJ.31.desc: "[RAJ.GetName]試圖從大蕭條中恢復過來，其價格管制似乎破壞了國家的穩定。將盧比與英鎊掛鉤有可能使我們兩國都陷入經濟動盪。\n一個私人財團向我們提出了將英屬印度一分為二的建議，以減輕該國的財政負擔。一部分由私人控制，另一部分仍由王室掌控。\n什麼都不做可能會帶來更糟糕的後果。"
 GOE_RAJ.31.a: "我們必須這麼做"
 GOE_RAJ.31.a_tt: "東印度公司將成立，接管印度部分地區"
 GOE_RAJ.31.b: "決不"
 GOE_RAJ.32.t: "亞丁問題"
 GOE_RAJ.32.desc: "按照[ENG.GetAdjective]政府的計劃，我們要將亞丁交給他們，但如果我們願意，也許可以嘗試保留這裡。"
 GOE_RAJ.32.a: "交出它"
 GOE_RAJ.32.b: "保留它"
 GOE_RAJ.32.b_tt: "我們會保留§Y亞丁省份§!的控制權，這將允許我們完成§Y貿易港§!國策"
 GOE_RAJ.33.t: "西北印叛亂！"
 GOE_RAJ.33.desc: "一個自稱那個早已消逝的帝國的合法繼承人的團體已在遙遠的西北方發動獨立戰爭，將不滿的派系集結到他們麾下。儘管印度大部分仍處於控制下，但這場叛亂威脅到了穩定。這將是歷史上的腳註，還是帝國的迴歸？"
 GOE_RAJ.33.a: "不可容忍"
 GOE_RAJ.33.b_tt: "失去古吉拉特和德里將被迫無條件和平"
 GOE_RAJ.33.b: "我們有其他事要關心"
 GOE_RAJ.33.c: "為了勝利！"
 GOE_RAJ_33_c_tt: "§R我們必須挺過255天才能停火。如果我們在停火時佔領了東印度、西印度、中印度、南印度或北印度的所有地區，將獲得更大的領土讓步！§!"
 GOE_RAJ.34.t: "[UK_INDIA.GetName]管理崩潰"
 GOE_RAJ.34.desc: "[UK_INDIA.GetName]的災難！地方行政因西方長久的戰事而崩潰。為了維持對國家的控制，他們對叛軍提出了領土讓步。我們或許不承認這些叛軍，但就目前而言，戰爭已經輸了。"
 GOE_RAJ.34.a: "災難！"
 GOE_RAJ.35.t: "[ENG.GetName]允許我們獨立"
 GOE_RAJ.35.desc: "一槍未發，英屬印度就不復存在了。我們鞏固了對印度的控制，英王政府受夠了帝國的負擔，選擇不出手干預。"
 GOE_RAJ.35.a: "出乎意料"
 GOE_RAJ.37.t: "來自白廳的警告"
 GOE_RAJ.37.desc: "不出所料，我們最近的佔領政策引起了抵抗活動的激增。這一情況顯然已經引起了英王陛下政府的關注。我們收到了一封措辭嚴厲的信函，其中明確表達了對我們在治理上魯莽行為的不滿。儘管信函用詞審慎，但字裡行間仍透露出強烈的威脅。信中毫不含糊地建議我們重新審視我們的立場，以免被迫採取我們可能不願意的方式恢復秩序。"
 GOE_RAJ.37.a: "我們應該叫板嗎？"
 GOE_RAJ.38.t: "帝國反戈一擊"
 GOE_RAJ.38.desc: "顯然，[ENG.GetAdjective]政府對我們的地方治理方已法忍無可忍。英軍以穩定行動為藉口，大規模進駐。我們的抵抗網絡被徹底摧毀，不穩定因素被壓制，我們的影響力也被巧妙地邊緣化。\n英國堅稱這一切都是暫時的，是保護該地區完整的必要干預。然而，其要傳達的信息再明確不過：他們才是這裡的主宰，如果我們想要繼續治理，就必須遵循他們的規則。"
 GOE_RAJ.38.a: "我們會配合的，暫時。"
 GOE_RAJ.39.t: "與工會談判"
 GOE_RAJ.39.desc: "在光線昏暗的地窖裡，工會領袖們同意與我們會面，這裡沒有政府的哨探。他們掌控著農民、工廠工人和魚販——這些普通民眾的力量。他們願意支持我們推翻現政府的行動，但要求得到一些回報作為交換。"
 GOE_RAJ.39.a: "保障工人安全"
 GOE_RAJ.39.a_tt: "我們掌權後將有義務在§Y6個月§!內改善工人安全。未能這麼做會激怒工會。改善工人安全："
 GOE_RAJ.39.b: "保證最低工資"
 GOE_RAJ.39.b_tt: "我們掌權後將有義務在§Y6個月§!內保障最低工資。未能這麼做會激怒工會。保障最低工資："
 GOE_RAJ.39.c: "結束會議"
 GOE_RAJ.39.c_tt: "我們可以在完成§Y$RAJ_royal_indian_navy_mutiny$§!後再次與他們會面"
 GOE_RAJ.40.t: "德里北部邊境衝突"
 GOE_RAJ.40.desc: "印度軍隊已經進入[986.GetName]附近的爭議領土。德里北部的丘陵和平原上爆發了小規模衝突。他們宣稱，根據歷史，這片土地理應屬於革命者。印度總理在一次廣播講話中稱巴基斯坦是殖民分裂的殘遺。緊張局勢正在加劇，衝突似乎近在眼前。"
 GOE_RAJ.40.a: "他們怎麼敢的？"
 GOE_RAJ.41.t: "[RAJ.GetName]奪取[986.GetName]"
 GOE_RAJ.41.desc: "印度軍隊已佔領了邊境地區。經過激烈的戰鬥，巴基斯坦軍隊撤出，共產主義旗幟在當地飄揚。印度廣播稱這是人民的勝利。"
 GOE_RAJ.41.a: "革命在發展"
 GOE_RAJ.41.b: "苦澀的失敗"
 GOE_RAJ.42.t: "[431.GetName]邊境衝突"
 GOE_RAJ.42.desc: "印度軍隊已經進入[431.GetName]附近的爭議領土。加爾各答北部的平原上爆發了小規模衝突。他們宣稱，根據歷史，這片土地理應屬於革命者。印度總理在一次廣播講話中稱巴基斯坦是殖民分裂的殘遺。緊張局勢正在加劇，衝突似乎近在眼前。"
 GOE_RAJ.42.a: "他們怎麼敢的？"
 GOE_RAJ.43.t: "[RAJ.GetName]奪取[431.GetName]"
 GOE_RAJ.43.desc: "印度軍隊已佔領了加爾各答。經過激烈的戰鬥，巴基斯坦軍隊撤出，共產主義旗幟在當地飄揚。印度廣播稱這是人民的勝利。"
 GOE_RAJ.43.a: "革命在發展"
 GOE_RAJ.43.b: "苦澀的失敗"
 GOE_RAJ.44.t: "[433.GetName]邊境衝突"
 GOE_RAJ.44.desc: "印度軍隊已經進入[433.GetName]附近的爭議領土，並奪取了泰姬陵。他們宣稱，根據歷史，這片土地理應屬於革命者。印度總理在一次廣播講話中稱巴基斯坦是殖民分裂的殘遺。緊張局勢正在加劇，衝突似乎近在眼前。"
 GOE_RAJ.44.a: "他們怎麼敢的？"
 GOE_RAJ.45.t: "[RAJ.GetName]奪取[433.GetName]"
 GOE_RAJ.45.desc: "印度軍隊已佔領了[433.GetName]。經過激烈的戰鬥，巴基斯坦軍隊撤出，共產主義旗幟在當地飄揚。印度廣播稱這是人民的勝利。"
 GOE_RAJ.45.a: "革命在發展"
 GOE_RAJ.45.b: "苦澀的失敗"
 GOE_RAJ.46.t: "民眾暴動"
 GOE_RAJ.46.desc: "地下共產主義煽動者呼籲人民武裝起來，農村爆發了動亂。村莊已開始反對地主，鐮刀錘子旗幟在鎮公所上空飄揚。\n\n從口號和武器來看，這場暴動背後有[FROM.GetName]的影子。\n\n一場關乎我們國家內心與靈魂的新戰爭已經開始。"
 GOE_RAJ.46.a: "剷除紅色分子！"
 GOE_RAJ.46.b: "我們難以應對這種壓力"
 GOE_RAJ.46.c: "我們早就走在共產主義道路上了！"
 GOE_RAJ.47.t: "印度影響力增長"
 GOE_RAJ.47.desc: "印度人民共和國已經開始將其意識形態範圍擴展到國界之外。\n\n最近幾週，我們政治範圍內親印度的聲音越來越大。出版物讚揚了他們的分權社會主義模式、他們對外國影響的抵制，以及他們在改造後殖民國家方面取得的顯著成功。\n\n目前尚不清楚這是否是[From.GetNameDef]為改變我們的內部政治而做出的努力，但人們已經感受到了他們的存在。"
 GOE_RAJ.47.a: "我們會密切關注"
 GOE_RAJ.48.t: "印度革命影響波及[This.GetNameDef]"
 GOE_RAJ.48.desc: "在一系列受[RAJ.GetNameDef]啟發的出版物與廣播之後，[This.GetAdjective]社會中越來越多的人開始轉向印度式農業社會主義。土地改革、自主治理和反帝團結的理念在工人和農民中引發了強烈共鳴。\n\n雖然目前仍屬邊緣運動，[This.GetAdjective]的許多領導人擔心若不強力回應，這股思潮可能演變為大規模罷工，甚至是與[From.GetNameDef]革命目標一致的武裝動亂。"
 GOE_RAJ.48.a: "令人擔憂"
 GOE_RAJ.51.t: "[PAK.GetName]保留[986.GetName]"
 GOE_RAJ.51.desc: "巴基斯坦軍隊繼續控制著邊境地區。印度軍隊在激烈交戰後撤退，巴基斯坦仍然佔據該區域。印度廣播對這場失敗進行選擇性報道，以避免國家蒙羞。"
 GOE_RAJ.51.a: "苦澀的失敗"
 GOE_RAJ.51.b: "[986.GetName]理應屬於我們。"
 GOE_RAJ.49.t: "[PAK.GetName]保留[431.GetName]"
 GOE_RAJ.49.desc: "巴基斯坦軍隊繼續控制著加爾各答。印度軍隊在激烈交戰後撤退，巴基斯坦仍然佔據該區域。印度廣播對這場失敗進行選擇性報道，以避免國家蒙羞。"
 GOE_RAJ.49.a: "苦澀的失敗"
 GOE_RAJ.49.b: "[431.GetName]理應屬於我們。"
 GOE_RAJ.50.t: "[PAK.GetName]保留[433.GetName]"
 GOE_RAJ.50.desc: "巴基斯坦軍隊繼續控制著[433.GetName]。印度軍隊在激烈交戰後撤退，巴基斯坦仍然佔據該區域。印度廣播對這場失敗進行選擇性報道，以避免國家蒙羞。"
 GOE_RAJ.50.a: "苦澀的失敗"
 GOE_RAJ.50.b: "[433.GetName]理應屬於我們。"
 GOE_RAJ_famine.1.t: "[?global.famine_state.GetName]爆發褐斑病"
 GOE_RAJ_famine.1.desc: "在[?global.famine_state.GetName]檢測到了褐斑病。官員們擔心這種真菌病會進一步傳播，影響冬季收成。"
 GOE_RAJ_famine.1.a: "糟了"
 GOE_RAJ_famine.2.t: "氣旋襲擊[?global.famine_state.GetName]"
 GOE_RAJ_famine.2.desc: "數場風暴之後，一場大型氣旋襲擊了[?global.famine_state.GetName]，不僅造成了大範圍破壞，還使褐斑病擴散到更廣闊的區域，進一步加劇了真菌的影響。"
 GOE_RAJ_famine.2.a: "這肯定結束了吧"
 GOE_RAJ_famine.3.t: "不可靠的收成預測"
 GOE_RAJ_famine.3.desc: "政府預測今年的作物產量將出現大幅下滑。眾所周知，這種預測在過去就沒準過。"
 GOE_RAJ_famine.3.a: "希望他們又錯了"
 GOE_RAJ_famine.4.t: "省份間的貿易壁壘"
 GOE_RAJ_famine.4.desc: "出於對食物價格上漲的擔憂，印度各省份和土邦開始建立貿易壁壘。隨著省份間變得越來越孤立，這些貿易壁壘有可能進一步推高食物價格。"
 GOE_RAJ_famine.4.a: "食物銷售網絡正在被切斷"
 GOE_RAJ_famine.5.t: "[?global.famine_state.GetName]的價格混亂"
 GOE_RAJ_famine.5.desc: "隨著糧食價格上漲，地方政府試圖通過管控物價來幫助當地居民。但這只是讓大量糧食消失在黑市裡，或者儲存在大型倉庫裡。\n當地政府已經放寬了限制，但人們仍然普遍認為糧食嚴重短缺，導致通貨膨脹猖獗。"
 GOE_RAJ_famine.5.a: "事情變得更糟了"
 GOE_RAJ_famine.6.t: "[?global.famine_state.GetName]的優先分配"
 GOE_RAJ_famine.6.desc: "當地政府通過了一項計劃，決定優先向對重工業十分重要，且支持西方價值觀和現代化的中上層階級提供基本物資。這進一步抬高了食物價格。"
 GOE_RAJ_famine.6.a: "……"
 GOE_RAJ_famine.7.t: "[?global.famine_state.GetName]的饑荒"
 GOE_RAJ_famine.7.desc: "[?global.famine_state.GetName]爆發了大規模內亂。基礎物資缺乏迫使大量農村人口擠入人滿為患的城市尋求幫助。\n隨著犯罪團伙開始形成並互相攻擊，情況迅速失控。"
 GOE_RAJ_famine.7.a: "這可不太妙"
 GOE_RAJ_famine.7.tt: "§Y除非採取預防措施，否則饑荒每個月都有可能向相鄰地區蔓延\n解鎖饑荒決議類別§!"
 GOE_RAJ_famine.9.t: "[FROM.Getname]請求饑荒援助"
 GOE_RAJ_famine.9.tt: "激活§Y饑荒§!決議"
 GOE_RAJ_famine.9.desc: "[FROM.Getname]正面臨饑荒，形勢日益惡化。政府向國際社會乞求援助，以緩解饑荒造成的破壞。"
 GOE_RAJ_famine.9.a: "抱歉老弟。我們給不了任何東西"
 GOE_RAJ_famine.9.b: "我們會送去大量援助"
 GOE_RAJ_famine.9.c: "我們會送去少量援助"
 GOE_RAJ_famine.10.t: "[FROM.GetName]拒絕援助我們"
 GOE_RAJ_famine.10.desc: "[FROM.GetName]告知我們不會提供任何援助，宣稱他們在這種全球性危機中對我們不負有任何義務。"
 GOE_RAJ_famine.10.a: "冷血的蠢貨"
 GOE_RAJ_famine.11.t: "[FROM.GetName]提供大量援助"
 GOE_RAJ_famine.11.desc: "[FROM.GetName]慷慨地提供了大量援助，幫助我們緩解饑荒，阻止其向相鄰地區蔓延。"
 GOE_RAJ_famine.11.a: "太好了！"
 GOE_RAJ_famine.12.t: "[FROM.GetName]提供少量援助"
 GOE_RAJ_famine.12.desc: "[FROM.GetName]提供了少量援助，幫助我們緩解饑荒，阻止其向相鄰地區蔓延。雖然他們肯定能做得更多，但總比沒有好。"
 GOE_RAJ_famine.12.a: "不錯！"
 GOE_RAJ_famine.13.t: "[?global.famine_state.GetName]饑荒逐漸結束"
 GOE_RAJ_famine.13.desc: "饑荒最嚴重的階段似乎已經過去了。豐收緩解了折磨，糧價正在下跌。雖然恢復正常需要一段時間，但這是治癒該地區的第一步。\n面對這場巨大的悲劇，我們必須捫心自問，勝利的真正代價是什麼？"
 GOE_RAJ_famine.13.a: "以人民的苦難換來的勝利"
 goe_japan.1.t: "鮑斯希望支援緬甸戰役"
 goe_japan.1.desc: "印度國民軍領袖蘇巴斯·錢德拉·鮑斯與我們接觸，並表示他的部隊已準備好協助我們進攻[BRM.GetName]。他認為這是將印度從[ENG.GetAdjective]統治中解放出來的第一步，通過進攻緬甸，我們可以削弱英屬印度。他的部下是堅定的民族主義者，其對地形的瞭解極其寶貴。我們要接受嗎？"
 goe_japan.1.a: "當然"
 goe_japan.1.b: "不"
 #FAMINE
 RAJ_famine_scripted_timeframe_reveal: "[GetFamineTimeframe]\n$RAJ_famine_prevention_stats$"
 RAJ_famine_scripted_timeframe_reveal_desc: "我們已確定饑荒還會持續§Y[?RAJ_famine_spread_times]§!個月。"
 RAJ_famine_scripted_timeframe_non_reveal_desc: "我們預計饑荒還會持續§Y[?RAJ_famine_spread_times_min]§!-§Y[?RAJ_famine_spread_times_max]§!個月。"
 RAJ_famine_risk_scripted_gui_desc: "預防措施阻止飢荒蔓延的概率：§G[?RAJ_famine_shield]%§!\n饑荒蔓延的概率：§R[?RAJ_famine_spreads]%§!"
 RAJ_famine_prevention_stats: "我們的預防措施已\n-阻止飢荒蔓延：§Y[?RAJ_times_shield_has_blocked_spread]§!次\n-降低饑荒時間：§Y[?RAJ_famine_reduction_from_shield]§!個月"
 RAJ_famine_shield_tt: "預防措施阻止飢荒蔓延的概率：§G+$RIGHT|0$%§!"
 #Raj Partition
 RAJ_partition_1.t: "[FROM.GetName]的抗議演變為暴力"
 RAJ_partition_1.desc: "一開始只是民眾的抗議，但隨著地方警察與示威群眾爆發衝突，這場抗議升級為了暴力。[ENG.GetAdjective]警察宣稱他們先遭受了暴力威脅才採取行動，而抗議者建成他們恪守了非暴力原則。\n沒有人死亡，但有兩名警察受了輕傷，另有一名抗議者腦震盪後被送往當地醫院。"
 RAJ_partition_1.a: "不可接受"
 GOE_RAJ_partition.2.t: "[?unrest_target_state.GetName]的廣泛抗議"
 GOE_RAJ_partition.2.desc: "[?unrest_target_state.GetName]爆發了反對[ENG.GetAdjective]統治的抗議，當地執法部門報告稱，示威者與當局之間的暴力衝突不斷升級。"
 GOE_RAJ_partition.2.a: "警察決不能動手"
 GOE_RAJ_partition.2.b: "驅散人群"
 GOE_RAJ_partition.3.t: "[?unrest_target_state.GetName]發生暴動"
 GOE_RAJ_partition.3.desc: "[?unrest_target_state.GetName]的緊張局勢達到了臨界點，當地警察已難以控制越來越不安分的民眾。與政府有關的工廠稱為了煽動者的主要目標，在不斷升級的騷亂中頻繁遭受破壞。"
 GOE_RAJ_partition.3.a: "部署國民警衛隊"
 GOE_RAJ_partition.3.b: "試著調解煽動者"
 GOE_RAJ_partition.4.t: "宗教暴力"
 GOE_RAJ_partition.4.desc: "隨著獨力呼聲越來越響，一個越來越深的分歧出現了。堅決維護統一印度的印度教徒與穆斯林的矛盾日益尖銳，後者擔心在印度教徒佔多數的國家會被邊緣化，於是呼籲與前者分治。不斷升級的緊張局勢引發了兩個社群中極端主義者的暴力衝突，嚴重破壞了國家的穩定。"
 GOE_RAJ_partition.4.a: "這是我們的錯？"
 GOE_RAJ_partition.4.b: "緩和緊張局勢"
 GOE_RAJ_partition.4.c: "囚禁煽動者"
 GOE_RAJ_partition_become_free_to_stop_the_chaos_tt: "可以預見，在獲得獨立之前，不穩定會一直持續"
 GOE_RAJ_partition.5.t: "印度教徒與穆斯林的矛盾"
 GOE_RAJ_partition.5.desc: "隨著越來越多[GetRajName]穆斯林呼籲與印度分治，印度教民族主義者走上街頭抗議穆斯林在該國逐漸增長的影響力，而這經常會導致暴力衝突。"
 GOE_RAJ_partition.5.a: "形勢正在發展……"
 GOE_RAJ_partition.5.b: "加強警備"
 GOE_RAJ_partition.6.t: "命運的約定"
 GOE_RAJ_partition.6.desc: "我們多年前與命運相約，如今兌現諾言之時已至。雖未十全十美、盡如人意，但已是實實在在的兌現了。在午夜鐘聲敲響之際，世界沉睡之時，印度將為獲得新生和自由徹夜不眠。這是自古以來罕見的時刻；這是我們辭舊迎新的時刻；這是一個時代結束的時刻；這是長期受制的民族心靈終於解放的時刻。"
 GOE_RAJ_partition.6.a: "無論信仰何種宗教，我們都是印度的子民。"
 GOE_RAJ_partition.7.t: "領導權問題"
 GOE_RAJ_partition.7.desc: "我們國家被征服的篇章已經翻過，新的自主篇章開啟了。"
 GOE_RAJ_partition.7.a: "尼赫魯是顯而易見的選擇"
 GOE_RAJ_partition.7.b: "付出甚多的男人，甘地"
 GOE_RAJ_partition.7.c: "應該給真納一個機會"
 GOE_RAJ_partition.7.d: "路易斯·蒙巴頓，我們仍需要他們的幫助"
 GOE_RAJ_partition.8.t: "甘地從暗殺中倖存"
 GOE_RAJ_partition.8.desc: "一個名叫納圖拉姆·戈德塞的男人試圖在一次多信仰禱告會上刺殺聖雄甘地，但在開槍前被總統保鏢制服。\n甘地安然無恙並被帶到了安全地點，發言人稱，他對這場磨難感到震驚，似乎對世界的未來以及他在其中的地位進行了深入思考。"
 GOE_RAJ_partition.8.a: "他在黑暗的深淵中看到了什麼？"
 GOE_RAJ_partition.9.t: "[ENG.GetName]準備介入"
 GOE_RAJ_partition.9.desc: "[ENG.GetName]對印度次大陸的紛爭表達了深切關注。其政府已向我們明確表示，不願看到兩國捲入血腥的戰爭，並且會在有必要時以武力介入。"
 GOE_RAJ_partition.9.a: "我們時間有限"
 GOE_RAJ_partition.10.t: "印度次大陸的戰爭"
 GOE_RAJ_partition.10.desc: "戰爭已在印度次大陸爆發。鑑於我們對兩國都一樣相當大的影響力，也許我們應該介入，結束這種瘋狂。"
 GOE_RAJ_partition.10.a: "我們沒有時間"
 GOE_RAJ_partition.10.b: "我們需要結束它"
 #Loyalist Branch
 GOE_RAJ_partition.11.desc: "多年來，[RAJ.GetNameDef]一直由來自帝國當局的官員主導治理。但隨著自治呼聲日益高漲，我們亟需建立新的印度議會。這將使本土領袖在塑造國家方面發揮作用，同時確保國家仍將帝國利益置於考量。話雖如此，我們必須決定由誰來領導這個新政府。"
 GOE_RAJ_loyalist.01.t: "[FROM.GetAdjective]向英聯邦出口"
 GOE_RAJ_loyalist.01.desc: "今日我們帶來好消息。[RAJ.GetNameDef]的領導者向我們提出一項提案，希望增加從[RAJ.GetNonIdeologyName]銷往其餘英聯邦的主要商品的生產與出口。隨著[RAJ.GetNameDef]證明其對我們富饒領地的價值，我們可以預見，我們的倉庫將堆滿印度茶葉、棉花和黃麻。"
 GOE_RAJ_loyalist.01.a: "$NSB_soviet_spanish_civil_war.4.a$"
 GOE_RAJ_loyalist.02.t: "$RAJ_the_empires_workshop$"
 GOE_RAJ_loyalist.02.desc: "經過多輪深入談判，我們已就整個英聯邦境內生產線的發展達成協議。這使我們得以在[?RAJ_crown_commodities_civ_built_flag.GetName]建立並擴建工業設施。希望此舉能增強帝國的實力，以應對日益增長的全球需求。"
 GOE_RAJ_loyalist.02.a: "$NSB_soviet_civil_war_common.126.a$"
 GOE_RAJ_loyalist.03.t: "[FROM.GetAdjective]進攻伊朗的提案"
 GOE_RAJ_loyalist.03.desc: "今日上午，[RAJ.GetNameDef]當局向我們提交提案，請求批准對[PER.GetNameDef]發動全面入侵。他們列舉了多項理由，包括保護波斯走廊，以及先發制人佔領[PER.GetNameDef]的油田以免落入我們的敵人之手。這樣的入侵可能招致國際社會不滿，但拒絕其中的利益顯然不算明智。我們該如何應對？"
 GOE_RAJ_loyalist.03.a: "這場戰爭可能對我們有利。批准。"
 GOE_RAJ_loyalist.03.b: "與[PER.GetNameDef]開戰？不了，這風險太大。"
 GOE_RAJ_loyalist.04.t: "[FROM.GetNameDefCap]同意開戰"
 GOE_RAJ_loyalist.04.desc: "我們駐[ENG.GetNameDef]的使者傳來好消息。[ENG.GetAdjective]政府已允許我們策劃對[PER.GetNameDef]的入侵行動。在帝國當局許可下，我們必須集結軍隊並準備好開戰。"
 GOE_RAJ_loyalist.04.a: "我們向[PER.GetNameDef]進軍。"
 GOE_RAJ_loyalist.05.t: "[FROM.GetNameDefCap]要求我們撤軍"
 GOE_RAJ_loyalist.05.desc: "很遺憾，我們入侵[PER.GetNameDef]的請求未獲採納。帝國當局已決定不展開任何軍事行動。儘管我們可能持有異議，但謹慎起見，我們應該遵循[ENG.GetAdjective]政府的命令。"
 GOE_RAJ_loyalist.05.a: "我們必須遵從帝國當局的意願。"
 GOE_RAJ_loyalist.06.t: "東南亞指揮部"
 GOE_RAJ_loyalist.06.desc: "隨著東南亞戰區的設立，我們正面臨抉擇。我們可用於此次行動的資源有限，必須決定集中力量支持哪些方面，以配合[ENG.GetNameDef]的戰爭部署。"
 GOE_RAJ_loyalist.06.a: "我們必須增加國防軍費。"
 GOE_RAJ_loyalist.06.b: "我們應該專注於進攻能力。"
 GOE_RAJ_loyalist.06.c: "[RAJ.GetAdjective]空軍需要支持。"
 GOE_RAJ_loyalist.06.d: "讓我們升級海軍。"
 GOE_RAJ_loyalist.07.t: "保衛馬來亞"
 GOE_RAJ_loyalist.07.desc: "以保護的名義，[FROM.GetNameDefCap]提議將[event_target:RAJ.RAJ_annexing_country_target.GetName]置於[FROM.GetAdjective]的管轄之下，以確保其防衛力量得到發展。儘管這種情況對我們的主權而言並非理想，但我們只能假定這只是一項臨時措施。至少，我們希望如此。"
 GOE_RAJ_loyalist.07.a: "我們絕不能允許他們這麼做。"
 GOE_RAJ_loyalist.07.b: "我們必須都得為我們的防衛做出犧牲。"
 GOE_RAJ_loyalist.77.t: "保衛緬甸"
 GOE_RAJ_loyalist.08.desc: "以保護的名義，[FROM.GetNameDefCap]提議將[event_target:RAJ.RAJ_annexing_country_target.GetName]置於[FROM.GetAdjective]的管轄之下，以確保其防衛力量得到發展。儘管這種情況對我們的主權而言並非理想，但我們只能假定這只是一項臨時措施。至少，我們希望如此。"
 GOE_RAJ_loyalist.08.a: "$GOE_RAJ_loyalist.07.a$"
 GOE_RAJ_loyalist.08.b: "$GOE_RAJ_loyalist.07.b$"
 GOE_RAJ_loyalist.09.t: "[FROM.GetNameDefCap]拒絕了我們的防禦計劃"
 GOE_RAJ_loyalist.09.desc: "遺憾的是，儘管我們盡了最大努力，[FROM.GetNameDef]還是拒絕了我們的保護提議。看來我們的防禦計劃不足以吸引他們接受我們的庇護。"
 GOE_RAJ_loyalist.09.a: "那就這樣吧。"
 GOE_RAJ_loyalist.10.t: "[FROM.GetNameDefCap]將[event_target:RAJ.RAJ_annexing_country_target.GetName]移交我方管轄"
 GOE_RAJ_loyalist.10.desc: "好消息！[FROM.GetNameDefCap]已同意允許我們在其領土駐紮部隊，並共同保護其土地免受外國入侵。這將極大助力我們的軍事行動。"
 GOE_RAJ_loyalist.10.a: "很好。開始行動。"
 GOE_RAJ_loyalist.11.t: "$RAJ_the_jewel_becomes_the_crown$"
 GOE_RAJ_loyalist.11.desc: "對[ENG.GetAdjective]帝國而言，這是黑暗的一天。[ENG.GetNameDef]淪陷後，我們處於一個極為特殊的位置，能夠收留其流亡政府。這在一定程度上得益於我們重申了對帝國當局的忠誠。$ENG_winston_churchill$正在竭盡所能領導[ENG.GetNameDef]，現在我們必須決定他在[RAJ.GetNameDef]的職位安排。"
 GOE_RAJ_loyalist.11.a: "$ENG_winston_churchill$應該領導[RAJ.GetNameDef]。"
 GOE_RAJ_loyalist.11.b: "丘吉爾最適合擔任顧問。"
 GOE_RAJ_loyalist.11.c: "[RAJ.GetNameDef]不歡迎丘吉爾。"
 GOE_RAJ_loyalist.12.t: "$ENG_winston_churchill$逃離[ENG.GetNameDef]"
 GOE_RAJ_loyalist.12.desc: "在這危難之際，我們仍存有希望。儘管我們已經停止抵抗，$ENG_winston_churchill$卻成功逃離不列顛群島並抵達[RAJ.GetNameDef]。他將在這裡指揮作戰，繼續維護[ENG.GetAdjective]的利益，直到我們收復祖國。"
 GOE_RAJ_loyalist.12.a: "別了，$ENG_winston_churchill$。"
 GOE_RAJ_loyalist.13.t: "$ENG_winston_churchill$迴歸"
 GOE_RAJ_loyalist.13.desc: "隨著故土重歸掌控，我們得以重建原先的內閣。$ENG_winston_churchill$已從[RAJ.GetNameDef]順利歸來，是時候決定我們接下來該如何行事了。"
 GOE_RAJ_loyalist.13.a: "$ENG_winston_churchill$應該重新出任首相。"
 GOE_RAJ_loyalist.13.b: "我們不再需要他的服務。"
 GOE_RAJ_loyalist.14.t: "將[BRM.GetAdjective]$state_resource_tungsten$交給[FROM.GetName]"
 GOE_RAJ_loyalist.14.desc: "今天早上我們接待了[FROM.GetNameDef]的使者。該國政府請求獲得開採[288.GetName]地區[BRM.GetAdjective]$state_resource_tungsten$的權利，以支持其日益擴大的戰爭需求。我們必須慎重考慮如何回應這一請求。"
 GOE_RAJ_loyalist.14.a: "可以批准。"
 GOE_RAJ_loyalist.14.b: "我們已對這些資源另有安排。"
 GOE_RAJ_loyalist.15.t: "授予[288.GetName]的$state_resource_tungsten$給[RAJ.GetName]"
 GOE_RAJ_loyalist.15.desc: "我們的宗主國[OVERLORD.GetNameDef]已授予[RAJ.GetNameDef]在[288.GetName]開採$state_resource_tungsten$資源的權利，以支持其工業發展併為戰爭出力。這是我們向[OVERLORD.GetNameDef]證明我們致力於支持其在該地區利益的機會。"
 GOE_RAJ_loyalist.15.a: "很高興知道這件事。"
 GOE_RAJ_loyalist.16.t: "[FROM.GetName]授予資源開發權"
 GOE_RAJ_loyalist.16.desc: "[FROM.GetNameDefCap]已授予我們在[288.GetName]開採$state_resource_tungsten$資源的權利。這將有助於我們的軍事行動，並能以英聯邦的名義繼續戰鬥。"
 GOE_RAJ_loyalist.16.a: "真是巨大的恩惠。"
 GOE_RAJ_loyalist.17.t: "[FROM.GetName]拒絕緬甸$state_resource_tungsten$開採請求"
 GOE_RAJ_loyalist.17.desc: "遺憾的是，[FROM.GetNameDef]拒絕了我們在緬甸開採$state_resource_tungsten$的請求。這令人深感失望，因為該資源本可在維持我們的戰爭機器發展中發揮關鍵作用。"
 GOE_RAJ_loyalist.17.a: "真令人失望。"
 #EIC
 GOE_RAJ_eic.2.t: "任命首席執行官"
 GOE_RAJ_eic.2.desc: "公司需要堅決的領導者指引其發展，我們需要選出能使投資回報最大化的人選。這位領袖的性格會影響領導團隊的其他人，因此選對人是至關重要的。"
 GOE_RAJ_eic.2.a: "此人需要靈活"
 GOE_RAJ_eic.2.b: "此人需要節儉"
 GOE_RAJ_eic.2.c: "此人需要與政府關係良好"
 GOE_RAJ_eic.2.d: "此人需要冷酷"
 GOE_RAJ_eic.3.t: "[RAJ.GetName]要求我們接受鴉片貿易"
 GOE_RAJ_eic.3.desc: "[FROM.GetName]要求我們放開兩國間的鴉片貿易。如果民眾願意為鴉片花錢，那我們有什麼資格剝奪他們應有的消費權呢？這在道德上或許有錯，對個人或許有害，但如果他們樂意，我們有什麼資格阻止他們呢？唯一的問題是，[FROM.GetAdjective]政府也要求獲得一個條約港，以進一步傳播這種……商品。"
 GOE_RAJ_eic.3.a: "他們瘋了嗎？"
 GOE_RAJ_eic.3.b: "讓藍蓮花流動起來"
 GOE_RAJ_eic.4.t: "[FROM.GetName]斷然拒絕"
 GOE_RAJ_eic.4.desc: "[FROM.GetName]斷然拒絕了我們的要求，並提醒我們他們是擁有自己法律的主權國家，我們試圖強迫他們接受要求的行為近乎褻瀆。"
 GOE_RAJ_eic.4.a: "我們試過胡蘿蔔了，現在該用大棒了"
 GOE_RAJ_eic.5.t: "[FROM.GetName]同意"
 GOE_RAJ_eic.5.desc: "[FROM.GetName]已同意兩國間進行大規模鴉片貿易。有了新獲得的條約港，我們可以直接將鴉片銷售到全世界。這種消費會讓朋友和敵人都變得親密。"
 GOE_RAJ_eic.5.a: "一份非暴力協議"
 GOE_RAJ_eic.6.t: "[RAJ.GetName]希望購買[RAJ_i_want_to_buy_this_land.GetName]"
 GOE_RAJ_eic.6.desc: "希望擴大業務的[RAJ.GetName]提議收購[RAJ_i_want_to_buy_this_land.GetName]，條件是在我國進行大量投資。"
 GOE_RAJ_eic.6.a: "我們不想賣這塊土地"
 GOE_RAJ_eic.6.a_tt: "[FROM.GetName]將無法再次要求購買該地區，但可以要求其他地區。"
 GOE_RAJ_eic.6.b: "決不"
 GOE_RAJ_eic.6.b_tt: "[FROM.GetName]將無法再要求購買我們的任何土地"
 GOE_RAJ_eic.6.c: "聽起來不錯"
 GOE_RAJ_eic.7.t: "[FROM.GetName]不願放棄土地"
 GOE_RAJ_eic.7.desc: "[FROM.GetName]不願放棄這塊土地，但不排除未來有機會時會轉讓其他土地。"
 GOE_RAJ_eic.7.a: "他們會改變主意"
 GOE_RAJ_eic.8.t: "[FROM.GetName]拒絕轉讓任何土地"
 GOE_RAJ_eic.8.desc: "[FROM.GetName]拒絕轉讓任何土地給我們，還表示僅僅提出建議就是對基本禮儀的冒犯。"
 GOE_RAJ_eic.8.a: "奇怪"
 GOE_RAJ_eic.9.t: "[FROM.GetName]同意"
 GOE_RAJ_eic.9.desc: "[FROM.GetName]同意了這筆交易。我們很快就會把錢轉給他們，而那塊土地也會轉讓給我們。"
 GOE_RAJ_eic.9.a: "划算的交易！"
 #MUGHAL EMPIRE
 GOE_RAJ_princely.1.t: "選擇一位王公領導[ROOT.GetNameDef]"
 GOE_RAJ_princely.1.desc: "巴布爾大帝開創的帝國幅員遼闊、治世仁厚，統治南亞次大陸長達數百年之久。若要繼承這份偉業，我們仍有漫漫長路。古爾卡尼家族雖枝繁葉茂，但唯有明主方能引領我們重獲榮光。"
 GOE_RAJ_princely.1.a: "米爾·奧斯曼·阿里·汗將領導帝國走向偉大"
 GOE_RAJ_princely.1.b: "米爾扎·胡爾希德·賈赫·巴哈杜爾是最合理的選擇"
 GOE_RAJ_princely.1.c: "艾哈邁德·亞爾·汗會保護我們！"
 GOE_RAJ_princely.1.d: "侯賽因·沙希德·蘇拉瓦底將帶領我們走向未來！"
 GOE_RAJ_princely.2.t: "選擇一位王公領導[ROOT.GetNameDef]"
 GOE_RAJ_princely.2.desc: "$GOE_RAJ_princely.1.desc$"
 GOE_RAJ_princely.2.a: "侯賽因·沙希德·蘇拉瓦底將帶領我們走向未來！"
 GOE_RAJ_princely.2.b: "哈里·辛格大君是人民的意願！"
 GOE_RAJ_princely.2.c: "博德·錢德拉·辛格是我們最優秀的戰略家！"
 GOE_RAJ_princely.2.d: "沒一個足夠好的"
 GOE_RAJ_princely.3.t: "選擇一位王公領導[ROOT.GetNameDef]"
 GOE_RAJ_princely.3.desc: "$GOE_RAJ_princely.1.desc$"
 GOE_RAJ_princely.3.a: "烏梅德·辛格與人民關係融洽"
 GOE_RAJ_princely.3.b: "普拉塔普·辛格·拉奧·蓋克瓦德是明顯的選擇！"
 GOE_RAJ_princely.3.c: "賈亞查馬拉金德拉·瓦迪亞爾大君是最佳人選"
 GOE_RAJ_princely.3.d: "也許我們應該重新考慮第一個列表"
 GOE_RAJ_navy.1.t: "[RAJ.GetNameDefCap]提出海軍協議"
 GOE_RAJ_navy.1.desc: "[RAJ.GetLeader]提議[RAJ.GetAdjective]和[ENG.GetAdjective]政府簽署海軍貿易協議。\n這將推動海軍生產上的雙邊合作，併為將來簽署更多貿易協議打開了大門。"
 GOE_RAJ_navy.1.a: "這對我們雙方都大有裨益！"
 GOE_RAJ_navy.1.b: "我們不感興趣"
 GOE_RAJ_navy.2.t: "[FROM.GetNameDefCap]同意！"
 GOE_RAJ_navy.2.desc: "[FROM.GetNameDefCap]官員同意並簽署了海軍協議，這對我們的進步幫助很大。"
 GOE_RAJ_navy.2.a: "完美"
 GOE_RAJ_navy.3.t: "[ENG.GetNameDefCap]拒絕簽署貿易協議"
 GOE_RAJ_navy.3.desc: "[FROM.GetNameDefCap]官員拒絕簽署我們提出的海軍協議，稱這隻對單方面有利，對他們沒有好處。"
 GOE_RAJ_navy.3.a: "真遺憾"
 GOE_RAJ_navy.4.t: "[RAJ.GetNameDefCap]請求調任海軍指揮官"
 GOE_RAJ_navy.4.desc: "[RAJ.GetNameDefCap]官員請求我們將一名海軍指揮官調至皇家印度海軍服役，以協助他們擴編和培訓新的海軍陸戰隊。這代價高昂，但他們提供了豐厚的報酬。"
 GOE_RAJ_navy.4.a: "這個犧牲是值得的"
 GOE_RAJ_navy.4.b: "我們決不會同意！"
 GOE_RAJ_navy.5.t: "[ENG.GetNameDefCap]同意！"
 GOE_RAJ_navy.5.desc: "[FROM.GetNameDefCap]官員已同意派遣一位指揮官來[RAJ.GetNameDefCap]協助我們的海軍擴建。"
 GOE_RAJ_navy.5.a: "完美"
 GOE_RAJ_navy.6.t: "[ENG.GetNameDefCap]拒絕了提議"
 GOE_RAJ_navy.6.desc: "[FROM.GetNameDefCap]官員拒絕派遣指揮官來[RAJ.GetNameDefCap]，並堅持要求我們自己訓練指揮官。"
 GOE_RAJ_navy.6.a: "真遺憾"
 GOE_RAJ_navy.7.t: "[RAJ.GetNameDefCap]請求購買我們退役的船艦"
 GOE_RAJ_navy.7.desc: "[FROM.GetLeader]請求購買我們退役的舊艦，它們目前未被使用，但[FROM.GetLeader]堅稱[FROM.GetNameDefCap]能用得上它們。他們出了一大筆錢。"
 GOE_RAJ_navy.7.a: "反正我們也用不上！"
 GOE_RAJ_navy.7.b: "我們不感興趣"
 GOE_RAJ_navy.8.t: "[ENG.GetNameDefCap]同意我們的貿易提案！"
 GOE_RAJ_navy.8.desc: "[FROM.GetLeader]同意我們購買他們的退役船艦，它們應該很快就能抵達印度。"
 GOE_RAJ_navy.8.a: "皇家印度海軍的好消息！"
 GOE_RAJ_navy.9.t: "[ENG.GetNameDefCap]拒絕了提議"
 GOE_RAJ_navy.9.desc: "[FROM.GetLeader]拒絕了我們購買船艦的提議，我們現在必須尋找替代方案來擴建海軍。"
 GOE_RAJ_navy.9.a: "真可惜"
 GOE_RAJ_navy.10.t: "[RAJ.GetNameDefCap]請求現代艦船合同"
 GOE_RAJ_navy.10.desc: "[RAJ.GetNameDefCap]官員請求購買我們的現代艦船合同，以及為皇家印度海軍開發1936年巡洋艦的權利。他們願意為此支付豐厚的報酬。"
 GOE_RAJ_navy.10.a: "雙贏的協議！"
 GOE_RAJ_navy.10.b: "我們不感興趣"
 GOE_RAJ_navy.11.t: "[ENG.GetNameDefCap]同意授予我們現代艦船合同！"
 GOE_RAJ_navy.11.desc: "[ENG.GetNameDefCap]官員回應了我們的請求，他們同意授予我們改進艦船合同，我們即將獲得五艘巡洋艦。"
 GOE_RAJ_navy.11.a: "皇家印度海軍的好消息！"
 GOE_RAJ_navy.12.t: "[ENG.GetNameDefCap]拒絕了提議"
 GOE_RAJ_navy.12.desc: "[ENG.GetNameDefCap]官員回應了我們的請求，他們拒絕授予我們改進艦船合同，稱我們的報價太低，不值得考慮。"
 GOE_RAJ_navy.12.a: "真遺憾"
 GOE_RAJ_goa.1.t: "[RAJ.GetNameDefCap]索要果阿"
 GOE_RAJ_goa.1.desc: "[RAJ.GetLeader]要求果阿迴歸。[RAJ.GetLeader]堅稱果阿是[RAJ.GetAdjective]的領土，並威脅如果我們不交出果阿就採取軍事行動。"
 GOE_RAJ_goa.1.a: "不值得發生衝突"
 GOE_RAJ_goa.1.b: "絕對不行。果阿是我們的！"
 GOE_RAJ_goa.2.t: "[FROM.GetNameDefCap]釋放果阿"
 GOE_RAJ_goa.2.desc: "[FROM.GetLeader]決定放下此事，允許我們吞併果阿以防止衝突。"
 GOE_RAJ_goa.2.a: "果阿是我們的！"
 GOE_RAJ_goa.3.t: "[FROM.GetNameDefCap]拒絕移交果阿"
 GOE_RAJ_goa.3.desc: "[FROM.GetLeader]回應了我們的要求，儘管我們做出軍事威脅，他們還是拒絕了我們對果阿的權利。"
 GOE_RAJ_goa.3.a: "這意味著戰爭！"
 GOE_RAJ_goa.3.b: "轉念一想，還是退一步吧"
 GOE_RAJ_goa.4.t: "[RAJ.GetNameDefCap]退讓"
 GOE_RAJ_goa.4.desc: "[RAJ.GetLeader]對我們的軍事行動威脅做出了回應，[RAJ.GetAdjective]士兵已從果阿撤離。"
 GOE_RAJ_goa.4.a: "太好了"
 GOE_RAJ_generals.1.t: "殖民地士兵交流"
 GOE_RAJ_generals.1.desc: "[RAJ.GetLeader]請求派遣[RAJ.GetAdjective]軍隊來到[ENG.GetNameDefCap]接受英國士兵的訓練，並給出了豐厚的報酬。"
 GOE_RAJ_generals.1.a: "當然可以！"
 GOE_RAJ_generals.1.b: "我們沒興趣"
 GOE_RAJ_generals.2.t: "[ENG.GetNameDefCap]同意！"
 GOE_RAJ_generals.2.desc: "[ENG.GetLeader]回應了我們的提議，同意我們派遣軍隊到[ENG.GetNameDefCap]。"
 GOE_RAJ_generals.2.a: "非常好！"
 GOE_RAJ_generals.3.t: "[ENG.GetNameDefCap]拒絕了我方提議"
 GOE_RAJ_generals.3.desc: "[ENG.GetLeader]回應了我們的提議，表示他們不感興趣。"
 GOE_RAJ_generals.3.a: "真遺憾"
 GOE_RAJ_generals.4.t: ""
 GOE_RAJ_generals.4.desc: ""
 GOE_RAJ_generals.4.a: ""
 GOE_RAJ_generals.4.b: ""
 GOE_RAJ_generals.5.t: ""
 GOE_RAJ_generals.5.desc: ""
 GOE_RAJ_generals.5.a: ""
 GOE_RAJ_generals.6.t: ""
