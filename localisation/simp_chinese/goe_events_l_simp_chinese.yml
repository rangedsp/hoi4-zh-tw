 GOE_RAJ_generals.6.a: ""
 GOE_RAJ_generals.7.t: "[RAJ.GetNameDefCap]請求購買補給"
 GOE_RAJ_generals.7.desc: "[RAJ.GetLeader]請求從[ENG.GetAdjective]民用工廠購買補給裝備。促成這些貿易我們可以獲得豐厚的佣金。"
 GOE_RAJ_generals.7.a: "雙贏的協議！"
 GOE_RAJ_generals.7.b: "我們沒興趣"
 GOE_RAJ_generals.8.t: "[ENG.GetNameDefCap]同意！"
 GOE_RAJ_generals.8.desc: "[ENG.GetLeader]回應了我們的提議，同意我們購買他們的補給裝備。"
 GOE_RAJ_generals.8.a: "非常好！"
 GOE_RAJ_generals.9.t: "[ENG.GetNameDefCap]拒絕了我方提議"
 GOE_RAJ_generals.9.desc: "[ENG.GetLeader]回應了我們的提議，表示他們不感興趣。"
 GOE_RAJ_generals.9.a: "真遺憾"
 GOE_RAJ_transfered_commander_tt: "轉移至[RAJ.GetNameDefCap]"
 #NEWS
 GOE_RAJ_news.1.t: "[?event_target:EIC_FORMER.GetAdjective]東印度公司捲土重來"
 GOE_RAJ_news.1.desc: "隨著[RAJ.GetNonIdeologyName]的緊張局勢持續升級，[?event_target:EIC_FORMER.GetNonIdeologyName]將如何穩定該地區，已成為其議會內部討論的關鍵點。今天上午，[?event_target:EIC_FORMER.GetLeader]發表講話，宣佈[?event_target:EIC_FORMER.GetLeader.GetHerHis]計劃在[429.GetName]建立一個新的公司制國家，以促進[RAJ.GetNonIdeologyName]和[?event_target:EIC_FORMER.GetNonIdeologyName]的經濟增長。[?event_target:EIC_FORMER.GetLeader.GetSheHeCap]聲稱，該國將獨立於王室運作，但仍將通過稅收在經濟上與[?event_target:EIC_FORMER.GetNonIdeologyName]聯繫在一起。[?event_target:EIC_FORMER.GetSheHeCap]將其描述為“19世紀東印度公司的精神繼承者”。\n\n[?event_target:EIC_FORMER.GetLeader]表示，雖然這可能會導致暫時的混亂和更高的不穩定，但它將為新的經濟安全和該地區的逐步穩定鋪平道路。"
 GOE_RAJ_news.1.a: "第二次一定行。"
 GOE_RAJ_news.2.t: "皇家印度海軍的兵變"
 GOE_RAJ_news.2.desc: "在[RAJ.GetNonIdeologyName]境內迅速蔓延的共產主義情緒於今日達到了關鍵轉折點，皇家印度海軍發動兵變，導致本已虛弱的殖民政府失去了對[RAJ.GetNonIdeologyName]所剩無幾的影響力。因此，由[RAJ.GetLeader]領導的印度人民共和國宣佈成立。\n\n為了避免不可避免的衝突，[RAJ.GetLeader]已經達成了關於[PAK.GetAdjective]自治的協議，併成立由[PAK.GetLeader]領導的[PAK.GetAdjective]獨立國家，同時兩國立即生效停戰協議。"
 GOE_RAJ_news.2.a: "印度已徹底陷落。"
 GOE_RAJ_news.3.t: "英屬印度的喪鐘"
 GOE_RAJ_news.3.desc: "數年前，[?event_target:EIC_FORMER.GetNonIdeologyName]為穩定[RAJ.GetAdjective]日益衰退的經濟，決定對[RAJ.GetNonIdeologyName]的東印度公司進行改革。鑑於[?event_target:EIC_FORMER.GetAdjective]經濟學家普遍認為此舉成效顯著，[?event_target:EIC_FORMER.GetAdjective]政府宣佈即日起將土邦治下的剩餘領土移交給[RAJ.GetNameDefCap]。隨著土邦行政體系的撤銷，[RAJ.GetNameDefCap]將全面接管整個次大陸的管轄事務。"
 GOE_RAJ_news.3.a: "富有前途。"
 currentStateResistance: "  當前抵抗度為§R[?var:THIS.resistance|1]%§!。"
 currentStateCompliance: "  當前順從度為§Y[?var:THIS.compliance|1]%§!。"
 GOE_RAJ_news.4.t: "印度斯坦統一"
 GOE_RAJ_news.4.desc: "據報道，[FROM.GetNameDef]的[FROM.GetLeader]宣佈了印度次大陸所有民族的統一，這標誌著亞洲和全世界歷史的新篇章。許多分析人士表示，印度斯坦的統一可能會對世界政治產生巨大影響，意味著一個新的超級大國的崛起。"
 GOE_RAJ_news.4.a: "確實是新的超級大國"
 GOE_RAJ_news.4.b: "可怕"
