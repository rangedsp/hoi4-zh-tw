 basic_ship_hull_carrier: "1936航空母艦船體"
 early_carrier: "早期航空母艦（航空母艦 I型）"
 basic_carrier: "基礎航空母艦 II型"
 improved_destroyer: "改進型驅逐艦 III型"
 basic_dp_light_battery: "基礎高平兩用炮"
 basic_dp_light_battery_desc: "將反艦炮與防空炮合併於同一炮座上，可以提高靈活性並減輕重量。\n\n安裝這一模塊可以提高§Y$EQUIPMENT_DESIGNER_LG_ATTACK_ICON_TOOLTIP$§!，有助於攻擊敵方§Y屏衛艦§!。這些模塊也有助於提高§Y$EQUIPMENT_DESIGNER_ANTI_AIR_ATTACK_ICON_TOOLTIP$§!。\n安裝一個§Y副炮§!模塊可以使§Y$ship_hull_cruiser$§!、§Y$ship_hull_carrier$§!或§Y$ship_hull_heavy$§!進行少量的§Y$EQUIPMENT_DESIGNER_LG_ATTACK_ICON_TOOLTIP$§!，並允許其攻擊第二個目標。"
 improved_dp_light_battery: "改進型高平兩用炮"
 improved_dp_light_battery_desc: "全封閉動力式雙聯裝炮座可以大大增加火力和防護，同時減輕重量。\n\n安裝這一模塊可以提高§Y$EQUIPMENT_DESIGNER_LG_ATTACK_ICON_TOOLTIP$§!，有助於攻擊地方§Y屏衛艦§!。這些模塊也有助於提高§Y$EQUIPMENT_DESIGNER_ANTI_AIR_ATTACK_ICON_TOOLTIP$§!。\n安裝一個§Y副炮§!模塊可以使§Y$ship_hull_cruiser$§!、§Y$ship_hull_carrier$§!或§Y$ship_hull_heavy$§!進行少量的§Y$EQUIPMENT_DESIGNER_LG_ATTACK_ICON_TOOLTIP$§!，並允許其攻擊第二個目標。"
 advanced_dp_light_battery: "先進型高平兩用炮"
 advanced_dp_light_battery_desc: "自動式快速射擊封閉炮座模塊可以極大提升火力輸出。\n\n安裝這一模塊可以提高§Y$EQUIPMENT_DESIGNER_LG_ATTACK_ICON_TOOLTIP$§!，有助於攻擊地方§Y屏衛艦§!。這些模塊也有助於提高§Y$EQUIPMENT_DESIGNER_ANTI_AIR_ATTACK_ICON_TOOLTIP$§!。\n安裝一個§Y副炮§!模塊可以使§Y$ship_hull_cruiser$§!、§Y$ship_hull_carrier$§!或§Y$ship_hull_heavy$§!進行少量的§Y$EQUIPMENT_DESIGNER_LG_ATTACK_ICON_TOOLTIP$§!，並允許其攻擊第二個目標。"
 basic_dp_medium_battery: "先進中型高平兩用炮"
 basic_dp_medium_battery_desc: "自動裝填快速射擊式中型封閉炮座可以極大提升火力輸出。\n\n安裝一個§Y輕中型炮組§!模塊可以提高§Y$EQUIPMENT_DESIGNER_LG_ATTACK_ICON_TOOLTIP$§!，有助於攻擊地方§Y屏衛艦§!。這些模塊也有助於提高§Y$EQUIPMENT_DESIGNER_ANTI_AIR_ATTACK_ICON_TOOLTIP$§!。"
 armored_train: "$train_equipment_3$"
 railway_gun: "$railway_gun_equipment_1$"
 basic_train: "$train_equipment_1$"
 special_forces_doctrine: "特種部隊學說"
 special_forces_doctrine_folder: "特種部隊學說"
 special_forces_doctrine_folder_desc: "我們特種部隊的訓練方式。"
 MOUNTAINEERS_DOCTRINE_LABEL: "山地步兵"
 MARINES_DOCTRINE_LABEL: "海軍陸戰隊"
 PARATROOPERS_DOCTRINE_LABEL: "空降兵"
 MOUNTAINEERS_DOCTRINE_DESC: "著重軍事關注於習慣惡劣地形的兵團將使我們在機動和拒止對手方面具有優勢。"
 MARINES_DOCTRINE_DESC: "一支強大的海軍陸戰隊會讓敵軍對海岸線四處提心吊膽。我們的精銳海軍陸戰隊擅長在惡劣的環境和最猛烈的炮火下作戰。"
 PARATROOPERS_DOCTRINE_DESC: "空降突擊是戰爭的未來。重視空降兵能給我們帶來空中力量和地面攻擊的完美協同。"
 RANGERS_DOCTRINE_LABEL: "遊騎兵"
 RANGERS_DOCTRINE_DESC: "利用密林大規模作戰方針，我軍可包抄殲滅敵軍。"
 special_forces_mountaineers: "重視山地步兵"
 special_forces_mountaineers_desc: "惡劣的環境和激烈的衝突吸引著最堅韌的士兵加入我們的精銳部隊。將他們的首要地位奉為我們的學說哲學，確保我們將繼續從招聘最優秀的人才中受益。"
 special_forces_paratroopers: "重視空降兵"
 special_forces_paratroopers_desc: "沒有什麼比看到一千架滿載部隊、遮天蔽日的運輸機更恐怖。我們的學說理論必須利用空降兵給敵人施加恐懼和震撼。"
 special_forces_marines: "重視海軍陸戰隊"
 special_forces_marines_desc: "海軍陸戰隊生來就是為了在他人望而卻步處戰鬥。無論是國內海岸或是國外氣候，這些專家擅長滲透和兩棲作戰。我們的軍事學說應該以涉及廣泛、精巧靈活的理論為核心。"
 special_forces_rangers: "升級游擊隊"
 special_forces_rangers_desc: "輕步兵乃我軍制勝之本。神射手的傳統與滲透戰術，理應成為鍛造精英部隊的基石。"
 ski_troops: "寒冷天氣專家"
 ski_troops_desc: "寒冷天氣專家對我們的戰場戰術至關重要。通過在軍事章程中正式承認這些專家，我們就可以劃出資源和訓練來進一步提升他們。"
 special_forces_recon: "戰場情報"
 special_forces_recon_desc: "我們的精銳軍團受益於首屈一指的反制情報和戰場感知。額外的培訓肯定會使我們進一步受益。"
 gwtank: "一戰坦克"
 basic_light_tank: "輕型坦克 I型"
 armored_car1: "$gw_armored_car_equipment$"
 armored_car2: "$armored_car_equipment_1$"
 armored_car3: "$armored_car_equipment_2$"
 mountaineers_combat_1: "守住防線"
 mountaineers_combat_1_desc: "我們的精銳部隊必須集中力量堅守擅長的地區。將伏擊戰術和改進的兵團組織相結合，可以確保我們的特種部隊對入侵部隊具有顯著的縱深防禦能力。"
 mountaineers_combat_2: "山地火炮"
 mountaineers_combat_2_desc: "山地炮兵團是專門為我們的精銳師提供快速遠程支援而設計的部隊，他們在困難的地形上訓練和作戰。他們的存在大大提高了我們特種部隊的作戰能力。"
 mountaineers_combat_3: "協同作戰訓練"
 mountaineers_combat_3_desc: "雖然我們的精銳軍團在高度獨立的基礎上運作，但通過在訓練方案中增加對協同作戰行動的關注，可以提高他們在戰場上的效能。"
 mountaineers_keystone_1: "武裝力量骨幹"
 mountaineers_keystone_1_desc: "我們精英特種部隊的成功要求我們以他們的存在為中心重新調整我們的軍事理論。"
 mountaineers_keystone_2: "共享教官"
 mountaineers_keystone_2_desc: "如果不把我們山地部隊已經掌握的這些知識運用到我們特種部隊的其他分支中，那簡直愚蠢至極。我們將實行教官輪崗計劃，以期提高我們的整個機構的知識。"
 paras_dispersed_drop: "偵查破襲"
 paras_dispersed_drop_desc: "我們的行動性質要求我們的空降部隊精通高度分散的空投，以期在敵人意識到我們的存在之前進行重大破壞。"
 paras_combat_drop: "戰鬥穿插"
 paras_combat_drop_desc: "直接強行介入戰術雖然危險，但在此方面訓練我們的精英部隊可以結合常規突擊帶來顯著的戰鬥優勢。"
 SF_PARAS_combat_effect_tt: "我們§H傘降§!地區內的敵軍師§H組織度§!將降低。\n\n$PARA_EFFECT_TIMER$"
 SF_PARAS_sabotage_effect_tt: "我方§H傘降§!到敵方控制的地區內的§H軍用工廠§!、§H民用工廠§!和§H基礎設施§!將受到損傷。\n\n$PARA_EFFECT_TIMER$"
 PARA_EFFECT_TIMER: "該效果每§H30§!天在每個地區施加一次。"
 paras_airborne_light_armor: "空降裝甲"
 paras_airborne_light_armor_desc: "一些輕型坦克可以藉助重型滑翔機進行空投。這種新穎的戰鬥插入方法可能有些名不見經傳，但可以為我們提供新的機會。"
 paras_bonus_2: "戰略空運部隊"
 paras_bonus_2_desc: "建立一個專司空運管理的機構意味著我們可以依照特定空降介入目的針對性地調整我們的貨機。"
 paras_combat_1: "空降通訊"
 paras_combat_1_desc: "我們後方部隊的完美通訊線路無與倫比。訓練通訊連的空中穿插本領，這樣我們即使在最惡劣的條件下也能保有這些關鍵的通信能力。"
 paras_combat_2: "空降醫療分隊"
 paras_combat_2_desc: "我們的空降行動規模已經擴大到甚至連基本的醫療設備也必須為空降行動做好準備的程度。"
 paras_bonus_1: "增強導航訓練"
 paras_bonus_1_desc: "即使最好的投送也有可能偏航。我們必須確保部隊在臨時導航方面得到良好的訓練。"
 paras_keystone_1: "精益求精"
 paras_keystone_1_desc: "只有那些久經沙場的老兵才應該被考慮加入我們的空降營。雖然這可能會減少我們招兵的來源，但在戰場上肯定大有裨益。"
 paras_keystone_2: "武裝力量骨幹"
 paras_keystone_2_desc: "今後，我們的武裝力量將以空降部隊的技能和訓練為基礎。當我們來臨時必將天昏地暗，敵人必聞風喪膽。"
 rangers_jaegers_training: "融入獵兵傳統"
 rangers_jaegers_training_desc: "輕步兵專精森林作戰，善於依託地形資源生存，擅設陷阱伏擊，射擊精準無比。"
 rangers_jungle_training: "遊騎兵叢林訓練"
 rangers_jungle_training_desc: "遊騎兵不僅能在熱帶密林中頑強生存，更能在嚴酷環境中激烈作戰，是深入敵後、常規部隊難以企及之地的利刃。"
 rangers_guerilla_doctrine: "森林游擊戰士"
 rangers_guerilla_doctrine_desc: "主動出擊與靈活機動，是攻敵制勝的關鍵。我軍遊騎兵當善用隱秘與突襲，令敵人措手不及。"
 rangers_recon_terrain_training: "偵察遊騎兵地形掌握"
 rangers_recon_terrain_training_desc: "遊騎兵戰術的一個必要前提是能夠穿越最崎嶇的地形，在敵人意想不到的地方發起攻擊。"
 rangers_fire_support_integration: "火力支援整合"
 rangers_fire_support_integration_desc: "將前方觀察員與便攜式信號設備整合至遊騎兵小隊中，意味著即使是小型孤立單位也無須在沒有火炮支援的情況下作戰。"
 rangers_urban_combat: "遊騎兵城市戰專長"
 rangers_urban_combat_desc: "森林作戰與城市作戰有些相似——交戰距離短且視野有限。擅長其中一種環境的部隊經過訓練也能適應另一種作戰環境。"
 elite_rangers_doctrine: "精銳遊騎兵"
 elite_rangers_doctrine_desc: "遊騎兵乃我們武裝力量的驕傲。我們必須繼續招募最優秀的人才，令其創造更輝煌的戰績。"
 rangers_backbone_doctrine: "輕步兵專業化"
 rangers_backbone_doctrine_desc: "林地專家所積累的技藝，是全軍精英輕步兵的寶貴財富。這樣的經驗必須貫穿於所有輕步兵及精銳部隊。"
