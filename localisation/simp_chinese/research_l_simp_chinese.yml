 basic_fire_control_system_desc: "艦船上的全部火炮都將由中控系統控制，從而確保更加密集的炮火群以及更高的精準度。"
 improved_fire_control_system: "改進型火控系統"
 improved_fire_control_system_desc: "通過輸入目標的航行速度以及距離，一臺機械計算器可以準確地預測下一次火力齊射就緒時目標的準確位置。"
 advanced_fire_control_system: "先進火控系統"
 advanced_fire_control_system_desc: "大型且複雜的機械式計算機可以跟蹤多個目標，並加入周邊天氣狀況與海況等變量，以進行極其精準的彈道計算。"
 sonar: "被動聲吶"
 sonar_desc: "一組基本的聲吶可以通過探測水下目標製造出的噪音來追蹤它。\n\n在§Y輕型船艦§!和§Y巡洋艦§!的§Y電子設備槽位§!上安裝此模塊將有助於探測敵方§Y潛艇§!。"
 improved_sonar: "主動式聲吶"
 improved_sonar_desc: "使用可以調節的聲波，該系統可以精確測量到水下目標的方位與距離。\n\n在§Y輕型船艦§!和§Y巡洋艦§!的§Y電子設備槽位§!上安裝此模塊將有助於探測敵方§Y潛艇§!。"
 advanced_sonar: "先進聲吶"
 advanced_sonar_desc: "精密的水聽器陣列和主動聲吶脈衝技術顯著提升了檢測敵軍潛艇的精確度和範圍。\n\n在§Y輕型艦船§!或§Y巡洋艦§!的§Y電子設備槽位§!安裝此模塊將有助於探測敵軍§Y潛艇§!。"
 modern_sonar: "現代聲吶"
 modern_sonar_desc: "信號濾波和定向掃描技術的進步讓該新聲吶型號達到了無與倫比的精度，我們得以十分精準地捕獵敵軍潛艇。\n\n在§Y輕型艦船§!或§Y巡洋艦§!的§Y電子設備槽位§!安裝此模塊將有助於探測敵軍§Y潛艇§!。"
 smoke_generator: "煙霧發生器"
 smoke_generator_desc: "對輕中型船艦的引擎和煙囪進行一些小改造，使它們能夠製造大量能遮蔽敵人視野的煙霧。"
 depth_charges_advice_tt: "\n在§Y輕型艦艇§!和§Y巡洋艦§!上安裝一個§Y深水炸彈§!模塊將有助於攻擊敵方的§Y潛艇§!。"
 sonar_advice_tt: "\n在§Y輕型艦艇§!和§Y巡洋艦§!上安裝一個§Y聲吶§!模塊將有助於探測敵方的§Y潛艇§!。"
 basic_depth_charges: "基礎深水炸彈"
 basic_depth_charges_desc: "帶有壓敏觸發器的簡單易爆容器在到達預設的深度時會爆炸。\n\n在§Y輕型船艦§!和§Y巡洋艦§!上安裝此模塊將有助於攻擊敵方§Y潛艇§!。"
 improved_depth_charges: "深水炸彈投擲器"
 improved_depth_charges_desc: "一種設計簡單的機械裝置，可以將深水炸彈投擲到與艦船有一定距離的情況下引爆。這意味著驅逐艦不需要直接從目標上方開過就能擊中它。\n\n在§Y輕型船艦§!和§Y巡洋艦§!上安裝此模塊將有助於攻擊敵方§Y潛艇§!。"
 advanced_depth_charges: "刺蝟深彈投射器"
 advanced_depth_charges_desc: "驅逐艦甲板上的迫擊炮可以通過發射炸藥製造震波，使得艦船在整個交戰過程中可以通過聲吶接收回波來掌握敵方潛艇的位置，此舉能大大提高其準確性。\n\n在§Y輕型船艦§!和§Y巡洋艦§!上安裝此模塊將有助於攻擊敵方§Y潛艇§!。"
 modern_depth_charges: "改進型深水炸彈投擲器"
 modern_depth_charges_desc: "更多的推進藥能從一個相當遠的距離將深彈投射到大部分潛艇所在的特定深度。\n\n在§Y輕型船艦§!和§Y巡洋艦§!上安裝此模塊將有助於攻擊敵方§Y潛艇§!。"
 improved_seaplane_tender: "改進水上飛機母艦"
 improved_seaplane_tender_desc: "海上補給與回收吊機技術的進步提升了水上飛機的作業效率。\n\n為§Y驅逐艦§!安裝§Y水上飛機母艦§!模塊可增強其探測敵艦的能力。"
 seaplane_tender_advice_tt: "\n在§Y驅逐艦§!上安裝§Y水上飛機母艦§!模塊可改善探測敵軍艦船的能力。"
 improved_airplane_launcher: "改進型飛機彈射器"
 improved_airplane_launcher_desc: "改進的彈射機構允許更大更重更強的飛機從此處彈射出去，這將能增大我方大偵查範圍。\n\n在§Y巡洋艦§!和§Y重型船艦§!或特化的§Y潛艇§!上安裝此模塊將有助於探查敵艦。"
 airplane_launcher_advice_tt: "\n在§Y巡洋艦§!和§Y重型艦艇§!，或特種§Y潛艇§!上安裝一個§Y彈射器§!模塊將有助於提高他們探測敵艦的能力。"
 cruiser_armor_advice_tt: "\n在§Y巡洋艦§!上安裝一個更好的§Y裝甲§!模塊將有助於提高他們抵禦傷害的能力。"
 heavy_armor_advice_tt: "\n在§Y重型艦船§!上安裝一個更好的§Y裝甲§!模塊將有助於提高他們抵禦傷害的能力。§Y戰列艦§!和§Y戰列巡洋艦§!由它們不同的§Y裝甲方案§!來決定，一般來說，戰列巡洋艦的裝甲較差。"
 basic_cruiser_armor_scheme: "基礎巡洋艦裝甲設計方案"
 basic_cruiser_armor_scheme_desc: "這種裝甲設計方案仿照了主力艦上分離舷側和甲板的裝甲的做法，並能提供一定程度上對彈片與小口徑火炮的防禦。\n\n在§Y巡洋艦§!上安裝這個模塊可以提高它們§Y抵禦敵人傷害§!的能力，但也會§R降低§!它們的§Y速度§!。"
 improved_cruiser_armor_scheme: "巡洋艦舷側傾斜裝甲設計方案"
 improved_cruiser_armor_scheme_desc: "將水線裝甲依照一定的角度擺放，能夠使得與之前相同重量與厚度的裝甲更難被穿透。\n\n在§Y巡洋艦§!上安裝這個模塊可以提高它們§Y抵禦敵人傷害§!的能力，但也會§R降低§!它們的§Y速度§!。"
 advanced_cruiser_armor_scheme: "巡洋艦重點防護裝甲方案"
 advanced_cruiser_armor_scheme_desc: "該方案只注重保護船舶上最重要的部分，而忽略了不重要的部分。\n\n在§Y巡洋艦§!上安裝這個模塊可以提高它們§Y抵禦敵人傷害§!的能力，但也會§R降低§!它們的§Y速度§!。"
 basic_heavy_armor_scheme: "傾斜舷側裝甲設計方案"
 basic_heavy_armor_scheme_desc: "將水線裝甲依照一定的角度擺放，能夠使得與之前相同重量與厚度的裝甲更難被穿透。\n\n在§Y重型艦艇§!上安裝這個模塊可以提高他們§Y抵禦敵人傷害§!的能力。§Y戰列艦§!和§Y戰列巡洋艦§!由它們不同的§Y裝甲方案§!來決定。"
 improved_heavy_armor_scheme: "重點防護裝甲方案"
 improved_heavy_armor_scheme_desc: "該方案只注重保護船舶上最重要的部分，而忽略了不重要的部分。\n\n在§Y重型艦艇§!上安裝這個模塊可以提高他們§Y抵禦敵人傷害§!的能力。§Y戰列艦§!和§Y戰列巡洋艦§!由它們不同的§Y裝甲方案§!來決定。"
 torpedo_advice_tt: "\n在§Y輕型艦艇§!或§Y巡洋艦§!上安裝§Y魚雷發射器§!可以對敵方§Y戰列線§!中的§Y主力艦§!造成重大損害，如果他們能擊潰敵方§Y屏衛艦群§!的話。"
 basic_torpedo: "基礎魚雷"
 basic_torpedo_desc: "一種擁有自推進能力並攜帶爆炸彈頭，按預先確定的路線運行，直到擊中水線以下的目標。\n\n在§Y輕型艦艇§!或§Y巡洋艦§!安裝這個模塊可以對敵方§Y主力艦§!造成重大損害。"
 magnetic_detonator: "磁性魚雷"
 magnetic_detonator_desc: "一種新的魚雷能夠在其從目標船隻的下方經過時探測到地球磁場的偏轉並從正下方擊中目標。而一次正中船底的爆炸在大多數情況下會導致對方的龍骨斷裂，並迅速沉沒。"
 homing_torpedo: "自主制導魚雷"
 homing_torpedo_desc: "通過裝備一個輔助探測器，魚雷將會自己瞄準其正前方最大的噪聲源——通常情況下，這會是目標。"
 electric_torpedo: "電動魚雷"
 electric_torpedo_desc: "不同於會留下一長串容易被觀測到的氣泡軌跡的舊型號魚雷，一枚帶有電動引擎的魚雷在擊中目標前幾乎是不可見的。這也意味著對方無法通過追蹤魚雷軌跡找到發射它的潛艇。"
 improved_ship_torpedo_launcher: "改進型載魚雷發射器"
 improved_ship_torpedo_launcher_desc: "更強大的馬達使得魚雷發射器可以安裝更多發射管，並更快指向目標。\n\n在§Y輕型艦艇§!或§Y巡洋艦§!安裝這個模塊可以對敵方§Y主力艦§!造成重大損害。"
 advanced_ship_torpedo_launcher: "先進艦載魚雷發射器"
 advanced_ship_torpedo_launcher_desc: "更大口徑的魚雷管可以發射攜帶更重彈頭的大型魚雷。\n\n在§Y輕型艦艇§!或§Y巡洋艦§!安裝這個模塊可以對敵方§Y主力艦§!造成重大損害。"
 modern_ship_torpedo_launcher: "現代艦載魚雷發射器"
 modern_ship_torpedo_launcher_desc: "強大的壓縮氣流能使重型魚雷以更快的速度發射。\n\n在§Y輕型艦艇§!或§Y巡洋艦§!上安裝這個模塊可以對敵方§Y主力艦§!造成重大損害。"
 snorkel_advice_tt: "\n在§Y潛艇§!上安裝§Y通氣管§!可以極大地降低它們的§Y可見度§!，從而使它們更難被敵艦探測並攻擊。"
 basic_submarine_snorkel: "基礎潛艇通氣管"
 basic_submarine_snorkel_desc: "一根從發動機艙到控制塔的簡易通氣管。展開後可讓潛艇在水下運轉其發動機並給電池充電。\n\n在§Y潛艇§!上安裝這個模塊會降低它們的§Y可見度§!，使它們更難被探測到。"
 improved_submarine_snorkel: "改進型潛艇通氣管"
 improved_submarine_snorkel_desc: "一項改良設計可以防止任何水被吸進發動機，同時也減少了通氣管頭的雷達特徵。\n\n在§Y潛艇§!上安裝這個模塊會降低它們的§Y可見度§!，使它們更難被探測到。"
 light_battery_advice_tt: "\n\n在§Y輕型艦艇§!和§Y巡洋艦§!上安裝§Y輕型炮組§!模塊會增加他們的§Y輕型火炮攻擊§!，這有助於摧毀敵方的§Y屏衛艦§!。§Y輕型炮組§!通常在對付裝甲艦艇如§Y巡洋艦§!和§Y重型艦艇§!時表現不佳。"
 medium_battery_advice_tt: "\n\n在§Y巡洋艦§!上安裝§Y輕中型炮組§!或§Y中型炮組§!模塊會增加它們的§Y輕型火炮攻擊§!或§Y重型火炮攻擊§!，使它們能夠與敵方§Y屏衛艦§!或§Y主力艦§!交戰。安裝任何§Y中型炮組§!的船隻將被指派為§Y重巡洋艦§!，而只安裝§Y輕中型炮組§!的船隻將被指派為§Y輕巡洋艦§!。"
 heavy_battery_advice_tt: "\n\n安裝§Y重型炮組§!模塊會增加一艘§Y重型艦艇§!的§Y重型火炮攻擊§!，允許它與敵方的§Y主力艦§!交戰並將其摧毀，§Y重型炮組§!通常在對付小型船隻如§Y輕型艦艇§!和§Y輕巡洋艦§!時表現不佳。"
 basic_battery: "海軍艦炮"
 basic_battery_desc: "海軍火炮瞄準機制的基礎設計。"
 basic_light_battery: "基礎輕型炮組"
 basic_light_battery_desc: "為小口徑火炮配備的開放式動力炮座，用於小型艦船。\n\n安裝這個模塊會增加§Y輕型火炮攻擊§!，這有助於與敵方的§Y屏衛艦§!交戰。"
 improved_light_battery: "改進型輕型炮組"
 improved_light_battery_desc: "為小口徑火炮配備的封閉式動力炮座，可以保護乘員免受惡劣天氣和炮彈碎片的傷害。\n\n安裝這個模塊會增加§Y輕型火炮攻擊§!，這有助於與敵方的§Y屏衛艦§!交戰。"
 advanced_light_battery: "先進輕型炮組"
 advanced_light_battery_desc: "一種先進的雙聯裝炮座，可以在裝甲防護下提供更多的火力。\n\n安裝這個模塊會增加§Y輕型火炮攻擊§!，這有助於與敵方的§Y屏衛艦§!交戰。"
 basic_light_shell: "小口徑半穿甲彈"
 basic_light_shell_desc: "這種炮彈在穿甲性能和爆炸威力間取得了平衡，可以顯著地在貫穿輕型艦船後帶來更多傷害。"
 improved_light_shell: "小口徑穿甲彈"
 improved_light_shell_desc: "一種適合驅逐艦和其他輕型艦船的小口徑穿甲彈，使之有了對抗裝甲目標的機會。"
 basic_medium_battery: "基礎中型炮組"
 basic_medium_battery_desc: "擁有兩門或三門聯裝中等口徑火炮的動力炮塔，用於巡洋艦上。\n\n安裝一個§Y輕中型炮組§!模塊會增加§Y輕型火炮攻擊§!，這有助於與敵方的§Y屏衛艦§!交戰。安裝一個§Y中型炮組§!模塊會增加§Y重型火炮攻擊§!，這有助於與敵方的§Y主力艦§!交戰。"
 improved_medium_battery: "改進型中型炮組"
 improved_medium_battery_desc: "改良的炮塔布局加快了裝填，同時更好的裝甲提升了生存性。\n\n安裝一個§Y輕中型炮組§!模塊會增加§Y輕型火炮攻擊§!，這有助於與敵方的§Y屏衛艦§!交戰。安裝一個§Y中型炮組§!模塊會增加§Y重型火炮攻擊§!，這有助於與敵方的§Y主力艦§!交戰。"
 advanced_medium_battery: "先進中型炮組"
 advanced_medium_battery_desc: "通過集成動力裝填和遠程動力控制，現代巡洋艦可以到達前所未有的射速與精度。\n\n安裝一個§Y輕中型炮組§!模塊會增加§Y輕型火炮攻擊§!，這有助於與敵方的§Y屏衛艦§!交戰。安裝一個§Y中型炮組§!模塊會增加§Y重型火炮攻擊§!，這有助於與敵方的§Y主力艦§!交戰。"
 basic_medium_shell: "中口徑被帽穿甲彈"
 basic_medium_shell_desc: "增加了風帽後，炮彈在擁有更好的氣動外形的情況下依舊可以保持它們的穿甲能力。"
 improved_medium_shell: "中口徑半穿甲彈"
 improved_medium_shell_desc: "這種炮彈在穿甲性能和爆炸威力間取得了平衡，可以顯著地在貫穿輕型艦船後帶來更多傷害。"
 basic_heavy_battery: "基礎重型炮組"
 basic_heavy_battery_desc: "在厚重的裝甲後裝備了巨炮的巨型炮塔。\n\n安裝一個§Y重型炮組§!模塊會增加一艘艦的§Y重型火炮攻擊§!，提高對敵方§Y主力艦§!的打擊能力。"
 improved_heavy_battery: "改進型重型炮組"
 improved_heavy_battery_desc: "動力揚彈機增加了增加了重炮的裝填速度，同時自動防爆門增加了安全性。\n\n安裝一個§Y重型炮組§!模塊會增加一艘艦的§Y重型火炮攻擊§!，提高對敵方§Y主力艦§!的打擊能力。"
 advanced_heavy_battery: "先進重型炮組"
 advanced_heavy_battery_desc: "升級的後坐力減少機制和延時擊發裝置減少了炮彈之間在飛行中的干擾，並且顯著地提升了精度。\n\n安裝一個§Y重型炮組§!模塊會增加一艘艦的§Y重型火炮攻擊§!，提高對敵方§Y主力艦§!的打擊能力。"
 basic_heavy_shell: "被帽穿甲彈"
 basic_heavy_shell_desc: "增加了風帽後，炮彈在擁有更好的氣動外形的情況下依舊可以保持它們的穿甲能力。"
 improved_heavy_shell: "超重型穿甲彈"
 improved_heavy_shell_desc: "重量超過一噸，當這些巨大的炮彈帶著空前的威力命中目標時，即使對於最厚重的裝甲來說也能造成可怕的威脅。"
 secondary_battery_advice_tt: "\n一個§Y副炮組§!允許§Y巡洋艦§!和§Y重型艦艇§!在對另一目標造成傷害的同時，將敵方的§Y屏衛艦§!為次要目標進行攻擊。"
 basic_secondary_battery: "炮廓式副炮"
 basic_secondary_battery_desc: "這些開放式地放置於船側的小型火炮，給予了艦船一定程度上抵禦更小艦船的能力，但是射界有限。\n\n安裝一個§Y副炮§!模塊可以使§Y巡洋艦§!，§Y航母§!，或§Y重型艦船§!進行少量的§Y輕型火炮攻擊§!並允許其攻擊第二個目標。"
 improved_secondary_battery: "炮塔式副炮"
 improved_secondary_battery_desc: "安裝於動力炮塔內的副炮，得到了更寬闊的射界，代價是增加了重量並且降低了惡劣海況中的艦船穩定性。\n\n安裝一個§Y副炮§!模塊可以使§Y巡洋艦§!，§Y航母§!，或§Y重型艦船§!進行少量的§Y輕型火炮攻擊§!並允許其攻擊第二個目標。"
 damage_control_1: "消防演練"
 damage_control_1_desc: "從船長到普通水手，每一位船員都必須幫助控制和撲滅船上的火災。"
 damage_control_2: "分散的消防管道"
 damage_control_2_desc: "通過分散船上的主要給水管線，一擊致使船隻完全喪失消防能力的幾率大大降低。"
 damage_control_3: "柴油動力應急泵"
 damage_control_3_desc: "因為有通常依靠主發動機供電的重型泵，所以對引擎室的單次且相當輕微的攻擊，就可能使船舶無法維持漂浮狀態。"
 fire_control_methods_1: "夾叉射擊"
 fire_control_methods_1_desc: "為了擊中目標，第一步要每次跨越目標同時射幾炮，直至炮擊集中到目標的兩側。"
 fire_control_methods_2: "階梯射擊"
 fire_control_methods_2_desc: "不對目標進行火力覆蓋以免失去觀測敵軍艦船受打擊情況的機會，而是有意的將炮彈落在離目標較近的地方，並測量著彈點與目標之間的距離以計算射擊參數。"
 fire_control_methods_3: "染色彈"
 fire_control_methods_3_desc: "在炮彈中添加少量的顏料，當我們用這些帶有顏料的炮彈向敵艦開火時，著彈點附近將變得更加顯眼，這將允許多艘艦船與同一目標交戰而不會因彼此的炮擊弄混。"
 fuel_silos: "燃料儲存"
 fuel_silos_desc: "大量儲存燃油需要一套複雜的容器、管道和閥門以確保其既安全又方便使用。"
 fuel_refining: "燃料精煉 I"
 fuel_refining_desc: "化學裂解的進步使得從原油中提煉輕型燃油的效率更高了。"
 fuel_refining2: "燃料精煉 II"
 fuel_refining2_desc: "更好地規劃煉油廠佈局可以減少燃料的浪費。"
 fuel_refining3: "燃料精煉 III"
 fuel_refining3_desc: "改進的回收方法允許從副產品中提煉燃料。"
 fuel_refining4: "燃料精煉 IV"
 fuel_refining4_desc: "化學工程的新發展允許從新的來源精煉燃料。"
 fuel_refining5: "燃料精煉 V"
 fuel_refining5_desc: "在煉油廠的建設中採用新方法和改進的佈局，在減少浪費的同時大大提高了產量。"
 scout_plane1: "偵察機 I型"
 scout_plane1_desc: "收集敵軍動向和提供敵方海軍的部署情況是自世界大戰以來飛機最初的用途，至今，仍是一項重要的任務。"
 scout_plane2: "偵察機 II型"
 scout_plane2_desc: "通過發展專門用於空中監視和遠程偵察的飛機型號，我們能夠確保準確地獲得並持續跟進對手的意圖和我們對其能力的瞭解。"
 SURRENDER_REDUCTION_TOOLTIP: "在$COUNTRY|H$的合作值可以將該國的投降閾值降低$VALUE|+%.0$。"
 COLLABORATION_EFFECTS_TOOLTIP: "你在$COUNTRY|H$有$COLLABORATION|+%.0$合作值。這可以將該國的投降閾值降低$SURRENDER|+%.0$並在該國停止抵抗時提供$COMPLIANCE|+%.0$順從度以及相關的順從修正。"
 COLLABORATION_EFFECTS_OTHER_SIDE_TOOLTIP: "$OTHER_COUNTRY|H$在$COUNTRY|H$有$COLLABORATION|+%.0$合作值。這可以將$COUNTRY|H$的投降閾值降低$SURRENDER|+%.0$並在該國停止抵抗時提供$COMPLIANCE|+%.0$順從度以及相關的順從修正。"
