 militia_tech: "民兵"
 TOA_jungle_pioneers_support_tech: "叢林先鋒"
 basic_fortification_tech: "基礎防禦工事"
 basic_fortification_tech_desc: "通過使用更堅固的材料和金屬加固結構，我們可以建造更大的防禦工事，而不必擔心它們坍塌。"
 land_fort_tech_1: "改良陸上要塞"
 land_fort_tech_1_desc: "通過更好地利用我們防禦工事周圍的土地，並引入新技術，我們可以加強我們現有的防禦工事，並進一步擴大它們。"
 land_fort_tech_2: "先進陸上要塞"
 land_fort_tech_2_desc: "通過吸取過去的教訓，不僅加固工事本身，而且可以加固其基礎，我們將能夠建造更大的防禦工事，足以抵擋最有經驗的敵人。"
 coastal_fort_tech_1: "改良海岸要塞"
 coastal_fort_tech_1_desc: "通過更好地利用沿海防禦工事周圍的土地，並引入新技術，我們可以加強現有工事，並進一步擴大它們。"
 coastal_fort_tech_2: "先進海岸要塞"
 coastal_fort_tech_2_desc: "通過將我們的掩體和防禦工事建在懸崖和山丘中，我們可以建造更大的工事，足以抵禦最強大的海上入侵力量。"
 sp_rockets_improved_guidance: "改進型制導系統"
 sp_rockets_improved_guidance_desc: "更好的火箭制導系統將使我們的飛行炸彈能夠飛得更遠，成為敵人更大的威脅。通過改進小型火箭的制導系統，我們的火箭炮兵將能夠更好地提高瞄準精度。"
 sp_rockets_rocket_bomber: "$rocket_propelled_bombs$"
 sp_rockets_rocket_bomber_desc: "$rocket_propelled_bombs_desc$"
 sp_rockets_improved_rocket_bomber: "$improved_rocket_propelled_bombs$"
 sp_rockets_improved_rocket_bomber_desc: "$improved_rocket_propelled_bombs_desc$"
 sp_armored_advanced_flamethrower_tech: "先進型噴火器"
 sp_armored_advanced_flamethrower_tech_desc: "$advanced_flamethrower_desc$"
 sp_armored_lc_high_impact_obliterator_cannon_tech: "高衝擊毀滅者加農炮"
 sp_armored_lc_high_impact_obliterator_cannon_tech_desc: "$lc_high_impact_obliterator_cannon_desc$"
 sp_armored_lc_naval_engine_conversion_tech: "海軍引擎改造"
 sp_armored_lc_naval_engine_conversion_tech_desc: "利用海軍工程技術，如強化的曲軸、高扭矩變速器和專用冷卻系統，可以增強陸地巡洋艦引擎的功率輸出和耐用性，使其更好地管理巨大的重量和壓力。"
 sp_armored_lc_transmission_improvements_tech: "改良通訊"
 sp_armored_lc_transmission_improvements_tech_desc: "精煉的齒輪比、離合器機制和扭矩轉換器可以創建更高效的傳動裝置，能夠處理陸地巡洋艦的極端動力和重量，改善整體機動性並減少機械壓力。"
 sp_armored_lc_specialized_field_manuals_tech: "專業戰場手冊"
 sp_armored_lc_specialized_field_manuals_tech_desc: "開發專門為陸地巡洋艦乘員量身定製的詳細培訓手冊，涵蓋獨特的操作程序、維護規範和複雜的戰場戰術，確保有效指揮這些巨型戰爭機器。"
 sp_armored_lc_weapon_fire_control_tech: "武器火力控制系統"
 sp_armored_lc_weapon_fire_control_tech_desc: "採用先進的瞄準光學設備、測距儀和陀螺穩定器，可以提高武器精度和火力協調，確保火炮能有效擊中目標，儘管其後坐力巨大且機動性緩慢。"
 sp_armored_engineer_tech: "裝甲工兵連"
 sp_armored_engineer_tech_desc: "將工程技術與裝甲防護相結合，裝甲工兵單位專門用於在重火力下清除障礙並支援前線推進。"
 sp_armored_maintenance_tech: "裝甲維修連"
 sp_armored_maintenance_tech_desc: "使用裝甲搶修車使我們的維修人員能夠回收和修復各種設備，確保戰場上的最大限度的作戰準備。"
 sp_armored_signal_tech: "裝甲通信連"
 sp_armored_signal_tech_desc: "為我們的部隊配備指揮車輛，確保在裝甲保護下的戰場通信和協調的安全性和可靠性。"
 sp_armored_motorized_military_police_tech: "摩托化憲兵"
 sp_armored_motorized_military_police_tech_desc: "這些部隊配備了軍用摩托車，負責在後方維持秩序，護送車隊並進行巡邏。它們的速度和機動性使其能夠迅速響應干擾，必要時還可在活躍戰區進行偵察。"
 sp_cluster_shells: "集束彈"
 sp_cluster_shells_desc: "集束彈大範圍散射多枚子彈藥，最大限度地破壞敵人的部隊和裝備"
 sp_artillery_rocket_assisted_projectiles_tech: "火箭助推彈"
 sp_artillery_rocket_assisted_projectiles_tech_desc: "為超重型榴彈炮設計的增強型彈藥，利用火箭推進來擴大射程並加強衝擊力。"
 sp_artillery_purpose_built_gun_motor_carriages_tech: "專用火炮運載車"
 sp_artillery_purpose_built_gun_motor_carriages_tech_desc: "專為運輸和支援超重型榴彈炮設計的專用車輛，確保機動性和戰場部署的便利性。"
 sp_multi_product_supply_ships: "多功能補給艦"
 sp_multi_product_supply_ships_desc: "使用新生產的補給艦，我們可以確保在兩艦之間更平穩地轉移燃料、彈藥和食品補給。"
 sp_standard_tenshioned_replenishment_alongside_method: "標準橫向補給系統"
 sp_standard_tenshioned_replenishment_alongside_method_desc: "標準橫向補給系統是進一步確保我們遠洋海軍行動得到穩定補給的進一步發展"
 sp_aip_engine_improved_tech: "無氧推進-柴油組合引擎"
 sp_aip_engine_improved_tech_desc: "進一步改良無氧推進技術後，我們在引擎性能和材料消耗方面都看到了改進。"
 sp_aip_engine_advanced_tech: "高速沃爾特引擎"
 sp_aip_engine_advanced_tech_desc: "我們對獨立空氣推進系統的經驗和理解使我們得以開發出最先進的引擎。安靜、快速且致命。"
 sp_refined_pykrete: "改良的派克瑞特"
 sp_refined_pykrete_desc: "進一步改良派克瑞特之後，我們現在能夠為冰航母上的飛機提供更好的隔熱和保護。"
 sp_ice_composite_runawayas: "冰複合材料跑道"
 sp_ice_composite_runawayas_desc: "隨著冰複合材料的持續發展，我們正在尋找最佳材料和施工技術，為我們的航母和飛機提供保護。"
 heavy_battleship2: "超重型戰列艦II型"
 heavy_battleship2_desc: "在我們早期超重型設計基礎上的改進型號，擁有更強大的武器和改進的火控系統。"
 sp_shock_hardening_techniques: "衝擊硬化技術"
 sp_shock_hardening_techniques_desc: "通過使用各種衝擊硬化技術，並對我們的組件使用應力均衡器，我們降低了過早爆炸的概率，使我們的彈藥更可靠、更有效。"
 sp_variable_time_fuze_shells: "可變時引信炮彈"
 sp_variable_time_fuze_shells_desc: "憑藉應用可變時引信炮彈——我們可以讓野戰炮兵對敵人造成了毀滅性打擊。炮彈在到達地面之前爆炸，從而創造了更大的殺傷區。"
 sp_helicopter_transport_pods_tech: "直升機運輸連"
 sp_helicopter_transport_pods_tech_desc: "裝備有運輸吊艙或在機身下方用纜繩牽引貨物的直升機可以快速運送物資和設備，不受地形限制。陷入泥濘將成為過去！"
 sp_helicopter_artillery_observers_tech: "直升機偵察連"
 sp_helicopter_artillery_observers_tech_desc: "直升機能夠無視實際地形獲得戰場的良好視野，因此非常適合擔任前線偵察，為炮兵單位提供準確反饋。"
 sp_helicopter_med_evac_tech: "直升機急救連"
 sp_helicopter_med_evac_tech_desc: "傷員來了！傷員來了！直升機可以比平常的救護車更快地撤離傷員。"
 sp_rockets_dual_chamber_rocket_engine_1: "雙燃燒室火箭引擎"
 sp_rockets_dual_chamber_rocket_engine_1_desc: "通過在引擎中添加第二個燃燒室，我們可以提高火箭引擎的飛行時間和效能。"
 sp_rockets_dual_chamber_rocket_engine_2: "先進雙燃燒室火箭引擎"
 sp_rockets_dual_chamber_rocket_engine_2_desc: "對雙燃燒室引擎的進一步改進可能會在原本設計的基礎上帶來更大的效能提升。"
 sp_advance_sabot_shells: "先進穿甲彈"
 sp_advance_sabot_shells_desc: "通過專項投入穿甲彈研發資源，我們獲得了對多場景應用下脫殼穩定性優化的深度認知。"
 reinforced_wings_mothership: "強化空天母艦的航空聯隊"
 reinforced_wings_mothership_desc: "沒有空天母艦的戰鬥機在空中基本上就會陷入困境，嚴重限制了它們的作戰效能。加強空天母艦的航空聯隊，是提高整支部隊生存能力的最具成本效益的策略。"
 miniature_fighters: "小型戰鬥機"
 miniature_fighters_desc: "通過使用更小型的戰鬥機，我們將能夠在不犧牲太多火力的情況下，攜帶更多戰鬥機投入戰鬥，同時減少空天母艦的負載重量。"
 aerial_hangars: "空中機庫"
 aerial_hangars_desc: "附加在空天母艦上的空中機庫使我們能夠在這個飛行器的頂部裝載更多的小型戰鬥機，從而增強火力並擴大作戰半徑。"
 mothership: "空天母艦"
 transport_planes_cat: "運輸機"
 RESEARCH_SHARING_VALUE_SCIENTISTS: "$VALUE|H1%$"
 naval_minelaying_research: "佈雷研究"
 naval_minelaying_research_desc: "開展海軍炸藥磁性探測技術與穩定點火源的研發工作。"


