 grand_banzai_charge: "大規模萬歲衝鋒"
 masterful_blitz_desc: "閃電戰可能不是我們發明的，但我們會發展和完善這個戰術。即使是最堅固的防線，也無法阻止我們光榮軍隊的前進。"
 penal_infantry: "懲戒營"
 penal_infantry_desc: "懲戒營為被判決有罪的紅軍士兵和軍官提供了為祖國流血犧牲、為過去犯下的可恥行為贖罪的機會。"
