 amphibious_mechanized_infantry: "兩棲牽引機"
 amphibious_mechanized_infantry_desc: "兩棲履帶登陸車，或稱AMTRACs，使得海軍陸戰隊可以在裝甲保護下登陸海灘。然而，這會導致更多燃料的消耗。"
