 RULE_ALLOW_WARGOALS_FREE_25_DESC: "在全球緊張度低於25%時無法制造戰爭目標，但在這之後所有國家都可以製造戰爭目標。該設定的優先級高於意識形態規則，但仍然允許通過國策獲得戰爭目標。"
 RULE_ALLOW_WARGOALS_FREE_50_DESC: "在全球緊張度低於50%時無法制造戰爭目標，但在這之後所有國家都可以製造戰爭目標。該設定的優先級高於意識形態規則，但仍然允許通過國策獲得戰爭目標。"
 RULE_ALLOW_WARGOALS_FREE_75_DESC: "在全球緊張度低於75%時無法制造戰爭目標，但在這之後所有國家都可以製造戰爭目標。該設定的優先級高於意識形態規則，但仍然允許通過國策獲得戰爭目標。"
 RULE_ALLOW_WARGOALS_FREE_100_DESC: "在全球緊張度低於100%時無法制造戰爭目標，但在這之後所有國家都可以製造戰爭目標。該設定的優先級高於意識形態規則，但仍然允許通過國策獲得戰爭目標。"
 RULE_OPTION_FOCUSES_ONLY: "僅限國策"
