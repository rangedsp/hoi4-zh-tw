 RULE_OPTION_SOV_UTTERLY_FRAGMENTED: "蘇維埃聯盟完全解體"
 RULE_OPTION_SOV_UTTERLY_FRAGMENTED_DESC: "所有可被釋放的蘇聯成員國、自治區包括領土會在遊戲開始時被釋放，成為自由獨立的國家。"
 NORDICS_FRAGMENTATION_STATUS: "北歐解體狀態"
 RULE_OPTION_SAPMI_RELEASED: "釋放薩普米"
 RULE_OPTION_SAPMI_RELEASED_DESC: "薩普米會從芬蘭、瑞典和挪威之中釋放。"
 RULE_OPTION_NORDICS_FRAGMENTED: "北歐解體"
 RULE_OPTION_NORDICS_FRAGMENTED_DESC: "北歐國家將被解體得支離破碎、四分五裂。"
 RAJ_FRAGMENTATION_STATUS: "印度解體狀態"
 RULE_OPTION_RAJ_FRAGMENTED: "英屬印度解體"
 RAJ_PRINCELY_STATES_FREE: "土邦自由"
 RULE_OPTION_RAJ_PRINCELY_STATES_FREE: "土邦自由"
 RULE_OPTION_RAJ_PRINCELY_STATES_FREE_DESC: "遊戲開始時印度土邦會被釋放。"
 ETH_FRAGMENTATION_STATUS: "埃塞俄比亞解體狀態"
 RULE_OPTION_ETH_FRAGMENTED: "埃塞俄比亞解體"
 RULE_OPTION_ETH_FRAGMENTED_DESC: "埃塞俄比亞將被分割成各個組成國"
 RULE_OPTION_RAJ_FRAGMENTED_DESC: "所有可被釋放的英屬印度構成國將在遊戲開始時被釋放出來，成為自由而獨立的國家。"
 ITA_FRAGMENTATION_STATUS: "意大利解體狀態"
 RULE_OPTION_ITA_FRAGMENTED: "逆轉復興運動"
 RULE_OPTION_ITA_FRAGMENTED_DESC: "逆轉復興運動，將國界恢復到意大利統一之前的狀態。"
 RULE_OPTION_NATIONALIST_HISTORICAL: "佛朗哥主義"
 RULE_OPTION_NATIONALIST_HISTORICAL_DESC: "佛朗哥將控制國民陣線，並將長槍黨和卡洛斯派的意識形態融合到一個新的統一的西班牙，除非是受到攻擊，否則他將在世界大戰中保持中立。"
 RULE_OPTION_SECOND_REPUBLIC: "第二共和國"
 RULE_OPTION_SECOND_REPUBLIC_DESC: "西班牙民主政府將維護第二共和國，反對法西斯和共產主義。"
 RULE_OPTION_FALANGIST: "長槍主義"
 RULE_OPTION_FALANGIST_DESC: "何塞·安東尼奧·普里莫·德·里維拉領導的長槍黨將抵制卡洛斯派，並尋求恢復西班牙帝國主義。"
 RULE_OPTION_CARLIST: "卡洛斯派"
 RULE_OPTION_CARLIST_DESC: "曼努埃爾·法爾·孔戴領導的卡洛斯派將抵制長槍主義，並確保迴歸到由合法的卡洛斯國王領導的舊式專制君主制。"
 RULE_OPTION_ANARCHIST: "安那其主義"
 RULE_OPTION_ANARCHIST_DESC: "阿拉貢和加泰羅尼亞的安那其主義公社將聯合起來，共同擊敗法西斯主義者和共產主義者，並完全抵制民族國家的概念。"
 RULE_OPTION_INDEPENDENT_COMMUNIST: "獨立共產主義"
 RULE_OPTION_INDEPENDENT_COMMUNIST_DESC: "馬克思主義統一工人黨及其安那其盟友將在內戰後擺脫斯大林主義的枷鎖，尋求自己獨立的共產主義意識形態。"
 RULE_OPTION_STALINIST: "斯大林式共產主義"
 RULE_OPTION_STALINIST_DESC: "真正的共產黨人聽從莫斯科的指示，將抵抗安那其主義者和法西斯主義者，遏制獨立共產主義者的影響，並在斯大林主義的指導下開創第二共和國的新時代。"
 RULE_OPTION_HISTORICAL_POR_AI_DESC: "在薩拉查政權統治下，葡萄牙將強化新國家體制，並試圖在世界大戰期間保持中立。"
 RULE_OPTION_FASCIST_POR_AI_DESC: "拉斐爾·佩雷拉將以法西斯獨裁者的身份控制葡萄牙，並在西班牙內戰期間支持西班牙國民軍，之後則會試圖加入軸心國。"
 RULE_OPTION_FASCIST_FIFTH_EMPIRE: "第五帝國"
 RULE_OPTION_FASCIST_FIFTH_EMPIRE_DESC: "葡萄牙政府將擁護法西斯主義，在西班牙內戰期間與共和軍作戰，並試圖恢復其在非洲、亞洲和美洲失去的領土，再次崛起成為一個大國。"
 RULE_OPTION_NEUTRALITY_MONARCHIST: "君主制"
 RULE_OPTION_NEUTRALITY_MONARCHIST_DESC: "在葡萄牙重建君主制後，杜阿爾特國王將向巴西君主主義者發出呼籲，並試圖重建葡萄牙-巴西帝國。"
 RULE_OPTION_DEMOCRATIC_POR_AI_DESC: "在英國的影響下，一個民主政府將推翻薩拉查政權，並在英國的幫助下，在加入同盟國前專注於發展國家工業。"
 RULE_OPTION_COMMUNIST_COMINTERN: "共產主義"
 RULE_OPTION_COMMUNIST_COMINTERN_DESC: "葡萄牙將與蘇聯結盟，支持西班牙共和國，並試圖加入共產國際。"
 RULE_OPTION_COMMUNIST_INDEPENDENT: "歐洲社會主義聯合共和國"
 RULE_OPTION_COMMUNIST_INDEPENDENT_DESC: "在西班牙內戰期間，共產黨人將推翻政府並與西班牙國民軍作戰，將伊比利亞半島統一為歐洲社會主義聯合共和國，這是歐洲對抗法西斯主義的最後堡壘。"
 RULE_OPTION_MONARCHIST_ORLEANIST: "君主制：奧爾良王朝"
 RULE_OPTION_MONARCHIST_LEGITIMIST: "君主制：波旁王朝"
 RULE_OPTION_MONARCHIST_BONAPARTIST: "君主制：波拿巴王朝"
 RULE_MONARCHIST_ORLEANIST_FRA_AI_DESC: "法國AI會沿著國策樹的相關路徑，嘗試恢復法國君主制並讓奧爾良派登上王位。"
 RULE_MONARCHIST_LEGITIMIST_FRA_AI_DESC: "法國AI會沿著國策樹的相關路徑，嘗試恢復法國君主制並讓正統派登上王位。"
 RULE_MONARCHIST_BONAPARTIST_FRA_AI_DESC: "法國AI會沿著國策樹的相關路徑，嘗試恢復法國君主制並讓波拿巴派登上王位。"
 RULE_ALLOW_RELEASE_NATIONS_KURDISTAN_TOOLTIP: "§Y[ROOT.GetName]§!不允許釋放§Y[KUR.GetName]§!。"
 RULE_ENTENTE_LIT_AI_DESC: "立陶宛將會嘗試成立波羅的海協約並且對抗蘇聯。"
 RULE_ENTENTE_EST_AI_DESC: "愛沙尼亞將會嘗試成立波羅的海協約並且對抗蘇聯。"
 RULE_ENTENTE_LAT_AI_DESC: "拉脫維亞將會嘗試成立波羅的海協約並且對抗蘇聯。"
 RULE_HISTORICAL_EST_AI_DESC: "愛沙尼亞AI將在大多數政治運動中維持中立，但是在1940年代將會成為蘇聯附屬國。"
 RULE_HISTORICAL_LAT_AI_DESC: "拉脫維亞AI將在大多數政治運動中維持中立，但是在1940年代將會成為蘇聯附屬國。"
 RULE_HISTORICAL_LIT_AI_DESC: "立陶宛AI將在大多數政治運動中維持中立，但是在1940年代將會成為蘇聯附屬國。"
 RULE_OPTION_MONARCHIST: "君主制"
 RULE_OPTION_MONARCHIST_LIT_AI_DESC: "立陶宛將嘗試重建君主制並且宣稱波蘭-立陶宛聯邦。"
 RULE_OPTION_BALTIC_ENTENTE: "波羅的海協約"
 RULE_OPTION_COMMUNIST_BALKAN_FEDERATION: "共產主義-巴爾幹聯邦"
 RULE_OPTION_COMMUNIST_BALKAN_FEDERATION_BUL_AI_DESC: "保加利亞將試圖組建巴爾幹同盟，影響其鄰國擁抱革命，並最終使巴爾幹統一。"
 RULE_OPTION_COMMUNIST_BUL_AI_DESC: "保加利亞將試圖加入共產國際，並與它的蘇聯戰友一起在歐洲反對法西斯主義和資本主義。"
 RULE_OPTION_DEMOCRATIC_LIBERAL: "民主-自由主義"
 RULE_OPTION_DEMOCRATIC_LIBERAL_BUL_AI_DESC: "保加利亞民主黨將試圖加入同盟國，為此它密謀反對沙皇鮑里斯以將他罷免，併成立一個支持同盟國的攝政委員會。"
 RULE_OPTION_DEMOCRATIC_SOCIALIST: "民主-社會主義"
 RULE_OPTION_DEMOCRATIC_SOCIALIST_BUL_AI_DESC: "由尼古拉·穆沙諾夫領導的政府將遵循社會主義政策，尋求改善與鄰國的關係，以建立巴爾幹聯邦，並捍衛巴爾幹抵抗外國侵略者。"
 RULE_OPTION_FASCIST_BUL_AI_DESC: "隨著法西斯主義在該國的興起，右翼領導人赫里斯托·盧科夫試圖加入軸心國，最終推翻沙皇並實行軍事獨裁統治。"
 RULE_OPTION_HISTORICAL_BUL_AI_DESC: "鮑里斯三世沙皇將領導該國邁向軸心國，依靠德國的仲裁來和平擴大保加利亞的邊界，最終簽署《三國同盟條約》並推遲保加利亞參加戰爭。"
 RULE_OPTION_THE_RETURN_OF_FERDINAND: "費迪南一世的歸來"
 RULE_OPTION_THE_RETURN_OF_FERDINAND_BUL_AI_DESC: "隨著鮑里斯三世沙皇逝世，他的父親費迪南一世將再次登基，尋求復仇，以打擊數十年前使他蒙冤的人。"
 RULE_OPTION_METAXIST_GRE_AI_DESC: "希臘將在發展梅塔克薩斯主義的同時奉行中立政策。"
 RULE_OPTION_MONARCHIST_GRE_AI: "君主制"
 RULE_OPTION_MONARCHIST_GRE_AI_DESC: "希臘將成為君主專制國家，並尋求加入同盟國。"
 RULE_OPTION_MONARCHIST_GRE_ALTERNATE_AI: "加入舊同盟國"
 RULE_OPTION_MONARCHIST_ALTERNATE_GRE_AI_DESC: "希臘將成為一個君主專制國家，並尋求與德國或奧匈帝國一起加入舊同盟國。"
 RULE_OPTION_STALINIST_GRE_AI: "斯大林主義"
 RULE_OPTION_STALINIST_GRE_AI_DESC: "希臘將試圖加入共產國際，並引發與土耳其的博斯普魯斯海峽之戰。"
 RULE_OPTION_COMMUNIST_GRE_AI: "共產主義"
 RULE_OPTION_ALTERNATE_COMMUNIST_GRE_AI_DESC: "希臘將試圖與共產主義南斯拉夫在歐洲抗擊法西斯主義。"
 RULE_OPTION_DEMOCRATIC_GRE_AI: "韋尼澤洛斯主義者"
 RULE_OPTION_VENEZELIST_GRE_AI_DESC: "希臘將爭取實現偉大理想的復興。"
 RULE_OPTION_FASCISM_GRE_AI_DESC: "希臘將成為國家社會主義共和國，並試圖與土耳其一起加入軸心國。"
 RULE_OPTION_FASCIST_ALTERNATE_GRE_AI: "安納托利亞法西斯主義者"
 RULE_OPTION_FASCISM_ALTERNATE_GRE_AI_DESC: "希臘將成為民主國家，政府垮臺，然後繼續追求最宏偉的雄心抱負……"
 RULE_OPTION_HISTORICAL_TUR_AI: "史實"
 RULE_OPTION_HISTORICAL_TUR_AI_DESC: "土耳其將在伊斯麥特·伊諾努的領導下儘可能長時間地追求中立，然後試圖加入同盟國。"
 RULE_OPTION_ALTERNATE_KEMALIST_AI: "非傳統凱末爾主義"
 RULE_OPTION_ALTERNATE_KEMALIST_AI_DESC: "土耳其將任命費夫齊·恰克馬克為總統，以追隨穆斯塔法·凱末爾·阿塔圖爾克的腳步，在試圖加入軸心國或同盟國之前儘可能長時間地保持中立。"
 RULE_OPTION_OTTOMAN: "重建奧斯曼蘇丹國"
 RULE_OPTION_OTTOMAN_DESC: "土耳其共和國將分崩離析，奧斯曼蘇丹國將從其灰燼中重新掌權。"
 RULE_OPTION_COMMUNIST_TUR_AI: "共產主義"
 RULE_OPTION_COMMUNIST_TUR_AI_DESC: "土耳其將建立一個共產主義政府，並試圖加入共產國際。"
 RULE_OPTION_ALTERNATE_COMMUNIST_TUR_AI: "獨立共產主義"
 RULE_OPTION_ALTERNATE_COMMUNIST_TUR_AI_DESC: "土耳其將接受共產主義政府，保持其凱末爾主義性質，並試圖建立自己的陣營。"
 RULE_OPTION_TUR_DEMOCRATIC_KEMALIST: "民主凱末爾主義"
 RULE_OPTION_TUR_DEMOCRATIC_KEMALIST_DESC: "傑拉勒·拜亞爾將把土耳其轉變為凱末爾主義民主國家，並試圖加入同盟國。"
 RULE_OPTION_TUR_DEMOCRATIC_ALTERNATE: "民主保守主義"
 RULE_OPTION_TUR_DEMOCRATIC_ALTERNATE_DESC: "阿德南·曼德列斯將把土耳其轉變為保守的民主國家，並試圖加入同盟國。"
 RULE_OPTION_FASCISM_TUR_AI: "凱末爾法西斯主義"
 RULE_OPTION_FASCISM_TUR_AI_DESC: "雷傑普·佩克爾將把土耳其轉變為法西斯獨裁政權，並試圖加入軸心國。"
 RULE_OPTION_TUR_FASCISM_ALTERNATE: "軍國主義法西斯"
 RULE_OPTION_TUR_FASCISM_ALTERNATE_DESC: "費夫齊·恰克馬克將把土耳其改造為保守的準法西斯獨裁政權，並試圖與意大利結盟。"
 RULE_OPTION_BALKAN_ENTENTE: "捍衛巴爾幹"
 RULE_OPTION_BALKAN_ENTENTE_DESC: "土耳其將致力於維護巴爾幹半島的安全，並試圖與希臘、羅馬尼亞和南斯拉夫組建一個陣營。"
 RULE_EXILES_TSARIST: "保皇黨流亡者"
 RULE_OPTION_EXILES_TSARIST_SOV_AI_DESC: "蘇聯AI會沿著國策樹的相關路徑，通過內戰清除共產主義者，重建沙皇俄國。"
 RULE_EXILES_FASCIST: "法西斯流亡者"
 RULE_OPTION_EXILES_FASCIST_SOV_AI_DESC: "蘇聯AI會沿著國策樹的相關路徑，通過內戰清除共產主義者，建立法西斯政府。"
 RULE_FASCIST_LIT_AI_DESC: "立陶宛AI會沿著國策樹的相關路徑，嘗試建立法西斯政權。"
 RULE_FASCIST_LAT_AI_DESC: "拉脫維亞AI會沿著國策樹的相關路徑，嘗試建立法西斯政權。"
 RULE_FASCIST_EST_AI_DESC: "愛沙尼亞AI會沿著國策樹的相關路徑，嘗試建立法西斯政權。"
 RULE_COMMUNIST_BALTIC_AI_DESC: "AI會沿著國策樹的相關路徑，嘗試建立共產主義政權。"
 RULE_HISTORICAL_ETH_AI_DESC: "埃塞俄比亞AI將訴諸於國際聯盟抵抗意大利入侵。如若淪陷，將轉入流亡，試圖收復故土，重建埃塞俄比亞。"
 RULE_OPTION_ETH_IMPERIAL: "帝國：雄獅寧死不屈"
 RULE_ETH_IMPERIAL_AI_DESC: "埃塞俄比亞AI將在沒有國際聯盟支持的情況下，獨力抵抗意大利入侵。如若勝利，則將試圖擴張帝國。"
 RULE_OPTION_ETH_STALINIST_desc: "AI將在蘇聯的支持下轉變為共產主義，成為斯大林主義的傀儡。"
 RULE_OPTION_ETH_STALINIST: "共產主義：蘇聯援助"
 RULE_OPTION_ETH_ANARCHIST: "安那其共產主義：號召全世界"
 RULE_OPTION_ETH_ANARCHIST_desc: "AI將在全世界共產主義者和安那其主義者的支援下，使埃塞俄比亞轉變為安那其共產主義治下的聯邦。"
 RULE_OPTION_ETH_COLLABORATIONIST: "法西斯主義：合作"
 RULE_OPTION_ETH_COLLABORATIONIST_desc: "AI將與意大利暗中媾和，背刺海爾·塞拉西，使埃塞俄比亞成為法西斯的傀儡。"
 RULE_OPTION_ETH_INDEPENDENT_FASCIST: "法西斯主義：獨立"
 RULE_OPTION_ETH_INDEPENDENT_FASCIST_desc: "AI將與意大利暗中媾和，背刺海爾·塞拉西，使埃塞俄比亞成為法西斯的傀儡。不過，該國將試圖掙脫束縛，成為獨立的法西斯主義國家。 "
 RULE_HISTORICAL_SWI_AI_DESC: "瑞士將保持中立，通過民兵衛隊和防禦工事以御外敵。僅在戰事接近尾聲時，該國才會為盟國提供一些支持。"
 RULE_OPTION_SWI_ALLIED_DEMOCRATIC: "結盟性民主主義"
 RULE_OPTION_SWI_ALLIED_DEMOCRATIC_AI_DESC: "AI將把瑞士武裝到牙齒，與世界主要民主國家保持一致，並最終打破中立，支持同盟國。"
 RULE_OPTION_SWI_EXPANSIONIST_DEMOCRATIC: "擴張性民主主義"
 RULE_OPTION_SWI_EXPANSIONIST_DEMOCRATIC_AI_DESC: "AI將試圖說服鄰近地區加入邦聯，並武裝全國，以防擁有國拒絕地區獨立。"
 RULE_OPTION_SWI_IMPERIAL: "帝國主義"
 RULE_OPTION_SWI_IMPERIAL_AI_DESC: "AI將拋棄中立民主傳統，支持軍國擴張主義的政權，併成立阿爾卑斯保護國。"
 RULE_OPTION_SWI_FASCIST: "法西斯主義"
 RULE_OPTION_SWI_FASCIST_AI_DESC: "AI將使瑞士與德國結盟，並逐步法西斯化。該國最終將加入軸心國，或是成為德國傀儡。"
 RULE_GROUP_GENERAL_UI: "用戶界面"
 OBSOLETE_FOCUS_BRANCHES_VISIBILITY: "顯示已不可用的國策樹分支"
 RULE_OPTION_HIDE: "隱藏"
 RULE_OPTION_HIDE_DESC: "適當地隱藏一部分已不可用的國策樹分支使國策樹界面更加便於瀏覽。"
 RULE_OPTION_SHOW: "顯示"
 RULE_OPTION_SHOW_DESC_DESC: "已不可用的國策樹分支始終可見。"
