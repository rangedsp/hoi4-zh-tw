 RULE_GROUP_PEACE_SCORE: "和談分數分配"
 PEACE_SCORE_TO_OVERLORD: "傀儡國給宗主國"
 RULE_OPTION_PEACE_SCORE_TO_OVERLORD_YES_DESC: "傀儡國將部分和談分數轉交給宗主國。其比例受到自身自治度等級的影響。"
 RULE_OPTION_PEACE_SCORE_TO_OVERLORD_NO_DESC: "傀儡國保留戰爭期間獲得的全部和談分數。"
 PEACE_SCORE_TO_FACTION_LEADER: "陣營成員給陣營領袖"
 RULE_OPTION_PEACE_SCORE_TO_FACTION_LEADER_YES_DESC: "陣營成員將10%的和談分數轉交給陣營領袖。"
 RULE_OPTION_PEACE_SCORE_TO_FACTION_LEADER_NO_DESC: "陣營成員保留戰爭期間獲得的全部和談分數。"
 PEACE_SCORE_RESET_LOW_SCORES: "低分再分配"
 RULE_OPTION_PEACE_SCORE_RESET_LOW_SCORES_YES_DESC: "戰爭貢獻度低於5%的戰勝國會將全部的分數轉交給其他戰勝國。\n如果不存在任何戰爭貢獻度不低於10%戰勝國則不生效。\n對人類玩家不生效。"
 RULE_OPTION_PEACE_SCORE_RESET_LOW_SCORES_NO_DESC: "所有戰勝國保留戰爭期間獲得的全部和談分數。"
 RULE_HISTORICAL_SWE_AI_DESC: "AI將試圖在加強瑞典軍力的同時保持中立和民主。該國將謹小慎微，避免捲入與軸心國和共產國際的衝突，但在戰爭晚期可能向同盟國提供有限的支援。"
 RULE_OPTION_SWE_DEM_ALT: "虛構民主主義"
 RULE_OPTION_SWE_DEM_ALT_DESC: "瑞典AI將會選擇民主主義國策樹，但將加快重整軍備並實施右傾政策，從而更加積極地參與戰爭。"
 RULE_OPTION_SWE_COMMUNISM: "共產主義"
 RULE_OPTION_SWE_COMMUNISM_DESC: "瑞典AI會選擇共產主義國策樹，並與軸心國或同盟國結盟。"
 RULE_OPTION_SWE_FASCIST_INDEPENDENT: "獨立法西斯主義"
 RULE_OPTION_SWE_FASCIST_INDEPENDENT_DESC: "瑞典AI會沿著法西斯主義路徑，保持獨立，並試圖建立大北歐王國。"
 RULE_OPTION_SWE_FASCIST_PUPPET: "順從的法西斯專員轄區"
 RULE_OPTION_SWE_FASCIST_PUPPET_DESC: "瑞典AI會沿著法西斯主義路徑，從屬與德國並對宗主保持順從。"
 RULE_OPTION_SWE_FASCIST_PUPPET_BACKSTABBER: "反叛的法西斯專員轄區"
 RULE_OPTION_SWE_FASCIST_PUPPET_BACKSTABBER_DESC: "瑞典AI會沿著法西斯主義路徑，從屬於德國並在時機來臨時掙脫枷鎖。"
 RULE_OPTION_SWE_UNALIGNED: "君主制"
 RULE_OPTION_SWE_UNALIGNED_DESC: "瑞典AI會沿著中立主義國策樹路徑，將國王迎回權力寶座，並試圖建立大北歐王國。"
 RULE_OPTION_SWE_DEMOCRATIC_NORDIC_DEFENCE_COUNCIL: "北歐防務理事會"
 RULE_OPTION_SWE_DEMOCRATIC_NORDIC_DEFENCE_COUNCIL_DESC: "AI會試圖建立北歐防務理事會，保衛北歐諸國。"
 RULE_OPTION_NOR_STALINIST: "斯大林主義"
 RULE_OPTION_NOR_STALINIST_AI_DESC: "AI將試圖提升共產主義的支持率，同時影響挪威，與其一同和斯大林控制的蘇維埃聯盟結盟。如果斯大林已下臺，則與最大的非託派共產主義國家結盟。"
 RULE_OPTION_NOR_TROSTSKYIST: "托洛茨基主義者"
 RULE_OPTION_NOR_TROSTSKYIST_AI_DESC: "AI將試圖讓列夫·托洛茨基留在挪威，並遵循他的共產主義原則對抗由斯大林主義者控制的蘇維埃聯盟，並在托洛茨基成為蘇聯領導人時與之結盟。"
 RULE_OPTION_NOR_FASCIST: "民族統一黨"
 RULE_OPTION_NOR_FASCIST_AI_DESC: "AI會放任法西斯主義影響逐漸增長，最終與第三帝國結盟。如果德國不再是法西斯主義國家，則會單獨行動。"
 RULE_OPTION_NOR_MONARCHIST: "君主主義者"
 RULE_OPTION_NOR_MONARCHIST_AI_DESC: "AI將施壓哈康七世，解散大議會，將挪威轉為寡頭君主制。"
 RULE_HISTORICAL_FIN_AI_DESC: "芬蘭AI會盡可能遵循史實事件鏈。"
 RULE_HISTORICAL_DEN_AI_DESC: "丹麥AI會盡可能遠離衝突並遵循史實事件鏈。該國如果成為附屬國，其將嘗試爭取國內外支持來最終恢復獨立。"
 RULE_OPTION_DEN_REARMAMENT: "丹麥軍備重整"
 RULE_OPTION_DEN_REARMAMENT_AI_DESC: "丹麥將努力尋求與更強大的國家結盟，並試圖抵禦任何入侵企圖。"
 RULE_OPTION_DEN_MONARCHIST: "擴張主義君主制"
 RULE_OPTION_DEN_MONARCHIST_AI_DESC: "克里斯蒂安十世國王將不擇手段地控制北歐其他國家，以確保自然資源並加強丹麥的軍事實力。"
 RULE_OPTION_DEN_FASCIST: "法西斯丹麥"
 RULE_OPTION_DEN_FASCIST_AI_DESC: "法西斯黨將試圖奪取丹麥政權，重建昔日的北海帝國。"
 RULE_HISTORICAL_ICE_AI_DESC: "冰島AI會試圖保持中立，並在需要時尋求美國保護。"
 RULE_OPTION_ICE_SUPPORT: "支援丹麥"
 RULE_OPTION_ICE_SUPPORT_AI_DESC: "冰島AI會試圖支援丹麥，共同抵禦來犯者。"
 RULE_OPTION_ICE_FASCIST: "法西斯主義"
 RULE_OPTION_ICE_FASCIST_AI_DESC: "冰島AI會廢黜丹麥國王，並試圖在北海建立一個法西斯帝國。"
 RULE_OPTION_ICE_COMMUNIST: "共產主義"
 RULE_OPTION_ICE_COMMUNIST_AI_DESC: "冰島AI會廢除君主制，並在冰島建立一個共產主義國家。"
 RULE_HISTORICAL_NOR_AI_DESC: "挪威將試圖保持民主並在德國入侵時與同盟國一同抵抗，且淪陷後將作為流亡政府繼續戰鬥。"
 ### SOUTH AMERICA ###
 CHL_AI_BEHAVIOR: "@CHL 智利"
 RULE_HISTORICAL_CHL_AI_DESC: "AI智利會強化民主制度，選擇支持社會民主主義政策，同時維持權力平衡，並且只會在被拖入全球性的鬥爭時參與其中。"
 RULE_OPTION_CHL_COMMUNIST: "智利社會主義共和國"
 RULE_OPTION_CHL_COMMUNIST_AI_DESC: "AI智利會利用法西斯主義者造成的動盪要求阿圖羅·亞歷山德里辭職，並增強總統權力，以建立一個共產主義國家。"
 RULE_OPTION_CHL_OPERATION_BOLIVAR: "配合玻利瓦爾計劃"
 RULE_OPTION_CHL_OPERATION_BOLIVAR_DESC: "AI智利會走上法西斯之路，在有機會時選擇支持德意志國，最終走向戰爭，並嘗試重建曾經的智利王國。"
 RULE_OPTION_CHL_PAN_HISPANISM: "泛西班牙主義"
 RULE_OPTION_CHL_PAN_HISPANISM_DESC: "AI智利會走上法西斯之路，但最終不會站隊任何世界列強。他們之後會征服西班牙裔世界，或是通過外交手段將其統一。"
 RULE_OPTION_CHL_ANTI_IMPERIALISM: "反帝國主義"
 RULE_OPTION_CHL_ANTI_IMPERIALISM_DESC: "AI智利會選擇支持各類馬普切組織，最終讓其控制國家。之後它將繼續討伐帝國主義，對抗中南美洲被歐裔控制的國家。"
 RULE_OPTION_CHL_LE_DELUGE: "阿勞卡尼亞和巴塔哥尼亞王國"
 RULE_OPTION_CHL_LE_DELUGE_DESC: "AI智利會追求傳統，進而將亞歷山德里趕下臺，讓伊瓦涅斯接替他的位置。它接下來會進入內戰，在內戰中，安托萬三世會重建過去的阿勞卡尼亞和巴塔哥尼亞王國，宣稱自己是拿破崙的繼承人。"
 BRA_AI_BEHAVIOR: "@BRA 巴西"
 RULE_HISTORICAL_BRA_AI_DESC: "瓦加斯會嘗試謹慎地消滅巴西的政治反對派以繼續掌權，最終加入同盟國並與美國合作。"
 RULE_OPTION_FASCISM: "法西斯主義"
 RULE_FASCISM_BRA_AI_DESC: "整合運動會背叛瓦加斯，任命一位新的領袖。接下來，他們會嘗試通過外交和武力支配南美洲。"
 RULE_DEMOCRATIC_BRA_AI_DESC: "巴西會通過結束緊急狀態來推翻瓦加斯。接下來，它會嘗試改革國家，增強民主參與，最終與美國合作對抗軸心國。"
 RULE_OPTION_MONARCHIST_HENRIQUE: "君主主義者-唐·佩德羅·恩裡克"
 RULE_OPTION_MONARCHIST_HENRIQUE_DESC: "AI會嘗試推舉佩德羅·恩裡克為皇位合法繼承人來重建巴西帝國。接下來它會嘗試征服或整合巴西的鄰國。"
 RULE_OPTION_MONARCHIST_ALCANTARA: "君主主義者-唐·佩德羅·德·阿爾坎塔拉"
 RULE_OPTION_MONARCHIST_ALCANTARA_DESC: "AI會嘗試推舉佩德羅·德·阿爾坎塔拉為皇位合法繼承人來重建巴西帝國。接下來它會嘗試通過外交或武力與葡萄牙再次統一。"
 RULE_OPTION_BRA_COMMUNIST_STALINISM: "共產主義者-路易斯·卡洛斯·普列斯特斯"
 RULE_OPTION_BRA_COMMUNIST_STALINISM_DESC: "巴西會嘗試推翻民主政府，並以路易斯·卡洛斯·普列斯特斯領導的，與蘇聯結盟的共產主義政府取而代之。接下來它會加入共產國際並協助蘇聯。"
 RULE_OPTION_BRA_COMMUNIST_INDEPENDENT: "共產主義者-全國解放聯盟"
 RULE_OPTION_BRA_COMMUNIST_INDEPENDENT_DESC: "巴西將重建全國解放聯盟並試圖推翻民主政府。它將被全國解放聯盟委員會取代，隨後該委員會將實施共產主義改革，並最終試圖解放整個大陸，擺脫法西斯主義和帝國主義的控制。"
 ARG_AI_BEHAVIOR: "@ARG 阿根廷"
 RULE_HISTORICAL_ARG_AI_DESC: "AI會嘗試避免參戰，並逐步與英美合作，以此遵循史實事件。"
 RULE_FASCISM_ARG_AI_DESC: "AI會嘗試轉向法西斯主義，並加入軸心國，在南美開闢一條新戰線。"
 RULE_COMMUNIST_ARG_AI_DESC: "AI會嘗試轉向共產主義，並加入共產國際，專注於在南美傳播他們的意識形態。"
 RULE_DEMOCRATIC_ARG_AI_DESC: "AI會嘗試轉向民主主義，並加入同盟國，在南美守護民主與自由。"
 RULE_ALLOW_RELEASE_NATIONS_NOT_CHILE_TOOLTIP: "§Y[CHL.GetName]§!只能通過§Y討伐帝國主義§!國策或是§Y國策樹§!中的§Y民主主義§!或§Y共產主義§!分支來釋放該國家。"
 RULE_ALLOW_RELEASE_NATIONS_NOT_QUEBEC_TOOLTIP: "§Y[CAN.GetName]§!只能通過完成§Y$CAN_forced_quebec_conscription$§!或§Y$CAN_compromise_with_quebec$§!來釋放這個國家。"
 RULE_OPTION_HISTORICAL_PAR_AI_DESC: "AI將遠離國際政治，專注於內部問題，走出動盪，遠離戰爭。"
 RULE_OPTION_COMMUNIST_PAR_AI_DESC: "AI將維持拉斐爾·佛朗哥的共產主義政府，並就查科戰爭尋求報復玻利維亞。"
 RULE_OPTION_COMMUNIST_PAR_AI: "共產主義"
 RULE_OPTION_DEMOCRATIC_PAR_AI_DESC: "AI將對抗拉斐爾·弗朗哥的政變並引爆內戰以嘗試保持民主政府。"
 RULE_OPTION_DEMOCRATIC_PAR_AI: "民主主義"
 URG_AI_BEHAVIOR: "@URG 烏拉圭"
 RULE_OPTION_HISTORICAL_URG_AI_DESC: "AI將試圖遠離國際事務，專注於國內工業化，使紅黨掌權。在戰爭末期才會加入同盟國。"
 RULE_OPTION_DEMOCRATIC_ALT_AI_URG_DESC: "AI將試圖遠離國際事務，專注於國內工業化，使白黨掌權。在戰爭末期才會加入同盟國。"
 RULE_OPTION_DEMOCRATIC_ALT_AI: "民主主義-虛構"
 RULE_OPTION_FASCIST_AI_URG_DESC: "AI將與軸心國結盟，使該國成為征服南美的跳板。"
 RULE_OPTION_FASCIST_URG_AI: "法西斯主義"
 RULE_OPTION_DISPERSE_MILITARY_POWER: "分散軍方勢力"
 RULE_OPTION_DISPERSE_MILITARY_POWER_AI_DESC: "AI將在國際事務中保持中立，並嘗試發展自己的國家，除非受到挑釁。"
 RULE_OPTION_DICTATORSHIP_NEUTRAL: "中立獨裁"
 RULE_OPTION_DICTATORSHIP_NEUTRAL_AI_DESC: "AI將走上威權獨裁的道路，但試圖保持中立"
 DICTATORSHIP_WARMONGER: "好戰者"
 RULE_OPTION_DICTATORSHIP_WARMONGER_AI_DESC: "AI將走上威權獨裁的道路，並試圖擴張領土"
 PAR_AI_BEHAVIOR: "@PAR 巴拉圭"
 RULE_ALLOW_RELEASE_NATIONS_NO_SLOVAKIA_TOOLTIP: "§Y[HUN.GetName]§!和§Y[CZE.GetName]§!只能通過事件或國策釋放此國家。"
 AUS_AI_BEHAVIOR: "@AUS 奧地利"
 RULE_OPTION_HISTORICAL_AUS_AI_DESC: "AI將轉變為法西斯主義並嘗試在祖國陣線的領導下延緩德奧合併。"
 RULE_OPTION_MONARCHIST_PUPPET_AUS_AI: "君主主義-臣服"
 RULE_OPTION_MONARCHIST_PUPPET_AUS_AI_DESC: "AI將嘗試通過重建其軍隊，並要求佔據故土之國家臣服，以重組奧匈帝國。"
 RULE_OPTION_MONARCHIST_ANNEX_AUS_AI: "君主主義-吞併"
 RULE_OPTION_MONARCHIST_ANNEX_AUS_AI_DESC: "AI將嘗試通過重建其軍隊，進而擴張及吞併所失之故土，以重組奧匈帝國。"
 RULE_OPTION_AUS_NEUTRALITY_FEDERATIVE_AI: "中立主義聯邦"
 RULE_OPTION_AUS_NEUTRALITY_FEDERATIVE_AI_DESC: "AI會嘗試在中立主義統治下，通過邀請其他多瑙河流域的國家建立多瑙聯邦。"
 RULE_OPTION_AUS_COMMUNIST_SOV_ALIGNED_AI: "蘇維埃奧地利"
 RULE_OPTION_AUS_COMMUNIST_SOV_ALIGNED_AI_DESC: "AI會嘗試轉向共產主義，推翻政府並與蘇聯結盟，加入共產國際。"
 RULE_OPTION_AUS_COMMUNIST_AI: "共產主義"
 RULE_OPTION_AUS_COMMUNIST_AI_DESC: "AI會嘗試轉向共產主義並推翻政府。他們會嚴格遵守奧地利馬克思主義，創建自己的陣營。"
 RULE_OPTION_AUS_DEMOCRATIC_FEDERATIVE_AI: "奧地利民主主義-聯邦派"
 RULE_OPTION_AUS_DEMOCRATIC_FEDERATIVE_AI_DESC: "AI會嘗試在民主主義統治下，通過邀請其他多瑙河流域的國家建立多瑙聯邦。"
 RULE_OPTION_AUS_DEMOCRATIC_ALLIES_AI: "奧地利民主主義-同盟國"
 RULE_OPTION_AUS_DEMOCRATIC_ALLIES_AI_DESC: "AI會嘗試通過重建奧地利的民主主義加入同盟國。"
 RULE_OPTION_AUS_DEMOCRATIC_ALPINE_FEDERATION_AI: "奧地利民主主義-阿爾卑斯聯邦"
 RULE_OPTION_AUS_DEMOCRATIC_ALPINE_FEDERATION_AI_DESC: "AI會嘗試重建奧地利的民主，並建立阿爾卑斯聯邦。"
 RULE_OPTION_AUS_ANTI_ANSCLUSS_STRESS_AI: "不同的歷史-自由奧地利！"
 RULE_OPTION_AUS_ANTI_ANSCLUSS_STRESS_AI_DESC: "AI會很大程度上遵循史實路徑，但會嘗試以一切手段延緩德奧合併，為了他們的獨立而戰，直到那悲慘的結局到來。這可能會對戰爭的爆發帶來一些挑戰和延遲。"
 BEL_AI_BEHAVIOR: "@BEL 比利時"
 RULE_OPTION_HISTORICAL_BEL_AI: "史實"
 RULE_OPTION_HISTORICAL_BEL_AI_DESC: "比利時一開始會試圖抵禦攻擊，但隨後會撤退到剛果並從那裡繼續戰爭。"
 RULE_OPTION_NATIONALIST_FASCIST_BEL_AI: "民族法西斯主義（雷克斯主義）"
 RULE_OPTION_NATIONALIST_FASCIST_BEL_AI_DESC: "AI將選擇雷克斯主義路線（法西斯主義），建立一個高度工業化的國家，然後在戰爭中協助法西斯主義者。"
 RULE_OPTION_EXPANSIONIST_FASCIST_BEL_AI: "擴張法西斯主義（VNV）"
 RULE_OPTION_EXPANSIONIST_FASCIST_BEL_AI_DESC: "AI將選擇佛蘭德民族法西斯主義路線，激進地嘗試統一低地國家，然後轉向對付法國。"
 RULE_OPTION_DEFENSIVE_DEMOCRAT_BEL_AI: "防禦性民主主義"
 RULE_OPTION_DEFENSIVE_DEMOCRAT_BEL_AI_DESC: "AI將擺脫他們軟弱的國王的束縛，並不惜一切代價試圖保衛比利時。"
 RULE_OPTION_COMMUNIST_BEL_AI: "社會主義"
 RULE_OPTION_COMMUNIST_BEL_AI_DESC: "AI將允許工黨贏得選舉，然後逐漸開始與共產主義陣營靠近。"
 COG_AI_BEHAVIOR: "@COG 比屬剛果"
 RULE_OPTION_HISTORICAL_COG_AI_DESC: "剛果AI將留在比利時並儘可能利用與該國的關係，最終尋求增加自治權"
 RULE_OPTION_COG_DEM_INDEPENDENCE_AI: "民主解放運動"
 RULE_OPTION_COG_DEM_INDEPENDENCE_AI_DESC: "剛果AI將嘗試儘快以和平方式實現獨立，繼而領導非洲民主運動。"
 RULE_OPTION_COG_COM_INDEPENDENCE_AI: "共產主義解放運動"
 RULE_OPTION_COG_COM_INDEPENDENCE_AI_DESC: "剛果AI將嘗試以和平手段獲得獨立，隨後他們將試圖在整個非洲傳播共產主義。"
 RULE_OPTION_COG_COM_REVOLUTION_AI: "辛巴革命"
 RULE_OPTION_COG_COM_REVOLUTION_AI_DESC: "剛果AI將嘗試通過暴力革命和隨後的內戰擺脫殖民者的統治，隨後他們將試圖在整個非洲傳播共產主義。"
 AFG_AI_BEHAVIOR: "@AFG 阿富汗"
 RULE_OPTION_HISTORICAL_AFG_AI_DESC: "阿富汗AI將試圖在一段時間內保持中立，並嘗試同時從同盟國、共產國際和軸心國獲得經濟上的好處。"
 RULE_OPTION_FASCISM_AFG_AI_DESC: "阿富汗AI將嘗試罷黜查希爾·沙阿國王，由阿曼努拉·汗取而代之，繼而努力實現國家的快速現代化。而後，阿富汗將尋求在軸心國陣營的協助下擴張其邊界。"
 RULE_OPTION_DEMOCRATIC_AFG_AI_DESC: "阿富汗AI將在推進更激進改革之前，迫使查希爾·沙阿國王罷黜他的叔父們。阿富汗將最終變成一個民主國家，並加入同盟國。"
 RULE_OPTION_COMMUNIST_AFG_AI_DESC: "阿富汗AI將會順從於蘇聯，並在實施極端的改革後轉變為一個共產主義國家。接下來，阿富汗將加入共產國際並嘗試奪取中亞。"
 RULE_OPTION_CALIPHATE_AFG: "新哈里發國"
 RULE_OPTION_CALIPHATE_AFG_AI_DESC: "阿富汗AI將嘗試罷黜查希爾·沙阿國王，由法基爾·伊匹取而代之，繼而試圖逆轉國家的現代化進程。而後，阿富汗將尋求在軸心國陣營的協助下擴張其邊界。"
 RULE_OPTION_EMPIRE_AFG: "第二阿富汗帝國"
 RULE_OPTION_EMPIRE_AFG_AI_DESC: "阿富汗AI將嘗試罷黜查希爾·沙阿國王，由埃米爾賽義德·米爾·穆罕默德·阿利姆汗取而代之，並試圖統一阿富汗各部落。而後，阿富汗將尋求進一步拓展其邊界，構建一個新的阿富汗帝國。"
 RULE_OPTION_MUGHAL_AFG: "新莫臥兒帝國"
 RULE_OPTION_MUGHAL_AFG_AI_DESC: "阿富汗AI將嘗試罷黜查希爾·沙阿國王，由米爾扎·胡爾希德·賈赫·巴哈杜爾取而代之，並試圖重建莫臥兒帝國。而後，將尋求進一步拓展其邊界，最終建立一個新的帖木兒帝國。"
 IRQ_AI_BEHAVIOR: "@IRQ 伊拉克"
 RULE_OPTION_HISTORICAL_IRQ_AI: "史實"
 RULE_OPTION_HISTORICAL_IRQ_AI_DESC: "AI會接連發動歷史上的政變，直至金方陣奪權並與英國開戰，最終復辟君主制並投降。"
 RULE_OPTION_FASCISM_IRQ_AI: "法西斯——金方陣"
 RULE_OPTION_FASCISM_IRQ_AI_DESC: "AI會嘗試儘快讓金方陣掌權，然後加入軸心國對抗英國。然後他們會嘗試吞併相鄰的阿拉伯領土。"
 RULE_OPTION_HASHEMITE_IRQ_AI: "哈希姆——中立主義"
 RULE_OPTION_HASHEMITE_IRQ_AI_DESC: "AI會嘗試維持對英國的忠誠，同時建立對該區域的權力，逐步接管領土的行政權，最終建立哈希姆阿拉伯聯邦。"
 RULE_OPTION_SIDQI_IRQ_AI: "巴克爾·西德基——中立主義"
 RULE_OPTION_SIDQI_IRQ_AI_DESC: "巴克爾·西德基會發動他在歷史上發動的政變，但不會被暗殺。該政府會與伊朗和土耳其合作，建立一個區域性國家集團。"
 RULE_OPTION_KURDISTAN_IRQ_AI: "庫爾德斯坦獨立"
 RULE_OPTION_KURDISTAN_IRQ_AI_DESC: "伊拉克北部的庫爾德人會發起針對伊拉克政府的叛亂。如果他們成功，會嘗試統一土耳其和伊朗的庫爾德土地。"
 RULE_ALLOW_RELEASE_NATIONS_NOT_RAJ_TOOLTIP: "§Y[RAJ.GetName]§!只能通過完成§Y$RAJ_a_secular_state$§!，§Y$RAJ_incorporation_of_the_east_india_company$§!，§Y$RAJ_hindutva$§!，§Y$RAJ_netaji$§!或§Y分治§!來釋放。"
 PER_AI_BEHAVIOR: "@PER 伊朗"
 RULE_OPTION_HISTORICAL_PER_AI: "史實"
 RULE_OPTION_HISTORICAL_PER_AI_DESC: "AI在遭到入侵併立即投降前會實施政治改革並增強軍隊。"
 RULE_OPTION_IMPERIAL_PER_AI: "帝國——中立主義"
 RULE_OPTION_IMPERIAL_PER_DESC: "AI會建立以禮薩·沙·巴列維為元首的君主專制制度，並致力於在中東發起征服行動。"
 RULE_OPTION_DEMOCRATIC_PER_AI: "民主主義——君主立憲制"
 RULE_OPTION_DEMOCRATIC_PER_DESC: "AI會通過憲法限制沙阿權力，並走上民主主義之路，最終嘗試加入民主陣營。"
 RULE_OPTION_COMMUNISM_PER_AI: "共產主義——伊朗人民黨"
 RULE_OPTION_COMMUNISM_PER_DESC: "AI會發起革命，讓與蘇聯立場一致的伊朗人民黨掌權。該共產主義政權會嘗試破壞該區域的穩定。"
 RULE_OPTION_FASCISM_PER_AI: "法西斯——伊朗國家社會主義工人黨"
 RULE_OPTION_FASCISM_PER_DESC: "AI會團結國內的民族主義者，組建伊朗國家社會主義工人黨，建立法西斯政權。它會嘗試加入法西斯陣營，並對鄰國宣戰。"
 PHI_AI_BEHAVIOR: "@PHI 菲律賓"
 RULE_OPTION_HISTORICAL_PHI_AI: "史實"
 RULE_OPTION_HISTORICAL_PHI_AI_DESC: "菲律賓將與美國保持一致立場。"
 RULE_OPTION_FLEXIBLE_PHI_AI: "隨機應變"
 RULE_OPTION_FLEXIBLE_PHI_AI_DESC: "菲律賓將利用美國和日本之間的競爭，最大化其潛在利益。"
 RULE_OPTION_FASCIST_PHI_AI: "法西斯主義"
 RULE_OPTION_FASCIST_PHI_AI_DESC: "菲律賓將站在日本一方，乃至使其自身陷入法西斯主義的泥潭。"
 RULE_OPTION_MONARCHIST_PHI_AI: "南洋西裔"
 RULE_OPTION_MONARCHIST_PHI_AI_DESC: "菲律賓的選舉將被推翻，由$PHI_neutrality_party_long$接管，直到最終在友好拉美國家的支持下爆發獨立戰爭併成為君主制國家。"
 RULE_OPTION_COMMUNIST_PHI_AI: "海洋共產主義"
 RULE_OPTION_COMMUNIST_PHI_AI_DESC: "紅太陽將在菲律賓升起，海洋共產主義將在此紮根併力求將平等精神傳播至世界各大洋。"
 RULE_OPTION_MACARTHUR_PHI_AI: "宣佈軍事緊急狀態"
 RULE_OPTION_MACARTHUR_PHI_AI_DESC: "菲律賓政府倒臺後，一位軍事人物將挺身而出並領導該國對抗所有侵略者。"
 RULE_ALLOW_RELEASE_NATIONS_ALL_NATIONS_SUDETENLAND_TOOLTIP: "該國家永遠不會被釋放。"
 RULE_ALLOW_RELEASE_NATIONS_ALL_NATIONS_RUTHENIA_TOOLTIP: "該國家永遠不會被釋放。"
 #AST_AI_BEHAVIOR: "@AST Australia"
 RULE_OPTION_AST_AI_RANDOM_TAOG_HISTORICAL: "史實"
 RULE_OPTION_AST_AI_RANDOM_TAOG_HISTORICAL_DESC: "一個根基牢固但不夠穩定的民主制度，給了澳大利亞向外眺望更廣闊世界的基礎，併為即將到來的風暴做好準備。"
 RULE_OPTION_AST_ADELA_FASCIST_TAOG_AI: "法西斯主義者-潘克赫斯特-沃爾什"
 RULE_OPTION_AST_ADELA_FASCIST_TAOG_AI_DESC: "阿德拉·潘克赫斯特·沃爾什領導著澳大利亞，她的初始目標是進一步擴張大英帝國，儘管這個擴張後的帝國最終由誰來繼承，仍然是一個懸而未決的問題。"
 RULE_OPTION_AST_PETER_FASCIST_TAOG_AI: "法西斯主義者-斯蒂芬森"
 RULE_OPTION_AST_PETER_FASCIST_TAOG_AI_DESC: "澳大利亞優先要求一個獨立的澳大利亞，能夠自由塑造她自己的未來。"
 RULE_OPTION_AST_RANDOM_DEMOCRATIC_TAOG_AI: "隨機社會民主主義者"
 RULE_OPTION_AST_RANDOM_DEMOCRATIC_TAOG_AI_DESC: "在民主的澳大利亞，人民的聲音最為重要，國家的命運取決於人民的意願。"
 RULE_OPTION_AST_ANTI_COMMONWEALTH_COMMUNIST_TAOG_AI: "反英共產主義者"
 RULE_OPTION_AST_ANTI_COMMONWEALTH_COMMUNIST_TAOG_AI_DESC: "遙遠的宗主國已決定澳大利亞的命運太久了。現在是時候甩掉帝國的枷鎖……並在這一過程中解放其他人。"
 RULE_OPTION_AST_COMINTERN_COMMUNIST_TAOG_AI: "共產國際共產主義者"
 RULE_OPTION_AST_COMINTERN_COMMUNIST_TAOG_AI_DESC: "只有在團結中，共產主義的烏托邦才能實現，因為這是全世界工人革命的道路。"
 INS_ai_behavior: "@INS 荷屬東印度"
 RULE_OPTION_TRUE_HISTORICAL_INS_AI: "史實"
 RULE_OPTION_TRUE_HISTORICAL_INS_AI_DESC: "AI會忠於荷蘭，但將在面對日本佔領後發起革命。"
 RULE_OPTION_LOYALIST_INS_AI: "忠誠"
 RULE_OPTION_LOYALIST_INS_AI_DESC: "AI會忠於荷蘭，只會通過蘇塔爾喬請願和平獨立，或維持殖民秩序。"
 RULE_OPTION_REVOLUTION_DEMOCRATIC_INS_AI: "沙里爾的革命（民主主義）"
 RULE_OPTION_REVOLUTION_DEMOCRATIC_INS_AI_DESC: "AI會提前發起革命。蘇丹·沙里爾將掌權，並建立民主政府。"
 RULE_OPTION_REVOLUTION_UNALIGNED_INS_AI: "蘇加諾的革命（中立主義）"
 RULE_OPTION_REVOLUTION_UNALIGNED_INS_AI_DESC: "AI會提前發起革命。蘇加諾將維持權力，反對派運動會停止。"
 RULE_OPTION_REVOLUTION_COMMUNIST_INS_AI: "馬六甲的革命（共產主義）"
 RULE_OPTION_REVOLUTION_COMMUNIST_INS_AI_DESC: "AI會提前發起革命。陳馬六甲將發動政變建立共產主義政府，並在之後將革命傳遍太平洋。"
