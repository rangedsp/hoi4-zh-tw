 RULE_OPTION_FASCIST_HISTORICAL: "法西斯主義-史實"
 RULE_FASCIST_HISTORICAL_ITA_AI_DESC: "意大利AI會盡可能遵循史實事件鏈。"
 RULE_OPTION_FASCIST_ALTERNATE: "法西斯主義-虛構"
 RULE_FASCIST_ALTERNATE_ITA_AI_DESC: "意大利AI會沿著國策樹的相關路徑，嘗試在加入軸心國前成立與西班牙的聯盟。"
 RULE_OPTION_ALT_FASCIST_BALBO: "非傳統法西斯主義 - 伊塔洛·巴爾博"
 RULE_ALT_FASCIST_BALBO_ITA_AI_DESC: "意大利AI會嘗試推翻墨索里尼，代之以伊塔洛·巴爾博，尋求獨立的前進道路。"
 RULE_OPTION_ALT_FASCIST_GRANDI: "非傳統法西斯主義 - 迪諾·格蘭迪"
 RULE_ALT_FASCIST_GRANDI_ITA_AI_DESC: "意大利AI會嘗試推翻墨索里尼，代之以迪諾·格蘭迪，尋求加強與同盟國的聯繫。"
 RULE_OPTION_ITA_MONARCHIST_ROMAN_EMPIRE: "君主派 - 羅馬帝國"
 RULE_OPTION_ITA_MONARCHIST_ROMAN_EMPIRE_AI_DESC: "維托里奧·埃馬努埃萊國王會帶領意大利走向專制君主制，試圖一統“我們的海”，重建羅馬帝國。"
 RULE_OPTION_ITA_CHRISTIAN_DEMOCRACY: "基督教民主"
 RULE_OPTION_ITA_CHRISTIAN_DEMOCRACY_AI_DESC: "維托里奧·埃馬努埃萊國王會廢黜墨索里尼，獨立組建派系，帶領意大利走向阿爾奇德·德·加斯佩裡及基督教民主黨所偏好的君主立憲制。"
 RULE_OPTION_ITA_COMMUNIST_PLAN: "意式共產主義"
 RULE_OPTION_ITA_COMMUNIST_PLAN_AI_DESC: "意大利反法西斯分子將聯手武裝推翻法西斯政權，建立共產主義政府，廢除殖民事業，並試圖加入共產國際。"
 RULE_OPTION_ITA_DEMOCRATIC_PLAN: "意式社會主義"
 RULE_OPTION_ITA_DEMOCRATIC_PLAN_AI_DESC: "意大利反法西斯分子將聯手武裝推翻法西斯政權，建立社會民主主義政府，廢除殖民事業，並試圖與在非洲的前殖民地組建邦聯。"
 RULE_OPTION_FIN_FASCIST_PLAN: "法西斯主義"
 RULE_OPTION_FIN_FASCIST_PLAN_DESC: "以愛國人民運動為首的芬蘭右翼將推翻昔日的保守民主制度，試圖加強與德國的聯繫，依靠黑衫隊和白衛軍等實現強軍，並按大芬蘭理念擴張國家邊界。"
 RULE_OPTION_FIN_COMMUNIST_PLAN: "共產主義"
 RULE_OPTION_FIN_COMMUNIST_PLAN_DESC: "在蘇聯的幫助下，共產黨將組織芬蘭左翼運動，聯合社會主義者、社會民主主義者以及各路左派來對政府發動政變，領導國家步入一場全新的革命，以此對抗外國資本主義和法西斯的威脅。"
 RULE_OPTION_FIN_DEMOCRATIC_PLAN: "民主主義"
 RULE_OPTION_FIN_DEMOCRATIC_PLAN_DESC: "芬蘭社民黨將向芬蘭人民發出呼籲，領導芬蘭政治發生一場激烈但不流血的變革。屆時，芬蘭將試圖聯合其餘西方民主列強，以維護國家主權，引領社會保守向左。"
 RULE_OPTION_GER_COMMUNIST_STALINIST: "無產階級專政"
 RULE_OPTION_GER_COMMUNIST_STALINIST_AI_DESC: "德國AI將嘗試推翻納粹並將共產主義革命帶到德國。隨後他們將嘗試建立無產階級專政。"
 RULE_OPTION_GER_COMMUNIST_SPARTACUS: "斯巴達克同盟的重生"
 RULE_OPTION_GER_COMMUNIST_SPARTACUS_AI_DESC: "德國AI將嘗試推翻納粹並將共產主義革命帶到德國。隨後他們將嘗試在新斯巴達克同盟的領導下建立一個更民主的社會主義政權，並讓共產主義革命的烈火蔓延到整個歐洲。"
 RULE_OPTION_GER_ALT_FASCIST: "虛構的法西斯主義"
