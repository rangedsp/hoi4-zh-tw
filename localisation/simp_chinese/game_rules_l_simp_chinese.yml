 RULE_ALLOW_LEND_LEASE_BLOCKED_DESC: "各國不能給其他任何國家提供租借法案。"
 RULE_ALLOW_VOLUNTEERS: "志願軍"
 RULE_ALLOW_VOLUNTEERS_FREE_DESC: "無論全球緊張度如何，各國都可以給任何國家派遣志願軍。"
