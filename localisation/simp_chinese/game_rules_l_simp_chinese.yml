 RULE_ALLOW_VOLUNTEERS_SAME_IDEOLOGY_DESC: "各國只能向擁有相同意識形態的國家派遣志願軍。"
 RULE_ALLOW_VOLUNTEERS_BLOCKED_DESC: "各國不能向外國派遣志願軍。"
 RULE_ALLOW_GUARANTEES: "保障獨立"
 RULE_ALLOW_GUARANTEES_FREE_DESC: "無論全球緊張度如何，各國可以在任何時候對任何國家保障獨立。"
 RULE_ALLOW_GUARANTEES_LIMITED_DESC: "保障獨立被全球緊張度和意識形態所限制。"
 RULE_ALLOW_GUARANTEES_SAME_IDEOLOGY_DESC: "各國只能對相同意識形態的國家保障獨立。"
 RULE_ALLOW_GUARANTEES_BLOCKED_DESC: "各國永遠不能對其他國家保障獨立。這不會影響遊戲開始時就存在的以及通過國策導致的保障獨立。"
