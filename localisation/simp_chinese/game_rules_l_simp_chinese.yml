 RULE_ALLOW_LICENSING: "生產許可"
 RULE_ALLOW_LICENSING_FREE_DESC: "各國可以從任何國家請求生產許可。"
 RULE_ALLOW_LICENSING_SAME_IDEOLOGY_DESC: "各國只能向擁有相同意識形態的國家申請生產許可。"
 RULE_ALLOW_LICENSING_SAME_FACTION_DESC: "各國只能向同一陣營內的其他國家申請生產許可。"
 RULE_ALLOW_LICENSING_BLOCKED_DESC: "除在特殊決議或者事件下，各國不能從他國申請生產許可。"
 RULE_ALLOW_LEND_LEASE: "租借法案"
 RULE_ALLOW_LEND_LEASE_FREE_DESC: "無論全球緊張度如何，各國都可以給任意國家提供租借法案。"
 RULE_ALLOW_LEND_LEASE_LIMITED_DESC: "租借法案受全球緊張度和意識形態的限制。"
