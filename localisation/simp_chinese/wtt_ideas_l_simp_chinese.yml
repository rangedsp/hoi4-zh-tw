 MAN_low_legitimacy: "低正統性"
 MAN_low_legitimacy_5_desc: "溥儀皇上是統治中國長達三百餘年的大清帝室的正統嫡裔，由於晚清政府在面對外敵侵略以及各地軍閥割據時的無能為力，他的統治在1911年被受到人民支持的辛亥革命所推翻。溥儀皇上身為被日本人扶植的滿洲帝國皇帝，其九五之尊的身份尚且未被東三省人民所普遍接受，更毋寧說在中華大地的其他地方得到承認了。\n\n我們將來定要讓皇上從日本人的手中獨立出來，並將整個中華置於他的統治下。"
