 MAN_banditry: "匪患"
 MAN_banditry_desc: "我們眼下正和游擊隊、逃兵遊勇以及共和派恐怖分子在低烈度的戰爭泥潭中糾纏，為此我們應當將安撫農村地區作為施政重點，以期剿滅這些鬍子。"
 MAN_kwantung_veto: "關東軍掣肘"
 MAN_kwantung_veto_desc: "自1905年日本人從俄國人手中奪取大連以來，駐紮於此的日本關東軍便愈發傾向政治化，其志在開疆拓土的將軍們不斷為日本蠶食著更多的中國領土。而此等行徑的巔峰，便是1932年的盛京事變後，將滿洲帝國自那些東北軍閥的割據領當中整合而出。如今關東軍依舊對這片區域施行著統治，並將其諸將的利益置於滿洲國的需求之上。\n\n為解決此問題，我們將只能在協商使日軍平等展開交往，亦或是將其武力驅逐這兩者間抉擇。"
 MAN_mamc_light: "滿洲飛行機制造株式會社-戰鬥機分部"
 MAN_mamc_medium: "滿洲飛行機制造株式會社-轟炸機分部"
 MAN_mamc_heavy: "滿洲飛行機制造株式會社-重型飛機分部"
 MAN_five_year_plan: "五年計劃"
 CHI_chinese_support: "中國的支持"
 german_chinese_tank_designer: "中德技術特派團"
 shanghai_electronics: "上海電子"
 sino_soviet_resource_surveyors: "中蘇資源勘探機構"
 MAN_arms_seized_1: "滿洲彈藥短缺"
 MAN_arms_seized_1_desc: "由於清廷策劃了一場突然襲擊並奪取了我國於其境內的部分軍械庫和彈藥庫，我們需要花費一定的時間才能重建我軍在滿洲的補給鏈。"
 MAN_underground_gun_shops: "地下工坊"
 MAN_underground_gun_shops_desc: "我們已經在諸如後院或是酒窖這樣的地方建立了一批勉強可用的小作坊以擴大裝備生產，這些地方出產的裝備也許質量不怎麼的，但數量包管夠。"
 MAN_xian_yuan: "憲原"
 #LUX_alexander_von_falkenhausen: "Alexander von Falkenhausen"
 MAN_aisin_gioro_puyi_xuantong_name: "宣統"
 MAN_the_kangde_emperor: "康德皇帝"
 MAN_the_kangde_emperor_desc: "1934年，溥儀加冕為滿洲國皇帝，稱號由“執政”改為“皇帝”，並採用新年號。此前以“大同”年號統治的他，現以康德皇帝的身份統治滿洲。"


