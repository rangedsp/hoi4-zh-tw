l_simp_chinese:
 CHI_nine_power_treaty: "九國公約"
 CHI_nine_power_treaty_desc: "由於我國至今仍然受到那些標榜在中國實現“門戶開放”的不平等條約壓迫，洋人在國境內依舊享有治外法權，同時我們也無法完全掌控我國經濟。"
 CHI_army_corruption: "軍隊腐敗"
 CHI_army_corruption_desc: "國軍內部充斥著腐敗以及裙帶關係的侵蝕，如果我們希望這支軍隊有朝一日能夠蛻變為善戰之師，那麼就必須著手推進漫長且代價高昂的軍隊改革。"
 CHI_ineffective_bureaucracy: "低效的官僚制度"
 CHI_ineffective_bureaucracy_desc: "內戰造成的混亂導致建設有效國家機制的進程被徹底破壞，僅僅因為缺乏伯樂加以提攜，便有超過三分之一的國家可用之才被閒散在中國各地。通過改革國家的選拔制度，我們將確保能夠發掘急需的人才。"
 CHI_ineffective_bureaucracy_warlord: "低效的官僚制度"
 CHI_ineffective_bureaucracy_warlord_desc: "內戰導致的混亂使得我們難以建立有效的國家機器。除非我們改革官僚機構，僱用有能力的人，並以有效的方式劃分行政區劃，否則該地區都難以得到有效的治理。"
 CHI_warlord_state_idea: "軍閥政府"
 CHI_warlord_state_idea_desc: "我們的國家遠遠沒有達到國家這個詞的定義。我們治下的人民毫不關心是在誰在統治，我們的軍隊也僅僅是私人的軍隊，對任何政權都沒有忠誠可言。這使得我們的政府無法履行任何職責，不過這也有它自己的好處。"
 CHI_warlord_state_idea_tt: "該國家精神會在完成下列任何一個國策時被移除：§Y權力鬥爭§!、§Y延安事變§!或§Y逐鹿天下§!"
 CHI_incompetent_officers: "低能的軍官團"
 CHI_incompetent_officers_desc: "軍官們尚不能勝任指揮現代戰爭的職責。在他們趕上國外同行的水平前，急需進行刻苦的學習。培訓軍官將成為軍隊改革當中十分關鍵的項目。"
 CHI_hyper_inflation_none: "經濟穩健"
 CHI_hyper_inflation_none_desc: "國家經濟的狀況目前一切正常。"
 CHI_hyper_inflation_1: "低度通貨膨脹"
 CHI_hyper_inflation_1_desc: "我國經濟學家注意到通脹情況有所增長，應當予以密切關注。"
 CHI_hyper_inflation_2: "中度通貨膨脹"
 CHI_hyper_inflation_2_desc: "通貨膨脹現已開始顯著掣肘我國經濟，我們應該在事態失控前制定應對措施。"
 CHI_hyper_inflation_3: "重度通貨膨脹"
 CHI_hyper_inflation_3_desc: "政府發行的貨幣正不斷貶值，購買力持續下降，如今部分商品甚至只有關係戶才能購買。"
 CHI_hyper_inflation_4: "惡性通貨膨脹"
 CHI_hyper_inflation_4_desc: "我國貨幣的價值正急速蒸發，物價每日持續飛漲，在事態徹底崩潰前，我們必須採取緊急措施加以應對。"
 CHI_hyper_inflation_5: "經濟崩潰"
 CHI_hyper_inflation_5_desc: "我國的貨幣體系已徹底崩潰，在全國大部分地區，貿易已經回到了以物易物的水平。貧困無處不在，政府職員甚至把支付給他們的紙幣當柴火燒。為了扭轉局面，一場徹底的金融以及經濟改革勢在必行。"
 CHI_dai_li: "戴笠"
 CHI_t_v_soong: "宋子文"
 CHI_soong_mei_ling: "宋美齡"
 CHI_chiang_ching_kuo: "蔣經國"
 CHI_lin_sen: "林森"
 CHI_h_h_kung: "孔祥熙"
 CHI_chen_guofu: "陳果夫"
 CHI_warlord_integration: "整合軍閥"
 CHI_chinese_unity_1: "中華統一戰線"
 CHI_chinese_unity_1_desc: "各路軍閥現已表態支持政府，如此我們可放開手腳，專注於抵禦外敵。"
 CHI_camco_1: "中央飛機制造廠"
 CHI_camco_2: "中央飛機制造廠-戰鬥機分部"
 CHI_camco_3: "中央飛機制造廠-轟炸機分部"
 PRC_the_long_march: "長征之殤"
 PRC_the_long_march_desc: "在撤退至陝西的長征當中，中央紅軍的兵力已然耗盡，延安革命根據地尚未做好準備再掀起一場聲勢浩大的革命。黨需要時間亦或是外力相助，方才能恢復元氣。"
 PRC_the_long_march_2: "長征陣痛"
 PRC_low_popular_support: "低民眾支持"
 PRC_low_popular_support_desc: "中國是一個農民佔主體的國家，而農民同胞已在內戰中深受其苦。如果我們希望被視作中國的合法政府，那麼就必須要贏得他們的支持。"
 PRC_power_struggles: "權力鬥爭"
 PRC_power_struggles_desc: "黨內目前在發展的方式道路問題上存在著分歧，各派間的鬥爭已然爆發，直到其中一方最終奪得領導地位為止。"
 PRC_red_army_weakened: "虛弱的紅軍"
 PRC_red_army_weakened_desc: "長征已導致紅軍精疲力竭，難以應對下一場戰爭。因此，我們必須為了解放戰爭而組建一支全新的軍隊。"
 PRC_deng_xiaoping: "鄧小平"
 PRC_kang_sheng: "康生"
 PRC_otto_braun: "李德"
 PRC_su_yu: "粟裕"
 PRC_nie_rongzhen: "聶榮臻"
 PRC_ye_jianying: "葉劍英"
 PRC_government_corruption: "腐敗的政府"
 PRC_government_corruption_desc: "我們的政府充斥著腐敗的官員，國家的錢財流入地方官員口袋之類的事情屢見不鮮。"
