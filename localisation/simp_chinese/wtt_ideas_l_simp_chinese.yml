 JAP_militarism: "軍國主義"
 JAP_militarism_desc: "軍國主義主導了國家的政治和社會生活，將軍事實力等同於國家實力的觀念十分深入人心。這一觀念自明治維新時期引入徵兵制開始萌芽，現已成為我國信仰中的核心信條。"
 JAP_interservice_rivalry_army_dominant: "軍種對立-陸軍主導"
 JAP_interservice_rivalry_army_strengthened: "軍種對立-偏向陸軍"
 JAP_interservice_rivalry_balanced: "軍種對立-態勢平衡"
 JAP_interservice_rivalry_navy_strengthened: "軍種對立-偏向海軍"
 JAP_interservice_rivalry_navy_dominant: "軍種對立-海軍主導"
 JAP_superior_will: "意志至上"
 JAP_unsanctioned_war: "未經聖準之戰"
 JAP_unsanctioned_war_desc: "當前的對華戰爭開戰倉促，甚至未能得到天皇陛下的聖準。"
 MAN_militarism: "軍國主義"
 JAP_hirohito: "裕仁天皇"
 JAP_the_london_naval_treaty: "倫敦海軍條約"
