l_simp_chinese:
 tfv_australia.1.t: "[From.GetAdjective]提議調整新加坡戰略"
 tfv_australia.1.d: "自從世界大戰結束以來，新加坡戰略一直是我們對[JAP.GetNameDef]威懾政策的基石。但是，我們將主力艦隊重新部署在新加坡以防進攻的舉動嚴重依賴於我們在[From.GetNameDef]的盟友的支持。隨著英國遠東殖民地所面對的潛在威脅日益加強，[From.GetAdjective]總司令部向我們提出了一個可行的新策略，要求增強澳大利亞對該地區防務的掌控力度。\n\n這個策略言之有理，但唯一的問題是，我們是否應該相信他們有能力提供好必要的防務安全。"
 tfv_australia.1.a: "當由澳大利亞來組織東南亞的第一防線。"
 tfv_australia.1.b: "新加坡戰略得保持原樣。"
 tfv_australia.2.t: "[From.GetNameDefCap]移交殖民地"
 tfv_australia.2.d: "[From.GetAdjective]已經通過了法案，將新加坡和婆羅洲附近所有[From.GetAdjective]殖民地移交到了[Root.GetNameDef]手上。\n\n我國的安全終於被掌握在我們自己的手中了。"
 tfv_australia.2.a: "定不辱命。"
 tfv_australia.3.t: "[From.GetNameDefCap]拒絕調整戰略"
 tfv_australia.3.d: "儘管我們對新加坡戰略可行性的擔憂合情合理，修訂版草案仍遭[From.GetAdjective]議會否決。\n這似乎是主導[From.GetAdjective]總司令部的守舊軍事思想作祟。但事實是，倘若噩夢成真，我們可能不得不在本國海岸上與敵人短兵相接。"
 tfv_australia.3.a: "不管[From.GetAdjective]支持與否，[Root.GetNameDef]將始終傲然屹立！"
 tfv_australia.10.t: "[From.GetNameDefCap]提議保護我國殖民地"
 tfv_australia.10.d: "[From.GetNameDefCap]已同[Root.GetAdjective]的外交官就保護東南亞地區[Root.GetAdjective]殖民地的責任移交展開談判。\n\n考慮到捍衛所涉領土固有的挑戰，合作並非全然無用。儘管這意味著在將來的一段時間內，所涉領土僅在名義上屬於[Root.GetAdjective]，但名義上擁有總比徹底失去要好太多。"
 tfv_australia.10.a: "[From.GetNameDefCap]定將保衛[Root.GetAdjective]在當地的權益無虞。"
 tfv_australia.10.b: "[Root.GetAdjective]的領土還是歸[Root.GetAdjective]直控為好！"
 tfv_australia.11.t: "[From.GetNameDefCap]移交保護國"
 tfv_australia.11.d: "[Root.GetAdjective]軍隊業已預備好保護[From.GetAdjective]在東南亞的領土，惟餘[From.GetLeader]簽字批准。\n\n移交過程中，雖然地方抵抗略有波瀾，但大多數民眾面臨著遭對外國侵略的恐懼，最後還是不免於承認[Root.GetAdjective]保護無可或缺。"
 tfv_australia.11.a: "[Root.GetNameDefCap]一定會盡到自己的職責。"
 tfv_australia.12.t: "[From.GetAdjective]阻滯區域安全措施"
 tfv_australia.12.d: "[From.GetAdjective]自信於能保護好自家的東南亞領土，拒絕了我國的共同防守戰略提議。\n\n毫無疑問，[From.GetNameDef]顧忌著自家殖民地歸屬權，並非不可理解。但是，如同我們所擔心的，這些東南亞屬地無疑將會成為敵人進攻澳大利亞本土的跳板。"
 tfv_australia.12.a: "我們僅能祈禱，這幫人能多抗一陣子。"
 tfv_australia.20.t: "[From.GetNameDefCap]要求合併！"
 tfv_australia.20.d: "我們一直焦慮地看著[From.GetNameDef]民族主義狂熱不停地增長，如同我們所想的那樣，總有一天它將跨越國界。\n現在已經有論調通過論證澳新兩國作為“前哨國家”的共同歷史，來鼓吹建立統一的大洋洲國。同時，輿論在面對[Root.GetAdjective]的反抗時也逐漸變得狂呼酣戰。\n\n現在的政治局面已是劍拔弩張，並且[From.GetLeader]公開要求將[Root.GetAdjective]的所有領土併入[From.GetNameDef]。\n如果我們拒絕，一場可怖的入侵將迫在眉睫。"
 tfv_australia.20.a: "我們沒有選擇，只能選擇接受，並作為[From.GetNameDef]的一個省繼續存在"
 tfv_australia.20.b: "想要我們的島，就要和我們血戰到底！"
 tfv_australia.21.t: "[From.GetNameDefCap]接受吞併"
 tfv_australia.21.d: "[From.GetAdjective]收到了我國的最後通牒，並接受成為[Root.GetNameDef]的一個省。當[From.GetAdjective]首相[From.GetLeader]還在為[From.GetAdjective]喪失“獨立”而悄愴哀悼時，大洋洲的一個新時代已經降臨。\n\n[From.GetNameDef]和我們一樣，已經不再為那個目中無人的大英帝國效犬馬之勞。"
 tfv_australia.21.a: "[Root.GetNameDefCap]攜手新西蘭，一起走向更光明的未來！"
 tfv_australia.22.t: "[From.GetNameDefCap]拒絕兩國聯合提議。"
 tfv_australia.22.d: "[From.GetAdjective]政府並沒有意識到自身在太平洋地緣政治中的危險處境，拒絕了我們提出的將新西蘭變為[Root.GetNameDef]最重要的一個省的提議。\n[From.GetAdjective]的總理[From.GetLeader]沒有意識到他只是英國養的一條狗，居然還引用了[From.GetAdjective]所謂的“自由與獨立”原則。\n\n似乎是時候提醒[From.GetNameDef]一下，我們之前所描述的“地緣政治危險”，究竟是什麼含義了。"
 tfv_australia.22.a: "該拿起武器了，[Root.GetAdjective]人！"
 tfv_australia.31.t: "[Root.GetNameDefCap]將成為國際性領袖"
 tfv_australia.31.d: "依照我國最近疏遠大英帝國的政策，和我國一樣在自己勢力範圍內做主的國家只有成為領導者而非跟隨者才是唯一合理的做法。\n我們將其他地區強國團結在我國的偉業中，確保我們的共同利益在全球舞臺上堅不可摧。\n\n我們不再被歐洲的殖民強權所奴役，而會打造一個全新的、更公正的國際實力平衡局面。"
 tfv_australia.31.a: "[Root.GetNameDefCap]引領未來！"
 tfv_australia.32.t: "[From.GetNameDefCap]要求政治合作"
 tfv_australia.32.d: "自從[From.GetNameDef]離開英聯邦以來，[From.GetAdjective]一直在尋找新的盟友。由於歐洲正處在另一個衝突爆發的邊緣，以及[From.GetNameDef]在太平洋地區的戰略價值，合作伙伴關係可能符合我們的最大利益。\n\n這將會加強我們對太平洋，東南亞以及遠東的影響，並保證在歐洲爆發的衝突不會影響到[Root.GetAdjective]的利益。"
 tfv_australia.32.a: "我們會很高興地稱呼他們為盟友！"
 tfv_australia.32.b: "我們自己可以更好地保護我們的利益。"
 tfv_australia.33.t: "[From.GetNameDefCap]同意展開太平洋合作"
 tfv_australia.33.d: "看出了合作所能帶來的明顯利益，[From.GetNameDef]同意了我們的提議並和我們結成了地區盟友。"
 tfv_australia.33.a: "舊宗主已死。我們現在平起平坐。"
 tfv_australia.34.t: "[From.GetNameDefCap]拒絕合作"
 tfv_australia.34.d: "無論是因為拒認兩國的共同歷史，或僅是出於政治機會主義，[From.GetNameDef]拒絕了我們提出的建立一個跨太平洋合作伙伴的建議。\n\n他們的參與本可以成為一筆巨大的財富，我們應該獨自向前，為了我們的目標而努力。"
 tfv_australia.34.a: "我們依然會做我們能做的以保護我們的世界角落。"
 tfv_australia.34.b: "我們失敗了。"
 tfv_australia.41.t: "[INS.GetAdjective]追求自由"
 tfv_australia.41.d: "隨著前[HOL.GetAdjective]殖民地的混亂，我們可信的鄰國[INS.GetNameDef]顯然需要一個幫手來維護他們來之不易的主權。只要他們需要我們的支持，[Root.GetNameDef]將隨時為[INS.GetAdjective]政府提供必要的幫助。\n\n終有一天[INS.GetNameDef]將會作為我們的太平洋夥伴對抗歐洲殖民強權。在此之前，我們應該確保他們堅強地站在我們這邊。"
 tfv_australia.41.a: "一起武裝起來，對抗全世界！"
 tfv_australia.50.t: "[From.GetNameDefCap]請求成為[Root.GetFactionName]的成員"
 tfv_australia.50.d: "作為一個從歐洲舊資產階級得到自由的工人國家，[From.GetNameDef]逐漸進入了[Root.GetAdjective]的政治圈。[From.GetAdjective]政府已經正式提出了成為[Root.GetFactionName]成員國的請求。\n\n隨著世界革命的到來，[From.GetLeader]提出了將[Root.GetNameDef]和[From.GetNameDef]作為社會主義新世界的兩極，以[From.GetNameDef]統治大洋洲而[Root.GetNameDef]統治歐亞大陸。"
 tfv_australia.50.a: "熱烈歡迎一切革命國家！"
 tfv_australia.50.b: "我們不能冒險讓[From.GetAdjective]人拉我們下水。"
 tfv_australia.51.t: "革命兄弟"
 tfv_australia.51.d: "[From.GetNameDefCap]考慮了我們成為[From.GetFactionName]的成員的提案，並且宣佈我們是有價值的盟友。"
 tfv_australia.51.a: "世界革命指日可待！"
 tfv_australia.52.t: "踽踽獨行"
 tfv_australia.52.d: "在幾週的談判僵局與外交辭令後，明眼人能看出來[From.GetNameDef]並不想就我們加入[From.GetFactionName]的議題給出確切回覆。\n如同我們期待又快又好的談判那樣，[Root.GetNameDef]應該準備好給世界上所有的工人帶去真正的自由。"
 tfv_australia.52.a: "我們將為全世界的被壓迫者而戰！"
 tfv_australia.60.t: "[From.GetNameDefCap]強加霸權"
 tfv_australia.60.d: "[From.GetAdjective]政府援引了工人階級的自由與自決權，要求[Root.GetAdjective]投入到浩浩蕩蕩的“大洋洲社會主義”運動浪潮中來。\n\n不論[Root.GetNameDef]人民的民意如何，[From.GetNameDef]的威脅是千真萬確的。毫無疑問，他們為了目的將會不擇手段……"
 tfv_australia.60.a: "我們真的沒有選擇。為了革命，幹吧。"
 tfv_australia.60.b: "[Root.GetNameDefCap]永不屈服！"
 tfv_australia.61.t: "[From.GetNameDefCap]加入革命鬥爭！"
 tfv_australia.61.d: "[From.GetNameDef]承認了共產主義的正義與真理，同意與我們在大洋洲革命的旗幟下並肩戰鬥。"
 tfv_australia.61.a: "試看將來環球，必是赤潮的天下！"
 tfv_australia.62.t: "[From.GetNameDefCap]試圖阻遏革命"
 tfv_australia.62.d: "由於[From.GetAdjective]的人民一直被資本主義所壓迫，受大資產階級擺佈的[From.GetNameDef]政府現在宣佈他們無論如何都不會與[Root.GetAdjective]合作。\n可憐啊，我們並沒有尋求與他們的合作，我們的合作對象是那些被壓迫的人民！"
 tfv_australia.62.a: "我們將會帶給[From.GetNameDef]真正的自由！"
 tfv_australia.70.t: "[From.GetNameDefCap]要求控制保護國"
 tfv_australia.70.d: "[From.GetLeader]聲稱[Root.GetNameDef]對其在東南亞殖民地的防務失敗將會嚴重影響[From.GetNameDef]的國防，故要求授予[From.GetAdjective]政府全權獨立防衛該地區的職責。\n雖然該請求並不直截了當，但[From.GetAdjective]對該地區的戰略與軍事影響越來越深，使得請求有了一些合理性。我國最近忙於地緣政治平衡的現狀成為了[From.GetNameDef]插手的契機。\n我們是在和一個潛在的平等夥伴而非附庸達成協議，而如果[From.GetNameDef]同意，這些殖民地將脫離我們的實際掌控。"
 tfv_australia.70.a: "對，東南亞的穩定高於一切。"
 tfv_australia.70.b: "不，只有我們才能掌控自己的殖民地！"
 tfv_australia.71.t: "防禦委員會"
 tfv_australia.71.d: "根據[Root.GetAdjective]軍事指揮部的陳述，[From.GetNameDef]決定給予我們對[From.GetAdjective]的所有東南亞殖民地的“中間控制權”。\n\n隨著太平洋地區的舊勢力垂垂老矣，我們將努力確保[Root.GetNameDef]在該地區的統治地位延續下去。"
 tfv_australia.71.a: "我們將讓母國感到自豪。"
 tfv_australia.72.t: "[From.GetNameDefCap]拒絕“防禦計劃”"
 tfv_australia.72.d: "儘管來自[Root.GetAdjective]總司令部誠意十足，[From.GetNameDef]已經拒絕了我們接管他們東南亞殖民地的請求。\n\n我們的雄心並不會因此受挫，而我們將會繼續尋求加強[Root.GetAdjective]的太平洋霸權的機遇。"
 tfv_australia.72.a: "[Root.GetNameDefCap]永不言棄。"
 tfv_australia.80.t: "大洋彼岸的提議"
 tfv_australia.80.d: "[From.GetNameDefCap]隨著時間推移，對[Root.GetNameDef]的帝國雄心愈發支持。作為本地區另一個軍事大國，[From.GetAdjective]人決定成為我們光榮的盟友而非卑微的僕人。\n\n為了引起我國的興趣，該國提出的西太平洋聯盟不僅明確劃出了[Root.GetAdjective]的勢力範圍，甚至將幾塊受控於[From.GetNameDef]的敵國的領地包括其中。"
 tfv_australia.80.a: "並肩戰鬥，我們將成為東半球的霸主！"
 tfv_australia.80.b: "我們的野望中不會有這些鄉巴佬的立足之地！"
 tfv_australia.81.t: "[From.GetNameDefCap]同意結盟"
 tfv_australia.81.d: "我們前往日本的代表團成功歸來。我們已正式與[JAP.GetName]簽署了結盟文件。這些文件清楚地劃分了兩國的利益範圍，另一國不可干預。"
 tfv_australia.81.a: "在大洋兩岸的[Root.GetAdjective]和[From.GetAdjective]都將獲利於此。"
 tfv_australia.82.t: "[From.GetAdjective]政府拒絕夥伴關係！"
 tfv_australia.82.d: "儘管我們已經站在了世界舞臺的最前沿，但[From.GetNameDef]依然拒絕承認我們在西太平洋的重要地位。\n[From.GetAdjective]不僅徹底拒絕承認我們，他們毫不含糊的表示自己的南進論將會跨越印度尼西亞，劍指澳大利亞大陸。"
 tfv_australia.82.a: "如果他們不與我們站在同一條戰線上，我們將讓他們屈膝臣服。"
 tfv_australia.90.t: "加冕儀式"
 tfv_australia.90.desc: "[AST.GetLeader]前往英國參加國王喬治六世和女王伊麗莎白的加冕儀式。在進行了幾週的聚餐，花園派對，接待和更多的聚餐後，他成功爭取到了一次與國王進行私下會談的機會。在寒暄過後，談話的主題轉移到了政治方面，國王表示他希望幫助[AST.GetNameDef]。"
 tfv_australia.90.a: "請求國王對澳大利亞進行訪問以提升士氣。"
 tfv_australia.90.b: "請求國王支持擴軍徵兵。"
 tfv_australia.90.c: "請求國王公開地支持政府。"
 tfv_australia.92.t: "愛德華八世訪問澳大利亞"
 tfv_australia.92.desc: "[AST.GetLeader]已經前往英國去參加愛德華八世與華里絲·辛普森的婚禮。在幾個星期的午餐、晚宴、花園派對、招待會、以及更多的晚宴後，他終於成功爭取到了一場與新國王私下交流的機會。\n\n在寒暄和閒聊過後，話題轉移到了政治上。國王就英聯邦的團結和對祖國的忠誠進行了長時間的長篇演講，在他談到大陸政治時，[AST.GetLeader]不禁感到有點不舒服。國王問他能做些什麼來幫助[AST.GetNameDef]，並讓那裡的人民愛戴他。"
 tfv_australia.92.a: "請求國王訪問澳大利亞以提升士氣。"
 tfv_australia.92.b: "請求國王支持一場擴軍徵兵運動。"
 tfv_australia.92.c: "請求國王公開地支持政府。"
 tfv_australia.95.t: "民族主義在印度尼西亞抬頭"
 tfv_australia.95.desc: "在最近幾週，印度尼西亞各地的民族主義情緒明顯高漲。情報部門判斷民族主義支持者之數已上升到了驚人的程度。特別令人關切的是，有報道稱，許些民族主義領袖正在公開討論武裝叛亂。就於昨日，一艘軍艦在南爪哇攔截了一艘可疑的漁船。船上發現了沒有官方標記的武器和彈藥。到目前為止，對船員的審問還沒有結果，但似乎有人在試圖挑起事端。"
 tfv_australia.95.a: "極度不安。"
 tfv_australia.96.t: "內戰！"
 tfv_australia.96.desc: "民族主義武裝走上了印度尼西亞的大街小巷，警察和軍隊的應對措施毫無效果。最近高漲的民族主義情緒引發了這場武裝衝突，我們現在已經被捲入了一場全面的內戰中。"
 tfv_australia.96.a: "頂住這些民族主義垃圾！"
 tfv_australia.96.b: "參加起義！"
 tfv_canada.1.t: "[From.GetNameDefCap]尋求北美同盟"
 tfv_canada.1.d: "隨著北美洲大陸的外交利益趨於一致與歐洲的逐漸動盪，[From.GetNameDef]採取了一項激進的政治措施。\n我們將通過簽署共同防禦協定來保障美洲的防務安全與主權完整，並且可以在當下大大增加我國的政治與軍事上可選擇的方向。[From.GetLeader]表示這個“顯而易見”的抉擇可以確保[Root.GetNameDef]和[From.GetNameDef]的繁榮，並且[Root.GetLeader]似乎同意了這個說法，不然該協議將難以落地。"
 tfv_canada.1.a: "這策略很棒，我們選擇和[From.GetNameDef]共進退！"
 tfv_canada.1.b: "我們不會同意任何會將我們捲入外國糾紛的事情。"
 tfv_canada.2.t: "北美聯盟的建立"
 tfv_canada.2.d: "新的條約在今天簽署完畢，[Root.GetNameDef]和[From.GetNameDef]共同慶祝著兩國的友誼與合作。我們兩國承諾當在面臨外交問題時互相援助，包括共同守衛北美大陸。\n\n只要兩國緊密團結，全世界的外敵將沒有任何對抗我們的機會。"
 tfv_canada.2.a: "從海到海！"
 tfv_canada.3.t: "[From.GetNameDefCap]拒絕北美聯盟"
 tfv_canada.3.d: "儘管兩國之間的正式軍事合作能夠帶來巨大的好處，正如聯合防務委員會所展示的那樣，但是[From.GetAdjective]依然拒絕了關於組建永久聯盟的談判請求。\n該條約意在確保北美大陸的主權完整，但從現在來看，我們不得不尋找其他方法以捍衛我們的家園。"
 tfv_canada.3.a: "我們還有其他選擇。"
 tfv_canada.10.t: "[From.GetNameDefCap]尋求加入[Root.GetFactionName]"
 tfv_canada.10.d: "在拋棄英聯邦之後，[From.GetNameDef]正在為了加入[Root.GetFactionName]而與我們談判。他們的共產主義信仰是堅定的，而且毫無疑問的是，在美洲大陸上的共產主義盟友將會對世界革命的事業帶來巨大的好處……\n他們的愛國社會主義，獨立自主的本性以及[From.GetLeader]嘗試工業化的奇蹟都有可能在未來造成問題，錯過這個機會就太可惜了。"
 tfv_canada.10.a: "我們熱烈歡迎所有真正的革命者！"
 tfv_canada.10.b: "這太冒險了。"
 tfv_canada.11.t: "真正的美洲革命"
 tfv_canada.11.d: "在拋棄了幾個世紀來由殖民主義暴力支撐的資本主義殘餘之後，我們終於進入了世界舞臺。我們選擇與[From.GetNameDef]在[From.GetFactionName]中齊頭並進，為了我們將赤旗插遍全球的使命！"
 tfv_canada.11.a: "我們將會告訴這片大陸什麼是革命！"
 tfv_canada.12.t: "[From.GetNameDefCap]拒絕成為[From.GetFactionName]的一員"
 tfv_canada.12.d: "[From.GetLeader]擔心我們危害“全世界的穩定”，公開拒絕了我們加入[From.GetFactionName]的請求。\n看來，[From.GetNameDef]並沒有摒棄舊世界的自私權術，即使我們加入了，也無法發揮革命作用。\n\n在把社會主義帶給全世界每一名工人之前，即使[Root.GetNameDef]要獨自面對一個充滿法西斯的世界，我們也決不放棄。"
 tfv_canada.12.a: "為了公平、理解和加拿大路線！"
 tfv_canada.20.t: "[From.GetNameDefCap]尋求同盟"
 tfv_canada.20.d: "隨著[From.GetAdjective]政壇中保守國家主義的崛起，[From.GetNameDef]正在尋找能夠為他們的事業添磚加瓦的盟友，而不是英聯邦中的那些“民主國家”。\n\n與[From.GetNameDef]結盟不僅在意識形態上是自然的，還可以保證一個強大的國家存在……一個可以為我們在北美大陸賣力的國家。"
 tfv_canada.20.a: "[From.GetAdjective]人和[Root.GetAdjective]人合作是理所應當的！"
 tfv_canada.20.b: "我們的興趣在歐洲，[From.GetNameDef]必須自己拼搏。"
 tfv_canada.21.t: "強有力的聯盟"
 tfv_canada.21.d: "[From.GetNameDefCap]接受了我們聯盟的建議，因為他們看到了與一個強大的北美國家擁有良好關係的好處。\n這次外交行動將會更有力的在北美洲投射我們的力量，同時，柏林-渥太華軸心正好穿過倫敦不是巧合。"
 tfv_canada.21.a: "我們成為了全球性力量。"
 tfv_canada.22.t: "腐爛的歐洲"
 tfv_canada.22.d: "連審視自己邊境之外的能力都沒有的[From.GetLeader]的[From.GetName]拒絕了我們提出的聯盟。\n當然，考慮到[From.GetAdjective]與整個歐洲的瀕臨崩潰的狀態，沒有他們加入對我們可能是件好事。"
 tfv_canada.22.a: "我們將會向他們詮釋偉大的真正含義。"
 tfv_canada.30.t: "共治主義革命"
 tfv_canada.30.d: "共治主義論者的影響力正在逐漸擴大，隨之增長的是他們對力量的渴望。似乎我們的政府已經無法再忍受他們的右派政治，在[Root.GetNameDef]各地都出現了共治主義者與政府支持者之間爆發的衝突，衝突中雙方均使用了致命武器。\n雖然共治主義政黨的軍事化不知在何時以何種方法出現，但他們已經對政府構成了真正而直接的威脅。\n\n內戰一觸即發。"
 tfv_canada.30.a: "支持民族主義者。"
 tfv_canada.30.b: "支持共和主義者。"
 tfv_canada.30.c: "承認國家主義者的統治權力。"
 tfv_canada.40.t: "走向民主"
 tfv_canada.40.d: "雖然最近改革的[Root.GetAdjective]的力量是不可否定的，而且區域政治的現實也正是如此。我們的敵人，[USA.GetNameDef]，掌握著大陸，而且已經證明了自己沒有能力守住一切在國界線之外的東西。\n這使得與[From.GetNameDef]合作的提議變得很有價值。我們任何一個國家都缺少阻止[USA.GetAdjective]干預的力量，但同時對抗南北兩線，[USA.GetLeader]必須三思而後行。\n\n也許這會讓他們更加服從的歸還[Root.GetAdjective]的合法領土……"
 tfv_canada.40.a: "我們將會一點點絞死我們腐爛的鄰居。"
 tfv_canada.40.b: "我們不能冒險成為侵略者。"
 tfv_canada.41.t: "墨西哥同意"
 tfv_canada.41.d: "[MEX.GetAdjective]政府完全同意我們南面鄰居的侵略政策對我們各國的影響，我們唯一的生機就是打破他們在大陸上的束縛。我們必須抓緊時間，在敵人完成重新武裝之前做好準備。當然，我們將會對我們的新朋友做出某些領土特許權。在一起，我們將會終結美國的霸權。"
 tfv_canada.41.a: "讓大火再次吞噬白宮！"
 tfv_canada.42.t: "墨西哥拒絕"
 tfv_canada.42.desc: "[MEX.GetAdjective]拒絕了我們提出的共同對抗我們共同的敵人的提案。他們似乎認為可以忽略那條已經做出攻擊姿勢的劇毒響尾蛇，而它將會放過他們，只要他們不激怒它。看來我們必須獨自防守了。"
 tfv_canada.42.a: "蠢貨！懦夫！叛徒！！"
 tfv_canada.50.t: "內部的敵人"
 tfv_canada.50.d: "今天的一場爆炸燬掉了我們的一座工廠，最初這被認定為是一場工業事故，但調查顯示爆炸物是沿著生產線擺放的。\n當我們為逝去的生命哀悼時，這場暴行不會被忽略。\n\n無論是誰策劃這場爆炸，他都對所有的[Root.GetNameDef]構成了威脅。"
 tfv_canada.50.a: "我們不會被敵人打敗"
 tfv_canada.51.t: "另一場攻擊"
 tfv_canada.51.d: "另一場攻擊已經發生在了[Root.GetAdjective]的土地上，這次攻擊直接針對我們的軍工廠！\n因為修理的原因，工廠已經停產，而罪魁禍首依然在逃。\n\n現在我們至少知道這不是個人而是一個團伙在作案。"
 tfv_canada.51.a: "他們的戰線拉得越長，他們的弱點就越容易暴露。"
 tfv_canada.52.t: "魁北克圈"
 tfv_canada.52.d: "執法機關一直與軍事警察合作並在工廠被持續破壞的情況下獲得了進展。他們發現這些破壞並不是由外國間諜所為，而是由一個抗議魁北克省強制徵兵法案的集團所為。\n\n不管他們處於何種政治考慮，我們的國家正處於戰爭，而他們，是最高級別的叛徒。"
 tfv_canada.52.a: "他們必須被停止！"
 tfv_canada.53.t: "生產線的盡頭"
 tfv_canada.53.d: "魁北克圈中的一個工廠被佈置成了陷阱，這個工廠被認定為最有可能的下一個被攻擊目標。在死寂的夜晚，執法人員等待著滲透者的到來。\n隨著這些破壞者的到來，執法人員發現他們的人數多於預期並且裝備了先前失竊的軍隊裝備。槍戰打響了，破壞了相當多的生產線，幾乎等於魁北克圈預計新部署的生產線數量。\n在槍戰之後，所有的破壞者都死亡了，魁北克圈結束了。"
 tfv_canada.53.a: "一場勝利，而不是[Root.GetNameDef]的損失！"
 tfv_canada.60.t: "[From.GetNameDefCap]要求獲得拉布拉多和紐芬蘭"
 tfv_canada.60.d: "[From.GetNameDef]長期表示希望“收復”作為固有領土的拉布拉多和紐芬蘭殖民地，現在他們開始正式提出了要求。\n[From.GetLeader]已經講明[From.GetNameDef]將會視其為[From.GetAdjective]的土地，並會採取一切必要的措施取回這些土地。"
 tfv_canada.60.a: "給他們想要的，現在不是和[Root.GetNameDef]撕破臉的時候。"
 tfv_canada.60.b: "[ENG.GetAdjective]的土地，一寸也不放棄！"
 tfv_canada.61.t: "天命成真"
 tfv_canada.61.d: "隨著[From.GetNameDef]割讓拉布拉多和紐芬蘭，[Root.GetNameDef]終於統一了。如今，從太平洋到大西洋，每一個真正的[Root.GetAdjective]人都在祖國的國境內了。\n我們的下一步就是保證[Root.GetAdjective]這個國家的安全！"
 tfv_canada.61.a: "海岸線是唯一安全的邊境線！"
 tfv_canada.62.t: "帝國的傲慢"
 tfv_canada.62.d: "[From.GetNameDef]用他們搖搖欲墜的“帝國特權”，妄稱拉布拉多和紐芬蘭是受帝國保護的殖民地，並拒絕交出這些理應屬於我們的土地！這些本來是[Root.GetAdjective]人的民眾，以及本來屬於[Root.GetAdjective]的資源，卻要聽從[From.GetAdjective]的命令。\n這個狀態無法令人接受，但是看樣子[From.GetNameDef]無法通過外交手段被說服……"
 tfv_canada.62.a: "[ROOT.GetNameDefCap]終將迎來統一！"
 tfv_canada.70.t: "[FROM.GetNameDefCap]希望與紐芬蘭統一"
 tfv_canada.70.desc: "加拿大議會舉行了一次投票後，[FROM.GetLeader]向我們提出請求，要求我們簽署對之前《英屬北美法案》的修訂，並通過此舉宣佈[FROM.GetNameDef]與紐芬蘭及拉布拉多殖民地的統一。"
 tfv_canada.70.a: "我們看不出這有什麼害處"
 tfv_canada.70.b: "絕不！"
 tfv_canada.71.t: "[FROM.GetNameDefCap]簽署紐芬蘭法案"
 tfv_canada.71.desc: "我們在[FROM.GetName]的偉大朋友接受了我們的請求，並簽署了擬議的紐芬蘭法案，從而在此過程中有效地將紐芬蘭和拉布拉多的主權移交給了我們。這對加拿大來說是偉大的一天！"
 tfv_canada.71.a: "太棒了！"
 tfv_canada.72.t: "[FROM.GetNameDefCap]拒絕簽署宣言"
 tfv_canada.72.desc: "我們一度認為[FROM.GetAdjective]人是我們偉大的朋友，現在他們已拒絕了我們與紐芬蘭和拉布拉多統一的提議。他們固執的立法者和政治家向我們展示了他們在這個問題上的立場，現在我們知道今後該如何與他們打交道了。"
 tfv_canada.72.a: "他們意識到這會損害我們的關係嗎？"
 tfv_canada.73.t: "[CAN.GetName]被英國授予紐芬蘭和拉布拉多"
 tfv_canada.73.desc: "在簽署了紐芬蘭法案後，紐芬蘭和拉布拉多的主權將被移交給我們的盟友[CAN.GetNameDef]。儘管他們聲明這是不可談判的，但至少他們承認我們放棄在該地的基地應該得到經濟補償。"
 tfv_canada.73.a: "至少我們能得到補償……"
 mex_nationalists_chosen: "支持國民軍。"
 mex_republicans_chosen: "支持共和軍。"
 tfv_south_africa.1.t: "[From.GetNameDefCap]請求託管非洲"
 tfv_south_africa.1.d: "當我們苦於軍力無法涵蓋帝國全境的時候，[From.GetNameDef]聯繫了我們並提出了一份行政協議。協議希望我們把非洲南部和中部的殖民地移交給他們，他們有充分的權利和責任去執行防務。"
 tfv_south_africa.1.a: "我們需要把精力集中在歐洲。"
 tfv_south_africa.1.b: "我們自己就能管好這些殖民地。"
 tfv_south_africa.1.c: "殖民地應當盡職自衛。"
 tfv_south_africa.2.t: "[From.GetNameDefCap]批准請求"
 tfv_south_africa.2.d: "隨著我們的影響力越來越強，[From.GetNameDef]已經同意她的非洲殖民地應該交由我們暫時管理。"
 tfv_south_africa.2.a: "我們將施以仁政。"
 tfv_south_africa.3.t: "[From.GetNameDefCap]拒絕"
 tfv_south_africa.3.d: "[From.GetNameDef]以非洲殖民地未受到直接威脅為由，明確表示不打算把殖民地交由我們來管理。"
 tfv_south_africa.3.a: "他們不相信我們嗎？"
 tfv_south_africa.4.t: "非洲的妥協方案"
 tfv_south_africa.4.d: "經過長時間的考慮，英國政府已經就非洲殖民地的防禦達成了妥協。根據這項新計劃，殖民地將自己負責保衛家園，但同時他們將會擁有更多的管理自己政務的自由。"
 tfv_south_africa.4.a: "一個不錯的折中方案——但沒人會對此滿意。"
 tfv_south_africa.10.t: "為我們的鬥爭爭取外國援助"
 tfv_south_africa.10.desc: "決定我們國家未來的偉大戰爭終於到來了。為了在鬥爭中得勝，我們必須爭取一點一滴的支持。[From.GetAdjective]文化和我們社會生活的存亡攸關！"
 tfv_south_africa.10.a: "我們應該親近德國。"
 tfv_south_africa.10.b: "荷蘭將會幫助我們。"
 tfv_south_africa.11.t: "[SAF.GetNameDefCap]請求援助！"
 tfv_south_africa.11.desc: "激烈的鬥爭已經在[From.GetName]爆發了。當他們為自己的生存方式而奮鬥時，他們急切的盼望能得到我們的任何一點援助。這也是一個好機會，可以測試我們的一些新武器裝備，同時在南非獲得一位寶貴的盟友。"
 tfv_south_africa.11.a: "送他們戰鬥機。"
 tfv_south_africa.11.b: "送他們坦克。"
 tfv_south_africa.11.c: "送他們步槍和大炮。"
 tfv_south_africa.11.e: "他們必須得自己戰鬥了。"
 tfv_south_africa.12.t: "[From.GetNameDefCap]請求我們的幫助"
 tfv_south_africa.12.desc: "南非的民族主義者和工會成員間爆發了激烈的戰鬥。參與的人員數量十分龐大，民族主義者們已經把目光轉向了我們——他們祖先的家園，希望得到支持。"
 tfv_south_africa.12.a: "送他們戰鬥機。"
 tfv_south_africa.12.b: "送他們坦克。"
 tfv_south_africa.12.c: "送他們步槍和大炮。"
 tfv_south_africa.12.e: "他們必須得自己戰鬥了。"
 tfv_south_africa.13.t: "德國的回覆"
 tfv_south_africa.13.desc.a: "我們的代表團從[GER.GetNameDef]空手而歸。儘管[GER.GetAdjective]政府的措辭飽含熱情，但他們仍然無法保證給我們任何堅定的支援。看來我們再也不能指望德國政府在我們的鬥爭中提供幫助了。"
 tfv_south_africa.13.desc.b: "以缺乏可用的原料為由，[GER.GetAdjective]政府決定不再向我們提供進一步的支持。他們所有的精力都集中在建設自己的軍隊上。這使得我們陷入一個困難的境地。"
 tfv_south_africa.13.a: "聯繫我們的荷蘭朋友。"
 tfv_south_africa.13.b: "我們會依靠自己的力量成功的，或就此滅亡。"
 tfv_south_africa.14.t: "[HOL.GetAdjective]的回覆"
 tfv_south_africa.14.desc.a: "我們的代表團在[HOL.GetNameDef]經受了無盡的阻礙和拖延。同[HOL.GetAdjective]政府官員與產業管理人員的會議在最後一刻被取消了，無論是電話還是電報都沒有回應。看來[HOL.GetAdjective]政府絲毫沒有幫助我們的興趣。"
 tfv_south_africa.14.desc.b: "儘管最初持支持態度，但是與[HOL.GetAdjective]政府的最新一輪談判已經破裂。[HOL.GetAdjective]以無法轉換為可流通貨幣為由，拒絕接受鑽石作為支付手段。"
 tfv_south_africa.14.a: "聯繫我們的德國朋友。"
 tfv_south_africa.14.b: "我們會依靠自己的力量成功的，或就此滅亡。"
 tfv_south_africa.15.t: "[From.GetNameDefCap]裝備支援"
 tfv_south_africa.15.desc.a: "一批飛機從德國運來。我們的飛行員對這些裝備垂涎欲滴，他們為了進入新的飛行中隊而進行激烈的競爭。"
 tfv_south_africa.15.desc.b: "經過與我們的[GER.GetAdjective]朋友長時間的討論之後，他們同意給我們送來一些輕型坦克。雖然數量不多，但它們很可能會成為讓天枰倒向我們這邊的秘訣。"
 tfv_south_africa.15.desc.c: "一艘來自[GER.GetNameDef]的貨船已經抵達我國，船上裝載了為志願軍而準備的大量的步槍和數門重炮，而德國的志願者們將會通過其他方式到達我國。"
 tfv_south_africa.15.a: "這將是最有用的。"
 tfv_south_africa.15.b: "他們將會成為我軍的骨幹。"
 tfv_south_africa.15.c: "他們的支持是最受歡迎的。"
 tfv_south_africa.16.t: "[From.GetNameDefCap]裝備支援"
 tfv_south_africa.16.desc.a: "得益於[HOL.GetNameDef]航空業界的幾個主要人物的慷慨捐贈，一批飛機從[HOL.GetAdjective]運來。我們的飛行員對這些裝備垂涎欲滴，他們為了進入新的飛行中隊而進行激烈的競爭。"
 tfv_south_africa.16.desc.b: "經過與我們的[HOL.GetAdjective]朋友長時間的討論之後，他們同意給我們送來一些輕型坦克。雖然數量不多，但它們很可能會成為讓天枰倒向我們這邊的秘訣。"
