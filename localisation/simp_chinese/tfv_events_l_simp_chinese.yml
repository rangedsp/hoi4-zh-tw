 tfv_south_africa.16.a: "這將是最有用的。"
 tfv_south_africa.16.b: "他們將會成為我軍的骨幹。"
 tfv_south_africa.16.c: "他們的支持是最受歡迎的。"
 tfv_south_africa.20.t: "[From.GetNameDefCap]要求成為共產國際的會員"
 tfv_south_africa.20.d: "革命已經在[From.GetNameDef]成功了！一個新的共產主義政府已經接管了國家並尋求加入共產國際。"
 tfv_south_africa.20.a: "我們歡迎新同志加入反帝鬥爭！"
 tfv_south_africa.20.b: "在這個時候接受他們只可能讓我們陷入遠方的衝突。"
 tfv_south_africa.21.t: "共產國際批准申請"
 tfv_south_africa.21.d: "經過仔細考慮後，共產國際中央委員會已經批准了我們的加入申請。"
 tfv_south_africa.21.a: "讓我們肩並著肩，[Root.GetNameDef]和[From.GetFactionName]將一起走向未來！"
 tfv_south_africa.22.t: "共產國際拒絕申請"
 tfv_south_africa.22.d: "共產國際以我們對馬克思主義的特有理解和正統理論之間存在難解的分歧為由，拒絕了我們的申請。雖然他們並沒有將我們打成社會法西斯主義者或者其他異類，但共產國際明確表示不會對我們提供任何幫助。"
 tfv_south_africa.22.a: "或許是他們弄錯了？"
 tfv_south_africa.30.t: "[From.GetNameDefCap]索要馬達加斯加"
 tfv_south_africa.30.d: "隨著歐洲陷入戰亂，[From.GetAdjective]政府日前公開質疑我國對馬達加斯加的主權以及保衛當地的居民的能力。而隨著[From.GetAdjective]當局要求我方向其交出該島的控制權，此事已然超出了空談的範圍。"
 tfv_south_africa.30.a: "我們別無選擇，畢竟尚有要事要做"
 tfv_south_africa.30.b: "[Root.GetAdjective]的每一寸領土都是神聖的，決不妥協！"
 tfv_south_africa.31.t: "[From.GetNameDef]屈從要求"
 tfv_south_africa.31.d: "[From.GetAdjective]政府已經明智地同意由我方和平接管馬達加斯加。"
 tfv_south_africa.31.a: "帝國主義殖民體系的崩潰更進一步！"
 tfv_south_africa.32.t: "[From.GetAdjective]拒絕要求"
 tfv_south_africa.32.d: "頑固的[From.GetAdjective]當局已經拒絕對將馬達加斯加移交予我方事宜作出討論，根據其代表所言，他們自認為有足夠的實力並願意去保衛這座島嶼。"
 tfv_south_africa.32.a: "那我們必須訴諸武力。"
 tfv_south_africa.32.b: "就讓他們保留那坨毫無價值的垃圾吧。"
 tfv_south_africa.40.t: "同[From.GetNameDef]達成研究協議"
 tfv_south_africa.40.d: "隨著對[From.GetNameDef]軍事代表團大獲成功，他們的政府建議我們兩國簽署正式的科研協議。"
 tfv_south_africa.40.a: "我們很樂意提供我們的幫助。"
 tfv_south_africa.40.b: "向他們提供我們的秘密將會威脅我們的國家安全。"
 tfv_south_africa.41.t: "[SOV.GetNameDefCap]同意請求"
 tfv_south_africa.41.d: "蘇聯同意讓我們學習他們的道路和方法。一批[SOV.GetAdjective]科學家來到我們的學校和大學任教。"
 tfv_south_africa.41.a: "向[SOV.GetNameDef]學習意味著向歷史的勝利者學習！"
 tfv_south_africa.42.t: "[SOV.GetNameDefCap]拒絕請求"
 tfv_south_africa.42.d: "經過幾輪談判，[SOV.GetNameDef]已經起身離開，他們對我們的對研究機密的保密能力存疑。看來我們將不被允許與我們的盟友分享技術。"
 tfv_south_africa.42.a: "很不幸。"
 tfv_south_africa.50.t: "支援西班牙"
 tfv_south_africa.50.d: "西班牙國民政府和共和政府之間爆發了內戰。對於我們政府會站在哪邊，人民之間議論紛紛。"
 tfv_south_africa.50.a: "也許咱們的士兵想去西班牙度個假？"
 tfv_south_africa.50.b: "如果人民想要參加戰爭，我們不會阻止他們。"
 tfv_south_africa.50.c: "為什麼我們要去參加一場千里之外的戰爭？"
 tfv_south_africa.51.t: "來自南非的志願軍"
 tfv_south_africa.51.d: "雖然[SAF.GetAdjective]政府仍未正式表態，但它允許大量的公民作為志願軍參加我們的事業。"
 tfv_south_africa.51.a: "熱烈歡迎。"
 tfv_south_africa.52.t: "西班牙內戰志願軍歸國"
 tfv_south_africa.52.d: "隨著西班牙內戰的結束，戰爭中倖存的志願軍已經回到祖國，他們帶來了現代戰爭的寶貴經驗。"
 tfv_south_africa.52.a: "他們將在下一場戰爭中幫助我們。"
 tfv_south_africa.60.t: "安哥拉解放"
 tfv_south_africa.60.d: "在從殖民壓迫的魔爪中獲得解放後，[ANG.GetName]的人民已經準備好掌握自己的命運。他們組建了臨時政府並起草了憲法。唯一剩下的事情就是把我們軍事長官的權力轉交給[ANG.GetAdjective]新政府。"
 tfv_south_africa.60.a: "對任何新生的國家必須要進行小心的引導，否則反革命運動就會成功。"
 tfv_south_africa.60.b: "我們張開雙臂歡迎他們！"
 tfv_south_africa.60.c: "我們目前還不能允許這種情況發生。"
