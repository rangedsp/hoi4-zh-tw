l_simp_chinese:
 CHI_secure_internal_politics: "整肅內政"
 CHI_secure_internal_politics_desc: "如果我們想要在犬牙交錯的中國政局當中生存下來，就絕不能被內部的紛亂所幹擾。任何內部反對派都比須加以整肅清理。"
 CHI_strenghten_warlord_authority: "加強軍閥權威"
 CHI_strenghten_warlord_authority_desc: "為了鞏固我們的控制區，確保我們不受國民黨、共產黨和日本人的破壞，我們必須加強[ROOT.GetLeader]的權威。"
 CHI_uplift_the_cavalry_regiments: "提高騎兵團地位"
 CHI_uplift_the_cavalry_regiments_desc: "我們地區有著悠久而自豪的馬術傳統。我們應該尊重這些傳統，並確保我們的騎兵部隊受到最高的尊重，然後將他們部署到我們武裝部隊的最前沿。"
 CHI_uplift_the_mountain_brigades: "提高山地旅地位"
 CHI_uplift_the_mountain_brigades_desc: "中國內地的土地崎嶇不平，難以穿越。因此，我們必須訓練能夠在丘陵和山區作戰的特種旅，以便我們的土地得到合適的保護。"
 CHI_cooperation_with_the_nationalists: "與國民黨合作"
 CHI_cooperation_with_the_nationalists_desc: "國民黨為聯合全國各勢力以擊敗日本人提供了最好的機會，應該確保中央政府其不視我等為威脅。"
 CHI_cooperation_with_the_nationalists_effect_tooltip: "[WTT_communist_china.GetNameDefCap]和支持共產黨的軍閥勢力或將通過向我方發起§H邊境衝突§!以作為回應。"
 CHI_technological_cooperation: "科技合作"
 CHI_technological_cooperation_desc: "我方與中央政府的合作將使得我們能夠利用新研發的科技。"
 CHI_new_model_province: "新模範省"
 CHI_new_model_province_desc: "在中央政府仍在為了推動整個國家步入現代化的進程中掙扎時，我們將會推行較小規模的改革。如此一來，相比較於國內其他的落後地區，我們將被視為進步之模範。"
 CHI_root_out_corruption: "根治腐敗"
 CHI_root_out_corruption_desc: "數十年來，政府官員始終如一地濫用其身份地位中飽私囊，對與其利益相關的犯罪視而不見。人民苦其惡政久矣，腐敗必須被根除。"
 CHI_embrace_the_opium_trade: "默許鴉片貿易"
 CHI_embrace_the_opium_trade_desc: "國家需要資金來運轉。在當前的態勢下，我們沒有餘地對資金的來源挑三揀四了。"
 CHI_land_reform: "土地改革"
 CHI_land_reform_desc: "共產黨推行的激進土地再分配政策正使其獲得大量農民階層的支持，我們應該對此也實施相對溫和的土改政策以挽回民望。"
 CHI_reform_the_administration: "行政改革"
 CHI_reform_the_administration_desc: "如果地方層面的改革未見成效，那麼政府層面的改革也會徒勞無功。我們必須確保所有在職官員都有能力且有意願執行上級的命令。"
 CHI_join_the_republican_government: "加入國民政府"
 CHI_join_the_republican_government_desc: "隨著對土地與政府的鞏固與革新，現在應當強化與中央政府的聯繫並嘗試在其中爭取一席之地。只要我們的派系能在政府中得到合法認可，就能利用該途徑獲取其他地區的支持，藉以強化我方的權力根基。"
 CHI_power_struggle: "權力鬥爭"
 CHI_power_struggle_desc: "隨著我們在國家事務中的政治影響力日漸增強，現在可以嘗試同其他勢力平起平坐了。"
 china_nationalist_focus: "國民政府國策樹"
 china_communist_focus: "中共國策樹"
 CHI_cooperation_with_the_communists: "與共產黨合作"
 CHI_cooperation_with_the_communists_desc: "國民黨推動國家現代化的嘗試已經失敗，我國眼下正面臨著比過往更加嚴重的分裂。官府惡政剝削著農民，貪腐之風肆虐於政府，而日本帝國主義亦已兵臨城下。或許共產主義的確能夠為我們提供更美好的未來願景。"
 CHI_cooperation_with_the_communists_effect_tooltip: "支持國民黨的軍閥勢力可以通過向我方發起§H邊境衝突§!以作為回應。\n"
 CHI_land_redistribution: "土地再分配"
 CHI_land_redistribution_desc: "儘管農民是我國經濟的最基礎組成部分，但他們仍然遭到了地主階級的無情剝削。通過實現耕者有其田，我們將可引領這個社會步入更為公平且兼具效益的時代。"
 CHI_ideological_education: "思想教育"
 CHI_ideological_education_desc: "未來的成功奠基於今朝，我們不僅要教育下一代年輕人必須明確“人類所歷經的歷史就是階級鬥爭的歷史”這樣的事實，同時他們也必須瞭解在其中應當扮演的角色。"
 CHI_land_value_tax: "地價稅"
 CHI_land_value_tax_desc: "直接徵收土地稅能使我們從最富有階級手中取得更加穩定且正義的稅收來源。"
 CHI_judiciary_reforms: "司法改革"
 CHI_judiciary_reforms_desc: "政府若要有所作為，就必須確保全體法官均受過充分教育，且能恰當引用律法。"
 CHI_communist_administrators: "共產黨幹部"
 CHI_communist_administrators_desc: "老派官僚的冥頑不化使得我們無法說服其接受新的思維和方式，應該任用那些思想更加激進的年輕幹部來替代他們。"
 CHI_join_the_chinese_soviet: "加入中華蘇維埃"
 CHI_join_the_chinese_soviet_desc: "只有共產黨人團結起來，革命才能取得成功。當然，前提是必須首先確保黨內沒有任何陰謀破壞革命於未發之時的反動分子。"
 CHI_the_yanan_incident: "延安事變"
 CHI_the_yanan_incident_effect_tt: "請求§H[SOU.GetNameDef]§!支持我方取代§H[WTT_communist_china.GetNameDef]§!作為共產黨勢力領袖的地位。\n若§H[WTT_communist_china.GetNameDef]§!拒絕，則將導致戰爭。\n這項和§H[SOU.GetNameDef]§!交易也將使我們面對[SOU.GetLeader]提出的要求。\n"
 CHI_the_yanan_incident_desc: "黨的現任領導人已經背叛了他蘇聯的社會主義兄弟同胞，我們應該主動接觸蘇聯人，以確保他們在我方繼續將革命燃向全中國的事業中予以支持。"
 CHI_opposition: "謀逆梟雄"
 CHI_opposition_effect_tooltip: "§H[WTT_current_china_leader.GetNameDef]§!可以通過向我方發起邊境戰爭以作為回應。"
 CHI_opposition_desc: "中央政府腐敗軟弱，共產黨則試圖顛覆中華民族五千年的悠久歷史，在這種情況下，我們需要一位願意作出艱難抉擇並通過任何必要的手段來統一國家的偉大領袖。"
 CHI_public_works: "公共建設"
 CHI_public_works_desc: "民眾必須要看到我們為其福祉而作出的努力，相信幾個備受關注的項目便能夠成為有效的宣傳工具，並讓他們淺嘗到中國能夠擁有的未來——只要他們繼續支持我們的話。"
 CHI_labor_reform: "勞動改革"
 CHI_labor_reform_desc: "傳統的勞作方式和制度已經在中國傳承了上千年，現在是時候將其推向現代化了。"
 CHI_rural_militias: "民團武裝"
 CHI_rural_militias_desc: "中國疆域遼闊，軍事支援往往需要耗費大量的時間才能抵達戰線前沿。通過訓練本地的民團武裝，我們可以確保一切踏足我國領土的入侵者如陷泥沼。"
 CHI_war_taxes: "戰爭稅"
 CHI_war_taxes_desc: "危機年代需採取特殊的手段，在戰火正酣的當下，我們必須儘可能地徵集民眾所有的收入和資源。"
 CHI_seek_japanese_support: "尋求日本支持"
 CHI_seek_japanese_support_desc: "中央政府和共產黨都各自擁有著強大的盟友，若我方意欲最終奪取天下的話，就必須尋求自己的庇護者。"
 CHI_personal_leadership: "絕對領導"
 CHI_personal_leadership_desc: "軍隊指揮權分散便會滋生暗藏貳心的軍官陰謀奪權的風險，必須確保我軍將士時刻保持對政府的忠誠。"
 CHI_personal_leadership_tt: "§Y陳濟棠§!將成為可用的3級§Y陸軍元帥§!"
 CHI_personal_leadership_custom_tt: "[ROOT.GetLeader]隨機獲得以下特徵之一：§Y$brilliant_strategist$§!、§Y$career_officer$§!、§Y$cavalry_officer$§!、§Y$infantry_officer$§!、§Y$old_guard$§!、§Y$politically_connected$§!、§Y$war_hero$§!。"
 CHI_cult_of_personality: "個人崇拜"
 CHI_cult_of_personality_desc: "人民需要知道是誰帶領他們熬過黑暗歲月，走向光明未來。同時也要知道集這位領袖於一身的傑出品質和優點。"
 CHI_provoke_border_clashes: "向國民黨挑起邊境衝突"
 CHI_provoke_border_clashes_desc: "我們還不能冒險發動全面戰爭，但小規模且可控的衝突足以令我們在不至於孤注一擲的前提下有效地開疆拓土，我們將會在敵方軍隊調離時出其不意地發起進攻。"
 CHI_defensive_posture: "防禦態勢"
 CHI_defensive_posture_desc: "這場戰爭與其說是短跑，毋寧說是馬拉松。過早地就挑釁其他勢力必將導致災難性的後果，因此我們現在將會維持防禦性的態勢。"
 CHI_rapid_mobilization: "快速動員"
 CHI_rapid_mobilization_desc: "要想成為中國領導權的有力競爭者，就必須擴大軍隊的規模。為此，我們將會採取新式方法，精簡訓練一支足以應對任何挑戰的軍隊。"
 CHI_proclaim_rival_government: "逐鹿天下"
 CHI_proclaim_rival_government_desc: "是時候將我方的雄心昭示天下了，我們的目標唯有稱霸整個中國，而後傲立於世界諸國之列。"
 CHI_industrial_investment: "工業投資"
 CHI_industrial_investment_desc: "雖然我們資源有限，但仍應該投入在改善經濟上。"
 CHI_public_education_reform: "公共教育改革"
 CHI_public_education_reform_desc: "現代化國家的基礎毫無疑問是知識和科學，我們必須優先改善並強化此基礎。"
 CHI_local_arms_production: "本地武器製造"
 CHI_local_arms_production_desc: "我們若在這場戰爭中仍顯得微不足道，就沒法指望能夠從外界獲取武器。為此，我們有必要建立本地兵工廠來生產武器裝備。"
 CHI_long_term_economic_planning: "長遠經濟規劃"
 CHI_long_term_economic_planning_desc: "由於我們的官僚機構並沒有中央政府那般龐大，這使得我們可以精簡冗餘的機構並專注於實現最大的收益回報。"
 CHI_local_arms_development: "本地武器研發"
 CHI_local_arms_development_desc: "製造外國武器的粗劣仿製品並不夠用。我們若想要趕超其他軍閥的水平，就必須著手於自行研發新武器。"
 90_days_tt: "這將花費大約90日的時間以落實。\n"
 CHI_heavy_weapons_development: "重武器研發"
 CHI_heavy_weapons_development_desc: "在資源短缺的當下，我們必須最大限度地利用不太充裕的重火力裝備，同時也應該研製新的火炮。"
 CHI_anti_opposition_campaigns: "剷除對手"
 CHI_anti_opposition_campaigns_desc: "敵軍正在我方邊境附近聚集，絕不能放任不見。發動一系列小規模的攻勢就可以將其擊退，也有機會開疆拓土。"
 CHI_anti_opposition_campaigns_effect_tooltip: "解鎖向未與我方合作的軍閥發起§H邊境衝突§!的£decision_icon_small §H決議§!。\n"
 CHI_anti_opposition_campaigns_effect_tooltip_no_communists: "§R還沒有軍閥勢力支持共產黨。§!\n"
 CHI_anti_opposition_campaigns_effect_tooltip_no_nationalists: "§R還沒有軍閥勢力支持國民黨。§!\n"
 CHI_institute_cross_border_raids: "發動越境襲擊"
 CHI_institute_cross_border_raids_desc: "若無割據一方的能力，我等無法參與進中國領導權的激烈競爭。一些小規模的衝突可以展現我方的決心，甚至還可能佔據一些未設防的地區。"
 CHI_institute_cross_border_raids_effect_tooltip: "解鎖向軍閥和[WTT_communist_china.GetNameDef]發起§H邊境衝突§!的£decision_icon_small §H決議§!。\n"
 CHI_provoke_border_clashes_effect_tooltip: "解鎖向[WTT_current_china_leader.GetNameDef]發起§H邊境衝突§!的£decision_icon_small §H決議§!。\n"
 CHI_inflation_up_tt: "§R加劇§!通貨膨脹。\n"
 CHI_inflation_down_tt: "§G降低§!通貨膨脹。\n"
 CHI_invite_foreign_investors: "邀請外國投資者"
 CHI_invite_foreign_investors_desc: "儘管令人倍感屈辱，但若要實現我國工業化，最好的方法可能是同將剝削加諸於我等的外國帝國主義展開接洽。"
 CHI_mission_to_germany: "派遣使團赴德"
 CHI_mission_to_germany_desc: "這個昔日被歐洲諸國所輕侮的國家已在其國家改革和重拾榮耀方面取得了重大進展，相信我們可以從他們身上獲益良多。"
 CHI_give_falkenhausen_citizenship: "授予法肯豪森公民權"
 CHI_give_falkenhausen_citizenship_desc: "德國顧問們在實現我軍重整和現代化的事宜上作出了卓越的貢獻，無論政局如何波動，我們都應該儘可能確保他們能夠留下來。"
 falkenhausen_tt: "任何其他勢力已授予馮·法肯豪森公民權。"
 CHI_chinese_general_staff: "國民政府參謀本部"
 CHI_chinese_general_staff_desc: "具備良好組織運轉的參謀機構是規劃複雜作戰的關鍵，我們應該學習德國的經驗，為此設立一個類似的機構。"
 CHI_wargaming_division: "戰爭推演部門"
 CHI_wargaming_division_desc: "我們應該在參謀本部內再設立一個專職於推演未來戰爭並在打敗敵國方面發展新式戰術和戰略的特殊部門，他們或許可以利用某種計算設備來模擬一場世界大戰……"
 CHI_closer_ties_with_germany: "對德交好"
 CHI_closer_ties_with_germany_desc: "我們此前的赴德外交已為兩國更深層次的合作帶來可能性，包括貸款與工業發展。"
 CHI_purchase_tanks: "訂購坦克"
 CHI_purchase_tanks_desc: "裝甲戰車是現代戰爭中的矛頭先鋒，為籌建中國的首支裝甲部隊，我們應適當地訂購些坦克。"
 CHI_chinese_panzers: "中國裝甲部隊"
 CHI_chinese_panzers_desc: "德式坦克毫無疑問是世界上最優秀的裝甲載具。我們應當向其學習，並按照其模式研發我們自己的坦克。"
 CHI_tank_plant: "坦克工廠"
 CHI_tank_plant_desc: "隨著新式坦克研發的順利進行，我們現在可以建設專門的工廠來將其投入生產了。"
 CHI_experimental_mechanised_unit: "實驗型機械化部隊"
 CHI_experimental_mechanised_unit_effect: "獲得1個由§Y2個輕型坦克營§!和§Y4個摩托化步兵營§!組成的師。\n"
 CHI_experimental_mechanised_unit_desc: "歐洲的軍事理論家們一直以來都對使用坦克的最佳方法爭論不休，而現在看來，將機動步兵和快速坦克結合起來才是最好的方法。我們應編制一批這類部隊。"
 CHI_combined_arms_warfare: "多兵種協同作戰"
 CHI_combined_arms_warfare_desc: "儘管卡車在現代機械化戰爭的初步實驗中足以堪用，但其落後的越野性能以及薄弱的裝甲仍致其無法勝任前線作戰。"
 CHI_hire_soviet_designer: "聘請蘇聯設計商"
 CHI_hire_soviet_designer_desc: "蘇聯不僅在坦克研發領域較為先進，同時也擁有數家世界頂級的坦克設計商。我們可以將其聘來為我國研發裝甲戰車。"
 CHI_joint_tank_development: "聯合坦克研發"
 CHI_joint_tank_development_desc: "在和蘇聯設計商的合作中獲取經驗後，我們應該成立聯合設計團隊來更好地協調雙方的工作，並互相學習進步。"
 CHI_mission_to_the_soviet_union: "派遣使團赴蘇"
 CHI_mission_to_the_soviet_union_desc: "蘇聯在合作對抗日本擴張野心方面希望與中國合作，我們應赴莫斯科來確認兩國目標是否一致。"
 CHI_rapprochement_with_soviet_union: "對蘇和解"
 CHI_rapprochement_with_soviet_union_desc: "儘管我國同蘇聯在意識形態方面存在分歧，但兩國顯然有著共同的利益。我們應當通過簽署互不侵犯條約的方式正式確立雙方關係，向世界宣佈兩國的聯合。"
 CHI_invite_soviet_advisers: "邀請蘇聯顧問"
 CHI_invite_soviet_advisers_desc: "蘇聯已經提議派出軍事特派團來幫助我們重建軍隊。"
 soviet_advisers_tt: "蘇聯已向中國其他勢力派出了軍事特派團"
 CHI_the_soviet_volunteer_group_focus: "蘇聯志願航空隊"
 CHI_the_soviet_volunteer_group_focus_desc: "與東亞的其他列強相比，我國空軍實力相形見絀，不過蘇聯或許在討論派遣志願部隊方面持開放態度。"
 CHI_reach_out_to_france: "對法示好"
 CHI_reach_out_to_france_desc: "儘管法國屢次侵略我國，逼使我國不斷讓步，但在當前局勢下，我們恐怕還是需要其協助。"
 CHI_small_arms_expertise: "著重發展輕武器"
 CHI_small_arms_expertise_desc: "鑑於單兵武器仍是我軍的基礎裝備，我國有限的資源必須主要投入新式步槍的換裝上。"
 CHI_elite_mountaineers: "精英山地部隊"
 CHI_elite_mountaineers_desc: "山地作戰與平原作戰相差甚遠。為了充分利用我國的地形優勢，我們應專門訓練一批山地部隊。"
 CHI_free_mountain_template_tt: "獲得由§Y7個山地步兵營§!和§Y2個炮兵營§!組成的部隊模板。\n"
 CHI_heavy_weapons: "重型武器"
 CHI_heavy_weapons_desc: "沒有火炮支援的軍隊無法在殘酷的攻勢中倖存下來，必須確保我軍擁有充足的重武器裝備。"
 CHI_guarantee_the_hanoi_route: "確保河內交通線"
 CHI_guarantee_the_hanoi_route_desc: "如果我國同日本爆發戰爭，那麼自河內向北至我國邊境的交通線必能使我國獲得大量外界援助。"
 CHI_construction_battalions: "工兵部隊"
 CHI_construction_battalions_desc: "我國絕對充足的資源非人力莫屬，因此可以編制出有把鏟子就能完成基本軍事工程的特殊部隊。"
 CHI_french_military_mission: "法國軍事特派團"
 CHI_french_military_mission_desc: "法蘭西陸軍堪稱歐陸翹楚，我們可以從中學到很多。"
 CHI_french_drill: "法式軍事訓練"
 CHI_french_drill_desc: "在上次大戰經驗的指導下，法國締造了一支精於防守的軍隊。通過採用法式標準來操練軍隊，可以提高我軍在作戰中的防禦能力。"
 CHI_modern_logistics: "現代後勤"
 CHI_modern_logistics_desc: "打仗就是打補給。如果沒有可靠的後勤系統，我軍就在戰場上就撐不住戰線。"
 CHI_renegotiate_the_unequal_treaties: "重新談判不平等條約"
 CHI_renegotiate_the_unequal_treaties_desc: "西方列強長期干涉我國內政，其在華國民不受限於法律，其在華經商不受控於政府。屈辱的時代已經結束，從今往後，我國將再度同列國平起平坐。"
 CHI_one_china_policy: "一箇中國政策"
 CHI_one_china_policy_desc: "自辛亥革命以降，國家動盪不休，軍閥割據混戰。名附實獨者有之，偽稱主權者亦有之。鑑於國力逐步恢復，我們應向世界公開宣佈中國領土主權的神聖不可分割。"
 CHI_integrate_tibet: "招安西藏"
 CHI_integrate_tibet_desc: "西藏的“獨立”到此為止了。雖然以武力統一的確可行，但我們還是應該嘗試通過和平手段使其重回中華民族大家庭。"
 CHI_conquer_tibet: "武統西藏"
 CHI_conquer_tibet_desc: "西藏是中印兩國間的戰略要地。鑑於地方政權無力自守，為了確保我國南部腹地的安全，我們必須進駐西藏。"
 CHI_renounce_the_mcmahon_line: "否認麥克馬洪線"
 CHI_renounce_the_mcmahon_line_desc: "即使英國仍保持著假惺惺的尊重，他們同晚清政府劃定的這條舊邊界線也絕不是合理的。儘管過去數十年間我們因國力孱弱而無法對此有所異議，然而今非昔比，藏南地區必須復歸於中國主權。"
 CHI_demand_mongolia: "聲索外蒙古"
 CHI_demand_mongolia_desc: "地處中俄兩國之間的蒙古隨時都有可能落入俄國人之手，因此我們必須先下手為強。"
 CHI_anti_imperialism: "打倒帝國主義"
 CHI_lessons_of_war_completed: "已完成所有§Y軍隊改革§!以及§Y戰爭的經驗§!。\n"
 CHI_anti_imperialism_desc: "我們今天已作為首批打破殖民枷鎖的國家之一屹立於世，協助並確保亞洲其他各國人民亦能自決其命運是我國不容推辭的神聖使命。"
 CHI_guidance_and_support: "引導和支持"
 CHI_guidance_and_support_desc: "印度支那的民族仍然在走獨立自主的建國道路中需要援助，而我們將保護其不再遭受外來侵略。"
 CHI_indian_cooperation: "同印度合作"
 CHI_indian_cooperation_desc: "印度人民正在努力掙脫殖民壓迫的最後枷鎖，我們應該向其示好，支援其鬥爭並共建兩國美好的未來。"
 CHI_commit_to_korean_independence: "協助朝鮮獨立"
 CHI_commit_to_korean_independence_desc: "朝鮮人是慘遭日本奴役的首批受害者，而現在，他們將會再次以自由之身立於世界民族之林。"
 CHI_influence_mongolia: "影響蒙古"
 CHI_influence_mongolia_desc: "蒙古作為中俄兩國間的緩衝地區，有助於保衛我國北方，我們只需要確保他們能夠管好自己就行。"
 CHI_imperial_legacy: "帝國遺產"
 CHI_imperial_legacy_desc: "數千年以來，中國始終作為東亞地區和平與穩定的主宰屹立不倒，舊秩序需要重塑。"
 CHI_overlordship_over_indochina: "雄霸印度支那"
 CHI_overlordship_over_indochina_desc: "印度支那地區在舊時一直蒙蔭著中國的庇護，此前法國殖民侵略的事實證明其根本無力自保。"
 CHI_dominate_japan: "征服日本"
 CHI_dominate_japan_desc: "數十年來，日本都是我國獨立自主的最大威脅。他們此前曾勾結西方列強來奴役我們，這事絕不能容忍再度發生，因此有必要先發制人。"
 CHI_secure_the_peninsula: "確保半島穩定"
 CHI_secure_the_peninsula_desc: "確保朝鮮半島永遠不會被外敵侵佔，是符合我國最大利益的選擇。"
 CHI_british_cooperation: "同英國合作"
 CHI_british_cooperation_desc: "儘管英國是頭號的帝國主義，但與其展開合作或能給我國空軍提供現代化的良機，同時亦能確保穩定的補給供應來源。"
 CHI_burma_road: "滇緬公路"
 CHI_burma_road_desc: "滇緬公路構成了我國與西方聯絡的生命線，必須對其不惜一切代價予以保護，同時還應進一步拓寬以確保補給輸送的暢通。"
 CHI_ledo_road: "中印公路"
 CHI_ledo_road_desc: "單靠滇緬公路還無法完全維持態勢，我們必須開拓新的交通線以確保軍需物資對我國的輸送。"
 CHI_fighter_purchases: "購買戰鬥機"
 CHI_fighter_purchases_desc: "我國空軍急需現代化戰鬥機來應對外敵的威脅。由於我國工業尚無法實現飛行器生產，因此必須訴諸於從國外訂購。"
 CHI_camco: "中央飛機制造廠"
 CHI_camco_desc: "如果我們想要建立起獨立的航空工業，那麼我們就必須首先學習如何組裝飛機以及對現有飛機進行維護的技術方法。"
 CHI_local_fighter_production: "國產戰鬥機製造"
 CHI_local_fighter_production_desc: "隨著我國工人已經熟悉如何展開基礎的維修工作，我們現在可以進一步開始製造現代戰鬥機所需的所有零部件。"
 CHI_local_bomber_production: "國產轟炸機制造"
 CHI_local_bomber_production_desc: "在掌握了單引擎飛機的製造技術後，我們接下來可以開始嘗試研發重型多引擎的飛機型號並將其運用於地面支援任務上。"
 CHI_the_hump: "駝峰航線"
 CHI_the_hump_desc: "相較於其他的運輸渠道，飛越喜馬拉雅山脈的空運似乎是個糟糕的替代方案，但同時也更加難以被破壞。"
 CHI_chinese_expeditionary_force: "中國遠征軍"
 CHI_chinese_expeditionary_force_desc: "為了同各盟國實現更好的協調，美國方面已經派遣了一位將軍來領導新的聯合部隊。"
 CHI_the_chu_x_po: "朱氏-研驅零號"
 CHI_the_chu_x_po_desc: "朱氏-研驅零號代表了中國在飛機領域發展的頂峰——作為首架自行研發且投入生產的戰鬥機，它足以對抗任何對手。"
 CHI_mission_to_the_us: "派遣使團赴美"
 CHI_mission_to_the_us_soong_us_decision: "只要§Y宋美齡§!是§Y政治顧問§!，美國就更有可能在我國對抗§Y日本§!的戰爭中予以援助。\n"
 CHI_mission_to_the_us_desc: "中國在美國國內擁有著長期可靠的支持群體，這些人代表著我們爭取支持的最好機會。"
 CHI_hire_chennault: "聘請陳納德"
 CHI_hire_chennault_desc: "美軍空戰理論家克萊爾·陳納德對於赴華外派很感興趣，我們應該聘請他來重建我國的空軍。"
 CHI_invite_the_flying_tigers: "邀請飛虎隊"
 CHI_invite_the_flying_tigers_desc: "我們在美國的朋友們已經組建了一支志願航空隊，同時還購置了一批現代化的戰機用於援助我國。我們只需點頭同意，此事即可成行。"
 CHI_sino_american_cooperative_organization: "中美特種技術合作所"
 CHI_sino_american_cooperative_organization_desc: "美國情報部門願意協助我方在敵後戰線組織特種作戰，此項合作可幫助提升我們在此領域的能力。"
 CHI_light_cruiser_project: "輕巡洋艦項目"
 CHI_light_cruiser_project_desc: "組建一支可靠藍水海軍的第一步便是實現我軍巡洋艦隊的現代化，因此我們的首個項目不宜過於好高騖遠。"
 CHI_heavy_cruiser_project: "重巡洋艦項目"
 CHI_heavy_cruiser_project_desc: "隨著此前的巡洋艦項目宣告成功，我們現在可以拓展規模並提升其性能，設計出能夠承擔艦隊中堅職責的新式軍艦。"
 CHI_naval_aviation: "海軍航空作戰"
 CHI_naval_aviation_desc: "海戰的未來屬於航空母艦，除非擁有自己的航母，否則我們永遠也不能被視作真正的海軍強國。"
 CHI_carrier_air_wing: "艦載空軍聯隊"
 CHI_carrier_air_wing_desc: "航空母艦隻有在搭載戰機的情況下才配稱得上是強大的戰力，我們必須確保我軍航母能夠搭載性能最優且最為先進的艦載機。"
 CHI_investment_into_shipbuilding: "投資造船業"
 CHI_investment_into_shipbuilding_desc: "雄壯的艦隊需要堅實的工業基礎加以支撐，我們應該邀請外國投資者來幫助我國興建屬於自己的造船廠。"
 CHI_order_destroyers: "訂購驅逐艦"
 CHI_order_destroyers_desc: "作為海軍重整的第一步，我們應該擁有一批驅逐艦。"
 CHI_train_marines: "訓練海軍陸戰隊"
 CHI_train_marines_desc: "我國漫長的海岸線雖然很容易遭到敵國的登陸突襲，但這也為我們提供了應對自陸路入侵的敵人時從對方意想不到的方向發動突襲的機會。"
 CHI_collaboration_with_the_japanese: "對日親善"
 CHI_collaboration_with_the_japanese_desc: "無論他們對中國打著什麼算盤，日本人都已經明確表示，只要我方展現足夠的誠意，他們便願意與我們展開協作。"
 CHI_modern_submarines: "現代潛艇"
 CHI_modern_submarines_desc: "雖然日本人不願意提供給我方可能在正規海戰中威脅到他們聯合艦隊的技術，但他們認為潛航作戰是適合我們的輔助性選項，當然，我方並不需要苟同這種看法。"
 CHI_coastal_patrol_planes: "海岸巡航戰機"
 CHI_coastal_patrol_planes_desc: "我國漫長的海岸線只能通過空中巡航來有效監管，而現代化的海軍轟炸機將使我們能夠在耗資不多的前提下有效地保衛我國海岸線。"
 CHI_three_principles_of_the_people: "三民主義"
 CHI_three_principles_of_the_people_desc: "作為中華民國國父的孫中山總理為實現國富民強，提出了三大綱領要義，即民族主義、民權主義以及民生主義。"
 CHI_welfare: "民生主義"
 CHI_welfare_desc: "現代化的國家定會使本國公民安居樂業，如此，當時局必要時，國民必定能夠且願意捍衛這個國家。"
 CHI_refugee_relief_agency: "難民救濟總署"
 CHI_refugee_relief_agency_desc: "戰爭連綿，舉國震盪，數百萬人已流離失所。我們需要組建專門的機構以幫助難民在新地安定落戶。"
 CHI_land_tax_reform: "地租改革"
 CHI_land_tax_reform_desc: "我國的財稅體制迫切需要進行改革，而其中之一便是要擴大稅收基數。"
 CHI_refugee_resettlement: "難民安置"
 CHI_refugee_resettlement_desc: "數百萬因戰亂而流離失所的絕望難民必須要得到妥善的安置，通過在我國領土上對其施以庇護，我們可以將其化作服務於我軍和國家經濟的預備役人力來源。"
 CHI_new_life_movement: "新生活運動"
 CHI_new_life_movement_desc: "仁義忠信乃中華民族的傳統思想美德，今後必將引導國民走向更加美好且富強的生活。"
 CHI_unemployment_assistance: "失業救濟"
 CHI_unemployment_assistance_desc: "失業絕不能使國民陷入到窮困潦倒的境地，要知道饑饉是共黨最可怕的幫手。"
 CHI_free_hospitals: "免費醫療"
 CHI_free_hospitals_desc: "偉大的國家絕不會放任本國的公民獨自承受病痛的折磨，通過創建綜合性的醫療保障體系，我們將能夠確保實現對國民總體健康狀況的改善，他們必將為此感恩戴德，進而盡忠報國。"
 CHI_rural_schooling: "鄉村教育"
 CHI_rural_schooling_desc: "使人民大眾受到良好的教育是實現國家現代化的關鍵，我們不能僅僅依靠少數受過精英教育的統治階級，而應該把求知與科學的精髓傳播到廣大鄉村。"
 CHI_democracy: "民權主義"
 CHI_democracy_desc: "由孫中山總理開創的道路必須抵達再造共和的彼岸。這無疑是漫長的征途，但我們必須逐步踐行。"
 CHI_constitutional_reform: "修訂憲法"
 CHI_constitutional_reform_desc: "我國當前所面臨的問題很大程度上來源於現行的憲法並未能切實反映中國的現狀，我們必須予以糾正。"
 CHI_republicanism: "共和主義"
 CHI_republicanism_desc: "許多西方國家都懷疑我國是否真的能夠按照西方的模式建立起共和政體，對此我們應該發表公開聲明以彰顯本國的決心。"
 CHI_inter_party_coordination_council: "政治協商會議"
 CHI_inter_party_coordination_council_desc: "如果要結束訓政並將我國帶入多黨政制時代，創建一個能夠讓其他有關各方共商國是的機構應為首要步驟。"
 CHI_judicial_yuan: "司法院"
 CHI_judicial_yuan_desc: "昔日孫中山總理曾對現代民國作出了建立分權體制的構想，我國的司法需要獨立而不受外界因素干擾，其決策亦應當忠實地基於法律。"
 CHI_control_yuan: "監察院"
 CHI_control_yuan_desc: "任何政府都無法規避腐敗問題，但高效的政府則會將其限制在可控範圍內，我們將會為此在政府中創建一個專門的機構，並賦予其和立法院、行政院和司法院相當的地位。"
 CHI_examination_yuan: "考試院"
 CHI_examination_yuan_desc: "數千年來，中國的官吏都是通過嚴格的考試選拔產生的，也許如今考試的內容已經發生了變化，但擇優錄用的原則依然不變。"
 CHI_executive_yuan: "行政院"
 CHI_executive_yuan_desc: "依法行政是政府的核心要務，因此毫無疑問，建立行政院是組成有效運轉的國民政府的首要步驟。"
 CHI_legislative_yuan: "立法院"
 CHI_legislative_yuan_desc: "通過民選代表進而由其制定治國的律法是現代共和國的核心機制，我國絕不能在這方面有所缺失。"
 CHI_nationalism: "民族主義"
 CHI_nationalism_desc: "能夠將作為個體的人團結成國家的核心理念是個人歸屬於民族，而非宗族或宗教。"
 CHI_foreign_threats: "攘外"
 CHI_foreign_threats_desc: "就在數年前，日本人從我們手中奪走了東北地區，還在當地扶植了傀儡政權。鑑於他們在鯨吞全中國前絕不會善罷甘休，我們必須作好迎戰這些東洋鬼子的準備，即便這意味著要和中華各地的割據勢力談判妥協。"
 CHI_prioritize_the_interior: "安內"
 CHI_prioritize_the_interior_desc: "在我們準備好從日本人手中奪回失竊的國土前，我們必須優先確保國內的安全，在舉國分裂、兄弟鬩牆的情況下，我們不可能有機會收復失地。"
 CHI_united_front: "統一戰線"
 CHI_united_front_desc: "日寇已然兵臨城下，我們必須開誠接納一切救國力量——即便是共黨分子。"
 CHI_pick_a_fight_with_japan: "先發逐日"
 CHI_pick_a_fight_with_japan_desc: "多年以來，日本人都在我們頭上作威作福，而這樣的日子到此為止，下一次哪怕他們提出再小的要求，我們也再不會退讓一步。"
 CHI_anti_communism: "反共"
 CHI_anti_communism_desc: "共產主義構成了對我國最大的威脅，我們必須無情地將其徹底剿滅。"
 CHI_subjugate_the_warlords: "蕩平軍閥"
 CHI_subjugate_the_warlords_desc: "昔日我國式微之際，地方軍閥割據霸佔了大片國土。而今我們是時候提醒他們對此作出回應了——無論通過怎樣的方式。"
 CHI_war_of_resistance: "全面抗戰"
 CHI_war_of_resistance_desc: "我國如今尚還無力向日本發起反攻，而今我們唯有全力抗戰，直到反擊之時的到來。"
 CHI_industrial_evacuations: "工業疏散"
 CHI_industrial_evacuations_desc: "現代戰爭獲勝的關鍵在於工業，沒有槍炮武裝的軍隊不過是花架子。"
 CHI_war_of_national_liberation: "民族解放戰爭"
 CHI_war_of_national_liberation_desc: "眼下日本人的攻勢已被挫敗，我們可以發起反攻，解放我國全部的領土。"
 CHI_scorched_earth_tactics: "焦土政策"
 CHI_scorched_earth_tactics_desc: "在關乎民族存亡的戰爭中，我們無需顧忌任何因素，任何手段都可作為備選。"
 CHI_war_of_anti_imperialism: "反帝戰爭"
 CHI_war_of_anti_imperialism_desc: "隨著國土皆從外敵的壓迫中解放，我們現在可以將目光投向敵國的國境線，以此來確保他們再不能發動侵略。"
 CHI_forced_conscription: "強制徵兵"
 CHI_forced_conscription_desc: "我國目前的徵召政策仍然不能滿足我軍對士兵的需求，要知道這場戰爭的失敗就意味著亡國滅種，所以我們必須從國民中徵調更多人力。"
 CHI_dare_to_die_corps: "敢死隊"
 CHI_50_cheaper_force_attack: "§Y強行進攻§!的花費§G-50%§!。\n"
 CHI_dare_to_die_corps_desc: "在這場為捍衛國家而進行的戰爭當中已經湧現了許多烈士，而在戰爭結束之前，定會有更多的忠勇之士為了黨國的存亡前赴後繼，他們的犧牲必將為後世數代人所銘記。"
 CHI_military_affairs_commission: "軍事委員會"
 CHI_military_affairs_commission_desc: "國軍作戰能力的低下已經到了令人髮指的地步，高階指揮層的改革只不過是徹底解決問題的第一步。"
 CHI_fortify_shanghai: "築防上海"
 CHI_fortify_shanghai_desc: "若日本發動進攻，其首要襲擊目標必定是上海，我們必須對此有所準備。"
 CHI_army_reform: "軍隊改革"
 CHI_army_reform_desc: "貪腐、低能以及怯懦的頑疾遍佈於國軍各階指揮層當中，要解決此問題將會是漫長的過程。"
 CHI_bureau_of_investigation_and_statistics: "軍統局"
 CHI_bureau_of_investigation_and_statistics_desc: "當我們置身於決定國家未來的存亡之戰時，我們絕不能放任叛徒和間諜肆意橫行。新組建的機構在行事上或許令人感到不快，但其工作必須予以落實。"
 CHI_the_chinese_hindenburg_line: "中國興登堡防線"
 CHI_the_chinese_hindenburg_line_desc: "德國顧問們根據上次大戰中的築壘經驗為我們的防務提供了許多寶貴的建議，若是敵軍膽敢嘗試突破上海防線，其必將在這些堡壘下流盡鮮血。"
 CHI_60_divisions_plan: "60師整訓計劃"
 CHI_60_divisions_plan_desc: "在解決目前的問題上，我們的外國顧問沒有采取人海堆填的方式，相反他們提出了全新的方案：通過規模相對較小但卻得到充分訓練的精銳部隊去對抗我們的敵人。試點項目為此已經展開。"
 CHI_whampoa_military_academy: "黃埔軍校"
 CHI_whampoa_military_academy_desc: "沒有勝任的指揮官加以統率的軍隊不堪一擊，如果我們想要將國軍建設成一流的武裝力量，就必須要有傑出的軍官來進行領導。"
 CHI_unified_industrial_planning: "統一工業規劃"
 CHI_unified_industrial_planning_desc: "我國雄心勃勃的工業發展計劃絕不能有所拖沓。"
 CHI_expand_the_academica_sinica: "擴大中央研究院"
 CHI_expand_the_academica_sinica_desc: "上千年來，中國都在藝術和科學方面引領著世界的發展潮流，提升對我國高校的預算投資將只是重奪此地位的第一步。"
 CHI_chemical_research_institute: "化學研究所"
 CHI_chemical_research_institute_desc: "儘管我們絕不會率先動用化學武器，但萬一遭受化學攻擊時，我們還是應當能夠有所防備。為此，我們應該投資建設新的研究機構來發展有關的技術方法。"
 CHI_rural_reconstruction_movement: "農村復興運動"
 CHI_rural_reconstruction_movement_desc: "儘管我們在改善城鎮居民生活質量方面已經取得了長足進步，但是在距離城市不遠的鄉村地區，農民的生活質量卻仍然停留在中世紀的水平。我們應當確保每一位國民都能夠享受到我國建設的成果。"
 CHI_mining_commission: "資源委員會"
 CHI_mining_commission_desc: "戰略資源對於戰爭的勝負而言至關重要，國民政府必須直轄國家的礦業生產，確保各類資源的產出能夠滿足需求。"
 CHI_taiyuan_arsenal: "太原兵工廠"
 CHI_taiyuan_arsenal_desc: "太原兵工廠是中國少數能夠生產重武器的廠家，我們應當對其加以擴建，使其為我軍供應足夠的火炮以及其他武器。"
 CHI_develop_the_hanyan_arsenal: "擴建漢陽兵工廠"
 CHI_develop_the_hanyan_arsenal_desc: "漢陽兵工廠長久以來都為中國軍隊供應所需的槍炮。對其進行擴建能夠確保其未來提供穩定的產能。"
 CHI_financial_policy: "金融政策"
 CHI_financial_policy_desc: "國家目前的財政狀況並不十分穩定，而政府雄心勃勃的各項計劃也催生了惡性通貨膨脹的頑疾，為此，金融改革必須成為我國亟需解決的要務之一。"
 CHI_price_controls: "調控物價"
 CHI_price_controls_desc: "遏制通貨膨脹的首要步驟便是確保主要商品在價格上保持穩定，當然此舉對於商賈階層來說也許並不討喜。"
 CHI_grain_tax: "穀物稅"
 CHI_grain_tax_desc: "政府發行的紙幣在購買力上每況愈下，長此以往我國將無力再供養軍隊的薪餉。為此，我們可以制定新的政策，規定農民不得將穀物流入市場，而是必須將其作為實物稅上繳。當然，他們肯定不會滿意此項政策，且亦將導致社會滋生全面饑荒的隱患。"
 CHI_reform_the_national_bank: "改革國家銀行"
 CHI_reform_the_national_bank_desc: "改革後，新的國家銀行將協調政府的所有金融活動，並且為其提供必要的資金。"
 CHI_forced_loans: "強制借貸"
 CHI_forced_loans_desc: "鑑於商人和工業家此前在和平年代積累了不可思議的財富，如今要求他們毀家紓難所拿出的錢財肯定算不上多，再說我們也作出承諾，只要情況許可，就會立即還款。"
 CHI_purchase_tanks_tt: "我們將從援助國方面收到100輛舊式輕型坦克。"
 CHI_purchase_fighters_tt: "我們將從援助國方面收到50架舊式戰鬥機，確保同時得到英美的支持則將可以從雙方手中購買戰機。"
 PRC_strengthen_the_central_secretariat: "強化中央書記處"
 PRC_strengthen_the_central_secretariat_desc: "長征結束後，我們必須重組黨的政治機構，以確保能夠站穩腳跟繼續對抗國民黨。"
 PRC_marxist_orthodoxy: "正統馬克思主義"
 PRC_marxist_orthodoxy_desc: "實現共產主義革命的關鍵，在於最大程度上忠實地執行馬克思的有關論斷。"
 PRC_soviet_leadership: "以蘇為鑑"
 PRC_soviet_leadership_desc: "蘇聯作為共產主義實踐道路上的老大哥，我們應該予以尊崇並學習其相關的經驗。"
 PRC_soviet_economic_aid: "蘇聯經濟援助"
 PRC_soviet_economic_aid_desc: "若是沒有外界的援助，長征所帶來的毀滅性創傷也許要歷經數代人才能撫平。我們應當和蘇聯同志交涉，請求其施予經濟援助。 "
 PRC_internationalism: "國際主義"
 PRC_internationalism_desc: "全世界的工農同胞必須團結起來，掙脫他們身上的枷鎖。齊心協力，我們將共建更加美好的未來。"
 PRC_agrarian_socialism: "農業社會主義"
 PRC_agrarian_socialism_desc: "中國和世界上其他的工業化國家存在著根本的不同，指望實現如馬克思描繪那般的共產主義革命，便是對我國現實國情的誤解。"
 PRC_rectification_campaign: "整風運動"
 PRC_rectification_campaign_desc: "儘管黨目前在有關前進路線的問題上存在著相當多的錯誤思想，我們也應該給犯錯誤的同志以機會，使其認識到自身的錯誤。"
 PRC_maoism: "毛澤東思想"
 PRC_maoism_desc: "偉大的毛主席花費了數月時間將他的政治理論進行了系統闡述，最終形成了指引我國前進的毛澤東思想。"
 PRC_socialism_with_chinese_characteristics: "馬克思主義中國化"
 PRC_socialism_with_chinese_characteristics_desc: "雖然馬克思的論述毫無疑問是傑出的，但他終究是從歐洲的角度來看待問題，中國特殊的國情應當在我們的社會主義建設政策上得到體現。"
 PRC_proclaim_the_peoples_republic: "宣告新中國成立"
 PRC_proclaim_the_peoples_republic_desc: "隨著和國民黨反動派的對決宣告勝利，我們現在是時候正式接管作為中國合法政府的地位了。儘管還有許多工作亟需完成，但前路已豁然開朗。"
 PRC_socialist_market_economy: "社會主義市場經濟"
 PRC_socialist_market_economy_desc: "根據馬克思的定義，通向社會主義乃至共產主義的道路上，必定存在著資本主義的過渡。由於中國此前從未發展過正常的資本主義市場經濟，因此我們幾乎沒有可能直接一蹴而就進入社會主義，發展資本主義的生產方式乃當務之急，其後方可循序漸進。"
 PRC_social_democracy_focus: "社會民主主義"
 PRC_social_democracy_focus_desc: "黨的“左”傾錯誤只會進一步惡化事態，儘管國民黨存在著諸多缺陷，但也能夠在我們建設更美好未來的征途中成為盟友。為此，我們必須在政治領域主動接近他們。"
 PRC_coalition_government: "聯合政府"
 PRC_coalition_government_desc: "儘管距離國家統一尚還有很長的路要走，但是和國民黨組成聯合政府顯然將會為此目標鋪平道路。"
 PRC_purge_the_radicals: "清洗激進派"
 PRC_purge_the_radicals_desc: "我黨內部至今還有部分人堅信著階級鬥爭理論並且反對著他們所謂的“剝削階級”，那麼很遺憾，他們必須被請離。"
 PRC_strengthen_the_left_wing_of_the_kmt: "扶持國民黨左派"
 PRC_strengthen_the_left_wing_of_the_kmt_desc: "國民黨在其內部有自己的派系紛爭，而其內鬥正在破壞我等雙方政權達成協議的努力。我們應盡最大的力量來確保我們在國民黨的盟友贏下其黨內的權力鬥爭。"
 PRC_remove_chiang_kai_shek: "謀除蔣介石"
 PRC_remove_chiang_kai_shek_desc: "儘管我們作出了許多努力，但蔣委員長仍然打心底裡視我們為共匪，他冥頑不化的成見而今已是問題，我們必須對此採取措施。"
 PRC_national_leadership: "國家領導權"
 PRC_national_leadership_desc: "隨著蔣中正退出歷史舞臺，阻礙統一的最後反對力量也已消散，是時候由我們在聯合政府中接管領導職責了。"
 PRC_land_redistribution: "土地改革"
 PRC_land_redistribution_desc: "幾個世紀以來，耕種土地的佃農都必須要向地主繳納租稅。而從今往後，我們將改變這種情況。"
 PRC_the_yanan_base_area: "延安根據地"
 PRC_the_yanan_base_area_desc: "革命的基本盤在於延安，如果我們想要在即將到來的爭鬥當中獲勝，就必須對延安加以建設及強化。"
 PRC_prepare_for_war_with_japan: "對日備戰"
 PRC_prepare_for_war_with_japan_desc: "日本軍國主義對我國構成了最嚴重的威脅，他們妄圖以此前中國政府無法想像的手段對我國加以分割並且壓榨。在民族大義面前，和國民黨之間的爭鬥相較而言已顯得不值一提。"
 PRC_government_of_national_defense: "國防政府"
 PRC_government_of_national_defense_desc: "分裂的國家最終必將走向毀滅，我們必須聯手國民黨以加強國家的防禦。"
 PRC_confrontation_with_the_warlords: "對抗軍閥"
 PRC_confrontation_with_the_warlords_desc: "放眼中華各地，有些割據者無視中央政府，拒絕在這場爭鬥當中作出明確的表態；有甚者則陰謀試圖篡奪國家領導權，甚至是與日本人狼狽為奸。無論如何，他們都必須與我們保持合作。"
 PRC_anti_japanese_expedition: "敵後抗戰"
 PRC_anti_japanese_expedition_desc: "以我們目前的狀況去公然對抗日本人，與其說是勇敢，不如說是愚蠢。我們應該首先派遣小部隊滲透敵方領土構建根據地，當時機成熟時，便可旋即發動起義。"
 PRC_revolutionary_military_commission: "革命軍事委員會"
 PRC_revolutionary_military_commission_desc: "我們必須設立專門的機構，來統籌規劃對敵人發動的革命鬥爭。"
 PRC_provoke_japan: "對日尋釁"
 PRC_provoke_japan_desc: "我們過去的三代人都生活在日本人威脅的陰影之下，抗擊日本的侵略擴張，必將使我們成為中國人民眼中的英雄。即便日本人不願意立刻發動戰爭，我們也會讓他們騎虎難下、不得不發。"
 PRC_protracted_warfare: "持久戰"
 PRC_protracted_warfare_desc: "我們必須按照自身條件來組織作戰，而中國擁有著龐大的人口足以經受持久的鏖戰。相比之下，正面抗戰無異於自尋死路。"
 PRC_mobile_warfare: "運動戰"
 PRC_mobile_warfare_desc: "我們不能一輩子都躲在深山老林裡面打游擊，是時候主動出擊，向世界證明我們並不畏懼與敵人正面作戰了。"
 PRC_peoples_war: "人民戰爭"
 PRC_peoples_war_desc: "其他國家或許迷信贏得戰爭的關鍵在於技術與火力，但我們早已悟徹，沒有什麼技術能比得上視死如歸、頑強抗戰的人民。"
 PRC_100_regiments_campaign: "百團大戰"
 PRC_100_regiments_campaign_desc: "我們迄今為止都專注於組織小規模作戰和襲擊，或許敵人因此覺得我們除了滋擾外不足為慮。若是他們沉浸於這樣虛幻的安全感當中，那麼我們就馬上送給他們一場聲勢浩大的進攻。"
 PRC_central_military_commission: "中央軍事委員會"
 PRC_central_military_commission_desc: "隨著我們的地位逐步得到鞏固，現在我們可以將鬥爭重心由挽救革命轉向奪取國家領導權。"
 PRC_peoples_liberation_army: "人民解放軍"
 PRC_peoples_liberation_army_desc: "中國工農紅軍已經完成了自己偉大的歷史使命，而在未來，我們將進一步致力於實現解放全中國人民的無上偉業。"
 PRC_peoples_volunteer_army: "中國人民志願軍"
 PRC_peoples_volunteer_army_desc: "解放工農階級的戰鬥仍然在世界各地如火如荼地進行著，而直接介入這些衝突或許並不是明智的。有時候，傾覆勝利的天平只需投入小規模的力量。"
 PRC_military_intelligence_department: "軍委情報部"
 PRC_military_intelligence_department_desc: "在人民群眾中，我們有許多能提供有價值信息的朋友，但也亦潛藏著許多敵人。有鑑於此，我們必須設立一個機構來對敵友加以區分。"
 PRC_central_security_bureau: "中央政治保衛局"
 PRC_central_security_bureau_desc: "即便是在最小的村莊裡，也絕不能容許反革命分子橫行無忌，我們的目標必然是在這些叛徒造成任何損害前就將其扼殺。"
 PRC_focus_on_china: "聚焦國內"
 PRC_focus_on_china_desc: "我們不能奢望在對抗國民黨和軍閥的情況下，還有餘力與日本鬼子作戰，必須優先擊敗前者，才有可能對付後者。"
 PRC_exploit_the_weak_neighbours: "兼併弱鄰"
 PRC_exploit_the_weak_neighbours_desc: "我們周邊的軍閥正因腐敗和內鬥虛弱不堪，而這正是我們擴大革命根據地的最佳良機。"
 PRC_infiltration: "敵後作戰"
 PRC_infiltration_desc: "國民黨妄圖與我們正面作戰，而我們可絕不能遂了其意願。我們將派遣小部隊深入敵後，發動群眾並建立根據地，如此一來，當時機適當的時候，我們便可在敵後點燃革命的燎原之火，打國民黨反動派一個措手不及。"
 PRC_enforce_the_three_rules: "貫徹三大紀律"
 PRC_enforce_the_three_rules_desc: "1、一切行動聽指揮。\n2、不拿群眾一針一線。\n3、一切繳獲要歸公。\n只要貫徹這簡單易懂的紀律，人民群眾自然會明白我們是站在他們這邊的。"
 PRC_permit_opium_trade: "默許鴉片貿易"
 PRC_permit_opium_trade_desc: "儘管有著令人遺憾的不利因素，但默許群眾種植鴉片的確能夠為我軍籌備所需的經費。"
 PRC_ban_the_opium_trade: "查禁鴉片貿易"
 PRC_ban_the_opium_trade_desc: "鴉片一直以來都是西方列強用來奴役中國人民的工具，我們絕不能縱容其繼續荼毒群眾。"
 PRC_abolish_the_land_rent: "廢除地租"
 PRC_abolish_the_land_rent_desc: "土地私有制實屬荒謬，要知道辛勤耕勞的農民群眾才是真正的主人，通過發動農民群眾使其分得田地，我們將能夠確保獲得他們的支持。"
 PRC_literacy_programs: "掃盲運動"
 PRC_literacy_programs_desc: "邁向現代社會的第一步，就是要確保老百姓們都能瞭解並參與解決自己身邊的問題。"
 PRC_china_medical_university: "中國醫科大學"
 PRC_china_medical_university_desc: "衛生和醫療保障不僅能使革命隊伍保持戰鬥力，同時也能使人民群眾受益。我們將盡快在此領域制定出新的規章方法，並將其傳授給我們的群眾。"
 PRC_form_the_academy_of_sciences: "組建中國科學院"
 PRC_form_the_academy_of_sciences_desc: "我們將整合各類研究機構以及高等院校，將其組建為新的機構以提升管理的效率。"
 JAP_the_unthinkable_option: "未敢設想的道路"
 JAP_the_unthinkable_option_desc: "我國的未來或許要仰仗一條以往的領袖從未設想過的道路，茲事體大，吾輩必須慎作決斷。"
 JAP_approach_the_young_officers: "接觸青年將校"
 JAP_approach_the_young_officers_desc: "要軍中那些老頑固接受新思潮實屬不易，我們還是把目光轉向年輕一代的將校吧。"
 JAP_approach_the_young_officers_tt: "獲得§G3§!名共產主義將領。\n"
 JAP_exchange_the_exiles: "引渡流亡者"
 JAP_if_man_accepts: "如果§H滿洲國§!接受提案，將會發生：\n"
 JAP_exchange_the_exiles_desc: "不久前我們曾將左翼的軍官和公務員半流放式地趕到了滿洲，而現在，是時候將其召回來頂替我國的右翼了。"
 JAP_open_up_the_universities: "高校開放辦學"
 JAP_open_up_the_universities_desc: "所有人都有學習知識的權利，無論其社會地位或出身如何。"
 JAP_cast_the_die: "孤注一擲"
 JAP_cast_the_die_desc: "吾輩在政治和軍事上的基礎已然鞏固，如今是時候為命運而奮進了！"
 cast_the_die_TT: "§R攻佔東京將可以快速結束內戰。§!\n"
 JAP_the_fate_of_the_imperial_family: "皇室的命運"
 JAP_the_fate_of_the_imperial_family_desc: "是時候見證世襲統治在日本的終焉了，我們必須抉擇如何處置天皇及其家族。"
 JAP_rebuild_the_civil_service: "重建行政體系"
 JAP_rebuild_the_civil_service_desc: "為妥善管理國家，我們應當選拔有才之士以重建本國的行政體系。"
 JAP_reeducation_campaign: "再教育運動"
 JAP_reeducation_campaign_desc: "偉大的革命戰爭所帶來的動盪和不安仍然縈繞在國境內，我們必須對民眾展開再教育，使大眾的行為意識符合當下現狀。"
 JAP_cleaning_up_our_own_mess: "收拾爛攤子"
 JAP_finish_the_fight: "追殲窮寇"
 JAP_finish_the_fight_desc: "我們必須將革命戰火燃向舊日的殖民地，徹底摧毀我國意識形態敵人的最後堡壘。"
 JAP_join_comintern: "加入共產國際"
 JAP_join_comintern_desc: "我們無法孤軍對抗整個世界，必須要與共產主義革命的發源國並肩作戰，共同捍衛革命成果！"
 JAP_red_brigades: "日本紅軍"
 JAP_red_brigades_desc: "國民大眾不論男女，皆有責任義務保家衛國，我們將確保人人皆有機會參軍服役。"
 JAP_communist_volunteers: "共產志願軍"
 JAP_communist_volunteers_desc: "革命鬥爭並不會僅僅止步於日本，我們還必須將燎原之火燃向其他國家，大和民族最英勇無畏的戰士們將踏出國門，進一步加速他國的革命進程！"
 JAP_asian_communist_solidarity: "亞細亞共產同盟"
 JAP_asian_communist_solidarity_tt: "邀請§H[WTT_communist_china.GetNameWithFlag]§!加入我方陣營。"
 JAP_asian_communist_solidarity_desc: "西方模式的共產主義在這片大陸可沒有立足之地，我們必須和鄰國的亞細亞同胞並肩作戰，攜手開創出符合本地區需求的共產主義革命道路。"
 JAP_nationalize_the_zaibatsus: "財閥國有化"
 JAP_nationalize_the_zaibatsus_desc: "財閥在我國的政治和經濟領域予取予求的歷史將在今天被終結，從今往後，國家的權威絕不再容任何挑戰。"
 JAP_people_owned_mines: "民有礦業"
 JAP_people_owned_mines_desc: "為了提高工人群眾的勞動積極性和效率，他們將被允許在其工作的礦山當中持有股份。"
 JAP_public_works: "公共建設"
 JAP_public_works_desc: "一系列新的公共工程將會為社會帶來大量的工作機會，同時也將改善國內的基礎設施建設。"
 JAP_tokyo_aluminum_plant: "東京鋁業"
 JAP_tokyo_aluminum_plant_desc: "我們將充分發揮工人群眾的聰明才智，進而提升國家的自給自足能力。"
 JAP_purge_the_kodoha_faction: "清洗皇道派"
 JAP_purge_the_kodoha_faction_desc: "一個旨在奪取政權並推動對蘇作戰的新派系已在國內出現，我們必須在這些傢伙還未引起麻煩前將其扼殺。"
 JAP_liaison_conference: "大本營政府聯席會議"
 JAP_liaison_conference_desc: "通過組織各軍政部門負責人召開聯席會議，我們將能夠極大地提升本國的決策速度。"
 JAP_greater_east_asian_co_prosperity_sphere: "大東亞共榮圈"
 JAP_greater_east_asian_co_prosperity_sphere_desc: "西方帝國主義的霸權已然到頭，從今往後，亞細亞的人民將在帝國的領導下團結起來邁向繁榮昌盛，共建屬於亞洲人的大亞細亞！"
 JAP_intervene_in_china: "盧溝橋事變"
 JAP_intervene_in_china_desc: "儘管[Root.GetNameDefCap]的資源著實貧乏，但我們的鄰國則截然相反，是出了名的地大物博。眼下我們急需從他們手中奪取所缺之物，但尚且還缺少個開戰的理由——這就讓一些夠膽量的士兵去做吧！只要宣戰理由落實到位，無論準備充分與否，屆時天皇陛下都只能准許我等開戰了……"
 JAP_secure_china: "征服中國"
 JAP_secure_china_desc: "中國人的抵抗正變得日益頑固且無止歇，帝國必須竭盡全力，儘速平定大陸的戰事。"
 JAP_develop_chinese_resources: "開發中華資源"
 JAP_develop_chinese_resources_desc: "我們必須充分利用所奪取的大中華地區富饒的資源，為帝國的下一場戰爭做好準備。"
 JAP_strike_south_doctrine: "南進論"
 JAP_strike_south_doctrine_desc: "儘管中華地區物產豐饒，但也仍不能滿足帝國全部的需求。不過所幸南洋還有著如荷屬東印度、英屬馬來亞-婆羅洲這樣的富饒土地。為了實現真正意義上的自給自足，哪怕要從歐洲帝國主義列強嘴裡奪食，我們也必須拿下這些地區。"
 JAP_non_aggression_pact_with_the_soviet_union: "與[SOV.GetNameDef]簽訂互不侵犯條約"
 JAP_non_aggression_pact_with_the_soviet_union_desc: "如果帝國致力於南進攻略，則必須確保北方國境線的安全，為此我們應該立即和[SOV.GetNameDef]方面展開談判。"
 JAP_bypass_the_philippines: "繞過菲律賓"
 JAP_bypass_the_philippines_desc: "和帝國真正的目標相比，菲律賓不值一提，我們應該暫時將其忽視。"
 JAP_secure_the_philippines: "征服菲律賓"
 JAP_secure_the_philippines_desc: "菲律賓是帝國南進戰略中必要的一環，我們必須將其拿下，作為未來軍事行動的前進基地。"
 JAP_strike_on_the_southern_resource_area: "南洋資源地侵攻"
 JAP_strike_on_the_southern_resource_area_desc: "執行計劃的時機已然降臨，我們將會發起對南洋的侵攻作戰，並將富饒的西方殖民地據為己有。"
 JAP_alliance_with_siam: "與暹羅結盟"
 JAP_alliance_with_siam_desc: "暹羅優越的地理位置將能夠在帝國和西方列強接下來的戰爭中提供援助，若是將其拉入我方陣營，必然對接下來進攻馬來亞和東印度群島有極大好處。"
 JAP_exploit_the_southern_resource_area: "南洋資源地開發"
 JAP_exploit_the_southern_resource_area_desc: "我們必須大幅提升東印度群島的出產，以其富饒的資源支撐戰爭中的帝國軍隊。"
 JAP_sign_tripartite_pact: "簽署三國同盟條約"
 JAP_sign_tripartite_pact_bypass_tt: "德國和意大利有一方不是法西斯政體或者與我國處於戰爭狀態。"
 JAP_sign_tripartite_pact_desc: "鑑於帝國當前所面臨的很可能是力不能及的任務，我們應該與其他有著相似目標的國家政府展開交涉，以便實現某種程度上的互助合作。"
 JAP_guide_the_zaibatsus: "財閥督導"
 JAP_guide_the_zaibatsus_desc: "長久以來，各大財閥在帝國的政治和經濟領域都擁有著不可估量的影響力，我們或許可以通過一些手段，來引導他們為國家服務。"
 JAP_nationalize_war_industry: "國有戰爭工業"
 JAP_nationalize_war_industry_desc: "通過增強國家對戰爭工業的控制，我們將能夠極大地提升其效率及產能。"
 JAP_coal_liquification: "煤炭液化"
 JAP_coal_liquification_desc: "由於[JAP.GetNameDefCap]的石油資源匱乏，我們必須在合成油的技術領域下大功夫。"
 JAP_national_mobilization_law: "國家動員法案"
 JAP_national_mobilization_law_desc: "新的動員法案不僅將使兵役範圍更加廣泛，同時也會向國民大眾灌輸保家衛國的使命感，使其清楚地意識到戰爭的必要性。"
 JAP_national_research_policy: "國家科研政策"
 JAP_national_research_policy_desc: "政府對科研機構的支持以及指導，將能夠使我們在科研項目中更加靈活且兼具效益。"
 JAP_imperial_arsenals: "皇國造兵廠"
 JAP_imperial_arsenals_desc: "通過增強天皇對戰爭工業的控制，我們將能夠極大地提升其效率及產能。"
 JAP_national_defense_state: "國防狀態"
 JAP_national_defense_state_desc: "全體國民都必須意識到加強國防的緊迫性，我們必須在面臨外敵入侵時將國家打造為固若金湯的堡壘。"
 JAP_spiritual_mobilization: "精神動員"
 JAP_spiritual_mobilization_desc: "通過塑造促使國民奮勇參軍的神道信條，我們可以進一步提升徵募的兵員數量。"
 JAP_warrior_spirit: "武士道精神"
 JAP_warrior_spirit_desc: "基於國立神道教的存在，我們得以向國民灌輸為天皇陛下盡忠的七生報國精神。"
 JAP_strengthen_the_divine_wind: "強化神風特攻"
 JAP_strengthen_the_divine_wind_effect: "解鎖§H橫須賀MXY7 櫻花§!的製造。"
 JAP_strengthen_the_divine_wind_effect_bba: "啟用§H固定炸藥§!模塊"
 JAP_strengthen_the_divine_wind_desc: "神風特攻如今已從迫不得已的決死突擊演變為了成體系的作戰學說，隨著新型自殺式特攻機列裝服役，其進攻將更加勢不可擋。"
 JAP_support_the_kodoha_faction: "扶持皇道派"
 JAP_support_the_kodoha_faction_desc: "一個旨在奪取政權並推動對蘇作戰的新派系已在國內出現，為了天皇陛下以及帝國的未來，我們必須確保此派系發展壯大！"
 JAP_challenge_the_zaibatsus: "威懾財閥"
 JAP_challenge_the_zaibatsus_desc: "儘管長久以來，各大財閥在帝國的政治和經濟領域都擁有著不可估量的影響力，但我們必須警示他們身為臣下，依舊要對天皇陛下的聖意俯首懾服。"
 JAP_showa_restoration: "昭和維新"
 JAP_showa_restoration_desc: "長久以來，天皇陛下都僅作為帝國名義上的統治者，但而今，他必須親掌這個國家。只有如此，帝國方才能夠與西方列強相抗衡。"
 JAP_modern_shogunate: "現代幕府"
 JAP_modern_shogunate_desc: "天皇陛下仍然需要維持其禮節性的尊位，並通過得力的臣下代為統治這個國家，此舉必將能使陛下的玉音和聖意得到深入而有效的落實。"
 JAP_prepare_for_war_with_the_soviet_union: "準備對[SOV.GetNameDef]的戰爭"
 JAP_prepare_for_war_with_the_soviet_union_desc: "我們必須解決盤踞在帝國北境的[SOV.GetSovietThreatName]威脅，必須即刻著手準備對[SOV.GetNameDef]的戰爭。"
 SOV_communist_threat: "共產主義"
 SOV_fascist_threat: "法西斯主義"
 SOV_country_threat: "[SOV.GetAdjective]"
 SOV_communist_threatAlt: "布爾什維主義"
 SOV_fascist_threatAlt: "帝國主義"
 JAP_join_the_london_naval_treaty: "加入倫敦海軍條約"
 JAP_join_the_london_naval_treaty_desc: "如果要專注於屠熊，我們就必須保護帝國脆弱的側腹。倘若只需通過一紙限制海軍的條約就能帶來安寧的話，那麼也未嘗不可。"
 JAP_build_up_the_manchurian_army: "擴編滿洲帝國陸軍"
 JAP_build_up_the_manchurian_army_desc: "[MAN.GetNameDefCap]將成為任何北方戰事的最前線，我們必須確保其有足夠的能力應對潛在的威脅。"
 JAP_non_aggression_pact_with_china: "與中國簽訂互不侵犯條約"
 JAP_non_aggression_pact_with_china_desc: "儘管近百年來帝國與中國的外交關係頗為緊張，但至少我們現在需要與其達成互不侵犯條約，以此解放軍隊，向北進軍。"
 JAP_create_a_manchurian_imperial_air_force: "創建滿洲帝國空軍"
 JAP_create_a_manchurian_imperial_air_force_desc: "奪取制空是戰爭勝利的關鍵，如果[MAN.GetNameDef]能擁有其自己的空軍力量，將能夠極大地提升我軍的空中優勢。"
 JAP_technological_exchange: "科技交流"
 JAP_technological_exchange_desc: "帝國需要能攜手放倒俄國巨熊的盟友，而德國不僅是強力的潛在盟友，而且也在諸多科技領域保持著領先地位。兩國若能聯手，必定大有可為。"
 JAP_preemptive_war: "先發攻蘇"
 JAP_preemptive_war_desc: "通過偽造[SOV.GetAdjective]不斷進犯帝國北疆的報告，我們可以為自己製造口實，以發動消滅北方威脅的先制戰爭。"
 JAP_establish_the_northern_resource_area: "北方資源地建設"
 JAP_establish_the_northern_resource_area_desc: "西伯利亞富饒的資源必須為帝國全速運轉的戰爭機器所用。"
 JAP_german_rocketry: "德國火箭科技"
 JAP_german_rocketry_desc: "德國方面超前的領先科技對帝國的戰事極為有用，無論代價如何，我們必須得到他們的設計圖紙。"
 JAP_strengthen_civilian_government: "強化文官政府"
 JAP_tora_tora_tora_idea: "虎！虎！虎！"
 JAP_tora_tora_tora_idea_desc: "在最初的突襲得手後，日本人便展開了以航母機動部隊為核心的閃電戰攻勢。"
 JAP_strengthen_civilian_government_desc: "不斷傳播的自由主義和民主主義價值觀並非是國家的災厄，相反正是我國最有力的武器。我們必須確保政府足夠強大，捍衛自由和民主的理念不動搖。"
 JAP_ally_with_the_zaibatsus: "聯合財閥"
 JAP_ally_with_the_zaibatsus_desc: "長久以來，各大財閥在國家政治和經濟領域都擁有著不可估量的影響力，他們是機會均等和自由的成功典範，我們必須尋求與其展開合作，共建國家發展。"
 JAP_research_spending: "科研撥款"
 JAP_research_spending_desc: "如果我們想要充分運用我國精英的聰明才智，就必須為科研項目撥出充足的預算。"
 JAP_pre_emptive_coup: "先發政變"
 JAP_pre_emptive_coup_desc: "我們必須率先發動政變，為我國的下一代贏得免受專制政權踐踏自由民主理念的未來。"
 JAP_purge_the_militarists: "清洗軍國派"
 JAP_purge_the_militarists_desc: "如果我們要為頭腦冷靜的決策者騰出空間，那麼信奉武力至上的莽夫們就必須從祖國的列島上驅逐，他們也許可以在別處另尋出路。"
 JAP_the_showa_constitution: "昭和憲法"
 JAP_the_showa_constitution_desc: "我們認可並尊重我國皇室的歷史地位，然而，我們致力於建設的新日本絕不容許威權主義存在。因此，我們將維持天皇陛下作為名譽統治者的地位，但其權力將如同許多西方立憲君主國那樣，受到憲法的嚴格規制。"
 JAP_west_pacific_treaty_organization: "西太平洋公約組織"
 JAP_west_pacific_treaty_organization_desc: "我國和其他亞洲國家共同組建的聯盟將確保能夠有力抵禦任何潛在威脅，同時捍衛新生的國家理念。"
 JAP_rekindle_the_old_alliance: "重構舊同盟"
 JAP_rekindle_the_old_alliance_desc: "對我國而言，最佳的選擇便是和上次大戰時的[ENG.GetNameDef]盟友再度攜手，我們將並肩作戰，共同捍衛民主秩序。"
 JAP_pacific_guardian: "太平洋守護者"
 JAP_pacific_guardian_desc: "為了環太平洋和亞細亞諸國的利益，我們將承擔起守護者的職責，若他們希望成長為健全的民主國家，就必須要依靠我國的指導。"
 JAP_anti_communist_bulwark: "反共堡壘"
 JAP_anti_communist_bulwark_desc: "民主的準則與所謂的共產主義水火不容，我們必須堅定地對抗這邪惡的意識形態，使我國自身乃至友邦不受其侵蝕。"
 JAP_anti_communist_volunteers: "反共志願軍"
 JAP_anti_communist_volunteers_desc: "即便我們自己未正式置身於衝突當中，我們也必須和共產主義災厄鬥個至死方休。為此，我們將派出大和民族最優秀的男兒作為志願軍走出國門，捍衛民主。"
 JAP_the_korean_question: "朝鮮決議案"
 JAP_the_korean_question_desc: "我國雖然控制朝鮮半島為時已久，但有關朝鮮民族自決的問題仍懸而未決，若是我們拒絕承認朝鮮鄰居的獨立主權，那我們還能真正標榜民主的理念嗎？"
 JAP_liberate_manchuria: "滿洲解放案"
 JAP_liberate_manchuria_desc: "仍舊禁錮在專制統治枷鎖下的滿洲是我國此前醜惡殖民統治的遺毒。我們必須扭轉這一局面，將這片土地交還給中國，他們才是滿洲的合法擁有者。"
 JAP_liberate_manchuria_tt: "征服滿洲之後可以作出決議。\n"
 JAP_ultimate_deterrence: "終極震懾"
 JAP_ultimate_deterrence_desc: "保護國民生命安全的最佳選擇便是使其遠離戰爭，而研發具備毀滅性破壞力的新式武器則可確保國民永無參戰之虞。"
 JAP_full_sovereignty_for_the_philippines: "賦予菲律賓完整主權"
 JAP_full_sovereignty_for_the_philippines_desc: "全亞洲實現民族自決的進程必須繼續推進，鑑於[USA.GetNameDefCap]仍然把持著菲律賓國政，我們必須對其予以施壓，強迫其正視菲律賓人民的民主權利。"
 JAP_the_manchurian_project: "滿洲計劃"
 JAP_the_manchurian_project_desc: "儘管本土列島用地緊缺，但滿洲殖民地著實可謂地廣人稀，既然難以在本土大展拳腳，那不妨便在滿洲大地廣築高樓，就讓我們即刻在[MAN.GetNameDef]掀起大規模的工業化進程吧！"
 JAP_expand_the_showa_steel_works: "擴建昭和制鋼所"
 JAP_expand_the_showa_steel_works_desc: "作為大規模工業化進程的先決條件，我們必須對昭和制鋼所予以擴建，實現其產能的提升。"
 JAP_develop_aluminum_sources: "鋁資源開發"
 JAP_develop_aluminum_sources_desc: "為了滿足我國諸多航空項目對鋁材的需求，我們必須加大力度開發滿洲的鋁礦資源。"
 JAP_expand_manchurian_railways: "拓展滿洲鐵路網"
 JAP_expand_manchurian_railways_desc: "為滿足日益增長的工業化需求，滿洲境內的基礎設施必須要進行大刀闊斧的建設。"
 JAP_light_industry_development: "輕工業發展"
 JAP_light_industry_development_desc: "輕工業對於滿足部隊的基本需求有著至關重要的作用，必須予以開發建設。"
 JAP_heavy_industry_development: "重工業發展"
 JAP_heavy_industry_development_desc: "重工業對於滿足部隊的進一步需求有著至關重要的作用，必須予以開發建設。"
 JAP_japanese_settlement: "日本開拓團"
 JAP_japanese_settlement_desc: "通過將我國人民安置到滿洲生活，我們可以進一步擴充勞動人口併為工業發展帶來更多的機遇。"
 JAP_fortify_the_border: "鞏固邊防"
 JAP_fortify_the_border_desc: "北方國境線幾乎處於不設防的狀態，我們必須針對潛在的入侵威脅做好準備。"
 JAP_army_expansion_law: "陸軍擴編法案"
 JAP_army_expansion_law_desc: "政府必須將保證軍隊的快速擴充能力列為工作的一項核心原則。"
 JAP_small_arms_modernization: "輕武器現代化"
 JAP_small_arms_modernization_desc: "我國武裝部隊必須配備現代化的裝備，以與潛在的對手相抗衡。"
 JAP_supremacy_of_technology: "科技至上"
 JAP_supremacy_of_technology_desc: "科技是指引我們走向勝利的關鍵，我們必須不遺餘力地投入科研以期在軍備上壓倒對手。"
 JAP_modern_artillery: "現代火炮"
 JAP_modern_artillery_desc: "儘管我軍將士英勇悍戰，但也仍然需要壓倒性炮火支援以掩護推進。"
 JAP_armored_divisions: "戰車師團"
 JAP_armored_divisions_desc: "不少國家已經開始運用裝甲部隊的力量，而我國也絕不能落於人後。我們要研發更為先進且更具殺傷力的戰車，實現對敵軍的迅捷重擊。"
 JAP_bicycle_battalions: "自行車大隊"
 JAP_bicycle_battalions_desc: "機動性至關重要，而我軍將列裝自行車以大幅提升部隊的機動能力。"
 JAP_army_expansion: "陸軍擴編"
 JAP_army_expansion_desc: "為實現我國的擴軍戰略，我們必須任用那些具備過硬軍事訓練技能的軍官。"
 JAP_supremacy_of_will: "意志至上"
 JAP_supremacy_of_will_desc: "利劍若置於匹夫之手則不過爾爾，武士縱手持木劍，亦能陷陣殺敵。"
 JAP_fighter_modernization: "戰鬥機現代化"
 JAP_fighter_modernization_desc: "鑑於我們必須在包括空中戰場在內的各個領域全面壓制對手，列裝現代化戰鬥機著實很有必要。"
 JAP_range_focus: "重視航程"
 JAP_range_focus_desc: "太平洋戰場縱橫遼闊，我軍的新式戰機必須具備足夠的航程才能有效打擊敵人。"
 JAP_agility_focus: "重視機動"
 JAP_agility_focus_desc: "如果我軍戰機無法及時抵達戰場與敵軍交戰，那麼再長的航程亦無濟於事。我們必須製造出具備超強機動性的新型號，使其不會被敵軍通過投機取巧擊敗。"
 JAP_the_zero: "永遠的零"
 JAP_the_zero_desc: "由三菱重工最新設計的一款艦載戰鬥機或許將被證明是該機型領域迄今為止最為強大的存在，其無與倫比的機動性以及優秀的航程意味著此型號足可堪用多年，我們應該立即開始對原型機展開設計以及試製。"
 JAP_the_zero_tt: "解鎖§H三菱A6M 零戰§!的製造。"
 JAP_bomber_modernization: "轟炸機現代化"
 JAP_bomber_modernization_desc: "建立現代化的戰術轟炸機部隊，是我軍戰場支援的關鍵。"
 JAP_strategic_bomber_effort: "戰略轟炸機研發"
 JAP_strategic_bomber_effort_desc: "正如我們所預想的那樣，戰爭很難僅憑直接的正面軍事對抗決出勝負。鑑於國家的工業產能在很大程度上左右著戰爭的結果，我們需要投資研發新式戰略轟炸機，以實現對敵國隱蔽在戰線後方的工業展開摧毀和打擊。"
 JAP_unified_fighter_development: "聯合戰鬥機研發"
 JAP_unified_fighter_development_desc: "多年來，我們飽受陸海軍在航空發展問題上各自為政的困擾。我們必須為此將航空研發項目整合，以既確保軍備製造的標準統一，同時也更有效地利用有限的科研資源。"
 JAP_jet_prototypes: "試製噴氣機原型"
 JAP_jet_prototypes_desc: "航空領域的未來並不取決於螺旋槳發動機，我們必須著眼於對噴氣式引擎的研發，進一步提升飛機的性能。"
 JAP_new_naval_estimates: "新編海軍預算"
 JAP_new_naval_estimates_desc: "我們必須為本國海軍的規模增長調撥新的預算，以確保各造船廠滿足增長的建造需求。"
 JAP_carrier_warfare_experiments: "航母作戰實踐"
 JAP_carrier_warfare_experiments_desc: "戰列艦已是舊時代遺留的產物，如今我們必須放眼屬於航空作戰的未來，航母機動部隊將確保我們能夠在整個太平洋投射空軍力量。"
 JAP_expand_the_snlf: "擴編海軍特別陸戰隊"
 JAP_expand_the_snlf_desc: "太平洋上爆發的戰爭將涵蓋大量的海軍登陸作戰，海軍特別陸戰隊必須要實現擴編才能完成其被賦予的任務。 "
 JAP_first_air_fleet: "第一航空戰隊"
 JAP_first_air_fleet_desc: "為在最大程度上發揮攻擊戰力，我們將實現世界上最大規模的航母集中作戰運用。通過踐行發展這種模式下的協同進攻理論，敵軍將斷無機會對抗我們壓倒性的海軍航空兵力量。"
 JAP_modern_escorts: "現代護航"
 JAP_modern_escorts_desc: "我國艦隊需要最現代化的護衛艦相佐，才能免受敵軍潛艇或是魚雷艦的侵擾。"
 JAP_supremacy_of_the_battlefleet: "大艦巨炮主義"
 JAP_supremacy_of_the_battlefleet_desc: "憑藉我國卓越的戰列艦設計，僅需一場決定性的海戰便能左右整個戰局。我們必須優化艦隊編成，確保海軍能夠贏下艦隊決戰。"
 JAP_the_ultimate_battleship: "終極戰艦"
 JAP_the_ultimate_battleship_desc: "既然我國資源有限，那麼就必須確保其能夠得到妥善利用，我們將建造有史以來最為強大的戰列艦，斷然轟沉一切膽敢正面對抗之敵。"
 JAP_cruiser_modernization: "巡洋艦現代化"
 JAP_cruiser_modernization_desc: "巡洋艦將會是我國太平洋特遣艦隊的主要戰力，必須儘可能對其加以建造。"
 JAP_long_lance_torpedoes: "九三式魚雷"
 JAP_long_lance_torpedoes_desc: "受制於全球資源分佈不均的嚴峻現實，我國海軍在艦艇數量上遠不及敵國，因此，我們需要開發出世界上最先進的魚雷：這是一種由壓縮氧氣而不是壓縮空氣推動的超遠程強大武器，它可以使我們較小的水面艦艇具備遠超其噸位的打擊力。"
 JAP_torpedo_cruisers: "重雷裝巡洋艦"
 JAP_torpedo_cruisers_desc: "我們將為一整級的軍艦列裝最新式的魚雷兵器，賦予其重創敵國艦隊的戰力。"
 JAP_yamato_tt: "將兩艘§Y大和級§!超重型戰列艦添加至生產線，其分別具有75%和50%的完工度。"
 cost_reduced_last_stand: "允許以極低的指揮點數花費使用§Y背水一戰§!指揮技能。\n"
 MAN_pacify_the_countryside: "清鄉運動"
 MAN_pacify_the_countryside_desc: "自我等掌權以來，土匪和叛黨就一直在我國的偏遠地區活躍，試圖挑戰我國秩序。如果我們希望能擺出正經政府的臉面，就得剷除這些亂臣賊子，讓百姓看看我們的統治能力。"
 MAN_pacify_the_countryside_effect_tooltip: "在若干特定的地區駐紮部隊以平定該地鄉間的匪患。\n"
 MAN_army_modernization: "軍隊現代化"
 MAN_army_modernization_desc: "我軍坐擁充裕資源，然卻兵少將寡，裝備落後，如此現狀委實不可接受。必須想辦法發揮出我們真正的實力。"
 MAN_mukden_military_academy: "奉天講武堂"
 MAN_mukden_military_academy_desc: "若不想領著一幫烏合之眾來向著目標蹣跚而進的話，我軍亟需由優秀且忠誠的軍官來領導。"
 MAN_invite_japanese_settlers: "邀請日本開拓團"
 MAN_invite_japanese_settlers_desc: "我國有餘於地而不足於民，還有大片土地尚待開發。我們應妥善安置移民，促成當地形成新居落，使其經濟進一步發展。"
 MAN_collective_farms: "集體農場"
 MAN_collective_farms_desc: "家庭所有的個體農場生產落後且效率低下。只有將鄉村的人力集中起來實行整體勞作，才能實現更高效的發展。"
 MAN_law_university: "新京法政大學"
 MAN_law_university_desc: "我國尚且處於新生階段，仍然有機會根據對現代政府最透徹的理解來建立全新的法政體系。為此，我們應該成立一所專門的學府，以匯聚全亞洲最優秀的才俊。"
 MAN_research_and_education_department: "文教部"
 MAN_research_and_education_department_desc: "隨著國家的發展，我們的教育和研究機構亦需要不斷發展以適應和匹配現狀。為此，必須做出更多努力，確保科研工作聚焦於最需要的領域。"
 MAN_trade_delegation: "貿易代表團"
 MAN_trade_delegation_desc: "世界其他各國在工業技術領域遙遙領先於我國，我們應該對此派出代表團前去交流學習技術，進而用以改善本國的生產。"
 MAN_expand_the_textile_industry: "發展紡織工業"
 MAN_expand_the_textile_industry_desc: "紡織工業長久以來都是我國工業生產的支柱，而且它也將是吸引外資並擴張工業生產最簡單的途徑。"
 MAN_obedience: "服從"
 MAN_obedience_desc: "也許有人蔑稱我國不過是日本人的走狗，但他們實際上已經從根本的層面誤解了我等兩國間密切而又平等的關係。要想讓我們背叛自己的恩主，幾乎等同於要讓孩童去背叛他的父母。"
 MAN_hoankyoku: "保安局"
 MAN_hoankyoku_desc: "儘管我國政府是引領中國走向光明未來的不二人選，但顯然，仍然有許多人處心積慮想要將我們毀滅。為此，我們必須組建專門的機構去追捕清剿這些顛覆分子，保衛我們的國家。"
 MAN_first_five_year_plan: "第一個五年計劃"
 MAN_first_five_year_plan_desc: "儘管其帶有強烈的共產主義色彩，但不可否認五年計劃對於規劃國家經濟發展而言是有用的工具。我們應該推出相關計劃，指導本國工業的發展。"
 MAN_invite_japanese_investors: "邀請日本投資者"
 MAN_invite_japanese_investors_desc: "我國的發展繁榮離不開外界的幫助，而正好有相當數量的日本公司願意對我國展開投資。"
 MAN_expand_the_railways: "拓展鐵路網"
 MAN_expand_the_railways_desc: "現代化的鐵路系統是連接我國各地，實現協同發展的關鍵。"
 MAN_develop_aluminum_sources: "鋁資源開發"
 MAN_develop_aluminum_sources_desc: "我國遼寧有豐富的鋁礦資源亟待開發，而它們將為本國的航空工業發展提供至關重要的助力。"
 MAN_expand_showa_steel_works: "擴建昭和制鋼所"
 MAN_expand_showa_steel_works_desc: "昭和制鋼所是我國重工業的支柱，對其展開投資將使我們在未來獲得更大的收益。"
 MAN_social_research_unit: "社會研究機構"
 MAN_social_research_unit_desc: "我們應該成立專門的機構來研究國民的生活習性和方式，以便更好地引導他們成為對國家有貢獻的個體。"
 MAN_second_five_year_plan: "第二個五年計劃"
 MAN_second_five_year_plan_desc: "隨著第一個五年計劃取得成功，我們應當即刻推行新的五年計劃以鞏固此前的發展成果。"
 MAN_national_defense_state: "國防狀態"
 MAN_national_defense_state_desc: "直到迎來終戰勝利以及重新恢復對全中國的統治前，我們必須竭盡全力，不惜任何犧牲代價並且利用一切可用資源以支撐戰事的進展。"
 MAN_mukden_arsenal: "奉天造兵所"
 MAN_mukden_arsenal_desc: "這座舊帝國時代的兵工廠將成為全新軍工複合體的核心，為我軍供應最現代化的武器裝備。"
 MAN_mamc: "滿洲飛行機制造株式會社"
 MAN_mamc_desc: "組建滿洲飛行機制造株式會社將使我國有能力建設現代化的空軍力量，令本國空軍足以傲視群雄。"
 MAN_alliance_with_the_kwantung_army: "聯合關東軍"
 MAN_alliance_with_the_kwantung_army_desc: "駐紮於我國的日軍經常與我方意見相左，我們應該與其加強聯絡，確保儘可能減少雙方合作中產生的衝突。"
 MAN_chinese_leadership: "中華至尊"
 MAN_chinese_leadership_desc: "中國人民還需中國領袖來領導，我們應該昭示天下，本方的野望唯有徹底恢復皇權對全中國的統治。"
 MAN_vassalize_mengukuo: "冊封蒙疆"
 MAN_vassalize_mengukuo_desc: "蒙疆親王並沒有資格和滿洲帝國皇帝平起平坐，我們應該趕緊結束這愚蠢的現狀，將其轉封至合適的位置。"
 MAN_national_cooperation_government: "民族互助政府"
 MAN_national_cooperation_government_desc: "近來我們聽到了令人不安的謠言，據說日本人正考慮由中國的其他勢力——那些布衣出身的暴發戶組建其在華的協作政府。這著實不可接受，我們必須確保任何由我方聯軍攻佔的中國領土都收歸本國的管轄。"
 MAN_the_two_emperors: "兄弟皇誼"
 MAN_the_two_emperors_desc: "是時候向日本人提出我們是其完全平等合作伙伴這樣僭越的想法了，兩國天子之間的情誼，或可說就像是異父異母的親兄弟！"
 MAN_assertiveness: "自立"
 MAN_assertiveness_desc: "日本人仍然還在以傲慢的姿態對我方頤指氣使，也許我們應該提醒他們，我國同樣也是值得尊敬的帝國。"
 MAN_request_control_of_the_railways: "索取鐵路控制權"
 MAN_request_control_of_the_railways_desc: "在我們這般遼闊的國家內，控制鐵路便意味著控制整個國家。\n\n而如今，日本人正掌控著我國的鐵路。\n\n如此現狀必須得到改變。"
 MAN_staff_the_court_with_manchus: "滿清皇廷"
 MAN_staff_the_court_with_manchus_desc: "大清王朝此前統治中國長達數世紀之久，如果我們希望重拾往昔的榮耀，就必須確保自身儘可能地謹遵祖宗古制。"
 MAN_expand_the_imperial_guards: "擴編帝國禁軍"
 MAN_expand_the_imperial_guards_tt: "獲得4個由§Y7個步兵營§!和§Y2個炮兵營§!組成的師。\n"
 MAN_expand_the_imperial_guards_desc: "帝國禁軍將成為我國新軍之中的翹楚，亦將會是全軍將士心嚮往之的榜樣。"
 MAN_local_arms_procurement: "本地武器訂購"
 MAN_local_arms_procurement_desc: "我們不能永遠依賴由日本人供應槍炮，若我國想要爭得獨立自主，就需要自己掌控獲取武器的可靠渠道。"
 MAN_bolster_nationalism: "宣揚民族主義"
 MAN_bolster_nationalism_desc: "長久以來，人們都認為滿洲國不過是由日本人生造出來的國家。但哪個國家在成立前，又何嘗不是單純的理念構想呢？我們需要在人民當中根植滿洲國的身份認同感，並將這一理念變為現實。"
 MAN_five_equal_peoples: "五族協和"
 MAN_five_equal_peoples_desc: "由單一民族佔據絕對優勢地位進而統治整個國家的時代已然終焉，從今往後，滿洲國將會是如此這般的新國家——俄、和、蒙、朝、滿五族人民都能夠在此和諧共處。"
 MAN_white_russian_advisers: "白軍輔官"
 MAN_white_russian_advisers_desc: "俄國內戰的塵埃落定後，有相當部分的俄羅斯人寧願流亡海外，也不願意屈服於布爾什維克給他們這些戰敗者施加的命運。我們或可以利用他們，來重建和訓練軍隊。"
 MAN_empower_the_legislative_council: "賦權予立法院"
 MAN_empower_the_legislative_council_desc: "立法院目前不過是個象徵性的機構，僅能唯唯諾諾地應允我們日本宗主的任何要求。但如果我們希望成為真正的主權國家，就必須要在立法問題上享有充分的自主權。"
 MAN_five_people_armies: "五族旗軍"
 MAN_five_people_armies_desc: "如果國民大眾都是平等的，那麼他們也必須負有相同的義務，為抵禦外國侵略者做好準備。"
 MAN_five_people_armies_tt: "獲得7個由§Y3個步兵營§!組成的師。\n"
 MAN_purge_the_general_affairs_council: "清洗總務廳"
 MAN_purge_the_general_affairs_council_desc: "總務廳是日本人設置來監視和操控我國政府的機構，它那為虎作倀的現狀必須得到改變。即便是略有嫌疑，我們也必須將所有不忠於政府的官員加以清除。"
 MAN_reform_the_civil_service: "重塑行政體系"
 MAN_reform_the_civil_service_desc: "總務廳的問題不過是冰山一角，日本人還是仍然牢牢掌控著我國絕大部分的行政機構。為此，我們需要另建一套自己的行政管理體制。"
 MAN_independence_war: "獨立戰爭"
 MAN_independence_war_desc: "是時候砸碎腳鐐，重拾我們與生俱來的自由了，滿洲國必將成為中華大地上第一個擺脫外國壓迫的政權！"
 MAN_imperial_divinity: "君權神聖"
 MAN_imperial_divinity_desc: "自古以來，歷代中國皇帝都被尊奉為天子，而現在，我們必須使當今聖上重拾這古老的傳統。"
 MAN_imperial_university: "帝國大學"
 MAN_imperial_university_desc: "帝國需要仰仗各路人才來推動其發展，我們應該成立一所高等學府，將最優秀的才俊聚集起來，相互勉勵學習。"
 MAN_move_capitals: "遷返舊都"
 MAN_move_capitals_desc: "北京是我朝長久以來的故都，如今在其已然光復的情況下，是時候恭迎聖上御駕凱旋了。"
 MAN_claim_the_mandate_of_heaven: "天命攸歸"
 MAN_claim_the_mandate_of_heaven_desc: "我們在戰爭中的勝利已然彰顯了天命的歸屬，陛下當為龍椅寶座無上之御主，任何質疑聖上中華共主法統的宵小之輩，必將在鐵律般的事實面前灰飛煙滅。"
 MAN_reclaim_the_empire: "天朝再臨"
 MAN_reclaim_the_empire_desc: "我們如今已然贏得獨立，接下來是時候對盤踞在中華各地的叛黨和賊徒發起戰爭了，此戰克復乃還，不成功便成仁。"
 MAN_assert_our_authority: "維護權威"
 MAN_assert_our_authority_desc: "整個國家如今依舊四分五裂，但可沒有任何自稱軍閥或是主席的謀逆賊徒夠資格君臨天下，他們都將被碾於塵埃，而天子聖威必將再度光耀中華四方。"
 MAN_offer_vassalization: "招安臣屬"
 MAN_offer_vassalization_desc: "連綿不絕的戰火已使整個國家四分五裂，但若是給那些拒不臣服的割據者在朝廷中安排合適的職位，我們或許可以體面地結束這場戰爭。"
