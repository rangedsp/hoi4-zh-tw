 #Germany
 GER_integrate_czech_manufacturers: "整合捷克製造商"
 GER_integrate_czech_manufacturers_desc: "波希米亞的工業蘊含著豐富的製造技術與資源。將捷克製造商整合進我們的生產體系，將極大提升軍備工業。此舉合情合理。"
 GER_integrate_czech_manufacturers_no_aat_tt: "§G啟用§!§Y設計公司§!：\n§Y$CZE_skoda_works_german_organization$§!，§Y$CZE_bohmische_mahrische_maschinenfabrik_ag_german_organization$§!，§Y$CZE_zlin_aircraft_organization$§!，和§Y$CZE_ceska_zbrojovka_uhersky_brod_organization$§!"
 CZE_unlocks_sokolov_raid_pfot_tt: "解鎖對§Y法爾克諾夫§!的§Y空降兵突襲§!行動。"


