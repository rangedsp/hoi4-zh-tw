l_simp_chinese:
 #Shortcuts
 CZE_military_path_shortcut: "武裝部隊"
 CZE_economic_path_shortcut: "經濟"
 CZE_diplomacy_path_shortcut: "外交"
 CZE_fort_path_shortcut: "防禦工事"
 CZE_skoda_priority_shortcut_name: "斯柯達優先事項"
 CZE_political_path_shortcut: "政治"
 # Č does show when scrolling through focuses, but not in the detailed focus view title (does work in the description though)
 CZE_coalition_building: "建立聯合政府"
 CZE_coalition_building_desc: "選舉後形成的聯合政府若想有效運作，必須加強其成員間的團結。。隨著揚·馬利彼得近期辭去總理職務，聯合政府為鞏固自身支持基礎將面臨更大壓力。"
 CZE_merge_the_paramilitaries: "整合準軍事組織"
 CZE_merge_the_paramilitaries_desc: "我們的準軍事組織分散於多個團體。若希望在軍事上發揮作用，就必須促使它們合併。"
 CZE_integrated_paramilitaries: "整合準軍事組織"
 CZE_integrated_paramilitaries_desc: "軍方可能對此不滿，但將這些組織整合入正規軍，將在關鍵時刻為我們提供更多後備力量。"
 CZE_wielding_the_hammer: "揮舞重錘"
 CZE_wielding_the_hammer_desc: "我們應當善用國民議會中的絕對多數優勢，顯著加快當前的立法進程。眼下，整頓立法秩序已成為一項迫在眉睫的任務。"
 CZE_emergency_measures: "緊急措施"
 CZE_emergency_measures_desc: "通過實施緊急措施來應對我國面臨的諸多危機，同時藉助其中部分舉措，密切監控那些可能對政府意識形態不忠的人員。如此一來，我們將能更從容地應對國家所面臨的各種挑戰。"
 CZE_king_of_the_castle: "城堡裡的國王"
 CZE_king_of_the_castle_desc: "我們都知道當前究竟是誰在掌控政府。在動盪時期，我們應撕下偽裝，讓$CZE_edvard_benesh$直接領導政局。國家安全正取決於此。"
 CZE_closer_ties_with_the_moderate_germany_parties: "團結蘇臺德黨派當中的溫和派"
 CZE_closer_ties_with_the_moderate_germany_parties_desc: "一些蘇臺德地區的政黨願意與我們的聯合政府合作，並在政府中尋求更深合作。讓我們加深這些紐帶。"
 CZE_complete_reconciliation: "全面和解"
 CZE_complete_reconciliation_desc: "我們已為建立信任架設橋梁。現在，是時候與同胞實現全面和解了。"
 CZE_complete_reconciliation_cooldown_flag: "已完成國策§Y$CZE_closer_ties_with_the_moderate_germany_parties$§!"
 CZE_complete_reconciliation_cooldown_flag_tt: "當前天數：[?CZE_complete_reconciliation_cooldown_flag:days|Y0]"
 CZE_bastion_of_liberty: "自由堡壘"
 CZE_bastion_of_liberty_desc: "過去十年，我們是萊茵河以東少有的真正多元國家之一。讓人民永遠記住這一點。"
 CZE_standing_against_the_storm: "直面風暴"
 CZE_standing_against_the_storm_desc: "儘管我們存在不足，準備也許不夠充分，我們將迎難而上，直面任何風暴。"
 CZE_truth_prevails: "真理必勝"
 CZE_truth_prevails_desc: "即使面對巨大挑戰和幾乎不可能的任務，我們國家的座右銘“真理必勝”終將兌現。追求真理，傾聽真理，真理終將勝出。"
 CZE_negotiations_with_the_autonomous_bloc: "與自治集團的談判"
 CZE_negotiations_with_the_autonomous_bloc_desc: "貝奈斯在國民議會中走狗眾多，如果我們想建立一個不會將權力拱手讓給前者的聯合政府，我們就必須與自治集團合作。但要贏得他們的全面支持，將付出巨大代價。"
 CZE_slovakia_autonomy_agreement: "斯洛伐克自治協議"
 CZE_slovakia_autonomy_agreement_desc: "自治派集團與我們聯合政府合作的代價，是與政府簽署自治協議。這代價雖重，但若不守約，後果更嚴重。"
 CZE_slovakia_autonomy_agreement_tt: "§Y[RUT.getname]§!將希望獲得與我們給予§Y[SLO.getname]§!相同的聯邦協議！"
 CZE_slovakia_autonomy_agreement_2_tt: "選擇該國策後，$CZE_the_autonomous_bloc_demands$將被延遲§Y35天§!。"
 CZE_topple_the_king: "削弱那個“國王”"
 CZE_topple_the_king_desc: "作為總統，$CZE_edvard_benesh$對政府的影響力過於龐大，在國會中有大量忠於他的人。如今條件成熟，是時候在上議院中削弱他的勢力了。"
 CZE_comprise_with_the_carpathians: "與喀爾巴阡妥協"
 CZE_comprise_with_the_carpathians_desc: "魯塞尼亞區域正推動類似於我們給予[SLO.getnamedef]的聯邦化協議。這將嚴重削弱我們在該區域甚至在[9.getname]的權力。與其完全讓步，不如通過協商達成妥協。"
 CZE_the_rut_demands_add_35_CZE_comprise_with_the_carpathians_tt: "選擇該國策後，$CZE_the_rut_demands$將被延遲§Y35天§!。"
 CZE_cut_carpathia_loose: "放棄對喀爾巴阡的主張"
 CZE_cut_carpathia_loose_desc: "斯洛伐克已成聯邦制國家，魯塞尼亞希望得到相似安排。雖然難以接受，但若試圖壓制他們可能事與願違。也許我們應順其所願。"
 CZE_compromise_with_the_veteran_agrarian: "與守舊的農民聯盟妥協"
 CZE_compromise_with_the_veteran_agrarian_desc: "守舊的農民聯盟是我們打入日益增長的城市選民群體的一大障礙。我們需要與他們妥協，以達成我們的目標。"
 CZE_reorient_the_broad_coalition: "調整聯合政府"
 CZE_reorient_the_broad_coalition_desc: "聯合政府在我國長期執政。但是聯合政府中囊括的政黨過多，使得它難以運轉。現在是調整政治方向和各部門政策的時候了。"
 CZE_leverage_sokol: "索科爾運動"
 CZE_leverage_sokol_desc: "數十年來，索科爾運動在國內力行健康與體能訓練。當危機來臨，我們可借其提供的準軍事訓練和人員補充。"
 CZE_urbanist_policies: "走城市路線"
 CZE_deepend_ties_with_the_trademans: "深化與商人黨的關係"
 CZE_deepend_ties_with_the_trademans_desc: "商人黨在城市中產選民中頗受歡迎。若授權並與他們合作，我們在城市選區將會有所突破，同時也不至於疏遠鄉村基礎。"
 CZE_apart_but_togather: "分治但團結"
 CZE_apart_but_togather_desc: "我們的地區自治程度前所未有，但集體力量更為強大，我們已做好應對一切挑戰的準備。"
 CZE_contact_henlein: "接觸亨萊因"
 CZE_contact_henlein_desc: "$CZE_konrad_henlein$多年來一直是我們政府的棘手問題。但鑑於國際形勢變化，是時候與之啟動對話了。"
 CZE_contact_henlein_cooldown_flag: "已完成國策：§Y$CZE_no_compromise_with_the_sdp$§!"
 CZE_contact_henlein_cooldown_flag_tt: "當前天數：[?CZE_contact_henlein_cooldown_flag:days|Y0]"
 CZE_contact_henlein_focus_warning_tt: "完成§Y$CZE_no_compromise_with_the_sdp$§!之後，我們需等待§Y350§!天才可選擇該§Y國策§!。"
 CZE_contact_henlein_focus_order_warning_tt: "如果在完成該§Y國策§!後我們完成了§Y$CZE_no_compromise_with_the_sdp$§!，§Y$CZE_konrad_henlein$§!將退休。"
 CZE_no_compromise_with_the_sdp: "繼續排斥蘇臺德德意志人黨"
 CZE_no_compromise_with_the_sdp_desc: "蘇臺德德意志人黨對我們的聯合政府無任何益處，他們只會帶來政治衝突和抹黑。為了營造良好的施政環境，應繼續將其排除在聯合政府之外。"
 CZE_no_compromise_with_the_sdp_cooldown_flag: "已完成國策§Y$CZE_contact_henlein$§!"
 CZE_no_compromise_with_the_sdp_cooldown_flag_tt: "當前天數：[?CZE_no_compromise_with_the_sdp_cooldown_flag:days|Y0]"
 CZE_no_compromise_with_the_sdp_focus_warning_tt: "如果我們完成了§Y$CZE_contact_henlein$§!，需要等待§Y350§!天后才能選擇該§Y國策§!。"
 # CZE_economic_integration: "Economic Integration"
 # CZE_economic_integration_desc: "Why stop at a customs union? Economic integration will further grow our economies and ensure our future is an affluent one for all members."
 CZE_form_a_federation: "組建聯邦"
 CZE_form_a_federation_desc: "中歐聯邦夢想不再遙遠。我們可以建立它，成為民主巨人，具備抵禦列強，並獨立發展的力量！"
 CZE_bend_the_bars: "$ITA_bend_the_bars$"
 CZE_bend_the_bars_desc: "$GER_european_confederation_desc$"
 CZE_reassure_the_army: "安撫軍隊"
 CZE_reassure_the_army_desc: "軍方對我們近期的決策和政策日益焦慮。是時候向他們保證，無論政府如何，他們都不會被拋棄。"
 CZE_outreach_to_the_western_powers: "進一步爭取西方列強"
 CZE_outreach_to_the_western_powers_desc: "西方民主國家口頭支持我們，但我們需要實質性進展，確保關鍵時刻他們不只是空談。"
 CZE_demand_guarantees: "要求更強的保障"
 CZE_demand_guarantees_desc: "即便我們已有條約與聯盟，我們也需確保在危機時刻同伴不會背棄我們。我們需要比承諾更可靠的保障。"
 CZE_guardian_of_central_europe: "中歐民主守護者"
 CZE_guardian_of_central_europe_desc: "我們如今可作為中歐民主的監督者，為無力自保的國家提供守護，堅定民主精神。"
 CZE_central_european_faction: "中歐霸主"
 CZE_central_european_faction_desc: "雖然我們主張自強而非依賴外力，但重要的是不要過度擴張。也許現在是放眼外部影響力的時候了。"
 CZE_strike_at_the_heart_of_bolshevism: "[THIS.GetAntiSovietFocusName]"
 CZE_strike_at_the_heart_of_bolshevism_1: "打擊布爾什維主義的心臟"
 CZE_strike_at_the_heart_of_bolshevism_2: "控制東翼"
 CZE_strike_at_the_heart_of_bolshevism_desc: "[SOV.GetNameDef]的擴張對歐洲和我國構成生存威脅。我們必須成為抵禦他們的屏障。"
 CZE_destroy_the_fascist_threats: "摧毀法西斯威脅"
 CZE_destroy_the_fascist_threats_desc: "[CZE_get_fascist_threats_desc]"
 CZE_destroy_the_fascist_threats_desc_enemy_ger: "我們都清楚誰才是歐洲和平最大的威脅。[GER.getnamedefCAP]必須儘早遏制，不能再拖延下去。倘若無人願意出手，那就由我們來擔當此任。"
 CZE_destroy_the_fascist_threats_desc_backup: "為保障我國安全，至關重要的是，周邊國家不得奉行擴張主義論調——這類論調遲早會將矛頭對準我們。"
 CZE_peace_on_our_time: "我們時代的和平"
 CZE_peace_on_our_time_desc: "長久以來，我們在歐洲外交舞臺上被邊緣化。如今再也不會如此！我們可以獨立自主，設定自己的議程，不論是和平還是戰爭。"
 CZE_reach_out_for_military_assistance: "請求軍事援助"
 CZE_free_tuka: "釋放$CZE_vojtech_tuka$"
 CZE_free_tuka_desc: "$CZE_vojtech_tuka$的刑期已滿，我們不必再找藉口延長羈押。相反，我們可以按期釋放他，並將他納入政府中任用。讓他在我們控制下工作，總好過讓他同我們作對。"
 CZE_grow_the_anglo_czechoslovak_prague_credit_bank: "盎格魯-捷克斯洛伐克銀行"
 CZE_grow_the_anglo_czechoslovak_prague_credit_bank_desc: "盎格魯‑捷克信貸銀行一直是我們工業的推動力。若無其資金支持，我們將無法維持如今的出口業務規模。在紐約設立分行、加深與[ENG.GetNameDef]的聯繫，將使銀行獲得進一步發展，也將讓[ENG.getname]在我們的國家存續上擁有一定利益關聯。"
 CZE_feeding_the_alligator: "餵飽鱷魚"
 CZE_feeding_the_alligator_desc: "[GER.getname]對蘇臺德地區的覬覦已威脅到我們國家的生存。如果我們給予他們想要的，或許他們會放我們一馬，對吧？"
 CZE_complete_capitulation: "完全投降"
 CZE_complete_capitulation_desc: "我們還有什麼選擇？我們無法抵擋即將來臨的風暴。或許趁我們還有一點談判餘地，與[GER.getnamedef]達成協議，他們便會在我們的獨立之下允許我們作為其附庸存在。"
 CZE_stabilize_the_protectorate: "穩定保護國"
 CZE_stabilize_the_protectorate_desc: "保護國局勢遠非穩定。我們必須努力說服民眾接受我們的政權合法性，並證明我們有能力照顧他們的需求。"
 CZE_stabilize_the_protectorate_unretire_henlein_tt: "從§Y[ROOT.getname]§!聘用退休的§Y$CZE_konrad_henlein$§!。"
 CZE_full_faith_in_hacha: "完全信任哈查"
 CZE_full_faith_in_hacha_desc: "$CZE_emil_hacha$比$CZE_emanuel_moravec$更受人民尊重。他的執政可能存在疑點，但比起換掉一個受歡迎的象徵性人物，維持現狀更明智。"
 CZE_moravecs_bohemia: "莫拉維茨的波希米亞"
 CZE_moravecs_bohemia_desc: "有傳言稱$CZE_emil_hacha$正在試圖破壞我們的新政府。如果我們希望在現有條件下取得發展，就需要一位與宗主國意識形態一致的領導人。"
 CZE_form_the_government_army: "成立政府軍"
 CZE_form_the_government_army_desc: "若我們國家要成功，就必須組建一支新軍隊，避免舊軍隊的問題。其領導層必須與政府意識形態一致。"
 CZE_forced_administration_of_companies: "強制接管企業"
 CZE_forced_administration_of_companies_desc: "儘管已有嚴格監管，仍有部分公司在我們的控制之外運作。是時候將它們強制納入行政體系了。"
 CZE_revisit_custom_union_talks: "重啟關稅同盟談判"
 CZE_revisit_custom_union_talks_desc: "與部分鄰國的關稅談判進展不佳，是時候重啟談判，推動區域間建立關稅同盟。"
 CZE_revisit_custom_union_talks_tt: "我們仍可通過其他§Y手段§!說服他們加入我們。"
 CZE_revisit_custom_union_talks_2_tt: "他們更可能接受加入我們聯邦的要求"
 CZE_reintegrate_cross_border_rail_connections: "改善跨境鐵路"
 CZE_reintegrate_cross_border_rail_connections_desc: "改善與鄰國之間的鐵路連接，有助於提升關係，特別是在我們希望加強經濟合作時更顯重要。"
 CZE_reintegrate_cross_border_rail_connections_flag: "跨境鐵路連接已改善"
 CZE_vonapo_20: "VONAPO 20"
 CZE_vonapo_20_desc: "我們並非唯一發現[GER.GetNameDef]威脅上升的國家。因此我們擬定計劃，與[SOV.GetNameDef]合作收集情報以便更好地挫敗[GER.GetAdjective]的野心。"
 CZE_increase_funding_from_moscow: "請求[SOV.capital.GetCapitalVictoryPointName]給予資金支持"
 CZE_increase_funding_from_moscow_desc: "[ROOT.GetCommunistParty]的資金極度緊張，以至於只能靠代表薪資支付辦公樓費用。要想發展，就必須請求[SOV.GetNameDef]增加資助，以擴大發行報紙、招募新成員。"
 CZE_zdenek_fierlinger_tt: "任命顧問§Y$CZE_zdenek_fierlinger$§!"
 CZE_expand_the_communist_press: "擴大共產黨新聞宣傳"
 CZE_expand_the_communist_press_desc: "我們的報紙《紅色法律》可以吸引那些平時不讀報的人，我們非常需要擴充財源。"
 CZE_anti_rearmament_propaganda: "反擴軍宣傳"
 CZE_anti_rearmament_propaganda_desc: "我們主要對手——法西斯[GER.GetNonIdeologyName]政府垮臺後，我們可以利用此事證明我們對反擴軍立場的正確性。"
 CZE_anti_democratic_propaganda: "反民主宣傳"
 CZE_anti_democratic_propaganda_desc: "要為我們的黨爭取更多支持，就必須揭示共和國前幾屆政府的失敗，並向民眾表明我們本可以如何妥善地應對局勢。"
 CZE_form_workers_brigades: "組建工人民兵"
 CZE_form_workers_brigades_desc: "我們所解放的工人必須準備好參與鬥爭。他們雖非正規士兵，但仍可在工程等專業領域貢獻力量。"
 CZE_kohler_faction: "科勒的派系"
 CZE_kohler_faction_desc: "布魯諾·科勒的派系認為，必須通過暴力推翻資產階級，才能建立成功的捷克斯洛伐克共產主義政權。"
 CZE_gottwald_faction: "戈特瓦爾德的派系"
 CZE_gottwald_faction_desc: "|斯大林主義者克萊門特·戈特瓦爾德忠於莫斯科，他們認為捷克斯洛伐克共產主義政權應仿照蘇聯模式。"
 CZE_zapotocky_faction: "扎波托茨基的派系"
 CZE_zapotocky_faction_desc: "共產黨創始人什梅拉爾與扎波托茨基主張更溫和的政策。相比戈特瓦爾德，他們的路線更能贏得[CZE.GetAdjective]全體人民的支持。"
 CZE_ally_with_moderate_socialists: "與溫和社會主義者合作"
 CZE_ally_with_moderate_socialists_desc: "並非所有國家都能選舉共產主義政權，也不是所有國家都支持[SOV.GetLeader]。因此，我們不應迴避與溫和派合作。"
 CZE_democracies_willing_to_join_faction_tt: "§Y民主國家將更願意加入我們的共產主義陣營。§!"
 CZE_limited_cooperation: "與[SOV.GetLeader]有限合作"
 CZE_limited_cooperation_desc: "儘管意識形態不同，[SOV.GetNameDef]仍可能出於務實考慮與我們達成合作，哪怕一邊與我們做交易，一邊在報紙上抨擊我們。"
 CZE_denounce_stalinism: "譴責斯大林主義"
 CZE_denounce_stalinism_desc: "斯大林的暴政玷汙了共產主義名聲。我們應採取軍事手段解放被這類政權壓迫的人民。"
 CZE_country_leader_has_ideology_stalinism_tt: "國家領導人意識形態為§Y$stalinism$§!"
 CZE_cooperate_with_tito: "與鐵托合作"
 CZE_cooperate_with_tito_desc: "[YUG.GetNameDefCap]的共產主義實踐路線與我們類似，也致力於紅旗下的多民族團結。在共同挑戰下，我們應在軍事和政治事務上展開合作。"
 CZE_reduce_divided_nation_cost_tt: "降低大多數§Y分裂的國度§!的決議的花費和持續時間"
 CZE_balkan_union: "擴張聯盟"
 CZE_balkan_union_desc: "儘管本地區更多國家擁抱共產主義，但若無深度合作，我們難以抵抗強權。結成聯盟是實現這一目標最有效方式。"
 CZE_cooperation_with_the_ussr: "與[SOV.GetLeader]合作"
 CZE_cooperation_with_the_ussr_desc: "即便黨內親[SOV.GetNameDef]分子已親眼看到蘇聯集體化的失敗，他們仍認同蘇聯的經驗值得借鑑。與其合作，可分析其得失，為[ROOT.GetNameDef]制訂合適政策。"
 CZE_exchange_military_expertise: "軍事經驗交流"
 CZE_exchange_military_expertise_desc: "[SOV.GetNameDefCap]與大多數列強一樣，也在戰術方面積累了豐富經驗。我們應請求其分享經驗，並同時向他們分享我國的經驗。"
 CZE_pressure_romania: "向羅馬尼亞施壓"
 CZE_pressure_romania_desc: "[ROM.GetNameDefCap]若與敵人結盟，將威脅我們的與[SOV.GetNameDef]間的聯繫，並可能為敵人提供石油。在[SOV.GetAdjective]支持下，我們或能在不開戰的前提下使其屈服。"
 CZE_facility_in_state_tt: "若該$STATE|Y$尚無§Y實驗設施§!，則在此$STATE|Y$建設§G1座§!$FACILITY_TYPE|Y$"
 CZE_spread_the_revolution: "輸出革命"
 CZE_spread_the_revolution_desc: "[ROOT.GetNameDef]革命成功後，應當鼓勵國外無產階級爭取自由，我們可在其中提供支持。"
 CZE_agrarian_reform: "重建土地局"
 CZE_agrarian_reform_desc: "被解散的土地局原負責農業用地的再分配。現在是時候恢復其職能，推動更大規模的土地改革了。"
 CZE_realign_the_church: "國家無神論"
 CZE_realign_the_church_desc: "宗教在[CZE.GetAdjective]人民之間長期製造分裂。我們應當限制宗教對國家事務（如教育與媒體）的影響，建立統一社會。"
 CZE_create_a_secret_police_branch: "成立秘密警察部門"
 CZE_create_a_secret_police_branch_desc: "為保障國家穩定，必須防範內外敵人。人民需要時間適應我們的新制度，尤其在制度尚在完善之時。"
 CZE_promote_urbanization: "$ARG_promote_urbanization$"
 CZE_promote_urbanization_desc: "如今我們已經建立了高效的公有農場，我們可以開始實施計劃，吸引一些農村人口到城市，提高那裡的生產力。"
 CZE_confiscate_church_lands: "沒收教會土地"
 CZE_confiscate_church_lands_desc: "教會擁有的土地與財富遠超其需求。我們應效仿農業改革，將部分土地再分配。"
 CZE_change_the_narrative: "改變敘事"
 CZE_change_the_narrative_desc: "儘管教會此前並未支持我們的革命，但若我們能將其價值觀與我方政權相結合，或許能為新政權贏得更多支持。"
 CZE_the_second_fortification_program: "啟動第二輪防禦工事計劃"
 CZE_the_second_fortification_program_desc: "第一輪防禦工事建設為後續工程打下了基礎。為了國家安全，我們必須立即啟動第二階段建設計劃，強化防線。"
 CZE_redirect_the_fortification_councils_funds: "重新分配防禦預算"
 CZE_redirect_the_fortification_councils_funds_desc: "防禦工事工程極大消耗了我們的經濟資源。這些資金用於資助其他項目會更好。反正軍隊已擁有足夠的防禦資源。"
 CZE_jachymov_uranium_mine: "亞希莫夫鈾礦"
 CZE_jachymov_uranium_mine_desc: "亞希莫夫礦場曾是鈾與其他礦產的重要來源，但在物理學取得更新進展前，鈾的用途一直很少。"
 CZE_skoda_internal_competition: "鼓勵內部競爭"
 CZE_skoda_internal_competition_desc: "在像斯柯達這樣龐大的公司中，很難讓所有員工始終保持最佳狀態。鼓勵內部競爭將極大地提升工廠員工的工作表現。"
 CZE_skoda_max_optimization_tt: "§Y斯科達優先計劃§!的最大優化等級將提升至7。"
 CZE_skoda_increase_cooperation: "增強斯柯達內部合作"
 CZE_skoda_increase_cooperation_desc: "通過加強跨工廠合作，我們可以提高整體績效，同時也能促進技能和經驗的分享。"
 CZE_skoda_fast_optimization_tt: "當前§Y斯柯達優先計劃§!£GFX_prod_eff_cap 優化等級正逐步提升，直到最大等級：§G+100.0%§!"
 CZE_master_of_armaments: "軍備大師"
 CZE_master_of_armaments_desc: "自奧匈帝國時代起，斯柯達工廠便是我國最大的武器製造商。其專業性和經驗在國內無出其右。現在是時候賦予其“軍備大師”的稱號了。"
 CZE_only_the_best_is_good_enough: "只有最好的才配得上"
 CZE_only_the_best_is_good_enough_desc: "斯柯達工廠一直秉持勤奮與創新精神。其創始人始終堅持：“只有最好的，才配得上我們的客戶！”當下，這句話比以往任何時候都更有說服力。"
 CZE_an_industrial_legacy: "工業遺產"
 CZE_an_industrial_legacy_desc: "國家工業已被我們推向歷史新高。如今，我們自豪地繼承這份偉大遺產，昂首邁入無與倫比的工業強國行列。"
 CZE_powerhouse_of_europe: "歐洲的動力艙"
 CZE_powerhouse_of_europe_desc: "我們的工業現在是世界羨慕的對象。我們必須確保能源部門能夠正常供應。"
 CZE_supply_fighters_for_allies: "向盟友提供戰鬥機"
 CZE_supply_fighters_for_allies_desc: "[FRA.GetAdjective]和[ENG.GetAdjective]政府非常擔心[GER.GetAdjective]空軍在戰爭爆發後會迅速擊潰他們的防禦並轟炸其城市。因此，增強他們的空軍力量或許能讓他們更有信心遏制[GER.GetAdjective]的擴張，減少人員損失。"
 CZE_allies_more_likely_to_defend_us_tt: "§Y同盟國更有可能在我們反對德國在蘇臺德地區的擴張主義時支持我們。§!"
 CZE_allies_more_likely_to_defend_us_2_tt: "§Y同盟國更有顯著可能在我們反對德國在蘇臺德地區的擴張主義時支持我們。§!"
 CZE_allies_more_likely_to_defend_us_3_tt: "§Y同盟國更有些許可能在我們反對德國在蘇臺德地區的擴張主義時支持我們。§!"
 CZE_establish_the_state_defense_guard: "建立國防衛隊"
 CZE_german_nonagressionpact: "豪斯霍費爾–克羅夫塔協定"
 CZE_german_nonagressionpact_desc: "與[GER.GetNameDef]的互不侵犯條約談判已經進行了一段時間，但在[SOV.GetNameDef]出現不穩定跡象並暴露其擴張意圖後談判中止。既然[GER.GetNameDef]當前正被其他敵人牽制，我們應嘗試重啟這些談判。"
 CZE_revive_the_czechoslovak_legion_dynamic: "[CZE_revive_the_czechoslovak_legion]"
 CZE_revive_the_czechoslovak_legion_default: "重建捷克斯洛伐克軍團"
 CZE_revive_the_czechoslovak_legion_communist: "建立志願者組織"
 CZE_revive_the_czechoslovak_legion_dynamic_desc: "世界再次動盪不安，我們的英勇戰士已準備好保衛[ROOT.GetNameDef]。正如歷史所證明的，保衛家園有時需要在國外作戰，我們應再次動員願意遠行的戰士，他們正是為了保衛家園才出徵的。"
 CZE_revive_the_czechoslovak_legion_nsb_tt: "§Y$CZE_legacy_of_the_czechoslovak_legion_army_spirit$§!將由§Y軍隊精神§!轉換為§Y國家精神§!"
 CZE_state_sponsored_recruitment_for_spain: "國家資助出征西班牙的徵兵"
 CZE_state_sponsored_recruitment_for_spain_desc: "一場新衝突爆發，而[ROOT.GetNameDef]的經驗豐富的志願戰士或許能決定其走向。我們應支持與我們政策一致的派系，並從中學習現代戰爭的經驗。"
 CZE_support_spain_reward_tt: "§Y若西班牙內戰中某派系獲得我們的志願兵，在其勝利或失敗時會產生後續效果。§!"
 CZE_profit_off_the_spanish_civil_war: "從西班牙內戰中牟利"
 CZE_profit_off_the_spanish_civil_war_desc: "西班牙內戰正成為列強間的代理人戰爭。我們不應該派遣我方軍隊冒險捲入這樣的衝突。相反，不如趁機通過武器銷售發展工業，如果能向交戰雙方同時出售武器就好了。"
 CZE_skoda_sell_weapons_to_SPR_tt: "解鎖決議：§Y秘密向西班牙的內戰派系出售武器§!"
 CZE_placate_benes_faction: "向貝奈斯的派系妥協"
 CZE_placate_benes_faction_desc: "$CZE_milan_hodza$需要面對一個現實：他擔任外交部長的表現極差。$CZE_edvard_benesh$已準備好與農民聯盟的支持者聯手，只要$CZE_milan_hodza$放棄外交部長職務，就願意支持他繼續擔任總理。"
 CZE_claim_lands_of_the_bohemian_crown: "宣稱波希米亞王冠領地"
 CZE_claim_lands_of_the_bohemian_crown_desc: "由於我們國家在過去幾個世紀處於多個帝國的邊緣地帶，邊界多由戰爭決定，而非居民意願。現在是時候糾正這些歷史錯誤了。"
 CZE_demand_katowice: "索要[762.GetName]"
 CZE_demand_katowice_desc: "控制[762.GetName]不僅意味著恢復舊邊界，也能削弱[POL.GetAdjective]對[72.GetName]的主張。"
 CZE_fight_over_silesia: "為西里西亞而戰"
 CZE_fight_over_silesia_desc: "西里西亞理應屬於[ROOT.GetAdjective]，但不宜與[66.owner.GetNameDef]爆發全面戰爭。我們應發動大規模邊境衝突，以展示實力，若[66.owner.GetNameDef]不願防守，我們或許能不戰而勝。"
 CZE_dismantle_poland: "肢解[POL.GetNonIdeologyName]"
 CZE_dismantle_poland_desc: "[POL.GetNameDef]沒有保衛自己的能力，已不適合作為我方與敵人之間的緩衝國。我們應增強自身，而非依賴他國防禦。"
 CZE_proclaim_the_restoration_of_bohemia: "宣佈波希米亞王國復辟"
 CZE_proclaim_the_restoration_of_bohemia_desc: "故土已經收復，我們現在可以重建波希米亞的榮耀，著手整合新領土。"
 CZE_integrate_lost_territories: "整合一度失去的領土"
 CZE_integrate_lost_territories_desc: "歷史上的波希米亞王國疆域從波羅的海延伸至亞得里亞海，是時候藉助這段歷史，整合我們的新領土了。"
 CZE_deepen_ties_with_puppet_kingdoms: "加深與傀儡王國的紐帶"
 CZE_deepen_ties_with_puppet_kingdoms_desc: "儘管我們已確立勢力範圍，但要從這些附屬國獲得最大利益，還需進一步增強影響力。"
 CZE_poland_alliance_monarchist: "與[POL.GetNonIdeologyName]的協議"
 CZE_poland_alliance_monarchist_desc: "$CZE_ally_poland_desc$"
 CZE_a_strong_poland: "強大的[POL.GetNonIdeologyName]"
 CZE_a_strong_poland_desc: "[POL.GetNameDef]擁有東歐最強的軍隊之一，有潛力成為有價值的盟友。"
 CZE_mend_balkan_relations: "修復巴爾幹關係"
 CZE_facilitate_a_strong_hungary: "扶持強大的匈牙利"
 CZE_facilitate_a_strong_hungary_desc: "[HUN.GetNameDef]自獨立以來與我方關係不穩，但戰爭逼近，我們或許能趁機促其傾向我方事業。"
 CZE_subjegate_romania: "以[HUN.GetAdjective]的宣稱施壓羅馬尼亞"
 CZE_subjegate_romania_desc: "我方的[HUN.GetAdjective]傀儡對[ROM.GetNameDef]的領土要求是一個有力籌碼。若威脅讓[HUN.GetNameDef]提出對[ROM.GetAdjective]領土的主張並加以援助，我們或許能迫使[ROM.GetNameDef]低頭。"
 CZE_demanded_overlordship_HUN: "征服匈牙利"
 CZE_demanded_overlordship_ROM: "征服羅馬尼亞"
 CZE_integrate_hungary: "整合前奧地利領土"
 CZE_integrate_hungary_desc: "我們已建立強大的勢力範圍，如能整合擴張後的[HUN.GetName]及其他領土，便可重建奧匈帝國的疆域，但這次由[ROOT.GetAdjective]主導。"
 CZE_subjegate_serbia: "征服[YUG.GetName]"
 CZE_subjegate_serbia_desc: "[YUG.GetName]已不再是南部有效的緩衝國。繼斯洛文尼亞後，我們應進一步擴張。"
 CZE_strike_the_eastern_threat: "打擊東方威脅"
 CZE_strike_the_eastern_threat_desc: "[SOV.GetName]虛偽地批評我方政體來掩飾其帝國野心，他們正對[CZE.GetName]構成生存威脅。"
 CZE_assist_austria: "保護[AUS.GetName]"
 CZE_assist_austria_desc: "保持[AUS.GetNameDef]的中立對我們的國家安全至關重要。與[AUS.GetAdjective]的邊境是我們防禦體系中最薄弱的環節之一。其經濟也可能被敵人利用，我們絕不能允許這種事發生。"
 CZE_return_to_democracy: "重返民主"
 CZE_return_to_democracy_desc: "國內已穩定，人民逐漸意識到軍事獨裁已不再適用。因此現在是時候舉行選舉，將權力交還給民主的民選政府了。"
 CZE_cooperate_with_the_allies: "與同盟國合作"
 CZE_cooperate_with_the_allies_desc: "隨著地區局勢日趨穩定，是時候修復與傳統盟友的關係了。"
 CZE_eliminate_austrian_defeatists: "擊敗[AUS.GetAdjective]投降派"
 CZE_eliminate_austrian_defeatists_desc: "[AUS.GetNameDefCap]已失去自保意志。若我們不及時干預，敵人將兵臨城下。"
 CZE_the_legacy_of_ottokar: "奧托卡的遺產"
 CZE_the_legacy_of_ottokar_desc: "傳說中的奧托卡二世將波希米亞擴展至奧地利和亞得里亞海。他能做到，是因奧地利貴族支持。我們亦應爭取奧地利人的支持，不論貴賤。"
 CZE_demand_the_istrian_peninsula: "索要伊斯特拉半島"
 CZE_demand_the_istrian_peninsula_desc: "[ROOT.GetNameDefCap]作為內陸國，這一地理限制長期制約著我們的貿易與國家影響力。我們不能再任由經濟受制於鄰國，必須堅定地爭取通往亞得里亞海的出海通道。"
 CZE_demand_slovenia: "索要斯洛文尼亞"
 CZE_demand_slovenia_desc: "斯洛文尼亞曾是奧地利帝國的重要部分。既然我們已控制舊帝國的核心領土，我們必須再次尋求收復他們的故土。"
 CZE_demand_overlordship_of_yugoslav_league: "索要對[YUG.GetAdjective]聯盟的宗主權"
 CZE_demand_overlordship_of_yugoslav_league_desc: "[YUG.GetName]也知道，在多民族國家中地方自治有其必要。但他們的聯盟已無力自保，我們必須讓[YUG.GetNameDef]認識到這一點，並允許我們進行干預。"
 CZE_expand_the_rome_protocols: "擴大羅馬協定"
 CZE_expand_the_rome_protocols_desc: "我國新政府在理念上與[ITA.capital.GetCapitalVictoryPointName]遠比與[GER.capital.GetCapitalVictoryPointName]更為一致。考慮到兩國在奧地利問題上的分歧，加入羅馬議定書或許能增強[ITA.GetNameDef]維持其當前路線的信心，而不至於倒向[GER.GetNameDef]。"
 CZE_prague_protocols: "布拉格議定"
 CZE_soviet_alliance: "擴大1935年同盟條約"
 CZE_soviet_alliance_desc: "我們與[SOV.GetNameDef]現行的聯盟條約含糊不清，無法確保他們會在我們遭受攻擊時出手干預。因此，如果我們想保障安全，必須與他們重新達成更明確的協議。"
 CZE_airlift_soviet_support: "空運蘇聯援軍"
 CZE_airlift_soviet_support_desc: "我們與[SOV.GetAdjective]無陸地邊界，因此提出用空運投送[SOV.GetAdjective]援軍的想法。雖然此類規模前所未有，但能避免[SOV.GetAdjective]軍隊經過他國領土。"
 CZE_unlocks_volunteer_transport_raid_tt: "解鎖§Y突襲§!：\n在§Y[73.GetName]§!為蘇聯志願軍打開空中通道"
 CZE_intervene_in_the_ussr: "干涉[SOV.GetAdjective]內戰"
 CZE_intervene_in_the_ussr_desc: "[SOV.GetNameDef]再次動盪，雖然我們曾經支持的舊皇室不會歸來，但若能扶植一個更友好的政權，也不可錯過良機。"
 CZE_forgive_trading_debts: "豁免貿易債務"
 CZE_forgive_trading_debts_desc: "經濟危機和大蕭條使部分潛在盟友對我國欠債累累。我們可豁免這些債務，並補償受影響的本國公司，以修復雙邊關係。"
 CZE_improve_balkan_trade_relations: "改善與巴爾幹的貿易關係"
 CZE_improve_balkan_trade_relations_desc: "我們爭取巴爾幹國家的最大籌碼就是經濟實力。若能出資改善他們的經濟，將有助於爭取其合作。"
 CZE_ally_austria: "聯合[AUS.GetName]"
 CZE_ally_austria_desc: "[AUS.GetNameDef]在幾年前幾乎被納粹暴徒顛覆政權，如今應當意識到與[ROOT.GetNameDef]合作的潛在好處。"
 CZE_demand_the_czech_corridor: "要求捷克走廊"
 CZE_demand_the_czech_corridor_desc: "在我們逐步將小協約國建設為一個真正同盟的過程中，一個日益顯現的現實是：一旦爆發衝突，向盟國調動軍隊或接收其部隊都將變得異常困難。如果能夠擁有一條連接我國與[YUG.GetNameDef]的領土走廊——正如世界大戰後曾有人提議的那樣——那麼我們的安全將得到加強，貿易也將獲得保障。"
 CZE_ally_hungary: "聯合[HUN.GetName]"
 CZE_ally_hungary_desc: "儘管[CZE.GetNonIdeologyName]與[HUN.GetNonIdeologyName]之間的關係自建國以來充滿衝突，但他們最近展現出成為寶貴盟友的潛力。"
 CZE_ally_yugoslavia: "聯合[YUG.GetName]"
 CZE_ally_yugoslavia_desc: "[YUG.GetNameDefCap]近年來在經濟上舉步維艱，但其戰略資源與地理位置仍不容忽視。"
 CZE_protect_neutrality: "保護中立國家"
 CZE_protect_neutrality_desc: "第一次世界大戰清楚表明，在敵人的虎視眈眈下中立是徒勞的。保護這些國家意味著在敵人擴張時迫使他們面對兩線作戰，而不是任由其分而治之。"
 CZE_if_cooperate_with_moderate_socialists_completed_tt: "若已完成§Y與溫和社會主義者合作§!："
 CZE_mutual_protection_agreement_with_switzerland: "與[SWI.GetNonIdeologyName]簽署保護協定"
 CZE_mutual_protection_agreement_with_switzerland_desc: "我們與[SWI.GetNameDef]正致力於構建一種狀態：任何入侵都將付出無法承受的代價。通過合作，我們能組織出一支不僅能防禦，更能反擊的軍隊。"
 CZE_exchange_technology: "開展科研合作"
 CZE_exchange_technology_desc: "儘管巴爾幹擁有豐富自然資源，但缺乏殖民地或先進工業。因此，各國在各自專長領域展開科研合作至關重要。"
 CZE_demand_corridor_to_ussr: "索要一條通往[SOV.GetAdjective]的走廊"
 CZE_demand_corridor_to_ussr_desc: "如果[POL.GetNameDef]拒絕合作，我們就必須採取更強硬的手段，確保通往[SOV.GetName]盟友的通道。"
 CZE_ally_poland: "聯合[POL.GetName]"
 CZE_ally_poland_desc: "波蘭-蘇聯戰爭尚在記憶中，西方威脅日益上升，[POL.GetNameDef]同樣在尋求安全。我們必須勸說[POL.GetAdjective]人認清，中立無法自保，是時候加入我們了。"
 CZE_realize_the_polish_czechoslovak_confederation: "實現聯邦制"
 CZE_realize_the_polish_czechoslovak_confederation_desc: "[POL.GetNameDef]雖奮勇抗敵，終究戰敗。其流亡政府如今萌生與我國合併的想法。若能聯合執政，我們將以此新國家號召[POL.GetAdjective]人民解放我們共同的家園。"
 CZE_integrate_western_ukrainians: "整合烏克蘭西部"
 CZE_integrate_western_ukrainians_desc: "[CZE.GetNameDef]境內的烏克蘭人獲得了大量協助和自治，我們現在可以著手將新獲得的土地整合為烏克蘭行省。"
 CZE_ally_russia: "聯合[SOV.GetNonIdeologyName]"
 CZE_ally_russia_desc: "如今[SOV.GetNameDef]的政府與我們更加接近，我們可以嘗試深化與其前任政府簽訂的模糊協議。"
 CZE_claim_ukraine: "建立友好的烏克蘭政權"
 CZE_claim_ukraine_desc: "烏克蘭是[SOV.GetNameDef]的重要組成部分，若我們掌控該地，便能建立一個強有力的緩衝國。"
 CZE_strengthen_the_little_entente: "成立小協約國"
 CZE_strengthen_the_little_entente_desc: "小協約國最初是為牽制[HUN.GetNonIdeologyName]而組建的，但它有潛力發展為擁有強大軍隊的真正聯盟。"
 CZE_seek_french_leadership: "尋求[FRA.GetAdjective]領導地位"
 CZE_seek_french_leadership_desc: "儘管是我們發起建立該聯盟，但顯然[FRA.GetNonIdeologyName]的軍隊將是任何聯盟的重要補充。即便要讓出領導權也值得。"
 CZE_increase_food_and_resource_imports: "增加食品與資源進口"
 CZE_increase_food_and_resource_imports_desc: "我們新盟友的農業產業發達，已經不再需要大力補貼本國農業。廉價進口資源可為我們省錢，也能刺激盟友經濟。"
 CZE_double_down_on_heavy_industry: "加倍發展重工業"
 CZE_double_down_on_heavy_industry_desc: "新簽署的聯盟協議允許我們專注於武器等競爭力強的工業。產能過剩時，也可用於出口獲利。"
 CZE_neutralize_the_hungarian_threat: "削弱[HUN.GetAdjective]威脅"
 CZE_neutralize_the_hungarian_threat_desc: "[HUN.GetNameDefCap]若站在敵人一方，將嚴重干擾我們與南方盟友之間的聯繫，即便《特里亞農條約》限制了其軍力，我們也不能掉以輕心。"
 CZE_cancel_anti_hungary_focus: "在[GER.GetAdjective]干預後退讓"
 CZE_ally_romania: "聯合[ROM.GetName]"
 CZE_ally_romania_desc: "[ROM.GetNameDefCap]是本地區少有的自給自足國家之一，他們擁有食品和寶貴的石油資源。與其結盟不僅能促進資源互通，也能讓敵人失去這些重要戰略物資。"
 CZE_divide_germany: "分裂德國"
 CZE_divide_germany_desc: "[GER.GetNameDef]的威脅難以單獨應對，因此我們應尋求那些也擔心[GER.GetAdjective]擴張，並有意願採取先發制人行動的盟友。"
 CZE_if_FRA_ally_tt: "若§Y法國為君主制國家§!且尚未加入他方陣營："
 CZE_if_POL_ally_tt: "若完成§Y強大的波蘭§!，並從[POL.GetNonIdeologyName]獲得獨立保障："
 CZE_revolutionary_brigades: "成立革命旅"
 CZE_revolutionary_brigades_desc: "我們那些曾為[ROOT.GetNameDef]作戰的革命者，應當被進一步整合進正規軍中。"
 CZE_recruit_communist_exiles: "招募流亡的共產黨人"
 CZE_recruit_communist_exiles_desc: "[ROOT.capital.GetCapitalVictoryPointName]長期以來是革命者的避風港，我們的新政府可加以利用。"
 CZE_destabilize_potential_adversaries: "破壞潛在敵國的穩定"
 CZE_destabilize_potential_adversaries_desc: "這些流亡者對其祖國的瞭解甚至勝過間諜。我們必須善用這類知識來策劃解放行動。"
 CZE_nationalize_key_industries: "國有化銀行與礦產"
 CZE_nationalize_key_industries_desc: "礦產為我們工業提供原材料，而工業再將其鍛造成戰爭武器。在危機時刻，政府應當完全掌控原材料供應，不應落入金融家和工業家的手中。"
 CZE_rehabilitate_the_army: "整編軍隊"
 CZE_rehabilitate_the_army_desc: "[CZE.GetAdjective]軍隊的大多數將領曾在捷克斯洛伐克軍團服役，曾於內戰中對抗蘇聯。必須確保他們忠於[CZE.GetAdjective]的新政府。"
 CZE_unlock_civil_war_army_generals_tt: "重新召集在內戰中流失的指揮官"
 CZE_recruit_ideologically_aligned_generals: "招募意識形態可靠的將領"
 CZE_recruit_ideologically_aligned_generals_desc: "我們必須調整軍官培訓機制，引入理解新時代價值觀的新一代軍官。"
 CZE_recruit_communist_generic_general_tt: "獲得一名共產主義將領。"
 CZE_purge_two_random_commanders_tt: "隨機清洗兩名指揮官。"
 CZE_czechoslovak_union: "捷克斯洛伐克聯盟"
 CZE_czechoslovak_union_desc: "[CZE.GetNameDef]必須賦予地方更高自治權，以便根據各地實際調整共產主義體制。"
 CZE_continue_industrial_relocation_schemes: "繼續兵工廠遷移計劃"
 CZE_continue_industrial_relocation_schemes_desc: "為了國家安全，必須繼續將易受攻擊的工廠轉移至內陸安全地區。關鍵產業不可陷於險地。"
 CZE_continue_industrial_relocation_schemes_tt: "移除§Y1座軍用工廠§!"
 CZE_continue_industrial_relocation_schemes_2_tt: "§R這些工廠需要重建。§!"
 CZE_establish_a_armament_factory_in_uhersky_brod: "建立烏赫爾布羅德兵工廠"
 CZE_establish_a_armament_factory_in_uhersky_brod_desc: "烏赫爾布羅德兵工廠是一家專門生產和設計步兵及飛機使用的自動武器的軍工廠。我們計劃將它打造成世界範圍內在該領域最先進的工廠。"
 CZE_appeal_to_the_castle: "請求“城堡”支持"
 CZE_appeal_to_the_castle_desc: "捷克斯洛伐克的“城堡”集團指的是一個支持總統的龐大的、由有影響力的組織和人士構成的網絡。這種勢力同時又使總統能夠施加比其有限的憲法職責所賦予的更大的影響力。爭取這個團體的支持將極大提升我們在角逐領導地位的優勢。"
 CZE_petition_the_nobles: "請願貴族"
 CZE_petition_the_nobles_desc: "[ROOT.GetNameDef]的貴族雖已失去頭銜，但依然在[ROOT.GetAdjective]影響深遠。爭取他們的支持能為我們帶來合法性與資源。"
 CZE_unify_the_fascist_parties: "統一法西斯黨派"
 CZE_unify_the_fascist_parties_desc: "當前的法西斯派系支離破碎，極端黨派無法獲得廣泛支持。為了國家團結，有必要統一他們，並提出一個能吸引更廣泛群眾的願景。"
 CZE_pro_rearmament_propaganda: "宣傳重整軍備"
 CZE_pro_rearmament_propaganda_desc: "為加強中央政府，必須凸顯當今世界局勢之脆弱。這將激發民眾支持強軍政策。"
 CZE_align_nationalist_parties: "聯合捷克民族主義黨派"
 CZE_align_nationalist_parties_desc: "儘管應爭取所有[ROOT.GetAdjective]人支持，但不可否認，傳統捷克民族主義政黨在政治上最具影響力，是我們最容易爭取的對象。"
 CZE_align_slovak_catholics: "聯合斯洛伐克的天主教黨派"
 CZE_align_slovak_catholics_desc: "斯洛伐克當前支持度較高的黨派為天主教黨與民族主義黨。儘管與民族主義者合作困難，但我們也許能爭取到天主教派。"
 CZE_jozef_tiso_tt: "任命顧問§Y$CZE_jozef_tiso$§!"
 CZE_align_catholic_parties: "與捷克斯洛伐克人民黨結盟"
 CZE_align_catholic_parties_desc: "捷克斯洛伐克人民黨及其他天主教政黨曾是奧匈帝國君主制體系的傳統支持力量，現在是時候爭取讓他們迴歸這一立場了。"
 CZE_restore_the_monarchy: "恢復君主制"
 CZE_restore_the_monarchy_desc: "在為新體制鋪平道路後，我們可以向人民正式提出計劃。推舉的國王$CZE_karel_schwarzenberg$是[ROOT.GetAdjective]人，相較過去由[AUS.GetAdjective]君主主導，更具親和力。"
 CZE_semi_constitutional_monarchy: "半君主立憲制"
 CZE_semi_constitutional_monarchy_desc: "君主選定後，憲法也應調整。儘管有人主張集權，但顯然君主無法獨自統治國家，因此保留部分現有體制以輔佐政務較為合理。"
 CZE_restore_noble_titles: "恢復貴族頭銜"
 CZE_restore_noble_titles_desc: "共和國成立後貴族被廢黜，如今我們應憑藉他們的合作而恢復其頭銜。我們同時可以授予那些為[ROOT.GetAdjective]不斷奮鬥的英雄官員榮譽頭銜。"
 CZE_restore_the_austro_hungarian_customs_union: "恢復帝國的關稅同盟"
 CZE_restore_the_austro_hungarian_customs_union_desc: "奧匈帝國不可否認的優勢之一是其對我國工業的貿易壁壘較小，重建這一聯盟將是把其他前成員國納入我們勢力範圍的第一步。"
 CZE_customs_union: "關稅同盟"
 CZE_catholic_focus: "重視天主教"
 CZE_catholic_focus_desc: "儘管胡斯派是[ROOT.GetAdjective]歷史的重要組成部分，但許多人仍信奉天主教。提升其社會地位將增強他們對我們政權的支持。"
 CZE_hussite_legacy: "胡斯派遺產"
 CZE_hussite_legacy_desc: "胡斯派不僅倡導更接近新教的信仰，也以其宗教寬容而著稱，與那些為鎮壓異端發動戰爭的暴君截然不同。"
 CZE_align_with_germany: "與[GER.GetNonIdeologyName]結盟"
 CZE_align_with_germany_desc: "[GER.GetNameDef]的新政府或許依舊具有擴張主義傾向，但他們在結盟對象和抨擊目標上的選擇可能更加務實。我們應努力成為他們願意合作的一方。"
 CZE_rally_against_germany: "號召反對[GER.GetNonIdeologyName]"
 CZE_rally_against_germany_desc: "捷克斯洛伐克人民曾為爭取獨立而英勇奮鬥，如今我們必須號召全民共同捍衛這份來之不易的獨立。"
 CZE_integrate_sudeten_germans: "整合蘇臺德"
 CZE_integrate_sudeten_germans_desc: "蘇臺德內部的分裂對任何人都無益。我們必須著手傾聽他們的訴求，並解決相關問題。如此一來，那些獨立主義者的藉口也將難以站得住腳。"
 CZE_cooperate_with_the_sdp: "與蘇臺德德意志人黨合作"
 CZE_cooperate_with_the_sdp_desc: "儘管蘇臺德德意志人黨目前是個不穩定因素，但如果給予適當鼓勵——比如讓其加入執政聯盟，他們或許會選擇順從。"
 CZE_revive_the_december_bloc: "重建十二月集團"
 CZE_revive_the_december_bloc_desc: "曾反對愛德華·貝奈斯出任總統的法西斯、少數族裔和右翼政黨聯盟“十二月集團”應被恢復，作為現政府的替代方案。"
 CZE_revert_1926_anti_military_laws: "撤銷1927年反軍事法案"
 CZE_revert_1926_anti_military_laws_desc: "在$CZE_radola_gajda$政變未遂後，軍隊與憲兵被剝奪了投票權及其他特權。在當前的動盪時代，軍隊處於至關重要的位置，因此我們應取消這些限制，彌合軍隊與政治之間的隔閡。"
 CZE_bop_to_fascism_support_tt: "將§Y$CZE_bop_army_readiness$§!數值的三分之一轉換為對法西斯的支持："
 CZE_power_to_the_military: "權力歸於軍隊"
 CZE_power_to_the_military_desc: "如今沒有任何資源可以浪費在國家防禦之外。讓掌權者理解軍隊的需求是當務之急，而最直接的方式便是組建軍政府。"
 CZE_militarize_the_associations: "軍事化協會組織"
 CZE_militarize_the_associations_desc: "[CZE.GetNameDef]境內眾多協會可在全民動員前，向公民傳授稱為士兵所需的技能，為國家防禦貢獻力量。"
 CZE_aggressive_foreign_policy: "激進的外交政策"
 CZE_aggressive_foreign_policy_desc: "信賴脆弱的條約時代已經結束。為了國家安全，我們必須果斷行動，哪怕需要重大犧牲。"
 CZE_work_with_germany: "與[GER.GetNameDef]合作"
 CZE_work_with_germany_desc: "既然蘇臺德問題已解決，[GER.GetNameDef]或許能意識到[ROOT.GetNameDef]作為盟友的價值。"
 CZE_control_the_associations: "控制協會組織"
 CZE_control_the_associations_desc: "[CZE.GetNonIdeologyName]內存在各種組織，從職業協會到興趣小組、體育社團。控制這些組織，就等於掌控了社會的很大一部分。"
 CZE_diversify_bata: "多元化巴塔"
 CZE_diversify_bata_desc: "巴塔公司是一個大型消費品企業，可協助我們構建資源供應鏈，為我們提供稀缺關鍵原料。"
 CZE_devaluate_the_koruna: "貶值克朗"
 CZE_devaluate_the_koruna_desc: "對於一個依賴出口的國家而言，強勢貨幣反而是一種風險。削弱克朗的幣值雖有短期痛苦，但從長遠來看，將帶來更大經濟利益。"
 CZE_continue_the_central_bohemia_plan: "中部波西米亞工業計劃"
 CZE_continue_the_central_bohemia_plan_desc: "繼續在中部地區擴大工業有助於實現規模經濟。從國家安全角度看，使工業中心遠離邊境同樣是明智之舉。"
 CZE_balance_industrial_invevestments: "平衡工業發展"
 CZE_balance_industrial_invevestments_desc: "忽視[9.getname]與[75.getname]以外地區發展，正是我們國家在上世紀30年代初分裂的原因之一。發展邊緣地區的工業將有助於全國一體化。"
 CZE_expand_prf_science_facilities: "擴建查理大學法學院科研設施"
 CZE_expand_prf_science_facilities_desc: "查理大學法學院的科研設施中聚集著一批才華橫溢的人才，他們正等待著一個能夠實現更大作為的機會。擴充該部門並促使其與政府合作是提升我國研究水平的良好開端。"
 CZE_raise_more_industrial_funds: "提高工業撥款"
 CZE_raise_more_industrial_funds_desc: "從奧匈帝國時期至今，工業一直是國家的核心。只要政府提供充足資金，動盪的歐洲也無法阻礙我國工業蓬勃發展。"
 CZE_skoda_priority_focus_info_tt: "部分§Y國策§!需要我國處於特定的£GFX_CZE_skoda_text_icon §Y斯柯達優先事項§!國策狀態下才能完成。此類國策會通過一個與所需£GFX_CZE_skoda_text_icon §Y斯柯達優先事項§!對應的小圖標進行標註。"
 CZE_joint_stock_schemes: "合資企業模式"
 CZE_joint_stock_schemes_desc: "當傳統融資渠道不足時，合資企業提供了寶貴的增長機會。繼續運用這種方式將推動經濟持續發展。"
 CZE_the_slovak_arrow: "斯洛伐克之箭"
 CZE_the_slovak_arrow_desc: "建設連接兩大城市的高速列車，不僅能增強國家自豪感，還可藉機改善鐵路基礎設施。"
 CZE_finish_double_tracking_efforts: "鐵路雙軌化"
 CZE_finish_double_tracking_efforts_desc: "完成次級鐵路的雙軌化工作，可顯著提高運輸能力，改善中小城市之間的連通性。"
 CZE_realize_motorway_proposals: "實現高速公路提案"
 CZE_realize_motorway_proposals_desc: "政府已收到若干改善全國公路網絡的高速公路計劃，是時候付諸實踐，讓道路交通更高效。"
 CZE_build_additional_rail_stations: "建設新的火車站"
 CZE_build_additional_rail_stations_desc: "新建鐵路提升了運量，但現有車站承載能力有限。擴建車站將有助於提升人流與物流效率。"
 CZE_build_additional_rail_stations_focus_cost_tt: "採取§Y$CZE_devaluate_the_koruna$§!可將此國策的所需時間縮短至§G35§!天。"
 CZE_grow_ckd_secondary_facilities: "CKD附屬設施"
 CZE_grow_ckd_secondary_facilities_desc: "捷克摩拉維亞-科爾本-丹歷（CKD）有許多較小的附屬工廠，這些工廠生產發電機之類的重要工業產品。擴建這些工廠將有助於發展我們的重工業。"
 CZE_bolster_domestic_construction: "加強國內建築業"
 CZE_bolster_domestic_construction_desc: "自大戰結束獨立以來，我國建築業持續增長。向中型建築承包商提供更多投資，將進一步推動建設能力提升。"
 CZE_invest_in_vhht: "投資VHHT"
 CZE_invest_in_vhht_desc: "維特科維採礦業與冶金（VHHT）是一家在全國擁有多個金屬加工廠的公司。投資並擴建該公司將有助於我們在金屬生產的許多領域取得進步。"
 CZE_expand_vitkovice_ironworks: "擴建維特科維採鋼鐵廠"
 CZE_expand_vitkovice_ironworks_desc: "維特科維採鋼鐵廠是[74.getname]重要的鐵產基地。進行擴建將顯著提高產量。"
 CZE_expand_central_bohemian_mines: "擴建中波希米亞礦區"
 CZE_expand_central_bohemian_mines_desc: "我國中部的煤礦對能源安全至關重要，我們必須儘快擴大開採規模。"
 CZE_increase_bauxite_imports: "增加鋁土礦進口"
 CZE_increase_bauxite_imports_desc: "我國鋁資源匱乏，但通過先進煉製工藝並增加鋁土礦進口，國內也可實現一定程度的鋁產。這樣有助於緩解資源短缺。"
 CZE_merge_the_oil_companies: "整合石油企業"
 CZE_merge_the_oil_companies_desc: "當前的石油公司多為圍繞少數油井設立的小型企業。若將其合併並納入國家掌控，將可提升產能，資源利用更高效。"
 CZE_expand_trinec_ironworks: "特日內茨鋼鐵廠"
 CZE_expand_trinec_ironworks_desc: "特日內茨鋼鐵廠自成立以來就是[72.getname]的工業巨頭。進一步投資將為國家資源供應帶來豐厚回報。"
 CZE_consolidate_mining_operations: "整合採礦運營"
 CZE_consolidate_mining_operations_desc: "通過整合採礦公司管理，優化資源配置，將使礦產開採與技術研究效率更高。"
 CZE_expand_praga: "與普拉加公司簽約"
 CZE_expand_praga_desc: "普拉加公司長期為軍工產業供應關鍵部件。給予其更多訂單，有助於其進一步發展。"
 CZE_shrink_educational_disparities: "縮小教育差距"
 CZE_shrink_educational_disparities_desc: "農村地區教育資源遠不如城市，我們應通過大規模教育項目改善這一差距。"
 CZE_kickstart_rapid_rearmanent: "啟動快速軍備重整"
 CZE_kickstart_rapid_rearmanent_desc: "儘管商界與政界可能反對，我們必須立即展開軍備建設。周邊國家早已暗中擴軍，我們不能再坐視不管。"
 CZE_keep_focus_on_weapon_exports: "繼續專注武器出口"
 CZE_keep_focus_on_weapon_exports_desc: "武器出口是我們擺脫經濟危機的支柱產業。貿然轉向將造成政治與經濟風險，當前穩定路線仍是最優選擇。"
 CZE_force_the_industrialists_hand: "強迫工業資本家配合"
 CZE_force_the_industrialists_hand_desc: "財團與工業家長期制約我們的重整軍備。是時候以國家意志替他們做出選擇了。"
 CZE_embrace_corporatism: "採納社團主義"
 CZE_embrace_corporatism_desc: "如果我們願意在政策上做出讓步，就能說服企業家支持重啟軍備擴張。這種互利妥協符合國家利益。"
 CZE_expand_existing_armory_plants: "擴建現有兵工廠"
 CZE_expand_existing_armory_plants_desc: "遷移我們現有的兵工廠將是一項代價高昂卻收益有限的投資。不如直接擴建現有工廠，同時提升產能與研發能力。哪怕這些工廠位於在戰時易受敵人攻擊的地點。"
 CZE_expand_skoda_offices: "擴張斯柯達辦事處"
 CZE_expand_skoda_offices_desc: "國際辦事處是斯柯達武器銷售的命脈。應當將其擴張到更多地區。"
 CZE_skoda_office_unlock_tt: "解鎖決議：§Y建立武器銷售辦公室§!"
 CZE_complete_the_power_grid: "完成電網建設"
 CZE_complete_the_power_grid_desc: "我國農村地區電網落後，已成為經濟發展的障礙。必須儘快改善。"
 CZE_build_the_slapy_reservoir: "建設斯拉皮水庫"
 CZE_build_the_slapy_reservoir_desc: "在斯拉皮修建水壩將提升該地區的電力供應與經濟機會。新增發電能力將推動區域工業增長。"
 CZE_diversify_refinery_processes: "多樣化精煉工藝"
 CZE_diversify_refinery_processes_desc: "我們的油井有能力產出各種石油副產品，但缺乏必要的技術。若能投入科研，將實現該產業的突破。"
 CZE_enlarge_smaller_wells: "擴建小型油井"
 CZE_enlarge_smaller_wells_desc: "儘管規模較小，這些油井仍具更高潛力。只需投入時間與資源，即可大幅提升產量。"
 CZE_develop_sudetenland_resources: "開發蘇臺德地區的資源"
 CZE_develop_sudetenland_resources_desc: "蘇臺德地區擁有豐富資源，但尚未被充分開採。在此建立更多礦場將是極具回報的投資。"
 CZE_grow_tatras_capabilities: "增強塔特拉斯工廠"
 CZE_grow_tatras_capabilities_desc: "塔特拉斯工廠目前的小型坦克部門擁有一些新穎的生產設計。給予他們更多資源，將使其在裝甲設計方面持續取得進展。"
 CZE_bailout_moser: "拯救莫塞爾公司"
 CZE_bailout_moser_desc: "大蕭條使莫塞爾公司陷入困境。我們需要對其進行援助，重開工廠，讓被裁員的工人重新上崗。"
 CZE_merge_skodas_consumer_good_plants: "合併斯柯達的消費品工廠"
 CZE_merge_skodas_consumer_good_plants_desc: "斯柯達擁有許多零散的消費品工廠，缺乏集中管理。整合這些工廠將優化生產，並帶來總體性提升。"
 CZE_giant_of_central_europe_industry: "工業巨頭"
 CZE_giant_of_central_europe_industry_desc: "我們達到了過去被認為不可能的高度——如今我們是歐洲的工業巨人！"
 CZE_continue_armed_force_reform: "繼續武裝部隊改革"
 CZE_continue_armed_force_reform_desc: "按計劃推進軍隊現代化，並將軍事區域重新劃歸各省指揮部，可在潛在衝突中實現更高效的協調。"
 CZE_air_force_officer_recruitment: "空軍軍官招募"
 CZE_air_force_officer_recruitment_desc: "各地飛行俱樂部與空軍預備軍官學校合作，提供飛行課程與實彈訓練，以滿足後備軍官的關鍵需求。"
 CZE_national_defense_act: "國防法案"
 CZE_national_defense_act_desc: "該法案包括一切旨在應對威脅或攻擊國家主權、統一和安全的軍事及其他手段，由國家安全最高委員會監督執行。"
 CZE_car_and_oil_rationing: "汽車與石油配給"
 CZE_car_and_oil_rationing_desc: "限制私車使用並在必要時徵用，有助於集中汽車與石油資源用於軍需生產。"
 CZE_expand_airfield_capacity: "擴建機場設施"
 CZE_expand_airfield_capacity_desc: "第三航空局已規劃新機場與機庫，用於飛機操作、維修與儲存，併為新組建的中隊與地勤人員建設宿舍。"
 CZE_trust_in_old_guard: "信任老一代飛行員"
 CZE_trust_in_old_guard_desc: "我們堅定地信任那些曾參加大戰的老飛行員，他們將把空戰經驗傳授給新一代。"
 CZE_expand_the_aero_clubs: "擴大飛行俱樂部"
 CZE_expand_the_aero_clubs_desc: "飛行俱樂部為國家持續輸送飛行人才，應進一步擴大其規模。"
 CZE_invest_in_the_smaller_air_plants: "投資中小型航空工廠"
 CZE_invest_in_the_smaller_air_plants_desc: "投資新興小型飛機制造商，可為老牌企業引入競爭，也有助於滿足更廣泛的生產需求。"
 CZE_continue_avia_expansion: "繼續擴張阿維亞"
 CZE_continue_avia_expansion_desc: "對阿維亞的投資將提供進一步增強其生產能力所需的額外設備；這有助於提升高需求機體的生產效率。"
 CZE_increase_military_aeronautical_institute_funding: "增加航空科研資金"
 CZE_increase_military_aeronautical_institute_funding_desc: "通過建設航空研究與測試機構附屬設施，將更深入瞭解空氣動力學，推進飛機設計的改進。"
 CZE_air_training_abroad: "空軍出國訓練"
 CZE_air_training_abroad_desc: "派遣學員前往友好國家的空軍系統，將帶來寶貴的跨國經驗與技術視角。"
 CZE_establish_air_defense_zones: "建立防空區"
 CZE_establish_air_defense_zones_desc: "我們可以在關鍵區域和工廠部署高射炮，並通過地方通信樞紐設立防空區，以優化防空精準度。"
 CZE_establish_air_defense_zones_enable_tt: "解鎖§Y防空區§!"
 CZE_establish_air_defense_zones_tt: "靜態高射炮命中率：§G+10%§!"
 CZE_the_air_is_our_sea: "天空即我們的海"
 CZE_the_air_is_our_sea_desc: "在系統訓練基礎上，讓飛行員勇敢自信地翱翔：“我們沒有出海口與遠洋艦隊，但天空即我們的海。”"
 CZE_bring_kramer_and_lobel_under_state_control: "國有化克拉默勒布爾"
 CZE_bring_kramer_and_lobel_under_state_control_desc: "通過將克拉默勒布爾收歸國有，我們可以確保關鍵電氣設備和無線電配件的持續研發與按時交付。"
 CZE_second_to_none: "無與倫比"
 CZE_second_to_none_desc: "我國航空工業日益精進，只需進一步研究，我們的飛機設計將超越全球任何對手！"
 CZE_diversify_airframe_production: "多樣化機體生產"
 CZE_diversify_airframe_production_desc: "我們不能僅依靠戰鬥機掌握制空權，還需發展其他飛機與大型機體，應對多種任務需求。"
 CZE_projekt_l_52: "L-52項目"
 CZE_projekt_l_52_desc: "噴氣發動機技術是未來軍事飛行器的發展方向。雖然該技術尚不成熟，但若我們著手開發專屬項目併為其設計專用機體，就能走在時代前沿。"
 CZE_fund_vladimir_mandl_research: "資助弗拉基米爾·曼德爾的研究"
 CZE_fund_vladimir_mandl_research_desc: "法律學者$CZE_vladimir_mandl$熱衷於火箭技術。若我們提供資源協助其將理論轉化為實用技術，國家將大有裨益。"
 CZE_mobilize_the_reserves: "動員預備役"
 CZE_mobilize_the_reserves_desc: "我國邊境的緊張局勢正在惡化。我們必須根據動員令，徵召預備役人員和預先選定的軍事專家入伍。"
 CZE_three_kings: "三王行動"
 CZE_three_kings_desc: "官方支援抵抗組織將極大提升其對敵破壞力，並可能直接輔助前線作戰。"
 CZE_form_the_state_defense_guard: "建立國防衛隊"
 CZE_form_the_state_defense_guard_desc: "國防衛隊的組建使我們擁有了一個專門負責守衛我國漫長邊境的組織。由於該衛隊的成員是按軍隊標準組織和訓練的，他們將成為抵禦任何邊境入侵的第一道防線。"
 CZE_expand_the_horska_divisions: "擴編山地師"
 CZE_expand_the_horska_divisions_desc: "我國地形多為丘陵與高原，訓練有素的山地作戰部隊將在複雜地形中發揮關鍵作用。"
 CZE_develop_horska_artillery: "研發山地火炮"
 CZE_develop_horska_artillery_desc: "改造現有火炮，使其輕便易拆卸，可確保山地與丘陵地區部隊擁有充足火力支援。"
 CZE_develop_horska_artillery_tech_tt: "解鎖§Y山地火炮§!\n§Y火炮（山地）§!\n攻擊：§G+10%§!\n移動：§G+10%§!\n§Y火炮（丘陵）§!\n攻擊：§G+10%§!\n移動：§G+10%§!"
 CZE_bribery_investigations: "賄賂調查"
 CZE_bribery_investigations_desc: "收到匿名信反映士兵伙食與待遇問題，部分軍需官涉嫌不當行為。我們必須在此事擴大前及時解決。"
 CZE_bribery_investigations_remove_effect_tt: "完成國策“§Y$CZE_bribery_investigations$§!”後將移除該國家精神。"
 CZE_opl_exercises: "高射炮防禦演練"
 CZE_opl_exercises_desc: "通過組織高射炮防禦演練，可提升部隊協同與機動性，從而增強整體作戰能力與安全。"
 CZE_rapid_response_divisions: "快速部隊"
 CZE_rapid_response_divisions_desc: "外國軍隊已展示出高機動單位的戰術優勢，我們也應組建類似部隊，以便評估其實戰價值。"
 CZE_redouble_tank_development_efforts: "加倍裝甲研發努力"
 CZE_redouble_tank_development_efforts_desc: "當前輕型坦克設計落後於歐洲主流使用者。我們必須加倍努力，迎頭趕上。"
 CZE_rearmed_and_retooled: "重整軍備，翻新武裝"
 CZE_rearmed_and_retooled_desc: "現有重型底盤具備現代化潛力，應繼續優化設計，以滿足裝甲部隊未來擴編所需。"
 CZE_establish_the_fall_backlines: "構建後備防線"
 CZE_establish_the_fall_backlines_desc: "我們需要面對現實，部分防線終將崩潰。一旦發生，那麼提前準備的後備陣地，將成為勝敗分水嶺。"
 CZE_establish_the_fall_backlines_masterful_delay_tactic_tt: "\n啟用戰術：§Y$tactic_masterful_delay$§!"
 CZE_anti_tank_development: "反坦克火炮研發"
 CZE_anti_tank_development_desc: "隨著敵軍裝甲部隊擴張，改進我們的反坦克火炮迫在眉睫。能否用野戰炮對抗坦克，將決定敵我勝負。"
 CZE_anti_tank_development_tech_tt: "解鎖§Y反坦克改進§!\n§Y火炮§!穿甲深度：§G+5%§!\n§Y支援火炮§!穿甲深度：§G+5%§!\n§Y反坦克§!穿甲深度：§G+5%§!\n§Y支援反坦克§!穿甲深度：§G+5%§!"
 CZE_recon_in_force: "強化偵察"
 CZE_recon_in_force_tech_tt: "解鎖§Y強化偵察§!\n§Y偵察部隊§!：生命值§G+5§!\n偵察效率§G+10%§!"
 CZE_recon_in_force_desc: "讓我們的偵察兵在刺探敵軍防線時與敵人接觸，是獲取情報的寶貴方式。"
 CZE_integrate_fortification_engineers: "整合築壘工程師"
 CZE_integrate_fortification_engineers_desc: "築壘工程師不進行永久防禦工事施工時，應迅速轉為前線支援，他們將幫助部隊建立臨時防禦設施。"
 CZE_integrate_fortification_engineers_tech_tt: "解鎖§Y整合築壘工程師§!\n§Y工兵連§!：\n塹壕§G+10%§!。\n§Y（堡壘）§!\n防禦§G+10%§!"
 CZE_concealment_efforts: "偽裝措施"
 CZE_concealment_efforts_desc: "敵軍廣泛使用攻擊與偵察機，偽裝網等隱蔽手段已成必需。我們必須加強偽裝保障部隊安全。"
 CZE_concealment_efforts_tech_tt: "解鎖§Y改進偽裝網§!\n§Y步兵（森林）§!\n防禦：§G+10%§!"
 CZE_elevate_the_vsv: "提升戰爭學院"
 CZE_elevate_the_vsv_desc: "作為國家軍隊的大腦，陸軍總參謀部肩負著極其重要的國家責任。因此，總參謀部的軍官不僅要有卓越的專業訓練，還需具備可靠性、自制力、圓滑處事的能力與高尚品格。"
 CZE_continue_with_snejdareks_plan_dynamic: "[CZE_continue_with_snejdareks_plan]"
 CZE_continue_with_snejdareks_plan_default: "繼續施內達雷克的計劃"
 CZE_continue_with_snejdareks_plan_no_snejdareks: "繼續推行靜態防禦計劃"
 CZE_continue_with_snejdareks_plan_dynamic_desc: "建立有效防禦網絡可防止敵軍出其不意的滲透，為轉守為攻提供保護和堅實基礎。"
 CZE_go_with_vojcechovskys_plan_dynamic: "[CZE_go_with_vojcechovskys_plan]"
 CZE_go_with_vojcechovskys_plan_default: "採納盧扎的計劃"
 CZE_go_with_vojcechovskys_plan_no_luza: "主動防禦學說"
 CZE_go_with_vojcechovskys_plan_dynamic_desc: "靜態防禦的劣勢在於無法機動。一旦被突破，就無法再用於進攻，只能作為殘留設施被動防守。"
 CZE_improve_the_current_officer_pool: "改善現有軍官隊伍"
 CZE_improve_the_current_officer_pool_desc: "我們將提拔那些在監督和協調上級與基層之間表現突出的人員，他們的素養有能力成為我軍的骨幹力量。"
 CZE_elevate_slovak_officers: "提拔斯洛伐克軍官"
 CZE_elevate_slovak_officers_desc: "我們將國策提拔斯洛伐克籍軍官，以便該地區能彰顯在軍中的存在。通過適當降低其地區申請門檻，我們預計未來能增強軍隊凝聚力。"
 CZE_promote_moravec_writings: "推廣莫拉維茨的著作"
 CZE_promote_moravec_writings_desc: "儘管莫拉維茨的《士兵與時間》和《國家防衛》引發爭議，他的新作《我國在中歐的軍事戰略地位》卻在歐洲多國媒體上被廣泛討論。我們應支持他繼續研究，鞏固其在軍事政策與歷史上的專業地位。"
 CZE_lessons_of_war: "戰爭的教訓"
 CZE_lessons_of_war_desc: "經過與對等對手的實戰後，我們可將這些經驗用於改進最高指揮系統——實戰教訓無可替代。"
 CZE_lessons_of_war_i_had_war_with_major_flag: "曾與主要國家交戰"
 CZE_for_the_homeland: "為祖國而戰"
 CZE_for_the_homeland_desc: "我軍已整裝待命，信心十足，隨時準備保衛祖國、迎接一切挑戰。"
 CZE_the_lions_roar: "獅吼"
 CZE_the_lions_roar_desc: "捷克斯洛伐克雄獅的象徵，體現了我軍最崇高的品質：勇氣、力量與英雄主義。世人終將目睹我軍所向披靡的精神。"
 CZE_diversify_our_specialists: "多元化專業部隊"
 CZE_diversify_our_specialists_desc: "我們的兵種專業化領域需要多元化，不應只專注于山地部隊。戰爭的戰場遠不止山嶺與高地。"
 CZE_merge_the_financial_and_state_guard: "合併財政衛隊與國防衛隊"
 CZE_merge_the_financial_and_state_guard_desc: "隨著國防衛隊的建立，財政衛隊已無存在必要。將其合併入國防衛隊，將迅速提升衛隊的兵力。"
 CZE_merge_the_financial_and_state_guard_tt: "解鎖：§Y整合財政衛隊§!\n§Y憲兵隊§!：生命值 §G+5§!"
 CZE_logistics_beyond_the_sudetes: "蘇臺德之外的後勤"
 CZE_logistics_beyond_the_sudetes_desc: "若我們希望在蘇臺德山區之外展開戰鬥，必須學習長距離後勤的運作方式——這與本土作戰完全不同。"
 CZE_logistics_beyond_the_sudetes_tt: "解鎖：§Y改進補給庫§!\n§Y後勤連§!：補給消耗：§G-10%§!"
 CZE_expand_the_river_monitor_fleet: "擴大淺水重炮艦艦隊"
 CZE_expand_the_river_monitor_fleet_desc: "我國淺水重炮艦艦隊的規模名列歐洲之最，對內陸防禦起著重要作用。擴大其規模將極大提升其效能。"
 CZE_the_tvp_project: "通用坦克項目"
 CZE_the_tvp_project_desc: "軍方提議開展通用坦克計劃，研發國產坦克設計。部分擁有豐富坦克製造經驗的廠商對此表示濃厚興趣。"
 CZE_expand_the_land_department_of_vtu: "擴建軍事技術研究所陸軍部門"
 CZE_expand_the_land_department_of_vtu_desc: "擴建軍事技術研究所陸軍部門將為其提供更多硬件資源與試驗場，增強未來裝備研發能力。"
 CZE_department_two_expansion: "第二局"
 CZE_department_two_expansion_desc: "我們的情報機構——第二局，需要更多資源以更有效地保障國家安全，對抗敵國間諜活動。這也可能推動機構內特定部門的擴建。"
 CZE_military_intelligence: "軍事情報部門"
 CZE_military_intelligence_desc: "軍事情報是情報體系核心之一。加大投入將帶來巨大回報。"
 CZE_air_intelligence: "空軍情報部門"
 CZE_air_intelligence_desc: "掌握敵方空軍數量是贏得空戰的關鍵。在空中交戰時，瞭解敵軍航空力量至關重要。"
 CZE_within_the_eagles_nest: "潛伏鷹巢"
 CZE_within_the_eagles_nest_desc: "若能在敵人據點外部署大量間諜與破壞者，將極大增強我軍能力。在第二局協助下，我們在這些地區的情報網絡可以發展壯大。"
 CZE_restart_naval_gun_production: "重啟艦炮生產"
 CZE_restart_naval_gun_production_desc: "斯柯達工廠曾是奧匈帝國最大的艦炮設計商和生產商。重啟艦炮生產將為重啟國內海軍生產開闢機會。"
 CZE_restart_naval_gun_production_tt: "§Y斯柯達優先事項§!的海軍重心§Y激活§!"
 CZE_reform_the_naval_detachment: "重建海軍部隊"
 CZE_reform_the_naval_detachment_desc: "由於先前將其併入陸軍，海軍部隊早已解散。當前局勢使重建該部隊成為必要。"
 CZE_build_2_dockyards_when_we_have_coast_tt: "將立即在我們控制的隨機一個沿海§Y地區§!建造§G2§!§Y海軍船塢§!。"
 CZE_skoda_naval_yards: "斯柯達海軍造船廠"
 CZE_skoda_naval_yards_desc: "重新獲得出海口後，我們可藉助仍在本土的技術專家，重啟奧匈帝國舊有海軍工業。啟用本土造船廠應為優先事項。"
 CZE_build_3_dockyards_when_we_have_coast_tt: "將立即在我們控制的隨機一個沿海§Y地區§!建造§G3§!§Y海軍船塢§!。"
 CZE_legacy_of_the_kriegsmarine: "奧匈帝國海軍的遺產"
 CZE_legacy_of_the_kriegsmarine_desc: "作為奧匈帝國海軍的延續，我們仍具備建造大型戰艦的能力，應繼續發揚此項傳統。"
 CZE_build_off_old_ganz_danubius_designs: "利用岡茨多瑙的舊設計"
 CZE_build_off_old_ganz_danubius_designs_desc: "重啟格龍茲·道努比烏什的巡洋艦的舊設計，有助於新艦船開發。許多相關專家仍居住在我國境內。"
 CZE_modernize_trieste_designs: "的裡雅斯特設計的現代化"
 CZE_modernize_trieste_designs_desc: "通過利用奧匈海軍舊有的小型戰列艦設計，我們將更好地瞭解如何建造這一型號的艦船。"
 CZE_leverage_gunboat_experience: "利用炮艦設計經驗"
 CZE_leverage_gunboat_experience_desc: "我們在炮艦設計上的經驗可被用於驅逐艦的研發。我們的現有技術基礎將加快設計進程。"
 CZE_revive_kraljevica_designs: "重啟克拉列維察設計"
 CZE_revive_kraljevica_designs_desc: "結合我們的炮艇知識與克拉列維察的舊設計，我們可以重啟這一類驅逐艦的建造。"
 CZE_wolfs_of_bohemia: "波希米亞之狼"
 CZE_wolfs_of_bohemia_desc: "鑑於我國內仍保有潛艇建造經驗，建立我們自己的“狼群”並非難事。"
 CZE_raider_lineage: "突襲傳統"
 CZE_raider_lineage_desc: "奧匈帝國海軍軍官留下了豐富的突襲戰經驗，我們應加以利用。"
 CZE_a_modern_navy: "現代海軍"
 CZE_a_modern_navy_desc: "隨著我們在海軍技術上的進步，現在我們終於可以宣稱自己擁有了一支現代化的強大海軍。"
 CZE_build_1_dockyards_when_we_have_coast_tt: "若控制任一沿海§Y地區§!，立即建造§G1§!個§Y海軍船塢§!"
 CZE_naval_aviation: "海軍航空兵"
 CZE_naval_aviation_desc: "航母及艦載機似乎是未來海戰的發展方向。我們必須投入時間研發海戰的新領域。"
 CZE_across_the_atlantic: "跨越大西洋"
 CZE_across_the_atlantic_desc: "高效的海軍必須具備跨洋投送能力。我們必須打造能夠遠距離部署的海軍。"
 CZE_joint_equipment_designs: "聯合裝備設計"
 CZE_joint_equipment_designs_desc: "[ROOT.GetNameDef]與[GER.GetNameDef]都處於坦克與飛機設計的前沿，各有擅長領域，我們應互通有無，以便各自專注於最擅長的方向。"
 CZE_negotiate_sphere_of_influence: "就勢力範圍開展談判"
 CZE_negotiate_sphere_of_influence_desc: "[ROOT.GetNameDef]的軍事資源對[GER.GetAdjective]聯盟極具價值。我們理應要求一定的領土作為回報。"
 CZE_set_up_polish_puppet_state: "設立南[POL.GetAdjective]傀儡國"
 CZE_set_up_polish_puppet_state_desc: "既然[GER.GetNameDef]有意在波蘭設立傀儡政權，我們顯然也應考慮做同樣的事情。"
 CZE_usurp_the_mantle: "宣稱帝位"
 CZE_usurp_the_mantle_desc: "隨著我們王國的疆域從波羅的海延伸至亞得里亞海，並統治著昔日區域強權奧地利的領土，我們現在可以宣稱自己是神聖羅馬帝國的合法繼承者。"
 CZE_austro_hungary_puppets: "所有國策所需的§Y附屬國§!"
 CZE_decrease_autonomy_tier: "所有§Y$autonomy_dominion$§!或§Y$autonomy_puppet$§!附屬國失去一級自治度。"
 #Exile Focus
 CZE_prepare_for_exile: "準備流亡"
 CZE_prepare_for_exile_desc: "國家應秘密協助政治領袖流亡海外，並建立流亡政府。"
 CZE_joins_government_in_exile_tt: "加入§Y流亡政府§!"
 CZE_infiltrate_collaborationist_organizations: "滲透合作者"
 CZE_administrative_chaos_tt: "§Y$CZE_enter_exile$§!完成後，對§Y專員轄區§!的影響："
 CZE_infiltrate_collaborationist_organizations_desc: "將忠於流亡政府的[ROOT.GetAdjective]人士安插到合作者組織聽起來或許奇怪，但這是削弱他們並掌握其活動情報的理想方式。"
 CZE_enter_exile: "流亡國外"
 CZE_enter_exile_desc: "如今潛在盟友終於開始與[GER.GetAdjective]這條鱷魚作戰，我們的政府可以開始準備，爭取奪回主權。"
 CZE_refused_exile: "拒絕接納[ROOT.GetName]"
 CZE_contact_the_czech_and_slovak_legion: "聯繫捷克與斯洛伐克軍團"
 CZE_contact_the_czech_and_slovak_legion_desc: "勇敢的[ROOT.GetAdjective]人已逃往[POL.GetNameDef]與[FRA.GetNameDef]繼續為一個自由的[CZE.GetName]而戰，我們應與這些部隊取得聯繫並協調行動。”"
 CZE_skoda_priority_shortcut_finder: "斯柯達優先事項"
 CZE_skoda_priority_shortcut_finder_desc: "這就是目前斯柯達的優先事項"
 #Decision unlock TT
 CZE_decision_unlock: "解鎖決議："
 CZE_demand_regime_change_tt: "$CZE_decision_unlock$§Y要求政權更迭§!"
 CZE_propose_unification_tt: "$CZE_decision_unlock$§Y邀請國家加入捷克斯洛伐克聯盟§!"
 CZE_integrate_nation_tt: "$CZE_decision_unlock$§Y整合國家§!"
