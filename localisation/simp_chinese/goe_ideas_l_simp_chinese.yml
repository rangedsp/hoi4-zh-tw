 PER_anglo_iranian_oil_ns: "英伊石油公司"
 PER_anglo_iranian_oil_ns_desc: "當時在馬斯吉德蘇萊曼發現了大量石油資源後，公司於1909年由[ENG.GetNameDef]成立，原名為英波石油公司。然而，[PER.GetNameDefCap]的許多人認為，這家公司正在榨取我國的資源和勞動力，同時卻沒有兌現其當初承諾的諸多義務。"
 PER_rural_feudalism_ns: "農村封建制度"
 PER_rural_feudalism_ns_desc: "封建制度是一種過時的社會結構，它以土地佔有換取服務和勞動力為基礎。儘管它是中世紀的概念，但仍在[PER.GetNameDef]的許多農村地區發揮作用。"
 PER_lingering_islamic_beliefs: "經久不衰的伊斯蘭信仰"
 PER_islamic_traditions_ns: "伊斯蘭傳統"
 PER_islamic_traditions_ns_desc: "在傳統上，伊朗世代信奉伊斯蘭教。伊斯蘭教是國教，也是多數宗教。政府中有人試圖將宗教和國家世俗化，然而這麼做阻力重重，註定會是一項艱鉅的任務。"
 PER_secularized_state_idea: "世俗化國家"
 PER_secularized_state_idea_desc: "在巴列維王朝時期，沙阿認定要與世界上的其他大國並列，[PER.GetNameDef]就必須現代化，而要想現代化，宗教與國家就必須分離。民眾仍然可以信奉伊斯蘭教，但它將不再影響國家的政策。"
 PER_secularized_state_democratic_idea: "世俗化國家"
 PER_unification_initiative_idea: "國家統一計劃"
 PER_unification_initiative_idea_desc: "眾所周知，我們的國家尚未完全統一。我們不僅面臨庫爾德人和阿塞拜疆人的潛在叛亂，甚至在政府內部也存在威脅。國家統一計劃旨在徹底消除這些威脅，鞏固我們對[PER.GetNameDef]的統治地位。"
 PER_azerbaijan_resistance_idea: "阿塞拜疆抵抗組織"
 PER_azerbaijan_resistance_idea_desc: "[PER.GetNameDefCap]的部分領土曾屬於阿塞拜疆人。因此，當地有大量對我們的統治不滿的阿塞拜疆人。在過去幾年間，我們的政府鎮壓了[PER.GetNameDef]該地區的一些叛亂，但反抗情緒仍然存在。"
 PER_kurdistan_resistance_idea: "庫爾德抵抗組織"
 PER_kurdistan_resistance_idea_desc: "[PER.GetNameDefCap]的部分領土曾屬於庫爾德人。因此，當地有大量對我們的統治不滿的庫爾德人。在過去幾年間，我們的政府鎮壓了[PER.GetNameDef]該地區的一些叛亂，但反抗情緒仍然存在。"
 ############################
 #### INDUSTRIAL SPIRITS ####
 ############################
 PER_modernizing_iran_idea: "現代化倡議"
 PER_modernizing_iran_idea_desc: "[PER.GetNameDef]想要與世界上的強國並列，現代化是至關重要的。該倡議將表明我們改善國家基礎設施，承諾提高公民生活水平的決心。"
 PER_a_modern_iran_idea: "現代化的伊朗"
 PER_a_modern_iran_idea_desc: "經過大量投入和努力，我們終於實現了將[PER.GetName]建設為現代化國家的目標。"
 PER_adult_literacy_idea: "成人掃盲運動"
 PER_adult_literacy_idea_desc: "能夠以自己的語言讀寫是民眾能感受到被解放和賦予權力的最關鍵方式之一。在投資了一項全國性成人再教育運動之後，我們在未來一段時間將可以看到[PER.GetNameDef]發展的提高。"
 PER_trans_iranian_railway_idea: "建造伊朗縱貫鐵路"
 PER_trans_iranian_railway_idea_desc: "伊朗縱貫鐵路有望成為我國工程領域最偉大的成就之一。通過集中精力建設這條國內鐵路，我們在戰爭期間的動員效率將大大提高。"
 PER_feat_of_engineering_idea: "工程壯舉"
 PER_feat_of_engineering_idea_desc: "終於，我們完成了伊朗縱貫鐵路。這條至關重要的生命線蜿蜒穿過崎嶇的地形，將我們的城市聯繫在一起。我們應該為[PER.GetAdjective]工廠的榜樣感到自豪。"
 PER_white_revolution_idea: "啟動白色革命"
 PER_white_revolution_idea_desc: "為了加速國家現代化，必須進行激進改革。白色革命，或稱沙阿與人民革命，將使[PER.GetNameDef]躋身西方偉大國家之列。"
 PER_price_stabilization_idea: "價格穩定"
 PER_price_stabilization_idea_desc: "長期以來，工廠和大型連鎖企業的所有者一直在不合理地從工人和顧客那裡牟取暴利。我們應該努力穩定[PER.GetNameDef]全國的物價。"
 PER_food_for_all_idea: "[PER.GetAdjective]人溫飽計劃"
 PER_food_for_all_idea_desc: "饑荒長期困擾著我們的國家。如今，我們已經啟動了一項新的計劃，確保所有公民都能獲得基本的食物供應，從而徹底消除飢餓的陰影。"
 PER_tehran_power_grid_idea: "德黑蘭電網擴建"
 PER_tehran_power_grid_idea_desc: "我們在德黑蘭新建成了一批發電廠，持續推動國家現代化進程，提高全國的電力覆蓋率。"
 PER_metropolitan_iran_idea: "[PER.GetAdjective]的現代都市"
 PER_metropolitan_iran_idea_desc: "我們成功地將[PER.GetAdjective]的現代都市的範圍擴展到了德黑蘭之外。由於我們努力發展現代化，城市蓬勃發展、經濟繁榮。這無疑是值得慶祝的偉大成就！"
 PER_oil_baron_idea: "[PER.GetAdjective]石油大亨"
 PER_oil_baron_idea_desc: "我們的國家絕對是在石油中游泳，特別是在成功擺脫[ENG.GetAdjective]對我們資源的控制後。我們該如何利用這筆財富？把它留給自己吧。"
 ##########################
 #### MILITARY SPIRITS ####
 ##########################
 PER_future_of_war_idea: "戰爭的未來"
 PER_future_of_war_idea_desc: "坦克無疑已經成為現代戰爭的象徵。集中資源發展裝甲技術，我們為參與現代戰爭做好了萬全準備。"
 PER_military_excellency_idea: "[PER.GetAdjective]的卓越軍事"
 PER_military_excellency_idea_desc: "我們最終決定採取嚴格且專業的訓練方法，以提高軍隊的素質。在戰場上，訓練有素的士兵將比數量龐大的烏合之眾更具優勢。質量勝於數量！"
 PER_foreign_retraining_idea: "外國再培訓計劃"
 PER_foreign_retraining_idea_desc: "通過聯繫外國軍官前來訓練我們的部隊，我們在改善訓練不足、組織混亂的軍隊上邁出了第一步。"
 PER_motorization_investments_idea: "摩托化投資"
 PER_motorization_investments_idea_desc: "當我們的部隊飛速跨越戰場時，我們為發展摩托武器工業所做的投資將得到回報。"
 PER_desert_training_idea: "特化沙漠訓練"
 PER_desert_training_idea_desc: "經過多次長期演習和沙漠行軍，我們最終制定了高效的訓練計劃，旨在讓我們的部隊在沙漠戰場上獲得更好的生存機會。"
 PER_conscription_idea: "全民服役"
 PER_conscription_idea_desc: "絕望之時需要絕望之舉。雖然我們不能將時間和資源都用於建立一支全職業軍隊，但我們可以確保每個有能力的人都拿起武器保家衛國。"
 PER_special_units_division_idea: "特種部隊"
 PER_special_units_division_idea_desc: "我們的軍隊現在增加了一個特種部隊。這不僅使我們的軍事力量得以擴展，還為未來建立間諜機構鋪平了道路。"
 PER_savak_idea_no_lar: "建立薩瓦克"
 PER_savak_idea_no_lar_desc: "薩瓦克是服務於[PER.GetNameDef]的特工與秘密警察。我們的官員受到徽標上波斯之獅的鼓舞，不知疲倦地工作，以確保我們偉大國家的安全。"
 PER_savak_lar: "$PER_savak_idea_no_lar$"
 PER_savak_lar_desc: "$PER_savak_idea_no_lar_desc$"
 PER_fund_state_intelligence_idea: "撥款給國家情報機構"
 PER_fund_state_intellignece_idea_desc: "為了提升我們監控國家安全的能力，我們投入了大量資源，以加強對國家情報機構的掌控。"
 PER_transfer_officer_idea_lar: "把軍官調入情報部門"
 PER_transfer_officer_idea_lar_desc: "隨著我們的情報機構的發展，我們發現有必要將一些新軍官調入其中。這樣做提高了該部門的效率，將確保我們國家的安全。"
 PER_transfer_officer_idea_no_lar: "$PER_transfer_officer_idea_lar$"
 PER_transfer_officer_idea_no_lar_desc: "$PER_transfer_officer_idea_lar_desc$"
 PER_airforce_modifier: "伊朗空軍"
 PER_airforce_modifier_desc: "伊朗空軍從未成為我們的首要任務，然而現在是時候投入時間和資源，完善我們的空軍部隊並訓練飛行員了。我們將向世界展示，我們在天空中同樣能夠掌控一切。"
 PER_coastal_fortifications_idea: "岸防計劃"
 PER_coastal_fortifications_idea_desc: "我們的海軍一直以來並非最強項，因此，為了防止[PER.GetNameDef]遭受海上入侵，我們必須實施岸防計劃，確保在任何衝突期間都能保障海岸線的安全。"
 PER_state_local_defensive_dynamic_modifier: "本土防禦措施"
 ###################################
 #### IMPERIAL NATIONAL SPIRITS ####
 ###################################
 PER_legacy_of_greatness_modifier: "偉業的遺產"
 PER_legacy_of_greatness_modifier_desc: "巴列維王朝將自己塑造為了註定將帶領[PER.GetNameDef]走向偉大的皇族。雖然他們的改革不受一些人歡迎，但毫無疑問，他們給這個國家帶來的根本性變化將影響世界其他國家今後對我們的看法。"
 PER_state_atheism_idea: "完全世俗化"
 PER_state_atheism_idea_desc: "我們的最終目標是仿效西方國家，推動[PER.GetNameDef]的現代化。我們不能再讓自己被宗教所束縛。雖然這或許會激起國內神職人員的不滿，但在公民中推行無神論符合[PER.GetNameDef]的利益。"
 PER_venerated_islam_idea: "尊崇伊斯蘭"
 PER_venerated_islam_idea_desc: "儘管我們最初主張政教分離，但我們不能再忽視人民的意願。伊斯蘭教長期以來一直是[PER.GetAdjective]文化的重要組成部分，我們若拋棄這些傳統，將是愚蠢之極。"
 PER_old_ways_idea: "復興祆教"
 PER_old_ways_idea_desc: "祆教是世界上最古老的一神教之一，創立於公元前6世紀的古波斯。鑑於該宗教對古波斯帝國文化的重要性，我們復興了這一宗教，希望它能重現我們過去的輝煌。"
 PER_imperial_expansionism_idea: "帝國擴張主義"
 PER_imperial_expansionism_idea_desc: "是時候向世界展示[PER.GetNameDef]的能力了。我們已啟動生產線，徵召了民眾。很快，我們將為了榮耀而戰！"
 PER_war_plan_darius_idea: "大流士戰爭計劃"
 PER_war_plan_darius_idea_desc: "大流士大帝是阿契美尼德帝國的第三位萬王之王。他將波斯的影響力擴展到印度河谷，今天的巴基斯坦，使波斯帝國的版圖達到了巔峰。讓我們高舉他的擴張理念，向東方的敵人推進！"
 PER_paying_for_baluchistan_idea: "購買俾路支斯坦"
 PER_paying_for_baluchistan_idea_desc: "很遺憾[RAJ.GetNameDef]不願白白交出這塊領土。我們將不得不償清一年的債務。"
 PER_sold_baluchistan_idea: "出售俾路支斯坦"
 PER_sold_baluchistan_idea_desc: "當[PER.GetNameDef]索要俾路支斯坦的土地時，我們從他們那裡榨出了一些錢財。我們將獲得大約一年的款項。"
 PER_war_plan_xerxes_idea: "薛西斯戰爭計劃"
 PER_war_plan_xerxes_idea_desc: "薛西斯大帝是阿契美尼德帝國的第四位萬王之王。他最出名的事蹟是公元前480年入侵希臘，雖然最終以失敗告終。而這次，我們將成為勝利的一方。讓我們進軍愛琴海，奪取土耳其半島。"
 PER_war_plan_cambyses_idea: "岡比西斯戰爭計劃"
 PER_war_plan_cambyses_idea_desc: "岡比西斯二世是阿契美尼德帝國的第二位萬王之王。他於公元前530年繼位，並在統治期間征服了北非，尤其是埃及，在那裡成為了埃及法老。我們必須追隨他的腳步，向西進軍，收復他曾經的領土。"
 PER_persepolis_idea: "重建波斯波利斯"
 PER_persepolis_idea_desc: "為了展現我們新帝國的實力，我們成功重建了阿契美尼德帝國的禮儀首都。波斯波利斯將永遠成為[PER.GetAdjective]優越性的象徵。"
 PER_celebration_idea: "慶典後的繁榮"
 PER_celebration_idea_desc: "對古波斯帝國的慶祝活動取得了巨大的成功，因此，我們的國家迎來了大幅度的經濟繁榮。藉助新建立的友好關係所帶來的旅遊業和貿易增長，我們將在未來一年內享受這場奢華慶典所帶來的經濟紅利。"
 PER_spoils_of_war_idea: "戰利品"
 PER_spoils_of_war_idea_desc: "我們成功援助盟友並贏得戰爭後，得以保護我們自己的領土。現在，是時候將這些土地納入我們的勢力範圍，並加以鞏固。"
 PER_rapid_appeasement_idea: "迅速安撫"
 PER_rapid_appeasement_idea_desc: "為了遏制可能爆發的伊斯蘭革命，我們提供了賠償以安撫反對派。此舉雖然有助於維持國家短期穩定，但同時也會減緩我們的發展進程。"
 PER_opposition_modifier: "反對派激增"
 PER_opposition_modifier_desc: "對巴列維政權的不滿情緒日益加劇，越來越多的人加入反政府的行列。如果這種局勢繼續蔓延，那麼這個國家可能會面臨一個不穩定的未來。"
 PER_technological_modifier: "技術投資"
 PER_constitutional_shah: "禮薩·沙·巴列維"
 PER_constitutional_shah_desc: "作為[PER.GetNameDef]的驚人變革的代言人，禮薩·沙阿·巴列維如今已被降到憲政君主的地位。他此時只是一個名義上的元首，國家實權已由新政權掌握。"
 PER_aid_communists_cw: "國際團結"
 PER_aid_communists_cw_desc: "既然我們已擺脫了帝國主義的束縛，就必須準備好援助仍處於殖民枷鎖下的其他國家。"
 PER_communist_industrialization_idea: "快速工業化"
 PER_communist_industrialization_idea_desc: "要想經受得住時間的考驗，我們的新社會主義政府就必須快速工業化。畢竟，對於那些害怕無產階級崛起的人來說，我們現在很可能已經成為一種威脅。"
 PER_iranian_radio_idea: "伊朗國家廣播電臺"
 PER_iranian_radio_idea_desc: "我們的國家無線電廣播體系將有助於在公眾看法不一致的問題上統一立場。"
 PER_the_new_economy_idea: "新經濟"
 PER_the_new_economy_idea_desc: "我們的新經濟是建立在人民需求上，而不是追隨市場趨勢。畢竟，我們希望避免資本主義對工人階級造成的損害。"
 KUR_resistance_modifier: "庫爾德抵抗組織"
 KUR_resistance_modifier_desc: "儘管我們盡了全力，我國境內的庫爾德人還是變得焦躁憤怒。雖然緩慢，但可以肯定的是，他們正開始反抗我們。"
 PER_resistance_modifier: "抵抗組織"
 PER_resistance_modifier_desc: "這個地區受到由[PER.GetNameDef]策劃的反對組織的困擾。"
 PER_promoting_resistance_here: "在此地促進抵抗運動"
 PER_gulf_hegemony_idea: "海灣霸權"
 PER_gulf_hegemony_idea_desc: "通過精心謀劃，我們終於確立了自己作為海灣地區主要勢力的地位。"
 PER_restoring_the_nation_idea: "復興國家"
 PER_restoring_the_nation_idea_desc: "政府重組在國內製造了不穩和分歧，我們必須先恢復國家的穩定和團結，才能繼續推進我們的計劃。"
 PER_fascism_sway_the_rich_idea: "拉攏精英"
 PER_fascism_sway_the_rich_idea_desc: "要想穩固新政府，我們需要掌控國家，要想掌控國家，我們需要說服儘可能多的伊朗精英支持我們。"
 PER_invite_foreign_investors: "外國投資"
 PER_invite_foreign_investors_desc: "我們可以與世界上其他民主國家接觸，為我們蓬勃發展的經濟注入資源。"
 PER_resist_gharbzadegi_idea: "抵制西方毒化"
 PER_resist_gharbzadegi_idea_desc: "過度西化是我們偉大國家的一大禍患。我們不應該迎合殖民者的幻想，而應該努力建立一個足以獨立維繫的民主國家。"
 PER_clash_of_titans_idea: "泰坦之爭"
 #####################################
 #### HISTORICAL NATIONAL SPIRITS ####
 #####################################
 PER_stand_with_giants_modifier: "與巨人比肩"
 PER_stand_with_giants_modifier_desc: "自從登上權力巔峰以來，禮薩·沙阿·巴列維始終致力於推動[PER.GetNameDef]的現代化，使其與世界列強比肩而立。在[PER.GetNameDef]，一系列社會、經濟和政治改革的序幕已經拉開，並將隨著我們的進步而不斷深化。"
 PER_persian_german_trade_idea: "波斯-德意志貿易商會"
 PER_persian_german_trade_idea_desc: "該組織旨在促進[PER.GetNameDef]與[GER.GetNameDef]之間的積極貿易關係，同時借鑑世界領先工業強國的模式，持續推進我國工業現代化。"
 PER_trial_fifty_three_idea: "實施對五十三人的審判"
 PER_trial_fifty_three_idea_desc: "在逮捕了53名參與共產主義政治活動的伊朗人後，我們得以以反政府為由審判他們。決不能允許這種異議思想在如此關鍵的時刻在我國紮根。"
 PER_homeland_not_fall_idea: "我們的戰鬥精神"
 PER_homeland_not_fall_idea_desc: "現在是時候證明我們的決心，並堅定地抵抗那些威脅我們家園的敵人了。召集軍隊，相信你的戰友，準備為國家的未來而戰！[PER.GetNameDefCap]絕不會向這些侵略者屈服！讓他們夾著尾巴逃跑吧！"
 PER_preemtive_strike_idea: "先下手為強"
 PER_preemtive_strike_idea_desc: "我們沒有時間空等被入侵！我們要趁熱打鐵，確保能在我們和敢於威脅我們主權的大國之間建立一些緩衝區，這至關重要！"
 PER_compliant_subject_idea: "順從的附屬國"
 PER_compliant_subject_idea_desc: "在[ROOT.OVERLORD.GetNameDef]這樣的強權面前，抵抗毫無勝算。相反，我們必須履行作為附庸國的職責，並證明我們有能力成為一個強大屬國。"
 PER_anti_soviet_idea: "反蘇情緒"
 PER_anti_soviet_idea_desc: "在伊朗戰爭期間，我們的領土被敵人奪走，如今，是時候讓這些戰爭販子付出代價，並奪回我們失去的一切了！我們絕不止步，直至故土重歸！"
 PER_azadi_idea: "阿扎迪精神"
 PER_azadi_idea_desc: "阿扎迪，波斯語中的“自由”，將成為我們對佔領者反抗的戰鬥口號。我們不會屈服於他們的意志，而是為了自由而戰，無論需要多久。"
 PER_offensive_tactics_modifier: "進攻戰術"
 PER_offensive_tactics_modifier_desc: "保護[PER.GetNameDef]的唯一方法就是立即發動進攻。實施這些新戰術後，我們將在與敵人的對抗中佔據優勢！"
 PER_defensive_maneuvers_modifier: "防禦策略"
 PER_defensive_maneuvers_modifier_desc: "若想遏制敵人對城市的威脅，我們的防禦必須如山峰一般堅不可摧。我們新實施的防禦策略有望將敵軍阻攔在外！"
 PER_enemy_war_reparations_idea: "戰爭賠款"
 PER_enemy_war_reparations_idea_desc: "由於在[PER.GetNameDef]的軍事行動失敗，我們現在必須付出巨大的代價。儘管並不理想，但我們應該能在兩年內完成賠款。"
 PER_opposition_cell: "反對組織活躍"
 #misc
 PER_idea_comintern_research_collaboration: "[ROOT.GetFactionName]科研合作"
 PER_idea_comintern_research_collaboration_desc: "[ROOT.GetAdjective]的科學家將由頂尖的[SOU.GetAdjective]專家親自授課，隨後將所學帶回國內，依照[SOU.GetAdjective]的模式重建我們的國家。"
 PER_idea_one_for_all_all_for_one: "我為人人，人人為我"
 PER_idea_one_for_all_all_for_one_desc: "我們必須不遺餘力，確保每一位[ROOT.GetAdjective]公民隨時準備保衛[ROOT.GetNameDefCap]。唯有如此，我們才能在“帝國博弈”後保有對抗世界強權的希望，維護我們的主權與身份認同。"
 PER_idea_reject_foreign_dominance: "[ROOT.GetAdjective]的團結"
 PER_idea_reject_foreign_dominance_desc: "在外部強權虎視眈眈之際，我們不會屈服。我們將堅守陣地，戰鬥到底。[ROOT.GetAdjective]的主權與認同將不惜一切代價生存下去。"
