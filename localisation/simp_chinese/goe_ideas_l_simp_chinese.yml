 SSB_saadabad_pact: "薩德阿巴德條約"
 SSB_saadabad_pact_desc: "與中東其他國家的一項互不侵犯條約，此條約可能為未來更深層次、更強有力的合作奠定基礎。\n\n§R對任何薩德阿巴德條約成員國發動進攻性戰爭將永久失去該民族精神§!"
 SSB_saadabad_trade_agreement: "薩德阿巴德貿易協定"
 SSB_saadabad_trade_agreement_desc: "原薩德阿巴德條約簽署國之間的互惠貿易協定，該協定促進進一步合作與經濟一體化，取消所有關稅，並整合資源。"


