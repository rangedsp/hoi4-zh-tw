l_simp_chinese:
 AFG_mohammad_zahir_shah_ns: "查希爾·沙阿國王"
 AFG_mohammad_zahir_shah_ns_desc: "1933年，查希爾·沙阿國王在其父親去世後繼位。然而，由於他年紀輕輕且缺乏自己的政治基礎，政府大權實際由國王的叔叔掌控，他只不過是一個傀儡。如果查希爾·沙阿想要實現自己的目標，他將不得不決定是等待時機，還是迅速將叔叔趕下臺。"
 AFG_mohammad_zahir_shah_ns_upgrade_1: "$AFG_mohammad_zahir_shah_ns$"
 AFG_mohammad_zahir_shah_ns_upgrade_1_desc: "$AFG_mohammad_zahir_shah_ns_desc$"
