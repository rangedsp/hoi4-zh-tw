 idea_RAJ_the_long_goodbye_desc: "終於，英國同意撤離。不過在此之前，他們必須理清官僚主義，收拾行囊，最終完成他們遲來的退出。"
 idea_RAJ_flames_of_the_revolution: "革命之火"
 idea_RAJ_flames_of_the_revolution_desc: "舊秩序已在自身腐朽的重壓下崩塌。一座新的印度從殖民統治的灰燼中崛起，它並非誕生於宮殿與議會，而是在田野、工廠和革命的烈焰中鑄就。然而，階級鬥爭的餘燼依舊熾熱……並非所有加入革命隊伍的人都是出於自願。"
