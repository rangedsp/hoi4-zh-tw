 IRQ_golden_square: "金方陣"
 IRQ_golden_square_desc: "金方陣，這個由一群伊拉克高級軍官組成的利益集團，至今仍在威脅著這個國家的穩定。他們共情並應援歐洲的那些反英國家政權，同時還寄希望於這些國家能夠在適當的時機，對伊拉克擺脫英國的影響施以援手。"
