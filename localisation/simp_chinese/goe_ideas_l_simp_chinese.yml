 RAJ_a_loyal_government: "忠誠的政府"
 RAJ_a_loyal_government_desc: "儘管[RAJ.GetNameDef]內部存在要求獨立的不同政見聲音，但我們的政府依然保持強大而穩定。我們將繼續以紀律和決心維護帝國當局的利益。"
 RAJ_high_import_duties: "高進口關稅"
 RAJ_high_import_duties_desc: "我們已制定一項新政策，旨在保護本地產業並維持[RAJ.GetNameDef]的經濟產出。通過提高外國商品的進口關稅，我們將確保[RAJ.GetNameDef]在國際經濟舞臺中自給自足。"
 RAJ_the_zamindari_system: "柴明達爾制"
 RAJ_the_zamindari_system_desc: "通過推行柴明達爾制，我們授權效忠的地主維持國家農村地區的秩序，從而確保了行政效率。"
 RAJ_exports_for_the_empire: "印度向帝國出口"
 RAJ_exports_for_the_empire_desc: "幾個世紀以來，殖民地貿易始終是[ENG.GetAdjective]帝國的支柱，[RAJ.GetNameDef]的出口貿易也不例外。通過優先種植茶葉、棉花和黃麻等主要作物，我們為自己和帝國確保了穩定的收入來源。"
 RAJ_war_industry: "戰爭工業"
 RAJ_war_industry_dec: "憑藉堅定的意志和不懈的決心，我們必須加大對軍工產業的資金投入來支持戰爭。我們的人民將以勇氣、汗水和鋼鐵般的意志鑄成勝利。"
