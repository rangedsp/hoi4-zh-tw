 AFG_subsistence_economy_modifier: "經濟自足"
 AFG_subsistence_economy_modifier_desc: "我國大部分人口過著農村生活，生產的糧食僅夠他們自己和家人度過嚴酷的冬季。他們無意改變自己的生活方式以適應盈利型工業的不斷發展，而且無論誰在喀布爾掌權，他們都不太可能改變這種心態。"
 AFG_pashtunwali: "普什圖瓦里"
 AFG_pashtunwali_desc: "普什圖族是人口數量最多、政治影響力最大的族群。相當一部分普什圖族人遵守傳統道德準則，即“普什圖瓦里”。當政府似乎與傳統準則相悖時，政府便很難維持權力，更不用說進行改革了。"
 AFG_concessions_pashtunwali: "普什圖民主主義"
 AFG_economic_regionalism: "地方分權經濟"
 AFG_economic_regionalism_desc: "由於缺乏適當的基礎設施，阿富汗各地區與中央政府、地方經濟與全國經濟之間缺乏有力的聯繫。這使得各地區難以與外界分擔經濟負擔或共享經濟收益，並導致各地區持續受到孤立。"
 AFG_turkish_military_mission: "土耳其軍事顧問團"
 AFG_turkish_military_mission_desc: "自1933年以來，土耳其軍事人員一直在協助教導下一代阿富汗士兵。也許假以時日，這種安排可以擴大化，使我們兩個偉大的國家更加緊密地團結在一起。"
