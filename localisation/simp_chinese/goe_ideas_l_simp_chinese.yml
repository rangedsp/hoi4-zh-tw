 IRQ_golden_square_strong_desc: "$IRQ_golden_square_desc$"
 IRQ_anglo_iraqi_treaty: "英伊條約"
 IRQ_anglo_iraqi_treaty_desc: "儘管英伊條約在1930年進行了重新談判，但它仍然是一項單方面的協議，使伊拉克實際上成為大英帝國的附庸國。該條約賦予英國優先開採伊拉克石油的權利，並允許他們使用伊拉克全國範圍的軍事設施。這一狀況持續引發伊拉克人民的不滿，他們渴望真正的獨立。任何上臺執政的政府都必須決定是再次就該條約開啟重新談判，還是冒著激怒英國軍方的風險撕毀條約。"
 IRQ_agrarian_society: "農耕社會"
 IRQ_agrarian_society_desc: "伊拉克的產業仍然以農業為中心，而該區域的保守派領導層對開發和工業化土地毫無興趣。要解決該國的經濟發展問題，必須投入大量時間和精力。"
