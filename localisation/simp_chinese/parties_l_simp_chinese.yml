 emperor_fascism: "皇道法西斯主義"
 emperor_fascism_desc: "皇道法西斯主義是一種極端的民族主義意識形態，由於其權力自上而下地施加於國民，因此又被稱為“上位法西斯主義”。在該意識形態下，政權由軍方與貴族出身的官僚掌控，平民無從置喙，而國家則以該國君主為絕對核心，奉其為無謬的神聖存在，至高無上、不可違逆。"
 japan_militarism_ideology: "軍國主義"
 japan_militarism_ideology_desc: "軍國主義是一種國家元首隻擁有名義上統治權的意識形態，在這種意識形態下，國家元首更像是本國軍方的傀儡，而非獨立的政治家。這種政權主張不斷推進其戰略，以實現快速擴張的最終目標。"
 buddhist_socialism: "佛教社會主義"
 buddhist_socialism_desc: "佛教社會主義，也被稱為法性社會主義或自然社會主義，是一種主張依據佛教原理實行社會主義的政治理念。佛教和社會主義都試圖通過分析苦難的成因並通過實踐消除其主要根源，從而終結人類的苦難。兩者都追求實現個人意識的轉變，以消除人類異化與自私本性。"
