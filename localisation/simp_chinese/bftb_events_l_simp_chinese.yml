l_simp_chinese:
 bftb_greece.1.t: "君主派勝選！"
 bftb_greece.1.desc: "對於希臘民眾而言，忠於喬治二世國王的保守派贏得1936年的希臘大選並不令人意外。首相康斯坦丁諾斯·德米列切斯預計將會留任，而國王則表示，他個人相信德默齊斯的首相生涯將會是漫長且成功的。眼下，只有時間才能證明國王的判斷正確與否……"
 bftb_greece.1.a: "屬於希臘的偉大勝利……"
 bftb_greece.2.t: "韋尼澤洛斯黨勝選！"
 bftb_greece.2.desc: "希臘人民在今天湧向街頭，熱烈慶祝軍方承諾將確保君主派不會干涉選舉結果。韋尼澤洛斯黨人眼下已從海外流放當中歸來，並且獲得授權組建新政府；但即便如此，他們仍舊需要在如何團結這個分裂國度的問題上有一場苦戰，更毋寧說國民也還尚未忘記韋尼澤洛斯黨人曾在1919年將這個國家拖向了災難性的戰爭當中。除此之外，如何處置受控下的希臘君主也仍舊需要商榷——無論如何，希臘的未來值得加以關注……"
 bftb_greece.2.a: "終於，我們榮歸祖國！"
 GRE_republican_victory_tt: "£faction_gre_monarchist §Y君主派§!變為§Y中立§!。\n£faction_gre_communist §Y共產派§!變為§Y中立§!。"
 bftb_greece.3.t: "安納托利亞裔法西斯團體"
 bftb_greece.3.desc: "希臘國內自詡為法西斯運動的黨團為適應國內政局現狀，已經發生了演變。那些從土耳其流亡而來，飽嘗艱辛及不滿的希臘難民，如今正成群結隊地聚集在喬治·科斯米迪斯領導下的新激進政治運動團體旗下，後者同樣也是一位被迫背井離鄉的流亡希臘人。\n\n科斯米迪斯是一位偉大理想的竭力鼓吹者，堅定不移地聲索淪喪於[TUR.GetNameDef]的歷史領土，但是他的主張或許比政府裡其他的韋尼澤洛斯黨人還要激進得多。有報告顯示，科斯米迪斯的夙願不僅是要將[ROOT.GetNameDef]國境推進至愛琴海彼岸，他甚至還志在將疆域擴展至整個安納托利亞。但無論如何，這些報告應該是小題大做了——要怎樣的瘋子才會膽敢宣稱整個[TUR.GetNameDef]全境呢？"
 bftb_greece.3.a: "區區暴徒，豈能有人追隨！？"
 GRE_anatolian_fascists_in_play_tt: "£faction_gre_fascist §Y法西斯派§!出現並且初始關係為§R敵對§!。"
 GRE_republican_monarchist_alliance_tt: "君主派的將領和閣僚將會繼續在共和派韋尼澤洛斯黨的政府中可用。\n£faction_gre_monarchist §Y君主派§!變為§G友善§!。\n£faction_gre_communist §Y共產派§!變為§R敵對§!。"
 bftb_greece.6.t: "與希臘國民聯盟妥協"
 bftb_greece.6.desc: "自其歹毒的政治運動孽生以來，卑鄙的安納托利亞裔法西斯分子就在不斷製造混亂，致使政府對其束手無策。不過這一情況似乎有了轉機。我們收到了一份可以說是世紀交易的提案——與安納托利亞裔法西斯分子攜手邁向我們打倒[TUR.GetNameDef]的共同目標。\n\n誠然，就算只是為了讓希臘國民聯盟停止反政府活動，政府中的許多同僚也樂於同這些魔鬼達成這項交易。同樣現實的是，公務員中的某些毒瘤也認同甚至是讚賞希臘國民聯盟的主張。幸好資本巨頭亞里士多德·奧納西斯為我們提供了一個替代方案：同樣身為安納托利亞裔的他可以利用其名望、商業頭腦及個人財富組建反制運動，以此動搖希臘國民聯盟的支持根基。儘管這項行動無法保證粉碎希臘國民聯盟，但我們有足夠證據表明奧納西斯有能力遏制他們的活動，只要我們請他出手。"
 bftb_greece.6.a: "舊日幽魂將不再糾纏我們。"
 bftb_greece.6.b: "對法西斯害蟲絕無妥協可言。"
 GRE_ally_the_anatolian_fascists_tt: "£faction_gre_fascist §Y法西斯派§!變為§G友善§!！\n與§Y希臘國民聯盟§!的合作將在§Y伊拉克利翁會議§!召開時產生§R嚴重影響§!。"
 GRE_ally_onassis_tt: "§Y亞里士多德·奧納西斯§!將成為部長。\n£faction_gre_fascist §Y法西斯派§!將繼續保持§Y敵對§!。"
 GRE_increased_influence_tt: "這將提高我們對§Y[FROM.GetAdjective]§!政府的影響力。"
 bftb_greece.7.t: "伊拉克利翁會議"
 bftb_greece.7.desc: "如今，重新與歐洲列強就此前簽署的色佛爾條約和洛桑條約展開協商，並且重拾偉大理想的時刻終於到來。[TUR.GetNameDef]的最終命運顯然不能由我國自主定奪，而若是想要邀請[ENG.GetNameDef]、[FRA.GetNameDef]或者還有卑鄙無恥的[ITA.GetNameDef]前來與會討論此事的話，我們必須首先向他們展露我國的誠意。"
 bftb_greece.7.a: "我們應該邀請[FRA.GetAdjective]和[ENG.GetAdjective]代表團。"
 bftb_greece.7.b: "我們應該邀請色佛爾條約的所有締約國。"
 bftb_greece.8.t: "伊拉克利翁會議之邀"
 bftb_greece.8.desc: "我們剛剛收到來自[FROM.GetNameDef]的有趣議案，顯然後者有意重新劃定[TUR.GetNameDef]的疆界。根據來函，[FROM.GetNameDef]希望能與上次大戰的歐洲戰勝諸國舉行會議，重修我等曾試圖施加給[TUR.GetNameDef]的色佛爾條約及洛桑條約。\n\n[FROM.GetNameDef]的官員向我方承諾，我國屆時可從戰敗的[TUR.GetNameDef]手中攫取實際利益，同時，[FROM.GetAdjective]政府也不希望[TUR.GetNameDef]經此一役被徹底毀滅。換言之，[FROM.GetNameDef]有關人士再三強調，這不過是一次重新議定邊界的尋常峰會，而不是將收復失地的理想付諸現實。"
 bftb_greece.8.a: "附議，我們將欣然赴約。"
 bftb_greece.8.b: "你們是在破壞地中海均勢！"
 potential_war_with_turkey_tt: "§R如果我國應邀赴會，那麼很有可能將在不久後因領土劃分問題而捲入對[TUR.GetNameDef]的戰爭§!。"
 bftb_greece.9.t: "僅有[ENG.GetNameDef]應邀赴會"
 bftb_greece.9.desc: "重新勘定[TUR.GetNameDef]疆界的伊拉克利翁會議的邀請函，現已發送至所有我們想要邀請的國家。儘管我們希望各國都能前來，但最終只有[ENG.GetNameDef]表示應邀赴會。不過即便如此，鑑於我國與[ENG.GetNameDef]向來關係深厚，我國許多官員還是信心滿滿，認為伊拉克利翁會議將以實現兩國共贏的結局圓滿收場。"
 bftb_greece.9.a: "[ENG.GetAdjective]的朋友始終值得信賴！"
 bftb_greece.10.t: "僅有[FRA.GetNameDef]應邀赴會"
 bftb_greece.10.desc: "重新勘定[TUR.GetNameDef]疆界的伊拉克利翁會議的邀請函，現已發送至所有我們想要邀請的國家。儘管我們希望各國都能前來，但最終只有[FRA.GetNameDef]表示應邀赴會。“沮喪”或許是[ROOT.GetAdjective]官員此刻心情最好的形容詞，在只有[FRA.GetAdjective]與會的情況下，我國政治精英和軍事專家都對會議是否還能達成預想結果持悲觀態度，但事已至此，我們必須繼續致力於既定計劃。"
 bftb_greece.10.a: "只有[FRA.GetAdjective]赴會？唉，就這樣吧……"
 bftb_greece.11.t: "僅有[ITA.GetNameDef]應邀赴會"
 bftb_greece.11.desc: "我國官員沮喪地彙報了令人糟心的消息，在決定[TUR.GetNameDef]國運的伊拉克利翁會議上，目前只有[ITA.GetNameDef]表示有興趣赴會，鑑於後者狼子野心難測，唯今可行之計或許只有徹底取消會議。但即便如此，我等亦無法輕率決策，畢竟諸多韋尼澤洛斯黨人心知肚明，由於政權的合法性全部押寶在對1922年災難的復仇上，眼下的態勢可以說已經使局面陷入了生死存亡的絕境。\n\n在大量關於此事的偏頗報道不脛而走後，[ROOT.GetAdjective]人民已對消息匱乏的現狀愈發不滿。而希臘國民聯盟更是野心勃勃地利用了民眾的怒火，猛烈抨擊政府行事懦弱且無法兌現承諾。事態發展至此，[ROOT.GetLeader]要怎樣才能帶領我們掙脫這片泥沼呢？"
 bftb_greece.11.a: "如此下去斷無好事，會議必須取消。"
 bftb_greece.12.t: "[ENG.GetNameDefCap]和[FRA.GetNameDef]應邀赴會"
 bftb_greece.12.desc: "在聽聞[ENG.GetNameDef]和[FRA.GetNameDef]都將派遣代表團出席伊拉克利翁會議的消息後，齊聚在首都的官員們都很振奮。眼下會議的籌備工作已趨近完成，預計將在數日內正式召開。\n\n在最終裁定我國是否有權收復愛琴海沿岸的法理領土前，我國代表將共同參與到對[TUR.GetName]南北疆域的勢力範圍劃分議程當中，世界歷史的嶄新篇章正呼之欲出，而[ROOT.GetNameDef]將成為當下歷史舞臺的中心。"
 bftb_greece.12.a: "[ROOT.GetAdjective]將著手重塑世界。"
 bftb_greece.13.t: "色佛爾條約締約國全部赴會"
 bftb_greece.13.desc: "在聽聞[ENG.GetNameDef]和[FRA.GetNameDef]都將派遣代表團出席伊拉克利翁會議的消息後，齊聚在首都的官員們都很振奮，但當緊接著聽到[ITA.GetNameDef]人也將赴會的消息後，眾人的喜悅之情不免又徒增幾分憂慮。雖然我國許多政治人物都已經私下表達了對[ITA.GetAdjective]可能破壞整個會議進程的擔憂，但[ROOT.GetLeader]仍舊堅信邀請[ITA.GetNameDef]出席是正確之舉。無論如何，眼下會議的籌備工作已趨近完成，預計將在數日內正式召開。\n\n在最終裁定我國是否有權收復愛琴海沿岸的法理領土前，我國代表將共同參與到對[TUR.GetName]南北疆域的勢力範圍劃分議程當中，世界歷史的嶄新篇章正呼之欲出，而[ROOT.GetNameDef]將成為當下歷史舞臺的中心。"
 bftb_greece.13.a: "如此應當會很有趣……"
 bftb_greece.14.t: "無任何國家赴會！"
 bftb_greece.14.desc: "沒有任何受邀國將派遣代表團前來赴會的消息，著實將我國政府狠狠地羞辱了一番，更糟糕的是，我國領導人還為此被列強公開批評製造地區緊張對立。而今，要說這一連串災難並不嚴重，那實屬輕描淡寫，畢竟諸多韋尼澤洛斯黨人心知肚明，由於政權的合法性全部押在對1922年災難的復仇上，眼下的態勢可以說已經使局面陷入了生死存亡的絕境。\n\n在大量關於此事的偏頗報道不脛而走後，[ROOT.GetAdjective]人民已對消息匱乏的現狀愈發不滿。而希臘國民聯盟更是野心勃勃地利用了民眾的怒火，猛烈抨擊政府行事懦弱且無法兌現承諾。事態發展至此，[ROOT.GetLeader]要怎樣才能帶領我們掙脫這片泥沼呢？"
 bftb_greece.14.a: "我們的狂妄招致今朝之毀滅。"
 bftb_greece.15.t: "伊拉克利翁會議-[FRA.GetAdjective]屬庫爾德斯坦託管領？"
 bftb_greece.15.desc: "第一輪投票的議題在於，在[TUR.GetNameDef]停止抵抗後，[FRA.GetNameDef]是否能夠在[TUR.GetAdjective]屬庫爾德地區建立[FRA.GetAdjective]屬託管領。儘管鑑於[FRA.GetAdjective]的海外殖民帝國已經過度擴張，此項議案多少可能存在反對異議，但諸多與會[FRA.GetAdjective]官員仍舊基於[FRA.GetNameDef]在地緣上毗鄰此地以及[TUR.GetAdjective]屬庫爾德地區存在高漲的庫爾德民族主義這兩點理由，認為其主張是非常合理的。\n\n如果[FRA.GetAdjective]在[TUR.GetNameDef]獲權建立託管領，那麼一旦我國與[TUR.GetNameDef]開戰，他們將如約援助[GRE.GetNameDef]。若提案未能通過，那麼無論伊拉克利翁會議結果如何，當戰端開啟時，[FRA.GetNameDef]將不會承擔援助[GRE.GetNameDef]的義務。"
 bftb_greece.15.a: "我們投票贊成！"
 bftb_greece.15.b: "我們投票反對！"
 GRE_french_kurdistan_option_tt: "如果此項議程通過且伊拉克利翁會議最後勝利閉幕，那麼當§Y[TUR.GetNameDefCap]§!停止抵抗後，§Y[FRA.GetNameDefCap]§!將在[TUR.GetAdjective]持有的§Y庫爾德§!核心地區建立其所屬的§Y庫爾德§!傀儡國。"
 bftb_greece.16.t: "伊拉克利翁會議-[FRA.GetAdjective]屬託管領案通過！"
 bftb_greece.16.desc: "大多數與會代表投票表決認為，在成功擊敗[TUR.GetAdjective]之後，庫爾德斯坦應當交由[FRA.GetNameDef]託管。[FRA.GetAdjective]官員高度讚揚了與會代表們傑出睿智的政治家風範，他們業已向[FRA.GetAdjective]中央政府彙報了決議有關結果，同時提請相關方面著手製定未來當地的行政規劃事宜。"
 bftb_greece.16.a: "贊成派勝出！"
 bftb_greece.17.t: "伊拉克利翁會議-[FRA.GetAdjective]屬託管領案否決！"
 bftb_greece.17.desc: "大多數與會代表投票表決認為，在成功擊敗[TUR.GetAdjective]之後，[FRA.GetNameDef]不應對任何庫爾德領土有所覬覦。如此羞辱幾欲令[FRA.GetAdjective]官員憤而離席，法方怒斥此事實乃荒謬至極。但即便如此，在達成共識之前，法方仍舊希望能夠影響接下來的議程，儘管他們目前暫且一無所獲。"
 bftb_greece.17.a: "反對派勝出！"
 bftb_greece.18.t: "伊拉克利翁會議-[ENG.GetAdjective]屬亞美尼亞保護領？"
 bftb_greece.18.desc: "這一輪投票的議題在於，在[TUR.GetNameDef]停止抵抗後，[ENG.GetNameDef]是否能夠在[TUR.GetAdjective]的[354.GetName]地區建立亞美尼亞保護領。出於對近期不安事件的考量，在[TUR.GetAdjective]國境內釋放出一個亞美尼亞國家的議題引起了不小的爭議，但[ENG.GetAdjective]代表堅持認為，在[SOV.GetAdjective]國境線前沿建立亞美尼亞國家不僅是道義上的應有之舉，同時也在戰略層面具有關鍵作用。\n\n如果[ENG.GetAdjective]在[TUR.GetNameDef]領土上的要求得到滿足，那麼一旦我國與[TUR.GetNameDef]開戰，他們將如約援助[GRE.GetNameDef]。若提案未能通過，那麼無論伊拉克利翁會議結果如何，當戰端開啟時，[ENG.GetNameDef]將不會承擔援助[GRE.GetNameDef]的義務。"
 bftb_greece.18.a: "我們投票贊成！"
 bftb_greece.18.b: "我們投票反對！"
 GRE_british_armenia_option_tt: "如果此項議程通過且伊拉克利翁會議最後勝利閉幕，那麼當§Y[TUR.GetNameDefCap]§!停止抵抗後，§Y[ENG.GetNameDefCap]§!將在§Y[354.GetName]§!地區建立其所屬的§Y亞美尼亞§!傀儡國。"
 bftb_greece.19.t: "伊拉克利翁會議-[ENG.GetAdjective]屬保護領案通過！"
 bftb_greece.19.desc: "大多數與會代表投票表決認為，在成功擊敗[TUR.GetName]之後，[ENG.GetNameDef]有權在其廢墟上重塑一個亞美尼亞保護領。[ENG.GetAdjective]官員高度讚揚了與會代表們傑出睿智的政治家風範，他們業已向[ENG.GetAdjective]中央政府彙報了決議有關結果，同時提請相關方面著手製定未來當地的行政規劃事宜。"
 bftb_greece.19.a: "贊成派勝出！"
 bftb_greece.20.t: "伊拉克利翁會議-[ENG.GetAdjective]屬保護領案否決！"
 bftb_greece.20.desc: "大多數與會代表投票表決認為，[ENG.GetNameDef]不應在[TUR.GetNameDef]北部建立所謂的亞美尼亞保護領。[ENG.GetAdjective]官員對此項決議表示譴責，並且還挖苦諷刺整場會議簡直就是一團糟。但即便如此，英方仍舊留席並希望能夠影響接下來的議程，儘管他們目前暫且一無所獲。"
 bftb_greece.20.a: "反對派勝出！"
 bftb_greece.21.t: "伊拉克利翁會議-[ITA.GetAdjective]屬[342.GetName]和[345.GetName]殖民地？"
 bftb_greece.21.desc: "這一輪投票的議題在於，在[TUR.GetNameDef]停止抵抗後，[ITA.GetNameDef]是否能夠在[TUR.GetNameDef]南部獲得殖民地。儘管全體與會代表都對將這片地中海沿岸領土無償交給[ITA.GetAdjective]人有所保留，但[ITA.GetAdjective]代表依舊重申了此前[ITA.GetLeader]的主張，認為由意方接管該地，在各種程度上都是對其在上次大戰中所蒙受的“被捅刀的勝利”羞辱進行的補償。\n\n儘管其他與會勢力早在伊拉克利翁會議伊始就確信，將[ITA.GetAdjective]拉入對[TUR.GetNameDef]的武裝干涉當中絕無好事。但如果[ITA.GetNameDef]的領土要求得到滿足，那即便屆時意方不會直接參戰，他們也會與[GRE.GetNameDef]簽訂互不侵犯以及後者同[TUR.GetNameDef]交戰時的不干涉條約。若提案未能通過，那麼無論伊拉克利翁會議結果如何，當戰端開啟時，[ITA.GetNameDef]將不會承擔援助[GRE.GetNameDef]的義務。"
 bftb_greece.21.a: "我們投票贊成！"
 bftb_greece.21.b: "我們投票反對！"
 bftb_greece.22.t: "伊拉克利翁會議-[ITA.GetAdjective]屬殖民地案通過！"
 bftb_greece.22.desc: "大多數與會代表投票表決認為，在成功擊敗[TUR.GetName]之後，[ITA.GetNameDef]有權在其殘骸中瓜分得到殖民領地。[ITA.GetAdjective]官員高度讚揚了與會代表們明智的抉擇，儘管決議尚未正式公佈，但已有許多[ITA.GetAdjective]代表團成員啟程回國，向其領袖[ITA.GetLeader]彙報此事。"
 bftb_greece.22.a: "贊成派勝出！"
 bftb_greece.23.t: "伊拉克利翁會議-[ITA.GetAdjective]屬殖民地案否決！"
 bftb_greece.23.desc: "大多數與會代表投票表決認為，[ITA.GetNameDef]不應在[TUR.GetNameDef]南部建立任何所謂的殖民地，同時也譴責提出此議案的[ITA.GetAdjective]不過為愚蠢至極的戰爭販子。如此羞辱遭到了[ITA.GetAdjective]官員的猛烈回擊，其引用此決議，揚言這隻會使[ITA.GetAdjective]人民更加牢記“被捅刀的勝利”羞辱所帶來的仇恨。但無論[ITA.GetAdjective]代表個人看法如何，他們仍舊受命繼續留席會議——毫無疑問他們仍試圖對會議最後且最重要的議案施加影響。"
 bftb_greece.23.a: "反對派勝出！"
 bftb_greece.24.t: "伊拉克利翁會議-偉大理想？"
 bftb_greece.24.desc: "這一輪投票的議題在於，與會列強是否允許偉大理想——這項大希臘國家收復故土失地的理念成為現實。在此期間，[GRE.GetAdjective]領導人[GRE.GetLeader]突然造訪伊拉克利翁會議會場並發表了激情澎湃的演說，他不僅詳盡論述了偉大理想為何有別於世俗復仇般的領土擴張，同時也闡明瞭實現這項數個世紀來全世界各地[GRE.GetAdjective]人所共同承載神聖理想將意味著什麼。\n\n毫無疑問，如果現在拒絕偉大理想，那麼此前在伊拉克利翁會議中所作出的所有妥協和承諾都將作廢。而[GRE.GetNameDef]民主和正直的未來，可以說亦完全取決於今天在座各位代表的決定。"
 bftb_greece.24.a: "我們投票贊成！"
 bftb_greece.24.b: "我們投票反對！"
 GRE_megali_idea_option_tt: "如果此項議程得到通過，那麼當§Y[TUR.GetNameDefCap]§!停止抵抗後，§Y[GRE.GetNameDefCap]§!將會收復§Y伊斯坦布爾§!以及其他§Y[TUR.GetAdjective]§!位於§Y愛琴海§!沿岸的地區。§R如果希臘的偉大理想被否決，那麼此前所有決議亦將作廢！§!"
 bftb_greece.25.t: "伊拉克利翁會議-偉大理想的重生！"
 bftb_greece.25.desc: "大多數與會代表投票表決認為，在成功擊敗[TUR.GetNameDef]之後，[GRE.GetNameDef]應當被允許實現其偉大理想。我國官員對此欣喜若狂，而[ROOT.GetLeader]業已向國內發表講話，宣告伊拉克利翁會議大獲成功。當然，除了與會的小部分人外，沒人清楚伊拉克利翁會議的具體內情，但我國許多人民已有所推測，認為討論議題或許和實現偉大理想有關。\n\n我們如今已在伊拉克利翁會議上得到了想要的一切，而接下來，或許就是最困難的部分了……"
 bftb_greece.25.a: "天佑戰爭！"
 bftb_greece.26.t: "伊拉克利翁會議-偉大理想否決！"
 bftb_greece.26.desc: "大多數與會代表投票表決認為，[GRE.GetNameDef]不應再將建立大希臘國家視作其所謂偉大理想的一部分。在驚懼交加地向與會代表們確認了此項決議後，我國官員遺憾宣佈伊拉克利翁會議至此宣告失敗。而[ROOT.GetLeader]亦不得不凝重地向聚集在首都的人群宣告，整個會議已經徹底失敗。毋庸置疑，在如此羞辱下，人民不會有什麼好臉色。我們已經收到了來自全國各地爆發抗議示威活動的報告，局勢可能失去控制。"
 bftb_greece.26.a: "簡直是浪費時間……"
 ROOT_voted_aye_megali_effect: "投票贊成！"
 ROOT_voted_nay_megali_effect: "投票反對！"
 bftb_greece.29.t: "共產黨奪取希臘政權"
 bftb_greece.29.desc: "最近的情報似乎印證了最壞的狀況：共產黨人現已奪取了雅典的政權，並將其統治公然凌駕於[FROM.GetAdjective]人民之上。我們必須為可能的衝突未雨綢繆，如果屆時[SOV.GetNameDef]認為我們無力應對其狡詐攻勢，那麼他們必定將毫不猶豫地驅使[FROM.GetNameDef]投入一場足以削弱甚至是摧毀我們的陰謀當中。內閣已然作出決斷：我們必須立即對[FROM.GetNameDef]和[SOV.GetNameDef]封鎖海峽進出，以避免其對我們脆弱的國家發動鉗形攻勢。這能夠為我們爭取一定的時間，但必須強調的是，我們必須要為可能的衝突整軍備戰。"
 bftb_greece.29.a: "衝突顯然已是不可避免……"
 bftb_greece.30.desc: "雅典傳來了好消息，[GRE.GetAdjective]共產主義者已經控制了政府。他們現在尋求與我們達成一項對抗[TUR.GetNameDef]的協議，以期共同對[TUR.GetNameDef]施壓，使其在博斯普魯斯問題上讓步，等同於成為我們的傀儡。不過，作為回應，[TUR.GetAdjective]政府現已驚慌地封鎖了我們對黑海的通行權。"
 bftb_greece.30.a: "我們已經把[TUR.GetNameDef]逼入絕境了"
 bftb_greece.30.b: "他們得靠自己"
 bftb_greece.31.t: "博斯普魯斯的豪賭"
 bftb_greece.31.desc: "[SOV.GetNameDef]政治局官員最終決定讓我們獲悉他們未來針對[TUR.GetNameDef]的絕密計劃，而我國將在計劃中充當關鍵角色。計劃其實很簡單：我們將代表[SOV.GetNameDef]以及共產國際向[TUR.GetNameDef]遞交不可能被接受的最後通牒，並以[TUR.GetAdjective]理所當然的拒絕作為開戰的理由，在愛琴海挑起衝突。\n\n我國最高統帥部建議將精銳部隊部署在與[TUR.GetNameDef]接壤的色雷斯邊境，並做好從愛琴海沿岸群島領地進攻[TUR.GetAdjective]領土的準備。儘管在政府及軍方內部，有許多人懷疑在一對一的衝突中，我們能否與[TUR.GetAdjective]武裝力量拼個有來有回，但[SOV.GetNameDef]已作出承諾，如果我們對君士坦丁堡的初次進攻失敗，他們將通過從北方發起進攻來提供支持。"
 bftb_greece.31.a: "命運眷顧勇者。"
 GRE_border_war_possible_tt: "如果事態惡化，我們或許將被迫面對與鄰國§Y[TUR.GetNameDef]§!的§R邊境衝突§!。"
 bftb_greece.32.t: "希臘遞交最後通牒"
 bftb_greece.32.desc: "當我國官員獲悉那些費拉不堪的[FROM.GetNameDef]馬克思主義分子完全不切實際的不合理要求時，他們的反應是憤怒的。[FROM.GetNameDef]聲稱代表[SOV.GetNameDef]行事，其不僅勒令我們恢復執行洛桑條約的每項要求，同時還要允許[SOV.GetAdjective]士兵在我國全境駐紮，以便他們能夠作為一個“可靠且客觀公正的第三方”確保我們遵守條約。\n\n除了挑起邊境衝突，[FROM.GetAdjective]不會真的指望從這種荒唐的要求中得到什麼吧？我們無時不刻不在國境線上努力維持和平，但顯然和平從來不是可選的出路。如果[FROM.GetAdjective]真的代表[SOV.GetNameDef]行事，那麼我們唯一得救的希望就是停止抵抗，並希望我們能夠以此阻止[SOV.GetAdjective]軍隊用武力佔領我國。儘管我們從來沒有逃避爭取正義的鬥爭——但如果我們不再願意為所信仰的價值觀而鬥爭，我們還配繼續實施統治嗎?"
 bftb_greece.32.a: "我們只能逆來順受。"
 bftb_greece.32.b: "[FROM.GetAdjective]已入歧途，我們必須予以糾正。"
 bftb_greece.33.t: "[FROM.GetNameDef]屈服！"
 bftb_greece.33.desc: "對於[GRE.GetAdjective]和[SOV.GetAdjective]兩國觀察家來說，這是令人震驚的轉折，[FROM.GetNameDef]日前已經同意了此前通牒中對其的每項要求。進出博斯普魯斯海峽的規則已恢復至1936年以前的狀態，而[SOV.GetAdjective]則受邀進軍[FROM.GetAdjective]領土，以確保[FROM.GetNameDef]切實履行此前各項條約規定。\n\n鑑於其國家在這場勝利中所展現出的勇氣，[SOV.GetLeader]已親自向[GRE.GetLeader]表達了讚賞，前者現已開始集結軍隊，準備在[TUR.GetNameDef]全境駐紮。隨著來自[TUR.GetNameDef]的威脅被消除，[GRE.GetNameDef]也將注意力轉向了本地區其他可能誘發戰爭的方面。"
 bftb_greece.33.a: "的確令人驚訝，但誠為慷慨饋贈！"
 bftb_greece.34.t: "[SOV.GetNameDefCap]在北方新建傀儡政權！"
 bftb_greece.34.desc: "我等真可謂愚蠢透頂！隨著[SOV.GetNameDef]濫用其在我國境內的自由通行權，他們日前已在兩國邊境交界地區扶持了與我方敵對的共產主義政權，顯而易見，他們打算借用後者的名義征服我國全境！我們早應洞察其中陰險，而如今為時已晚；我國政府的一些成員現已叛逃至敵對的北傀政權當中去，公然宣稱我國已喪失希望。罷了！事到如今，也許早日拱手投降，還能避免我國將來生靈塗炭……"
 bftb_greece.34.a: "識時務拱手而降，豈不美哉。"
 bftb_greece.34.b: "我們於1919年未曾屈服，而今亦然！"
 bftb_greece.35.t: "土耳其拒絕最後通牒！"
 bftb_greece.35.desc: "正如預料的那樣，[FROM.GetNameDef]現已拒絕施加於其的最後通牒。如此一來，我們將就計挑起一場逐步升級的衝突，並最終引發我們兩國間的全面戰爭。無論邊境衝突勝負與否，只要[SOV.GetNameDef]與我國同在，我們便不可能失敗。"
 bftb_greece.35.a: "現在事情變得愈發有趣了！"
 bftb_greece.36.t: "博斯普魯斯之戰拉開帷幕！"
 bftb_greece.36.desc: "出乎我國最高統帥部的預料，日前我軍在邊境大勝[FROM.GetAdjective]軍隊。挾大勝之餘威，我軍已經開始向[FROM.GetAdjective]領土縱深突進。根據最近的戰報，最高統帥部認為[FROM.GetNameDef]定將在不日落敗。"
 bftb_greece.36.a: "我們只需踹倒大門，便能窺見其內部腐朽！"
 bftb_greece.37.t: "[FROM.GetAdjective]軍隊被擊潰！"
 bftb_greece.37.desc: "[FROM.GetAdjective]入侵者對我國邊境發起的毫無意義的攻擊日前已被擊退，但根據我國觀察家的報告，嚴峻的考驗還遠未結束。有情報顯示[FROM.GetAdjective]軍隊正在愛琴海群島集結，並將武器裝備運抵[339.GetName]附近。除此之外，更壞的消息是，[SOV.GetAdjective]在邊境沿線的行動劇增，截獲的通訊顯示，對我國北方的襲擊隨時可能會發生。我們必須做好準備，我們必須挺過去。"
 bftb_greece.37.a: "讓共產黨儘管來吧，我們將盡數擊斃他們！"
 TUR_border_conflicts_in_trabzon_tt: "在事態不可避免地進一步惡化前，在我國§Y[354.GetName]§!和§Y[187.GetName]§!的邊境地區部署防禦力量或許是明智的策略。"
 bftb_greece.38.t: "土耳其擊敗我軍！"
 bftb_greece.38.desc: "不幸的是，我方軍隊看來已無法突破[FROM.GetAdjective]位於[341.GetName]的防禦。最高統帥部對此結果儘管失望，但也並不意外。如果[FROM.GetAdjective]軍隊不乘勝發起追擊，那麼我軍必須設法組織力量發動反擊。屆時，[SOV.GetNameDef]將在我軍從[187.GetName]向[339.GetName]和[340.GetName]發起海岸突襲的同時，從[FROM.GetAdjective]北境防線發起進攻。如此一來，我們怎可能再度失敗？！"
 bftb_greece.38.a: "對[FROM.GetNameDef]來說，這不過是場被操縱的遊戲……"
 bftb_greece.39.t: "博斯普魯斯之戰拉開帷幕！"
 bftb_greece.39.desc: "我軍部隊日前被[FROM.GetAdjective]軍隊的無恥偷襲打了個措手不及，在蒙受慘重損失後被迫於[341.GetName]地區撤退。眼下[FROM.GetAdjective]軍隊並未停止推進勢頭，全面宣戰已是迫在眉睫。儘管我軍首戰失利令人惋惜，但也尚未陷入絕境——這場對抗舊日宿敵的戰爭只不過才剛剛拉開帷幕，我國人民必將堅定不移地與我們並肩戰至最後。"
 bftb_greece.39.a: "[FROM.GetAdjective]讓我們別無選擇！"
 bftb_greece.40.t: "博斯普魯斯之戰拉開帷幕！"
 bftb_greece.40.desc: "正如最高統帥部預想的那樣，我軍已在邊境上戰勝了[FROM.GetAdjective]軍隊，並粉碎了其位於伊茲密爾的防線。在偉大勝利的驅動下，我軍現已開始向[FROM.GetAdjective]領土縱深發起進攻。我國最高統帥部受勝利鼓舞，堅信[FROM.GetNameDef]必在幾週內落敗。"
 bftb_greece.40.a: "越過士麥那，我們將征服這個國家！"
 bftb_greece.41.t: "博斯普魯斯之戰拉開帷幕！"
 bftb_greece.41.desc: "[FROM.GetAdjective]日前在[339.GetName]的交鋒中吃下敗仗，但此戰亦對我方造成了重大傷亡，以至於[ROOT.GetLeader]不禁私下將此役同1919年時[FROM.GetAdjective]軍隊在[339.GetName]最後發動的殘酷攻勢相比較。\n\n即便目前留聚首都的官員們仍在為[339.GetName]短暫攻防戰當中的犧牲者默哀，但舉國上下亦對宿敵踐踏我國主權的無恥偷襲感到怒火中燒。對[341.GetName]的突襲固然卑劣，但我們在[339.GetName]蒙受的犧牲更是無法饒恕。如果[FROM.GetAdjective]政府懦弱到不敢公開宣戰拼一槍，那麼就讓我們堂堂正正宣戰給他們看！"
 bftb_greece.41.a: "我們必將為犧牲者復仇！"
 bftb_greece.42.t: "博斯普魯斯之戰拉開帷幕！"
 bftb_greece.42.desc: "計劃已然落空：最高統帥部原本預計我們至多被[FROM.GetAdjective]軍隊擊退一次，然而如今兩次突襲均以失敗告終，這對我們而言的確是危險信號。儘管[ROOT.GetLeader]已下令暫停所有後續進攻，但鑑於我們剛剛收到[FROM.GetAdjective]代表遞交的宣戰通告，任何補救措施看起來都已是徒勞。局勢正朝著不利於我國的方向惡化。"
 bftb_greece.42.a: "我們必將勝利！為了革命！"
 bftb_greece.43.t: "博斯普魯斯之戰拉開帷幕！"
 bftb_greece.43.desc: "[FROM.GetAdjective]日前在[339.GetName]的交鋒中取勝，並且給予了我方重創，以至於[ROOT.GetLeader]不禁私下將此役同1919年時[FROM.GetAdjective]軍隊最終奪佔[339.GetName]時發動的殘酷攻勢相比較。\n\n儘管首都的氣氛陰鬱，但舉國上下亦對宿敵踐踏我國主權的無恥偷襲感到怒火中燒。對[341.GetName]的突襲固然卑劣，但我們在[339.GetName]蒙受的犧牲更是無法饒恕。如果[FROM.GetAdjective]人真想再打一仗，那麼我們就給他們一場永生難忘的血戰。"
 bftb_greece.43.a: "為了[TUR.GetNameDef]！"
 bftb_greece.44.t: "我軍戰勝了[FROM.GetNameDef]！"
 bftb_greece.44.desc: "不出所料，紅軍業已迅速殲滅駐紮於[354.GetName]地區的卑微[FROM.GetAdjective]守軍，為接下來輕鬆愉悅的進軍鋪平了道路。而在我國自北面發起進攻的同時，[GRE.GetAdjective]亦將從西面發起進攻，如此一來，他們根本毫無機會。"
 bftb_greece.44.a: "[FROM.GetAdjective]必須被納入共產國際旗下。"
 bftb_greece.45.t: "[FROM.GetAdjective]在邊境被擊敗！"
 bftb_greece.45.desc: "令我國官員驚訝的是，我國駐紮於[354.GetName]地區的軍隊日前成功地擊敗了進犯的[FROM.GetAdjective]侵略者，並在極端不利的情況下堅守住了陣地。眼下我們不僅收到了來自[FROM.GetAdjective]大使“誠摯”的致歉函，同時他們亦向我們保證[GRE.GetAdjective]政權才是整個行動的罪魁禍首。此外，他們承諾若是我國與[GRE.GetNameDef]的衝突升級，我們不必擔心遭到[FROM.GetAdjective]的任何報復。"
 bftb_greece.45.a: "我們從絕境中拯救了自己！"
 bftb_greece.46.t: "[FROM.GetAdjective]軍隊擊退我軍攻勢！"
 bftb_greece.46.desc: "前線來報，我軍日前對[354.GetName]地區的攻勢慘遭徹底失敗。此役大敗不僅對我國的國際聲譽造成了毀滅性打擊，同時亦對我國最高統帥部的自尊心造成了重創。我們不得不為此屈尊向[FROM.GetAdjective]政府致歉，同時亦得撤回對[GRE.GetAdjective]政權的一切支持，後者目前仍在西線與[FROM.GetAdjective]保持敵對。"
 bftb_greece.46.a: "斃了該為此負責的人！"
 bftb_greece.47.t: "[FROM.GetNameDefCap]突破[354.GetName]防線！"
 bftb_greece.47.desc: "儘管幾乎沒有輔佐官會對[FROM.GetAdjective]軍隊在北方國境線擊敗我軍一事感到驚訝，但這亦不能使絕望得到任何的寬慰。[FROM.GetAdjective]軍隊並未在邊境的[354.GetName]地區停下腳步，相反，我們持續收到國境內疑似或確切的大規模軍隊運動的報告，甚至有報告稱[FROM.GetAdjective]士兵正在穿越[800.GetName]地界。一切跡象都表明更大規模的入侵將至，我們必須做最壞的打算。"
 bftb_greece.47.a: "這將是祖國的末日嗎？"
 bftb_greece.48.t: "[FROM.GetAdjective]煽動南部共產主義叛亂！"
 bftb_greece.48.desc: "卑劣的[FROM.GetNameDef]共產黨政權日前已武裝了恐怖分子約瑟普·布羅茲·鐵托，並扶持他在南方挑起叛亂！倘若[FROM.GetAdjective]並未積極煽動南部叛軍並陰謀顛覆現存政權，本來幾乎構不成什麼威脅。但如今我們業已別無選擇，只能先鎮壓叛亂，而後向[FROM.GetAdjective]首都進軍，迫使他們屈服。"
 bftb_greece.48.a: "殺千刀的鐵托，還有那些[FROM.GetAdjective]王八蛋！"
 GRE_tito_backed_guerilla_war_tt: "受到§Y希臘§!全力支持的§Y共產黨§!，現已在我國南部挑起內戰。"
 bftb_greece.50.t: "國王解散希臘議會！"
 bftb_greece.50.desc: "我們的國王陛下——喬治二世日前宣佈他將親掌這個國家，以阻止那幫喋喋不休的政客們再次搞亂國家。此舉在全國引發的影響是轟動性的——為此，國王頒佈的首狀敕令是無限期暫停希臘議會——無限期取締這個受國王譴責的“自私自利的毒蛇窩”。\n\n雖然有一部分人為國王的敕令歡欣載舞，但更多的是社會上其他重要勢力聯合起來，對此廣泛譴責。共和派的韋尼澤洛斯黨人以及常遭攻訐的共產黨人在幾十年的彼此仇視後如今已然聯合起來，因為他們都希望看到這位“希臘國王”冠冕墜地、徹底湮滅。目前的情報顯示，內戰很可能在未來的幾週或幾個月內爆發。"
 bftb_greece.50.a: "天賦君權，不可冒犯！"
 GRE_absolute_monarch_hostile_factions_tt: "§R內戰§!看來已不可避免……"
 bftb_greece.51.t: "希臘君主派請求我國援助！"
 bftb_greece.51.desc: "在全國性的政治撕裂後所爆發的慘烈內戰正酣之際，駐雅典的親[ROOT.GetAdjective]政府日前向我國請求援助。儘管他們自然有提出要求的權利，但只有我們才能決定其是否值得幫助。"
 bftb_greece.51.a: "他們毫無疑問需要更多武器。"
 bftb_greece.51.b: "我們可以調配部分資源支援。"
 bftb_greece.51.c: "最好不要干涉希臘內政。"
 bftb_greece.52.t: "[FROM.GetNameDefCap]輸送武器及志願軍！"
 bftb_greece.52.desc: "我們剛剛已在港口接收了來自[FROM.GetNameDef]的武器及志願部隊，不得不說，這遠超我方預期，在接下來的數月當中，這些支援將給予我們巨大的幫助。"
 bftb_greece.52.a: "誠為國王真正的盟友！"
 bftb_greece.53.t: "[FROM.GetNameDefCap]輸送援助！"
 bftb_greece.53.desc: "我們剛剛已在港口接收了來自[FROM.GetNameDef]的物資，在此困難時期，這些物資誠為兩國間友誼的見證，在接下來的數月當中，這些支援將給予我們巨大的幫助。"
 bftb_greece.53.a: "誠為國王真正的盟友！"
 bftb_greece.54.t: "[FROM.GetNameDefCap]拒絕援助"
 bftb_greece.54.desc: "我們已收到[FROM.GetAdjective]拒絕我國求援請求的外交答覆，未來我們不必再指望能從[FROM.GetNameDef]得到任何援助。此結果著實令人遺憾，但即便沒有外援，我們也應當血戰到底。"
 bftb_greece.54.a: "令人失望。"
 bftb_greece.55.t: "[GRE.GetNameDefCap]提議希塞統一"
 bftb_greece.55.desc: "日前[FROM.GetNameDef]代表遞交照會，提議將我們兩國統合為一國。在談及我們兩國共同的歷史及文化遺產時，[FROM.GetAdjective]代表稱[FROM.GetAdjective]政府願意促進希塞統一這項長久以來的崇高理念：即將我們兩國合併為一個更加強大的整體。"
 bftb_greece.55.a: "真是傑出的想法！"
 bftb_greece.55.b: "塞浦路斯將自決命運。"
 end_of_cyprus_tt: "§R這將導致遊戲結束！§!"
 bftb_greece.56.t: "[CYP.GetNameDefCap]接受希塞統一"
 bftb_greece.56.desc: "我們已從[FROM.GetAdjective]得到答覆，他們願意促進兩國人民期盼已久的聯合，並使新國家成為我國主導下的全新整體。舉國上下對此歡欣鼓舞，而[ROOT.GetLeader]現已親赴尼科西亞，他將向當地人民發表講話，以紀念這歷史性的時刻。"
 bftb_greece.56.a: "手足終究重逢！"
 bftb_greece.57.t: "[CYP.GetNameDefCap]拒絕希塞統一！"
 bftb_greece.57.desc: "[FROM.GetAdjective]官員現已照會我方，在經歷漫長的鬥爭後，他們無意再度放棄[FROM.GetAdjective]的國家主權。此外，他們還公然宣佈，“希塞統一”絕不是[FROM.GetAdjective]政府當下所接受的外交請求。"
 bftb_greece.57.a: "這可不是在“請求”他們。"
 bftb_greece.57.b: "很好，如果這就是他們希望的……"
 bftb_greece.58.t: "[FROM.GetNameDefCap]請求與塞浦路斯統一"
 bftb_greece.58.desc: "我們日前正與[FROM.GetAdjective]的代表展開接洽，討論有關我國塞浦路斯殖民地的未來問題。[FROM.GetAdjective]方面指出塞浦路斯自建國的嘗試總是註定失敗的原因在於，從本質上講塞浦路斯人民也是[FROM.GetAdjective]人民。\n\n此外，[FROM.GetAdjective]方面還呈交了來自[FROM.GetAdjective]首相[FROM.GetLeader]的親筆信，在信中他對“希塞統一”概念的歷史進行了詳細的說明，同時也對實現塞浦路斯與[FROM.GetNameDef]的聯合進行了熱切的呼籲。[FROM.GetAdjective]代表設法向我國代表保證，這絕不是[FROM.GetAdjective]收復領土的簡單問題，而是基於塞浦路斯和[FROM.GetNameDef]所共有的文化遺產、歷史以及語言，並且在[FROM.GetAdjective]看來，雙方更有共同的命運。\n\n我國軍方人士重申了塞浦路斯作為地中海戰略基地的重要性，但我國外交政策顧問亦對此強調，結交一位強大的[FROM.GetAdjective]盟友所能提供的價值，遠超過塞浦路斯作為海空軍基地所能提供的價值。眼下，[ROOT.GetAdjective]內閣必須對此作出決斷，但無論如何，我們最好都不要讓[FROM.GetAdjective]代表等上太久。"
 bftb_greece.58.a: "若雙方締結盟約，便接受此提案。"
 bftb_greece.58.b: "讓他們統一吧，塞浦路斯無關緊要。"
 bftb_greece.58.c: "[FROM.GetAdjective]政府必須與“塞浦路斯政府”共治。"
 bftb_greece.58.d: "這些貪婪的希臘人什麼也得不到！"
 bftb_greece.59.t: "[FROM.GetNameDefCap]同意促進希塞統一！"
 bftb_greece.59.desc: "歷經多年坎坷，當[ROOT.GetLeader]向全國宣佈即將實現作為[ROOT.GetAdjective]夙願的希塞統一時，整個首都可以說都沉浸在了歡樂的海洋中，這一切都要感謝我們的[FROM.GetAdjective]朋友。我國行政官員現已動身前往塞浦路斯，以確保權力過渡儘可能順利進行。\n\n對於[ROOT.GetNameDef]來說，這是一個偉大而極富歷史意義的日子。塞浦路斯長久以來便是[ROOT.GetAdjective]共同體的一部分，而現在，他們終於重回其文明發源的大家庭。"
 bftb_greece.59.a: "終於再度團圓！"
 bftb_greece.59.b: "我們不能為希塞統一犧牲自治。"
 bftb_greece.60.t: "[FROM.GetNameDefCap]部分同意希塞統一"
 bftb_greece.60.desc: "[FROM.GetAdjective]日前對我們的原始要求提出了一項奇怪的折中案，即他們願意促進希塞統一：他們願意滿足我們的要求，但條件是我們必須與享有[FROM.GetAdjective]自治領地位的塞浦路斯政府共治。這並非是完全不受歡迎的事態轉變，只是……有些意想不到。\n\n而在另一方面，塞浦路斯政府同意，如果[ROOT.GetNameDef]在建立新國家的過程中對塞浦路斯作出足夠的承諾，他們就不會反對實現完全的希塞統一。不過在那一天到來之前，我們必須默許存在與我們密不可分的塞浦路斯新盟友的現狀。"
 bftb_greece.60.a: "兄弟們，歡迎回家！"
 bftb_greece.61.t: "[FROM.GetNameDefCap]拒絕希塞統一！"
 bftb_greece.61.desc: "我國的信任和忠誠似乎被長久以來所珍視的盟友拋棄了。日前[FROM.GetNameDef]已經拒絕哪怕是稍微考慮一下向我們移交[ROOT.GetAdjective]屬塞浦路斯島的提議。他們以該島的戰略重要性和對[ROOT>GetAdjective]復仇主義的擔憂作為藉口，在他們眼中，我們不配得到這座島嶼。\n\n這並非完全出乎意料，但也並不能使積怨和失望減輕一分。我們為了讓塞浦路斯迴歸祖國已經等待了多少年？因為這次挫折，我們還要被迫繼續等待多少年？不得不說，我們對於和[FROM.GetNameDef]構建良好關係的熱情，已經因為這次事件而顯著冷卻了。"
 bftb_greece.61.a: "我們會記住這一切的……"
 bftb_greece.62.t: "[FROM.GetNameDefCap]提議共入軸心國！"
 bftb_greece.62.desc: "當舊[FROM.GetAdjective]政權被新起的法西斯政權取代的消息傳來，巨大的恐懼陰影頓時已籠罩在首都的輔佐官們心頭。我們預感的戰爭似乎已不可避免，這使得此前維護愛琴海地區和平的一切努力，轉眼間都變成了辛辣的諷刺，顯然命運正嘲弄著我們的大錯特錯。\n\n但與此同時，我們也收到了來自[FROM.GetNameDef]法西斯政府非同尋常的提案：鑑於戰爭將不可避免地波及兩國，[FROM.GetLeader]決定拋開意識形態上的成見與我等坦率交換意見，他認為因眼前的利益而毀滅兩國過去數十年來構建的外交關係，只會導致一場慘烈而又愚蠢的無意義戰爭。與其如此，[FROM.GetNameDef]政府建議兩國不如攜手與歐陸崛起的法西斯列強結盟修好。[FROM.GetLeader]堅信法西斯主義必將制霸整片大陸，而兩國聯手則將形成傾覆勝利天平的力量，進而加速戰爭的進程。[FROM.GetLeader]稱此為“憐憫”，而[ROOT.GetLeader]對此不置可否。"
 bftb_greece.62.a: "以和平之名，讓我等共赴戰爭。"
 bftb_greece.62.b: "[FROM.GetAdjective]人怕不是瘋了……"
 bftb_greece.63.t: "[FROM.GetNameDefCap]同意簽署希土友好條約！"
 bftb_greece.63.desc: "成功了！[FROM.GetAdjective]大使現已轉達其政府同意簽署友好條約的答覆。與法西斯列強勾肩搭背，我們不可能失敗的。"
 bftb_greece.63.a: "兩份陣營申請表，勞駕！"
 bftb_greece.63.b: "或者……把土耳其人踢開？"
 GRE_no_turkey_needed: "通過偽造和欺詐的手段，我們將破壞§Y土耳其§!與§Y法西斯列強§!的關係。"
 bftb_greece.64.t: "[FROM.GetNameDefCap]拒絕簽署希土友好條約！"
 bftb_greece.64.desc: "[FROM.GetAdjective]政府可能不是懦夫就是蠢貨，無論如何，短視的他們並不會加入我們必勝的陣營。沒關係，反正我國會走自己的路，無論接下來[FROM.GetNameDef]發生什麼，都只能是他們咎由自取。"
 bftb_greece.64.a: "強者方能立世，敗者只配食塵。"
 bftb_greece.65.t: "[FROM.GetNameDefCap]和[TUR.GetNameDef]提議戰略合作"
 bftb_greece.65.desc: "如同拼圖歸位般，事情正按部就班地推進著。儘管柏林政權的更迭令人出乎意料，也給我國的未來造成了許多的疑問，但眼下從雅典方面遞交的提案，卻令迷茫黯淡的前路有了幾分光亮。\n\n根據來函，[FROM.GetNameDef]和[TUR.GetNameDef]兩國似乎有意與我國達成長期戰略同盟關係，將他們兩國納入到一項地中海條約當中無疑將有助於實現我國的地區野望。儘管也有人說，這兩個國家在某種程度上倒不如說更像是我國霸權野望道途上的附庸。"
 bftb_greece.65.a: "團結起來，我等將創造歷史！"
 bftb_greece.65.b: "我國的野望中顯然沒有“盟友”的位置。"
 bftb_greece.66.t: "[FROM.GetNameDefCap]和[TUR.GetNameDef]申請加入[GER.GetFactionName]"
 bftb_greece.66.desc: "日前在會見[FROM.GetNameDef]和[TUR.GetNameDef]代表時，我們驚訝地收到了他們想要加入[ROOT.GetFactionName]的申請。這的確是驚喜，不過卻是值得商榷的驚喜。在正式給予答覆前，我們必須確定他們若是成為盟友是將促進我國大業的實現，還是會成為掣肘的拖油瓶。"
 bftb_greece.66.a: "值此多事之秋，他們誠為可貴盟友。"
 bftb_greece.66.b: "不，我們並不需要他們。"
 bftb_greece.67.t: "[FROM.GetNameDefCap]提議戰略合作！"
 bftb_greece.67.desc: "如同拼圖歸位般，事情正按部就班地推進著。儘管柏林政權的更迭令人出乎意料，也給我國的未來造成了許多的疑問，但眼下從雅典方面遞交的提案，卻令迷茫黯淡的前路有了幾分光亮。\n\n正值我國尋覓盟友之際，[FROM.GetNameDef]似乎有意與我國達成長期戰略同盟關係，顯然[FROM.GetNameDef]方面的加入能夠助力我國實現野望。但是，誰又能保證他們不是求生欲極強地試圖討好我們呢？也許他們並不想真心成為我國盟友；也許他們只是單純發現反對我國的話只會對其自身不利……也許，對我國來說，上述可能其實本質上亦沒什麼區別。"
 bftb_greece.67.a: "羅馬和雅典，終於再度攜手！"
 bftb_greece.67.b: "獵手可不會和獵物稱兄道弟。"
 bftb_greece.68.t: "[FROM.GetNameDefCap]申請加入[GER.GetFactionName]！"
 bftb_greece.68.desc: "日前我方會見了來自[FROM.GetNameDef]的代表，並對[FROM.GetAdjective]當局迫切請求[FROM.GetNameDef]獲准加入[ROOT.GetFactionName]的熱情深感欣慰。這並不奇怪，畢竟若是沒有我國，[FROM.GetAdjective]根本無法把控局面。不過眼下我們必須考慮清楚，讓他們成為我國盟友究竟對實現我國野望有無益處。"
 bftb_greece.68.a: "歡迎，希臘朋友！"
 bftb_greece.68.b: "不行，想都別想！"
 bftb_greece.69.t: "[FROM.GetNameDefCap]拒絕我國結盟請求！"
 bftb_greece.69.desc: "我們已經收到了來自[FROM.GetAdjective]外交官的通告，稱[FROM.GetLeader]並不認為使我國成為其親密盟友是明智的決定。對此我們深表失望，但無論如何，眼下缺少了[FROM.GetNameDef]的外援，我們必須自己開拓擺脫這場危機的道路。"
 bftb_greece.69.a: "我們將自己挺過這一切。"
 bftb_greece.70.t: "埃萊夫塞里奧斯·韋尼澤洛斯在流亡中逝世"
 bftb_greece.70.desc: "埃萊夫塞里奧斯·韋尼澤洛斯，希臘自由黨的領袖，希臘政壇可敬的巨人，日前在流亡中逝世。自1935年被軍隊推翻以來，他便一直處於流亡之中。韋尼澤洛斯曾致力於希臘的多黨派民主政治建設，在塑造希臘國家意識形態方面，他可以說是一個無出其右的人物。\n\n然而，相比較於他的諸多失敗，他的成功事蹟可能並不會被為人銘記。韋尼澤洛斯曾支持共和派在國內的暴恐行動，也正是他愚蠢的修正主義錯誤使我國在1919年的希土戰爭中瀕臨滅亡的邊緣。從希臘今天所面臨的每一個問題中，都可以尋覓到韋尼澤洛斯的蹤跡，這也是我們國家所承受災難的主要來源。\n\n誠然，他是一個革命家、愛國者和進步者；但不可否認的是，他也是一個煽動者、戰爭狂人和失敗者。除此之外，對於埃萊夫塞里奧斯·韋尼澤洛斯，更需要說的是：我們很慶幸他永遠不會再次面對其在希臘一手造成的苦難了。"
 bftb_greece.70.a: "他老人家總算安息了。"
 bftb_greece.71.t: "埃萊夫塞里奧斯·韋尼澤洛斯逝世"
 bftb_greece.71.desc: "埃萊夫塞里奧斯·韋尼澤洛斯首相，希臘自由黨的領袖，希臘政壇可敬的巨人，日前在其家中安詳逝世。韋尼澤洛斯曾致力於希臘的多黨派民主政治建設，而在塑造希臘國家意識形態方面，他可以說是一個無出其右的人物。\n\n但僅僅靠隻言片語怎能評價這位為了國家和國民付出如此之多的偉人呢？他是我們今天有幸服務的國家的總設計師，他留下的遺產將會比我們所有人都更加長久。韋尼澤洛斯完美的生平上唯一的汙點或許是我國在1919年希土戰爭中所遭受的可怕失敗。這是本可堪稱完美的遺產上的瑕疵，現在我們將齊心協力進行復仇。\n\n埃萊夫塞里奧斯·韋尼澤洛斯是一個革命家、愛國者和進步者；他曾是我們的領袖，我們將銘記他本人及其永不妥協的雄獅之心。接任首相及自由黨總裁職務的塞米斯托克利斯·索富利斯宣佈，這位最近去世的現代希臘國父的葬禮日將被設為國家公祭日。"
 bftb_greece.71.a: "希臘人民虧欠著您永遠無法償還的恩情……"
 bftb_greece.91.t: "希臘國民聯盟開設接納安納托利亞難民的救濟院"
 bftb_greece.91.desc: "為了吸引更多追隨者加入他的事業，喬治·科斯米迪斯利用其運動的資金為如同他這般自[TUR.GetNameDef]逃離的難民開設了救濟院。當然，若是他沒有假公濟私將這些救濟院作為他的黨羽招募基地，那將是值得稱讚之舉。\n\n我們現在處於兩難的境地：很明顯，科斯米迪斯打算繼續利用這些救濟院招募對社會毫無歸屬感的安納托利亞難民，那麼為了阻止他的詭計，我們是否應該將它們關閉？還是說為了保全聲譽，我們應當繼續允許這些救濟院運營？有人可能會辯解說，讓難民在法西斯分子開的救濟院裡有所歸屬，也比任由他們在貧民窟中受苦更可取。"
 bftb_greece.91.a: "這是值得讚賞的崇高之舉！"
 bftb_greece.91.b: "關掉，一定要關掉。"
 bftb_greece.92.t: "希臘國民聯盟要求提高[ROOT.GetAdjective]工人薪資"
 bftb_greece.92.desc: "利用全國輿論對他們的關注，希臘國民聯盟向我們發起了猛攻，他們橫加指責我們在保障人民福利方面建樹寥寥。這些一夜之間遍地開花的法西斯分子竟然狂妄地自命他們應該在財政、社會施政等各方面充當我們的老師。這個觀點足以令人笑掉大牙，但可惜刁民們卻很吃他們這一套。"
 bftb_greece.92.a: "也許……象徵性提升最低工資？"
 bftb_greece.92.b: "我們絕不接受法西斯分子的恐嚇。"
 bftb_greece.93.t: "希臘國民聯盟成員參與街頭暴力襲警活動！"
 bftb_greece.93.desc: "希臘國民聯盟和執法警察之間的衝突在全國範圍內此起彼伏，一時間形成了風靡的政治暴力。我們本以為這些事情早已解決，但從受傷送醫的人數以及對不斷升級的暴行報道上看，我們並沒有解決。\n\n一些閣僚建議我們應採取強硬措施，向全國表明我們絕不會姑息此等胡作非為，但也有閣僚擔心若是如此睚眥必報地硬槓法西斯分子或許勝算渺茫。人民有權表達不滿，但這並不能成為其肆意訴諸暴行的理由。"
 bftb_greece.93.a: "他們的訴求看起來很合理。"
 bftb_greece.93.b: "必須重拳出擊，止暴制亂。"
 bftb_greece.94.t: "希臘國民聯盟成員洗劫外資工廠並分發贓物！"
 bftb_greece.94.desc: "熟悉又不幸的場景再現，希臘國民聯盟的黨羽們日前闖入外資工廠並掠奪製成品分給那些無依無靠的貧苦人士。喬治·科斯米迪斯及希臘國民聯盟領導層宣稱對這一系列行為毫不知情，但他們卻也熱情洋溢地為那些參加此明顯帶有利他性質搶劫行為的男女進行了辯護。\n\n這類搶劫行為屬實不可饒恕，我們已經收到了不少諸如來自[ENG.GetNameDef]和[FRA.GetNameDef]的工商業巨頭的抗議。事已至此，假如我們出面幫助這些受害工商企業，我們可能會被國內民眾視作外國資本家的傀儡；或者，我們也可以放任安那其主義氾濫成災，但這樣會使我們被國際社會視作無能政府。"
 bftb_greece.94.a: "我們不應該阻止他們。"
 bftb_greece.94.b: "我國絕不會陷入無政府狀態！"
 bftb_greece.95.t: "希臘國民聯盟承諾攜手共進！"
 bftb_greece.95.desc: "希臘國民聯盟一直以來便是我們的眼中釘，但他們最近似乎願意同現政府合作以對抗共同的敵人。喬治·科斯米迪斯一直是主張對[TUR.GetNameDef]宣戰的鐵桿鷹派之一，鑑於戰爭臨近，希臘國民聯盟願意當下擱置黨派成見與我們合作，共同努力以使我們的[TUR.GetAdjective]仇敵敗伏於我軍陣前。"
 bftb_greece.95.a: "攜手共進，我們勢不可擋！"
 bftb_greece.95.b: "不和法西斯同流合汙，我們亦能取勝。"
 bftb_greece.96.t: "亞里士多德·奧納西斯迴歸[ROOT.GetNameDef]"
 bftb_greece.96.desc: "時隔多年後，身為富豪大亨及國際名流的亞里士多德·奧納西斯終於首次迴歸[ROOT.GetNameDef]祖國。不過歸國後的他既沒有接受媒體採訪，也鮮有在觀察家的注視下顯露蹤跡，有報道稱他正在接洽逢迎安納托利亞難民群體，或許是準備參加競選。"
 bftb_greece.96.a: "他到底在打什麼主意？"
 bftb_greece.101.t: "韋尼澤洛斯黨和共產黨聯手對抗國王政權"
 bftb_greece.101.desc: "如果說曾經還有人懷疑共產黨和韋尼澤洛斯黨兩者是否真的會聯合的話，那麼毋庸置疑，現在他們已經穿一條褲子了。我們日前收到報告，稱共產黨人已經幫助埃萊夫塞里奧斯·韋尼澤洛斯偷渡回國，並打算在推翻國王的政權後推舉其成為臨時執政。\n\n即使是對那幫赤匪而言，這也真可謂是愚蠢的計劃。他們不會真以為韋尼澤洛斯得勢後會將政權心甘情願地交給他們吧？這真是太瘋狂了。但話又說回來，不論是共產黨還是韋尼澤洛斯黨都欠缺足夠的理智。我們必須為這場承蒙紛爭不斷的陰謀而引發的內戰做好準備。"
 bftb_greece.101.a: "吾輩之敵不過抱團鼠輩爾！"
 bftb_greece.102.t: "共產黨組團劫掠工廠"
 bftb_greece.102.desc: "很遺憾執法部門未能成功阻截最近共黨分子對一家制槍廠的襲擊。在把工廠裡能拿走的東西都搬空後，這幫赤匪甚至還試圖縱火燒燬工廠，不過謝天謝地他們僅僅毀壞了點建築。\n\n不用想也知道他們為何要對武器廠商橫加劫掠：這幫鼠輩打算偷走槍械武裝自己，進而和我們正面交鋒。如此看來，這將有可能是[ROOT.GetNameDef]迄今為止最慘烈的內戰……"
 bftb_greece.102.a: "我們不會容忍這幫安那其如此肆無忌憚。"
 bftb_greece.103.t: "韋尼澤洛斯黨將領潛回希臘！"
 bftb_greece.103.desc: "我們收到情報稱，大批有韋尼澤洛斯黨背景的前政府軍將領已經緊隨他們卑劣的領袖韋尼澤洛斯之後偷渡回國。狼狽為奸的共產黨和韋尼澤洛斯黨將這些可惡的前軍隊指揮官喬裝成商船的貨物偷運回國內，並且在我們識破之前將他們藏匿了起來。\n\n對付烏合之眾的叛亂是一回事，但對付有力軍事指導下的全面內戰就是另一回事了。許多閣僚質疑我們不受歡迎的君主用如此公開且令人嫌棄的方式來宣揚自己的專制正當性是否明智，但是[ROOT.GetLeader]卻堅信叛軍將被很快消滅。"
 bftb_greece.103.a: "他們真要逼我們把港口也炸了？"
 bftb_greece.104.t: "國境南北兩側有組織抵抗升級！"
 bftb_greece.104.desc: "有關部門日前通知政府，我們實際上業已喪失對我國南方和北方地區的控制。共產黨人和韋尼澤洛斯黨人現已公然在大街上四處傳播其誹謗和蠱惑，地方當局僅能袖手旁觀：後者要麼已與其同流合汙，要麼已無力進行阻止。\n\n由於深諳對方早已設下陷阱恭候，因此軍隊拒絕進駐以恢復地區控制權。但即便如此，他們也保持著高度戒備，同時亦向內閣作出承諾，一旦韋尼澤洛斯黨和共產黨消停下來，軍方將毫不猶豫地採取必要措施，奪回對國家的控制權。當然，許多政界人士仍然對這些承諾的可信度持懷疑態度，畢竟在整個武裝部隊中，有關腐敗和背叛的報道比比皆是。"
 bftb_greece.104.a: "局勢正在失去控制！"
 bftb_greece.105.t: "內戰爆發！"
 bftb_greece.105.desc: "命運的審判日終於降臨：韋尼澤洛斯黨的魁首終於現身，公然宣稱國王的統治是非法的，且是對[FROM.GetNameDef]民主的巨大威脅。他們認為自己除暴力推翻君主制外已別無選擇，誓要重建此前兩度夭折的希臘共和體制。\n\n而[ROOT.GetLeader]則宣告所有反叛者皆犯下謀逆重罪，其發誓要徹底根除馬克思分子以及共和分子，恢復[ROOT.GetNameDef]的秩序。如此一來，[ROOT.GetNameDef]的政治角鬥場現已再度拉開帷幕，只有最強者方能凱旋。"
 bftb_greece.105.a: "為了國王陛下！"
 bftb_greece.166.t: "我國政要自雅典投資會談中歸來"
 bftb_greece.166.desc: "當[FROM.GetAdjective]人決定邀請我們進一步討論深化兩國經濟聯繫的問題時，我們自然無法拒絕。不用說，在談及提升[FROM.GetAdjective]工業水平所能帶來的好處時，他們給出了引人入勝的理由。但究竟是對其進行投資，還是任其工業潛力自由發展，這是接下來我們需要考慮的問題。"
 bftb_greece.166.a: "好，我們應該投資！"
 bftb_greece.166.b: "這次不會進行投資……"
 bftb_greece.166.c: "不，我們絕不會在此窮鄉僻壤投資！"
 bftb_greece.167.t: "我國商賈自[FROM.GetAdjective]全國展會中歸來"
 bftb_greece.167.desc: "[FROM.GetAdjective]人真是為我們奉獻了一場精彩的展會！毫無疑問，在吸引我國投資方面，他們的努力是成功的。但我方自然也有考量，眼下我們必須決定是否在[FROM.GetAdjective]進行投資。"
 bftb_greece.167.a: "好，我們應該投資！"
 bftb_greece.167.b: "這次不會進行投資……"
 bftb_greece.167.c: "不，我們絕不會在此窮鄉僻壤投資！"
 bftb_greece.168.t: "[FROM.GetAdjective]利用沙赫特計劃敲詐我國！"
 bftb_greece.168.desc: "這些自作聰明的[FROM.GetNameDef]害蟲如今正打算利用我方的龐氏騙局來發起反制。為了方便我們利用沙赫特計劃中的某些紕漏錯誤牟利，那個原本此前在條約中預留的安全漏洞，如今正被他們用來對付我們——這本應是不可能發生的事情。如今，我們要麼默許[FROM.GetAdjective]人拿下此等蠅頭小利以保住顏面；要麼無視規則，直接宣告與[FROM.GetAdjective]方面的談判就此作廢。"
 bftb_greece.168.a: "為免遭難堪，我們還是暫且退讓……"
 bftb_greece.168.b: "扭轉局面，沙赫特博士！"
 bftb_greece.168.c: "我們絕不向[FROM.GetAdjective]的敲詐妥協！"
 bftb_greece.168.d: "他們高估了自己，亦將自食苦果！"
 gott_bless_herr_schacht_tt: "鑑於你擁有§Y亞爾馬·沙赫特§!作為閣僚，此選項可用。"
 bftb_greece.169.t: "[FROM.GetAdjective]決定投資！"
 bftb_greece.169.desc: "在上次對我國的短暫訪問後，日前我們再次接待了來自[FROM.GetAdjective]的投資者們，這次他們為我們帶來了投資和機遇的好消息！有了他們的幫助，我國將在未來建成真正意義上的現代化經濟。"
 bftb_greece.169.a: "令人振奮的成功！"
 bftb_greece.169.b: "令人振奮的成功！"
 bftb_greece.169.c: "幹得漂亮，各位！"
 bftb_greece.170.t: "[FROM.GetAdjective]決定不投資"
 bftb_greece.170.desc: "唉，我們剛剛收到了[FROM.GetAdjective]人決定暫不投資我國經濟建設的不幸消息。雖然[FROM.GetAdjective]代表不排除在未來再對我國進行投資的可能，但此消息還是令人沮喪不已。"
 bftb_greece.170.a: "或許下次一定。"
 bftb_greece.171.t: "[FROM.GetAdjective]永久退出投資會談！"
 bftb_greece.171.desc: "我們可能真的對投資操之過急了：[FROM.GetAdjective]人日前已決計其無意再對我國工業建設進行投資。唉，如果他們不願幫助我們構建美好未來，那就隨他們去吧。"
 bftb_greece.171.a: "也許……[ITA.GetAdjective]人更願意達成協議？"
 bftb_greece.172.t: "亞爾馬·沙赫特欺騙我國！"
 bftb_greece.172.desc: "當那位鬼才尚作為該國內閣成員與我等簽署條約時，我們竟然會自作聰明地以為可以利用沙赫特計劃來敲詐[FROM.GetAdjective]人，實在是天真！而今，我們反而成為了需要償付給他們資金的國家，真是太不幸了！"
 bftb_greece.172.a: "金融奇才再度重拳出擊！"
 bftb_greece.173.t: "我國企業家自雅典會談中歸來！"
 bftb_greece.173.desc: "當[FROM.GetAdjective]人決定邀請我們進一步討論深化兩國經濟聯繫的問題時，我們自然無法拒絕。不用說，在談及提升[FROM.GetAdjective]工業水平所能帶來的好處時，他們給出了引人入勝的理由。但究竟是對其進行投資，還是任其工業潛力自由發展，這是接下來我們需要考慮的問題。"
 bftb_greece.173.a: "我國將頒發許可並允其投資。"
 bftb_greece.173.b: "眼下這並不符合英國的利益。"
 bftb_greece.173.c: "對不住了老夥計，約翰牛尚有其他要事處理！"
 bftb_greece.174.t: "我國政要參加[FROM.GetAdjective]全國展會 "
 bftb_greece.174.desc: "[FROM.GetAdjective]人真是為我們奉獻了一場精彩的展會！毫無疑問，在吸引我國投資方面，他們的努力是成功的。但我方自然也有考量，眼下我們必須決定是否在[FROM.GetAdjective]進行投資。"
 bftb_greece.174.a: "他們可以指望我國援助！"
 bftb_greece.174.b: "眼下這並不符合英國的利益。"
 bftb_greece.174.c: "對不住了老夥計，約翰牛尚有其他要事處理！"
 bftb_greece.175.t: "[FROM.GetAdjective]貿易船舶零件換取投資"
 bftb_greece.175.desc: "[FROM.GetAdjective]人日前提出了有趣的議案：即他們希望通過向我國提供幫助船舶製造的零件，以換取我國對其增加金融投資。儘管一般來說，兩國貿易採取物物交換的形式有些不合常理，但此舉亦展現了[FROM.GetAdjective]人所表達的誠意。"
 bftb_greece.175.a: "幾乎可謂公平的交易！"
 bftb_greece.175.b: "我國暫不需要[FROM.GetAdjective]的零件。"
 bftb_greece.175.c: "抱歉了[FROM.GetNameDef]，我們兩國間的貿易往來至此終結！"
 bftb_greece.176.t: "[FROM.GetAdjective]決定投資！"
 bftb_greece.176.desc: "在上次對我國的短暫訪問後，日前我們再次接待了來自[FROM.GetAdjective]的投資者們，這次他們為我們帶來了投資和機遇的好消息！有了他們的幫助，我國將在未來建成真正意義上的現代化經濟。"
 bftb_greece.176.a: "令人振奮的成功！"
 bftb_greece.176.b: "令人振奮的成功！"
 bftb_greece.176.c: "我們總可以指望[FROM.GetAdjective]！"
 bftb_greece.177.t: "[FROM.GetAdjective]決定暫不投資"
 bftb_greece.177.desc: "唉，我們已經接到消息：[FROM.GetAdjective]這次將不會向我國經濟投資。儘管[FROM.GetAdjective]的代表並未排除他們未來對我們的投資預期，這仍然是一件令人失望的事情。"
 bftb_greece.177.a: "好吧，或許下次一定。"
 bftb_greece.178.t: "[FROM.GetAdjective]立法禁止我國獲得融資！"
 bftb_greece.178.desc: "我們可能真的對投資操之過急了：[FROM.GetAdjective]日前已決計其無意再對我國工業建設進行投資。唉，如果他們不願幫助我們構建美好未來，那就隨他們去吧。"
 bftb_greece.178.a: "那我們鼓起勇氣去和俄國人協商如何？"
 bftb_greece.179.t: "[FROM.GetAdjective]官員於首都遊說投資"
 bftb_greece.179.desc: "當[FROM.GetAdjective]人決定邀請我們進一步討論深化兩國經濟聯繫的問題時，我們自然無法拒絕。不用說，在談及提升[FROM.GetAdjective]工業水平所能帶來的好處時，他們給出了引人入勝的理由。但究竟是對其進行投資，還是任其工業潛力自由發展，這是接下來我們需要考慮的問題。"
 bftb_greece.179.a: "沒問題，我國可以小額投資。"
 bftb_greece.179.b: "這次暫時不行。"
 bftb_greece.179.c: "我國對[FROM.GetAdjective]事務毫無興趣！"
 bftb_greece.180.t: "我國官員參加[FROM.GetNameDef]全國展會"
 bftb_greece.180.desc: "[FROM.GetAdjective]人真是為我們奉獻了一場精彩的展會！毫無疑問，在吸引我國投資方面，他們的努力是成功的。但我方自然也有考量，眼下我們必須決定是否在[FROM.GetAdjective]進行投資。"
 bftb_greece.180.a: "沒問題，我國應該投資[FROM.GetNameDef]。"
 bftb_greece.180.b: "這次暫時不行。"
 bftb_greece.180.c: "我國對[FROM.GetNameDef]事務毫無興趣！"
 bftb_greece.181.t: "[FROM.GetAdjective]政府賄賂我國工會！"
 bftb_greece.181.desc: "那些卑劣的[FROM.GetNameDef]無賴目前正想盡辦法纏著我國對其國土進行投資，而與此同時，我國工會同樣也在掣肘我們！他們指責政府故意無視[FROM.GetAdjective]人民慷慨的提議，因此加劇了國內的就業危機——廢話，顯而易見他們是見錢眼開，替希臘人說話；但無可奈何，他們卻又扼住了我等的咽喉。唉，無論如何，眼下我們是儘可能以最小的代價向工會妥協並給那些[FROM.GetNameDef]想要的呢，還是堅持貫徹可能全盤皆輸的原則？"
 bftb_greece.181.a: "我國如今無法承擔可能後果……"
 bftb_greece.181.b: "爾等匹夫豈能嚇倒我等！？"
 bftb_greece.181.c: "滾開，希臘短視庸碌之徒！"
 bftb_greece.182.t: "[FROM.GetAdjective]決定投資！"
 bftb_greece.182.desc: "在上次對我國的短暫訪問後，日前我們再次接待了來自[FROM.GetAdjective]的投資者們，這次他們為我們帶來了投資和機遇的好消息！有了他們的幫助，我國將在未來建成真正意義上的現代化經濟。"
 bftb_greece.182.a: "令人振奮的成功！"
 bftb_greece.182.b: "令人振奮的成功！"
 bftb_greece.182.c: "此誠我等偉大的友誼！"
 bftb_greece.183.t: "[FROM.GetAdjective]決定暫不投資"
 bftb_greece.183.desc: "唉，我們已經接到消息：[FROM.GetAdjective]這次將不會向我國經濟投資。儘管[FROM.GetAdjective]的代表並未排除他們未來對我們的投資預期，這仍然是一件令人失望的事情。"
 bftb_greece.183.a: "好吧，或許下次一定。"
 bftb_greece.184.t: "[FROM.GetAdjective]驅逐我國代表並終止投資"
 bftb_greece.184.desc: "我們可能真的對投資操之過急了：[FROM.GetAdjective]日前已決計其無意再對我國工業建設進行投資。唉，如果他們不願幫助我們構建美好未來，那就隨他們去吧。"
 bftb_greece.184.a: "那我們鼓起勇氣去和俄國人協商如何？"
 bftb_greece.185.t: "[FROM.GetAdjective]遊說我國助力其工業化"
 bftb_greece.185.desc: "當[FROM.GetAdjective]人決定邀請我們進一步討論深化兩國經濟聯繫的問題時，我們自然無法拒絕。不過究竟是什麼導致[FROM.GetAdjective]人變得如此絕望，以至於他們竟然向我們尋求經濟援助？不用說，在談及提升[FROM.GetAdjective]工業水平所能帶來的好處時，他們給出了引人入勝的理由……尤其是能夠提升我國自身實力這一點上。但究竟是對其進行投資，還是任其工業潛力自由發展，這是接下來我們需要考慮的問題。"
 bftb_greece.185.a: "還有其他備選案需要商議！"
 bftb_greece.185.b: "或許晚幾天再作答覆。"
 bftb_greece.185.c: "等他們被征服後就能實現工業化了！"
 bftb_greece.186.t: "[FROM.GetAdjective]希望遏止[ROOT.GetAdjective]地中海野望"
 bftb_greece.186.desc: "我國日前接待了來自[FROM.GetNameDef]的代表，就[ROOT.GetAdjective]日益干涉該國內政的問題轉達了其政府的憂慮。為此，該國代表獲得授權與我方展開如下談判：在他們向我方提供物資的情況下，作為交換，我方應當有義務保障該國權益。\n\n我們當然否認發生了任何所謂干涉，儘管事實的確如此。這項提案誠然是慷慨的，在維護國家主權方面，[FROM.GetAdjective]的意念顯然是堅定的。我們當然可以獲取大量的物資，但與此同時，我們亦可就此徹底使[FROM.GetNameDef]俯首帖耳……"
 bftb_greece.186.a: "如此饋贈誠應心懷感激。"
 bftb_greece.186.b: "或許我們以後會同意，但現在不會。"
 bftb_greece.186.c: "噢，附庸可不會如此輕易就全身而退！"
 bftb_greece.187.t: "[FROM.GetAdjective]決定投資！"
 bftb_greece.187.desc: "在上次對我國的短暫訪問後，日前我們再次接待了來自[FROM.GetAdjective]的投資者們，這次他們為我們帶來了投資和機遇的好消息！此外他們還隨行了一些未受邀的訪察者，不過這些人行事詭譎，我們很快便失去了其行蹤的跡象。無論如何，有了[FROM.GetAdjective]的幫助，我國將在未來建成真正意義上的現代化經濟。"
 bftb_greece.187.a: "與惡魔交易總比滅亡要強。"
 bftb_greece.187.b: "我國將堅決捍衛自身獨立。"
 bftb_greece.188.t: "[FROM.GetAdjective]決定暫不投資"
 bftb_greece.188.desc: "唉，我們已經接到消息：[FROM.GetAdjective]這次將不會向我國經濟投資。儘管[FROM.GetAdjective]的代表並未排除他們未來對我們的投資預期，這仍然是一件令人失望的事情。"
 bftb_greece.188.a: "或許還算因禍得福……"
 bftb_greece.189.t: "[FROM.GetAdjective]無視我國代表並驅逐外交官！"
 bftb_greece.189.desc: "我們可能真的對投資操之過急了：[FROM.GetAdjective]日前已決計其無意再對我國工業建設進行投資。唉，如果他們不願幫助我們構建美好未來，那就隨他們去吧。"
 bftb_greece.189.a: "這肯定是厄運將至的信號……"
 bftb_greece.190.t: "[FROM.GetAdjective]官員造訪主席團"
 bftb_greece.190.desc: "日前我們滿懷喜悅地接待了來自[FROM.GetNameDef]的官員團，後者之一以訪客的身份在主席團會議上發表了演說，並在其中強調了兩國間牢固的外交關係。這是個令人愉悅的時刻，但是[FROM.GetAdjective]方面此行的目的主要是與我們討論對其困境中的國家展開投資。儘管馬克思主義理論指出，革命將只會在工業化社會中發生，但我國自身的歷史及[FROM.GetAdjective]人的經驗又顯示不一定非要如此。\n\n與會官員們都有著強烈的共鳴，認為在我國自身資源充裕的情況下，我國應當援助[FROM.GetAdjective]人。然而，我國亦需要這些資源——這也是在座所有官員的共識。如此，我們應當如何決斷？"
 bftb_greece.190.a: "[ROOT.GetNameDefCap]將勻出部分戰略資源支援[FROM.GetNameDef]建設。"
 bftb_greece.190.b: "不，這次暫不進行投資。"
 bftb_greece.190.c: "[ROOT.GetAdjective]人民不會為了[FROM.GetAdjective]農民能在工廠做工而遭罪。"
 bftb_greece.191.t: "[ROOT.GetAdjective]官員結束對[FROM.GetNameDef]調研"
 bftb_greece.191.desc: "當[FROM.GetAdjective]人決定邀請我們進一步討論深化兩國經濟聯繫的問題時，我們自然無法拒絕。不過究竟是什麼導致[FROM.GetAdjective]人變得如此絕望，以至於他們竟然向我們尋求經濟援助？不用說，在談及提升[FROM.GetAdjective]工業水平所能帶來的好處時，他們給出了引人入勝的理由……尤其是能夠提升我國自身實力這一點上。但究竟是對其進行投資，還是任其工業潛力自由發展，這是接下來我們需要考慮的問題。"
 bftb_greece.191.a: "可以通過對抗反動派的名義擴充他們的軍備。"
 bftb_greece.191.b: "不，這次暫不進行投資。"
 bftb_greece.191.c: "[ROOT.GetAdjective]人民不會為了[FROM.GetAdjective]農民能在工廠做工而遭罪。"
 bftb_greece.192.t: "[FROM.GetAdjective]官員提出投資我國被忽視西伯利亞省區的回購計劃"
 bftb_greece.192.desc: "我國日前接待了來自[FROM.GetNameDef]的代表，就[ROOT.GetAdjective]日益干涉該國內政的問題轉達了其政府的憂慮。為此，該國代表獲得授權與我方展開如下談判：在他們向我方提供物資的情況下，作為交換，我方應當有義務保障該國權益。\n\n我們當然否認發生了任何所謂干涉，儘管事實的確如此。這項提案誠然是慷慨的，在維護國家主權方面，[FROM.GetAdjective]的意念顯然是堅定的。我們當然可以獲取大量的物資，但與此同時，我們亦可就此徹底使[FROM.GetNameDef]俯首帖耳……"
 bftb_greece.192.a: "[FROM.GetAdjective]的計劃已獲政治局批准，可繼續進行。"
 bftb_greece.192.b: "最高統帥部認為以軟實力影響[FROM.GetNameDef]更為奏效。"
 bftb_greece.192.c: "[ROOT.GetNameDefCap]與[FROM.GetNameDef]的貿易協商到此為止。"
 bftb_greece.193.t: "[FROM.GetNameDef]投資案！"
 bftb_greece.193.desc: "在結束對我們[FROM.GetAdjective]朋友的愉悅訪問後，我國最優秀的頭腦們已經返回祖國並帶回了互利投資與機遇的好消息！我等雙方的努力定將造福[ROOT.GetAdjective]和[FROM.GetAdjective]兩國人民，共建潛力無限的未來夥伴關係。"
 bftb_greece.193.a: "好事或將接踵而至。"
 bftb_greece.194.t: "[FROM.GetAdjective]決定暫不投資"
 bftb_greece.194.desc: "唉，我們已經接到消息：[FROM.GetAdjective]這次將不會向我國經濟投資。儘管[FROM.GetAdjective]的代表並未排除他們未來對我們的投資預期，這仍然是一件令人失望的事情。"
 bftb_greece.194.a: "或許還算因禍得福……"
 bftb_greece.195.t: "[FROM.GetAdjective]無視我國代表並驅逐外交官！"
 bftb_greece.195.desc: "我們可能真的對投資操之過急了：[FROM.GetAdjective]日前已決計其無意再對我國工業建設進行投資。唉，如果他們不願幫助我們構建美好未來，那就隨他們去吧。"
 bftb_greece.195.a: "現在我國真的只能自行應對經濟困境了。"
 bftb_greece.200.t: "伊拉克利翁會議閉幕-大獲成功！"
 bftb_greece.200.desc: "伊拉克利翁會議至此正式結束，這無疑是外交上的大獲成功！所有與會國都獲得了各自的領土保障，顯然[GRE.GetNameDef]已是躍躍欲試，意欲大舉開疆拓土。我等諸國必會齊心協力，將比色佛爾條約更為殘酷的條約報復到[TUR.GetName]頭上。"
 bftb_greece.200.a: "我們必將為此傾盡全力。"
 bftb_greece.201.t: "伊拉克利翁會議閉幕"
 bftb_greece.201.desc: "伊拉克利翁會議至此正式結束，結果可謂是巨大的成功！除[ENG.GetNameDef]外，所有與會國都獲得了各自的領土保證，顯然[GRE.GetNameDef]已是躍躍欲試，意欲大舉開疆拓土。我等諸國必會齊心協力，將比色佛爾條約更為殘酷的條約報復到[TUR.GetName]頭上。"
 bftb_greece.201.a: "好耶！"
 bftb_greece.201.b: "無稽之談！"
 bftb_greece.202.t: "伊拉克利翁會議閉幕"
 bftb_greece.202.desc: "伊拉克利翁會議至此正式結束，結果可謂是巨大的成功！除[FRA.GetNameDef]外，所有與會國都獲得了各自的領土保證，顯然[GRE.GetNameDef]已是躍躍欲試，意欲大舉開疆拓土。我等諸國必會齊心協力，將比色佛爾條約更為殘酷的條約報復到[TUR.GetName]頭上。"
 bftb_greece.202.a: "偉大的創舉！"
 bftb_greece.202.b: "這些大傻瓜……"
 bftb_greece.203.t: "伊拉克利翁會議閉幕"
 bftb_greece.203.desc: "伊拉克利翁會議至此正式結束，結果可謂是絕佳的勝利！除[ITA.GetNameDef]外，所有與會國都獲得了各自的領土保證，顯然[GRE.GetNameDef]已是躍躍欲試，意欲大舉開疆拓土。我等諸國必會齊心協力，將比色佛爾條約更為殘酷的條約報復到[TUR.GetName]頭上。"
 bftb_greece.203.a: "極好的結果！"
 bftb_greece.203.b: "牢記被暗中捅刀勝利之辱……"
 bftb_greece.204.t: "伊拉克利翁會議閉幕"
 bftb_greece.204.desc: "伊拉克利翁會議至此正式結束，結果僅可說是……尚可接受。由於在對[TUR.GetNameDef]的瓜分當中未能獲得任何領土保障，[ENG.GetNameDef]和[FRA.GetNameDef]均不會參與接下來的戰事。當然，若是[GRE.GetNameDef]有實力獨自擊敗[TUR.GetNameDef]，那麼它也亦可大舉開疆拓土……"
 bftb_greece.204.a: "至少也是個外交勝利。"
 bftb_greece.204.b: "簡直是浪費時間……"
 bftb_greece.205.t: "伊拉克利翁會議閉幕"
 bftb_greece.205.desc: "伊拉克利翁會議至此正式結束，結果可謂是完美的勝利！除[ENG.GetNameDef]和[ITA.GetNameDef]外，所有與會國都獲得了各自的領土保證，顯然[GRE.GetNameDef]已是躍躍欲試，意欲大舉開疆拓土。我等諸國必會齊心協力，將比色佛爾條約更為殘酷的條約報復到[TUR.GetName]頭上。"
 bftb_greece.205.a: "有得必有失！"
 bftb_greece.205.b: "簡直是浪費時間……"
 bftb_greece.205.c: "我們不會容忍再遭背叛！"
 bftb_greece.206.t: "伊拉克利翁會議閉幕"
 bftb_greece.206.desc: "伊拉克利翁會議至此正式結束，結果可謂是完美的勝利！除[FRA.GetNameDef]和[ITA.GetNameDef]外，所有與會國都獲得了各自的領土保證，顯然[GRE.GetNameDef]已是躍躍欲試，意欲大舉開疆拓土。我等諸國必會齊心協力，將比色佛爾條約更為殘酷的條約報復到[TUR.GetName]頭上。"
 bftb_greece.206.a: "至少也是個外交勝利。"
 bftb_greece.206.b: "簡直是浪費時間……"
 bftb_greece.206.c: "我們不會容忍再遭背叛！"
 bftb_greece.207.t: "希臘國民聯盟發動政變！"
 bftb_greece.207.desc: "我們早該料想到事態將會如此：希臘國民聯盟的黨魁如今不僅指責我們軟弱無能，同時還聲稱我們是阻礙[ROOT.GetAdjective]崛起的最直接障礙。這些惡棍在希臘議會煽動起來一場聲勢浩大的攻訐，指責我們是叛徒，並揚言他們將不惜一切代價來推翻我們。果然，當他們戲劇性的集體離開議會幾個小時之後，他們就帶著暴民返回了現場，並且威逼我們立刻集體辭職。\n\n民意並不站在我們這一邊，而且說實話，許多政府閣僚對於本屆政府是否還能兌現那些向國民作出的承諾已經失去了信心。普遍的看法是，在沒有得到外國或者公眾支持的情況下，向君士坦丁堡發起進攻會將我們整個國家送上萬劫不復之路。"
 bftb_greece.207.a: "我們必須為失敗付出代價。"
 bftb_greece.207.b: "雅典永遠不可能交給那幫法西斯狗！"
 byzantinist_coup_tt: "§Y信奉拜占庭主義的法西斯黨人§!將組建新政府！\n"
 byzantinist_civil_war_inevitable_tt: "§Y拜占庭主義者§!將在不久後再次嘗試將我們從政府中擠走……\n"
 bftb_greece.209.t: "我國兌現伊拉克利翁會議承諾！"
 bftb_greece.209.desc: "我們已肢解了土耳其人此前的國家，並將各自的戰利品分配給了勝利者們。我們對盟友以及本國人民均已盡到義務，如此一來，距離實現[ROOT.GetNameDef]數個世紀來真正的偉大僅剩一步之遙。"
 bftb_greece.209.a: "這誠然是我們最輝煌的時刻。"
 megali_idea_honoured_greece_tt: "我國已如約分配§Y伊拉克利翁會議§!期間許諾給盟友們的領土。\n"
 bftb_greece.210.t: "希臘人兌現伊拉克利翁會議承諾！"
 bftb_greece.210.desc: "正如此前約定的那樣，我們此前得到保障的地區現已從被擊敗的土耳其國家當中分割出來並交由我方處置。帝國主義的確是骯髒的生意，但沒有人比我們更懂。"
 bftb_greece.210.a: "精確無誤地得到落實。"
 megali_idea_honoured_tt: "§Y[GRE.GetNameDef]§!於§Y伊拉克利翁會議§!期間許諾的領土已經移交。"
 bftb_greece.213.t: "[FROM.GetAdjective]拒絕償還我國債務！"
 bftb_greece.213.desc: "那些放蕩不羈的[FROM.GetAdjective]竊賊竟敢決定欠債跑路！？數十年來，我們認真簽署並執行了這些債務協議，他們竟膽敢稱其為非法債務？如果他們認為自己可以在欺騙我們後安然無事，那他們就錯了——必須承擔相應後果！儘管不可否認的是，我們確實已經為鉅額債務一事，縱容又懲戒[FROM.GetNameDef]多次了。"
 bftb_greece.213.a: "這些該死的寄生蟲！"
 bftb_greece.213.b: "這也是把他們逼得太緊的結果。"
 bftb_greece.217.t: "哈利卡納蘇斯大法西斯會議"
 bftb_greece.217.desc: "曾幾何時，法西斯主義在[ROOT.GetNameDef]也算是溫和的社會思潮。但如今在[ROOT.GetLeader]的領導下，它已經發展壯大到了可以讓全國法西斯運動的黨魁們齊聚一堂討論這個國家未來的地步了。[ROOT.GetLeader]打算運用他獨斷的統治以及法西斯主義來重塑國家。而作為我國最傑出的國家社會主義者，喬治·默庫里斯相信對[ROOT.GetNameDef]來說最好的道路就是罷免那個不受歡迎的國王，以此將國家帶入真正的激進政治體系之中。\n\n[ROOT.GetLeader]就大希臘國家闡述了自己的構想，認為其領土應從阿爾巴尼亞延伸到塞浦路斯，除此之外，默庫里斯還認為[ROOT.GetAdjective]的人民對於光輝歷史的回溯是邁向偉大的必要條件。梅塔克薩斯則認為，應當立足於第三希臘文明現狀，以期在未來締造更加偉大的希臘，而默庫里斯對此認為第三希臘文明的根源仍然來自第一希臘文明。對於[ROOT.GetNameDef]法西斯化未來的構想，兩位巨頭在薩摩斯發表了截然不同的觀點。"
 bftb_greece.217.a: "梅塔克薩斯必須領導我們的法西斯化王國！"
 GRE_metaxist_monarchist_fascism_tt: "§Y喬治二世§!將繼續在位，§Y大希臘國§!將成為可建立國家。\n£faction_gre_monarchist §Y君主派§!將變為忠誠。"
 bftb_greece.217.b: "默庫里斯將實現我們的帝國野望！"
 GRE_republican_national_socialism_tt: "§Y喬治二世§!將會遜位，但我國將有機會再興§Y阿吉德王朝榮光§!。\n£faction_gre_monarchist §Y君主派§!將變為無關緊要。"
 bftb_greece.218.t: "安納托利亞裔法西斯叛亂！"
 bftb_greece.218.desc: "終焉已至；值此至暗時刻，卑鄙的喬治·科斯米迪斯現已號召其黨羽武裝起來集結於希臘國民聯盟的旗幟下，進軍[ROOT.GetNameDef]毀滅我們乃至愛琴海沿岸的任何所有者。事到如今，我們唯一可以確信的是，[ROOT.GetNameDef]的未來已然命運多舛。"
 bftb_greece.218.a: "法西斯絕不會主宰[ROOT.GetNameDef]命運！"
 bftb_greece.218.b: "也許錯在我方，沒準希臘國民聯盟還能拯救[ROOT.GetNameDef]。"
 bftb_greece.220.t: "[FROM.GetNameDefCap]同意促進希塞統一！"
 bftb_greece.220.desc: "歷經多年坎坷，當[ROOT.GetLeader]向全國宣佈即將實現作為[ROOT.GetAdjective]夙願的希塞統一時，整個首都可以說都沉浸在了歡樂的海洋中，這一切都要感謝我們的[FROM.GetAdjective]朋友。我國行政官員現已動身前往塞浦路斯，以確保權力過渡儘可能順利進行。\n\n對於[ROOT.GetNameDef]來說，這是一個偉大而極富歷史意義的日子。塞浦路斯長久以來便是[ROOT.GetAdjective]共同體的一部分，而現在，他們終於重回其文明發源的大家庭。"
 bftb_greece.220.a: "終於再度團圓！"
 bftb_greece.221.t: "伊拉克利翁會議-[FRA.GetAdjective]屬託管領案通過！"
 bftb_greece.221.desc: "大多數與會代表投票表決認為，在成功擊敗[TUR.GetAdjective]之後，庫爾德斯坦應當交由[FRA.GetNameDef]託管。[FRA.GetAdjective]官員高度讚揚了與會代表們傑出睿智的政治家風範，他們業已向[FRA.GetAdjective]中央政府彙報了決議有關結果，同時提請相關方面著手製定未來當地的行政規劃事宜。"
 bftb_greece.221.a: "贊成派勝出！"
 bftb_greece.222.t: "伊拉克利翁會議-[FRA.GetAdjective]屬託管領案否決！"
 bftb_greece.222.desc: "大多數與會代表投票表決認為，在成功擊敗[TUR.GetAdjective]之後，[FRA.GetNameDef]不應對任何庫爾德領土有所覬覦。如此羞辱幾欲令[FRA.GetAdjective]官員憤而離席，法方怒斥此事實乃荒謬至極。但即便如此，在達成共識之前，法方仍舊希望能夠影響接下來的議程，儘管他們目前暫且一無所獲。"
 bftb_greece.222.a: "反對派勝出！"
 bftb_greece.223.t: "伊拉克利翁會議-[ENG.GetAdjective]屬保護領案通過！"
 bftb_greece.223.desc: "大多數與會代表投票表決認為，在成功擊敗[TUR.GetName]之後，[ENG.GetNameDef]有權在其廢墟上重塑一個亞美尼亞保護領。[ENG.GetAdjective]官員高度讚揚了與會代表們傑出睿智的政治家風範，他們業已向[ENG.GetAdjective]中央政府彙報了決議有關結果，同時提請相關方面著手製定未來當地的行政規劃事宜。"
 bftb_greece.223.a: "贊成派勝出！"
 bftb_greece.224.t: "伊拉克利翁會議-[ENG.GetAdjective]屬保護領案否決！"
 bftb_greece.224.desc: "大多數與會代表投票表決認為，[ENG.GetNameDef]不應在[TUR.GetNameDef]北部建立所謂的亞美尼亞保護領。[ENG.GetAdjective]官員對此項決議表示譴責，並且還挖苦諷刺整場會議簡直就是一團糟。但即便如此，英方仍舊留席並希望能夠影響接下來的議程，儘管他們目前暫且一無所獲。"
 bftb_greece.224.a: "反對派勝出！"
 bftb_greece.225.t: "伊拉克利翁會議-[ITA.GetAdjective]屬殖民地案通過！"
 bftb_greece.225.desc: "大多數與會代表投票表決認為，在成功擊敗[TUR.GetName]之後，[ITA.GetNameDef]有權在其殘骸中瓜分得到殖民領地。[ITA.GetAdjective]官員高度讚揚了與會代表們明智的抉擇，儘管決議尚未正式公佈，但已有許多[ITA.GetAdjective]代表團成員啟程回國，向其領袖[ITA.GetLeader]彙報此事。"
 bftb_greece.225.a: "贊成派勝出！"
 bftb_greece.226.t: "伊拉克利翁會議-[ITA.GetAdjective]屬殖民地案否決！"
 bftb_greece.226.desc: "大多數與會代表投票表決認為，[ITA.GetNameDef]不應在[TUR.GetNameDef]南部建立任何所謂的殖民地，同時也譴責提出此議案的[ITA.GetAdjective]不過為愚蠢至極的戰爭販子。如此羞辱遭到了[ITA.GetAdjective]官員的猛烈回擊，其引用此決議，揚言這隻會使[ITA.GetAdjective]人民更加牢記“被捅刀的勝利”羞辱所帶來的仇恨。但無論[ITA.GetAdjective]代表個人看法如何，他們仍舊受命繼續留席會議——毫無疑問他們仍試圖對會議最後且最重要的議案施加影響。"
 bftb_greece.226.a: "反對派勝出！"
 bftb_greece.227.t: "[GRE.GetAdjective]和[TUR.GetNameDef]邊境衝突升級"
 bftb_greece.227.desc: "[GRE.GetAdjective]對[341.GetName]的突襲如預料中失敗了，隨著愛琴海地區衝突的升級，我們獲得了以[GRE.GetNameDef]之名介入干涉的絕佳機會。我們應當派軍前往高加索地區並陳兵於[TUR.GetAdjective]邊境。當[GRE.GetAdjective]發出信號的時候，我們將夾擊[TUR.GetAdjective]軍隊並打一場師出有名的戰爭。"
 bftb_greece.227.a: "我們會做好準備的。"
 bftb_greece.228.t: "[SOV.GetAdjective]已被擊敗"
 bftb_greece.228.desc: "驚人的消息現已傳至我國首都：[SOV.GetNameDef]無敵的軍隊竟然未能突破[TUR.GetAdjective]的防線。事已至此，他們不會再在入侵當中支援我們，更有甚者他們業已取消了所有的計劃和預定攻勢，同時默許[TUR.GetAdjective]對我們施以任何在其看來合理的處置方式。"
 bftb_greece.228.a: "這可不是個好兆頭……"
 bftb_greece.229.t: "[GRE.GetNameDefCap]照會我國履行承諾"
 bftb_greece.229.desc: "[GRE.GetNameDefCap]已與[TUR.GetNameDef]開戰，並請求我國按照先前的承諾加入戰爭。雖然履行戰爭承諾帶來的利益是巨大的，並且未來有機會謀取更多的利益，但是或許我們眼下沒有能力履行義務——即使那意味著放棄我們此前的宣稱。"
 bftb_greece.229.a: "共赴戰爭！"
 bftb_greece.229.b: "情況有變。"
 bftb_greece.230.t: "[FROM.GetNameDefCap]履行承諾"
 bftb_greece.230.desc: "正如他們此前承諾的那樣，[FROM.GetNameDefCap]現已加入我們對抗[TUR.GetNameDef]的戰爭，我們將攜手粉碎[TUR.GetAdjective]。"
 bftb_greece.230.a: "我們不可能輸！"
 bftb_greece.231.t: "[FROM.GetNameDefCap]背棄承諾！"
 bftb_greece.231.desc: "[FROM.GetNameDefCap]不僅背棄了協助我國的承諾，並且還放棄了此前對[TUR.GetNameDef]的宣稱！他們背叛了我們，糟踐了我們所有的努力。即便如此，我們仍然要堅信即便沒有[FROM.GetAdjective]的協助，我國也依然有能力獲得勝利。"
 bftb_greece.231.a: "這些懦夫！"
 bftb_greece.232.t: "巴西琉斯降世？"
 bftb_greece.232.desc: "奇蹟現已降臨我國：聖查士丁尼從天堂帶給了我們神諭。日前，聖地忠誠的守護者們在阿索斯山附近的海岸發現了一個衣衫襤褸的將死之人。這位此前因徒步潛入[ROOT.GetNameDef]而被當局逮捕遣返的德國瘋子，現在被來自希臘國民聯盟的學者認定是失落已久的科穆寧王室繼承人。\n\n對於由誰來領導我們的拜占庭國家的問題，我們早已覺得十分棘手，但現在看來上帝已經賜予了我們解決方案。雖然這個拜占庭的繼承人不會說希臘語，但是可以教他。果然，[ROOT.GetNameDef]是承蒙上帝洪恩青睞的聖地。"
 bftb_greece.232.a: "阿道夫一世巴西琉斯陛下萬歲！"
 bftb_greece.232.b: "等一下，如果他真的只是個瘋子呢？"
 bftb_greece.233.t: "揚尼斯·梅塔克薩斯逝世"
 bftb_greece.233.desc: "在染病一段時間後，[ROOT.GetNameDef]首相及獨裁者——梅塔克薩斯，作為祖國淪陷後的流亡領袖日前不幸客死他鄉。儘管他並不特別受[ROOT.GetAdjective]人民愛戴，但卻在國家危難之際成為了民族團結以及抵抗侵略的象徵。隨著梅塔克薩斯的逝世，作為團結各派的韋尼澤洛斯黨人士，埃馬努伊爾·楚澤羅斯將繼任[ROOT.GetNameDef]首相職務。"
 bftb_greece.233.a: "戰爭亦將繼續。"
 bftb_greece.234.t: "偉大理想獲得通過"
 bftb_greece.234.desc: "我們日前收到消息稱，出席伊拉克利翁會議的列強已經通過了[GRE.GetAdjective]的“偉大理想”提案。此結果不僅對本地區的穩定構成了威脅，同時也使得[GRE.GetNameDef]和[TUR.GetNameDef]兩國在不遠的未來爆發戰爭的風險急劇攀升。\n\n鑑於[GRE.GetNameDef]獲得[FRA.GetNameDef]和[ENG.GetNameDef]軍事支持的可能性已不可忽視，我方如今或許已站錯了隊列，在軍事上表態支持[TUR.GetNameDef]或許會鑄成同時對抗兩大列強的災難。我國軍方領導層建議我們考慮此因素，重新評估我們對[TUR.GetNameDef]所作出的協防承諾。"
 bftb_greece.234.a: "土耳其人只能自謀生路了。"
 bftb_greece.234.b: "我們會不惜任何代價信守承諾！"
 bftb_greece.235.t: "[ROM.GetName]撤銷獨立保障"
 bftb_greece.235.desc: "看來伊拉克利翁會議的結果已經徹底驚嚇到了我們的[ROM.GetAdjective]庇護者，出於對和歐洲列強開戰風險的畏懼，他們最終選擇撤回對我國防務的軍事援助承諾。"
 bftb_greece.235.a: "這些懦夫！"
 bftb_greece.236.t: "[SOV.GetNameDefCap]拒絕協助對抗[TUR.GetNameDef]"
 bftb_greece.236.desc: "儘管[SOV.GetNameDef]無疑有意擴大其影響力，但其仍決定不支援我們影響[TUR.GetNonIdeologyName]的計劃。他們希望專注於其他事務。"
 bftb_greece.236.a: "無論如何我們都會繼續"
 bftb_greece.236.b: "也許我們有點太心急了"
 bftb_greece.237.t: "[FROM.GetName]支持對抗[TUR.GetNonIdeologyName]的計劃"
 bftb_greece.237.desc: "[FROM.GetNameDef]外交官通知我們，[FROM.GetLeader]將支持我們對抗[TUR.GetNameDef]的計劃。我方軍事情報部門的報告也顯示他們已經開始向[TUR.GetAdjective]邊境調動軍隊。"
 bftb_greece.237.a: "好消息！"
 bftb_turkey.1.t: "蒙特勒公約"
 bftb_turkey.1.desc: "日前，[TUR.GetLeader]總統告知我國，其治下的[TUR.GetNameDef]正打算推進土耳其海峽再軍事化的有關事項。[TUR.GetAdjective]政府希望我國在此事上予以支持並適當修改洛桑條約，以使其主張合乎國際法則。\n\n若是對[TUR.GetAdjective]的主張予以支持，毫無疑問將會使其感恩戴德並在外交上交好我國，如此，或可扶持[TUR.GetNameDef]在地中海抗衡[ITA.GetNameDef]。然而，介入這場爭端顯然也可能使我國與[SOV.GetNameDef]站在敵對立場，而在最壞的情況下，我等兩國甚至將因此爆發戰爭。"
 bftb_turkey.1.a: "我國將在此議案上支持土耳其。"
 bftb_turkey.1.b: "不列顛帝國並不認為其與土耳其沾親帶故。"
 TUR_britain_backs_turkey_tt: "\n我們將支持§Y[TUR.GetNameDef]§!獲權掌控§Y土耳其海峽§!的通行權。\n\n§R若是§Y[TUR.GetNameDef]§!和§Y[SOV.GetNameDef]§!之間極可能爆發戰爭，我們屆時尚且亦可取消此支持。§!"
 TUR_britain_unentangles_itself_tt: "\n我們將把§Y[TUR.GetNameDef]§!留給§Y[SOV.GetNameDef]§!並寄希望於後者對其網開一面。如此§Y土耳其海峽§!或許將繼續對世界各國保持暢通。"
 bftb_turkey.2.t: "[ENG.GetName]許諾支持"
 bftb_turkey.2.desc: "[ENG.GetLeader]日前已公開聲明，[ENG.GetNameDef]決定支持我國實現自主支配本國海峽的目標。贏得[ENG.GetNameDef]的支持對我國而言意義非凡，這將在很大程度上強化我國主張在世界範圍內的合法性。"
 bftb_turkey.2.a: "那現在就等著[SOV.GetNameDef]的答覆了。"
 bftb_turkey.3.t: "[ENG.GetName]拒絕支持！"
 bftb_turkey.3.desc: "[ENG.GetLeader]日前向[TUR.GetLeader]回覆了一封長信，詳盡解釋了[ENG.GetNameDef]目前無力捲入一場外國爭端的原因。[ENG.GetLeader]基於[ENG.GetNameDef]目前國內匱乏的參戰熱情，以及其本人對[TUR.GetAdjective]是否做好準備與[SOV.GetNameDef]交戰的懷疑這兩點理由，表示[ENG.GetNameDef]將不會介入局勢當中。\n\n除了對我國掌控土耳其海峽表示默認外，[ENG.GetName]將不會再給予更多幫助。"
 bftb_turkey.3.a: "那現在就等著[SOV.GetNameDef]的答覆了。"
 bftb_turkey.4.t: "[TUR.GetNameDef]奪取博斯普魯斯控制權！"
 bftb_turkey.4.desc: "[TUR.GetLeader]日前宣佈，[TUR.GetNameDef]將全面接管土耳其海峽，藉由此，[TUR.GetAdjective]政府將有權自主決定是否准予我方通行海峽！這顯然是不可接受的：畢竟如此一來，只要[TUR.GetAdjective]認為在政治上有利可圖，他們便會隨時封困我國的黑海艦隊。"
 bftb_turkey.4.a: "立即動員武裝部隊！"
 bftb_turkey.4.b: "這不過是無關緊要的鬧劇。"
 TUR_soviets_oppose_turkey_tt: "\n§Y[TUR.GetAdjective]§!政府將在向我方遞交妥協案，亦或是升級事態間作出抉擇。\n\n§R當武裝衝突一觸即發時，我們尚且還有機會緩和局勢。§!"
 TUR_soviets_allow_militarisation_tt: "§Y土耳其海峽§!將實現再軍事化，且§Y[TUR.GetNameDef]§!將獲權管理此地的海域通行。"
 bftb_turkey.5.t: "[SOV.GetName]反對海峽再軍事化！"
 bftb_turkey.5.desc: "[SOV.GetNameDef]外交官日前已明確表示，他們認為我國單方面宣佈收回土耳其海峽通行權的做法是不合乎國際法規的，鑑於此，他們亦打算採取極端措施迫使我們改變決定。儘管我方外交官據理力爭，但[SOV.GetAdjective]外交官出於維護該國利益的考量，揚言並不排除對[TUR.GetNameDef]進行軍事幹涉的可能性。\n\n即使是[SOV.GetNameDef]方面也必須承認，維持當下的和平已實屬不易。因此，如果我們向其遞交一份妥協案，即允許所有黑海沿岸國家自由進出海峽的話，那麼縱使是[SOV.GetNameDef]也將不得不予以接受，除非其希望與全世界為敵。"
 bftb_turkey.5.a: "我國將遞交妥協方案。"
 bftb_turkey.5.b: "此事理所當然，何來妥協退讓？！"
 TUR_strait_compromise_tt: "§Y[SOV.GetNameDefCap]§!以及其他所有§Y黑海§!沿岸國家將繼續享有§Y土耳其海峽§!的自由通行權。"
 TUR_remaining_defiant_tt: "\n我們將繼續堅持享有對任何途經§Y土耳其海峽§!航運的管轄權。\n\n§R這可能是我們緩和局勢的最後機會：如果[SOV.GetNameDef]方面繼續施壓，則將引發戰爭！§!"
 bftb_turkey.6.t: "[SOV.GetName]默許海峽再軍事化！"
 bftb_turkey.6.desc: "[SOV.GetAdjective]政府日前發表了簡短的聲明，閃爍其詞地作出了“破壞和平”必將遭到打擊和懲罰之類的警告，但在私底下，我國官員確信[SOV.GetNameDef]只是逞口舌之快，並不會採取任何報復性的行動。\n\n[TUR.GetLeader]藉由廣播，於伊斯坦布爾向全國發表了熱情洋溢的演說，宣告此[TUR.GetNameDef]外交上的巨大勝利。全國民眾對政府的支持度也隨之大幅提升，我們已經可以期待為了歡慶如此決定性的勝利而在全國各地舉行的慶祝活動了。"
 bftb_turkey.6.a: "這即是國內和平與世界和平！"
 bftb_turkey.7.t: "[TUR.GetNameDefCap]就海峽再軍事化妥協"
 bftb_turkey.7.desc: "經過漫長的討價還價後，[TUR.GetAdjective]政府最終決定在收回海峽控制權的前提下，准許所有黑海沿岸國家繼續自由進出海峽。在此問題上，[TUR.GetNameDef]的堅定立場幾乎不容許再有任何妥協的餘地，隨著局勢緩和，被我國牽連卷入此事的[BUL.GetNameDef]和[ROM.GetNameDef]兩國亦已對此協議匆匆表示了認可。"
 bftb_turkey.7.a: "很好，這場危機可算是結束了。"
 bftb_turkey.8.t: "黑海衝突將至"
 bftb_turkey.8.desc: "[SOV.GetName]日前已就[TUR.GetNameDef]計劃收回該國海峽控制權一事提出了抗議，然而迄今為止，[TUR.GetNameDef]在面對[SOV.GetAdjective]的威脅時仍然毫無退縮之意。顯然，如果[TUR.GetNameDef]繼續堅持其主權，而[SOV.GetNameDef]又致力於推進其在此地區的主導的話，局勢恐怕將升級為武裝衝突。\n\n眼下，改變此地區均勢的力量掌握在我方手中：我們必須在與[TUR.GetNameDef]簽署保障獨立條約正式予以支持，進而威懾蘇聯；亦或是置身事外，指望這兩個國家彼此化干戈為玉帛之間作出抉擇。"
 bftb_turkey.8.a: "我國必須援助[TUR.GetNameDef]反抗布爾什維克暴政。"
 bftb_turkey.8.b: "綏靖[SOV.GetAdjective]的擴張不過是和平的微小代價！"
 TUR_britain_stands_up_for_turkey_tt: "\n即使爆發戰爭我們亦將支持§Y[TUR.GetNameDef]§!。§R[SOV.GetNameDefCap]將獲得緩和局勢的最後機會！§!"
 TUR_britain_abandons_turkey_tt: "\n當我們放棄對§Y[TUR.GetNameDef]§!的支持時，§Y[TUR.GetAdjective]政府§!將獲得緩和局勢的最後機會。"
 bftb_turkey.9.t: "[ENG.GetAdjective]拋棄我國"
 bftb_turkey.9.desc: "[ENG.GetLeader]首相已公開發表聲明，鑑於我國和[SOV.GetNameDef]日益緊張的關係，[ENG.GetNameDef]將不會捲入所謂的“地區爭端”當中。[ENG.GetLeader]忌憚於[ENG.GetAdjective]在上次大戰中蒙受的慘烈傷亡，決意對[SOV.GetNameDef]採取綏靖政策。\n\n此項聲明立刻在安卡拉引起了恐慌，而[TUR.GetLeader]僅能對此痛斥[ENG.GetNameDef]的懦弱無能。"
 bftb_turkey.9.a: "萬事休矣，如今我們只能聽憑[SOV.GetNameDef]處置。"
 bftb_turkey.9.b: "就當無事發生，我們必須堅持到底。"
 TUR_straits_remain_demilitarised_tt: "\n§Y土耳其海峽§!將維持非軍事化狀態，除非我國進入戰時，否則我們將無權管轄途經§Y土耳其海峽§!的航運通行。\n\n§R這是我們緩和局勢的最後機會：如果[SOV.GetNameDef]方面繼續施壓，則將引發戰爭！§!"
 TUR_we_remain_committed_tt: "\n§R[SOV.GetNameDefCap]將獲得緩和局勢的最後機會，但如果其無意緩和，則將引發戰爭！§!"
 bftb_turkey.10.t: "[TUR.GetAdjective]拒不退讓"
 bftb_turkey.10.desc: "即便面對壓倒性的力量，[TUR.GetLeader]最終還是拒絕在[TUR.GetAdjective]方面於土耳其海峽的主權問題上作出任何讓步。緊張局勢急劇升溫，雙方已然各自陳兵於[TUR.GetAdjective]和[SOV.GetAdjective]兩國邊境，呈劍拔弩張的態勢。[TUR.GetLeader]宣稱此次危機為“決定[TUR.GetNameDef]國運的時刻”，其立誓[TUR.GetNameDef]將絕不會在[SOV.GetAdjective]暴政的淫威下屈服。"
 bftb_turkey.10.a: "不值得為土耳其海峽進行全面戰爭。"
 bftb_turkey.10.b: "[TUR.GetNameDefCap]將在我們面前屈膝臣服！"
 bftb_turkey.11.t: "[TUR.GetNameDefCap]屈服於我國要求"
 bftb_turkey.11.desc: "日前[TUR.GetLeader]已抵達莫斯科並受到了熱情的接待，伴隨著全副武裝的警衛的“保護”，他被迫在此與蘇方簽訂了新的條約。而這份新條約迫使[TUR.GetAdjective]全面放棄了對土耳其海峽實現軍事化或警備化的主權。其後[TUR.GetAdjective]總統被打發回國，還被贈予了一隻屬於[SOV.GetLeader]的菸斗，以作為他“訪問[SOV.GetNameDef]的紀念品”。\n\n此次成功在本國海域彰顯了我國實力，對我們而言誠為巨大的勝利。為此，我國駐紮於毗鄰[TUR.GetAdjective]邊境上的軍隊將被允許放假三天，以利用假期舉辦各種聲勢浩大且兼具羞辱性質的慶祝活動。"
 bftb_turkey.11.a: "整個世界都應畏懼於[SOV.GetNameDef]的力量。"
 bftb_turkey.12.t: "[SOV.GetName]退讓低頭"
 bftb_turkey.12.desc: "[SOV.GetLeader]日前親自致電[TUR.GetLeader]，在通話中他剋制地呼籲緩和兩國間的緊張局勢，並且還讚揚了[TUR.GetAdjective]總統“為反帝鬥爭事業所做出的貢獻”。[SOV.GetAdjective]官兵已被命令漸停其在[SOV.GetAdjective]一側邊境線上的軍事調動，而[SOV.GetNameDef]業已撤回了此前對[TUR.GetName]收回土耳其海峽的有關控訴。\n\n在經歷慘烈的獨立戰爭後，[TUR.GetAdjective]人民顯然不想再度被捲入一場大戰，因此，當[TUR.GetLeader]向全國宣告其國家兵不血刃地取勝時，百姓們都長出了一口氣。得益於[TUR.GetAdjective]人民在危急時刻的頑強和勇敢，[TUR.GetAdjective]的主權最終得到了捍衛。"
 bftb_turkey.12.a: "我們勝利了！"
 bftb_turkey.13.t: "[TUR.GetAdjective]-[SOV.GetAdjective]戰端開啟"
 bftb_turkey.13.desc: "就在6個小時以前，[SOV.GetAdjective]軍隊開始對特拉布宗地區的[TUR.GetAdjective]軍事設施展開炮擊，並且公然宣稱，作為馬克思主義革命的組成部分，他們將進軍[TUR.GetNameDef]以解放[TUR.GetAdjective]工人。而賣國賊謝菲克·許斯努早已迫不及待地宣佈成立所謂“土耳其人民共和國流亡政府”，其毫無疑問會在將來成為[SOV.GetNameDef]肆意操縱的傀儡。\n\n[TUR.GetLeader]在伊斯坦布爾露面，並憂心忡忡地宣佈[TUR.GetNameDef]進入戰爭狀態，但其後這位土耳其總統話鋒一轉，熱切地呼籲[TUR.GetAdjective]人民接受命運的召喚，再次為國家的自由和獨立而戰。儘管獨立戰爭的創傷尚未淡去，但群情激奮的[TUR.GetAdjective]人民依舊踴躍響應號召，蜂擁報名參軍。\n\n但問題在於，這樣的熱情，又能持續多久呢？"
 bftb_turkey.13.a: "以及……我們又能堅持多久呢？"
 bftb_turkey.14.t: "反對派勢力崛起"
 bftb_turkey.14.desc: "[TUR.GetAdjective]的政治學家們曾幾何時認為，只要推行政黨禁令，組織一場反對執政黨的運動便需要花費較長的時間，然而如今，隨著阿德南·曼德列斯振臂一呼後，那些對現今凱末爾主義者執政下的[TUR.GetNameDef]宗教政策不滿的傳統派團體驟然崛起，他們已被證明大錯特錯。在過去，每當宗教傳統派攛掇的政治運動蜂起時，[TUR.GetAdjective]的民主化進程便會受到阻礙甚至是中斷，但或許這次不會了：[TUR.GetLeader]此番決計在即將到來的選舉日當中，通過選舉堂堂正正地擊敗這些狂熱的政治運動。\n\n曼德列斯及其宗教傳統派黨羽如今已聚集在了被其稱作“傳統派黨團”的組織下，該組織被共和人民黨視作意欲在保守主義和傳統主義基礎上踐行伊斯蘭民粹主義的政治運動。總而言之，傳統派黨團勢必會在接下來的數週當中深入土耳其廣大鄉村地區佈道並建立支持者根據地，若是其聚集了足夠的支持者，屆時他們必定組建真正的反對派政黨來對抗執政當局。"
 bftb_turkey.14.a: "即將到來的選舉將決定[TUR.GetName]的前路。"
 bftb_turkey.16.t: "傳統派黨團在農民中拉票"
 bftb_turkey.16.desc: "阿德南·曼德列斯的傳統派黨羽已經遍佈全國各地大肆宣講，鼓動那些認為受到世俗政府壓迫的信教選民在即將舉行的選舉中投票支持其政黨。情報顯示，雖然這些選民既對推翻凱末爾派的執政持懷疑態度，亦對所謂民主無甚好感，但是絕大多數人也還是表現出了支持曼德列斯及其反對派勢力的熱情。"
 bftb_turkey.16.a: "這是違憲行為！立即停止！"
 bftb_turkey.16.b: "民主思想顯然已深入人心。"
 bftb_turkey.17.t: "傳統派黨團與庫爾德部族結盟"
 bftb_turkey.17.desc: "阿德南·曼德列斯的傳統派黨羽日前在[TUR.GetAdjective]屬庫爾德地區進行了一場公開遊行，就[TUR.GetNameDef]國家今日的信仰問題宣揚了其所謂的“宗教和解”及“共同利益”主張。而自稱受到經文典籍感召，庫爾德部族領袖們隨後與這些傳統派黨團負責人攜手登臺亮相，鼓勵庫爾德人在選舉日當中投票支持曼德列斯以“使[TUR.GetNameDef]重回先知的懷抱”。"
 bftb_turkey.17.a: "這簡直就是叛國！"
 bftb_turkey.17.b: "此次合作必將在未來獲益良多！"
 bftb_turkey.18.t: "農村選區發現舞弊現象"
 bftb_turkey.18.desc: "鑑於日前在某些[TUR.GetNameDef]農業省份發現了操縱選舉以便利阿德南·曼德列斯及其反對派勢力的陰謀，因此對於[TUR.GetNameDef]蹣跚起步的民主來說，這是沮喪的一天。不過所幸，這場涉及宗教領袖、地方官員甚至是政府內部成員的陰謀最終被挫敗，目前所有涉事者皆已收押待審。儘管我們的調查並未發現任何曼德列斯或其黨羽與該陰謀有所關聯的證據，但我們的反制行動顯然會影響其競選活動。"
 bftb_turkey.18.a: "公審並嚴懲他們！"
 bftb_turkey.18.b: "私下赦免他們並不予追究。"
 bftb_turkey.19.t: "曼德列斯支持者大型集會"
 bftb_turkey.19.desc: "日前，阿德南·曼德列斯在國家的中央腹地舉行了大型造勢集會，其規模幾乎堪比穆斯塔法·凱末爾·阿塔圖爾克在伊斯坦布爾市中心發表演說時的集會。儘管[TUR.GetLeader]聽聞此事時頗為不悅，但集會還是順利舉行，曼德列斯在會上宣佈，將在近期正式成立其反對政黨。此外，集會期間，一系列傳統派黨團演說者相繼登臺，這些信奉傳統主義的保守分子向與會聽眾大肆鼓吹宗教在日常生活乃至政治當中的重要地位，其中某些人甚至還在演說中對早已作古的奧斯曼蘇丹國和哈里發極盡吹捧！當然，曼德列斯本人也在集會尾聲登臺演講，相比較於其此前發表演說的擁躉們，他的演說修辭或許更富文采。曼德列斯一如往常地先向聽眾坦率承認了放任自由主義的好處，並且也對凱末爾派為國家所做的一切進行了認可，但旋即他便話鋒一轉，以先揚後抑的手法對凱末爾主義者們進行了大肆抨擊。與會者在狂熱的歡呼當中結束了集會，並且堅信他們必將在選舉當中獲勝。\n\n鑑於此，忠誠的凱末爾軍官團已與政府展開接洽，毫無疑問，他們敦促共和人民黨採取更多有效措施來遏制曼德列斯及其領導下的保守民粹主義運動。軍官團代表強調稱軍方絕不會效忠於曼德列斯政府，並且暗示道如果政府不能遏制這股動搖凱末爾主義根基的運動勢頭，軍方或將自行採取加以應對。"
 bftb_turkey.19.a: "此誠為共和國的至暗日。"
 bftb_turkey.20.t: "土耳其民主黨成立"
 bftb_turkey.20.desc: "就在8個小時前，阿德南·曼德列斯宣告了[TUR.GetNameDef]政壇最年輕但卻也最危險的反對派政黨：土耳其民主黨的正式成立。曼德列斯宣稱，民主黨將打破共和人民黨此前對國家政權的壟斷，並將帶領土耳其向著未曾預想的嶄新方向轉進。曼德列斯同時承諾，其政黨將秉承“信仰·祖國·自由”三大原則綱領治理國家。而更令人驚訝的是，曼德列斯還放下豪言，宣稱民主黨執政下的[TUR.GetName]，必將在今後的國際舞臺上表現得比建國以來的其他歷屆[TUR.GetAdjective]政府更加激進且主動。\n\n此消息著實令國內的凱末爾主義團體大為光火，對此[TUR.GetLeader]今天在伊斯坦布爾向其支持者們保證，儘管選情目前並不樂觀，但共和人民黨依舊將在即將到來的選舉中證明自己，延續其作為國家執政黨的地位。"
 bftb_turkey.20.a: "讓最佳黨派勝選！"
 bftb_turkey.21.t: "選舉日"
 bftb_turkey.21.desc: "萬眾期待的選舉日終於到來。全國各地的人們毫不在意天氣惡劣或個人健康與否，熱情踴躍地奔向各省份的指定投票站，行使自己的民主權利，為所支持的政黨投下莊嚴的選票。在這個民主剛剛蹣跚起步的國家，沒人能想到竟會有如此之高的投票率。雖然選舉過程一波三折、並非絕對合乎規範，但也足以令任何民主的擁護者為[TUR.GetAdjective]公民們在[TUR.GetName]首次自由選舉當中所展現的熱情感到欣慰自豪。\n\n由於選舉的角逐緊張而激烈，因此在計算選票及確認最終結果上，我們花費了相當多的時間。無論如何，現在是時候宣佈，[TUR.GetNameDef]首次民主選舉的最終贏家是……"
 bftb_turkey.21.a: "……共和人民黨！"
 bftb_turkey.21.b: "……土耳其民主黨！"
 TUR_republican_victory_tt: "£faction_tur_kemalist §Y共和人民黨§!將經由§Y民主投票§!勝選執政。"
 TUR_conservative_victory_tt: "£faction_tur_traditionalist §Y土耳其民主黨§!將經由§Y民主投票§!勝選執政。"
 bftb_turkey.22.t: "[TUR.GetAdjective]內戰"
 bftb_turkey.22.desc: "隨著土耳其民主黨贏得大選，[TUR.GetNameDef]爆發內戰的隱患幾乎已是呼之欲出。畢竟自選舉伊始以來，政府和軍隊兩者間的關係便愈發緊張，而現在，一切已趨近攤牌。目前，軍官團已控制了最富饒的西部地區，據稱他們在其叛亂根據地獲得了廣泛的支持。\n\n而在東部地區，庫爾德武裝也在備戰意欲實現獨立。我們此前曾愚蠢地認為我們與庫爾德人的聯盟牢不可破，然而他們卻更加愚蠢地自信我們不敢打壓其分裂我國主權、獨立建國的行徑。實在是令人諷刺。\n\n為[TUR.GetNameDef]的命運展開鬥爭的時刻已然降臨，而我們絕不能失敗。"
 bftb_turkey.22.a: "真主至上，我等共赴聖戰！"
 bftb_turkey.23.t: "薩德阿巴德條約"
 bftb_turkey.23.desc: "[TUR.GetLeader]日前就達成一份互不侵犯協議的事由與[ROOT.GetLeader]展開了會談，這無疑為雙方未來的合作開拓了空間。[TUR.GetAdjective]的外交官們顯然為此次會談煞費苦心，他們試圖通過宣揚兩國間的共有歷史和利益，以及兄弟國家間應和平共處等等來打動我國。這場冗長的會談雖然氣氛和諧，但是否同意簽署的選擇權，掌控在我國手中。"
 bftb_turkey.23.a: "我們當然會簽署這份友好條約！"
 bftb_turkey.23.b: "別和我們沾親帶故，[TUR.GetName]。"
 bftb_turkey.24.t: "選擇阿塔圖爾克的繼任者"
 bftb_turkey.24.desc: "沒人敢奢望自己能具備如同穆斯塔法·凱末爾·阿塔圖爾克那般出神入化的領導才能，但這位土耳其國父終究也不過是肉體凡胎，不可避免地終有離去的這天。鑑於甚至沒人曾幻想過自己能與尊敬的國父並駕齊驅，因此我們並不尋求替換我們的加齊，但是我們必須選擇一位至少能夠追隨阿塔圖爾克腳步的可信領袖作為繼任者。他們必須證明自己對凱末爾價值觀的忠誠，並且在行使作為[TUR.GetNameDef]國家領導人的權力時，時刻視阿塔圖爾克為榜樣。"
 bftb_turkey.24.a: "傑拉勒·拜亞爾是當之無愧的候選者。"
 bftb_turkey.24.b: "傑拉勒·拜亞爾是當之無愧的候選者。"
 bftb_turkey.24.c: "伊斯麥特·伊諾努是阿塔圖爾克合適的繼任者。"
 bftb_turkey.24.d: "費夫齊·恰克馬克正是[TUR.GetNameDef]所需的領袖。"
 bftb_turkey.24.e: "費夫齊·恰克馬克將成為我國的弗朗西斯科·佛朗哥。"
 bftb_turkey.24.f: "雷傑普·佩克爾將實現法西斯-凱末爾主義的合流。"
 bftb_turkey.24.g: "謝夫凱特·敘雷亞·艾德邁爾的才幹將引領我們。"
 bftb_turkey.24.h: "只有伊斯麥特·伊諾努方能引領[TUR.GetAdjective]特色社會主義。"
 bftb_turkey.24.i: "卡齊姆·奧爾巴伊在我們找到出路前將以軍政府監國。"
 bftb_turkey.24.j: "呃……也許推舉前哈里發？"
 bftb_turkey.25.t: "[TUR.GetName]就哈塔伊問題施壓"
 bftb_turkey.25.desc: "[TUR.GetLeader]日前遞交了封措辭強硬的親筆信，信中他要求我方准許敘利亞境內的哈塔伊省土耳其裔人民針對於是否加入[TUR.GetNameDef]還是留在敘利亞一事進行全民公投。目前我方殖民地警察已在敘利亞毗鄰[TUR.GetAdjective]的邊境地區發現了[TUR.GetAdjective]公民非法越境試圖在哈塔伊製造騷亂的活動。顯然，[TUR.GetNameDef]打算通過裹挾民意來確保公投結果有利於[TUR.GetAdjective]，如此一來，也許借花獻佛讓[TUR.GetNameDef]對我方感恩戴德是最優選項。畢竟誰又能斷言[TUR.GetLeader]為了讓哈塔伊重回[TUR.GetNameDef]會做到怎樣的地步呢？"
 bftb_turkey.25.a: "我國同意向[TUR.GetNameDef]割讓哈塔伊。"
 bftb_turkey.25.b: "無論[TUR.GetAdjective]如何聒噪，哈塔伊仍將留在敘利亞的領土內。"
 bftb_turkey.26.t: "[FROM.GetNameDefCap]向我國割讓哈塔伊"
 bftb_turkey.26.desc: "日前[TUR.GetLeader]在安塔基亞發表了小型演說，歡迎哈塔伊地方人民加入[TUR.GetNameDef]，並且對[FROM.GetNameDef]領導人[FROM.GetLeader]尊重哈塔伊人民意願的善舉表示了感謝。儘管此舉招致了敘利亞當局的憤怒，但總體而言，[TUR.GetNameDef]和哈塔伊方面均對此結果表示滿意，許多[TUR.GetAdjective]人民正前往哈塔伊旅遊，通過慶典和禮物交換等方式熱烈歡迎這個新近迴歸[TUR.GetNameDef]的省份。"
 bftb_turkey.26.a: "讓我們歡迎兄弟姊妹們重回大家庭。"
 bftb_turkey.27.t: "[FROM.GetName]繼續霸佔哈塔伊"
 bftb_turkey.27.desc: "[TUR.GetLeader]日前在加濟安泰普舉行了針鋒相對的集會，強烈譴責[FROM.GetNameDef]對其境內的土耳其裔所進行的壓迫。此事在[TUR.GetAdjective]人民當中引起了騷動，並且毫無疑問地降低了哈塔伊地方現統治當局和[FROM.GetNameDef]人民之間的親近感。儘管哈塔伊現在仍為置於我方控制下——但我等應時刻牢記此令人髮指的背叛。"
 bftb_turkey.27.a: "無論如何，哈塔伊都必須物歸原主。"
 bftb_turkey.29.t: "此前拒服兵役者自願參軍"
 bftb_turkey.29.desc: "看來我們推行的祖國至上政策取得了極大成效！猛然回首，大批志願者現已從全國各地蜂擁而至，希望加入我國武裝部隊，以至於最高統帥部對此幾乎都有些不知所措。隨著轉眼間擁有各種宗教和語言背景的人都加入了進來，在作戰層面上，這幾乎成為了一個沉重的負擔。\n\n但值得慶幸的是，由於我們至少在某種程度上為此事態的發生做好了準備，因此對這些此前逃避服役者的整編入伍工作得以順利推進。顧問官們認為，在未來相當一段時間內，我們仍可以看到志願者不斷慕名前來。"
 bftb_turkey.29.a: "很高興看到如此多的英雄兒女前來保衛國家。"
 bftb_turkey.30.t: "十二群島贖買案"
 bftb_turkey.30.desc: "十二群島位於我國領海內，曾幾何時亦被視作我們帝國不可分割的一部分。因此在十二群島問題上，正如[ENG.GetAdjective]和[GRE.GetAdjective]傾向於如此稱呼，只要能夠令[ITA.GetAdjective]人將其歸還於我國這位合法的擁有者，它們便將再度成為我國的法理領土。\n\n政府閣僚已經就此草擬了文件，作為我國向[ITA.GetAdjective]人贖買十二群島的提案。畢竟我們顯然可以料定他們必將要求補償——如果他們真的願意默許此事發生的話。"
 bftb_turkey.30.a: "我國將向其供應鉻資源。"
 bftb_turkey.30.b: "我國將向其提供工業補償。"
 bftb_turkey.30.c: "表示真誠的友誼就夠了。"
 bftb_turkey.31.t: "[FROM.GetNameDefCap]授權我國獨家使用[342.GetName]地區資源"
 bftb_turkey.31.desc: "[FROM.GetAdjective]政府日前已向我國遞交了令人意外的提案。根據提案，他們願意通過向我國供應其[342.GetName]地區產出的全部礦藏，以換取我方控制下的十二群島。\n\n要知道，我國政府在處理相關事務時，向來是獲取而非割讓領土，但[TUR.GetNameDef]能從其本該屬於我國的領土當中供應我方資源，進而提升我國在未來戰爭當中至關重要的戰略儲備這一點實屬誘人。我們必須考慮如下事實，即一旦戰端開啟，我方可能便無法再獲得這些資源供應。無論如何，是否接受[FROM.GetAdjective]的提案，我等必須作出決斷。"
 bftb_turkey.31.a: "我方同意用十二群島交易資源使用權。"
 bftb_turkey.31.b: "我方絕不會割讓哪怕一英寸領土！"
 bftb_turkey.32.t: "[FROM.GetNameDefCap]援助我國工業以換取十二群島"
 bftb_turkey.32.desc: "[FROM.GetAdjective]政府日前已向我國遞交了令人意外的提案。根據提案，[FROM.GetAdjective]闡述了十二群島對於[FROM.GetNameDef]的歷史意義及戰略價值，他們草擬了份固定資產和生產設備的清單，希望以此換取我方控制下的十二群島。\n\n要知道，我國政府在處理相關事務時，向來是獲取而非割讓領土，但不可否認的是，額外的工業產能將使得[ROOT.GetAdjective]的戰爭機器獲益良多。無論如何，我等必須作出決斷，以此獲得對我國工業的助力，是否能夠比十二群島在短期內收益更高。"
 bftb_turkey.32.a: "如果他們願意買單，那麼便籤約交易此群島。"
 bftb_turkey.32.b: "我方絕不會割讓哪怕一英寸領土！"
 bftb_turkey.33.t: "[FROM.GetNameDefCap]請求移交十二群島"
 bftb_turkey.33.desc: "[FROM.GetAdjective]政府日前已向我國遞交了由[FROM.GetLeader]署名的信函，其中大肆強調了我們兩國間的關係以及[FROM.GetAdjective]對我國的善意。但簡單來說，[FROM.GetAdjective]此番來函的目的，是想要與我方簽署一份本身幾乎毫無意義的“權力條約”——不過其還夾帶著一項附加款。在這封盡敘友誼的信件當中，我們找到了對此附加款的說明文件：其闡述瞭如何安置我方十二群島的地方行政官員，以及如何與等待接收行政權的[FROM.GetAdjective]官員實現和平的權力交接——說白了，便是希望我方無條件移交十二群島。\n\n要知道，我國政府在處理相關事務時，向來是獲取而非割讓領土，然而若是地中海地區爆發衝突，[FROM.GetAdjective]亦將成為非常有用的盟友。此外若是說有任何疑慮的話，那可能就是十二群島佔主體的希臘裔人口對於[FROM.GetNameDef]將要把此島鏈併入[FROM.GetAdjective]國家的想法表示了擔憂。但話又說回來，當上次大戰結束，我們將其從奧斯曼帝國的統治下解放出來時，他們也表現了類似的反應。"
 bftb_turkey.33.a: "這最好能幫助將來促成軍事同盟……"
 bftb_turkey.33.b: "我方不介意被稱作偽君子，此群島還是我們的！"
 bftb_turkey.34.t: "[FROM.GetNameDefCap]接受我方提案！"
 bftb_turkey.34.desc: "[FROM.GetAdjective]當局日前已根據換取的[342.GetName]地區獨家資源使用權，將十二群島歸還於我方。儘管官員們對此等在[342.GetName]地區公然且雙方默許的殖民主義掠奪行徑私下表達了憤慨，但這些想法，很快便淹沒在了[TUR.GetNameDef]獲取新的省份所帶來的全民振奮當中。\n\n[TUR.GetLeader]同時還以私人身份造訪羅德島，並在該島向那些長期遭到壓迫的人民許諾，[TUR.GetAdjective]政府將傾聽並竭力解決其所關心的事項。另一方面，有關於美化群島歷史以及論述群島居民來源於[TUR.GetNameDef]的全新課程，正在整個島鏈展開教授。"
 bftb_turkey.34.a: "偉大的勝利！"
 bftb_turkey.35.t: "[FROM.GetNameDefCap]接受我方提案！"
 bftb_turkey.35.desc: "[FROM.GetAdjective]當局日前已根據換取的我國發展中工業產能，將十二群島歸還於我方。儘管官員們對於要用如此鋼鐵和汗水鑄造的勞動成果，去換回早已屬於我國數個世紀的法理領土而私下表達了憤慨，但這些想法，很快便淹沒在了[TUR.GetNameDef]獲取新的省份所帶來的全民振奮當中。\n\n[TUR.GetLeader]同時還以私人身份造訪羅德島，並在該島向那些長期遭到壓迫的人民許諾，[TUR.GetAdjective]政府將傾聽並竭力解決其所關心的事項。另一方面，有關於美化群島歷史以及論述群島居民來源於[TUR.GetNameDef]的全新課程，正在整個島鏈展開教授。"
 bftb_turkey.35.a: "偉大的勝利！"
 TUR_three_factories_sacrificed: "3座§Y民用工廠§!被移除。"
 bftb_turkey.36.t: "[FROM.GetNameDefCap]接受我方提案！"
 bftb_turkey.36.desc: "出乎許多[TUR.GetAdjective]官員的意料，[FROM.GetAdjective]當局日前已將十二群島歸還於我方，作為交換，雙方僅僅是簽署了一項內容為雙方停止對群島主權歸屬繼續展開無意義申索的條約。[TUR.GetLeader]就此親赴國事訪問，和[FROM.GetLeader]共同簽署了這份所謂的“權力條約”，兩國領導人基於此次歷史性的領土交接，承諾將進一步發展彼此作為海上近鄰的友好外交關係。[TUR.GetNameDef]舉國上下相當振奮，併為此舉辦了許多慶祝[TUR.GetNameDef]新近併入省份的活動。\n\n[TUR.GetLeader]同時還以私人身份造訪羅德島，並在該島向那些長期遭到壓迫的人民許諾，[TUR.GetAdjective]政府將傾聽並竭力解決其所關心的事項。另一方面，有關於美化群島歷史以及論述群島居民來源於[TUR.GetNameDef]的全新課程，正在整個島鏈展開教授。\n\n[GRE.GetAdjective]政府對此領土交換行徑表示強烈譴責，並且呼籲其他列強共同譴責此等對十二群島[GRE.GetAdjective]裔人民權利的不公對待和非法踐踏。然而或許是顧忌發聲譴責後被[TUR.GetAdjective]政府疏遠，國際社會對此次領土交換普遍保持沉默。"
 bftb_turkey.36.a: "這自然是再好不過的結果。"
 bftb_turkey.37.t: "[FROM.GetNameDefCap]拒絕我方提案！"
 bftb_turkey.37.desc: "[FROM.GetAdjective]政府現已公開宣佈，無論[TUR.GetAdjective]的煽動者和復仇主義者們如何上躥下跳，十二群島也永遠都是[FROM.GetAdjective]不可分割的領土。[FROM.GetLeader]在其演說中點名提到了[TUR.GetLeader]，譏諷[TUR.GetLeader]或許在[TUR.GetNameDef]國內廣受尊崇，但在[FROM.GetNameDef]，他就是個被[FROM.GetAdjective]人民所嘲笑的無能領袖。[FROM.GetLeader]還稱[TUR.GetNameDef]是一個失敗的國家，並竭力嘲諷稱我國的存在即是對[FROM.GetAdjective]最大的侮辱。除此之外，在其長篇大論的演說當中，[FROM.GetLeader]還不止37次地提到了色佛爾條約當中未兌現的規定。\n\n[TUR.GetLeader]對此回應[FROM.GetAdjective]的立場“令人遺憾”，但也希望今後能有機會展開進一步的外交對話。"
 bftb_turkey.37.a: "好吧，結果本來可以更好。"
 bftb_turkey.38.t: "[FROM.GetNameDefCap]提議在高加索聯合開採資源"
 bftb_turkey.38.desc: "[FROM.GetAdjective]政府現已公開承認此前向格魯吉亞派遣了科考勘探隊，辯稱此舉是為了評估我國礦藏的產量，同時亦提出了一個兩國聯合開採礦藏、共同贏利的方案。從國家行為的角度來說，公開承認本國所進行的某種形式的間諜活動並以此試圖促進兩國關係的計劃可謂是聞所未聞的壯舉，但這也亦是我方現在所處的困境，畢竟[FROM.GetAdjective]政府顯然不願承擔風險。\n\n[FROM.GetAdjective]所制定的方案可謂是面面俱到且細緻入微；[FROM.GetAdjective]不僅將會標明且開採其發現的礦脈，他們還會將大部分產出都上交我國，不過他們也會分出一部分運往[354.GetName]地區留作己用。我們或許在未來數年內都無法知曉[FROM.GetAdjective]具體的勘探情況，但我方亦可根據其呈交的計劃書來改進本國的開採技術，在不借助[FROM.GetAdjective]支援的情況下少許提升格魯吉亞礦區產量。無論如何，究竟是自力更生，還是接受[FROM.GetAdjective]政府的支援，我等必須作出決斷。"
 bftb_turkey.38.a: "讓我們向著互惠共贏而努力。"
 bftb_turkey.38.b: "若他們以為能憑此染指我國邊疆，那實屬天真。"
 bftb_turkey.39.t: "[FROM.GetNameDefCap]接受我方提案"
 bftb_turkey.39.desc: "隨著[FROM.GetAdjective]政府在審閱此前我方遞交的複雜說明計劃後，通知我方推行兩國在格魯吉亞推行聯合開採計劃的決定，[TUR.GetAdjective]官員們不禁為自己富有成效的工作而自鳴得意起來。\n\n全國上下目前已經被動員起來，以便格魯吉亞開採的礦產可以儘快運抵[354.GetName]地區，並在該地加工精煉，進而為我國使用。"
 bftb_turkey.39.a: "外交上的勝利！"
 bftb_turkey.40.t: "[FROM.GetNameDefCap]拒絕我方提案！"
 bftb_turkey.40.desc: "據稱[FROM.GetAdjective]官員在聽聞我方請求獲得[FROM.GetAdjective]政府授權去開採格魯吉亞礦產時滿臉莫名其妙，我方提案被就此一笑了之，而更過分的是，[FROM.GetAdjective]人甚至還在打發走我們後，竊用了我們提交的一部分計劃去開採我們所發現的礦產。"
 bftb_turkey.40.a: "這些不知好歹的混賬！"
 bftb_turkey.41.t: "[FROM.GetNameDefCap]邀請我國加入[FROM.GetFactionName]"
 bftb_turkey.41.desc: "[FROM.GetNameDef]總統[FROM.GetLeader]日前提議將目前的巴爾幹條約組織改進為更加全能且全面的戰略性同盟，即巴爾幹協約。包括我國在內，所有巴爾幹條約的成員國都已被邀請加入[FROM.GetFactionName]。\n\n[FROM.GetNameDef]的官員已作出保證，[FROM.GetFactionName]成員諸國間的關係將不僅僅侷限於軍事，同時也包括共同改善財政、防禦體系以及其他許多方面的事項。"
 bftb_turkey.41.a: "我等團結一心，便可捍衛巴爾幹。"
 bftb_turkey.41.b: "此提案不過又是[FROM.GetAdjective]沙文主義的愚蠢幻想。"
 bftb_turkey.42.t: "[FROM.GetNameDefCap]加入[ROOT.GetFactionName]！"
 bftb_turkey.42.desc: "[FROM.GetLeader]日前宣佈[FROM.GetNameDef]已決定批准並加入[ROOT.GetFactionName]。為紀念此等盛事，兩國接連舉辦了兩場國家慶典加以慶祝。如此一來，當衝突不可避免地爆發時，我們兩國的命運將緊密相連。"
 bftb_turkey.42.a: "我們將攜手捍衛巴爾幹。"
 bftb_turkey.43.t: "[FROM.GetNameDefCap]拒絕加入[ROOT.GetFactionName]！"
 bftb_turkey.43.desc: "[FROM.GetLeader]日前回復我國稱[FROM.GetNameDef]無意加入[ROOT.GetFactionName]。我國外交官和政府閣僚對此的失落顯而易見，而隨著[FROM.GetNameDefCap]離開巴爾幹條約並拒絕加入[ROOT.GetFactionName]，整個計劃已經陷入了危機。"
 bftb_turkey.43.a: "合則共存，裂則俱焚。"
 bftb_turkey.44.t: "佩特拉決議"
 bftb_turkey.44.desc: "我方日前收到了來自[FROM.GetNameDef]的提案，[FROM.GetAdjective]政府提議由其承擔保衛我國黎凡特地區利益的責任。[FROM.GetLeader]聲稱基於[FROM.GetNameDef]的地理位置，保衛並管理此地對其而言不費吹灰之力，而將此地交與[FROM.GetNameDef]後，我方也可以將資源人力投送至其他地區，可謂是兩全其美。\n\n這項提案並非無利可圖，但也將我國置於了一個……有趣的境地。畢竟我們此前從戰敗的奧斯曼帝國手中奪取了巴勒斯坦、約旦以及西奈地區，現在卻又要把這些領土如數奉還給繼承奧斯曼帝國的[FROM.GetAdjective]？而暫且拋開歷史遺留問題，我們還需要考慮的是一旦拒絕後[FROM.GetAdjective]政府的反應。對其的拒絕可能會被解讀為我國不信任他們，亦或是他們不配獲得聯盟當中的一席之地。鑑於[FROM.GetNameDefCap]向來是難以捉摸，我們無法料定，拒絕要求後[FROM.GetAdjective]當局是否會促使局勢升級。"
 bftb_turkey.44.a: "此誠為戰略上的良策！"
 bftb_turkey.44.b: "奧斯曼帝國覆滅是有其道理的。"
 bftb_turkey.45.t: "[FROM.GetAdjective]通過佩特拉決議"
 bftb_turkey.45.desc: "[FROM.GetAdjective]的殖民地官員目前業已離開其崗位前往就近的其他保護領，以便利我方對這片前[FROM.GetAdjective]殖民地的順利接管。[FROM.GetLeader]就此致信我國總統閣下，稱[ROOT.GetNameDef]完全相信[FROM.GetNameDef]有能力保衛和治理這些剛剛移交予我方的省份。\n\n許多[ROOT.GetAdjective]人民將此次領土移交視為偉大的勝利，同時亦是對[ROOT.GetNameDef]再次成為世界範圍內受到尊重的地區強權的肯定。"
 bftb_turkey.45.a: "我們現在是大聯盟的成員了。"
 bftb_turkey.46.t: "[FROM.GetAdjective]否決佩特拉決議"
 bftb_turkey.46.desc: "[FROM.GetNameDef]首相[FROM.GetLeader]已公開宣稱將[FROM.GetAdjective]位於黎凡特的領地交給[ROOT.GetNameDef]誠為難以想像的行為，並且再次強調[FROM.GetAdjective]對該地的統治是必要且明智的。[FROM.GetAdjective]位於黎凡特當地的駐軍業已進入警備狀態，以防備[ROOT.GetAdjective]對該地可能的突然襲擊。\n\n我國政府的諸多官員業已私下表達了對[FROM.GetAdjective]決定的失望，認為此番被拒是[FROM.GetAdjective]並未視我方為盟友的明證。[ROOT.GetLeader]亦對[FROM.GetAdjective]的決定表示不滿，並向其顧問官諮詢應對策略。"
 bftb_turkey.46.a: "我們努力過，但卻失敗了，現在已然無能為力。"
 bftb_turkey.46.b: "讓我們把這個問題進一步升級！"
 bftb_turkey.47.t: "[FROM.GetNameDefCap]就海灣地區防務表示關切"
 bftb_turkey.47.desc: "[FROM.GetNameDef]總統[FROM.GetLeader]日前就我國阿拉伯灣殖民地的防務問題與我國展開了協商。[FROM.GetAdjective]領導人建議，鑑於[FROM.GetNameDef]的歷史地位和地理位置，[FROM.GetNameDef]應當獲權接管此地區的防務責任。\n\n一些[ROOT.GetAdjective]官員此前已對[FROM.GetNameDef]接管黎凡特地區防務的情況表示了警惕。分析人士擔憂這次通過外交兼併領土的行為，恐怕是[FROM.GetNameDef]建立地區新秩序計劃的一部分，屆時[FROM.GetNameDef]將成為整個次大陸無可爭議的地區強權。但無論我們對將來有怎樣的憂慮，眼下[FROM.GetNameDef]仍舊是我國盟友。如果我們希望能夠繼續維持彼此間的盟友關係，那麼我們最好滿足其接管我國阿拉伯灣殖民地的要求。"
 bftb_turkey.47.a: "讓我們看看[FROM.GetNameDef]是否做好準備承擔此重任。"
 bftb_turkey.47.b: "如此新殖民主義行徑不能也不會被容忍。"
 bftb_turkey.48.t: "[FROM.GetAdjective]委任我國海灣防務"
 bftb_turkey.48.desc: "我國業已做好了向阿拉伯灣新領地輸送我方衛戍部隊及行政官僚的準備，眼下[FROM.GetAdjective]已經結束其對當地的統治，並將此地的領土主權移交予我方。"
 bftb_turkey.48.a: "我國如今誠為列強一員了。"
 bftb_turkey.49.t: "[FROM.GetAdjective]拒絕移交阿拉伯領土"
 bftb_turkey.49.desc: "[FROM.GetAdjective]大使日前回複稱[ROOT.GetAdjective]試圖接管[FROM.GetAdjective]位於阿拉伯地區領地的行為顯然是“不可接受”的，其要求我方立刻撤回提案。我國防務專家對於未能獲得[FROM.GetAdjective]屬阿拉伯領地控制權一事深感遺憾，但是[FROM.GetAdjective]官員也表示，只要[ROOT.GetNameDef]繼續作為[FROM.GetFactionName]成員，我國便可繼續享有在上述地區的軍事通行以及駐港權。"
 bftb_turkey.49.a: "真是不幸"
 bftb_turkey.50.t: "[FROM.GetNameDefCap]需求輕型坦克"
 bftb_turkey.50.desc: "[FROM.GetNameDef]日前與我方接洽，表示希望能夠從我國庫存中訂購輕型坦克。為了表現其對所謂“[ROOT.GetAdjective]的傑出智慧”和“卓越設計”的敬畏之情，[FROM.GetAdjective]不惜大言不慚地表示，要想守護[FROM.GetNameDef]的國家主權，就必須仰仗[ROOT.GetAdjective]生產的戰車。"
 bftb_turkey.50.a: "我們將送出最新型號戰車！"
 bftb_turkey.50.b: "我們將送出標準型號戰車。"
 bftb_turkey.50.c: "我們將送出老舊型號戰車。"
 bftb_turkey.50.d: "[FROM.GetNameDefCap]什麼也得不到。"
 bftb_turkey.51.t: "[FROM.GetNameDefCap]售出新式輕型坦克！"
 bftb_turkey.51.desc: "我國業已收到自[FROM.GetAdjective]售出的坦克！這些戰車合乎現代技術水準，並且早期測試表明其功能多樣且性能優良。毫無疑問，它們將在為我國裝甲部隊服役的生涯中大放異彩。"
 bftb_turkey.51.a: "真是意料之外的驚喜！"
 bftb_turkey.52.t: "[FROM.GetNameDefCap]售出輕型坦克"
 bftb_turkey.52.desc: "我國業已收到自[FROM.GetAdjective]售出的坦克！這些戰車稍微有點過時，但經過質量測試表明其依舊可堪重用。毫無疑問，它們將在為我國裝甲部隊服役的生涯中表現出色。"
 bftb_turkey.52.a: "真是巨大的恩惠。"
 bftb_turkey.53.t: "[FROM.GetNameDefCap]售出舊式戰車"
 bftb_turkey.53.desc: "我國業已收到自[FROM.GetAdjective]售出的坦克！然而，這些顯然都是因性能缺陷而被[FROM.GetAdjective]人淘汰的古董型號。無論如何，希望我國裝甲部隊能或多或少發掘其作用……"
 bftb_turkey.53.a: "既然它們在1922年可堪一用，那現在亦能湊合著用！"
 bftb_turkey.54.t: "[FROM.GetNameDefCap]什麼也未售出"
 bftb_turkey.54.desc: "[FROM.GetAdjective]人已經拒絕向我國出售哪怕是其最老舊型號的坦克。[FROM.GetAdjective]戰車看來只能為[FROM.GetAdjective]所用，不僅如此，[FROM.GetNameDef]的“傑出人士”還以所謂的“國家安全”作為其拒絕售給我方戰車的冠冕堂皇理由。"
 bftb_turkey.54.a: "反正那些坦克總會故障的。"
 bftb_turkey.55.t: "切斯特租讓案"
 bftb_turkey.55.desc: "1923年，彼時新近成立的土耳其共和國通過了授權租讓我國參與[FROM.GetNameDef]油田和鐵路建設的法案。然而當時，受制於大蕭條對美國經濟的沉重打擊，合眾國參議院最終未對此協議進行批准。不過，最近[FROM.GetNameDef]已經重啟了該協定，並且再次請求我國履行最初締約時的條款。\n\n不可否認的是，如今我國的經濟狀況較1923年時相比已有極大的改善，同時讓[FROM.GetNameDef]在意識形態乃至軍事上親近我國亦是有利可圖之事。然而，即使眼下合眾國的國力正盛，在此全球戰爭陰雲籠罩的背景下，我方亦需對資源精打細算。一方面，實現[FROM.GetNameDef]的石油開採或許將在未來成為同[SOV.GetNameDef]的談判桌上重要的籌碼；但另一方面，我們亦需對短期內開採的石油可能落入敵手未雨綢繆。利用[FROM.GetAdjective]對我國援助的需求來完成本國的目標或許是明智的，畢竟[FROM.GetNameDef]還富含鉻資源，而我國則不然。無論如何，我等必須作出決斷。"
 bftb_turkey.55.a: "我國將援助任何民主制度的朋友。"
 bftb_turkey.55.b: "我國將施以援手……有條件的。"
 bftb_turkey.56.t: "[FROM.GetNameDefCap]無償予以援助"
 bftb_turkey.56.desc: "[FROM.GetNameDefCap]已經決定無償兌現其十年前向我國作出的承諾。他們不僅利用其先進的技術與強大的工業產能開採[350.GetName]地區我方此前無法觸及的石油，[FROM.GetAdjective]人同時亦將部分石油工業交予我國自行使用。\n\n作為友誼的象徵，[FROM.GetAdjective]人贈予了我們部分其勘探過程中使用的技術和裝備，這些將有助於我們對全國各地自然資源的進一步開發利用。"
 bftb_turkey.56.a: "[FROM.GetAdjective]人真是太棒了。"
 bftb_turkey.57.t: "[FROM.GetAdjective]有償予以援助"
 bftb_turkey.57.desc: "[FROM.GetNameDefCap]已經同意兌現其十年前向我國作出的承諾，但卻要求得到補償。即他們願意動用其先進的技術與強大的工業產能在[350.GetName]地區開採我方無法觸及的石油，但[FROM.GetAdjective]人希望以此來交換對我國[343.GetName]地區資源的獨家使用權。為了促成此番交易，[FROM.GetAdjective]願意向我國傳授部分其先進的採掘技術，同時也願意贈予部分精密的挖掘設備。\n\n請求援助本身已經足夠難以啟齒，更毋寧說還要有償付出代價。我國本應當是反帝反殖民鬥爭的排頭兵，眼下若是接受[FROM.GetAdjective]的條件，無異於是背叛我們自身的價值觀。但是話又說回來，我們真的又有資本去拒絕[FROM.GetNameDef]遞來的橄欖枝嗎？"
 bftb_turkey.57.a: "好吧，給這些帝國主義混蛋其想要的。"
 bftb_turkey.57.b: "我們絕不會任由[FROM.GetAdjective]擺佈！"
 bftb_turkey.58.t: "[FROM.GetNameDefCap]滿足我國要求"
 bftb_turkey.58.desc: "為了換取我方援助，[FROM.GetAdjective]政府已經同意了我們此前開出的每項條款。[343.GetName]地區產出的鉻已開始陸續送抵我國港口，更好的消息是，我方還在勘探[FROM.GetName]東部石油資源的過程中學會了些新東西。"
 bftb_turkey.58.a: "作為[FROM.GetAdjective]真是可以為所欲為。"
 bftb_turkey.59.t: "[FROM.GetNameDefCap]拒絕我國要求！"
 bftb_turkey.59.desc: "[FROM.GetAdjective]政府已經拒絕了我國此前開出的公平公正的援助條件。原本[FROM.GetAdjective]政府只需要付出其相應的投入，所有人便都可從中獲益。然而，眼下他們只有坐等數年或許才能鑽取到那黑色的黃金了。"
 bftb_turkey.59.a: "我們可是[ROOT.GetNameDef]，就算退場亦要有勝利者風範。"
 bftb_turkey.60.t: "[FROM.GetName]就哈塔伊問題施壓"
 bftb_turkey.60.desc: "[FROM.GetLeader]日前遞交了封措辭強硬的親筆信，信中他要求我方准許敘利亞境內的哈塔伊省土耳其裔人民針對於是否加入[FROM.GetNameDef]還是留在[ROOT.GetNameDef]一事進行全民公投。目前我國軍隊已在[ROOT.GetAdjective]毗鄰[FROM.GetAdjective]的邊境地區發現了[FROM.GetAdjective]公民非法越境試圖在哈塔伊製造騷亂的活動。顯然，[FROM.GetNameDef]打算通過裹挾民意來確保公投結果有利於[FROM.GetAdjective]，如此一來，也許將哈塔伊交給[FROM.GetNameDef]是正確的決定，畢竟[FROM.GetNameDef]在我國邊境虎視眈眈並非理想的局面。"
 bftb_turkey.60.a: "我們還有選擇餘地嗎？"
 bftb_turkey.60.b: "如果想要哈塔伊，他們可以試試來搶。"
 bftb_turkey.61.t: "[FROM.GetNameDef]向我國割讓哈塔伊"
 bftb_turkey.61.desc: "日前[ROOT.GetLeader]在安塔基亞發表了小型演說，歡迎哈塔伊地方人民加入[ROOT.GetNameDef]，並且對[FROM.GetNameDef]領導人[FROM.GetLeader]尊重哈塔伊人民意願的善舉表示了感謝。儘管此舉招致了敘利亞政界廣泛的憤怒，但總體而言，[ROOT.GetNameDef]和哈塔伊方面均對此結果表示滿意，許多[ROOT.GetAdjective]人民正前往哈塔伊旅遊，通過慶典和禮物交換等方式熱烈歡迎這個新近歸屬[ROOT.GetNameDef]的省份。[FROM.GetLeader]目前暫未對此事件發表看法，但據接近[FROM.GetAdjective]領導人的消息來源指出，[FROM.GetAdjective]相信這只是暫時的領土分割，哈塔伊將會在未來以某種方式重回其控制下。"
 bftb_turkey.61.a: "讓我們歡迎兄弟姊妹們重回大家庭。"
 bftb_turkey.62.t: "[FROM.GetName]繼續霸佔哈塔伊"
 bftb_turkey.62.desc: "[ROOT.GetLeader]日前在加濟安泰普舉行了針鋒相對的集會，強烈譴責[FROM.GetNameDef]對其境內的土耳其裔所進行的壓迫。此事在[ROOT.GetAdjective]人民當中引起了騷動，並且有顧問官稱[ROOT.GetAdjective]群體當中洋溢著通過戰爭解決此不公正事態的狂熱。愚蠢的[FROM.GetNameDef]自以為能忤逆我方的意願——要知道[ROOT.GetNameDef]絕不會容忍自己被弱小的勢力所侮辱。"
 bftb_turkey.62.a: "[FROM.GetNameDef]必須被毀滅。"
 bftb_turkey.63.t: "[FROM.GetNameDefCap]邀請我國加入[FROM.GetFactionName]"
 bftb_turkey.63.desc: "[FROM.GetLeader]日前就建立能夠統一規劃軍事立場的全面泛地中海聯盟相關事項與[ROOT.GetLeader]展開了會晤。有一種觀點認為若是[FROM.GetNameDef]自願與我國結盟，可能會給我方的地區主張帶來更多的正當性加持，即使這意味著我們會因此失去列強的支持。但另一方面，我們也應該考慮到，不同於我國，[FROM.GetNameDef]事實上在巴爾幹乃至地中海諸國當中均享有頗高的聲譽，而他們很可能利用這種聲譽，去贏取那些或許並不想與我方打交道的國家的支持。\n\n我們面前有兩個選擇：或是向[FROM.GetNameDef]輸誠並利用其威望來強化我們對抗其他列強時的刀劍；或是與那幫條頓小丑結盟，隨後如同修剪花園裡的枯枝敗葉般剪除我國周邊的弱小鄰國。我方手握獨裁巴爾幹諸國之命運的權力——我們可以將他們從[GER.GetAdjective]和[SOV.GetAdjective]的霸權威壓之下解救出來，亦或是我們加入列強們的行列，加速推進這些鄰居的覆滅。眼下，我等必須作出決斷。"
 bftb_turkey.63.a: "我們可以通過拯救他人而救贖自我。"
 bftb_turkey.63.b: "這個世界冰冷而無情，我方亦然。"
 bftb_turkey.64.t: "[FROM.GetNameDefCap]加入[ROOT.GetFactionName]"
 bftb_turkey.64.desc: "[FROM.GetLeader]日前大張旗鼓地向其舉國上下宣佈，在一場盛大的慶典後，[FROM.GetNameDef]的靈魂和命運如今將與[ROOT.GetNameDef]相綁定，成為命運的共同體。[ROOT.GetLeader]亦宣佈了此事，但措辭相較而言要低調許多。\n\n通過與[FROM.GetNameDef]結盟以遏止其擴張的野望，這顯然符合[ROOT.GetAdjective]官員們的期望，並且兩國結盟形成的強大力量亦將能夠用來保護諸多地中海沿岸的小國，使其免受那些意欲鯨吞其國的霸權國家侵害。"
 bftb_turkey.64.a: "我們必須儘快邀請其餘諸國加入此條約。"
 bftb_turkey.65.t: "[FROM.GetNameDefCap]拒絕加入[ROOT.GetFactionName]"
 bftb_turkey.65.desc: "我們已經收到消息稱[FROM.GetNameDef]拒絕加入[ROOT.GetFactionName]。[ROOT.GetAdjective]官員對此非常失望，並且對地中海地區的未來頗感憂慮。[ROOT.GetLeader]已經私下敦促政府官員加快流程以促進更多國家加入聯盟，如此形成強大的集團以對抗任何可能的[FROM.GetAdjective]民族統一主義。"
 bftb_turkey.65.a: "我們必須儘快邀請其餘諸國加入此條約。"
 bftb_turkey.66.t: "[FROM.GetNameDefCap]提議瓜分[GRE.GetNameDef]"
 bftb_turkey.66.desc: "[FROM.GetNameDefCap]日前提議，儘管令人遺憾，但出於建立國家安全緩衝區的考慮，[GRE.GetNameDef]作為主權國家必須被摧毀。我方官員激動地對[FROM.GetAdjective]盟友的想法連連稱是，並且提醒對方自很早以前這便是我國的官方態度立場。\n\n[FROM.GetNameDefCap]提議根據地緣因素如下瓜分整個[GRE.GetNameDef]：我方將得到[185.GetName]地區、[186.GetName]地區以及[182.GetName]地區，此三地歸屬於我方將確保我國在東地中海及愛奧尼亞海的主宰地位。而[FROM.GetNameDefCap]將會得到餘下的[GRE.GetAdjective]領土，如此可以確保[FROM.GetAdjective]進一步控制其已有許多領土毗鄰的愛琴海地區。\n\n這份協議在絕大部分都顯得公平——至少比我們希望的肆意掠奪土地的方式公平。但如此一來，我們長久以來志在將[47.Capital.GetName]這顆明珠增添到我方帝國皇冠上的美夢，必定會隨著這個野望而就此畫上句號。我們真的願意為了地中海的和平，而放棄[47.Capital.GetName]這個獎品嗎？"
 bftb_turkey.66.a: "對於[GRE.GetNameDef]未來公平而愉快的安排。"
 bftb_turkey.66.b: "我們必須鯨吞其全域！"
 bftb_turkey.67.t: "金方陣政變"
 bftb_turkey.67.desc: "從[676.GetName]傳來了重磅消息，該國前首相拉希德·阿里·蓋拉尼日前對該國現任的[ROOT.GetLeader]政府發動了政變。蓋拉尼不僅獲得了很大部分軍方的支持，甚至亦有部分民眾為其搖旗吶喊。\n\n我們完全可以相信外國勢力在組織和武裝金方陣叛黨的過程中起到了關鍵作用，而在所有貌似參與其中的國家當中，[FROM.GetNameDef]被認定在這場法西斯政變當中扮演了最重要的支撐角色。\n\n金方陣組織在立場上極為堅定，力主通過尋求[GER.GetNameDef]援助進而武力驅逐[ENG.GetAdjective]的帝國主義分子。我國民眾對此極為讚賞，或許信奉法西斯主義是實現阿拉伯民族乃至區域自由的唯一途徑。"
 bftb_turkey.67.a: "如真主所願，我等將為伊拉克國魂血戰法西斯！"
 bftb_turkey.67.b: "只有信仰法西斯，我們或才能實現解放。"
 bftb_turkey.67.c: "盡數驅逐法西斯害蟲。"
 bftb_turkey.68.t: "[IRQ.GetAdjective]內戰爆發"
 bftb_turkey.68.desc: "我國在[IRQ.GetNameDef]煽動的法西斯政變已然成功奏效。[IRQ.GetAdjective]的法西斯派系眼下正為了奪取國家政權，與該國現任政府在該國各地打得不可開交。但無論兩者誰輸誰贏，我們的首要目標將是在此地建立統治秩序。"
 bftb_turkey.68.a: "現在，讓我們靜觀其變。"
 bftb_turkey.69.t: "[IRQ.GetAdjective]法西斯派佔據上風"
 bftb_turkey.69.desc: "正如我們所預估的那樣，[IRQ.GetAdjective]的法西斯派系現已對[IRQ.GetAdjective]保皇派實現了清剿。他們眼下對我方而言已是虛弱不堪，而我們則將一舉奪佔其國。"
 bftb_turkey.69.a: "真是出歡快愉悅的陰謀！"
 bftb_turkey.70.t: "[IRQ.GetAdjective]法西斯派落敗"
 bftb_turkey.70.desc: "[IRQ.GetAdjective]的法西斯派系未能成功擊敗[IRQ.GetAdjective]保皇派，眼下已被[IRQ.GetAdjective]軍隊徹底擊潰粉碎。這真是場暴行，不過按照計劃，我國戰略家們相信[IRQ.GetNameDef]眼下對我方而言已是虛弱不堪，我們完全可以一舉奪佔其國。"
 bftb_turkey.70.a: "這是場自開始便被操縱的遊戲。"
 bftb_turkey.71.t: "[IRQ.GetAdjective]法西斯派控制[IRQ.GetNameDef]"
 bftb_turkey.71.desc: "[IRQ.GetAdjective]的法西斯派系已成功推翻該國現政府並接管全國。這些[IRQ.GetAdjective]法西斯主義者們堅信，他們的首要目標便是不惜一切代價促使阿拉伯地區從[ENG.GetAdjective]的陰影下襬脫出來，為此他們認為由[ROOT.GetAdjective]加以介入是實現目標的最佳途徑。"
 bftb_turkey.71.a: "[IRQ.GetName]？我們不甚關注。"
 bftb_turkey.71.b: "他們將得到我國的全力支持。"
 bftb_turkey.71.c: "他們已證明自己有價值成為[ROOT.GetFactionName]成員。"
 bftb_turkey.72.t: "[FROM.GetNameDefCap]支持我方！"
 bftb_turkey.72.desc: "[FROM.GetAdjective]人已決定公然宣佈其對我國政府的支持。如此宣示對於構建我國主權，以及從國家層面上為我國反對[ENG.GetAdjective]帝國主義的鬥爭提供法理支撐具有著重要的作用。"
 bftb_turkey.72.a: "他們的勇氣值得讚美與感激！"
 bftb_turkey.73.t: "[IRQ.GetAdjective]法西斯派控制[IRQ.GetNameDef]"
 bftb_turkey.73.desc: "[IRQ.GetAdjective]的法西斯派系已成功推翻該國現政府並接管全國。這些[IRQ.GetAdjective]法西斯主義者們堅信，他們的首要目標便是不惜一切代價促使阿拉伯地區從[ENG.GetAdjective]的陰影下襬脫出來，為此他們認為由[ROOT.GetAdjective]加以介入是實現目標的最佳途徑。"
 bftb_turkey.73.a: "[IRQ.GetName]不值得我們關注。"
 bftb_turkey.73.b: "好吧，畢竟曾幾何時我們自詡為伊斯蘭之劍……"
 bftb_turkey.74.t: "[FROM.GetNameDefCap]支持我方！"
 bftb_turkey.74.desc: "[FROM.GetAdjective]人已決定公然宣佈其對我國政府的支持。如此宣示對於構建我國主權，以及從國家層面上為我國反對[ENG.GetAdjective]帝國主義的鬥爭提供法理支撐具有著重要的作用。"
 bftb_turkey.74.a: "有[ITA.GetAdjective]人撐腰，我們不可能失敗！"
 bftb_turkey.75.t: "[IRQ.GetAdjective]石油國有化！"
 bftb_turkey.75.desc: "自[IRQ.GetNameDef]傳來重磅消息，據信[ROOT.GetAdjective]掌控當地原油儲備的官員日前已被[IRQ.GetAdjective]武裝押運至該國邊境並強制驅逐！正如此前令人不安的傳聞那樣，新近成立的[IRQ.GetAdjective]政府正計劃邀請一支[GER.GetAdjective]軍隊進駐該國境內。\n\n鑑於事態可能繼續發展，智庫成員推斷一切都是[FROM.GetNameDef]在幕後推動，其目的在於發展壯大[GER.GetFactionName]！我們必須決斷如何展開下一步行動：如果我方尊重其收回石油資源的決定，[IRQ.GetAdjective]人也許會願意維持中立；但我們也必須考慮是否能夠承受石油落入[GER.GetAdjective]之手的風險。"
 bftb_turkey.75.a: "他們是聖火的守護者。"
 bftb_turkey.75.b: "石油絕不能落入法西斯之手！"
 bftb_turkey.75.c: "君權神授的秩序必須得到捍衛。"
 bftb_turkey.75.d: "此事僅能以此了結。"
 bftb_turkey.75.e: "這是其主權國家的權利。"
 bftb_turkey.76.t: "[ENG.GetAdjective]向我方退讓！"
 bftb_turkey.76.desc: "[FROM.GetAdjective]已經交出了對我國油田的全面控制，我國主權自然歸屬於我方：我們用帝國主義自己的方式打敗了它們！"
 bftb_turkey.76.a: "真主至大，榮耀歸於[ROOT.GetLeader]！"
 bftb_turkey.77.t: "英國-[GER.GetAdjective]聯盟"
 bftb_turkey.77.desc: "我們顯然被殘酷而又可怕的命運所愚弄：[ENG.GetAdjective]和[GER.GetAdjective]日前竟然結為了聯盟！就在我們急需[GER.GetFactionName]援助時，那幫背信棄義的[ENG.GetAdjective]狗已經重拳出擊，將我方重重地擊倒在地！\n\n這毫無疑問是[ROOT.GetAdjective]歷史上最黑暗的一天。我們孤立無援，除了[TUR.GetAdjective]亦再無依靠——然而後者肯定也會在目睹[ENG.GetAdjective]和[GER.GetAdjective]聯手反制我國後望而卻步。但我們又能責怪他們嗎？誰會在頭腦清醒的情況下正面硬剛如此兩大列強的組合？我們夠膽試試嗎？"
 bftb_turkey.77.a: "真主保佑，願歐洲人皆葬身刀劍下。"
 bftb_turkey.77.b: "我們這是生活在怎樣瘋狂的世界裡啊！？"
 bftb_turkey.79.t: "[FROM.GetNameDefCap]請求延長互不侵犯條約"
 bftb_turkey.79.desc: "由於共同的反帝立場，我們在歷史上曾與[FROM.GetNameDef]保持著非常友好的外交關係，然而近幾年來，兩國關係逐漸趨於冷淡。\n\n為了緩和兩國間的關係，[FROM.GetLeader]日前提議續簽多年前簽署的那份已被淡忘的互不侵犯條約。我們可以憑此作為積極友好的和平信號，尋求在未來與[FROM.GetNameDef]展開更為深層次的雙邊合作，然而值得注意的是，[ROOT.GetLeader]亦從不掩飾其對土耳其海峽的覬覦。無論如何，我等必須作出抉擇：是主動成為[FROM.GetAdjective]的盟友，還是其後淪為[FROM.GetAdjective]的附屬。"
 bftb_turkey.79.a: "同[FROM.GetNameDef]締結友誼百益無害。"
 bftb_turkey.79.b: "唉，我們對其另有安排。"
 bftb_turkey.80.t: "[FROM.GetAdjective]同意續簽互不侵犯條約"
 bftb_turkey.80.desc: "我們很高興地接收了來自[FROM.GetNameDef]的最新報告，根據消息反饋，[FROM.GetAdjective]對於我方續簽互不侵犯條約的提案反響積極。我國官員確信，我們可在本週之內將條約相關的最後細節確定下來。"
 bftb_turkey.80.a: "偉大的和平之日。"
 bftb_turkey.81.t: "[FROM.GetAdjective]拒絕續簽互不侵犯條約"
 bftb_turkey.81.desc: "我們已經收到了[FROM.GetNameDef]無意續簽互不侵犯條約的消息，除此之外，[FROM.GetAdjective]官方甚至順勢作廢了我們此前的條約，這毫無疑問將打消我國在未來數年內改善同[FROM.GetNameDef]關係的任何幻想。"
 bftb_turkey.81.a: "這隻會意味著可怕的事情。"
 bftb_turkey.82.t: "土共封禁法令解除"
 bftb_turkey.82.desc: "隨著所有受到的指控都被[ROOT.GetLeader]撤銷，此前流亡的土耳其共產黨成員日前均已榮歸[ROOT.GetNameDef]。儘管這些土共成員受到了部分政府閣僚的親切慰問，但政府中更多自詡為正統凱末爾主義者的閣僚們還是對他們報以敬而遠之的態度。\n\n儘管[ROOT.GetLeader]本人並未出面迎接這些流亡者，但也還是向他們發出了加入現政府效力的公開邀請。至於是否還能有土共成員加入政府內閣，則需要取決於政府作出的決定。"
 bftb_turkey.82.a: "我們並不在乎他們的選擇。"
 bftb_turkey.83.t: "土耳其共產黨歸來"
 bftb_turkey.83.desc: "隨著所有受到的指控都被[ROOT.GetLeader]撤銷，此前流亡的土耳其共產黨成員日前均已榮歸[ROOT.GetNameDef]。儘管這些土共成員受到了部分政府閣僚的親切慰問，但政府中更多自詡為正統凱末爾主義者的閣僚們還是對他們報以敬而遠之的態度。\n\n然而在[ROOT.GetLeader]主持的歡迎會上，發生了出人意料的政變。當時謝菲克·許斯努突然登上講臺，宣佈資產階級和凱末爾主義修正分子的政權就地解散，而國家政權將被移交給按照蘇聯模式組建的新政府。在其後數小時內，全國各地的凱末爾派官員以及軍官團成員皆遭到了逮捕，有報道稱來自[SOV.GetAdjective]方面的特工參與了此次行動的全過程。"
 bftb_turkey.83.a: "話說等等——"
 bftb_turkey.84.t: "[FROM.GetNameDefCap]要求我國服從"
 bftb_turkey.84.desc: "日前宛若地獄毒蛇般的[FROM.GetNameDef]向我方遞交了其單方面的通牒，勒令我方解除武裝並允許[FROM.GetAdjective]官兵駐留我國領土以“確保[ROOT.GetAdjective]工人群體安全及其權益”。其如此荒謬的要求下想要掩飾的動機是顯而易見的：[FROM.GetNameDef]正試圖將我國內政乃至主權置於其完全的控制下。\n\n我國可不是那些在世界局勢當中無關緊要的二流國家，我們可是[ROOT.GetNameDef]！我們絕不會坐視自己被如此視我等為獵物的邪惡勢力肆意擺佈。我們必須尋求外援；至少肯定有一個國家願意和我們攜手對抗[FROM.GetAdjective]的好戰行徑的！但另一方面，為承擔此風險而將[ROOT.GetAdjective]普世大眾置於可能的犧牲境地，又是否真的值得呢？"
 bftb_turkey.84.a: "相信[SOV.GetNameDefCap]定會秉公行事。"
 bftb_turkey.84.b: "我們民主地決定……向他國求援！"
 bftb_turkey.84.c: "定會有人從馬克思渣滓手中拯救我們！"
 bftb_turkey.84.d: "盟友們將確保我國的安泰。"
 bftb_turkey.84.e: "[ROOT.GetAdjective]民眾的性命高於一切。"
 bftb_turkey.85.t: "[FROM.GetNameDefCap]請求調停[TUR.GetNameDefCap]的入侵"
 bftb_turkey.85.desc: "近期[FROM.GetNameDefCap]的官員正與我方接觸，希望我國能在其面對[TUR.GetAdjective]的侵略時提供保護。為促成此事，[FROM.GetAdjective]方面通過詳盡的資料佐證論述了[FROM.GetNameDef]如果落入[TUR.GetAdjective]的勢力範圍內將會整個大陸的均勢產生怎樣的不利影響，他們熱切捍衛著其國家的自治主權，並希望我們對此予以援助。"
 bftb_turkey.85.a: "[TUR.GetNameDefCap]正企圖獨佔共產主義鰲頭！"
 bftb_turkey.85.b: "[TUR.GetNameDefCap]正破壞著這片大陸的均勢！"
 bftb_turkey.85.c: "不能再縱容赤匪如此狂飆猛進了。"
 bftb_turkey.85.d: "我們並不關心[FROM.GetAdjective]戰事。"
 bftb_turkey.86.t: "[FROM.GetNameDefCap]保障我國獨立"
 bftb_turkey.86.desc: "我們已經收到答覆稱，[FROM.GetNameDef]傾向於在我國面臨[TUR.GetAdjective]的侵略時為我國的獨立提供保障。此誠為我國的重大外交勝利，希望如此能促使[TUR.GetNameDef]重新考慮其對我方提出的過分要求。"
 bftb_turkey.86.a: "誠為[ROOT.GetNameDef]真正的朋友。"
 bftb_turkey.87.t: "[BUL.GetNameDefCap]獲得外援"
 bftb_turkey.87.desc: "這些懦弱的[BUL.GetAdjective]人竟然找來外援對其註定失敗的獨立訴求搖旗吶喊！？無論如何，這顯然出現了我們本想要避免的複雜態勢，我們必須為此作出抉擇，是繼續施壓甚至動用武力以達到我們的目的，還是就此體面地借坡下驢以避免一場更大規模的戰爭？"
 bftb_turkey.87.a: "我們只管向前推進。"
 bftb_turkey.87.b: "此誠為慘痛的挫敗。"
 bftb_turkey.88.t: "[FROM.GetNameDefCap]退讓低頭！"
 bftb_turkey.88.desc: "我們已經收到消息稱，[FROM.GetAdjective]政府以及軍隊已經作出退讓，地區局勢正在趨向緩和。我國政府上下對此歡呼雀躍，這對於[ROOT.GetAdjective]以及[ROOT.GetAdjective]人民而言，誠為巨大的勝利……"
 bftb_turkey.88.a: "我們勝利了！"
 bftb_turkey.89.t: "我國未收到任何外國援助"
 bftb_turkey.89.desc: "當得知沒有任何國家願意幫助[ROOT.GetNameDef]抵抗[TUR.GetAdjective]侵略的可悲消息後，[ROOT.GetLeader]幾乎已經有些心力交瘁。現在，他國對此事的漠不關心將一個可怕的抉擇扔到了我們面前：是誓死不屈地奮戰，還是屈服以苟全性命。"
 bftb_turkey.89.a: "我們別無選擇，只能拱手而降"
 bftb_turkey.89.b: "我們絕不會未戰先降！"
 bftb_turkey.90.t: "[BUL.GetNameDefCap]向我國投降"
 bftb_turkey.90.desc: "最近的消息表明，[FROM.GetAdjective]政權已經垮臺，而領導[FROM.GetNameDef]的權力正被移交給由我黨政要欽定的由該國共產黨組成的新內閣，如此一來，我們距離世界革命的偉大目標又近了一步。隨著[FROM.GetAdjective]軍隊以及工業置於我方控制下，我方在本地區乃至整個歐洲的地位將會大幅提升。"
 bftb_turkey.90.a: "該國人民的解放現在得以實現。"
 bftb_turkey.91.t: "[BUL.GetNameDefCap]拒不退讓"
 bftb_turkey.91.desc: "我們收到了意外的報告稱[FROM.GetNameDef]嚴詞拒絕了我方的合理要求。[FROM.GetAdjective]政府本該選擇順從協作，而不是如這般負隅頑抗。"
 bftb_turkey.91.a: "那麼我們將迫使其臣服。"
 bftb_turkey.92.t: "[FROM.GetName]簽署薩德阿巴德條約"
 bftb_turkey.92.desc: "當我方提議簽署展現友誼的互不侵犯條約時，[FROM.GetLeader]表現得非常熱情，乾淨利落地便籤署了相關文件。隨著條約落定，我們向著國內和平乃至世界和平都前進了一大步！"
 bftb_turkey.92.a: "誠應時刻和[ROOT.GetNameDef]親善友好。"
 bftb_turkey.93.t: "[FROM.GetName]拒絕簽署薩德阿巴德條約！"
 bftb_turkey.93.desc: "[FROM.GetLeader]給[ROOT.GetLeader]回覆了封冗長的信函，稱簽署所謂展現友誼的互不侵犯條約的提議簡直一文不值。這還沒完，[FROM.GetLeader]繼續寫道，稱試圖在[FROM.GetNameDef]和[ROOT.GetNameDef]間構建聯盟簡直是浪費時間，若有機會，他們未來更願意選擇一個將[ROOT.GetAdjective]排除在外的方案。"
 bftb_turkey.93.a: "……何不直截了當地說“不”。"
 bftb_turkey.94.t: "經濟崩潰"
 bftb_turkey.94.desc: "隨著本國貨幣的不斷貶值，[ROOT.GetAdjective]的經濟學家已經對本國經濟的蕭條感到了恐慌。這對我國而言真是巨大的悲劇，畢竟我們都小心謹慎地規避了此前世界經濟大蕭條所帶來的最壞影響，然而如今，卻在其他國家擺脫其各自的經濟困境時陰溝翻船，陷入如此不堪的經濟困境當中。\n\n大眾對於政府的信任已經降至歷史最低點，人們普遍相信，[ROOT.GetAdjective]現政權應該對如今國家所面臨的困境負責。"
 bftb_turkey.94.a: "祖國因吾輩之貪婪血流如注……"
 bftb_turkey.95.t: "前奧斯曼將官提議重建蘇丹國"
 bftb_turkey.95.desc: "我們最近收到了一些志趣相投人士的議案，稱他們完全同意我們關於宗教在[ROOT.GetAdjective]國家治理中重要性的看法，但我們知道，這些掮客顯然不僅僅只忠於真主。此外，我們也與部分奧斯曼帝國的前將官們展開了接觸，他們向我們提供了機遇，而這個機遇或許將對我國接下來的歷史產生深遠的影響：他們希望恢復蘇丹的皇位。\n\n此提議倒也並不完全令人驚訝，畢竟政府內的諸多閣僚乃至選民私下裡都對奧斯曼蘇丹國的覆滅表達了失望遺憾之情，並且在談及他們與海外的奧斯曼逃亡者們的關係時不甚自豪。毫無疑問，我們的選民都會支持這個決定，但我國統治階級卻對此意見分裂。如今舉國上下仍舊對穆斯塔法·凱末爾·阿塔圖爾克及其共和國所做的一切滿懷敬重，如果我們就此與這些奧斯曼前朝遺老遺少們達成協議，那麼我們無疑將對阿塔圖爾克的共和國造成毀滅性的衝擊。"
 bftb_turkey.95.a: "我等舊日榮光正待再起……"
 bftb_turkey.95.b: "我等忠於共和國及民主！"
 bftb_turkey.97.t: "[FROM.GetNameDefCap]要求我國臣服"
 bftb_turkey.97.desc: "據說歷史總有相似之處，但肯定沒有政治學家能夠準確預測眼下發生的情況。當我方日前接待了來自[FROM.GetNameDef]的特使，並收到[FROM.GetLeader]要求我方臣服的通牒時，相信我國政府閣僚在感覺上普遍都能實現共情。\n\n這個要求簡直是荒謬無比！這種事情怎麼可能在地球上發生！？土耳其人民怎可能默視此事就此發生？我們怎能置自身於如此境地！？也許事態的確光怪陸離，但威脅亦是真切存在的。我們必須作出抉擇，是已做好準備如同數十年前一樣直面[FROM.GetAdjective]的威脅，還是世易時移，我們如今已不再敢於忤逆其難以捉摸的意願，亦或是冒將其觸怒的風險。"
 bftb_turkey.97.a: "此等奧斯曼賊徒實屬自不量力！"
 bftb_turkey.97.b: "1908年的犧牲不會付之東流！"
 bftb_turkey.97.c: "面對奧斯曼威壓時抵抗毫無意義。"
 bftb_turkey.98.t: "[FROM.GetNameDefCap]自信其盟友庇護"
 bftb_turkey.98.desc: "[FROM.GetAdjective]已經拒絕尊我國政權為宗主亦或是同意我方正當的要求，相反，他們如同懦夫般尋求[FROM.GetFactionName]的武力庇護。我等必須作出決斷，是冒險與[FROM.GetNameDef]的盟友們開戰，還是稍微延後我們的凱旋勝利。"
 bftb_turkey.98.a: "無人可匹敵吾輩神力！"
 bftb_turkey.98.b: "我們不可重蹈1913年的覆轍……"
 bftb_turkey.99.t: "[FROM.GetNameDefCap]撤回其此前要求！"
 bftb_turkey.99.desc: "這些令人惱怒的墮落[FROM.GetAdjective]人已經放棄了其荒謬的要求。儘管有種善意的說法是在他們更改的決定當中或多或少展現了其明智，但這也不過是對[FROM.GetAdjective]政權遠超其應得的謬讚罷了。儘管眼下，和平仍然是[ROOT.GetNameDef]和[FROM.GetNameDef]之間的主旋律，但也僅僅只是現在而已……"
 bftb_turkey.99.a: "我們挺過了一場大危機！"
 bftb_turkey.100.t: "[FROM.GetNameDefCap]向我國臣服！"
 bftb_turkey.100.desc: "隨著卑鄙的[FROM.GetAdjective]就此屈膝臣服，我們距離再興舊日榮光的夙願又近了一步。舉國上下如今都對這場偉大的勝利而歡呼雀躍。"
 bftb_turkey.100.a: "上次大戰的恥辱將不日清算……"
 bftb_turkey.101.t: "[FROM.GetNameDefCap]拒不退讓"
 bftb_turkey.101.desc: "該死的[FROM.GetAdjective]人已經拒絕向我們全知全能的蘇丹陛下臣服，而這便是選擇就此刀兵相向。如果[FROM.GetAdjective]人想要一場戰爭，那麼就給他們這場戰爭！這次可絕不會再是1913年的重演了！"
 bftb_turkey.101.a: "真主榮光指引吾輩利劍。"
 bftb_turkey.102.t: "大馬士革勒令"
 bftb_turkey.102.desc: "那[FROM.GetNameDef]的專橫統治者日前已經以開戰相威脅，要求我們立即向其移交敘利亞的領土。不得不說，我們對這幫[FROM.GetAdjective]強盜的決定感到意外，但即便如此，亦不能使當下的困境有所轉機。\n\n我等必須作出決斷，是就此將這片領土割讓給[FROM.GetAdjective]人以期避免戰爭，還是就此傾盡全力，將[FROM.GetNameDef]掃進他們原本該待著的歷史塵封角落當中。"
 bftb_turkey.102.a: "這不值得我們刀兵相向。"
 bftb_turkey.102.b: "早該徹底粉碎奧斯曼霸權了。"
 bftb_turkey.103.t: "[FROM.GetNameDefCap]拒絕我國要求！"
 bftb_turkey.103.desc: "那些[FROM.GetNameDef]的蠢貨竟然拒絕了我們收回法理領土的合理要求，而這就使得我們僅剩下一條路可走了：戰爭！"
 bftb_turkey.103.a: "吾輩將用彎刀回敬其無禮。"
 bftb_turkey.104.t: "我國收復法理領土！"
 bftb_turkey.104.desc: "不得不說，這些[FROM.GetNameDef]的懦夫們多少在其和平向我方移交敘利亞的決定當中展現出了少見的明智。在將此地重新納入帝國統治的進程中，我們已經趨近完工，不過現在，我們又到了作出抉擇的時刻。\n\n說來也奇怪，在黎凡特地區，當地人民對我們的印象很大程度上竟然是入侵併非法霸佔其家園的外來帝國主義者。儘管這顯然是一派胡言——但這種被誤導的思潮至今依舊存在。因此我們可以在當地扶持傀儡政權，或許還能以此得到更多的長期收益，如有必要，我們也可以在將來再對其進行整合。但另一方面，我們也可以現在就把領土直接併入蘇丹國的疆域——這畢竟也是我們神聖的權利。"
 bftb_turkey.104.a: "我們將重整大馬士革和阿勒頗行省！"
 bftb_turkey.104.b: "歡迎重回帝國疆域！"
 bftb_turkey.110.t: "成功鎮壓[TUR_kurdish_state_event_target.GetName]地區叛軍"
 bftb_turkey.110.desc: "在漫長的拉鋸後，我國軍隊終於在[TUR_kurdish_state_event_target.GetName]地區擊敗了當地的分裂勢力。在克復該地區後，我軍在當地展開了一系列的抓捕行動，並竭力使地區秩序重回正軌。\n\n儘管對戰雙方都蒙受了慘烈的損失，但人民普遍認為，捍衛國家統一所做出的任何犧牲都是值得的。為銘記此等國事，政府呼籲全國為此次戰爭中的死難者展開為期一天的哀悼。"
 bftb_turkey.110.a: "共和國領土不可分裂。"
 bftb_turkey.111.t: "叛軍在[TUR_kurdish_state_event_target.GetName]地區擊敗我軍"
 bftb_turkey.111.desc: "隨著日前我軍在[TUR_kurdish_state_event_target.GetName]地區與分裂武裝的激戰中敗落而被迫撤出，可怕的災難已然在該地區降下。\n\n政府閣僚以及最高統帥部成員均對戰況的急轉直下表現出了震驚，他們熱切呼籲對摧殘此地區的叛軍發起全面且壓倒性的反擊攻勢。儘管[ROOT.GetLeader]並未在公開場合談及此事，但他私底下亦敦促軍方立即發起反擊，以對我國蒙受的損失展開復仇。"
 bftb_turkey.111.a: "他們還沒見識到我們的全力呢。"
 bftb_turkey.113.t: "宗教傳統派抗議宗教違禁品生產"
 bftb_turkey.113.desc: "滿足自由市場的需求一向是凱末爾主義的基石：哪裡有需求，哪裡就有生產。然而部分特定人群——主要指那些信教人士——卻對於[ROOT.GetNameDef]的新世代消費文化不以為然。\n\n由於某些商品被某些社會人士認為是宗教所禁止的存在，因此近期在我國部分地區，已經掀起了針對這些商品生產的抗議活動。這些宗教傳統派真是永遠也無法學會對我們建立世俗[FROM.GetName]社會的構想表示尊重，顯然他們也無法適應這樣的未來。但儘管如此，安撫這些暴民或許比挑起人民內部衝突更加可取。"
 bftb_turkey.113.a: "好吧，我們將屈就尊重下他們的教俗。"
 bftb_turkey.113.b: "我國世俗化進程不會就此受阻。"
 bftb_turkey.114.t: "宗教傳統派和平抗議政府政策"
 bftb_turkey.114.desc: "這才沒過多久，國內日前又掀起了一場宗教傳統派抗議活動。此起彼伏的抗議活動如雨後春筍般在[TUR_fundamentalist_state.GetName]地區不斷湧現，鬧事者抗議在其看來無比專橫的政府正在干涉其無權干涉的事務。此事真是荒謬可笑；我們作為政府機關，職責自然便是對我國公民加以管理。\n\n鑑於這些抗議者目前採取的是和平手段，因此我們倒也不必進行暴力鎮壓。事實上，政府的顧問官們已經草擬了份看似讓步實則毫無意義的妥協案，以此平息[TUR_fundamentalist_state.GetName]地區的鬧事群眾。但儘管如此，如果我們對[TUR_fundamentalist_state.GetName]地區的宗教傳統派作出讓步，或許會招致其他地區的宗教傳統派效仿起事。從這一點上看，也許出動軍隊以捍衛我方核心價值觀是一個更好的選擇。"
 bftb_turkey.114.a: "我們可以作出一定溫和的讓步。"
 bftb_turkey.114.b: "驅除這些冥頑不化的害蟲。"
 bftb_turkey.115.t: "宗教傳統派要求地區自治"
 bftb_turkey.115.desc: "[TUR_fundamentalist_state.GetName]地區的宗教傳統派與政府機關間的緊張對峙，日前幾乎已經達到了臨界點，宗教傳統派已經公然要求按照其宗教律法實現地方自治。如此一來，衝突已經升級，這已經不再是以和平及言語的手段所展開的抗議活動了。\n\n[TUR_fundamentalist_state.GetName]地區的形勢顯然正在超出我方的控制。也許飲鴆止渴般地授予其所要求的自治權，或多或少能夠打壓[TUR_fundamentalist_state.GetName]地區的反叛思潮並將其從目前的問題清單上移除。然而，即便是考量如此行動的可能性，或許也可能被視作某種程度上的叛國……"
 bftb_turkey.115.a: "這是必要的犧牲。"
 bftb_turkey.115.b: "讓他們問問我們軍官團對此“要求”有何想法。"
 bftb_turkey.116.t: "[TUR_fundamentalist_state.GetName]地區遭遇游擊戰襲擊"
 bftb_turkey.116.desc: "我們收到了可怕的消息稱，一名我方駐防於[TUR_fundamentalist_state.GetName]地區的衛戍官兵在最近該地宗教傳統派蓄意謀劃的野蠻襲擊中成為了可悲的受害者。儘管雙方均在交火當中有所傷亡，但叛軍威脅稱除非我方將軍隊從該地撤出，否則他們還會再度發動襲擊。\n\n此誠為悲傷的一天，畢竟眼下，我們陷入了國民同胞間因信仰這種無關緊要的小事而自相殘殺的困境當中。我方軍官團建議我們動用全部的軍事力量發起反擊，鎮壓此地的叛亂；但也有部分政界人士建議採取更為安全的保守措施，將軍隊撤出該地直至局勢緩和。無論如何，這都將是一個艱難的抉擇。"
 bftb_turkey.116.a: "重拳反擊，加倍奉還！"
 bftb_turkey.116.b: "撤出我們的軍隊。"
 bftb_turkey.117.t: "宗教傳統派將異端邪說傳播至[TUR_fundamentalist_state.GetName]"
 bftb_turkey.117.desc: "來自外界的報告顯示宗教傳統派的團體目前已經滲透潛入了[TUR_fundamentalist_state.GetName]地區，其正試圖蠱惑當地民眾迴歸傳統的生活方式——而這毫無疑問與我們的世俗化政策尖銳對立。這些富有號召力的伊瑪目以及活躍的反對派領導者正策動著[TUR_fundamentalist_state.GetName]地區民眾思潮的轉變，截止到目前，所有試圖溫和對其進行勸誡的嘗試均已宣告失敗。\n\n我們已經陷入了進退維谷的境地：誠然我們要爭取民意的支持，但若是不採取更加直接有效的方式，本地區勢必將落入宗教傳統派的掌控當中。我們已經多次嘗試要啟迪我國民智，努力讓大眾轉向世俗主義，然而這些宗教狂熱分子卻依舊不屈不撓地與我們作對。無論如何，是時候作出抉擇了，我們究竟是向[TUR_fundamentalist_state.GetName]地區民眾的意願妥協，還是由政府採取強力措施以挫敗宗教傳統派的陰謀。"
 bftb_turkey.117.a: "不惜一切代價也要阻止他們。"
 bftb_turkey.117.b: "我們必須向人民的意願作出妥協……"
 bftb_turkey.118.t: "宗教傳統派完全控制[TUR_fundamentalist_state.GetName]！"
 bftb_turkey.118.desc: "悲報！剛剛獲悉的消息顯示我們已經完全失去了對[TUR_fundamentalist_state.GetName]的控制。宗教傳統派游擊隊對該地區的各處政府設施和軍事基地發動了協同打擊，在整個局勢失控前，我們幾乎沒有機會組織反擊。\n\n這是我國史無前例的一次挫敗：國家公敵竟然設法完全佔據了[ROOT.GetAdjective]的主權領土。如今奪回[TUR_fundamentalist_state.GetName]需要付出高昂的代價，但坐視它脫離我們的控制同樣代價高昂。時間緊迫，我等必須作出決斷。"
 bftb_turkey.118.a: "傾盡全力對其發起反擊！"
 bftb_turkey.118.b: "我們只能之後再解放該地人民。"
 bftb_turkey.119.t: "[TUR_fundamentalist_state.GetName]地區宗教傳統派向政府妥協"
 bftb_turkey.119.desc: "我們在[TUR_fundamentalist_state.GetName]地區推行的坦率對話以及社區拓展政策已經取得了成效，那些激進的宗教分子已被當地民眾驅逐，對於我國政府而言，這真是個美妙的勝利。\n\n誠然[TUR_fundamentalist_state.GetName]地區的民眾仍舊保留著其宗教上的習俗，但從我們與當地社區領袖的交談中，我們得知當地民眾已不再覺得政府的理念與其宗教信仰存在衝突。在[TUR_fundamentalist_state.GetName]地區，我們已經可以預見團結的[ROOT.GetAdjective]美好的未來。"
 bftb_turkey.119.a: "感謝諸位的合作。"
 bftb_turkey.126.t: "[FROM.GetNameDefCap]呈遞投資項目"
 bftb_turkey.126.desc: "來自[FROM.GetNameDef]的代表團日前對我國進行了訪問，並在此期間與我國諸多政界人士展開了會談，希望能夠爭取到後者對其投資計劃的支持。根據計劃，[FROM.GetNameDef]政府希望能夠利用我國的戰略資源以擴大其工業產能。若是在此伸出援手，[FROM.GetAdjective]官員認為我們可以期望兩國在未來共同構築起一個互惠共贏的軍事同盟。"
 bftb_turkey.126.a: "如果這就是其需要的援助，那就給他們吧。"
 bftb_turkey.126.b: "我們不會簽署此等浮士德式的交易。"
 bftb_turkey.127.t: "[FROM.GetNameDefCap]拒絕進行投資"
 bftb_turkey.127.desc: "我們已經從[FROM.GetNameDef]方面得知了壞消息：儘管[FROM.GetAdjective]對我方毫無惡意，但其還是告知稱[FROM.GetNameDef]無意在我方工業產能上投資任何資源。該國官員在此問題上態度堅決，並要求我方在近期不要再提出這類議案。"
 bftb_turkey.127.a: "令人遺憾，但可以理解。"
 bftb_turkey.128.t: "[FROM.GetNameDefCap]完成其投資"
 bftb_turkey.128.desc: "我們已經收到了[FROM.GetAdjective]官員的通知，其負責的投資項目日前已經完工。我方巡檢已經對工地進行視察以確保其符合我方預期，而檢查結果可以說相當令人滿意。\n\n[FROM.GetAdjective]觀察家已就此項目的完工發表了評論，他們認為[FROM.GetNameDef]未來應該不會介意在[ROOT.GetNameDef]投資更多類似甚至更加浩大的項目。"
 bftb_turkey.128.a: "他們幫了我們大忙。"
 bftb_turkey.129.t: "[FROM.GetNameDefCap]投資我國輕工業"
 bftb_turkey.129.desc: "我們已經收到了[FROM.GetAdjective]官員的通知，[FROM.GetAdjective]此前負責的工業投資項目日前已經完工。我方巡檢已經對工地進行視察以確保其符合我方預期，而檢查結果可以說相當令人滿意，我們可以期待新設施能夠立即投入生產。\n\n[FROM.GetAdjective]觀察家已就此項目的完工發表了評論，他們認為[FROM.GetNameDef]未來應該不會介意進行更多類似甚至更加浩大項目的投資。"
 bftb_turkey.129.a: "多麼美妙的消息！"
 bftb_turkey.130.t: "[FROM.GetNameDefCap]投資我國軍工業"
 bftb_turkey.130.desc: "我們已經收到了[FROM.GetAdjective]官員的通知，[FROM.GetAdjective]此前負責的機密工業援建項目日前已經完工。我方巡檢已經對工地進行視察以確保其符合我方預期，而檢查結果可以說相當令人滿意，我們可以期待新設施能夠立即投入生產。\n\n[FROM.GetAdjective]觀察家已就此項目的完工發表了評論，他們認為[FROM.GetNameDef]未來應該不會介意進行更多類似項目的投資。"
 bftb_turkey.130.a: "諸君誠為[ROOT.GetAdjective]真正的朋友。"
 bftb_turkey.131.t: "[FROM.GetNameDefCap]同意對[GRE.GetNameDef]的瓜分案"
 bftb_turkey.131.desc: "我們已就如何與[FROM.GetNameDef]瓜分[GRE.GetNameDef]領土的事宜達成了一致。[FROM.GetNameDefCap]將得到東地中海以及愛奧尼亞海沿岸的地區，而我們將得到與我們共鄰愛琴海沿岸的[GRE.GetAdjective]核心地區。事到如今的確令人遺憾，但終究是[GRE.GetNameDef]方面讓我等在此事上別無選擇。"
 bftb_turkey.131.a: "願全能的主寬恕我等，但[GRE.GetNameDef]必須被毀滅。"
 bftb_turkey.132.t: "[FROM.GetNameDefCap]拒絕對[GRE.GetNameDef]的瓜分案！"
 bftb_turkey.132.desc: "[FROM.GetNameDefCap]已經拒絕了我方在瓜分[GRE.GetNameDef]領土上的合理提案，看起來他們更願意無視這些領土上居住的人民意願，直接鯨吞其國。雖然侵略行徑從不會被冠以“美好”的修飾，但其至少也應該是矜持有序的——然而這些[FROM.GetAdjective]人看起來想要把這次入侵轉變為混亂的侵略競賽，在迫使[GRE.GetAdjective]人屈服前，他們將竭盡所能地攻城略地。\n\n這既非我國的行事之道，亦非事態預想中的發展態勢！此前的心血如今已然白費！"
 bftb_turkey.132.a: "那麼讓略地競賽開始吧！"
 bftb_turkey.133.t: "穆斯塔法·凱末爾·阿塔圖爾克染疾"
 bftb_turkey.133.desc: "昨天，穆斯塔法·凱末爾·阿塔圖爾克在其遊艇上招待老朋友時因突發性昏迷而被緊急送醫。算上這次，近期發生的一系列事情都表明阿塔圖爾克的健康狀況正急劇惡化，鑑於其身體狀況愈發難料，諸多顧問已經在私下裡表達了對阿塔圖爾克操勞國事過度的擔憂。\n\n儘管這位國父依舊聲稱自己身體無恙，但政府依舊開始私下監督起他的健康狀況，並且針對一系列可能的狀況制定了相應的應對措施。如果阿塔圖爾克仍然不願放下國事轉而保養自己的健康，那麼我們可能必須要奉請國父強制退休，好讓其能與家人共度生命中的最後時光。"
 bftb_turkey.133.a: "我們正在與時間賽跑。"
 bftb_turkey.134.t: "穆斯塔法·凱末爾·阿塔圖爾克逝世"
 bftb_turkey.134.desc: "\n共和國沉痛哀悼！\n\n傑出的戰爭英雄、革命家、土耳其共和國總統及國父——穆斯塔法·凱末爾·阿塔圖爾剋日前在睡夢中平靜地離開了我們。\n\n沒人敢奢望自己能具備如同穆斯塔法·凱末爾·阿塔圖爾克那般出神入化的領導才能，但土耳其國父顯然也不希望他所珍視的共和國因自己的離去而陷入混亂當中。\n\n鑑於甚至沒人曾幻想過自己能與尊敬的國父並駕齊驅，因此我們並不尋求替換我們的加齊，但是我們必須選擇一位至少能夠追隨阿塔圖爾克腳步的可信領袖作為繼任者。他們必須證明自己對凱末爾價值觀的忠誠，並且在行使作為[TUR.GetNameDef]國家領導人的權力時，時刻視阿塔圖爾克為榜樣。"
 bftb_turkey.134.a: "傑拉勒·拜亞爾是當之無愧的候選者。"
 bftb_turkey.134.b: "傑拉勒·拜亞爾是當之無愧的候選者。"
 bftb_turkey.134.c: "伊斯麥特·伊諾努是阿塔圖爾克合適的繼任者。"
 bftb_turkey.134.d: "費夫齊·恰克馬克正是[TUR.GetNameDef]所需的領袖。"
 bftb_turkey.134.e: "費夫齊·恰克馬克將竭力確保我國的安泰。"
 bftb_turkey.134.f: "雷傑普·佩克爾將實現法西斯-凱末爾主義的合流。"
 bftb_turkey.134.g: "謝夫凱特·敘雷亞·艾德邁爾的才幹將引領我們。"
 bftb_turkey.134.h: "只有伊斯麥特·伊諾努方能引領[TUR.GetAdjective]特色社會主義。"
 bftb_turkey.134.i: "卡齊姆·奧爾巴伊在我們找到出路前將以軍政府監國。"
 bftb_turkey.135.t: "穆斯塔法·凱末爾·阿塔圖爾克逝世"
 bftb_turkey.135.desc: "\n共和國沉痛哀悼！\n\n傑出的戰爭英雄、革命家、土耳其總統及國父——穆斯塔法·凱末爾·阿塔圖爾剋日前在睡夢中平靜地離開了我們。\n\n國父生前對土耳其人民以及他締造的共和國鞠躬盡瘁，履行職責直到其生命的最後一刻。在他的遺體用沉箱裝載、由輪船和列車運抵安卡拉前，成千上萬的哀悼者自發聚集在伊斯坦布爾表達著他們的哀思敬意。他的國葬已於安卡拉舉行，大國民議會全體成員以及來自世界各地的政要都出席了葬禮。\n\n隨著現代土耳其國家之父的逝世，土耳其共和國必須繼續前行。作為阿塔圖爾克葬禮上諸多演講者之一，[ROOT.GetLeader]在其演說中承諾誓將繼承這位偉人的遺產，繼續捍衛其所珍視的國家自由。"
 bftb_turkey.135.a: "安息吧加齊，我們將永遠銘記您。"
 bftb_turkey.136.t: "奧斯曼皇室突遭悲劇！"
 bftb_turkey.136.desc: "隨著蘇丹陛下不幸駕崩的噩耗降臨，偉大的奧斯曼蘇丹國上下已然籠罩在了悲痛欲絕的氛圍當中。蘇丹陛下及諸位王子殿下原本正在視察尼克薩爾富饒的土地，當他們於薩姆松省境內的卡尼克山脈旅行時，一場地震席捲了整個省份。這場災害造成諸位皇室成員的遺體直到三天後才被發現，眼下，整個奧斯曼皇室已經因此陷入了狂亂的恐慌。\n\n根據修訂後的奧斯曼皇位繼承法，蘇丹陛下最年長的公主殿下將有權繼承大統。儘管殿下是一位意志堅強且天賦異稟的女性，但是我國宗教界的諸多保守人士可能會反對讓一名女子加冕奧斯曼帝國的皇冠。"
 bftb_turkey.136.a: "蘇丹娜陛下萬歲！"
 bftb_turkey.136.b: "讓女人登基！？不可接受！我們需要一位攝政王！"
 bftb_turkey.137.t: "[FROM.GetNameDefCap]轉變危險外交立場"
 bftb_turkey.137.desc: "[FROM.GetNameDef]政府已然轉變了其外交政策，而該國的新外交政策顯然並不符合我國的利益。[FROM.GetNameDef]代表已經就此照會我國外交官，稱其無意再轉變當前的立場。"
 bftb_turkey.137.a: "他們已然墮落為其曾想摧毀的存在。"
 bftb_turkey.137.b: "他們是革命大業的叛徒！"
 bftb_turkey.137.c: "或許他們正在試驗一國社會主義？"
 bftb_turkey.137.d: "只要他們別染指我們的盟友……"
 bftb_turkey.137.e: "他們顯然已不再值得信任。"
 TUR_keeping_turkey_under_observation: "我們應對§Y[TUR.GetNameDef]§!的行動保持警惕，並在將來必要時將其逐出我們的陣營。"
 bftb_turkey.138.t: "[FROM.GetNameDefCap]侵犯陣營成員國主權！"
 bftb_turkey.138.desc: "正如我國外交政策專家所預料的那樣，[FROM.GetNameDef]已經將其野望投向了自己的盟友。儘管我們就其政府的野蠻行徑向[FROM.GetAdjective]代表發出了譴責，但似乎並沒有產生什麼影響。"
 bftb_turkey.138.a: "他們還有一次機會，最後一次！"
 bftb_turkey.138.b: "繼續庇護這種流氓國家百害而無一利。"
 bftb_turkey.139.t: "[FROM.GetNameDefCap]再次侵犯陣營成員國主權！"
 bftb_turkey.139.desc: "這些執掌[FROM.GetNameDef]國家大權的已經再次背叛了我們的信任！如此聽之任之的裝模作樣不能再繼續下去了，我們不可能在庇護顯然是敵人的國家的情況下，還贏得盟友的尊重。"
 bftb_turkey.139.a: "他們已經被警告過了！"
 bftb_turkey.140.t: "[FROM.GetNameDefCap]發出警告"
 bftb_turkey.140.desc: "我們已經收到了警告，[FROM.GetAdjective]政府告誡我方切勿再次侵犯同陣營成員國的主權。他們願意對我方此次的行動作出妥協，但若是我方膽敢再對同盟成員國出手，則[FROM.GetNameDef]將不得不採取相應的懲戒措施。"
 bftb_turkey.140.a: "我們將隨心所欲行事。"
 bftb_turkey.141.t: "[FROM.GetNameDefCap]將我國逐出[FROM.GetFactionName]！"
 bftb_turkey.141.desc: "我國新的外交政策已被證明不可能與[FROM.GetNameDef]相兼容，因此他們決定不再視我國為其盟友。從即日起，我國將不再是[FROM.GetFactionName]的成員。"
 bftb_turkey.141.a: "那就這樣吧。"
 TUR_downgrade_fundamentalist_defiance_effect_tt: "£faction_tur_traditionalist §Y宗教傳統派§!將在§Y[TUR_fundamentalist_state.GetName]§!與政府更為合作。"
 TUR_upgrade_fundamentalist_defiance_effect_tt: "£faction_tur_traditionalist §Y宗教傳統派§!將在§Y[TUR_fundamentalist_state.GetName]§!更加激烈地抵抗政府。"
 TUR_placate_fundamentalist_state_effect_tt: "£faction_tur_traditionalist §Y宗教傳統派§!將在§Y[TUR_fundamentalist_state.GetName]§!停止發表反政府言論並積極合作。"
 TUR_placate_fundamentalist_state_all_targets_effect_tt: "£faction_tur_traditionalist §Y宗教傳統派§!將停止對抗政府。"
 bftb_bulgaria_tsar_boris.1.t: "鮑里斯三世沙皇巡幸[GetDestinationName]"
 bftb_bulgaria_tsar_boris.1.desc_success: "今天，鮑里斯沙皇巡幸了[GetDestinationName]，當王室的儀仗行經此處地標性路段時，前來歡迎的百姓們歡欣鼓舞，令聖上龍顏大悅。\n但陛下此行並非只是來享受臣民的歡呼愛戴的，他在駕臨之後舉行了數次盛會，並藉此召見了地方上的權貴們。\n\n總體而言，沙皇陛下不虛此行，他既加強了與本地豪族權貴之間的聯繫，也成功地向平民們展現了其仁君的形象。"
 bftb_bulgaria_tsar_boris.1.desc_extra_success: "皇室對[GetDestinationName]的巡幸已然取得圓滿成功！在結束前往市政廳會見本地市長的行程後，沙皇陛下決定臨幸[GetDestinationName]當地的一個普通街區，與臣民同樂。\n民眾對於鮑里斯沙皇的造訪反應相當熱情，大家都對這位統治者穿行於眾人日常生活的街區感到欣喜，他們還向沙皇敬獻了些飽含情誼的小禮物，從花圈、本地特產到木製或鐵製小工藝品都有。\n\n雖然我們尚不清楚這些誠摯而淳樸的問候在沙皇陛下心中究竟留下了怎樣的感受，但我們所知的是，面對這種情況，沙皇決定舉辦一場面向大眾的盛大百家宴以替代原本的私人招待會或是尊貴的花園派對。不用說，[GetDestinationName]民眾對於這項提議感到很高興，每個人都玩到很晚才回家，大家在此次巡遊結束後均心滿意足。"
 bftb_bulgaria_tsar_boris.1.desc_failure: "皇室日前對[GetDestinationName]的巡幸很遺憾適得其反，嚴重地挫傷了沙皇的支持率。僅僅只是在歡迎儀式上，我們就可以看到夾雜在歡迎隊列當中的大批貧苦臣民並不快樂，甚至還可以聽見人群當中時不時響起的噓聲。\n\n而當民眾聚集在市政廳外發起抗議時，情況進一步惡化。當時沙皇及其家人正在市政廳內享受著本地權貴階層為其籌辦的奢華宴會和盛大招待，人民以此奢靡的享樂為由，猛烈抨擊上層權貴階級應當為近年來國家遭遇的社會與經濟問題負責。\n\n為平息事態，警方立刻奉命出動驅散了抗議人群，然而如此暴力執法只是進一步惡化局勢，示威活動後續逐漸演變為了暴力騷亂。"
 bftb_bulgaria_tsar_boris.1.a: "陛下再次巡幸將在何時？"
 bftb_bulgaria_tsar_boris.1.b: "這將是令人難忘的一夜！"
 bftb_bulgaria_tsar_boris.1.c: "還是暫時不要巡遊了……"
 bftb_bulgaria_tsar_boris.2.t: "鮑里斯三世沙皇逝世"
 bftb_bulgaria_tsar_boris.2.desc: "[GetBorisDeathContext]\n[GetSuspicionsAboutBorisDeath]"
 BUL_context_of_death_basic: "在飽受病痛折磨一週後，鮑里斯三世沙皇在今天，[?BUL.BUL_date_of_tsars_death.GetDateStringNoHourLong]，因心力衰竭逝世於[BUL.Capital.GetName]。"
 BUL_context_of_death_assassinated: "幾個小時前，當鮑里斯三世沙皇結束對於索菲亞大學的國家拜占庭學研究年會的出席，正要離場時，一名男子迅速接近沙皇，旋即掏出武器向其連開數槍。儘管該名男子隨後便被安保部隊擊斃，但幾分鐘後，鮑里斯沙皇還是不幸身亡，與刺客共赴黃泉。"
 BUL_context_of_death_ger: "在日前於[GetBorisGermanMeetingLocation]和[GER.GetLeader]進行了一場原定計劃外的艱苦會談後，返回[BUL.Capital.GetName]的鮑里斯三世沙皇因突發性心力衰竭逝世。"
 BUL_boris_german_meeting_location_historical: "東普魯士拉斯登堡“狼穴”大本營"
 BUL_boris_german_meeting_location_capital: "[GER.Capital.GetName]"
 BUL_context_of_death_sov: "在日前於[SOV.Capital.GetName]和[SOV.GetLeader]進行會晤後，返回[BUL.Capital.GetName]的沙皇鮑里斯三世因突發性心力衰竭逝世。"
 BUL_context_of_death_eng: "在[ENG.Capital.GetName]和[ENG.GetLeader]進行會晤一週後，返回[BUL.Capital.GetName]的鮑里斯三世沙皇因突發性心力衰竭逝世。"
 BUL_popular_suspicions_about_death_basic: "然而，關於沙皇的確切死因卻是眾說紛紜：有推測認為鮑里斯是在其最後的會晤當中遭到了投毒，很多人相信[GER.GetLeader]就是下手的真兇；而有一部分人則相信是蘇聯內務人民委員會下毒害死了沙皇；還有人則繪聲繪色地將矛頭指向了[ENG.GetNameDef]；更有甚者還聲稱，[BUL.GetAdjective]政府自己也捲入了沙皇之死的疑雲當中……"
 BUL_popular_suspicions_about_death_assassinated: "國家安全部門已就此事展開調查試圖找出弒君案的責任者，而根據官方報道，刺客竟然同時持有保加利亞、德國以及英國的多重護照，這無疑將進一步擴大搜查範圍並使調查變得更為複雜。儘管大部分保加利亞人正對[GER.GetLeader]、蘇聯人民內務委員會或者[ENG.GetAdjective]口誅筆伐，但是也有部分人士公然宣稱，保加利亞政府自身也捲入了弒君案疑雲當中……"
 bftb_bulgaria_tsar_boris.2.a: "真是令人不安……"
 bftb_bulgaria_tsar_boris.3.t: "攝政議會"
 bftb_bulgaria_tsar_boris.3.desc: "現在是時候任命將要代表鮑里斯沙皇的儲君西美昂二世陛下治理[ROOT.GetNameDef]的攝政議會成員了。\n\n我們必須從皇室乃至上層政界和軍界當中挑選最合適的人選，但鑑於每位候選者皆有其各自的理念信仰，以及我國因前任領導人的決策已然飽受創傷的現狀，我們必須作出明智的抉擇……"
 bftb_bulgaria_tsar_boris.3.a: "組建親軸心國政府。"
 bftb_bulgaria_tsar_boris.3.b: "組建親同盟國政府。"
 bftb_bulgaria_tsar_boris.3.c: "組建獨立自主政府。"
 bftb_bulgaria_factions.10.t: "環節集團密謀端倪"
 bftb_bulgaria_factions.10.desc: "根據可靠的消息來源表明，一些平日裡公開批評政府當局的環節集團成員最近已經與部分軍官聯絡。儘管我們尚不確定其私下會面的意圖或者是這些軍官的具體姓名，但毫無疑問，這樣可疑的舉動定然是環節集團更大陰謀的端倪……"
 bftb_bulgaria_factions.10.a: "繼續調查！"
 bftb_bulgaria_factions.10.b: "讓我們且看其將如何行動……"
 bftb_bulgaria_factions.11.t: "環節集團密謀者敗露"
 bftb_bulgaria_factions.11.desc: "在深入的調查以及與部分忠於政府的環節集團成員接觸後，我們發現了一個旨在顛覆現政權的軍事陰謀計劃。\n而在與此陰謀相關的人員清單當中，我們發現[?BUL_zveno_conspirator.GetName]——這位我們信任有加的將軍竟然也赫然在列。\n\n現在，我等必須作出決斷，要如何處置這位似乎已不再忠誠的軍官。"
 bftb_bulgaria_factions.11.a: "立即將其清洗！"
 bftb_bulgaria_factions.11.b: "我們不應急著下定論。"
 bftb_bulgaria_factions.12.t: "環節集團政變在即"
 bftb_bulgaria_factions.12.desc: "我們已經收到消息，在處心積慮準備多時後，環節集團現在已經決意向我們發動其最終的軍事政變計劃。\n也許他們妄想如同1934年那樣再次顛覆現政權，但這次我們會重拳阻截，並將他們這個組織一勞永逸地徹底剷除。"
 bftb_bulgaria_factions.12.a: "我們將碾碎他們！"
 bftb_bulgaria_factions.17.t: "環節集團被整合"
 bftb_bulgaria_factions.17.desc: "我們終於成功地將環節集團整合到現政府的行列當中，進一步深化了這個前政治組織成員與執政黨之間本就十分融洽的協作關係。如此一來，我們已然可以更進一步，使整個國家當中這些最傑出的人才齊聚一堂、共謀大業。"
 bftb_bulgaria_factions.17.a: "讓我們立刻將此良策付諸行動！"
 bftb_bulgaria_factions.19.t: "環節集團覆滅！"
 bftb_bulgaria_factions.19.desc: "在過去的幾週當中，警方一直在不遺餘力地剷除環節集團的餘黨，在此之前，由於我們成功逮捕了該組織的領導層，其組織結構已經因群龍無首的混亂而遭到了極大的削弱。\n我們現在已經可以負責任地說環節集團已在[ROOT.GetNameDef]銷聲匿跡，而這誠為整個國家以及政府值得慶賀的喜事。"
 bftb_bulgaria_factions.19.a: "真是好消息！"
 bftb_bulgaria_factions.20.t: "工人罷工"
 bftb_bulgaria_factions.20.desc: "社會民主工黨-廣泛派的成員們已經加入了共產黨人的行列，並且竭力在工人群體中掀起全國性的罷工浪潮。而通過秘密集會以及碰頭，他們已經在保加利亞無產階級群體當中博得了極大的同情與支持。\n身處這些罷工浪潮高漲的地區維持秩序時，我方必須謹慎行事，以免事態升級到比罷工更為嚴重的地步……"
 bftb_bulgaria_factions.20.a: "飢餓便可令其最終拱手而降。"
 bftb_bulgaria_factions.20.b: "我們必須不惜任何代價將其鎮壓！"
 bftb_bulgaria_factions.21.t: "騷亂造成破壞"
 bftb_bulgaria_factions.21.desc: "隨著軍隊開始鎮壓罷工者，暴力衝突以及騷亂已經在各工業產區蔓延開來。在[?BUL.BUL_damaged_civs_state.GetName]地區，騷亂造成數座民用工廠被毀[GetMilitaryFactoriesDamaged]。[GetInfrastructureDamaged]"
 bftb_bulgaria_factions.21.a: "不幸的結果……"
 BUL_bs_strikes_no_military_factories_damaged: ""
 BUL_bs_strikes_military_factories_damaged_same_state: " 的同時，還有數個共產黨團體試圖通過毀壞本地的軍工設施以損害我們的武器裝備生產"
 BUL_bs_strikes_military_factories_damaged_other_state: "。而在[?BUL.BUL_damaged_mils_state.GetName]地區，還有數個共產黨團體試圖通過毀壞本地的軍工設施以損害我們的武器裝備生產"
 BUL_bs_strikes_no_infrastructure_damaged: ""
 BUL_bs_strikes_infrastructure_damaged: " 另一方面，暴力騷亂還在[?BUL.BUL_damaged_infrastructure_state.GetName]地區造成了公路、鐵路等交通線路遭到破壞與阻塞。"
 bftb_bulgaria_factions.27.t: "社會民主工黨-廣泛派被整合"
 bftb_bulgaria_factions.27.desc: "我們終於成功地將社會民主工黨-廣泛派整合到現政府的行列當中，進一步深化了這個前政治組織成員與執政黨之間本就十分融洽的協作關係。如此一來，我們已然可以更進一步，使整個國家當中這些最傑出的人才齊聚一堂、共謀大業。"
 bftb_bulgaria_factions.27.a: "我們需要精誠合作以成大業！"
 bftb_bulgaria_factions.29.t: "社會民主工黨-廣泛派覆滅"
 bftb_bulgaria_factions.29.desc: "在過去的幾週當中，警方一直在不遺餘力地剷除社會民主工黨-廣泛派的餘黨，在此之前，由於我們成功逮捕了該組織的領導層，其組織結構已經因群龍無首的混亂而遭到了極大的削弱。\n我們現在已經可以負責任地說社會民主工黨-廣泛派已在[ROOT.GetNameDef]銷聲匿跡，而這誠為整個國家以及政府值得慶賀的喜事。"
 bftb_bulgaria_factions.29.a: "這可花了點兒時間……"
 bftb_bulgaria_factions.30.t: "農民聯盟在鄉村的支持率上升"
 bftb_bulgaria_factions.30.desc: "國家農民聯盟目前正在我國鄉村地區非法掀起其宣傳造勢的運動，在這些地區，成千上萬的農民受其蠱惑對政府產生了質疑，並且加入到了他們的陣營當中。\n農民聯盟強烈抨擊本國過去的尚武政策，稱其給保加利亞帶來了毀滅與恥辱，同時他們還試圖將此甩鍋予當局，以期在民眾當中引發更大的不滿與動搖。"
 bftb_bulgaria_factions.30.a: "這簡直不可接受！"
 bftb_bulgaria_factions.31.t: "農民聯盟分裂"
 bftb_bulgaria_factions.31.desc: "儘管此前農民聯盟與共產黨之間並未有過太多的合作，但眼下兩者似乎已就推翻現政府這一目標達成了某種共識。\n部分農民聯盟成員已決定脫離該組織以加入共產黨，但另一方面，該組織的更多保守派成員仍然堅定地站在資產階級和布爾什維主義的對立面，為此，他們試圖通過政治手段，與政府達成某種程度上的諒解。"
 bftb_bulgaria_factions.31.a: "這些該死的鼠輩！"
 bftb_bulgaria_factions.37.t: "農民聯盟被整合"
 bftb_bulgaria_factions.37.desc: "我們終於成功地將農民聯盟整合到現政府的行列當中，進一步深化了這個前政治組織成員與執政黨之間本就十分融洽的協作關係。如此一來，我們已然可以更進一步，使整個國家當中這些最傑出的人才齊聚一堂、共謀大業。"
 bftb_bulgaria_factions.37.a: "這對國家有巨大的益處。"
 bftb_bulgaria_factions.39.t: "農民聯盟覆滅"
 bftb_bulgaria_factions.39.desc: "在過去的幾週當中，警方一直在不遺餘力地剷除農民聯盟的餘黨，在此之前，由於我們成功逮捕了該組織的領導層，其組織結構已經因群龍無首的混亂而遭到了極大的削弱。\n我們現在已經可以負責任地說農民聯盟已在[ROOT.GetNameDef]銷聲匿跡，而這誠為整個國家以及政府值得慶賀的喜事。"
 bftb_bulgaria_factions.39.a: "他們永遠地消停了！"
 bftb_bulgaria_factions.40.t: "向[GetMarchDestinationName]進軍"
 bftb_bulgaria_factions.40.desc: "國家社會主義運動，這個借鑑了多年前保加利亞青年軍團聯盟經驗基礎上發展出來的組織，如今已經聚集了眾多的支持者，並且組織起一場從[Root.Capital.GetName]向[GetMarchDestinationName]進軍的大遊行。\n這些抗議者效仿納粹，手持火炬引路，要求政府採取更加激烈的手段以粉碎那些意欲顛覆社會秩序的布爾什維克組織，組建全國性的工團聯合組織以鎮壓階級鬥爭，同時在保加利亞的經濟與社會問題上採取更多的國家干預。\n目前來看，鑑於這場運動在城市青年群體中的影響力正不斷擴大，因此，我們如果想要對其進行鎮壓，則應立即採取行動，以免延誤良機。"
 bftb_bulgaria_factions.40.a: "這所謂“進軍”甚至壓根不是原創的！"
 bftb_bulgaria_factions.40.b: "在他們成為更大威脅前，我們必須先令其緘默。"
 bftb_bulgaria_factions.47.t: "國家社會主義運動被整合"
 bftb_bulgaria_factions.47.desc: "我們終於成功地將國家社會主義運動整合到現政府的行列當中，進一步深化了這個前政治組織成員與執政黨之間本就十分融洽的協作關係。如此一來，我們已然可以更進一步，使整個國家當中這些最傑出的人才齊聚一堂、共謀大業。"
 bftb_bulgaria_factions.47.a: "我們常說這會更好……"
 bftb_bulgaria_factions.49.t: "國家社會主義運動覆滅"
 bftb_bulgaria_factions.49.desc: "在過去的幾週當中，警方一直在不遺餘力地剷除國家社會主義運動的餘黨，在此之前，由於我們成功逮捕了該組織的領導層，其組織結構已經因群龍無首的混亂而遭到了極大的削弱。\n我們現在已經可以負責任地說國家社會主義運動已在[ROOT.GetNameDef]銷聲匿跡，而這誠為整個國家以及政府值得慶賀的喜事。"
 bftb_bulgaria_factions.49.a: "沒人會想念他們的！"
 bftb_bulgaria_factions.50.t: "環節集團鎮壓行動"
 bftb_bulgaria_factions.50.desc: "我們已經成功對環節集團實施了鎮壓，對其那些據報公開發表反對[ROOT.GetLeader]言論甚至是陰謀顛覆政權的組織成員實施了逮捕。"
 bftb_bulgaria_factions.50.a: "他們不過是罪有應得。"
 bftb_bulgaria_factions.51.t: "環節集團鎮壓行動"
 bftb_bulgaria_factions.51.desc: "我國安防部隊日前對環節集團發動了一場大規模的鎮壓行動，根據行動指揮官的報告，警方在該組織的秘密集會上設法抓捕了多名主事者，從結果來看，此次行動可謂大獲全勝。"
 bftb_bulgaria_factions.51.a: "真是好消息！"
 bftb_bulgaria_factions.52.t: "環節集團鎮壓行動"
 bftb_bulgaria_factions.52.desc: "我們試圖鎮壓環節集團的行動不幸失敗。行動中警方攻入了據報是環節集團策劃對抗政府活動的秘密集會地點，然而儘管此處的確存在環節集團成員，但集會根本與其組織無關，更遑論政治了。\n自不用說，這次警方的失敗行動招致了保加利亞民眾乃至環節集團的不少白眼……"
 bftb_bulgaria_factions.52.a: "真是尷尬……"
 bftb_bulgaria_factions.53.t: "環節集團領導層抓捕行動"
 bftb_bulgaria_factions.53.desc: "抓捕環節集團領導層的行動大獲成功。包括基蒙·格奧爾基耶夫在內的數位該組織重要人物均已被逮捕，這顯然對該組織造成了重大的打擊。"
 bftb_bulgaria_factions.53.a: "他們沒法繼續惹麻煩了！"
 bftb_bulgaria_factions.54.t: "環節集團領導層抓捕行動"
 bftb_bulgaria_factions.54.desc: "抓捕環節集團領導層的行動並不如預想中的那般順利。儘管警方逮捕了該組織的一些重要成員，但其領導人基蒙·格奧爾基耶夫卻設法逃離。如此一來，即便此君目前被迫轉入地下，他也依舊繼續領導著整個環節集團。"
 bftb_bulgaria_factions.54.a: "真是令人失望的結果……"
 bftb_bulgaria_factions.55.t: "環節集團領導層抓捕行動"
 bftb_bulgaria_factions.55.desc: "抓捕環節集團領導層的行動徹底失敗。當警方攻入對方秘密集會的場所時，佔據極大人數優勢的特工們竟然未能及時制服集會人員，導致後者迅速逃離事發地，並在隨後與警方在街道上爆發了正面暴力衝突，造成諸多無辜平民受傷。鑑於如此由警方引起的暴力事件，當地許多居民不禁開始同情起環節集團，他們不僅開始幫助該組織成員逃離追捕，甚至還直接加入其對抗國家機關的隊列當中。"
 bftb_bulgaria_factions.55.a: "必須有人為此次失敗負責！"
 bftb_bulgaria_factions.60.t: "社會民主工黨-廣泛派鎮壓行動"
 bftb_bulgaria_factions.60.desc: "我們已經成功對社會民主工黨-廣泛派實施了鎮壓，對其那些據報在民眾中企圖煽動抗議或引起騷亂的組織成員實施了逮捕。"
 bftb_bulgaria_factions.60.a: "他們不過是罪有應得。"
 bftb_bulgaria_factions.61.t: "社會民主工黨-廣泛派鎮壓行動"
 bftb_bulgaria_factions.61.desc: "我國安防部隊日前對社會民主工黨-廣泛派發動了一場大規模的鎮壓行動，根據報道，警方在該組織與工會及共產黨成員碰頭的秘密集會上設法抓捕了多名主事者。警方指揮官宣稱，此次行動可謂大獲全勝。"
 bftb_bulgaria_factions.61.a: "真是好消息！"
 bftb_bulgaria_factions.62.t: "社會民主工黨-廣泛派鎮壓行動"
 bftb_bulgaria_factions.62.desc: "我們試圖鎮壓社會民主工黨-廣泛派的行動不幸失敗。行動中警方攻入了據報是社會民主工黨-廣泛派用於會見工會組織以及共產黨成員以策劃罷工的秘密集會地點，然而事實卻是，社會民主工黨·廣泛派的成員只是在那裡學習一堂托多·帕夫洛夫關於辯證唯物主義的課程，造成警方的闖入直接出盡了洋相。\n自不用說，這次警方的失敗行動招致了保加利亞民眾乃至社會民主工黨-廣泛派的不少白眼……"
 bftb_bulgaria_factions.62.a: "真是尷尬……"
 bftb_bulgaria_factions.63.t: "社會民主工黨-廣泛派領導層抓捕行動"
 bftb_bulgaria_factions.63.desc: "抓捕社會民主工黨-廣泛派領導層的行動大獲成功。警方拘捕了大部分與該組織有關聯的重要人物，這顯然對該組織造成了重大的打擊。"
 bftb_bulgaria_factions.63.a: "他們沒法繼續惹麻煩了！"
 bftb_bulgaria_factions.64.t: "社會民主工黨-廣泛派領導層抓捕行動"
 bftb_bulgaria_factions.64.desc: "抓捕社會民主工黨-廣泛派領導層的行動並不如預想中的那般順利。儘管警方逮捕了該組織的一些重要成員，但其幾名主要領袖卻設法逃離。如此一來，即便他們目前被迫轉入地下，他們也依舊繼續領導著整個社會民主工黨-廣泛派組織。"
 bftb_bulgaria_factions.64.a: "真是令人失望的結果……"
 bftb_bulgaria_factions.65.t: "社會民主工黨-廣泛派領導層抓捕行動"
 bftb_bulgaria_factions.65.desc: "抓捕社會民主工黨-廣泛派領導層的行動徹底失敗。當警方攻入對方秘密集會的場所時，佔據極大人數優勢的特工們竟然未能及時制服集會人員，導致後者迅速逃離事發地，並在隨後與警方在街道上爆發了正面暴力衝突，造成諸多無辜平民受傷。鑑於如此由警方引起的暴力事件，當地許多居民不禁開始同情起社會民主工黨-廣泛派，他們不僅開始幫助該組織成員逃離追捕，甚至還直接加入其對抗國家機關的隊列當中。"
 bftb_bulgaria_factions.65.a: "必須有人為此次失敗負責！"
 bftb_bulgaria_factions.70.t: "農民聯盟鎮壓行動"
 bftb_bulgaria_factions.70.desc: "我們已經成功對國家農民聯盟實施了鎮壓，對其那些據報在公開場合發表忤逆當局的言論或在民眾中企圖煽動抗議的組織成員實施了逮捕。"
 bftb_bulgaria_factions.70.a: "他們不過是罪有應得。"
 bftb_bulgaria_factions.71.t: "農民聯盟鎮壓行動"
 bftb_bulgaria_factions.71.desc: "我國安防部隊日前對國家農民聯盟發動了一場大規模的鎮壓行動，警方在保加利亞全國多個地點同時攻入了農民聯盟的集會場所，成功阻截了其成員陰謀蠱惑農村人口發起騷亂的企圖。警方發言人宣稱，此次行動可謂大獲全勝。"
 bftb_bulgaria_factions.71.a: "真是好消息！"
 bftb_bulgaria_factions.72.t: "農民聯盟鎮壓行動"
 bftb_bulgaria_factions.72.desc: "我們試圖鎮壓國家農民聯盟的行動不幸失敗。行動中警方攻入了據報是農民聯盟領導層用於蠱惑農民反對政府的秘密集會地點，然而事實卻是，這只是一場關於亞歷山大·斯坦博利斯基的著作《政黨或權力的組成》的宣講會，造成警方的闖入直接出盡了洋相。\n自不用說，這次警方的失敗行動招致了保加利亞民眾乃至農民聯盟的不少白眼……"
 bftb_bulgaria_factions.72.a: "真是尷尬……"
 bftb_bulgaria_factions.73.t: "農民聯盟領導層抓捕行動"
 bftb_bulgaria_factions.73.desc: "抓捕國家農民聯盟領導層的行動大獲成功。警方拘捕了包括尼古拉·佩特科夫在內的大部分與該組織有關聯的重要人物，這顯然對該組織造成了重大的打擊。"
 bftb_bulgaria_factions.73.a: "他們沒法繼續惹麻煩了！"
 bftb_bulgaria_factions.74.t: "農民聯盟領導層抓捕行動"
 bftb_bulgaria_factions.74.desc: "抓捕國家農民聯盟領導層的行動並不如預想中的那般順利。儘管警方逮捕了該組織的一些重要成員，但其領導人尼古拉·佩特科夫卻設法逃離。如此一來，即便此君目前被迫轉入地下，他也依舊繼續領導著整個農民聯盟。"
 bftb_bulgaria_factions.74.a: "真是令人失望的結果……"
 bftb_bulgaria_factions.75.t: "農民聯盟領導層抓捕行動"
 bftb_bulgaria_factions.75.desc: "抓捕國家農民聯盟領導層的行動徹底失敗。當警方攻入對方秘密集會的場所時，佔據極大人數優勢的特工們竟然未能及時制服集會人員，導致後者迅速逃離事發地，並在隨後與警方在街道上爆發了正面暴力衝突，造成諸多無辜平民受傷。鑑於如此由警方引起的暴力事件，當地許多居民不禁開始同情起農民聯盟，他們不僅開始幫助該組織成員逃離追捕，甚至還直接加入其對抗國家機關的隊列當中。"
 bftb_bulgaria_factions.75.a: "必須有人為此次失敗負責！"
 bftb_bulgaria_factions.80.t: "國家社會主義運動鎮壓行動"
 bftb_bulgaria_factions.80.desc: "我們已經成功對國家社會主義運動實施了鎮壓，對其那些據報公開發表反對某些特定組織，甚至是反對[ROOT.GetLeader]本人言論的組織成員實施了逮捕。"
 bftb_bulgaria_factions.80.a: "他們不過是罪有應得。"
 bftb_bulgaria_factions.81.t: "國家社會主義運動鎮壓行動"
 bftb_bulgaria_factions.81.desc: "我國安防部隊日前對國家社會主義運動發動了一場大規模的鎮壓行動，行動中警方攻入了一場該組織的大型集會，而當時該組織幾名主事的領導層正在發表針對[ROOT.GetLeader]的仇恨演說並謀劃著其下一場抗議政府的示威遊行。鑑於大部分激進分子已被逮捕，官方宣佈此次行動可謂大獲全勝。"
 bftb_bulgaria_factions.81.a: "真是好消息！"
 bftb_bulgaria_factions.82.t: "國家社會主義運動鎮壓行動"
 bftb_bulgaria_factions.82.desc: "我們試圖鎮壓國家社會主義運動的行動不幸失敗。行動中警方攻入了該組織的總部，只因他們確信這裡有旨在謀劃下一場法西斯主義示威遊行的秘密集會，然而事實卻是，這不過是一場由亞歷山大·燦科夫本人組織的關於現代經濟政策的會議，造成警方的闖入直接出盡了洋相。\n自不用說，這次警方的失敗行動招致了保加利亞民眾乃至國家社會主義運動的不少白眼……"
 bftb_bulgaria_factions.82.a: "真是尷尬……"
 bftb_bulgaria_factions.83.t: "國家社會主義運動領導層抓捕行動"
 bftb_bulgaria_factions.83.desc: "抓捕國家社會主義運動領導層的行動大獲成功。警方拘捕了包括亞歷山大·燦科夫在內的大部分與該組織有關聯的重要人物，這顯然對該組織造成了重大的打擊。"
 bftb_bulgaria_factions.83.a: "他們沒法繼續惹麻煩了！"
 bftb_bulgaria_factions.84.t: "國家社會主義運動領導層抓捕行動"
 bftb_bulgaria_factions.84.desc: "抓捕國家社會主義運動領導層的行動並不如預想中的那般順利。儘管警方逮捕了該組織的一些重要成員，但其領導人亞歷山大·燦科夫卻設法逃離。如此一來，即便此君目前被迫轉入地下，他也依舊繼續領導著整個國家社會主義運動。"
 bftb_bulgaria_factions.84.a: "真是令人失望的結果……"
 bftb_bulgaria_factions.85.t: "國家社會主義運動領導層抓捕行動"
 bftb_bulgaria_factions.85.desc: "抓捕國家社會主義運動領導層的行動徹底失敗。當警方攻入對方秘密集會的場所時，佔據極大人數優勢的特工們竟然未能及時制服集會人員，導致後者迅速逃離事發地，並在隨後與警方在街道上爆發了正面暴力衝突，造成諸多無辜平民受傷。鑑於如此由警方引起的暴力事件，當地許多居民不禁開始同情起國家社會主義運動，他們不僅開始幫助該組織成員逃離追捕，甚至還直接加入其對抗國家機關的隊列當中。"
 bftb_bulgaria_factions.85.a: "必須有人為此次失敗負責！"
 BUL_repress_imro_flag: "已鎮壓馬其頓內部革命組織"
 bftb_bulgaria_imro.1.t: "馬其頓內部革命組織再起！"
 bftb_bulgaria_imro.1.desc: "根據可靠的消息來源顯示，馬其頓內部革命組織的成員日前已經在保加利亞產槍炮的武裝下越過了國境線，並開始在馬其頓地區組織反對[ROOT.GetAdjective]的運動。"
 bftb_bulgaria_imro.1.a: "重回30年代早期……"
 bftb_bulgaria_imro.2.t: "馬其頓泛起親保加利亞思潮"
 bftb_bulgaria_imro.2.desc: "馬其頓內部革命組織的活躍分子以及其他親保加利亞的馬其頓人近來在馬其頓人群體當中不斷傳播著親保加利亞的思潮。\n如此一來，新一輪反對[ROOT.GetAdjective]政府的不穩定浪潮勢將席捲該地區。"
 bftb_bulgaria_imro.2.a: "是時候再次處理馬其頓內部革命組織了……"
 bftb_bulgaria_fatherland_front.1.t: "祖國陣線"
 bftb_bulgaria_fatherland_front.1.desc_positive: "我們終於可以摘取在付出巨大努力後才得來的碩果，眼下，在政治理念和意識形態上截然不同的各團體都將團結到同一條戰線上，以此共同反對保加利亞的親德軍國主義獨裁。\n我們如今組建的祖國陣線不僅整合了共產黨的勢力，同樣還有此前的環節集團、社會民主工黨-廣泛派、農民聯盟以及其他各組織的成員，所有人都聯合起來，以反對支配這個國家、為聚斂財富甚至不惜再次毀掉這個國家的資產階級。"
 bftb_bulgaria_fatherland_front.1.desc_negative: "共產黨以及其他政治組織的成員們已經聯合起來組建了祖國陣線，這個危險的政治反對勢力正在無產階級群體當中肆虐開來，並且很有可能在不久的將來構成足以顛覆政府的威脅。"
 bftb_bulgaria_fatherland_front.1.a: "團結將使得我們變得更強大！"
 bftb_bulgaria_fatherland_front.1.b: "又一個註定失敗的共黨小把戲。"
 bftb_bulgaria_fatherland_front.2.t: "祖國陣線發動突襲！"
 bftb_bulgaria_fatherland_front.2.desc: "根據其預謀的計劃，各地的祖國陣線組織以及全副武裝的游擊隊今天在全國各地奪取了地方政府以及各行政機關的控制權。\n從布爾加斯到瓦爾納，叛亂者們在整個黑海沿岸均沒有遭到有效的抵抗[GetBsFfSupport][GetBznsFfSupport][GetZvenoFfSupport][GetPartisanFfSupport]。"
 bftb_bulgaria_fatherland_front.2.desc_no_support: ""
 bftb_bulgaria_fatherland_front.2.desc_has_bs_support: "，在普羅夫迪夫，工人群體傾巢而出響應暴動，在幾個小時的街頭血戰後奪取了整個地區的控制權"
 bftb_bulgaria_fatherland_front.2.desc_has_bzns_support: "。\n根據報道，在農民群體決定性的支援響應下，默西亞地區的政變也取得了成功"
 bftb_bulgaria_fatherland_front.2.desc_has_zveno_support: "。\n而在索菲亞，此前隸屬於環節集團的軍官們已經奪取了通訊設施，並且正向國民議會挺進，勒令措手不及的勤王派軍隊拱手投降"
 bftb_bulgaria_fatherland_front.2.desc_has_partisan_support: "。\n而最後更重要的是，來自[GetPartisanFfSupportNationalities]的游擊隊群體也加入了祖國陣線的政變當中，並且試圖爭奪佔領區的控制權"
 bftb_bulgaria_fatherland_front.2.desc_partisans_gre: "希臘"
 bftb_bulgaria_fatherland_front.2.desc_partisans_yug: "南斯拉夫"
 bftb_bulgaria_fatherland_front.2.desc_partisans_both: "希臘和南斯拉夫"
 bftb_bulgaria_fatherland_front.2.a: "那讓內戰開始吧！"
 BUL_zveno_dissidents_tt: "如果我們不能儘快解決[GetZvenoName]派系，那麼該組織或許將在未來挑起軍事政變。"
 BUL_exposed_zveno_conspirator_tt: "這將延緩[GetZvenoName]派系的政變企圖。"
 BUL_bs_strikes_no_violence_tt: "一部分工廠將在此過程中受損。\n高度的§Y共產主義派系§!支持度和高度的[GetBsName]支持率將會惡化當前情況。"
 bftb_bulgaria_rearmament.1.t: "[BUL.GetAdjective]軍備重整談判"
 bftb_bulgaria_rearmament.1.desc: "[BUL.GetAdjective]政府日前已經公開宣佈[BUL.GetNameDef]將在巴爾幹地區奉行和平政策，並且以此呼籲我國就解除其自上次大戰失敗後所承受的嚴厲軍備限制進行談判。\n保加利亞人宣稱，若要使[BUL.GetAdjective]人民足以捍衛自身的國家主權及民族自決，則必須要立即准予其重整軍備，並組建一支現代化的軍事力量。"
 bftb_bulgaria_rearmament.1.a: "他們不過是在泛泛而談。"
 bftb_bulgaria_rearmament.1.b: "我們應該通過正式條約以維護和平。"
 bftb_bulgaria_rearmament.1.c: "我們必須終結對其的限制！"
 bftb_bulgaria_rearmament.1_refuse_tt: "[BUL.GetNameDefCap]還暫時不能開始重整軍備。"
 bftb_bulgaria_rearmament.1_nap_tt: "只要[BUL.GetNameDefCap]與[GRE.GetFlag][GRE.GetNameDefCap]、[YUG.GetFlag][YUG.GetNameDefCap]、[ROM.GetFlag][ROM.GetNameDefCap]或[TUR.GetFlag][TUR.GetNameDefCap]其中的任意一個國家締結互不侵犯條約，就可以開始重整軍備。"
 bftb_bulgaria_rearmament.2.t: "[ENG.GetNameDefCap]反對[ROOT.GetAdjective]軍備重整"
 bftb_bulgaria_rearmament.2.desc: "[ENG.GetAdjective]政府已經拒絕與我國就解除軍備限制進行任何談判的提議，看起來無論是對於當前歐洲的緊張局勢，還是[ROOT.GetNameDef]將在新興強權於未來打破巴爾幹地區脆弱平衡時被迫向其屈服的前景，英國人都無動於衷。"
 bftb_bulgaria_rearmament.2.a: "我們必須找到其他說服方法……"
 bftb_bulgaria_rearmament.3.t: "[ENG.GetAdjective]對[ROOT.GetNameDef]軍備重整提出要求"
 bftb_bulgaria_rearmament.3.desc: "在解除我國的任何軍備限制前，[ENG.GetAdjective]政府要求[ROOT.GetNameDef]必須和周邊任意鄰國簽署正式的和解協議，以作為巴爾幹地區構建最終和平友好外交關係的開端。"
 bftb_bulgaria_rearmament.3.a: "又一個需要克服的障礙……"
 BUL_uk_demands_nap_with_balkan_nation_tt: "在與[GRE.GetFlag][GRE.GetNameDefCap]、[YUG.GetFlag][YUG.GetNameDefCap]、[ROM.GetFlag][ROM.GetNameDefCap]或[TUR.GetFlag][TUR.GetNameDefCap]之中任意國家簽署§Y互不侵犯條約§!後，§Y軍備限制§!民族精神將被移除。"
 bftb_bulgaria_rearmament.4.t: "軍備限制解除"
 bftb_bulgaria_rearmament.4.desc: "在滿足[ENG.GetAdjective]的要求並與[GetNapTarget]簽署互不侵犯條約後，[ENG.GetNameDef]最終同意解除對我國的軍備限制，[ROOT.GetAdjective]軍備的重整工作終於可以開始了。"
 bftb_bulgaria_rearmament.4.a: "讓我們趕緊開始吧！"
 BUL_nap_with_greece: "[GRE.GetNameDefCap]"
 BUL_nap_with_yugoslavia: "[YUG.GetNameDefCap]"
 BUL_nap_with_romania: "[ROM.GetNameDefCap]"
 BUL_nap_with_turkey: "[TUR.GetNameDefCap]"
 bftb_bulgaria_rearmament.5.t: "[BUL.GetAdjective]解除軍備限制"
 bftb_bulgaria_rearmament.5.desc: "在滿足[ROOT.GetAdjective]的要求並與[GetNapTarget]簽署互不侵犯條約後，[BUL.GetAdjective]外交使團已經抵達倫敦，並準備就允許[BUL.GetNameDef]軍備重整一事，簽署正式的官方條約。"
 bftb_bulgaria_rearmament.5.a: "讓我們立即加以落實。"
 bftb_bulgaria_rearmament.6.t: "[ENG.GetNameDefCap]解除我國軍備限制"
 bftb_bulgaria_rearmament.6.desc: "在和[ENG.GetNameDef]外交使團於索菲亞進行艱苦的談判後，我們最終簽署了[ENG.GetAdjective]同意解除我國軍備限制的條約，[ROOT.GetNameDef]的軍備重整終於可以開始了。"
 bftb_bulgaria_rearmament.6.a: "時不我待，立即開始重整軍備！"
 bftb_bulgaria_rearmament.7.t: "[BUL.GetNameDefCap]就解除軍備限制施壓"
 bftb_bulgaria_rearmament.7.desc: "[BUL.GetAdjective]外交使團日前抵達倫敦，就解除[BUL.GetNameDef]軍備限制一事向[ROOT.GetAdjective]政府發出了施壓。\n隨著戰爭的陰雲再次籠罩在巴爾幹地區，他們保證無論如何，[BUL.GetNameDef]都將很快開始著手保衛其領土完整。"
 bftb_bulgaria_rearmament.7.a: "我們可不會對此恐嚇屈服！"
 bftb_bulgaria_rearmament.7.b: "別無他法……那就解除其限制吧！"
 bftb_bulgaria_rearmament.8.t: "[ENG.GetNameDefCap]無視我國施壓"
 bftb_bulgaria_rearmament.8.desc: "受命前往倫敦向[ENG.GetAdjective]政府施壓以期能夠解除我國軍備限制的[ROOT.GetAdjective]使團已經回國，但他們帶回了令人沮喪的消息：[ENG.GetNameDef]拒絕對我國的要求作出讓步，繼續禁止[ROOT.GetNameDef]展開任何軍備重整。"
 bftb_bulgaria_rearmament.8.a: "是他們讓我們別無選擇的……"
 bftb_bulgaria_rearmament.9.t: "[BUL.GetNameDefCap]不再服從軍備限制"
 bftb_bulgaria_rearmament.9.desc: "受[BUL.GetLeader]親自指派的[BUL.GetAdjective]外交官已經抵達我國，並轉達了其通告[GetReasonForNotAbiding]。"
 bftb_bulgaria_rearmament.9.a: "我們稍後再處理他們……"
 bftb_bulgaria_rearmament.9.b: "他們必須為此付出代價！"
 bftb_bulgaria_rearmament.9.desc_reason_war: "，由於其國家已經被捲入軍事衝突當中，[BUL.GetNameDef]將會立刻開始軍備重整以維護自身的國家獨立和人民自由"
 bftb_bulgaria_rearmament.9.desc_reason_faction: " ，由於其國家已得到了[BUL.GetFactionName]的支持，[BUL.GetNameDef]將不再服從對其軍備所施加的限制"
 bftb_bulgaria_nationalization.1.t: "[FROM.GetNameDefCap]奪取我國在其境內的附屬公司"
 bftb_bulgaria_nationalization.1.desc: "在其[GetTsarLoyalistOrPartyName]的支持下，領導[BUL.GetNameDef]的[GetLeaderNameIfRegencyCouncil]日前已通過新近立法對保加利亞的所有外國附屬公司實施國有化，自此之後它們都將歸於[BUL.GetAdjective]國家所有。\n這種對於[ROOT.GetAdjective]在[BUL.GetNameDef]利益的公然侵犯使得上層統治階級遭到了巨大的打擊，特別是那些在[BUL.GetNameDef]投入巨資建設當地基礎設施或經營分公司，最後卻慘遭徵用的工業巨頭們所遭受的損失尤為慘重。"
 bftb_bulgaria_nationalization.1.desc_tsar_loyalists: "勤王黨閣僚"
 bftb_bulgaria_nationalization.1.desc_party_name: "[BUL.GetRulingPartyLong]閣僚"
 bftb_bulgaria_nationalization.1.desc_regency_council: "波格丹·菲洛夫和[BUL.GetLeader]"
 bftb_bulgaria_nationalization.1.desc_regular_leader: "[BUL.GetLeader]"
 bftb_bulgaria_nationalization.1.a: "目前我們對此無能為力……"
 bftb_bulgaria_nationalization.1.b: "貿易禁運將教會他們何謂尊重！"
 bftb_bulgaria_nationalization.1.c: "我們將就此派出外交使團……由坦克開路！"
 bftb_bulgaria_nationalization.1.d: "別管這些忘恩負義的叛徒了！"
 bftb_bulgaria_nationalization.2.t: "[FROM.GetAdjective]對保加利亞實施貿易禁運"
 bftb_bulgaria_nationalization.2.desc: "作為對[ROOT.GetAdjective]國有化本國境內外資分公司及資產行為的回應，[FROM.GetNameDef]已經決定對我國實施禁運[GetEmbargoAllies]。\n儘管有人認為當前局勢或許會演變至更糟糕的情況，但事實是僅有某些特定的行業，主要是進出口相關的行業因禁運受到了很大的衝擊。"
 bftb_bulgaria_nationalization.2.desc_no_allies: ""
 bftb_bulgaria_nationalization.2.desc_allies: "，此項禁運也得到了其盟國的支持"
 bftb_bulgaria_nationalization.2.a: "真是離譜……"
 bftb_bulgaria_nationalization.3.t: "[FROM.GetNameDefCap]將我國逐出[FROM.GetFactionName]"
 bftb_bulgaria_nationalization.3.desc: "迫於國內投資者及產業巨頭的壓力，[FROM.GetAdjective]政府日前對[BUL.GetAdjective]國有化其國內外國資產的行為實施了制裁，[FROM.GetNameDef]不僅對[BUL.GetNameDef]實施了禁運，同時也將其從[FROM.GetFactionName]陣營當中逐出。\n[GetEmbargoAndKickAllies]禁運不僅將對我國部分產業造成嚴重打擊，更糟糕的是，我[BUL.GetNameDef]如今儼然已被諸鄰國窺伺，其無疑將會趁人之危於未來落井下石。"
 bftb_bulgaria_nationalization.3.desc_no_allies: ""
 bftb_bulgaria_nationalization.3.desc_allies: "[FROM.GetNameDef]及其盟友的"
 bftb_bulgaria_nationalization.3.a: "我們早該料到這一齣！"
 bftb_bulgaria_uranium_mining_concessions.1.t: "[FROM.GetNameDefCap]鈾礦開採授權"
 bftb_bulgaria_uranium_mining_concessions.1.desc: "我們與[FROM.GetAdjective]盟友的良好關係終於收穫了回報：[FROM.GetAdjective]政府日前已經授予我國對其治下布霍沃附近鈾礦的開採權。他們聲稱鑑於其本國的科技水平還遠無法有效開發利用這些礦藏，所以他們更傾向於通過簽約授權我方利用布霍沃鈾礦的方式，來為保加利亞的工農業生產換取基本的原料。\n如此值得讚許的協定不僅能為我們開拓新的鈾原料來源，同時也無疑將進一步深化[GER.GetNameDef]和[BUL.GetNameDef]兩國間的雙邊關係。"
 bftb_bulgaria_uranium_mining_concessions.1.a: "我們得好好利用它。"
 bftb_bulgarian_claims.1.t: "保加利亞要求確保其巴爾幹領土宣稱"
 bftb_bulgarian_claims.1.desc: "來自[BUL.GetNameDef]的外交使團日前與我國政府展開了會談，請求[ROOT.GetAdjective]對其在巴爾幹地區的領土主張進行支持，他們同時也希望通過私下協商的方式，對[BUL.GetAdjective]在不久的將來在該地區的擴張作出議定，作為回報，[BUL.GetAdjective]將與[ROOT.GetNameDef]結盟，並且其國家亦將加入[ROOT.GetFactionName]。"
 bftb_bulgarian_claims.1.a: "認可保加利亞的主張。"
 bftb_bulgarian_claims.1.b: "我們自會對其安排可行的領土擴張！"
 bftb_bulgarian_claims.1.a_tt: "如果控制具備§Y預定保加利亞擴張領土§!修正地區的國家與[BUL.GetNameDef]同處於[ROOT.GetFactionName]當中，則此地將會被立刻移交予[BUL.GetNameDef]。"
 bftb_bulgarian_claims.2.t: "[GER.GetNameDefCap]認可我國宣稱"
 bftb_bulgarian_claims.2.desc: "派往[FROM.Capital.GetName]商議我國巴爾幹領土擴張問題的[ROOT.GetAdjective]使團日前已經返回[ROOT.Capital.GetName]，向我們傳達了本次出訪大獲成功的消息。他們與[FROM.GetAdjective]人簽署了秘密的協定，同意一旦我國正式加入[FROM.GetFactionName]，[FROM.GetNameDef]便將正式承認我國的領土主張並同意[ROOT.GetNameDef]以和平衛士的身份於奪佔的巴爾幹地區實施統治。"
 bftb_bulgarian_claims.2.a: "簡直是再好不過的交易！"
 bftb_bulgarian_claims.3.t: "[GER.GetNameDefCap]否決我國宣稱"
 bftb_bulgarian_claims.3.desc: "派往[FROM.Capital.GetName]就[FROM.GetAdjective]能否承認我國巴爾幹領土宣稱問題展開協商的[ROOT.GetAdjective]使團日前已經返回[ROOT.Capital.GetName]，向我們告知其外交使命不幸失敗，本次出訪未能和[FROM.GetNameDef]就落實[ROOT.GetAdjective]在巴爾幹實現領土擴張達成協議。"
 bftb_bulgarian_claims.3.a: "那我們將被迫公然發起擴張……"
 bftb_bulgarian_claims.4.t: "[GER.GetNameDefCap]授予保加利亞領土管轄"
 bftb_bulgarian_claims.4.desc: "正如此前所約定的那樣，[GER.GetNameDef]已下令將近期被[GER.GetFactionName]佔領而又為[ROOT.GetNameDef]宣稱的領土進行移交，上述地區此後將歸屬[ROOT.GetAdjective]政府所管轄。"
 bftb_bulgarian_claims.4.a: "我們正奪回自己的法理所有物！"
 bftb_bulgarian_claims.5.t: "保加利亞領土移交案"
 bftb_bulgarian_claims.5.desc: "正如此前所約定的那樣，我國已下令將近期被[GER.GetFactionName]佔領而又為[ROOT.GetNameDef]宣稱的領土進行移交，上述地區此後將歸屬[ROOT.GetAdjective]政府所管轄。"
 bftb_bulgarian_claims.5.a: "這是我們彼此交易的一部分。"
 bftb_bulgarian_claims.6.t: "[GER.GetNameDefCap]指示向保加利亞移交領土"
 bftb_bulgarian_claims.6.desc: "根據[GER.GetAdjective]和[BUL.GetAdjective]兩國政府的協定，[GER.GetNameDef]已下令將近期我方佔據但卻為[BUL.GetNameDef]所宣稱的領土進行移交，上述地區此後將歸屬[BUL.GetAdjective]政府所管轄。"
 bftb_bulgarian_claims.6.a: "看看這些保加利亞暴發戶！"
 bftb_bulgarian_claims.6.b: "他們沒有這個權利！"
 bftb_bulgarian_claims.7.t: "[FROM.GetNameDefCap]索取[FROM.FROM.GetName]控制權"
 bftb_bulgarian_claims.7.desc: "自詡為巴爾幹控制區和平衛士的[FROM.GetAdjective]人日前向我方發出提議，稱我們可以授權其管轄[FROM.FROM.GetName]以確保[ROOT.GetFactionName]在此地穩定和秩序，如此也可以解放[ROOT.GetAdjective]當地的駐軍，以便我國部隊可以投身於其他戰線。"
 bftb_bulgarian_claims.7.a: "同意，我軍尚且還需轉戰他處！"
 bftb_bulgarian_claims.7.b: "保加利亞的領土貪慾真是無窮無盡！"
 bftb_bulgarian_claims.8.t: "[FROM.GetNameDefCap]移交[FROM.FROM.FROM.GetName]控制權"
 bftb_bulgarian_claims.8.desc: "[FROM.GetAdjective]政府已經同意將[FROM.FROM.FROM.GetName]的管治權轉交給[ROOT.GetNameDef]。我方現在已可化身和平衛士降臨當地了，派遣駐防部隊不僅是出於維持當地穩定與秩序的舉動，同時也是保衛其不受任何敵人所侵犯的應有之義。"
 bftb_bulgarian_claims.8.a: "為保加利亞開疆拓土！"
 bftb_bulgarian_claims.9.t: "[FROM.GetNameDefCap]拒絕向[ROOT.GetAdjective]移交[FROM.FROM.FROM.GetName]控制權"
 bftb_bulgarian_claims.9.desc: "[FROM.GetAdjective]政府對向[ROOT.GetNameDef]移交[FROM.FROM.FROM.GetName]管治權一事表示了拒絕。他們聲稱我國提出此議案的真實動機不過是為了擴大[ROOT.GetAdjective]的佔領區，以此來妄圖在戰爭勝利後分得更多版圖，[FROM.GetLeader]本人甚至公然宣稱，我國對領土的野望已經有些惹怒到他了。"
 bftb_bulgarian_claims.9.a: "或許下次一定……"
 BUL_germany_recognizes_our_claim_tt: "[GER.GetNameDefCap]認可我國對此地區的宣稱。"
 bftb_bulgaria_german_influence.1.t: "[GER.GetNameDefCap]援贈飛機"
 bftb_bulgaria_german_influence.1.desc: "[GetFirstDonation]我國和[GER.GetNameDef]的雙邊關係，赫爾曼·戈林日前向我國援贈了12架[GER.GetAdjective]戰鬥機，此君的慷慨善舉顯然是想拉攏[ROOT.GetNameDef]加入[GER.GetFactionName]，以此為其國家在巴爾幹地區贏得一個強大且能捍衛[GER.GetAdjective]在本地區利益的盟友。"
 bftb_bulgaria_german_influence.1.desc_first_donation: "為了重建[ROOT.GetAdjective]的空軍力量並且深化"
 bftb_bulgaria_german_influence.1.desc_more_donations: "為了進一步深化"
 bftb_bulgaria_german_influence.1.a: "我們將欣然接受！"
 bftb_bulgaria_german_influence.1.b: "我們將禮貌婉拒。"
 bftb_bulgaria_german_influence.2.t: "[BUL.GetNameDefCap]接受我國援贈"
 bftb_bulgaria_german_influence.2.desc: "[BUL.GetAdjective]的最高統帥部欣然接受了我方的提案，而[BUL.GetLeader]本人也對我國援贈飛機的善舉表示了感謝，稱[ROOT.GetNameDef]和[BUL.GetNameDef]兩國的關係必將日益緊密，進而實現互惠互利、共同繁榮。"
 bftb_bulgaria_german_influence.2.a: "非常好！"
 bftb_bulgaria_german_influence.3.t: "[BUL.GetNameDefCap]婉拒我國援贈"
 bftb_bulgaria_german_influence.3.desc: "[BUL.GetAdjective]的最高統帥部日前婉拒了我方援贈[ROOT.GetAdjective]飛機以強化[BUL.GetAdjective]空軍力量的提案，保方指出若是接受援贈則意味著[BUL.GetNameDef]將要對[ROOT.GetAdjective]奉行親善政策，而對於決心自食其力重建本國空軍的[BUL.GetAdjective]人來說，此事目前並不符合其利益。"
 bftb_bulgaria_german_influence.3.a: "他們是哪裡有毛病嗎？"
 bftb_bulgaria_german_influence.4.t: "[GER.GetLeader]要求我國撤換喬塞瓦諾夫"
 bftb_bulgaria_german_influence.4.desc: "今天，我們收到了一封來自[GER.GetLeader]本人的信函，信中稱[ROOT.GetAdjective]首相格奧爾基·喬塞瓦諾夫失職無能，已令[GER.GetAdjective]人民大失所望，鑑於此其應當被勒令辭職，並將如此重要的職位委任予其他賢達。\n[GER.GetAdjective]人建議我們委任波格丹·菲洛夫來替代喬塞瓦諾夫，鑑於此人是一位政治資歷尚淺的親德派，這也意味著他顯然不會忤逆[GetLeaderToChallenge]的旨意。"
 bftb_bulgaria_german_influence.4.desc_tsar: "沙皇"
 bftb_bulgaria_german_influence.4.desc_regency_council: "[ROOT.GetAdjective]攝政議會"
 bftb_bulgaria_german_influence.4.desc_no_tsar: "[BUL.GetLeader]"
 bftb_bulgaria_german_influence.4.a: "德國朋友是對的！"
 bftb_bulgaria_german_influence.4.b: "我們可不會聽任德國佬指手畫腳！"
 bftb_bulgaria_german_influence.5.t: "[BUL.GetLeader]同意撤換喬塞瓦諾夫"
 bftb_bulgaria_german_influence.5.desc: "鑑於[BUL.GetAdjective]前任首相格奧爾基·喬塞瓦諾夫著實無能到令[BUL.GetLeader]也對其失望透頂，因此，完全知曉此等無能所造成隱患的後者日前已經同意了我方的建議，委任波格丹·菲洛夫這樣更有才幹的人士接替了首相職務，此君作為政治資歷尚淺的親德派，定然不會忤逆[GetLeaderToChallenge]的旨意亦或是損害[ROOT.GetAdjective]的利益。"
 bftb_bulgaria_german_influence.5.a: "[BUL.GetLeader]證明了其足夠英明。"
 bftb_bulgaria_german_influence.6.t: "[BUL.GetLeader]拒絕撤換喬塞瓦諾夫"
 bftb_bulgaria_german_influence.6.desc: "[BUL.GetLeader]日前拒絕了有關撤換格奧爾基·喬塞瓦諾夫的提議，其聲稱[ROOT.GetAdjective]政府之所以想讓此君離職，不外乎就是想除掉對[BUL.GetNameDef]忠誠盡職的公僕，進而替換為對[ROOT.GetAdjective]俯首帖耳的傀儡，並利用後者為[GER.GetLeader]在[BUL.GetNameDef]的利益服務。"
 bftb_bulgaria_german_influence.6.a: "格奧爾基·喬塞瓦諾夫才是唯一的傀儡！"
 bftb_bulgaria_german_influence.7.t: "[GER.GetNameDefCap]要求軍事通行權"
 bftb_bulgaria_german_influence.7.desc: "來自[GER.GetNameDef]的外交官今天抵達了[ROOT.Capital.GetName]，呈請[ROOT.GetNameDef]授予[GER.GetAdjective]軍隊以軍事通行權。\n鑑於即將到來的巴爾幹戰事，[GER.GetAdjective]軍隊需要途經[ROOT.GetNameDef]領土以部署到我們鄰國的邊境上，無論如何，若是[GER.GetLeader]聽聞[ROOT.GetNameDef]妨礙[GER.GetAdjective]的戰爭計劃，他想必不會有什麼好臉色……"
 bftb_bulgaria_german_influence.7.a: "我們十分樂意與德國軍隊合作。"
 bftb_bulgaria_german_influence.7.b: "[GER.GetLeader]怕是得另尋他路了。"
 bftb_bulgaria_german_influence.8.t: "[BUL.GetNameDefCap]授予我方軍事通行權"
 bftb_bulgaria_german_influence.8.desc: "派往[BUL.Capital.GetName]商談我軍借用[BUL.GetAdjective]領土作為行動基地事宜的外交官向我們發回報告，稱談判已獲成功。[BUL.GetLeader]已簽署協議，以此授權[ROOT.GetAdjective]軍隊在[BUL.GetNameDef]全國通行的順暢無阻。"
 bftb_bulgaria_german_influence.8.a: "一切正按照計劃進行中。"
 bftb_bulgaria_german_influence.9.t: "[BUL.GetNameDefCap]拒絕我方軍事通行請求"
 bftb_bulgaria_german_influence.9.desc: "派往[BUL.Capital.GetName]商談我軍借用[BUL.GetAdjective]領土作為行動基地事宜的外交官向我們發回報告，稱[BUL.GetLeader]拒絕授權[ROOT.GetAdjective]軍隊在其境內的通行，如此勢必極大地妨礙我國近期將在巴爾幹發起的軍事行動。據稱[BUL.GetLeader]認為若是對我方要求通通無條件允諾，則會使[BUL.GetNameDef]淪為另一個[ROOT.GetAdjective]衛星國，如此將只會妨礙其國家理所當然地成為獨立的巴爾幹地區強權的大業。"
 bftb_bulgaria_german_influence.9.a: "[BUL.GetLeader]這是在玩火……"
 bftb_bulgaria_italian_influence.1.t: "[BUL.GetAdjective]遞交科研協議"
 bftb_bulgaria_italian_influence.1.desc: "來自[BUL.GetAdjective]的代表團日前已抵達我國首都，他們請求與[ITA.GetAdjective]外長展開會談，並希望能夠在我等兩國間達成協議。\n在[BUL.GetAdjective]外交官們所提出協定的諸多條款當中，有關兩國軍事科技研究領域的合作計劃，以及在[BUL.GetNameDef]為[ITA.GetAdjective]投資者提供特惠經濟新規的條文尤其令人矚目。"
 bftb_bulgaria_italian_influence.1.a: "這對於[ITA.GetNameDef]來說是有利的協議。"
 bftb_bulgaria_italian_influence.1.b: "我們可不會與[BUL.GetAdjective]人分享科研的進步！"
 bftb_bulgaria_equipment_purchases.1.t: "[FROM.FROM.GetAdjective]火炮訂購案"
 bftb_bulgaria_equipment_purchases.1.desc: "為了實現對[FROM.FROM.GetAdjective]火炮的訂購，我們必須首先決定購買其哪種類型的火炮。"
 bftb_bulgaria_equipment_purchases.1.a: "訂購普通火炮。"
 bftb_bulgaria_equipment_purchases.1.a_tt: "我們將購買§Y[?BUL_quantity_purchased_artillery]§!門§Y牽引式火炮§!"
 bftb_bulgaria_equipment_purchases.1.b: "訂購防空炮。"
 bftb_bulgaria_equipment_purchases.1.b_tt: "我們將購買§Y[?BUL_quantity_purchased_artillery]§!門§Y牽引式防空炮§!"
 bftb_bulgaria_equipment_purchases.1.c: "訂購反坦克炮。"
 bftb_bulgaria_equipment_purchases.1.c_tt: "我們將購買§Y[?BUL_quantity_purchased_artillery]§!門§Y牽引式反坦克炮§!"
 bftb_bulgaria_equipment_purchases.2.t: "[FROM.FROM.GetAdjective]軍用載具訂購案"
 bftb_bulgaria_equipment_purchases.2.desc: "為了實現對[FROM.FROM.GetAdjective]軍用載具的訂購，我們必須首先決定購買其哪種類型的載具。"
 bftb_bulgaria_equipment_purchases.2.a: "訂購摩托化載具。"
 bftb_bulgaria_equipment_purchases.2.a_tt: "我們將購買§Y[?BUL_quantity_purchased_motorized]§!輛§Y摩托化載具§!"
 bftb_bulgaria_equipment_purchases.2.b: "訂購機械化載具。"
 bftb_bulgaria_equipment_purchases.2.b_tt: "我們將購買§Y[?BUL_quantity_purchased_mechanized]§!輛§Y機械化載具§!"
 bftb_bulgaria_equipment_purchases.2.c: "訂購裝甲車。"
 bftb_bulgaria_equipment_purchases.2.c_tt: "我們將購買§Y[?BUL_quantity_purchased_armored_car]§!輛§Y裝甲車§!"
 bftb_bulgaria_equipment_purchases.3.t: "[FROM.FROM.GetAdjective]戰車訂購案"
 bftb_bulgaria_equipment_purchases.3.desc: "為了實現對[FROM.FROM.GetAdjective]坦克的訂購，我們必須首先決定購買其哪種類型的坦克。"
 bftb_bulgaria_equipment_purchases.3.a: "訂購輕型坦克。"
 bftb_bulgaria_equipment_purchases.3.a_tt: "我們將購買§Y[?BUL_quantity_purchased_light_armor]§!輛§Y輕型坦克§!"
 bftb_bulgaria_equipment_purchases.3.b: "訂購中型坦克。"
 bftb_bulgaria_equipment_purchases.3.b_tt: "我們將購買§Y[?BUL_quantity_purchased_medium_armor]§!輛§Y中型坦克§!"
 bftb_bulgaria_equipment_purchases.3.c: "訂購重型坦克。"
 bftb_bulgaria_equipment_purchases.3.c_tt: "我們將購買§Y[?BUL_quantity_purchased_heavy_armor]§!輛§Y重型坦克§!"
 bftb_bulgaria_equipment_purchases.4.t: "[FROM.FROM.GetAdjective]飛機訂購案"
 bftb_bulgaria_equipment_purchases.4.desc: "為了實現對[FROM.FROM.GetAdjective]飛機的訂購，我們必須首先決定購買其哪種類型的飛機。"
 bftb_bulgaria_equipment_purchases.4.a: "訂購戰鬥機。"
 bftb_bulgaria_equipment_purchases.4.a_tt: "我們將購買§Y[?BUL_quantity_purchased_fighter]§!架§Y戰鬥機§!"
 bftb_bulgaria_equipment_purchases.4.b: "訂購海軍轟炸機。"
 bftb_bulgaria_equipment_purchases.4.b_tt: "我們將購買§Y[?BUL_quantity_purchased_naval_bomber]§!架§Y海軍轟炸機§!"
 bftb_bulgaria_equipment_purchases.4.c: "訂購戰術轟炸機。"
 bftb_bulgaria_equipment_purchases.4.c_tt: "我們將購買§Y[?BUL_quantity_purchased_tactical_bomber]§!架§Y戰術轟炸機§!"
 bftb_bulgaria_equipment_purchases.5.t: "[BUL.GetNameDef]希望訂購[ROOT.GetAdjective]軍艦"
 bftb_bulgaria_equipment_purchases.5.a_tt: "我們將獲得§Y1§!座地圖外§Y民用工廠§!以作為替[BUL.GetAdjective]造艦期間的酬勞。"
 bftb_bulgaria_equipment_purchases.6.a_tt: "[FROM.GetNameDef]將為[ROOT.GetAdjective]海軍建造§Y3艘潛艇§!。"
 bftb_bulgaria_equipment_purchases.6.b_tt: "[FROM.GetNameDef]將為[ROOT.GetAdjective]海軍建造§Y2艘驅逐艦§!。"
 bftb_bulgaria_equipment_purchases.6.c_tt: "[FROM.GetNameDef]將為[ROOT.GetAdjective]海軍建造§Y1艘輕巡洋艦§!。"
 bftb_bulgaria_equipment_purchases.8.t: "造艦工程完畢-潛艇"
 bftb_bulgaria_equipment_purchases.8.desc: "在經過近一年的建造後，我國訂購的3艘[FROM.GetAdjective]潛艇日前已經完成了海試，現已做好準備加入海軍在役序列。\n這些軍艦正停泊在[Root.GetAdjective]港，而艦上人員亦正聽候調遣。"
 bftb_bulgaria_equipment_purchases.9.t: "造艦工程完畢-驅逐艦"
 bftb_bulgaria_equipment_purchases.9.desc: "在經過近一年的建造後，我國訂購的2艘[FROM.GetAdjective]驅逐艦日前已經完成了海試，現已做好準備加入海軍在役序列。\n這些軍艦正停泊在[Root.GetAdjective]港，而艦上人員亦正聽候調遣。"
 bftb_bulgaria_equipment_purchases.10.t: "造艦工程完畢-輕巡洋艦"
 bftb_bulgaria_equipment_purchases.10.desc: "在經過近一年的建造後，我國訂購的[FROM.GetAdjective]輕巡洋艦日前已經完成了海試，現已做好準備加入海軍在役序列。\n這些軍艦正停泊在[Root.GetAdjective]港，而艦上人員亦正聽候調遣。"
 bftb_bulgaria_scw_volunteers.1.t: "[ROOT.GetAdjective]志願兵自西班牙歸來"
 bftb_bulgaria_scw_volunteers.1.desc: "投身國際縱隊併為西班牙人民的自由而英勇奮戰的[ROOT.GetAdjective]志願兵們，如今已然返回了他們的祖國，[GetVictoryOrDefeatRepublicans]這些歷戰歸來的無畏[ROOT.GetAdjective]勇士隊伍當中，技術高超的軍方飛行員扎哈里·扎哈里耶夫赫然在列，他因戰時的諸多壯舉而廣受褒獎，並將被高度推薦晉升為保加利亞的空軍總長。" #FROM.FROM is SCW loser // #FROM is SCW winner
 bftb_bulgaria_scw_volunteers.1.desc_republicans_victorious: "縱使這場戰爭給西班牙人民造成了深重的苦難，但大家還是為[FROM.GetNameDef]在內戰中所取得的勝利而歡呼慶賀。而在"
 bftb_bulgaria_scw_volunteers.1.desc_republicans_defeated: "眾人皆為[FROM.GetNameDef]所遭受的慘痛失敗而深表哀悼，後者如今終究還是屈服於法西斯暴政的鐵蹄下……\n無論如何，在"
 bftb_bulgaria_scw_volunteers.1.a: "他們如英雄般凱旋！"
 bftb_bulgaria_scw_volunteers.1.b: "他們已竭盡所能捍衛了自由……"
 bftb_bulgaria_scw_volunteers.2.t: "保加利亞志願兵自西班牙歸來"
 bftb_bulgaria_scw_volunteers.2.desc: "那些英勇奔赴西班牙與那些布爾什維主義和安那其主義勢力作戰的[ROOT.GetAdjective]志願兵們，如今已然返回了他們的祖國，[GetVictoryOrDefeatNationalists]部隊不僅在此期間積累了寶貴的作戰經驗，而且我軍的一名指揮官也因其在戰時的諸多壯舉而廣受褒獎並獲得提拔。"
 bftb_bulgaria_scw_volunteers.1.desc_nationalists_victorious: "作為榮光的西班牙內戰勝利者，[FROM.GetLeader]本人也對眾人戰時的表現讚賞有加。\n我們的"
 bftb_bulgaria_scw_volunteers.1.desc_nationalists_defeated: "眾人皆為[FROM.GetNameDef]所遭受的慘痛失敗而倍感氣餒，後者如今已然徹底被赤色浪潮所吞噬……\n無論如何，我們的"
 bftb_bulgaria_scw_volunteers.2.a: "他們誠如戰場老兵般凱旋！"
 bftb_bulgaria_scw_volunteers.2.b: "西班牙不過是個試驗場……"
 bftb_bulgaria_soviet_influence.1.t: "[ROOT.GetAdjective]-[BUL.GetAdjective]互助條約"
 bftb_bulgaria_soviet_influence.1.desc: "[GetBulgarianLeaderToMeetStalin]今天在[ROOT.Capital.GetName]和[ROOT.GetLeader]進行了會晤，就[BUL.GetAdjective]所提議的簽署兩國間互助條約的議案展開了商議。基於這項條約，[BUL.GetAdjective]政府將會進一步尋求加強和[ROOT.GetNameDef]的聯繫，以在此動盪的年代捍衛自身領土完整，同時亦對其敵對的巴爾幹鄰國保持優勢。"
 bftb_bulgaria_soviet_influence.1.desc_leader: "[BUL.GetLeader]"
 bftb_bulgaria_soviet_influence.1.desc_diplomat: "[BUL.GetAdjective]外交官"
 bftb_bulgaria_soviet_influence.1.a: "簽訂此項條約將使兩國均能受益！"
 bftb_bulgaria_soviet_influence.1.b: "此項條約不符合我國最大利益。"
 bftb_bulgaria_soviet_influence.2.t: "[SOV.GetNameDefCap]簽署互助條約"
 bftb_bulgaria_soviet_influence.2.desc: "在結束和[SOV.GetLeader]就商討[SOV.GetNameDef]和[ROOT.GetNameDef]兩國簽署互助條約事宜的會談後，[GetBulgarianLeaderToMeetStalin]在今天返回了[ROOT.Capital.GetName]。在這場漫長的會談後，雙方最終敲定了簽署此條約所需的條件，並且也落實了兩國政府後續對於維護此關係所應做出的具體措施，兩國政要也旋即簽署了此條約。"
 bftb_bulgaria_soviet_influence.2.a: "這將是富有成效的關係開端！"
 bftb_bulgaria_soviet_influence.3.t: "[SOV.GetNameDefCap]拒絕簽署互助條約"
 bftb_bulgaria_soviet_influence.3.desc: "在結束和[SOV.GetLeader]就商討[SOV.GetNameDef]和[ROOT.GetNameDef]兩國簽署互助條約事宜的會談後，[GetBulgarianLeaderToMeetStalin]在今天返回了[ROOT.Capital.GetName]。然而，如此漫長的會談似乎仍舊無法說服[SOV.GetLeader]信服該條約有簽署的必要，最終導致[SOV.GetLeader.GetSheHe]斷然拒絕簽字。\n而在和[SOV.GetNameDef]的修約議案失敗後，[ROOT.GetLeader]似乎也已經開始考慮為[ROOT.GetNameDef]尋求其他潛在的盟友了。"
 bftb_bulgaria_soviet_influence.3.a: "是時候尋找新盟友了……"
 bftb_bulgaria_soviet_influence.4.t: "[BUL.GetLeader]敦促[ROOT.GetLeader]加入[BUL.GetFactionName]"
 bftb_bulgaria_soviet_influence.4.desc: "[BUL.GetAdjective]政府日前要求巴爾幹諸國聯合起來，共同發起對法西斯主義、帝國主義以及資本主義的革命，他們同時也敦促[ROOT.GetLeader]立刻加入到[BUL.GetFactionName]當中來，以此形成足以對抗歐洲強國的有力集團。"
 bftb_bulgaria_soviet_influence.4.a: "我們必須加入保加利亞及蘇維埃兄弟的行列。"
 bftb_bulgaria_soviet_influence.4.b: "我們絕不會屈服於保加利亞的施壓！"
 bftb_bulgaria_soviet_influence.5.t: "[FROM.GetNameDefCap]屈服於[ROOT.GetAdjective]施壓"
 bftb_bulgaria_soviet_influence.5.desc: "在和[FROM.GetAdjective]政府閣僚進行了數輪緊張會談以及激烈爭論後，[FROM.GetLeader]最終迫於我方壓力作出讓步，使[FROM.GetNameDef]加入到了[ROOT.GetFactionName]的陣營當中，我們對抗法西斯主義、帝國主義以及資本主義的集團得以進一步壯大。"
 bftb_bulgaria_soviet_influence.5.a: "他們做出了正確的選擇。"
 bftb_bulgaria_soviet_influence.6.t: "[FROM.GetNameDefCap]拒絕[ROOT.GetAdjective]要求"
 bftb_bulgaria_soviet_influence.6.desc: "儘管我方出於團結盟好、杜絕分裂的目的向[FROM.GetNameDef]派遣了外交官，但[FROM.GetLeader]還是拒絕與之展開會晤。鑑於[FROM.GetAdjective]政府已然拒絕我方關於入盟的提案，那麼[ROOT.GetNameDef]和[FROM.GetNameDef]之間的合作自然也是再無可能，如此，[ROOT.GetFactionName]成員國在面對此國時或將別無選擇。"
 bftb_bulgaria_soviet_influence.6.a: "這隻會是向[FROM.GetNameDef]帶去毀滅的決定……"
 bftb_bulgaria_yugoslavian_influence.1.t: "保加利亞“永恆友誼條約”提案"
 bftb_bulgaria_yugoslavian_influence.1.desc: "[GetBulgarianLeaderToMeetStalin]今天在[ROOT.Capital.GetName]和[ROOT.GetLeader]進行了會晤，就[BUL.GetAdjective]所提議的簽署兩國間永恆友誼條約的議案展開了商議。基於這項條約，[BUL.GetAdjective]政府將會放下舊日恩怨並且加強和[YUG.GetNameDef]的聯繫，以期最終能在兩國間締結同盟，在任一締約方陷入紛爭時相互予以協作或支持。"
 bftb_bulgaria_yugoslavian_influence.1.a: "簽訂此項條約將使兩國均能受益！"
 bftb_bulgaria_yugoslavian_influence.1.b: "此項條約不符合我國最大利益。"
 bftb_bulgaria_yugoslavian_influence.2.t: "[FROM.GetNameDefCap]簽署永恆友誼條約"
 bftb_bulgaria_yugoslavian_influence.2.desc: "在[YUG.Capital.GetName]結束和[YUG.GetLeader]就商討[YUG.GetNameDef]和[ROOT.GetNameDef]簽署永恆友誼條約事宜的會談後，[GetBulgarianLeaderToMeetStalin]在今天返回了[BUL.Capital.GetName]。此次會談的尾聲，兩國政要最終在條約上進行了簽字，但對於其中部分條款亦還要留待未來商榷，但兩國均希望維護並且增進這樣有益的雙邊關係。"
 bftb_bulgaria_yugoslavian_influence.2.a: "這將使兩國邁向強大！"
 bftb_bulgaria_yugoslavian_influence.3.t: "[FROM.GetNameDefCap]拒絕簽署永恆友誼條約"
 bftb_bulgaria_yugoslavian_influence.3.desc: "在[YUG.Capital.GetName]結束和[YUG.GetLeader]就商討[YUG.GetNameDef]和[ROOT.GetNameDef]簽署永恆友誼條約事宜的會談後，[GetBulgarianLeaderToMeetStalin]在今天返回了[BUL.Capital.GetName]。令人遺憾的是，[YUG.GetLeader]似乎對於和[ROOT.GetNameDef]交好的想法並不熱情，我方提案最終遭到拒絕。"
 bftb_bulgaria_yugoslavian_influence.3.a: "簡直是浪費時間……"
 bftb_bulgaria_balkan_federation.1.t: "巴爾幹聯邦計劃"
 bftb_bulgaria_balkan_federation.1.desc: "我們已經完成了組建巴爾幹社會主義共和國聯邦計劃的相關準備工作，現在該計劃將被呈交給巴爾幹諸國政府，而我們將從[YUG.GetNameDef]開始和他們展開談判並邀請諸國加入。\n組建此聯邦的主要目標是在[ROOT.GetNameDef]的領導下，將巴爾幹全域的人民團結在一個超國家聯盟體系當中加以合作，並以此做好準備迎擊那些試圖征服巴爾幹諸國的敵人。\n但[ROOT.GetLeader]的野望或許遠不止於此：在統一的巴爾幹聯邦旗幟下，各國公民將不再單純的是保加利亞人、希臘人、南斯拉夫人……而將是自由的巴爾幹公民。"
 bftb_bulgaria_balkan_federation.1.a: "值得奮鬥的夢想！"
 bftb_bulgaria_balkan_federation.2.t: "[BUL.GetAdjective]的巴爾幹聯邦計劃"
 bftb_bulgaria_balkan_federation.2.desc: "[BUL.GetAdjective]政府日前向我國呈現了其組建巴爾幹社會主義共和國聯邦的有關計劃，並承諾若成為首個加盟國，將給予[ROOT.GetNameDef]優待。\n其組建此聯邦的主要目標是在[BUL.GetNameDef]的領導下，將巴爾幹全域的人民團結在一個超國家聯盟體系當中加以合作，並以此做好準備迎擊那些試圖征服巴爾幹諸國的敵人。\n隸屬於社會主義和共產主義派別的媒體早已將此消息洩露，而支持巴爾幹聯邦及[ROOT.GetNameDef]加盟的論調亦開始在[ROOT.GetAdjective]民眾當中傳播開來。"
 bftb_bulgaria_balkan_federation.2.a: "真是野心勃勃的計劃……"
 bftb_bulgaria_balkan_federation.3.t: "巴爾幹聯邦宣傳運動"
 bftb_bulgaria_balkan_federation.3.desc: "保加利亞人日前在[ROOT.GetNameDef]發起了一場宣傳造勢運動，以試圖蠱惑[ROOT.GetAdjective]民眾信服其那套關於組建巴爾幹社會主義共和國聯邦妄想的可行性。\n左翼媒體已經將其言論廣為傳播，尤其是在那些城市工人和鄉下農民群體當中，他們對於[BUL.GetAdjective]提案無條件的支持早已是暴露無遺。"
 bftb_bulgaria_balkan_federation.3.a: "保加利亞的大膽舉動……"
 bftb_bulgaria_balkan_federation.4.t: "[BUL.GetNameDefCap]正在顛覆[ROOT.GetNameDef]穩定"
 bftb_bulgaria_balkan_federation.4.desc: "[BUL.GetAdjective]的激進賊徒日前已經穿越邊境潛入我國境內，試圖對[ROOT.GetNameDef]內部的巴爾幹聯邦計劃擁護者加以武裝並製造動亂。\n儘管警方殫精竭力地試圖將這些顛覆叛黨緝拿歸案，但截止到目前他們的工作尚未取得多大進展，許多[ROOT.GetAdjective]公民，尤其是那些工人階級，已經加入了支持[BUL.GetAdjective]所謂巴爾幹聯邦計劃的行列。"
 bftb_bulgaria_balkan_federation.5.t: "巴爾幹全面統一提案"
 bftb_bulgaria_balkan_federation.5.desc: "為了增進巴爾幹各地人民的相互理解與合作，[BUL.GetAdjective]政府日前向我方遞交了關於實現由統一的中央政府對巴爾幹諸國實施統治的議案。根據[BUL.GetLeader]所言，這是實現我等諸國放下舊日恩怨，建立永葆和平與統一的巴爾幹聯邦偉大且也是最後的一步。\n為推進我等諸國後續的一體化事宜，[BUL.GetNameDef]正恭候[ROOT.GetAdjective]政府對此的答覆。"
 bftb_bulgaria_balkan_federation.5.a: "讓我等巴爾幹諸兄弟共並肩！"
 bftb_bulgaria_balkan_federation.5.b: "要求在統一前得到援助。"
 bftb_bulgaria_balkan_federation.5.c: "要求獲得有限自治。"
 bftb_bulgaria_balkan_federation.5.d: "我們絕不會出賣[ROOT.GetAdjective]的獨立與自由！"
 bftb_bulgaria_balkan_federation.5.d_consequences_tt: "§R我國若拒絕或將導致被[FROM.GetNameDef]逐出[FROM.GetFactionName]，甚至使其獲得針對我國的戰爭目標！§!"
 bftb_bulgaria_balkan_federation.6.t: "[FROM.GetNameDefCap]被整合進[ROOT.GetNameDef]"
 bftb_bulgaria_balkan_federation.6.desc: "[FROM.GetAdjective]政府已經接受了我方的統一議案並加入了巴爾幹合眾聯邦。此前的[FROM.GetAdjective]公民如今將成為自由的巴爾幹公民，成為對[ROOT.GetLeader]所提出的巴爾幹統一理想抱有信心的擁簇者。"
 bftb_bulgaria_balkan_federation.6.a: "夢想已然成真！"
 bftb_bulgaria_balkan_federation.7.t: "[FROM.GetNameDefCap]請求工業援助"
 bftb_bulgaria_balkan_federation.7.desc: "[FROM.GetAdjective]政府已經同意加入巴爾幹合眾聯邦，然而在繼續推進統一前，[FROM.GetNameDef]還需要一些援助以發展其脆弱的國內工業。[FROM.GetLeader]對此保證，一旦其國家的工業發展得到促進，[FROM.GetNameDef]便會欣然併入偉大的巴爾幹合眾聯邦。"
 bftb_bulgaria_balkan_federation.7.a: "我們必須向[FROM.GetAdjective]人提供工業援助。"
 bftb_bulgaria_balkan_federation.8.t: "[FROM.GetNameDefCap]請求經濟援助"
 bftb_bulgaria_balkan_federation.8.desc: "[FROM.GetAdjective]政府已經同意加入巴爾幹合眾聯邦，然而在繼續推進統一前，經濟狀況瀕臨崩潰的[FROM.GetNameDef]急需得到財政上的支持。[FROM.GetLeader]對此保證，一旦其國家在經濟上得到輸血且狀況有所好轉，[FROM.GetNameDef]便會欣然併入偉大的巴爾幹合眾聯邦。"
 bftb_bulgaria_balkan_federation.8.a: "我們必須向[FROM.GetAdjective]人提供經濟援助。"
 bftb_bulgaria_balkan_federation.9.t: "[FROM.GetNameDefCap]請求軍事援助"
 bftb_bulgaria_balkan_federation.9.desc: "[FROM.GetAdjective]政府已經同意加入巴爾幹合眾聯邦，然而在繼續推進統一前，[FROM.GetNameDef]還需要一些軍事上的援助，以幫助其不太可靠的軍隊發起對[FROM.Capital.GetName]周遭城鄉地區異見者藏匿據點的清剿行動。[FROM.GetLeader]對此保證，一旦此項行動完成，[FROM.GetNameDef]便會欣然併入偉大的巴爾幹合眾聯邦。"
 bftb_bulgaria_balkan_federation.9.a: "我們必須向[FROM.GetAdjective]人提供軍事援助。"
 bftb_bulgaria_balkan_federation.10.t: "[FROM.GetNameDefCap]要求保留部分自治權"
 bftb_bulgaria_balkan_federation.10.desc: "由[FROM.GetLeader]率領的[FROM.GetAdjective]使團已於今日抵達[ROOT.Capital.GetName]，他們將就[FROM.GetNameDef]加入巴爾幹合眾聯邦的條件與[ROOT.GetLeader]展開商議。看起來[FROM.GetAdjective]政府儘管希望未來在聯邦內還是保留一定的獨立與自治，但是他們還是願意以合作國的身份加入聯邦的大家庭。"
 bftb_bulgaria_balkan_federation.10.a: "同意請求！"
 bftb_bulgaria_balkan_federation.11.t: "[FROM.GetNameDefCap]拒絕我國提案"
 bftb_bulgaria_balkan_federation.11.desc: "儘管其仍舊錶示願意保持兩國間的同盟關係，但[FROM.GetAdjective]政府還是對加入巴爾幹合眾聯邦一事表示了拒絕。\n然而，[FROM.GetLeader]還公開宣稱，保加利亞政府對於[FROM.GetAdjective]拒絕的反應將會展露其組建聯邦的真實目的，將會證明保方究竟是想異想天開地擴張領土，還是並不計較對方是否成為其聯邦成員國，真的只是為了尋求巴爾幹諸國間的合作。不過無論如何，[FROM.GetNameDef]都絕不會放棄自身的獨立及文化認同。"
 bftb_bulgaria_balkan_federation.11.a: "我們將尊重其選擇。"
 bftb_bulgaria_balkan_federation.11.b: "怎能和這樣不信任我們的政府合作？"
 bftb_bulgaria_balkan_federation.11.c: "[FROM.GetLeader]的演說未免太過分了！"
 bftb_bulgaria_balkan_federation.12.t: "[FROM.GetNameDefCap]索取[ROOT.GetAdjective]的巴爾幹領土"
 bftb_bulgaria_balkan_federation.12.desc: "[BUL.GetAdjective]政府已經派遣外交使團抵達[ROOT.GetAdjective]，要求後者割讓其在巴爾幹的領土，同時根據[BUL.GetAdjective]人的說法，把這些領土歸還於作為其法理所有者的巴爾幹諸國手中。儘管[BUL.GetNameDef]的外交代表們總體而言都保持著儒雅隨和的風度，但也有部分我方外交官聲稱其感受到了某種威脅的意味，特別是最開始他們看到[ITA.GetAdjective]的閣僚們對此事都表示拒絕的時候。"
 bftb_bulgaria_balkan_federation.12.a: "為了和平我們將滿足其要求……"
 bftb_bulgaria_balkan_federation.12.a_state_transfering_tt: "此地將被交予其合法的巴爾幹所有者。"
 bftb_bulgaria_balkan_federation.12.b: "[ROOT.GetNameDef]不會屈服於[BUL.GetAdjective]的施壓！"
 bftb_bulgaria_balkan_federation.12.b_tt: "或將導致以下影響："
 bftb_bulgaria_balkan_federation.13.t: "[ITA.GetNameDefCap]向我國要求妥協"
 bftb_bulgaria_balkan_federation.13.desc: "經過漫長而激烈的會談，我國派遣到[ITA.GetAdjective]的外交使團就割讓其巴爾幹領土的事宜達成了一致，[ITA.GetLeader]已向[BUL.GetAdjective]的施壓讓步，並且正式將[ITA.GetAdjective]控制下的巴爾幹地區交還予各法理的所有國。"
 bftb_bulgaria_balkan_federation.13.a: "[ITA.GetLeader]作出了明智的抉擇。"
 bftb_bulgaria_balkan_federation.14.t: "[BUL.GetAdjective]仲裁巴爾幹領土"
 bftb_bulgaria_balkan_federation.14.desc: "[BUL.GetAdjective]政府日前向[ITA.GetNameDef]派遣了外交使團，並要求[ITA.GetAdjective]割讓其在巴爾幹的領土。\n在漫長的會談後，[ITA.GetLeader]向[BUL.GetAdjective]的施壓讓步，同意將[ITA.GetAdjective]控制下的巴爾幹地區歸還予各法理所有國，而這無疑將實現[ROOT.GetNameDef]一定程度的領土擴張。"
 bftb_bulgaria_balkan_federation.14.a: "我們必須為此感謝保加利亞人！"
 bftb_bulgaria_balkan_federation.15.t: "[ITA.GetNameDefCap]拒絕割讓其巴爾幹領土"
 bftb_bulgaria_balkan_federation.15.desc: "在我國派遣到[ITA.GetAdjective]的外交使團就後者將其據有的巴爾幹領土歸還予法理所有國的事宜進行漫長的會談後，[ITA.GetLeader]最終拒絕了[ROOT.GetAdjective]外交官們，他還表示[ITA.GetNameDef]在巴爾幹控制的每一寸土地，都理所當然地屬於[ITA.GetAdjective]人民。"
 bftb_bulgaria_balkan_federation.15.a: "那我們就自行奪回這些領土！"
 bftb_bulgaria_balkan_federation.15.b: "還是稍後再和[ITA.GetAdjective]人算賬……"
 bftb_bulgaria_balkan_federation.16.t: "[BUL.GetNameDefCap]索取[ROOT.GetAdjective]的全部巴爾幹領土"
 bftb_bulgaria_balkan_federation.16.desc: "[BUL.GetAdjective]政府已經派遣外交使團抵達[ROOT.GetAdjective]，要求後者割讓其在巴爾幹的領土，同時根據[BUL.GetAdjective]人的說法，把這些領土歸還於作為其法理所有者的巴爾幹諸國手中。\n儘管[BUL.GetNameDef]的外交代表們總體而言都保持著儒雅隨和的風度，但也有部分我方外交官聲稱其感受到了某種威脅的意味，特別是最開始他們看到[ROOT.GetAdjective]的閣僚們對此事都表示拒絕的時候。"
 bftb_bulgaria_balkan_federation.16.a: "我們必須全力阻止一場新巴爾幹戰爭爆發……"
 bftb_bulgaria_balkan_federation.16.b: "[BUL.GetLeader]怕不是在痴人說夢！"
 bftb_bulgaria_balkan_federation.17.t: "[TUR.GetNameDefCap]割讓其巴爾幹領土"
 bftb_bulgaria_balkan_federation.17.desc: "在和我國外交代表就[TUR.GetAdjective]割讓其在巴爾幹領土的事宜進行了極為緊張的會談後，[TUR.GetLeader]最終向[ROOT.GetAdjective]的施壓讓步，旋即正式將[TUR.GetAdjective]控制下的巴爾幹地區割讓予[ROOT.GetNameDef]。"
 bftb_bulgaria_balkan_federation.17.a: "我們應當為此慶賀！"
 bftb_bulgaria_balkan_federation.18.t: "[TUR.GetNameDefCap]拒絕割讓其巴爾幹領土"
 bftb_bulgaria_balkan_federation.18.desc: "在和我國外交代表就[TUR.GetAdjective]向[ROOT.GetNameDef]割讓其在巴爾幹領土的事宜進行了極為緊張的會談後，[TUR.GetLeader]最終拒絕了我國外交官，他還表示[TUR.GetNameDef]已經統治了這些領土數個世紀，[TUR.GetNameDef]才是其合法的所有者。"
 bftb_bulgaria_balkan_federation.18.a: "那我們就只能用武力奪取它們了！"
 bftb_bulgaria_balkan_federation_project_ready_tt: "£GFX_trigger_yes 巴爾幹聯邦計劃已準備就緒。"
 bftb_bulgaria_balkan_federation.7_tt: "當此決議完成時：\n"
 BUL_italy_yields_states_to_root_tt: "[ITA.GetFlag]§Y[ITA.GetNameDefCap]§!將以下地區交予§Y[ROOT.GetNameDef]§!： "
 BUL_italy_yields_states_to_others_tt: "[ITA.GetFlag]§Y[ITA.GetNameDefCap]§!將以下地區交予§Y其他巴爾幹國家§!： "
 bftb_bulgaria_balkan_federation_turkish_states_tt: "[BUL.GetFlag]§Y[BUL.GetNameDefCap]§!成為以下地區的所有者： "
 bftb_bulgaria_fate_of_the_balkans.1.t: "[BUL.GetNameDefCap]要求我國加入[BUL.GetFactionName]"
 bftb_bulgaria_fate_of_the_balkans.1.desc: "一位[BUL.GetAdjective]特使在今天抵達首都，並就敦促[ROOT.GetNameDef]加入[BUL.GetFactionName]的事宜，與[ROOT.GetLeader]展開了會晤。根據[GetBulgarianLeader]的承諾，[BUL.GetNameDef]屆時將在研究和防務領域提供合作，並且保障全體成員國的安全與主權。然而，這位外交官也警告說，任何拒絕加入此聯盟的巴爾幹國家都將被視作敵對方。"
 BUL_leader_is_tsar: "沙皇[BUL.GetLeader]"
 BUL_leader_is_regency_council: "保加利亞攝政議會"
 BUL_leader_is_a_politician: "[BUL.GetLeader]"
 bftb_bulgaria_fate_of_the_balkans.1.a: "[ROOT.GetNameDefCap]誠應加入[BUL.GetFactionName]。"
 bftb_bulgaria_fate_of_the_balkans.1.b: "我們可不會屈從於空洞的威脅！"
 bftb_bulgaria_fate_of_the_balkans.2.t: "[FROM.GetNameDefCap]同意加入[BUL.GetFactionName]"
 bftb_bulgaria_fate_of_the_balkans.2.desc: "派往[FROM.GetName]說服其政府加入[BUL.GetFactionName]的特使今天已從[FROM.GetAdjective]首都返回，為我們傳回了好消息：[FROM.GetLeader]已接受我方要求，[FROM.GetHerHis]終究加入了我們的聯盟。"
 bftb_bulgaria_fate_of_the_balkans.2.a: "[BUL.GetFactionName]正在擴張！"
 bftb_bulgaria_fate_of_the_balkans.3.t: "[FROM.GetNameDefCap]拒絕加入[BUL.GetFactionName]"
 bftb_bulgaria_fate_of_the_balkans.3.desc: "派往[FROM.GetName]敦促其加入[BUL.GetFactionName]的特使已發回報告稱[FROM.GetLeader]無意加入我們的聯盟，他們顯然沒有意識到，在無視我國外交官的警告後，[FROM.GetNameDef]將會因為膽敢忤逆[BUL.GetAdjective]的命令而遭受註定的命運。"
 bftb_bulgaria_fate_of_the_balkans.3.a: "[FROM.GetLeader]已證明其不過蠢才爾……"
 bftb_bulgaria_fate_of_the_balkans.4.t: "[BUL.GetNameDefCap]索取[FROM.FROM.GetName]"
 bftb_bulgaria_fate_of_the_balkans.4.desc: "[GetBulgarianLeaderDiplomaticMission]的[BUL.GetAdjective]外交使團已經抵達我國首都，就我國將[FROM.FROM.GetName]交還予[BUL.GetNameDef]的事宜展開磋商，其宣稱此地區理應屬於他們。"
 BUL_tsar_leads_diplomatic_mission: "由沙皇[BUL.GetLeader]親自統領"
 BUL_politician_leads_diplomatic_mission: "由[BUL.GetLeader]親自統領"
 BUL_bulgarian_government: ""
 bftb_bulgaria_fate_of_the_balkans.4.a: "我們可沒法加以拒絕……"
 bftb_bulgaria_fate_of_the_balkans.4.b: "此事最好想都別想！"
 bftb_bulgaria_fate_of_the_balkans.5.t: "[FROM.GetNameDefCap]同意向[BUL.GetAdjective]移交[FROM.FROM.FROM.GetName]"
 bftb_bulgaria_fate_of_the_balkans.5.desc: "在和[BUL.GetAdjective]派往[FROM.GetAdjective]首都的外交使團進行漫長的談判後，[FROM.GetLeader]最終同意將[FROM.FROM.FROM.GetName]交還予保加利亞。"
 bftb_bulgaria_fate_of_the_balkans.5.a: "[FROM.FROM.FROM.GetName]終究還是物歸原主。"
 bftb_bulgaria_fate_of_the_balkans.6.t: "[FROM.GetNameDefCap]拒絕向[BUL.GetNameDef]移交[FROM.FROM.FROM.GetName]"
 bftb_bulgaria_fate_of_the_balkans.6.desc: "在和[BUL.GetAdjective]派往[FROM.GetAdjective]首都的外交使團展開數個小時的激烈談判後，[FROM.GetLeader]最終拒絕將[FROM.FROM.FROM.GetName]交還予[BUL.GetNameDef]。"
 bftb_bulgaria_fate_of_the_balkans.6.a: "[FROM.GetLeader]作出了愚蠢的決定……"
 bftb_bulgaria_fate_of_the_balkans.7.t: "[BUL.GetNameDefCap]要求[ROOT.GetAdjective]臣服"
 bftb_bulgaria_fate_of_the_balkans.7.desc: "最終，[BUL.GetAdjective]政府露出了真面目，他們向[ROOT.GetNameDef]派遣了使團，並勒令其奉迎[BUL.GetNameDef]為宗主國，而這將意味著[ROOT.GetAdjective]政府對[GetBulgarianLeader]統治的無條件臣服。"
 bftb_bulgaria_fate_of_the_balkans.7.a: "我們可沒法加以拒絕……"
 bftb_bulgaria_fate_of_the_balkans.7.b: "[ROOT.GetNameDefCap]絕不會向外敵屈服！"
 bftb_bulgaria_fate_of_the_balkans.8.t: "[FROM.GetNameDefCap]拱手臣服於[BUL.GetNameDef]"
 bftb_bulgaria_fate_of_the_balkans.8.desc: "自從[FROM.GetNameDef]加入[BUL.GetFactionName]之後，我們已經多次就服從於[GetBulgarianLeader]的事宜遊說其政府，隨著最近我們針對幾名[FROM.GetAdjective]閣僚的賄賂和脅迫開始奏效，[FROM.GetLeader]終於被迫簽署了正式承認[BUL.GetNameDef]為其宗主國的條約，由此，[FROM.GetAdjective]人終於被征服了。"
 bftb_bulgaria_fate_of_the_balkans.8.a: "[FROM.GetAdjective]人還算識時務。"
 bftb_bulgaria_fate_of_the_balkans.9.t: "[FROM.GetNameDefCap]拒不臣服於[BUL.GetNameDef]"
 bftb_bulgaria_fate_of_the_balkans.9.desc: "不幸的是，[FROM.GetAdjective]政府決意要忤逆[GetBulgarianLeader]的意志。[FROM.GetLeader]在今天公開表明了其拒絕臣服於[BUL.GetAdjective]政府的態度。雖然這是個受到絕大多數[FROM.GetAdjective]人民支持大膽決定，但鑑於其可悲的國家仍舊需要我國的庇護，因此這也是個魯莽的決定。如此之後，[GetBulgarianLeader]已經開始重新考慮[FROM.GetAdjective]在[BUL.GetFactionName]當中的席位……"
 bftb_bulgaria_fate_of_the_balkans.9.a: "我們必須向其持續施壓！"
 bftb_bulgaria_fate_of_the_balkans.9.a_cooldown_tt: "§Y勒令[FROM.GetName]臣服§!的決議將在§R365日§!後再次可用"
 bftb_bulgaria_fate_of_the_balkans.9.b: "他們的僭越必將受到嚴懲！"
 bftb_bulgaria_fate_of_the_balkans.10.t: "[BUL.GetNameDefCap]強迫[FROM.GetNameDef]加入[BUL.GetFactionName]"
 bftb_bulgaria_fate_of_the_balkans.10.desc: "在收到[BUL.GetAdjective]政府的最後通牒後，[FROM.GetNameDef]領導人[FROM.GetLeader]顯然受迫於本國所受到的威脅恐嚇，其閣僚以至於他本人都選擇屈服於[BUL.GetAdjective]的施壓，宣佈[FROM.GetNameDef]將立刻退出[ROOT.GetFactionName]並加入[BUL.GetFactionName]。"
 bftb_bulgaria_fate_of_the_balkans.10.a: "[BUL.GetNameDef]將為此付出代價！"
 bftb_bulgaria_fate_of_the_balkans.10.b: "可悲領導人的無奈之舉……"
 BUL_transferred_bulgarian_state_autonomy_desc: "已割讓保加利亞宣稱的地區。"
 bftb_bulgaria_political_leaders.1.t: "赫里斯托·盧科夫謀殺案"
 bftb_bulgaria_political_leaders.1.desc: "昨天晚上，[GetLukovLeader]遭到了兩名自皇家電影院尾隨其返回位於第1炮兵大街住所的[GetLukovPartisans]的埋伏。\n當這位政治領導人剛要踏進家門時，其中之一的[GetLukovCriminals]自近距離開槍將其肩膀打傷，但盧科夫還是猛地抓住這名男子並將其撞到了牆上，隨後他試圖撤進屋內，但此時[GetLukovSecondAssailant]從其身後補槍，事成後攙扶起她的[GetLukovAccomplice]經鄰家的庭院逃離了現場，徒留受到致命傷的赫里斯托·盧科夫倒在了其家門口的血泊中。\n[GetLukovConclusion]"
 bftb_bulgaria_political_leaders.1.a: "從國家軍團聯盟當中重新選召領導人。"
 bftb_bulgaria_political_leaders.1.b: "我們需要思想更激進的人選……委任亞歷山大·燦科夫！"
 bftb_bulgaria_political_leaders.1.c: "這個世界沒有他會更好！"
 bftb_bulgaria_political_leaders.1.d: "真是悲劇啊……"
 BUL_hristo_lukov_death_leader_party: "保加利亞國家軍團聯盟領袖赫里斯托·盧科夫"
 BUL_hristo_lukov_death_leader_country: "[ROOT.GetAdjective]領導人赫里斯托·盧科夫"
 BUL_hristo_lukov_death_partisans_communism: "保加利亞共產黨所屬武裝團體成員"
 BUL_hristo_lukov_death_partisans_other: "據傳游擊隊成員"
 BUL_hristo_lukov_death_criminals_communism: "游擊隊員伊萬·布羅季耶夫"
 BUL_hristo_lukov_death_criminals_other: "行兇者"
 BUL_hristo_lukov_death_second_assailant_communism: "維奧萊塔·亞科娃——尚未被受害者察覺的第二位刺客"
 BUL_hristo_lukov_death_second_assailant_other: "尚未被受害者察覺的第二位刺客——據目擊者稱是名女性"
 BUL_hristo_lukov_death_accomplice_communism: "同志"
 BUL_hristo_lukov_death_accomplice_other: "同夥"
 BUL_hristo_lukov_death_conclusion_communism: ""
 BUL_hristo_lukov_death_conclusion_other: "國家安全部門目前已經開始追捕行兇者，但我們亦必須以國家前途為重，選拔有識之士繼任赫里斯托·盧科夫之位，並令其肩負起領導[ROOT.GetNameDef]的職責。"
 bftb_bulgaria_greek_influence.1.t: "[BUL.GetNameDefCap]和[GRE.GetAdjective]政府展開會談"
 bftb_bulgaria_greek_influence.1.desc: "[BUL.GetAdjective]首相[BUL.GetLeader]日前在會見[ROOT.GetLeader]時，提議通過和平條約正式確立[BUL.GetNameDef]和[ROOT.GetNameDef]兩國間的友好關係。同時，這位[BUL.GetAdjective]領導人也為那些希望在他們的鄰國設立分公司的[ROOT.GetAdjective]資本家們提供了部分稅收上的特惠。"
 bftb_bulgaria_greek_influence.1.a: "[GRE.GetNameDefCap]和[BUL.GetNameDef]將自此攜手並肩！"
 bftb_bulgaria_greek_influence.1.b: "我們可不能相信那些[BUL.GetAdjective]人！"
 bftb_bulgaria_greek_influence.2.t: "[FROM.GetNameDefCap]接受我方提案"
 bftb_bulgaria_greek_influence.2.desc: "[FROM.GetAdjective]領導人[FROM.GetLeader]已經接受了我方提案，表示願意通過簽署和平條約的方式來正式確立[BUL.GetNameDef]和[FROM.GetNameDef]兩國間的友好關係。"
 bftb_bulgaria_greek_influence.2.a: "[BUL.GetNameDefCap]和[GRE.GetNameDef]將自此攜手並肩！"
 bftb_bulgaria_greek_influence.3.t: "[FROM.GetAdjective]政府拒絕我方提案"
 bftb_bulgaria_greek_influence.3.desc: "[FROM.GetAdjective]領導人[FROM.GetLeader]已經發表聲明稱他並不信任[BUL.GetAdjective]所謂的和平政策，基於此他斷然回絕了我方關於正式確立[FROM.GetNameDef]和[BUL.GetNameDef]兩國友好關係的提案。"
 bftb_bulgaria_greek_influence.3.a: "他們過於傲慢以至忽略了合作的必要性！"
 bftb_bulgaria_british_influence.1.t: "[BUL.GetAdjective]政府尋求我國庇護"
 bftb_bulgaria_british_influence.1.desc: "保加利亞首相[BUL.GetLeader]日前抵達[ENG.GetNameDef]，就請求我國落實捍衛保加利亞領土的承諾條約化事宜展開了磋商。\n根據[BUL.GetLeader]所言，其政黨是希望能夠深化與[ENG.GetAdjective]政府關係的，但也對拒絕諸如[GER.GetAdjective]人、[ITA.GetAdjective]人以及[SOV.GetAdjective]人等在巴爾幹地區抱有野望的列強後，[BUL.GetNameDef]是否能確保其領土完整的問題感到十分擔憂。"
 bftb_bulgaria_british_influence.1.a: "我方將置[BUL.GetNameDef]於[ENG.GetAdjective]保護之下。"
 bftb_bulgaria_british_influence.1.b: "我方同意簽署互不侵犯條約。"
 bftb_bulgaria_british_influence.1.c: "我方尚有其他要事需要處理。"
 bftb_bulgaria_british_influence.2.t: "[FROM.GetNameDefCap]同意保障[BUL.GetAdjective]獨立"
 bftb_bulgaria_british_influence.2.desc: "[FROM.GetAdjective]政府現已同意簽署[BUL.GetLeader]所提出的協議，如此在保障我國獨立主權的同時，也為未來深化兩國間的關係鋪平了道路。"
 bftb_bulgaria_british_influence.2.a: "我們現在受到[ENG.GetAdjective]保護了！"
 bftb_bulgaria_british_influence.3.t: "[FROM.GetNameDefCap]同意簽署互不侵犯條約"
 bftb_bulgaria_british_influence.3.desc: "儘管[FROM.GetAdjective]政府同意在[BUL.GetNameDef]和[FROM.GetNameDef]兩國間簽署一份條約，但是[FROM.GetLeader]還是拒絕正式擔保我國的獨立主權，其稱如此舉動或將產生嚴重的外交後果，造成巴爾幹乃至整個歐洲的局勢惡化。\n即便如此，[FROM.GetAdjective]領導人看起來還是對發展我等兩國間的友好關係以及合作事宜抱有興趣。"
 bftb_bulgaria_british_influence.3.a: "這是好的開端！"
 bftb_bulgaria_british_influence.4.t: "[ENG.GetNameDefCap]拒絕我方提案"
 bftb_bulgaria_british_influence.4.desc: "[FROM.GetAdjective]政府已經表示其無意深化我等兩國間的關係，對我方就簽署條約以保障[BUL.GetNameDef]獨立主權並促進兩國合作的議案予以徹底的拒絕。"
 bftb_bulgaria_british_influence.4.a: "這些冥頑不化的英國佬！"
 bftb_bulgaria_democratic_international_policies.1.t: "[BUL.GetNameDefCap]保障[ROOT.GetAdjective]獨立"
 bftb_bulgaria_democratic_international_policies.1.desc: "[BUL.GetAdjective]政府在今天宣佈，捍衛睦鄰友好的巴爾幹國家領土主權完整，同時抗擊好戰外國勢力的侵略野望是[BUL.GetNameDef]義不容辭的責任。\n為此，[BUL.GetLeader]首相鄭重承諾，[BUL.GetNameDef]將全力庇護[ROOT.GetAdjective]，同時也將採取一系列新措施以準備捍衛整個巴爾幹。"
 bftb_bulgaria_democratic_international_policies.1.a: "他們可真是體貼！"
 bftb_bulgaria_democratic_international_policies.2.t: "[BUL.GetAdjective]工業投資"
 bftb_bulgaria_democratic_international_policies.2.desc: "[BUL.GetAdjective]的巨頭們已在我國完成了數項投資，同時也建立了一批定將振興我國工業的旗下附屬公司。\n毫無疑問，這是[BUL.GetAdjective]政府精心設計、在我國提升影響力並傳播其資本主義理念的長遠計劃的一部分，但至少從現在來說，我們可以從這些小規模的工業拓展當中獲益。"
 bftb_bulgaria_democratic_international_policies.2.a: "他們難道認為僅此便可干涉我國政治？"
 bftb_bulgaria_democratic_international_policies.3.t: "[BUL.GetAdjective]資本投注"
 bftb_bulgaria_democratic_international_policies.3.desc: "為了穩定我國的金融行業，[BUL.GetAdjective]政府已經為陷入困境的[ROOT.GetAdjective]公司提供了財政支持。\n然而，不會有任何一位閣僚會愚蠢地去相信此舉是出於團結或同情的善意。很明顯，[BUL.GetAdjective]想要通過這樣的資本投注來加強其對我國經濟的控制。"
 bftb_bulgaria_democratic_international_policies.3.a: "我們必須對此謹慎……"
 bftb_bulgaria_democratic_international_policies.4.t: "[BUL.GetAdjective]領土完整申訴案"
 bftb_bulgaria_democratic_international_policies.4.desc: "來自[BUL.GetNameDef]的使團現已抵達我國，請求[ROOT.GetLeader]認可[BUL.GetAdjective]政府對現由盟軍部隊佔領的保加利亞此前領土的合法所有權，並尋求此地區能最終交還予[BUL.GetNameDef]所管轄。"
 bftb_bulgaria_democratic_international_policies.4.a: "[ROOT.GetAdjective]政府當然承認保加利亞的領土完整！"
 bftb_bulgaria_democratic_international_policies.4_tt: "§Y[BUL.GetNameWithFlag]§!成為以下地區的所有者："
 bftb_bulgaria_democratic_international_policies.4.b: "此項議案實屬不切實際。"
 bftb_bulgaria_democratic_international_policies.5.t: "[ENG.GetNameDefCap]承認保加利亞領土完整"
 bftb_bulgaria_democratic_international_policies.5.desc: "我方派往[ENG.GetNameDef]的使團在成功向[ENG.GetAdjective]政府遞交申請後現已返回，後者同意將目前由盟軍部隊佔領的保加利亞此前領土交還予[BUL.GetNameDef]管轄。"
 bftb_bulgaria_democratic_international_policies.5.a: "我國人民將為此消息歡欣鼓舞！"
 bftb_bulgaria_democratic_international_policies.6.t: "[ENG.GetNameDefCap]拒絕承認保加利亞領土完整"
 bftb_bulgaria_democratic_international_policies.6.desc: "不幸的是，我方派往[ENG.GetNameDef]的使團未能讓[ENG.GetAdjective]政府同意由我方對目前由盟軍部隊佔領的保加利亞此前領土進行管轄。"
 bftb_bulgaria_democratic_international_policies.6.a: "他們這是在破壞我國領土完整！"
 bftb_bulgaria_democratic_international_policies.7.t: "[ENG.GetAdjective]-[BUL.GetAdjective]條約"
 bftb_bulgaria_democratic_international_policies.7.desc: "[ENG.GetAdjective]政府已經派遣外交使團通知我們，他們決定將目前由我方部隊佔據的保加利亞此前領土的管轄權交還予[BUL.GetNameDef]政府，此協議立即生效。\n面對這樣的局面，我們試圖就此決議與[ENG.GetAdjective]展開協商的嘗試已然失敗，眼下我國政府只能被迫放棄對這些新佔領土的控制，以此委曲求全維護與我國盟友間的良好關係。"
 bftb_bulgaria_democratic_international_policies.7.a: "這是對[ROOT.GetNameDef]的公然侮辱。"
 bftb_news.1.t: "[BUL.GetAdjective]政府譴責IMRO"
 bftb_news.1.desc: "今天早些時候，[BUL.GetAdjective]領導人[BUL.GetLeader]發表了官方聲明，表達了其對馬其頓內部革命組織（IMRO）的反對態度且公開譴責了其行徑。\n[BUL.GetAdjective]內政長官同時也宣佈將推行一系列特殊政策以授權政府調配更多資源，以發動更加有效的行動打擊馬其頓內部革命組織，將此恐怖組織徹底加以根除。\n根據這項聲明，看來[BUL.GetAdjective]政府已經下定決心要粉碎製造巴爾幹地區緊張和衝突的最大根源之一了……"
 bftb_news.1.a: "今朝時機已到！"
 bftb_news.1.b: "此誠剿滅IMRO的良機！"
 bftb_news.1.c: "看來IMRO的命數將盡……"
 bftb_news.2.t: "[BUL.GetAdjective]政府支持IMRO"
 bftb_news.2.desc: "今天早些時候，[BUL.GetAdjective]領導人[BUL.GetLeader]公開宣佈其政府將尋求與伊萬·米哈伊洛夫——馬其頓內部革命組織最重要的領導人之一就馬其頓內部革命組織和[BUL.GetAdjective]政權之間停止敵對的事宜展開談判。根據該國內政長官所說，[BUL.GetNameDef]需要和該組織通力合作以解放眾多生活在[YUG.GetNameDef]和[GRE.GetNameDef]境內的[BUL.GetNameDef]馬其頓人。如此膽大妄為的聲明顯然將再度激起巴爾幹的地區爭端，同時亦激化其和在該地區存在利益訴求的列強間的緊張關係。"
 bftb_news.2.a: "保加利亞人這是在玩火！"
 bftb_news.2.b: "我們作出的是對保加利亞的最優選項。"
 bftb_news.2.c: "看起來巴爾幹的衝突將至……"
 bftb_news.3.t: "保加利亞沙皇鮑里斯三世逝世"
 bftb_news.3.desc: "[GetBorisDeathContext]\n[GetSuspicionsAboutBorisDeath]"
 bftb_news.3.a: "此君縱使安息……然其國將陷狂亂！"
 bftb_news.4.t: "沙皇斐迪南一世歸來"
 bftb_news.4.desc: "在保加利亞沙皇鮑里斯三世逝世後，保加利亞政府日前出人意料地拜訪了鮑里斯沙皇之父——前任沙皇斐迪南一世，並邀請他重新執掌這個國家。\n在和[GetFormerLeaderBeforeFerdinand]展開了漫長的談話後，斐迪南一世，這位在第二次巴爾幹戰爭和上次大戰的慘敗後被迫讓位於兒子的好戰統治者，最終同意重返索菲亞，再度加冕保加利亞沙皇之冠。"
 bftb_news.4.a: "他正是[BUL.GetNameDef]所需的統治者！"
 bftb_news.4.b: "此衰朽老者尚能飯否？"
 bftb_news.4.c: "真是意外的轉折……"
 BUL_former_leader_before_ferdinand_kyoseivanov: "格奧爾基·喬塞瓦諾夫首相"
 BUL_former_leader_before_ferdinand_filov: "波格丹·菲洛夫首相"
 BUL_former_leader_before_ferdinand_mushanov: "尼古拉·穆沙諾夫首相"
 BUL_former_leader_before_ferdinand_lukov: "赫里斯托·盧科夫首相"
 BUL_former_leader_before_ferdinand_tsankov: "亞歷山大·燦科夫首相"
 BUL_former_leader_before_ferdinand_generic: "保加利亞首相"
 bftb_news.5.t: "巴爾幹的保加利亞化再整合運動"
 bftb_news.5.desc: "[BUL.GetAdjective]政府日前已經開始對其巴爾幹的新據領土展開大規模的整合運動，該運動不僅鼓勵和保加利亞人移居到新的領土，同時也將各地城市和地名按照保加利亞的傳統加以重新命名，此外也按照保加利亞的政制重組了地方行政機構。\n[BUL.GetLeader]希望通過上述舉措在這些地區展現更多的保加利亞元素，同時也為[BUL.GetNameDef]在未來正式吞併諸地時做好合法化正名。"
 bftb_news.5.a: "[BUL.GetAdjective]對此諸領土的主權不容說三道四！"
 bftb_news.5.b: "他們竟敢毀滅[THIS.GetAdjective]的文化？！"
 bftb_news.5.c: "保加利亞人的大膽之舉……"
 bftb_news.6.t: "保加利亞牧首區的重建"
 bftb_news.6.desc: "在政府的支持下，保加利亞督主教日前已向君士坦丁堡牧首施壓，要求其正式承認保加利亞自主教會。\n面對如此受到咄咄逼人的[BUL.GetLeader]支持的要求，君士坦丁堡牧首不得不允許聖會議正式通過新的教律，授予保加利亞教會自主選舉其執宰的權力，如此一來，在長達七個世紀的歲月後，保加利亞牧首區終於得以重建。"
 bftb_news.6.a: "此成就誠令保加利亞人歡欣鼓舞！"
 bftb_news.6.b: "有趣的進展……"
 bftb_news.7.t: "保加利亞第三帝國"
 bftb_news.7.desc: "昨天，保加利亞政府在索菲亞組織了一場聲勢浩大的政治集會。\n在集會過程中，出乎絕大多數與會者預料的是，[BUL.GetLeader]正式宣告建立保加利亞第三帝國，開啟大保加利亞國家的宏偉新時代。\n而在此演說後所舉辦的宏偉莊嚴的儀式當中，[BUL.GetLeader]加冕為保加利亞帝國皇帝，在場的保加利亞政界和軍界領袖們皆向新帝國及其統治者宣誓效忠。"
 bftb_news.7.a: "這將使保加利亞人的國度更加偉大！"
 bftb_news.7.b: "看起來[BUL.GetLeader]是在妄自尊大……"
 bftb_news.7.c: "這真的有必要嗎？"
 bftb_news.8.t: "祖國陣線接管保加利亞"
 bftb_news.8.desc: "祖國陣線是從根本上反對[FROM.GetLeader]專制政權的保加利亞反法西斯政治組織，它由眾多深受共產黨影響的政治黨團構成，其共同目標乃對抗保加利亞的獨裁政制。\n在該組織策劃的起義浪潮下，一場內戰此前已在保加利亞政府忠誠派軍隊和祖國陣線支持群體之間爆發。\n最終，這場內戰落下帷幕，共產黨人在推翻[FROM.GetLeader]的政權後，宣告了保加利亞人民共和國的誕生。"
 bftb_news.8.a: "保加利亞人民的偉大勝利！"
 bftb_news.8.b: "令人擔憂……"
 bftb_news.9.t: "巴爾幹社會主義共和國聯邦"
 bftb_news.9.desc: "[BUL.GetNameDefCap]日前成立了[BUL.GetFactionName]——看起來這是那個1920年代生不逢時的構想改進後的產物。\n根據保加利亞首相[BUL.GetLeader]所言，[BUL.GetAdjective]政府正致力於在巴爾幹諸國中形成聯合陣線，以此應對那些對此地區抱有領土野心的外國勢力的入侵威脅。\n儘管這個新計劃成功與否尚且值得商榷，但毋庸置疑的是，對於巴爾幹聯邦的支持正迅速在其周遭鄰國的民眾群體當中擴大。"
 bftb_news.9.a: "此即為邁向進步的道路！"
 bftb_news.9.b: "有意思……"
 bftb_news.9.c: "不過是又一次想要統合巴爾幹的失敗嘗試……"
 bftb_news.10.t: "巴爾幹的統一"
 bftb_news.10.desc: "[BUL.GetNameDef]日前由此前的[BUL.GetOldNameDef]政府宣告成立，後者希望能以此使[BUL.GetFactionName]更進一步，將其聯盟的諸成員國整合至統一的中央政府管轄下。\n根據[BUL.GetLeader]所言，[BUL.GetNameDef]將尋求實現巴爾幹諸國放下彼此舊日的恩怨和衝突，通過完全的合作進而促進巴爾幹人民的團結。"
 bftb_news.10.a: "夢想已然成真！"
 bftb_news.10.b: "這是[THIS.GetNameDef]真正需要的嗎？" #THIS
 bftb_news.10.c: "這是巴爾幹諸國真正需要的嗎？"
 bftb_news.10.d: "胡說八道！"
 bftb_news.11.t: "[BUL.GetNameDefCap]向[GER.GetNameDef]求助"
 bftb_news.11.desc: "\n為了深化和[GER.GetNameDef]的關係且鼓勵外資進駐其國家，[BUL.GetAdjective]政府日前同數家[GER.GetAdjective]公司簽訂了商業協議。\n根據協議，[GER.GetAdjective]的投資者們在[BUL.GetNameDef]展開經營時，將會獲得顯著的政策扶持以及稅收減免。"
 bftb_news.11.a: "這將改善我們和[GER.GetNameDef]的關係！"
 bftb_news.11.b: "這會鼓勵[BUL.GetAdjective]人站到我們這邊！"
 bftb_news.11.c: "[BUL.GetNameDef]會加入[GER.GetFactionName]嗎？"
 bftb_news.11.d: "他們不過是想尋求[GER.GetLeader]的保護罷了！"
 bftb_news.12.t: "[ITA.GetAdjective]-[BUL.GetAdjective]軍事技術交流合作"
 bftb_news.12.desc: "\n在和[GER.GetAdjective]政府接洽後，[BUL.GetNameDef]現在進一步尋求深化與[ITA.GetNameDef]之間的關係。\n為促進兩國軍備現代化的研發，[BUL.GetLeader]和[ITA.GetLeader]日前簽署了一份由兩國專家擬定的科研協議。\n而除此協議之外，[BUL.GetAdjective]政府還將出臺新的經濟法規，以此促進[ITA.GetAdjective]資本在其國家的投資。"
 bftb_news.12.a: "這將邁向富有成效的雙邊關係！"
 bftb_news.12.b: "[BUL.GetAdjective]人尚未證明其能作為[ITA.GetNameDef]的優秀盟友。"
 bftb_news.12.c: "保加利亞人似乎急於結交新友……"
 bftb_news.12.d: "他們正和魔鬼打交道……"
 bftb_news.13.t: "[SOV.GetAdjective]-[BUL.GetAdjective]互助條約"
 bftb_news.13.desc: "\n[BUL.GetAdjective]首相[BUL.GetLeader]和[SOV.GetAdjective]領導人[SOV.GetLeader]日前簽署了一份協議，其內容包括進一步深化兩國關係，同時推進兩國在軍事和經濟領域的合作。\n通過這項協議，[BUL.GetAdjective]政府也尋求促進對[SOV.GetNameDef]的貿易，同時利用[SOV.GetAdjective]資本開展新的工業投資。"
 bftb_news.13.a: "這項條約對[BUL.GetNameDef]極其有利！"
 bftb_news.13.b: "蘇聯在巴爾幹的影響力與日俱增！"
 bftb_news.13.c: "[BUL.GetNameDef]會加入[SOV.GetFactionName]嗎？"
 bftb_news.13.d: "他們不過是想尋求[SOV.GetAdjective]的保護罷了！"
 bftb_news.14.t: "巴爾幹國家締結“永恆友誼條約”"
 bftb_news.14.desc: "作為重建[BUL.GetNameDef]和巴爾幹諸鄰國關係的初步嘗試，[BUL.GetAdjective]日前和[YUG.GetNameDef]簽署了一份友好條約，正式承諾發展雙邊友好關係並促進兩國的經濟合作。\n但也有人聲稱，此舉並非只是要與鄰國構建友好關係，[BUL.GetAdjective]政府真正的目的或許是要建立巴爾幹聯邦進而與其他歐洲列強分庭抗禮。\n不過就目前來看，這樣的觀點或許只是空穴來風的猜測……"
 bftb_news.14.a: "這終將為巴爾幹諸國帶來些許穩定！"
 bftb_news.14.b: "不過是試圖阻擋我國戰爭鐵蹄的絕望之舉！"
 bftb_news.15.t: "薩洛尼卡協定"
 bftb_news.15.desc: "[BUL.GetAdjective]首相[BUL.GetLeader]日前在[GRE.GetAdjective]首都會見了[GRE.GetLeader]，雙方就簽署一項包括彼此確保友好關係並促進[BUL.GetNameDef]和[GRE.GetNameDef]雙邊經濟合作內容在內的條約事宜進行了商議。\n根據[BUL.GetLeader]所言，這只是[BUL.GetNameDef]力圖重建同其鄰國間關係的初步嘗試，而它將在近期被證明會是卓有成效的努力。"
 bftb_news.16.t: "[BUL.GetNameDefCap]向[ENG.GetNameDef]求助"
 bftb_news.16.desc: "\n尋求列強保障[BUL.GetNameDef]的獨立主權及領土完整的[BUL.GetAdjective]政府，日前向[ENG.GetNameDef]派遣了外交使團，與[ENG.GetAdjective]政府就雙方締約事宜展開了磋商。\n而除了有關軍事領域的條款外，這份條約還包括了特許在[BUL.GetNameDef]展開經營的[ENG.GetAdjective]資本家享有顯著稅收優待的經濟協定。"
 bftb_news.16.a: "這將改善我們和[ENG.GetNameDef]的關係！"
 bftb_news.16.b: "這會鼓勵[BUL.GetAdjective]人站到我們這邊！"
 bftb_news.16.c: "[BUL.GetNameDef]會加入[ENG.GetFactionName]嗎？"
 bftb_news.16.d: "他們不過是想尋求[ENG.GetLeader]的保護罷了！"
 bftb_news.201.t: "[TUR.GetNameDefCap]實現海峽再軍事化"
 bftb_news.201.desc: "[TUR.GetNameDefCap]和[SOV.GetNameDef]日前就修訂洛桑條約的事宜達成了協議，此條約是新生的土耳其共和國在[TUR.GetAdjective]獨立戰爭中擊退協約國集團後簽署生效的。長久以來，該條約都被譴責為對[TUR.GetAdjective]主權的侵犯，而今，這份條約終於被新近簽署的蒙特勒公約所取代。\n\n[TUR.GetNameDefCap]如今可以完全掌控其海峽的進出交通，同時海峽周邊地區也由[TUR.GetNameDef]實現了再軍事化。除此之外，曾參與此進程的[ENG.GetAdjective]觀察家們，也對此地潛在的衝突得到避免多少表示了滿意。"
 bftb_news.201.a: "那就這樣吧。"
 bftb_news.201.b: "偉大的和平之日。"
 bftb_news.201.c: "又一項上次大戰簽訂的條約被撕毀了。"
 bftb_news.201.d: "這對[TUR.GetNameDef]只有好處。"
 bftb_news.202.t: "土耳其海峽維持非軍事化"
 bftb_news.202.desc: "[TUR.GetNameDefCap]和[SOV.GetNameDef]日前未能就修訂洛桑條約一事達成共識，此條約是新生的土耳其共和國在[TUR.GetAdjective]獨立戰爭中擊退協約國集團後簽署生效的，它規定對土耳其海峽實施非軍事化，同時無條件開放達達尼爾和博斯普魯斯兩海峽的民用和軍用通行，並在可預見的未來維持現狀。\n\n[TUR.GetLeader]在其全國講話中強烈譴責此結果，認為[TUR.GetNameDef]仍舊為卑劣的帝國主義列強的獵物。而曾參與此進程的[ENG.GetAdjective]觀察家們，則對本地區潛在衝突得以避免的狀況多少表示了滿意。"
 bftb_news.202.a: "他們誠應畏懼我們的力量。"
 bftb_news.202.b: "我們還能做些什麼？"
 bftb_news.202.c: "我們還能再努力一下嗎？"
 bftb_news.202.d: "至少避免了兵戎相見……"
 bftb_news.202.e: "這是[TUR.GetNameDef]衰敗的體現……"
 bftb_news.203.t: "[TUR.GetAdjective]-[SOV.GetAdjective]開戰"
 bftb_news.203.desc: "誰能想到，本是對舊有條約的修訂談判，如今竟會演變為[SOV.GetNameDef]和[TUR.GetNameDef]兩國為了土耳其海峽通行權而爆發的全面戰爭。\n\n[TUR.GetLeader]對於談判破裂以及“不幸”開戰的結果表示了遺憾，他認為這樣的情況本來“完全可以避免的”。而[SOV.GetLeader]方面則宣稱，其無畏的[SOV.GetNameDef]軍隊必將勇往直前，直到上次大戰後所簽訂的舊約再次得到執行。[SOV.GetLeader]還作出保證稱[TUR.GetAdjective]工人階級的解放即將來臨，對當下反動[TUR.GetAdjective]政權的埋葬必將成為國際共產主義運動的偉大勝利。"
 bftb_news.203.a: "烏拉——！"
 bftb_news.203.b: "放馬過來吧！"
 bftb_news.203.c: "噢，這可真是場災難……"
 bftb_news.203.d: "往昔優良的外交傳統何在！？"
 bftb_news.203.e: "呃，我們應該考慮援助[TUR.GetAdjective]作戰……"
 bftb_news.203.f: "真是糟糕。"
 bftb_news.204.t: "[TUR.GetNameDef]內戰爆發！"
 bftb_news.204.desc: "一場現任保守派政府和此前執政的凱末爾派之間的內戰，已然在[TUR.GetNameDef]打響。這些曾在奧斯曼帝國崩潰後為[TUR.GetNameDef]獨立而浴血奮戰的凱末爾主義者們指控現政府多次侵犯本國憲法，此等褻瀆之舉已足以成為將其推翻的依據。作為公開的凱末爾派，著名將軍卡齊姆·奧爾巴伊被推舉出來領導軍政府以取代[TUR.GetLeader]現任的伊斯蘭主義政府。\n\n[TUR.GetLeader]對凱末爾派的行為進行了譴責，稱其褻瀆了這個國家的民主精神，他誓言要重建此分裂國度的法律與秩序。"
 bftb_news.204.a: "我們必將凱旋！"
 bftb_news.204.b: "真是糟糕的消息……"
 bftb_news.204.c: "此誠良機也……"
 bftb_news.204.d: "嘿，我們對此倒是略知一二！"
 bftb_news.205.t: "奧斯曼蘇丹國復辟"
 bftb_news.205.desc: "讓全世界感到焦慮不安的是，在經歷了宗教保守派和世俗凱末爾派的慘烈內戰後，奧斯曼蘇丹竟然重返了皇位。在舉行了一場猶如中世紀再現般的奢華登基大典後，蘇丹恢復了其曾經至高無上的地位，並將穆斯塔法·凱末爾·阿塔圖爾克所建立的共和國徹底送入了墳墓。\n\n[TUR.GetLeader]懷著驚喜而又謙遜的態度，向著他重生的蘇丹國發表了講話，宣告其重返舊日的皇位。儘管新蘇丹是位溫文爾雅的紳士，但他的宮廷當中卻充斥著好戰激進之徒。而那些從未設想過蘇丹復辟的專家們，眼下也已無法斷言未來的走向。"
 bftb_news.205.a: "讚美真主！"
 bftb_news.205.b: "噢不是吧，又來？！"
 bftb_news.205.c: "怎麼會這樣！？"
 bftb_news.205.d: "呵，真是有趣……"
 bftb_news.205.e: "令人稱奇。"
 bftb_news.206.t: "地中海盟約的成立"
 bftb_news.206.desc: "[ITA.GetLeader]和[TUR.GetLeader]日前宣佈成立名為“[TUR.GetFactionName]”的協約集團。儘管[ITA.GetLeader]信誓旦旦地認為該條約將以歐陸至強者的身份主導一切歐洲事務，但[TUR.GetLeader]卻以相當謹慎的措辭向諸國外交官保證，此盟約單純僅是戰略性的，其目的在於保障巴爾幹地區與地中海沿岸國家的安全。\n\n[ENG.GetAdjective]官員稱這一新興的地區性勢力集團“毫無用處，不受歡迎”，而[GER.GetAdjective]的觀察者以更地明確地做出定性：這一陣營不出十年就會淪為歷史車輪上毫不起眼的註腳。"
 bftb_news.206.a: "好耶——！"
 bftb_news.206.b: "簡直愚不可及！"
 bftb_news.206.c: "懦夫！豬玀！"
 bftb_news.206.d: "又一位競爭者加入了逐鹿。"
 bftb_news.206.e: "這對歐洲來說意味著什麼？"
 bftb_news.207.t: "[TUR.GetNameDefCap]承諾捍衛巴爾幹地區安全"
 bftb_news.207.desc: "[TUR.GetLeader]在今天向全世界發表公開講話時宣稱，[TUR.GetNameDef]將會保證巴爾幹地區所有睦鄰友好國家的獨立，以進一步拓展其以巴爾幹為中心的外交政策。對於國際觀察家而言，這展現出[TUR.GetNameDef]已經確立了更加明確的立場：即在減少與列強交往的情況下，專注於其地區安全事務。\n\n儘管[TUR.GetAdjective]的決議得到了部分人的讚揚，但對於其他人而言則可謂是極大的恐慌。尤其是[ITA.GetAdjective]官員已經就此作出了警告，請求[TUR.GetAdjective]政府放棄此立場，若他們還想最小化本地區衝突爆發可能性的話。而[TUR.GetAdjective]政府則對此將[ITA.GetNameDef]列為“地區敵對勢力”作為回應。"
 bftb_news.207.a: "此乃我國之天命。"
 bftb_news.207.b: "真是謝天謝地。"
 bftb_news.207.c: "事情變得棘手了。"
 bftb_news.207.d: "嗯……"
 bftb_news.208.t: "[TUR.GetNameDefCap]要求恢復1920年疆界"
 bftb_news.208.desc: "[TUR.GetNameDefCap]日前宣佈將執行[TUR.GetNameDef]此前通過的國家誓言決議，將國境線恢復至往日的態勢。為此，[TUR.GetAdjective]政府幾乎宣稱了其所有的鄰近地區，並且對撤回這些荒謬宣稱的呼籲置若罔聞。\n\n國際社會針對此項決議對[TUR.GetAdjective]當局大加譴責，同時也如同近幾年一樣，對[TUR.GetAdjective]領導層莽撞的行為可能誘發的世界範圍內的破壞表示了擔憂。[TUR.GetNameDefCap]看起來已然決意貫徹其復仇的道路，但也只有時間才能告訴我們其統治究竟將會產生怎樣的後果。"
 bftb_news.208.a: "我們可不能將自己牽扯到[TUR.GetAdjective]的計劃中。"
 bftb_news.208.b: "貿易禁運似乎就足夠應付了。"
 bftb_news.208.c: "這些戰爭販子！"
 bftb_news.208.d: "我們只想取回自己的法理所有物。"
 bftb_news.208.e: "他們只會讓事態惡化！"
 bftb_news.209.t: "圖蘭降世"
 bftb_news.209.desc: "看來，土耳其人對外征服所取得的進展已經讓土耳其政府認為是時候將其國家稱呼為[TUR.GetNameDef]了。這個嶄新帝國的降世著實震驚了世界，畢竟鮮有觀察家相信土耳其能夠在短短數十年的時間裡從獨立戰爭的創傷當中恢復——更毋寧說建立橫跨數個大陸的嶄新帝國了。\n\n如果報道所言屬實，那麼這個新近成立的[TUR.GetAdjective]可能仍然還處於其快速擴張的狀態當中，畢竟[TUR.GetLeader]宣稱在全世界所有的突厥人都得到解放前，其國家絕不會停下征服的腳步。眼下，全世界唯一能做的就是屏住呼吸，關注事態的進展。"
 bftb_news.209.a: "吾輩勢不可擋。"
 bftb_news.209.b: "怎麼會……？"
 bftb_news.301.t: "[GRE.GetAdjective]內戰爆發！"
 bftb_news.301.desc: "隨著希臘國王近日解散該國議會，一場忠於國王的勢力與忠於[GRE.GetNameDef]民主原則的共和-共產派勢力間的[GRE.GetNameDef]內戰已然爆發。儘管該國共和派和共產派彼此間也頗具敵意，但他們還是團結起來，竭力試圖推翻那位不得人心且試圖在整個[GRE.GetAdjective]倒行逆施的外國君主的暴政。\n\n[GRE.GetLeader]也作出了承諾，在將所有反君主勢力趕出這個國家前，無論是他本人還是效忠於他的君主派武裝均不會停止戰鬥。"
 bftb_news.301.a: "為了國王陛下！"
 bftb_news.301.b: "君主派的政權對我們而言更為有利……"
 bftb_news.301.c: "妙哉妙哉，爾等自相崩析罷！"
 bftb_news.301.d: "希臘尚還有轉機否？"
 bftb_news.302.t: "大希臘國家的成立"
 bftb_news.302.desc: "世界各國的觀察家針對於神秘的伊拉克利翁會議所作出的猜測或許可以到此為止了，因為在今天，[GRE.GetLeader]正式宣佈[GRE.GetAdjective]國家的大希臘偉夢已然實現。\n\n專家們著實驚訝於[GRE.GetNameDef]的快速擴張，畢竟此前他們曾援引政治動盪以及積重難返的經濟困境來試圖論證[GRE.GetAdjective]國家難以出現重大變革，然而最近發生的一系列事件顯然證明其大錯特錯。"
 bftb_news.302.a: "我們的理想終於實現了！"
 bftb_news.302.b: "我們通常不會縱容此等行徑，不過這次例外……"
 bftb_news.302.c: "這對他們而言不過是虛名！"
 bftb_news.302.d: "哇哦～"


