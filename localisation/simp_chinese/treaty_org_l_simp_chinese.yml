l_simp_chinese:
 treaty_org.1.t: "布魯塞爾條約"
 treaty_org.1.desc: "隨著迫在眉睫的全球威脅得到解決，[SOV.GetNameDef]與其西方盟國之間的鬆散盟約開始瓦解。\n\n[FROM.GetNameDef]懼怕雙方溝通聯絡徹底中斷與美蘇在歐洲的大國博弈——而最近在東德發生的事情證明了這點，於是在布魯塞爾舉辦的緊急會議上提出了一項互助條約。"
 treaty_org.1.a: "必須遏制來自東方的威脅"
 treaty_org.1.b: "我們不需要另一場戰爭……"
 join_brussels_treaty_tt: "我們會簽署布魯塞爾條約。"
 SOV_chose_NATO_neutrality: "選擇中立"
 SOV_joined_NATO: "簽署了布魯塞爾條約"
 NATO_brussels_treaty: "布魯塞爾條約"
 NATO_brussels_treaty_desc: "隨著迫在眉睫的全球威脅得到解決，[SOV.GetNameDef]與其西方盟國之間的鬆散盟約開始瓦解。"
 nato_decisions: "條約組織"
 brussels_to_has_already_happened: "布魯塞爾會議尚未召開"
 TO_will_be_invited_to_join_or_leave: "將選擇簽署條約或退出[ROOT.GetFactionName]。\n"
 TO_chose_neutrality: "中立的必要性"
 TO_chose_neutrality_desc: "一場風暴正在東西方之間醞釀。我們必須謹慎選擇立場。"
 TO_left_faction: "退出了[FROM.GetFactionName]。"
 TO_signed_brussels: "簽署了布魯塞爾條約"
 treaty_org.2.t: "布魯塞爾條約的簽訂"
 treaty_org.2.desc: "就像是為了提醒世界最糟糕的時刻還沒來臨一樣，一些前同盟國成員今天宣佈了在布魯塞爾簽訂的新條約。\n\n儘管該條約表面上是為了加強成員間的民生與軍事合作，大部分人都清楚這是一條寄給[SOV.GetNameDef]領導層和其盟友的信息。\n\n一些困於這種地緣政治緊張局勢之中的國家已藉機宣告了保持嚴格中立的理念。"
 treaty_org.2.a: "令人不安的發展"
 treaty_org.2.b: "無情的挑釁"
 NATO_form_nato_properly: "批准北大西洋公約組織"
 NATO_suggest_nato: "北大西洋公約計劃"
 NATO_suggest_nato_desc: "布魯塞爾條約的擴張是我們聯盟合乎邏輯的下一步。"
 treaty_org.3.t: "北大西洋公約組織"
 treaty_org.3.desc: "[USA.GetNameDef]與[FROM.GetNameDef]政府在經過期待已久的外交斡旋後，於昨晚宣佈了北大西洋聯合公約的成立。他們許諾將通過民生、軍事和情報合作維持一個充滿希望的時代，而[SOV.GetNameDef]的高層並不歡迎這樣的想法。\n\n和平，看來是轉瞬即逝。"
 treaty_org.3.a: "有意思"
 treaty_org.3.b: "真卑劣"
 treaty_org.4.desc: "[FROM.GetNameDef]政府在經過期待已久卻稍顯無力的外交斡旋後，於昨晚宣佈了北大西洋聯合公約的成立。他們許諾將通過民生、軍事和情報合作維持一個充滿希望的時代，而[SOV.GetNameDef]的高層並不歡迎這樣的想法。\n\n和平，看來是轉瞬即逝。"
 treaty_org.4.a: "有意思"
 treaty_org.4.b: "看上去和北大西洋沒什麼關係啊"
 TO_nato_ratified: "北大西洋公約"
 TO_nato_ratified_desc: "我們靠這紙條約共享資源和情報是情有可原的。"
 nato_not_suggested_yet: "北約尚未被提出"
 north_atlantic_treaty_org: "北大西洋公約組織"
 warsaw_pact: "華沙條約組織"
 NATO_have_warsaw_pact: "提出華沙條約"
 NATO_have_warsaw_pact_desc: "只有組織一個我們自己的集團，才是對布魯塞爾條約的有效回應。"
 treaty_org.5.d: "由於擔心陷入東方與西方進一步的衝突之中，[FROM.GetNameDef]宣佈了立刻脫離[ROOT.GetFactionName]的意向。站在他們的立場上，誰能指責他們呢？"
 treaty_org.5.t: "[FROM.GetName]選擇中立"
 treaty_org.5.a: "理解"
