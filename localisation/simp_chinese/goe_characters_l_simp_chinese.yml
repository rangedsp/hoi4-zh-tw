 IRQ_ghazi_i_desc: "加齊國王於1933年費薩爾一世去世後繼承了王位，儘管哈希姆王朝與英國存在著數十年的聯繫紐帶，但新國王卻以反對英國在伊拉克的影響而聞名於世。懷疑的輿論認為這位年輕的國王正伺機而動，意欲在武力驅逐英國人後，統領大軍盡收鄰近的諸多戰略要地。"
