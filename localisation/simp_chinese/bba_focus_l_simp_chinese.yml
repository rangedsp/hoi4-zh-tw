 ITA_bop_will_shift: "§Y權力平衡§!將向國家領導人移動。"
 ITA_novus_ordo_forts_tt: "在完全控制的利比亞地區邊境添加最多§Y10級陸上要塞§!。"
 ITA_novus_ordo_create_units_tt: "在擁有且控制的利比亞地區創建§Y[ROOT.GetFlag][ROOT.GetAdjective]§!單位："
 ITA_novus_ordo_irregular_troops_tt: "創建§Y5個$infantry$師§!。"
 ######################################################################
 ################     SWITZERLAND FOCUS TREE     ######################
 ######################################################################
 #########   Historical ####################
 SWI_swiss_guiding_principles: "瑞士指導原則"
 SWI_swiss_guiding_principles_desc: "[ROOT.GetNameDefCap]有大陸上最悠久的民主制度，然而，它正面臨被歐陸各處尋求變革的急促步伐踐踏的風險。我們應該延續由“宣誓同盟”和1848年憲法奠基的事業，還是踏上展現在我們面前的嶄新道路？"
 SWI_increase_defense_budget: "增加國防預算"
 SWI_increase_defense_budget_desc: "儘管我們設法在世界大戰中維持了我們的中立和主權，但現在還不是掉以輕心的時候。我們周圍的列強極有可能為了繞過他們之間的防禦工事而入侵我國，而我們現在的預算不足以預防此難。"
 SWI_national_defense_fund: "國防基金"
 SWI_national_defense_fund_desc: "國防需要的不僅是汗水和辛勞，以防萬一，我們還需資金用於進口裝備和原材料。設立並宣傳一個[ROOT.GetAdjective]公民能自願捐獻的基金可彌補軍事預算的增長，同時展現[ROOT.GetAdjective]人民參與國防的態度。"
 SWI_reaffirm_spiritual_defense: "重申精神防禦"
 SWI_reaffirm_spiritual_defense_desc: "作為對周遭逐漸增長的專制主義威脅的回應，自1932年開始，我們的聯邦就承諾保衛瑞士的國家觀念。現在，這種威脅比以往任何時候都更加顯眼，因此我們必須要從物質上和精神上重申保衛我們生活方式的誓言。"
 SWI_fortify_border_with_germany: "鞏固對德邊境"
 SWI_fortify_border_with_germany_desc: "[GER.GetNameDefCap]對[ROOT.GetAdjective]聯邦的生存構成了實質性威脅。如果[GER.GetName]和[FRA.GetName]爆發戰爭，[GER.GetAdjective]可從[ROOT.GetName]，或是[HOL.GetName]和[BEL.Getname]繞過設有重防的[FRA.Getname]邊境。我們可以在我國與[GER.GetNameDef]之間建造防禦工事來打消他們的念頭。"
 SWI_fortify_border_with_italy: "鞏固對意邊境"
 SWI_fortify_border_with_italy_desc: "[ITA.GetAdjective]擴張的野心隨時可能濺[ROOT.GetName]一身。畢竟我們人口中有一大部分說意大利語，只要[ITA.GetLeader]動動嘴皮子，[ROOT.GetName]就會被他們盯上了。必須讓他們看到我們可不是個軟柿子。"
 SWI_fortify_border_with_france: "鞏固對法邊境"
 SWI_fortify_border_with_france_desc: "儘管[FRA.GetName]奉持民主的價值觀且與我們保持長期的友好關係，我們也不能忽視他們為了偷襲[GER.GetNonIdeologyName]或[ITA.GetNonIdeologyName]而闖入[ROOT.GetAdjective]領土的可能性。"
 SWI_ban_foreign_nazi_propaganda: "查禁外國納粹宣傳"
 SWI_ban_foreign_nazi_propaganda_desc: "我們不能讓這種外國宣傳的媒介繼續運轉。由於納粹主義違背了[ROOT.GetAdjective]聯邦奉行的每一條價值觀，為了避免其從內部摧毀我們，即使我們是一個基於民主和包容建立的國家，也無法容忍納粹主義的存在。"
 SWI_buero_ha: "“哈”局"
 SWI_buero_ha_desc: "我們不能讓鄰國知道我們在蒐集他們的情報，所以我們必須靠半自主的情報機構從事我們的隱蔽行動。這就輪到轉職為間諜主管的攝影業商人，漢斯·豪薩曼登場了。他精簡而敏銳的情報處可以完成所有必須要做的事，同時不弄髒我們的手。 "
 SWI_federal_police: "聯邦警察情報部"
 SWI_federal_police_desc: "要是[ROOT.GetName]成功抵禦外敵，卻被內鬼搞垮就太蠢了。我們必須授權聯邦警察根除國境內的潛在威脅並抵禦外國影響。"
 SWI_spab_counter_intelligence_agency: "反間諜部"
 SWI_spab_counter_intelligence_agency_desc: "我們知道[GER.GetNameDef]在斯圖加特設立了一個叫做“全景屋”的訓練中心培訓第五縱隊破壞者。這就是為什麼我們要賦予聯邦警察一個反間諜部門應對這些威脅，打擊外國諜報和破壞行動。"
 SWI_armed_neutrality: "武裝中立"
 SWI_armed_neutrality_desc: "長期的中立已經成為[ROOT.GetAdjective]身份認同的一部分。但僅憑中立，是遠不足以讓主權得到保障的——想想在上次大戰中試圖保持中立的[BEL.GetNonIdeologyName]下場如何吧。對敵人最好的威懾，就是舉國上下都準備好拿起武器與侵略者抗爭到底。"
 SWI_promote_guisan: "提拔亨利·吉桑"
 SWI_promote_guisan_desc: "在聯邦陷入危機時，我們的政治體系允許推選一個將軍總司令解決燃眉之急。現在正是這種情形，而我們也有明確的人選：亨利·吉桑。他不僅是最有資格承擔這份工作的，更享有全[ROOT.GetNameDef]的廣泛支持。"
 SWI_national_redoubt: "國家堡壘"
 SWI_national_redoubt_desc: "亨利·吉桑提出了一個另闢蹊徑的[SWI.GetName]國防方案。相較於試圖不顧一切保衛我國邊境，我們可以戰略性放棄瑞士高原，並撤退到阿爾卑斯山脈中。憑藉山脈，我們將讓試圖侵吞我國的敵人付出慘痛代價。"
 SWI_expedite_mobilization: "快速動員"
 SWI_expedite_mobilization_desc: "我們少量的常備軍的職責是在[ROOT.GetName]民眾拿起武器組建公民民兵，也就是我們防衛力量的主體時擋住敵人。這就是為什麼我們要確保民眾能儘快做好準備，降低常備軍被擊潰的風險。"
 SWI_fortify_the_jura: "築防汝拉"
 SWI_fortify_the_jura_desc: "我們為築防阿爾卑斯地區做了許多準備，但我們還可以在汝拉山脈築防。儘管此地不像阿爾卑斯山脈一樣陡峭或易守難攻，但仍可以在我們進攻被敵人掌控的高原地區時作為第二戰線提供優勢。"
 SWI_rig_infrastructure_to_blow: "準備破壞基建"
 SWI_rig_infrastructure_to_blow_desc: "如果我們要放侵略者進入我們的國境，就不能把所有設施完好無損的交給他們。做好破壞設施的準備至關重要。敵人拿下的將是無法使用的基建，這將放緩他們的推進並迫使他們花費寶貴的資源用於修復。"
 SWI_emergency_industry: "緊急工業"
 SWI_emergency_industry_desc: "既然我們現在打算在敵軍入侵我國時摧毀我們自己的工業能力，我們就必須確保足夠擊退入侵者的備用產能。秘密隧道和工廠將遍佈我們的群山和峽谷之間，一些甚至將位於國境外。"
 SWI_flood_the_valleys: "水淹山谷"
 SWI_flood_the_valleys_desc: "我們預計將有大量侵略軍通過康斯坦茨湖附近的區域，這是設置水道和堤壩淹沒農田，讓侵入者動彈不得的完美地點。在他們嘗試穿越危險的沼澤時，我們就能趁機把所有的彈藥都傾瀉到他們頭上。他們將會對試圖入侵我們悔恨終身的。"
 SWI_defend_the_skies: "保衛天空"
 SWI_defend_the_skies_desc: "現代戰爭十分依賴制空和空中支援。[ROOT.GetName]還沒準備好應對這個新現實，所以我們必須讓每個州都準備從敵機中保衛他們的天空。"
 SWI_attack_from_the_mountains: "從群山中進攻"
 SWI_attack_from_the_mountains_desc: "在阿爾卑斯山脈和汝拉山脈中的據點扎穩腳步後，我們就能狠狠打擊駐紮在下方山谷的敵軍。我們要讓他們明白，在我們領土上多停留一分鐘，就意味著多一批物資損失和人員傷亡。"
 SWI_frontier_defense_plan: "邊境防禦計劃"
 SWI_frontier_defense_plan_desc: "如果讓敵人侵入我們的邊境，[ROOT.GetNameDef]就離亡國不遠了。我們的邊境無比神聖，我們的國家不能失去任何一寸土地。因此我們必須強化邊境防禦並做好保衛邊境的準備。"
 SWI_fight_until_death: "血戰到底"
 SWI_fight_until_death_desc: "我們幾乎沒有勝算，[ROOT.GetNAme]的兵員、裝備和準備都不足以應對當前的危機。這就是為什麼每個[ROOT.GetAdjective]公民都必須準備為了他們的州和聯邦而犧牲。 "
 SWI_total_defense: "全面防禦"
 SWI_total_defense_desc: "總體戰意味著我們需要總體防禦，如果每一支武裝力量時刻做好戰爭準備，並且能夠為了擊退侵略付諸一切，那麼我們還可以有一線生機。"
 SWI_the_army_position: "部隊就位"
 SWI_the_army_position_desc: "我們將把公民民兵和常備軍部署在[ROOT.GetName]邊境，因此他們需要防禦工事以提高他們擊退侵略者的能力。"
 SWI_prolonged_service: "延長服役時間"
 SWI_prolonged_service_desc: "我們目前的強制服役時長不足以應對長期戰爭，因此我們需要給予聯邦政府延長我們公民服役時間的手段，儘管這意味著犧牲些許自由。"
 SWI_enhanced_training: "改進訓練"
 SWI_enhanced_training_desc: "自上次[ROOT.GetName]處於衝突邊緣以來，戰爭已經發生了很大變化。我們必須升級並改善每個適役公民所得到的基礎訓練。他們是我國防衛最大的資本。"
 SWI_integrate_refugees_into_the_army: "將難民納入軍隊"
 SWI_integrate_refugees_into_the_army_desc: "作為法西斯戰爭狂潮中的一個和平與民主的避風港，許多人來到[ROOT.GetName]尋求庇護。一些人希望為打敗迫使他們背井離鄉的敵人貢獻一份力量，其中甚至有許多職業士兵。我們可以讓他們加入，為瑞士和更好的未來而戰。"
 SWI_expanded_military_support: "擴大軍事支持"
 SWI_expanded_military_support_desc: "我們的民兵力量不僅是由士兵組成的，他們還需要許多其他職位的協助，才能如同潤滑過的機器一般良好運作。如果我們想成功保衛[ROOT.GetName]，就需要為我們的民兵部隊招募、訓練並補充一些支援連。"
 SWI_all_adults_training: "所有成人接受訓練"
 SWI_all_adults_training_desc: "當今世界形勢不容許我們抱有僥倖。每一個能夠作戰的成年人都必須拿起武器對抗侵略者。瑞士是屬於我們所有人的，也應由我們所有人來保衛。"
 SWI_anti_tank_divisions: "反坦克單位"
 SWI_anti_tank_divisions_desc: "坦克是現代戰爭的先鋒，但我們的國土已經賦予我們對抗坦克的優勢。只要我們的軍隊裝備了反坦克炮，我們就可以撥開並削下這個矛頭。"
 SWI_reduce_military_training_age: "下調徵兵年齡"
 SWI_reduce_military_training_age_desc: "一般情況下，[ROOT.GetAdjective]公民在20歲開始軍事訓練，但是現在為了徵召足夠我們國家生存下去的部隊數量，我國公民將需要提前一年開始進行軍事訓練。希望提前一年就夠了。"
 SWI_veteran_sharpshooter_divisions: "精英神射手師"
 SWI_veteran_sharpshooter_divisions_desc: "成千上萬的精英神射手請求作為輔助部隊加入軍隊，以此為保衛祖國和民主制度獻上自己的一份力量。他們的經驗和熱情對我們的軍隊將是良好的助益。"
 SWI_fortify_ticino: "提契諾要塞"
 SWI_fortify_ticino_desc: "作為地處三個有好戰傳統國家之間的一箇中立國，任何一方都可能帶來滅亡，因此我們絕不能放鬆警惕。[ITA.GetName]與[GER.GetNameDef]和[FRA.GetName]一樣有可能進攻我們，而且他們一旦這麼做，[846.GetName]將是必經之路。這就是為什麼我們必須為了[SWI.GetNameDef]而把它建設成為一座堅不可摧的堡壘。"
 SWI_fortify_sargans_gotthard_and_st_maurice: "加強薩爾甘斯、聖哥達和聖莫里斯的防禦"
 SWI_fortify_sargans_gotthard_and_st_maurice_desc: "巍峨的阿爾卑斯山是[ROOT.GetName]的驕傲，在這段不安穩的歲月裡，我們可以將阿爾卑斯群山要塞化來幫助保衛我們聯邦的安全。"
 SWI_defend_against_paratroopers: "防禦空降部隊"
 SWI_defend_against_paratroopers_desc: "我們已經見識了空降部隊是如何繞過一切防禦工事的，他們可以讓一切準備都變得毫無意義。所以，在空降部隊對我們的工事造成嚴重破壞之前消滅他們是尤為重要的。"
 SWI_expand_special_forces: "擴編特種部隊"
 SWI_expand_special_forces_desc: "我們的常備軍雖然訓練有素，但是相比其他國家軍隊的規模還是不夠，這完全不足以支撐對[ROOT.GetName]的防禦。我們需要徵募更多的人來帶領[ROOT.GetAdjective]走向勝利！"
 SWI_purchase_german_planes: "[SWI_purchase_fascist_planes_name]"
 SWI_purchase_german_planes_default: "購買德國飛機"
 SWI_purchase_german_planes_alt: "向法西斯鄰國購買飛機"
 SWI_purchase_german_planes_desc: "鑑於我國只有一支過時的空軍，且缺少自主量產飛機的工業及科技，我們不得不從鄰國購買飛機。從[GER.GetName]購買我們所需的飛機不僅能滿足我們的裝備需求，還能保證我們同他們之間的良好關係。"
 SWI_ban_the_communist_party: "查禁瑞士共產黨"
 SWI_ban_the_communist_party_desc: "共產黨是[SWI.GetNameDef]的大敵。儘管我們和[SOU.GetNameDef]距離遙遠，但他們的革命影響力依然彌天。我們可不能在這種危機時刻讓我們國家處於險境，所以我們必須迅速行動，禁止任何試圖顛覆破壞我們政府的政黨。"
 SWI_withdraw_from_the_league_of_nations: "退出國際聯盟"
 SWI_withdraw_from_the_league_of_nations_desc: "我們在國際聯盟中的成員國資格開始與我們試圖保持[ROOT.GetName]中立的願望相排斥，所以拋棄這個過時的組織變得至關重要。這同樣會標誌著我們對鄰國的中立態度，希望他們不會將[ROOT.GetName]視為目標。"
 SWI_limited_censorship_of_the_press: "有限新聞審查"
 SWI_limited_censorship_of_the_press_desc: "垂涎[ROOT.GetName]的勢力會不擇手段地正當化對我們的入侵。新聞自由儘管對於健康的民主政治是重要的，但是現在必須屈尊一下，以保證我們不會給任何鄰國的野心鋪路。"
 SWI_tighten_press_censorship: "加強新聞審查"
 SWI_tighten_press_censorship_desc: "我們沒有容許錯誤的空間，一字之差就可能決定了聯邦的生存或毀滅。我們絕不能讓新聞自由危害我們的未來，必須像[?SWI.SWI_biggest_fascist.GetNameDef]要求的那樣牢牢把控新聞媒體。"
 SWI_seek_trade_agreement_with_germany: "與德國的貿易協定"
 SWI_seek_trade_agreement_with_germany_desc: "法西斯主義仍在可怕地崛起，儘管這也許如鯁在喉，允許一些經濟合作可能正是我們所需的，能讓他們把目光遠離我們。"
 SWI_axis_gold: "軸心國黃金"
 SWI_axis_gold_desc: "作為中立國，我們的市場依然向所有國家開放，這是我們可以利用的優勢。我們可以向[SWI_biggest_fascist.GetNameDef]開放我們的黃金市場，將兩國的經濟捆綁在一起，從而安撫他們並促進雙方的經濟。"
 SWI_spirit_of_resistance: "抵抗精神"
 SWI_spirit_of_resistance_desc: "[ROOT.GetName]人民的心靈與意志是我們生存之戰的最重要戰線。我們必須確保每位[ROOT.GetAdjective]公民都願意至死方休，即使是在看起來已經輸掉了一切的情況下。"
 SWI_pro_helvetia: "瑞士文化基金會"
 SWI_pro_helvetia_desc: "[ROOT.GetName]的精神防禦需要[ROOT.GetAdjective]的文化獨立並突出於我們鄰國的文化，同時不與之分割。瑞士文化基金會，這個新的組織將會保護並弘揚我們共有的，和我們的民主制度緊密聯繫的，在對抗壓倒性力量時保障我們生存的瑞士價值觀。"
 SWI_spirit_of_saint_bernard: "聖伯納德精神"
 SWI_spirit_of_saint_bernard_desc: "自古以來，我們就以自身的醫療傳統和向需求的人伸出援手而感到驕傲。大聖伯納德療養院與紅十字會就是證明。現在這種精神將被軍事化以適應我們的民兵，來強化我們的防禦力。"
 SWI_adopt_romansh: "採用羅曼什語"
 SWI_adopt_romansh_desc: "[ROOT.GetName]不是一個由[GER.GetAdjective]裔、[FRA.GetAdjective]裔和[ITA.GetAdjective]裔地區組成的，註定要被我們貪婪鄰國宣稱的國家。[ROOT.GetName]是一個獨立的、不可分割的多元文化國家。採用羅曼什語——一種只用於[ROOT.GetAdjective]阿爾卑斯山脈中的語言——作為官方語言後，我們將向他們表明，儘管使用相同的語言，我們的文化及價值觀與他們是截然不同的。"
 SWI_patriotic_shooting_clubs: "愛國射擊俱樂部"
 SWI_patriotic_shooting_clubs_desc: "[ROOT.GetName]擁有悠久的神射手俱樂部及比賽傳統。我國的一些業餘神射手比其他國家的職業狙擊手技藝更加精通。我們可以影響這些俱樂部，將它們整合進我們的民兵，增加我國的防禦力。"
 SWI_aktion_nationaler_widerstand: "全國抵抗運動"
 SWI_aktion_nationaler_widerstand_desc: "有一小群來自[ROOT.GetAdjective]社會各界的公民願意配合我們影響群眾。他們的目標是打倒失敗主義，鼓勵團結併為[ROOT.GetName]做好抵抗入侵的準備工作。"
 SWI_heer_und_haus: "軍隊與房屋"
 SWI_heer_und_haus_desc: "我們需要鼓勵瑞士之軍隊，亦即其人民發自內心地為保衛他們的家園而頑強抵抗、英勇奮戰。這就需要他們能以[ROOT.GetAdjective]方式思考和行動，從而認清危如累卵的現實。而獲得全國抵抗運動協助的瑞士文化基金會將發揮關鍵作用。"
 SWI_ortswehren: "地方警衛"
 SWI_ortswehren_desc: "全面戰爭意味著[ROOT.GetAdjective]的每個公民都必須隨時準備好保衛他們的家園，但不是每個人都能夠成為民兵。我們可以設立地區警察，輔助民兵保衛[SWI.GetName]。"
 SWI_luftschutz: "空襲防護"
 SWI_luftschutz_desc: "戰爭的法則已被改寫，天空將會是一片全新的戰場，決不能坐視其成為我們的阿喀琉斯之踵。我們必須設立由平民組成的地區防空部隊，併為其配備能夠探測並處理空中威脅的設備。如果敵人能夠輕易的飛躍山巒，那麼守衛山頭將毫無意義。"
 SWI_train_swiss_women: "訓練瑞士婦女"
 SWI_train_swiss_women_desc: "如果我們的國家需要武裝到牙齒，把一半人口排除在外真是荒謬至極。[ROOT.GetAdjective]婦女也需要參加訓練以為我們的生存而戰。"
 SWI_ban_national_movement_for_switzerland: "禁止瑞士國民運動"
 SWI_ban_national_movement_for_switzerland_desc: "法西斯主義者就像是蟑螂一樣，躲藏在社會的角落與裂隙之中，他們以我們的疏忽為食，並逐漸壯大到我們無法與之對抗。這種情況到此為止了！他們面貌與名稱上的拙劣偽裝將再也無法欺騙我們，我們必須立刻出擊，捍衛我們的民主。"
 SWI_fortify_austrian_border: "鞏固對奧邊境"
 SWI_fortify_austrian_border_desc: "既然現在奧地利也落入潛在敵人的手中，我們不能冒險把這塊側翼放空，讓敵人在戰時有機可乘。就像同[GER.GetNonIdeologyName]的邊界那樣，我們必須加強這一前線的防禦工事。"
 SWI_seek_allied_trade: "尋求同盟國貿易"
 SWI_seek_allied_trade_desc: "我國周邊群狼環伺，為了生存我們必須確保和同盟國的重要交易。如果我們足夠幸運，我們還可以避免因和他們的敵人貿易而觸怒鄰國。"
 SWI_case_north: "北方預案"
 SWI_case_north_desc: "我們不能排除與[?SWI.SWI_biggest_fascist.GetNameDef]發生戰爭的可能，我們必須做好準備。我們需要起草計劃、調撥補給、挖掘工事並武裝士兵。"
 SWI_freeze_german_assets: "凍結德國資產"
 SWI_freeze_german_assets_desc: "多年以來[?SWI.SWI_biggest_fascist.GetNameDef]一直利用我們的中立態度和銀行系統中的漏洞來保全他們非法獲得的財產並保持經濟的繁榮。道德責任須優先於絕對的中立，即便我們知道這定會產生不利影響。"
 SWI_fund_resistance_groups: "資助抵抗組織"
 SWI_fund_resistance_groups_desc: "幾個世紀以來到現在，歐洲各國都在互相殺伐，並奴役了其他大陸上的人民。[ROOT.GetAdjective]有責任幫助因歐洲戰火不休而受傷的世界各地的人民。我們將提供打破枷鎖的工具，幫助他們決定自己的命運。"
 SWI_citizen_supply_mandate: "全民儲備令"
 SWI_citizen_supply_mandate_desc: "我們不知道一場入侵會如何展開，即使我們能依靠一個集中化的補給網絡，那也和我們的指揮結構不相容。這就是為什麼每個[ROOT.GetAdjective]家庭必須在家中儲存至少2個月的補給，這既是為他們，也是為當地民兵。"
 SWI_prepare_infrastructure_and_industry: "準備基礎設施和工業"
 SWI_prepare_infrastructure_and_industry_desc: "國防並不是僅僅依靠建造要塞和堡壘，我們同樣需要加強在阿爾卑斯山脈的基礎設施以提高運送部隊和民用物資的效率，同時還需要在瑞士高原擴建工業基地以進一步發展。"
 SWI_build_up_military_readiness: "加強軍事準備"
 SWI_build_up_military_readiness_desc: "強化瑞士公民準備的工作永遠不會結束。在被入侵的威脅消失前，我們一刻也不能放鬆——而這種狀態可能要永遠持續下去。我們必須立刻引導我國轉向防禦戰備戰。"
 SWI_support_active_militias_continuous_focus: "支援在役民兵"
 SWI_support_active_militias_continuous_focus_desc: "我們的公民已全副武裝並被部署到地方民兵部隊，其他人的職責就是盡最大努力支持他們，這樣我們才能阻擋聯邦的敵人。"
 SWI_rig_infrastructure_to_blow_TT: "當一個我們的核心地區被敵人奪取時，所有§Y基礎設施§!、§Y鐵路§!、§Y補給中心§!和§Y要塞§!將完全受損。§Y軍用§!和§Y民用工廠§!將會部分受損。"
 SWI_create_anti_tank_template_TT: "創建一個§Y瑞士反坦克民兵§!編制"
 ##### Submit to Germany #####
 SWI_closer_ties_with_germany: "與[SWI_get_fascist_neighbor_cap]交好"
 SWI_closer_ties_with_germany_desc: "在我們的北方有一位強大且危險的鄰居。如果想保全我們的國家，與他們之間保持良好的關係也許是一個不錯的主意。所以接近他們以改善關係，並同時保持我方的中立立場是至關重要的。"
 SWI_panoramaheim_branch: "“全景屋”"
 SWI_panoramaheim_branch_desc: "許多第五縱隊特工受訓於斯圖加特一幢被稱為“全景屋”的房子，他們的目的是動搖[ROOT.GetAdjective]政府，從而為法西斯主導的政權打開大門。"
 SWI_the_national_front: "國民陣線"
 SWI_the_national_front_desc: "國民陣線是[ROOT.GetNonIdeologyName]法西斯主義黨派的領頭羊，只有他們有可能在這個傾向民主的國家掌權。一些高級成員早已和[GER.GetNameDef]有緊密聯繫，因此如果戰爭爆發，我們應該能得到他們某些程度的保護。"
 SWI_infiltrate_federal_police: "滲透聯邦警察"
 SWI_infiltrate_federal_police_desc: "聯邦警察根除外國宣傳和非民主影響力的使命，讓它成為了滲透並保護我方派系免遭清算的理想地點。這也終將讓我們能以國家安全的名義清除我們的敵人。"
 SWI_the_petition_of_the_200: "200人請願書"
 SWI_the_petition_of_the_200_desc: "[ROOT.GetAdjective]各法西斯主義和專制主義政黨的200名成員向聯邦議會提交了這份請願書，以自保的名義請求我們開始接受[GER.GetNameDef]並與其合作。"
 SWI_case_west: "西方預案"
 SWI_case_west_desc: "我們必須準備好應對任何可能出現的狀況。[FRA.GetName]對我們來說是和[GER.GetNameDef]一樣的威脅，必須對其進行有針對性的處理。我們必須讓軍隊和國家準備好與[FRA.GetAdjective]作戰，否則[ROOT.GetNonIdeologyName]就面臨著滅亡的風險。"
 SWI_german_industrial_investments: "[SWI_get_fascist_neighbor_adjective]工業投資"
 SWI_german_industrial_investments_desc: "[?SWI.SWI_biggest_fascist.GetNonIdeologyName]的工業實力不容置疑。如果我們想在即將來臨的戰爭中倖存，我們就需要一個自己的工業基礎作為籌碼。[?SWI.SWI_biggest_fascist.GetNameDefCap]在我國的投資也意味著他們將有理由保持[ROOT.GetNonIdeologyName]的完整。"
 SWI_complete_siegfried_line: "補全齊格菲防線"
 SWI_complete_siegfried_line_desc: "[GER.GetNameDefCap]為防禦[FRA.GetName]建造了一套令人稱奇的防禦工事，而考慮到我國與[GER.GetNonIdeologyName]如此親近，我們也有理由為法國進攻做好準備。因此我們必須與德國協同，建造一條補全性的堡壘群。"
 SWI_military_exercises_with_germany: "與[SWI_get_fascist_neighbor]聯合軍演"
 SWI_military_exercises_with_germany_desc: "儘管[SWI_get_fascist_neighbor]生來就對我們傳統的民主價值觀抱有惡意，他們仍可能成為一個我們自衛時有價值的盟友。更重要的是這將降低他們入侵我們的可能性。"
 SWI_abandon_neutrality: "放棄中立政策"
 SWI_abandon_neutrality_desc: "歐洲各國都在選邊站，我國不能處在這樣尷尬的孤立無援的地位。顯然唯一的解決方法就是放棄我們傳統的中立政策，並尋求[SWI_get_fascist_neighbor]的保護。不這麼做，我們很可能陷入進退維谷的境地。"
 SWI_promote_tobler: "推選托布勒"
 SWI_promote_tobler_desc: "作為法西斯政黨在[ROOT.GetAdjective]議會中的唯一成員，以及國民陣線的領導人，羅伯特·托布勒是領導[ROOT.GetNonIdeologyName]逐漸從一個多元民主制國家，轉變為一個由[SWI_get_fascist_neighbor_adjective]盟友鐵拳統治的國家的顯而易見的候選人。這當然也意味著要開除羅爾夫·亨納的黨籍，畢竟一山不容二虎。"
 SWI_promote_henne: "推選亨納"
 SWI_promote_henne_desc: "作為法西斯主義與對[SWI_get_fascist_neighbor]合作的狂熱擁護者，羅爾夫·亨納是領導國民陣線，並讓[ROOT.GetName]成為[SWI_get_fascist_neighbor_adjective]附庸國，從而獲取包括安全保障在內的諸多益處的一個優秀候選人。這當然也意味著要開除羅伯特·托布勒的黨籍，因為他不願意付出這些代價。"
 SWI_propagandize_swiss_military_tradition: "宣傳瑞士軍事傳統"
 SWI_propagandize_swiss_military_tradition_desc: "現在可不是懷念我們過往民主的時候了。必須著眼於我們那傳統武德；[ROOT.GetAdjective]步兵和弩手向來以其紀律和高效而著稱，併成為了全世界夢寐以求的僱傭兵。如果我們想要在即將來臨的戰爭面前生存下來，必須要提醒人民他們有著悠久的軍事歷史。"
 SWI_ban_democratic_party: "查禁民主黨派"
 SWI_ban_democratic_party_desc: "我國的民主黨派極可能破壞我國與[SWI_get_fascist_neighbor]的接觸，如果我們想要繼續靠攏他們，我們就必須進行幾年前不敢設想的事：查禁民主政黨。如果這是達成目標必要的犧牲，那我們也只能接受。"
 SWI_centralize_switzerland: "瑞士集權化"
 SWI_centralize_switzerland_desc: "我們正在轉向的[ROOT.GetNonIdeologyName]意識形態相比過去近一個世紀以來的瑞士聯邦天差地別。我們將不再作為聯邦存在，而是一個集權化的國家。權力將從中央開始，逐級向大眾分配。"
 SWI_german_military_collaboration: "[SWI_get_fascist_neighbor_adjective]軍事合作"
 SWI_german_military_collaboration_desc: "我軍要想在當今世界發展壯大，就必須積累可觀的戰爭經驗，而這正是我們的軍隊所缺少的。好在我們可以依賴[?SWI.SWI_biggest_fascist.GetName]的幫助，其軍事力量不容小視，與他們合作將極大地增強我們的自衛能力，甚至讓我們可以先發制人攻擊其他國家。"
 SWI_join_the_axis: "加入軸心國"
 SWI_join_the_axis_desc: "就這樣吧，這是我們在即將到來的風暴中為保全[ROOT.GetNonIdeologyName]進行的一場賭博。我們將在[?SWI.SWI_biggest_fascist.GetName]領導的陣營的旗幟下加入到風暴之中。希望我們做出了正確的決定。"
 SWI_become_german_puppet: "成為[SWI_get_fascist_neighbor_adjective]傀儡"
 SWI_become_german_puppet_desc: "亨納所做的一切都是為了此刻。從某種意義上來講，這是[ROOT.GetNonIdeologyName]版的德奧合併。儘管這意味著失去長期以來的主權，但我們可能會分到一杯羹。我們只能希望這不意味著我們的毀滅。"
 SWI_ask_for_vorarlberg: "討要[848.GetName]"
 SWI_ask_for_vorarlberg_desc: "我們已經在[?SWI_fascist_overlord.GetName]的統治下一段時間，並證明了我國的忠誠，是時候讓宗主把本就屬於我們的領土託付給我們了。[848.GetName]在[ROOT.GetNonIdeologyName]還是民主邦聯時就通過了加入我國的公投，他們一定也會願意加入現在的我們。"
 SWI_size_and_opinion_chance_tooltip: "\n他們將基於我們軍隊的§Y規模§!和他們對我們的§Y評價§!做出決定。"
 SWI_request_austrian_occupation: "請求佔領[AUS.GetAdjective]"
 SWI_request_austrian_occupation_desc: "吞併[848.GetName]顯然不是[ROOT.GetNonIdeologyName]最終的目標。我們可以向[?SWI_fascist_overlord.GetName]證明我們可以管理更大的區域，以此減少他們的負擔並幫助[ROOT.GetFactionName]成為更高效的戰爭機器。"
 SWI_request_italian_alps_occupation: "請求佔領[ITA.GetAdjective]"
 SWI_request_italian_alps_occupation_desc: "我國部分地區由使用[ITA.GetAdjective]語的公民組成，因此我們有能力平穩地接管[ITA.GetName]，並利用當地的人力與資源補充結束戰爭所需的開銷。"
 SWI_request_french_alps_occupation: "請求佔領[FRA.GetAdjective]"
 SWI_request_french_alps_occupation_desc: "[FRA.GetNonIdeologyName]世代以來都在覬覦著我們的土地，而根據目前的處境，且為了雙方的未來考量，我們應當接管他們的領土。"
 SWI_the_alpine_supremacy: "阿爾卑斯的霸主"
 SWI_the_alpine_supremacy_desc: "[SWI.GetNonIdeologyName]再也不是那個在外交領域溫和中立的國家了。現在世人應當尊稱我們為阿爾卑斯的霸主，以彰顯我們對於阿爾卑斯地區、當地民眾以及其它層面的絕對主權。"
 SWI_professionalize_militias: "民兵專業化"
 SWI_professionalize_militias_desc: "時局的變換已經表明，一支由預備役組成的鬆散民兵遠遠不能滿足需求。為了迎接即將到來的衝突，我們需要訓練所有體質合格者，並將他們打造成令人望而生畏的專業軍隊。"
 SWI_modernize_airforce: "現代化空軍"
 SWI_modernize_airforce_desc: "很顯然現代戰爭可不僅僅是由戰地上的戰鬥所主導的，還有在戰場上方的，在那我們需要防衛和主宰的廣袤天空中。"
 SWI_swiss_airplane_designs: "瑞士飛機設計"
 SWI_swiss_airplane_designs_desc: "用於制霸天空的機器不能依靠我們的鄰居來提供，因為我們不應相信他們會乖乖地向我們提供用於擊敗他們的工具。"
 SWI_license_axis_plane_designs: "軸心國飛機設計許可"
 SWI_license_axis_plane_designs_desc: "我們進入天空的最快方法就是向法西斯國家採購飛機設計。只有他們掌握了最新的空戰經驗，這就意味著只有他們才真正清楚影響空戰勝敗的關鍵因素。向他們採購飛機還有助於增進我們之間的關係，打消對方入侵的念頭。"
 SWI_airspace_surveillance: "監視天空"
 SWI_airspace_surveillance_desc: "我們如果想保衛[ROOT.GetName]，就必須時刻監視著敵人在空中的蹤跡。有了新技術的幫助，我們就能夠發現敵軍，並將其暴露在我方戰機與防空炮組成的交叉火力網中。 "
 SWI_professionalize_militias_TT: "所有§YSwiss Citizen Militia§!陸軍師將成為§Y正規步兵§!陸軍師，同時禁用§Y$SWI_military_readiness_decisions_category$§!決議。"
 SWI_neutrality_decisions_disabled_TT: "§Y$SWI_absolute_neutrality_decisions_category$§!將不再可用。"
 SWI_has_fascist_neighbor_trigger_TT: "有合適的法西斯主義鄰國"
 SWI_crack_down_on_dissent: "鎮壓異己"
 SWI_crack_down_on_dissent_desc: "在我們社會產生一個小小的裂痕就可能導致[ROOT.GetAdjective]政府崩潰的時候，[ROOT.GetNonIdeologyName]絕不能解體。"
 SWI_military_police: "憲兵隊"
 SWI_military_police_desc: "我們歷史悠久的聯邦制度在這前途未卜的時代是不足以維持我們所需要的秩序的。如果我們希望人們保持團結，就需要設立憲兵隊。"
 SWI_expand_federal_police_intelligence: "擴張聯邦警察情報局"
 SWI_expand_federal_police_intelligence_desc: "潛藏在陰影裡的敵人可能會以任何形式現身，甚至會扮成我們的民眾。這就是為什麼聯邦警察情報局必須要有方法碾碎這些異議者，無論他們身藏何處。"
 SWI_martial_law: "戒嚴令"
 SWI_martial_law_desc: "應付某些情況需要手術刀一般的細緻和精準，不過此時非彼時，[ROOT.GetNameDef]需要的是一把既能抵禦外敵，又能制服國民的重錘。"
 ####### Weapons Industry Sub Branch #######
 SWI_expand_weapons_industry: "發展武器工業"
 SWI_expand_weapons_industry_desc: "我們貧弱的軍事工業的能力不足以支撐一場全面戰爭。現代戰爭由最後耗盡彈藥的人取勝，所以我們必須確保我們能更快、更持久地製造戰爭裝備。"
 SWI_swiss_armored_divisions: "瑞士裝甲師"
 SWI_swiss_armored_divisions_desc: "一直以來，我們以擁有傑出的步兵部隊為榮，但這不足以對抗敵人的裝甲巨獸。我們必須製造我們自己的機械怪獸。"
 SWI_alpine_specialization: "山地戰專精"
 SWI_alpine_specialization_desc: "我們可以藉助遠勝於其他任何國家的高山傳統，來訓練一隻獨一無二的、在山地攻守自如的、勢不可擋的部隊。他們將成為消滅敵人的雪崩。"
 SWI_tank_development: "發展坦克"
 SWI_tank_development_desc: "我們不能在發展和改進新型坦克上落後，否則我們將會在無用並且過時的鐵烏龜上浪費過多的鋼鐵。"
 SWI_mechanized_support: "機械化支援"
 SWI_mechanized_support_desc: "我們的士兵需要更快地到達戰場，且獲得所需的支援，否則所有機會都將白白浪費。"
 SWI_artillery: "瑞士炮兵"
 SWI_artillery_desc: "讓炮彈在我們進軍時如雨點般傾瀉到敵人頭上吧。炮兵會用彈雨粉碎敵人，讓[ROOT.GetNonIdeologyName]以最有效的方式在山地防守或者向前進軍。"
 SWI_industrial_production: "工業生產"
 SWI_industrial_production_desc: "我們不能忽視在國土內的另一個前線。[ROOT.GetNonIdeologyName]各州中的每個有勞動能力的人都必須願意獻身於我們的戰爭機器中。"
 SWI_swiss_heavy_planes: "瑞士重型飛機"
 SWI_swiss_heavy_planes_desc: "如果我們有一些可以調派的重型飛機，我們就可以從位於[ROOT.GetNonIdeologyName]的基地，發起一些深入敵方腹地的襲擊，但我們得先設計好這些飛機。"
 SWI_air_research: "空軍研究"
 SWI_air_research_desc: "如果我們想要跟上敵人前進的腳步，並最終統治天空，我們就必須在最新空軍科技上有所發展和進步。"
 SWI_air_production: "空軍生產"
 SWI_air_production_desc: "設計出能飛行的飛機只是解決問題的第一步。下一步則是製造出足夠多的飛機，讓我們的飛行員能隨時進入天空，與地面和空中的敵人交戰。"
 SWI_mountaneer_paratroopers: "山地傘兵"
 SWI_mountaneer_paratroopers_desc: "[ROOT.GetNonIdeologyName]的壯麗山峰舉世聞名，我們的許多人民亦將大山看作自己的家鄉。我們可以利用這個優勢來訓練一些精英傘兵，他們可以從敵人的空域上空降，並把[ROOT.GetNameDef]的旗幟插到外國山峰上。"
 ####### Allied/Aggrocratic #######
 SWI_purchase_american_planes: "[SWI_purchase_democratic_planes_title]"
 SWI_purchase_american_planes_usa: "購買美國飛機"
 SWI_purchase_american_planes_other: "從民主國家購買飛機"
 SWI_purchase_american_planes_desc: "我們缺乏足夠的飛機和先進的空軍科技，使得我們難以有效保衛我們天空。所以我們必須從別的地方獲取優秀的飛行器。[SWI_purchase_american_planes_second_paragraph]"
 SWI_american_planes_desc_usa: "如果我們要從別的國家購買飛機，有著民主傳統，相對中立並有著傑出的航空工業的[USA.GetNameDef]會是一個理想的賣家。"
 SWI_american_planes_desc_other: "因為我們不能因一些飛機就放棄我們的民主原則，所以從另一個民主國家來獲得這些飛機是很重要的，而[?SWI.SWI_best_dem_ally.GetNameDef]似乎就是一個極好的選擇。 "
 SWI_allied_gold: "與同盟國貿易黃金"
 SWI_allied_gold_desc: "當今的世界局勢充斥著混亂無序與條約制裁，這使得使黃金貿易日益減少、愈發艱難，但憑藉我們的中立立場，我們與其他民主國家的黃金貿易也許可以增加，從而促進民主國家的經濟，遏制法西斯主義。"
 SWI_closer_democratic_ties: "民主紐帶"
 SWI_closer_democratic_ties_desc: "由於專制主義的陰雲逐漸籠罩歐洲，我們或許難以獨善其身，但是我們可以通過與其他民主國家合作的方式來制止專制主義的擴張。第一步則是要尋求與民主國家們的更緊密的聯繫並且為他們提供我們可以為此奉獻的東西。"
 SWI_connect_to_the_maginot_line: "連接馬奇諾防線"
 SWI_connect_to_the_maginot_line_desc: "戰爭之風已經從[FRA.GetName]的方向刮來了。法國的敵人有很大可能會從所謂馬奇諾防線的方向進攻，但這也將我們帶入了一個危險的境地，因為[?SWI.SWI_biggest_fascist.GetNonIdeologyName]可能會試圖侵略我們，以從我們的方向繞開馬奇諾防線。因此，我們必須和[FRA.GetName]合作來構建一道聯合防線。"
 SWI_american_industrial_investments: "美國工業投資"
 SWI_american_industrial_investments_desc: "上次大戰已經表明[USA.GetAdjective]的工業實力使得他們有能力會按他們的想法改變戰爭的態勢。如果我們和他們聯繫，並從他們手中得到一些工業投資，我們就能夠提升我們的國際地位，並確保捍衛我們的獨立是他們的利益所在。"
 SWI_take_a_stance: "擺明立場"
 SWI_take_a_stance_desc: "法西斯[?SWI_biggest_fascist.GetNonIdeologyName]有著最令人作嘔且卑鄙的政治體系。[?SWI_biggest_fascist.GetNameDefCap]是新[SWI.GetName]不共戴天的敵人；這就是為什麼我們必須表明立場，並盡一切努力捍衛我們的民主。"
 SWI_join_france: "加入法國"
 SWI_join_france_desc: "儘管[ROOT.GetName]和[FRA.GetName]間的關係並不是一直那麼友好，但我們擁有共同的民主價值觀，甚至說著相同的語言。因此如果我們在即將來臨的衝突中必須選邊站的話，尋求他們的保護顯然比其他選擇更為可取。"
 SWI_the_second_helvetic_republic: "赫爾維蒂第二共和國"
 SWI_the_second_helvetic_republic_desc: "回顧1798年，臭名昭著的獨裁者拿破崙·波拿巴征服了[ROOT.GetName]並建立了赫爾維蒂共和國，作為奴役我們人民的工具。幸運的是，那些日子結束了，並且我們可以確信這次能和我們的老鄰居組建一個更公平的聯盟。"
 SWI_alpine_aspirations: "高山之願"
 SWI_alpine_aspirations_desc: "[ROOT.GetNonIdeologyName]的中央政府已經擴大併成長為赫爾維蒂共和國了，我們現在有能力管理更多的地區。我們應該向[FRA.GetNameDef]請求擴大我們的控制區，讓我們向將阿爾卑斯地區統一在一面旗幟下的願望邁進。"
 SWI_support_allied_espionage: "支持盟軍間諜活動"
 SWI_support_allied_espionage_desc: "我們維持中立外交政策的事實，並沒有禁止我們暗中支持其他民主國家對抗歐洲的法西斯主義。實際上，我們的中立地位和鄰近[?SWI.SWI_biggest_fascist.GetNameDef]的地理位置，使我們成為國際反法西斯鬥爭中的重要環節。"
 SWI_expand_spy_networks: "拓展間諜網"
 SWI_expand_spy_networks_desc: "敵人窺伺於外，我們必須邁出域外，從而在危險到來之前防禦我們的邊境和家園。我們的諜報網可以作為防禦的基礎，在國外以中立和不顯眼的姿態進行工作。"
 SWI_share_spy_networks: "分享間諜網"
 SWI_share_spy_networks_desc: "[?SWI.SWI_best_dem_ally.GetNameDefCap]和我們有相同的目標，即遏制法西斯主義的擴張，並且我們不需要對抗[?SWI.SWI_biggest_fascist.GetNameDef]就能實現目標。[ROOT.GEtName]有一些經驗豐富的特工能潛入[GER.GetAdjective]、[ITA.GetAdjective]和[FRA.GetAdjective]社會中；我們可以將這些利刃借給[?SWI.SWI_best_dem_ally.GetNonIdeologyName]。"
 SWI_secret_pact_with_the_allies: "與同盟國的秘密條約"
 SWI_secret_pact_with_the_allies_desc: "[ROOT.GetName]並沒有為全面戰爭甚至是公開加入某個陣營做好準備，但我們可以確信，沒有朋友就難以保障我們的安全。為了在突然襲擊中保衛我們的民主，我們可以和[?SWI.SWI_best_dem_ally.GetNameDef]秘密會談，達成一些協議。我們會承諾秘密地協助他們，並開始準備加入戰爭，作為交換，他們會在我們受到攻擊時保障我們的安全。"
 SWI_oasis_of_democracy: "民主綠洲"
 SWI_oasis_of_democracy_desc: "民主的敵人環繞著[ROOT.GetName]，所以在這個混亂的時代，我們必須堅定我們的價值觀。[ROOT.GetName]和他的民主不可分割，所以為了保衛我們國家的地位而捨棄我們的民主的做法是不可接受的。"
 SWI_oasis_of_democracy_tt: "當國策§Y$SWI_axis_gold$§!已經並且至少有§Y1§!個法西斯主義國家擁有精神§Y$SWI_gold_trade$§!："
 SWI_volunteer_force: "志願軍"
 SWI_volunteer_force_desc: "我們暫時沒有處於戰爭之中，但是[ROOT.GetAdjective]已經準備好為民主而戰。我們不能背叛中立，也不能背叛民主，我們不能控制人們前往哪裡，或者他們在哪戰鬥，所以我們需要私下鼓勵他們拿起武器對抗暴政，做好準備為剩下的[ROOT.GetName]公開地加入鬥爭之中。"
 SWI_export_saboteurs: "派出破壞者"
 SWI_export_saboteurs_desc: "我們如果能夠在內部破壞敵人，就不用加入戰爭了。我們機敏的特工可以改善我們的行動效率，以更好地鼓動敵佔區的抵抗運動，在他們的權力結構上慢慢鑿出小洞，使其千瘡百孔。"
 SWI_lay_the_groundwork: "奠定基礎"
 SWI_lay_the_groundwork_desc: "為了應對一場全面戰爭，我們首先需要一個好的基礎。[ROOT.GetName]的基礎設施和交通系統必須接受現代化改進。只有這樣，我們的公民才能被高效地送往前線。"
 SWI_arsenal_of_the_alps: "阿爾卑斯山兵工廠"
 SWI_arsenal_of_the_alps_desc: "陡峭的山峰、經過強化的工事以及我們熟知的地形，使得阿爾卑斯山脈成為顯著增強並在我們需要後撤時保障軍事生產能力的完美地點。"
 SWI_thunder_in_the_valleys: "山中雷霆"
 SWI_thunder_in_the_valleys_desc: "我們在先前的山地作戰中，並沒有考慮運用裝甲單位，但是如果我們想要進攻，或者在敵人進軍到我們陣地之前先擊潰敵人，就必須在裝甲單位的開發上加快腳步。"
 SWI_fighting_for_the_hills: "為群山而戰"
 SWI_fighting_for_the_hills_desc: "在過去的日子裡，步兵始終是我們軍事力量中最重要的部分。儘管[ROOT.GetNonIdeologyName]常常以步兵為傲，但我們已經將近一個世紀沒有打仗了，所以重新審視我們的步兵科技和學說至關重要。"
 SWI_fly_over_the_mountains: "飛越群山"
 SWI_fly_over_the_mountains_desc: "我們的群山高聳入雲，亙古如斯，但在這個時代我們必須學會超越自然。將戰場延伸至敵人的天空已然成為當前最為迫切的戰略重點。"
 SWI_weapons_of_democracy: "民主武器"
 SWI_weapons_of_democracy_desc: "在敵人做出難以想像的行動之前，我們必須做好一切必要的準備以阻止他們，哪怕這意味著用無差別攻擊的大規模殺傷性武器送我們的敵人下地獄。這樣做顯然會阻止他們犯下更多戰爭暴行。"
 SWI_jump_into_action: "立即行動"
 SWI_jump_into_action_desc: "在十年前還不可想像，但如今已成現實的是，[ROOT.GetNameDef]已經做好了公開投入一場戰爭的準備。我們已經為一場前所未見的全面戰爭準備好了我們的基礎設施，工業基礎和科研機構。[ROOT.GetAdjective]的戰爭機器正在轟鳴，隨時準備好出發。"
 SWI_exiled_government: "流亡政府"
 SWI_exiled_government_desc: "儘管我們做出了巨大的努力，我們沒能保衛我們的家園，我們只剩下流亡並假以時日從遠方歸來奪回家鄉的選擇。[ROOT.GetAdjective]的民主價值觀是支撐我們奮鬥如此之久的關鍵，並也將會指引我們奪回家園。畢竟，[ROOT.GetName]不是由它的領土或者居民所說的語言來定義的，而是由我們的相互尊重和支持。"
 SWI_join_the_allies: "加入同盟國"
 SWI_join_the_allies_desc: "為保持中立而作出的物質犧牲和道德妥協正變得令人無法接受。特別是考慮到當下歐洲的政治局勢，目前已再也沒有保持中立的餘地了。儘管同盟國並不完美，但如果想保護我們的土地和聯邦，加入他們仍然是最好的選擇。這確實是一個前所未有的時刻。"
 SWI_gotthardbund_party_name: "聖哥達同盟"
 SWI_gotthardbund_party_name_long: "聖哥達同盟"
 SWI_the_alpine_confederation: "阿爾卑斯聯邦"
 SWI_the_alpine_confederation_desc: "我們偉大的國家已經將版圖擴大到了歷史上的邊境之外，而且新加入我們旗下的各州會獲得同蘇黎世州一般的地位，我們必須承認我們作為阿爾卑斯地區控制者的新處境。一個新的民主勢力將會崛起：阿爾卑斯聯邦！"
 SWI_the_alpine_confederation_chance_TT: "\n他們將基於我們軍隊的§Y規模§!和他們對我們的§Y評價§!決定是否准許我們獨立，以及給予我們額外的阿爾卑斯領地。"
 SWI_gotthard_union: "聖哥達同盟"
 SWI_gotthard_union_desc: "黨派主義和互相爭吵的時代結束了。是時候讓[ROOT.GetNonIdeologyName]統一在一個有著絕對權威，能做出果斷決策的民主政權之下了。所有這一切都是為了我們[ROOT.GetAdjective]的傳統和價值觀的留存。堅決抵抗，取得勝利！"
 SWI_press_for_vorarlberg: "聲索福拉爾貝格"
 SWI_press_for_vorarlberg_desc: "當[AUS.GetAdjective]政府混亂不堪時，我們必須實現[848.GetName]在1919年全民公投中提出的民主願望，並將他們整合進我們的民主國家中。保護他們免受法西斯主義和專制主義侵害是[ROOT.GetNameDef]的義務。"
 SWI_pre_empt_anschluss: "先制合併奧地利"
 SWI_pre_empt_anschluss_desc: "有一些小道消息說[GER.GetNameDef]試圖以[GER.GetAdjective]統一的名義吞併[AUS.GetName]。這是[ROOT.GetNAmeDef]不會容許的，並且這可能會使[GER.GetNameDef]有理由對我們以德語為主要語言的州做出相同宣稱。我們必須加快速度做好保衛所有[AUS.GetName]的準備。"
 SWI_pre_empt_anschluss_tt: "§Y如果[AUS.GetNameDef]接受，我們將獲得其所有核心地區的核心§!\n\n他們將基於我們軍隊的§Y規模§!、他們對我們的§Y評價§!以及§Y[GER.GetNameDef]是否準備§!吞併[AUS.GetName]做出決定。"
 SWI_demand_italian_alps: "索取意屬阿爾卑斯"
 SWI_demand_italian_alps_desc: "幾十年以來，[ITA.GetName]無恥地聲索著我們講意大利語的各州。既然他們能如此行事，我們當然有權利要求他們的阿爾卑斯山區加入我們民主的社會。畢竟，它們與提契諾屬於[ITA.GetNameDef]一樣，理應屬於[ROOT.GetNameDef]。"
 SWI_demand_french_alps: "索取法屬阿爾卑斯"
 SWI_demand_french_alps_desc: "[FRA.GetNameDef]在內部和外部的壓力下崩潰只是時間問題。我們必須為了保衛阿爾卑斯山地區採取先發制人的態度，否則危險的敵人將會佔領易於防守的位置，並將其作為進攻的墊腳石。"
 SWI_alpine_redoubt: "阿爾卑斯堡壘"
 SWI_alpine_redoubt_desc: "只要我們有著能夠依靠的堅固陣地，我們就能成為對抗侵略者的勢不可擋的力量。我們必須使阿爾卑斯山地區更加堅不可摧，並從那裡來擴大我們的影響力，只有這樣，無論敵人在哪裡我們都能保持和他們的距離。"
 SWI_the_alpine_protectorate: "阿爾卑斯保護國"
 SWI_the_alpine_protectorate_desc: "直到今天，從來沒有一個政權能統一阿爾卑斯地區。有了聯合起來的力量，我們可以和任何威脅對抗，擴大防線至阿爾卑斯山以外，有著我們的山峰作為堅不可摧的要塞，我們在那裡作出的指揮亦如山一般堅定。 "
 SWI_bring_democracy_to_germany: "為德國帶來民主"
 SWI_bring_democracy_to_germany_desc: "第三帝國現在已然與民主漸行漸遠。曾經的魏瑪共和國也不過是那些一戰勝利國任意擺佈的傀儡，舊時[GER.GetNonIdeologyName]的好戰政權更只是為了皇帝那貪婪慾望所培育的溫床。現在，是時候告訴北方的朋友們“何為民主”。"
 SWI_liberate_italy: "解放意大利"
 SWI_liberate_italy_desc: "幾個世紀以來[ROOT.GetNonIdeologyName]目睹著大量的城邦和小國在南方互相征伐，並最終統一於一個脆弱的君主制國家。而將[ITA.GetNonIdeologyName]從專制主義和法西斯主義的枷鎖中解放出來是他們的古老同胞應該做的。"
 SWI_take_over_france: "保護法國"
 SWI_take_over_france_desc: "[FRA.GetNonIdeologyName]一直以來都是個變化不斷的國家，國內的動盪持續不斷，革命帶來的究竟是軟弱的民主亦或者是軍國主義就像是拋硬幣一樣隨機。而在[ROOT.GetAdjective]的保護下，[FRA.GetAdjective]的人民可以在我們穩定的民主制度下安居樂業。"
 SWI_the_new_eidgenossenschaft: "新宣誓同盟"
 SWI_the_new_eidgenossenschaft_desc: "在13世紀，三個州的領導人結下了永遠聯合的條約，這便是我們如今所稱的瑞士聯邦。現在是時候修訂這個條約，以便我們可以擴張並使更多州加入我們的民主聯邦之中。"
 SWI_expand_the_confederation: "擴展聯邦"
 SWI_expand_the_confederation_desc: "沒有國家能在極權主義的快速崛起下保持安全，我們周圍國家的很多地區都可以從我國長期的中立傳統中受益，而如果戰爭爆發，我國強大的防禦能力將會是安全的保障。"
 SWI_empower_the_council: "賦權議會"
 SWI_empower_the_council_desc: "我們的周圍危機四伏，如果我們內部依然紛爭不斷，那麼當危險襲來時我們將毫無還手之力，而敵人將會把[ROOT.GetName]從地圖上抹去。強而有力的集權中央政府將是在此等動盪不安之時的唯一齣路。"
 SWI_switzerland_on_the_offense: "主動出擊"
 SWI_switzerland_on_the_offense_desc: "我們不能蜷縮在我們的山巒上坐以待斃。我們必須主動出擊，在敵人入侵之前將戰火燒到他們那邊去。只有這樣我們才能確保[ROOT.GetNameDef]的生存不受威脅。畢竟，進攻就是最好的防禦。"
 SWI_neutral_entente: "中立協約"
 SWI_neutral_entente_desc: "我們不是世界上唯一奉行中立的國家，由於好戰國家所引發的戰爭風險有損於我們置身於衝突之外的願景，我們必須對他們形成更多的威懾。我們必須建立所有中立國家之間的互助體系，這意味著對任一中立國的宣戰將導致與所有中立國的戰爭。"
 SWI_plains_warfare: "平原作戰"
 SWI_plains_warfare_desc: "[ROOT.GetName]軍隊擁有大量在峽谷、山脈、丘陵和森林中訓練的機會，但如果要在他國的土地上作戰，我們就必須適應現代化的戰爭學說。我們已經見識了高速移動的機械化步兵如何衝開防線並迅速取勝，我們可以學習他們的戰術並讓[ROOT.GetAdjective]軍隊步入現代化。"
 SWI_multipurpose_tanks: "多功能坦克"
 SWI_multipurpose_tanks_desc: "就像我們為步兵配備的多功能軍刀一樣，我們同樣需要能夠填補任何空缺並完成各項作戰任務的機械。我們在坦克作戰方面仍需進步和追趕，所以我們必須發展各個領域才能擁有一支全能的部隊。"
 SWI_rolling_fortresses: "機動堡壘"
 SWI_rolling_fortresses_desc: "我們的坦克可以成為我們機動防禦學說的一部分，他們也是保衛我們群山的最前線。如果敵人無法突破我們強化過的前線，那麼他們就沒有辦法入侵我們的國土。"
 SWI_extended_supply_lines: "拓展補給線"
 SWI_extended_supply_lines_desc: "在一個注重快速進攻與長期作戰的世界中，後勤補給比以往的任何時刻都更為重要，伴隨著我們的努力，戰爭離我們的祖國越來越遠，對更新更好的物資補給線的需求逐漸增大。我們必須學會如何改善我們的後勤能力以便我們延長我們的補給線，並加快建造新補給線的速度。"
 SWI_dissolve_the_federal_council: "解散聯邦委員會"
 SWI_president_for_life: "終身主席"
 SWI_president_for_life_desc: "聯邦委員會在歐洲國家中是獨一無二的存在，它很好地治理了和平時期的[ROOT.GetNonIdeologyName]，但很明顯，[?SWI.SWI_confederation_president.GetName]才是統領著整個委員會和國家的人，我們有充足的理由來讓[?SWI.SWI_confederation_president.GetHerHis]的統治無限期延續下去，讓其成為穩定[ROOT.GetNameDef]的支柱。 "
 SWI_guisans_coup: "吉桑政變"
 SWI_guisans_coup_desc: "在[?SWI.SWI_confederation_president.GetName]的領導下，我們偉大而和平的國家陷入了戰爭和苦難之中。這不再是我們熟悉並熱愛的[ROOT.GetNonIdeologyName]，他已被自衛的名義腐蝕了。唯有一個知名且有足夠能力的領袖能夠一勞永逸的結束這場戰爭，並使這個曾經中立的國家溯本清源，那就是——亨利·吉桑。"
 SWI_return_to_the_old_switzerland: "迴歸舊日"
 SWI_return_to_the_old_switzerland_desc: "隨著戰事接近尾聲，我們終於可以讓[ROOT.GetNonIdeologyName]回到從前的樣子；一個以相互尊重與獨立自決的原則為立國之本的民主中立國。當戰爭結束，我們將採取措施重塑我們的民主與中立。"
 SWI_a_swiss_navy: "瑞士海軍"
 SWI_a_swiss_navy_desc: "自[ROOT.GetAdjective]有史以來，我們第一次擁有了海岸線。這意味著我們可以在海洋上作戰了，但是也意味著我們有了一條新的戰線需要防禦。我們必須要盡力來為[ROOT.GetName]打造一支海軍。"
 SWI_buy_foreign_surplus_ships: "購買外國盈餘艦船"
 SWI_buy_foreign_surplus_ships_desc: "有時候，一些海軍強國的盈餘艦艇就足以成為其他國家急需的海軍。許多世界級海軍強國都擁有滿是新式艦船的艦隊，這意味著那些老式艦船已經接近過時，但維護成本仍然居高不下。如果我們想快速建立自己的海軍力量，那麼將沒有比購買淘汰艦船更合適的選擇了。"
 SWI_swiss_ship_designs: "瑞士艦船設計"
 SWI_swiss_ship_designs_desc: "我們在設計與製造適航戰艦方面經驗尚淺，但我們越早起步，就越早能在[ENG.GetNameDef]和[ITA.GetName]等老牌海軍強國中站穩腳跟。"
 SWI_submarine_raiders: "深海奇兵"
 SWI_submarine_raiders_desc: "就任由那些舊時代的海軍強權們為自己的大堆鋼鐵而沾沾自喜吧。當他們在水面上野蠻的對轟時，我們的潛艇從水下發起悄無聲息的攻擊，削弱乃至摧毀他們老舊而又衰敗的海軍力量。"
 SWI_floating_fortresses: "浮動堡壘"
 SWI_floating_fortresses_desc: "我們知道該怎麼建設堡壘來保衛我們的山川與河谷，而現在當務之急，是將它們延伸到海岸乃至海洋上。我們的海軍將會變得堅不可摧。"
 SWI_naval_industry: "海軍工業"
 SWI_naval_industry_desc: "即使在我們新獲得的海岸線上仍然存在一些遺留下來的海軍工業，但我們仍必須抓緊時間對其進行全面發展，將其變為一個統一協調的生產框架，並維護一支真正強大的瑞士海軍。"
 SWI_naval_industry_tt: "在每個沿海地區添加§G1個§!建築位和§Y1座海軍船塢§!。（最多10個）"
 SWI_build_naval_bases: "建設海軍基地"
 SWI_build_naval_bases_desc: "我們佔領的海軍基地還遠遠不夠，且我們目前還無法以足夠快的速度建設我們所需的新基地。為了實現我們的海軍理想，我們必須付出更大的努力。"
 SWI_build_naval_bases_tt: "在每一個已經存在§Y海軍基地§!的沿海地區添加§Y1座海軍基地§!。（最多15個）"
 SWI_train_navy_staff: "訓練海軍將士"
 SWI_protect_liechtenstein: "保護列支敦士登"
 SWI_protect_liechtenstein_desc: "列支敦士登這個地處我們三個州夾縫之間的小國需要我們的保護來協防當地人民，畢竟他們沒有對抗包括我軍在內的任何外國軍隊的能力。我們可以通過佔領他們的領土來為其提供協助，他們也可以加入我們的盟誓並作為新的州並進聯邦。"
 SWI_train_navy_staff_desc: "一支海軍的基礎不僅僅由鋼筋混凝土構成，它還需要一群富有勇氣且訓練有素的男女同胞們在海洋上帶來勝利。 "
 SWI_reduce_militia_activation_time_TT: "全面動員我們的§Y公民民兵§!所需的時間減少§G$RIGHT|0$§!日"
 SWI_generic_fascist_neighbor_cap: "我們的法西斯鄰國"
 SWI_generic_fascist_neighbor: "我們的法西斯鄰國"
 SWI_secret_pact_with_allies_TT: "我們將在陷入戰爭的時候立刻加入他們的陣營。"
 SWI_neutral_entente_faction: "中立協約"
 SWI_militias_turned_into_regulars: "公民民兵已實現職業化"
 SWI_old_switzerland_TT: "\n§Y當戰爭結束時：§!\n"
 SWI_viable_fascist_in_europe: "存在合適的歐洲§Y法西斯國家§!"
 #Horn of Africa
 HOA_develop_capitalstate: "開發[Root.Capital.GetName]"
 HOA_develop_capitalstate_desc: "我們需要加快工業化的進程，藉此改善民生並加強對[ROOT.GetNameDef]的保護。因此，我們將在[ROOT.Capital.GetCapitalVictoryPointName]周邊地區開展投資，將其打造為國家的工業核心。"
 HOA_the_state_bank_of_name: "[ROOT.GetNameDef]國家銀行"
 HOA_the_state_bank_of_name_desc: "通過擴大[ROOT.GetNameDef]中央銀行可用的資源，我們可以為人們提供一種新的信貸制度，併為陷入困境的[ROOT.GetAdjective]經濟打上一劑強心針。"
 HOA_pave_the_roads: "鋪設道路"
 HOA_pave_the_roads_desc: "目前跨[ROOT.GetNameDef]的人員與貨物運輸效率太低。投資我們的公路不僅有利於經濟，更加便於運輸的軍事裝備也有助於保障我們的安全。"
 HOA_the_steam_locomotive: "蒸汽機車"
 HOA_the_steam_locomotive_desc: "雖然汽車與卡車在短距離運輸或者貨物較少的情況下表現出色，但火車在運輸大量貨物和人員的時候有著遠超前者的效率。投資我們的鐵路網絡將為我國的經濟發展打下一劑強心針。"
 HOA_the_adjective_regional_development_fund: "[ROOT.GetAdjective]地區發展撥款"
 HOA_state_owned_industry_tt: "§Y$ETH_state_development_dynamic_modifier$§!追加效果：\n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$：§G+15%§!\n$MODIFIER_LOCAL_BUILDING_SLOTS$：§G+15%§!"
 HOA_the_adjective_regional_development_fund_desc: "[ROOT.GetNameDef]的某些地區發展停滯且急需投資。通過設立地方發展基金，我們可以確保地方政府擁有進行現代化所需的工具。"
 HOA_the_adjective_industrial_fund: "[ROOT.GetAdjective]工業撥款"
 HOA_the_adjective_industrial_fund_desc: "[ROOT.GetNameDefCap]的工業化嚴重落後。如果我們想要改善人民的生活並保護他們免受外部侵略的威脅，就必須要迅速實現我國的工業化。"
 HOA_exploit_national_resources: "開採國有資源"
 HOA_exploit_national_resources_desc: "[ROOT.GetNameDefCap]蘊含著豐富的自然資源等待開發。只需一點點的投資，我們就能夠開始對其的開發利用。"
 HOA_support_the_agrarians: "支持農民"
 HOA_support_the_agrarians_desc: "[ROOT.GetNameDef]農村中從事農業的人民們是國家的堅實支柱。因此，我們應該為他們所做的重要工作提供更多的支持。"
 HOA_support_the_agrarians_tt: "§Y$ETH_state_development_dynamic_modifier$§!追加效果：\n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$：§G+10%§!\n$MODIFIER_LOCAL_BUILDING_SLOTS$：§G+10%§!"
 HOA_promote_local_crafts: "推廣本地工藝品"
 HOA_promote_local_crafts_desc: "[ROOT.GetNameDefCap]擁有大量熟練的手藝工匠，他們的小型作坊產出了諸多商品。我們應該利用好他們的專攻術業，併為他們擴充產能提供便利。"
 HOA_use_the_natural_harbors: "使用天然良港"
 HOA_use_the_natural_harbors_desc: "隨著我們近期對沿海地區土地的收購，我們將有機會建立自己的港口，這將顯著的提升我國與國際市場之間的聯繫。且有利於商品的進出口，對我們的經濟有著極大的幫助。"
 HOA_the_capital_city_airport: "[Root.Capital.GetCapitalVictoryPointName]機場"
 HOA_the_capital_city_airport_desc: "航空運輸增強了世界上的城市和全球經濟間的聯繫。我們應該建立自己的機場以跟上這個潮流。"
 HOA_a_steamboat_fleet: "汽輪艦隊"
 HOA_a_steamboat_fleet_desc: "為了保衛我們的海岸線和航線，我們需要建立一支能夠威懾外國侵略者的岸防艦隊。"
 HOA_improved_irrigation_systems: "改進灌溉系統"
 HOA_improved_irrigation_systems_desc: "如果沒有強大的糧食生產能力，我們就無法保障我們國家的安全。為了提高糧食產量，我們需要投資耕地大規模灌溉項目。"
 HOA_improved_irrigation_systems_tt: "§Y$ETH_state_development_dynamic_modifier$§!追加效果：\n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$：§G+15%§!\n$MODIFIER_LOCAL_BUILDING_SLOTS$：§G+15%§!"
 HOA_the_adjective_air_fleet: "[ROOT.GetAdjective]航空隊"
 HOA_the_adjective_air_fleet_desc: "空戰正迅速成為決定衝突勝負的關鍵。因此，我們必須建立屬於自己的空軍，並隨時準備好保衛[ROOT.GetNameDef]的天空。"
 HOA_state-funded_projects: "國家投資項目"
 HOA_state-funded_projects_desc: "我們的經濟由於缺乏基礎設施以及工業能力而停滯不前。為了減輕這種狀況，我們將在[ROOT.GetNameDef]各地大力投資新型項目。"
 HOA_the_grand_university_of_capital: "[Root.Capital.GetCapitalVictoryPointName]大學"
 HOA_the_grand_university_of_capital_desc: "將知識代代相傳對任何國家的安全和發展都至關重要。因此，我們需要在[ROOT.Capital.GetCapitalVictoryPointName]建立一所新的知名大學來更好地教育我們下一代的科學家，歷史學家和藝術家。"
 HOA_the_adjective_armed_forces: "[ROOT.GetAdjective]武裝部隊"
 HOA_the_adjective_armed_forces_desc: "隨著大國之間的關係愈發緊張，整個世界正在變得越發不穩定。如果我們想保持獨立自主，[ROOT.GetAdjective]的軍隊就必須做好戰爭的準備。"
 HOA_warrior_tradition: "戰士傳統"
 HOA_warrior_tradition_desc: "[ROOT.GetNameDefCap]的戰士們從征服者手中保家衛國，已有著悠久的歷史。現在我們比任何時候都需要復興這種傳統，來保衛我們的祖國。"
 HOA_strengthen_the_irregulars: "強化非正規軍"
 HOA_strengthen_the_irregulars_desc: "非正規軍和徵召制度在過去的幾個世紀一直穩定運行。沒有理由改變這已被證明是行之有效的方法。"
 HOA_every_man_a_warrior: "全民皆兵"
 HOA_every_man_a_warrior_desc: "如果[ROOT.GetNameDef]想要成功抵禦外國侵略者，我們就必須推行軍事化社會，確保每個人都能在國防需要的時候拿起武器。"
 HOA_names_finest: "[ROOT.GetName]最優秀的將士"
 HOA_names_finest_desc: "我們的軍隊很清楚，他們是阻止我國淪為外國勢力附庸的最後屏障。在明確了這一點後，將士們將堅定不移地保衛祖國並維護[ROOT.GetAdjective]的自由。"
 HOA_utilize_our_strengths: "揚長避短"
 HOA_utilize_our_strengths_desc: "雖然我們軍隊和別的國家相比，也許顯得不是那樣的龐大或正規，但它有著大量能在戰場上發揮作用的非常規知識。"
 HOA_reform_the_conscription: "改革徵兵制度"
 HOA_reform_the_conscription_desc: "隨著全球局勢日漸緊張，是時候擴大徵兵計劃來應對任何形式的外國威脅。"
 HOA_eyes_on_the_imperialists: "時刻警惕帝國主義者"
 HOA_eyes_on_the_imperialists_desc: "在此地盤踞的帝國主義勢力對[ROOT.GetNameDef]的獨立自主不屑一顧。我們必須時刻保持警惕，防止淪為他們狼子野心下的犧牲品。"
 HOA_encourage_local_arms_production: "鼓勵本地武器生產"
 HOA_encourage_local_arms_production_desc: "如果我們不能為我們的軍隊提供需要的裝備，則他們將無法為國家提供足夠的保護。因此，我們必須擴大軍工業的產能。"
 HOA_metal_beasts: "金屬野獸"
 HOA_metal_beasts_desc: "很明顯，裝甲單位將在戰場上扮演越來越重要的角色，我們的軍隊必須學會如何最好地利用和對抗它們。"
 HOA_the_roars_of_thunder: "雷霆咆哮"
 HOA_the_roars_of_thunder_desc: "有時在戰場上毀滅敵人的唯一方法便是使用壓倒性的火力，而釋放這種火力的最有效方法是使用火炮。"
 HOA_develop_indigenous_models: "發展本國設計"
 HOA_develop_indigenous_models_desc: "過度依賴外國設計的步兵裝備將使我們有技術落後的危險。只有通過增強本國的小型武器開發領域的專業知識，才能夠妥善解決這種安全風險。"
 HOA_the_steel_lions: "鋼鐵雄獅"
 HOA_the_steel_lions_desc: "靜態戰爭的時代已經過去，是時候把我們自己的專業裝甲部隊部署到戰場上並開始學習機動作戰的方法了。"
 HOA_warfare_from_afar: "遠方炮火"
 HOA_warfare_from_afar_desc: "炮兵一次又一次地證明了它們在戰場上的價值。我們需要將專業的炮兵更緊密地整合入我們的步兵師中以更好地利用他們。"
 HOA_modern_infantry: "現代步兵"
 HOA_modern_infantry_desc: "我們的軍事改革已經在改進效率的路上取得了不錯的進展。我們應該通過增加部署的部隊數量來擴大這一進展。"
 HOA_the_first_album: "[ROOT.GetNameDefCap]"
 HOA_the_first_album_desc: "隨著強權之間的緊張程度逐步加劇，世界變得愈發危險，但這也不失為那些有備而來的國家打開國門的時機。"
 HOA_a_loyal_subject: "忠誠的屬國"
 HOA_a_loyal_subject_desc: "隨著世界局勢愈發緊張，尋求某一強權的保護也許對我們來說會更好，至少目前如此……"
 HOA_political_stability: "穩定政局"
 HOA_political_stability_desc: "一旦兄弟鬩牆，我們就不可能再指望維繫一個獨立的國家，若想不被席捲世界的變革之風所吹倒，我們唯一的選擇只有建立統一戰線。"
 HOA_the_capital_railroad: "[Root.Capital.GetCapitalVictoryPointName]鐵路"
 HOA_the_capital_railroad_desc: "通過連接鄰國與我國的鐵路網絡，我們可以改善貨物與資源的出口，並有望藉此促進我國的經濟發展。"
 HOA_invite_foreign_settlers: "邀請外國移民"
 HOA_invite_foreign_settlers_desc: "我國距實現現代化還長路漫漫，我們應該鼓勵那些無知的殖民者遷至[ROOT.GetNameDef]，以便利用其技術。"
 HOA_countryleader: "[ROOT.GetLeader]"
 HOA_countryleader_desc: "唯有[ROOT.GetLeader]可以維繫國家團結以熬過這段艱難歲月，因此全國人民必須緊密追隨[ROOT.GetLeader.GetHerHim]。"
 HOA_securing_the_adjective_future: "保障[ROOT.GetAdjective]的未來"
 HOA_securing_the_adjective_future_desc: "[ROOT.GetNameDefCap]在世界舞臺上不過是個友邦寥寥無幾的小國，改善這一情況將會為鞏固我國未來的自由與獨立起到很大幫助。"
 HOA_improving_the_educational_system: "改善教育體系"
 HOA_improving_the_educational_system_desc: "少年強則國強，因此為我國的孩子們提供最好的教育或許將有益於保障[ROOT.GetNameDef]的未來。"
 HOA_construct_great_monuments: "修建大紀念碑"
 HOA_construct_great_monuments_desc: "[ROOT.GetAdjective]人民有著許多值得驕傲的事情，我們應該通過修建紀念碑來銘記我國悠久的歷史，這將激勵人們向上拼搏。"
 HOA_the_adjective_volunteer_force: "[ROOT.GetAdjective]志願軍"
 HOA_the_adjective_volunteer_force_desc: "另一片大陸上的小規模邊境衝突將有可能引發一場席捲世界的巨大災難。我們必須盡我們所能，在這些星星之火成燎原之勢之前將它們撲滅。"
 HOA_military_cooperation: "軍事合作"
 HOA_military_cooperation_desc: "雖然我們已經極大的改善了我們的武裝力量，但我們依然可以通過聯合演習與強化軍事合作的方式來學習我們的國際盟國。"
 HOA_that_which_is_rightfully_ours: "我們本該擁有的東西"
 HOA_that_which_is_rightfully_ours_desc: "[ROOT.GetNameDefCap]是它過去存在的一個投影。歷史證明了我們的祖先曾經支配著的土地遠超我國現政府所管理的大小，但大部分都在幾代人的時間裡被人奪走。現在是時候奪回本該屬於我們的東西了。"
 HOA_commandos: "特種部隊"
 HOA_commandos_desc: "有時候，由一小群訓練有素的士兵在敵後進行的作戰，往往能取得比戰場上龐大的軍隊更為輝煌的勝利。"
 HOA_a_jagged_alliance: "鐵血聯盟"
 HOA_a_jagged_alliance_desc: "雖然我們與其他國家的意見經常發生分歧，但我們的確經常面對相同的威脅。專注於這些共同存在的問題將能夠成為長久聯盟與強化國家安全的基石。"
 HOA_observe_and_learn: "觀察與學習"
 HOA_observe_and_learn_desc: "戰爭形態通常由於科技的進步和思想的創新而發生進化。為了保持軍隊的強勁，我們必須認真研究戰爭，永遠不能停下發展的腳步。"
 HOA_foreign_investors: "外國投資者"
 HOA_foreign_investors_desc: "如果我國想繁榮起來，則需要對工業和基礎設施的投資。幸運的是，並不缺少想要通過投資獲利的外國人。"
 HOA_research_exchange_programmes: "研究交換項目"
 HOA_research_exchange_programmes_desc: "我們的工業急需現代化，通過設立交換項目，我們可以從外國學到有關如何在我國工廠中最大化地利用新的技術進步的知識。"
 HOA_foreign_trained_officials: "外國專業顧問"
 HOA_foreign_trained_officials_desc: "我們仍然能夠從外國專家那裡學到大量的專業知識。是時候賦予他們在我國的權威地位並利用他們的知識了。"
 HOA_countryadjective_loyalist_advisors: "忠於[ROOT.GetAdjective]的顧問"
 HOA_countryadjective_loyalist_advisors_desc: "我們不能放任我們的國家和文化被帝國主義所同化。我們必須授予那些忠於[ROOT.GetNameDef]的人們權威的地位，並以此為起點，開始重新奪回屬於我們的自由。"
 HOA_lay_claim_to_the_danakil: "宣稱達納基爾"
 HOA_lay_claim_to_the_danakil_desc: "在沒有保護好北方的達納基爾地區的情況下，敵人的登陸作戰將一直是[ROOT.GetNameDefCap]的心頭大患。"
 HOA_push_for_the_highlands: "向高原進軍"
 HOA_push_for_the_highlands_desc: "東非的經濟核心大多位於高原上。確保對其掌控將極大提升[ROOT.GetNameDef]的經濟潛力。"
 HOA_secure_the_ogaden: "保護歐加登"
 HOA_secure_the_ogaden_desc: "確保歐加登地區的安全將在我們和潛在的侵略者之間構築一系列天然屏障，同時也能開放我們的經濟，以便進行跨印度洋的貿易。"
 HOA_rallying_the_adjective_people: "團結[ROOT.GetAdjective]的人民"
 HOA_rallying_the_adjective_people_desc: "世界已然陷入戰火之中。我們暫時的自由與慘遭征服的深淵之間的僅有的一道屏障，就是[ROOT.GetAdjective]的人民們為國奮戰的意志。團結是我們生存的唯一希望，而分裂則會將我們帶向毀滅。"
 HOA_the_capital_school_of_technology: "[Root.Capital.GetCapitalVictoryPointName]科技學院"
 HOA_the_capital_school_of_technology_desc: "幾年前在戰場上與工廠裡仍屬先進的科技，現如今卻已經被認為是完全過時的了。如果我們想要跟上新技術發展的腳步，就必須投資下一代人的教育。"
 HOA_promote_countryadjective_nationalism: "鼓動[ROOT.GetAdjective]民族主義"
 HOA_promote_countryadjective_nationalism_desc: "[ROOT.GetNameDef]的人民將不再忍受外國勢力的壓迫。我們必須抓緊時間推進我們的獨立計劃。"
 HOA_crowning_of_the_negusa_nagast: "加冕萬王之王"
 HOA_crowning_of_the_negusa_nagast_desc: "隨著我們迅速地成為這一地區的主導力量，現在是時候接受我們的角色並將我們的領導人推舉為萬王之王。所有人都必須團結在[ROOT.GetLeader.GetHerHim]周圍，否則將直面我們的怒火。"
 HOA_control_ethiopia_tt: "控制所有的埃塞俄比亞領土"
 HOA_proclaim_east-african_hegemony: "宣稱東非霸權"
 HOA_proclaim_east-african_hegemony_desc: "非洲之角動盪已久的局勢只有在我們至高無上的皇帝[ROOT.GetName]統治下才能夠穩定下來。統一這一地區的時候到了。"


