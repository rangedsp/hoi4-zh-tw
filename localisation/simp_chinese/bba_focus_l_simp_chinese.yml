 ITA_monarchia_d_italia: "意大利君主制"
 ITA_monarchia_d_italia_desc: "維托里奧-埃馬努埃萊國王從來不應該將意大利政治開放給法西斯主義。是時候亡羊補牢，讓法西斯分子滾到政府後排去了。"
 ITA_new_corporations: "新社團主義"
 ITA_new_corporations_desc: "我們必須接納先前法西斯政權所用的社團思想，將其改造為符合我們新政府需求的理論。"
 ITA_extraction_industry: "採掘工業"
 ITA_extraction_industry_desc: "我們必須擴大資源開採業來滿足生產線的需求。我們不能允許軍事生產因為原材料的匱乏而受到影響。"
 ITA_prepare_for_the_coming_wars: "準備下一場戰爭"
 ITA_prepare_for_the_coming_wars_desc: "我們的身邊已經出現了迫在眉睫的戰爭風險，我們需要擁有強大的軍工業來滿足我們軍隊的需求。"
 ITA_mobilize_the_railway_guns: "啟用列車炮"
 ITA_mobilize_the_railway_guns_desc: "非常時刻當用非常武器，是時候重新啟用舊列車炮進戰場了。"
 ITA_bring_back_old_glories: "重拾往昔榮光"
 ITA_bring_back_old_glories_desc: "我們的各個港口中都停著大量等待拆解的舊艦船。一些工程師和海軍軍官認為只需要一點調整改造，我們就能讓這些舊日的榮耀再次出動。"
 ITA_new_forms_of_weaponry: "新型武器"
 ITA_new_forms_of_weaponry_desc: "如果意大利想要成為世界上最強大的軍事強權之一，我們就必須探索新的武器形式。我們的科學家們相信在原子能研究計劃上的進展能夠帶來極大的希望。"
 ITA_revoke_the_acerbo_law: "廢除阿塞博法"
 ITA_revoke_the_acerbo_law_desc: "阿塞博法讓墨索里尼和他的法西斯黨牢牢掌握住了他們迫切渴求的意大利。是時候廢除這項法案來杜絕此等情況的再次發生。"
 ITA_christian_democracy: "基督教民主"
 ITA_christian_democracy_desc: "基督教民主黨是阿爾契德·加斯貝利領導的保守主義中間派政黨，其指導思想融合了基督教教義和自由理念，也因此收穫了諸多民眾支持。我們應該允許他們在忠於國王的條件下組成政府。"
 ITA_democratic_king: "民主中的國王"
 ITA_democratic_king_desc: "現在是意大利君主制向更民主的國家邁出前進的腳步的時候了，我國將在改革的同時保持國王作為我國主要領導人的形象。"
 ITA_cooperate_with_moderates: "與溫和派合作"
 ITA_cooperate_with_moderates_desc: "我國現在沒有不與那些前法西斯政權中的溫和派成員合作的理由。這些非常有才能的溫和派成員將幫助我們推進嶄新的意大利國向前發展。"
 ITA_expand_intelligence_services: "擴張情報部門"
 ITA_expand_intelligence_services_desc: "在如今這個全新的時代裡，情報就是力量。我們必須擴展我國所有的情報分支機構來確保在未來與外國情報機構的鬥爭中不落下風。"
 ITA_crush_opposition: "碾碎反對派"
 ITA_crush_opposition_desc: "還有很多舊法西斯政權的支持者一直在反對我們的政策並阻礙我們的新政府工作。是時候處理他們了。"
 ITA_power_to_the_king: "權力歸於國王"
 ITA_power_to_the_king_desc: "在目前社會政治態勢嚴峻的時候，唯一防止無論是法西斯或共產黨這樣的極端政權在意大利上位的方式，是將大權集中在國王手中。國王自然就是最能平穩指導我國的領袖人選。"
 ITA_disband_the_blackshirts: "解散黑衫軍"
 ITA_disband_the_blackshirts_desc: "黑衫軍是為法西斯主義效忠的極端危險組織，因此是時候讓他們和法西斯政權一樣消失了。我們必須立刻取締所有活躍的法西斯組織。"
 ITA_utilize_the_blackshirts: "利用黑衫軍"
 ITA_utilize_the_blackshirts_desc: "雖然黑衫軍在歷史上忠於法西斯政權和領袖，但是如果他們看到自己的組織可以在我們的新政權下大有作為，也許可以讓他們為我們的利益行事。不論如何，這兩個政權真的天差地別嗎？"
 ITA_expand_the_royal_guard: "擴編王室衛隊"
 ITA_expand_the_royal_guard_desc: "我們將強化並擴招王室衛隊團，從而獲得忠於意大利君主制的可靠部隊。如果需要，衛隊團可以在各種軍事行動中發揮不同的作用。"
 ITA_gloria_al_regno_d_italia: "榮耀歸於意大利王國"
 ITA_gloria_al_regno_d_italia_desc: "那些聲稱君主制是落後政體的人都是一群蠢貨，他們看不到一個卑微的弱國是如何在尊貴堅定的領導下躋身世界列強的。\n國王萬歲！"
 ITA_paramilitary_training: "準軍事訓練"
 ITA_paramilitary_training_desc: "是時候去擴招我們的志願民兵組織並加強他們的軍事教育了。我們將調集精銳部隊中的傑出軍官來訓練新兵、領導黑衫軍部隊。"
 ITA_seek_papal_support: "尋求教宗支持"
 ITA_seek_papal_support_desc: "為了應對我國不斷上升的社會與政治穩定需求，我們需要倒向在歷史上對意大利人民影響深遠的教會。我們必須接觸教宗，尋求他的認可與支持。"
 ITA_agents_of_the_church: "教會代理人"
 ITA_agents_of_the_church_desc: "教會在世界各地有著數不清的代表，如果我們成功讓梵蒂岡站到我們這一邊，我們就能由新的能夠調動的特工，並且憑藉著教會使節的身份完美掩護，他們將大大促進我們的情報工作的開展。"
 ITA_strengthen_the_papacy: "強化教廷"
 ITA_strengthen_the_papacy_desc: "教宗對意大利社會的影響明顯如日中天。唯一保持國家穩定的方式就是加強意大利王國的教會。"
 ITA_setting_course: "決定未來"
 ITA_setting_course_desc: "意大利王國已經準備好去實現其天命了。偉大與榮耀只等自豪的意大利人擷取，是時候決定我們駛向何方了。"
 ITA_mare_nostrum_bba: "我們的海"
 ITA_mare_nostrum_bba_desc: "古羅馬第一次擊敗迦太基靠的是海軍力量。通過加大對海軍的投資，意大利將再度角逐對地中海的掌控，再一次讓它成為“我們的海”。"
 ITA_auxiliaries: "輔助部隊"
 ITA_auxiliaries_desc: "如同我們的古羅馬祖先那時一樣，輔助部隊今天仍在支援常規部隊，偵察地形和襲擾敵軍上發揮著重要的作用。我們需要擴大這些準軍事民兵來增強我們軍隊的實力。"
 ITA_the_italian_legions: "意大利軍團"
 ITA_the_italian_legions_desc: "我們的軍隊也許不是最近才開始蓬勃發展的，但是隨著意大利人民的自豪感因為繼承了羅馬傳統而達到巔峰，我們必須向軍隊灌輸新的思想，讓我們的軍團如同千年之前一樣令人膽寒。"
 ITA_new_roman_citizens: "新羅馬公民"
 ITA_new_roman_citizens_desc: "對我國殖民地的當地人口授予公民權無疑可以幫助我們贏得當地人的認可與合作。"
 ITA_all_roads_lead_to_rome: "條條大路通羅馬"
 ITA_all_roads_lead_to_rome_desc: "羅馬軍團向來以高速高效地建造道路和其他基礎設施，用於調動大軍。幾千年後，當發動戰爭時，後勤與補給線甚至更加重要了。"
 ITA_the_king_of_the_skies: "主宰天界之王"
 ITA_the_king_of_the_skies_desc: "和我們的羅馬先祖不同，我軍順利的陸海作戰仰仗於對天空的控制。意大利製造的飛機早已因其泛用性與高品質而聞名於世，但是我們的航空工程師是時候去更進一步，開發出真正的飛行堡壘了。"
 ITA_modern_musculus: "當世戰場巨械"
 ITA_modern_musculus_desc: "和羅馬人一樣，我們必須開發出可以主導戰場的戰爭機器。我們會設計出一款粉碎敵方前線、令人膽戰心驚的終極坦克。"
 ITA_caligulas_pride: "卡里古拉之傲"
 ITA_caligulas_pride_desc: "打造史上最大戰艦的時機已至。我國最出類拔萃的艦船工程師一直在完善裝備設計、測試試驗型號。現在他們相信“尼普頓號”將不僅僅是地中海的王者，更會君臨天下。"
 ITA_iberian_protection: "保護伊比利亞"
 ITA_iberian_protection_desc: "伊比利亞國家在近幾年享受著相對的和平，顯然，他們現在沒有能獨自與一個強大敵人對抗的實力。我們必須在事態不可挽回前為他們提供保護。"
 ITA_south_american_alliances: "南美盟友"
 ITA_south_american_alliances_desc: "是時候擴大我們陣營的邊界了。我們會與拉丁美洲國家接洽，說服他們結成同盟以對抗環繞我們的威脅的重要性。"
 ITA_the_papacy_reborn: "教廷重生"
 ITA_the_papacy_reborn_desc: "聖座擊敗了國王，教權戰勝了王權，教廷之治降臨意大利。如今正是意大利民族與教會理念並肩共行之時。"
 ITA_deus_vult: "上帝所願"
 ITA_deus_vult_desc: "大公教會數百年來都是歐洲希望與穩定的燈塔。如今我們正面臨黑暗時代，所以光明的燈塔必須被再度點亮。\n如天主所願！"
 ITA_catholic_action: "公教進行會"
 ITA_catholic_action_desc: "我們的天主教青年組織是清剿共產黨的好手。他們不僅可以弘揚天主教的社會正義信條，還能號召熱情澎湃的徵召新兵擴充我軍的行伍。"
 ITA_a_time_for_war: "聖戰肇臨"
 ITA_a_time_for_war_desc: "只要歐洲有異端作妖，就永無和平之日。是時候發動新的聖戰了。嶄新的戰爭機器將以祂之名怒號，準備以義憤擊碎異端分子。直到105毫米火炮發射的審判降臨到所有不信者頭上之前，和平永不到來。"
 ITA_the_holy_lands: "聖地"
 ITA_the_holy_lands_desc: "任何如同巴勒斯坦之於基督教信仰般重要的聖地都應該歸於天主的國。我們必須確保這些聖地都立即回到我們手中。"
 ITA_the_catholic_dominion: "天主教之治"
 ITA_the_catholic_dominion_desc: "隨著教宗國的崛起，並再次成為一個強大的主要勢力，我們是時候向所有虔誠的基督徒伸出援手，併為他們提供引導，就像牧者引導他的羊群，並保護他們免受邪惡一般。這是天主的命令！"
 ITA_unite_the_opposition: "團結反對派"
 ITA_unite_the_opposition_desc: "法西斯主義在意大利根深蒂固，因此摧毀它需要大量的努力。我們必須與反對法西斯政權的各式團體求同存異，只有團結一致，我們才能推翻那個令人作嘔的“領袖”。"
 ITA_liberate_gramsci: "營救葛蘭西"
 ITA_liberate_gramsci_desc: "我們的同志，馬克思主義哲學家安東尼奧·葛蘭西，已經被法西斯政府關押十多年了，而現在他的健康狀況正急劇惡化。我們必須組織一次秘密行動將他救出並挽回他的性命，因為他必將成為我們工人革命的一位關鍵人物。"
 ITA_organize_strikes_in_the_north: "組織北方罷工"
 ITA_organize_strikes_in_the_north_desc: "行動之前，我們要集中所有精力獲取意大利工人的支持，確保北部的工業區將同我們一起對抗法西斯政權。"
 ITA_the_southern_farmlands: "爭取南方農業區"
 ITA_the_southern_farmlands_desc: "法西斯政權的徒勞，造成了意大利仍是個農業國的現實。我們的革命必須由農民群眾發動才能成功，而意大利南部的農民顯然是最強大的。"
 ITA_defy_the_duce: "反抗領袖"
 ITA_defy_the_duce_desc: "是時候起身對抗法西斯政權，根除這意大利人民的災星了。\n意大利工農們，武裝起來！"
 ITA_appeal_to_the_bourgeoisie: "拉攏資產階級"
 ITA_appeal_to_the_bourgeoisie_desc: "我們必須聯繫對法西斯政權的覆滅感興趣的資產階級團體。有了他們的資源和我們革命者的勇氣，我們將迅速結束這場殘酷的戰爭！"
 ITA_seize_old_equipment: "奪取舊式軍備"
 ITA_seize_old_equipment_desc: "大量舊式軍備儲藏在全國各地的軍火庫。儘管這些裝備十分陳舊，奪取並將其分發給我們的部隊將是朝贏得這場戰爭邁出一大步。"
 ITA_the_italian_republic: "意大利共和國"
 ITA_the_italian_republic_desc: "君主制過時而又腐朽，除了阻礙我們的革命毫無用處。是時候解決王室和他們的追隨者了。"
 ITA_the_popular_front: "人民陣線"
 ITA_the_popular_front_desc: "內戰表明共產黨人不僅有能力領導意大利人民成功對抗法西斯，也有能力實現我國急需的社會和工業發展。"
 ITA_the_garibaldi_legion: "加里波第軍團"
 ITA_the_garibaldi_legion_desc: "我們應該組織志願部隊作為國際縱隊參加西班牙內戰，和我們在西班牙共和國的同志並肩戰鬥。"
 ITA_gruppi_di_difesa_della_donna: "婦女衛隊"
 ITA_gruppi_di_difesa_della_donna_desc: "來自各政治形態的革命婦女提議組建女子衛隊以便戰時各階級力量的動員和積極參與。"
 ITA_a_new_era_for_the_red_shirts: "紅衫軍的新時代"
 ITA_a_new_era_for_the_red_shirts_desc: "我們將追隨朱塞佩·加里波第和他的紅衫軍的步伐，訓練並強化這些民兵部隊，使其無論是作為意大利軍隊的一部分，還是作為海外志願部隊的一部分，都能以最佳狀態履行他們的職責。"
 ITA_pugno_alzato: "舉起拳頭"
 ITA_pugno_alzato_desc: "是時候根除法西斯主義給全人類帶來的威脅和苦難了。我們將在這場關鍵的鬥爭中團結一致高舉重拳！"
 ITA_a_leader_steps_forward: "推舉領袖"
 ITA_a_leader_steps_forward_desc: "是時候決定誰將成為新意大利共和國的領袖了。幸好我們的候選人都相當有能力。"
 ITA_the_path_to_progress: "進步之路"
 ITA_the_path_to_progress_desc: "我們將聯繫全世界可能願意與我們合作的共產主義和社會主義政府，幫助我們從被迫承受的毀滅性內戰中恢復。"
 ITA_industrial_socialization: "工業社會化"
 ITA_industrial_socialization_desc: "是時候為了全意大利人民的最大利益，徵收大商人和資產階級手中的大型工業了。"
 ITA_institute_the_five_year_plan: "制定五年計劃"
 ITA_institute_the_five_year_plan_desc: "就像蘇聯同志做的一樣，為了能和世界上的強權競爭，我們必須讓主要由農民組成的我國工業化。我們會開展一個五年計劃，幫助我們不僅恢復到，還要遠超內戰前的工業水平。"
 ITA_new_ricostruzione_industriale: "工業重建所煥新"
 ITA_new_ricostruzione_industriale_desc: "工業重建研究所（Instituto per la Ricostruzione Industriale）已在破產銀行與私企的援救、重組和融資中扮演了重要角色。只需一些調整，我們就能讓它褪去法西斯的氣息繼續運轉。"
 ITA_political_commissars: "政治委員"
 ITA_political_commissars_desc: "為了保持對共產主義的熱愛和激發部隊的思想熱情，我們要在軍隊中樹立政治委員的形象，並由他們負責其部隊的政治教育和組織工作。"
 ITA_common_ground: "立足共識"
 ITA_common_ground_desc: "我們必須拋開與那些和我們事實上有著共同目標的政治集團的分歧。是時候攜手並進帶領新的意大利國家不斷進步了。"
 ITA_appease_the_military: "安撫軍方"
 ITA_appease_the_military_desc: "許多軍隊中的軍官對新政府或者內戰後他們的地位感到不滿，因此明智的做法是確保軍隊中的不滿情緒被根除，並且讓軍官們覺得自己在內戰中發揮的作用被承認了。"
 ITA_crush_the_mafia: "剷除黑手黨"
 ITA_crush_the_mafia_desc: "黑手黨和大量走私團伙、綁架勒索者與犯罪分子在內戰期間重出江湖。我們應該對意大利人民負責，將他們根除，以恢復國家的安全與穩定。"
 ITA_empower_the_carabinieri: "賦權憲兵隊"
 ITA_empower_the_carabinieri_desc: "憲兵在剷除黑手黨與維護國家和平安全的任務中扮演了重要角色。是時候增強這支警察力量，使他們還能執行更多的任務了。"
 ITA_army_modernization: "軍隊現代化"
 ITA_army_modernization_desc: "我們的軍事力量可以從新的裝備與新的訓練方法中受益匪淺，並使他們能夠跟上其他大國的軍隊和理論的發展步伐。"
 ITA_union_in_the_party: "黨內團結"
 ITA_union_in_the_party_desc: "團結黨內各方是在我國建成共產主義的最重要因素。我們必須保證所有黨員理想一致、目標一致，而且會通過服從黨制定的方針來落實信念。"
 ITA_follow_the_soviet_union: "追隨蘇聯"
 ITA_follow_the_soviet_union_desc: "很顯然，蘇聯已經給出了通向共產主義的康莊大道。我們如果想讓新生的共和國茁壯成長併成為真正的共產主義國家，我們就必須跟隨蘇聯。"
 ITA_military_cooperation: "軍事合作"
 ITA_military_cooperation_desc: "如果我們想在與世界上大國的博弈中佔得上風，我們就必須和我們的盟友建立軍事合作協議，因為圍繞著我們的大國毫無疑問都是無產階級的敵人。"
 ITA_defense_against_capitalism: "打倒資本主義"
 ITA_defense_against_capitalism_desc: "法西斯主義意識形態是我們的首個頭等大敵，但並不會是唯一一個。資本主義代表著對我們的國家和無產階級革命的巨大威脅。我們必須準備好面對他們。"
 ITA_combined_research_effort: "聯合科研項目"
 ITA_combined_research_effort_desc: "如果我們想讓我們的軍隊攜帶現代裝備面對敵人，技術進步就是必需的。我們必須和盟友合作，確保我們的科學進展持續不斷，尤其是在軍事領域。"
 ITA_special_brigades: "特種部隊"
 ITA_special_brigades_desc: "我們會建立一支特殊的突擊部隊，他們能在我們的軍隊的主攻方向提供支援。這些突擊旅將由在隊伍中有出色表現的士兵組成。"
 ITA_defend_the_land: "保衛國土"
 ITA_defend_the_land_desc: "蘇聯和它所實行的政策與無產階級的利益和馬克思主義漸行漸遠了。意大利人會走一條屬於自己的共產主義道路，一條充滿障礙和威脅，但充滿希望的道路。而我們的各位同志和我們的盟友會與我們在這條道路上並肩而戰。"
 ITA_united_anarchist_confederations: "團結安那其聯合會"
 ITA_united_anarchist_confederations_desc: "我們必須尋求西班牙和世界各地的安那其主義者的支持，以對抗法西斯和資產階級分子。我們會建立一個合作大委員會來接納來自世界各地的活動家，知識分子和自由鬥士。"
 ITA_the_fight_against_stalinism: "[GetAppropriateRussianGovernmentIdeology]"
 ITA_russian_government_ideology_default: "反不相為謀者之戰"
 ITA_russian_government_ideology_alt: "反斯大林主義之戰"
 ITA_russian_government_ideology_alt2: "反挑撥離間者之戰"
 ITA_the_fight_against_stalinism_desc: "[GetAppropriateRussianGovernmentIdeologyDesc]"
 ITA_russian_government_ideology_desc_default: "在我們有能力解決斯大林教條的威脅前，其就已被更糟糕的存在取代了。考慮到其現任領導層在過去展現的能力，我們決不可坐以待斃，必須先發制人！"
 ITA_russian_government_ideology_desc_alt: "很不幸，除了資本主義和法西斯主義，斯大林教條的追隨者也將我們的政府和國家視為其利益之威脅。為了摧毀我國，其將不惜各種手段。我們決不可坐以待斃，必須先發制人！"
 ITA_russian_government_ideology_desc_alt2: "很不幸，有一些國家正費盡心思試圖分裂我國。儘管我們對斯大林和其政府全無好感，目前的形勢較之也是半斤八兩。面對來自這些國家的威脅，我們決不可坐以待斃，必須先發制人！"
 ITA_raise_the_peoples: "發動群眾"
 ITA_raise_the_peoples_desc: "意大利有很多勇敢的農民願意為我們的理想而戰。有了他們，我們可以組建更多的紅衫軍部隊，用他們充實我軍的陣列。"
 ITA_il_sol_dell_avvenire: "未來的太陽"
 ITA_il_sol_dell_avvenire_desc: "是時候建立一個新的意大利國家了——在意大利國家聯盟的面前，人人自由，人人平等。\n未來的太陽將在意大利升起！"
 ITA_italian_socialism: "意式社會主義"
 ITA_italian_socialism_desc: "通向社會主義的道路已經向我們開放，是時候採取堅定的措施在我們的國家中建立一個公平的社會，並取得意大利共和國在國際舞臺上的恰當地位了。"
 ITA_cooperate_with_the_mafia: "與黑手黨合作"
 ITA_cooperate_with_the_mafia_desc: "如果我們願意提供一些特權和讓步，崛起於內戰中的黑手黨或許是個改進其領地內私營和國營企業表現的機會。"
 ITA_mafia_abroad: "海外黑手黨"
 ITA_mafia_abroad_desc: "和我們有協議的黑手黨家族的影響不僅在意大利，而且在國外的一些地方不斷增長。我們可以派遣一些和他們有關係的特工到那些資本主義強權中。在那裡，他們的生意也可以因為我們的利益服務而得到繁榮。"
 ITA_empower_the_unions: "賦權工會"
 ITA_empower_the_unions_desc: "意大利無產階級潛力可觀，我們必須讓工會獲得足以管理並強化我國勞動力的資源和權力。"
 ITA_production_lines: "生產線"
 ITA_production_lines_desc: "是時候更新並擴大我們的主要生產線來確保我們的軍事力量能夠有充足的補給和設備以便繼續保持在巔峰狀態運作。"
 ITA_the_republics_leadership: "共和國領導層"
 ITA_the_republics_leadership_desc: "我們必須選擇正確的黨派和政治領導人來帶領我們的新生的意大利共和國朝著人民應得的社會主義社會前進了。費盧西奧·帕裡和伊瓦諾埃·博諾米似乎都很有能力並是能完成這項任務的人選。"
 ITA_bring_back_exiled_intellectuals: "迎回流亡知識分子"
 ITA_bring_back_exiled_intellectuals_desc: "法西斯政權逼迫大量意大利公民背井離鄉，其中有優秀的哲學家、知識分子和科學家。現在應該為所有這些難民提供回家的機會。"
 ITA_social_stability: "社會穩定"
 ITA_social_stability_desc: "我們擺脫了內戰的可怕回憶，使社會變得更加公平了。雖然我們離實現社會主義還有很長的路要走，但我們現在可以驕傲地說，意大利人終於取了社會上的和平了。"
 ITA_aid_for_the_spanish_republic: "支援西班牙共和國"
 ITA_aid_for_the_spanish_republic_desc: "我們必須在內戰中幫助我們的西班牙同志。那些曾發誓效忠於這個國家的嗜血的西班牙將軍們正依靠著來自歐洲法西斯力量的支援，圍攻他們的社會主義共和國。"
 ITA_italia_libera: "自由意大利"
 ITA_italia_libera_desc: "我們必須採取一些措施，向友好的歐洲鄰國政府提出結盟倡議，來使我們能夠攜手保衛我們的國家，對抗環繞於我們的眾多威脅。"
 ITA_european_democracies: "歐洲民主聯盟"
 ITA_european_democracies_desc: "我們必須延續在歐洲民主國家間促成團結與合作的政策。通過這些外交手段，我們可以結成強大的同盟以應對任何強敵。"
 ITA_peace_preservation: "維護和平"
 ITA_peace_preservation_desc: "在這動盪不安、各國紛爭的時代，只有意大利人民能肩負著在歐洲維護並推行和平的重任。"
 ITA_scientific_cooperation: "科研合作"
 ITA_scientific_cooperation_desc: "我們必須推行科研合作項目，來保障我們的科技發展可以趕上其他列強。"
 ITA_secure_the_borders: "保衛邊境"
 ITA_secure_the_borders_desc: "隨著世界各地的國際局勢不斷升溫，任何不是我國盟友的國家都必須被當做潛在敵人。我們必須儘快加強我國邊防，從而防止並阻卻任何入侵。"
 ITA_bring_down_fascist_strongholds: "毀滅法西斯老巢"
 ITA_bring_down_fascist_strongholds_desc: "鑑於歐洲的嚴峻局勢，我們不能坐等咄咄逼人的法西斯國家對我們發動攻勢。先發者最能制人，因此我們必須要對法西斯發動先手痛擊。"
 ITA_reestablish_old_alliances: "重建舊同盟"
 ITA_reestablish_old_alliances_desc: "我們必須重建我們在上次大戰中結成的同盟。只有聯合歐洲的民主力量，我們才能對抗即將即將到來的眾多威脅。"
 ITA_military_agreements: "軍事協議"
 ITA_military_agreements_desc: "我們能從盟國學習借鑑的知識很多。我們必須向他們提出推動軍事與科技合作項目的倡議。"
 ITA_the_enemies_of_capitalism: "資本主義之敵"
 ITA_the_enemies_of_capitalism_desc: "蘇聯的共產主義對意大利與全歐洲造成了巨大威脅。是時候消滅他們了。"
 ITA_the_ethiopian_question: "埃塞俄比亞問題"
 ITA_the_ethiopian_question_desc: "埃塞俄比亞戰爭是殘暴而不正義的。我們必須彌補法西斯在這個國家犯下的暴行，並聯系地方當局尋求和解。"
 ITA_abolish_the_colonies: "廢除殖民地制度"
 ITA_abolish_the_colonies_desc: "我們將設計並頒佈一個革命性的方案來廢除意大利境內的所有殖民地。作為我國有史以來的第一次，受影響區域的當地居民將有機會決定他們的命運。我們能做的就是讓他們看到成為意大利一個法定省份的益處。"
 ITA_cooperatives_for_intensive_exploitation: "深度開發合作組織"
 ITA_cooperatives_for_intensive_exploitation_desc: "非洲大陸富含各類資源儲備，我們應該投資改進開採這些儲備的方法，最大程度地利用這些儲備。"
 ITA_condemn_colonialism: "譴責殖民主義"
 ITA_condemn_colonialism_desc: "現在正是譴責殖民主義，呼籲歐洲勢力解放被他們壓迫了無數年頭的非洲人民的時機。若是到了萬不得已之時，我們將為了非洲人民的利益與之戰鬥。"
 ITA_new_colonial_policies: "新殖民政策"
 ITA_new_colonial_policies_desc: "法西斯政權已經虐待殖民地群眾太久了。是時候重新考慮我們的殖民地政策，向這些地區提供部分自治權，糾正過去造成的不公。"
 ITA_negotiations_with_albania: "與阿爾巴尼亞談判"
 ITA_negotiations_with_albania_desc: "阿爾巴尼亞過去數十年的歷史受到了意大利的強烈影響。既然現在法西斯政權已進了歷史的垃圾堆，我們應該向阿爾巴尼亞政府提議加強我們之間的聯繫，乃至將阿爾巴尼亞行政部門整合進我國，兩國正式結為一體的可能性。"
 ITA_enlist_the_bashkimi_kombetar: "徵召民族聯盟"
 ITA_enlist_the_bashkimi_kombetar_desc: "大量支持我們政府和意識形態的阿爾巴尼亞公民希望加入紅衫軍。我們應在志願民兵中創立新分支，整編由這些新兵組成的新單位。"
 ITA_the_italian_confederation: "意大利邦聯"
 ITA_the_italian_confederation_desc: "重新考慮我們的殖民地政策後，我們必須要邁出的下一步就是建立一個邦聯，吸收所有在去殖民化過程中成立的國家，作為各國能合作互利的一個框架。"
 ITA_planned_economy: "計劃經濟"
 ITA_planned_economy_desc: "我們新邦聯的代表們已經提出了一個經濟倡議。按照他們的說法，這個經濟倡議將以一種高效且可持續的方式調節並促進各成員國的經濟。"
 ITA_the_fight_overseas: "海外鬥爭"
 ITA_the_fight_overseas_desc: "是時候在非洲大陸加強防衛設施併為支持大規模軍事行動改善後勤了。我們將為陸海軍開發特殊的訓練技術，讓他們能在將來遭遇的各種艱難條件下保持出色表現。"
 ITA_irregulars: "非正規軍"
 ITA_irregulars_desc: "非正規部隊在非洲戰場上扮演了關鍵角色。我們必須加大在當地群眾的徵募並改善這些單位接受的訓練。"
 ITA_liberate_the_workers_of_africa: "解放非洲工人"
 ITA_liberate_the_workers_of_africa_desc: "是時候一勞永逸地將非洲人民從各式政府的壓迫下解放出來了！"
 ITA_ascari: "殖民地衛兵"
 ITA_ascari_desc: "由非洲地方部隊組成的常規單位已被證明能高效地執行各類任務，不論是作為衛戍部隊或是預備隊，還是在其他單位頭疼的複雜地形執行軍事行動。"
