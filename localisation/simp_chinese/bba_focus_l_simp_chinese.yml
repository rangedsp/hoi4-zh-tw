 ITA_il_vento_aureo: "黃金之風"
 ITA_il_vento_aureo_desc: "教宗國已經被外國力量壓迫了很久。但是我們可以調整我們的飛行員訓練計劃以培養更加廉價但勇敢的飛行員，從空中為敵人帶去天主教會的神聖統治。這將是我們的宏大的安魂曲！"
 form_greater_italy_tt: "解鎖決議：§Y宣稱大意大利§!"
 ITA_papal_faction: "天主教之治"
 ITA_roman_faction: "羅馬帝國"
 ITA_latin_initiatives: "拉丁倡議"
 ITA_depose_mussolini: "廢黜墨索里尼"
 ITA_depose_mussolini_desc: "是時候讓墨索里尼下臺了！他已經證明了自己是個不合格的領導人，將我們鍾愛的意大利祖國拖入許多不必要的麻煩與困難之中，並試圖測試祖國和它的國民的韌性的極限。雖然他的影響力的陰影會在未來一段時間籠罩著我們，但意大利和他們人民終將取得勝利。"
 ITA_italo_balbo_focus: "伊塔洛·巴爾博"
 ITA_italo_balbo_focus_desc: "我們需要一位能幹的軍事領袖來帶領我們度過眼前的動盪歲月。伊塔洛·巴爾博不僅是軍事領袖，還是完成多次外交任務的飛行英雄與出色治理利比亞殖民地的人。他當然可以重整疲敝的我軍，帶領意大利走向榮光！"
 ITA_remove_balbo_as_advisor_tt: "§Y伊塔洛·巴爾博§!不再是§Y顧問§!或§Y元帥§!。"
 ITA_dino_grandi_focus: "迪諾·格蘭迪"
 ITA_dino_grandi_focus_desc: "如果我們要走向富強，我們需要一位外交能手與不懼怕整頓舊體制的強人。迪諾·格蘭迪擔任過外交部長並改革過外交官隊伍，他向權貴之外的人群敞開大門。他不會逃避必要的改革，更必將推動意大利走向全新的美好的未來！"
 ITA_remove_grandi_as_advisor_tt: "§Y迪諾·格蘭迪§!不再是§Y顧問§!。"
 ITA_has_new_duce_flag: "被§Y大委員會§!罷免了。"
 ITA_stop_the_squandering: "制止揮霍"
 ITA_stop_the_squandering_desc: "墨索里尼揮霍金錢與資源太久，意大利難以承擔——是時候叫停這種無度的鋪張浪費了！我們需要收緊錢袋子，將我們的資金用在其他領域的提升上。"
 ITA_consolidate_power: "鞏固權力"
 ITA_consolidate_power_desc: "我們對黨和國家的控制還是很弱。我們必須鞏固已有權力並將政權的強力廣泛示眾，讓全社會都知道我們一如既往地強大可靠！"
 ITA_purge_the_party: "黨內清洗"
 ITA_purge_the_party_desc: "我們聽聞有些人只希望看到舊政府重建。儘管墨索里尼已被趕下臺，他的陰影仍滯留於政府和人民的腦海中。我們必須殺雞儆猴，清洗黨內仍忠於舊領袖而非我們的頑固分子。"
 ITA_the_fate_of_mussolini: "墨索里尼的命運"
 ITA_the_fate_of_mussolini_desc: "雖然墨索里尼仍被軟禁，但我們無法在他的影響下真正向前邁進。我們已經確立了黨內的權威地位，是時候決定前任領袖的命運了！"
 ITA_divino_duce: "神聖領袖"
 ITA_divino_duce_desc: "顯然，單單一人也可以對整個國家和全體國民產生重大影響，這或許是我們也可以借鑑利用的事實。我們通過動員國家宣傳部門，也可以將我們的新任領袖塑造成一個可以團結意大利的精幹強人。我們會為人民塑造一位超凡入聖、令人崇拜的領袖！"
 ITA_blackshirt_loyalty: "贏得黑衫軍忠誠"
 ITA_blackshirt_loyalty_desc: "黑衫軍在意大利法西斯主義中長期擁有一席之地，如果我們想激發民眾的熱情，我們就最好獲取這個組織的效忠。他們肯定能對在軍隊內外傳播偉大新領袖的神聖思想起到很大幫助。"
 ITA_a_greater_purpose: "更宏偉的目標"
 ITA_a_greater_purpose_desc: "黨內最近的衝突向我們表明了法西斯思想與個人聯繫過度緊密的缺陷。我們應該注重於將法西斯主義昇華為一個更廣泛的構想，超越個人擁有的有限歲月，成為一個人民能為之集結的思想。"
 ITA_spreading_the_eagles_wings: "雄鷹展翅"
 ITA_spreading_the_eagles_wings_desc: "我們周邊的其他意識形態都在搖搖欲墜。看來只有法西斯主義才能在亂世的混戰中屹立不倒、直衝青天。我們有責任將這種穩定帶給他國，在黑暗的時代裡為他們帶來光明的燈塔！"
 ITA_italian_hegemony: "意大利霸權"
 ITA_italian_hegemony_desc: "身處被戰爭撕裂的世界之中，我們必須鼓舞並團結所有處於我們霸權之下的不同國家和文化，向他們展示法西斯主義和[ROOT.GetNameDefCap]如何使他們受益。我們必須引領他們通往更美好的未來！"
 ITA_reorganize_regio_esercito: "改組皇家陸軍"
 ITA_reorganize_regio_esercito_desc: "新的領導層有著對戰爭的全新看法。任何用心觀察的人都能發現，我們凱旋歸來的軍隊仍有能夠改進的地方。有了最近空餘出來的資源，我們應該在訓練和重組軍隊力量上投資更多，以便讓他們成為一支勢不可擋的軍隊。"
 ITA_reinforce_regia_aeronautica: "加強皇家空軍"
 ITA_reinforce_regia_aeronautica_desc: "意大利皇家空軍在世界範圍內都受到尊敬與羨慕，但是他們仍有改進的空間。有了最近空餘出來的資源，我們應該在設備和訓練上進行投資，使他們成為最可畏的空軍力量。"
 ITA_compagnie_auto_avio_sahariane: "擴充撒哈拉摩托化-航空連隊"
 ITA_compagnie_auto_avio_sahariane_desc: "撒哈拉摩托化-航空連隊與己方的偵察機協同作戰時非常出色。將該編制擴編的做法肯定會讓我軍更加無往不利，令敵方心驚膽寒、如遇神明！"
 ITA_combined_land_and_air_warfare: "空地一體化作戰"
 ITA_combined_land_and_air_warfare_desc: "讓意大利皇家空軍協助陸軍進行的一系列行動展示出了意大利軍隊的協調性，但這仍有改進的空間。深化軍種間的合作可以在戰場上摧毀我們的敵人，為意大利帶來因永無止境的榮耀。"
 ITA_the_fourth_shore: "第四海岸"
 ITA_the_fourth_shore_desc: "利比亞經常被稱作意大利的第四海岸，也是帝國未來不可分割的一部分。它離本土最近，而且因其作為連接非洲其他地區的紐帶，還是最重要的一個殖民地。我們可以在當地開發資源來鞏固海外領土，同時也能在未來獲得大量收益。"
 ITA_oil_in_tripoli: "的黎波里石油"
 ITA_oil_in_tripoli_desc: "我們在利比亞找到了金子——寶貴的黑金！在的黎波里以外的沙漠中，我們發現了大量的石油儲量。我們不能放過這樣的機會，而應該利用這些資源為意大利的榮耀而戰！"
 ITA_steel_in_tripoli: "的黎波里鋼鐵"
 ITA_steel_in_tripoli_desc: "的黎波里郊外的沙漠中似乎埋藏著大量的鐵礦石，就等著我們去挖掘處理。通過在附近建造鋼鐵廠，我們就可以用這些鋼鐵來強化我們傑出的軍隊！"
 ITA_novus_ordo: "新秩序"
 ITA_novus_ordo_desc: "意大利的國運與利比亞緊密相連，因此我們需要將其進一步併入我國。通過對任何樂意為我國而戰的利比亞人發放“特殊公民身份”可以實現這一點，而這麼做也可以強化我們對地中海與北非的控制。"
 ITA_seek_british_military_cooperation: "尋求英國軍事合作"
 ITA_seek_british_military_cooperation_desc: "雖然我們在上一場戰爭中被曾經的盟友背叛，但拋開我們的恩怨，向他們伸出橄欖枝，也許仍然有些道理。我們可以向英國人學習很多東西，尤其是關於海軍和空軍方面的各種事情。"
 ITA_anglo_italian_pact: "簽署英意條約"
 ITA_anglo_italian_pact_desc: "我們與英國的軍事合作對我們很有幫助，兩國間的互不侵犯條約也對我們十分有利。這樣的條約將讓我國的大片非洲殖民地安穩無憂，從而讓我們可以聚焦別處。"
 ITA_invite_france_to_military_partnership: "尋求法國軍事合作"
 ITA_invite_france_to_military_partnership_desc: "法國是我國最強大的鄰國與傳統盟友。我們不會遺忘他們在上次大戰中的背叛，但是可以原諒。也許現在要拋開舊恨，力圖在兩國的緊密合作中強化我方軍力。"
 ITA_franco_italian_pact: "簽署法意條約"
 ITA_franco_italian_pact_desc: "我們與法國的軍事合作頗有成果，簽訂互不侵犯條約也會如此。這樣一來，我們歐洲本土的西側就高枕無憂了，大片的非洲殖民地也安全了，我們也得以將注意力集中在別處。"
 ITA_proclaim_the_italian_empire: "宣告意大利帝國"
 ITA_proclaim_the_italian_empire_desc: "隨著我們最近在非洲開疆拓土，一個嶄新的時代浮現在了我們眼前。帝國蓬勃發展、我軍建設得當，而我們也不再僅僅是一個王國了。我們終於可以昂揚地昭告天下：意大利帝國已冉冉升起！這一刻，我們等了太久了！"
 ITA_italy_will_guarantee_tt: "[GetItalyGuaranteesMajor]"
 ITA_italy_will_guarantee_tt_standard: "§Y[ROOT.GetNameDefCap]§!將§Y保障§!任何保障§Y[ROOT.GetNameDefCap]§!獨立的§Y主要國家§!的獨立。"
 ITA_italy_will_guarantee_tt_fulfilled: "§Y[ROOT.GetNameDefCap]§!將§Y保障§!任何保障§Y[ROOT.GetNameDefCap]§!獨立的§Y主要國家§!的獨立。當前效果："
 ITA_african_conquests_tt: "我們宣示了我們的帝國雄心，現在§Y吞併§!§Y非洲大陸§!上地區的§Y花費將減少§!。"
 ITA_economic_reforms: "經濟改革"
 ITA_economic_reforms_desc: "舊政府治下的經濟停滯不前，但是現在有了新生的國家法西斯黨，我們可以直面這項重擔了！我們現在可以自由地任命有能力振興經濟的才幹。"
 ITA_improve_the_industries: "改善工業"
 ITA_improve_the_industries_desc: "經濟復甦之後，我們現在有資源去關心我國工業並進行廣泛的改革。更高效的工業一定可以更快速地為我們的不敗之軍打造更多的武器。"
 ITA_reorganize_the_party: "黨內改組"
 ITA_reorganize_the_party_desc: "國家法西斯黨已經淪為一個陳腐僵化的組織，到處都是陰謀詭計和粉飾太平。我們對黨的掌控會更加牢固，並立刻開始從基層重組黨組織，使其更加高效有活力。"
 ITA_meritocracy: "任人唯賢"
 ITA_meritocracy_desc: "在打壓掉黨內的反對派之後，我們現在可以自由地向法西斯黨之外的人群開放一些組織。這應該會帶來激動人心的新思想和新機遇。"
 ITA_expanded_corporatism: "拓展社團主義"
 ITA_expanded_corporatism_desc: "社團主義是法西斯主義的根本思想，我們必須在所有新徵服領土上盡全力推行它。不過要做到這一點，我們必須依靠當地的精英和人才，為他們打開在法西斯體系中升遷的大門。這是在新領土內確立忠誠與效率的便捷辦法。"
