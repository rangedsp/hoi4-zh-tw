 #global flags
 second_italo_ethiopian_war_flag: "第二次意埃戰爭正在進行"
 ETH_selassie_left_flag: "$ETH_haile_selassie$已離開埃塞俄比亞"
 #Tech bonuses
 ETH_university_bonus: "[ROOT.Capital.GetCapitalVictoryPointName]大學電子學研究"
 ETH_new_weapons_and_tactics_bonus: "新型武器與戰術研究"
 ETH_shipbuilding_bonus: "[ETH.GetAdjective]造船業"
 #Focuses
 ecole_militaire_haile_selassie_1er: "海爾·塞拉西一世軍事學院"
 holeta_military_academy: "霍萊塔軍事學院"
 every_league_of_nations_member_tt: "所有國際聯盟成員國："
 ETH_strengthen_the_black_lions: "強化黑獅組織"
 ETH_strengthen_the_black_lions_desc: "雖然我們的國土已經陷於敵手，但戰鬥仍將繼續。黑獅組織正在竭力抵抗意大利人，我們必須竭盡全力支持他們。"
 ETH_supporting_the_arbegnoch: "支持愛國者聯盟"
 ETH_supporting_the_arbegnoch_desc: "[ROOT.GetName]裡有著無數的愛國者們希望能夠拿起武器，對抗[ITA.GetAdjective]的侵略。我們必須傾盡全力去支持這些英勇無畏的男女同胞們，從而抵抗[ITA.GetAdjective]的戰爭機器。"
 ETH_ecole_militaire_haile_selassie_1er: "[GetEthiopianMilitaryAcademyName]"
 ETH_ecole_militaire_haile_selassie_1er_desc: "相比於該地區的其他強權，我們的軍隊已經被證實在裝備和思想上都非常落後。我們需要建立自己的軍事學院，培養一批能夠適應現代戰爭的新一代軍官們。"
 ETH_ecole_militaire_haile_selassie_1er_tt: "§Y[GetEthiopianArmySpiritName]§!追加效果：\n$MODIFIER_XP_GAIN_ARMY$：§G+5%§! "
 ETH_unlock_academy_tt: "解鎖§Y$academy_spirit$§!"
 ETH_university_of_capital: "[ROOT.Capital.GetCapitalVictoryPointName]大學"
 ETH_university_of_capital_desc: "部隊的勇猛曾是戰局的決定性因素。現在，遠距離戰鬥甚至可以在雙方士兵彼此無法目視的情況下發生。我們必須投資研究機構，才能開發新技術幫助我們進行戰爭，並製造用於戰爭的工具。"
 ETH_university_of_capital_tt: "§Y$ETH_corrupt_bureaucracy_dynamic_modifier$§!追加效果：\n$MODIFIER_RESEARCH_SPEED_FACTOR$：§G+5%§! "
 ETH_scavenging_tactics: "清道夫戰術"
 ETH_scavenging_tactics_desc: "在我們擴大工業基礎的同時，我們應該訓練我們的部隊在戰場上尋找可利用與回收的東西。在我們能夠持續穩定的生產與運輸我們自己的裝備之前，這將是他們保證補給供應的重要方法。"
 ETH_scavenger_random_generals_tt: "§Y三個§!隨機陸軍指揮官將獲得§Y$scavenger$§!：\n-$MODIFIER_EQUIPMENT_CAPTURE_FACTOR$：§G+3%§! "
 ETH_keep_the_chitet: "保留[GetChitetName]"
 ETH_keep_the_chitet_desc: "[GetChitetName]一直表現良好。作為一個相對偏向農業的國家，我們一直致力於組建一支專業化的常備軍。最好堅持使用我們充分了解的傳統軍隊。"
 ETH_keep_the_chitet_tt: "§Y[GetEthiopianArmySpiritName]§!追加效果：\n $modifier_army_sub_unit_irregular_infantry_max_org_factor$：§G+5%§!\n 為契特部隊編制添加§Y2個$irregular_infantry$§!營。"
 ETH_expand_the_mehal_sefari: "擴充[ETH_GetSefariName]"
 ETH_expand_the_mehal_sefari_desc: "[ETH_GetSefariName]部隊已經證明了訓練有素的職業士兵的必要性。單純依靠農民組成的軍隊來應對危難時期的時代已經過去。因此，我們將重組軍隊，使其成為一支常備力量。"
 ETH_chitet_sefari_no_recruiting_tt: "無法再招募§Y契特部隊§!。"
 ETH_expand_the_mehal_sefari_tt: "§Y[GetEthiopianArmySpiritName]§!追加效果：\n$MODIFIERS_ARMY_DEFENCE_FACTOR$：§G+25%§! \n$MODIFIER_ARMY_ORG_FACTOR$：§G+5%§!"
 ETH_the_ethiopian_air_force: "[ROOT.GetAdjective]空軍"
 ETH_the_ethiopian_air_force_desc: "無論是用於在戰場上支援部隊或是摧毀敵方的基建，飛機都是一種極為有用的工具。如果我們想要保護我們的人民並消滅敵軍，我們就必須建立屬於自己的空中力量。"
 ETH_the_ethiopian_air_force_tt: "解鎖§Y$air_force_command_spirit$§!"
 ETH_establish_a_naval_base: "建立海軍基地"
 ETH_establish_a_naval_base_desc: "伴隨著我們近期對一個港口的收購，一個全新的戰爭舞臺向我們打開了大門。我們必須建立自己的海軍基地，並開始建設一支海軍用於保衛我們的新海岸線。"
 ETH_improve_the_administration: "改善行政機構"
 ETH_improve_the_administration_desc: "我們的教育機構內部仍然存在大量的貪汙腐敗，這在一個應以任人唯賢與學識淵博為榮的機構中是不可接受的。我們必須將這些貪汙腐敗毫不留情的從我們的學院中徹底剷除。"
 ETH_improve_the_administration_tt: "§Y$ETH_corrupt_bureaucracy_dynamic_modifier$§!追加效果：\n$MODIFIER_RESEARCH_SPEED_FACTOR$：§G+5%§!\n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$：§G+5%§!\n$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY_FACTOR$：§G+5%§!"
 ETH_mounted_levies: "馬背上的[GetChitetName]"
 ETH_mounted_levies_desc: "從東方的荒涼沙漠，到西邊的崇山峻嶺，各種難以跨越的地形組成了我們的家園，因此使用輪胎與履帶的載具無法適應。然而，幾千年的經驗證明，駱駝和馬可以勝任這項工作。"
 ETH_mounted_levies_tt: "可徵募§Y$cavalry$§!和§Y$camelry$§!師。"
 ETH_regional_training_centers: "地區訓練中心"
 ETH_regional_training_centers_desc: "[GetChitetName]絕非完美的部隊。通過建立地區訓練中心並向他們教授戰鬥與戰術思想，我們部隊的戰鬥力可以獲得有效的提升。這也讓我們能在沒有常備軍的情況下執行標準化軍事訓練。"
 ETH_regional_training_centers_tt: "§Y[GetEthiopianArmySpiritName]§!追加效果：\n $modifier_army_sub_unit_irregular_infantry_defence_factor$：§G+5%§! \n $modifier_army_sub_unit_irregular_infantry_speed_factor$：§G+10%§! \n $modifier_army_sub_unit_irregular_infantry_max_org_factor$：§G+15%§!"
 ETH_expand_the_kebur_zabagna: "擴編[ETH_GetGuardsName]"
 ETH_expand_the_kebur_zabagna_desc: "[ETH_GetGuardsName]已經證明了他們是我國武裝部隊精銳中的精銳。我們應該給予他們更多裝備和人力的使用權來強化他們的能力。"
 ETH_expand_the_kebur_zabagna_tt: "招募一個額外的§Y帝國近衛§!師。\n在§Y帝國近衛§!編制中添加額外的§Y$infantry$§!和§Y$cavalry$§!營。\n如果相關科技已研發，添加§Y$recon$§!和§Y$artillery$§!。"
 ETH_tactical_training: "標準化戰術訓練"
 ETH_tactical_training_desc: "我們的武裝部隊長期接受著落後且參差不齊的訓練。我們需要對部隊接受的戰術訓練進行標準化，使他們能夠在戰場上更高效的戰鬥。"
 ETH_tactical_training_tt: "§Y[GetEthiopianArmySpiritName]§!追加效果：\n$MODIFIERS_ARMY_DEFENCE_FACTOR$：§G+10%§! "
 ETH_peacekeeping_forces: "維和部隊"
 ETH_peacekeeping_forces_desc: "我們國家安全的關鍵，是確保任何外部的危機在態勢失控前得到迅速處理。維持一支能夠隨時全球部署的維和部隊至關重要。"
 ETH_copy_plane_designs: "模仿飛機設計"
 ETH_copy_plane_designs_desc: "重新發明別人早已開發過的東西毫無意義。我們將仿照別國的飛機設計，並充分利用他國在投資研究中取得的進展與優勢。"
 ETH_copy_light_plane_tt: "創建§Y$iw_small_airframe$§!的衍生型：§Y[ITA.GetFlag]CR.32§!"
 ETH_copy_medium_plane_tt: "創建§Y$iw_medium_airframe$§!的衍生型：§Y[ITA.GetFlag]Ca.101§!"
 ETH_asmera_naval_college: "[GetNavalCollegeName]"
 ETH_asmera_naval_college_desc: "一支海軍需要的不僅僅是建造並維護艦船的能力。我們需要大量訓練有素的軍官和專家來幫助我們在戰鬥中高效使用海軍裝備和艦船。因此，我們將建立[ETH.GetName]的首個海軍學院。"
 ETH_asmera_naval_college_tt: "§Y[GetEthiopianNavySpiritName]§!追加效果：\n$MODIFIER_NAVAL_DOCTRINE_COST_FACTOR$：§G-30%§!"
 unlock_spirit_of_naval_academy_tt: "解鎖§Y海軍學院精神§!"
 ETH_naval_college_reduction: "海軍學院研究"
 ETH_capital_school_of_technology: "[ROOT.Capital.GetCapitalVictoryPointName]科技學院"
 ETH_capital_school_of_technology_desc: "我們的教育改革和投資是值得且卓有成效的。為進一步加速科學技術的進步，我們應該將我國的工程專家聚集到同一所科技學院中。"
 ETH_regional_supply_depots: "地區補給站"
 ETH_regional_supply_depots_desc: "倘若沒有彈藥和食物，再英勇的部隊也無法保衛自己的家園。畢竟，兵馬未動糧草先行。我們應當在[ETH.GetName]建立區域軍事補給站，從而確保他們能夠得到充足的補給。"
 ETH_expand_the_levy: "擴編[GetChitetName]"
 ETH_expand_the_levy_desc: "在獲得了更好的支持和訓練後，[GetChitetName]已經成為了一支強大且靈活的軍隊。在擁有了堅實的基礎之後，我們將擴編[GetChitetName]以抵擋外國侵略者。"
 ETH_expand_the_levy_tt: "增加可部署的契特部隊師數量至§Y40§!。\n在契特部隊編制內添加§Y3個$irregular_infantry$§!營。如果相關科技已研究，添加§Y$engineer$§!、§Y$military_police$§!和§Y$field_hospital$§!。"
 ETH_the_junior_officer_corps: "青年軍官團"
 ETH_the_junior_officer_corps_desc: "我國的軍隊在過去的幾個世紀裡一直掌控在貴族手中，如果想要他們在戰場上擁有更好的表現，我們必須設立更加註重學識與才華，而非裙帶關係的軍官學院與訓練程序。建立一個青年軍官團將會是這條道路上的一塊基石。"
 ETH_camouflage: "偽裝與隱蔽"
 ETH_camouflage_desc: "隨著飛機越來越多的進入戰場，出其不意的奇襲行動變得越來越難。為了儘可能減少我方戰術意圖的洩漏和暴露，我們需要讓部隊接受有關偽裝和隱蔽的訓練。"
 ETH_camouflage_army_tt: "§Y[GetEthiopianArmySpiritName]§!追加效果：\n $MODIFIER_CAS_DAMAGE_REDUCTION$：§G+10%§! \n $MODIFIERS_ARMY_DEFENCE_FACTOR$：§G+10%§!"
 ETH_camouflage_air_tt: "§Y[GetEthiopianAirforceSpiritName]§!追加效果：\n $MODIFIER_ENEMY_ARMY_BONUS_AIR_SUPERIORITY_FACTOR$：§G-15%§! "
 ETH_the_fetno-derash: "菲諾-德拉什"
 ETH_the_fetno-derash_desc: "情報工作的重要性不僅僅體現在戰場上，在維護我國政治領導層的安全方面也越來越重要。我們將成立一個專業化的情報機構來維護我們的安全，並更好地瞭解我們的敵人。"
 ETH_debre_zeyit_air_force_training_center: "[ETHGetAirBaseName]空軍訓練中心"
 ETH_debre_zeyit_air_force_training_center_desc: "駕駛飛機這項任務本身就極為艱鉅。駕駛著它們進入戰鬥毫無疑問需要更多的專業知識。為了確保我們的飛行員能夠勝任這項任務，我們將建立一個專業化的空軍訓練中心並開始標準化他們的訓練。"
 ETH_debre_zeyit_air_force_training_center_tt: "§Y[GetEthiopianAirforceSpiritName]§!追加效果：\n$MODIFIER_AIR_DOCTRINE_COST_FACTOR$：§G-25%§! "
 ETH_unlock_spirit_airforce_tt: "解鎖§Y$air_force_spirit$§!"
 ETH_purchase_obsolete_ships: "購買老舊軍艦"
 ETH_purchase_obsolete_ships_tt: "解鎖從主要國家購買老舊軍艦的決議。"
 ETH_purchase_obsolete_ships_desc: "儘管我們的海軍發展正在穩步前進，但目前我們還沒有能力部署一支足以保衛我們海岸線的艦隊。不過，我們也許可以從別的國家手中採購一些舊式艦船提供給我們的艦隊。"
 ETH_new_weapons_and_tactics: "新式武器和戰術"
 ETH_new_weapons_and_tactics_desc: "為了跟上他國軍隊的技術進步，我們需要維持對軍隊的長期投資，確保他們的訓練與軍備水平始終足以應對最新的威脅。"
 ETH_old_reliable: "寶刀未老"
 ETH_old_reliable_desc: "與許多軍隊現役的那些過於複雜的裝置相比，簡單，可靠且可維修的武器在前線往往更受歡迎。既然我們的部隊已經知道如何使用舊式步槍，為什麼還要浪費時間和資源來訓練他們使用新式步槍呢？"
 ETH_old_reliable_tt: "§Y[GetEthiopianArmySpiritName]§!追加效果：\n $MODIFIER_MAX_DIG_IN$：§G+0.5§!\n $MODIFIER_DIG_IN_SPEED_FACTOR$：§G+25%§!\n $modifier_army_sub_unit_infantry_attack_factor$：§G+5%§!\n $modifier_army_sub_unit_infantry_defence_factor$：§G+10%§!\n $modifier_army_sub_unit_infantry_speed_factor$：§G+10%§!"
 ETH_bring_in_foreign_advisors: "引進外國顧問"
 ETH_bring_in_foreign_advisors_desc: "儘管我們對[ETH.GetAdjective]空軍的建設進展順利，但我們缺乏關鍵的一手經驗來讓我們的飛行員發揮最好的水準。因此，我們將引入外國顧問並指導我們進步的方向。"
 ETH_bring_in_foreign_advisors_tt: "§Y[GetEthiopianAirforceSpiritName]§!追加效果：\n $MODIFIER_ENEMY_ARMY_BONUS_AIR_SUPERIORITY_FACTOR$：§G-5%§!\n $MODIFIER_AIR_DOCTRINE_COST_FACTOR$：§G-5%§!\n $MODIFIER_AIR_ACCIDENTS$：§G-15%§!  "
 ETH_available_as_air_chief_tt: "可擔任空軍部長："
 ETH_ethiopian_officers: "[ROOT.GetAdjective]軍官"
 ETH_ethiopian_officers_desc: "隨著[ETH.GetAdjective]空軍的發展壯大，我們必須確保我們擁有能夠有效協調飛行員的軍官們。與其依賴外國的臨時顧問，不如讓我們從頭開始發展我們自己的專業知識。"
 ETH_ethiopian_officers_tt: "§Y[GetEthiopianAirforceSpiritName]§!追加效果：\n $MODIFIER_AIR_ATTACK$：§G+15%§!"
 ETH_promote_the_war_heroes: "宣傳戰爭英雄"
 ETH_promote_the_war_heroes_desc: "我們之所以擁有長久的自由，都要歸功於在戰場上冒著生命危險的英雄們。為了讓戰士和人民保持高昂的士氣和對軍隊的支持，我們將授予戰爭英雄們崇高的嘉獎和地位。"
 ETH_expand_the_officer_corps: "擴編軍官團"
 ETH_expand_the_officer_corps_desc: "長期以來，缺乏對學識和才華的追求與認同一直是我國武裝力量中的一個致命問題。為了確保那些最具有才華和經驗的人能夠領導我們的軍隊，我們需要擴編我們的軍官團隊，並讓那些依靠裙帶關係上位的人離開職位。"
 ETH_medal_gain_tt: "當獲得勳章時，師指揮官獲得的經驗增加：§G+75%§!"
 ETH_officer_promotion_boost_tt: "所有將來被晉升為§Y將軍§!的§Y軍官§!將獲得§G+1進攻§!和§G+1防禦§!"
 ETH_the_common_soldier: "普通的士兵們"
 ETH_the_common_soldier_desc: "如果沒有那些每天冒著生命危險而不求回報與認可的普通士兵們，那麼這支軍隊什麼也做不成。這些英雄們為我們集體的安全奉獻出了自己的一份力量，他們理當因此而受到尊敬。"
 ETH_develop_the_capital_region: "開發[271.GetName]"
 ETH_develop_the_capital_region_desc: "我們必須加快工業化的進程，藉此改善民生並加強對[ETH.GetNameDef]的保護。因此，我們將在[ETH.Capital.GetCapitalVictoryPointName]周邊地區開展投資，將其打造成[ETH.GetName]的產業核心。"
 ETH_develop_the_capital_region_tt: "解鎖擴大電網至整個[271.GetName]的決議。"
 ETH_the_state_bank_of_ethiopia: "[ETH.GetNonIdeologyName]國家銀行"
 ETH_the_state_bank_of_ethiopia_desc: "通過擴大[ETH.GetName]國家銀行可用的資源，我們可以為人們提供一種新的信貸制度，併為陷入困境的[ETH.GetAdjective]經濟打上一劑強心針。"
 ETH_the_state_bank_of_ethiopia_tt: "§Y$ETH_corrupt_bureaucracy_dynamic_modifier$§!追加效果：\n$MODIFIER_RESEARCH_SPEED_FACTOR$：§G+5%§!\n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$：§G+5%§!"
 ETH_infrastructure_projects: "基建工程"
 ETH_infrastructure_projects_desc: "[ETH.GetName]有許多被全世界覬覦的自然資源。然而，若是沒辦法將它們運進工廠或是運到國外，我們是無法利用這些資源的。我們必須迅速擴建基礎設施，解決這個經濟發展的阻礙。"
 ETH_rebuilding_the_country_idea: "重建國家"
 ETH_cie: "[GetEthiopianRailwayName]"
 ETH_cie_imperial: "埃塞俄比亞帝國鐵路公司"
 ETH_anarchist_bank: "非洲共同體銀行"
 ETH_central_bank: "非洲中央銀行"
 ETH_GuardsNameCommunist: "革命衛隊"
 ETH_GuardsNameDefault: "帝國近衛"
 ETH_GuardsNameDemocratic: "國民警衛隊"
 ETH_SefariNameCommunist: "革命軍"
 ETH_SefariNameDemocratic: "國防軍"
 ETH_SefariNameDefault: "皇家衛隊"
 ETH_cie_anarcho_communist: "[ETH.GetAdjective]鐵路集體"
 ETH_cie_stalinist: "[ETH.GetAdjective]鐵路委員會"
 ETH_cie_fascist: "埃塞俄比亞帝國鐵路"
 ETH_host_nation_name: "[?ETH.host_nation.GetNameWithFlag]"
 ETH_host_nation_fallback_name: "東道國"
 ETH_second_italo_ethiopian_war_flag: "第二次意埃戰爭"
 ETH_infrastructure_projects_tt: "§Y$ETH_state_development_dynamic_modifier$§!追加效果：\n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$：§G+10%§!"
 ETH_state_owned_industry: "國有產業"
 ETH_state_owned_industry_desc: "我們可以清楚地從世界大國那裡看到，那些干涉自由市場的政府通過控制生產和減少失業率取得了驚人的經濟效益。我們將按圖索驥通過國有化工業快速擴大經濟。"
 ETH_state_owned_industry_tt: "§Y$ETH_state_development_dynamic_modifier$§!追加效果：\n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$：§G+20%§!\n$MODIFIER_LOCAL_BUILDING_SLOTS$：§G+20%§!"
 ETH_encourage_local_development: "鼓勵本地化發展"
 ETH_encourage_local_development_desc: "沒有人能夠完美的預測整個經濟系統的需求，而自以為是的認為能夠掌控全局則更是危險的。我們將讓各個地區按照自己的想法發展。畢竟，地方政府和當地企業才最瞭解當地的實際需求。"
 ETH_encourage_local_development_tt: "§Y$ETH_state_development_dynamic_modifier$§!追加效果：\n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$：§G+10%§!\n$MODIFIER_LOCAL_BUILDING_SLOTS$：§G+10%§!"
 ETH_encourage_local_development_2_tt: "地方政府將開始自我改善。"
 ETH_a_port_of_our_own: "我們自己的港口"
 ETH_a_port_of_our_own_desc: "最近獲取的海岸土地給了我們一個建設自己的港口，從而顯著提高我國參與國際市場能力的機會。這將使進出口物資更加方便，極大地促進我們的經濟。"
 ETH_expanding_the_railway_network: "擴大鐵路網"
 ETH_expanding_the_railway_network_desc: "鐵路是工廠，國內與國際貿易中資源運輸至關重要的一環。通過擴大鐵路網絡，我們可以極大的提升我們的資源運輸能力。這也將為[ETH.GetName]各地的人民們提供更多搬遷到成長中的工業城市的機會。"
 ETH_taxing_the_nobility: "[ETH_GetSeizeAssetsTitle]"
 ETH_taxing_the_nobility_desc: "[ETH_GetTaxNobilityDesc]"
 ETH_expand_tax_exemptions: "[ETH_GetTaxExemptionTitle]"
 ETH_expand_tax_exemptions_desc: "[ETH_GetTaxExemptionDesc]"
 ETH_expand_tax_exemptions_tt: "§Y$ETH_corrupt_bureaucracy_dynamic_modifier$§!追加效果：\n$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY$：§R-5%§!\n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$：§R-5%§!"
 ETH_reform_the_currency: "貨幣改革"
 ETH_reform_the_currency_desc: "儘管近年來[ETH.GetAdjective]紙幣的流通性有所增加，但許多人在[ETH.GetName]進行交易時仍然更傾向於使用他國貨幣。我們需要改革比爾，使其在國內外更受歡迎。"
 ETH_increased_factory_output: "工廠增產"
 ETH_increased_factory_output_desc: "隨著世界局勢越來越危險，我們需要提升工廠的裝備產量來確保軍隊能對外國侵略者產生足夠的威懾。"
 ETH_increased_factory_output_tt: "§Y$ETH_industrialization_dynamic_modifier$§!追加效果：\n$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY$：§G+10%§!"
 ETH_adapt_and_improve: "適應與改進"
 ETH_adapt_and_improve_desc: "通過諮詢軍方，產業領導者們能夠獲得戰場上真正需要的專業知識，並將其提供給工程師們。這將防止我們供應給部隊不合適的裝備，並使得軍方能夠迅速提出改進建議。"
 ETH_adapt_and_improve_tt: "§Y$ETH_industrialization_dynamic_modifier$§!追加效果：\n$MODIFIER_LAND_EQUIPMENT_UPGRADE_XP_COST$：§G-25%§!\n$MODIFIER_AIR_EQUIPMENT_UPGRADE_XP_COST$：§G-25%§!"
 ETH_the_state_court: "國家法院"
 ETH_the_state_court_desc: "[ETH.GetName]的法律體系源自幾個世紀以來的古老司法實踐。隨著改革浪潮的到來，是時候在憲法的基礎上撰寫更多的法律，並建立一個現代化的國家法院來審理國家級別的案件。"
 ETH_the_state_court_tt: "§Y$ETH_corrupt_bureaucracy_dynamic_modifier$§!追加效果：\n$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY$：§G+5%§!\n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$：§G+10%§!\n$MODIFIER_RESEARCH_SPEED_FACTOR$：§G+10%§!"
 ETH_ethiopian_shipbuilding: "[ROOT.GetAdjective]造船業"
 ETH_ethiopian_shipbuilding_desc: "既然我們已經建成自己的港口，奠定建設並維持我國海軍事業的基礎也就成了合理的期望。為了維持通往全球的航線，我們肯定會需要自己的艦艇。"
 ETH_connecting_the_south: "連通南方"
 ETH_connecting_the_south_desc: "[ETH.GetName]的南部地區與首都地區的連接被山地所阻斷。為了讓該地區順利融入快速發展的經濟當中，我們必須用鐵路將其連接到工業核心地帶。"
 ETH_bomb_proofing: "空襲預防措施"
 ETH_bomb_proofing_desc: "維持充足的工業能力對戰時的現代軍隊之至關重要。空軍對敵國工業心臟地帶的破壞將會成為未來衝突中的決定性因素。因此，我們必須確保我們的工廠能夠承受住這種攻擊。"
 ETH_bomb_proofing_tt: "§Y$ETH_industrialization_dynamic_modifier$§!追加效果：\n$MODIFIER_INDUSTRY_AIR_DAMAGE_FACTOR$：§G-10%§!\n$MODIFIER_INDUSTRY_REPAIR_FACTOR$：§G+10%§!\n$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY$：§G+5%§!"
 ETH_rapid_industrial_expansion: "加速工業擴張"
 ETH_rapid_industrial_expansion_desc: "儘管我國英勇無畏的人民為保家衛國付出了巨大的努力，但如果我們不想亡國滅種，就必須擁有更強大的工業能力。因此，我們將加快經濟計劃的進程，並追求更迅速的工業擴張。"
 ETH_rapid_industrial_expansion_tt: "§Y$ETH_industrialization_dynamic_modifier$§!追加效果：\n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$：§G+10%§!"
 ETH_develop_the_horn_of_africa: "發展非洲之角"
 ETH_develop_the_horn_of_africa_desc: "非洲之角地區裡存在著大量的人民，資源與潛力。通過與地方政府進行經濟層面的合作，我們將能夠以互惠互利的方式開發當地的潛力。"
 ETH_develop_the_horn_of_africa_tt: "解鎖§Y決議§!發展位於非洲之角的獨立國家或[ROOT.getAdjective]的附屬國，且有可能將其整合。"
 ETH_horn_of_africa_tt: "解鎖成立非洲之角的§Y決議§!。"
 ETH_invest_tt: "解鎖地區投資§Y決議§!"
 ETH_invest_in_the_north: "投資北部"
 ETH_invest_in_the_north_desc: "機械化生產正在[ETH.GetName]北部逐漸發展。我們應該追加投資來幫助這個成長中的產業進行發展。"
 ETH_invest_in_the_east: "投資東部"
 ETH_invest_in_the_east_desc: "通過對東部的投資，我們可以利用當地歷史悠久的貿易網絡，將此地變為[ETH.GetName]的資源加工業中心，並準備好進行出口。"
 ETH_invest_in_the_west: "投資西部"
 ETH_invest_in_the_west_desc: "[ETH.GetName]的各個地區都含有豐富的資源。通過對西部地區的投資，我們可以快速提升服裝產業的工業化程度，並充分利用該領域現有的專業知識。"
 ETH_expand_the_coffee_industry: "擴大咖啡產業"
 ETH_expand_the_coffee_industry_desc: "全世界各地都不乏對咖啡的需求。作為這種美味興奮劑的主要來源之一，我們應該充分利用這種需求，投資咖啡產業來強化出口貿易。 "
 ETH_modernizing_the_industry: "工業現代化"
 ETH_modernizing_the_industry_desc: "近些年來，我們在工業產能方面取得了十足的進展。然而，隨著經濟的需求發生轉變和新的生產方式的出現，提高經濟產能仍將是個進行中的任務。為此，我們將努力將電力和其他的新生工業發展帶入整個[ETH.GetName]並繼續我們的經濟現代化。"
 ETH_modernizing_the_industry_tt: "區域內每個投資過的地區：\n 添加§G1§!§Y個建築位§!。\n區域內中某個投資過的地區：\n 添加§G1§!§Y座$industrial_complex$§!。"
 ETH_animal_husbandry: "畜牧業"
 ETH_animal_husbandry_desc: "馬和駱駝在[ETH.GetNameDef]的貨物分配與人員運輸中發揮著至關重要的作用。我們應該增加對畜牧業的投資，確保畜牧的供應和質量不會下降。"
 ETH_ethiopian_industrial_research_institute: "[ROOT.GetAdjective]工業研究所"
 ETH_ethiopian_industrial_research_institute_desc: "如果我們不希望在工業上長期落後於別的國家，我們就必須改進本國的研究機構。通過此舉，我們將開展我們自己的創新和研究，而非依賴於外國的思想和研究。"
 ETH_invite_foreign_prospectors: "邀請外國勘探者"
 ETH_invite_foreign_prospectors_desc: "我們的重心不應放在複製外國研究成果上，而應該專注於利用外國政府與企業的專業知識，從而幫助我們更好的利用國內豐富的自然資源。"
 ETH_invite_foreign_prospectors_tt: "解鎖在[ROOT.GetName]北部進行§Y$ETH_prospect_for_resources$§!的決議。需要§Y$excavation2$§!和多於§Y2§!座可用的§Y民用工廠§!。\n\n"
 ETH_invite_foreign_industrialists: "邀請外國[ETH_GetInvestorName]"
 ETH_invite_foreign_industrialists_desc: "近年來，我們極大的改善了我國的基礎設施與工業，使我們能更高效的利用自然資源。不過，邀請外國專家與實業家來到[ETH.GetName]仍然能夠幫助我們加快工業的進展。"
 ETH_invite_foreign_industrialists_tt: "如果目標國家§Y對[ETH.GetFlag][ETH.GetNameDef]的評價高於§!§G75§!，該國設計商將可用。\n\n§R啟用的設計商將會在其母國與[ETH.GetNameDef]發生戰爭時被解僱§!\n\n潛在國家包括：§Y[ENG.GetFlag][ENG.GetName]§!, §Y[FRA.GetFlag][FRA.GetName]§!, §Y[GER.GetFlag][GER.GetName]§!, §Y[JAP.GetFlag][JAP.GetName]§!, §Y[CZE.GetFlag][CZE.GetName]§!, §Y[SWE.GetFlag][SWE.GetName]§!"
 ETH_the_second_italo-ethiopian_war: "第二次意埃戰爭"
 ETH_the_second_italo-ethiopian_war_desc: "聖誕節攻勢未能帶來我們積急需的勝利。現在[ETH.GetLeader]是時候離開首都並親自前往軍隊指揮了。意大利人的侵略企圖必須被遏制！"
 ETH_the_second_italo-ethiopian_war_tt: "§Y$ETH_haile_selassie$§!將成為可用的陸軍元帥"
 ETH_renewed_offensive: "二度攻勢"
 ETH_renewed_offensive_desc: "意大利人也許正試圖重新掌控主動權。但這意味著他們將對我們的突襲毫無防備。我們應該主動出擊，而非被動防禦。"
 ETH_renewed_offensive_tt: "步兵攻擊：§G+10%§!\n非正規軍攻擊：§G+10%§!\n部隊防禦：§R-5%§!"
 ETH_renewed_offensive_tt_1: "§Y$ETH_army_1_dynamic_modifier$§!追加效果：\n"
 ETH_falling_back: "撤退"
 ETH_falling_back_desc: "我們的前線正在迅速動搖，同時我們的補給阻力越來越大，有序的撤退到[ROOT.Capital.GetCapitalVictoryPointName]也許是一個明智的選擇，但是我們必須謹慎，以免演變成從戰場上的潰逃。"
 ETH_falling_back_tt: "意大利部隊在埃塞俄比亞控制的邊境地區受到60日的移動和攻擊懲罰。"
 ETH_northern_thrust: "北上"
 ETH_northern_thrust_desc: "我們的首要目標應該是佔領厄立特里亞。如果我們能切斷意軍與北方港口的聯繫，則他們將難以為部隊提供補給，我們就可以專心對付較為脆弱的南方戰線。"
 ETH_victory_in_the_desert: "大漠中的勝利"
 ETH_victory_in_the_desert_desc: "歐加登地區是意軍前線最為脆弱的部分。我們應該集中力量在此處擊敗他們，而後佔領他們的南部港口。此舉應當能夠解除我方後背的威脅，讓我們得以專注於厄立特里亞地區。"
 ETH_the_defense_of_addis_ababa: "亞的斯亞貝巴防線"
 ETH_the_defense_of_addis_ababa_desc: "亞的斯亞貝巴是我國曆史悠久的首都，同時也是埃塞俄比亞的工業中心。如果這座城市陷於敵手，則我們的努力與事業都將失敗。我們必須竭盡全力來保衛這座城市。"
 ETH_the_defense_of_addis_ababa_tt_1: "§Y$VICTORY_POINTS_5010$§!：\n"
 ETH_the_defense_of_addis_ababa_tt_2: "§Y$VICTORY_POINTS_8036$§!：\n"
 ETH_the_hindenburg_wall: "興登堡防線"
 ETH_the_hindenburg_wall_desc: "我們的土耳其顧問，$ETH_wehib_pasha$，想要在哈勒爾和德雷·達瓦之間修築一道防禦工事，就跟上次大戰中德國人修建的一樣。堅守該區域將使意大利人無法連接各地的戰線，並確保我們始終能夠通過吉布提港口進入大海。"
 ETH_the_hindenburg_wall_tt_1: "§Y$VICTORY_POINTS_7980$§!：\n"
 ETH_the_hindenburg_wall_tt_2: "§Y$VICTORY_POINTS_13249$§!：\n"
 ETH_mercenaries: "僱傭兵"
 ETH_mercenaries_desc: "有很多外國人出於各種原因想要加入我們的戰鬥。雖然大多數都是毫無價值的冒險分子，目的只是我們的錢；但我們仍然能夠從比屬剛果和阿拉伯招募一批僱傭兵。那些經驗豐富的戰士們將幫助我們打破僵局。"
 ETH_mercenaries_congo_tt: "如果§Y[838.GetName]§!和§Y[837.GetName]§!之一由友軍控制，添加§Y3個剛果僱傭軍單位§!。"
 ETH_mercenaries_arabia_tt: "如果§Y[843.GetName]§!和§Y[835.GetName]§!之一由友軍控制，添加§Y2個阿拉伯僱傭軍單位§!。"
 ETH_reach_out_to_the_world: "向國際社會請求援助"
 ETH_reach_out_to_the_world_desc: "世界必須得知[ROOT.GetName]正在發生什麼。面對佔據數量優勢的敵人，我們已經比常人抵抗了更久，甚至把一個歐洲主要勢力拖入泥潭。國際社會必須幫助我們對抗這種非法入侵！"
 ETH_a_last_stand: "背水一戰"
 ETH_a_last_stand_desc: "我們不能受困於挫折。作為最後的手段，我們可以撤退到$VICTORY_POINTS_13244$準備防禦。深入[ROOT.GetName]西部後，意大利人將難以保障軍隊的補給。"
 ETH_the_lessons_of_war: "戰爭的教訓"
 ETH_the_lessons_of_war_desc: "沒人知道該如何應對來自戰場的壓力，更何況是一個帝國，一個國家。儘管我們對現代戰爭的準備不足，但我們的軍隊已經從中吸取了慘痛的教訓，並準備好藉此成長。"
 ETH_the_lessons_of_war_tt: "§Y[GetEthiopianArmySpiritName]§!追加效果：\n$MODIFIERS_ARMY_DEFENCE_FACTOR$：§G+10%§! \n$MODIFIER_MAX_DIG_IN$：§G+2§!\n$MODIFIER_DIG_IN_SPEED_FACTOR$：§G+10%§!"
 ETH_arms_purchases: "採購軍火"
 ETH_arms_purchases_desc: "國際聯盟未能制止意大利的入侵，他們只決定對戰爭雙方實施武器禁運。他們肯定明白這對我們是比對[ITA.GetName]更沉重的打擊。我們應該堅決主張，作為合法的防守方，我們應當被允許從國際上購買武器。"
 ETH_arms_purchases_tt: "解鎖從國際武器交易商購買武器的決議。"
 ETH_request_embargo: "請求禁運"
 ETH_request_embargo_desc: "現有的禁運措施並未對[ITA.GetName]造成什麼實質性的傷害。國際聯盟已經準備好傾聽我們的訴求。我們應該專注於說服理事會將禁運擴大到足以對意大利造成實質傷害的程度。這將包括石油和鋼鐵，而這兩者對於他們的戰爭機器來說是不可或缺的。"
 ETH_international_brigades: "國際縱隊"
 ETH_international_brigades_desc: "現在不光是國際聯盟解除禁止派遣軍隊支援我國鬥爭之禁令的時刻，更是真正鼓勵成員國起身反對侵略者的時刻！"
 ETH_league_of_nations_volunteer_resolution: "國際聯盟國際縱隊決議"
 ETH_closing_the_suez: "關閉蘇伊士運河"
 ETH_closing_the_suez_desc: "國際聯盟應當迫使[453.Owner.GetNameDef]關閉蘇伊士運河來阻斷[ITA.GetAdjective]的航運。這將會沉重打擊[ITA.GetAdjective]的戰爭機器，讓我們能在更平等的情況下與之對抗。"
 ETH_international_mediation: "國際調停"
 ETH_international_mediation_desc: "國際聯盟不應當長期坐視兩個成員國之間的衝突。他們必須採取行動並迫使[ITA.GetName]撤退到戰前的邊境。"
 ETH_international_mediation_tt: "[ITA.GetName]和[ETH.GetName]將會簽署無條件和平。\n "
 ETH_rally_around_the_emperor: "團結在皇帝周圍"
 ETH_rally_around_the_emperor_desc: "[ETH.GetLeader]陛下是維繫我們多元帝國的核心。值此國難之際，[ETH.GetName]人民正處在水深火熱之中，我們必須放下彼此之間不值一提的恩怨，團結在陛下的身後。"
 ETH_rally_around_the_emperor_tt: "解鎖為埃塞俄比亞§Y流亡政府§!設置一個潛在§Y東道國§!的決議"
 ETH_support_spain_static_modifier: "援助西班牙"
 ETH_boarding_the_train: "登上火車"
 ETH_boarding_the_train_desc: "我們的防線正在崩潰，除非有奇蹟的出現，否則[ETH.GetName]註定將不復存在。儘管許多顧問正為王位空懸所帶來的影響而爭論不休，但國王[ETH.GetLeader]陛下已經決定前往日內瓦，為我國在國際聯盟的主張爭取國際支持。"
 ETH_boarding_the_train_tt: "§Y$ETH_haile_selassie$§!將離開[ROOT.GetName]，前往國際聯盟。如果埃塞俄比亞投降，$ETH_haile_selassie$將組建一個§Y流亡政府§!。"
 ETH_has_host_nation_tt: "已為流亡政府設置一個潛在的§Y東道國§!\n"
 ETH_the_emperor_stays: "陛下與我們同在"
 ETH_the_emperor_stays_desc: "儘管顧問們正極力勸諫，[ETH.GetLeader]陛下依然英勇的決定留在[ETH.GetName]，與他勇敢的戰士一同抗爭。希望他能在帝國的至暗時刻為我們帶來勝利。"
 ETH_the_american_radio_address: "美國廣播演講"
 ETH_the_american_radio_address_desc: "戰爭暴行一再發生，國聯條例屢遭褻瀆。所有熱愛和平的人只有合作才能堅定地維護法制與和平，才能防止魔鬼的精神支配人類。"
 ETH_the_patriots: "愛國者"
 ETH_the_patriots_desc: "雖然戈賈姆地區的愛國主義者曾對[ETH.GetName]帝國政府在該區域的計劃造成了很大的阻礙，但他們現在正在協助我們抵擋[ITA.GetAdjective]，阻止他們試圖徹底佔領該地區的企圖。我們應該盡我們所能的幫助這些愛國者們站穩腳跟，給[ITA.GetAdjective]軍隊找點麻煩。 "
 ETH_the_patriots_tt: "解鎖持續性國策§Y$ETH_supporting_the_arbegnoch$§!。\n在被敵人佔領的北部和中部埃塞俄比亞地區添加§G+10§!抵抗目標。"
 ETH_allow_fundraising_campaigns_tt: "解鎖開展皇家財庫籌款活動的§Y決議§!"
 ETH_patriot_resistance_tt: "愛國者聯盟的積極抵抗：§R+10%§!"
 ETH_addressing_the_league_of_nations: "致辭國際聯盟"
 ETH_addressing_the_league_of_nations_desc: "國聯理事會未能就[ITA.GetName]發動的征服戰爭採取任何行動，以及由此產生對侵略受害者坐視不管的政策，極大的威脅著國聯的存在。那些對此事作壁上觀的成員國記住，今天是我們，明天就輪到你們……"
 ETH_the_abuna: "阿布納"
 ETH_the_abuna_desc: "抵抗[ITA.GetAdjective]侵略者不僅是表達對皇帝的忠誠，更是一種美德。與$ETH_abuna_qerellos_iv$商議後，我們能向人民展示我們事業的正當性以及對他們以主的名義盡職盡責的需求。"
 ETH_the_lion_stands_firm: "雄獅寧死不屈"
 ETH_the_lion_stands_firm_desc: "奉猶大族得勝的獅子，皇帝陛下[ETH.GetLeader]已經證明了他是個合格的戰士。我們必須向我們的戰士們展現他們的皇帝與他們並肩作戰時的力量以召集部隊，並證明[ITA.GetAdjective]的戰爭機器並不是戰無不勝的。"
 ETH_the_lion_stands_firm_tt: "\n§Y$ETH_army_1_dynamic_modifier$§!追加效果：\n$modifier_army_sub_unit_irregular_infantry_max_org_factor$：§G+5%§!"
 ETH_unification_of_the_habesha: "統一哈貝莎"
 ETH_unification_of_the_habesha_desc: "與[ITA.GetName]的戰爭給我們的基礎設施造成了難以想像的破壞，人民正生活在水深火熱之中。僅僅收復我們的國土遠遠不夠。我們將向[ITA.GetAdjective]提出更進一步的要求，包括統一哈貝莎人民。"
 ETH_the_ferengi: "佛瑞吉人"
 ETH_the_ferengi_desc: "雖然國際聯盟對我們要求援助的呼籲反應遲緩，但只要我們出錢，就不缺願意為我們的事業而戰的外國人。"
 ETH_the_ferengi_tt: "解鎖使用皇家財庫資金招募僱傭兵的§Y決議§!。"
 ETH_recruit_from_the_african_diaspora: "招募非裔士兵"
 ETH_recruit_from_the_african_diaspora_desc: "全世界的非洲裔人民不願眼睜睜的看著非洲最後的獨立火種消失，他們願意拿起武器與我們並肩作戰。團結一致，我們不只是在拯救[ETH.GetName]，更是在拯救全非洲獨立自由的信念。"
 ETH_anti-italian_propaganda: "反意宣傳"
 ETH_anti-italian_propaganda_desc: "儘管我們十分感激東道國的招待讓皇帝有了安全的棲身地，但他們本來可以做更多事促進從法西斯佔領中解放我們人民的事業。我們要讓他們完全瞭解[ITA.GetAdjective]蹂躪[ETH.GetName]人民的慘狀，並鼓動他們加入我們終將來臨的解放戰爭。"
 ETH_black_lions_resistance_tt: "黑獅組織的積極抵抗：§R+10%§!"
 ETH_unlock_black_lions_tt: "解鎖持續性國策§Y$ETH_strengthen_the_black_lions$§!。\n在被敵人佔領的南部埃塞俄比亞地區添加§G+10§!抵抗目標。"
 ETH_the_heroes_of_ethiopia: "埃塞俄比亞的英雄"
 ETH_the_heroes_of_ethiopia_desc: "我們許多的軍隊領導人都被證明是優秀的戰略家。儘管敵人擁有著壓倒性的物質優勢，但我們的軍隊領袖們已經成功的阻止了他們的進軍。我們必須獎勵這些英雄們為保衛[ETH.GetNameDef]之存續所做出的貢獻。"
 ETH_seyoum_mengesha_upgrade_tt: "獲得：\n§Y$army_regrouping_2$§!"
 ETH_mulugeta_yeggazu_of_illubabor_upgrade_tt: "獲得：\n§Y$army_chief_morale_3$§!"
 ETH_ras_imru_haile_selassie_upgrade_tt: "獲得：\n§Y$army_infantry_2$§!"
 ETH_the_heroes_of_ethiopia_tt: "\n§Y$ETH_army_1_dynamic_modifier$§!追加效果：\n$modifier_army_sub_unit_irregular_infantry_attack_factor$：§G+5%§!\n$modifier_army_sub_unit_irregular_infantry_speed_factor$：§G+5%§!"
 ETH_learning_from_the_enemy: "師敵長技"
 ETH_learning_from_the_enemy_desc: "儘管我們的工業能力較為有限，但我們可以利用[ITA.GetAdjective]的技術優勢，通過對他們的載具和裝備進行逆向工程，做到師夷長技以制夷。"
 ETH_learning_from_the_enemy_tt: "§Y$ETH_industrialization_dynamic_modifier$§!追加效果：\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$：§G+10%§!"
 ETH_learning_from_the_enemy_armor: "師敵長技：裝甲單位"
 ETH_learning_from_the_enemy_air: "師敵長技：飛行器"
 ETH_light_tank_tt: "創建§Y$light_tank_chassis_1$§!的衍生型：§Y[ITA.GetFlag] L3/35§!"
 ETH_aircraft_tt: "創建§Y$small_plane_airframe_0$§!的衍生型：§Y[ITA.GetFlag] CR.32§! \n 創建§Y$medium_plane_airframe_0$§!的衍生型：§Y[ITA.GetFlag] Ca.101§!"
 ETH_organize_regional_revolts: "組織地方叛亂"
 ETH_organize_regional_revolts_desc: "[ITA.GetAdjective]尚未在我們的家園裡建立穩固的統治。佔領區的抵抗正在逐漸耗盡他們的裝備，人力以及他們對血腥殖民這一行徑的熱忱。我們必須繼續協調抵抗組織，協助他們推翻[ITA.GetAdjective]的非法佔領。"
 ETH_organize_regional_revolts_tt: "解鎖在佔領地區組織起義軍的§Y決議§!。"
 ETH_secure_arms: "確保武器供應"
 ETH_secure_arms_desc: "[ETH.GetName]的薄弱工業顯然無法支撐一支軍隊。我們必須動用皇家財庫中的財富來武裝我們英勇的戰士們。"
 ETH_secure_arms_tt: "解鎖使用皇家財庫資金購買軍事裝備的§Y決議§!。"
 ETH_volunteers: "志願軍"
 ETH_volunteers_desc: "世界各地被壓迫的人民將[ETH.GetName]視為反抗帝國主義侵略的希望與象徵。現在，來自國界之外的人們將團結在[ETH.GetAdjective]的旗幟下，與我們並肩作戰。似乎仍有些人不願看到自由的夢想僅因[ITA.GetLeader]的一時興起而被扼殺在搖籃裡。"
 ETH_fait_accompli: "既成事實"
 ETH_fait_accompli_desc: "儘管許多人都認為[ETH.GetName]將成為殖民主義時代的一個可憐註腳，但它成功克服了壓倒性的劣勢，不僅擊退了[ITA.GetAdjective]的入侵，還將[ITA.GetName]徹底驅逐出了東非。剩下要做的就是讓[ITA.GetAdjective]正式承認他們的失敗。"
 ETH_fait_accompli_tt: "§Y[ITA.GetNameWithFlag]§!將會和§Y[ROOT.GetNameWithFlag]§!達成和平，同時割讓任何被[ROOT.GetNameDef]所佔領的非洲地區。\n "
 ETH_reclaiming_ethiopia: "光復埃塞俄比亞"
 ETH_reclaiming_ethiopia_desc: "我們正逐漸讓東道主正式承認[ETH.GetLeader]為[ETH.GetName]的合法統治者，即使我們的家園正遭到[ITA.GetName]的非法侵佔。只需要再輕輕的推波助瀾一下，我們期盼已久的解放運動就將開始。"
 ETH_reclaiming_ethiopia_not_exile_tt: "\n如果不是流亡政府："
 ETH_reclaiming_ethiopia_exile_tt: "如果[ROOT.GetName]政府正在流亡："
 ETH_haile_selassie_returns_tt: "$ETH_haile_selassie$重歸[ETH.GetName]："
 ETH_reclaiming_ethiopia_event_tt: "§Y[GetEthiopianHostName]§!："
 ETH_formal_request_unlocked_tt: "如果我國政府目前正在流亡，解鎖正式要求東道主國家加入戰爭的§Y決議§!。"
 ETH_ethiopia_recognized_tt: "[ROOT.GetLeader]已經被認為是[ROOT.GetNameDef]的真正統治者：\n §Y[ROOT.GetName]§!現在可以召喚盟友參戰。"
 ETH_the_heir_of_solomon: "所羅門的繼承者"
 ETH_the_heir_of_solomon_desc: "[ENG.GetName]在巴勒斯坦製造了一個火藥桶般的局勢，導致國際聯盟不再支持他們對此地的治理授權。也許他們會願意將此地的治理任務移交給他人？而還有誰會比所羅門王的正統後裔[ETH.GetLeader]更加合適呢？"
 ETH_protector_of_the_somalis: "索馬里人的保護者"
 ETH_protector_of_the_somalis_desc: "[SOM.GetAdjective]遭到了[ITA.GetAdjective]的野蠻統治，不僅被強徵入伍，甚至還要為了[ITA.GetLeader]的侵略擴張與自己的人民作戰。當[ITA.GetName]被逐出這片土地時，我們有義務保護[SOM.GetAdjective]免受任何歐洲強權的剝削。"
 ETH_the_king_of_kings: "萬王之王"
 ETH_the_king_of_kings_desc: "[ETH.GetLeader]陛下將我們從淪為[ITA.GetAdjective]僕從的可悲命運中拯救出來。他是現代世界中無與倫比的偉大領袖，應當受到人們的敬仰。"
 ETH_rebuilding_the_country: "重建國家"
 ETH_rebuilding_the_country_desc: "在我們重獲對家園的控制之後，我們終於能夠開始修復[ITA.GetAdjective]對我們的家園與工業造成的傷害。"
 ETH_support_anti-colonialist_resistance: "支援反殖民主義鬥爭"
 ETH_support_anti-colonialist_resistance_tt: "解鎖強化§Y東非§!殖民地抵抗運動的§Y決議§!。"
 ETH_support_anti-colonialist_resistance_desc: "如果殖民主義列強們在東非站穩腳跟，戰爭的威脅將使我們永世不得安寧。我們必須喚醒民眾的抗爭意識，在他們爭取獨立的過程中將列強們趕出這片土地。"
 ETH_empower_the_ras: "賦權王公"
 ETH_empower_the_ras_desc: "進一步賦予帝國內那些缺乏教育的農民們權利只會破壞帝國延續千年的體制。相反，我們將授予親王公爵們更多的權利以確保他們對皇帝的忠誠。"
 ETH_re-convene_the_parliament: "重新召集議會"
 ETH_re-convene_the_parliament_desc: "是時候恢復1931憲法並重啟[ETH.GetName]行政機構現代化的進程了。我們將重新召集帝國議會並增設代表席位，以便更好的管理帝國的各個區域。  "
 ETH_unite_the_afar: "統一阿法爾"
 ETH_unite_the_afar_desc: "當歐洲人專注於歐洲事務時，我們或許能夠通過購買[DJI.GetName]地區來贏得阿法爾人民的支持，並在重新統一分裂了幾十年的阿法爾地區。"
 ETH_lord_of_lords: "萬主之主"
 ETH_lord_of_lords_desc: "雖然我們的帝國由多種文化共同組成，但我們都效忠於同一位萬主之主。即使是最有權勢的貴族領主也知道他們對皇帝負有的責任。陛下是這片土地無可爭議的統治者。"
 ETH_elect_of_god: "上帝的選民"
 ETH_elect_of_god_desc: "我們皇帝的一舉一動之間都如有神助。否則我們該如何解釋陛下在戰場上的神勇無雙與他對我們偉大帝國英明神武的統治呢？人們都知道，皇帝的命令就是全知全能的旨意。"
 ETH_restore_the_empire_of_axum: "重建阿克蘇姆帝國"
 ETH_restore_the_empire_of_axum_desc: "近至蘇丹，遠至阿拉伯半島，都曾是我們祖先治下的土地。幾個世紀以來，我們的統治日漸衰弱，使我們在歐洲人面前脆弱不堪。是時候逆轉這一切了。我們將擁抱先祖留下的遺產，收回曾經的土地並重建阿克蘇姆帝國。"
 ETH_restore_the_empire_of_axum_tt: "解鎖在我們控制了足夠的土地後重建阿克蘇姆帝國的§Y決議§!。"
 ETH_a_federal_empire: "聯邦制帝國"
 ETH_a_federal_empire_desc: "相比於議會民主體制的混亂不堪，帝國的統治體系能帶來遠超前者的穩定性。只要各個區域的貴族領主繼續效忠[ETH.GetLeader]陛下，我們並不在乎他們會如何治理他們的封地。"
 ETH_a_federal_empire_tt: "將§Y$ETH_state_decentralization_dynamic_modifier$§!修正從所有地區移除。"
 ETH_federal_factories_tt: "為每一個釋放的傀儡添加§Y1個建築位§!和§Y1座$industrial_complex$§!。"
 ETH_empower_the_chambers: "賦予議院權力"
 ETH_empower_the_chambers_desc: "1931年憲法並未明確編纂皇帝陛下的地位。也未能將人民充分地納入政府的決策流程。我們需要賦予眾議院更多權利以便其更好的管理國家事務，並且保證皇帝的神聖地位。"
 ETH_empower_the_chambers_tt: "§Y$ETH_corrupt_bureaucracy_dynamic_modifier$§!追加效果：\n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$：§G+5%§!"
 ETH_the_african_union: "非洲聯合之路"
 ETH_the_african_union_desc: "我們要求殖民主義應該被終結，因為一個人被另一個人統治的做法是完全錯誤的。如果我們想讓非洲人民重新站起來，那麼非洲人民在各種問題上的一致行動則是刻不容緩的。因此，我們將會以正直和來自靈魂深處的信念投入整個非洲大陸的解放的鬥爭中。"
 ETH_african_independence_tt: "解鎖增加非洲殖民地抵抗強度和自治度獲取的§Y決議§!。"
 ETH_arabian_independence_tt: "解鎖增加阿拉伯半島殖民地抵抗強度和自治度獲取的§Y決議§!。"
 ETH_african_independence_join_tt: "允許§Y[ROOT.GetNameDef]§!介入非洲國家的獨立戰爭。"
 ETH_african_union_faction: "非洲聯盟"
 ETH_pan-africanism: "泛非主義"
 ETH_pan-africanism_desc: "正如從近代非洲歷史中能夠常常發現的一樣，我們所追求的平等目標應該是反對一個人對另一個人的剝削。無論這個惡魔採用什麼樣的偽裝，在它存在的地方，我們應盡力躲開它的侵襲，而在它存在的地方，應該堅決摧毀它。為了那些不被正眼相待的人民的平等的奮鬥是我們神聖的職責。"
 ETH_the_one_true_heir_of_solomon: "所羅門的真正繼承者"
 ETH_the_one_true_heir_of_solomon_desc: "[ETH.GetLeader]皇帝陛下有著可以追溯的偉大的所羅門王的皇家血脈。當許多國家都背離了上帝，我們，[ETH.GetAdjective]，仍然有著堅定的信仰。在這個混亂的年代，所羅門的真正繼承者正應當奪取聖地，保衛其不受那些人造意識形態的腐化。"
 ETH_the_one_true_heir_of_solomon_tt: "解鎖建立所羅門帝國的§Y決議§!"
 ETH_jah: "耶和華"
 ETH_jah_desc: "拉斯塔法裡運動意想不到地建立了一個遍佈全球的[ETH.GetName]支持者的網絡。許多人認為我們的皇帝[ETH.Getleader]有著重要的宗教意義。有些人甚至宣稱他是上帝的化身，更確切地說，是耶和華。或許我們應該接受拉斯塔法裡運動，從而更好地利用國際社會對我們的支持。"
 ETH_jah_tt: "解鎖建立錫安帝國的§Y決議§!"
 ETH_military_communism: "軍事共產主義"
 ETH_military_communism_desc: "任何前線的勝利都是由於我們聰明且勇猛的普通士兵，而不是那些世襲而來的領導層。不滿的聲音越來越大。帝制已經完成了它的歷史使命。現在是靠武力再分配的時候了。"
 ETH_defending_our_homes: "保衛我們的家園"
 ETH_defending_our_homes_desc: "在[ROOT.Capital.GetCapitalVictoryPointName]的保皇派只關心他們自己的安全。然而，我們的家園和家庭卻被摧毀。我們不能再容忍如此事情發生，我們會保衛我們家園每一寸的土地，不是為了皇帝，而是為了我們自己。"
 ETH_anti_imperialist_agitation: "反帝制煽動"
 ETH_anti_imperialist_agitation_desc: "人民對[ROOT.GetLeader]的忠誠正在動搖。我們認為，在統治者沒有履行保衛人民這一最重要的職責之後，他們已經證明了自己的無能。在前線，在街道，那些曾經不敢想像的事現在在被公開討論——建立一個國家，一個沒有皇帝的國家。"
 ETH_in_the_name_of_the_people: "以人民的名義"
 ETH_in_the_name_of_the_people_desc: "以人民的名義，我們會摧毀統治[ROOT.GetName]幾個世紀的專制王朝。在它的廢墟之上，我們會建立一個工人共和國，將人民從封建主義的束縛中解放出來。並且通過我們共同的努力，打敗在非洲的法西斯主義。"
 EHT_in_the_name_of_the_people_tt: "在[ETH.Capital.GetCapitalVictoryPointName]獲得§Y兩個§!精英共產主義§Y赤衛隊§!和§Y三個§!精英安那其主義§Y黑獅部隊§!。\n\n§R$ETH_seyoum_mengesha$會不再可用§!"
 ETH_callout_to_the_world: "號召全世界"
 ETH_callout_to_the_world_desc: "反對法西斯主義的鬥爭並不是我國獨有的，而是更廣泛的全球反對獨裁統治鬥爭的一部分。我們要團結世界各地的反法西斯力量來為我們的事業奮鬥，因為如果今天被殘酷對待的是我們，那麼明天將會是整個世界。"
 ETH_callout_to_the_world_tt: "§Y$ENG_sylvia_pankhurst$§!和§Y$IA_emma_goldman$§!成為可用的顧問。"
 ETH_soviet_aid: "蘇聯援助"
 ETH_soviet_aid_desc: "我們成功擺脫了封建主義的枷鎖。現在我們必須打敗法西斯分子，並建立我們的工人共和國。如果說有誰會同情我們現在的遭遇，那肯定是[SOV.Getname]的人民。"
 ETH_soviet_aid_tt: "§R\n作為對援助的交換，[SOV.GetNameDefCap]會要求對我們國內事務更大的掌控權！§!"
 ETH_humanitarian_aid: "人道主義援助"
 ETH_humanitarian_aid_desc: "我們的敵人絲毫不在乎我們人民所遭受的痛苦。如果戰爭繼續下去，我們誓死捍衛的祖國將毀滅殆盡。全世界需要立刻看到在這裡發生的恐怖災難，我們需要他們提供的人道主義援助。"
 ETH_humanitarian_aid_tt: "§Y$ETH_international_red_cross_dynamic_modifier$§!追加效果：\n$MODIFIER_INDUSTRY_REPAIR_FACTOR$：§G+10%§!"
 ETH_support_from_the_japanese_communists: "日本安那其共產主義"
 ETH_support_from_the_japanese_communists_desc: "由於同為少數成功抵擋了歐洲殖民者的國家，[JAP.GetAdjective]和[ETH.GetAdjective]的人民長期以來一直相互尊重。隨著[ETH.GetNameDef]被從封建愚昧中解放出來，[JAP.GetNameDef]當中那些和我們有著共同理想的人，將會幫助我們創建一個模範的安那其共產主義社會。"
 ETH_support_from_the_japanese_communists_tt: "§Y$IA_sakutaro_iwasa$§!和§Y$IA_sanshiro_ishikawa$§!成為可用的顧問。"
 ETH_support_from_the_japanese_communists_fascist_tt: "§R可能會導致[JAP.GetFlag][JAP.GetName]發起針對[ETH.GetFlag][ETH.GetName]的禁運！§!"
 ETH_raise_from_the_ranks: "提拔軍官"
 ETH_raise_from_the_ranks_desc: "貴族再也不能掌管我們國家的軍事力量了。我們的許多勇敢的士兵已經證明他們有領導能力。是時候提拔勇士和有戰鬥技巧的人，而不是那些有著皇室關係或者個人財富的人了。"
 ETH_raise_from_the_ranks_tt: "添加§Y兩位§!新的§Y將軍§!。"
 ETH_soviet_rifles: "蘇聯步槍"
 ETH_soviet_rifles_desc: "我們在遭到[ITA.GetName]的襲擊時毫無準備。我國當前的工業能力無法滿足現代戰爭的後勤需求。我們需要為每一個有能力保家衛國的人配備步槍和彈藥。也許我們在[SOV.Capital.GetCapitalVictoryPointName]的朋友能夠提供一些幫助。 "
 ETH_soviet_rifles_tt: "\n如果[SOV.GetFlag]§Y[SOV.GetName]§!同意，[ETH.GetFlag]§Y[ETH.GetName]§!將收到§G10,000§!步兵裝備。"
 ETH_military_advisors: "蘇聯將領"
 ETH_military_advisors_desc: "雖然我們大部分的軍官已經適應了現代戰爭的需求，但是他們顯然很大程度上需要臨場發揮。我們可以從我們[SOV.GetAdjective]軍隊的同志那裡學到很多。"
 ETH_military_advisors_tt: "\n如果[SOV.GetFlag]§Y[SOV.GetName]§!接受協議，[ETH.GetFlag]§Y[ETH.GetName]§!會獲得一個陸軍元帥（§Y$SOV_semyon_budyonny$§!）和一位將軍（§Y$SOV_vasily_kuznetsov$§!）"
 ETH_international_brigades_communist: "國際縱隊"
 ETH_soviet_rejection_tt: "\n如果[SOV.GetFlag]§Y[SOV.GetNameDefCap]§!§R正處於內戰或拋棄了共產主義信仰，他們將極有可能拒絕該提議！§!"
 ETH_international_brigades_communist_desc: "世界各地存在著大量同情我們抵抗[ITA.GetAdjective]侵略的人。我們應該充分利用這種同情，讓他們拿起武器，與我們一同抗擊法西斯主義。"
 ETH_peoples_army_focus: "人民軍隊"
 ETH_peoples_army_focus_desc: "儘管我們在進行現代戰爭方面最初處於劣勢，但我們還是通過非常規戰術遲滯了[ITA.GetAdjective]的入侵。我們可以將這種戰術寫入我們的軍事學說，訓練我們的軍官如何進行一場非對稱戰爭。"
 ETH_the_new_administration: "新行政機構"
 ETH_the_new_administration_desc: "在最近的動亂中，許多人挺身而出保衛我們的國家。一些人，比如塞內度·格布魯，也擁有著大幅促進社會發展的技能和知識。現在，我們會給他們大展拳腳的機會。"
 ETH_the_new_administration_tt: "§Y塞內度·格布魯§!將成為可用的政治顧問。\n   $rebellious_educator_tt$\n兩個§Y隨機的§!人物也將成為可用的政治顧問。"
 ETH_clearing_the_skies: "捍衛領空"
 ETH_clearing_the_skies_desc: "我們的士兵完全暴露敵人的空軍之下，而沒有任何保護措施。更糟的是，敵人總是知道我們的軍隊的部署和調度。如果我們想要增加勝利的希望，我們就需要自己的空軍和對策。因此，我們應該讓一些志願者去[SOV.GetAdjective]空軍進行訓練。"
 ETH_clearing_the_skies_tt: "\n如果[SOV.GetFlag]§Y[SOV.GetName]§!接受，[ETH.GetFlag]§Y[ETH.GetName]§!會收到§G100§![SOV.GetAdjective]戰鬥機和§Y早期戰鬥機§!科技。"
 ETH_counter_the_armored_threat: "對抗裝甲部隊的威脅"
 ETH_counter_the_armored_threat_desc: "裝甲部隊顯然會取代騎兵再戰場上的地位。不幸的是，我們沒有足夠的方法來對抗[ITA.GetAdjective]裝甲部隊，並且我們的工業沒有能力來支持裝甲部隊的建造。或許[SOV.GetName]願意分給我們一點老式裝甲車？"
 ETH_counter_the_armored_threat_LaR_tt: "\n如果[SOV.GetFlag]§Y[SOV.GetName]§!接受，[ETH.GetFlag]§Y[ETH.GetName]§!會收到§Y戰間期裝甲車§!科技和§G480§!輛[SOV.GetAdjective]裝甲車。"
 ETH_counter_the_armored_threat_NoLaR_tt: "\n如果[SOV.GetFlag]§Y[SOV.GetName]§!接受，[ETH.GetFlag]§Y[ETH.GetName]§!會收到§Y戰間期型坦克§!科技和§G200§!輛[SOV.GetAdjective]坦克。"
 ETH_counter_the_armored_threat_NoNSB_tt: "\n如果[SOV.GetFlag]§Y[SOV.GetName]§!接受，[ETH.GetFlag]§Y[ETH.GetName]§!會收到§Y一戰坦克§!科技和§G200§!輛[SOV.GetAdjective]坦克。"
 ETH_peace_negotiations: "和平談判"
 ETH_peace_negotiations_desc: "我們的人民付出了巨大代價來阻止[ITA.GetAdjective]的侵略。現在我們已經向[ITA.GetAdjective]證明我們不會在他們之前崩潰。現在我們有取得和平的機會了，或者至少能簽訂一份停火協議。"
 ETH_soviet_mediation: "請求蘇聯調停"
 ETH_soviet_mediation_desc: "儘管我們英勇的人民為遲滯[ITA.GetAdjective]的入侵付出了巨大的努力，但還遠不足以戰勝他們。國際聯盟已經被證明不願幫助我們，因此[SOV.GetNameDefCap]將會是我們唯一的希望。"
 ETH_soviet_mediation_tt: "§R\n[SOV.GetNameDefCap]也許會嘗試控制我們，藉此展開與[ITA.GetName]的談判！§!"
 ETH_support_spain: "支援西班牙"
 ETH_support_spain_desc: "西班牙因為內部的法西斯分子而遭受了巨大的創傷。但那裡同樣有著許多跟我們一樣的人，法西斯主義必然會遭遇激烈的反抗，人民們同樣可以當家做主。我們將利用在與[ITA.GetAdjective]的戰爭中吸取的經驗和教訓來幫助[SPC.GetAdjective]的抵抗。"
 ETH_local_committees: "地方委員會"
 ETH_local_committees_desc: "我們現在有機會能夠創造一種全新的政府體制，擺脫那種必然會滋生腐敗，壓制人民自由意志的，毫無存在價值的等級制度。我們應當利用這個機會組織一個公社聯盟，每個公社都將處在安那其共產主義的原則指導下。"
 ETH_a_guiding_hand: "引導之手"
 ETH_a_guiding_hand_desc: "一個沒有權威，由各個公社組成的鬆散聯盟實在是過於理想主義。我們需要的是由人民代表與專家組成的內閣來引導我們的經濟政策，並對各種突發狀況做出迅速反應。我們絕不能在這場危機中重蹈帝國時期的覆轍。"
 ETH_transformation_of_nature: "改造自然"
 ETH_transformation_of_nature_desc: "[ETH.GetNameDefCap]蘊含豐富的可開採資源。通過在河流上建設水電大壩，我們可以為每戶人家提供電力。同時，我們可以利用水道來擴展我們的農業能力，為不斷增長的人口提供支持。"
 ETH_transformation_of_nature_tt: "（§Y隨機4個擁有的地區§!）：添加§G1§!個建築位"
 ETH_laying_the_tracks: "鋪設鐵軌"
 ETH_laying_the_tracks_desc: "我國大部分的人口和工業都聚集在了西部。因此，為了更好的利用我們豐富的自然資源，我們需要對鐵路網進行大規模擴展，從而將這些資源運往工廠。"
 ETH_red_army_engineers: "紅軍工程師"
 ETH_red_army_engineers_desc: "我國的許多基礎設施都在[ITA.GetAdjective]入侵期間遭到了破壞。如果我們想要建立一個真正的工人共和國，我們不僅需要重建這個國家，還需要啟動一個快速工業化的計劃。我們的紅軍同志們所擁有的技巧能夠幫助我們啟動這個過程。"
 ETH_liberate_aussa: "將革命帶向阿法爾"
 ETH_liberate_aussa_desc: "[AFA.GetNameDefCap]正在被一群兩面三刀的奸詐寡頭們統治著，他們甚至多次站到了我們的敵人那邊。我們不能再忽視這種針對[ETH.GetNameDef]的威脅。我們將解放[AFA.GetAdjective]的人民，並將該地區納入我們的工人共和國之中。"
 ETH_demand_DJI: "解放[268.GetName]"
 ETH_demand_DJI_desc: "隨著[AFA.GetName]的解放，我們治下存在著大量的阿法爾人。然而，由於[FRA.GetAdjective]對[DJI.GetName]的佔領，阿法爾人民事實上遭到了分裂。通過主張將阿法爾人民從帝國主義的統治下解放出來，我們也許能獲得阿法爾人民的認可與忠誠，並藉此獲得一個戰略港口。"
 ETH_the_rif: "解放裡夫"
 ETH_the_rif_desc: "許多正在西班牙爭權奪利的法西斯分子都曾是在北摩洛哥鎮壓裡夫共和國的士兵。通過與[SPC.GetName]的密切聯繫，我們將在曾身為他們殖民地的土地上推動去殖民化。如果他們是我們真正的同志，就一定會同意。倘若不是，我們同樣也知道該對殖民主義做什麼。"
 #ETH_social_reforms: "Social Reforms"
 #ETH_social_reforms_desc: "Without the threat of a common enemy to unite us, we often find ourselves divided due to historic, cultural and religious grievances. We need a wave of social reforms to overcome these divisions so that we can remain united and continue the process of building a better [ETH.GetName]."
 #ETH_social_reforms_tt: "Unlock anarcho-communist social reform decisions."
 ETH_communal_education: "公共教育"
 ETH_communal_education_desc: "確保[ETH.GetNameDef]中的每個社群都能夠通過學校和圖書館接受教育，是提升人民生活水準至關重要的一步。"
 ETH_african_wildfire: "非洲之火"
 ETH_african_wildfire_desc: "我們成功抵擋了[ITA.GetAdjective]的入侵，但在將整個非洲從殖民主義的恐怖壓迫中解放出來之前，我們絕不能懈怠。我們應該利用我們的技能和資源在整個大路上播撒反抗的火種，逼迫帝國主義者們撤退。"
 ETH_flames_across_the_sea: "海洋彼岸的火焰"
 ETH_flames_across_the_sea_desc: "在歐洲霸權下遭受苦難的不僅僅只有非洲。在帝國主義的壓迫下，我們紅海對岸的鄰國們幾乎沒有獨立可言。我們應該將抵抗的火焰蔓延到阿拉伯半島，使得那裡的人民有朝一日能夠自己當家做主。"
 ETH_heavy_industry: "重工業"
 ETH_heavy_industry_desc: "繼續進行快速工業化的進程是我們擺脫封建經濟的關鍵。重工業的發展將吸引工人進入城市，從現有的廣大農民中創造出一個全新的模範工人階級。"
 ETH_arms_production: "軍火生產"
 ETH_arms_production_desc: "工業化進程的高潮部分將會是我們武器工業的建立。我們再也不必依賴他國來獲取我們保家衛國的裝備了。"
 ETH_mytishchi-ababa_plant: "梅季希-亞貝巴軍工廠"
 ETH_mytishchi-ababa_plant_desc: "我們應該利用和蘇聯的緊密紐帶來獲得能改進國內製造業和軍事工業的知識。一項聯合工廠開發計劃會是獲得如此知識和經營梅季希工廠人員的不二之選。"
 ETH_send_home_advisors: "遣返顧問"
 ETH_send_home_advisors_desc: "雖然在與[ITA.GetName]的戰爭中，[SOV.GetName]的支持使我們受益匪淺，但令我們始料未及的是，他們會強迫我們成為任由他們驅使的傀儡。隨著我們建立了屬於自己的工業與軍事能力，我們也越來越有底氣去反抗[SOV.GetAdjective]的要求。因此，是時候讓我們搞清楚究竟誰才是[ETH.Capital.GetCapitalVictoryPointName]的統治者了。"
 ETH_send_home_advisors_tt: "將所有[SOV.GetAdjective]軍事顧問送回[SOV.GetNameDef]。"
 ETH_soviet-ethiopian_trade_agreement: "蘇聯-埃塞俄比亞貿易協定"
 ETH_soviet-ethiopian_trade_agreement_desc: "世界上許多國家由於意識形態與我們的工人共和國的分歧不願意和我們貿易。但是，我們能夠和[SOV.GetAdjective]達成一系列對雙方都有利的雙邊貿易協定，這將允許我們在沒有貿易壁壘的情況下交換資源和貨物。"
 ETH_seek_new_trading_partners: "尋找新的貿易伙伴"
 ETH_seek_new_trading_partners_desc: "全球各地的人們渴望著我們國家可以提供的財富，但是我們的貿易伙伴僅僅限制在[SOV.GetAdjective]。我們應該和其他國家有所接觸，來證明我們不是[SOV.GetName]的僕從，並開始將財富還給[ETH.GetAdjective]人民。"
 ETH_freedom_at_gunpoint: "槍桿子裡出自由"
 ETH_freedom_at_gunpoint_desc: "我們如今已經擊退了多次想征服我們人民的[ITA.GetAdjective]侵略者了。但我們的鄰居在抵抗殖民者侵略上就沒有如此幸運了。是時候將我們的戰爭經驗和新生的經濟力量投入到非洲的解放中。並向殖民者回敬以他們唯一能懂的語言——暴力，赤裸裸的暴力。"
 ETH_freedom_at_gunpoint_tt: "解鎖§Y槍桿子裡出自由§!決議，解放非洲各國。"
 ETH_boots_on_the_shore: "踏上海岸"
 ETH_boots_on_the_shore_desc: "我們與阿拉伯半島上的人民進行貿易和文化上的交流已經有很悠久的歷史了。但很不幸，他們仍然被禁錮在封建的政府體制之下。如果成功解放了半島上的人民，我們就能控制紅海上至關重要的商路，並讓我們的影響力深入中東。"
 ETH_request_soviet_hulls: "請求蘇聯戰列艦船體"
 ETH_request_soviet_hulls_desc: "如果我們不想在未來的衝突中遭到封鎖，我們就需要學會如何自造船隻。[SOV.GetNameDefCap]近期取消了一些戰列艦製造計劃，我們也許可以購買一些半成品艦體。這場交易一定會令我們受益匪淺。"
 ETH_organization_of_african_unity: "非洲統一組織"
 ETH_organization_of_african_unity_desc: "直到如今，從歐洲殖民者手中解放出來的任務只是被簡單的認為從他們手中獲得自由。但是，我們所有人仍然是非洲以外的許多強權的征服目標。只有站在一起，非洲人民才能有希望終結被再次奴役的命運。"
 ETH_organization_of_african_unity_tt: "解鎖邀請獨立非洲國家加入§Y非洲統一組織§!的決議"
 ETH_pan-africanism_liberate_tt: "獲得針對所有非洲殖民勢力的§Y解放戰爭目標§!："
 ETH_executive_council: "執行理事會"
 ETH_executive_council_desc: "我們應該建立一個能夠執行人民意願和快速對影響我們地區穩定的威脅做出反應的行政實體，來推進非洲統一組織的合作進展。"
 ETH_executive_council_tt: "解鎖邀請§Y非洲統一組織§!成員加入執行理事會的決議。"
 ETH_african_union: "非洲聯盟"
 ETH_african_union_desc: "是時候讓所有非洲人民統一在一個非洲聯盟的旗幟下了。我們通過艱苦鬥爭成為非洲的第一個超級大國，再也不會受到帝國主義者和法西斯主義者的威脅了。"
 ETH_african_union_tt: "解鎖整合§Y執行理事會§!成員加入§Y非洲聯盟§!的決議。"
 ETH_african_central_bank: "[ETH_GetCentralBankName]"
 ETH_african_central_bank_desc: "在建立了[ETH_GetCentralBankName]之後，我們可以開始整合非洲統一組織內部的經濟。這可以讓我們更好地運用我們的資源和基礎設施來促進各成員國的發展。"
 ETH_african_central_bank_tt: "解鎖邀請§Y非洲統一組織§!的成員加入[ETH_GetCentralBankName]的決議。"
 ETH_african_central_bank_2_tt: "$MODIFIER_STABILITY_FACTOR$：§G-5%§! \n$modifier_production_speed_industrial_complex_factor$：§G-10%§! \n$modifier_production_speed_infrastructure_factor$：§G-10%§!"
 ETH_mass_transit: "集體化公共交通"
 ETH_mass_transit_desc: "我們的許多交通相關的基礎設施已經過時並需要更換以被更好地利用。而最適合執行這些改革的人，則是那些運營基礎設施的工人們。"
 ETH_mutual_defense: "共同防衛協定 "
 ETH_mutual_defense_desc: "只有在全世界都能意識到要殖民非洲人民要付出巨大代價時，我們的人民才能獲得持久的和平。為了達到這個目的，非洲統一組織的成員應該建立一個共同防衛協定，承諾當任一成員國遭到攻擊時時保衛其獨立。"
 ETH_mutual_defense_tt: "解鎖邀請§Y非洲統一組織§!成員加入共同防衛協定的決議。"
 ETH_our_own_path: "我們自己的道路"
 ETH_our_own_path_desc: "我們曾經因為太弱小以至於不能在[SOV.GetAdjective]背叛我們，掌控我們國內事務時做出抵抗。但現在，我們足夠強大，終於能夠爭取自己的獨立了。但是，我們需要準備好應對來自[SOV.GetAdjective]的任何可能的報復。"
 ETH_our_own_path_tt: "§R[SOV.GetNameDefCap]會被這種行為激怒，並可能試圖將埃塞俄比亞重新納入[SOV.GetAdjective]的掌控之下。§!"
 ETH_communal_agriculture: "集體化農業"
 ETH_communal_agriculture_desc: "在集體化農業並引入新的農業技術之後，我們可以大幅度增加農業的產值，保證每個人有飯吃。這能夠讓被解放的農民在城市裡有機會找到工作，而不是依靠農業勉強維持生計。"
 ETH_communal_agriculture_industry_tt: "§Y$ETH_industrialization_dynamic_modifier$§!追加效果：\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$：§G+10%§!"
 ETH_communal_agriculture_consumer_tt: "§Y$ETH_industrialization_dynamic_modifier$§!追加效果：\n$MODIFIER_CONSUMER_GOODS_FACTOR$：§Y-5%§!"
 ETH_seize_the_means: "奪取生產資料"
 ETH_seize_the_means_desc: "幾代的[ETH.GetAdjective]工人耕作著土地並建立了城市裡的各種產業。他們的血養育了這片土地。因此，我們不能允許那些財閥繼續宣稱他們對這些資產的私有權。他們必須將財富歸還給人民。"
 ETH_preparing_for_the_inevitable: "準備不可避免之戰"
 ETH_preparing_for_the_inevitable_desc: "全世界的各個勢力因為害怕他們的人民會要求進行在[ETH.GetNameDef]已進行了的根本性的改革，所以不會容忍我們的存在。我們必須準備好應對他們試圖摧毀我們生活方式的不可避免之戰。"
 ETH_refuge_for_the_spanish_exiles: "西班牙流亡者的避難所"
 ETH_refuge_for_the_spanish_exiles_desc: "我們有著相同意識形態的同志在西班牙看見西班牙人民的安那其夢想被來自全球各地法西斯分子，斯大林主義分子和資產階級分子碾碎了。我們必須打開我們的邊界來迎接那些流離失所的朋友，併為他們提供另一個建設更好未來的機會。"
 ETH_the_lion_and_the_sun: "獅子和太陽"
 ETH_the_lion_and_the_sun_desc: "皇帝陛下[ETH.GetLeader]和日本天皇[JAP.GetLeader]，發現了我們兩個帝國之間的許多共同點，[JAP.GetLeader]進一步提出他們征服會在我們重奪家園後對[ETH.GetName]進行投資。"
 ETH_japanese_investments_tt: "解鎖當[ROOT.GetName]被解放後，吸引日本在[ROOT.GetName]進行投資的§Y決議§!"
 ETH_an_ethiopian_navy_in_exile: "埃塞俄比亞流亡海軍"
 ETH_an_ethiopian_navy_in_exile_desc: "在看過了[JAP.GetAdjective]海軍的演練之後，皇帝陛下[ETH.GetLeader]向我們的東道主提出了幫助建設[ETH.GetAdjective]海軍以解放我們家園並抵禦外敵的請求。"
 ETH_an_arabic_base: "阿拉伯基地"
 ETH_an_arabic_base_desc: "[JAP.GetName]在近幾年重塑亞太地區形勢的意圖越來越明顯。作為[JAP.GetAdjective]的關係日益友好的盟友，我們從他們手中為自己爭取一小點利益也是合理的。作為一個小小的開頭，我們應該要求控制我們在阿拉伯半島的先祖的土地。"
 ETH_uk_arabia_tt: "任何§Y[ENG.GetNameWithFlag]§!控制的§Y阿拉伯§!地區或者是§Y[ENG.GetNameDef]§!的§Y盟友§!"
 ETH_an_empire_in_the_shade_of_the_sun: "烈日掩映下的帝國"
 ETH_an_empire_in_the_shade_of_the_sun_desc: "[ETH.GetLeader]陛下是個沒有帝國的皇帝——這不僅是對陛下的極大侮辱，更限制了我等解放[ETH.GetName]的能力。也許我們在[JAP.Capital.GetCapitalVictoryPointName]的好朋友願意給我們一座島，以其作為最終解放祖國的行動基地。"
 ETH_japan_has_island_tt: "日本控制至少一個沒有核心的島嶼地區。"
 ETH_japan_joins_tt: "§Y[JAP.GetNameDefCap]§!將加入§Y[ROOT.GetName]§!對[ITA.GetName]的戰爭。\n§Y[ROOT.GetName]§!將成為§Y[JAP.GetName]§!的傀儡國"
 ETH_an_audience_with_countryleadertitle: "與[GetGermanCountryLeaderTitle]的會面"
 ETH_an_audience_with_countryleadertitle_desc: "[GER.GetLeader]那野心勃勃的新秩序計劃不僅限於[GER.GetNameDef]本土，眼光更是放到了全球。與[GER.GetAdjective]領導人會面，全世界都會再次把注意力放在[ETH.GetLeader]陛下身上，放在這位[ETH.GetName]真正的統治者身上。"
 GER_fascism_leader_title: "元首"
 GER_male_kaiser_title: "皇帝"
 GER_female_kaiser_title: "女皇"
 GER_chancellor_title: "總理"
 GER_generalfeldmarshall_title: "元帥"
 ETH_befriend_goring: "交好戈林"
 ETH_befriend_goring_desc: "德國政府是一張充滿了陰謀，詭計和背叛的大網。任何一個能在[GER.GetLeader]面前說得上話的人都可能在任何時候對[GER.GetAdjective]政治決策造成巨大的影響。也許結交某些決策層中的精英能夠為我們帶來一定的影響力，比如說$GER_hermann_goring$。"
 ETH_steel_lions: "鋼鐵雄獅"
 ETH_steel_lions_desc: "[GER.GetNameDefCap]開創了全新的戰爭法則。騎兵或塹壕戰的時代已經結束。未來的戰場屬於坦克。我們應該利用身處[GER.GetNameDef]的這段時間，學習如何使用現代戰爭中的武器，併為解放祖國做準備。"
 ETH_armor_officers_tt: "至多2名[ROOT.GetAdjective]陸軍指揮官將會獲得§Y$armor_officer$§!特質"
 ETH_german_mediation: "[GER.GetAdjective]調停"
 ETH_german_mediation_desc: "隨著[GER.GetAdjective]和[ITA.GetAdjective]之間的利益和野心開始逐漸靠攏，[ETH.GetName]問題逐漸成為橫在兩國進一步合作之間的絆腳石。或許[GER.GetLeader]可以說服[ITA.GetLeader]結束他對我國毫無意義的非法侵佔，讓皇帝得以回到[ETH.GetName]的王位上。"
 ETH_ger_and_ita_have_same_dieology_tt: "[GER.GetFlag]§Y[GER.GetName]§!和[ITA.GetFlag]§Y[ITA.GetName]§!有著相同的意識形態。"
 ETH_sabotage_italo-german_relations: "破壞意德關係"
 ETH_sabotage_italo-german_relations_desc: "我們不能允許[GER.GetNameDef]和[ITA.GetName]將對方視為潛在的盟友。我們必須盡一切努力來破壞兩國之間的關係。否則，我們可能只能看著皇帝陛下變成[ITA.GetLeader]的階下囚，而[ETH.GetName]解放的夢想也就此化為泡影。"
 ETH_unlock_false_flag_tt: "解鎖發動一場栽贓行動以陷害[ITA.GetFlag]§Y[ITA.GetName]§!的決議。"
 ETH_joint_swedish-ethiopian_intelligence_program: "瑞典-埃塞俄比亞聯合情報計劃"
 ETH_joint_swedish-ethiopian_intelligence_program_desc: "對[ETH.GetName]的直接援助可能會對[SWE.GetName]的中立造成影響。但是，他們或許願意提供一些隱秘的援助以便做出一些合理的推諉。利用我們在非洲的聯繫和[SWE.GetName]的資源。我們可以蠶食[ITA.GetAdjective]在非洲的殖民制度。"
 ETH_anti-tank_guns: "反坦克炮"
 ETH_anti-tank_guns_desc: "[SWE.GetName]有著世界上頂級的武器之一。儘管在外國事務上保持技術中立，[SWE.GetAdjective]或許願意賣掉他們的一些反坦克炮來削弱法西斯的日益增長的影響。"
 ETH_a_libyan_revolt: "利比亞叛亂"
 ETH_a_libyan_revolt_desc: "[ITA.GetAdjective]正把精力放在控制他們在東非新獲得的殖民地上。當他們的注意力轉移至他處時，我們要盡全力在他們[LBA.GetAdjective]的領土上播種下叛亂的種子。"
 ETH_ethiopias_cause_is_ours: "埃塞俄比亞的事情就是我們的事情！"
 ETH_ethiopias_cause_is_ours_desc: "[SWE.GetAdjective]政府正在偏離中立政策，因為他們開始意識到法西斯在非洲的勝利可能會殃及歐洲。我們一致尊重國際法且致力於實現國家自決，因此我們需要在外交事務上加強合作。"
 ETH_SWE_join_war_tt: "如果主要國家在與§Y[ITA.GetFlag][ITA.GetName]§!進行戰爭並且§Y[SWE.GetFlag][SWE.GetName]§!接受了雙邊陣營協議，他們會嘗試加入該主要國家的陣營並加入戰爭。\n§R如果無法加入該主要國家的陣營，[SWE.GetFlag][SWE.GetName]不會加入對抗[ITA.GetFlag][ITA.GetName]§!的戰爭。"
 ETH_reach_out_to_the_italians: "與意大利合作"
 ETH_reach_out_to_the_italians_desc: "很明顯我們沒有任何在戰場上戰勝[ITA.GetAdjective]的希望。然而[ETH.GetLeader]不停地在徒勞無功的進攻中浪費我國士兵的寶貴生命。是時候尋找一個新的領導人了，一個可以通過與意大利人合作為我們的家園帶來和平的強大領袖。"
 ETH_reach_out_to_the_italians_tt: "我們會提交一份合作協議給§Y[ITA.GetNameDef]§!，以嘗試用領土換取和平。"
 ETH_can_start_a_civil_war_tt: "完成§Y$ETH_declare_for_italy$§!國策後，[ROOT.GetName]將開始內戰。"
 ETH_sway_the_warlords: "拉攏軍閥"
 ETH_sway_the_warlords_desc: "雖然我們沒有希望能夠說服實力強大的王公公開對抗$ETH_haile_selassie$，但我們至少能夠為未來的合作播下種子。另外，我們會嘗試說服一些實力較小的軍閥，讓他們明白，和意大利人合作而不是對抗他們才是有好處的。"
 ETH_sway_the_warlords_tt: "增加起義的規模。\n一些忠誠的將軍會在戰時可以被招募。"
 ETH_expand_the_bodyguard: "擴編護衛隊"
 ETH_expand_the_bodyguard_desc: "當[ETH.GetName]的權力結構開始分崩離析的時候，尋找值得信賴的人就變得愈發困難。在這種艱難的時刻，我們偉大國家未來的領導人需要一支臨時的僅對他忠誠的警衛團，來保護他免收背叛因素的威脅。"
 ETH_expand_the_bodyguard_tt: "在內戰開始時添加額外的單位"
 ETH_declare_for_italy: "公開支持意大利"
 ETH_declare_for_italy_desc: "很多人會將我們的行動視為背叛並因而忽視了事實。但這就是為什麼我們才是掌管這片土地的天選之人。因為只有我們有堅強的意志做為國家有益之要事。是時候推翻[ETH.GetLeader]了。"
 ETH_restore_the_country: "重建國家"
 ETH_restore_the_country_desc: "隨著[ETH.GetName]重歸平靜，是時候開始恢復全國的秩序了。我們將重建比以往更好的房屋和基礎設施，並向我們的人民展示一個[ETH.GetLeader]統治下的光明的未來。"
 ETH_invite_italian_settlers: "邀請意大利移居者"
 ETH_invite_italian_settlers_desc: "眼睜睜看著我們偉大的國家淪為歐洲殖民的又一個目的地對很多人來說將是一劑難以下嚥的苦膽。然而，近期的事件已經表明我們需要採取激進的措施改善虛弱的工業和基礎設施。因此我們應該利用現在的形勢邀請天真的[ITA.GetAdjective]人定居於此，以便充分利用他們的財富和專業知識。"
 ETH_invite_italian_settlers_tt: "§Y2個擁有的地區§!將獲得一些[ITA.GetName]移居者，其鄉村地區或牧區的地區類型將被改變並獲得§Y新的建築位§!。"
 ETH_replace_the_abuna: "[Get_ETH_replace_the_abuna_name]"
 ETH_replace_the_abuna_desc: "[Get_ETH_replace_the_abuna_desc]"
 abuna_abraham_gojjam_tt: "§Y$ETH_abuna_abraham$§!："
 ETH_replace_the_abuna_original: "替換阿布納"
 ETH_change_state_religion: "改變國教"
 ETH_replace_the_abuna_desc_ethiopia: "東正教會領袖$ETH_abuna_qerellos_iv$與$ETH_haile_selassie$間的關係過於親密。我們需要一位對我們的事業更忠誠的人來替代他。"
 ETH_replace_the_abuna_desc_gojjam: "東正教會領袖$ETH_abuna_qerellos_iv$與$ETH_haile_selassie$間的關係過於親密。$ETH_abuna_abraham$是替代他的最佳人選，能夠使戈賈姆同時成為帝國的政治和宗教中心。"
 ETH_replace_the_abuna_desc_jimma: "長久以來，東正教正統臺瓦西多教會一直在干涉我國的政治，現在是時候正式切斷帝國與教會之間的聯繫了。取而代之，我們應當尋求與狹窄海洋對面的兄弟姐妹們之間更親密的聯繫。"
 ETH_the_capital_victory_parade: "[ROOT.Capital.GetCapitalVictoryPointName]勝利遊行"
 ETH_the_capital_victory_parade_desc: "儘管我們偉大的領袖使我們免遭毀滅，但仍有很多人民懷疑[ETH.GetLeader]的動機，並懷念舊時皇室統治時的日子。我們必須提醒這些人他們應當對[ETH.GetLeader]充滿感激，並向他們描繪[ETH.GetName]光輝的未來。"
 ETH_amedeos_feast_of_maskal: "阿梅迪奧的真十字節"
 ETH_amedeos_feast_of_maskal_desc: "為了確保[ETH.GetName]長治久安，我們邀請所有剩餘王公前往參加阿梅迪奧親王在[ETH.Capital.GetCapitalVictoryPointName]舉辦的真十字節。在那裡，我們將會見在東非的[ITA.GetAdjective]總督，共商當地未來大計。"
 ETH_amedeos_feast_of_maskal_tt: "如果已完成§Y$ETH_sway_the_warlords$§!國策：\n§Y$ETH_seyoum_mengesha$§!、§Y$ETH_ayalew_birru$§!及§Y$ETH_ras_kassa$§!將變得忠誠。"
 ETH_assertiveness: "[Get_ETH_assertiveness_name]"
 ETH_assertiveness_autonomy_effect: "堅定自信的皇帝"
 ETH_assertiveness_desc: "我們曾同意與[ITA.GetAdjective]合作來保護我們偉大的國家，使其免遭毀滅，但現在他們將眼睜睜地看著我們被剝奪了獨立自主權和文化。我們不會讓這種事發生。我們會讓他們明白我們會讓他們在殖民道路上的每一步受到頑強的抵抗。"
 ETH_assertiveness_tt: "如果已完成§Y$ETH_sway_the_warlords$§!國策且國家是§Y$jimma$§!：\n§Y$ETH_balcho_safo$§!及§Y$ETH_tadesse_birru$§!將變得忠誠。"
 ETH_assertiveness_gojjam: "戈賈姆 內伽什"
 ETH_assertiveness_jimma: "吉馬的傑拉德"
 ETH_assertiveness_ethiopia: "紹阿國王"
 ETH_exploit_french_weakness: "利用法國的衰弱"
 ETH_exploit_french_weakness_desc: "正當[FRA.GetAdjective]在他們帝國的灰燼裡喋喋不休的爭論之時，我們將有機會將法屬索馬裡蘭的土地重新納入我們偉大的帝國。雖然[FRA.GetAdjective]這個時候不太可能為此跟我們開戰，但我們必須為最壞的情況做準備。"
 ETH_exploit_french_weakness_tt: "解鎖佔領§Y法屬索馬裡蘭§!的決議\n§R採用這些決議將有可能導致與維希法國的戰爭！§!"
 ETH_france_divided_tt: "法國已經分裂"
 ETH_invite_italian_investors: "邀請意大利投資者"
 ETH_invite_italian_investors_desc: "我們應該利用好我們的新宗主，吸引宗主投資[ETH.GetName]。湧入的宗主投資將能於諸多方面對我們有益，其不但能幫助戰後重建，還能極大增強我國的工業能力。"
 ETH_italian_general_staff: "意大利總參謀部"
 ETH_italian_general_staff_desc: "我們的軍隊在現代化道路上還是任重道遠。雖然我們在為軍事力量獲取或者製造現代裝備方面取得了巨大進步，但是我們的軍官在如何利用這些設備上的觀點仍然是否落後。或許我們可以邀請[ITA.GetAdjective]軍官來加入我們的指揮部以向他們學習如何進行現代化戰爭。"
 ETH_italian_general_staff_tt: "如果和意大利的關係為正，並且他們接受了協議，§Y$ITA_giuseppe_tellera$§!，§Y$ITA_mario_berti$§!和§Y$ITA_alessandro_pirzio_biroli$§!會被派往埃塞俄比亞。"
 ETH_cooperation: "[Get_ETH_cooperation_name]"
 ETH_cooperation_desc: "我們的天命就是統治東非。但我們離實現這個目標還很遙遠。因此我們必須和當地的地方勢力合作，並儘可能取得更多的優勢。"
 ETH_cooperation_sud_tt: "獲得一名蘇丹籍政治顧問：\n§Y$economic_organizer$：§!\n生活消費品工廠：§G-5%§!\n穩定度：§G+5%§!"
 ETH_cooperation_som_tt: "獲得一名索馬裡籍政治顧問：\n§Y$economic_organizer$：§!\n生活消費品工廠：§G-5%§!\n穩定度：§G+5%§!"
 ETH_cooperation_gugsa_tt: "§Y$ETH_domenico_mondelli$§!將成為可用的§Y空軍部長§!：\n§Y$air_chief_ground_support_1$§!"
 ETH_cooperation_gojjam: "與蘇丹合作"
 ETH_cooperation_jimma: "和阿拉伯合作"
 ETH_cooperation_gugsa: "與厄立特里亞合作"
 ETH_reinforce_dynamic_identity: "[Get_ETH_reinforce_dynamic_identity_name]"
 ETH_reinforce_dynamic_identity_desc: "新政府治下的民眾仍未明確他們的國家認同。無論有什麼不滿，他們現在都是[ETH.GetAdjective]人了。而且他們也該明白，忠於[ETH.GetLeader]和國家的人才是好的[ETH.GetAdjective]人。"
 ETH_reinforce_ethiopian_identity: "強化埃塞俄比亞民族認同"
 ETH_reinforce_gojjam_identity: "強化戈賈姆民族認同"
 ETH_reinforce_jimman_identity: "強化吉馬民族認同"
 ETH_reinforced_identity: "強化民族認同"
 ETH_underground_wargames: "秘密軍事演習"
 ETH_underground_wargames_desc: "我們在上次戰爭中由於缺乏對近幾十年戰爭的迅速變化的瞭解，在對抗[ITA.GetAdjective]付出了巨大代價。為了確保我們不會再犯同樣的錯誤，當務之急則是我們的軍官應該進行沙盤推演，為打倒[ITA.GetAdjective]軍事力量做計劃。我們必須確保在這麼做時不會引起一些懷疑……"
 ETH_adopt_the_lira: "採用里拉"
 ETH_adopt_the_lira_desc: "我們的貨幣由於和[ITA.GetName]的戰爭帶來的動亂和重建的巨大代價而大幅貶值。我們應該利用這個機會來改用里拉以加快與[ITA.GetAdjective]經濟融合，而不是嘗試穩定這個已經失去信用的貨幣。"
 ETH_request_italian_equipment: "索取意大利裝備"
 ETH_request_italian_equipment_desc: "儘管我們在改革我們的經濟和加強我們的軍事力量上做出了巨大努力，一些援助仍可能會對我們有所幫助。由於我們和[ITA.GetAdjective]不斷深化的關係，他們或許願意給我們運送一些先進的設備。"
 ETH_request_italian_equipment_tt: "如果[ITA.GetFlag][ITA.GetName]同意，[ETH.GetFlag][ETH.GetName]將收到§G500$artillery_equipment$§!或§G2500$infantry_equipment_1$§!"
 ETH_recruit_mercenaries: "招募僱傭軍"
 ETH_recruit_mercenaries_desc: "現在，解決軍隊裡來自不同背景的士兵間的緊張氣氛成了一個大難題。許多人仍然忠於舊政權，不值得信任。在我們連根拔起這些不忠的因素之前，我們需要一些絕對忠誠於我們的力量。冷冰冰的鈔票則是最簡單的獲得忠誠的方法。"
 ETH_askari_tt: "招募§G4個單位§!的§Y厄立特里亞殖民地軍§!"
 ETH_sudanese_mercs_tt: "招募§G4個單位§!的§Y蘇丹僱傭兵§!"
 ETH_arab_mercs_colab_tt: "招募§G4個單位§!的§Y阿拉伯僱傭兵§!"
 ETH_set_up_a_customs_barrier: "設立貿易壁壘"
 ETH_set_up_a_customs_barrier_desc: "我們的經濟與[ITA.GetName]的經濟綁定越久，我們就將越難從他們的掌控下脫身。我們應該設置壁壘以限制兩國之間的貿易，雖然這樣將會讓我國經濟增長放緩。[ITA.GetAdjective]政府顯然會對此感到憤怒，但必要時我們總能找到合適的經濟理由來證明壁壘的合理性。"
 ETH_contact_the_exiles: "聯絡流亡者"
 ETH_contact_the_exiles_desc: "隨著與[ITA.GetName]的戰爭結束，很多人出於對新政權下可能發生之事的恐懼逃向了鄰近區域。在我們開始執行重獲獨立的計劃前，我們或許能夠說服廣大逃亡者加入我們。雖然在過去我們有諸多分歧，但現在我們應該為了祖國攜手合作。"
 ETH_outsourced_production: "外包生產"
 ETH_outsourced_production_desc: "在製造武器裝備上，我國的工業體量不足且缺乏經驗。然而，現在我們深入了[ITA.GetAdjective]勢力圈，我們可以儘量藉助外交局勢，將裝備生產外包給他們的製造商，利用他們的專業經驗。"
 ETH_outsourced_production_tt: "請求[ITA.GetFlag]§Y[ITA.GetAdjective]§!陸軍或空軍設計商："
 ETH_outsourced_production_air_tt: "空軍設計商："
 ETH_outsourced_production_army_tt: "\n陸軍設計商："
 ETH_outsourced_production_factories_tt: "\n如果[ITA.GetFlag]§Y[ITA.GetNameDef]§!同意，[ETH.GetFlag]§Y[ETH.GetNameDef]§!將獲得§Y4座軍用工廠§!。"
 ETH_together_for_victory: "共赴勝利"
 ETH_together_for_victory_desc: "我們重鑄榮譽並掙脫意大利桎梏的時機已近。為了確保我們的計劃不會失敗，我們需要加強我們的力量並從整個東非獲得支持。只有團結才能勝利。"
 ETH_together_for_victory_tt: "當獨立戰爭開始時，反叛戰士將在敵人後方發動起義"
 ETH_our_enemys_enemy: "我們敵人的敵人"
 ETH_our_enemys_enemy_desc: "有許多國家出於意識形態或戰略原因而反對[ITA.GetAdjective]的擴張主義政策。我們應該接觸那些國家以獲取軍事援助，從而擊敗我們國土上的[ITA.GetAdjective]軍隊。"
 ETH_our_enemys_enemy_tt: "如果一個國家同意輸送武備，[ETH.GetFlag][ETH.GetName]將會從他們那裡收到§G1000步兵裝備§!。"
 ETH_raid_italian_depots: "劫掠意大利倉庫"
 ETH_raid_italian_depots_desc: "意大利軍隊將相當數量的裝備集中於遍佈我國的倉庫中。既然我們正為一場不可避免的對抗做準備，我們可以洗劫他們的倉庫，從他們那裡奪取這些裝備，用於加強我們的軍隊。"
 ETH_raid_italian_depots_tt: "在接下來的§Y一年§!內，將會發生零星的劫掠事件，每次都會將[ITA.GetFlag]§Y[ITA.GetAdjective]§!裝備加入[ETH.GetFlag]§Y[ETH.GetName]的§!儲備中。"
 ETH_the_italian_language: "引進意大利語"
 ETH_the_italian_language_desc: "語言仍然是加強同[ITA.GetAdjective]合作的最大障礙之一。我們應當採納[ITA.GetAdjective]作為我們政府的第二語言，包括軍隊在內。希望此舉能促進兩國之間的文化交流並使戰略規劃更有效率。"
 ETH_compensation: "賠款"
 ETH_compensation_desc: "儘管最初我們兩個偉大國家之間關係比較緊張，但是我們現在已經證明了我們對[ITA.GetName]的忠誠。但這並沒有讓民眾接受現在的管理系統。或許[ITA.GetAdjective]願意賠償給我們一些土地來幫助我們鞏固民眾對我國的支持度。"
 ETH_negusa_nagast: "萬王之王"
 ETH_negusa_nagast_desc: "是時候宣佈我們的獨立，並使[ETH.GetName]擺脫[ITA.GetAdjective]的影響了。歸功於[ETH.GetLeader]的領導，我們終於能再次掌握自己的命運了。"
 ETH_negusa_nagast_tt: "§Y[ROOT.GetNameWithFlag]§!宣佈獨立"
 ETH_the_italo-ethiopian_empire: "意大利-[ETH.GetAdjective]帝國"
 ETH_the_italo-ethiopian_empire_desc: "我們從舊帝國廢墟中崛起的同時，一個嶄新的意大利-[ETH.GetAdjective]帝國正在逐漸成形。雖然不久前我們還在互相殺伐，但現在局勢已經非常明朗：[ITA.GetName]和[ETH.GetName]在一起會更加強大。為我們共同的帝國開疆拓土是我們義不容辭的責任。"
 ETH_the_italo-ethiopian_empire_tt: "解鎖在佔領宣稱區域後取得其核心的§Y意大利-[ETH.GetAdjective]帝國§!決議。\n當宣稱地區或者任何與之毗鄰的地區上沒有任何敵方單位時，我們將取得宣稱地區的核心。"
 ETH_reclaim_the_empire: "重建帝國"
 ETH_reclaim_the_empire_desc: "在我們的偉大領袖[ETH.GetLeader]治下，我們擺脫了[ITA.GetName]對我們偉大祖國的腐壞影響，並再次發掘了蘊含在我們人民中無窮的力量。現在，我們的偉大使命便是重新宣稱我們合法的土地，併為[ETH.GetAdjective]的人民帶來統一。"
 ETH_reclaim_the_empire_tt: "解鎖§Y重建帝國§!決議，當被割讓給[ITA.GetFlag][ITA.GetName]的領土重新回到[ETH.GetFlag][ETH.GetAdjective]控制下時重獲這些區域的核心。"
 ETH_the_liberator_of_country_short: "[Get_ETH_the_liberator_of_country_short_name]"
 ETH_the_liberator_of_country_short_desc: "[ETH.GetLeader]英勇無畏地帶領我們走向了獨立，擺脫了來自[ITA.GetName]腐壞影響。我們不知道未來將會怎樣，但我們明白，只要[ETH.GetName]的解放者能夠繼續指引我們，我們的未來將會充滿了光榮。"
 ETH_the_liberator_of_gojjam: "$gojjam$的解放者"
 ETH_the_liberator_of_jimma: "$jimma$的解放者"
 ETH_the_liberator_of_ethiopia: "$ETH$的解放者"
 ETH_consolidate_east_africa: "統合東非"
 ETH_consolidate_east_africa_desc: "世界的秩序正在隨著古老帝國們的逐漸崩潰而發生變化。唯一能在新秩序中為我們的人民提供一片安寧之地的方法，就是通過征服運動向世界展示我們擁有克服任何困難的能力。因此，我們將鞏固我們治下的東非，向世界展示[ETH.GetName]的力量。"
 ETH_consolidate_east_africa_tt: "獲得下列地區的宣稱：\n§Y[SUD.GetName]§!\n§Y[SOM.GetName]§!\n§Y[ERI.GetName]§!\n§Y[DJI.GetName]§!\n§Y[KEN.GetName]§!\n§Y[UGA.GetName]§!\n獲得可以在[ETH.GetFlag][ETH.GetAdjective]控制這些地區後將其核心化的決議。"
 ETH_chitet_name: "契特"
 ETH_chitet_name_democratic: "本土防衛軍"
 ETH_chitet_name_communist: "人民義勇軍"
 ETH_naval_college_name_communist: "紅海海軍學院"
 ETH_naval_college_name_historical: "阿斯馬拉海軍學院"
 ETH_naval_college_name_fallback: "[ETH.GetAdjective]海軍學院"
 ETH_airbase_name: "德佈雷塞特"
 ETH_airbase_name_fallback: "[ETH.GetAdjective]"
 ETH_experts: "專家"
 ETH_investors: "實業家"
 ETH_reintegrate_aussa: "整合奧薩"
 ETH_reintegrate_aussa_desc: "奧薩蘇丹國就是根牆頭草，反覆去給[ITA.GetAdjective]當狗腿子！是時候廢棄這個蘇丹國，將該地區整合進[ETH.GetName]中了。"
 ETH_communist_tax_exemption_title: "支持專家"
 ETH_communist_tax_exemption_desc: "為了防止蘇聯革命成功出現的“人才流失”再度上演，我們需要建立一個新的稅收制度，鼓勵專家們繼續留在[ETH.GetNameDef]。至少在新一代無產階級專家們出現之前……"
 ETH_communist_seize_assets_desc: "當平民百姓們還在艱難的維持生計之時，[ETH.GetName]革命前存在的精英們用外匯，藝術品以及土地的形式挪用了大量的財產。為了人民的名義，這些資產必須被收歸國有並進行財產再分配。"
 ETH_communist_seize_assets_title: "消滅私有財產"
 ETH_tax_exemption_default_desc: "我們仍需貴族勢力的存在以防止[ETH.GetName]四分五裂。我們將擴大他們的免稅特權範圍，讓他們保留更多的財富，藉此來確保他們的忠誠。"
 ETH_seize_assets_default_desc: "作為[ETH.GetName]最富有的那一批人，貴族可以輕鬆地通過古早時期的法律漏洞來逃稅，這對我們的經濟沒有任何正面意義。我們需要從貴族那裡徵收合適的稅款，並將其用於帝國的工業化發展。"
 ETH_tax_exemption_default_title: "擴大免稅"
 ETH_seize_assets_default_title: "向貴族徵稅"
 #ITALY
 ITA_italian_highways_bba: "意大利高速公路"
 ITA_italian_highways_bba_desc: "古羅馬人修建了全世界絕無僅有的道路網，但如今，那些日耳曼暴發戶以為自己的高速公路遠超我們所建造的一切。我們將證明他們是錯的。"
 ITA_develop_libya: "開發利比亞"
 ITA_develop_libya_desc: "利比亞是距離我們本土最近，同時也是發展潛力最大的殖民地。我們在收穫長久以來平定此地的辛勞碩果之前，需要先改善當地的基礎設施。"
 ITA_develop_eritrea: "開發厄立特里亞"
 ITA_develop_eritrea_desc: "厄立特里亞是我們在非洲最早的殖民地，也很可能是最有價值的。憑藉其出眾的戰略區位，我們可以輕鬆地將厄立特里亞打造為我們殖民帝國的根基。"
 ITA_develop_somaliland: "開發索馬裡蘭"
 ITA_develop_somaliland_desc: "打眼一看，非洲之角地區並沒有什麼經濟或者戰略潛力，但是隻需幾筆精準到位的投資，我們就可以把此地變為進一步向印度洋擴張的跳板。"
 ITA_regional_development: "區域發展"
 ITA_regional_development_desc: "我們先前對帝國各個地區的投資已經為這些地區經濟的大幅增長打好了基礎。只要一聲令下，我們就能立刻見到成效。"
 ITA_ministry_of_italian_africa: "意屬非洲事務部"
 ITA_ministry_of_italian_africa_desc: "統治非洲眾多的部落與民族非一般臣屬可同日而語，經略此地需要另闢蹊徑。"
 ITA_develop_ethiopia: "開發埃塞俄比亞"
 ITA_develop_ethiopia_desc: "冥頑不化的埃塞俄比亞人一直蔑視羞辱我們，如今他們終於歸降了。我們會開發他們的故鄉，並讓他們知道我們進軍這裡是為了他們的利益。"
 ITA_ethiopian_railways: "埃塞俄比亞鐵路"
 ITA_ethiopian_railways_desc: "落後的利比亞鐵路網拖慢了這片殖民地的經濟發展。我們將派出意大利專家，讓這裡的鐵路標準向本土看齊。到那時，帝國各地的火車都將準點到站。"
 ITA_polizia_dell_africa_italiana: "意屬非洲警察部隊"
 ITA_polizia_dell_africa_italiana_desc: "我們的殖民地警察已經證明了自己的能力。通過深化改革，他們將能夠保障我們對殖民地的投入能獲得對等的回報。"
 ITA_strengthen_ascari_corps: "強化殖民地部隊"
 ITA_strengthen_ascari_corps_desc: "來自帝國歐洲本土的部隊通常難以適應非洲的惡劣氣候，但當地人顯然沒有這種問題。我們應該僱傭他們，用來在炎熱地區支援我方軍隊。"
 ITA_comandante_diavolo: "魔鬼指揮官"
 ITA_comandante_diavolo_desc: "征服厄立特里亞及埃塞俄比亞戰爭期間，當地騎兵迅捷果敢、堅韌不拔，著實是一塊棘手的絆腳石。交鋒數陣之後，我們發覺倘若將其招入麾下，將使我們獲益良多。我們甚至可以提拔其中一位銳意進取的年輕軍官，讓他成為我們自己的“魔鬼指揮官”。"
 ITA_prospect_for_oil: "勘探石油"
 ITA_prospect_for_oil_desc: "我國地質專家斷定，利比亞沙漠之下蘊藏的石油儲量分外可觀。如果這是真的，我們就應該全面開展勘探工作。"
 ITA_libyan_refineries: "利比亞精煉廠"
 ITA_libyan_refineries_desc: "利比亞沙漠中發現了海量的石油儲備，接下來需要做的就是增加當地石油精煉產量。"
 ITA_libyan_infrastructure_bba: "利比亞基建"
 ITA_libyan_infrastructure_bba_desc: "鑑於利比亞是北非重要作戰基地，我們應著力於持續改善當地基建狀況，以便必要時能在當地部署大規模部隊。"
 ITA_litoranea_balbo: "[GetAppropriateLitoraneaBalboName]"
 ITA_litoranea_balbo_default: "巴爾博沿海公路"
 ITA_litoranea_balbo_alt: "利比亞沿海公路"
 ITA_litoranea_balbo_desc: "利比亞當地道路條件堪稱絕望——即使是沿海地區，路網條件也遠沒有個現代國家的樣子。沿海高速公路等開發項目已經提上日程，需要做的工作還有很多。"
 ITA_via_della_vittoria: "勝利之路"
 ITA_via_della_vittoria_desc: "基礎設施落後不堪，這對我等在北非行動造成不小阻力。如若集中資源建設一條“勝利之路”，局勢或可發生天翻地覆的變化，我軍在埃及附近的軍事行動也能展開拳腳。"
 ITA_libyan_railway: "利比亞鐵路"
 ITA_libyan_railway_desc: "投資建設利比亞路網在經濟上必有所值，但更大的意義在於支持軍隊、資源和物資的大規模流動。在這些領域中，現代鐵路網不可或缺。"
 ITA_steel_industry_in_terni: "特爾尼鋼鐵廠"
 ITA_steel_industry_in_terni_desc: "特爾尼的鋼鐵廠一直以來都是意大利鋼鐵產業的中流砥柱。戰爭即將爆發，我們將需要更多的鋼鐵。毫無疑問，現在的小小投資在接下來將會收穫頗豐。"
 ITA_power_plants_in_terni: "特爾尼發電廠"
 ITA_power_plants_in_terni_desc: "特爾尼發電廠當前功效仍談不上充足，若要將當地發展為更大的工業重鎮，就需要先行擴建發電廠。"
 ITA_industria_della_gomma_sintetica: "合成橡膠工業"
 ITA_industria_della_gomma_sintetica_desc: "我國坐落在地中海的心臟地帶，一旦遭到敵對勢力封鎖，產業貿易恐將一觸即潰。如果我們想奪得世界上應得的地位，就必須確保本國工業可以在進口空白情況下依舊能自給自足。"
 ITA_strengthen_northern_industry: "加強北方工業建設"
 ITA_strengthen_northern_industry_desc: "北意大利一直都是我國的工業心臟。只要一點點時間和資源上的投資，整片地理位置優越的區域就可以進一步發展。"
 ITA_modernize_the_mezzogiorno: "現代化南意大利"
 ITA_modernize_the_mezzogiorno_desc: "自國家統一以來，南意大利一直是個問題兒童。然而，我們可是有著主導地中海的雄心壯志，因此需要動用一切尚未開發的潛力。"
 ITA_new_industrialization_program: "新工業化計劃"
 ITA_new_industrialization_program_desc: "若要緊隨世界發展大勢，離不開不斷創新和改進。倘若故步自封、抱殘守缺，就不能指望我國能與先進大國有的一拼。我們必須時刻保持競爭力。"
 ITA_railway_innovations: "鐵路創新"
 ITA_railway_innovations_desc: "即使是在汽車的時代，強有力的鐵路網絡仍然是一個強大經濟體的脊梁。繼續擴建意大利的鐵路將會為我國未來的發展奠定基礎。"
 ITA_expand_foggia_farm_fields: "擴建福賈農場"
 ITA_expand_foggia_farm_fields_desc: "福賈地區長期享有“意大利糧倉”的美譽。一旦戰端肇啟，田地裡勞作的人們就不得不被動員徵召進軍隊。因此，若要在戰時保證民有所食，我們就必須搶先實現當地農業生產現代化。"
 ITA_investments_in_edison: "投資愛迪生公司"
 ITA_investments_in_edison_desc: "歐洲第一座發電廠是在意大利落成的，意大利發電領域一直都在科技的最前沿。加大對愛迪生公司投資，我們可以確保始終保持行業領軍地位。"
 ITA_expand_national_universities: "擴建國立大學"
 ITA_expand_national_universities_desc: "像我國這般科技發達的國家，是從來不排斥工程師的。我國大學的職能就是培養足夠多的年輕專家，以此不斷拉高國家競爭力的瓶頸上限。"
 ITA_fiocchi_munizioni: "菲奧基彈藥廠"
 ITA_fiocchi_munizioni_desc: "菲奧基長期為我軍供給高質量彈藥。未來戰端肇啟之時，穩定的彈藥供給至關重要，菲奧基工廠能否勝任這項工作即是重中之重。"
 ITA_brescia_small_arms_industry: "佈雷西亞輕武器廠"
 ITA_brescia_small_arms_industry_desc: "意產小型武器以其高品質而聞名於世，但若要士兵在戰場上無論面對何種敵人形態都無所不克，充足且全面的現代化先進武器供應不可或缺。"
 ITA_milan_comms_industry: "米蘭通訊設備廠"
 ITA_milan_comms_industry_desc: "無線電探測和測距等新技術領域為世界提供了許多機會，在未來無疑會成為軍事技術的重要領域。我們必須確保能在這些方面能跟上世界發展。"
 ITA_redirect_alfa_romeo_production: "引導阿爾法·羅密歐轉產"
 ITA_redirect_alfa_romeo_production_desc: "幾十年來，意大利運動汽車一直都是絕對的科技風向標。但是隨著戰爭的陰雲迫近，每個意大利人都需要恪盡職守。我們可負擔不起無謂的奢侈品，阿爾法·羅密歐的生產線必須要為軍事需求服務。"
 ITA_increase_production: "提高產能"
 ITA_increase_production_desc: "工業時代的戰爭只有一個核心要義：龐大的數量堆積。大量的炮彈，大量的步槍，大量的飛機。我們必須比敵人擁有更多的戰略物資。"
 ITA_keep_specialization: "保持專業化"
 ITA_keep_specialization_desc: "雖然世界上的其他地方可能早已忘記了精益求精的價值，但我們意大利人絕對不會。我們的能工巧匠們將始終關注哪怕最微小的細節，他們親手打造的裝備將會是最精巧與完美的。"
 ITA_thermojet_research: "熱力噴射引擎研究"
 ITA_thermojet_research_desc: "我們的工程師相信在未來，飛機將不會再由螺旋槳與活塞引擎所驅動。而新興科技會大大提升飛機速度，並使飛機設計截然不同。意大利必須在研發中處於領軍位置。"
 ITA_army_primacy_bba: "陸軍為主"
 ITA_army_primacy_bba_desc: "無論戰爭形態如何，最後一步總是把士兵派遣到敵國的領土上，奪取其發動戰爭所依賴的基礎。海軍和空軍無疑很有用，但為戰爭敲下裁判錘的終究還是陸軍。"
 ITA_preserve_army_traditions: "延續陸軍傳統"
 ITA_preserve_army_traditions_desc: "近來不少戰爭新概念如雨後春筍般層出不窮。雖然其中不乏善茬，但自凱撒時代以來，強軍的基礎從未改變：紀律、勇氣、領導力。"
 ITA_increase_artillery_production: "火炮增產"
 ITA_increase_artillery_production_desc: "世界大戰是一場火炮的戰爭，我們相信下一場戰爭仍是要靠火炮來主導的。我們可不能讓自己在這片領域落後。"
 ITA_vallo_alpino_del_littorio: "阿爾卑斯之壁"
 ITA_vallo_alpino_del_littorio_desc: "我們的陸上邊界幾乎在阿爾卑斯山脈上。雖然阿爾卑斯山確實是一道難以越過的天險，但上次大戰的經驗表明，阿爾卑斯防線並非固若金湯。在邊界上建設一系列堡壘將幫助我們將敵人的陸上進攻抵擋在國境線上。"
 ITA_moschettieri_del_duce: "[GetAppropriateMoschetieridelDuceName]"
 ITA_moschettieri_del_duce_default: "領袖的火槍手"
 ITA_moschettieri_del_duce_king: "國王的火槍手"
 ITA_moschettieri_del_duce_alt: "共和國火槍手"
 ITA_moschettieri_del_duce_pope: "教宗的火槍手"
 ITA_moschettieri_del_duce_desc: "[GetAppropriateMoschetieridelDuceDesc]"
 ITA_moschettieri_del_duce_desc_default: "領袖麾下有一支精銳的神射手部隊來保護自己。當然，領袖的安全是重中之重，不過這些模範士兵也可以用來更好地訓練我們的常規部隊，提高他們在戰場上的戰鬥力。"
 ITA_moschettieri_del_duce_desc_king: "國王麾下有一支精銳的神射手部隊來保護自己。當然，國王的安全是重中之重，不過這些模範士兵也可以用來更好地訓練我們的常規部隊，提高他們在戰場上的戰鬥力。"
 ITA_moschettieri_del_duce_desc_pope: "聖座麾下的一支用來保護自己的精銳神射手部隊。誠然，聖座的安全是重中之重，不過這些模範士兵也可以用來更好地訓練我們的常規部隊，提高他們在戰場上的戰鬥力。"
 ITA_moschettieri_del_duce_desc_alt: "共和國火槍手是一支由精英射手組成的部隊，他們發誓要保護共和國免受任何威脅，無論是來自外部還是內部的威脅。這些模範士兵也可以用來更好地訓練我們的常規部隊，提高他們在戰場上的效率。"
 ITA_a_bandits_war: "強盜戰爭"
 ITA_a_bandits_war_desc: "舊的戰爭方式早就應該爛在伊松佐的戰壕裡了。某些年事已高的將軍仍然頑固不化地認為，只要把一大群士兵扔進絞肉機裡，就可以像以前那樣贏下戰爭。但如今，我們比這些人更加深諳戰爭之道：現代戰爭的勝利，離不開快速、靈活、反應迅捷的機動部隊。我國陸軍必須準備好打贏這種戰爭。"
 ITA_carica_di_isbuscenskij: "在伊斯布岑斯基的衝鋒"
 ITA_carica_di_isbuscenskij_desc: "有些人說，馬兒與騎手馳騁戰場的日子已經過去了，騎兵的角色應當被坦克和飛機所取代。但是他們錯了——馬可不需要喝油，也不需要地勤，只需要一副好馬掌就夠了。因此即使在現代戰場上，騎兵仍存有明顯的優勢。"
 ITA_army_leaders: "陸軍軍官"
 ITA_army_leaders_desc: "我們的軍隊必須由最出色的軍官領導。所以，當務之急便是我們必須保證新的有能力的軍官能夠源源不斷地湧現，以保持我們的優勢。"
 ITA_superesercito: "陸軍最高指揮部"
 ITA_superesercito_desc: "協調一支龐大的陸軍可不是輕鬆的工作。我們需要創立一個由最高統帥部領導的指揮架構，這樣它就可以引導並支持我們在戰場上的部隊了。"
 ITA_italian_tankettes: "意大利輕坦"
 ITA_italian_tankettes_desc: "一些其他國家可能會試圖開發更大、更重、讓其他所有坦克都相形見絀的超級坦克。但我們清楚地知道，能夠真正在戰場上戰鬥的坦克才是最好的坦克。這種坦克必須擁有足夠快的速度才能及時到達目標地點，而且它只需要擁有足以抵擋步槍的裝甲厚度即可。這種便宜的載具將能夠進行快速化生產。"
 ITA_bersaglieri: "神射手部隊"
 ITA_bersaglieri_desc: "我們的精銳輕步兵“神射手部隊”一直戰功顯赫。即便未來戰爭將會走向機械化，步兵的本領依舊會是關鍵因素。"
 ITA_divisioni_alpine: "阿爾卑斯山地師"
 ITA_divisioni_alpine_desc: "在高山上的慘烈戰鬥將會是我們對於那場大戰揮之不去的記憶。未來的侵略將極有可能來自於北方，我們保家衛國的戰爭將極有可能發生在荒涼的山區。我們必須有能夠在那種惡劣地形進行有效戰鬥的士兵們。"
 ITA_fanti_dell_aria: "航空步兵"
 ITA_fanti_dell_aria_desc: "世界大戰時伊松佐前線的僵局迫使我們對有備之敵發起正面突擊。當時唯一取得突破的方式是強穿無人區與攻佔敵方戰壕。不過現代飛機可以搭載一群士兵迅速深入敵軍的大後方，傘降著陸後就可以奪取戰略目標，以期動搖敵方前線。"
 ITA_self_propelled_guns: "自行火炮"
 ITA_self_propelled_guns_desc: "也許坦克已經徹底的改寫了戰爭的法則，但是自行火炮在許多情況下仍然是戰場上最有價值的載具。在面對防禦工事或敵方坦克的時候，這些廉價又簡單的載具能夠提供的支援將會是至關重要的。"
 ITA_end_fiat_ansaldo_duopoly: "結束菲亞特-安薩爾多雙頭壟斷"
 ITA_end_fiat_ansaldo_duopoly_desc: "我們的機械化與摩托化工程領域長期以來被兩家公司所壟斷：菲亞特和安薩爾多。雖然這兩家公司毫無疑問是世界級的工程巨頭，但由於市場上缺乏能夠生存下來的競爭對手，他們的成長變得逐漸遲緩。如果我們想讓工程領域長期保持健康和火力，就不得不打破這種兩頭壟斷的局面。"
 ITA_modernize_ansaldo_facilities: "安薩爾多生產設施現代化"
 ITA_modernize_ansaldo_facilities_desc: "世界大戰導致的經濟衰退使得安薩爾多陷入了嚴重的財政危機，這導致他們很大程度上無法對工廠進行足夠的現代化改造。只有提升他們的地位才能確保他們免於破產。如果我們希望安薩爾多繼續作為我國機械工程領域的核心存在，我們就必須確保他們能夠使用現代化設備與科技。"
 ITA_ferrea_mole_ferreo_cuore: "鋼筋骨，鐵石心"
 ITA_ferrea_mole_ferreo_cuore_desc: "我國坦克部隊所要執行的，毫無疑問，是重大的軍事行動。為此，僅有鋼鐵軀殼是遠遠不夠的，還必須有鋼鐵雄心。"
 ITA_air_innovations_bba: "空軍改革"
 ITA_air_innovations_bba_desc: "空戰已成為現代戰爭中不可或缺的一環，我們不可在此關鍵領域落後於人。"
 ITA_citta_dell_aria: "天空之城"
 ITA_citta_dell_aria_desc: "我們的研究部門早已分佈於全國各地，導致科研工作效率低下。我們應將研究部門集中於一處，建立一座各學術領域的科學家和工程師可以共同打造次時代飛行器的“天空之城”。"
 ITA_citta_dell_aria_tt: "如果§Y[2.GetName]§!未建設其他§Y實驗設施§!，我們將在§Y[2.GetName]§!獲得§G1§!座§Y空氣動力學與航空電子研究設施§!。"
 ITA_expand_rome_flying_school: "擴大羅馬飛行學校"
 ITA_expand_rome_flying_school_desc: "變得越來越複雜的現代飛機會因飛行員訓練不充分而使事故發生的概率倍增。我們必須確保飛行學校的教學內容跟上技術的發展和增強我們軍事能力的需求。"
 ITA_reggianes_exports: "出口雷賈尼戰機"
 ITA_reggianes_exports_desc: "雷賈尼公司所設計的一系列優秀戰鬥機，已經吸引了許多想要現代化空軍的外國軍方。如果我們允許雷賈尼公司出口他們的飛機，基於客戶們的定製要求，勢必會讓雷賈尼獲得改造飛機的經驗，無疑是對我們發展自己的計劃頗有價值的。"
 ITA_diving_bombers: "俯衝轟炸機"
 ITA_diving_bombers_desc: "密接支援多年以來一直是軍事界飽受關注的話題。長期以來飛機一直被用來從高空進行轟炸，但似乎已經有幾個國家已經開始了這方面的開發，這種專業化的飛機可以從高空俯衝，並以極高的精度投放炸彈。雖然我們的產業毫無疑問可以及時生產出這種飛機，但其他國家也同樣基於該目的進行了不少研究。"
 ITA_superaereo: "空軍最高指揮部"
 ITA_superaereo_desc: "小型機隊在戰場上肆意妄為的時代已經結束了。現代的空中戰役在許多方面有著接近陸地戰鬥的複雜度。因為，我們需要專門的計劃人員來協調我們的各個飛機中隊，以便他們能夠協同作戰，完成任務。"
 ITA_officers_of_the_service_role: "勤務軍官"
 ITA_officers_of_the_service_role_desc: "單從陸軍選拔軍官並向他們教授飛行已經不能滿足我們的需求。我國空軍需要在航空勤務中成長曆練的新一代軍官，而不是僅僅接受知識灌輸的人。"
 ITA_standardization: "標準化"
 ITA_standardization_desc: "與海戰和陸戰相比，空戰更偏向工業實力的對抗。數量是唯一決定性的因素。我們必須保證能夠儘可能多地生產飛機，即便後續設計會更艱難也要這麼做。"
 ITA_specialization: "專業化"
 ITA_specialization_desc: "不管我們怎樣努力，我們都難以在飛機產量上和更大的強權所匹敵。唯一的方法是設計製造出比別人都要優秀的飛機。我們的飛機將能夠在同時面對三四架敵機時取得勝利。"
 ITA_multirole_aircraft: "多用途飛行器"
 ITA_multirole_aircraft_desc: "通過研發能在戰鬥中執行各式任務的機身，我們可以節省大量的生產花費和人員訓練時間。我們將立刻集中工程師設計此類多用途機身。"
 ITA_long_range_aircraft: "長程飛行器"
 ITA_long_range_aircraft_desc: "敵方的基地、工業區和補給線經常處在遠離前線的大後方。我們需要開發和改進長程飛行器，使其可以飛抵關鍵目標上空並予以痛擊。"
 ITA_fighter_designs: "戰鬥機設計"
 ITA_fighter_designs_desc: "戰鬥機是所有空軍的骨幹。我們必須保障我方戰鬥機有能力取得制空權，還能護衛我方轟炸機抵達目標。"
 ITA_bomber_designs: "轟炸機設計"
 ITA_bomber_designs_desc: "通過更新轟炸機的設計，我們的空軍將能為陸上和海上作戰提供更強力的支援，並且能威脅到敵軍部隊及其補給線。"
 ITA_supremacy_in_the_skies: "空中霸權"
 ITA_supremacy_in_the_skies_desc: "現代軍隊的成功運轉離不開強大空軍的支援。我國必須掌握最先進的飛機設計和製造技術，以此制霸藍天。"
 ITA_naval_power_projection: "海軍力量投射"
 ITA_naval_power_projection_desc: "追隨我們先祖的遺產，我們必須確保海軍工業能力足夠強大。以此為基礎，我們將能夠發展一支令一切對手望而生畏的海軍，確立我們在地中海的霸權地位。"
 ITA_intensify_torpedo_manufacturing: "加強魚雷生產"
 ITA_intensify_torpedo_manufacturing_desc: "意大利魚雷的可靠性在世界上首屈一指。阜姆可是魚雷誕生的地方，再加上那不勒斯的意大利魚雷工廠，我們有進一步發展這一致命海軍武器的能力。"
 ITA_expand_naval_facilities: "擴建海軍設施"
 ITA_expand_naval_facilities_desc: "一流的海軍需要的不僅是強大的作戰艦隊，還有為他們提供支援的港口與船塢。興建海軍設施可以擴大我國海軍基地的數目，並提供戰時必需的建造和維修能力。"
 ITA_oto_naval_guns: "奧托艦炮"
 ITA_oto_naval_guns_desc: "意大利依賴安薩爾多和奧德羅-特爾尼-奧蘭多公司生產主力艦所搭載的巨炮。通過對兩家公司生產能力進行針對性投資，我們未來的戰列艦將讓世界豔羨。"
 ITA_improve_overseas_naval_bases: "升級海外海軍基地"
 ITA_improve_overseas_naval_bases_desc: "我們在升級位於海外領土的各大港口的同時，也為我們的海軍打下了堅實的基礎，幫助他們保衛我們不斷崛起的帝國，並威脅敵人的貿易線路。"
 ITA_milizia_marittima_di_artiglieria: "岸防火炮民兵"
 ITA_milizia_marittima_di_artiglieria_desc: "意大利海岸線漫長、離島港口眾多，實在是易攻難守。改革岸防民兵並建造岸防設施可讓來犯之敵付出沉重的代價。"
 ITA_supermarina: "海軍最高指揮部"
 ITA_supermarina_desc: "我們應該為意大利皇家海軍的總司令閣下建立一個現代的行動中心，以便更好地協調海軍在地中海或其他海域的編隊行動。"
 ITA_stockpile_fuel: "儲備燃油"
 ITA_stockpile_fuel_desc: "石油對於戰艦來說，就像血液對於人體來說那般重要。沒有石油供應，我們的艦隊什麼也做不了。考慮到意大利國內缺少穩定的石油供給，為了保證我們的海軍能夠在石油進口被切斷的情況下繼續行動，建造足夠的油罐並填滿它們至關重要。"
 ITA_forza_navale_especiale: "海軍特種部隊"
 ITA_forza_navale_especiale_desc: "在地中海地區的衝突中，投送兩棲力量的能力將是極為寶貴的。我們將建立一支專為兩棲作戰行動而訓練、武裝的海軍特種部隊，以此把海上力量投送至地中海漫長海岸線上的任意一點。"
 ITA_naval_air_coordination: "海空協同"
 ITA_naval_air_coordination_desc: "直到現在，我們的空軍最高指揮部仍然我行我素，沒有很好地與我們的海軍配合。這妨礙了意大利皇家海軍進行有效的偵察任務。通過發展海空協調的聯合作戰方式，並加強兩軍間的通訊體系，我們的艦隊可以更高效地尋找並打擊敵人。"
 ITA_decima_flottiglia_mas: "第十魚雷艇支隊"
 ITA_decima_flottiglia_mas_desc: "海軍工程部隊的泰賽奧·泰賽伊和埃利奧斯·托斯基設計了一種可用於滲透敵人港口進行攻擊的自航魚雷。通過投資開發此魚雷以及其他特種武器，並訓練特種部隊使用之，我們或許可以對敵人取得出其不意的巨大勝利。"
 ITA_incrociatori_leggeri: "輕巡洋艦"
 ITA_incrociatori_leggeri_desc: "輕巡洋艦敏捷而火力強大，不僅能夠對付同噸位的敵艦、還能高效地清理敵驅逐艦，而且造價低廉、可供大量列裝。輕巡洋艦在保護我國海上航路、打擊敵方運輸船隊方面的作用至關重要。過去，我國在使用傭兵隊長級、蒙泰庫科利級以及加里波第級巡洋艦的同時積攢了大量寶貴經驗，我們可以在此基礎上打造新式巡洋艦隊並制霸地中海。"
 ITA_incrociatori_pesanti: "重巡洋艦"
 ITA_incrociatori_pesanti_desc: "目前，意大利缺少工業實力以建造足夠的戰列艦，來滿足我們在各處緊迫的需要。但是通過建造擁有強大火力與優秀防護的，如同扎拉級那樣的巡洋艦，我們可以多個作戰海域爭奪制海權。"
 ITA_expand_naval_intelligence: "擴張海軍情報局"
 ITA_expand_naval_intelligence_desc: "意大利信號情報局一直以來經費都十分受限，運轉很大程度上依賴喬治·韋裡塔·波埃塔和路易吉·唐尼尼兩位才子，但這種情況馬上就要結束了。我們將給情報局配備更多人員，招募如埃利索·波爾托海軍中尉的人才。如此，我們在破解敵方密碼、揭示敵軍動向方面將更有可能取得成功。"
 ITA_cooperation_programs: "合作項目"
 ITA_cooperation_programs_desc: "我國強大的造船及軍備工業近來有為其他國家建造或參與協助設計軍艦的歷史，例如協助希臘建造的九頭蛇級驅逐艦和向蘇聯提供的7號計劃艦船系列。尋找類似的機會有助於進一步發展我們的工業基礎以應對未來的試煉。"
 ITA_cruiser_submarines: "巡洋潛艇"
 ITA_cruiser_submarines_desc: "為了攻擊位於地中海以外敵人的航道，我們需要可以在遠洋中漫遊的長程潛艇。基於工程師卡瓦利尼和貝爾納迪斯的工作成果，我們將為已在廣泛施行中的一戰後潛艇計劃提供進一步支持，來實現這一目標。"
 ITA_midget_submarines: "袖珍潛艇"
 ITA_midget_submarines_desc: "清澈的地中海水對於大型潛艇是個致命的問題。短程且隱蔽的小型潛艇在地中海環境中有更高的生存幾率，並且給予我們以巡邏例如西西里海峽等咽喉地帶海域的能力。"
 ITA_cacciatorpediniere_di_scorta: "護航驅逐艦"
 ITA_cacciatorpediniere_di_scorta_desc: "[GetAppropriateRegiaMarinaNsName]的核心任務之一，就是保衛我們在意大利、北非和地中海島嶼間的航線的安全。通過建造一些用於反潛的小型驅逐艦，並有效地訓練我們的船員，我們將能夠保障海外部隊的補給充足。"
 ITA_ispettorato_dei_mezzi_antisommergibili: "反潛作戰指揮部"
 ITA_ispettorato_dei_mezzi_antisommergibili_desc: "成立反潛作戰指揮部(Mariantisom)可以讓我們有更好協調護衛艦艇的組織能力，還能刺激技術創新，使我們在與敵方潛艇作戰時獲得更多優勢。"
 ITA_navi_da_battaglia: "戰列艦"
 ITA_navi_da_battaglia_desc: "維托里奧·維內托級戰列艦是海軍模範主力艦中強大而快速的典型。我們將建造更多的此類艦船，並優化海軍學說以更有效地使用她們，這將會顯著地強化我們的戰列線。"
 ITA_proper_carriers: "正規航母"
 ITA_proper_carriers_desc: "過去十年裡，路易吉·加尼奧托等有創新思維的設計師一直負責為海軍設計艦隊航母。如果我們充分運用他們的專長與羅馬號快速郵輪的現有船體（當然，還要為其換裝更強勁的新式引擎），我們新一艘可用於實戰的航母下水的速度相比於從頭造起就要快得多。"
 ITA_refit_civilian_ships: "改裝民用船隻"
 ITA_refit_civilian_ships_desc: "儘管專門設計的艦隊航母能提供更為強大的支援，不過如果我們想快些獲得航母，就不得不走些捷徑。我們可以改裝現有的如國王號和薩伏依公爵號這樣的郵輪，從而儘快為艦隊提供空中掩護。"
 ITA_flotta_d_evasione: "突破艦隊"
 ITA_flotta_d_evasione_desc: "長久以來，意大利的海軍雄心只能被侷限於地中海和紅海。如果我們打造出一支“突破艦隊”並設計建造用於大西洋和印度洋的艦艇，就能揚國威於四海。"
 ITA_ethiopian_war_logistics_bba: "埃塞俄比亞戰爭後勤"
 ITA_ethiopian_war_logistics_bba_desc: "埃塞俄比亞戰事進展停滯，明顯是由於我們低估了現代軍隊的後勤補給需求。我們必須致力於改善在東非根據地的道路和港口，以此使必要物資順利抵達前線。"
 ITA_the_abyssinian_fiasco: "在阿比西尼亞的慘敗"
 ITA_the_abyssinian_fiasco_desc: "我國對埃塞俄比亞的戰爭堪稱災難，意大利軍隊再一次遭受了連埃塞俄比亞都打不過的恥辱。我們已經像阿杜瓦的先輩們一樣被擊敗了。我們無法想像，如此大規模的失敗對法西斯體制的未來究竟意味著什麼。"
 ITA_solid_progress: "穩步推進"
 ITA_solid_progress_desc: "我軍在埃塞俄比亞穩步推進，既沒有過度拉長戰線，也未遭埃塞俄比亞軍隊反攻。雖然勝利果實目前尚未到手，但這只是個時間問題了。"
 ITA_struggle_in_ethiopia: "在埃塞俄比亞的苦戰"
 ITA_struggle_in_ethiopia_desc: "我們在埃塞俄比亞的進展大幅落後於計劃，但決不能讓這樣一個小挫折打擊我軍士氣。意大利軍隊和法西斯體制必須勝利——不計任何代價。"
 ITA_undermine_the_duce: "削弱領袖"
 ITA_undermine_the_duce_desc: "墨索里尼征服埃塞俄比亞的瘋狂慾望讓我們再次落入失敗的邊緣。儘管仍有勝利的可能，但必須明白這將不會是墨索里尼的勝利。"
 ITA_conspiracies_in_the_shadows: "幕後密謀"
 ITA_conspiracies_in_the_shadows_desc: "廟堂中不滿墨索里尼的聲音正逐漸增加。密謀已被籌劃，差異巨大的各勢力間也組成了聯盟。變革之時正在奔來。"
 ITA_servizio_informazione_militare: "軍事情報局"
 ITA_servizio_informazione_militare_desc: "我們的軍隊需要準確的情報來制定計劃、開展行動。因此，我們需要一箇中央情報組織來收集和分析這些情報，並在必要時，對特定的目標採取激進行動。"
 ITA_triumph_in_africa_bba: "在非洲的勝利"
 ITA_triumph_in_africa_bba_desc: "阿杜瓦之恥已得洗刷。阿杜瓦大敗的記憶困擾我們四十年之久，我們終於大仇得報。我們的軍隊在戰爭中證明了他們的實力，掃除了一切懷疑；現在世界也必須對我國我軍另眼相看。"
 ITA_defeat_in_ethiopia_flag: "[ITA.GetNameDefCap]在[ETH.GetNameDef]被擊敗"
 ITA_devaluate_the_lire: "貶值里拉"
 ITA_devaluate_the_lire_desc: "我們為這場戰爭所付出的代價大幅超出預期，國家經濟也因此陷入其副作用的泥沼。貶值我們的貨幣能夠使我們的產品在國際市場上更有競爭力，但會讓普通意大利人民的生活水平有所下降——這是一個他們會願意做出的犧牲。"
 ITA_anglo_italian_agreements: "英意協議"
 ITA_anglo_italian_agreements_desc: "隨著東非形勢的新變化，其他的殖民帝國必須和我們達成一些新的協議。我們需要他們允許我們的船隻通過蘇伊士運河，但他們更需要我們。如果他們拒絕了，我們就得尋找別處的支持。"
 ITA_topple_amhara_rulers: "策反阿姆哈拉王公"
 ITA_topple_amhara_rulers_desc: "埃塞俄比亞實際的多元分離程度遠比大多數人認為更嚴重。許多地方團體根本不是舊埃塞俄比亞政權的堅定支持者，我們稍微給點小讓步就會使其倒向我們這邊，以此更好地在當地統治維穩。"
 ITA_the_new_emperor_of_ethiopia: "埃塞俄比亞的新皇帝"
 ITA_the_new_emperor_of_ethiopia_desc: "埃塞俄比亞的人民數個世紀以來都生活在皇帝的統治下。如果讓我國國王加冕為埃塞俄比亞新皇帝，代替原來那位舊皇帝，我們治理埃塞俄比亞的任務將會簡單許多。"
 ITA_ministero_della_cultura_popolare: "大眾文化部"
 ITA_ministero_della_cultura_popolare_desc: "我們的人民所獲取的信息必須永遠是準確的。在戰時，敵方特工可以輕易地散播虛假信息。而我們必須向人民傳達真實、準確的事件，以此與這些敵特分子對抗。"
 ITA_culto_del_duce: "領袖崇拜"
 ITA_culto_del_duce_desc: "貝尼托·墨索里尼，非洲的征服者，阿杜瓦的復仇者，毫無疑問是自羅馬帝國以來最重要的意大利政治家。他有著絕對的男子氣概，勇敢而無畏的精神。我們應該讓每個意大利人都明白，他們應該努力變成墨索里尼那樣的人。"
 ITA_devotion: "辛勤奉獻"
 ITA_devotion_desc: "意大利人欠墨索里尼太多了。他憑藉著純粹的意志力，讓意大利人得到全方位的提升。意大利人變得更加勇敢，富有，道德完善。意大利人唯一能夠回報給墨索里尼的事便是萬分感激他，並堅定地聽從他的指揮。"
 ITA_legge_bottai: "博塔伊法"
 ITA_legge_bottai_desc: "羅馬人的藝術和文化是現代歐洲文化的基礎。我們決不能讓那些歷史瑰寶被現代主義藝術所取代。意大利人總是在展望未來，但從未忘記回顧過去。"
 ITA_boost_the_grand_council_of_fascism: "強化法西斯大委員會"
 ITA_boost_the_grand_council_of_fascism_desc: "貝尼托·墨索里尼為意大利做了很多，但他始終只是一個凡人。如果他讓國家誤入歧途，法西斯大委員會將站出來阻止他。"
 ITA_to_live_as_a_lion: "生如雄獅"
 ITA_to_live_as_a_lion_desc: "意大利人民並非生而為羔羊，他們不應該安於爭奪歷史舞臺的配角之位，而是要牢牢把握住自己的命運！貝尼托·墨索里尼就是讓他們這麼做的人，他告誡所有人：一日生如雄獅，勝過百年碌似羔羊。"
 ITA_la_battaglia_del_grano: "糧食之戰"
 ITA_la_battaglia_del_grano_desc: "一個國家如果連糧食都要依賴他國，便稱不上真正的大國。意大利必須在基本糧食上獨立自主，這樣他國才會對我國更加敬畏。為了實現這一目標，我們必須如在戰場上戰鬥一般進行這場名為糧食自給的戰鬥。只有先在糧食之戰中取勝，我們才可能在戰爭中取勝。"
 ITA_la_battaglia_per_la_terra: "土地之戰"
 ITA_la_battaglia_per_la_terra_desc: "一個強大的法西斯社會的基礎，正是土地和在其之上勞作的人民。在意大利仍有許多地方可以通過抽乾沼澤和灌溉農田來得到富有價值的土地。"
 ITA_la_battaglia_per_le_nascite: "生育之戰"
 ITA_la_battaglia_per_le_nascite_desc: "如果我們想在世界上取得恰當的位置，我們必須有能夠奪取如此地位的軍事力量。為了這一目的，我們必須要有足夠的士兵。對一對夫妻來說，養育僅僅一兩個子女是遠遠不夠的——在我們贏得軍事上的戰爭前，我們必須先贏得生育上的戰爭。"
 ITA_strengthen_the_regime: "加強統治"
 ITA_strengthen_the_regime_desc: "爭取經濟獨立的鬥爭證明了法西斯並非是如同先前的自由主義一樣軟弱可欺的意識形態。我們要讓人民永遠牢記這點。"
 ITA_the_man_of_providence: "天選之人"
 ITA_the_man_of_providence_desc: "墨索里尼不僅是時勢所造的英雄，他的每一步都奉天之命，從而得以牢牢控制意大利。"
 ITA_believe_obey_fight: "相信、服從、戰鬥"
 ITA_believe_obey_fight_desc: "我黨建立在樸實簡單的信條上。首先，欲掌權者必先信之；其次，欲掌權者必從領袖；再者，欲掌權者必奮鬥之。掌權是任何名副其實的政治活動的唯一真正目標。"
 ITA_banda_carita: "志願安保團"
 ITA_banda_carita_desc: "戰爭不總是一項光榮的任務。雖然大眾可能會更加關注發生在前線的戰鬥，但我們清楚，後方的戰鬥也同樣重要。例如，根除我們新得到的土地上的抵抗運動，就是一場十分必要的戰鬥。"
 ITA_banda_koch: "科赫團"
 ITA_banda_koch_desc: "現代戰爭是全民性質的戰爭。這意味著戰鬥並不止發生在前線。我們同樣需要戰鬥人員確保通訊線路的暢通。"
 ITA_security_militias: "治安民兵"
 ITA_security_militias_desc: "調用前線部隊來保障後方地區的安全是對優秀士兵的浪費。我們應該建立一些專門保障軍隊後方安全的單位，來騰出更多的士兵，並將他們投入到前線的戰鬥中去。"
 ITA_battaglioni_d_assalto: "突擊營"
 ITA_battaglioni_d_assalto_desc: "我們的黑衫軍有著在上一次大戰中充當突擊部隊的驕傲傳統。將他們整合進軍隊後，我軍將能夠在戰鬥中給敵人一記重拳。"
 ITA_strengthen_the_blackshirts: "強化黑衫軍"
 ITA_strengthen_the_blackshirts_desc: "皇家陸軍被舊政權層層限制，而且對法西斯主義的熱誠低得令人擔心。我們明顯需要組建完全由自己人構成的、忠誠的黑衫軍部隊。"
 ITA_milizia_coloniale: "殖民地民兵"
 ITA_milizia_coloniale_desc: "我們必須通過在殖民地徵召忠於我們政權的新兵來擴大並增強我們的法西斯民兵——黑衫軍。而且招募對象不僅是當地的意大利殖民者，還包括當地的原住民。這將大大增加我們徵召新兵的人數。"
 ITA_towards_a_greater_italy: "邁向大意大利"
 ITA_towards_a_greater_italy_desc: "意大利民族統一運動是世界大戰後協約國背棄意大利民族的必然產物。意大利按理而言必須徹底統治地中海，因此我們需要開疆拓土。"
 ITA_heroes_of_the_nation: "民族英雄"
 ITA_heroes_of_the_nation_desc: "我們必須認可並褒揚我們民族傑出英雄們的美德，雖然我們也不能忘記：沒有領袖的英明領導，英雄們的才華將一無是處。"
 ITA_capo_supremo: "最高統帥"
 ITA_capo_supremo_desc: "意大利只有一人能將應得的榮耀和強力帶給我們偉大的國家。腐朽墮落的君主制已壽終正寢，是時候讓我們孔武強勁的領袖成為意大利的最高統帥了。"
 ITA_bend_the_bars: "打破囚籠"
 ITA_bend_the_bars_desc: "英國在世界大戰後打造了囚禁意大利的牢籠。意大利越是人丁興旺、國富民強，就越苦於囹圄之災。是時候打破監獄的牢籠，讓意大利布武四方了。"
 ITA_subdue_the_sentinels: "降伏守衛"
 ITA_subdue_the_sentinels_desc: "邁向意大利民族嚮往的自由與光榮的下一步，是降伏將我們囚禁在地中海的守衛們——那就是直布羅陀和蘇伊士。"
 ITA_a_colonial_empire: "殖民帝國"
 ITA_a_colonial_empire_desc: "儘管老牌外敵橫加干涉，但意大利如今已是一個強大的殖民帝國。我們不僅要充分利用意大利的現有領土，還需要在非洲繼續開疆拓土。"
 ITA_by_blood_alone: "唯有浴血"
 ITA_by_blood_alone_desc: "有賴於我軍的強大與忠於黨國的意大利民族統一分子的無上赤誠之心，意大利終將作為歷史的主角留名史籍，而非只是小小的配角。\n唯有浴血方能驅動歷史的車輪！"
 ITA_masters_of_the_aegean: "掌控愛琴海"
 ITA_masters_of_the_aegean_desc: "欲控制地中海，意大利必先徹底主宰愛琴海。這樣一來，我國將不僅控制黑海出入口和大部分巴爾幹海岸，還可以建立能夠控制蘇伊士運河的新海軍基地。"
 ITA_masters_of_the_mediterranean: "稱霸地中海"
 ITA_masters_of_the_mediterranean_desc: "一國實力與其海權地位對等。宣佈徹底控制地中海的時機已到，意大利民族有權主導這片作為本文明搖籃的古老海洋。"
 ITA_convene_the_grand_council: "召集大委員會"
 ITA_convene_the_grand_council_desc: "我們必須召集法西斯大委員會來討論如何處置墨索里尼。他最近對埃塞俄比亞的侵略，以及拒絕與別人分享權力和責任，使許多人對他的領導能力產生了質疑。他曾經很好地為這個國家服務，甚至代表了法西斯主義的風貌，但也許是時候換一個新領導人了……"
 ITA_foreign_affairs: "外交事務"
 ITA_foreign_affairs_desc: "每一個強權都需要建立一個明確的對外政策，並訓練有才華的人，讓他們能夠以正確的方式進行外交活動來達成國家所需的目標。"
 ITA_balkan_ambition: "巴爾幹雄心"
 ITA_balkan_ambition_desc: "是時候向東，向斯洛文尼亞，甚至達爾馬提亞海岸進軍來擴大意大利的邊界了。我們會將會強調威尼斯人在達爾馬提亞的文化傳承，並讓世界看到威尼斯政府不僅在過去為達爾馬提亞人提供了許多支持，而且深受他們的歡迎。"
 ITA_potential_allies_in_the_balkans: "巴爾幹潛在盟友"
 ITA_potential_allies_in_the_balkans_desc: "為了控制巴爾幹地區，我們不需要征服並統治巴爾幹的所有國家。現在，我們可以在巴爾幹國家中用外交手段尋找有利的盟友，然後用武力手段征服剩下的國家。"
 ITA_albanian_occupation: "佔領阿爾巴尼亞"
 ITA_albanian_occupation_desc: "我們的軍隊可以輕鬆的佔領阿爾巴尼亞，在這一過程中，我們不太可能會遇到像樣的抵抗。我們必須向世界展示意大利的實力，恢復往昔榮耀！"
 ITA_albanian_oil: "阿爾巴尼亞石油"
 ITA_albanian_oil_desc: "現在我們已經完全控制了整個阿爾巴尼亞。是時候換掉過去石油特許公司的老舊裝備，把它變成一套強有力的採油工業了。"
 ITA_support_albanian_irredentism: "支持阿爾巴尼亞民族統一運動"
 ITA_support_albanian_irredentism_desc: "我們必須合法化我等在阿爾巴尼亞的統治。倘若支持阿爾巴尼亞民族統一運動宣稱科索沃、伊庇魯斯甚至更多地區，我們一定會在當地人中間贏得顯著的公眾支持，同時能使我們向更遠的地方拓展影響力。"
 ITA_albanian_fascist_militia: "[GetAppropriateAlbanianFascistMilitiaName]"
 ITA_albanian_fascist_militia_default: "阿爾巴尼亞法西斯民兵"
 ITA_albanian_fascist_militia_alt: "君主派民兵"
 ITA_albanian_fascist_militia_desc: "我們要成立意大利黑衫軍的阿爾巴尼亞支部，不僅要招募當地意大利移民，還應包括阿爾巴尼亞志願兵。"
 ITA_guarantee_austrian_independence: "保障奧地利獨立"
 ITA_guarantee_austrian_independence_desc: "我們再也無法容忍德國對奧地利的干涉了，這對意大利民族與歐洲的力量平衡構成了巨大的威脅。我們將保障奧地利的獨立，防止德國利用任何外交手段來影響奧地利。"
 ITA_negotiate_italian_claims: "協商意大利宣稱"
 ITA_negotiate_italian_claims_desc: "由於前協約國們正在拼命想要離間德意關係，我們的反德立場使我們在前協約國們中有著重要的地位。我們必須妥善利用當前形勢，收回本應在一戰後就屬於我們的殖民地。"
 ITA_peace_with_ethiopia_tt: "完成與§Y[ETH.GetNameWithFlag]§!的和談後："
 ITA_ENG_must_control_necessary_states_tt: "§Y[ENG.GetNameWithFlag]§!並未控制英國曆史上在非洲之角和馬耳他的殖民地。"
 ITA_FRA_must_control_necessary_states_tt: "§Y[FRA.GetNameWithFlag]§!並未控制法國曆史上在吉布提和突尼斯的殖民地。"
 ITA_ratify_the_stresa_front: "批准斯特雷薩陣線"
 ITA_ratify_the_stresa_front_desc: "意大利已獲盟友給予的領土讓步，現在是時候將法意兩國共同納入新的軍事聯盟了——斯特雷薩陣線。"
 ITA_joint_military_programs: "聯合軍事項目"
 ITA_joint_military_programs_desc: "我們必須促進意大利同其新盟友在軍事和科技領域的合作，畢竟這兩者的關係實在過於密切。"
 ITA_italys_destiny: "意大利天命"
 ITA_italys_destiny_desc: "我們必須在這個同盟中確立意大利應得的地位：那就是成為地中海的海權霸主。實現該目標的下一步關鍵是掌控巴爾幹。"
 ITA_the_eastern_threat: "東方威脅"
 ITA_the_eastern_threat_desc: "新興的蘇聯對我們與所有西方國家的利益造成了威脅，這已經是人盡皆知的事情。我們會通過封鎖他們最富有地區之一的黑海來摧毀他們擴張的能力。"
 ITA_german_military_cooperation: "對德軍事合作"
 ITA_german_military_cooperation_desc: "$ITA_german_millitary_cooperation_desc$"
 ITA_sea_wolves_bba: "海狼"
 ITA_sea_wolves_bba_desc: "$ITA_sea_wolves_desc$"
 ITA_secret_weapons: "$secret_weapons$"
 ITA_secret_weapons_desc: "$secret_weapons_desc$"
 ITA_treaty_with_germany: "對德協議"
 ITA_treaty_with_germany_desc: "$ITA_german_rd_treaty_desc$"
 ITA_request_control_of_french_territories: "要求控制法國領土"
 ITA_request_control_of_french_territories_desc: "$ITA_claims_on_france_desc$"
 ITA_befriend_japan: "對日示好"
 ITA_befriend_japan_desc: "$ITA_japan_friend_desc$"
 ITA_italian_irredentism: "意大利民族統一運動"
 ITA_italian_irredentism_desc: "上次世界大戰之後，意大利民族統一運動隨著法西斯主義崛起而愈發狂熱。是時候了，恢復意大利的天然邊界，統一所有意大利民族的正統領土！"
 add_faction_goal_secure_north_africa_tt: "如果[ROOT.GetName]處於陣營中，添加§Y$secure_north_africa_goal_name$§!目標。"
 ITA_war_with_france: "對法作戰"
 ITA_war_with_france_desc: "$ITA_go_after_france_desc$"
 ITA_war_with_greece: "對希臘作戰"
 ITA_war_with_greece_desc: "如果沒有希臘，我們還能算什麼帝國？這應該是個簡單的目標……"
 ITA_war_with_the_uk: "對英作戰"
 ITA_war_with_the_uk_desc: "$ITA_anti_uk_war_goals_desc$"
 ITA_befriend_greece: "對希臘示好"
 ITA_befriend_greece_desc: "$ITA_greece_friend_desc$"
 ITA_claims_on_turkey_bba: "聲索土耳其領土"
 ITA_claims_on_turkey_bba_desc: "$ITA_claims_on_turkey_desc$"
 ITA_befriend_turkey: "對土耳其示好"
 ITA_befriend_turkey_desc: "$ITA_turkey_friend_desc$"
 ITA_corpo_di_truppe_volontarie: "志願軍團"
 ITA_corpo_di_truppe_volontarie_desc: "$ITA_support_nationalist_spain_desc$"
 ITA_spanish_italian_alliance: "西意同盟"
 ITA_spanish_italian_alliance_desc: "$ITA_spanish_italian_faction_desc$"
 ITA_demand_balearic_islands_bba: "索取巴利阿里群島"
 ITA_demand_balearic_islands_bba_desc: "$ITA_demand_balearic_islands_desc$"
 ITA_befriend_portugal: "對葡萄牙示好"
 ITA_befriend_portugal_desc: "$ITA_portugal_friend_desc$"
 banda_carita_tt: "阻止德國完成§Y$GER_assassinate_mussolini$§!國策"
 ITA_demand_ticino: "索取提契諾"
 ITA_demand_ticino_desc: "瑞士山巒起伏、民族眾多，但是其中有主要居住於該國提契諾等南方各州的意大利人。如果要建立大意大利國，我們必須要讓我族同胞生活在同一個國家。"
 ITA_austrian_guarantees_tt: "意大利可在德奧合併的事件中選擇干涉。"
 ITA_all_eth_initial_states_controlled_tt: "所有埃塞俄比亞初始地區被§Y[ROOT.GetFlag][ROOT.GetNameDef]§!或§Y[ROOT.GetAdjective]的盟友§!控制。"
 ITA_fronte_militare_clandestino_modifier_tt: "獲得修正：§Y$ITA_fronte_militare_clandestino_modifier$（意大利）§!（§Y730§!日），其效果為：\n   $MODIFIER_RESISTANCE_GROWTH_ON_OUR_OCCUPIED_STATES$：§G+10%§! \n   $MODIFIER_REQUIRED_GARRISON_FACTOR$：§R+15%§! \n\n"
 ITA_flotta_d_evasione_admiral_traits_tt: "隨機2名海軍將官獲得§Y$bold$§!特質：\n-$MODIFIER_NAVAL_SPEED$：§G+10%§!\n-$MODIFIER_NAVAL_DAMAGE_FACTOR$：§G+5.00%§!\n\n"
 ITA_heroes_of_the_nation_general_traits_tt: "\n隨機三名將軍將獲得§Y$war_hero$§!特質：\n-$MODIFIER_UNIT_LEADER_PROMOTE_COST_FACTOR$：§G-50.0%§!\n-$MODIFIER_REASSIGNMENT_DURATION_FACTOR$：§R+50.0%§!\n\n"
 ITA_mussolini_becomes_field_marshal_tt: "$ITA_benito_mussolini$成為陸軍元帥"
 ITA_the_italian_liberation_war: "意大利解放戰爭"
 ITA_the_italian_liberation_war_desc: "現在是時候發動起義，推翻法西斯主義者的暴政並摧毀他們腐朽的統治了！來自意大利各地的反法西斯游擊隊們已經集結起來，準備好為國家解放戰爭的勝利獻出自己的生命！"
 ITA_fronte_militare_clandestino: "秘密軍事陣線"
 ITA_fronte_militare_clandestino_desc: "我們會建立一支秘密民兵組織來和各個意大利城市中的抵抗組織取得聯繫，並連接我們軍事力量的信息網絡，以便協調我們的軍事行動和敵後游擊。"
 ITA_corpo_volontari_della_liberta: "自由志願軍"
 ITA_corpo_volontari_della_liberta_desc: "國家解放委員會決定強化我們軍事協調系統的結構，自由志願軍，以便有效地協調游擊隊和軍事力量。"
 ITA_the_carabinieri: "憲兵隊"
 ITA_the_carabinieri_desc: "由於憲兵隊們在法西斯政權的崩塌中發揮了重大的作用，他們現在正在遭到法西斯主義者的攻擊，他們當中的許多人因此加入了意大利抵抗運動。我們應該將這些志同道合的人們吸納進入意大利解放軍裡。"
 ITA_gappisti: "愛國行動小組"
 ITA_gappisti_desc: "我們會成立一個愛國行動小組，一支在城市裡行動小型的游擊隊單位，形式類似於法蘭西抵抗組織。我們的愛國行動小組會在敵後襲擊敵人，降低駐軍的士氣並獲取當地人的支持。"
 ITA_partisan_republics: "游擊隊共和國"
 ITA_partisan_republics_desc: "我們會在被游擊隊解放的地方建立一種所謂游擊隊共和國的臨時政權，以作為集結游擊隊戰士，並讓敵人在後方忙得焦頭爛額的一種手段。"
 ITA_the_kings_finest: "王軍之冠"
 ITA_the_kings_finest_desc: "我們會組建一些由忠於意大利王室的軍官和士兵組成的特種部隊，並將他們訓練成意大利解放軍中的精英力量。"
 ITA_grande_rivolta_rurale: "農村大起義"
 ITA_grande_rivolta_rurale_desc: "是時候讓意大利農民加入我們的事業，並肩對抗那些法西斯壓迫者了。敵人將再也不能在鄉村地區立足。"
 ITA_liberation_or_death: "不自由，毋寧死！"
 ITA_liberation_or_death_desc: "我們在為意大利人民從法西斯壓迫者手中解放艱難鬥爭。我們雖然遭受了巨大的損失，但這並不是徒勞無功，是時候讓我們發起最後的進攻，將法西斯分子從意大利根除出去了。"
 ITA_independence_rds: "意大利獨立"
 ITA_independence_rds_desc: "我們已經受夠了那些所謂的盟友對我們的統治。從現在開始，意大利民族將自己決定自己的命運。如果為了達成這個目的需要再次拋頭顱灑熱血，驕傲的意大利人民會隨時做好準備。"
 ITA_the_italian_social_republic: "意大利社會共和國"
 ITA_the_italian_social_republic_desc: "意大利的保皇派和其他反法西斯勢力已經糾集起來，為推翻我們的政權發起了無恥的叛亂。我們已經將法西斯黨改組為反君主制的共和主義政黨，併成立了意大利社會共和國作為法西斯意大利的新象徵。我們將抵禦敵人的攻擊，重新統一祖國！"
 ITA_guardia_nazionale_repubblicana: "共和國國民警衛隊"
 ITA_guardia_nazionale_repubblicana_desc: "鑑於皇家憲兵隊在推翻法西斯政權的企圖中扮演的角色，我們應當立刻撤換這支部隊。我們已經計劃重建黑衫軍，並建立一支國家共和國衛隊來執行軍警的職責。"
 ITA_integrate_polizia_dell_africa_italiana: "整合意屬非洲警察部隊"
 ITA_integrate_polizia_dell_africa_italiana_desc: "由於殖民地警察們仍然忠於意大利和我們的政權，我們必須整合這些部隊。畢竟，游擊隊們毫無疑問會嘗試掌控這些部隊。"
 ITA_anti_partisan_measures: "反游擊手段"
 ITA_anti_partisan_measures_desc: "敵對游擊隊最近極為猖獗，頻繁的襲擾我們的倉儲並威脅著我們的補給線路。我們必須部署專業化的新式反游擊戰部隊，阻止這些煩人的地痞流氓們。"
 ITA_all_within_the_state: "國家掌控一切"
 ITA_all_within_the_state_desc: "如果我們想要贏下這場血腥的戰爭，就意味著每個人都必須為戰爭貢獻出自己的力量。這些貢獻並非是在戰場上與敵人作戰，我們需要有強大的工業與後勤能力來支撐前線士兵們的作戰。"
 ITA_battaglioni_m: "M營"
 ITA_battaglioni_m_desc: "我們需要新的精英單位來擊退敵人的進攻。我們必須改革並加強在戰鬥中已嶄露頭角的黑衫軍，用這些軍隊來加強我們防線中的薄弱點。敵人從哪來，就把他們趕回哪去。"
 ITA_reinforce_the_gustav_line: "加強古斯塔夫防線"
 ITA_reinforce_the_gustav_line_desc: "我們必須強化我們防線，防止敵軍取得任何突破。意大利社會共和國現在絕對不能遭到動搖。"
 ITA_the_social_republic_prevails: "社會共和國的勝利！"
 ITA_the_social_republic_prevails_desc: "我們在這場由叛徒們操縱發起的殘酷戰爭中已經流了太多的血，但現在一切都結束了！在磨難中浴火重生的意大利將會變得更加強大！"
