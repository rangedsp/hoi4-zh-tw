 ###### NORDIC SHARED IDEAS ######
 NORDIC_to_arms_against_tyranny_ns: "武裝反抗暴政"
 NORDIC_to_arms_against_tyranny_ns_desc: "暴政的魔爪威脅到了北歐鄰國之獨立自主，我國必須盡到捍衛的責任，並做好準備，以免今天是鄰國，下一個就輪到我們。"
 NORDIC_the_nordic_march_ns: "北歐進軍"
 NORDIC_the_nordic_march_ns_desc: "儘管周遭鄰國尚未意識到這一點，但其所謂之暴政實乃變革之風。舊制度焚燬殆盡，新秩序涅槃崛起，而我們則是新北歐秩序的領頭人。"
