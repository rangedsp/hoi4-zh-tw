 SWE_ericsson: "愛立信"
 SWE_gustaf_v_idea: "古斯塔夫五世國王"
 SWE_gustaf_v_idea_desc: "古斯塔夫五世接過王位時，他在瑞典政壇仍有較大權威。多年過去，議會民主制的確立使他的權威不復往昔榮光。雖然國王在名義上支持這一安排，但他與瑞典國會間的摩擦仍時常發生。"
