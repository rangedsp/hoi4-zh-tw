 SWE_folkhemmet_intactness_value: "§Y人民之家狀態：§![SWE_folkhemmet_status_text]（[?SWE.folkhemmet_intactness]/[?SWE.folkhemmet_max_intactness]）"
 SWE_folkhemmet_system_desc: "全世界每一天都在滑向全球衝突的深淵，瑞典現在左右為難：是否應當以福利系統為代價重整軍備，還是冒著毫無準備地進入未來衝突的風險去保持原樣。"
 #SWE_folkhemmet_status_text: "[SWE_folkhemmet_status_text]"
 SWE_folkhemmet_intactness_intact: "§G完整無瑕§!"
 SWE_folkhemmet_intactness_eroding: "§Y風雨剝蝕§!"
 SWE_folkhemmet_intactness_gone: "§R千瘡百孔§!"
 SWE_folkhemmet_army_status_text: "[SWE_rearmament_status_text_army]"
 SWE_rearmament_3_text: "§Y充分資助§!"
 SWE_rearmament_2_text: "§Y中等資助§!"
 SWE_rearmament_1_text: "§Y低資助§!"
 SWE_rearmament_0_text: "§Y無資助§!"
 SWE_folkhemmet_pdx_tooltip: "每一年我們都可以設定[SWE.GetnameDef]的再武裝或去武裝政策。我們越是讓社會朝著再武裝方向推進，§Y戰爭支持度§!、§Y軍用工廠§!及§Y船塢§!建設速度的加成就會越強，而§Y穩定度§!以及§Y民用工廠§!的建設速度則會減弱。\n0點§Y完整值§!的§Y人民之家§!會異化為自身的反面，民用加成為§R負§!，軍事加成為§G正§!。\n\n軍備重整委員會開會期間，我們可以自由改變政策；但一旦委員會閉會，敲定出的方案就會鎖定至下一年。"
 #SWE_folkhemmet_intactness_abolished: "§RAbolished§!"
 SWE_hungershield: "飢餓之盾"
 SWE_hungershield_instant_desc: "如果穩定度低於§Y68%§!，瑞典有發生罷工或騷亂的風險。§Y達成下列條件之一時將被移除：§!\n含通過貿易獲得，總計已擁有的民用工廠超過§Y45§!座\n不含通過貿易獲得，總計已建成的民用工廠超過§Y14§!座\n移除後獲得§G120§!§Y政治點數§!"
 SWE_severe_lack_of_ammunition: "極度缺乏彈藥"
 SWE_severe_lack_of_ammunition_desc: "我軍嚴重缺乏武器彈藥，同時，外包給外國軍工廠的各種小型武器參差不齊、雜亂無章。我們應儘快解決這些問題。"
 SWE_folkhemmet: "人民之家"
 SWE_folkhemmet_desc: "多年來，$SWE_per_albin_hansson$和社會民主黨人推出了一系列被稱為“Folkhemmet”，即“人民之家”的改革浪潮。改革以犧牲軍事預算為代價，為大眾創造了社會保障網絡、改進了住房並增加了教育機會。雖然許多人強烈支持這些改革，但那些更富裕或更崇尚軍國主義的人卻對這些改革不屑一顧。"
 SWE_folkhemmet_communism: "$SWE_folkhemmet$"
 SWE_folkhemmet_communism_desc: "多年來，社會民主黨人推出了一系列被稱為“Folkhemmet”，即“人民之家”的改革浪潮。改革以犧牲軍事預算為代價創造了社會保障網絡、改進了住房並增加了教育機會。鑑於工人專政已經建立，我們可以趁機發展這一政策。"
