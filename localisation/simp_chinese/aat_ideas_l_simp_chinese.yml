 SWE_sami_support_tech_tt: "\n§Y偵察支援連：§!\n§Y積雪§!和§Y$forest$§!：移動速度§G+10%§!\n§Y$hills$§!和§Y$mountain$§!：移動速度§G+5%§!"
 SWE_full_capacity_furnaces: "全容量熔爐"
 SWE_full_capacity_furnaces_desc: "舊日宿敵如今握手言和，其結果是我國原材料攻擊過剩，從前受資源配額限制的重工業現在擁有了全面開工的一切條件。即便如此，我國的原材料庫存仍舊在暴漲。我們得確保通知到全球市場的邊邊角角，我國願意且有能力滿足各國的戰爭資源需求。"
 SWE_nordic_defense_council_military_overhead: "軍費支出"
 SWE_nordic_defense_council_group_name: "北歐研究交換"
 SWE_nordic_defense_council_group_desc: "作為盟友，我們自然要相互分享科技突破和創新成果。"
 SWE_economic_strain: "經濟壓力"
 SWE_economic_strain_desc: "北極光級戰列艦的建造給民用經濟帶來了嚴重的壓力"
 SWE_rationing_policies: "配給制"
 SWE_gateway_to_peace_decision: "保衛芬蘭"
 SWE_gateway_to_peace_decision_tt: "\n控制§Y列寧格勒§!將迫使[SOV.GetName]與我國和[FIN.GetName]達成無條件和平，否則其將面臨嚴重的後果。"
 SWE_escaping_the_mainland: "逃離大陸"
 SWE_hedgehog_of_the_baltic: "波羅的海的刺蝟"
 #ICELAND
 ICE_the_icelandic_economy_modifier: "冰島經濟"
 ICE_the_icelandic_economy_modifier_desc: "冰島的經濟在世界大戰期間因為我國隔絕於世而飽受打擊。然後大蕭條再度給予了重大打擊，而且儘管歐洲大陸稍有恢復，冰島的經濟仍然沒有起色。但也許某一天，我們可以震驚世界……"
 ICE_the_icelandic_economy_modifier_tt: "§Y$ICE_the_icelandic_economy_modifier$§!追加效果："
 ICE_christian_x: "克里斯蒂安十世"
 ICE_christian_x_desc: "克里斯蒂安十世是丹麥和冰島的國王。這兩個國家間最後的連接。"
 ICE_dissent_in_the_working_class: "工人階級不滿"
 ICE_travel_guide: "$ICE_bjorn_olafsson$"
 ICE_marine_corps: "冰島皇家海軍陸戰隊"
 ICE_home_defence_corps: "地方軍"
 ICE_civilian_fleet: "擴大民船隊"
 ICE_fishing_industry: "擴大漁業"
 ICE_fishing_industry_2: "擴大漁業"
 ICE_knud_i: "冰島克努特一世"
 ICE_compensation_purchase_idea: "償付賠款"
 ICE_compensation_sale_idea: "償付賠款"
 ICE_esso: "埃索"
 ICE_eimskip: "冰島輪船公司"
 ICE_vifilfell: "維菲爾費爾"
 ICE_siemens: "西門子（冰島）"
 ICE_transformation_of_nature_state_modifier: "高效能源生產"
 ICE_landsvirkjun: "冰島國家發電合夥企業"
 ICE_greyshirts: "灰衫軍"
 ICE_greyshirts_desc: "從青年中訓練出一支裝備精良的民兵，有助於培育年輕人，使他們適應我們的新世界。除此之外，半軍事化訓練也會增強軍隊的實力，將在收回我國領土時證明自己的價值。"
 ICE_viking_spirit: "阿薩神族"
 ICE_viking_spirit_desc: "古代的維京人總是與無畏和死亡聯繫在一起。他們橫渡大洋，踏上未知的征程，只有強者才能夠獲勝。今日的冰島人必須是無畏和勇敢的，因為我國唯有通過膽量和勇氣才能超越曾經，再度統治北海。"
 ICE_fascist_tech_sharing_group_name: "冰島科研組織"
 ICE_fascist_tech_sharing_group_desc: "冰島國已經與意識形態上合拍的國家組織了一個科研合作項目，目標是增進其技術發展。"
 ICE_hosting_american_soldiers: "招待美軍大兵"
 ICE_hosting_american_soldiers_desc: "在我們的島上招待美軍大兵是我們能誘使他們加入我國，帶來願意為我國的一致目標而戰的勇士。"
 ICE_conscription_idea: "落實兵役"
 ICE_conscription_idea_desc: "為了保護國家主權，冰島的每個成年人都必須在18至22歲之間服為期4年的兵役。"
 ICE_professional_army_idea: "維京分隊"
 ICE_professional_army_idea_desc: "冰島軍隊由最勇敢、最堅強的人組成，隨時準備不惜一切代價保衛冰島國家。"
 ICE_civil_defence_organization: "民防組織"
 ICE_civil_defence_organization_desc: "每一位冰島公民都隨時準備為保護國家、援助人民或拯救基礎設施而竭盡全力。"
 #### DENMARK ####
 #DESIGNERS
 DEN_aalborg_portland: "奧爾堡·波特蘭"
 DEN_danske_stalvalsevaerket_ns: "丹麥鋼鐵廠"
 DEN_designer_can_be_improved_tt: "完成國策§Y$DEN_aalborg_portland_cement_plant$§!將使該設計商獲得強化。"
 DEN_improved_designer_tt: "此設計商已得到強化"
 #NATIONAL SPIRITS
 DEN_industrial_capability_dynamic_modifier: "丹麥工業能力"
 DEN_light_market_regulation_research_bonus: "$DEN_industrial_capability_dynamic_modifier$"
 DEN_industrial_capability_dynamic_modifier_light_regulation: "$DEN_industrial_capability_dynamic_modifier$"
 DEN_industrial_capability_dynamic_modifier_desc: "丹麥自古是農業社會，主要經濟活動是農作物生產，但近來丹麥工業的重要性和經濟意義逐年增加。我們必須實現工業化和現代化，以跟上當代發展的快節奏步伐。"
 DEN_industrial_capability_dynamic_modifier_light_regulation_desc: "$DEN_industrial_capability_dynamic_modifier_desc$"
 DEN_industrial_capability_dynamic_modifier_improved: "$DEN_industrial_capability_dynamic_modifier$"
 DEN_industrial_capability_dynamic_modifier_light_regulation_improved: "$DEN_industrial_capability_dynamic_modifier$"
 DEN_industrial_capability_dynamic_modifier_improved_desc: "丹麥傳統上是一個農業社會和生產國，但其工業的重要性和經濟意義與日俱增。我們已經邁出了工業現代化和發展的第一步，這使我們更具競爭力和生產力。"
 DEN_industrial_capability_dynamic_modifier_light_regulation_improved_desc: "$DEN_industrial_capability_dynamic_modifier_improved_desc$"
 DEN_industrial_capability_dynamic_modifier_max_improved: "$DEN_industrial_capability_dynamic_modifier$"
 DEN_industrial_capability_dynamic_modifier_light_regulation_max_improved: "$DEN_industrial_capability_dynamic_modifier$"
 DEN_industrial_capability_dynamic_modifier_max_improved_desc: "丹麥傳統上是一個農業社會和生產國，但其工業的重要性和經濟意義與日俱增。我們的工業完全實現了現代化和發達化，日日夜夜滿負荷運轉。"
 DEN_industrial_capability_dynamic_modifier_light_regulation_max_improved_desc: "$DEN_industrial_capability_dynamic_modifier_max_improved_desc$"
 DEN_economic_crisis_dynamic_modifier: "經濟危機"
 DEN_economic_crisis_dynamic_modifier_desc: "我們承受了大蕭條的全力一擊。結果就是，對農產品的需求下降意味著許多農民揹負債務和喪失抵押物，而飆升的失業率已成為政治邊緣極端主義運動的溫床。"
 DEN_neglected_military_dynamic_modifier: "軍備廢弛"
 DEN_neglected_military_dynamic_modifier_desc: "多年來，我們始終不渝地奉行去軍事化中立政策，以免激怒德國。軍隊，只不過是一支象徵性保護主權的部隊符號。軍費逐年遭砍——使其在面對一切潛在衝突時都毫無準備。"
 DEN_danish_produce: "丹麥農產"
 DEN_danish_produce_desc: "醃肉和奶製品一直是丹麥的大宗出口產品，以至於世界大戰期間出現了“燉肉男爵”這一詞彙，專指那些從與大不列顛和德國的貿易中獲利的人。"
 DEN_sahnefront: "奶油前線"
 DEN_sahnefront_desc: "作為我們的附庸國，丹麥是一個物產豐富的國家，擁有豐富的農業傳統，我們一定會從中獲益。擁有丹麥將加強我們的軍事力量和實力。"
 DEN_improved_logistics: "改善後勤"
 DEN_improved_logistics_desc: "丹麥是一個富饒的國家，掌控這些資源，我們將確保軍隊的糧食供應並增強我們的軍事能力。"
 DEN_danish_licensing_ns: "貿易協定"
 DEN_danish_licensing_ns_desc: "在這個世界上，國與國之間的交易和貿易是必不可少的，因此擁有密切的貿易伙伴是一件好事。這項交易將使兩國受益，並加強我們之間的聯繫。"
 DEN_danish_licensing_ns_no_DOD_desc: "$DEN_danish_licensing_ns_desc$"
 DEN_overlord_licensing_ns_desc: "$DEN_danish_licensing_ns_desc$" #TODO_DANNE; Refine if there is time
 DEN_overlord_licensing_ns_no_DOD_desc: "$DEN_danish_licensing_ns_desc$" #TODO_DANNE; Refine if there is time
 DEN_war_preparations_dynamic_modifier: "戰爭準備"
 DEN_war_preparations_dynamic_modifier_desc: "做好準備才能渡過難關。我們必須加強原材料和其他物資的儲備，以備不時之需，並讓本國工業做好打仗的準備。"
 DEN_rule_the_north_sea: "統治北海"
 DEN_rule_the_north_sea_desc: "為了實現我們在北海的野心，我們必須建立一支擁有強大火力的大艦隊來保護我們的財產，阻止其他國家的掠奪。"
 DEN_fromandskorpset_ns: "$DEN_fromandskorpset$"
 DEN_fromandskorpset_ns_desc: "我們建立了特種兩棲部隊，準備好將我們的軍事力量投射到更廣闊的天地——越過海洋直抵外國的海岸。"
 DEN_declaration_of_neutrality: "中立宣言"
 DEN_declaration_of_neutrality_desc: "數十年以來，丹麥殫精竭慮於置身戰爭之外。這之所以能夠實現，都歸功於我國的中立政策。中立政策十分符合我國利益，我們將繼續予以貫徹。"
 DEN_denmark_becomes_a_puppet_tt: "如果遭受強大鄰國入侵，[DEN.GetFlag]§Y[DEN.GetNameDefCap]§!可以選擇成為其傀儡國，但保留當前的政府形式\n\n"
 DEN_neutrality_flag: "[DEN.GetFlag]§Y[DEN.GetNameDefCap]§!處於獨立且不在戰爭中"
 DEN_political_edicts_dynamic_modifier: "政治法令"
 DEN_political_edicts_dynamic_modifier_desc: "每個丹麥人都必須知道，時代之動盪對他們提出了什麼樣的要求。我們必須警惕針對我國的敵對行動，並齊心協力實現共同目標。"
 DEN_resistance_dynamic_modifier: "抵抗運動"
 DEN_resistance_dynamic_modifier_desc: "只有團結起來抵抗[?DEN.DEN_overlord_nation.GetAdjective]佔領軍，我們才有希望再次看到一個自由的[DEN.GetNameDef]。抵抗運動是這一切的核心，對於我們有朝一日重獲自由至關重要。"
 DEN_resistance_dynamic_modifier_improved: "$DEN_resistance_dynamic_modifier$"
 DEN_resistance_dynamic_modifier_improved_desc: "$DEN_resistance_dynamic_modifier_desc$"
 DEN_occupation_laws_dynamic_modifier: "佔領法案"
 DEN_occupation_laws_dynamic_modifier_desc: "我們的宗主國[?DEN.DEN_overlord_nation.GetAdjective]要求我國協助其作戰，並落實了多項法案來確保我們遵守。"
 DEN_securing_sweden_ns: "確保[SWE.GetNameDef]"
 DEN_securing_sweden_ns_desc: "瑞典曾是卡爾馬聯盟的一部分，受丹麥人統治。現在，是時候將瑞典重新併入我國了。我軍已為這一天做好了準備，並進行了艱苦的訓練，以打擊和摧毀任何敵對的瑞典軍隊。"
 DEN_securing_norway_ns: "確保[NOR.GetNameDef]"
 DEN_securing_norway_ns_desc: "數百年來，挪威一直是我國的一部分。現在，是時候將挪威再次併入[DEN.GetNameDefCap]了。我軍已為這一天做好了準備，並進行了艱苦的訓練，以打擊和摧毀任何敵對的挪威軍隊。"
 DEN_securing_finland_ns: "確保[FIN.GetNameDef]"
 DEN_securing_finland_ns_desc: "雖然我們從未對他們直接行使過權力，但芬蘭人在卡爾馬聯盟下對我們言聽計從。現在，是時候將芬蘭置於丹麥直接統治之下了。我軍已為這一天做好了準備，並進行了艱苦的訓練，以打擊和摧毀任何敵對的芬蘭軍隊。"
 DEN_foreign_influence_ns: "外國民意影響"
 DEN_fascist_propaganda_ns: "法西斯宣傳"
 DEN_fascist_propaganda_ns_desc: "滿口謊言的法西斯分子正在散佈關於我們政府的惡意謠言，企圖破壞我們的統治。"
 DEN_communist_propaganda_ns: "共產主義宣傳"
 DEN_communist_propaganda_ns_desc: "滿口謊言的共產黨人正在散佈關於我國政府的惡意謠言，企圖破壞我們的統治。"
 DEN_monarchist_discontent_ns: "君主主義者的不滿"
 DEN_monarchist_discontent_ns_desc: "一場愛國運動已經開始，人們聚集在以前的國王標誌後面。他們對我們民有、民治、民享的政府不滿，寧願看到國王親自掌權。"
 DEN_haeren_dynamic_modifier: "丹麥陸軍"
 DEN_haeren_dynamic_modifier_desc: "幾代人之前，丹麥統治著斯堪的納維亞，是該地區的主導力量。我們的軍隊行進穿過波羅的海地區，不會遇到阻礙或反抗。軍隊如今只是過去的殘影，但我們可以再次建設我們的實力和軍事力量來保護我們的邊界和人民。"
 DEN_haeren_dynamic_modifier_improved: "$DEN_haeren_dynamic_modifier$"
 DEN_haeren_dynamic_modifier_improved_desc: "幾代人之前，丹麥統治著斯堪的納維亞，是該地區的主導力量。我們的軍隊行進穿過波羅的海地區，不會遇到阻礙或反抗。軍隊已經重新獲得了往日的實力，但我們還只是踏上了軍隊恢復往日榮光的第一步。"
 DEN_haeren_dynamic_modifier_max_improved: "$DEN_haeren_dynamic_modifier$"
 DEN_haeren_dynamic_modifier_max_improved_desc: "幾代人之前，丹麥統治著斯堪的納維亞，是該地區的主導力量。我們的軍隊行進穿過波羅的海地區，不會遇到阻礙或反抗。我們的軍隊又一次受到敬畏！我們成功重建了軍隊的實力，我們已經準備好面對任何挑戰。"
 DEN_sovaernet_dynamic_modifier: "丹麥海軍"
 DEN_sovaernet_dynamic_modifier_desc: "丹麥曾經是波羅的海強國，憑藉我們強大的艦隊主宰波濤——但我們甚至在此之前就有悠久的航海歷史。維京人遠航四海傳播恐懼和征服土地。憑藉勇氣和決心，我們可以重建我們的海軍，再次統治海洋。"
 DEN_sovaernet_dynamic_modifier_improved: "$DEN_sovaernet_dynamic_modifier$"
 DEN_sovaernet_dynamic_modifier_improved_desc: "丹麥曾經是波羅的海強國，憑藉我們強大的艦隊主宰波濤——但我們甚至在此之前就有悠久的航海歷史。維京人遠航四海，傳播恐懼和征服土地。雖然面前還有很多工作要做，海軍已經尋獲了許多昔日的榮光和實力。"
 DEN_sovaernet_dynamic_modifier_max_improved: "$DEN_sovaernet_dynamic_modifier$"
 DEN_sovaernet_dynamic_modifier_max_improved_desc: "丹麥曾經是波羅的海強國，憑藉我們強大的艦隊主宰波濤——但我們甚至在此之前就有悠久的航海歷史。維京人遠航四海，傳播恐懼和征服土地。我們已經重建了海軍，即將啟航，再度去統治海洋。"
 DEN_flyvevabnet_dynamic_modifier: "丹麥空軍"
 DEN_flyvevabnet_dynamic_modifier_desc: "空戰是最新的戰爭方式，是現代軍隊的標杆。隨著丹麥軍隊最新的軍種：空軍成立，我國現在確實是一支不可忽視的現代力量。"
 DEN_flyvevabnet_dynamic_modifier_improved: "$DEN_flyvevabnet_dynamic_modifier$"
 DEN_flyvevabnet_dynamic_modifier_improved_desc: "$DEN_flyvevabnet_dynamic_modifier_desc$"
 DEN_flyvevabnet_dynamic_modifier_max_improved: "$DEN_flyvevabnet_dynamic_modifier$"
 DEN_flyvevabnet_dynamic_modifier_max_improved_desc: "$DEN_flyvevabnet_dynamic_modifier_desc$"
 #STATE MODIFIERS
 DEN_development_projects_state_modifier: "工業發展項目"
