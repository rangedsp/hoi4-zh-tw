 FIN_repurposed_small_industries: "改造小型工業"
 FIN_repurposed_small_industries_desc: "通過控制小型工業並重新改造它們以滿足戰爭的需求，芬蘭政府現在可以調動其資源並全面動員經濟，以滿足民用和軍用需求。"
 FIN_lotta_svard: "洛塔·施瓦德"
 FIN_lotta_svard_desc: "多年來，洛塔·施瓦德一直以輔助部隊的身份支持我軍武裝部隊。在國家面臨如此嚴峻的形勢下，我們擴大了她們的作用，為她們配備了武器，並允許成員在支持國家防衛方面發揮更前線的作用。"
 FIN_lotta_svard_support_battalions_bonus_tt: "§Y$category_support_battalions$：§!組織度：§G+10§!，H P：§G+5§!"
 FIN_international_volunteers: "國際志願軍"
 FIN_international_volunteers_desc: "志願者們從世界各地前往芬蘭加入我們的部隊。芬蘭不會孤軍奮戰！"
 FIN_militarized_society_requirement_tt: "如果徵兵法案不是§Y$all_adults_serve$§!或§Y$scraping_the_barrel$§!，§R將暫時移除§!。"
 FIN_the_lone_wolf_tt: "§R無法創建或加入一個陣營§!"
 FIN_popular_support_for_the_revolution: "民眾支持革命"
 FIN_popular_support_for_the_revolution_desc: "[FIN.GetAdjective]無產階級終於站了起來，擺脫了資產階級壓迫的枷鎖。我們的運動將共同動搖帝國主義的根基——始自[FIN.GetNonIdeologyName]，終抵群星！"
 FIN_imprisoned_right_wing_leaders: "收押右翼領袖"
 FIN_imprisoned_right_wing_leaders_desc: "各右翼派別領袖，諸如政客和商界巨頭，已被先制收監，以防止其開展反革命活動。"
 FIN_low_army_morale: "低陸軍士氣"
 FIN_low_army_morale_desc: "我國武裝部隊剛打完一場內戰不久，馬上又要打另一場內戰，因此對前景十分悲觀。自敵對行動爆發以來，我國武裝部隊的士氣尤其受到打擊。"
 FIN_commitment_from_construction_workers: "建築業工人的承諾"
 FIN_commitment_from_construction_workers_desc: "建築工人對資本主義剝削的殘酷並不陌生，因此他們中的許多人成為了我們革命運動的鐵桿中堅。雖然部分人加入了武裝部隊，但也有不少人承諾，要將他們的專業技能國家打仗可能需要的任何建築工程上。"
 FIN_commitment_from_the_trade_unions: "工會的承諾"
 FIN_commitment_from_the_trade_unions_desc: "幾十年來，工會一直在工作場所與資本主義壓迫的不公正現象進行著艱苦卓絕的鬥爭，在提高人民的階級意識方面發揮了至關重要的作用。現在，他們正全心全意地加入我們的革命運動，以徹底終結資本主義。"
 FIN_infiltrated_assets: "滲透線人"
 FIN_infiltrated_assets_desc: "隨著我們與其他國家達成新的貿易協定，我們也有機會滲透到我們的合作伙伴中去。希望這能讓我們更好地瞭解他們的動機和目標，從而更好地保護我們自己。"
 FIN_baltic_sea_focus: "關注波羅的海"
 FIN_baltic_sea_focus_desc: "波羅的海是我國國防的重中之重。我們必須為我們的海軍提供所需的訓練和資源，以儘可能有效地實現其在該地區的戰略目標。"
 FIN_finnish_goods: "芬蘭商品"
 FIN_finnish_goods_desc: "通過精明的策略，我們與庫西寧領導的[FIN.GetName]建立了一項強有力的貿易協定，確保我們能夠優先獲得他們的優質商品，併為他們的採購提供非常優惠的條件。"
 FIN_fascist_regime: "法西斯體制"
 FIN_fascist_regime_desc: "$FIN_a_fascist_regime$"
 FIN_patriotic_peoples_movement_ns_1: "$FIN_patriotic_peoples_movement$"
 FIN_academic_karelian_society_ns_1: "$FIN_academic_karelian_society$"
 FIN_suojeluskunta_ns_1: "白衛軍"
 FIN_anti_soviet_sentiment: "反蘇情緒"
 FIN_anti_soviet_sentiment_desc: "該地區人民對[SOU.GetNameDef]心懷怨恨，要麼認為其不過沙俄的改頭換面，要麼將其當作對傳統價值觀的威脅。"
 FIN_confederation_of_finno_russian_republics_dm: "芬俄共和國聯盟"
 FIN_confederation_of_finno_russian_republics_dm_desc: "$FIN_confederated_finno_russian_republics$"
 #NORWAY - National Spirits
 #Ideas
 NOR_complacent_cabinet_ns: "自鳴得意的內閣"
 NOR_complacent_cabinet_ns_desc: "約翰·尼高斯沃爾成功組建了一個穩定的政府，這可不是一件小事。他和他的內閣似乎以為已經抵達了終點，可他們不知道，這其實是漫漫長路的開始。"
 NOR_obsolete_armed_forces_ns_1: "過時的武裝部隊"
 NOR_obsolete_armed_forces_ns_1_desc: "挪威已經很久沒有關注過其武裝部隊了。現在，軍隊待在博物館裡甚至都比上戰場更有用。"
 NOR_the_hard_thirties_ns: "三十年代的磨難"
 NOR_the_hard_thirties_ns_desc: "1929年的大蕭條仍然徘徊在挪威的每個家庭和企業身邊。要走出這籠罩近十年的陰影，或許需要一個奇蹟。"
 NOR_anti_communist_sentiment_ns: "反共情緒"
 NOR_anti_communist_sentiment_ns_desc: "[SOU.GetNameDefCap]和許多國外共產黨徒給[NOR.GetAdjective]人灌輸了如此之巨的恐懼，以至於只要他們對付紅色威脅，另一邊的法西斯主義就相對來說不算什麼問題。"
 NOR_disjointed_cabinet_conscription_law_TT: "§R無法提高徵兵法案§!"
 NOR_broken_gun_ns: "斷槍政策"
 NOR_broken_gun_ns_desc: "斷槍政策將確保和平與繁榮遍及[NOR.GetName]及其他地區。我們可以用這筆錢來改善公民民生，並向鄰國表明我等沒有惡意。"
 NOR_printing_money_ns: "印鈔"
 NOR_printing_money_ns_desc: "如果我們想在這十年真正結束之前走出“艱難的三十年代”，就需要錢，就需要大把大把的錢！"
 NOR_defensive_rearmament_ns: "防禦性軍備重整"
 NOR_defensive_rearmament_ns_desc: "我們不能讓世上的其他國家把我們當成好戰分子而先制攻擊我們。所有重整軍備的工作都應該有明確的防禦目的。"
 NOR_coordinating_committee: "協調委員會"
 NOR_coordinating_committee_desc: "民間抵抗運動的核心是協調委員會（Koordinasjonskomiteen），其負責聯繫流亡政府與[NOR.GetName]民間抵抗運動四散的成員。"
 NOR_kretsen_ns: "克雷斯滕"
 NOR_kretsen_ns_desc: "這個組織深深地紮根於我們侵略者佔領區的深處，並在格里默隆德農場舉行秘密會議，他們的任務是在法西斯佔領區內外盡其所能地領導平民抵抗運動。"
 NOR_sivorg_ns: "希沃格"
 NOR_sivorg_ns_desc: "民間抵抗團體的集合，包括協調委員會和克雷斯滕。他們是家鄉前線的，堅信我們必將擊敗法西斯主義並將自由帶回[NOR.GetName]的男男女女。"
 NOR_ketsen_plus_KK_fake_ns: "$NOR_kretsen_ns$§W與§!$NOR_coordinating_committee$"
 NOR_efficient_production_ns: "高效生產"
 NOR_efficient_production_ns_desc: "任何效率的提高都不容忽視。我們必須確保我們能夠充分利用我們所擁有的資源，否則就有被淘汰的風險。"
 NOR_new_haeren_ns_1: "新挪威陸軍"
 NOR_new_haeren_ns_1_desc: "舊時代的[NOR.GetAdjective]軍隊不足以應對這些危險時期。這是為現代戰爭服務的現代軍隊。"
 NOR_new_haeren_ns_2_desc: "$NOR_new_haeren_ns_1_desc$"
 NOR_kungens_garde_ns: "挪威國王衛隊"
 NOR_kungens_garde_ns_desc: "國王的保鏢可以有三百萬之巨，但國王的軍隊只有一支，即[NOR.GetAdjective]軍隊精英中的精英，他們有能力與敵人正面交鋒。"
 NOR_expanded_conscription_ns: "擴大徵兵"
 NOR_expanded_conscription_ns_desc: "我國地廣人稀，危難時刻少不了任何一個[NOR.GetAdjective]的齊心協力。若要實現目標，每個符合最低兵役要求的人都必須入伍參戰。"
 NOR_XU_ns: "秘密臥底局"
 NOR_XU_ns_desc: "許多正在抵抗法西斯佔領的挪威人想要儘自己的一份力量，以阻礙他們的壓迫者。秘密臥底局可以將所有這些都組織在它的保護傘下，並支持他們刺探、遲緩並最終驅逐這些入侵者。"
 NOR_communist_education_centers_ns_1: "共產主義教育中心"
 NOR_communist_education_centers_ns_1_desc: "國外同志建立了這一系列中心，是為[NOR.GetAdjective]為實現[NOR.GetNonIdeologyName]做好準備的前沿陣地。"
 NOR_crumbling_fortifications_ns: "殘破的要塞"
 NOR_crumbling_fortifications_ns_desc: "從某些方面來講，稱之為要塞實在是過譽了。這些設施不僅尚在封存，就算啟用也難以應付現代戰爭。"
 #Allied Democratic
 NOR_reduced_workers_rights_ns: "工人權利減少"
 NOR_reduced_workers_rights_ns_desc: "面對即將來臨的戰爭和災厄，我國已暫時限制工人們的權利。希望在戰爭結束時他們能理解我們必須做出的犧牲。"
 NOR_investing_in_norway_ns: "正在投資挪威"
 NOR_investing_in_norway_ns_desc: "將我們的部分資金投資給[NOR.GetName]，不僅能使兩國團結一心，更能增強盟友的實力，以備將來我們需要其還人情的時候隨叫隨到。"
 NOR_improved_training_ns: "改進的訓練"
 NOR_improved_training_ns_desc: "新的訓練計劃能讓我們更快地將士兵送上戰場，同時還能教會他們生存和消滅敵人所需的一切知識，以及各種各樣的技能。"
 NOR_flexible_officers_academy_spirit: "靈活的軍官"
 NOR_flexible_officers_academy_spirit_desc: "新一代軍官將帶領[NOR.GetAdjective]軍隊取得勝利，因為他們可以從塵封的書籍以及和平時期的古代史教授那裡學到更多東西。"
 #Fascist Path
 NOR_contested_leadership_ns: "有爭議的領導權"
 NOR_contested_leadership_ns_desc: "[get_NOR_contested_leadership_ns_desc]"
 NOR_contested_leadership_ns_desc_ger: "無論吉斯林想靠政變謀取什麼，[GER.GetNameDef]早就設計好征服[NOR.GetNonIdeologyName]後要扶持的政府。實際上帝國內部幾乎沒人認為吉斯林能勝任，除了希特勒本人似乎格外青睞這個[NOR.GetAdjective]小暴君。"
 NOR_contested_leadership_ns_desc_generic: "雖然吉斯林政變成功了，但是軍隊乃至他自己的政府內部都沒完全認可他的接管，導致權力分層含糊不清。"
 NOR_abandoning_nynorsk_ns: "$NOR_abandoning_nynorsk$"
 NOR_abandoning_nynorsk_ns_desc: "民族統一黨的領導層已經宣佈新挪威語是不可接受的，每個公民都必須使用書面挪威語。"
 NOR_oppressed_civilians_dmod: "壓榨平民"
 NOR_oppressed_civilians_dmod_desc: "民族統一黨正在採取一系列措施大規模，替外國暴君壓制挪威公民對法西斯政權的任何不滿。"
 NOR_ulfhedhnar_ns: "$NOR_ulfhedhnar_wolf_coats$"
 NOR_ulfhedhnar_ns_desc: "我們重建了傳統的維京狂戰士部隊——狼皮勇士。他們渴望戰鬥，隨時準備成為我們征服世界的先鋒。"
 NOR_permanent_revolution_ns: "不斷之革命"
 NOR_permanent_revolution_ns_desc: "正如列夫·托洛茨基教導我們的那樣，只有全世界所有工人都獲得解放並與自己的勞動成果團聚，革命才會結束。對工人階級而言，國界毫無意義。"
 NOR_attack_sweden_ns: "攻擊瑞典"
 NOR_attack_sweden_ns_desc: "[SWE.GetNonIdeologyName]是個非常重要的目標，絕不能坐視不管。如果我們不先奪取他們的資源，它們就要會落入敵人手中，或者更糟——落入[SWE.GetAdjective]戰爭狂人的手中。"
 NOR_attack_denmark_ns: "攻擊丹麥"
 NOR_attack_denmark_ns_desc: "[DEN.GetNonIdeologyName]我們通往歐洲其他地區的橋梁。不幸的是，這也意味著它可能會成為敵人進入斯堪的納維亞半島的跳板。我們不能對此放任不管。"
 NOR_crush_stalin_ns: "粉碎斯大林"
 NOR_crush_stalin_ns_desc: "斯大林和所謂[SOU.GetName]，竟成了衡量共產主義的標準。我們不能讓這種情況繼續下去，畢竟這一暴政實質上不過是披著紅色外衣的舊沙俄。"
 NOR_crush_hitler_ns: "粉碎希特勒"
 NOR_crush_hitler_ns_desc: "很少有政權能像希特勒那樣殘暴不仁。我們不能讓這個瘋子在我們的眼皮底下橫行霸道。讓我們迅速果斷地行動，去對付那位“元首”及[GER.GetNonIdeologyName]。"
 NOR_liberate_finland_ns: "解放芬蘭"
 NOR_liberate_finland_ns_desc: "顯然，[FIN.GetName]的工人需要被解放。他們不是為了自己或芬蘭同胞，而是為了地主和工業家而勞作。讓我們幫助同志解放這片土地，讓他們將自己的勞動奉獻給革命。"
 #Monarchist Path
 NOR_king_haakon_vii_ns: "哈康七世國王"
 NOR_king_haakon_vii_ns_desc: "作為13世紀以來第一位[NOR.GetAdjective]君主，哈康七世國王是民主的典範。在全民公決之後，他才接受了王位，然後將[NOR.GetName]的統治權交給了顧問和其他高階貴族。"
 NOR_new_high_king: "新的至高王"
 NOR_new_high_king_desc: "攝政王佩德·安克爾·韋德爾-亞爾斯貝格宣佈自己為挪威新的至高王，確立了自己的統治者地位，但並未直接奪取哈康國王的頭銜。然而，這一舉動在鄰國中普遍不受歡迎。"
 NOR_norwegian_regency: "挪威攝政"
 NOR_norwegian_regency_desc: "攝政王佩德·安克爾·韋德爾-亞爾斯貝格宣佈，他僅打算執行他的國王哈康七世的意願和命令。因此，他尋求與鄰近的斯堪的納維亞君主國和解。"
 NOR_second_north_sea_empire: "北海第二帝國"
 NOR_second_north_sea_empire_desc: "攝政王佩德·安克爾·韋德爾-亞爾斯貝格宣佈，他打算恢復挪威的昔日榮光，並表示一個新的挪威帝國崛起只是時間問題。"
 #Dynamic Modifiers
 NOR_independent_norway_dmod: "獨立的挪威"
 NOR_independent_norway_dmod_desc: "自1905年以來從瑞典手中獨立以來，我國並取得了長足的進步。現在，我們有責任實現先輩的[NOR.GetNonIdeologyName]之夢。"
 NOR_army_air_force_dmod: "陸軍航空隊"
 NOR_army_air_force_dmod_desc: "目前，我們新生空軍的任務是支援陸軍，無論其推進到什麼位置，因此，這一兵種暫時無需單獨建軍。"
 NOR_royal_air_force_dmod: "國防空軍"
 NOR_royal_air_force_dmod_desc: "我們的空軍已經發展到這樣的地步：不僅可被視為[NOR.GetAdjective]天空之主宰，亦可成為自己命運的主宰。"
 NOR_royal_navy_dmod: "挪威皇家海軍"
 NOR_royal_navy_dmod_desc: "我們自豪的海軍將在[NOR.GetName]附近甚至更遠的海域航行。畢竟，北海即吾輩之高速公路。"
 NOR_administrative_council_dmod: "行政理事會"
 NOR_administrative_council_dmod_desc: "我國現在處於佔領當局的控制下，當局的人們只負責處理一些芝麻大小的事，重大決策都得由遠方的法西斯宗主國作出。"
 NOR_kingdom_of_norway_dmod: "$NOR_the_kingdom_of_norway$"
 NOR_kingdom_of_norway_dmod_desc: "民主的門面有什麼意義？大議會不復，王國可以在王的仁慈以及彼澤·安克爾·韋德爾-亞爾斯貝格攝政的鐵拳之下繁榮昌盛。"
 #State Modifiers
 NOR_prep_his_dmod_1: "發展中"
 NOR_prep_his_dmod_1_desc: "我們正努力將這裡從落後地區發展至擁有小型民用工廠。"
 NOR_prep_his_dmod_2: "發達"
 NOR_prep_his_dmod_2_desc: "#這個地區相當發達，但仍有很長的路要走，才能被認為是工業發達。"
 NOR_prep_his_dmod_3: "高度發達"
 NOR_prep_his_dmod_3_desc: "這個地區完全致力於挪威的民用工業。"
 NOR_prep_resistance_dmod: "抵抗組織紮根"
 NOR_prep_resistance_dmod_desc: "無論侵略者怎麼看我們，[NOR.GetNonIdeologyName]的人民都不會輕易投降。我們在本土安插人員，藏匿武器，附帶零散資源。抵抗組織可以用這些東西來更好地抵抗面目可憎的侵略者。"
 NOR_defend_state_dmod: "保家衛國"
 NOR_defend_state_dmod_desc: "竭盡全力，保家衛國，來犯之敵必死無疑。"
 NOR_prep_fasc_dmod_1: "法西斯支持者"
 NOR_prep_fasc_dmod_2: "$NOR_prep_fasc_dmod_1$"
 NOR_prep_fasc_dmod_3: "$NOR_prep_fasc_dmod_1$"
 NOR_royal_defenses: "王室防衛"
 NOR_royal_defenses_desc: "謹遵王廷旨意，該地區重點建造於捍衛王國之必要的防衛設施。"
