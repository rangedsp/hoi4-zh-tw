 SWE_independent_economy: "獨立經濟政策"
 SWE_ger_defense: "保持軍事獨立"
 SWE_fascist_counter_revolution_0: "反革命怨言"
 SWE_fascist_counter_revolution_0_desc: "我們終於掌權，但右翼極權主義者仍在竊竊私語。只是反對的低語會像回聲一樣消失，還是會發展成咆哮並引發雪崩？"
 SWE_fascist_counter_revolution_1: "軍隊不滿"
 SWE_fascist_counter_revolution_1_desc: "我軍不止一位指揮官對我國領導層心有芥蒂，甚至國王本人也抱有不滿。這幫舊制度的遺老本應明白自己的位置，安於本分，可異議依舊與日俱增……"
 SWE_fascist_counter_revolution_2: "大規模抗命"
