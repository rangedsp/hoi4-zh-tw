 SWE_gateway_to_peace: "通向和平的門戶"
 SWE_gateway_to_peace_instant_desc: "我們對紅軍取得勝利的唯一可行方式就是快速造成決定性的打擊，迫使其投降。\n獲得§Y列寧格勒§!的控制權可以造成這種打擊，也許甚至能達成和平。"
