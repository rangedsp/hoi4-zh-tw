 #FINLAND
 #Designers
 FIN_outokumpu: "奧托昆普"
 FIN_tampella: "坦佩拉"
 FIN_pohjolan_voima: "北方電力公司"
 FIN_nokia: "諾基亞"
 FIN_valtionrautatiet: "芬蘭國家鐵路公司"
 #National Spirits
 FIN_finnish_army: "芬蘭陸軍"
 FIN_finnish_army_desc: "作為其民族自豪感和獨立傳承的體現，芬蘭陸軍是一支令人畏懼的力量，在經年累月的對抗外部侵略的鬥爭中練就了一支悍勇之師。芬蘭士兵具備堅定的決心，以保衛家園為己任，是熟練的射手和堅韌不拔的戰士，隨時準備接受哪怕是最艱難的敵人的考驗。儘管資源有限，芬蘭陸軍代表了一種頑強不屈的精神，不會輕易被打敗。"
 FIN_finnish_navy: "芬蘭海軍"
 FIN_finnish_navy_desc: "芬蘭海軍是一支規模小，但是充滿驕傲的武裝力量，隨時準備守衛國土，對抗威脅。芬蘭海軍主要負責沿海防禦和保護海上航道，是芬蘭獨立精神的有力象徵，也是該國總體防禦戰略的關鍵要素。儘管可能面臨壓倒性的敵人，芬蘭海軍的水手們決心以與陸地同僚一樣的勇氣和頑強精神進行戰鬥。"
 FIN_finnish_airforce: "芬蘭空軍"
 FIN_finnish_airforce_desc: "芬蘭空軍儘管規模小、資源有限，但卻擁有一批經驗豐富的飛行員和富有創新精神的設計師，他們通過多年的試驗和自主創新將自身的戰技磨練得盡善盡美。芬蘭空軍有著十足的決心以及適應不斷變化的環境的意願，目前已經建立起了一支不可忽視的力量，一個將以其地面部隊的所有勇氣和堅韌來保衛其祖國的力量。"
 FIN_national_industry_expand: "$BUL_national_industry_01$"
 FIN_national_industry_expand_desc: "$SWI_expand_arms_industry_desc$"
 FIN_sami_pathfinders: "薩米嚮導"
 FIN_sami_pathfinders_desc: "薩米人是專業的追蹤者和野外向導，能夠輕鬆地穿越芬蘭北部的崎嶇地形，併為芬蘭軍隊提供重要情報。\n無論是沙場當中還是寂林叢深，薩米嚮導如今已是芬蘭軍隊的關鍵組成，亦是該國驕傲傳統的永恆象徵。"
 FIN_fortification_effort: "重視防禦工事"
 FIN_fortification_effort_desc: "$FIN_defense_in_depth_desc$"
 FIN_coastal_batteries_effort: "重視海岸炮臺"
 FIN_coastal_batteries_effort_desc: "$FIN_coastal_defense_desc$"
 FIN_mannerheim_line_expansion_modifier: "擴建曼納海姆防線"
 FIN_mannerheim_line_expansion_modifier_desc: "通過強化和擴建曼納海姆防線，我們將傳遞一個明確的信息：永遠不要小瞧芬蘭人，芬蘭人隨時準備好用其所有可用的工具來捍衛其獨立。"
 FIN_bank_of_aland_ns: "$FIN_bank_of_aland$"
 FIN_bank_of_aland_ns_desc: "$FIN_bank_of_aland_desc$"
 FIN_infrastructure_effort: "重視基建"
 FIN_infrastructure_effort_desc: "$FIN_industrial_development_desc$"
 FIN_hydro_electric_expansion: "擴建水電站"
 FIN_hydro_electric_expansion_desc: "利用[ROOT.GetName]豐富的河流自然資源，我們正在進行有意義的水電基礎設施擴建。投資建設新的水電站將為我們提供手段來大幅度擴張工業能力，推動我們國家的經濟發展。"
 FIN_motti_tactics_modifier: "柴堆戰術"
 FIN_motti_tactics_modifier_desc: "芬蘭軍隊正在使用柴堆戰術，包夾、斷絕敵軍單位，其目的在於癱瘓其後勤和通信線路。"
 FIN_weapon_caches_modifier: "武器藏匿處"
 FIN_weapon_caches_modifier_desc: "根據一次秘密軍事行動的部署，大量芬蘭軍用武器裝備被分散貯存在當地各處的藏匿處內，以便芬蘭抵抗軍能與入侵者抗爭到底。"
 FIN_public_opposition_to_the_winter_war: "公開反對冬季戰爭"
 FIN_public_opposition_to_the_winter_war_desc: "人們對我們對[FIN.GetNonIdeologyName]發動戰爭的必要性產生了懷疑。這曾經只是被我們的安全部門控制住了的邊小眾觀點，現在它已經發展成為我們無法控制的主流情緒。"
 FIN_we_are_the_white_death_idea: "我們就是白色死神"
 FIN_we_are_the_white_death_idea_desc: "我們著名的狙擊手西莫·海耶在戰場上的英勇事蹟極大地鼓舞了我軍的士氣。現在，部隊在以“白色死亡”為名號聚集。這個令人毛骨悚然的名字體現了他們堅定不移的承諾，即消滅所有愚蠢到入侵我們國家的敵人。"
 FIN_embraced_by_the_white_death: "白色死神之擁"
 FIN_embraced_by_the_white_death_desc: "西莫·海耶，儘管多次與死亡擦肩而過，但他仍繼續對我們的敵人施以死亡和恐懼的冰冷擁抱。"
 FIN_the_lapland_war: "介入拉普蘭戰爭"
 FIN_compensation_for_side_switch_good: "來自芬蘭的賠償"
 FIN_compensation_for_side_switch_bad: "戰爭賠償"
 FIN_sami_pathfinders_recon_bonus_tt: "§Y偵察連和$long_range_patrol_support$：§!偵察：§G+100.0%§!，§Y$snow$§!：移動速度：§G+10%§!，§Y$forest$§!、§Y$hills$§!、§Y$mountain$§!、§Y$marsh$§!、§Y$plains$§!以及§Y$river$§!：移動速度：§G+5%§!"
 FIN_finnish_army_dynamic_modifier_tt: "[GetMolotovCocktailsTooltip]"
 FIN_oy_alkoholiliike_dynamic_modifier_tt: "§Y所有$infantry$§!以及§Y$motorized$§!/§Y$mechanized$§!：對裝甲攻擊：§G+25%§!，穿甲深度：§G+100%§!\n"
