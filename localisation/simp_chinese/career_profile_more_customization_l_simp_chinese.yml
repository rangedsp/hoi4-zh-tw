 #Medals
 CAREER_PROFILE_MODERN_VERDUN: "夢迴凡爾登"
 CAREER_PROFILE_MODERN_VERDUN_DESCRIPTION: "進行一場持續特定日數且未被中斷的戰鬥。"
 CAREER_PROFILE_NEVERMINE_ME_MEDAL: "別埋我雷"
 CAREER_PROFILE_NEVERMINE_ME_MEDAL_DESCRIPTION: "在一定數量的海域內佈設超過500枚水雷。"
 CAREER_PROFILE_QUALITY_OVER_QUANTITY: "質勝於量"
 CAREER_PROFILE_QUALITY_OVER_QUANTITY_DESCRIPTION: "對敵方造成超過1百萬人員傷亡之後，擁有特定比例的優勢傷亡比。"
 CAREER_PROFILE_BRAINS_AND_BRUTE_FORCE_MEDAL: "動腦動手"
 CAREER_PROFILE_BRAINS_AND_BRUTE_FORCE_MEDAL_DESCRIPTION: "破譯一定次數的密碼。"
 CAREER_PROFILE_I_AM_INEVITABLE: "我即天命"
 CAREER_PROFILE_I_AM_INEVITABLE_DESCRIPTION: "在一定數量的星期內，每星期至少攻取一個省份。"
 CAREER_PROFILE_FINESSE_IS_FASTER: "迅捷巧技"
 CAREER_PROFILE_FINESSE_IS_FASTER_DESCRIPTION: "在破譯密碼的過程中，利用“奪取密碼”行動，從對應國家的破譯進程中減少一定日數。"
 CAREER_PROFILE_CARGO_EMBARGO: "貨物禁運"
 CAREER_PROFILE_CARGO_EMBARGO_DESCRIPTION: "禁運特定數量的國家。"
 CAREER_PROFILE_PRODUCTION_IS_POWER: "生產有力"
 CAREER_PROFILE_PRODUCTION_IS_POWER_DESCRIPTION: "建造特定數量的民用或軍用工廠。"
 CAREER_PROFILE_ENGINEERING_BEHEMOTH_MEDAL: "工程巨獸"
 CAREER_PROFILE_ENGINEERING_BEHEMOTH_MEDAL_DESCRIPTION: "設計一輛擁有特定裝甲厚度的坦克，並部署至少1000輛。"
 CAREER_PROFILE_CASTLES_IN_THE_AIR_MEDAL: "空中堡壘"
 CAREER_PROFILE_CASTLES_IN_THE_AIR_MEDAL_DESCRIPTION: "設計一架擁有特定空中防禦數值的飛機，並部署至少一個滿編空軍編隊（100架）。"
 CAREER_PROFILE_EXPERIMENTAL_SCIENCE_MASTERY: "精通實驗科學"
 CAREER_PROFILE_EXPERIMENTAL_SCIENCE_MASTERY_DESCRIPTION: "在1945年末之前，完成以下數量的專項計劃："
 CAREER_PROFILE_RACE_FOR_THE_BOMB: "核武競賽"
 CAREER_PROFILE_RACE_FOR_THE_BOMB_DESCRIPTION: "在以下年份以前實施一場成功的核突襲："
 CAREER_PROFILE_KNOWLEDGE_IS_POWER: "知識就是力量"
 CAREER_PROFILE_KNOWLEDGE_IS_POWER_DESCRIPTION: "擁有至少如下數量的技能嫻熟的科學家："
 CAREER_PROFILE_GRAND_STRATEGIKON_MEDAL: "大戰略"
 CAREER_PROFILE_GRAND_STRATEGIKON_MEDAL_DESCRIPTION: "已精通一定數量的次要學說"
 CAREER_PROFILE_PACTWEAVER_MEDAL: "契約編織者"
 CAREER_PROFILE_PACTWEAVER_MEDAL_DESCRIPTION: "擁有一定百分比的陣營章程進度。"
 CAREER_PROFILE_OVERACHIEVER_MEDAL: "勵精圖治"
 CAREER_PROFILE_OVERACHIEVER_MEDAL_DESCRIPTION: "完成一定數量的陣營長期目標"
 CAREER_PROFILE_BOATS_UP_MEDAL: "登船掌舵"
 CAREER_PROFILE_BOATS_UP_MEDAL_DESCRIPTION: "將艦長晉升為海軍將領，並達到以下能力等級。"
 CAREER_PROFILE_POLISH_MY_HQ_MEDAL: "別墅般的指揮所"
 CAREER_PROFILE_POLISH_MY_HQ_MEDAL_DESCRIPTION: "部署的集團軍總部生產花費至少為"
 CAREER_PROFILE_DIRTY_MATH_MEDAL: "討厭的數學"
 CAREER_PROFILE_DIRTY_MATH_MEDAL_DESCRIPTION: "俘虜能力等級總和達到以下數值的敵方指揮官。"
