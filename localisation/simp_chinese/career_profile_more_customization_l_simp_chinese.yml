 #Ribbons
 CAREER_PROFILE_SYNTHETIC_SECURITY: "合成安全"
 CAREER_PROFILE_SYNTHETIC_SECURITY_DESCRIPTION: "通過人工合成資源（合成煉油廠）獲得超過30單位橡膠。"
 CAREER_PROFILE_SYNTHETIC_SECURITY_QUOTE: "“如果工廠裡的女工們罷工二十分鐘，那麼盟軍就會輸掉這場戰爭。”\n\n——約瑟夫·霞飛，法國陸軍元帥兼總指揮，世界大戰期間"
 CAREER_PROFILE_RUBBER_BARON: "橡膠男爵"
 CAREER_PROFILE_RUBBER_BARON_DESCRIPTION: "控制超過1000單位橡膠的同時擁有封閉經濟法案。"
 CAREER_PROFILE_RUBBER_BARON_QUOTE: "“……1942年，遠東主要橡膠產地淪陷後，全球天然橡膠產量的90%遭到掐斷。”\n\n——《南方經濟週刊》，1947年1月"
 CAREER_PROFILE_THE_TRUCK_WILL_ALWAYS_GET_THROUGH: "卡車橫行"
 CAREER_PROFILE_THE_TRUCK_WILL_ALWAYS_GET_THROUGH_DESCRIPTION: "有超過5000輛補給卡車正在為部隊提供補給。"
 CAREER_PROFILE_THE_TRUCK_WILL_ALWAYS_GET_THROUGH_QUOTE: "“人人都說轟炸機想來就來，但是卡車早就來了。”\n\n——佚名"
 CAREER_PROFILE_MARE_NOSTRUM: "我們的海"
 CAREER_PROFILE_MARE_NOSTRUM_DESCRIPTION: "在地中海的六個主要海域擁有制海權，其中應至少有一個海域正在爭奪中。"
 CAREER_PROFILE_MARE_NOSTRUM_QUOTE: "“我丟了步槍的時候，軍隊罰了我85美元。這就是為什麼海軍的艦長都會隨艦沉沒。”\n\n——迪克·格雷戈裡"
 CAREER_PROFILE_BLITZ_THIS: "閃擊這個……"
 CAREER_PROFILE_BLITZ_THIS_DESCRIPTION: "選擇彈性防禦作為一個將領、元帥或國家的偏好戰術。"
 CAREER_PROFILE_BLITZ_THIS_QUOTE: "“要像弓箭手拉弦一樣後撤防線，然後猛地放箭。”\n\n——佚名"
 CAREER_PROFILE_SCORCHED_EARTH: "焦土戰術"
 CAREER_PROFILE_SCORCHED_EARTH_DESCRIPTION: "利用“焦土行動”破壞鐵路來拖延敵方的進攻。"
 CAREER_PROFILE_SCORCHED_EARTH_QUOTE: "“……不能留給敵人哪怕一臺引擎、一輛車廂、一磅糧食或者一升燃油。”\n\n——約瑟夫·斯大林，廣播講話，1941年7月3日"
 CAREER_PROFILE_RULED_BY_FURNITURE: "傢俱做主！"
 CAREER_PROFILE_RULED_BY_FURNITURE_DESCRIPTION: "國家領導人肖像上沒有出現任何人。"
 CAREER_PROFILE_RULED_BY_FURNITURE_QUOTE: "“焦慮就像一把搖椅，能讓你有事情做，但是哪裡都去不了。”\n\n——英格蘭古諺語"
 CAREER_PROFILE_THE_THOUSAND_YEAR_BOND: "千年之誼"
 CAREER_PROFILE_THE_THOUSAND_YEAR_BOND_DESCRIPTION: "部署共含一百個騎兵營或駱駝騎兵營的部隊。"
 CAREER_PROFILE_THE_THOUSAND_YEAR_BOND_QUOTE: "“優秀的戰馬必須要有些桀驁不馴，而它的騎手也該如此。”\n\n——史蒂芬·帕斯菲爾德"
 CAREER_PROFILE_ROCKETS_REIGN: "火箭統領"
 CAREER_PROFILE_ROCKETS_REIGN_DESCRIPTION: "建造10個以上的火箭基地。"
 CAREER_PROFILE_ROCKETS_REIGN_QUOTE: "“火箭除了會飛到錯誤的星球之外，沒有任何缺點。”\n\n——韋恩赫爾·馮·布勞恩"
 CAREER_PROFILE_STEEL_AT_HIGH_SPEED: "鋼鐵洪流"
 CAREER_PROFILE_STEEL_AT_HIGH_SPEED_DESCRIPTION: "部署4000輛最大速度超過12km/h的坦克。"
 CAREER_PROFILE_STEEL_AT_HIGH_SPEED_QUOTE: "“如果一切盡在掌握之中，那說明你還不夠快。”\n\n——馬里奧·安德雷蒂"
 CAREER_PROFILE_ORCHESTRA_OF_BOOM: "火炮樂團"
 CAREER_PROFILE_ORCHESTRA_OF_BOOM_DESCRIPTION: "部署一支至少1防空、1炮、1火箭炮、1反坦並帶有通信支援連的陸軍師。"
 CAREER_PROFILE_ORCHESTRA_OF_BOOM_QUOTE: "\n“一波高過一波的聲浪連續不斷、渾然一體，化作了毀天滅地的巨響，就像把火車進入隧道時的轟鳴放大了百萬倍。”\n\n——阿諾德·D·哈維"
 CAREER_PROFILE_TASK_FAILED_SUCCESSFULLY: "雖敗猶勝"
 CAREER_PROFILE_TASK_FAILED_SUCCESSFULLY_DESCRIPTION: "讓一個成功率在80%及以上的突襲失敗。"
 CAREER_PROFILE_TASK_FAILED_SUCCESSFULLY_QUOTE: "“突襲必須被視作一種武力偵察……我們必須在發起更大規模的行動前掌握所有必需的情報……”\n\n-溫斯頓·丘吉爾，於迪耶普突襲，1942年9月8日"
 CAREER_PROFILE_PUNCH_IT: "給它一擊！"
 CAREER_PROFILE_PUNCH_IT_DESCRIPTION: "成功突襲一座核設施，同時控制至少一個與該設施相鄰的省份。"
 CAREER_PROFILE_PUNCH_IT_QUOTE: "“為了國家的命運，必須喚醒軍隊死戰的意志。”\n\n-亞歷山大·克倫斯基於六月攻勢"
 CAREER_PROFILE_PLAN_L: "L號計劃"
 CAREER_PROFILE_PLAN_L_DESCRIPTION: "以內陸國家開局，完成2項海軍專項計劃，建造10艘驅逐艦，5艘巡洋艦，2艘戰列艦和1艘航空母艦。"
 CAREER_PROFILE_PLAN_L_QUOTE: "“海軍建造一艘戰艦需要三年，但培養一項新的傳統卻需要三百年。撤離將會繼續。”\n\n-安德魯·坎寧安，於克里特島大撤退"
 CAREER_PROFILE_SWEETENER_HEXADECAGON: "十六邊形甜味劑"
 CAREER_PROFILE_SWEETENER_HEXADECAGON_DESCRIPTION: "研究16項通過專項計劃解鎖的科技。"
 CAREER_PROFILE_SWEETENER_HEXADECAGON_QUOTE: "“當我拿著那些計算結果來找你的時候，我們認為我們可能開啟了一場毀滅世界的連鎖反應。”\n\n-羅伯特·奧本海默，《奧本海默》"
 CAREER_PROFILE_ISLAND_HOPPER: "跳島專家"
 CAREER_PROFILE_ISLAND_HOPPER_DESCRIPTION: "控制10個戰略地點"
 CAREER_PROFILE_ISLAND_HOPPER_QUOTE: "“你想活命嗎？！快離開海灘！”\n\n——約翰·巴斯隆，《太平洋戰爭》"
 CAREER_PROFILE_IM_THE_CAPTAIN_NOW: "現在我是船長了"
 CAREER_PROFILE_IM_THE_CAPTAIN_NOW_DESCRIPTION: "作為次要國家，獲得一個陣營的領導權"
 CAREER_PROFILE_IM_THE_CAPTAIN_NOW_QUOTE: "“看著我，現在我是船長了。”\n\n——穆斯，《菲利普船長》"
 CAREER_PROFILE_THREE_MUSKETEERS: "三個火槍手"
 CAREER_PROFILE_THREE_MUSKETEERS_DESCRIPTION: "建立三個由你的將領指揮的陣營戰區。"
