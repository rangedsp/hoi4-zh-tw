 SS_recruitment: "外籍志願兵"
 SS_recruitment_desc: "希姆萊領導下的黨衛隊堅信在這場對抗全球布爾什維主義的戰爭當中，他們應當負責掌管招募外籍志願兵事項以擴充武裝黨衛軍隊伍。國防軍對此則堅決反對並且決不會容忍另一套指揮系統與自己平起平坐。無論如何，將任何一方逼得太緊可能都會造成嚴重的後果。\n\n當前國防軍最高統帥部的§Y態度§!：[Root.GetWehrmachtAngerLevel]（[?GER.wehrmacht_anger|-0]）\n\n當前黨衛隊全國指揮總部的§Y態度§!：[Root.GetSSAngerLevel]（[?GER.SS_anger|-0]）"
