 SOV_nkvd_upgrade_tooltip: "§Y內務人民委員部§!現在與我們的軍隊更緊密地結合在一起了，他們將保證士兵們的士氣以及對黨的忠誠。\n"
 ger_sov_buddies_tooltip_2: "這將解散[Root.GetFactionName]並創立§Y柏林-莫斯科§!陣營。\n"
 ger_sov_buddies_tooltip: "§R如果[SOV.GetAdjective]接受了我們的要求，那我們會因為政治變動而損失一些穩定度。不言而喻的是，國內的法西斯主義者以及民主國家同樣不會對形勢的這一變化感到高興。§!\n"
 purged_kalinin: " 被斯大林清洗"
