l_simp_chinese:
 WHILE_FOCUSING: "執行該國策將產生以下效果：\n$EFF$"
 generic_focus: "國策"
 army_effort: "重視陸軍"
 army_effort_desc: "儘管空戰與海戰技術不斷發展，地面戰鬥仍是未來戰爭的關鍵。如若我們做好準備，就可避免再次陷入塹壕戰的地獄。"
 equipment_effort: "重視裝備"
 equipment_effort_desc: "陸軍裝備日新月異，我們將致力於為戰士們研發出最好的裝備。"
 motorization_effort: "重視摩托化"
 motorization_effort_desc: "機動與防護對於步兵接戰的安全性來說至關重要，專注於發展摩托化技術能使我們能夠迅速採取行動。"
 doctrine_effort: "重視軍事學說"
 doctrine_effort_desc: "世界大戰時的軍事學說已經落伍，我們必須動用智庫來勾勒出未來軍事理論的輪廓。"
 equipment_effort_2: "重視裝備 II"
 equipment_effort_2_desc: "我們必須繼續努力，來讓我軍步兵和支援部隊擁有站在時代前沿的裝備。"
 mechanization_effort: "重視機械化"
 mechanization_effort_desc: "重新思考摩托化步兵的可能性，當前我們可以生產更多類型的步兵載具。"
 doctrine_effort_2: "重視軍事學說 II"
 doctrine_effort_2_desc: "戰場在間戰的時期發生了變化，這在最近的戰爭中更為明顯。我們必須不斷地重新審視自己的理論來適應這樣的變化。"
 equipment_effort_3: "重視裝備 III"
 equipment_effort_3_desc: "我們應該自主研製達到世界領先水平的步兵武器，而不是購買或仿製外國貨。"
 armor_effort: "重視裝甲部隊"
 armor_effort_desc: "應用我們從步兵機械化過程中獲得的經驗以改進我們的裝甲車輛。"
 special_forces: "特種部隊"
 special_forces_desc: "我們需要精銳的部隊，因此應當優先發展山地部隊和傘兵部隊。"
 aviation_effort: "重視空軍"
 aviation_effort_tt: "沒有足夠的建築位可以用於建造§Y空軍基地§!"
 aviation_effort_desc: "空軍技術是所有軍事技術中發展最快的。任何一個現代化國家都應該掌握先進的航空技術。"
 fighter_focus: "專注戰鬥機"
 fighter_focus_desc: "在世界大戰中，空戰越來越頻繁，所以如果我們能在戰鬥機的研發中取得優勢，那麼在未來的空軍戰場中也就能取得更大的優勢。"
 bomber_focus: "專注轟炸機"
 bomber_focus_desc: "當後人談及此時戰爭的恐怖之處時，一定會提到那些從天而降的炸彈。而我們則應盡最大的努力使這些故事是由我們的敵人來講述的。"
 aviation_effort_2: "重視空軍 II"
 aviation_effort_2_desc: "航空學說的進一步發展可以幫助我們的空軍與其他部隊配合。"
 CAS_effort: "重視近距支援機"
 CAS_effort_desc: "現代化戰爭不僅需要地面的支援，還需要空中支援。"
 rocket_effort: "重視火箭"
 rocket_effort_desc: "火箭與噴氣式引擎技術所提供的高移動速度能夠被運用在載人以及無人運輸工具上。應用這些技術將打敵人一個措手不及。"
 NAV_effort: "重視海軍轟炸機"
 NAV_effort_desc: "新時代海戰的一部分發生在水下，而另一部分則發生在空中。"
 naval_effort: "重視海軍"
 naval_effort_tt: "沒有足夠的建築位可以用於建造§Y海軍船塢§!"
 naval_effort_desc: "我們首要目標是擴建我們的海軍。所以應該將所有資源投入到新船塢建設和水面艦艇的研究中。"
 GER_naval_effort2: "擴建船塢設施"
 GER_naval_effort2_desc: "要真正重建一支像樣的海軍，我們必須極大地增強我們的造船能力。"
 GER_naval_effort2_tt: "在§Y[ROOT.GetFlag][ROOT.GetNameDef]§!當前控制的§Y2§!個沿海地區建造§Y2 海軍船塢§!。"
 flexible_navy: "機動艦隊"
 flexible_navy_desc: "重新設計海戰以詮釋潛艇技術的進步，這將使我們更有效地打擊敵人的護航艦隊。"
 large_navy: "大艦隊"
 large_navy_desc: "我們的海軍學說理論將被調整，我們將更為重視大戰艦，並注重兼顧護航艦隊的安全，這會助益我們研發相關任務所需的艦船。"
 submarine_effort: "重視潛艇"
 submarine_effort_desc: "潛艇是自魚雷艇發明以來海軍裝備最驚人的發展。我們不僅要注重反潛，還要利用它襲擾敵艦。"
 cruiser_effort: "重視巡洋艦"
 cruiser_effort_desc: "在研發出更先進的戰列艦之前，暫以排水量較小的巡洋艦替代之。"
 destroyer_effort: "重視驅逐艦"
 destroyer_effort_desc: "研究潛艇的設計和戰術時，我們也學會了如何應對這些戰術。而驅逐艦將成為其中關鍵。"
 capital_ships_effort: "重視主力艦"
 capital_ships_effort_desc: "擁有最多戰列艦的國家才能統領海洋。戰列艦與航空母艦分別代表了新舊兩種海軍主力。"
 industrial_effort: "重視工業"
 industrial_effort_desc: "將我們政策的效力集中用在民用工業建設上以獲得跳躍式發展。"
 industrial_effort_2: "重視工業 II"
 industrial_effort_2_desc: "憑藉鋼鐵般的意志和不懈的工作熱情，我們必能帶領人民再一次完成巨大的工業進步。"
 construction_effort: "重視建設"
 construction_effort_tt: "沒有足夠的建築位可以用於建造§Y民用工廠§!"
 construction_effort_desc: "即使戰爭的陰雲逐漸籠罩著整個世界，我們也不能忽視民用工業的生產能力。"
 production_effort: "重視軍備"
 production_effort_tt: "沒有足夠的建築位可以用於建造§Y軍用工廠§!"
 production_effort_desc: "如果你能生產拖拉機，你就能生產坦克！我們決不允許軍事生產能力拖後腿。"
 construction_effort_2: "重視建設 II"
 construction_effort_2_desc: "當我們的工廠繼續擴建之後，我們就能加快貿易物資的生產，並加大工業建設力度。"
 production_effort_2: "重視軍備 II"
 production_effort_2_desc: "用民用工廠生產軍械是低效的。我們應該專注于軍事工業的建設。"
 production_effort_3: "重視軍備 III"
 production_effort_3_desc: "繼續努力擴建軍用工廠可以幫我們滿足新裝備的需求。"
 infrastructure_effort: "重視基建"
 infrastructure_effort_desc: "沒有合格基礎設施建設的國家無法推進先進的項目或工程。"
 infrastructure_effort_tt: "沒有足夠的建築位可以用於建造§Y基礎設施§!"
 synth_oil_effort_tt: "沒有足夠的建築位可以用於建造§Y合成煉油廠§!"
 infrastructure_effort_2: "重視基建 II"
 infrastructure_effort_2_desc: "繼續基礎設施的擴建可以滿足高科技秘密工程的運輸和通訊需求。"
 construction_effort_3: "重視建設 III"
 construction_effort_3_desc: "我們的基礎設施網絡的擴建顯著提升了我們的建設能力。"
 nuclear_effort: "重視核研究"
 nuclear_effort_desc: "我們即將獲得一項足以改變世界的技術，我們不能讓其他國家點燃可能在某天毀滅地球的火種。"
 extra_tech_slot: "增加科研槽"
 extra_tech_slot_desc: "我國工業不斷擴張，各行各業不斷進步，這使得我們能夠同時進行更多科研項目。"
 extra_tech_slot_2: "增加科研槽 II"
 extra_tech_slot_2_desc: "我國的快速工業化讓我們在科研上有了新的突破。"
 technology_sharing: "科技共享"
 technology_sharing_desc: "通過與盟友共享研發的技術，我們的整個陣營可以在戰時更有效地進行科研。"
 secret_weapons: "秘密武器"
 secret_weapons_desc: "雖然集中所有資源生產坦克飛機充滿了誘惑力，但贏得戰爭的秘密卻在那些新的科技領域之中：電子、火箭和核武器。"
 political_effort: "重視政治"
 political_effort_desc: "要想改變世界，就得先改變我們的國家。應當把加強我們的政治地位視作首要任務。"
 collectivist_ethos: "集體主義精神"
 collectivist_ethos_desc: "我們的敵人或許能分裂並征服那些較小的國家，但我們的人民已經團結一致，人人為我，我為人人。"
 liberty_ethos: "自由主義精神"
 liberty_ethos_desc: "過分的追求一致會扼殺人們的精神，我們將維護個體的獨立自由。"
 militarism: "軍國主義"
 militarism_desc: "那些認為兵者乃不祥之器的人在面對戰爭時必然猶豫不決。我們的文化中將根植入軍國主義而使全民皆兵。"
 political_correctness: "政治正確"
 political_correctness_desc: "那些持有輕微異議或反對觀點的人似乎總是認為有人搞了一個大陰謀迫害他們。這似乎是一個好主意。"
 neutrality_focus: "保持中立"
 neutrality_focus_desc: "當別人認為在全球性衝突中選擇站隊需要勇氣與智慧時，我們卻明白拒絕站隊需要更多的勇氣與智慧。"
 interventionism_focus: "干涉主義"
 interventionism_focus_desc: "我們重視所有人的自由，不僅僅是我們自己公民的。如果制止暴政意味著戰爭，那我們就選擇戰爭吧。"
 military_youth: "青年入伍"
 military_youth_desc: "通過建立讓年輕人接受紀律教育與政治教育的組織，我們能在其心中早早地種下忠誠與自我犧牲的種子。"
 deterrence: "保持威懾"
 deterrence_desc: "在被孤立的情況下我們很難從戰爭中獲益。幸運的是，我們明白最好的防禦就是讓所有人不會敢於侵犯我們的威懾。"
 volunteer_corps: "志願部隊"
 volunteer_corps_desc: "雖說逼迫我們的人民為了自由的理想而去犧牲是十分諷刺的，但為那些希望幫助外國人取得自由的人提供一個機會就是另外一回事了。"
 paramilitarism: "準軍事組織"
 paramilitarism_desc: "軍事紀律在軍事以外的地方也能有許多應用。隨著為了補充我國武裝部隊而發展準軍事化部隊，更多的人民能夠得到軍事訓練。"
 indoctrination_focus: "意識形態灌輸"
 indoctrination_focus_desc: "既然我們的意識形態是基於真理的，那麼我們也可以將它當做真理來進行教育。媒體和教育系統必須要反映這一點。"
 foreign_expeditions: "赴外遠征軍"
 foreign_expeditions_desc: "既然我們的敵人已經準備好為了他們的信念而干涉遙遠的衝突，我們也應該準備好為了我們的信念而做出同樣的犧牲。"
 why_we_fight: "我們為何而戰"
 why_we_fight_effect: "如果我們沒有§Y外交中立§!民族精神，則將可以創建陣營。\n"
 why_we_fight_desc: "這個世界開始變得越來越危險了。我們的人民必須意識到那些利慾薰心的獨裁者們所犯下的暴行。是時候讓我們的人民團結於我們的事業之下，讓他們準備好為我們的自由而戰了。"
 political_commissars: "政治委員"
 political_commissars_desc: "為了保證軍隊能夠深刻貫徹落實我們的政策，我們將會在部隊體系中加入政治軍官的任命。"
 internationalism_focus: "國際主義"
 internationalism_focus_desc: "意識形態沒有國界。其他國家也許可以稱自己為主權國家，但我們的信念是遠遠高於這種主張的。"
 nationalism_focus: "民族主義"
 nationalism_focus_desc: "我們的國家是獨一無二的，我們在政治上的成就也不可能發生在任何其他地方。我們必須要不惜代價為之奮鬥。"
 ideological_fanaticism: "意識形態狂熱主義"
 ideological_fanaticism_desc: "為我們在政治上的價值觀和目標而犧牲比為任何一種古老的信仰而犧牲都要來的值得。所有信仰我們的理念的人都應該準備好隨時面對死亡，而對那些在信念上猶豫不定的人來說——你們最好現在就準備面對死亡。"
 air_innovation: "空軍改革"
 air_innovation_desc: "控制不了天空就不可能贏得現代戰爭。我們必須竭盡全力來發展我國空軍！"
 air_innovation_2: "空軍改革 II"
 air_innovation_2_desc: "我們在空中能夠得到的任何優勢都是寶貴的。我們必須將所有資源集中到發展我們的戰鬥機上。"
 naval_air_effort: "重視海軍航空"
 naval_air_effort_desc: "早在1921年，美國就已經試驗過對海上目標進行空中打擊的效果。我們如果想要和一個海軍強國開戰，就不應該忽視空軍的這一分支領域。"
 german_focus: "德意志國策"
 GER_autobahn: "帝國高速公路"
 GER_autobahn_tt: "將§Y勃蘭登堡§!、§Y漢諾威§!、§Y圖林根§!以及§Y弗蘭肯§!的§Y基礎設施§!提升至最高等級"
 GER_autobahn_desc: "自1933年項目始建以來，[GetAutobahnName]計劃已經取得了巨大的成功。建築工程極大地減少了失業，而寬敞的公路也成為了紀念[GER.GetName]經濟復甦的豐碑。但即便如此，我們也還有許多工作要做。"
 GER_west_wall: "西牆防線"
 GER_west_wall_desc: "西牆防線與法國人引以為傲的馬奇諾防線平行，矗立在上次世界大戰中齊格菲防線大致相同的地方。強化這一防禦體系能使我們能夠以更少的兵力守住邊界，從而騰出部隊參與任何可能的東方戰役。"
 GER_west_wall_tt: "§R如果萊茵蘭已經重新軍事化，你還將同時獲得：§!\n"
 GER_west_wall_forts: "在德法邊境增設§Y12座陸上要塞§!。\n"
 GER_tactical_air_effort: "重視戰術空軍"
 GER_tactical_air_effort_desc: "只有徹底消滅敵人的地面部隊才能取得戰爭的勝利。我們必須把重點放在對近距離和縱深目標的戰術打擊上，以支援我們的部隊。"
 GER_long_range_escorts: "遠程護航"
 GER_long_range_escorts_desc: "我們的戰術轟炸機和戰略轟炸機需要擁有遠程護航提供保護，才能安全抵達目標區域後返航。"
 GER_strategic_air_effort: "重視戰略空軍"
 GER_strategic_air_effort_desc: "只有徹底消滅敵人的工業能力才能取得戰爭的勝利。為此，我們必須致力於設計和生產戰略轟炸機。"
 GER_army_innovation: "陸軍改革"
 GER_army_innovation_desc: "海因茨·古德里安等許多激進軍事理論家正在推動大膽的新軍事學說，重視通訊、對“戰線重點”的識別以及多兵種的局部集中作戰。讓他們繼續研究下去，也許這次能避免重演世界大戰中那如絞肉機一般的慘劇。"
 GER_soviet_treaty: "與[GER.GetTheUSSRName]的條約"
 GER_soviet_treaty_desc: "我們可以與[SOV.GetNameDef]簽訂一個新的研究協議從而研發更好的坦克。如果他們同意，兩國就能夠重新開啟在1933年關閉的卡馬坦克兵學院。當然，這一合作同時意味著，[SOV.GetAdjective]也能夠從科技創新中獲益……"
 GER_air_innovation_2: "空軍改革 II"
 GER_air_innovation_2_desc: "帝國航空部的任務是至關重要的。德國空軍必須成為世界上最先進的一支空軍！"
 GER_army_innovation_2: "陸軍改革 II"
 GER_army_innovation_2_desc: "我國駐蘇聯各設施中所得經驗匪淺，能大大改進本國學說和裝備。但是這一次，我們只會將這些創新留給自己！"
 GER_rocketry_focus: "火箭技術"
 GER_rocketry_focus_desc: "使海陸空三軍的技術研究取得巨大進展的關鍵，就在於火箭推進技術。"
 GER_wunderwaffe: "奇蹟武器"
 GER_wunderwaffe_desc: "海森堡和馮·布勞恩已經等不及要實現他們對真正的末日武器的某些想法了，他們所需要的只是一些額外的資源……"
 GER_mol_rib_pact: "[GER.GetMolotovRibbentropName]"
 GER_mol_rib_pact_desc: "雖然與[GER.GetTheUSSRName]簽訂友好與互不侵犯條約令人反胃，但這樣也可以使其寶貴的石油能夠源源不斷地流入德國。兩國將簽訂一個秘密協議，把羅馬尼亞、波蘭、立陶宛、拉脫維亞、愛沙尼亞和芬蘭的領土分別劃分進[GER.GetAdjective]和[SOV.GetAdjective]的勢力範圍……"
 GER_mol_rib_pact_tt: "與§Y蘇聯§!簽訂§Y互不侵犯條約§!並同意在德國和[SOV.GetName]之間§Y瓜分波蘭§!\n"
 SOV_MOLOTOV_RIBBENTROP_NAME_COMMUNIST: "[GetMolotovInMRPact]-[GetRibbentropInMRPact]條約"
 SOV_MOLOTOV_RIBBENTROP_NAME_EXILES: "波蘭瓜分協議"
 GER_soviet_ally: "與[GER.GetTheUSSRName]結盟"
 GER_soviet_ally_desc: "也許，放下同[GER.GetRussiansDemonym]在[GER.GetUSSRAllianceDesc]上的不同，轉而強調共同之處——即對自由主義之自私及西方國家之腐敗的憎惡——並非不可能。如果與[GER.GetTheUSSRName]成為盟友，那麼我們就能獲得一切亟需取得的資源——外加他們的軍事力量……"
 SOV_USSR_ALLIANCE_DESC_COMMUNIST: "意識形態"
 SOV_USSR_ALLIANCE_DESC_EXILES: "民族主義者"
 GER_turkey_puppet: "傀儡土耳其"
 GER_turkey_puppet_desc: "土耳其處於我國與蘇聯的夾縫之中。倘若施加一點壓力，土耳其很有可能會順從服從我國意志，成為傀儡國。按條約內容，蘇聯同時也可以獲得土耳其東部的一些領土。然而，如果土耳其拒絕了我國的要求，那戰爭就在所難免了。"
 GER_rhineland: "進軍萊茵蘭"
 GER_rhineland_desc: "萊茵蘭自從前次世界大戰結束後就一直處於非軍事化的狀態，但這一明目張膽的羞辱行為馬上就將不復存在了！德國是一個主權國家，德國有權力在他的國界內任意部署部隊！"
 GER_rhineland_ultimatum: "§R如果在與敵國對峙時退縮，那麼該區域將重新恢復非軍事區。§!\n"
 GER_japan_friend: "對日示好"
 GER_japan_friend_desc: "雖然長久以來與中國的良好關係使我們收穫良多，但與和我們有著類似的武士文化的日本結盟也許能夠更好地實現我們的野心——即使這一舉動無異於將中國送入虎口……"
 GER_japan_friend_tt: "召回馮·法肯豪森。\n"
 GER_china_friend: "對華示好"
 GER_china_friend_desc: "讓我們加深與中國長久以來的良好關係。雖然這麼做將會破壞與日本的關係，但日本難道不也只是東方的意大利嗎？"
 GER_anti_comintern_pact: "反共產國際條約"
 GER_anti_comintern_pact_desc: "共產國際對各國內政的干涉不但危害了這些國家的內部和平和社會穩定，也極大地威脅了世界的和平！我們會提議許多非共產主義國家來簽訂這一協議，從而遏制紅色政權的威脅。"
 GER_anti_soviet_pact: "反[SOV.GetAdjective]條約"
 GER_anti_soviet_pact_desc: "我們可以進一步推進反共產國際條約，提議讓所有成員國加入一個反蘇聯盟。只要任何一個簽約國與蘇聯開戰，所以其他成員國也必須向蘇聯宣戰。"
 GER_anti_soviet_pact_tt: "§Y向所有反共產國際條約成員國提議成立針對蘇聯的防禦聯盟。§!"
 GER_anti_soviet_pact_tt_2: "§Y如果任一締約國遭到共產國際攻擊，那麼防禦聯盟的所有成員都會加入戰爭。§!"
 GER_anti_soviet_pact_tt_3: "獲得民族精神§Y反蘇條約§!。\n"
 GER_ussr_war_goal: "對[GER.GetTheUSSRName]作戰"
 GER_ussr_war_goal_desc: "我們可以致力於通過宣傳讓德國人民——以及全世界的人民——準備好對[SOV.GetNameDef]進行一場正義的戰爭。"
 GER_turkey_friend: "對土耳其示好"
 GER_turkey_friend_desc: "凱末爾領導下的土耳其現代化道路令人欽佩，況且土耳其還控制著博斯普魯斯海峽和達達尼爾海峽這兩個通往黑海的戰略要地。我們當前的第一要務應該是將土耳其納入我國的影響範圍！"
 GER_anschluss_old: "德奧合併"
 GER_anschluss_desc_old: "德奧合併是德意志民族長久以來的目標。儘管凡爾賽和約禁止這一做法，但是如今是時候將提上行程了。讓我們給予奧地利人一個與我們共同實現偉大命運的機會吧！"
 GER_anschluss_eq_trigger_tt: "陸軍正在使用的步兵裝備多於§Y50.000§!"
 #anschluss_mefo_bills_tt: "Uses Austrian gold to reduce the cost of §Y$GER_mefo_bills$§!.\n"
 anschluss_mefo_bills_double_reduction: "§Y梅福券§!追加效果：每日政治點數獲取§G+0.10§!\n"
 GER_demand_memel: "重申東方領土主張"
 GER_demand_memel_desc: "前次世界大戰後，德國失去了大片東方領土，包括新生的波蘭和割讓給立陶宛的梅梅爾。我們將會對這兩個國家發出最後通牒，但至少就波蘭而言，他們恐怕不會就這樣輕易地向我們的口頭威脅屈服。"
 GER_demand_memel_threat: "德國重申東方領土主張"
 GER_danzig_or_war: "但澤或戰爭"
 GER_danzig_or_war_POL_faction_GER_leader: "§R[This.GetName]必須同意該協議才能使附加效果生效。如果戰爭爆發，他們將會脫離[Root.GetFactionName]陣營。§!\n"
 GER_danzig_or_war_POL_faction_GER_noleader: "§R[This.GetName]必須同意該協議才能使附加效果生效。如果戰爭爆發，你將脫離[Root.GetFactionName]陣營。§!\n"
 GER_danzig_or_war_desc: "但澤曾經是德意志的一部分，但澤現在是德意志的一部分，但澤在將來也永遠會是德意志的一部分！如果波蘭不願交出這塊領土，那麼我們就必須讓德國準備好面對在所難免的戰爭。但澤及其周邊地區必將重回德意志的手中！"
 GER_czech_friend: "對捷克斯洛伐克示好"
 GER_czech_friend_desc: "捷克人和斯洛伐克人都是勤勞而值得敬佩的民族。雖然我們不幸地與其在領土上有一定的糾紛，但現在放棄征服戰略並改善兩國關係還為時不晚。"
 GER_demand_sudetenland: "索取蘇臺德"
 GER_demand_sudetenland_desc: "在凡爾賽和約所導致的種種不公中，蘇臺德德意志人的命運可謂最為多舛。不論捷克會如何反對，我們都必須將他們置於我們的保護之下。"
 GER_demand_sudetenland_threat: "德國索取蘇臺德"
 GER_first_vienna_award: "第一次維也納仲裁"
 GER_first_vienna_award_desc: "匈牙利人可以說是在前次世界大戰後受苦受難最深重的民族之一了。在奧匈帝國解體之後，許多匈牙利人在一夜之間就變成了困在外國土地上的異鄉人——即使他們祖祖輩輩就生活在那些土地上。通過將捷克斯洛伐克的一些土地割給匈牙利，我們可以大大提高與他們的關係。"
 GER_end_of_czechoslovakia: "捷克斯洛伐克的命運"
 GER_end_of_czechoslovakia_desc: "是時候把捷克人的舊土劃分給那些能夠真正管理好這片土地的人們了。同時，我們也應該考慮在東面的斯洛伐克建立一個傀儡國。"
 #end_of_czechoslovakia_mefo_bills_tt: "Uses Czechoslovak gold to reduce the cost of §Y$GER_mefo_bills$§!.\n"
 GER_second_vienna_award: "第二次維也納仲裁"
 GER_second_vienna_award_desc: "特蘭西瓦尼亞，這片匈牙利人居民佔多數的土地，理應歸屬於我們的匈牙利朋友。但是，仍難說羅馬尼亞的政府和民眾會對這一要求作出什麼樣的反應。"
 GER_italy_ally: "與意大利結盟"
 GER_italy_ally_desc: "意大利也許不值得信任——就如上次世界大戰中的履歷所證明的那樣——但墨索里尼及法西斯運動表明，意大利或許還可以再搶救一下。德國無疑會從與意大利的盟約中獲益，難道不是嗎？"
 GER_nationalist_spain_ally: "與西班牙結盟"
 GER_nationalist_spain_ally_desc: "國民軍在西班牙內戰中的勝利為我國與西班牙建立良好關係鋪下了堅實的基礎。佛朗哥控制著通往地中海的要道。"
 GER_nationalist_spain_ally_tt: "增加與§Y西班牙§!的關係"
 GER_danzig_vs_slovakia: "斯洛伐克換但澤"
 GER_danzig_vs_slovakia_desc: "波蘭人妨礙了我們生存空間計劃的實施，不過現在改變我們的長期目標並且尋求他們的友誼還為時不晚。唯一可行的辦法就是易土：以斯洛伐克換取但澤。波蘭已經通過佔領扎奧爾傑的方式表明了他們對該地區的興趣。"
 GER_poland_friend: "對波蘭示好"
 GER_poland_friend_desc: "波蘭雖然已經不再擁有出海口，但獲得了斯洛伐克——我們以這樣的方式向他們傳達了善意。我們可以模稜兩可地保證其未來可以東擴領土，這樣或許可以促使兩國關係更加友好。"
 GER_war_with_france: "對法作戰"
 GER_war_with_france_desc: "目前，德國東部邊境的問題已被圓滿的解決，是時候把目光轉向西方了。阿爾薩斯-洛林地區的淪喪對於德國人的榮耀來說是永遠的恥辱，只有通過一場正義且公平的戰爭，我們才能報仇。"
 GER_war_with_france_threat: "對法國宣戰"
 GER_operation_tannenbaum: "聖誕樹行動"
 GER_operation_tannenbaum_desc: "瑞士有著最令人作嘔和卑鄙的人民和政治體系，我們終於有時間來處理這幫新德國不共戴天的敵人了。"
 GER_reintegrate_luxemburg_and_alsace_lorraine: "重新整合盧森堡和阿爾薩斯-洛林"
 GER_reintegrate_luxemburg_and_alsace_lorraine_desc: "我們成功地重新徵服了德意志故土，現在可以開始將其重新整合進[Root.GetName]。當地民眾必須被允許為祖國履行他們的愛國義務。"
 GER_naval_rearmament: "重整海軍軍備"
 GER_naval_rearmament_desc: "1935年簽署的英德海軍協定允許我們加大力度擴充海軍，我們應該不遺餘力地這樣做。"
 GER_plan_z: "Z計劃"
 GER_plan_z_desc: "海軍上將雷德爾認為水面艦艇突襲運輸船的戰術可以有效的打擊英國，但是這個計劃需要大量的時間來建造足夠多的戰艦和運輸船，可能需要太長時間……而且，我軍的水面艦艇目前少的可憐。"
 GER_u_boat_effort: "重視U艇"
 GER_u_boat_effort_desc: "海軍准將鄧尼茨主張無限制潛艇戰將會是戰勝英國的最佳方式。有了足夠的潛艇來封鎖英國的航路，我們也許可以使英國的本土工業陷入”飢餓”。"
 GER_trade_interdiction_old: "貿易阻斷"
 GER_trade_interdiction_desc_old: "我們的船廠在全力以赴的生產U艇，但是我們需要研究出最有效的方法來合理利用我們的“狼群”。給海軍將領們提供進行模擬和兵棋推演所需的一切資源……"
 GER_modular_construction: "模塊化結構"
 GER_modular_construction_desc: "通過將潛艇的部件在不同的工廠中生產，其裝配和建造速度將會有很大提高。"
 GER_denmark_friend: "對丹麥示好"
 GER_denmark_friend_desc: "炮艦外交依然存在。我們北方的小鄰居對我國的海軍擴張計劃十分清楚。由於他們懼怕我方強大的軍隊，威脅其進入我國的勢力範圍內應該會非常容易。"
 GER_norway_friend: "對挪威示好"
 GER_norway_friend_desc: "挪威控制了北瑞典大部分鐵礦的出口。為了得到這些寶貴的資源，我們應該用我們日益擴大的海軍威脅他們加入我們的”朋友圈”。"
 GER_dutch_friend: "對荷蘭示好"
 GER_dutch_friend_desc: "荷蘭人很清楚，如果再發生一場大戰，他們能堅持多久。如果我們能夠讓他們清醒的認識到英國不是德國的對手，那麼他們就有可能選擇與我們結盟，以避免被佔領。"
 GER_sweden_friend: "對瑞典示好"
 GER_sweden_friend_desc: "斯堪的納維亞半島上的國家就像是多米諾骨牌一樣，他們同生死，共患難。當挪威和丹麥都在我們的勢力範圍內時，瑞典將別無選擇。"
 GER_improve_national_spirit: "弘揚民族精神"
 GER_improve_national_spirit_desc: "前次世界大戰勝利者的首都已均入我手，我們終於可以擺脫戰敗的陰影了。德國的新時代即將到來！"
 GER_improve_national_spirit_tooltip: "我們，或者同一陣營的成員，必須牢牢地控制住倫敦和巴黎以及它們所在的地區。"
 needs_approval: "§R[This.GetName]必須批准該協議才能使獎益生效。§!\n"
 GER_demand_slovenia: "索取斯洛文尼亞"
 GER_demand_slovenia_threat: "德國索取斯洛文尼亞"
 GER_demand_slovenia_desc: "通過聖日耳曼昂萊條約，眾多繼承國獲得了奧地利的大部分歷史領土。如今奧地利再次融入德意志民族，這預示著結束不公正時機的到了。卡爾尼奧拉和施蒂利亞——即現在的斯洛文尼亞，必須迴歸祖國。"
 GER_first_ljubljana_award: "第一次盧布爾雅那仲裁"
 GER_first_ljubljana_award_desc: "虛偽的西方列強鼓吹民族自決，結果是大量少數族裔遭到塞爾維亞的統治。我們現正為糾正歷史錯誤和尋找盟友而努力。對於那些願與我等一同維持歐洲秩序的民族，我們將表現出最為慷慨的一面。"
 GER_first_ljubljana_award_tt: "所有原來是[YUG.GetAdjective]核心的地區都被§Y[YUG.GetName]§!或其傀儡國擁有。\n"
 GER_fate_of_yugoslavia: "南斯拉夫的命運"
 GER_fate_of_yugoslavia_desc: "南斯拉夫這個國家本就是一個生造的概念，該國中央政府大廈將傾。我們必須介入並幫助他們重整秩序。僅餘一個問題：怎麼做才能達成最好結果。"
 #yugoslavia_mefo_bills_tt: "Uses Yugoslav gold to reduce the cost of §YMEFO bills§!.\n"
 GER_second_ljubljana_award: "第二次盧布爾雅那仲裁"
 GER_second_ljubljana_award_tt: "事件向[Root.GetName]提供了索取領土或得到一個有價值的盟國的機會。"
 GER_second_ljubljana_award_desc: "解決南斯拉夫問題後，我們應該把目光投向希臘。同盟國把該國的地位捧得有點過分誇大，是時候看看誰才是我們真正的朋友了。"
 GER_war_with_greece: "對希臘作戰"
 GER_war_with_greece_desc: "既然已經與希臘交戰，錯失這個東地中海基地將是德國的恥辱。"
 GER_fate_of_greece: "希臘的命運"
 GER_fate_of_greece_desc: "事實證明，希臘已經無法適應歐洲的新秩序。是時候向他們提供只有德國才能給予的保護了。"
 GER_weserubung: "威瑟堡行動"
 GER_weserubung_desc: "挪威是關鍵的戰略要地，同時對任何想要破壞我們與瑞典鋼鐵貿易的敵人來說也是個明顯的進攻點，我們不能冒險讓敵人在該地區建立基地。為了得到用於進攻挪威的前進基地，我們必須先佔領丹麥。"
 GER_weserubung_tt: "\n完全控制§Y[144.GetName]§!能使我們每月通過§Y納爾維克§!運送§Y[SWE.GetName]§!高品位礦石。這將導致每6個月增加一座§Y地圖外民用工廠§!，最多可增加8座§Y地圖外民用工廠§!。如果失去對§Y[144.GetName]§!的控制，當地航運可能會中斷。如果[ENG.GetNameDefCap]成功入侵[SWE.GetName]並破壞或者[SWE.GetNameDef]自己炸燬了礦場，這些民用工廠將永久消失。如果礦場得以重建，航運將恢復。"
 GER_weserubung_tt_complete: "來自控制§Y納爾維克§!增加的§Y地圖外民用工廠§!：§G[?GER_narvik_civs]§!\n距離獲得下一座工廠的航運進度：[?GER_narvik_shipments]/6"
 GER_around_maginot: "包繞馬奇諾防線"
 GER_around_maginot_desc: "如果我們想要確保對法國的戰術優勢，就需要對其進行全方位打擊。我軍僅需處理掉路上的一點障礙，就可以從他們最不想看到的北方進攻。"
 italian_focus: "意大利國策"
 GER_danzig_or_war_POL_civil_war: "奪取但澤以交換援助"
 GER_danzig_trigger_polish_civil_war: "波蘭處於內戰且需滿足下列任一條件：\n      德國派出志願軍支持一方\n      一方是德國的盟友"
 GER_alone_or_peace_faction_tt: "未加入陣營，或者加入了與[GER.GetNameDef]處於和平的陣營。"
 GER_four_year_plan: "四年計劃"
 GER_four_year_plan_desc: "為助力國家重整軍備並最終實現自給自足，我們亟需一個在未來四年內實現的宏偉計劃。"
 GER_atlantikwall: "大西洋壁壘"
 GER_atlantikwall_desc: "我們如今已經佔領西歐，現在必須在沿海建立防禦工事，以防海對面的敵人登陸突襲。在整個歐洲沿岸建設龐大防禦工事體系應該能為我們提供充足的保護。"
 atlantikwall_tooltip: "在你或陣營成員完全控制的大西洋沿海地區增加§Y海岸要塞§!：\n"
 atlantikwall_tooltip_2: "§Y阿基坦§!\n§Y普瓦圖§!\n§Y盧瓦爾§!\n§Y布列塔尼§!\n§Y諾曼底§!\n§Y加來海峽§!\n§Y佛蘭德§!\n§Y荷蘭§!\n§Y弗里斯蘭§!\n§Y威悉-埃姆斯§!\n§Y漢諾威§!\n§Y石勒蘇益格-荷爾斯泰因§!\n§Y日德蘭§!\n§Y東挪威§!\n§Y西挪威§!\n§Y特倫德拉格§!\n§Y北挪威§!\n"
 GER_ostwall: "東方壁壘"
 GER_ostwall_desc: "東方戰事進展順利，但萬一戰局形勢逆轉之下，我們必須要有能力阻擋敵人前進。我們應該修建一條防禦工事，即黑豹-沃坦防線：沿第聶伯河，從黑海延伸到波羅的海。"
 GER_ostwall_forts: "沿第聶伯河到波羅的海，在你或陣營成員完全控制的以下地區增加§Y陸上要塞§!：\n"
 GER_ostwall_forts_2: "§Y塔爾圖§!\n§Y普斯科夫§!\n§Y涅韋爾§!\n§Y維捷布斯克§!\n§Y明斯克§!\n§Y博布魯伊斯克§!\n§Y莫濟裡§!\n§Y基輔§!\n§Y切爾卡瑟§!\n§Y第聶伯羅彼得羅夫斯克§!\n§Y扎波羅熱§!\n"
 GER_ostwall_tt: "處於我們陣營的某個成員國控制下。\n"
 GER_autarky: "自給自足"
 GER_autarky_desc: "德國要想真正強大，它必須自給自足。我們必須更好地利用我們的資源，提高我們的建設效率。"
 GER_hermann_goring_werke: "[Root.GetHermannGoringWerkeName]"
 GER_hermann_goring_werke_desc: "我們必須擺脫私人資本家反覆無常帶來的影響，為此要組建一個由我們控制的工業集團，以監管採掘業和鋼鐵業的增長。這將成為我國軍事工業的支柱。"
 GER_HERMANN_GORING_WERKE_NAME_FASCIST: "赫爾曼·戈林工廠"
 GER_HERMANN_GORING_WERKE_NAME_KAISER: "德皇工廠"
 GER_HERMANN_GORING_WERKE_NAME_COMMIE: "VEB聯合機械工廠"
 GER_HERMANN_GORING_WERKE_NAME: "國有工業"
 GER_kdf_wagen: "[Root.GetKdfWagenName]"
 GER_kdf_wagen_desc: "我們將允許公民先通過一項儲蓄金計劃來為自己預購“大眾汽車”，然後用收上來的錢投資建設汽車廠來生產訂單汽車。"
 GER_KDF_WAGEN_NAME: "力量來自歡樂汽車"
 GER_KAISER_WAGEN_NAME: "威廉汽車"
 GER_VOLKS_WAGEN_NAME: "大眾汽車"
 GER_coal_liquidization: "煤液化"
 GER_coal_liquidization_desc: "德國石油匱乏，因此必須在合成油領域加倍努力。"
 GER_synthetic_rubber: "合成橡膠"
 GER_synthetic_rubber_desc: "大規模機動化與空運亟需大量橡膠，但我國完全缺乏這種資源。我們必須以合成手段改進橡膠生產。"
 GER_german_war_economy: "德國戰時經濟"
 GER_german_war_economy_desc: "我們偉大國家的人民必須為戰爭努力而互相配合。我們將過渡到全面戰時經濟階段，每個人都應該發揮自己的作用。"
 GER_grosraumwirtschaft: "大空間經濟"
 GER_grosraumwirtschaft_desc: "我們必須為德國作為歐洲中心的命運做好準備，我們的基礎設施將把東西南北各個地區結合起來。"
 GER_align_hungary: "親近匈牙利"
 GER_align_hungary_desc: "匈牙利已經處於我們的勢力範圍內，但我們還可以進一步動搖其立場，使他們未來更容易被操縱。"
 GER_align_romania: "親近羅馬尼亞"
 GER_align_romania_desc: "羅馬尼亞已經處於我們的勢力範圍內，但我們還可以進一步動搖其立場，使他們未來更容易被操縱。"
 GER_integrate_war_economies: "整合戰時經濟"
 GER_integrate_war_economies_desc: "我們勢力範圍內的國家已經對我們產生了極度的經濟依賴。我們可以利用這一點來加強我們對其經濟的控制以及外交政策的影響。"
 GER_integrate_war_economies_tt: "如果§Y[HUN.GetName]§!在§Y[Root.GetName]§!的陣營裡，§Y[Root.GetName]§!和§Y[HUN.GetName]§!各自添加§Y4座軍用工廠§!，並且§Y[HUN.GetName]§!成為§Y[Root.GetName]§!的傀儡。\n"
 GER_integrate_war_economies_tt2: "如果§Y[ROM.GetName]§!在§Y[Root.GetName]§!的陣營裡，§Y[Root.GetName]§!和§Y[ROM.GetName]§!各自添加§Y4座軍用工廠§!，並且§Y[ROM.GetName]§!成為§Y[Root.GetName]§!的傀儡。\n"
 GER_integrate_war_economies_tt3: "§R[HUN.GetName]必須批准該協議才能使獎益生效。§!\n"
 GER_integrate_war_economies_tt4: "§R[ROM.GetName]必須批准該協議才能使獎益生效。§!\n"
 GER_uplift_the_rosenberg_office: "加強羅森堡辦公室的職權"
 GER_uplift_the_rosenberg_office_desc: "帝國內需要適當協調的事情有很多，包括對佔領區的治理與控制、內部監控以及整個納粹黨的思想和意識形態教育。所有這些事情都應該由羅森堡辦公室統一決策和管理，因為羅森堡是重要的黨派理論家和意識形態家。"
 GER_reichskommissariats_tt: "允許在佔領區組建特殊的§Y附屬國§!和§Y行政部門§!，比如§Y專員轄區§!和§Y保護國§!。同時還允許將歐洲劃分為預期的勢力範圍。\n"
 GER_oppose_hitler: "反對希特勒"
 GER_oppose_hitler_desc: "希特勒的統治必須被終結。他的意圖是通過重新軍事化萊茵蘭來激怒西方列強，但是這樣做便會給我們奪取政權的藉口，我們需要在國防軍忠誠分子的幫助下奪取政權。"
 GER_oppose_hitler_civil_war: "§R法西斯支持者將發動內戰。§!\n"
 GER_secure_the_new_state: "捍衛新國家"
 GER_secure_the_new_state_desc: "由於內戰的爆發，臨時政府缺乏力量。我們必須確保它的安全，不被再次推翻。"
 GER_clamp_down_on_fascism: "取締法西斯主義"
 GER_clamp_down_on_fascism_desc: "過去幾年裡，在納粹政權統治之下，政府及其法西斯理論家和支持者的壓迫、獨裁和反君主制性質變得非常明顯。無論如何，必須確保這些思想不再抬頭。"
 GER_revive_the_kaiserreich: "復辟帝制"
 GER_revive_the_kaiserreich_desc: "過去十年所發生的事件表明，民主制度過於軟弱，無法阻止邪惡的內部因素。我們必須團結在德皇強有力的領導下，並且我們將通過憲法來恢復德意志帝國為他的迴歸做準備。"
 GER_revive_the_kaiserreich_tt: "§Y德意志軍政府§!將被稱為§Y德意志帝國§!。\n"
 GER_mackensen_dead: "奧古斯特·馮·馬肯森逝世。"
 GER_rebuild_the_nation: "重建國家"
 GER_rebuild_the_nation_desc: "經歷內戰蹂躪後，我們必須重建我們的國家。我們會要求國民暫時放下舒適的生活，將我國所有的資源都投入到重建計劃中。"
 GER_fan_the_prussian_militarism: "宣揚普魯士軍國主義"
 GER_fan_the_prussian_militarism_desc: "為了彌補內戰的損失，我們必須求助於普魯士軍國主義，以提高新兵的招募和訓練。我們的軍隊把我們從納粹專政中解放出來，現在我們必須確保這些普魯士理想比以往任何時候都更受歡迎。"
 GER_a_new_and_better_germany: "嶄新、美好的德國"
 GER_a_new_and_better_germany_desc: "在我們重建我們國家的同時，我們應該致力於超越必要的目標。以使我們現在建立的目標能經受住時間的考驗。"
 GER_bulwark_against_bolshevism: "[GER.GetBulwarkName]"
 GER_bulwark_against_bolshevism_desc: "我們國家是抵禦[GER.GetBulwarkBolshevismDesc]的盾牌，保護西方不受[GER.GetBulwarkCommunismDesc]的影響。我們必須以自豪的態度來承擔這一責任，並準備在必要時訴諸武力。"
 GER_bulwark_against_bolshevism_tt: "§R如果和[SOV.GetNameDef]在同一陣營，或同[SOV.GetNameDef]一方進行戰爭時，這個民族精神將被移除。§!\n"
 SOV_BULWARK_NAME_COMMUNIST: "對抗布爾什維克的壁壘"
 SOV_BULWARK_NAME_FASCISM: "對抗法西斯的壁壘"
 SOV_BULWARK_NAME_NEUTRALITY: "對抗俄羅斯的壁壘"
 SOV_BULWARK_BOLSHEVISM_DESC_COMMUNIST: "布爾什維克主義"
 SOV_BULWARK_BOLSHEVISM_DESC_FASCISM: "法西斯主義"
 SOV_BULWARK_BOLSHEVISM_DESC_NEUTRALITY: "俄羅斯帝國主義"
 SOV_BULWARK_COMMUNISM_DESC_COMMUNIST: "共產主義的"
 SOV_BULWARK_COMMUNISM_DESC_FASCISM: "法西斯主義的"
 SOV_BULWARK_COMMUNISM_DESC_NEUTRALITY: "俄羅斯的"
 GER_return_of_the_kaiser: "帝王歸來"
 GER_return_of_the_kaiser_desc: "帝國需要一位皇帝，而威廉二世仍然活著，流亡在荷蘭。儘管我們對西方國家有所顧忌，但是我們將解除針對他的流亡令，並邀請他迴歸王座。"
 GER_focus_on_the_true_enemy: "關注真正的敵人"
 GER_focus_on_the_true_enemy_desc: "我們的敵人不是在內部，而是在外部。在謀求屬於自己的陽光下的地盤失敗後，我們被迫簽訂了凡爾賽條約。這份不公正的條約掩蓋了長久以來西方殖民壟斷的罪行——這項罪行將於今日被我們終結。"
 GER_rebuild_the_high_seas_fleet: "重建公海艦隊"
 GER_rebuild_the_high_seas_fleet_desc: "如果我們要成功挑戰西方，我們需要一個大規模的海軍建造計劃來重建我們曾經輝煌的公海艦隊。"
 GER_our_place_in_the_sun: "我們陽光下的地盤"
 GER_our_place_in_the_sun_desc: "讓每個人都知道，德意志帝國再次聲稱它有權得到陽光下的地盤！我們人民將不再在陰影中受辱了。"
 GER_pride_of_the_modern_germany: "現代德國之傲"
 GER_pride_of_the_modern_germany_desc: "我們需要花費很多年的努力才能達到英國皇家海軍的規模。所以，我們必須在質量上超越它。我們的艦隊將是有史以來最現代化、最強大的艦隊！"
 GER_prepare_for_the_next_blockade: "防備下次封鎖"
 GER_prepare_for_the_next_blockade_desc: "可恨的英國封鎖我們，使我們在上次大戰損失慘重中。我們將不會再犯同樣的錯誤。這一次，我們將更加不遺餘力地為即將到來的事情做好準備。"
 GER_break_the_anglo_french_colonial_hegemony: "打破英法殖民霸權"
 GER_break_the_anglo_french_colonial_hegemony_desc: "是時候打破西方對殖民主義的壟斷了，我們等這一天已經很久了。"
 flag_franco_british_union: "法英聯盟"
 GER_schlieffen_once_more: "再次實施施裡芬計劃"
 GER_schlieffen_once_more_desc: "我們必須繞過馬奇諾防線，再次借道比利時和盧森堡來閃擊法國並取得勝利。"
 GER_reinstate_imperial_possessions: "重返帝國領地"
 GER_reinstate_imperial_possessions_desc: "隨著我們成功地重新徵服了歷史上的德國地區，我們現在可以開啟將它們作為完全成熟的省份迴歸[Root.GetName]的進程。凡爾賽條約最後的恥辱終於被洗刷了！"
 GER_crossing_the_atlantic: "跨越大西洋"
 GER_crossing_the_atlantic_desc: "隨著我們征服了歐陸上所有反對我國統治的國家，現在我們必須把生產重心再度轉移到建立一支龐大的海軍上，以便在接下來發動對英國人和美國人的打擊。我們將永不停息，直到舊世界在上帝認為適當的時候，傾盡它全部的力量，踏上支配並羞辱新世界的征途。"
 GER_crossing_the_atlantic_trigger_tt: "沒有：任意敵國：\n  被認為是主要國家\n  任意控制地區：\n     在§Y歐洲§!"
 GER_crossing_the_atlantic_2_factories_tt: "每有一個沿海地區收到這些海軍船塢，就從一個內陸地區移除§Y2座軍用工廠§!。\n"
 GER_crossing_the_atlantic_1_factory_tt: "每有一個沿海地區收到這些海軍船塢，就從一個內陸地區移除§Y1座軍用工廠§!。\n"
 GER_the_central_powers: "舊同盟國"
 GER_the_central_powers_desc: "如果我們要與西方對抗，我們就需要盟友。我們將建立自己的陣營來反對民主國家的壓迫。"
 GER_prepare_italian_coup: "策劃意大利政變"
 GER_prepare_italian_coup_desc: "意大利如果陷入法西斯主義的泥潭，必將覆滅。我們將向意大利保王派提議，由我們來支持一場政變。"
 GER_prepare_italian_coup_tt: "如果他們接受我們的提議：\n"
 GER_assassinate_mussolini: "刺殺墨索里尼"
 GER_assassinate_mussolini_desc: "終於到了終結意大利法西斯主義的關鍵時刻了。德國來刺殺其領導人，然後意大利保王派將迅速奪取政權。"
 GER_italy_declined_assassination_tt: "§Y[ITA.GetNameWithFlag]§!尚未拒絕我們刺殺提議"
 GER_rekindle_imperial_sentiment: "重燃帝國情緒"
 GER_rekindle_imperial_sentiment_desc: "儘管奧匈帝國在一戰後解體，但仍然可以找到那些為帝國的逝去而感傷的人。我們將培育這些帝國情懷，並希望這個繼承國可以決定為了自己的崛起而重新加入陣營。"
 GER_rekindle_imperial_sentiment_tt: "當中立主義支持度足夠高時，這些國家就可啟用重建奧匈帝國並加入舊同盟國的決議。\n"
 GER_rekindle_imperial_sentiment_tt_2: "當中立主義支持度足夠高時，這些國家就可啟用重建奧匈帝國並加入中歐同盟的決議。\n"
 GER_expatriate_the_communists: "驅逐共產主義者"
 GER_expatriate_the_communists_desc: "內部的共產主義威脅繼續困擾著我們國家。無論其信徒逃到哪裡，我們都必須擺脫它。"
 GER_accept_british_naval_dominance: "接受英國海軍支配"
 GER_accept_british_naval_dominance_desc: "我們需要盟友來對抗共產主義，而英國是一個主要的選擇。為了改善關係，我們將通過接受其海軍的支配並放棄任何廣泛的海軍建設，來減輕他們的擔憂。"
 GER_ally_the_shade: "陰影下的盟約"
 GER_ally_the_shade_desc: "如果我們不能搶佔他們在陽光下的地盤，那麼我們將與那些在我們身上投下陰影的人結盟。"
 GER_carte_blanche_for_alsace_and_french_colonies: "全權管理阿爾薩斯和法國殖民地"
 GER_carte_blanche_for_alsace_and_french_colonies_desc: "我們必須向我們的新盟友提出請求，允許我們自由支配我們重新收回的合法領土：阿爾薩斯-洛林，以及我們在非洲殖民地的公平份額。"
 GER_bypass_maginot_in_the_south: "從南部繞過馬奇諾防線"
 GER_bypass_maginot_in_the_south_desc: "英國人在低地國家有他們的利益，所以我們必須在馬奇諾防線附近尋找一條替代路線。南部地區雖然多山，難以穿越，但足夠滿足我們的要求。德國人的聰明才智會讓我們度過難關。"
 GER_see_to_the_eastern_front: "關注東線"
 GER_see_to_the_eastern_front_desc: "如果我們從一戰中學到了什麼，那就是我們必須對我們偏遠的東部地區準備一場襲擊。為了防止入侵，這些領地必須被收回並鞏固防禦。"
 GER_see_to_the_eastern_front_tt: "在東部邊界的3個省添加6§Y陸地要塞§!。\n"
 GER_see_to_the_eastern_front_tt2: "在東部邊界的4個省添加8§Y陸地要塞§!。\n"
 GER_danzig_for_guarantees: "但澤換取保障"
 GER_danzig_for_guarantees_desc: "波蘭人肯定感受到了[GER.GetDanzigGuaranteesBolsheviksDesc]威脅。也許我們可以達成一項關於但澤、波茲南和西里西亞省迴歸的協議，以換取在面臨[GER.GetDanzigGuaranteesRedsDesc]入侵時，由我們提供軍事支持的保證。"
 SOV_DANZIG_GUARANTEES_BOLSHEVIKS_DESC_COMMUNIST: "布爾什維克"
 SOV_DANZIG_GUARANTEES_BOLSHEVIKS_DESC_FASCISM: "東方法西斯主義者"
 SOV_DANZIG_GUARANTEES_BOLSHEVIKS_DESC_NEUTRALITY: "俄羅斯人"
 SOV_DANZIG_GUARANTEES_REDS_DESC_COMMUNIST: "紅軍的"
 SOV_DANZIG_GUARANTEES_REDS_DESC_NEUTRALITY: "來自東方的"
 GER_safeguard_the_baltic: "守護波羅的海"
 GER_safeguard_the_baltic_desc: "直到幾十年前，波羅的海仍然是俄羅斯帝國的一部分，這就意味著[GER.GetRussiansDemonym]可能會再次試圖吞併它們。我們必須防止這種情況發生，並在[SOV.GetAdjective]入侵的情況下提供我們的軍事支持。"
 GER_support_the_finns: "支持芬蘭人"
 GER_support_the_finns_desc: "芬蘭人發現自己處於[GER.GetRussiansDemonym]的炮口之下。我們將為他們提供一種抵禦共產主義威脅的保證，並給予他們一些適度的工業援助。"
 GER_anti_comintern_pact_unaligned: "意識形態防禦"
 GER_anti_comintern_pact_unaligned_desc: "軍事威脅並不是我們面臨的唯一威脅。我們必須設法牽制共產主義，併為此，我們將與我們的非共產主義同伴達成一項協議，以打擊共產主義的發展。"
 GER_anti_soviet_pact_unaligned: "反共條約正式化"
 GER_anti_soviet_pact_unaligned_desc: "我們應該將通過邀請所有反共產國際條約的簽約國同意附加條款，呼籲針對蘇聯任何形式的侵略採取軍事支持，來準備與共產主義發生軍事衝突。由於我們已經在很多方面彼此承諾，這應該不過是一種形式。"
 GER_tackle_the_communist_threat: "解決[GER.GetTackleCommunistThreatName]威脅"
 GER_tackle_the_communist_threat_desc: "只要[SOV.GetNameDef]存在，它就會對我們構成威脅。與其等待他們發動攻擊，不如我們自己先動手。"
 SOV_TACKLE_COMMUNIST_THREAT_NAME_COMMUNIST: "共產主義"
 SOV_TACKLE_COMMUNIST_THREAT_NAME_EXILES: "東方"
 GER_the_iberian_problem: "伊比利亞問題"
 GER_the_iberian_problem_desc: "共產主義的堡壘仍然存在。我們必須確保一切都被剷除，就從西班牙共產主義者開始吧。"
 GER_spain_wargoal_tt: "獲得針對§Y西班牙共和國§!的§Y吞併§!戰爭目標。\n"
 GER_reestablish_free_elections: "重建自由選舉"
 GER_reestablish_free_elections_desc: "我們將通過重建自由選舉來恢復民主理想，並將在不久的將來舉行選舉。"
 GER_the_monarchy_compromise: "向君主制妥協"
 GER_the_monarchy_compromise_desc: "為我們擺脫納粹暴政而戰鬥的軍隊有明顯的保皇主義傾向。為了確保他們對國家所採取的道路感到滿意，我們必須做出妥協並讓君主制迴歸。"
 GER_the_great_red_menace: "巨大的[GER.GetGreatRedMenaceName]威脅"
 GER_the_great_red_menace_desc: "我國在前次戰爭中的行動至今仍存在許多人的記憶中。我們必須重新關注對於歐洲真正威脅的恐懼：那就是隱約出現的巨大[GER.GetGreatRedMenaceDesc]威脅。我們將展開大規模的宣傳活動，以此擦亮歐洲各國的雙眼。"
 SOV_GREAT_RED_MENACE_NAME_COMMUNIST: "紅色"
 SOV_GREAT_RED_MENACE_NAME_EXILES: "東方"
 SOV_GREAT_RED_MENACE_DESC_COMMUNIST: "共產主義威脅"
 SOV_GREAT_RED_MENACE_DESC_EXILES: "俄羅斯帝國主義威脅"
 GER_central_european_alliance: "中歐同盟"
 GER_central_european_alliance_desc: "既然我們已經把注意力集中在歐洲大陸的問題上，我們就必須提出解決辦法：我們將領導一個所有歐洲次要國家的聯盟，這將確保我們的生活方式免受最致命的威脅。"
 GER_central_european_alliance_tt: "如果不在一個陣營裡：\n"
 GER_danubian_membership: "多瑙河成員國"
 GER_danubian_membership_desc: "這些奧匈帝國繼承國多瑙河成員國們沒有忘記成為我們的盟友意味著什麼。我們將為他們提供成員國資格，並保護他們免受[GER.GetDanubianMembershipDesc]的威脅。"
 SOV_DANUBIAN_MEMBERSHIP_DESC_COMMUNIST: "共產主義"
 SOV_DANUBIAN_MEMBERSHIP_DESC_EXILES: "東部侵略"
 GER_danubian_expansion: "擴大對多瑙河沿岸國家的影響力"
 GER_danubian_expansion_desc: "我們必須設法擴大我們對那些容易遭受[SOV.GetAdjective]侵略的巴爾幹國家的影響力。我們將向其餘的多瑙河國家提供成員國資格，並保護他們免受[GER.GetDanubianMembershipDesc]的威脅。"
 invite_non_fascist_communist_only_TT: "要求潛在的成員國不是法西斯或共產主義，並且沒有加入任何陣營。\n"
 GER_no_balkan_communism: "遏止巴爾幹赤化"
 GER_no_balkan_communism_desc: "共產主義的影響已蔓延至巴爾幹半島，我們不能容許此事。必須在它根基尚淺時把這勢頭摧滅。"
 GER_no_balkan_communism_tt: "獲得針對巴爾幹地區共產主義國家的§Y推翻政府§!戰爭目標。\n"
 GER_no_balkan_communism_HUN_tt: "獲得針對§Y匈牙利人民共和國§!的§Y推翻政府§!戰爭目標。\n"
 GER_no_balkan_communism_ROM_tt: "獲得針對§Y羅馬尼亞人民共和國§!的§Y推翻政府§!戰爭目標。\n"
 GER_no_balkan_communism_YUG_tt: "獲得針對§Y南斯拉夫社會主義聯邦共和國§!的§Y推翻政府§!戰爭目標。\n"
 GER_no_balkan_communism_BUL_tt: "獲得針對§Y保加利亞社會主義共和國§!的§Y推翻政府§!戰爭目標。\n"
 GER_low_countries_membership: "低地國家成員國資格"
 GER_low_countries_membership_desc: "儘管遠離歐洲東部邊境，不過低地國家知道，如果中歐地區淪陷，他們將是下一個目標。我們將為他們提供成員國資格，這樣他們就可以與我們一道對抗共產主義威脅。"
 GER_no_reds_in_western_europe: "遏止西歐赤化"
 GER_no_reds_in_western_europe_desc: "共產主義的影響已蔓延至西歐，我們不能容許此事。必須在它根基尚淺時把這勢頭摧滅。"
 GER_no_reds_in_western_europe_tt: "獲得針對低地和法國地區共產主義國家的§Y推翻政府§!戰爭目標。\n"
 GER_no_reds_in_western_europe_FRA_tt: "獲得針對§Y法蘭西公社§!的§Y推翻政府§!戰爭目標。\n"
 GER_no_reds_in_western_europe_HOL_tt: "獲得針對§Y人民聯合省§!的§Y推翻政府§!戰爭目標。\n"
 GER_no_reds_in_western_europe_BEL_tt: "獲得針對§Y比利時合作社§!的§Y推翻政府§!戰爭目標。\n"
 GER_no_reds_in_western_europe_LUX_tt: "獲得針對§Y羅莎盧森堡§!的§Y推翻政府§!戰爭目標。\n"
 GER_scandinavian_membership: "斯堪的那維亞成員國資格"
 GER_scandinavian_membership_desc: "群山和寒冷並不能抵禦[GER.GetGreatRedMenaceName]威脅，斯堪的納維亞人民必須瞭解到這一點。我們將為他們提供成員國資格，並保護他們免受[GER.GetDanubianMembershipDesc]的威脅。"
 GER_baltic_membership: "波羅的成員國資格"
 GER_baltic_membership_desc: "二十年來，波羅的海諸國一直生活在再次吞併和[GER.GetBalticMembershipDesc]的雙重威脅之下，我們將為他們提供成員國資格，並保護他們免受[GER.GetDanubianMembershipDesc]的威脅。"
 SOV_BALTIC_MEMBERSHIP_DESC_COMMUNIST: "共產主義"
 SOV_BALTIC_MEMBERSHIP_DESC_EXILES: "[SOV.GetAdjective]帝國主義"
 GER_polish_membership: "波蘭成員國資格"
 GER_polish_membership_desc: "波蘭人對所有鄰國都不信任，但他們清楚最大的威脅來自於東方。我們將為他們提供成員國資格，並保護他們免受[GER.GetDanubianMembershipDesc]的威脅。"
 GER_finnish_membership: "芬蘭成員國資格"
 GER_finnish_membership_desc: "遠離歐洲中心的芬蘭人面臨著獨自面對著[GER.GetFinnishMembershipDesc]威脅的風險。但他們不需要這樣做。我們將為他們提供成員國資格，並保護他們免受[GER.GetDanubianMembershipDesc]的威脅。"
 SOV_FINNISH_MEMBERSHIP_DESC_COMMUNIST: "紅軍"
 SOV_FINNISH_MEMBERSHIP_DESC_EXILES: "俄軍"
 GER_strike_at_the_source: "打擊共產主義起源地"
 GER_strike_at_the_source_desc: "生活在恐懼之中的生活就根本不是生活。我們必須徹底結束這種對我們生活方式的威脅。歐洲[GER.GetStrikeAtTheSourceDesc]勢力的根源地必須被摧毀。"
 GER_swedish_trade_agreement: "德國-瑞典貿易協定"
 GER_swedish_trade_agreement_desc: "我國鋼材品質不佳，而為了供應戰爭機器，我們需要最好的材料。幸好北方的[SWE.GetName]是一個理想的合夥人：富含高品質資源、中立且不太可能在我們將來實施計劃時多言多語。"
 SOV_STRIKE_AT_THE_SOURCE_DESC_COMMUNIST: "共產主義影響"
 SOV_STRIKE_AT_THE_SOURCE_DESC_EXILES: "俄羅斯帝國主義"
 GER_reverse_the_brain_drain: "逆轉人才流失"
 GER_reverse_the_brain_drain_desc: "考慮到壓迫者和專制政權已經被擊敗，我們可以嘗試讓那些逃離國家的科學家重返家園，重新回到他們的祖國工作。"
 GER_shared_rd_programs: "共享研發計劃"
 GER_shared_rd_programs_desc: "為了我們的事業，我們必須彙集我們的科學知識，並與我們的新盟友分享我們的技術進步。"
 GER_the_mannheim_project: "曼海姆計劃"
 GER_the_mannheim_project_desc: "由於挪威的重水廠現在處於我們的控制之下，我們可以加倍努力破解原子的秘密，並把它當作武器來對付[GER.GetDanzigGuaranteesBolsheviksDesc]。"
 GER_the_mannheim_project_tt: "這個國策將根據目前的原子研究水平給予不同的獎勵：\n\n"
 GER_pool_technical_know_how: "專業技術知識共享"
 GER_pool_technical_know_how_desc: "每個國家都有自己的管理工業和維護設備的方法。我們可以通過向聯盟其他成員國派遣技術團隊相互學習相關知識。"
 GER_pool_technical_know_how_tt: "我方§Y陣營§!裡的每個§Y國家§!都將獲得這個§Y民族精神§!。"
 ITA_ethiopian_war_logistics: "埃塞俄比亞戰爭後勤"
 ITA_ethiopian_war_logistics_desc: "我們可能誤判了對埃塞俄比亞的光榮征途背後的後勤狀況。我們的首要目標就是要確保勇敢的軍隊有足夠的物資作支持。"
 ITA_fortification_effort: "重視防禦工事"
 ITA_fortification_effort_desc: "我們必須要擊敗英、法帝國主義的侵略，以此來保證我們的國土不受侵犯。"
 ITA_fortification_effort_forts: "在意法邊境上建造§Y15個陸上要塞§!。\n"
 ITA_army_primacy: "陸軍為主"
 ITA_army_primacy_desc: "從工業上來看，意大利仍然落後於腐朽的殖民帝國。我們必須選擇以陸軍為主還是以海軍為主——這根本用不上考慮。就像古羅馬帝國以軍團稱霸歐洲一樣，新生的意大利帝國也應如此效仿！"
 ITA_modernized_artillery: "現代化火炮"
 ITA_modernized_artillery_desc: "理論上，意大利皇家陸軍是世界上規模最大的陸軍之一。不幸的是，我們無法保證每一位士兵都有先進的裝備。最糟糕的是，我們的大多數炮兵裝備生產於1918年！"
 ITA_modernized_army: "現代化陸軍"
 ITA_modernized_army_desc: "更好的炮兵將大大提高我軍的戰鬥力，但是我們也同時需要新的戰術以及新的學說。"
 ITA_armored_effort: "重視裝甲部隊"
 ITA_armored_effort_desc: "我們的坦克儘管在埃塞俄比亞戰場上表現優異，但仍遠未達到能與腐朽卻仍強大的歐洲民主國家對抗的標準。"
 ITA_mare_nostrum: "我們的海"
 ITA_mare_nostrum_desc: "資源有限致使我們必須做出一些痛苦的選擇，但大英帝國的海軍業已將我們圍困在了地中海當中。我們必須要有能夠和他們相匹敵的力量來突圍……"
 ITA_carrier_effort: "重視航母"
 ITA_carrier_effort_desc: "現代化戰鬥艦隊的主力將會是航空母艦而不是戰列艦。早在1921年，美國人就證明了制空權對海戰的重要性！"
 ITA_capital_ships: "重視主力艦"
 ITA_capital_ships_desc: "擁有最多主力艦的國家將統治海洋。我們決不能容忍皇家海軍在地中海內佔上風……"
 ITA_bomber_effort: "重視轟炸機"
 ITA_bomber_effort_desc: "不重視天空而贏得陸地戰的時代早已一去不復返。我們要發展戰術轟炸機來為我們的士兵提供必要的空中支援。"
 ITA_atlantic_fleet: "大西洋艦隊"
 ITA_atlantic_fleet_desc: "一旦我們突破了英軍的封鎖，我們的首要任務就是將軍力投放到海洋上。"
 ITA_marines_and_landing_craft: "海軍陸戰隊和登陸艇"
 ITA_marines_and_landing_craft_desc: "單憑海軍我們是無法贏得戰爭的，我們還必須有能力保證我們的士兵能夠安全的上岸……"
 ITA_jet_engine_effort: "重視噴氣引擎"
 ITA_jet_engine_effort_desc: "得益於賽康多·卡皮尼的傑出成果，意大利在噴氣發動機的發展上走到了世界的前面。我們應該給他一切他所需要的資源來進一步提高意大利皇家空軍。"
 ITA_light_ship_effort: "重視輕型艦船"
 ITA_light_ship_effort_desc: "因為我們的海外軍團需要保護，所以我們需要研究新的學說以及更現代化的驅逐艦。"
 ITA_escort_effort: "重視護航"
 ITA_escort_effort_desc: "我們應該做進一步努力來保護我們脆弱的地中海航運。"
 ITA_sea_wolves: "海狼"
 ITA_sea_wolves_desc: "我們的德國盟友研發了可怕而高效的潛艇，並研究了對應”狼群”戰術，我們應該向他們學習。"
 ITA_slovenia_dalmatia_claims: "聲索南斯拉夫領土"
 ITA_slovenia_dalmatia_claims_desc: "南斯拉夫還有很多意大利人，至少可以追溯到輝煌的威尼斯時代。在該地區恢復意大利統治將會是邁向重建羅馬帝國的重要一步！"
 ITA_slovenia_dalmatia_claims_threat: "意大利聲索南斯拉夫領土"
 ITA_yugoslavia_friend: "對南斯拉夫示好"
 ITA_yugoslavia_friend_desc: "與其現在進攻南斯拉夫，我們倒不如另找時機將其一舉拿下。相反，我們可以和他們建立友誼並使他們進入我們的勢力範圍。"
 ITA_support_nationalist_spain: "支持西班牙國民軍"
 ITA_support_nationalist_spain_desc: "西班牙正處於內戰之中，這將會決定他是法西斯的盟友還是一個無用的共和國，或者更糟糕的是墮落為共產主義或是無政府狀態。我們必須及時為真正的西班牙人提供支持！"
 ITA_demand_balearic_islands: "索取巴利阿里群島"
 ITA_demand_balearic_islands_desc: "我們已經證明了對佛朗哥新政權的支持，現在我們可以幫助他們保護一個重要的領地——巴利阿里群島。我們要求將巴利阿里群島割讓給意大利，以此加強我們在地中海的戰略態勢。"
 ITA_bulgaria_friend: "對保加利亞示好"
 ITA_bulgaria_friend_desc: "保加利亞在我們的勢力範圍內，他們與意大利的牢固關係是我們進入巴爾幹的鑰匙。"
 ITA_albania_war_goal: "佔領阿爾巴尼亞"
 ITA_albania_war_goal_desc: "我們的軍隊可以輕鬆的佔領阿爾巴尼亞，在這一過程中，我們不太可能會遇到任何阻力。我們必須向世界展示意大利的實力，光復羅馬帝國的榮耀！"
 ITA_pact_of_steel: "鋼鐵條約"
 ITA_pact_of_steel_desc: "我們與納粹德國關係的問題在於意識形態有分歧以及相沖突的目標；墨索里尼極為警惕德國入侵奧地利和巴爾幹的野心。然而，現實是會變的……"
 ITA_germ_italy_same_tt: "§Y意大利§!和§Y德國§!有著同樣的§Y意識形態§!。"
 ITA_german_millitary_cooperation: "對德軍事合作"
 ITA_german_millitary_cooperation_desc: "通過與強大的德軍的緊密合作，我們可以把德國的高效以及意大利軍隊的創新結合在一起。我們將比任何敢於挑戰我們的敵人更具有戰略優勢。"
 ITA_claims_on_france: "聲索法國領土"
 ITA_claims_on_france_desc: "奪取維希法國的領土。德軍征服巴黎並在法國成立了新政府，我們也該宣示對南歐的所有權了。德國在北部大肆擴張，我們也必須獲得自己那一份才算公平。"
 ITA_claims_on_france_tt: "§Y維希法國§!存在並控制§Y薩伏依§!和§Y科西嘉§!"
 ITA_go_after_france: "襲擊法國"
 ITA_go_after_france_desc: "法國……又一個西方反動民主國家，幾乎每時每刻都在試圖阻礙意大利人民的前進，並經常危及意大利人民的生存。我們要為了意大利的利益和帝國的未來而戰鬥。"
 ITA_claims_on_turkey: "聲索土耳其領土"
 ITA_claims_on_turkey_desc: "1915年倫敦條約承諾了讓意大利獲得土耳其的安納托利亞地區，作為交換，西方國家獲得了地中海東部的黎凡特。他們奪走了他們想要的，並聲稱那是國聯的授權，而意大利的要求卻被拒絕了。新意大利比當初更加強大，我們將強迫土耳其履行當初英國人的承諾。"
 ITA_italy_first: "意大利萬歲"
 ITA_italy_first_desc: "我們光榮的領袖永遠不會當希特勒的副手！我們必須注意羅馬帝國的教訓，日耳曼人對意大利事務的干涉永遠沒有好結果……"
 ITA_romania_friend: "對羅馬尼亞示好"
 ITA_romania_friend_desc: "將我們遙遠的羅馬尼亞同胞拉入我們的勢力範圍，這是我們最大的利益。領袖在他們的“鐵衛團”中看到了巨大的潛力。"
 ITA_german_rd_treaty: "對德貿易"
 ITA_german_rd_treaty_desc: "為了我們兩個偉大國家的利益，我們應該要求德國與我們交換技術機密。"
 ITA_spanish_italian_faction: "西意同盟"
 ITA_spanish_italian_faction_desc: "佛朗哥與西班牙國民軍是我們天然的盟友，兩國在宗教、文化和意識形態領域緊密一致。我們攜手起來，便能奪取直布羅陀，讓英國海軍碰壁去吧……"
 ITA_italian_highways: "意大利高速公路"
 ITA_italian_highways_desc: "我們需要擴建基礎設施，以確保部隊在帝國境內可以迅速機動。敵人遍佈全世界，要想保衛意大利，這可以說是至關重要的一個環節。"
 ITA_libyan_infrastructure: "利比亞基建"
 ITA_libyan_infrastructure_desc: "我國的北非屬地面積不小，可基建水平仍遠落後於帝國的其他部分。我們應當重點關注如何讓北非基建水平達標。"
 ITA_greece_war_goal: "對希臘作戰"
 ITA_greece_war_goal_desc: "如果沒有希臘，我們算是復興了一個什麼樣的羅馬帝國？這應該是個簡單的目標……"
 ITA_greece_friend: "對希臘示好"
 ITA_greece_friend_desc: "希臘民族的歷史如同歐羅巴大地一般歷史悠久，是西方文明的搖籃。我們可不能將其推向我們的敵對一側……"
 ITA_turkey_friend: "對土耳其示好"
 ITA_turkey_friend_desc: "經過意土戰爭和世界大戰後，土耳其不太可能對我們有好感。然而現實政治總是優先於過往不合，地中海局勢會把我們推到一起去。"
 ITA_portugal_friend: "對葡萄牙示好"
 ITA_portugal_friend_desc: "葡萄牙同西班牙一樣，是意大利的天然盟友。我們牢固加強友誼的紐帶。"
 ITA_anti_uk_war_goals: "對英作戰"
 ITA_anti_uk_war_goals_desc: "腐朽的大英帝國將我們牢牢鎖在地中海，永遠不會主動打開我們的牢籠。我們必須搶抓時機，襲擊英國！"
 ITA_japan_friend: "對日示好"
 ITA_japan_friend_desc: "日本的境況與我們極為相似：年輕而又飢腸轆轆的國家，人口過密，且還被英國跟荷蘭這樣腐朽的金權民主國家藉由不平等貿易而橫加盤剝。我們應當與他們結盟，組成一個朝氣蓬勃的海軍軸心，共同縱橫四海！"
 soviet_focus: "蘇聯國策"
 #SOV_finish_five_year_plan: "Finish the Five Year Plan"
 #SOV_finish_the_five_year_plan_desc: "The second Five Year Plan prioritizes the development of heavy industry. The Soviet Union must develop quickly in order to match the Capitalist and Fascist powers of the West."
 SOV_move_industry_to_urals: "向烏拉爾轉移工業"
 SOV_move_industry_to_urals_desc: "我們不能允許偷襲我們的希特勒的信徒們得到蘇聯西部珍貴的工業產業。通過付出巨大的努力和犧牲，我們就能夠迅速把最有價值的重工業設施轉移到車里雅賓斯克以及烏拉爾地區的其他位置。"
 SOV_defense_of_moscow: "防禦莫斯科"
 SOV_defense_of_moscow_desc: "法西斯主義者已經叩響了我們首都的大門！我們必須不惜一切代價防止莫斯科淪陷。動員包括孩子到老人的所有人，迅速修建出一切能修建的防禦！"
 SOV_defense_of_moscow_forts: "在莫斯科附近增加§Y28個陸上要塞§!。\n"
 SOV_infrastructure_effort: "重視基建"
 SOV_infrastructure_effort_desc: "[ROOT.GetNameDefCap]地廣人稀，我們必須保障在我們遼闊的國土上迅速運輸物資和裝備的能力。"
 SOV_tranformation_of_nature: "改造大自然"
 SOV_tranformation_of_nature_desc: "斯大林的改造大自然計劃必須實施。人民必須依據自己的意願全面改造自然環境。"
 SOV_stalin_constitution: "斯大林憲法"
 SOV_stalin_constitution_desc: "是時候修改我們的舊憲法了，蘇聯的工人和農民享有的權利將讓全世界動容！"
 #SOV_collectivist_propaganda: "Collectivist Propaganda"
 #SOV_collectivist_propaganda_desc: "In the Soviet Union, there is no room for individual glory. Our propaganda should strongly emphasize collective efforts; surpassed production goals, successful expeditions and massive construction projects."
 SOV_militarized_schools: "軍事化學校"
 SOV_militarized_schools_desc: "蘇聯的孩子們應該被教導遵守軍事化的紀律，以及諸如自我犧牲和團結之類的蘇聯的美德。年輕的意志更容易被塑造。"
 SOV_workers_culture: "勞動者文化"
 SOV_workers_culture_desc: "社會主義並不只是一種經濟體系，馬克思主義也並不只是一種科學，我們必須把資產階級風俗習慣的殘留從蘇聯社會的每一個角落清除出去。"
 SOV_new_soviet_man: "新蘇維埃公民"
 SOV_new_soviet_man_desc: "新蘇維埃公民是無私，有文化，守紀律且健康的，是對本能以及錯誤意識偉大勝利的活的象徵。男人們願意為了全人類獻出生命，女人將為了蘇聯的將來養育許多孩子。"
 #SOV_positive_heroism: "Positive Heroism"
 #SOV_positive_heroism_desc: "It is time to move on from the old Leninist collectivist propaganda and transform various exceptional individuals into larger-than-life Heroes of Socialism!"
 SOV_progress_cult: "科技進步崇拜"
 SOV_progress_cult_desc: "我們應當為傑出的蘇聯科學家的創新歡呼，並鼓勵這種正確的自由思想。看看李森科同志卓越的成就，蘇聯在對科學新領域的開拓上，將始終領先於頹廢的西方世界！"
 SOV_socialist_science: "社會主義科學"
 SOV_socialist_science_desc: "世界，和思維一樣，是無時不刻不在運動的。自然是永遠向前發展甚至革新的。辯證唯物主義的理論也可以被應用在自然科學上……"
 SOV_aviation_cult: "航空崇拜"
 SOV_aviation_cult_desc: "蘇聯在航空上驚人的成就將使世界動容。我們英雄的飛行員們是布爾什維克文化和進展的騎士，展現了我們使用科技對自然的掌控。我們相比沙皇時代已經前進了太多！"
 SOV_women_pilots: "女性飛行員"
 SOV_women_pilots_desc: "拉斯科娃同志，我們英雄的長距飛行員，應該被允許通過她的122航空團計劃，組建一些完全由女性組成的航空聯隊。"
 SOV_night_witches_tt: "第588夜間轟炸機團在莫斯科組建並待命。"
 #SOV_socialist_realism: "Socialist Realism"
 #SOV_socialist_realism_desc: "All works of art in the Soviet Union must strive to educate the people in the goals and meaning of Communism, depicting the proletariat in realistic and typical scenes of everyday life. Soviet artists are the engineers of souls!"
 SOV_improve_railway_network: "改善鐵路網"
 SOV_improve_railway_network_desc: "事實證明，我國的第一個五年計劃大獲成功。重工業的大規模擴張使蘇聯的自衛能力更加強大，但鐵路網絡卻遇到了一些重大瓶頸。鐵路人民委員會（NKPS）制定了一項雄心勃勃的計劃，消滅這些瓶頸，確保我們有能力保衛祖國。"
 SOV_transpolar_flights: "跨過北極的航線"
 SOV_transpolar_flights_desc: "我們最勇敢的飛行員剛剛開始證明穿越北極的航線是可行的。通過在我們的空戰計劃中使用這些出人意料的捷徑，我們將有能力奇襲敵人。"
 SOV_ocean_going_navy: "遠洋海軍"
 SOV_ocean_going_navy_desc: "儘管聯盟擁有比這個星球上其他任何國家都遼闊的國土，這個世界的海洋還未被我們的艦隊統治。擁有超重裝甲的戰列艦將成為我們未來的海洋艦隊的一部分。"
 SOV_peoples_commissariat: "建立國防工業人民委員部"
 SOV_peoples_commissariat_desc: "蘇聯的國防工業人民委員部將會是一個注重軍工計劃的重工業部。長遠而言，他們的工作也許還需要其他部門來分擔。"
 SOV_anti_fascist_diplomacy: "反法西斯外交"
 SOV_anti_fascist_diplomacy_desc: "儘管西方政權都是壓迫人民並且腐敗的，但它們都不如那些裝成進步、甚至偽裝成社會主義的政權邪惡！通過在無產階級中宣傳這類虛假意識，他們正在試圖延緩革命的到來，讓工人們處於永久的束縛之中。"
 SOV_operation_zet: "Zet行動"
 SOV_operation_zet_desc: "儘管國民黨十分反動，但毛澤東和他的共產黨在國共內戰中似乎勝率渺茫。我們應該積極加強同蔣介石的關係。無論如何，日本這個荒謬且落後於時代的帝國必然在不久以後崩潰。"
 SOV_annex_tannu_tuva: "吞併唐努圖瓦"
 SOV_annex_tannu_tuva_desc: "儘管在經濟上受益甚微，我們也應該處於政治考量，正式吸收唐努圖瓦人民共和國成為蘇聯的一個自治區。"
 SOV_improve_stalin_line: "加固斯大林防線"
 SOV_improve_stalin_line_desc: "我們必須從法西斯侵略者的手中更好的保護西部邊境。斯大林防線應該被拓展和現代化改造。"
 #SOV_far_east_fortification: "Far East Fortification"
 #SOV_far_east_fortification_desc: "The Japanese are constantly making incursions across the border with Manchuria. We must improve our defenses along that frontier in order to deter them permanently."
 SOV_far_east_fortification_forts_1: "在蘇日邊境增加§Y6個陸上要塞§!。\n"
 SOV_far_east_fortification_forts_2: "在蘇日邊境增加§Y8個陸上要塞§!。\n"
 SOV_far_east_fortification_forts_3: "在蘇日邊境增加§Y4個陸上要塞§!。\n"
 SOV_xian_incident: "西安事變"
 SOV_xian_incident_desc: "通過與國民黨高層的深入交流，我們應該可以綁架蔣介石然後迫使他與毛談判，以結束他們之間摧毀性的內戰，讓中國可以更好地抵抗日本人。"
 SOV_xian_incident_tt: "如果雙方同意，會迫使共產黨和國民黨停戰。"
 SOV_anti_capitalist_diplomacy: "反資本主義外交"
 SOV_anti_capitalist_diplomacy_desc: "毫無疑問，世界革命最大的絆腳石是肥胖銀行家美國和殘暴殖民者英國。我們必須時刻敲打他們貪婪的雙手並阻止他們的自由主義宣傳。"
 SOV_expand_red_fleet: "擴大紅海軍"
 SOV_expand_red_fleet_desc: "相比帝國主義列強，紅海軍顯得非常弱小。我們要把海軍擴張作為國家的優先策略！"
 SOV_anti_colonialist_rebels: "共產國際"
 SOV_anti_colonialist_rebels_desc: "資本主義終於到了滅亡的邊緣，當前所有的共產黨應有的姿態應當是高度進取的，鬥志昂揚的，極左的陣線。具體而言，我們要求全世界的共產黨投身於消滅溫和左翼。"
 SOV_southern_thrust: "南進"
 SOV_southern_thrust_desc: "吞併伊朗和伊拉克不但可以保障我們偉大革命的石油供給，還可以對英帝國主義的埃及和印度製造壓力。"
 #SOV_reconcile_japan: "Reconcile Japan"
 #SOV_reconcile_japan_desc: "Our relations with Japan have always been troubled, but there are bigger fish to fry. By exploiting their desperate lack of natural resources, the Japanese could be led by the nose... Their anachronistic feudal regime is bound to fall soon anyway."
 SOV_claim_on_sinkiang: "聲索新疆"
 SOV_claim_on_sinkiang_desc: "在盛世才同志的統治下，新疆已經幾乎就是我們的傀儡國了。現在要做的就是官方確認一下……"
 SOV_claim_on_sinkiang_threat: "蘇聯聲索新疆"
 SOV_pan_slavic_rhetoric: "泛斯拉夫主義"
 SOV_pan_slavic_rhetoric_desc: "為了獻身世界革命，列寧同志在拋棄其俄羅斯和斯拉夫身份的路上走得太遠了。一定程度上的民族主義對我們有利，某種程度上的泛斯拉夫主義的復興對於我們拉近同其他斯拉夫國家的關係有幫助。"
 SOV_claims_on_baltic: "聲索波羅的海三國"
 SOV_claims_on_baltic_desc: "彼得大帝尋求西方入海口是正確的。波羅的海諸國是在革命之後失去的領土，理應重回蘇聯。"
 SOV_claim_bessarabia: "聲索比薩拉比亞領土"
 SOV_claim_bessarabia_desc: "對我們的經濟而言黑海甚至比波羅的海更重要。我們必須盡一切可能確保博斯普魯斯海峽和達達尼爾海峽的控制權。"
 SOV_claims_on_turkey: "聲索土耳其領土"
 SOV_claims_on_turkey_desc: "土耳其人不僅一直拒絕我們共同控制博斯普魯斯海峽的要求，而且也拒絕討論在東部邊境的任何調整。也許是時候給他們一個教訓了！"
 #SOV_baltic_security: "Baltic Security"
 #SOV_baltic_security_desc: "The Baltic is our front yard and must be protected at all costs. Karelia must be seized to give Leningrad a secure buffer zone, and the self-rule of Estonia is just ridiculous!"
 #SOV_claims_on_poland: "Claims on Poland"
 #SOV_claims_on_poland_desc: "The display of incompetence and embarrassment that was the Soviet-Polish war must be avenged and eastern Poland reintegrated into the USSR!"
 #SOV_demand_eastern_poland: "Demand Eastern Poland"
 #SOV_demand_eastern_poland_desc: "Having reasserted our right to Poland's eastern territories, we should make clear that they can only save themselves from another partition by handing them over peacefully."
 #SOV_offer_poland_protection: "Offer Poland Protection"
 #SOV_offer_poland_protection_desc: "Although we could simply seize eastern Poland, it would be much preferable if they joined our Comintern in the process. We would need to offer something in return for our claims, however. If we promise them eastern Germany, they might be interested."
 SOV_offer_poland_protection_tt: "§Y當蘇聯攻取之時，波蘭將會因該協議獲得其宣稱的地區。§!\n"
 SOV_great_purge: "大清洗"
 SOV_great_purge_bypass_tt: "托洛茨基成為了蘇維埃聯盟的領袖"
 SOV_great_purge_desc: "在我們的官員當中有一個危險的託派陰謀；甚至在最高級別的官員中也存在。雖然托洛茨基本人是否直接參與尚不清楚，但是他的威脅還是很大的。這可能導致蘇聯再次陷入內戰……除非我們準備殺幾隻雞給猴看。"
 SOV_great_purge_tt: "將舉行一系列§Y公審§!來清洗疑似託派的部長和指揮官。\n"
 SOV_great_purge_tt2: "大清洗的數量會影響§Y內戰§!的可能性並增強§H軍官被肅清§!的效果。\n不選擇這個國策則會導致§Y內戰§!，同時流亡海外的§Y列夫·托洛茨基§!有可能會迴歸。\n\n"
 SOV_permanent_revolution: "不斷之革命"
 SOV_permanent_revolution_tt: "托洛茨基回來了"
 SOV_permanent_revolution_tt2: "§Y托洛茨基§!得到了一個更好的領袖技能。"
 SOV_permanent_revolution_desc: "壓迫人民的煽動者已經死了！權力重新回到了人民的手中，如今所有人都能追尋自己的抱負，無需妥協。我們會不斷改變。不斷的革命是勝利的革命。"
 #SOV_rehabilitated_military: "Rehabilitated Military"
 #SOV_rehabilitated_military_desc: "With the taint of Trotskyism finally cleansed from the officer corps, it might be possible to allow the military some freedom from political interference again."
 #SOV_military_reorganization: "Military Reorganization"
 #SOV_military_reorganization_desc: "The Purge has not left the military in a good state. The new leadership is green and ineffective, and no work has been done to develop our doctrines. We must rectify this situation immediately!"
 #SOV_nkvd_primacy: "NKVD Primacy"
 #SOV_nkvd_primacy_desc: "The military has shown that it can never be trusted. Therefore, the NKVD will need to be expanded and given greater powers, with more political commissars to keep an eye on the officers."
 SOV_nkvd_divisions: "內務部隊"
 SOV_nkvd_divisions_desc: "應當撥給內務人民委員部一些部隊作為內務部隊，以保護鐵路和重要設施。"
 #SOV_lessons_of_war: "Lessons Of War"
 #SOV_lessons_of_war_desc: "With the experiences gained fighting limited wars, we should be able to make some breakthroughs in armored warfare, and perhaps even finally whip the depleted officer corps into shape!"
 #SOV_smersh: "SMERSH"
 #SOV_smersh_desc: "SMERSH, or 'Death to Spies', is a proposed counter-intelligence initiative that would serve a dual purpose; rooting out enemy spies and executing deserters and partisans within the ranks of the Red Army."
 SOV_smersh_tt: "§Y抵消政變的風險。§!\n"
 SOV_partisan_suppression: "鎮壓游擊"
 SOV_partisan_suppression_desc: "施密爾舒應當擴編，以便於更好的滲透和殘酷鎮壓佔領區的任何形式的游擊隊。"
 SOV_war_with_germany: "對德作戰"
 SOV_war_with_germany_desc: "德國的威脅正在持續增長。我們有能力也有必要消滅德軍，使他們屈服於他們的新主人。"
 SOV_war_with_germany_tt: "莫洛托夫-裡賓特里甫條約已經無效了"
 SOV_war_with_japan: "對日作戰"
 SOV_has_not_officers_purged_tt: "沒有民族精神§Y大清洗§!"
 SOV_war_with_japan_desc: "看來日本不打算退縮。唯一有效的威懾只能是戰爭。當紅軍把他們踩在腳下他們就知道後悔當初拒絕我們的要求了。"
 SOV_war_with_uk: "聯合王國戰爭"
 SOV_war_with_uk_desc: "英帝國主義從未尊重過我們。毫無疑問當他們拿下世界的其餘部分後就會把槍口對準蘇聯了。只有一種方法可以阻止他們的侵略擴張。那就是戰爭！"
 SOV_claim_on_the_straits: "聲索黑海出海口"
 SOV_claim_on_the_straits_desc: "從黑海到愛琴海的海峽是一個戰略要地。我們不能允許這片區域被外國勢力把持。為了確保紅海軍連為一體，我們必須拿下海峽。"
 SOV_ultimatum_to_greece: "對希臘最後通牒"
 SOV_ultimatum_to_greece_desc: "愛琴海群島是我們保障紅海軍自由行動所需的最後一塊戰略要地。希臘人現在受到各個方面的壓力，他們會放棄這一小塊領土避免全面戰爭的。"
 SOV_diversify_the_programme: "多元化進程"
 SOV_diversify_the_programme_desc: "在傳統戰爭領域我們已經在過去幾年鑽研許久，進步巨大。我們國家的科學家有能力發現新的作戰方法，使我們從中獲得巨大優勢。如果想讓他們有所成就，我們就得確保他們有最好的工作環境。"
 SOV_research_city_experiment: "科研城的實驗"
 SOV_research_city_experiment_desc: "我們的最重要的科學家之一庫爾恰托夫已經注意到，一千克鈾原子核裂變放出的能量相當於20,000噸TNT。我們必須在我們的敵人之前掌握這種力量來保障祖國的安全。"
 SOV_closed_city_network: "封閉的城市網"
 SOV_closed_city_network_desc: "我們需要建立一些封閉的城市，比我們的軍事基地有更多的空間。限制通行到這些城市可以讓我們的研究保密，同時又給科學家們足夠的空間做大型實驗。"
 strike_usa_focus: "襲擊美國！"
 strike_usa_focus_desc: "背信棄義的美國人讓我們任其宰割，控制我們的石油和其他緊缺資源的供給。他們的工業遠比我們的強大，所以要攻擊美國，就要一擊致命！我們可不能指望跟美國打贏一場長期戰爭……"
 chinese_puppet_focus: "傀儡中國"
 chinese_puppet_focus_desc: "也許是因為他們的領導人認為攘外必須安內，事實證明，中國人對我們畏戰如鼠。我們可以給他們提供保護，不受中共及軍閥的侵擾，使其成為大東亞共榮圈的一部分。"
 chinese_war_focus: "對華作戰"
 chinese_war_focus_desc: "盧溝橋事變證實中國人對合作不感興趣。隨著日益緊張的局勢威脅著隨之而來的停火，戰爭可能是給中華民族帶來秩序的唯一手段。"
 subdue_warlords_focus: "制服中國軍閥"
 subdue_warlords_focus_desc: "中國任由他們一度引以為傲的帝國被極端分子和軍閥撕裂。但是大日本帝國不容許這種分裂存在，即使其附屬國也涉入其中。"
 oust_germans_focus: "破壞中德合作"
 oust_germans_focus_desc: "自二十年代起德國軍事顧問就在中國給國民黨提供關鍵支持。這事不能再被容忍下去了。在我們的權利範圍內，我們要求所有德國對中國的支持立即撤出。現在是時候叫德國站隊了。"
 found_own_faction_focus: "建立我們的陣營"
 found_own_faction_focus_desc: "我們已經朝著大東亞共榮圈努力進發。為了確保最終的勝利，日本必須足夠強大，獨領亞洲乃至世界風騷。"
 axis_leanings_focus: "加入軸心國"
 axis_leanings_focus_desc: "我們和在歐洲建立權力根基的新德國有很多共同利益。跟他們成為盟友能給我們強力的幫助，而且他們還足夠遙遠而不會威脅到我們在亞洲的統治。"
 subvert_india_focus: "印度國民軍"
 subvert_india_focus_desc: "如果英國人對我們建設大日本帝國的努力說三道四，我們會讓他們發現自己的帝國已經搖搖欲墜。印度戰俘和海外印度人將會形成足以推翻英屬印度統治的運動基礎。"
 jap_improved_sprit_focus: "強化國家意志"
 jap_improved_sprit_focus_desc: "民族自豪和好戰熱情激勵了每一位皇民，這驅使著他們達到為國獻身的新高度！"
 befriend_siam_focus: "對暹羅示好"
 befriend_siam_focus_desc: "暹羅免於歐洲殖民之災厄，亦不習慣於成為他國附屬。我們不必征服這個國家，而是應該說服其保持與我們合作的狀態。"
 army_primancy_focus: "陸軍為主"
 army_primancy_focus_desc: "作為兩大軍種之一，帝國陸軍真稱得上是帝國的得力左膀右臂！它可以征服並控制大片土地，這比海軍的小小貢獻大多了。通過承認這一簡單的、不言自明的事實並投入更多資源到陸軍，我們將獲得無限的可能。"
 JAP_army_primancy_focus_bypass_tt: "本土沒有足夠的建築位可以用於建造§Y軍用工廠§!。"
 jap_sia_love: "日本-暹羅外交"
 jap_sia_love_desc: "日本一直專注於改善與暹羅的關係。"
 navy_primancy_focus: "海軍為主"
 JAP_navy_primancy_focus_bypass_tt: "本土沒有足夠的建築位可以用於建造§Y海軍船塢§!。"
 navy_primancy_focus_desc: "作為兩大軍種之一，帝國海軍真稱得上是帝國的得力左膀右臂！它可以征服並控制大片海域，這比陸軍的小小貢獻大多了。通過承認這一簡單的、不言自明的事實並投入更多資源到海軍，我們將獲得無限的可能。"
 army_innovations_focus: "陸軍改革"
 army_innovations_focus_desc: "現在陸軍已經被認可，給了帝國最重要的貢獻，我們應當投入更多資源研究陸軍學說。"
 army_air_innovations_focus: "陸航改革"
 army_air_innovations_focus_desc: "空軍的首要任務是支援我們引以為豪的帝國陸軍！"
 army_motorization_focus: "陸軍摩托化"
 army_motorization_focus_desc: "更加專注摩托化可以增加步兵投入戰場的速度，至少是在較好的道路上。"
 air_base_expansion_focus: "空軍基地擴建"
 air_base_expansion_focus_desc: "為了更好的支援帝國陸軍，空軍需要更大的空軍基地。"
 armor_innovations_focus: "裝甲部隊改革"
 armor_innovations_focus_desc: "隨著帝國陸軍的興起，一些將軍提議我們可以投資一些現代裝甲載具。"
 naval_innovations_focus: "海軍改革"
 naval_innovations_focus_desc: "現在海軍已經被認可，給了帝國最重要的貢獻，我們應當投入更多資源研究新型船隻的設計。"
 naval_air_innovations_focus: "海航改革"
 naval_air_innovations_focus_desc: "空軍的主要任務必須是支援我們引以為傲的海軍！"
 convoy_protection_focus: "運輸護航"
 convoy_protection_focus_desc: "儘管這是一項懦弱而且無恥的策略，敵軍還是很可能會襲擊那些在我們的帝國內運輸資源和補給的商船。以防萬一，我們必須研究如何更好地保護這些船隻。"
 advanced_torpedoes_focus: "先進魚雷"
 advanced_torpedoes_focus_desc: "相較以前的型號，在推進裝置中使用壓縮氧氣而非壓縮空氣的魚雷有著更長的射程，並能夠攜帶更大的彈頭。"
 shbb_focus: "超重戰列艦"
 shbb_focus_desc: "就目前而言，我們不太可能造出比英美更多的戰列艦——但是我們似乎也不必如此。作為替代，造出比西方基於華盛頓海軍協定建造的條約艦更大的戰列艦似乎是一個更合理的選擇。"
 naval_base_focus: "擴建海軍基地"
 naval_base_focus_desc: "海軍的擴張需要更多的海軍基地。"
 carrier_focus: "重視航母"
 carrier_focus_desc: "日本需要一支強大的海軍，而航空母艦必將成為我們艦隊力量的核心。很快，我們的敵人就會發現：戰列艦的時代正在迎來終結！"
 battleship_focus: "重視戰列艦"
 battleship_focus_desc: "日本需要一支強大的海軍，而戰列艦必將成為我們艦隊力量的核心。讓其他國家在未經戰火洗禮的航空母艦上浪費錢財去吧，唯有戰列艦能夠統治海洋！"
 spiritual_mobilization_focus: "國民精神總動員"
 spiritual_mobilization_focus_desc: "不僅僅是我們的士兵，我們的所有國民都需要在精神上做好戰爭的準備。為了這個目的，所有的民族主義者都被集中到了國民精神動員大會上來宣揚愛國主義、支持政府。"
 warrior_traditions_focus: "武士傳統"
 warrior_traditions_focus_desc: "縱觀歷史，日本保留了武士階級的一套獨特的傳統。不論階級高低，每個軍人都應在心中復活武士精神之魂，並將之良久珍視。"
 divine_wind_focus: "神風特攻"
 divine_wind_focus_desc: "勇敢面對可能的死亡是對每一個軍人的要求，但我們的人民必須更進一步，哪怕是十死無生也要時刻準備為天皇陛下和大日本帝國捐軀。"
 imperial_glory_focus: "帝國榮耀"
 imperial_glory_focus_effect: "允許建造§H橫須賀MXY7 櫻花§!"
 imperial_glory_focus_desc: "作為一支特攻隊，神風突擊隊將自殺式攻擊由最後時刻的突發奇想變作了既定的教條。在新式飛機——一種有人駕駛的飛彈——的協助下，這種攻擊將不可阻擋。"
 student_movement_focus: "學生運動"
 student_movement_focus_desc: "文部省在精神動員中的作用不可或缺，而讓教育者與學生會支持國家將能夠建立一個可持續的軍事化導向教育體系。"
 extra_tech_focus: "額外研究項目"
 synth_oil_focus: "合成油料"
 synth_oil_focus_desc: "我們自己的石油產出很有限，而進口石油使得我們不得不受外國利益的擺佈。最為安全的解決辦法是完善我們擁有的油料合成技術。"
 JAP_synth_oil_focus_tt: "工業企業增加：出光興產"
 secret_weapon_focus: "先進武器"
 secret_weapon_focus_desc: "作為一個海洋帝國，我們必須時刻站在海軍研究的最前沿，但遠程火箭也不壞。"
 industrial_effort_focus: "厲行節約"
 industrial_effort_focus_desc: "每一個天皇子民都必須為大日本帝國的利益作出犧牲。"
 industrial_effort_focus2: "重視工業"
 industrial_effort_focus2_desc: "日本剛剛完成工業化，暫且無法與西方國家的強大相比較。我們必須採取措施縮小與他們之間的差距。"
 infra_effort_focus: "重視基建"
 infra_effort_focus_desc: "在我們這樣一個多山的國家建設基礎設施並非易事，但我們還是必須繼續努力。"
 fortress_japan_focus: "本土決戰"
 fortress_japan_focus_desc: "一旦我們的敵人擊垮了我們的艦隊，我們的防禦工事將使得任何企圖侵略我們的國家付出無法承受的代價。"
 crypto_bomb_focus: "密碼炸彈"
 crypto_bomb_focus_desc: "波蘭人正在開發一個名為“密碼炸彈”的絕妙機器，它能夠用來破譯德國的恩尼格碼密碼機。我們可以提供資金，在布萊切利園中繼續這項研究。"
 tizard_mission_focus: "蒂澤德代表團"
 tizard_mission_focus_desc: "我們在技術研究方面完成了許多突破，但由於我們在資源和生產能力上的缺失而無法進一步拓展。亨利·蒂澤德希望率領一支代表團與美國商談一個技術共享協議。"
 maud_focus: "MAUD委員會"
 maud_focus_desc: "“核裂變軍事應用”委員會相信，使用鈾來實現不可控裂變反應，以此來製造一個威力令人難以置信的炸彈，在理論上是可能的。然而，僅靠我們自己恐怕無法及時地完成這項技術。我們需要跟美國人談談。"
 general_rearmament_focus: "常規的軍備重整"
 general_rearmament_focus_desc: "[Root.GetGeneralRearmamentDesc]"
 ENG_GENERAL_REARMAMENT_DESC_HISTORICAL: "另一場世界大戰似乎已無法避免。挑起者不是希特勒就是日本天皇，甚至是蘇聯……民意的轉向已經足以讓我們開始一個常規的軍備重整計劃。"
 ENG_GENERAL_REARMAMENT_DESC_AHISTORICAL: "我們的前任過多地忽視了我們軍隊的狀況。我們必須啟動一項全面的重整軍備項目，以解決我們武裝部隊嚴重的缺陷。"
 air_defense_focus: "空軍防禦"
 air_defense_focus_tt: "將§Y東盎格利亞§!，§Y薩塞克斯§!和§Y西南英格蘭§!的§Y防空陣地§!提升至最高等級"
 air_defense_focus_bypass_tt: "沒有足夠的建築位可以用於建造§Y防空陣地§!"
 air_defense_focus_desc: "無需多想我們的敵人會從哪裡入侵，我們必須用大量的防空炮臺把海岸線保護起來。"
 radar_focus: "雷達"
 radar_focus_desc: "探測敵軍轟炸機的能力對戰爭的進程至關重要。我們應該不惜一切進一步開發雷達技術，並沿海岸線建立一個監測站網絡。"
 royal_ordinance_focus: "[Root.GetRoyalOrdnanceFactoriesName]"
 royal_ordinance_focus_desc: "[Root.GetRoyalOrdnanceFactoriesDesc]"
 ENG_ROYAL_ORDNANCE_FACTORIES_NAME_HISTORICAL: "皇家兵工廠"
 ENG_ROYAL_ORDNANCE_FACTORIES_NAME_COMMUNIST: "革命兵工廠"
 ENG_ROYAL_ORDNANCE_FACTORIES_DESC_HISTORICAL: "很不幸，伍爾維奇的皇家兵工廠生產的軍需品和輕武器不足以滿足我們的需求。我們需要在全國組建大量的工廠，尤其是相對安全的地區。"
 ENG_ROYAL_ORDNANCE_FACTORIES_DESC_COMMUNIST: "很不幸，伍爾維奇的革命兵工廠生產的軍需品和輕武器不足以滿足我們的需求。我們需要在全國組建大量的工廠，尤其是相對安全的地區。"
 shadow_scheme_focus: "影子計劃"
 shadow_scheme_focus_desc: "航空部提出了一個天才的構想，能夠將民用工廠轉為軍用的過程變得更容易。在給各個門類的關鍵企業提供了足夠的津貼和貸款後，他們的工廠能夠提前進行擴大和改造，使得其轉變至軍事用途的過渡更為平順。"
 shadow_scheme_focus_tt: "當進入戰爭時，在兩個地區給予總計§G4§!個建築位和§Y4座軍用工廠§!。\n"
 uk_small_arms_focus: "伯明翰輕武器公司"
 uk_small_arms_focus_desc: "[Root.GetBSACompanyDesc]"
 ENG_BSA_COMPANY_DESC_HISTORICAL: "皇家兵工廠無力生產足夠的輕武器，但一如我們在一戰中做的那樣，我們可以與伯明翰輕武器公司簽訂單，增加他們的生產量。"
 ENG_BSA_COMPANY_DESC_COMMUNIST: "革命兵工廠無力生產足夠的輕武器，但一如我們在一戰中做的那樣，我們可以與伯明翰輕武器公司簽訂單，增加他們的生產量。"
 UK_secret_focus: "秘密武器"
 UK_secret_focus_desc: "我們現在已經掌握了必要的知識和基礎設施，能夠集中精力去開發許多種過去僅存在於科幻小說中的秘密武器。"
 air_rearmament_focus: "重整空軍軍備"
 air_rearmament_focus_desc: "[Root.GetAirRearmamentDesc]"
 ENG_AIR_REARMAMENT_DESC_HISTORICAL: "在任何一場同大陸上的敵人進行的戰爭中，皇家空軍都被證明是勝利的關鍵。首先，我們必須確保我們的空軍基地能夠支持我們的整備計劃！"
 ENG_AIR_REARMAMENT_DESC_COMMUNIST: "在任何一場同大陸上的敵人進行的戰爭中，人民空軍都被證明是勝利的關鍵。首先，我們必須確保我們的空軍基地能夠支持我們的整備計劃！"
 fighter_command_focus: "戰鬥機司令部"
 fighter_command_focus_desc: "我們的第一要務必然是控制我們自己的天空！很難找到一個比戰鬥機的開發更加重要的軍事研究領域。"
 bomber_command_focus: "轟炸機司令部"
 bomber_command_focus_desc: "就像朱里奧·杜黑經常說的那樣：“轟炸機不可阻擋！”儘管雷達技術和防空火炮取得了一些發展，我們還是應當重點發展更好的轟炸機。"
 coastal_command_focus: "沿海司令部"
 coastal_command_focus_desc: "[Root.GetCoastalCommandDesc]"
 ENG_COASTAL_COMMAND_DESC_HISTORICAL: "我們的工業依賴於大量的資源，這些資源都是經船隊由帝國轄下的各個邊遠地區運至不列顛的。我們的運輸船隊是我們的生命線，必須由皇家海軍和皇家空軍戮力合作，共同保護。我們必須組建一個專門的空軍編隊來保護通往我們港口的航線！"
 ENG_COASTAL_COMMAND_DESC_COMMUNIST: "我們的工業依賴於大量的資源，這些資源都是經船隊由帝國轄下的各個邊遠地區運至不列顛的。我們的運輸船隊是我們的生命線，必須由工人解放海軍和人民空軍戮力合作，共同保護。我們必須組建一個專門的空軍編隊來保護通往我們港口的航線！"
 aircraft_production_focus: "飛機生產集團"
 aircraft_production_focus_desc: "飛機的生產是我們的重中之重。我們應當組建倫敦飛機生產集團，以此來管理和整合所有與飛機相關的產業。"
 uk_jet_focus: "噴氣式飛機"
 uk_jet_focus_desc: "看起來，噴氣式引擎勢必將取代螺旋引擎，成為飛機的動力源。它的潛力很大，我們決不能容忍英國在這個重要的研究領域上落後。"
 naval_rearmament_focus: "重整海軍軍備"
 naval_rearmament_focus_desc: "[Root.GetNavalRearmamentDesc]"
 ENG_NAVAL_REARMAMENT_DESC_HISTORICAL: "儘管我們已經通過第二次倫敦海軍協定去盡力阻止海軍軍備競賽了，然而，即使是當初的簽約國，大多數也已無視了這個條約。皇家海軍必須時刻保持全球霸權，我們必須一直確保擁有世界上最大的海軍。"
 ENG_NAVAL_REARMAMENT_DESC_COMMUNIST: "儘管我們已經通過第二次倫敦海軍協定去盡力阻止海軍軍備競賽了，然而，即使是當初的簽約國，大多數也已無視了這個條約。工人解放海軍必須時刻保持全球霸權，我們必須一直確保擁有世界上最大的海軍。"
 uk_destroyer_focus: "重視驅逐艦"
 uk_destroyer_focus_desc: "現代戰列艦令人驚歎，但我們決不能因此而忽略小小的驅逐艦在航運保護中所起到的關鍵作用。"
 uk_convoy_focus: "重視護航運輸"
 uk_convoy_focus_desc: "無需贅述，我們的航運線即是我們的生命線。我們必須盡一切努力去保護運輸船隊，並儘快補充損失的船舶。"
 uk_waves_focus: "不列顛統治海洋"
 uk_waves_focus_desc: "[Root.GetBritanniaRulesTheWavesDesc]"
 ENG_BRITANNIA_RULES_THE_WAVES_DESC_HISTORICAL: "在皇家海軍的龐大陰影之下，其他國家的海軍不得不盡力提出新的學說以補償軍力上的不足。我們決不能滋生自滿，不能僅僅依靠單體艦船的質量與總數。"
 ENG_BRITANNIA_RULES_THE_WAVES_DESC_COMMUNIST: "在工人解放海軍的龐大陰影之下，其他國家的海軍不得不盡力提出新的學說以補償軍力上的不足。我們決不能滋生自滿，不能僅僅依靠單體艦船的質量與總數。"
 uk_carrier_focus: "重視航母"
 uk_carrier_focus_desc: "在海軍學說的討論中，有關戰列艦的存續方面有著一個巨大的分歧。一部分人主張現代空軍將成為凌駕於海軍之上的統治力量，因此航空母艦將取代戰列艦成為新的海洋之王。"
 uk_spain_focus: "威脅西班牙"
 uk_spain_focus_desc: "西班牙人比大多數國家更瞭解皇家海軍的威力，但是，可能些許暗示沒什麼不合適的……"
 uk_battleship_focus: "重視戰列艦"
 uk_battleship_focus_desc: "儘管理論學家們在為海軍和空軍的優先度而爭論不休，但是沒有人希望一艘戰列艦上的火炮瞄準他們的宅邸。就算航母的擁躉們最終被證明是正確的，戰列艦也依舊將繼續統治海洋很多年。"
 uk_turkey_focus: "威脅土耳其"
 uk_turkey_focus_desc: "他們不需要愛我們，但是土耳其小子必須足夠了解我們的戰列艦的可怕之處……"
 uk_amphibious_focus: "兩棲作戰"
 uk_amphibious_focus_desc: "統治海洋固然很好，但有時你還是要從實踐中吸取教訓。我們決不能忽視在敵方領土上進行登陸作戰的能力。"
 singapore_focus: "新加坡戰略"
 singapore_focus_desc: "新加坡應該繼續作為我們在東方的重要的海軍基地。香港或許會被日本攻陷，但新加坡必須堅守，直到我們的主力艦隊抵達並痛擊敵軍。"
 sp_landward_forts_focus: "岸防工事"
 sp_landward_forts_focus_desc: "當前我們在新加坡島的防衛很不完善。我們必須集中全力去增強那裡的防禦工事！"
 peninsular_focus: "半島戰爭"
 peninsular_focus_desc: "在敵人抵達新加坡之前，我們應該搶先佔據馬來半島並延緩敵軍南下的腳步。"
 hongkong_focus: "控制香港"
 hongkong_focus_desc: "新加坡戰略已經過時了。我們的計劃應該更為大膽，立足一個更加靠近日本的基地。只要有足夠的防禦工事和輔助設施，香港將能夠起到非常完美的作用！"
 hk_landward_forts_focus: "岸防工事"
 hk_landward_forts_focus_desc: "為了抵禦來自大陸地區的進攻，香港將不得不轉變為一座要塞城市。"
 hk_air_focus: "對空防禦"
 hk_air_focus_desc: "我們必須大幅度增加並改良在香港的防空火炮陣地。"
 uk_embargo_focus: "禁運政策"
 uk_embargo_focus_desc: "不管是紅色的獨裁者還是褐色的獨裁者，最好的擊敗他們的方式就是簡單的讓他們得不到發動戰爭所必須的資源，解決這個問題只需要恫嚇下和他們有業務關係的銀行和大公司就行……"
 uk_sanction_italy_focus: "制裁意大利"
 uk_sanction_italy_focus_desc: "儘管聽起來荒謬無比，墨索里尼還是有可能為了實現其建立一個嶄新的羅馬帝國的幻想而進攻我們，我們應該在戰爭到來前盡其所能的阻止其實現。"
 uk_sanction_japan_focus: "制裁日本"
 uk_sanction_japan_focus_desc: "日本還在繼續建立他們所謂的“大東亞共榮圈”，當然這個共榮圈必須在他們的霸權領導下。大英帝國和其他西方勢力的殖民地是其主要絆腳石，必須阻止日本人獲得他們所需的資源。"
 uk_burma_focus: "滇緬公路"
 uk_burma_focus_desc: "我們應該建設公路及配套基礎設施來幫助中國抗擊日本侵略者——這條公路應該連接緬甸和中國使補給可以在通過陸路運達的同時避開日本人的劫掠。"
 uk_scandinavian_focus: "干涉斯堪的納維亞"
 uk_scandinavian_focus_desc: "要不是因為瑞典的鋼鐵出口，斯堪的納維亞的戰略價值並不算大，我們必須向瑞典和挪威施壓以保證德國無法得到這些重要資源，如果他們拒絕，那麼我們可能需要為入侵做好準備……"
 uk_iraq_focus: "控制伊拉克"
 uk_iraq_focus_desc: "我們在1932年保證了伊拉克獨立，但是考慮到現如今的全球局勢，那或許是一個錯誤。我們絕對不能讓敵人得到伊拉克的石油……"
 uk_iran_focus: "控制伊朗"
 uk_iran_focus_desc: "伊朗不僅有決不能讓敵人獲得的豐富石油；它還是連接印度，中東和蘇聯的戰略要地。"
 uk_free_india_focus: "印度獨立"
 uk_free_india_focus_desc: "日本正在印度煽動叛亂甚至組織了一支由印度人組成的“印度國民軍”。這種情況如果不加以阻止可能會變的十分危急，我們要麼在短時間內擊敗日本，要麼向印度承諾同意其在幾年後獨立。"
 uk_colonial_focus: "鼓勵殖民地精英"
 uk_colonial_focus_desc: "我們廣大的帝國裡擁有著許多世界上最傑出的大腦，但是帝國遼闊的疆域使他們中的大多數不能聚在一起。如果鼓勵他們一同為我們最重要的計劃工作，我們就可以更快的達到目的。"
 uk_asia_focus: "強化東亞"
 uk_asia_focus_desc: "我們在東方很多古老的殖民地處於連綿內戰和當地國家野心的威脅，我們決不能忽略這些已經存在的前哨，並且應該持續開發這些區域以鞏固我們的全球影響力。"
 uk_china_focus: "影響中國"
 uk_china_focus_desc: "儘管中國宣稱自己是我們殖民政策的敵人，但是他們卻擁有太多的敵人而沒有幾個盟友。如果我們向其伸出橄欖枝，他們有可能願意轉變他們的政策。"
 uk_commonwealth_focus: "英聯邦關係"
 uk_commonwealth_focus_desc: "基於對皇室的效忠而團結在一起的英聯邦成員國是我們在一場全球衝突中最先能依賴的盟友。保證我們在這些國家的外交影響至關重要。"
 uk_india_focus: "開發印度"
 uk_india_focus_desc: "印度殖民地的地位不論在國內還是海外仍然充滿爭議，但是不論將來發生什麼，現階段的首要任務都是強化當地的工業能力。"
 northern_expansion_focus: "向北擴張"
 northern_expansion_focus_desc: "向北擴張的策略由帝國陸軍支持，認為蘇聯對日本的野心威脅最大，現在歐洲局勢緊張，一個絕佳的攻擊俄國遠東地區的時機浮現了出來。我們必須儘快發動攻擊。"
 southern_expansion_focus: "向南擴張"
 southern_expansion_focus_tt: "選擇後會添加與§Y蘇聯§!的§Y互不侵犯條約§!\n"
 southern_expansion_focus_desc: "向南擴張的策略由帝國海軍支持，認為日本必須向南擴張進入南亞和太平洋。歐洲列強富裕的殖民地擁有對日本工業至關重要的原材料，但是這條道路會導致與美利堅合眾國的衝突。先發制人的打擊正在進行中。"
 new_ideas: "新企業/顧問可用。\n"
 available_political_advisor: "§Y政治顧問§!§G可用§!：\n"
