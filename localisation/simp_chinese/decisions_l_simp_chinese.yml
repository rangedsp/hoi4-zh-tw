 FRA_communist_civil_war_decision_desc: "激進政治運動愈發劇烈的騷動正變得難以平息——我們最終必須以某種方式處理它。"
 FRA_fascist_civil_war_decision: "法西斯叛亂將近"
 FRA_fascist_civil_war_decision_desc: "事實證明，持續高漲的民粹主義思潮實在是無法阻擋，不可避免之事永無法避免。"
 ETH_defeat_italy: "擊敗殖民入侵者"
 ETH_defeat_italy_category: "第二次意埃戰爭"
 ETH_defeat_italy_category_desc: "意大利再度襲來，試圖將埃塞俄比亞徹底納入其殖民統治。但既然我們上次已經擊敗了這些入侵者，那麼只要這次將其徹底逐出國境，我們就能再次擊敗他們！"
 seize_some_trains_woo: "徵用民用火車"
 seize_some_trains_woo_desc: "商業鐵路公司控制著我國基礎設施。隨著戰爭的臨近，我們完全有權因國家需要而將其徵收。"
 random_general_monarchy_tt: "一個隨機[FROM.GetAdjective]將軍將獲得秘密君主制支持者特質。"
