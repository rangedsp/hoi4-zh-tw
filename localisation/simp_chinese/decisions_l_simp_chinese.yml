 war_propaganda_casualties: "英雄主義宣傳"
 war_propaganda_casualties_desc: "戰死者與日俱增，但我們仍得告訴人民：鋼鐵唯有歷戰方能煉成。"
 war_propaganda_convoys: "鼓勵節儉"
 war_propaganda_convoys_desc: "即使是平民也能幫助贏得戰爭——在利用原材料時用心節省，每克鋼材對戰爭的價值都可以翻倍。"
 war_propaganda_bombing: "提振精神"
 war_propaganda_bombing_desc: "儘管轟炸連連，我們勇敢的工人仍然奮勇前進。正是憑藉這種精神，我們才會取得勝利。"
 war_support_during_war: "戰爭支持度"
