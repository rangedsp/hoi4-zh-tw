 FIN_pressure_government_cd_tt: "\n我們每隔§Y[?FIN_pressure_government_cd]§!日才能對同一個國家的政府施壓一次。"
 FIN_coup_preparations: "政變在即"
 FIN_coup_preparations_desc: "如果我們不拿出十二分的精力予以確保，政變就不可能成功。妥善準備乃是成功的關鍵。"
 FIN_appeal_to_the_middle_class: "吸引中產階級"
 FIN_appeal_to_the_middle_class_desc: "芬蘭右翼組織的主要支持者來自中產階級。我們必須呼籲富裕農民、受過教育的資產階級、公務員、神職人員和大學生加入我們的運動，並在民眾中傳播我們的原則和意識形態。"
 FIN_appeal_to_the_middle_class_dec_tt: "我方獲得的總領土和軍隊§G+10%§!。"
 FIN_secure_the_military: "控制軍隊"
 FIN_secure_the_military_desc: "歷史證明，軍方總是任何新政變者的有益盟友。因此，在我們試圖發動政變之前，確保得到他們的支持至關重要。"
 FIN_secure_the_military_dec_tt: "我方獲得的總領土和軍隊§G+10%§!，同時保留所有軍隊指揮官。"
 FIN_purchase_german_equipment: "採購德國裝備"
 FIN_purchase_german_equipment_desc: "德國有大量裝備在倉庫裡限制。我們應該索要一些，畢竟我國可是他們有用的盟國。"
 FIN_the_last_kinship_war: "最後的援親戰爭"
 FIN_the_last_kinship_war_desc: "在重振援助親屬民族戰爭精神之後，我們現在可以開始準備將我們的同胞從外國壓迫的魔掌中解放出來。"
 FIN_stir_anti_soviet_sentiment_in_karelia: "煽動卡累利阿反蘇情緒"
 FIN_stir_anti_soviet_sentiment_in_karelia_desc: "卡累利阿有很多人不同意蘇聯政府的政策，我們可以利用這一點在該地區挑起事端。"
 FIN_instigate_a_new_karelian_uprising: "策動新一場卡累利阿起義"
 FIN_instigate_a_new_karelian_uprising_desc: "我們應該重拾援助親屬民族戰爭（Heimosodat）的精神，努力策動一場新的卡累利阿起義，讓卡累利阿人民去追求他們所渴望的獨立。"
 FIN_finno_soviet_kinship_war: "芬蘭-[ROOT.GetAdjective]援親戰爭"
 FIN_finno_soviet_kinship_war_desc: "在俄羅斯內戰期間，芬蘭打了所謂的“援親戰爭”，入侵我們的國家，搶走我們的土地。現在，他們又開始了同樣的戰爭。"
 FIN_crush_the_karelian_insurrection: "粉碎卡累利阿叛亂"
 FIN_crush_the_karelian_insurrection_desc: "現在，我們已經集結了足夠的武器和士兵來鎮壓卡累利阿的地區主義者起義。開始行動吧。"
 FIN_crush_the_karelian_insurrection_decision_cost_ie_cp_pp: "£infantry_equipment_text_icon §Y1500§! £command_power §Y30§! £pol_power §Y70§!"
 FIN_crush_the_karelian_insurrection_decision_cost_ie_cp_pp_blocked: "£infantry_equipment_text_icon §R1500§! £command_power §R30§! £pol_power §R70§!"
 FIN_crush_the_karelian_insurrection_decision_cost_ie_cp_pp_tooltip: "執行此決議花費£infantry_equipment_text_icon §Y1500§! £command_power §Y30§! £pol_power §Y70§!"
 FIN_crush_the_karelian_insurrection_tt: "\n[FIN.GetFlag]§Y[FIN.GetNameDefCap]§!§G將無法再煽動卡累利阿起義§!。\n"
 FIN_confederated_finno_russian_republics_category: "芬俄共和國聯盟"
 FIN_confederated_finno_russian_republics_category_desc: "芬族人的足跡遍佈古往今來的俄羅斯領土，譬如芬蘭人、愛沙尼亞人、卡累利阿人、維普斯人、伊霍爾人、沃茨人、塞託人、沃羅人和英格利亞人。我們應該建立一個能夠吸引這些民族，乃至更多民族的聯盟。"
 FIN_integrate_karelia_puppet: "整合[FROM.GetName]為共和國"
 FIN_integrate_karelia_puppet_desc: "是時候把卡累利阿建成一個新的共和國了，我們可以把它置於我們的羽翼之下。"
 FIN_integrate_karelia_states: "整合[FROM.GetName]為卡累利阿共和國的一部分"
 FIN_integrate_karelia_states_desc: "卡累利阿共和國仍未涵蓋卡累利阿人居住的所有土地。通過將[FROM.GetName]納入其中，我們可以嘗試解決這一問題。"
 FIN_integrate_karelia_additional_states: "將[FROM.GetName]轉交給卡累利阿共和國"
 FIN_integrate_karelia_additional_states_desc: "卡累利阿共和國仍未涵蓋卡累利阿人居住的所有土地。通過將[FROM.GetName]納入其中，我們可以嘗試解決這一問題。"
 FIN_integrate_veps_states: "整合[FROM.GetName]為共和國"
 FIN_integrate_veps_states_desc: "韋普斯人從未有過自己的國家，但現在是時候讓他們獨立建國了。"
 FIN_integrate_veps_additional_states: "整合[FROM.GetName]為共和國"
 FIN_integrate_veps_additional_states_desc: "還有更多地區可以併入我們新成立的韋普斯共和國，[FROM.GetName]就是其中之一。"
 FIN_integrate_ingria_states: "整合[FROM.GetName]為英格里亞共和國"
 FIN_integrate_ingria_states_desc: "還有更多地區可以併入我們新成立的英格利亞共和國，[FROM.GetName]就是其中之一。"
 FIN_integrate_ingria_additional_states: "將[FROM.GetName]轉交給英格里亞共和國"
 FIN_integrate_ingria_additional_states_desc: "還有更多地區可以併入我們新成立的英格利亞共和國，[FROM.GetName]就是其中之一。"
 FIN_integrate_leningrad: "將[FROM.GetName]設為英格里亞共和國的首都"
 FIN_integrate_leningrad_desc: "[195.GetName]可能以俄族為主，但在英格利亞共和國的計劃面前，無所謂，無所畏懼。"
 FIN_request_an_armistice_with_moscow: "請求與莫斯科方面停戰"
 FIN_request_to_switch_sides_in_the_war: "停戰換跳槽"
