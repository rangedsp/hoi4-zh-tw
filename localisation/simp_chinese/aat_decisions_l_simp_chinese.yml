 DEN_seek_an_alliance: "尋求聯盟"
 DEN_nordic_security_category: "保衛北方戰線"
 DEN_nordic_security_category_desc: "我們必須保護我們的北歐兄弟，確保北方戰線的安全，這樣我們才能將注意力轉移到更緊迫的事情上。"
 DEN_invite_nordic_countries: "邀請[FROM.GetNameDef]加入我們的陣營"
 DEN_invade_nordic_countries: "保護[FROM.GetAdjective]人民"
