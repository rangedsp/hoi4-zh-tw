l_simp_chinese:
 #### ICELAND ####
 ICE_drilling_for_oil_off_shore: "開採近海油氣"
 ICE_drilling_for_oil_off_shore_repeat_tt: "§Y180§!日後可再次執行此決議"
 no_more_oil_tt: "§R已找到所有石油§!"
 no_more_oil_flag: "油田已枯竭"
 ICE_improve_the_viking_spirit: "尊崇先祖"
 ICE_already_improving_the_viking_spirit_flag: "已改進維京之魂"
 ICE_a_new_yggdrasill: "現代世界樹"
 ICE_a_new_yggdrasill_desc: "如今人們已熟知他們偉大的先祖，我們應該努力建設大規模工程並改造冰島全島，這樣它才可能與傳說中的米德加爾特和世界樹相形媲美。"
 ICE_has_best_spirit_idea: "我們已盡己所能尊崇先祖"
 ICE_the_wisdom_of_odin: "奧丁之智"
 ICE_the_wisdom_of_odin_desc: "奧丁的神職涵蓋智慧、治療、死亡、王權、恐嚇、知識、戰爭、戰鬥、勝利、巫術、詩歌、狂暴和盧恩字母。當他以自己的眼睛為貢，飲用密米爾之泉後，他就被授予了現在、將來和過去的無盡知識。我們應該嘗試踐行他的精神，並且懷揣他的遺產邁向未來！"
 ICE_the_might_of_thor: "托爾之力"
 ICE_the_might_of_thor_desc: "托爾是雷電、力量與人類保護之神。當他揮舞妙爾尼爾巨錘擊中雲朵時，便會掀起狂風暴雨。我們的軍隊應當用同樣的雷電與恐懼打擊敵人！"
 ICE_the_guidance_of_aegir_and_ran: "埃吉爾與瀾之引"
 ICE_the_guidance_of_aegir_and_ran_desc: "在海洋的化身瀾和她的約頓丈夫埃吉爾的指引下，我們的艦船將主宰北海。"
 ICE_the_ferocity_of_the_fenrir: "芬裡厄之戾"
 ICE_the_ferocity_of_the_fenrir_desc: "與赫爾和世界蛇一樣，芬裡厄是洛基與女巨人安格爾博達之子。儘管它力大無窮又兇殘至極，它卻未能完成在諸神黃昏之時殺死奧丁的宿命。為了在戰場和精神上都擊敗敵人，我們的士兵必須踐行它的精神。"
 ICE_the_fertility_of_freya: "芙蕾雅之育"
 ICE_the_fertility_of_freya_desc: "芙蕾雅是愛情、美貌與生育等事務之女神。我們應該以她的名義確保我們的人民擁有能成長為偉大戰士的子女。"
 ICE_a_monument_to_leif: "為萊夫·埃裡克松樹碑"
 ICE_a_monument_to_leif_desc: "南方人用“克里斯托弗·哥倫布是第一個發現美洲的歐洲人”的神話矇蔽世人，但毫無疑問的是，我們偉大的祖先萊夫·埃裡克松才前無古人的首創者。為了向他表達敬意，我們應該在征服文蘭時為他樹立一座紀念碑。"
 ICE_infiltrate_the_british_isles_category: "滲透不列顛群島"
 ICE_infiltrate_the_british_isles_category_desc: "工人革命需要傳播。而最完美的起點就是不列顛群島受壓迫的工人。反帝國主義和反資本主義的情緒可以而且應該得到充分的利用。"
 ICE_incite_communist_uprising_scotland: "煽動蘇格蘭起義"
 ICE_incite_communist_uprising_scotland_desc: "只需要一點小小的推動，我們就能讓蘇格蘭工人們在[121.GetCapitalVictoryPointName]揭竿而起並宣佈自[121.owner.capital.GetCapitalVictoryPointName]政府獨立。"
 ICE_uprising_scotland_tt: "§Y[121.owner.GetName]§!：[121.owner.GetCommunistParty]支持度大於[?ICE.communism_support_needed|%Y0]"
 ICE_incite_communist_uprising_scotland_tt: "§Y[SCO.GetName]§!在[121.GetName]發動針對§Y[121.owner.GetName]§!的獨立戰爭"
 ICE_incite_communist_uprising_wales: "煽動威爾士起義"
 ICE_incite_communist_uprising_wales_desc: "只需要一點小小的推動，我們就能讓威爾士工人們在[122.GetCapitalVictoryPointName]揭竿而起並宣佈自[122.owner.capital.GetCapitalVictoryPointName]政府獨立。"
 ICE_uprising_wales_tt: "§Y[122.owner.GetName]§!：[122.owner.GetCommunistParty]支持度大於[?ICE.communism_support_needed|%Y0]"
 ICE_incite_communist_uprising_wales_tt: "§Y[WLS.GetName]§!在[122.GetName]發動針對§Y[122.owner.GetName]§!的獨立戰爭"
 ICE_incite_communist_uprising_ni: "煽動北愛爾蘭起義"
 ICE_incite_communist_uprising_ni_desc: "只需要一點小小的推動，我們就能讓北愛爾蘭工人們在[119.GetCapitalVictoryPointName]揭竿而起並宣佈自[119.owner.capital.GetCapitalVictoryPointName]政府獨立。"
 ICE_uprising_ni_tt: "§Y[119.owner.GetName]§!：[119.owner.GetCommunistParty]支持度大於[?ICE.communism_support_needed|%Y0]"
 ICE_incite_communist_uprising_ni_tt: "§Y[WLS.GetName]§!在[119.GetName]發動針對§Y[119.owner.GetName]§!的獨立戰爭"
 #NORWAY
 NOR_democratic_preparation_decisions_category: "建設祖國"
 NOR_democratic_preparation_decisions_category_desc: "若要與全世界競爭，我們年輕的國家仍需奮起直追。數十年的怠慢與數年的大蕭條使我們的工業狀況慘不忍睹，我們必須齊心協力才可補闕拾遺。\n\n不幸的是，這要以我們的軍事準備度和防禦能力為代價。不過我們相信，完全與無武裝的中立能展示我們的善意，並讓敵人們可以安心地忽略我們的領土。\n\n\n[NOR.GetName]總髮展度：[?NOR.NOR_country_preparedness]/30"
 NOR_historical_deploy_prep_decisions_category: "風暴將至"
 NOR_historical_deploy_prep_decisions_category_desc: "人事已盡，戰爭卻從不遲到。從前，我們集舉國之力開發本國國土上的工業、經濟與基礎設施，但現在要做的，是利用之前的成果來保衛[NOR.GetNameDef]。\n\n\n[NOR.GetName]的潛在準備度：[?NOR.NOR_country_preparedness]/30"
 NOR_allied_democratic_preparation_decisions_category: "挪威戰備"
 NOR_allied_democratic_preparation_decisions_category_desc: "本政府確信，我們的敵人隨時都會發動進攻。我們必須堅定不移地武裝[NOR.GetName]民眾，以防止敵人入侵。因此，讓我們團結全國人民，奪取必要的力量，堅決戰勝敵人。\n\n國家準備度：[?NOR.NOR_country_preparedness]/30"
 NOR_allied_democratic_deploy_prep_decisions_category: "調度戰爭準備"
 NOR_allied_democratic_deploy_prep_decisions_category_desc: "正如我們所料，戰爭終於到來了，但沒什麼好害怕的。在過去幾年裡，我們一直致力於讓[ROOT.GetName]準備好面對敵人的任何攻擊。讓他們瞧瞧我們的本事。\n\n國家準備度：[?NOR.NOR_country_preparedness]/30"
 NOR_prepare_state_alt_dem: "[FROM.GetName]備戰"
 NOR_prepare_state_alt_dem_desc: "我等對不可避免之戰毫無準備。如今必須採取合適的措施，以此在戰爭爆發之時，確保[FROM.GetName]能為戰爭做出貢獻。個別人不會理解，但選擇已經決定好了——我們沒有退路。"
 NOR_alt_dem_naval_expansion: "擴建海軍"
 NOR_alt_dem_naval_expansion_desc: "發展海軍至關重要，不僅是為了保衛我國綿長的海岸線，還因為其可作為跳板，把戰鬥送返至入侵者的本土。"
 NOR_alt_dem_military_industry_expansion: "擴建軍事工業"
 NOR_alt_dem_military_industry_expansion_desc: "我們不能依賴其他國家為我們提供裝備，畢竟，今天的戰爭商人可能是明天的戰爭敵人。我們必須擴大我們的工業能力，以生產我們作戰所需的物資。"
 NOR_alt_dem_economic_relief_measures: "經濟紓困措施"
 NOR_alt_dem_economic_relief_measures_desc: "民眾對我們的軍事集結越來越厭倦。他們可能沒有看到我們所看到的，也可能不知道他們的犧牲是我們的戰爭機器為取得勝利所必須的。沒關係，我們暫時滿足他們的需求。"
 NOR_alt_dem_expedite_training: "加急軍訓"
 NOR_alt_dem_expedite_training_desc: "我們對自身處境的嚴峻形態有自覺。如果不盡快訓練新的部隊，我們可能會萬劫不復。"
 NOR_alt_dem_prioritize_production: "生產優先"
 NOR_alt_dem_prioritize_production_desc: "我們的戰爭機器需要裝備，而且現在就需要！讓工廠繼續嗡嗡作響，讓我們英勇的士兵擁有不惜一切代價打敗敵人的手段。"
 NOR_alt_dem_offensive_push: "侵略性推進"
 NOR_alt_dem_offensive_push_desc: "別管別的，趕緊進攻。讓我們奮勇向前，在敵人反應不及之時予以擊潰。"
 NOR_alt_dem_focus_on_defense: "專注防守"
 NOR_alt_dem_focus_on_defense_desc: "曾幾何時，[NOR.GetName]還是一個既講和平由奉行裁軍的國家。眼下，我們需要集中精力，保衛我們所擁有的一切。"
 NOR_alt_dem_modernize_armed_forces_decision: "$NOR_modernize_armed_forces_decision$"
 NOR_alt_dem_modernize_armed_forces_decision_desc: "$NOR_modernize_armed_forces_decision_desc$"
 NOR_fascist_preparation_decisions_category: "深影隨行"
 NOR_fascist_preparation_decisions_category_desc: "[NOR.GetAdjective]社會對民族統一黨的支持一直都很有限，這就是為什麼讓國民信服並建立一個支持的基本盤至關重要。\n\n通過種下法西斯主義的種子，在合適的時機來臨時，我們就能收穫計劃的果實，接管[ROOT.GetName]。\n\n\n[NOR.GetName]民族統一黨總支持度：[?NOR.NOR_country_preparedness]/30"
 NOR_fascist_deploy_prep_decisions_category: "深影崛起"
 NOR_fascist_deploy_prep_decisions_category_desc: "潛伏之時已畢，我等已經攫取了足夠多的用以接掌[NOR.GetName]的支持度，如今應付諸行動，將種子播撒在祖國的每一寸土地上。\n\n我們在民間中建立健全了我們的支持力量，組織了基層小組，隨時準備好在偉大元首的指揮下接掌全國領土，與懦弱不堪的民主力量堅決鬥爭到底。"
 NOR_communist_preparation_decisions_category: "無產者，起來"
 NOR_communist_preparation_decisions_category_desc: "[GetRousingProletariatDesc]"
 NOR_communist_preparation_decisions_category_desc_stalinist: "[ROOT.GetName]人民已閉目塞聰太久了，是時候響應我們在[SOU.GetNameDef]的同志們的號召了。\n\n只要循著他們的道路奪取生產資料，並在一面旗幟和一位領袖的領導下團結一心對抗奧斯陸暴政，[ROOT.GetName]就能取得同樣的成就。$NOR_revolution_support_counter$"
 NOR_communist_preparation_decisions_category_desc_trostkyist: "如今已是[NOR.GetName]人民追隨馬克思與托洛茨基先知教誨之時。要為不可避免之鬥爭做好準備，這場鬥爭將使我國成為斯堪的納維亞共產主義的急先鋒。\n\n讓我們點燃不斷革命的狼煙，團結一致對抗盤踞在奧斯陸的資本主義反動力量！$NOR_revolution_support_counter$"
 NOR_communist_preparation_decisions_category_desc_other: "革命必須自下而上，從那些被地主與企業家剝削的人民群眾中發起。\n\n許多無產階級同胞們對他們所擁有的力量並不自覺，因此我們必須喚醒他們，這樣他們才能團結一致對抗奧斯陸，逐個擊碎各地的資本主義枷鎖。$NOR_revolution_support_counter$"
 NOR_revolution_support_counter: "\n\n\n我國革命總支持度：[?NOR.NOR_country_preparedness]/[?NOR.NOR_comm_prep_max_preparedness]"
 NOR_monarchist_preparation_decisions_category: "讓哈康國王知道我們支持他的統治"
 NOR_monarchist_preparation_decisions_category_desc: "我們謙卑的哈康七世國王早在登基前就將他的權力移交給了大議會和選民。這在當時確實是明智之舉，但現在我們必須向他表明，我們將支持他趕在一無所有之前收回權力，直接掌管[ROOT.GetName]。\n\n\n君主制總支持度：[?NOR.NOR_country_preparedness]/30"
 NOR_prepare_state_historical: "發展[?FROM.GetName]"
 NOR_prepare_state_historical_desc: "我國工業基礎一塌糊塗，但我們願意為此付出必須的努力，以改善[ROOT.GetName]人民的境遇，以此在最壞的情況來臨之時提高我們的生存機會。"
 NOR_prepare_historical_unlock_TT: "解鎖§Y開發地區§!決議，允許加速§G民用建設§!，但會給予§R軍用建設和防禦§!懲罰。"
 NOR_prepare_fascist_unlock_TT: "解鎖§Y謀求地區支持§!決議，§G增加法西斯主義支持度§!並在內戰開始時給予§G領土和優勢§!，但會給予§R民用工業§!懲罰。"
 NOR_prepare_communist_unlock_TT: "共產主義革命爆發時，解鎖§Y喚醒該地區無產階級§!，給予§G領土和部隊§!，但是會§R破壞該地區的建築§!。"
 NOR_deploy_state_preparation_historical: "[get_deploy_prep_decision_name]"
 NOR_decision_defend_state_title: "保衛[FROM.GetName]"
 NOR_decision_emergency_production_title: "在[FROM.GetName]緊急生產"
 NOR_decision_deploy_emergency_militias_title: "在[FROM.GetName]部署民兵"
 NOR_dem_his_integrate_militias: "整編民兵"
 NOR_dem_his_integrate_militias_desc: "現在，組建民兵的人已經證明了他們的能力，我們可以更好地將他們編入軍隊，編入正規營和師。"
 NOR_alt_dem_integrate_militias: "$NOR_dem_his_integrate_militias$"
 NOR_alt_dem_integrate_militias_desc: "$NOR_dem_his_integrate_militias_desc$"
 NOR_prepare_exile: "準備流亡"
 NOR_prepare_exile_desc: "我國無法長期抵抗強敵，這是現實；但我們要堅守足夠多的撤離窗口期，這是可能。如是儘可能多地撤離，以便他日榮歸。"
 NOR_focus_on_training: "專注訓練"
 NOR_focus_on_training_desc: "我們需要傾盡全力，讓後備軍和新兵儘快轉正，投入戰鬥前線，畢竟前線可能撐不了太久了。"
 NOR_alt_dem_focus_on_training: "$NOR_focus_on_training$"
 NOR_alt_dem_focus_on_training_desc: "$NOR_focus_on_training_desc$"
 NOR_modernize_armed_forces_decision: "現代化武裝部隊"
 NOR_modernize_armed_forces_decision_desc: "[ROOT.GetAdjective]軍隊已經很久未得關注了。比起上戰場，我們的武裝部隊看起來更適合進博物館。"
 NOR_move_government_headquarters_decision: "政府移動至[FROM.GetName]"
 NOR_move_government_headquarters_decision_desc: "一旦我國政府駐地遭敵斬首，國王和王儲的末日就會來臨。反過來講，只要駐地不停下來，道路就會不斷延伸。"
 NOR_expedite_training: "加快訓練"
 NOR_expedite_training_desc: "儘管全力練兵對我國生存而言至關重要，倘若沒[NOR.GetName]沒有了，他們就什麼也不是。在我等被迫流亡他鄉前，必須得儘快完成這一任務。"
 NOR_public_investment_drive: "推動公共投資"
 NOR_public_investment_drive_desc: "[ROOT.GetName]事務繁多，倘若缺少公共部門的直接投資，似乎無法按期完工。似乎是無法完成的。我們要推動基礎設施和建設項目充斥全國。"
 NOR_alt_dem_public_investment_drive: "$NOR_public_investment_drive$"
 NOR_alt_dem_public_investment_drive_desc: "$NOR_public_investment_drive_desc$"
 NOR_naval_expanion: "擴立海軍"
 NOR_naval_expanion_desc: "要生存，就要守住海岸線，因此缺少不了船隻。因此，我們必須讓每個峽灣都成為船塢。"
 NOR_prepare_state_fascist: "在[FROM.GetName]謀求支持"
 NOR_deploy_state_preparation_fascist: "[get_deploy_prep_decision_name_fascist]"
 NOR_invite_fascist_to_invade: "邀請[GER.GetNameDef]入侵[NOR.GetNonIdeologyName]"
 NOR_decision_take_over_state_title: "接管[FROM.GetName]"
 NOR_decision_industrial_takeover_title: "工業接管[FROM.GetName]"
 NOR_decision_military_takeover_title: "軍事接管[FROM.GetName]"
 NOR_prepare_state_communist: "喚醒[FROM.GetName]無產者"
 NOR_prepare_state_communist_desc: "[FROM.GetName]人民在漫漫長夢中慘遭剝削太久了，讓我們播撒革命之火種吧。"
 NOR_communist_propaganda_campaign: "共產主義宣傳運動"
 NOR_prepare_state_monarchist: "[FROM.GetName]君主主義者示威遊行"
 NOR_prepare_state_monarchist_desc: "[FROM.GetName]人民需要回想起他們為什麼在1905年選舉中讓國王以壓倒性優勢上位。他們很快就會要求國王直接干預。"
 NOR_prop_up_the_economy: "支持經濟"
 NOR_prop_up_the_economy_desc: "如果人民忍飢挨餓，我們就無法實現我們的政治目標。我們必須暫停我們的大君遠征，以照顧我們的臣民和他們的需求。"
 NOR_make_assurances_to_the_people: "穩定[NOR.GetNonIdeologyName]民心"
 NOR_make_assurances_to_the_people_desc: "[NOR.GetName]最艱難的時刻已經到來。因此，我們必須通過媒體向人們保證，我們一定會渡過難關。"
 NOR_promote_the_armed_defense_of_the_country: "推動[NOR.GetName]武裝防衛"
 NOR_promote_the_armed_defense_of_the_country_desc: "[NOR.GetName]的人民必須意識到，如果他們不保衛自己的國家，會導致怎樣的後果。所有人都必須在將至的衝突中儘自己的本分。"
 NOR_exile_decisions_category: "[ROOT.GetName]政府的流亡之路"
 NOR_exile_decisions_category_desc: "我等正處在險象環生的境地：失去了故國，我等只得漂泊他鄉，孤苦伶仃。但是，至少我們還能感謝親切的東道主，在其幫助下，過客終有一日要回到我們摯愛的[NOR.GetNonIdeologyName]身邊。"
 NOR_request_reinstatement: "請求[FROM.GetNameDef]恢復我國政府"
 NOR_request_reinstatement_desc: "敵人在[NOR.GetName]節節敗退，因此我們認為，是時候讓我國政府復歸於本土了。"
 NOR_lobby_for_parliamentary_support: "爭取[FROM.GetAdjective]政府要員支持"
 NOR_lobby_for_parliamentary_support_desc: "到目前為止，我們的東道主還算慷慨大方，但這不妨礙我們繼續吸引其關注，讓他們對我國人民水深火熱的境遇保持持續的關注。如此，他們才能更明確的認識到何者之於我等是為利害攸關。"
 NOR_bring_soldiers_from_norway: "調集[NOR.GetNonIdeologyName]本土兵士"
 NOR_bring_soldiers_from_norway_desc: "許多保家衛國的將士們仍被困在祖國。我們可以努力將其一併帶走，甚至可以加上其他尚未參戰但也有意願從軍復國的青壯年們。"
 NOR_weapons_for_the_resistance: "採購並分發武器"
 NOR_weapons_for_the_resistance_desc: "我們可以利用好我國那龐大的商船隊，為本政府在此間的努力以及身處祖國的抵抗軍戰士們採購武器。分發給後者的武器將削弱敵人在[NOR.GetNonIdeologyName]的控制，而留在此間的武器將成為給予敵之暴政的致命一擊。"
 NOR_unity_parade: "[FROM.Capital.GetCapitalVictoryPointName]統一遊行"
 NOR_unity_parade_desc: "讓我們用吶喊填滿[FROM.Capital.GetCapitalVictoryPointName]的街道，以此讓這座偉大之城的民眾回想起來，我們與他們的鬥爭自開天闢地之時起就是同一個事業。"
 NOR_joint_training_exercise: "與[FROM.GetNameDef]聯合軍訓演習"
 NOR_joint_training_exercise_desc: "我們若要達到勝利，至少得先讓軍隊有[FROM.GetNameDef]的水平。這隻能通過訓練與盟國間合作來實現。"
 NOR_expand_industrial_capacity: "投資工業產能"
 NOR_expand_industrial_capacity_desc: "我們或許在流亡，但流亡不意味著我等束手無策，一切盤算均不得不束之高閣——我等坐擁世界上規模最大的商船隊之一，可以利用其來獲取所需的工業產能，以此為祖國奪還戰再添一把薪柴。"
 NOR_foment_resistance_in_state: "鼓動[FROM.GetName]抵抗"
 NOR_foment_resistance_in_state_desc: "[FROM.GetName]的子民心懷反抗之精神，正在與敵人鬥爭到底。僅需外部使點力，他們就能起到決定性的作用。"
 NOR_support_rebellion: "支持[FROM.GetName]反抗"
 NOR_support_rebellion_desc: "我等在[FROM.GetName]的抵抗組織工作已見成效，當地民眾已準備開始採取行動，造壓迫者的反。讓他們開戰罷——義軍烽火燃起之時，我等大舉還鄉之日。"
