 DEN_return_occupied_territory_category: "討還被佔領土"
 DEN_return_occupied_territory_category_desc: "外國勢力聲稱要保護我們的領土不受一切戰爭的侵害，直到我們從敵對侵略所造成的“骯髒的奴役中解放”。那麼，現在是時候請他們歸還島嶼了。"
