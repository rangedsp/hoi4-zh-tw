 DEN_integrate_iceland: "整合[ICE.GetFlag][Ice.GetNameDefCap]"
 DEN_integrate_sweden: "整合[SWE.GetFlag][SWE.GetNameDefCap]"
 DEN_integrate_finland: "整合[FIN.GetFlag][FIN.GetNameDefCap]"
 DEN_integrate_norway: "整合[NOR.GetFlag][NOR.GetNameDefCap]"
 DEN_demand_territory_category: "索取北歐領土"
 DEN_demand_territory_category_desc: "北歐地區屬於丹麥的霸權範圍，這樣我們才能保護各兄弟民族。我們完全有權要求，將任何尚未歸屬我國管轄的北歐領土移交予我方保護。"
 DEN_demand_icelandic_territory: "索要[ICE.GetFlag][Ice.GetAdjective]領土"
