 ENG_narvik_crisis: "啟動R4計劃"
 ENG_narvik_crisis_blow_up_mines: "破壞[SWE.GetAdjective]礦井"
 ENG_explode_the_swedish_iron_ore_mine: "R4計劃"
 ENG_explode_the_swedish_iron_ore_mine_tt: "在國際和國內反應過來之前，我們只有有限的時間破壞瑞典的鐵礦。如果做不到這一點，那就是一場恥辱的軍事失敗。"
 #NORTH SEA EMPIRE
 form_north_sea_category: "重建北海帝國"
 form_north_sea_category_desc: "鑑於我們已盡數掌控克努特大帝的疆域，是時候重建古老的丹法區，復興北海帝國之魂了。我們將再次主宰海浪，我們將統治所有相中之地。"
 form_north_sea_empire: "重建北海帝國"
 #Baltic Sea Empire
 form_baltic_sea_empire_category: "建立波羅的海霸權"
 form_baltic_sea_empire_category_desc: "長久以來，在波羅的海建立霸權統治一直是我們的主要目標之一。為了控制這片海洋，我們經歷了許多戰爭，尤其是和瑞典。鑑於我們終於實現這雄心壯志，是時候建立屬於[ROOT.GetAdjective]人的波羅的海霸權了。"
 form_baltic_sea_empire: "建立波羅的海霸權"
