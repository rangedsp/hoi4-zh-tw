 FIN_motion_of_no_confidence_against_leader: "[ROOT.GetLeader]不信任動議"
 FIN_motion_of_no_confidence_against_leader_desc: "[ROOT.GetLeader]在解決我們國家面臨的問題方面做得還不夠，很明顯，這一事實不會改變。現在是舉行不信任投票，推翻這位無能領導人的時候了。"
 FIN_resignation_of_kallio: "$FIN_kyosti_kallio$辭職"
 FIN_resignation_of_kallio_desc: "$FIN_kyosti_kallio$並不是最偉大的政治家，他最近的失敗表明，他無法將國家引向正確的方向。現在，世界局勢高度緊張，而他的健康狀況又不允許他處理不斷出現的嚴重問題，因此他最好辭職。"
 FIN_form_a_military_government: "成立軍管政府"
 FIN_form_a_military_government_desc: "現任文職政府在敵意和逆境面前表現得軟弱無能。$FIN_carl_mannerheim$曾為我國立下汗馬功勞，一定會再接再厲。如今，他必須組建一個軍政府來抵禦我們的每一個敵人。"
 FIN_resignation_of_mannerheim: "$FIN_carl_mannerheim$辭職"
 FIN_resignation_of_mannerheim_desc: "$FIN_carl_mannerheim$沒有必要也沒有意願無限期地統治國家，因此希望宣佈辭去總統職務，並表示不再需要他，因為他已經履行了就職時承諾履行的職責。"
 FIN_organize_the_opposition: "組織反對派"
 FIN_organize_the_opposition_desc: "政府沒有成功兌現其承諾，必須對其進行相應的處理。現在是團結反對派、組織活動以爭取支持和詆譭[ROOT.GetLeader]的時候了。"
 FIN_appeal_to_the_finnish_spirit: "弘揚芬蘭精神"
 FIN_appeal_to_the_finnish_spirit_desc: "我們必須弘揚芬蘭人面對逆境所彰顯出的非凡之決意與不拔之韌性。芬蘭民族必須砥礪同心，共同戰勝一切困難。讓我們強大的，乃是西蘇！"
 FIN_entice_the_masses: "誘導大眾"
 FIN_entice_the_masses_desc: "群眾是很容易動搖的。通過承諾解決較小的切身問題和議題，我們的政府很容易變得更有吸引力，更受普通芬蘭人的喜愛。"
 FIN_organize_the_opposition_cost_increase_tt: "\n§Y$FIN_organize_the_opposition$§!決議花費將§R乘以§!§Y[?FIN_bop_decision_cost_multiplier]§!。\n"
 FIN_appeal_to_the_finnish_spirit_cost_increase_tt: "\n§Y$FIN_appeal_to_the_finnish_spirit$§!決議花費將§R乘以§!§Y[?FIN_bop_decision_cost_multiplier]§!。\n"
 FIN_entice_the_masses_cost_increase_tt: "\n§Y$FIN_entice_the_masses$§!決議的花費將§R乘以§!§Y[?FIN_bop_decision_cost_multiplier]§!。\n"
 FIN_the_path_to_socialism: "社會主義之路"
 FIN_the_path_to_socialism_desc: "若干年後，通過人民的集體努力，我們將實現真正的社會主義，儘管通往社會主義的道路可能荊棘叢生、困難重重。但是，我們必須不計代價，堅持走下去。"
 FIN_gather_popular_support: "獲取民眾支持"
 FIN_gather_popular_support_desc: "人民對任何革命或政府都至關重要，我們應竭盡全力爭取人民的支持。"
 FIN_gather_popular_support_dec_tt: "我方獲得的總領土和軍隊§G+10%§!。\n創建額外的共產主義§Y民兵§!師。"
 when_civil_war_starts_tt: "§Y在內戰開始時：§!"
 FIN_crack_down_on_fascists: "鎮壓法西斯派"
 FIN_crack_down_on_fascists_desc: "法西斯分子是[FIN.GetAdjective]人民的真正敵人，必須儘快解決。"
 FIN_crack_down_on_fascists_character_tt: "法西斯政治人物將被關入監獄，並無法在內戰時加入敵方："
 FIN_crack_down_on_fascists_militias_tt: "敵人所能依賴的法西斯§Y民兵§!師將會減少。"
 FIN_crack_down_on_the_military: "鎮壓軍方"
 FIN_crack_down_on_the_military_desc: "軍方最近的行為很可疑，需要在問題出現之前加以解決。"
 FIN_crack_down_on_the_military_character_tt: "某些將軍和軍事顧問將被關入監獄，並無法在內戰時加入敵方："
 FIN_crack_down_on_the_military_divs_tt: "部分法西斯§Y步兵§!師將被解散。"
 effects_applied_to_the_enemy_side_in_cw_tt: "§Y對內戰敵方的影響：§!"
 FIN_prepare_construction_workers_actions: "準備建築業工人行動"
 FIN_prepare_construction_workers_actions_desc: "建築工人在一天之內就能通過他們的協調努力使經濟癱瘓。現在，是我們充分發揮這些人的潛力的時候了。"
 FIN_prepare_construction_workers_actions_dec_tt: "我方獲得的總領土和軍隊§G+5%§!。\n創建額外的共產主義§Y民兵§!師。"
 FIN_prepare_construction_workers_actions_enemy_side_dec_tt: "一些民用工廠和基礎設施將遭到破壞。"
 FIN_align_the_trade_unions: "協調工會"
 FIN_align_the_trade_unions_desc: "事實證明，我們的政府非常需要工會的支持。我們必須做出讓步，讓他們站在我們這一邊。"
 FIN_align_the_trade_unions_enemy_side_dec_tt: "一些軍用工廠和船塢將遭到破壞。"
 FIN_purchase_soviet_equipment: "購買蘇聯裝備"
 FIN_purchase_soviet_equipment_desc: "蘇聯有很多設備，我們可以把它們用在更好、更重要的事情上。"
 FIN_infiltrate_soviet_commandos: "蘇聯突擊隊滲透芬蘭"
 FIN_infiltrate_soviet_commandos_desc: "蘇聯突擊隊是最優秀的士兵，對我們的革命很有幫助。"
 FIN_infiltrate_soviet_commandos_dec_tt: "在我國首都創建§G3支§!§Y6步§!§Y2炮§!並帶有4§Y支援營§!的§G陸軍師§!"
 FIN_call_to_union_activism: "呼籲工會行動"
 FIN_call_to_union_activism_desc: "工會有能力向政府施壓，從而通過對勞動階層更有益的政策。我們必須現在就讓他們開始工作。"
 FIN_push_for_cabinet_participation: "要求入閣"
 FIN_push_for_cabinet_participation_desc: "社會主義者自1929年起就被擋在內閣外。差不多是時候向[ROOT.GetLeader]施壓，讓其尊重下議會制度的原則了。"
 FIN_gather_funds_for_womens_shelters: "為女性庇護所集資"
 FIN_gather_funds_for_womens_shelters_desc: "過去十年來，$FIN_miina_sillanpaa$一直在努力為勞動和單身女性爭取權利、建立女性庇護所。如果政府支持她的活動，她就能取得更好的進展。"
 FIN_appoint_yrjo_leino_as_president: "任命於爾約·萊伊諾為總統"
 FIN_appoint_yrjo_leino_as_president_desc: "於爾約·萊伊諾是真正能夠帶領我國人民走向繁榮的人，因此應該考慮儘快讓他擔任總統。"
 FIN_request_extradition_of_kullervo_manner: "要求引渡庫萊沃·曼納"
 FIN_request_extradition_of_kullervo_manner_desc: "庫勒沃·曼納的病情日益惡化，我們要在他死於肺結核之前將他從戰俘營帶回[FIN.GetNameDef]。"
 FIN_prioritize_light_industry: "輕工業優先"
 FIN_prioritize_light_industry_desc: "我們的工業重點都是錯誤的，我們必須立即重新考慮。"
 FIN_prioritize_heavy_industry: "重工業優先"
 FIN_prioritize_heavy_industry_desc: "我們的工業重點都是錯誤的，我們必須立即重新考慮。"
 FIN_rebalance_industrial_focus: "工業中心再平衡"
 FIN_rebalance_industrial_focus_desc: "我們的工業重點都是錯誤的，我們必須立即重新考慮。"
 FIN_prioritize_light_industry_dec_cost_tt: "優先輕工業時，§Y$FIN_prioritize_heavy_industry$§!決議的花費將會§R翻倍§!。\n"
 FIN_prioritize_heavy_industry_dec_cost_tt: "優先重工業時，§Y$FIN_prioritize_light_industry$§!決議的花費將會§R翻倍§!。\n"
 FIN_rebalance_industrial_focus_dec_cost_tt: "§Y$FIN_prioritize_light_industry$§!和§Y$FIN_prioritize_heavy_industry$§!決議的花費會重置為初始數值。"
 FIN_kullervo_manner_extradited_flag: "§Y$FIN_kullervo_manner$§!已在§Y1939年1月31日§!去世前從[SOV.GetName]被引渡（完成§Y$FIN_approach_the_soviets$§!國策和§Y$FIN_request_extradition_of_kullervo_manner$§!決議）。"
 FIN_coastal_garrisons: "岸防部隊"
 FIN_coastal_garrisons_desc: "我們應該建立沿海駐軍，以抵禦任何和所有的海上入侵。"
 FIN_coastal_garrisons_decision_cost_pp_xp_cp: "£pol_power §Y[?FIN.FIN_coastal_garrisons_pp_xp_cost]§!£army_experience §Y[?FIN.FIN_coastal_garrisons_pp_xp_cost]§!£command_power §Y[?FIN.FIN_coastal_garrisons_cp_cost]§!"
