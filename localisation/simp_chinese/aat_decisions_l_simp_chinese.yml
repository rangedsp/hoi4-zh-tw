 FIN_balance_of_power_category: "$FIN_power_balance$"
 FIN_motti_tactics_category: "柴堆戰術"
 FIN_motti_tactics_category_desc: "柴堆戰術包括包夾、斷絕敵軍單位，其目的在於癱瘓其後勤和通信線路。\n實施此等戰術亟需在國防軍計劃與訓練上精心打點，確保其在戰場上能夠發揮作用。利用完善好柴堆戰術，我們將得以超越敵軍，在他們最難受的地方進行打擊。"
 FIN_prepare_motti_tactics_in_state: "在[FROM.GetName]準備柴堆戰術"
 FIN_prepare_motti_tactics_in_state_desc: "準備在[FROM.GetName]實施柴堆戰術。"
 FIN_cancel_motti_tactics_in_state: "中斷[FROM.GetName]的柴堆戰術"
 FIN_cancel_motti_tactics_in_state_desc: "我軍不再於[FROM.GetName]使用柴堆戰術，因此相應的軍事資源應被挪作他用。"
