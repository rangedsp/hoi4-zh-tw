 FIN_national_defense_category: "國家防衛"
 FIN_national_defense_category_desc: "[ROOT.GetAdjective]領土防衛至關重要。我們必須不惜一切代價來保衛本國民眾免受任何外來勢力的威脅。"
 FIN_set_up_weapon_caches_in_state: "在[FROM.GetName]設置武器藏匿處"
 FIN_set_up_weapon_caches_in_state_desc: "作為秘密軍事行動的一部分，大量[ROOT.GetAdjective]軍用武器裝備將被分散貯存在[FROM.GetName]各地的藏匿處內，以便[ROOT.GetAdjective]抵抗軍能與入侵者抗爭到底。"
 FIN_weapon_caches_cost_increase_tt: "§Y設置武器藏匿處§!決議花費將提高§Y[?FIN_weapon_caches_decision_cost_increase]§!。\n"
