 FIN_surrender_to_the_soviet_union: "向[SOV.GetNameDef]投降"
 FIN_surrender_to_the_soviet_union_desc: "顯然，儘管我軍兵士拋頭顱灑熱血，但沒有辦法永遠阻擋住[SOV.GetAdjective]的推進。現在，是時候要求與敵人實現有條件和平了。"
 FIN_reached_out_to_soviets_to_surrender_flag: "已開始嘗試與[SOV.GetNameDef]議和"
 FIN_demand_peace_negotiations: "要求[SOV.GetName]和談"
 FIN_demand_peace_negotiations_desc: "現在，我們終於在與[SOV.GetAdjective]的鬥爭中佔據了上風，可以嘗試上談判桌了。"
 FIN_can_demand_territory_if_occupying_tt: "\n\n我們如果控制§Y[213.GetName]§!、§Y[215.GetName]§!或§Y[216.GetName]§!地區，還可要求[SOV.GetNameDef]割讓領土。"
 FIN_can_demand_peace_negotiations_flag: "已完成§Y$FIN_hold_leningrad_mission$§!任務（控制§Y[195.GetName]§!至少§Y30日§!）且當前控制§Y[195.GetName]§!"
 FIN_winter_war_ongoing_flag: "[ROOT.GetFlag]§Y[ROOT.GetNameDef]§!正作為防守方與§Y[SOV.GetNameDef]§!進行冬季戰爭。"
 FIN_hold_leningrad_mission: "守住[195.GetName]"
 FIN_hold_leningrad_mission_desc: "[195.GetName]或已被我軍攻克。但為了實現我方要求，我們必須繼續堅守該地區，直到[SOV.GetAdjective]軍隊士氣萎靡。"
 FIN_retake_leningrad_mission: "重奪[195.GetName]"
 FIN_retake_leningrad_mission_desc: "[FIN.GetAdjective]軍隊從我們手上偷下了[195.GetName]！我們如果沒辦法儘快奪回，就不得不要滿足他們提出來的要求。"
 FIN_finland_can_send_peace_demands_tt: "[FIN.GetFlag]§Y[FIN.GetNameDefCap]§!可要求和談，甚至可以在控制§Y[213.GetName]§!、§Y[215.GetName]§!或§Y[216.GetName]§!的情況下要求[ROOT.GetAdjective]割讓領土。"
 FIN_finnish_resistance_category: "[FIN.GetAdjective]抵抗"
 FIN_finnish_resistance_category_desc: "作為秘密軍事行動的一部分，大量[ROOT.GetAdjective]軍用武器裝備將被分散貯存在芬蘭各地的藏匿處內，以便[ROOT.GetAdjective]抵抗軍能與入侵者抗爭到底。"
 FIN_search_for_weapon_caches_in_state: "搜查[FROM.GetName]的武器藏匿處"
 FIN_search_for_weapon_caches_in_state_desc: "我軍部隊將徹查[FROM.GetName]的芬蘭武器藏匿處一事，找出並收繳當地所有武器藏匿處。"
 FIN_search_for_weapon_caches_decision_cost_cp: "£command_power §Y[?FIN.FIN_search_for_weapon_caches_decision_cost]§!"
