 DEN_hurt_military_ability_tt: "這項行動將對軍事能力造成以下損害"
 DEN_bop_exile_royal_family: "流放王室"
 DEN_bop_ban_elections: "禁止選舉"
 DEN_bop_motion_of_no_confidence: "不信任動議"
 DEN_bop_motion_of_no_confidence_desc: "看來，現任政府根本沒能力為拯救[DEN.GetNameDef]和人民做出任何明智的行動。我們需要一個全新的、果斷的領導層！國會必須推動對[DEN.GetLeader]領導層的不信任動議。"
 DEN_bop_criticize_the_country_leader: "批評[DEN.GetLeader]"
 DEN_bop_criticize_the_country_leader_desc: "儘管國會成員私下都在質疑[ROOT.GetLeader]的領導班子，然而，似乎無人願意打開天窗說亮話。必須有人公開批評他並集結議會多數啟動不信任動議！"
 DEN_has_criticized_country_leader_flag: "已批評[DEN.GetLeader]"
 DEN_bop_defend_our_chosen_path_neutrality: "£BoP_left_texticon 保衛我們的抉擇"
 DEN_bop_defend_our_chosen_path_neutrality_desc: "不論是好是壞，我們都已經走上了一條不歸路。我們必須堅信引領我們至此的決定，並希望我們選擇的是正確的道路。"
 DEN_bop_ban_all_political_uniforms: "£BoP_left_texticon 禁止穿著一切政治制服"
 DEN_bop_ban_all_political_uniforms_desc: "俯瞰歐洲，身著政治制服的人們一如閱兵般列隊行進；俯瞰歐洲，政治動盪和不穩局勢正日益嚴峻，將整個歐羅巴大陸拖入混亂的深淵。我們必須在為時已晚之前，阻止這一事態發展蔓延至[ROOT.GetNameDef]。"
 DEN_bop_unban_oppositions_uniforms: "£BoP_left_texticon 允許反對黨穿著政治制服"
 DEN_bop_unban_oppositions_uniforms_desc: "我們不能在禁止其他政黨使用政治制服時，縱容我們的支持者像閱兵式一般上街遊行。這種審查制度必須被砍掉。"
 DEN_bop_defend_the_policy_of_neutrality: "£BoP_left_texticon 捍衛中立政策"
 DEN_bop_defend_the_policy_of_neutrality_desc: "我們從中立政策獲益良多，尤其是在世界大戰期間，戰爭席捲歐洲卻未染指丹麥。我們倖免於難，我們逃過一劫。我們確實從中立政策獲益良多。"
 DEN_bop_speak_out_in_favor_of_disarmament: "£BoP_left_texticon 號召裁軍"
 DEN_bop_speak_out_in_favor_of_disarmament_desc: "作為一個強權環伺的小國，我們沒有任何抵禦入侵的希望，所以為什麼要把錢花在永遠無法幫助我們，卻可能激怒周遭大國的國防上呢？"
 DEN_bop_speak_out_against_warfare: "£BoP_left_texticon 指控軍備重整"
 DEN_bop_speak_out_against_warfare_desc: "現在重整軍備將對我國造成嚴重的威脅，因為極易被周遭列強視為敵對行為。我們還不能冒險激怒強大的鄰國，因為我們沒有在面對一隻強大軍隊時保衛自己的辦法。"
 DEN_bop_expand_the_welfare: "£BoP_left_texticon 擴展福利制度"
 DEN_bop_expand_the_welfare_desc: "我們應該加大在新興福利系統的支出，而不是販賣戰爭焦慮並把錢花在無法抵擋任何周遭強國襲擊的國防上。"
 DEN_bop_unban_all_political_uniforms: "£BoP_right_texticon 允許穿著一切政治制服"
 DEN_bop_unban_all_political_uniforms_desc: "我們不能允許政治制服禁令繼續存在，因為這是對人民權利的限制！"
 DEN_bop_ban_oppositions_uniforms: "£BoP_right_texticon 禁止反對黨穿著政治制服"
 DEN_bop_ban_oppositions_uniforms_desc: "我們不能允許政敵身著制服遊行示威，這隻會導致人心四散、相互為敵。我們應禁止一切政治制服——當然，當權的可得除外。"
 DEN_bop_defend_our_chosen_path_rearmament: "£BoP_right_texticon 捍衛我們的抉擇"
 DEN_bop_defend_our_chosen_path_rearmament_desc: "$DEN_bop_defend_our_chosen_path_neutrality_desc$"
 DEN_bop_criticize_our_preparedness: "£BoP_right_texticon 批評備戰進度"
 DEN_bop_criticize_our_preparedness_desc: "陰雲再次遍佈歐陸，我們卻毫無準備！如果我們要經受這場風暴，就必須儘快開始準備。"
 DEN_bop_question_our_defenses: "£BoP_right_texticon 質疑國防能力"
 DEN_bop_question_our_defenses_desc: "長期的中立政策完全剝奪了丹麥的國防能力！如果現在我們遭到外國襲擊，沒什麼能阻擋他們長驅直入哥本哈根。如果我們想作為一個國家存活，就必須注重國防！"
 DEN_bop_speak_out_against_welfare: "£BoP_right_texticon 指控福利制度"
 DEN_bop_speak_out_against_welfare_desc: "在將資金投入於其他方面之前，我們必須首先注重保障我國獨立的國防。很明顯，如果丹麥國家不存在了，自然也沒有丹麥人能享受這些資金的回報了。"
 DEN_bop_speak_out_in_favor_of_rearmament: "£BoP_right_texticon 號召軍備重整"
 DEN_bop_speak_out_in_favor_of_rearmament_desc: "當歐陸處於軍備競賽，前程一片暗淡之時，我們不可坐以待斃。我們必須儘快準備防衛並開始重整軍備，最好從昨天就開始了！"
 DEN_bop_landstorm: "£BoP_right_texticon 重建國家衝鋒隊"
 DEN_bop_landstorm_desc: "風暴已在我國四遭開始醞釀，是時候重新設立國家衝鋒隊來保家衛國了。這種部隊質量談不上上乘，但或許將是我等最後一道防線。"
 DEN_bop_hold_a_military_parade: "£BoP_right_texticon 舉行閱兵式"
 DEN_bop_hold_a_military_parade_desc: "舉行一場閱兵式將讓民眾更加確信我們有能力保衛[ROOT.GetNameDef]。毫無疑問，看到積極向上的軍隊後，民眾的鬥志與決心都會更上一層。"
 #OCCUPATION BOP
 DEN_bop_occupation_criticize_collaboration: "£BoP_right_texticon 批評合作政策"
 DEN_bop_occupation_criticize_collaboration_desc: "[ROOT.GetNameDef]對[?DEN.DEN_overlord_nation.GetNameDef]的這種不光彩的投降和不倫不類的合作，簡直就是在浪費紙！"
 DEN_bop_occupation_strikes: "£BoP_right_texticon 秘密協調罷工"
 DEN_bop_occupation_strikes_decs: "我們現在能做的，就是通過協調全國範圍內的罷工，來對[?DEN.DEN_overlord_nation.GetAdjective]佔領表達消極抗議。"
 DEN_bop_occupation_resistance_coordination: "£BoP_right_texticon 協調抵抗運動"
 DEN_bop_occupation_resistance_coordination_desc: "我們如果想重獲自由，就必須集結同一個抵抗運動的旗下，為同一個目標而戰：解放[ROOT.GetNameDef]。"
 DEN_bop_occupation_underground_factories: "£BoP_right_texticon 地下武器工廠"
 DEN_bop_occupation_underground_factories_desc: "為了恢復主權而計，我們需要充分的武器儲備。我們必須建造秘密武器工廠，以便在不得不為自由而戰的那一天到來時，民眾能夠武裝上有可用之兵。"
 DEN_bop_occupation_raid_depots: "£BoP_right_texticon 掠襲武器據點"
 DEN_bop_occupation_raid_depots_desc: "國內的軍火工廠現在正為[?DEN.DEN_overlord_nation.GetNameDef]生產武器，這些武器被宗主國拿去打他們的戰爭。如果我們能襲擊武器倉庫，就可以減少武器供應，同時加強我們的抵抗運動。"
 DEN_bop_occupation_sabotage_civ_industry: "£BoP_right_texticon 破壞民用工廠"
 DEN_bop_occupation_sabotage_civ_industry_desc: "國內的工業現在正被迫為[?DEN.DEN_overlord_nation.GetNameDef]提供各種材料，這些材料被宗主國拿去打他們的戰爭。破壞這些工廠就能減少其物資供應，從而在德國戰事背後拖其後腿。"
 DEN_bop_occupation_sabotage_mil_industry: "£BoP_right_texticon 破壞軍用工廠"
 DEN_bop_occupation_sabotage_mil_industry_desc: "國內的軍火工廠現在正為[?DEN.DEN_overlord_nation.GetNameDef]提供武器，這些武器被宗主國拿去打他們的戰爭。破壞這些工廠就能減少其武器供應，從而在德國戰事背後拖其後腿的同時，幫助我們潛在的盟友。"
 DEN_bop_occupation_funnel_resources_danish_brigade: "£BoP_right_texticon 向丹麥旅輸送資源"
 DEN_bop_occupation_funnel_resources_danish_brigade_desc: "[?DEN.hosts_danish_brigades.GetNameDefCap]欣然接受並訓練丹麥部隊，以便在時機成熟時協助解放[ROOT.GetNameDef]。但為了確保這些部隊有最大可能成功完成解放我國的任務，我們必須提供資金和物資援助。"
 DEN_bop_occupation_switch_ideology: "接受[?DEN.DEN_overlord_nation.GetRulingIdeologyNoun]"
 DEN_bop_occupation_switch_ideology_desc: "我們如果真的想與[?DEN.DEN_overlord_nation.GetNameDef]搭膀子並贏得其支持，就必須採納他們的意識形態和信念。"
 DEN_bop_occupation_ban_elections: "£BoP_left_texticon 禁止選舉"
 DEN_bop_occupation_ban_elections_desc: "我們必須禁止自由選舉，以此安撫我們的宗主國[?DEN.DEN_overlord_nation.GetAdjective]。"
 DEN_bop_occupation_defend_collaboration: "£BoP_left_texticon 反對合作政策"
 DEN_bop_occupation_defend_collaboration_desc: "向[?DEN.DEN_overlord_nation.GetNameDef]投降並與之合作，才是唯一正確的選擇！如此，我們就能免於根本想像不到的恐怖和毀滅。"
 DEN_bop_occupation_censor_the_media: "£BoP_left_texticon 審查媒體"
 DEN_bop_occupation_censor_the_media_desc: "時局岌岌可危，我們不能允許媒體公開批評[?DEN.DEN_overlord_nation.GetAdjective]佔領軍。如今必須限對其出版內容予以一定的限制，以免危及我等僅剩的最後一絲自由。"
 DEN_bop_occupation_remove_political_agitator: "£BoP_left_texticon 移除政治鼓動者"
 DEN_bop_occupation_remove_political_agitator_desc: "一些知名政客毫不避諱地批評我們的宗主國[?DEN.DEN_overlord_nation.GetAdjective]，這加劇了兩國間的緊張關係。我們必須在[?DEN.DEN_overlord_nation.GetNameDef]提出類似要求之前，自覺免去這些麻煩蛋的政治職務。"
 DEN_bop_occupation_ban_communism: "£BoP_left_texticon 查禁共產主義"
 DEN_bop_occupation_ban_communism_desc: "我們的宗主國[?DEN.DEN_overlord_nation.GetAdjective]認為，其自身與共產主義意識形態的關係本身就是戰爭狀態。如果我們在國內取締一切共產主義組織，他們會更加重視與我們繼續合作。"
 DEN_bop_occupation_allow_communism: "£BoP_left_texticon 放任共產主義"
 DEN_bop_occupation_allow_communism_desc: "我們的共產主義宗主國並不喜歡我國在[ROOT.GetNameDef]國內查禁其意識形態。再次為共產主義宣傳開綠燈，是為符合我們的最佳利益的選擇。"
 DEN_bop_occupation_ban_fascism: "£BoP_left_texticon 查禁法西斯主義"
 DEN_bop_occupation_ban_fascism_desc: "我們的宗主國[?DEN.DEN_overlord_nation.GetAdjective]認為，其自身與法西斯主義意識形態的關係本身就是戰爭狀態。如果我們在國內取締一切法西斯主義組織，他們會更加重視與我們繼續合作。"
 DEN_bop_occupation_allow_fascism: "£BoP_left_texticon 放任法西斯主義"
 DEN_bop_occupation_allow_fascism_desc: "我們的法西斯主義宗主國並不喜歡我國在[ROOT.GetNameDef]國內查禁其意識形態。再次為法西斯主義宣傳開綠燈，是為符合我們的最佳利益的選擇。"
 DEN_bop_occupation_allow_democratism: "£BoP_left_texticon 放任民主政黨"
 DEN_bop_occupation_allow_democratism_desc: "定期舉行選舉是公民之間相互信任的標誌，也是一國之力量所在。禁止民主選舉乃是我國之恥辱。"
 #RESISTANCE
 DEN_resistance_category: "丹麥抵抗運動"
 DEN_resistance_category_desc: "我們必須反抗佔領軍，重獲自由！唯經共同努力方能實現，因此我們必須堅定不移地朝著解放[ROOT.GetNameDef]的共同目標前進。"
