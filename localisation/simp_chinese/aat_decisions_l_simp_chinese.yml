 NORDIC_ask_for_investment_to_nordic: "要求[FROM.GetName]投資我們"
 NORDIC_ask_for_investment_to_nordic_desc: "顯然我們缺乏發展和掌權所必要的投資資金。我們可以要求我們的北歐鄰國[FROM.GetName]向外國注資以達成這個目標。當然，他們也會因此得到回報。"
 NORDIC_ongoing_investment: "已在投資一個北歐國家經濟。"
 NORDIC_economic_cooperation_decisions: "尋求與[FROM.GetName]經濟合作"
 NORDIC_economic_cooperation_decisions_desc: "[ROOT.GetName]和[FROM.GetName]有著數百年的共同歷史。有時是敵人，有時是盟友和友鄰。在這個動亂時代，我們北歐國家應該團結在一起，平等互利地合作。"
