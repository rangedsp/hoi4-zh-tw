 ### INS - Political Events
 INS_political_events.1.t: "[INS.GetNameDef]新任總督"
 INS_political_events.1.desc: "[INS.GetLeader]的五年任期即將結束，因此我們必須決定一位合適的領導人來接替他的位置。威廉明娜女王推薦了阿利迪厄斯·恰爾達·範·斯塔爾肯博赫·斯塔豪韋爾，他作為特命大使和全權公使表現出了巨大的潛力。"
 INS_political_events.1.a: "如女王所願"
 INS_political_events.1.b: "[INS.GetLeader]幹得不錯，應該再給他一個任期"
 INS_political_events.2.t: "[FROM.GetName]索取[721.GetName]"
 INS_political_events.2.desc: "前東印度群島的新共和國政府宣佈其對整個群島的法理權。[FROM.GetLeader]已正式要求我們放棄[721.GetName]，並威脅在拒絕後將採取軍事行動。"
 INS_political_events.2.a: "好吧，不值得引起摩擦"
 INS_political_events.2.b: "決不可能！"
 INS_political_events.3.t: "[FROM.GetName]同意放棄[721.GetName]"
 INS_political_events.3.desc: "正如我們所料，[FROM.GetLeader]同意了我們的要求，開始將軍隊撤出[721.GetName]。人民安全軍已協同數位政府特使進入該地區。[INS.GetLeader]親自在帝力發表演講，宣佈擺脫殖民影響。"
 INS_political_events.3.a: "太棒了！"
 INS_political_events.4.t: "[FROM.GetName]拒絕放棄[721.GetName]"
 INS_political_events.4.desc: "與[FROM.GetName]的談判並不順利。[FROM.GetLeader]出於某種原因拒絕放棄[721.GetName]，提前結束了會談。"
 INS_political_events.4.a: "那就開戰吧"
 INS_political_events.5.t: "印度尼西亞大選"
 INS_political_events.5.desc: "今天對印度尼西亞來說是一個歷史性的里程碑。隨著革命的正式結束，總理[INS.GetLeader]宣佈印度尼西亞將舉行第一次自由民主的選舉。這次選舉的結果將對印度尼西亞產生持久的影響。"
 INS_political_events.5.a: "蘇丹·沙里爾帶領國家走到這一步，他將領導我們繼續前進！"
 INS_political_events.5.b: "阿米爾·謝里夫丁是社會主義者和民族主義者的折中方案"
 INS_political_events.5.c: "穆罕默德·哈達發起了革命，也將由他來完成。"
 INS_political_events.6.t: "我們的準備得到了回報"
 INS_political_events.6.desc: "隨著革命的進行，我們滲透到東印度政府的游擊隊已不再需要秘密行動，並將在荷蘭有時間做出反應之前開始執行破壞任務。"
 INS_political_events.6.a: "我們必須繼續迅速行動"
 INS_political_events.7.t: "蘇塔爾喬請願"
 INS_political_events.7.desc: "蘇塔爾喬組織人民議會請願，要求荷蘭和印度尼西亞代表舉行圓桌會議，討論印度尼西亞自治的願景，請願書已遞交總督裁決。儘管許多顧問堅持維持現狀，要求否決請願書，但不可否認的是，民族主義運動只會愈發強大和激進。如果我們繼續拒絕每一項和平的自治請求，民族主義者可能會開始嘗試更暴力的替代方案。"
 INS_political_events.7.a: "我們必須開始談判，以避免不可避免的內戰"
 INS_political_events.7.b: "必須維持現狀"
 INS_political_events.7.c: "也許民族主義者有點道理？"
 INS_political_events.8.t: "[?event_target:INS_invasion_event_invader.GetAdjective]即將佔領"
 INS_political_events.8.desc: "[?event_target:INS_invasion_event_invader.GetName]的士兵抵達了[?event_target:INS_invasion_event_invaded_state.GetName]，我們在該地區的士兵人數遠不如對手，已被下令全面撤出[?event_target:INS_invasion_event_invaded_state.GetName]。[?event_target:INS_invasion_event_invader.GetAdjective]軍隊繼續在東印度群島推進，我們避免佔領的希望渺茫。"
 INS_political_events.8.a: "我們將逮捕民族主義者，保衛我們的家園，直到死亡！"
 INS_political_events.9.t: "印度尼西亞宣佈獨立"
 INS_political_events.9.desc: "[JAP.GetNameDef]已開始從東印度群島撤軍，我們向巴達維亞派遣了士兵，以重建殖民政府。然而，我們的士兵發現，自佔領以來，東印度群島的政治格局發生了重大變化。在我們的軍隊抵達巴達維亞之前，[INS.GetLeader]已經簽署了一份獨立宣言，宣告了印度尼西亞共和國的獨立，並得到了公眾驚人的支持。"
 INS_political_events.9.a: "出動坦克！"
 INS_political_events.9.b: "沒希望了，我們不需要更多戰鬥。我們應該專注於重建家園"
 INS_political_events.11.t: "[HOL.GetNameDefCap]承認印度尼西亞主權"
 INS_political_events.11.desc: "宣佈獨立後，我們的民兵立即採取行動，準備應對預期中的荷蘭入侵。然而，令許多人驚訝的是，[HOL.GetLeader]宣佈他不會發動入侵，而是要優先重建荷蘭家園，並避免進一步的衝突。"
 INS_political_events.11.a: "真令人意外，但也是個驚喜"
 INS_political_events.12.t: "與印度尼西亞民族主義者會談"
 INS_political_events.12.desc: "我們的部隊已在[?event_target:INS_invasion_event_invaded_state.GetName]登陸，印尼戰線的勝利即將到來。我們需要決定如何佔領印度尼西亞。雖然直接佔領可以為我們提供所需的資源，但代價和難度極高。我們與革命領袖蘇加諾進行了談判，並制定了一項計劃，建立一個印尼傀儡國家，官方上由蘇加諾領導，但聽從我們的指示。這能讓印尼公民保持冷靜，而且比完全佔領要廉價得多。"
 INS_political_events.12.a: "我們應該繼續與蘇加諾談判"
 INS_political_events.12.b: "我們對與革命者合作不感興趣"
 INS_political_events.13.t: "[?event_target:INS_invasion_event_invader.GetAdjective]即將佔領"
 INS_political_events.13.desc: "[?event_target:INS_invasion_event_invader.GetName]的士兵抵達了[?event_target:INS_invasion_event_invaded_state.GetName]，我們在該地區的士兵人數遠不如對手，已被下令全面撤出[?event_target:INS_invasion_event_invaded_state.GetName]。[?event_target:INS_invasion_event_invader.GetAdjective]軍隊繼續在東印度群島推進，我們避免佔領的希望渺茫。另外，我們的間諜報告，稱[?event_target:INS_invasion_event_invader.GetLeader]正在與蘇加諾和其他民族主義領導人談判，旨在在共榮圈下建立一個由蘇加諾領導的印尼傀儡國家。"
 INS_political_events.13.a: "我們將逮捕民族主義者，保衛我們的家園，直到死亡！"
 INS_political_events.13.b: "這很危險，但也許這是獨立的真正機會？"
 INS_peta_explain_tt: "如果[JAP.GetName]被擊退，我們就能利用佔領的混亂宣佈完全獨立。"
 INS_peta_explain_tt_jap: "§R[INS.GetName]或許仍對我們保持忠誠，但一旦我們開始失去領土控制，他們可能會看穿我們的虛張聲勢，宣佈獨立§!。"
 INS_political_events.14.t: "民族主義者領袖被捕"
 INS_political_events.14.desc: "在我們建立傀儡政權以前，蘇加諾和其他幾名印尼革命者高層已被荷蘭軍事警察逮捕。"
 INS_political_events.14.a: "可惜，他是個有價值的盟友"
 INS_political_events.15.t: "鄉土防衛義勇軍"
 INS_political_events.15.desc: "與蘇加諾的談判已經結束，印度尼西亞傀儡政權正在建立中。蘇加諾利用他的關係以及我們的軍事存在破壞了荷蘭政府的穩定，並建立了對群島的事實控制。"
 INS_political_events.15.a: "我們不僅獲得了廉價的資源，還獲得了寶貴的盟友"
 INS_political_events.16.t: "[?event_target:INS_invasion_event_invader.GetAdjective]佔領東印度"
 INS_political_events.16.desc: "東印度的[?event_target:INS_invasion_event_invader.GetAdjective]軍隊與印度尼西亞民族主義者合作，動搖了我們的殖民政府的穩定，並完全佔領了東印度。荷蘭國旗已經降下，印度尼西亞國旗升起，東印度群島的原住民似乎正在擁抱[?event_target:INS_invasion_event_invader.GetAdjective]佔領者。這對我們的殖民帝國來說可不是好消息。"
 INS_political_events.16.a: "他們贏得了戰役，但還未贏得戰爭"
 INS_political_events.17.t: "[INS.GetName]宣佈獨立"
 INS_political_events.17.desc: "消息已從巴達維亞傳至帝國大本營。由我們一手扶植起來、以天皇之名治理這些島嶼的蘇加諾及其集團，因應我們接二連三的領土喪失，宣佈成立了[FROM.GetAdjective]共和國。他們認定我們戰線拉得太長，已無力迴天。"
 INS_political_events.17.a: "不幸的是，他們也許是對的"
 INS_political_events.18.t: "陳馬六甲返回印度尼西亞"
 INS_political_events.18.desc: "印度尼西亞共產主義者陳馬六甲，這些年來一直是我國政府信賴的顧問，現已宣佈即刻離去。隨著[INS.GetNameDef]如今成為一個自由的共和國，他終於打算回到那個二十多年前以逃亡者身份踏足過的祖國。他感謝我們給予他的庇護和繼續工作的自由，並僅告知此刻他的位置在故鄉。"
 INS_political_events.18.a: "祝他好運"
 INS_political_events.19.t: "[HOL.GetName]召回海軍將領赫爾弗裡赫"
 INS_political_events.19.desc: "消息已傳到[1058.GetName]，海軍司令、我們在這些水域最有能力的軍官康拉德·赫爾弗裡赫海軍上將已被召回國。海牙方面稱本土有緊迫需要，幾乎沒有做進一步解釋。他的離去讓這片群島在局勢遠未穩固之時防衛薄弱，據說泗水的軍官室中瀰漫著不滿的氣氛。"
 INS_political_events.19.a: "艦隊灰暗的一天"
 ### INS - Industrial Events
 INS_industrial_events.4.t: "[FROM.FROM.GetName]的預算再分配"
 INS_industrial_events.4.desc: "通過關閉[FROM.FROM.GetName]的橡膠種植園，我們為該地區的新工業項目騰出了預算空間。"
 INS_industrial_events.4.a: "我們會在[FROM.FROM.GetName]建立油井"
 INS_industrial_events.4.b: "我們應該在[FROM.FROM.GetName]開設電解鋁廠"
 INS_industrial_events.4.c: "我們應該勘測缺乏生產的資源"
 INS_industrial_events.4.d: "我們可以在[FROM.FROM.GetName]開設煤礦"
 INS_industrial_events.5.t: "[INS_industrial_events_5_t_scripted]"
 INS_industrial_events_5_t_colonial: "爪哇銀行的命運"
 INS_industrial_events_5_t_independent: "印度尼西亞銀行的命運"
 INS_industrial_events.5.desc: "[INS_industrial_events_5_desc_scripted]"
 INS_industrial_events_5_desc_colonial: "爪哇銀行的儲備已降至十年來的最低點。荷蘭盾使用額每月都在減少，種植園主要求以外幣支付。我們的財務顧問一致認為，僅靠銀行無法扭轉這種下滑趨勢，但他們在補救措施上存在嚴重分歧。"
 INS_industrial_events_5_desc_independent: "印度尼西亞銀行報告稱，僅在上一季度，盧比就貶值了近五分之一。泗水的大米商人已開始完全拒收盧比，轉而使用外幣。我們的財政部長堅稱，只有果斷而迅速採取行動，才能拯救貨幣。"
 INS_industrial_events.5.a: "我們應該嘗試加強盾幣，而非取代它"
 INS_industrial_events.5.b: "我們將把東印度盾與荷蘭盾掛鉤"
 INS_industrial_events.5.c: "我們將把東印度盾與美元掛鉤"
 INS_industrial_events.6.t: "更有利可圖的協議"
 INS_industrial_events.6.desc: "金雞納局已經接受了我們的條件。由於瘧疾在一半熱帶地區肆虐，而奎寧的替代品難以找到，他們別無選擇。新協議確保了我們能從出口的每一克奎寧中獲得更大份額的利潤。現在的問題是該將這筆意外之財用於何處。"
 INS_industrial_events.6.a: "投資城市"
 INS_industrial_events.6.b: "開發外部島嶼"
 INS_industrial_events.6.c: "加強軍工業"
 # Rubber shipment dispatched
 INS_industrial_events.28.t: "橡膠已發貨"
 INS_industrial_events.28.desc: "船隊已經裝載了最後一批橡膠並啟航。我們的買家將得到他們所支付的貨物，我方賬目也將如期收到約定的補償。未來兩年，這筆交易的成本將一直留在我們的資產負債表上，時刻提醒我們大蕭條所迫使我們付出的代價。"
 INS_industrial_events.28.a: "已知悉"
 INS_industrial_events.28.b: "安排另一批貨物"
 # Oil shipment dispatched
 INS_industrial_events.36.t: "石油已發貨"
 INS_industrial_events.36.desc: "油輪已駛離我們的煉油廠，全速駛向買方的港口。補償方案已經達成並將全額收到，但這次出售的負擔將在未來兩年壓制我國經濟。在這蕭條的歲月裡，世界留給我們的條件就是這般殘酷。"
 INS_industrial_events.36.a: "已知悉"
 INS_industrial_events.36.b: "安排另一批貨物"
 ### INS - Volksraad
 INS_volksraad_events.2.t: "[HOL.GetLeader]否決人民議會請願"
 INS_volksraad_events.2.desc: "雖然[INS.GetLeader]批准了請願書，但[HOL.GetLeader]在複審後予以了否決。因此，我們目前無法繼續落實。"
 INS_volksraad_events.2.a: "也許我們可以在未來再次嘗試通過請願"
 # Generic/Reused
 INS_volksraad_events.10.t: "人民議會動議允許學校使用印尼語"
 INS_volksraad_events.10.desc: "[INS.GetLeader]批准了人民議會的請願，同意在[INS.GetNameDef]建立印尼語學校和大學，並遞交[HOL.GetLeader]等待最終批准。"
 INS_volksraad_events.10.a: "人民議會派上用場了"
 INS_volksraad_events.10.b: "絕對不行。否決！"
 INS_volksraad_events.11.t: "將建立印尼語教育"
 INS_volksraad_events.11.desc: "[HOL.GetLeader]批准並正式授權了請願。一旦最終細節確定，很快請願就會落實。"
 INS_volksraad_events.11.a: "人民議會派上用場了"
 # Individual laws
 INS_volksraad_events.20.t: "人民議會動議允許政府使用印尼語"
 INS_volksraad_events.20.desc: "東印度政府內，包括人民議會，都需要精通荷蘭語，這導致人民議會的許多成員，特別是原住民社區的代表，質疑其民主的有效性。他們提出了一項動議，堅持認為政府職位應儘可能由講印尼語的人擔任。"
 INS_volksraad_events.21.t: "允許政府使用印尼語！"
 INS_volksraad_events.21.desc: "[HOL.GetLeader]批准並正式授權了請願。一旦最終細節確定，很快請願就會落實。"
 INS_volksraad_events.30.t: "人民議會動議廢除教育配額制度"
 INS_volksraad_events.30.desc: "[INS.GetLeader]同意了人民議會廢除[INS.GetNameDef]教育配額制度的請願，以終結人民議會內部對其執行和公平性的長期爭論。請願書已遞交[HOL.GetLeader]等待最終批准。"
 INS_volksraad_events.31.t: "教育配額制度已被廢除"
 INS_volksraad_events.31.desc: "[HOL.GetLeader]批准並正式授權了請願。一旦最終細節確定，很快請願就會落實。"
 INS_volksraad_events.40.t: "人民議會動議降低橡膠出口稅"
 INS_volksraad_events.40.desc: "[INS.GetLeader]批准了人民議會的請願，同意降低對私有橡膠種植園徵收的高額賦稅。歷史上，此類賦稅建立的橡膠壟斷賦予了政府豐厚的利潤，然而，國際保護主義使得這一制度無利可圖。[INS.GetLeader]認為這一稅種帶來的利益已無法彌補造成的經濟惡果。"
 INS_volksraad_events.40.a: "[INS.GetLeader]說得對啊"
 INS_volksraad_events.40.b: "必須保留這一賦稅"
 INS_volksraad_events.41.t: "對私人橡膠出口的賦稅降低"
 INS_volksraad_events.41.desc: "[HOL.GetLeader]批准並正式授權了請願。一旦最終細節確定，很快請願就會落實。"
 INS_volksraad_events.60.t: "人民議會動議取消印尼軍官不成文的軍銜限制"
 INS_volksraad_events.60.desc: "[INS.GetLeader]批准了人民議會的請願，同意取消不成文的非荷蘭裔荷蘭皇家東印度陸軍軍官的軍銜限制，並晉升本已符合晉升條件的印尼軍官。請願書已遞交[HOL.GetLeader]等待最終批准。"
 INS_volksraad_events.61.t: "[INS.GetAdjective]軍官的無形軍銜限制取消"
 INS_volksraad_events.61.desc: "[HOL.GetLeader]批准並正式授權了請願。一旦最終細節確定，很快請願就會落實。"
 INS_volksraad_events.70.t: "人民議會動議合法化公開展示民族主義旗幟和圖像的行為"
 INS_volksraad_events.70.desc: "[INS.GetLeader]已批准人民議會關於解除在[INS.GetNameDef]公共場所展示民族主義旗幟和圖像限制的請願，這主要是為了減少許多年輕民族主義者的激進傾向。[INS.GetLeader]堅稱我們應在此問題上採取防禦姿態，與和平的民族主義領袖合作，同時扶持我們自己的革命運動，但最終決定權在我們手中。"
 INS_volksraad_events.71.t: "紅白旗的展示不再違法！"
 INS_volksraad_events.71.desc: "[HOL.GetLeader]批准並正式授權了請願。一旦最終細節確定，很快請願就會落實。"
 INS_volksraad_events.100.t: "人民議會動議允許非荷蘭居民享受教育補貼"
 INS_volksraad_events.100.desc: "[INS.GetLeader]已批准人民議會關於允許[INS.GetNameDef]的非荷蘭居民申請教育補貼的請願。該請願已送交[HOL.GetLeader]作最終批准。"
 INS_volksraad_events.101.t: "[INS.GetAdjective]居民現在可以申請教育補貼"
 INS_volksraad_events.101.desc: "[HOL.GetLeader]批准並正式授權了請願。一旦最終細節確定，很快請願就會落實。"
 ### INS - Dutch Interaction Events
 INS_dutch_events.1.t: "[INS.GetNameDefCap]索要海軍指揮權"
 INS_dutch_events.1.desc: "本土淪陷後，[INS.GetNameDef]請求我們將海軍指揮權移交[INS.GetNameDef]。他們認為，在這個前所未有的時期，統一指揮將有助於更好的協調。"
 INS_dutch_events.1.a: "為了更大的利益，我們只能讓步"
 INS_dutch_events.1.b: "我們的船艦隻對海牙負責"
 INS_dutch_events.2.t: "[HOL.GetNameDefCap]同意移交海軍指揮權"
 INS_dutch_events.2.desc: "[HOL.GetNameDefCap]已接受我方提議，允許我方接管聯合海軍部隊的指揮權。交接工作進展順利，[HOL.GetAdjective]與[INS.GetAdjective]軍官正並肩作戰，以加強我們在太平洋地區的地位。"
 INS_dutch_events.2.a: "我們將一起守住太平洋"
 INS_dutch_events.3.t: "[HOL.GetNameDefCap]拒絕移交海軍指揮權"
 INS_dutch_events.3.desc: "[HOL.GetNameDefCap]拒絕了我方關於組建統一海軍指揮部的提議，理由是後勤與行政管理方面的顧慮。儘管令人失望，但我們的合作仍通過戰爭努力的其他渠道繼續進行。"
 INS_dutch_events.3.a: "我們會另尋他法加強海軍影響力"
 INS_dutch_events.4.t: "[HOL.GetNameDefCap]建立[HOL.GetName]-[INS.GetName]海軍計劃"
 INS_dutch_events.4.desc: "[HOL.GetNameDefCap]宣佈創建[HOL.GetName]-[INS.GetName]海軍計劃，這是一項旨在重組和擴充我方海上力量的聯合倡議。[HOL.GetAdjective]的專業知識與[INS.GetAdjective]的人力資源將共同構成新的太平洋防禦網絡的支柱。"
 INS_dutch_events.4.a: "向著共同生存邁出的堅實一步"
 ### INS - Netherlands–Indonesia Union Events
 INS_union_events.1.t: "[HOL.GetNameDefCap]請求將政府遷至[1058.GetName]"
 INS_union_events.1.desc: "由於本土淪陷，[HOL.GetNameDef]已通知我方，其政府與王室將遷往[1058.GetName]。他們提到這是出於必要性、延續性，以及需要讓王國在旗幟仍然飄揚之地繼續存在下去的需要。"
 INS_union_events.1.a: "戰爭將在[1058.GetName]繼續下去"
 INS_union_events.1.b: "他們以為自己是誰！這不過是試圖重申殖民統治！"
 INS_union_events.2.t: "[INS.GetNameDefCap]接受遷都提議"
 INS_union_events.2.desc: "[INS.GetNameDefCap]已同意我方在[1058.GetName]安置流亡政府。搬遷準備工作正在進行中，雙方政府正協調各辦公室與人員的整合。我們將共同在東方高舉王國的火炬。"
 INS_union_events.2.a: "團結一致對抗我們共同的敵人"
 INS_union_events.3.t: "[INS.GetNameDefCap]拒絕遷都提議"
 INS_union_events.3.desc: "[INS.GetNameDefCap]直接拒絕了我方將政府遷至[1058.GetName]的請求。[INS.GetLeader]表示，在他們已經捉襟見肘的情況下，我方無權要求如此程度的援助。"
 INS_union_events.3.a: "看來他們已經忘記了是誰的旗幟仍將我們團結在一起"
 INS_union_events.4.t: "[HOL.GetNameDefCap]將武裝部隊遷至[1058.GetName]"
 INS_union_events.4.desc: "首批運輸船已從祖國抵達。船上擠滿了軍官、士兵和我們軍火庫的殘餘物資。不出所料，一些護航隊未能抵達港口。倖存下來的力量將構成我們在[1058.GetName]部隊的骨幹。"
 INS_union_events.4.a: "足以讓旗幟繼續飄揚"
 # INS proposed union
 INS_union_events.5.t: "[INS.GetNameDefCap]提議組建荷蘭-印度尼西亞聯邦"
 INS_union_events.5.desc: "全世界都清楚，戰爭的形勢對我方不利。我們的國家已淪陷，行動基地已東移。[INS.GetName]的部長們向我們提交了一項提議，組建一個由威廉明娜女王領導的聯合聯邦國家，以保證最大程度的合作。雖然似乎沒有人對此提議特別滿意，但這可能是我們生存的關鍵。"
 INS_union_events.5.a: "這是一項我們必須承擔的風險。女王萬歲！"
 INS_union_events.5.b: "我們不能同意"
 INS_union_events.6.t: "[HOL.GetNameDefCap]接受聯邦提議"
 INS_union_events.6.desc: "經過內閣緊急辯論後，[HOL.GetLeader]批准了[INS.GetAdjective]的提議。法令簡短且毫無儀式感。自此，在戰爭結束前，我們兩國政府將在王權下合為一體。"
 INS_union_events.6.a: "兩國曆史性的協議"
 INS_union_events.7.t: "[HOL.GetNameDefCap]拒絕聯邦提議"
 INS_union_events.7.desc: "[HOL.GetNameDef]的議會拒絕了組建聯合聯邦的提議。他們的信息很堅定：合作將繼續，但主權不會共享。"
 INS_union_events.7.a: "無論如何，這也不太可能成功"
 # HOL proposed union
 INS_union_events.8.t: "[HOL.GetNameDefCap]提議組建荷蘭-印度尼西亞聯邦"
 INS_union_events.8.desc: "全世界都清楚，戰爭的形勢對我方不利。[HOL.GetNameDef]已淪陷，他們的行動基地已東移。[HOL.GetAdjective]領導人向我們提交了一項提議，組建一個由威廉明娜女王領導的聯合聯邦國家，以保證最大程度的合作。雖然似乎沒有人對此提議特別滿意，但這可能是我們生存的關鍵。"
 INS_union_events.8.a: "這是必要之舉"
 INS_union_events.8.b: "這不過是試圖重申殖民統治"
 INS_union_events.9.t: "[INS.GetNameDefCap]接受聯邦提議"
 INS_union_events.9.desc: "[INS.GetNameDefCap]已同意我方提議。目前尚不清楚結果會如何，但我們必須將注意力集中在戰事上。"
 INS_union_events.9.a: "若要熬過難關，我們必須共同熬過"
 INS_union_events.10.t: "[INS.GetNameDefCap]拒絕聯邦提議"
 INS_union_events.10.desc: "[INS.GetNameDefCap]拒絕了聯邦提議。[INS.GetAdjective]人民與領導人認為這無法長期運作，並反對任何放棄權力的提議。"
 INS_union_events.10.a: "無論如何，這也不太可能成功"
 # Flags
 INS_exile_accepted_flag: "正在安置流亡中的[HOL.GetNameDef]"
 INS_hey_btw_you_are_gonna_die_just_know_that_yeah_tt: "§R這會導致遊戲結束。§!"
 # Revolution events
 INS_revolution_events.1.t: "[HOL.GetNameDefCap]採取行動鎮壓共和國"
 INS_revolution_events.1.desc: "不出所料，荷蘭政府對我方的獨立要求作出了回應，向[1058.GetName]派遣了士兵，並通過媒體散佈反共和宣傳。"
 INS_revolution_events.1.a: "我們必須迅速行動"
 INS_revolution_events.2.t: "[HOL.GetNameDefCap]請求額外援助"
 INS_revolution_events.2.desc: "[HOL.GetLeader]已與我方領導人召開緊急會議，請求我方提供進一步援助以重新徵服東印度群島，甚至直接加入衝突。[HOL.GetLeader]表示局勢危急，荷蘭軍隊無法擊退革命民兵。[HOL.GetLeader]承諾，如果我方提供幫助，婆羅洲將作為酬勞。"
 INS_revolution_events.2.a: "為了婆羅洲，我們義無反顧"
 INS_revolution_events.2.b: "我們並不感興趣"
 INS_revolution_events.3.t: "[ENG.GetNameDefCap]同意《倫敦-巴達維亞協議》"
 INS_revolution_events.3.desc: "[ENG.GetNameDefCap]已同意直接加入衝突，派遣數個師前往巴達維亞作戰。雖然我們將不得不放棄婆羅洲，但這使勝算大大地向我們傾斜。"
 INS_revolution_events.3.a: "婆羅洲將是必要的犧牲"
 INS_revolution_events.4.t: "[ENG.GetNameDefCap]拒絕《倫敦-巴達維亞協議》"
 INS_revolution_events.4.desc: "[ENG.GetNameDefCap]拒絕為衝突提供任何進一步援助，儘管情況緊急且我方提供了酬勞。[ENG.GetLeader]表示，雖然維護我方殖民帝國符合他們的最佳利益，但他們的介入導致全球局勢升級的風險過高，我方需要自行處理此事。"
 INS_revolution_events.4.a: "情況不容樂觀"
 INS_revolution_events.5.t: "[HOL.GetNameDefCap]請求我方援助"
 INS_revolution_events.5.desc: "荷屬東印度群島的革命者已宣佈脫離[HOL.GetNameDef]獨立，並佔領了主要城市。[HOL.GetLeader]緊急聯繫我方，請求我們在他們準備入侵的同時提供軍事援助。"
 INS_revolution_events.5.a: "如果革命者成功，我方殖民地的公民可能會受到鼓舞而效仿。"
 INS_revolution_events.5.b: "我們並不感興趣"
 INS_revolution_events.6.t: "[ENG.GetNameDefCap]同意援助我方"
 INS_revolution_events.6.desc: "[ENG.GetNameDefCap]已同意派遣志願部隊和裝備前往[1058.GetName]，幫助我方重新控制東印度群島。"
 INS_revolution_events.6.a: "這會很容易。"
 INS_revolution_events.7.t: "[ENG.GetNameDefCap]拒絕援助我方"
 INS_revolution_events.7.desc: "[ENG.GetNameDefCap]拒絕幫助我方重新控制東印度群島，堅稱東印度群島與己無關，儘管他們距離衝突很近。我方將不得不自行重新武裝荷蘭皇家東印度陸軍。"
 INS_revolution_events.7.a: "這不可接受！"
 INS_revolution_events.8.t: "革命民兵在東印度群島密謀"
 INS_revolution_events.8.desc: "我方在東印度群島的殖民警察逮捕並審訊了印度尼西亞一個正在興起的革命運動的數名成員。他們似乎正試圖建立軍事存在，為發動民族獨立運動做準備。我們尚不確定，但他們可能在密謀武裝革命。"
 INS_revolution_events.8.a: "我們必須密切關注"
 INS_revolution_events.9.t: "印度尼西亞獨立宣言"
 INS_revolution_events.9.desc: "[INS.GetLeader]今天在爪哇發表演講，宣佈新成立的印度尼西亞共和國獨立。雖然我們不承認這個新共和國，但他們的民兵已佔領了領土，我方警察無法治理這些地區。如果我們不認真對待這一局勢，它可能會演變為全面戰爭。"
 INS_revolution_events.9.a: "不可接受！"
 INS_revolution_events.9.b: "這不值得耗費精力，他們既然如此渴望獨立，那就隨他們去吧"
 #INS_revolution_events.10.t: ""
 #INS_revolution_events.10.desc: ""
 #INS_revolution_events.10.a: ""
 INS_revolution_events.11.t: "東印度軍隊成功阻止了民兵的軍事行動"
 INS_revolution_events.11.desc: "一隊共和派民兵發動了一次軍事行動，企圖佔領[?event_target:INS_temp_occupied_state.GetName]。我們在東印度群島英勇的士兵成功將民兵擊退，我們保持對該地區的完全控制。"
 INS_revolution_events.11.a: "[HOL.GetNameDef]的又一次勝利"
 INS_revolution_events.12.t: "民兵試圖佔領[?event_target:INS_temp_occupied_state.GetName]"
 INS_revolution_events.12.desc: "一隊共和派民兵發動了一次軍事行動，企圖佔領[?event_target:INS_temp_occupied_state.GetName]。我方警察和士兵最終設法控制住了局勢，但局勢已在[?event_target:INS_temp_occupied_state.GetName]引發不滿，許多平民支持民兵並公開反對[HOL.GetAdjective]政府。"
 INS_revolution_events.12.a: "我們不能讓事態升級"
 INS_revolution_events.14.t: "民兵佔領了[?event_target:INS_temp_occupied_state.GetName]"
 INS_revolution_events.14.desc: "儘管我們的殖民地警察與士兵竭盡全力，共和派民兵仍成功發動軍事行動，佔領了[?event_target:INS_temp_occupied_state.GetName]。我們的警察和士兵被迫撤離，並宣佈由於民兵的抵抗，該地區已陷入無法治理的狀態。如果繼續任由民兵擺佈，我們將永遠失去我們偉大的殖民地。"
 INS_revolution_events.14.a: "真是駭人聽聞！"
 INS_revolution_no_effect_tt: "無效果"
 INS_revolution_events.19.t: "東印度群島的和平談判"
 INS_revolution_events.19.desc: "[HOL.GetLeader]受邀與[INS.GetLeader]會面，商討可能的和平協議。[INS.GetLeader]表示已有太多生命逝去，並提出了一項兩國方案：大致以現有邊界為準，稍作調整，永久停戰。"
 INS_revolution_events.19.a: "我們必須同意，已經有太多人喪生了"
 INS_revolution_events.19.b: "如果你這麼想要和平，那就投降吧！"
 INS_revolution_events.20.t: "[HOL.GetNameDefCap]同意兩國方案！"
 INS_revolution_events.20.desc: "[INS.GetLeader]與[HOL.GetLeader]的會面帶來了好消息。雙方已達成兩國方案，我們將立即根據新邊界調動部隊。雖然不得不留下我們的印尼同胞令所有人感到遺憾，但結束戰鬥的決定終究是最好的選擇。"
 INS_revolution_events.20.a: "流血衝突終將結束"
 INS_revolution_events.21.t: "[HOL.GetNameDefCap]拒絕停止戰鬥"
 INS_revolution_events.21.desc: "[INS.GetLeader]與[HOL.GetLeader]的會面並未按計劃進行，雙方明顯動怒且拒絕妥協，導致會談提前結束。"
 INS_revolution_events.21.a: "還要再犧牲多少生命？"
 INS_revolution_events.22.t: "[HOL.GetNameDefCap]請求我方援助"
 INS_revolution_events.22.desc: "[HOL.GetLeader]召集與[FRA.GetLeader]在阿姆斯特丹會面，討論東印度群島的持續局勢。會面中，[HOL.GetLeader]解釋了革命者以荷蘭軍隊無法匹敵的速度武裝民兵，[HOL.GetNameDef]面臨失去殖民霸權的風險。[HOL.GetLeader.GetHeShe]請求我方正式加入衝突，站在荷蘭一方，並派遣陸軍師前往巴達維亞協助重新徵服東印度群島。作為交換，一旦秩序恢復，我們將獲得蘇門答臘東北部。"
 INS_revolution_events.22.a: "雖然提供幫助代價高昂，但有蘇門答臘作為報償或許值得一試"
 INS_revolution_events.22.b: "這要求太過分了"
 INS_revolution_events.23.t: "[FRA.GetNameDefCap]同意幫助我們！"
 INS_revolution_events.23.desc: "[FRA.GetNameDefCap]已響應我們的求援，並立即派遣了多支法國陸軍師前往巴達維亞協助我們。"
 INS_revolution_events.23.a: "形勢現在對我們有利"
 INS_revolution_events.24.t: "[FRA.GetNameDefCap]拒絕提供幫助"
 INS_revolution_events.24.desc: "儘管事態緊急，[FRA.GetNameDefCap]仍拒絕幫助我們鎮壓革命。我們必須迅速重新武裝，否則很快就會寡不敵眾。"
 INS_revolution_events.24.a: "情況不容樂觀"
 INS_revolution_events.25.t: "印度尼西亞戰爭的結束"
 INS_revolution_events.25.desc: "[HOL.GetAdjective]軍隊摧毀了主要民兵基地並推翻了共和派政府。共和派精英和指揮官已被逮捕，東印度群島政府正在前共和派領土上重建其統治。作為對我們貢獻的回報，承諾的領土已移交給我國。"
 INS_revolution_events.25.a: "太棒了！"
 INS_revolution_events.26.t: "印度尼西亞戰爭的結束"
 INS_revolution_events.26.desc: "[HOL.GetAdjective]軍隊與共和派民兵的戰鬥時間遠超雙方預期，[HOL.GetLeader]已同意簽署和平協議，實行兩國方案。然而，由於我方仍履行了協議中的義務，[HOL.GetLeader]已確認我們仍將獲得承諾的領土。"
 INS_revolution_events.26.a: "有趣的發展"
 INS_revolution_events.27.t: "印度尼西亞戰爭的結束"
 INS_revolution_events.27.desc: "[HOL.GetAdjective]軍隊與共和派民兵的戰鬥時間遠超雙方預期，儘管[HOL.GetNameDef]和我方的軍事介入都付出了努力，但民兵的數量優勢及其游擊戰性質使衝突陷入僵局，且局勢嚴重偏向共和派。因此，[HOL.GetLeader]今天宣佈已簽署和平協議，實行有利於共和派的兩國方案。東印度群島剩下的只是昔日輝煌的空殼。[HOL.GetLeader]表示，由於衝突以失敗告終，[HOL.GetLeader.GetHeShe]無法將承諾的領土回報給我們的軍事貢獻。"
 INS_revolution_events.27.a: "這簡直瘋了！"
 INS_revolution_events.28.t: "東印度群島的陷落"
 INS_revolution_events.28.desc: "儘管[HOL.GetNameDef]投入了鉅額軍費，且我們也直接進行介入，但印度群島數量龐大的民兵組織仍成功壓倒了我方部隊，佔領了所有主要城市，推翻了荷蘭行政當局並迫使其投降。"
 INS_revolution_events.28.a: "可當初承諾要給我們領土的！"
 INS_revolution_events.29.t: "東印度群島陷落"
 INS_revolution_events.29.desc: "儘管我們竭盡全力，印度群島的革命分子還是佔領了我們的主要城市，並從內部摧毀了殖民政府。我們的將軍被俘虜，通訊線路被切斷。我們別無選擇，只能接受失敗。"
 INS_revolution_events.29.a: "真是場悲劇"
 INS_revolution_events.30.t: "[INS.GetLeader]提議局部停火協議"
 INS_revolution_events.30.desc: "[INS.GetLeader]提議在[FROM.GetName]實行局部停火，承諾如果我們同意，他將從[FROM.GetName]撤軍，以便我方部隊重新掌控該地區。不過，條件是我們暫時推遲重大軍事行動，給革命者留出謀劃時間。"
 INS_revolution_events.30.a: "我們同意"
 INS_revolution_events.30.b: "我們拒絕，我們將武力奪回[FROM.GetName]！"
 INS_revolution_events.31.t: "[HOL.GetNameDefCap]同意與[FROM.GetName]停火"
 INS_revolution_events.31.desc: "停火談判進展順利，[HOL.GetLeader]已同意我們的條件。我們已命令[FROM.GetName]的民兵指揮官立即撤軍。"
 INS_revolution_events.31.a: "希望他們能信守協議"
 INS_revolution_events.32.t: "[HOL.GetNameDefCap]拒絕停火"
 INS_revolution_events.32.desc: "停火談判同計劃產生了偏差，[HOL.GetLeader]拒絕簽署協議，並在達成妥協前突然中斷了談判。"
 INS_revolution_events.32.a: "這不可接受！"
 INS_revolution_events.33.t: "[INS.GetNameDefCap]請求調停"
 INS_revolution_events.33.desc: "印度尼西亞共和派已正式請求我們協助調停，以期與荷蘭達成和解。我們在該地區的顧問報告稱，局勢正在迅速惡化，而荷蘭繼續採取軍事行動，有可能將民族主義者推向蘇聯一方。荷蘭是我們在歐洲的重要盟友，但我們不能忽視東南亞的政治現實。如果我們袖手旁觀導致印度尼西亞落入共產主義陣營，那將是我們的失職。"
 INS_revolution_events.33.a: "派遣調停者"
 INS_revolution_events.33.b: "我們不能拿與荷蘭的關係冒險"
 INS_revolution_events.34.t: "[FROM.GetNameDefCap]同意進行調停"
 INS_revolution_events.34.desc: "華盛頓已同意在我國政府與荷蘭之間進行斡旋。美國特使正在途中，屆時將提出正式停火協議。這是一個絕佳的機會。有世界上最強大的國家支持談判，荷蘭將更難拖延或動用武力。我們必須堅守談判立場，讓美國人施展其最擅長的手段。"
 INS_revolution_events.34.a: "但願荷蘭人能看清形勢"
 INS_revolution_events.35.t: "[USA.GetNameDefCap]宣佈進行調停"
 INS_revolution_events.35.desc: "美國人已介入印尼問題。華盛頓聲稱扮演中立調停者，但其意圖顯而易見。若我們無法達成令其滿意的解決方案，他們將動用巨大的影響力對付我們。我方的談判代表需謹慎應對。我們承受不起失去美國善意的代價。"
 INS_revolution_events.35.a: "我們將按自己的方式來解決此事"
 INS_revolution_events.36.t: "[FROM.GetNameDefCap]拒絕干預"
 INS_revolution_events.36.desc: "美國人拒絕了我們的調停請求。華盛頓選擇站在他們的歐洲盟友一邊，而非支持我們爭取自決的鬥爭。我們只能依靠自己了。這是沉重的打擊，但我們的革命從來不是寄望於外國勢力賜予我們自由。"
 INS_revolution_events.36.a: "沒有他們，我們也能贏得這場戰爭"
 INS_revolution_events.37.t: "[USA.GetNameDefCap]發出最後通牒"
 INS_revolution_events.37.desc: "美國人已失去耐心。華盛頓發出了最後通牒，要求立即停止在印度尼西亞的一切軍事行動，並承認印度尼西亞主權。他們的威脅幾乎毫不掩飾。我們在國際社會的地位經不起與美國公開決裂，我們的經濟也承受不了隨之而來的後果。我方將領堅稱戰役仍能取勝，但代價將是什麼？"
 INS_revolution_events.37.a: "我們別無選擇，只能遵從"
 INS_revolution_events.37.b: "印度尼西亞屬於我們，我們絕不會退讓"
 INS_revolution_events.38.t: "荷蘭投降"
 INS_revolution_events.38.desc: "結束了。荷蘭政府已接受美國的最後通牒，承認了我們的主權。三百五十年的殖民統治，不僅終結於戰場，也終結於談判桌上——有世界最強大的力量支持我們的立場。共和國終於真正地、完全地屬於我們了。"
 INS_revolution_events.38.a: "獨立與自由！"
 INS_revolution_events.39.t: "荷蘭拒絕"
 INS_revolution_events.39.desc: "出乎所有人意料，荷蘭人拒絕了美國的最後通牒。他們的將軍想必認為，在華盛頓採取行動前就能打贏這場戰爭。他們錯了。既然美國人現已公開支持我們的事業，力量對比已發生決定性的轉變。讓他們來吧。我們已不再是孤軍奮戰。"
 INS_revolution_events.39.a: "全世界與我們站在一起"
 INS_revolution_events.40.t: "荷蘭接受我們的條款"
 INS_revolution_events.40.desc: "海牙方面已接受我方最後通牒。駐印尼的荷蘭軍隊將撤離，主權將移交給印度尼西亞共和國。對這段不幸的插曲來說，這是個令人滿意的結局。如今，一個穩定獨立的印度尼西亞比維持荷蘭已無力支撐的殖民統治，更能保障我們在該地區的利益。"
 INS_revolution_events.40.a: "明智的結果"
 INS_revolution_events.41.t: "荷蘭違抗我們"
 INS_revolution_events.41.desc: "海牙已斷然拒絕我們的最後通牒。駐印度尼西亞的荷軍公然違抗美國要求，繼續其軍事行動。這是極其嚴重的誤判。荷蘭不可能一邊在亞洲進行殖民戰爭，一邊指望在歐洲獲得美國的援助。他們迫使我們不得不採取行動。"
 INS_revolution_events.41.a: "那就這樣吧。"
 INS_revolution_events.42.t: "孤注一擲"
 INS_revolution_events.42.desc: "我們駐巴達維亞的情報機構發來報告，共和派敵人正在籌備一場前所未有的行動。他們似乎正準備發起一場顛覆作戰來席捲爪哇，並摧毀我們所有的通信基礎設施，從而確保他們的勝利。然而，這次行動極其冒險，需要他們投入幾乎所有的資源。我方將領估計，他們只能維持此態勢約兩年，且難以輕易抽身。如果我們能拖住他們足夠長的時間，我們就能像捏爛一個熟透的西紅柿一樣，徹底粉碎他們的政府和革命。"
 INS_revolution_events.42.a: "最終決戰就此開始"
 INS_revolution_events.43.t: "[FROM.GetName]的民兵基地已建立"
 INS_revolution_events.43.desc: "我們在[FROM.GetName]的努力取得了成功，當地民兵領袖確認他們已準備好在時機成熟時採取行動。"
 INS_revolution_events.43.a: "我們必須繼續努力。"
 # Chaos Events
 INS_chaos_events.1.t: "泗水戰役"
 INS_chaos_events.1.desc: "獨立宣言發表後，泗水的局勢變得動盪不安。今天，一群效忠荷蘭的分子在舊有的大和酒店屋頂升起了昔日的殖民旗幟。當地的青年運動成員衝進大樓，撤下那些旗幟，升起了紅白相間的印度尼西亞國旗。這一事件已升級為暴力、無組織的衝突。"
 INS_chaos_events.1.a: "理應如此！"
 INS_chaos_events.1.b: "下令停火，我們不能冒事態升級的風險"
 INS_chaos_events.2.t: "社會黨合併"
 INS_chaos_events.2.desc: "印度尼西亞兩大社會黨——由阿米爾·謝里夫丁和蘇丹·沙里爾領導——今天宣佈合併，成立統一的印度尼西亞社會黨。這顯著增強了該黨的政治影響力，可能危及我們的行政當局。"
 INS_chaos_events.2.a: "允許合併"
 INS_chaos_events.2.b: "沒時間搞政治了，宣佈戒嚴！"
 INS_chaos_events.3.t: "對蘇加諾的刺殺失敗"
 INS_chaos_events.3.desc: "今天，一名荷蘭士兵向蘇加諾的汽車開槍，企圖殺害蘇加諾。幸運的是，蘇加諾不在車上，但他的司機受了重傷。雖然這次嘗試沒有成功，但很明顯，這不會是荷蘭士兵和印度尼西亞反對派的最後一次嘗試。"
 INS_chaos_events.3.a: "我們必須恢復秩序！"
 INS_chaos_events.4.t: "蘇加諾遇刺"
 INS_chaos_events.4.desc: "今天，印度尼西亞遭遇了悲劇。蘇加諾面臨了又一場刺殺，但這次成功了。我們不能讓繼承危機爆發，必須迅速恢復秩序，否則共和國就會崩潰。"
 INS_chaos_events.4.a: "副總統哈塔將接任"
 INS_chaos_events.4.b: "社會黨將接管"
 INS_chaos_events.4.c: "廢除共和國，陳馬六甲將帶領我們走向勝利！"
 # Loyalist Events
 INS_loyalist_events.1.t: "[INS.GetLeader]請求調任亨利·溫克爾曼"
 INS_loyalist_events.1.desc: "[INS.GetLeader]已就世界各地持續的衝突和[INS.GetNameDef]所處的危險境地與我們聯繫。[INS.GetLeader]提議將荷蘭皇家東印度陸軍前指揮官亨利·溫克爾曼正式調回[INS.GetNameDef]，以確保殖民地的安全。"
 INS_loyalist_events.1.a: "我們會立即將其調任"
 INS_loyalist_events.1.b: "本土需要亨利·溫克爾曼"
 INS_loyalist_events.2.t: "[HOL.GetLeader]同意調任亨利·溫克爾曼"
 INS_loyalist_events.2.desc: "[INS.GetLeader]在[HOL.GetNameDef]與[HOL.GetLeader]進行了會談，一切進展順利，[HOL.GetLeader]承認當前的局勢，並同意立即調任溫克爾曼。亨利·溫克爾曼正前往[1058.GetName]，他將在那裡等待我們的命令。"
 INS_loyalist_events.2.a: "這將很有幫助"
 INS_loyalist_events.3.t: "[HOL.GetLeader]拒絕調任亨利·溫克爾曼"
 INS_loyalist_events.3.desc: "[INS.GetLeader]在[HOL.GetNameDef]與[HOL.GetLeader]進行了會談，很遺憾，亨利·溫克爾曼不會被派往東印度群島，我們只能在沒有他的情況下保護自己。"
 INS_loyalist_events.3.a: "我們必須儘快想出新方案"
 INS_henri_winkelman_tt: "拒絕調任亨利·溫克爾曼"
 # MALAYA CHAIN - Independent Malaya
 INS_loyalist_events.4.t: "[FROM.GetNameDefCap]提議統一"
 INS_loyalist_events.4.desc: "[FROM.GetAdjective]代表團抵達[ROOT.Capital.GetCapitalVictoryPointName]，提議兩國合併。他們列舉了兩國人民共同的馬來傳承，並指出兩國邊界由歐洲殖民政府劃定，而非由這片土地上的人民決定。該提案將解散兩國政府，並改組為一個國家。"
 INS_loyalist_events.4.a: "我們同意"
 INS_loyalist_events.4.b: "我們必須拒絕"
 INS_loyalist_events.5.t: "[FROM.GetNameDefCap]接受統一"
 INS_loyalist_events.5.desc: "我們的外交官帶著好消息從[FROM.Capital.GetCapitalVictoryPointName]返回。[FROM.GetAdjective]政府同意了我們的提議，他們的官員已開始制定將其領土整合入我們的行政機構的安排。"
 INS_loyalist_events.5.a: "團結使我們更強大！"
 INS_loyalist_events.6.t: "[FROM.GetNameDefCap]拒絕統一"
 INS_loyalist_events.6.desc: "我們的外交官從[FROM.Capital.GetCapitalVictoryPointName]空手而回。[FROM.GetAdjective]政府不願意接受我們的提議。他們並未給出什麼理由，只是將我們的代表團禮送回家。"
 INS_loyalist_events.6.a: "這是他們的損失"
 # MALAYA CHAIN - Subject Malaya (Overlord receives)
 INS_loyalist_events.7.t: "[FROM.GetNameDefCap]要求在[MAL.GetName]舉行全民公投"
 INS_loyalist_events.7.desc: "[FROM.GetNameDefCap]正式要求我們在[MAL.GetName]舉行全民公投，表決是否與他們國家合併。他們的大使對可能的結果直言不諱，表示邊境兩側的馬來人民認為自己屬於同一國家。允許投票幾乎肯定意味著失去[MAL.GetName]。"
 INS_loyalist_events.7.a: "讓人民決定"
 INS_loyalist_events.7.b: "我們不會允許"
 # MALAYA CHAIN - Subject Malaya (MAL receives after overlord agrees)
 INS_loyalist_events.8.t: "[FROM.GetNameDefCap]同意舉行統一全民公投"
 INS_loyalist_events.8.desc: "我們的宗主國已批准[FROM.FROM.GetNameDef]在我國舉行公民投票。[FROM.FROM.GetAdjective]的活動人士已大批抵達，投票將於本月內開始。向人民提出的問題很簡單：我們是否希望加入[FROM.FROM.GetNameDef]，還是希望維持現狀？"
 INS_loyalist_events.8.a: "我們會加入他們"
 INS_loyalist_events.8.b: "我們寧願留下"
 # MALAYA CHAIN - Overlord informed of MAL's choice
 INS_loyalist_events.9.t: "[FROM.GetNameDefCap]投票反對合並"
 INS_loyalist_events.9.desc: "[FROM.GetName]的全民公投結束了。[FROM.GetAdjective]人民決定繼續由我們管理。[FROM.FROM.GetAdjective]活動人士已經離開。"
 INS_loyalist_events.9.a: "意料之中"
 INS_loyalist_events.10.t: "[FROM.GetNameDefCap]投票支持合併"
 INS_loyalist_events.10.desc: "[FROM.GetName]的公投已結束，結果以決定性多數支持與[FROM.FROM.GetNameDef]統一。我們在該地區的行政官員報告稱，這一結果在意料之中。我們有義務尊重這一結果。"
 INS_loyalist_events.10.a: "履行我們許下的承諾。"
 # MALAYA CHAIN - INS receives result
 INS_loyalist_events.11.t: "馬來亞全民公投成功"
 INS_loyalist_events.11.desc: "[MAL.GetName]的人民已投票加入我國。[MAL.GetAdjective]官員正與我國行政當局合作，開始移交權力。馬來世界的版圖上將減少一條邊界。"
 INS_loyalist_events.11.a: "歡迎回家"
 INS_loyalist_events.12.t: "馬來亞統一提案被拒"
 INS_loyalist_events.12.desc: "我們與[MAL.GetName]統一的提案已被拒絕。[MAL.GetAdjective]政府或其上級已決定反對統一。我們必須在更合適的時機重新考慮此事。"
 INS_loyalist_events.12.a: "我們不會忘記"
 INS_loyalist_events.13.t: "[FROM.GetNameDefCap]提出新加坡妥協方案"
 INS_loyalist_events.13.desc: "[FROM.GetAdjective]政府已就新加坡問題向我們提出建議。他們以該島在馬來世界中的地位為由，索取該島的主權。作為回報，他們將保證我們能繼續進出港口和軍事設施，並保留目前擁有的所有資源開採權。"
 INS_loyalist_events.13.a: "公平的交易"
 INS_loyalist_events.13.b: "新加坡不賣"
 INS_loyalist_events.14.t: "新加坡妥協方案被接受"
 INS_loyalist_events.14.desc: "協議被接受了。新加坡將移交我們掌控，而其前控制者保留了對港口的商業和軍事進出權。我們的旗幟如今在亞洲最重要的港口之一飄揚。"
 INS_loyalist_events.14.a: "海峽是我們的"
 INS_loyalist_events.15.t: "新加坡妥協方案被拒絕"
 INS_loyalist_events.15.desc: "我們的提議被拒絕了。新加坡的控制者不願以任何條件放棄該島。我們向他們提供了除主權之外的一切，但這還不夠。"
 INS_loyalist_events.15.a: "那就這樣吧"
 INS_loyalist_events.16.t: "[FROM.GetNameDefCap]索要錫蘭"
 INS_loyalist_events.16.desc: "[FROM.GetAdjective]政府已正式提出移交錫蘭的請求。其外交官援引了該島與馬來世界之間悠久的貿易和民族聯繫。坦白說，這一主張頗為牽強，但[FROM.GetNameDef]已然強大至此，這類請求必須予以慎重考慮。"
 INS_loyalist_events.16.a: "好吧，讓他們拿去"
 INS_loyalist_events.16.b: "錫蘭將仍處於我們的控制之下"
 INS_loyalist_events.17.t: "錫蘭移交"
 INS_loyalist_events.17.desc: "錫蘭的移交已經完成。我方行政部門開始派遣官員前往該島，交接過程未生事端。如今，我們已掌控海峽兩岸的戰略要地。"
 INS_loyalist_events.17.a: "太好了"
 INS_loyalist_events.18.t: "錫蘭請求被拒"
 INS_loyalist_events.18.desc: "我們關於移交錫蘭的請求已被拒絕。當前控制方無意割讓該島，我方外交官報告稱，就此問題進一步討論將毫無結果。"
 INS_loyalist_events.18.a: "再說吧"
 INS_loyalist_events.19.t: "[FROM.GetNameDefCap]要求在巴布亞舉行全民公投"
 INS_loyalist_events.19.desc: "[FROM.GetNameDefCap]要求我們允許在巴布亞東部舉行公投。在[FROM.GetAdjective]一側的邊境，新建的道路穿越叢林，診所配備了政府醫生，而在我們這一側，上任總督三年間只去過兩次莫爾茲比港。[FROM.GetAdjective]大使無需多言，一切已不言自明。"
 INS_loyalist_events.19.a: "讓他們投票"
 INS_loyalist_events.19.b: "我們不會允許這種事"
 INS_loyalist_events.20.t: "巴布亞全民公投通過"
 INS_loyalist_events.20.desc: "澳大利亞人同意舉行全民公投。巴布亞東部每個地區的結果都如出一轍。我們對島嶼西半部的投資，說服力遠勝任何競選海報。"
 INS_loyalist_events.20.a: "島嶼終於完整了"
 INS_loyalist_events.21.t: "巴布亞全民公投被拒絕"
 INS_loyalist_events.21.desc: "澳大利亞人拒絕了。莫爾斯比港總督發表聲明稱，這一要求是對澳大利亞主權的侮辱。這一行為根本無視了巴布亞人民。"
 INS_loyalist_events.21.a: "我們會記住此事的"
 INS_loyalist_events.22.t: "[FROM.GetNameDefCap]索要東帝汶"
 INS_loyalist_events.22.desc: "[FROM.GetAdjective]政府已正式要求我們割讓東帝汶。他們的大使指出，我們在那裡的駐軍不到兩百人，里斯本多年來幾乎沒有向那裡分配任何資源。隨後他質問，我們到底在堅持什麼。"
 INS_loyalist_events.22.a: "不值得為之開戰"
 INS_loyalist_events.22.b: "帝汶是我們的，並將始終如此"
 INS_loyalist_events.23.t: "割讓東帝汶"
 INS_loyalist_events.23.desc: "東帝汶的控制者開始撤離他們的駐軍，並取消那裡的殖民政府。整座島嶼很快將由[INS.GetAdjective]治理。"
 INS_loyalist_events.23.a: "理應如此"
 INS_loyalist_events.24.t: "索要東帝汶被拒"
 INS_loyalist_events.24.desc: "帝力的殖民地總督親自寫信拒絕了我們的要求，堅稱東帝汶仍然是其政府的主權領土。如果內閣希望繼續推進此事，我們的總參謀部已經制定了應急計劃。"
 INS_loyalist_events.24.a: "開始準備吧"
 INS_loyalist_events.25.t: "[FROM.GetNameDefCap]提議統一"
 INS_loyalist_events.25.desc: "[FROM.GetAdjective]代表團抵達我國，提出了兩個共和國合併的方案。他們認為，我們兩國人民有著共同的南島根源，其歷史遠遠早於將我們分開的殖民邊界，一個橫跨群島的單一國家將成為東南亞最重要的勢力。接受意味著解散我們的政府並融入他們的政府。"
 INS_loyalist_events.25.a: "我方接受"
 INS_loyalist_events.25.b: "我們為這個共和國付出了太多努力"
 INS_loyalist_events.26.t: "[FROM.GetNameDefCap]接受統一"
 INS_loyalist_events.26.desc: "[FROM.GetAdjective]政府接受了我們的提議。他們的官員已經在與我們協調，開始整合進程。從亞齊到呂宋，從婆羅洲到棉蘭老島，我們的國家現在橫跨整個馬來群島。"
 INS_loyalist_events.26.a: "新時代開始了"
 INS_loyalist_events.27.t: "[FROM.GetNameDefCap]拒絕統一"
 INS_loyalist_events.27.desc: "[FROM.GetAdjective]政府拒絕了。他們為獨立而進行的抗爭彷彿昨日，那付出的巨大代價讓他們難以割捨主權。該提案已被擱置。"
 INS_loyalist_events.27.a: "遺憾"
 INS_loyalist_events.28.t: "[FROM.GetNameDefCap]要求在[PHI.GetName]舉行全民公投"
 INS_loyalist_events.28.desc: "[FROM.GetNameDefCap]正式要求我們在[PHI.GetName]舉行全民公投，表決是否與他們國家合併。他們的外交官強調，兩國人民有著共同的南島血統，分隔兩國的殖民邊界是人為的。如果投票繼續進行，結果可能會有利於[FROM.GetNameDef]。"
 INS_loyalist_events.28.a: "讓人民表達意見"
 INS_loyalist_events.28.b: "絕不可能"
 INS_loyalist_events.29.t: "同意全民公投"
 INS_loyalist_events.29.desc: "[FROM.FROM.GetNameDefCap]基於兩國共同的南島傳承提議兩國合併。我們的宗主國已同意他們就此事舉行公投，[FROM.FROM.GetAdjective]的活動人士已經開始抵達。結果將決定我們的共和國是加入[FROM.FROM.GetNameDef]還是維持現狀。"
 INS_loyalist_events.29.a: "有趣的提議"
 INS_loyalist_events.29.b: "絕無可能"
 INS_loyalist_events.30.t: "[FROM.GetNameDefCap]投票反對合並"
 INS_loyalist_events.30.desc: "投票箱已經清點完畢，[FROM.FROM.GetAdjective]活動人士打道回府。[FROM.GetAdjective]人民投票決定留下。看來在[FROM.Capital.GetCapitalVictoryPointName]，獨立仍然有其意義。"
 INS_loyalist_events.30.a: "到此為止了"
 INS_loyalist_events.31.t: "[FROM.GetNameDefCap]投票支持合併"
 INS_loyalist_events.31.desc: "投票箱已經清點完畢。[FROM.GetAdjective]人民選擇了[FROM.FROM.GetNameDef]而非我們，差距懸殊。我們的行政人員已收到指令開始移交工作。"
 INS_loyalist_events.31.a: "人民已作出選擇"
 INS_loyalist_events.32.t: "[PHI.GetNameDefCap]投票統一"
 INS_loyalist_events.32.desc: "[PHI.GetAdjective]的公投結果對我們有利。他們的政府已接受結果，並主動聯繫我方外交部安排權力移交。"
 INS_loyalist_events.32.a: "終得統一"
 INS_loyalist_events.33.t: "[PHI.GetNameDefCap]拒絕統一"
 INS_loyalist_events.33.desc: "[PHI.GetAdjective]政府拒絕了我們的統一提議。他們的議會甚至未進行二讀就否決了。我們為他們提供了東南亞最偉大國家的一席之地，他們卻嗤之以鼻。"
 INS_loyalist_events.33.a: "一次挫折，僅此而已"
 INS_communist_events.6.t: "[FROM.GetAdjective]特務在[ROOT.GetName]煽動"
 INS_communist_events.6.desc: "我們的情報部門證實了我們長期以來的懷疑。[FROM.GetNameDefCap]一直在我們境內進行持續的顛覆活動，資助激進小組，散發煽動性傳單，並組織工人罷工。他們的特務已滲入工會和農村合作社，現在公開呼籲推翻我們的政府。局勢已達到臨界點，我們必須果斷行動，以免事態失控。"
 INS_communist_events.6.a: "不可容忍！"
 INS_communist_events.7.t: "[FROM.GetName]境內的共產主義顛覆活動"
 INS_communist_events.7.desc: "我們收到了來自[FROM.FROM.GetName]的令人不安的報告。代表[FROM.GetNameDef]活動的特務一直在當地民眾中煽動革命情緒，利用他們對我國行政當局的不滿，為共產主義奪權爭取支持。如果不加以制止，[FROM.FROM.GetNameDef]可能會完全落入激進分子之手，腐敗還可能進一步蔓延到我們的其他領地。"
 INS_communist_events.7.a: "必須在蔓延之前予以剷除！"
 INS_communist_events.8.t: "[FROM.GetAdjective]宣傳品在[ROOT.GetName]流傳"
 INS_communist_events.8.desc: "源自[FROM.GetAdjective]的傳單和小冊子越來越頻繁地出現在我們的工廠、市場和大學中。它們宣揚階級鬥爭的福音，承諾通過革命實現解放。我們的警方報告稱，這些宣傳在不滿意的人群中找到了一批樂於接受的受眾。材料粗糙但有效，其傳播毫無減緩跡象。"
 INS_communist_events.8.a: "查出是誰在散發這些垃圾！"
 ## Call for Revolution - Main Event (sent to target) ##
 INS_communist_events.1.t: "[ROOT.GetName]的革命"
 INS_communist_events.1.desc: "局勢已惡化到無法挽回的地步。數月來[FROM.GetAdjective]的煽動起了作用，[ROOT.GetName]的共產主義運動已無法通過常規手段遏制。總罷工使城市癱瘓，武裝游擊隊員掌控了數個省份，[FROM.GetAdjective]政府已全力支持革命者。我們的安全部隊捉襟見肘，其忠誠度也不再確定。我們必須現在做出決定：是為國家的生存而戰，還是在更多流血之前接受不可避免的結果。"
 INS_communist_events.1.a: "集結軍隊，我們不會坐以待斃"
 INS_communist_events.1.b: "繼續抵抗只會給人民帶來毀滅"
 INS_communist_events.1.c: "也許給他們一個席位，我們還能控制局面"
 ## Civil War Chosen - sent to Indonesia ##
 INS_communist_events.2.t: "[FROM.GetNameDefCap]選擇戰鬥"
 INS_communist_events.2.desc: "[FROM.GetName]政府拒絕屈服，並已下令武裝部隊以武力鎮壓革命運動。我們在那裡的同志們正在佔領陣地、奪取關鍵據點。鬥爭不會短暫，但[FROM.GetName]人民已做出選擇，我們將確保他們不會孤軍奮戰。"
 INS_communist_events.2.a: "革命在前進"
 ## Surrender - sent to Indonesia ##
 INS_communist_events.3.t: "[FROM.GetNameDefCap]已淪陷"
 INS_communist_events.3.desc: "[FROM.GetName]的舊政府已經投降。面對全面爆發的革命運動，並確知[ROOT.GetNameDef]就站在其背後，他們看不到任何前進的道路，唯有屈服。權力已移交給當地的共產黨，新政府已開始主動聯繫我們尋求指導。又一個民族從舊秩序的桎梏中被解放出來。"
 INS_communist_events.3.a: "全世界勞動人民的偉大勝利"
 ## Civil War in Subject - sent to overlord ##
 INS_communist_events.4.t: "[FROM.GetName]爆發內戰"
 INS_communist_events.4.desc: "在[FROM.FROM.GetNameDef]的支持下武裝和組織起來的共產主義革命者，已在[FROM.GetName]發動公開叛亂。殖民當局已失去對大部分領土的控制，總督報告稱，若無增援，當地駐軍無法恢復秩序。"
 INS_communist_events.4.a: "派出軍隊，[FROM.GetName]是我們的！"
 ## Subject Surrendered - sent to overlord ##
 INS_communist_events.5.t: "[FROM.GetName]落入共產黨之手"
 INS_communist_events.5.desc: "[FROM.GetName]政府未作抵抗便向共產黨叛亂分子投降。總督及其幕僚已被逮捕，我們的國旗被降下，一個革命政府宣告成立。這一切都是由[FROM.FROM.GetNameDef]及其代理人精心策劃的，他們數月來一直在那裡破壞我們的權威。這簡直是盜竊，我們絕不會坐視不管。"
 INS_communist_events.5.a: "這是暴行！"
 # Cooperate with Revolutionaries (sent to target)
 INS_communist_events.9.t: "[FROM.GetAdjective]官員被目擊與異見分子會面"
 INS_communist_events.9.desc: "全國各地都有人發現[FROM.GetAdjective]特工與知名的煽動者和激進領袖為伍。曾經在街角散發傳單的學生組織者，現在正與持有[FROM.GetAdjective]外交文件的人閉門會面。被禁出版物的印刷速度之快，讓警察都來不及沒收；曾經只持續一個下午便偃旗息鼓的抗議活動，現在能讓整個區域停擺數天。這些共產黨人每天都在學習如何更大規模地組織起來，如果我們不迅速採取行動，可能會失去對他們的控制。"
 INS_communist_events.9.a: "馬上清除這些外國代理人！"
 # Spread Anti-Colonialist Sentiment (sent to subject target)
 INS_communist_events.10.t: "[FROM.GetAdjective]言論獲得影響力"
 INS_communist_events.10.desc: "[FROM.GetAdjective]的小冊子一直在軍營和行政部門中流傳，沒收行動收效甚微。它們講述著國家掙脫枷鎖、人民擺脫殖民統治並建立自己家園的故事。如果這些情緒不是那麼切合實際，壓制起來會更容易。即便是忠誠的官員也開始私下發問：我們當前的安排，究竟是為我們的人民服務，還是僅僅為我們的主子服務。"
 INS_communist_events.10.a: "我們必須謹慎行事"
