 ### INS News
 taog_news.1.t: "荷蘭-印度尼西亞聯邦的黎明"
 taog_news.1.desc: "威廉明娜女王昨日在[1058.GetName]出人意料地宣佈成立荷蘭-印度尼西亞聯邦。由於本土遭到佔領，[HOL.GetAdjective]流亡政府與[INS.GetAdjective]當局已達成一致，在王室統領下作為一個國家主體進行管理。兩國官員稱此舉是迫於形勢而非自願選擇，是為了在這兩個大洲上維護王國統一與權威而採取的絕望之舉。"
 taog_news.1.a: "有趣的進展。"
 taog_news.2.t: "印度尼西亞宣佈獨立"
 taog_news.2.desc: "[INS.GetAdjective]的革命領袖[INS.GetLeader]今日在爪哇發表講話，宣佈新成立的印度尼西亞共和國獨立。[HOL.GetNameDef]不承認這個新成立共和國的主權，但共和國民兵已在事實上控制了某些領土。"
 taog_news.2.a: "這可能會引發全球範圍內的重大局勢變化。"
 ############
 ### SIAM ###
 ############
 siam.1.t: "[SIA_phraya_phahon.GetName]捲入醜聞"
 siam.1.desc: "[SIA_phraya_phahon.GetName]被指控以低於市場的價格向官員拋售王家地產，這一醜聞大幅降低了他在人民大會中的合法性。看來[SIA_phraya_phahon.GetName]的影響力即將終結。"
 siam.1.a: "這也許為其他人掃清了障礙？"
 #Spmgsiradet rebellion historical
 siam.2.t: "針對[SIA_plaek_phibunsongkhram.GetName]的第三次暗殺"
 siam.2.desc: "路透社駐曼谷記者的消息透露，這是四年內第三次企圖刺殺暹羅總理（披汶·頌堪先生）的陰謀。\n據悉，上週有人在食物中投毒，頌堪先生及其妻女的健康暫時受到影響。\n英國外交大臣（哈利法克斯勳爵）在致頌堪先生的慰問信中，對這起針對總理生命的懦弱企圖表示震驚，並對其倖免於難感到欣慰。" #https://trove.nla.gov.au/newspaper/article/47990695
 siam.2.a: "到底會是誰幹的？"
 siam.3.t: "披耶·頌素拉德被流放"
 siam.3.desc: "披耶·頌素拉德被指控為針對[SIA_plaek_phibunsongkhram.GetName]的一次或多次暗殺陰謀的幕後主使，並計劃推翻其政府。政府決定解除披耶·頌素拉德的職務，剝奪其軍銜與頭銜，強制退役且不發放養老金，並將其驅逐出境。\n批評者聲稱這是[SIA_plaek_phibunsongkhram.GetName]清除主要政敵的幌子，但這顯然是誹謗。"
 siam.3.a: "一個悲傷的結局。"
 siam.4.t: "頌素拉德支持者被捕"
 siam.4.desc: "凌晨時分，在泰國王家警察的協助下，政府又逮捕了51名嫌疑人及支持者，其中包括蘭實親王、披耶·德帕哈薩丁和披耶·烏東·蓬蓬薩瓦。他們被指控與披耶·頌素拉德共同陰謀叛國，特別值得注意的是，身為王室成員的蘭實親王也將接受審判。一些評論人士質疑，針對親王的行為是否旨在向留在[THIS.GetName]國內的王室成員傳遞一個信號：要麼安分守己，要麼下臺。"
 siam.4.a: "形勢愈發複雜"
 siam.5.t: "十八具屍體的叛亂"
 siam.5.desc: "披汶成立了一個特別法庭，對參與叛亂的51人進行審判，其中25人被判處終身監禁，21人被判處行刑隊槍決。在21名死刑犯中，有三人因功勳顯著被赦免，其中包括蘭實親王和披耶·德帕哈薩丁。"
 siam.5.a: "一錘定音。"
 #Songsuradet rebellion alternative
 siam.6.t: "頌素拉德對峙"
 siam.6.desc: "披耶·頌素拉德被指控是針對[SIA_plaek_phibunsongkhram.GetName]的一起或多起暗殺企圖的幕後主使，並策劃了針對其政府的政變。政府意旨解除頌素拉德的指揮權並將其流放。\n然而，忠於頌素拉德的軍頭阻止了對他的逮捕，譴責此次逮捕具有政治動機。政府與頌素拉德的軍事派系目前陷入僵局，雙方均拒絕退讓。"
 siam.6.a: "我們不會讓步。"
 siam.6.b: "弄巧成拙了。我們還是暫且退讓吧。"
 siam.7.t: "頌素拉德尋求海軍的支持"
 siam.7.desc: "隨著政府軍與頌素拉德軍事集團之間的緊張對峙持續，政府調查人員開始聽到傳聞，稱海軍已與頌素拉德結盟，其明確意圖是抗衡披汶日益增長的獨裁傾向。\n不僅如此，王室的一些助手報告稱，頌素拉德的代表正與高級親王會面，這加劇了人們對王室也將加入反對派陣營的擔憂。"
 siam.7.a: "我們是政府，我們絕不接受訛詐！"
 siam.7.b: "情況正在失控。我們還是暫且退讓吧。"
 #alt-hist actual rebellion
 siam.8.t: "頌素拉德發動叛亂"
 siam.8.desc: "在獲得了足夠的政治和軍事支持後，頌素拉德軍事集團聯合海軍已有效地佔領了[THIS.GetName]的大片地區。凌晨時分，曼谷郊區響起了槍聲，整個國家似乎正處於政府與頌素拉德之間全面內戰的邊緣。"
 siam.8.a: "政府必將存續。"
 #alt-hist actual rebellion
 siam.9.t: "頌素拉德叛亂的終結"
 siam.9.desc: "叛亂已土崩瓦解。隨著頌素拉德被捕，審判成了唯一的餘興，儘管在此時這僅僅是走個過場。陰謀不僅存在於陸軍和海軍中，王室也牽涉其中——蘭實親王被發現公開支持叛軍。對異見分子進行全面深化清洗流毒已成為必然之舉，而非備選方案。"
 siam.9.a: "是時候重建了。"
 #Attack Indochina
 siam.10.t: "勝利！"
 siam.10.desc: "敵人正在潰敗，我們的勝利已成定局。隨著領土被牢牢掌控，舊帝國主義勢力定在瑟瑟發抖。他們怎能不失敗？這是我們天命所歸的跡象。"
 siam.10.a: "為了[ROOT.GetName]！"
 siam.10.b: "實際上，一切進行得很順利"
 siam.11.t: "[FROM.GetAdjective]戰略突破"
 siam.11.desc: "出人意料的是，[FROM.GetAdjective]軍隊在策略上勝過了我方部隊，並奪取了爭議地區的控制權。他們的佔領削弱了我們的權威，並使我們對該地區的主張受到質疑。繼續衝突可能會進一步瓦解紀律和信心，但放棄該領土則意味著在公眾面前承認失敗。"
 siam.11.a: "我們必須止損，進行撤離。"
 siam.11.b: "我們絕不會放棄我國的宣稱！"
 siam.12.t: "[FROM.GetName]接受失敗"
 siam.12.desc: "我們的軍事行動取得了成功。敵人的抵抗已經瓦解，[FROM.GetName]為避免進一步的破壞，已正式放棄對爭議地區的控制。這場勝利提升了我們的地位，並暫時鞏固了我們的邊境。"
 siam.12.a: "我們的力量不可阻擋"
 siam.13.t: "[FROM.GetName]拒絕調解"
 siam.13.desc: "[FROM.GetName]拒絕了所有涉及領土讓步的提議，稱其不可接受。他們的領導層宣稱，只有摧毀我們的國家才能結束這場衝突。"
 siam.13.a: "那就這樣吧"
 siam.14.t: "[FROM.GetNameDefCap]決定全面開戰"
 siam.14.desc: "[FROM.GetNameDefCap]已不再假裝談判。他們的意圖十分明確：徹底征服和吞併我國。這場戰爭的勝負，不再由條約決定，而是取決於徹底的勝利或徹底的失敗。"
 siam.14.a: "決不妥協，決不投降"
 siam.15.t: "[SIA.GetAdjective]突擊停滯"
 siam.15.desc: "[SIA.GetAdjective]部隊的迅速突進或許讓我們措手不及，但隨著他們的壓力日漸增加，表現逐步下滑，弱點已暴露出來。對[SIA.GetAdjective]軍隊而言，原本計劃中的閃電戰已變成一場苦戰。我們可以選擇寬宏大量，提出讓步給他們一條出路，不過，是放他們一馬還是追求徹底的勝利，決定權在於我們。"
 siam.15.a: "提出讓步"
 siam.15.b: "我們只接受完全勝利"
 siam.16.t: "進攻停滯"
 siam.16.desc: "我們的攻勢已陷入僵局，這並非問題所在，問題在於我們的敵人已經察覺到了這一點。他們向我們發出最後通牒，我們要麼立即投降以減少損失，要麼繼續戰爭，承受更多的流血犧牲。唯一的區別在於，我們要埋葬多少逝者。"
 siam.16.a: "那就議和吧"
 siam.16.b: "我們永不投降！"
 siam.17.t: "[FROM.GetName]拒絕投降"
 siam.17.desc: "[FROM.GetName]已明確表示，他們寧願看到整個國家化為灰燼，也絕不會向我們屈服絲毫。戰爭仍在繼續。"
 siam.17.a: "那就如他們所願"
 siam.18.t: "[FROM.GetName]謀求讓我方投降！"
 siam.18.desc: "截獲的敵方高層通訊證實了我們最深重的憂慮：不會有談判達成的和解，也不會有任何讓這場戰爭適度結束的讓步。他們要求的無異於我國的徹底投降，企圖讓我們在又一個帝國主義者的鐵蹄下苟活。如果這就是他們的目標，那麼我們只有一個回答：我們絕不屈服。"
 siam.18.a: "[ROOT.GetNameDefCap]戰鬥到底！"
 siam.19.t: "[SIA.GetName]要求歸還領土"
 siam.19.desc: "[SIA.GetName]被日益增長的民族主義情緒以及我們在此地區表現出的軟弱所煽動，要求我們歸還其認為屬於他們核心領土的地區。他們顯然在不自量力，但隨著世界局勢正一步步邁向戰火紛飛，他們所主張的領土並不一定值得我們為此一戰。"
 siam.19.a: "不值得為之而戰"
 siam.19.b: "混蛋！"
 siam.20.t: "[FROM.GetName]移交領土"
 siam.20.desc: "[FROM.GetName]已決定歸還我們的領土，無論他們是承認了我們對這些領土的主權，還是僅僅面臨來自其他方面的壓力，這些都不重要，我們的事業始終是正義的。"
 siam.20.a: "偉大的一天！"
 siam.21.t: "[FROM.GetName]拒絕交出領土"
 siam.21.desc: "[FROM.GetName]拒絕了我們的要求。這些帝國主義者死抓住上個世紀不放，不願承認這些所謂的“列強”的時代已經終結。"
 siam.21.a: "那我們就讓他們明白"
 SIA_sent_bureaucrats_to_us: "與我們一同培訓公務員"
 SIA_tied_their_currency_to_ours: "將其貨幣與我國貨幣掛鉤"
 SIA_sent_started_cooperative_with_us: "與我國開展合作"
 siam.22.t: "派遣[SIA.GetName]官僚出國學習"
 siam.22.desc: "我們的官僚機構不適合現代經濟，缺乏推動增長所需的必要培訓。幸運的是，有許多國家擁有現代、完善的官僚體系，我們可以派遣他們去那裡獲取經驗，而無需同時引入他們的統治。"
 siam.22.a: "派他們去[ENG.GetName]"
 siam.22.b: "派他們去[JAP.GetName]"
 siam.23.t: "泰銖穩定法"
 siam.23.desc: "在[ROOT.GetName]尋求貿易和金融秩序的同時，泰銖不能繼續無所依託。我們的官員現在認為，貨幣穩定需要一個堅實的外部錨點，一個與有足夠分量的貨幣掛鉤的錨點，以安撫商人、債權人和外國夥伴。我們面前的選擇不僅僅是技術性的。它將決定我們貿易的方向、我們發展的性質，以及最終影響到[SIA.GetAdjective]經濟的外國影響力。"
 siam.23.a: "與英鎊掛鉤"
 siam.23.b: "與日元掛鉤"
 siam.24.t: "[SIA.GetAdjective]發展合作"
 siam.24.desc: "[SIA.GetAdjective]發展合作社為國家提供了新的改善工具，但雄心仍超出國內資本。鐵路、工坊和電氣工程要想快速發展，都需要外部資金。現在有兩條道路擺在我們面前。[ENG.GetAdjective]投資提供了進入成熟市場、經驗豐富的公司和倫敦金融聲望的途徑。[JAP.GetAdjective]投資則承諾與一個渴望擴大影響力的新興亞洲強國建立更緊密的工業夥伴關係。兩條道路都可能加速發展，但都伴隨著相應的義務。"
 siam.24.a: "尋求[ENG.GetName]的投資"
 siam.24.b: "尋求[JAP.GetName]的投資"
 siam.25.t: "巴差提樸之死"
 siam.25.desc: "前國王巴差提樸，其名號承載著舊秩序歷經多年流亡與動盪的記憶，如今他從人間事務中逝去，走進歷史。對一些人來說，他的逝世為始於專制統治結束的那場鬥爭畫上了最後的句號。然而，他所代表的理想並未隨他消亡。王位永存，王朝延續，恢復[ROOT.GetName]尊嚴與穩定的工作現在必須繼續以年輕國王阿南達的名義進行。"
 siam.25.a: "願陛下升入天堂。"
 siam.27.t: "塑造一位國王"
 siam.27.desc: "國王阿南達仍留在[SWI.GetName]，遠離他終將統治的王國。然而，距離並不意味著他超出我們的影響範圍。我們可以選擇他的老師，強調某些學科，鼓勵某些習慣，從而按照我們為[ROOT.GetNameDef]所設想的未來來塑造他的思想。他最終是作為軍人、學者還是更偉大的人物歸來，很大程度上取決於他現在學習的內容。\n\n因為國王如果不是國家的延伸，那什麼才是呢？"
 siam.27.a: "引導他從事學術研究。"
 siam.27.b: "指導他學習軍事事務。"
 siam.27.c: "引導他學習行政與後勤。"
 siam.27.d: "教育他學習工業與發展。"
 siam.28.t: "阿南塔國王的加冕"
 siam.28.desc: "漫長的攝政時期即將結束。在曼谷，面對王子、僧侶、大臣和國家官員，阿南達以自身權利登上王位，接受查克里王朝國王應有的榮譽。典禮宣告著動盪之後的延續，紛爭之後的神聖秩序。對於王國而言，這次加冕不僅僅是一場盛典，更是一份宣言：王權永續，王國未被流放或內亂摧毀，一個屬於[ROOT.GetNameDef]的新統治時代已經開始。"
 siam.28.a: "國王萬歲"
 siam.29.t: "學習常規坦克"
 siam.29.desc: "常規坦克仍然是戰場上的王者，因此我們必須向最強者學習，以建立一支強大的坦克軍團。"
 siam.29.a: "我們會向德國人學習"
 siam.29.b: "我們會向美國人學習"
 siam.29.c: "我們會向英國人學習"
 siam.31.t: "購買潛艇"
 siam.31.desc: "海軍擴充計劃要求我們建立潛艇部隊，我們必須決定向哪國購買潛艇。[ENG.GetNameDef]和[JAP.GetNameDef]都已提出報價——但選擇的意義遠超造船廠本身。"
 siam.31.a: "[ENG.GetAdjective]船能派的上用場"
 siam.31.b: "我們圍繞[JAP.GetAdjective]的設計來建設潛艇部隊"
 siam.32.t: "購買岸防船艦"
 siam.32.desc: "我們的沿海水域需要可靠的防禦艦艇，我們必須慎重選擇供應商。[ENG.GetNameDefCap]和[JAP.GetNameDef]都已做好交付準備——這一決定不僅影響艦隊實力，也將左右我們的對外關係。"
 siam.32.a: "我們將依靠[ENG.GetAdjective]艦船來加強海岸防禦。"
 siam.32.b: "我們將依靠[JAP.GetAdjective]艦船來加強海岸防禦。"
 siam.33.t: "出售曼谷船塢公司"
 siam.33.desc: "曼谷船塢公司的出售已經完成，所得款項現存入國庫。政府必須決定這些資金的最佳流向——是減輕普通民眾的財政負擔，加速國家技術發展，還是增強對國家未來的信心。"
 siam.33.a: "減輕人民的稅負"
 siam.33.b: "將資金撥給海軍研究"
 siam.33.c: "利用這筆意外之財安撫國民"
 siam.34.t: "[FROM.GetAdjective]在我海岸提出的要求"
 siam.34.desc: "[FROM.GetAdjective]的軍隊正向[ROOT.GetNameDef]施壓，其外交官言語間充滿事已成定局的自信。他們提供給我們關於秩序與穩定的慣常說辭，但他們真正尋求的是服從。我們可以屈服，讓國家以殘存的形態存續；也可以依附於他們的陣營，以期保留少許行動自由；又或者，選擇直面強權斷然回絕，命令入侵者離開我們的海岸。"
 siam.34.a: "我們將加入他們的陣營，以保全我們的統治"
 siam.34.b: "讓他們離開我們的海岸"
 siam.35.t: "[JAP.GetNameDefCap]要求我們擴大印鈔"
 siam.35.desc: "[JAP.GetNameDefCap]已明確其期望：我們必須增加貨幣供應以滿足其經濟需求。這一負擔將通過物價上漲轉嫁到我們自己的人民身上，而[JAP.GetAdjective]工業則將坐收漁利。我們幾乎沒有拒絕的餘地。"
 siam.35.a: "順從[JAP.GetNameDef]的要求"
 siam.36.t: "[SIA.GetNameDefCap]要求償還債務"
 siam.36.desc: "[SIA.GetNameDefCap]已正式要求我們償還因強迫其實施的印鈔安排而產生的費用。這一安排曾為我們帶來巨大利益，但現在賬單已經到期。"
 siam.36.a: "履行債務並開始還款"
 siam.37.t: "[JAP.GetNameDefCap]同意償還債務！"
 siam.37.desc: "在我們的要求下，[JAP.GetNameDef]已同意開始償還印鈔安排所產生的經濟成本。這筆補償雖不能完全消除加諸我國人民身上的負擔，但至少能為國庫帶來一些緩解。"
 siam.37.a: "公平的解決方案，我們的經濟將會復甦"
 siam.38.t: "[SIA.GetName]尋求和談"
 siam.38.desc: "[SIA.GetAdjective]政府已向我們提出和談條件。他們的大臣如今不得不承認，我們的槍炮早已證明——[ROOT.GetNameDef]在這場鬥爭中佔據主動。我們可以接受他們的投降，使其臣服，將他們納入我們的陣營，讓他們的政府為我們更宏大的事業服務；也可以拒絕一切妥協，繼續推進戰事，直至完全佔領暹羅。"
 siam.38.a: "接受他們的投降"
 siam.38.b: "不，我們會以武力結束這一切"
 siam.39.t: "[FROM.GetAdjective]政府接受我們的投降"
 siam.39.desc: "[FROM.GetLeader]已選擇接受我們的投降。目前，[ROOT.GetNameDef]雖免於進一步遭受蹂躪，卻難逃屈辱的命運。軍隊受命停止抵抗，政府得以存續僅是依靠強權的寬容。我們保住了國家，卻付出了尊嚴與行動自由的代價。"
 siam.39.a: "我們忍受著必須忍受的一切"
 siam.40.t: "[FROM.GetAdjective]政府拒絕我們的提議"
 siam.40.desc: "[FROM.GetLeader]拒絕了曼谷發出的每一次提議。任何投降都被認為不夠徹底，任何妥協都不可接受。敵人只想通過徹底征服來解決此事。如今，對於[ROOT.GetNameDef]來說，除了抵抗別無選擇。如果他們不願通過協議離開我們的領土，那就必須用武力將他們趕走。"
 siam.40.a: "那就戰鬥"
 siam.41.t: "[FROM.GetNameDefCap]派遣官員來向我們學習治國理政"
 siam.41.desc: "一個[FROM.GetAdjective]官員代表團已抵達，考察學習我國的行政和科研方法。[FROM.GetNameDefCap]顯然有意借鑑外國經驗，推動其官僚體制現代化，並選擇[ROOT.GetNameDef]作為典範。此次訪問是對我國方法的一種含蓄認可，也是與其他政府建立善意的契機。"
 siam.41.a: "我們歡迎他們的代表團"
 siam.42.t: "[FROM.GetNameDefCap]將其貨幣與我國貨幣掛鉤"
 siam.42.desc: "[FROM.GetNameDefCap]已正式決定將其貨幣與我國貨幣錨定。這一決定使[FROM.GetNameDef]更深地進入我國的經濟軌道，並展現出對我國金融機構穩定性的一定信任。我們兩國之間的貿易將變得更可預測，[FROM.GetAdjective]商人與我國商人做生意也會更便利。"
 siam.42.a: "這對我們的貿易關係是可喜的進展"
 siam.43.t: "[FROM.GetNameDefCap]請求開展投資"
 siam.43.desc: "[FROM.GetNameDefCap]已發出邀請，希望我國的工程師和專家協助其國家發展。這項合作為我國工業在該地區提供了一處立足點，並加強了兩國政府間的經濟聯繫。這是個溫和的提議，但隨時間推移，可能會帶來可觀的回報。"
 siam.43.a: "我們很樂意提供協助"
 siam.44.t: "[FROM.GetNameDefCap]下達潛艇訂單"
 siam.44.desc: "[FROM.GetNameDefCap]已下訂單，要建造我國設計的潛艇。這樁買賣代表著對我國造船業一次有分量的信任投票，也將[FROM.GetAdjective]的影響力延伸到了東南亞水域。"
 siam.44.a: "對我國船廠來說是一份可喜的訂單"
 SIA_purchased_submarines_from_us: "從我國購買了潛艇"
 siam.45.t: "[FROM.GetNameDefCap]提議聯盟合併"
 siam.45.desc: "來自[FROM.GetName]的代表團帶來了[FROM.GetLeader]的提議。他們主張，我們各自獨立的聯盟如今追求著同樣的大目標，卻把人員、物資和外交影響力分散在相互競爭的指揮體系之中。\n\n通過將我們的力量與他們合併，我們將建立一個更強大的集團，能夠在更廣闊的戰線上協調戰略。這樣的協議會增強共同事業，但也會要求我們接受[FROM.GetAdjective]對聯盟未來方向的影響力。"
 siam.45.a: "統一的戰線是必要的"
 siam.45.b: "我們的聯盟仍歸我們所有"
 siam.46.t: "[FROM.GetNameDefCap]接受合併"
 siam.46.desc: "[FROM.GetLeader]接受了我們合併聯盟的提議，組成單一聯合體。曾經各自獨立的指揮體系和外交渠道如今正被整合為統一架構，使我們雙方政府能以遠比過去清晰的姿態協調戰爭計劃、物資供應和外交政策。\n\n安排並非沒有麻煩，但團結的必要性佔了上風。"
 siam.46.a: "團結一致，更加強大"
 siam.47.t: "[FROM.GetNameDefCap]拒絕合併"
 siam.47.desc: "[FROM.GetLeader]拒絕了我們將聯盟合併的提議。他們的政府聲稱，利益一致時可繼續合作，但不會將自己的聯盟置於一個由[ROOT.Capital.GetCapitalVictoryPointName]領導的更廣泛聯合體之內。\n\n眼下，我們兩大集團之間的分裂依舊。我們必須在不假定對方全力投入的情況下追求自身目標。"
 siam.47.a: "那我們就單獨行動"
 siam.48.t: "[SIA.GetName]請求[JAP.GetAdjective]援助"
 siam.48.desc: "[SIA.GetNameDefCap]已正式請求軍事援助，以對抗入侵其國家的軍隊。作為回報，[SIA.GetAdjective]政府準備向[JAP.GetAdjective]企業授予獲取戰略資源、基礎設施和商業權利的特權。\n\n支持[SIA.GetName]將擴大我們在東南亞的影響力，併為帝國獲取寶貴資源，儘管這也可能讓我們更深地捲入地區衝突。"
 siam.48.a: "接受他們的提議"
 siam.48.b: "[JAP.GetName]沒有多餘的資源"
 siam.49.t: "[JAP.GetName]接受我方請求"
 siam.49.desc: "[JAP.GetNameDefCap]同意支持[ROOT.GetNameDef]的鬥爭。[JAP.GetAdjective]的顧問、裝備和物資即將開始運抵，同時根據協議，[JAP.GetAdjective]的公司獲得了經濟特許權。\n\n儘管內閣為國家的存續而慶祝，但許多人暗自懷疑，為了這份援助，我們究竟犧牲了多少獨立自主。"
 siam.49.a: "我們有了真正的盟友"
 SIA_japan_aid_request.4.t: "[JAP.GetName]拒絕我方請求"
 SIA_japan_aid_request.4.desc: "[JAP.GetNameDef]政府拒絕了我們的軍事援助請求。東京方面聲稱，帝國目前不能為我們的鬥爭提供人員和物資。\n\n在沒有外援的情況下，[ROOT.GetNameDef]如今只能依靠自身力量抵禦入侵。"
 SIA_japan_aid_request.4.a: "那我們便獨自應戰"
 siam_adc.1.t: "[FROM.GetNameDefCap]要求釋放[?var:SIA_adc_demand_country_to_be_released.GetNameDef]"
 siam_adc.1.desc: "一封正式照會已從[FROM.GetNameDef]送達，[FROM.GetLeader]譴責我們持續佔領亞洲國家，認為這是對其自決權的不可容忍的冒犯。照會指出，亞洲不是任由外國隨意瓜分或管理的戰利品，並要求我方立即撤軍，並在[?var:SIA_adc_demand_country_to_be_released.GetNameDef]恢復一個獨立的政府。\n\n這一要求沒有任何含糊之處。[FROM.GetNameDefCap]期望我們遵照執行，若我們拒絕，將被視為對其國家的蓄意侮辱。"
 siam_adc.1.a: "我們會釋放他們"
 siam_adc.1.b: "他們將繼續被佔領"
 siam_adc.2.t: "[FROM.GetNameDefCap]提議恢復我們的獨立"
 siam_adc.2.desc: "隨著[FROM.GetAdjective]接受[SIA.GetNameDef]關於[ROOT.GetNameDef]未來的要求，[FROM.GetLeader]現在向我們提出了最終問題。佔領當局已做好撤離準備，並表示若我們選擇再次獨立，將承認我們為擁有主權的[ROOT.GetAdjective]政府。\n\n獨立意味著尊嚴和行動自由，但也意味著我們要在沒有[FROM.GetNameDef]保障的情況下重建國家。繼續接受他們的保護儘管顯得低人一等，但在當前局勢不明朗之際，或許能避免國家陷入進一步的混亂。"
 siam_adc.2.a: "我們將成為自由的國家"
 siam_adc.2.b: "我們將繼續託庇於[FROM.GetAdjective]的羽翼下"
 siam_adc.3.t: "[?var:SIA_tag_that_was_released_due_to_sia_pressure.GetName]同意獨立"
 siam_adc.3.desc: "[?var:SIA_tag_that_was_released_due_to_sia_pressure.GetNameDef]政府選擇獨立。佔領政府即將解散，[var:SIA_tag_that_was_released_due_to_sia_pressure.GetNameDef]準備恢復其在世界主權國家中的地位。"
 siam_adc.3.a: "他們的未來在何方？"
 siam_adc.4.t: "[FROM.GetNameDefCap]拒絕獨立"
 siam_adc.4.desc: "儘管有機會獲得自由，但[FROM.GetNameDef]政府拒絕立即獨立。他們的部長們辯稱，國家還未準備好承擔完全的主權，目前更願意維持現狀。"
 siam_adc.4.a: "那就繼續吧"
 siam_adc.5.t: "[FROM.GetNameDefCap]拒絕我方要求"
 siam_adc.5.desc: "[FROM.GetName]已明確表示，我們的要求極其可笑。他們指出，我們薄弱的軍事力量證明我們沒有能力挑戰現狀。"
 siam_adc.5.a: "那我們就讓他們瞧瞧"
 siam_dem_event_count: "軍方正在策劃一場誹謗行動，拖延越久對我們越不利"
 siam_dem.2.t: "陸軍目標"
 siam_dem.2.desc: "在一次部長與高級官員的閉門會議上，一名軍方代表對《黃皮檔案》提案提出了尖銳批評。他指出，提案起草者過多談論國家指導、資源再分配與社會義務，卻很少顧及紀律、財產問題，以及可能加諸軍官團體與農村地區的負擔。在他看來，隨著世界局勢逐月惡化，[ROOT.GetNameDef]絕不可能依靠紙上空談的理論來重塑。"
 siam_dem.2.a: "軍方已闡明其立場"
 siam_dem.3.t: "公開譴責"
 siam_dem.3.desc: "這場爭論已蔓延至委員會會議室之外。一份被普遍視為軍方喉舌的報紙刊登了針對《黃皮檔案》的完整譴責文章，將其描繪成一套用愛國言辭包裝的外來方案。該報編輯警告稱，該提案將階級矛盾置於國家團結之上，削弱了人們對既定體制的信心，並在工農群體中煽動危險的期許。截至下午，這篇文章的內容已在軍營、辦公室和茶坊間廣泛傳播，原本的內部爭論已演變為公開的輿論風波。"
 siam_dem.3.a: "批評聲傳開"
 siam_dem.4.t: "頌堪譴責檔案"
 siam_dem.4.desc: "頌堪已公開且明確有力地介入這場紛爭。他在支持者與軍官面前發表演說，譴責黃皮檔案在實質上具有共產主義色彩——無論其辯護者選用何種說辭。他宣稱，任何將國家凌駕於財產之上、承諾全面社會變革並在底層階級中煽動騷亂的方案，都是在以另一種名義將紅色毒素注入[ROOT.GetNameDef]。"
 siam_dem.4.a: "他毫不含糊"
 siam_dem.5.t: "必須組建政府"
 siam_dem.5.desc: "舊政權已然崩潰，自由泰人運動勝利在望。但勝利不等於治理，推翻披汶的聯合政府在如何善後的問題上遠未達成共識。權力走廊中流傳著三個名字：抵抗運動的良心——比裡·帕儂榮，溫和到足以不得罪任何人的寬·阿派旺，以及麾下軍官們正等著論功行賞的屏·春哈旺將軍。我們此刻扶植誰上臺，將決定未來的和平走向。"
 siam_dem.5.a: "比裡·帕儂榮應當領導國家。抵抗運動贏得了這一權利。"
 siam_dem.5.b: "寬·阿派旺，各派系均可接受的人選。"
 siam_dem.5.c: "屏·春哈旺將軍。軍隊必須佔有一席之地。"
 ###################
 #### AUSTRALIA ####
 ###################
 AST_election_events.1.t.a: "澳聯黨獲勝！"
 AST_election_events.1.t.b: "工黨獲勝！"
 AST_election_events.1.desc.a: "計票完畢：澳大利亞聯合黨贏得了選舉。\n\n澳大利亞聯合黨將經歷短暫的政府組建期，然後在接下來的三年裡證明公民對其代表的信任是正確的。"
 AST_election_events.1.desc.b: "計票完畢：澳大利亞工黨贏得了選舉。\n\n澳大利亞工黨將經歷短暫的政府組建期，然後在接下來的三年裡證明公民對其代表的信任是正確的。"
 AST_election_events.1.a: "人民已作出選擇"
 AST_election_events.2.t: "距離聯邦選舉還有一半時間"
 AST_election_events.2.desc: "$AST_democratic_party_long$自1931年起領導著[AST.GetName]，帶領國家走出大蕭條，遠離反民主情緒。憑藉穩定的領導、保守的傾向和對英國的忠誠，澳大利亞聯合黨鞏固了支持，使連任的可能性日漸增大。然而，還有一個政黨在這方面有話要說。\n\n仍在從1931年使其下臺的不信任動議中恢復元氣的$AST_labor_party_long$正開始重拾勢頭。隨著共產主義聲音被壓制，工人階級現在尋找著另一盞指路明燈。在其代表每一個公民的使命中，工黨對帝國主義和澳大利亞對帝國的忠誠採取了不同的視角。國內需求將放在首位，外國利益不應再被優先考慮。\n\n距離下一屆聯邦選舉還有一年半時間。如果澳大利亞聯合黨想再獲勝利，其領導人必須加快改革以維持公眾支持。否則，澳大利亞工黨的競選活動或許會再次恢復其聲望。"
 AST_election_events.2.a: "澳大利亞聯合黨將實施其最後的改革"
 AST_election_events.2.b: "一場遍及澳大利亞的巡迴競選活動將提升澳大利亞工黨的支持率"
 AST_election_events.3.t: "$AST_election_season_cat$"
 AST_election_events.3.desc: "$AST_election_season_cat_desc$"
 AST_election_events.3.a: "開始了"
 AST_diplomatic_events.1.t: "與澳大利亞的互不侵犯條約"
 AST_diplomatic_events.1.desc: "作為近期外交努力的一部分，澳大利亞政府尋求與幾個選定的亞洲國家簽署互不侵犯協定；我們是其中之一。這一試圖避免戰爭的舉動，無論暴露出澳大利亞官員脫離現實，還是彰顯出他們可敬的天真，我們的回應將在一定程度上決定一切。\n\n我們是否應與[AST.GetName]簽署互不侵犯條約？"
 AST_diplomatic_events.1.a: "毫無疑問——不"
 AST_diplomatic_events.1.b: "的確應該如此"
 AST_diplomatic_events.2.t: "太平洋公約的阻力"
 AST_diplomatic_events.2.desc: "派往[FROM.GetNameDef]的代表團已電告該國對我們互不侵犯條約提議的回應。我們知道這一倡議影響深遠，因此[FROM.GetLeader]的拒絕並不令人意外。"
 AST_diplomatic_events.2.a: "至少這是一次光榮的嘗試"
 AST_diplomatic_events.3.t: "太平洋協定萬歲"
 AST_diplomatic_events.3.desc: "派往[FROM.GetNameDef]的代表團已經電報了該國對我們互不侵犯條約提案的回應。最令人高興的是，[FROM.GetLeader]支持我們的倡議，同意在其上蓋章。"
 AST_diplomatic_events.3.a: "太棒了！"
 AST_diplomatic_events.4.t: "澳大利亞索要新加坡"
 AST_diplomatic_events.4.desc: "[AST.GetNameDefCap]長期以來一直質疑新加坡戰略的可靠性；根據澳大利亞官員的說法，在太平洋戰爭爆發時我們能否前來援助他們是不確定的。將太平洋海軍責任移交給[AST.GetName]將減輕英國的負擔，但這同樣也會將這一負擔轉移到澳大利亞肩上。\n\n我們能否相信，增加澳大利亞的控制權，會比新加坡繼續由我們掌控，讓我們的太平洋屬民和領土處於更有利的地位？"
 AST_diplomatic_events.4.a: "是的，我們可以"
 AST_diplomatic_events.4.b: "新加坡應繼續歸我們所有"
 AST_diplomatic_events.5.t: "英國同意我們的請求"
 AST_diplomatic_events.5.desc: "英國同意將新加坡移交給澳大利亞管轄。這將最終結束過時的新加坡戰略，讓我們掌握自己的國防。"
 AST_diplomatic_events.5.a: "戰略重寫了！"
 AST_diplomatic_events.5.a.tt: "§Y新加坡§!:\n  由§Y澳大利亞§!控制。\n  由§Y澳大利亞§!擁有。\n§Y聖誕島§!:\n  由§Y澳大利亞§!控制。\n  由§Y澳大利亞§!擁有。\n§Y科科斯群島§!:\n  由§Y澳大利亞§!控制。\n  由§Y澳大利亞§!擁有。"
 AST_diplomatic_events.6.t: "英國拒絕我們的請求"
 AST_diplomatic_events.6.desc: "英國拒絕將新加坡移交給澳大利亞管轄。現狀將繼續維持。"
 AST_diplomatic_events.6.a: "新加坡戰略必須堅持下去"
 AST_diplomatic_events.7.t: "[AST.GetName]請求我們的援助"
 AST_diplomatic_events.7.desc: "[AST.GetNameDefCap]希望從盟友那裡獲取裝備用於戰事，並請求我們協助管理所需的運輸。我們能撥出貨船供[AST.GetName]使用嗎？"
 AST_diplomatic_events.7.a: "可以"
 AST_diplomatic_events.7.b: "不行"
 AST_diplomatic_events.8.t: "[USA.GetName]同意我們的請求"
 AST_diplomatic_events.8.desc: "[USA.GetNameDefCap]已同意撥出一定數量的貨船以協助[AST.GetName]的補給。"
 AST_diplomatic_events.8.a: "它們將大有用途！"
 AST_diplomatic_events.9.t: "[USA.GetName]拒絕我們的請求"
 AST_diplomatic_events.9.desc: "[USA.GetNameDefCap]沒有多餘的貨船可提供給[AST.GetName]協助補給。"
 AST_diplomatic_events.9.a: "我們只能靠自己管好後勤"
 AST_diplomatic_events.10.t: "戰時同盟"
 AST_diplomatic_events.10.desc: "[AST.GetNameDefCap]高度重視與[USA.GetNameDef]的盟友關係，現請求將其正式化，建立一個共同的國際戰時聯盟。通過聯合力量，我們兩國可以在當前和未來的衝突中相互協助。"
 AST_diplomatic_events.10.a: "我們必須同意"
 AST_diplomatic_events.10.b: "沒有他們，[USA.GetNameDefCap]會更強大"
 AST_diplomatic_events.11.t: "戰時同盟"
 AST_diplomatic_events.11.desc: "[USA.GetNameDefCap]已同意聯合作戰力量。作為[AST.GetFactionName]的成員，[AST.GetName]和[USA.GetName]將在當前和未來的衝突中相互協助。"
 AST_diplomatic_events.11.a: "我們的敵人將畏懼我們"
 AST_diplomatic_events.12.t: "被拒絕的戰時同盟"
 AST_diplomatic_events.12.desc: "[USA.GetNameDefCap]拒絕了我們的聯合提議。[AST.GetNameDefCap]和[USA.GetName]將在各自的戰爭努力中保持分裂。"
 AST_diplomatic_events.12.a: "我們必須獨自支撐"
 AST_diplomatic_events.13.t: "第六條"
 AST_diplomatic_events.13.desc: "在將澳大利亞各殖民地聯合為聯邦的過程中，新西蘭最終決定不參與。然而，自那時起，《澳大利亞憲法》一直將新西蘭定義為其聯邦的潛在州之一，並確實允許我們加入。\n\n[AST.GetName]現在聲稱，當前的世界局勢要求團結，請求[NZL.GetName]移交給澳大利亞管轄。我們是否應就此問題舉行公投？"
 AST_diplomatic_events.13.a: "我們同意"
 AST_diplomatic_events.13.a.tt: "將舉行公投，可能導致§Y[NZL.GetName]§!被§R吞併§!"
 AST_diplomatic_events.13.b: "決不可能！"
 AST_diplomatic_events.14.t: "[NZL.GetNameDefCap]成為澳大利亞的一個地區"
 AST_diplomatic_events.14.desc: "根據最近舉行的公投，[NZL.GetName]決定援引《澳大利亞憲法》第六條。新西蘭人同意，他們的土地在澳大利亞的治理下更加安全，因此同意加入[AST.GetNameDef]。"
 AST_diplomatic_events.14.a: "澳大利亞擴張了"
 AST_diplomatic_events.15.t: "新西蘭公眾抵制"
 AST_diplomatic_events.15.desc: "根據最近舉行的公投，[NZL.GetName]決定不援引《澳大利亞憲法》第六條。[NZL.GetNameDefCap]將繼續作為一個獨立國家存在。"
 AST_diplomatic_events.15.a: "澳大利亞將保持現狀"
 AST_diplomatic_events.16.t: "[NZL.GetNameDefCap]官員抵制"
 AST_diplomatic_events.16.desc: "儘管受到澳大利亞的壓力，[NZL.GetName]決定不舉行公投以援引《澳大利亞憲法》第六條。[NZL.GetNameDefCap]將繼續作為一個獨立國家存在。"
 AST_diplomatic_events.16.a: "澳大利亞保持現狀"
 AST_diplomatic_events.17.t: "澳大利亞夥伴關係"
 AST_diplomatic_events.17.desc: "敵人正從北方逼近，它抵達我們家門口只是時間問題——或者至少澳大利亞官員是這麼聲稱的。[AST.GetNameDefCap]提議我們聯合起來形成一個單一屏障，首選方案是將[INS.GetName]置於澳大利亞管轄之下，但至少也應得到軍事通行權。"
 AST_diplomatic_events.17.a: "同意置於澳大利亞管轄之下"
 AST_diplomatic_events.17.a.tt: "§Y[INS.GetNameDefCap]§!將成為§Y[AST.GetNameDefCap]§!的§Y傀儡國§!。"
 AST_diplomatic_events.17.b: "提供軍事通行權"
 AST_diplomatic_events.17.b.tt: "§Y[INS.GetNameDefCap]§!將與§Y[AST.GetNameDefCap]§!達成§Y軍事通行權§!協議。"
 AST_diplomatic_events.17.c: "兩項均不同意"
 AST_diplomatic_events.18.t: "[INS.GetNameDefCap]接受澳大利亞的要求"
 AST_diplomatic_events.18.desc: "[INS.GetName]已同意我們的請求；我們的合作將極大地影響我們兩國的防禦能力。"
 AST_diplomatic_events.18.a: "好極了！"
 AST_diplomatic_events.19.t: "[INS.GetNameDefCap]拒絕"
 AST_diplomatic_events.19.desc: "[INS.GetName]已拒絕我們的請求；我們兩國將不得不自行負責各自的防禦。"
 AST_diplomatic_events.19.a: "[AST.GetNameDefCap]將在沒有他們的情況下度過沖突"
 AST_diplomatic_events.20.t: "召集英國戰時內閣"
 AST_diplomatic_events.20.desc: "[GET_AST_BWC_COUNT][ENG.GetNameDefCap]召集澳大利亞總理參加英國戰時內閣。世界局勢嚴峻，促使英國與其盟友尋求共同戰略和軍事合作。\n\n然而，澳大利亞有自己的考量。為了取悅英國，我們能抽出總理的一些時間嗎？"
 AST_diplomatic_events.20.a: "[AST.GetLeader]將啟程前往英國"
 AST_diplomatic_events.20.b: "這裡需要他"
 AST_bwc_count_2: "[ENG.GetLeader]第二次請求[AST.GetLeader]與會，聲稱我們之間的密切合作將決定共同鬥爭之結局。\n\n"
 AST_bwc_count_3: "又一次，[AST.GetLeader]被要求遠渡重洋，以維護英聯邦的合作。然而，只要我們明確自己的利益究竟是在於共同努力，還是在於打理好自己的事務，預計就不會再有更多此類要求了。\n\n"
 AST_bwc_accept_effect_tt: "§Y接受3次會議召集的效果：§!"
 AST_bwc_accept_tt: "接受§Y[?var:AST_bwc_accept]§!/§Y3§!次會議召集"
 AST_diplomatic_events.22.t: "對英國戰時內閣的成功貢獻"
 AST_diplomatic_events.22.desc: "在過去一年裡，澳大利亞總理定期出席英國戰時內閣。儘管[AST.GetNameDef]本身有時不得不付出代價，但通過英國的軍事合作，我們國家現在變得更加強大。"
 AST_diplomatic_events.22.a: "到頭來，代價是值得的"
 AST_diplomatic_events.23.t: "[ENG.GetLeader]不再尋求澳大利亞戰爭影響力"
 AST_diplomatic_events.23.desc: "[ENG.GetNameDefCap]已多次召集澳大利亞總理參加英國戰時內閣，但在屢次遭到拒絕後，[ENG.GetLeader]認為沒有再繼續這樣做的理由。"
 AST_diplomatic_events.23.a: "嗯，那好吧"
 AST_diplomatic_events.24.t: "領導權更迭"
 AST_diplomatic_events.24.desc: "澳大利亞總理對英聯邦的戰時事務影響重大。羅伯特·孟席斯定期訪問倫敦期間，在英國首相威信漸失之際，他贏得了英國大臣們的信任。如今，大臣們已向[ENG.GetNameDef]領導人施壓，要求其辭職，並讓孟席斯取而代之。\n\n儘管[AST.GetName]失去了自己的總理，他們卻因此獲得了來自宗主國的永久忠誠，受到如今執掌英國政權的澳大利亞同胞的庇護。這片南方大陸渴望更大的自治權，而羅伯特·孟席斯則是首位為此署名之人。"
 AST_diplomatic_events.24.a: "局勢正在改變"
 AST_diplomatic_events.25.t: "在堪培拉統治之下"
 AST_diplomatic_events.25.desc: "太平洋國家間日益緊張的局勢令人擔憂，而英國正忙於應對自身的戰事，我們似乎無力救援我們的屬地——至少[AST.GetName]如此聲稱。\n\n他們意圖重組英聯邦，以便由堪培拉直接管轄太平洋和印度洋諸國。我們是否同意？"
 AST_diplomatic_events.25.a: "我們將如此；太平洋地區將在中央集權下得到加強"
 AST_diplomatic_events.25.b: "絕不！"
 AST_diplomatic_events.26.t: "太平洋聯邦"
 AST_diplomatic_events.26.desc: "[ENG.GetNameDefCap]已同意；太平洋地區將在集中管控下得到加強。英國在太平洋的領地現已交由我們管轄。"
 AST_diplomatic_events.26.a: "太平洋諸國聯合起來。"
 AST_diplomatic_events.27.t: "英國拒絕我方請求"
 AST_diplomatic_events.27.desc: "[ENG.GetNameDefCap]反對；太平洋地區不會在集權管控下得到強化。太平洋各領地仍將在我們英國的管轄之下。"
 AST_diplomatic_events.27.a: "然而，澳大利亞必將堅持到底"
 AST_diplomatic_events.28.t: "[ENG.GetLeader]掛斷電話"
 AST_diplomatic_events.28.desc: "首相與[ENG.GetLeader]通過電話產生的爭執，幾乎沒有給澳大利亞帶來任何增援，反而加劇了英國對[AST.GetLeader]為澳大利亞爭取利益一事的不滿。"
 AST_diplomatic_events.28.a: "澳大利亞必須自行防衛"
 AST_diplomatic_events.29.t: "英國來援"
 AST_diplomatic_events.29.desc: "在澳大利亞向[ENG.GetNameDef]施壓，促使其挑起與[JAP.GetName]的衝突之後，英國已同意支持我們的防禦工事建設。"
 AST_diplomatic_events.29.a: "援助固然很好，但無法阻止日本發動戰爭"
 AST_diplomatic_events.30.t: "澳大利亞請求資源開採權"
 AST_diplomatic_events.30.desc: "擴張主義的侵略者覬覦印度支那，不僅是為其領土，更是為其所擁有的資源。如果這些財富落入敵手，戰爭將繼續延長，而由澳大利亞掌握，則可能幫助結束戰爭——至少澳大利亞政府如此聲稱。\n\n我們是否同意授予他們在我國境內的資源開採權？"
 AST_diplomatic_events.30.a: "我們同意"
 AST_diplomatic_events.30.b: "這些資源也不該給[AST.GetName]"
 AST_diplomatic_events.31.t: "[FROM.GetNameDefCap]給予[AST.GetName]資源開採權"
 AST_diplomatic_events.31.desc: "擴張主義的侵略者覬覦印度支那，不僅是為其領土，更是為其所擁有的資源。如果這些財富落入敵手，戰爭將繼續延長，而由澳大利亞掌握，則可能幫助結束戰爭——至少澳大利亞政府如此聲稱。\n\n[ROOT.OVERLORD.GetNameDefCap]已同意該請求。"
 AST_diplomatic_events.31.a: "這已超出我們的控制範圍"
 AST_diplomatic_events.32.t: "[FROM.GetNameDefCap]給予資源開採權"
 AST_diplomatic_events.32.desc: "[FROM.GetNameDefCap]認同印度支那的資源由澳大利亞掌控更為妥當，並已給予我們資源開採權。"
 AST_diplomatic_events.32.a: "他們將大派用場"
 AST_diplomatic_events.33.t: "[FROM.GetNameDefCap]拒絕給予資源開採權"
 AST_diplomatic_events.33.desc: "[FROM.GetNameDefCap]並不認同將印度支那的資源交由澳大利亞掌控會更加妥當，並拒絕給予我們資源開採權。"
 AST_diplomatic_events.33.a: "我們希望它們不會落入敵手"
 AST_diplomatic_events.34.t: "[AST.GetNameDefCap]請求劃分太平洋領土"
 AST_diplomatic_events.34.desc: "[AST.GetNameDefCap]提議訂立一項協定，旨在化解我們兩國之間的潛在衝突。通過劃分我們在太平洋的勢力範圍，雙方可規劃各自的未來擴張，而無需擔心對方干涉。"
 AST_diplomatic_events.34.a: "條約似乎有道理"
 AST_diplomatic_events.34.b: "[JAP.GetNameDefCap]將按自己的意願擴張"
 AST_diplomatic_events.35.t: "太平洋已劃分"
 AST_diplomatic_events.35.desc: "[AST.GetNameDefCap]和[JAP.GetNameDefCap]已就各自可以擴張進入哪些太平洋領土達成一致。希望這能避免我們兩國之間未來任何潛在的衝突。"
 AST_diplomatic_events.35.a: "已解決！"
 AST_diplomatic_events.36.t: "太平洋將自行劃分"
 AST_diplomatic_events.36.desc: "[JAP.GetNameDefCap]不同意在我們兩國之間劃分太平洋領土；日本政府將按自己的意願擴張。"
 AST_diplomatic_events.36.a: "澳大利亞也是如此"
 AST_diplomatic_events.37.t: "宗主權的轉移"
 AST_diplomatic_events.37.desc: "出於未知原因，[AST.GetName]決定將我們土地的控制權移交給[JAP.GetNameDef]。幕後正醞釀著某種不祥之事，世界發現真相只是時間問題。"
 AST_diplomatic_events.37.a: "顯然，此事我們別無選擇"
 AST_diplomatic_events.38.t: "瑙魯條約"
 AST_diplomatic_events.38.desc: "作為第一次世界大戰的結局，太平洋上的幾塊德國屬地曾交由澳大利亞管轄。然而如今，我們或許有望收回其中一處領土：瑙魯島。\n\n[AST.GetFascistParty]所秉持的價值觀與我國利益不謀而合，其中之一便是推動[AST.GetName]徹底脫離[ENG.GetNameDef]。由於該黨目前影響力尚弱，其代表希望獲得我方支持以壯大自身勢力。他們承諾，一旦完全掌握政權，便將瑙魯島的控制權交還我方——前提是我國在其爭取獨立的進程中能為其提供庇護保障。"
 AST_diplomatic_events.38.a: "我們的領土將回歸！"
 AST_diplomatic_events.38.b: "我們不能承諾空洞的諾言"
 AST_diplomatic_events.39.t: "[GER.GetNameDefCap]同意瑙魯條約"
 AST_diplomatic_events.39.desc: "[GER.GetNameDefCap]與[AST.GetFascistParty]已就共同目標達成一致：[AST.GetName]應當實現獨立。鑑於[AST.GetFascistParty]當前政治影響力有限，[GER.GetNameDef]將提供資助以加速其發展，等到我們影響力不再受限時，此項協議將全面落實。"
 AST_diplomatic_events.39.a: "太棒了！"
 AST_diplomatic_events.40.t: "瑙魯條約破滅"
 AST_diplomatic_events.40.desc: "由於無法承諾尚無法履行的諾言，[GER.GetNameDef]拒絕支持我們掌權。瑙魯條約還未開始就已結束，[AST.GetFascistParty]的雄心完全落在了我們肩上。"
 AST_diplomatic_events.40.a: "[AST.GetFascistParty]將在沒有德國支持的情況下繼續。"
 AST_diplomatic_events.41.t: "瑙魯迴歸德國之手"
 AST_diplomatic_events.41.desc: "現在已完全掌權的[AST.GetFascistParty]信守承諾，履行了自己一方的約定。瑙魯已歸還[GER.GetNameDef]，我們則將確保澳大利亞的獨立。"
 AST_diplomatic_events.41.a: "那就這麼定了。"
 AST_diplomatic_events.42.t: "[AST.GetFascistParty]背棄承諾"
 AST_diplomatic_events.42.desc: "承諾有一個致命缺陷——它們可以被打破。現在掌權後，[AST.GetFascistParty]的領導人決定，不僅瑙魯要歸他們所有，其他太平洋島嶼他們也要奪取。\n\n我們的舊太平洋領地仍將和簽署《瑙魯協定》前那般遙不可及。如果我們想要改變這種狀況，那就只能訴諸戰爭。"
 AST_diplomatic_events.42.a: "未來將決定其後果"
 AST_diplomatic_events.43.t: "[AST.GetNameDefCap]索要東南亞"
 AST_diplomatic_events.43.desc: "[AST.GetName]宣稱，通過向北擴張，我們能夠增強雙方在東南亞談判與衝突中的共同影響力。儘管這並未被明確提出，但[AST.GetLeader]暗示，拒絕並不是一個可以接受的選項。"
 AST_diplomatic_events.43.a: "既然我們的注意力在別處，那這樣最好"
 AST_diplomatic_events.43.b: "無論如何，他們得到的將只有拒絕"
 AST_diplomatic_events.44.t: "移交東南亞"
 AST_diplomatic_events.44.desc: "[ENG.GetNameDefCap]明智地同意將其東南亞領土轉讓予我方。隨著澳大利亞疆界的拓展，我們的影響力亦隨之延伸，整個世界成為我們的囊中之物只是時間問題。"
 AST_diplomatic_events.44.a: "前途一片光明"
 AST_diplomatic_events.45.t: "東南亞維持現狀"
 AST_diplomatic_events.45.desc: "[ENG.GetNameDefCap]拒絕了將其東南亞領土移交給我們。儘管如此，控制該地區的吸引力對我們而言依然顯而易見。雖然無法通過請求得手，但我們總有一天能將其收入囊中。"
 AST_diplomatic_events.45.a: "是的，總有一天"
 #AST_diplomatic_events.46.t was removed
 AST_diplomatic_events.47.t: "分擔負擔"
 AST_diplomatic_events.47.desc: "儘管最近脫離了英聯邦，[AST.GetName]仍提出軍事合作。[AST.GetName]聲稱，考慮到[ENG.GetNameDefCap]在全球範圍內分身乏術，共同分擔責任將對其更有利。"
 AST_diplomatic_events.47.a: "我們同意"
 AST_diplomatic_events.47.b: "我們將自力更生"
 AST_diplomatic_events.48.t: "英澳協定"
 AST_diplomatic_events.48.desc: "[ENG.GetNameDefCap]已同意簽署互不侵犯條約，為軍事合作奠定基礎。"
 AST_diplomatic_events.48.a: "這標誌著我們關係的新篇章"
 AST_diplomatic_events.49.t: "未簽署的條約"
 AST_diplomatic_events.49.desc: "[ENG.GetNameDefCap]拒絕簽署互不侵犯條約。因此，我們試圖建立兩國軍事合作的努力失敗了，我們必須獨自向外推進。"
 AST_diplomatic_events.49.a: "我們確實必須如此"
 AST_diplomatic_events.50.t: "澳大利亞太平洋駐軍"
 AST_diplomatic_events.50.desc: "儘管保護東南亞和太平洋地區符合英國利益，但該地區距離不列顛群島十分遙遠，[FROM.GetName]對此也心知肚明。作為我們提供物資支持的交換，[FROM.GetName]提出由其負責該地區的防務，以便讓我們能將注意力轉向其他地方。"
 AST_diplomatic_events.50.a: "歡迎[FROM.GetName]的幫助"
 AST_diplomatic_events.50.b: "這地區足夠近"
 AST_diplomatic_events.51.t: "[ENG.GetNameDefCap]的太平洋駐軍"
 AST_diplomatic_events.51.desc: "[FROM.GetNameDefCap]同意；東南亞海域將由我方負責保護。作為英國提供燃料的交換條件，[ROOT.GetName]將致力於增強在我國鄰近海域的制海權。"
 AST_diplomatic_events.51.a: "這片水域屬於我們"
 AST_diplomatic_events.52.t: "澳大利亞太平洋駐軍"
 AST_diplomatic_events.52.desc: "[FROM.GetNameDefCap]不同意；他們不需要幫助來保衛東南亞水域。但無論有沒有英國的支持，[ROOT.GetName]都將致力於增強在鄰近水域的海上主導地位。"
 AST_diplomatic_events.52.a: "這片水域屬於我們"
 AST_diplomatic_events.53.t: "維希法國退出非洲"
 AST_diplomatic_events.53.desc: "[AST.GetName]推測，維希法國的倒臺或合作是[ENG.GetNameDef]的主要目標之一，因此提議參與行動，在壓制維希政權前持續追索法國非洲殖民地。雖然這項提議背後可能隱藏著未知的意圖，但盟軍在該地區增加存在無疑將對我們有利。\n\n若我方予以許可，[AST.GetName]將啟動與維希法國的談判，尋求其殖民地的和平移交，並建立澳大利亞駐防力量。"
 AST_diplomatic_events.53.a: "我們歡迎他們的支持"
 AST_diplomatic_events.53.b: "[AST.GetName]利用它對付我們的風險太大"
 AST_diplomatic_events.54.t: "施以援手"
 AST_diplomatic_events.54.desc: "[ENG.GetNameDefCap]同意：盟軍在非洲增加存在將對英聯邦有利。\n\n我們將啟動與維希法國的談判，尋求其殖民地的和平移交，並建立澳大利亞駐防力量。"
 AST_diplomatic_events.54.a: "那是自然"
 AST_diplomatic_events.55.t: "無論有無許可"
 AST_diplomatic_events.55.desc: "[ENG.GetNameDefCap]拒絕了澳大利亞在非洲的援助，並將自行處理維希法國事宜。然而，我們的野心並非輕易就能被改變。\n\n若能控制維希法國的非洲領土，澳大利亞將成為與英聯邦平起平坐的力量，而非其附庸。儘管違背[ENG.GetNameDef]的意願，我們必須繼續爭取這些領土，即便這意味著不得不動用武力。"
 AST_diplomatic_events.55.a: "我們將擴張"
 AST_diplomatic_events.56.t: "[AST.GetName]要求非洲領土"
 AST_diplomatic_events.56.desc: "[AST.GetName]代表[ENG.GetNameDef]前來，要求我們移交非洲領土。\n\n[ENG.GetNameDefCap]決意擴大在非洲的控制範圍。若我們不願屈從於澳大利亞的佔領，他們將以武力再次登門。"
 AST_diplomatic_events.56.a: "為避免衝突，相關領土予以移交"
 AST_diplomatic_events.56.b: "那麼，就讓他們帶著武力來"
 AST_diplomatic_events.57.t: "維希法國移交非洲領土"
 AST_diplomatic_events.57.desc: "維希法國已同意移交我們索取的非洲領土，並已允許澳大利亞駐軍接管當地的控制權。"
 AST_diplomatic_events.57.a: "繼續在非洲擴張！"
 AST_diplomatic_events.58.t: "維希法國拒絕移交[AST.GetName]領土"
 AST_diplomatic_events.58.desc: "維希法國拒絕將非洲領土移交給我們。然而，這並非請求，而是要求。\n\n我們將奪取他們拒絕給予我們的這片地區，儘管只能訴諸武力。"
 AST_diplomatic_events.58.a: "[AST.GetName]必須擴張，無論通過和平還是武力"
 #AST_diplomatic_events.59 was removed
 #AST_diplomatic_events.60 was removed
 #AST_diplomatic_events.61 was removed
 AST_diplomatic_events.62.t: "反英協定？"
 AST_diplomatic_events.62.desc: "來自[AST.GetName]的外交官向我們提出了一項建立反英同盟的提議。這將意味著他們協助我們從盎格魯人手中收復北愛爾蘭，而我們無需直接介入。\n\n作為回報，如果他們成功，我們將加入他們的派系，並在未來與英國的戰爭發生時協助他們。\n\n雖然與北方統一很有吸引力，但我們必須慎重考慮，我們是否有能力以這種方式與更強大的鄰國為敵，更重要的是，若發生衝突，我們能否取得勝利——否則整個愛爾蘭將再次淪為英國的殖民地。"
 AST_diplomatic_events.62.a: "統一不能等！簽署協定！"
 AST_diplomatic_events.62.b: "這太危險了"
 AST_diplomatic_events.63.t: "愛爾蘭拒絕！"
 AST_diplomatic_events.63.desc: "愛爾蘭拒絕簽署反英協定。"
 AST_diplomatic_events.63.a: "那就讓愛爾蘭繼續分裂吧"
 AST_diplomatic_events.64.t: "愛爾蘭同意！"
 AST_diplomatic_events.64.desc: "愛爾蘭同意簽署反英協定。"
 AST_diplomatic_events.64.a: "前進，到貝爾法斯特！"
 AST_diplomatic_events.65.t: "[FROM.GetName]提供支援" ### Support for the Chinese Communists - Sends event from AST to PRC offering support
 AST_diplomatic_events.65.desc: "[FROM.GetNameDef]國內[FROM.GetCommunistParty]日益增長的影響力如今初見成效——其代表跨越中國，告知我們有一支[FROM.GetAdjective]支援我方部隊的志願部隊正在集結。此外，這些志願者還帶來了備用裝備，以幫助裝備我方軍隊。"
 AST_diplomatic_events.65.a: "與我們[FROM.GetAdjective]的同志進行合作的良好開端"
 #AST_diplomatic_events.65.b: "They should focus on their own revolution"
 AST_diplomatic_events.66.t: "[FROM.GetName]感謝我們的支援" ### Support for the Chinese Communists - They accept
 AST_diplomatic_events.66.desc: "[FROM.GetLeader]的代表轉達了他對我們志願者的支持及所提供戰爭物資的感謝。[FROM.GetAdjective]在內戰中積累的豐富經驗，無疑將確保這些資源得到有效利用。"
 AST_diplomatic_events.66.a: "良好的開端"
 AST_diplomatic_events.67.t: "[FROM.GetName]感謝我們的支援" ### Support for the Chinese Communists - They accept
 AST_diplomatic_events.67.desc: "[FROM.GetLeader]的代表轉達了他對我們志願者的支持及所提供戰爭物資的感謝。[FROM.GetAdjective]在內戰中積累的豐富經驗，無疑將確保這些資源得到有效利用。"
 AST_diplomatic_events.67.a: "良好的開端"
 AST_diplomatic_events.68.t: "澳大利亞的要求"
 AST_diplomatic_events.68.desc: "澳大利亞不想獨自面對其強敵——[JAP.GetNameDef]。他們正敦促我們邁出第一步，儘早解決這場迫在眉睫的衝突。"
 AST_diplomatic_events.68.a: "風水輪流轉"
 AST_diplomatic_events.69.t: "再度聯結"
 AST_diplomatic_events.69.desc: "[ENG.GetNameDef]與[AST.GetName]之間的紐帶正遭受考驗，但後者決心將其重新培育得堅不可摧。[AST.GetName]在英國政府內部擁有如此之多的人脈與盟友，以致於其領導人根本無法拒絕；兩國將再度進入同一陣營，英倫列島與南方大陸將再度攜手合作。"
 AST_diplomatic_events.69.a: "理應如此"
 AST_diplomatic_events.71.t: "澳大利亞索要太平洋島嶼"
 AST_diplomatic_events.71.desc: "[AST.GetName]要求控制我們的太平洋島嶼，聲稱西太平洋不由[USA.GetNameDef]掌控。這些島嶼可能是平息澳大利亞敵意的一個小代價，但終究是代價。我們是否要冒險激怒一個正在崛起的法西斯國家，儘管我們已自顧不暇？"
 AST_diplomatic_events.71.a: "不，我們不應冒險"
 AST_diplomatic_events.71.b: "太平洋島嶼仍將歸我所有"
 AST_diplomatic_events.72.t: "[USA.GetNameDef]太平洋島嶼的移交"
 AST_diplomatic_events.72.desc: "鑑於[USA.GetNameDef]已自顧不暇，這些太平洋島嶼對他們來說不過是平息澳大利亞敵意的微小代價。他們的太平洋島嶼現在是我們的了。"
 AST_diplomatic_events.72.a: "太好了"
 AST_diplomatic_events.73.t: "[USA.GetNameDefCap]拒絕"
 AST_diplomatic_events.73.desc: "[USA.GetNameDefCap]拒絕將他們的太平洋島嶼交給我們。儘管我們提出了要求，並且在太平洋地區的影響力不斷增長，華盛頓仍然不願意放棄對這些島嶼的控制。"
 AST_diplomatic_events.73.a: "這些島嶼或許尚不歸我方所有，且待來日"
 AST_diplomatic_events.74.t: "澳大利亞要求割讓菲律賓"
 AST_diplomatic_events.74.desc: "出於擴張領土的野心，[AST.GetName]要求控制[PHI.GetNameDef]。如果我們拒絕，[AST.GetName]將威脅發動戰爭，認為[USA.GetNameDef]在[AST.GetName]的勢力範圍內保留領土是絕對不可接受的。"
 AST_diplomatic_events.74.a: "滿足他們的要求，我們不能冒險開戰"
 AST_diplomatic_events.74.b: "菲律賓應繼續歸我們所有！"
 AST_diplomatic_events.75.t: "[PHI.GetNameDef]的移交"
 AST_diplomatic_events.75.desc: "很明顯，當各國都如此懼怕我們的怒火時，[AST.GetName]作為一個法西斯國家的崛起已經開始帶來了一些好處。[USA.GetNameDefCap]已經同意；[PHI.GetNameDef]是我們的了。"
 AST_diplomatic_events.75.a: "新秩序已然湧現"
 AST_diplomatic_events.76.t: "[USA.GetNameDefCap]拒絕"
 AST_diplomatic_events.76.desc: "[USA.GetNameDefCap]拒絕將[PHI.GetNameDef]交給我們。儘管我們提出了要求，並且在太平洋地區的影響力不斷增長，華盛頓仍然不願意放棄對這些領土的控制。"
 AST_diplomatic_events.76.a: "這意味著戰爭"
 AST_diplomatic_events.78.t: "[AST.GetName]請求針對霸權的保障"
 AST_diplomatic_events.78.desc: "[AST.GetNameDefCap]向我們闡明瞭其宏偉目標：\n\n“‘[USA.GetNameDefCap]’的陰影籠罩著我們，一旦我們的行動不符合其利益，它便隨時可能橫加干涉。有這樣一個全球霸權插手澳大利亞與日本的事務，東亞就永遠無法真正屬於我們。因此，[AST.GetName]將不惜一戰。”\n\n總理[AST.GetLeader]明確表達了其意圖：[AST.GetName]決心挑戰[USA.GetNameDef]，若美國實力過於強大、難以獨自戰勝，則希望獲得我方援助。"
 AST_diplomatic_events.78.a: "我們將保證他們的獨立。"
 AST_diplomatic_events.78.b: "[JAP.GetNameDefCap]自有要務在身。"
 AST_diplomatic_events.79.t: "[JAP.GetNameDefCap]保證[AST.GetName]的獨立"
 AST_diplomatic_events.79.desc: "我們深知，[USA.GetNameDef]對亞洲及大洋洲事務的干涉既令人反感，也完全不可接受。[JAP.GetNameDefCap]已同意為我國提供安全保障，使我們得以高舉旗幟，迎戰強敵。因為我們毫不懷疑，若美國勢力過於強大而難以抗衡，盟友必將挺身而出，施以援手。"
 AST_diplomatic_events.79.a: "奔赴戰場，我們義無反顧。"
 AST_diplomatic_events.80.t: "[JAP.GetNameDefCap]拒絕保障我國獨立"
 AST_diplomatic_events.80.desc: "[USA.GetNameDefCap]對亞洲及大洋洲外交事務的干涉既令人反感又不可接受，但似乎只有我們看清了這一點。[JAP.GetNameDefCap]拒絕向我們提供保障，迫使我們不得不在沒有他們支持的情況下獨自迎敵。"
 AST_diplomatic_events.80.a: "正應如此。"
 AST_diplomatic_events.81.t: "團結的迷人象徵"
 AST_diplomatic_events.81.desc: "英國首相對於動物的濃厚興趣幾乎無人不曉，其豐富的收藏更是廣為人知。任何新成員加入他那多姿多彩的動物王國，都必將令他欣喜萬分；若是珍稀異域的物種，則更會讓他倍加珍愛。\n\n[ENG.GetLeader]本人曾明確表示，對澳大利亞的鴨嘴獸頗感興趣。儘管考慮到運輸過程中可能對這種小動物造成的健康風險，我們目前禁止其出口，但或許值得為此破例一次？\n\n作為團結的象徵，我們是否應當成全首相的這一願望？"
 AST_diplomatic_events.81.a: "[ENG.GetLeader]將會得到他的鴨嘴獸。"
 AST_diplomatic_events.81.b: "出口禁令不能解除，即便是首相也不例外。"
 AST_diplomatic_events.82.t: "來自[ENG.GetLeader]的沉痛報告"
 AST_diplomatic_events.82.desc: "六週前從墨爾本港啟航、載有完整鴨嘴獸館的鴨嘴獸運輸船已抵達[ENG.GetNameDef]。然而，這艘艦船的到來並未帶來喜悅，因為人們發現那隻動物已經死亡。[ENG.GetLeader]為他失去的寵物哀嘆不已，在等待其抵達期間，他甚至以自己的名字給鴨嘴獸起了名，但他聲稱敵人的行徑才是導致其死亡的罪魁禍首。據稱，潛艇襲擊引發的爆炸聲將這隻鴨嘴獸活活嚇死了。\n\n不過，鴨嘴獸飼養員的日誌卻指出了另一種可能的死因：鴨嘴獸館內的水溫和氣溫均遠遠超出了可接受的範圍。\n\n無論如何，[ENG.GetLeader]的鴨嘴獸已經一命嗚呼，這位英國首相也只能繼續過著沒有鴨嘴獸相伴的日子了。"
 AST_diplomatic_events.82.a: "這確實是個令人悲痛的消息。"
 AST_political_events.1.t: "舉行全民公投"
 AST_political_events.1.desc: "作為政府，我們尋求加強聯邦控制的兩個領域是：航空和市場營銷。\n\n關於航空，目標是修改憲法，授予聯邦議會制定有關空中航行和飛機法律的權力。\n\n市場營銷修正案則是允許聯邦與各州在市場營銷領域進行合作，這在目前的憲法下是不可能的。\n\n我們應選擇哪一項舉行公投？"
 AST_political_events.1.a: "航空，以規範[AST.GetName]全境的空中航行"
 AST_political_events.1.a.tt: "一旦改革通過：\n 添加§Y通過航空改革§!，獲得：\n 空軍研究速度：§G+15%§!\n §Y機場§!建造速度：§G+5.00%§!"
 AST_political_events.1.b: "市場營銷，以協調全國性的農業營銷計劃"
 AST_political_events.1.b.tt: "一旦改革通過：\n 添加§Y通過市場改革§!，獲得：\n 生活消費品工廠係數：§Y-10.0%§!"
 AST_political_events.2.t: "公投成功"
 AST_political_events.2.desc.a: "公眾已同意讓我們的航空改革得以實施。既然在澳大利亞憲法制定之時，航空尚未存在，那麼由政府最終掌握航空導航與監管的權力就完全合理。為了安全與效率，統一的全國航空法律現在即將出臺。"
 AST_political_events.2.desc.b: "公眾已同意讓我們的市場營銷改革得以實施。憑藉規範農產品及其營銷的權力，政府現在能夠穩定市場，改善各地區之間的合作。農民的收入將變得更加穩定，國民經濟亦將如此。"
 AST_political_events.2.a: "聯邦控制將加強！"
 AST_political_events.4.t: "總理病逝"
 AST_political_events.4.desc: "[AST.GetName]的領導人長期飽受備戰壓力的折磨，這份沉重的負擔最終奪走了他的生命，首相因心臟病發作不幸逝世。\n\n考慮到當前世界的局勢，他的領導才能將令人深切懷念。然而，澳大利亞必須繼續前行，由新任領導人[AST.GetLeader]執掌大局。"
 AST_political_events.4.a: "國家的悲劇"
 AST_political_events.5.t: "澳大利亞政府採取強硬措施"
 AST_political_events.5.desc: "一個由反抗和爭議聲音組成的團體——澳大利亞優先運動——已經形成。政府擔心其意圖可能不完全民主，因此選擇對該團體及其成員進行監視。民主派的干預將削弱我們的組織能力，並阻礙新成員的招募工作。"
 AST_political_events.5.a: "只有時間能說明這場運動的本質"
 AST_political_events.6.t: "1938年一百五十週年紀念"
 AST_political_events.6.desc: "今日早些時候，在紀念1938年建國150週年慶典舉行、“澳大利亞邁向民族國家”遊行隊伍穿過悉尼主要街道之際，一場抗議活動在澳大利亞會堂舉行。\n\n原住民權利活動家和團體聚集在一起，呼籲人們關注這樣一個事實：150週年紀念不僅標誌著英國殖民的開始，也標誌著對原住民的憲法性歧視。活動家們要求制定新的法律，以保障原住民的教育和福利，同時制定新政策，允許提升原住民至完全公民身份地位。"
 AST_political_events.6.a: "必須採取行動"
 AST_political_events.7.t: "英聯邦施壓"
 AST_political_events.7.desc: "鑑於近期事件，無法否認澳大利亞政治格局正在發生變化。[ENG.GetNameDefCap]已採取行動，通過外交手段確保[AST.GetName]繼續走在適合英聯邦體系下國家的道路上，希望其通過和平引導能讓自治領繼續保持忠誠。"
 AST_political_events.7.a: "儘管英國努力過，[AST.GetName]仍將自行決定道路"
 AST_political_events.8.t: "戰爭將至"
 AST_political_events.8.desc: "$AST_war_is_coming_cat_desc$"
 AST_political_events.8.a: "我們必須做好準備"
 AST_political_events.9.t: "達爾弗拉姆爭端"
 AST_political_events.9.desc: "起初不過是裝運生鐵的糾紛，如今已點燃了更大的事件。全澳大利亞的工人紛紛罷工聲援，反抗政府與產業界。隨著罷工蔓延、緊張局勢升級，危機愈演愈烈，並要求當權者辭職。於是，因完全無力控制局勢，政府照做了，將執政黨的位置讓給[AST.GetCommunistParty]。"
 AST_political_events.9.a: "而我們必將佔據這位置"
 AST_canberra_air_disaster_events.1.t: "堪培拉空難"
 AST_canberra_air_disaster_events.1.desc: "今天早些時候，一架洛克希德哈德遜飛機在堪培拉郊外墜毀。機上十人中包括陸軍司令及其參謀人員，他們正受召集前往參加內閣會議。機組人員與乘客全部不幸遇難。\n\n墜機原因仍舊未知，這次飛行條件良好，而駕駛飛機的澳大利亞皇家空軍軍官羅伯特·希區柯克空軍上尉擁有豐富的飛行經驗。\n\n無論原因如何，這都是整個國家的悲劇，尤其是對受害者的家人和朋友來說，澳大利亞現在等待著領導人的回應。"
 AST_canberra_air_disaster_events.1.a: "可怕的悲劇"
 AST_canberra_air_disaster_events.1.a.tt: "解鎖§Y“內閣信任”決議§!和§Y任務§!以保留或移除現任政府"
 AST_canberra_air_disaster_events.2.t: "[AST.GetRulingParty]獲勝"
 AST_canberra_air_disaster_events.2.desc: "現任政府成功帶領澳大利亞度過了堪培拉空難後的全國性動盪。如同指路明燈，[AST.GetRulingParty]在艱難時期證明了其可靠性和力量，最終在全國範圍內加強了公眾支持。"
 AST_canberra_air_disaster_events.2.a: "未來就在前方"
 AST_canberra_air_disaster_events.3.t: "不信任動議"
 AST_canberra_air_disaster_events.3.desc: "在不信任動議成功後，現任政府終於被替換，不情願地將權力移交給繼任者。經過一段時間的政治不穩定和公眾不信任，澳大利亞已準備好迎接新的開始。"
 AST_canberra_air_disaster_events.3.a: "新的領導層來援助澳大利亞"
 AST_canberra_air_disaster_events.4.t: "領導權更迭"
 AST_canberra_air_disaster_events.4.desc: "經過一段時間的政治不穩定和公眾不信任後，[AST.GetRulingParty]更換了其領導層。多數票迫使總理下臺，並允許其繼任者登上講臺。"
 AST_canberra_air_disaster_events.4.a: "希望這將為澳大利亞鋪平道路"
 AST_canberra_air_disaster_events.5.t: "澳大利亞的指控"
 AST_canberra_air_disaster_events.5.desc: "在一場新聞發佈會上，[AST.GetName]向我們提出了指控，聲稱我們應該為最近在澳大利亞領土上發生的導致數名政府官員喪生的飛機失事負責。\n\n當然，這些指控完全是虛假的，只會讓這種不尊重變得更加惡毒。"
 AST_canberra_air_disaster_events.5.a: "這些說法是虛假的，我們無需採取行動"
 AST_canberra_air_disaster_events.5.b: "必須嚴懲"
 AST_canberra_air_disaster_events.6.t: "[JAP.GetNameDefCap]的報復"
 AST_canberra_air_disaster_events.6.desc: "[JAP.GetNameDefCap]對我們的指控並未輕輕放下，而是將其視為侵犯行為。[JAP.GetLeader]進一步升級了衝突，表示現在他的國家完全有權入侵我們的土地。"
 AST_canberra_air_disaster_events.6.a: "我們不要再升級緊張局勢了"
 AST_canberra_air_disaster_events.6.b: "不能置之不理。"
 INS_limited_war_events.1.t: "粉碎馬來亞！"
 INS_limited_war_events.1.desc: "敵人的防線已被突破，我們的部隊勢如破竹向前推進。海峽對岸，這個英國的附庸國在人民的怒火下土崩瓦解。倫敦的傀儡們以為刺刀能讓他們避開歷史洪流，他們錯了。"
 INS_limited_war_events.1.a: "獨立與自由！"
 INS_limited_war_events.1.b: "對共和國而言，這是美好的一天"
 INS_limited_war_events.2.t: "[FROM.GetAdjective]的反擊"
 INS_limited_war_events.2.desc: "之前承諾的對傀儡政權發動迅猛一擊，已經變了味。得到其帝國主義主子撐腰的[FROM.GetAdjective]部隊，將我方人員逐出爭議地帶，如今盤踞其上。無線電每天傳來他們吹噓的消息。繼續進攻只會招致更多羞辱，而撤退則是在整個群島面前承認失敗。"
 INS_limited_war_events.2.a: "把部隊撤回來，能救多少是多少"
 INS_limited_war_events.2.b: "我們決不向傀儡屈服！"
 INS_limited_war_events.3.t: "[FROM.GetName]向共和國低頭"
 INS_limited_war_events.3.desc: "消息從吉隆坡傳來。傀儡政府，在決定性時刻被其倫敦主子拋棄，已接受我方條件，以免其城鎮化為焦土。爭議之地歸我們所有。這個教訓，本地區其他附庸國不會忘記。"
 INS_limited_war_events.3.a: "印度尼西亞崛起"
 INS_limited_war_events.4.t: "[FROM.GetName]拒絕我們的條件"
 INS_limited_war_events.4.desc: "[FROM.GetName]將我們的提議甩回我們臉上。傀儡部長們照本宣科，念著白廳寫好的稿子，宣稱一寸土地都不會交出，在大炮沉寂之前，必須先讓共和國屈服。"
 INS_limited_war_events.4.a: "那就讓槍炮說話吧"
 INS_limited_war_events.5.t: "[FROM.GetNameDef]呼籲消滅我們"
 INS_limited_war_events.5.desc: "[FROM.GetNameDefCap]拋下了最後一絲有限戰爭的偽裝。他們的廣播如今公開談論肢解共和國，將其島嶼分給從前的殖民主子。此事不會有平靜的結局。要麼印尼在終局時屹立不倒，要麼徹底不復存在。"
 INS_limited_war_events.5.a: "我們同生死，共存亡"
 INS_limited_war_events.6.t: "[FROM.GetAdjective]的攻勢受阻"
 INS_limited_war_events.6.desc: "[FROM.GetAdjective]的突襲讓我們措手不及，有那麼一陣子我們擔心最壞的結果。然而，他們的攻勢已陷入泥潭。他們的士兵疲憊不堪，戰線漫長，倫敦的咆哮隨著每一份公報而日漸無力。共和國或許還可以寬宏大量，給傀儡們一個體面退出的機會，儘管許多人會說，一場徹底的勝利比有節制的勝利更有利於事業。"
 INS_limited_war_events.6.a: "向他們提出條件"
 INS_limited_war_events.6.b: "對傀儡毫不留情"
 INS_limited_war_events.7.t: "進攻停滯"
 INS_limited_war_events.7.desc: "我方的進攻已經停滯，更糟糕的是，敵人知曉了這一點。海峽對岸要求我們馬上放下武器，接受他們的條件，或者看著傷亡名單越來越長，最終接受他們的條件。我們只能在不同規模的葬禮間進行選擇。"
 INS_limited_war_events.7.a: "糟糕的和平勝過更糟糕的戰爭"
 INS_limited_war_events.7.b: "共和國不會屈服"
 INS_limited_war_events.8.t: "[FROM.GetName]拒絕屈服"
 INS_limited_war_events.8.desc: "[FROM.GetName]輕蔑地回覆了我們的提議。他們的官員宣稱，他們寧願讓從檳城到柔佛的每一座鄉村都化為火海，也不願向共和國屈服。戰爭仍將繼續。"
 INS_limited_war_events.8.a: "那就如此吧。"
 INS_limited_war_events.9.t: "[FROM.GetName]意圖粉碎共和國！"
 INS_limited_war_events.9.desc: "敵方指揮部的無線攔截證實了最糟糕的情況。不會有解決方案，不會有剋制的和平，不會回到我們以前的邊境線。那些傀儡和他們的倫敦主子要求共和國徹底投降，試圖粉碎印度尼西亞，讓群島回到我們奮力抵抗的帝國主義靴下。對此，只有一個回覆。"
 INS_limited_war_events.9.a: "印度尼西亞屹立不倒！"
 ### AST - Union Control Events ###
 AST_union_control_events.1.t: "工會內的外國特工"
 AST_union_control_events.1.desc: "情報部門向政府報告了令人不安的消息。澳大利亞的共產主義特工一直在與本地工會領導人聯繫，分發激進文獻，鼓勵工人按照革命路線組織起來。目前，這場運動的規模仍然很小，但安全官員警告說，這只是此類事件的開始。必須在它紮根前作出決定。"
 AST_union_control_events.1.a: "嚴密監視他們。我們暫且等待"
 AST_union_control_events.4.t: "共產主義滲透者奪取[MAL.GetAdjective]領土"
 AST_union_control_events.4.desc: "一份令人震驚的報告已呈交政府。一次協同行動攻佔了我方一個地區，並宣佈其歸屬革命政府。此次襲擊的速度與組織性引發了令人不安的質疑——我國情報部門懷疑叛亂分子並非單獨行動，可能有外國勢力在背後操縱，其引至我國境內。那些在佔領行動中逃脫的人並未投降。他們重新集結並拿起武器，決心奪回被奪走的一切。"
 AST_union_control_events.4.a: "查出誰在支持。這些反賊沒辦法長期控制那裡"
 AST_union_control_events.4.a.tt: "反共民兵部隊已經集結起來抵抗共產主義佔領"
 AST_union_control_events.5.t: "[MAL.GetAdjective]的災難"
 AST_union_control_events.5.desc: "我們的推進已停滯，更糟的是，敵人對此心知肚明。海峽對岸傳來要求：立即放下武器接受他們的條件，否則，就在同樣的結局下，眼看著傷亡名單越拉越長。他們給出的選擇，不過是葬禮規模的大小。"
 AST_union_control_events.5.a: "可怕的挫折。我們必須轉向其他途徑來支持同志"
 AST_union_control_events.3.t: "[MAL.GetNonIdeologyName]爆發革命"
 AST_union_control_events.3.desc: "[MAL.GetNonIdeologyName]的工人起義了。我們長期以來培育的共產主義細胞已經在該國各地拿起武器，但當地的情況令人不安。革命力量集中在錯誤的地區，他們與半島的心臟被水域和叢林分隔。若不能在大陸獲得立足點，政府只需等待即可在革命傳播前餓死他們。澳大利亞必須秘密且迅速地採取行動，在半島上部署力量，為革命提供生存所需的基礎。"
 AST_union_control_events.3.a: "我們不能讓革命失敗。為他們提供立足點"
 AST_union_control_events.2.t: "[AST.GetAdjective]支持的煽動者出現在我們街頭"
 AST_union_control_events.2.desc: "澳大利亞共產主義政府的特工已抵達我們的城市。他們毫不躲藏——工廠門口分發著小冊子，公共廣場上發表著演講，澳大利亞特工與本地激進團體之間建立了團結網絡。原有的外國影響網絡似乎在一夜之間重獲活力。這是一場協調一致的運動，政府必須在民眾不滿變得難以收拾之前，決定如何應對。"
 AST_union_control_events.2.b: "令人不安的發展"
 ###########################
 ##### ABDACOM EVENTS ######
 ###########################
 ABDA_events.1.t: "受邀加入新的最高指揮部"
 ABDA_events.1.desc: "[FROM.GetNameDef]建立了太平洋戰區的聯合最高指揮部，並邀請我們加入。這一倡議——被稱為美英荷澳司令部——旨在將在該地區行動的盟國的海、空、陸軍力量集中到一個統一的指揮體系下。加入意味著能與[FROM.GetNameDef]及其他已承諾參與的夥伴進行更緊密的協調合作。我們必須決定是否接受。"
 ABDA_events.1.a: "我們將並肩作戰"
 ABDA_events.1.b: "我們暫時無法對此做出承諾"
 ABDA_events.2.t: "[FROM.GetName]加入美英荷澳司令部"
 ABDA_events.2.desc: "[FROM.GetNameDef]已接受我方邀請，加入美英荷澳司令部最高指揮部。他們的部隊現在將在聯合指揮體系下行動，增強我們在太平洋戰區的地位。"
 ABDA_events.2.a: "令人滿意的進展"
 ABDA_events.3.t: "[FROM.GetName]拒絕加入"
 ABDA_events.3.desc: "[FROM.GetNameDef]拒絕了我們加入美英荷澳司令部最高指揮部的邀請。他們的部隊暫時不會參與這項聯合行動，但大門或許仍然敞開著。"
 ABDA_events.3.a: "很遺憾，已知悉"
 ABDA_events.5.t: "邀請加入美英荷澳司令部"
 ABDA_events.5.desc: "[FROM.GetNameDef]邀請我們加入美英荷澳司令部。司令部已經成為太平洋戰區盟軍的最高協調機構，將主要盟國的海軍和陸軍集中在一個指揮下。加入將使我們的部隊進入這一聯合架構，獲得共享情報、協同條令以及盟軍的全力支持。我們必須做出決定。"
 ABDA_events.5.a: "我們將並肩作戰"
 ABDA_events.5.b: "我們暫時無法對此做出承諾"
 ABDA_events.4.t: "新加坡防務"
 ABDA_events.4.desc: "新加坡已被指定為美英荷澳司令部防禦圈的關鍵樞紐，我們的指揮官必須決定如何投入其防禦工事。我們可以優先加強海上通道和港口防禦，鞏固陸地一側以抵禦地面進攻，或者將資源分散在兩個方向。每種選擇都將決定敵人來犯時新加坡的防禦方式。"
 ABDA_events.4.a: "加強海防，新加坡的優勢在於其港口"
 ABDA_events.4.b: "鞏固陸地防線，真正的威脅將來自陸地"
 ABDA_events.4.c: "均衡的策略，任何一條進攻路線都不能忽視"
 ABDA_fortress_singapore_choice_tt: "完成該國策後將面臨如何加強新加坡防禦的選擇。"
 ABDA_faction_membership_requirement_tt: "符合條件的陣營成員將收到加入邀請。"


