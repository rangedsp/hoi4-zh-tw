 lon_arms_resolution_tt: "一項國際聯盟動議阻止了與[ROOT.GetName]的軍備交易，直至[ITA.GetName]與[ETH.GetName]間的敵對行動結束。"
 ETH_ethiopia_supporting_independence_idea: "[ETH.GetName]支持獨立"
 ETH_prince_regent_idea: "攝政王$ETH_ras_imru_haile_selassie$"
 ETH_prince_regent_idea_desc: "$ETH_haile_selassie$皇帝遠赴國際聯盟尋求對[ROOT.GetAdjective]事業支持，同時$ETH_ras_imru_haile_selassie$王公擔負起了抵抗侵略者的任務。在皇帝歸來前，他將是[ROOT.GetName]實際上的領導人。"
 ETH_conservative_high_command_idea: "保守的最高統帥部"
 ETH_conservative_high_command_idea_desc: "[ETH.GetName]的王公們知道如何打仗。我們沒有必要改變數個世紀以來都屢試不爽的策略。在[ETH.GetAdjective]軍隊有更高士氣和更多數量的情況下，敵人總會被我們的全力攻擊擊退。"
 ETH_the_heroes_of_adwa_idea: "阿杜瓦的英雄"
 ETH_the_heroes_of_adwa_idea_desc: "孟尼利克皇帝在阿杜瓦之戰中擊敗了意大利侵略者。我們在阿杜瓦戰役中向世界展現了我軍的能力，併成功逼迫殖民者撤軍。我們上次成功了，這次也一定能做到。"
 ETH_taxed_nobility_idea: "貴族稅"
 ETH_on_our_own_idea: "踽踽獨行"
 ETH_on_our_own_idea_desc: "國際社會對[ITA.GetName]和[ETH.GetName]之間的軍事衝突持消極態度，並且認為不應有任何第三方國家介入其中。[ETH.GetName]在這絕望的時刻孤立無援。"
