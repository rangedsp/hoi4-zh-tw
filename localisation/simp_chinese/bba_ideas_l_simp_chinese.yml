 ITA_ducati_energia: "督凱提"
 ITA_northern_designer_tt: "此設計商位於意大利北部。完成國策“§Y$ITA_strengthen_northern_industry$§!”和“§Y$ITA_new_industrialization_program$§!”將使該設計商獲得強化。"
 ITA_southern_designer_tt: "此設計商位於意大利南部。完成國策“§Y$ITA_modernize_the_mezzogiorno$§!”和“§Y$ITA_new_industrialization_program$§!”將使該設計商獲得強化。"
 ITA_northern_designer_improved_tt: "§Y此北部設計商已得到強化§!。"
 ITA_southern_designer_improved_tt: "§Y此南部設計商已得到強化§!。"
 ITA_has_crda_tt: "擁有艦艇設計商：§Y$crda$§!"
 ITA_has_fiat_tt: "擁有裝甲設計商：§Y$fiat$§!"
