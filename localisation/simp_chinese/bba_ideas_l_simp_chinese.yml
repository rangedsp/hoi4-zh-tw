 ITA_offensive_in_ethiopia: "埃塞俄比亞攻勢"
 ITA_offensive_in_ethiopia_desc: "我們的軍隊下定決心擊退敵人——不論代價如何！"
 ITA_logistics_in_ethiopia: "埃塞俄比亞後勤"
 ITA_logistics_in_ethiopia_desc: "周全的計劃和後勤系統能讓我們日拱一卒，而不用付出無謂的犧牲。"
 ITA_stockpiling_fuel: "儲備燃油"
 ITA_stockpiling_fuel_desc: "大量的燃油儲備能使我們的軍隊運作更長時間。"
 ITA_foggia_farm_fields: "福賈農業區"
 ITA_foggia_farm_fields_desc: "現代化的福賈農業將顯著提高糧食產量。"
 ITA_hardened_irregular_bands: "強化非正規軍"
 ITA_hardened_irregular_bands_desc: "利用當地士兵的優勢，我們可以從他們的戰鬥經驗和地理知識中獲得諸多寶貴經驗。"
 ITA_hardened_irregular_bands_tt: "§Y$irregular_infantry$§!、§Y$cavalry$§!和§Y$camelry$§!的攻擊、防禦以及師速度獲得§G+5.00%§!加成"
 ITA_servizio_informazione_militare_ns: "$ITA_servizio_informazione_militare$"
 ITA_servizio_informazione_militare_ns_desc: "我們的情報機構一方面能阻止外國間諜在我國暗中搞破壞，另一方面也能在國際鬥爭中助我國一臂之力。"
 ITA_devaluated_lira: "貶值里拉"
 ITA_devaluated_lira_desc: "意埃戰爭的龐大軍費開銷嚴重阻滯了我們的經濟。貨幣貶值可以使我國的產品在國際市場上更具競爭力，為我們的經濟打上一針強心劑。"
 ITA_battaglia_del_grano: "糧食之戰"
 ITA_battaglia_del_grano_desc: "為了國家的真正獨立，我們不能依靠外國農業養活我們的民眾，國家必須在農業上實現自給自足。糧食之戰將會表達出我們自力更生的決心，同時也會進一步強化國力。"
 ITA_battaglia_per_la_terra: "土地之戰"
 ITA_battaglia_per_la_terra_desc: "我們的土地戰役將排幹數英里的沼澤以創造農田。它還將提供新的就業機會，而意大利人民的堅韌不拔會令外國政府印象深刻。"
 ITA_battaglia_per_la_nascite: "生育之戰"
 ITA_battaglia_per_la_nascite_desc: "為了意大利的真正繁榮，我們需要更多的戰士。為了獲得更多的戰士，我們需要更多的人口。為了獲得更多的人口，我們需要母親。母親要做的就是贏得生育之戰。"
 ITA_camicie_nere: "黑衫軍"
 ITA_camicie_nere_desc: "對[ITA.GetLeader]個人宣誓效忠的黑衫軍比其他部隊更可靠忠誠。賦予他們更多權責將大大強化我們的統治。"
 ITA_camicie_nere_mp_tt: "§Y憲兵隊§!：鎮壓能力加成：§G+5.0%§!"
 ITA_italian_irredentism_ns: "$ITA_italian_irredentism$"
 ITA_italian_irredentism_ns_desc: "為了讓[ITA.GetNameDef]厚積薄發，我們必須擴張到我們的自然邊界，統一所有理應屬於意大利民族的領土！"
 ITA_bandits_war: "強盜戰爭"
 ITA_bandits_war_desc: "機動性和機械化是戰爭的未來。我們必須在軍隊現代化上大量投資，才能在將來的戰場上取得成功。"
 ITA_alpine_defense: "阿爾卑斯防線"
 ITA_alpine_defense_desc: "上次大戰中慘烈的山地戰仍是許多人揮之不去的記憶。為了保證北方防線在敵人攻擊中不動如山，我們必須訓練能在山地地形中高效作戰的優秀士兵。"
 ITA_aviazione_legionaria: "“軍團空軍”聯隊"
 ITA_aviazione_legionaria_desc: "確保制空權對於任何軍隊來說都非常重要。有了制空權，地面部隊才能掌握主動，將敵人趕回老家。"
 ITA_sold_obsolete_escort_ships_ns: "出售過時護衛艦"
 ITA_sold_obsolete_escort_ships_ns_desc: "出口戰艦至別國增強了我國的工業能力。"
 ITA_strengthened_heavy_industry: "加強重工業建設"
 ITA_strengthened_heavy_industry_desc: "強化我國的工業能力將提高我國的工業生產力。"
 ITA_strengthened_the_army: "加強陸軍建設"
 ITA_strengthened_the_army_desc: "擴編陸軍在動員部隊與協調組織戰力的方面讓我們受益匪淺。"
 ITA_disgruntlement_in_the_army: "陸軍不滿"
 ITA_disgruntlement_in_the_army_desc: "因被批評擴軍過慢，不滿情緒已滲入陸軍之中。"
 ITA_efficient_supply_lines: "高效補給線"
 ITA_efficient_supply_lines_desc: "新生產的補給卡車隊讓我們的補給線受益匪淺，陸軍後勤不再讓人頭疼。"
 ITA_fuel_reserves: "燃油儲備"
 ITA_fuel_reserves_desc: "大量的燃油儲備可讓我們的軍隊能自由地長途奔襲與主動出擊。"
 ITA_strengthened_the_airforce: "強化的空軍"
 ITA_strengthened_the_airforce_desc: "意大利空軍又一次擁有了規模世界前列的機隊。新訓練的飛行員渴望展示我們空軍的強大。"
 ITA_disgruntlement_in_the_airforce: "空軍不滿"
 ITA_disgruntlement_in_the_airforce_desc: "空軍曾被許諾更多資源和資金用以擴張機隊，但承諾什麼都沒有兌現。不滿情緒正在空軍中蔓延。"
 ITA_expanded_intelligence_service_basic: "情報部門擴張"
 ITA_expanded_intelligence_service_basic_desc: "擴張後的情報部門將加強我國的國土安全。"
 ITA_bolstered_political_cabinet: "政府內閣加強"
 ITA_bolstered_political_cabinet_desc: "合理的人事安排將對法西斯體制和我們對[ITA.GetNameDef]的統治裨益良多。"
 ITA_bolstered_military_high_command: "加強的最高軍事指揮部"
 ITA_bolstered_military_high_command_desc: "有能力的領導層對軍隊正常運轉並在戰場取勝起著決定性作用。"
 ITA_all_within_the_state_ns: "$ITA_all_within_the_state$"
 ITA_all_within_the_state_ns_desc: "加強我們的後勤能力將確保通往勝利的道路。"
 ITA_anti_partisan_measures_ns: "$ITA_anti_partisan_measures$"
 ITA_anti_partisan_measures_ns_desc: "我們的專職反游擊戰部隊正在阻礙游擊隊的行動，讓他們更難在敵後戰場發動襲擊。"
 ITA_gappisti_ns: "$ITA_gappisti$"
 ITA_gappisti_ns_desc: "我們的小型游擊隊正在敵後戰場上予敵人以攻擊，敵人因此士氣下滑，而地區居民抵抗熱情卻因此高漲。"
 ITA_grande_rivolta_rurale_ns: "$ITA_grande_rivolta_rurale$"
 ITA_grande_rivolta_rurale_ns_desc: "我們成功將鄉村地區的農民團結到了我們的旗幟下！"
 ITA_liberation_or_death_ns: "$ITA_liberation_or_death$"
 ITA_liberation_or_death_ns_desc: "將意大利從暴政中解放出來的最後一戰已經打響，除破釜沉舟外不作他想！"
 ITA_grande_rivolta_rurale_terrain_bonus_tt: "擁有此民族精神時，啟用§Y山地作戰訓練§!，給予§Y$militia$§!在§Y$hills$§!和§Y$mountain$§!的地形加成：進攻：§G+5%§!，移動：§G+10%§!"
 ITA_independence_war: "獨立戰爭"
 ITA_independence_war_desc: "我們要把意大利從壓迫者手中解放出來！"
 ITA_nuclear_research: "原子能研究"
 ITA_nuclear_research_desc: "我們的原子能研究世界領先。很快，我們就將成為世界第一的軍事大國。"
 ITA_political_reforms: "政治改革"
 ITA_political_reforms_desc: "改革政治體制將促進國家復興和內部穩定。"
 ITA_setting_course_ns: "$ITA_setting_course$"
 ITA_setting_course_ns_desc: "$ITA_setting_course_desc$"
 ITA_papal_support: "教宗支持"
 ITA_papal_support_desc: "教宗仍然對意大利人民有莫大影響，有了他的支持，我們將能團結許多人到我們事業的旗幟下。"
 ITA_papal_state: "教宗國"
 ITA_papal_state_desc: "重生的教廷統治了意大利，人們紛紛湧向聖座，乞求指引與支持。"
 ITA_papal_state_catholic_dominion: "天主教之治"
 ITA_papal_state_catholic_dominion_desc: "隨著教宗國崛起成為世界強權，是時候執行上帝的旨意了——就像牧者引導羊群一般，我們將保護基督徒免於惡魔之侵害。"
 ITA_papal_state_catholic_dominion_puppet_discount_tt: "和談時為§Y傀儡國家§!行動§Y花費減少§!。"
 ITA_cooperation_of_the_bourgeoisie: "與資產階級合作"
 #ITA_cooperation_of_the_bourgeoisie_desc: "NEEDED?"
 ITA_seizing_old_equipment: "奪取舊式軍備"
 ITA_international_aid: "國際援助"
 ITA_disgruntled_military: "不滿的軍隊"
 ITA_disgruntled_military_desc: "清洗軍隊中的保皇派將減少共和國受到的威脅，但也讓我們損失了一些經驗豐富的軍隊領袖。"
 ITA_empowered_carabinieri: "賦權憲兵隊"
 ITA_italian_confederation_leader: "意大利邦聯領袖"
 ITA_italian_confederation_member: "意大利邦聯成員"
 ITA_aiding_the_spanish_republic: "援助西班牙共和國"
 ITA_peace_keepers_of_europe: "歐洲和平守護者"
