 ITA_pacified_italian_east_africa_modifier: "意屬東非已平定"
 ITA_fronte_militare_clandestino_modifier: "$ITA_fronte_militare_clandestino$"
 ITA_cooperatives_for_intensive_exploitation_dm: "$ITA_cooperatives_for_intensive_exploitation$"
 ITA_anti_colonialism_sentiment: "反殖民主義思想"
 ITA_mafia_on_the_rise: "黑手黨崛起"
 ITA_mafia_on_the_rise_no_lar: "$ITA_mafia_on_the_rise$"
 ITA_established_mafia: "建立黑手黨"
 ITA_established_mafia_no_lar: "$ITA_established_mafia$"
 ITA_italia_irredenta_achieved: "實現意大利民族統一"
 AOI_africa_orientale_italiana_idea: "意屬東非"
 ITA_banda_carita_non_la_resistance: "志願安保團"
 ITA_ALB_italian_settlers: "意大利移民湧入"
 ITA_dodecanese_treaty_idea: "十二群島條約"
 ITA_italys_destiny_idea: "意大利的天命"
 ITA_vento_aureo: "黃金之風"
 ITA_shadow_of_mussolini: "墨索里尼的陰影"
 ITA_shadow_of_mussolini_desc: "儘管墨索里尼已經遠離權力中心，但他留下的影響還是很難擺脫，墨索里尼的影子依然投射著意大利政治。"
 ITA_divino_duce_1: "神聖領袖"
 ITA_divino_duce_1_desc: "[ITA.GetLeader]身邊充滿著個人崇拜行為，意大利人民永遠不會拋棄放棄他們對領袖的忠誠。他們將克服面前的任何困難，永不屈服。"
 ITA_divino_duce_2: "$ITA_divino_duce_1$"
 ITA_divino_duce_2_desc: "$ITA_divino_duce_1_desc$"
 ITA_italian_hegemony_master_1: "意大利霸權"
 ITA_italian_hegemony_master_1_desc: "作為法西斯主義的起源地，我們的目標是明確的：成為法西斯主義的保護者並向天下傳揚。我們將在任何歸順我國強權的民族中樹立起維護對法西斯主義的主人翁意識與無盡忠誠。"
 ITA_italian_hegemony_master_2: "$ITA_italian_hegemony_master_1$"
 ITA_italian_hegemony_master_2_desc: "$ITA_italian_hegemony_master_1_desc$"
 ITA_italian_hegemony_master_3: "$ITA_italian_hegemony_master_1$"
 ITA_italian_hegemony_master_3_desc: "$ITA_italian_hegemony_master_1_desc$"
 ITA_italian_hegemony_subjects: "意大利霸權"
 ITA_italian_hegemony_subjects_desc: "我們是法西斯主義的守護者，緊密團結在[ITA.GetNameDef]的王道之下，堅決捍衛真理正道與教化啟蒙。無論人神都會在我們的面前化為齏粉！"
 ITA_prioritizing_the_military: "軍事優先"
 ITA_prioritizing_the_military_desc: "我們可以通過從他處抽掉物力財力，來集中投資武裝力量。雖然其他方面短期會承受陣痛，但是長期的回報會更可觀。"
 ITA_impero_italiano: "意大利帝國"
 ITA_impero_italiano_desc: "意大利帝國成立的宣佈鼓舞了我們的軍隊，併合法化我們在非洲的宣稱。"
 ITA_novus_ordo_modifier: "新秩序"
 ITA_expanded_corporatism_modifier: "拓展社團主義"
 ### Switzerland ###
 SWI_spirit_of_resistance_idea: "瑞士的抵抗精神"
 SWI_swiss_neutrality: "瑞士式中立"
 SWI_werner_risch: "維爾納-裡施"
 SWI_eidgenossische_FW: "聯邦飛機制造廠"
 SWI_eidgenossische_KW: "聯邦建築工程公司"
 SWI_eidgenossische_WF: "聯邦兵工廠"
 SWI_sig: "瑞士工業公司"
 SWI_oerlikon: "厄利孔"
 SWI_saurer: "紹雷爾"
 SWI_berna: "貝爾納"
 SWI_buero_ha_idea: "“哈”局"
 SWI_expanded_spy_network_idea: "擴展間諜網"
 SWI_spirit_of_saint_bernard_idea: "聖伯納德之魂"
 SWI_spirit_of_saint_bernard_idea_tooltip: "野戰醫院傷兵復原：§G+10%§!\n經驗損失係數：§G-30%§!"
 SWI_mountaineer_paratroopers_idea: "$SWI_mountaneer_paratroopers$"
 SWI_mountaineer_paratroopers_idea_desc: "數世紀的高山文化和進入一些最陡峭山峰的機會賦予了瑞士空降兵一項他國空降兵沒有的優勢。他們能像在羅莎峰（阿爾卑斯山脈第二高峰）或是馬特峰（阿爾卑斯山脈中最後一個被征服的主要山峰）一樣跳出我們的運輸機，然後降臨並控制每個山峰。"
 SWI_mountaineer_paratroopers_idea_TT: "§Y山地§!：\n 進攻：§G+35%§!\n 防禦：§G+10%§!\n 移動：§G+20%§!\n§Y丘陵§!：\n 進攻：§G+20%§!\n 防禦：§G+5%§!\n 移動：§G+10%§!"
 SWI_air_production_ns: "瑞士飛行器生產"
 SWI_air_production_ns_desc: "我們的工業致力於儘可能快的生產飛機，因此我們進行一場空戰的潛能已經超過了我們的鄰居。"
 SWI_federal_police_idea: "瑞士聯邦警察情報局"
 SWI_federal_police_idea_no_lar: "$SWI_federal_police_idea$"
 SWI_federal_police_idea_no_lar_2: "$SWI_federal_police_idea$"
 SWI_infiltrated_federal_police_idea: "滲透聯邦警察"
 SWI_infiltrated_federal_police_idea_no_lar: "$SWI_infiltrated_federal_police_idea$"
 SWI_infiltrated_federal_police_idea_desc: "法西斯分子已經滲入了聯邦警察及其情報部門。不用說，他們肯定一直在幫我們的法西斯鄰國滲透[SWI.GetName]社會了。"
 SWI_pro_helvetia_idea: "瑞士文化基金會"
 SWI_pro_helvetia_idea_desc: "瑞士想要延續，就必須成為一個與其境內的通行語言截然不同的國家。這就是為什麼瑞士文化基金會的任務是宣傳瑞士價值觀，以及其所包含的對民主制度的相應信念。"
 SWI_martial_law_idea: "戒嚴令"
 SWI_martial_law_idea_desc: "非常時期需要採取非常手段。軍隊必須被控制，以確保秩序和穩定。運氣好的話，在未來的某一天[ROOT.GetAdjective]可能被恢復。"
 SWI_extensive_press_censorship_idea: "廣泛的新聞審查"
 SWI_active_trade_agreement: "來自貿易協定的供給"
 SWI_trading_with_switzerland_military: "從瑞士進口軍火"
 SWI_trading_with_switzerland_civilian: "從瑞士進口生活消費品"
 SWI_no_confederation_president_idea: "聯邦主席未選出"
 SWI_no_confederation_president_idea_desc: "難以置信，聯邦委員會沒能選出瑞士聯邦的新主席。我們需要花費許多努力才能走出這種困境。"
 SWI_foreign_fascist_propaganda: "外國法西斯宣傳"
 SWI_foreign_fascist_propaganda_desc: "儘管[SWI.GetName]沒有原生的大規模法西斯主義運動，我們的法西斯鄰國們卻派遣第五縱隊滲入各州，尤其是[GER.GetAdjective]裔和[ITA.GetAdjective]裔為主的州進行宣傳行動，試圖從內部分裂我們的聯邦。"
 SWI_extensive_fascist_propaganda: "廣泛法西斯宣傳"
 SWI_extensive_fascist_propaganda_desc: "瑞士的法西斯宣傳曾來自外部，但法西斯運動已經積攢足夠的動力讓這個國家從裡到外都被法西斯宣傳淹沒了。"
 SWI_rearmaming_idea: "軍備重整進行時"
 SWI_increased_defense_budget: "增加國防預算"
 SWI_war_bonds: "戰爭債券"
 SWI_banned_foreign_nazi_propaganda_idea: "外國納粹宣傳被禁"
 SWI_banned_foreign_nazi_propaganda_idea_desc: "納粹主義在我們的社會沒有棲身之處，我們不能允許威脅到我們聯邦構成的意識形態繼續擴散，更別說是來自外國的宣傳。"
 SWI_rearmed_idea_industrial: "重整軍備的瑞士"
 SWI_army_limitations_TT: "§R無法訓練公民民兵以外的常規力量，無法在軍事準備決議外修改現有的編制§!\n\n§Y瑞士§!的防衛依靠平民在有需要時拿起武器。可訓練的民兵數量有限，且他們的§Y組織度§!剛開始也會受限。\n\n當§Y$SWI_armed_neutrality$§!國策完成後，民兵可以被擴編、改進，甚至通過§Y$SWI_activate_militia$§!決議部署。當民兵被部署時，對瑞士經濟的懲罰會隨時間增加，但此懲罰會在民兵被解散後重置。"
 SWI_citizen_militia_1: "瑞士公民民兵"
 SWI_citizen_militia_1_desc: "不同於大多數國家，在瑞士，每個能滿足參軍標準的人，都要加入當地民兵組織，一旦國家需要就拿起武器。這使得我們在不影響經濟生產的同時，還能保有極大比例的預備役人口，因為他們平日並未被部署的緣故。\n"
 SWI_citizen_militia_2: "擴大瑞士公民民兵"
 SWI_citizen_militia_2_desc: "$SWI_citizen_militia_1_desc$"
 SWI_spirit_of_helvetia_passive_peace: "消極的赫爾維蒂精神"
