 SWI_old_switzerland_idea: "迴歸舊日"
 SWI_old_switzerland_idea_desc: "經過了長期的可怕戰爭和卑鄙擴張，[ROOT.GetName]人民只望迴歸戰前的中立和民主。這段動盪的時期必須儘快結束。"
