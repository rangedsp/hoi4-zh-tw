 SEA_imperial_influence_events.100.t: "陸軍派系失去影響力"
 SEA_imperial_influence_events.100.desc: "陸軍派系試圖增強對[GetImperialInfluenceRulerTitle]的影響力，但由於自身能力不足未能成功。這使他們顏面盡失、威望下降，影響力也隨之減弱。"
 SEA_imperial_influence_events.110.t: "陸軍派系尋求擴大軍備生產"
 SEA_imperial_influence_events.110.desc: "陸軍提出了他們的要求。看起來他們試圖擴大生產能力和對[GetImperialInfluenceRulerTitle]的影響力，因此要求我們建造更多的軍用工廠來提高產出。他們願意表現出一些耐心，但不會永遠等下去。"
 SEA_imperial_influence_events.120.t: "陸軍派系要求政治任命"
 SEA_imperial_influence_events.120.desc: "陸軍提出了他們的要求。由於缺乏中央控制和自主行動權，他們希望任命一位新的陸軍總司令，這也將有助於加強他們對[GetImperialInfluenceRulerTitle]的影響力。他們願意表現出一些耐心，但不會永遠等下去。"
 SEA_imperial_influence_events.130.t: "陸軍派系要求修改徵兵法案"
 SEA_imperial_influence_events.130.desc: "陸軍提出了他們的要求。他們希望我們擴大徵兵，向農村派遣徵兵人員，為即將到來的戰爭招募更多的年輕人。儘管表面上只是加強我們的武裝力量，但他們似乎也希望增強對[GetImperialInfluenceRulerTitle]的控制和影響力。他們願意表現出一些耐心，但不會永遠等下去。"
 SEA_imperial_influence_events.140.t: "陸軍派系制定擴張計劃"
 SEA_imperial_influence_events.140.desc: "陸軍提出了他們的要求。他們希望我們為了即將到來的征服實施擴軍。儘管表面上只是加強我們的武裝力量，但他們似乎也希望增強[GetImperialInfluenceRulerTitle]的控制和影響力。他們願意表現出一些耐心，但不會永遠等下去。"
 SEA_imperial_influence_events.150.t: "陸軍派系要求支援卡車"
 SEA_imperial_influence_events.150.desc: "陸軍提出了他們的要求。看來他們試圖增強機動車輛的生產以及對[GetImperialInfluenceRulerTitle]的影響力，因此要求我們建造更多的卡車來滿足他們的擴張需求。他們願意表現出一些耐心，但不會永遠等下去。"
 SEA_imperial_influence_events.160.t: "陸軍派系要求提高坦克產量"
 SEA_imperial_influence_events.160.desc: "陸軍提出了他們的要求。看來他們試圖增強坦克生產以及對[GetImperialInfluenceRulerTitle]的影響力，因此要求我們建造更多的坦克來滿足他們的擴張需求。他們願意表現出一些耐心，但不會永遠等下去。"
 SEA_imperial_influence_events.161.t: "陸軍派系要求提高火炮產量"
 SEA_imperial_influence_events.161.desc: "陸軍提出了他們的要求。看來他們試圖增強火炮生產以及對[GetImperialInfluenceRulerTitle]的影響力，因此要求我們建造更多的火炮來滿足他們的擴張需求。他們願意表現出一些耐心，但不會永遠等下去。"
