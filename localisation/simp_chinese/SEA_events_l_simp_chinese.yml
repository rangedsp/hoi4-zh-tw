 GetOppositionPartySupportersName_democratic: "共和派"
 GetOppositionPartySupportersName_communism: "共產派"
 GetOppositionPartySupportersName_fascist: "法西斯派"
 GetOppositionPartySupportersName_neutrality: "威權派"
 GetOppositionPartySupportersName_backup: "社會活動家"
 GetOppositionPartyAdjective_democratic: "共和派"
 GetOppositionPartyAdjective_communism: "共產派"
 GetOppositionPartyAdjective_fascist: "法西斯派"
 GetOppositionPartyAdjective_neutrality: "威權派"
 GetOppositionPartyAdjective_backup: "社會活動家"
 GetOppositionPartyName_democratic: "[ROOT.GetDemocraticParty]"
 GetOppositionPartyName_communism: "[ROOT.GetCommunistParty]"
 GetOppositionPartyName_fascist: "[ROOT.GetFascistParty]"
 GetOppositionPartyName_neutrality: "[ROOT.GetNeutralParty]"
 GetOppositionPartyName_backup: "反對派"
 #SEA_generic_events.1 is hidden
 SEA_generic_events.2.t: "[GetOppositionPartyName]組織罷工"
 SEA_generic_events.2.desc: "某地工廠的[GetOppositionPartyAdjective]派工人短暫停工，抗議要求改善工作條件和擴大政治自由。儘管規模有限，此次罷工確實體現了[GetOppositionPartyName]的支持度。"
 SEA_generic_events.2.a: "把他們解僱換掉"
 SEA_generic_events.2.b: "干預只會引發更多問題"
 SEA_generic_events.3.t: "[GetOppositionPartySupportersName]抗議軟弱的政府"
 SEA_generic_events.3.desc: "據報道，[GetOppositionPartyName]的支持者在首都舉行遊行示威，批評政府效率低下，似乎打算推動一個更加集權的政府。"
 SEA_generic_events.3.a: "他們很幸運有這個權利"
 #SEA_generic_events.3.b: ""
 SEA_generic_events.4.t: "[GetOppositionPartySupportersName]干擾政府會議"
 SEA_generic_events.4.desc: "一小群[GetOppositionPartyName]支持者最近發動了一場規模有限但聲勢不小的抗議擾亂了政府會議。雖然沒造成什麼危害，但類似事件的日益普遍反映了人們對反對派的支持。"
 SEA_generic_events.4.a: "譴責他們的行動"
 SEA_generic_events.4.b: "就當無事發生"
 SEA_generic_events.5.t: "[GetOppositionPartyName]主持集會"
 SEA_generic_events.5.desc: "[GetOppositionPartyName]今天舉行了其近期最大規模的集會，承諾提供[ROOT.GetLeader]政府的強大的替代方案。當前政府尚未確定是應置之不理，還是阻止消息傳播以免為[GetOppositionPartyAdjective]事業吸引更多支持者。"
 SEA_generic_events.5.a: "確保新聞不會報道"
 SEA_generic_events.5.b: "對他們是件好事"
 SEA_generic_events.6.t: "破壞[GetOppositionPartyName]的政府陰謀曝光"
 SEA_generic_events.6.desc: "一份涉及[ROOT.GetRulingParty]派系政府官員的文件被曝光，其中概述了通過切斷資金鍊破壞[GetOppositionPartyName]的計劃。儘管官方稱只是官員的個人行為，但[GetOppositionPartySupportersName]顯然不會相信這種說法。"
 SEA_generic_events.6.a: "公開道歉"
 SEA_generic_events.6.b: "與此計劃劃清界限"
 SEA_generic_events.7.t: "[GetOppositionPartyName]組織大規模集會"
 SEA_generic_events.7.desc: "[GetOppositionPartyAdjective]黨派今日舉行集會，據報參與規模堪比[ROOT.GetRulingParty]的集會。我們只能期望本方支持者不會認同他們的訴求。"
 SEA_generic_events.7.a: "基於他們的訴求組織我方集會"
 #SEA_generic_events.7.b: ""
 SEA_generic_events.8.t: "[GetOppositionPartySupportersName]捲入街頭衝突"
 SEA_generic_events.8.desc: "[GetOppositionPartyName]的支持度今日引發事端，其部分支持者與政府及[ROOT.GetRulingParty]支持者發生衝突，最終警方不得不介入。儘管只是局部事件，但這仍反映出當前緊張的政治氛圍。"
 SEA_generic_events.8.a: "我們可藉此譴責[GetOppositionPartyName]"
 SEA_generic_events.8.b: "重點譴責暴力行為"
 SEA_generic_events.9.t: "外國間諜利用[GetOppositionPartyAdjective]的人氣"
 SEA_generic_events.9.desc: "近期的騷亂後，軍隊和警察都獨立得出結論：[GetOppositionPartyName]成員受到了試圖破壞或窺探我們政府的其他國家的影響。"
 SEA_generic_events.9.a: "公開譴責[GetOppositionPartyName]是外國間諜"
 SEA_generic_events.9.b: "專注於清除這些滲透者"
 SEA_generic_events.10.t: "政府腐敗醜聞"
 SEA_generic_events.10.desc: "[GetOppositionPartyName]等反對派的崛起導致政府不得不採取更具“創造性”的手段來保持權力。近期就有這樣一項計劃被曝光，為了維持[ROOT.GetRulingParty]執政而投入的資源規模引發了強烈抗議。"
 SEA_generic_events.10.a: "否認一切"
 SEA_generic_events.10.b: "與相關人物保持距離"
 SEA_generic_events.11.t: "[GetOppositionPartyAdjective]碼頭工人罷工"
 SEA_generic_events.11.desc: "強烈支持[GetOppositionPartyName]的海軍產業工人發動的大罷工干擾了我們的造船工作。雖然他們的政治訴求很難全部實現，但我們仍然可以改善他們的工作條件以避免更多的動盪。"
 SEA_generic_events.11.a: "我們將確保他們得到公平的補償"
 SEA_generic_events.11.b: "事情會平息的"
 SEA_generic_events.12.t: "[GetOppositionPartySupportersName]反對防禦措施"
 SEA_generic_events.12.desc: "[GetOppositionPartyName]和其他反對派的支持者今天舉行了抗議活動，要求我們不要過度擴軍，擔心我們不斷壯大的軍隊將被部署到國外。"
 SEA_generic_events.12.desc_wartime: "[GetOppositionPartyName]和其他反對派的支持者今天舉行了抗議活動，要求我們結束當前的戰爭，認為我們軍隊的犧牲對[ROOT.GetAdjective]利益來說沒有必要。"
 SEA_generic_events.12.a: "向他們保證這只是為了保護國家"
 SEA_generic_events.12.b: "向他們保證我們也希望實現和平"
 SEA_generic_events.12.c: "拒絕評論"
 SEA_generic_events.13.t: "[GetOppositionPartyAdjective]支持[root.capital.GetCapitalVictoryPointName]的暴亂"
 SEA_generic_events.13.desc: "在警方還未來得及通知我們之前，政府官員就報告稱在[root.capital.GetCapitalVictoryPointName]工作時遭遇了騷亂。這場最初針對[ROOT.GetRulingParty]的大型政治示威似乎演變成了搶劫事件，對整個城市造成了破壞。"
 SEA_generic_events.13.a: "派一名受人尊敬的政治家讓人群冷靜下來"
 SEA_generic_events.13.b: "派出軍隊"
 SEA_generic_events.14.t: "大型反政府抗議"
 SEA_generic_events.14.desc: "[GetOppositionPartyName]雖未掌握實質政權，卻已獲得廣泛支持，引發全國多地大規模抗議活動。滿足抗議者的一些訴求或許能緩和局勢，但也會帶來自身的問題。"
 SEA_generic_events.14.a: "我們將採納[GetOppositionPartyAdjective]的部分提議"
 SEA_generic_events.14.b: "確保抗議活動保持和平"
 SEA_generic_events.15.t: "[GetOppositionPartyAdjective]抗議演變為暴力衝突"
 SEA_generic_events.15.desc: "據悉，由[GetOppositionPartyName]組織的局部大規模抗議因有人向警方投擲物品導致開火回應，最終演變為流血事件。儘管此事並非政府或[GetOppositionPartySupportersName]的過錯，但仍引發對國家穩定性的嚴重關切。"
 SEA_generic_events.15.a: "譴責地方黨派官員"
 SEA_generic_events.15.b: "歸咎於抗議者"
 #######################
 ####### WARLORDS ######
 #######################
 SEA_warlords.1.t: "劉湘之死"
 SEA_warlords.1.desc: "隨著劉湘的去世和中央政府日益增大的壓力，越來越明顯的事實是[ROOT.GetNameDef]可能即將解散。然而有人認為，他的死亡並非巧合，而是一場暗殺，他們願意繼續抗爭，哪怕這會激怒中央政府。"
 SEA_warlords.1.a: "[ROOT.GetNameDefCap]已經完成了使命。"
 SEA_warlords.1.b: "我們必須繼續戰鬥！"
 SEA_warlords.2.t: "[FROM.GetNameDefCap]仍在負隅頑抗"
 SEA_warlords.2.desc: "劉湘去世後，[FROM.GetNameDef]內部爆發權力鬥爭，最終由楊森掌權。由於傳言稱劉湘是被我方勢力暗殺，此後他們便採取與我們政府保持距離、抵制整合的立場。"
 SEA_warlords.2.a: "那些傲慢的將領！"
 SEA_warlords.2.b: "好吧"
 SEA_warlords.3.t: "[FROM.GetNameDefCap]接受整合"
 SEA_warlords.3.desc: "劉湘去世後，[FROM.GetNameDef]迅速解散並承認了我們的權威。我們必須利用這一優勢。"
 SEA_warlords.3.a: "好極了"
 SEA_warlords.4.t: "第二次哈密叛亂"
 SEA_warlords.4.desc: "在我們開始進軍和闐後，堯樂博斯·汗宣佈支持馬虎山並在哈密發動了針對我們的叛亂。我們現在兩面作戰了。"
 SEA_warlords.4.a: "那我們就連他們一起碾碎！"
 SEA_warlords.4.b: "我們必須抓住機會！大汗萬歲！"
 SEA_warlords.5.t: "停滯的衝突"
 SEA_warlords.5.desc: "隨著中央政府施壓不斷加劇，我方部隊士氣日益低落，顯然我們必須停止這場無謂的戰鬥，轉而應對中國面臨的更大威脅。大勢已去，馬虎山的部隊將繼續佔據我省南部地區。"
 SEA_warlords.5.a: "我們應該等待時機"
 SEA_warlords.6.t: "[FROM.GetLeader]請求援助"
 SEA_warlords.6.desc: "[FROM.GetLeader]請求我們協助對抗[SIK.GetLeader]。失去他們意味著我們失去了在新疆的立足點，但同樣重要的是，激怒蘇聯也意味著我們失去了潛在的合作者與擔保國。"
 SEA_warlords.6.a: "提供儘量少的援助以免蘇聯注意"
 SEA_warlords.6.b: "去他媽的蘇聯，我們全力支持他們"
 SEA_warlords.6.c: "我們提供不了任何東西"
 SEA_warlords.7.t: "極少的援助抵達"
 SEA_warlords.7.desc: "中央政府決定給予我們儘量少的援助以免激怒蘇聯，他們更重視與蘇聯的合作關係，而不是我們的生存。"
 SEA_warlords.7.a: "至少還有點東西"
 SEA_warlords.8.t: "援助抵達"
 SEA_warlords.8.desc: "中央政府決定全力支持我們，以確保蘇聯不會奪取我們的省份，即使這可能會損害他們與蘇聯的關係。"
 SEA_warlords.8.a: "有了這些，我們就能逆轉天平！"
 SEA_warlords.9.t: "沒有援助抵達"
 SEA_warlords.9.desc: "中央政府決定不提供任何援助以取悅蘇聯，他們更重視與蘇聯的合作關係，而不是我們的生存。"
 SEA_warlords.9.a: "該死的叛徒"
 SEA_warlords.10.t: "$KUM_yulbars_khan$抵達和闐"
 SEA_warlords.10.desc: "在哈密汗國倒臺後，$KUM_yulbars_khan$逃脫追捕，來到我們這裡繼續與我們共同的敵人作戰。我們應該張開雙臂歡迎他。"
 SEA_warlords.10.a: "馬上讓他去工作！"
 SEA_warlords.11.t: "$KUM_yulbars_khan$抵達"
 SEA_warlords.11.desc: "國民黨將領$KUM_yulbars_khan$在反抗新疆王[SIK.GetLeader]失敗後逃到我們這裡。我們應該張開雙臂歡迎他。"
 SEA_warlords.11.a: "是時候繼續戰鬥了"
 SEA_warlords.12.t: "$XSM_ma_hongbin$抵達"
 SEA_warlords.12.desc: "馬虎山的勢力垮臺後，$XSM_ma_hongbin$逃脫追捕最終來到了我們這裡。我們應該在未來的戰鬥中利用他的經驗和知識。"
 SEA_warlords.12.a: "歡迎回家"
 SEA_warlords.13.t: "叛徒歸來"
 SEA_warlords.13.desc: "隨著馬虎山軍隊的覆滅，曾與叛軍聯手的前喀什官員$KHM_mahmut_muhiti$提議重新迴歸擔任我們的政府官員。他似乎想要獲得第二次機會來挽回聲譽，但考慮到他過去的行為，相信他是不明智的。"
 SEA_warlords.13.a: "我們不會相信叛徒"
 SEA_warlords.13.b: "再給他一次機會"
 SEA_warlords.14.t: "[From.GetLeader]要求支持"
 SEA_warlords.14.desc: "$wtt_political_warlord_support.10.desc$"
 SEA_warlords.14.a: "$wtt_political_warlord_support.10.a$"
 SEA_warlords.14.b: "$wtt_political_warlord_support.10.b$"
 SEA_warlords.14.c: "請求提供人力。"
 SEA_warlords.14.d: "$wtt_political_warlord_support.10.d$"
 SEA_warlords.15.t: "$wtt_political_warlord_support.11.t$"
 SEA_warlords.15.desc: "$wtt_political_warlord_support.11.desc$"
 SEA_warlords.15.a: "$wtt_political_warlord_support.11.a$"
 SEA_warlords.15.b: "$wtt_political_warlord_support.11.b$"
 SEA_warlords.16.t: "$wtt_political_warlord_support.13.t$"
 SEA_warlords.16.desc: "$wtt_political_warlord_support.13.desc$"
 SEA_warlords.16.a: "$wtt_political_warlord_support.13.a$"
 SEA_warlords.16.b: "不可接受。"
 SEA_warlords.17.t: "$wtt_political_warlord_support.12.t$"
 SEA_warlords.17.desc: "$wtt_political_warlord_support.12.desc$"
 SEA_warlords.17.a: "$wtt_political_warlord_support.12.a$"
 SEA_warlords.17.b: "不可接受。"
 SEA_warlords.18.t: "$wtt_political_warlord_support.3.t$"
 SEA_warlords.18.desc: "$wtt_political_warlord_support.3.desc$"
 SEA_warlords.18.a: "$wtt_political_warlord_support.3.a$"
 SEA_warlords.19.t: "$wtt_political_warlord_support.21.t$"
 SEA_warlords.19.desc: "$wtt_political_warlord_support.21.desc$"
 SEA_warlords.19.a: "$wtt_political_warlord_support.21.a$"
 SEA_warlords.20.t: "[FROM.GetName]的軍官抵達"
 SEA_warlords.20.desc: "$wtt_political_warlord_support.23.desc$"
 SEA_warlords.20.a: "$wtt_political_warlord_support.23.a$"
 SEA_warlords.21.t: "$wtt_political_warlord_support.22.t$"
 SEA_warlords.21.desc: "$wtt_political_warlord_support.22.desc$"
 SEA_warlords.21.a: "$wtt_political_warlord_support.22.a$"
 SEA_warlords.22.t: "劉湘之死"
 SEA_warlords.22.desc: "由於[SIC.GetNameDef]的頭子劉湘的去世，局勢變得愈發明顯，我們必須直接介入並接管控制權，以免這片土地落入對我們政府不利的人手中。然而，此舉可能會進一步激怒那些正在爭奪權力的下級軍官，因此我們仍需謹慎行事。"
 SEA_warlords.22.a: "我們應當介入。"
 SEA_warlords.22.b: "聽之任之。"
 SEA_warlords.23.t: "[From.GetNameDefCap]要求歸附"
 SEA_warlords.23.desc: "看來[From.GetLeader]已經開始為中國而戰，並在此過程中集結了其他軍閥站在他一邊，對抗中央政府。如果我們加入，可能會將大部分權力拱手讓給[From.GetNameDef]，但拒絕則可能招致他們的怒火。"
 SEA_warlords.23.a: "戮力同心勝過孤軍奮戰。"
 SEA_warlords.23.b: "我們絕不屈服。"
 SEA_warlords.24.t: "[From.GetLeader]表示服從"
 SEA_warlords.24.desc: "[From.GetLeader]熱情回應了我們聯合對抗中央政府的提議，並誓言將在這場鬥爭中援助我們。我們現在離統一國家又近了一步。"
 SEA_warlords.24.a: "棒極了。"
 SEA_warlords.25.t: "[From.GetLeader]拒絕"
 SEA_warlords.25.desc: "[From.GetLeader]對我們聯合起來為中國而戰的提議大放厥詞、滿嘴髒話，聲稱我們的使命不過是又一次奪取權力和征服各省的嘗試，且註定要失敗。看來在這場戰鬥中，我們不會得到他們的支持。"
 SEA_warlords.25.a: "那我們將不得不把他們也幹掉！"
 SEA_warlords.26.t: "[FROM.GetLeader]要求我們歸附"
 SEA_warlords.26.desc: "[FROM.GetLeader]通過一系列手段在該地區和馬氏家族內部確立了主導地位，現在認為我們歸附於他最為有利。[FROM.GetLeader]還聲稱，如果我們拒絕他的提議，我們將受到懲罰，軍隊也將被摧毀，但最終選擇權在我們手中。"
 SEA_warlords.26.a: "我們別無選擇，只能接受。"
 SEA_warlords.26.b: "我們永不投降！"
 SEA_warlords.27.t: "[FROM.GetLeader]投降"
 SEA_warlords.27.desc: "由於擔心戰鬥只會導致該地區更多的流血和不穩定，[FROM.GetLeader]認為向我們宣誓效忠是最佳選擇。"
 SEA_warlords.27.a: "好消息。"
 SEA_warlords.28.t: "[FROM.GetLeader]拒不退讓"
 SEA_warlords.28.desc: "儘管我們竭盡全力避免進一步的流血衝突，[FROM.GetLeader]卻回信侮辱我們，聲稱我們的威脅毫無意義，並揚言如果我們膽敢入侵，[FROM.GetNameDef]的軍隊將把我們一路趕回[ROOT.Capital.GetName]。"
 SEA_warlords.28.a: "那我們會打倒他們的。"
 SEA_warlords.29.t: "[FROM.GetLeader]提議和平"
 SEA_warlords.29.desc: "鑑於戰爭的最新進展，[FROM.GetLeader]認為繼續與我方對抗已無意義，並提議我們應聯合起來共同對抗更大的敵人。為此，[FROM.GetLeader]提出，若我方接受合作，將全面赦免我方士兵及領導人，赦免其此前可能對中國犯下的任何罪行，以換取加入聯合陣營。"
 SEA_warlords.29.a: "聽起來不錯。"
 SEA_warlords.29.b: "我們決不投降！"
 SEA_warlords.30.t: "[FROM.GetLeader]拒絕投降"
 SEA_warlords.30.desc: "[FROM.GetLeader]聲稱我們提出的和平與赦免提議只是摧毀[FROM.GetNameDef]的騙局，拒絕停止敵對行動，並於今晨再次發動攻勢。看來，僅憑一封信是無法結束這場衝突的。"
 SEA_warlords.30.a: "叛賊！"
 SEA_warlords.31.t: "[FROM.GetLeader]要求移交[434.GetName]"
 SEA_warlords.31.desc: "在邊境近期發生一系列挑釁事件後，[FROM.GetLeader]已正式要求我們從[434.GetName]撤軍，並將其移交給[FROM.GetAdjective]當局。他聲稱，如果我們拒絕，[FROM.GetName]將以武力回應，並將一路進軍直至抵達德里。"
 SEA_warlords.31.a: "他們讓我們別無選擇。"
 SEA_warlords.31.b: "讓他們試試看。"
 SEA_warlords.32.t: "[FROM.GetLeader]拒絕"
 SEA_warlords.32.desc: "儘管我們盡了最大努力說服他們，但通過外交手段奪取[434.GetName]的努力仍無果而終。[FROM.GetLeader]重申了麥克馬洪線，聲稱我們無權擁有該領土，並稱我們的挑釁不過是虛張聲勢。"
 SEA_warlords.32.a: "我們選擇戰鬥。"
 SEA_warlords.33.t: "[FROM.GetLeader]同意移交[434.GetName]"
 SEA_warlords.33.desc: "經過數日的緊張對峙，[FROM.GetLeader]已同意移交[434.GetName]並放棄麥克馬洪線，聲稱強行執行該線只會帶來更多得不償失的麻煩。至此，我國的疆域進一步擴大。"
 SEA_warlords.33.a: "棒極了。"
 tsr_sichuan_border_war.1.t: "[SIC.GetNameDefCap]征服了[601.GetName]"
 tsr_sichuan_border_war.1.desc: "在[601.GetName]的快速軍事行動後，[SIC.GetAdjective]軍隊在劉文輝的率領下奪取了該省的大部分地區，並宣佈該地歸其管轄。"
 tsr_sichuan_border_war.1.a: "我們的力量在壯大！"
 tsr_sichuan_border_war.1.b: "這可不妙"
 tsr_sichuan_border_war.2.t: "[SIC.GetNameDefCap]撤出[601.GetName]"
 tsr_sichuan_border_war.2.desc: "在遭遇嚴重困難後，[SIC.GetAdjective]軍隊從[601.GetName]撤退，並宣佈結束這次軍事遠征。邊界將維持原狀。"
 tsr_sichuan_border_war.2.a: "至少他們沒收復整個西康……"
 tsr_sichuan_border_war.2.b: "西康屹立不倒！"
 chiang_will_be_shot_tt: "§R此事之後，將會有許多人對蔣介石感到憤怒……§!"
 chiang_could_be_shot_tt: "§R此事之後，可能會有人對蔣介石感到憤怒……§!"
 SEA_warlords.34.t: "兩廣事變"
 SEA_warlords.34.desc: "在一系列挑釁之後，廣西與廣東兩省聯合起來，藉口我們對日本態度過於消極，因而質疑我們的統治。他們聲稱若我們不採取行動，他們就會率軍進攻，佔領南京。他們提議蔣介石前往廣州進一步商討如何對付日本，但這是否只是一個陷阱，目前尚不明朗。"
 SEA_warlords.34.a: "我們絕不會上他們的當！"
 SEA_warlords.34.b: "派蔣介石去廣州商討抗日統一戰線"
 SEA_warlords.35.t: "蔣介石抵達廣州"
 SEA_warlords.35.desc: "精神振奮，手臂高舉，蔣介石今日清晨帶著一小支衛隊抵達廣州。看起來，接受邀請並非陷阱，談判立即展開。陳濟棠與李宗仁均敦促蔣介石建立一個抗日的統一戰線，甚至提出暫時與共產黨停止敵對。是否這是正確選擇尚難判斷，但極有可能如此。"
 SEA_warlords.35.a: "那麼我們就團結起來！"
 SEA_warlords.35.b: "先觀望一下……"
 SEA_warlords.36.t: "逃兵與叛徒"
 SEA_warlords.36.desc: "在南京宣佈絕不退讓、並公開與我們對立後，我軍部分部隊出現叛逃。而將領餘漢謀威脅稱，若[ROOT.GetLeader]不辭職，他將率軍進攻廣州，迫使其下臺。"
 SEA_warlords.36.a: "[ROOT.GetLeader]必須辭職"
 SEA_warlords.36.b: "我們不會退讓！"
 SEA_warlords.36.c: "唯有團結一致才能抵禦這一威脅！"
 SEA_warlords.36.tt: "§R若廣西拒絕我們的提議，我們將立刻陷入內戰！§!"
 SEA_warlords.37.t: "廣西之戰"
 SEA_warlords.37.desc: "在南京宣佈絕不退讓、並公開與我們對立後，有人擔心中央政府會動用武力迫使我們屈服於其統治。"
 SEA_warlords.37.a: "那就讓他們來吧！"
 SEA_warlords.37.b: "我們投降"
 SEA_warlords.38.t: "桂系軍閥投降"
 SEA_warlords.38.desc: "擔心我們在驅逐[GXC.GetLeader]的過程中摧毀他們的省份，他們提出成為民國的一部分，以換取所有領導人被赦免並保留職位。這似乎是一個公平的妥協。"
 SEA_warlords.38.a: "好吧"
 SEA_warlords.39.t: "粵系軍閥的崩潰"
 SEA_warlords.39.desc: "在幾小時的劍拔弩張、幾乎爆發內戰之際，陳濟棠同意辭職，我們也將部隊開入廣東。此後該省的命運完全掌握在我們手中。"
 SEA_warlords.39.a: "太好了"
 SEA_warlords.40.t: "廣東內戰"
 SEA_warlords.40.desc: "儘管出現了叛逃到我們這邊的部隊，且餘漢謀威脅要率軍進攻廣州，但陳濟棠拒絕退讓。廣東省最終徹底爆發內戰，親中央與反中央的勢力全面開戰。我們必須介入，平息這場混亂。"
 SEA_warlords.40.a: "那個頑固的蠢貨……"
 SEA_warlords.41.t: "桂系軍閥的抗拒"
 SEA_warlords.41.desc: "[GXC.GetLeader]宣稱我們的入侵威脅不過是笑談，並公開宣佈他們絕不會退讓，反而會迫使我們進行談判。這是否能成功仍言之尚早，但我們只能拭目以待。"
 SEA_warlords.41.a: "哎，算了"
 SEA_warlords.42.t: "韓復榘逃離濟南"
 SEA_warlords.42.desc: "儘管本有能力堅守更久，但韓復榘選擇逃離濟南，導致我們的側翼門戶洞開。他已被我軍以叛國罪拘押，但問題在於如何處置他。我們該樹立典型，徹底沒收其領地，還是暫時任命另一位將領接管，以避免進一步的問題？"
 SEA_warlords.42.a: "殺雞儆猴"
 SEA_warlords.42.b: "暫時讓孫桐萱接管"
 may_join_japan_tt: "§R他有可能投靠日本§!"
 SEA_warlords.43.t: "孫桐萱的治理"
 SEA_warlords.43.desc: "在韓復榘懦弱地逃離濟南後，飽受戰火的山東省出現了權力真空。中央政府選擇不直接插手，而是任命孫桐萱為臨時省主席。接下來如何發展，全由我們決定。"
 SEA_warlords.43.a: "站在中央政府一邊"
 SEA_warlords.43.b: "國民黨已經失敗，我們必須投靠日本！"
 SEA_warlords.44.t: "[FROM.GetLeader]提議兩廣合併"
 SEA_warlords.44.desc: "我們剛剛收到來自[FROM.GetNameDef]的消息，他們希望我們的兩個地區重新合併為“兩廣”實體。這一設想可追溯至清朝的“兩廣總督”。雖然我們已無須這樣的帝制頭銜，但當年這一聯合實體所擁有的權力與聲望無可否認。"
 SEA_warlords.44.a: "是的，唯有更深層次的合作才能成功！"
 SEA_warlords.44.b: "我們不會與南方之王合作！"
 SEA_warlords.45.t: "[FROM.GetLeader]同意合併"
 SEA_warlords.45.desc: "好消息！[GXC.GetNameDefCap]同意了我們提出的兩廣合併提議。我們共同組成了一個強大的陣營，擁有充足的工業、原材料和人力！整個中國如今都在為我們團結的力量而顫抖。"
 SEA_warlords.45.a: "我們必將勝利！"
 SEA_warlords.46.t: "[FROM.GetLeader]拋棄了我們"
 SEA_warlords.46.desc: "我們收到了來自[GXC.GetNameDef]的回覆，不幸的是，他們認為即將失去的“主權”比我們共同的統一未來更為重要。我們必須考慮替代方案——最有可能的就是通過武力實現合併。唯有團結，我們才能抵禦正在集結的強敵。"
 SEA_warlords.46.a: "不勝即亡！"
 SEA_warlords.46.tt: "§R這很可能導致與[CHI.GetNameDef]開戰§!"
 SEA_warlords.47.t: "兩廣軍閥的領導權"
 SEA_warlords.47.desc: "既然統一日益臨近，我們必須做出艱難的決定——究竟由誰來領導這個新的派系。兩個選擇都很穩妥：[ROOT.GetLeader]掌握著空軍的最高指揮權，而李宗仁則是陸戰大師，也是部隊的精神楷模。誰能最終勝出呢？"
 SEA_warlords.47.a: "[ROOT.GetLeader]應當繼續留任"
 SEA_warlords.47.b: "新桂系擁有更強的威望！"
 SEA_warlords.48.t: "南方集結反對我們"
 SEA_warlords.48.desc: "當國家內的小軍閥分散且孤立時，實現統一要容易得多。不幸的是，南方各省已經開始聯合起來，這道防線正日益引起我們的擔憂。一旦他們選擇抵抗，便能動員出驚人的資源與人力來對抗我們。"
 SEA_warlords.48.a: "我們會重新將他們納入掌控！"
 SEA_warlords.48.b: "明智之舉是不要激怒他們……"
 SEA_warlords.48.tt: "§R若我們無法在半年內擊敗他們，將被迫陷入僵局！§!"
 SEA_warlords.49.t: "停滯的衝突"
 SEA_warlords.49.desc: "隨著來自政敵的壓力不斷增加，部隊士氣持續低落，越來越清楚的是，我們必須停止這場毫無意義的戰鬥，將注意力轉向東方更大的威脅。大勢已去，[GDC.GetLeader]的部隊將繼續佔據中國南方。"
 SEA_warlords.49.a: "那麼我們就伺機而動……"
 SEA_warlords.50.t: "[FROM.GetLeader]派遣的代表團抵達"
 SEA_warlords.50.desc: "來自西安的代表團今日抵達，欲就未來數月的抗日措施進行商談。看來[FROM.GetLeader]已經與陝西山區的中共建立了聯繫，並希望與其締結同盟。為此，[FROM.GetLeader]希望我們利用與[SOV.GetNameDef]的關係，爭取有利於即將到來的戰爭的支持。"
 SEA_warlords.50.a: "我們將共同打敗東方的威脅"
 SEA_warlords.51.t: "富有成果的洛川會談"
 SEA_warlords.51.desc: "本週早些時候，我方代表李克農在洛川會見了[FROM.GetLeader]，討論了抗日問題以及在抗戰中尋求蘇聯援助的可能性。會談結束時，他們同意抗擊日本，但不贊成與蔣介石協商。不過，因其父死於日軍之手而心懷仇恨的張學良表示即使拼上性命，也要說服委員長與共產黨共同抗擊日本。"
 SEA_warlords.51.a: "或許我們找到了另一位盟友"
 SEA_warlords.52.t: "[FROM.GetLeader]希望停止“圍剿”"
 SEA_warlords.52.desc: "[FROM.GetLeader]目前受[CHI.GetLeader]之命，負責在我方區域鎮壓所謂的“土匪”。當然，這其中也包括我們。但[FROM.GetLeader]已向我們提出商議，他希望在他籌劃與國民黨建立統一戰線的過程中，雙方暫時停止敵對。我們是否接受這一提議？"
 SEA_warlords.52.a: "我們樂意藉此喘息"
 SEA_warlords.52.b: "我們對[FROM.GetNameDef]另有打算"
 SEA_warlords.53.t: "[FROM.GetLeader]走私資金與裝備以支持革命"
 SEA_warlords.53.desc: "[FROM.GetLeader]開始將南京中央政府提供給他部隊的武器與資金走私至我們的革命根據地，藉此增進雙方互信，並增強我們抗擊[JAP.GetAdjective]的力量。"
 SEA_warlords.53.a: "我們會好好利用它們"
 SEA_warlords.54.t: "[FROM.GetLeader]從[1032.GetName]撤軍"
 SEA_warlords.54.desc: "[FROM.GetLeader]已從延安撤出駐軍，此舉不僅是為了增強我方力量，也意在吸引中央政府的注意。通過這樣做，[CHI.GetLeader]很可能會北上懲罰這些“圍剿”部隊，並試圖將其調往東南，同時責罰像[FROM.GetLeader]和[SHX.GetLeader]這樣的地方叛逆。然而在蔣介石身處西安之際，[FROM.GetLeader]計劃採取極端手段，迫使[CHI.GetLeader]同意建立抗日統一戰線。"
 SEA_warlords.54.a: "好消息！"
 SEA_warlords.55.t: "攻勢停滯"
 SEA_warlords.55.desc: "在中央政府的持續施壓下，我們未能取得任何成果，部隊士氣也日益低落。越來越明顯的是，我們必須停止這場徒勞無功的戰鬥，把重心轉向籠罩中國的更大威脅。大勢已去，[PRC.GetNameDef]在逆境中依然屹立，其部隊將繼續佔據我們省份的北部地區。"
 SEA_warlords.55.a: "我們應該等待時機"
 SEA_warlords.55.tt: "我們現在可以執行國策§Y$XIC_request_relocation_to_northeastern_command$§!"
 SEA_warlords.56.t: "[FROM.GetLeader]請求調任至[608.GetName]"
 SEA_warlords.56.desc: "年輕的少帥[FROM.GetLeader]請求調任至[608.GetName]的東北駐軍，以便更接近日本威脅，充當抵禦其侵略的堡壘。作為前奉系領袖，他似乎希望主動採取行動，收復失地。我們應如何回應？"
 SEA_warlords.56.a: "主動防禦？妙極了！"
 SEA_warlords.56.b: "我們不能將此職位託付於他"
 SEA_warlords.57.t: "[FROM.GetLeader]拒絕我們的請求"
 SEA_warlords.57.desc: "這個自滿的叛徒[FROM.GetLeader]拒絕了我們建立抗日前進據點的請求，顯然並未將中國的未來放在心上。"
 SEA_warlords.57.a: "他們會後悔的……"
 SEA_warlords.58.t: "中央政府施壓要求我們向[XIC.GetNameDef]屈服"
 SEA_warlords.58.desc: "[XIC.GetNameDef]與[FROM.GetNameDef]聯合提出要求，要我們接受他們的新計劃，將[608.GetName]及周邊領土交由少帥作為新的抗日前進基地。他們似乎無論如何都要結束我們的自治……"
 SEA_warlords.58.a: "好吧，我們的使命到此為止"
 SEA_warlords.58.b: "他們只有用武力才能奪取[608.GetName]！"
 SEA_warlords.59.t: "北上大遷移"
 SEA_warlords.59.desc: "終於，收復奉系失地的時刻到來了。[608.GetName]現在已歸我方指揮，我們在陝西的“剿匪”任務也正式結束。很快，所有失去的故土都將重新掌握在我們手中！"
 SEA_warlords.59.a: "我們離恢復往日榮耀又近了一步！"
 SEA_warlords.60.t: "將領投奔[FROM.GetNameDef]"
 SEA_warlords.60.desc: "昔日忠於被關東軍殺害的老帥張作霖的多位將領和士兵，如今響應其子[FROM.GetLeader]的號召，紛紛叛逃，投靠[FROM.GetNameDef]。這真是一場災難！"
 SEA_warlords.60.a: "張作霖的幽靈仍在纏繞我們……"
 SEA_warlords.61.t: "失敗的使命"
 SEA_warlords.61.desc: "在我們綁架了[CHI.GetLeader]，並強迫其暫停“圍剿”、轉而聚焦中國人民更大的威脅之後，中央政府向我們發出了逮捕令和威脅，要求[ROOT.GetLeader]及其核心屬下承擔責任，並徹底解散西北剿匪總司令部。我們該接受此命運，還是另覓生機？"
 SEA_warlords.61.a: "至少我們得到了想要的聯盟……"
 SEA_warlords.61.b: "不，我們必須保持自治，以繼續實現[ROOT.GetLeader]的終極目標！"
 SEA_warlords.62.t: "西北剿匪總司令部的解散"
 SEA_warlords.62.desc: "在[ROOT.GetLeader]被綁架並被迫同意建立第二次統一戰線後，我方官員已對[FROM.GetLeader]及其部屬下達了逮捕令與威脅，並開始調兵徹底終結西北剿匪總司令部的任務。這些叛徒該受到懲罰了。"
 SEA_warlords.62.a: "他們任務失敗了，把他們收拾掉"
 SEA_warlords.63.t: "更多[SOV.GetAdjective]物資通過伊爾克什坦通道抵達"
 SEA_warlords.63.desc: "本週初，額外[SOV.GetAdjective]武器與補給通過西部伊爾克什坦姆山口送達我喀什駐軍。由負責向我政府供應武器的[SOV.GetAdjective]官員亞歷山大·巴爾米涅協調完成，這表明[SOV.GetNameDef]對深化雙方合作已有具體規劃。"
 SEA_warlords.63.a: "我們感謝同志們的慷慨解囊"
 SEA_warlords.64.t: "$KHM_ma_hushan$攜帶[KHM.GetAdjective]黃金抵達"
 SEA_warlords.64.desc: "名聲掃地的國民黨第36師指揮官及[KHM.GetNameDef]帕迪沙$KHM_ma_hushan$拋下他的部隊，攜帶著他和他的手下從省會竊取的1000盎司黃金抵達了[441.GetName]。這散發著機會的味道……"
 SEA_warlords.64.a: "沒收他的黃金！"
 SEA_warlords.65.t: "[FROM.GetLeader]希望統一吉爾吉斯"
 SEA_warlords.65.desc: "[FROM.GetLeader]——我們忠誠的臣屬，在蘇聯內務人民委員會的支持下於該省的軍事政變後掌控了[FROM.GetNameDef]，現已表露出希望將該省與吉爾吉斯斯坦統一的意願，以便更好地發展這些地區，並將分散的人民統一在同一個旗幟下。我們意下如何？"
 SEA_warlords.65.a: "只要他保持忠誠"
 SEA_warlords.65.b: "我們不會在邊界問題上妥協！"
 SEA_warlords.66.t: "[FROM.GetLeader]移交吉爾吉斯斯坦"
 SEA_warlords.66.desc: "[FROM.GetLeader]已同意我們的請求，在收到此消息時，帕米爾地區正移交給我們。從今往後，該地區將由我們自主治理，不再受[FROM.GetAdjective]的直接統治。"
 SEA_warlords.66.a: "偉大的一天！"
 SEA_warlords.67.t: "[FROM.GetLeader]拒絕我方請求"
 SEA_warlords.67.desc: "[FROM.GetLeader]拒絕了我們將土地移交的請求。這原本就在預料之中，但從長遠來看，這必定會損害我們之間的關係。"
 SEA_warlords.67.a: "終有一日我們將奪回它……"
 SEA_warlords.68.t: "國民軍將領投奔[FROM.GetNameDef]"
 SEA_warlords.68.desc: "馮玉祥及其部下曾效忠於國民軍——這個一度反叛我們、在被擊潰後重新歸順的組織，如今隨著[FROM.GetLeader]宣佈恢復該軍事組織，馮玉祥正叛逃至[FROM.GetNameDef]。"
 SEA_warlords.68.a: "國民黨的幽靈依然困擾著我們……"
 SEA_warlords.69.t: "冀察政務委員會的解散"
 SEA_warlords.69.desc: "冀察政務委員會已落入敵軍之手，該委員會作為地方自治機構，本是為履行日本在何梅協定中提出的區域非軍事化要求而設，如今已無實際作用。或許，是時候對他們的領導層加以約束，並將他們的部隊納入中央政府指揮之下。"
 SEA_warlords.69.a: "他們已經完成了他們的任務"
 SEA_warlords.69.b: "他們可能仍對我們有用"
 SEA_warlords.70.t: "平南國的遺產"
 SEA_warlords.70.desc: "如今我們已實現了杜文秀起義與陝甘回變時期人民所追求的目標，將清廷和國民黨的殘餘勢力全部趕出了中國。許多人開始質疑我們統治這片土地的方式。我們究竟該效仿杜文秀，開創我們的新黃金時代，還是選擇更穩妥的道路，追隨袁世凱的腳步？"
 SEA_warlords.70.a: "一種新型政府誕生的時刻到了！"
 SEA_warlords.70.b: "我們將再次成為帝國！"
 SEA_warlords.70.c: "大馬王朝萬歲！"
 SEA_warlords.71.t: "[FROM.GetLeader]請求援助"
 SEA_warlords.71.desc: "[FROM.GetLeader]請求我們協助對抗[SIK.GetLeader]。失去他們意味著我們失去了在新疆的立足點，但同樣重要的是，我們不能讓東邊的共產黨趁我軍外出作戰之時坐收漁利。"
 SEA_warlords.71.a: "我們將協助他們對抗共產主義！"
 SEA_warlords.71.b: "我們已經夠忙的了"
 SEA_warlords.72.t: "[FROM.GetNameDef]援助抵達"
 SEA_warlords.72.desc: "[FROM.GetNameDef]的[FROM.GetLeader]決定全力支持我們，以確保蘇聯不會奪取我們的省份，即使這可能會損害他們與蘇聯的關係。"
 SEA_warlords.72.a: "有了這些，我們就能逆轉天平！"
 SEA_warlords.73.t: "[FROM.GetNameDef]未提供援助"
 SEA_warlords.73.desc: "[FROM.GetNameDef]的[FROM.GetLeader]決定不提供任何援助以取悅蘇聯，他們更重視與蘇聯的合作關係，而不是我們的生存。"
 SEA_warlords.73.a: "該死的叛徒"
 SEA_warlords.74.t: "和闐馬家軍的覆滅"
 SEA_warlords.74.desc: "在對馬虎山發動政變之後，我們的許多家族成員已經開始越過邊境投奔我們，以期在適當時候奪回他們如今已失去的派系勢力。"
 SEA_warlords.74.a: "兄弟們，我們歡迎你們"
 SEA_warlords.75.t: "[FROM.GetLeader]希望開戰綏遠戰役"
 SEA_warlords.75.desc: "內蒙古軍隊和大漢義軍已準備好在我們的空中支援和日本參謀的監督下進攻[SHX.GetLeader]的地盤。也許我們在不對中國發動大規模戰爭的情況下佔領更多內蒙古土地。"
 SEA_warlords.75.a: "他們可以試試看"
 SEA_warlords.75.b: "愚蠢的主意"
 JAP_suiyuan_campaign_has_started_flag: "綏遠戰役已開始"
 JAP_suiyuan_campaign_has_ended_flag: "綏遠戰役已結束"
 SEA_warlords.100.t: "[XIC.GetName]背叛了[ROOT.GetLeader]"
 SEA_warlords.100.desc: "一份緊急報告從[XIC.GetNameDef]傳來，稱[XIC.GetLeader]已將部隊撤出[1032.GetName]，任由[PRC.GetNameDef]的部隊湧入該地區並將其據為己有。[XIC.GetName]成立的全部意義本是遏制並消滅[PRC.GetName]——而非助長其勢力。"
 SEA_warlords.100.a: "這種背叛不可容忍！"
 #Tooltips
 SIC_can_lead_to_war_with_china_tt: "§R這可能會導致與中央政府的進一步衝突！§!"
 SIK_locks_good_focus_tt: "§R我們未能統一新疆§!"
 SIK_failed_campaign_tt: "[SIK.GetLeader]未能驅逐國民黨勢力"
 yulbars_khan_fled_tt: "$KUM_yulbars_khan$逃至和闐"
 TSR_recieve_pp_warlord: "一旦他們履行協議，我們將獲得100政治點數"
 TSR_recieve_manpower_warlord: "一旦他們履行協議，我們將獲得5000人力"
 TSR_recieve_equipment_warlord: "一旦他們履行協議，我們將獲得1000步兵裝備"
 #############
 ##MANCHUKUO##
 #############
 tsr_manchukuo.1.t: "領導權問題"
 tsr_manchukuo.1.desc: "在滿洲國的帝國體制中，皇帝職位始終是一塊心病。在總理張景惠和關東軍的統治下，國家實際上形同共和國，皇帝權力極其微弱，幾乎只是象徵性的傀儡。不過，這一切或許都能改變，一些關東軍軍官認為，國家要繁榮昌盛，皇位必須牢牢掌握在皇帝手中。但也有人認為溥儀軟弱無能、不可信賴，更希望皇位能落到他那位接受過日本教育的弟弟溥傑手中。"
 tsr_manchukuo.1.a: "我們應該維持現狀"
 tsr_manchukuo.1.b: "皇位應該屬於溥儀！"
 tsr_manchukuo.1.c: "皇帝不可信任，溥傑才是正確的選擇。"
 tsr_manchukuo.2.t: "[FROM.GetLeader]索要大連控制權"
 tsr_manchukuo.2.desc: "今晚，[FROM.GetLeader]提出了一個相當有趣的建議：將大連港周邊的關東租借地行政管理權移交出去，而我們則照常維持運營。他表示，既然我們兩國已密不可分，那麼將大連重新併入滿洲國其他地區也合乎情理，同時還能為我們省去一些行政開支。"
 tsr_manchukuo.2.a: "為什麼不呢？"
 tsr_manchukuo.2.b: "我們絕不會就這樣交出我們的領土！"
 tsr_manchukuo.3.t: "移交大連"
 tsr_manchukuo.3.desc: "日本當局認同了我們關於將關東租借地重新併入滿洲其他地區的合乎情理的論點，並已同意移交該地區。"
 tsr_manchukuo.3.a: "完美！"
 tsr_manchukuo.4.t: "日本拒絕"
 tsr_manchukuo.4.desc: "日方人並未被我們的論點說服，相反，他們對我們移交大連港的嚴肅請求回以嘲笑。他們稱這一請求“荒謬至極”，並建議我們重新審視自己在該地區實際扮演角色的重要性。"
 tsr_manchukuo.4.a: "哦，好吧。"
 tsr_manchukuo.5.t: "革命在傳播"
 tsr_manchukuo.5.desc: "在滿洲國發生震驚國內外的事件後，一個名為內蒙古人民革命黨的共產主義團體試圖趁機發動政變，推翻蒙疆政府。雖然他們沒能一口氣成功佔領整個國家，但他們或許很快就能得償所願，看到日本在該地區的控制力迅速瓦解。"
 tsr_manchukuo.5.a: "革命將會勝利！"
 tsr_manchukuo.5.b: "叛徒！"
 tsr_manchukuo.6.t: "[MAN.GetLeader]提議結盟"
 tsr_manchukuo.6.desc: "抗日戰爭勝利後，中國共產黨滿洲地方支部建議我們聯合起來，爭奪對中國的主導權。這是否只是奪取權力的嘗試尚待觀察，但它可能是一個千載難逢的機會。"
 tsr_manchukuo.6.a: "我們當然會支持北方的兄弟們！"
 tsr_manchukuo.6.b: "絕不。"
 tsr_manchukuo.7.t: "[MAN.GetLeader]提議整合"
 tsr_manchukuo.7.desc: "在對民國政府的戰爭取得勝利並宣告中華人民共和國成立後，[MAN.GetLeader]呼籲我們所有其他中共分支整合入新共和國，並承諾可在政府內擔任要職。如果我們拒絕，他將宣稱我們是革命的叛徒，我們將面臨人民解放軍的全面軍事打擊。"
 tsr_manchukuo.7.a: "我們欣然從命。"
 tsr_manchukuo.7.b: "絕不！"
 tsr_manchukuo.8.t: "[FROM.GetLeader]拒絕整合"
 tsr_manchukuo.8.desc: "[FROM.GetLeader]對我們的姿態不為所動，回應稱我們的慷慨提議不過是奴役對方的又一次企圖，他們不會參與這場鬧劇。因此，他們沒給我們留下別的選擇，我們只能出兵入侵，奪回本就屬於我們的東西。"
 tsr_manchukuo.8.a: "放馬過來吧！"
 tsr_manchukuo.9.t: "[FROM.GetLeader]要求移交領土"
 tsr_manchukuo.9.desc: "隨著中國局勢的迅猛變化，[FROM.GetNameDef]的[FROM.GetLeader]作為全中國的代表提出，希望我們協助移交其曾經擁有的部分領土，以換取一個在該地區的盟友。雖然保守估計，移交的領土僅包括革命期間失去的蒙古和圖瓦地區，但部分人甚至主張收回外滿洲，因為黨內許多官員與該地區有著個人淵源。"
 tsr_manchukuo.9.a: "他們什麼也得不到。"
 tsr_manchukuo.9.b: "最初的提議聽起來更好。"
 tsr_manchukuo.9.c: "蒙古是我們的，滿洲就歸他們了。"
 tsr_manchukuo.9.d: "讓他們全拿去吧。"
 tsr_manchukuo.10.t: "[SOV.GetLeader]移交我們的領土"
 tsr_manchukuo.10.desc: "[MAN.GetNameDef]與[SOV.GetNameDef]在未邀請我方的前提下進行了磋商，雙方同意將我國領土移交給[MAN.GetNameDef]。若我方拒絕接受此決定，將面臨來自雙方的壓力，恐釀成嚴重後果。"
 tsr_manchukuo.10.a: "我們無能為力。"
 tsr_manchukuo.10.b: "我們會戰鬥至死！"
 MAN_will_support_japan_tt: "§Y$MAN_urzhin_garmaev$§!和§Y$MAN_jonjurjab$§!將再次獲得日本人的青睞。若我方與[JAP.GetFlag]§Y日本§!爆發戰爭，他們不會站在我們這邊。"
 tsr_manchukuo.11.t: "凌陞事件"
 tsr_manchukuo.11.desc: "興安省主席、泛蒙古政治家凌陞遭關東軍處決後，國內掀起一波動盪。興安軍以及包括蒙古和布里亞特的諸位將領，如$MAN_urzhin_garmaev$和$MAN_jonjurjab$等人，已威脅稱若此事得不到妥善處理，他們將辭職。但妥協安撫可能帶來激怒日本的風險。"
 tsr_manchukuo.11.a: "我們將小心行事。"
 tsr_manchukuo.11.b: "他們儘管辭職吧。"
 tsr_manchukuo.11.c: "讓關東軍道歉。"
 tsr_manchukuo.12.t: "內蒙古人民革命黨滲透"
 tsr_manchukuo.12.desc: "有報告稱，色楞棟魯布領導的內蒙古人民革命黨已聯合滿洲土匪，潛入北方多處要地，現正伺機發動襲擊。我們尚不清楚具體行動時間，但它可能很快就會發生。"
 tsr_manchukuo.12.a: "該死的土匪！"
 tsr_manchukuo.12.b: "我們只能靜觀事態發展。"
 tsr_manchukuo.13.t: "[MAN.GetLeader]要求移交$JAP_naoki_hoshino$"
 tsr_manchukuo.13.desc: "由於滿洲國的工業迅猛發展，[MAN.GetLeader]已經相中$JAP_naoki_hoshino$有一段時間了，認為他可擔任內閣成員。因此，他現在要求將此人調往[MAN.GetNameDef]，出任總務廳長一職。"
 tsr_manchukuo.13.a: "他會為他們好好效力"
 tsr_manchukuo.13.b: "我們需要他在這裡履職"
 tsr_manchukuo.14.t: "$JAP_naoki_hoshino$抵達滿洲國"
 tsr_manchukuo.14.desc: "經過與日方的多次磋商，對方最終同意將$JAP_naoki_hoshino$調任至我國內閣。作為總務廳長，他將為促進我國經濟發展發揮重要作用。"
 tsr_manchukuo.14.a: "棒極了。"
 tsr_manchukuo.15.t: "$JAP_naoki_hoshino$留在日本"
 tsr_manchukuo.15.desc: "日方未被我們的論據說服，決定讓$JAP_naoki_hoshino$留在日本國內，而非到滿洲擔任內閣職位。這令人失望，但我們仍會另尋辦法。"
 tsr_manchukuo.15.a: "好吧"
 tsr_manchukuo.16.t: "[FROM.GetLeader]索要中國控制權"
 tsr_manchukuo.16.desc: "在民族合作政府宣告成立後，[FROM.GetLeader]要求我們將未處於[RNG.GetLeader]統治下的中國屬地併入他的管轄之下。儘管這並非我們原本的計劃，但在當前情況下，通過一個傀儡政權進行統治，很可能比通過多個傀儡政權更為高效。"
 tsr_manchukuo.16.a: "我們將整合它們"
 tsr_manchukuo.16.b: "我們更希望他們保持分治狀態"
 tsr_manchukuo.17.t: "[FROM.GetLeader]接受我方提案"
 tsr_manchukuo.17.desc: "與[FROM.GetNameDef]商討後，雙方一致認為，最佳方案是將中國的行政體系統一於我們領導下。我們期待與他們進一步合作。"
 tsr_manchukuo.17.a: "太好了！"
 tsr_manchukuo.18.t: "[FROM.GetLeader]拒絕我方提案"
 tsr_manchukuo.18.desc: "儘管我們竭力勸說，[FROM.GetAdjective]政府仍認定，將中國政權統一於我們之下並不符合其利益。目前，我們仍將維持分治狀態。"
 tsr_manchukuo.18.a: "該死！"
 tsr_manchukuo.19.t: "蘇聯什麼也沒給我們"
 tsr_manchukuo.19.desc: "儘管我們盡力勸說，蘇聯還是決定不給予我們他們所佔領的任何領土。這對雙方關係是沉重打擊。"
 tsr_manchukuo.19.a: "該死的布爾什維克……"
 tsr_manchukuo.20.t: "蘇聯移交蒙古與圖瓦"
 tsr_manchukuo.20.desc: "由於外東北已深度俄化，蘇聯決定不移交該區域。但他們至少同意歸還蒙古和圖瓦，因為我們對這些領土的主張在時間上更近一些。"
 tsr_manchukuo.20.a: "這樣也行"
 tsr_manchukuo.21.t: "蘇聯移交滿洲"
 tsr_manchukuo.21.desc: "事態出人意料，蘇聯決定將外滿洲交予我們，理由是我們與該地有更直接的歷史聯繫，同時保留蒙古作為緩衝國。"
 tsr_manchukuo.21.a: "至少有點收穫"
 tsr_manchukuo.22.t: "蘇聯滿足了我們所有要求"
 tsr_manchukuo.22.desc: "值得慶幸的是，蘇聯慷慨地同意了我們所有的領土要求，不僅將蒙古與圖瓦，還將外滿洲一併劃入我們的版圖。由此只會帶來好處。"
 tsr_manchukuo.22.a: "太棒了"
 tsr_manchukuo_news.1.t: "大滿洲叛亂"
 tsr_manchukuo_news.1.desc: "在日本行政當局與各路土匪武裝間的衝突持續升級後，名為[MAN.GetLeader]的土匪頭目成功佔領新京，並說服皇帝加入其陣營。\n\n隨著皇帝倒向叛軍，軍隊也很快效仿。如今滿洲正處於十字路口：日本人是會被驅逐出去，還是這場叛亂會如興起時那般迅速被鎮壓？"
 tsr_manchukuo_news.1.a: "豎子的嚎叫？"
 tsr_manchukuo_news.1.b: "我們將重拾天命！"
 tsr_manchukuo_news.1.c: "怎麼會變成這樣？"
 tsr_manchukuo_news.1.d: "真是出人意料。"
 tsr_manchukuo_border_war.1.t: "[MAN.GetNameDefCap]征服了[1039.GetName]"
 tsr_manchukuo_border_war.1.desc: "在[1039.GetName]的快速軍事行動後，[MAN.GetAdjective]軍隊奪取了張家口，宣佈該地區由他們掌控。"
 tsr_manchukuo_border_war.1.a: "我們的力量在壯大！"
 tsr_manchukuo_border_war.1.b: "好吧"
 tsr_manchukuo_border_war.2.t: "[MAN.GetNameDefCap]撤出[1039.GetName]"
 tsr_manchukuo_border_war.2.desc: "由於面對重重困境，[MAN.GetAdjective]軍隊已被迫從張家口撤退。這或許並不意味著衝突的終結，但目前張家口仍將處於[CHI.GetAdjective]控制下。"
 tsr_manchukuo_border_war.2.a: "暫時的挫折……"
 tsr_manchukuo_border_war.2.b: "察南屹立不倒！"
 tsr_manchukuo_border_war.3.t: "[MAN.GetNameDefCap]征服[608.GetName]"
 tsr_manchukuo_border_war.3.desc: "隨著[MAN.GetAdjective]軍隊勝利進駐北京，[CHI.GetAdjective]軍隊已向南撤退至更易防守的陣地。"
 tsr_manchukuo_border_war.3.a: "北京終於是我們的了！"
 tsr_manchukuo_border_war.3.b: "他們讓我們別無選擇，撤退！"
 tsr_manchukuo_border_war.4.t: "[MAN.GetNameDefCap]撤出[608.GetName]"
 tsr_manchukuo_border_war.4.desc: "[MAN.GetAdjective]軍隊未能攻佔北京，並已從該城撤退，然而這段暫時的和平能持續多久仍不確定。"
 tsr_manchukuo_border_war.4.a: "我們失敗了。"
 tsr_manchukuo_border_war.4.b: "北京不會輕易淪陷！"
 tsr_manchukuo_border_war.5.t: "[MAN.GetNameDefCap]征服[614.GetName]"
 tsr_manchukuo_border_war.5.desc: "在完全佔領河北之後，雙方達成停戰協議，約定除非受到挑釁，[MAN.GetAdjective]軍隊不得再進一步推進至中國領土。"
 tsr_manchukuo_border_war.5.a: "離勝利更近一步！"
 tsr_manchukuo_border_war.5.b: "又一個省份丟了……"
 tsr_manchukuo_border_war.6.t: "[MAN.GetNameDefCap]撤出[614.GetName]"
 tsr_manchukuo_border_war.6.desc: "雖然北京落入[MAN.GetAdjective]軍隊手中，但他們向河北省推進的行動被挫敗了。"
 tsr_manchukuo_border_war.6.a: "好吧。"
 tsr_manchukuo_border_war.6.b: "河北屹立不倒！"


