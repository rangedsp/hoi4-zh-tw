 SEA_imperial_influence_events.240.t: "海軍派系要求提高航空母艦產量"
 SEA_imperial_influence_events.240.desc: "海軍提出了他們的要求。看來他們試圖增強航母艦隊的生產以及對[GetImperialInfluenceRulerTitle]的影響力，因此要求我們建造更多的航空母艦來滿足他們的擴張需求。他們願意表現出一些耐心，但不會永遠等下去。"
 SEA_imperial_influence_events.241.t: "海軍派系要求提高海軍裝備生產"
 SEA_imperial_influence_events.241.desc: "海軍提出了他們的要求。看起來他們試圖擴大生產能力和對[GetImperialInfluenceRulerTitle]的影響力，因此要求我們建造更多的海軍船塢來提高產出。他們願意表現出一些耐心，但不會永遠等下去。"
 SEA_imperial_influence_events.242.t: "海軍派系要求提高戰列艦產量"
 SEA_imperial_influence_events.242.desc: "海軍提出了他們的要求。看來他們試圖增強戰列艦的生產以及對[GetImperialInfluenceRulerTitle]的影響力，因此要求我們建造更多的戰列艦來滿足他們的擴張需求。他們願意表現出一些耐心，但不會永遠等下去。"
 #Zaibatsu
 SEA_imperial_influence_events.300.t: "財閥派系失去影響力"
 SEA_imperial_influence_events.300.desc: "財閥派系試圖增強對[GetImperialInfluenceRulerTitle]的影響力，但由於自身能力不足未能成功。這使他們顏面盡失、威望下降，影響力也隨之減弱。"
 SEA_imperial_influence_events.310.t: "財閥派系尋求發展基礎工業"
 SEA_imperial_influence_events.310.desc: "財閥領袖提出了他們的要求。看起來他們試圖擴大他們的產業和對[GetImperialInfluenceRulerTitle]的影響力，因此要求我們建造更多的民用工廠來提高產出。他們願意表現出一些耐心，但不會永遠等下去。"
 SEA_imperial_influence_events.320.t: "財閥派系要求政治任命"
 SEA_imperial_influence_events.320.desc: "財閥領袖已提出要求。他們希望至少有一名成員能進入[GetImperialInfluenceRulerTitle]的顧問團，以便主導國家工業化進程與發展方向。他們願意表現出一些耐心，但不會永遠等下去。"
 SEA_imperial_influence_events.330.t: "財閥派系要求修改經濟法案"
 SEA_imperial_influence_events.330.desc: "財閥領袖已提出要求。他們要求調整國家經濟戰略，將更多資金投入工業聯合企業。儘管表面以強化經濟為名，實則企圖加強對[GetImperialInfluenceRulerTitle]的控制與影響力。他們願意表現出一些耐心，但不會永遠等下去。"
 SEA_imperial_influence_events.340.t: "財閥派系要求僱傭工業企業"
 SEA_imperial_influence_events.340.desc: "財閥領袖已提出要求。他們希望至少有一家企業能獲得[GetImperialInfluenceRulerTitle]的直接合同，從而掌控國家工業化進程與發展方向。他們願意表現出一些耐心，但不會永遠等下去。"
 #Government
 SEA_imperial_influence_events.400.t: "文官政府失去影響力"
 SEA_imperial_influence_events.400.desc: "文官政府試圖增強對[GetImperialInfluenceRulerTitle]的影響力，但由於自身能力不足未能成功。這使他們顏面盡失、威望下降，影響力也隨之減弱。"
 SEA_imperial_influence_events.420.t: "文官政府派系要求政治任命"
 SEA_imperial_influence_events.420.desc: "文官領袖已提出要求。他們希望至少有一名成員進入[GetImperialInfluenceRulerTitle]的顧問團，以便引導國家政治方向並邁向更光明的未來。他們願意表現出一些耐心，但不會永遠等下去。"
 SEA_imperial_influence_events.430.t: "文官政府要求修改貿易法案"
 SEA_imperial_influence_events.430.desc: "文官領袖已提出要求。他們要求調整國家經濟戰略，將投資和貿易策略轉向國際主義及改善與貿易伙伴的關係。儘管表面以強化經濟為名，實則企圖加強對[GetImperialInfluenceRulerTitle]的控制與影響力。他們願意表現出一些耐心，但不會永遠等下去。"
 SEA_imperial_influence_events.440.t: "文官政府派系尋求限制陸軍影響力"
 SEA_imperial_influence_events.440.desc: "文官領袖已提出要求。他們對陸軍日益增長的影響力以及對[GetImperialInfluenceRulerTitle]的進一步控制感到憂慮，要求迅速採取行動限制其勢力擴張。他們願意表現出一些耐心，但不會永遠等下去。"
 SEA_imperial_influence_events.450.t: "文官政府派系尋求限制海軍影響力"
 SEA_imperial_influence_events.450.desc: "文官領袖已提出要求。他們對海軍日益增長的影響力與對[GetImperialInfluenceRulerTitle]的進一步控制感到憂慮，要求迅速採取行動限制其勢力擴張。他們願意表現出一些耐心，但不會永遠等下去。"
 SEA_imperial_influence_events.460.t: "文官政府派系尋求限制財閥影響力"
 SEA_imperial_influence_events.460.desc: "文官領袖已提出要求。他們對財閥日益增長的影響力與對[GetImperialInfluenceRulerTitle]的進一步控制感到憂慮，要求迅速採取行動限制其勢力擴張。他們願意表現出一些耐心，但不會永遠等下去。"
 SEA_japan_air_accidents_events.01.t: "$JAP_isoroku_yamamoto$溘然長逝"
 SEA_japan_air_accidents_events.01.desc: "今天早些時候，海軍大將山本五十六被敵方火力擊落。一隊[USA.GetAdjective]戰鬥機截獲我方情報後實施攔截行動。美軍將此次卑劣行動命名為“復仇行動”，其警告意味不言而喻。在我國為這位偉大戰士的犧牲而哀悼之際，我們絕不能忘記消滅這個無恥敵人的使命！"
 SEA_japan_air_accidents_events.01.a: "真是致命的一擊……"
 SEA_japan_air_accidents_events.02.t: "躲過復仇行動"
 SEA_japan_air_accidents_events.02.desc: "今天早些時候，海軍大將山本五十六在轉場飛行途中遭遇敵軍火力襲擊。他成功聯繫區域海軍航空隊並避開火力網，最終駕機安全降落。大將因在此危急關頭保持冷靜並展現英勇而受到讚譽。"
 SEA_japan_air_accidents_events.02.a: "他的榮譽得到維護"
 ## NEWS EVENTS
 SEA_japan_news_events.01.t: "[JAP.GetLeader]發聲反對軍部干預"
 SEA_japan_news_events.01.desc: "\n[JAP.GetLeader]在近日一場激烈演說中指出，陸軍內部皇道派近期發動了未遂的政變，軍方此次行為已逾越底線。他進一步宣稱：“如果說邊緣勢力屢次實施暗殺及顛覆政府的行徑尚不足懼，他們現在已企圖利用此事件擴張自身權力，將國家從人民手中奪走。絕不容許此事繼續發生！”\n\n看來，[JAP.GetNameDef]國內可能正醞釀著衝突。"
 SEA_japan_news_events.01.a: "我們必須迴歸大正時代的做法！"
 SEA_japan_news_events.01.b: "看來終於有人硬氣起來了"
 SEA_japan_news_events.02.t: "大東亞共榮圈的形成"
 SEA_japan_news_events.02.desc: "\n為確保經濟自給自足、促進成員國間合作，並抵禦西方帝國主義和蘇聯共產主義的影響，[JAP.GetLeader]於今日宣佈成立“大東亞共榮圈”。這一聯盟是否真如宣稱般目標明確，抑或只是[JAP.GetAdjective]宣傳機器的又一精心策劃，仍是眾人心中最大的疑問。"
 SEA_japan_news_events.02.a: "我們將為整個亞洲帶來繁榮！"
 SEA_japan_news_events.02.b: "宣傳機器的又一個陰謀"
 SEA_japan_news_events.03.t: "仰光的陷落"
 SEA_japan_news_events.03.d: "日軍在緬甸的攻勢仍在持續，仰光於近期淪陷。為英屬緬甸的首府，這座城市具有極其重要的戰略意義，其失守可能會成為當前緬甸戰役中的一個決定性因素。\n\n據報道，殖民地總督在將自己的行李從總督府督運至卡車車隊時，被日軍先頭部隊俘獲，但這一消息尚未得到證實。"
 SEA_japan_news_events.03.a: "反對帝國主義的又一次勝利！"
 #########################
 ### NATIONALIST CHINA ###
 #########################
 # Requesting Soviet aid
 SEA_china.1.t: "[FROM.GetNameDefCap]尋求我們的支持"
 SEA_china.1.desc: "我們收到了來自[FROM.GetNameDef]的請求，對方希望我們提供物資支援。儘管[FROM.GetLeader]過去曾發表過對我們質疑的言論，但這或許是將該地區的外國利益與我們捆綁在一起的契機。"
 SEA_china.1.a: "我們會支持他們"
 SEA_china.1.b: "這太冒險了"
 SEA_china.2.t: "[FROM.GetNameDefCap]同意支持我們"
 SEA_china.2.desc: "在認清形勢後，[FROM.GetNameDef]決定支持我們的鬥爭。我們並不認為這出於善意，他們只是為了自身利益，想讓我們替他們幹髒活罷了。"
 SEA_china.2.a: "這將幫上我們"
 SEA_china.3.t: "[FROM.GetNameDefCap]拒絕我們的請求"
 SEA_china.3.desc: "不出所料，我們向[FROM.GetNameDef]提出的支援請求被拒絕了。儘管我們原本也沒抱多大希望，但還是期待過他們至少能認同[JAP.GetNameDef]對全亞洲構成的威脅。但顯然，我們錯判了形勢。"
 SEA_china.3.a: "我們能期待些什麼"
 # Requesting American/Allied aid
 SEA_china.4.t: "[FROM.GetNameDefCap]尋求我們的支持"
 SEA_china.4.desc: "我們收到了來自[FROM.GetNameDef]的[FROM.GetLeader]發來的請求，對方希望我們在其與[JAP.GetNameDef]的衝突中獲得資金和物資支援。這條消息並非通過無線電臺或外交人員傳達，而是由$CHI_soong_mei_ling$夫人作為特使親自趕赴我國，她在[ROOT.GetName]各地巡訪期間已吸引了大量民眾關注。雖然牽制住[JAP.GetNameDef]本就對我們有利，但我們或許也能借助此次巡訪的聲勢從中獲益。"
 SEA_china.4.a: "我們會支持他們"
 SEA_china.4.b: "我們得先確保自身的安全"
 SEA_china.4.tt: "使§Y展現決心§!的§Y火炮裝備§!獎勵提高100"
 SEA_china.5.t: "[FROM.GetNameDefCap]同意支持我們"
 SEA_china.5.desc: "我們收到了對請求的答覆，欣然報告外國資金即將到賬。這將極大促進我們的工業發展，使我們能大幅擴充武裝力量。或許未來，這些援助還可進一步擴展至物資支援。"
 SEA_china.5.a: "通往勝利的道路已在眼前"
 SEA_china.5.tt: "使§Y展現決心§!的§Y$CIC_BANK_HEADER$§!獎勵提高§Y1000§!"
 SEA_china.6.t: "[FROM.GetNameDefCap]拒絕我們的請求"
 SEA_china.6.desc: "我們向[FROM.GetNameDef]發出的求助已得到回覆，他們選擇拋棄我們。不會有支援，也不會有任何資金。我們再次獨自面對侵略者，就像過去多次經歷過的那樣。我們必須勝利——因為若我們失敗，將無人能講述我們的故事。"
 SEA_china.6.a: "為國家存亡而戰！"
 ### Warlord - Invitation to Join Faction
 SEA_china.7.t: "來自[FROM.GetName]的邀請"
 SEA_china.7.desc: "[FROM.GetName]中央政府已邀請[ROOT.GetName]加入他們的陣營。他們談到了民族團結和作為一個整體抵抗外國侵略的必要性。儘管意識形態分歧依然存在，但面對日益增長的威脅，合作可能值得考慮。"
 SEA_china.7.a: "我們將並肩作戰。"
 SEA_china.7.b: "我們不會用獨立換取承諾。"
 ### SEA_china.8 - Acceptance
 SEA_china.8.t: "[FROM.GetName]接受了邀請"
 SEA_china.8.desc: "[FROM.GetLeader]同意了我們的提議。[FROM.GetNameDefCap]會加入我們的陣營，在團結民族、保衛民族對抗外敵的鬥爭中與我們並肩作戰。這是中華大統一的重要一步。"
 SEA_china.8.a: "團結使我們更強大。"
 ### SEA_china.9 - Rejection
 SEA_china.9.t: "[FROM.GetName]拒絕了提議"
 SEA_china.9.desc: "[FROM.GetLeader]拒絕加入我們的陣營，理由是需要維護地區獨立和政治自治。雖然很遺憾，但這一決定反映了國家內部持久的分歧。"
 SEA_china.9.a: "他們會後悔的。"
 # Joining the Allies
 SEA_china.10.t: "[FROM.GetNameDefCap]請求加入我們"
 SEA_china.10.desc: "我們收到了[FROM.GetNameDef]的提議，他們希望[FROM.GetFactionName]全體成員加入[ROOT.GetFactionName]。若我們接受，潛在敵人將減少，而我們的地位將進一步強化。問題在於，他們的意圖是否可信，是否會企圖取代我們。"
 SEA_china.10.a: "我們人多力量大"
 SEA_china.10.b: "我們無法接受此事"
 SEA_china.11.t: "[FROM.GetNameDefCap]支持我們的提案"
 SEA_china.11.desc: "我們已收到[FROM.GetFactionName]領導人的回覆，只關注自身這片小天地的時代結束了。[FROM.GetNameDef]政府熱情地接納了我們，現在我們得以平等地在這個世界上立足。"
 SEA_china.11.a: "我們走上同一條道路"
 SEA_china.12.t: "[FROM.GetNameDefCap]拒絕我們的請求"
 SEA_china.12.desc: "[FROM.GetFactionName]的領導人拒絕了我們的聯合提議。這原本是為世界帶來和平與穩定的機會，但遺憾的是有些人反對這樣做。"
 SEA_china.12.a: "令人沮喪"
 SEA_china.12.b: "我們的路我們自己走"
 # Chiang gets killed
 SEA_china.13.t: "[CHI.GetLeader]遇刺"
 SEA_china.13.desc: "我們偉大的領袖[CHI.GetLeader]在途中遭攔停後，於車內遭槍擊。據稱槍手是單獨行動，但由於其在抓捕過程中被當場擊斃，任何潛在的同謀都將逍遙法外。黨內已開始物色接班人選。"
 SEA_china.13.a: "真是悲劇"
 # Giving away Subject
 SEA_china.14.t: "[FROM.GetName]將控制權移交[JAP.GetNameDef]"
 SEA_china.14.desc: "為了安撫[JAP.GetNameDef]，絕望的中央政府給了他們對我們的宗主權。我們完全不敢相信新政府能做出這種卑鄙行為。"
 SEA_china.14.a: "木已成舟……"
 SEA_china.14.b: "我們不能接受，拿起武器！"
 SEA_china.15.t: "我們獲得[FROM.GetNameDef]的控制權"
 SEA_china.15.desc: "為了安撫我們部隊中的鷹派，[CHI.GetName]已將[FROM.GetName]的控制權移交給了我們。看來近期內不會有衝突了。"
 SEA_china.15.a: "很好。"
 # Informing Japan
 SEA_china.16.t: "[From.GetName]給予我們駐港權"
 SEA_china.16.desc: "為了安撫我們不要進攻，[From.GetName]給予了我們駐港權。關東軍決定暫時收手。"
 SEA_china.16.a: "好極了！"
 SEA_china.17.t: "[From.GetName]給予我們空軍基地通行權"
 SEA_china.17.desc: "為了安撫我們不要進攻，[From.GetName]給予了我們空軍基地通行權。關東軍決定暫時收手。"
 SEA_china.17.a: "好極了！"
 SEA_china.18.t: "[From.GetName]給予我們資源開採權"
 SEA_china.18.desc: "為了安撫我們不要進攻，[From.GetName]給予了我們資源開採權。關東軍決定暫時收手。"
 SEA_china.18.a: "好極了！"
 ### Chinese Nine-Power Treaty Crisis ###
 SEA_china.19.t: "[CHI.GetName]要求廢除九國公約"
 SEA_china.19.desc: "今天，我國外交部收到了[CHI.GetNameDef]的正式信函，稱《九國公約》限制了[CHI.GetAdjective]的主權，必須立即廢除。[CHI.GetLeader]堅持認為該條約是被迫簽署，併發誓無論我們是否同意，都要恢復完全獨立。"
 SEA_china.19.a: "同意北京方面的要求"
 SEA_china.19.b: "拒絕廢除條約"
 SEA_china.19_tt: "§R我們將加入中國對日的戰爭！§!"
 # FROM accepts Beijing’s demand without reservation ---
 SEA_china.20.t: "[FROM.GetName]放棄九國公約"
 SEA_china.20.desc: "[FROM.GetNameDefCap]已確認立即退出九國公約。他們承認該條約已經過時，[CHI.GetAdjective]的主權必須不受阻礙。"
 SEA_china.20.a: "一場大快人心、一錘定音的勝利。"
 # China reacts to refusal
 SEA_china.21.t: "[FROM.GetName]違抗北京"
 SEA_china.21.desc: "[FROM.GetNameDefCap]拒絕廢除九國公約，稱這將影響太平洋地區脆弱的力量平衡。這對任何正常人來說都是侮辱，更別提帝國主義小丑耀武揚威的時代已經結束了。我們必須決定是繼續施壓還是撤離外交鬥場。"
 SEA_china.21.a: "繼續施壓"
 SEA_china.21.b: "暫時讓步"
 # Beijing escalates; target nation must respond
 SEA_china.22.t: "[CHI.GetName]進一步施壓"
 SEA_china.22.desc: "北京加大籌碼了。內閣就如何回應這一陡增的壓力爭論不斷。以禁運反擊之可能重創貿易，或許該讓[CHI.GetName]從其義務中解脫。"
 SEA_china.22.a: "對[CHI.GetName]實施禁運"
 SEA_china.22.b: "什麼也不做"
 #FROM enacts a blockade against China ---
 SEA_china.23.t: "[FROM.GetName]對我們實施禁運"
 SEA_china.23.desc: "[FROM.GetAdjective]政府宣佈對我們實施禁運，作為對我國拒絕《九國公約》的懲罰。[FROM.GetNameDef]的港務局長拒絕了每一艘中國商船。國內媒體譴責這一措施是經濟扼殺，這是早已過去的帝國主義時代的垂死掙扎。"
 SEA_china.23.a: "我們不會被嚇倒"
 #FROM yields to Chinese pressure and scraps the treaty ---
 SEA_china.24.t: "[FROM.GetName]廢除九國公約"
 SEA_china.24.desc: "來自[FROM.GetNameDef]的電報送達南京，確認其退出九國公約。在[FROM.GetAdjective]外交官承認中國不再受協議約束的同時，他們的河道巡邏隊正為遠航做準備。人們聚集在外交部大門前，傾聽著廣播宣告又一項不平等條約的結束。"
 SEA_china.24.a: "國家主權的勝利"
 # China requests Armor MIO
 SEA_china.25.t: "中國請求裝甲專家"
 SEA_china.25.desc: "[FROM.GetNameDefCap]向我們提出請求，希望我們的裝甲部隊專家協助他們轉向更現代化的作戰模式。我們可以派遣主要製造商之一的顧問團，或者直接拒絕他們的請求。"
 SEA_china.25.a: "$morozov_design_bureau$"
 SEA_china.25.b: "$astrov_design_bureau$"
 SEA_china.25.c: "$okmo$"
 SEA_china.25.d: "他們不配獲得幫助"
 SOV_accepted_Morozov: "[SOV.GetNameDefCap]派遣了$morozov_design_bureau$的團隊。"
 SOV_accepted_Astrov: "[SOV.GetNameDefCap]派遣了$astrov_design_bureau$的團隊。"
 SOV_accepted_OKMO: "[SOV.GetNameDefCap]派遣了$okmo$的團隊。"
 # Answering yes
 SEA_china.26.t: "[SOV.GetNameDefCap]答覆"
 SEA_china.26.desc: "我們現在已收到[SOV.GetNameDef]的答覆，他們同意派遣一組專家過來。他們應該很快就會抵達，屆時我們將著手安排他們加強我們的坦克部隊。"
 SEA_china.26.a: "我們向著勝利進軍"
 # Answering no
 SEA_china.27.t: "[SOV.GetNameDefCap]答覆"
 SEA_china.27.desc: "遺憾的是，[SOV.GetNameDef]已決定不提供我們所需的援助。儘管我們不清楚對方拒絕這一小小請求的原因，但看來我們必須另尋他法了……"
 SEA_china.27.a: "他們會後悔的。"
 SEA_china.28.t: "[FROM.GetName]要求歸附"
 SEA_china.28.desc: "中央政府已向[JAP.GetNameDef]屈服，承諾不再反對其領土擴張。如今輪到我們遭受打擊，[JAP.GetAdjective]索要我們的土地，企圖通過外交脅迫將我們吞併。"
 SEA_china.28.a: "我們別無選擇"
 the_game_will_end_for_us: "§R這將導致遊戲結束！§!"
 SEA_china.28.b: "絕不！"
 # Zhang Xueliang getting thrown in jail
 SEA_china.29.t: "$CHI_zhang_xueliang$的命運"
 SEA_china.29.desc: "為了國家的自由，$CHI_zhang_xueliang$過分熱忱，嚴重越權行事。通常情況下，這是無法接受的，但我們所處的並非尋常時期。儘管[ROOT.GetLeader]要求我們將其囚禁，但[CHI_zhang_xueliang.GetName]的能力或許能派上用場。"
 SEA_china.29.a: "把他關進監獄！"
 SEA_china.29.b: "我們不能失去他……"
 SEA_china_improvement.1.t: "新階級的軍官"
 SEA_china_improvement.1.desc: "陽光明媚，襯衫熨得平整，靴子擦得鋥亮。他們整齊列隊，聆聽前來為他們畢業典禮致辭的[ROOT.GetLeader]講話。很快，他們就要奔赴前線，為[ROOT.GetNameDef]贏得榮耀。"
 SEA_china_improvement.1.a: "志願軍向榮耀進軍。"
 SEA_china_improvement.1_tt: "\n§Y$MODIFIER_CONSCRIPTION_TOTAL_FACTOR$§!將§G每6個月增加一次§!"
 SEA_china_improvement.2.t: "剷除毒瘤"
 SEA_china_improvement.2.desc: "認清鴉片貿易對國家權威和公眾信任的侵蝕後，我們需要發動一項長期運動以削弱鴉片即得利益體的影響。官員被佈置了嚴格檢查、行政改組和開展公眾宣傳的任務，但成效非朝夕可見。不過，每項舉措都在削弱以[CHI.GetAdjective]軟肋為生的黑暗勢力。"
 SEA_china_improvement.2.a: "開始持久戰吧。"
 SEA_china_improvement.2_tt: "§Y非法貿易§!負面影響每六個月將被削弱一次"
 SEA_china_improvement.3.t: "惡習終結"
 SEA_china_improvement.3.desc: "經過多年的不懈改革、暗中清洗和嚴格監管，最後一批大型鴉片集團終被剷除。數十年來首次，國意遍鄉，無人敢違。憤世嫉俗者仍低聲懷念舊日，但也不得不承認如今環境更清朗了。"
 SEA_china_improvement.3.a: "大功告成"
 SEA_china_warlords.1.t: "[FROM.GetName]要求我們臣服"
 SEA_china_warlords.1.desc: "從南京寄來了一封帶有中央政府公印的信件。團結和民族命運的華麗辭藻背後，是要求我們向[FROM.GetLeader]臣服並接受[FROM.GetNameDef]對我方領域的管轄。沒有談判的餘地，要麼乖乖聽話，要麼後果自負。"
 SEA_china_warlords.1.a: "讓他們來試試。"
 SEA_china_warlords.1.b: "我們別無選擇，只能聽命。"
 SEA_china_warlords.1.tt: "§R我們將成為[FROM.GetName]的附庸§!"
 SEA_china_warlords.2.t: "[FROM.GetName]低頭"
 SEA_china_warlords.2.desc: "[FROM.GetName]已接受我們的最後通牒。其領導人雖大談國家統一與歷史命運，但意圖顯而易見——他們如今承認了[ROOT.GetNameDef]的權威。\n儘管他們的歸順或許心有不甘，但這避免了中國的進一步分裂與流血衝突。"
 SEA_china_warlords.2.a: "破碎的太陽重聚光芒。"
 SEA_china_warlords.3.t: "[FROM.GetName]拒絕"
 SEA_china_warlords.3.desc: "最後通牒已被拒絕。[FROM.GetLeader]選擇公然違抗，明確表示絕不屈服。我們的使者已被遣回，外交手段將讓位於戰爭。"
 SEA_china_warlords.3.a: "那就讓他們乖乖就範！"
 SEA_china_warlords.4.t: "[FROM.GetNameDef]要求完全吞併"
 SEA_china_warlords.4.desc: "隨著局勢趨於穩定，中央政府的權威得到重申，[FROM.GetNameDef]著手廢除軍閥自治的最後殘餘。[THIS.GetNameDefCap]現需將所有剩餘的行政與軍事控制權移交中央政府，完成統一進程。"
 SEA_china_warlords.4.a: "我們需要低頭。"
 SEA_china_warlords.4.b: "絕不！"
 SEA_china_warlords.5.t: "[FROM.GetNameDefCap]接受整合"
 SEA_china_warlords.5.desc: "[FROM.GetLeader]認識到國家統一的必要性，已同意解散[FROM.GetNameDef]，並將所有權力移交至[ROOT.GetNameDef]。其武裝力量正被納入國家指揮體系，行政機構也在逐步解散。"
 SEA_china_warlords.5.a: "團結必勝"
 SEA_china_warlords.6.t: "[FROM.GetNameDefCap]拒絕整合"
 SEA_china_warlords.6.desc: "[FROM.GetLeader]拒絕了最後通牒，選擇公然違抗中央政府。[FROM.GetNameDefCap]名義上仍是屬國，但其行徑承認了獨立的野心。這種違抗之舉絕不能不予以回應。"
 SEA_china_warlords.6.a: "他們會為此後悔的。"
 SEA_china_democratic.1.t: "民國的總統"
 SEA_china_democratic.1.desc: "終於到了恢復中國自由選舉的時刻，也到了重建被內外勢力摧毀的民國的時刻。問題在於，誰將繼承孫中山先生的衣缽，成為這個新民國的首任總統？"
 SEA_china_democratic.1.a: "中國農工民主黨擁有優秀候選人"
 SEA_china_democratic.1.b: "張君勱已展現出價值"
 SEA_china_democratic.1.c: "宋慶齡是理想的領導者"
 SEA_china_democratic.1.d: "曾琦應當得到這一機會"
 SEA_china_democratic.2.t: "[FROM.GetNameDefCap]邀請我們加入他們的聯盟"
 SEA_china_democratic.2.desc: "遠道而來的一個代表團最近抵達我國首都，要求[ROOT.GetLeader]接見。他們聲稱來自[FROM.GetNameDef]，希望與我們結盟。我們是否接受？"
 SEA_china_democratic.2.a: "團結使我們更強大"
 SEA_china_democratic.2.b: "這會違揹我們的中立原則……"
 SEA_china_democratic.3.t: "[FROM.GetNameDefCap]接受了我們的邀請"
 SEA_china_democratic.3.desc: "[FROM.GetLeader]欣然接受了我們的結盟提議，並已開始著手融入我們的勢力圈。今日值得慶祝！"
 SEA_china_democratic.3.a: "他們與我們共享未來願景"
 SEA_china_democratic.4.t: "[FROM.GetNameDefCap]拒絕加入我們"
 SEA_china_democratic.4.desc: "[FROM.GetLeader]粗魯地拒絕了我們結盟的提議，稱這有悖於他們的中立原則。我們只能想像，這背後有多少腐敗行為造成了這一錯誤的決定。"
 SEA_china_democratic.4.a: "這是他們的損失"
 SEA_china_democratic.5.t: "[ROOT.GetNameDef]爆發內戰"
 SEA_china_democratic.5.desc: "在長期高漲的共和情緒下，[ROOT.GetAdjective]民主派已對和平變革失去耐心。在激烈的辯論破裂後，談判手段宣告失敗，武裝衝突隨之爆發。"
 SEA_china_democratic.5.a: "為了民主！"
 SEA_china_democratic.5.b: "我們必須阻止這種愚行！"
 SEA_china_democratic.6.t: "[FROM.GetNameDefCap]煽動共和主義情緒"
 SEA_china_democratic.6.desc: "我們注意到，[FROM.GetAdjective]組織在我國境內活躍，散佈共和思想。雖然表面看來無害，但其中一些宣傳帶有革命色彩。有關工人被鼓動組織起來的報道越來越多。結合近期的歷史經驗，我們無法排除這是一場[FROM.GetAdjective]領導層精心設計的陰謀，最終目的是吞併我們。"
 SEA_china_democratic.6.a: "任由他們繼續"
 SEA_china_democratic.6.b: "鎮壓這些狂妄的煽動者！"
 SEA_china_democratic.7.t: "[CHI.GetNameDefCap]要求我們釋放亞洲殖民地"
 SEA_china_democratic.7.desc: "我們收到了來自[CHI.GetNameDef]的措辭相當強硬的照會。他們我們釋放[CHI_country_to_be_liberated.GetNameDef]並把領土歸還給它們的合法所有者。"
 SEA_china_democratic.7.a: "反正這些殖民地對我們也沒什麼用"
 SEA_china_democratic.7.b: "它們的合法所有者應該是我們"
 SEA_china_democratic.7.b.tt: "§R這將給他們一個針對我們的戰爭目標！§!"
 SEA_china_democratic.8.t: "[FROM.GetNameDefCap]同意釋放[CHI_country_to_be_liberated.GetNameDef]"
 SEA_china_democratic.8.desc: "我方要求[FROM.GetNameDef]方面釋放[CHI_country_to_be_liberated.GetNameDef]的要求已獲答覆。也許有些出人意料的是，他們已同意讓[CHI_country_to_be_liberated.GetNameDef]作為獨立國家獲得解放。"
 SEA_china_democratic.8.a: "真是令人滿意的結果。"
 SEA_china_democratic.9.t: "[FROM.GetNameDefCap]拒絕釋放殖民地"
 SEA_china_democratic.9.desc: "我們要求[FROM.GetNameDef]釋放[CHI_country_to_be_liberated.GetNameDef]的答覆已經傳來。他們聲稱外交事務不關我們的事，拒絕給予其應得的獨立。"
 SEA_china_democratic.9.a: "不管付出什麼代價，我們必須解放他們"
 SEA_china_democratic.10.t: "[FROM.GetNameDefCap]希望我們加入他們的戰爭"
 SEA_china_democratic.10.desc: "一支遠道而來的使團近日抵達我都城，請求覲見[ROOT.GetLeader]。他們自稱來自[FROM.GetNameDef]，希望我們加入他們對[JAP.GetNameDef]的戰爭。我們是否接受？"
 SEA_china_democratic.10.a: "為勝利並肩作戰！"
 SEA_china_democratic.10.b: "這會違揹我們的中立原則……"
 SEA_china_democratic.11.t: "[FROM.GetNameDefCap]接受了我們謙卑的請求"
 SEA_china_democratic.11.desc: "[FROM.GetLeader]慷慨地接受了我們提出的正式建立反[JAP.GetAdjective]聯盟的提議，並已著手展開對抗東方威脅的舉措。今天是值得慶祝的一天！"
 SEA_china_democratic.11.a: "我們欠他們的人民一份人情"
 SEA_china_democratic.12.t: "[FROM.GetNameDefCap]拒絕加入我們"
 SEA_china_democratic.12.desc: "[FROM.GetLeader]無禮地拒絕了我們提出的反[JAP.GetAdjective]聯盟建議，聲稱這違背了他們的中立原則。我們只能想像，這一錯誤決定背後隱藏著怎樣的腐敗。"
 SEA_china_democratic.12.a: "可怕的消息……"
 SEA_china_democratic.13.t: "[FROM.GetNameDefCap]尋求我們的支持"
 SEA_china_democratic.13.desc: "我們收到來自[FROM.GetNameDef]的[FROM.GetLeader]的詢問，請求對其國家的財政支持。他們已經動員了許多生活在我國的[FROM.GetAdjective]僑民，因而贏得了廣泛的民間呼聲。我們是否接受他們的請求？"
 SEA_china_democratic.13.a: "我們會支持他們"
 SEA_china_democratic.13.b: "他們必須自力更生"
 SEA_china_democratic.14.t: "[FROM.GetNameDefCap]同意支持我們"
 SEA_china_democratic.14.desc: "我們收到了對我方請求的答覆，特此欣然告知：外國資金即將到位。這將極大促進我們的經濟，使我們得以大幅發展工業與武裝力量。"
 SEA_china_democratic.14.a: "勝利之路已然敞開"
 SEA_china_democratic.15.t: "[FROM.GetNameDefCap]拒絕我們的請求"
 SEA_china_democratic.15.desc: "我們向[FROM.GetNameDef]發出的求助已得到回覆——他們選擇棄我們於不顧，不會派遣任何支援，也不會提供任何資金。儘管在[FROM.GetNameDef]的民間不乏對支援我們的呼聲，但我們仍孤立無援。我們必須勝利——因為若我們失敗，我們的遺產便會被徹底遺忘。"
 SEA_china_democratic.15.a: "我們被引入歧途……"
 SEA_china_democratic.16.t: "[FROM.GetNameDefCap]投資我們的經濟"
 SEA_china_democratic.16.desc: "[FROM.GetNameDef]的實業家開始發展我國本土工業，並在我國設立新企業。這無疑將推動我們的繁榮。"
 SEA_china_democratic.16.a: "我們感謝他們的投資"
 SEA_china_democratic.16.b: "我們不需要他們的援助！"
 SEA_china_democratic.17.t: "[FROM.GetName]要求我們歸附"
 SEA_china_democratic.17.desc: "從南京寄來了一封帶有中央政府公印的信件。團結和民族命運的華麗辭藻背後，是要求我們向[CHI.GetLeader]臣服並接受[CHI.GetNameDef]對我方領域的管轄。沒有談判的餘地，要麼乖乖聽話，要麼後果自負。"
 SEA_china_democratic.17.a: "我們永不屈服！"
 SEA_china_democratic.17.b: "這對我們的人民是最好的選擇"
 SEA_china_democratic.17.tt: "§R我們將成為[FROM.GetName]的附庸§!"
 SEA_china_democratic.18.t: "[FROM.GetName]迴歸民國"
 SEA_china_democratic.18.desc: "[FROM.GetName]已接受我們的最後通牒。其領導人雖大談國家統一與歷史命運，但意圖顯而易見——他們如今承認了[CHI.GetNameDef]的權威。\n儘管他們的歸順或許心有不甘，但這避免了中國的進一步分裂與流血衝突。"
 SEA_china_democratic.18.a: "破碎的太陽重聚光芒。"
 SEA_china_democratic.19.t: "[FROM.GetName]拒絕歸附"
 SEA_china_democratic.19.desc: "最後通牒已被拒絕。[FROM.GetLeader]選擇公然違抗，明確表示絕不屈服。我們的使者已被遣回，外交手段將讓位於戰爭。"
 SEA_china_democratic.19.a: "那就讓他們乖乖就範！"
 SEA_china_democratic.20.t: "[FROM.GetNameDefCap]要求實施“民權”！"
 SEA_china_democratic.20.desc: "[FROM.GetLeader]，作為[FROM.GetNameDef]的總統，向我們發來正式要求，要求在我們統治的領土內開始落實“民權”原則。這將把我們帶得更接近共和國，也有助於我們的發展。"
 SEA_china_democratic.20.a: "我們會服從"
 SEA_china_democratic.20.b: "這其中必有貓膩！"
 SEA_china_misc.1.t: "$CHI_retreat_to_taiwan$"
 SEA_china_misc.1.desc: "$CHI_retreat_to_taiwan_desc$"
 #######################
 ### COMMUNIST CHINA ###
 #######################
 #Tooltips
 PRC_gains_more_faction_inluence_tt: "[PRC.GetName]陣營影響力增強"
 SEA_PRC_request_aid.1.t: "[FROM.GetName]請求武器"
 SEA_PRC_request_aid.1.desc: "鑑於我們過去頻繁支持[FROM.GetNameDef]，他們再次請求我們提供裝備。這次請求可能與最近結束的長征有關，這場行動讓他們在人力和物資上都損失慘重。"
 SEA_PRC_request_aid.1.a: "把多餘的援助他們"
 SEA_PRC_request_aid.1.b: "我們提供不了任何東西"
 SEA_PRC_request_aid.2.t: "[FROM.GetName]送來援助"
 SEA_PRC_request_aid.2.desc: "[FROM.GetNameDefCap]已同意運送我們請求的裝備。這批大規模物資將使我們能夠組建數個新師，併為我們提供組建支援連所需的特種裝備。"
 SEA_PRC_request_aid.2.a: "太好了，我們會好好利用的。"
 SEA_PRC_request_aid.3.t: "[FROM.GetName]拒絕提供援助"
 SEA_PRC_request_aid.3.desc: "我們向[FROM.GetNameDef]請求援助的要求遭到拒絕，[FROM.GetAdjective]官員表示[FROM.GetNameDef]在近期重組後已無多餘裝備可以提供。"
 SEA_PRC_request_aid.3.a: "我們必須另外尋找別的來源。"
 SEA_PRC_request_aid.4.t: "[FROM.GetName]請求坦克"
 SEA_PRC_request_aid.4.desc: "由於[FROM.GetNameDef]缺乏建立裝甲部隊的工業產能與經驗，其領導人[FROM.GetLeader]特意向我方發出援助請求。[FROM.GetNameDefCap]方面特別指明，希望獲得我們的T‑34中型坦克，並稱贊該型號戰車在火力、防護和機動性方面取得了卓越的平衡。我們該如何回應？"
 SEA_PRC_request_aid.4.a: "我們能送出很多。"
 SEA_PRC_request_aid.4.b: "我們能勻出一些。"
 SEA_PRC_request_aid.4.c: "我們至少能協助建設。"
 SEA_PRC_request_aid.4.e: "拒絕[FROM.GetNameDef]的請求"
 SEA_PRC_request_aid.4.a.tt: "我們將同意援助§Y[FROM.GetName]§!§R250輛T-34坦克§!"
 SEA_PRC_request_aid.4.b.tt: "我們將同意援助§Y[FROM.GetName]§!§R50輛T-34坦克§!"
 SEA_PRC_request_aid.4.c.tt: "我們將同意為§Y[FROM.GetName]§!生產§R150輛T-34坦克§!"
 SEA_PRC_request_aid.31.t: "[FROM.GetName]請求坦克"
 SEA_PRC_request_aid.31.desc: "由於[FROM.GetNameDef]缺乏建立裝甲部隊的工業產能與經驗，其領導人[FROM.GetLeader]特意向我方發出援助請求。[FROM.GetNameDefCap]方面特別指明，希望獲得我們的T‑34中型坦克，並稱贊該型號戰車在越野機動性方面卓越的表現。我們該如何回應？"
 SEA_PRC_request_aid.31.a: "我們能送出很多。"
 SEA_PRC_request_aid.31.b: "我們能勻出一些。"
 SEA_PRC_request_aid.31.c: "我們至少能協助建設。"
 SEA_PRC_request_aid.31.e: "拒絕[FROM.GetNameDef]的請求"
 SEA_PRC_request_aid.31.a.tt: "我們將同意援助§Y[FROM.GetName]§!§R350輛BT-7坦克§!"
 SEA_PRC_request_aid.31.b.tt: "我們將同意援助§Y[FROM.GetName]§!§R100輛BT-7坦克§!"
 SEA_PRC_request_aid.31.c.tt: "我們將同意為§Y[FROM.GetName]§!生產§R150輛BT-7坦克§!"
 SEA_PRC_request_aid.32.t: "[FROM.GetName]提供了坦克支援"
 SEA_PRC_request_aid.32.desc: "針對我方對BT-7坦克的請求，[FROM.GetName]已同意提供大量該型坦克——整整350輛（大多是）全新的BT‑7！我們的將軍們正在制定計劃，研究如何最優地部署這些坦克，包括為新近重新任命的坦克乘員制定訓練安排。"
 SEA_PRC_request_aid.32.a: "一個偉大的開篇"
 SEA_PRC_request_aid.33.t: "[FROM.GetName]提供了少量坦克支援"
 SEA_PRC_request_aid.33.desc: "針對我方對BT‑7坦克的請求，[FROM.GetName]已同意提供象徵性數量的坦克——雖不足以裝備整個坦克師，但足夠我們起步。至少，我們可以先用這100輛坦克來訓練我們的坦克乘員，同時再尋找其他途徑來獲取現代坦克。"
 SEA_PRC_request_aid.33.a: "總比沒有強"
 SEA_PRC_request_aid.34.t: "[FROM.GetName]提供坦克生產支援"
 SEA_PRC_request_aid.34.desc: "針對我方提出的T‑34坦克援助請求，[FROM.GetName]同意在未來幾個月特為我方生產150輛BT‑7，並在完工後交付。這需要時間，但將為我國組建一支現代化的裝甲部隊的雄心壯志，奠定一個良好的開端。"
 SEA_PRC_request_aid.34.a: "太好了！它們一到我們會好好利用"
 SEA_PRC_request_aid.35.t: "新造的坦克已從[FROM.FROM.GetName]運抵"
 SEA_PRC_request_aid.35.desc: "一批150輛新造的BT‑7坦克已從[SOV.GetNameDef]運抵[ROOT.Capital.GetName]。出席接收儀式的有[ROOT.GetName]政府代表，以及人民解放軍陸軍的高級軍官們。我軍將領檢閱了這些漆有嶄新八一軍徽的坦克，均迫切地希望將其投入部署——只等坦克乘員完成訓練與操作實習。"
 SEA_PRC_request_aid.35.a: "真是天大的好消息，我們會將它利用到極致！"
 SEA_PRC_request_aid.5.t: "[FROM.GetName]提供了坦克支援"
 SEA_PRC_request_aid.5.desc: "作為對於我們索取T‑34的回應，[FROM.GetName]同意向我們提供大批坦克——多達250輛（大部分）全新的T‑34！我們的將領正在制定部署計劃，並安排新組編的裝甲部隊的訓練。"
 SEA_PRC_request_aid.5.a: "一個偉大的開篇"
 SEA_PRC_request_aid.6.t: "[FROM.GetName]提供了少量坦克支援"
 SEA_PRC_request_aid.6.desc: "作為對於我們索取T‑34的回應，[FROM.GetName]同意提供少量坦克，數量不足以組建一個完整裝甲師，但足夠開始訓練坦克兵。至少，這50輛坦克能幫助我們積累經驗。"
 SEA_PRC_request_aid.6.a: "總比沒有強"
 SEA_PRC_request_aid.7.t: "[FROM.GetName]提供坦克生產支援"
 SEA_PRC_request_aid.7.desc: "針對我方提出的T‑34坦克援助請求，[FROM.GetName]同意在未來幾個月特為我方生產150輛T‑34，並在完工後交付。這項舉措需要時間，但將為我們組建現代化裝甲部隊的目標奠定良好基礎。"
 SEA_PRC_request_aid.7.a: "太好了！它們一到我們會好好利用"
 SEA_PRC_request_aid.8.t: "[FROM.GetName]拒絕提供坦克支援"
 SEA_PRC_request_aid.8.desc: "[FROM.GetName]拒絕了我們的索取，稱其自身需求緊迫，無法騰出任何現役或庫存底盤。不過[FROM.GetName]寄來了訓練手冊——聊勝於無。"
 SEA_PRC_request_aid.8.a: "真是遺憾！"
 SEA_PRC_request_aid.21.t: "[FROM.FROM.GetName]新造的坦克已經抵達"
 SEA_PRC_request_aid.21.desc: "一批150輛新造的T-34坦克已從[SOV.GetNameDef]運抵[ROOT.Capital.GetName]。出席接收儀式的有[ROOT.GetName]政府代表，以及人民解放軍陸軍的高級軍官們。我軍將領檢閱了這些漆有八一軍徽的坦克，均迫切地希望將其投入部署——只等坦克乘員完成訓練與操作實習。"
 SEA_PRC_request_aid.21.a: "真是天大的好消息，我們會將它利用到極致！"
 SEA_PRC_request_aid.9.t: "[FROM.GetName]希望簽署技術合作協議"
 SEA_PRC_request_aid.9.desc: "[FROM.GetLeader]向我們發來電報，提議締結技術合作協議，象徵並推進“通過知識與人類進步傳播革命的同志之道”。"
 SEA_PRC_request_aid.9.a: "同意盡全力協助"
 SEA_PRC_request_aid.9.b: "我們沒功夫管這個"
 SEA_PRC_request_aid.10.t: "[FROM.GetName]宣佈簽署技術合作協議"
 SEA_PRC_request_aid.10.desc: "[FROM.GetNameDefCap]已同意簽署技術合作協議，這將大大增強我們的國家建設能力。"
 SEA_PRC_request_aid.10.a: "好極了！"
 SEA_PRC_request_aid.11.t: "[FROM.GetName]拒絕技術合作協議"
 SEA_PRC_request_aid.11.desc: "[FROM.GetNameDefCap]拒絕與我方簽署技術合作協議，並稱其一切資源必須用於以需優先滿足國內需求。儘管他們對我們的事業表示同情，但仍無法提供援助。"
 SEA_PRC_request_aid.11.a: "真是遺憾！"
 SEA_PRC_faction_events.1.t: "[FROM.GetNameDefCap]索取[1032.GetName]"
 SEA_PRC_faction_events.1.desc: "[FROM.GetLeader]派遣使節至[ROOT.GetLeader]，試探我們是否有意與他們瓜分[XIC.GetName]領土。"
 SEA_PRC_faction_events.1.a: "這筆交易對我們更有利"
 SEA_PRC_faction_events.1.b: "這不可能！"
 SEA_PRC_faction_events.2.t: "敵軍進犯邊境"
 SEA_PRC_faction_events.2.desc: "看來[FROM.GetLeader]領導的[FROM.GetName]與[PRC.GetLeader]領導的[PRC.GetNameDef]已勾結起來，企圖瓜分我們的領土。他們的軍隊隨時可能越境入侵，除非我們能挫敗其卑劣圖謀。問題是，我們能同時抵擋住他們多久？"
 SEA_PRC_faction_events.2.a: "抵抗是徒勞的……"
 SEA_PRC_faction_events.2.b: "讓他們試試看！"
 SEA_PRC_faction_events.3.t: "[FROM.GetLeader]拒絕了我們的提議"
 SEA_PRC_faction_events.3.desc: "[FROM.GetName]的[FROM.GetLeader]似乎愚不可及，竟讓我們的使者空手而歸。我們慷慨提議，由我們雙方瓜分一個較弱的鄰國，但他們卻充耳不聞。"
 SEA_PRC_faction_events.3.a: "這只是暫時的挫折！"
 SEA_PRC_faction_events.4.t: "[FROM.GetNameDefCap]屈從於我國要求"
 SEA_PRC_faction_events.4.desc: "面對[CHI.GetNameDef]與[PRC.GetNameDef]的雙重壓力，[FROM.GetLeader]顯然不堪重負，最終向我方屈服。他們已同意我軍部隊長驅直入[FROM.GetNameDef]，且不會進行任何抵抗。看來強權即公理終究還是顛撲不破的真理……"
 SEA_PRC_faction_events.4.a: "形勢逐漸好轉！"
 SEA_PRC_faction_events.5.t: "[FROM.GetNameDefCap]拒絕我們的要求"
 SEA_PRC_faction_events.5.desc: "[FROM.GetName]的[FROM.GetLeader]比預想的更加頑強，拒絕向[CHI.GetNameDef]和[PRC.GetNameDef]的聯軍威脅屈服。這種反抗既令人欽佩，又顯得愚蠢。[FROM.GetNameDef]的武裝部隊很快就會在我們的強大實力面前潰散！"
 SEA_PRC_faction_events.5.a: "他們會為此後悔的"
 SEA_PRC_faction_events.10.t: "[FROM.GetNameDefCap]提議結盟"
 SEA_PRC_faction_events.10.desc: "[FROM.GetLeader]通過秘密渠道向我們傳達了一份訊息。看來山村的閉塞讓[FROM.GetNameDef]領導人回心轉意了。他正尋求我方協助以統一中國、保護人民、抵禦外敵。這是個耐人尋味的提議，但共產黨值得信賴嗎？"
 SEA_PRC_faction_events.10.a: "中華之患，逾我輩私仇"
 SEA_PRC_faction_events.10.b: "我們決不會服從他們的領導！"
 SEA_PRC_faction_events.11.t: "愚蠢的[FROM.GetLeader]拒絕我們的提議"
 SEA_PRC_faction_events.11.desc: "[FROM.GetNameDef]的領導人拒絕了我們組建統一戰線以保衛並統一中國的提議，再次向世人展示了[FROM.GetLeader.GetSheHe]有多愚蠢。這意味著解救人民的重任完全落在我們的肩上了。我們將向世界證明，我們的能力遠不止於此！"
 SEA_PRC_faction_events.11.a: "我們將保衛全中國"
 SEA_PRC_faction_events.20.t: "[FROM.GetLeader]質疑[?PRC_faction_leader_var.GetName]的領導能力"
 SEA_PRC_faction_events.20.desc: "[FROM.GetLeader]在近期與[ROOT.GetFactionName]成員召開的峰會上公開質疑了[?PRC_faction_leader_var.GetLeader]的領導能力和戰爭政策。他批評了戰爭的指揮和執行方式，指責[?PRC_faction_leader_var.GetName]蓄意拖延衝突。此舉或為[FROM.GetLeader]在聯盟中爭取更多籌碼的策略，但或許他的指控也不無事實依據？"
 SEA_PRC_faction_events.20.a: "此人所言不虛！"
 SEA_PRC_faction_events.20.b: "荒謬至極！"
 SEA_PRC_faction_events.21.t: "[FROM.GetNameDefCap]給予我們支持"
 SEA_PRC_faction_events.21.desc: "近期[ROOT.GetLeader]批評[?PRC_faction_leader_var.GetNameDef]領導[ROOT.GetFactionName]的言論似乎引起了[FROM.GetName][FROM.GetLeader]的共鳴。[FROM.GetLeader]已承諾[FROM.GetName]會支持我們。"
 SEA_PRC_faction_events.21.a: "顯然是明智之舉"
 SEA_PRC_faction_events.22.t: "[FROM.GetLeader]斥責[ROOT.GetLeader]"
 SEA_PRC_faction_events.22.desc: "近期[ROOT.GetLeader]批評[?PRC_faction_leader_var.GetName]領導[ROOT.GetFactionName]的言論並未讓所有陣營峰會參加者心悅誠服。[FROM.GetName]的[FROM.GetLeader]公開指責[ROOT.GetLeader]試圖削弱[ROOT.GetFactionName]並挑撥離間各成員。"
 SEA_PRC_faction_events.22.a: "盲目的愚者依然是愚者"
 SEA_PRC_faction_events.30.t: "[FROM.GetNameDefCap]要求土地改革"
 SEA_PRC_faction_events.30.desc: "看來[FROM.GetNameDef]已經成功滲透我們的領土，並爭取到許多臣民的效忠。[FROM.GetNameDef]現在要求我們正式移交這些地區。若我們拒絕，他們雖未明言，但大概率將會採取強硬手段。"
 SEA_PRC_faction_events.30.a: "實際上我們沒有什麼選擇……"
 SEA_PRC_faction_events.30.b: "真是荒唐！"
 SEA_PRC_faction_events.31.t: "[FROM.GetNameDefCap]接受我方請求"
 SEA_PRC_faction_events.31.desc: "[FROM.GetNameDefCap]接受了我們的“請求”，將我們已滲透的地區正式割讓給我們。[FROM.GetNameDefCap]雖然不滿，但不敢反抗。這片領土現由[ROOT.GetNameDef]正式接管。"
 SEA_PRC_faction_events.31.a: "明智之舉"
 SEA_PRC_faction_events.32.t: "[FROM.GetNameDefCap]拒絕配合"
 SEA_PRC_faction_events.32.desc: "[FROM.GetNameDefCap]拒絕移交我們已經滲透的地區。"
 SEA_PRC_faction_events.32.a: "走錯一步，險象環生……"
 SEA_PRC_faction_events.32.b: "絕不容忍背叛的盟友！\n§R[FROM.GetName]或許正試圖投靠其他陣營§!"
 SEA_PRC_faction_events.40.t: "前進的道路——中國的命運"
 SEA_PRC_faction_events.40.desc: "我們正處於歷史的十字路口，必須決定如何應對其他中國政權。[ROOT.GetLeader]為此輾轉反側，最終認定唯有一條道路能夠統一全中國……"
 SEA_PRC_faction_events.40.a: "拒絕抉擇，亦是一種抉擇"
 SEA_PRC_faction_events.40.b: "我們要開闢自己的路"
 SEA_PRC_faction_events.40.c: "昔日的效忠只會拖累我們"
 SEA_PRC_faction_events.40.d: "中國，只有一個！"
 SEA_PRC_faction_events.40.e: "只有團結，我們才更強"
 SEA_PRC_faction_events.41.t: "[FROM.GetNameDefCap]退出[ROOT.GetFactionName]"
 SEA_PRC_faction_events.41.desc: "看來[FROM.GetLeader]認為，沒有了[ROOT.GetFactionName]所提供的力量和保障，[FROM.GetNameDef]會變得更好。真不知道他們沒了我們怎麼辦！"
 SEA_PRC_faction_events.41.a: "誰又將離去？"
 SEA_PRC_faction_events.42.t: "[ROOT.GetNameDefCap]被逐出[FROM.GetFactionName]"
 SEA_PRC_faction_events.42.desc: "[FROM.GetLeader]似乎認為，沒有我們在聯盟中，[FROM.GetNameDef]與[FROM.GetFactionName]會變得更好。是什麼瘋狂驅使[FROM.GetLeader]做出如此不理智的決定尚不得而知，但有一點毋庸置疑：這讓我們更加脆弱。我們只能揣測[FROM.GetNameDef]正在暗中策劃些什麼，但想必不是什麼好事。"
 SEA_PRC_faction_events.42.a: "沒他們我們也能行"
 SEA_PRC_faction_events.50.t: "[FROM.GetNameDefCap]提議結盟"
 SEA_PRC_faction_events.50.desc: "[FROM.GetLeader]派遣代表團來訪，試圖說服我們加入他們的陣營。他們聲稱，我們正處於十字路口，中國的未來懸而未決。根據[FROM.GetName]代表團的說法，統一中國唯有攜手共進。人們不禁懷疑，[FROM.GetLeader]在[FROM.GetLeader.GetHerHis]心中藏有什麼不可告人的陰謀，[FROM.GetLeader.GetSheHe]是否值得信賴……"
 SEA_PRC_faction_events.50.a: "不，[FROM.GetLeader]絕不可信！"
 SEA_PRC_faction_events.50.b: "唯有團結一心，我們才有未來"
 SEA_PRC_faction_events.51.t: "[FROM.GetNameDefCap]拒絕提議"
 SEA_PRC_faction_events.51.desc: "我們派往[FROM.GetLeader]的代表團空手而歸，除了壞消息。我們盛情邀請[FROM.GetNameDef]加入我們的陣營，卻遭受懷疑與蔑視。看來[FROM.GetLeader]認為，沒有[ROOT.GetFactionName]的力量和庇護，[FROM.GetNameDef]會更好。真不知道沒了我們，他們能幹什麼！"
 SEA_PRC_faction_events.51.a: "投暗棄明，自取滅亡"
 SEA_PRC_faction_events.52.t: "[FROM.GetNameDefCap]退出[ROOT.GetFactionName]"
 SEA_PRC_faction_events.52.desc: "我們剛收到[FROM.GetLeader]的消息，[FROM.GetNameDef]決定退出[ROOT.GetFactionName]，轉而與[PRC.GetNameDef]聯手。是什麼瘋狂驅使[FROM.GetLeader]做出如此不理智的決定尚不得而知，但若他們甘願自尋死路，我們又何必阻攔？"
 SEA_PRC_faction_events.52.a: "他們已是日薄西山"
 SEA_PRC_faction_events.53.t: "[FROM.GetNameDefCap]加入[ROOT.GetFactionName]"
 SEA_PRC_faction_events.53.desc: "我們派往[FROM.GetNameDef]的代表團帶回喜訊。[FROM.GetLeader]已正式簽署我們的聯盟提案。事實證明，[FROM.GetLeader.GetHerHim]是一位遠比我們最初評價更明智的統治者。雖然並不完全出乎意料，但常慮風雨，晴天才更顯珍貴。這將極大增強我們國家與[ROOT.GetFactionName]的實力。"
 SEA_PRC_faction_events.53.a: "這對全中國來說都是偉大的一天！"
 SEA_PRC_faction_events.60.t: "$generic.2.t$"
 SEA_PRC_faction_events.60.a: "我們接受[FROM.GetName]加入[ROOT.GetFactionName]"
 SEA_PRC_faction_events.60.b: "沒有他們反而更好"
 SEA_PRC_faction_events.70.desc: "[FROM.GetLeader]已向我們派出了一個代表團，試圖說服我們加入他們的陣營。他們表示，亞洲的未來如今岌岌可危，我們正處於十字路口。根據[FROM.GetName]的代表團所說，為確保我們擺脫西方殖民者的獨立，只有一條出路——團結一致。"
 SEA_PRC_faction_events.71.t: "[FROM.GetNameDefCap]要求接管我們在亞洲的屬國"
 SEA_PRC_faction_events.71.desc: "[FROM.GetNameDef]正式致函我方，[FROM.GetLeader]以[FROM.GetFactionName]的新近成立為契機，提議將我國位於亞洲的屬國的管轄權移交該陣營。"
 SEA_PRC_faction_events.71.a: "很好，是時候迎接更美好的未來了。"
 SEA_PRC_faction_events.71.b: "絕不，他們是我們的"
 SEA_PRC_faction_events.72.t: "[FROM.GetNameDefCap]有條件地給予我們自由"
 SEA_PRC_faction_events.72.desc: "[FROM.GetNameDefCap]已提議解放我們——但有一個條件：只有當我們加入[FROM.FROM.GetNameDef]新成立的[PRC.GetFactionName]時，獨立才會被承認。"
 SEA_PRC_faction_events.72.a: "我們將同時接受提議與條件"
 SEA_PRC_faction_events.72.b: "不，我們對現狀很滿意"
 SEA_PRC_faction_events.73.t: "[FROM.FROM.GetNameDefCap]同意‑[FROM.GetNameDef]加入[PRC.GetFactionName]"
 SEA_PRC_faction_events.73.desc: "[FROM.FROM.GetNameDefCap]已同意釋放[FROM.GetNameDef]，條件是讓他們加入我們的新陣營，而[FROM.GetNameDef]已同意此條件。一場歡迎儀式計劃在[ROOT.Capital.GetName]舉行。"
 SEA_PRC_faction_events.73.a: "這是一個嶄新的黎明"
 SEA_PRC_faction_events.74.t: "[FROM.GetNameDefCap]拒絕加入[PRC.GetFactionName]"
 SEA_PRC_faction_events.74.desc: "儘管收到這一提議，[FROM.GetLeader]仍宣佈[FROM.GetNameDef]拒絕[PRC.GetNameDef]提出的加入新成立的[PRC.GetFactionName]的邀請，並表示[FROM.GetAdjective]民眾更傾向於維持現狀。"
 SEA_PRC_faction_events.74.a: "他們已經做出了決定"
 ## New Fourth Army Incident
 SEA_PRC_fourth_army_incident.1.t: "盟友動盪"
 SEA_PRC_fourth_army_incident.1.desc: "我方指揮官報告稱，與[PRC.GetNameDef]的協同關係已引發一些小規模衝突。據稱，代表[PRC.GetNameDef]的指揮官多次表現出對我軍命令的遲疑，甚至有明令不遵之舉，對我方部隊的行動造成潛在威脅。"
 SEA_PRC_fourth_army_incident.1.a: "[PRC.GetNameDefCap]應該管好他們的部隊。"
 SEA_PRC_fourth_army_incident.1.b: "他們有疑慮是正常的"
 SEA_PRC_fourth_army_incident.2.t: "[FROM.GetNameDefCap]尋求緩和緊張局勢"
 SEA_PRC_fourth_army_incident.2.desc: "在我們與[FROM.GetNameDef]的指揮官之間發生幾起衝突事件後，對方政府已發來信息尋求緩和緊張局勢。他們現已正式確認，我們仍可指揮自己的部隊，並尋求在協調計劃時建立更具雙向性的合作。"
 SEA_PRC_fourth_army_incident.2.a: "所幸我們能夠專注於對付真正的威脅"
 SEA_PRC_fourth_army_incident.3.t: "[FROM.GetNameDefCap]抱怨缺乏協調"
 SEA_PRC_fourth_army_incident.3.desc: "[FROM.GetNameDef]政府向我們發來抱怨，指出我們在前線的指揮官之間缺乏協調。他們援引己方指揮官的報告稱，我方指揮官不願服從[FROM.GetName]方面的指揮命令，這使他們陷入了不必要的危險境地。具體而言，他們希望我們確保參與正在進行的戰術撤退，以免因內部爭鬥而使行動受挫。"
 SEA_PRC_fourth_army_incident.3.a: "我們部隊的行動由我方指揮官決定，不是他們"
 SEA_PRC_fourth_army_incident.3.b: "也許他們有點道理"
 SEA_PRC_fourth_army_incident.4.t: "[FROM.GetNameDefCap]整頓部隊領導"
 SEA_PRC_fourth_army_incident.4.desc: "在我們對[FROM.GetNameDef]下屬部隊違抗命令的行為提出投訴後，對方政府成功促使其有關指揮員服從方針，並配合我們的戰略計劃開展工作。"
 SEA_PRC_fourth_army_incident.4.a: "非常好"
 SEA_PRC_fourth_army_incident.5.t: "新四軍遭國民黨軍隊襲擊"
 SEA_PRC_fourth_army_incident.5.desc: "我們收到報告稱，新四軍在遭到國民黨軍隊包圍後幾乎全軍覆沒。當時，我軍正在北移，突然遭遇國民黨“執行撤退任務”的軍隊重兵包圍。關於衝突的起因，現已難以完全查明。原本可能是一場誤傷友軍的事件，卻迅速演變成了一場血腥衝突。雙方均指責對方發起了蓄意進攻。"
 SEA_PRC_fourth_army_incident.5.a: "要求[CHI.GetLeader]採取行動"
 SEA_PRC_fourth_army_incident.5.b: "我們不能再信任這樣的統一戰線"
 SEA_PRC_fourth_army_incident.6.t: "[FROM.GetName]因誤傷友軍事件退出[ROOT.GetFactionName]"
 SEA_PRC_fourth_army_incident.6.desc: "在[ROOT.GetName]部隊與[FROM.GetName]部隊發生交火事件後，後者已退出[ROOT.GetFactionName]。此次衝突中，[FROM.GetNameDef]的新四軍傷亡慘重，起因是雙方在撤退命令上產生分歧，導致我方撤退部隊與[FROM.GetName]部隊相遇時，一方不明身份的部隊率先開火。"
 SEA_PRC_fourth_army_incident.6.a: "這本不必發生，只會分散我們對要緊問題的注意力"
 SEA_PRC_fourth_army_incident.7.t: "[FROM.GetName]要求就誤傷友軍事件採取行動"
 SEA_PRC_fourth_army_incident.7.desc: "在[ROOT.GetName]部隊與[FROM.GetName]部隊近期發生的交火事件後，[FROM.GetName]方面要求我們承認在此事件中的責任，並保證各級部隊今後將更加謹慎行事。此次衝突中，[FROM.GetNameDef]的新四軍傷亡慘重。事變起因是雙方在撤退命令上產生分歧，繼而在我方部隊執行撤離行動時，與中共部隊遭遇，現場不明一方率先開火，遂釀成不幸衝突。"
 SEA_PRC_fourth_army_incident.7.a: "這隻能歸咎於他們自己違抗命令"
 SEA_PRC_fourth_army_incident.7.b: "我們應儘量與[FROM.GetNameDef]保持友好"
 SEA_PRC_fourth_army_incident.8.t: "[FROM.GetName]拒絕道歉"
 SEA_PRC_fourth_army_incident.8.desc: "針對我方在新四軍事件後提出的行動要求，[FROM.GetNameDef]表現出不願承認過錯的態度。這顯然是對支援其作戰的我方部隊的不信任，甚至可以說是近乎毫不掩飾的敵意。"
 SEA_PRC_fourth_army_incident.8.a: "我們現在承受不起衝突的代價"
 #no b option here, reuses 5.b
 SEA_PRC_fourth_army_incident.8.c: "這需要立即作出回應"
 SEA_PRC_fourth_army_incident.9.t: "[FROM.GetName]讓步"
 SEA_PRC_fourth_army_incident.9.desc: "儘管我們未作道歉，[FROM.GetNameDef]已表示不願就新四軍事件進一步升級衝突，不過他們肯定會記住這件事。"
 SEA_PRC_fourth_army_incident.9.a: "正如預料"
 SEA_PRC_fourth_army_incident.10.t: "[FROM.GetName]重啟內戰"
 SEA_PRC_fourth_army_incident.10.desc: "新四軍事件後，[FROM.GetNameDef]將我們的行動視為宣戰，並重啟了內戰。此前並肩作戰的部隊如今已在前線互相廝殺，後方的局勢同樣不容樂觀。"
 SEA_PRC_fourth_army_incident.10.a: "我們知道這終將會發生"
 SEA_PRC_fourth_army_incident.11.t: "[FROM.GetLeader]為誤傷事件致歉"
 SEA_PRC_fourth_army_incident.11.desc: "針對新四軍事件後我方提出的要求[FROM.GetLeader]採取行動一事，[FROM.GetLeader]已正式致函我方領導層表示歉意，承諾將盡力指示其指揮官在面對有關命令的分歧時採取不同處理方式。"
 SEA_PRC_fourth_army_incident.11.a: "這樣就行了"
 #no b option here, reuses 65.b
 SEA_PRC_fourth_army_incident.12.t: "[FROM.GetName]接受致歉"
 SEA_PRC_fourth_army_incident.12.desc: "針對我方致[FROM.GetNameDef]領導層的致歉函，對方雖態度勉強，仍認為此舉足以作為“新四軍事件”的了結之法。"
 SEA_PRC_fourth_army_incident.12.a: "現在，我們都能把注意力放在更緊迫的事上"
 SEA_PRC_faction_events.80.t: "[FROM.GetName]要求我們臣服"
 SEA_PRC_faction_events.80.desc: "我們收到了一封來自[FROM.capital.GetName]的信函，信上印有明顯的[FROM.GetLeader]的印章。華麗的辭藻裡隱藏著清晰的要求：我們必須臣服，承認[FROM.GetNameDef]對我們勢力的權威。沒有談判餘地，只有服從，否則後果自負。"
 SEA_PRC_faction_events.80.a: "讓他們來試試。"
 SEA_PRC_faction_events.80.b: "我們別無選擇，只能聽命。"
 SEA_PRC_faction_events.81.t: "[FROM.GetName]拒絕了我們慷慨的提議"
 SEA_PRC_faction_events.81.desc: "最後通牒已被拒絕。[FROM.GetLeader]選擇公然違抗，明確表示絕不屈服。我們的使者已被遣回，外交手段將讓位於戰爭。"
 SEA_PRC_faction_events.81.a: "那就讓他們乖乖就範！"
 SEA_PRC_faction_events.82.t: "[FROM.GetName]低頭"
 SEA_PRC_faction_events.82.desc: "[FROM.GetName]已接受我們的最後通牒。其領導人雖大談國家統一與歷史命運，但意圖顯而易見——他們如今承認了[ROOT.GetNameDef]的權威。\n儘管他們的歸順或許心有不甘，但這避免了中國的進一步分裂與流血衝突。"
 SEA_PRC_faction_events.82.a: "破碎的太陽重新聚光"
 SEA_PRC_faction_events.90.t: "[FROM.GetNameDefCap]請求加入[ROOT.GetFactionName]"
 SEA_PRC_faction_events.90.desc: "鑑於我們雙方共同面臨的侵略威脅，[FROM.GetNameDef]希望加入我方陣營。這意味著我們要接納他們以及[FROM.GetFactionName]的所有陣營成員"
 SEA_PRC_faction_events.90.a: "是的，我們必須團結起來對抗共同的敵人"
 SEA_PRC_faction_events.90.b: "不行，我們沒法信任他們"
 SEA_PRC_faction_events.91.t: "[FROM.GetNameDefCap]拒絕了我們"
 SEA_PRC_faction_events.91.desc: "[FROM.GetNameDefCap]已拒絕我們加入其陣營以對抗共同敵人的提議。他們的聲明指出，儘管聯合會使我們更強大，但他們並不信任[ROOT.GetNameDef]"
 SEA_PRC_faction_events.91.a: "真遺憾！"
 SEA_PRC_border_war_events.1.t: "[PRC.GetNameDefCap]征服了[1045.GetName]"
 SEA_PRC_border_war_events.1.desc: "在[1045.GetName]的邊境衝突中，[PRC.GetNameDef]突破了防線，將敵人擊退。[PRC.GetNameDefCap]現已聲稱該地歸屬他們。"
 SEA_PRC_border_war_events.1.a: "我們的力量在壯大！"
 SEA_PRC_border_war_events.1.b: "我們必須撤退……"
 SEA_PRC_border_war_events.2.t: "[PRC.GetNameDefCap]從[1045.GetName]撤軍"
 SEA_PRC_border_war_events.2.desc: "在[1045.GetName]的邊境衝突中，[PRC.GetNameDef]未能突破防線，也未能擊退敵人。不過，[PRC.GetNameDefCap]繳獲了一些火炮。"
 SEA_PRC_border_war_events.2.a: "暫時的挫折……"
 SEA_PRC_border_war_events.2.b: "我們趕走了進犯者！"
 SEA_PRC_border_war_events.3.t: "[PRC.GetNameDefCap]征服了[615.GetName]"
 SEA_PRC_border_war_events.3.desc: "在[615.GetName]的邊境衝突中，[PRC.GetNameDef]突破了防線，將敵人擊退。[PRC.GetNameDefCap]現已聲稱該地歸屬他們。"
 SEA_PRC_border_war_events.4.t: "[PRC.GetNameDefCap]撤出[615.GetName]"
 SEA_PRC_border_war_events.4.desc: "在[615.GetName]的邊境衝突中，[PRC.GetNameDef]未能突破防線，也未能擊退敵人。不過，[PRC.GetNameDefCap]繳獲了一些火炮。"
 SEA_PRC_border_war_events.5.t: "[PRC.GetNameDefCap]征服了[1032.GetName]"
 SEA_PRC_border_war_events.5.desc: "在[1032.GetName]的邊境衝突中，[PRC.GetNameDef]突破了防線，將敵人擊退。[PRC.GetNameDefCap]現已聲稱該地歸屬他們。"
 SEA_PRC_border_war_events.6.t: "[PRC.GetNameDefCap]撤出[1032.GetName]"
 SEA_PRC_border_war_events.6.desc: "在[1032.GetName]的邊境衝突中，[PRC.GetNameDef]未能突破防線，也未能擊退敵人。不過，[PRC.GetNameDefCap]繳獲了一些火炮。"
 SEA_PRC_misc_events.1.t: "人民懷疑我們的決心"
 SEA_PRC_misc_events.1.desc: "中國人民開始懷疑我們抗擊外敵的決心！"
 SEA_PRC_misc_events.1.a: "不可容忍！"
 SEA_PRC_misc_events.2.t: "信任的流失"
 SEA_PRC_misc_events.2.desc: "中國人民開始懷疑我們抗擊外敵的決心。"
 SEA_PRC_misc_events.2.a: "我們必須扭轉他們的看法"
 SEA_PRC_misc_events.3.t: "$PRC_pavel_mif$在[SOV.GetNameDef]遭捕並被清洗"
 SEA_PRC_misc_events.3.desc: "$PRC_pavel_mif$曾是二十八個半布爾什維克的導師，同時在中國共產黨和莫斯科中山大學擔任要職，如今已在[SOV.GetNameDef]被捕並遭清洗。米夫與斯大林昔日政敵的聯繫為他招來了殺身之禍。"
 SEA_PRC_misc_events.3.a: "一個巨大的損失"
 SEA_PRC_misc_events.5.t: "賀龍與第二方面軍已抵達[ROOT.capital.GetName]"
 SEA_PRC_misc_events.5.desc: "在避開國民黨軍隊圍追堵截三年多後，賀龍率領部隊以極小的損失抵達了[ROOT.capital.GetName]。賀龍早年指揮訓練國民黨軍隊、後加入紅軍領導遊擊部隊的經驗將發揮重要作用，他領導的部隊也同樣如此。"
 SEA_PRC_misc_events.5.a: "終於來了！我們需要他的經驗"
 SEA_PRC_misc_events.6.t: "美國記者埃德加·斯諾採訪毛澤東"
 SEA_PRC_misc_events.6.desc: "美國記者埃德加·斯諾在中國其他地區從事新聞工作數年後，主動聯繫到毛澤東要求採訪。在接下來的一系列採訪中，毛澤東和斯諾主要談論了[JAP.GetAdjective]帝國主義，以及[ROOT.GetNameDef]和[CHI.GetNameDef]該如何抵禦日本侵略的問題。毛澤東特別預言，如果日本遭遇重大軍事失敗，其國內將爆發革命。這些採訪內容以及斯諾在[ROOT.GetNameDef]的經歷將成為其著作的素材，用以展現他對當地生活的獨特見解。"
 SEA_PRC_misc_events.6.a: "向世界展示我們真實面貌的機會"
 SEA_PRC_misc_events.8.t: "$PRC_mao_zedong$的創作高峰期"
 SEA_PRC_misc_events.8.desc: "在延安附近山區的鳳凰山窯洞裡，毛澤東與[ROOT.GetCommunistParty]其他領導人同住於此。除了創作詩歌外，他還撰寫從軍事戰術到政治等各類主題的文章。"
 SEA_PRC_misc_events.8.a: "這些著作必將產生深遠影響"
 SEA_PRC_misc_events.9.t: "中國共產黨第七次全國代表大會"
 SEA_PRC_misc_events.9.desc: "隨著[JAP.GetNonIdeologyName]的戰敗，中國共產黨組織召開了全體會議，商討未來發展道路。本屆第七次全國代表大會，是自1928年黨的六大以來召開的首次全國代表大會，也是黨首次在國內召開的全國代表大會——此前由於黨在革命鬥爭中面臨困難局面，六大曾在莫斯科召開。本屆大會的議題包括在抗擊[JAP.GetAdjective]侵略者過程中各項戰略戰術的成功與失敗經驗；此外會議還審議通過了新的黨章，旨在落實[ROOT.GetLeader]關於引領國家前進願景的科學構想。"
 SEA_PRC_misc_events.9.a: "這將引領我們走向未來"
 SEA_PRC_misc_events.10.t: "加拿大醫生白求恩抵達"
 SEA_PRC_misc_events.10.desc: "加拿大共產黨員諾爾曼·白求恩曾參與西班牙內戰並擔任戰地醫生，現已抵達協助[ROOT.GetAdjective]人民提升醫療質量。他此前因成功創建流動輸血站而聞名，如今其工作重點很可能將轉向改善[ROOT.GetNameDef]偏遠農村地區的醫療狀況。"
 SEA_PRC_misc_events.10.a: "我們歡迎所有國際志願者"
 SEA_PRC_misc_events.11.t: "諾曼·白求恩去世"
 SEA_PRC_misc_events.11.desc: "悲傷的消息抵達[ROOT.Capital.GetName]。諾曼·白求恩醫生在救助根據地人民兩年多後，因手指劃傷導致血液中毒而不幸離世。[ROOT.GetLeader]聞訊後撰寫悼文，讚揚白求恩的工作精神，特別提及他遠渡重洋支援同志的國際主義情懷，為各國無產階級之間的合作樹立了榜樣。"
 SEA_PRC_misc_events.11.a: "恰如其分的悼文"
 SEA_PRC_misc_events.12.t: "《蘇日中立條約》簽署"
 SEA_PRC_misc_events.12.desc: "為保障東部邊境安全，[SOV.GetNameDef]與[JAP.GetNameDef]簽署了“中立條約”。然而，這意味著[JAP.GetNameDef]將能夠在亞洲擴張而無需擔心[SOV.GetAdjective]干預。"
 SEA_PRC_misc_events.12.a: "一個難以嚥下的苦果"
 SEA_PRC_misc_events.13.t: "[FROM.GetNameDefCap]索要領土"
 SEA_PRC_misc_events.13.desc: "我們接待了來自[FROM.GetNameDef]的使節，他們請求我們移交他們聲稱“理應屬於他們”的領土——從某種角度來看，或許確實如此。若我們應允，[FROM.GetLeader]將感激不盡；若我們拒絕，[FROM.GetLeader.GetSheHe]則可能震怒，甚至考慮動武，至少使節是這樣聲稱的……"
 SEA_PRC_misc_events.13.a: "把我們的滿洲領地交出去"
 SEA_PRC_misc_events.13.b: "把我們的蒙古領地交出去"
 SEA_PRC_misc_events.13.c: "把我們的領地都交出去"
 SEA_PRC_misc_events.13.d: "他們什麼也別想得到！"
 SEA_PRC_misc_events.14.t: "[FROM.GetNameDefCap]同意移交"
 SEA_PRC_misc_events.14.desc: "我們的使節從[FROM.GetNameDef]帶回了極好的消息！我們要求移交滿洲領土的請求已被[FROM.GetLeader]批准。[ROOT.GetLeader]對[FROM.GetLeader]和我們的外交官讚譽有加。"
 SEA_PRC_misc_events.14.a: "更進一步走向統一的中國！"
 SEA_PRC_misc_events.15.desc: "我們的使節從[FROM.GetNameDef]帶回了極好的消息！我們要求移交蒙古領土的請求已被[FROM.GetLeader]批准。[ROOT.GetLeader]對[FROM.GetLeader]和我們的外交官讚譽有加。"
 SEA_PRC_misc_events.16.desc: "我們的使節從[FROM.GetNameDef]帶回了極好的消息！我們要求[FROM.GetNameDef]移交理應屬於我們的領土的請求已被[FROM.GetLeader]批准。[ROOT.GetLeader]對[FROM.GetLeader]和我們的外交官讚譽有加。"
 SEA_PRC_misc_events.17.t: "[FROM.GetNameDefCap]拒絕移交"
 SEA_PRC_misc_events.17.desc: "我們的使節垂頭喪氣地從[FROM.GetNameDef]返回。我們要求移交領土的請求遭到[FROM.GetLeader]的拒絕與嘲諷。[ROOT.GetLeader]痛罵[FROM.GetLeader]和我們的外交官未能奪回理應屬於我們的土地。"
 SEA_PRC_misc_events.17.a: "盲目的愚者依然是愚者"
 SEA_PRC_misc_events.17.b: "我們將用武力奪回屬於我們的東西！"
 SEA_PRC_misc_events.18.desc: "我們的使節垂頭喪氣地從[FROM.GetNameDef]返回。我們要求移交領土的請求遭到[FROM.GetLeader]的拒絕與嘲諷。[ROOT.GetLeader]痛罵[FROM.GetLeader]和我們的外交官未能奪回理應屬於我們的土地。"
 SEA_PRC_misc_events.18.a: "移交[326.GetName]"
 SEA_PRC_misc_events.18.b: "移交[729.GetName]"
 SEA_PRC_misc_events.18.c: "移交[728.GetName]"
 SEA_PRC_misc_events.18.d: "全部移交"
 SEA_PRC_misc_events.19.a: "[FROM.GetNameDefCap]移交[326.GetName]"
 SEA_PRC_misc_events.19.b: "[FROM.GetNameDefCap]移交[729.GetName]"
 SEA_PRC_misc_events.19.c: "[FROM.GetNameDefCap]移交[728.GetName]"
 SEA_PRC_misc_events.19.d: "[FROM.GetNameDefCap]移交全部領土"
 SEA_PRC_misc_events.19.e: "[FROM.GetNameDefCap]移交[743.GetName]"
 SEA_PRC_misc_events.19.desc: "很幸運，[FROM.GetNameDef]同意了我們的要求。"
 SEA_PRC_political_events.1.t: "$PRC_wang_ming$或$PRC_bo_gu$擔任[Root.GetName]領導人？"
 SEA_PRC_political_events.1.desc1: "隨著二十八個半布爾什維克在權力鬥爭中佔據上風，是時候選派一名代表來領導國家了。$PRC_wang_ming$此前流亡[SOV.GetNameDef]，現在該讓他回國了——要是$PRC_bo_gu$未能當選的話。"
 SEA_PRC_political_events.1.desc2: "隨著二十八個半布爾什維克在權力鬥爭中佔據上風，是時候選派一名代表來領導國家了。博古和王明均與[SOV.GetNameDef]共產黨有密切聯繫，儘管$PRC_bo_gu$政治經驗較淺，卻對軍事事務有更深刻的理解，這在未來的鬥爭中或許能派上用場；而$PRC_wang_ming$則在政治和外交事務上經驗更為豐富。兩人都已準備好承擔這一重任。"
 SEA_PRC_political_events.1.a: "讓$PRC_wang_ming$領導"
 SEA_PRC_political_events.1.b: "讓$PRC_bo_gu$領導"
 SEA_PRC_political_events.2.t: "[FROM.GetNameDefCap]請求領土保障"
 SEA_PRC_political_events.2.desc: "儘管有了我們的支持，且華中山區的環境相對安全，[FROM.GetNameDef]仍請求我們承諾在發生衝突時為其提供保護。尚不清楚他們是擔心國民黨再次發起反共圍剿，還是擔心來自中國境外的帝國主義勢力，但我們必須權衡被捲入此類衝突的風險。"
 SEA_PRC_political_events.2.a: "我們應該保護我們的同志。"
 SEA_PRC_political_events.2.b: "只要他們同意成為我們的附庸，我們就保證他們的安全"
 SEA_PRC_political_events.2.c: "這太冒險了"
 SEA_PRC_political_events.3.t: "[FROM.GetNameDefCap]同意保障領土"
 SEA_PRC_political_events.3.desc: "我們派往[FROM.GetNameDef]的代表團取得了成功，對方承諾保護我們免受任何可能面臨的威脅。有了這種保護，我們便能夠專注於長期目標，比如發展[ROOT.capital.GetName]。如若不然，當我們再次被迫進行戰略轉移時，這些目標可能會遭到損害。"
 SEA_PRC_political_events.3.a: "這應該能確保我們的安全。"
 SEA_PRC_political_events.31.t: "[FROM.GetNameDefCap]同意給予領土保障——但要付出代價"
 SEA_PRC_political_events.31.desc: "我們派往[FROM.GetNameDef]的代表團取得了成功，對方承諾保護我們免受任何可能面臨的威脅。有了這種保護，我們便能夠專注於長期目標，比如發展[ROOT.capital.GetName]。如若不然，當我們再次被迫進行戰略轉移時，這些目標可能會遭到損害。"
 SEA_PRC_political_events.31.a: "這應該能確保我們的安全。"
 SEA_PRC_political_events.31.b: "轉念一想……還是算了"
 SEA_PRC_political_events.32.t: "[FROM.GetNameDefCap]後悔他們的決定"
 SEA_PRC_political_events.32.desc: "[FROM.GetNameDefCap]回覆稱，他們不再希望追求由我們提供保障的和平方案。顯然，成為附庸的前景令他們難以忍受。"
 SEA_PRC_political_events.32.a: "這是他們的損失"
 SEA_PRC_political_events.4.t: "[FROM.GetName]拒絕為我們提供保障"
 SEA_PRC_political_events.4.desc: "儘管我們的外交人員竭盡全力，[FROM.GetNameDef]仍拒絕承諾保護[ROOT.GetNameDef]。我們只能寄希望於，這種保護承諾本就不會有派上用場的那一天。"
 SEA_PRC_political_events.4.a: "真是遺憾"
 SEA_PRC_political_events.5.t: "[FROM.GetName]希望加入[ROOT.GetFactionName]"
 SEA_PRC_political_events.5.desc: "[FROM.GetNameDefCap]為尋求擴大與我們的合作採取了新舉措，請求加入[ROOT.GetFactionName]。現在，我們必須決定，是將此視為[ROOT.GetFactionName]向中國擴展的有利舉措，還是認定與其結盟可能成為將來的負擔。"
 SEA_PRC_political_events.5.a: "讓他們加入"
 SEA_PRC_political_events.5.b: "我們不能冒著擴張過度的風險。"
 SEA_PRC_political_events.6.t: "[FROM.GetName]同意我們加入[FROM.GetFactionName]"
 SEA_PRC_political_events.6.desc: "我們派往[FROM.GetNameDef]的代表團已返回國內，並宣佈我們已獲准加入[FROM.GetFactionName]。隨他們一同到來的還有[FROM.GetAdjective]外交官，雙方將討論我們的合作形式。"
 SEA_PRC_political_events.6.a: "新的一天"
 SEA_PRC_political_events.7.t: "[FROM.GetName]拒絕我們加入[FROM.GetFactionName]"
 SEA_PRC_political_events.7.desc: "我們派往[FROM.GetName]的外交官帶回消息，對方未允許我們加入[FROM.GetFactionName]。看來，[FROM.GetNameDef]正將外交精力轉向別處。"
 SEA_PRC_political_events.7.a: "真是遺憾"
 SEA_PRC_political_events.8.t: "[FROM.GetName]希望簽署互不侵犯條約"
 SEA_PRC_political_events.8.desc: "眼見自身已被潛在的敵人包圍，[FROM.GetNameDef]與我們接觸，尋求籤署互不侵犯條約，希望我們承諾不參與該地區針對他們的任何衝突。"
 SEA_PRC_political_events.8.a: "我們不想摻和進去。"
 SEA_PRC_political_events.8.b: "這將讓對方的行為更具侵略性。"
 SEA_PRC_political_events.9.t: "[FROM.GetName]同意簽署互不侵犯條約"
 SEA_PRC_political_events.9.desc: "經過慎重考慮，[FROM.GetNameDef]決定簽署我們提出的互不侵犯條約。值得慶幸的是，他們似乎無意捲入該地區的衝突。"
 SEA_PRC_political_events.9.a: "解脫了。"
 SEA_PRC_political_events.10.t: "[FROM.GetName]拒絕簽署互不侵犯條約"
 SEA_PRC_political_events.10.desc: "[FROM.GetName]帝國主義已拒絕與我們簽訂互不侵犯條約的請求。看來他們優先考慮的是與我國競爭對手的關係。"
 SEA_PRC_political_events.10.a: "真是遺憾"
 SEA_PRC_political_events.11.t: "[FROM.GetName]希望自由"
 SEA_PRC_political_events.11.desc: "[FROM.GetLeader]已向[Root.GetLeader]發出電報，正式請求[FROM.GetName]獨立。電文未說明若我們拒絕會怎樣，但顯然他們不會善罷甘休。"
 SEA_PRC_political_events.11.a: "讓他們自由吧。"
 SEA_PRC_political_events.11.b: "不行，他們必須繼續臣服於我們。"
 SEA_PRC_political_events.12.t: "[FROM.GetName]同意釋放我們"
 SEA_PRC_political_events.12.desc: "[ROOT.Capital.GetName]今日是輝煌的一天——我們終於擺脫了[FROM.GetName]的枷鎖！是時候慶祝了，我們的時代到來了。"
 SEA_PRC_political_events.12.a: "多麼偉大的一天！"
 SEA_PRC_political_events.13.t: "[FROM.GetName]拒絕釋放我們"
 SEA_PRC_political_events.13.desc: "可惜啊！作為對[ROOT.GetLeader]電報的回應，[FROM.GetName]拒絕保障我們的獨立，反而宣佈我們的命運與他們密不可分。"
 SEA_PRC_political_events.13.a: "非常時期，非常手段……"
 SEA_PRC_political_events.13.b: "我們會等待時機……"
 SEA_PRC_political_events.19.t: "我們的一些陸軍將領倒戈！"
 SEA_PRC_political_events.19.desc: "[PRC.GetNameDef]與[CHI.GetNameDef]之間的衝突削弱了我軍力量，部分指揮官已經投向了共產黨。他們究竟是真心認同[PRC.GetNameDef]，還是單純見風使舵，仍有待觀察。"
 SEA_PRC_political_events.19.a: "他們大多數都是叛徒"
 SEA_PRC_political_events.20.t: "中國各地將領紛紛投奔我們的事業"
 SEA_PRC_political_events.20.desc: "[CHI.GetNameDef]與[PRC.GetNameDef]之間戰事重燃，令敵方軍官產生了動搖，部分人員轉而向我方投誠。"
 SEA_PRC_political_events.20.a: "一個充滿希望的跡象！"
 SEA_PRC_political_events.21.t: "[FROM.GetName]希望$SOV_vasily_chuykov$和$SOV_aleksandr_cherepanov$能為他們提供建議"
 SEA_PRC_political_events.21.desc: "\n為尋求[ROOT.GetAdjective]的軍事建議，[FROM.GetNameDef]已請求我們允許$SOV_vasily_chuykov$和$SOV_aleksandr_cherepanov$重回中國。崔可夫精通中文，最初曾駐派[FROM.GetNameDef]，但因在被日本人侵佔前滿洲的一些與[ROOT.GetAdjective]的利益衝突問題，他被召回了蘇聯。"
 SEA_PRC_political_events.21.a: "[FROM.GetNameDefCap]將能從其協助中獲益"
 SEA_PRC_political_events.21.b: "我們國內也需要其提供專業知識"
 SEA_PRC_political_events.22.t: "[FROM.GetName]同意派遣顧問$SOV_vasily_chuykov$和$SOV_aleksandr_cherepanov$"
 SEA_PRC_political_events.22.desc: "\n我方駐[FROM.capital.GetName]代表通報，[FROM.GetNameDef]已同意$SOV_vasily_chuykov$返回中國的請求，並通知我們，崔可夫已在前往[ROOT.GetNameDef]的途中。此外$SOV_aleksandr_cherepanov$也已加入。"
 SEA_PRC_political_events.22.a: "歡迎回來！"
 SEA_PRC_political_events.23.t: "[FROM.GetName]拒絕派遣$SOV_vasily_chuykov$和$SOV_aleksandr_cherepanov$"
 SEA_PRC_political_events.23.desc: "\n儘管$SOV_vasily_chuykov$完全適任駐[ROOT.GetNameDef]的軍事顧問，[FROM.GetNameDef]仍決定不派他或$SOV_aleksandr_cherepanov$前往，聲稱他們目前正參與更重要的軍事計劃。"
 SEA_PRC_political_events.23.a: "或許大清洗沒留下多少優秀的指揮官了"
 SEA_PRC_political_events.24.t: "[FROM.GetName]希望我們重新安排$SOV_vasily_chuykov$和$SOV_aleksandr_cherepanov$的職務"
 SEA_PRC_political_events.24.desc: "\n得知$SOV_vasily_chuykov$和$SOV_aleksandr_cherepanov$將赴[CHI.GetNameDef]執行公務後，[FROM.GetNameDef]同樣表示有意邀請他們擔任軍事顧問。[FROM.GetNameDefCap]似乎看中了他們二人既精通中文又具備豐富軍事經驗的雙重優勢，或許僅僅是不願讓[CHI.GetName]獲得這些專家。"
 SEA_PRC_political_events.24.a: "我們將支援[FROM.GetNameDef]的同志"
 SEA_PRC_political_events.24.b: "他們在[CHI.GetName]幹得不錯"
 SEA_PRC_political_events.25.t: "[FROM.GetName]指示$SOV_vasily_chuykov$和$SOV_aleksandr_cherepanov$前往[PRC.GetName]"
 SEA_PRC_political_events.25.desc: "\n$SOV_vasily_chuykov$與$SOV_aleksandr_cherepanov$已應[PRC.GetNameDef]調動請求，啟程前往其轄區。儘管我們懇請二人留下擔任顧問，但他們無法違抗[FROM.GetNameDef]下達的命令。"
 SEA_PRC_political_events.25.a: "我們軍隊的一大損失"
 SEA_PRC_political_events.26.t: "[FROM.GetName]指示$SOV_vasily_chuykov$和$SOV_aleksandr_cherepanov$前往[PRC.GetName]"
 SEA_PRC_political_events.26.desc: "\n[FROM.GetNameDefCap]已決定接受我方請求，並下令將$SOV_vasily_chuykov$和$SOV_aleksandr_cherepanov$調任至[ROOT.GetNameDef]。他們的建議無疑將極具價值，而二人的調離將是對[CHI.GetNameDef]軍隊的沉重打擊。"
 SEA_PRC_political_events.26.a: "讓我們看看他們會提出什麼建議"
 SEA_PRC_political_events.27.t: "[FROM.GetName]拒絕派遣$SOV_vasily_chuykov$和$SOV_aleksandr_cherepanov$"
 SEA_PRC_political_events.27.desc: "\n儘管[FROM.GetNameDef]先前提供了支持，但現在他們拒絕解除$SOV_vasily_chuykov$和$SOV_aleksandr_cherepanov$在[CHI.GetNameDef]的職務，而是讓他們擔任這裡的武官。他們的理由是，[CHI.GetNameDef]擁有一支強大的軍隊，這一點目前對[FROM.GetNameDef]很重要。"
 SEA_PRC_political_events.27.a: "他們在犯錯"
 SEA_PRC_political_events.41.t: "勉強合作的兩架馬車"
 SEA_PRC_political_events.41.desc: "作為多年的政治對手，$PRC_mao_zedong$與$PRC_zhang_guotao$在[ROOT.Capital.GetName]會面，面對當前的危急局勢，他們暫時擱置了分歧。儘管雙方並未完全信任彼此，但敵人的敵人確實可以成為朋友。"
 SEA_PRC_political_events.41.a: "不穩定的同盟"
 SEA_PRC_zhang_guotao_events.1.t: "黨內分歧"
 SEA_PRC_zhang_guotao_events.1.desc: "紅四方面軍總指揮$PRC_zhang_guotao$，率領著尚未抵達我方安全根據地的兩支部隊之一。由於在行軍路線上與毛澤東產生分歧，他們仍在長征途中。1935年10月，$PRC_zhang_guotao$自稱為“[ROOT.GetNameDef]真正的領導人”，甚至擅自組建了“中央委員會”、“中央政府”與“中央軍委”，同時揚言應將$PRC_mao_zedong$、$PRC_zhang_wentian$和$PRC_zhou_enlai$開除黨籍。\n\n近日，$PRC_zhang_guotao$電告[ROOT.GetLeader]，稱其正率軍向根據地行進。電報還聲稱其已應中共駐[SOV.GetNameDef]代表林育英的意見“暫停其黨務機構”，以示與毛澤東等人和平和解之意願。無論張國燾如何表態，他依然是一個強大的政治對手，其政治野心與影響力不容低估。"
 SEA_PRC_zhang_guotao_events.1.a: "儘管張國燾手握軍隊，但黨反對其合法性主張"
 SEA_PRC_zhang_guotao_events.1.b: "也許他說得有點道理？"
 SEA_PRC_zhang_guotao_events.2.t: "來自$PRC_zhang_guotao$的電報"
 SEA_PRC_zhang_guotao_events.2.desc: "紅四方面軍的$PRC_zhang_guotao$致電，稱他與部隊即將抵達[ROOT.Capital.GetName]。他們的長征比$PRC_mao_zedong$的隊伍足足多走了一年，必然筋疲力盡。或許正因如此，$PRC_zhang_guotao$再次強調無意挑戰黨的現有領導。" #will arrive soon, drops his claims (for now) etc.
 SEA_PRC_zhang_guotao_events.2.a: "歡迎張國燾與他的部隊——但必須嚴加監視"
 SEA_PRC_zhang_guotao_events.2.b: "我們不能信任他——公開譴責$PRC_zhang_guotao$，並拒絕他進入根據地"
 PRC_reject_guotao_tt: "§R這將使你無法選擇§!§Y$PRC_the_unwilling_diarchy_focus$§!§R國策及後續分支§!"
 SEA_PRC_zhang_guotao_events.3.t: "$PRC_zhang_guotao$與紅四方面軍抵達[ROOT.capital.GetName]"
 SEA_PRC_zhang_guotao_events.3.desc: "終於，$PRC_zhang_guotao$與紅四方面軍的長征結束，他們抵達了我們的根據地，算是安全歸來。情況彙報已然開始，但張國燾並未放棄自己對領導權的主張。他聲稱自己支持一切有助於贏得即將到來的鬥爭的措施，卻未說明具體含義。對此，必須由[Root.GetLeader]主持召開進一步的政治局會議以解決此事。"
 SEA_PRC_zhang_guotao_events.3.a: "對黨的領導層的挑戰？"
 SEA_PRC_zhang_guotao_events.4.t: "$PRC_zhang_guotao$退出共產黨"
 SEA_PRC_zhang_guotao_events.4.desc: "$PRC_zhang_guotao$宣佈退出中國共產黨，理由是與中央委員會的關係不可修復，以及他對黨的失望。"
 SEA_PRC_zhang_guotao_events.4.a: "我們事業的叛徒"
 SEA_PRC_zhang_guotao_events.4.b: "說服他留下"
 PRC_zhang_guotao_left_tt: "§Y$PRC_zhang_guotao$§!§R不再是§!§Y陸軍將領§!或§Y顧問§!"
 CHI_guotao_joins_kmt: "$PRC_zhang_guotao$已加入國民黨"
 SEA_PRC_zhang_guotao_events.5.t: "$PRC_zhang_guotao$想要加入我們的事業"
 SEA_PRC_zhang_guotao_events.5.desc: "$PRC_zhang_guotao$，這位“前”共產黨領袖，同時也是$PRC_mao_zedong$的政治對手，已向[ROOT.GetLeader]提出請求，希望加入我們，共同對抗外來侵略。由於他剛剛公開否定[PRC.GetLeader]對中央委員會的領導，他已退出中共。如今他尋求投靠我們。他的經驗或許有用，但若我們接納這名叛徒，[PRC.GetNameDef]必將震怒。"
 SEA_PRC_zhang_guotao_events.5.a: "讓$PRC_zhang_guotao$加入我們"
 SEA_PRC_zhang_guotao_events.5.b: "拒絕他——我們不能信任他"
 SEA_PRC_zhang_guotao_events.6.t: "$PRC_zhang_guotao$已加入國民黨"
 SEA_PRC_zhang_guotao_events.6.desc: "$PRC_zhang_guotao$不僅退出了中共，還加入了由[CHI.GetNameDef]領導的國民黨。若我們日後與他們直接衝突，$PRC_zhang_guotao$將站在敵人一邊。"
 SEA_PRC_zhang_guotao_events.6.a: "叛徒！"
 SEA_PRC_zhang_guotao_events.7.t: "$PRC_zhang_guotao$退出共產黨"
 SEA_PRC_zhang_guotao_events.7.desc: "$PRC_zhang_guotao$已宣佈脫離中國共產黨，他聲稱與中央委員會和$PRC_mao_zedong$的關係無法修復，且對黨感到失望。"
 SEA_PRC_zhang_guotao_events.7.a: "兩架馬車是個錯誤——他不能被信任"
 #######################
 ### THE Philippines ###
 #######################
 SEA_PHI_political_events.1.t: "[FROM.GetName]提議簽署貿易協議" #Japan gets request for trade connection (from PHI to JAP)
 SEA_PHI_political_events.1.desc: "為減少對[USA.GetAdjective]貿易的依賴，[FROM.GetNameDef]已向我方提出新的貿易協定提案。與其類似，此舉或許也能讓我們減少對少數幾個貿易伙伴的依賴。"
 SEA_PHI_political_events.1.a: "對於我們所需的資源來說，擁有其他供應渠道至關重要" ## Agree to trade
 SEA_PHI_political_events.1.b: "我們還有其他考慮中的貿易伙伴人選" ## Reject Trade
 SEA_PHI_political_events.2.t: "日本簽署貿易協議"
 SEA_PHI_political_events.2.desc: "我們與[FROM.GetNameDef]提出的貿易協議得到了其政府的積極回應。他們的熱情為我們尋找新貿易伙伴的工作開了個好頭。"
 SEA_PHI_political_events.2.a: "好消息"
 SEA_PHI_political_events.3.t: "[FROM.GetName]提議簽署新貿易協議" ## These are Siam, Malaya and Dutch East Indies. They get this event from PHI
 SEA_PHI_political_events.3.desc: "隨著獨立路徑的確立，[FROM.GetNameDef]已向我們提交了一份兩國貿易協定的草案。他們提出的協議將使進口我國資源對他們更具吸引力，而此前貿易伙伴的選擇可能基於[USA.GetAdjective]的利益，而非[FROM.GetAdjective]自身的利益。"
 SEA_PHI_political_events.3.a: "這將給我們帶來競爭優勢"
 SEA_PHI_political_events.3.b: "他們會得到和其他人一樣的價格"
 SEA_PHI_political_events.4.t: "[FROM.GetName]接受貿易協議"
 SEA_PHI_political_events.4.desc: "[FROM.GetAdjective]代表宣佈將派遣更多代表來制定我們兩國間的貿易協定。與[FROM.GetNameDef]的新協定有望為我們獲取關鍵資源提供更多選擇。"
 SEA_PHI_political_events.4.a: "好消息"
 SEA_PHI_political_events.5.t: "[FROM.GetName]拒絕貿易協議"
 SEA_PHI_political_events.5.desc: "我們與[FROM.GetNameDef]達成貿易協議的合理提議遭到了拒絕。看來，與其他貿易伙伴的交易或地緣政治方面的考量，讓他們做出了有損於我們雙方利益的行為。"
 SEA_PHI_political_events.5.a: "我們會找其他人購買資源"
 SEA_PHI_political_events.6.t: "[FROM.GetName]提供支援" ### Support for the Chinese Communists - Sends event from PHI to PRC offering support
 SEA_PHI_political_events.6.desc: "[FROM.GetNameDef]國內[FROM.GetCommunistParty]日益增長的影響力如今初見成效——其代表跨越中國，告知我們有一支[FROM.GetAdjective]支援我方部隊的志願部隊正在集結。此外，這些志願者還帶來了備用裝備，以幫助裝備我方軍隊。"
 SEA_PHI_political_events.6.a: "與我們[FROM.GetAdjective]的同志進行合作的良好開端"
 #SEA_PHI_political_events.6.b: "They should focus on their own revolution"
 SEA_PHI_political_events.7.t: "[FROM.GetName]感謝我們的支援" ### Support for the Chinese Communists - They accept
 SEA_PHI_political_events.7.desc: "[FROM.GetLeader]的代表轉達了他對我們志願者的支持及所提供戰爭物資的感謝。[FROM.GetAdjective]在內戰中積累的豐富經驗，無疑將確保這些資源得到有效利用。"
 SEA_PHI_political_events.7.a: "良好的開端"
 SEA_PHI_political_events.9.t: "[FROM.GetName]提議出售艦船以換取軍事裝備" ### Request a trade with JAP / USA - convoys for weapons. This is from PHI to JAP/USA
 SEA_PHI_political_events.9.desc: "作為對一批[PHI_GetTradedEquipment]的交換，[FROM.GetNameDef]提議向我們派遣一支商船和運輸船隊。"
 SEA_PHI_political_events.9.a: "非常划算的交易。"
 SEA_PHI_political_events.9.b: "我們需要那些裝備"
 SEA_PHI_political_events.10.t: "[FROM.GetName]同意購買艦船" ## JAP/USA Accepts trade
 SEA_PHI_political_events.10.desc: "依照我方提議，[FROM.GetNameDef]已向我們運送一批[PHI_GetTradedEquipment]，以交換正駛向[FROM.GetAdjective]港口的商船和運輸船。"
 SEA_PHI_political_events.10.a: "我們互利共贏"
 SEA_PHI_political_events.11.t: "[FROM.GetName]拒絕貿易提議" ## JAP/USA rejects trade
 SEA_PHI_political_events.11.desc: "遺憾的是，[FROM.GetNameDef]拒絕向我們提供[PHI_GetTradedEquipment]以交換我方部分船隻。"
 SEA_PHI_political_events.11.a: "或許他們願意拿出一些其他裝備來交換。"
 SEA_PHI_political_events.12.t: "美國干預的威脅結束"
 SEA_PHI_political_events.12.desc: "經過激烈的談判，以及[PHI.GetNameDef]一系列的讓步，[USA.GetLeader]宣佈[USA.GetNameDef]將不會干涉[Root.GetRulingPartyLong]的計劃。[USA.GetLeader.GetSheHeCap]已被說服[PHI.GetNameDef]不會對美國人民構成直接威脅，且我方已採取適當措施確保穩定政府的持續運作。[TreatyOfManilaToBeSigned]"
 SEA_PHI_political_events.12.a: "我們的努力得到了回報"
 PHI_TreatyOfManilaToBeSigned: "\n\n因此，簽署《馬尼拉條約》的談判已獲批准，[PHI.GetNameDef]雙方共同認可的獨立似乎即將實現。"
 SEA_PHI_political_events.13.t: "[PHI.GetCommunistParty]問題"
 SEA_PHI_political_events.13.desc: "[PHI.GetNameDef]共產黨多次拒絕我們的代表，並威脅要斷絕同我們的一切聯繫。\n\n高級軍事官員已將一份軍事計劃遞交至[Root.GetLeader]的辦公桌。該計劃的支持者認為，一個共產主義的菲律賓是對我們安全的威脅，我們必須進行干預，阻止共產主義的蔓延。"
 SEA_PHI_political_events.13.a: "採取行動遏制共產主義在東南亞的蔓延"
 SEA_PHI_political_events.13.b: "禁運[PHI.GetName]"
 SEA_PHI_political_events.13.c: "送去一封義正辭嚴的信函"
 SEA_PHI_political_events.14.t: "宣戰"
 SEA_PHI_political_events.14.desc: "[USA.GetNameDefCap]已向[PHI.GetName]宣戰。此前，[USA.GetAdjective]未能平息對[PHI.GetRulingPartyLong]的擔憂。[USA.GetLeader]公開聲明稱，這場戰爭對於遏制共產主義在東南亞蔓延至關重要。"
 SEA_PHI_political_events.14.a: "我們將抵抗曾經的宗主"
 SEA_PHI_political_events.15.t: "[USA.GetAdjective]禁運"
 SEA_PHI_political_events.15.desc: "[USA.GetNameDefCap]宣佈對[PHI.GetNameDef]實施全面貿易封鎖，其理由是“[PHI.GetAdjective]當局未能有效遏制共產主義勢力的滲透”。"
 SEA_PHI_political_events.15.a: "至少不是武力回應"
 SEA_PHI_political_events.16.t: "[USA.GetName]發出抗議聲明"
 SEA_PHI_political_events.16.desc: "因我們近期的政府與外交政策變化，[USA.GetAdjective]政府發來一封抗議信，譴責我們的舉措。不過考慮到他們此前在南美洲的干涉行動，這已算是輕描淡寫的反應了。"
 SEA_PHI_political_events.16.a: "這已是當前局勢下最好的結果了"
 SEA_PHI_political_events.17.t: "我們新的領導層" ## Pick a new country leader, the communist coup
 SEA_PHI_political_events.17.desc: "趁著美國對菲律賓國民政府監管不力的時機，菲律賓共產黨迅速介入填補了這一權力真空，當選的黨員們呼籲立即採取果斷行動——他們認為只有自己具備這樣的執行力。儘管其他團體仍有一定影響力，但共產主義派別已迅速崛起。\n\n然而如今，我們必須確定究竟該由誰來領導這個政黨，帶領國家走向那冉冉升起的紅色黎明。"
 SEA_PHI_political_events.17.a: "任命埃萬赫利斯塔，我們需要激進的領導"
 SEA_PHI_political_events.17.b: "任命桑托斯，以採取更具理性的策略"
 SEA_PHI_political_events.18.t: "[FROM.GetName]希望加入共產國際" ## Event to SOV - PHI wants to join Comintern
 SEA_PHI_political_events.18.desc: "我們一直饒有興致地關注著[PHI.GetNameDef]國內農民、工廠工人和漁民群體的崛起，如今他們已向我們伸出外交橄欖枝，表示有意加入共產國際。我們該如何回應？"
 SEA_PHI_political_events.18.a: "歡迎[FROM.GetName]加入共產國際" ## Yes, they may join
 SEA_PHI_political_events.18.b: "拒絕他們"
 SEA_PHI_political_events.19.t: "[FROM.GetName]拒絕加入共產國際" ## Event to PHI - Soviet refuses
 SEA_PHI_political_events.19.desc: "我們派往[SOV.GetNameDef]的代表團剛剛返回，但他們帶來了壞消息——我們加入共產國際的申請已被拒絕。至少目前，我們只能獨自對抗黑暗的浪潮。"
 SEA_PHI_political_events.19.a: "今天的世界似乎有點暗淡"
 SEA_PHI_political_events.20.t: "道格拉斯·麥克阿瑟受命前往菲律賓" ## Event to USA - MacArthur going to PHI
 SEA_PHI_political_events.20.desc: "[USA.GetLeader]總統已將道格拉斯·麥克阿瑟召回現役並派其指揮新成立的、駐紮在菲律賓的美國遠東軍。總統做出這一任命是因為麥克阿瑟曾在菲律賓以軍事顧問的身份工作多年，熟知當地防衛情況。\n\n為了讓他更好地指揮當地軍隊，我們將無法控制他。不過，我們可以在需要其才能時將其召回。然而，我們應當仔細考慮這一決定，因為他的離開可能被視為美國對菲律賓興趣的消退，以及在此關鍵時刻放棄在太平洋彼岸的職責。"
 SEA_PHI_political_events.20.a: "祝好運，將軍！"
 SEA_PHI_political_events.21.t: "道格拉斯·麥克阿瑟抵達菲律賓" ## Event to PHI - MacArthur has arrived
 SEA_PHI_political_events.21.desc: "好消息！[USA.GetLeader]總統已指派道格拉斯·麥克阿瑟將軍指揮美國遠東陸軍。我們對麥克阿瑟非常熟悉，他退休期間曾在這裡擔任了多年的軍事顧問，他的任命和復役明確表明[USA.GetNameDef]認真地承擔了對我們國防的責任。\n \n抵達馬尼拉後，他立即著手從[USA.GetNameDef]獲得資源，併發誓要與勇敢的菲律賓人民共同對抗敵人，直到最後一刻。"
 SEA_PHI_political_events.21.a: "歡迎來到菲律賓，將軍！"
 SEA_PHI_political_events.30.t: "菲律賓方面請求調派艾森豪威爾" ## Event to USA - Eisenhower going to PHI
 SEA_PHI_political_events.30.desc: "美國遠東陸軍最高統帥道格拉斯·麥克阿瑟已請求調派其親信德懷特·戴維·艾森豪威爾為其服務。當麥克阿瑟擔任陸軍總司令時，艾森豪威爾已經在其手下服役，顯然這位老將軍看到了他的潛力。我們也認為艾森豪威爾是美國陸軍中一顆冉冉升起的新星，在這樣一個活躍的軍區工作可以為他積累很多經驗。\n\n艾森豪威爾本人強調，他不認為這是一項長期任命，並打算這兩年跟隨麥克阿瑟學習並擔任參謀，之後返回美國為我們服務。"
 SEA_PHI_political_events.30.a: "麥克阿瑟和艾森豪威爾共事？當然！"
 SEA_PHI_political_events.30.b: "不行，艾森豪威爾在這裡更重要" #PHI needs a no explainer
 SEA_PHI_political_events.31.t: "德懷特·D·艾森豪威爾抵達菲律賓" ## Event to PHI - Eisenhower has arrived
 SEA_PHI_political_events.31.desc: "麥克阿瑟將軍的請求得到批准，德懷特·D·艾森豪威爾將被調任到菲律賓！我們很幸運有這樣一顆冉冉升起的新星加入我們，這進一步證明了美國有多注重對我們的保護。我們已明確得知，這是一項大約兩年的短期任命，然而，也許有一種辦法可以將他留在菲律賓。"
 SEA_PHI_political_events.31.a: "歡迎來到菲律賓！"
 SEA_PHI_political_events.40.t: "曼努埃爾·奎松遇刺！" ## Assassination of Quezon
 SEA_PHI_political_events.40.desc: "曼努埃爾·奎松今日下午三點在盧內塔公園向支持者發表演講時遇刺身亡。槍手仍在逃，但據推測與與薩克達爾黨有關。與此同時，出於國家安全考慮，國民議會已關閉。憲兵大量進駐馬尼拉，街道已清空。全國籠罩著一種令人不安的寂靜，人民屏息等待事情後續發展。"
 SEA_PHI_political_events.40.a: "民主的火炬熄滅了。"
 SEA_PHI_political_events.40.b: "警察局長艾森豪威爾會出手介入！"
 PHI_eisenhower_steps_in_tt: "§G艾森豪威爾將嘗試挫敗法西斯分子的陰謀§!"
 SEA_PHI_political_events.41.t: "薩克達爾派流亡者歸來" ## Assassination of Quezon
 SEA_PHI_political_events.41.desc: "阿爾特米奧·裡卡特帶領一隊配備各式日本武器的追隨者從流亡處歸來，宣稱已找到並逮捕了刺殺曼努埃爾·奎松的兇手，同時承諾將與憲兵隊合作，在總統遇刺導致的危機期間維持秩序。鑑於薩克達爾派深受質疑，他承諾與統一黨合作以獲取合法性，從而儘快加速從美國獨立的進程。作為回應，憲兵隊已撤出馬尼拉，明面上的理由是為了避免局勢升級；與此同時，美國駐軍已進入高度戒備狀態，但尚未採取任何行動。"
 SEA_PHI_political_events.41.a: "獨立越來越近了。"
 #Artemio Ricarte, returning from exile with a cadre of followers armed with a variety of Japanese arms have claimed to have found and apprehended the assassin, and are now promising to work together with the constabulary in order to retain order during the crisis caused by the murder of the president. In the mean time, the National Assembly has been closed for reasons of national security."
 SEA_PHI_political_events.42.t: "爭奪領導權" #Fascist Choose New Leader Aguinaldo, Ricarte or Laurel
 SEA_PHI_political_events.42.desc: "我們既然已經確立了對菲律賓的控制，且局勢開始趨於穩定，現在是時候讓執行委員會召開會議，決定國家的最終權力歸屬。目前有三個候選人可供選擇。\n\n埃米利奧·阿奎納多，反抗西班牙革命的英雄，長期以來一直支持菲律賓獨立，並曾公開表示，在美國統治下，菲律賓人民不過是美國出口商品的消費市場，甚至因連美國公民的身份都無法獲得而被視為賤民。\n\n阿特米奧·裡卡爾特，在對抗西班牙和美國的戰爭中擔任菲律賓軍隊的指揮官，後因拒絕向美國佔領者宣誓效忠而被流放。他對祖國的熱愛從未減退，即使在日本生活期間，仍致力於推動我們最終的獨立事業。\n\n何塞·勞雷爾，作為更溫和的選擇，這位最高法院法官曾接受國際教育，並與日本官員有家族聯繫，因此可能非常適合在菲律賓與日本之間建立紐帶，從而為我們的獨立事業創造條件。"
 SEA_PHI_political_events.42.a: "阿奎納多曾領導過我們的獨立事業。"
 SEA_PHI_political_events.42.b: "裡卡爾特擁有我們事業所需的不屈不撓的決心。"
 SEA_PHI_political_events.42.c: "勞雷爾的關係非常深厚。"
 PHI_laurel_help: "§Y何塞·勞雷爾§!將提高在§Y確保日本擔保§!中獲得日本支持的概率"
 SEA_PHI_political_events.43.t: "圍攻國民議會" #Eisenhower Steps In, Calls in MacArthur
 SEA_PHI_political_events.43.desc: "阿特米奧·裡卡爾特結束流亡生涯後，率領一支裝備日本各式武器的追隨者隊伍高調歸來，宣稱已查獲並逮捕了刺殺曼努埃爾·奎松的真兇。然而警方負責人艾森豪威爾立即予以駁斥，指出這不過是收買來頂罪的貧苦農民。\n\n為表達抗議，該組織隨即向國民議會進發，意圖強行伸張正義，並衝入了議會建築群。在入口處爆發的交火中，兩名無辜群眾遭流彈擊中。美方支持的警衛部隊被指控為開槍方，艾森豪威爾鑑於局勢緊張可能惡化，不得不下令警力撤出該區域。\n\n儘管他全力維穩，但隨著薩克達爾黨叛亂分子從周邊地區乘巴士趕來煽動，聚集的暴民規模不斷擴大，幾乎完全壓制了警方力量。萬般無奈之下，艾森豪威爾只得向美國駐軍[MessageToMac]發出緊急增援請求。"
 SEA_PHI_political_events.43.a: "現在只能仰仗[MacOrGarrison]了。"
 PHI_message_to_mac: "的道格拉斯·麥克阿瑟將軍"
 PHI_macarthur: "麥克阿瑟"
 PHI_american_garrison: "美國駐軍"
 SEA_PHI_political_events.44.t: "軍事緊急狀態" #MacArthur announces military emergency
 SEA_PHI_political_events.44.desc: "[MacOrGarrison]做出的反應迅速而猛烈。為確保萬無一失，菲律賓師全體被調往馬尼拉，騎兵率先衝鋒，步兵緊隨其後，刺刀上膛。在遭遇更頑固的抵抗時，催淚瓦斯被用於清場。面對壓倒性的武力震懾，薩克達爾黨民兵被迫放棄路障，潰不成軍地撤離城市。\n\n儘管法西斯政變的初步威脅已被挫敗，但局勢仍可能升級為全面內戰。為此，[MacOrEisenhower]宣佈進入軍事緊急狀態，實施戒嚴，並行使獨裁權力以維持政府穩定運轉。"
 SEA_PHI_political_events.44.a: "一切都是為了捍衛自由與民主！"
 PHI_eisenhower: "艾森豪威爾"
 PHI_declare_military_emergency_tt: "這將解鎖極左路線的國策分支。"
 #43 - Eisenhower Steps In
 #44 - Fighting in the Streets
 #45 - +Mac Declare Military Emergency
 #46 - -Mac Declare Military Emergency
 SEA_PHI_political_events.45.t: "[FROM.GetName]尋求獨立支持"
 SEA_PHI_political_events.45.desc: "[FROM.GetAdjective]政府已同我方接洽，提出了從[USA.GetNameDef]治下爭得獨立的計劃。這些計劃尚未動員部署，但他們請求當[PHI.GetNameDef]真正要求獨立時，我們能支持其訴求，並在訴求遭拒時加入他們一方進行戰鬥。"
 SEA_PHI_political_events.45.a: "這將擴大我們的影響力"
 SEA_PHI_political_events.45.b: "我們不能冒險與[USA.GetNonIdeologyName]開戰"
 SEA_PHI_political_events.46.t: "[FROM.GetName]支持我們的獨立計劃"
 SEA_PHI_political_events.46.desc: "我們已收到[FROM.GetAdjective]政府的消息，他們表示願意支持我們在最終獨立時提出的訴求。僅這一點就應有助於說服[ROOT.overlord.GetNameDef]，此外[FROM.GetNameDef]還承諾，若宗主國試圖撤銷任何邁向獨立的舉措，他們都將給予我們軍事支持。"
 SEA_PHI_political_events.46.a: "棒極了！"
 SEA_PHI_political_events.47.t: "[FROM.GetName]拒絕支持獨立計劃"
 SEA_PHI_political_events.47.desc: "我們派往[FROM.GetNameDef]的外交官在其政府拒絕承諾支持我們邁向獨立的計劃後迅速返回。儘管他們聲稱願意幫助我們，但他們不願冒險捲入與[ROOT.overlord.GetNameDef]的戰爭。"
 SEA_PHI_political_events.47.desc.2: "我們派往[FROM.GetNameDef]的外交官在其政府拒絕承諾支持我們邁向獨立的計劃後迅速返回。看來，他們更想成為我們的新宗主國，，而非想幫助我們實現獨立。"
 SEA_PHI_political_events.47.a: "看來他們關於去殖民化的漂亮說辭全是空談。"
 SEA_PHI_political_events.48.t: "[FROM.GetName]宣佈獨立"
 SEA_PHI_political_events.48.desc: "今天早些時候，我們收到了關於[FROM.GetNameDef]出現異常情況的報告。隨後，我們收到了該國政府發佈的獨立宣言，儘管他們十分誠懇地試圖說服我們不要干預，但也旗幟鮮明地表示不會迴避為維護新獲得的獨立而戰。"
 SEA_PHI_political_events.48.desc.2: "今日早些時候，我們收到了關於[FROM.GetNameDef]地區異常情況的報告。隨後，我們收到了該國政府發佈的獨立宣言，並明確聲明此舉獲得了[JAP.GetAdjective]政府的支持。儘管該聲明呼籲我們不要干預，但[FROM.GetAdjective]政府也明確表示，他們將不惜以武力捍衛新獲得的獨立地位，且[JAP.GetAdjective]將會支援。"
 SEA_PHI_political_events.48.desc.3: "今日早些時候，我們收到了關於[FROM.GetNameDef]地區異常情況的報告。隨後，我們收到了該國政府發佈的獨立宣言，並明確聲明此舉獲得了部分南美國家的支持。儘管該聲明呼籲我們不要干預，但[FROM.GetAdjective]政府也明確表示，他們將不惜以武力捍衛新獲得的獨立地位，且這些南美國家將會支援。"
 SEA_PHI_political_events.48.desc.4: "今日早些時候，我們收到了關於[FROM.GetNameDef]地區異常情況的報告。隨後，我們收到了該國政府發佈的獨立宣言，並明確聲明此舉獲得了[SPR.GetAdjective]政府的支持。儘管該聲明呼籲我們不要干預，但[FROM.GetAdjective]政府也明確表示，他們將不惜以武力捍衛新獲得的獨立地位，且[SPR.GetAdjective]將會支援。"
 SEA_PHI_political_events.48.desc.5: "今日早些時候，我們收到了關於[FROM.GetNameDef]地區異常情況的報告。隨後，我們收到了該國政府發佈的獨立宣言，並明確聲明此舉獲得了[SPR.GetAdjective]和部分南美國家的支持。儘管該聲明呼籲我們不要干預，但[FROM.GetAdjective]政府也明確表示，他們將不惜以武力捍衛新獲得的獨立地位，且這些拉美盟友將會支援。"
 SEA_PHI_political_events.48.a: "我們本來也打算放手。"
 SEA_PHI_political_events.48.b: "他們還沒準備好。"
 SEA_PHI_political_events.49.t: "[FROM.GetName]允許獨立"
 SEA_PHI_political_events.49.desc: "[FROM.GetAdjective]高層在經過數天之後都未對我們的獨立宣言作回應，很有可能是高層展開了激烈的討論。終於，[FROM.GetNameDef]正式宣佈了[ROOT.GetAdjective]的獨立。"
 SEA_PHI_political_events.49.a: "好消息！"
 SEA_PHI_political_events.50.t: "[FROM.GetName]為恢復對我們的控制權而出手"
 SEA_PHI_political_events.50.desc: "針對我們宣佈獨立一事，[FROM.GetNameDef]尚未作出正式回應，但已開始向附近基地調動軍隊以進行干預。"
 SEA_PHI_political_events.50.a: "讓他們試試看！"
 SEA_PHI_political_events.51.t: "[USA.GetNameDef]召回$USA_douglas_macarthur$"
 SEA_PHI_political_events.51.desc: "[USA.GetNameDef]的軍事局勢已經十分嚴峻，$USA_douglas_macarthur$被要求立即回國。"
 SEA_PHI_political_events.51.a: "我們會懷念他的。"
 SEA_PHI_political_events.52.t: "[USA.GetNameDef]召回$USA_dwight_d_eisenhower$"
 SEA_PHI_political_events.52.desc: "[USA.GetNameDef]的軍事局勢已經十分嚴峻，$USA_dwight_d_eisenhower$被要求立即回國。"
 SEA_PHI_political_events.53.t: "$USA_dwight_d_eisenhower$從[PHI.GetName]歸國"
 SEA_PHI_political_events.53.desc: "$USA_dwight_d_eisenhower$隨$USA_douglas_macarthur$的任務來到[PHI.GetNameDef]，自1935年以來參與其中，近年更是擔任重要角色。如今他已返回本土。在任務中，他積累了寶貴的軍事經驗，包括首次駕駛飛機，以及與像$USA_douglas_macarthur$這樣對[PHI.GetAdjective]軍隊改革抱有完全不同想法的指揮官並肩工作。"
 SEA_PHI_political_events.53.a: "他的經歷必將派上用場"
 SEA_PHI_political_events.54.desc: "隨著馬尼拉地區的失陷，我軍對依靠傳統戰術贏得戰爭的信心徹底崩潰。隨著軍隊正式投降，政府撤離，新組織正在籌建，以繼續抵抗敵人。"
 SEA_PHI_political_events.54.a: "我們可以依靠游擊隊繼續戰爭"
 SEA_PHI_political_events.55.t: "$PHI_treaty_of_manila$"
 SEA_PHI_political_events.55.desc: "經過長期的經濟與政治準備，[PHI.GetNameDef]宣佈獨立。這一舉動在意料之中，因為美國國會早在1934年通過《泰丁斯‑麥克杜菲法案》，制定了[PHI.GetAdjective]獨立的進程。[PHI.GetNameDef]如今可以自由制定自身的政治與經濟政策，不再受[USA.GetNameDef]的壓力。"
 SEA_PHI_political_events.55.a: "對他們而言是好事"
 SEA_PHI_political_events.55.b: "現在我們可以平等合作"
 SEA_PHI_political_events.55.c: "我們必須在外交上也追求獨立"
 SEA_PHI_political_events.56.t: "[FROM.GetName]請求掌控太平洋艦隊"
 SEA_PHI_political_events.56.desc: "為建立海軍並進一步為戰爭努力作出貢獻，[FROM.GetNameDef]請求我們將一支或多支在其附近活動的特遣艦隊交由他們控制。"
 SEA_PHI_political_events.56.a: "我們可以自己管理海軍"
 SEA_PHI_political_events.56.b: "讓他們接管當地的特遣艦隊"
 SEA_PHI_political_events.56.c: "讓他們掌控整個太平洋"
 SEA_PHI_political_events.56.d: "讓他們掌控太平洋，但派出監督員"
 SEA_PHI_political_events.56.e: "讓他們掌控太平洋，並提供燃料"
 PHI_transfer_20_percent_navy_tt: "將我們20%的海軍力量移交給[FROM.GetNameDef]。"
 PHI_transfer_40_percent_navy_tt: "將我們40%的海軍力量移交給[FROM.GetNameDef]。"
 SEA_PHI_political_events.57.t: "被委託的艦隊"
 SEA_PHI_political_events.57.desc: "我們請求接管當地[FROM.GetAdjective]海軍的要求已被其政府批准。特遣艦隊已被命令前往我們的港口，等待重組。"
 SEA_PHI_political_events.57.desc.2: "$SEA_PHI_political_events.57.desc$同時，[371.GetName]的油田將開始為我們的部隊生產燃料，以支援此次重大擴編後的後勤需求。"
 SEA_PHI_political_events.57.a: "這對我們的軍事能力是極大的提升"
 SEA_PHI_political_events.58.t: "[FROM.GetName]拒絕移交艦隊"
 SEA_PHI_political_events.58.desc: "遺憾的是，我們的[FROM.GetAdjective]盟友拒絕了將其部分艦隊交由我們指揮的請求。看來若要為海戰做出貢獻，我們必須加快本國船塢的建設。"
 SEA_PHI_political_events.58.a: "我們必須專注於建設自己的海軍"
 SEA_PHI_political_events.59.t: "[USA.GetAdjective]干預失敗"
 SEA_PHI_political_events.59.desc: "[USA.GetNameDef]雖對[PHI.GetNameDef]發動軍事幹預，企圖推翻新政權，卻未能取得成果。隨著戰事陷入僵局，雙方都意識到持續的軍事衝突只會徒耗時間，轉而開啟和談進程。最終，[PHI.GetAdjective]的獨立地位也獲得了正式承認。"
 SEA_PHI_political_events.59.a: "自由得以守護"
 SEA_PHI_political_events.59.b: "戰爭不得民心了"
 SEA_PHI_political_events.60.t: "阿吉納爾多質疑選舉結果"
 SEA_PHI_political_events.60.desc: "在1935年總統大選塵埃落定後，[ROOT.GetNeutralLeader]仍未承認自己的慘敗，並就選舉事宜向負責選舉的委員會提出異議。如果發現有干預選舉的證據，該政黨可能會將此事提交至該國最高法院之一進行裁決。"
 SEA_PHI_political_events.60.a: "可能只是個輸不起的人"
 SEA_PHI_political_events.61.t: "司法部門推翻選舉"
 SEA_PHI_political_events.61.desc: "經深入調查後，負責審查1935年選舉結果的委員會聲稱發現違規證據。若非司法部門隨後採取的行動，此事本不會引發太大關注——司法部門取消了[ROOT.GetDemocraticParty]的參選資格，致使[ROOT.GetNeutralParty]獲勝。[USA.GetAdjective]試圖迅速否定這一流程，結果卻適得其反，此舉被視為進一步證實腐敗存在的證據。"
 SEA_PHI_political_events.61.a: "他們知道什麼對國家最好"
 SEA_PHI_political_events.62.t: "參加西班牙內戰的志願者？"
 SEA_PHI_political_events.62.desc: "我們與[SPR.GetNonIdeologyName]的歷史文化聯繫使得我國民眾密切關注著當地的衝突。"
 SEA_PHI_political_events.62.a: "國民黨人正在為捍衛我們的天主教價值觀而戰"
 SEA_PHI_political_events.62.b: "共和黨人正為自由和民主而戰"
 SEA_PHI_political_events.63.t: "[GetYear]年總統大選"
 SEA_PHI_political_events.63.desc: "現任總統[ROOT.GetLeader]的任期即將結束，下一任總統的選舉很快就要舉行。儘管[ROOT.GetLeader]執政期間的成就為其連任描繪了一幅充滿希望的圖景，但一些選民希望為我們的改革尋求新的方向，並推選一位新總統來引領他們。"
 SEA_PHI_political_events.63.keep_leader: "[ROOT.GetLeader]必須再有一個任期"
 SEA_PHI_political_events.63.roxas: "$PHI_manuel_roxas$的人脈關係將有助於推進經濟改革"
 SEA_PHI_political_events.63.laurel: "在這動盪時期，$PHI_jose_laurel$將成為一位合適的領導者"
 SEA_PHI_political_events.64.t: "$PHI_manuel_luis_quezon$之死"
 SEA_PHI_political_events.64.desc_quezon: "患上肺結核後，$PHI_manuel_luis_quezon$的健康狀況日益惡化，現已不幸病逝。在舉國哀悼之際，副總統已暫時接管奎松的職責，但不久後，就需要確定一位繼任者了。"
 SEA_PHI_political_events.64.desc_generic: "現任總統[ROOT.GetLeader]的任期已經結束，新一輪總統大選將決定我們的下一任總統。由於健康狀況惡化，$PHI_manuel_luis_quezon$已宣佈退出競選。"
 SEA_PHI_political_events.64.osmena: "$PHI_sergio_osmena$將穩住局面"
 SEA_PHI_political_events.65.t: "德懷特·D·艾森豪威爾留任[USA.GetName]"
 SEA_PHI_political_events.65.desc: "遺憾的是，我們要求加強[USA.GetAdjective]在[ROOT.GetNameDef]軍事顧問團的請求已被拒絕。顯然，[USA.GetNameDef]的其他軍事計劃需要他的專業知識。"
 SEA_PHI_political_events.65.a: "真是遺憾"
 SEA_PHI_political_events.66.t: "[FROM.GetName]提議簽署互助條約"
 SEA_PHI_political_events.66.desc: "作為處於[USA.GetAdjective]勢力範圍內的另一個國家，[FROM.GetNameDef]如今尋求通過建立拉美國家聯盟來加強該範圍內的合作。這或許能制衡[USA.GetAdjective]時而近乎帝國主義的壓力。"
 SEA_PHI_political_events.66.a: "這將有助於該地區的穩定"
 SEA_PHI_political_events.66.b: "我們不能疏遠[USA.GetNameDef]"
 SEA_PHI_political_events.67.t: "[FROM.GetName]簽署互助條約"
 SEA_PHI_political_events.67.desc: "[FROM.GetNameDefCap]已簽署我們提出的互助條約，該條約確立了一項有條件的聯盟並立即生效。這是加強[FROM.GetAdjective]與[ROOT.GetAdjective]間合作邁出的首個明確步驟。"
 SEA_PHI_political_events.67.a: "好消息"
 PHI_will_join_faction_later_tt: "§Y[ROOT.GetNameDefCap]§!將在完成§Y$PHI_war_of_independence$§!後加入§Y[FROM.GetNameDef]的陣營§!"
 PHI_will_join_faction_later_PHI_tt: "§Y[FROM.GetNameDefCap]§!將在完成§Y$PHI_war_of_independence$§!後加入§Y[ROOT.GetNameDef]的陣營§!"
 SEA_PHI_political_events.68.t: "[FROM.GetName]不簽署互助條約"
 SEA_PHI_political_events.68.desc: "由於意識形態差異，或許還有擔心疏遠[USA.GetNameDef]的顧慮，[FROM.GetNameDef]並未簽署我方提出的互助條約，看來我們得另尋盟友了。"
 SEA_PHI_political_events.68.a: "也許他們在該地區的對手會更願意合作"
 SEA_PHI_political_events.69.t: "[FROM.GetName]提議統一"
 SEA_PHI_political_events.69.desc: "自獨立以來，[FROM.GetNameDef]已採取諸多措施鞏固其獨立地位，並希望擴大與其他西班牙語國家的合作。這如今體現為一項提議，即讓我們國家與他們國家聯合，共同建立一個西班牙語帝國。"
 SEA_PHI_political_events.69.a: "我們可以共同為被殖民的歷史復仇"
 SEA_PHI_political_events.69.b: "我們不會接受[FROM.capital.GetCapitalVictoryPointName]的統治"
 SEA_PHI_political_events.70.t: "[FROM.GetName]接受統一"
 SEA_PHI_political_events.70.desc: "一撥撥[FROM.GetAdjective]代表對[ROOT.capital.GetCapitalVictoryPointName]的訪問已表明一切，數日後的公告正式確認：[FROM.GetNameDef]已接受與[ROOT.GetNameDef]統一的請求。"
 SEA_PHI_political_events.70.a: "好消息！"
 SEA_PHI_political_events.71.t: "[FROM.GetName]拒絕統一"
 SEA_PHI_political_events.71.desc: "[FROM.GetNameDefCap]已決定拒絕我們的統一提案。儘管對方表示重視我們的同盟關係，但仍認為此舉過於激進。"
 SEA_PHI_political_events.71.a: "那麼，或許我們之間的分歧比我們想像的要大。"
 SEA_PHI_political_events.71.b: "我們必須堅持"
