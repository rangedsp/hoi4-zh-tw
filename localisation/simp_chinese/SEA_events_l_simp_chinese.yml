 SEA_imperial_influence_events.1.t: "內部權力鬥爭爆發"
 SEA_imperial_influence_events.1.desc: "[ROOT.GetNameDef]內部各派系爆發激烈權力鬥爭，各方都試圖爭取[GetImperialInfluenceRulerTitle]的支持，將[GetImperialInfluenceGenderHimHer]拉攏至己方陣營。每個人都在思考的問題是：[GetImperialInfluenceRulerTitle]最終會青睞哪個派系，又會忽視哪個派系？"
