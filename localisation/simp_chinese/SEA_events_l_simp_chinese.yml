l_simp_chinese:
 ###################
 ###### JAPAN ######
 ###################
 SEA_japan.1.t: "二二六事件"
 SEA_japan.1.desc: "以“帝國精神受到威脅”為由，大日本帝國陸軍中忠於皇道派的年輕軍官組織了政變，旨在清洗政府與軍隊領導層中反對其軍國主義與“天皇直接統治”思想的人。他們已包圍多名高級官員住宅，並佔領了東京高官的宅邸。然而，儘管叛軍希望天皇支持他們，陛下依然保持沉默。此事件將如何發展？"
 SEA_japan.1.a: "現在就終結這場鬧劇！"
 JAP_kodoha_coup_will_fail_historically_tt: "我們將宣佈戒嚴，並動用日本帝國海軍的橫須賀聯隊鎮壓叛亂。目前傷亡最小，但部分皇道派的目標人物已被證實死亡："
 SEA_japan.1.b: "是時候迴歸傳統了！"
 JAP_kodoha_coup_will_succeed_tt: "皇道派將控制陸軍省、帝國飯店、國會大廈以及皇宮。其關鍵暗殺目標多人已被證實死亡："
 SEA_japan.1.c: "必須管束軍方！"
 JAP_kodoha_coup_will_fail_non_historically_tt: "我們將宣佈戒嚴，並嘗試通過東京警視廳特勤部隊鎮壓叛亂，儘量減少軍方介入清算皇道派。報告稱傷亡較小，但部分目標已被證實死亡："
 SEA_japan.1.d: "必須管束軍方！" # Intentional
 SEA_japan.1.e: "人民必須認識到自己正被全面操控！"
 SEA_japan_foreign_policy.1.t: "[FROM.GetNameDefCap]要求我們屈服"
 SEA_japan_foreign_policy.1.desc: "[FROM.GetNameDef]的關東軍首領要求我們投降。不過，他們也提出了一個建議：如果我們加入他們，他們將幫助我們重奪蒙古舊地，並允許我們在其主導下建立一個新的蒙古帝國。我們應如何回應？"
 SEA_japan_foreign_policy.1.a: "這是我們的機會！"
 SEA_japan_foreign_policy.1.b: "我們必須不惜一切代價維護獨立！"
 MEN_li_shouxin_available_tt: "§Y李守信§!成為可用的§Y陸軍將領§!"
 SEA_japan_foreign_policy.2.t: "[FROM.GetNameDefCap]屈服於我們的統治"
 SEA_japan_foreign_policy.2.desc: "[FROM.GetLeader]退位，將[FROM.GetAdjective]的寶座讓給我們支持的德王。該地區已被我們佔領，政府改組將很快進行。"
 SEA_japan_foreign_policy.2.a: "天皇陛下聞之必定欣慰"
 SEA_japan_foreign_policy.3.t: "[FROM.GetNameDefCap]拒絕向天皇屈服"
 SEA_japan_foreign_policy.3.desc: "[FROM.GetLeader]拒絕了我們的要求，哪怕他親眼見過尼冠洲如何因反對天皇而喪命。也許，是時候給他們上一課了。"
 SEA_japan_foreign_policy.3.a: "他們褻瀆天皇，此事絕不可容忍！"
 SEA_japan_foreign_policy.3.b: "我們本來也不需要他們"
 SEA_japan_foreign_policy.4.t: "[FROM.GetNameDefCap]要求我們加入他們的同盟"
 SEA_japan_foreign_policy.4.desc: "[FROM.GetAdjective]代表團前來，要求我們加入他們主導的亞洲統一戰爭，並參與現在與未來的一切戰爭。他們似乎不願接受拒絕，但我們加入真的有利可圖嗎？"
 SEA_japan_foreign_policy.4.a: "團結使我們更強大"
 SEA_japan_foreign_policy.4.b: "這違背了我們的中立原則！"
 SEA_japan_foreign_policy.4.c: "我們正處於戰爭！請他們等等"
 SEA_japan_foreign_policy.4.c_tt: "我們將被要求在有限戰爭結束後作出回應"
 SEA_japan_foreign_policy.5.t: "[FROM.GetNameDefCap]接受了我們的提議"
 SEA_japan_foreign_policy.5.desc: "[FROM.GetLeader]展現了理智，[FROM.GetNameDef]方面正式簽署了文件，加入了我們的陣營。今日，值得慶賀！"
 SEA_japan_foreign_policy.5.a: "他們理應如此"
 SEA_japan_foreign_policy.6.t: "[FROM.GetNameDefCap]拒絕加入我們"
 SEA_japan_foreign_policy.6.desc: "[FROM.GetLeader]喪失理智，拒絕讓[FROM.GetNameDef]加入我們的聯盟。他不知的是，我們根本不打算在即將到來的世界大戰中容許中立的存在……"
 SEA_japan_foreign_policy.6.a: "準備部隊，發動進攻！"
 SEA_japan_foreign_policy.7.t: "[FROM.GetNameDefCap]正在準備入侵"
 SEA_japan_foreign_policy.7.desc: "[FROM.GetAdjective]軍隊不願接受拒絕的答覆，他們正在準備迅速入侵我國，可能意圖迅速進駐並征服我們，將我們納入他們的勢力範圍。這或許是我們避免衝突的最後機會，但問題依然存在。我們要接受嗎？"
 SEA_japan_foreign_policy.7.a: "仔細想了想，我們現在就投降吧"
 SEA_japan_foreign_policy.7.b: "那就讓他們放馬過來吧！"
 SEA_japan_foreign_policy.8.t: "[FROM.GetNameDefCap]屈從於我們的要求"
 SEA_japan_foreign_policy.8.desc: "經過長時間談判，[FROM.GetNameDef]的代表最終簽署了我們修訂後的文件，避免了軍事幹預，但也喪失了獨立。我們已整裝待發，準備向南進軍！"
 SEA_japan_foreign_policy.8.a: "秩序恢復了"
 SEA_japan_foreign_policy.9.t: "[FROM.GetLeader]拒絕屈服"
 SEA_japan_foreign_policy.9.desc: "我們給予[FROM.GetLeader]的最後機會被拒絕。我們的軍隊已整裝待發，準備迅速佔領他們的主要城市。現在就該讓他們見識見識[ROOT.GetAdjective]民族的力量！"
 SEA_japan_foreign_policy.9.a: "天皇陛下萬歲！"
 SEA_japan_foreign_policy.10.t: "[FROM.GetNameDefCap]要求佔領[671.GetName]"
 SEA_japan_foreign_policy.10.desc: "[FROM.GetNameDef]派出的代表團向我們遞交最後通牒，要求我們在一週內撤出駐紮在越南東京區域的部隊，允許他們在該地區建立軍事基地。他們宣稱此舉是為了防止中國威脅[VIN.GetAdjective]主權，但我們知道這背後的真正目的……"
 SEA_japan_foreign_policy.10.a: "不值得為之開戰"
 SEA_japan_foreign_policy.10.b: "我們決不會交出它！"
 SEA_japan_foreign_policy.11.t: "[FROM.GetNameDefCap]移交[671.GetName]"
 SEA_japan_foreign_policy.11.desc: "[FROM.GetNameDef]的領導層展現了理智，開始從越南的東京撤軍，使我們能在該地建立安全區，防止中國軍隊進入[VIN.GetAdjective]領土。勝利屬於我們！"
 SEA_japan_foreign_policy.11.a: "這對[ROOT.GetAdjective]人民來說是偉大的一天"
 SEA_japan_foreign_policy.12.t: "[From.GetNameDefCap]拒絕了我們的要求"
 SEA_japan_foreign_policy.12.desc: "[FROM.GetNameDef]的領導層拒絕妥協，表示他們不會在印度支那問題上讓出哪怕一寸土地。這將嚴重阻礙我們向南擴張……我們該接受現實，還是時候出兵懲戒西方了？"
 SEA_japan_foreign_policy.12.a: "他們會後悔自己的決定！"
 SEA_japan_foreign_policy.12.b: "我們必須放棄這一計劃"
 SEA_japan_foreign_policy.13.t: "[FROM.GetNameDefCap]佔領了[721.GetName]！"
 SEA_japan_foreign_policy.13.desc: "\n本週早些時候，[JAP.GetNameDef]部隊進入並佔領了我們位於[721.GetName]的領土，聲稱其任務是保護該地區免遭敵人佔領。這顯然是一種戰爭行為，但我們可能選擇對此視而不見，畢竟目前我們無力與其開戰。"
 SEA_japan_foreign_policy.13.a: "不值得為之開戰"
 SEA_japan_foreign_policy.13.b: "他們以為自己是誰？"
 SEA_japan_foreign_policy.14.t: "[FROM.GetNameDefCap]重組了我們的政府"
 SEA_japan_foreign_policy.14.desc: "協助建立我國的[FROM.GetAdjective]行政人員決定此時重組我們的政府架構並重塑法律體系。從長遠來看，這將加強我們的國家，我們沒有理由拒絕。"
 SEA_japan_foreign_policy.14.a: "很好"
 SEA_japan_foreign_policy.15.t: "[FROM.GetNameDefCap]要求佔領[729.GetName]"
 SEA_japan_foreign_policy.15.desc: "以該城市可能成為敵人進攻的跳板為藉口，駐守[592.GetName]地區的[FROM.GetAdjective]部隊向我們下達最後通牒：要麼允許他們進駐，並賦予他們全權管理城市的權限，要麼面對[FROM.GetAdjective]全部軍隊的進攻。我們該如何抉擇？"
 SEA_japan_foreign_policy.15.a: "不值得為之開戰"
 SEA_japan_foreign_policy.15.b: "我們決不會交出它！"
 SEA_japan_foreign_policy.16.t: "[FROM.GetNameDefCap]移交了[729.GetName]"
 SEA_japan_foreign_policy.16.desc: "[729.GetName]地區的行政官員決定允許我們的部隊進駐，意識到抵抗終將徒勞。我們的人民歡欣鼓舞，又一西方列強被逐出東亞！"
 SEA_japan_foreign_policy.16.a: "這對[ROOT.GetAdjective]人民來說是偉大的一天"
 SEA_japan_foreign_policy.17.t: "[From.GetNameDefCap]拒絕了我們的要求"
 SEA_japan_foreign_policy.17.desc: "[729.GetName]的地區行政官竟忘了自己的身份，拒絕了我們駐[592.GetName]長官提出的要求。現在，是時候徹底摧毀[FROM.GetAdjective]帝國了！"
 SEA_japan_foreign_policy.17.a: "他們會後悔自己的決定！"
 SEA_japan_foreign_policy.17.b: "我們必須放棄這一計劃"
 SEA_japan_foreign_policy.18.t: "[FROM.GetNameDefCap]邀請我們加入其同盟"
 SEA_japan_foreign_policy.18.desc: "遠道而來的一個代表團最近抵達我國首都，請求陛下接見。他們聲稱來自[FROM.GetNameDef]，希望與我們結盟。我們是否接受？"
 SEA_japan_foreign_policy.18.a: "團結使我們更強大"
 SEA_japan_foreign_policy.18.b: "這違背了我們的中立原則……"
 SEA_japan_foreign_policy.19.t: "[FROM.GetNameDefCap]接受了我們的邀請"
 SEA_japan_foreign_policy.19.desc: "[FROM.GetLeader]欣然接受了我們的結盟提議，並已開始著手融入我們的勢力圈。今日值得慶祝！"
 SEA_japan_foreign_policy.19.a: "他們知道對他們而言什麼才是最好的"
 SEA_japan_foreign_policy.20.t: "[FROM.GetNameDefCap]拒絕加入我們"
 SEA_japan_foreign_policy.20.desc: "[FROM.GetLeader]粗魯地拒絕了我們結盟的提議，稱這有悖於他們的中立原則。我們只能想像，這背後有多少腐敗行為造成了這一錯誤的決定。"
 SEA_japan_foreign_policy.20.a: "這是他們的損失"
 SEA_japan_foreign_policy.21.t: "[FROM.GetNameDefCap]進一步重組了我們的政府"
 SEA_japan_foreign_policy.21.desc: "我們的仁慈宗主[FROM.GetNameDef]最終決定承認我們是真正的蒙古國家，並提議再次重組我們的政府與機構，以推動這一政策轉變。今天是[ROOT.GetAdjective]人民值得銘記的一天！"
 SEA_japan_foreign_policy.21.a: "如果這是他們所希望的"
 SEA_japan_foreign_policy.22.t: "發現疑似[FROM.GetAdjective]特工"
 SEA_japan_foreign_policy.22.desc: "在我國境內發現了疑似受[FROM.GetAdjective]支配的特工，似乎在試圖接觸貴族，並以“大東亞共榮”的承諾引誘我們的公民。我們應如何應對？"
 SEA_japan_foreign_policy.22.a: "他們不會造成任何傷害，隨他們吧"
 SEA_japan_foreign_policy.22.b: "我們必須加強國家安全！"
 SEA_japan_foreign_policy.23.t: "[FROM.GetNameDefCap]正在影響我們的人民"
 SEA_japan_foreign_policy.23.desc: "[FROM.GetAdjective]特工已開始在拉薩傳播泛亞洲主義宣傳，並向當地貴族偷偷注資。局勢似乎即將失控……"
 SEA_japan_foreign_policy.23.a: "他們被共榮圈所吸引……"
 SEA_japan_foreign_policy.24.t: "[FROM.GetNameDefCap]與土登貢培建立了聯繫"
 SEA_japan_foreign_policy.24.desc: "據我方軍官報告，[FROM.GetAdjective]特工似乎已成功與土登貢培建立聯繫。後者被稱為西藏實權者，權勢極大。從今往後，局勢恐怕只會更糟……"
 SEA_japan_foreign_policy.24.a: "他們在策劃什麼……"
 SEA_japan_foreign_policy.25.t: "[FROM.GetNameDefCap]武裝了西藏革命黨"
 SEA_japan_foreign_policy.25.desc: "西藏革命黨是一個流亡於英屬印度的政黨，效忠於土登貢培。近期，他們收到了不明來源的武器包裹。看來他們可能正準備從境外發動政變。"
 SEA_japan_foreign_policy.25.a: "形勢有點失控了！"
 SEA_japan_foreign_policy.26.t: "實權者的政變"
 SEA_japan_foreign_policy.26.desc: "終於，這一天到來了。今日清晨，土登貢培率武裝支持者進軍拉薩，聲稱我政府腐敗、非法，並表示[ROOT.GetNameDef]加入[FROM.GetAdjective]共榮圈將更有前途。我們是接受他的要求，還是奮起一搏？"
 SEA_japan_foreign_policy.26.a: "或許他是對的"
 SEA_japan_foreign_policy.26.b: "打敗他們！"
 SEA_japan_foreign_policy.27.t: "[FROM.GetNameDefCap]支持泛蒙古宣稱"
 SEA_japan_foreign_policy.27.desc: "這一天終於到來了，我們可以發起軍事行動，奪取目前由非法的懦夫[MON.GetLeader]統治的外蒙古了。是時候讓世界知道成吉思汗的精神永存了！"
 SEA_japan_foreign_policy.27.a: "確實是偉大的一天"
 SEA_japan_foreign_policy.28.t: "[FROM.GetNameDefCap]交出蒙古領土"
 SEA_japan_foreign_policy.28.desc: "在合法佔領蒙古的土地後，我們的宗主國[FROM.GetNameDef]遵守承諾，將領地的行政機構移交給了我們。非常感謝他們對我們的信任！"
 SEA_japan_foreign_policy.28.a: "太棒了"
 SEA_japan_foreign_policy.29.t: "綏遠戰役的結果"
 SEA_japan_foreign_policy.29.desc: "綏遠戰役結束了，新的邊界已經劃定。這也許是我們的附屬國最後一次在沒有中國中央政府參與的情況下發動這樣的入侵，他們現在對我們在該地區的行動已保持高度警惕。"
 SEA_japan_foreign_policy.29.a: "至少我們現在可以專注於其他地區了"
 SEA_japan_foreign_policy.30.t: "綏遠戰役的結束"
 SEA_japan_foreign_policy.30.desc: "終於，[JAP.GetNameDef]和其傀儡政權的猛烈進攻終止了，他們的軍隊在後撤。目前尚不清楚這一天是否會被歷史銘記，但至少南京政府意識到了[JAP.GetAdjective]對該地區的野心。"
 SEA_japan_foreign_policy.30.a: "又處理掉一項威脅"
 SEA_japan_foreign_policy.31.t: "偽軍進攻我們的土地！"
 SEA_japan_foreign_policy.31.desc: "隸屬於[MEN.GetNameDef]和大漢義軍的部隊進攻了綏遠，似乎是想佔領我們在內蒙古的土地。我們決不能讓他們通過！"
 SEA_japan_foreign_policy.31.a: "讓他們見識一下我們的厲害"
 SEA_japan_foreign_policy.32.t: "日本尋求合作對抗共產主義威脅"
 SEA_japan_foreign_policy.32.desc: "[FROM.GetAdjective]外交官的對外政策出現了一百八十度的轉彎。現在他們表示希望與我們建立更親密的關係，只要我們能打壓共產主義和反日情緒。這筆交易有些可疑，但也許值得冒險？"
 SEA_japan_foreign_policy.32.a: "我們可以保證"
 SEA_japan_foreign_policy.32.b: "我們不會和[JAP.GetAdjective]交易"
 CHI_accepted_JAP_demands_to_suppress_communism_and_more_flag: "中國選擇配合我們的要求"
 SEA_japan_foreign_policy.33.t: "[FROM.GetLeader]接受我們的要求"
 SEA_japan_foreign_policy.33.desc: "[FROM.GetNameDef]的領袖[FROM.GetLeader]接受了我們的提議，承諾禁止對我國的抗議，同時準備鎮壓他們國內的共產主義活動。很快，我們將可以與他們正式結盟，這樣，我們就可以除掉有可能導致整個亞洲走向滅亡的爛瘡。"
 SEA_japan_foreign_policy.33.a: "我們邁出了第一步"
 SEA_japan_foreign_policy.34.t: "[FROM.GetLeader]拒絕我們的要求"
 SEA_japan_foreign_policy.34.desc: "[FROM.GetNameDef]的領袖[FROM.GetLeader]認為[FROM.GetAdjective]民眾不應受到懲罰，並拒絕了我們的慷慨提議，看來我們必須終結[FROM.GetAdjective]了。"
 SEA_japan_foreign_policy.34.a: "他們會後悔自己的決定"
 SEA_japan_foreign_policy.35.t: "[FROM.GetNameDefCap]散佈親[FROM.GetAdjective]思潮"
 SEA_japan_foreign_policy.35.desc: "西海岸的多個廣播電臺開始播放[FROM.GetAdjective]的宣傳廣播，試圖影響我民眾在亞洲戰爭中的立場。我們必須立即關閉這些廣播，防止事態惡化！"
 SEA_japan_foreign_policy.35.a: "他們怎敢如此！"
 SEA_japan_foreign_policy.36.t: "[FROM.GetNameDefCap]散佈親[FROM.GetAdjective]思潮"
 SEA_japan_foreign_policy.36.desc: "隸屬於[FROM.GetNameDef]的廣播電臺已開始在我國播放親[FROM.GetAdjective]宣傳內容。[FROM.GetAdjective]政府甚至還提出要投資我國工業，作為我們允許其廣播持續運作的交換條件。"
 SEA_japan_foreign_policy.36.a: "我們可以利用他們的友誼"
 SEA_japan_foreign_policy.36.b: "立即打壓這種荒唐行徑！"
 SEA_japan_foreign_policy.37.t: "[FROM.GetNameDefCap]允許我們傳播影響力"
 SEA_japan_foreign_policy.37.desc: "[FROM.GetLeader]決定接受我們的提議，允許我們的電臺繼續在[FROM.GetAdjective]領土播音，也允許我們的工業家在當地設立企業。"
 SEA_japan_foreign_policy.37.a: "一切正如我們所預料"
 SEA_japan_foreign_policy.38.t: "[FROM.GetNameDefCap]阻止我們的影響擴散"
 SEA_japan_foreign_policy.38.desc: "[FROM.GetLeader]拒絕了我們干涉[FROM.GetNameDef]內政的行為，聲稱他們的獨立性比泛亞理想更為重要。"
 SEA_japan_foreign_policy.38.a: "他們會知道這意味著什麼"
 SEA_japan_foreign_policy.39.t: "[FROM.GetAdjective]對我們的自然資源開展投資"
 SEA_japan_foreign_policy.39.desc: "[FROM.GetNameDef]的[FROM.GetLeader]批准了對我國自然資源的投資，[FROM.GetAdjective]公司已經開始在我境內展開業務。"
 SEA_japan_foreign_policy.39.a: "這背後一定另有圖謀"
 SEA_japan_foreign_policy.40.t: "關於東亞共榮的疑問"
 SEA_japan_foreign_policy.40.desc: "隨著“大東亞共榮圈”的建立，一個關鍵問題隨之浮現：我們是否應追求所承諾的亞洲共同繁榮，還是更應直接掌控亞洲、獲取我們應得之物？"
 SEA_japan_foreign_policy.40.a: "天皇至高無上，必須優先！"
 SEA_japan_foreign_policy.40.b: "我們必須追求所有亞洲國家的共同繁榮！"
 SEA_japan_foreign_policy.41.t: "宣撫"
 SEA_japan_foreign_policy.41.desc: "宣撫的設立旨在增強我們對大陸領地的控制，並正在提高當地的順從度。也許該是時候賦予他們更多行政職責，好好發揮他們的作用了？"
 SEA_japan_foreign_policy.41.a: "我們應立即採用此策略！"
 SEA_japan_foreign_policy.41.b: "等待下決定的時機也許更明智"
 apply_senbu_law_tt: "應用 §Y宣撫§!佔領法於所有適用的佔領地"
 SEA_japan_foreign_policy.42.t: "中日同盟"
 SEA_japan_foreign_policy.42.desc: "[FROM.GetLeader]宣稱我兩國有共同的命運，只有並肩而行才能根除共產主義威脅。為此，他們向我們提出結盟提議，雖為臨時性協議，我們是否應當接受？"
 SEA_japan_foreign_policy.42.a: "這符合我們的最佳利益"
 SEA_japan_foreign_policy.42.b: "這聽起來很可疑"
 SEA_japan_foreign_policy.43.t: "[FROM.GetLeader]簽署條約"
 SEA_japan_foreign_policy.43.desc: "我國人民歡欣鼓舞，[FROM.GetAdjective]國家已與我們聯手，共同對抗威脅亞洲穩定的最大敵人——共產主義。儘管這一盟約只是暫時的，它必將為我們帶來重大利益。"
 SEA_japan_foreign_policy.43.a: "太棒了"
 SEA_japan_foreign_policy.44.t: "[FROM.GetLeader]拒絕簽署條約"
 SEA_japan_foreign_policy.44.desc: "[FROM.GetNameDef]的愚蠢的[FROM.GetLeader]拒絕了我們偉大的提案，同盟被取消，關東軍再次盯上了華北。或許我們應調整對外政策。"
 SEA_japan_foreign_policy.44.a: "沒辦法"
 SEA_japan_foreign_policy.45.t: "[FROM.GetNameDefCap]要求經濟一體化"
 SEA_japan_foreign_policy.45.desc: "[FROM.GetNameDef]的[FROM.GetLeader]今天抵達我們的首都，向我們提出了一項提議。他們希望我們進一步加強與他們的經濟一體化。這將大大有利於我們的經濟，但這一切似乎有些不對勁……"
 SEA_japan_foreign_policy.45.a: "這實在太誘人了，不可錯過"
 SEA_japan_foreign_policy.45.b: "我們不會放棄經濟獨立！"
 SEA_japan_foreign_policy.46.t: "[FROM.GetNameDefCap]接受我方提議"
 SEA_japan_foreign_policy.46.desc: "[FROM.GetNameDef]的[FROM.GetLeader]對我們的提議表示贊同，他們的外交官已經抵達我們的國家，簽署了必要文件，以促進進一步的經濟一體化。"
 SEA_japan_foreign_policy.46.a: "我們感謝他們的天真"
 SEA_japan_foreign_policy.47.t: "[FROM.GetNameDefCap]拒絕我們的提議"
 SEA_japan_foreign_policy.47.desc: "[FROM.GetNameDef]的[FROM.GetLeader]對我們的一體化邀請表示強烈不滿，並聲稱兩國之間任何形式的更緊密的經濟合作都將永遠不可能實現。或許他們看出了我們計劃中的意圖……"
 SEA_japan_foreign_policy.47.a: "壞消息……"
 SEA_japan_foreign_policy.48.t: "[FROM.GetNameDefCap]發展我國工業"
 SEA_japan_foreign_policy.48.desc: "[FROM.GetNameDef]的實業家開始發展我國本土工業，並在我國設立新企業。這無疑將推動我們的繁榮。"
 SEA_japan_foreign_policy.48.a: "繁榮在望！"
 SEA_japan_foreign_policy.49.t: "維新政府公告"
 SEA_japan_foreign_policy.49.desc: "今天，在上海，[ROOT.GetLeader]與日本帝國的將領和官員一起發佈公告，宣佈建立新中國政府，這是比腐敗的國民黨政府更好的選擇。中華民國萬歲！"
 SEA_japan_foreign_policy.49.a: "繁榮在望！"
 SEA_japan_foreign_policy.50.t: "[FROM.GetNameDefCap]要求全面整合"
 SEA_japan_foreign_policy.50.desc: "整合我們的經濟顯然不足以滿足[FROM.GetAdjective]人，[FROM.GetNameDef]的[FROM.GetLeader]今天要求我們完全併入他們的國家。如果我們現在不立即與他們決裂，這將標誌著我們作為獨立國家的地位終結。我們應該如何應對？"
 SEA_japan_foreign_policy.50.a: "我們只能接受這種情況"
 SEA_japan_foreign_policy.50.b: "不勝即亡！"
 SEA_japan_foreign_policy.51.t: "[FROM.GetNameDefCap]接受全面整合"
 SEA_japan_foreign_policy.51.desc: "[FROM.GetNameDef]的領導層同意併入我們的國家，今天早些時候，國民議會對此令人振奮的消息報以熱烈的掌聲。我們提出的條件顯然足以讓他們認為這一提議對他們有利，儘管這意味著他們的主權的終結。"
 SEA_japan_foreign_policy.51.a: "非常好！"
 SEA_japan_foreign_policy.52.t: "[FROM.GetNameDefCap]拒絕全面整合"
 SEA_japan_foreign_policy.52.desc: "儘管有顯而易見的優勢，而且明顯對亞洲的未來最為有利，但[FROM.GetNameDef]還是拒絕了我們善意提出的全面整合提議。我們只能猜測他們的理由，但看來他們可能並不關心地區的最佳利益。"
 SEA_japan_foreign_policy.52.a: "他們是亞洲統一的隱患！"
 SEA_japan_foreign_policy.52.b: "我們將密切關注他們"
 SEA_japan_foreign_policy.53.t: "在車臣汗發現顛覆分子"
 SEA_japan_foreign_policy.53.desc: "在車臣汗境內發現疑似受[FROM.GetAdjective]操控的特工，正試圖接觸貴族，向民眾宣傳共榮圈的美好前景。他們似乎對蒙古人民另有圖謀。"
 SEA_japan_foreign_policy.53.a: "我們必須保持警惕！"
 SEA_japan_foreign_policy.54.t: "[FROM.GetAdjective]武器充斥黑市"
 SEA_japan_foreign_policy.54.desc: "最近，大量[FROM.GetNameDef]的武器流入我國黑市，其中不少已落入異見分子和顛覆分子手中。他們似乎想要破壞我國穩定，甚至可能意圖推翻政府！"
 SEA_japan_foreign_policy.54.a: "他們正在武裝政治異見分子！"
 SEA_japan_foreign_policy.55.t: "傳聞內蒙古軍隊即將入侵"
 SEA_japan_foreign_policy.55.desc: "內蒙古軍隊正在我國南部邊境集結，可能正在準備一次軍事入侵，儘管他們的具體目標仍不明確。"
 SEA_japan_foreign_policy.55.a: "生死關頭，準備迎戰！"
 SEA_japan_foreign_policy.56.t: "滿洲游擊隊現身東部"
 SEA_japan_foreign_policy.56.desc: "在巴彥圖門及我國東部多個地區發現滿洲游擊隊。目前他們不過是些土匪，但時間一長將成心腹大患。"
 SEA_japan_foreign_policy.56.a: "生死關頭，準備迎戰！"
 SEA_japan_foreign_policy.57.t: "[FROM.GetAdjective]施壓要求我們屈服"
 SEA_japan_foreign_policy.57.desc: "今日早些時候，[FROM.GetAdjective]政府向我們下達最後通牒，要求我們屈服，否則將滅我國。然而我們知道他們真正的圖謀，也許抵抗才是上策。"
 SEA_japan_foreign_policy.57.a: "我們打不過他們"
 SEA_japan_foreign_policy.57.b: "我們必須保衛革命！"
 MON_japan_starts_a_popular_civil_war_tt: "日本將發動民族內戰反對我們的政府，並可能直接干預其內政"
 SEA_japan_foreign_policy.58.t: "[FROM.GetNameDefCap]交出中國地區"
 SEA_japan_foreign_policy.58.desc: "我們的[FROM.GetAdjective]宗主將多個原國民黨控制地區移交給我們管理，要求我們開始將這些土地正式整合入我國。我們絕不會讓他們失望！"
 SEA_japan_foreign_policy.58.a: "太棒了"
 SEA_japan_foreign_policy.59.t: "緬甸國公告"
 SEA_japan_foreign_policy.59.desc: "今天早些時候，[ROOT.GetLeader]和各[JAP.GetAdjective]軍官發表聯合公告，宣佈建立新[ROOT.GetAdjective]國家。我們將戰勝所有敵人！"
 SEA_japan_foreign_policy.59.a: "繁榮在望！"
 SEA_japan_foreign_policy.60.t: "日本建立緬甸國"
 SEA_japan_foreign_policy.60.desc: "[JAP.GetLeader]宣佈成立一個新[ROOT.GetAdjective]國家，與我們當前路線背道而馳。他們似乎準備為從我國獨立出去而戰，並且絕不會輕易放棄！"
 SEA_japan_foreign_policy.60.a: "擊退他們，除掉所有叛徒！"
 SEA_japan_foreign_policy.60.b: "我們必須加入他們，繁榮在望！"
 SEA_japan_foreign_policy.61.t: "汪精衛的背叛"
 SEA_japan_foreign_policy.61.desc: "上週，叛徒汪精衛離開了住所，去向不明。回顧過往，他對[ROOT.GetLeader]政策的不滿似乎早已昭然若揭。但他不會被懷念。"
 SEA_japan_foreign_policy.61.a: "早就知道"
 SEA_japan_foreign_policy.61.b: "也許他是對的……"
 SEA_japan_foreign_policy.62.t: "汪精衛來投"
 SEA_japan_foreign_policy.62.desc: "作為國民黨前高級成員，他的地位與影響力不容忽視，或許應給他一個政府職位，讓他為我等所用。"
 SEA_japan_foreign_policy.62.a: "他會成為強大的領袖"
 SEA_japan_foreign_policy.62.b: "孫殿英能力更強"
 SEA_japan_foreign_policy.63.t: "與[RNG.GetNameDef]合併"
 SEA_japan_foreign_policy.63.desc: "[JAP.GetLeader]要求我們的政府與[RNG.GetNameDef]合併，放棄我們的獨立，並給予我們的領導層[RNG.GetAdjective]政府中的高級職位。我們要接受嗎？"
 SEA_japan_foreign_policy.63.a: "[ROOT.GetLeader]會獲得一個好位子，所以我們同意"
 SEA_japan_foreign_policy.63.b: "這會成為我們自治的終結，不行！"
 SEA_japan_foreign_policy.64.t: "[FROM.GetNameDefCap]與我們合併"
 SEA_japan_foreign_policy.64.desc: "[FROM.GetNameDef]的[FROM.GetLeader]同意了[JAP.GetAdjective]的提議，與我們的政府合併，[FROM.GetAdjective]的土地現在完全由我們管轄。真是美好的一天！"
 SEA_japan_foreign_policy.64.a: "我們看到了他們接受的理由"
 SEA_japan_foreign_policy.65.t: "[FROM.GetNameDefCap]拒絕合併"
 SEA_japan_foreign_policy.65.desc: "膚淺的[FROM.GetLeader]毫無理性，拒絕了與[RNG.GetNameDef]合併的提議。也許我們可以提出一份更好的方案，亦或者提出適當的恐嚇。"
 SEA_japan_foreign_policy.65.a: "他們遲早會同意……"
 SEA_japan_foreign_policy.66.t: "自由印度臨時政府公告"
 SEA_japan_foreign_policy.66.desc: "今天早些時候，[ROOT.GetLeader]和各[JAP.GetAdjective]軍官發表聯合公告，宣佈建立新[ROOT.GetAdjective]國家。我們將戰勝所有敵人！"
 SEA_japan_foreign_policy.66.a: "繁榮在望！"
 SEA_japan_foreign_policy.67.t: "日本建立自由印度臨時政府"
 SEA_japan_foreign_policy.67.desc: "[JAP.GetLeader]宣佈成立一個新[ROOT.GetAdjective]國家，與我們當前路線背道而馳。他們似乎準備為從我國獨立出去而戰，並且絕不會輕易放棄！"
 SEA_japan_foreign_policy.67.a: "擊退他們，除掉所有叛徒！"
 SEA_japan_foreign_policy.67.b: "我們必須加入他們，繁榮在望！"
 SEA_japan_foreign_policy.68.t: "菲律賓第二共和國公告"
 SEA_japan_foreign_policy.68.desc: "今天早些時候，[ROOT.GetLeader]和各[JAP.GetAdjective]軍官發表聯合公告，宣佈建立新[ROOT.GetAdjective]國家。我們將戰勝所有敵人！"
 SEA_japan_foreign_policy.68.a: "繁榮在望！"
 SEA_japan_foreign_policy.69.t: "日本建立菲律賓第二共和國"
 SEA_japan_foreign_policy.69.desc: "[JAP.GetLeader]宣佈成立一個新[ROOT.GetAdjective]國家，與我們當前路線背道而馳。他們似乎準備為從我國獨立出去而戰，並且絕不會輕易放棄！"
 SEA_japan_foreign_policy.69.a: "擊退他們，除掉所有叛徒！"
 SEA_japan_foreign_policy.69.b: "我們必須加入他們，繁榮在望！"
 SEA_japan_foreign_policy.70.t: "日本要求我們有條件投降"
 SEA_japan_foreign_policy.70.desc: "[FROM.GetAdjective]外交官向我們發出最後通牒，要求我們重新劃定東方邊界，並與他們簽署有條件的和平協議，基本上放棄亞洲事務。這將使我們能集中全部精力奪回歐洲土地，也許我們能在其他所有敵人都失敗後重新奪回東方。"
 SEA_japan_foreign_policy.70.a: "我們決不投降！"
 SEA_japan_foreign_policy.70.b: "那我們就可以少一個敵人了"
 SEA_japan_foreign_policy.71.t: "[FROM.GetNameDefCap]拒絕投降"
 SEA_japan_foreign_policy.71.desc: "莫斯科的蠢貨們拒絕了我們最初的要求。這意味著必須徹底摧毀他們的國家，甚至重新劃定比原先計劃更為激進的邊界！"
 SEA_japan_foreign_policy.71.a: "他們將倒在我們劍下！"
 SEA_japan_foreign_policy.72.t: "[FROM.GetNameDefCap]交出東方土地"
 SEA_japan_foreign_policy.72.desc: "[FROM.GetLeader]的代表夾著尾巴同意了我們的要求，交出了西伯利亞的土地。今天是帝國偉大的一天！"
 SEA_japan_foreign_policy.72.a: "我們贏得了這一天！"
 SEA_japan_foreign_policy.73.t: "[SOV.GetNameDefCap]撤出西伯利亞"
 SEA_japan_foreign_policy.73.desc: "我們的盟友屈服於[JAP.GetNameDef]的要求，撤出了東亞。這使我們落入了危險的境地。我們是要尋找新盟友，還是繼續對抗[JAP.GetAdjective]？"
 SEA_japan_foreign_policy.73.a: "他們拋棄了我們……"
 SEA_japan_foreign_policy.73.b: "那我們必須獲得日本的保護來替代他們！"
 SEA_japan_foreign_policy.74.t: "[FROM.GetNameDefCap]尋求我們的保護"
 SEA_japan_foreign_policy.74.desc: "[FROM.GetNameDef]的領導人[FROM.GetLeader]對[FROM.GetName]的舊盟友的背叛感到失望，現已向我們請求，希望我們能成為其領土和人民的新守護者。我們是否應該答應？"
 SEA_japan_foreign_policy.74.a: "很好"
 SEA_japan_foreign_policy.74.b: "我們不需要他們"
 SEA_japan_foreign_policy.75.t: "[FROM.GetAdjective]裝備抵達"
 SEA_japan_foreign_policy.75.desc: "我們在[FROM.GetNameDef]的聯繫人終於與該國政府達成協議，尤其是在我方多名聯繫人所屬的皇道派發動成功政變之後。兩位皇帝萬歲！"
 SEA_japan_foreign_policy.75.a: "我們感激不盡！"
 SEA_japan_foreign_policy.76.t: "[FROM.GetNameDefCap]要求完全整合"
 SEA_japan_foreign_policy.76.desc: "[FROM.GetLeader]宣稱，由於皇道派發動政變後全國進入緊急狀態，且懷疑有異見軍官藏匿在我們管轄的地區，我們應成為該國的正式一部分，由[FROM.GetAdjective]政府全面接管治理。我們是否接受？"
 SEA_japan_foreign_policy.76.a: "我們只能接受這種情況"
 SEA_japan_foreign_policy.76.b: "他們太自以為是了"
 SEA_japan_foreign_policy.77.t: "[FROM.GetNameDefCap]同意完全整合"
 SEA_japan_foreign_policy.77.desc: "我們的[FROM.GetNameDef]總督[FROM.GetLeader]今天早些時候同意了完全整合入我國的提議。這意味著我們的政府最終可以完全掌控朝鮮地區的地方部門。"
 SEA_japan_foreign_policy.77.a: "非常好！"
 SEA_japan_foreign_policy.78.t: "[FROM.GetNameDefCap]拒絕完全整合"
 SEA_japan_foreign_policy.78.desc: "儘管有顯而易見的優勢，而且明顯對國家的未來最為有利，但[FROM.GetNameDef]總督[FROM.GetLeader]還是拒絕了我們提出的全面整合提議。我們只能猜測他們的理由，但看來他們可能並不關心國家的最佳利益。"
 SEA_japan_foreign_policy.78.a: "我們需要更可靠的人掌權！"
 SEA_japan_foreign_policy.78.b: "我們暫時尊重他們的意願……"
 SEA_japan_foreign_policy.79.t: "[FROM.GetNameDefCap]尋求更緊密的整合"
 SEA_japan_foreign_policy.79.desc: "[FROM.GetLeader]提出一項主張，聲稱這是為了兩國人民的共同利益。他請求我們逐步整合進[FROM.GetNameDef]，結束我們的自治地位，成為其本土的一部分。這樣真的對我們有利嗎？"
 SEA_japan_foreign_policy.79.a: "是的，這對我們有利"
 SEA_japan_foreign_policy.79.b: "不！滿洲的命運應另有歸屬！"
 MAN_we_can_be_annexed_by_kodoha_tt: "我們將很快被[JAP.GetNameDef]§R吞併§!"
 SEA_japan_foreign_policy.80.t: "協和會同意了"
 SEA_japan_foreign_policy.80.desc: "協和會，即[FROM.GetNameDef]的統治精英，已同意我們的提案，並準備好在不久的將來作為我方領土的一部分來治理該地區。統一計劃將順利進行。"
 SEA_japan_foreign_policy.80.a: "很好"
 SEA_japan_foreign_policy.81.t: "協和會反對我們"
 SEA_japan_foreign_policy.81.desc: "協和會，即[FROM.GetNameDef]的統治精英，拒絕了我們的提議，聲稱成為我方一部分並無裨益。也許是受到滿洲異見者或共產黨人的影響，但遺憾的是這一決定我們已難以挽回……"
 SEA_japan_foreign_policy.81.a: "以後再收拾他們"
 SEA_japan_foreign_policy.81.b: "如果那是他們所希望的……"
 SEA_japan_foreign_policy.82.t: "[FROM.GetNameDefCap]尋求反蘇聯合作"
 SEA_japan_foreign_policy.82.desc: "遠東的老朋友[FROM.GetName]向我們提出一個誘人的提案。鑑於我們歷史淵源以及對[SOV.GetAdjective]國家共同的不信任，他們提出了一項軍事條約：若其中一方與[SOV.GetNameDef]開戰，另一方也將參戰。這真是難得的機會，是否要把握？"
 SEA_japan_foreign_policy.82.a: "為了我們的[FROM.GetAdjective]朋友，一切都值得！"
 SEA_japan_foreign_policy.82.b: "這對我們來說太危險了"
 SEA_japan_foreign_policy.83.t: "[FROM.GetLeader]簽署條約"
 SEA_japan_foreign_policy.83.desc: "我們偉大的朋友[FROM.GetNameDef]慷慨接受了建立反[SOV.GetAdjective]互助條約的提議。目前，各方代表正簽署協議文件，併為對[SOV.GetNameDef]的快速入侵做準備。"
 SEA_japan_foreign_policy.83.a: "好極了！"
 SEA_japan_foreign_policy.84.t: "[FROM.GetLeader]拒絕簽署協議"
 SEA_japan_foreign_policy.84.desc: "儘管我們一直努力改善雙邊關係，遺憾的是[FROM.GetLeader]拒絕了我們的反[SOV.GetAdjective]互助條約提案。他們認為一旦被[SOV.GetAdjective]探知此事，對[FROM.GetAdjective]來說風險過高。"
 SEA_japan_foreign_policy.84.a: "或許我們該再次轉向孤立主義……"
 SEA_japan_foreign_policy.85.t: "召喚所有締約國參戰"
 SEA_japan_foreign_policy.85.d: "正如我們在簽署《反蘇維埃條約》時所預料的那樣，如今我們已與蘇聯處於戰爭狀態。現在是締約國履行承諾、加入我們的時候了。"
 SEA_japan_foreign_policy.85.a: "我們的遠見起作用了。"
 SEA_japan_foreign_policy.86.t: "[From.GetNameDefCap]呼籲各締約國參戰"
 SEA_japan_foreign_policy.86.desc: "《波蘭‑日本反蘇維埃條約》規定，所有締約國必須共同參與對抗蘇聯的防禦性戰爭。[From.GetName]現已遭到蘇軍攻擊，並請求各締約方立即馳援。現在是時候展現[Root.GetAdjective]捍衛世界免受蘇聯威脅的決心了。"
 SEA_japan_foreign_policy.86.a: "[From.GetNameDefCap]將不會獨自戰鬥！"
 SEA_japan_foreign_policy.86.b: "這不是我們的戰爭。"
 SEA_japan_foreign_policy.86.b_tt: "§Y這將會被所有遵守條約的國家視為背叛（§!§R-50§!§Y評價）§!"
 SEA_japan_foreign_policy.87.t: "吞併[FROM.GetAdjective]"
 SEA_japan_foreign_policy.87.desc: "協和會同意皇道派的要求後，此事的發生就只是時間問題。今天，[FROM.GetAdjective]代表團帶著文件抵達，以促成我國完全併入他們的國家——這些文件已由我方代表簽署。"
 SEA_japan_foreign_policy.87.a: "我們簽字認可"
 SEA_japan_foreign_policy.88.t: "吞併[FROM.GetNameDef]"
 SEA_japan_foreign_policy.88.desc: "[FROM.GetLeader]，[FROM.GetNameDef]的領導人，已於今天早些時候同意完全併入我國。這意味著我國政府終於能夠全面掌控滿洲地區的各級行政機構。"
 SEA_japan_foreign_policy.88.a: "太好了"
 SEA_japan_foreign_policy.89.t: "[FROM.GetAdjective]用工業換取資源"
 SEA_japan_foreign_policy.89.desc: "我們收到[FROM.GetNameDef]的提議。他們有意開展長期資源貿易，作為交換，他們會給與一部分工業產能。目前，他們看中了[FROM.FROM.GetName]的一批資源。"
 SEA_japan_foreign_policy.89.a: "為什麼不呢？"
 SEA_japan_foreign_policy.89.b: "這不是好時機"
 SEA_japan_foreign_policy.90.t: "[FROM.GetAdjective]同意工業貿易"
 SEA_japan_foreign_policy.90.desc: "我們收到了[FROM.GetAdjective]方面關於用工業產能換取部分資源的答覆。看起來雙方都認可這筆交易的益處，他們愉快地同意了相關條款。我們將很快收到這些資源。"
 SEA_japan_foreign_policy.90.a: "太好了"
 SEA_japan_foreign_policy.91.t: "[FROM.GetAdjective]拒絕工業貿易協議"
 SEA_japan_foreign_policy.91.desc: "儘管[FROM.GetAdjective]方對我們提出的協議大多持中立態度，但他們最終還是選擇拒絕了我們以工業換取資源的提議。他們聲稱現在不是合適的時機，言下之意是，在未來我們關係進一步加強後仍有達成協議的可能。"
 SEA_japan_foreign_policy.91.a: "失敗乃成功之母……"
 SEA_japan_foreign_policy.92.t: "[FROM.GetAdjective]渴望更緊密的關係"
 SEA_japan_foreign_policy.92.desc: "來自[FROM.GetNameDef]的外交官已就加強雙方關係同我方接洽。此前這一進程因其國內軍閥陣營勢力限制未有大的進展，這一問題如今已得到解決。他們希望簽訂貿易、科研及防禦協議。我們可以選擇其中一項，也可以全部接受。鑑於他們為促成此事付出的努力，完全拒絕似乎並不妥當。"
 SEA_japan_foreign_policy.92.a: "可通過貿易加強關係"
 SEA_japan_foreign_policy.92.b: "我們認為沒有必要簽訂協議……"
 SEA_japan_foreign_policy.92.c: "我們應與其建立正式防禦協議"
 SEA_japan_foreign_policy.92.d: "我們應簽署所有協議！"
 SEA_japan_foreign_policy.93.t: "[FROM.GetLeader]簽署合作協議"
 SEA_japan_foreign_policy.93.desc: "[FROM.GetNameDef]的領導人[FROM.GetLeader]，欣然接受了我們其中一項提議，決定建立更緊密的貿易與科研關係。這是[ROOT.GetNameDef]及其外交成就的高光時刻！"
 SEA_japan_foreign_policy.93.a: "好極了！"
 SEA_japan_foreign_policy.94.t: "[FROM.GetLeader]未簽署任何協議"
 SEA_japan_foreign_policy.94.desc: "[FROM.GetNameDef]的領導人[FROM.GetLeader]表裡不一，拒絕了我們的全部提議，斷絕了兩國深化關係的可能。這是[ROOT.GetNameDef]及其外交成就的黑暗時刻……"
 SEA_japan_foreign_policy.94.a: "糟糕透頂"
 SEA_japan_foreign_policy.95.t: "[FROM.GetLeader]簽署共同防禦協議"
 SEA_japan_foreign_policy.95.desc: "[FROM.GetNameDef]的領導人[FROM.GetLeader]，欣然接受了我們其中一項提議，決定簽署共同防禦條約，雙方承諾在遭受攻擊時相互支援。這是[ROOT.GetNameDef]及其外交成就的高光時刻！"
 SEA_japan_foreign_policy.95.a: "好極了！"
 SEA_japan_foreign_policy.96.t: "[FROM.GetLeader]簽署全面外交協議"
 SEA_japan_foreign_policy.96.desc: "[FROM.GetNameDef]的領導人[FROM.GetLeader]，欣然接受了我們的全部提議，決定建立更緊密的貿易與科研關係，同時簽署共同防禦條約，雙方承諾在遭受攻擊時相互支援。這是[ROOT.GetNameDef]及其外交成就的高光時刻！"
 SEA_japan_foreign_policy.96.a: "好極了！"
 jap_usa_japan_research_name: "美日科研協議"
 jap_usa_japan_research_desc: "美國與日本科學家達成的科研協議。"
 SEA_japan_foreign_policy.97.t: "[FROM.GetNameDefCap]請求貿易協定"
 SEA_japan_foreign_policy.97.desc: "[FROM.GetNameDef]的[FROM.GetLeader]派遣外交官前往我們的首都，討論與[FROM.GetAdjective]建立複雜精細的貿易關係的前景。這將使我們兩國關係更加緊密，但也會讓他們以更低的價格獲取我們的資源，這可能會對我們的經濟造成不利影響。"
 SEA_japan_foreign_policy.97.a: "我們對此無異議"
 SEA_japan_foreign_policy.97.b: "你們可以把文件帶回東京了！"
 SEA_japan_foreign_policy.98.t: "[FROM.GetNameDefCap]同意貿易協議"
 SEA_japan_foreign_policy.98.desc: "[FROM.GetNameDef]的[FROM.GetLeader]對我們提出的降低貿易費用的提議反應積極，並已簽署相關文件使該政策立即生效。他們與我們一樣，對亞洲的光明未來充滿期待！"
 SEA_japan_foreign_policy.98.a: "太好了"
 SEA_japan_foreign_policy.99.t: "[FROM.GetNameDefCap]拒絕貿易協議"
 SEA_japan_foreign_policy.99.desc: "[FROM.GetNameDef]的[FROM.GetLeader]對我們提出的聯盟內部降低貿易費用的提議反應強硬，威脅稱若我們強行推行，他們將對此徵收關稅。看來[FROM.GetNameDef]無緣與我們共創美好藍圖！"
 SEA_japan_foreign_policy.99.a: "真可悲！"
 SEA_japan_foreign_policy.100.t: "[FROM.GetNameDefCap]邀請我們加入貨幣聯盟"
 SEA_japan_foreign_policy.100.desc: "[FROM.GetNameDef]的[FROM.GetLeader]提議我們加入其貨幣同盟，稱此舉只會加強我們兩國的經濟。聽起來像是個不容錯過的好機會，對吧？"
 SEA_japan_foreign_policy.100.a: "我們欣然接受"
 SEA_japan_foreign_policy.100.b: "這聽起來有些可疑……"
 SEA_japan_foreign_policy.101.t: "[FROM.GetNameDefCap]加入貨幣聯盟"
 SEA_japan_foreign_policy.101.desc: "[FROM.GetNameDef]的[FROM.GetLeader]對我們提出的設立共同貨幣的提議反應積極，並已簽署相關文件使該政策立即生效。他們與我們一樣，對亞洲的光明未來充滿期待！"
 SEA_japan_foreign_policy.101.a: "太好了"
 SEA_japan_foreign_policy.102.t: "[FROM.GetNameDefCap]拒絕貨幣聯盟"
 SEA_japan_foreign_policy.102.desc: "[FROM.GetNameDef]的[FROM.GetLeader]對我們提出的設立共同貨幣的提議反應強硬，威脅稱若我們強行推行，他們將對此徵收關稅。看來[FROM.GetNameDef]無緣與我們共創美好藍圖！"
 SEA_japan_foreign_policy.102.a: "真可悲！"
 SEA_japan_foreign_policy.103.t: "[FROM.GetNameDefCap]要求經濟一體化"
 SEA_japan_foreign_policy.103.desc: "[FROM.GetNameDef]的[FROM.GetLeader]今天抵達我們的首都，向我們提出了一項提議。他們希望我們加強貨幣聯盟的活動，並進一步與他們進行經濟一體化。這將大大有利於我們的經濟，但這一切似乎有些不對勁……"
 SEA_japan_foreign_policy.103.a: "這實在太誘人了，不可錯過"
 SEA_japan_foreign_policy.103.b: "我們不會放棄經濟獨立！"
 SEA_japan_foreign_policy.104.t: "[FROM.GetNameDefCap]接受我方提議"
 SEA_japan_foreign_policy.104.desc: "[FROM.GetNameDef]的[FROM.GetLeader]對我們的提議表示贊同，他們的外交官已經抵達我們的國家，簽署了必要文件，以促進進一步的經濟一體化。"
 SEA_japan_foreign_policy.104.a: "我們感謝他們的天真"
 SEA_japan_foreign_policy.105.t: "[FROM.GetNameDefCap]拒絕我們的提議"
 SEA_japan_foreign_policy.105.desc: "[FROM.GetNameDef]的[FROM.GetLeader]對我們的一體化邀請表示強烈不滿，並聲稱兩國之間任何形式的更緊密的經濟合作都將永遠不可能實現。或許他們看出了我們計劃中的意圖……"
 SEA_japan_foreign_policy.105.a: "壞消息……"
 SEA_japan_foreign_policy.106.t: "[FROM.GetNameDefCap]整合我國經濟"
 SEA_japan_foreign_policy.106.desc: "[FROM.GetNameDef]的[FROM.GetLeader]比最初承諾的更進一步，並且正在操縱市場，進一步增加我們對他們經濟的依賴，確保我國無法偏離他們的道路。如果我們現在不立即與他們決裂，這將標誌著我們作為獨立國家的地位終結。我們應該如何應對？"
 SEA_japan_foreign_policy.106.a: "我們只能接受這種情況"
 SEA_japan_foreign_policy.106.b: "不勝即亡！"
 SEA_japan_foreign_policy.107.t: "[FROM.GetNameDefCap]接受進一步整合"
 SEA_japan_foreign_policy.107.desc: "[FROM.GetNameDef]的領導層意圖與我們進一步整合，今天早些時候，議會對這個令人振奮的消息報以熱烈掌聲。我們提出的條件顯然足以讓他們認為這一提議對他們有利，儘管這會稍微損害他們的主權。"
 SEA_japan_foreign_policy.107.a: "很好！"
 SEA_japan_foreign_policy.108.t: "[FROM.GetNameDefCap]拒絕進一步整合"
 SEA_japan_foreign_policy.108.desc: "儘管有顯而易見的優勢，而且顯然如此對聯盟最有利，[FROM.GetNameDef]還是拒絕了我們提出的進一步整合提議。我們只能猜測他們的理由，但看來他們可能並不關心聯盟的最佳利益。"
 SEA_japan_foreign_policy.108.a: "他們是組織團結的隱患！"
 SEA_japan_foreign_policy.108.b: "我們會密切關注他們的"
 SEA_japan_foreign_policy.109.t: "[FROM.GetNameDefCap]要求全面整合"
 SEA_japan_foreign_policy.109.desc: "整合我們的經濟顯然不足以滿足[FROM.GetAdjective]人，[FROM.GetNameDef]的[FROM.GetLeader]今天更進一步，要求我們完全併入他們的國家。如果我們現在不立即與他們決裂，這將標誌著我們作為獨立國家的地位終結。我們應該如何應對？"
 SEA_japan_foreign_policy.109.a: "我們只能接受這種情況"
 SEA_japan_foreign_policy.109.b: "不勝即亡！"
 SEA_japan_foreign_policy.110.t: "[FROM.GetNameDefCap]同意完全整合"
 SEA_japan_foreign_policy.110.desc: "[FROM.GetNameDef]的領導層同意併入我們的國家，今天早些時候，議會對此令人振奮的消息報以熱烈的掌聲。我們提出的條件顯然足以讓他們認為這一提議對他們有利，儘管這意味著他們的主權的終結。"
 SEA_japan_foreign_policy.110.a: "很好！"
 SEA_japan_foreign_policy.111.t: "[FROM.GetNameDefCap]拒絕完全整合"
 SEA_japan_foreign_policy.111.desc: "儘管有顯而易見的優勢，而且顯然如此對聯盟最有利，[FROM.GetNameDef]還是拒絕了我們提出的全面整合提議。我們只能猜測他們的理由，但看來他們可能並不關心聯盟的最佳利益。"
 SEA_japan_foreign_policy.111.a: "他們是組織團結的隱患！"
 SEA_japan_foreign_policy.111.b: "我們會密切關注他們的"
 SEA_japan_foreign_policy.112.t: "[FROM.GetNameDefCap]索要亞洲殖民地控制權"
 SEA_japan_foreign_policy.112.desc: "[FROM.GetNameDef]的外交官提出協議，要求獲得我們在緬甸和馬來西亞的附屬國的宗主權，作為交換，他們將給予我們部分關鍵地區的資源權。他們稱此舉符合其“太平洋守護者”的聲名，能讓我們專注於歐洲和非洲，同時保護亞洲免受共產主義威脅。我們如何回應？"
 SEA_japan_foreign_policy.112.a: "這樣我們可以專注於發展其他地區"
 SEA_japan_foreign_policy.112.b: "放棄我們的帝國？想都別想！"
 SEA_japan_foreign_policy.113.t: "[FROM.GetNameDefCap]移交亞洲殖民地"
 SEA_japan_foreign_policy.113.desc: "[FROM.GetNameDef]的[FROM.GetLeader]欣然接受了我們的提議，並簽署了相關文件，將其在馬來西亞和緬甸的殖民地交給我們，作為交換，他們保留了該地區關鍵資源的控制權。今天是亞洲人民值得慶祝的日子！"
 SEA_japan_foreign_policy.113.a: "我們將為他們守護太平洋"
 SEA_japan_foreign_policy.114.t: "[FROM.GetNameDefCap]拒絕我們的請求"
 SEA_japan_foreign_policy.114.desc: "[FROM.GetNameDef]的[FROM.GetLeader]毫無廉恥，暴露了西方思想的迷茫與腐敗。我們提出了一個他們無法拒絕的協議，意圖改善亞洲局勢，但他們還是拒絕了。這是聯盟的至暗時刻。"
 SEA_japan_foreign_policy.114.a: "自大的西方人……"
 ENG_will_gain_resource_right_we_tt: "我們將獲得被轉讓國家部分地區的資源權"
 SEA_japan_foreign_policy.115.t: "[From.GetNameDefCap]要求接管我國部分殖民地"
 SEA_japan_foreign_policy.115.desc: "趁著我國而今式微之際，[From.GetAdjective]日前提議“幫助”我方“維持殖民地的秩序”。他們解釋說，鑑於全球的動盪加劇，我們已無力維持既有局面。\n\n很顯然這不過是他們打算奪取我國殖民地的託辭，但我們又能有什麼選擇呢？"
 SEA_japan_foreign_policy.115.a: "是時候承認日本在亞洲的霸權了。"
 SEA_japan_foreign_policy.115.b: "那就讓他們用武力來奪吧！"
 SEA_japan_foreign_policy.116.t: "[From.GetNameDefCap]同意移交殖民地"
 SEA_japan_foreign_policy.116.desc: "在仔細研討我方有關“維護”其殖民地秩序的提案後，[From.GetNameDefCap]方面最終決定接受，他們已經將其殖民地全權正式移交予我方。"
 SEA_japan_foreign_policy.116.a: "明智之舉"
 SEA_japan_foreign_policy.117.t: "[From.GetNameDefCap]拒絕移交殖民地"
 SEA_japan_foreign_policy.117.desc: "在仔細研討我方有關“維護”其殖民地秩序的提案後，[From.GetNameDefCap]方面最終決定斷然予以回絕。顯然他們並未把亞洲人民的利益放在心上。"
 SEA_japan_foreign_policy.117.a: "我們倒要看看他們能強硬多久"
 SEA_japan_foreign_policy.117.b: "那麼我們將用武力解放他們！"
 SEA_japan_foreign_policy.118.t: "[FROM.GetNameDefCap]邀請我們加入其同盟"
 SEA_japan_foreign_policy.118.desc: "遠道而來的一個代表團最近抵達我國首都，請求[ROOT.GetLeader]接見。他們聲稱來自[FROM.GetNameDef]，希望與我們結盟。我們是否接受？"
 SEA_japan_foreign_policy.118.a: "團結使我們更強大"
 SEA_japan_foreign_policy.118.b: "這違背了我們的中立原則……"
 SEA_japan_foreign_policy.119.t: "[FROM.GetNameDefCap]接受了我們的邀請"
 SEA_japan_foreign_policy.119.desc: "[FROM.GetLeader]欣然接受了我們的結盟提議，並已開始著手融入我們的勢力圈。今日值得慶祝！"
 SEA_japan_foreign_policy.119.a: "共享未來願景"
 SEA_japan_foreign_policy.120.t: "[FROM.GetNameDefCap]拒絕加入我們"
 SEA_japan_foreign_policy.120.desc: "[FROM.GetLeader]粗魯地拒絕了我們結盟的提議，稱這有悖於他們的中立原則。我們只能想像，這背後有多少腐敗行為造成了這一錯誤的決定。"
 SEA_japan_foreign_policy.120.a: "這是他們的損失"
 SEA_japan_foreign_policy.121.t: "[FROM.GetNameDefCap]把我們移交[JAP.GetAdjective]管轄"
 SEA_japan_foreign_policy.121.desc: "我們的前宗主國[FROM.GetLeader]已簽署文件，促成將我國控制權移交給[JAP.GetNameDef]。顯然，我們已納入另一強國的庇護之下。如今，我們有了新的宗主國，並需聽從其號令。"
 SEA_japan_foreign_policy.121.a: "哦……"
 SEA_japan_foreign_policy.122.t: "[From.GetAdjective]高層發生變動"
 SEA_japan_foreign_policy.122.desc: "[From.GetAdjective]日前決定，將其左翼的公務員和將領傳召回國。而與此同時，也將他們那些右翼的公務員和將領以非正式流放的形式派遣到了我國作為替代。"
 SEA_japan_foreign_policy.122.a: "看來[From.GetNameDef]國內正發生著什麼……"
 SEA_japan_foreign_policy.123.t: "[Root.GetAdjective]高層人事調動完畢"
 SEA_japan_foreign_policy.123.desc: "此前以非正式流放的形式派駐到[From.GetNameDef]的左翼公務員和將領們已被傳召回國，他們將被用以頂替那些右翼的同僚。高層的人事變動已圓滿完成。"
 SEA_japan_foreign_policy.123.a: "這將有助於增強我們在[Root.GetNameDef]的勢力。"
 SEA_japan_foreign_policy.124.t: "[FROM.GetNameDefCap]邀請我們加入第五國際"
 SEA_japan_foreign_policy.124.desc: "遠道而來的一個代表團最近抵達我國首都，請求[ROOT.GetLeader]接見。他們聲稱來自[FROM.GetNameDef]，希望與我們結盟。我們是否接受？"
 SEA_japan_foreign_policy.124.a: "團結使我們更強大"
 SEA_japan_foreign_policy.124.b: "這違背了我們的中立原則……"
 SEA_japan_foreign_policy.125.t: "[FROM.GetNameDefCap]接受了我們的邀請"
 SEA_japan_foreign_policy.125.desc: "[FROM.GetLeader]欣然接受了我們的結盟提議，並已開始著手融入我們的勢力圈。今日值得慶祝！"
 SEA_japan_foreign_policy.125.a: "共享未來願景"
 SEA_japan_foreign_policy.126.t: "[FROM.GetNameDefCap]拒絕加入我們"
 SEA_japan_foreign_policy.126.desc: "[FROM.GetLeader]粗魯地拒絕了我們結盟的提議，稱這有悖於他們的中立原則。我們只能想像，這背後有多少腐敗行為造成了這一錯誤的決定。"
 SEA_japan_foreign_policy.126.a: "這是他們的損失"
 SEA_japan_foreign_policy.127.t: "[FROM.GetNameDefCap]加入第五國際"
 SEA_japan_foreign_policy.127.desc: "[FROM.GetLeader]背叛了我們轉而支持[JAP.GetNameDef]的共產黨，破壞了兩國在俄羅斯內戰結束時簽署的協議。我們應該懲罰他們的背叛行為嗎？"
 SEA_japan_foreign_policy.127.a: "不，我們必須放下此事……"
 SEA_japan_foreign_policy.127.b: "是的，他們會為此付出代價！"
 SEA_japan_foreign_policy.128.t: "[FROM.GetLeader]要求我們屈服"
 SEA_japan_foreign_policy.128.desc: "[FROM.GetNameDef]的[FROM.GetLeader]要求我方“非法分離地區”向東京“中央政權”再次臣服，同時迴歸[FROM.GetAdjective]勢力範圍。我們該如何回應這一赤裸裸的威脅？"
 SEA_japan_foreign_policy.128.a: "我們無力拒絕對方要求"
 SEA_japan_foreign_policy.128.b: "我們會戰至最後一人！"
 SEA_japan_foreign_policy.129.t: "[FROM.GetLeader]同意我們的要求"
 SEA_japan_foreign_policy.129.desc: "[FROM.GetNameDef]的[FROM.GetLeader]明智地接受了我們的要求並向我國臣服，將[FROM.GetAdjective]帶回了我們的勢力範圍。今天，我們取得了勝利，而[FROM.GetAdjective]人民自此從資產階級專政中解放了！"
 SEA_japan_foreign_policy.129.a: "太棒了。"
 SEA_japan_foreign_policy.130.t: "[FROM.GetLeader]拒絕我們的要求"
 SEA_japan_foreign_policy.130.desc: "[FROM.GetNameDef]的[FROM.GetLeader]不幸拒絕了我們發出的臣服要求，聲稱其人民意在建立一個獨立的民主國家，而非成為[ROOT.GetAdjective]勢力範圍內的一個革命地區。他們做出了錯誤的選擇……"
 SEA_japan_foreign_policy.130.a: "那我們必須用武力奪回我們的領土！"
 SEA_japan_foreign_policy.131.t: "[FROM.GetNameDefCap]在[ROOT.GetNameDef]煽動內戰"
 SEA_japan_foreign_policy.131.desc: "在[FROM.GetAdjective]政府和樸憲永等煽動者的呼籲下，[ROOT.GetAdjective]無產階級似乎已經厭倦等待政府和平演變。在激烈的討論之後，武裝衝突似乎已隨失敗的外交而來，而樸憲永的軍隊早已奪取了國家南部的控制。"
 SEA_japan_foreign_policy.131.a: "為了無產階級！"
 SEA_japan_foreign_policy.131.b: "我們必須制止這種愚蠢的行為！"
 SEA_japan_foreign_policy.132.t: "[FROM.GetLeader]要求我們屈服"
 SEA_japan_foreign_policy.132.desc: "[FROM.GetNameDef]的[FROM.GetLeader]要求我方“資產階級獨裁政權”向東京的共產主義“中央政權”臣服，並且允許我國人民在成為[FROM.GetAdjective]勢力範圍一部分的情況下，擁有適當的自主權。我們該如何回應這一赤裸裸的威脅？"
 SEA_japan_foreign_policy.132.a: "我們無力拒絕對方要求。"
 SEA_japan_foreign_policy.132.b: "我們會戰至最後一人！"
 SEA_japan_foreign_policy.133.t: "[FROM.GetLeader]同意我們的要求"
 SEA_japan_foreign_policy.133.desc: "[FROM.GetNameDef]的[FROM.GetLeader]已經接受了我們的要求並向我國臣服，將[FROM.GetAdjective]帶回了我們的勢力範圍。今天，我們取得了勝利，而[FROM.GetAdjective]人民自此從資產階級專政中解放了！"
 SEA_japan_foreign_policy.133.a: "太棒了。"
 SEA_japan_foreign_policy.134.t: "[FROM.GetLeader]拒絕我國要求"
 SEA_japan_foreign_policy.134.desc: "[FROM.GetNameDef]的[FROM.GetLeader]不幸拒絕了我們發出的臣服要求，聲稱其人民意在建立一個獨立的國家，而非成為[ROOT.GetAdjective]勢力範圍內的一個革命地區。他們做出了錯誤的選擇……"
 SEA_japan_foreign_policy.134.a: "那麼我們必須用武力解放他們的人民！"
 SEA_japan_foreign_policy.135.t: "菲律賓第二共和國公告"
 SEA_japan_foreign_policy.135.desc: "今天早些時候，[ROOT.GetLeader]和各[JAP.GetAdjective]軍官發表聯合公告，宣佈建立新[ROOT.GetAdjective]國家。我們將戰勝所有敵人！"
 SEA_japan_foreign_policy.135.a: "繁榮在望！"
 SEA_japan_foreign_policy.136.t: "襲擊珍珠港"
 SEA_japan_foreign_policy.136.desc: "昨天──它將永遠成為國恥日──[ROOT.GetNameDef]遭到了[JAP.GetNameDef]海空軍預謀的突然襲擊。[ROOT.GetNameDefCap]當時同該國處於和平狀態，而且應[JAP.GetNonIdeologyName]的請求，仍在同它的政府和天皇進行對話，以期維持太平洋的和平。確實，就在[JAP.GetAdjective]空軍中隊開始轟炸[ROOT.GetAdjective]奧阿胡島之後一小時，[JAP.GetAdjective]駐我國大使和他的一個同僚還向我們的國務卿遞交了一份對[ROOT.GetAdjective]最近一封信函的正式答覆。雖然覆函聲言繼續進行外交談判似已無用，它並未包含有關戰爭或武裝進攻的威脅或暗示。但此刻我們必須正視現實……我們已經處於戰爭！"
 SEA_japan_foreign_policy.136.a: "是的，它將永遠成為國恥日！"
 SEA_japan_foreign_policy.137.t: "與[MAN.GetNameDef]合併"
 SEA_japan_foreign_policy.137.desc: "[JAP.GetLeader]要求我們的政府與[MAN.GetNameDef]合併，放棄我們的獨立，並給予我們的領導層[MAN.GetAdjective]政府中的高級職位。我們要接受嗎？"
 SEA_japan_foreign_policy.137.a: "[ROOT.GetLeader]會獲得一個好位子，所以我們同意"
 SEA_japan_foreign_policy.137.b: "這會成為我們自治的終結，不行！"
 SEA_japan_foreign_policy.138.t: "[FROM.GetNameDefCap]與我們合併"
 SEA_japan_foreign_policy.138.desc: "[FROM.GetNameDef]的[FROM.GetLeader]同意了[JAP.GetAdjective]的提議，與我們的政府合併，[FROM.GetAdjective]的土地現在完全由我們管轄。真是美好的一天！"
 SEA_japan_foreign_policy.138.a: "明智的選擇"
 SEA_japan_foreign_policy.139.t: "[FROM.GetNameDefCap]拒絕合併"
 SEA_japan_foreign_policy.139.desc: "膚淺的[FROM.GetLeader]毫無理性，拒絕了與[MAN.GetAdjective]合併的提議。也許我們可以提出一份更好的方案，亦或者提出適當的恐嚇。"
 SEA_japan_foreign_policy.139.a: "真可惜"
 SEA_japan_foreign_policy.140.t: "[MAN.GetLeader]尋求合併傀儡政府"
 SEA_japan_foreign_policy.140.desc: "[MAN.GetLeader]要求我們將其他中國傀儡政府與[MAN.GetNameDef]合併，終止它們的自治權，並將領土交由[MAN.GetAdjective]政府管轄。我們要接受嗎？"
 SEA_japan_foreign_policy.140.a: "很好，這使我們的行政工作更簡單了"
 SEA_japan_foreign_policy.140.b: "聽起來可疑"
 SEA_japan_foreign_policy.141.t: "[JAP.GetLeader]拒絕我方提案"
 SEA_japan_foreign_policy.141.desc: "[JAP.GetLeader]徹底拒絕了我們要求將其他中國傀儡政府與我們合併的請求。看來現在提出這種要求，對政府而言還為時過早。"
 SEA_japan_foreign_policy.141.a: "那我們以後再說吧……"
 SEA_japan_popup_events.1.t: "亨裡希·柳什科夫逃往滿洲"
 SEA_japan_popup_events.1.desc: "我方特工在滿洲邊境的波西耶特抓獲一名自稱格尼赫·薩莫伊洛維奇·柳什科夫的[SOV.GetAdjective]叛逃者。此人似乎是內務人民委員會高級軍官，據稱攜帶有關於[SOV.GetAdjective]在該地區軍力的機密文件。他聲稱是為躲避大清洗而逃亡，這或許是我們深入瞭解[SOV.GetNameDef]內部運作的寶貴機會？"
 SEA_japan_popup_events.1.a: "機會來了！"
 SEA_japan_popup_events.1.b: "我們不能輕信這個外國人的說辭"
 SEA_japan_popup_events.2.t: "護國同志會瀕臨解散！"
 SEA_japan_popup_events.2.desc: "統制派領導層近期爆發內部分歧後，整個組織已瀕臨瓦解邊緣。值得注意的是，岸信介及其盟友公然表現出對東條英機的不敬態度，與此同時，各類暗殺傳聞甚囂塵上，局勢動盪不安。更有傳言稱，岸信介企圖建立一個違逆天皇意志、罔顧軍部立場的專家獨裁政權。面對這個搖搖欲墜的聯盟——究竟是任其分崩離析，還是竭力挽救其存續價值？"
 SEA_japan_popup_events.2.a: "這不是個能長久維繫的團伙"
 SEA_japan_popup_events.2.b: "我們必須不惜一切代價維護它！"
 JAP_harakiri_debate_has_taken_place_flag: "§Y文官政府§!與§Y武官派系§!之間的張對峙即將達到臨界點，§Y切腹辯論§!已經開始"
 SEA_japan_popup_events.3.t: "切腹辯論"
 SEA_japan_popup_events.3.desc: "在今日眾議院帝國議會的全體會議上，立憲政友會議員濱田國松對陸軍大臣寺內壽一及其軍事派系不斷擴張的權力發起猛烈抨擊。當寺內大臣指責濱田藐視軍方權威、侮辱軍隊榮譽時，濱田當即針鋒相對地回應：“請查閱會議記錄。若其中確有侮辱軍隊之言辭，我將切腹向閣下謝罪；若無此等言論，則請閣下自行切腹。”此言一齣，寺內頓時怒不可遏，在議席上怒視濱田，議會現場隨即陷入混亂，憤怒的咆哮聲充斥整個議院大廳。"
 SEA_japan_popup_events.3.a: "這是一場災難！"
 ### KODOHA EVENTS ###
 SEA_japan_popup_events.4.t: "說服天皇"
 SEA_japan_popup_events.4.desc: "天皇陛下對昭和維新的理想及新軍政府的建立顯得興致索然。他很可能仍受統制派操控，但若始終不願與我們同心，恐怕只能考慮擁立其弟雍仁親王即位。我們是該“勸請”陛下共襄大事，還是順其自然更為妥當？"
 SEA_japan_popup_events.4.a: "我們必須不惜一切代價爭取他的支持！"
 SEA_japan_popup_events.4.b: "我們另有其他人選"
 SEA_japan_popup_events.4.c: "如果他不支持我們，就必須除掉……"
 SEA_japan_popup_events.5.t: "裕仁決定支持新政府"
 SEA_japan_popup_events.5.desc: "經過充分的“勸說”後，看來我們偉大的天皇陛下已決定支持我們新成立的政府，正式批准我們繼續推進昭和維新的計劃。這將使我們的國家更加強大！"
 SEA_japan_popup_events.5.a: "棒極了！"
 SEA_japan_popup_events.6.t: "裕仁拒絕支持新政府"
 SEA_japan_popup_events.6.desc: "儘管我們不斷嘗試勸說天皇陛下，他似乎仍拒絕接受。雖然不盡理想，但我們早已預料到這種可能性，並制定了應對方案。日本陸軍將領、天皇之弟雍仁親王是我們選定的替代人選。他將作為攝政輔佐裕仁之子明仁，或直接即位成為更符合我們意識形態的新天皇。"
 SEA_japan_popup_events.6.a: "那就讓他讓位給他兒子"
 SEA_japan_popup_events.6.b: "軟禁他！"
 SEA_japan_popup_events.7.t: "裕仁遇刺！"
 SEA_japan_popup_events.7.desc: "據報道，今天早些時候，我方官員發現昭和天皇死在宮中。他們聲稱他被外國特工暗殺，但我們無法確定——真相帶來的損害可能遠大於益處。鑑於這一威脅，軍方已宣佈戒嚴，並表示將由陸軍將領秩父親王繼位，因為在兇手可能仍然逍遙法外的情況下，繼續由明仁繼位將過於危險。這究竟是更大陰謀的一部分，還是真的存在外國行兇者？"
 SEA_japan_popup_events.7.a: "雍仁會接替他的位置"
 SEA_japan_popup_events.8.t: "軍部領導權問題"
 SEA_japan_popup_events.8.desc: "隨著新軍事政府的成立，領導權問題再次浮現。皇道派創始人荒木貞夫表示希望出任首相，並已向天皇提出請求。但由於真崎甚三郎在軍中和民眾中的支持度高於荒木，或許讓真崎擔任首相，而荒木僅保留禮儀性職位更為明智。我們該怎麼辦？"
 SEA_japan_popup_events.8.a: "真崎明顯更受少壯派青睞"
 SEA_japan_popup_events.8.b: "應推舉荒木擔任國家的“總統”"
 SEA_japan_popup_events.9.t: "道德、武士道與法西斯主義"
 SEA_japan_popup_events.9.desc: "陸軍傑出的政治哲學家荒木貞夫將軍，將古代武士道的準則與歐洲法西斯主義的類似思想相聯繫，構建了其意識形態的哲學基礎——這一思想將天皇、人民、土地與道德視為一個不可分割的整體。為了加強這些理念，或許借鑑更接近西方政府模式的策略不失為明智之選。我們對此有何看法？"
 SEA_japan_popup_events.9.a: "必須徹底排斥這種西洋思想！"
 SEA_japan_popup_events.9.b: "荒木閣下是對的，我們應該接納那些想法"
 SEA_japan_popup_events.10.t: "軍事政變的傳聞"
 SEA_japan_popup_events.10.desc: "最近有傳言稱，陸軍內部的激進傳統派系皇道派正策劃一場政變。他們很可能在等待相澤三郎中佐的審判結束——他是該組織不可或缺的成員。考慮到他們的動機，政變期間他們可能會刺殺許多他們認為會對其價值觀構成威脅的人。我們可能需要迅速行動，否則不久的將來會發生流血事件。"
 SEA_japan_popup_events.10.a: "何等卑劣！我們必須立即行動！"
 SEA_japan_popup_events.11.t: "民眾叛亂的傳聞"
 SEA_japan_popup_events.11.desc: "儘管“維新政府”成立多時，但天皇陛下至今仍被幽禁。民間不滿情緒正急速發酵，民眾似乎期待昭和天皇正式復位，甚至可能正在密謀營救行動——除非我們能迅速控制局勢。也許只有消除這個可供擁戴的精神象徵，才能平息動盪，儘管採取如此手段難免會引發爭議。我們究竟該如何抉擇？"
 SEA_japan_popup_events.11.a: "命令會下達，但儘量不要留下證據"
 SEA_japan_popup_events.11.b: "不，必須保證這位上皇的安全！"
 SEA_japan_popup_events.12.t: "天皇死於居所"
 SEA_japan_popup_events.12.desc: "首相今天早些時候宣佈，前任天皇昭和被發現死於皇宮之中。許多人懷疑這是軍方為了確保權力而採取的行動，儘管官方聲稱他是自然死亡，但東京警察並未獲准進入皇宮以確認他的死因。想必這是軍隊的叛國行為？"
 SEA_japan_popup_events.12.a: "舉國哀悼"
 SEA_japan_popup_events.12.b: "香淳太后要求找出真兇！"
 SEA_japan_popup_events.13.t: "皇道派軍官因謀殺裕仁天皇被起訴"
 SEA_japan_popup_events.13.desc: "根據東京警視廳近期奉昭和天皇遺孀香淳太后之命展開的調查，發現皇道派確實對先天皇的冷血謀殺負有責任。此案有充分理由被定性為叛國罪，現在是時候將這個叛徒集團趕下臺了。"
 SEA_japan_popup_events.13.a: "宣佈戒嚴，香淳太后將解決國家動盪！"
 SEA_japan_popup_events.14.t: "1936大選的結果"
 SEA_japan_popup_events.14.desc: "儘管時局動盪，大選仍順利完成，我國人民已決定由誰來代表他們進入眾議院。町田忠治領導的立憲民政黨在選舉中成為最大黨派，而立憲政友會則失去了多數席位。儘管隨著文官政府近期權力的衰落，此次選舉意義有限，但它表明我們的民主制度依然存在——儘管已脆弱不堪。"
 SEA_japan_popup_events.14.a: "願町田忠治能領導好立憲民政黨"
 SEA_japan_popup_events.15.t: "岡田於東京站遇刺身亡"
 SEA_japan_popup_events.15.desc: "今早，首相岡田啟介於東京站等待乘坐山手線時遭特高課警察槍擊身亡。軍方隨後向帝國議會發出警告，稱任何企圖排斥軍方的舉動都將以武力回應。局勢明顯升級，臨時首相町田忠治已請求天皇關注局勢並發表聲明。最終天皇將支持哪方，尚待時間揭曉。"
 SEA_japan_popup_events.15.a: "一定要阻止他們！"
 SEA_japan_popup_events.16.t: "天皇任命新首相"
 SEA_japan_popup_events.16.desc: "為回應臨時首相町田忠治的近期呼籲，裕仁天皇公開反對派系衝突引發的暴力，並決定提名新首相以應對當前危機。他提名的人選是……"
 SEA_japan_popup_events.16.a: "自由主義者町田忠治"
 SEA_japan_popup_events.16.b: "社會主義者安部磯雄"
 SEA_japan_popup_events.16.c: "貴族院議長德川家達"
 SEA_japan_popup_events.17.t: "軍方宣佈罷工"
 SEA_japan_popup_events.17.desc: "帝國陸軍及海軍多位高級將領宣佈，因政府決定結束軍方對政治的干預，軍隊將發起罷工。他們稱若遭攻擊不會保衛現政府，且可能已策劃了新一輪罷黜首相的政變。"
 SEA_japan_popup_events.17.a: "形勢漸趨緊迫……"
 SEA_japan_popup_events.18.t: "軍方築壘防守"
 SEA_japan_popup_events.18.desc: "文職警察最近宣佈效忠議會後，軍方已開始準備與政府忠誠部隊發生衝突，試圖在內戰來臨之際奪取地方控制權。我們必須儘快採取行動，鎮壓叛亂！"
 SEA_japan_popup_events.18.a: "立即派遣警視廳前往東京！"
 SEA_japan_popup_events.18.b: "我們必須確保工業帶不被其佔據！"
 enables_the_civil_war_decisions_tt: "若§Y內戰§!爆發，我們將能夠通過地圖決議爭取各地區的支持"
 JAP_shanghai_ultimatum: "洪口最後通牒"
 SEA_japan_popup_events.19.t: "洪口最後通牒"
 SEA_japan_popup_events.19.desc: "又一名日本軍官在上海遇害，敵方發出最後通牒，要求我方全面撤軍，否則他們將在一週內發動進攻。\n\n我們當如何應對？"
 SEA_japan_popup_events.19.a: "絕不讓步！"
 SEA_japan_popup_events.19.b: "是我們越界了，撤退！"
 SEA_japan_popup_events.20.t: "[FROM.GetLeader]拒絕洪口最後通牒"
 SEA_japan_popup_events.20.desc: "中國政府聲稱我方的“非法侵略”行為已達到“不可容忍”的程度。我方提出的要求遭到拒絕，並且有報道稱更多日本公民在上海遭襲。這將成為我們全面解決中國問題的契機。"
 SEA_japan_popup_events.20.a: "他們會為此付出代價！"
 SEA_japan_popup_events.21.t: "[FROM.GetLeader]簽署洪口最後通牒"
 SEA_japan_popup_events.21.desc: "出乎意料！中國在收到關於上海控制權的最後通牒後選擇了忍讓。他們明白激怒我們要付出何等巨大的代價，所以決定同意割讓上海及周邊地區在內的大片租界領土。中國正一點一點地變成我們的囊中之物。"
 SEA_japan_popup_events.21.a: "看來戰爭還要再等一會兒。"
 SEA_japan_popup_events.22.t: "圍攻大阪城"
 SEA_japan_popup_events.22.desc: "得知頗具爭議的《治安維持法》被廢除的消息後，駐守大阪城的軍隊向城外的政府軍開火。看來他們不會輕易讓步，寧可撕裂國家的團結也要維護他們的霸權。我們必須阻止他們！"
 SEA_japan_popup_events.22.a: "復興大正之風骨的時機來了！"
 SEA_japan_popup_events.23.t: "自鳴得意的天皇"
 SEA_japan_popup_events.23.desc: "裕仁天皇對軍部權力在政界擴張的漠視，以及對國內派系暴力升級時的不作為，使其統治正當性受到質疑。眾人紛紛要求支持文官政府的弟弟宣仁親王登基，其兩位兄長均犯有叛國罪。此舉既能維持皇室對政府的支持，也能提振民眾士氣。"
 SEA_japan_popup_events.23.a: "如此，宣仁親王即位。"
 SEA_japan_popup_events.24.t: "帝國陸軍投降"
 SEA_japan_popup_events.24.desc: "本島最後皇軍殘餘投降，宣告政府與軍隊數十年紛爭終結。國土受創，然此乃[ROOT.GetAdjective]人民新生的開始。敵寇仍在海外潛伏，然當下當以復興為重。腐敗勢力既除，政府現擬行首屆大選。"
 SEA_japan_popup_events.24.a: "我們重新掌握了未來！"
 SEA_japan_popup_events.25.t: "大選"
 SEA_japan_popup_events.25.desc: "軍部勢力被肅清後的首屆大選即將開啟，人民的投票將引領國運。競選雙方為自由派立憲民政黨和保守派立憲政友會，兩黨均曾執掌帝國議會。投票進行中，勝負即將揭曉。"
 SEA_japan_popup_events.25.a: "立憲民政黨必勝！"
 SEA_japan_popup_events.25.b: "立憲政友會必勝！"
 SEA_japan_popup_events.26.t: "關東軍政變"
 SEA_japan_popup_events.26.desc: "日本軍政內戰激烈，關東軍趁機發動政變，欲在滿洲自立為王。是放任不管，還是全力反擊？"
 SEA_japan_popup_events.26.a: "反擊簡直毫無意義"
 SEA_japan_popup_events.26.b: "是時候粉碎日寇枷鎖了！"
 MAN_kwantung_will_try_to_occupy_east_hebei_tt: "這將使我們能夠藉助關東軍的力量奪取對[609.GetName]的控制權"
 SEA_japan_popup_events.27.t: "千載良機"
 SEA_japan_popup_events.27.desc: "日本軍政內戰激烈，朝鮮人民看準時機準備收復國家，趕走日寇。朝鮮半島將在本國人民的治理下重新煥發生機。"
 SEA_japan_popup_events.27.a: "把入侵者扔海里喂鯊魚！"
 SEA_japan_popup_events.28.t: "鄉村行動基地"
 SEA_japan_popup_events.28.desc: "共產黨已經決定在帝國陸軍和政府的眼皮子底下開始地下行動。他們現在面臨的唯一問題是，在哪裡行動才能將被發現並根除的可能性降到最低？"
 SEA_japan_popup_events.28.a: "北海道是完美的選擇。"
 SEA_japan_popup_events.28.b: "四國已經夠遠了。"
 SEA_japan_popup_events.28.c: "在鹿兒島建立支部。"
 SEA_japan_popup_events.29.t: "宮崎事變"
 SEA_japan_popup_events.29.desc: "今晨，帝國陸軍所屬部隊佔領了宮崎郊區一間有共產主義革命者活動的倉庫，企圖實施抓捕。德田球一先前已被地方共產主義游擊隊從網走刑務所救出，在宮崎倉庫爆發槍戰後，德田球一通過廣播下達了革命即刻開始的命令。看來，行動的時機已經到來。"
 SEA_japan_popup_events.29.a: "革命終於開始了！"
 JAP_democratic_side_also_spawns_tt: "§Y民主主義政府§!也將試圖抵抗我們的革命！"
 SEA_japan_popup_events.30.t: "討論國家未來的方向"
 SEA_japan_popup_events.30.desc: "在帝國陸軍被擊敗，局勢趨於穩定後，國會爆發了關於國家路線的爭論。講座派主張只有動員無產階級、用專政之手引領民眾，才能實現我們理想的未來。勞農派則認為一場溫和而平靜、涵蓋各階層的運動才能更好地控制全國。該踐行哪種理念呢？"
 SEA_japan_popup_events.30.a: "講座派是對的。"
 SEA_japan_popup_events.30.b: "勞農派的理念最有前途。"
 JAP_supported_the_kozaha_idea_flag: "在辯論中支持講座派"
 JAP_supported_the_rounoha_idea_flag: "在辯論中支持勞農派"
 JAP_supported_the_kozaha_idea_tt: "將解鎖§Y$JAP_the_lecture_group_ascendant$§!國策"
 JAP_supported_the_rounoha_idea_tt: "將解鎖§Y$JAP_the_labor_farmer_faction_ascendant$§!國策"
 SEA_japan_popup_events.31.t: "講座派的領導者"
 SEA_japan_popup_events.31.desc: "在革命勝利、勞農派掌握大權後，是時候為新的人民共和國選出一位總理了。戰爭期間，黨內有兩個人嶄露頭角，分別是野坂參三和德田球一。革命的勝利證明了他們兩人皆有能力、有意願領導我們邁向共產主義。儘管兩人觀念有所不同，但都蘊藏著無限可能。馳名國際的野坂參三和更有經驗但聲名稍遜的德田球一，誰會獲得命運的青睞呢？"
 SEA_japan_popup_events.31.a: "野坂參三更受歡迎。"
 SEA_japan_popup_events.31.b: "德田球一更有經驗。"
 SEA_japan_popup_events.32.t: "勞農派的領導者"
 SEA_japan_popup_events.32.desc: "在內戰結束、革命勝利後，勞農派取得了黨和群眾的信任。放棄死守教條讓他們得到了眾多追隨者以及權力的寶座。然而，最主要的問題還未解決——誰將擔任共和國的下一任總理？三位候選人已經脫穎而出，面臨最終的選舉。會是經驗豐富的社會主義運動核心人物山川均嗎？還是在群眾中獲得了大量支持並已因此獲選為主席的荒畑寒村？或是在黨內不太出名，但已表明她有能力擔任領導者和改革者角色的山川菊榮？"
 SEA_japan_popup_events.32.a: "山川均有經驗。"
 SEA_japan_popup_events.32.b: "荒畑寒村有群眾的支持。"
 SEA_japan_popup_events.32.c: "山川菊榮的理念最具革命性。"
 SEA_japan_popup_events.33.t: "皇室的命運"
 SEA_japan_popup_events.33.desc: "雖然人民已經牢牢把控了權力，但舊皇室的問題仍懸而未決。對於如何處理他們存在各種觀點，一些人建議改造他們，讓他們和普通勞動者平起平坐，另一些人則認為他們應該為戰爭期間和更久之前對人民犯下的罪行受到更嚴厲的懲罰。儘管尚未做出決定，但不管何種選擇都需要處理異議。"
 SEA_japan_popup_events.33.a: "讓他們像普通人一樣生活。"
 SEA_japan_popup_events.33.b: "讓他們在監獄裡度過餘生。"
 SEA_japan_popup_events.33.c: "讓他們活著太危險了！"
 SEA_japan_popup_events.33.d: "將他們驅逐出境。"
 SEA_japan_popup_events.34.t: "討論阿伊努革命理論"
 SEA_japan_popup_events.34.desc: "許多政治思想家認為流氓無產階級是我國革命的主體，而阿伊努人也屬於其中。他們還認為阿伊努人長期生活在原始共產主義制度中，因此足以成為“共產主義革命的領導者”。現在的問題是應該以何種方式實施這一理念。要將他們的傳統吸收進我們的社會主義社會，還是賦予阿伊努人自治權？"
 SEA_japan_popup_events.34.a: "我們應該利用他們迷人的傳統。"
 SEA_japan_popup_events.34.b: "必須授予這些革命的領導者他們應得的自治權！"
 SEA_japan_popup_events.35.t: "[FROM.GetLeader]想要賦權李氏王朝"
 SEA_japan_popup_events.35.desc: "我們的宗主國[FROM.GetNameDef]要求我方殖民總督將權力移交給忠於大日本帝國的[ROOT.GetAdjective]王位繼承人李垠。聽起來像是個不容錯過的好機會。"
 SEA_japan_popup_events.35.a: "我們會欣然接受。"
 SEA_japan_popup_events.35.b: "不行，總督的職位必須保留！"
 SEA_japan_popup_events.36.t: "[FROM.GetNameDefCap]煽動共產主義情緒"
 SEA_japan_popup_events.36.desc: "我們注意到，目前在我國有[FROM.GetAdjective]的組織在傳播共產主義思想。儘管這本身似乎無害，但一些宣傳內容卻顯得相當具有革命性。關於工人被鼓勵組織起來團結一致的報道越來越頻繁，結合近期的歷史，我們無法確定這是否是[FROM.GetAdjective]領導層的一個複雜陰謀，最終目的是要將我們整合進來。"
 SEA_japan_popup_events.36.a: "讓他們繼續。"
 SEA_japan_popup_events.36.b: "鎮壓這些社會主義煽動者！"
 SEA_japan_popup_events.37.t: "[FROM.GetNameDefCap]煽動共產主義情緒"
 SEA_japan_popup_events.37.desc: "我們注意到，目前在我國有[FROM.GetAdjective]的組織在傳播共產主義思想。儘管這本身似乎無害，但一些宣傳內容卻顯得相當具有革命性。關於工人被鼓勵組織起來團結一致的報道越來越頻繁，結合近期的歷史，我們無法確定這是否是[FROM.GetAdjective]領導層的一個複雜陰謀，最終目的是要將我們整合進來。"
 SEA_japan_popup_events.37.a: "讓他們繼續。"
 SEA_japan_popup_events.37.b: "鎮壓這些社會主義煽動者！"
 SEA_japan_popup_events.38.t: "[ROOT.GetNameDef]內戰"
 SEA_japan_popup_events.38.desc: "在經歷了一段時間的共產主義情緒上升後，似乎[ROOT.GetAdjective]無產階級已經對等待和平政權更迭感到厭倦。經過激烈的討論，外交途徑似乎已破裂，武裝衝突隨之而來。"
 SEA_japan_popup_events.38.a: "為了無產階級！"
 SEA_japan_popup_events.38.b: "我們必須阻止這種愚行！"
 SEA_japan_popup_events.39.t: "佛教復興"
 SEA_japan_popup_events.39.desc: "由於我們的雨傘運動整合了日本各地的各類社會主義運動，以妹尾義郎為首的佛教社會主義運動迅速發展，青年復興佛教聯盟已成為我們社會主義青年的首選運動。現在，黨的顧問辻潤就領導權問題向[ROOT.GetLeader]施壓，聲稱由廣受歡迎的妹尾義郎來領導政黨會更有利於國家。這會是實現精神解放以及社會和經濟解放的正確道路嗎？"
 SEA_japan_popup_events.39.a: "這就是前進之路！"
 SEA_japan_popup_events.39.b: "不，[ROOT.GetLeader]將繼續領導"
 SEA_japan_popup_events.40.t: "[JAP.GetAdjective]擴張的報告令人憂慮"
 SEA_japan_popup_events.40.desc: "隨著[JAP.GetNameDef]在亞洲迅速擴張，侵佔鄰國、摧毀這些國家的國力，我們的工業和自然資源卻仍在支撐著他們的經濟，源源不斷地流入他們的工廠，被製成戰爭武器。如今，我國民眾對此愈發不滿，紛紛呼籲採取行動。我們該怎麼做？"
 SEA_japan_popup_events.40.a: "我們不能繼續用我們的原料來供應他們的戰爭！"
 SEA_japan_popup_events.40.b: "沒關係，亞洲國家不會對我們構成威脅"
 SEA_japan_popup_events.41.t: "[FROM.GetAdjective]禁運"
 SEA_japan_popup_events.41.desc: "基於我們適度的擴張和對敵人的綏靖政策，好戰的[FROM.GetAdjective]民眾似乎已向[FROM.GetNameDef]的領導人[FROM.GetLeader]施壓，對我們實施了禁運。他們決定，兩國之間將不再進行任何貿易，這顯然違背了他們原本對我們的中立立場……"
 SEA_japan_popup_events.41.a: "他們走錯了方向"
 SEA_japan_popup_events.42.t: "人民對[ROOT.GetLeader]失去信任"
 SEA_japan_popup_events.42.desc: "隨著東亞戰場變成政治雷區，大片領土在敵人面前無人防守，民眾開始質疑[ROOT.GetLeader]贏得戰爭的能力。重振戰事也好，組建更有能力的內閣也罷，若不能迅速解決當前局勢，這場戰爭幾乎已等同於失敗……"
 SEA_japan_popup_events.42.a: "我們必須擺脫這泥潭！"
 JAP_unlock_the_surrender_subbranch_tt: "解鎖§Y$JAP_the_koiso_cabinet$§!、§Y$JAP_the_war_has_not_necessarily_developed_focus$§!、§Y$JAP_japans_longest_day$§!和§Y$JAP_the_surrender_broadcast$§!，允許移除§Y$JAP_crumbling_military_cabinet_idea$§!，並可以退出東亞戰爭"
 SEA_japan_popup_events.43.t: "宮城事件"
 SEA_japan_popup_events.43.desc: "聽聞天皇有意正式宣佈結束東亞戰爭，畑中健二少佐麾下的幾名政變分子已開始行動，企圖說服近衛師團協助其佔領東京皇居並對天皇實施軟禁。田中靜壹將軍與森赳將軍已準備迅速鎮壓這場未遂政變，但最終鹿死誰手猶未可知。"
 SEA_japan_popup_events.43.a: "他們怎麼敢違抗天皇的意願？"
 SEA_japan_popup_events.43.b: "天皇治下的陰雲必須消散！"
 JAP_kyujo_incident_rebels_lost_flag: "宮城政變失敗，政變者被逮捕"
 JAP_kyujo_incident_rebels_won_flag: "宮城政變成功，政變者將天皇軟禁起來"
 JAP_unlock_japans_longest_day_tt: "解鎖國策：§Y$JAP_japans_longest_day$§!"
 JAP_unlock_surrender_broadcast_tt: "解鎖國策：§Y$JAP_the_surrender_broadcast$§!"
 SEA_japan_popup_events.44.t: "霍爾洛·喬巴山的崛起"
 SEA_japan_popup_events.44.desc: "身為蒙古人民軍總司令以及1921年蒙古革命的偉大領導人之一，霍爾洛·喬巴山是帶領我國走向偉大的強有力人選。憑藉他最近的軍事功績，他已證明自己有能力真正以唯一領導者的身份統治國家。現在，是否是由他接任部長會議第十任主席的時機？"
 SEA_japan_popup_events.44.a: "時機已至"
 SEA_japan_popup_events.44.b: "不，他必須留在戰場上！"
 SEA_japan_popup_events.45.t: "佔領冀東自治政府"
 SEA_japan_popup_events.45.desc: "隨著日軍指揮部的瓦解及日本本土內戰的爆發，我們西南邊境的日偽政權——冀東自治政府，此刻已處於無保護狀態。趁[JAP.GetAdjective]政府有太多其他問題要處理，無暇顧及大陸上的局勢，現在是發起攻擊的最佳時機。"
 SEA_japan_popup_events.45.a: "我們的整合仍在繼續"
 SEA_japan_popup_events.46.t: "關東軍佔領冀東"
 SEA_japan_popup_events.46.desc: "隨著陸軍指揮部的瓦解及本土內戰的爆發，我們在[MAN.GetNameDef]西南邊境的扶持政權——冀東自治政府，此刻已處於無保護狀態。因此，趁著我們政府有太多其他問題要處理，無暇顧及大陸上的局勢，他們決定趁機發動攻擊。"
 SEA_japan_popup_events.46.a: "我們稍後再處理他們……"
 SEA_japan_popup_events.47.t: "[FROM.GetNameDefCap]取消我們對[655.GetName]的資源開採權"
 SEA_japan_popup_events.47.desc: "[FROM.GetNameDef]的[FROM.GetLeader]最近簽署了一份新文件，悍然廢除了我們在[655.GetName]的林業和採礦權，全然不顧我們在俄國內戰結束時將該地區歸還給他們時所簽署的條約。"
 SEA_japan_popup_events.47.a: "北方有一場醞釀中的風暴……"
 SEA_japan_popup_events.48.t: "[ROOT.GetLeader]宣佈國家緊急狀態"
 SEA_japan_popup_events.48.desc: "敵軍部隊在我國領土登陸後，[ROOT.GetLeader]已宣佈戒嚴，並宣佈進入國家緊急狀態，直至將侵略者逐出我國領土。無人知曉這場戰事將持續多久，但所有人都清楚，這片土地再次落入了德川家的絕對掌控中。"
 SEA_japan_popup_events.48.a: "將絕對權力交給德川家，此前從未出過差錯"
 SEA_japan_popup_events.49.t: "[ROOT.GetLeader]被發現身亡！"
 SEA_japan_popup_events.49.desc: "作為海軍溫和派成員掌權後，[ROOT.GetLeader]深得民眾擁戴。然而隨著陸軍勢力再度擴張，他們似乎仍對他懷恨在心——就在今天早些時候，首相被發現死在了自己的官邸。儘管很可能是偽造，但在首相遺體上留有一份遺囑，指明將國家領導權移交給安達謙藏。"
 SEA_japan_popup_events.49.a: "軍國主義的幽靈仍然困擾著我們……"
 SEA_japan_popup_events.50.t: "特高課與文官的聯合要求"
 SEA_japan_popup_events.50.desc: "隨著大政翼贊會的成立，顯而易見的是，特高課長官安倍源基及文官系統的各領導人已明確表示對[ROOT.GetLeader]的舉措深感不滿。如今，他們要求其下野，由親納粹政客中野正剛接任。我們是否應接受這一施壓？"
 SEA_japan_popup_events.50.a: "很好，如果這就是他們想要的首相……"
 SEA_japan_popup_events.50.b: "我們不會遵從他們的要求！"
 ### BORDER INCIDENT EVENTS ###
 # Event for MON
 SEA_border_incidents_events.1.t: "我軍前往塔烏蘭"
 SEA_border_incidents_events.1.desc: "一隊不足100人的[ROOT.GetAdjective]陸軍士兵在六名蘇聯顧問的帶領下開始前往爭議地區[MAN.GetAdjective]村莊塔烏蘭。雖然[JAP.GetAdjective]軍隊尚未出現在該地區，但他們隨時可能到達並擊退我們。值得為這個村莊冒險嗎，還是說我們應該更加謹慎？"
 SEA_border_incidents_events.1.a: "這個村子屬於我們！"
 SEA_border_incidents_events.1.b: "我們必須命他們立即撤退！"
 # Event for JAP or MAN
 SEA_border_incidents_events.2.t: "塔烏蘭事件"
 SEA_border_incidents_events.2.desc: "一隊不足100人的[MON.GetAdjective]陸軍士兵在蘇聯顧問的帶領下佔領了爭議地區[MAN.GetAdjective]村莊塔烏蘭。看來不打一仗他們是不會撤退的，而我們若想完全控制[761.GetName]也必須打上這一仗。"
 SEA_border_incidents_events.2.a: "命令軍隊立刻出動！"
 SEA_border_incidents_events.2.b: "不值得動手……"
 # Event for MAN if overlord JAP decided to engage in the conflict
 SEA_border_incidents_events.3.t: "塔烏蘭事件"
 SEA_border_incidents_events.3.desc: "一隊不足100人的[MON.GetAdjective]陸軍士兵在蘇聯顧問的帶領下佔領了爭議地區[MAN.GetAdjective]村莊塔烏蘭。看來不打一仗他們是不會撤退的，而我們若想完全控制[761.GetName]也必須打上這一仗。我們的宗主國[JAP.GetNameDef]已下令立即行動，關東軍認為這種局面就是對天皇本人的侮辱。"
 SEA_border_incidents_events.3.a: "準備進攻！"
 ### THE TAURAN INCIDENT BORDER WAR ###
 SEA_border_incidents_events.4.t: "[FROM.GetAdjective]軍隊準備進攻塔烏蘭"
 SEA_border_incidents_events.4.desc: "對邊境村莊塔烏蘭的爭奪激化了我們與[FROM.GetNameDef]的緊張局勢，看起來他們現在正派兵前往該地區準備攻擊我們的駐軍。我們必須準備好戰至最後一人，將入侵者趕出[ROOT.GetAdjective]的神聖領土！"
 SEA_border_incidents_events.4.a: "風暴正在凝聚"
 SEA_border_incidents_events.5.t: "[JAP.GetAdjective]在貝爾湖獲勝"
 SEA_border_incidents_events.5.desc: "[MON.GetAdjective]與[JAP.GetAdjective]軍隊在貝爾湖附近的邊境地區爆發了衝突，根據報告，[MON.GetAdjective]軍隊正全線撤退。[JAP.GetAdjective]軍隊佔領了該地區一定數量的戰略高地，正準備重返塔烏蘭村。\n\n在戰鬥中，[JAP.GetAdjective]俘虜了一些[MON.GetAdjective]士兵和[SOV.GetAdjective]顧問，對敵軍士氣造成了一定打擊。"
 SEA_border_incidents_events.5.a: "我們已經體面地解決了爭端。"
 SEA_border_incidents_events.5.b: "希望他們不會繼續進軍……"
 SEA_border_incidents_events.6.t: "[JAP.GetAdjective]在貝爾湖戰敗"
 SEA_border_incidents_events.6.desc: "[MON.GetAdjective]和[JAP.GetAdjective]兩國的軍隊日前圍繞著貝爾湖所爆發的邊境衝突落下帷幕，[JAP.GetAdjective]駐烏蘭巴托大使現已呼籲兩國停火。\n\n戰鬥當中，[JAP.GetAdjective]數次對[MON.GetAdjective]陣地的猛攻均以傷亡慘烈的失敗告終，這不由得引起了[JAP.GetAdjective]軍方對本國軍隊戰鬥力的擔憂。"
 SEA_border_incidents_events.6.a: "光榮戰敗總勝過怯懦避戰"
 SEA_border_incidents_events.6.b: "我軍此戰表現出色。"
 SEA_border_incidents_events.7.t: "貝爾湖之戰陷入僵局"
 SEA_border_incidents_events.7.desc: "在雙方均撤出爭議地段以重新補給和集結後，[JAP.GetAdjective]和[MON.GetAdjective]兩國的軍隊圍繞著貝爾湖所爆發的邊境衝突暫且偃旗息鼓。也許是意識到繼續進攻亦無濟於事，[JAP.GetAdjective]軍方現已要求停火談判，並承認該村莊位於[MON.GetAdjective]境內。"
 SEA_border_incidents_events.7.a: "反正就是個沒什麼價值的村子"
 SEA_border_incidents_events.7.b: "它暫時歸我們了"
 SEA_border_incidents_events.8.t: "[FROM.GetNameDefCap]退讓"
 SEA_border_incidents_events.8.desc: "在我們佔領塔烏蘭村後，[FROM.GetAdjective]部隊似乎已經撤退，沒有重返的跡象。意識到繼續進攻將徒勞無功，[JAP.GetAdjective]軍方承認該村莊位於[ROOT.GetAdjective]境內。"
 SEA_border_incidents_events.8.a: "太好了"
 if_they_back_down_or_lose_a_border_conflict_tt: "如果他們退讓或輸掉邊境衝突："
 ### STRIKE SOUTH EVENTS ###
 SEA_imperial_influence_events.500.t: "海軍派系請命南征"
 SEA_imperial_influence_events.500.desc: "[ROOT.GetLeader]剛收到海軍總部簽署的信函，稱他們對東印度群島資源的需求現已達到緊要關頭，要求立即開始全面實施“南方打擊”計劃。雖然可以對此置之不理，但一味拖延恐非良策。"
 SEA_imperial_influence_events.500.a: "必須迅速做好準備！"
 take_the_strike_south_focus_tt: "完成§Y$JAP_strike_the_southern_road$§!並與§Y西方列強§!開戰，將平息$JAP_naval_faction$"
 SEA_imperial_influence_events.501.t: "海軍軍官憤然辭職"
 SEA_imperial_influence_events.501.desc: "因未能在海軍總部規定時間內執行“南方打擊”計劃，向[ROOT.GetLeader]施壓的海軍軍官均已辭職。"
 SEA_imperial_influence_events.501.a: "何等卑鄙的行為！"
 ### TOKKO EVENTS ###
 SEA_japan_tokko_arrest_events.1.t: "人民陣線事件"
 SEA_japan_tokko_arrest_events.1.desc: "特高課已發現威脅國內穩定的因素。似乎有一些社會主義和共產主義組織企圖破壞社會秩序。一份逮捕名單已經擬定，其中包括多名共產黨高層成員，如荒畑寒村、江田三郎、美濃部亮吉、向坂逸郎、佐佐木更三、鈴木茂三郎、高野實，以及山川均。"
 SEA_japan_tokko_arrest_events.1.a: "好消息"
 JAP_popular_front_incident_tt: "各類共產主義政客和煽動者將被逮捕"
 SEA_japan_tokko_arrest_events.2.t: "考克斯事件"
 SEA_japan_tokko_arrest_events.2.desc: "特高課已發現威脅國內穩定的因素。11名旅日英國公民因涉嫌違反《軍事機密保護法》將被逮捕，其中主謀為路透社東京分社社長MJ·考克斯。儘管[ENG.GetAdjective]政府聲稱這些人並非間諜，但他們仍然被帶到憲兵總部大樓接受審訊。"
 SEA_japan_tokko_arrest_events.2.a: "外國間諜罪有應得！"
 SEA_japan_tokko_arrest_events.2.b: "儘量不要激怒[ENG.GetAdjective]"
 JAP_cox_incident_tt: "多名涉嫌間諜活動的[ENG.GetAdjective]公民將被逮捕"
 SEA_japan_tokko_arrest_events.3.t: "合作社事件" # or Kyōsakusha
 SEA_japan_tokko_arrest_events.3.desc: "特高課再度發現威脅國內穩定的因素。滿鐵調查部多名成員已被關東軍憲兵隊二次逮捕，他們涉嫌在殖民地散佈反日與共產主義宣傳。調查顯示，這些人還使用本土明令禁止的馬克思主義方法進行社會研究與分析。這一陰謀可能牽涉甚廣，應該如何處置？"
 SEA_japan_tokko_arrest_events.3.a: "將此事交由關東軍處理"
 SEA_japan_tokko_arrest_events.3.b: "我們必須立即實施大規模逮捕！"
 SEA_japan_tokko_arrest_events.3.c: "他們不構成威脅，不必理會"
 SEA_japan_tokko_arrest_events.4.t: "佐爾格事件"
 SEA_japan_tokko_arrest_events.4.desc: "特高課再度發現威脅國內穩定的因素。這一次，他們發現了一個由[GER.GetAdjective]記者理查德·佐爾格領導的[SOV.GetAdjective]間諜團伙，該組織已被查明在我國各地從事間諜活動和顛覆活動。他們似乎還發展了一些同謀，例如前朝日新聞記者尾崎秀實和我國貴族出身的西園寺浩一。"
 SEA_japan_tokko_arrest_events.4.a: "外國間諜罪有應得！"
 SEA_japan_tokko_arrest_events.4.b: "儘量別惹[SOV.GetAdjective]人"
 JAP_sorge_incident_tt: "多名從事疑似間諜活動的[SOV.GetAdjective]僑民及其國內關聯人員將被拘捕"
 SEA_japan_tokko_arrest_events.5.t: "橫濱事件"
 SEA_japan_tokko_arrest_events.5.desc: "橫濱特高課以企圖重建共產黨的罪名逮捕了近三十名知識分子——該黨此前已被特高課強行解散。嫌疑人包括《中央公論》、《改造》和《日本評論》等雜誌的編輯。看來我們的執法部門在保護國家精神免受思想侵蝕方面做得很好。"
 SEA_japan_tokko_arrest_events.5.a: "又一批異見分子被鎮壓"
 SEA_japan_tokko_arrest_events.6.t: "中野正剛事件"
 SEA_japan_tokko_arrest_events.6.desc: "極右翼政黨東方會創始人及領袖中野正剛已被逮捕。此前，該黨因受到打壓而無法繼續進行合法活動，看來他們自認為是受到內閣的“政治迫害”，正計劃採取非法直接行動。真是無恥！"
 SEA_japan_tokko_arrest_events.6.a: "他竟敢詆譭我們的首相？立刻逮捕！"
 SEA_japan_tokko_arrest_events.7.t: "竹槍事件"
 SEA_japan_tokko_arrest_events.7.desc: "《每日新聞》首席記者新名丈夫因批評戰爭政策被特高課逮捕。據稱他在陸海軍對立的背景下聲稱“竹槍派不上用場，需要的是飛機，是海上航空力量”，以及“大東亞戰爭勝負取決於加強海空軍力，我們無法用竹槍對抗敵軍的空中力量”，直接批評了我們的陸軍領導層，同時宣揚只有海軍能帶來勝利。"
 SEA_japan_tokko_arrest_events.7.a: "他們為什麼不相信我們能贏得這場戰爭？"
 SEA_japan_tokko_arrest_events.8.t: "合作社事件"
 SEA_japan_tokko_arrest_events.8.desc: "滿鐵調查部多名成員已被關東軍憲兵隊二次逮捕，罪名是涉嫌散佈反日及共產主義宣傳。[JAP.GetNameDefCap]指示我們妥善處理此事，但不會直接干預。應該如何處理這一局面？"
 SEA_japan_tokko_arrest_events.8.a: "遵照指令，立即展開大規模逮捕！"
 SEA_japan_tokko_arrest_events.8.b: "壓住此事，反正這對我們有利"
 #####################################
