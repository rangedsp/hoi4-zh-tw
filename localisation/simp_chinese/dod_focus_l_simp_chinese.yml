 release_dalmatia_tt: "釋放§Y達爾馬提亞§!為傀儡國。"
 release_transylvania_tt: "釋放§Y特蘭西瓦尼亞§!為傀儡國。"
 release_vojvodina_tt: "釋放§Y伏伊伏丁那§!為傀儡國。"
 release_dalmatia_units_tt: "（§Y達爾馬提亞§!）組建§Y1個民兵師§!。"
