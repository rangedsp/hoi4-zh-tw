 vojvodina_create_one_units_tt: "（§Y伏伊伏丁那§!）組建§Y1個民兵師§!。"
 all_subjects_become_fascist_tt: "所有在§Y歐洲§!的附庸國轉變為§Y法西斯主義§!政體。"
 neutral_to_fascist_tt: "所有§Y中立主義§!黨派支持率轉變為§Y法西斯主義§!黨派支持率。"
 YUG_towards_independence_mod: "南斯拉夫推進獨立"
 YUGOSLAV_DEFENCE_LEAGUE: "巴爾幹防衛聯盟"
 YUG_crush_ustasa: "烏斯塔沙暴動迫近"
 YUG_crush_ustasa_desc: "政府決定鎮壓法西斯團體烏斯塔沙，這激怒了克羅地亞獨立的支持者，而烏斯塔沙也在迅速準備反政府的武裝暴動。如果我們不能及時剷除烏斯塔沙，這個法西斯組織很可能會控制克羅地亞地區，向我國舉起叛旗。"
 YUG_ustasa_uprising: "烏斯塔沙暴動"
 YUG_ustasa_uprising_desc: "如果不能及時遏制烏斯塔沙暴動，我國將面臨克羅地亞人發動的重大叛亂。"
 YUG_ustasa_crushed_mission: "平息烏斯塔沙暴動"
 YUG_ustasa_crushed_mission_desc: "如果我們能加強對克羅地亞的控制，則烏斯塔沙的暴動將被平息，克羅地亞民族主義者造成的所有困難亦會暫時得到遏制。"
 YUG_delay_ustasa_uprising: "延緩暴動"
 YUG_delay_ustasa_uprising_desc: "隨著烏斯塔沙的崛起，政府現在必須採取措施，儘量拖延克羅地亞地區叛亂的爆發。儘管此舉也將延遲我們終結克羅地亞民族主義的行動，但延緩其暴動或許是必要的。"
 YUG_croat_concessions: "向克羅地亞人讓步"
 YUG_croat_concessions_desc: "自從我們決定打擊烏斯塔沙以來，我們對待克羅地亞民眾的方式就被廣泛認為是殘忍和不人道的。也許通過對克羅地亞人民給予一些寬容，可以使他們開始對我們的看法有一些改觀。"
 YUG_croat_concessions_cooldown: "向克羅地亞人讓步"
 YUG_croat_concessions_cooldown_desc: "自從我們決定打擊烏斯塔沙以來，我們對待克羅地亞民眾的方式就被廣泛認為是殘忍和不人道的。也許通過對克羅地亞人民給予一些寬容，可以使他們開始對我們的看法有一些改觀。"
 YUG_positive_discrimination_croat: "對克羅地亞人進行優待"
 YUG_positive_discrimination_croat_desc: "克羅地亞這個地方，除克族本身之外，也是許多不同民族背景的居民的文化本土。通過在當地制定有利於克羅地亞人就業和收入的法律，烏斯塔沙向當地人許諾的自決願景，也許亦能由我們來實現。"
 YUG_positive_discrimination_croat_cooldown: "對克羅地亞人進行優待"
 YUG_positive_discrimination_croat_cooldown_desc: "克羅地亞這個地方，除克族本身之外，也是許多不同民族背景的居民的文化本土。通過在當地制定有利於克羅地亞人就業和收入的法律，烏斯塔沙向當地人許諾的自決願景，也許亦能由我們來實現。"
 YUG_listening_posts_croatia: "在克羅地亞建立監聽站"
 YUG_listening_posts_croatia_desc: "為避人耳目，烏斯塔沙現正展開地下活動密謀叛國。也許通過說服一些親南斯拉夫的良民潛入烏斯塔沙，我們可以探聽並破壞他們在地區的行動和宣傳。"
 YUG_listening_posts_cooldown: "在克羅地亞建立監聽站"
 YUG_listening_posts_cooldown_desc: "為避人耳目，烏斯塔沙現正展開地下活動密謀叛國。也許通過說服一些親南斯拉夫的良民潛入烏斯塔沙，我們可以探聽並破壞他們在地區的行動和宣傳。"
 YUG_progress_crushing_decisions: "鎮壓烏斯塔沙"
 YUG_progress_crushing_decisions_desc: "消滅烏斯塔沙這個法西斯集團的時候到了。儘管可能會有很多人把這些行動本身當作法西斯主義行徑，但我們有自知之明：為確保我國長治久安，這些措施是絕對必要的。"
 YUG_raid_croat_villages: "突襲克羅地亞村莊"
 YUG_raid_croat_villages_desc: "烏斯塔沙簡直是無處不在，任何人都有可能背地裡是這些法西斯黨徒的支持者。我們必須突襲克羅地亞地區內的所有城鎮和村莊，挖出深藏於其中的叛徒。"
 YUG_shut_down_recruitment_centers: "剷除烏斯塔沙訓練營"
 YUG_shut_down_recruitment_centers_desc: "烏斯塔沙也有自己的練兵營，來訓練任何會為其事業而糟蹋生命的蠢貨，並把他們武裝起來。我們必須定位並剷除這些訓練營，使烏斯塔沙短於人力。"
 YUG_arrest_ustasa_leaders: "逮捕烏斯塔沙頭目"
 YUG_arrest_ustasa_leaders_desc: "我們拿到了一份名單，上面記錄著烏斯塔沙運動的重要人物。是時候讓這份名單派上用場，把這幫人都逮到牢子裡了。"
 YUG_croatian_recruitment: "徵募克羅地亞人參軍"
 YUG_croatian_recruitment_desc: "所有克羅地亞人都在盤算著獨立，但並非所有人都支持烏斯塔沙。現在，是時候徵募一些可靠的克族小夥子加入我國軍隊中了。我們會向克羅地亞民眾證明，還是有人更希望克羅地亞安全地留在南斯拉夫這個溫暖大家庭的懷抱中。"
 YUG_croat_raid_cooldown: "突襲克羅地亞村莊"
 YUG_croat_raid_cooldown_desc: "烏斯塔沙簡直是無處不在，任何人都有可能背地裡是這些法西斯黨徒的支持者。我們必須突襲克羅地亞地區內的所有城鎮和村莊，挖出深藏於其中的叛徒。"
 YUG_shut_down_recruitment_centers_cooldown: "剷除烏斯塔沙訓練營"
 YUG_shut_down_recruitment_centers_cooldown_desc: "烏斯塔沙也有自己的練兵營，來訓練任何會為其事業而糟蹋生命的蠢貨，並把他們武裝起來。我們必須定位並剷除這些訓練營，使烏斯塔沙短於人力。"
 YUG_arrest_ustasa_leaders_cooldown: "逮捕烏斯塔沙頭目"
 YUG_arrest_ustasa_leaders_cooldown_desc: "我們拿到了一份名單，上面記錄著烏斯塔沙運動的重要人物。是時候讓這份名單派上用場，把這幫人都逮到牢子裡了。"
 ustasa_crushed: "烏斯塔沙已被粉碎"
