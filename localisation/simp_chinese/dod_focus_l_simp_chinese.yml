 YUG_arrest_ustasa_flag: "近期已逮捕烏斯塔沙頭目"
 YUG_recruitment_flag: "已招募克羅地亞裔兵員"
 YUG_royal_party: "卡拉喬傑維奇王朝"
 YUG_peasant_uprisings: "煽動農民暴動"
 YUG_peasant_uprisings_desc: "巴爾幹人民在帝國主義的鐵蹄下受苦受難已經夠久了！我們將向受苦受難的巴爾幹勞苦大眾伸出援手，組織他們罷工和示威，直到資產階級受到正義的制裁！"
 instigating_a_coup: "煽動農民起義"
 YUG_german_military_mission: "德國技術監管"
 YUG_medal_for_extreme_bravery: "英勇勳章"
 YUG_medal_for_extreme_bravery_desc: "我軍將士在四面受敵中英勇奮戰，為此，我們需要設立新的勳章來紀念其堅定的精神。"
 yug_extreme_bravery_medal: "§Y[ROOT.GetNameDefCap]§!現可向§Y戰地軍官§!頒發§Y特級英勇勳章§!。"
 YUG_brigadistas: "國際縱隊"
 YUG_brigadistas_desc: "許多勇敢的南斯拉夫公民強烈要求參加正在進行的西班牙內戰，以對抗我們共同的敵人。"
 ROM_crack_down_on_extremism: "鎮壓極端主義"
 ROM_crack_down_on_extremism_desc: "我國的政治風氣此前在國王的統治下明顯右傾，這意味著仍有不少極端勢力在社會上操弄著人心。我們必須將這些不穩定的因素徹底剷除，以確保民眾享有更穩定的未來。"
 ROM_national_christian_party: "國家基督教黨"
 ROM_national_christian_party_desc: "作家奧克塔維安·戈加利通過其領導的國家基督教黨，在我國擁有著巨大的影響力。同時，由於他農民黨的出身，他在廣大鄉村社區亦人脈甚廣。通過對內閣實施改組，我們可以將他的這股影響力利用起來。"
