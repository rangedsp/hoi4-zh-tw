l_simp_chinese:
 HUN_balanced_budget: "平衡預算"
 HUN_balanced_budget_desc: "我們必須充分利用所掌握的資源，精心謀劃和平衡預算是政府取得成功的關鍵。"
 HUN_strengthen_the_monarchists: "強化君主派"
 HUN_strengthen_the_monarchists_desc: "為了恢復匈牙利往昔的榮光，我們必須首先對那些主張重建君主制的黨派進行強化。"
 HUN_elect_a_king: "推舉新君主"
 HUN_elect_a_king_desc: "如今，公眾已經十分支持國家恢復君主制，現在我們可以開始考慮推舉新國王的有關事宜。"
 HUN_invite_the_habsburg_prince: "邀請哈布斯堡皇子"
 HUN_invite_the_habsburg_prince_desc: "哈布斯堡王朝長久以來都統治著匈牙利，在他們的權御下，這個國家曾是歐洲最偉大的帝國之一。重建哈布斯堡王朝，必將使匈牙利再次邁向偉大。"
 HUN_demand_a_referendum: "要求全民公投"
 HUN_demand_a_referendum_desc: "奧匈帝國解體是歷史的錯誤，奧地利與匈牙利兩國的聯合既能使彼此更加強大，同時也是重鑄王朝偉業的必要條件。有鑑於此，奧地利必須就和平實現兩國聯合的提議舉行公投。"
 HUN_take_austria_by_force: "武力攻取奧地利"
 HUN_take_austria_by_force_desc: "若要再現匈牙利往昔的榮光，我們必須首先將奧地利的領土重新納入版圖。我們不能冒險指望通過外交途徑達成這點，只能通過武力將其拿下。"
 HUN_proclaim_the_restoration_of_austria_hungary: "重建奧匈帝國"
 HUN_proclaim_the_restoration_of_austria_hungary_desc: "隨著兩國的統一以及哈布斯堡家族重登皇位，我們現在可以莊嚴地宣告奧匈帝國的重生，並就此踏上收復我國曆史法理領土的征程！"
 HUN_protect_czechoslovakia: "保護捷克斯洛伐克"
 HUN_protect_czechoslovakia_desc: "捷克斯洛伐克自獨立來已變得強大而繁榮，但他們的鄰國卻對其領土虎視眈眈。無論是重新接納他們成為帝國的一部分，還是給予其協作地位，我們都將向他們提供保護以應對這些威脅。"
 HUN_claim_transylvania: "宣稱特蘭西瓦尼亞"
 HUN_claim_transylvania_desc: "“撒克遜七堡”在上次世界大戰後被不公正地從我們手中奪走，現在是時候將其收復了。"
 HUN_march_to_the_shore: "向海岸進軍"
 HUN_march_to_the_shore_desc: "真正的大國需要觸及海洋，而亞得里亞海沿岸正是我們與生俱來的法理領土。"
 HUN_reclaim_venetia: "收復威尼西亞"
 HUN_reclaim_venetia_desc: "意大利人在上次世界大戰中的背叛可並沒有被遺忘，現在是時候擺正他們的位置，並恢復我帝國的天然疆域了。"
 HUN_claim_galicia: "宣稱加利西亞"
 HUN_claim_galicia_desc: "所謂波蘭的國家只不過是個人造物，我們可以根據需要進行肆意擺弄。"
 HUN_claim_the_bucovina: "宣稱布科維納"
 HUN_claim_the_bucovina_desc: "儘管此地可能不是我們眾多領土宣稱當中最重要的，但既然它仍為帝國的組成部分，我們自然也會將其收復。"
 HUN_reclaim_the_empire: "再造帝國"
 HUN_reclaim_the_empire_desc: "為了實現我們最終的領土訴求，我們必須在德意志、意大利和巴勒斯坦的諸多領土宣稱上鐫刻我們哈布斯堡陛下的聖名。"
 HUN_elect_a_democratic_king: "推舉立憲君主"
 HUN_elect_a_democratic_king_desc: "我們必須推選一位維護國家民主原則和人民權利的國王。"
 HUN_responsible_government: "責任政府制"
 HUN_responsible_government_desc: "長久以來由於我國政府只對國王負責，其常常對人民的意願置若罔聞。為此，我們將修訂憲法來確保政府從對統治者負責轉而對人民負責。"
 HUN_rapproachement_with_little_entente: "與小協約國和解"
 HUN_rapproachement_with_little_entente_desc: "鑑於我們周遭皆是意識形態上敵對的國家，我們必須重新定位與毗鄰的小協約國集團成員的關係。為此，我們會在重整軍備的問題上徵求他們的意見。"
 HUN_join_allies: "加入同盟國"
 HUN_join_allies_desc: "匈牙利的未來和民主價值觀與西方民主大國及其盟友休慼相關。如果加入他們的聯盟體系，我們既可以增強彼此的實力，也可以得到盟友的支持。"
 HUN_the_balkan_pact: "巴爾幹條約"
 HUN_the_balkan_pact_desc: "鑑於西方民主諸國相距甚遠，倘若有事無法及時相援，我們必須就近與鄰國締盟。屆時，作為巴爾幹條約陣營的領袖，我們將守望相助，共赴勝利！"
 HUN_an_unlikely_alliance: "不可思議的聯盟"
 HUN_an_unlikely_alliance_desc: "我們從根本上對國家實現了革新，如今的我們已不再是舊日的戰爭狂人。是時候向那些舊日的對手伸出橄欖枝，共建新的命運了。"
 HUN_joint_oil_exploitation_company: "聯合石油開發公司"
 HUN_joint_oil_exploitation_company_desc: "隨著我國境內可能勘探出油田的消息不脛而走，我們已經引起了國外勢力的注意。與我們交好的國家正迫切希望利用他們的技術來援建我國的石油工業——而這，正好是我們可以學習他們先進技術、有利可圖的機會。"
 HUN_elect_a_fascist_king: "推舉法西斯君主"
 HUN_elect_a_fascist_king_desc: "我國需要一位鐵腕領袖來領導它挺過即將到來的動盪歲月。因此，我們的統治者必須是一位受人民敬仰，同時也令敵人畏懼的偉人。"
 HUN_economic_intervention: "經濟干預"
 HUN_economic_intervention_desc: "我們必須投入充足的政治資源來指導經濟，也許目前經濟狀況姑且還算過得去，但我們可以使其變得更加繁榮高效。"
 HUN_strengthen_fascists: "強化法西斯派"
 HUN_strengthen_fascists_desc: "我們必須加強對法西斯主義的宣傳，併為其意識形態的傳播提供公共渠道。他們對匈牙利未來的構想，最有可能使這個國家再次走向偉大。"
 HUN_renounce_the_treaty_of_trianon: "撕毀《特里亞農條約》"
 HUN_renounce_the_treaty_of_trianon_tt: "§Y霍爾蒂·米克洛什§!或§Y梅克倫堡-什未林的弗里德里希·弗朗茨§!成為國家領導人。\n"
 HUN_renounce_the_treaty_of_trianon_desc: "上次世界大戰結束後，《特里亞農條約》剝奪了我們曾經偉大的國家三分之二的領土和人口，如此不公的羞辱，幾乎能與《凡爾賽和約》中德國遭受的恥辱相提並論，此等喪權辱國之產物必須被廢除。"
 HUN_renew_the_rome_protocols: "重申《羅馬議定書》"
 HUN_renew_the_rome_protocols_desc: "鑑於德國正在修正主義的歧途上漸行漸遠，我們必須重申在1934年起草簽署的《羅馬議定書》。這些協議不僅將進一步隔絕來自德國和南斯拉夫的威脅，甚至還可能成為一個真正聯盟體系的前身。"
 HUN_protect_austria: "保護奧地利"
 HUN_protect_austria_desc: "為了進一步對抗德國，我們必須阻止他們合併奧地利的野心。我們可以向奧地利作出承諾，給予現任政府他們所需要的政治力量，以支持他們對抗親德分子。"
 HUN_alliance_with_italy: "與意大利結盟"
 HUN_alliance_with_italy_desc: "現在可以對《羅馬議定書》最初提議的聯盟進行擴展了。為此，我們將派遣代表團訪問意大利，討論簽署一項具有約束效力、在攻防兩方面進行廣泛軍事合作的協議。"
 HUN_trade_deal_with_germany: "對德貿易協議"
 HUN_trade_deal_with_germany_desc: "強化我國與德國之間貿易關係能帶來的好處顯而易見，所謂我國對德國經濟過度依賴的說法實屬誇大其詞。我們兩國將深入拓展，進而簽署一份廣泛的貿易協議。"
 HUN_joint_aluminum_mining_company: "聯合鋁業公司"
 HUN_joint_aluminum_mining_company_desc: "鑑於鋁是現代戰爭工業中不可或缺的資源，我們可以很容易地從德國方面得到援助，進而擴大我國北部鋁礦的採掘。"
 HUN_join_axis: "加入軸心國"
 HUN_join_axis_desc: "鑑於我國經濟已與德國密不可分，因此在戰時追隨他們是唯一合乎邏輯的選擇。為此，我們將向他們遞交申請，正式加入軸心國集團。"
 HUN_reaffirm_territorial_claims: "重申領土主張"
 HUN_reaffirm_territorial_claims_desc: "在掙脫了《特里亞農條約》的束縛後，我們現在必須重申對那些被竊據領土的主張。"
 HUN_demand_transylvania: "索取特蘭西瓦尼亞"
 HUN_demand_transylvania_desc: "如果我們能兵不血刃地收復領土，那就再好不過了。因此，我們將向羅馬尼亞遞交最後通牒，要求他們歸還我們的法理領土。"
 HUN_demand_southern_slovakia: "索取南斯洛伐克"
 HUN_demand_southern_slovakia_desc: "如果我們能兵不血刃地收復領土，那就再好不過了。因此，我們將向捷克斯洛伐克遞交最後通牒，要求他們歸還我們的法理領土。"
 HUN_demand_the_vojvodina: "索取伏伊伏丁那"
 HUN_demand_the_vojvodina_desc: "如果我們能兵不血刃地收復領土，那就再好不過了。因此，我們將向南斯拉夫遞交最後通牒，要求他們歸還我們的法理領土。"
 HUN_claim_overlordship_over_slovakia: "索取斯洛伐克宗主權"
 HUN_claim_overlordship_over_slovakia_desc: "斯洛伐克的其餘部分也必須通過直接合並亦或是成為附屬國的方式重新併入匈牙利。為此，我們將再次遞交最後通牒。"
 HUN_proclaim_greater_hungary: "宣告大匈牙利成立"
 HUN_proclaim_greater_hungary_desc: "在收復了我們的法理領土後，我國的疆域已經拓展至歷史上的界線。我們現在可以自信地向世人宣告大匈牙利的成立，並將目光投向新的目標。"
 HUN_GREATER_tt: "變更國名為§Y大匈牙利§!\n"
 HUN_demands_tt: "當索取領土時，如果你擁有強大的軍隊，目標國家更可能迫於壓力和平移交此地。然而，如果他們身處某個陣營中，他們可能仍然會自信有能力對抗你。\n"
 HUN_assassinate_horthy: "刺殺霍爾蒂"
 HUN_assassinate_horthy_desc: "這位昔日世界大戰時的海軍上將利用他作為匈牙利王國攝政的身份，如今已權勢滔天，而他的反共立場現已證明對同志們的工作造成了嚴重的問題。如果我們的國家要走上革命的道路，此人就必須被從權力中心剷除。"
 HUN_council_of_peoples_commissars: "人民部長會議"
 HUN_council_of_peoples_commissars_desc: "我們必須組建一個管理機構，來督導匈牙利向共產主義國家實現轉變。事成之後，這個機構將會順勢轉變為仿西方政體、由部長閣僚等組成的內閣。"
 HUN_the_hungarian_red_army: "匈牙利紅軍"
 HUN_the_hungarian_red_army_desc: "凡是熱愛祖國的愛國者，都必須為保衛祖國盡到自己的職責。我們將仿效蘇聯模式，建立匈牙利紅軍來保衛剛剛起步的革命。"
 HUN_soviet_hungarian_military_academy: "蘇匈聯合軍事學院"
 HUN_soviet_hungarian_military_academy_desc: "若是沒有領導者，我們的軍隊便是一群烏合之眾。蘇聯同志在軍事上積累了很多經驗，所以與他們合作培養我們自己的軍事將才或許將事半功倍。為此，我們將設立一個由兩國最有經驗的教官構成的軍事學院。"
 HUN_join_comintern: "加入共產國際"
 HUN_join_comintern_desc: "革命的前進方向在於共產國際。我們將與親密的同志們攜手並肩，聯手擺脫不公的資本主義壓迫以及西方的法西斯主義威脅。"
 HUN_the_revolutionary_council: "革命委員會"
 HUN_the_revolutionary_council_desc: "共產國際已經放棄了反帝鬥爭，甘願選擇與其和平共處。如果世界上的工人階級要獲得解放，我們就必須高舉馬克思與列寧的火炬繼續前進，如有必要，甚至可以對抗蘇聯。"
 HUN_FACTION_COMMIE: "蘇維埃共產主義聯盟"
 HUN_pressure_romania: "對羅馬尼亞施壓"
 HUN_pressure_romania_desc: "當我們聚焦於西方的法西斯威脅時，就不能讓潛在的威脅繼續存在於後方，尤其是這樣的威脅還橫亙在我們和東方盟友之間。羅馬尼亞必須被確保改造為一個共產主義國家，否則我們賴以接收盟友援助的重要陸上交通線就將受到影響。"
 HUN_intervene_in_czechoslovakia: "干涉捷克斯洛伐克"
 HUN_intervene_in_czechoslovakia_desc: "捷克斯洛伐克此前根據《特里亞農條約》獲得了我國的一些領土，與此同時，我們知道德國也正在圖謀奪取他們的國家。因此，也許我們能夠達成一筆交易，在蘇聯軍事支援的擔保下，於德國發動入侵時收回那些法理領土。"
 HUN_industrial_revitalization: "工業振興"
 HUN_industrial_revitalization_desc: "近幾年來，我們的工業基地已經衰敗不堪，現在必須努力採用新技術以迎頭趕上時代潮流。"
 HUN_support_urbanization: "促進城市化"
 HUN_support_urbanization_desc: "如今越來越多的人正離開他們在鄉村小鎮的故鄉，為在新工廠中找份工作而遷徙到大城市裡面。因此，我們即使不能立即提供足夠的就業機會，也可以建設新的城區來為今後的擴張做好準備。"
 HUN_institute_for_industrial_techniques: "工業技術研究所"
 HUN_institute_for_industrial_techniques_desc: "工業研究的隨意性導致了經濟增長遲緩和生產力下降等種種弊端。為此，我們應該設立新的研究所，將一切研究導向都聚焦於新式工業技術方法上面。"
 HUN_announce_the_gyor_program: "宣佈傑爾計劃"
 HUN_announce_the_gyor_program_desc: "我國武裝力量兵微將寡，急需在規模以及作戰能力上有所提升。而要實現這點，我們就必須大力扶持本國工業，滿足不斷增長的軍備需求。政府為期五年的傑爾計劃不僅將在軍事，同時亦將在工業、農業、基建和教育等配套領域進行廣泛的投入。"
 HUN_civilian_industry: "民用工業"
 HUN_civilian_industry_desc: "儘管發展軍工產業乃當務之需，但我們也絕不能忽視民眾的需求。為此，對民用工業的有序擴張亦將同步進行。"
 HUN_reintegrate_the_railroads: "重整鐵路網"
 HUN_reintegrate_the_railroads_desc: "自舊奧匈帝國解體以來，曾經連通獨立各國之間的鐵路網已支離破碎。我們應該與諸繼業者國家展開接洽，提出重整鐵路網，全面改善基礎設施的建議。"
 HUN_invite_foreign_investors: "邀請外國投資者"
 HUN_invite_foreign_investors_desc: "匈牙利地處東歐的心臟地帶，我們可以充分利用這樣的中央位置來吸引外資，對本國的基礎設施和工業加以建設。"
 HUN_expand_the_manfred_weiss_steel_works: "擴建曼弗雷德·魏斯鋼廠"
 HUN_expand_the_manfred_weiss_steel_works_desc: "自上次世界大戰的大規模設施擴張以來，龐大的曼弗雷德·魏斯鋼廠一直都是國防領域的綜合承包商。如果我們要為下場戰爭擴充軍力，就必須對這個民族工業的驕傲再次進行擴建。"
 HUN_expand_the_aluminum_industry: "發展鋁礦工業"
 HUN_expand_the_aluminum_industry_desc: "無論是出口還是自用，我們都需要竭盡所能地蒐羅任何可用的資源。儘管我國的鋁業已經有所發展，但也仍有擴張的空間。我們應立即對這個領域展開投資。"
 HUN_expand_the_technical_university_of_budapest: "擴建布達佩斯技術大學"
 HUN_expand_the_technical_university_of_budapest_desc: "我們需要更多優秀的頭腦集思廣益，幫助國家在未來的衝突當中實現技術上的突破。而通過對首都大學的擴建，我們可以顯著提升軍工領域的熟練工程師以及科研工作者人數。"
 HUN_support_domestic_industry: "扶持本國工業"
 HUN_support_domestic_industry_desc: "軍隊亟需更多的裝備，我們必須對軍工產業的擴張投注新資，使我國工業生產滿足需求。"
 HUN_domestic_arms_industry: "國家軍工產業"
 HUN_domestic_arms_industry_desc: "我國的軍工生產必須要有堅實的民用工業基礎相支撐，因此我們不僅要生產工業設備，同時也還要不斷拓建新的工廠。"
 HUN_autarky: "自給自足"
 HUN_autarky_desc: "鑑於我國對外國石油資源的依賴實在太深，也許我們應該仿效德國的經驗，在合成油技術上大下功夫。"
 HUN_synthetic_industry: "合成工業"
 HUN_synthetic_industry_desc: "我們現在已經掌握了煤炭液化的技術，是時候建設一座實驗工廠來展開試製了。"
 HUN_synthetic_oil_tt: "隨機在國內某個地區添加1座合成煉油廠。如果已經研發出合成油科技，則將顯示該廠的具體落成地區。\n"
 HUN_aeronautic_technology_institute: "航空技術研究所"
 HUN_aeronautic_technology_institute_desc: "如今天空已成為全新的戰場領域，不過其關鍵性還被許多人所低估。我們必須調撥資源發展相應的學說以及裝備，對這個領域的知識加以專精。"
 HUN_boost_hungarian_aviation_industry: "發展匈牙利航空工業"
 HUN_boost_hungarian_aviation_industry_desc: "我們必須對工業基地加以擴建，使其生產足夠的新式戰機來為我國奪取制空權。"
 HUN_secret_rearmament: "秘密軍備重整"
 HUN_secret_rearmament_desc: "儘管《特里亞農條約》嚴禁我國擴大軍隊規模，然而如今世界政局動盪不安，衝突已迫在眉睫，我們不能再繼續這樣毫無防備。軍備重整勢在必行，即便這意味著要秘密打破上次世界大戰後對我國所施加的和約限制。"
 HUN_secret_rearmament_tt: "§G解鎖§Y部分動員§!法案。§!\n"
 HUN_secret_rearmament_tt_2: "§R當徵兵法案提高到§Y志願兵役§!以上時，此項民族精神將被移除。§!\n"
 HUN_war_games: "軍事演習"
 HUN_war_games_desc: "通過組織小規模的軍事演習，我們可以找出當前軍隊架構當中的缺陷，並利用所習得的經驗來彌補不足之處。"
 HUN_theoretical_air_efforts: "重視空戰理論"
 HUN_theoretical_air_efforts_desc: "我們必須花大功夫來鑽研針對空戰的全新理論，若是我國身陷戰事，這些理論便會是彌足珍貴的無價之寶。"
 HUN_bled_agreement: "《布萊德協議》"
 HUN_bled_agreement_desc: "偷偷摸摸展開小規模的軍備重整顯然無濟於事，我們必須為此與鄰國相接洽，請求重修上次世界大戰後強加給本國的條約內容。匈牙利也該擁有發展軍備的平等權利。"
 HUN_bled_agreement_custom_effect_tooltip: "可能實現對§H《特里亞農條約》§!進行替換。"
 HUN_establish_the_air_force: "成立空軍"
 HUN_establish_the_air_force_desc: "隨著條約法規上限制的解除，現在是時候正式成立匈牙利國家空軍了。"
 HUN_indigenous_designs: "自主設計"
 HUN_indigenous_designs_desc: "我們自己的技術團隊便完全能夠滿足本國的需求。而在引導本國研發機構的過程中，我們還可以為其調撥更多的資源，進而加快設計的研發速度。"
 HUN_heavy_fighter_effort: "發展重型戰鬥機"
 HUN_heavy_fighter_effort_desc: "我軍戰鬥機必須為易受襲擊的轟炸機群提供支援。因此，即便是需要犧牲部分的速度和機動性，也要令作戰機種擁有更重型的武器以及更長的航程。"
 HUN_light_fighter_effort: "發展輕型戰鬥機"
 HUN_light_fighter_effort_desc: "我們需要戰鬥機群在地面部隊的頭頂上奪取制空權，同時攔截任何威脅本國領空的敵國戰機。"
 HUN_cas_focus: "發展近距支援機"
 HUN_cas_focus_desc: "現代化的軍隊不僅需要地面載具的支援，同時也需要空中的援護。"
 HUN_tac_focus: "發展戰術轟炸機"
 HUN_tac_focus_desc: "只有徹底消滅敵人的地面部隊才能取得戰爭的勝利。我們必須通過對近距離和縱深目標的戰術打擊，來支援我軍地面部隊。"
 HUN_license_foreign_designs: "外國設計許可"
 HUN_license_foreign_designs_desc: "外國空軍的表現已經證明，其擁有著歷經實戰考驗的高性能設計機種。因此，與其冒險靠我們剛剛起步的半吊子航空技術進行自研，還不如請求授權來生產這些外國機型。"
 HUN_fighter_competition: "戰鬥機競標"
 HUN_fighter_competition_desc: "若要請求外國授權生產許可，我們就必須貨比三家、擇優而用。為此，我們將組織一場戰鬥機競標，並邀請列強諸國派出他們最現代化的戰鬥機型前來測試。"
 HUN_bomber_competition: "轟炸機競標"
 HUN_bomber_competition_desc: "若要請求外國授權生產許可，我們就必須貨比三家、擇優而用。為此，我們將組織一場轟炸機競標，並邀請列強諸國派出他們最現代化的轟炸機型前來測試。"
 HUN_joint_air_development: "聯合空軍研發"
 HUN_joint_air_development_desc: "研發新機種的最佳方法是與盟國展開合作。通過彙集各國最優秀的人才集思廣益，我們定將取得最理想的結果。"
 HUN_army_maneuvers: "軍隊整訓"
 HUN_army_maneuvers_desc: "為應對未來潛在的武裝衝突，我軍必須重整態勢。為此，軍隊將會進行演習，對新式戰術和戰略展開探索。"
 HUN_mobile_focus: "發展機動化作戰"
 HUN_mobile_focus_desc: "發展一支能夠在任何時間和地點造成最大殺傷的機動部隊，是軍事勝利的關鍵。"
 HUN_the_botond: "博通德型卡車"
 HUN_the_botond_desc: "為了滿足我軍補給和運輸的需求，我們急需一款新型的卡車。而拉巴·博通德38M的原型車已在測試中被證明可用，只要調撥資源，我們就可以完善設計並開始量產。"
 HUN_develop_tanks: "研發坦克"
 HUN_develop_tanks_desc: "周邊國家均已洞悉了坦克的重要性並開始大批量生產，我們也必須研發出自己的坦克，努力追趕我國盟友和對手的步伐。"
 HUN_assault_gun_focus: "發展突擊炮"
 HUN_assault_gun_focus_desc: "與其在發展框架成熟的坦克領域白費功夫，我們不如指望運用突擊炮來為我軍步兵增添突破能力，這或許是更為划算的選擇。"
 HUN_joint_tank_procurement: "聯合坦克採購"
 HUN_joint_tank_procurement_desc: "通過與盟國展開合作，我們可以更有效地研發新型坦克。為此，我們將成立一個聯合採購部門，使各國工程師可以共同努力，制定出最佳的設計方案。"
 HUN_armored_warfare: "裝甲作戰"
 HUN_armored_warfare_desc: "我們的摩托化部隊需要裝甲單位的支援才能真正發揮作用。為此，我們必須投入更多的資源，來實現新型裝甲單位設計的發展。"
 HUN_mobile_corps_doctrine: "機動兵團學說"
 HUN_mobile_corps_doctrine_desc: "隨著摩托化裝備與裝甲單位的陸續投產，我們現在必須尋求新的理論學說指導，來實現機動化部隊在戰場上協同作戰問題的解決。"
 HUN_home_defense: "本土防禦"
 HUN_home_defense_desc: "小規模的機動化部隊在我國遭受攻擊時無法有效保衛國家安全。為此，我們必須構築不可逾越的前線防禦，同時發展相對應的新學說以提高作戰效能。"
 HUN_danuvia_submachine_guns: "達努維亞衝鋒槍"
 HUN_danuvia_submachine_guns_desc: "我軍步兵需要更優秀的武器來提升他們的作戰能力，而達努維亞43M原型槍已在武器測試中展現了良好的性能。通過提高該槍的研發資金，我們將能很快對這件武器進行大規模生產。"
 HUN_artillery_effort: "重視火炮"
 HUN_artillery_effort_desc: "火炮是提升我軍作戰能力的關鍵。為此，我們將研發更加現代化的新型火炮，使我軍擁有儘可能最強的火力支援。"
 HUN_motorized_logistics: "摩托化後勤"
 HUN_motorized_logistics_desc: "機動作戰的關鍵在於實現人員和物資的長距離快速運輸。如果沒有足夠的補給，即便是最好的坦克，也會很快趴窩派不上用場。"
 HUN_light_infantry_divisions_doctrine: "輕步兵學說"
 HUN_light_infantry_divisions_doctrine_tech_tt: "啟用§H輕步兵學說§!\n§H步兵\n    森林§!\n      攻擊：§G+2%§!\n      移動：§G+5%§!\n    §H城市§!\n      攻擊：§G+5%§!\n      移動：§G+5%§!\n"
 HUN_light_infantry_divisions_doctrine_unit_tt: "\n獲得1個下轄6個營的§Y步兵師§!。\n"
 HUN_light_infantry_divisions_doctrine_desc: "我們必須對我國有限的人力善加利用。如果我們想組建更多的師，就必須對師團編制進行縮編。輕步兵師能兼顧突擊能力和部隊規模，因此我們要將其作為軍隊的核心力量。"
 HUN_form_parachute_battalions: "組建傘兵部隊"
 HUN_form_parachute_battalions_desc: "通過空輸投送步兵，我們將能夠在面臨任何突發威脅或戰術機遇時實現快速反應。"
 HUN_naval_warfare: "海軍作戰"
 HUN_naval_warfare_desc: "在重新獲得沿海領土後，我們現在必須集中精力重建一支彰顯大國權威的艦隊。"
 HUN_restauration: "傳統海軍"
 HUN_restauration_desc: "我們不能把時間浪費在對未經證實的新技術持續的測試上。因此，我們將堅持並沿用舊帝國時代歷經檢驗的那些型號設計。"
 HUN_reform: "革新海軍"
 HUN_reform_desc: "抱著過時的觀念來建立海軍是毫無意義的。而今，既然我們有機會摒棄舊日的負擔，重新建立一支嶄新的海軍，那麼我們就應該抓住機遇，締造出最為現代化的勝利艦隊。"
 HUN_capital_ships: "主力艦"
 HUN_capital_ships_desc: "戰列艦是海軍構成的核心。我們必須搶回失去的時間，儘快動工建造新軍艦。"
 HUN_destroyer: "驅逐艦"
 HUN_destroyer_desc: "驅逐艦在艦隊中至關重要，但經常遭到忽視。鑑於其優點多多且造價低廉，它們是任何海軍擴編計劃的良好開端。"
 HUN_cruisers: "巡洋艦"
 HUN_cruisers_desc: "即使是最為強大的艦隊，如果其不能有效索敵並在敵軍航空打擊中保護自己，那也只不過是花架子。通過設計一批新式輕重巡洋艦，將有助於我們將各型艦船打造為真正的艦隊。"
 HUN_submarines: "潛艇"
 HUN_submarines_desc: "在上一次戰爭中，潛艇幾乎擊敗了世界上最強大的海軍。如果我們不擁有自己的潛艇，我們就不能被認為是現代海軍。"
 HUN_carriers: "航空母艦"
 HUN_carriers_desc: "戰列艦已經是舊時代的老古董了，海戰的未來屬於航空母艦及其搭載的戰機。為此，我們將在這個領域立足爭先。"
 fighter_tt: "必須能提供一款最新型的戰鬥機並與[Root.GetName]處於和平狀態"
 bomber_tt: "必須能提供一款最新型的轟炸機並與[Root.GetName]處於和平狀態"
 ROM_preserve_greater_romania: "維持大羅馬尼亞"
 ROM_preserve_greater_romania_desc: "我們至少已經設法將所有說羅馬尼亞語的同胞都團結進我們的國家了。現在，我們必須確保子孫後代們也能夠繼承這份遺產，即一個全羅馬尼亞人的羅馬尼亞。"
 ROM_a_deal_with_the_devil: "與惡魔的交易"
 ROM_a_deal_with_the_devil_desc: "[SOU.GetNameDefCap]對我國東部邊境來說是巨大的威脅，他們向我國索取領土似乎已經是板上釘釘的事情了。因此，也許加入[SOU.GetAdjective]一方比和他們對抗更為務實。"
 ROM_form_peasant_militias: "組建農民赤衛隊"
 ROM_form_peasant_militias_desc: "根據我們從鄰國同志那學來的共產主義思想，每個國民都有義務去保衛他的同志手足，保衛他的國家以及革命的事業。"
 ROM_basing_rights_for_soviet_union: "允許[SOU.GetName]駐軍"
 ROM_basing_rights_for_soviet_union_desc: "我們都知道[SOU.GetAdjective]人覬覦著我國的領土，但也許我們可以通過為親愛的鄰國同志提供駐軍權來避免兩國之間發生不友好的摩擦。"
 ROM_romanian_volunteer_brigades: "羅馬尼亞志願軍"
 ROM_romanian_volunteer_brigades_desc: "我們將建立志願軍來支援其他國家正蓬勃發展的革命事業。"
 ROM_join_comintern: "加入共產國際"
 ROM_join_comintern_desc: "成為共產國際光榮一員的時刻已經到來。此舉不僅可使我國領土從此免遭東面同志的索取，同時也將令我國能夠在國際共產主義運動中發揮更加積極的作用。"
 ROM_trade_treaty_with_germany: "對德貿易條約"
 ROM_trade_treaty_with_germany_desc: "我們都知道德國在我國有著巨大的經濟利益。因此，通過增加諸如石油這類物資的出口，將使我們有機會請求德國援助，以此實現我國軍隊的現代化。"
 ROM_german_romanian_oil_exploitation_company: "德羅聯合石油開發公司"
 ROM_german_romanian_oil_exploitation_company_desc: "德國迫切需要大量石油的供給，這為我們提供了可觀的機遇來發展本國的煉油產業。"
 ROM_invite_german_advisors: "邀請德國顧問"
 ROM_invite_german_advisors_desc: "如果我國要實現軍隊的現代化，那麼德國的援助便是至關重要的。他們有著我們急需的相關技術知識，我們應當請求德方派遣顧問前來協助。"
 ROM_invite_german_advisors_tt: "允許德國在羅馬尼亞領土駐軍。\n"
 ROM_license_german_equipment: "德國裝備生產許可"
 ROM_license_german_equipment_desc: "德國的裝備簡直比我國自產的裝備好上太多，我們也許能夠設法搞到這些武器裝備的生產許可，進而在本國自行生產。"
 ROM_join_axis: "加入軸心國"
 ROM_join_axis_desc: "加入軸心國的時刻已經到來了。與德國人攜手並肩，我們也許能夠為羅馬尼亞開創出光輝的未來。"
 ROM_demand_transnistria: "索取外德涅斯特"
 ROM_demand_transnistria_desc: "而今我國兵強馬壯且有德國盟友撐腰，是時候索取外德涅斯特地區，並將其納入大羅馬尼亞的疆域之內了。"
 ROM_renew_the_romanian_polish_alliance: "續訂羅波同盟"
 ROM_renew_the_romanian_polish_alliance_desc: "我國與波蘭的歷史紐帶在近年來被冷落了不少。而今，環繞在我國周遭的威脅並未減弱，同時全球政治局勢日益激進，是時候重新恢復與我們北方鄰居的盟約了。"
 ROM_the_cordon_sanitaire: "隔離線聯盟"
 ROM_the_cordon_sanitaire_desc: "由於我們同時在東西兩面與信奉危險意識形態的國家接壤，因此我們需要與南北方向的鄰國構建一個隔離性質的聯盟，以防止這些危險的意識形態繼續擴散。"
 ROM_demand_a_western_guarantee: "要求西方保障"
 ROM_demand_a_western_guarantee_desc: "如果我們要同時與共產主義和法西斯主義對抗，就必須要得到西方的幫助。我們將用上我們所有的政治籌碼來換取這一保障。"
 ROM_military_modernization: "軍事現代化"
 ROM_military_modernization_desc: "即使有了西方的支持，我們也必須推進我軍的現代化進程，如此才能為諸盟國爭取時間，趕在我國徹底覆滅、為時已晚之前施以援手。"
 ROM_join_allies: "加入同盟國"
 ROM_join_allies_desc: "僅有擔保是遠遠不夠的，是時候正式宣佈加入西方的民主陣營，與他們攜手並肩、保衛自由了。"
 ROM_joint_allied_staff_college: "同盟國聯合參謀學院"
 ROM_joint_allied_staff_college_desc: "基於我們共同的利益，我們應該與西方列強在軍事裝備以及戰術方面展開合作。"
 ROM_civil_works: "民用工業"
 ROM_civil_works_desc: "如果要維持大規模的軍隊建設工作，大羅馬尼亞國家就需要制定一個廣泛的工業發展計劃。我們將即刻推進這一項目。"
 ROM_national_defense_industry: "國防工業"
 ROM_national_defense_industry_desc: "如果我們要滿足日益增長的需求的話，就必須極大地擴張本國的軍工產業。"
 ROM_agrarian_reform: "農業改革"
 ROM_agrarian_reform_desc: "我們在農業領域還有很大的進步空間。通過提高效率並實現農業的流水線化運作，我們將能解放更多的勞動力投入到諸如工程和軍工等其他部門的生產上。"
 ROM_danubian_transport_network: "多瑙河運輸網絡"
 ROM_danubian_transport_network_desc: "通過提升河道效率以及改進水陸運輸網絡連接，我們可以大幅改善我國在多瑙河沿線的運輸能力。"
 ROM_malaxa: "馬拉夏工業"
 ROM_malaxa_desc: "我們必須擴張本國的汽車工業，如此才能在必要時刻將其迅速轉為軍用。為實現這一目標，我們或許可以參考一位本國商業大亨的有趣方案……"
 ROM_invite_foreign_motor_companies: "邀請外國汽車公司"
 ROM_invite_foreign_motor_companies_desc: "比起投入資源來提升不可靠的國產汽車產量，我們不如設法購買技術已經足夠成熟的外國汽車型號，如此收穫更多的利益。"
 ROM_hunedoara_steel_works: "胡內多阿拉鋼鐵工業"
 ROM_hunedoara_steel_works_desc: "為了滿足我國的軍工生產需要，我們必須對這家特蘭西瓦尼亞的大型鋼鐵工業實現大規模的現代化擴建。"
 ROM_invest_in_the_iar: "投資羅馬尼亞航空工業"
 ROM_invest_in_the_iar_desc: "緊跟現代空軍的作戰需求是至關重要的。為此，我國的航空工業不僅要滿足初步的機械製造需求，同時也必須具備迅速補充作戰損失的產能。"
 ROM_expand_ploiesti_oil_production: "擴大普洛耶什蒂石油生產"
 ROM_expand_ploiesti_oil_production_desc: "我國的普洛耶什蒂擁有著一些全歐洲儲量最大的油田，這些資源不僅對我們來說十分重要，對我們的盟友和其他國家來說亦非常關鍵。我們應當提升石油產量以更好地滿足需求。"
 ROM_expand_the_university_of_bucharest: "擴建布加勒斯特大學"
 ROM_expand_the_university_of_bucharest_desc: "通過提高我國大學的教學質量與師生隊伍，我們可以更好地為實現國家科技進步廣納所需的精英才俊。"
 ROM_exploit_the_baita_mines: "開採拜伊察礦區"
 ROM_exploit_the_baita_mines_desc: "我們已經逐漸明白鈾對於某些尖端武器技術的進步來說至關重要，而這種進步也許將是自火器發明以來最重大的革新。幸運的是，在我國境內有著可觀的鈾礦儲量，我們應當建立相關的礦井設施加以開採。"
 ROM_balkans_dominance: "巴爾幹霸權"
 ROM_balkans_dominance_desc: "通向羅馬尼亞繁榮昌盛未來的關鍵並不在於東方的革命者，也不在於西方的民主主義者或是法西斯主義者，而在於羅馬尼亞在全巴爾幹人之上建立的霸權。"
 ROM_puppet_bulgaria: "迫使保加利亞臣服"
 ROM_puppet_bulgaria_desc: "嗜血好戰的保加利亞長久以來都是其鄰國的眼中釘，我們必須一勞永逸地降伏他們。"
 ROM_align_hungary: "與匈牙利結盟"
 ROM_align_hungary_desc: "匈牙利必須充分了解我國的立場觀點。他們的政府正被誤入歧途的黨派所把持，而這隻會導致他們的國家走向毀滅。與我們攜手並肩，他們才會更加強大。"
 ROM_HUN_aligned: "已經與匈牙利結盟"
 ROM_secure_greece: "控制希臘"
 ROM_secure_greece_desc: "儘管過去兩國常為盟友，但現在希臘必須接受羅馬尼亞在本地區實現霸權。"
 ROM_divide_yugoslavia: "瓜分南斯拉夫"
 ROM_divide_yugoslavia_desc: "巴爾幹諸國的現狀令所謂南斯拉夫的國家已然難以為繼。我們將向其遞交最後通牒，勒令其在羅馬尼亞的主導下，對領土疆域進行重組。"
 ROM_split_czechoslovakia: "分裂捷克斯洛伐克"
 ROM_split_czechoslovakia_desc: "所謂捷克斯洛伐克的國家只是一個無法自力更生的人造產物。我們絕不能坐視這一地區陷入混亂，必須在局勢失控之前果斷干涉。"
 ROM_secure_the_bosporus: "控制博斯普魯斯海峽"
 ROM_secure_the_bosporus_desc: "我國海軍目前還被侷限在黑海之內，鑑於掌控博斯普魯斯海峽的土耳其有可能在戰時封鎖我們進出地中海的通路，我們必須確保必要之時在此地暢行無阻。"
 ROM_institute_royal_dictatorship: "確立皇家專政"
 ROM_institute_royal_dictatorship_desc: "是時候進一步強化國王陛下既有的政治權力了，此舉將為我國帶來政局的穩定，使我們能夠專注於應對外部的威脅。"
 ROM_fortify_the_borders: "鞏固邊防"
 ROM_fortify_the_borders_desc: "現在國內的局勢已經得到了控制，我們必須進一步改善邊防以抵禦外部的威脅。"
 ROM_flexible_foreign_policy: "靈活外交政策"
 ROM_flexible_foreign_policy_desc: "我們必須摒棄原則觀念，與任何國家發展更加實用的外交關係，我國的生存即有賴於此。"
 ROM_his_majestys_loyal_government: "國王陛下的忠實政府"
 ROM_his_majestys_loyal_government_desc: "全國的忠誠是至關重要的，只要整個國家都和他們的國王陛下同心同德，那麼長袖善舞的騎牆外交政策便就無關緊要了。"
 ROM_militarize_the_sentinels: "武裝哨兵"
 ROM_militarize_the_sentinels_desc: "只要我們調撥合適的資源，準軍事化的哨兵組織就能夠很容易地轉化為成熟的軍事集團。"
 ROM_all_parties_must_end: "天下無不散筵席"
 ROM_all_parties_must_end_desc: "天下無不散筵席，而當前的地緣政治局勢亦要求國王陛下心無旁騖。也許在戰爭結束後他還可以添酒回燈重開宴，但至少現在他必須和享樂的生活方式分道揚鑣。"
 ROM_revise_the_constitution: "修訂憲法"
 ROM_carol_current_leader_trigger: "§Y卡羅爾二世§!是現任的國家領導人。"
 ROM_carol_not_leader_trigger: "§Y卡羅爾二世§!不是現任的國家領導人。"
 ROM_revise_the_constitution_desc: "為了鞏固國王陛下作為一國元首的地位，我們必須修訂憲法。此外，我們還可以通過扶持更服從國王的青年組織——祖國的哨兵，來削弱那些危險的極右翼運動。"
 ROM_the_royal_foundation: "王室基金會"
 ROM_the_royal_foundation_desc: "國王現已仁慈地御準成立一個以他的名字命名的基金會，來研究羅馬尼亞的文化和發展國家的科學事業。"
 ROM_appoint_soviet_friendly_government: "任命親蘇維埃政府"
 ROM_appoint_soviet_friendly_government_desc: "羅馬尼亞的未來取決於我們與東方共產主義鄰居的良好關係，我們必須委任深諳此現實的政府加以掌舵。"
 ROM_securitate: "秘密警察"
 ROM_securitate_desc: "我們必須建立一個龐大的秘密警察組織，來消除針對新任國家政府的內部威脅。"
 ROM_appoint_german_friendly_government: "任命親軸心國政府"
 ROM_appoint_german_friendly_government_desc: "羅馬尼亞的未來取決於我們與西方新興法西斯勢力的良好關係，我們必須委任深諳此現實的政府加以掌舵。"
 ROM_appoint_german_friendly_government_tooltip: "移除§Y憲法保障§!，§Y$ROM_national_christian_party_in_power$§!以及§Y秘密警察§!\n"
 ROM_appoint_allied_friendly_government_tooltip: "移除§Y鐵衛團§!，§Y$ROM_national_christian_party_in_power$§!以及§Y秘密警察§!\n"
 ROM_appoint_soviet_friendly_government_tooltip: "移除§Y憲法保障§!，§Y$ROM_national_christian_party_in_power$§!以及§Y鐵衛團§!\n"
 ROM_appoint_german_friendly_government_tooltip_ncp: "移除§Y憲法保障§!，§Y鐵衛團§!以及§Y秘密警察§!\n"
 ROM_iron_guard: "鐵衛團"
 ROM_iron_guard_desc: "現在是時候重新考慮我們對鐵衛團的政策了。隨著新政府的上臺執政，這個政治運動團體現在已經與我們的官方立場更加趨同，他們將能夠作為出色的鷹犬，用以鞏固我國的政治穩定。"
 ROM_force_abdication: "強迫退位"
 ROM_force_abdication_desc: "國王卡羅爾二世已是無用之人，更遑論比起作為國家元首，他證明了自己更像個麻煩。儘管此君仍然在國家的政府和經濟領域保持著廣泛的影響力，但為了羅馬尼亞的長遠利益考量，我們必須恭請他退位去職。"
 ROM_appoint_allied_friendly_government: "任命親同盟國政府"
 ROM_appoint_allied_friendly_government_desc: "羅馬尼亞的未來取決於我們與西方的舊日盟友——法國及其諸盟國的良好關係，我們必須委任能夠維繫這些聯結紐帶的政府加以掌舵。"
 ROM_constitutional_guarantees: "憲法保障"
 ROM_constitutional_guarantees_desc: "此前被國王修訂的憲法必須復歸原狀，同時，為確保這樣的事情不會再次發生，我們還必須引入保障民主和制衡的原則。若不如此，我們所剩下的將只不過是對民主政治的拙劣模仿。"
 ROM_handle_the_king: "處理國王問題"
 ROM_handle_the_king_desc: "我們必須立法對國王陛下奢靡無度的生活加以節制，國家財政現在可能不會再負擔他的個人開支了。"
 ROM_king_michaels_coup: "米哈伊國王政變"
 ROM_king_michaels_coup_desc: "現任政府正在裹挾著羅馬尼亞走向毀滅，我們必須藉助一雷厲風行之人的力量以拯救國家於將傾，而此人正是米哈伊王子。"
 ROM_expand_the_air_force: "空軍擴編"
 ROM_expand_the_air_force_desc: "現代戰爭不可能在沒有制空權的情況下取勝，我們必須投入全部力量來發展羅馬尼亞空軍！"
 ROM_acquire_licenses: "獲取生產許可"
 ROM_acquire_licenses_desc: "外國的航空科學技術遠比我國先進，我們應當尋求獲得生產許可，自行生產這些有著他們創新結晶的飛機型號。"
 ROM_air_defense: "對空防禦"
 ROM_air_defense_desc: "為緩解國家尚且弱小的空軍的壓力，我們必須運用大量的防空火炮來保衛本國的邊境。"
 ROM_heavy_interceptors: "重型截擊機"
 ROM_heavy_interceptors_desc: "我國無法維持一支龐大的空軍，因此，我們必須在每一架戰機上都儘可能裝備更多的火力來摧毀一切來犯之敵。"
 ROM_ground_support: "地面支援"
 ROM_ground_support_desc: "諸兵種的協同作戰乃現代戰爭的根本宗旨，空軍力量必須加以訓練，在有需要的時候支援我國的地面武裝。"
 ROM_medium_bombers: "中型轟炸機"
 ROM_medium_bombers_desc: "軍隊無需重視天空也能取勝的時代已經過去了。我們必須發展自己的戰術轟炸機部隊，以在有需要時為士兵們提供來自空中的支援。"
 ROM_cas: "近距支援機"
 ROM_cas_desc: "如果我們致力於最大程度發揮諸兵種協同作戰的力量，就需要為此設計專門的機型用於執行近距離空中支援的任務。"
 ROM_acquire_fighters: "獲取戰鬥機"
 ROM_acquire_fighters_desc: "制空權乃我國防衛的關鍵，因此，竭盡一切方式以擴充我們的戰鬥機部隊至關重要。"
 ROM_local_development: "本國自主研發"
 ROM_local_development_desc: "我們將依託羅馬尼亞本國的航空工業，來生產我們所需的各類機型。"
 ROM_air_superiority: "空中優勢"
 ROM_air_superiority_desc: "奪取制空權對於軍事行動來說必不可少，而這正是我們要在空戰領域重視的方面。"
 ROM_strategic_bomber_force: "戰略轟炸機"
 ROM_strategic_bomber_force_desc: "在打擊摧毀敵國工業及基礎設施面前，軍事行動只能屈居次位。戰略轟炸正是我們需要掌握的關鍵手段。"
 ROM_heavy_bombers: "重型轟炸機"
 ROM_heavy_bombers_desc: "我軍的戰略轟炸力量需要兼具充裕的航程以及載彈量。而大型轟炸機是唯一能夠滿足上述要求的可選方案。"
 ROM_nuclear_bomb_project: "核武計劃"
 ROM_nuclear_bomb_project_desc: "我們絕不能指望僅靠常規手段，就將我們的潛在敵人轟炸殆盡。因此，我們必須持續專注技術的進步，使我們能以更低的成本，製造遠大得多的破壞。"
 ROM_iar_80: "IAR-80型戰鬥機"
 ROM_iar_80_desc: "在新型戰鬥機的設計方面，我國工程師有一些傑出的想法急望實施。現在，他們需要的僅僅是資金的支持以及繼續前進。"
 ROM_army_maneuvers: "軍事演習"
 ROM_army_maneuvers_desc: "我國軍隊必須重整態勢，以應對未來可能的武裝衝突。因此，我們將組織軍隊展開演訓，發展新的戰略和戰術。"
 ROM_army_war_college: "戰爭軍事學院"
 ROM_army_war_college_desc: "我們需要傑出的將才來指揮我國的武裝力量，這意味著戰爭軍事學院必須擴招擴建。"
 ROM_war_college_tt: "1位擁有§Y2級技能§!的陸軍將軍§Y巴爾布·帕拉亞努§!將會出現。"
 ROM_the_zb_53: "ZB-53型重機槍"
 ROM_the_zb_53_desc: "現代化的裝備是戰場的關鍵，我們必須努力在步兵武器上實現這一點。"
 ROM_vanatori_de_munte: "山地獵兵"
 ROM_vanatori_de_munte_unit_tt: "\n獲得1個下轄9個營的§Y山地獵兵師§!。\n"
 ROM_vanatori_de_munte_desc: "山地獵兵是我國精銳的山地步兵部隊。他們聲名在外，甚至遠揚國際，我們將竭盡所能用最好的資源來擴充其編制規模。"
 ROM_artillery_modernization: "火炮現代化"
 ROM_artillery_modernization_desc: "若是沒有可靠的炮兵支援，步兵將難以發揮其戰力效用。通過確保現代化的高品質火炮列裝到位，我們將顯著改善軍隊的作戰效率。"
 ROM_modern_at_guns: "現代反坦克炮"
 ROM_modern_at_guns_desc: "屬於坦克的時代已經到來，我軍步兵也需要與時俱進，用最新式的手段武裝其自身，對抗這些鋼鐵製成的龐然大物們。"
 ROM_mountain_artillery: "山地火炮"
 ROM_mountain_artillery_tech_tt: "啟用§H山地火炮§!\n§H火炮\n    山地§!：移動：§G+15%§!\n§H反坦克炮\n    山地§!：移動：§G+15%§!"
 ROM_mountain_artillery_desc: "如果要確保我軍山地部隊的優勢地位，他們就必須得到所需的炮兵支援。因此，我們的火炮必須進行改造，以適應山地環境的利用。"
 ROM_reserve_divisions: "預備役部隊"
 ROM_reserve_divisions_desc: "羅馬尼亞是一個小國，我們必須預留適當數量的後備部隊，以便我軍在戰場上保持力量存在。"
 ROM_royal_guards_divisions: "王室近衛師"
 ROM_royal_guards_divisions_tt: "獲得1個下轄§Y7個步兵營§!和§Y2個炮兵營§!的師。\n"
 ROM_royal_guards_divisions_desc: "為與顯赫的國王陛下御尊相匹，我國的王室近衛部隊必須進行擴編。"
 ROM_the_armored_division: "裝甲部隊"
 ROM_the_armored_division_tt: "獲得2個下轄§Y4個[ROM_UnlockedArmor]裝甲營§!和§Y4個摩托化步兵營§!的師。\n\n如果已研究對應科技，則再為上述師添加§Y偵察連§!。"
 ROM_the_armored_division_desc: "坦克是未來作戰的前進方向，我們必須組建專門的部隊來發揮這些新式武器的力量。"
 ROM_acquire_modern_tanks: "獲取現代坦克"
 ROM_acquire_modern_tanks_desc: "坦克正處於日新月異的發展階段，對此我們必不能採用過時的型號。"
 ROM_mobile_tank_destroyers: "自行坦克殲擊車"
 ROM_mobile_tank_destroyers_desc: "我國並不具備壓倒敵國數量的坦克工業生產能力。因此，我們必須轉移重心，鑽研生產那些能抵消敵軍裝甲戰車優勢的武器。"
 ROM_the_maresal: "元帥型坦克殲擊車"
 ROM_the_maresal_desc: "我國工程師現已提出，將蘇聯的122mm榴彈炮放入封閉式炮塔當中的設計。通過進一步改良優化，我們也許能夠自行研發出一款優秀的戰車型號。"
 ROM_expand_the_galati_shipyards: "擴建加拉茨造船廠"
 ROM_expand_the_galati_shipyards_desc: "如果我們要將海軍力量投射向黑海，我國在加拉茨現有的造船設施就必須大幅擴建。"
 ROM_coastal_defense_navy: "海岸防衛海軍"
 ROM_coastal_defense_navy_desc: "有限的資源迫使我們只能盡力確保本國海岸線的安危，一切努力都必須為此目標服務。"
 ROM_coastal_defense_ships: "海岸防衛艦隊"
 ROM_coastal_defense_ships_tech_tt: "啟用§H海岸防衛艦隊§!\n§H重巡洋艦§!\n    裝甲：§G+20%§!\n    對海火力：§G+10%§!\n    生產花費：§G-10%§!"
 ROM_coastal_defense_ships_desc: "專用於海岸防衛的艦船設計型號將被創建。"
 ROM_modern_destroyers: "現代驅逐艦"
 ROM_modern_destroyers_desc: "對於任何海軍來說，驅逐艦都是其支柱和基幹，我國海軍亦不例外。現在，這樣的海軍基幹必須匹配當今的技術標準。"
 ROM_torpedo_boats: "雷裝戰艦"
 ROM_torpedo_boats_desc: "魚雷堪稱海戰領域的重要制衡性武器。如果我國的所有軍艦都能配備它，我們就有可能通過大膽的機動以及兇猛的魚雷潛射，給予一支遠勝我方的海軍令人瞠目結舌的打擊。"
 ROM_modern_submarines: "現代潛艇"
 ROM_modern_submarines_desc: "自從魚雷艦誕生後，潛航作戰就是海軍發展中最令人心血澎湃的領域。我們不僅要在防範潛艇襲擊方面做到最好，同時也要利用潛艇打擊敵方艦船。"
 ROM_black_sea_dominance: "黑海霸權"
 ROM_black_sea_dominance_desc: "我國天然的資源匱乏不應成為羅馬尼亞制霸黑海的阻礙。在適當政治意志的推動下，我們將把這一目標變為現實。"
 ROM_capital_ships: "主力艦"
 ROM_capital_ships_desc: "如果我們要被切實當作一個海軍強國來看待的話，我們就必須列裝主力艦來領銜本國的黑海艦隊。"
 ROM_torpedo_bombers: "魚雷轟炸機"
 ROM_torpedo_bombers_desc: "我們可以將一部分空軍的力量調配執行海上任務，以此來彌補我國海軍的短板。而這將需要一款能夠搭載魚雷的新型飛機。"
 ROM_expand_the_marine_regiment: "擴編海軍陸戰隊"
 ROM_expand_the_marine_regiment_desc: "掌控黑海為我們開拓攻勢思路提供了更多的機會。現在，發動海上侵襲已經具備可行性，為此我們不僅要開發新型的運輸船，同時也要組建專門的海軍陸戰部隊來執行這樣的特種作戰。"
 CZE_fortification_studies: "要塞工程研究"
 CZE_fortification_studies_desc: "對我國邊境進行要塞化防禦之必要不言而喻，問題在於如何實施？鑑於近期，法國人完成了他們令人驚歎的要塞防禦體系——馬奇諾防線，或許對此派出相關代表團前往研究學習，將有助於解決我國自身的邊防問題。"
 CZE_fallback_line: "構築後備防線"
 CZE_fallback_line_desc: "如果邊境無法切實守住，那麼構築一條後備的二道防線，將來自西方的攻勢阻擋在其進犯我國核心地帶之前就很有必要了。"
 CZE_sudeten_1: "蘇臺德早期要塞工程"
 CZE_sudeten_1_desc: "作為我國臨近德國的邊境山區，蘇臺德地區乃是設防的完美之地。在認真研究了法國的馬奇諾防線之後，我們也可以效仿其建立起一條我國自己的防線。"
 CZE_sudeten_2: "蘇臺德中期要塞工程"
 CZE_sudeten_2_desc: "蘇臺德地區現已擁有了一套頗為可觀的防禦體系，但值此國家生死存亡之際，僅是徒有其表可無濟於事。"
 CZE_sudeten_3: "蘇臺德最終要塞工程"
 CZE_sudeten_3_desc: "誠然蘇臺德地區現在已經建立了強大的要塞防禦體系，但我們可以繼續對其加以精進！"
 CZE_hungarian_line: "匈牙利防線"
 CZE_hungarian_line_desc: "匈牙利人對其領土的收復主張對我國來說是致命的威脅，在兩國邊境構建要塞工程體系將有助於確保我們的安全。"
 CZE_polish_line: "波蘭防線"
 CZE_polish_line_desc: "波蘭人的侵略野心永無止境，但願通過構築完善的要塞邊防體系能讓他們知難而退，另外尋找其他更易得手的目標。"
 CZE_internal_redoubts: "境內壁壘"
 CZE_internal_redoubts_desc: "任何防禦工程體系都有被突破的可能。未雨綢繆，我們可以在那些最重要的城鎮中構建防禦壁壘，令其在敵軍突破我國防線後無法被輕易佔領。"
 CZE_industrial_legacy: "工業遺產"
 CZE_industrial_legacy_desc: "斯柯達工廠曾是奧匈帝國最大的武器製造商，而自我國獨立以來，它已經將其業務拓展到許多工業領域併成為了其中的領導者。坐擁如此高度集中的專業技術和重工業能力，將大大有利於我們在工業方面的發展。"
 CZE_favor_czechs_1: "捷克工業發展"
 CZE_favor_czechs_1_desc: "由於我國大部分工業都集中在波希米亞和摩拉維亞一帶，捷克人和斯洛伐克人彼此一直都互有不滿和摩擦。但相對而言，我們在當地工業基礎上繼續建立工廠也更為容易，只不過斯洛伐克人可能會在此地區進一步製造混亂。"
 CZE_favor_czechs_2: "工業核心地帶"
 CZE_favor_czechs_2_desc: "對我國工業整體水平的提升來說，在波希米亞和摩拉維亞地區進一步追加投入，是要遠遠大於在其他地區分散投入的。"
 CZE_favor_czechs_3: "新興工業城鎮"
 CZE_favor_czechs_3_desc: "在進一步開發了波希米亞和摩拉維亞的舊工業地帶之後，現在是時候建立新的城鎮，以容納這些從事新興工業的工人們了。"
 CZE_balanced_1: "平衡工業投資"
 CZE_balanced_1_desc: "儘管這樣做不利於總體的效率，但為緩和捷克人與斯洛伐克人之間的緊張態勢，有人還是建議我們應該將未來的工業發展資源平均分配於國內各地區之間。"
 CZE_balanced_2: "捷斯聯合計劃委員會"
 CZE_balanced_2_desc: "通過成立由本國兩大地區出身的政治家們共同參與的領導機構，我們將能夠確保國內各地區都能得到平等的工業發展機會。"
 CZE_balanced_3: "地區專業化"
 CZE_balanced_3_desc: "在對全國各地持續進行工業投資的過程中，有些地區已開始針對部分產品和服務進行專業化的發展。我們應該對此予以激勵。"
 CZE_united_population: "民族的聯合"
 CZE_united_population_desc: "在我們近來的種種政治舉措，以及平衡的工業發展計劃的綜合作用下，舉國範圍內的捷克和斯洛伐克民眾已經更加團結一致了。"
 CZE_arms_exports_1: "武器出口"
 CZE_arms_exports_1_desc: "斯柯達工廠長期以來都是整個歐洲的軍火主要供應商，其生產的武器數量對我國軍隊來說已是供過於求。如此大規模生產下的高效率製造，是其他軍工廠商所無法想像的。"
 CZE_arms_exports_2: "出口補貼"
 CZE_arms_exports_2_desc: "隨著戰爭的威脅與日俱增，越來越多的國家都在尋求購買坦克。通過國家貸款擔保以及其他的經濟手段，我們可以吸引其他國家都來購買捷克斯洛伐克產品，進一步提升本國的經濟水平。"
 CZE_arms_exports_3: "公平準入保障"
 CZE_arms_exports_3_desc: "現在，市場對武器的需求可謂是歷史最高點，我國生產線的產能也是如此。為進一步支持武器出口，我們可以公開宣佈將向任何願意付錢的買家提供武器——然後用這筆錢來投資我國自身的軍備重整。"
 CZE_political_direction: "評估政治風向"
 CZE_political_direction_desc: "我國民主制度尚處起步階段，更從未經歷過嚴峻考驗，而隨著法西斯主義與共產主義在歐洲的崛起，問題已無庸贅述：民主道路究竟是否正確，如若不是，那何為正道呢？"
 CZE_go_left: "團結人民意志"
 CZE_go_left_desc: "共產主義才是偉岸的未來！我們要竭盡一切努力，按照馬克思主義思想理念重塑本國的政府與社會。"
 CZE_czech_socialism: "捷式社會主義"
 CZE_czech_socialism_desc: "中央干預對經濟而言當然是好事，但也很可能過猶不及。通過對捷克和斯洛伐克的地方蘇維埃適當分權，更大的國家整體將會獲益良多！"
 CZE_communism_with_a_human_face: "人性的共產主義"
 CZE_communism_with_a_human_face_desc: "通過號召人民在團結於共產黨的領導前提下，進一步參與地方和國家政治，共產主義理想將融入我們嶄新生活的方方面面。"
 CZE_communist_support: "支持共產主義"
 CZE_communist_support_desc: "我國的左翼勢力正在積聚勢頭，對共產主義的支持正在全國範圍內與日俱增，而隨著我們投入更多官方層面的支持，這一勢頭將只增不減。"
 CZE_join_comintern: "加入共產國際"
 CZE_join_comintern_desc: "那些思想落伍的舊日盟國，現在已不再是我們可以依靠的對象。是時候與蘇聯正式結盟，以確保我們能共同抵禦法西斯-帝國主義者們的侵略了。"
 CZE_the_romanian_question: "羅馬尼亞問題"
 CZE_the_romanian_question_desc: "羅馬尼亞橫亙在我國與我們的好朋友及保護者——蘇聯之間。既然他們不允許蘇聯同志派遣部隊過境援助我國防禦，那麼我們就必須考慮一個更加極端的解決方案了。"
 CZE_the_polish_division: "瓜分波蘭"
 CZE_the_polish_division_desc: "波蘭不僅在我們急需幫助的時候拒絕了蘇聯軍隊過境的請求，他們還對我國解放扎奧爾傑地區一事懷恨在心且很有可能伺機報復。因此，最明智的做法是對其採取先發制人的防禦進攻。"
 CZE_democratic_bastion: "民主堡壘"
 CZE_democratic_bastion_desc: "無論發生何等狀況，捷克斯洛伐克都將是中歐地區的民主堡壘！"
 CZE_beacon_of_liberty: "自由燈塔"
 CZE_beacon_of_liberty_desc: "我們對民主制度的堅定承諾和有力保障不僅激勵了我國公民，也影響著那些為躲避其他政權壓迫而背井離鄉的流亡人士。"
 CZE_healing_a_divided_nation: "治癒分裂的國家"
 CZE_healing_a_divided_nation_desc: "如今，我們的人民都清楚地認識到，在捍衛自由的莊嚴承諾上，我們必將說到做到。正是這份信念讓我們得以彌合那些撕裂國家多年的深刻傷痕。"
 CZE_defensive_preparations: "防禦性戰備"
 CZE_defensive_preparations_desc: "顯然，無論我們是否願意，戰爭都將來臨。因此，我們最好提前做好準備。"
 CZE_bonus_research_slot_1: "捷克理工大學"
 CZE_bonus_research_slot_1_desc: "隨著戰火將至，更加註重實用技術會對我們大有裨益。"
 CZE_go_right: "賦權國家法西斯聯盟"
 CZE_go_right_desc: "只有在法西斯主義指導下，捷克人民才能崛起邁向偉大！歐洲的民主制度已註定消亡，唯有強大的諸國，唯有法西斯諸國，才能在弱國淪為刀俎之際，在談判桌上佔據一席之地！"
 CZE_czech_fascism: "捷式法西斯主義"
 CZE_czech_fascism_desc: "對法西斯主義的支持正在全國範圍內與日俱增，隨著更多的權力落在法西斯主義者手中，我們可以用更多的手段去處理那些持不同政見者。"
 CZE_aggressive_wars: "侵略戰爭之潮"
 CZE_aggressive_wars_desc: "隨著法西斯主義在國內宣告勝利，我們也將開始踏上強權之路了！"
 CZE_the_polish_question: "波蘭問題"
 CZE_the_polish_question_desc: "波蘭人從來沒有在扎奧爾傑問題上對我們忘懷原諒，如果我們表現出一絲弱氣，他們勢必將會撲向我們。為什麼像捷克斯洛伐克這樣一個偉大的國家，要忍受這樣的威脅呢？別再忍耐了！我們將會立刻採取果斷的行動！"
 CZE_exclude_the_slovaks: "捷克優先"
 CZE_exclude_the_slovaks_desc: "從我們國家成立的那一天起，斯洛伐克人就心懷不滿。他們總是尋求更多的政治權力，總是要求遠超其所需的、更多的國家資源。這一切都到此為止了！以後！權力將集中在捷克手中！§R這將導致內戰爆發。§!"
 CZE_national_fascism: "國家法西斯主義"
 CZE_national_fascism_desc: "捷克人和斯洛伐克人將在法西斯主義的旗幟下團結一致。我們並肩前進，我們勢不可擋！"
 CZE_german_minor_ally: "德意志之僕"
 CZE_german_minor_ally_desc: "德國是正在崛起的強權，是我們可以追隨以共享榮光的強權。德國戰車碾向何方，我等必將追隨，誓要攜手並肩、共圖大業。"
 CZE_german_minor_ally_tt: "如此將成為德國的衛星國，其將給予我國若干技術許可作為犒賞，但同時也會讓他們成為凌駕於我國之上的宗主國。"
 CZE_german_ally: "德意志之友"
 CZE_german_ally_desc: "作為志同道合的法西斯強權，德國是我們通往榮耀之路上的親密同伴。我等兩國攜手，定將讓世界圍繞布拉格-柏林軸心旋轉！"
 CZE_strategy_decisions: "戰略決策"
 CZE_strategy_decisions_desc: "一場風暴，一場戰爭威脅的風暴，即將降臨在歐羅巴大地之上，但捷克斯洛伐克將如何迎接未來的挑戰？"
 CZE_german_leanings: "對德綏靖"
 CZE_german_leanings_desc: "德國正在重回世界強權的行列，他們的目標是將所有德語人口都統一在其國家旗下。我們作為一個有相當數量德裔族群的國家，面對這令人擔憂的現實，或許我們應該做出一些讓步。除非我們有能夠保障自己的強大盟友，否則我們可能不得不向德國屈服。"
 CZE_german_puppet: "德意志之傀"
 CZE_german_puppet_desc: "綏靖政策對德國可沒什麼用，在徹底統治我們之前，他們絕不會止步。事已至此，說不定主動屈膝臣服，還能換來些許自治權呢？"
 CZE_hungarian_situation: "匈牙利局勢"
 CZE_hungarian_situation_desc: "匈牙利一直是我們的心頭之刺，但隨著我們在法西斯主義的全力支持下壯大堅強，匈牙利的國祚即將到頭結束。"
 CZE_deliver_sudetenland: "移交蘇臺德"
 CZE_deliver_sudetenland_desc: "德國的目標就是我國境內的德裔人口。看起來，如果我們想要避免戰爭，唯一的辦法就是向其移交蘇臺德地區。"
 CZE_german_technology: "德國科技"
 CZE_german_technology_desc: "隨著兩國間的和平關係已經得到保證，現在有人建議，相互間的技術交流將能使彼此更加獲益。"
 CZE_trust_in_the_west: "信任西方"
 CZE_trust_in_the_west_desc: "英法兩大國定將繼續捍衛歐洲的和平。畢竟，他們打贏世界大戰，可不是為了讓德國在二十年後又再度威脅和撕裂各國主權的！"
 CZE_doctrinal_innovation: "軍事理論革新"
 CZE_doctrinal_innovation_desc: "在軍官交流和戰略研討會議上，我們從盟友那裡學到了很多東西。結合不同的觀點，我們已即將突破原有的軍事理論實現創新。"
 CZE_bonus_research_slot_2: "知識共享團隊"
 CZE_bonus_research_slot_2_desc: "鑑於同盟間的知識共享已經帶來了巨大的收益，現在我們計劃為此設立一個常駐機構。"
 CZE_secret_weapons: "絕密兵器"
 CZE_secret_weapons_desc: "捷克未來戰爭的前景，取決於掌握多種先進技術並加以利用，使我國取得最大的優勢。"
 CZE_nukes: "核武兵器"
 CZE_nukes_desc: "捷克未來戰爭的前景，取決於掌握原子裂變的毀滅之力！"
 CZE_an_entente_of_our_own: "我們自己的協約國"
 CZE_an_entente_of_our_own_desc: "小協約國集團近年來已經支離破碎，但若是我們的舊日盟友們有意，我們仍有可能使其再次偉大。"
 CZE_invite_yugoslavia: "邀請南斯拉夫"
 CZE_invite_yugoslavia_desc: "邀請南斯拉夫加入小協約國集團。"
 CZE_invite_romania: "邀請羅馬尼亞"
 CZE_invite_romania_desc: "邀請羅馬尼亞加入小協約國集團。"
 CZE_faction_tech_sharing: "聯合條約組織"
 CZE_faction_tech_sharing_desc: "為了實現良好的合作，協約國軍隊的裝備水平應該相近。為了實現這一目標，我們建議陣營內所有成員國都應共享技術，互通有無。"
 CZE_security_council: "聯合安全理事會"
 CZE_security_council_desc: "協約國內部的安全理事會，將確保諸成員國在部署聯合軍事行動時協調一致。"
 CZE_deal_with_hungary: "消除匈牙利威脅"
 CZE_deal_with_hungary_desc: "隨著和平在歐洲搖搖欲墜，協約諸國絕不能坐視匈牙利再次成為心腹大患。對此，只有實施徹底的解決方案，才能讓我們騰出手應對其他更嚴重的麻煩。"
 CZE_deal_with_bulgaria: "肢解保加利亞"
 CZE_deal_with_bulgaria_desc: "保加利亞現已完成軍備重整並再度威脅巴爾幹地區安全。如果協約諸國要致力應對歐陸的全面衝突的話，這一威脅絕不能放任長存。"
 CZE_rapprochement_with_hungary: "與匈牙利和解"
 CZE_rapprochement_with_hungary_desc: "誠然，匈牙利人對其領土的收復主張是持久的威脅，但也許最後再努力一下可以和平解決這個問題？"
 CZE_czechoslovak_legion: "捷克斯洛伐克軍團"
 CZE_czechoslovak_legion_desc: "捷克斯洛伐克軍團在上次世界大戰中轉戰歐陸各地，亦深入參與了其後的俄羅斯內戰。現在，隨著衝突在歐陸不斷蔓延，軍團或將再度吹響進軍的號角。"
 CZE_military_research_institute: "軍事技術研究所"
 CZE_military_research_institute_desc: "軍事技術研究所致力於為捷克斯洛伐克武裝部隊提供有關軍事研究、武器開發以及測試的各項服務。"
 CZE_mountain_bonus: "山地部隊"
 CZE_mountain_bonus_desc: "在如此多的山脈丘陵橫亙於我國境內的情況下，我們對能夠警備這些地區的特種士兵的需求也就不言而喻了。"
 CZE_inf_and_artillery_advancement: "步兵裝備改良"
 CZE_inf_and_artillery_advancement_desc: "步兵是我國軍隊最重要的組成單位，持續改善他們的武器裝備，是邁向完備國防狀態的重要一步。"
 CZE_support_bonus: "支援部隊"
 CZE_support_bonus_desc: "為了確保我國步兵的高效率表現，其支援單位也必須相應進行現代化。"
 CZE_inf_and_artillery_advancement_2: "火炮改進"
 CZE_inf_and_artillery_advancement_2_desc: "作為主宰戰場的皇后，現代化的火炮將會大批量裝備進我們的軍隊中。"
 CZE_doctrine_bonus: "戰術研究"
 CZE_doctrine_bonus_desc: "單靠武器不能使軍隊具備戰鬥力，有效的戰術也不可或缺。軍事技術研究所對此深以為意，現已提出了若干有關的建議。"
 CZE_motorization_scheme: "摩托化計劃"
 CZE_motorization_scheme_desc: "儘管我國軍隊在規模上並非最大，但摩托化將為我軍迅速在某地區集中力量提供可能。"
 CZE_armour_bonus_1: "LT-38型坦克"
 CZE_armour_bonus_1_desc: "我軍雖然現今擁有著一些世界上最為先進的坦克，但這一領域的技術進步日新月異，我們可不能落於人後。"
 CZE_mechanization: "機械化發展"
 CZE_mechanization_desc: "雖然摩托化為我軍將士提供了機動性，但機械化將會給他們提供更快的速度、更好的保護和更強大的火力。"
 CZE_armour_bonus_ii: "裝甲部隊現代化"
 CZE_armour_bonus_ii_desc: "軍事技術研究所將繼續與斯柯達工廠緊密合作，設計出性能更好的新式坦克。"
 CZE_doctrine_bonus_2: "戰爭的革新"
 CZE_doctrine_bonus_2_desc: "單靠武器不能使軍隊具備戰鬥力，有效的戰術也不可或缺。軍事技術研究所對此深以為意，現已提出了若干有關的建議。"
 CZE_war_college: "戰爭學院"
 CZE_war_college_desc: "戰爭學院將為我軍提供必要且訓練有素的指揮官人才，帶領軍隊走向勝利。"
 CZE_war_college_effect_tt: "§Y如果你已經擁有了5個研究槽，你將不會再得到額外的研究槽。§!\n"
 CZE_military_aeronautical_institute: "航空軍事研究所"
 CZE_military_aeronautical_institute_desc: "航空軍事研究所致力於為捷克斯洛伐克空軍提供航空研究以及藍圖設計的各項服務。"
 CZE_import_foreign_fighters: "進口外國戰鬥機"
 CZE_import_foreign_fighters_desc: "通過進口各種外國戰鬥機進行測試和評估，我們自己的飛機設計師將得到寶貴的經驗教訓。"
 CZE_light_fighter_focus: "發展輕型戰鬥機"
 CZE_light_fighter_focus_desc: "航空軍事研究所得出結論，輕型戰鬥機對我們來說是最有用的，應該以其作為我國空軍的核心。"
 CZE_heavy_fighter_focus: "發展重型戰鬥機"
 CZE_heavy_fighter_focus_desc: "航空軍事研究所得出結論，重型戰鬥機對我們來說是最有用的，應該以其作為我國空軍的核心。"
 CZE_air_is_our_sea: "天空即我們的海"
 CZE_air_is_our_sea_desc: "其他國家依靠海軍來保護其邊境和向外投射力量，而對我們來說，這一使命將由空軍力量來完成。"
 CZE_rule_the_air: "掌控天空"
 CZE_rule_the_air_desc: "對空軍的持續投入，使我們現在能夠建立起卓越的飛機生產效率。"
 CZE_import_foreign_bombers: "進口外國轟炸機"
 CZE_import_foreign_bombers_desc: "通過進口各種外國轟炸機進行測試和評估，我們自己的飛機設計師將得到寶貴的經驗教訓。"
 CZE_cas_focus: "發展近距支援機"
 CZE_cas_focus_desc: "航空軍事研究所的評測結論表明，我們應該注重對近距支援機的發展。"
 CZE_tac_focus: "發展戰術轟炸機"
 CZE_tac_focus_desc: "航空軍事研究所的評測結論表明，我們應該注重對戰術轟炸機的發展。"
 CZE_access_to_the_sea: "進入海洋"
 CZE_access_to_the_sea_desc: "我們不再被陸地環繞封鎖！隨著現在我國統治已抵臨海岸線，對海洋事務的學習以及建立海軍的計劃必須立刻走馬上案。"
 CZE_sudden_shipyard: "造船廠緊急建設"
 CZE_sudden_shipyard_desc: "海軍的建立離不開造船廠的存在。雖然我們此前並沒有相關計劃，但承辦大型工程項目對我們來說也並不新鮮。在適當的努力下，造船廠的誕生應該並不需要太久。"
 CZE_shipbuilding_legacy: "造船業的遺產"
 CZE_shipbuilding_legacy_desc: "雖然建立海軍對我們來說還是新鮮事，但斯柯達工廠在為奧匈帝國海軍制造零部件方面已有悠久的歷史。現在，他們可以用這相通的經驗來為我們本國的海軍建造艦船。"
 CZE_battleship_catchup_1: "戰列艦設計突破"
 CZE_battleship_catchup_1_desc: "我們對海軍的新需求，現已導致了在戰列艦設計上的突破。"
 CZE_destroyer_catchup_1: "驅逐艦設計突破"
 CZE_destroyer_catchup_1_desc: "我們對海軍的新需求，現已導致了在驅逐艦設計上的突破。"
 CZE_cruiser__catchup_1: "巡洋艦設計突破"
 CZE_cruiser__catchup_1_desc: "我們對海軍的新需求，現已導致了在巡洋艦設計上的突破。"
 CZE_raiding_focus: "專注艦隊襲擾"
 CZE_raiding_focus_desc: "我國海軍必須避免正面戰鬥，並著重於騷擾敵軍的運輸航路。"
 CZE_capital_focus: "專注艦隊決戰"
 CZE_capital_focus_desc: "我國海軍必須專注於發起一場決定性的海戰。"
 YUG_western_focus: "專注西方關係"
 YUG_western_focus_desc: "南斯拉夫的未來，無論看地緣關係還是經濟實力，都取決於與我們聯繫緊密的西方列強。"
 YUG_friendship_treaty_with_italy: "對意友好條約"
 YUG_friendship_treaty_with_italy_desc: "我們必須要讓鄰國中至強的存在——意大利，視南斯拉夫為友邦。現在，得開始著手於有關兩國友好聲明的談判了。"
 YUG_reinforce_old_alliances: "鞏固舊聯盟"
 YUG_reinforce_old_alliances_desc: "自建國以來，我國就承蒙過法國、英國這種歐陸民主列強的不少恩惠。為將來的聯盟關係而作打算，如今是時候鞏固這些聯繫了。"
 YUG_attract_foreign_capital: "吸引外國資本"
 YUG_attract_foreign_capital_desc: "我們可以妥善利用好現有的緊密外交關係，以此促進外資流入。"
 YUG_ban_slovene_nationalist_parties: "查禁斯洛文尼亞民族主義黨派"
 YUG_ban_slovene_nationalist_parties_desc: "為我國利益而計，必須向任何試圖搞分裂獨立的尋釁滋事分子出重拳。我們要依法查禁搞民族主義的政黨，處分其支持者，以防我國自內而外朽壞。"
 YUG_traditional_values: "傳統價值觀"
 YUG_traditional_values_desc: "基於正教教義的傳統價值觀，是我們社會的基石。對其進行提倡不僅能為我們爭取正教會的支持，同時也能促進人民的團結。"
 YUG_greater_yugoslavia: "大南斯拉夫"
 YUG_greater_yugoslavia_desc: "在整個南斯拉夫統一之前，我們決不能停下腳步。保加利亞人也許不自覺為南斯拉夫民族的一部分，但這不是他們覺得，而是我們覺得。"
 YUG_all_yugoslavian_regiments: "全南斯拉夫軍團"
 YUG_all_yugoslavian_regiments_desc: "儘管國內民族文化多樣複雜，但所有人都必須為保家衛國做出貢獻。在組織兵團時，我們不會夾帶任何種族歧視性質的偏見。"
 YUG_crush_the_ustasa: "根除烏斯塔沙"
 YUG_crush_the_ustasa_desc: "“烏斯塔沙”，作為克羅地亞極端民族主義運動，已經漸漸成了我等的肉中刺，除了恐怖組織外，決不能再有其它的定性。為我國利益而計，必須予以根除。"
 YUG_invite_german_military_mission: "邀請德國軍事顧問團"
 YUG_invite_german_military_mission_desc: "我們必須克服軍隊的反德情緒。如能請來一個軍事顧問團，兩國合作的益處便會充分彰顯。"
 YUG_join_axis: "簽署《三國同盟條約》"
 YUG_join_axis_desc: "雖然很多人希望南斯拉夫加入同盟國，共同對抗法西斯主義，但我們清楚地知道，這到底不過是無望的野心，終究會以戰火和混亂而告結。眼下，我們有機會加入德意日三國的軍事和經濟合作協定，必須立即把握住這個機會。"
 YUG_invite_italian_naval_experts: "邀請意大利海軍專家"
 YUG_invite_italian_naval_experts_desc: "我們地中海沿岸的盟友在艦船設計和製造上業有專攻。為此，我們將邀請一些意大利專家，將相關知識帶給我們。"
 YUG_limited_self_government: "地方有限自治"
 YUG_limited_self_government_desc: "國內分歧罪孽深重，蜻蜓點水般的改革難以應付如此複雜的局面。只有給各民族以自治，才能在不動用武力的情況下維持我們各民族的聯盟。"
 YUG_guarantee_religious_liberties: "保障宗教自由"
 YUG_guarantee_religious_liberties_desc: "所有人都應擁有選擇自己信仰的權利。我們要引介新法，以此保障宗教自由。"
 YUG_local_militias: "地方民兵武裝"
 YUG_local_militias_desc: "我國將鼓勵民眾自行組成民兵團，以此保衛家園。這將擴大未來可入伍服役的人口規模。"
 YUG_concessions_for_macedonians: "對馬其頓人讓步"
 YUG_concessions_for_macedonians_desc: "通過接觸馬其頓人的領導團體，我們將妥善處理好他們的不滿，並重新掙得他們對國家的忠誠。"
 YUG_establish_the_banovina_of_croatia: "建立克羅地亞自治省"
 YUG_establish_the_banovina_of_croatia_desc: "但願通過建立半獨立的克羅地亞自治省，能夠平息克族對真正意義上獨立的訴求。"
 YUG_non_discriminating_officer_promotions: "無歧視提拔軍官"
 YUG_non_discriminating_officer_promotions_desc: "差別對待政策必須被撤銷。從現在起，無論其民族出身為何，所有軍人都有資格被提拔進軍官團。如此一來，我軍就可以發掘到最有能力的指揮官。"
 YUG_join_allies: "王室聯盟"
 YUG_royal_alliance_tt: "我們將嘗試加入王室姻親所在的陣營。\n在締結姻親的事件中若我們的伴侶是亞歷山德拉公主，則我們將嘗試加入同盟國。"
 carlist_text: "卡洛斯派"
 YUG_join_allies_desc: "國王大婚，美滿幸福，而我們也應公開站隊，如此才能在遭鄰國入侵時仰仗姻親國家的軍事力量。"
 YUG_reclaim_istria_and_zadar: "收復伊斯特拉和扎達爾"
 YUG_reclaim_istria_and_zadar_desc: "意大利仍佔據著伊斯特拉和扎達爾地區，是時候收復失地了。"
 YUG_claim_macedonia: "聲索馬其頓"
 YUG_claim_macedonia_desc: "馬其頓的部分地區仍在我們的國境之外。既然所有馬其頓人都是斯拉夫民族的一員，則他們自然也屬於我國。"
 YUG_allied_air_combat_school: "盟軍空戰院校"
 YUG_allied_air_combat_school_desc: "我們的新盟友們在空戰方面有著豐富的經驗，通過促成建立諸盟國間共享的空戰技能院校，將能很好地讓我國飛行員學習盟友們用鮮血換來的寶貴經驗。"
 YUG_recognize_the_soviet_union: "承認蘇聯"
 YUG_recognize_the_soviet_union_desc: "儘管我們過去拒絕承認東方的布爾什維克政權，但如今亟應重新考慮我方的立場了。西方民主國家似已無法捍衛我等小國，在此情況下，蘇聯或許會成為一個可靠的盟友。"
 YUG_form_peasant_councils: "成立農民委員會"
 YUG_form_peasant_councils_desc: "勞動人民必須在地方政治中更有發言權。農民委員會的成立，將大大有助於他們的意見直達中央。"
 YUG_mutual_economic_aid: "經濟互助"
 YUG_mutual_economic_aid_desc: "蘇聯和南斯拉夫，在經濟上大有互補之處。通過一系列互惠互利的貿易與經濟援助協定，兩國可以互取所需。"
 YUG_abolish_the_monarchy: "廢除舊君主制"
 YUG_abolish_the_monarchy_desc: "作為與現代趨勢相悖的政府形式，君主制已經難以為繼，更何況該體系與我們的社會觀完全不符。君主制必須被廢除，王道之治必須被人民之聲所取代。"
 YUG_join_comintern: "加入共產國際"
 YUG_join_comintern_desc: "推動革命的最佳途徑，就是與共產國際的共產主義兄弟國家並肩而立。"
 YUG_yugoslavian_path_to_communism: "南斯拉夫特色共產主義道路"
 YUG_yugoslavian_path_to_communism_desc: "我們不需要別人來指導該怎麼為工農階級奮鬥。我們將團結支持我國領導的人民群眾，走出我國自己的革命道路。"
 YUG_form_the_federal_republic: "建立聯邦共和國"
 YUG_form_the_federal_republic_desc: "是時候建立真正的聯邦制國家，海納各民族同胞兄弟了。延續數十年的內部分裂將就此終結。"
 YUG_pan_slavic_workers_congress: "泛斯拉夫工人代表大會"
 YUG_pan_slavic_workers_congress_desc: "斯拉夫民族的眾工人階級同胞，必須聯合起來為事業而奮鬥。鑑於蘇聯根本不理解巴爾幹工人的困境，我們將自行擔起領導重任。"
 YUG_research_collaboration: "科研合作"
 YUG_research_collaboration_desc: "相較於我國，眾盟友所擁有的資源儲量更甚，我們應當推進一項可與眾盟國共享科技發展成果的合作研究項目。"
 YUG_federal_defense_council: "聯邦國防委員會"
 YUG_federal_defense_council_desc: "我國各地區在保衛偉大祖國時，都應有其發聲建言的一席之地。此舉將確保最大程度上聽取意見，使英才良策不至遭到漠視扼殺。"
 YUG_invite_bulgaria: "邀請保加利亞"
 YUG_invite_bulgaria_desc: "我們保加利亞的斯拉夫同胞，需要我們的引領才能走向共產主義。此外，鑑於保國地處我國東翼，將其納入陣營可使邊境大部無虞，其軍力亦對傳播革命頗有助益。"
 YUG_pan_balkan_workers_congress: "泛巴爾幹倡議"
 YUG_pan_balkan_workers_congress_desc: "我們雖已在南方的接壤鄰邦確立了社會主義的理想，但巴爾幹各地仍還有無數民眾慘遭君主制與資產階級獨裁的壓迫。唯有解放羅馬尼亞、匈牙利與希臘的工人大眾，我們才可宣告完全解放了整個巴爾幹的工人階級。"
 YUG_invite_albania: "邀請阿爾巴尼亞"
 YUG_invite_albania_desc: "阿爾巴尼亞國土雖小，但其戰略地位對我國來說至關重要。通過將其納入代表大會，我們可確保南部邊境大部安全，同時使其軍力為我等所用。"
 YUG_invite_greece: "邀請希臘"
 YUG_invite_greece_desc: "希臘的青年男女正在他們主子的鐵蹄下受苦受難，唯有武裝該國的勞苦大眾，我們才能打破將其束縛的枷鎖鐵鏈。"
 YUG_invite_romania: "邀請羅馬尼亞"
 YUG_invite_romania_desc: "羅馬尼亞人如今生活在一個貴族當道的社會，已深知封建貴族與資本主義對國家的危害。他們不應再受腐敗君主的反覆蹂躪；他們將主宰自己的命運！"
 YUG_invite_hungary: "邀請匈牙利"
 YUG_invite_hungary_desc: "自哈布斯堡王朝覆滅以來，匈牙利國運便一直飄搖不定。而在我們的協助下，匈牙利人民將以團結統一的共產主義專政，找到其國家的真正形態！"
 YUG_invite_turkey: "邀請土耳其"
 YUG_invite_turkey_desc: "儘管土耳其人民十幾年前就從他們的哈里發手中贏得了解放，但他們至今還沒有從其資產階級主子的掌控中徹底解放出來。雖然土耳其共和人民黨聲稱自己是一個“社會民主國家”，但事實上，他們完全未能打破其人民的枷鎖，如今只有通過南斯拉夫的直接干預，我們才能真正解放巴爾幹所有的工人大眾。"
 YUG_united_autonomous_croatia: "統一的克羅地亞自治領"
 YUG_united_autonomous_croatia_desc: "建立統一的克羅地亞自治領，長久以來就被視為解決克羅地亞分離主義的方案。通過賦予克羅地亞一定的自治權，我們或可使潛在的敵人成為堅定的盟友。"
 YUG_devolved_croatia: "割裂的克羅地亞自治領"
 YUG_devolved_croatia_desc: "在聯邦內部的反對者中，克羅地亞人的呼聲最為響亮。目前，克羅地亞分為北部的薩瓦省區和南部的濱海省區。若同時授予兩省各自的自治權，則既可安撫克羅地亞反對派，又可防止其在聯邦內部的影響過大。"
 YUG_safeguard_bosnia: "保護波斯尼亞"
 YUG_safeguard_bosnia_desc: "周遭各國中，有不少國家盼著波斯尼亞人遭佔領、被壓迫。此事斷不可成真，波黑兩族都將得到一切必要的軍火與工業支持。"
 YUG_divide_bosnia: "拆分波斯尼亞"
 YUG_divide_bosnia_desc: "波斯尼亞地區在文化和宗教上都分外觸抵：塞族同克族，穆斯林同基督徒，如此乃至無數形形色色的民族。該地區維續長遠的唯一辦法是，將當地恰如其分地分割稱波斯尼亞與黑塞哥維那兩個地區，分別同聯邦中央協調一致。"
 YUG_dissolve_serbia: "肢解塞爾維亞"
 YUG_dissolve_serbia_desc: "我們劃歸為“塞爾維亞”的地區實際上也是許多非塞族身份認同族群的家園，馬其頓人、阿爾巴尼亞人和黑山人等族群均居此地。我們決不能背上文化侵略者的罵名，必須重新推敲塞族這個定義的內涵與外延。"
 YUG_banat_for_support: "以巴納特換支持"
 YUG_banat_for_support_desc: "匈牙利和羅馬尼亞都對北塞爾維亞有所企圖，這已是路人皆知。鑑於我國缺少外國支持，我們可以割讓這些領土，以此換取某種程度上的承認與支持。"
 YUG_autonomous_transylvania: "斯拉夫特蘭西瓦尼亞自治"
 YUG_autonomous_transylvania_desc: "巴納特和伏伊伏丁那地區不僅是塞族的家園，同時也是羅馬尼亞人和匈牙利人的家園。如果准予當地自主自治，我們或可一勞永逸地終結掉羅馬尼亞和匈牙利對當地的要求。"
 YUG_fortify_banat: "鞏固巴納特防禦"
 YUG_fortify_banat_desc: "令人憂心的是，匈牙利人和羅馬尼亞人一直在向敵對國家靠攏。如果我們要保護塞爾維亞及其自治屬地，就必須迅速在北方修壘築堡。"
 YUG_evolution: "進步革新"
 YUG_evolution_desc: "儘管有人蔑稱我國為各族敵對的不穩定聯盟，但我們深知，唯有團結一心方能擊退外敵。我們必須努力團結人民，粉碎分裂勢力。"
 YUG_slovenia_for_support: "以斯洛文尼亞換支持"
 YUG_slovenia_for_support_desc: "鑑於軸心國企圖瓜分我們的國家，也許我們可以通過割讓斯洛文尼亞給意大利，既解決斯洛文尼亞境內的不穩定因素，同時向軸心國表達我們的親善意願。"
 YUG_surrender_macedonia: "放棄馬其頓"
 YUG_surrender_macedonia_desc: "保加利亞由於主張南塞爾維亞和馬其頓兩地為其所有，因此也有理由與我們為敵。但通過滿足他們的領土要求，我們既可以平息南部邊界上的威脅，也可以把馬其頓民族主義問題扔給保加利亞。"
 YUG_zara_for_axis: "以扎拉換加入軸心國"
 YUG_zara_for_axis_desc: "意大利宣稱其扎拉地方政府是達爾馬提亞的合法控制者，也許通過向意大利人確保我們將為共同事業而戰，我們可以說服其歸還扎拉並暫棄制霸巴爾幹的野望。"
 YUG_surrender_italian_claims: "放棄對意領土主張"
 YUG_surrender_italian_claims_desc: "扎拉和伊斯特拉現在仍在意大利人手裡，但我們不能因繼續堅持對這兩處的合法擁有權而冒險激怒[ITA.GetLeader]。或許我們可以通過放棄對這兩處境外領土主張，以交換得到加入軸心國的資格。"
 YUG_end_the_regency: "終止攝政統治"
 YUG_end_the_regency_desc: "保羅親王已克盡對王室的職責。眼下戰爭陰雲密佈，人民需要國王強勢親政，對抗企圖分裂國家的法西斯與共產主義者。"
 YUG_coronation: "加冕典禮"
 YUG_coronation_desc: "我國人民不習王化久矣，此刻正當展示王權的永恆性。通過在白城大教堂為國王加冕，我們將使人民確信王權永續，國家絕不會落於外敵之手。"
 YUG_royal_wedding: "王室婚典"
 YUG_royal_wedding_desc: "王室聯姻歷來是鞏固同盟之道。值此多位尊貴公主待嫁之際，年輕的彼得國王或可為祖國與世界強國修盟結緣。"
 YUG_enforced_neutrality: "確保南斯拉夫中立"
 YUG_enforced_neutrality_desc: "我們不可放任巴爾幹捲入全球衝突的漩渦。我們必須宣佈中立，避免出現任何與交戰中的世界列強扯上關係的行為。"
 YUG_fortress_yugoslavia: "南斯拉夫要塞化"
 YUG_fortress_yugoslavia_desc: "我們絕不能容忍邊境的納粹威脅坐大！眼下，意大利人據扎拉，德國人佔奧地利，我們必須確保邊境穩固，將士武備充足以抗法西斯。"
 YUG_ban_fascists: "取締法西斯政黨"
 YUG_ban_fascists_desc: "即使是現在，國內仍有政黨鼓吹一族獨尊，圖謀主宰整個南斯拉夫聯邦。此輩在我國絕無立足之地，必須禁言取締。"
 YUG_towards_independence: "邁向獨立"
 YUG_towards_independence_desc: "我們的聯邦現在既已轉化為一系列自治邦國，那麼下一步行動亦是箭在弦上。獨立，我們不可再以獨裁者身份凌駕於諸同胞之上，我們必須相信，他們能夠在塞爾維亞不插手的情況下照顧好自己。"
 YUG_defence_army_of_yugoslavia: "南斯拉夫國防軍"
 YUG_defence_army_of_yugoslavia_desc: "為我們的聯盟而戰，對普通公民來說是一件困難的事情，但為自己的家園而戰，則是每個人的應有之義。隨著承諾的獨立夙願即將實現，聯盟上下如今充滿了願與敵人對抗的勇夫，他們所需要的只是政府的支持。"
 YUG_defence_league: "南斯拉夫防衛聯盟"
 YUG_defence_league_desc: "既然我們大部分的邦國都已經獲得了相當程度的自治，那麼接下來只剩最後一步了。通過正式承認所有巴爾幹國家的獨立，我們將把南斯拉夫國家轉變為多國協同的經濟軍事合作體。"
 YUG_united_kingdom: "實現聯合的王國"
 YUG_united_kingdom_desc: "既然我們的人民都已有機會品嚐獨立自主的滋味，並確信能夠在聯邦中被恰如其分地代表，那麼現在，則是我們採取行動，來培育此前國家嚴重匱乏的泛民族主義和團結意識的時候了。"
 YUG_reunite_the_kingdom: "復歸一統的王國"
 YUG_reunite_the_kingdom_desc: "儘管許多人士擔心，此舉或重蹈南斯拉夫國家分裂與民族衝突的覆轍，但我們仍必須整合舉國力量，以應對邊境上更大的威脅。"
 YUG_attract_allied_capital: "吸引同盟國投資"
 YUG_attract_allied_capital_desc: "英國人有充分的理由支持我國，畢竟我們從世界大戰以來就是盟友。通過吸引來自同盟國的投資者，我們將再次確保兩國的關係密不可分。"
 YUG_attract_axis_capital: "吸引軸心國投資"
 YUG_attract_axis_capital_desc: "儘管意大利人對我國領土抱有覬覦路人皆知，但鑑於我國經濟形勢堪憂，若要在經濟上對抗意方，我們就必須積極鼓勵發展同諸鄰國的貿易往來。"
 YUG_industrialization_program: "工業發展計劃"
 YUG_industrialization_program_desc: "我們如果要跟上鄰國重整軍備的步伐，就需要實施快速的工業化計劃。"
 YUG_expand_the_mining_industry: "發展礦業"
 YUG_expand_the_mining_industry_desc: "我們需要充足的資源供給新興的戰爭機器，因此應著眼擴張國內的採礦工業。"
 YUG_rare_minerals_exploitation: "稀有礦產開發"
 YUG_rare_minerals_exploitation_desc: "此前尚未開發的稀有金屬礦藏，如今已凸顯其戰略價值。我們必須立即開鑿礦山並配套相關基建設施，對其加以利用。"
 YUG_exploit_the_pannonian_deposits: "開發潘諾尼亞礦藏"
 YUG_exploit_the_pannonian_deposits_desc: "我們應積極開發境內油田，雖然其儲量有限，但本國戰爭機器所需資源向來是多多益善。"
 YUG_develop_civilian_industry: "發展民用工業"
 YUG_develop_civilian_industry_desc: "我國民用工業亦須跟上軍工發展的步伐，以供給配套機械及其他必需品。"
 YUG_integrated_rail_network: "整合鐵路網"
 YUG_integrated_rail_network_desc: "我們應全面平等地在全國擴建鐵路網絡，祖國的任何地域都不應被特殊對待。"
 YUG_improve_light_industry: "提振輕工業"
 YUG_improve_light_industry_desc: "我國內部動盪已是既定事實，因此更不可放任輕工業發展滯後，出現民生必需品短缺的情況。"
 YUG_develop_slovenian_industry: "發展斯洛文尼亞地區工業"
 YUG_develop_slovenian_industry_desc: "斯洛文尼亞雖長期被忽視，但該地卻有充足的空間來建設新的工業中心。此舉定將令斯洛文尼亞人民歡欣鼓舞。"
 YUG_local_self_management: "地方自主管理"
 YUG_local_self_management_desc: "通過增強地方在管理上的自主權，我們可提升本地資源的利用效率與新建設項目的效能。"
 YUG_expand_the_university_of_ljubljana: "擴建盧布爾雅那大學"
 YUG_expand_the_university_of_ljubljana_desc: "通過擴建斯洛文尼亞的地區高等學府，我們將喜添另一機構以教化我國民眾。"
 YUG_develop_military_industry: "發展軍用工業"
 YUG_develop_military_industry_desc: "現代軍隊需重工業的基礎支撐，來進行必要的新式飛機生產。"
 YUG_improve_serbian_rail_network: "改善塞爾維亞鐵路網"
 YUG_improve_serbian_rail_network_desc: "我們可以暫緩在邊遠省份的鐵路建設，畢竟我國的核心區域在中東部。"
 YUG_serbian_steel: "塞爾維亞制鋼"
 YUG_serbian_steel_desc: "我們必須在塞爾維亞啟動鋼鐵的生產，戰爭機器總是需要更多鋼鐵的。"
 YUG_expand_the_university_of_belgrad: "擴建貝爾格萊德大學"
 YUG_expand_the_university_of_belgrad_desc: "通過擴建我國最負盛名的大學，我們可以增加國家科研隊伍的英才儲備。"
 YUG_expand_the_university_of_zagreb: "擴建薩格勒布大學"
 YUG_expand_the_university_of_zagreb_desc: "歷史悠久的薩格勒布大學歷來是頂尖的高等教育學府，追加額外撥款將幫助其提供有價值的科研產出。"
 YUG_central_management: "集中管理"
 YUG_central_management_desc: "通過對所有管理環節實施強有力的中央控制，我們將提升維持生產指標的能力。"
 YUG_expand_the_sarajevo_arsenals: "擴建薩拉熱窩兵工廠"
 YUG_expand_the_sarajevo_arsenals_desc: "我們需要更高的產能來滿足軍隊日益增長的需求。對此，薩拉熱窩兵工廠是擴張增產的首選廠家，我們將立刻調配其所需的各項資源。"
 YUG_modernize_the_air_force: "空軍現代化"
 YUG_modernize_the_air_force_desc: "我國空軍在武備上已嚴重過時。如果我們意圖保衛領空甚至於打擊敵人，就需要進行徹底的現代化改造計劃。"
 YUG_local_developers: "本土製造商"
 YUG_local_developers_desc: "我們必須加強對國產飛機研發的支持力度，以此更好地掌控研發機型並刺激本國工業。"
 YUG_ikarus: "伊卡魯斯"
 YUG_ikarus_desc: "位於諾維薩德的伊卡魯斯飛機制造廠，這家我國曆史最為悠久的航空工業必須完成增產擴建，以滿足我新興空軍力量日益增長的裝備需求。"
 YUG_designer_tt: "該公司將作為飛機制造商解鎖。\n"
 YUG_rogozarski: "羅戈扎爾斯基"
 YUG_rogozarski_desc: "塞爾維亞第一日沃因·羅戈扎爾斯基飛機制造廠，這家緊隨伊卡魯斯之後成立的企業需要進一步擴建增產，以滿足當前的生產需求。"
 YUG_zmaj: "茲邁"
 YUG_zmaj_desc: "位於貝爾格萊德的茲邁航空工坊，必須調撥新地加以擴建。儘管茲邁相較於我國其他廠家資質尚淺，但只要能夠實現擴建，其有充分的潛力滿足我們的生產需求。"
 YUG_the_ik_3: "IK-3型戰鬥機"
 YUG_the_ik_3_desc: "我國的工程師團隊秘密利用業餘時間，提出了替代現行外購戰鬥機的卓越方案。若有適當支持，其量產或很快可行。"
 YUG_heavy_fighter_project: "重型戰鬥機項目"
 YUG_heavy_fighter_project_desc: "我軍戰鬥機必須能為更加脆弱的轟炸機提供支援。為此，我們需要犧牲飛機的部分速度與機動性作為代價，強化其武裝並延長航程。"
 YUG_bomber_project: "轟炸機項目"
 YUG_bomber_project_desc: "我們需要轟炸機以將戰火燒向敵國。為此，我國工程師必須承擔研發此類國產新機型的任務。"
 YUG_purchase_foreign: "海外訂購"
 YUG_purchase_foreign_desc: "鑑於其他國家已在研發優質戰鬥機方面，投入了遠超我國的資源和技術。我們應該直接從他國採購，免去自行試錯的艱辛。"
 YUG_license_production: "授權生產"
 YUG_license_production_desc: "列裝新式飛機的流程，可以通過獲得授權自產加以簡化。我們將盡快協商落實此類協議。"
 YUG_fighter_license: "戰鬥機生產許可"
 YUG_fighter_license_desc: "我們必須專注於授權戰鬥機的生產製造，畢竟沒有戰鬥機掩護的轟炸機一無是處。"
 YUG_bomber_license: "轟炸機生產許可"
 YUG_bomber_license_desc: "廣闊天際開闢了打擊敵人的新途徑，因此轟炸機才是授權生產線必須專注的方向。"
 YUG_army_modernization: "軍隊現代化"
 YUG_army_modernization_desc: "自上一次戰爭後，戰爭的形態已截然不同，我們必須通過裝備戰術的現代化，來確保軍隊與時俱進。"
 YUG_motorize_the_cavalry: "騎兵摩托化"
 YUG_motorize_the_cavalry_desc: "汽車工程的新發展，徹底變革了部隊的潛在速度與機動性。如今，我軍的騎兵部隊也必須淘汰戰馬，以卡車取而代之。"
 YUG_motorized_logistics: "摩托化後勤"
 YUG_motorized_logistics_desc: "摩托化為保障前線部隊的基本補給與特種裝備，開闢了全新的途徑。這將使我們能確保部隊始終處於最佳的戰備狀態。"
 YUG_armored_cavalry: "裝甲騎兵"
 YUG_armored_cavalry_desc: "為我軍的交通工具加裝護甲，可大幅提升部隊的生存力、戰鬥力與士氣。然而為實現這點，我們需要一種至少擁有部分履帶的載具，使其能夠負擔額外重量而不受地形限制，同時還能搭載自備武器。"
 YUG_tank_conversions: "坦克改裝"
 YUG_tank_conversions_desc: "也許我們此刻需要的只是坦克，但下個月，我們可能需要的就是基於相同底盤的自行火炮或者坦克殲擊車。因此，我們的戰車裝備必須保持配備的靈活性，以適應不同當下的需求。"
 YUG_modern_tanks: "現代坦克"
 YUG_modern_tanks_desc: "隨著大口徑主炮的發展，裝甲技術如今已遠超單純安全投送兵力的初衷。為此，我們必須發展國產坦克序列，以與鄰國抗衡。"
 YUG_tank_licenses: "坦克生產許可"
 YUG_tank_licenses_desc: "與其耗費我們有限的資源自行研發坦克，不如更高效地獲得授權，生產外國的型號。"
 YUG_small_arms: "輕武器"
 YUG_small_arms_desc: "步兵是任何軍隊的中流砥柱，我們必須確保其裝備精良。對此，我們必須推動新式現代武器的研發進程。"
 YUG_domestic_artillery_production: "自研火炮生產"
 YUG_domestic_artillery_production_desc: "通過推動現代國產火炮型號的研發，我們可確保部隊獲得最優的炮火支援。"
 YUG_anti_tank_defenses: "反坦克防禦"
 YUG_anti_tank_defenses_desc: "鑑於坦克已在現代戰爭中居於核心地位，我們需要在反坦克炮領域實現技術革新，以使步兵能夠摧毀這些裝甲巨獸。"
 YUG_mountain_brigades: "山地兵團"
 YUG_mountain_brigades_desc: "大片山區橫亙於我國境內，這將需要訓練編成適應此地形的特種作戰部隊。"
 YUG_independent_engineer_regiments: "獨立工程兵團"
 YUG_independent_engineer_regiments_desc: "機動性是現代軍事理論的關鍵要義，然而地形未必總能允許其充分發揮。通過將專業的工程兵團編入師級部隊，我們將促進軍隊在各種地形上的機動能力。"
 YUG_motorized_recon_companies: "摩托化偵察部隊"
 YUG_motorized_recon_companies_desc: "為獲取敵軍編成與位置的充分情報，我們需要專職的摩托化偵察部隊，以在大部隊推進前展開遠距偵察。"
 YUG_form_parachute_battalions: "組建傘兵部隊"
 YUG_form_parachute_battalions_desc: "對三維空間的利用，能使我們能從意想不到的敵後方向發動打擊。通過組建職業特種的空輸部隊，我們將確保這支空中力量發揮其最大效用。"
 YUG_army_maneuvers: "軍隊演習"
 YUG_army_maneuvers_desc: "為使我軍重整旗鼓，我們必須舉行一系列新的軍事演習，而這些經驗，亦將帶來對現代戰爭全新的見解。"
 YUG_supremacy_of_offense: "進攻至上"
 YUG_supremacy_of_offense_desc: "攻勢行動是邁向勝利的關鍵，因此在我軍整體戰略和新興軍事學說的發展中，進攻必須佔據主導地位。"
 YUG_supremacy_of_defense: "防禦至上"
 YUG_supremacy_of_defense_desc: "我國周遭強敵環伺，我們唯有堅守待援，直至盟友救火解圍。因此，新興軍事學說的發展，必須聚焦於我國的本土防衛相關事宜。"
 YUG_artillery_regiments: "重炮兵團"
 YUG_artillery_regiments_desc: "通過將強力的重炮團編組進師級編制，我軍師級部隊的綜合戰鬥力將得到顯著的提升。"
 YUG_expand_the_split_shipyards: "擴建斯普利特造船廠"
 YUG_expand_the_split_shipyards_desc: "我國位於達爾馬提亞的既有造船業是擴建增產的首選項目，其設施完備，足可建造大型戰艦。然而，克羅地亞當地要求擴大自治的呼聲，或將最終導致我們失去對上述設施的控制。"
 YUG_contest_the_adriatic: "爭奪亞得里亞海"
 YUG_contest_the_adriatic_desc: "對我國海岸線的防禦應始於其境外之海。對此，我們必須發展對應的新興海軍戰略戰術，以掌控或至少爭取亞得里亞海的制海權。"
 YUG_replace_the_dalmacija: "替換達爾馬提亞號"
 YUG_replace_the_dalmacija_desc: "老舊的德國造巡洋艦“達爾馬提亞號”設計已嚴重過時，我們急需一艘新型的現代巡洋艦來替代它，使其成為我軍亞得里亞海艦隊的全新脊梁。"
 YUG_naval_bombers: "海軍轟炸機"
 YUG_naval_bombers_desc: "亞得里亞海地勢十分狹長，非常有利於戰機自空軍基地起飛巡航。發展專門的海軍轟炸機型號，能顯著提高我國海軍在面對更強大對手時獲勝的機會。"
 YUG_heavy_cruiser_project: "重巡洋艦項目"
 YUG_heavy_cruiser_project_desc: "為有效挑戰敵國海軍，我們需要更大噸位與更強武裝的艦船。對此，重巡洋艦將會是替代當前作為我軍艦隊主力的輕巡洋艦的不錯選擇。"
 YUG_modern_destroyers: "現代化驅逐艦"
 YUG_modern_destroyers_desc: "驅逐艦是任何海軍的中流砥柱，我國海軍亦不例外。對於如此海軍脊梁，我們必須保證其不遜於任何對手。"
 YUG_expand_the_serbian_shipyards: "擴建塞爾維亞造船廠"
 YUG_expand_the_serbian_shipyards_desc: "儘管黑山地區缺乏建造大型戰艦的便利設施，但在該地落址大型造船廠，將確保無論克羅地亞的自治政策未來如何，我們都能對其保持控制。"
 YUG_coastal_defense: "海岸防衛"
 YUG_coastal_defense_effect_tt1: "在沿海省份添加§Y2級海岸要塞§!\n"
 YUG_coastal_defense_effect_tt2: "在§Y海軍基地§!所處的省份添加§Y1級海岸要塞§!\n"
 YUG_coastal_defense_desc: "我們不能指望在亞得里亞海與敵國海軍掰手腕較量。因此作為替代，我們必須強化國家的海岸線防衛，以抵禦任何可能的海上登陸入侵。"
 YUG_expand_the_submarine_fleet: "擴編潛艇艦隊"
 YUG_expand_the_submarine_fleet_desc: "與其以我國處於劣勢的海軍正面迎敵，我們不如專注於以潛艇襲擾敵方的商貿與航運。"
 panslavic_workers_congress: "泛斯拉夫工人代表大會"
 panbalkan_workers_congress: "大巴爾幹工人代表大會"
