 AI_MESSAGE_CAT1_MES1: "真是漂亮地被吞併了啊，$OTHER$。我真為你感到驕傲。"
 AI_MESSAGE_CAT1_MES2: "啊哈哈哈哈，$OTHER$根本不會玩鋼四。"
 AI_MESSAGE_CAT1_MES3: "去學學怎麼玩吧，$OTHER_ADJ$鶸。"
 AI_MESSAGE_CAT1_MES4: "$OTHER$被我虐的太慘了，我都有點同情他了。"
 AI_MESSAGE_CAT1_MES5: "$OTHER$，這遊戲對你來說太難了，你應該去玩玩超級休閒的遊戲，比如歐陸風雲。"
 AI_MESSAGE_CAT1_MES6: "我敢打賭$OTHER$花在配置部隊上的時間連兩個小時都不到，渣渣！"
 AI_MESSAGE_CAT1_MES7: "哦，看看我現在得到的$OTHER_ADJ$領土。我猜他們根本不需要這些！"
 AI_MESSAGE_CAT1_MES8: "嘿嘿，$OTHER$，也許你下次應該至少試著抵抗一下？如果你覺得這次有抵抗過的話，一定是遊戲裡忘了顯示！"
 AI_MESSAGE_CAT1_MES9: "為什麼$OTHER$在哭？因為他剛剛被吊打了！"
 AI_MESSAGE_CAT1_MES10: "送我“生存空間”的感覺是不是特別好啊，$OTHER$？"
 AI_MESSAGE_CAT2_MES1: "我三分鐘就能把你打出翔，$OTHER$！"
 AI_MESSAGE_CAT2_MES2: "很快$OTHER$的每個人將改說$US_ADJ$話。"
 AI_MESSAGE_CAT2_MES3: "快來看，這個$OTHER_ADJ$渣渣以為能跟我無敵的$US_ADJ$部隊抗衡，簡直可悲！"
 AI_MESSAGE_CAT2_MES4: "你把這個稱之為一場戰爭，$OTHER$？我只能稱之為平推。"
 AI_MESSAGE_CAT2_MES5: "要把$OTHER_ADJ$的工廠維護得良好而整潔，我很快就會用上它們的！"
 AI_MESSAGE_CAT2_MES6: "聽見了麼，$OTHER$？這就是你現在被我吊打的聲音。"
 AI_MESSAGE_CAT2_MES7: "唉，$OTHER$，如果你停止逃跑然後反擊一下也許你不至於這麼慘？"
 AI_MESSAGE_CAT2_MES8: "噗，看起來$COUNTRY$還想抵抗！你的部隊就像是昏迷的雪貂在指揮一樣！"
 AI_MESSAGE_CAT2_MES9: "$COUNTRY$每年的這個時候都很美。我的軍隊真的很享受！"
 AI_MESSAGE_CAT2_MES10: "現在就點投降按鈕，$COUNTRY$!，你根本就是在浪費我的時間。"
 AI_MESSAGE_CAT3_MES1: "$OTHER|U$是黑客！他不可能是通過合法手段贏的我！"
 AI_MESSAGE_CAT3_MES2: "這個遊戲太不平衡了！$OTHER_ADJ$的火星部隊根本無敵，$US_ADJ$的部隊都是紙糊的。"
 AI_MESSAGE_CAT3_MES3: "呵呵，就像我沒有更好的事情幹非要來玩這個垃圾遊戲一樣。"
 AI_MESSAGE_CAT3_MES4: "要不是P社故意把我的盟友的智商寫的跟屎一樣，把我的敵人寫的可以預知所有戰鬥，我才不會輸給$OTHER$！"
 AI_MESSAGE_CAT3_MES5: "ffaSJLgapigjaslgmag s asv lajvlv去你MD$OTHER$，我再也不會和你一起玩了！！！1"
 AI_MESSAGE_CAT3_MES6: "GG $OTHER$，下一次也許你可以試著不作弊？"
 AI_MESSAGE_CAT3_MES7: "哼，那個遊戲系統根本就是跟我作對，我輸給了$OTHER$也是沒辦法的事情。"
 AI_MESSAGE_CAT3_MES8: "哼！如果不是他們在最新的補丁里把$OTHER$改的太變態的了話，這本來會是場公平的戰鬥！"
 AI_MESSAGE_CAT3_MES9: "這就是為什麼《鋼鐵雄心III》是個更好的遊戲，在《鋼鐵雄心III》裡$OTHER$不可能濫用遊戲漏洞擊敗我："
