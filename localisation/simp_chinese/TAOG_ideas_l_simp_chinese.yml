 AST_australian_culture_investments_idea_desc: "§W§Y當移除時§!：\n獲得§Y家園情懷§!，其效果為\n穩定度：§G+10.00%§!\n戰爭支持度：§G+10.00%§!。§!\n"
 AST_a_sense_of_place: "家園情懷"
 AST_a_sense_of_place_desc: "國家認同是凝聚人民的紐帶。在繁榮的文化之下，澳大利亞人已團結一致，決心抵抗任何可能威脅其邊境的勢力。"
 AST_a_sense_of_place_upgraded: "家園情懷"
 AST_a_sense_of_place_upgraded_desc: "曾經安靜發展的民族認同感被賦予了更硬的稜角。這不再僅僅是對一片土地和一種生活方式的自豪——而是一種信念，即澳大利亞所建立的一切值得為之戰鬥，生活在南十字星下的男男女女也準備好這樣做。"
