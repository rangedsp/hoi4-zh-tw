 AST_anti_fascist_measures: "反法西斯措施"
 AST_anti_fascist_measures_desc: "法西斯主義尚未深入澳大利亞，民主力量希望它保持這種狀態。英聯邦調查處將監視和拘留所有可疑分子，以防止任何法西斯團體獲得影響力。"
 ABDA_corps_expeditionnaire_spirit: "遠征軍"
 ABDA_corps_expeditionnaire_spirit_desc: "投入太平洋戰場的法軍在殖民服役中得到了磨練，習慣了在遠離本土的艱苦條件下作戰。他們在東南亞的作戰經驗使他們對日軍的戰術和地形有特別的瞭解，從而在敵軍推進時展現出頑強的韌性。"
 ABDA_maintain_strategic_flexibility_spirit: "戰略靈活性"
 ABDA_maintain_strategic_flexibility_spirit_desc: "美國的工業產出正被導向太平洋戰場，船塢生產加速進行，以維持一支能夠在整片海洋上投射力量的艦隊。通過避免在任何單一戰線上過度投入，美國確保其海軍力量能夠被部署到任何局勢需要的地方。"
 AST_toe_the_line_spirit: "嚴守界線"
 AST_toe_the_line_spirit_desc: "國家號召做出犧牲，民眾作出了回應。配給制、延長工作時間以及將民用生產轉向國家事業，騰出了政府無法通過其他手段獲取的資源。這是一項嚴苛的措施，並未得到所有人的擁護。"
