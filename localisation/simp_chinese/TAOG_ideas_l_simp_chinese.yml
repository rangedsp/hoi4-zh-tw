 idea_SIA_debt_repayment: "債務償還"
 idea_SIA_debt_repayment_desc: "赤字支出計劃的代價正在顯現。收入正被轉用於償還債權人，曾經通過借貸支撐的建設速度已無法維持。"
 idea_SIA_an_unceasy_alliance: "不穩定的同盟"
 idea_SIA_an_unceasy_alliance_desc: "聯盟依舊存在，但裂痕已開始顯現。政府內部的疑慮悄然將這個國家拉向一條更中立的道路。"
 idea_SIA_rural_support: "農村支持"
 idea_SIA_the_sacred_hierarchy: "神聖階序"
 idea_SIA_order_discipline_and_unity: "秩序、紀律與團結"
 idea_SIA_constitutional_virtue: "憲政美德"
 idea_SIA_an_absolute_monarchy: "絕對君主制"
 idea_SIA_an_absolute_monarchy_desc: "所有政治權力歸於王室。國王的話語即是法律，異議遭到鎮壓，王室威望的全部力量被用於國家動員。國王要求忠誠，軍隊是它的工具。"
 idea_SIA_a_constituional_monarchy: "君主立憲制"
 idea_SIA_a_constituional_monarchy_desc: "憲法框架界定了王權的界限，並確立了人民的權利。王室作為團結的象徵而非絕對權威，國家因此更加穩定，更樂於接納新思想，且與民主世界更為一致。"
 idea_SIA_restoring_order: "恢復秩序"
 idea_SIA_military_expansion_costs: "軍事擴張花費"
 idea_SIA_a_modern_economy: "現代化經濟"
 idea_SIA_death_to_communists: "消滅共產主義者"
 idea_SIA_death_to_communists_desc: "反共情緒在軍隊中蔓延，使我們在對抗中國共產黨軍隊時佔據優勢。"
 idea_SIA_death_to_nationalists: "消滅民族主義者"
 idea_SIA_death_to_nationalists_desc: "反民族主義情緒在軍隊中蔓延，使我們在對抗中國民族主義軍隊時佔據優勢。"
 idea_SIA_breaking_the_burmese_line: "突破緬甸防線"
 idea_SIA_the_yellow_dossier: "黃皮檔案"
 idea_SIA_the_yellow_dossier_desc: "關於國內工業狀況的秘密報告迫使我們必須正視深植於體系中的低效問題。報告所要求的改革已在我們的工廠中初見成效，儘管由此引發的動盪也付出了相應代價。"
 idea_SIA_the_yellow_dossier_2: "$idea_SIA_the_yellow_dossier$"
 idea_SIA_the_yellow_dossier_2_desc: "$idea_SIA_the_yellow_dossier_desc$"
 idea_SIA_pacific_war_preparations: "太平洋戰爭準備"
 idea_SIA_a_race_against_time: "與時間賽跑"
 idea_SIA_overheated_economy: "經濟過熱"
 idea_SIA_overheated_economy_desc: "經濟已被推至其自然極限之外。消費需求超出產能，建築熱潮因市場降溫而停滯。"
 idea_SIA_ending_military_grift: "終結軍方貪腐"
 idea_SIA_the_military_oversight_bureau: "$SIA_military_oversight_bureau$"
 idea_SIA_the_military_oversight_bureau_desc: "軍事監察局為新晉指揮官設定更高標準，加速全體軍官隊伍專業能力的培養。"
 idea_SIA_public_credit_debt: "公共信貸債務"
 idea_SIA_public_credit_debt_desc: "國家的債務負擔持續拖累經濟，消耗了原本應投入生產和民用物品的資源。"
 idea_SIA_public_credit_debt_2: "$idea_SIA_public_credit_debt$償還"
 idea_SIA_public_credit_debt_2_desc: "$idea_SIA_public_credit_debt_desc$"
 idea_SIA_revision_of_unequal_treaties: "修訂不平等條約"
 idea_SIA_purged_military: "清洗軍隊"
 idea_SIA_purged_military_desc: "被視為政治不可靠的軍官被撤職，導致軍隊缺乏經驗豐富的領導層，阻礙了組織工作以及剩餘部隊的發展。"
 SIA_khana_ratsadon_inlay_title: "人民黨"
 SIA_civilian_wing_label: "文官派"
 SIA_military_wing_label: "軍方派"
 SIA_wing_state_full_support: "§G全力支持§!"
 SIA_wing_state_slight_support: "§G輕度支持§!"
 SIA_wing_state_neutral: "§Y中立§!"
 SIA_wing_state_opposition: "§R反對§!"
 SIA_wing_state_rebellious: "§R叛逆§!"
 SIA_civilian_wing_history_tt: "人民黨的文官派由進步行政官員和技術官僚領導，其中以§Y比裡·帕儂榮§!為代表。在法國學習法律後，比裡帶著土地改革、國家經濟規劃以及真正賦予普通民眾權力的憲政民主抱負歸國。\n\n文官派總體上§G支持發展§!，主張在教育、基礎設施和工業方面進行投資。他們質疑過度的軍事支出，並警惕任何可能演變為強人獨裁的動向。要獲得他們的支持，最有效的辦法是實施國家現代化並捍衛憲制政府。"
 SIA_military_wing_history_tt: "人民黨的軍方派由自視為革命真正守護者的陸軍軍官主導。其中最富野心的代表人物是§Y鑾披汶·頌堪§!上校，他對歐洲民族主義運動的推崇愈發強烈。\n\n軍方派§G支持重整軍備§!，並傾向於建立一個強勢、中央集權的國家。他們質疑比裡的經濟理念，認為那屬於危險的激進思想，且不願忍受文官在國防議題上的干涉。要獲得他們的忠誠，最有效的辦法是增加軍費投入和推行展示國家力量的政策。"
 idea_SIA_wing_promotion_disruption: "派系重組動盪"
 idea_SIA_wing_promotion_disruption_desc: "公開偏袒人民黨中的某一派系，已使政府失去平衡。受冷落的一方消極怠工，軍隊日常運作陷入混亂，在新格局穩固之前，普通行政事務也將步履維艱。"
 idea_SIA_military_wing_unrest: "軍方派反叛"
 idea_SIA_military_wing_unrest_desc: "軍官們的耐心再度耗盡。奪權未果之後，軍方派系轉而通過破壞、開小差以及公然拒絕合作來發洩怒火。在叛亂分子被鎮壓之前，軍隊的戰鬥力將持續瓦解。"
 idea_SIA_civilian_wing_unrest: "文官派反叛"
 idea_SIA_civilian_wing_unrest_desc: "比裡·帕儂榮的派系再度對政府失去信心。在第二次奪權嘗試被拒後，文官派系轉向罷工、官僚阻撓與城市鼓動。在各方情緒平復之前，經濟將陷入停滯，國家也將變得難以治理。"
 idea_SIA_unwavering_civilian_support: "堅定不移的文官支持"
 idea_SIA_unwavering_civilian_support_desc: "隨著軍方派系解散，合法性問題得以解決，文官政府再無挑戰者。擺脫軍隊干涉之後，比裡和他的技術官僚們以舊政府從未能企及的熱情，全身心投入到治國理政之中。"
 idea_SIA_unified_khana_ratsadon: "統一的人民黨"
 idea_SIA_unified_khana_ratsadon_desc: "軍方派與文官派之間的舊日紛爭業已終結。隨著人民黨兩派終於同心同德，政府得以發揮出前所未有的統一行動力。軍人、行政官員與實業家如今已融為一體。"
