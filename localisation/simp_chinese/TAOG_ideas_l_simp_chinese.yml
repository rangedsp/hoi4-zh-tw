 NZL_railways_board: "政府鐵路局"
 NZL_railways_board_desc: "政府鐵路局成立於1931年，旨在重組鐵路部門，試圖將決策權從政府部門中分離出來。然而，自成立以來，鐵路網絡幾乎沒有改善的跡象。要求政府廢除該局並收回直接控制權的壓力越來越大。"
 NZL_great_depression: "大蕭條"
 NZL_great_depression_desc: "1929年的全球經濟崩潰對以農業為主的新西蘭經濟造成了沉重打擊。各國從新西蘭購買的農產品減少，許多人因此失業，消費者的購買力降低，進而導致其他行業崩潰。多年的緊縮讓這個國家渴望改變方向。"
 NZL_commonwealth_loyalty: "忠於英聯邦"
 NZL_commonwealth_loyalty_desc: "新西蘭仍然是英聯邦的忠實成員，並保留國王作為合法的國家元首。新西蘭的經濟也高度融入了更廣泛的帝國經濟體系。"
