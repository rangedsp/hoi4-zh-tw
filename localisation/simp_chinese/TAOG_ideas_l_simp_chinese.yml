 idea_SIA_civilian_full_support: "文治派：§G全面支持§!"
 idea_SIA_civilian_full_support_desc: "文官派堅定地支持政府。行政人員和技術管理貢獻其專業知識，推動發展。"
 idea_SIA_civilian_slight_support: "文治派：輕度支持"
 idea_SIA_civilian_slight_support_desc: "文官派大體上支持政府。他們的合作帶來了些許切實的好處。"
 idea_SIA_civilian_neutral: "文治派：中立"
 idea_SIA_civilian_neutral_desc: "文官派既不支持也不妨礙政府。行政機構在運轉，但缺少真正政治同盟的推動。"
 idea_SIA_civilian_opposition: "文治派：反對"
 idea_SIA_civilian_opposition_desc: "文官派已轉向反對政府。官員拖拖拉拉，預算分配不當，國家機器出現磨損。"
 idea_SIA_civilian_rebellious: "文治派：§R叛逆§!"
 idea_SIA_civilian_rebellious_desc: "文官派公開反對政府。動盪蔓延，政治決裂的威脅與日俱增。"
 idea_SIA_military_full_support: "軍政派：§G全面支持§!"
 idea_SIA_military_full_support_desc: "軍方派堅定地支持政府。軍官們支持徵兵和武器生產，將軍隊的資源用於國家目標。"
 idea_SIA_military_slight_support: "軍政派：輕度支持"
 idea_SIA_military_slight_support_desc: "軍方派大體上持合作態度。他們的支持為徵兵和武器生產帶來了些許改善，儘管未作出全面承諾。"
 idea_SIA_military_neutral: "軍政派：中立"
 idea_SIA_military_neutral_desc: "軍方派沒有采取任何立場。軍隊履行職責時既不熱情也不抵制，而是等待事態的發展。"
 idea_SIA_military_opposition: "軍方派：反對"
 idea_SIA_military_opposition_desc: "軍方派反對政府。軍官們阻礙裝備生產，對政府事業的支持從軍中流失。"
 idea_SIA_military_rebellious: "軍方派：§R叛逆§!"
 idea_SIA_military_rebellious_desc: "軍方派即將公開反抗。徵兵遭到破壞，武器生產受到影響，政變迫在眉睫。"
 idea_SIA_defenders_of_constitutional_liberty: "憲政自由的捍衛者"
 idea_SIA_civil_service_heroism_1: "護憲主義"
 idea_SIA_civil_service_heroism_1_desc: "文官派不負眾望，其奉獻精神與專業能力悄然加速了科研與地區發展的步伐。"
 idea_SIA_civil_service_heroism_2: "$idea_civil_service_heroism_1$"
 idea_SIA_civil_service_heroism_2_desc: "$idea_SIA_civil_service_heroism_1_desc$"
 idea_SIA_redirected_military_funds: "重新調配的軍費"
 idea_SIA_thai_irredentism: "泰國領土收復主義"
 idea_SIA_oss_special_forces_training: "戰略情報局特種部隊訓練"
 idea_SIA_seized_japanese_funds: "沒收日本資金"
 idea_SIA_seized_japanese_funds_desc: "隨著日本人的計劃破產，他們留下的資金和儲備現在歸我們所用，從而推動了建設和工業產出的激增。"
 idea_SIA_oss_special_forces_training_desc: "我們的特工與戰略情報局共同接受了破壞、滲透及空降行動訓練。這些實戰經驗將我們的特種部隊錘鍊成了強有力的武器。"
 idea_SIA_sold_privy_purse_lands: "出售王室私產土地"
 idea_SIA_sold_privy_purse_lands_desc: "出售王室土地資產為地區注入了資本，緩解了經濟壓力，並釋放了資源用於建設。"
 idea_SIA_war_fervor: "戰爭狂熱"
 idea_SIA_bloodlusted_irredentism: "嗜血的領土收復主義"
 idea_SIA_bloodlusted_irredentism_desc: "領土野心已經釀成了更加激烈的情緒。軍隊懷著收復失地的信念而戰鬥，堅信那片土地本就屬於他們。"
 idea_SIA_the_royal_police_counterweight: "王家警察的效忠"
 idea_SIA_civilian_technocrats_in_institutions: "文官技術官僚"
 idea_SIA_civilian_technocrats_in_institutions_desc: "關鍵政府機構內的文官專家提高了資源開採和政治任命落實的效率。"
 idea_SIA_yuvachon: "泰國青年團"
 idea_SIA_yuvachon_desc: "泰國青年團運動培養國家青年的軍事紀律，建立了受過軍事訓練的人力池，並且激發了民族主義情緒。"
 idea_SIA_yuvachon_2: "$idea_SIA_yuvachon$"
 idea_SIA_yuvachon_2_desc: "$idea_SIA_yuvachon_desc$"
 idea_SIA_rebuilding_the_war_torn_economy: "重建飽受戰爭摧殘的經濟"
 idea_SIA_specialist_marine_forces: "特種海軍陸戰隊"
 idea_SIA_specialist_marine_forces_desc: "一批特種兩棲作戰專家已經接受了跨海突擊行動的培訓和裝備。"
 idea_SIA_rehabilitated_military: "改造軍隊"
 idea_SIA_desperate_gambit: "孤注一擲"
 idea_SIA_desperate_gambit_desc: "也許你還能從自己挖的坑裡爬出來，努力吧！"
 idea_SIA_purged_senior_military: "高級軍官被清洗"
 idea_SIA_purged_senior_military_desc: "被認為對政府構成威脅的高級軍官已被免職。經驗豐富的指揮官的流失對軍隊的凝聚力和職業發展造成了影響。"
 idea_SIA_cemented_control: "鞏固的控制"
 idea_SIA_cemented_control_desc: "政府鞏固了對國家機構的控制。政治反對派已被邊緣化，權力機器現在穩定地掌握在政府手中。"
 idea_SIA_cemented_control_2: "根深蒂固的控制"
 idea_SIA_cemented_control_2_desc: "$idea_SIA_cemented_control_desc$"
 idea_SIA_cemented_control_3: "泰國戰時義務法"
 idea_SIA_cemented_control_3_desc: "當戰爭威脅到王權與國家主權時，每一位體面的泰國人都有責任抵抗佔領，無論是以武力還是其他方式。"
 idea_SIA_suspend_ordinary_legal_procedures: "暫停普通法律程序"
 idea_SIA_thai_cultural_mandates: "泰國文化公告"
 idea_SIA_military_humiliation: "軍方的恥辱"
 idea_SIA_death_defiant: "無畏死亡"
 idea_SIA_death_defiant_desc: "我們已經是死人了。如果你能，就來拿走屬於你的東西吧。"
 idea_SIA_songsuradet_ascendant_0: "頌素拉德定於一尊"
 idea_SIA_songsuradet_ascendant_0_desc: "在成功頂住政府的憤怒之後，頌素拉德將軍鞏固了自己的勢力基礎，並因此變得更加強大。如今他已成為所謂“不可觸碰的人物”，聲望過高、根基深厚，幾乎無法被清除。\n他很可能會干預政府政策，通過拖慢決策來確保自己不會再次成為清洗目標。"
 idea_SIA_songsuradet_ascendant_1: "$idea_SIA_songsuradet_ascendant_0$"
