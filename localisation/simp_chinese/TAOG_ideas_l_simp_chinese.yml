 AST_singapore_strategy_idea: "新加坡防禦建設"
 AST_singapore_strategy_idea_desc: "應澳大利亞的要求，我們將努力改進新加坡的防禦工事。畢竟，新加坡戰略是太平洋防禦政策的核心組成部分。\n\n§W§Y移除時§!（§Y新加坡§!）：\n 添加§G2§!座§Y空軍基地§!。\n 添加§G2§!座§Y海軍基地§!。\n 添加§G1§!座§Y海岸要塞§!。§!\n"
