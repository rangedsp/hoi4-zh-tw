 idea_INS_volksraad: "人民議會"
 idea_INS_volksraad_desc: "人民議會是荷蘭於1918年依據“倫理政策”體系設立的議會機構，旨在建立一個半民主體制，以代表群島內各個少數民族與文化群體。儘管其在理論上是民主性質的，但總督與荷蘭王室擁有無條件的否決權。"
 INS_volksraad_custom_tt: "允許你僱傭§Y人民議會顧問§!\n允許你使用§Y人民議會決議§!"
 INS_great_depression: "大蕭條"
 INS_great_depression_desc: "雖然大蕭條對東印度群島沒有造成太多直接影響，但世界各國隨後採取的保護主義政策對依賴橡膠和石油等原材料出口的東印度經濟產生了毀滅性的影響。"
 INS_great_depression_tt: "§Y$INS_great_depression$§!追加效果："
 INS_dutch_east_indies: "管理失當的行政"
 INS_dutch_east_indies_desc: "東印度群島是一個遼闊的群島，涵蓋了數百種不同的文化與語言，因此被視為一片治理極為困難的殖民地。各類獨立運動、文化隔閡以及大蕭條所帶來的經濟衝擊，使得原本複雜的局面變得更加棘手，最終導致行政效率極其低下。1918年制定的“倫理政策”試圖通過強制實施倫理勞動法規，並賦予少數群體一定的民主代表權，來緩解困境。然而，大蕭條的爆發使得這些政策大多未能真正落實。"
 INS_dutch_east_indies_tt: "§Y$INS_dutch_east_indies$§!追加效果："
 INS_volksraad_tt: "§Y$INS_dutch_east_indies$§!追加效果："
 INS_royal_netherlands_east_indies_army_desc: "荷蘭皇家東印度陸軍是東印度群島長期駐紮的軍隊，獨立於荷蘭運行。雖然該部隊由歐洲士兵和印度尼西亞士兵共同組成，但群島眾多文化之間以及與荷蘭之間的文化和語言隔閡，使得招募工作成為了一個困難且緩慢的過程。"
 idea_INS_netherlands_most_precious_jewel: "荷蘭最珍貴的明珠"
 idea_INS_netherlands_most_precious_jewel_desc: "荷屬東印度群島作為荷蘭的殖民地已有約350年曆史，該殖民地的行政管理與荷蘭政府緊密相連。東印度群島常被稱為“荷蘭王冠上的明珠”，而荷蘭也未曾表現出放鬆對其這顆珍貴明珠掌控的意願。"
 INS_netherlands_most_precious_jewel_tt: "£GFX_trigger_no 可以將自治權提升到自由"
