l_simp_chinese:
 BM_HISTORY_TITLE: "歷史簡介"
 GATHERING_STORM_NAME: "風暴前夜"
 GATHERING_STORM_DESC: "至暗時刻正在迫近。而今，在歐洲，希特勒鞏固了他的權力，並正要將目光投向德意志邊界之外的廣袤天地；墨索里尼治下的意大利，持續進行著大膽的軍事冒險。在亞洲，日本帝國早已蓄勢待發，矛頭直指中國。世界大戰的最後槍響沉寂至今已近二十年，但現在，整個世界似乎再次被置於了滾油當中——只需一點小小的火花，焚滅萬物的烈焰便將滔天而起。"
 HITTING_FAN_NAME: "風暴來臨"
 HITTING_FAN_DESC: "是的，沒錯！那套雨傘即將派上用場。"
 ENG_GATHERING_STORM_DESC: "儘管聯合王國在世界大戰中艱難取勝，但這個偉大帝國的根基顯然已經動搖。不僅整個國家最優秀的一代青年才俊捐軀於佛蘭德及北法的泥濘戰壕，地區動盪與債臺高築的陰影，也早已投射於英聯邦龐大的軀體之上。\n\n如今，上一場戰爭的創痛尚未從人們記憶中淡去，一場新的戰爭又已經迫近到了這個國家的面前。現實正日益明晰，所謂“我們時代的和平”，根本就不存在。"
 FRA_GATHERING_STORM_DESC: "儘管在世界大戰中備受蹂躪，但依靠著強健的經濟，驕傲的法蘭西仍然在復興的道路上步入正軌。然而，大蕭條對這個國家造成的衝擊仍在持續；德國新政權對於支付凡爾賽和約戰爭賠款一事，也表現出嗤之以鼻的態度。\n\n想當年和約簽訂之際，有位法國元帥曾發表過著名的論斷：這不是和平，而只是二十年的休戰。而今，二十年的時間，即將過去。"
 GER_GATHERING_STORM_DESC: "自三年前希特勒的第三帝國取代魏瑪共和國以來，一個涅槃新生的德意志已然崛起。現在，大蕭條最艱難的年頭已經過去，大規模失業正得到有效控制，經濟秩序也已重歸穩定。\n\n如今，凡爾賽和約對德國所施加的軍備限制早已被拋諸腦後。隨著國防軍的日益壯大，又一場世界大戰已初露端倪。"
 ITA_GATHERING_STORM_DESC: "隨著法西斯主義的異軍突起，意大利步入了嶄新的輝煌紀元。如今，它的軍隊正致力於將埃塞俄比亞納入意大利日益龐大的殖民帝國當中，但顯然，墨索里尼的野心遠不會僅此而已。\n\n新的秩序正在歐洲更易，而主宰地中海，一直以來便是意大利的昭昭天命。在這變革的浪潮來臨之際，意大利必須立於濤頭，或者被其湮滅。"
 JAP_GATHERING_STORM_DESC: "大日本帝國正身處國運的十字路口。一方面，帝國陸軍對北進論奉若至寶，竭力鼓吹著向西伯利亞發起進軍。另一方面，帝國海軍則對南進論獨相青睞，意欲將歐洲國家在東南亞與太平洋上建立的富饒殖民地收作囊中之物。\n\n但顯而易見，在此之前，無論如何都避不開中國。日本雖然擁有著令人生畏的軍事力量，但它嗷嗷待哺的工業急需更多的資源加以運轉。時間已所剩無幾，武士之國究竟該何去何從？"
 SOV_GATHERING_STORM_DESC: "當俄國內戰的塵埃落定之際，蘇維埃聯盟最終在前俄羅斯帝國曾下轄的絕大部分疆域內確立了毋庸置疑的統治。儘管該國人民付出了巨大的生命代價，但快速的工業化與集體化，還是在之後有條不紊地相繼完成。\n\n如今，蘇聯既要面臨西方那捲土重來的德國步步緊逼，也要應對東方那逞兇鬥狠的日本虎視眈眈。當然，甚至還有來自黨內的威脅亟需解決……"
 USA_GATHERING_STORM_DESC: "隨著世界大戰的槍聲漸遠，美利堅合眾國重回到了自己孤立主義的繭房之中，並在景氣的二十年代中享受了一時紙醉金迷的經濟繁榮。然而這一切，都在大蕭條降臨這個國家的時候，迎來了戲劇性的落幕。\n\n曾幾何時，美國將不干涉外國戰事奉作唯一至理。但如今，隨著歐亞局勢的日益緊張，“偉大的中立國”或將發現自己仍然將被捲入激盪旋渦，無論它是否願意。"
 OTHER_GATHERING_STORM_DESC: "世上諸國無論大小，似乎並不都甘於坐待下一場全球衝突的爆發。從瀕臨內戰邊緣的列強，到世界大戰後誕生或更易的眾多國家，大博弈的參與者們都不得不在理想與現實之間做出艱難的取捨，而這一切，都將對這個世界的未來產生影響。"
 POL_GATHERING_STORM_DESC: "在慘遭三個帝國瓜分數百年後，如今波蘭終於重獲獨立，但它的處境可並不樂觀。\n\n在東方，蘇聯仍然對自己在波蘇戰爭中所蒙受的失敗羞辱懷恨在心。\n\n在西方，德國元首阿道夫·希特勒對於更廣闊“生存空間”的渴望則更是路人皆知——而據有原德國領土的波蘭，顯然將會成為其實現目標的第一個開刀對象。"
 CAN_GATHERING_STORM_DESC: "投身世界大戰之時，加拿大尚不過一介殖民地。可當大戰結束之際，它卻以國家之姿傲立於世界之林。立國於帕斯尚爾泥濘中的摸爬滾打，如今，縱是躊躇遲疑，加拿大也已在世界舞臺之上邁出了最初的幾步。\n\n不過，在備受國內英法族裔分歧撕裂的影響下，這個新生國家的未來，似乎並不會一帆風順。"
 AST_GATHERING_STORM_DESC: "澳大利亞人用自己的鮮血留名於那次世界大戰的史冊，加里波利之戰的犧牲者們將被永遠銘記——同樣，澳大利亞兒女也不會忘記是因誰的命令造成了這場悲劇。\n\n如今，澳大利亞正在命運的十字路口駐足：是要繼續跟隨宗主國在不久後捲入遙遠歐洲的另一場戰爭，還是專心致志全力應對近在咫尺的家門之災？"
 AST_BLITZKRIEG_TAOG_DESC: "挖地漢們從沉睡中醒來，揉著眼睛，他們的澳新軍團精神也隨之甦醒。當澳大利亞人再次穿上軍裝，告別故土，戰爭的陰雲如同即將鳴響的發令槍般籠罩天空。\n\n近年來的軍事投入是否足以抵禦來自歐洲和亞洲的威脅？英國是否能在全球局勢分身乏術時繼續履行其對澳大利亞的承諾？許多問題仍然存在，但有一個答案始終明確：當戰鬥需要打響時，澳大利亞會出現在那裡。"
 SAF_GATHERING_STORM_DESC: "世界大戰爆發時，許多南非人都拒絕為他們的英國宗主戰鬥，也正因如此，南非軍隊在參戰後的絕大部分時間裡都疲於追趕德國殖民地軍隊，戰績頗微。\n\n如今，一場新的戰爭已初露端倪。但就像過去那樣，仍然還有南非人認為本國不應與德國刀兵相向。甚至還有人認為，眼下正是布爾人的子孫們，重奪祖先被凌駕的自由最好的時刻。"
 NZL_GATHERING_STORM_DESC: "作為南太平洋島嶼上的蕞爾小邦，新西蘭在那次世界大戰中英勇奮戰，於加里波利和西線的血腥戰鬥中傷亡慘重。將近半數的適齡男性參軍服役、出征海外，而他們中的很多人，再也沒能回到自己的故鄉。\n\n距離世界大戰又過去了將近二十年光景，如今，關注世界局勢的新西蘭人民愈發坐立不安——因為這一次，戰爭的威脅，似乎比以往任何時候都更靠近他們的家園……"
 RAJ_GATHERING_STORM_DESC: "作為大英帝國皇冠上的耀眼明珠，英屬印度是一個既彰顯帝國權勢，卻同時也暴露帝國軟肋的奇怪複合體。一小部分英國公務員的精英不僅統治著這個臣民數億、幅員遼闊的次大陸，同時還從其中徵召組建了在那次世界大戰中驍勇作戰的英印軍隊。\n\n印度的領袖們曾寄希望於世界大戰中所付出的犧牲，能幫助他們從英國手中換取獨立，但目前來看，這一希望顯然已經落空。隨著一場新的戰爭漸露端倪，許多印度人認為如今是時候去奪取自由了——不擇一切手段。"
 SWI_GATHERING_STORM_DESC: "在相互尊重、相互扶持的原則基礎上，瑞士有著令人矚目的文化多元以及政治分權。正因如此，縱是放眼歐洲列國，這個國家都是獨一無二的存在。\n\n有賴於堅定的中立，瑞士在世界大戰中免遭戰火摧殘。不過，有鑑於那次世界大戰之慘烈，他們對堅決自衛的必要也有著更加深刻的認識。隨著戰爭陰雲的迫近，這個和平的國家必須就是否繼續維持中立做出抉擇。如若武裝中立已不再能威懾潛在的侵略者，那瑞士或不得不屈身與某一鄰國構建盟約——亦或是在敵國入侵之前先發制人。"
 SWI_BLITZKRIEG_DESC: "即便是在德奧合併之前，瑞士的局勢就已十分緊張，更別說是在德意志國嚐到輕鬆吞併德語區領土後的現在了。真正的威脅正愈發迫近這個和平的山巔之國，現在，瑞士的絕對中立將受到前所未有的嚴峻考驗，若是稍有差池，或許，甚至是防衛能力亦要接受風暴的洗禮。"
 BLITZKRIEG_NAME: "閃電戰"
 BLITZKRIEG_DESC: "在過去的幾年裡，整個世界見證了幾場新的戰爭在歐亞大陸相繼爆發。現在，西班牙已落入了民族主義者的手中。日本為了領土與蘇聯和中國大打出手，並在與後者的戰爭中勢頭更盛。而對於歐洲其他國家而言，蘇德兩國新近簽訂的互不侵犯條約，則或許是個壞消息。"
 ENG_BLITZKRIEG_DESC: "儘管聯合王國在世界大戰中艱難取勝，但這個偉大帝國的根基顯然已經動搖。不僅整個國家最優秀的一代青年才俊捐軀於佛蘭德及北法的泥濘戰壕，地區動盪與債臺高築的陰影，也早已投射於英聯邦龐大的軀體之上。\n\n如今，上一場戰爭的創痛尚未從人們記憶中淡去，一場新的戰爭又已經迫近到了這個國家的面前。現實正日益明晰，所謂“我們時代的和平”，根本就不存在。"
 FRA_BLITZKRIEG_DESC: "世界大戰的慘痛記憶尚未淡去，如今，在德國公然表示無意維繫和平後，法蘭西即將面臨又一場新的戰爭。而加強邊境的防禦，明智地選擇盟友，對法國而言則是避免災難性戰事的關鍵所在。\n\n既然驕傲的法蘭西打贏了上一場戰爭，那麼這一次，也定將如此！"
 GER_BLITZKRIEG_DESC: "隨著德國軍隊重返萊茵蘭，法國人和英國人已對德國的意圖愈發起疑。不過眼下，慕尼黑協定默許了德國為保護當地德裔的利益而吞併蘇臺德；莫洛托夫-裡賓特洛甫條約則確保了蘇德兩國間的互不侵犯，並對雙方如何瓜分波蘭做出了協商。\n\n德意志已為此時此刻等待了太久，奮起之機就是現在！"
 JAP_BLITZKRIEG_DESC: "東南戰火正如火如荼。儘管在1939年初遭受略微損失，但如今，大片的中國領土仍然還是被成功置於了日本的統治下。歐洲局勢正日益緊張，當蘇聯的注意力因此而被吸引的時候，他們便不會再介入到亞洲的戰事當中。\n\n而在日本徹底掌握中國的資源後，蘇聯人亦將不足為懼。"
 ITA_BLITZKRIEG_DESC: "因在一年前慕尼黑協定的簽訂過程中所發揮的作用，意大利領袖墨索里尼如今被譽為和平的守護者。然而，德國的領土擴張已經讓意大利看到，如果與德國人達成諒解，意大利將能實現更多的領土主張。\n\n對阿爾巴尼亞的征服不過是意大利軍隊的一次牛刀小試，接下來，其他國家最好自求多福。"
 SOV_BLITZKRIEG_DESC: "通過在西班牙內戰期間支持曼努埃爾·阿薩尼亞治下的西班牙第二共和國，蘇聯已經清楚地向德意兩國表明了自己的態度。而在最近與日本軍隊的幾場邊境衝突中所取得的勝利，則彰顯了蘇聯已經成為任何單一國家無法撼動之偉大力量的事實。\n\n至於和德國人達成的瓜分波蘭和波羅的海諸國的約定，至少現在來說，蘇聯會樂享其成。"
 USA_BLITZKRIEG_DESC: "儘管對美利堅合眾國而言仍然稱不上真正的威脅，但日益緊張的歐洲局勢仍然令人擔憂。德國的侵略行徑，顯然將在不久之後為全世界所知。目前西方世界看起來仍是一片歌舞昇平，但從以防萬一的角度來說，一些軍事上的準備也絕非杞人憂天。\n\n但無論如何，只要合眾國被捲入了戰爭，那麼，他們便會成為這場戰爭的終結者。"
 OTHER_BLITZKRIEG_DESC: "世上諸國無論大小，似乎並不都甘於坐待下一場全球衝突的爆發。從瀕臨內戰邊緣的列強，到世界大戰後誕生或更易的眾多國家，大博弈的參與者們都不得不在理想與現實之間做出艱難的取捨，而這一切，都將對這個世界的未來產生影響。"
