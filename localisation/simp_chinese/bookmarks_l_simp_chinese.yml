 NZL_BLITZKRIEG_DESC: "作為南太平洋島嶼上的蕞爾小邦，新西蘭在那次世界大戰中英勇奮戰，於加里波利和西線的血腥戰鬥中傷亡慘重。將近半數的適齡男性參軍服役、出征海外，而他們中的很多人，再也沒能回到自己的故鄉。\n\n距離世界大戰又過去了將近二十年光景，如今，關注世界局勢的新西蘭人民愈發坐立不安——因為這一次，戰爭的威脅，似乎比以往任何時候都更靠近他們的家園……"
 RAJ_BLITZKRIEG_DESC: "作為大英帝國皇冠上的耀眼明珠，英屬印度是一個既彰顯帝國權勢，卻同時也暴露帝國軟肋的奇怪複合體。一小部分英國公務員的精英不僅統治著這個臣民數億、幅員遼闊的次大陸，同時還從其中徵召組建了在那次世界大戰中驍勇作戰的英印軍隊。\n\n印度的領袖們曾寄希望於世界大戰中所付出的犧牲，能幫助他們從英國手中換取獨立，但目前來看，這一希望顯然已經落空。隨著一場新的戰爭漸露端倪，許多印度人認為如今是時候去奪取自由了——不擇一切手段。"
 CZE_GATHERING_STORM_DESC: "世界大戰期間，捷克軍團與協約國軍隊並肩轉戰歐洲各地，為爭取本國的獨立全力奮戰。他們的努力沒有白費，戰後，捷克斯洛伐克於奧匈帝國的灰燼中驟然新生。\n\n建國之後，捷克斯洛伐克拉攏南斯拉夫和羅馬尼亞組建“小協約國”聯盟，目標直指撲滅匈牙利復辟奧匈帝國的企圖。然而，隨著德國的權勢增長，歐洲的政治格局正在迅速地發生變化。"
 HUN_GATHERING_STORM_DESC: "世界大戰結束後，作為末代奧匈帝國的半壁江山，匈牙利被獲勝的協約國集團視作戰敗者處以懲罰。根據特里亞農條約，匈牙利喪失近三分之二的領土。數百萬匈牙利人轉眼間成為了困陷異國艱難求生的少數族裔，匈牙利本國的經濟亦是僅剩滿目瘡痍。除此之外，為確保匈牙利再無威脅歐洲和平的可能，條約還對軍備的重整做出了嚴格的限制。\n\n但是，隨著歐洲政局的風雲突變，能讓匈牙利糾正過去錯誤，並重拾昔日榮光的時刻，或許已經到來。"
 ROM_GATHERING_STORM_DESC: "得益於在那次世界大戰中站隊勝利者陣營，羅馬尼亞在戰後獲得了新的領土和人民——雖然其中並不都是羅馬尼亞人。為防止遭到那些被迫割讓領土國家的報復，羅馬尼亞曾幾何時在跨巴爾幹地區組建了自己的聯盟體系。但最近幾年，由於在本國內部的瑣事中泥足深陷，卡羅爾二世國王的政府已經放任這個聯盟體系分崩離析。\n\n正因如此，隨著歐洲政局的變化，羅馬尼亞可能即將發現它自己孤立無援——而且脆弱萬分。"
 HUN_BLITZKRIEG_DESC: "世界大戰結束後，作為末代奧匈帝國的半壁江山，匈牙利被獲勝的協約國集團視作戰敗者處以懲罰。根據特里亞農條約，匈牙利喪失近三分之二的領土。數百萬匈牙利人轉眼間成為了困陷異國艱難求生的少數族裔，匈牙利本國的經濟亦是僅剩滿目瘡痍。除此之外，為確保匈牙利再無威脅歐洲和平的可能，條約還對軍備的重整做出了嚴格的限制。\n\n但是，隨著歐洲政局的風雲突變，能讓匈牙利糾正過去錯誤，並重拾昔日榮光的時刻，或許已經到來。"
 ROM_BLITZKRIEG_DESC: "得益於在那次世界大戰中站隊勝利者陣營，羅馬尼亞在戰後獲得了新的領土和人民——雖然其中並不都是羅馬尼亞人。為防止遭到那些被迫割讓領土國家的報復，羅馬尼亞曾幾何時在跨巴爾幹地區組建了自己的聯盟體系。但最近幾年，由於在本國內部的瑣事中泥足深陷，卡羅爾二世國王的政府已經放任這個聯盟體系分崩離析。\n\n正因如此，隨著歐洲政局的變化，羅馬尼亞可能即將發現它自己孤立無援——而且脆弱萬分。"
 YUG_GATHERING_STORM_DESC: "1922年，隨著早前獨立的塞爾維亞王國與新生的塞爾維亞人、克羅地亞人、斯洛文尼亞人國家相整合，南斯拉夫國家宣告誕生。建國伊始，南斯拉夫便加入小協約國和巴爾幹條約以確保自身的獨立。但隨著近期亞歷山大國王遇刺，日益高漲的內部民族主義憂患以及德意兩國步步緊逼的外來壓力，已經在該國迸發了劇烈的動盪——而這一切，迫使南斯拉夫必須重新審視其在政治及戰略上的立場。"
 YUG_BLITZKRIEG_DESC: "1922年，隨著早前獨立的塞爾維亞王國與新生的塞爾維亞人、克羅地亞人、斯洛文尼亞人國家相整合，南斯拉夫國家宣告誕生。建國伊始，南斯拉夫便加入小協約國和巴爾幹條約以確保自身的獨立。但隨著近期亞歷山大國王遇刺，日益高漲的內部民族主義憂患以及德意兩國步步緊逼的外來壓力，已經在該國迸發了劇烈的動盪——而這一切，迫使南斯拉夫必須重新審視其在政治及戰略上的立場。"
 CHI_GATHERING_STORM_DESC: "縱使辛亥功成，滿清龍旗落地，新生之民國，而今仍是舉步維艱。放眼天下，邊境四方，各路軍閥割據大片江山。中原腹地，共黨流竄山林鄉野。國境線外，日寇挾滿清末帝為傀，更欲借其名號，鯨吞中華大地為己有。\n\n強敵環伺之下，蔣中正政府若欲開闢生路重整中華，則勢必難免取捨，在未來做出艱難抉擇。"
 PRC_GATHERING_STORM_DESC: "僅僅兩年前，中國共產黨還面臨著生死存亡的危機。彼時為延續革命火種，紅軍踏上史詩般的漫長征途——後世稱之謂“長征”。如今，若是僅憑歷經長征艱苦卓絕考驗倖存的殘軍，以及薄如白紙的工業，中共在內戰中的勝機可謂渺茫。\n\n但只要假以時日，人民群眾便可重聚於共產主義紅旗之下，新的革命軍隊將涅槃重生，新的革命根據地亦將再成燎原之勢。而當時機成熟之際，革命鬥爭的浪潮便將再度席捲中華大地，直到奪取那最後偉大的勝利。"
 CHI_BLITZKRIEG_DESC: "抗戰至今已二載有餘，國軍將士築起血肉長城，全力阻截日寇侵略。然富庶之地淪喪敵手，西方友邦支援不力，共軍消極遊而不擊，山河破碎舉國震盪。\n\n而今，戰火蔓延勢不可擋，家國山河亦將面臨更甚磨難。所幸日寇攻勢，業已為我遼闊國土遲滯，其輩貪婪，亦或在其後轉戰別處他方。如此，則假以時日，那盟國新友，或將扭轉乾坤……"
 PRC_BLITZKRIEG_DESC: "面對日寇的全面侵略，國共兩黨艱難達成和解共赴國難。然而雙方彼此深知，這樣的統一戰線或許並不會長久。而今，延安根據地已成烽火前線，中共直面日寇狂瀾，浴血奮戰。\n\n為革命之將來，中共必須審慎利用手中的資源。任何在抗戰中所遭受的損失傷亡，勢必將會左右未來武裝推翻國民黨時的勝敗走向。而這樣的損失，似乎正是蔣介石政府所期望的……"
 MAN_GATHERING_STORM_DESC: "自六歲時被逐下龍椅後，清末帝溥儀便韜光養晦，蟄伏以待良機。而今，儘管曾屬於溥儀的天下已在一系列的中國內戰中支離破碎，但同時，他也結交到了新的靠山——日本。\n\n對溥儀而言，1932年成立的滿洲帝國不過是他收復祖宗江山的奠基石。目前，他還需要日軍來維持統治，但等到時機到來，昔日的真龍天子也許就能砸碎腳鐐，順應天命……"
 MAN_BLITZKRIEG_DESC: "自六歲時被逐下龍椅後，清末帝溥儀便韜光養晦，蟄伏以待良機。而今，儘管曾屬於溥儀的天下已在一系列的中國內戰中支離破碎，但同時，他也結交到了新的靠山——日本。\n\n對溥儀而言，1932年成立的滿洲帝國不過是他收復祖宗江山的奠基石。目前，他還需要日軍來維持統治，但等到時機到來，昔日的真龍天子也許就能砸碎腳鐐，順應天命……"
 MAN_TSR_GATHERING_STORM_DESC: "滿洲帝國的根基並不穩固。1932年，日本人為使其對滿洲的統治合法化，扶植溥儀成為這個新國家的皇帝。\n\n如今的問題在於，溥儀是會繼續隱於幕後，任由協和會和日本陸軍統治國家，還是會試圖奪回權力，進而有可能將權力徹底輸給一群同樣覬覦權力的匪幫？"
 MAN_TSR_BLITZKRIEG_DESC: "滿洲國，這個曾由日本軍隊從中國北方強行割裂出來、靠扶植溥儀為皇帝來維繫一絲合法性的殘存政權，如今已成為大東亞共榮圈的正式成員。現在的問題是，這個國家是會繼續由協和會掌控，還是會落入溥儀手中？"
 WARLORDS_GATHERING_STORM_DESC: "中央政府的軟弱無力或許給予了每一位野心家飛黃騰達的機會。如今，在中國的偏遠地方，軍閥大員們盤踞在山高皇帝遠的轄區內自行其是，對中央政府的命令置若罔顧。\n\n然而戰亂將起，每一位軍閥現在都將面臨艱難抉擇：是順從中央政府恪盡職守，還是與共產黨稱兄道弟？無論選擇哪方，都有可能為自己在未來謀得一席之地。當然，也還有第三種可能性——將全中國納入自己的掌控之下。"
 WARLORDS_BLITZKRIEG_DESC: "抗日戰爭的爆發迫使中國各路軍閥攜起手來一致對外，然而毫無疑問，這樣的聯盟不過是空中樓閣註定不會長久。遲早有一天，統一戰線將會土崩瓦解。而到那時，鐵腕野心家們逐鹿中原、爭奪中華霸主的大戲，也將再度拉開帷幕。"
 MEXICO_GATHERING_STORM_DESC: "在暴虐的波菲里奧·迪亞斯被推翻之後，墨西哥陷入到持續二十餘年的連綿內戰當中。一方面，中央集權派與地方分治派爭鬥不斷。另一方面，農民和社會主義者聯合起來，向著種植園主高舉起反抗的大旗。除此之外，還有國家政權與宗教間源起自啟蒙運動時期的衝突。這一切，使得墨西哥舉國上下都充斥著恐怖的氛圍。\n\n如今，儘管世俗政府堅稱自己贏得了戰鬥，但它所獲得的也僅僅只是支離破碎的權冠。或許當一切落幕，墨西哥涅槃重生之後，一個截然不同的勝利者將會來到舞臺的中央。"
 MEXICO_BLITZKRIEG_DESC: "相較於已流亡美國的前任總統普魯塔爾科·卡列斯，拉薩羅·卡德納斯及其政府更有利地推動了積極的社會變革。如今，隨著經濟形勢的穩定以及外國石油公司收歸國管，墨西哥政府終於可以開始將目光投向海外。誠然，眼下美國在各處戰線樹敵頗多，其很有可能會因此對墨西哥國有化標準石油公司的行為網開一面。但若是結交美利堅之敵，或許也更有利可圖……"
 NETHERLANDS_GATHERING_STORM_DESC: "面對日益加劇的世界緊張局勢，荷蘭政府蒿目時艱。國家經濟萎靡不振，和平主義聲勢浩大，中立觀念根深蒂固，潛在盟國避而遠之，種種因素，致使荷蘭政府在防禦備戰事宜上無能為力。\n\n與此同時，作為歐洲大陸貿易的門戶，英德兩國都寄希望於同荷蘭“合作”來挫敗對方，對其任何一方的貿然拒絕都可能被視為敵意並引發戰爭。思來想去，或許抵抗這種侵略行徑唯一的可行之法，便是轉進殖民地……"
 NETHERLANDS_BLITZKRIEG_DESC: "德國與其他歐洲列強間的戰爭似乎已不可避免，儘管荷蘭再次寄希望於自己的中立不會遭到侵犯，但其領導人卻正在考慮與南方鄰國秘密制定參謀計劃，以防備潛在的敵對行為。\n\n軍隊已被動員，防線的構築工作也正快馬加鞭，一切都旨在試圖讓荷蘭國家做好準備，儘可能抵禦任何侵犯其主權的行為。當然，就算這一切都失敗了，再不濟荷蘭也還有殖民地呢……"
 SPAIN_GATHERING_STORM_DESC: "在西班牙第二共和國誕生的前五年裡，罷工、軍事政變以及大規模革命暴動便已接連席捲了這個根基未穩的國家。儘管它在這些挑戰中倖存了下來，但西班牙社會仍舊被安那其主義者、共產黨人和長槍黨人之間的政治分化和暴力行徑所撕裂。\n\n如今，各方都對即將到來的1936年大選翹首以盼，但是無論哪一方獲得了勝利，似乎都無法為國家帶來穩定。隨著暴亂的持續，軍隊已經蠢蠢欲動，伺機而發……"
 SPAIN_BLITZKRIEG_DESC: "過去三年以來摧毀這個國家的內戰，而今終於塵埃落定。在佛朗哥的領導下，勝利者們現在必須著眼於西班牙的重建，在清剿殘餘抵抗的同時，彌合這場戰爭所帶來的撕裂。\n\n然而，隨著世界正不可挽回地向著一場規模更大、更血腥的戰爭深淵滑去，時間已刻不容緩。如果西班牙仍想守土自立，甚至在將至的衝突中也覓得機遇果實的話，那麼它就必須及時在工業和軍事兩方面都做好準備。"
 PORTUGAL_GATHERING_STORM_DESC: "自薩拉查於1932年掌權起，葡萄牙已經與第一共和國時期的動盪歲月漸行漸遠。財政自足擺脫赤字泥潭，政治自主不再依附列強，這兩點促成了新國家體制的建立，併為葡萄牙的工業發展和軍隊現代化奠定了基礎。\n\n現如今，鄰國西班牙政局動盪、社會不安，世界局勢也日益惡化、朽木難雕，葡萄牙必須為自己的前路做出抉擇……"
 PORTUGAL_BLITZKRIEG_DESC: "西班牙內戰期間，保守的薩拉查政權表面上維持著葡萄牙的中立，實則積極支援民族主義者一方，以此最終促成了該國共產黨人和安那其主義者們的敗局。\n\n隨著伊比利亞半島重歸穩定，現在，葡萄牙是時候著眼選擇海外的潛在盟友，並考慮本國在這場似乎已不可避免的全球衝突中所要扮演的角色了。"
 LIT_GATHERING_STORM_DESC: "面對著波蘭仍賊心不死地試圖裹挾著立陶宛組建新的聯邦，面對著蘇聯對立陶宛自決權益的傲慢藐視，面對著梅梅爾地區納粹威脅的步步緊逼……而今，為了國家的穩定與獨立，一位獨立戰爭的老兵已然挺身而出。由於手中的資源極為有限，安塔納斯·斯梅托納所領導的政權註定命途多舛；更不要說，因領袖奧古斯丁納斯·沃爾德馬拉斯鋃鐺入獄，那已然被激怒的法西斯準軍事組織“鐵狼”正橫行鄉野。大戰將至，立陶宛必須不惜代價保衛本國的人民，無論代價幾何。"
 LIT_BLITZKRIEG_DESC: "而今，大幕將啟。正當安塔納斯·斯梅托納確立專制統治，再造立陶宛共和國之偉夢已然實現之際，蘇聯人呈上邀約，允諾在瓜分波蘭之際將維爾紐斯歸還立陶宛。縱然此誠良機，但斯梅托納又能指望斯大林和他飢渴的戰爭機器再尊重立陶宛主權多久呢？"
 LAT_GATHERING_STORM_DESC: "儘管五月政變至今已兩年有餘，但拉脫維亞卻依舊身陷動盪之中。曾經的國家總理卡爾利斯·烏爾馬尼斯如今自詡為獨裁者，對民主人士猛烈抨擊其損害拉脫維亞國家自由的呼聲置若罔聞。除此之外，由於領袖古斯塔夫斯·採爾明什遭到逮捕，該國的法西斯組織“雷霆十字”亦正怒火中燒，若那所謂的獨裁者無法迅速剷除此威脅，則拉脫維亞恐難逃內戰的摧殘。\n\n來自東西兩方的威脅已然迫近，勝利亦或是湮滅，拉脫維亞正徘徊於刀鋒之尖。"
 LAT_BLITZKRIEG_DESC: "對蘇聯貿易的過度依賴，如今終於反噬了拉脫維亞的獨裁政權。蘇維埃聯盟和德意志國皆已露出鋒利的獠牙，死亡的氣息正直逼烏爾馬尼斯的咽喉。此等危局，若要捍衛拉脫維亞的獨立，則大規模的動員勢在必行；亦或者，獨裁當局更寧願向蘇聯人屈膝求饒……"
 EST_GATHERING_STORM_DESC: "面對東方的共產主義威脅以及南方的法西斯災厄，為捍衛愛沙尼亞的未來，康斯坦丁·佩茨及其祖國聯盟正執掌著本國的大權。但除此之外，一群獨立戰爭的老兵們正在該國境內組織著名為“瓦普”的運動；右翼的民粹主義者們也虎視眈眈，試圖從中立政府的手中搶班奪權。\n\n愛沙尼亞的前路仍舊未定。佩茨能夠捍衛本國的和平，並實現緘默的時代嗎？還是說，那些瓦普戰士們將會取而代之，開創全新的愛沙尼亞國度？"
 EST_BLITZKRIEG_DESC: "愛沙尼亞如今孤立無援，在舊日盟友袖手旁觀的情況下，這個國家已然深陷自東方以及海洋上席捲而來的赤潮威脅當中。儘管舉國兵敗似乎已是不可避免，但愛沙尼亞人的國家仍有機會存續下去：要麼就此成為蘇維埃聯盟恭順的奴僕；亦或者依託著本國的密林，將抵抗大業進行到底。"
 BUL_GATHERING_STORM_DESC: "自1878年解放戰爭和西方民主國家否決聖斯特凡諾條約以來，保加利亞已在巴爾幹半島的刀光劍影與坑蒙暗算中屹立多年。作為那次世界大戰中被擊敗的同盟國集團成員，保加利亞蒙受了慘重的領土損失，同時，訥伊條約也對該國施加了嚴厲的經濟制裁和軍備限制。\n\n但隨著歐洲政治和社會的風雲變幻，如今已經到了保加利亞決定自身命運並找回其在巴爾幹半島應有地位的時候了。"
 BUL_BLITZKRIEG_DESC: "在過去的幾年裡，沙皇鮑里斯三世已經鞏固了自己的權力，他粉碎了環節集團的陰謀暗算，並重新使保加利亞在國際政治舞臺上追隨德國的步調。在保加利亞最近與巴爾幹鄰國的談判中，英國解除了自世界大戰後對保加利亞施加的軍備限制，希望藉此阻止保加利亞與軸心國結盟。\n如今沙皇仍試圖在不將國家捲入新衝突的前提下收復往昔淪喪的領土，但是鑑於歐洲日益緊張的國際局勢，保加利亞的未來也將有待觀察……"
 GRE_GATHERING_STORM_DESC: "希臘國家正身處於危機當中，長久以來，君主派與共和派之間就治國理念的分歧吵得不可開交，而爭鬥最終導致了1935年希臘第二共和國的垮臺。如今復辟的外國專制君主在國民之中備受爭議，其未來也有待商榷。\n\n受困於瑣碎的國內政事，在希臘國境線北方劍拔弩張且渴望復仇的保加利亞被放任長存，與此同時，有著多年恩怨的新晉盟友土耳其人正在東方歷經政治劇變，至於那頭在亞得里亞海彼岸摩拳擦掌的怪獸，則更是無需多言……"
 GRE_BLITZKRIEG_DESC: "在獨裁者揚尼斯·梅塔克薩斯的力挽狂瀾下，希臘恢復了穩定。四年計劃使希臘的工業基礎在過去幾年中得到了極大的發展，並且該國的債務——雖然仍舊債臺高築，但已經表現出某種程度上的可控跡象。\n\n不幸的是，強力的政府和明智的經濟政策如今可能對這個困境中的國家而言意義甚微。一場可怕的大戰已迫在眉睫，儘管梅塔克薩斯堅定地主張希臘將在未來任何可能的衝突中保持中立，但最終的抉擇可能不是他可以掌控的……"
 TUR_GATHERING_STORM_DESC: "土耳其共和國誕生於奧斯曼帝國的餘燼中，在1923年的土耳其獨立戰爭當中，土耳其人以鐵與血的代價捍衛了自身的獨立，儘管這場鬥爭是正義的，但其代價卻仍然沉重地壓在了土耳其人民身上。\n\n如今宗教保守派在國家腹地肆虐，並以最強烈的苛責抵制全國範圍內的現代化嘗試，而庫爾德民族主義者們也盤踞於國境的東方。受人尊敬的總統穆斯塔法·凱末爾·阿塔圖爾克必須團結國家，或者讓賢於他人，但無論怎樣，他們必須儘快採取行動，歐洲正大禍將至……"
 TUR_BLITZKRIEG_DESC: "土耳其國父穆斯塔法·凱末爾·阿塔圖爾克已然逝世。舉國哀悼中的土耳其如今由政治強人伊斯麥特·伊諾努執掌大權。伊諾努接手的是一個支離破碎的國家，指引國家前路的偉人的逝世，使這樣的分裂表現得更加明顯。\n\n除國內的隱憂之外，伊諾努還需面臨歐洲戰爭的端倪，這場戰爭就破壞力而言甚至有可能超越那次世界大戰。過去阿塔圖爾克常將“國內和平，世界和平”的口號掛在嘴邊，那伊諾努有希望在這動盪的時代守住和平嗎?"
 ETH_GATHERING_STORM_DESC: "埃塞俄比亞的國祚綿延數個世紀，帝國皇室亦與之同壽。而今，正當海爾·塞拉西皇帝高歌猛進推動帝國現代化之際，隨著意大利發動了近40年來的又一場侵略，一切被迫戛然中止。然而，縱使形勢危急，但倘若帝國上下眾志一心，再度擊退來犯侵略者也絕非痴人說夢。\n\n為了埃塞俄比亞之自由長存，整個東非都必須從歐洲殖民統治枷鎖之下得到解放，成敗在此一舉。"
 AFA_GATHERING_STORM_DESC: "阿法爾人世代生活在廣闊的達納基爾沙漠，橫跨從東部的吉布提到西部的埃塞俄比亞。然而近來，意大利在該地區的影響力日益增強，穆罕默德·亞約更傾向於貝尼托·墨索里尼，而非海爾·塞拉西。\n\n隨著第二次意埃戰爭愈演愈烈，阿法爾人似乎很快就要做出抉擇：他們的未來是追隨意大利，還是獨立自主更好？"
 FIN_GATHERING_STORM_DESC: "自1917年從俄羅斯治下贏得獨立後，歷經血腥內戰洗禮的芬蘭，正以新生國家之姿屹立於世界之林。現在，一方面，戰爭留下的傷痕依舊清晰可見，聯合政府也仍為實現協同共治掙扎蹣跚。另一方面，蘇聯似乎已經盯上了列寧格勒附近的芬蘭領土，而芬蘭還尚未對潛在的衝突做好準備。但即便如此，芬蘭在軍事上仍有著歷史悠久的英勇與果決，它的戰士們也對祖國滿懷著無上忠誠的狂熱。\n\n隨著局勢的不斷緊張，衝突的威脅也日益加劇，芬蘭，正身處命途未定的十字路口。"
 FIN_BLITZKRIEG_DESC: "芬蘭如今身處蘇聯和納粹德國之間，而兩大列強的緊張態勢已是劍拔弩張。隨著與蘇聯談判的破裂，現在，芬蘭政府必須就如何保衛本國主權做出艱難的決斷。\n\n雖然此前已在強化國防方面不懈努力，但芬蘭陸軍眼下仍舊缺槍少彈，至於海空軍力量，則更是近似於無。儘管如此，芬蘭強烈的民族自豪感與英武鬥志仍然熠熠生輝，舉國上下誓要不惜一切代價，捍衛本國的獨立。"
 SWE_GATHERING_STORM_DESC: "儘管在世界大戰期間嚴守中立之姿，但受到英國對德封鎖的波及，瑞典仍然捱過了段艱難的歲月。而今，隨著歐陸緊張局勢的升級，瑞典人民不免擔心，他們是否又將在歐洲列強的股掌玩弄之下受苦受難。\n\n與此同時，在建立足以救濟老弱貧困的福利之邦，以及創建維繫國家悠久中立傳統的軍事威懾力量這兩方面，該國社會民主黨人正試圖尋找平衡，實現兼得。"
 SWE_BLITZKRIEG_DESC: "德國不斷對周遭鄰國疆域的巧取豪奪，讓又一場世界大戰的轟鳴已然歷歷在耳。而今，隨著窮兵黷武的德意志對瑞典鐵礦的渴求與日俱增，人們不免開始驚恐，他們對領土的野心或許很快就會越過波羅的海，直逼斯堪的納維亞而來。\n\n有鑑於此威脅，倚靠著本國蓬勃興旺的國防工業，瑞典軍隊業已開啟軍備重整及現代化進程。至於接下來，這個國家是否有能力抵禦侵略，讓我們拭目以待。"
 NOR_GATHERING_STORM_DESC: "自1905年從瑞典治下獲得獨立以來，挪威一直在確立本國政治基礎的問題上跌跌撞撞，直到現在，才在從艱難的三十年代恢復的進程中，表現出了政治穩定的初步跡象。\n\n而今，隨著南方諸鄰國間的爭端戰爭似乎已前所未有的迫近，挪威必須尋求可行之徑，以維繫自身脆弱的獨立。對此，尼高斯沃爾內閣正寄希望於通過中立與裁軍，儘可能表現得對歐洲列強毫無威脅，但此舉究竟結果如何，仍有待觀察。"
 NOR_BLITZKRIEG_DESC: "隨著第三帝國的權勢與疆域與日俱增，挪威國內的法西斯黨徒似乎已經做好準備，隨時利用可能的德國入侵搶班奪權，並將國家出賣給敵人。\n\n同時，維德孔·吉斯林，這個納粹黨肆無忌憚的諂媚之徒，也似乎正密謀著帶領其民族統一黨竊取大權。內憂外患之下，如今已是挪威上下舉國一致加緊準備、共御其侮的時候了。"
 DEN_GATHERING_STORM_DESC: "當歐洲緊張局勢再度升級之際，丹麥國家不僅軍力孱弱，該國的經濟，也依舊在大蕭條的衝擊中備受蹂躪。\n\n面對高漲的失業，以及邊緣政黨日益激進的運動，丹麥人必須想出可行之策加以應對。與此同時，亦要重新考量中立與綏靖政策的是非曲直。\n\n眼下，丹麥尚且仍是自己命運的主宰，但還能維持多久，則就有待觀察了。"
 DEN_BLITZKRIEG_DESC: "為安撫實力與疆域都更強更盛的鄰國德意志，連年削減軍費預算以至軍力廢弛的丹麥，現在已經身處於千鈞一髮的累卵危局之下。\n\n然而，不斷的綏靖並沒有妨礙德意志國，其在歐洲的權勢正不斷得到鞏固，其對他國的領土宣稱亦接連付諸現實。事到如今，丹麥只能寄希望於自己公開宣告，並曾在那次世界大戰中救國家於水火的中立了。"
 ICE_GATHERING_STORM_DESC: "冰島長久以來與世隔絕，卻也有著熱衷探索的悠久傳統。1814年，當其前任宗主挪威淪為瑞典的屬國時，冰島的命運便與現任宗主丹麥相交織，並於1919年獲得了本國的自治權。\n\n然而，如今，大蕭條的衝擊令冰島的形勢一片黯淡，隨著戰火與衝突不斷自遠方的地平線迫近，也許是時候跳船換舵，與丹麥分道揚鑣了。"
 ICE_BLITZKRIEG_DESC: "根據德國近來的諸多訴求來看，歐洲的局勢已是危如累卵，德國大軍對丹麥的進攻亦已幾乎板上釘釘。\n\n冰島的國運正命懸一線，有鑑於此，如果它仍希望置身於將至的戰火侵襲之外，則尋求美國人的庇護將是當務之急。"
 BRA_GATHERING_STORM_DESC: "由於對出口的過度依賴，巴西的經濟在大蕭條中慘遭滅頂之災。隨後的幾年裡，軍官、工人和政客等各方勢力相互勾結，在不斷升級的政局動盪中，摧毀了原本統治這個國家的寡頭政治，並以一部脆弱不堪的民主憲法取而代之。\n\n而今，憑藉著近期鎮壓共產主義政變所獲得的緊急授權，熱圖利奧·瓦加斯正獨佔鰲頭，主宰著巴西政壇的潮流走向。然而，民主是否能夠得到恢復，亦或是瓦加斯將把這個國家帶向更專制的明天？一切仍有待觀察。"
 BRA_BLITZKRIEG_DESC: "如今，熱圖利奧·瓦加斯主宰政府大權，並對本國民主化進程橫加打斷。值此權力暫時穩固之際，巴西的領袖已經將其目光放眼於海外事務：一方面，歐洲的戰火似乎不可避免；與此同時，阿根廷人可能侵犯巴西領土的偏執憂慮，也始終縈繞在這位國家領導人的心頭。或許希望所在，便是與美利堅合眾國攜手締盟，以此來確保巴西國家的未來。"
 ARG_GATHERING_STORM_DESC: "1930年，伊波利托·伊裡戈延內閣在阿根廷憲政之後爆發的首次軍事政變中慘遭推翻，至此拉開了所謂“臭名昭著的十年”的大幕。在這個快速變革，以及自世界大戰後由列強所締結的和平搖搖欲墜的世代，阿根廷國家必須如履薄冰、審慎行事。\n\n然而，更顯著的威脅究竟是什麼呢？是歐洲日益籠罩的陰雲？還是阿根廷的周遭鄰國？亦或者來自於他們本國自身？無論如何，阿根廷都必須明確自身的立場，在這世界舞臺上找到自己的一席之地。"
 ARG_BLITZKRIEG_DESC: "憑藉著阿根廷有史以來最厚顏無恥的選舉舞弊，羅伯托·瑪麗亞·奧爾蒂斯最終領導協和同盟繼續在政府中佔據多數，以總統之姿統治這個國家。\n\n然而，隨著這個國家最親密的兩個歐洲友邦之間緊張不斷，阿根廷必須做好準備，迎接這兩個陣營所帶來的、足以撕裂國家的衝擊。除此之外，軍隊中的不滿情緒與日俱增，那北方沉睡的宿敵洶湧的疑心猜忌，亦是不斷聚集、幾欲爆發。內憂外患之下，阿根廷正身處於必須謹慎決斷的命途路口。"
 CHL_GATHERING_STORM_DESC: "在華爾街崩盤的衝擊下，美國終止了對智利的銅礦及硝酸鹽進口貿易，生生掐斷了後者主要的國家收入來源。此舉導致智利成為了南美諸國中遭受經濟蕭條摧殘最嚴重的國家，該國的政局動盪亦在大蕭條的衝擊下不斷加劇，至今都未能找到有效的解決方案。\n\n隨著阿圖羅·亞歷山德里任期將至，法西斯運動正異軍突起。危局之下，整個國家都對十年前的政變，以及1932年智利社會主義共和國的最終下場歷歷在目。"
 CHL_BLITZKRIEG_DESC: "隨著豪爾赫·岡薩雷斯·馮·馬雷斯及其智利國家社會主義運動黨羽近期陰謀政變的企圖遭到鎮壓，佩德羅·阿吉雷·塞爾達接替阿圖羅·亞歷山德里，當選為智利的新任總統。然而，來自軍方的威脅依舊如達摩克利斯之劍高懸頭頂，看來阿里奧斯托·埃雷拉將軍及其擁躉顯然亦是磨刀霍霍，迫不及待要發動他們自己新的政變。\n\n與此同時，戰爭的陰雲已在地平線初現端倪，不僅是在歐洲和亞洲，緊張態勢的升級同樣也在亞馬遜的林間劍拔弩張，而這，正是智利國家的心臟禁臠所在。"
 PAR_GATHERING_STORM_DESC: "儘管剛剛在對玻利維亞的血腥查科戰爭中取得勝利，但該國在經濟上已經枯竭，且軍事化程度過高。不得人心的阿亞拉無力掌控局勢，他和親信何塞·費利克斯·埃斯蒂加里維亞一開始就是戰爭的罪魁禍首。\n\n軍隊在拉斐爾·佛朗哥和社會主義者的二月運動號召下，似乎正準備推翻現政府——他們顯然不會善罷甘休。"
 PAR_BLITZKRIEG_DESC: "二月政變成功推翻了阿亞拉和他的自由派親信，現在許多人希望拉斐爾·佛朗哥為國家的無數恥辱復仇，並再次進攻玻利維亞，儘管這似乎更不可能。 \n\n一些軍官已經在利用法西斯準軍事組織紅黨的幫助，密謀推翻佛朗哥並以伊希尼奧·莫里尼戈取而代之，尋求與軸心國建立更緊密的聯繫。"
 URG_GATHERING_STORM_DESC: "1933年，烏拉圭總統加夫裡埃爾·特拉發動政變推翻了自己的政府，解散了議會，削弱了憲法限制，以愈發威權的形式施行統治。在此之前，在自由主義體系巴特列主義的創始人何塞·巴特列-奧多涅斯領導下，烏拉圭曾是拉丁美洲最進步的民主國家之一。\n\n外債對政治局勢沒有幫助，東岸共和國如今正處於無法永遠持續的獨裁統治中。"
 URG_BLITZKRIEG_DESC: "前獨裁者加夫裡埃爾·特拉最近將權力移交給了同為紅黨成員的妹夫阿爾弗雷多·巴爾多米爾。巴爾多米爾更偏向自由主義和親同盟國，烏拉圭似乎註定要再次走上自由民主的道路，協助大國維護國際法律和秩序。"
 AUS_GATHERING_STORM_DESC: "1934年“議會自毀”及緊隨其後的恩格爾伯特·陶爾斐斯總理遇刺餘波仍在肆虐，奧地利國家至今仍被劍拔弩張的高壓危局裹挾深陷、停滯不前。身負聖日耳曼昂萊條約以及經濟危機兩大重擔，以舒施尼格總理為首的奧地利領導層正面臨著一系列影響深遠的抉擇。是順從命運的擺佈，在德國叩響奧地利國門之際逆來順受？還是窮盡外交及軍事之才，誓死抵抗直至苦澀的終末？亦或者，是回望過去的榮耀，重建奧地利人偉大的帝國？"
 AFG_GATHERING_STORM_DESC: "在查希爾·沙阿國王及其皇叔們的統治下，阿富汗正行進在一段相對穩定的歷史時期。然而，古老的王國看似永恆的現狀之下，憤怒與不信任的暗流卻依然焦躁湧動。有人奉流亡的阿曼努拉·汗激進的現代化改革願景為圭臬，並堅信這位昔日的舊王正暗中籌劃著其重返王座的大戲。同時，也有人視查希爾·沙阿已足夠緩步的改革為洪水，在批評其進度過快的同時強調國家理應迴歸傳統之基本。瑣事紛繁，但或許，在周遭世界動盪不安之際，阿富汗人民能夠攜手同心，在變局之中尋找機遇，開創出屬於自己的道路。"
 AFG_BLITZKRIEG_DESC: "隨著查希爾·沙阿國王的統治癒發鞏固，他所面臨的挑戰也愈發嚴峻。而今，為阿富汗這個戰略要地之歸屬，英德蘇三國的明爭暗鬥已然愈演愈烈，其雖帶來了投資的機遇，亦也伴隨著干涉的陰雲。與此同時，來自英屬印度邊境的不速之客們頻繁越界，持續挑動著兩地的不安與騷亂。世界已即將再度滑向戰爭的深淵，在這個時刻，整個地區不禁要問——阿富汗將何去何從？"
 BEL_GATHERING_STORM_DESC: "比利時國家至今仍為世界大戰的慘痛經歷舐血療傷，不僅大片國土荒蕪破敗，人民大眾亦是心驚膽寒。同時，隨著國內的法西斯黨團不斷髮起對現任政府的腐敗問責，這個國家民主政治的未來也可謂是飽受質疑。\n\n至於國際方面，圍繞著履行那些將本國變成戰場的條約義務，以及在日益動盪的世界中確保自身之安全，比利時亦如鋼絲走線，如履薄冰。"
 BEL_BLITZKRIEG_DESC: "比利時國內仍舊動盪不安，但與此時此刻世界舞臺上的風雲變幻相比，該國的形勢顯然已是無關緊要。但無論如何，通過對媲美法國馬奇諾防線之防禦工事體系的持續投入，這個國家的武裝力量已經在現代化程度以及規模上得到了極大的改善。\n\n儘管比利時政府表面上已經宣佈放棄對其盟友施以援手並表示絕對中立，但這並沒有妨礙他們在暗地裡簽署協議以防遭到突然的攻擊。面對鄰國日益增長的軍國主義威脅，比利時上下憂心忡忡，時刻保持著緊張的注視。"
 COG_GATHERING_STORM_DESC: "儘管已經時過境遷，但利奧波德二世國王治下剛果自由邦時代的慘痛陰影，仍然在比屬剛果的上空揮之不去。而今，殖民地當局仍在徵用廉價勞動力為其挖掘礦產，此外，無形的管控也在竭力阻止這個國家的人民得到更好的教育。然而，情況也並非糟糕透頂。\n\n隨著在世界大戰中大放異彩的意大利殖民野心日益膨脹，公安軍再度臨危集結，或許他們裝備有所不足，但他們已經做好準備，保衛自己的國家。"
 COG_BLITZKRIEG_DESC: "隨著意大利對阿比西尼亞的征服告一段落，以及德意志國在歐陸開疆拓土，局勢已經變得危機四伏。一方面，意大利的殖民野心遠不會僅止步於東非，其很有可能將在不遠的未來對我們產生威脅；另一方面，作為其實現歐陸霸權的一步，希特勒亦對我們的比利時宗主虎視眈眈。\n\n看來，如果不採取措施先發制人，則我們戰禍將至……"
 PER_GATHERING_STORM_DESC: "曾經被稱為波斯的偉大國度——伊朗，正深陷巨人角力的風暴中心。而今，在名為中立的旗幟掩蓋下，伊朗正藉助德意志國的援助迅速邁向現代化。與此同時，面對昔日盟友英國與蘇聯投來的狐疑目光，禮薩·沙阿·巴列維誓言捍衛伊朗的主權。即便軍事入侵的陰影如影隨形，國王也揚言絕不允許這兩大列強染指本國主權。\n\n但，伊朗的中立之姿是否真的能夠得到尊重？我們又是否已做好準備，從邪惡的入侵者手中守護這片古老的家園？倘若一切希望都化為泡影，或許，是時候回望那輝煌的歷史，重新點燃波斯帝國的往昔榮光了……"
 IRQ_GATHERING_STORM_DESC: "在費薩爾一世及其子加齊兩代君王的統治下，伊拉克作為英國託管領地，在世界大戰後的動盪餘波中艱難前行。這個哈希姆王朝治下的年輕王國，雖試圖在現代化與民族主義之間尋求平衡，但國家平靜的表面之下，不滿的叛火正熊熊燃燒。一方面，部族領袖對中央權威心生怨恨，城市精英亦要求擺脫英國影響，爭取更大的獨立。另一方面，泛阿拉伯主義的呼聲，與伊拉克多元的民族與宗教身份產生激烈的碰撞，這一切使得國家的統一如履薄冰。而今，隨著世界即將再度滑向浩劫的前夕，伊拉克前途未知，在鞏固與動盪間搖搖欲墜，但或許，其國運亦也蘊藏著無限的可能。"
 IRQ_BLITZKRIEG_DESC: "伊拉克近年正陷於日益加劇的動盪之中。巴克爾·西德基將軍1936年發動的政變摧毀了哈希姆王朝本就脆弱的權威，為軍方干政開創了危險的先例。在暗處，抵抗中央集權的部族領袖、推進現代化的改革派和新近奪權而囂張跋扈的軍方之間的矛盾正不斷激化。與此同時，泛阿拉伯民族主義的思潮方興未艾，不僅衝擊著英國在本地的影響存在，更激發著人們對地區統一的夙願憧憬。在全球局勢愈發動盪的當下，伊拉克正身處於歷史的十字路口，其國家前途未卜，其國民分歧重重。"
 PER_BLITZKRIEG_DESC: "伊朗正躊躇於動盪和前途未知的邊緣。隨著歐陸戰火滔天，禮薩·沙阿·巴列維正為他的國家身處兩大強權之間憂心忡忡，後者似乎在投身更大規模的衝突上表現出了勃勃的貪婪興趣。\n\n當資源成為關鍵時，伊朗的主權或將遭受挑戰，甚至直接的威脅。沙阿的政府必須做好準備，應對任何可能的入侵。然而，他們是否能夠及時動員起來，抵禦即將到來的一切？"
 PHI_GATHERING_STORM_DESC: "1935年，美國終於同意菲律賓在未來十年內通過和平方式實現獨立。雖然過渡進程才剛剛起步，但這個群島國家已逐漸將命運之舵握於掌心。\n\n是繼續維繫與大洋彼岸的紐帶，還是尋求其他外援以加快獨立步伐？菲律賓正展望著繁榮的未來，但在暗流湧動的國際局勢中，或許已有貪婪的鯨鯊對這個新生國度虎視眈眈？"
 SIA_BLITZKRIEG_DESC: "自1938年底掌權以來，總理披汶·頌堪按自己的願景重塑了暹羅。這個國家有了一個新名字——泰國——和一項新信條：軍事紀律、泛泰民族主義和針對仍處於英法殖民統治下的泰語民族的領土野心。\n\n隨著歐洲滑向戰爭，日本進一步深入中國，披汶的軍隊日益強大。他的野心不是秘密。唯一的問題是，當時刻到來時，泰國將站在哪一邊。"
 PHI_BLITZKRIEG_DESC: "迄今為止，美國信守了承諾，協助菲律賓在獨立之路上蹣跚前行。\n\n與此同時，中日戰火已燃，這個群島國度正以憂慮的目光審視北方鄰國日益膨脹的帝國主義野心。\n\n現在，美軍增援部隊已經陸續抵達以強化防禦體系，但這些舉措真的足以應對危機嗎？那條名為日本的鯨鯊，早已將利齒對準了這片佈滿血腥味的海洋。"
 SIA_GATHERING_STORM_DESC: "距離人民黨終結數百年的專制君主制只過去了四年。暹羅向憲政國家邁出了第一步，但團結已開始崩塌：文官改革派夢想著民主，而軍方要求力量、紀律和泛泰主義擴張。\n\n身側有英法殖民勢力掣肘，而北方的日本正向南推進，暹羅必須謹慎航行。即將到來的風暴也許會迫使這個年輕的國家選擇一方，抑或找到一條獨立撐過去的道路。"
 INS_GATHERING_STORM_DESC: "三個多世紀以來，荷屬東印度群島一直是荷蘭殖民帝國王冠上的明珠。其廣闊的島嶼、語言與文化，僅僅依靠統治它們的殖民行政當局維繫在一起。\n\n海牙的掌控力正變得日益不穩。厭倦剝削的民眾對民族主義運動的支持與日俱增。但這些運動遠未統一，每一派對印度尼西亞的構想都相互矛盾。他們是否能拋開分歧並共同發聲，很可能將決定東印度的命運。"
 INS_BLITZKRIEG_DESC: "三年前，蘇塔爾喬和他的支持者向海牙請願，希望能在十年內獲得自治權。去年11月，皇家敕令傳來。請願遭到否決。\n\n這次拒絕反而做到了多年的鼓動所做不到的事。5月，8個最大的民族主義組織擱置分歧，組成聯盟，一致要求建立印尼議會。殖民政府做出的回應一如既往，但日本繼續在中國向南推進，而東印度與海牙的距離無比遙遠。"
