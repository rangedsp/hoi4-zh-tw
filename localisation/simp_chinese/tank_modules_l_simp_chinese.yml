 basic_heavy_tank_chassis_desc: "世界大戰的經驗表明，一款用於突破敵軍戰壕，為輕型部隊開闢突破口的重型戰車是十分需要的。這樣的戰車必須全副武裝，裝甲精良，為此犧牲一些速度是可以接受的。"
 basic_heavy_tank_chassis_short: "1934 重型"
 improved_heavy_tank_chassis: "改進型重型坦克"
 improved_heavy_tank_chassis_desc: "雖然戰爭的性質發生了變化，但具有厚重裝甲的重型戰車仍然有機會突破敵人的防線，或者用於加強防禦以抵禦敵人的攻擊。"
 improved_heavy_tank_chassis_short: "1940 重型"
 advanced_heavy_tank_chassis: "先進型重型坦克"
 advanced_heavy_tank_chassis_desc: "隨著裝甲和火力的進步，一輛現代坦克將需要攜帶極其厚重的裝甲和口徑更大的火炮來保證自己的作戰效能，這就需要一款負重更強的底盤。"
 advanced_heavy_tank_chassis_short: "1943 重型"
