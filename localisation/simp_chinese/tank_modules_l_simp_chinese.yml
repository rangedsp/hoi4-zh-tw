 advanced_light_tank_chassis_desc: "隨著中型坦克越來越多地在戰鬥中佔據主要位置，輕型坦克在很大程度上被降級為輔助車輛。這款底盤就是將輔助輕型坦克的定位考慮進去加以改進的結果。"
