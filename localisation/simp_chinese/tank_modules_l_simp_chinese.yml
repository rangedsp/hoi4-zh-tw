 modern_tank_chassis: "現代坦克"
 modern_tank_chassis_desc: "一款現代化的底盤，大量借鑑了之前的中型坦克設計，但更加強調速度和機動性，同時也允許攜帶比通常的中型坦克更厚的裝甲和更強的火炮。最終的結果就是得到了一款可以擔任各種角色的戰車。"
 main_battle_tank_chassis_desc: "經驗表明，輕型、中型和重型坦克的設計變的越來越趨同。重型坦克逐漸變得更具機動性，而輕型坦克則攜帶更重的武器和裝甲以求生存。因此，坦克設計者逐漸將所有這三種設計統一為一種類型，即通用主戰坦克。"
 modern_tank_chassis_1: "現代坦克"
 modern_tank_artillery_chassis: "現代自行火炮"
 modern_tank_artillery_chassis_desc: "一款現代戰車，旨在作為一種功能齊全的火炮，可以跟上現代坦克的步伐，並可以抵禦戰場上的任何威脅"
 modern_tank_artillery_chassis_1: "現代自行火炮"
 modern_tank_destroyer_chassis_desc: "一款現代戰車，旨在對地方坦克的攻擊進行快速反擊，同時並具有相對應的裝甲防護和機動性。"
 modern_tank_destroyer_chassis_1: "現代自行反坦克炮"
 modern_tank_destroyer_chassis: "現代自行反坦克炮"
 modern_tank_aa_chassis_desc: "一款現代戰車，旨在保證機動性和防護性以抵禦敵方的空中襲擊。"
 modern_tank_aa_chassis_1: "現代自行防空炮"
 modern_tank_aa_chassis: "現代自行防空炮"
