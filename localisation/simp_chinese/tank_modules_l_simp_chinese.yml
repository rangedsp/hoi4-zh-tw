 light_flame_tank: "輕型噴火坦克連"
 light_flame_tank_desc: "一個由裝備了火焰噴射器的輕型載具組成的連隊，能在突襲城市或要塞時提供支援。"
 medium_flame_tank: "中型噴火坦克連"
 medium_flame_tank_desc: "一個由裝備了火焰噴射器的中型載具組成的連隊，能在突襲城市或要塞時提供支援。"
 heavy_flame_tank: "重型噴火坦克連"
 heavy_flame_tank_desc: "一個由裝備了火焰噴射器的重型載具組成的連隊，能在突襲城市或要塞時提供支援。"
 light_tank_amphibious_chassis_desc: "裝備了漂浮裝置和螺旋槳的輕型坦克。"
 medium_tank_amphibious_chassis_desc: "裝備了漂浮裝置和螺旋槳的中型坦克。"
 heavy_tank_amphibious_chassis_desc: "裝備了漂浮裝置和螺旋槳的重型坦克。"
 expanded_fuel_tank: "燃油桶"
 expanded_fuel_tank_desc: "一種安裝在外部的燃油桶，用於增加裝甲車輛的工作範圍。"
 land_cruiser_chassis: "陸地巡洋艦底盤"
 land_cruiser_chassis_desc: "巨大的底盤，重型裝甲設計，能夠支持超重型武器，在戰場上非常耐用，但由於其巨大的尺寸，燃油消耗高且速度緩慢。"
