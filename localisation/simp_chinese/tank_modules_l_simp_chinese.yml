 basic_medium_tank_chassis_short: "1938 中型"
 basic_medium_tank_chassis_desc: "雖然輕型坦克再過去一段時間內已經成為機械化部隊的支柱，但很明顯它的增長潛力以瀕臨耗盡。在不遠的未來，我們將會需要一款更大的但仍然保持著卓越機動性的戰車。"
 improved_medium_tank_chassis: "改進型中型坦克"
 improved_medium_tank_chassis_short: "1940 中型"
 improved_medium_tank_chassis_desc: "基於上一代中型坦克的設計經驗，顯然我們需要一款具有更大承載能力的坦克底盤，才能保證它們的戰鬥力。"
