 advanced_medium_tank_chassis_short: "1943 中型"
 advanced_medium_tank_chassis_desc: "武器系統重量的快速上升以及坦克對裝甲厚度越來越依賴，使得我們急需一款更大的底盤，這將使我們的中型坦克的尺寸更接近於早期的重型坦克。"
 medium_tank_chassis_desc: "一款平衡的中型底盤，為製造各種作戰車輛提供了很大的靈活性。"
