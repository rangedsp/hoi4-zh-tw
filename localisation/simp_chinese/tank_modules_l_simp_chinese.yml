 ### EQUIPMENT MODULES ###
 tank_gasoline_engine: "汽油引擎"
 tank_gasoline_engine_desc: "在相同發動機尺寸下，使用汽油的發動機會跑得更快，但更容易著火。"
 tank_diesel_engine: "柴油引擎"
 tank_diesel_engine_desc: "使用柴油的發動機比汽油發動機更可靠，但在相同的發動機尺寸下，速度會不如汽油發動機。"
 tank_petrol_electric_engine: "燃油-電力引擎"
 tank_petrol_electric_engine_desc: "使用汽油驅動電動馬達的發動機組合。它複雜、昂貴且不可靠，然而它在戰術行軍方面有著無與倫比的優越性。"
 tank_gas_turbine_engine: "燃氣渦輪發動機"
 tank_gas_turbine_engine_desc: "由噴氣式飛機發動機衍生而來的坦克發動機。高燃料消耗，但在相同的發動機尺寸下，能提供最高的速度。"
 tank_riveted_armor: "鉚接裝甲"
 tank_riveted_armor_desc: "裝甲板用螺栓固定在車架上，並用鉚釘在車架的邊緣固定住。這是一種非常成熟的技術，相當便宜，但鉚釘的邊緣是裝甲的弱點，如果鉚釘被擊中，可能會導致機組人員受傷。"
 tank_cast_armor: "鑄造裝甲"
 tank_cast_armor_desc: "整個底盤，包括裝甲，都是作為一個單元鑄造的。這是一個昂貴和費時的過程，但可以製造出弱點更少殼體更厚的裝甲"
 tank_welded_armor: "焊接裝甲"
 tank_welded_armor_desc: "裝甲板被焊接到底盤上。工藝時間上比鑄造更快，同時仍能提供良好的保護。"
 NOR_tank_rikstanken_armor: "臨時裝甲"
 NOR_tank_rikstanken_armor_desc: "為了省錢，用鐵板而非鋼板組成。總比沒裝甲強……大概吧。"
 tank_torsion_bar_suspension: "扭力杆"
 tank_torsion_bar_suspension_desc: "由固定在車輛底盤上的金屬桿組成的相當可靠的懸掛系統，提供比其他懸掛更平穩的行駛體驗。"
 tank_christie_suspension: "克里斯蒂懸掛"
 tank_christie_suspension_desc: "由一位美國發明家開發，這種懸掛可以到達極高的速度。"
 tank_bogie_suspension: "臺車式懸掛"
 tank_bogie_suspension_desc: "一種簡單而相當廉價的懸架，其中的車輪是單獨安裝的，如果損壞，可以很容易地更換。"
 tank_interleaved_suspension: "交錯負重輪"
 tank_interleaved_suspension_desc: "通過將負重輪交錯排列，同樣的車體長度能夠安裝更多的負重輪，從而提高機動性，並提額外的車身側面防護。"
 tank_light_one_man_tank_turret: "單乘員炮塔"
 tank_light_one_man_tank_turret_desc: "這座小型炮塔勉強能塞下一名坦克乘員。這名乘員同時負責主武器的瞄準和裝填，還要隨時關注周圍的環境和威脅。"
 tank_light_two_man_tank_turret: "雙乘員炮塔"
 tank_light_two_man_tank_turret_desc: "這座炮塔內部能容納兩名乘員，允許他們在操作武器和觀察戰場方面分工合作。然而如此的分工的效率不高。"
 tank_light_three_man_tank_turret: "三乘員炮塔"
 tank_light_three_man_tank_turret_desc: "這座大型炮塔能容納三名乘員，他們可以分別負責主武器的瞄準、裝填，以及觀察周邊環境。"
 tank_light_fixed_superstructure_turret: "輕型固定式炮塔"
 tank_light_fixed_superstructure_turret_desc: "採用固定式炮塔意味著主武器的射角極為受限，只能藉由整車的旋轉帶動主武器旋轉。然而，這種設計允許在同樣尺寸的車身上安裝更大的武器，使得該載具成為伏擊作戰的理想選擇。"
 tank_medium_one_man_tank_turret: "單乘員炮塔"
 tank_medium_one_man_tank_turret_desc: "這座小型炮塔勉強能塞下一名坦克乘員。這名乘員同時負責主武器的瞄準和裝填，還要隨時關注周圍的環境和威脅。"
 tank_medium_two_man_tank_turret: "雙乘員炮塔"
 tank_medium_two_man_tank_turret_desc: "這座炮塔內部能容納兩名乘員，允許他們在操作武器和觀察戰場方面分工合作。然而如此的分工的效率不高。"
 tank_medium_three_man_tank_turret: "三乘員炮塔"
 tank_medium_three_man_tank_turret_desc: "這座大型炮塔能容納三名乘員，他們可以分別負責主武器的瞄準、裝填，以及觀察周邊環境。"
 tank_medium_fixed_superstructure_turret: "中型固定式炮塔"
 tank_medium_fixed_superstructure_turret_desc: "採用固定式炮塔意味著主武器的射角極為受限，只能藉由整車的旋轉帶動主武器旋轉。然而，這種設計允許在同樣尺寸的車身上安裝更大的武器，使得該載具成為伏擊作戰的理想選擇。"
 tank_heavy_two_man_tank_turret: "雙乘員炮塔"
 tank_heavy_two_man_tank_turret_desc: "這座炮塔內部能容納兩名乘員，允許他們在操作武器和觀察戰場方面分工合作。然而如此的分工的效率不高。"
 tank_heavy_three_man_tank_turret: "三乘員炮塔"
 tank_heavy_three_man_tank_turret_desc: "這座大型炮塔能容納三名乘員，他們可以分別負責主武器的瞄準、裝填，以及觀察周邊環境。"
 tank_heavy_fixed_superstructure_turret: "重型固定式炮塔"
 tank_heavy_fixed_superstructure_turret_desc: "採用固定式炮塔意味著主武器的射角極為受限，只能藉由整車的旋轉帶動主武器旋轉。然而，這種設計允許在同樣尺寸的車身上安裝更大的武器，使得該載具成為伏擊作戰的理想選擇。"
 tank_super_heavy_four_man_tank_turret: "四乘員炮塔"
 tank_super_heavy_four_man_tank_turret_desc: "這座巨大的炮塔能容納一名額外的裝填手為主武器裝填。"
 tank_super_heavy_three_man_tank_turret: "三乘員炮塔"
 tank_super_heavy_three_man_tank_turret_desc: "這座大型炮塔能容納三名乘員，他們可以分別負責主武器的瞄準、裝填，以及觀察周邊環境。"
 tank_modern_tank_turret: "現代炮塔"
 tank_modern_tank_turret_desc: "這座精心佈局的炮塔允許三名乘員在高效地操作主武器的同時保持對周邊環境的良好感知。"
 tank_heavy_machine_gun: "重機槍"
 tank_heavy_machine_gun_desc: "一挺機槍能以低廉的成本提供優秀的反步兵火力。然而，就算使用了特製的穿甲彈藥，其反裝甲能力依然不盡人意。"
 flamethrower: "火焰噴射器"
 flamethrower_desc: "火焰噴射器是一種能噴射燃燒著的流質燃劑的裝置。雖然它在巷戰和攻堅戰中大有作用，但它完全沒有任何反裝甲能力，而且往往需要受過特殊訓練的人員操作才能發揮出其作用。"
 advanced_flamethrower: "先進火焰噴射器"
 advanced_flamethrower_desc: "先進火焰噴射器的戰鬥體系，非常適合用來剷除防禦堅固的敵方陣地，並在近距離戰鬥中造成毀滅性傷害。"
 tank_auto_cannon: "機關炮"
 tank_auto_cannon_desc: "由一座速射防空炮改裝而來，這門自動炮傾瀉出的彈雨能夠撕碎非裝甲目標。然而較小的口徑限制了它的反裝甲能力。"
 tank_auto_cannon_2: "改進型機關炮"
 tank_auto_cannon_2_desc: "由一座速射防空炮改裝而來，這門自動炮傾瀉出的彈雨能夠撕碎非裝甲目標。然而較小的口徑限制了它的反裝甲能力。"
 tank_anti_air_cannon: "基礎防空炮"
 tank_anti_air_cannon_desc: "一門用於射擊飛機的速射自動炮。作為對付地面目標的火力支援武器使用時，表現差強人意。"
 tank_anti_air_cannon_2: "改進型防空炮"
 tank_anti_air_cannon_2_desc: "一門用於射擊飛機的速射自動炮。作為對付地面目標的火力支援武器使用時，表現差強人意。"
 tank_anti_air_cannon_3: "先進型防空炮"
 tank_anti_air_cannon_3_desc: "一門用於射擊飛機的速射自動炮。作為對付地面目標的火力支援武器使用時，表現差強人意。"
 tank_medium_howitzer: "中型榴彈炮"
 tank_medium_howitzer_desc: "一門經改造後，適合安裝在坦克上的中型野戰榴彈炮。它的主要職能是對非裝甲目標提供曲射火力支援，但必要時也可以進行直射射擊。這門火炮攜帶的穿甲彈藥很少，不適合反坦克作戰。"
 tank_medium_howitzer_2: "改進型中型榴彈炮"
 tank_medium_howitzer_2_desc: "一門經改造後，適合安裝在坦克上的中型野戰榴彈炮。它的主要職能是對非裝甲目標提供曲射火力支援，但必要時也可以進行直射射擊。這門火炮攜帶的穿甲彈藥很少，不適合反坦克作戰。"
 tank_heavy_howitzer: "重型榴彈炮"
 tank_heavy_howitzer_desc: "一門經改造後，適合安裝在坦克上的重型野戰榴彈炮。它的主要職能是對非裝甲目標提供曲射火力支援，但必要時也可以進行直射射擊。這門火炮攜帶的穿甲彈藥很少，不適合反坦克作戰。"
 tank_small_cannon: "小型加農炮"
 tank_small_cannon_desc: "一門小而便宜的火炮，可以發射反步兵和反裝甲炮彈。較小的口徑意味著它的作用有限。"
 tank_small_cannon_2: "改進型小型加農炮"
 tank_small_cannon_2_desc: "一門小而便宜的火炮，可以發射反步兵和反裝甲炮彈。較小的口徑意味著它的作用有限。"
 tank_medium_cannon: "中型加農炮"
 tank_medium_cannon_desc: "一門適用於多種任務的通用型武器。它在反步兵和反坦克作戰中都不是最出色的，但它使載具極為靈活。"
 tank_medium_cannon_2: "改進型中型加農炮"
 tank_medium_cannon_2_desc: "一門適用於多種任務的通用型武器。它在反步兵和反坦克作戰中都不是最出色的，但它使載具極為靈活。"
 tank_high_velocity_cannon: "基礎型高速加農炮"
 tank_high_velocity_cannon_desc: "一門為實現極高的初速設計的加農炮，其使用專門為之準備的炮彈。具備極佳的反裝甲性能，但對於軟目標將會較為乏力。"
 tank_high_velocity_cannon_2: "改進型高速加農炮"
 tank_high_velocity_cannon_2_desc: "一門為實現極高的初速設計的加農炮，其使用專門為之準備的炮彈。具備極佳的反裝甲性能，但對於軟目標將會較為乏力。"
 tank_high_velocity_cannon_3: "先進型高速加農炮"
 tank_high_velocity_cannon_3_desc: "一門為實現極高的初速設計的加農炮，其使用專門為之準備的炮彈。具備極佳的反裝甲性能，但對於軟目標將會較為乏力。"
 tank_heavy_cannon: "基礎型重型加農炮"
 tank_heavy_cannon_desc: "一門能發射大號炮彈的武器。這種火炮穿甲性能出色，對付非裝甲目標也表現良好，它最大的缺點是龐大的尺寸和高昂的成本，這使得它過於笨重，幾乎只能安裝在特別設計來搭載這門火炮的載具上。"
 tank_heavy_cannon_2: "改進型重型加農炮"
 tank_heavy_cannon_2_desc: "一門能發射大號炮彈的武器。這種火炮穿甲性能出色，對付非裝甲目標也表現良好，它最大的缺點是龐大的尺寸和高昂的成本，這使得它過於笨重，幾乎只能安裝在特別設計來搭載這門火炮的載具上。"
 tank_heavy_cannon_3: "先進型重型加農炮"
 tank_heavy_cannon_3_desc: "一門能發射大號炮彈的武器。這種火炮穿甲性能出色，對付非裝甲目標也表現良好，它最大的缺點是龐大的尺寸和高昂的成本，這使得它過於笨重，幾乎只能安裝在特別設計來搭載這門火炮的載具上。"
 tank_super_heavy_cannon: "超重型加農炮"
 tank_super_heavy_cannon_desc: "這門火炮的性能和其巨大的尺寸一樣無與倫比。無法被這種武器摧毀的東西少之又少，而且這些東西多和反坦克作戰毫無關係。"
 NOR_rikstanken_turret: "臨時炮塔"
 NOR_rikstanken_turret_desc: "它裝了槍，也能轉——在它想轉的時候。"
 tank_close_support_gun: "近距支援炮"
 tank_close_support_gun_desc: "一種旨在向敵人的野戰防禦工事發射高爆炮彈，以幫助步兵進行攻堅作戰的小型火炮。雖然這種火炮可以承擔一定的輕型反坦克任務，但它的短炮管導致的低初速和其有限的彈藥使其無法對付更強大的敵方坦克。"
 tank_radio_1: "基礎型無線電"
 tank_radio_1_desc: "一座基礎的無線電收發設備可以讓坦克在較小的規模內協調其戰術機動。"
 tank_radio_2: "改進型無線電"
 tank_radio_2_desc: "一座改良無線電設備允許指揮官們有效地指揮更大的坦克編隊，從而實現大規模的作戰機動。"
 tank_radio_3: "先進型無線電"
 tank_radio_3_desc: "裝有一臺大功率發射器和更好的接收器，這座無線電即使面對敵軍的干擾也能保持數十千米的通訊範圍。"
 amphibious_drive: "兩棲驅動"
 amphibious_drive_desc: "包含一組漂浮裝置和一個小螺旋槳，其將幫助坦克快速穿越水面，無論是從登陸艦駛向岸邊還是跨過河流。"
 secondary_turret_hmg: "重機槍"
 secondary_turret_hmg_desc: "放置於副炮塔之中的重機槍。炮塔的位置限制了它的射界，降低了其的整體效能，但它確實使得坦克可以攻擊更多的目標，這在進攻的時候將會有些作用。"
 secondary_turret_small_cannon: "小型加農炮"
 secondary_turret_small_cannon_desc: "放置於副炮塔之中的小型加農炮。炮塔的位置限制了它的射界，降低了其整體效能，但它確實使得坦克可以攻擊更多的目標，這在進攻的時候將會有些作用。"
 secondary_turret_close_support_gun: "近距支援炮"
 secondary_turret_close_support_gun_desc: "放置於副炮塔之中的近距離支援炮。炮塔的位置限制了它的射界，降低了其的整體效能，但它確實使得坦克可以攻擊更多的目標，這在進攻的時候將會有些作用。"
 sloped_armor: "傾斜裝甲"
 sloped_armor_desc: "與來襲炮彈成一定角度的裝甲和垂直的裝甲相比較，其有效裝甲厚度更高。傾斜的裝甲還有更高的幾率回彈炮彈。然而如此一來，整輛坦克都需要圍繞著傾斜裝甲設計，導致整車組裝難度更大。"
 stabilizer: "火炮穩定器"
 stabilizer_desc: "一種在坦克移動時保持火炮指向同一方向的機械裝置。雖然不夠先進，無法達成在移動中的準確射擊，但它可以讓炮手在坦克短暫的停留期間準確射擊，而無需重新尋找目標。"
 smoke_launchers: "煙霧發射器"
 smoke_launchers_desc: "一組煙火發射裝置，可以從坦克內部啟動，能產生濃煙以隱藏坦克。在防禦戰中或在遭受伏擊時極為有用。"
 extra_ammo_storage: "額外彈藥架"
 extra_ammo_storage_desc: "額外的彈藥架可以允許坦克在沒有進行補給的情況下作戰更長時間。但是，一旦保護額外彈藥架的裝甲被擊穿，其結果將是災難性的，在進攻的時候這個問題將更加顯著。"
 wet_ammo_storage: "溼式彈藥架"
 wet_ammo_storage_desc: "在彈藥架上加裝的水套，大大降低了坦克裝甲被擊穿後彈藥爆炸的風險，受到了坦克乘員們的高度評價。"
