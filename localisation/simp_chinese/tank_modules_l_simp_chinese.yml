 tank_rocket_launcher: "火箭發射器"
 tank_rocket_launcher_desc: "一種用於發射非制導高爆火箭彈的多管發射器。高爆裝藥的火力使其對軟目標具有出色的性能，但對於裝甲目標，即使高爆火箭彈直接命中，也很難對其造成傷害。"
 tank_rocket_launcher_2: "改進型火箭發射器"
 tank_rocket_launcher_2_desc: "雖然進行了準確性的升級，但是這種火箭發射器最主要的改進還是可以攜帶更多的彈藥，以向敵人施加更加致命的打擊。"
 tank_wheeled_suspension: "輪式懸掛"
 tank_wheeled_suspension_desc: "這種懸掛源自於卡車底盤，承載能力和越野性能非常有限，但其具有製造成本低這一重要優勢。"
 tank_half_track_suspension: "半履帶懸掛"
 tank_half_track_suspension_desc: "該懸掛是全履帶式車輛和常規輪式懸架之間的混合體，車輛前段裝有一對車輪用於轉向，後輪軸使用履帶式懸掛以提高越野性能。雖然其承載能力有限，但仍比全履帶設計便宜。"
 squeezebore_adaptor: "錐膛炮轉接器"
 squeezebore_adaptor_desc: "火炮末端的特殊適配器降低了炮管末端的口徑，這將把炮彈壓縮到較小的口徑，這會使得炮彈初速大幅度提升以此提高裝甲穿透力。雖然這種技術可以以較低成本提升火炮穿深但是它需要特殊的稀有材料來製作火炮對應的彈藥。"
 armor_skirts: "裝甲裙板"
 armor_skirts_desc: "安裝在車體側面的一組金屬薄板，能對反坦克槍及錐形裝藥提供額外防護。"
 dozer_blade: "推土鏟"
 dozer_blade_desc: "裝有推土鏟的載具可以在戰場上快速建立掩護，而無需工兵支援。"
 auto_loader: "自動裝彈機"
 auto_loader_desc: "一種自動裝填彈藥的機構，可以讓坦克長時間保持高速射擊。"
 easy_maintenance: "易維護改裝"
 easy_maintenance_desc: "車輛周圍的艙口可以使許多不同車輛零部件通過，使得乘員可以非常容易地執行相當複雜的維護工作。"
 additional_machine_guns: "加裝機槍"
 additional_machine_guns_desc: "一組車體機槍和同軸機槍能使坦克更有效地抵抗來犯的步兵。"
