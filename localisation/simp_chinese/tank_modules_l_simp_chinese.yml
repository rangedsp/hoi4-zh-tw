 lc_heavy_naval_guns: "重型艦炮"
 lc_heavy_naval_guns_desc: "作為這種龐大裝甲車輛的標準主武器，這些強大的海軍級火炮經過改裝用於直接對抗，能夠對裝甲和堅固目標造成毀滅性打擊。"
 lc_super_heavy_railway_gun: "超重型列車炮"
 lc_super_heavy_railway_gun_desc: "這門巨大的火炮，最初為鐵路平臺而建，能夠從極遠的距離轟擊目標，具有無與倫比的破壞力。"
 lc_high_impact_obliterator_cannon: "高衝擊毀滅者加農炮"
 lc_high_impact_obliterator_cannon_desc: "專為穿透極厚裝甲而設計，這種武器具有極高的動能，是對抗其他超重型坦克的強大武器。"
 lc_heavy_anti_air_platform: "重型防空平臺"
 lc_heavy_anti_air_platform_desc: "裝備多門大口徑防空炮的平臺，用於防禦威脅到陸地巡洋艦的敵方轟炸機和偵察機。"
 lc_medium_naval_guns: "中型艦炮"
 lc_medium_naval_guns_desc: "提供火力與射速的平衡組合，這些火炮在對付輕型車輛和支援非裝甲目標方面非常有效。"
 lc_hull_mounted_railway_gun: "艦載軌道炮"
 lc_hull_mounted_railway_gun_desc: "一門直接集成到車體中的鐵路炮，提供重火力支援，能夠以高精度打擊遠程目標。"
 lc_super_heavy_howitzer: "超重型榴彈炮"
 lc_super_heavy_howitzer_desc: "設計用於摧毀防禦工事和城市防禦的巨型榴彈炮。這種變體專門用於發射高爆彈，適合清除戰壕和摧毀堅固的防禦結構。"
 lc_heavy_high_velocity_cannons: "重型高速火炮"
 lc_heavy_high_velocity_cannons_desc: "反坦克炮專為準確打擊並摧毀敵方裝甲而設計。其高速彈丸確保了遠距離的優秀穿透力。"
 lc_heavy_anti_air_battery: "重型防空炮組"
 lc_heavy_anti_air_battery_desc: "裝備大口徑火炮的炮臺，用於瞄準高速和高空飛行器，在車輛周圍提供防禦保護。"
 lc_medium_cannon_turret: "同軸中口徑火炮"
 lc_medium_cannon_turret_desc: "標準的炮塔式火炮，能夠對抗步兵和輕型車輛。其緊湊的設計使其在近距離戰鬥和次要任務中用途廣泛。"
 lc_assault_gun: "突擊炮"
 lc_assault_gun_desc: "專為近距離城市戰和摧毀掩體而設計。這種武器發射威力強大的高爆彈，用於清除步兵和難以拔除的目標。"
 lc_high_velocity_cannon_turret: "同軸高速火炮"
 lc_high_velocity_cannon_turret_desc: "裝備高速火炮的炮塔，用於對抗敵方裝甲。其較小的尺寸使其能夠快速響應並提供對輕型裝甲威脅的火力支援。"
 lc_light_anti_air_battery: "輕型防空炮組"
 lc_light_anti_air_battery_desc: "輕型防空炮，設計用於打擊低空飛行的飛機，保護車輛免受掃射和俯衝轟炸。"
 lc_flamethrower_turret: "火焰噴射器組"
 lc_flamethrower_turret_desc: "一座專門的火焰噴射炮，適合清除防禦工事、步兵和伏擊點。非常適合在密集的城市環境中進行近距離作戰。"
 lc_rocket_launcher: "火箭發射器"
 lc_rocket_launcher_desc: "安裝在陸地巡洋艦上的模塊化火箭系統，能夠發射毀滅性的火箭彈幕，壓制敵方防禦並壓制大規模編隊。"
 lc_radio_1: "$tank_radio_1$"
 lc_radio_1_desc: "$tank_radio_1_desc$"
 lc_radio_2: "$tank_radio_2$"
 lc_radio_2_desc: "$tank_radio_2_desc$"
 lc_radio_3: "$tank_radio_3$"
 lc_radio_3_desc: "$tank_radio_3_desc$"
 lc_command_center: "指揮中心"
 lc_command_center_desc: "一個完全集成的指揮中心，將陸地巡洋艦變為移動總部，配備先進的通信系統，用於協調大規模軍事行動。"
 lc_radar: "雷達"
 lc_radar_desc: "一個早期預警系統，增強對敵方的飛行器和附近部隊的預警，使陸地巡洋艦能夠為潛在的空中或地面威脅做好準備。"
 lc_aircraft_catapult: "飛機彈射器"
 lc_aircraft_catapult_desc: "一個小型偵察機發射系統，使陸地巡洋艦能夠偵察遠程區域並提供實時戰場情報。"
 lc_helipad: "直升機坪"
 lc_helipad_desc: "直升機起降平臺，用於提供高級空中偵察並提升戰場態勢感知能力。"
 lc_armored_skirts: "裝甲裙板"
 lc_armored_skirts_desc: "沿車身兩側安裝的強化裝甲板，保護易受攻擊的履帶和懸掛系統免受反坦克武器和輕武器的傷害。"
 lc_bunker_emplacement: "掩體安放裝置"
 lc_bunker_emplacement_desc: "內部加固結構，將陸地巡洋艦變為移動掩體。即使在遭受重火力攻擊時，車組人員也能保持防禦陣地並向敵方還擊。"
 lc_obstacle_clearance_gear: "清障裝備"
 lc_obstacle_clearance_gear_desc: "重型附件，如巨型推土機鏟和起重機，用於清除碎片、在困難地形上開闢道路並協助挖掘作業。"
 lc_internal_fuel_tanks: "內部燃料箱"
 lc_internal_fuel_tanks_desc: "車體內擴展的燃料艙室，增加車輛的作戰範圍，減少在長期戰役中頻繁加油的需要。"
 lc_internal_ammunition_compartments: "內部彈藥艙"
 lc_internal_ammunition_compartments_desc: "強化的儲存區域，用於攜帶額外彈藥，使陸地巡洋艦能夠在缺乏後勤補給的情況下維持長期戰鬥。"
 lc_wet_ammunition_storage: "溼式彈藥架"
 lc_wet_ammunition_storage_desc: "專門的液體冷卻艙，用於減少彈藥因敵方命中引發爆炸的風險，大大提高車組人員的安全性。"
 lc_smoke_generators: "煙霧發生器"
 lc_smoke_generators_desc: "一套能夠釋放濃厚的煙幕的系統，掩蓋車輛的行動並降低其在地面和空中威脅中的能見度。"
 lc_stabilizers: "穩定器"
 lc_stabilizers_desc: "用於減少後坐力並保持火炮準心的機械設備，使車輛在短暫停留時能夠更快地重新瞄準並提高射擊精度。"
