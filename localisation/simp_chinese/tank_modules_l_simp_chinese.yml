 basic_light_tank_chassis_short: "1934 輕型"
 basic_light_tank_chassis_desc: "技術進步使一戰之後的設計顯得較為過時了。現代戰場需要一個全新的、簡潔的並結合了冶金進步和內部佈局進步的設計。"
