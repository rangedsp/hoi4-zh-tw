 heavy_tank_flame_chassis: "重型噴火坦克"
 amphibious_tank_chassis: "兩棲坦克"
 amphibious_tank_chassis_desc: "一種專門設計用於漂浮的小型底盤，為此其對攜帶的武器尺寸和裝甲厚度有著嚴格的要求。"
 amphibious_tank_chassis_1: "兩棲坦克"
 gwtank_chassis: "戰間期型坦克開發"
 gwtank_chassis_desc: "坦克在世界大戰中證明了自己是一種強大的武器。儘管在此之後坦克發展放緩，但毫無疑問，它將在未來的戰爭中發揮重要作用。"
 armor_tech_1: "基礎裝甲保護"
 armor_tech_1_desc: "一戰期間的坦克只需要與敵人的輕武器抗衡。因此，他們使用了相當薄的裝甲。但新一代的反坦克武器讓戰場成為對來說坦克更危險的地方，所以其需要更重的裝甲。"
 armor_tech_2: "改進裝甲保護"
 armor_tech_2_desc: "隨著越來越先進的反坦克武器在世界各地投入使用，下一代坦克將會需要更好的防護。"
 armor_tech_3: "先進裝甲保護"
 armor_tech_3_desc: "雖然反坦克武器的配置可能越來越接近極限，但現代坦克攜帶的更先進的武器使得我們仍然需要防護等級更高的裝甲。"
 armor_tech_4: "現代裝甲保護"
 armor_tech_4_desc: "在戰爭期間，坦克面臨的威脅成倍增加，從敵方坦克、反坦克炮、專用的自行反坦克炮，到甚至可以手持發射錐形彈頭並擊穿重型坦克裝甲的現代步兵反坦克武器。我們必須開發新的保護方法，讓我們的坦克在面對這些威脅時能夠存活下來。"
 engine_tech_1: "基礎引擎"
 engine_tech_1_desc: "世界大戰時期的坦克是移動緩慢而笨拙的裝甲巨獸。然而，如今的坦克極其依賴速度和機動性來取得勝利。"
 engine_tech_2: "改進引擎"
 engine_tech_2_desc: "裝有更大火炮和更厚裝甲的新一代坦克需要更強力的引擎來驅動。"
 engine_tech_3: "先進引擎"
 engine_tech_3_desc: "機動化作戰是一種需要指揮官迅速決斷、士兵迅速機動、補給迅速運輸的作戰形式。如果我們的坦克想要裝備最新的武器，同時還想要安裝足夠在戰場上生存的裝甲，它們就需要更強大的引擎以跟上摩托化步兵的步伐。"
 engine_tech_4: "現代引擎"
 engine_tech_4_desc: "現代戰爭為坦克新增了許多必需的裝備，這顯著增加了坦克的重量。為了讓這些龐然巨物動起來，我們必須擁有動力強大的引擎。"
