 ############# HUNGARY ###############
 #####################################
 HUN_gombos_trade_treaty: "根伯什貿易條約"
 HUN_gombos_trade_treaty_desc: "1934年，根伯什·久洛與德國簽署的貿易條約對於刺激我們的經濟和從大蕭條中恢復至關重要，但這也帶來了重大的缺點。儘管協議為我們的小麥銷售提供了有利的價格，但所賺取的資金必須存放在德國的賬戶中，且只能用於購買德國的工業產品。如果這種情況持續下去，德國將能夠實現對我們國家的經濟統治。"
 HUN_hungarian_national_defense_association: "匈牙利國防軍協會"
 HUN_hungarian_national_defense_association_desc: "極右翼準軍事組織匈牙利國防軍協會成立於1919年，主要忠於其領導者和創始人根伯什·久洛。儘管如此，由於霍爾蒂·米克洛什的強烈反共立場，他們也極其尊重他。"
 HUN_levente_associations: "萊文特協會"
 HUN_levente_associations_desc: "我國人民成立了被稱為萊文特協會的準軍事青年組織。他們以強身健體的名義，為境內外的匈牙利青年做好戰鬥準備，以備將來重新收復我們的合法土地。"
 HUN_forceful_industrial_revitalization: "大力振興工業"
 HUN_forceful_industrial_revitalization_desc: "政府已採取了激烈措施以確保國家工業能夠恢復。然而，只有時間才能告訴我們這些行動是否會證明是成功的。"
 HUN_revaluing_the_pengo: "重新調整帕戈匯率"
 HUN_revaluing_the_pengo_desc: "當前，[HUN.GetAdjective]的貨幣帕戈幣正在經歷重新調整匯率的過程，這是一種絕望的嘗試，目的是加強經濟並解決通貨膨脹危機，儘管這是一項不受歡迎的措施。"
 HUN_hungarian_autarky_idea: "匈牙利自給自足"
 HUN_hungarian_autarky_idea_desc: "如果這個國家想要在四周敵人的環繞中獨立生存，它必須學會自給自足，儘管與此相關的生產成本非常高。"
 HUN_agrarian_tradition: "匈牙利農業傳統"
 HUN_agrarian_tradition_desc: "我們引以為豪的農業傳統可以追溯到很久以前，甚至在我們來到這個我們現在稱之為家的地方之前。我們應該重視這些傳統，並儘可能地發揚光大。"
 wuw_HUN_not_has_trianon_for_laws_tt: "沒有民族精神§Y特里亞農條約§!"
 HUN_rapid_army_expansion: "快速軍事擴張"
 HUN_rapid_army_expansion_desc: "隨著歐洲戰爭的臨近，每個人都必須隨時準備保衛自己的家園。現在是時候讓[HUN.GetAdjective]人理解這種感情，並在我們需要的時候隨時準備站出來。"
 HUN_modify_academy_of_sciences_ns_intro: "§Y$HUN_academy_of_sciences$§!追加效果："
 HUN_academy_of_sciences: "匈牙利科學院"
 HUN_academy_of_sciences_desc: "投資擴建[ROOT.GetAdjective]科學院，我們的國家將能夠比我們的競爭對手更快地研究技術。"
 HUN_gombos_trade_treaty_tt: "根伯什貿易條約允許我們與德國進行貿易"
 HUN_hungarian_gendarmerie: "匈牙利皇家憲兵隊"
 HUN_hungarian_gendarmerie_desc: "為了保護我們的邊疆和我們的領導人免受危險，我們的準軍事憲兵隊必須擴大，並賦予他們更多的獨立行動的權力。"
 HUN_hungarian_gendarmerie_hussars: "黑軍憲兵隊"
 HUN_hungarian_gendarmerie_hussars_desc: "為了保護我們的邊疆和我們的領導人免受危險，我們的準軍事憲兵隊必須擴大，並賦予他們更多的獨立行動的權力。"
 cat_air_bombs: "航空炸彈"
 cat_air_engine: "飛機引擎"
 mio_cat_artillery: "火炮"
 HUN_recon_airplane_focus: "聚焦偵察機"
 HUN_recon_airplane_focus_desc: "[ROOT.GetNameDefCap]目前正在大力投資偵察機的開發和使用領域，以便適當地監視他們的敵人。"
 HUN_rapid_army_groups_idea: "快速部署集團軍"
 HUN_rapid_army_groups_idea_desc: "我們已經重組了軍隊，以便能夠在任何給定的時間以最快的速度到達需要的地點。"
 HUN_pan_ugric_volunteer_force: "[ROOT.GetAdjective]志願軍"
 HUN_pan_ugric_volunteer_force_desc: "我們最近對幫助芬蘭-烏戈爾兄弟的幫助鼓舞了希望到國外參加戰鬥的[ROOT.GetAdjective]志願者的招募。"
 HUN_GER_trade_modifier: "匈牙利-德國貿易協定"
 HUN_POL_friendship_modifier: "波蘭人與匈牙利人——兩個好朋友，互相爭鬥，而後共飲"
 HUN_restricted_voting_rights: "限制投票權"
 HUN_restricted_voting_rights_desc: "限制人民的投票權可能不受歡迎，但有必要，這可以阻止國內興起的共產主義和自由主義意識形態。"
 HUN_crackdown_on_extremism: "打擊極端主義"
 HUN_crackdown_on_extremism_desc: "作為新總理道拉尼·卡爾曼新的反極端主義改革的一部分，薩拉希·費倫茨已被逮捕，他的國家社會主義政黨國民意志黨已被取締。"
 HUN_power_to_the_regent_idea: "權力歸於攝政王"
 HUN_power_to_the_regent_idea_desc: "隨著第十九號法令的通過，[ROOT.GetNameDef]的攝政王獲得了更多的權力，人民更加忠於他們的偉大領袖霍爾蒂·米克洛什。"
 HUN_turul_association_idea: "圖魯爾協會"
 turanist_connections_op_modifier: "圖蘭主義者關係網"
 HUN_old_hungary_reclaimed: "恢復大匈牙利"
 HUN_old_hungary_reclaimed_desc: "我們終於洗清了特里亞農條約強加給我們的恥辱，成功地奪回了屬於我們的東西！"
 HUN_promoted_hungarianism: "推動匈牙利主義"
 HUN_promoted_hungarianism_desc: "為了最好地服務於我們的國家利益，我們應該支持匈牙利主義運動，並確保我們的人民知道未來在哪。"
 HUN_promises_of_peace: "承諾和平"
 HUN_promises_of_peace_desc: "為了安撫小協約國的勢力，我們不得不承諾非軍事化或主動擴張，這導致了導致軍隊暫時廢弛。"
 HUN_supporting_carlists: "支持卡洛斯派事業"
 HUN_following_entente_stipulations: "遵守小協約國規定"
 HUN_bastion_of_catholicism: "天主教的堡壘"
 HUN_bastion_of_catholicism_desc: "我們的國民是虔誠的天主教徒，我們的士兵將擔任偉大信仰的守護者，聖座的僕人。"
 HUN_a_multi_ethnic_empire: "多民族帝國"
 HUN_a_multi_ethnic_empire_desc: "我們帝國包含了許多不同的民族和文化，這是我們完全接受的。給予我們帝國的不同地區較大的自治權，讓我們的人民願意留下來成為我們的一員。"
 HUN_revenge_for_brusilov_idea: "為布魯西洛夫攻勢復仇"
 HUN_payments_from_hungary_idea: "[HUN.GetNameDef]的付款"
 HUN_apostolic_kingdom_idea: "使徒王國"
 HUN_apostolic_kingdom_idea_desc: "自從阿爾帕德王朝的聖斯德望一世的幾個世紀以來，我們的使徒國王顯然是基督宗教的現世宗徒，擁有對所有基督宗教土地的主張，並有權以聖子的名義統治寰宇。我們必須收回所有理應屬於我們的領土！"
 HUN_horthyist_royal_guard: "王室衛隊"
 HUN_the_volksbund_idea: "人民聯盟"
 HUN_the_volksbund_idea_desc: "人民聯盟是一個與德國國家社會主義工人黨有關的組織，由我國境內的[GER.GetAdjective]族裔組成。他們接受來自[GER.GetNameDef]的資金支持，並在我國境內為其效力。"
 dissolved_the_volksbund_modifier: "解散人民聯盟"
 HUN_combined_warfare_effort_idea: "聚焦聯合作戰"
 HUN_mobile_army_efforts_idea: "聚焦機動部隊"
 HUN_royalist_education: "保皇派教育"
 HUN_scientist_influx_idea: "科學家湧入"
 HUN_volksbund_good: "人民聯盟"
 HUN_gombos_trade_treaty_arms_market_tt: "允許與§Y德國§!進行武器貿易"
 HUN_resurgent_communist_party_idea: "復興的匈牙利共產黨"
 HUN_salami_slicing_tactics_idea: "切香腸戰術"
 HUN_the_rakosi_battalion_idea: "拉科西的國際縱隊"
 HUN_socialist_economy_idea: "社會主義經濟"
 HUN_socialist_revanchist_sentiment: "復仇情緒"
 HUN_denounce_bolshevism_idea: "對抗斯大林主義的戰爭"
 HUN_goulash_communism_idea: "土豆燒牛肉式共產主義"
 HUN_soviet_cooperation_programmes: "蘇聯合作方案"
 HUN_state_protection_authority_ns: "國家保衛局"
 HUN_state_protection_authority_ns_desc: "我們的情報機構一方面能阻止外國間諜在我國暗中搞破壞，另一方面也能在國際鬥爭中助我國一臂之力。"
 HUN_state_protection_authority_ns_vanilla: "國家保衛局"
 HUN_state_protection_authority_ns_vanilla_desc: "我們的情報機構一方面能阻止外國間諜在我國暗中搞破壞，另一方面也能在國際鬥爭中助我國一臂之力。"
 HUN_great_bulwark_against_the_west_ns: "偉大的堡壘"
 HUN_habsburg_restored_desc: "自1526年以來，我們的國家一直由哈布斯堡王朝統治，他們對我們的土地擁有神聖的主張。隨著君主制的恢復，是時候確保他們能夠留在這裡了，並且我們的國家不會再次墮入共和國的魔爪。"
 HUN_promoting_entrepreneurship: "鼓勵創業"
 HUN_the_dragon_movement_idea: "龍運動"
 HUN_ward_against_extremism_idea: "防範極端主義"
 HUN_the_cult_of_arpad_idea: "阿爾帕德崇拜"
 HUN_militarized_diasporas: "軍事化的匈牙利僑民"
 HUN_tribal_consolidation_revived: "尊崇先祖"
 HUN_hungarian_national_defense_association_greenshirts: "匈牙利國防協會"
 HUN_hungarian_national_defense_association_greenshirts_desc: "極右翼準軍事組織匈牙利國防軍協會成立於1919年，主要忠於其領導者和創始人根伯什·久洛。然而，隨著綠衫軍和鐮刀十字組織併入其中，其效忠對象變得分散，現在可能更忠於箭十字的領導人。"
 HUN_entered_an_offensive_war_flag: "匈牙利參與了進攻性戰爭"
 HUN_roman_catholic_society_idea: "信奉羅馬天主教"
 HUN_hungarian_life_movement_idea: "“匈牙利生活”運動"
 HUN_arrow_cross_idea: "箭十字"
 HUN_heirs_of_the_huns_idea: "匈人真正的繼承人"
 HUN_urbanization_efforts: "推動城市化"
 HUN_low_popular_support: "低民眾支持"
