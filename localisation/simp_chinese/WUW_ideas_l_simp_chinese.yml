 is_controlled_by_ROOT_or_subject_NOT: "不受§Y[ROOT.GetNameDef]§!或其附屬國控制"
 GER_alfred_rosenberg_modifier: "阿爾弗雷德·羅森堡"
 #TIMED SPIRITS
 GER_collect_scrap_metal_ns_desc: "我們發起了一場全國性運動，以儘可能多地收集廢金屬，幫助我們重新武裝。"
 GER_import_tariffs_ns_desc: "設立進口關稅是促進國內製造業和生產增長的必要之惡，但更重要的是，它將幫助我們節省寶貴的資金，因為我們無需耗費有限的外匯。"
 GER_knickebein: "曲腿導航系統"
 GER_knickebein_desc: "我們曲腿導航系統的研發突破，使我們能夠以前所未有的精度提高我們轟炸機的目標定位精確性——即使在夜間作戰時也是如此。"
 GER_defense_of_the_reich_ns_desc: "我們將保衛[ROOT.GetNameDef]上空，保護其工業和人民。沒有任何敵方轟炸機能夠突破我們狂熱的戰鬥機構成的天空壁壘！"
 GER_the_kammhuber_line: "康胡貝線"
 GER_the_kammhuber_line_desc: "我們不能允許敵方轟炸機和戰鬥機在[ROOT.GetNameDef]上空自由活動。通過建立一套複雜的雷達信號重疊系統，我們將在它們到達我們的腹地之前攔截它們。"
 GER_nachtjagdgeschwader: "夜間戰鬥機中隊"
 GER_nachtjagdgeschwader_desc: "我們的夜間戰鬥機中隊，將追蹤並摧毀任何愚蠢到敢於越過我們邊界的敵機。這些中隊主宰夜空，在黑夜中保護我們的家園免受敵方轟炸機的侵擾。"
 GER_tragergruppen_ns: "航母戰鬥群"
 GER_tragergruppen_ns_desc: "通過訓練和裝備特定的航母戰鬥群，將確保我們在無盡海洋上空的制空權。"
 GER_cruiser_warfare_ns_desc: "我們的巡洋艦在公海上對敵方商船造成嚴重破壞。這肯定會使他們的工業陷入癱瘓。"
 GER_panzerschiff_raiders_ns_desc: "我們的重型巡洋艦對敵方海軍構成嚴重威脅。它們的火炮威力巨大，而它們的速度允許在被捲入正面交戰前就溜走。"
 GER_rudeltaktik_ns: "狼群戰術"
 GER_rudeltaktik_ns_desc: "我們的U型潛艇狼群在海洋中搜尋新的獵物。使用狼群戰術使它們能夠更好地協調並攻擊我們敵人的要害——他們對開放海域的依賴。"
 GER_german_trade_ns: "德意志貿易"
 GER_german_trade_offshore_tt: "（[ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§!）添加§G1§!地圖外§Y$industrial_complex$§!。"
 GER_development_of_economic_relations_ns: "經濟關係發展"
 GER_gestapo_ns: "蓋世太保"
 GER_german_development_aid: "德國發展援助"
 GER_german_exploitation: "德國的剝削"
 GER_the_inner_circle_dm: "核心集團"
 GER_the_inner_circle_dm_desc: "元首的核心集團囊括了[GER.GetNameDef]的政治精英，都是狂熱的忠誠分子，致力於推進[GER.GetLeader]的願景。儘管他們充滿野心，努力在核心集團內晉升為“帝國領袖”，他們的影響力塑造了軍事、工業和政治決策，並推動德國的政策制定。然而，他們的野心也是緊張的根源，導致了陰謀和背叛。"
