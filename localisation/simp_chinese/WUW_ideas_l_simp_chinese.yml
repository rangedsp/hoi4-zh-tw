 #NATIONAL SPIRITS
 GER_mefo_bills_modifier: "$GER_mefo_bills$"
 GER_mefo_bills_modifier_desc: "$GER_mefo_bills_desc$" #Reusing the old loc for this
 GER_economy_of_conquest_modifier: "征服經濟"
 GER_economy_of_conquest_modifier_desc: "儘管凡爾賽和約有不公平的規定，但我們將以堅定不移的決心從灰燼中崛起。通過孜孜不倦的重整軍備，我們致力於打造一個無與倫比的軍事工業，為我們走向輝煌提供動力。雖然這會使我們的經濟緊張，但勝利帶來了收穫征服戰利品的機會，引導其他國家的財富來加強我們的軍事。被征服的人有難了！"
 GER_aufrusting_modifier: "軍備擴張"
 GER_aufrusting_modifier_desc: "每一座工廠的建立、每一枚馬克的花費和每一項資源的投資都在助力我們雄心勃勃的目標——打造一臺強大的戰爭機器。重新武裝，即軍備重整，對於保障我們國家的未來和加強德國的主權至關重要。"
 GER_recovering_economy_modifier: "恢復經濟"
 GER_recovering_economy_modifier_desc: "我們的經濟和工業在不計後果的軍備重整開支下瀕臨崩潰。通過審慎的財政政策和堅定的決心，我們將重建我們的國家，使之變得比以往任何時候都要強大！"
 GER_wirtschaftswunder_modifier: "經濟奇蹟"
 GER_wirtschaftswunder_modifier_desc: "我們已經將一個搖搖欲墜的經濟體轉變為世界領先的工業強國。這種顯著的經濟復甦只能被描述為一場經濟奇蹟。"
 GER_kriegsproduktion_modifier: "戰爭生產"
 GER_kriegsproduktion_modifier_desc: "我們必須動員我們高技能的勞動力，讓他們從事武器生產，以確保[GER.GetAdjective]的獨立，並建立必要的軍事儲備。"
 GER_wunderwaffen_modifier: "奇蹟武器"
 GER_wunderwaffen_modifier_desc: "奇蹟武器計劃是一項雄心勃勃的構想，目標是通過顛覆性的技術創新重塑未來戰爭形態。我們的科研人員正在不斷挑戰可能性的極限，致力於打造一系列革命性武器。這些尖端武器將確保我們在空中、海上和陸地上的絕對優勢。這些突破性成果有望改變世界格局，任何膽敢與我們為敵的對手都將面臨滅頂之災。"
 GER_wehrwirtschaft_modifier: "戰時經濟"
 GER_wehrwirtschaft_modifier_desc: "我們不能讓外國勢力左右我們的繁榮和未來。實現自給自足將確保[ROOT.GetNameDef]的經濟獨立，減少對外國資源的依賴，並確保人民的自給自足。"
 GER_army_modifier: "德意志國防軍"
 GER_army_modifier_desc: "[GER.GetNameDefCap]有著悠久而自豪的軍事歷史，並以創新思維著稱。自從在那次世界大戰中遭受羞辱性失敗以來，德國總參謀部一直在尋求進一步提高我們的武裝力量。憑藉這種專業知識，我們的軍隊準備對任何想要征服我們驕傲人民的敵人發起進攻。"
 GER_army_communist_modifier: "人民軍"
 GER_army_communist_modifier_desc: "人民軍隊是社會主義的盾牌，隨時準備保護和傳播無產階級革命。人民總參謀部的創新思維確保任何帝國主義的侵略都無法熄滅德國人民的革命精神。"
 GER_navy_fascist_modifier: "德國海軍"
 GER_navy_fascist_modifier_desc: "通過現代化和大膽的戰略，我們挑戰海洋，在敵人中播下恐懼。我們的強大戰列艦將統治海洋，我們的潛艇將統治海底。"
 GER_navy_democratic_modifier: "德國海軍部隊"
 GER_navy_democratic_modifier_desc: "德國海軍挑戰海洋，保護我們的海洋利益，並確保我們的影響力遍及全球。"
 GER_navy_imperial_modifier: "帝國海軍"
 GER_navy_imperial_modifier_desc: "我們強大的帝國海軍將破浪前行，帶領我們的全球野心並在海洋上確立我們的霸權。"
 GER_navy_communist_modifier: "人民海軍"
 GER_navy_communist_modifier_desc: "人民海軍時刻警惕帝國主義的侵略。它將把無產階級革命傳播到海外，開創一個新的世界秩序。"
 GER_airforce_modifier: "空軍"
 GER_airforce_modifier_desc: "憑藉無與倫比的技能和技術，空軍準備主宰天空，並向任何膽敢挑戰我們的敵人展示我們的力量。憑藉最先進的飛行器和訓練有素的飛行員，我們的空軍時刻準備點燃天空，摧毀任何軍隊，擊沉任何反對我們的海軍。"
 GER_airforce_communist_modifier: "人民空軍"
 GER_airforce_communist_modifier_desc: "我們的空軍翱翔於天空，捍衛無產階級國家和社會主義的未來。每架飛行器都是人民智慧和不屈精神的象徵，隨時準備迎戰任何敵人。"
 GER_military_modifier_tt: "[GetSubmarineMaxSpeed]"
 GER_military_modifier_submarine_speed_big: "$GER_military_modifier$"
 GER_military_modifier_submarine_speed_big_desc: "$GER_military_modifier_desc$"
 GER_submarine_max_speed_small_tt: "$ship_hull_submarine$$STAT_NAVY_MAXIMUM_SPEED$：§G+5%§!"
 GER_submarine_max_speed_big_tt: "$ship_hull_submarine$$STAT_NAVY_MAXIMUM_SPEED$：§G+10%§!"
 GER_military_modifier_fascist_desc: "[GER.GetNameDefCap]擁有悠久而光榮的軍事歷史，並以創新思維著稱；自世界大戰的屈辱戰敗後，我們的總參謀部一直致力於進一步改進我們的軍隊。憑藉這份專業知識，我們已準備好打擊任何試圖征服我們偉大民族的敵人。"
