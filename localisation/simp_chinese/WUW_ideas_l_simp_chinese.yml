 GER_nordische_legion_ns: "北歐軍團"
 GER_nordische_legion_ns_desc: "許多[ROOT.GetAdjective]人渴望冒險，願意為正義事業而戰。為此，我們建立了一支志願軍團，他們將前往支援我們的北歐同胞參加戰爭。"
 GER_fernostliche_legion_ns: "遠東軍團"
 GER_fernostliche_legion_ns_desc: "許多[ROOT.GetAdjective]人渴望冒險，並希望為一個好的事業而戰。為此，我們建立了一支志願兵軍團，前去參戰，幫助我們的[CHI.GetAdjective]朋友。"
 GER_expatriated_communists_return_home_ns: "流亡共產主義者重返故土"
 GER_expatriated_communists_return_home_ns_desc: "納粹統治期間被迫離開國家的許多德國共產主義者現在大批量回國與他們曾經的壓迫者戰鬥。"
 GER_expatriated_communists_return_home_supressed_ns: "流亡共產主義者回歸"
 GER_expatriated_communists_return_home_supressed_ns_desc: "儘管軍政府公開反對共產主義，但納粹統治期間被迫離開國家的許多德國共產主義者現在正大批量回國。"
 GER_bismarckjugend_idea: "俾斯麥青年團"
 GER_bismarckjugend_idea_desc: "德國國家人民黨重組了俾斯麥青年團，試圖通過準軍事組織將更多人納入軍隊。"
 GER_eiserne_front_idea: "鋼鐵陣線"
 GER_eiserne_front_idea_desc: "為了戰勝敵人，德國國家正式僱用並提拔鋼鐵陣線，這是一支社會民主主義的準軍事組織。"
