 ###### BELGIAN DESIGNERS (IDEAS) #########
 BEL_cockerill_industrial: "柯克里爾"
 BEL_societe_generale_de_belgique_industrial: "比利時興業銀行"
 BEL_distrigaz: "迪斯特里天然氣公司"
 ###### BELGIAN NATIONAL SPIRITS #########
 BEL_inflation_controls_ns: "控制通貨膨脹"
 BEL_inflation_controls_ns_desc: "為了減少通貨膨脹的影響，我們開始回購貨幣並不再發行損壞貨幣的替代品，調整利率，並鼓勵經濟循環中鼓勵消費。"
 BEL_language_barriers_ns: "語言隔閡"
 BEL_language_barriers_ns_desc: "比利時被分為兩個語言群體：瓦隆地區的法語群體和佛蘭德人的荷蘭語群體。每一方都對自己的文化和遺產極為自豪，語言與此密切相關，所以雙方都不願放棄自己的語言，也不願看到自己的語言屈從於對方。"
 BEL_language_barriers_fas_nl_ns: "荷蘭語至上"
 BEL_language_barriers_fas_nl_ns_desc: "荷蘭語被選為[ROOT.GetName]的第一語言，佛蘭德文化得到推動，而瓦隆文化則以團結的名義被抑制。"
 BEL_language_barriers_fas_fr_ns: "法語至上"
 BEL_language_barriers_fas_fr_ns_desc: "法語被選為[ROOT.GetName]的第一語言，瓦隆文化得到推動，而佛蘭德文化則以團結的名義被抑制。"
 BEL_traditional_family_values_ns: "傳統家庭價值觀"
 BEL_traditional_family_values_ns_desc: "家庭是一個人生活中最重要的方面之一，我們堅持一套特定的標準。家庭單位內有明確的性別角色和期望，這有助於我們人口的增長和穩定。"
 BEL_defensive_neutrality_capstone_ns: "國防重組"
 BEL_defensive_neutrality_capstone_ns_desc: "我們已經盡力為入侵做好準備，剩下的唯一任務是，沿著最現代化的防禦思想路線，確定更多的戰略和高層次的理論變革。"
 BEL_lack_of_junior_officers_ns: "缺少初級軍官"
 BEL_lack_of_junior_officers_ns_desc: "部隊的快速動員總體上進展順利，除了一個問題：缺乏初級軍官來組織我們的新兵！軍事等級制度需要一段時間才能自我調整。"
 BEL_legacy_of_the_great_war_ns: "大戰的遺產"
 BEL_legacy_of_the_great_war_ns_desc: "佛蘭德斯戰場見證了西線最激烈的戰鬥，這片地區由阿爾貝國王、他勇敢的比利時士兵以及我們盟友的犧牲奮力捍衛。我們應銘記這段歷史，並努力以他們為榜樣。"
 BEL_pressurized_cabins_ns: "增壓艙"
 BEL_pressurized_cabins_ns_desc: "為了縮短比利時與我們的剛果殖民地之間的航程時間，我們開創了使用增壓艙的飛機。"
 BEL_license_air_idea: "空軍飛機許可"
 BEL_license_air_idea_desc: "我們需要快速獲得飛機，因此同外國企業簽下了一系列合同。"
 BEL_license_POL_air_idea: "波蘭飛機許可"
 BEL_license_POL_air_idea-desc: "通過與波蘭夥伴的良好關係，我們以非常合理的價格獲得了許多軍事生產許可。"
 BEL_legacy_of_the_belgian_airforce_ns: "比利時空軍的遺產"
 BEL_legacy_of_the_belgian_airforce_ns_desc: "比利時是最早建設空戰力量的國家之一，我們的飛行員在那次世界大戰中表現得非常英勇。他們的遺產已經得到了我們這一代飛行員的認可，並渴望繼續沿著他們的足跡前進。"
 BEL_re_build_the_fleet_ns: "重建艦隊"
 BEL_re_build_the_fleet_ns_desc: "我們的海軍在1927年解散，然而，全球形勢要求我們再次投資艦隊，以保持與剛果的貿易聯繫，並追求我們的海上利益。"
 BEL_maritime_support_ns: "海軍支援"
 BEL_maritime_support_ns_desc: "隨著更多的海軍基礎設施投入使用，我們艦隊的能力得到了顯著增強。"
 BEL_convoy_protection_duties_ns: "運輸護航職責"
 BEL_convoy_protection_duties_ns_desc: "海上航線變得越來越危險，所以我們為商船的水手配備了武器，這樣即使在遭到攻擊時，他們的護航隊也能有一些保護，至少可以增加逃脫的機會。"
 BEL_maritime_phoenix_ns: "海上鳳凰"
 BEL_maritime_phoenix_ns_desc: "就像鳳凰涅槃一樣，我們的艦隊也從報廢的船隻中重生。"
 BEL_economic_recovery_ns: "經濟復甦"
 BEL_economic_recovery_ns_desc: "我們的疲軟經濟已經開始顯示出復甦的初步跡象。消費增加，債務減少，投機者對市場的信心增強。"
 BEL_collapsing_government_ns: "政府崩潰"
 BEL_collapsing_government_ns_desc: "腐敗指控已經震撼了政府，以至於像老鼠逃離沉船一樣，官員們紛紛辭職，幾乎每天都有辭職事件發生，很明顯，這屆內閣已時日無多。"
 BEL_the_kings_surrender_ns: "國王投降"
 BEL_the_kings_surrender_ns_desc: "利奧波德三世國王已經提出投降，這動搖了我們軍隊的士氣，極大影響了我們繼續戰鬥的能力。"
 BEL_prisoner_king_ns: "囚徒王"
 BEL_prisoner_king_ns_desc: "在我國投降後，利奧波德三世國王仍然與人民留在一起。他現在是所有比利時人團結一致、準備恢復比利時統治的象徵。"
 BEL_dame_blanche_ns: "白夫人"
 BEL_dame_blanche_ns_desc: "在世界大戰期間創建的抵抗組織似乎只是進入了休眠狀態，如今比利時再次受到威脅，它又重新行動起來。這個組織從陰影中向我們的盟友提供信息，並協調抵抗行動。"
 BEL_king_law_freedom_ns: "國王，法律，自由"
 BEL_king_law_freedom_ns_desc: "比利時的格言很好地總結了比利時人的心理。國王，將帶領我們走向勝利。法律，在戰爭的混亂中揮舞利劍。自由，屬於比利時和比利時人。"
 BEL_chasseurs_ardennais_ns: "阿登獵兵"
 BEL_chasseurs_ardennais_ns_desc: "阿登獵兵是來自比利時的阿登地區的老練防禦部隊，極其擅長森林作戰。"
 BEL_chasseurs_ardennais_ns_ncns: "$BEL_chasseurs_ardennais_ns$"
 BEL_chasseurs_ardennais_ns_ncns_desc: "$BEL_chasseurs_ardennais_ns_desc$"
 BEL_dissolve_political_parties_ns: "解散政黨"
 BEL_dissolve_political_parties_ns_desc: "我們的首相宣佈，政黨是我們腐敗政治體系的腐朽核心，為了治癒這一疾病，必須解散政黨。"
 BEL_the_walloon_legion_ns: "瓦隆軍團"
 BEL_the_walloon_legion_ns_desc: "瓦隆軍團由講法語的志願者組成，他們擔心在他們的佛蘭德兄弟面前黯然失色，希望能證明自己在戰爭中的價值。"
 BEL_surrender_tt: "§R選擇該選項會使你的國家投降！§!\n\n如果你在陣營中，你會繼續作為流亡政府戰鬥。"
 BEL_scars_of_ww1_ns_fake: "$BEL_scars_of_ww1_dynamic_modifier$"
 BEL_scars_of_ww1_ns_fake_desc: "$BEL_scars_of_ww1_dynamic_modifier_desc$"
 BEL_corruption_ns_fake: "$BEL_corruption_dynamic_modifier$"
 BEL_corruption_ns_fake_desc: "$BEL_corruption_dynamic_modifier_desc$"
 BEL_democratization_of_education_ns: "教育民主化"
 BEL_democratization_of_education_ns_desc: "我們的社會有著彼此關愛的傳統，這體現在工人與企業間的社會契約中。同樣，國家也應致力於給予每個人平等機會，彰顯優質教育的重要性。"
 ###### BELGIAN DYNAMIC MODIFIERS #########
 BEL_scars_of_ww1_dynamic_modifier: "大戰之瘡"
 BEL_scars_of_ww1_dynamic_modifier_desc: "[BEL.GetName]在大戰期間飽受戰火摧殘，西線戰場的主要戰鬥大多發生在這片土地上，至今仍留有深重的創傷。"
 BEL_social_partners_dynamic_modifier: "社會夥伴"
 BEL_social_partners_dynamic_modifier_desc: "[ROOT.GetName]將工會和公司代表聚集在一起，促成了包括最低工資和六天帶薪假期在內的妥協協議。"
 BEL_engine_of_the_economy_dynamic_modifier: "經濟引擎"
 BEL_engine_of_the_economy_dynamic_modifier_desc: "我們登上了繁榮的快車，工業的車輪在轉動，我們蓄勢前行，標誌著一個新時代的開始。"
 BEL_belgian_miracle_dynamic_modifier: "比利時奇蹟"
 BEL_belgian_miracle_dynamic_modifier_desc: "[ROOT.GetLeader]的政策確實取得了成效，[ROOT.GetName]在全球舞臺上崛起，它的工業成就被許多所謂大國稱為奇蹟。"
 BEL_neutrality_dynamic_modifier: "永久中立"
 BEL_neutrality_dynamic_modifier_desc: "比利時是一個獨立和永久中立的國家，它對所有其他國家也應保持同樣的中立。"
 BEL_defensive_neutrality_dynamic_modifier: "防禦性中立"
 BEL_defensive_neutrality_dynamic_modifier_desc: "為了保護我們的中立性，我們必須確保我們的防禦足夠強大到沒有侵略者願意攻擊我們。"
 BEL_austrian_resistance_active_state_dynamic_modifier: "奧地利自由陣線"
 BEL_austrian_resistance_active_state_dynamic_modifier_desc: "奧地利自由陣線在該地積極活動，有望招募到更多兵力，並且如果該地被佔領，還會出現更多的抵抗力量。"
 BEL_mobilize_the_nation_dynamic_modifier: "全國動員"
 BEL_mobilize_the_nation_dynamic_modifier_desc: "我們的人民是我們最大的資產。讓我們動員他們，儘可能擴充我們的軍隊。"
 BEL_defensive_reorganization_dynamic_modifier: "國防重組"
 BEL_defensive_reorganization_dynamic_modifier_desc: "我們已經確定了更多的戰略和高層次的理論變革，併成為世界上現代防禦理論的引領者之一。"
 BEL_royal_military_academy_dynamic_modifier: "皇家軍事學院"
 BEL_royal_military_academy_dynamic_modifier_desc: "我們將最優秀的人才送往皇家軍事學院，在那裡下一代軍官可以接受各種專業科目的世界級軍事訓練。"
 BEL_corruption_dynamic_modifier: "腐敗"
 BEL_corruption_dynamic_modifier_desc: "我們的政府腐敗猖獗，出現了一系列涉及賄賂和挪用公款等罪行的醜聞。公眾對我們民主制度的信任從未如此低。"
 BEL_economic_downturn_dynamic_modifier: "經濟衰退"
 BEL_economic_downturn_dynamic_modifier_desc: "自從上次戰爭將我們的國家變成戰場以來，我們的經濟一直處於崩潰狀態，我們仍在努力應對的全球大蕭條的影響，經濟復甦因而進一步受阻。"
 BEL_belgian_legion_dynamic_modifier: "比利時軍團"
 BEL_belgian_legion_dynamic_modifier_desc: "一群保守派和王室的效忠者們準備隨時為他們的國王拿起武器。"
 BEL_gold_reserves_dynamic_modifier: "[BEL.GetAdjective]黃金儲備"
 BEL_rexist_legion_dynamic_modifier: "雷克斯軍團"
 BEL_rexist_legion_dynamic_modifier_desc: "雷克斯運動中教會和國家的統一，使我們能夠建立一個類似於古代軍事修會的軍事組織。"
 BEL_european_crusade_dynamic_modifier: "歐洲十字軍"
 BEL_european_crusade_dynamic_modifier_desc: "我們是歐洲理想的心臟，面對盤旋在邊界的禿鷹，只有靠我們堅定不移的決心，才能擊退各種形式的野蠻威脅。"
 BEL_socialism_on_the_rise_dynamic_modifier: "社會主義思潮"
 BEL_socialism_on_the_rise_dynamic_modifier_desc: "在王德威爾得在選舉中相對領先後，社會主義思潮在[ROOT.GetNameDef]穩步增長。"
 BEL_academies_of_belgium_dynamic_modifier: "比利時學院"
 BEL_academies_of_belgium_dynamic_modifier_desc: "比利時學院是全國高等學術機構的集體組織，是比利時技術突破的核心。"
 ###### BELGIAN STATE MODIFIERS #########
 BEL_belgian_resistance_state_dynamic_modifier: "比利時抵抗組織"
 BEL_belgian_resistance_state_dynamic_modifier_desc: "我們的人民對被佔領並不陌生，許多人在上次戰爭中學到了非暴力不合作和抵抗的經驗教訓。" #Note, this is countered by the Secretaries General occupation law.
 BEL_flooded_tank_barriers_dynamic_modifier: "淹沒式反坦克屏障"
 BEL_flooded_tank_barriers_dynamic_modifier_desc: "該區域的水下隱藏著分散的反坦克障礙物，旨在遲滯敵軍移動，增強比利時的防禦。"
 BEL_secretaries_general_tt: "§Y國家控制者§!將在§Y比利時核心地區§!中獲得一部僅限於該區域的特殊§Y佔領法§!。"
 ###### BELGIAN HIDDEN IDEAS #########
 BEL_international_stipend_ns: "國際津貼"
