 ###### AUSTRIAN NATIONAL SPIRITS (IDEAS) ######
 AUS_widespread_unemployment: "廣泛失業"
 AUS_widespread_unemployment_desc: "自經濟崩潰以來，奧地利一直在與通貨膨脹和高失業率作鬥爭。民眾對政客的怨恨程度很高。"
 AUS_employment_efforts: "就業努力"
 AUS_employment_efforts_desc: "我們投入了大量資金以解決奧地利當前的就業危機。現在學徒在工廠中隨處可見，人民和產業看起來都很滿意。"
 AUS_phonix_insurance: "鳳凰保險"
 AUS_phonix_insurance_desc: "鳳凰保險為我們的入伍人員提供了人壽保險，以應對他們發生最糟糕的事件時的情況。人們知道他們的家庭將得到照顧後，願意加入軍隊的人數顯著增加了。"
 AUS_covering_the_phonix_insurances: "為鳳凰保險承保"
 AUS_covering_the_phonix_insurances_desc: "讓大眾得知深得民心的鳳凰保險不復存在將嚴重影響我們維持和改善軍隊的能力。國家將提供承保，直到鳳凰保險重新站穩腳跟。"
 AUS_cannot_train_due_to_treaty_of_saint_germain_en_laye: "當§Y$AUS_treaty_of_saint_germain_en_laye$§!生效時無法訓練新單位"
 AUS_treaty_of_saint_germain_en_laye: "聖日耳曼昂萊條約"
 AUS_treaty_of_saint_germain_en_laye_desc: "奧地利軍隊和軍事工業受那次世界大戰後簽署的嚴格條約的約束，它們都只是過去的影子罷了。"
 AUS_treaty_of_saint_germain_en_laye_tt: "可以派遣志願軍：§R否§!"
 AUS_treaty_of_saint_germain_en_laye_tt_2: "§R只要這個民族精神還在生效，徵兵法案就不能超過“志願兵役”；部隊不得訓練、解散或更改建制！§!"
 AUS_revised_treaty_of_saint_germain_en_laye: "修訂《聖日耳曼昂萊條約》"
 AUS_revised_treaty_of_saint_germain_en_laye_desc: "通過外交努力，原來的《聖日耳曼昂萊條約》的影響已經減輕。[ROOT.GetNameDef]軍隊規模不再嚴格受限，現在可以開始小規模的重新武裝。"
 AUS_recovering_from_the_depression: "從經濟大蕭條中恢復"
 AUS_recovering_from_the_depression_desc: "雖然恢復得很慢，但看起來奧地利終於要走出30年代初的經濟崩潰了。"
 AUS_recurrent_economic_depression: "經濟大蕭條捲土重來"
 AUS_recurrent_economic_depression_desc: "短期效應有效，但一旦這些效應消失，經濟危機又會更糟糕的模式似乎像詛咒一樣跟隨奧地利。通貨膨脹率再次飆升，經濟陷入混亂。"
 AUS_economic_boom: "經濟繁榮"
 AUS_economic_boom_desc: "通過艱苦的努力且巨大的努力，奧地利已經將經濟災難轉變為高速增長的經濟。"
 AUS_women_in_academia: "學術界的女性"
 AUS_women_in_academia_desc: "允許婦女接受高等教育，奧地利的科學進步有了顯著的飛躍。"
 AUS_militia_support: "民兵支持"
 AUS_militia_support_2: "民兵支持"
 AUS_militia_support_desc: "我們已經招募了[GetMilitiaName]的支持來幫助我們的事業。這個準軍事組織長期以來一直被禁止，但在這種情況下，我們可以很容易地為其復出正名。"
 AUS_militia_is_schutzbund: "保衛聯盟"
 AUS_militia_is_sturmscharen: "突擊部隊"
 AUS_militia_is_heimwehr: "保安團"
 AUS_militia_is_undecided: "民兵"
 AUS_emergency_measures: "緊急措施"
 AUS_emergency_measures_desc: "在這個日趨激進的世界中，為了在國際舞臺上立足，[AUS.GetNameDef]必須迅速提升工業實力，以確保國家各項需求得到滿足。"
 AUS_host_of_communist_dissidents: "接待共產主義異見分子"
 AUS_host_of_communist_dissidents_desc: "從全世界邀請志同道合的人，[AUS.GetNameDef]正在成為共產主義流亡者的中心。"
 AUS_devalued_the_schilling: "先令貶值"
 AUS_devalued_the_schilling_desc: "為了遏制通貨膨脹，貨幣已被貶值。短期內效果並不完全有利，但從長遠來看，這應該會為國家帶來改善。"
