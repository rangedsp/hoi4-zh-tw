 AUS_alpine_federation_against_fascism: "阿爾卑斯反法西斯攻勢"
 AUS_payment_for_alaska: "售賣阿拉斯加的付款"
 AUS_payment_for_alaska_desc: "阿拉斯加的售賣在我們民眾中引發了爭議，但沒有人能否認它對我們國家產生的積極影響。"
