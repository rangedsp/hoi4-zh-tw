 ###### AUSTRIAN NATIONAL SPIRITS (DYNAMIC MODIFIERS) ######
 AUS_austrofascism: "奧地利法西斯主義"
 AUS_austrofascism_desc: "拒絕西方民主議會制，以企業國家的方式運作，祖國陣線是唯一的執政黨。憲法已被改寫，引導奧地利走向法團主義、威權主義和民族主義。"
 AUS_habsburg_monarchy_restored: "哈布斯堡君主復辟"
 AUS_austrian_monarchy_restored: "奧地利恢復君主制"
 AUS_habsburg_monarchy_restored_desc: "君主制[AUS.GetNameDef]曾躋身歐陸列強。只有恢復君主制，我們才能再度成為列強！"
 AUS_farr: "奧地利第一共和國重生"
 AUS_farr_desc: "廢除五月憲法，並再次允許政黨、舉行選舉，[AUS.GetNameDef]恢復了一個被認為失傳已久的共和國。"
 AUS_doth: "國土防禦"
 AUS_doth_desc: "無論在軍隊中，在工廠裡，還是在建築工地上，每個人堅守自己的崗位為保衛祖國儘自己的一份力量，是每個[AUS.GetAdjective]人的職責。只要全國人民共同努力，祖國就會得到保護！"
 AUS_aggression: "奧地利出擊"
 AUS_aggression_desc: "在當前的情況下，躺平並希望不被攻擊，是一種不安全的做法。為了確保我們不會被猝不及防地攻擊，我們必須準備先發制人。"
 AUS_austromarxism: "奧地利馬克思主義"
 AUS_austrostalinism: "奧地利斯大林派"
 AUS_austrotrotskyism: "奧地利托派"
 AUS_austromarxism_desc: "奧地利馬克思主義者的運動憲章，根植於奧托·鮑爾的著作，主張在社會民主主義和蘇聯共產主義之間尋求中間道路。從此前的奧地利法西斯主義狀態大幅轉變，這個國家現正試圖界定什麼是共產主義，什麼是民主。"
 AUS_austrostalinism_desc: "一方面擺脫了奧地利馬克思主義的中間道路，另一方面又早已摒棄了奧地利法西斯主義，[AUS.GetNameDef]如今正奉行一套嚴苛的斯大林主義思想。"
 AUS_austrotrotskyism_desc: "一方面擺脫了奧地利馬克思主義的中間道路，另一方面又早已摒棄了奧地利法西斯主義，[AUS.GetNameDef]如今正奉行一套嚴苛的托洛茨基主義思想。"
 AUS_peoples_army: "人民軍隊"
 AUS_peoples_army_desc: "動員群眾已經導致了國家內部有一支訓練有素且裝備良好的民兵力量，這些民兵的組織速度之快和裝備之好都是不尋常的。結果，這也促進了常規軍隊的招募。"
 AUS_empire_restored: "奧地利帝國復辟"
 AUS_empire_restored_desc: "她曾是帝國，她也將是帝國！在收復了大部分舊[AUS.GetAdjective]領土後，帝國重生了。"
 AUS_airforce: "奧地利空軍"
 AUS_army: "奧地利聯邦軍"
 AUS_army_monarchy: "奧地利後備軍"
 AUS_navy: "奧地利海軍"
 AUS_compensation_for_guarantee: "補償外國援助"
 AUS_compensation_for_guarantee_desc: "得到其他國家的援助並不便宜。通過承諾負責他們一部分的消費品生產，我們設法購買了他們的援助，以應對可能發生的最糟糕情況。"
