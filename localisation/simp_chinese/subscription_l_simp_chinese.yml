 DLC_DESCRIPTION_dlc018: "加拿大、澳大利亞、新西蘭、印度和南非有了新的國策樹和事件。穿插路線命令為大規模包圍和突破敵軍防線給予更多控制。"
 DLC_DESCRIPTION_dlc020: "四個全新國策樹：從匈牙利、羅馬尼亞、捷克斯洛伐克和南斯拉夫的艱難前景體驗戰爭。"
 DLC_DESCRIPTION_dlc022: "修改了德國和日本的國策樹：兩個主要的軸心國勢力現在有了架空歷史路線，包括罷免希特勒或在日本確立共產主義或民主主義。"
 DLC_DESCRIPTION_dlc023: "獲取新的艦船設計、海軍將官特質和技能以及兩棲載具。用水雷保護你的海洋和艦艇航線以規避危險。還有荷蘭、英國、墨西哥和美國的新國策樹。"
 DLC_DESCRIPTION_dlc028: "《La Résistance》添加了秘密特工和間諜任務併為抵抗活動提供了新選項。派遣特工進入危險地域以破譯敵軍秘密，或扶植只為一嘗權力滋味而心甘情願的合作者來為你的入侵做好準備。"
 DLC_DESCRIPTION_dlc031: "添加了黑海和愛琴海周邊次要力量的專屬國策樹。在抵禦列強試圖控制博斯普魯斯和達達尼爾海峽的重要航路時，保加利亞、希臘和土耳其可追循各自獨特的史實和架空路線。"
 DLC_DESCRIPTION_dlc034: "《No Step Back》在東歐許多國家加入了更多細節，添加了反映蘇聯政治的獨特遊戲系統，併為遊戲的軍事方面帶來了許多改進。"
 DLC_DESCRIPTION_dlc036: "建立新帝國、抵禦外國侵略或是探尋中立的極限。《By Blood Alone》拓展包為意大利、埃塞俄比亞和瑞士添加了新的架空歷史遊玩選項，並帶來了其他諸多大型改動。"
 DLC_DESCRIPTION_dlc038: "在歐陸強權為世界的未來而戰之時，為北歐國家撰寫心潮澎湃的嶄新歷史。芬蘭、瑞典、丹麥和挪威的新國策樹將登上舞臺中央。特化你的軍備產業以提高效率，然後在全新的國際市場上出售武器。"
 DLC_DESCRIPTION_dlc040: "《Trial of Allegiance》為巴西、阿根廷、智利、烏拉圭和巴拉圭添加了大量的國策樹。整個大洲的穩定局面在刀尖之上搖搖欲墜。用你最寶貴的商品——忠誠，迎合歐陸上的贊助者，同時在戰爭中開闢一條新戰線。"
 DLC_DESCRIPTION_dlc043: "運用尖端原型技術與先進武器，對抗你的敵人。執行突襲任務，摧毀敵方研究設施、水壩與地標建築。全面升級的國策樹系統帶來全新戰略維度：通過德國核心決策圈實現戰略目標，以奧地利或匈牙利身份重建哈布斯堡帝國，並深度探索比利時及其殖民地剛果的政治格局演變。"
 DLC_DESCRIPTION_dlc046: "《Graveyard of Empires》為伊朗、英屬印度、伊拉克和阿富汗添加了獨特的國策樹。在統治中東和南亞期間，削弱干預的外部勢力的影響，重拾你的國家失落的驕傲。"
 DLC_DESCRIPTION_dlc049: "《No Compromise, No Surrender》為日本、中國和菲律賓開闢全新的歷史道路。通過更精細的陣營控制，打造革命性的全新軍事學說，親手改寫太平洋戰區乃至全球格局的命運走向。"
 DLC_DESCRIPTION_dlc051: "重建波希米亞王國，組建中歐國家聯盟，築起堅固防線以自保，或依託“我們時代的和平”全新國策樹，構建縱橫捭闔的聯盟網絡。捷克斯洛伐克將由你引領走向未來。"
 DLC_DESCRIPTION_dlc052: "親臨指揮核心，派遣將領奔赴前線，為最戰功卓著的艦長授勳。作為澳大利亞，擊退日本在東南亞的入侵；作為暹羅，建立一個新的帝國；並決定印度尼西亞的未來，無論是否接受荷蘭統治。"


