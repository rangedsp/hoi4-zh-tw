 CZE_sudetenland_paramilitaries_modifier: "蘇臺德準軍事活動"
 CZE_sudetenland_paramilitaries_modifier_desc: "蘇臺德地區的游擊隊和準軍事組織正在破壞我軍在當地的部署。他們積極襲擊我方部隊，並與敵對勢力勾結。"
