 #Dynamic Modifiers National Spritits
 CZE_ceskoslovenska_armada_dynamic_modifier: "捷克斯洛伐克軍隊"
 CZE_ceskoslovenska_armada_dynamic_modifier_desc: "軍隊建立於奧匈帝國捷克部隊和捷克斯洛伐克軍團退伍兵的灰燼中。兩者的傳統仍影響著這支軍隊的運作方式。"
 CZE_ceskoslovenske_letectvo_dynamic_modifier: "捷克斯洛伐克空軍"
 CZE_ceskoslovenske_letectvo_dynamic_modifier_desc: "飛機也許不能時刻做好準備，但我們的飛行員可以。面對來自各方的潛在空中威脅，我們必須讓天空成為我們的海洋。每個飛行員都必須頂三個用。"
 CZE_a_divided_nation_dynamic_modifier: "分裂的國家"
 CZE_a_divided_nation_dynamic_modifier_desc: "[CZE.GetAdjective]作為一個保護境內所有人的多元國家，在中歐獨樹一幟。然而，大蕭條改變了這種情況。經濟上的困難讓政府成為眾矢之的。這種怨恨現在深深分裂了國家。"
 CZE_skoda_works_dynamic_modifier: "斯柯達工廠"
 CZE_skoda_works_dynamic_modifier_desc: "斯柯達公司涵蓋了我們所有重工業領域的生產、建設和投資。它的影響力在我國幾乎是無限的。"
 CZE_ceskoslovenske_alecne_lodstvo_dynamic_modifier: "捷克斯洛伐克海軍"
 #Dynamic State Modifiers
 CZE_sudetenland_german_state_modifier: "蘇臺德分離主義"
 CZE_sudetenland_german_state_modifier_desc: "近期的經濟困難對蘇臺德的工業造成了衝擊，導致當地人民將其不幸歸咎於[ROOT.getname]政府。"
 CZE_tesinko_polish_state_modifier: "波蘭分離主義"
 CZE_czech_state_modifier: "捷克熟練工人短缺"
 CZE_czech_state_modifier_desc: "20世紀經濟的快速發展對以農業為主的捷克人口造成了很大壓力。要找到具備技能的合格捷克勞動者來填補崗位空缺十分困難。因此必須採取措施，幫助年輕的捷克公民為適應現代經濟不斷變化的需求做好準備。"
