 #National Spirits
 CZE_taticek_of_czechoslovakia: "馬薩里克老爹"
 CZE_taticek_of_czechoslovakia_desc: "托馬斯·馬薩里克，常被稱為“塔季切克·馬薩里克”（意為“父親”或“祖國之父”），自捷克斯洛伐克建國以來便一直是民族的支柱。當人們認為組建聯合政府絕無可能、政治僵局難以打破時，馬薩里克總能一次次創造政治的奇蹟，幫助捷克斯洛伐克發展壯大。即便退休後，他對政治領導層的意見與建議仍被視為命令，而非忠告。"
 CZE_industrialists_veto: "工業家的反對"
 CZE_industrialists_veto_desc: "工業家們掌控著[CZE.GetNameDef]許多最大的企業集團，在該國政治中擁有相當大的影響力。在經濟政策問題上，他們的訴求不容忽視；而經濟動員則是他們最強烈抵制的一類措施。"
 CZE_agrarian_politics_1: "農業政治"
 CZE_agrarian_politics_1_desc: "儘管我國也算得上是工業國，但農場主和農民在許多政黨中都有相當大的政治影響力。他們往往會影響經濟政策決策，成為進一步推動工業進步的持續政治障礙。"
 CZE_directorate_of_fortification_works_no_gd_idea: "防禦工事局"
 CZE_directorate_of_fortification_works_no_gd_idea_desc: "被稱為ROP的$CZE_directorate_of_fortification_works_no_gd_idea$是主管監督全國築防進展的管理機構。"
 CZE_czech_corporatism: "捷式社團主義"
 CZE_broken_shield: "破碎之盾"
 CZE_redirected_fortification_council_funds: "重新分配防禦預算"
 CZE_army_readiness_1: "無準備的軍隊"
 CZE_army_readiness_1_desc: "軍隊的戰備狀態不僅取決於戰場上的兵力和裝備。面對威脅時，對自身準備工作的信心，以及國內政治和工業領袖的支持同樣重要。擁有作戰手段是一回事，能否有效作戰則是另一回事。"
 CZE_army_readiness_3: "做好準備的軍隊"
 CZE_army_readiness_3_desc: "軍隊的戰備狀態不僅取決於戰場上的兵力和裝備。面對威脅時，對自身準備工作的信心，以及國內政治和工業領袖的支持同樣重要。擁有作戰手段是一回事，能否有效作戰則是另一回事。"
 CZE_ready_for_anything_idea: "為一切做好準備"
 CZE_sudeten_german_quandary: "蘇臺德困境"
 CZE_sudeten_german_quandary_desc: "雖然大多數蘇臺德地區的民眾只希望能在現有政府框架下獲得更多自治權。但如果其他德意志國家企圖吞併該地區的任何部分，許多蘇臺德政黨及其支持者很可能會迅速成為第五縱隊。"
 CZE_sudeten_german_quandary_modifier_tt: "§Y被動效果§!：\n如果與我們接壤的§Y[AUS.GetFlag][AUS.GetNonIdeologyName]§!、§Y[GER.GetFlag][GER.GetNonIdeologyName]§!或任何其他[BAY.GetFlag]§Y德意志國家§!正當化或獲得對我們的§R戰爭目標§!，而§Y[69.GetName]§!、§Y[972.GetName]§!或§Y[74.GetName]§!由我們控制：\n -（§Y控制的所有蘇臺德地區§!）：\n    添加§Y$CZE_sudetenland_paramilitaries_modifier$§!，其效果為：\n       $MODIFIER_LOCAL_INTEL_TO_ENEMIES$：§R+10%§!\n       $MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$：§R-10.0%§!\n       $modifier_state_repair_speed_bunker_factor$：§R-10.00%§!\n\n - 該§Y效果§!只會觸發一次"
 CZE_sudeten_challenge: "蘇臺德挑戰"
 CZE_sudeten_challenge_desc: "蘇臺德地區近期準軍事組織的活動，讓國際社會許多人認為當前針對我們的侵略行動是正當的！要說服世界改變這一看法還需要時間。"
 CZE_sudeten_facde: "蘇臺德假象"
 CZE_sudeten_facde_desc: "由於未支持當地準軍事組織，我們針對[CZE.getname]的行動理由如今在國際社會看來只是欲蓋彌彰的藉口。"
