 MAPMODE_SUPPLY_MAP_MODE_NAME: "補給"
 MAPMODE_SUPPLY_MAP_MODE: "§H補給§!地圖模式"
 MAPMODE_SUPPLY_MAP_MODE_DESCRIPTION: "顯示當前補給狀況。較亮的綠色區域補給最充足，而紫色區域則最為短缺。單位遭受補給不足懲罰的區域按惡劣狀況標記為§Y黃色§!到§R紅色§!。"
 MAPMODE_STRATEGIC_NAVY_NAME: "海軍戰略"
 MAPMODE_STRATEGIC_NAVY: "§H海軍戰略§!地圖模式"
 MAPMODE_STRATEGIC_NAVY_DESCRIPTION: "展示戰略區域並讓你看到有哪些海軍行動將通過你的艦隊執行。\n你的海軍在哪片區域裡佔到優勢將通過§G綠色§!輪廓顯示。\n當前在§R紅色§!條紋區域外徘徊著被挑選出來的艦隊可以隨時使用。"
 MAPMODE_STRATEGIC_AIR_NAME: "空軍戰略"
 MAPMODE_STRATEGIC_AIR: "§H空軍戰略§!地圖模式"
 MAPMODE_STRATEGIC_AIR_DESCRIPTION: "展示戰略區域並讓你看到有哪些空軍行動將通過你的空軍部隊執行。\n§G綠色地區§!是友軍空軍佔有優勢的地區，§R紅色地區§!是敵軍空軍佔有優勢的地區。\n在這些區域中你的機場和空軍部隊將以高亮顯示。"
 MAPMODE_RESOURCES_NAME: "戰略資源"
