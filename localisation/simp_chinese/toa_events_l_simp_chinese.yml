l_simp_chinese:
 south_american_news.1.t: "南美的戰爭"
 south_american_news.1.d: "自從大哥倫比亞解體以來，秘魯和厄瓜多爾邊境的納波-帕斯塔薩和聖地亞哥-薩莫拉區域一直髮生爭端，現在兩國部隊之間開始發生小規模衝突。由於最近在與哥倫比亞的邊界問題上達成了和解，秘魯士兵信心十足地向實力較弱的厄瓜多爾國家提出了自己的主張，小衝突現在已經升級為公開衝突。這將考驗該地區的穩定性，因為其他國家可能會試圖干預。"
 south_american_news.1.a: "南美會變成什麼樣子？"
 south_american_news.1.b: "這將標誌著秘魯國家的新時代！"
 south_american_news.1.c: "誓死堅守"
 south_american_events.1.t: "特拉舉行全國大選"
 south_american_events.1.desc: "儘管是一個牢牢掌控國家政治的獨裁者，但加布裡埃爾·特拉宣佈將再次舉行選舉。然而，許多人已經知道結果，因為紅黨不會放棄權力，而特拉的姐夫阿爾弗雷多·巴爾多米爾是黨內唯一真正的繼任者。儘管如此，人民還是要為烏拉圭的新未來投票。"
 south_american_events.1.a: "阿爾弗雷多·巴爾多米爾將接替特拉"
 south_american_events.1.b: "不知何故，民族黨佔了上風"
 south_american_events.1.c: "人民已經發聲了！"
 south_american_events.1.d: "我們有其他打算……"
 south_american_news.2.t: "烏拉圭的新總統"
 south_american_news.2.d: "烏拉圭總統加布裡埃爾·特拉上週宣佈，他將舉行選舉並引退。他曾在1933年通過一場政變延續了統治。權力將移交給特拉的妹夫，親盟軍的政治家阿爾弗雷多·巴爾多米爾·費拉里。"
 south_american_news.2.a: "很好"
 south_american_news.2.b: "我們會懷念他的"
 south_american_news.3.t: "烏拉圭的新總統"
 south_american_news.3.d: "烏拉圭總統加布裡埃爾·特拉上週宣佈，他將舉行選舉並引退。他曾在1933年通過一場政變延續了統治。權力將移交給烏拉圭民族黨領導人路易斯·阿爾貝托·德·埃雷拉。"
 south_american_news.3.a: "有意思"
 south_american_news.3.b: "這當然令人意外，但也是個驚喜"
 south_american_news.4.t: "烏拉圭人民革命"
 south_american_news.4.d: "烏拉圭總統加布裡埃爾·特拉上週宣佈，他將舉行選舉並引退。他曾在1933年通過一場政變延續了統治。然而他沒有預料到，受到大量支持的共產黨對由其任命的繼任者阿爾弗雷多·巴爾多米爾·費拉里所組建的新政府發動了政變。"
 south_american_news.4.a: "這就是人民的力量"
 south_american_news.4.b: "人民共和國萬歲！"
 south_american_news.5.t: "秘魯-玻利維亞邦聯已重生"
 south_american_news.5.d: "秘魯-玻利維亞邦聯歸來了，這是它在邦聯戰爭中分崩離析，並被認為再也無法重現於世後的首次迴歸。一些人聲稱，這只是掩蓋真正統治者帝國主義野心的幌子，但許多人希望，這個邦聯將能夠以一種前所未有的方式團結人民。然而，可以肯定的是，這一聯合將持續存在。"
 south_american_news.5.a: "這肯定會改變該區域的力量平衡"
 south_american_news.5.b: "我們再次團結在了一起！"
 south_american_news.6.t: "伊斯帕尼奧拉完成統一"
 south_american_news.6.d: "伊斯帕尼奧拉島的東部和西部歷史悠久且相似，不過自很久以前以來，它們就沒有統一過。然而，現在海地的所有地區和多米尼加共和國為了實現其島嶼繁榮的共同目標而聯合起來，成立了伊斯帕尼奧拉國。"
 south_american_news.6.a: "這對他們沒有好處"
 south_american_news.6.b: "伊斯帕尼奧拉萬歲！"
 south_american_events.2.t: "特化國家重炮領域"
 south_american_events.2.desc: "根據我們最近對重炮生產現代化的努力，我們的專家得出了一個結論。如果我們希望我們的生產線不變得效率極低，並且不損害我們國家的安全，我們就需要特化重武器領域。我們應該如何選擇呢？"
 south_american_events.2.a: "火炮顯然需要現代化"
 south_american_events.2.b: "我們需要能夠保護自己不受空中敵人的攻擊！"
 south_american_events.2.c: "我們需要能夠阻止坦克的前進"
 south_american_news.7.t: "圭亞那完成統一！"
 south_american_news.7.d: "圭亞那區域長期被佔領的殖民主義國家瓜分，它們佔領了卡宴、阿馬帕、蘇里南和兩個圭亞那等次級區域。但是，這個地區的人民現在已經團結起來進行反對帝國主義的共同鬥爭，並宣佈要消滅一切反對他們統一和獨立的人。"
 south_american_news.7.a: "有趣的時代"
 south_american_news.7.b: "我們終於擺脫了帝國主義的枷鎖！"
 south_american_events.10.t: "[FROM.GetName]宣佈擴張海軍"
 south_american_events.10.d: "隨著[FROM.GetAdjective]政府宣佈他們打算用更多的主力艦擴張艦隊，似乎這片大陸脆弱的力量平衡已經被打破。現在，我們必須決定如何應對我們咄咄逼人的鄰居再度構成的威脅。"
 south_american_events.10.a: "我們是不會被[FROM.GetAdjective]人打敗的！"
 south_american_news.10.t: "[FROM.GetName]觸發海軍軍備競賽"
 south_american_news.10.d: "雖然沒有正式條約阻止[BRA.GetAdjective]、[CHL.GetAdjective]或[ARG.GetAdjective]海軍的擴張，但自那次世界大戰以來，一直有一項非正式協議阻止了任何重大擴張。然而，隨著[FROM.GetAdjective]政府宣佈他們打算用更多的主力艦來擴大海軍實力，南美新的軍備競賽似乎是不可避免的。\n\n這對更廣泛的地緣政治局勢意味著什麼還有待觀察，但可以假設，各個列強的領導人也將密切關注局勢。"
 south_american_news.10.a: "這可能會破壞區域穩定"
 south_american_news.10.b: "這可能是我們在該地擴大影響力的機會"
 south_american_events.11.t: "軍事政變企圖"
 south_american_events.11.d: "雖然尤塞比奧·阿亞拉總統和他的得力助手何塞·費利克斯·埃斯蒂加里維亞一起帶領我們的國家在與玻利維亞的戰爭中取得了勝利，但他和他的政府對這場戰爭的發生負有很大的責任，而且全國各地都對他不滿。現在，許多軍官宣佈他們對自滿而軟弱的自由政府懷有敵意，費德里科·溫曼·史密斯中校和卡米爾多·雷卡爾德中校佔領了亞松森，並要求尤塞比奧·阿亞拉立即辭職！"
 south_american_events.11.a: "阿亞拉必須下臺，我們不能讓事態升級……"
 south_american_events.11.b: "讓他們為威脅我們的共和國付出代價！"
 higinio_and_estigarrabia_wont_cooperate: "§Y何塞·費利克斯·埃斯蒂加里維亞§!將軍與§Y伊希尼奧·莫里尼戈§!將軍§R不會§!與我們的新政府合作！"
 rafael_franco_is_exiled: "§Y拉斐爾·佛朗哥§!將軍將被流放"
 south_american_news.8.t: "二月革命"
 south_american_news.8.d: "根據佔領巴拉圭首都亞松森的軍官的要求，巴拉圭總統尤塞比奧·阿亞拉正式辭職，權力已移交給由拉斐爾·佛朗哥將軍領導的二月革命黨人。在與玻利維亞多年的戰爭之後，巴拉圭人民似乎已經厭倦了軟弱的政府，許多人走上街頭慶祝他們的新領導班子。"
 south_american_news.8.a: "他們還沒打夠嗎？"
 south_american_news.8.b: "我們現在可以自由地為美好的未來而奮鬥！"
 south_american_news.9.t: "巴拉圭軍官起義被鎮壓"
 south_american_news.9.d: "巴拉圭總統尤塞比奧·阿亞拉宣佈，他和由他的左膀右臂何塞·費利克斯·埃斯蒂加里維亞領導的共和國衛隊已經成功地鎮壓了一場叛亂和政變，政變是由支持革命革命主義者及其領導人拉斐爾·佛朗哥將軍的軍官發動的。然而，這個國家現在的狀況比幾個月前查科戰爭結束時還要糟糕，看起來這個國家離完全恢復還有很長的路要走。"
 south_american_news.9.a: "我想知道他們的人民對此作何感想？"
 south_american_news.9.b: "希望這是我們最後一次看到這些叛亂分子……"
 south_american_events.12.t: "格曼·佈施試圖推翻政府"
 south_american_events.12.d: "在該國迄今為止已知的最大罷工運動之後，年輕中校格曼·佈施領導的軍隊已經推翻了特哈達政府。他們聲稱，與特哈達不同，他們站在玻利維亞人民和統一社會主義黨和工會的社會主義理想一邊。我們能做些什麼來阻止他們嗎？考慮到查科戰爭的災難，現在已經太晚了嗎？"
 south_american_events.12.a: "特哈達·索爾薩諾不得不向公眾宣佈辭職"
 south_american_events.12.b: "馬上鎮壓他們的叛亂！"
 german_busch_and_gualberto_imprisoned: "§Y格曼·佈施§!將軍與§Y瓜爾韋托·比利亞羅埃爾·洛佩斯§!將軍被監禁"
 south_american_news.11.t: "1936年的玻利維亞社會主義革命"
 south_american_news.11.d: "在玻利維亞迄今為止已知的最大規模的罷工運動之後，年輕的中校格曼·佈施領導的軍隊推翻了何塞·路易斯·特哈達·索爾薩諾領導的真正的共和政府。他們聲稱，與特哈達不同，他們站在玻利維亞人民和社會主義理想的一邊，現在特哈達辭職，這些人已經完全控制了玻利維亞。"
 south_american_news.11.a: "軍事獨裁在什麼方面是社會主義的？"
 south_american_news.11.b: "我們將抓住這個機遇！"
 south_american_news.12.t: "玻利維亞的將領們發動政變失敗"
 south_american_news.12.d: "在玻利維亞迄今為止已知的最大規模的罷工運動之後，年輕的中校格曼·佈施領導的軍隊推翻了何塞·路易斯·特哈達·索爾薩諾領導的真正的共和政府。他們聲稱，與特哈達不同，他們站在玻利維亞人民和社會主義理想的一邊，但由於他們未能佔領拉巴斯，警察和剩餘的軍人追捕了他們的組織，並監禁了他們的領導人。"
 south_american_news.12.a: "我不會那麼做的"
 south_american_news.12.b: "我們制止了他們的暴動！"
 south_american_events.13.t: "奇廉大地震"
 south_american_events.13.d: "昨天23點32分，奇廉地下開始強烈震動，摧毀了大半個城市。23點35分，康塞普西翁遭到猛烈襲擊。幾乎所有的建築物都被完全摧毀了。據估計，這次地震的面波震級為8.3級，而最大麥卡利震級為10級，它造成約二萬八千人死亡，還有更多的人流離失所或受傷。對智利人民來說，今天是嚴酷的一天。"
 south_american_events.13.a: "我們需要幫助人民！"
 south_american_events.13.b: "我們有更大的問題"
 south_american_news.13.t: "奇廉地震之難"
 south_american_news.13.d: "一場麥加利烈度最高X度的8.3級地震使奇廉和康塞普西翁這兩座智利城市成為廢墟，死亡人數超過二萬八千人。重建和救援工作正在進行中，但許多人已經流離失所，該區域內的國家亦對如何妥善解決目前的問題躊躇未決。"
 south_american_news.13.a: "太可怕了"
 south_american_events.14.t: "1938年總統選舉"
 south_american_events.14.d: "總統選舉終於到來，阿圖羅·亞歷山德里總統的最後一個任期已經結束。這個國家仍然經歷著日益增長的不滿和激進主義，無論是右翼還是左翼，沒有人真正知道如何將這個國家從經濟災難中拯救出來的確切答案。誰應該接過亞歷山德里的衣缽，帶領這個國家走向未來？"
 south_american_events.14.a: "佩德羅·阿吉雷·塞爾達"
 south_american_events.14.b: "古斯塔沃·羅斯"
 south_american_events.14.c: "卡洛斯·伊瓦涅斯·德爾坎波"
 south_american_events.14.e: "埃利亞斯·拉斐特·加維尼奧"
 south_american_events.15.t: "軍隊起義"
 south_american_events.15.desc: "在拉斐爾·佛朗哥簽署了幾項行政命令，增加總統權力，並放棄位於國際承認屬於玻利維亞的北查科地區的前沿陣地後，部分軍隊開始反抗政府，並試圖推翻他。他們這樣做是正義的嗎？"
 south_american_events.15.a: "試圖阻止他們是沒有用的"
 south_american_events.15.b: "毀滅他們！"
 south_american_news.14.t: "伊希尼奧·莫里尼戈在巴拉圭掌權"
 south_american_news.14.desc: "由於對國家領導層的不滿日益增加，軍方採取了行動，任命伊希尼奧·莫里尼戈將軍為巴拉圭的新總統。他同情法西斯事業，很可能與阿根廷接觸，尋求相互保護和援助，這可能會反過來導致巴西試圖加強自己的聯盟，以在巴拉圭或阿根廷侵略時確保自己的安全。"
 south_american_news.14.a: "又一個法西斯的走狗"
 south_american_news.14.b: "我們的未來與德國人在一起"
 south_american_events.16.t: "海洋日慶典"
 south_american_events.16.desc: "濱海省自19世紀末南美太平洋戰爭中被智利佔領以來，每年都會舉行海洋日慶典，以紀念曾經與智利作戰的玻利維亞英雄。許多人認為這是一個機會，重申我們在戰後成為內陸國家時失去的進入太平洋的權利。我們應該允許人民進行這種抗議活動嗎？"
 south_american_events.16.a: "讓人們做他們想做的"
 south_american_events.16.b: "我們必須制止這種愚蠢行為"
 south_american_events.16.c: "他們說對了"
 south_american_events.17.t: "[PRU.GetNameDefCap]提出無條件和平以換取帕斯塔薩"
 south_american_events.17.desc: "[PRU.GetAdjective]外交官最近送來了一份意外的通報。通報中提出了一個有條件的和平提議，我們給他們帕斯塔薩，他們就從我們國家的其他地區撤軍。我們需要仔細考慮這個問題，是繼續為我們的土地戰鬥，還是實現和平，但要放棄我們的部分領土。"
 south_american_events.17.a: "我們國家需要和平！"
 south_american_events.17.b: "我們將為帕斯塔薩而戰！"
 south_american_events.18.t: "[ECU.GetNameDefCap]為了和平而割讓帕斯塔薩"
 south_american_events.18.desc: "令我們滿意的是，[ECU.GetNameDef]決定為了無條件和平而割讓帕斯塔薩。我們已經相對和平地吞併了這個州，開始了整合工作。這標誌著帕斯塔薩地區的新開始！"
 south_american_events.18.a: "終於！"
 south_american_events.19.t: "[ECU.GetNameDefCap]拒絕割讓領土"
 south_american_events.19.desc: "[ECU.GetNameDefCap]對我們的和平提議作出了負面回應。他們聲稱他們的領土完整不容置疑，儘管他們目前在戰爭中的表現堪憂，他們依然選擇繼續抵抗。他們讓我們別無選擇，只能繼續與他們作戰。"
 south_american_events.19.a: "真不幸……"
 south_american_events.20.t: "[PRU.GetNameDefCap]提議用洛雷托來換取和平"
 south_american_events.20.desc: "[PRU.GetAdjective]外交官最近送來了一份意外的通報。通報中提出了一個有條件的和平提議，他們給予我們洛雷托，我們就從他們國家的其他地區撤軍。我們需要仔細考慮這個問題，我們可以滿足於目前所擁有的，或者繼續戰鬥，以期獲得更多領土。"
 south_american_events.20.a: "公平的交易，他們已經吸取了教訓"
 south_american_events.20.b: "既然我們能得到他們更多的土地，憑什麼就此滿足？"
 south_american_events.21.t: "[ECU.GetNameDefCap]接受我方和平提議"
 south_american_events.21.desc: "[ECU.GetNameDefCap]對我們提出的無條件和平作出了積極回應。遺憾的是，這是以高昂的代價換來的，因為我們已經將洛雷托割讓給了[ECU.GetAdjective]政府。"
 south_american_events.21.a: "我們選擇了較小的惡"
 south_american_events.22.t: "[ECU.GetNameDefCap]拒絕我們的和平提議"
 south_american_events.22.desc: "[ECU.GetNameDefCap]對我們的白色和平提議作出了負面回應。就目前情況而言，[ECU.GetAdjective]人沒有停止戰鬥的理由。他們讓我們別無選擇，只能繼續與他們作戰。"
 south_american_events.22.a: "這並不理想……"
 south_american_events.30.t: "施壓孤立[FROM.GetNonIdeologyName]"
 south_american_events.30.desc: "隨著[FROM.GetAdjective]政府最近被共產主義勢力推翻，我國各地要求採取嚴厲回應措施的壓力越來越大。媒體充斥著關於紅色威脅和[FROM.GetNonIdeologyName]對我們利益構成威脅的誇張報道。與此同時，企業主們要求為他們在該國的投資損失進行報復。\n\n我們必須迅速行動，安撫公眾，並向[FROM.GetNonIdeologyName]發出明確信號，在我們這個半球不會容忍的共產主義。"
 south_american_events.30.a: "在經濟和外交上孤立他們"
 south_american_events.30.b: "斷絕外交關係"
 south_american_events.30.c: "我們有更緊迫的問題。"
 south_american_events.31.t: "[FROM.GetNameDefCap]試圖孤立[ROOT.GetNonIdeologyName]"
 south_american_events.31.desc.a: "[FROM.GetAdjective]外交官今天在發表了政府的嚴厲聲明後離開了[ROOT.Capital.GetCapitalVictoryPointName]的大使館。他們聲明，如果我們與其他國家發生衝突，他們將不再援助我們，也不承認我們為國家的合法政府。\n\n此外，他們實施了一項禁運，試圖削弱我們的經濟。儘管很明顯[FROM.GetNameDef]對我們的政權持敵對態度，但他們行動的迅速和強硬讓許多人感到震驚。"
 south_american_events.31.desc.b: "[FROM.GetAdjective]外交官今天在發表了政府的嚴厲聲明後離開了[ROOT.Capital.GetCapitalVictoryPointName]的大使館。他們聲明，如果我們與其他國家發生衝突，他們將不再援助我們，也不承認我們為國家的合法政府。\n\n儘管很明顯[FROM.GetNameDef]對我們的政權持敵對態度，但他們行動的迅速和強硬讓許多人感到震驚。"
 south_american_events.31.a: "傲慢的帝國主義者！"
 south_american_events.32.t: "在[FROM.GetNonIdeologyName]支持反共產主義者"
 south_american_events.32.desc: "隨著[FROM.GetNonIdeologyName]最近陷入內戰，我們的許多實業家和個人公民正在為[FROM.GetAdjective]政府籌集援助，以幫助其應對共產主義的威脅。\n\n軍隊中較為積極的反共產主義者現在建議我們利用這個機會武裝並派遣志願軍援助這場衝突，同時使政府能始終合理否認參與了此事。"
 south_american_events.32.a: "我們將對前往[FROM.GetNonIdeologyName]的裝備良好的志願軍視而不見"
 south_american_events.32.b: "我們不能干涉"
 south_american_events_32_tt: "由於我們的§Y$undisturbed_isolation$§!§R政策和世界緊張局勢門檻§!，§R我們將難以派遣志願軍！§!"
 south_american_events.50.t: "[FROM.FROM.GetNameDefCap]遭受攻擊"
 south_american_events.50.desc: "最近對[FROM.FROM.GetNameDef]的戰爭宣言正使我們對門羅主義的承諾受到質疑。儘管我們許多公民對被派去保衛[FROM.FROM.GetNonIdeologyName]的前景不感興趣，但我們的外交政策專家擔心，如果不採取行動保護他們，可能會導致外國勢力干涉我們半球的多米諾效應。"
 south_american_events.50.a: "要求停止對[FROM.FROM.GetNonIdeologyName]的敵對行動"
 south_american_events.50.b: "為什麼我們的士兵要為[FROM.FROM.GetNonIdeologyName]而死？"
 south_american_events_50_war_tt: "§R如果遭到拒絕，會導致與[FROM.GetName]開戰！§!"
 south_american_events.51.t: "[USA.GetNameDefCap]執行門羅主義"
 south_american_events.51.desc: "我們的外交官曾希望[USA.GetNameDef]對我們在美洲的活動視而不見，但看來我們沒有這麼好運。我們現在收到了來自[USA.Capital.GetCapitalVictoryPointName]的緊急通報，要求我們停止在這個半球上的所有敵對活動，否則將被他們視為對[USA.GetNameDef]的戰爭行為。如果我們想避免這場衝突進一步升級，我們將不得不小心行事。"
 south_american_events.51.a: "我們不想與[USA.GetNameDef]發生衝突"
 south_american_events.51.b: "這與他們無關，他們只是虛張聲勢"
 south_american_events.52.t: "[FROM.GetNameDefCap]同意停止敵對行動"
 south_american_events.52.desc: "[FROM.GetAdjective]外交官通知我們，他們準備暫時停止在西半球的敵對行動，並回歸到外交手段解決問題。這種斡旋後的和平是否能持續下去，還有待觀察。"
 south_american_events.52.a: "世界上其他國家將會三思而後行，不會輕易入侵我們的後院"
 south_american_events.52.b: "感謝山姆大叔"
 south_american_events.53.t: "[FROM.GetNameDefCap]拒絕停止敵對行動"
 south_american_events.53.desc: "[FROM.GetAdjective]外交官通知我們，[USA.GetNameDef]無權干涉他們政府所謂的合法怨憤。因此，他們聲明只要他們認為有必要，就會繼續在西半球為自己的利益行事。"
 south_american_events.53.a: "那麼只能開戰了……"
 south_american_events.54.t: "[FROM.GetNameDefCap]執行門羅主義"
 south_american_events.54.desc: "我們收到了來自[FROM.Capital.GetCapitalVictoryPointName]的緊急通報，稱他們不會允許對我們進行的侵略行為，並且他們正在與我們的敵人進行談判以結束敵對行動。如果他們未能做到，他們發誓將會來保衛我們。"
 south_american_events.54.a: "好極了！"
 south_american_events.55.t: "[FROM.GetNameDefCap]忽視衝突"
 south_american_events.55.desc: "由於該區域最近的敵對行動，[FROM.GetNameDefCap]駐[ROOT.Capital.GetCapitalVictoryPointName]大使館今天早些時候被疏散。來自大使館的外交官通知我們，他們的政府不願捲入另一場境外戰爭。"
 south_american_events.55.a: "那麼我們只能靠自己了……"
 south_american_news.60.t: "[BRA.GetAdjective]軍方發動政變"
 south_american_news.60.desc: "儘管總統$BRA_getulio_vargas$試圖爭取軍方各派系和整合主義運動的支持，但前者對困境中的總統的改革步伐的失去了耐心，並已經自行採取行動。在一次迅速的軍事行動中，全國主要基礎設施和通訊設施被控制，部隊衝入里約熱內盧的卡特泰宮，抓捕了$BRA_getulio_vargas$。\n\n雖然在軍事統治下國家的日常政治將發生什麼變化還有待觀察，但可以肯定的一點是，新政府將對人民中的任何共產主義異見採取強硬立場。"
 south_american_news.60.a: "巴西會得到和平嗎？"
 #### Chile #####
 CHL_political_events.1.t: "[CHL.GetNameDefCap]提議一同加盟"
 CHL_political_events.1.desc: "[CHL.GetNameDef]的[CHL.GetLeader]提議一同申請加入同盟國，這樣可以保護我們的水域和土地，同時又不撕裂我們彼此的親密盟友關係，或破壞我們兩國之間的相互關係。接受他們的要求也許是明智的選擇。"
 CHL_political_events.1.a: "我們看不出這有什麼害處"
 CHL_political_events.1.b: "他們瘋了嗎？！"
 CHL_political_events.2.t: "阿根廷-智利聯合申請"
 CHL_political_events.2.desc: "南美國家智利和阿根廷向我們提出聯合申請，要求加入我們的陣營。他們聲明他們希望幫助我們，同時保護他們自己的利益。我們如何回應？"
 CHL_political_events.2.a: "這裡歡迎他們"
 CHL_political_events.2.b: "我們反對！"
 CHL_political_events.3.t: "[ARG.GetName]拒絕我們的請求"
 CHL_political_events.3.desc: "邪惡的[ARG.GetLeader]拒絕了與我們一同向同盟國提出聯合申請的公正合理的請求，是時候讓他意識到他失去了什麼。無論如何，我們靠自己變得更強大，從一開始就不需要他們……"
 CHL_political_events.3.a: "那麼他們無疑是我們的敵人"
 CHL_political_events.4.t: "[CHL.GetName]開始佔領[953.GetName]"
 CHL_political_events.4.desc: "[CHL.GetAdjective]軍隊已經開始越過之前在[953.GetName]建立的邊界，他們的空軍和海軍已經出動。他們似乎是認真的想要控制這個有爭議的島嶼，事已至此，目前還不清楚我們是否可以通過調解來阻止他們。我們應該採取什麼行動？"
 CHL_political_events.4.a: "和他們打仗是沒有意義的"
 CHL_political_events.4.b: "有膽量就過來！"
 CHL_political_events.5.t: "[ARG.GetName]撤出[953.GetName]"
 CHL_political_events.5.desc: "[ARG.GetName]認為，面對我們的軍事力量，堅守[953.GetName]是不值得承受的痛苦，他們已經從該省撤軍。這使有爭議的地區第一次掌握在我們手中，整合運動可以立即開始。"
 CHL_political_events.5.a: "今天是智利人民的勝利！"
 CHL_political_events.6.t: "[ARG.GetName]拒絕撤出[953.GetName]"
 CHL_political_events.6.desc: "[ARG.GetName]仍然堅持其擁有這個有爭議島嶼的立場，並聲稱如果我們想要它，就必須用武力奪取它。我們的人民為這一事業團結起來，政治家們也開始大聲疾呼，要求阿根廷國家解體。"
 CHL_political_events.6.a: "我們現在不能打退堂鼓"
 CHL_political_events.7.t: "軍隊中反社會主義的抱怨"
 CHL_political_events.7.d: "我們注意到，軍隊中有一些人玷汙了軍隊始終保持非政治性的名聲，他們公開批評人民選擇的總統，並明確指出社會主義本質上是邪惡的。這些人顯然是在妄想，但如果我們希望又一場政變只是一場噩夢，我們必須保持警惕。"
 CHL_political_events.7.a: "這不是好兆頭"
 CHL_political_events.8.t: "阿里奧斯托的叛亂"
 CHL_political_events.8.d: "今天早些時候，阿里奧斯托·埃雷拉將軍領導的塔克納炮兵團發生了一次短暫的叛亂。眾所周知，埃雷拉是前總統卡洛斯·伊瓦涅斯·德爾坎波的支持者，他似乎深受他在意大利擔任武官的影響。1939年5月21日，當埃雷拉將軍到達總統府參加一個儀式時，他看到一個陽臺上掛著一面紅旗，他突然衝動地抓住它並把它撕下來，這是他第一次受到真正的懷疑。然而，儘管如此，他沒有得到廣泛的支持，一切又恢復了正常。"
 CHL_political_events.8.a: "至少秩序已經恢復"
 CHL_political_events.9.t: "托爾滕號蒸汽船的沉沒"
 CHL_political_events.9.d: "昨天，托爾滕號蒸汽船在新澤西州巴尼加特鎮的外海航行時，被一艘德國潛艇發射的魚雷擊中。這艘貨船是從丹麥購買的，但所有27名船員都是智利人，其中只有一人倖存。我們的外交部長表示，他不希望與德國外長對話，聖地亞哥的人民正在街頭舉行反德抗議活動。我們如何應對這種情況？"
 CHL_political_events.9.a: "譴責他們的行為"
 CHL_political_events.9.b: "要求賠償"
 CHL_political_events.9.c: "這意味著戰爭！"
 CHL_sunk_the_tolten: "托爾滕號蒸汽船被擊沉"
 CHL_political_events.10.t: "[CHL.GetName]就托爾滕號蒸汽船要求索賠"
 CHL_political_events.10.desc: "[CHL.GetAdjective]領導人[CHL.GetLeader]要求我們就上週智利貨船托爾滕號蒸汽船沉沒一事道歉並作出賠償。他表示，我們有責任遵守國際標準，並對我們潛艇戰的不雅行為進行反思。"
 CHL_political_events.10.a: "如果他們想要賠償，那麼就給他們吧"
 CHL_political_events.10.b: "我們不會向他們那樣的弱者屈服"
 CHL_political_events.11.t: "[GER.GetName]給予我們賠償"
 CHL_political_events.11.desc: "[GER.GetLeader]已經正式道歉，雖然出乎意料，但他們甚至還同意為這艘船以及智利在托爾滕號事件中喪生的人員提供經濟賠償。"
 CHL_political_events.11.a: "也許他們終究是明事理的。"
 CHL_political_events.12.t: "[GER.GetName]拒絕賠償我們"
 CHL_political_events.12.desc: "[GER.GetLeader]繼續他們慣常的長篇大論，聲稱智利政府意志薄弱，脆弱，沒有必要為一個幾乎沒有內在價值的國家提供賠償。我們目前還沒有能力反駁這些說法，而加劇談話矛盾則不太理智……"
 CHL_political_events.12.a: "好吧，事情就是這樣"
 CHL_political_events.13.t: "塞古羅·奧夫雷羅大屠殺"
 CHL_political_events.13.desc: "智利民族社會主義運動曾試圖發動政變，但沒有成功。在被佔領的智利大學外的槍戰和對峙中，智利卡賓槍騎兵以有限的傷亡鎮壓了他們的叛亂。奧斯卡·諾沃亞·富恩特斯和溫貝托·阿里亞加達·巴爾迪維索在戰鬥中指揮了我們的部隊，他們將得到充分的獎勵。"
 CHL_political_events.13.a: "他們不應該再打擾我們了"
 CHL_political_events.14.t: "民族社會主義叛亂"
 CHL_political_events.14.desc: "智利民族社會主義運動曾試圖發動政變，但沒有成功。當他們被趕出首都時，他們利用自己的廣泛聲望向我們的政權宣戰，如此我們需要處理一場內戰，儘管它的規模沒有一些人擔心的那麼大。"
 CHL_political_events.14.a: "準備戰鬥，甚至向你最好的朋友開槍！"
 CHL_political_events.15.t: "塞古羅·奧夫雷羅戰役"
 CHL_political_events.15.desc: "智利民族社會主義運動曾試圖發動政變，但沒有成功。智利卡賓槍騎兵鎮壓了他們的叛亂，但是民族社會主義分子佔領智利大學後，在一場爭奪該校場地的大規模戰鬥中傷亡慘重。他們現在已經撤退了，但不確定他們以後是否會再次嘗試這樣的事情。"
 CHL_political_events.15.a: "好險啊……"
 nacista_coup_attempt_happened: "民族社會主義政變已經發生"
 CHL_political_events.16.t: "1942年總統選舉"
 CHL_political_events.16.d: "總統選舉再次到來，[ROOT.GetLeader]的任期也隨之結束。大多數危機現在已經解決了，但全球都在打仗，無處穩定。誰應該接過亞歷山德里的重任，帶領這個國家走向美好的未來？"
 CHL_political_events.16.a: "胡安·安東尼奧·里奧斯"
 CHL_political_events.16.b: "愛德華多·克魯斯·科克"
 CHL_political_events.16.c: "卡洛斯·伊瓦涅斯·德爾坎波"
 CHL_political_events.16.e: "埃利亞斯·拉斐特·加維尼奧"
 CHL_political_events.17.t: "1946年總統選舉"
 CHL_political_events.17.desc: "總統選舉再次到來，[ROOT.GetLeader]的任期也隨之結束。全球衝突即將結束，但尚未終止。目前每個人心中的問題是：誰應該接過亞歷山德里的下一個任期，在這個令人膽寒的時代領導這個國家？"
 CHL_political_events.17.a: "加夫列爾·岡薩雷斯·魏地拉"
 CHL_political_events.17.b: "愛德華多·克魯斯·科克"
 CHL_political_events.17.c: "費爾南多·亞歷山德里"
 CHL_political_events.17.e: "馬馬杜克·格羅韋·巴列霍"
 CHL_political_events.18.t: "挑選新的陸軍總司令"
 CHL_political_events.18.desc: "我們的軍隊中有許多人願意承擔起領導的責任，也有許多人準備好並願意為我們的國家戰鬥到最後一口氣。現在有了新總統，我們現在需要選擇奧斯卡·諾沃亞·富恩特斯的繼任者，他在這個職位上已經有五年了。誰將作為統帥領導我們的軍隊？"
 CHL_political_events.18.a: "卡洛斯·富恩特斯·拉貝"
 CHL_political_events.18.b: "埃斯庫德羅·奧斯卡·奧塔羅拉"
 CHL_political_events.18.c: "吉列爾莫·巴里奧斯·蒂拉多"
 CHL_political_events.18.d: "阿爾弗雷多·波塔萊斯·莫爾格斯"
 CHL_political_events.19.t: "風雲變幻"
 CHL_political_events.19.desc: "遭到全國範圍的批評之後，阿圖羅·亞歷山德里辭職並要求提前舉行選舉，這一次，隨著人們聚集在投票站周圍，似乎風向對左翼有利。誰將要領導國家，這次事件又將如何塑造新共和國？"
 CHL_political_events.19.a: "埃利亞斯·拉斐特·加維尼奧將領導新共和國"
 CHL_political_events.19.b: "佩德羅·阿吉雷·塞爾達是人民的最愛"
 CHL_wont_becocme_communist_tt: "你將§R無法§!通過§Y增加總統權力§!國策轉為共產主義。"
 CHL_can_becocme_communist_tt: "你§G可以§!通過§Y增加總統權力§!國策轉為共產主義。"
 CHL_political_events.20.t: "聖地亞哥會議"
 CHL_political_events.20.desc: "共產黨今天召開會議，唯一的目的是決定國家在未來幾年必須走的道路，並選出將幫助國家走向進步的人，因為目前迎合各種觀點的“大帳篷”聯盟無法在所有問題上達成完全一致，需要有人採取行動並提供指導。它目前處於這些人之間：馬克思主義者埃利亞斯·拉菲爾特·加維諾、社會主義者馬馬杜克·格羅夫·巴列霍、斯大林主義者卡洛斯·孔特雷拉斯·拉巴爾卡和托洛茨基主義者曼努埃爾·伊達爾戈·普拉薩。"
 CHL_political_events.20.a: "埃利亞斯·拉斐特·加維尼奧"
 CHL_political_events.20.b: "馬馬杜克·格羅韋·巴列霍"
 CHL_political_events.20.c: "卡洛斯·孔特雷拉斯·拉瓦爾卡"
 CHL_political_events.20.d: "曼努埃爾·伊達爾戈·普拉薩"
 CHL_political_events.21.t: "[PRU.GetName]進入帕斯塔薩"
 CHL_political_events.21.desc: "[PRU.GetNameDef]軍隊昨天開始進入不屬於他們的納波-帕斯塔薩地區。太平洋戰爭結束後，我們最近不得不放棄塔克納，並將其交還給秘魯，作為協議的一部分，但由於他們不尊重國際邊界，所以我們不必這樣做。"
 CHL_political_events.21.a: "我們應強調對塔克納的主權要求"
 CHL_political_events.21.b: "不值得去激怒他們"
 CHL_political_events.22.t: "[CHL.GetNameDefCap]希望加入我們的陣營"
 CHL_political_events.22.desc: "[CHL.GetLeader]找到我們希望我們能允許[CHL.GetNameDef]加入我們的陣營，這樣我們就能就像戰友一樣，以世界革命的名義一起鬥爭。我們如何回應？"
 CHL_political_events.22.a: "我們歡迎我們的新同志"
 CHL_political_events.22.b: "我們為什麼要關心南美？"
 CHL_political_events.23.t: "蘇聯允許我們加入"
 CHL_political_events.23.desc: "[SOV.GetLeader]今天向政治局宣佈，蘇聯與[CHL.GetNameDef]建立了盟友關係並與南美有了聯繫，必要時還可以作為對抗美國人的臨時基地。如此，我們成為了他們陣營的一員，我們一定會共同繁榮。"
 CHL_political_events.23.a: "團結使我們更強大"
 CHL_political_events.24.t: "蘇聯拒絕我們加入"
 CHL_political_events.24.desc: "[SOV.GetLeader]今天向政治局宣佈，蘇聯拒絕了我們加入他們陣營的請求，稱這將威脅到全球安全，並以不利的方式打破他們與敵人之間的平衡。"
 CHL_political_events.24.a: "我們被耍了，被背後捅了一刀，很可能還被哄騙了……"
 CHL_political_events.25.t: "[CHL.GetName]建議我們與他們成為一體"
 CHL_political_events.25.desc: "[CHL.GetLeader]與我們進行接洽，要求我們加入他們，成為一體，以建立西班牙裔工人共和國。他說，如果我們想要反對外國帝國主義列強，我們就必須聯合起來。"
 CHL_political_events.25.a: "我們必須加入他們！"
 CHL_political_events.25.b: "必須加強合作"
 CHL_political_events.25.c: "我們不需要他們"
 CHL_we_will_be_annexed_tt: "我們將被§Y[CHL.GetNameDef]§!§R吞併§!"
 CHL_we_will_be_puppeted_tt: "我們將成為§Y[CHL.GetNameDef]§!的§R傀儡國§!"
 CHL_political_events.26.t: "[FROM.GetName]接受被兼併"
 CHL_political_events.26.desc: "[FROM.GetNameDef]的[FROM.GetLeader]已經決定接受我們的兼併提議，他們的國家隨後將成為我們不可分割的一部分。革命萬歲！"
 CHL_political_events.26.a: "完美"
 CHL_political_events.27.t: "[FROM.GetName]接受被主導"
 CHL_political_events.27.desc: "[FROM.GetNameDef]的[FROM.GetLeader]已決定接受被我們主導的提議，他們的國家隨後將成為我們牢不可破的夥伴。革命萬歲！"
 CHL_political_events.27.a: "好極了"
 CHL_political_events.28.t: "[FROM.GetName]打算反對我們"
 CHL_political_events.28.desc: "[FROM.GetNameDef]的[FROM.GetLeader]決定拒絕我們的兼併提議。我們該怎麼處理他們？"
 CHL_political_events.28.a: "我們要摧毀他們！"
 CHL_political_events.28.b: "我們稍後再處理他們"
 CHL_political_events.29.t: "智利法西斯分子需要我們的支持"
 CHL_political_events.29.desc: "屬於智利政黨民族社會主義運動的法西斯分子與我們接觸，告訴我們他們計劃對智利現政府發動政變。他們要求我們以人員、設備和政治援助的形式支持這一努力。我們應該幫助他們嗎？"
 CHL_political_events.29.a: "我們必須幫助他們"
 CHL_political_events.29.b: "他們不需要我們的幫助"
 CHL_political_events.30.t: "[FROM.GetName]將幫助我們"
 CHL_political_events.30.desc: "[FROM.GetNameDef]的[FROM.GetLeader]承諾會幫助我們推翻現政府，建立一個可以對抗美國的獨裁政權。"
 CHL_political_events.30.a: "完美"
 CHL_political_events.31.t: "[FROM.GetName]決定不幫助我們"
 CHL_political_events.31.desc: "[FROM.GetNameDef]的[FROM.GetLeader]拒絕援助我們去推翻現政府以建立一個可以對抗美國的獨裁政權。"
 CHL_political_events.31.a: "我們被背叛了"
 CHL_political_events.32.t: "[CHL.GetName]希望加入軸心國"
 CHL_political_events.32.desc: "[CHL.GetNameDef]的[CHL.GetLeader]來找我們，要求加入我們的陣營。他聲稱我們在一起會更強大，我們將能夠在他們的幫助下推翻美國的霸權。"
 CHL_political_events.32.a: "我們同意"
 CHL_political_events.32.b: "沒有他們，我們更強大"
 CHL_political_events.33.t: "[GER.GetLeader]接受我方請求"
 CHL_political_events.33.desc: "[GER.GetNameDef]的[GER.GetLeader]已經宣佈，從今天起，[CHL.GetNameDef]將是他們的重要盟友，可以幫助他們獲得對美洲的完全控制。他說，今天標誌著美洲民主制度開始走向終結，而今天，是光榮的一天。"
 CHL_political_events.33.a: "確實是偉大的一天！"
 CHL_political_events.34.t: "[GER.GetLeader]拒絕我方請求"
 CHL_political_events.34.desc: "[GER.GetNameDef]的[GER.GetLeader]宣佈我們不被允許加入他們的陣營，因為我們不是他們為這個世界的未來所制定的計劃的一部分。他們到底在計劃什麼？"
 CHL_political_events.34.a: "他們會後悔的……"
 CHL_political_events.35.t: "[CHL.GetNameDefCap]邀請我們加入西班牙裔聯盟"
 CHL_political_events.35.desc: "[CHL.GetNameDef]的[CHL.GetLeader]主動與我們商談，邀請我們加入他們的新陣營，西班牙裔聯盟。我們如何回應？"
 CHL_political_events.35.a: "我們將一起贏得勝利"
 CHL_political_events.35.b: "未來只屬於我們"
 CHL_political_events.36.t: "[FROM.GetNameDefCap]加入西班牙裔聯盟"
 CHL_political_events.36.desc: "[FROM.GetNameDef]的[FROM.GetLeader]殷勤地決定接受我們的建議，讓他們加入我們的陣營，現在我們一起創造了歷史。"
 CHL_political_events.36.a: "前途一片光明"
 CHL_political_events.37.t: "[FROM.GetNameDef]拒絕加入西班牙裔聯盟"
 CHL_political_events.37.desc: "[FROM.GetNameDef]的[FROM.GetLeader]愚蠢地拒絕了我們讓他們加入我們的西班牙裔聯盟的提議。神在未來會審判他們的。"
 CHL_political_events.37.a: "難道他們不怕我們嗎？"
 CHL_political_events.38.t: "[CHL.GetName]邀請我們加入[GER.GetAdjective]的陣營"
 CHL_political_events.38.desc: "[CHL.GetLeader]邀請我們加入他們，成為[GET.GetNameDef]陣營的一員，以阻止美國干涉西班牙裔國家的事務。他們聲稱，儘管我們更弱、更分裂，但只要我們共同努力，我們就能打敗美國。"
 CHL_political_events.38.a: "團結起來，我們可以打倒美國！"
 CHL_political_events.38.b: "這太冒險了……"
 CHL_political_events.39.t: "[FROM.GetName]加入我們的陣營！"
 CHL_political_events.39.desc: "[FROM.GetNameDef]的[FROM.GetLeader]是一個通情達理的人，他認為同我們合作是最明智的。他已經簽署了我們提出的所有文件，現在將協助保衛我們的半球。"
 CHL_political_events.39.a: "我們將保衛我們的大陸！"
 CHL_political_events.40.t: "[FROM.GetName]決定不加入我們的陣營"
 CHL_political_events.40.desc: "[FROM.GetNameDef]的[FROM.GetLeader]是一個愚蠢的人，他斷定他寧願遭受美帝國主義的壓迫，也不願冒著與他們開戰的危險。然而，對於他們擺明了的立場，我們無能為力，所以我們需要把這個問題留在那裡。"
 CHL_political_events.40.a: "好吧……"
 CHL_political_events.41.t: "[CHL.GetName]要求我們臣服於[GER.GetNameDef]"
 CHL_political_events.41.desc: "[CHL.GetLeader]和[GER.GetLeader]聯合要求烏拉圭臣服於他們。他們似乎在要求我們成為[GER.GetAdjective]的保護國。我們會屈服於他們的壓力嗎？"
 CHL_political_events.41.a: "我們別無選擇"
 CHL_political_events.41.b: "我們必須抵抗法西斯分子！"
 CHL_political_events.42.t: "[URG.GetName]拱手臣服於[GER.GetNameDef]"
 CHL_political_events.42.desc: "[URG.GetLeader]今天正式宣佈辭去[URG.GetNameDef]總統一職，並將權力移交給[GER.GetAdjective]人支持的阿努爾夫·富爾曼。"
 CHL_political_events.42.a: "好極了"
 CHL_political_events.43.t: "[URG.GetName]向我們屈服"
 CHL_political_events.43.desc: "由於[CHL.GetAdjective]政府施加的壓力，[URG.GetNameDef]被迫按照早些年制定的秘密殖民計劃向我們屈服。這將有助於擴大我們在美洲的影響力，並有助於我們不讓美國插手南美。"
 CHL_political_events.43.a: "太棒了"
 CHL_political_events.44.t: "[URG.GetName]拒絕屈服"
 CHL_political_events.44.desc: "愚蠢的[URG.GetLeader]決定站起來反對[CHL.GetAdjective]和[GER.GetAdjective]的思想家和政治家所設想的世界新秩序。他看不到潮水的翻滾，而等海浪撞擊海岸時他也早已離席。"
 CHL_political_events.44.a: "大膽！"
 CHL_political_events.45.t: "我們的[CHL.GetNameDef]兄弟邀請我們加入軸心國"
 CHL_political_events.45.desc: "[CHL.GetAdjective]人是我們在南美洲的西班牙裔和拉丁裔兄弟，他們要求我們加入他們與[GER.GetNameDef]的陣營，以便適當地帶來一個新的世界秩序，同時儘可能地保護我們自己的利益。我們如何回應？"
 CHL_political_events.45.a: "我們很樂意"
 CHL_political_events.45.b: "我們另有打算"
 CHL_political_events.46.t: "[FROM.GetName]加入軸心國"
 CHL_political_events.46.desc: "[FROM.GetNameDef]的[FROM.GetLeader]決定接受我們的建議，加入我們與[GER.GetNameDef]的聯盟。我們失散多年的兄弟終於團聚了，但這次是在更加平等和公正的條約下！"
 CHL_political_events.46.a: "太好了"
 CHL_political_events.47.t: "[CHL.GetName]想邀請[FROM.GetName]加入軸心國"
 CHL_political_events.47.desc: "[CHL.GetName]已經與[FROM.GetName]達成了協議。他們已經使[FROM.GetName]相信，只有軸心國才有未來。我們只需要將他們的接受的內容簽字蓋章。"
 CHL_political_events.47.a: "簽字並蓋章"
 CHL_political_events.47.b: "目前不行。"
 #CHL_political_events.98.t: "[FROM.GetName] joins the Axis"
 #CHL_political_events.98.desc: "Thanks to a proposal handed over by their Hispanic brothers in [CHL.GetNameDef], [FROM.GetLeader] of [FROM.GetNameDef] has decided to join our faction to help us make a stronger future, and fight against our every enemy. We are stronger together!"
 #CHL_political_events.98.a: "Sehr Gut"
 CHL_political_events.48.t: "[FROM.GetName]不加入軸心國"
 CHL_political_events.48.desc: "可悲的是，儘管我們向他們真摯地呼籲，[FROM.GetLeader]和他們的人民還是認定沒有我們他們會過得更好，並且沒有詳細說明他們為什麼會做出這個決定。我們暫時不會與[FROM,GetNameDef]聯合。"
 CHL_political_events.48.a: "那我們就只能自己單幹了"
 CHL_political_events.49.t: "[CHL.GetNameDefCap]邀請我們加入西班牙裔聯盟"
 CHL_political_events.49.desc: "[CHL.GetNameDef]的[CHL.GetLeader]主動與我們商談，邀請我們加入他們的新陣營，西班牙裔聯盟。我們如何回應？"
 CHL_political_events.49.a: "我們將一起爭取勝利"
 CHL_political_events.49.b: "未來只屬於我們"
 CHL_political_events.50.t: "[FROM.GetNameDefCap]加入西班牙裔聯盟"
 CHL_political_events.50.desc: "[FROM.GetNameDef]的[FROM.GetLeader]殷勤地決定接受我們的建議，讓他們加入我們的陣營，現在我們一起創造了歷史。"
 CHL_political_events.50.a: "太好了"
 CHL_political_events.51.t: "[FROM.GetNameDefCap]拒絕加入西班牙裔聯盟"
 CHL_political_events.51.desc: "[FROM.GetNameDef]的[FROM.GetLeader]愚蠢地拒絕了我們讓他們加入我們的西班牙裔聯盟的提議。神在未來會審判他們的。"
 CHL_political_events.51.a: "難道他們不怕我們嗎？"
 CHL_political_events.52.t: "[CHL.GetName]要求我們移交[947.GetName]"
 CHL_political_events.52.desc: "在最近我們邊境的大規模動員和[CHL.GetAdjective]人民長達一週的抗議之後，[CHL.GetLeader]宣佈現在是[CHL.GetNameDef]重新控制[947.GetName]領土的時候了，他們曾經簽署了利馬條約，而他們現在聲稱這是不公正和無效的。"
 CHL_political_events.52.a: "我們不想再冒戰爭的風險"
 CHL_political_events.52.b: "這是我們奪回阿里卡的機會！"
 CHL_political_events.53.t: "[FROM.GetName]接受我們的要求"
 CHL_political_events.53.desc: "我們都知道，[FROM.GetNameDef]現任政府很軟弱。很明顯，他們無法與我們作戰，他們自己也很清楚這一點。因此，從今天起，他們簽署了一項新的協議，正式將[947.GetName]的政府部門移交給我們！"
 CHL_political_events.53.a: "我們的疆土擴張了"
 CHL_political_events.54.t: "[FROM.GetName]拒絕我們的要求"
 CHL_political_events.54.desc: "[FROM.GetAdjective]政府頑固地堅持虛假的利馬條約，拒絕把[947.GetName]移交給我們。我們必須訴諸武力，不惜一切手段從他們手中奪取該地區……"
 CHL_political_events.54.a: "我們要讓他們為他們的傲慢付出代價！"
 CHL_political_events.55.t: "[CHL.GetName]要求我們移交[953.GetName]"
 CHL_political_events.55.desc: "在最近我們邊境的大規模動員和[CHL.GetAdjective]人民長達一週的抗議活動之後，[CHL.GetLeader]宣佈，現在是[CHL.GetNameDef]佔領[953.GetName]的時候了。我們應該反抗他們嗎？"
 CHL_political_events.55.a: "我們不想冒險與他們開戰"
 CHL_political_events.55.b: "我們要再說多少遍？"
 CHL_political_events.56.t: "[FROM.GetName]對我們的要求讓步"
 CHL_political_events.56.desc: "[ARG.GetNameDef]政府做出了通情達理的決定，以優雅的風度將它移交給了我們。現在是時候繼續努力，堅持我們的主張，直到我們能夠建立一個[CHL.GetAdjective]人的完美國家。"
 CHL_political_events.56.a: "今天我們歡迎八萬名新智利人"
 CHL_political_events.57.t: "[FROM.GetName]拒絕我們的要求"
 CHL_political_events.57.desc: "[ARG.GetNameDef]的[ARG.GetLeader]認為反抗我們是明智之舉，所以我們必須讓他知道他惹錯了人。前進吧，智利的男人和女人！"
 CHL_political_events.57.a: "那我們必須用武力奪取"
 CHL_political_events.58.t: "我們的軍隊在德爾德謝爾托湖附近交火"
 CHL_political_events.58.desc: "據報，我們的軍隊與[CHL.GetAdjective]軍隊在聖克魯斯的德爾德謝爾托湖附近發生了衝突。他們說，[CHL.GetAdjective]軍隊正越來越向東移動，似乎企圖佔領整個省份。"
 CHL_political_events.58.a: "撤退，不值得為此開戰"
 CHL_political_events.58.b: "戰士們，堅守陣地！"
 CHL_political_events.59.t: "[FROM.GetName]撤出[954.GetName]"
 CHL_political_events.59.desc: "怯懦的[ARG.GetAdjective]軍隊在受到我國邊防警衛的挑釁後撤退，我國士兵已開始進入近乎被遺棄的聖克魯斯省。我們在每一條戰線上都取得了勝利，我們需要祈禱在不久的將來一切都不會崩潰。"
 CHL_political_events.59.a: "我們離最終目標又近了一步"
 CHL_political_events.60.t: "[FROM.GetName]堅守陣地"
 CHL_political_events.60.desc: "勇敢但愚蠢的[ARG.GetAdjective]軍隊決定在德爾德謝爾托湖周圍堅守陣地。我們的部隊仍在向他們射擊，但正在等待下一步行動的命令。"
 CHL_political_events.60.a: "挺進並佔領該地區"
 CHL_political_events.60.b: "以後再說"
 CHL_political_events.61.t: "[CHL.GetName]要求巴塔哥尼亞去軍事化"
 CHL_political_events.61.desc: "[CHL.GetNameDef]的[CHL.GetLeader]宣佈，我們威脅[CHL.GetAdjective]人民的安全太久了，現在是結束這種事情的時候了，並聲稱我們有必要更進一步，使巴塔哥尼亞地區非軍事化。我們該如何應對呢？"
 CHL_political_events.61.a: "這是明智的做法"
 CHL_political_events.61.b: "我們為什麼要這麼做呢？"
 CHL_political_events.62.t: "[FROM.GetName]使巴塔哥尼亞去軍事化"
 CHL_political_events.62.desc: "[FROM.GetAdjective]政府已經屈服於我們的要求，將巴塔哥尼亞非軍事化並承諾不再傷害我們的人民。他們仍然不明白我們為什麼提出這些要求。"
 CHL_political_events.62.a: "他們毫無遠見"
 CHL_political_events.63.t: "[FROM.GetName]不使巴塔哥尼亞去軍事化"
 CHL_political_events.63.desc: "[FROM.GetLeader]譴責了我們明顯的挑釁行為，並表示很容易看出，我們採取這些行動的目的是在他們放鬆警惕時迅速而輕鬆地發起閃電戰。然而，我們並不需要在這種情況下才能獲勝。"
 CHL_political_events.63.a: "它不會阻礙我們的推進"
 CHL_political_events.64.t: "[From.GetAdjective]佔領巴拿馬運河"
 CHL_political_events.64.desc: "[FROM.GetNameDef]的獨裁者[From.GetLeader]竟然膽敢從附近的集結地對我們巴拿馬運河部隊發動大規模攻擊。他們的行動取得了成功，我們的部隊正在混亂中撤退。[FROM.GetAdjective]人沒有越境進入我們的其他領土，所以這不是全面入侵的前奏，但這次襲擊削弱了我們在全球範圍內投送兵力的能力，在國際舞臺上羞辱了我們。"
 CHL_political_events.64.a: "不幸的是，我們有更緊迫的問題，禁運應該就足夠了"
 CHL_political_events.64.b: "我們的主權受到了威脅，這需要軍事回應"
 CHL_political_events.65.t: "[From.GetAdjective]佔領[311.GetName]"
 CHL_political_events.65.desc: "[FROM.GetNameDef]的獨裁者[From.GetLeader]竟敢從附近的集結地對我們的[311.GetName]部隊發動大規模攻擊。他們的行動取得了成功，我們的部隊正在混亂中撤退。[FROM.GetAdjective]人沒有越境進入我們的其他領土，所以這不是全面入侵的前奏，但這次襲擊削弱了我們在全球範圍內投送兵力的能力，在國際舞臺上羞辱了我們。"
 CHL_political_events.65.a: "不幸的是，我們有更緊迫的問題，禁運應該就足夠了"
 CHL_political_events.65.b: "我們的主權受到了威脅，這需要軍事回應"
 CHL_political_events.66.t: "[CHL.GetName]要求控制我們的圭亞那領土"
 CHL_political_events.66.desc: "[CHL.GetLeader]今天發表了一次隆重的講話，譴責我們對圭亞那領土的非法和不義的佔領。他這次要求我們把這個地區移交給他們，這樣他就可以把人民從帝國主義的壓迫下解放出來。"
 CHL_political_events.66.a: "不值得為之開戰"
 CHL_political_events.66.b: "除非從我的屍體上踏過去！"
 CHL_political_events.67.t: "[FROM.GetName]接受我們的要求"
 CHL_political_events.67.desc: "[FROM.GetNameDef]的[FROM.GetLeader]告訴我們，他們在當地的守備部隊正在撤離圭亞那，他們會派出一隊人把這片地區割讓給我們，因為在他們看來，這片地區不值得為之戰鬥。"
 CHL_political_events.67.a: "他們現在擺脫了壓迫"
 CHL_political_events.68.t: "[FROM.GetName]拒絕我們的要求"
 CHL_political_events.68.desc: "[FROM.GetLeader]仍然堅持他們的立場，即圭亞那區域屬於他們和他們的盟友，而不屬於其他國家。看來談判和暗箱操作將不再有用……"
 CHL_political_events.68.a: "總有更直接的方法"
 CHL_political_events.69.t: "[CHL.GetName]強行控制了圭亞那區域"
 CHL_political_events.69.desc: "在被[CHL.GetNamDef]完全佔領之後，我們圭亞那領土上的當地人民站在了勝利的一方。在使我們的宣稱合法化方面，我們已無能為力。"
 CHL_political_events.69.a: "哦，悲劇"
 CHL_political_events.69.b: "我們不承認！"
 CHL_political_events.70.t: "黨內領導權紛爭"
 CHL_political_events.70.desc: "在智利，許多各派的法西斯分子在統一的旗幟下獲得權力後，又在沒有政府適當監督和控制的情況下，開始實踐自己的思想和理論。是時候讓這個國家做出選擇，決定誰來領導了，因為只有通過一個強人，這個國家機器才能生存下去！誰將擔任這個角色？"
 CHL_political_events.70.a: "豪爾赫·岡薩雷斯·馮·馬雷斯"
 CHL_political_events.70.b: "卡洛斯·凱勒·呂夫"
 CHL_political_events.70.c: "胡安·戈麥斯·米利亞斯"
 CHL_political_events.71.t: "卡洛斯·伊瓦涅斯·德爾坎波將軍的政變"
 CHL_political_events.71.desc: "軍隊包圍了阿圖羅·亞歷山德里及其內閣所在的拉莫內達宮，這些軍人支持保守派和法西斯分子組成的擴大聯盟。他們命令總統下臺，讓位給前總統卡洛斯·伊瓦涅斯·德爾坎波將軍，後者承諾將國家恢復到原來的價值觀，並解決亞歷山德里沒有解決的問題。鑑於軍隊站在他這一邊，他對此無能為力。"
 CHL_political_events.71.a: "是時候讓時光倒流了"
 CHL_political_events.72.t: "阿勞卡尼亞議會第一次會議"
 CHL_political_events.72.desc: "在新一屆阿勞卡尼亞議會召開的第一次會議上，出現了一場爭議。儘管所有人都同意反帝國主義必須成為任何馬普切國家的核心原則，但對於其他擁有這些理想的人，如共產主義者和社會主義者，是否可以被信任成為馬普切政府的一部分，存在分歧。一些人聲稱他們可以證明是一個有用的盟友，而另一些人則聲稱他們一有機會就會在背後捅我們一刀。誰是對的？"
 CHL_political_events.72.b: "我們的理想決不妥協！"
 CHL_political_events.72.a: "還有更多的人願意為反帝國主義事業而戰"
 CHL_mapuche_commuist_cultural_cross_pollination: "馬普切人願意與共產黨合作"
 CHL_unlocks_various_communist_advisors: "§Y各種共產主義顧問將開始與馬普切人合作，並可供僱用。§!"
 CHL_political_events.73.t: "選舉一位持斧人"
 CHL_political_events.73.desc: "馬普切人的各個組織和團體最終決定團結在一個人的領導下，他將帶領他們戰勝西班牙敵人，不辜負與印加人的戰爭精神，他將繼承考波利坎的遺產。因此，他們聚集在一起選出了一位新的托基，一位戰時的酋長，他將解放並帶領他的人民走向自由。"
 CHL_political_events.73.a: "應當推選曼努埃爾·曼基萊夫"
 CHL_political_events.73.b: "民眾支持埃斯特萬·羅梅羅·桑多瓦爾"
 CHL_political_events.73.c: "貝南西奧·科紐埃潘·溫克瓦爾可以領導我們"
 CHL_political_events.74.t: "安托萬三世的加冕"
 CHL_political_events.74.desc: "當人們聚集在聖地亞哥總統府前的戰爭撕裂了這個國家，卡洛斯·伊瓦涅斯·德爾坎波總統宣佈，他和議會已經選舉雅克·安托萬·伯納德為新國王，恢復了他的家族在1862年失去的長期失去的頭銜。伊瓦涅斯說安托萬三世是這個國家唯一的救星，他能讓這個飽受戰爭摧殘的社會重新團結起來。"
 CHL_political_events.74.a: "向當選的君主安托萬三世致敬！"
 CHL_political_events.75.t: "[CHL.GetNameDefCap]希望把阿里卡賣回給我們"
 CHL_political_events.75.desc: "[CHL.GetNameDef]的[CHL.GetLeader]向我們給出一份提議。鑑於[CHL.GetName]的經濟危機遠未結束，他迫切需要資金，並要求我們從他們手中買回阿里卡，這是他們在南美太平洋戰爭後簽署的和平條約中從我們手中奪走的。我們是否接受他的提議？"
 CHL_political_events.75.a: "這是我們期待已久的一天！"
 CHL_political_events.75.b: "我們不希望冒著將來發生戰爭的風險……"
 CHL_political_events.76.t: "[PRU.GetName]打算從我們這裡買下阿里卡"
 CHL_political_events.76.desc: "[PRU.GetLeader]聲明[PRU.GetName]很樂意接受我們把阿里卡賣給他們的提議，並派了特使帶著我們要求的資金作為交換。"
 CHL_political_events.76.a: "這是必須做出的犧牲"
 CHL_political_events.77.t: "[PRU.GetName]不打算從我們這裡買下阿里卡"
 CHL_political_events.77.desc: "[PRU.GetLeader]聲明[PRU.GetName]永遠不會接受我們向他們出售阿里卡的提議，因為他們應該無償返回，並聲稱我們在南美太平洋戰爭後佔領該區域是不公正和非法的。"
 CHL_political_events.77.a: "多麼忘恩負義！"
 CHL_news_events.1.t: "[CHL.GetNameDef]的法西斯政變"
 CHL_news_events.1.d: "據報，[CHL.GetLeader]領導的民族社會主義運動黨成功發動政變，將[CHL.GetNameDef]建立為一黨專政國家。他們與全球法西斯運動有聯繫，但仍不確定他們是否會加入任何列強的陣營，還是將勢力範圍停留在自己的大陸上。"
 CHL_news_events.1.a: "事態發展真是太有趣了"
 CHL_news_events.1.b: "我們將奪回我們的榮耀！"
 CHL_news_events.2.t: "智利宣佈恢復舊王國"
 CHL_news_events.2.d: "[CHL.GetLeader]宣佈恢復智利舊王國，這是一個很有爭議的想法，但智利人宣稱了自舊西班牙秘魯總督以來的阿根廷的大部分地區，[CHL.GetNameDef]已經開始整合所宣稱的領土。然而，他們的野心並不止於此，因為他們進一步宣稱了拉普拉塔區域的大部分土地。"
 CHL_news_events.2.a: "太牽強了……"
 CHL_news_events.2.b: "我們無可阻擋！"
 CHL_news_events.3.t: "[CHL.GetNameDefCap]的成立"
 CHL_news_events.3.d: "今天，[CHL.GetLeader]宣佈了[CHL.GetNameDef]的成立，並聲稱它是一個新的列強。他們指出，他們的目標是解放受外國壓迫的所有西班牙裔和拉丁美洲人民，他們的使命尚未完成。"
 CHL_news_events.3.a: "他們以為自己是誰？"
 CHL_news_events.3.b: "我們是一個新的列強！"
 CHL_political_events.78.t: "[FROM.GetNameDefCap]請求我們的幫助"
 CHL_political_events.78.desc: "[FROM.GetNameDef]的當選國王[FROM.GetLeader]請求我們幫助他對抗智利的法西斯和共產黨，他們想要推翻他。他需要武器和能協助他的志願軍。我們要接受他的號召嗎？"
 CHL_political_events.78.a: "那好吧，我們將幫助他們"
 CHL_political_events.78.b: "我們為什麼要幫助他們呢？"
 CHL_political_events.78.c: "我們會援助他們，但這是有償的……"
 CHL_we_will_aid_for_a_price: "如果他們接受，我們的援助將獲得經濟補償，但他們很可能拒絕我們的提議"
 CHL_political_events.79.t: "[FROM.GetName]打算幫助我們"
 CHL_political_events.79.desc: "[FROM.GetNameDef]的[FROM.GetLeader]響應了我們的號召，承諾給我們提供儘可能多的武器和志願軍。"
 CHL_political_events.79.a: "那好吧"
 CHL_political_events.80.t: "[FROM.GetName]不打算幫助我們"
 CHL_political_events.80.desc: "[FROM.GetNameDef]的[FROM.GetLeader]不聽我們的號召，只希望我們倒霉。真可惡！"
 CHL_political_events.80.a: "好吧，事情就是這樣……"
 CHL_political_events.81.t: "[FROM.GetName]說他們會有償援助我們"
 CHL_political_events.81.desc: "[FROM.GetNameDef]的[FROM.GetLeader]響應了我們的號召，承諾給我們提供儘可能多的武器和志願軍。然而，他們表示，他們的援助並不便宜，如果我們想要，我們就必須滿足他們的要價。"
 CHL_political_events.81.a: "我們只能接受"
 CHL_political_events.81.b: "我們不需要！"
 CHL_news_events.4.t: "馬普切宣佈討伐帝國主義"
 CHL_news_events.4.d: "[CHL.GetNameDef]的[CHL.GetLeader]宣佈，國家將進行一場反帝國主義的運動，他們將把美洲人民從歐洲人的壓迫下解放出來。許多人想知道，殖民主義時代是否真的結束了，或者這只是列強們的道路上的又一次顛簸。"
 CHL_news_events.4.a: "令人擔憂……"
 CHL_news_events.4.b: "我們將為那些需要幫助的人帶來自由和繁榮！"
 CHL_political_events.82.t: "王國的首都"
 CHL_political_events.82.desc: "隨著我們阿勞卡尼亞和巴塔哥尼亞新王國的建立，出現了關於我們地位的問題。目前，聖地亞哥仍然是我們的首都，這意味著我們與智利這個破敗、老舊的國家並沒有太大的不同。然而，還有其他潛在的城市是成為王國新首都的良好候選。至尊國王安托萬三世的旨意是什麼？"
 CHL_political_events.82.a: "聖地亞哥將繼續作為我們的首都"
 CHL_political_events.82.b: "佩爾肯科是曾經的舊都"
 CHL_political_events.82.c: "我們需要世界上最南端的首都！"
 CHL_political_events.82.d: "羅森是一個不錯東部候選"
 CHL_political_events.83.t: "反伊瓦涅斯聯盟發動政變"
 CHL_political_events.83.d: "經過幾天的抗議和罷工，社會主義者、共產主義者和法西斯分子看到了擺在他們面前的機會窗口，終於決定公然反對我們的政府。他們要求卡洛斯·伊瓦涅斯·德爾坎波儘快將權力移交給豪爾赫·岡薩雷斯·馮·馬雷斯，但我們不會不戰而降。據報，全國各地都發生了小規模的衝突，我們很可能面臨一場內戰……"
 CHL_political_events.83.a: "立即動員國民警衛隊！"
 CHL_political_events.83.b: "確保儘可能多的領土！"
 CHL_fascist_and_communist_joint_civil_war_started: "一場反伊瓦涅斯的內戰已經開始了"
 CHL_secures_araucania_for_the_cw_tt: "我方將保有§Y阿勞卡尼亞§!"
 CHL_approached_by_mysterious_frenchman: "曾在智利內戰期間與雅克·安托萬·伯納德接觸過"
 CHL_political_events.84.t: "一個神秘的陌生人與政府進行接洽"
 CHL_political_events.84.desc: "今天早些時候，隨著我們內戰的消息開始傳到世界各地，卡洛斯·伊瓦涅斯·德爾坎波總統收到了來自法國的消息。一個神秘的人，自稱是智利一個古老王朝的後裔，他是阿勞卡尼亞和巴塔哥尼亞國王奧雷列-安托萬一世的後代，他說他已經從法國商人和軍團士兵那裡得到了幫助我們的許可，但他聲稱這是有償的。形勢看起來很嚴峻，可能很快就需要採取嚴厲措施。"
 CHL_political_events.84.a: "都到這個時候了，他可能是我們唯一的希望……"
 CHL_political_events.85.t: "[RAP.GetNameDefCap]宣佈獨立"
 CHL_political_events.85.desc: "被當地人稱為拉帕努伊的復活節島，自1910年拉帕努伊王國被吞併以來，便處於我們的直接控制之下，從10年代以來一直如此。現在，他們再次團結在瓦倫蒂諾·裡羅科·圖基周圍。他是一個當地的阿里基首領，仍處於攝政理事會的照料中。這個波利尼西亞國家希望斷絕與我們的一切聯繫，並因此宣佈獨立。我們是否接受？"
 CHL_political_events.85.a: "我們目前沒有能力對付他們"
 CHL_political_events.85.b: "這意味著戰爭！"
 CHL_political_events.85.c: "是波利尼西亞崛起的時候了！"
 CHL_political_events.86.t: "[FROM.GetName]請求聯盟"
 CHL_political_events.86.desc: "[FROM.GetNameDef]的至高君王、法國公民[FROM.GetLeader]斯要求我們聯合起來，互相扶持，在全球範圍內擴張法國的霸權。我們如何回應？"
 CHL_political_events.86.a: "團結使我們更強大"
 CHL_political_events.86.b: "我們不需要他們"
 CHL_political_events.87.t: "[FROM.GetName]接受我們的請求"
 CHL_political_events.87.desc: "[FROM.GetNameDef]的偉大的[FROM.GetLeader]已經接受了我們正式加入聯盟的請求，我們為此感謝他。團結使我們更強大！"
 CHL_political_events.87.a: "合作優於孤立"
 CHL_political_events.88.t: "[FROM.GetName]拒絕我們的請求"
 CHL_political_events.88.desc: "[FROM.GetNameDef]的奸詐的[FROM.GetLeader]拒絕了我們正式加入聯盟的請求，儘管我們有共同的利益和傳統。"
 CHL_political_events.88.a: "我們被背叛了……"
 united_french_monarhcist_faction: "法語霸權"
 CHL_news_events.5.t: "阿勞卡尼亞和巴塔哥尼亞的新王國"
 CHL_news_events.5.desc: "儘管它在19世紀60年代只存在了短短兩年，但雅克·安托萬·伯納德，這位舊王位的繼承者，在混亂中回到智利，奪回了他失去已久的王國。只有時間會告訴我們結果如何……"
 CHL_news_events.5.a: "什麼？"
 CHL_news_events.5.b: "我們回來了，而且比以前更強大！"
 CHL_news_events.6.t: "托爾滕號蒸汽船的沉沒"
 CHL_news_events.6.desc: "中立的智利商船托爾滕號蒸汽船，在沒有護航的情況下從巴爾的摩駛往紐約市時，在新澤西州巴尼加特鎮的外海被德國潛艇發射的魚雷擊中。這艘船在6分鐘內沉沒，直到沉沒後，潛艇上的船員才確認這艘船是智利的。這對德國人來說可能是一場外交災難。"
 CHL_news_events.6.a: "火花被點燃了"
 CHL_news_events.6.b: "真正的諷刺"
 CHL_news_events.7.t: "[CHL.GetNameDefCap]實施主動防禦政策"
 CHL_news_events.7.desc: "[CHL.GetNameDef]的[CHL.GetLeader]宣佈，他們將實施主動防禦政策，捍衛[CHL.GetAdjective]和[RAP.GetAdjective]的主權，正式向南美太平洋潛在的有威脅的國家宣戰，他們選擇向潛在的侵略者開戰，而不是在他們的本土發動戰爭。"
 CHL_news_events.7.a: "明智的決定"
 CHL_news_events.7.b: "拉帕努伊島需要保護"
 CHL_political_events.89.t: "[FROM.GetNameDefCap]提議由他們來保護[270.GetName]"
 CHL_political_events.89.desc: "我們的盟友[FROM.GetNameDef]的[FROM.GetLeader]來找我們提出了一個簡單的要求。把[270.GetName]的控制權交給他們，因為巴黎離他們的心臟地帶更近，更容易被他們保護，這樣它就不會成為敵人可以利用的戰略漏洞。"
 CHL_political_events.89.a: "那麼就給他們吧"
 CHL_political_events.89.b: "他們以為自己是誰？"
 CHL_political_events.90.t: "[FROM.GetName]把[270.GetName]移交給我們"
 CHL_political_events.90.desc: "我們的盟友[FROM.GetNameDef]的[FROM.GetLeader]已按我們的要求將[270.GetName]移交給我們。現在，我們的人民終於提升了安全感，免受外來威脅，並將精力用於解決國內問題。"
 CHL_political_events.90.a: "是時候由我們來保護皮特凱恩了！"
 CHL_political_events.91.t: "[FROM.GetName]拒絕把[270.GetName]移交給我們"
 CHL_political_events.91.desc: "我們的盟友[FROM.GetNameDef]的[FROM.GetLeader]沒有把[270.GetName]移交給我們。他們聲稱這太危險了，我們只是在榨取他們帝國的財富。"
 CHL_political_events.91.a: "好吧，我們只能利用我們現在所擁有的……"
 CHL_political_events.91.b: "我們必須自己去取！"
 CHL_political_events.92.t: "新薩帕印卡"
 CHL_political_events.92.desc: "隨著我們新的衛星王國印加帝國的建立，本著拿破崙主義的精神，我們需要選擇一位將軍，以薩帕印卡的身份領導他們。誰將被授予這一崇高的頭銜？"
 CHL_political_events.92.a: "我們會把頭銜授予我們中最優秀的人！"
 CHL_political_events.92.b: "一個聰明的年輕軍官就可以了"
 CHL_political_events.92.c: "把頭銜授予一個馬普切人"
 CHL_political_events.93.t: "黃金國的國王"
 CHL_political_events.93.desc: "現在我們已經建立了一個類似於神話中的黃金國的國家，我們應該把光輝燦爛的國王的頭銜授予我們的一位驕傲而虔誠的將軍。誰配得上這個角色？"
 CHL_political_events.93.a: "巴托洛梅·布蘭切通曉帶兵之道！"
 CHL_political_events.93.b: "格雷戈里奧·羅德里格斯·塔斯孔當之無愧！"
 CHL_political_events.93.c: "金廷·拉梅理應統治這個國家！"
 CHL_political_events.94.t: "伊斯帕尼奧拉的君主"
 CHL_political_events.94.desc: "既然我們已經把伊斯帕尼奧拉統一在我們的統治之下，現在是時候把這個島的國王的頭銜授予我們的一位忠誠的將軍了。誰將獲得這一尊貴的頭銜？"
 CHL_political_events.94.a: "奧斯卡·埃斯庫德羅·奧塔羅拉可以擁有這一頭銜"
 CHL_political_events.94.b: "佩德羅·達特內利為我們效勞很久了"
 CHL_political_events.94.c: "加勒比將再次被原住民統治！"
 CHL_political_events.95.t: "民族社會主義運動的活動升級"
 CHL_political_events.95.desc: "智利卡賓槍騎兵的總司令官發來新報告，建議對民眾中日益高漲的親法西斯情緒採取行動，並對豪爾赫·岡薩雷斯·馮·馬雷斯所在政黨“民族社會主義運動”最近活動的升級進行進一步調查。據信他們很可能正計劃推翻我們的政府，因此，我們必須保持警惕。"
 CHL_political_events.95.a: "我們能處理好"
 CHL_political_events.96.t: "拉莫內達宮政變"
 CHL_political_events.96.desc: "我們忠誠的士兵執行了我們的計劃，毫髮無傷地佔領了阿圖羅·亞歷山德里及其內閣所在的拉莫內達宮。他們已命令總統下臺，讓位給豪爾赫·岡薩雷斯·馮·馬雷斯。現在自由主義政府已經無力阻止我們了！"
 CHL_political_events.96.a: "今天我們勝利了！"
 CHL_political_events.97.t: "民眾抵抗形成，老兵軍團到來"
 CHL_political_events.97.desc: "隨著我們的國王加冕，國內似乎有些人不滿意，在大眾中形成了抵抗勢力。與此同時，資深退伍軍人蜂擁而至，為我們新成立的政府提供援助。"
 CHL_political_events.97.a: "動盪與恩惠"
 CHL_political_events.98.t: "[GER.GetName]拒絕新成員加入軸心國"
 CHL_political_events.98.desc: "至少就目前來說，[GER.GetName]已拒絕了軸心國接納一個新成員的想法。這是一個小小的外交挫敗，但我們能夠應付。"
 CHL_political_events.98.a: "令人失望"
 CHL_political_events.99.t: "[GER.GetName]接受新成員加入軸心國"
 CHL_political_events.99.desc: "[GER.GetName]已接受該提議。這是強者統治的新時代，也是我們政府的一次外交勝利。"
 CHL_political_events.99.a: "走向未來！"
 #### Brazil ####
 JUNO_brazil_events.10.t: "[FROM.FROM.GetName]的小型整合主義者集會"
 JUNO_brazil_events.10.desc: "儘管為最近的[FROM.FROM.GetName]集會做了大量的計劃，但這次集會卻相當平淡無奇。預期的支持者人群並沒有出現，那些到達的人是一群對黨的綱領知之甚少或根本不瞭解的人。許多旁觀者似乎只是對我們穿制服的成員在他們的街道上游行感到困惑。"
 JUNO_brazil_events.10.a: "令人尷尬的小事"
 JUNO_brazil_events.11.t: "[FROM.FROM.GetName]的整合主義者集會"
 JUNO_brazil_events.11.desc: "儘管與當地的社會主義者和自由主義鼓動者發生衝突，但在[FROM.FROM.GetName]舉行的一場整合主義者集會還是吸引了大批支持者。該黨領導人就國家的未來發表了多次演講，人群中響起了歡呼聲和歌聲。當地黨支部已經宣佈，自集會以來，黨員人數有所增加。"
 JUNO_brazil_events.11.a: "我們正在獲得大眾的支持"
 JUNO_brazil_events.12.t: "[FROM.FROM.GetName]大規模整合主義者集會"
 JUNO_brazil_events.12.desc: "據報，人們花了幾天時間從全國各地趕來，只是為了見證在[FROM.FROM.GetName]舉行的最新的整合主義者集會。數百名身著制服的成員試圖保持人群的秩序，當略顯困惑的該黨領導人到達時，他們的演講在聽眾的奉承聲中幾乎聽不見。看來，不滿的民眾終於受夠了政治現狀。"
 JUNO_brazil_events.12.a: "我們將被人民推上權力的寶座"
 JUNO_brazil_events.13.t: "玻利瓦爾計劃在巴西中斷"
 JUNO_brazil_events.13.desc: "我們的情報部門告訴我們，他們在巴西的一些特工和線人最近已經停止了通信。看來發生了什麼事擾亂了我們在該國的行動，可能是與我們的敵人聯手發起的反情報行動。不管原因是什麼，這都表明[BRA.GetAdjective]的政策發生了不利於我們的轉變，我們應該期待他們未來也會有類似的舉動。"
 JUNO_brazil_events.13.a: "事態的轉折令人擔憂"
 JUNO_brazil_events.14.t: "[FROM.GetAdjective]睦鄰友好政策"
 JUNO_brazil_events.14.desc: "[FROM.GetAdjective]總統[FROM.GetLeader]宣佈，他們的政府打算在所謂的“睦鄰”政策中尋求與南美國家的更大合作。這種合作將採取何種形式仍有待觀察，但這明顯偏離了該大陸上西班牙語國家和葡萄牙語國家之間以前的敵對關係。"
 JUNO_brazil_events.14.a: "事態變化讓人欣喜"
 JUNO_brazil_events.14.b: "這顯然是用來破壞我們的詭計"
 JUNO_brazil_events.15.t: "[ROOT.Capital.GetCapitalVictoryPointName]協定"
 JUNO_brazil_events.15.desc: "最近幾個月，[BRA.GetAdjective]政府參加了與我國政府成員的一些聯合討論，關於他們在支持我們的戰爭努力方面發揮更積極的作用。雖然他們還不能投入軍事力量，但他們要求經濟支持，以換取在不久的將來這樣做的承諾。"
 JUNO_brazil_events.15.a: "我們歡迎這一互利協議"
 JUNO_brazil_events.15.b: "他們的擔保毫無價值"
 JUNO_brazil_events.16.t: "[FROM.Capital.GetCapitalVictoryPointName]協定"
 JUNO_brazil_events.16.desc: "事實證明，我們與[USA.GetName]政府的討論是成功的。我們達成了一項協議，[BRA.GetNameDef]將從[USA.GetName]獲得經濟援助，作為交換，將向他們提供資源，並承諾在我們的軍隊有能力時加入戰爭。"
 JUNO_brazil_events.16.a: "我們將一起恢復我們這個半球的和平"
 JUNO_brazil_events.17.t: "[FROM.Capital.GetCapitalVictoryPointName]協定遭拒絕"
 JUNO_brazil_events.17.desc: "[USA.GetName]已經決定拒絕一項協議，該協議將承諾我們在軍事上支持他們，以換取經濟援助。也許時機對總統來說不合適，或者這可能標誌著他們對巴西外交政策的轉變。不管怎樣，這都是對[BRA.GetLeader]信譽的打擊。"
 JUNO_brazil_events.17.a: "我們現在應該小心行事"
 JUNO_brazil_events.18.t: "[FROM.GetNameDefCap]要求軍事承諾"
 JUNO_brazil_events.18.desc: "[FROM.GetNameDefCap]要求我們履行我們的協議，在軍事上加入他們正在進行的戰爭。我們已經收穫了他們對我們經濟投資的回報，但到目前為止，我們在履行我們的義務方面做得很少。如果我們現在不這樣做，可能會有嚴重的後果。"
 JUNO_brazil_events.18.a: "我們將信守承諾"
 JUNO_brazil_events.18.b: "我們不會為[FROM.GetNameDef]讓[BRA.GetAdjective]人流血"
 BRA_war_embargo_with_usa_tt: "§R這可能導致[USA.GetNameDef]向我們宣戰或者對我們禁運！§!"
 JUNO_brazil_events.19.t: "[FROM.GetNameDefCap]沒有參戰"
 JUNO_brazil_events.19.desc: "[FROM.GetAdjective]外交官告訴我們，儘管我們向他們提供了多年的經濟援助，但他們還沒有準備好在軍事上參加戰爭。目前還不完全清楚，他們是否只是想取消自己的承諾，還是有真正的理由不履行承諾。我們必須慎重決定如何應對。"
 JUNO_brazil_events.19.a: "也許是時候在[FROM.Capital.GetCapitalVictoryPointName]安排一個更友好的領導人了"
 JUNO_brazil_events.19.b: "他們沒能貫徹始終，應該受到懲罰"
 JUNO_brazil_events.19.c: "他們不再與我們有關了"
 JUNO_brazil_events.20.t: "波滕日河會議"
 JUNO_brazil_events.20.desc: "最近，在[BRA.GetAdjective]和[USA.GetAdjective]總統在巴西東北部舉行的會晤中，前者同意履行[USA.Capital.GetCapitalVictoryPointName]協定中規定的承諾。這意味著他們現在將把他們的軍事力量投入到我們正在進行的反對全球暴政的戰爭中。"
 JUNO_brazil_events.20.a: "我們的外交策略取得了成效"
 JUNO_brazil_news.1.t: "[BRA.GetNonIdeologyName]採取侵略性的外交政策"
 JUNO_brazil_news.1.d: "最近，[BRA.GetAdjective]政府在外交政策問題上採取了越來越好戰和強硬的立場。在經歷了幾十年的動盪之後，新一屆政權似乎發現自己已經足夠穩固，可以將目光投向境外，以犧牲鄰國利益為代價，尋找有利於[BRA.GetName]的機會。這對我們與巴西政府的關係意味著什麼還有待觀察。"
 JUNO_brazil_news.1.a: "這些都只是花言巧語，不是嗎？"
 JUNO_brazil_news.2.t: "[BRA.GetNameDefCap]加冕新君主"
 JUNO_brazil_news.2.d: "隨著政府的支持率下降，以及帝國復辟運動最近的人氣飆升，[BRA.GetAdjective]國民議會同意與人民妥協。立憲君主將被加冕，但國民大會仍將保留其對國家的政治權力。為了穩定局勢，名義上的職責將移交給新加冕的國王。"
 JUNO_brazil_news.2.a: "國王萬歲"
 JUNO_brazil_news.3.t: "[BRA.GetNonIdeologyName]和[POR.GetNonIdeologyName]宣佈統一"
 JUNO_brazil_news.3.d: "隨著[BRA.GetNameDef]和[POR.GetNameDef]的君主主義情緒高漲，兩國決定再次統一在同一個君主和同一面旗幟下。出於利用彼此的知識和資源的願望，兩國現在決心共同發展。"
 JUNO_brazil_news.3.a: "很好"
 JUNO_brazil_news.4.t: "[BRA.GetNonIdeologyName]和[POR.GetNonIdeologyName]建立聯邦"
 JUNO_brazil_news.4.d: "在[BRA.GetNameDefCap]和[POR.GetNameDefCap]加深關係和合作之後，兩國現在決定共同建立一個聯邦，以進一步加強他們的合作。"
 JUNO_brazil_news.4.a: "真是出乎意料的轉折"
 JUNO_brazil_news.5.t: "[BRA.GetAdjective]共產主義革命"
 JUNO_brazil_news.5.d: "最近幾天，[BRA.GetNonIdeologyName]持續不斷的動盪已經失控，導致了血腥的內戰。1935年，政府挫敗了共產主義運動推翻政權的陰謀，但未能阻止更大的赤潮。雖然大部分軍隊仍然忠於中央政府，但許多較低級別的軍官站在共產黨一邊。該地區的許多人擔心，一個共產主義的[BRA.GetNonIdeologyName]將在整個南美大陸引發多米諾骨牌效應。"
 JUNO_brazil_news.5.a: "悲劇就這樣發生了"
 JUNO_brazil_news.6.t: "[ROOT.GetNonIdeologyName]發生共產主義政變"
 JUNO_brazil_news.6.d: "最近[BRA.GetNonIdeologyName]的動盪已經失控，導致共產主義政變。政府曾在1935年挫敗共產主義運動推翻政權的陰謀，但他們未能遏制更大的紅色潮流。儘管大部分軍隊仍忠於中央政府，但許多低級軍官站在了共產主義者一邊。該地區許多人擔心，共產主義[BRA.GetNonIdeologyName]的出現將在南美洲大陸引發多米諾骨牌效應。"
 JUNO_brazil_news.6.a: "但新政府能持續多久？"
 JUNO_brazil_news.7.t: "佩德羅·德·阿爾坎塔拉之死"
 JUNO_brazil_news.7.desc: "我們的老皇帝，奧爾良-布拉幹薩的唐·佩德羅·德·阿爾坎塔拉，大帕拉親王及巴西皇帝已經去世。在他短暫統治期間，他一直是我們人民和平與穩定的象徵，在[FROM.GetAdjective]動盪時期擁有極高的威望。悲痛的人們走上街頭，表達對已故皇帝的感激和支持。 \n\n國家希望老皇帝的繼承人佩德羅·加斯唐親王也能成為[FROM.GetAdjective]人民的堅定支持者。親王很快將加冕為唐·佩德羅四世皇帝——願他統治長久！"
 JUNO_brazil_news.7.a: "奧爾良-布拉幹薩的佩德羅·加斯唐萬歲！"
 JUNO_brazil_events.30.t: "[FROM.GetNameDefCap]提議合作"
 JUNO_brazil_events.30.desc: "來自[FROM.GetNameDef]的外交官已經向我們提出軍事和經濟合作的建議。他們表示，他們對世界事務的狀況深表關切，並認為實現持久和平的唯一途徑是與我們站在一起，剷除我們共同的地緣政治敵人。"
 JUNO_brazil_events.30.a: "我們接受這個建議"
 JUNO_brazil_events.30.b: "我們不需要這麼沉重的負擔"
 JUNO_brazil_events.31.t: "[BRA.GetNameDefCap]協助情報行動"
 JUNO_brazil_events.31.desc: "我們的情報部門報告說，他們已經與[BRA.GetAdjective]同行建立了密切的工作關係。這導致我們擴大了南美的情報收集範圍，也就是所謂的玻利瓦爾計劃。看來，我們同[BRA.GetName]的初步合作正開始產生成果。"
 JUNO_brazil_events.31.a: "我們將一起統治南美"
 JUNO_brazil_events.32.t: "[BRA.GetNameDefCap]索取圭亞那的領土"
 JUNO_brazil_events.32.desc: "統治[BRA.GetNameDef]的禿鷲正試圖利用當前的全球衝突作為訛詐我們交出圭亞那領土的機會。他們要求我們交出領土，否則他們就會冒險用武力奪取。如果發生戰爭，可能很難守住這片領土，但這將為世界上其他有爭議的地區樹立一個危險的先例。"
 JUNO_brazil_events.32.a: "為了圭亞那區域開戰並不值得"
 JUNO_brazil_events.32.b: "我們不會被[BRA.GetNameDef]敲詐。"
 JUNO_brazil_events.33.t: "[FROM.GetName]同意移交領土"
 JUNO_brazil_events.33.desc: "[FROM.GetName]政府按照我們最近提出的要求，不情願地同意將其在圭亞那的領土所有權轉讓給我們。看來我們新發現的外交邊緣政策取得了成功。"
 JUNO_brazil_events.33.a: "他們別無選擇，只能向我們認輸"
 JUNO_brazil_events.34.t: "[FROM.GetName]拒絕移交領土"
 JUNO_brazil_events.34.desc: "[FROM.GetName]政府拒絕按照我們最近提出的要求，將其在圭亞那的領土所有權移交給我們。現在我們必須決定是實施我們的威脅，用武力奪取領土，還是接受這一採取讓步的外交打擊。"
 JUNO_brazil_events.34.a: "他們已經識破了我們的虛張聲勢，我們必須讓步"
 JUNO_brazil_events.34.b: "我們會讓他們後悔這個決定"
 JUNO_brazil_events.35.t: "[FROM.GetName]讓步"
 JUNO_brazil_events.35.desc: "儘管他們對我們在圭亞那的土地發表了好戰的言論，但[BRA.GetAdjective]似乎並沒有表現出與我們真正開戰的意願。[BRA.GetNameDef]的外交官告訴我們，他們將尋求其他途徑獲得領土，但將以和平方式進行。至少現在是這樣。"
 JUNO_brazil_events.35.a: "我們還是應該留意他們"
 JUNO_brazil_events.36.t: "[FROM.GetName]準備開戰"
 JUNO_brazil_events.36.desc: "在我們拒絕將領土移交給[FROM.GetNameDef]之後，我們似乎正處於面對更多衝突的邊緣。雖然我們希望他們是在虛張聲勢，但來自該地區的情報表明，[BRA.GetAdjective]軍方正準備用武力奪取該地。"
 JUNO_brazil_events.36.a: "更多不必要的流血……"
 JUNO_brazil_events.37.t: "[BRA.GetNameDef]的可疑活動"
 JUNO_brazil_events.37.desc: "有報道稱，巴西南部的軍事活動有所增加。我們兩國之間最近的關係充其量是冷淡的，他們咄咄逼人的言辭讓許多人猜測我們是否可能處於入侵的邊緣。軍隊中的許多人都在忙著準備防禦措施，以防最壞的情況發生。但也有一些人主張在[BRA.GetAdjective]人完全準備好之前採取先發制人的打擊。"
 JUNO_brazil_events.37.a: "這一定是個詭計"
 JUNO_brazil_events.37.b: "進攻是最好的防守"
 JUNO_brazil_events.38.t: "[ARG.GetNameDefCap]上鉤了"
 JUNO_brazil_events.38.desc: "我們最近在邊境挑釁之後，[ARG.GetNameDefCap]似乎正在準備派出他們自己的部隊來攻擊我們。他們不知道他們掉進了我們的陷阱，很快我們就有機會粉碎他們，他們將不得不忍受國際社會對這場戰爭的譴責。"
 JUNO_brazil_events.38.a: "太容易了"
 JUNO_brazil_events.39.t: "[ARG.GetNameDefCap]拒絕我們的誘餌"
 JUNO_brazil_events.39.desc: "到目前為止，還沒有跡象表明[ARG.GetAdjective]人準備越境發動襲擊。充其量，他們似乎是在建立自己的防禦，使我們採取任何行動都更加困難。但在某種程度上，我們要麼先下手為強，要麼放棄。"
 JUNO_brazil_events.39.a: "是時候放棄了"
 JUNO_brazil_events.39.b: "再給我們一點時間"
 JUNO_brazil_events.40.t: "[BRA.GetNameDefCap]發出最後通牒"
 JUNO_brazil_events.40.desc: "[BRA.GetAdjective]駐[ROOT.Capital.GetCapitalVictoryPointName]大使發表了他們政府的聲明。在這份協議中，我們被告知立即向[BRA.GetNameDef]開放邊境，並放下武器。聲明接著詳細解釋說，我國將作為一個地區併入[BRA.GetNameDef]，立即生效。如果我們不服從，他們聲明他們將用武力執行他們的計劃。"
 JUNO_brazil_events.40.a: "我們別無選擇，只能投降"
 JUNO_brazil_events.40.b: "我們要讓他們為我們的每一寸土地付出代價"
 JUNO_brazil_events.41.t: "[FROM.GetNameDefCap]接受被兼併"
 JUNO_brazil_events.41.desc: "[FROM.GetNameDefCap]政府已經接受了我們關於他們國家地位的提議，這意味著不再需要採取軍事行動來佔領這個小國。"
 JUNO_brazil_events.41.a: "他們別無選擇，只能接受"
 JUNO_brazil_events.42.t: "[FROM.GetNameDefCap]拒絕被吞併"
 JUNO_brazil_events.42.desc: "[FROM.GetNameDefCap]政府愚蠢地拒絕了我們提出的讓他們加入[ROOT.GetNameDef]的提議。看來，我們要麼不得不實施我們的戰爭威脅，要麼暫時袖手旁觀，讓他們繼續管理自己。"
 JUNO_brazil_events.42.a: "不值得為此開戰"
 JUNO_brazil_events.42.b: "他們會感受到我們的怒火。"
 JUNO_brazil_events.43.t: "[FROM.GetName]讓步"
 JUNO_brazil_events.43.desc: "儘管他們發表了好戰的言論，並希望將我們納入他們的國家，但[BRA.GetAdjective]人似乎並沒有真正願意與我們開戰。[BRA.GetNameDef]的外交官告訴我們，他們將尋求其他方法來獲得我們的領土，但他們將以和平方式進行。至少現在是這樣。"
 JUNO_brazil_events.43.a: "我們還是應該留意他們"
 JUNO_brazil_events.44.t: "[FROM.GetName]準備開戰"
 JUNO_brazil_events.44.desc: "在我們拒絕將領土移交給[FROM.GetNameDef]之後，我們似乎正處於面對更多衝突的邊緣。雖然我們希望他們是在虛張聲勢，但來自該地區的情報表明，[BRA.GetAdjective]軍方正準備用武力奪取該地。"
 JUNO_brazil_events.44.a: "我們將確保歷史再次重演"
 JUNO_brazil_events.45.t: "[BRA.GetNameDefCap]發出最後通牒"
 JUNO_brazil_events.45.desc: "[BRA.GetAdjective]駐[ROOT.Capital.GetCapitalVictoryPointName]大使發表了他們政府的聲明。顯然，他們的政府擔心這裡的不穩定，希望用他們的軍隊來穩定我們的國家。實際上，這相當於在援助的幌子下進行政權更迭。"
 JUNO_brazil_events.45.a: "我們擋不住他們"
 JUNO_brazil_events.45.b: "我們不會簽字放棄主權"
 JUNO_brazil_events.46.t: "[FROM.GetName]接受提議"
 JUNO_brazil_events.46.desc: "[FROM.GetNameDefCap]明智地選擇了屈服於我們的武裝部隊，而不是冒著衝突的風險。我們現在正在該國建立一個與我們自己的政權更一致的新制度。"
 JUNO_brazil_events.46.a: "他們將是有價值的緩衝國"
 JUNO_brazil_events.47.t: "[FROM.GetNameDefCap]拒絕提議"
 JUNO_brazil_events.47.desc: "[FROM.GetNameDefCap]政府拒絕了我們穩定他們國家的提議。看來，如果我們想在那裡實施政權更迭，我們將不得不動用軍事力量。"
 JUNO_brazil_events.47.a: "戰爭可能會升級到失去控制"
 JUNO_brazil_events.47.b: "他們會後悔自己的決定"
 JUNO_brazil_events.48.t: "[FROM.GetNameDefCap]讓步"
 JUNO_brazil_events.48.desc: "儘管我們拒絕了[FROM.GetAdjective]軍方的“穩定”提議，但他們似乎要放棄了。看來我們已經揭穿了他們的虛張聲勢，而他們也不想真的挑起衝突。"
 JUNO_brazil_events.48.a: "他們仍然設法破壞了該地的穩定"
 JUNO_brazil_events.49.t: "與[FROM.GetNameDef]的緊張關係加劇"
 JUNO_brazil_events.49.desc: "我們拒絕[FROM.GetNameDef]人“穩定”我們國家的提議後，他們的武裝部隊似乎在準備戰爭。我們不知道他們打算什麼時候發動襲擊，但可以肯定的是，我們會成為他們的目標。他們大使館的外交官似乎也已撤離，這加劇了人們對戰爭可能不可避免的擔憂。"
 JUNO_brazil_events.49.a: "我們必須堅持自己的立場"
 JUNO_brazil_events.50.t: "[FROM.GetNameDefCap]提供南方共同市場的成員資格"
 JUNO_brazil_events.50.desc: "[FROM.GetNameDef]的外交官提議我們加入一個超國家組織，在這個組織中，成員國共同協調經濟和外交政策決策。雖然協調政策對我們的經濟有明顯的好處，我們的安全局勢可能得到改善，但有些人認為，失去主權是不值得的。"
 JUNO_brazil_events.50.a: "我們賺多虧少"
 JUNO_brazil_events.50.b: "主權比財富更重要"
 JUNO_brazil_events.51.t: "[FROM.GetNameDefCap]同意加入南方共同市場"
 JUNO_brazil_events.51.desc: "經過多次談判和磋商，[FROM.GetNameDef]政府終於同意加入南方共同市場。從現在起，我們將在經濟和外交政策方面進行合作，以確保整個地區的和平與繁榮。"
 JUNO_brazil_events.51.a: "團結使我們更強大"
 JUNO_brazil_events.52.t: "[FROM.GetNameDefCap]拒絕加入南方共同市場"
 JUNO_brazil_events.52.desc: "儘管進行了多次談判和磋商，[FROM.GetNameDef]政府還是拒絕加入南方共同市場。儘管有和平與繁榮的承諾，但他們似乎懷疑該組織是否真的可行，甚至聲稱這是我們通過後門控制他們的一種方式。"
 JUNO_brazil_events.52.a: "荒謬至極"
 JUNO_brazil_events.53.t: "[FROM.GetName]拒絕提議"
 JUNO_brazil_events.53.desc: "[FROM.GetNameDef]的大使告訴我們，他們的政府不認為此時與我們進行軍事合作最符合他們國家的利益。目前尚不清楚他們是否對我們的領土有所圖謀，或者我們是否只是被視為他們的負擔。"
 JUNO_brazil_events.53.a: "一群鼠目寸光的傢伙"
 south_american_news.50.t: "巴西進入緊急狀態"
 south_american_news.50.d: "今天早上，[FROM.GetName]的[FROM.GetLeader]總統在廣播中宣佈，由於共產黨可能發動政變，國家又進入了緊急狀態。根據總統的說法，發現的文件表明共產黨正處於計劃推翻政府的最後階段。這些文件的有效性受到許多人的質疑，而反對黨的成員現在由於害怕被捕而轉入地下。總統宣佈他將建立一個新的國家，並制定一部賦予他更大權力的新憲法。這對[FROM.GetName]民主的未來意味著什麼還有待觀察。"
 south_american_news.50.a: "布爾什維克叛徒罪有應得"
 south_american_news.50.b: "這是一個令人不安的局面"
 south_american_news.50.c: "我們的同志會報仇的！"
 south_american_news.51.t: "巴西暫停民主"
 south_american_news.51.d: "今天早上，[FROM.GetName]的[FROM.GetLeader]總統在廣播中宣佈，由於共產黨可能發動政變，國家又進入了緊急狀態。根據總統的說法，發現的文件表明共產黨人正在計劃推翻政府的最後階段。在右翼統一黨的支持下，[BRA.GetLeader]迫使反對黨轉入地下。總統宣佈他將建設一個嶄新的國家，並與勇敢地將國家從布爾什維克主義中拯救出來的整合主義黨一起制定新憲法。考慮到“整合主義者”過去的言論和行動，巴西的自由民主似乎已名存實亡。"
 south_american_news.51.a: "布爾什維克叛徒罪有應得"
 south_american_news.51.b: "這是一個令人不安的局面"
 south_american_news.51.c: "我們的同志會報仇的！"
 JUNO_brazil_events.60.t: "[BRA.GetNameDefCap]提議統一"
 JUNO_brazil_events.60.desc: "[BRA.GetNameDefCap]已與我國政府接觸，提議我們兩國再次統一。他們以我們兩國文化的相似之處以及布拉幹薩公爵多姆·杜阿爾特·努諾和奧爾良-布拉幹薩公主瑪麗亞·弗朗西斯卡最近的婚姻為理由提出這一提議，並確保我們在[BRA.GetLeader]的統治下共同強大起來。"
 JUNO_brazil_events.60.a: "團結使我們更強大！"
 JUNO_brazil_events.60.b: "實際上我們更希望建立一個聯邦"
 JUNO_brazil_events.60.c: "我們不希望加入他們"
 JUNO_brazil_events.61.t: "[POR.GetNameDefCap]接受統一"
 JUNO_brazil_events.61.desc: "我們提出的與[POR.GetNameDef]統一的提議得到了熱烈的贊同。這標誌著我們國家一個偉大新時代的開始！"
 JUNO_brazil_events.61.a: "好極了"
 JUNO_brazil_events.62.t: "[POR.GetNameDefCap]提議建立聯邦"
 JUNO_brazil_events.62.desc: "我們最近向[POR.GetNameDef]提出的建議得到了令人意外的回應。[POR.GetNameDefCap]拒絕統一的想法，但取而代之的是我們兩國的聯邦。這既能給我們帶來統一的部分好處同時避免缺陷，也能使我們兩個國家都能保留自己獨特的身份。"
 JUNO_brazil_events.62.a: "當然，這對我們也有好處！"
 JUNO_brazil_events.62.b: "和曾經殖民我們的國家組成聯邦？絕對不"
 JUNO_brazil_events.63.t: "[POR.GetNameDefCap]拒絕統一"
 JUNO_brazil_events.63.desc: "我們提出與[POR.GetNameDef]統一，缺遭到了冷漠的拒絕。儘管我們盡了最大的努力讓他們看到這項協議的好處，但[POR.GetAdjective]人對再次統一兩個國家不感興趣。"
 JUNO_brazil_events.63.a: "難道他們不知道這樣能得到多少好處嗎？"
 JUNO_brazil_events.64.t: "[BRA.GetNameDefCap]同意建立聯邦"
 JUNO_brazil_events.64.desc: "我們對提議的回應是建立一個聯邦，而不是直接加入[BRA.GetNameDef]，這得到了[BRA.GetAdjective]領導層的歡迎。他們已經放棄了統一的想法，並同意建立一個聯邦對我們雙方都有好處。"
 JUNO_brazil_events.64.a: "好極了！"
 JUNO_brazil_events.65.t: "[BRA.GetNameDefCap]拒絕建立聯邦的提議"
 JUNO_brazil_events.65.desc: "我們對提議的回應是建立聯邦而不是直接加入[BRA.GetNameDef]，這在[BRA.GetAdjective]領導層中反響不佳。他們拒絕了建立聯邦的想法，理由是擔心他們會再次作為一個殖民地落入我們的控制。"
 JUNO_brazil_events.65.a: "這是他們的損失"
 JUNO_brazil_events.70.t: "[FROM.GetNameDefCap]索取海外領土"
 JUNO_brazil_events.70.desc: "[FROM.GetAdjective]外交官給我們下了最後通牒。他們說，鑑於世界事務的不穩定狀態，他們不相信我們有能力保護我們的海外領土。由於歷史上的聯繫，他們認為只有他們才適合去實施保護。因此，他們要求我們立即交出他們的領土。"
 JUNO_brazil_events.70.a: "那些領土不值得為之開戰"
 JUNO_brazil_events.70.b: "過分的要求！"
 JUNO_brazil_events.71.t: "[FROM.GetNameDefCap]同意移交殖民地"
 JUNO_brazil_events.71.desc: "[FROM.GetNameDef]政府明智地選擇了將海外領土的控制權交給我們。這將使我們的工業在全球範圍內獲得免關稅的資源，並將使列強在國際事務中更加重視我們。"
 JUNO_brazil_events.71.a: "好極了！"
 JUNO_brazil_events.72.t: "[FROM.GetNameDefCap]拒絕移交殖民地"
 JUNO_brazil_events.72.desc: "[FROM.GetNameDef]政府愚蠢地拒絕將海外領土的控制權交給我們。外交圈並沒有忽視這一恥辱。全世界都在關注我們，我們必須決定如何回應。"
 JUNO_brazil_events.72.a: "不值得為此遠渡重洋發動戰爭"
 JUNO_brazil_events.72.b: "那我們就用武力奪取這片土地"
 JUNO_brazil_events.73.t: "[FROM.GetAdjective]的最後通牒"
 JUNO_brazil_events.73.desc: "在全球緊張局勢中，大西洋彼岸傳來了一個令人震驚的消息。我們曾經的殖民地[FROM.GetNonIdeologyName]，如今憑藉自身實力崛起，併發出了大膽的最後通牒。他們要求[FROM.GetName]臣服，並將其併入[FROM.GetAdjective]帝國。我們的民眾感到震驚，許多人對[FROM.GetAdjective]人的膽大妄為感到憤怒。然而，另一些人擔心[FROM.GetNonIdeologyName]日益增長的實力和我們自身的軟弱無力，考慮默許他們的要求。我們該如何回應？"
 JUNO_brazil_events.73.a: "我們沒有反抗的力量"
 JUNO_brazil_events.73.b: "我們決不放棄獨立！"
 JUNO_brazil_events.74.t: "[FROM.GetNameDefCap]接受臣服"
 JUNO_brazil_events.74.desc: "我們要求[FROM.GetNonIdeologyName]臣服，他們不出所料地默許了。隨著消息的傳播，一種憂鬱的情緒傳遍了[FROM.GetNonIdeologyName]這個前國家，許多人都在努力應對新的現實。與此同時，[ROOT.GetNonIdeologyName]人民沉浸在愛國熱情中。"
 JUNO_brazil_events.74.a: "終於再次統一！"
 JUNO_brazil_events.75.t: "[FROM.GetNameDefCap]拒絕臣服"
 JUNO_brazil_events.75.desc: "[FROM.GetNonIdeologyName]政府以挑釁的姿態，援引國家悠久的歷史和自豪感，強烈拒絕了我們的最後通牒。愛國熱情席捲了他們的城市，軍隊也開始動員起來，為大西洋彼岸的潛在衝突做好準備。"
 JUNO_brazil_events.75.a: "我們無能為力"
 JUNO_brazil_events.75.b: "他們會後悔如此決定的"
 JUNO_brazil_events.80.t: "[FROM.GetNameDefCap]提議相互保障"
 JUNO_brazil_events.80.desc: "[FROM.GetNameDefCap]提出了相互保障安全的提議。他們認為，南美洲的和平已變得脆弱，維護和平的唯一途徑是加強我們各國之間的聯繫。如果我們同意這個建議，他們就會指望我們在他們受到攻擊時前來援助。"
 JUNO_brazil_events.80.a: "我們同意他們的建議"
 JUNO_brazil_events.80.b: "我們不會受此束縛"
 JUNO_brazil_events.81.t: "[FROM.GetNameDefCap]接受協議"
 JUNO_brazil_events.81.desc: "[FROM.GetNameDefCap]已經接受了我們關於相互保障安全的建議。希望這是這片大陸走向長期和平的第一步。"
 JUNO_brazil_events.81.a: "好極了！"
 JUNO_brazil_events.82.t: "[FROM.GetNameDefCap]拒絕協議"
 JUNO_brazil_events.82.desc: "[FROM.GetNameDefCap]拒絕了我們關於相互保障安全的慷慨提議。這對我們國家的長期安全意味著什麼還有待觀察。"
 JUNO_brazil_events.82.a: "真是不祥啊……"
 JUNO_brazil_events.83.t: "[FROM.GetNameDefCap]邀請我們加入美洲國家組織"
 JUNO_brazil_events.83.desc: "[FROM.GetAdjective]政府已經向我們發出邀請，邀請我們加入美洲國家組織。他們的願望是使美洲大陸上的所有國家在這個組織中聯合起來。這個組織旨在維護我們的共同利益，並確保所有成員之間的良好關係。"
 JUNO_brazil_events.83.a: "好主意，我們將加入他們！"
 JUNO_brazil_events.83.b: "我們認為沒有必要"
 JUNO_brazil_events.84.t: "[FROM.GetNameDefCap]拒絕我們的邀請"
 JUNO_brazil_events.84.desc: "我們剛剛收到[FROM.GetNameDefCap]對我們邀請的答覆。令人遺憾的是，儘管我們盡了最大努力使他們重新考慮，他們還是選擇不加入美洲國家組織。"
 JUNO_brazil_events.84.a: "真遺憾"
 JUNO_brazil_events.85.t: "[FROM.GetNameDefCap]接受我們的邀請"
 JUNO_brazil_events.85.desc: "我們剛剛收到[FROM.GetNameDefCap]對我們邀請的答覆。正如我們所希望的那樣，[FROM.GetAdjective]領導層已經看到了加入美洲國家組織的價值。從現在起我們共同合作！"
 JUNO_brazil_events.85.a: "明智的決定！"
 JUNO_brazil_events.86.t: "[BRA.GetNameDef]的共產主義者請求我們的援助"
 JUNO_brazil_events.86.desc: "[BRA.GetNameDef]的[BRA.GetCommunistParty]領導人再次向我們尋求援助。雖然他們目前沒有發生武裝衝突，但1935年奪取政權的失敗仍在每個人的腦海中燃燒。他們希望我們更積極地支持他們，以確保那種災難性的失敗不再重演。"
 JUNO_brazil_events.86.a: "我們必須再次幫助我們的同志！"
 JUNO_brazil_events.86.b: "巴西有一次起義失敗已足夠"
 JUNO_brazil_events.87.t: "[SOV.GetNameDefCap]同意支持我們！"
 JUNO_brazil_events.87.desc: "正如我們所希望的那樣，[SOV.GetAdjective]領導人在這艱難的時刻給予了我們支持。我們當然不能依靠他們來完全解決我們的所有問題，但是我們肯定非常受歡迎再次得到他們的支持"
 JUNO_brazil_events.87.a: "我們就知道我們可以依靠我們的[SOV.GetAdjective]同志！"
 JUNO_brazil_events.87.tt: "如果爆發內戰，[SOV.GetFlag]§Y[SOV.GetNameDef]§!更有可能向我們派遣志願軍並租借裝備給我們。"
 JUNO_brazil_events.88.t: "[SOV.GetNameDefCap]拒絕我們的求助請求"
 JUNO_brazil_events.88.desc: "令我們吃驚的是，儘管我們有在意識形態上的紐帶，[SOV.GetNameDef]卻拒絕向我們提供支持。根據他們的說法，1935年的“災難性的失敗”使他們對再次支持我們感到謹慎。"
 JUNO_brazil_events.88.a: "給他們點顏色看看！"
 JUNO_brazil_events.88.tt: "我們獲得§Y評價降低§!（對[SOV.GetFlag]§Y[SOV.GetName]§!的評價§R-25§!。）"
 JUNO_brazil_events.120.t: "[FROM.GetNameDefCap]建議科技共享"
 JUNO_brazil_events.120.desc: "[FROM.GetNameDefCap]建議建立夥伴關係，相互學習科學專業知識。雖然我們的科學家在很大程度上支持增加知識的可用性，但軍方對於洩露可能最終損害我們國家安全的信息持謹慎態度。"
 JUNO_brazil_events.120.a: "知識無國界"
 JUNO_brazil_events.120.b: "我們將改為向他們提供經濟援助"
 JUNO_brazil_events.121.t: "[FROM.GetNameDefCap]支持技術交流"
 JUNO_brazil_events.121.desc: "[FROM.GetNameDefCap]已同意參加我們提出的技術交流計劃。我們自己的科學界的成員聽到這個消息很高興，並已經計劃到[FROM.GetNameDef]的大學和工廠參觀。"
 JUNO_brazil_events.121.a: "互惠互利的安排！"
 JUNO_brazil_events.122.t: "[FROM.GetNameDefCap]拒絕技術交流"
 JUNO_brazil_events.122.desc: "[FROM.GetNameDefCap]拒絕了我們提出的技術交流計劃，理由是他們的軍事機密可能落入他們的地緣政治對手的手中。然而，聽到[FROM.GetNameDef]同意向我們的經濟投入更多資金，我們的財政部欣喜若狂。"
 JUNO_brazil_events.122.a: "總比沒有強"
 JUNO_brazil_events.130.t: "援引美洲國家組織的條款"
 JUNO_brazil_events.130.desc: "[FROM.GetNameDefCap]是美洲國家組織的一個成員，它受到了攻擊，因此援引了該組織最近通過的防禦條款。根據該條款，所有成員國都有義務援助受到攻擊的成員國。如果我們不履行義務，我們很可能會失去成員資格。"
 JUNO_brazil_events.130.a: "我們當然會去援助他們！"
 JUNO_brazil_events.130.b: "這個組織為我們做過什麼？"
 JUNO_brazil_events.131.t: "[FROM.GetNameDefCap]前來援助我們"
 JUNO_brazil_events.131.desc: "[FROM.GetNameDefCap]履行了對美洲國家組織的承諾，在這一前所未有的局勢中向我們提供了援助。希望所有其他成員都能以他們為榜樣。"
 JUNO_brazil_events.131.a: "我們感激不盡"
 JUNO_brazil_events.132.t: "[FROM.GetNameDefCap]背棄義務"
 JUNO_brazil_events.132.desc: "[FROM.GetNameDefCap]沒有履行對美洲國家組織的承諾，拒絕向我們提供援助。因此，他們已被逐出該組織。"
 JUNO_brazil_events.132.a: "希望這種怯懦不會蔓延"
 JUNO_brazil_events.133.t: "被逐出美洲國家組織"
 JUNO_brazil_events.133.desc: "正如人們所預料的那樣，在我們最近襲擊了同在美洲國家組織的一個成員國之後，我們被逐出該組織。剩下的成員國將如何應對這一局勢仍有待觀察。"
 JUNO_brazil_events.133.a: "反正我們靠自己過得更好"
 JUNO_brazil_events.134.t: "[BRA.GetNameDefCap]尋求生產許可協議"
 JUNO_brazil_events.134.desc: "我們收到了[BRA.GetNameDef]的同志們關於生產許可的請求。他們希望與我們簽訂長期的生產許可協議，但作為回報，他們要求折扣。我們每份授權設計的收入會少於比往常，但我們會從[BRA.GetAdjective]領導層那裡獲得一些信任和善意。"
 JUNO_brazil_events.134.a: "我們可以為同志承受一點損失"
 JUNO_brazil_events.134.b: "這對我們來說似乎既不公平也不有利"
 JUNO_brazil_events.134.tt: "\n選擇這一選項將使我們在[BRA.GetFlag]§Y[BRA.GetNameDef]§!從授權生產中獲得的工廠數量減少§R-30%§!。"
 JUNO_brazil_events.135.t: "[SOV.GetNameDefCap]同意了一項交易"
 JUNO_brazil_events.135.desc: "我們最近得到消息，[SOV.GetNameDef]同意了我們提出的交易。從現在開始，我們將能夠以更低的成本授權生產他們的裝備！"
 JUNO_brazil_events.135.a: "好消息！"
 JUNO_brazil_events.135.tt: "我們獲得§Y評價提高§!（對[SOV.GetFlag]§Y[SOV.GetName]§!的評價§G+25§!。）"
 JUNO_brazil_events.136.t: "[SOV.GetNameDefCap]拒絕我們提出的交易"
 JUNO_brazil_events.136.desc: "[SOV.GetNameDefCap]迅速拒絕了我們的提議。我們被要求像其他國家一樣獲得生產許可，價格和其他國家一樣，沒有折扣。"
 JUNO_brazil_events.136.a: "值得一問……"
 JUNO_brazil_events.136.tt: "我們獲得§Y評價降低§!（對[SOV.GetFlag]§Y[SOV.GetName]§!的評價§R-50§!。）"
 JUNO_brazil_events.137.t: "[BRA.GetNameDefCap]要求我們釋放南美殖民地"
 JUNO_brazil_events.137.desc: "我們收到了來自[BRA.GetNameDef]的措辭相當強硬的照會。他們要求我們釋放[BRA_country_to_be_liberated.GetNameDef]並把領土歸還給它們的合法所有者。"
 JUNO_brazil_events.137.a: "反正這些殖民地對我們也沒什麼用"
 JUNO_brazil_events.137.b: "它們的合法擁有者應該是我們"
 JUNO_brazil_events.137.b.tt: "§R這將給他們一個針對我們的戰爭目標！§!"
 JUNO_brazil_events.138.t: "[FROM.GetNameDefCap]同意釋放[BRA_country_to_be_liberated.GetNameDef]"
 JUNO_brazil_events.138.desc: "我們剛剛收到對[FROM.GetNameDef]要求釋放他們的[BRA_country_to_be_liberated.GetNameDef]的答覆。也許有點令人驚訝的是，他們一致認為，讓他們離開，讓他們成為一個獨立的國家是最好的辦法。"
 JUNO_brazil_events.138.a: "最令人滿意的結果"
 JUNO_brazil_events.139.t: "[FROM.GetNameDefCap]拒絕釋放殖民地"
 JUNO_brazil_events.139.desc: "我們剛剛收到對[FROM.GetNameDef]要求釋放他們的[BRA_country_to_be_liberated.GetNameDef]的答覆。他們說，他們的外交事務與我們無關，他們拒絕給予他們合法獨立的想法。"
 JUNO_brazil_events.139.a: "不管付出什麼代價，我們必須解放他們"
 JUNO_brazil_events.140.t: "美洲豹外交"
 JUNO_brazil_events.140.desc: "為了表示友好，[FROM.GetAdjective]外交代表團帶來了一份獨特的禮物——美洲豹，這是他們國家文化和實力的象徵。伴隨這一非凡禮物的是一項關於加強貿易和外交政策合作的建議。[FROM.GetAdjective]使節表達了他們在我們兩國之間建立更緊密聯繫的願望。\n\n雖然美洲豹吸引了公眾的想像力並贏得了善意，但這一提議的更深一層含義需要仔細思量。"
 JUNO_brazil_events.140.a: "歡迎這一姿態並加強紐帶"
 JUNO_brazil_events.140.b: "禮貌拒絕這個提議"
 JUNO_brazil_events.141.t: "外交使命成功"
 JUNO_brazil_events.141.desc: "我們的外交使團帶回來了好消息。[FROM.GetNameDefCap]親切地接受了我們的美洲豹禮物。在一個引起國際關注的盛大儀式上，他們對我們的姿態表示歡迎，並同意我們關於加強貿易和外交政策事務合作的提議。"
 JUNO_brazil_events.141.a: "好消息！"
 BRA_jaguar_diplomacy_in_progress: "美洲豹外交決議進行中"
 JUNO_brazil_events.142.t: "外交尷尬"
 JUNO_brazil_events.142.desc: "我國外交代表團最近的報告帶來了不幸的消息。我們提出的美洲豹，象徵著我們對友誼和善意的渴望，被[FROM.GetNameDef]出人意料地拒絕了。在拒絕這一珍貴禮物的同時，我們關於加強外交政策事務方面的貿易和合作的提議也遭到拒絕。"
 JUNO_brazil_events.142.a: "我們必須謹慎行事"
 JUNO_brazil_events.143.t: "激進的左翼運動獲得支持"
 JUNO_brazil_events.143.desc: "聲稱代表我們城市工人階級的激進運動的活動有所增加。我們的安全部門認為這些運動得到了[BRA.GetNonIdeologyName]共產主義政權的支持。因此，他們正在制定計劃，只要我們一聲令下，他們就會鎮壓激進分子。"
 JUNO_brazil_events.143.a: "我們必須在事態失控之前調查清楚"
 JUNO_brazil_events.144.t: "在[FROM.GetNameDef]的行動被中斷"
 JUNO_brazil_events.144.desc: "我們在[FROM.GetNameDef]加強對共產黨支持的行動，遭到了當地警方和安全部門的強烈抵制。如果我們想在這方面取得進一步的進展，我們需要嘗試新的滲透戰術。"
 JUNO_brazil_events.144.a: "真不幸"
 brazil_promoting_communism_tt: "解鎖§Y取締共產主義§!的決議來對抗[FROM.GetAdjective]對我們政策的影響"
 JUNO_brazil_events.150.t: "坎加索實施行動"
 JUNO_brazil_events.150.desc.a: "巴西東北部的土匪組織被稱為坎加索，他們對該地區的一個定居點進行了精心策劃的襲擊。由於當地人保護該組織成員，執法部門正在努力推進調查。看來，追捕罪犯需要在該區域加強安全部署。"
 JUNO_brazil_events.150.desc.b: "巴西東北部的土匪組織被稱為坎加索，他們正在大幅擴展在當地的活動範圍。雖然當地執法部門和土地所有者對該地區的此類活動感到憤怒，但許多較貧窮的當地人往好裡說是漠不關心，往壞裡說是欣喜若狂。看來，追捕罪犯需要在該區域加強安全部署。"
 JUNO_brazil_events.150.a: "他們只是令人討厭"
 JUNO_brazil_events.150.b: "再也不能容忍這種強盜行徑了！"
 JUNO_brazil_events.150.c: "必須立刻找到並逮捕他們！"
 JUNO_brazil_events.151.t: "針對坎加索的行動成功"
 JUNO_brazil_events.151.desc: "事實證明，我們最近在巴西東北部的行動成功地挫敗了坎加索的行動。他們的活動範圍目前已大大縮小，但如果我們要防止他們今後捲土重來，就必須繼續在執法方面進行投資。"
 JUNO_brazil_events.151.a: "好極了！"
 JUNO_brazil_events.152.t: "蘭皮昂在槍戰中被殺"
 JUNO_brazil_events.152.desc: "在我們最近一次在巴西東北部的執法行動中，坎加索匪幫中最著名的人物蘭皮昂在與警方的槍戰中被擊斃。蘭皮昂一夥強盜中的一個人出賣了他，這使警察得以在他們的藏身處伏擊他們。雖然許多較小的土匪集團繼續在農村遊蕩，但這似乎標誌著坎加索大規模行動的結束。"
 JUNO_brazil_events.152.a: "是時候了"
 BRA_end_of_cangaco_tt: "§Y$BRA_cangaceiro_mission$§!將永久不可用，以防止坎加索蔓延到其他任何地區"
 JUNO_brazil_events.153.t: "坎加索威脅"
 JUNO_brazil_events.153.desc: "多年來，巴西東北部一直被稱為坎加索的強盜所困擾。由於首都的不穩定，而且政客們更關心保住權力，坎加索的活動肆無忌憚。只有通過執法機構的共同努力，我們才有希望遏制他們在該區域的影響。"
 JUNO_brazil_events.153.a: "我們將及時處理他們"
 JUNO_brazil_events_153_tt: "§Y$BRA_cangaceiro_decision_cat$§!決議與§Y$BRA_cangaceiro_mission$§!將保持激活直至坎加索從所有受影響地區被根除。\n\n§Y$BRA_deal_with_the_cangaceiro$§!國策將解鎖根除坎加索的決議。"
 JUNO_brazil_events.160.t: "邀請企業進入[FROM.GetNameDefCap]"
 JUNO_brazil_events.160.desc: "[FROM.GetAdjective]外交官就他們計劃鼓勵外國企業在他們國家設立子公司的計劃與我們進行接洽。他們想知道我們是否會阻止我們的企業。如果我們同意允許我們的公司擴展到這個新興市場，我們自己可能也會從中獲得經濟利益。"
 JUNO_brazil_events.160.a: "我們何必阻礙自由市場？"
 JUNO_brazil_events.160.b: "這是竊取我們知識產權的詭計"
 JUNO_brazil_events_160_tt: "§Y[FROM.GetNameDefCap]將解鎖下列之一：§!"
 JUNO_brazil_events.161.t: "[FROM.GetNameDefCap]同意製造業合作"
 JUNO_brazil_events.161.desc: "[FROM.GetNameDefCap]政府已允許他們的企業按自己的意願在[ROOT.GetNonIdeologyName]設立子公司。剩下的就是確定我們希望激勵哪種類型的產業。"
 JUNO_brazil_events.161.a: "激勵坦克製造"
 JUNO_brazil_events.161.b: "激勵飛機制造"
 JUNO_brazil_events.161.c: "激勵造船"
 JUNO_brazil_events.161.d: "激勵裝甲車製造"
 JUNO_brazil_events.162.t: "[FROM.GetNameDefCap]拒絕製造業合作"
 JUNO_brazil_events.162.desc: "[FROM.GetAdjective]外交官通知我們，他們的政府在可預見的未來不會允許他們的企業在[ROOT.GetNonIdeologyName]設立子公司。他們提到了關於知識產權和軍事機密可能暴露給敵對國家的擔憂。"
 JUNO_brazil_events.162.a: "我們將尋找其他合作伙伴"
 JUNO_brazil_events.163.t: "處理勞資糾紛"
 JUNO_brazil_events.163.desc: "近年來，勞資雙方的爭議幾乎撕裂了國家。是時候我們最終立法解決這個問題了。在國家議會的一邊，工黨主張親勞工的立法，將合法化工會活動，確立保障工人權利和每年固定假期天數的權利。另一邊，共和黨主張較為溫和的改革，而將問題留給各地自行決定。他們認為，當前全球安全形勢意味著我們必須優先考慮國防開支，而不是向激進左翼妥協。"
 JUNO_brazil_events.163.a: "通過工黨的立法"
 JUNO_brazil_events.163.b: "通過共和黨的立法"
 JUNO_brazil_events.170.t: "[FROM.GetNameDefCap]提議統一"
 JUNO_brazil_events.170.desc: "[FROM.GetNameDefCap]提議我們的國家加入他們的聯邦。雖然我們最近與[FROM.GetNameDef]密切合作，但許多老一輩的人不願放下他們的歷史恩怨，以換取經濟和政治穩定。無論我們的決定是什麼，它可能會在未來多年產生影響。"
 JUNO_brazil_events.170.a: "是時候拋開我們的分歧了"
 JUNO_brazil_events.170.b: "我們決不會同意這樣的安排！"
 JUNO_brazil_events.171.t: "[FROM.GetNameDefCap]接受統一"
 JUNO_brazil_events.171.desc: "[FROM.GetNameDefCap]在經過長時間討論他們在我們政治體系中的地位和保護他們人民的關鍵利益後，同意了我們的統一提議。"
 JUNO_brazil_events.171.a: "這是一個歷史性的時刻！"
 JUNO_brazil_events.172.t: "[FROM.GetNameDefCap]拒絕統一"
 JUNO_brazil_events.172.desc: "[FROM.GetNameDefCap]由於公眾對這項政策的不滿而拒絕了我們的統一提議。儘管我們解釋了這種安排將如何互利互惠，但顯然統一的時機還未到來。"
 JUNO_brazil_events.172.a: "狹隘的傻瓜"
 JUNO_brazil_events.180.t: "$BRA_henry_ford$到達[ROOT.GetNonIdeologyName]"
 JUNO_brazil_events.180.desc: "由於美國近期的動盪和他們的政府被馬克思主義者推翻，一些[USA.GetAdjective]已前往[ROOT.GetNonIdeologyName]尋找新的生活。迄今為止，來到這裡的人最著名的是實業家$BRA_henry_ford$。他提出要在福特蘭迪亞擴大運營，並要求在政府中獲得一個席位，以幫助我們避免像他的祖國那樣受到共產主義的影響。"
 JUNO_brazil_events.180.a: "我們可以利用他的專業知識。"
 JUNO_brazil_events.180.b: "將他納入到我們的決策中太冒險了。"
 JUNO_brazil_events.190.t: "[FROM.GetNameDefCap]在[ROOT.GetNonIdeologyName]宣傳君主主義"
 JUNO_brazil_events.190.desc: "我們收到報告，稱[FROM.GetAdjective]特工試圖在[ROOT.GetNonIdeologyName]宣揚君主主義情緒。我們應該接受這場運動，或者在它失控前將其消滅，具體取決於我們對國家的長期規劃。"
 JUNO_brazil_events.190.a: "我們應該擁抱我們的帝國遺產！"
 JUNO_brazil_events.190.b: "我們必須馬上粉碎這次行動"
 BRA_rejected_monarchism: "§R已查禁君主派運動。§!"
 JUNO_brazil_events.191.t: "[FROM.GetNameDefCap]查禁君主派運動"
 JUNO_brazil_events.191.desc: "[FROM.GetNameDefCap][BRA.GetFlag]嚴厲打擊了任何宣揚君主主義情緒的行為。不出所料，這削弱了我們的特工在該國的影響。"
 JUNO_brazil_events.191.a: "我們之後必須採用其他方法"
 JUNO_brazil_events.200.t: "選舉季"
 JUNO_brazil_events.200.desc: "選舉季再次來臨，[ROOT.GetAdjective]民眾屏息以待，看看誰將是下一任總統。"
 JUNO_brazil_events.200.a: "$BRA_anisio_teixeira$"
 JUNO_brazil_events.200.b: "$BRA_armando_de_sales_oliveira$"
 JUNO_brazil_events.200.c: "$BRA_minervino_de_oliveira$"
 JUNO_brazil_events.200.d: "$BRA_lindolfo_collor$"
 JUNO_brazil_events.200.e: "$BRA_eurico_gaspar_dutra$"
 south_american_news.52.t: "狂歡節被取消"
 south_american_news.52.desc: "隨著世界再次陷入全球衝突，里約熱內盧市決定暫停著名的年度狂歡節慶祝活動。和平成為遙遠的記憶，目前還不清楚慶祝活動何時會回來。然而，許多人更擔心的是，戰爭是否也會波及[BRA.GetNonIdeologyName]本土。"
 south_american_news.52.a: "這是我們所有人的悲傷時刻"
 south_american_news.52.b: "這樣頹廢的表演不容錯過"
 ### Argentina ###
 ARG_political_events.1.t: "軍隊開始反對我們了！"
 ARG_political_events.1.desc: "今天早上，黎明時分，八千名士兵從布宜諾斯艾利斯的軍事基地“五月營地”出發，向總統府玫瑰宮進軍。他們在阿圖羅·羅森和佩德羅·巴勃羅·拉米雷斯的領導下，兩位將軍要求[FROM.GetLeader]下臺，並將[FROM.GetName]的行政管理權移交給軍隊。我們要麼接受他們的最後通牒，要麼準備擊退他們。"
 ARG_political_events.1.a: "我們無能為力"
 ARG_political_events.1.b: "我們不能讓他們得逞！"
 ARG_political_events.2.t: "[USA.GetName]要求對[GER.GetAdjective]禁運！"
 ARG_political_events.2.desc: "儘管我們致力於置身於這場衝突之外，但[USA.GetAdjective]外交官繼續向我們施加壓力，要求我們與[GER.GetAdjective]朋友斷交。今天上午，我們被堅決要求對[GER.GetName]實行禁運，以維持美洲大陸的和平。這讓我們陷入了困境，而置身於這場戰爭之外的日子也變得越來越困難。"
 ARG_political_events.2.a: "我們別無選擇"
 ARG_political_events.2.b: "我們現在還不想斷交"
 ARG_political_events.3.t: "[ARG.GetName]提議加入同盟國"
 ARG_political_events.3.desc: "[ARG.GetName]總統[ARG.GetLeader]今天來找我們申請加入同盟國，共同對抗敵人。看來，面對這樣的逆境，我們要求美洲團結一致的要求終於得到了回應。"
 ARG_political_events.3.a: "這只是時間問題"
 ARG_political_events.4.t: "[USA.GetName]對我們禁運"
 ARG_political_events.4.desc: "今天早上我們收到了[USA.GetName]官方的禁運聲明。有人說，我們在全球衝突中保持中立的決定與門羅主義所主張的一切背道而馳。因此，在另行通知之前，我們將受到制裁。看來我們對中立的堅持激怒了我們北方的鄰居。"
 ARG_political_events.4.a: "真不幸"
 ARG_political_events.5.t: "[ARG.GetName]要求南大西洋諸島的所有權"
 ARG_political_events.5.desc: "多年來，福克蘭群島和南喬治亞島一直是[ENG.GetAdjective]的主權領土。然而，[ARG.GetAdjective]政府似乎已經正式要求將這些島嶼交由他們照管，以便在這段艱難時期更好地保護南大西洋。"
 ARG_political_events.5.a: "這些島嶼是他們的"
 ARG_political_events.5.b: "我們不能白白放走這些島嶼……"
 ARG_political_events.5.c: "絕對不行"
 ARG_political_events.6.t: "[FROM.GetName] 同意了我們的提議！"
 ARG_political_events.6.desc: "[FROM.GetAdjective]政府已接受我方接管福克蘭群島和南喬治亞島的提議。鑑於這些島嶼已正式迴歸阿根廷，我們可以開始在這場衝突中保衛我國水域的工作了。"
 ARG_political_events.6.a: "好極了！"
 ARG_political_events.7.t: "[FROM.GetName]要求我們為島嶼支付費用。"
 ARG_political_events.7.desc: "儘管我們努力說服[FROM.GetAdjective]這些島嶼應歸屬[ARG.GetName]，但其政府提出以支付款項為條件移交土地。這將對我國經濟造成輕微打擊，但從長遠來看，擁有這片領土將為我們帶來更大利益。"
 ARG_political_events.7.a: "雖然不理想，但我們會接受"
 ARG_political_events.8.t: "[FROM.GetName]拒絕放棄島嶼。"
 ARG_political_events.8.desc: "遺憾的是，我們的提議未被採納。[FROM.GetAdjective]政府認為這些島嶼最好仍由其保護。雖然這令人失望，但至少我們知道盟友就在附近。"
 ARG_political_events.8.a: "令人失望"
 ARG_political_events.9.t: "內戰就要來了"
 ARG_political_events.9.desc: "拉蒙·卡斯蒂略在政府內部鞏固權力的結果是，該國軍事領導人不斷增長的不滿之火又火上澆油。他們已經決定不再忍受，在儘可能多地聚集力量後，他們已經發動了叛軍，向布宜諾斯艾利斯進軍！看起來[ARG.GetAdjective]內戰已經開始了。"
 ARG_political_events.9.a: "集結我們剩下的部隊！"
 ARG_political_events.10.t: "壓制軍隊的不滿情緒"
 ARG_political_events.10.desc: "今天早上，[ARG.GetLeader]總統召集了他們的顧問最終確定了聯邦干預法案。在這樣做的過程中，政府最終壓制了那些在軍隊中煽動叛亂的人。重建我們對軍隊的忠誠可能需要一段時間，但為了避免像內戰這樣的全國性災難，這是值得的。"
 ARG_political_events.10.a: "好險……"
 ARG_political_events.11.t: "軍事叛亂迫在眉睫"
 ARG_political_events.11.desc: "我們得到消息，我們的最高軍事官員已經脫離政府，並召集他們的支持者，試圖控制[ARG.GetAdjective]的政治。我們不能讓他們到達布宜諾斯艾利斯。是時候為[ARG.GetAdjective]內戰做準備了。"
 ARG_political_events.11.a: "準備好抵抗叛軍，保衛[ARG.GetName]！"
 ARG_political_events.12.t: "[ARG.GetNameDefCap]尋求加入軸心國"
 ARG_political_events.12.desc: "我們今天從一位[ARG.GetAdjective]外交官那裡得到消息，他們的政府正在申請加入軸心國。如果我們接受，這將是我們在南美大陸的一個立足點。我們該如何回應？"
 ARG_political_events.12.a: "我們將歡迎我們的新盟友"
 ARG_political_events.12.b: "他們的提議對我們毫無意義"
 ARG_political_events.13.t: "[GER.GetNameDefCap]接受了我們的申請！"
 ARG_political_events.13.desc: "我們從[GER.GetAdjective]大使館收到了回信，我們很高興地宣佈，他們已接受我們加入軸心國。這是一個強大聯盟的開始。"
 ARG_political_events.13.a: "太棒了！"
 ARG_political_events.14.t: "[GER.GetNameDefCap]拒絕了我們的申請！"
 ARG_political_events.14.desc: "儘管我們作出了堅定的努力，[GER.GetAdjective]政府還是拒絕了我們加入軸心國的申請。看來我們得單幹了。"
 ARG_political_events.14.a: "令人惋惜……"
 ARG_political_events.15.t: "[ARG.GetNameDefCap]發出最後通牒"
 ARG_political_events.15.desc: "根據[ARG.GetAdjective]駐[ROOT.Capital.GetCapitalVictoryPointName]大使的說法，我們的現任政府必須下臺，取而代之的是一個[ARG.GetAdjective]的傀儡。我們的拒絕很有可能導致宣戰。我們必須做出明智的選擇。"
 ARG_political_events.15.a: "我們擋不住他們"
 ARG_political_events.15.b: "我們不會簽字放棄主權"
 ARG_political_events.16.t: "[PAR.GetNameDefCap]同意最後通牒的條款"
 ARG_political_events.16.desc: "[PAR.GetAdjective]政府已經決定同意我們在最後通牒中提出的條件。我們將立即掌控他們的土地，並儘快建立[ARG.GetAdjective]的統治。"
 ARG_political_events.16.a: "太棒了！"
 ARG_political_events.17.t: "[PAR.GetNameDefCap]拒絕最後通牒的條款"
 ARG_political_events.17.desc: "[PAR.GetAdjective]政府已經決定拒絕我們為他們提出的條件。這是不可接受的。我們要麼放棄不管，要麼讓我們的軍隊為戰爭做好準備。"
 ARG_political_events.17.a: "放棄吧，不值得……"
 ARG_political_events.17.b: "他們會後悔拒絕我們的！"
 ARG_political_events.18.t: "[ARG.GetNameDefCap]讓步"
 ARG_political_events.18.desc: "我們堅持了自己的立場之後，[ARG.GetAdjective]政府似乎認為採取這種行動是不值得的。我們現在可以放心了，因為威脅目前已被遏制。"
 ARG_political_events.18.a: "那就放心了……"
 ARG_political_events.19.t: "[ARG.GetNameDefCap]發出最後通牒"
 ARG_political_events.19.desc: "根據[ARG.GetAdjective]駐[ROOT.Capital.GetCapitalVictoryPointName]大使的說法，我們的現任政府必須下臺，取而代之的是一個[ARG.GetAdjective]的傀儡。我們的拒絕很有可能導致宣戰。我們必須做出明智的選擇。"
 ARG_political_events.19.a: "我們擋不住他們"
 ARG_political_events.19.b: "我們不會簽字放棄主權"
 ARG_political_events.20.t: "[URG.GetNameDefCap]同意最後通牒的條款"
 ARG_political_events.20.desc: "[URG.GetAdjective]政府已經決定同意我們在最後通牒中提出的條件。現在我們可以正式實施我們的[GER.GetAdjective]盟友多年前制定的殖民計劃了。他們肯定會對事態的這一轉變感到高興。"
 ARG_political_events.20.a: "太棒了！"
 ARG_political_events.21.t: "[URG.GetNameDefCap]拒絕最後通牒的條款"
 ARG_political_events.21.desc: "[URG.GetAdjective]政府已經決定拒絕我們為他們提出的條件。如果我們認為這樣做是不值得的，那麼我們可以放棄。否則，讓我們的部隊做好入侵準備吧。"
 ARG_political_events.21.a: "放棄吧，不值得……"
 ARG_political_events.21.b: "他們會後悔拒絕我們的！"
 ARG_political_events.22.t: "[ARG.GetNameDefCap]執行殖民計劃"
 ARG_political_events.22.desc: "今天上午，[ARG.GetAdjective]駐[GER.capital.GetCapitalVictoryPointName]大使告訴我們，[ARG.GetNameDef]按照我們以前對[URG.GetNameDef]的殖民計劃，使那個國家成為了傀儡國。這是個好消息，因為這將擴大[GER.GetAdjective]在那片大陸的影響力。"
 ARG_political_events.22.a: "事實證明，他們是有價值的盟友"
 ARG_political_events.23.t: "[ARG.GetNameDefCap]讓步"
 ARG_political_events.23.desc: "我們堅持了自己的立場之後，[ARG.GetAdjective]政府似乎認為採取這種行動是不值得的。我們現在可以放心了，因為威脅目前已被遏制。"
 ARG_political_events.23.a: "那就放心了……"
 ARG_political_events.24.t: "[ARG.GetNameDefCap]尋求結盟"
 ARG_political_events.24.desc: "我們已經收到來自[ARG.GetNameDef]的消息，他們希望邀請我們加入他們的聯盟。他們提出如果我們接受，會將火地島和聖克魯斯割讓給我們。這是一個非常誘人的提議……"
 ARG_political_events.24.a: "與他們站在一起是有好處的"
 ARG_political_events.24.b: "我們決不會與[ARG.GetNameDef]站在一起！"
 ARG_political_events.25.t: "[CHL.GetNameDefCap]同意加入我們的陣營"
 ARG_political_events.25.desc: "好消息！[CHL.GetAdjective]政府決定與我們結盟。我們將能像兄弟一樣共同對抗北方的威脅。這是一個重要的日子，我們朝著統一的南美洲的方向邁出了正確的一步。"
 ARG_political_events.25.a: "[ARG.GetNameDef]和[CHL.GetNameDef]站在了一起！"
 ARG_political_events.26.t: "[CHL.GetNameDefCap]拒絕加入我們的陣營"
 ARG_political_events.26.desc: "[CHL.GetAdjective]政府固執地拒絕加入我們征服整個大陸的目標。雖然我們不能強迫他們參與這場戰爭，但我們仍可以將我們正義的戰爭帶到他們家門口。不管怎樣，這對我們兩國關係來說都是悲傷的一天。"
 ARG_political_events.26.a: "真是令人失望……"
 ARG_political_events.27.t: "[ARG.GetNameDefCap]發出最後通牒"
 ARG_political_events.27.desc: "根據[ARG.GetAdjective]駐[ROOT.Capital.GetCapitalVictoryPointName]大使的說法，我們的現任政府必須下臺，取而代之的是一個[ARG.GetAdjective]的傀儡。我們的拒絕很有可能導致宣戰。我們必須做出明智的選擇。"
 ARG_political_events.27.a: "我們擋不住他們"
 ARG_political_events.27.b: "我們不會簽字放棄主權"
 ARG_political_events.28.t: "[CHL.GetNameDefCap]同意最後通牒的條款"
 ARG_political_events.28.desc: "[CHL.GetAdjective]政府已經決定同意我們在最後通牒中提出的條件。我們將立即掌控他們的土地，並儘快建立[ARG.GetAdjective]的統治秩序。"
 ARG_political_events.28.a: "太棒了！"
 ARG_political_events.29.t: "[CHL.GetNameDefCap]拒絕最後通牒的條款"
 ARG_political_events.29.desc: "[CHL.GetAdjective]政府已經決定拒絕我們為他們提出的條件。考慮到他們國家的規模和實力，我們可以選擇放棄。要麼我們也可以集結軍隊，開始準備入侵。"
 ARG_political_events.29.a: "放棄吧，不值得……"
 ARG_political_events.29.b: "他們會後悔拒絕我們的！"
 ARG_political_events.30.t: "[ARG.GetNameDefCap]讓步"
 ARG_political_events.30.desc: "我們堅持了自己的立場之後，[ARG.GetAdjective]政府似乎認為採取這種行動是不值得的。我們現在可以放心了，因為威脅目前已被遏制。"
 ARG_political_events.30.a: "那就放心了……"
 ARG_political_events.31.t: "奧斯馬爾·赫爾穆特的問題"
 ARG_political_events.31.desc: "在往屆政府執政期間，一名[GER.GetAdjective]裔[ARG.GetAdjective]男子在被派往[GER.GetNameDef]執行秘密任務後在一艘船上被捕。我們可以為他的釋放進行交涉，讓他加入我們新成立的情報機構，或者我們可以把他留在監獄裡，並堅持我們對待間諜的立場。"
 ARG_political_events.31.a: "釋放赫爾穆特，我們可以利用他的技能"
 ARG_political_events.31.b: "我們堅持立場，讓他留在獄中"
 ARG_political_events.32.t: "[ARG.GetNameDefCap]尋求我們放棄這些島嶼"
 ARG_political_events.32.desc: "今天上午，我們從[ARG.GetAdjective]駐[ENG.Capital.GetCapitalVictoryPointName]大使那裡得到消息，[ARG.GetAdjective]政府已正式佔領福克蘭和南喬治亞諸島。因此，他們要求我們把領土割讓給他們，結束這場戰爭。"
 ARG_political_events.32.a: "接受他們的條件，我們有更大的威脅要處理"
 ARG_political_events.32.b: "我們永遠不會把這些島嶼拱手讓人！"
 ARG_political_events.33.t: "[ENG.GetNameDefCap]同意割讓島嶼"
 ARG_political_events.33.desc: "今天，福克蘭和南喬治亞諸島終於落入[ARG.GetAdjective]之手。[ENG.GetNameDefCap]已經簽署了割讓文件，以換取和平。我們可以提供這種和平，尤其是現在這片屬於[ARG.GetAdjective]領土終於回到了我們手中。"
 ARG_political_events.33.a: "勝利屬於我們！"
 ARG_political_events.34.t: "[ENG.GetNameDefCap]拒絕屈服"
 ARG_political_events.34.desc: "[ENG.GetAdjective]人頑固地拒絕向我們交出福克蘭和南喬治亞諸島。看來，儘管他們損失慘重，他們仍渴望繼續流血。這是他們的權利。如有必要，我們將把他們趕回[ENG.Capital.GetCapitalVictoryPointName]。"
 ARG_political_events.34.a: "戰爭繼續"
 ARG_political_events.35.t: "[ENG.GetNameDefCap]提議割讓這些島嶼"
 ARG_political_events.35.desc: "一位[ENG.GetAdjective]大使今天向我們提出如果我們能保證結束這場戰爭就把南大西洋諸島割讓給我們。由於我們的目標是奪取福克蘭和南喬治亞諸島，這將對我們有利。"
 ARG_political_events.35.a: "我們得到了我們想要的，簽署條約吧"
 ARG_political_events.35.b: "我們要把這場戰爭打到[ENG.Capital.GetCapitalVictoryPointName]！"
 ARG_political_events.36.t: "[ARG.GetNameDefCap]同意和平"
 ARG_political_events.36.desc: "幸運的是，[ARG.GetAdjective]政府已經同意在我們提出的條件下停止戰爭。不得不放棄福克蘭和南喬治亞諸島將是一種恥辱，但我們必須把我們的軍力集中在其他地方。"
 ARG_political_events.36.a: "那就放心了……"
 ARG_political_events.37.t: "[ARG.GetNameDefCap]拒絕結束敵對狀態"
 ARG_political_events.37.desc: "壞消息。[ARG.GetAdjective]政府拒絕了我們以割讓島嶼換取和平的提議。我們必須為進一步的戰鬥做準備，現在我們必須在另一條戰線上消耗我們的資源。"
 ARG_political_events.37.a: "他們竟然敢！"
 ARG_political_events.38.t: "[ARG.GetNameDef]索取赤道幾內亞作為賠償"
 ARG_political_events.38.desc: "[ARG.GetNameDefCap]領導人與我們洽談，要求我們交出對赤道幾內亞土地的控制權，以報答他們在我們最近對抗共和派的戰爭中對我們的支持。我們可能需要慎重考慮我們的選擇。"
 ARG_political_events.38.a: "絕無可能"
 ARG_political_events.38.a.tt: "這可能會損害我們與§Y[ARG.GetName]§!的關係……"
 ARG_political_events.38.b: "為我們的勝利付出的小小代價"
 ARG_political_events.38.b.tt: "把§Y赤道幾內亞§!移交給§Y[ARG.GetName]§!"
 ARG_political_events.39.t: "[SPA.GetNameDefCap]拒絕我們的要求"
 ARG_political_events.39.desc: "我們的要求遭到了[SPA.GetNameDef]傲慢的拒絕。[SPA.GetAdjective]領導層聲稱我們的要求太過於苛刻，與我們在戰爭期間的貢獻無法相配。"
 ARG_political_events.39.a: "真不幸"
 ARG_political_events.40.t: "[SPA.GetNameDefCap]同意我們的要求"
 ARG_political_events.40.desc: "我們剛剛得到了好消息，[SPA.GetNameDef]同意了我們的要求，我們獲得了赤道幾內亞的所有權，作為我們在他們最近內戰中提供幫助的回報。"
 ARG_political_events.40.a: "這樣我們在非洲就有了立足之地！"
 ARG_political_events.41.t: "羅多爾福·吉奧爾迪回到[ARG.GetNameDef]"
 ARG_political_events.41.desc: "1931年，由於羅多爾福·吉奧爾迪的社會主義傾向，他的生命受到威脅並逃離了[ARG.GetNameDef]。與此同時，他努力支持[BRA.GetNameDef]的共產主義起義，試圖罷免政府中的熱圖利奧·瓦加斯。現在，[ARG.GetNameDef]政治風向左轉，據稱吉奧爾迪願意回到自己的祖國，領導阿根廷共產黨。"
 ARG_political_events.41.a: "這將有助於我們走向革命的道路！"
 ARG_political_events.42.t: "[ARG.GetNameDefCap]求援"
 ARG_political_events.42.desc: "我們從[ARG.GetNameDef]的同志那裡得到消息，他們希望我們能支持他們不斷壯大的革命運動。一旦發生內戰，他們希望我們派遣志願軍幫助他們推翻好戰的政府。"
 ARG_political_events.42.a: "讓我們向社會主義同仁提供援助吧"
 ARG_political_events.42.b: "我們現在無法抽調任何人手……"
 ARG_political_events.43.t: "[SOV.GetNameDefCap]同意提供援助"
 ARG_political_events.43.desc: "好消息，同志！[SOV.GetNameDefCap]已同意在我們宣佈光榮革命後內戰爆發的情況下派遣志願軍！如果真發生了這種情況，這應該能讓我們更加安心。"
 ARG_political_events.43.a: "好極了！"
 ARG_political_events.44.t: "[SOV.GetNameDefCap]拒絕提供援助"
 ARG_political_events.44.desc: "不幸的消息，同志。[SOV.GetNameDefCap]拒絕在我們國家爆發內戰時派遣志願軍。看起來，如果我們光榮的革命演變成暴力，我們將獨自面對我們的資產階級壓迫者……"
 ARG_political_events.44.a: "我們孤軍奮戰……"
 ARG_political_events.50.t: "[FROM.FROM.GetName]的小規模工人罷工"
 ARG_political_events.50.desc: "很不幸，我們在[FROM.FROM.GetName]鼓動工人罷工的嘗試似乎並沒有完全按計劃進行。我們的演講者吸引到了一些去上班的工人的注意。雖然我們成功將少許人拉入我們的事業，但我們仍必須努力說服民眾反對壓迫的上層階級。"
 ARG_political_events.50.a: "下一次會更好……"
 ARG_political_events.51.t: "[FROM.FROM.GetName]的工人罷工"
 ARG_political_events.51.desc: "儘管與經理和法西斯煽動者起了衝突，但[FROM.FROM.GetName]的罷工成功吸引了一大批支持者。阿根廷共產黨領導層就一個無階級劃分的國家未來發表了多次演講，人群中響起了歡呼和吶喊。當地黨支部已宣佈，自集會以來，黨員人數有所增加。"
 ARG_political_events.51.a: "我們在群眾中越來越受歡迎"
 ARG_political_events.52.t: "[FROM.FROM.GetName]的大規模工人罷工"
 ARG_political_events.52.desc: "一群憤怒的不滿工人正在高聲呼喊和怒吼，掀起了一場巨大的支持浪潮，有力地支持阿根廷共產黨。工廠車間空空如也，辦公室空無一人，還有農村的農民，所有人聚集在一起共同捍衛自己的權利，表達對統治階層的憤怒。我們的影響力日益擴大，革命每天都得到更多的支持。"
 ARG_political_events.52.a: "很快我們的目標將成為現實！"
 ARG_political_events.60.t: "[ARG.GetNameDefCap]邀請我們加入他們的陣營"
 ARG_political_events.60.desc: "[ARG.GetNameDefCap]與我國接觸，邀請我們加入他們的共產主義聯盟。我們要和革命的兄弟們攜手嗎？"
 ARG_political_events.60.a: "讓我們團結一致！"
 ARG_political_events.60.b: "我們必須孤軍奮戰"
 ARG_political_events.61.t: "[FROM.GetNameDefCap]接受我方提案"
 ARG_political_events.61.desc: "[FROM.GetNameDefCap]和善地決定接受提案，加入我們的聯盟，現在我們站在一起永垂史冊。"
 ARG_political_events.61.a: "我們將共同維護革命的理想"
 ARG_political_events.62.t: "[FROM.GetNameDefCap]拒絕我方提案"
 ARG_political_events.62.desc: "[FROM.GetNameDefCap]拒絕了我們聯合起來組成社會主義共和國聯盟的提議。難道他們沒有意識到誰掌握著這片大陸的權力嗎？也許在適當的時候，我們會告訴他們。"
 ARG_political_events.62.a: "讓我們等待時機……"
 ARG_political_events.70.t: "布宜諾斯艾利斯會議開始"
 ARG_political_events.70.desc: "我們新的共產主義政府終於達到了穩定的程度，使我們能夠召開第一次布宜諾斯艾利斯會議。在這裡，我們可以決定阿根廷共產黨的未來，以及誰可能適合在未來幾年管理這個國家。今年，我們有兩位強有力的候選人，他們對[ARG.GetNameDef]的未來有著不同的看法。我們的現任領導人範妮·埃德爾曼將繼續維持現狀，提供穩定，並關注[ARG.GetNameDef]在世界舞臺上的地位。另一方面，安東尼奧·索托曾經是巴塔哥尼亞叛亂分子，他認為我們應該努力讓[ARG.GetNameDef]走上安那其工團主義的道路。誰應該接過[ARG.GetNameDef]總理的衣缽？"
 ARG_political_events.70.a: "範妮·埃德爾曼應該繼續執政"
 ARG_political_events.70.b: "安東尼奧·索托是更好的選擇"
 ARG_political_events.71.t: "範妮·埃德爾曼繼續擔任總理"
 ARG_political_events.71.desc: "在壓倒性的決定中，範妮·埃德爾曼得以保住自己在政府中的地位。[ARG.GetNameDef]想要的道路似乎是一條以穩定和增長為基礎的道路。競爭對手安東尼奧·索托已經回到巴塔哥尼亞，並同意跟隨埃德爾曼的計劃。"
 ARG_political_events.71.a: "歡迎回來，埃德爾曼總理！"
 ARG_political_events.72.t: "安東尼奧·索托建立阿根廷安那其工團主義"
 ARG_political_events.72.desc: "出乎意料的是，安東尼奧·索托成功地贏得了大會的支持，併成為[ARG.GetNameDef]的新領導人，他曾渴望看到這個頭銜在適當的時候被取消。索托希望帶領國家走上一條新的道路，沿著安那其工團主義的道路，最終廢除國內任何形式的等級制度。"
 ARG_political_events.72.a: "令人不安但嶄新的未來"
 ARG_political_events.80.t: "加強教育資助"
 ARG_political_events.80.desc: "新當選的政府最重要的政策之一是[ARG.GetNameDef]教育的未來。我們最近對學術界的資助有些不足，這已經不是什麼秘密了，所以我們要決定在哪個方向提供資助，以及最終我們的學校系統將專注於發展什麼領域。"
 ARG_political_events.80.a: "資助電子教育"
 ARG_political_events.80.b: "資助工業教育"
 ARG_political_events.80.c: "資助合成研究"
 ARG_political_events.81.t: "資助電子教育"
 ARG_political_events.81.desc: "我們啟動最新的教育資助計劃後，受到了全國各地學者們的一致好評。既然我們選擇把重點放在教育人們瞭解電子技術的奇蹟上，我們可以期待我們的研究部門會穩步發展。"
 ARG_political_events.81.a: "這錢花得值"
 ARG_political_events.82.t: "資助工業教育"
 ARG_political_events.82.desc: "我們啟動最新的教育資助計劃後，受到了全國各地學者們的一致好評。由於我們選擇專注於教育人們瞭解新工業發展的效率，我們可以預期我們的研究部門將穩步發展。"
 ARG_political_events.82.a: "這錢花得值"
 ARG_political_events.83.t: "資助合成研究補助金"
 ARG_political_events.83.desc: "我們啟動最新的教育資助計劃後，受到了全國各地學者們的一致好評。由於我們選擇專注於教育人們現代合成精煉的技術，我們可以預期我們的研究部門將穩步發展。"
 ARG_political_events.83.a: "這錢花得值"
 ARG_political_events.90.t: "與[ARG.GetNameDef]舉行聯合軍事演習"
 ARG_political_events.90.desc: "為了增進與我們的關係，[ARG.GetNameDef]的[ARG.GetLeader]提議舉辦聯合軍事演習，訓練我們的海軍和空軍。在這些黑暗的日子裡，這種溫暖的姿態非常受歡迎。"
 ARG_political_events.90.a: "我們的軍隊比以往任何時候都更加強大"
 ARG_political_events.100.t: "[ARG.GetNameDefCap]邀請我們加入他們的陣營"
 ARG_political_events.100.desc: "[ARG.GetNameDefCap]已經向我們伸出橄欖枝，邀請我們加入他們的聯盟。我們是否應該攜手並幫助保護南美洲的民主？"
 ARG_political_events.100.a: "讓我們團結一致！"
 ARG_political_events.100.b: "我們必須孤軍奮戰"
 ARG_political_events.101.t: "[FROM.GetNameDefCap]接受我們的提議"
 ARG_political_events.101.desc: "[FROM.GetNameDefCap]慷慨地決定接受我們的提議加入我們的聯盟，如今我們共同成為南美洲和平與民主的堡壘。"
 ARG_political_events.101.a: "我們將一起堅守戰線，保護人民！"
 ARG_political_events.102.t: "[FROM.GetNameDefCap]拒絕我們的提議"
 ARG_political_events.102.desc: "[FROM.GetNameDefCap]拒絕了我們邀請他們加入聯盟的提議。難道他們沒有意識到團結起來我們會更強大嗎？讓我們希望他們不會後悔拒絕我們的那一天。"
 ARG_political_events.102.a: "也許下次吧……"
 ARG_political_events.110.t: "[FROM.GetNameDefCap]對[URG.GetNameDef]採取侵略行動"
 ARG_political_events.110.desc: "看來我們的擔憂已成為現實，[FROM.GetNameDef]對[URG.GetNameDef]採取了激進姿態。由於後者是我們的近鄰，我們不能冒著任由他們被外國侵略的風險。如果我們不小心，[FROM.GetNameDef]將會敲響我們的大門。"
 ARG_political_events.110.a: "我們應該升級這個問題！"
 ARG_political_events.110.b: "採取行動風險過大……"
 ARG_political_events.111.t: "[FROM.GetNameDefCap]要求我們撤出[URG.GetNameDef]"
 ARG_political_events.111.desc: "作為對我們在[URG.GetNameDef]行動的回應，[FROM.GetNameDef]要求我們立即撤軍並結束敵對行動。如果我們拒絕，可能會導致與[FROM.GetNameDef]的全面戰爭。"
 ARG_political_events.111.a: "讓他們來吧！"
 ARG_political_events.111.b: "我們別無選擇，只能撤軍"
 ARG_political_events.120.t: "陌生的訪客"
 ARG_political_events.120.desc: "今天早上，一個講著糟糕西班牙語的陌生德國男子走進玫瑰宮，大聲說他對[ARG.GetNameDef]的未來有著偉大的計劃。他看起來能夠勝任這份工作，而且非常有說服力。我們要把政府移交給他嗎？"
 ARG_political_events.120.a: "當然！這能出什麼問題？"
 ARG_political_events.120.b: "絕對不行"
 ARG_news_events.1.t: "[ARG.GetNonIdeologyName]採取咄咄逼人的外交政策"
 ARG_news_events.1.d: "[ARG.GetAdjective]政府最近在外交政策問題上採取了越來越好戰和強硬的立場。隨著臭名昭著的十年以如此迅速的政權更迭而結束，[ARG.GetNonIdeologyName]似乎為擴張的可能性做好了準備。今天上午，[ARG.GetAdjective]領導人[ARG.GetLeader]向全國發表講話，並向人民保證，一個偉大的時代即將到來，其目標是將南美洲團結在一個強大而穩定的旗幟下。"
 ARG_news_events.1.a: "這些都只是花言巧語，不是嗎？"
 ARG_political_events.73.t: "[FROM.GetNameDefCap]尋求更緊密的合作"
 ARG_political_events.73.desc: "[ARG.GetAdjective]外交官剛剛聯繫我們，要求在我們在最近與他們達成的貿易協議基礎上加強合作，因為他們的意識形態越來越接近我們。當前的請求是簽署一項我們兩國之間的互不侵犯條約，同時保證他們的獨立。"
 ARG_political_events.73.a: "我們讚賞他們的願望，他們當然應該得到條約和保證！"
 ARG_political_events.73.b: "我們可以給他們一個互不侵犯條約，但僅此而已"
 ARG_political_events.73.c: "這有點太過分了"
 ARG_political_events.74.t: "[FROM.GetNameDefCap]同意保證我們的獨立並簽署互不侵犯條約"
 ARG_political_events.74.desc: "\n我們剛剛收到[FROM.GetNameDef]的回覆。他們讚揚我們最近為扭轉我國局勢和恢復民主所作的努力，決定同意我們的要求。這樣一來，我們的國家就得到了鞏固，我們被宣戰的可能性也大大降低了。"
 ARG_political_events.74.a: "太棒了！"
 ARG_political_events.74.tt: "[FROM.GetFlag]§Y[FROM.GetNameDefCap]§!現在開始保證我們的獨立！\n我們已經與[FROM.GetFlag]§Y[FROM.GetNameDefCap]§!簽訂了§Y互不侵犯條約§!！"
 ARG_political_events.75.t: "[FROM.GetNameDefCap]同意簽訂互不侵犯條約"
 ARG_political_events.75.desc: "我們剛剛收到[FROM.GetNameDef]的回覆。他們讚揚我們最近為扭轉我國局勢和恢復民主所作的努力，但是，他們只是部分地同意了我們的要求。一項互不侵犯條約已經簽署，但遺憾的是，他們目前不會保證我們的獨立。"
 ARG_political_events.75.a: "總比沒有好……"
 ARG_political_events.75.tt: "我們與[FROM.GetFlag]§Y[FROM.GetNameDefCap]§!簽訂了§Y互不侵犯條約§!！"
 ARG_political_events.76.t: "[FROM.GetNameDefCap]拒絕我們更緊密合作的請求"
 ARG_political_events.76.desc: "我們剛剛收到[FROM.GetNameDef]的回覆。他們讚揚我們重建民主的努力，但不認為保障我們獨立或與我們簽訂互不侵犯條約對他們有利。"
 ARG_political_events.76.a: "真不幸"
 ARG_news_events.2.t: "拉普拉塔河口海戰"
 ARG_news_events.2.d: "今晨，德國海軍重型巡洋艦施佩伯爵海軍上將號在南大西洋拉普拉塔河遭遇了一支皇家海軍分艦隊。在接下來的戰鬥中，數艘[ENG.GetAdjective]船隻遭受嚴重損壞，被迫撤離並前往福克蘭群島。而施佩伯爵號除了燃油系統受到致命一擊，陷入癱瘓外，只受到輕微損毀。這艘[GER.GetAdjective]軍艦逃進了[URG.GetNameDef]的蒙得維的亞港以進行緊急修復。許多消息來源聲稱，這是這場衝突的第一場海戰，而這似乎表明戰爭終於來到了南美大陸。"
 ARG_news_events.2.a: "希望[ENG.GetAdjective]人也逃脫了。"
 ARG_news_events.2.b: "[GER.GetAdjective]人無權來此。"
 ARG_news_events.2.c: "令人不安的消息。"
 ARG_news_events.3.t: "[ARG.GetAdjective]共產主義革命"
 ARG_news_events.3.d: "[ARG.GetNonIdeologyName]持續不斷的騷亂已於近日失控，致使內戰爆發。在曾經流亡海外的羅多爾福·吉奧爾迪的領導和[ARG.GetAdjective]國會中眾多左傾成員的支持下，共產主義者脫離了政府，試圖控制全國並施行激進的改革。該區域的許多人擔心，共產主義[ARG.GetNonIdeologyName]將引發一場席捲南美大陸的多米諾效應。"
 ARG_news_events.3.a: "悲劇就這樣發生了。"
 #GUAY
 JUNO_guay_events.1.t: "軍官支持政府"
 JUNO_guay_events.1.desc: "軍官們已表達對執政政府的支持。安撫策略奏效了，看來投入軍隊的資金還有一些額外的好處。"
 JUNO_guay_events.1.a: "太好了"
 JUNO_guay_events.2.t: "[FROM.GetNameDefCap]希望我們投資建設水壩"
 JUNO_guay_events.2.desc: "[FROM.GetName]尋求工業化。作為一個河流眾多的國家，水壩顯然是電氣化的首選。如果我們決定投資，我們可以期待款項在2年內得到償清。"
 JUNO_guay_events.2.a: "很好的投資"
 JUNO_guay_events.2.tt: "[FROM.GetName]需要在2年內償清我們的款項，除非他們與我們開戰。"
 JUNO_guay_events.2.b: "沒興趣"
 JUNO_guay_events.3.t: "[FROM.GetName]接受！"
 JUNO_guay_events.3.desc: "[FROM.GetName]已接受對我國的投資。這一定會讓我們走得更近！"
 JUNO_guay_events.3.a: "太好了！"
 JUNO_guay_events.4.t: "[FROM.GetName]拒絕！"
 JUNO_guay_events.4.desc: "[FROM.GetName]已拒絕對我國投資的提議。這無疑是一次外交上的失敗。"
 JUNO_guay_events.4.a: "實打實的挫折"
 JUNO_guay_events.5.t: "償還水壩投資"
 JUNO_guay_events.5.desc: "向[?var:old_world_power.GetName]償還債務的時間到了。雖然這會暫時傷害我們的經濟，但正如任何優秀的經濟學家所說，如果投資得當，債務並不總是壞事。"
 JUNO_guay_events.5.a: "凡事都有代價"
 JUNO_guay_events.6.t: "[FROM.GetAdjective]軍事進程"
 JUNO_guay_events.6.desc: "儘管[FROM.GetAdjective]軍隊規模較小，但在領土和軍事上卻比我們自己的軍隊取得了更為顯著進展。爭議領土現已完全落入[FROM.GetName]手中，大大降低了我們在該區域的合法性。我們必須在繼續這場肯定會使我們的軍隊士氣低落的戰爭和放棄我們失去的領土之間做出選擇。"
 JUNO_guay_events.6.a: "我們不能繼續這場無果的戰爭"
 JUNO_guay_events.6.b: "這片領土本就屬於我們"
 JUNO_guay_events.7.t: "[FROM.GetName]屈服"
 JUNO_guay_events.7.desc: "我們勝利的部隊已將敵人從我們合法的領土上趕走。[FROM.GetName]已決定放棄並將領土交給我們，而不是打一場註定失敗的戰鬥。對我們來說，這是一次光榮的勝利，他們卻不知道這只是開始。"
 JUNO_guay_events.7.a: "距離霸權更近一步"
 JUNO_guay_events.7.b: "實際上這進行得很順利，讓我們繼續吧"
 JUNO_guay_events.8.t: "[FROM.GetName]拒絕屈服"
 JUNO_guay_events.8.desc: "[FROM.GetName]通知我們，他們認為放棄對其核心領土的控制是一種侮辱。他們告訴我們，他們將繼續戰鬥，直到我們的政府被推翻，我們的軍隊被解散。"
 JUNO_guay_events.8.a: "結束這場鬧劇"
 JUNO_guay_events.9.t: "[FROM.GetName]償還水壩投資"
 JUNO_guay_events.9.desc: "[FROM.GetName]已償清了我們對他們基礎設施的投資債務。遵守這一協議使我們兩國關係更加緊密。"
 JUNO_guay_events.9.a: "真是巨大的恩惠"
 JUNO_guay_events.10.t: "[FROM.GetNameDef]決定繼續進攻"
 JUNO_guay_events.10.desc: "[FROM.GetNameDefCap]通知我們，不會有和平。很明顯，[FROM.Getname]打算完全吞併我們的國家。這是一場戰鬥至最後一人的全面戰爭。"
 JUNO_guay_events.10.a: "那就戰鬥到底吧"
 TOA_ven_blockade.1.t: "[FROM.GetName]封鎖石油運輸"
 TOA_ven_blockade.1.desc: "[FROM.GetName]在我們海岸外派遣了戰艦，試圖封鎖運往其對手的石油運輸。[FROM.GetAdjective]政府宣稱他們不尋求直接衝突，而是作為對敵人施加壓力的措施。這無疑是一次事態升級，儘管目前還沒有人受到傷害，但戰艦的存在使加拉加斯氣氛緊張。"
 TOA_ven_blockade.1.a: "我們無法對抗[FROM.GetName]"
 TOA_ven_blockade.1.b: "這是宣戰！"
 TOA_ven_blockade.2.t: "$TOA_ven_blockade.1.t$"
 TOA_ven_blockade.2.desc: "[FROM.GetName]採取了大膽且無理的措施，徹底封鎖了[VEN.GetName]。在加拉加斯外海已經發現了數艘主力艦，據說[VEN.GetAdjective]政府已得到通知，為了阻止我們兩國之間的石油貿易，他們國家遭到了全面封鎖。"
 TOA_ven_blockade.2.a: "明顯違反中立原則！"
 paraguay.1.t: "提高要塞開支的機會"
 paraguay.1.desc: "重建烏邁塔給予我們一個機會，可以增加國防開支，並在周邊地區添加額外的防禦工事，包括一座較小的要塞，以進一步防禦首都的河口。"
 paraguay.1.a: "好主意"
 paraguay.1.b: "這不在預算中"
 paraguay.1.tt: "§Y$PAR_rebuild_humaita$§!完成時添加額外："
 south_american_events.60.t: "[MEX.GetNameDefCap]煽動共產主義情緒"
 south_american_events.60.desc: "來自[MEX.GetNameDef]的共產主義者被發現在我國境內煽動示威活動。我們該如何應對？"
 south_american_events.60.a: "讓他們繼續。"
 south_american_events.60.b: "鎮壓這些社會主義煽動者！"
 south_american_events.61.t: "拉普拉塔河口海戰"
 south_american_events.61.desc: "德國海軍與皇家海軍在蒙得維的亞外激戰。受損嚴重的[GER.GetAdjective]船艦於00時10分左右在我們的港口拋錨，請求進行維修，而英國外交官則向我們施壓，要求我們強迫這艘船出海，在那裡它將不可避免地被皇家海軍摧毀。"
 south_american_events.61.a: "要求其離開我們的港口"
 south_american_events.61.b: "讓它留在港口並進行修理"
 south_american_events.62.t: "拉普拉塔河口海戰"
 south_american_events.62.desc: "06時18分左右，德國海軍和皇家海軍在蒙得維的亞外交戰。有報道稱，德國船隻受損嚴重，已進入烏拉圭首都港口避難。英國外交官正在向烏拉圭政府施壓，要求其根據《海牙公約》強迫該船離開港口，在那裡，等待的皇家海軍肯定會將其摧毀。"
 south_american_events.62.a: "有意思"
 south_american_news.20.t: "安的列斯統一"
 south_american_news.20.d: "安的列斯邦聯是拉蒙·艾梅特里奧·貝坦塞斯強烈提出的構想，他認為加勒比地區的土著居民需要團結成一個區域實體，以維護安的列斯國家的主權和福祉。這一理念在19世紀50年代至美西戰爭期間得到了最強有力的支持，此後逐漸消退。然而，在[FROM.GetLeader]統一該地區之後，這一理念再次復甦。現在，隨著安的列斯邦聯的宣告成立，安的列斯屬於安的列斯人這一點比以往任何時候都更加明確了！"
 south_american_news.20.a: "一個註定要失敗的想法"
 south_american_news.20.b: "安的列斯人的安的列斯！"
 south_american_events.63.t: "[MEX.GetNameDefCap]煽動法西斯情緒"
 south_american_events.63.desc: "來自[MEX.GetNameDef]的法西斯分子被發現在我國境內煽動示威。我們該如何應對？"
 south_american_events.63.a: "讓他們繼續。"
 south_american_events.63.b: "鎮壓這些法西斯煽動者！"
