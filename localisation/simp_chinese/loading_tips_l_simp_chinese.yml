l_simp_chinese:
 LOADING_TIP_0: "在別人書寫歷史時拱手旁觀是一種恥辱，誰獲勝並不重要。\n——貝尼托·墨索里尼"
 LOADING_TIP_1: "為了塑造偉人，即使是需要踢他們的屁股也要將其送上戰場，而這就是我應該乾的。\n——貝尼托·墨索里尼"
 LOADING_TIP_2: "每一位士兵在上陣前都必須明白，他所投身的這場小小的戰鬥，在整個大局中所起到的作用。\n——伯納德·L·蒙哥馬利"
 LOADING_TIP_3: "如果我們輸掉了空戰，那麼我們將會迅速在整場戰爭中落敗。\n——伯納德·L·蒙哥馬利"
 LOADING_TIP_4: "信任別人很好，但是，不信任更好。\n——貝尼托·墨索里尼"
 LOADING_TIP_5: "無論是從哲學還是信條的角度，我都不相信會有永久的和平。\n——貝尼托·墨索里尼"
 LOADING_TIP_6: "長頸鹿是無情的生物。"
 LOADING_TIP_7: "只要主權國家持有強大的武力，戰爭就無法避免。\n——阿爾伯特·愛因斯坦"
 LOADING_TIP_8: "投票者什麼都無法決定，計票者才決定一切。\n——約瑟夫·斯大林"
 LOADING_TIP_9: "歷史證明，從來就沒有不可戰勝的軍隊。\n——約瑟夫·斯大林"
 LOADING_TIP_10: "教皇！他有幾個師？\n——約瑟夫·斯大林"
 LOADING_TIP_11: "愉快是蘇聯最大的特色。\n——約瑟夫·斯大林"
 LOADING_TIP_12: "唯一而真正的力量來源於槍桿子。\n——約瑟夫·斯大林"
 LOADING_TIP_13: "一切不為發動戰爭而組建的聯盟都是愚蠢且無用的。\n——阿道夫·希特勒"
 LOADING_TIP_14: "偉大的騙子同時也是偉大的魔術師。\n——阿道夫·希特勒"
 LOADING_TIP_15: "如果今天我得作為一個革命者站在這裡，那麼我便是對抗這場革命的革命者。\n——阿道夫·希特勒"
 LOADING_TIP_16: "如果你編織一個足夠大的謊言並重復足夠多次，別人就會相信它。\n——阿道夫·希特勒"
 LOADING_TIP_17: "德意志要麼成為世界的主宰，要麼不復存在。\n——阿道夫·希特勒"
 LOADING_TIP_18: "成功包括毫不氣餒地從失敗走向失敗。\n——溫斯頓·丘吉爾"
 LOADING_TIP_19: "如果你正在穿越地獄，那就保持前進。\n——溫斯頓·丘吉爾"
 LOADING_TIP_20: "對民主最好的駁論就是和一個普通選民交談五分鐘。\n——溫斯頓·丘吉爾"
 LOADING_TIP_21: "無論未來何時發生戰爭，裝甲部隊都將起到決定性作用。\n——海因茨·古德里安"
 LOADING_TIP_22: "德國的新型豹式以及虎式坦克可以使用到其故障為止，但不要嘗試修復，它們的引擎、傳動還有懸掛都很爛。\n——蘇聯紅軍·軍械部"
 LOADING_TIP_23: "沒有哪個雜種是通過為國捐軀贏得一場戰爭的，贏得戰爭靠的是讓敵國那些可憐的雜種為他們的國家去死。\n——喬治·S·巴頓"
 LOADING_TIP_24: "一個即刻踐行的好計劃要強於一個下週執行的完美計劃。\n——喬治·S·巴頓"
 LOADING_TIP_25: "要麼領導我，要麼跟隨我，或者直接從我面前滾開。\n——喬治·S·巴頓"
 LOADING_TIP_26: "從沒有人能成功守住任何東西，只有進攻，進攻再進攻。\n——喬治·S·巴頓"
 LOADING_TIP_27: "戰爭也許是用武器打的，但要由人去獲得勝利，要由追隨者與領導者的精神去支持贏取勝利。\n——喬治·S·巴頓"
 LOADING_TIP_28: "當我第一次看見噴氣機的時候，我直接就把它打下來了。\n——查克·葉格，美國陸軍航空隊"
 LOADING_TIP_29: "特奧，這裡是海因裡希，剛剛打下兩架轟炸機，沒有彈藥了。我要撞過去了，再見，英靈殿再會！\n——海因裡希·埃爾勒，德國空軍"
 LOADING_TIP_30: "選拔優秀人才並協助他們盡其所能是領導力的一部分。\n——切斯特·W·尼米茲"
 LOADING_TIP_31: "這項行動有可能成功嗎？在物資和補給方面它處於可行範圍內嗎？\n——切斯特·W·尼米茲"
 LOADING_TIP_32: "在準備戰鬥時我總是發現計劃是毫無用處的，但是開展計劃的過程卻是不可或缺的。\n——德懷特·D·艾森豪威爾"
 LOADING_TIP_33: "決定兩條狗爭鬥勝負的並非它們的身板尺寸，而是它們為爭鬥所投入的力量大小。\n——德懷特·D·艾森豪威爾"
 LOADING_TIP_34: "毋庸置疑，當面臨存亡之憂時，人間就會爆發衝突，並且最終招致諸國間不幸的戰事。\n——東條英機"
 LOADING_TIP_35: "在單挑對決當中，勝利者是彈匣裡多一發子彈的人。\n——埃爾溫·隆美爾"
 LOADING_TIP_36: "我寧可當錘子而不是砧子。\n——埃爾溫·隆美爾"
 LOADING_TIP_37: "流汗不流血，流血不丟命，但是開動腦筋便可以兼顧二者。\n——埃爾溫·隆美爾"
 LOADING_TIP_38: "此前可憐的內維爾·張伯倫以為他能信任希特勒，他錯了。但是我不覺得我對斯大林的看法錯了。\n——溫斯頓·丘吉爾，雅爾塔會議後"
 LOADING_TIP_39: "我相信這是我們時代的和平。\n——內維爾·張伯倫，1938年，慕尼黑協定後"
 LOADING_TIP_40: "沒有一架敵人的轟炸機能到達魯爾。如果有一架到了魯爾，我就不姓戈林，你可以叫我邁耶。\n——赫爾曼·邁耶"
 LOADING_TIP_41: "我們只需往大門踹上一腳，整座腐朽的建築便會轟然倒塌。\n——阿道夫·希特勒，評價蘇聯"
 LOADING_TIP_42: "我可以保證在對英美開戰後的半年至一年內勢如破竹，但是在這之後，我毫無獲勝的把握。\n——山本五十六"
 LOADING_TIP_43: "如果我軍遭遇雷區，我軍步兵將無視雷區繼續進攻。\n——格奧爾基·朱可夫"
 LOADING_TIP_44: "我們低估了俄國巨人……無論何時消滅他們一打師，俄國人總會換上另一打。\n——弗朗茨·哈爾德"
 LOADING_TIP_45: "放屁！\n——安東尼·C·麥考利夫，回覆德國的勸降"
 LOADING_TIP_46: "今天是我們，明天就輪到你們。\n——海爾·塞拉西一世，1936年"
 LOADING_TIP_47: "一步也不許後退！\n——蘇聯國防委員會·第227號命令"
 LOADING_TIP_48: "虎！虎！虎！\n——淵田美津雄，1941年12月7日"
 LOADING_TIP_49: "你的名字無人知曉，你的功績永世長存。\n——無名烈士墓，莫斯科"
 LOADING_TIP_50: "第34特遣艦隊現在何處？重複一遍，現在何處？全世界都想知道。\n——美國太平洋司令部最高指揮官，萊特灣戰役"
 LOADING_TIP_51: "戰局未必好轉，世界大勢亦不我利。\n——裕仁天皇，1945年"
 LOADING_TIP_52: "我們本該在上次大戰後就明白。\n——格爾德·馮·倫德施泰特"
 LOADING_TIP_53: "俄國的龐大耗幹了我們。\n——格爾德·馮·倫德施泰特"
 LOADING_TIP_54: "請問，諸位是否願意進行一場總體戰？如果有必要，諸位是否願意進行一場比我們所能想像到的還要更加激進且徹底的總體戰？\n——約瑟夫·戈培爾"
 LOADING_TIP_55: "德國軍隊的一擊和蘇聯軍隊的另一擊給這個凡爾賽的醜陋產物帶去了終結。\n——維亞切斯拉夫·莫洛托夫，波蘭戰敗後"
 LOADING_TIP_56: "刮掉一條平頂船！迪克森通知母艦：刮掉一條平頂船！\n——羅伯特·E·迪克森，珊瑚海戰役"
 LOADING_TIP_57: "這難道不恐怖嗎？我們兩個身為德國總參謀部的軍官，卻正在這裡談論如何謀殺我們的最高統帥。\n——亨寧·馮·特雷斯寇"
 LOADING_TIP_58: "希特勒是一個正在跳舞的托缽僧，他必須被幹掉。\n——亨寧·馮·特雷斯寇"
 LOADING_TIP_59: "納粹在自以為只有他們可以炸別人，而別人不會來炸他們的天真幻覺中挑起了這場戰爭。\n——亞瑟·“轟炸機”·哈里斯"
 LOADING_TIP_60: "如果希特勒入侵了地獄，那我也會在下院為惡魔說幾句好話。\n——溫斯頓·丘吉爾，1941年6月21日"
 LOADING_TIP_61: "所以那個雜種死了？我們沒能活捉他真是太遺憾了！\n——約瑟夫·斯大林，聽聞希特勒自殺後"
 LOADING_TIP_62: "我們被擊敗了，我們被痛打了，我們輸掉了這場戰鬥。\n——保羅·雷諾，1940年5月15日"
 LOADING_TIP_63: "我只需要幾千人的傷亡，便可作為參戰方在和談中佔據一席之地。\n——貝尼托·墨索里尼"
 LOADING_TIP_64: "法國人對波蘭人謊稱說他們會發起進攻，但實際上他們並不會。\n——艾德蒙·艾恩賽德"
 LOADING_TIP_65: "為何要為但澤而死？\n——法國反戰口號，1939年"
 LOADING_TIP_66: "關於這場戰爭，存在著些虛假的東西。\n——美國參議員威廉·波拉，1939年"
 LOADING_TIP_67: "瑞士有著最令人作嘔且卑鄙的人民以及政治體系，瑞士人是新德意志不共戴天的敵人。\n——阿道夫·希特勒"
 LOADING_TIP_68: "勝利碩果紛至，我等應接不暇。\n——裕仁天皇"
 LOADING_TIP_69: "你們最後都得去給德國人擦軍靴！\n——伊塔洛·巴爾博"
 LOADING_TIP_70: "擊沉，燒燬，俘獲，摧毀。不要讓任何東西通過。\n——安德魯·坎寧安，突尼斯戰役"
 LOADING_TIP_71: "我覺得我們可能多過了一座橋。\n——弗裡德里克·勃朗寧，市場花園行動前"
 LOADING_TIP_72: "為法國軍隊感謝上帝。\n——溫斯頓·丘吉爾，1933年"
 LOADING_TIP_73: "當你發覺一條響尾蛇即將咬人的時候，你不會等到被咬了才去消滅它。\n——富蘭克林·D·羅斯福"
 LOADING_TIP_74: "規則不一定是神聖的，原則才是。\n——富蘭克林·D·羅斯福"
 LOADING_TIP_75: "捱餓和失業的人民是滋生獨裁的土壤。\n——富蘭克林·D·羅斯福"
 LOADING_TIP_76: "如果一個人想活命下去，那就必須要時刻保持警惕，否則一些婊子養的德國雜種就會偷摸到身後，然後用打出屎的力量要了他的命。\n——喬治·S·巴頓"
 LOADING_TIP_77: "除非連最普通的士兵都清楚他正在保衛國家，否則任何防禦工事、火炮或者外國援助都毫無意義。\n——卡爾·古斯塔夫·埃米爾·曼納海姆"
 LOADING_TIP_78: "穿越泥濘與鮮血，直抵綠野的彼端。\n——加拿大皇家裝甲部隊，非官方座右銘"
 LOADING_TIP_79: "皇家海軍上下如今都想看看意大利人是否能夠達到他們在上次大戰中的水平，還是說他們已經徹底墮落了。\n——溫斯頓·丘吉爾，意大利宣佈參戰後"
 LOADING_TIP_80: "而且我們還會掄起碎酒瓶底來對付他們，因為我們只剩下這該死的傢伙了！\n——溫斯頓·丘吉爾，在誓言于田野和街頭戰鬥後旋即說道"
 LOADING_TIP_81: "經驗表明，一個足夠堅定的人使用近戰武器攻擊坦克基本上總能成功。\n——德國中央集團軍群·反坦克手冊"
 LOADING_TIP_82: "只要給我50架DC-3，日本人是否切斷滇緬公路便無關緊要。\n——蔣介石"
 LOADING_TIP_83: "政治是不流血的戰爭，戰爭是流血的政治。\n——毛澤東"
 LOADING_TIP_84: "存人失地，人地皆存；存地失人，人地皆失。\n——毛澤東"
 LOADING_TIP_85: "我寧願死在大羅馬尼亞的沼澤中，也決不苟活在小羅馬尼亞的天堂裡。\n——揚·安東內斯庫"
 LOADING_TIP_86: "人並不重要，重要的是他們代表的是什麼。\n——揚·安東內斯庫"
 LOADING_TIP_87: "在戰爭時期，真理是如此寶貴，以至於她總需要用謊言去加以捍衛。\n——溫斯頓·丘吉爾"
 LOADING_TIP_88: "我們今天被機械化部隊擊敗了，但在將來，我們一定可以用更加優秀的機械化部隊戰勝敵人，而世界的命運也將繫於此。\n——夏爾·戴高樂"
 LOADING_TIP_89: "漫漫秋日，如提琴長嘆，我心暗傷。\n——英國特別行動局，致法國抵抗組織的加密信息"
 LOADING_TIP_90: "像瑞士這樣的國家，不過是歐洲臉面上的膿瘡，不能允許它繼續存在下去。\n——阿道夫·希特勒"
 LOADING_TIP_91: "能打贏戰爭的人很少能締造好的和平，而能締造好的和平的人也永遠不會贏得戰爭。\n——溫斯頓·丘吉爾"
 LOADING_TIP_92: "綏靖者就是那些喂鱷魚的人，他們盼望著鱷魚到最後才吃掉自己。\n——溫斯頓·丘吉爾"
 LOADING_TIP_93: "那些聲言筆尖勝於干戈的人，顯然還沒見識過自動武器。\n——道格拉斯·麥克阿瑟"
 LOADING_TIP_94: "要麼給我授勳，要麼送我上軍事法庭，開火！\n——比格爾·埃裡克森"
 LOADING_TIP_95: "喚醒老虎，要用長棍。\n——毛澤東"
 LOADING_TIP_96: "如果所有人想的都一樣，那麼肯定有人沒思考。\n——喬治·S·巴頓"
 LOADING_TIP_97: "我們很需要這些剃鬚刀片，國家元帥先生。\n——埃爾溫·隆美爾，聽聞戈林聲稱美國人只會製造剃鬚刀片後"
 LOADING_TIP_98: "我無法向你預測俄國的行動，這是一個包裹在謎團中的謎團。\n——溫斯頓·丘吉爾"
 LOADING_TIP_99: "無論這個策略多麼美妙，你都應該偶爾看看結果。\n——溫斯頓·丘吉爾"
 LOADING_TIP_100: "自從意希戰爭以來，人們不再說“希臘人像英雄一樣戰鬥”，而是說“英雄像希臘人一樣戰鬥”。\n——《蒙特利爾每日星報》，1942年"
 LOADING_TIP_101: "當你首先想到的是對自己人民的熱愛，那就是愛國主義。當你首先想到的是對他國人民的仇恨，那就是民族主義。\n——夏爾·戴高樂"
 LOADING_TIP_102: "這必須是一種沒有勝者的和平。因為有勝者即意味著有輸家，那麼這種和平就只是征服者對被征服者的和平。這種和平將會在恥辱中被接受，並留下怨恨。\n——伍德羅·威爾遜，1917年"
 LOADING_TIP_103: "如果你想要徹底的安全，那就去監獄。在那裡你不僅有吃有穿，還有醫療以及其他各種東西。唯一缺少的只是自由。\n——德懷特·D·艾森豪威爾"
 LOADING_TIP_104: "軍隊是一個集體，它作為一個集體生活、吃飯、睡覺和戰鬥。在軍隊裡，個人英雄主義這種東西就是扯淡。\n——喬治·S·巴頓"
 LOADING_TIP_105: "永遠不要告訴別人怎麼做事。告訴他們該做什麼事，他們會用自己的聰明才智給你驚喜。\n——喬治·S·巴頓"
 LOADING_TIP_106: "所有人都會感到害怕。越是聰明的人，越容易害怕。\n——喬治·S·巴頓"
 LOADING_TIP_107: "人類的仁慈從來沒有削弱過一個自由民族的毅力，也沒有軟化過一個自由民族的意志。一個國家不必為了變得強硬而變得殘酷。\n——富蘭克林·羅斯福"
 LOADING_TIP_108: "誠實的外交就是天方夜譚。\n——約瑟夫·斯大林"
 LOADING_TIP_109: "縱觀人類歷史，有能力行動者卻袖手旁觀；知情者卻無動於衷；於是邪惡方能伺機橫行。\n——海爾·塞拉西一世"
 LOADING_TIP_110: "華沙不在等待空洞的讚美之詞，不在等待外交認可，也不在等待同情的保證。華沙在等待的是武器和彈藥。\n——約瑟夫·畢蘇斯基"
 LOADING_TIP_111: "無知和矇昧除了為暴政制造一群奴隸，從來沒有產生過其他任何東西。\n——埃米利亞諾·薩帕塔"
 LOADING_TIP_112: "我寧願站著死，也不願跪著生。\n——埃米利亞諾·薩帕塔"
 LOADING_TIP_113: "先生們，你們如獅子一般戰鬥卻不幸被蠢驢引導。\n——埃爾溫.隆美爾，致托布魯克圍城戰中被俘的英國軍官"
 LOADING_TIP_114: "自由選舉的問題在於，你永遠不知道結果會如何。\n——維亞切斯拉夫·莫洛托夫"
 LOADING_TIP_115: "屍體還在乎誰對誰錯嗎？\n——曼努埃爾·阿薩尼亞"
 LOADING_TIP_116: "你們的任務並不輕鬆，你們的敵人訓練有素、裝備精良、身經百戰，他們會頑強地戰鬥。\n——德懷特·D·艾森豪威爾，1944年6月"
 LOADING_TIP_117: "結束戰爭最快的方法就是輸掉戰爭。\n——喬治·奧威爾"
 LOADING_TIP_118: "我們不希望再有選舉舞弊，也不希望再有謊言。我們不希望那些不工作的人靠工作的人養活。\n——胡安·庇隆"
 LOADING_TIP_119: "那就是該死的謝爾號！向它開炮！\n——弗雷德里克·塞克爾·貝爾"
 LOADING_TIP_120: "我們絕不能被我們正準備抵抗的危險的恐懼所打敗。唯一值得恐懼的就是恐懼本身。\n——富蘭克林·德拉諾·羅斯福"
 LOADING_TIP_121: "我們的自由已經顯示出它在戰爭中存活的能力，但我們的自由永遠不會在投降中倖存。\n——富蘭克林·羅斯福"
 LOADING_TIP_122: "只有最愚蠢的失心瘋才會讓人妄圖在此發動入侵。絕不會有人能夠在此登陸，哪怕是區區一個大頭兵也別想上來。\n——貝尼托·墨索里尼，西西里，1937年"
 LOADING_TIP_123: "我拿起武器是為了反對納粹和法西斯的獨裁統治。如果我必須為反對另一種形式的獨裁而死，我甘願赴死。\n——德拉查·米哈伊洛維奇"
 LOADING_TIP_124: "我不知道第三次世界大戰會用什麼武器來打，但我知道第四次世界大戰肯定只能用棍子和石頭來打了。\n——阿爾伯特·愛因斯坦"
 LOADING_TIP_125: "我是一個擁有兩種文字，三種語言，四種宗教，五個民族，六個共和國，為七個鄰國所包圍，並且有八個少數民族聚居的國家的領導人。\n——約瑟普·布羅茲·鐵托"
 LOADING_TIP_126: "如果連幾個人都沒有勇氣去終結那個罪犯，那麼將來歷史會如何評判德意志民族呢？\n——亨寧·馮·特雷斯寇"
 LOADING_TIP_127: "整個世界現在都會譴責我們，但我仍然堅信我們做了正確的事情。希特勒不僅是德國的死敵，也是世界的死敵。\n——亨寧·馮·特雷斯寇"
 LOADING_TIP_128: "敵方最近使用殘酷之炸彈，頻殺無辜，慘害所及，實難逆料。\n——昭和天皇，1945年"
 LOADING_TIP_129: "戰爭手冊第一頁的第一條是：“不能對莫斯科用兵。”不少人都曾嘗試過，但最終都狼狽不堪。\n——伯納德·L·蒙哥馬利"
 LOADING_TIP_130: "關於德國將在明天或後天向奧地利發動突襲的謠言又在到處亂傳了。\n——阿道夫·希特勒，1936年"
 LOADING_TIP_131: "德國士兵震驚了世界，而意大利的貝爾薩列里輕步兵震驚了德國士兵。\n——埃爾溫·隆美爾"
 LOADING_TIP_132: "這是我在歐洲提出的最後一個領土要求。\n——阿道夫·希特勒，關於蘇臺德地區，1938年"
 LOADING_TIP_133: "我們無法承受持久的消耗戰。無論盟軍在哪裡集中力量，他們都會突破。\n——格爾德·馮·倫德施泰特"
 LOADING_TIP_134: "如果我們與美國開戰，除非能在夏威夷海域摧毀美國艦隊，否則根本沒有獲勝的希望。\n——山本五十六，1941年"
 LOADING_TIP_135: "你有敵人？很好，這意味著你曾經在生命中的某時為某事站過立場。\n——溫斯頓·丘吉爾"
 LOADING_TIP_136: "這不是和平，這只是二十年的休戰。\n——斐迪南·福煦，1919年"
 LOADING_TIP_137: "即使是為了和平，你也可能為此付出了過高的代價。\n——邁克爾·約瑟夫·薩維奇，評價張伯倫的綏靖政策"
 LOADING_TIP_138: "力量是他們唯一聽得懂的語言，就像對付流氓一樣。\n——富蘭克林·D·羅斯福，評價阿道夫·希特勒和貝尼托·墨索里尼"
 LOADING_TIP_139: "有人說，民主是最糟糕的政府形式，如果除了那些不時被嘗試過的其他形式以外的話。\n——溫斯頓·丘吉爾"
 LOADING_TIP_140: "世界不會被作惡之人毀滅，而是會被袖手旁觀者毀滅。\n——阿爾伯特·愛因斯坦"
 LOADING_TIP_141: "這個提議所帶來的極端危險遠遠超過了任何的軍事優勢。\n——羅伯特·奧本海默，評價熱核兵器，1949年"
 LOADING_TIP_142: "我們知道世界不會和過去一樣了。少數人笑，少數人哭泣，剩下的人都是沉默。\n——羅伯特·奧本海默，三位一體試驗後"
 LOADING_TIP_143: "我已經變成了死神，世界的毀滅者。\n——羅伯特·奧本海默，三位一體試驗後"
 LOADING_TIP_144: "每個男人在第一次上戰場時都會害怕，如果他說不怕，那他肯定是在騙人。\n——喬治·S·巴頓"
 LOADING_TIP_145: "真正的英雄，是儘管感到害怕卻依然投入戰鬥的人。\n——喬治·S·巴頓"
 LOADING_TIP_146: "要冒有準備的風險，這和莽撞蠻幹是兩碼事。\n——喬治·S·巴頓"
 LOADING_TIP_147: "在西西里，有四百個醒目的墓碑，那都是因為一個懶漢執勤的時候打瞌睡去了。不過所幸墳裡躺的都是德國人，因為我們在這個狗雜種的上司逮到他前抓住了機會。\n——喬治·S·巴頓"
 LOADING_TIP_148: "我經歷過戰爭，我親眼目睹過戰傷的血肉橫流，我看到過死人被遺棄在泥地裡，我見證過城市被摧毀，我恨惡戰爭。\n——富蘭克林·D·羅斯福"
 LOADING_TIP_149: "基督萬歲！奧地利萬歲！\n——海因裡希·邁爾，臨終遺言，1945年"
 LOADING_TIP_150: "我堅決拒絕納粹法西斯主義在奧地利的存在……這種不符合奧地利傳統的運動，向所有人許諾一切，但實際上卻打算對奧地利人民進行最無情的奴役！\n——奧托·馮·哈布斯堡"
 LOADING_TIP_151: "納粹代表永遠不可能進入奧地利內閣。\n——庫爾特·舒施尼格，1938年"
 LOADING_TIP_152: "國王和神明一樣都是虛構的權威。這個事實使得無神論與共和主義成為同一枚硬幣的兩面。\n——諾伊·佐達尼亞"
 LOADING_TIP_153: "有時候好幾十年無事發生，也有時候幾週內就發生完了幾十年的事情。\n——弗拉基米爾·列寧"
 LOADING_TIP_154: "在折缽山升起的那面旗幟，意味著海軍陸戰隊將延續五百年的榮耀。\n——美海軍部長詹姆斯·福雷斯特，1945年於硫磺島"
 LOADING_TIP_155: "因此，讓我們振作起來，履行我們的職責，即便大英帝國和英聯邦再存續千年，人們回望這段歷史時，依舊會說：“這是英國最輝煌的時刻”！\n——溫斯頓·丘吉爾"
 LOADING_TIP_156: "此刻，我正歷經生命中最沉痛的時光，只因我必須履行一項比死亡更令人難以承受的職責。\n—揚·西羅維，1938年簽署《慕尼黑協定》後的悲愴自白。"
 LOADING_TIP_157: "中華民國就像是我的孩子，他現在有淹死的危險。我要設法使他不沉下去，而我們在河中被急流沖走。我向英國和美國求救，他們站在河岸上嘲笑我。\n——孫中山"
 LOADING_TIP_158: "“V”在法語中代表“勝利”，在弗拉芒語中代表“自由”……也是我們英國朋友“勝利”的首字母。\n——維克多·德·拉韋萊耶，“V字勝利”運動"
 LOADING_TIP_159: "致菲律賓人民：我回來了。\n——道格拉斯·麥克阿瑟"
 LOADING_TIP_160: "為自由而戰，不是一人之戰，也不是一國之戰。這是所有拒絕戴上枷鎖之人的共同鬥爭。\n——塞爾吉奧·奧斯梅尼亞"
 LOADING_TIP_161: "海岸警戒隊拯救了瓜達爾卡納爾，瓜達爾卡納爾拯救了南太平洋。\n——威廉·哈爾西"
 LOADING_TIP_162: "如果非要進攻地獄，我會讓澳大利亞人去佔領它，讓新西蘭人去守住它。\n——埃爾溫·隆美爾"


