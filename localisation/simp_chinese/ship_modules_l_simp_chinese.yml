 ### EQUIPMENT MODULES ###
 ship_light_battery_1: "85mm速射炮"
 ship_light_battery_1_short: "輕型炮組1"
 ship_light_battery_1_desc: "一種相對小些的火炮，用於驅逐艦和其他小型船隻。"
 ship_light_battery_2: "105mm速射炮"
 ship_light_battery_2_short: "輕型炮組2"
 ship_light_battery_2_desc: "具有動力裝置的輕型火炮，可以快速追蹤目標。"
 ship_light_battery_3: "127mm速射炮"
 ship_light_battery_3_short: "輕型炮組3"
 ship_light_battery_3_desc: "帶有炮盾的輕型火炮，可以抵禦炮彈碎片和惡劣天氣。"
 ship_light_battery_4: "130mm速射炮"
 ship_light_battery_4_short: "輕型炮組4"
 ship_light_battery_4_desc: "一組安放在有動力的裝甲炮座上的輕型炮"
 dp_light_battery_1: "100mm高平兩用炮"
 dp_light_battery_1_short: "高平兩用主炮1"
 dp_light_battery_1_desc: "一種安置在特殊炮座上的小型火炮，不僅能攻擊水面目標，還可以對空射擊。"
 dp_light_battery_2: "113mm高平兩用炮"
 dp_light_battery_2_short: "高平兩用主炮2"
 dp_light_battery_2_desc: "一種高角度且帶炮盾的小型火炮，不僅能攻擊水面目標，還可以對空射擊。"
 dp_light_battery_3: "127mm高平兩用炮"
 dp_light_battery_3_short: "高平兩用主炮3"
 dp_light_battery_3_desc: "一種安置在高角度封閉式炮塔上的小型火炮，不僅能攻擊水面目標，還可以對空射擊。"
 dp_light_battery_4: "127mm高平兩用速射炮"
 dp_light_battery_4_short: "高平兩用主炮4"
 dp_light_battery_4_desc: "一種安置在高角度動力炮塔上的小型速射火炮，不僅能攻擊水面目標，還可以對空射擊。"
 ship_heavy_battery_1: "28cm火炮"
 ship_heavy_battery_1_short: "重型炮組1"
 ship_heavy_battery_1_desc: "一戰前的大口徑火炮。"
 ship_heavy_battery_2: "30.5cm火炮"
 ship_heavy_battery_2_short: "重型炮組2"
 ship_heavy_battery_2_desc: "一組有重型護甲的大口徑火炮。擁有重新設計過的炮塔，使其有更高的仰角，從而增加射程"
 ship_heavy_battery_3: "38cm火炮"
 ship_heavy_battery_3_short: "重型炮組3"
 ship_heavy_battery_3_desc: "擁有重型裝甲的重炮，採用了一系列的新技術，提高了精度和射速。"
 ship_heavy_battery_4: "40.6cm火炮"
 ship_heavy_battery_4_short: "重型炮組4"
 ship_heavy_battery_4_desc: "重火力的終極形態，可以提供長距離高精度的打擊。"
 ship_super_heavy_battery_1: "46cm火炮"
 ship_super_heavy_battery_1_short: "超重型炮組"
 ship_super_heavy_battery_1_desc: "有史以來最強大的火炮，被設計用於擊穿假想敵任意距離上的一切裝甲。"
 ship_light_medium_battery_1: "14.5cm 火炮"
 ship_light_medium_battery_1_short: "輕巡洋艦炮組1"
 ship_light_medium_battery_1_desc: "在射速和炮彈重量間追求平衡，輕巡洋艦可以使用這種炮打敗更小的船隻。"
 ship_light_medium_battery_2: "15cm 火炮"
 ship_light_medium_battery_2_short: "輕巡洋艦炮組2"
 ship_light_medium_battery_2_desc: "這種炮是老舊型號的升級產物，旨在給輕巡洋艦提供比驅逐艦和舊式巡洋艦更強的火力。"
 ship_light_medium_battery_3: "15.5cm火炮"
 ship_light_medium_battery_3_short: "輕巡洋艦炮組3"
 ship_light_medium_battery_3_desc: "採用了一系列的新技術，這種炮進一步拉開了輕巡洋艦和驅逐艦的主炮差距。"
 ship_light_medium_battery_4: "15.5cm自動裝填火炮"
 ship_light_medium_battery_4_short: "自動裝填式輕巡洋艦炮組"
 ship_light_medium_battery_4_desc: "專為高射速設計，這種炮甚至可以允許輕巡洋艦通過頻繁射擊癱瘓比自己更大號的敵艦。"
 dp_ship_medium_1: "152mm高平兩用速射炮"
 dp_ship_medium_1_short: "輕巡洋艦炮組4"
 dp_ship_medium_1_desc: "專為高射速設計，這種炮甚至可以允許輕巡洋艦攻擊更大的船舶或飛機。"
 ship_medium_battery_1: "17cm火炮"
 ship_medium_battery_1_short: "重巡洋艦炮組1"
 ship_medium_battery_1_desc: "雖然無法對戰列艦造成嚴重傷害，但這種中型火炮足以讓重巡洋艦從容應對輕型船隻和其他巡洋艦。"
 ship_medium_battery_2: "19cm火炮"
 ship_medium_battery_2_short: "重巡洋艦炮組2"
 ship_medium_battery_2_desc: "早期設計的升級版，順應海戰的需求，這種炮與時俱進，增強了裝甲和射程。"
 ship_medium_battery_3: "20.3cm火炮"
 ship_medium_battery_3_short: "重巡洋艦炮組3"
 ship_medium_battery_3_desc: "儘管這不是裝備在巡洋艦上最大的炮，但這種炮在裝備重量和火力之間達到了完美的平衡，足以擊穿敵方巡洋艦的裝甲。"
 ship_medium_battery_4: "20.3cm自動裝填火炮"
 ship_medium_battery_4_short: "重巡洋艦炮組4"
 ship_medium_battery_4_desc: "雖然現有彈藥供應和改造舊船隻的需求限制了口徑，但這種新炮依靠先進的自動裝填系統，依然大幅提升了射速。"
 ship_secondaries_1: "75mm速射炮"
 ship_secondaries_1_short: "副炮組1"
 ship_secondaries_1_desc: "安放在船體一側的炮郭中，這種輕型火炮可以在大型船隻面對小型船隻時提供防禦。"
 ship_secondaries_2: "120mm速射炮"
 ship_secondaries_2_short: "副炮組2"
 ship_secondaries_2_desc: "安放在小型炮塔上的速射炮，用於應對驅逐艦和魚雷艇。"
 dp_ship_secondaries_1: "100mm高平兩用副炮"
 dp_ship_secondaries_1_short: "高平兩用副炮1"
 dp_ship_secondaries_1_desc: "整合了重型防空炮和副炮的功能，這種炮大大提升了船隻的防空能力，同時在打擊小型水面目標時也能提供幫助。"
 dp_ship_secondaries_2: "113mm高平兩用副炮"
 dp_ship_secondaries_2_short: "高平兩用副炮2"
 dp_ship_secondaries_2_desc: "在單獨炮塔上安裝多個高平兩用副炮，為船員提供極大保護。"
 dp_ship_secondaries_3: "127mm高平兩用副炮"
 dp_ship_secondaries_3_short: "高平兩用副炮3"
 dp_ship_secondaries_3_desc: "高平兩用的雙動力炮塔能極大提升火力輸出。"
 dp_ship_secondaries_4: "127mm高平兩用速射副炮"
 dp_ship_secondaries_4_short: "高平兩用副炮4"
 dp_ship_secondaries_4_desc: "副炮武器的究極設計，旨在快速打擊各種形式的目標。"
 ship_fire_control_system_0: "中央測距"
 ship_fire_control_system_0_short: "火控 0"
 ship_fire_control_system_0_desc: "在桅杆頂端的觀察塔確定目標方位，然後把信息傳達給炮組。"
 ship_fire_control_system_1: "火控指揮射擊"
 ship_fire_control_system_1_short: "火控 I"
 ship_fire_control_system_1_desc: "在一名位於中央火控站的炮術軍官的指揮下火炮可以進行齊射。"
 ship_fire_control_system_2: "機械彈道計算機"
 ship_fire_control_system_2_short: "火控 II"
 ship_fire_control_system_2_desc: "通過測距儀和其他傳感器獲取的信息，一臺艦載機械計算機不斷更新目標的距離和方位。"
 ship_fire_control_system_3: "彈道計算機"
 ship_fire_control_system_3_short: "火控 III"
 ship_fire_control_system_3_desc: "更為複雜的機械計算機，在計算火炮彈道時能夠考慮諸多影響因素。"
 ship_torpedo_1: "三聯裝450mm魚雷發射器"
 ship_torpedo_1_short: "魚雷發射器 I"
 ship_torpedo_1_desc: "一套中型魚雷發射器，可以裝備在水面艦艇上。"
 ship_torpedo_2: "四聯裝450mm魚雷發射器"
 ship_torpedo_2_short: "魚雷發射器 II"
 ship_torpedo_2_desc: "在發射器上加裝一個新的魚雷發射管，水面艦艇可以形成更大的魚雷扇面，提升命中概率。"
 ship_torpedo_3: "三聯裝 533mm魚雷發射器"
 ship_torpedo_3_short: "魚雷發射器 III"
 ship_torpedo_3_desc: "更大的魚雷，能攜帶更具威力的彈頭，對目標造成更嚴重的傷害。當然，這使可搭載的魚雷管減少了。"
 ship_torpedo_4: "四聯裝533mm魚雷發射器"
 ship_torpedo_4_short: "魚雷發射器 IV"
 ship_torpedo_4_desc: "解決了水面艦艇發射大型魚雷的機械問題，這種先進的設備同時可以更快地裝填下一輪魚雷。"
 ship_torpedo_sub_1: "四聯裝450mm魚雷發射管"
 ship_torpedo_sub_1_short: "魚雷發射管 I"
 ship_torpedo_sub_1_desc: "一套基礎魚雷發射管，可以從潛艇內部重新裝填。"
 ship_torpedo_sub_2: "六聯裝450mm魚雷發射管"
 ship_torpedo_sub_2_short: "魚雷發射管 II"
 ship_torpedo_sub_2_desc: "更大的魚雷艙可以裝載更多的魚雷發射管，並且能讓艦員的居住空間更寬敞一點。"
 ship_torpedo_sub_3: "四聯裝 533mm魚雷發射管"
 ship_torpedo_sub_3_short: "魚雷發射管 III"
 ship_torpedo_sub_3_desc: "更大的魚雷發射管讓潛艇發射更大的魚雷。"
 ship_torpedo_sub_4: "六聯裝 533mm魚雷發射管"
 ship_torpedo_sub_4_short: "魚雷發射管 IV"
 ship_torpedo_sub_4_desc: "電動裝彈機可以讓魚雷再裝填的時間大大減少。"
 ship_anti_air_1: ".50重機槍"
 ship_anti_air_1_short: "防空炮 I型"
 ship_anti_air_1_desc: "一組重機槍可以為艦艇提供些許近距離的防空火力。"
 ship_anti_air_2: "20mm防空炮"
 ship_anti_air_2_short: "防空炮 II型"
 ship_anti_air_2_desc: "一門小型自動炮可以打出更大的炮彈，幾發就能擊毀一架飛機。"
 ship_anti_air_3: "37mm防空炮"
 ship_anti_air_3_short: "防空炮 III型"
 ship_anti_air_3_desc: "之前的小口徑炮威力難以在敵人投放武器前摧毀敵方飛機。更大的炮彈意味著在命中時更容易摧毀敵方飛機，但也需要更大口徑的身管。"
 ship_anti_air_4: "40mm 四聯裝防空炮"
 ship_anti_air_4_short: "防空炮 IV型"
 ship_anti_air_4_desc: "最新的防空炮不僅可以輕易捕捉高速移動的空中目標，並且升級過的火控系統可以引導多門防空炮射擊同一個目標。"
 ship_mine_layer_1: "佈雷裝置"
 ship_mine_layer_1_desc: "為水面艦艇改裝之後可以佈置水雷。"
 ship_mine_sweeper_1: "掃雷裝置"
 ship_mine_sweeper_1_desc: "可以部署掃雷裝備的裝置。"
 ship_mine_layer_sub: "水雷佈設管"
 ship_mine_layer_sub_desc: "可以在潛艇的船殼上改裝，使其可以佈置多枚水雷。"
 ship_depth_charge_1: "深水炸彈軌道"
 ship_depth_charge_1_short: "深水炸彈 I"
 ship_depth_charge_1_desc: "一組簡單的軌道，可以讓艦艇在開過水下目標的時候從船尾投下深水炸彈。"
 ship_depth_charge_2: "深水炸彈投擲器"
 ship_depth_charge_2_short: "深水炸彈 II"
 ship_depth_charge_2_desc: "使用小型炸藥的深水炸彈可以在更深的地方起爆，這樣一艘艦艇投擲一組深水炸彈就可以覆蓋很大一片區域。"
 ship_depth_charge_3: "反潛迫擊炮"
 ship_depth_charge_3_short: "深水炸彈 III"
 ship_depth_charge_3_desc: "可以投擲帶有觸發式引信深水炸彈的裝置，讓艦艇可以在不干擾聲吶索敵的情況下攻擊敵方目標。"
 ship_depth_charge_4: "先進反潛迫擊炮"
 ship_depth_charge_4_short: "深水炸彈 IV"
 ship_depth_charge_4_desc: "是前一型裝備的升級版，這種迫擊炮可以將更多的裝藥投送到更遠的距離。"
 ship_sub_snorkel_1: "基礎型通氣管"
 ship_sub_snorkel_1_desc: "可以讓潛艇引擎在水下繼續工作，既能為電池充電，又能避免暴露在水上。"
 ship_sub_snorkel_2: "改進型通氣管"
 ship_sub_snorkel_2_desc: "對通氣管設計進行改進可以減少在高海況下引擎運行面臨的問題，同時減少了被雷達發現的風險。"
 ship_airplane_launcher_1: "水上飛機彈射器"
 ship_airplane_launcher_1_desc: "一個小型飛機彈射器可以把一架小型偵察機送上天。"
 ship_airplane_launcher_2: "改進型水上飛機彈射器"
 ship_airplane_launcher_2_desc: "改進過的彈射裝置可以讓艦艇彈射更大的、航程更遠航速更快的飛機。"
 ship_seaplane_tender_1: "水上飛機母艦"
 ship_seaplane_tender_1_desc: "為水上飛機加油與回收的裝備，使其在減少對岸基補給依賴的情況下保持運轉。"
 ship_seaplane_tender_2: "改進水上飛機母艦"
 ship_seaplane_tender_2_desc: "雖然最早的水上飛機母艦是由商船改裝而成，但專門建造的新型號可以顯著提升水上飛機維持能力。"
 sub_missile_launcher: "潛艇導彈發射器"
 sub_missile_launcher_desc: "一種安裝在潛艇上用於發射制導導彈和彈道導彈的裝置。"
 slbm_launcher: "潛艇核導彈發射器"
 slbm_launcher_desc: "一種安裝在潛艇上用於發射核彈道導彈的裝置。"
 ship_engine_sub_aip_1: "無氧推進器"
 ship_engine_sub_aip_1_desc: "新型發動機的第一次迭代，使潛艇能夠在水下運行更長時間，但代價是燃料消耗大幅增加，航程縮短。"
 ship_engine_sub_aip_2: "無氧推進-柴油組合引擎"
 ship_engine_sub_aip_2_desc: "新型獨立空氣推進系統，具有更好的性能和更低的燃料消耗。"
 ship_engine_sub_aip_3: "高速沃爾特引擎"
 ship_engine_sub_aip_3_desc: "我們已經達到了自身認知下無氧推進引擎所可能達到的巔峰水平。這款引擎速度極快，同時保持了可接受的燃油消耗量。"
 ship_anechoic_tile: "消聲瓦"
 ship_anechoic_tile_desc: "一種橡膠瓦塗層，旨在縮小船舶被被動和主動聲吶探測到的範圍。"
 ship_torpedo_sub_nuclear: "核魚雷"
 ship_torpedo_sub_nuclear_desc: "攜帶核彈頭的魚雷，對敵艦具有極高的殺傷力，但同時也增加了事故風險。"
 ship_deck_space: "機庫"
 ship_deck_space_desc: "船艙內一塊巨大開放的區域，可以為著艦的飛機進行維護和後勤。為船上增加更多的機庫會使得造價飆升。"
 big_ship_deck_space: "浮動機場跑道"
 big_ship_deck_space_desc: "可用於飛機維修、加油、補給和任務準備的開放區域，允許存放和使用非載機型飛機。"
 ship_escort_deck_space: "護航航母機庫"
 ship_escort_deck_space_desc: "艦船內部可供帶起落架飛機存儲及起降的開放空間。比艦隊航母的機庫更小、更擁擠。"
 ship_submarine_deck_space: "潛水航母機庫"
 ship_submarine_deck_space_desc: "水密隔艙與彈射裝置使潛艇能夠搭載、發射並回收少量水上飛機。"
 ship_sonar_1: "水聽器"
 ship_sonar_1_desc: "一套簡單的水聽裝置，通過聲音來追蹤水下目標。"
 ship_sonar_2: "主動式聲吶"
 ship_sonar_2_desc: "一個主動式噪音發射器，可以往水裡放出“嘭”的聲音並且監聽其在潛艇表面的回聲。"
 ship_sonar_3: "先進聲吶"
 ship_sonar_3_desc: "使用更強的信號脈衝和定向掃描的改進型聲納陣列。"
 ship_sonar_4: "現代聲納"
 ship_sonar_4_desc: "最先進的聲納系統，提供對水下目標的優秀追蹤。"
 ship_radar_1: "分米波水面搜索雷達"
 ship_radar_1_short: "雷達 I"
 ship_radar_1_desc: "一組簡單且有著50cm的左右波長的雷達裝置，在惡劣天氣下也可以探測到10公里以外的水面艦艇。"
 ship_radar_2: "改進型分米波水面搜索雷達"
 ship_radar_2_short: "雷達 II"
 ship_radar_2_desc: "一組經過改良，且有著30cm左右波長的雷達裝置，可以在25公里開外精確測量出哪怕是一艘小船的距離和方位"
 ship_radar_3: "釐米波火控雷達"
 ship_radar_3_short: "雷達 III"
 ship_radar_3_desc: "通過裝備空腔磁控管，該雷達裝置不僅能夠探測到極小的目標，還甚至能測定彈著點。哪怕是在夜間或者是惡劣的天氣裡，我們也能夠對目標進行盲射。"
 ship_radar_4: "集成火控雷達"
 ship_radar_4_short: "雷達 IV"
 ship_radar_4_desc: "這一雷達組有著釐米級的波長，同時與船隻的火控系統結為一體，而這帶來了在所有天氣條件下的高精度炮控。"
 ship_extra_fuel_tank: "增設油箱"
 ship_extra_fuel_tank_desc: "增加的燃料儲備可以帶來更長的航程。"
 light_ship_engine_1: "35000馬力引擎"
 light_ship_engine_1_short: "輕型引擎 I"
 light_ship_engine_1_desc: "一組小型蒸汽輪機可以推動一艘小船高速前進，或是讓一艘更大的船隻以低速前進。"
 light_ship_engine_2: "40000馬力引擎"
 light_ship_engine_2_short: "輕型引擎 II"
 light_ship_engine_2_desc: "通過使用高壓鍋爐，在同等的重量和鍋爐空間下，動力設備仍然可以產生更高的推力。"
 light_ship_engine_3: "45000馬力引擎"
 light_ship_engine_3_short: "輕型引擎 III"
 light_ship_engine_3_desc: "材料技術上的進步讓動力設備能夠承受更高的蒸汽壓力，而這帶來了更高的功率輸出。"
 light_ship_engine_4: "50000馬力引擎"
 light_ship_engine_4_short: "輕型引擎 IV"
 light_ship_engine_4_desc: "改進後的發動機設計和輪機減速齒輪能讓動力設備在重量不變的情況下擁有更高的效率。"
 sub_ship_engine_1: "1000馬力引擎"
 sub_ship_engine_1_short: "潛艇引擎 I"
 sub_ship_engine_1_desc: "柴油和電力的混合引擎，使潛艇能在水下以一個可以接受的速度前進。"
 sub_ship_engine_2: "2000馬力引擎"
 sub_ship_engine_2_short: "潛艇引擎 II"
 sub_ship_engine_2_desc: "動力強勁的柴油引擎，讓潛艇在發現目標後能迅速進入作戰位置。"
 sub_ship_engine_3: "3000馬力引擎"
 sub_ship_engine_3_short: "潛艇引擎 III"
 sub_ship_engine_3_desc: "新材料和新工藝打造的引擎，可以在滿功率下運行更長時間。"
 sub_ship_engine_4: "4000馬力引擎"
 sub_ship_engine_4_short: "潛艇引擎 IV"
 sub_ship_engine_4_desc: "帶有渦輪增壓的先進發動機，在短時間內可以極速運轉，既能用於追擊目標，也能用於更快速的為電池充電。"
 sub_ship_nuclear_engine_1: "核潛艇反應堆"
 sub_ship_nuclear_engine_1_short: "潛艇反應堆"
 sub_ship_nuclear_engine_1_desc: "為潛艇提供核動力的小型反應堆，確保現代海軍艦隊能夠長時間在水下航行並高效運作。"
 cruiser_ship_engine_1: "60000馬力引擎"
 cruiser_ship_engine_1_short: "巡洋艦引擎 I"
 cruiser_ship_engine_1_desc: "一套給無齒輪渦輪機提供蒸汽的基礎鍋爐"
 cruiser_ship_engine_2: "70000馬力引擎"
 cruiser_ship_engine_2_short: "巡洋艦引擎 II"
 cruiser_ship_engine_2_desc: "一套配備減速齒輪的汽輪機的運行效率要高得多，可以將多出來的重量用於提供額外的動力。"
 cruiser_ship_engine_3: "80000馬力引擎"
 cruiser_ship_engine_3_short: "巡洋艦引擎 III"
 cruiser_ship_engine_3_desc: "改進後的鍋爐佈局可以輸出更高的蒸汽壓力，帶來更強勁的動力。"
 cruiser_ship_engine_4: "90000馬力引擎"
 cruiser_ship_engine_4_short: "巡洋艦引擎 IV"
 cruiser_ship_engine_4_desc: "先進的製作材料可以讓這種引擎進行更長時間的高負荷運轉。"
 heavy_ship_engine_1: "30000馬力引擎"
 heavy_ship_engine_1_short: "重型引擎 I"
 heavy_ship_engine_1_desc: "為了把更多的重量留給裝甲和火炮，這種引擎從未被設計得能達到高速。"
 heavy_ship_engine_2: "90000馬力引擎"
 heavy_ship_engine_2_short: "重型引擎 II"
 heavy_ship_engine_2_desc: "這種引擎的推力比之前的要大得多，這種引擎可以使大型船隻相較老式戰艦擁有明顯的速度優勢。"
 heavy_ship_engine_3: "150000馬力引擎"
 heavy_ship_engine_3_short: "重型引擎 III"
 heavy_ship_engine_3_desc: "隨著裝甲和火炮重量的增加，引擎也被設計得能夠提供更高的速度，以便於追擊逃跑的敵軍，抑或是和比自己更強大的對手保持距離。"
 heavy_ship_engine_4: "210000馬力引擎"
 heavy_ship_engine_4_short: "重型引擎 IV"
 heavy_ship_engine_4_desc: "通過採用新材料和改進的鍋爐設計，這種動力裝置能使一艘現代戰列艦跟上那些高速的航母和巡洋艦。"
 heavy_ship_nuclear_engine_1: "重型艦船核反應堆"
 heavy_ship_nuclear_engine_1_short: "重型艦船反應堆"
 heavy_ship_nuclear_engine_1_desc: "無需燃料即可為最重型船舶提供動力的強大核反應堆。"
 carrier_ship_engine_1: "50000馬力引擎"
 carrier_ship_engine_1_short: "航空母艦引擎 I"
 carrier_ship_engine_1_desc: "一組基礎引擎，能夠讓一艘中等大小的航空母艦達到安全收放飛機所需要的速度。"
 carrier_ship_engine_2: "120000馬力引擎"
 carrier_ship_engine_2_short: "航空母艦引擎 II"
 carrier_ship_engine_2_desc: "這種新的動力裝置被設計成能夠讓一艘航空母艦在速度上勝過絕大部分老式巡洋艦和一些驅逐艦，允許它規避敵方的水面艦隊。"
 carrier_ship_engine_3: "150000馬力引擎"
 carrier_ship_engine_3_short: "航空母艦引擎 III"
 carrier_ship_engine_3_desc: "這種引擎被設計得能讓大型航空母艦以非常快的速度移動。"
 carrier_ship_engine_4: "210000馬力引擎"
 carrier_ship_engine_4_short: "航空母艦引擎 IV"
 carrier_ship_engine_4_desc: "這一動力系統為了裝備一種作為航母戰鬥群核心的“快速航母”而設計。"
 carrier_ship_nuclear_engine_1: "航母核反應堆"
 carrier_ship_nuclear_engine_1_short: "航母反應堆"
 carrier_ship_nuclear_engine_1_desc: "一座強大的核反應堆，能夠為巨型航母提供動力，無需它們進行燃料補給。"
 ship_armor_bb_1: "200mm主裝甲/40mm甲板裝甲"
 ship_armor_bb_1_short: "戰列艦裝甲 I"
 ship_armor_bb_1_desc: "這種裝甲設計用於保護船隻不受自身口徑火炮射擊的傷害，它確保船隻的每一部分都能根據其功能得到有效的保護。"
 ship_armor_bc_1: "150mm主裝甲/25mm甲板裝甲"
 ship_armor_bc_1_short: "戰列巡洋艦裝甲 I"
 ship_armor_bc_1_desc: "這種裝甲的設計可以保護船隻免受中小型炮的傷害，它也被設計得更輕以帶來高航速。"
 ship_armor_bb_2: "350mm主裝甲/150mm甲板裝甲"
 ship_armor_bb_2_short: "戰列艦裝甲 II"
 ship_armor_bb_2_desc: "通過由傾斜裝甲構成的主裝甲帶，這一裝甲設計方案可以保護船隻免受自身口徑火炮射擊的傷害。"
 ship_armor_bc_2: "305mm主裝甲/100mm甲板裝甲"
 ship_armor_bc_2_short: "戰列巡洋艦裝甲 II"
 ship_armor_bc_2_desc: "這種裝甲設計是一種兼顧速度和防護的折中方案，可以保護艦船免受驅逐艦和巡洋艦艦炮射擊的傷害。"
 ship_armor_bb_3: "380mm主裝甲/155mm甲板裝甲"
 ship_armor_bb_3_short: "戰列艦裝甲 III"
 ship_armor_bb_3_desc: "與以前的裝甲設計方案完全不同，這一設計在艦船中心構建了一個重裝甲的核心艙，但是犧牲了對艦艇其他部分的保護。它的目的是保護艦船免受自身口徑火炮射擊的傷害。"
 ship_armor_bc_3: "330mm主裝甲/130mm甲板裝甲"
 ship_armor_bc_3_short: "戰列巡洋艦裝甲 III"
 ship_armor_bc_3_desc: "這種裝甲設計著眼於對艦船排水量的限制，試圖最大限度地保護船舶的關鍵部位，而其他區域只能暴露在外。這種裝甲設計方案無法長時間承受戰列艦級武器的考驗。"
 ship_armor_shbb: "450mm主裝甲/210mm甲板裝甲"
 ship_armor_shbb_short: "超重型裝甲"
 ship_armor_shbb_desc: "最新的裝甲設計方案，目的是抵禦所有已知的主炮炮彈，並讓一艘裝備如此精良的戰列艦能夠接觸並擊沉當今世界上的任何其他戰列艦。"
 ship_armor_cruiser_1: "50mm主裝甲/40mm甲板裝甲"
 ship_armor_cruiser_1_short: "巡洋艦裝甲 I"
 ship_armor_cruiser_1_desc: "這種裝甲設計方案旨在使巡洋艦在與驅逐艦和其他輕裝甲艦船戰鬥時略勝一籌。"
 ship_armor_cruiser_2: "100mm主裝甲/30mm甲板裝甲"
 ship_armor_cruiser_2_short: "巡洋艦裝甲 II"
 ship_armor_cruiser_2_desc: "這種裝甲設計方案有較重型的主裝甲，能使巡洋艦在與老舊的輕型巡洋艦及較小的艦船交戰時得到很好的保護。"
 ship_armor_cruiser_3: "120mm主裝甲/50mm甲板裝甲"
 ship_armor_cruiser_3_short: "巡洋艦裝甲 III"
 ship_armor_cruiser_3_desc: "仿造了設計戰列艦裝甲的方法，這種裝甲的設計方案是為了跟上世界武器的發展。"
 ship_armor_cruiser_4: "150mm主裝甲帶/60mm甲板裝甲"
 ship_armor_cruiser_4_short: "巡洋艦裝甲 IV"
 ship_armor_cruiser_4_desc: "這一裝甲方案試圖最大限度地保護船隻戰鬥中所必要的浮力，並以所有其他區域的防護為代價。"
 ship_armor_carrier_deck: "90mm甲板裝甲"
 ship_armor_carrier_deck_short: "飛行甲板裝甲"
 ship_armor_carrier_deck_desc: "重型裝甲板可以在犧牲機庫空間的前提下保護機庫不受敵方轟炸機的傷害。"
 ship_armor_ice_carrier_deck_1: "派克瑞特跑道加固"
 ship_armor_ice_carrier_deck_1_desc: "增強的建築加固措施，確保更堅固耐用的建築結構，並提高抗自然災害的能力。"
 ship_armor_ice_carrier_deck_2: "鋼筋增強派克瑞特跑道"
 ship_armor_ice_carrier_deck_2_desc: "鋼筋增強的派克瑞特具有更堅固的結構，能夠承受更大的損傷，同時具有更好的隔熱性能。"
 ship_armor_ice_carrier_deck_3: "冰複合材料跑道"
 ship_armor_ice_carrier_deck_3_desc: "所用材料和方法能夠提供最佳的結構韌性，並減少天氣對船舶運營的影響。"
