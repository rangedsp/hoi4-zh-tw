 CZE_send_observers_to_the_italo_ethiopian_war_bonus: "向意埃戰爭派遣觀察員"
 CZE_send_observers_to_the_italo_ethiopian_war_desc: "派遣人員潛入觀察並與地面戰鬥人員建立二次接觸，能讓我們深入瞭解當代軍隊的作戰理念。這也可能帶來一些其他的機會。"
 CZE_send_observers_to_the_italo_ethiopian_war_tt: "§Y$CZE_zbrojovka_brno_organization$§!會詢問走私軍火進入§Y[ETH.getname]§!的事項。"
