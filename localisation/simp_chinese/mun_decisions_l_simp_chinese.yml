 ###FORT DECISIONS###
 CZE_the_second_fortification_program_category: "防禦工事計劃"
 CZE_the_second_fortification_program_category_desc: "我國不甚理想的邊境線已成為緊迫的國家安全問題。周邊國家已經明確表示，他們有意按照對自己有利的方式重新劃分我國邊界。繼續加強邊境防禦，將使得任何潛在的敵人在攻擊我們之前再三思量。"
 CZE_fate_of_the_ro: "防禦工事委員會的命運"
 CZE_fate_of_the_ro_desc: "防禦工事委員會負責籌集與我國防禦工程相關的資金。如果這些資金遲遲不投入使用，人們就會開始質疑籌集這些資金的初衷。"
 CZE_bop_army_bunker_maintenance: "防禦工事維護"
 CZE_bop_army_bunker_maintenance_desc: "確保防禦工事得到妥善維護並隨時可使用，將確保軍隊在需要駐守時對其充滿信心。"
 CZE_fortification_research: "防禦工事研究"
 CZE_fortification_research_desc: "對我國邊境進行要塞化防禦之必要不言而喻，問題在於如何實施？研究將幫助我們解答這個問題。"
 CZE_fortification_research_tt: "擁有民族精神§Y$CZE_directorate_of_fortification_works_no_gd_idea$§!"
 CZE_fortification_research_subtract_variable_tt: "所有未來的§Y防禦工事計劃§!決議§Y完成§!所需時間將減少§Y30§!天"
 CZE_fortification_decision_inprogress: "已經在進行一項其他的防禦工事項目"
 CZE_second_sudetenland_fortification_program: "第二輪蘇臺德防禦工事計劃"
 CZE_second_sudetenland_fortification_program_desc: "蘇臺德地區是我們與德國接壤的山區邊境，是修建邊境防禦工事的理想地點。我們研究了法國的馬其諾防線，可以依樣建造一條我們自己的防線。"
 CZE_third_sudetenland_fortification_program: "第三輪蘇臺德防禦工事計劃"
 CZE_third_sudetenland_fortification_program_desc: "蘇臺德地區如今已有了一條像樣的防線，但事關國家存亡，僅僅是“像樣”還遠遠不夠。"
 CZE_fourth_sudetenland_fortification_program: "第四輪蘇臺德防禦工事計劃"
 CZE_fourth_sudetenland_fortification_program_desc: "蘇臺德地區有了一套堅固的防禦工事體系，但其強度仍需進一步加強。"
 CZE_fortify_the_crossroads_with_slo: "鞏固路口"
 CZE_fortify_the_crossroads_with_slo_desc: "任何防禦工事體系都可能被突破。為了防範這種情況，我們可以在最重要的城市周圍構建防禦據點，確保即便敵軍突破防線，也無法輕易奪取這些城市。"
 CZE_fortify_the_hungarian_border_with_73: "鞏固對匈邊防"
 CZE_fortify_the_hungarian_border_with_73_desc: "匈牙利的收復失地主義始終威脅著我國，在兩國邊境修建防禦工事體系將有助於保障我們的安全。"
 CZE_fortify_the_polish_border_with_72: "鞏固對波邊防"
 CZE_fortify_the_polish_border_with_72_desc: "波蘭人的侵略野心永無止境，但願通過構築完善的要塞邊防體系能讓他們知難而退，另外尋找其他更易得手的目標。"
