 CZE_embezzle_quatermaster_funds: "£BoP_left_texticon 挪用軍需官資金"
 CZE_embezzle_quatermaster_funds_desc: "我們的士兵已經得到了很好的照顧。如果把原本用於營房的一些資金挪作他用，肯定不會有人注意到。"
 CZE_prioritize_export_contracts: "£BoP_left_texticon 出口合同優先"
 CZE_prioritize_export_contracts_desc: "我們的出口產業幫助我們走出了大蕭條。為什麼我們現在要做出改變？反正任何對我們國家的威脅都被誇大其詞。艦隊可以再等等。"
 CZE_focus_on_export_designs: "£BoP_left_texticon 重視出口設計"
 CZE_focus_on_export_designs_desc: "軍隊對設計的要求極為苛刻，而出口市場則寬容得多，還能為國內的軍隊設計提供資金支持。所以實際上，軍隊真該好好感謝我們，畢竟我們為他們在研發上省了那麼多錢。不用謝，軍隊。"
