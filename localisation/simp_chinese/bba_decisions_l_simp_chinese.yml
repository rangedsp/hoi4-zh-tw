 ETH_freedom_at_gunpoint_offer_peace_tt: "如果§Y[FROM.Capital.OWNER.GetName]§!放棄對§Y[THIS.GetName]§!當前控制的§Y[FROM.GetAdjective]§!領土的宣稱，將會達成和平。如果他們同意，§Y[THIS.GetName]§!在屬於§Y[FROM.GetName]§!核心領土的控制區成立一個傀儡國。\n\n§R如果和平協議達成且[ROOT.GetFlag][ROOT.GetNameDefCap]所屬的陣營在與[FROM.Capital.OWNER.GetFlag][FROM.Capital.OWNER.GetName]交戰，其將會離開所屬陣營！§!\n\n§R[FROM.Capital.OWNER.GetFlag][FROM.Capital.OWNER.GetName]將只會在[ROOT.GetFlag][ROOT.GetName]控制[FROM.GetAdjective]領土時考慮和談！§!"
 ETH_exploit_french_weakness_category: "對法趁虛而入"
 ETH_exploit_french_weakness_category_desc: "當時機成熟，[FRA.GetAdjective]被本土事務牽制的時候，我們將控制[268.GetName]。"
 ETH_take_DJI: "奪取法屬索馬裡蘭"
 ETH_take_DJI_tt: "我們必須靜待合適的時機，然後出擊。當法屬索馬裡蘭沒有駐軍看管時，我們就將快速奪取此地。法國很可能會接受我們控制法屬索馬裡蘭的既成事實，但我們也要做好應對沖突擴大的準備。"
 ETH_take_DJI_cancel_tt: "\n§R如$FRA_VICHY_fascism$不再控制法屬索馬裡蘭，或其在此地區駐紮有師團，此國策將會取消！§!"
 ETH_take_DJI_danger_tt: "\n§R$FRA_VICHY_fascism$ 可能會對吞併他們領土的行為進行報復！§!"
 ETH_reintegrate_former_territory_category: "再造帝國"
 ETH_reintegrate_former_territory_category_desc: "擺在我們面前的偉大任務是開墾我們的合法土地，並在我們偉大領袖[ETH.GetLeader]的領導下實現[ETH.GetAdjective]民族的統一。"
