 invite_to_org_alliance_tt: "與你意識形態不同的國家將不太可能簽署防衛協定。"
 invite_to_exec_council: "邀請[FROM.GetName]加入執行理事會"
 invite_to_exec_council_tt: "與你意識形態不同的國家將不會支持同你方政治統一。"
