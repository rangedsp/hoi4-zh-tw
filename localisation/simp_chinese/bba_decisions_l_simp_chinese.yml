 integrate_into_org: "整合[FROM.GetName]加入非洲聯盟"
 leave_org_of_african_unity: "離開非洲統一組織"
 threaten_member_state: "恫嚇[FROM.GetAdjective]領導層"
 threaten_member_state_desc: "我們有必要向[FROM.GetNameDef]的領導班子發出聲明，如果他們不願意真正加入非洲統一組織，那他們的人身安全可能就不一定有保障了……"
 threaten_member_state_tt: "\n該決議生效時，在§G60天§!內，被恫嚇國家的領導層更有可能接受加入組織的提議。"
