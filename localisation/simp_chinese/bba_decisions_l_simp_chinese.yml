 SWI_renounce_guiding_principles_desc: "[SWI_renounce_guiding_princpiples_desc_loc]"
 SWI_renounce_guiding_principles_desc_cantons: "我們可能過早承諾延續分權至州和聯邦議會的傳統了。目前的形勢表明，一個更有力的聯邦委員會對我們的生存不可或缺。"
 SWI_renounce_guiding_principles_desc_council: "我們最初對加強聯邦委員會權力的熱衷可能是被誤導了。當前的形勢需要一個更直接和包容的民主系統，使穩定和公民參與重歸主流。"
