 SWI_dismiss_council_desc: "我們的敵人太強大了，甚至還在對聯邦委員會的爭吵和暗鬥冷嘲熱諷。該有個偉大的領導人站起來引領[ROOT.GetNonIdeologyName]走出這場動亂了。"
