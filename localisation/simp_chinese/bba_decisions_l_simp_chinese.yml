 african_union_category: "非洲統一組織"
 african_union_category_desc: "我們需要建立一個能將整個非洲大陸的人才和資源彙集在一起的機構，並向著政治統一前進。非洲人民只有齊心合作，才有希望避免被再次奴役的命運。"
 promote_org_of_african_unity: "在[FROM.GetName]宣揚非洲統一組織"
