 ######## COUNCIL SYSTEM ###########
 SWI_federal_council_decisions_category: "聯邦委員會"
 SWI_federal_council_decisions_category_desc: "[SWI_get_correct_council_category_description]"
 SWI_federal_council_decisions_category_desc_dem: "瑞士聯邦委員會自1848年以來一直是瑞士民主的堅定巔峰。[SWI_get_temp_explanation_of_council_system]\n\n§Y瑞士聯邦主席：§!\n[SWI_GetPresidentName]\n\n§Y主要委員：§!\n[SWI_GetCouncilor1name]\n[SWI_GetCouncilor2name]\n[SWI_GetCouncilor3name]"
 SWI_federal_council_decisions_category_desc_fasc: "雖然與舊時的委員會不同，但由[SWI.GetLeader]領導的光榮新政權仍需要一個強力的委員會來在[?SWI.SWI_biggest_fascist.GetNameDef]執行元首的意志。\n\n§Y主要委員：§!\n[SWI_GetCouncilor1name]\n[SWI_GetCouncilor2name]\n[SWI_GetCouncilor3name]"
 SWI_federal_council_decisions_category_desc_alt: "有著如此重要的使命，[SWI.GetNameDef]的領導人，[SWI.GetLeader]無法被指望履行一個國家的所有職責，這就是為什麼[SWI.GetLeader.GetSheHe]要把被廢除議會的一些職責交付給一個委員會。\n\n§Y主要委員：§!\n[SWI_GetCouncilor1name]\n[SWI_GetCouncilor2name]\n[SWI_GetCouncilor3name]"
 SWI_recently_finished_president_initiative: "近期完成了一項委員會倡議"
 SWI_recently_finished_president_initiative_desc: "由於聯邦主席和聯邦委員會的權力有限，我們必須等待一段時間才能嘗試讓另一項倡議獲得一致通過。賦予委員會更多的權力也許能實施更多倡議，但我們必須考慮，這對瑞士根深蒂固的民主價值觀來說，是不是最好的選擇。"
 SWI_defense_fund_drive: "國防基金運動"
 SWI_defense_fund_drive_desc: "瑞士聯邦政府缺乏防衛我們潛在敵人所需的資金，但我們可以動員瑞士公民發自內心地提供這些資金。"
 SWI_swiss_democratic_tradition_campaign: "瑞士民主傳統運動"
 SWI_swiss_democratic_tradition_campaign_desc: "我們可以讓瑞士群眾回想起我們膾炙人口的民主傳統和歐洲最古老、大概也是唯一真實的民主社會。"
 SWI_rally_workers: "動員工人"
 SWI_rally_workers_desc: "工人群體是[SWI.GetName]防衛不可或缺的一部分，因此我們可以忍受必要的犧牲來激發他們參與[SWI.GetAdjective]的軍事工業的熱情。"
 SWI_anti_fascist_drive: "反法西斯運動"
 SWI_anti_fascist_drive_desc: "法西斯分子在[ROOT.GetName]沒有棲身之處。作為一個致力於地方自決和民主權力，追求成為人民天堂的國家，掃除每個國內的法西斯分子是我們的職責，無論他們藏在哪個角落。"
 SWI_spouse_fascism: "擁抱法西斯理想"
 SWI_spouse_fascism_desc: "按照世界的發展方向，與法西斯站在一起可能是維護我們自身安全的最好方法，我們可以開始宣傳法西斯主義，便於民眾能夠做好準備接受我們在意識形態領域的轉變。"
 SWI_focus_on_swiss_unity: "關注瑞士團結"
 SWI_focus_on_swiss_unity_desc: "我們可以向[SWI.GetAdjective]人民宣傳，是時候拋開一切語言、階級、背景和政治觀念上的分歧，凝聚力量保衛[SWI.GetNameDef]獨有的統一與多元性。"
 SWI_isolate_switzerland: "孑然自立的瑞士"
 SWI_isolate_switzerland_desc: "我們應該著重於確保[SWI.GetName]能自給自足，這大概是避免失去我們緊握著的自主權的唯一機會。"
 SWI_militarization_drive: "推動軍備發展"
 SWI_militarization_drive_desc: "我們可以專注於拓展[SWI.GetAdjective]戰爭機器，以鞏固國防，並在條件允許時先發制敵。"
 SWI_expand_covert_operations: "增加地下活動"
 SWI_expand_covert_operations_desc: "我們可以增加我們的情報資源，從而在表面上維持中立的同時影響國際事務轉向對我們有益的方向。"
 SWI_expand_arms_industry: "擴張軍工產業"
 SWI_expand_arms_industry_desc: "我們可以提升開發並迅速生產新式武器的能力，這樣我們的防衛就不需要依賴外國勢力。"
 SWI_support_humanitarian_efforts: "支持人道主義運動"
 SWI_support_humanitarian_efforts_desc: "我們不能對發生在我們四周的暴行袖手旁觀。我們有道德上的義務幫助歐洲被壓迫的人民並向他們提供我們土地上的庇護所。"
 SWI_diplomatic_mission: "外交任務"
 SWI_diplomatic_mission_desc: "我們可以在其他國家進行外交旅行，與他們建立更密切的關係，並打消他們對我們絕對中立的任何疑慮，避免他們對我們發動任何可能的入侵。"
 SWI_appease_fascists: "安撫法西斯分子"
 SWI_appease_fascists_desc: "我們可以接受歐洲的新秩序，學習與我們的法西斯鄰國共存。這不僅可以讓我們擺脫戰爭，也能確保我們的獨立和中立。"
