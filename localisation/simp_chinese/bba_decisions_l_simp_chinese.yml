l_simp_chinese:
 #### Ethiopia
 #Balance of Power
 ETH_recall_balco_safo_decision: "召回退休的$ETH_balcho_safo$"
 ETH_recall_balco_safo_decision_desc: "在皇帝想進一步改變和掌控[ROOT.GetName]的偉大藍圖中，$ETH_balcho_safo$可能是一個頗具實力的反對派。然而，他仍是一個在默克萊和阿杜瓦的勝利中表現英勇的英雄，更是個深受士兵愛戴的指揮官。所以為了[ROOT.GetName]，再一次邀請他回來指揮軍隊不僅能使我們增加一位富有作戰經驗的指揮官，更能使越來越多的士兵簇擁到我們偉大的旗幟之下。"
 balcho_safo_recalled_tt: "獲得一個§Y$irregular_infantry$§!單位。"
 ETH_bop_increase_mesafint_privileges: "增加世襲貴族特權"
 ETH_bop_increase_mesafint_privileges_desc: "本地王公們是統治當地的最佳人選。[ROOT.capital.GetCapitalVictoryPointName]的中央政權不應當為雞毛蒜皮的小事所擾。然而，我們需要小心，步子不能邁得太大，以免他們利用手中的權力完全獨立。"
 ETH_bop_increase_the_power_of_the_mekwanint: "增加中央選官權力"
 ETH_bop_increase_the_power_of_the_mekwanint_desc: "任命大臣應當在地方事務中擁有更多的話語權。我們應該努力將權利從世襲貴族轉移到中央選官手中，進而控制中央政府，以及[ROOT.GetLeader]。也許這一行為會惹惱王公，但為了建立一個強大的[ROOT.GetName]，我們必須要去做這些。"
 ETH_bop_privileges_changed: " 距上次更改特權不到一年"
 ETH_bop_increase_anarchist_influence: "增加對安那其派的支持"
 ETH_bop_increase_communist_influence: "增加對共產主義者的支持"
 ETH_bop_increase_anarchist_influence_desc: "我們必須確保安那其派擁有足夠的影響力，以防止中央政府再次侵犯人民的權利。我們應該發起一場宣傳運動，來增強人民對我們事業的支持。"
 ETH_bop_increase_communist_influence_desc: "我們必須確保共產主義者在政府決策中有足夠的話語權。我們應該發起一場宣傳運動，以在這個國家分崩離析前，增強人民對我們事業的支持。"
 #Decisions Menu
 ETH_placeholder_political_category: "PLACEHOLDER - TO BE REMOVED"
 ETH_placeholder_political_category_desc: "PLACEHOLDER - TO BE REMOVED\n- Decentralization / Centralization: [GetPlaceholderBopText]"
 war_escalation_text: "£generic_war_escalation_text_icon 戰局態勢等級：§Y[?ETH.ETH_war_escalation_level]§!"
 war_escalation_level_tt: "§Y當前戰局態勢§!\n態勢等級隨時間推移及意大利採取的各種行動而提高。\n\n戰爭持續時間：§Y+[?ETH.ETH_escalation_time_increase_total]§!\n意大利已發動主要攻勢（+1）[GetItalianRenewedOffensiveText]\n\n意大利已投入至少25個常規師（+1）[GetItalian20DivisionsText]\n\n意大利已投入至少300架飛機（+1）[GetItalianAircraftsText][GetDefendTheNorthMissionText][GetDefendTheSouthMissionText][GetDefendHararMissionText][GetDefendTheCapitalMissionText]"
 war_escalation_icon_tt: "§Y戰局態勢§!\n隨戰局態勢升級而觸發的效果，按等級：\n等級3：\n §Y國際聯盟§!：解鎖請求禁運\n §Y埃塞俄比亞§!：國際聲譽提升\n等級4：\n §Y國際聯盟§!：解鎖採購軍火\n §Y意大利§!：意大利公眾擔憂\n等級5：\n §Y國際聯盟§!：解鎖關閉蘇伊士運河\n §Y意大利§!：非洲軍團心灰意冷\n等級6：\n §Y國際聯盟§!：解鎖國際縱隊\n §Y埃塞俄比亞§!：部隊士氣提升\n §Y意大利§!：殖民地動盪\n等級7：\n §Y國際聯盟§!：國際調停\n §Y意大利§!：意大利公眾質疑戰爭成果\n等級8：\n §Y埃塞俄比亞§!：敵軍逃兵\n §Y意大利§!：大規模逃兵\n等級9：\n §Y埃塞俄比亞§!：歷萬艱而終得新生\n等級10：\n §Y埃塞俄比亞§!：人民戰爭\n §Y意大利§!：殖民地騷亂"
 war_escalation_1_tt: "等級1\n 無效果"
 war_escalation_2_tt: "等級2\n 無效果"
 war_escalation_3_tt: "等級3\n §Y國際聯盟§!：埃塞俄比亞可以請求禁運。\n §Y埃塞俄比亞§!：國際聲譽提升，解鎖§Y請求禁運§!國策。"
 war_escalation_4_tt: "等級4\n §Y國際聯盟§!：埃塞俄比亞可以採購軍火。\n §Y意大利§!：意大利公眾擔憂\n §Y埃塞俄比亞§!：解鎖§Y採購軍火§!國策。"
 war_escalation_5_tt: "等級5\n §Y國際聯盟§!：埃塞俄比亞可以請求關閉蘇伊士運河。\n §Y意大利§!：非洲軍團心灰意冷\n §Y埃塞俄比亞§!：解鎖§Y關閉蘇伊士運河§!國策。"
 war_escalation_6_tt: "等級6：\n §Y國際聯盟§!：埃塞俄比亞可以請求國際縱隊。\n §Y埃塞俄比亞§!：部隊士氣提升，解鎖§Y國際縱隊§!國策。\n §Y意大利§!：殖民地動盪"
 war_escalation_7_tt: "等級7：\n §Y國際聯盟§!：埃塞俄比亞可以請求國際調停。\n §Y意大利§!：意大利公眾質疑戰爭成果\n §Y埃塞俄比亞§!：解鎖§Y國際調停§!國策。"
 war_escalation_8_tt: "等級8：\n §Y埃塞俄比亞§!：敵軍逃兵\n §Y意大利§!：大規模逃兵"
 war_escalation_9_tt: "等級9：\n §Y埃塞俄比亞§!：歷萬艱而終得新生"
 war_escalation_10_tt: "等級10：\n §Y埃塞俄比亞§!：人民戰爭\n §Y意大利§!：殖民地騷亂"
 ETH_trigger_fulfilled: "£trigger_yes"
 ETH_trigger_not_fulfilled: "£trigger_no"
 ETH_war_escalation_threat: "意埃戰爭態勢升級"
 ETH_major_offensive_threat: "意埃戰爭主要攻勢"
 ETH_improve_country_category: "[ROOT.GetName]的現代化"
 ETH_improve_country_category_desc: "[ETH.GetNameDefCap]經濟的主體，仍是由徘徊在溫飽線上的農民所支撐的農業。為了實現工業化，我們需要大量投資電力與交通基礎設施建設，這樣才能有更多的人走出田野，成為工廠裡的工人。"
 ETH_build_local_resistance_force: "在[FROM.GetName]組建抵抗軍"
 ETH_build_local_resistance_force_desc: "我們必須全力支持淪陷區人民的抵抗運動。這會大大削弱[ITA.GetAdjective]對該地區的控制，並加深[ITA.GetAdjective]對當地的治安投入，同時為我們對[ETH.GetName]的必要的解放做準備。"
 ETH_build_local_resistance_force_increase_tt: "在可起義地區徵募§G1§!支愛國者聯盟師"
 ETH_build_local_resistance_force_cost: "£command_power  §G25§!"
 ETH_build_local_resistance_force_cost_blocked: "£command_power  §R25§!"
 ETH_building_local_resistance_flag: "目前正在招募游擊隊"
 ETH_launch_large_scale_uprising: "大規模起義"
 ETH_launch_large_scale_uprising_desc: "[ETH.GetName]人民急切的想要把這些外來侵略勢力趕出自己的家園。我們要做的只是輕輕推他們一把。"
 ETH_has_readied_uprising_tt: "至少在一個地區準備發動起義"
 ETH_italian_uprising_warning_mission: "在[ETH.GetName]的起義迫在眉睫"
 ETH_italian_uprising_warning_mission_desc: "有傳言稱[ETH.GetLeader]正在集結國內的反叛勢力，意在對[ROOT.GetName]實施一次聯合打擊。"
 ETH_italian_uprising_warning_mission_tt: "叛亂爆發"
 ETH_coup_haile_selassie_imru: "策動宮廷政變"
 ETH_coup_haile_selassie_imru_desc: "在皇帝缺位的時間裡，$ETH_ras_imru_haile_selassie$和他的民主思想迅速席捲全國。毫無疑問，戰爭期間他對於國家的出色領導，讓他成為了民眾心目中[ROOT.GetName]真正的英雄。想要一個更加民主的[ROOT.GetName]的呼聲愈來愈高。是時候在[ROOT.GetNameDef]來一場真正的變革了。"
 ETH_palace_coup_tt: "§Y$ETH_ras_imru_haile_selassie$§!企圖發動政變"
 ETH_formal_request_to_host: "想[?ETH.host_nation.GetAdjective]政府提出正式請求。"
 ETH_formal_request_to_host_desc: "我們應當與[?ETH.host_nation.GetAdjective]政府進行洽談，請求他們全力支持[ROOT.GetLeader]對抗[ITA.GetNameDef]的戰爭。這是重新奪取我們國家控制權的最後一步。"
 ETH_false_flag_operation_decision: "實施栽贓行動"
 ETH_false_flag_operation_decision_desc: "為了使我們的宗主國確信[ITA.GetName]是不可信任的，我們需要對德國的邊境哨所發動偷襲，並且嫁禍給意大利人。"
 ETH_throw_grand_party_for_host: "舉辦盛大派對"
 ETH_throw_grand_party_for_host_desc: "在[ROOT.GetLeader]宅邸的大型派對是除正式遊說外，進行一些非正式遊說的絕佳良機。"
 ETH_influence_host_cost: "§G10§!£GFX_ETH_imperial_treasury"
 ETH_influence_host_cost_blocked: "§R10§!£GFX_ETH_imperial_treasury"
 organization_of_african_unity_member_tt: "是一個非洲統一成員國的組織"
 ETH_take_loans: "個人貸款"
 ETH_take_loans_desc: "我們可以用帝國資產做擔保來增加可用資金。"
 ETH_take_loans_tt: "£GFX_ETH_imperial_treasury 財庫：§G+10§!\n"
 ETH_fundraising_campaign_decision: "籌款活動"
 ETH_fundraising_campaign_decision_desc: "[ROOT.GetLeader]於廣播演講後，我們事業來自美國的支持有了顯著增長。我們應該趁機在各地進行籌款活動來充實皇家財庫，從而為收復我們的領土提供資金支持。"
 ETH_low_fundraising_effect_tt: "£GFX_ETH_imperial_treasury 財庫資金：§G+5§!\n"
 ETH_medium_fundraising_effect_tt: "£GFX_ETH_imperial_treasury 財庫資金：§G+15§!\n"
 ETH_high_fundraising_effect_tt: "£GFX_ETH_imperial_treasury 財庫資金：§G+20§!\n"
 ETH_very_high_fundraising_effect_tt: "£GFX_ETH_imperial_treasury 財庫資金：§G+30§!\n"
 ETH_set_up_gideon_force_decision: "基甸軍"
 ETH_set_up_gideon_force_decision_desc: "[?ETH.host_nation.GetAdjective]政府似乎願意派遣一小支遠征軍來直接支援我們抗擊侵略者。我們應當立刻促進建立這種部隊！"
 ETH_set_up_gideon_force_decision_tt: "一位[?ETH.host_nation.GetAdjective]特種部隊指揮官暫時加入了[ROOT.GetAdjective]軍隊。"
 ETH_recruit_mercenaries_host_cost: "§G[?ETH_recruit_mercenaries_cost]§! £GFX_ETH_imperial_treasury"
 ETH_recruit_mercenaries_host_cost_blocked: "§R[?ETH_recruit_mercenaries_cost]§! £GFX_ETH_imperial_treasury"
 ETH_recruit_mercenaries_from_host: "招募僱傭兵"
 ETH_recruiting_mercenaries_flag: "正在招募僱傭兵"
 ETH_recruit_mercenaries_from_host_desc: "總會有人願為金錢而戰。"
 ETH_recruit_aircrews_from_host: "招募[?ETH.host_nation.GetAdjective]飛行員"
 ETH_recruit_aircrews_from_host_desc: "如果待遇足夠優厚，肯定會有[?ETH.host_nation.GetAdjective]飛行員和地勤人員願為[ROOT.GetName]服務。"
 ETH_recruit_merchant_marines_from_host: "徵用民用船隻"
 ETH_recruit_merchant_marines_from_host_desc: "我們需要船隻和水手才能將我們的軍隊運回非洲。"
 ETH_buy_rifles_from_host: "購買[?ETH.host_nation.GetAdjective]造步槍。"
 ETH_buy_rifles_from_host_desc: "為了籌集奪回[ROOT.GetName]的資金，一些犧牲是必要的。將皇室的私人財富用於購買武器可能是絕望之舉，但非常時刻需要非常措施。"
 ETH_buy_rifles_from_host_cost: "§G[?ETH_buy_arms_from_host_cost]§! £GFX_ETH_imperial_treasury"
 ETH_buy_rifles_from_host_cost_blocked: "§R[?ETH_buy_arms_from_host_cost]§! £GFX_ETH_imperial_treasury"
 ETH_securing_arms_deals_flag: "確保軍火貿易"
 ETH_will_be_re_enabled_tt: "當完成時，這項決議可以在[?ETH_re_enable_time_international_actions]日後再次使用。"
 ETH_buy_tanks_from_host: "購買[?ETH.host_nation.GetAdjective]富餘坦克"
 ETH_buy_tanks_from_host_desc: "[ROOT.GetAdjective]陸軍嚴重缺乏坦克。現在市場上有盈餘的舊式坦克。撥出皇家財庫中的部分資金用於少量購買，應該能在一定程度上緩解問題。舊坦克總比沒有坦克好。"
 ETH_buy_support_equipment_from_host: "獲取支援裝備"
 ETH_buy_support_equipment_from_host_desc: "步槍並非軍隊唯一的需求。士兵們還需要頭盔、靴子、手榴彈等各種裝備。我們可以調用一些皇家財庫資金來獲取這些物資。"
 ETH_chitet_category: "契特"
 ETH_chitet_category_desc: "召集徵召兵可以快速集結大量軍隊，這一制度在長達數個世紀的時間內一直為帝國服務。戰爭結束以後，這些人就能回家，重返平民生活。"
 ETH_raise_the_chitet: "徵召契特"
 ETH_raise_the_chitet_desc: "在所控制的埃塞俄比亞地區徵召部隊。"
 ETH_disband_the_chitet: "解散契特"
 ETH_disband_the_chitet_desc: "戰爭結束了，是時候讓契特們回家了。"
 ETH_chitet_cooldown_tt: "契特將在解散[?var_ETH_chitet_cooldown]日後可再次徵召。"
 ETH_chitet_disband_tt: "解散契特後已有[?var_ETH_chitet_cooldown]日"
 ETH_disband_the_chitet_mission: "契特還鄉"
 ETH_disband_the_chitet_mission_desc: "是時候解散契特，讓士兵們迴歸平民生活了。"
 ETH_raise_the_chitet_effect_tt: "加稅"
 ETH_number_levy_units_less_than_five: "當前集結的徵召師少於5個。"
 ETH_second_italo_ethiopian_war_category: "第二次意埃戰爭"
 ETH_second_italo_ethiopian_war_category_desc: "[Get2ndItaloEthiopianWarDesc] "
 ETH_2ndItaloEthiopianWar: "[ITA.GetName]非法地入侵了我們的祖國。儘管我們是國際聯盟的正式成員，國際社會卻未能採取行動，而是將此次爭端看成是一場小規模的殖民地衝突。\n我們必須向國聯證明這是其一個成員國施加在另一個成員國身上的徹頭徹尾的醜惡的侵略戰爭，進而迫使國際社會對[ITA.GetLeader]採取制裁行動。"
 ITA_2ndItaloEthiopianWar: "國際聯盟迄今未對我們採取任何行動，只是象徵性地反對我們對埃塞俄比亞的征服。然而，衝突拖得越久，我們投入的正規軍越多，他們實際開始干涉我們事務的風險就越大。我們必須在[ETH.GetLeader]設法說服國際聯盟採取行動前結束這場戰爭。"
 ETH_christmas_offensive_mission: "聖誕節攻勢"
 ETH_christmas_offensive_mission_desc: "我們的軍隊仍在前進，但進攻的勢頭正逐漸減弱。不久，這場反擊帶來的勢頭就會被消磨殆盡。"
 ETH_time_based_war_escalation_mission: "戰局態勢逐步升級"
 ETH_time_based_war_escalation_mission_desc: "戰爭持續得越久，世界局勢就愈發緊張。自1935年10月戰爭開始以來，每過六個月，戰局態勢都會提高一級。"
 ETH_started_uprising_flag: "正在發生大規模起義"
 ETH_hold_the_north_mission: "堅守北方"
 ETH_hold_the_north_mission_desc: "聖誕攻勢成功地擊退了意大利人，但我們沒能如計劃中那樣將他們趕下海。他們將重整旗鼓並以更大的力量進攻，屆時我們必須展示出我們能夠堅守住我們的國家。"
 ETH_hold_the_north_mission_success: "\n[ETH.GetName]成功地守住了北方（+1） £trigger_yes\n"
 ITA_conquer_the_north_mission: "征服北埃塞俄比亞"
 ITA_conquer_the_north_mission_desc: "是時候找回在之前埃塞俄比亞人的攻勢中丟給他們的場子了。"
 ETH_war_escalation_inc_tt: "戰局態勢增加§G1§!"
 ETH_war_deescalation_inc_tt: "戰局態勢減少§R1§!"
 ITA_war_escalation_inc_tt: "戰局態勢增加 §R1§!"
 ITA_war_deescalation_inc_tt: "戰局態勢減少§G1§!"
 ETH_hold_the_south_mission: "堅守南方"
 ETH_hold_the_south_mission_desc: "南部的陣線已然沉寂許久，但意大利人最近意在從他們的南部殖民地再次發動襲擊。我們不能後退一步，必須向全世界表明他們和他們的索馬裡傀儡對我國的宣稱都是違法的。"
 ETH_hold_the_south_mission_success: "\n[ETH.GetName]成功守住了南方 (+1) £trigger_yes\n"
 ITA_conquer_the_south_mission: "征服南埃塞俄比亞"
 ITA_conquer_the_south_mission_desc: "埃塞俄比亞人可能不會預料到一場在南線發起的攻勢。我們必須瓦解其軍隊的士氣，並消弭其在國際聯盟的支持，這將通過佔領[837.GetName]和[836.GetName]實現。"
 ETH_hold_addis_ababa_mission: "守住亞的斯亞貝巴"
 ETH_hold_addis_ababa_mission_desc: "通過堅守我們的首都，我們也許能讓國際社會認識到：必須用武力制止意大利人。"
 ETH_hold_the_capital_mission_success: "\n[ETH.GetName]成功守住了亞的斯亞貝巴(+1) £trigger_yes\n"
 ETH_conquer_addis_ababa_mission: "奪取亞的斯亞貝巴"
 ETH_conquer_addis_ababa_mission_desc: "我們必須奪取[ETH.GetName]首都，迫使他們停止抵抗。"
 ETH_hold_harar_mission: "守住[835.GetName]"
 ETH_hold_harar_mission_desc: "在丟失了南方後，我們應當嘗試守住哈勒爾，以保衛我們通往海洋的交通線。"
 ETH_harar_lost_tt: "失去對哈勒爾的控制將會降低人民的戰爭支持度。"
 ETH_conquer_harar_mission: "征服[835.GetName]"
 ETH_conquer_harar_mission_desc: "埃塞俄比亞人正在山裡重新集結。我們需要趕在他們構築好塹壕之前佔領[835.GetCapitalVictoryPointName]。"
 ETH_hold_harar_mission_success: "\n[ETH.GetName]成功守住了[835.GetName]（+1）£trigger_yes\n"
 ETH_buy_rifles: "購買輕武器"
 ETH_buy_rifles_desc: "既然我們已經獲得了國際武器市場的供應渠道，我們就需要確保軍火貿易的正常進行。我們的首要需求是為步兵提供步槍，從而讓他們可以和侵略者們進行對等的較量。"
 ETH_buy_artillery: "購買火炮"
 ETH_buy_artillery_desc: "我們迫切地需要現代火炮來對我們的陸軍提供支援。購買重炮在我們武器貿易中的優先級應該得到保障。"
 ETH_buy_support_equipment: "購買支援裝備"
 ETH_buy_support_equipment_desc: "我們不僅僅需要武器，還急切地需要通訊設備和支援裝備。著手獲得更多支援裝備才是最優先的。"
 ETH_buy_anti_tank_guns: "購買反坦克炮。"
 ETH_buy_anti_tank_guns_desc: "我們正試圖用汽油罐和大型獵槍來對抗意大利裝甲部隊，但如果要徹底擊敗意大利人，我們還需要大量精良的反坦克炮。"
 ETH_request_sent_flag: "靜待回覆"
 ETH_host_confirmed_flag: "已確認一個可供流亡的東道國"
 ETH_host_country_decision: "請求允許在[FROM.GetName]建立流亡政府"
 ETH_host_country_decision_desc: "我們需要做好最壞的打算。如果國家淪陷，我們需要一個基地以便我們繼續抵抗。我們應當接觸[FROM.GetAdjective]政府並請求他們允許我們在該國建立流亡政府。"
 ETH_host_country_decision_tt: "如果在停止抵抗前完成了§Y$ETH_boarding_the_train$§!國策，§Y[ROOT.GetLeader]§!將可以在§Y[FROM.GetNameWithFlag]§!建立§Y流亡政府§!。\n\n解鎖在[FROM.GetNameDef]作為流亡政府期間可用的額外國策。"
 ITA_expand_regional_control: "在[FROM.GetName]強化地區控制"
 ITA_expand_regional_control_desc: "我們將在[FROM.GetName]強化[ITA.GetAdjective]的控制。"
 ITA_discredit_haile_selassie_cd_tt: "[GetDecisionCooldownTooltip]§Y180§! 日。\n"
 expanding_regional_control_flag: "強化地區控制"
 ETH_italian_occupation_category: "[ITA.GetAdjective]佔領[ETH.GetName]"
 ETH_italian_occupation_category_desc: "儘管我們被迫從故鄉流亡，但戰爭遠未結束。我們將利用一切可用手段確保[ETH.GetAdjective]人民重獲自由。"
 ETH_italian_occupation_category_map_category_name: "管理[ITA.GetAdjective]對於[ETH.getNameDef]的佔領"
 ETH_italian_control_mission: "[ITA.GetName]整合[?ITA.state_integrated.GetName]"
 ETH_italian_control_mission_desc: "[ITA.GetName]正試圖通過強硬手段維持對我們領土的控制。我們必須擊退他們。"
 ETH_italian_control_mission_tt: "[ITA.GetNameWithFlag]將成為[?ITA.state_integrated.GetName]的擁有者。"
 ETH_retake_territory_mission: "奪回領土"
 ETH_retake_territory_mission_desc: "半數[ROOT.GetName]領土已經落入敵手。當地王公對於他們的領地被拋棄感到非常失望，並開始質疑中央的權威。最近開始出現與意大利人和談的風聲。重新控制[ROOT.GetAdjective]是唯一能讓人們相信我們能贏的辦法。"
 controls_50_percent_of_territory: "[ROOT.GetNameWithFlag]控制至少§Y50%§!擁有的地區數。\n 當前控制：[?num_owned_controlled_states|Y0]\n 需要：[?controlled_owned_50|Y0] "
 controls_more_than_50_percent_of_territory: "[ROOT.GetNameWithFlag]控制多於§Y50%§!擁有的地區數。\n 當前控制：[?num_owned_controlled_states|Y0]\n 需要：[?controlled_owned_more_than_50|Y0] "
 ETH_road_reform_BoP: "修繕道路"
 ETH_Education_reform_decentralized_BoP: "地區教育改革"
 ETH_Education_reform_decentralized_BoP_tt: "教育在我們與落後的權力結構的鬥爭中至關重要。我們需要教育年輕人懷疑權威，拒絕過時的傳統觀點。"
 ETH_Education_reform_centralized_BoP: "全國教育改革"
 ETH_Education_reform_centralized_BoP_tt: "我們的首要任務是教育下一代人，確保他們能成為堪用的勞動力。同時，教改也是一大機會，我們可以藉此引導後代道德觀念，使他們忠於[ETH.GetLeader]。"
 ETH_road_reform_local_BoP: "鼓勵地區道路建設"
 ETH_road_reform_highways_BoP: "鼓勵首都高速公路建設"
 ETH_road_reform_local_BoP_desc: "[ETH.GetName]糟糕的公路網正越發成為長遠經濟發展的阻礙。我們現在有足夠的政治影響力推動公路現代化，各地區之間更好的公路聯繫將造福全體國民。"
 ETH_road_reform_highways_BoP_tt: "[ETH.GetName]的公路網正越發成為長遠經濟發展的阻礙。依託我們新獲得的影響力，我們應當通過改善首都周邊高速路網來加速經濟的發展，以及中央集權。"
 ETH_officer_reforms_centralized_BoP: "設立政委"
 ETH_officer_reforms_decentralized_BoP: "培養軍事專業人才"
 ETH_officer_reforms_centralized_BoP_tt: "為了確保軍隊不倒戈，我們必須通過設立政委來確保他們的忠誠。"
 ETH_officer_reforms_decentralized_BoP_tt: "為了確保軍隊的作戰效率，我們必須讓我們的軍官更加精銳和專業。"
 ETH_BoP_purge_communists: "清洗共產主義者"
 ETH_BoP_purge_communists_tt: "黑獅組織與共產主義軍官之間不穩定的和平已經開始瓦解。軍官們很明顯熱衷於集權和創造一個忠於他們的專制國家。我們必須在他們摧毀我們所建立的一切之前消滅他們。"
 ETH_BoP_purge_anarchists: "清洗安那其派"
 ETH_BoP_purge_anarchists_tt: "軍隊與黑獅組織之間不穩定的和平已經開始瓦解。他們那原始的安那其主義觀念正在從內部腐化[ETH.GetNameDef]，讓我們變得不堪一擊。為了確保革命得以延續，我們將一勞永逸地消滅黑獅組織。\n\n§Y$ETH_prov_mil_admin$§!將成為§Y[ROOT.GetFlag][ROOT.GetNameDefCap]§!的領導者。"
 ETH_BoP_expand_black_lions: "擴編黑獅組織武裝"
 ETH_BoP_expand_black_lions_tt: "共產主義者不可信任，我們必須警惕他們為自己謀權。因此我們將擴編黑獅組織的武裝力量，讓他們打消任何做小動作的念頭。"
 ETH_BoP_expand_red_guards: "增加赤衛隊師"
 ETH_BoP_expand_red_guards_tt: "不可信賴黑獅組織掌權，他們必須被完全排除出權力中央。我們必須增加我們指揮的赤衛隊數量，只有這樣我們才能在黑獅組織不可避免地失敗時掌控局勢。"
 ETH_electrify_state: "[FROM.GetName]電氣化"
 ETH_electrify_state_desc: "為當地村莊通電是我國現代化的關鍵。"
 ETH_electrify_state_tt: "§Y$ETH_state_development_dynamic_modifier$§!追加效果：\n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$：§G+10%§!\n$MODIFIER_LOCAL_BUILDING_SLOTS$：§G+10%§!"
 ETH_improve_communications_in_state: "在[FROM.GetName]改善通信基礎設施"
 ETH_improve_communications_in_state_desc: "更加高效的通訊手段對於我國發展至關重要。"
 ETH_improve_communications_in_state_tt: "§Y$ETH_state_development_dynamic_modifier$§!追加效果：\n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$：§G+15%§!"
 ETH_invest_in_state_industry: "[FROM.GetName]當地工業投資"
 ETH_invest_in_state_industry_desc: "如果我們計劃在[FROM.GetName]成功建立任何種類的工業體系，我們就需要國家投資，無論是直接通過中央還是通過地方執政者。"
 ETH_invest_in_state_industry_tt: "§Y$ETH_state_development_dynamic_modifier$§!追加效果：\n$MODIFIER_LOCAL_BUILDING_SLOTS$：§G+20%§!"
