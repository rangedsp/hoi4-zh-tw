 ############################
 ITA_withdraw_from_ethiopia: "從埃塞俄比亞撤軍"
 ITA_withdraw_from_ethiopia_desc: "對埃塞俄比亞的戰爭根本就是錯誤的，是時候一錘定音了。"
 ITA_transfer_lost_states_tt: "如果§Y[ETH.GetName]§!完全控制§Y[550.GetName]§!、§Y[559.GetName]§!及§Y[844.GetName]§!，那麼上述地區將被割讓給該國。同樣，如果[ROOT.GetNameDef]已經佔領§Y[908.GetName]§!，那麼該地區也會一併被割讓。"
 ITA_missiolinis: "領袖的任務"
 ITA_missiolinis_desc: "為了讓自豪的意大利民族重回其應有的地位，領袖制定了宏偉的計劃。領袖為實現大意大利的設想，下達了有關命令，他也相信這些任務會精準地執行下去。\n\n£ITA_missiolini_text_icon 可用任務：§Y[?ITA_missiolinis_active_missions]§!\n£ITA_missiolini_text_icon 成功的任務：§Y[?ITA_missiolinis_successful_missions]§!\n£ITA_missiolini_silver_text_icon 失敗的任務：§R[?ITA_missiolinis_failed_missions]§!"
 ITA_missiolini_conquer_ethiopia: "征服埃塞俄比亞"
 ITA_missiolini_conquer_ethiopia_desc: "為了意大利的大獲全勝，阿比西尼亞人還剩多少堡壘都必須要被攻克。"
 ITA_missiolini_pacify_ethiopia: "平定埃塞俄比亞"
 ITA_missiolini_pacify_ethiopia_desc: "為儘快平定阿比西尼亞並將其納入統治，領袖下令強力討滅當地叛軍並立法嚴管人民。"
 ITA_missiolini_pacify_ethiopia_vanilla: "$ITA_missiolini_pacify_ethiopia$"
 ITA_missiolini_pacify_ethiopia_vanilla_desc: "$ITA_missiolini_pacify_ethiopia_desc$"
 ITA_pacify_ethiopia_goal_tt: "所有埃塞俄比亞初始地區順從度高於§Y60%§!"
 ITA_missiolini_strengthen_heavy_industry: "工業化項目"
 ITA_missiolini_strengthen_heavy_industry_desc: "為了讓意大利實現真正的繁榮富強，我們需要建造新的工廠來維持帝國的蓬勃發展與生產力的提高。"
 ITA_missiolini_strengthen_heavy_industry_trigger_tt: "$TRIGGER_NUM_OF_CIVILIAN_FACTORIES_MORE_THAN$§Y[?ITA_missiolinis_required_civs]§!。（當前 §[GetColorNumOfCivsMissiolinis][?ROOT.num_of_civilian_factories]§!。）"
 ITA_missiolini_strengthen_the_army: "強化陸軍"
 ITA_missiolini_strengthen_the_army_desc: "就像古羅馬帝國一樣，我們新興的帝國幅員遼闊，需要強大的軍隊御蠻夷於國門之外。"
 ITA_missiolini_stockpile_trucks: "儲備卡車"
 ITA_missiolini_stockpile_trucks_desc: "我們需要一支機動部隊，其應能快速穿越大片領土，且不會受後勤滯後問題拖累。"
 ITA_missiolini_stockpile_fuel: "增加燃料儲備"
 ITA_missiolini_stockpile_fuel_desc: "現代部隊的行軍需要同時用到糧食和燃油，不然整臺戰爭機器就將停轉。各軍種都需要燃油，而我們如要決勝沙場，就必須有供給大量燃油的實力。"
 ITA_missiolini_strengthen_the_airforce: "強化空軍"
 ITA_missiolini_strengthen_the_airforce_desc: "意大利皇家空軍一直代表著我國的榮耀，且曾是世界一流空軍。我們空軍的擴編和復興需要生產更多的飛機。"
 ITA_missiolini_strengthen_the_airforce_fighters_goal_tt: "已生產或獲得§Y[?ROOT.ITA_missiolinis_fighters_to_produce]§!架新的§Y$fighter_equipment$§!。\n\n當前已部署戰鬥機：§G[?ROOT.num_deployed_planes_with_type@small_plane_airframe]§! -當前庫存戰鬥機§G[?ROOT.num_equipment@small_plane_airframe]§! -戰鬥機總數目標§Y[?ITA_missiolinis_fighters_goal]§!\n"
 ITA_missiolini_strengthen_the_airforce_bombers_goal_tt: "已生產或獲得§Y[?ROOT.ITA_missiolinis_bombers_to_produce]§!架新的§Y$CAS_equipment$§!、§Y$nav_bomber_equipment$§!或§Y$tac_bomber_equipment$§!（只計算一種類型）。\n當前已部署近距支援機：§G[?ROOT.num_deployed_planes_with_type@small_plane_cas_airframe]§! -當前庫存近距支援機§G[?ROOT.num_equipment@small_plane_cas_airframe]§! -近距支援機總數目標§Y[?ITA_missiolinis_cas_goal]§!\n當前已部署海軍轟炸機：§G[?ROOT.num_deployed_planes_with_type@small_plane_naval_bomber_airframe]§! -當前庫存海軍轟炸機§G[?ROOT.num_equipment@small_plane_naval_bomber_airframe]§! -海軍轟炸機總數目標§Y[?ITA_missiolinis_naval_bombers_goal]§!\n當前已部署戰術轟炸機：§G[?ROOT.num_deployed_planes_with_type@medium_plane_airframe]§! -當前庫存戰術轟炸機§G[?ROOT.num_equipment@medium_plane_airframe]§! -戰術轟炸機總數目標§Y[?ITA_missiolinis_tactical_bombers_goal]§!"
 ITA_missiolini_industrial_research: "工業研究"
 ITA_missiolini_industrial_research_desc: "我們一定要向世界展示法西斯主義和意大利民族能夠飛速實現技術革新。"
 ITA_missiolini_expand_intelligence_agency: "擴張情報部門"
 ITA_missiolini_expand_intelligence_agency_desc: "通過擴大我們的情報部門，我們將滲透到意大利社會的方方面面，讓共產主義者、犯罪分子和其他害群之馬無處遁形並被繩之以法，使意大利更加長治久安。"
 ITA_missiolini_occupy_albania: "佔領阿爾巴尼亞"
 ITA_missiolini_occupy_albania_desc: "意大利和阿爾巴尼亞之間的緊密聯繫可以追溯到幾千年前的羅馬帝國。我們必須將阿爾巴尼亞納入意大利，以確保亞得里亞海入海口的安全。"
 ITA_missiolini_firmly_established_italian_administration_autonomy_text: "穩固地建立[ROOT.GetAdjective]行政機構"
 ITA_missiolini_occupy_albania_occupation_effects: "如果[ROOT.GetFlag][ROOT.GetNameDef]控制[ALB.GetFlag][ALB.GetAdjective]的核心地區：\n"
 ITA_missiolini_occupy_albania_subject_effects: "如果[ALB.GetFlag][ALB.GetNameDef]是§Y[ROOT.GetFlag][ROOT.GetNameDef]§!的附屬國：\n"
 ITA_missiolini_occupy_dalmatia: "佔領[103.GetName]"
 ITA_missiolini_occupy_dalmatia_desc: "我們必須糾正世界大戰造成的嚴重不公，用武力奪取理所當然屬於我們的東西。達爾馬提亞必須歸於意大利！"
 ITA_missiolini_occupy_dalmatia_occupation_effects: "\n如果[ROOT.GetFlag][ROOT.GetNameDef]控制§Y[103.GetName]§!：\n每一處被[ROOT.GetFlag][ROOT.GetNameDef]完全控制的[YUG.GetFlag][YUG.GetAdjective]核心化地區： \n   順從度：§G+5.0%§!. \n   抵抗度：§G-5.0%§!"
 ITA_missiolini_occupy_dalmatia_subject_effects: "\n 如果§Y[103.GetName]§!被原[YUG.GetAdjective]的[ROOT.GetAdjective]附屬國完全控制： \n   原[YUG.GetAdjective]的所有[ROOT.GetAdjective]附屬國： \n"
 ITA_missiolini_occupy_greece: "佔領[GRE.GetName]"
 ITA_missiolini_occupy_greece_desc: "就像古羅馬軍團一樣，我們也可以通過征服希臘來打破強加給我們的束縛，統一我們的兄弟民族。"
 ITA_missiolini_occupy_greece_occupation_effects: "\n每一處被[ROOT.GetFlag][ROOT.GetNameDef]完全控制的[GRE.GetFlag][GRE.GetAdjective]核心化地區： \n   順從度：§G+5.0%§!. \n   抵抗度：§G-5.0%§! \n\n當前效果："
 ITA_missiolini_occupy_greece_subject_effects: "\n如果[GRE.GetFlag][GRE.GetName]是§Y[ROOT.GetFlag][ROOT.GetNameDef]§!的附屬國：\n"
 ITA_missiolini_occupy_ticino: "佔領[846.GetName]"
 ITA_missiolini_occupy_ticino_desc: "自從漢尼拔帶著他的象兵翻越阿爾卑斯山以來，該山脈就成了蠻族直達意大利腹地的交通要道。我們必須確保我們北部邊境的安全。"
 ITA_missiolini_occupy_ticino_occupation_effects: "\n[846.GetName]和每一處被[ROOT.GetFlag][ROOT.GetNameDef]完全控制的[SWI.GetFlag][SWI.GetAdjective]核心化地區： \n   順從度：§G+5.0%§!. \n   抵抗度：§G-5.0%§! \n\n當前效果："
 ITA_missiolini_occupy_ticino_subject_effects: "\n如果[SWI.GetFlag][SWI.GetName]是§Y[ROOT.GetFlag][ROOT.GetNameDef]§!的附屬國：\n"
 ITA_missiolini_bolster_political_cabinet: "加強政府內閣"
 ITA_missiolini_bolster_political_cabinet_desc: "如何人盡其才一直是個難題。我們在尋找人才時絕不能漏掉任何機會。"
 ITA_missiolini_bolster_political_cabinet_trigger_tt: "已任命§Y3§!位$political_advisor$，且他們中至少有一位是§Y首腦§!"
 ITA_missiolini_bolster_military_high_command: "加強軍事指揮層"
 ITA_missiolini_bolster_military_high_command_desc: "發現提拔優秀後備人才到總指揮部將強化我們在未來戰爭中的戰略戰術推演能力。"
 ITA_missiolini_bolster_military_high_command_trigger_tt: "已任命§Y3§!位$high_command$顧問"
 ITA_victory_in_ethiopia_flag: "意大利在意埃戰爭中取得勝利。"
 ITA_balance_of_power_category: "$ITA_power_balance$"
 ITA_bop_take_over_ministry_of_foreign_affairs: "£BoP_right_texticon 接管外交部"
 ITA_bop_take_over_ministry_of_foreign_affairs_desc: "若貝尼托·墨索里尼兼任外交部長，則可直接控制意大利外交政策。"
 ITA_bop_resign_ministry_of_foreign_affairs_position: "£BoP_left_texticon 辭任外交部"
 ITA_bop_resign_ministry_of_foreign_affairs_position_desc: "若貝尼托·墨索里尼辭任外交部長的位置，則會減少其對意大利外交政策的控制，同時其他人可以就職。"
 ITA_bop_take_over_ministry_of_justice: "£BoP_right_texticon 接管司法部"
 ITA_bop_take_over_ministry_of_justice_desc: "若貝尼托·墨索里尼兼任宗教與司法部長，則其將可直接掌控意大利司法系統和機關。"
 ITA_bop_resign_ministry_of_justice_position: "£BoP_left_texticon 辭任司法部"
 ITA_bop_resign_ministry_of_justice_position_desc: "若貝尼托·墨索里尼辭任宗教與司法部長的位置，則會減少其對意大利司法系統的控制，同時其他人可以就職。"
 ITA_bop_take_over_ministry_of_education: "£BoP_right_texticon 接管教育部"
 ITA_bop_take_over_ministry_of_education_desc: "若貝尼托·墨索里尼兼任公共教育部長，則可直接直接控制意大利教育機構。"
 ITA_bop_resign_ministry_of_education_position: "£BoP_left_texticon 辭任教育部"
 ITA_bop_resign_ministry_of_education_position_desc: "若貝尼托·墨索里尼辭任公共教育部長的位置，則會減少其對意大利教育機構的控制，同時其他人可以就職。"
 ITA_bop_take_over_ministry_of_corporations: "£BoP_right_texticon 接管勞聯部"
 ITA_bop_take_over_ministry_of_corporations_desc: "若貝尼托·墨索里尼兼任勞聯部長，則可直接控制意大利財政體系機關。"
 ITA_bop_resign_ministry_of_corporations_position: "£BoP_left_texticon 辭任勞聯部"
 ITA_bop_resign_ministry_of_corporations_position_desc: "若貝尼托·墨索里尼辭任勞聯部長的位置，則會減少其對意大利財政體系機關的控制，同時其他人可以就職。"
 ITA_mussolini_took_over_minister_of_foreign_affairs_flag: "距離§Y[ROOT.ITA_benito_mussolini.GetName]§!接管外交部已經過去了§Y365日§!\n（當前已經過去了§Y[?ITA_mussolini_took_over_minister_of_foreign_affairs_flag:days|Y0]§!日）"
