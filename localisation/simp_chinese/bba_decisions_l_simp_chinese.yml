 ETH_support_resistance_decision_cost: "£command_power §Y25§!"
 ETH_support_resistance_decision_cost_blocked: "£command_power §R25§!"
 ETH_anti_colonialism_decision: "反[FROM.GetAdjective]宣傳"
 ETH_anti_colonialism_decision_desc: "[FROM.GetAdjective]在非洲的帝國主義必須被終結。這個世界需要覺醒並意識到[FROM.GetAdjective]的殖民時代已經結束了。[FROM.GetNameDef]人民必須向他們的領導人施壓，要求解放他們控制的非洲殖民地。"
 ETH_demand_peace_decision: "要求[?FROM.previous_overlord.GetAdjective]承認[FROM.GetNameDef]"
 ETH_demand_peace_decision_desc: "[FROM.GetName]勇敢的人民已經起義對抗[?FROM.previous_overlord.GetAdjective]的暴政。我們必須立刻行動，用盡一切手段迫使[?FROM.previous_overlord.GetNameDef]從[FROM.GetAdjective]國內撤退。"
 ETH_demand_peace_decision_tt: "§Y[?FROM.previous_overlord.GetNameWithFlag]§!被敦促結束與§Y[FROM.GetNameWithFlag]§!的戰爭。"
 ETH_currently_demanding_peace_flag: " 正在要求和談"
 ETH_social_reforms_category: "安那其共產主義社會改革"
 ETH_social_reforms_category_desc: "我們需要大量的社會改革以克服[ETH.GetName]文化與地區的差異，如此我們才能維持團結。"
 ETH_education_reforms_decision: "教育系統改革"
 ETH_education_reforms_decision_desc: "為了防止未來的反動運動發展，我們必須改革教育系統，從而讓孩子們成長為有自由思維的人，而非資本家的奴才。"
 ETH_collectivization_reforms_decision: "土地改革"
 ETH_collectivization_reforms_decision_desc: "儘管勞作的一直都是人民，[ETH.GetNameDefCap]的土地長久以來一直都被王公貴族所佔據。通過土地再分配，我們有機會使得所有人都成為他們自己命運的主人。"
 ETH_secularization_reforms_decision: "世俗化改革"
 ETH_secularization_reforms_decision_desc: "[ETH.GetNameDefCap]的民眾文化信仰各異，其原因可追溯到幾個世紀以前。如果我們不希望未來發生宗派暴力事件，就需要擺脫迷信的束縛。"
 ETH_freedom_at_gunpoint_category: "槍桿子裡出自由"
 ETH_freedom_at_gunpoint_category_desc: "我們的鄰居仍困於帝國主義者的奴役。是時候將我們戰爭的經驗和新積攢起的經濟實力投入使用了。我們將用殖民者唯一懂得的語言——暴力，來解放非洲。"
