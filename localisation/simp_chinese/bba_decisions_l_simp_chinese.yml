 SWI_field_hospital_for_militias: "民兵部隊野戰醫院"
 SWI_field_hospital_for_militias_desc: "[ROOT.GetNonIdeologyName]有平等博愛、治病救人的悠久傳統。我們必須利用好這一傳統，幫助我們的民兵更好的保衛國家。"
 SWI_support_for_militias: "為民兵提供支援部隊"
 SWI_support_for_militias_desc: "我們可以通過提供足夠的支援來強化民兵部隊，使他們更為靈活和頑強。"
