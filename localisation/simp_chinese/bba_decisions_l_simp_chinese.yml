 ETH_prospect_for_resources: "資源勘探"
 ETH_prospect_for_resources_desc: "[FROM.GetName]的土地上有豐富的自然資源等著我們發現。足夠深入的鑽探與挖掘能夠使[ROOT.GetName]成為更富有的國家。"
 ETH_japanese_industrial_investments_decision: "日本工業投資"
 ETH_japanese_industrial_investments_decision_desc: "日本投資者正在非洲尋找新的投資機會，而[FROM.GetName]可能是他們進行工業投資的完美地點。"
 ETH_japanese_investments_flag: " 日本投資進行中 "
 ETH_local_development_state_grows_mission: "[?ETH.ETH_local_state.GetName]的發展"
 ETH_local_development_state_grows_mission_desc: "[?ETH.ETH_local_state.GetName]在當前治理下發展繁榮。農業出口得到增長，城市與村莊規模也在發展。"
 ETH_max_japanese_investments_tt: "最多可以投資§Y3§!個地區。已投資地區數量：§Y[?ETH_japanese_invesment_states]§!"
 ETH_japanese_infrastructure_investments_decision: "日本基礎設施投資"
 ETH_japanese_infrastructure_investments_decision_desc: "日本投資者正在非洲尋找新的投資機會，而[FROM.GetName]可能是他們進行基礎設施建設投資的完美地點。"
 ETH_japanese_dockyard_investments_decision: "日本造船業投資"
 ETH_japanese_dockyard_investments_decision_desc: "日本投資者正在非洲尋找新的投資機會，而[FROM.GetName]可能是他們進行造船設施投資的完美地點。"
 ETH_local_development_industry_grows_mission: "在[?ETH.ETH_local_state.GetName]的工業擴張"
 ETH_local_development_industry_grows_mission_desc: "[?ETH.ETH_local_state.GetName]的小規模製造業正蓬勃發展。如果我們繼續扶持，整個[ROOT.GetName]都將受益。"
 ETH_local_development_arms_industry_grows_mission: "[?ETH.ETH_local_state.GetName]本地武器生產"
 ETH_local_development_arms_industry_grows_mission_desc: "[?ETH.ETH_local_state.GetName]當地的武器製造商的出口量已有了顯著的增長，且正在達到能夠使整個國家受益的水平。"
 ETH_local_development_improved_production_mission: "[?ETH.ETH_local_state.GetName]已建立本地建設委員會"
 ETH_local_development_improved_production_mission_desc: "[?ETH.ETH_local_state.GetName]當地委員會正在改善工作環境、設施與工藝。"
