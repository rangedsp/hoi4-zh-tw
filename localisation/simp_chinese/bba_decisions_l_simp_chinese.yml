 ETH_anti_colonialism_category: "反殖民主義"
 ETH_anti_colonialism_category_desc: "我們將竭盡所能支持整個地區的抵抗運動，直到帝國主義帶來的苦難徹底消失。"
 ETH_anti_colonialism_map_category_name: "可煽動起義的被殖民國家"
 ETH_support_resistance_decision: "在[FROM.GetName]煽動反[FROM.OWNER.GetAdjective]起義"
 ETH_support_resistance_decision_desc: "支持起義軍推翻[FROM.Owner.GetAdjective]統治。"
 ETH_arm_resistance_decision: "武裝[FROM.GetName]的反[FROM.OWNER.GetAdjective]勢力"
 ETH_arm_resistance_decision_desc: "武裝該國起義軍。"
 ETH_support_independence_decision: "支持[FROM.GetAdjective]獨立"
 ETH_support_independence_decision_desc: "支持[FROM.GetAdjective]獨立"
