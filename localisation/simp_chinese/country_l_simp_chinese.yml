 ARMY_EXPERIENCE_DESC: "當你的武器裝備被投入戰爭中使用時，你就能夠獲得陸軍經驗。因此，這意味著你可以通過調動§H陸軍師§!作戰，或者§H租借§!武器裝備給你的盟友參戰來直接或間接獲得陸軍經驗。\n你也可以通過調動經驗等級至少為$UNIT_TRAINING_LEVEL|Y$的部隊進行§H陸軍演習§!，以及執行某些特定的§H國策§!來獲得經驗。某些§H閣僚§!能夠增加獲得的經驗。\n\n陸軍經驗用於新設或者修改你的§H陸軍師編制§!解鎖§H學說§!。"
