l_simp_chinese:
 autonomous_state: "自治地區"
 semi_autonomous_state: "半自治地區"
 SPA_a_great_spain: "大西班牙"
 SPA_a_great_spain_desc: "新生的第二共和國未能履行保護宗教、家庭和財產的職責。當左翼分子的陰影籠罩了基督教文明之時，西班牙右翼自治組織聯合會將站出來捍衛我們，並帶來真正的團結和嶄新的精神力量。議會要麼服從人民的意願，要麼去滅亡。"
 SPA_hand_over_the_ceda_campaign_chest: "移交CEDA競選資金"
 SPA_hand_over_the_ceda_campaign_chest_desc: "競選活動結束後，我們還有剩餘的資金。如果議會駁回我們的呼聲，我們就必須準備好消滅它。我們將把西班牙右翼自治組織聯合會的競選資金移交給開明的一方，幫助他們做好反對左翼的起義準備。"
 SPA_negotiate_carlist_support: "與卡洛斯派談判"
 SPA_negotiate_carlist_support_desc: "只需稍加拉攏，我們的事業就能得到盟友協助。左翼的反教會情緒使得長期反對共和國的卡洛斯派反感，如果能夠爭取到他們的支持，起義將更加有力。"
 SPA_negotiate_carlist_support_tt: "在內戰開始時，獲得5個訓練有素的含§Y3個步兵營§!的部隊。\n"
 SPA_negotiate_carlist_support_tt_2: "§R 內戰結束後，如果西班牙不是卡洛斯派執政，這些部隊將會被移除！§!\n"
 SPA_the_army_of_africa: "非洲軍團"
 SPA_the_army_of_africa_desc: "久經沙場的非洲軍團是在即將到來的鬥爭中取勝的關鍵。我們必須確保他們忠於我們的事業，制定好迅速佔領北非的計劃，然後準備把這些驍勇善戰的部隊轉移到本土，以期戰爭的天平偏向我們一方。"
 SPA_the_army_of_africa_tt: "在內戰開始時，獲得5個訓練有素的含§Y7個步兵營§!和§Y2個炮兵營§!的部隊，並帶有§Y偵查§!和§Y工兵§!支援連，並確保控制§Y[290.GetName]§!。\n"
 SPA_secure_the_northern_garrisons: "確保北方駐軍支持"
 SPA_secure_the_northern_garrisons_desc: "適當的“鼓勵手段”能使我們得到北方駐軍軍官的支持。一旦初步政變失敗，那麼他們正值時機的起義可以作為我們對左翼發動戰爭的穩固勢力根基。"
 SPA_secure_the_northern_garrisons_tt: "在§Y[171.GetName]§!、§Y[174.GetName]§!、§Y[788.GetName]§!、§Y[791.GetName]§!、§Y[176.GetName]§!、§Y[166.GetName]§!、§Y[172.GetName]§!的§Y駐軍控制§!增加到§G完全§!。\n\n\n內戰開始時，只要§Y駐軍控制§!至少是§O弱§!，國民軍將控制這些地區。"
 SPA_sin_paquito: "蹬開佛朗哥"
 SPA_sin_paquito_desc: "因為懷疑弗朗西斯科·佛朗哥的忠誠，政府已經派遣他去指揮加那利群島的部隊。儘管受到邀請，他卻從未承諾支持我們，僅出於其優柔寡斷而加以婉拒。如果這位“1936年加那利群島小姐”不打算與我們一道，那即使沒有他，我們也得繼續推進。"
 SPA_con_paquito: "聯合佛朗哥"
 SPA_con_paquito_desc: "我們的事業需要強大的領袖，而弗朗西斯科·佛朗哥掌握著耀武揚威的非洲軍團的忠誠。為了起義的成功，儘管他遲遲不做決定，我們也必須爭取到他的支持，即使代價可能十分高昂……"
 SPA_con_paquito_tt: "在內戰開始時，§Y弗朗西斯科·佛朗哥§!成為國民軍的一名陸軍元帥。\n"
 SPR_the_popular_front: "人民陣線"
 SPR_the_popular_front_desc: "法西斯主義和宗教迷信對個人自由構成了莫大的威脅，我們必須建立廣泛的政黨陣線，聯合起來反對右翼。只有團結起來，我們才能阻止他們的推進，才能拯救我們的共和國。"
 SPR_secure_the_guardia_de_asalto: "確保突擊衛隊忠誠"
 SPR_secure_the_guardia_de_asalto_desc: "社會極化正在加劇，暴力也隨之而來。我們必須確保我們訓練有素的重裝警察後備部隊——突擊衛隊的忠誠。如果暴力持續升級，他們將發揮極大作用。"
 SPR_secure_the_guardia_de_asalto_tt: "在內戰開始時，獲得3支訓練過的含§Y6個步兵營§!的部隊。\n國民軍獲得6支缺乏訓練的含§Y3個步兵營§!的部隊。"
 SPR_secure_the_guardia_de_asalto_tt_2: "在內戰開始時，獲得3支訓練過的含§Y6個步兵營§!的部隊。\n國民軍獲得10支缺乏訓練的含§Y3個步兵營§!的部隊。"
 SPR_secure_the_guardia_get_both_types_tt: "§R如果任一國策都沒有被選取，國民軍將獲得全部兩種類型的部隊！§!\n"
 SPR_secure_the_guardia_civil: "確保國民警衛隊忠誠"
 SPR_secure_the_guardia_civil_desc: "極端分子不斷破壞公共秩序，而止亂制暴的前線是國民警衛隊。如果我們要制止暴力並保持控制，則必須優先確保我們國家警察部隊的忠誠。"
 SPR_secure_the_guardia_civil_tt: "在內戰開始時，獲得6支缺乏訓練的含§Y3個步兵營§!的部隊。\n國民軍獲得3支訓練過的含§Y6個步兵營§!的部隊。"
 SPR_secure_the_guardia_civil_tt_2: "在內戰開始時，獲得10支缺乏訓練的含§Y3個步兵營§!的部隊。\n國民軍獲得5支訓練過的含§Y6個步兵營§!的部隊。"
 SPR_train_the_union_youth: "訓練青年團"
 SPR_train_the_union_youth_desc: "反叛的謠言在軍隊中瀰漫，而我們必須為最壞的情況做好準備。我們將向青年支持者中忠誠和堅定的那部分人提供使用武器和基礎軍事戰術的速成課程，以便在最壞的情況發生時可以立即武裝他們。"
 SPR_train_the_union_youth_tt: "在內戰開始時，獲得5個訓練有素的含§Y3個步兵營§!的部隊。\n"
 SPR_enlarge_the_weapon_caches: "擴充武器儲存處"
 SPR_enlarge_the_weapon_caches_desc: "早在1934年阿斯圖里亞斯礦工罷工之前，我們就已經在全國各地秘密建立了武器儲存處，以備在必需之時用來捍衛我們的自由。危機時刻當前，我們將進一步擴充它們。"
 SPR_enlarge_the_weapon_caches_tt: "在內戰開始時，保留§Y80%§!而不是§Y50%§!的裝備數量。\n"
 SPR_distribute_arms_to_the_people: "向民眾分發武器"
 SPR_distribute_arms_to_the_people_desc: "軍隊的不忠現在已是板上釘釘的事，顯然不能依靠他們來捍衛共和國的價值觀。我們應該開始向那些掛懷著共和國最高利益的人們分發武器，以此構築成抵抗叛軍的第一道防線。"
 SPR_distribute_arms_to_the_people_tt: "在內戰開始時，獲得10支未經訓練的含§Y3個步兵營§!的部隊。\n"
 SPR_disband_the_army: "解散軍隊"
 SPR_disband_the_army_desc: "我們再也不能忽視軍隊不忠的跡象。即使這可能會點燃導火索，我們也別無選擇，惟有立即解散軍隊並奪得主動地位。"
 SPR_disband_the_army_tt: "§G減少在內戰開始時站在國民軍陣營的部隊比例，從§Y50%§!降至§Y20%§!，並減少非洲軍團的師部隊數目，從§Y5§!個師降至§Y3§!個師。§!\n忠誠派那§Y80%§!份額的部隊將會被§R解散§!，但其裝備將會回到庫存中。\n\n如果這個國策沒有被選取，政府將會在內戰開始時被動地解散軍隊，並且沒有任何獎益。\n\n§R不忠的軍隊殘部將會立即掀起內戰！§!\n"
 SPA_the_phalanx_ascendant: "長槍黨崛起"
 SPA_the_phalanx_ascendant_desc: "現在正是長槍黨崛起的時刻。失控的共和國正處於其毀滅的當口，而儘管未來的戰鬥道阻且長，但我們已邁出了西班牙帝國重生的第一步。"
 SPA_bolster_offensive_infrastructure: "鼓勵進攻性基建"
 SPA_bolster_offensive_infrastructure_desc: "進攻計劃中最大的瓶頸，是無法為前線部隊提供足夠的補給。著重於改善這些環節的基礎設施，將會極大的強化我軍的進攻行動。"
 SPA_bolster_offensive_infrastructure_tt: "需要西班牙內戰已爆發。\n在3個前線地區增加§Y1級基礎設施§!。\n"
 SPA_the_fifth_column: "第五縱隊"
 SPA_the_fifth_column_desc: "用埃米利奧·莫拉的話來說：“當我的四個縱隊接近馬德里時，支持者們組成的第五縱隊將在城內揭竿而起，內部瓦解共和軍的防禦。”在進軍路上所有的城市中組織這些“第五縱隊”，將為我們帶來決定性的優勢。"
 SPA_the_fifth_column_tt: "解鎖§Y啟用第五縱隊§!決議，允許在敵方領土上製造小規模起義。\n"
 SPA_emergency_munitions_corporations: "應急軍火公司"
 SPA_emergency_munitions_corporations_desc: "如果我們要為勇敢的士兵們維持充足的補給水平，就必須立即強化戰爭態勢。我們將組織那些不參加戰鬥的人員進入臨時工廠工作，來生產部隊最基本的必需品。"
 SPA_the_corpo_truppe_volontarie: "志願軍團"
 SPA_the_corpo_truppe_volontarie_desc: "我們在[ITA.GetNameDef]的朋友已經派遣了志願軍團來支援鬥爭，但是若要取得勝利，則必須著力擴充志願軍團。我們將派外交使節到[ITA.GetNameDef]去支持我們的事業，並獲取支援我方的進一步軍事援助。"
 SPA_the_condor_legion: "禿鷹軍團"
 SPA_the_condor_legion_desc: "我們在[GER.GetNameDef]的朋友已經派遣了禿鷹軍團來協助我們的戰鬥，但是若要取得勝利，則必須著力擴充禿鷹軍團。我們將派外交使節到[GER.GetNameDef]去支持我們的事業，並獲取支援我方的進一步軍事援助。"
 SPA_equipment_shipments: "海運裝備"
 SPA_equipment_shipments_desc: "確保勝利所需要的不僅僅是部隊。我們必須讓外國支持者瞭解到當前緊迫的裝備缺口，以及他們怎麼做才能幫得上忙。"
 SPA_obtain_training_staff: "獲得教官"
 SPA_obtain_training_staff_desc: "儘管這可能有損自尊，但必須承認外國支持者們在戰爭方面擁有卓越的經驗。我們應該邀請他們的軍事專家來西班牙指導我們的軍官，幫助我們訓練部隊，以獲得對抗共和軍的必要優勢。"
 SPA_doctrinal_advancements: "學說進步"
 SPA_doctrinal_advancements_desc: "過去幾十年間，我們的外國支持者已經于軍事思想和學說方面取得了豐富的成就。或許我們可以說服他們共享軍事理論，以使我們在當前戰爭中加以實踐。"
 SPA_secure_the_national_defense_council: "主導國防委員會"
 SPA_secure_the_national_defense_council_desc: "我們的事業沒有領導者，而由一個目標鬆散的軍人和平民領袖組成的軍政府統領。如果要達成我們的意願，實現西班牙應得的重生，就必須確保我們在這個多樣化甚至是爭吵不休的組織中佔據主導地位。"
 SPA_suspend_the_constitution: "中止憲法"
 SPA_suspend_the_constitution_desc: "我們如果固守那部漏洞百出的憲法，就必定止步不前。我們將中止憲法並給軍事過渡政府讓路，來帶領我們渡過這次必經的手足相戕。而軍政府也終將為一個嶄新的強力威權政府鋪平道路。"
 SPA_primo_de_rivera_prisoner_exchange: "交換普里莫·德·里維拉出獄"
 SPA_primo_de_rivera_prisoner_exchange_desc: "西班牙長槍黨的創始人，亦老獨裁者米戈爾·普里·德·里維拉之子，何塞·安東尼奧·普里莫·德·里維拉，在內戰爆發前就被囚禁了。共和派已表示願意同我們進行囚犯交換，而若要奪回我們的意識形態領袖，除同意外別無他法。"
 SPA_eliminate_the_carlists: "消滅卡洛斯派"
 SPA_eliminate_the_carlists_desc: "我們對西班牙的願景與卡洛斯派水火不容。這群固守著腐朽王朝的遺老，領導無能，幫眾愚信，對西班牙的未來百害而無一利。我們必須把這群反對派連根拔起，才能讓真正的強大領袖站到臺前，以鐵拳統一國家。"
 SPR_carlist_uprising_flag: "卡洛斯派已經起義。"
 SPA_absorb_carlist_remnants: "吸納卡洛斯派殘黨"
 SPA_absorb_carlist_remnants_desc: "隨著卡洛斯派接近土崩瓦解，殘黨中的溫和派也許仍能在前線發揮餘熱。我們不該讓機會白白溜走——每個可能派上用場的人力都得用來推動邁向全體長槍黨的目標。"
 SPA_establish_the_directory: "建立督政府"
 SPA_establish_the_directory_desc: "起義的幕後主使，埃米利奧·莫拉，在得到了軍政府與長槍黨領袖的支持後啟動了他計劃的下一步：成立督政府以統領內戰各方，直至國家安定。"
 SPA_establish_the_directory_tt: "§Y[ROOT.GetName]§!將改名為§Y西班牙督政府§!\n"
 SPA_a_one_party_state: "一黨專政"
 SPA_a_one_party_state_desc: "民主制度，並不像共和派試圖蠱惑我們的一般，說什麼“本身就是目的”。這事實上不過是讓軟弱無能者掌握國家的手段。我們將取締所有其他政黨，以此有遠見卓識的人在西班牙通往偉大之路上不至於被拖累。"
 SPA_a_one_party_state_tt: "當前§Y非法西斯黨派§!總體支持度的一半將適用於§R穩定度§!的懲罰：\n"
 SPA_expand_conscription: "擴大徵兵"
 SPA_expand_conscription_desc: "國家在內戰中山河破碎，但對共和派的壓力絲毫不能鬆懈。我們需要新一波攻勢，以及用以發動進攻的新一輪徵兵。"
 SPA_safeguard_the_freedom_of_worship: "捍衛信仰自由"
 SPA_safeguard_the_freedom_of_worship_desc: "對上帝的信仰在共和派的威脅下正搖搖欲墜，而我們必須向每個人都講清楚，我等方為基督教最後的堡壘。我們將捍衛每一個基督徒信仰的權利與自由，而所有與上帝同在的人都可以同我等並肩作戰。"
 SPA_prepare_the_pyrenees_defenses: "構築比利牛斯防線"
 SPA_prepare_the_pyrenees_defenses_desc: "我們聽說了共和派向[FRA.GetNameDef]求援的傳言。即使可能性不高，我們仍不能冒險讓北部邊境門戶大開。必須立即著手進行防禦準備以應對可能發生的[FRA.GetAdjective]干涉。"
 SPA_prepare_the_pyrenees_defenses_tt: "在下列靠近法國邊境省份生成2級§Y要塞§!，包括：§Y巴斯克§!，§Y納瓦拉§!，§Y西阿拉貢§!，§Y東阿拉貢§!與§Y加泰羅尼亞§!。\n"
 SPA_develop_all_talent: "人盡其才"
 SPA_develop_all_talent_desc: "對於有能力接受高等教育的人，應預先保證其受教育渠道，同時提供必要資金助力可能有益於國家的科研活動。我們對研發機構的投資無疑將會在多個領域結出碩果。"
 SPA_regional_agrarian_commissions: "地區農業委員會"
 SPA_regional_agrarian_commissions_desc: "鄉村地區在戰火中慘遭蹂躪。為確保人民免於饑荒，我們需立即著手於各地區的農業委員會籌建工作。這將最大化所剩耕地的生產力，以此得以填飽人們的肚子。"
 SPA_the_national_syndicalist_state: "國家工團主義"
 SPA_the_national_syndicalist_state_desc: "內戰已經結束，現在是時候讓臨時軍政府讓渡控制權了，並讓長槍黨的真正領袖登上舞臺來開闢西班牙的新時代。"
 SPA_the_national_syndicalist_state_tt: "§Y[ROOT.GetName]§!將改名為§Y西班牙帝國§!\n"
 SPA_syndicalize_production: "工團化生產"
 SPA_syndicalize_production_desc: "我們的道路既非資本主義，又非共產主義。國家工團的成立將使工人和資本家同心協力，最大化生產力並使整個西班牙更進一步。"
 SPA_strengthen_the_supreme_reality_of_spain: "強化西班牙至上思想"
 SPA_strengthen_the_supreme_reality_of_spain_desc: "分離主義、異見與地方自治在西班牙國土上為禍已久。我們將摒棄這些愚蠢觀念，取而代之的是一個統一的西班牙。無論屬於什麼團體或階級，每一個人都能依靠它，每一個人都能為它作出貢獻。"
 SPR_recovering_from_civil_war_focus_tt: "解鎖§Y從內戰中恢復§!決議，在高§Y順從度§!時，可以將擁有的西班牙地區變回§Y核心地區§!狀態。\n"
 SPA_glory_and_wealth_on_the_sea_lanes: "航線上的榮耀與財富"
 SPA_glory_and_wealth_on_the_sea_lanes_desc: "西班牙的天命始終在大洋彼端。只要重新控制海上航路，榮耀與財富將等候著我們，正如往日一般。"
 SPA_improve_domestic_naval_facilities: "改善國內海軍設施"
 SPA_improve_domestic_naval_facilities_desc: "一支強大的海軍需要良好的基礎設施。新建一些海軍船塢與設施不僅必要，而且需要立即著手行動。"
 SPA_a_great_maritime_power: "海洋強國"
 SPA_a_great_maritime_power_desc: "西班牙的威名一度震懾四海。雖然最近幾百年間我國時運不濟，但與海洋的聯繫始終未曾斷絕。我們將賡續海洋傳統，重返全世界的各大航道。"
 SPA_commerce_protection: "保護商業"
 SPA_commerce_protection_desc: "當下，全球貿易對一個健康經濟體的重要性更勝往日。保護本國商船的能力將助力我國在未來任何的衝突中佔據有利地位。"
 SPA_exemplify_the_art_and_science_of_warfare: "呈現戰爭藝術與科學"
 SPA_exemplify_the_art_and_science_of_warfare_desc: "戰爭是一門科學，亦是一門藝術，因此必須為那些矢志於探索新想法的人提供所需工具與設施。"
 SPA_the_will_to_empire: "帝國意志"
 SPA_the_will_to_empire_desc: "我們決意光復帝國輝煌。我們認為西班牙歷史成於帝國盛世。我們要求西班牙屹立於歐洲。我們宣告西班牙將一如既往支撐起西語世界的脊梁。"
 SPA_unite_iberia: "統一伊比利亞"
 SPA_unite_iberia_desc: "葡萄牙與西班牙曾一度統一，而有人認為應該一如往昔。我們認可這個觀點，伊比利亞的統一對提高我國世界地位的作用不可估量。"
 SPA_absorb_the_portuguese_empire: "吸納葡萄牙帝國"
 SPA_absorb_the_portuguese_empire_desc: "現在是時候了，我們不僅要控制葡萄牙大陸，而且要真正把我們的國家團結在一起。即使人們可能還不這麼認為，但人心是很容易改變的，第一步是使他們完全融入我們的領土，第二步是征服葡萄牙殖民帝國，這也是我們新的伊比利亞霸權的一部分。"
 SPA_claim_the_aragonese_possessions: "宣稱阿拉貢舊領"
 SPA_claim_the_aragonese_possessions_desc: "阿拉貢王國一度連亙於地中海。作為阿拉貢王國的歷史承繼，西班牙理應重新控制這些領土，我們亦如是主張。"
 SPA_reclaim_spanish_africa: "擴大西屬非洲"
 SPA_reclaim_spanish_africa_desc: "我國北非領土邊境沒有理由明確劃定。當下法國費拉不堪，至於宣稱該地區，也許不再會有更好的機會來豪賭一把了。"
 SPA_reassert_american_dominance: "重申美洲統治地位"
 SPA_reassert_american_dominance_desc: "自拉美國家獨立潮的一個世紀以來，前殖民地彼此間紛亂的鬥爭似乎永無止境。文化統一帶來的團結一致已被遺忘，應當讓他們重新憶起我們才是祖宗家主的事實。"
 SPA_reassert_american_dominance_tt: "解鎖§Y重申美洲統治地位§!決議，使和平附庸弱小美洲國家成為可能。\n"
 SPA_retake_the_americas: "重奪美洲"
 SPA_retake_the_americas_desc: "拉美大國並無自願接受我國領導的意願，而重奪故土則與[USA.GetNameDef]必有一戰。縱使前路多艱，只要堅持不懈，實現帝國雄心不過觸手可及。"
 SPA_embrace_the_spanish_destiny: "接受西班牙的天命"
 SPA_embrace_the_spanish_destiny_desc: "西班牙的天命唯有一個：給國民以自由強大之國家，克時艱並重新屹立於世界，捍衛基督教在生活中的意義。"
 SPA_the_national_and_popular_army_of_spain: "西班牙國家人民軍"
 SPA_the_national_and_popular_army_of_spain_desc: "西班牙國家新的武裝力量將在國家與人民的旗幟下被組織起來，所有健全的男性公民皆有機會光榮服役。"
 SPA_mandatory_pre_military_training: "強制預備役訓練"
 SPA_mandatory_pre_military_training_desc: "作為服役的準備，所有男性都將接受義務性預備役訓練。"
 SPA_all_shall_serve: "全民服役"
 SPA_all_shall_serve_desc: "新西班牙是全體西班牙人意志的表現，而每一個成員都應當盡其所能捍衛它。徵兵標準也必須隨之放寬。"
 SPA_the_army_of_africa_model: "“非洲軍團”模範"
 SPA_the_army_of_africa_model_desc: "在內戰過程中，非洲軍團的成功並未被忽視。我們的新軍隊必須符合他們的標準，以此來學習他們的模範。"
 SPA_equipment_modernization: "裝備現代化"
 SPA_equipment_modernization_desc: "只有最好的武器才能為我們部隊提供足夠的幫助，相應的，我們必須開發新型武器。"
 SPA_artillery_modernization: "火炮現代化"
 SPA_artillery_modernization_desc: "火炮是現代戰爭中的關鍵部分，因此我們應該用更加強大的新型武器來替換過時的裝備，以此快速實現現代化。"
 SPA_expand_the_air_branch: "擴編空軍部門"
 SPA_expand_the_air_branch_desc: "內戰向我們展示了空中力量的重要作用。如果我軍要成為一支有威懾力的軍隊，這個領域則有必要被拓展。"
 SPA_expand_the_special_forces: "擴編特種部隊"
 SPA_expand_the_special_forces_desc: "寥寥數名特戰專家可以取得大量常規步兵難以企及的戰果。我們將開展針對特定任務的專業訓練，以保證時機來臨時手頭有人可用。"
 SPA_motorization: "摩托化"
 SPA_motorization_desc: "軍隊的大規模摩托化將發掘戰術和戰略的新機遇。這是一項不容忽視的優勢。"
 SPA_an_armored_corps: "裝甲兵團"
 SPA_an_armored_corps_desc: "如果不想被鄰國超越，西班牙就需要一支裝甲部隊。"
 SPA_join_the_axis: "加入軸心國"
 SPA_join_the_axis_desc: "西班牙的未來在於顛覆現有的世界秩序。我們必須同志同道合的國家攜手並進。"
 SPA_fascist_economic_aid: "法西斯經濟援助"
 SPA_fascist_economic_aid_desc: "內戰之後，我國瘡痍滿目，但也許我們的新盟友願意援助我國的重建項目。"
 SPA_facilitate_pyrenees_freight_transports: "改善比利牛斯貨運"
 SPA_facilitate_pyrenees_freight_transports_desc: "必須改善來自北部的新資源供應以確保需求，因此我國將拓展跨越比利牛斯的鐵路運輸。"
 SPA_facilitate_pyrenees_freight_transports_tt: "在§Y馬德里§!，§Y瓜達拉哈拉§!，§Y東阿拉貢§!，§Y加泰羅尼亞§!，§Y布爾戈斯§!和§Y佩斯瓦斯科§!的§Y基礎設施§!增加到上限。"
 SPA_improve_cross_country_railways: "改善全國鐵路"
 SPA_improve_cross_country_railways_desc: "擴展我國的鐵路網絡不僅能提供緊缺的工作崗位，還能加快軍隊，物資與補給的運輸，而且還能夠提升西班牙人的民族自豪感。"
 SPA_support_the_war_industry: "支持戰爭工業"
 SPA_support_the_war_industry_desc: "在擴張戰爭工業之前，必須先考慮擴展與其相互依賴的其它輔助性工業。"
 SPA_italian_shipbuilding_expertise: "意大利造船專家"
 SPA_italian_shipbuilding_expertise_desc: "邀請意大利專家將可以提升我們的造船能力，尤其是在建造大型戰艦方面，這將有助於更加容易地擴大我們的海軍規模。"
 SPA_the_duty_to_work: "為國工作的義務"
 SPA_the_duty_to_work_desc: "所有的西班牙人都有義務服務國家。如果這份義務不要求他們在前線作戰，那麼他們就應當在後方全力做好支援與生產。"
 SPA_expand_the_war_industry: "發展戰爭工業"
 SPA_expand_the_war_industry_desc: "強大的國家亟需龐大的戰爭工業相佐以彰顯其自身的實力，而我們或可進一步擴大其規模。"
 SPA_national_recovery: "國家復甦"
 SPA_national_recovery_desc: "是時候讓全國上下齊心協力來幫助國家從內戰中復甦了。"
 SPA_autarky: "自給自足"
 SPA_autarky_desc: "為了防止獨立性受到其他國家威脅，我們就必須在經濟上實現自給自足。"
 SPA_spanish_austerity: "西班牙財政緊縮"
 SPA_spanish_austerity_desc: "儘管這不是我們所希望的，但為了釋放資金以使國家復興，我們不得不採取財政緊收政策。"
 SPA_reduce_reliance_on_foreign_resources: "減少對外資源依賴"
 SPA_reduce_reliance_on_foreign_resources_desc: "依賴外國資源是我國唯一能被潛在敵人利用的弱點。我們應當在力所能及的範圍內實現自給自足。"
 SPA_reduce_reliance_on_foreign_resources_tt: "解鎖獨特的§Y資源前景§!決議，從而擴大現有資源的開發利用並開發新大陸的資源與礦床。\n"
 SPA_expand_the_axis_gold_trade: "擴大對軸心國黃金貿易"
 SPA_expand_the_axis_gold_trade_desc: "軸心國困於同盟國的封鎖，正急需對外貿易獲取物資。他們的黃金流入了我國，以此從我國以及其他中立國家處獲取所需的資源。我們已經從中大賺一筆，或許還能得寸進尺一下……"
 SPA_ensure_agricultural_self_sufficiency: "確保農業自給自足"
 SPA_ensure_agricultural_self_sufficiency_desc: "我們必須擺脫對進口糧食的依賴——必須擴大我國的農業以使它有能力養活我們整個國家。"
 SPA_unify_the_nationalist_front: "團結國民陣線"
 SPA_unify_the_nationalist_front_desc: "自詡為“國民軍”的叛黨只是一盤散沙，只因推翻共和國的共同目標才得以攜手。通往成功之路在於避免內鬥，並專注於與我們共同的敵人作鬥爭。"
 SPA_save_the_alcazar: "解救阿卡薩！"
 SPA_save_the_alcazar_desc: "托萊多的阿卡薩仍被忠於我們事業的軍隊控制，但他們遭到了重重包圍！解救他們雖然在戰略上並不重要，但在宣傳上可謂是巨大勝利，並將鞏固弗朗西斯科·佛朗哥作為軍政府事實上領袖的地位。"
 SPA_martyrdom_for_primo_de_rivera: "普里莫·德·里維拉殉難"
 SPA_martyrdom_for_primo_de_rivera_desc: "西班牙長槍黨的創始人，何塞·安東尼奧·普里莫·德·里維拉在內戰爆發前就被囚禁了。雖然我們得到了交換囚犯的機會，但比起多一個潛在政敵，一個慘遭處決的烈士會更好地為我們事業效勞……因此，我們得確保交換囚犯的談判“失敗”。"
 SPA_caudillo_of_spain: "西班牙的考迪羅"
 SPA_caudillo_of_spain_desc: "弗朗西斯科·佛朗哥的成就已經有目共睹，而他的潛在競爭對手也遭遇各種不測而死於非命。軍政府中越來越多的人支持他成為我們的正式領導人，只剩下發表一紙官方聲明。"
 SPA_extol_the_martyrs_of_the_war: "讚頌戰爭殉難者"
 SPA_extol_the_martyrs_of_the_war_desc: "那些為我們事業獻出生命的人應該被永遠銘記，他們的犧牲應該被致以崇高敬意，他們的所作所為應該成為我們的榜樣。"
 SPA_consolidate_the_north: "鞏固北方"
 SPA_consolidate_the_north_desc: "邁向勝利的第一步應該是征服和鞏固北方領土。一旦完成這一步，我們就可以轉向共和陣線控制的其他薄弱地區。"
 SPA_foment_a_carlist_split: "煽動卡洛斯派分裂"
 SPA_foment_a_carlist_split_desc: "卡洛斯派內部像國民陣線一樣四分五裂。通過在各個卡洛斯派領導人中挑撥離間，我們可以削弱他們的力量，為拉攏個別卡洛斯的派系開闢道路。"
 SPA_a_methodical_approach: "有條不紊的策劃"
 SPA_a_methodical_approach_desc: "打贏內戰的關鍵不在於愚勇的行動和魯莽的進攻，而在於周密而條理清晰的計劃以及精準且深思熟慮的打擊。"
 SPA_tackle_the_vulnerable_fronts: "乘虛而入"
 SPA_tackle_the_vulnerable_fronts_desc: "敵方前線在部分區域暴露了一些薄弱點。這些位置應該作為我們的進攻重點，以最大限度地發揮進攻的效果。"
 SPA_tackle_the_vulnerable_fronts_tt: "升級§Y內戰中的攻勢§!決議，在對抗敵軍的攻勢開始時獲得一個臨時性戰鬥加成。\n"
 SPA_integrate_the_requetes: "收編呼嘯兵"
 SPA_integrate_the_requetes_desc: "那些同我們想法更加契合的卡洛斯派呼嘯兵應當更緊密地融入我們的軍隊。他們的經驗和訓練在未來的戰鬥中將是無價之寶。"
 SPA_portuguese_aid: "葡萄牙援助"
 SPA_portuguese_aid_desc: "我們急需援助，無論是哪來的。葡萄牙庇護了我們很多在1932年叛亂失敗後被迫逃亡的領導人。如果我們提出要求，葡萄牙可能願意向我們提供物質援助，甚至為今後更加密切的合作打下基礎。"
 SPA_the_iberian_pact: "伊比利亞條約"
 SPA_the_iberian_pact_desc: "我們兩國的互信有賴於良好的關係。我們應該提議，西班牙和葡萄牙在所參加的任何全球戰爭中或所加入的任何陣營中，都始終站在同一方。伊比利亞團結起來方能強大！"
 SPA_the_iberian_pact_tt: "這項協議規定，任何一方都有義務在另一方加入的任何戰爭中加入相同陣營或同一方。\n"
 SPA_the_iberian_pact_tt_2: "§R[POR.GetNameDefCap]必須批准該協議才能使獎益生效。§!\n"
 SPA_the_latin_bloc: "拉丁集團"
 SPA_the_latin_bloc_desc: "世界上正在形成強大的集團。比起被捲入它們彼此間日益加劇的緊張局勢中，我們更應該同周圍文化與意識形態相似的國家建立新的地區夥伴關係：地中海拉丁國家聯盟。"
 SPA_utilize_the_intellectuals: "利用知識分子"
 SPA_utilize_the_intellectuals_desc: "那些出類拔萃的人應該得到他們所需要的資源，讓他們以軍隊所難以企及的方式，更好地為國家效力。"
 SPA_banish_the_party_leaders: "驅逐黨派領導人"
 SPA_banish_the_party_leaders_desc: "長槍黨和卡洛斯派的領導層各自為政，日益成為我們的眼中釘肉中刺。利用他們的不合來逐漸動搖其地位，我們就能名正言順驅逐這些冥頑不化的傢伙，並換上忠於佛朗哥的人選。"
 SPA_fuse_the_parties: "統合政黨"
 SPA_fuse_the_parties_desc: "我們已經打好了必要的基礎，是時候將長槍黨和卡洛斯派合併成一個由弗朗西斯科·佛朗哥領導的政黨了。"
 SPA_fuse_the_parties_tt: "§G移除§!§Y迫近的卡洛斯派起義§!§G任務§!\n"
 SPA_join_the_allies: "加入同盟國"
 SPA_join_the_allies_desc: "勝利天平的傾斜已日漸明顯。我國將加入同盟國，接受可能的經濟援助，確保當其最後贏得戰爭時，我國站在了正確的一方。"
 SPA_the_stabilization_plan: "穩定計劃"
 SPA_the_stabilization_plan_desc: "我國必須同缺乏理智的長槍黨劃清界線，他們在幻想中自給自足，但現實中卻缺乏可持續性的經濟政策。要想與世界其他國家在經濟領域能夠有來有回，我國必須走向經濟自由化，同時期待這之後的經濟繁榮能讓每一個西班牙人受益。"
 SPA_expand_spanish_bases: "擴建西班牙基地"
 SPA_expand_spanish_bases_desc: "盟友中的帝國主義分子希望利用我國軍事基地向全世界輸出影響力。為滿足其需求，我國將擴建大陸上的空軍與海軍基地。"
 SPA_capitalist_economic_aid: "資本主義經濟援助"
 SPA_capitalist_economic_aid_desc: "西方經濟援助對於久經磨難的我國的重建有著不可估量的價值。"
 SPA_improve_living_standards: "改善生活水平"
 SPA_improve_living_standards_desc: "每一個人，無論地位，都有從我國經濟復興中分一杯羹的權利。"
 SPA_domestic_industrial_developments: "國內工業發展"
 SPA_domestic_industrial_developments_desc: "我們可以為西班牙工人引進西方創新技術手段來達成雙贏，並加速國家復甦。"
 SPA_the_spanish_miracle: "西班牙經濟奇蹟"
 SPA_the_spanish_miracle_desc: "穩定計劃的效果大大超出了我們的想像，我們一手創造的經濟繁榮可謂奇蹟！"
 SPA_adopt_the_26_points: "接受二十六點宣言"
 SPA_adopt_the_26_points_desc: "將長槍黨“27條宣言”中反對政黨合併的條款去除後，留下的“26條”可以作為一份不錯的黨章，並能在政府政策方面提供有價值的靈感予我們借鑑。"
 SPA_direct_the_universities: "指導大學"
 SPA_direct_the_universities_desc: "最近在學術界大放異彩的人才毫無疑問可以被用於軍事目的的定向研究，我們將指示大學開展相應的研究。"
 SPA_dictator_for_life: "終身獨裁者"
 SPA_dictator_for_life_desc: "佛朗哥將國家治理得很好。我們並沒有改變現狀的必要，更不可能倒退回腐朽君主制的老路。"
 SPA_invest_in_naval_infrastructure: "投資海軍基建"
 SPA_invest_in_naval_infrastructure_desc: "為了支持艦隊規模的擴大，西班牙需要新的海軍設施。"
 SPA_expand_the_slipways: "擴建船臺"
 SPA_expand_the_slipways_desc: "在過去，我國大型戰艦往往自他國採購。我國應當增加船臺尺寸以便於自主建設大型戰艦。"
 SPA_the_plan_imperial: "“帝國計劃”"
 SPA_the_plan_imperial_desc: "我國將啟動一項宏大的計劃，重振西班牙海軍地位，使其規模迴歸世界頂級。"
 SPA_restart_small_scale_shipbuilding: "重啟小型船建造項目"
 SPA_restart_small_scale_shipbuilding_desc: "我國海軍需要可觀數量的護航艦艇，艦艇尺寸小至連國內小型船塢都能建造。我國應當鼓勵這些船塢發展艦艇新型號。"
 SPA_la_division_azul: "藍色師"
 SPA_la_division_azul_desc: "我國已將伊比利亞半島的共產主義威脅斬草除根，但邪惡的根源仍盤踞在東方。當其他國家進行正面抗擊時，我國應當派遣一個志願師為對抗共產威脅作出自己的貢獻。"
 SPA_the_tangiers_enclave: "丹吉爾飛地"
 SPA_the_tangiers_enclave_desc: "丹吉爾市於1923年被劃歸國際共管，管理三方分別為法國，西班牙與英國。如今另外兩方已深陷戰爭泥沼不能自拔，我國應當挺身而出，肩負起單獨保護該城市的責任。"
 SPA_the_tangiers_enclave_tt: "§R這有可能激怒國際託管的另外兩方§!\n"
 SPA_demand_french_north_africa: "索取法屬北非"
 SPA_demand_french_north_africa_desc: "隨著母國的淪陷，[FRA.GetAdjective]殖民地也岌岌可危。我國將慷慨地提供保護，並且默認不存在拒絕這個選項。"
 SPA_restore_the_monarchy: "復辟君主制"
 SPA_restore_the_monarchy_desc: "臨時政府已經完成了消滅共產主義分子與終結第二共和國統治的歷史使命。現在，則是君主制在西班牙復辟之時！"
 SPA_restore_the_monarchy_tt: "§Y[ROOT.GetName]§!將改名為§Y西班牙王國§!\n"
 SPA_stamp_out_the_maquis: "剷除馬基游擊隊"
 SPA_stamp_out_the_maquis_desc: "馬基游擊隊是我們的殘餘敵人。他們通過不斷地打游擊戰，企圖奪取我們對西班牙本土的控制。隨著時間的推移，其影響力日益衰弱，現在是時候徹底剷除掉他們了。"
 SPA_defenses_against_strategic_bombing: "防禦戰略轟炸"
 SPA_defenses_against_strategic_bombing_desc: "要想介入全球衝突，我們必須確保我們的城市得到充分保護，免受那些必然將至的大規模戰略轟炸，而我們潛在的敵人無疑想借此置我們於死地。"
 SPA_defenses_against_invasion: "防禦入侵"
 SPA_defenses_against_invasion_desc: "西班牙的海岸線綿延遼闊，我們必須盡己所能讓敵人無法踏足我們的海灘。堅固的防禦工事將讓入侵的敵人望而生畏。"
 SPA_defenses_against_invasion_tt: "在有§Y海軍基地§!的大陸核心省份生成§Y1級陸上要塞§!與§Y2級海岸要塞§!。\n"
 SPA_retake_gibraltar: "奪回直布羅陀"
 SPA_retake_gibraltar_desc: "直布羅陀從西班牙的懷抱中被割裂出去已經兩個多世紀了。英國佬給伊比利亞造成的創傷不能繼續存在。"
 SPA_claim_west_africa: "聲索西非"
 SPA_claim_west_africa_desc: "法國不配統治西非。該地區與我們赤道幾內亞的殖民地有著天然的地理聯繫，因此，無論出於何種意圖和目的，都應將其視為西班牙殖民帝國統一而不可分割的一部分。"
 SPA_supremacy_of_the_communion: "傳統主義團契的霸權"
 SPA_supremacy_of_the_communion_desc: "正如上帝創造了天地一樣，傳統主義團契也是未來西班牙統一的關鍵。19世紀的卡洛斯派起義可能遭到挫折，但他們的精神從未消亡。那些忠於信仰的人隨時準備再次站起來反抗共和國。"
 SPA_prepare_the_carlist_insurrection: "準備卡洛斯派的暴動"
 SPA_prepare_the_carlist_insurrection_desc: "我們與長槍黨結盟是不得已的選擇，盟約的預期壽命估計也就幾個星期而已。我們必須在假情假意的盟友動手之前先手攻擊，把他們的錯誤思想有機會蠱惑普通民眾頭腦前連根除掉。"
 SPA_prepare_the_carlist_insurrection_tt: "解鎖§Y準備卡洛斯派的暴動§!決議，允許將暴動中取得的領土變為卡洛斯派所有。\n\n同時，如果已獲得控制權，§Y布爾戈斯§!與§Y納瓦拉§!也將歸於卡洛斯派。"
 SPA_contact_the_union_militar_espanola: "聯絡西班牙軍事同盟"
 SPA_contact_the_union_militar_espanola_desc: "西班牙軍事同盟是一個由密謀反對共和國的軍官組成的龐大秘密社團，其中有很多人可能同情我們的事業。我們應該與他們取得聯繫，並儘可能多地獲得其領導人的支持，為時機的到來做準備。"
 SPA_head_the_junta_nacional: "領導國民軍政府"
 SPA_head_the_junta_nacional_desc: "卡洛斯派戰爭機器的戰時最高領導層，即卡洛斯派戰爭國民軍政府需要一位領袖來統率各個地區的卡洛斯派軍政府。曼努埃爾·法爾·孔戴有能力來擔當我們的領袖。"
 SPA_unite_the_requetes: "統一呼嘯兵"
 SPA_unite_the_requetes_desc: "長期以來，卡洛斯派地區軍政府互相間獨立運作。我們必須把他們和呼嘯兵諸部統一起來，以便更好地組織卡洛斯派戰爭工作並消除內部異議。"
 SPA_the_war_in_the_north: "北方戰爭"
 SPA_the_war_in_the_north_desc: "北方一直是卡洛斯派活動的核心區域。任何的起義都必須確保將這些區域作為行動的立足根基。"
 SPA_revive_the_spirit_of_the_carlist_wars: "重振卡洛斯派戰爭精神"
 SPA_revive_the_spirit_of_the_carlist_wars_desc: "19世紀的卡洛斯派戰爭對我們的事業來說可能是令人遺憾的失利，但抵抗精神薪火相傳直到今天。我們將頑強拼搏，永無止息，直到合法的繼承人登上西班牙的王位，並捍衛所有西班牙人的基督教信仰。"
 SPA_arms_modernization: "武器現代化"
 SPA_arms_modernization_desc: "我們軍隊可能是最敬業、最忠誠、最虔誠、最狂熱、以及最訓練有素的，但他們仍然需要充足的武器來捍衛基督教。我們得確保他們得其所需。"
 SPA_no_compromise_on_carlist_ideals: "卡洛斯理想決不妥協！"
 SPA_no_compromise_on_carlist_ideals_desc: "雖然我們最初起義時曾與長槍黨合作，但現在我們很清楚，對理想的妥協等同於叛國。如果長槍黨不接受我們的要求，那麼我們別無選擇，只能把他們也一起消滅掉。"
 SPA_no_compromise_on_carlist_ideals_tt_2: "§Y[ROOT.GetName]§!將改名為§Y卡洛斯西班牙§!\n"
 SPA_no_compromise_on_carlist_ideals_tt: "§R法西斯支持者將發動內戰！§!\n"
 SPA_the_crusade_against_democracy: "反民主聖戰"
 SPA_the_crusade_against_democracy_desc: "只有卡洛斯的合法繼承人才被上帝賦予了神聖的統治權力。民主不僅是對國王的侮辱，也是對上帝的褻瀆。決不能讓這個毒瘤繼續存在於世界上。"
 SPA_the_crusade_against_democracy_timer_tt: "距離上次§Y反民主聖戰§!生效至少70日後。\n"
 SPA_expand_the_requetes: "擴編呼嘯兵"
 SPA_expand_the_requetes_desc: "目前為止，我們一直依賴於一支相對小巧精悍的突擊隊，但我們的野心不能止於此。我們必須擴編呼嘯軍併為所有響應號召的人提供所需的訓練。"
 SPA_militarize_the_masses: "武裝群眾"
 SPA_militarize_the_masses_desc: "我們的價值觀不能單憑呼嘯軍來捍衛。任何對王室忠誠、受上帝之愛眷顧的人都應履行軍事義務以捍衛自己的信念。"
 SPA_defenders_of_catholicism: "天主教捍衛者"
 SPA_defenders_of_catholicism_desc: "就像四百年前一樣，西班牙必須再次成為天主教信仰的捍衛者。通過擴軍，普通士兵必須是他信仰的劍和盾，並且無論國王派遣他到何處戰鬥，都要銘記這一神聖的職責。"
 SPA_battle_rites: "戰爭儀禮"
 SPA_battle_rites_desc: "為祖國而戰是一項神聖的義務。我們的隨軍牧師將與士兵共赴戰場，並替為君主與信仰捐軀的戰士舉行臨終儀式，保證他們身後能升入天國。"
 SPA_cultivate_fanaticism: "培育狂熱主義"
 SPA_cultivate_fanaticism_desc: "卡洛斯戰士最可敬的精神是面對艱難險阻時矢志不渝，這一精神來源於堅信自己犧牲後上帝會給予獎賞的信念。這股虔誠與犧牲精神應該被樹立成標榜，供新兵們學習。"
 SPA_the_third_dimension_of_warfare: "戰爭之第三維度"
 SPA_the_third_dimension_of_warfare_desc: "卡洛斯派的不屈意志已經主宰大地，現在，該征服天空了。"
 SPA_a_modern_fighter_fleet: "現代戰鬥機編隊"
 SPA_a_modern_fighter_fleet_desc: "我們的飛行員必須配上我國能弄到的最出色的飛行器。我們所急缺的部分必須以技巧、勇氣和裝備來彌補。"
 SPA_confirm_the_fueros: "確認法典"
 SPA_confirm_the_fueros_desc: "國家的治理歸君主管轄，但傳統特權保障了組成王國的各地區自治權。這些所謂“法典”（fueros），必須被再度確認以維繫各地區的忠誠。"
 SPA_encourage_local_industrialization: "鼓勵本土工業化"
 SPA_encourage_local_industrialization_desc: "地方政府鼓勵工業化的積極行動無疑能增強國家整體實力。"
 SPA_encourage_local_mining: "鼓勵本地礦業"
 SPA_encourage_local_mining_desc: "我們的工業目前僅滿足於完全依賴進口資源，應當在國內鼓勵發展更加廣泛的採礦業，利用好伊比利亞半島上的財富而減少對外國供應方的依賴。"
 SPA_settle_the_succession_question: "解決繼承權問題"
 SPA_settle_the_succession_question_desc: "卡洛斯派正因各個派系支持不同王位繼承者而陷入分裂。卡洛斯後人，阿方索·卡洛斯於1936年末壽終正寢，但死前指定波旁-帕爾馬家族的哈維爾繼位。但有人則轉而支持流亡老國王阿方索十三世對王位的宣稱。"
 SPA_dios_patria_rey: "上帝、祖國與國王！"
 SPA_dios_patria_rey_desc: "卡洛斯派的呼聲在歷史長河中迴盪，宣示著我們信仰的真實。它向我們昭示：我們每個人在捍衛天主教事業中、在地方團體中，在整個西班牙中以及在至高君權面前都只是渺小的角色。上帝，祖國與國王！"
 SPA_restore_the_empire: "重建帝國"
 SPA_restore_the_empire_desc: "帝國夢已觸手可及！我們僅需建立軍事工業來握住它。"
 SPA_strengthen_the_empire: "鞏固帝國"
 SPA_strengthen_the_empire_desc: "新生的西班牙帝國尚需進一步夯實經濟基礎，應當增加資金投入來加快我國工業在經歷內戰破壞後的重振。"
 SPA_prosperity_of_the_empire: "帝國的繁榮"
 SPA_prosperity_of_the_empire_desc: "帝國的復興與繁榮至高無上，通過進一步關注改善我們國家的基礎設施，從而鼓勵貿易和工業發展，我們將確保在短期內實現這一目標。"
 SPA_press_the_gibraltar_claim: "加強對直布羅陀的宣稱"
 SPA_press_the_gibraltar_claim_desc: "直布羅陀飛地的存在就是對我們國王的侮辱，必須雪恥。"
 SPA_claim_the_french_throne: "聲索法國王位"
 SPA_claim_the_french_throne_desc: "西班牙與法蘭西的王位曾有過超過半個世紀的皇室聯繫。我們的前國王也不例外，而且恰巧也是法蘭西王位的正統宣稱人。這種狀態更應該好好利用。"
 SPA_retake_the_spanish_netherlands: "奪回西屬尼德蘭"
 SPA_retake_the_spanish_netherlands_desc: "我們的帝國一度將邊界擴張至德意志，這沒有理由不能再次做到。以及，我們還能順手洗刷八十年戰爭的恥辱。"
 SPA_restore_the_iberian_union: "重建伊比利亞聯盟"
 SPA_restore_the_iberian_union_desc: "距離西班牙與葡萄牙短暫地將國運交織在一起已經過去了四個世紀。伊比利亞唯有團結方能強盛，所以我們將確保一個新的對葡萄牙王位的宣稱能被“挖掘”出來……"
 SPA_the_war_of_vengeance: "復仇之戰"
 SPA_the_war_of_vengeance_desc: "1898年美西戰爭仍然殘存於人們的記憶中，而它給西班牙民族留下的精神創傷則由“九八年一代”的作品作出了最好的詮釋。痛失殖民地的國恥必須被雪洗，美利堅必將匍匐在西班牙面前。"
 SPA_found_the_academia_vazquez_de_mella: "建立巴斯克斯·德·梅拉學院"
 SPA_found_the_academia_vazquez_de_mella_desc: "我國需要建立一個大型傳統主義思想中心，它也能供卡洛斯思想者為新興的西班牙王國服務效勞。"
 SPA_a_fleet_worthy_of_a_king: "王之艦隊"
 SPA_a_fleet_worthy_of_a_king_desc: "為了將君主的意志宣示於大洋彼端，我國海軍必須大規模擴軍。因此，海軍基礎設施亟需新建。"
 SPA_rebuild_the_battlefleet: "重建無敵艦隊"
 SPA_rebuild_the_battlefleet_desc: "美西戰爭八十餘年來，我國海軍萎靡不振、羸弱不堪。威力足以匹敵任何對手的新入列主力戰艦將讓海軍上下如獲新生，令我國有能力與鄰國逐鹿藍海。"
 SPA_imperial_security: "確保帝國安全"
 SPA_imperial_security_desc: "帝國的安危不在於主力艦艇，而繫於規模可觀的巡洋艦群。為保障我國與海外領地間的補給供應，發展新型艦船與貿易保護學說刻不容緩。"
 SPR_regional_defense_council_of_aragon: "阿拉貢地區防禦委員會"
 SPR_regional_defense_council_of_aragon_desc: "為了戰爭目的，且僅在迫不得己的情況下，內戰中茁壯成長的安那其自治社區必須被統一在單一的防禦委員會之下以協力大局。首個委員會將在阿拉貢地區籌建。"
 SPR_appropriate_the_means_of_production: "奪取生產資料"
 SPR_appropriate_the_means_of_production_desc: "只為金錢工作的舊日已隨風而逝，勞動得不到回報的往昔已大江東去。我們將奪取工廠與作坊，農莊與商店，消滅階級並讓工人自己主宰自己的命運。"
 SPR_autogestion: "工人自治"
 SPR_autogestion_desc: "依照工人自治的原則，我們允許工人在工作場所自我管理以將產出最大化。這將極大有利於提升工人自主性，鼓舞士氣，以及作為其結果，整體生產力得到了提高。"
 SPR_collectivization_and_workers_control: "集體化與工人掌權"
 SPR_collectivization_and_workers_control_desc: "在地方政府職能的必要部分上，我們將關注工人委員會，讓每一個工人有機會發聲的同時也讓建立大規模合作成為可能。"
 SPR_arm_the_people: "武裝人民"
 SPR_arm_the_people_desc: "國家化的軍隊很容易淪為政府控制人民的手段，而社區自衛亦不依賴於此。應將武器給予人民，讓人民用武器自己保衛自己的社區。"
 SPR_the_maximum_concession: "最大限度妥協"
 SPR_the_maximum_concession_desc: "為同法西斯作鬥爭，我們已作出最大限度妥協：與資本家和專制的共產分子開展合作。這是我們願意作出的最大限度讓步，而它並非天長地久。我們將在時機尚可時最大限度利用這個窗口。"
 SPR_seize_public_transport: "奪取公共交通"
 SPR_seize_public_transport_desc: "每個人都想為自由的鬥爭貢獻一份力。我們在公共交通行業的盟友眾多，他們渴望用其載具幫助我們勇敢的戰士們。這將在對抗敵人時給予我們非傳統的戰術優勢。"
 SPR_seize_public_transport_tt: "§R內戰結束後，這個民族精神將被移除！§!\n"
 SPR_agrarian_collectivization: "農業集體化"
 SPR_agrarian_collectivization_desc: "農業集體化組織將保證公社成員對食物進行按需分配以滿足公利，而出售作物追求私利。"
 SPR_mujeres_libres: "自由婦女"
 SPR_mujeres_libres_desc: "社會革命尚未徹底成功，下一步是工人階級婦女的解放，賦權與教育。平等將造福於社區整體。"
 SPR_literacy_programs: "掃盲工程"
 SPR_literacy_programs_desc: "文盲在工人階級中普遍存在，但只要稍加恰當的教育，狀況將很快改善，被埋沒的人材也無疑會脫穎而出。"
 SPR_shared_burdens: "同甘共苦"
 SPR_shared_burdens_desc: "從專制主義、資本主義和宗教迷信中爭取自由的鬥爭任重道遠。在大獲全勝之前，我們都必須盡己所能來承擔將降之大任。"
 SPR_international_brigades: "國際縱隊"
 SPR_international_brigades_desc: "我們的事業引起了國際上的關注，來自五湖四海的人都與我們一同對抗法西斯的威脅。只要是能助組織一臂之力的人，我們來者不拒。他們將被募入國際縱隊。"
 SPR_international_brigades_tt: "§Y佐爾卡·馬泰§!將成為可用的2級§Y陸軍元帥§!"
 SPR_seize_the_gold_reserves: "奪取黃金儲備"
 SPR_seize_the_gold_reserves_desc: "共和國的黃金儲備正面臨落入法西斯之手的危險，而斯大林的魔爪危害更甚。奪取儲備無疑要冒著觸怒政府的風險，但卻能讓我們有資金從黑市購買外國武器來推進戰爭。"
 SPR_gold_reserves_flag: "黃金儲備已被奪取或轉移。"
 SPR_foreign_arms_purchases: "購買外國武器"
 SPR_foreign_arms_purchases_desc: "我們“解放”的黃金儲備能被用作獲取急需的外國武器。國際輿論並不見得會站在我們那邊，所以接受這批武器很可能要通過非正規渠道，然而……"
 SPR_foreign_arms_purchases_tt: "解鎖§Y外國武器購買§!決議，允許購買多種類型的裝備。\n"
 SPR_masters_of_our_own_fate: "自身命運的主宰"
 SPR_masters_of_our_own_fate_desc: "斯大林分子及其共和派走狗變本加厲侵害我們的自由，系統性地破壞我們的事業並清除我們的公開支持者。忍無可忍，無需再忍。我們是自身命運的主宰，即使這意味著我們也需要同他們鬥爭！"
 SPR_anarchist_uprising_flag: "安那其已經發起暴動。"
 SPR_masters_of_our_own_fate_tt_2: "§Y[ROOT.GetName]§!將改名為§Y阿拉貢地區防禦委員會§!\n"
 SPR_masters_of_our_own_fate_tt_3: "§Y[ROOT.GetName]§!將改名為§Y西班牙公社§!\n"
 SPR_masters_of_our_own_fate_tt_4: "馬統工黨部長將§G可用§!，而民主派部長和斯大林主義部長將§R被移除§!。\n"
 SPR_masters_of_our_own_fate_tt: "§R共產主義與民主主義支持者將挑起內戰！§!\n"
 SPR_all_must_bear_the_torch: "萬眾擎炬火"
 SPR_all_must_bear_the_torch_desc: "每一個人本身就是一場對自我的革命：若個人無匹夫之勇，集體就會在敵人面前倒下。我們當中的每個人都必須銘記這句箴言，我們當中的每個人都必須戮力同心擎起安那其主義的火炬。"
 SPR_the_threats_abound: "身敵海波瀾"
 SPR_the_threats_abound_desc: "顯而易見，世界不能容許我們超凡的存在。我們左右碰壁，甚至四面楚歌。現在已經看的很清楚了：我們沒有可以依靠的盟友，必須準備與所有腐朽落後的國家制度開戰。"
 SPR_portuguese_anarchism: "葡萄牙安那其主義"
 SPR_portuguese_anarchism_desc: "我們為自由鬥爭的革命之火已蔓延至葡萄牙境內，葡萄牙政府正陷入動盪。只要提供適當支持，在葡萄牙境內全面爆發安那其主義暴動並非天方夜譚。星星之火，可以燎原！"
 SPR_regional_defense_council_of_iberia: "伊比利亞地區防禦委員會"
 SPR_regional_defense_council_of_iberia_desc: "隨著葡萄牙地區的解放，我們將建立新的防禦委員會以代表伊比利亞半島當下所有公社的意志。"
 SPR_regional_defense_council_of_iberia_tt: "§Y[ROOT.GetName]§!將改名為§Y伊比利亞地區防禦委員會§!\n"
 SPR_a_new_way_of_warfare: "新式戰法"
 SPR_a_new_way_of_warfare_desc: "我們步兵作戰勇敢是毋庸置疑的，但現實的戰爭已經遠遠超出了步兵所能超越的範圍。，我們必須開始開發新的戰爭機器，無論是在地上還是空中，為了保衛我們的公社。"
 SPR_communal_military_strategies: "公社軍略"
 SPR_communal_military_strategies_desc: "組織大規模作戰的同時仍遵循安那其主義的基本原則是一項巨大挑戰，但也是我們必須挺身面對的挑戰。一旦背離基本原則，我們的過往鬥爭的一切都將付諸東流。"
 SPR_maintaining_the_fire: "存續火種"
 SPR_maintaining_the_fire_desc: "厭戰情緒是土崩瓦解的前兆。我們必須保持堅強，重燃人們心中足以驅動他們竭盡全力的火焰。"
 SPR_freedom_of_thought: "思想自由"
 SPR_freedom_of_thought_desc: "我們的社區中沒有閉塞思維的一席之地。只要認同我們社會的基礎，無論抱持何種觀念的人都將受到歡迎。"
 SPR_torchbearers_of_tomorrow: "明日火炬手"
 SPR_torchbearers_of_tomorrow_desc: "無論是在智識還是軍力上為我們的大業獻力的人都是未來的棟梁。這種認知可作為一種有力的激勵，因此我們要令人們知其重任在肩。"
 SPR_the_inevitable_counterblow: "無法避免的反撲"
 SPR_the_inevitable_counterblow_desc: "國際社會對我們的公社生活方式呈現出日益增長的敵意。山雨欲來風滿樓，恰應未雨綢繆。"
 SPR_improve_military_infrastructure: "改善軍事基礎設施"
 SPR_improve_military_infrastructure_desc: "為及時替被圍攻的公社解圍，我們必須大幅改善公社間的基礎設施。這將使防禦委員會能作為一個整體去快速應對任何僅憑單一公社無法抵禦的外部威脅。"
 SPR_fortify_the_pyrenees: "鞏衛比利牛斯山"
 SPR_fortify_the_pyrenees_desc: "針對我們最明顯的進攻路線來自北側。比利牛斯防線亟須鞏固，以應對穿越比利牛斯山或針對此處海岸線的攻勢。"
 SPR_fortify_the_pyrenees_tt: "在下列靠近法國邊境省份生成3級§Y要塞§!，包括：§Y巴斯克§!，§Y納瓦拉§!，§Y西阿拉貢§!，§Y東阿拉貢§!與§Y加泰羅尼亞§!。\n"
 SPR_fortify_la_linea_de_la_concepcion: "鞏衛拉利內阿-德拉康塞普西翁"
 SPR_fortify_la_linea_de_la_concepcion_desc: "拉利內阿-德拉康塞普西翁是防禦對面敵人的第一道屏障。憑藉足夠的工事，我們就能正面對抗來自直布羅陀的任何攻勢。"
 SPR_fortify_la_linea_de_la_concepcion_tt: "在直布羅陀邊境省份§Y塞維利亞§!與§Y格拉納達§!生成3級§Y要塞§!。\n"
 SPR_fortify_the_coastlines: "鞏固岸防"
 SPR_fortify_the_coastlines_desc: "我們不能忽視遭受海上入侵的可能性。相比於保持海疆門戶大開，鞏固防禦可以使敵軍面對更為棘手的情況。"
 SPR_fortify_the_coastlines_tt_1: "在§Y加利西亞§!，§Y阿斯圖里亞斯§!以及§Y巴斯克§!的沿海省份生成§Y1級海岸要塞§!。\n"
 SPR_fortify_the_coastlines_tt_2: "在有§Y海軍基地§!的大陸核心省份生成§Y1級陸上要塞§!與§Y2級海岸要塞§!。\n"
 SPR_militarize_the_industry: "工業軍事化"
 SPR_militarize_the_industry_desc: "我們一定要力促公社增產軍用物資，否則我們保家衛國的勇士們恐有軍備不足之虞。"
 SPR_communal_autarky: "公社自足"
 SPR_communal_autarky_desc: "列國於我等避之唯恐不及，因此我們只能依賴本土資源。我們將在不斷精進的最優化利用上更進一步。"
 SPR_faith_in_the_cause: "對事業的信仰"
 SPR_faith_in_the_cause_desc: "當天下人盡負於你，失敗主義的論調就不足道也了。我們要麼堅守未來終將天下太平的信念，要麼一敗塗地。"
 SPR_militarize_the_people: "武裝群眾"
 SPR_militarize_the_people_desc: "我們不奢望自己雙手不沾鮮血。所有人都必須學會持械自衛，以便必要時可以為了自己的未來而戰。"
 SPR_anarchism_knows_no_borders: "安那其沒有國界"
 SPR_anarchism_knows_no_borders_desc: "如果世界列國都不願給我們一席之地，那麼實現和平共榮的唯一方法就是摧毀所有國家。"
 SPR_plant_the_seeds_of_revolution: "播下革命種子"
 SPR_plant_the_seeds_of_revolution_desc: "那些與我們同病相憐的人在政府的威壓下長期保持緘默。我們將提供這些人所需的武器，這樣他們就能從內部推翻他們的國家，並在我們擊潰敵人並與其相連時加入我們的事業。"
 SPR_plant_the_seeds_of_revolution_tt: "解鎖§Y革命種子§!決議，允許在相鄰敵方領土上製造安那其暴動。\n"
 SPR_global_defense_council: "全球防禦委員會"
 SPR_global_defense_council_desc: "我們的疆域已經擴大到伊比利亞半島的地理範圍之外，我們給臨時防禦委員會起的名字已難副其實。我們將重新為之命名，以代表這顆星球上的全體人民。"
 SPR_global_defense_council_tt: "§Y[ROOT.GetName]§!將改名為§Y全球防禦委員會§!\n"
 SPR_global_defense_council_tt_2: "解鎖§Y革命種子§!決議，允許在足夠高§Y順從度§!的外國控制地區轉換及製造核心。\n"
 SPR_the_anti_fascist_workers_revolution: "反法西斯工人革命"
 SPR_the_anti_fascist_workers_revolution_desc: "西班牙工人站起來反對法西斯敵人的時刻到了！我們將和資產階級肩並肩站在一起，儘管這只是為了確保有足夠的力量來對抗這一威脅。革命現在開始了！"
 SPR_strengthen_the_euzko_gudarostea: "加強巴斯克軍團"
 SPR_strengthen_the_euzko_gudarostea_desc: "巴斯克地區的工業至關重要，必須加以更妥善的防禦。擴編當地政府所組織的軍隊對於鞏固其前線大有裨益。"
 SPR_strengthen_the_euzko_gudarostea_tt: "在§Y巴斯克§!獲得6個由§Y3步兵營§!組成的單位。\n"
 SPR_remove_after_civil_war_tt: "§R這些部隊將在內戰結束後被移除！§!\n"
 SPR_fortify_the_iron_ring: "鞏固“鐵環”防禦"
 SPR_fortify_the_iron_ring_desc: "我們將在巴斯克地區最大的城市——畢爾巴鄂構築“鐵環”防衛工事，這將使得巴斯克成為阻礙法西斯敵人的巨大障礙。"
 SPR_arm_the_workers_militias: "武裝工人民兵"
 SPR_arm_the_workers_militias_desc: "我們已經在工人中組建了民兵，現在必須保證他們能獲得充足的武裝，才能使他們成為對抗法西斯敵人和叛軍的先鋒。"
 SPR_hinder_nkvd_interference: "阻止內務人民委員部干政"
 SPR_hinder_nkvd_interference_desc: "蘇聯內務人民委員部干涉西班牙內政已經太久了。敢於反對斯大林的異議者都已消失無蹤，我們的政客孤掌難鳴，而對抗法西斯的鬥爭甚至更多地為所謂的盟友而非敵人所累。現在已經忍無可忍了，我們必須向斯大林主義者反擊。"
 SPR_hinder_nkvd_interference_tt: "將§Y安那其暴動臨近§!任務替換為§Y政府鎮壓臨近§!任務。\n"
 SPR_demand_ministerial_positions: "索要部長職位"
 SPR_demand_ministerial_positions_desc: "如果共和國希望繼續得到我們的長期支持，他們必須為我們的人在政府中謀得職位。只有如此才能證明他們將我們視作並肩作戰的重要盟友。"
 SPR_the_stalinist_doctrine: "斯大林至上"
 SPR_the_stalinist_doctrine_desc: "在我們反法西斯陣營組成的鬆散聯盟中，有些人從不同於斯大林的立場出發來解釋馬克思的觀點。對社會主義來說，這是斷然不可接受的汙點。為了不使其危害到工人們進行的鬥爭，我們必須將這些異議抹除掉，並讓所有人團結在同一位領袖之下。"
 SPR_subvert_the_stalinists: "推翻斯大林主義"
 SPR_subvert_the_stalinists_desc: "我們並未挑起此次衝突，但如果斯大林主義者執意要煽動內亂，我們只能奉陪。我們將壞其擁躉，蠹其供給，以此拔其根基。無論他們做什麼，都會處處碰壁。 "
 SPR_class_war: "階級鬥爭"
 SPR_class_war_desc: "人民陣線的觀念是有缺陷的。只要工人還被迫同資產階級共處一個屋簷下，工人就永遠得不到真正的自由。縱然這意味著要同時對資本家和法西斯開戰，卻也唯有徹底的階級鬥爭才能帶給我們心之所向的自由。"
 SPR_secularize_the_new_state: "世俗化新國家"
 SPR_secularize_the_new_state_desc: "我們正在建設的新社會沒有宗教的容身之處。這些毒品只是為了強化階級體系或弱化工人意志。只有把思想從這些迷信中解脫出來，我們才能真正獲得自由。"
 SPR_appropriate_church_riches: "抄沒教會財產"
 SPR_appropriate_church_riches_desc: "天主教會積攢的財富為我們所用才更加妥善。我們將利用它來改造舊廠並建設新廠，這些財富都將為實現我們的最終目標而物盡其用。"
 SPR_an_army_of_all_classes: "全階級聯合軍隊"
 SPR_an_army_of_all_classes_desc: "面對法西斯的威脅，階級問題退居次位。我們軍隊募兵時將來者不拒，同時又要讓他們接受為同胞們所重的正確的社會主義價值觀。"
 SPR_relocate_the_gold_reserves: "轉移黃金儲備"
 SPR_relocate_the_gold_reserves_desc: "我們的黃金儲備是從國外購買戰爭物資的關鍵。我們必須確保其存放在一個安全的地方，但不幸的是，這意味著它們需要被轉移到國外。"
 SPR_relocate_the_gold_reserves_tt: "§R我們的黃金儲備將由東道國支配！§!\n"
 SPR_reaffirm_the_popular_front_strategy: "重申人民陣線戰略"
 SPR_reaffirm_the_popular_front_strategy_desc: "當務之急是暫時擱置我們和盟友間的分歧，以使我們都可以專注於更重要的鬥爭：反法西斯。"
 SPR_anti_fascist_unity: "團結反法西斯力量"
 SPR_anti_fascist_unity_desc: "我們與安那其主義者、反斯大林主義者盟友之間的分歧越來越嚴重。我們不能承受這種失控的升級。我們必須把注意力重新集中在真正的敵人身上，即使內部穩定的代價是從政府層面向任性的盟友作出讓步。"
 SPR_anti_fascist_unity_tt: "解鎖§Y團結反法西斯力量§!決議，通過讓步使得推遲安那其主義者的暴動成為可能。\n"
 SPR_crush_the_revolution: "粉碎革命"
 SPR_crush_the_revolution_desc: "安那其主義公社的獨立運作方式一直是我們的眼中釘，並且，說實話，他們薄弱的防禦是我方前線的致命弱點。沒有他們，我們會更好，所以現在是時候徹底粉碎這場革命了。"
 SPR_crush_the_revolution_tt: "§R中立主義支持者將發動內戰！§!\n"
 SPR_united_under_socialism: "團結在社會主義之下"
 SPR_united_under_socialism_desc: "儘管我們來自五湖四海，身份背景各不相同，但這些差異必須被拋諸腦後，讓我們集中精力共同追求社會主義。 "
 SPR_wealth_redistribution: "財富再分配"
 SPR_wealth_redistribution_desc: "既然富人的財產已經被沒收了，為使人人得均受其利，我們理應與大家盡數重新分配這些財產，以此為國民所共享。"
 SPR_collective_recovery_efforts: "協力重建"
 SPR_collective_recovery_efforts_desc: "西班牙社會必須在一股強力下擰成一股繩來修復我們在武裝內戰中遭受的創傷。我們必須重建工廠，讓人們復工，還要新建基礎設施，以促進當地社區的協調發展。"
 SPR_repair_and_expand_the_dockyards: "復建船塢"
 SPR_repair_and_expand_the_dockyards_desc: "許多重要的船塢在內戰中未能倖免於難。在修復這些船塢時，我們也應當考慮加以擴建，為將來擴編海軍的計劃做準備。"
 SPR_the_peoples_fleet: "人民艦隊"
 SPR_the_peoples_fleet_desc: "人民的意志在陸地和海洋上都應得以展現。我們需要立即開始建造一支新的艦隊，以此作為海上後盾。"
 SPR_land_redistribution: "土地再分配"
 SPR_land_redistribution_desc: "耕者當有其田。戰前被白白浪費在地主手上的土地，現在需要被分給那些力耕數耘之人。"
 SPR_expand_the_means_of_production: "擴充生產資料"
 SPR_expand_the_means_of_production_desc: "集體的良性發展有賴於其工業實力。通過擴大我們的工業規模，我們將內可維穩，外可禦敵。"
 SPR_invite_socialist_intellectuals: "邀請社會主義知識分子"
 SPR_invite_socialist_intellectuals_desc: "我們的社會，將是一切同我們一樣獻身社會主義事業的知識分子的避難所。我們必須邀請來自世界各地的學者專家，這樣他們的才能可以為我們提供幫助。"
 SPR_solidify_government_control: "強化政府控制"
 SPR_solidify_government_control_desc: "為了全體人民的利益，全國各自治區的各行其是必須被加以限制。面對國外法西斯的威脅，我們不能讓自治政府削弱我們的團結。"
 SPR_reeducate_the_bourgeoisie: "資產階級再教育"
 SPR_reeducate_the_bourgeoisie_desc: "人民陣線的歷史使命已經結束，現在輪到資產階級接受再教育，把將他們從經濟和社會的錯誤觀念中解放出來了。我們仍然可以把他們改造成我國的合格公民。"
 SPR_the_spanish_red_army: "西班牙紅軍"
 SPR_the_spanish_red_army_desc: "我們應當建立一支全新且忠誠的軍隊來保衛西班牙工人的利益並抵抗外國威脅，這得效仿蘇聯的做法。"
 SPR_expand_soviet_aid: "請求增加蘇聯援助"
 SPR_expand_soviet_aid_desc: "我們無法僅靠自己來贏得這場戰爭，必去求取更多的國際援助。[SOV.GetNameDefCap]必須理解到發生在伊比利亞的戰爭是對抗法西斯的關鍵戰場，敵人的勢頭不得不需要得到遏制。"
 SPR_expand_soviet_aid_tt: "\n§R增加蘇聯援助將導致我們在內戰結束後付出巨大代價！§!\n"
 SPR_soviet_equipment_shipments: "運輸蘇聯裝備"
 SPR_soviet_equipment_shipments_desc: "我們國內工業無法提供足夠的武器，必須靠[SOV.GetNameDef]的武器運輸彌補不足。"
 SPR_soviet_military_advisors: "蘇聯軍事顧問"
 SPR_soviet_military_advisors_desc: "蘇聯軍事顧問能給予我們的部隊和指揮官對抗敵人的利刃。"
 SPR_soviet_industrial_aid: "蘇聯工業援助"
 SPR_soviet_industrial_aid_desc: "僅是武器運輸還不足以滿足前線部隊的需求。擴大蘇聯對我國國內工業的援助很可能使我們暫時彌補這一差距，甚至可能為最終達到完全自給自足鋪平道路。"
 SPR_soviet_technological_advancements: "蘇聯先進技術"
 SPR_soviet_technological_advancements_desc: "[SOV.GetNameDefCap]掌握著我們所沒有的技術。為了打敗法西斯，他們肯定願意將這些先進技術與我們分享…？"
 SPR_soviet_recovery_aid: "蘇聯重建援助"
 SPR_soviet_recovery_aid_desc: "隨著戰爭的勝利，[SOV.GetNameDef]已經準備好協助我們進行重建工作。"
 SPR_all_must_do_their_part: "人盡其才"
 SPR_all_must_do_their_part_desc: "社會主義事業要想取得成功，離不開每個人所作出的貢獻。因此，社會各界之間就沒有內訌的餘地。"
 SPR_the_red_tide: "赤潮"
 SPR_the_red_tide_desc: "人民對事業的所知所想是公正和正確的，我們所要做的就是利用這一思潮，來確保為軍隊源源不斷地招募立場堅定的新兵。我們軍隊會像赤潮一樣沖垮任何反對我們的人。"
 SPR_arm_the_tide: "武裝赤潮"
 SPR_arm_the_tide_desc: "沒有足夠的裝備，光靠社會主義工人的個人熱情是無法取勝的。我們會給他們正急切需要的，用作戰爭的工具。"
 SPR_against_fascism: "打倒法西斯"
 SPR_against_fascism_desc: "法西斯兇寇雖則在伊比利亞半島上被消滅了，但還在我國邊境上游蕩。我們必須投身於國際鬥爭，一舉徹底消滅這個惡魔。"
 SPR_doctrinal_advancements: "理論進步"
 SPR_doctrinal_advancements_desc: "我們可對從內戰所得的教益入手深入發展，形成更符合實戰需要的新軍事理論。"
 SPR_lessons_from_the_civil_war: "內戰的教益"
 SPR_lessons_from_the_civil_war_desc: "內戰中的奮不顧身讓我們對戰爭之道獲益良多，不把這些經驗在新式軍隊的組建訓練中應用簡直白白浪費。"
 SPR_nationalize_the_industry: "工業國有化"
 SPR_nationalize_the_industry_desc: "我們不會把工業浪費在投資者和公司手中，而是要把它置於國家的控制之下，以便更好地指導和組織它們的生產。"
 SPR_beacon_of_socialism: "社會主義燈塔"
 SPR_beacon_of_socialism_desc: "我國作為社會主義的昭昭燈塔，定會招徠到志同道合的科學家前來為工人事業效勞。"
 SPR_increase_arms_production: "增加武器生產"
 SPR_increase_arms_production_desc: "軍隊需要武器捍衛來共產主義理想。我們偉大國家必須進一步提升其工業能力，以便提供這些武器。"
 SPR_exploit_spains_riches: "開發西班牙的財富"
 SPR_exploit_spains_riches_desc: "伊比利亞半島擁有豐富的自然資源，開發之將大大加強我們的軍事工業，同時這也是重建國家的寶貴財富。"
 SPR_unify_the_london_bureau: "團結倫敦局"
 SPR_unify_the_london_bureau_desc: "為了應對第三國際的成立以及托洛茨基同斯大林之間的黨爭，革命社會主義團結國際局成立了，它不認同上述兩種對馬克思主義的闡述。我們將與其接觸，形成反對託派和斯大林主義的社會主義統一戰線。"
 SPR_against_trotskyism_and_stalinism: "打倒託派和斯大林主義"
 SPR_against_trotskyism_and_stalinism_desc: "托洛茨基和斯大林的朋黨整日的爭鬥不休，嚴重危害了社會主義事業的團結。如果他們無法擱置分歧，我們就得用最直接的手段解決掉他們。"
 SPR_against_trotskyism_and_stalinism_tt: "獲得針對§Y斯大林派§!或§Y托洛茨基蘇聯§!或§Y墨西哥§!的§Y$puppet_wargoal_focus$§!戰爭目標。"
 SPR_red_bulwark_in_the_west: "西方紅色堡壘"
 SPR_red_bulwark_in_the_west_desc: "我國的地理位置決定了我國與盟友相隔萬里。一旦遭到攻擊，特別是海上入侵，[SOV.GetNameDef]的援助將望而不及。我們必須強化防禦，這樣才能成為社會主義的堡壘，在西歐的最後的堡壘。"
 SPR_appeal_for_increased_autonomy: "要求增加自主權"
 SPR_appeal_for_increased_autonomy_desc: "[SOV.GetAdjective]的援助帶我們走向勝利，卻也讓我們付出成為其附屬的代價。我們已經展現出對社會主義的忠誠與捍衛社會主義的能力，這對莫斯科來說當然是毋庸置疑的。也許我們可以說服他們放鬆捆繩。"
 SPR_modernize_the_armed_forces: "武裝力量現代化"
 SPR_modernize_the_armed_forces_desc: "我國在西歐的弱勢地位將會因新型武器和裝備的研發而大大提升。"
 SPR_a_red_iberia: "紅色伊比利亞"
 SPR_a_red_iberia_desc: "在社會主義旗幟下統一整個伊比利亞半島的時代已經到來。"
 SPR_support_french_communists: "支持法國共產黨"
 SPR_support_french_communists_desc: "[FRA.GetNameDefCap]近來也存在著略成氣候的共產主義情緒。如果他們對於在推進工人運動方面的合作上有點見識的話，那麼聯合將是大勢所趨。但是如果他們不那麼聰明的話，我們就不得不得用武力把社會主義帶給他們。"
 SPR_avenge_foreign_interference: "報復外國干涉"
 SPR_avenge_foreign_interference_desc: "外國列強在內戰橫加干涉，支持我們的法西斯敵人。十年不晚，反擊的狼煙已然升起。"
 SPR_avenge_foreign_interference_tt: "獲得對內戰時期所有向國民軍派遣過志願軍的國家的戰爭目標。\n"
 SPR_provide_for_the_people: "人民糧食供應"
 SPR_provide_for_the_people_desc: "當務之急是確保人民的糧食供應，勝利成果決不能被饑荒的災難所湮沒。"
 SPR_collectivize_industry: "工業集體化"
 SPR_collectivize_industry_desc: "工業的集體化有助於進一步提高生產力和提振工人的勞動熱情。"
 SPR_connect_the_country: "連通全國"
 SPR_connect_the_country_desc: "橫跨全國的大型基礎設施建設項目將會確保半島最偏遠地區之間的快速物流。從長遠來看，這對我們是有利的。"
 SPR_transplant_soviet_industry: "承接蘇聯工業"
 SPR_transplant_soviet_industry_desc: "蘇聯在轉移工廠方面展現了豐富的經驗，即使跨隔數千公里仍如履平地。為了讓國內軍事工業能夠重新起步，我們將請求蘇聯把一些次要的工廠轉移到伊比利亞半島。"
 SPR_the_five_year_plan: "五年計劃"
 SPR_the_five_year_plan_desc: "一項大膽的新計劃將著眼於在五年之內把西班牙轉變成為一個區域性工業強國。"
 SPR_slipway_enlargement: "擴建船塢"
 SPR_slipway_enlargement_desc: "為了建造更大的軍艦，我們必須考慮擴大船塢設施。"
 SPR_a_red_fleet: "紅色艦隊"
 SPR_a_red_fleet_desc: "為了在全球範圍內傳播社會主義，我們需要一支強大的海軍。那我們從現在開始建設一支紅色艦隊。"
 SPR_maintain_the_second_republic: "保衛第二共和國"
 SPR_maintain_the_second_republic_desc: "叛軍政變失利，我國政府仍然有能力保衛自由。第二共和國將戰勝對人民權利的威脅，一如它在1934年戰勝礦工罷工一樣。"
 SPR_new_leadership: "新領導層"
 SPR_new_leadership_desc: "共和國需要新的領導層來度過這段艱難時期。我們將任命一批新的顧問和部長，他們在對抗法西斯威脅上持富有新意的觀點，讓我們能夠更好地捍衛我們的原則和信仰。"
 SPR_the_future_of_the_republic: "共和國的未來"
 SPR_the_future_of_the_republic_desc: "目前的鬥爭毫無疑問是影響共和國未來的決定時刻。我們必須不遺餘力、不惜代價地確保我們妥塑造一個美好的未來。"
 SPR_petition_for_french_aid: "請求法國援助"
 SPR_petition_for_french_aid_desc: "我們的北方鄰國正在援助與否上舉棋不定，因為無論他們採取什麼行動，都很可能會引發國內的動亂。他們不能再這麼優柔寡斷了，我們生存與否取決於他們是否願意採取行動。"
 SPR_petition_for_french_aid_tt: "§R[FRA.GetNameDefCap]必須批准該協議才能使獎益生效。§!\n"
 SPR_ensure_loyalty: "確保忠誠"
 SPR_ensure_loyalty_desc: "政府遭到了軍方的殘酷背叛，修復創傷的第一步是確保我們今後任命的所有官員忠心耿耿。"
 SPR_enlist_the_carabineros: "徵募武警"
 SPR_enlist_the_carabineros_desc: "為了填補前線空缺，我們必須採用非常規的手段。正規軍不足時，準軍事邊防警衛和海關部隊也得填進戰壕。"
 SPR_enlist_the_carabineros_tt: "在隨機的5個地區獲得一個§Y3個步兵§!營。\n"
 has_hired_juan_negrin_tt: "§Y胡安·內格寧§!：被僱傭為顧問"
 SPA_embrace_pan_hispanism: "接受泛西班牙裔民族主義"
 SPA_embrace_pan_hispanism_desc: "近年來，泛西班牙主義在我們的舊殖民地不斷發展壯大，現在，隨著我們再征服運動的成功，是時候接受他們的思想了，這樣西班牙帝國才能再屹立千年！"
 SPA_embrace_pan_hispanism_tt: "我們控制了§Y[CHL.GetName]§!、§Y[ARG.GetName]§!、§Y[ECU.GetName]§!、§Y[PRU.GetName]§!、§Y[URG.GetName]§!、§Y[PAR.GetName]§!、§Y[BOL.GetName]§!、§Y[COL.GetName]§!、§Y[VEN.GetName]§!、§Y[PAN.GetName]§!、§Y[COS.GetName]§!、§Y[NIC.GetName]§!、§Y[HON.GetName]§!、§Y[ELS.GetName]§!、§Y[GUA.GetName]§!、§Y[MEX.GetName]§!、§Y[DOM.GetName]§!、§Y[CUB.GetName]§!和§Y[PUE.GetName]§!的所有核心地區。"
 SPA_absorb_the_portuguese_empire_tt: "我們會獲得任何我們控制的§Y葡萄牙§!核心地區的核心"
 SPR_the_popular_army: "人民軍"
 SPR_the_popular_army_desc: "新軍將由未參與過軍方叛亂的人組成。他們雖然可能從未服過役，卻有著捍衛共和國原則的赤誠之心。重組軍隊的同時，我們還將研究新式武器和戰術以協助這支新軍的作戰。"
 SPR_take_the_initiative: "掌握主動權"
 SPR_take_the_initiative_desc: "我們不能坐等敵人發動進攻。戰爭中先手得利，我們必須掌握主動權。"
 SPR_no_pasaran: "不許通過！"
 SPR_no_pasaran_desc: "讓反法西斯主義的信念響徹每一座城市的每一個家庭。從每一個屋頂到每一條街道，從每一個街壘到每一條戰壕中迴響：“不許通過！”——不能讓他們過去！"
 SPR_no_pasaran_tt: "在所有控制的§Y1勝利點§!省份生成§Y1級陸上要塞§!。\n在所有控制的§Y3勝利點§!省份生成§Y2級陸上要塞§!。\n在所有控制的§Y10勝利點§!省份生成§Y3級陸上要塞§!。\n在所有控制的§Y30勝利點§!及以上的省份生成§Y4級陸上要塞§!。\n"
 SPR_a_frontline_suited_for_intellectuals: "科學家的戰場"
 SPR_a_frontline_suited_for_intellectuals_desc: "對於我們當中最頭腦出色的人，讓他們在戰場前線對抗法西斯實屬暴殄天物。他們在大後方才能發揮更多作用：製造新式戰爭工具遠比前線多幾個人手更有益於我們的鬥爭。"
 SPR_strengthen_the_anti_fascist_coalition: "強化反法西斯聯盟"
 SPR_strengthen_the_anti_fascist_coalition_desc: "我們已經消除了聯盟中持異議的部分——希望這意味著我們現在終於可以集中精力團結起來，齊心協力剷除法西斯主義。"
 SPR_oppose_the_communists: "反對共產主義者"
 SPR_oppose_the_communists_desc: "共產主義者不過是反法西斯鬥爭中的無可奈何的權宜盟友。一旦鬥爭結束，我們必須以自己的方式處理他們。"
 SPR_fortify_the_central_government: "強化中央政府"
 SPR_fortify_the_central_government_desc: "我們必須對共產主義的影響更加警惕，以防其設法暗中從內部控制共和國。"
 SPR_secure_democratic_principles: "維護民主原則"
 SPR_secure_democratic_principles_desc: "我們不能縱容共產主義影響歪曲乃至摧毀那些為第二共和國奠基的基本原則。無論我們與共產分子或[SOV.GetNameDef]的關係如何，基本原則如果不能公開申明，也必須默記在心。"
 SPR_subvert_soviet_control: "擺脫蘇聯控制"
 SPR_subvert_soviet_control_desc: "[SOV.GetAdjective]援助讓我們迎來了勝利，卻也讓我們付出了成為附庸的代價，前路仍然漫漫。我們將開始削弱[SOV.GetAdjective]在我國的共產主義影響，為了我們的獨立與自由，這將是最後的鬥爭。"
 SPR_subvert_soviet_control_tt: "\n§R[SOV.GetNameDefCap]很可能對我們的忤逆行為採取懲罰性行動！§!\n"
 SPR_war_of_independence: "獨立戰爭"
 SPR_war_of_independence_desc: "現在我們將與昔日主子分道揚鑣，免遭被迫成為蘇聯的下一個加盟共和國的命運。這需要我們的人民付出巨大的努力，以從左派右派專政極權的夾縫中最終取得自由。"
 SPR_war_of_independence_tt: "§R如果他們不接受我們的要求，這將導致戰爭！§!"
 SPR_those_who_would_not_help_us: "曾經拋棄我們的人"
 SPR_those_who_would_not_help_us_desc: "我們曾在與法西斯分子的鬥爭中被西方拋棄了，但事過境遷，他們陷入了自己的戰爭。而我們仍舊需要他們的援助，也許這次，當我們成為對抗新敵人的先頭陣地時，他們會更加留意到我們的作用。"
 SPR_those_who_would_not_help_us_tt: "§R這些國家必須批准該協議才能使獎益生效。§!\n"
 SPR_ideological_allies: "意識形態盟友"
 SPR_ideological_allies_desc: "西班牙在內戰的嚴峻考驗中得到了重生——我們將與意識形態盟友同呼吸共命運，攜手對抗右翼和左翼的極端主義。"
 SPR_enemies_of_our_enemy: "敵人的敵人就是朋友"
 SPR_enemies_of_our_enemy_desc: "雖然他們在內戰期間幫助過我們的敵人，但我們現在有一個共同的對手。也許是時候拋開我們的分歧，直到贏得更大的鬥爭。"
 SPR_deal_with_the_devil: "與惡魔的交易"
 SPR_deal_with_the_devil_desc: "德國人在對抗蘇聯方面有著豐富的經驗，儘管我們永遠不可能同意正式結盟。但與他們在軍事方面的交流，或許可以讓我們在對抗共同敵人的戰爭中獲得明顯優勢。"
 SPR_deal_with_the_devil_tt: "§R[GER.GetNameDefCap]必須批准該協議才能使獎益生效。§!\n"
 SPR_foreign_industrial_aid: "外國工業援助"
 SPR_foreign_industrial_aid_desc: "簽了新的協定後，我們將吸引外國企業投資我國並協助重建。"
 SPR_stabilize_the_nation: "穩定國家"
 SPR_stabilize_the_nation_desc: "我們取得了內戰的勝利果實，但現在必須確保恢復穩定，以免在不遠的將來重蹈覆轍。"
 SPR_end_fascism_at_all_costs: "不計代價消滅法西斯"
 SPR_end_fascism_at_all_costs_desc: "沒有什麼比徹底消滅法西斯更加重要——即使這需要把靈魂出賣給共產主義，那賣就賣了吧。"
 SPR_communists_in_the_government: "政府中的共產黨人"
 SPR_communists_in_the_government_desc: "共產黨在政府中的影響力已經發展到了相當大的程度，他們現在要求徹底改組領導層，以展現共和國的新面貌。"
 SPR_communists_in_the_government_tt: "可以§G啟用§!斯大林主義部長，而民主派部長將§R被移除§!。\n"
 SPR_restore_higher_education: "恢復高等教育"
 SPR_restore_higher_education_desc: "我們應該重建且擴建在戰爭中遭到破壞的高等教育機構，以確保為工業建設提供穩定的人才供應。"
 SPR_engineering_advances: "工程技術進步"
 SPR_engineering_advances_desc: "工程技術的新進展使建造改良工業、新型號飛機和裝甲成為可能。"
 SPR_rebuild_the_nation: "重建國家"
 SPR_rebuild_the_nation_desc: "在內戰的恐怖過後，我國重歸穩定，工業地位也正慢慢恢復。在工業擴張計劃上進行大量投資無疑會給經濟帶來重獲吸引力所需的一臂之力。"
 SPR_reprofessionalize_the_military: "軍隊再職業化"
 SPR_reprofessionalize_the_military_desc: "在迫不得已的情況下，我軍重建在一幫沒有接受嚴格軍事紀律訓練的人上。為將一支臨時應急的散兵遊勇轉型成真正的國家軍隊，我們必須對軍隊進行再職業化，實際地強化其軍事紀律和指揮體系。"
 SPR_experiences_from_the_civil_war: "內戰的經驗"
 SPR_experiences_from_the_civil_war_desc: "我國軍隊在內戰期間的經驗使軍事思想和裝備的發展有了巨大的新進展。"
 SPR_a_new_military_academy: "新軍校"
 SPR_a_new_military_academy_desc: "為了真正實現國家軍隊職業化的目標，我們必須建立一個新的學院，以確保軍官們充分發揮自己的潛力。"
 SPR_revive_the_republican_navy: "復興共和國海軍"
 SPR_revive_the_republican_navy_desc: "正如陸軍一般，我國海軍也在內戰中被撕裂，而其重建亦當作為維護國家安全的重點之一。這需要立即動工興建新的基礎設施。"
 SPR_navy_modernization: "海軍現代化"
 SPR_navy_modernization_desc: "巨大的損失伴隨著不可多得的機會，現在沒有理由再限制新型現代化艦艇的建造了。我們將著手調研合適的設計並立刻投產。"
 SPR_expand_the_naval_academy: "擴大海軍學院"
 SPR_expand_the_naval_academy_desc: "內戰充分暴露出我國海軍領導層的失職。提高海軍學院的教學質量並擴大其規模能夠保證，減少那些造成慘重代價的戰略和戰術失誤在未來發生的可能性。"
 SPR_prepare_for_the_next_war: "準備下一場戰爭"
 SPR_prepare_for_the_next_war_desc: "若要堅強地抵抗外國對我們飽受戰爭蹂躪的國家的各種威脅，就必須擴張我們的軍事工業。我們必須為將來的可能的一切做好準備。"
 SPR_wartime_industry: "戰時工業"
 SPR_wartime_industry_desc: "我們再次陷入戰爭，因此必須確保工業擴張側重於軍用，而非民用。"
 SPR_fuel_for_the_war_machine: "戰爭機器的燃料"
 SPR_fuel_for_the_war_machine_desc: "戰略資源對我們的軍工行業至關重要，而這類需求越能自給自足就越好。通過在全國範圍內建設新的礦山，鋼鐵廠和鋁冶煉廠，我們將有能力長期實現這種自給自足。"
 SPR_join_the_global_fight_against_fascism: "加入全球反法西斯戰爭"
 SPR_join_the_global_fight_against_fascism_desc: "我們在西班牙打敗了法西斯，但它仍然在世界上的其他國家存在。我們有義務將鬥爭進行到底。"
 SPR_the_anti_fascist_crusade: "反法西斯十字軍"
 SPR_the_anti_fascist_crusade_desc: "西班牙人早在別人意識到危險之前就與法西斯分子作戰了。這是我們的戰鬥，我們決不停下，直到勝利。"
 FRA_devalue_the_franc_desc: "當他國進行貨幣貶值來挽救經濟時，我國曾堅絕予以拒絕效仿，這造成了我國經濟落後於人。如果我們想讓競爭性更強並在面對山雨欲來的局勢時能未雨綢繆，貶值貨幣的選項就不能完全排除在外，即使它不怎麼受歡迎。"
 FRA_autoroutes: "高速公路"
 FRA_autoroutes_desc: "德國以其連通國內各地全封閉但高速的道路震驚了世界。我們可以向世界證明我們也可以做到。"
 FRA_invest_in_the_metropole: "開發本土"
 FRA_invest_in_the_metropole_desc: "重建工業的第一步必須是改善我們在本土的工業基礎。"
 FRA_invest_in_the_colonies: "開發殖民地"
 FRA_invest_in_the_colonies_desc: "我們在歐洲的工業腹地並沒有足夠的人口與資源來維持大規模的工業擴張。如果我們的經濟想要同世界其他國家競爭，就必須利用我國的殖民地。"
 FRA_colonial_industry_effect_tt: "為每個此前投資過的殖民地地區添加2座§Y民用工廠§!。\n"
 FRA_industrial_expansion_effect_tt: "為每個此前投資過的本土地區添加2座§Y民用工廠§!。\n"
 FRA_military_factories_effect_tt: "為每個此前投資過的地區添加2座§Y軍用工廠§!。\n"
 FRA_invest_in_west_africa: "投資西非"
 FRA_invest_in_west_africa_desc: "西非龐大的勞工與資源儲備使其成為投資的完美選項。"
 FRA_invest_in_indochina: "投資印度支那"
 FRA_invest_in_indochina_desc: "我們在印度支那的資產和本土核心區之間的距離似乎拖了後腿，但這也使得建立在那裡的任何工業免遭敵人的攻擊。"
 FRA_invest_in_syria: "投資敘利亞"
 FRA_invest_in_syria_desc: "一旦歐洲或非洲發生戰爭，敘利亞完全可以支持補給中轉。提高其工業潛力也能夠維持我們在附近地區的地位。"
 FRA_global_integration: "全球整合"
 FRA_global_integration_desc: "不列顛帝國是一個相互支撐的精密體系。我們的殖民帝國沒道理不能發展地同樣好。"
 FRA_begin_rearmament: "開始重整軍備"
 FRA_begin_rearmament_desc: "福煦元帥在1919年預測的二十年休戰行將告終，這個世界不久就要陷入一場新的風暴。我們必須做好準備。"
 FRA_firepower_kills: "火力殺傷"
 FRA_firepower_kills_desc: "一戰的教訓簡單亦殘酷： 士兵在開闊地上相互廝殺的日子已經過去。現在，通過大規模使用遠距離的現代化武器就能完成殺戮。"
 FRA_methodical_battle: "有序作戰"
 FRA_methodical_battle_desc: "聲稱戰鬥就該是亂殺的都是蠢貨。作戰應當是基於整體的計劃，有條不紊地運用正確的工具。只要妥善計劃，敵人就可能僅是歷史的小注腳。"
 FRA_division_cuirassee: "裝甲師"
 FRA_division_cuirassee_desc: "一位名為戴高樂的進取軍官提議組建一種新的部隊，將重裝甲、步兵和中型坦克結合成複合整體來執行作戰。"
 FRA_infantry_tanks: "步兵坦克"
 FRA_infantry_tanks_desc: "無論何時，坦克的第一和唯一要務就是確保步兵能奪下和保住陣地。因此，我們的步兵必須總是配備有先進而可靠的坦克。"
 FRA_special_forces: "特種部隊"
 FRA_special_forces_desc: "在未來，在常規步兵受限的環境中進行的作戰會更加常見。我們必須新建一些更能適應特殊環境的部隊。"
 FRA_fusiliers_marine: "海軍陸戰隊"
 FRA_fusiliers_marine_desc: "海岸是無法攻破的防線的日子已經過去了。在未來，無論與我們交戰的敵人在何處，我們都必須克服一切障礙來奪取登陸點。"
 FRA_battle_of_maneuver: "機動作戰"
 FRA_battle_of_maneuver_desc: "戰場僅是將交火集中在一小片區域的陳舊觀點已經消亡了。在大規模機械化、作戰飛機和快速無線電通訊的情況下，戰鬥得以迅速地在數百公里長的戰線上展開。為此，我們準備得越早越好。"
 FRA_air_dominance_desc: "飛機的發展成為了陸軍第三個需要擔心的側翼。我們必須保護好這一側翼的安全，否則就是一場災難。"
 FRA_air_ground_cooperation: "空地合作"
 FRA_air_ground_cooperation_desc: "空戰只有在獵殺地面目標的時候才會產生實際的軍事收益。我們將空戰與陸戰協調得越好，戰鬥效率就會越高。"
 FRA_flying_artillery_desc: "在快速運動的現代戰場上，緩慢的地面火炮陣地可能無法跟上節奏。攜帶炸彈的飛機可以接替它們的角色。"
 FRA_form_the_popular_front: "成立人民陣線"
 FRA_form_the_popular_front_desc: "隨著法西斯主義在德國和意大利的抬頭，若要使我們的事業倖存，則必須要停止左翼各派之間的內耗。由所有左翼黨派組成的泛人民陣線將得到民意授權，從而得以清除滋生法西斯主義的經濟條件。"
 FRA_ban_communism_desc: "雖然難以置信，但似乎確實有人真心實意地，期盼讓共產主義革命在自己的祖國颳起混亂與血腥的風暴。我們不能繼續縱容他們針對國家的陰謀詭計，必須嚴打嚴防。"
 FRA_invite_communist_ministers: "任命共產主義部長"
 FRA_invite_communist_ministers_desc: "由於害怕激進右翼的強烈反對，共產黨人一直無法真正地進入政府之中。但是害怕解決不了任何問題。如果我們必須面對衝突，那就讓它來吧。"
 FRA_strengthen_the_unions: "強化工會"
 FRA_strengthen_the_unions_desc: "長久以來，工人同志們集會去進行談判的權利始終無法得以保護。現在再也不會這樣了。"
 FRA_celebrate_the_commune: "紀念公社"
 FRA_celebrate_the_commune_desc: "儘管壽命不長，但巴黎公社是第一個在法國大地上嘗試建設共產主義的政權。"
 FRA_womens_suffrage_desc: "勤勞的法國婦女們一次次為了爭取自己的權利而在街壘上戰鬥，卻不被允許在選舉中投票，這真是既荒唐又可恥。我們得剷除這種不公。"
 FRA_legal_equality: "法律平等"
 FRA_legal_equality_desc: "從各種意義上講，婦女仍然被認為永遠要服從男人意志的二等公民。這種荒謬的現狀現在就要結束。"
 FRA_industrial_collectivization: "工業集體化"
 FRA_industrial_collectivization_desc: "現在的法國經濟是由許多僱員寥寥的小公司支撐的，它們永遠都在互相掐架、爭奪資源以滿足於低效的小規模生產中。我們將把這些小公司合併起來，以成立可以在世界舞臺上競爭的大公司。"
 FRA_agricultural_collectivization_desc: "適用於工業上的方法同樣適用於全法國的農民們。負擔不起現代設備的小農場，大多像祖輩一樣傳統勞作。通過把它們合併進農業生產單位，效率和產量將得以大大提生。"
 FRA_force_the_issue: "強迫抉擇"
 FRA_force_the_issue_desc: "自人民陣線成立以來，我們已經取得了很大的進步。但是我們決不能讓事業半途而廢。是時候讓所有左翼人士做出抉擇了——革命，還是被革命。"
 FRA_force_the_issue_tt: "穩定度的懲罰由§Y民主§!黨派的聲望所決定。\n"
 FRA_reconciliation: "和解"
 FRA_reconciliation_desc: "在過去，法國革命總是將整個國家拖進革命與反革命恐怖的無盡痙攣中。也許是時候建立一個人們無論支持革命與否，都能各得其所的共和國了。"
 FRA_constitutional_convention: "制憲大會"
 FRA_constitutional_convention_desc: "共和國性質的根本轉變不會在一夜間完成，也不可能在未協商制定一部新憲法前完成。"
 FRA_anti_fascist_coalition: "反法西斯聯盟"
 FRA_anti_fascist_coalition_desc: "法西斯主義的蔓延是我們前進道路上的最大威脅。我們必須同一切願意與法西斯抗爭的國家並肩作戰，否則所有人都將永無寧日。"
 FRA_invite_anti_fascist_emigrants: "邀請反法西斯移民"
 FRA_invite_anti_fascist_emigrants_desc: "每個法西斯政權上臺後所採取的首要措施必然是驅逐批評人士與針對國家政權的異見者。然而，這些人同時也是組建流亡政府的完美人選，以備在他們的祖國被解放的那一天派上用場。"
 FRA_reconnect_to_the_balkans: "重建與巴爾幹的聯繫"
 FRA_reconnect_to_the_balkans_desc: "長期以來，法國都在藉由接觸巴爾幹國家來尋求中歐的平衡。儘管近年來遭到冷落，但這個聯繫始終存在。"
 FRA_pre_empt_the_fascist_attack: "對法西斯先發制人"
 FRA_pre_empt_the_fascist_attack_desc: "為什麼我們要容許敵人在和平時期備戰，並且讓他們挑選最合適的時機來發動無可避免的戰爭呢？我們將會搶先出擊，在敵人還未準備妥善前粉碎威脅。"
 FRA_loyalty_to_moscow: "忠於莫斯科"
 FRA_loyalty_to_moscow_desc: "社會主義模式在蘇聯的實踐可能並不是那麼完美，但毋庸置疑，蘇聯已然最大程度地貫徹落實社會主義思想。我們若還想摸索自己的道路，就顯得十分沒見識。"
 FRA_league_of_french_bolshevist_volunteers_desc: "當一個社會主義國家處在外國入侵的威脅中時，所有的社會主義國家都處於威脅中。我們不能在我們的同志拼死抗爭時坐視不管。"
 FRA_host_the_german_exiles: "接待德國流亡者"
 FRA_host_the_german_exiles_desc: "德國，馬克思與恩格斯的故鄉，曾經是共產主義思潮的前沿與實踐地。許多德國共產黨人都在納粹掌權時逃亡。如果我們給予其庇護，他們可幫助我們在解放區組織起一個更加有效的政府。"
 FRA_revolution_to_the_utmost: "向著極限革命"
 FRA_revolution_to_the_utmost_desc: "半途而廢的革命根本不是一場革命。我們決不能停下腳步，直至革命徹底完成以及新的政治制度得以保障，這將不惜一切代價。"
 FRA_destroy_the_counter_revolution: "摧毀反革命"
 FRA_destroy_the_counter_revolution_desc: "時至今日，國內仍有一小撮人正在密謀，一旦廣大人民露出一絲破綻，便會用匕首狠狠背刺自己的同胞。為了不讓他們得逞，我們會率先打擊他們。"
 FRA_revolutionary_zeal_desc: "法國人民向來有砸碎舊秩序來建立新秩序的熱情，且聽人民的怒吼吧。"
 FRA_loyalty_to_the_cause: "忠於事業"
 FRA_loyalty_to_the_cause_desc: "其他國家可以從其自身角度詮釋共產主義，但我國沒有理由在這個問題上讓步。他們可能會半途而廢，圍繞著目的與手段的問題糾結，而我們不然。"
 FRA_carry_the_revolution_north: "向北輸出革命"
 FRA_carry_the_revolution_north_desc: "海峽對岸是工業革命的誕生地，也是現代資本主義的發源地。我們不能讓這個地方成為反革命敵人的跳板。"
 FRA_carry_the_revolution_west: "向西輸出革命"
 FRA_carry_the_revolution_west_desc: "伊比利亞半島的政權正命懸一線，隨時可能被人民革命沖垮。我們就是最後一根稻草。"
 FRA_carry_the_revolution_east: "向東輸出革命"
 FRA_carry_the_revolution_east_desc: "東部邊境的對面，是我等新秩序的最大威脅。反動勢力集結在那裡，隨時準備在我們最無力承受的時候發動攻擊——但我們不會留給他們足夠的準備時間。"
 FRA_carry_the_revolution_south: "向南輸出革命"
 FRA_carry_the_revolution_south_desc: "意大利是第一個淪陷於法西斯的國家。因此，這種意識形態在意大利也根深蒂固。阿爾卑斯兩側的世界觀永無和平共處之時。他們和我們一樣都清楚這一點，所以毫無疑問他們也在準備採取行動，就像我們正在做的一樣。"
 FRA_egalite_liberte_solidarite_desc: "第一次法國大革命橫掃了矗立千年的舊制度，永久地改變了歐洲的政治面貌。我們將完成自其以降的事業。"
 FRA_reform_the_labour_laws: "改革勞動法"
 FRA_reform_the_labour_laws_desc: "法蘭西的工人們收入低、福利少，處於極惡劣的條件下工作。現在是時候實施一系列全面的改革措施來改善這種狀況。"
 FRA_nationalize_key_industry: "國有化關鍵工業"
 FRA_nationalize_key_industry_desc: "在當前形勢下，為了應對即將到來的威脅，我們不能迴避經濟結構的根本性調整。時間緊迫——我們不能等待自由市場來解決這個問題。"
 FRA_reorganize_the_aviation_industry: "重組航空工業"
 FRA_reorganize_the_aviation_industry_desc: "數十年來，由於被拆分為幾十家小公司，我們的航空工業已落後於德國和美國。徹底的重組十分必要。"
 FRA_form_the_state_arsenals: "成立國有兵工廠"
 FRA_form_the_state_arsenals_desc: "為了向我軍提供現代化武器，我們不能等到私營公司發展出必要的生產能力。"
 FRA_general_work_council: "總工會"
 FRA_general_work_council_desc: "為了處理僱主和僱員之間的爭端，我們將建立一個國家機構，來確保工人就業能人盡其才。"
 FRA_national_champions: "龍頭企業"
 FRA_national_champions_desc: "通過選擇一些有潛力在全球範圍內競爭的公司，給予它們最大程度的支持，我們可以創造一個與其他任何公司同等強大的現代經濟體。"
 FRA_dirigisme_desc: "雖然蘇聯模式的全面計劃經濟顯然是一個極端的措施，但要優化我國經濟，一定的計劃和方向措施不可或缺。"
 FRA_ban_the_leagues: "查禁聯盟"
 FRA_ban_the_leagues_desc: "極右翼聯盟被允許不受約束地組織。雖然他們目前還很弱，無法發動政變，但誰也不知道他們將來能做些什麼。最好現在就解散他們。"
 FRA_the_blum_viollette_proposal: "布魯姆-維奧萊特提案"
 FRA_the_blum_viollette_proposal_desc: "法蘭西共和國的公民身份應向任何符合條件的人開放。我們在阿爾及利亞的許多忠實臣民希望成為正式公民，但目前他們還不被允許這樣做。通過使他們成為正式公民，我們將使阿爾及利亞與法國更加緊密地聯繫在一起。"
 FRA_expand_the_citizenship: "擴大公民權"
 FRA_expand_the_citizenship_desc: "對一個共和國來說，不允許居住在其領土上的人成為公民是不可容忍的，然而這種狀況卻還在我們的領土上繼續合法存在。這個錯誤必須立刻糾正。"
 FRA_france_undividable_desc: "法蘭西必須在同一面旗幟下整合為同一個整體。現在是公開承認這一點的時候了，只要能消除對分裂的恐懼。"
 FRA_french_union: "法蘭西聯邦"
 FRA_french_union_desc: "是時候宣稱一個新的法蘭西了，一個橫跨全球的法蘭西，我們國家的所有部分都團結在一起。我們將在每個部分舉行全民公投，以確認人民的意願，以此成立一個全新的、更偉大的法蘭西。"
 FRA_french_union_tt: "我們殖民帝國各地將舉行全民公投。有些部分可能會選擇完全獨立。"
 FRA_encourage_immigration: "鼓勵移民"
 FRA_encourage_immigration_desc: "我們的祖國正迫切需要工人來填補世界大戰中遭受的損失。通過放寬移居法國的限制，我們能夠吸引技術移民來彌補我們的不足。"
 FRA_review_foreign_policy: "重審外交政策"
 FRA_review_foreign_policy_desc: "1919年建立的大陸秩序似乎正在受到越來越嚴重的威脅。為了確保新的同盟能夠經受住即將來臨的風暴，現在是時候重新審視我們的對外政策了。"
 FRA_intervention_in_spain: "干涉西班牙"
 FRA_intervention_in_spain_desc: "西班牙內戰把意識形態衝突帶到了我們的家門口。我們必須謹慎行動，以免衝突蔓延到國內。"
 FRA_support_the_finns: "援助芬蘭"
 FRA_support_the_finns_desc: "芬蘭人民正為了他們的生存而戰。我們必須予以援助。"
 FRA_confirm_eastern_commitments: "重申東方承諾"
 FRA_confirm_eastern_commitments_desc: "一戰結束後，我們在東歐建立了同盟網絡。以對抗復甦的德國和擴張主義的蘇聯。我們在那裡的盟友想知道，一旦收到請求，我們是否真的會去幫助他們。在他們決定另謀他路之前，我們應該先行安撫他們。"
 FRA_strengthen_the_little_entente: "鞏固小協約國"
 FRA_strengthen_the_little_entente_desc: "小協約國使我們對身處東歐和巴爾幹的盟友負有援助義務。我們曾對其解體聽之任之，但現在卻比任何時候都需要之。是時候重建小協約國了。"
 FRA_invest_in_our_weaker_allies: "投資弱勢盟友"
 FRA_invest_in_our_weaker_allies_desc: "我們若要在戰爭中同有力的盟友並肩，就必須使他們的軍事能力滿足其需要。一項對他們的工業進行適度投資的計劃，可以使之有能力在當地生產所需的彈藥。"
 FRA_invest_in_our_weaker_allies_trigger_tt: "軍用工廠少於我們"
 FRA_coordinate_rearmament: "協調軍備重整"
 FRA_coordinate_rearmament_desc: "為了同德國和其他敵人的實力增長相匹敵，我們必須與其他盟友協調共進。"
 FRA_foreign_guest_workers: "外國勞工"
 FRA_foreign_guest_workers_desc: "勞動力不足是制約工業發展和軍隊規模擴大的重要瓶頸。從我們的盟友那裡邀請技術工人到我們的工廠工作，可以釋放出更多的人力來投入軍隊之中。"
 FRA_join_the_ententes: "協約國再聯合"
 FRA_join_the_ententes_desc: "法國不能同時履行兩項共同防禦的承諾。除非讓英國人和我們步調一致，否則就會陷入兩難境地。通過將我們參與的不同協約整合成一個整體，我們與盟友的威懾能力就可以提高一個數量級。"
 unlocks_espionage_operation_tt: "解鎖一場§Y間諜行動§!：\n"
 FRA_revive_the_franco_polish_alliance: "恢復法波同盟"
 FRA_revive_the_franco_polish_alliance_desc: "法國始終支持波蘭的獨立。但近年來，兩國間的關係有所冷淡。鑑於德國的威脅迫在眉睫，是時候重啟我們的條約了。"
 FRA_revive_the_franco_polish_alliance_tt: "\n如果我們是陣營領導者，波蘭將被邀請加入陣營。"
 FRA_buy_time: "爭取時間"
 FRA_buy_time_desc: "我們還未做好與德國人在戰場上兵刃相向的準備。我們的盟友還很弱小，我們的軍隊更是落後。如果我們想要存活下去，可能需要作出一些犧牲。"
 FRA_arms_purchases_in_the_us: "向美國購買軍備"
 FRA_arms_purchases_in_the_us_desc: "我國軍工業根本無法為軍隊提供不可或缺的現代化武器，而美國的生產力則有富餘。我們有可能說服他們售予我們所需的武器，除非他們決定要奉行孤立主義。"
 FRA_france_leads: "法國領導"
 FRA_france_leads_desc: "以法蘭西的輝煌歷史為證，我國決不會允許他國對外交政策指手畫腳。我們將會根據本國利益，做出本國的選擇。"
 FRA_concessions_to_italy: "向意大利讓步"
 FRA_concessions_to_italy_desc: "意大利仍然夢想著在非洲的帝業。如果我們作出一些讓步，同時承認其對埃塞俄比亞的征服——我們也許就能阻止羅馬柏林軸心的形成。"
 FRA_ratify_the_stresa_front: "批准斯特雷薩陣線"
 FRA_ratify_the_stresa_front_desc: "意大利表示同意加入我們的陣營，以換取非洲的領土，那麼就簽署並批准必要的條約吧。"
 FRA_franco_soviet_treaty: "法國-[SOV.GetAdjective]條約"
 FRA_franco_soviet_treaty_desc: "[SOV.GetAdjective]和我們一樣擔心法西斯在歐洲的崛起。如果時機成熟，也許可以說服他們支持我們。"
 FRA_revive_the_national_bloc: "復興國民聯盟"
 FRA_revive_the_national_bloc_desc: "政治形勢日益激化，左翼悄聲議論著要與共產黨達成合作。現在需要的是強力而穩定的領導。"
 FRA_laissez_faire: "自由放任"
 FRA_laissez_faire_desc: "共產黨公開要求通過極端手段重塑我國經濟結構，即剝奪勤勞人民群眾的正當財產。我們則用簡單而擲地有聲的自由理念予以回擊。一個充滿活力的經濟體永遠比一個官僚主義盤根錯節的左派噩夢要好。"
 FRA_protect_the_rights_of_man: "保護人權"
 FRA_protect_the_rights_of_man_desc: "也許共產黨永遠不會開誠佈公，但是人民群眾的眼光是雪亮的：剝奪財產權是毀滅由先輩們嘔心瀝血爭取到的所有權利的第一步，而這決不能被容許！"
 FRA_freedom_front: "自由陣線"
 FRA_freedom_front_desc: "當面對共產黨所企圖的混亂和劇變時，我們必須與其他黨派結盟，即使是那些在我們看來是洪水猛獸的黨派。"
 FRA_stimulate_the_dynamic_market: "刺激動態市場"
 FRA_stimulate_the_dynamic_market_desc: "動態市場已經被證明是各種經濟體系中最有效率的形式。但是其仍舊由人來驅動，而人有時則需要保障，以使其辛勤勞動成果不會白費。通過立法取消一些限制並給予保障，我們可以幫助投資者克服恐懼並使其投入到刺激我國經濟發展的事業中來。"
 FRA_agricultural_protectionism_desc: "我國傳統的生產方式在世界經濟發展中越來越居於不利地位。如果不採取措施保護農民，危機就會接連不斷地到來，因為我們的農民在面對海外食品的大量湧入時毫無競爭力可言。"
 FRA_economic_devolution: "經濟分權"
 FRA_economic_devolution_desc: "如果說，有的官員身處巴黎就能知道什麼措施對於波爾多的公司有利，是太荒謬可笑了。我們必須信任那些企業家，讓他們有能力就地解決自己的問題。"
 FRA_promote_entrepeneurship: "鼓勵創業"
 FRA_promote_entrepeneurship_desc: "一個富有活力經濟體的心臟永遠握在那些從不讓機會流失的人的手中。而近年來，冗餘的規章制度將這種精神消磨殆盡，我們需要改變現狀。"
 FRA_utilize_the_leagues: "利用聯盟"
 FRA_utilize_the_leagues_desc: "可悲的是，政治暴力在法國已司空見慣。如果這個國家要在共產主義革命的威脅下生存下去，我們決不能忽視那些在街頭撞見或行將撞見共產黨暴徒的可憐人。"
 FRA_national_regeneration: "民族重生"
 FRA_national_regeneration_desc: "過度的民主和迷途的共和荼毒了我們的國家，撕裂了我們的同胞。治癒這些創傷需要很長時間，但千里之行，始於足下。"
 FRA_national_regeneration_trigger_tt: "中立主義與法西斯主義支持度之和超過50%"
 FRA_destroy_decadence: "粉碎墮落"
 FRA_destroy_decadence_desc: "一個國家，如果允許自己在最無足輕重的議題上浪費數個月的時間去辯論，就永遠不可能偉大。某些國家，在海洋的庇護以及全球帝國的支持下，可能以為有能力承受這種奢侈，但我們不能。"
 FRA_integralism: "整合主義"
 FRA_integralism_desc: "整合主義的意識形態認為，社會的各個方面必須團結一致，猶如更大的整體中的一部分。這個社會必須有良好的秩序，以確保其各個部分和諧一致。"
 FRA_work: "勞動"
 FRA_work_desc: "工匠是國民經濟中最重要的組成部分。在正確適當的指引下，把自己的勞動奉獻給國家無疑成為了最崇高的志業。"
 FRA_family: "家庭"
 FRA_family_desc: "社會上最小的單位不是個人，而是家庭。為這個簡單而明顯的事實爭論不休，是舊共和國最大的缺陷。"
 FRA_fatherland: "祖國"
 FRA_fatherland_desc: "每一位[FRA.GetAdjective]公民，無論男女老幼，都有責任保衛並幫助自己的同胞。而實現這一點的唯一途徑，只能是通過秩序以及對國家無條件的忠誠。對此絕不能有任何質疑，否則我們將重蹈舊共和國的覆轍。我們將採取一切必要措施來維持秩序與國家安全。最終，人民會明白這符合他們的根本利益。"
 FRA_political_unity: "政治統一"
 FRA_political_unity_desc: "專制君主垮臺以來，法蘭西的歷史充斥著政治內鬥。團結則法蘭西得勝，內亂則法蘭西落敗。因此，少數人的野心決不能損害多數人的生計。"
 FRA_diplomatic_freedom: "外交自由"
 FRA_diplomatic_freedom_desc: "共和政府把自己束縛在東歐的人造建築上，一旦我們撤回援助，這些建築就會轟然倒塌。然而，這些束縛是負債而非資產，因此需要被剝離掉。"
 FRA_latin_entente: "拉丁協約"
 FRA_latin_entente_desc: "羅馬帝國繼承者之間的兄弟情誼是不可否認的。日耳曼人統治歐洲大陸太久了。現在正是奪回我等與生俱來的權力之時。"
 FRA_reach_out_to_spain: "聯合西班牙"
 FRA_reach_out_to_spain_desc: "剛剛從內戰中恢復過來的西班牙，是我們嘗試重塑這片大陸的天然盟友。"
 FRA_invite_portugal: "邀請葡萄牙"
 FRA_invite_portugal_desc: "儘管她的殖民帝國已大大縮水，但探索和征服的火焰仍在每個葡萄牙人心中燃燒。"
 FRA_compensate_italy: "補償意大利"
 FRA_compensate_italy_desc: "過去，爭奪一小片沙漠的衝突就能把我們兩國拖進戰爭的泥沼。要停止這種無理取鬧簡直不能再容易，很快我們就能找到讓雙方都滿意的解決辦法。"
 FRA_intervention_in_greece: "干涉希臘"
 FRA_intervention_in_greece_desc: "希臘控制著地中海一些最有價值的領土。為了不讓敵國控制，我們必須首先採取行動。"
 FRA_the_congress_of_paris: "巴黎會議"
 FRA_the_congress_of_paris_desc: "柏林會議確定了列強在非洲的邊界，但現在看來像一塊滿是補丁的破布。現在是時候重繪地圖，為新的殖民帝國奠基了。"
 FRA_the_natural_borders_of_france: "法蘭西的自然邊界"
 FRA_the_natural_borders_of_france_desc: "一個國家首先考慮自己的利益是天經地義的，在我們的鬥爭中無法與德國人和平共處。因此，我們必須控制自然邊界，以此保衛心臟地帶。"
 FRA_towards_a_new_europe: "向著新歐洲前進"
 FRA_towards_a_new_europe_desc: "法蘭西正處在一個十字路口。我們可以把自己束縛在舊世界中，也可以起身擁抱新秩序。德國人正準備重構歐洲大陸，站在他們一邊對我們有利。"
 FRA_establish_spheres_of_influence: "建立勢力圈"
 FRA_establish_spheres_of_influence_desc: "數百年來，兩國人民相信雙方是不共戴天的世仇關係，而這個觀念建立在兩國存在利益衝突的基礎上。但我們一定能就劃定雙方勢力圈和盡力剋制互相干涉達成一份協議。"
 FRA_split_belgium: "拆分比利時"
 FRA_split_belgium_desc: "隨著比利時進入我們的勢力圈，現在是時候召喚法語區回家了。其餘部分將組建一個新的國家。"
 FRA_align_belgium: "聯合比利時"
 FRA_align_belgium_desc: "比利時的存在應歸功於我們，我們不能讓他們忘記這一事實。如果我們讓他們保持獨立存在，至少能確保建立一個友好的政府。"
 FRA_grow_the_empire: "擴張帝國"
 FRA_grow_the_empire_desc: "像比利時這麼小的一個國家竟然被允許保留一個如此廣袤的殖民地，無比荒謬。顯然我們更適合管理這個地區。"
 FRA_bring_home_quebec: "帶魁北克回家"
 FRA_bring_home_quebec_desc: "長久以來失去的省份遲早都將回到我們的懷抱。世界上所有說法語的人最終都將與祖國統一。"
 FRA_expand_to_the_suez: "擴張到蘇伊士"
 FRA_expand_to_the_suez_desc: "我們與英國在黎凡特地區的劃分是一個不切實際的協議，幸運的是，我們現在不必再遵守了。"
 FRA_dominate_the_middle_east: "主導中東"
 FRA_dominate_the_middle_east_desc: "中東國家是人造的產物，自奧斯曼帝國的遺骸上雕刻而來。他們的主權不比普通的法國村莊更多，是時候提醒他們一下了。"
 FRA_the_council_of_rambouillet: "朗布里埃會議"
 FRA_the_council_of_rambouillet_desc: "國家動盪不安，人民亟需一個強有力的領袖。很明顯，共和主義讓人民失望了，現在正是法蘭西的君權神授迴歸之時。但首先，必須為恢復君主制奠定基礎。"
 FRA_revise_the_constitution: "修訂憲法"
 FRA_revise_the_constitution_desc: "共和憲法本就是一個權宜之計，但居然持續了這麼久。現在，我們將重新修訂這部憲法，允許君主重歸王位。"
 FRA_repeal_the_law_of_exile: "廢止流放法"
 FRA_repeal_the_law_of_exile_desc: "根據現行的規定，任何統治過法蘭西的王室族長或其繼承人在未經許可的情況下，都不得在我國境內活動。因此，在實現君權復辟偉業前，我們必須先處理掉這個煩人的小障礙。"
 FRA_orleanist_restoration: "奧爾良派復辟"
 FRA_orleanist_restoration_desc: "奧爾良家族在法國的保王黨中獲得了相當大的支持。儘管一些反對者傾向於另一位王位候選人，但毫無疑問，這位奧爾良派的繼承人有最好的機會來和平團結他身後的國家。"
 FRA_guarantee_the_constitution: "保障憲法"
 FRA_guarantee_the_constitution_desc: "在共和派媒體有機會發動反對王室統治合法性的運動之前，我們必須通過給個人權利以強有力保障的方式來動搖他們的根基。"
 FRA_the_first_citizen_of_the_state: "國家第一公民"
 FRA_the_first_citizen_of_the_state_desc: "國王雖然擁有相當大的權力，但決不能與舊時代的專制暴君等量齊觀。與之相反的是，一個現代君主必須尊重法律，這是對抗那些非法篡權者的先頭防線。"
 FRA_counter_action_desc: "“法蘭西行動”長期以來都是君主制復辟的最大鼓吹者。但很遺憾，他們在其他話題上的觀點並不悅耳動聽。兔死狗烹，他們已經沒用了，該處理掉了。"
 FRA_no_further_humiliations: "終止恥辱"
 FRA_no_further_humiliations_desc: "多年來，歷屆共和政府在德國對國際條約的粗暴對待是屈辱退讓，其中一些條約甚至墨跡未乾就被公然撕毀。現在這一切結束了。"
 FRA_slum_clearing: "清理貧民窟"
 FRA_slum_clearing_desc: "儘管身為世界列強，法國的普通工人卻大多在令人作嘔的惡劣環境中工作生活。沒有一個稱職的國王能容忍他的臣民生活在這樣的國家裡。"
 FRA_public_welfare: "公共福利"
 FRA_public_welfare_desc: "不為臣民服務的國王不是一個好國王。"
 FRA_the_legitimate_heir: "正統繼承人"
 FRA_the_legitimate_heir_desc: "正統派認為卡洛斯分支是法蘭西王位的正統繼承人。指定他們的候選人登上王座，就有了在二元君主制下聯合統治西班牙和法蘭西的誘人可能。"
 FRA_secure_the_crown_of_spain: "確保西班牙王位"
 FRA_secure_the_crown_of_spain_desc: "要想獲得國王與生俱來的權利，第一步就是要保護西班牙不受各種偽政府的侵擾。他們雞毛蒜皮的爭吵已經使這個國家陷入了一場血腥的內戰中——我們不能再讓他們這樣做了。"
 FRA_unite_the_crowns: "聯合王冠"
 FRA_unite_the_crowns_desc: "在穩住了西班牙之後，我們可以聯合兩頂王冠並建立一個新的王國，法蘭西-西班牙王國。"
 FRA_two_countries_two_crowns: "兩個國家，兩頂王冠"
 FRA_two_countries_two_crowns_desc: "當兩國都不甘心屈居下位時，實現統一就不具備可能性。我們將轉而建議國王通過共主邦聯而非法理整合的方式同時統治兩個國家。"
 FRA_proclaim_the_third_empire: "宣告第三帝國"
 FRA_proclaim_the_third_empire_desc: "在爭奪王位的鬥爭中，波拿巴黨可能多少是個局外人。但他們承載著一個夢想，即重返整個歐洲都向法蘭西皇帝臣服的時代。"
 FRA_avenge_waterloo: "雪恥滑鐵盧"
 FRA_avenge_waterloo_desc: "拿破崙一世的歷史將永遠為其慘敗所累。如果我們想成功，我們必須能夠在他跌倒的地方重新站起來。"
 FRA_reorganize_the_dutch: "重組荷蘭"
 FRA_reorganize_the_dutch_desc: "荷蘭亦曾是法蘭西帝國的一部分。既然他們已被擊敗，那也該恢復原狀了。"
 FRA_retribution_for_sedan: "雪恥色當"
 FRA_retribution_for_sedan_desc: "半個多世紀以來，德國一直在慶祝色當之戰，他們的勝利擊垮了拿破崙三世。在未來，每個德國人都將學會詛咒那個地方。"
 FRA_disunite_germany: "肢解德意志"
 FRA_disunite_germany_desc: "對法蘭西的勝利使得普魯士在她的旗幟下統一了小德意志諸國。既然德國人被擊敗了，這個過程理應逆轉。"
 FRA_disunite_germany_tt: "將§Y大陸體系§!重命名為§Y萊茵聯邦§!"
 FRA_return_to_borodino: "重返博羅季諾"
 FRA_return_to_borodino_desc: "在博羅季諾，拿破崙距離歐羅巴勝利僅一步之遙。彼時俄軍幾乎全軍覆沒，如果拿破崙能夠再快一點，俄羅斯就會屈服在他的腳下。我們將向世界展示，這是可以做到的。"
 FRA_je_suis_la_deluge: "我即浪潮"
 FRA_je_suis_la_deluge_desc: "法國大革命就像一場浪潮，捲走了長久以來統治歐洲老邁而虛弱的政權。現在，新的浪潮來了。"
 FRA_coordinate_rearmament_tt: "減少我方陣營成員生產許可花費。"
 invite_to_faction_tt: "被邀請加入我們的陣營。"
 VIC_emergency_powers_to_petain: "授予貝當緊急權力"
 VIC_emergency_powers_to_petain_desc: "隨著法蘭西保衛戰的失敗，很顯然，我們必須採取激進措施來確保國家安全。總統在做必須之事時不應被限制。"
 VIC_the_national_revolution: "國家革命"
 VIC_the_national_revolution_desc: "我們的失敗無疑是由我們國家根本上的缺陷造成的。要彌補這一缺陷需要耗費不少時日，但也許我們能越挫越勇。"
 VIC_long_term_economic_planning: "長期經濟計劃"
 VIC_long_term_economic_planning_desc: "儘管人們易於過度重視目前的局勢，以致於忽視了所有其他需要關心的問題，但我們決不能忘記事雖小不為不成的道理。通過制定一系列的經濟計劃，我們可以有效地發展經濟。"
 VIC_aid_small_businesses: "扶持小型企業"
 VIC_aid_small_businesses_desc: "構成了我國經濟主要部分的小型企業受到了配給制和其他戰爭措施的重大沖擊。我們應當設法補救，幫助他們生存下來。"
 VIC_venerate_the_craftsman: "尊重工匠"
 VIC_venerate_the_craftsman_desc: "長期以來，關於勞動的討論都集中在那些大公司、大工廠裡的產業工人身上。是時候展示那些在自己工坊裡勞動的工匠們的成就了，他們技藝高超，且自力更生。"
 VIC_down_with_marianne: "貶低瑪麗安娜"
 VIC_down_with_marianne_desc: "瑪麗安娜，法蘭西共和主義的象徵，對其的偽宗教式崇拜已經扭曲了人民的思想。就像其代表的一文不值的共和國一樣，她所留下的一切痕跡都必須被剷除。"
 VIC_up_with_jean_darc: "推崇聖女貞德"
 VIC_up_with_jean_darc_desc: "聖女貞德英勇無畏地抵抗長驅直入的敵人，為祖國犧牲了自己的一切，在其旗幟之下法蘭西得以團結一致，驅逐了侵略者。毫無疑問，對我們的青年人來說，她難道不是一個比瑪麗安娜更好的模範嗎？"
 VIC_celebrate_motherhood: "讚美母親"
 VIC_celebrate_motherhood_desc: "很明顯，女人應該呆在家裡，就像男人應該呆在工作臺前或田野間一樣。必須提醒我們的人民，婦女的工作同男子的工作一樣對國家的生存至關重要。"
 VIC_prosecute_the_losers: "檢舉內敵"
 VIC_prosecute_the_losers_desc: "多年以前，法蘭西與德皇的軍隊能夠互相抗衡，但在這次戰爭中卻一敗塗地。這一定是有原因的，在搞清楚之前，有關責任人員被繩之以法之前，調查決不能停。"
 VIC_concessions_to_the_germans: "向德國讓步"
 VIC_concessions_to_the_germans_desc: "現實形勢逼迫我們同以前的敵人達成屈辱的協議，必須想方設法來減輕我們所承受的沉重負擔。"
 VIC_mandatory_work_service: "強制勞役"
 VIC_mandatory_work_service_desc: "我們設法從德國人那裡得到了一個承諾：我們如果給他們提供勞工，就可以減輕一部分佔領花費。然而，似乎很少有人願意在祖國需要的時候去為國奉獻。激勵措施遺憾地失敗了，我們現在只能採用強制手段。"
 VIC_a_nation_reborn: "祖國重生"
 VIC_a_nation_reborn_desc: "在重建這個飽受屈辱和戰敗的國家的漫長而痛苦的進程結束後，一個嶄新的、重生的法蘭西擺脫了共和主義及內部分裂的毒瘤。"
 VIC_end_the_occupation: "終結佔領時期"
 VIC_end_the_occupation_desc: "在國家革命結束之後，我們已經準備好與從前的敵人站在一起，為一個不受布爾什維克主義的威脅和共和主義的誘惑的新歐洲而戰。"
 VIC_the_national_bureau_of_statistics: "國家統計局"
 VIC_the_national_bureau_of_statistics_desc: "若要帶領人民走進一個更加美好的未來，就需要硬數據作為決策的基礎。我們應該成立一個新的機構負責產生這些數據。"
 VIC_the_legionary_service_order: "軍團服役令"
 VIC_the_legionary_service_order_desc: "由於大部分軍隊被解除了武裝，而且無論如何這點實力也不足以保護整個法蘭西，所以我們需要一個新的愛國者組織來支撐政權。"
 VIC_form_the_milice: "組建民兵"
 VIC_form_the_milice_desc: "隨著法蘭西各地的抵抗力量越來越強，我們需要建立一支能夠與其作戰的部隊。我們只招募最愛國的成員，並給予他們廣泛的權限，讓他們在認為合適的時候先斬後奏，以逼迫恐怖分子屈服。"
 VIC_anti_bolshevist_volunteers: "反布爾什維克志願兵"
 VIC_anti_bolshevist_volunteers_desc: "現在，西方文明和共產主義之間展開了一場人類歷史上最宏大的鬥爭。在這場偉大而艱鉅的戰鬥中，我們不能袖手旁觀。"
 VIC_rebuild_the_military: "重建軍事工業"
 VIC_rebuild_the_military_desc: "法蘭西軍隊遭到了徹底的打敗和不留餘地的羞辱了，充分恢復戰鬥力還需要長時間的努力。"
 VIC_finish_the_naval_buildup: "完成海軍建設"
 VIC_finish_the_naval_buildup_desc: "共和國後期開建了許多船隻來推動海軍現代化。儘管姍姍來遲，施施而行，而難以及時完工，但它仍能擔任新法蘭西海軍的核心。"
 VIC_hidden_materials: "藏匿原材料"
 VIC_hidden_materials_desc: "如果沒有在執行條約上的陽奉陰違，德國不可能如此迅速地重建軍隊。因此，我們當然也可以如法炮製。"
 VIC_analyze_our_defeat: "分析敗因"
 VIC_analyze_our_defeat_desc: "我們的失敗並非不可避免，有許多可鄙的人人在一連串的自視甚高中失職。我們將找出確切的敗因，並確保我們在未來有更佳妥當的準備。"
 VIC_modernize_the_airforce: "空軍現代化"
 VIC_modernize_the_airforce_desc: "也許我們失敗中最丟臉的部分是無力空戰，我們的現代飛機太少了。隨著周遭戰爭的繼續，新飛機迅速投產。我們決不能讓類似的事情再次發生。"
 VIC_learn_from_the_enemy: "師敵長技"
 VIC_learn_from_the_enemy_desc: "瞭解我們為何且如何失敗的最快方法就是理解我們對手的所作所為。"
 VIC_buy_from_the_enemy: "市物於敵"
 VIC_buy_from_the_enemy_desc: "無論過去還是現在，我們的軍工能力都不能勝任保質保量供給武器的任務。我們必須設法通過各種可能的渠道獲取現代武器。"
 FRA_appeal_to_the_french_nation: "號召法蘭西民族"
 FRA_appeal_to_the_french_nation_desc: "法蘭西或許輸掉了一場戰鬥，但它沒有輸掉這場戰爭。反抗是每個愛國的法蘭西人的責任。"
 FRA_appeal_to_overseas_territories: "號召海外領地"
 FRA_appeal_to_overseas_territories_desc: "雖然法國的本土已經落入敵手，但帝國其餘的大部分仍是自由的。如果我們能把他們召集起來幫助我們，我們就能向敵人發起反擊。"
 FRA_appeal_to_overseas_territories_tt: "遍及世界的殖民地都有機會站在我們這邊。"
 FRA_intervention_in_north_africa: "干涉北非"
 FRA_intervention_in_north_africa_desc: "北非是入侵奪回家園的最佳跳板。拉攏到我方對解放戰爭至關重要。"
 FRA_intervention_in_west_africa: "干涉西非"
 FRA_intervention_in_west_africa_desc: "西非坐擁不計其數的人口，他們可以被徵召為新的軍隊以奪回我們的家園。"
 FRA_intervention_in_syria: "干涉敘利亞"
 FRA_intervention_in_syria_desc: "從敵人手中奪回敘利亞的戰略領土，我們就可以保護蘇伊士運河，由此大大改善我們在東地中海的戰況。"
 FRA_intervention_in_indochina: "干涉印度支那"
 FRA_intervention_in_indochina_desc: "我們在印度支那的殖民地與歐洲戰場千里之遙，對幫助我們保衛地區利益來說十分理想。"
 FRA_intervention_in_central_africa: "干涉中非"
 FRA_intervention_in_central_africa_desc: "中非對盟軍的作戰來說至關重要，若能佔領中非，就是我們在輿論上的一次勝利。"
 FRA_intervention_in_madagascar: "干涉馬達加斯加"
 FRA_intervention_in_madagascar_desc: "假如讓敵人佔據並固守馬達加斯加，那就是我們在印度洋戰場上的災難。我們要發動一次迅速果斷的行動，確保馬達加斯加島留在我們這一邊。"
 FRA_form_the_national_committee: "成立全國委員會"
 FRA_form_the_national_committee_desc: "極少有人相信我們的事業會成功。但是現在，我們終於有足夠的實力宣佈建立一個職能全面的流亡政府，準備接管從敵人手中解放出來的任何法國領土。"
 FRA_form_the_provisional_government_of_the_republic: "成立臨時政府"
 FRA_form_the_provisional_government_of_the_republic_desc: "隨著巴黎的解放，我們已不再是流亡政府。是時候開始道阻且長的重建工作了。"
 FRA_continue_the_fight: "戰鬥不息"
 FRA_continue_the_fight_desc: "到目前為止，選擇加入我們的士兵寥寥無幾，但我們的士兵必須全副武裝。"
 FRA_the_free_french_navy: "自由法國海軍"
 FRA_the_free_french_navy_desc: "盟國陷入了絕望的拼死鬥爭，海上航道至關重要。我們必須盡力幫助他們。"
 FRA_colonial_recruitment_desc: "現在我們無法在本土政變，我們必須尋求殖民地的幫助。有很多國民都願意為了我們拿起武器。"
 FRA_the_regiment_normandie: "諾曼底殲擊機旅"
 FRA_the_regiment_normandie_desc: "我們法國應被認為在各條戰線上參與戰鬥，這一點至關重要。蘇聯現在正在與我們共同的敵人作戰，可以派一小隊戰鬥機飛行員去幫助他們。"
 FRA_refus_absurde: "荒謬與反抗"
 FRA_refus_absurde_desc: "即使在最黑暗的時刻，一些人心中的反抗意志依然強烈。他們將成為淪陷區抵抗運動的基礎。"
 FRA_the_maquis: "馬基游擊隊"
 FRA_the_maquis_desc: "法國農村能為任何想逃離佔領軍或偽軍的人提供掩護。我們應該支持那些在抵抗行動中拒絕向敵人提供勞動的人民，以便我們能夠及時地把這些地區變成抵抗組織的溫床。"
 FRA_reach_out_to_trade_unions: "聯絡工會"
 FRA_reach_out_to_trade_unions_desc: "如果我們要打擊那些被迫為敵人服務的工廠，同工人們進行良好的溝通似乎是最好的辦法。他們可以從內部延遲或破壞當地的生產，遠比任何外部力量更有效。"
 FRA_cooperation_with_the_communists: "與共產黨合作"
 FRA_cooperation_with_the_communists_desc: "在我們的共同鬥爭中，我們決不能拒絕任何自告奮勇的盟友——即使他們稱自己為同志。"
 FRA_connections_to_industrialists: "聯絡企業家"
 FRA_connections_to_industrialists_desc: "雖然與軍工行業的工人合作會有所幫助，但與工廠經營者合作更有好處。"
 FRA_the_civil_and_military_organization: "軍民組織"
 FRA_the_civil_and_military_organization_desc: "許多進行抵抗活動的小團體正在聯合起來組成一個更大的組織，惟願一切順利。"
 FRA_national_council_of_the_resistance_desc: "在法國的抵抗運動越來越強大了，以至於需要設立一個新的指導委員會以協調各項活動。"
 FRA_national_uprising_desc: "時機已到。現在該拿起武器，殺出那籠罩了你們多年的陰影！"
 FRA_french_forces_of_the_interior: "法國國內部隊"
 FRA_french_forces_of_the_interior_desc: "抵抗組織在法國全境武裝了成千上萬的人。當我們和盟軍在全國各地挺進時，我們將帶上他們一起，以法軍戰士的名義。"
 FRA_french_forces_of_the_interior_tt: "在每個被解放的核心地區建立較弱的步兵單位。"
 FRA_naval_rearmament: "重整海軍軍備"
 FRA_naval_rearmament_desc: "當我們專注於追趕其他領域發展時，造船工業卻陷入凋敝。因此，我們現在有在地中海和大西洋遠遠被敵人甩在後面的風險。我們必須加大投資，以彌補失去的時間。"
 FRA_colonial_naval_bases: "殖民地海軍基地"
 FRA_colonial_naval_bases_desc: "全球力量投射的關鍵，就在於維持一支遠離本土海域的艦隊的能力。我們坐擁大量殖民地領土，現在必須開發殖民地，將它們建成為我們的艦隊補充燃料和維修的基地。"
 FRA_develop_colonial_dockyards: "開發殖民地船塢"
 FRA_develop_colonial_dockyards_desc: "隨著我們擴建及更新了帝國各地的海軍基地，現在可以著手建設重工業和大型船塢，以便在海外建造船隻。"
 FRA_the_old_school: "保守學派"
 FRA_the_old_school_desc: "儘管海軍科技不斷發展，海權的關鍵依然在於主力艦，再加以其他艦種的配合。不管主力艦是傳統的戰列艦還是新興的航空母艦，我們都必須擴張造船工業，確保我們能與其他海軍強國並駕齊驅。"
 FRA_carrier_planes: "艦載機"
 FRA_carrier_planes_desc: "航空母艦的優劣取決於艦載機的優劣。沒有現代化的飛機，再好的航母都是一堆廢鐵。"
 FRA_rush_the_richelieus: "優先建造黎塞留號"
 FRA_rush_the_richelieus_desc: "隨著歐洲的情況越來越危急，我們已經沒有時間用常規手段建造新的水面艦艇了。我們必須優先安排材料，讓新型戰列艦儘快入役。"
 FRA_prioritize_the_joffre: "優先建造霞飛號"
 FRA_prioritize_the_joffre_desc: "我們現有的航空母艦太過時了，無法與任何潛在的敵手相抗。我們必須把新型航母計劃放在最優先的地位。"
 FRA_the_young_school: "新銳學派"
 FRA_the_young_school_desc: "航空，潛艇與魚雷的最新發展表明，主力艦已經過時了。我們的海軍工業有限，不能把時間和金錢浪費在建造巨型浮動堡壘上，因為它們在現代海軍戰場上毫無作用。我們應當專注於提升效率，建造更多小型船隻。"
 FRA_undersea_combat: "水下戰鬥"
 FRA_undersea_combat_desc: "近十年來，潛艇技術日漸成熟。現在，潛艇能對所有水面艦艇造成致命的威脅，同時還更難以被偵測或擊沉。"
 FRA_surface_combat: "水面戰鬥"
 FRA_surface_combat_desc: "隨著火炮的進步，在持續的惡戰中，主力艦幾乎不可能在另一艘主力艦的炮火下生還。一個艦隊最佳的組成是現代化驅逐艦及魚雷艇，以此向敵人傾瀉似雨的魚雷。"
 FRA_prioritize_the_joffre_tt: "將一條現代化§Y航空母艦§!添加至生產隊列，完工40%。"
 POR_infrastructure_in_angola_tt: "在安哥拉的卡賓達省份添加§Y2個海軍基地§!。\n在安哥拉的羅安達省份添加§Y3個海軍基地§!。\n"
 FRA_SNCAN_formed: "建立國營北方航空製造公司"
 FRA_SNCAO_formed: "建立國營西方航空製造公司"
 FRA_SNCASE_formed: "建立國營東南航空製造公司"
 FRA_SNCASO_formed: "建立國營西南航空製造公司"
 vichy_french_focus: "維希法國國策樹"
 POR_colonial_assimilation_policy_desc: "不同於他國，葡萄牙的民族性並非依人種所分，而是由其文化認同與教化使命所決定。我們需要的是和諧共融，而非自厝同異。"
 POR_colonial_army_desc: "為了建立一個強大的國家，我們不能僅依賴於本土軍隊。我們必須培養殖民地士兵，武裝並訓練他們參與現代戰爭。"
 POR_luso_tropicalism: "葡萄牙熱帶主義"
 POR_luso_tropicalism_desc: "我們必須認識到葡萄牙自15世紀以來的多元文化特性並強調民族團結，通過將我們的非洲殖民地整合為我國領土，以及將公民權授予當地原住民。自然，會有批評的聲音，但我們必須為生活在我國領土內的人們做出正確的事。"
 POR_limited_self_rule: "有限自治"
 POR_limited_self_rule_desc: "通過增加我們非洲殖民地的自治權、允許他們建立其自治政府，我們就能將精力放在更急迫的事情上。這種去殖民化將拉近我們同全球民主國家的關係。"
 POR_restart_investment_into_timor: "重啟對帝汶的投資"
 POR_restart_investment_into_timor_desc: "在大蕭條期間，帝汶一直被視為經濟負擔，因此自危機開始以來，我們對其提供的支持或管理很少。隨著日本南洋興發開發公司在該地區投資，也許現在也是我們恢復在那裡投資的時候了。"
 POR_revert_the_local_autonomy_policies: "撤銷地方自治政策"
 POR_revert_the_local_autonomy_policies_desc: "1911年馬努法希叛亂後，我們的殖民政策重新轉回扶持土著統治者作為傀儡，放棄了先前進一步整合該地區的嘗試。或許我們應當扭轉這一局面，接納我們國家的多元文化。"
 POR_invest_in_sandalwood_and_coffee_production: "投資檀香木和咖啡生產"
 POR_invest_in_sandalwood_and_coffee_production_desc: "我們在帝汶的主要種植園公司——帝汶農牧公司，有望從政府的額外投資中獲得巨大收益。如果我們現在為其提供資金，其產品將在不久的將來為我們帶來豐厚回報。"
 POR_haven_of_neutrality_macau: "中立港澳門"
 POR_haven_of_neutrality_macau_desc: "鑑於我們當前的中立立場以及在亞洲各地肆虐的衝突，澳門已成為這段動盪時期中希望與穩定的燈塔。我們應當投資擴展這個省份。"
 POR_infrastructure_in_angola: "安哥拉基建"
 POR_infrastructure_in_angola_desc: "安哥拉有著許多未勘探過的礦產。我們必須發展該地區的基礎設施，以便在將來開發其資源。"
 POR_develop_north_angola: "開發北安哥拉"
 POR_develop_north_angola_desc: "我們已經在北安哥拉發現了鐵礦資源，我們應該建立開採這一寶貴資源所需的採掘工業。"
 POR_develop_south_angola: "開發南安哥拉"
 POR_develop_south_angola_desc: "在南安哥拉的勘探工作大功告成，現在我們能發展必需的開採工業了。"
 POR_portuguese_oil: "葡萄牙的石油"
 POR_portuguese_oil_desc: "一個沒有石油的國家無法在發生衝突時維持其經濟。我們必須在安哥拉探尋有利可圖的油田。"
 POR_develop_mozambique: "開發莫桑比克"
 POR_develop_mozambique_desc: "通過在莫桑比克發展基礎設施和工業，我們將得益於其豐富的鋁資源。"
 POR_continue_the_public_works: "繼續推行公共工程"
 POR_continue_the_public_works_desc: "多虧了我們政府在持續多年的不穩定財政狀況後實施的國家法規，我們已經設法穩定了我們的經濟狀況，而且應該繼續投資於公共項目以刺激基建推進。"
 POR_instituto_superior_tecnico: "高等技術學院"
 POR_instituto_superior_tecnico_desc: "葡萄牙需要一所擁有最先進的教學和研究設施的高等技術學院，以便在即將到來的比拼中不落人後。"
 POR_ogme: "工程材料總工廠"
 POR_ogme_desc: "通過投資通用工程材料總工廠，我們將能夠更快地為我們的軍隊提供現代化和高質量的裝備。"
 POR_ogma: "航空材料總工廠"
 POR_ogma_desc: "擴建航空材料總工廠的設施將大大提高我們飛機的生產效率。"
 POR_roads_bridges_and_dams: "道路、橋梁和大壩"
 POR_roads_bridges_and_dams_desc: "我們應該投資以改善基礎設施和道路系統為重點的公共建設項目。"
 POR_extraction_industries: "採掘工業"
 POR_extraction_industries_desc: "我們有很多財富深埋於地下等待挖掘，但是我們的採礦業落後而低效。我們必須建立現代化的採掘工業。"
 POR_hydroelectricity: "水電工程"
 POR_hydroelectricity_desc: "隨著在葡萄牙中部和北部大規模投資建設的進行，現在我們建成一套能夠用於發電和調節逕流的水壩電網成為了可能。"
 POR_military_vehicles: "軍用載具"
 POR_military_vehicles_desc: "我國軍隊需要現代化載具應對未來的戰爭。假若我軍想在未來衝突中取勝，則必須得到高質量產品的足夠供應。"
 POR_portuguese_artillery: "葡萄牙火炮"
 POR_portuguese_artillery_desc: "野戰炮在現代戰場至關重要。我們必須投資建設新設施以提高火炮生產能力。"
 POR_advanced_artillery: "先進火炮"
 POR_advanced_artillery_desc: "我們必須發展新式火炮並訓練部隊更高效地進行炮襲及支援步兵推進。"
 POR_military_research_facilities: "軍用研究設施"
 POR_military_research_facilities_desc: "改善軍工業的同時必須對研發進行充足投入，以供我國保有一支有戰鬥力的現代化軍隊。"
 POR_armor_focus: "聚焦裝甲車輛"
 POR_armor_focus_desc: "我國需要最優秀的戰爭機器來主宰戰場。我國必須擴建裝甲載具生產設施並投資進一步研發。"
 POR_mechanized_focus: "聚焦機械化"
 POR_mechanized_focus_desc: "在敵方火力中保護我方步兵的角色，由機械化載具承擔遠遠比其他輪式載具合適。研發及生產此類載具至關重要。"
 POR_light_aircraft_focus: "聚焦輕型飛機"
 POR_light_aircraft_focus_desc: "航空業在永不止息地進化，而我國必須發展良好的航空工業支持軍隊。"
 POR_advanced_light_aircraft: "先進輕型飛機"
 POR_advanced_light_aircraft_desc: "空軍與其他軍種之間的協調至關重要。發展現代飛機來支援我們的部隊將大大提高我們在戰鬥中的勝率。 "
 POR_jet_research: "噴氣機研發"
 POR_jet_research_desc: "我們如果想主宰天空，必須讓我們的飛行工程技術處於領先地位。研究像噴氣式發動機這樣新的飛行器動力來源似乎是最有前途的一條道路。"
 POR_industrial_modernization: "工業現代化"
 POR_industrial_modernization_desc: "我們的大多數民用工業仍然過時。如果我們花點時間和資源使其現代化，它可能會變得更有效率。"
 POR_a_new_industry_desc: "由於自動化生產技術的最新成果，我們可以繼續改進和擴張我們的民用工業設施，以使其效率達到新高。"
 POR_food_industries: "食品工業"
 POR_food_industries_desc: "現在是葡萄牙領先一步振興製造業的時候了。我們可以先在國家北部發展食品工業。"
 POR_textile_industry: "紡織工業"
 POR_textile_industry_desc: "為了充分發揮我國紡織業的潛力，我們必須建立新的紡織廠，以使我們擁有足夠的生產力來加工我國領土上生產的大量棉花。"
 POR_second_navy_reequipment: "第二次海軍軍備更新"
 POR_second_navy_reequipment_desc: "第一階段的海軍裝備更新計劃已經完成了，我們現在立即開始第二階段來改進我們的海軍船塢並開始向外國招標購買一些現代軍艦。"
 POR_a_powerful_merchant_marine: "強大的商船隊"
 POR_a_powerful_merchant_marine_desc: "我們需要打造一支巨型的貿易船隊以滿足我們經濟發展所需各種資源的運輸需求。運輸船的製造任務可以由一些小型船塢來完成。"
 POR_merchant_marine_protection: "商船護航"
 POR_merchant_marine_protection_desc: "我們在世界大戰中積攢的經驗教會我們，運輸船隊必須被好好保護以抵禦來自潛艇的威脅。"
 POR_submarine_effort: "重視潛艇"
 POR_submarine_effort_desc: "我們應該開始研究和生產現代潛艇。一旦我們參與水下戰爭，這將會給我們提供巨大的優勢。"
 POR_fuzileiros: "海軍陸戰隊"
 POR_fuzileiros_desc: "訓練有素的海軍陸戰隊是我們海外權益的安全保障。"
 POR_naval_research_institute: "海軍研究機構"
 POR_naval_research_institute_desc: "隨著合理的資金投入，我們的葡萄牙海軍可以改進其研究工作並讓未來的軍官接受更高水平的教育。"
 POR_air_naval_research: "海軍航空研究"
 POR_air_naval_research_desc: "我們必須集中最好的飛行員和海軍軍官，以研討一個新的方法來協調我們日益壯大的空軍和海軍。"
 POR_arsenal_do_alfeite: "阿爾菲特海軍船廠"
 POR_arsenal_do_alfeite_desc: "我們的優先事項應該是打造一支強大的海軍以使我們有能力保衛遼闊的帝國。我們必須擁有足夠的能力和技術以建造更大的艦船。里斯本的主要海軍船塢應該被擴建並僱傭更多造船專家。"
 POR_national_cruiser_production: "國家巡洋艦製造"
 POR_national_cruiser_production_desc: "我們應當繼續著眼於大型艦船的建設。現代巡洋艦將為我們的海軍提供強大的火力。"
 POR_battleship_effort: "重視戰列艦"
 POR_battleship_effort_desc: "如果我們想要控制海洋，那麼我們必須開足馬力生產現代戰列艦，這將讓很多國家在一想到我們的海軍時便瑟瑟發抖。"
 POR_carrier_effort: "重視航母"
 POR_carrier_effort_desc: "隨著現代空軍力量的威脅越來越大，航空母艦在海戰中的地位越發關鍵。"
 POR_atlantic_defense_strategy: "大西洋防衛戰略"
 POR_atlantic_defense_strategy_desc: "我們的島嶼彼此孤立地遍佈大洋之中，因此會被敵人接二連三地輕易奪取。然而，通過我們合理的投資，它們就能夠被轉變為永不沉沒的航空母艦！"
 POR_endless_sea_desc: "我們在亞洲的飛地暴露在其周邊帝國的戰爭威脅中。我們必須聚焦於增強它們的防衛力量以使它們可以抵禦任何潛在的侵略。"
 POR_popular_front: "人民陣線"
 POR_popular_front_desc: "西班牙人民陣線為我們指明瞭道路。我們必須把共產黨人、社會主義者和安那其主義者團結起來，組成一個廣泛的陣線，成為世界革命和反抗法西斯主義的先鋒。"
 POR_nation_in_arms_desc: "葡萄牙人民需要做好同邪惡的法西斯主義及帝國主義作戰的準備。我們必須發給他們武器並開始軍事訓練，因此，待時機成熟，我們的國家就將枕戈待旦！"
 POR_unify_leftist_youth_wings: "統一左翼青年組織"
 POR_unify_leftist_youth_wings_desc: "我們將成立葡萄牙共產主義青年團，以此統一現有組織並吸納潛在成員。這將創造一個可以讓我們的青年成員會面、討論並在我們政治活動中邁出其第一步的平臺。"
 POR_nationalize_industry: "工業國有化"
 POR_nationalize_industry_desc: "長期以來，私有資本一直在拖垮我們的經濟，阻礙我們社會的發展。為了葡萄牙人民的利益，我們必須通過國有化私有企業並控制每個工廠的運作來避免這一形勢延續下去。"
 POR_reorganization_of_the_communist_party: "改組共產黨"
 POR_reorganization_of_the_communist_party_desc: "在薩拉查獨裁政權時期，我黨許多成員都被當局所逮捕。我們將把他們帶回本土並調整我黨組織結構，以此確保各部門都會由最優秀的人才來管理。"
 POR_potential_civil_war_low_requirement_tt: "§R如果這一國策完成時§Y國家穩定度§!§R低於§Y40%§R，將會爆發內戰！§!§!§!§!"
 POR_potential_civil_war_high_requirement_tt: "§R如果這一國策完成時§Y國家穩定度§!§R低於§Y60%§R，將會爆發內戰！§!§!§!§!"
 POR_join_the_comintern: "加入共產國際"
 POR_join_the_comintern_desc: "蘇維埃聯盟為其他追隨他們社會主義制度的國家鋪平了道路。這將有利於我們與蘇聯同志展開合作，為了我們共同尋求的目標。"
 POR_research_collaboration: "科研合作"
 POR_research_collaboration_desc: "我們在蘇聯的同志有一個野心勃勃且資金充足的科研項目。與我們分享他們的科技成就對我們的無產階級戰爭來說是互惠互利的。"
 POR_support_the_spanish_republic: "支持西班牙共和國"
 POR_support_the_spanish_republic_desc: "西班牙人民正在內戰中同國民軍政變作鬥爭，而後者則妄圖接管控制全國。我們現在必須支持共和軍，因為一旦他們失敗，我們就會發現家門口多了一個新的潛在敵人。"
 POR_workers_of_iberia_unite: "伊比利亞的工人們，聯合起來！"
 POR_workers_of_iberia_unite_desc: "我們必須宣告伊比利亞無產階級聯合反抗各種形式的暴政，並與我們西班牙的同志們一道加入他們的內戰，成為對抗法西斯的堅強堡壘。\n我們的犧牲將青史留名，因為我們的事業乃是正義！"
 POR_workers_of_iberia_unite_civil_war_tt: "§R§Y中立派§!支持者將發動內戰§!"
 POR_the_iberian_socialist_union: "伊比利亞社會主義聯盟"
 POR_the_iberian_socialist_union_desc: "我們在戰爭期間與西班牙共和軍的攜手作戰表明，是時候把伊比利亞半島統一到一個社會主義人民政府之下了。\n我們將攜起手來徹底擊敗我們的敵人！"
 POR_visit_the_front: "視察前線"
 POR_visit_the_front_desc: "一些葡萄牙軍官將會被派往西班牙前線觀察。他們將會視察空軍新技術的使用情況。"
 POR_they_need_our_help: "雪中送炭"
 POR_they_need_our_help_desc: "西班牙的局勢正處在關鍵節點。我們必須馬上展開行動以避免國民軍取得勝利。我們將會加入到西班牙兄弟的鬥爭中去，團結起來我們將平定叛亂！"
 POR_intervention_in_spain: "干涉西班牙"
 POR_intervention_in_spain_desc: "我們無法接受西班牙政府的立場。他們的野心已然構成對我國理想和人民的威脅，因此，我們必須採取行動，以武力消除這種敵對態度。"
 POR_intervention_in_spain_tt: "[Root.GetFlag]§Y[Root.GetNameDefCap]§!：\n獲得針對[GetSpanishRepublicFlagAndNameDef]的§Y顛覆政權§!戰爭目標。"
 POR_securing_the_free_world: "保衛自由世界"
 POR_securing_the_free_world_desc: "如果我們想要成為一個大國，最好就應該開始採取與大國身份相符的行動。我們將保護與我們有共同理想和利益的小國，使它們免受任何潛在的外來威脅。"
 portugal_guarantees_freedom_tt: "保障所有意識形態為§Y民主主義§!或§Y中立§!的歐洲獨立小國的獨立。"
 POR_protect_chinese_civilians: "保護在華公民"
 POR_protect_chinese_civilians_desc: "有關外國軍隊在葡屬澳門附近進行軍事演習的報道已經開始引起當地居民不安。我們決不容忍任何針對我國公民或土地的威脅；為了我們光榮的民族，我們必須立刻行動起來！"
 POR_strict_neutrality_in_the_spanish_civil_war: "在西班牙內戰中嚴守中立"
 POR_strict_neutrality_in_the_spanish_civil_war_desc: "西班牙內戰已經爆發，但我們不能承擔在此時捲入國際衝突所帶來的後果。我們必須在鞏固我國自身並改善外交關係的同時重申嚴守中立的政策。"
 POR_british_investment_in_mines: "英國礦業投資"
 POR_british_investment_in_mines_desc: "英國政府已表示對投資我國的資源開採有濃厚的興趣。這對我們來說將是一個改進提煉設備並提升我們科研能力的極好機會。"
 POR_british_industrial_investments: "英國工業投資"
 POR_british_industrial_investments_desc: "為滿足我們的經濟發展需求，我們的民用工業需要被進一步發展。英國政府很樂意對我們的國家展開新一輪的投資，只要我們願意向他們靠攏……"
 POR_allow_free_elections: "允許自由選舉"
 POR_allow_free_elections_desc: "英國對葡萄牙的影響最終興盛了起來，如今我們的人民正在要求選舉權，投票選出最能夠代表民意的政府。"
 POR_join_the_allies: "加入同盟國"
 POR_join_the_allies_desc: "是時候追隨歐洲主要民主國家的領導加入到他們的鬥爭中去了。我們將共同抵禦一切敵人！"
 POR_research_sharing: "研究共享"
 POR_research_sharing_desc: "我們的英國兄弟在技術研發上遠遠的超過了我們。一個技術共享協定將使我們和盟國變得更加強大。"
 POR_oppose_germany: "反對德意志"
 POR_oppose_germany_desc: "德國的敵對行為已經完全無法容忍，可是到目前為止沒有人能夠阻止他們。現在我們的軍隊已經做好了戰爭準備，葡萄牙應該加入到這場鬥爭中去，擊垮所有企圖剝奪其他國家自由的敵人。"
 POR_british_guns: "英制槍械"
 POR_british_guns_desc: "我們的軍工業現在還未做好生產現代戰爭裝備的準備，我們可以簽署一項協議來從英國購買武器裝備。"
 POR_estado_novo_desc: "自1933年憲法頒佈以來，我國一直遵循社團主義與自給自足的原則。增強國力最穩妥的方法就是堅定不移地沿這條路線前進，建設一個更強大的國家。"
 POR_support_the_spanish_nationalists: "支持西班牙國民軍"
 POR_support_the_spanish_nationalists_desc: "我們必須展現對西班牙國民軍的支持，他們正在為了國家的榮譽而與共產主義和安那其主義威脅做鬥爭。"
 POR_portuguese_legion: "葡萄牙軍團"
 POR_portuguese_legion_desc: "為了響應西班牙內戰的爆發，軍警已被派往邊界。我們必須組建一支自願的、愛國的、有能力執行警務工作的武裝民兵。"
 POR_observation_mission: "觀察團"
 POR_observation_mission_desc: "派遣軍事觀察團至西班牙並觀摩新式戰術與部署的新武器系統。"
 POR_send_assistance: "送出援助"
 POR_send_assistance_desc: "國民軍在西班牙內戰中的命運已風雨飄搖，敵方前線似乎越來越強。我們必須加入他們的鬥爭，並幫助起義軍擊敗共和政府，以徹底滅絕伊比利亞的共產主義威脅。"
 POR_nationalist_intervention: "支持國民軍"
 POR_nationalist_intervention_desc: "西班牙政府的野心威脅著我們的利益，這無論如何也不能容忍。如果我們的鄰國不願與我們的事業結盟，那麼我們將不得不以更具“說服力”的方式迫使他們這樣做。"
 POR_nationalist_intervention_tt: "[Root.GetFlag]§Y[Root.GetNameDefCap]§!：\n獲得針對[SPA.GetFlag][SPA.GetNameDefCap]的§Y顛覆政權§!戰爭目標。"
 POR_national_syndicalism_desc: "我們務必糾正薩拉查鎮壓國家工團主義運動並流放弗朗西斯科·羅朗·普雷托的錯誤，必須使該運動再次合法化並讓普雷托回國。"
 POR_camisas_azuis: "藍衫軍"
 POR_camisas_azuis_desc: "藍衫軍是一支隸屬於國家工團主義運動的武裝民兵，但該組織卻因其理想而遭解散。我們必須允許重建該組織，因為動員藍衫軍將為我國軍隊提供至關重要的人力資源。"
 POR_join_the_axis: "加入軸心國"
 POR_join_the_axis_desc: "我們必須與德國成為盟友，在即將到來的衝突中支持他們。德國也許是中歐的霸主，但葡萄牙將成為最強大的海外帝國！"
 POR_research_agreements: "科研協議"
 POR_research_agreements_desc: "我們必須與德國達成一項協議，以使我們能夠接觸到其先進的軍事技術，這將大大加速我國的科研水平並使我們能夠在戰場上部署更先進的武器裝備。"
 POR_the_fifth_empire_desc: "第五帝國代表著知識、靈智、信仰及帝國的最終融合。只有葡萄牙民族可以將其化為現實，並且不僅在領土層面上統一世界，在精神與文化層面上也是如此。"
 POR_expand_the_chinese_territories: "擴大在華領土"
 POR_expand_the_chinese_territories_desc: "如今亞洲國家疲於戰爭，這正是我們將領土從澳門擴大到全中國的好機會。筋疲力盡的中日兩國軍隊都不是我們的對手！"
 POR_expand_the_chinese_territories_tt: "獲得針對擁有以下地區的任何國家的§Y吞併§!戰爭目標：\n[592.GetName]（[592.Owner.GetFlag]§Y[592.Owner.GetName]§!）\n[594.GetName]（[594.Owner.GetFlag]§Y[594.Owner.GetName]§!）\n[325.GetName]（[325.Owner.GetFlag]§Y[325.Owner.GetName]§!）\n[613.GetName]（[613.Owner.GetFlag]§Y[613.Owner.GetName]§!）\n[622.GetName]（[622.Owner.GetFlag]§Y[622.Owner.GetName]§!）\n[604.GetName]（[604.Owner.GetFlag]§Y[604.Owner.GetName]§!）\n[615.GetName]（[615.Owner.GetFlag]§Y[615.Owner.GetName]§!）\n[611.GetName]（[611.Owner.GetFlag]§Y[611.Owner.GetName]§!）\n[328.GetName]（[328.Owner.GetFlag]§Y[328.Owner.GetName]§!）"
 POR_deal_with_the_japanese_threat: "處理日本威脅"
 POR_deal_with_the_japanese_threat_desc: "日本軍隊正威脅著我們在太平洋的領土，他們佔領鄰近的飛地並孤立了我們的殖民地。我們必須為他們潛在的侵略行動做好準備，在他們未料之時將戰火帶到日本本土。"
 POR_refuse_the_naval_blockade: "拒絕海上封鎖"
 POR_refuse_the_naval_blockade_desc: "我們可以對[ENG.GetAdjective]的海上封鎖陽奉陰違，以幫助與[ENG.GetNameDef]交戰的國家並從中獲利。我們的外交官會與後者們達成適當的協議，把我們的運輸船借給他們以換取經濟援助。"
 POR_mapa_cor_de_rosa: "粉紅地圖計劃"
 POR_mapa_cor_de_rosa_desc: "是時候對英國在1890年對我們下達最後通牒所帶來的恥辱進行報復了。我們在西非和東非的殖民地最終將連為一體！"
 POR_recover_the_east_indies: "收復東印度"
 POR_recover_the_east_indies_desc: "我們必須宣稱自己的合法領土。東印度群島定將再度歸於葡萄牙的控制下。"
 POR_recover_brazil: "收復巴西"
 POR_recover_brazil_desc: "為了恢復過去葡萄牙帝國的榮光，我們必須聚焦於自己的前美洲殖民地。巴西大地歸屬於我們帝國，因而我們必將用武力奪回它。"
 POR_army_reorganization: "陸軍整編"
 POR_army_reorganization_desc: "我們需要對軍隊進行重組，裁減冗餘的軍官和沒有戰鬥能力的單位並建立一個合理的徵募系統。這將為我們的現代軍隊建設打下基礎。"
 POR_metropolitan_army: "本土軍隊"
 POR_metropolitan_army_desc: "對於葡萄牙來說，最大的危險顯然是被拖進歐洲的戰爭泥潭中，並且眼睜睜看著我們的本土遭到入侵。唯有一支強大的軍隊才能阻止我們的敵人！"
 POR_standardization: "標準化"
 POR_standardization_desc: "我們需要創建一個標準化的系統，來使我們的生產設備能夠在生產過程中達到更高水平的效率與兼容性。"
 POR_defend_the_borders: "保衛邊境"
 POR_defend_the_borders_desc: "被入侵的危險隨時存在，而我們的領土卻擁有很長的國界線需要保衛。我們需要修建充足的防禦工事來抵禦任何可能的侵略。"
 POR_rebuild_the_lines_of_torres_vedras: "重建托雷斯韋德拉什防線"
 POR_rebuild_the_lines_of_torres_vedras_desc: "高層軍官中的一些人宣稱我們的國境線太長以致無法防禦，並建議我們重建托雷斯韋德拉什防線，為現代戰爭改造舊的防禦工事。萬一敵人擊垮了我們的第一道防線，我們就暫且撤退至里斯本。拿破崙戰爭期間我們就是這麼抵擋法國入侵的。"
 POR_corpo_do_estado_maior: "陸軍總參謀部"
 POR_corpo_do_estado_maior_desc: "軍事改革重組了陸軍總參謀部，將其作為一個研究現代戰爭的精英機構。我們必須為其投資新設施來提高他的運行效率。"
 POR_staff_wargames: "參謀軍事演習"
 POR_staff_wargames_desc: "我們必須集中訓練我們的軍官，使他們能夠充分掌握有關現代軍事作戰理論、組織、訓練和裝備的內容。"
 POR_a_royal_wedding: "皇家婚禮"
 POR_a_royal_wedding_desc: "一場葡萄牙王位的合法繼承人唐·杜阿爾特·努諾·德·布拉幹薩和巴西王位覬覦者的女兒、奧爾良王朝的瑪利亞·弗朗西斯卡公主的聯姻，將取悅葡萄牙和巴西的君主主義者們。"
 POR_the_return_of_duarte: "杜阿爾特歸來"
 POR_the_return_of_duarte_desc: "共和主義者決不會樂於接受唐·杜阿爾特·努諾·德·布拉幹薩返回葡萄牙，但這是恢復君主制的必要步驟。"
 POR_support_a_spanish_monarchy_in_the_war: "支持西班牙內戰君主派"
 POR_support_a_spanish_monarchy_in_the_war_desc: "並不是說我們對卡洛斯派有多欣賞，但理所當然地，一個君主制的西班牙會比一個法西斯主義或共產主義政權在半島上存在要好得多。我們必須支持相對而言不那麼糟的一方……"
 POR_assist_the_requetes: "援助呼嘯兵"
 POR_assist_the_requetes_desc: "我們將葡萄牙陸軍和空軍的一些成員派往西班牙，以觀察員身份介入卡洛斯派的戰爭，併為其領導人提供軍事建議。他們也將在那裡收集戰爭各方所使用戰術的信息。"
 POR_join_the_carlist_fight: "同卡洛斯派並肩作戰"
 POR_join_the_carlist_fight_desc: "確保卡洛斯派在內戰中獲勝的最好方法就是直接與呼嘯兵並肩作戰並擊潰所有在西班牙的敵對勢力。"
 POR_the_royal_iberian_alliance: "伊比利亞王室同盟"
 POR_the_royal_iberian_alliance_desc: "我們必須尋求西班牙王室的合作，以應對歐洲和其他地區的威脅。在這個動盪的時代，只有團結一致，我們才能取得勝利。"
 POR_monarchist_uprising_in_brazil: "巴西君主派崛起"
 POR_monarchist_uprising_in_brazil_desc: "支持巴西君主主義者將有助於為我們恢復巴西君主制鋪平道路。我們必須確保他們足以戰勝任何反對派。"
 POR_the_empire_of_brazil: "巴西帝國"
 POR_the_empire_of_brazil_desc: "佩德羅王子的舞臺即將開幕，他將宣稱巴西帝位，併成為巴西皇帝。"
 POR_the_empire_of_brazil_potential_civil_war_tt: "§R如果§Y巴西§R的意識形態§R不是§Y中立§R並且§Y穩定度低於50%§R或是§Y中立派支持度低於70%§R，那麼當這一國策完成時，巴西的君主主義者將會發動內戰並將我們捲入其中！§!§!§!§!§!§!§!§!§!§!"
 POR_restoration_of_the_monarchy: "君主制復辟"
 POR_restoration_of_the_monarchy_desc: "我們將宣佈葡萄牙會在唐·杜阿爾特·努諾·德·布拉幹薩的統治下重建君主制。\nViva o Rei de Portugal！葡萄牙國王萬歲！"
 POR_the_kingdom_reunited: "王國再聯合"
 POR_the_kingdom_reunited_desc: "在葡萄牙和巴西的君主制復辟之後，我們必須在我們兩國共同鬥爭的記憶尚未被遺忘之時實現我們國家的統一。\n我們將向巴西政府提交一份提案，並明確向他們表示，如果他們沒有自願簽署，那我們將被迫通過其他方式來推進此事……"
 POR_remember_olivenca: "勿忘奧利文薩"
 POR_remember_olivenca_desc: "西班牙人在許久之前否認了我們對奧利文薩的主權。現在我們將予以奪回，當然還可以連帶上附近的其他領土……"
 POR_deal_with_fascism: "處理法西斯主義"
 POR_deal_with_fascism_desc: "法西斯主義是給人類帶來悲哀和苦難的毒瘤。打倒最後的法西斯敵人的時機到了，我們將直擊它的老巢。而一旦取得勝利，我們將能夠以我們的意願重塑這個世界，一個更美好的世界。"
 POR_deal_with_fascism_tt: "獲得針對主要或相鄰法西斯主義國家的§Y吞併§!戰爭目標"
 POR_latin_america: "拉丁美洲"
 POR_latin_america_desc: "現在我們的帝國已經鞏固，已經可以放眼展望美洲領地周圍，去收回那些曾屬於巴西帝國的領土。"
 POR_the_communist_threat: "共產主義威脅"
 POR_the_communist_threat_desc: "共產黨正巧妙地在人民當中傳播他們欺騙性的理想，不僅侷限於葡萄牙，在全世界更是如此。我們必須集中精力消滅這一全球性威脅，以免遭到其內部瓦解。"
 POR_the_communist_threat_tt: "獲得針對主要或相鄰共產主義國家的§Y[GetWargoalBasedOnGovernment]§!戰爭目標"
 POR_puppet_wargoal: "傀儡（國策）"
 POR_topple_government_wargoal: "顛覆政權"
 POR_annex_wargoal: "吞併"
 POR_promote_the_monarchist_cause_in_portugal: "推進葡萄牙君主大業"
 POR_promote_the_monarchist_cause_in_portugal_desc: "我們必須鼓勵君主派在葡萄牙民眾間傳播君主主義情緒。"
 POR_kingdom_reunited_tooltip_tt: "§Y[POR.GetNameDefCap]§!和§Y[BRA.GetNameDef]§!將被稱為§Y葡萄牙及巴西帝國§!。"
 POR_spr_tooltip_country_exist_tt: "[SPR.GetFlag]§Y西班牙共和國§!存在"
 POR_spr_tooltip_at_peace_tt: "與[SPR.GetFlag]§Y西班牙共和國§!處於和平"
 POR_fascist_portugal_joins_scw_tt: "§Y法西斯主義葡萄牙§!加入[SPA.GetFlag]§Y[SPA.GetNameDef]§!對抗[GetSpanishRepublicFlagAndNameDef]的戰爭。"
 POR_iberian_workers_effect_tooltip_tt: "[POR.GetFlag]§Y[POR.GetNameDef]§!和[GetSpanishRepublicFlagAndNameDef]觸發事件§Y“伊比利亞工人聯合”§!。"
 POR_spanish_republic_tt: "[GetSpanishRepublicFlagAndNameDef]："
 POR_support_the_spanish_republic_effect_tooltip_tt: "送出§Y2000§!單位的§Y步兵裝備§!給[GetSpanishRepublicFlagAndNameDef]。優先送出過時裝備。"
 POR_Spanish_Republic_SPD: "[SPD.GetFlag]§Y[SPD.GetNameDef]§!"
 POR_Spanish_Republic_SPR: "[SPR.GetFlag]§Y西班牙共和國§!"
 POR_republican_spain_exists_tooltip_tt: "[SPR.GetFlag]§Y西班牙共和國§!存在。"
 POR_the_iberian_socialist_union_tt: "（[SPR.GetFlag]§Y西班牙共和國§!）觸發事件§Y“伊比利亞社會主義聯盟”§!。"
 POR_the_iberian_socialist_union_cores_tt: "§Y伊比利亞社會主義聯盟§!獲得整個伊比利亞半島、加那利群島和巴利阿里群島的核心。"
 POR_the_iberian_socialist_union_annex_puppets_tt: "所有西班牙的傀儡國都將被吞併。"
 POR_the_iberian_socialist_union_cosmetic_name_tt: "§Y葡萄牙§!將被稱為§Y伊比利亞社會主義聯盟§!。"
 POR_the_popular_front_bloc: "人民陣線集團"
 POR_the_popular_front_bloc_desc: "如今我們已強調了我們伊比利亞人的身份，並以[Root.GetNameDef]之名鞏固了我們的國家，我們必須進一步對外輸出共產主義理念，尋找志同道合的盟友來並肩對抗暴政與壓迫。"
 POR_the_popular_front_bloc_tt: "觸發事件§Y“葡萄牙邀請我們加入人民陣線集團”§!。"
 POR_the_popular_front_bloc_explanatory_tt: "任何獨立的歐洲§Y共產主義§!國家都將觸發事件§Y“葡萄牙邀請我們加入人民陣線集團”§!。"
 POR_latin_american_communism: "拉美共產主義"
 POR_latin_american_communism_desc: "我們必須接觸拉丁美洲人民。激勵那裡的共產黨人，並支持他們為傳播國際聯合集團理念所作的努力，我們將為美洲和歐洲社會主義者的聯盟打下基礎。"
 POR_our_comrades_overseas: "我們的海外同志"
 POR_our_comrades_overseas_desc: "我們將在那些願意加入我們集團的拉丁美洲國家之間安排一次會議。現在是向世界展示拉丁美洲和伊比利亞人民團結的時候了。"
 POR_our_comrades_overseas_tt: "任何獨立的拉美§Y共產主義§!國家都將獲得事件§Y“葡萄牙邀請我們加入人民陣線集團”§!。"
 POR_cooperate_with_french_militants: "與法國激進分子合作"
 POR_cooperate_with_french_militants_desc: "法國的同志在抵抗法西斯國家入侵法國的鬥爭中急需援助。我們必須向他們提供武器、裝備和彈藥，以使他們能夠繼續戰鬥。"
 POR_anti_fascism: "反法西斯"
 POR_anti_fascism_desc: "法西斯主義是我們事業的巨大威脅，必須被消滅掉。不論採用什麼手段，我們也必須從其魔爪之下解放全世界。"
 POR_anti_fascism_tt: "獲得針對主要或相鄰法西斯主義國家的§Y推翻政府§!戰爭目標。"
 french_focus: "法國國策樹"
 free_french_focus: "自由法國國策樹"
 POR_strengthen_the_regime: "鞏固政權"
 POR_strengthen_the_regime_desc: "當今仍有許多持不同政見者密謀反對現政權。我們將強化秘密警察，併為他們提供剷除顛覆分子組織的手段。"
 POR_the_capital_of_espionage: "間諜之都"
 POR_the_capital_of_espionage_desc: "里斯本有著無數的特工和陰謀：間諜們蒐集橫跨大西洋而來的情報、叛徒們投敵合作，而雙面間諜則向敵人傳遞假情報。我們可以利用這種情況，收集藉由我國領土傳播的信息碎片，並改進我們自己的反諜報工作。"
 POR_appease_monarchists: "安撫君主主義者"
 POR_appease_monarchists_desc: "為了贏得我國君主主義者的支持，我們必須在政府中吸納他們，並給他們一種可能會在未來恢復君主制的假象。這些妥協可以為我們提供現政權所需要的穩定和支持。"
 POR_national_gold_reserves: "國家黃金儲備"
 POR_national_gold_reserves_desc: "在這場大戰中保持中立頗有益處。交戰雙方都在為了拉攏我們和我們的商品而競爭，而如果能夠滿足他們的需求，我國的黃金儲備就能大大增加。"
 POR_concordat_with_the_holy_see: "同聖座的協定"
 POR_concordat_with_the_holy_see_desc: "我們將與梵蒂岡談判以達成一項協議。該協議旨在鼓勵教會發揮社會功能，並防止其干涉葡萄牙政治。\n\n“上帝、祖國、家庭”——安東尼奧·德·奧利維拉·薩拉查"
 POR_honor_anglo_portuguese_alliance: "履行英葡同盟"
 POR_honor_anglo_portuguese_alliance_desc: "作為世界上最古老的盟約，英葡同盟可以追溯至十四世紀。在此等重大時刻，我們將履行盟約並在大戰中援助[ENG.GetNameDef]。\n風雨同舟，休慼與共！"
 POR_proudly_alone: "傲然自立"
 POR_proudly_alone_desc: "參戰可能會使我國遭受入侵併丟掉海外領土。此外，一旦我們被捲入這場衝突，伊比利亞半島就會隨之動搖，而葡萄牙也會面臨被西班牙佔領的風險。我們必須維持中立並謀求國土安全，因為還有其他潛在威脅……"
 POR_the_eastern_menace: "東方威脅"
 POR_the_eastern_menace_desc: "[JAP.GetNameDef]在中國和東南亞之所以能獲得成功，主要是因為他們所面臨的敵人境況不佳。我們必須防止這種情況在我國東方領土再度上演。我們將鞏固我國殖民地並在[JAP.GetAdjective]動手之前先發制人。"
 POR_ditadura_militar: "軍事獨裁"
 POR_ditadura_militar_desc: "我們終於獲得了可以把薩拉查趕下臺並恢復軍事獨裁的必要支持。我們將拋棄新國家體制，並採取必需措施，以讓葡萄牙在此等命運之抉擇中走向繁榮。"
 POR_field_maneuvers: "野戰演習"
 POR_field_maneuvers_desc: "總參謀部開發了新的戰術，將有助於重新評估和更新我們最古老的陸軍學說。這是建立現代軍隊所必須的一步。"
 POR_tropas_paraquedistas: "傘兵部隊"
 POR_tropas_paraquedistas_desc: "我們將組建一支能在敵後發起進攻的精銳的步兵突擊部隊，這是寶貴的戰術優勢。"
 POR_regimento_de_comandos: "突擊團"
 POR_regimento_de_comandos_desc: "我們需要精銳的部隊，為不同的作戰情況訓練，並能在最惡劣的條件下執行任務。\n\n“勇者神佑”"
 FRA_laissez_faire_tt: "經過大約兩年的時間後，我們的經濟將變得更高效。"
 FRA_carry_the_revolution_west_tt: "獲得針對§Y西班牙§!或任何西班牙內戰殘餘的非共產主義陣營國家的§Y顛覆政權§!戰爭目標。"
 nationalist_victory: "國民軍在西班牙內戰中獲勝"
 republican_victory: "共和軍在西班牙內戰中獲勝"
