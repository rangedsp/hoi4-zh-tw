 # IMPERIAL INFLUENCE #
 JAP_imperial_influence_title_text: "[GetImperialInfluenceTypeName]"
 JAP_imperial_influence_title_text_monarchist: "帝國影響"
 JAP_imperial_influence_title_text_communist: "全國影響"
 JAP_imperial_influence_ruler_name_text: "§Y[GetImperialInfluenceRulerName]§!"
 JAP_imperial_influence_ruler_title: "[GetImperialInfluenceRulerTitle]"
 JAP_emperor_tooltip: "[GetImperialInfluenceRulerTitle][GetImperialInfluenceRulerName]。\n\n各個§Y派系§!對[GetImperialInfluenceRulerTitle]的影響力包括§R$JAP_imperial_influence_tier_1$§!、§R$JAP_imperial_influence_tier_2$§!、§R$JAP_imperial_influence_tier_3$§!和§R$JAP_imperial_influence_tier_4$§!。"
 JAP_emperor_title_text: "天皇"
 JAP_empress_title_text: "女皇"
 JAP_sessho_title_text: "攝政"
 JAP_chairman_title_text: "主席"
