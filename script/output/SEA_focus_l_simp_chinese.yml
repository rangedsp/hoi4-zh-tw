 # Democratic Path
 CHI_end_military_primacy: "結束軍事主導"
 CHI_end_military_primacy_desc: "軍隊已完成其使命，但其對權力的控制必須被打破。若[ROOT.GetName]要成為依法治國而非將領統治的國家，必須恢復文官權威。"
 CHI_accelerate_the_tutelage: "加速訓政"
 CHI_accelerate_the_tutelage_desc: "國民黨未能兌現辛亥革命和孫中山先生的承諾。他們沒有教導民眾何為民主，而是利用他們謀取私利。我們需要彌補失去的時間。"
 CHI_accelerate_the_tutelage_tt: "解鎖決議§Y加速訓政§!，覆蓋§Y中國鄉村§!的民眾"
 CHI_revive_the_new_culture_movement: "重振新文化運動"
 CHI_revive_the_new_culture_movement_desc: "無論是中共還是國民黨的早期革命者，大多受新文化運動的啟發，該運動反對清王朝與袁世凱。唯有通過新文化運動的精神，新中國才能自舊世界的灰燼中崛起！"
 CHI_revive_the_chinese_action_committee: "重建臨時行動委員會"
 CHI_revive_the_chinese_action_committee_desc: "國民黨壟斷了對軍隊的控制權，將權力集中於一小撮人手中。然而，一些有軍事經驗的異議軍官並不認同這一統治集團——儘管他們同樣反對共產黨，拒絕與他們結盟。"
 CHI_revive_the_chinese_action_committee_tt: "§Y$CHI_jiang_guangnai$§!、§Y$CHI_cai_tingkai$§!和§Y$CHI_chen_mingshu$§!成為可用的§Y陸軍將領§!"
 CHI_ally_the_young_china_party: "與中國青年黨結盟"
 CHI_ally_the_young_china_party_desc: "中國青年黨於1923年12月2日由一群旅法中國學生創立，成為僅次於國共兩黨的最重要非主流派別。他們對未來的設想有許多可取之處，不容我們忽視。我們應當立即與他們結盟！"
 CHI_invite_carsun_chang: "邀請張君勱"
 CHI_invite_carsun_chang_desc: "儘管西方列強損害了[ROOT.GetAdjective]的利益，但其中也有對我們有用的思想。張君勱在這些思想與我們的儒家語境之間架起了橋梁，他將成為民主運動的號召中心。"
 CHI_give_protection_of_civil_rights: "保障民權"
 CHI_give_protection_of_civil_rights_desc: "宋慶齡與中國民權保障同盟在1930年代初反抗國民黨的專制手段。他們開啟的事業，我們將繼續，通過將平民的權利寫入制度來延續他們的鬥爭。"
 CHI_rural_reconstruction_movement_sea: "農村復興運動"
 CHI_rural_reconstruction_movement_sea_desc: "我們的城市是充滿活力的現代化中心，但農村卻不是這樣。我們應集中力量提升農村的經濟福利與思想水平。全面發揮我們的影響力，利用發揮那些本來會被忽視的地區。"
 CHI_rural_reconstruction_movement_sea_tt: "減少§Y農村與城市訓政§!決議的移除時間§G10§!天"
 CHI_rural_reconstruction_movement_sea_2_tt: "§Y農村訓政§!決議現在還會對目標地區施加§Y$CHI_local_rural_reconstruction_modifier$§!修正"
 CHI_sino_american_joint_commission_on_rural_reconstruction: "美國農村重建援助"
 CHI_sino_american_joint_commission_on_rural_reconstruction_desc: "我們應利用在美國的關係，把村學涵蓋進鄉村工作範圍，向全國推廣完善的教育體系。"
 CHI_a_matter_of_will: "鄉村意志問題"
 CHI_a_matter_of_will_desc: "中國可以借鑑外國的思想，但基於我們的歷史，我們必須走自己的道路。這條道路要從鄉村學校奠基，從基層建立團結。"
 CHI_glorify_deng_yanda: "頌揚鄧演達"
 CHI_glorify_deng_yanda_desc: "國民黨在1911年革命後背叛了我們，以自私的逐利行為取而代之。但曾有人為平民挺身而出，開闢出不同於暴政與妥協的道路——鄧演達。他為信念殉難，我們永遠不會忘記他與他的理想。"
 CHI_apply_yandas_work: "應用鄧演達思想理論"
 CHI_apply_yandas_work_desc: "鄧演達始終希望動員群眾，為農村提供替代選擇。從村到村傳播思想，將強化我們的組織與整個國家。"
 CHI_apply_yandas_work_tt: "減少§Y農村與城市訓政§!決議的花費§G10§!"
 CHI_socialize_major_industries: "國有化主要工業"
 CHI_socialize_major_industries_desc: "我們已經允許某些個人積累過多財富與權力，導致關鍵產業落入錯誤之手。我們應將這些產業收歸國有以妥善管理。"
 CHI_a_burgeoning_welfare_state: "新興的福利國家"
 CHI_a_burgeoning_welfare_state_desc: "一個關心國民的國家擁有無與倫比的力量與韌性。借鑑德國在陷入狂熱主義之前的經驗，我們將走向更加平等的未來。"
 CHI_truly_free_speech: "真正的言論自由"
 CHI_truly_free_speech_desc: "雖然我們已經保護人們不因言論遭到迫害，但公共討論仍然狹窄。我們需要鼓勵更多人參與公共對話，讓多元的理念得以發聲並站到臺前。"
 CHI_a_control_yuan_with_teeth: "有實權的監察院"
 CHI_a_control_yuan_with_teeth_desc: "權力會腐化，所以我們需要有人監督政客。在蔣介石時期，這個機構被削弱。我們將重建它，讓其能夠全面履行使命。"
 CHI_unify_as_the_china_democratic_league: "統一為中國民主同盟"
 CHI_unify_as_the_china_democratic_league_desc: "分散的小團體無法獨自對抗國民黨，但若能統一，我們或許有機會。不過，由誰來領導是個問題。"
 CHI_continue_the_ding_xian_experiment: "繼續定縣實驗"
 CHI_continue_the_ding_xian_experiment_desc: "農村重建的定縣項目迄今由晏陽初的大眾教育運動資助，將定縣作為社會實驗室，用以探索並展示如何提升中國鄉村的生活水平、健康狀況、政治責任感與文化素質。我們應當資助這一項目，把現代化帶到農村。"
 CHI_continue_the_ding_xian_experiment_tt: "\n§Y電氣化與大眾教育§!將自§Y河北與湖南§!起逐步擴散，每隔兩個月會有一個新的核心地區獲得該修正。"
 CHI_minsheng_focus: "民生主義"
 CHI_minsheng_focus_desc: "現代國家必須照顧其公民，這樣在國家需要之時，公民才會有能力且願意保衛國家。為此，我們必須推行民生的原則，並確保全民享有福利作為一項權利。"
 CHI_minzu_focus: "民族主義"
 CHI_minzu_focus_desc: "歸屬於一個國家——而非部族或宗教——的觀念，才使一群人凝聚為一個國家。為此，我們必須推行民族的原則，確保全國人民對國家懷有強烈的民族主義與愛國心，並在中央政府領導下保持團結。"
 CHI_minquan_focus: "民權主義"
 CHI_minquan_focus_desc: "孫中山先生開創的征途，最終將通向統一的民國。這必將是一段漫長的道路，但我們會一步一步走下去。為此，我們必須推行民權的原則，並確保所有中國公民都能獲得選舉權。"
 CHI_demand_regional_adherence: "要求地方服從"
 CHI_demand_regional_adherence_desc: "既然我們能夠向中國的地方軍閥證明，我們已切實施行了三民主義，那麼現在就有機會開始施壓，迫使他們也這樣做。這最終應當能促成他們在中央政權的引導下歸附並被整合進民國。"
 CHI_demand_regional_adherence_tt: "解鎖§Y開發§!軍閥控制區域並強制其遵守三民主義原則，提升其§Y民主主義§!支持度，最終實現§Y降服與整合§!的決議。"
 CHI_zhonghua_minzu_focus: "中華民族"
 CHI_zhonghua_minzu_focus_desc: "如今，軍閥與地方督軍都已迴歸我方控制，是時候開始真正的統一，並放眼海外。許多本屬於我們的領土被民族主義暴徒與外國列強奪走，我們必須竭盡全力將其重新納入民國的照耀之下。"
 CHI_zhonghua_minzu_focus_tt: "解鎖獲得[MON.GetFlag]§Y[MON.GetAdjective]§!、[TAN.GetFlag]§Y[TAN.GetAdjective]§!和[TIB.GetFlag]§Y[TIB.GetAdjective]§!地區核心的決議"
 CHI_zhonghua_minzu_focus_2_tt: "將§Y$CHI_the_political_tutelage_dm$§!替換為§Y$CHI_the_political_tutelage_upgraded_dm$§!，效果變化："
 CHI_toward_a_socialist_economy: "邁向社會主義經濟"
 CHI_toward_a_socialist_economy_desc: "為了真正改善我們的社會，我們必須改變金錢的流向，罷免那些僅憑裙帶關係而得勢的企業主。工人將重新在國家中擁有發言權，所有[ROOT.GetAdjective]人都將平等！"
 CHI_enact_georgist_tax_reforms: "實行喬治主義稅改"
 CHI_enact_georgist_tax_reforms_desc: "喬治主義是孫中山經濟理論的基礎。他主張對持有土地徵稅。“維持政府的唯一方法，就是採用一種極其公正、合理且公平分配的稅務制度，我們必須以此為基礎建立新體系。”"
 CHI_leverage_contacts: "海外聯繫"
 CHI_leverage_contacts_desc: "我們的同胞遍佈全球，其中一些來到了美國我們在美國的聯絡人正等待我們求援之時伸出援手。"
 CHI_reach_out_for_help: "尋求援助"
 CHI_reach_out_for_help_desc: "軍國主義的陰影從東邊籠罩著中國，我們必須向我們的美國關係網求助，讓他們明白我們是抵禦日本威脅的第一道防線。"
 CHI_reach_out_for_help_tt: "§Y[USA.GetNameDefCap]§!將更有可能提供§Y租借援助§!"
 CHI_deal_with_the_shadow_elements: "處理地下勢力"
 CHI_deal_with_the_shadow_elements_desc: "國內一些陰暗集團為了私利正在毒害民眾。這不能容忍！"
 CHI_utilize_the_albazinian_contact_tt: "解鎖請求[SOV.GetNameDef]增加援助的決議"
 CHI_shifting_the_balance: "打破平衡"
 CHI_shifting_the_balance_desc: "雖然我們已得到海外支持，但多為被動。我們將請求更積極的介入，以助我們徹底擊敗日本威脅。"
 CHI_the_german_mission: "德國使團"
 CHI_the_german_mission_desc: "十餘年來我們一直與德國有聯繫，我們應該利用張君勱的關係擴大雙方合作。"
 CHI_reach_out_to_expats: "聯繫華僑"
 CHI_reach_out_to_expats_desc: "我們的人民散居海外並建立新生活。對一些人而言這似為弱點，但對我們卻是力量。在需要時我們會呼喚這些流散的同胞。"
 CHI_reach_out_to_expats_tt: "解鎖決議，利用我們的海外人脈與僑民社群，從外國獲取更多§Y每月經濟產能盈餘§!"
 CHI_invoke_the_nine_powers: "援引九國公約"
 CHI_invoke_the_nine_powers_desc: "儘管不平等條約對我們不利，但九國公約曾約定不得有國家再瓜分中國。面對日本的侵略，是時候援引這一條款了。"
 CHI_aeronautical_expertise: "航空精英"
 CHI_aeronautical_expertise_desc: "中國飛行員在太平洋彼岸贏得了當之無愧的聲譽。我們可以召他們回國，發揮他們的專長。"
 CHI_expand_the_faction: "邀請自由國家"
 CHI_expand_the_faction_desc: "和我們國內的運動一樣，亞洲的民主事業依賴許多較小的團體。我們需要將這些運動統一成更大的陣營，以對抗壓迫者。"
 CHI_pacific_entente_faction: "太平洋協約國"
 CHI_expand_the_faction_tt: "解鎖決議，邀請§Y亞洲§!和§Y大洋洲§!的§Y民主主義§!國家加入我們的陣營"
 CHI_make_a_stand_against_the_colonialists: "對抗殖民主義者"
 CHI_make_a_stand_against_the_colonialists_desc: "帝國的世紀已結束，而我們是民族自決時代的先驅。我們必須將這一簡單聲明傳達給仍抱守舊秩序的人，如果他們抗拒我們，他們就會感受到人民的憤怒。"
 CHI_make_a_stand_against_the_colonialists_tt: "解鎖§Y反殖民主義§!決議，解放殖民勢力在§Y亞洲和大洋洲§!的殖民地。"
 CHI_spreading_the_light_of_freedom: "傳播自由之光"
 CHI_spreading_the_light_of_freedom_desc: "擺脫外國威脅只是第一步，我們還必須確保國內威脅不會阻礙國家意志的落地。"
 CHI_spreading_the_light_of_freedom_tt: "解鎖決議，在§Y亞洲和大洋洲§!國家§Y挑動共和主義情緒§!"
 CHI_correct_a_historical_wrong: "糾正歷史錯誤"
 CHI_correct_a_historical_wrong_desc: "歐洲列強對世界的所作所為，已遠遠超出“不公”二字所能形容，這是人類文明的汙點。我們將糾正這一錯誤，並懲罰他們的罪行。"
 CHI_championing_the_cause_of_liberty: "捍衛自由事業"
 CHI_championing_the_cause_of_liberty_desc: "我們已經將自由的光芒帶到亞洲，成為所有重視自由與民族自決者的燈塔。"
 CHI_utilize_the_albazinian_contact: "利用與阿爾巴津人的聯繫"
 CHI_utilize_the_albazinian_contact_desc: "中華正教會現任首席輔祭西麥翁·杜潤臣主教是一位阿爾巴津人，曾遊歷中國各地，並且與許多白俄舊部保持緊密聯繫。也許他能說服俄羅斯人為我國提供援助？"
 # Wang Jingwei
 CHI_prepare_for_a_change_in_leadership: "迎接領導層更替"
 CHI_prepare_for_a_change_in_leadership_desc: "我們已在現任政府下度過十年，而[JAP.GetNameDef]的陰影仍籠罩著[CHI.GetAdjective]。是時候讓其他人掌權了。"
 CHI_prepare_for_a_change_in_leadership_tt: "§R[CHI_chiang_kaishek.GetName]在西安事變中會被替換為[CHI_wang_jingwei.GetName]§!"
 CHI_prepare_for_a_change_in_leadership_tt_2: "§R兩廣事變期間派蔣介石前往廣州將導致其提前死亡，從而可以選擇$CHI_look_for_allies$§!"
 CHI_prepare_for_a_change_in_leadership_dai_li: "§R[CHI_chiang_kaishek.GetName]在西安事變中會被替換為[CHI_dai_li.GetName]§!"
 CHI_avoid_another_crisis: "避免再次危機"
 CHI_avoid_another_crisis_desc: "1931年我們毫無準備，被[JAP.GetAdjective]軍隊突然襲擊。即使多年過去，我們仍未準備好將他們擊退，必須爭取更多寶貴時間。我們可以做出象徵性讓步以安撫[JAP.GetAdjective]人，為我們準備應對來自東方的風暴留出戰略空間。"
 CHI_avoid_another_crisis_tt: "\n將啟用通過喪權讓步來延遲日本入侵的決議。"
 CHI_lay_the_foundation_for_a_united_china: "為統一中國奠定基礎"
 CHI_lay_the_foundation_for_a_united_china_desc: "現政府是一幫只懂刀劍之力的暴徒。一個國家需要的不只是暴力，還需要在文官政府下的強大制度作為我們繼續革命的基石。"
 CHI_preempt_the_inevitable: "先聲奪人"
 CHI_preempt_the_inevitable_desc: "我們知道[JAP.GetNameDef]正逼近，他們以為我們軟弱可欺。若我們先發制人，他們將大吃一驚。"
 CHI_utilize_german_contacts: "利用德國人脈"
 CHI_utilize_german_contacts_desc: "儘管東方野蠻人嗜血成性，但其中有人能夠講道理——只是不會聽我們說。我們應聯繫在歐洲的共同友人，請他們平息激進派的情緒。"
 CHI_utilize_german_contacts_tt: "如果我們接受[GER.GetAdjective]關於反蘇條約的要求，那麼[GER.GetNameDef]更有可能為我們出面干預。"
 CHI_utilize_german_contacts_wang_tt: "我們將通過[CHI.GetLeader]的關係獲得："
 CHI_look_for_allies: "尋找內部盟友"
 CHI_look_for_allies_desc: "蔣介石已掌控黨權近十年，但仍有一些人沒有支持他。我們必須尋找並團結這些人，形成有力的反對派。"
 CHI_infiltrate_the_examination_yuan: "滲透考試院"
 CHI_infiltrate_the_examination_yuan_desc: "國家不是靠少數人運轉的，而是依賴大批公務員的辛勤工作。如果我們能滲透到負責審查這些人員資格的機構，將極大有利於我們的運動。只要確保這些人員與我們立場一致，我們就能形成一支不可阻擋的力量。"
 CHI_take_control_of_the_executive_yuan: "控制行政院"
 CHI_take_control_of_the_executive_yuan_desc: "制定法律者擁有權力，但執行法律者可以超越他們。若我們的人能進入各部任職，就能在各個層面反制“蔣介石主義”。"
 CHI_take_control_of_the_executive_yuan_tt: "當一個新軍閥被傀儡化時，每個現有的軍閥傀儡都會獲得：§Y[?executive_yuan_autonomy_ratio|%]§!自治比例"
 CHI_our_people_in_the_legislative: "在立法院暗插人手"
 CHI_our_people_in_the_legislative_desc: "在蔣介石的統治下，現行制度已被削弱。一個強人取代了強大的中央權力，我們必須反擊。我們將重寫部分自治權，以加強國家核心。"
 CHI_clear_out_sycophants: "掃清馬屁精"
 CHI_clear_out_sycophants_desc: "暴君滋生唯唯諾諾之徒，統治時間越長，他們就越多。雖然我們名義上掌控著立法權和行政權，但仍有許多人持有舊觀念。我們應確保那些從舊政權獲益的人被放到合適的位置上。"
 CHI_impair_the_control_yuan: "削弱監察院"
 CHI_impair_the_control_yuan_desc: "制衡機制是一個健康政體的重要因素，但它們也可能拖慢進步。若監察院的權力不如一些人期望的那樣強而有力，它就無法阻礙我們的事業。"
 CHI_impair_the_control_yuan_tt: "升級§Y整合努力決議§!，用於："
 CHI_impair_the_control_yuan_tt_2: "480天$instead_of$365天"
 instead_of: "而非："
 and_last_for: "並持續："
 CHI_appoint_sympathetic_judges: "任命志同道合的法官"
 CHI_appoint_sympathetic_judges_desc: "有了關鍵位置的法官，我們就能將權力向下、向外擴大到各省。"
 CHI_appoint_sympathetic_judges_tt: "每個未來的軍閥附屬也會在被傀儡時獲得下列精神："
 CHI_close_whampoa: "關閉黃埔軍校"
 CHI_close_whampoa_desc: "黃埔軍校一直是蔣介石的私人地盤與其意識形態的溫床。此校不可留存，必須將其關閉，並追查所有與之有聯繫的人。"
 CHI_close_whampoa_tt: "剩餘各將領將獲得：§G+3§!隨機分配的屬性點。"
 CHI_censure_the_opposition: "鉗制反對派"
 CHI_censure_the_opposition_desc: "監察院已經勢弱，但如果我們能完全掌控它，就能糾正不良因素。對適當行為的反饋可以作為一種矯正措施。"
 CHI_the_freedom_to_abject: "墮落的自由"
 CHI_the_freedom_to_abject_desc: "一個不允許批判的體制永遠無法成長和發展。有人曾曝光那些損害[CHI.Getadjective]人民以公肥私的歪門邪道，但一直以來都被我們忽視。我們需要建立在不動搖根基的前提下讓人們能指出體制缺陷的流程。"
 CHI_expropriate_industrialists: "徵用實業家資產"
 CHI_expropriate_industrialists_desc: "蔣介石的走狗依附於這樣一個腐敗的人，獲益匪淺，聚斂了大量財富。個人的私利不能凌駕於黨之上，這種情況必須糾正。我們將把本屬於國家的財產收回。"
 CHI_politicise_the_process: "政治化程序"
 CHI_politicise_the_process_desc: "作為一名公務員，理解自己的政治責任至關重要。並非所有人都能明白這一點，因此必須加以教育。我們將重新制定所有公務員的教育與考核制度，使他們切實掌握這些知識。"
 CHI_a_functioning_bureaucracy_first: "高效官僚體系優先"
 CHI_a_functioning_bureaucracy_first_desc: "雖然掌握國家機器極其重要，但如果國家本身都不存在，那便毫無意義。允許各機構在一定程度上自治，並鼓勵合適的人才依靠才能而非正確的政治理念晉升，從長遠來看將有益於我們。"
 CHI_extend_jurisdiction_to_the_provinces: "將管轄權擴大至省級"
 CHI_extend_jurisdiction_to_the_provinces_desc: "[ROOT.GetRulingParty]在控制大城市和中央機構方面已經做得不錯，但在邊緣地區我們可以做得更好。擴大我們的權力，將為統一中國與抵禦[JAP.GetAdjective]的攻勢發揮巨大作用。"
 CHI_affirm_civilian_primacy: "確立文官優先"
 CHI_affirm_civilian_primacy_desc: "蔣介石以軍隊為權力基礎，但我們知道軍官們的思想可能被說服去做很多事，其中少有對我們有利的。我們必須確保武裝部隊明白，他們應當服從文官的領導。"
 CHI_proclaim_a_new_chapter: "宣告新篇章"
 CHI_proclaim_a_new_chapter_desc: "之前的政權一向自詡是自由與民主的力量，實際上卻只是渴求權力。隨著汪精衛權力的鞏固，我們現在可以宣佈，文官政府已經重新掌握了權力的韁繩。"
 CHI_negotiate_the_nine_powers_treaty: "協商九國公約"
 CHI_negotiate_the_nine_powers_treaty_desc: "清廷曾向西方列強屈服，十九世紀的那些條約如同過去的幽靈，至今仍籠罩著中國。我們將與這些條約的簽署國接觸，尋求平等地解決分歧，而非以僕從的身份。"
 CHI_start_looking_outwards: "開眼看世界"
 CHI_start_looking_outwards_desc: "過去的錯誤在於以為我們可以與世界隔絕。殖民列強連同亞洲其他地區一起將我們肢解，使我們蒙羞，這筆血債不能不償。我們將組織全亞洲團結一致，共同壯大力量。"
 CHI_start_looking_outwards_tt: "我們將能夠邀請自由的亞洲國家加入我們的陣營"
 CHI_liberate_the_peoples_of_asia: "解放亞洲各民族"
 CHI_liberate_the_peoples_of_asia_desc: "如同數百年前一樣，亞洲其他地區仍在仰望我們，我們也將作出回應。我們會幫助他們反抗帝國主義，贏得自由，併為他們的同胞復仇。"
 CHI_liberate_the_peoples_of_asia_tt: "我們會獲得針對在§Y$asia$§!擁有殖民地或傀儡國的所有國家的戰爭目標"
 CHI_liberate_the_peoples_of_asia_tt_2: "解鎖在§Y$asia$§!建立傀儡政權的決議"
 CHI_punish_the_signatories: "懲罰公約簽署國"
 CHI_punish_the_signatories_desc: "西方列強對我國造成的損害無法估量，使我們一蹶不振。他們必須明白自己做了什麼，並開始償還他們的歷史債務。"
 CHI_bring_the_revolution_further: "遠揚革命"
 CHI_bring_the_revolution_further_desc: "我們的解放之路超出了以往的想像。我們將把自由之光傳播到整個太平洋，把殖民者進一步擊退。"
 CHI_bring_the_revolution_further_tt: "我們會獲得針對在§Y$Australia$§!擁有殖民地或傀儡國的所有國家的戰爭目標："
 CHI_bring_the_revolution_further_tt_2: "我們的陣營宣言也會包括§Y$Australia$§!\n解鎖在§Y$Australia$§!建立傀儡政府的決議"
 CHI_end_the_humiliation: "終結國恥"
 CHI_end_the_humiliation_desc: "我們終於再次屹立為世界大國，正如數百年前那樣。受人仰慕，影響深遠，實力雄厚，我們已凌駕於其他國家之上，把壓迫者永遠趕進歷史的塵埃，不再蒙羞！"
 # Chiang Kai-shek
 CHI_dang_guo: "黨國"
 CHI_dang_guo_desc: "黨的目標一直是將民主帶到我們的國家，但在當前這種不確定的時期，國民黨必須高效運作。因此，我們必須暫時將黨置於國家之上。"
 CHI_denounce_feudalism: "譴責封建主義"
 CHI_denounce_feudalism_desc: "雖然我們宣稱具有革命性質，但黨內依然有人行事如舊社會的地主與精英。這些舊封建分子必須面對他們的反革命行為，並加以清算。"
 CHI_denounce_feudalism_tt: "每有一個軍閥附庸，我們每月將獲得§G+[?warlord_subjects_pp_gain_base]§!點政治點數。"
 CHI_one_nation_undivided: "一國一體"
 CHI_one_nation_undivided_desc: "將各省統一於一個不可分割的權威之下，將克服地區分裂，併為建設一個強大而自豪的國家奠定基礎。屆時，我們將能抵禦一切內外威脅。"
 CHI_one_nation_undivided_tt: "將邀請除[PRC.GetName]和[HBC.GetName]以外的所有軍閥加入統一戰線陣營"
 CHI_one_nation_undivided_bypass_tt: "§Y每個中國軍閥§!：必須滿足以下之一：\n  不存在\n  與§Y[ROOT.GetNameWithFlag]§!交戰\n  是§Y[ROOT.GetNameWithFlag]§!附屬國\n  與§Y[ROOT.GetNameWithFlag]§!處於同一陣營\n  §Y[ROOT.GetName]§!：對其擁有§Y戰爭目標§!"
 CHI_decree_the_end_to_corruption: "終結腐敗"
 CHI_decree_the_end_to_corruption_desc: "腐敗從政府最高部長到軍隊的新兵已經蔓延成風。我們必須剷除這些貪婪腐敗的官員，建立一個廉潔的行政體系。"
 CHI_reinforce_connections_with_shanghai_elites: "加強與上海精英的紐帶"
 CHI_reinforce_connections_with_shanghai_elites_desc: "在上海，有一批人擁有巨大的財富與權力，這些是他們通過黑暗的手段而積累起來的。倘若我們加以利用，將可能對我們的事業大有裨益。"
 CHI_introduce_the_baojia_system: "引入保甲制度"
 CHI_introduce_the_baojia_system_desc: "保甲制度自古以來被用於組織民眾與保障安全，且已被證明極為高效。我們應將其擴展為徵兵制度的基礎，從而確保穩定的兵源。"
 CHI_expand_the_tongzi_jun: "擴大童子軍"
 CHI_expand_the_tongzi_jun_desc: "青年團的隊伍可以培養新一代忠誠而有紀律的公民。一定程度的軍事訓練也將幫助他們順利進入軍隊服役。"
 CHI_demonstrate_our_resolve: "展現決心"
 CHI_demonstrate_our_resolve_desc: "世界已經輕視我們太久了。是時候在全世界面前擊敗這場殘酷的侵略，證明我們的價值"
 CHI_arrest_the_seven_gentlemen: "逮捕七君子"
 CHI_arrest_the_seven_gentlemen_desc: "儘管在中國幾乎沒有人贊同日本的侵略，但國人的應對方式卻是一個分裂性問題。我們不能允許在這些事務上存在與我們競爭的力量，因此必須在這些問題上展示我們的主導地位。"
 CHI_develop_counterinsurgency_tactics_tt_2: "將使§Y$CHI_counter_infiltration_measures$§!的成本變為§G25%§!"
 CHI_take_a_stance_on_illicit_trade: "打擊非法貿易"
 CHI_take_a_stance_on_illicit_trade_desc: "長期以來，我們一直受制於滲入社會的毒素以及操縱它的人。我們必須拒絕它的誘惑，以更加堅韌、更加清醒的姿態邁入繁榮的新世紀。"
 CHI_reshuffle_the_green_gang: "整頓青幫"
 CHI_reshuffle_the_green_gang_desc: "“大耳杜”曾為我們效力，但如今勢力膨脹，在敵人環伺之際，我們需要更直接的行動。或許是時候讓青幫換一位掌舵人了。"
 CHI_legitimise_du: "杜月笙轉正"
 CHI_legitimise_du_desc: "有人建議我們遠離那些以非傳統方式謀生的人，但這或許只是浪費了一種寶貴的資源。我們應當看看，如果杜月笙不必在暗處行事，他能為我們做些什麼。"
 CHI_inspect_the_troops: "檢閱部隊"
 CHI_inspect_the_troops_desc: "進行嚴格的監察，以將軍隊牢牢團結在黨與[root.GetLeader]周圍。我們光榮的軍隊將引領我們走向未來。"
 CHI_secure_the_soviet_border: "確保蘇聯邊境安全"
 CHI_secure_the_soviet_border_desc: "北方的俄國熊長期插手我國內政，令我們心煩。我們應當與[SOV.GetNameDef]建立正式關係，甚至從中謀取更多利益，以穩固北方防線。"
 CHI_secure_the_soviet_border_tt: "§R未來事件中，我們將能看到可供選擇的裝甲設計師。§!"
 CHI_send_the_first_lady_abroad: "派第一夫人出訪"
 CHI_send_the_first_lady_abroad_desc: "仍有人願意在侵略面前支持我們，但他們現在態度曖昧。我們應當派出第一夫人去說服他們，讓他們明白我們雖浴血奮戰、肩負戰爭重擔，但終將取得勝利。"
 CHI_take_advantage_of_dus_contacts: "利用杜月笙的人脈"
 CHI_take_advantage_of_dus_contacts_desc: "青幫頭目在各地都有朋友，並掌握罕有人具備的門路。如果能妥善利用，這張網絡將對我們大有裨益，即使這會讓一些見不得光的人得利。"
 CHI_draw_support_from_the_big_families: "爭取大家族支持"
 CHI_draw_support_from_the_big_families_desc: "中國在不同領域中有幾大家族勢力。儘管這未必有助於穩定國家，但這些關係仍可被利用來推進我們的目標。"
 CHI_prosecute_cronyism: "檢舉裙帶關係"
 CHI_prosecute_cronyism_desc: "個人利益長期凌駕於國家需求之上。裙帶關係、賄賂與貪汙正在撕裂我們的社會結構。這一切到此為止，一個崇尚美德的新紀元正在召喚！"
 CHI_crack_down_on_illicit_goods: "打擊非法商品"
 illicit_good_improvement_increase: "§Y非法貿易§!的清除速度每§Y6個月§!提高§G+2%§!"
 which_will_give_tt: "將給予："
 CHI_crack_down_on_illicit_goods_desc: "長久以來，我們一直受到毒害和販毒者的擺佈。我們必須抵制它的誘惑，以更強大、更清醒的姿態迎接繁榮的新世紀。"
 CHI_turn_a_blind_eye: "睜一隻眼閉一隻眼"
 CHI_turn_a_blind_eye_desc: "必須承認，某些非官方貿易正對中國社會的構成產生不利影響。然而，這種貿易帶來的利潤也不容忽視，如果我們放任不管，或許能獲得巨大的財富。"
 CHI_weaponise_the_hongmen: "武裝幫派"
 CHI_weaponise_the_hongmen_desc: "在我們的港口地區，已經有秘密社團接受過自衛訓練。我們可以將他們投入抗敵一線。只要給予足夠支持，他們將能對任何膽敢侵犯我國的入侵者造成巨大破壞。"
 CHI_weaponise_the_hongmen_tt: "每個被佔領的中國沿海地區及包含大型城市的地區：\n抵抗：§R+30.0%§!。"
 CHI_facilitate_operation_zet: "促成Zet行動"
 CHI_facilitate_operation_zet_desc: "我們瞭解到，[SOV.GetNameDef]對[JAP.GetNameDef]在東亞採取的強硬姿態感到不安。他們願意向我們提供物資支援和志願者。我們所需做的，就是做好接收援助的準備。"
 CHI_from_many_to_one: "合眾為一"
 CHI_from_many_to_one_desc: "我們這個國家人口眾多，但最近卻因不同意見而分裂對立。若要抵禦外敵侵略並最終生存下來，我們必須團結一致，朝著共同的目標奮進。"
 CHI_from_many_to_one_tt: "每個我方陣營中的軍閥獲得§G+1.5%§!穩定度"
 CHI_from_many_to_one_faction_tt: "陣營章程履行進度低時，將添加§G+20.0%§!$MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$。\n陣營章程履行進度為高時，將添加§G-10.0%§!$MODIFIER_AUTONOMY_GAIN_WARSCORE$。"
 CHI_request_soviet_advisors: "請求蘇聯顧問"
 CHI_request_soviet_advisors_desc: "近幾十年來，戰爭發生了根本性變化，而我們卻已落後。[SOV.GetNameDefCap]提出派遣有資歷的專家來協助我們提升裝甲方面的研發工作，我們應當接受這一提議。"
 CHI_the_northwest_highway: "西北公路"
 CHI_the_northwest_highway_desc: "我們與[SOV.GetnameDef]有漫長的邊界，按理說兩國間應有充足機會運輸物資而不受干擾。然而，途徑區域嚴重缺乏基礎設施。我們應當致力於建設一條遠離前線的路線，這樣我們就能從[SOV.Getadjective]朋友那裡接收更多援助。"
 CHI_collaborate_with_allied_forces: "與盟軍合作"
 CHI_collaborate_with_allied_forces_desc: "我們同[JAP.GetAdjective]的威脅進行著漫長而艱苦的抗爭，但如今我們不再孤軍奮戰。為了能協同作戰，我們應進一步整合武裝力量，這必將帶來最終的勝利。"
 CHI_collaborate_with_allied_forces_tt: "解鎖成立X和Y部隊的決議，這將創建新的陸軍師。"
 CHI_scout_for_air_experts: "物色航空專家"
 CHI_scout_for_air_experts_desc: "我們的空軍尚處於初創階段，諸多挑戰均需艱苦應對。我們將藉助他人的專業技能，助力空軍發展。"
 CHI_sell_lend_lease: "出售租借物資"
 CHI_sell_lend_lease_desc: "為部隊獲得裝備總是有用的，但所提供的東西未必是我們所需的。不過，總有些需要裝備的地方，這意味著它總是有市場的。"
 CHI_sell_lend_lease_tt: "如果我們有§Y$CHI_soviet_support$§!，每月將獲得：§Y+100$CIC_BANK_HEADER$§!\n\n如果我們有§Y$CHI_american_support$§!，每月將獲得：§Y+150$CIC_BANK_HEADER$§!\n\n"
 CHI_international_instructors: "國際教官團"
 CHI_international_instructors_desc: "飛行員與機組人員的需求無窮無盡，我們無法足夠快地訓練他們。邀請更多外國援助將加快我們讓更多戰機升空的步伐。"
 CHI_allocate_lend_lease: "分配租借援助"
 CHI_allocate_lend_lease_desc: "目前中國有多個權力中心，但只有一個能代表國家對外發聲。我們可以利用這一優勢，決定誰能獲得支持，從而施加影響。"
 CHI_allocate_lend_lease_tt: "解鎖用§Y步兵裝備§!減少軍閥附庸自治度的決議"
 CHI_burma_campaign: "緬甸戰役"
 CHI_burma_campaign_desc: "我們的盟友陷入苦戰，[JAP.GetNameDefCap]已持續推進至控制緬甸部分地區。我們要證明自己不僅是敵人的牽制力量，更是能給予敵人致命一擊的可靠盟友。"
 CHI_burma_campaign_trigger: "[BRM.GetName]已有至少一塊領土被敵國控制"
 CHI_indo_chinese_campaign: "中南半島戰役"
 CHI_indo_chinese_campaign_desc: "我們與東南亞有歷史悠久的羈絆，今天又翻開了新的篇章。我們將從[671.controller.GetNameDef]手中奪回該區域，讓盟軍能自由行動。"
 CHI_international_squadron: "邀請飛虎隊"
 CHI_international_squadron_desc: "海外朋友已組織志願飛行員，併購置了多架現代化飛機支援我們的戰爭努力。我們應當張開雙臂歡迎他們的行動。"
 CHI_form_the_chinese_womens_national_war_relief_society: "為貧苦婦女開辦學校"
 CHI_form_the_chinese_womens_national_war_relief_society_desc: "許多人在反抗帝國主義的鬥爭中失去了很多，我們必須照顧他們的需求。中國婦女慰勞自衛抗戰將士總會已取得可喜成效，應當擴大規模以提高效率。"
 CHI_towards_a_professional_army: "邁向職業軍隊"
 CHI_towards_a_professional_army_desc: "我們的軍隊規模龐大，但其效能值得懷疑。德國軍事顧問團建議我們縮減軍隊規模，集中建設一支規模更小、裝備精良、士氣高昂且作戰效率更高的部隊。"
 CHI_towards_a_popular_army: "邁向國民軍隊"
 CHI_towards_a_popular_army_desc: "我軍缺乏裝備與訓練，但我們有充足的人力。我們要讓外國侵略者撞上國民革命軍這道由無數士兵鑄成的鋼鐵長城。"
 CHI_the_hanoi_route: "河內通道"
 CHI_the_hanoi_route_desc: "我國東部港口易受[JAP.GetNameDef]威脅，我們需要採取預防措施。從昆明下山進入河內周邊叢林雖路途艱難，但能為我們的運輸提供喘息之機。"
 CHI_form_saco: "組建中美特種技術合作所"
 CHI_form_saco_desc: "要想取勝，就必須瞭解敵人。美國人提議成立“中美合作所”，以共享情報並幫助訓練我們的游擊部隊。"
 CHI_the_burma_road: "滇緬公路"
 CHI_the_burma_road_desc: "外國盟友已表現出物資支援的意願，但隨著[JAP.GetName]的軍事壓力逐漸加劇，物資運輸變得困難重重。通過緬甸建立運輸路線，將使我們能從西南方向獲得更多物資。"
 CHI_the_hump_sea: "駝峰航線"
 CHI_the_hump_sea_desc: "火車、卡車與船舶在運送物資方面固然重要，但未來在於天空。若我們有熟練的飛行員，就能飛越喜馬拉雅山，降落在雲南，使運輸無可阻擋。"
 CHI_women_in_the_war_effort: "戰時新女性"
 CHI_women_in_the_war_effort_desc: "自五四運動以來，女性在社會中的角色發生了永久性改變，她們擁抱現代性並熱愛自己的國家，理應也能夠做出貢獻。將她們組織成婦女營並納入武裝部隊將對我們大有裨益。"
 CHI_the_sky_cannot_have_two_suns: "天無二日"
 CHI_the_sky_cannot_have_two_suns_desc: "共產主義顛覆威脅著中國社會的根基。只有證明我們的至高地位並消滅他們，中國才能在一面旗幟下生存。兩輪紅日可以同時西沉，但拂曉時只能有一輪升起。"
 CHI_the_sky_cannot_have_two_suns_tt: "我方陣營中的每個共產主義軍閥：\n   增加：§Y-10.00%§!陣營影響力"
 CHI_preemptive_strike: "先發制人"
 CHI_preemptive_strike_desc: "我們的內敵日益猖獗，圖謀顛覆我們的權威。我們不能再等著有人在中國奪權，必須主動出擊，先發制人！"
 CHI_preemptive_strike_tt: "我們將獲得針對所有未加入[ROOT.GetFactionName]或拒絕成為我方附庸的[CHI.GetAdjective]軍閥的§Y$annex_everything$§!戰爭目標。"
 CHI_tour_the_north: "視察華北"
 CHI_tour_the_north_desc: "這些靠近腹地的山區已成為共產主義煽動的中心。這種情況不能繼續下去，我們應當巡視各省，彰顯我們的存在。"
 CHI_unlock_faction_goal_north_subjugated_tt: "如果這是首次選擇的巡迴國策，則將解鎖陣營目標§Y$faction_goal_north_subjugated_name$§!。"
 CHI_tour_the_west: "視察華西"
 CHI_tour_the_west_desc: "這裡是山地與沙漠之地，昔日絲綢之路的所在，遠離權力中樞。[SOV.GetNameDefCap]一直在該地區擴張影響，我們將確保當地權勢人物明白他們應當關注何處。"
 CHI_unlock_faction_goal_west_subjugated_tt: "如果這是首次選擇的巡迴國策，則將解鎖陣營目標§Y$faction_goal_west_subjugated_name$§!。"
 CHI_tour_the_south: "視察華南"
 CHI_tour_the_south_desc: "中國南部是多元而充滿活力的地方，往往也是通向世界的窗口。我們的政黨正是在這裡誕生的，而近來該地的自治傾向增強，這是我們必須逆轉的趨勢。我們應當造訪這些省份！"
 CHI_unlock_faction_goal_south_subjugated_tt: "如果這是首次選擇的巡迴國策，則將解鎖陣營目標§Y$faction_goal_south_subjugated_name$§!。"
 CHI_ma_clique_integration_cost: "減少[XSM.GetNameDef]、[GSM.GetNameDef]和[NXM.GetNameDef]的整合成本§G[?ma_clique_integration_cost_reduction|%G0]§!"
 CHI_warlord_integration_cost_reduction: "減少§Y說服軍閥成為附庸國§!花費的£GFX_influence_texticon §G-5%§!，£pol_power §G-50§!"
 CHI_shx_integration_cost: "減少[SHX.GetNameDef]的整合成本§G[?shx_integration_cost_reduction|%G0]§!"
 CHI_snd_integration_cost: "減少[SND.GetNameDef]的整合成本§G[?snd_integration_cost_reduction|%G0]§!"
 CHI_khm_integration_cost: "減少[KHM.GetNameDef]的整合成本§G[?khm_integration_cost_reduction|%G0]§!"
 CHI_sik_integration_cost: "減少[SIK.GetNameDef]的整合成本§G[?sik_integration_cost_reduction|%G0]§!"
 CHI_sic_integration_cost: "減少[SIC.GetNameDef]的整合成本§G[?sic_integration_cost_reduction|%G0]§!"
 CHI_yun_integration_cost: "減少[YUN.GetNameDef]的整合成本§G[?yun_integration_cost_reduction|%G0]§!"
 CHI_gxc_integration_cost: "減少[GXC.GetNameDef]的整合成本§G[?gxc_integration_cost_reduction|%G0]§!"
 CHI_gdc_integration_cost: "減少[GDC.GetNameDef]的整合成本§G[?gdc_integration_cost_reduction|%G0]§!"
 CHI_victory_over_the_invaders: "戰勝侵略者"
 CHI_victory_over_the_invaders_desc: "外國侵略者被擊敗，我們光榮的國民革命軍取得勝利。這場戰爭——更重要的是我們可敬的領袖[root.GetLeader]——已將分散的省份與人民凝聚成青天白日旗下的統一國家！"
 CHI_remove_guerilla_decisions_tt: "§R移除§!§Y$PRC_guerilla_warfare_sea_cat$§!決議"
 CHI_petition_territorial_restoration: "恢復領土的請願"
 CHI_request_territory_trigger_tt: "任何控制的地區：\n      是§Y[ROOT.GetNameWithFlag]§!的核心\n      控制者：$is_literally_china_tt_NOT$\n      必須滿足以下條件之一：\n         不由控制者擁有\n         控制者：\n            當前控制的政黨是§Y[ROOT.GetRulingIdeology]§!" #The weird indentations are deliberate and is there to make the tooltip look like the real deal!
 CHI_petition_territorial_restoration_desc: "$PRC_restore_territorial_integrity_desc$"
 CHI_crush_the_communists: "消滅[PRC.GetNameDef]"
 CHI_crush_the_communists_desc: "徹底消滅[PRC.GetNameDef]的時機已經到了——這個我們多年以來的願望！我們被其他事務分散精力太久了，絕不再容忍這個麻煩繼續存在！"
 CHI_request_handover_of_coastal_cities: "請求移交沿海城市"
 CHI_request_handover_of_coastal_cities_desc: "$PRC_dare_to_struggle_desc$"
 CHI_ncns_request_handover_of_coastal_cities: "$CHI_request_handover_of_coastal_cities$"
 CHI_ncns_request_handover_of_coastal_cities_desc: "$PRC_dare_to_struggle_desc$"
 CHI_a_generalissimo_for_all_of_china: "全中國的委員長"
 CHI_a_generalissimo_for_all_of_china_desc: "我們與外國侵略者的鬥爭如同皮膚之疾，而國內的威脅才是心腹之患。如今我們已經解決了這一疾病，可以開始憧憬未來。"
 CHI_empower_the_mtac: "賦權蒙藏委員會"
 CHI_empower_the_mtac_desc: "[ROOT.GetNameDef]的社會正走向和諧，但工作尚未完成。蒙古與西藏事務委員會負責處理境內相關民族事務，但其職責可進一步擴大。我們要把革命帶給海外的兄弟！"
 CHI_empower_the_mtac_tt: "解鎖獲得[MON.GetFlag]§Y[MON.GetAdjective]§!和[TIB.GetFlag]§Y[TIB.GetAdjective]§!地區核心的決議。"
 CHI_unify_the_admissions_process: "統一招生流程"
 CHI_unify_the_admissions_process_desc: "我們的高等教育分散在多個地點，申請流程雜亂無章。如果將流程重構為一場統一的入學測驗，我們就能確保每個合格的學生都獲得一個名額。"
 CHI_retreat_to_taiwan: "撤退至臺灣"
 CHI_retreat_to_taiwan_desc: "我們與[PRC.GetNameDef]重啟的戰事進展不利，我們正在節節敗退。越來越多的人公開表示擔憂，主張我們應戰術性撤退至臺灣，以重整旗鼓保存實力。"
 CHI_joining_the_international_community: "國際社會"
 CHI_joining_the_international_community_desc: "我們太久以來目光只向內，給了他人剝削我們的機會。如今我們必須走向世界，與那些在我們最危急時刻支持我們、同樣為自由而奮鬥的人並肩作戰！"
 CHI_a_world_freed_from_communism: "沒有共產主義的世界"
 CHI_a_world_freed_from_communism_desc: "法西斯主義已將世界推入戰火，但威脅世界的並非只有這種意識形態。我們必須完成在本國開始的使命，將這些邪惡思想從世界上徹底剷除！"
 CHI_reclaim_the_north: "收復北方"
 CHI_reclaim_the_north_desc: "過去，出於形勢所迫，我們不得不放棄對北方大片領土的主權要求。但時過境遷，如今我們自身實力已空前增強——是時候重新奪回北方故土！"
 CHI_subjugate_korea: "$PRC_subjugate_korea$"
 CHI_subjugate_korea_desc: "$PRC_subjugate_korea_desc$"
 # Fascist Branch
 CHI_strengthening_our_resolve: "凝聚意志"
 CHI_strengthening_our_resolve_desc: "舊派系之間爭吵不休，而現有領導層的力量不足以將我們團結起來。我們必須改變方向，因為民國必須維繫統一，絕不可分裂解體。"
 CHI_china_reborn: "中國重生"
 CHI_china_reborn_desc: "舊思想導致了我們被帝國主義剝削，因此必須從根本上改變我們的路線。我們將發起一系列活動，用新的觀念重塑社會，這就是“新生活運動”。"
 CHI_co_opt_the_koh_hsin_movement: "拉攏革新運動"
 CHI_co_opt_the_koh_hsin_movement_tt: "共產主義反滲透花費減少§G25%§!"
 CHI_co_opt_the_koh_hsin_movement_desc: "黨已經變得過於官僚與腐敗，我們必須清除腐爛的元素。採取更強硬的路線不僅有益，而且對國家生存至關重要！"
 permanently_protected_from_infiltration: "地區不可被共產主義勢力滲透。"
 CHI_mend_the_rift_with_hu: "修復湯山事件"
 CHI_mend_the_rift_with_hu_desc: "[ROOT.GetLeader]與胡漢民之間的宿怨已長期削弱了黨的實力。他擁有勢力，意味著他手中握有相當的影響力，若我們能夠團結，將有利於國家。"
 CHI_revive_the_western_hills_group: "重建西山會議派"
 CHI_revive_the_western_hills_group_desc: "[ROOT.GetNameDefCap]長期受外國勢力影響。我們需要回歸傳統，而林森與戴季陶正堅持這一立場。這將讓我們實現孫中山先生的正統理念。"
 CHI_reform_the_blue_shirts: "改革藍衣社"
 CHI_reform_the_blue_shirts_desc: "三民主義力行社，也稱“藍衣社”，活躍已近五年，但它的作用很有限。這是因為它尚未在民眾中普及，未能發揮其全部潛力。通過把該組織改造為大眾戰線，我們將在共產主義者的領域與之競爭。"
 modify_blue_shirts: "§Y$CHI_blue_shirt_society$§!追加效果："
 CHI_empower_the_bureau_of_investigation_and_statistics: "賦權軍統局"
 CHI_empower_the_bureau_of_investigation_and_statistics_desc: "自古以來，知己知彼方能制勝。我們需要一個能夠為我們獲取情報的組織，因此應擴充國民政府軍事委員會調查統計局的職能。"
 CHI_revise_the_national_curriculum: "修訂全國課綱"
 CHI_revise_the_national_curriculum_desc: "在一個幅員遼闊的國家中，存在多種立場不足為奇。我們可以通過組織教育體系來規範這些立場，並培養特定行為。"
 CHI_target_upper_society: "瞄準上層社會"
 CHI_target_upper_society_desc: "社會上層過於沉迷於國際化的休閒娛樂，拋棄了正當的價值觀，他們本應為普通民眾樹立道德與美德生活的榜樣。一旦良好榜樣形成，我們便可通過精神復興提升整個民族，超越單純的物質財富。"
 CHI_outlaw_opposition_parties: "取締反對黨派"
 CHI_outlaw_opposition_parties_desc: "國民黨已主導政壇近十年，但反對黨仍被允許存在。我們擔心國家正處於十字路口，必須限制反對派，直到我們解決[JAP.GetNameDef]與共產主義者的問題。"
 CHI_seek_out_western_fascist_cooperation: "尋求西方合作"
 CHI_seek_out_western_fascist_cooperation_desc: "由於過去外國勢力的干涉，我們在技術發展上已經落後。無論這想法多麼令人反感，尋求與那些同情我們事業的西方國家合作或許是個明智之舉。我們或許能借此趕上他們，甚至超越他們……"
 CHI_a_chapter_in_every_village: "村村有分社"
 CHI_a_chapter_in_every_village_desc: "我們的藍衣社在城市中取得了成功，但大多數人生活在農村。我們必須壯大該組織，使其遍佈每一個城鎮、村莊與小村落。"
 CHI_secure_the_northern_front: "保衛北方戰線"
 CHI_secure_the_northern_front_desc: "我們已經把東北拱手讓給了日本，他們是我們最強大、最危險的鄰國。我們必須確保北方邊境的安全，以密切關注日本，確保他們不會生出進一步向南擴張的念頭……"
 CHI_a_party_unified: "全黨精誠"
 CHI_a_party_unified_desc: "憑藉紀律、道德與美德，我們在黨內鑄就了團結。爭吵與分裂已成過去，我們在青天白日旗之下前進，向著對內外敵人的最終勝利邁進！"
 CHI_a_party_unified_tt: "§R兩廣事變期間將蔣介石派往廣州將導致其提前死亡。§!"
 CHI_a_popular_movement: "群眾性運動"
 CHI_a_popular_movement_desc: "歷史新篇章需要新的組織。人人皆知，我們作為一個民族如潮水般拍打舊社會，使每個成員成為這更大整體的一部分。"
 CHI_a_popular_movement_trigger: "§Y軍隊腐敗§!徵兵因素多於§Y0%§!"
 CHI_integrate_the_hongmen: "整合自衛組織"
 CHI_integrate_the_hongmen_desc: "中國充滿了因反抗清朝壓迫而形成的團體。自辛亥革命後，它們失去了目標，走向分化。我們可以通過整合它們或效仿其組織與儀式，為它們再次賦予使命。"
 CHI_ban_immoral_entertainment: "禁止低俗娛樂"
 CHI_ban_immoral_entertainment_desc: "頹廢的娛樂形式已傳播入境，汙染了我們的道德纖維。我們應禁止這些娛樂，轉而支持更具運動性與藝術性的本土形式，並設立專門隊伍來執行禁令。"
 CHI_develop_counterinsurgency_tactics: "反游擊戰術"
 CHI_develop_counterinsurgency_tactics_desc: "游擊隊的作戰方式前所未見，我們需要學習如何應對。我們應組織委員會與小組，制定對策並適應這種新型戰爭。"
 CHI_develop_counterinsurgency_tactics_tt: "將使§Y$CHI_counter_infiltration_measures$§!的成本§G減半§!"
 CHI_a_brotherhood_for_china: "中國的兄弟會"
 CHI_a_brotherhood_for_china_desc: "在許多人眼中，藍衣社不過是一群擾亂治安的粗野之徒。然而，它的領袖戴笠將其設想為一個兄弟會，我們可以採納這一觀點以促進團結。"
 CHI_nationalize: "國有化！"
 CHI_nationalize_desc: "我們正處於黨、國家與民族的關鍵時刻，私人利益必須讓位於國家需要。在我們的直接指導下，我們將最大限度地利用這些工廠！"
 CHI_militarize: "軍事化！"
 CHI_militarize_desc: "人民已對自身在歷史中的地位變得冷漠，我們必須喚醒他們。讓他們感受革命的熱情，並準備好打擊國內外的敵人。"
 CHI_militarize_tt: "我們能夠在當前及未來所有擁有§Y$CHI_infiltrated_state_3$§!修正的地區徵召忠義救國軍。"
 CHI_productive: "高效化！"
 CHI_productive_desc: "遊手好閒者一事無成！懶惰不僅拖慢我們的步伐，還幫助敵人。對於那些被動與冷漠的人，我們必須加以處理，這樣我們作為一個政黨才算得上是佔據優勢！"
 CHI_enforce__virtues: "弘揚美德"
 CHI_enforce__virtues_desc: "然而，仍有人將時間浪費在無謂與毫無意義的消遣上，而他們本可以為了黨與國家而自我提升。這隻能說明我們在執行上過於鬆懈，因此必須加倍努力。"
 CHI_whampoa_ideological_primacy: "黃埔理念主導"
 CHI_whampoa_ideological_primacy_desc: "黃埔軍校培養的軍官不僅手持武器，還懷抱信念，與其他學校不同的是，他們值得信任。我們應將一切意識形態培訓集中於此校，以增強整個國家的力量。"
 CHI_postpone_the_tutelage: "推遲訓政"
 CHI_postpone_the_tutelage_desc: "儘管目標依然是民主，但現在不是時機，當前的危機需要我們採取特別措施。我們必須引導國家渡過險境，民主才能開花。"
 CHI_postpone_the_tutelage_tt: "解鎖決議，在軍閥被征服後，對特定§Y軍閥將領§!實施§Y再教育§!"
 CHI_second_father_of_the_nation: "第二國父"
 CHI_second_father_of_the_nation_desc: "孫中山先生帶領我們擺脫清朝枷鎖，他將永遠是我們的國父。蔣委員長清除了黨內的共產主義者，因此他將永遠被銘記為“第二國父”。"
 CHI_weaponise_the_faithful: "信仰武器化"
 CHI_weaponise_the_faithful_desc: "信念最堅定的人，戰鬥也最為激烈。目前我們尚無為他們準備的舞臺，但我們可以為他們創造舞臺，將他們置於第一線。他們的忠誠將成為我們最鋒利的刀刃，斬盡一切敵人。"
 CHI_political_advisors_in_every_division: "每個師配一名政治顧問"
 CHI_political_advisors_in_every_division_desc: "軍隊保衛國家，直到有一天不再如此。太多次國家被手握武器者推翻，我們絕不能讓這種事發生在我們身上。黨代表將幫助我軍保持正確行動的動力。"
 CHI_an_alternative_rooted_in_tradition: "植根鄉土的第三道路"
 CHI_an_alternative_rooted_in_tradition_desc: "自由主義與共產主義都是[ROOT.GetAdjective]民族的外來概念，毫無意義。只有屬於我們自身的理念才能為我們的國土帶來繁榮與自豪。"
 CHI_an_alternative_rooted_in_tradition_tt: "提高[PRC.GetNameDefCap]滲透花費：§G+25%§!"
 CHI_expel_the_occupiers: "$PRC_expel_the_occupiers$"
 CHI_expel_the_occupiers_desc: "$PRC_expel_the_occupiers_desc$"
 CHI_put_an_end_to_PRC: "剿滅[PRC.GetNameDef]"
 CHI_put_an_end_to_PRC_desc: "阻擋我們統一全國的真正絆腳石，正是那些盤踞山溝、由[PRC.GetLeader]率領的頑固赤匪！只要赤匪一日不滅，民國就一日無法真正統一。內亂不除，則使國家元氣大傷；國力衰弱，必招致列強侵略；外侮當前，更將危及我主權社稷！因此，剿滅[PRC.GetNameDef]，乃我黨國天經地義的義不容辭之責！"
 CHI_reject_the_nine_powers: "廢棄九國公約"
 CHI_reject_the_nine_powers_desc: "外國人強加給我們的條約是在我們軟弱之時簽下的，如今我們能夠拒絕它們。讓每個簽署國都知道：我們不欠外國人任何東西！"
 CHI_setting_a_new_standard: "樹立新標準"
 CHI_setting_a_new_standard_desc: "我們的軍隊受西方思想與傳統影響太深，但我們是《孫子兵法》之國，而不是克勞塞維茨之國。通過結構調整與思想工作，我們已將武裝力量塑造成我們的模樣。"
 CHI_eternal_revolution: "永恆的中華革命"
 CHI_eternal_revolution_desc: "我們的成就證明了本土製度優於舊的與外國的理念。革命的火焰在每個同胞心中燃燒，我們必須利用它將革命推向更廣闊的天地。"
 CHI_eternal_revolution_tt: "允許在宣稱的領土上§Y宣佈戰區§!"
 CHI_reclaim_what_was_lost: "收復失地"
 CHI_reclaim_what_was_lost_desc: "清朝繼承了我們有史以來最大的帝國，卻為了外國勢力的利益將其葬送。這給我們的民族、國家與政黨帶來了恥辱。我們必須挽回顏面，重塑尊嚴。"
 CHI_bring_the_wayward_back_into_the_fold: "收復浪子"
 CHI_bring_the_wayward_back_into_the_fold_desc: "自辛亥革命以來，有些同胞被誤導，認為脫離集體會更好。現在是時候糾正這一點，把他們帶回集體中了。"
 CHI_retake_coastal_cities: "奪回沿海城市"
 CHI_retake_coastal_cities_desc: "長期以來，西方的帝國主義者一直將他們的意志強加於我們。現在時機已經成熟，我們終於要奪回被他們奪走的東西。[326.GetName]、[729.GetName]和[728.GetName]必須再次成為我們領土的一部分！"
 CHI_a_new_middle_kingdom: "新天朝"
 CHI_a_new_middle_kingdom_desc: "在以往的時代，我們曾是世界運轉的中心。這讓我們孤立於世界之外，世界也因此從我們身邊流逝。我們不會再犯這種錯誤，這一次，我們將主宰自己的命運，也主宰他人的命運。"
 CHI_remove_infiltration_decisions_tt: "§R移除§!§Y$PRC_infiltration_sea_cat$§!決議"
 CHI_the_southern_mandate: "南方天命"
 CHI_the_southern_mandate_desc: "南方蘊藏著豐富的資源與流淌著共同血脈的人民。我們自古以來便與這些土地相連，如今是時候南征了。"
 CHI_the_northern_mandate: "北方天命"
 CHI_the_northern_mandate_desc: "在我們領土的北方有一片荒涼的廢土，原本是未經雕琢的璞玉，[SOV.GetNameDef]浪費它的潛力。因此他們無權擁有它。只有能夠看見這片土地真實潛能的才能持有它，而能做到這一點的正是我們！"
 CHI_the_greater_game: "西域博弈"
 CHI_the_greater_game_desc: "帝國主義者曾在中亞玩弄權術，但他們在這片土地上碰得頭破血流。是時候向西進軍，再一次率領我們的軍隊橫跨草原。"
 CHI_cradle_of_civilization: "文明的搖籃"
 CHI_cradle_of_civilization_desc: "自黃河渾濁的水流中誕生了塑造人類的文明。王朝興衰更替，但古代中國的榮光永遠照耀大地，我們的至高地位也將永存。"
 CHI_cradle_of_civilization_tt: "解鎖決議，在達到足夠高§Y順從度§!時整合我們有§Y領土要求§!的§Y亞洲§!地區"
 # Army Focuses
 CHI_military_affairs_commission_sea: "軍事委員會"
 CHI_military_affairs_commission_sea_desc: "高效軍隊的根基在於完善的最高統帥部。軍事委員會是我國最高防務機構，必須確保其具備足以勝任的能力。"
 CHI_set_up_an_nco_school: "設立士官學校"
 CHI_set_up_an_nco_school_desc: "我軍大部分人缺乏正規教育，這對普通士兵尚可原諒，但一旦升至更高軍銜則成為問題。我們需要建立相應制度來訓練士官，確保他們的軍事素養。"
 CHI_formalize_field_promotions: "正式確立戰地晉升制度"
 CHI_formalize_field_promotions_desc: "在理想的世界裡，我們會擁有一支受過全面訓練與教育的軍隊，但現實並非如此。在當下困境下，快速將部隊投入戰場才是首要任務。我們將制定計劃，從普通士兵中物色能夠帶領戰友前進的人。"
 CHI_crackdown_on_corruption_in_recruitment: "打擊軍事腐敗"
 CHI_crackdown_on_corruption_in_recruitment_desc: "國軍自建立以來，徵兵制度一直存在系統性問題。有人花錢逃役，薪餉也被“巧妙賬目”貪汙。如果我們要在現代世界的衝擊中生存下去，這些問題必須終結。"
 CHI_crackdown_on_corruption_in_recruitment_tt: "§Y$CHI_he_yingqin$§!成為可用的§Y3§!級陸軍將領"
 CHI_form_the_combined_logistics_command: "組建聯合後勤司令部"
 CHI_form_the_combined_logistics_command_desc: "如今我們的軍隊已經重組，能夠有效應對一切威脅，但新的問題出現了。儘管後勤狀況有所改善，我們的武裝部隊在後勤分配體系上缺乏協調。我們必須立刻解決此問題！"
 CHI_reorganise_the_train: "整頓鐵路"
 CHI_reorganise_the_train_desc: "我們的補給組織從未發展到所需的規模與複雜程度。徹底重組將使我們能向前線投入更多兵力。"
 CHI_rely_on_locals: "依靠地方"
 CHI_rely_on_locals_desc: "建立一支完整的、能夠被我軍使用的組織架構，複雜、耗時且昂貴。歷史為我們展示了另一種替代方案——為何要長途運輸那些本地即可獲得的資源？如果我們依靠分佈在這片廣袤土地上的農民與工人，就能彌補體制留下的缺口。"
 CHI_focus_on_meritocratic_principles: "任人唯賢"
 CHI_focus_on_meritocratic_principles_desc: "裙帶關係、賄賂與腐敗，是高效軍隊的天敵。這些弊病在我軍組織中過於普遍，必須改變。通過建立制度框架，把最有功績的人才提拔到合適崗位，方能確保勝利。"
 CHI_focus_on_meritocratic_principles_tt: "允許手動移除陸軍精神§Y黃埔優先§!"
 CHI_protracted_warfare: "持久戰"
 CHI_protracted_warfare_desc: "自從[JAP.GetNameDef]擊敗俄國以來，其國人深信迅猛、侵略性的行動就是勝利之道。這使得他們軍隊缺乏持久戰力。如果我們能阻止他們的速勝，他們的部隊很快會土崩瓦解。"
 CHI_decisive_battles: "決戰思想"
 CHI_decisive_battles_desc: "並非所有勝利都具備相同分量，正如1905年[JAP.GetNameDef]所展示的那樣。我們應集中兵力，在關鍵戰役中取勝，主動進攻滿洲。"
 CHI_invest_in_mountain_guns: "投資山地火炮"
 CHI_invest_in_mountain_guns_desc: "我國的疆土難以通行，搬運重炮更是艱鉅。能夠隨時拆解並搬運火炮正是解決之道，值得在這個方向加強投入。"
 CHI_repurpose_fort_artillery: "改造要塞炮"
 CHI_repurpose_fort_artillery_desc: "戰爭不再能依賴要塞固守，上次世界大戰已證明這一點。儘管防禦工事價值有限，但其中的火炮仍能持續打擊敵人。"
 CHI_repurpose_fort_artillery_tt: "§R你未控制任何可拆除的要塞§!"
 CHI_fund_the_marine_corp: "資助海軍陸戰隊"
 CHI_fund_the_marine_corp_desc: "我軍規模龐大，實力不容置疑，但若運用不當，則如同鈍器。建立一支專門訓練的海岸防禦部隊，戰力可抵十倍普通士兵，且能在關鍵時刻投射我們的海軍力量。"
 CHI_the_4_defence_areas: "四區聯防"
 CHI_the_4_defence_areas_desc: "若要成功保衛偉大祖國，必須有一套全面的計劃。我們將全國劃分為四個防區，並分別任命司令，以確保地方安全和高效抵抗。"
 CHI_defence_in_depth: "縱深防禦"
 CHI_defence_in_depth_desc: "合格的防禦不可僵化，我們需要將這一點納入戰略。我們知道[JAP.GetAdjective]缺乏持久戰力，因此將他們拖得越久，對我們越有利。戰局起伏不應擊垮我軍的鬥志。"
 CHI_prepare_the_war_zones: "武裝抗戰區"
 CHI_prepare_the_war_zones_desc: "我們需要按地理區域劃分整編軍隊，以明確各地責任。這樣就能規劃適合當地的攻勢，最大化突破能力。"
 CHI_guerrilla_warfare: "游擊戰"
 CHI_guerrilla_warfare_desc: "常規作戰可使我們一定程度抵抗，但在本土作戰則能採用非常規手段。滲透敵佔區，破壞其後方力量，這是令[JAP.GetNameDef]毫無防備的戰法。"
 CHI_guerrilla_warfare_tt: "解鎖§Y$PRC_guerilla_warfare_sea_cat$§!決議"
 CHI_rapidity_is_the_essence_of_war: "兵貴神速"
 CHI_rapidity_is_the_essence_of_war_desc: "速度與突然性是我們最佳武器。學習如何利用這些優勢，在現代戰爭中至關重要。快速而精確的機動作戰，能令敵軍失衡，從而讓我們更深入並以更小的阻力打擊敵佔區。"
 CHI_organise_the_200th_division: "成立第200師"
 CHI_organise_the_200th_division_desc: "裝甲部隊是本世紀戰爭最偉大的革新，但我們卻落後於人。組建一支裝甲師並聘請合適的指揮官，形成一股戰力倍增的力量，為勝利鋪平道路。"
 CHI_organise_the_200th_division_tt: "在[ROOT.capital.GetName]獲得一支精銳§Y裝甲§!單位"
 CHI_motorise_our_infantry: "摩托化步兵"
 CHI_motorise_our_infantry_desc: "我國人力資源儲備龐大，歷來是我軍的根基。現代化的機動運輸能賦能普通士兵，讓他們更快進入戰鬥並隨時給予致命一擊。確保正確位置上有持槍士兵永遠是高效的策略。"
 CHI_bog_them_down_in_the_centre: "困敵於華中"
 CHI_bog_them_down_in_the_centre_modify: "§Y$CHI_bog_them_down$§!追加效果："
 CHI_bog_them_down_in_the_centre_desc: "我們清楚無法在邊境阻止[JAP.GetNameDef]，所以必須慎選戰場。以長江為核心佈防，是阻敵的高效方式，可成為全國防禦的支點。而且，針對具體地區的防禦規劃意義更大。"
 CHI_appear_where_you_are_not_expected: "出其不意"
 CHI_appear_where_you_are_not_expected_desc: "從未有成功的統帥選擇在敵人預期的地點和方式發動攻擊。欺騙是戰爭根本，我們必須做到“實強時示弱，實弱時示強”。"
 CHI_declare_war_zone_modify: "§Y$CHI_declare_war_zone$§!追加效果："
 CHI_relocate_factories_from_the_coast: "沿海工廠內遷"
 CHI_relocate_factories_from_the_coast_desc: "我們面臨嚴峻的戰略困境。我們的工業中心位於沿海，極可能落入敵手。沒有生產能力，抵抗難以持久。因此我們必須將工業內遷，確保安全。"
 CHI_relocate_factories_from_the_coast_tt: "允許遷移§YMIOs§!與§Y工廠§!"
 CHI_relocate_factories_from_the_coast_tt_no_aat: "允許遷移§Y工廠§!"
 CHI_state_aa: "蒼穹之盾"
 CHI_state_aa_desc: "在新世界，敵人不只從陸地和海洋發動攻擊，還會從空中襲來。我們必須將炮口轉向天空，做好防空準備，才能抵禦入侵者。"
 CHI_coastal_forts: "海上長城"
 CHI_coastal_forts_desc: "外敵與其傀儡從北方進攻之餘，也必將自海上入侵。我們要隨時準備，在他們踏上國土之刻，將其重新趕回大海。"
 CHI_salvage_enemy_equipment: "回收敵軍裝備"
 CHI_salvage_enemy_equipment_desc: "國民革命軍的需求，遠超我工業能力。我們可以通過回收敵軍營地中的物資，來彌補部分缺口。"
 CHI_salvage_enemy_equipment_random_generals_tt: "§Y5§!名隨機陸軍將領將獲得§Y$Scavenger$§!：\n-$MODIFIER_EQUIPMENT_CAPTURE$：§G+3%§!"
 CHI_commemorate_the_labour_corps: "紀念勞工部隊"
 CHI_commemorate_the_labour_corps_desc: "我國人民曾遠赴海外，在世界大戰的戰場上展現勤勉的素養，贏得他國的認可。儘管[ENG.GetAdjective]與[FRA.GetAdjective]早已遺忘，但我們不會忘記。我們將銘記他們的功績，並將其經驗化為今日的力量。"
 CHI_utilise_the_terrain: "利用地形"
 CHI_utilise_the_terrain_desc: "我們的部隊既無最新裝備，也未受最佳訓練，但我們對祖國的土地瞭如指掌。我們能利用一切水道、丘陵與田野，使敢於入侵者陷入地獄般的困境。"
 CHI_train_for_asymmetry: "訓練非對稱作戰能力"
 CHI_train_for_asymmetry_desc: "戰爭從不公平，也不必期望公平。強大軍隊會試圖征服我們，我們必須找到扳平差距的方法。訓練軍隊與將領適應新式作戰過程艱難，但收穫不容置疑。"
 CHI_train_for_asymmetry_guerilla_cost_tt: "執行§Y$PRC_guerilla_warfare_sea_cat$§!決議的§G成本減半§!"
 CHI_train_for_asymmetry_random_generals_tt: "§Y3§!名隨機陸軍將領將獲得§Y“游擊戰專家”§!：\n-$MODIFIER_DIG_IN_SPEED_FACTOR$：§G+50%§!"
 CHI_know_thy_enemy: "知彼"
 CHI_know_thy_enemy_desc: "我們需要知道如何找到敵人戰線上的弱點。"
 CHI_know_thy_enemy_tt: "解鎖強化版“強攻”指令，進攻時不失去防禦工事加成。"
 CHI_know_thy_self: "知己"
 CHI_know_thy_self_desc: "知彼能為我們帶來勝利，但最終的勝利只能通過知己來實現。建立嚴格的自我評估將揭示我們的弱點，但也會指出如何集中我們的力量。"
 CHI_river_crossing_studies: "渡河研究"
 CHI_river_crossing_studies_desc: "中國是一個江河縱橫的國家，任何在此作戰的軍隊都必須學會如何跨河作戰。我們正處於絕佳位置，可從中學習並將所得付諸實踐。這些經驗將有助於我們擊退侵略者，並將戰火推回國境之外。"
 CHI_armoured_car_tactics: "裝甲車戰術"
 CHI_armoured_car_tactics_desc: "在工業力量的競賽中，大多數軍隊的裝甲部隊都在逐漸變重。然而，當需要刀子時，使用斧頭並不能提高效率。"
 CHI_serve_the_country_with_utmost_loyalty: "盡忠報國"
 CHI_serve_the_country_with_utmost_loyalty_desc: "我們已向敵人展現了堅毅，將其死死擋在原地。憑藉對祖國的堅定奉獻與忠誠，沒有任何侵略者能將我們征服！"
 CHI_the_well_timed_swoop_of_a_falcon: "鷙鳥之疾"
 CHI_the_well_timed_swoop_of_a_falcon_desc: "我們已掌握打擊與殲滅敵人的方法。從驅逐侵略者，到將戰火燒至敵國本土，古老的智慧至今依舊有效，我們必將邁向勝利！"
 # Air Focuses
 CHI_rocaf: "加強民國空軍" # was Establish the ROCAF
 CHI_rocaf_desc: "為保障[ROOT.GetName]空域安全、展現國家力量，我們必須強化空軍。通過投資先進學說與技術，將為打造一支能夠應對任何對手的現代化空中力量奠定基礎。"
 CHI_officialize_the_rocaf: "正式成立中華民國空軍"
 CHI_officialize_the_rocaf_desc: "空軍長期以來一直是個非正式的機構。隨著我們取得的技術與戰術發展，現在是時候將航空委員會改組為空軍司令部，使中華民國空軍成為獨立於陸軍與海軍的正規軍種。"
 CHI_bring_the_war_home: "將戰火帶回敵國本土"
 CHI_bring_the_war_home_desc: "敵人必須認識到其領土無處藏身。通過精準轟炸和心理戰，我們將實施深度打擊，摧毀敵軍士氣。"
 CHI_bring_the_war_home_tt: "解鎖以下襲擊：\n[GetHuangshenRaidTooltip]\n[GetTokyoImperialPalaceTooltip]\n[GetNationalDietTooltip]\n[GetHakkoIchiuTooltip]"
 CHI_open_afamf_plants: "航委第一飛機制造廠"
 CHI_open_afamf_plants_desc: "為了研發新的飛行器，例如朱家仁少將構想的研驅-0戰鬥機，我們必須建設能夠支撐並生產輕型戰鬥機和俯衝轟炸機的設施。理想的選址是昆明，但只要能造出能在空中與敵軍抗衡的飛機，任何地方都行。"
 CHI_open_afamf_plants_tt: "如果我們或我們的附屬國控制了§Y[325.GetName]§!，我們會在那裡獲得一座軍用工廠"
 CHI_projecting_power: "遠程投射能力"
 CHI_projecting_power_desc: "通過將空中力量投射至前線之外，我們已做好隨時抓住機遇發起打擊的準備。空中力量的遠程投射，已不再是單純的野心，而是戰略上的必然要求。"
 CHI_strike_at_what_is_weak: "避實擊虛"
 CHI_strike_at_what_is_weak_desc: "我們不會正面迎敵。相反，我們的作戰學說必須強調精準且持續地打擊敵人最脆弱的環節。"
 CHI_a_wind_that_rises_in_the_daytime_lasts_long: "晝風久"
 CHI_a_wind_that_rises_in_the_daytime_lasts_long_desc: "白天的持續轟炸提供了穩定且有條理的空戰方式。我們必須利用良好的視野和協調性，以實施有效打擊。"
 CHI_but_a_night_breeze_soon_falls: "夜風止"
 CHI_but_a_night_breeze_soon_falls_desc: "夜間行動可能充滿風險，但加強訓練後我們的飛行員就能在夜幕掩護下將損失降至最低。敵人永遠不會發現我們的到來.……"
 CHI_escort_efficiency: "護航效率"
 CHI_escort_efficiency_desc: "戰鬥機護航是我們轟炸機的重要護盾。加強協調和覆蓋範圍能確保更多飛機完好返航，為下一輪任務做好準備。"
 CHI_controlling_our_skies: "掌控天空"
 CHI_controlling_our_skies_desc: "在稱霸海外之前，我們必須確保國內的空天主權。紀律嚴明的防空網絡是維護國家安全的根本保障。"
 CHI_interception_detection: "攔截偵測"
 CHI_interception_detection_desc: "及時的偵測能讓我們在敵人發動攻擊前先發制人。我們將加強雷達與觀測網絡建設，獲取這一決定性優勢。"
 CHI_focus_on_positional_advantage: "重視方位優勢"
 CHI_focus_on_positional_advantage_desc: "空戰不僅關乎數量與速度，優勢在於高度、角度與警覺性。我們必須教導飛行員利用好每一項優勢。"
 CHI_effectivize_ground_crew_usage: "提高地勤效率"
 CHI_effectivize_ground_crew_usage_desc: "地面效率與空中表現同樣重要。簡化機組任務和後勤保障能讓更多飛機保持飛行狀態。"
 CHI_coordinate_with_the_army: "協同陸軍"
 CHI_coordinate_with_the_army_desc: "勝利源於武裝力量的統一。我們的空中與地面部隊必須以同一目標執行統一行動。"
 CHI_an_appropriate_design: "合適的設計"
 CHI_an_appropriate_design_desc: "我們的飛機必須嚴格符合作戰學說的要求。無論航程或耐久性，我們將致力於研發滿足戰場需求的設計方案。"
 CHI_an_appropriate_design_3_tt: "如果已完成§Y$CHI_projecting_power$§!：\n"
 CHI_an_appropriate_design_2_tt: "如果採取了§Y$CHI_controlling_our_skies$§!：\n"
 CHI_reorganise_the_central_armys_academy_aviation_corps: "重組學校航空隊"
 CHI_reorganise_the_central_armys_academy_aviation_corps_desc: "訓練必須隨技術發展而進步。我們將改革航空兵團，培養適應未來戰鬥的現代化能幹飛行員。"
 CHI_formalise_training_regime: "訓練體系正式化"
 CHI_formalise_training_regime_desc: "持續且嚴格的訓練制度是減少損失、提升表現的關鍵。標準化將從現在開始。"
 CHI_conserve_our_pilots: "珍惜飛行員生命"
 CHI_conserve_our_pilots_desc: "飛行員難以替代。通過降低風險、提高生存率，我們才能保留作戰經驗，維持部隊戰鬥力。"
 CHI_camco_primacy: "$CHI_camco_organization_sea$優先"
 CHI_camco_primacy_desc: "中央飛機制造廠是我們在航空發展方面最佳的國內夥伴。優先發展其能力將確保產能跟上我們的雄心。"
 CHI_SINAW_primacy: "$CHI_sinaw_organization_sea$優先"
 CHI_SINAW_primacy_desc: "中意飛機制造廠能提供中央飛機制造廠無法實現的技術創新。投資其擴張能讓我們更接近與外國強國的實力對等。"
 CHI_initiate_the_sky_projects: "啟動天空計劃"
 CHI_initiate_the_sky_projects_desc: "火箭技術與先進推進系統開闢了新的戰略選項。我們將資助實驗項目，著眼長期回報。"
 CHI_focus_on_the_Tianlong_project: "注重天龍計劃"
 CHI_focus_on_the_Tianlong_project_desc: "噴氣式推進是空戰的未來。天龍計劃將會是這一變革的前沿。"
 CHI_VTOL_experiments: "垂直起降實驗"
 CHI_VTOL_experiments_desc: "垂直起降飛機能在複雜地形提供戰術靈活性。我們已啟動試驗以評估其在現代戰爭中的作用。"
 CHI_hongxiang_force: "雲南空降兵部隊"
 CHI_hongxiang_force_desc: "通過與我們在航空領域的盟友和同僚合作，我們已經成功建立了國內軍事傘降作戰的訓練體系。"
 # Navy focuses
 CHI_republic_of_china_navy: "中華民國海軍"
 CHI_republic_of_china_navy_desc: "中央海軍過去歷經坎坷，資金匱乏與海防不穩致使艦船狀況不佳。隨著危機臨近，我們必須把克服這些挑戰提上日程。"
 CHI_foreign_acquisition: "海外收購"
 CHI_foreign_acquisition_desc: "雖然我們希望這只是暫時的挫折，但我們必須承認其他列強在海軍技術發展方面遠遠領先我們。要實現海軍現代化，必須首先找到一位技術先進的援助方。"
 CHI_develop_northern_naval_logistics: "發展北方海軍後勤"
 CHI_develop_northern_naval_logistics_desc: "1922年從日本正式收復的青島，是一個重要的戰略港口城市，理應在我國海軍軍事化進程中發揮作用。"
 CHI_develop_southern_naval_logistics: "發展南方海軍後勤"
 CHI_develop_southern_naval_logistics_desc: "我國南部海岸遍佈殖民飛地，防禦力量嚴重不足。若要與西方列強平等對話，勢必要收復並開發這一關鍵區域。"
 CHI_concerted_push: "協同推進"
 CHI_concerted_push_desc: "中國人民一次又一次在逆境中展現了他們的適應能力。這次也不例外。我們的領導層已經宣佈需要一支能夠與大國抗衡的海軍，而我們的經濟將迎接這一挑戰。"
 CHI_local_alloy_commission: "本地合金委員會"
 CHI_local_alloy_commission_desc: "我們的土地蘊藏著豐富的天然礦產資源，然而我們卻未能充分利用這些資源進行工業開發。在此領域探索發展潛力，未來必將獲得豐厚回報。"
 CHI_deny_the_enemy: "拒敵"
 CHI_deny_the_enemy_desc: "雖然我們在陸地上的優勢無可匹敵，但對於重振衰弱的海軍，我們所能期待的最好結果或許就是遏制敵方的行動。"
 CHI_dominate_the_enemy: "制敵"
 CHI_dominate_the_enemy_desc: "我們將不惜一切代價，達到與敵人抗衡的實力。"
 CHI_navy_spooks: "發展海軍情報機構"
 CHI_navy_spooks_desc: "中國周邊的海域是繁忙的貿易活動樞紐。有商人的地方就有流言，有流言的地方就有機遇……"
 CHI_promote_admiral: "晉升海軍將領"
 CHI_promote_admiral_desc: "我們近期的海軍建設最終將淘汰那些19世紀的老舊戰艦。這恰好提供了將其改造為訓練艦供官兵使用的契機——同時針對我國海軍的戰略方向制定一套優化的訓練項目。"
 CHI_promote_admiral_tt: "如果採用了§Y$CHI_deny_the_enemy$§!，所有海軍將領會獲得§Y$green_water_expert$§!特質\n\n如果採用了§Y$CHI_dominate_the_enemy$§!，所有海軍將領會獲得§Y$blue_water_expert$§!特質"
 CHI_promote_admiral_dingwen_tt: "提拔§Y$CHI_jiang_dingwen_admiral$§!為海軍將官"
 CHI_heavy_ship_research: "重型戰艦研發"
 CHI_heavy_ship_research_desc: "自主生產戰列艦對於抗衡至今仍在掠奪我國的地區和殖民強國至關重要。雖然我們的技術可能處於劣勢，但我們的製造工藝和人民的堅定意志必將帶來勝利。"
 CHI_strike_from_below: "水下打擊"
 CHI_strike_from_below_desc: "德國已經證明一個受到海軍強國威脅的國家可以依靠強大的水下艦隊來保護自身利益。鑑於我們面臨類似的情況，我們應該向西方汲取經驗。"
 CHI_fund_the_naval_air_establishment: "資助海軍航空系統建設"
 CHI_fund_the_naval_air_establishment_desc: "制空權和制海權結合所帶來的巨大優勢不容忽視。擴編我們的海軍航空兵部隊能降低跨軍種通信失誤的風險。"
 CHI_early_detections: "初期偵測"
 CHI_early_detections_desc: "我們的艦隊雖然有戰鬥力，但規模一般，因此除了優化作戰部署以最大限度地利用艦船外別無選擇。情報與態勢感知是實現這一目標的最佳途徑。"
 CHI_defend_our_coasts: "保衛海岸"
 CHI_defend_our_coasts_desc: "只要敵人無法接近我們，他們就無法發動攻擊。未來遭遇入侵時，佈雷拒止將是最可行的防禦手段。至於未來的成本，我們日後再作考量……"
 CHI_long_range: "遠程作戰"
 CHI_long_range_desc: "一支平衡良好的箭矢可以在戰爭開始前就結束它。更龐大、更嘈雜的引擎或許會讓機組人員承擔風險，但能將力量投射得更遠，讓我們在世界舞臺上擁有更大的影響力。"
 CHI_battleship_focus: "重視戰列艦"
 CHI_battleship_focus_desc: "當我們開始建造第一艘海上巨獸時，歌頌我們的國父是理所當然的。"
 CHI_coastal_defence: "海岸防禦"
 CHI_coastal_defence_desc: "優化水下艦隊的空間利用率意味著能建造更小更快的潛艇。不過我們不得不捨棄一些非必要設施，比如雙層床……以及其他生活便利設備。"
 CHI_heavy_cruiser_focus: "重視重巡洋艦"
 CHI_heavy_cruiser_focus_desc: "我們的水面艦隊雖承襲自清朝，近五十年來卻始終恪盡職守。世界正在變化，但在操作近程裝甲巡洋艦方面，放棄如此豐富的經驗並不明智：我們的未來應當融入過去。"
 CHI_mobile_bases: "機動基地"
 CHI_mobile_bases_desc: "正如世界其他國家所證明的，天空代表著戰爭的未來。然而我們的遠程打擊能力受限於地理條件。仿效列強的做法，我們必須把精力集中在機動打擊平臺上。"
 CHI_the_seas_of_tomorrow: "明日之海"
 CHI_the_seas_of_tomorrow_desc: "我們夢想著中國在軟實力與科技實力上引領世界的未來。多年來我們一直在追趕殖民列強和地區對手的龐大海軍，但現在是我們親自規劃未來航向的時候了。"
 CHI_the_seas_of_tomorrow_tt: "一位專門研究先前所選領域的§Y科學家§!將可供使用。"
 CHI_long_range_screens: "長程屏衛"
 CHI_long_range_screens_desc: "隨著我們著力超越國內衝突，以低成本遠距離投送實質性軍力的能力變得至關重要。"
 # Industrial branch
 CHI_promote_the_national_currency: "推廣法幣"
 CHI_promote_the_national_currency_desc: "我們最近廢除銀本位，在全國推行新貨幣，初期在降低對國際事件的依賴方面成效良好。然而，新貨幣主要流行於大城市。我們必須集中努力，確保其在農村地區也普及。"
 CHI_institute_a_national_registry_of_property: "建立全國財產登記制度"
 CHI_institute_a_national_registry_of_property_desc: "官僚體制是國家的基礎，必須擁有合適的信息才能高效運轉。在這種低效的情況下，肆無忌憚的代理人可以利用這個系統謀取私利，損害我們國家的其他領域。"
 CHI_the_three_year_plan: "三年計劃"
 CHI_the_three_year_plan_desc: "我們的努力長期缺乏集中，國家一直欠缺方向。通過未來幾年的有計劃建設，我們將集中精力，獲得巨大收益。願不會有任何阻礙橫亙其中。"
 CHI_the_three_year_plan_tt: "§R進入戰爭時將被移除。§!"
 CHI_extend_compulsory_education: "擴大義務教育"
 CHI_extend_compulsory_education_desc: "識字人口是國家發展的支柱，但不幸的是，我們的教育努力過於短暫，且集中於城市。這使得農村人口被忽視，隨時可能被其他勢力填補國家的角色。"
 CHI_extend_compulsory_education_tt: "每過§Y[?CHI_improving_neglected_countryside_mission_time]§!天，§Y$CHI_neglected_countryside$§!就會§G改善§!，直到負面修正消除。"
 CHI_initiate_the_gung_ho_movement: "發起工合運動"
 CHI_initiate_the_gung_ho_movement_desc: "這場危機讓我們深刻意識到自身的缺陷——無論在物資還是生產能力上。但我們不缺乏勞動力，只要合理組織，就能投身工作。有人向我們提議，建立分佈全國的小規模工業合作社。"
 CHI_expand_the_bureaucracy: "擴大官僚體系"
 CHI_expand_the_bureaucracy_desc: "我國幅員遼闊，治理需巨大努力與人力。隨著教育基礎擴大，我們現在能在國家機關中僱傭更多人員，從而加強對偏遠地區的控制。"
 CHI_send_the_urban_students_to_the_countryside: "青年興農運動"
 CHI_send_the_urban_students_to_the_countryside_desc: "儘管教育已有成果，但城鄉差距依舊巨大。是時候採取更直接的方式，讓接受過高等教育的學生走進鄉村學校，傳授知識。"
 CHI_find_foreign_financiers: "尋找外國金融資助"
 CHI_find_foreign_financiers_desc: "我國經濟潛力無限，但現狀意味著若靠自身積累，建設需時日。更快的途徑是通過合資引入外國資本。我們應當尋找能意識到中華民族潛能的海外投資者。"
 CHI_find_foreign_financiers_tt: "獲得：每存在一個對[ROOT.GetName]評價至少為§G70§!的主要國家（日本除外）§Y+1500$CIC_BANK_HEADER$§!。\n\n"
 CHI_naval_separate_defense_plan: "海軍分防計劃"
 CHI_naval_separate_defense_plan_desc: "陳紹寬提出的《海軍分防計劃》，定下了在未來30年內建造至少十二艘航空母艦的目標。若要保衛我國海疆，我們就應採納此議，並儘快開始打造航母艦隊！"
 CHI_fund_the_plan_domestically: "通過國內籌資完成計劃"
 CHI_fund_the_plan_domestically_desc: "上個世紀的教訓告訴我們，信賴外國資本極為危險。若要建設本國工業，卻依賴外國人而非本地銀行與投資者，那將是嚴重錯誤，也極其危險。我們應當依靠國內資金來源，避免依賴外資。"
 CHI_finance_cooperatives: "為合作社融資"
 CHI_finance_cooperatives_desc: "合作社充滿活力與創造力，但缺乏信貸渠道。雖然我們資源有限，但合作社所需不多，完全可以由國家自行資助，從而邁出下一步。"
 CHI_introduce_income_tax: "開徵所得稅"
 CHI_introduce_income_tax_desc: "國家的財政方式仍然陳舊，不適合現代世界。我們曾數次嘗試推行所得稅，但皆未成功。如今我們擁有強有力的政府，終於能貫徹落實這項政策。"
 CHI_redistribute_land: "土地再分配"
 CHI_redistribute_land_desc: "我國農民大多勞作在地主手下，被其榨取以謀私利。這絕不能再繼續，因為它拖累國家生產力、限制增長，使國家持續落後。"
 CHI_expand_academica_sinica: "擴建中央研究院"
 CHI_expand_academica_sinica_desc: "隨著大量人口教育水平逐步提升，是時候轉向高等教育。為增強國力，我們將進一步發展“中央研究院”，這是我國最重要的科學機構。"
 CHI_expand_the_chinese_academy_of_sciences: "建立中國科學院"
 CHI_expand_the_chinese_academy_of_sciences_desc: "中央研究院已展開一項新計劃，擬在國家層面設立自然科學最高學府與科技最高諮詢機構，將全國最傑出的頭腦匯聚於此。"
 CHI_expand_national_sun_yat_sen_university: "國立中山大學"
 CHI_expand_national_sun_yat_sen_university_desc: "如今我們的工業已能夠為人民的高等教育提供財政支持，是時候讓中國人民做到：博學、審問、慎思、明辨、篤行。唯有通過孫中山先生所倡導的這些原則，我國才能成為科研與發展的領軍者。"
 CHI_expand_academica_sinica_tt: "§Y$CHI_neglected_countryside$§!$research_speed_factor_tt$為[?CHI_neglected_countryside_academia_sinica_trigger|R%]或更高"
 CHI_expand_the_cooperatives: "擴張合作社網絡"
 CHI_expand_the_cooperatives_desc: "合作社的效率已經令我們印象深刻，但它們的規模和影響力仍然有限。若我們能將自身的關係網絡借予他們，他們將能夠進一步成長與擴展。"
 CHI_administer_cooperatives: "管理合作社"
 CHI_administer_cooperatives_desc: "合作社的性質使得它們增長迅速、傳播廣泛，但往往各自為戰。設立一個全國性辦公室，將能協調並支持[ROOT.GetName]各地的合作社網絡。"
 CHI_monopolise_resource_extraction: "壟斷資源開採權"
 CHI_monopolise_resource_extraction_desc: "我們在其他國家觀察到中央計劃機構在經濟管理中的力量。特別是確保資源流通不中斷、不被私人利益所剝削這一點，理應由技術官僚掌控，而在我國，這一職責應當歸屬於國家資源委員會。"
 CHI_invite_foreign_experts: "邀請外國專家"
 CHI_invite_foreign_experts_desc: "上個世紀表明，我國的技術知識落後於西方人。雖然這對我們不利，但如今我們已能借鑑其知識，使經濟發展速度前所未有地加快。"
 CHI_print_money_for_the_army: "印鈔養軍"
 CHI_print_money_for_the_army_desc: "軍隊從來不是免費的。若要一支龐大的軍隊，就必須付出代價。然而支付方式多種多樣，我們可以下達指示，專門為此印發額外貨幣。"
 CHI_maintain_adequate_currency_reserves: "維持充足貨幣儲備"
 CHI_maintain_adequate_currency_reserves_desc: "魯莽的支出已經一再被證明將導致整個體系的崩潰。如果我們要在可控增長下實現成功，就必須保持克制，並確保充足的貨幣儲備。"
 CHI_maintain_adequate_currency_reserves_tt: "每過§Y[?CHI_improving_inefficient_economy_mission_time]§!天，§Y$CHI_inefficient_economy$§!就會改善，直到負面修正消除。"
 CHI_develop_the_chemical_industry: "發展化學工業"
 CHI_develop_the_chemical_industry_desc: "現代文明的偉大成就之一，便是通過化學手段征服自然。從農業到製造業，化學工業可以滲透社會，而遺憾的是，我國的化學工業仍處於萌芽階段。若能發展這些產業，我們的成就將不可限量。"
 CHI_grow_the_coal_industry: "發展煤炭工業"
 CHI_grow_the_coal_industry_desc: "煤炭為我們的工廠、火車和熔爐提供動力。若要為國家供能並增強經濟實力，我們必須開發新的能源。國家資源委員會已確定了若干可供開發的能源來源。"
 CHI_grow_the_coal_industry_tt1: "在核心地區及軍閥盟友地區獲得額外§Y煤炭§!"
 CHI_grow_the_coal_industry_tt2: "在我方及軍閥盟友地區解鎖§Y煤炭§!勘探決議"
 CHI_tungsten_and_antimony_extraction: "鎢礦和銻礦開採"
 CHI_tungsten_and_antimony_extraction_desc: "戰略金屬造就戰略勝利，而我國擁有豐富的礦藏。若能將礦石從地下開採出來，它們將發揮巨大作用。"
 CHI_central_steel_and_machine_works: "中央鋼鐵機械廠"
 CHI_central_steel_and_machine_works_desc: "鋼鐵是工業的基石，而我們至今缺乏正規的生產體系。儘管我們擁有足夠的資源，只需實施國家資源委員會的計劃，即可彌補這一缺陷。"
 CHI_empower_those_that_have_lost: "團結受難國民"
 CHI_empower_those_that_have_lost_desc: "許多人在戰爭中失去了工作或家園。這些人或許看似毫無作用，但若給予機會，他們將化作驅逐侵略者的洪流。"
 CHI_found_a_modern_fertiliser_plant: "建立現代化肥廠"
 CHI_found_a_modern_fertiliser_plant_desc: "要養活全國，就必須使農業合理化，肥料生產本土化是首要步驟。我們將為此興建一座工廠，它還可以兼顧其他用途。"
 CHI_import_fertilisers: "進口肥料"
 CHI_import_fertilisers_desc: "雖然國內生產能解決依賴問題，但模仿他人終究多此一舉。若向國外發出採購訂單，我們就能集中精力發展自身的獨特優勢。"
 CHI_construct_the_banqiao_dam: "建造板橋水庫"
 CHI_construct_the_banqiao_dam_desc: "大江大河構成了我們的國土，控制江河一直是我們文明的基石。未來，這些河流將繼續推動國家的成長與偉大！"
 #################
 ## PHILIPPINES ##
 #################
 #############
 # PHI FOCUS #
 #############
 PHI_commonwealth_of_the_philippines: "菲律賓聯邦"
 PHI_commonwealth_of_the_philippines_desc: "僅在一年前成立的菲律賓聯邦是朝向獨立邁出的第一步，美國承諾這將是一個為期十年的過渡期。我們這個新生國家仍有許多工作要做，許多決議要作出，才能真正運作起來。"
 PHI_align_with_the_usa: "與美國結盟"
 PHI_align_with_the_usa_desc: "美利堅合眾國是一個仁慈而富有的宗主國。通過拉近與美國的關係，他們仍能為我們做許多事，以加快我們的發展並確保我們的安全。"
 PHI_usa_equipment: "§Y[PHI.GetName]§!會使用§Y[USA.GetName]§!軍工機構。"
 PHI_usa_equipment_non_aat: "§Y[PHI.GetName]§!會使用§Y[USA.GetName]§!裝備設計商。"
 PHI_align_with_japan: "與日本結盟"
 PHI_align_with_japan_desc: "儘管美國姿態良好，但他們仍是殖民統治者，隨時可能背棄對我們的承諾。因此，在國際舞臺上尋找新朋友才是明智之舉，而目前來看，日本是最理智的選擇。"
 PHI_jap_equipment: "§Y[PHI.GetName]§!會使用§Y[JAP.GetName]§!軍工機構。"
 PHI_jap_equipment_non_aat: "§Y[PHI.GetName]§!會使用§Y[JAP.GetName]§!裝備設計商。"
 PHI_quezon_city: "奎松城"
 PHI_quezon_city_desc: "作為首都的馬尼拉曾經對我們有益，但如今被人口過密、住房短缺、衛生條件差與擁堵等嚴重問題所困擾。我們需要一座從一開始就為首都功能規劃的城市，雖然建設與發展可能需要數年甚至數十年，但我們應當立即動手，以便將來收穫遠見的成果！"
 PHI_peg_the_peso_to_the_dollar: "比索掛鉤美元"
 PHI_peg_the_peso_to_the_dollar_desc: "我們的貨幣應與美元掛鉤，從而確定其價值。這將為我們的貨幣提供實際的價值基礎，並建立穩定的貿易基礎。"
 PHI_leverage_the_peso: "發揮比索優勢"
 PHI_leverage_the_peso_desc: "比索是我們自己的貨幣，我們應努力使其獨立於美元。這將讓我們採取適合本國經濟發展的調控性財政政策。"
 PHI_agricultural_migrants_to_hawaii: "向夏威夷輸出農業移民"
 PHI_agricultural_migrants_to_hawaii_desc: "許多菲律賓工人在美國夏威夷的農場工作取得了不錯的收入，我們應鼓勵這種移民趨勢，讓他們把錢匯回國內，促進本國經濟增長。"
 PHI_unicameral_legislature: "設立一院制立法機構"
 PHI_unicameral_legislature_desc: "建立獨立國家最重要的一步之一，就是組織起獨立的政府。從無到有極其艱難，因此我們應先建立一個單院制的菲律賓國會。"
 PHI_national_fiscal_policy: "國家財政政策"
 PHI_national_fiscal_policy_desc: "隨著國家堅定走上獨立之路，我們首先要做的事情之一就是將財政與美國脫鉤，制定國家預算，並通過稅收籌集資金的手段。"
 PHI_encourage_foreign_investment: "鼓勵外國投資"
 PHI_encourage_foreign_investment_desc: "美國並不是唯一想在我國市場分一杯羹的國家。我們擁有豐富的原材料與繁榮的農業，應當明確表態——只要有實力與遠見，我們的大門將向投資者敞開。"
 PHI_develop_japanese_trade_connections: "發展對日貿易聯繫"
 PHI_develop_japanese_trade_connections_desc: "日本已明確表示渴求物資與資源，而菲律賓正好有豐富的貿易品。我們應當鼓勵兩國的貿易，實現互利共贏。"
 PHI_encourage_japanese_investment: "鼓勵日本投資"
 PHI_encourage_japanese_investment_desc: "目前美國在我國享有多項貿易特權，我們應當悄然與日本建立聯繫，讓日本資本流入我國，從而削弱美國對我們的貪婪壓榨。"
 PHI_quezon_city_campus: "奎松城校園"
 PHI_quezon_city_campus_desc: "正如我們在規劃國家未來、建設未來之城的同時，我們也應考慮菲律賓公民的未來，確保教育卓越在這座新興城市中有充分發展的空間。"
 PHI_reduce_unneccessary_expenditure: "削減不必要支出"
 PHI_reduce_unneccessary_expenditure_desc: "如今我們已制定國家財政政策，必須確保收支平衡。我們不打算通過加稅或打擊逃稅來實現這一目標，而是削減不必要的開支。畢竟，如果這些服務本來就沒有提供，又有誰會懷念它們呢？"
 PHI_subsidies: "補貼"
 PHI_subsidies_desc: "資本的規律是：要賺錢必須先有錢。我們需要用預算向能快速見效的領域注入資金，為工業項目提供有針對性的補貼，並擴展基礎設施，使那些資源豐富但交通不便的地區和人口更容易被開發利用。"
 PHI_basic_welfare: "基礎福利"
 PHI_basic_welfare_desc: "我們有責任照顧那些最脆弱的群體，並有義務緩解他們的部分困境。雖然我們已經設立了諸如慈善機構等最基本的保障，但隨著工業化的興起，工人階級的困境已被推到了前臺。我們將成立國家經濟委員會，以制定勞動法並確立最低工資制度。"
 PHI_encourage_asian_trade: "鼓勵亞洲貿易"
 PHI_encourage_asian_trade_desc: "亞洲各國之間有著深厚的歷史海上聯繫，儘管殖民列強竭力加以壓制，這些聯繫依然牢固。我們應當培育這些紐帶，鼓勵各國間的貿易，實現共同的繁榮與發展。"
 PHI_pro_hacendados: "支持大地主"
 PHI_pro_hacendados_desc: "源自西班牙殖民時代的富裕地主階層，至今仍在菲律賓社會中掌握著巨大的財富與影響力。我們應當爭取這些舊家族的支持，以維持現狀為交換條件，獲得他們的資助與庇護。"
 PHI_anti_hacendados: "反對大地主"
 PHI_anti_hacendados_desc: "這些富裕地主長期壓迫佃農。我們應當推翻這一陳舊的制度，將土地歸還給真正耕作它的人。唯有如此，我們才能實現經濟現代化，擺脫這些寄生蟲般的存在。"
 PHI_sugar_barons: "糖業巨頭"
 PHI_sugar_barons_desc: "糖業是支撐整個菲律賓經濟的支柱。失去了這種寶貴資源，我們國家的繁榮將一夜之間化為烏有。我們必須鼓勵種植和出口這一關鍵作物的人們，為國家賺取更多甜美的財富。"
 PHI_sugar_barons_unlock_tt: "§Y解鎖糖類消費稅決議§!"
 PHI_sugar_barons_tt: "§Y一名隨機的陸軍將領§!將獲得§G+2§!計劃技能"
 PHI_luzon_transport: "改善呂宋島交通"
 PHI_luzon_transport_desc: "雖然這裡已經是菲律賓最發達的地區，但它也是人口最多、工業化程度最高的地區，因此交通網絡亟需進一步投資和擴建。"
 PHI_expand_gold_mining: "擴大黃金開採"
 PHI_expand_gold_mining_desc: "西班牙歷來在發現金銀儲量方面眼光獨到，在菲律賓也不例外。然而，他們若得知最富的金礦脈直到如今才被開採，且正為我國帶來創紀錄的出口收入，必然會大為震怒。"
 PHI_mindanao_transport: "改善棉蘭老島交通"
 PHI_mindanao_transport_desc: "菲律賓群島中面積第二大的島嶼，卻始終未能獲得與北部呂宋島相匹配的投資。我們應當糾正這一疏忽！"
 PHI_land_reform: "土地改革"
 PHI_land_reform_desc: "富裕地主依然掌控著菲律賓的農業部門。我們必須證明自己是一個現代化國家，而不是封建社會。國家將實行強制收購這些龐大的莊園，並將土地分割出售給小農和企業，以實現更高效的耕種與利用。"
 PHI_japanese_advisors: "日本顧問"
 PHI_japanese_advisors_desc: "日本曾以驚人的速度完成了從封建社會向現代國家的轉變。雖然此事已是過去，但他們至今仍保有豐富的工業和軍事經驗，隨著我們關係日益友好，我們或許能借助他們的專長。"
 PHI_san_miguel: "聖米格爾"
 PHI_san_miguel_desc: "聖米格爾啤酒廠由西班牙王室於1890年特許成立，自那時起便生產優質的德式拉格啤酒。如今隨著國民日益富裕、全球需求不斷增長，我們應當擴展這一著名飲品品牌。為更美好的世界乾杯。"
 PHI_textile_mills: "紡織廠"
 PHI_textile_mills_desc: "我們正處於向工業化經濟大舉推進的階段，而紡織業是這一進程的中堅力量。只要我們能自給自足地生產基本品，就再也不必依賴——或受制於——外國勢力。"
 PHI_encourage_gold_exports: "鼓勵黃金出口"
 PHI_encourage_gold_exports_desc: "目前我們正經歷一場黃金熱潮，時機再好不過。國內市場已趨於飽和，幸運的是世界渴求黃金。剛走出大蕭條的全球民眾迫切想擁有象徵財富的有形之物，而金條正是最有力的象徵。"
 PHI_mineral_prospecting: "礦產勘探"
 PHI_mineral_prospecting_desc: "有人說我們在礦產勘探中極為幸運，輕易就發現了大量金礦。然而，一個經濟體過度依賴單一資源是危險的，西班牙帝國對此的覺悟來得太晚。我們應投入更多資源勘探其他礦產，誰知道我們的土地還隱藏著什麼寶藏？"
 PHI_bill_of_rights: "權利法案"
 PHI_bill_of_rights_desc: "如果我們希望作為一個現代國家得到重視，就必須將人民的權利寫入法律。這一點可以參照[USA.GetName]的做法，賦予人民宗教、言論、出版和集會等自由。但我國自有國情在此，其中存在一些顯著差異。例如，我們認為沒有必要在社會中規定持槍權。"
 PHI_nationality_act: "國籍法"
 PHI_nationality_act_desc: "[USA.GetNameDefCap]正在制定《國籍法》，修訂現有公民權法律，包括涉及菲律賓人及其在美國地位的相關條款。該法案明確將菲律賓人認定為美國國民而非美國公民，允許其在[USA.GetNameDef]生活與工作，但不享有完整公民權利。"
 PHI_open_borders: "開放邊境"
 PHI_open_borders_desc: "“給我吧，那些窮苦的人，那些疲憊的人，那些蜷縮在一起渴望自由呼吸的人。”儘管[USA.GetAdjective]試圖限制移民，但我們確實掌控著自己的邊境。我們應力爭成為因戰爭、種族、宗教或任何其他原因受迫害者的避風港。"
 PHI_philippine_american_educational_foundation: "菲美教育基金會"
 PHI_philippine_american_educational_foundation_desc: "得益於與[USA.GetNameDef]的緊密聯繫，我們已建立多種學術聯繫。我們應設立負責管理交流獎學金項目的機構，旨在促進兩國間的合作研究、文化理解與思想開放交流。"
 PHI_government_filipinization: "政府菲律賓化"
 PHI_government_filipinization_desc: "我國政府被外國勢力主導已有數世紀——先是西班牙人，後是美國人。現在是我們自主掌控的時候了，實現菲律賓由菲律賓人治理、為菲律賓人服務！"
 PHI_improve_trait_tt: "將獲得一個改進的顧問特質"
 PHI_bicameral_legislature: "兩院制立法機構"
 PHI_bicameral_legislature_desc: "我們的政府架構在持續擴充。我們已設立了下議院，如今是時候建立上議院了。通過這一模式，我們能夠更好地為我們的國家制定新法律。"
 PHI_uncouple_the_peso_and_dollar: "比索和美元脫鉤"
 PHI_uncouple_the_peso_and_dollar_desc: "將比索與美元掛鉤的政策為我們帶來了良好成效，為我們的貨幣提供了必要的穩定性。然而，隨著獨立日益臨近，我們需要解除兩者的掛鉤，以便在我們的貨幣體系中擁有更多的控制權和靈活性，在必要時實施量化寬鬆等政策工具。"
 PHI_increase_sugar_exports: "提高糖出口"
 PHI_increase_sugar_exports_desc: "幾個世紀以來，糖一直是我們經濟的基石，即便在大蕭條最艱難的時期，糖也保持著穩定的出口，助我們渡過難關。通過與其他國家簽署利潤豐厚的貿易協議，我們可以確保自己處於最有利的位置，以便充分利用糖作為國際美食……以及汽水基礎原料的發展機遇。"
 PHI_break_chinese_monopoly: "打破中國壟斷"
 PHI_break_chinese_monopoly_desc: "華商通過經營商鋪和銀行已在我國社會佔有一席之地。然而，讓外國人掌控如此關鍵的服務行業存在安全隱患。出於國家安全考慮，我們必須實現分銷網絡的更均衡分配。"
 PHI_encourage_chinese_immigration: "鼓勵中國移民"
 PHI_encourage_chinese_immigration_desc: "華商在開設小企業和店鋪方面展現出卓越的創業精神。我們應充分利用這股湧入的人才和資金，鼓勵該領域實現更多增長。"
 PHI_japanese_observers: "日本觀察員"
 PHI_japanese_observers_desc: "隨著我們兩國關係日益緊密，日本人已同意向我國派遣一支軍事分隊。如此一來，他們就能在友好環境中親身瞭解歐式指揮體系如何運作，我們也可以學習他們卓越的戰鬥技能，並將這些經驗傳授給各級官兵。"
 PHI_one_observer_advisor_focus_tt: "完成§Y$PHI_japanese_advisors$§!和§Y$PHI_japanese_observers$§!其中一項時的效果："
 PHI_both_observer_advisor_focus_tt: "完成§Y$PHI_japanese_advisors$§!和§Y$PHI_japanese_observers$§!兩項時的效果："
 PHI_treaty_of_manila: "馬尼拉條約"
 PHI_treaty_of_manila_desc: "[IndependentOrNot]"
 PHI_treaty_of_manila_subject_desc: "漫長的獨立鬥爭已接近尾聲。從反抗西班牙的革命，到與美國艱苦的戰爭，再到作為自治領的漫長歲月，菲律賓一路堅持了過來。隨著《馬尼拉條約》的簽署，我國終於成為一個自由且擁有主權的國家，其獨立地位獲得了世界的正式承認。"
 PHI_treaty_of_manila_independent_desc: "雖然我們已經獨立，但國際上仍有許多國家尚未承認我們的獨立地位。通過簽署《馬尼拉條約》，我們獲得了這種認可，從而能夠在國際舞臺上與其他所有國家平起平坐。"
 PHI_manila_tag_tt: "§Y[PHI.GetName]§!將被稱為§Y菲律賓§!"
 PHI_universal_sufferage: "普選權"
 PHI_universal_sufferage_desc: "憲法通過後，菲律賓人民就是否在菲律賓全國實行普選權進行了全民公投。結果顯示，91%的人表示贊成，因此投票權已正式擴大至全體民眾。"
 PHI_modernization: "現代化"
 PHI_modernization_desc: "我們的工業發展長期落後於其他亞洲國家。如今我們既然已獲得獨立，則必須向世界展示我們的潛力，為那些希望推動經濟機械化的人提供資源和政策空間。"
 PHI_revision_of_taxation_laws: "修改稅法"
 PHI_revision_of_taxation_laws_desc: "如今既然已脫離了美國，我們需要制定自己的稅法，從而擴大稅基，增加政府收入，進而將這些收入重新投入到基礎設施、福利、軍事及其他發展計劃等國家服務中。"
 PHI_bill_of_rights_for_veterans: "退伍軍人權利法案"
 PHI_bill_of_rights_for_veterans_desc: "許多菲律賓人在戰爭期間服役，我們必須確保返鄉人員得到妥善照顧。如果我們能照顧好退伍軍人，當人們看到參軍是可靠的職業選擇時，就能為未來持續輸送充足的人力。"
 PHI_rehabilitation_finance_corporation: "重建金融公司"
 PHI_rehabilitation_finance_corporation_desc: "我們的國家遭受了嚴重破壞，城市淪為廢墟，道路被炸燬，工業設施遭到摧毀，鐵路系統被蓄意破壞。重建需要時間和資金，但若不重建，我們國家將付出更慘重的代價。"
 PHI_department_of_foreign_affairs: "設立外交部"
 PHI_department_of_foreign_affairs_desc: "我國作為一個國際舞臺上獨立自主的實體，如今需要對自己的外交行動負責。我們必須成立一個專門負責處理外交事務的外交部門，並在全球各地派遣外交人員。"
 PHI_economic_nationalism: "經濟國家主義"
 PHI_economic_nationalism_desc: "既然我們已能完全掌控自己的未來，現在也該掌控我們的經濟了。我們手頭有許多工具，比如關稅、監管法規以及貨物和資本流動管控。我們需要充分利用這些手段，以此展現菲律賓經濟的真正強韌性。"
 PHI_bell_trade_act: "貝爾貿易法案"
 PHI_bell_trade_act_desc: "貝爾貿易法案也被稱為《菲律賓貿易法案》，負責規範[PHI.GetName]與[USA.GetName]之間的貿易。這包括一攬子金融投資計劃、優惠貿易和關稅協定。此外，該法案還允許美國企業大規模獲取菲律賓資源，這些條款引發一定擔憂，但經評估後認為其他收益足以抵消這一風險。"
 PHI_pearl_of_the_orient_seas: "東方海洋的明珠"
 PHI_pearl_of_the_orient_seas_desc: "首批西班牙探險家曾用富有浪漫色彩的語句來描繪他們剛剛發現的這片土地，儘管有渲染成分，卻沿用至今。儘管我們的島嶼歷經磨難與創傷，它始終保持著與本地孕育的珍珠相媲美的美麗風貌。"
 #PHI_join_co_pro: "Join Co-Prosperity Sphere"
 #PHI_join_co_pro_desc: ""
 #PHI_join_allies: "Join Allies"
 #PHI_join_allies_desc: ""
 PHI_united_states_army_forces_in_the_far_east: "美軍遠東部隊"
 PHI_united_states_army_forces_in_the_far_east_desc: "美軍菲律賓司令部長期以來一直是美國在菲律賓的軍事指揮機構，但隨著緊張局勢的加劇，是時候將其擴編為更大規模的美軍建制部隊。這將需要建立新的指揮結構，並從美國本土調撥大量軍官與士兵。"
 PHI_send_a_share_of_THIS_navy_to_ROOT_tt: "派遣部分[THIS.GetAdjective]海軍至[ROOT.GetNameDef]。"
 PHI_military_requisitions: "軍需徵用"
 PHI_military_requisitions_desc: "為了推動這一軍事力量的快速擴張，我們必須從美國的軍需倉庫調撥大量武器和裝備，這樣才能維持一支裝備精良、擁有最先進美式武器的部隊。"
 PHI_usaffe_headquarters: "美軍遠東部隊總部"
 PHI_usaffe_headquarters_desc: "新的遠東司令部將需要一個合格的總部部門，由美國陸軍的頂尖參謀軍官配備和管理。我們可以徵召退役指揮官，也可以給年輕軍官提供實戰經驗的機會。"
 PHI_permanent_usa_air_bases: "建立永久的[USA.GetAdjective]空軍基地"
 PHI_permanent_usa_naval_bases: "建立永久的[USA.GetAdjective]海軍基地"
 PHI_permanent_usa_land_bases: "建立永久的[USA.GetAdjective]陸軍基地"
 PHI_small_arms_and_artillery_requisition: "徵用輕武器和火炮"
 PHI_small_arms_and_artillery_requisition_desc: "雖然最基本的裝備已經到位，但為了真正武裝我們正在組建的部隊，我們還需要調撥更多各種口徑的槍械。"
 PHI_filipino_repatriation_act: "菲律賓遣返法案"
 PHI_filipino_repatriation_act_desc: "根據《泰丁斯‑麥克杜菲法案》，菲律賓走向獨立的同時，其中加入了嚴厲限制菲律賓人移民美國的條款。我們不希望看到家庭分離，因此將提供免費單程回國航程。"
 PHI_american_capital_injection: "美國資本注入"
 PHI_american_capital_injection_desc: "美國以投資著稱，因此讓我們引入這一資本源泉，並將其投放到菲律賓經濟中。這些資本家企業家在沒有政府直接干預的情況下，誰知道能創造出怎樣的奇蹟？"
 PHI_appoint_macarthur: "任命麥克阿瑟"
 PHI_appoint_macarthur_desc: "自1935年以來，道格拉斯·麥克阿瑟將軍一直擔任菲律賓政府的顧問，但現在是時候讓他發揮更正式的作用，指揮駐遠東美軍了。"
 PHI_united_states_asiatic_fleet: "美國亞洲艦隊"
 PHI_united_states_asiatic_fleet_desc: "美國陸軍並非唯一對遠東感興趣的軍種，海軍同樣如此。馬尼拉灣是部署美國亞太艦隊的完美基地，也是提升其能力的理想樞紐。"
 PHI_far_east_air_force: "遠東空軍"
 PHI_far_east_air_force_desc: "雖然菲律賓更熟悉陸軍和海軍力量，但這並不妨礙我們擴展空軍力量。遠東空軍應當駐紮於此，我們還需擴建機場，以容納更多、更大型的飛機，從而更接近潛在威脅的本土進行打擊。"
 PHI_bring_in_eisenhower: "邀請艾森豪威爾"
 PHI_bring_in_eisenhower_desc: "與麥克阿瑟相似，自1935年以來，德懷特·D·艾森豪威爾也一直擔任菲律賓政府的顧問。麥克阿瑟現已正式將這位頗有前途的軍官納入其幕僚。雖然兩人之間據稱存在性格摩擦，但或許正是這種性格與領導風格的差異，能形成互補，從而更好地保衛國家。"
 PHI_police_chief_eisenhower: "警察局長艾森豪威爾"
 PHI_police_chief_eisenhower_desc: "隨著奎松市被確立為新首都，[PHI.GetLeader]決定需要一位高調的警察局長。總統與艾森豪威爾關係良好，認為只要條件合適，他就能被說服接受這一職位，從而永久與菲律賓事業綁定在一起。"
 PHI_eisenhower_stays_tt: "§Y德懷特·D·艾森豪威爾§!將留在菲律賓，且[USA.GetNameDef]不能再將其召回"
 PHI_mariveles_naval_base: "馬裡韋萊斯海軍基地"
 PHI_mariveles_naval_base_desc: "馬尼拉雖已有基礎海軍設施，但潛力遠不止如此。我們應首先擴建位於巴丹半島一側的馬裡維萊斯海軍基地，這座深水港可以容納更先進的造船與維修設施。"
 PHI_gunboat_diplomacy: "炮艦外交"
 PHI_gunboat_diplomacy_desc: "我們是一個島國，應當具備令敵人聞風喪膽的海軍實力——如果他們還不懼怕我們，那麼當菲律賓艦隊出現在他們的主要港口並接管航運時，他們一定會害怕。"
 PHI_trucks_and_transport_requisition: "卡車和運輸征用"
 PHI_trucks_and_transport_requisition_desc: "現在武器已源源不斷流入菲律賓，是時候考慮在野戰中維持軍隊作戰的後勤問題了。得益於美國蓬勃發展的汽車和火車工業，從中徵用部分車輛用於軍事應該不成問題。"
 PHI_investment_fund: "投資基金"
 PHI_investment_fund_desc: "儘管私人投資非常受歡迎，但為了最大限度地利用這些資本，應該將其集中在一個由熟知菲律賓經濟實際情況的專業人士管理的中央基金中，以便將投資流向最具回報的領域。"
 PHI_subordinate_philippine_department: "隸屬菲律賓軍區"
 PHI_subordinate_philippine_department_desc: "在美軍駐菲律賓遠東司令部成立之前，美國在菲律賓的軍事存在就是“菲律賓司令部”。儘管其指揮結構已顯陳舊，但應對其進行更新與現代化改造，以便更好地將本地部隊納入美軍的指揮體系。"
 PHI_expand_us_bases: "擴大美軍基地"
 PHI_expand_us_bases_desc: "現代戰爭由飛機主導，這在菲律賓的處境下尤為明顯。確保群島安全的最佳方法就是掌握制空權，這還能讓我們巡邏周邊海域。為此，我們必須大幅擴建本土空軍基地。"
 PHI_war_plan_rainbow_five: "彩虹五號作戰計劃"
 PHI_war_plan_rainbow_five_desc: "在確保自身安全後，我們便可將目光投向更廣闊的戰爭舞臺，找到最適合我們的位置。我們對戰爭努力能做出不少貢獻，必須確保將資源投入最需要的地方。"
 PHI_aircraft_requisition: "徵用飛行器"
 PHI_aircraft_requisition_desc: "我們至今未能發展出可觀的本土航空工業，完全依賴美國提供飛機。如今需求增長，我們必須向美國贊助方申請更多的飛機。"
 PHI_luce_celler_act: "盧斯-塞勒法案"
 PHI_luce_celler_act_desc: "《盧斯塞勒法》是美國的一項移民法案，提高了菲律賓移民的配額，並首次允許菲律賓人成為美國公民。這標誌著跨太平洋移民新時代的開始。"
 PHI_utang_na_loob: "內心的債務"
 PHI_utang_na_loob_desc: "“烏唐納洛布”是菲律賓的一種文化價值觀，可譯為“感恩之債”或“內心的債務”，代表著對曾在困難時提供重要幫助的人懷有深刻的情感與道德義務，通常通過回報服務、支持或忠誠來體現。"
 PHI_utang_na_loob_last_stand_tt: "§G-25%§!花費，併為§Y最後防線§!提供§G+5%§!防禦加成\n"
 PHI_declare_military_emergency: "宣佈軍事緊急狀態"
 PHI_declare_military_emergency_desc: "這個國家正滑向法西斯主義的深淵，但果斷的行動阻止了最終的墜落。顯然，現在威脅無處不在，阻止這些威脅是我們的責任。沒有什麼不可為，沒有什麼不合法。民主必須存續下去。"
 PHI_military_emergency_flag: "宣佈軍事緊急狀態"
 PHI_usa_catchup_tt: "這等同於已完成美國經濟國策目標之一，可用於後續物資申請。"
 PHI_weapons_of_war: "戰爭武器"
 PHI_weapons_of_war_desc: "為最大程度地捍衛我們的民主理念，我們必須確保裝備上最頂尖、最具殺傷力的武器。我們聽聞了某項“曼哈頓計劃”的傳聞。碰巧有位菲律賓女性參與了這個項目，而且她為人正直忠誠，願意幫助我們推進自己的項目。"
 PHI_preemptive_strikes: "先發制人打擊"
 PHI_preemptive_strikes_desc: "敵人無處不在，我們已被包圍。因此，我們得為不可避免的事做好準備。更明智的做法是，我們得準備先發制人，讓那所謂不可避免的事不再發生，而非只是規避。畢竟，只有消除所有威脅來源，我們才能真正安全。"
 PHI_sunset_empires: "夕陽帝國"
 PHI_sunset_empires_desc: "對我們威脅最大的，是旭日帝國和不落日帝國。所以，我們必須確保有足夠的子彈，好讓我們能在太陽照射不到的地方作戰。"
 PHI_land_of_the_setting_sun: "落日之地"
 PHI_land_of_the_setting_sun_desc: "我們已做好準備，現在正是發動攻擊的時刻！是時候讓太陽在[JAP.GetNameDef]最後一次落下，且永不再升起。"
 PHI_sea_of_cobalt: "鈷藍之海"
 PHI_sea_of_cobalt_desc: "只要給我足夠的核武器，我就能創造出一片鈷海，讓任何敵人都無法蹚過這片海域來攻擊我們。"
 PHI_the_sun_has_set: "太陽已落"
 PHI_the_sun_has_set_desc: "英國長期以來一直是美國——額，菲律賓的威脅。我們在1779年擊敗了他們，他們至今都未原諒我們。是時候讓他們認清自己在世界上的位置了。"
 PHI_traitors_back_home: "叛徒返鄉"
 PHI_traitors_back_home_desc: "[USA.GetNameDef]已變得軟弱怯懦。那裡無人願意承擔必須完成的任務，因此需要由我們肅清政客與懦夫，為美國人民奪回那座“山巔閃耀之城”。"
 PHI_end_colonialism: "終結殖民主義"
 PHI_end_colonialism_desc: "殖民主義是一大毒瘤，任其潰爛已久。所有人都應享有自由民主生活的權利，而我們將不得不以武力強制推行這一點。"
 PHI_cobalt_supremacy: "鈷礦霸權"
 PHI_cobalt_supremacy_desc: "我成了死神，世界的毀滅者。"
 PHI_subject_surrender: "附庸國……投降"
 PHI_subject_surrender_desc: "“顯然，這些部隊的駐軍最終將被空襲和炮火摧毀，坦克支援的步兵已徹底擊潰我們。”這段廣播來自我們最後的抵抗據點之一，由此明確可見，我們已失去了對[PHI.GetNameDef]的控制。"
 PHI_subject_surrender_tt: "§R失去對整個[327.GetName]的控制將完成該國策。§!"
 PHI_i_shall_return: "我將歸來"
 PHI_i_shall_return_desc: "這是道格拉斯·麥克阿瑟將軍撤離[PHI.GetNameDef]時說的話，此後他也常把這句話掛在嘴邊。現在，是我們提供必要裝備與工具將其變為現實的時候了。"
 PHI_soldiers_in_hiding: "隱匿士兵"
 PHI_soldiers_in_hiding_desc: "儘管我們已在[PHI.GetNameDef]正式戰敗，但戰爭並未結束。我方大批部隊拒不執行投降命令，仍在隱蔽處繼續抗爭。我們知曉有幾位傑出的軍官挺身而出，正在周邊擴建抵抗組織——我們應竭盡所能為他們提供支援以確保成功。"
 PHI_if_any_state_occupied_tt: "每個被佔領的核心地區（當前：0）："
 PHI_hukbalahap: "虎克軍"
 PHI_hukbalahap_desc: "抗日人民軍，簡稱虎克軍，是由呂宋中部農民組成的共產主義游擊運動，已被證明是[PHI.GetNameDef]全境最出色的抵抗力量之一。他們組織有序、鬥志高昂，但缺乏武器。我們應該給他們弄些武器來。"
 PHI_if_communist_tt: "如果完成了§Y$PHI_partido_komunista_ng_pilipinas_coup$§!："
 PHI_local_resistance: "地方抵抗力量"
 PHI_local_resistance_desc: "佔領者的政策不得人心，我們可以利用這股普遍存在的不滿暗流。每個人都能盡一份力，農民為敵軍士兵藏匿物資，漁民運送反抗者，士兵訓練他人作戰技巧，商人提供裝備和資金，這一切都是為了支援抵抗運動。"
 PHI_if_chinese_immigration_tt: "如果完成了§Y$PHI_encourage_chinese_immigration$§!："
 PHI_submarine_supplies: "潛艇補給"
 PHI_submarine_supplies_desc: "敵軍在海上的存在極為廣泛，這使得從國外獲取支援變得極為困難。我們可以徵用一些潛艇來提供秘密支援，在我們的群島中有大量隱蔽點可供利用，還有許多願意冒險的漁民能夠將物資運送到有需求的島嶼。"
 PHI_the_hunters: "獵人組織"
 PHI_the_hunters_desc: "菲律賓軍事學院的學員在佔領軍關閉該機構後逃入隱匿之地。自那以後，他們組建了“獵人”組織，並充分發揮自身技能，訓練當地人掌握戰鬥技巧與情報收集，積極在馬尼拉一帶對敵人展開鬥爭。"
 PHI_will_gain_hunters: "完成§Y$PHI_grassroot_guerillas$§!後將獲得3個“獵人”儲備軍官訓練團旅。"
 PHI_the_cry: "吶喊"
 PHI_the_cry_desc: "“普加德拉溫的呼聲”是反抗西班牙帝國的菲律賓革命的號召口號。如今，這是另一場為自由而戰、甚至關乎我們生存的戰爭，是時候再一次高舉我們的口號，戰鬥！"
 PHI_will_gain_hukbalahap: "完成§Y$PHI_grassroot_guerillas$§!後將獲得3個虎克軍旅。"
 PHI_juramentado: "胡拉門塔多"
 PHI_juramentado_desc: "胡拉門塔多是誓死抗擊入侵者的摩洛與蘇祿戰士。雖然古老的儀式已然消逝，但無畏犧牲的精神依然存在。通過繼承這一傳統，我們可以鼓舞抵抗戰士發動毀滅性攻擊，讓佔領者心生恐懼，也讓我們的人民更加振奮。"
 PHI_will_gain_juramentado: "完成§Y$PHI_grassroot_guerillas$§!後將獲得3個胡拉門塔多旅。"
 PHI_exile_support: "流亡者支援"
 PHI_exile_support_desc: "許多菲律賓人居住在海外，我們可以號召他們提供資金和物資支持。這些資源可以秘密運送給英勇的抵抗戰士，或用於組建菲律賓戰鬥部隊，以助於未來的解放。"
 PHI_grassroot_guerillas: "草根游擊隊"
 PHI_grassroot_guerillas_desc: "全國範圍內有大量抵抗組織在地下運作，但它們缺乏一個集中統一的指揮體系來協調所有努力，將力量匯聚到最脆弱的敵方目標上。人民的鬥志是存在的，只需正確地加以整合與引導。"
 PHI_grassroot_guerillas_tt: "為每個已完成的先決國策生成3支游擊旅。解放區以及敵軍稀少地區將優先作為部署地點。"
 PHI_reconquista: "重奪失地"
 PHI_reconquista_desc: "從呂宋的群山到棉蘭老的叢林，我們的人民在佔領下流血忍耐。如今，是時候收復我們的土地，一城一島，逐步光復。正如祖先們曾抵抗征服者，如今我們也要驅逐侵略者，恢復國家。這是我們的“收復失地運動”——菲律賓的最後鬥爭。"
 PHI_rebuild_sakdalistas: "重建薩克達爾黨"
 PHI_rebuild_sakdalistas_desc: "1935年5月2日夜晚，六萬五千名裝備簡陋的農民打破了菲律賓的寧靜，他們試圖推翻美國支持的政府。雖然這次起事失敗，但城鄉貧富差距不斷擴大所引發的憤怒依然在暗中醞釀，隨時可能被利用。"
 PHI_slippery_slope: "滑向深淵"
 PHI_slippery_slope_desc: "日本在我國影響力的上升，已點燃了不滿的火種。我們只需袖手旁觀，任由對腐敗的民主資本主義制度中固有貪婪的憤怒爆發，留下一個真空，足以讓更激進的意識形態樂於填補。"
 PHI_assassination_of_quezon: "暗殺奎松"
 PHI_assassination_of_quezon_desc: "不幸的事實是，奎松“總統”長期以來一直在阻礙菲律賓的發展。這個美國的走狗竭盡全力，阻止菲律賓民族意志的實現。他為自己構建的體制，使其對民主變革免疫，因此我們必須通過其他手段推動政治進程。"
 PHI_assassination_of_quezon_tt: "§R一項計劃已付諸實施，目標是將奎松從政壇上永久清除。§!"
 PHI_eisenhower_steps_in_flag: "艾森豪威爾已介入"
 PHI_makapili: "菲律賓愛國者協會"
 PHI_makapili_desc: "法西斯主義在菲律賓的崛起極為迅速，但不幸的是，這一過程伴隨著一定程度的混亂。我們的海外朋友願意提供武器與訓練，以組建一支“和平軍”，來維持秩序、打擊土匪、鎮壓叛亂。"
 PHI_sakdalista_exiles_returned_flag: "薩克達爾派流亡者已歸來（事件）"
 PHI_form_the_executive_commision: "成立執行委員會"
 PHI_form_the_executive_commision_desc: "一個暗中的領導集團一直在幕後操縱局勢，但隨著法西斯主義理想在菲律賓掌權，現在是他們走向臺前，登上政府首腦的位置的時候了。"
 PHI_aguinaldos_coup: "爭奪領導權"
 PHI_aguinaldos_coup_desc: "隨著政權接管後的混亂逐漸平息，行政委員會內部的各派人物開始爭奪權力。專制政權需要鮮明的最高權威來統治，支持的力量正逐漸匯聚。"
 PHI_resolve_interregnum_tt: "§G這將結束空位期，並允許任命一位新的領導人。§!"
 PHI_secure_japanese_guarantees: "確保日本擔保"
 PHI_secure_japanese_guarantees_desc: "如果我們想加快脫離美國獨立的進程，就必須為戰爭的現實可能做好準備，因為他們不太可能輕易放走自己的附屬國。我們應當聯繫日本的支持者，在敵對行動發生時爭取更多正式的軍事援助。"
 PHI_war_of_independence: "獨立戰爭"
 PHI_war_of_independence_desc: "“給我自由，或給我死亡！”是時候讓殖民壓迫者永遠離開我們的海岸了。\n\n一個新的太陽正在菲律賓升起。"
 PHI_will_take_peace_decision: "如果§Y[ROOT.GetNameDef]§!成功自衛一年，§Y[USA.GetName]§!將採用此決議，附近島嶼基地失守或捲入其他戰爭時則將提前觸發，"
 PHI_second_philippine_republic: "菲律賓第二共和國"
 PHI_second_philippine_republic_desc: "雖然尚未完全實現，但我們的獨立之路已近在眼前。下一步是建立新共和國，正式推動分離，並開始籌建新政府的各項制度——當然，還要設計一面新國旗。"
 PHI_second_republic_tag_tt: "§Y[PHI.GetName]§!將改稱為§Y菲律賓第二共和國§!"
 PHI_election_overturned: "選舉翻盤"
 PHI_election_overturned_desc: "1935年的選舉以壓倒性優勢支持曼努埃爾·奎松，優勢之大甚至有些過分。埃米利奧·阿奎納多提出了嚴重關切，並已向美方反映，美方承諾將對可能的選舉操控展開徹底調查。"
 PHI_hispanidad_filipina: "西班牙化的菲律賓"
 PHI_hispanidad_filipina_desc: "儘管1896—1898年反對西班牙帝國的獨立戰爭造成了巨大裂痕，許多菲律賓人仍視自己為西班牙語系散居群體的一部分，而西班牙本土持續的緊張局勢也引起了他們的關注。"
 PHI_spanish_refugees: "西班牙難民"
 PHI_spanish_refugees_desc: "由於國內內戰的蹂躪，許多西班牙公民前往他處避難。隨著我們與西班牙方面的關係回暖，大量西班牙人來到我們的群島尋求庇護。"
 PHI_if_supported_scw_side_lost_tt: "如果我們派遣志願軍支持的§Y西班牙內戰§!某一方戰敗："
 PHI_if_supported_scw_side_wins_tt: "如果§Y西班牙內戰§!中的某一方在接收我方誌願兵後獲勝，§Y$PHI_reconciliation_with_spain$§!會有更好的效果。"
 PHI_reconciliation_with_spain: "與西班牙和解"
 PHI_reconciliation_with_spain_desc: "[ReconciliationWithSpain]"
 PHI_reconciliation_with_spain_winner: "我們與西班牙勝利政府並肩作戰的志願軍已締造了兩國間更牢固的新友誼，我們應該在未來以更正式的方式利用這一點，使兩國更加緊密地合作。"
 PHI_reconciliation_with_spain_loser: "儘管我們的志願軍曾與他們作戰，西班牙政府仍不情願地承認了我們在文化與宗教上的共同紐帶，並認為有必要在強調跨西班牙全球統一的宣傳中包括這些內容。"
 PHI_reconciliation_with_spain_neutral: "西班牙對我國的發展產生了無可置疑的影響，但由於殖民的歷史，近代關係多呈對立。儘管如此，我們與他們確實有許多共通之處，只需在平等基礎上開展對話。"
 PHI_hispanic_overtures: "西班牙裔倡議"
 PHI_hispanic_overtures_desc: "我們不是唯一與西班牙裔有聯繫的國家，事實上南美洲許多國家都有這種聯繫，我們也一直與其中幾個國家保持著積極的關係。我們應該主動接觸，努力使這些聯繫更加正式。"
 PHI_revolutionary_regrets: "革命的遺恨"
 PHI_revolutionary_regrets_desc: "在西班牙統治下，我們始終是西班牙的臣民或公民；如今在美國治下，我們不過是他們出口商品的消費市場，若不算賤民的話，因為他們從未讓我們成為美國任何一個州的公民。"
 PHI_royal_exiles: "流亡的王室"
 PHI_royal_exiles_desc: "西班牙王室經歷了多次被迫或自願的退位以及被剝奪繼承權的事件，然而這個家族依然存在，目前正在尋求庇護。如果我們能為他們提供庇護，將在西語世界獲得極高的聲望。"
 PHI_reino_de_filipinas: "菲律賓王國"
 PHI_reino_de_filipinas_desc: "一切拼圖都已就位，西班牙自身四分五裂，菲律賓已崛起為西語世界的核心，我們只需加冕儀式來鞏固地位，這將是我們歷史上的加冕時刻。"
 PHI_unlock_unification_decision_tt: "解鎖決議：§Y提議與陣營成員統一§!"
 PHI_unlock_conquer_decision_tt: "解鎖決議：§Y強制整合西班牙語國家§!"
 PHI_unlock_mutual_assistance_with_spain_tt: "解鎖決議：§Y提議與[SPR.GetNameDef]簽訂互助條約§!"
 PHI_war_for_the_oceans: "海洋戰爭"
 PHI_war_for_the_oceans_desc: "歷史上我們一直是航海民族，如今是時候奪回我們的天賦權利，並佔領我們最熟悉的地域——海洋。"
 PHI_assume_the_naval_burden: "承擔海戰重任"
 PHI_assume_the_naval_burden_desc: "日本已陷入陸上衝突，而我們的專長仍在海上。我們應主動承擔海上戰事，好讓他們全力投入其他戰場。"
 PHI_develop_naval_infrastructure: "發展海軍基建"
 PHI_develop_naval_infrastructure_desc: "隨著我們的海洋雄心不斷增強，造船能力也必須相應擴大。"
 PHI_reunite_madagascar: "統合馬達加斯加"
 PHI_reunite_madagascar_desc: "儘管相隔遙遠，馬達加斯加原住民卻是南島與非洲的混血後裔，與我們有著驚人的親近血脈。我們應拉近彼此的距離。"
 PHI_claim_to_core_tt: "解鎖§Y獲得核心§!的決議，在我們重新控制這些地區後即可執行。"
 PHI_take_pacific_islands: "奪取太平洋島嶼"
 PHI_take_pacific_islands_desc: "菲律賓本就是一個群島國家，只需稍加想像，就能理所當然地將我們的疆域向東延伸至太平洋更遠之處。"
 PHI_malayo_polynesia: "馬來-波利尼西亞"
 PHI_malayo_polynesia_desc: "我們歷史上與馬來半島和東印度群島有著緊密的文化、歷史和民族聯繫。鑑於這種兄弟般的關係，我們應賦予他們與我們人民同等的權利和特權。"
 PHI_war_for_oceania: "大洋洲戰爭"
 PHI_war_for_oceania_desc: "大洋洲由海洋本身定義，但我們的民族自古以來就在這片水域航行。是時候將這些島嶼納入我們日益壯大的國家了。"
 PHI_conquest_of_japan: "征服日本"
 PHI_conquest_of_japan_desc: "長期以來，日本一直是我們在該地區海上控制權方面的主要競爭對手，現在是時候結束這場競爭，一勞永逸地確立我們對他們的主導地位。"
 PHI_filipino_polynesian_reunification: "太平洋之主"
 PHI_filipino_polynesian_reunification_desc: "這片世界由海洋主宰，散佈著零落的陸地與遙遠的島嶼，而我們已將其全部征服。由此，我們確立了作為太平洋主人的正當地位。"
 PHI_polynesia_tag_tt: "§Y[PHI.GetName]§!將獲得新國旗與新國號。"
 PHI_petition_the_supreme_court: "向最高法院請願"
 PHI_petition_the_supreme_court_desc: "1932年，最高法院正式禁止了共產主義，但我們發現了一項技術性漏洞，可以重新使該運動合法化，我們只需簽署並提交請願書即可。"
 PHI_legalize_the_communist_party: "使共產黨合法化"
 PHI_legalize_the_communist_party_desc: "既然共產主義運動已重新獲得合法地位，下一步便是讓黨重新走入公眾視野，公開活動，並著手擴大組織。"
 PHI_return_of_the_exiles: "流亡者歸來"
 PHI_return_of_the_exiles_desc: "東南亞許多左翼分子因受殖民主義與資本主義勢力威脅而被迫流亡。我們可以向他們敞開國門，為他們提供一個安全的避風港。"
 PHI_support_for_chinese_communists: "支援中國共產黨"
 PHI_support_for_chinese_communists_desc: "共產黨人在中國繼續與日軍和軍閥作鬥爭。我們可以通過黃河走私人力和物資支援他們的鬥爭，或至少助長該地區的戰火。"
 PHI_the_red_sun_over_manila: "赤日照耀馬尼拉"
 PHI_the_red_sun_over_manila_desc: "菲律賓國內共產主義思潮不斷升溫，如今首次出現了真正取得政權的機會。失敗的薩克達利斯塔起義提醒我們，在美方支持的政府面前，武裝暴動是徒勞的，因此我們必須尋求更具政治性的途徑來奪取政權。"
 PHI_partido_komunista_ng_pilipinas_coup: "菲律賓共產黨政變"
 PHI_partido_komunista_ng_pilipinas_coup_desc: "最初只是農民的總罷工，最後蔓延到工廠的同志們也投入這場運動。人民已經發聲，國民大會已落入共產黨之手。各工會與集體正急於選出新的中央委員會，更重要的是，決定誰將擔任新總書記。"
 PHI_national_confederation: "全國聯合會"
 PHI_national_confederation_desc: "既然我們已取得政權，現在是鞏固統治的時候了。作為菲律賓領先的農民組織，“菲律賓全國農民聯合會”應當是我們優先爭取的對象。"
 PHI_anti_intervention_strategies: "反干涉戰略"
 PHI_anti_intervention_strategies_desc: "隨著我們與美國之間的緊張局勢升級，我們必須盡其所能確保這個新生共產國家的長期生存，無論是通過有選擇的讓步，還是在全面敵對爆發前儘可能從美國手中獲取資源。"
 PHI_rally_the_fisherfolk: "團結漁民"
 PHI_rally_the_fisherfolk_desc: "作為一個群島國家，我們的漁業發達、人員眾多。因此，我們應將目光投向這些“海上農民”，將他們吸納進共產主義運動，發揮他們在海上的潛在力量。"
 PHI_smugglers: "走私者"
 PHI_smugglers_desc: "我們的國家由無數島嶼組成，藏有許多世代以來人民用於走私的隱秘角落。我們應利用這些經驗，使其為我們的事業所用！"
 PHI_struggle_conference: "鬥爭會議"
 PHI_struggle_conference_desc: "我們的共產主義運動面臨眾多矛盾與衝突，必須有更組織化、更正式的回應。因此，我們需要召開第一次“鬥爭會議”，將所有問題擺上檯面，妥善解決。"
 PHI_sanction_piracy: "合法化海盜行為"
 PHI_sanction_piracy_desc: "作為群島國家，我們擁有無數小型船隻和敢於冒險的青年。我們應恢復“私掠許可制度”，為這些“海上冒險者”提供法律依據，讓他們攻擊敵人後迅速返回避風港，帶回戰利品。"
 PHI_infiltrate_chinese_ports: "滲透中國港口"
 PHI_infiltrate_chinese_ports_desc: "碼頭工人是最早投身共產主義運動的群體之一，也是我們最堅定的盟友。我們應將這種精神傳播至中國港口，並以此為跳板進一步支援中國共產黨的鬥爭。"
 PHI_every_non_communist_coastal_warlord: "所有非共產主義且沿海的中國軍閥："
 PHI_maritime_communism: "海洋共產主義"
 PHI_maritime_communism_desc: "許多共產國家集中於陸軍大規模動員，而我們應當動員起自己的“海上力量”，在海洋上展開革命浪潮，進而團結全球人民於“海洋共產主義運動”之下。"
 PHI_pan_pacific_trade_union_secretariat: "泛太平洋工會秘書處"
 PHI_pan_pacific_trade_union_secretariat_desc: "我們雖已收穫共產主義帶來的成果，但該思想不應侷限於本國。我們應將其輸出至東南亞各國，建立“泛太平洋工會秘書處”，以實現互助與共同發展。"
 PHI_comitern: "加入共產國際"
 PHI_comitern_desc: "儘管我們與[SOV.GetNameDef]的聯繫一直較為微弱，但他們在國際舞臺上的力量不容忽視。若我們希望繼續實驗共產主義並將其推廣至他國，就必須團結在同一陣營下，推動社會主義全球理想。"
 PHI_national_defense_act: "國防法案"
 PHI_national_defense_act_desc: "《國防法》於1935年12月21日通過，為菲律賓武裝部隊撥款1600萬比索。現在關鍵在於決定如何、在哪裡花費這筆資金。陸海空三軍都急需投資，我們的國防設施同樣亟需加強。"
 PHI_war_plan_orange: "橙色戰爭計劃"
 PHI_war_plan_orange_desc: "該計劃基本設想是：菲律賓必須繼續作為美國在衝突中的前沿基地。因此，最關鍵的防禦目標應是馬尼拉灣。我們應依據此計劃部署防禦措施，集中兵力守衛這一戰略要地。"
 PHI_beach_defense_strategy: "灘頭防禦戰略"
 PHI_beach_defense_strategy_desc: "只要火力和兵力充足，我們便能守住菲律賓的海岸線。因此，我們應以此為前提製定防禦戰略，確保整個國家都能在長期軍事戰役中發揮作用。"
 PHI_fortify_corregidor: "加固科雷希多島"
 PHI_fortify_corregidor_desc: "科雷希多島位於馬尼拉灣入口處，是控制該灣及其海軍設施的關鍵所在。我們應升級島上的防禦工事，並修建地下設施，以抵禦敵軍長時間的圍攻和空襲炮擊。"
 PHI_fortify_corregidor_bypass_tt: "馬尼拉市無法再建造§Y$bunker$§!和§Y$coastal_bunker$§!。"
 PHI_bastion_bataan: "巴丹要塞"
 PHI_bastion_bataan_desc: "巴丹半島是馬尼拉灣一側的天然防禦地帶。只要控制此地，就能控制誰進出馬尼拉灣及其設施。為確保這一點，我們需要在半島陸地一側設防，並在高地部署炮兵。"
 PHI_bastion_bataan_bypass_tt: "無法在巴丹地區邊界修建更多§Y$bunker$§!，也無法在巴丹和達古潘修建§Y$coastal_bunker$§!"
 PHI_coastal_artillery: "海岸炮兵"
 PHI_coastal_artillery_desc: "作為一個群島，海岸炮兵的目標最多，不僅能打擊海上目標，還能兼顧陸地。我們應優先投資於這些部隊的裝備、訓練和現代化。"
 PHI_the_concrete_battleship: "混凝土戰艦"
 PHI_the_concrete_battleship_desc: "德拉姆堡是馬尼拉灣最令人印象深刻的港口要塞，其外觀酷似戰艦。自1909年起便開始建設，其火力和設施不斷升級。這座老牌要塞被一度稱為“不可通行的戰艦”，它將在現代戰爭中再度重返戰場。"
 PHI_philippine_scouts: "菲律賓偵察部隊"
 PHI_philippine_scouts_desc: "成立於1901年的“菲律賓偵察部隊”是本國服役人數最多的菲律賓本地部隊。我們應繼續支持該單位，為他們提供最好的訓練和裝備，以確保其在保衛祖國中發揮精銳作用。"
 PHI_militarize_the_constabulary: "警察部隊軍事化"
 PHI_militarize_the_constabulary_desc: "根據《國防法》，菲律賓警憲部隊已併入中央陸軍，但事後看來，這或許是個錯誤。新設立的警察力量不足以勝任職責。因此，我們應重新設立警察部隊，並配備軍用武器和訓練，使其既能為國家服務，又能保衛國家。"
 PHI_philippine_army_orchestra: "菲律賓陸軍軍樂團"
 PHI_philippine_army_orchestra_desc: "菲律賓警察部隊軍樂團是世界最傑出的軍事樂團之一，曾獲選為美國總統就職典禮的演奏團體。我們應將其整合進軍隊，利用音樂激發士兵士氣，激勵民族精神，引領士兵奮勇作戰。"
 PHI_philippine_military_academy: "菲律賓軍事學院"
 PHI_philippine_military_academy_desc: "多年來，菲律賓警察部隊學院一直是我國主要的軍官培訓機構，但我們缺乏一所正式的軍事學府。我們應將該學院正式併入陸軍，改組為“菲律賓軍事學院”，專責培養未來的軍事精英。"
 PHI_philippine_division: "菲律賓師"
 PHI_philippine_division_desc: "菲律賓師負責我國群島的防禦，但目前裝備落後、人手不足。我們應尋求外部的指揮經驗，併為部隊配備更先進的武器裝備。"
 PHI_10_year_training_plan: "10年訓練計劃"
 PHI_10_year_training_plan_desc: "根據十年獨立過渡承諾，《國防法》規定要建設一支獨立、自給自足的部隊以保衛本土。內容包括常備軍建設、軍官培訓、預備役創建，以及軍事基礎設施投資。"
 PHI_battalion_combat_teams: "營級戰鬥群"
 PHI_battalion_combat_teams_desc: "戰爭現實表明，我們需要一支更加靈活、可快速適應各種局勢的部隊。營級戰鬥群應具備更鬆散的指揮體系，並被賦予執行小型作戰任務的權限。"
 PHI_battalion_combat_teams_tt: "§Y$category_all_infantry$§!：\n    對人員殺傷：§G+15%§!\n    對裝甲攻擊：§G+15%§!\n    穿甲深度：§G+15%§!\n§Y$category_cavalry$§!：\n    對人員殺傷：§G+10%§!\n    對裝甲攻擊：§G+10%§!\n    穿甲深度：§G+10%§!"
 PHI_mandatory_conscription: "強制徵兵"
 PHI_mandatory_conscription_desc: "保衛[PHI.GetNameDef]是每位公民的責任。因此，所有公民應接受強制徵兵，學習基本戰鬥技能，以備隨時應徵入伍。"
 PHI_self_reliance_defense: "自力更生的國防"
 PHI_self_reliance_defense_desc: "我們長期依賴外國力量來保障安全，但這暴露了嚴重的戰略弱點。我們必須建立自己的國防體系，從發展能夠支持本國軍隊的工業基礎做起。"
 PHI_army_of_the_philippines: "菲律賓陸軍"
 PHI_army_of_the_philippines_desc: "近年來，我軍實現了顯著進步。現在是時候擺脫對外國援助的依賴，昂首挺進一個嶄新而安全的未來。這一未來，將完全由菲律賓人的鮮血與鋼鐵鑄就。我們將自行承擔起國家安全的責任。"
 PHI_army_air_corps: "陸軍航空隊"
 PHI_army_air_corps_desc: "儘管規模和資源有限，陸軍航空兵團仍充滿雄心。考慮到島嶼分散、交通不便，我們應大力發展航空能力，覆蓋更廣闊的地區。"
 PHI_pilot_training_programme: "飛行員培訓計劃"
 PHI_pilot_training_programme_desc: "飛行員是極為重要的資源，而我國航空工業薄弱，飛行員嚴重短缺。我們應與他國達成協議，培訓年輕人成為新一代飛行員。"
 PHI_off_shore_patrol: "近海巡邏隊"
 PHI_off_shore_patrol_desc: "我們的空軍必須具備同時保衛陸地與海洋上空的能力。為此，應發展航程更遠、具備反艦能力的海軍專用飛機，以在敵人抵近前就將其擊退。"
 PHI_expand_airbases: "擴建空軍基地"
 PHI_expand_airbases_desc: "即便盟友希望將空軍部署至本國，或我們具備自行組建空軍的能力，現有場地仍無法容納。我們應立即著手建設新機場和飛行場，方便駐軍部署。"
 PHI_develop_domestic_aircraft_industry: "發展本國航空工業"
 PHI_develop_domestic_aircraft_industry_desc: "依賴盟友雖暫時無礙，但若希望成為一個真正獨立、擁有現代軍力的國家，我們必須投資建設自主的航空工業。可通過補貼扶持本國航空創新者和企業家起步。"
 PHI_if_align_with_japan_tt: "如果完成了§Y$PHI_align_with_japan$§!："
 PHI_if_align_with_the_usa_tt: "如果完成了§Y$PHI_align_with_the_usa$§!："
 PHI_philippine_air_force: "菲律賓空軍"
 PHI_philippine_air_force_desc: "現在是時候承認空軍是獨立於陸軍的兵種了。如此一來，他們在組織和獲取兵員和物資方面將具有更大的靈活性。他們將不再受制於單一服務的需求，而是可以為整體服務。"
 PHI_thats_not_an_island: "那不是一座島嶼！"
 PHI_thats_not_an_island_desc: "儘管群島賦予我們高度靈活性，但也有限制。例如，如果我們需要在本土以外作戰怎麼辦？我們就需要“隨身帶走一座島嶼”，即建立遠征能力，全球出擊。"
 PHI_offshore_patrol: "近海巡邏艦隊"
 PHI_offshore_patrol_desc: "《國防法》亦規定建立海防力量，保障群島安全。這支艦隊不會成為藍水海軍，而是圍繞本土防禦建設。但這也許正是建立強大艦隊的第一步。"
 PHI_marine_corps: "海軍陸戰隊"
 PHI_marine_corps_desc: "我們有豐富的登岸經驗，許多民眾平日便乘船往來島嶼工作或探親。我們應利用這些經驗，打造世界一流的海軍陸戰隊，能在任意海岸投送戰力。"
 PHI_cavite_naval_base: "卡維特海軍基地"
 PHI_cavite_naval_base_desc: "卡維特船塢位於馬尼拉對岸，是我國最有潛力發展的深水港口與船廠。已有初步設施，若加大投資，將成為我軍控制東南亞海域的關鍵戰略基地。"
 PHI_pt_boat_development: "魚雷艇研發"
 PHI_pt_boat_development_desc: "身為群島國家，我們更適合運用體積小、靈活性強的船隻穿梭在島嶼水道間，對大型敵艦發動騷擾與打擊。我們應引進魚雷艇戰術經驗，發展自己的“巡邏艇”海軍力量。"
 PHI_pt_boat_development_tt: "§Y屏衛艦§!的精通度獲得速度§G+10%§!"
 PHI_pt_boat_development_2_tt: "§Y巡邏船隻§!的精通度獲得速度§G+20%§!"
 PHI_mosquito_fleet: "蚊式艦隊"
 PHI_mosquito_fleet_desc: "一顆魚雷或炮彈可摧毀一艘艦船。因此，我們不能只依靠單艘戰艦，而應建立一支“蜂群艦隊”。他們或許能擊沉我們一艘、十艘、百艘——但絕無法摧毀我們全部。而我們只需其中一艘命中目標，即可贏得戰果！"
 PHI_devil_boats: "魔鬼船"
 PHI_devil_boats_desc: "我們的巡邏艇以其速度和勇氣聞名，尤以猛烈打擊後消失在海上迷霧中的能力著稱。我們的敵人因此學會了避開我們的海岸，以免碰上這些“魔鬼船”。"
 PHI_fast_attack_craft: "快速攻擊艇"
 PHI_fast_attack_craft_desc: "巡邏艇的理想改進是速度和火力得到了顯著提升的快速攻擊艇，這些巡邏艇可以轟鳴於我們的海岸線，給靠得太近的敵人帶來毀滅，並在他們的援軍到來前撤離。"
 PHI_coastal_defense_ships: "岸防艦隊"
 PHI_coastal_defense_ships_desc: "我們的艦隊已發展壯大，如今我們擁有了組建和維護更大船隻的基建和手段。我們的首要目標仍是保護海岸，但我們現在利用我們的地理優勢，設計出可以與地方主力艦作戰的艦船。"
 PHI_philippine_naval_patrol: "菲律賓海上巡邏"
 PHI_philippine_naval_patrol_desc: "作為一個包含眾多島嶼的國家，要想在國際舞臺上贏得認可，我們的艦隊必須能保護我們的海岸。要做到這一點，我們必須改進更新我們的指揮和控制體系，以達到現代艦隊的預期。"
 PHI_thalassocracy: "海權主義"
 PHI_thalassocracy_desc: "“擁有國家的軍隊”這一概念廣為人知，並經常被用來指代普魯士。而我們應該成為“擁有國家的海軍”，建設一支哪怕巔峰的大英帝國也會相形見絀的艦隊。"
