 JAP_male_leader_3_text: "他"
 JAP_endorse: "支持"
 JAP_ignore: "鎮壓"
 JAP_interfered_in_imperial_influence_flag: "$JAP_imperial_influence_ruler_name_text$最近干預了$JAP_imperial_influence_faction_names_text$事務"
 JAP_imperial_influence_interference_reset_days_tt: "距離$JAP_imperial_influence_ruler_name_text$再次干預$JAP_imperial_influence_faction_names_text$的天數：[?JAP_interfered_in_imperial_influence_flag:days_left|Y0]"
 JAP_imperial_influence_faction_names_text: "§Y[GetImperialInfluenceFactionsName]§!"
 JAP_imperial_influence_factions_names_text_communist: "內部派系"
 JAP_imperial_influence_factions_names_text_monarchist: "帝國派系"
 JAP_sea_purge_the_kodoha_faction: "清洗皇道派"
 JAP_sea_purge_the_kodoha_faction_desc: "皇道派浪費了他們奪取權力的機會，而他們將為此付出沉重代價。由於他們對天皇的背叛，我們將剝奪他們的軍銜，並以叛國罪起訴他們。現在，終於輪到統制派來掌控帝國陸軍！"
 JAP_sea_purge_the_kodoha_faction_tt: "§Y荒木貞夫§!和 §Y本莊繁§!將從現役部隊中退休"
 JAP_east_asian_cooperative_society: "東亞合作社"
 JAP_east_asian_cooperative_society_desc: "近期提出的東亞協同會理論主張在東亞建立一個超越民族與國家邊界的合作社。我們應當以此為基礎，鞏固我們作為太平洋守護者與東亞人民領袖的地位。"
 JAP_east_asian_cooperative_society_tt: "解鎖可與§Y亞洲國家§!建立友好關係並在自然資源領域開展投資的決議"
 JAP_imperial_headquarters_liasion_conference: "帝國大本營政府聯席會議"
 JAP_imperial_headquarters_liasion_conference_desc: "隨著帝國大本營自日俄戰爭以來首次重新設立，是時候召開一次帝國軍政各派系領導人的會議，以促進合作與信息交流。"
 JAP_promulgate_the_military_ministers_system: "軍部大臣現役武官制度"
 JAP_promulgate_the_military_ministers_system_desc: "自皇道派發動未遂政變以來，國家局勢持續不穩。軍方對政府日益不滿，必須採取措施予以安撫。為此，廣田弘毅提議，將陸軍大臣職位僅授予現役軍官，這一制度在我國曆史上已有先例。"
 JAP_promulgate_the_military_ministers_system_tt: "此舉在§Y文官政府§!中是§R不受歡迎§!的，未來必將加劇各派之間的摩擦"
 JAP_reprimand_hamada_kunimatsu: "申斥濱田國松"
 JAP_reprimand_hamada_kunimatsu_desc: "在國會批評軍方的演講中，濱田國松言辭過激。為防止軍方在政治上徹底壓制文官政府，我們必須對他進行適當懲戒，以展示我們的反擊能力。"
 JAP_the_harakiri_debate: "切腹辯論"
 JAP_the_harakiri_debate_desc: "在濱田國松對軍方公然反抗後，寺內壽一要求內閣總辭，並推舉新首相。他認為，如果現任首相還有一絲羞恥心，就該自行引咎辭職。通過一些政治操作，林銑十郎可被扶植為軍方的傀儡。"
 JAP_konoes_first_cabinet: "近衛內閣第一次組閣"
 JAP_konoes_first_cabinet_desc: "林銑十郎僅為過渡之選。無黨派且受西園寺公望元老培育的近衛文麿親王，是穩定政局、振奮國民精神的理想首相人選。現在，是時候讓西園寺親自向天皇推薦由他自行組閣了。"
 JAP_new_order_in_east_asia: "東亞新秩序"
 JAP_new_order_in_east_asia_desc: "在[ROOT.GetLeader]近期的聲明中，他明確表示將建立一個新的東亞秩序，主要包括六大目標：東亞的永久穩定、鄰里友好與國際正義、聯合防共、創造新文化、經濟一體化、以及通力合作並最終實現世界和平。"
 JAP_new_order_in_east_asia_faction: "東亞新秩序"
 JAP_new_order_in_east_asia_tt: "完成$JAP_sea_greater_east_asian_co_properity_sphere$國策將改造該派系"
 JAP_reiterate_the_three_principles_of_hirota: "重申廣田三原則"
 JAP_reiterate_the_three_principles_of_hirota_desc: "通過政府的精心操作，廣田弘毅設法讓其繼任者宇垣一成成為新首相。現在是正式確認廣田三原則的時機，即：建立日本‑中國‑滿洲國集團、組織中日統一戰線以防止共產主義蔓延、打擊中國境內的反日行為。"
 JAP_formalize_japan_china_manchukuo_alliance: "日本-中國-滿洲國同盟"
 JAP_formalize_japan_china_manchukuo_alliance_desc: "隨著[CHI.GetLeader]政府接受了我們打擊共產主義與反日活動的要求，他們似乎已準備好暫時與我們結成聯盟，以共同應對東亞內部那塊正在潰爛的毒瘤——軍閥混戰與共產主義——這一威脅整個亞洲的致命危機。"
 JAP_sino_japanese_pact: "中日反共協定"
 JAP_sea_national_spiritual_mobliization_movement: "國民精神動員"
 JAP_sea_national_spiritual_mobliization_movement_desc: "“奢侈是敵人！”節儉、衛生與勤勞已被提升為國家美德，為戰爭釋放更多人力，同時更好地向帝國臣民傳達天皇陛下的意志。"
 JAP_hokushin_ron: "北進論"
 JAP_hokushin_ron_desc: "陸軍中的“北進派”主張向西伯利亞與蒙古擴張，以獲取實現帝國野心所需的資源與經濟利益。我們應當支持這一戰略，並在適當時機準備採納此學說。"
 JAP_strike_north_doctrine: "北進戰略"
 JAP_strenghten_manchukuo_imperial_army: "加強滿洲國帝國陸軍"
 JAP_strenghten_manchukuo_imperial_army_desc: "滿洲國帝國陸軍是對抗[SOV.GetNameDef]的先鋒力量，如若戰爭爆發，他們將承擔邊境防禦重任。我們必須協助其擴軍，以期在面對[SOV.GetAdjective]的鋼鐵洪流時屹立不倒。"
 JAP_strenghten_manchukuo_imperial_airforce: "加強滿洲國帝國空軍"
 JAP_strenghten_manchukuo_imperial_airforce_desc: "滿洲國帝國空軍剛剛組建，人員經驗不足。我們應派遣教官前往訓練，並提供中島陸軍九一式戰鬥機與川崎八八式輕型轟炸機，以增強其實力。"
 JAP_ensure_temporary_peace_with_china: "確保對華暫時和平"
 JAP_ensure_temporary_peace_with_china_desc: "若我們要將注意力集中在[SOV.GetNameDef]，就必須確保奸詐的[CHI.GetAdjective]不在我們腹背受敵之時從背後捅刀。同時，我們還需約束關東軍，避免其擅自挑起我們無法承受的戰爭。"
 trautmann_agreement_opm: "特勞特曼協定"
 JAP_a_mongol_volunteer_army: "改革蒙古獨立軍" # Could also be A Mongol Volunteer Army
 JAP_a_mongol_volunteer_army_desc: "滿洲國軍中已有由蒙古人和匪徒組成的蒙古獨立軍，並由[ROOT.GetAdjective]顧問領導。我們應建立一支完全由我方控制的部隊，目標是將其派往[MON.GetNameDef]，從敵人手中解放他們的故土。"
 JAP_a_mongol_volunteer_army_tt: "如果§Y[MAN.GetName]§!或§Y[MEN.GetName]§!是我們的盟友，他們也會獲得該精神"
 JAP_a_mongol_volunteer_army_1_tt: "解鎖決議以§Y破壞蒙古穩定§!，目標是使其倒向我們一方並對現政府發動政變"
 JAP_utilize_ainu_expertise: "發揮阿伊努人的專長"
 JAP_utilize_ainu_expertise_desc: "原住於日本北部的阿伊努人擅長在北海道的積雪和嚴酷地形中行動。或許我們可以學習他們的技巧，使我們對西伯利亞的進軍更為迅捷？"
 JAP_kantokuen: "關東軍特種演習"
 JAP_kantokuen_desc: "為了抓住世界局勢的變化，關東軍一直在準備特別演習，以為入侵和佔領俄國遠東做準備。為使行動迅速展開，我們應對這些最後的準備工作開展投資。"
 JAP_a_green_persimmon: "青澀的柿子"
 JAP_a_green_persimmon_desc: "我們的部隊尚未為與[SOV.GetNameDef]開戰做好充分準備，對方的注意力也未完全轉移至西方。儘管如此，我們必須立即發動進攻，否則機會恐將永遠錯失……"
 JAP_the_persimmon_has_ripened: "柿子已熟"
 JAP_the_persimmon_has_ripened_desc: "勝利的果實正迅速成熟，我們的軍隊已整裝待發，準備從崩潰的[SOV.GetAdjective]帝國手中奪取西伯利亞。這場戰爭將迅速結束，我們的勝利將萬世傳頌。天皇陛下萬歲！"
 JAP_peace_out_soviets_dec_tt: "解鎖一個決議，可在我們控制§Y西伯利亞§!後與§Y[SOV.GetNameDef]§!單獨簽署§Y和平協議§!，以獲得該地"
 JAG_neutality_pact_focus_days_tt: "當前天數：[?JAP_soviet_japanese_neutrality_pact_flag:days|Y0]"
 JAP_soviet_japanese_neutrality_pact_flag: "已完成國策：§Y$JAP_soviet_japanese_neutrality_pact$§!"
 JAP_chinese_japanese_neutrality_pact_flag: "已完成國策：§Y$JAP_ensure_temporary_peace_with_china$§!"
 JAG_chinese_neutality_pact_focus_days_tt: "當前天數：[?JAP_chinese_japanese_neutrality_pact_flag:days|Y0]"
 JAP_hokushin_ron_started_flag: "已完成國策：§Y$JAP_hokushin_ron$§!"
 JAG_hokushin_ron_focus_days_tt: "當前天數：[?JAP_hokushin_ron_started_flag:days|Y0]"
 JAP_nanshin_ron_started_flag: "已完成國策：§Y$JAP_nanshin_ron$§!"
 JAG_nanshin_ron_focus_days_tt: "當前天數：[?JAP_nanshin_ron_started_flag:days|Y0]"
 JAP_sea_establish_the_northern_resource_area: "建立北方資源區"
 JAP_sea_establish_the_northern_resource_area_desc: "我們成功佔領北方後，必須開發西伯利亞富饒的荒原，為我們不斷擴大的戰爭機器提供資源。我們應在重要地點設立新礦場和規劃城市，儘可能提取所有可用資源。"
 JAP_nanshin_ron: "南進論"
 JAP_nanshin_ron_desc: "雖然中國和西伯利亞資源富饒，但尚不足以滿足我們的全部需求。菲律賓、荷屬東印度、英屬馬來亞與婆羅洲距離我們並不遠。這些歐洲帝國主義者手中的殖民地才是我們實現自給自足的關鍵目標。"
 JAP_unlocks_pearl_harbor_raid: "解鎖§Y突襲§!：\n襲擊§Y[USA.GetNameWithFlag]§!珍珠港"
 JAP_soviet_japanese_neutrality_pact: "蘇聯-日本中立條約"
 JAP_soviet_japanese_neutrality_pact_desc: "若要確保我們有足夠自由力量南進，必須先穩定北方邊境。我們將立刻與[SOV.GetNameDef]展開談判，以確保其中立，同時商討獲得北庫頁島更多資源權益。"
 JAP_soviet_japanese_neutrality_pact_tt: "若§Y[SOV.GetAdjective]§!接受該條約，[ROOT.GetAdjective]國內的實業家將更願意在我們§Y[655.GetName]§!的租界開展投資。"
 JAP_unsinkable_aircraft_carriers: "不沉的航空母艦"
 JAP_unsinkable_aircraft_carriers_desc: "南洋群島是我們在太平洋戰鬥中進行空軍作戰的理想基地。我們應加強這些島嶼的防禦，築起堡壘，使其成為“永不沉沒的航母”。"
 JAP_isolate_oceania: "孤立大洋洲"
 JAP_isolate_oceania_desc: "軍部認為登陸並佔領[AST.GetNameDef]與[NZL.GetNameDef]並不現實。相反，我們應占據其周邊防守薄弱的島嶼，使其與盟友斷絕聯繫，逐漸削弱他們的戰鬥意志。"
 JAP_battle_for_australia: "澳大利亞戰役"
 JAP_battle_for_australia_desc: "既然[AST.GetNameDef]已被孤立，是時候爭奪該大陸的制空權了。若能控制其空域，也許佔領大洋洲不再是遙不可及之事。"
 JAP_operation_take_australia: "AN行動" # Australia-New Zealand
 JAP_operation_take_australia_desc: "終於到了這一天。高司令部已批准代號為“AN”的澳大利亞登陸作戰。我們將擊潰敵人，掌控亞洲的下腹部！"
 JAP_sea_exploit_southern_resource_area: "開發南方資源區"
 JAP_sea_exploit_southern_resource_area_desc: "既然我們已將南方納入掌控，必須大幅度開發東南亞和東印度群島的豐富資源，以支持我們的戰爭機器。"
 JAP_demand_tonkinese_bases: "索要越南東京基地"
 JAP_demand_tonkinese_bases_desc: "越南的東京地區不僅資源豐富，也是我們進一步南進的重要跳板。它臨近中國邊境，也可以成為空軍打擊廣東的重要基地。"
 JAP_demand_tonkinese_bases_tt: "法國擁有§Y東京§!"
 JAP_demand_tonkinese_bases_2_tt: "法國未擁有§Y東京§!"
 JAP_occupy_indochina: "佔領印度支那"
 JAP_occupy_indochina_desc: "印度支那的人民目前正受到殖民主義和帝國主義政權的壓迫，這些政權對人民的福祉漠不關心，我們必須介入並控制該地區，保護這裡的人民，並在這一過程中控制這裡的自然資源。"
 JAP_occupy_indochina_tt: "法國未擁有§Y印度支那§!"
 JAP_occupy_siam: "佔領暹羅"
 JAP_occupy_siam_desc: "暹羅雖然是我們的潛在盟友，但也可能成為我們的對手一定會利用的薄弱環節。因此，我們應該直接佔領這裡，這樣他們就不會得到機會和我們的敵人勾結了。"
 JAP_sea_pressure_siam: "施壓暹羅"
 JAP_sea_pressure_siam_desc: "暹羅地理位置優越，有利於我們未來與西方列強的戰爭。若能將其納入陣營，我們對馬來亞和東印度群島的入侵將大為便利。我們必須明確告知：不與我們為伍，便是與我們為敵。"
 JAP_strike_the_southern_road: "打通南方道路"
 JAP_strike_the_southern_road_desc: "是時候啟動我們的計劃了。我們將南進，佔領資源豐富的西方殖民地。憑藉這場迅猛果斷的打擊，我們將在戰爭全面爆發前先削弱敵人戰鬥能力。天皇陛下萬歲！"
 JAP_occupy_east_timor: "佔領東帝汶"
 JAP_occupy_east_timor_desc: "儘管東帝汶目前尚未正式參戰，但為了亞洲的未來，也必須將其納入我們的羽翼之下。我們的部隊已在島上整裝待發，準備迅速展開行動，希望能不動聲色地達成目的。"
 JAP_occupy_east_timor_tt: "§R這可能會導致與[721.GetName]所有者的戰爭！§!"
 JAP_revisit_the_thirteen_demands: "重提二十一條" # Could also be the 13 demands (the revised list)
 JAP_revisit_the_thirteen_demands_desc: "在世界大戰期間，我國政府曾向中華民國提出一系列要求，以掌控其鐵路等關鍵資源。雖然初步列入的要求包括在財政、警務和內政方面擁有決定性發言權，但最終僅有十三項得以簽署。現在，是時候重新審視這些主張，並確立我們作為東亞主宰者的地位了。"
 JAP_invest_in_senbu: "投資“宣撫”組織"
 JAP_invest_in_senbu_desc: "我們的“宣撫”組織，通常以學校、醫療隊和食物分發中心的形式出現，是一種心理戰工具，旨在安撫被佔領地區的民眾。這一策略在滿洲已被證實行之有效，也許我們應將其推廣至整個中國。"
 JAP_unlock_senbu_occupation_law_tt: "在§Y中國§!地區解鎖佔領法案：\n"
 JAP_establish_mongol_military_government: "建立蒙古軍政府"
 JAP_establish_mongol_military_government_desc: "成吉思汗的後裔德王在國民黨內蒙古傀儡領導層百靈廟蒙政會中擁有舉足輕重的地位。他渴望恢復蒙古昔日的榮光，如果我們承諾實現他的野心，他會願意支持我們建立蒙古軍政府。"
 JAP_launch_the_suiyuan_campaign: "發動綏遠戰役"
 JAP_launch_the_suiyuan_campaign_desc: "內蒙古軍隊和大漢義軍已準備好在我們的空中支援和日本參謀的監督下進攻[SHX.GetLeader]的地盤。也許我們在不對中國發動大規模戰爭的情況下佔領更多內蒙古土地。"
 JAP_launch_the_suiyuan_campaign_tt: "在我們的支援下，§Y內蒙古軍隊§!和§Y大漢義軍§!將發動進攻從國民黨勢力手中奪取§Y[621.GetName]§!，但這一行動只有極短的窗口期，之後就要取消"
 JAP_reorganize_the_united_autonomous_government: "聯合自治政府"
 JAP_reorganize_the_united_autonomous_government_desc: "蒙古軍事政府目前的政治架構非常原始，若無我方干預恐難維持。我們必須將其改組為“蒙古聯合自治政府”，以便其建立起真正的國家治理體系。"
 JAP_mengjiang_united_autonomous_government: "蒙疆聯合自治政府"
 JAP_mengjiang_united_autonomous_government_desc: "為了使德王對整個內蒙古的宣稱更加合理，我們應進一步重組該政權為“蒙疆聯合自治政府”，以便將中國境內的蒙古人統一在同一面旗幟之下。"
 JAP_mongol_autonomous_state: "蒙古自治國"
 JAP_mongol_autonomous_state_desc: "[MON.GetNameDefCap]自稱是真正的蒙古政府，而德王堅決反對這一宣稱。我們應該進一步改組並重新命名他的領地，這樣他就可以對所有蒙古土地提出更合法的宣稱。"
 JAP_reinforce_the_beijing_garrison: "加強冀東駐軍"
 JAP_reinforce_the_beijing_garrison_desc: "冀東自治政府是在我們攻佔長城後建立的，其冀東軍負責執行該地區[CHI.GetAdjective]方面的非軍事化。我們應主動增強該部隊和關東軍在此地的駐軍，以防其被[CHI.GetAdjective]軍奪回。"
 JAP_reinforce_the_beijing_garrison_tt: "§R可能導致與[CHI.GetNameDef]的戰爭§!"
 JAP_develop_the_chinese_resources: "開發中華資源"
 JAP_develop_the_chinese_resources_desc: "既然大片中國土地已在我們控制之下，就必須開始開發其豐富的資源，為下一場戰爭提供所需。"
 JAP_form_the_jikyoku_iinkai: "組建時局委員會"
 JAP_form_the_jikyoku_iinkai_desc: "為更好地掌控與[USA.GetNameDef]之間的進出口貿易，並試圖說服[USA.GetAdjective]民眾站在我們這一邊而非[CHI.GetNameDef]，我們應成立日本貿易與情報委員會。"
 japanese_committee_on_trade_and_information_pom: "日本貿易與情報委員會"
 JAP_strategic_offensives: "戰略攻勢"
 JAP_strategic_offensives_desc: "[CHI.GetNameDefCap]極難攻克，高層已要求展開更協調的戰略攻勢，集中打擊多個重點區域。在下層軍官違抗命令、影響整體作戰的情況下，我們必須先遏制他們，才能有效推進作戰計劃。"
 JAP_strategic_offensives_tt: "解鎖在§Y中國各地區§!§Y發動攻勢§!的決議，給予臨時加成"
 JAP_intensify_anti_guerilla_operations: "加強掃蕩作戰行動"
 JAP_intensify_anti_guerilla_operations_desc: "游擊隊和滲透者使我們在華軍事行動受挫，他們專挑我們的要害下手。我們必須準備對這些匪徒發起協同打擊，不惜一切代價將他們的據點從我們的地盤上清除！"
 JAP_intensify_anti_guerilla_operations_tt: "執行§Y$PRC_root_out_guerilla_fighters$§!決議的花費減半，並在游擊隊被清除的地區暫時降低抵抗"
 JAP_reorganized_national_government: "重組國民政府"
 JAP_reorganized_national_government_desc: "我們注意到由我軍在中國設立的多個地方政權，以及對廣大鄉村的直接佔領，正在造成巨大的成本。我們必須將這些政府統一，建立“重組國民政府”。"
 JAP_reorganized_national_government_tt: "解鎖決議以§Y整合§!我們的§Y中國佔領區§!"
 JAP_occupy_macau: "佔領澳門"
 JAP_occupy_macau_desc: "如果我們要繼續與西方殖民者作戰，不能讓澳門這一戰略城市落入他人之手。敵人可能借此作為空海補給點切斷我軍。我們必須立即接管澳門，避免其成為我方的致命弱點。"
 JAP_an_expedition_to_tibet: "進軍西藏"
 JAP_an_expedition_to_tibet_desc: "為更好了解[TIB.GetAdjective]政府是否可能加入我方陣營，我們應開展一項情報任務以與其建立聯繫。由於其對外來者的嚴格限制，我們必須派遣野本金三偽裝成蒙古人，並隨同西藏僧侶同行。"
 JAP_an_expedition_to_tibet_tt: "解鎖§Y影響西藏§!的決議，目標是將其轉為§Y日本附屬國§!"
 JAP_ally_the_dragon_king: "聯合龍王"
 JAP_ally_the_dragon_king_desc: "不丹的龍王統治著這個孤立的藏族王國，但也許他能看清更大的格局。我們應派遣代表團前往普那卡，勸說他加入我們的亞洲解放事業。"
 JAP_claim_the_raven_crown: "宣稱烏鴉王冠"
 JAP_claim_the_raven_crown_desc: "我們的天皇高於一切，不承認這一事實的國家必須被征服。我們將入侵[BHU.GetNameDef]，奪取其王位。"
 JAP_ally_the_gorkhas: "聯合廓爾喀人"
 JAP_ally_the_gorkhas_desc: "尼泊爾國王統治著位於世界最高山脈的王國，與外界幾乎隔絕。但也許他能明白道理。我們應派代表團前往加德滿都，說服他加入我們的亞洲解放事業。"
 JAP_claim_the_scripech: "宣稱尼泊爾王冠"
 JAP_claim_the_scripech_desc: "我們的天皇高於一切，不承認這一事實的國家必須被征服。我們將入侵[NEP.GetNameDef]，奪取其王位。"
 JAP_ally_afghanistan: "聯合巴拉克宰王朝"
 JAP_ally_afghanistan_desc: "阿富汗國王統治著一個由多個部族組成的山區國家，也許他能明白我們共同的命運。我們應派代表團前往喀布爾，說服他加入我們的亞洲解放運動。"
 JAP_best_the_graveyard: "征服“帝國墳場”"
 JAP_best_the_graveyard_desc: "我們的天皇高於一切，不承認這一事實的國家必須被征服。我們將入侵[AFG.GetNameDef]，奪取其王位。"
 JAP_form_the_central_economic_council: "成立中央經濟委員會"
 JAP_form_the_central_economic_council_desc: "為應對政治動盪與戰爭帶來的經濟衰退，我們應成立一個直屬首相的特別顧問機構，負責研究國內與海外領土之間的經濟政策，並擬定基本執行計劃。"
 JAP_expand_the_showa_research_association: "擴大昭和研究會"
 JAP_expand_the_showa_research_association_desc: "昭和研究會是一個政治智庫，成立的目的是通過審視《明治憲法》的問題來提出政治改革的創新方案。如今它不斷拓展研究領域，並組建了新的分支小組。我們應當鼓勵這一趨勢，使其發展新技術，助力我們主導亞洲。"
 JAP_form_the_great_japan_industrial_patriotic_association: "大日本產業愛國會"
 JAP_form_the_great_japan_industrial_patriotic_association_desc: "我國產業界與工會之間分裂而低效，這嚴重阻礙了經濟發展。我們必須將二者統一在同一組織之下，以最大程度提高工業效率，推動進一步擴張。"
 JAP_sea_guide_the_zaibatsus: "財閥督導"
 JAP_sea_guide_the_zaibatsus_desc: "長久以來，各大財閥在帝國的政治和經濟領域都擁有著不可估量的影響力，我們或許可以通過一些手段，引導其為我所用，並將其領導層重組為更方便管控的團體。"
 JAP_form_cabinet_intelligence_bureau: "組建內閣情報局"
 JAP_form_cabinet_intelligence_bureau_desc: "首相[ROOT.GetLeader]親自請求建立一個政府機構，專注於提升國內親日情緒，確保所有國民全力投入戰爭與國家防衛。伊藤信文已接受請求，只需下達正式命令即可成立該機構。"
 JAP_crackdown_on_foreign_agents: "打擊外國特工"
 JAP_crackdown_on_foreign_agents_desc: "內閣情報局發現了許多形跡可疑之人，其中包括持有不良意識形態者及明顯的外國間諜。也許現在是時候採取行動，發起全國性安全整肅行動，以保國家安寧。"
 JAP_crackdown_on_foreign_agents_tt: "§Y特高課§!將更積極地逮捕異見分子與間諜，以強化國家安全與穩定。"
 JAP_found_the_great_japan_press_association: "成立大日本新聞社"
 JAP_found_the_great_japan_press_association_desc: "內閣情報局提出了一種更有效引導國民思想的方法。通過成立“大日本新聞社”，我們可以將全國媒體統一管理，實現全面審查我們需要屏蔽的信息，並向需要的人群傳播愛國主義。"
 JAP_empower_the_thought_police: "強化特高課警察"
 JAP_empower_the_thought_police_desc: "特高課警察作為執法機關，專責鎮壓危害治安的政治團體與思想，執行國內反間諜與刑事偵查工作。我們應賦予其更大權力，以提高效率、維護公共秩序。"
 JAP_sea_state_general_mobilization_law: "國家總動員法"
 JAP_sea_state_general_mobilization_law_desc: "我們必須將國家經濟全面轉為戰時體制，以免在武器研發方面落後。新法案將授權政府控制民間組織與工會，對戰略性產業實施國有化、價格管制與必要時的配給制度。"
 JAP_sea_state_general_mobilization_law_tt: "解鎖即使是§Y中立主義§!也能啟用§Y$closed_economy$§!的能力"
 JAP_issue_the_ten_commandments_for_marriage: "婚姻訓令"
 JAP_issue_the_ten_commandments_for_marriage_desc: "由於我國人口相較敵國較少，政府提出“多子多福”為口號，推行新人口政策以鼓勵生育，提升[ROOT.GetAdjective]人口數量。我們必須支持此項計劃。"
 JAP_enact_religious_organizations_law: "實施宗教團體法"
 JAP_enact_religious_organizations_law_desc: "為統一國民思想，引導人民走向正確方向，確保他們堅定支持[ROOT.GetAdjective]的命運，我們必須頒佈法律，賦予國家對全國宗教團體的直接管控權。"
 JAP_new_order_movement: "新體制運動"
 JAP_new_order_movement_desc: "我們必須建立一個效仿西方一黨制國家的民族組織，以動員全民對抗殖民列強，並通過拒絕明治維新以來的資本主義道路來抵禦共產主義。這比以往任何時候都更為迫切，若不盡快實施，我們可能會錯失良機。"
 JAP_sea_tripartite_pact: "提議簽署三國軸心協定"
 JAP_sea_tripartite_pact_desc: "隨著敵人陣營日漸成形，戰勝他們的難度也隨之上升。我們應與志同道合的國家展開接觸，實現一定程度上的合作。"
 JAP_sea_mil_tech_coop_with_germany: "與德國展開軍事合作"
 JAP_sea_mil_tech_coop_with_germany_desc: "我們需要更先進的軍事技術來實現世界統一。德國不僅是我方在技術發展上的歷史夥伴，也擁有豐富的軍事科技成果。我們必須不惜一切代價獲取這些藍圖！"
 JAP_imperial_rule_assistance_association: "大政翼贊會"
 JAP_imperial_rule_assistance_association_desc: "內外威脅並存，民間政府派系林立，我們必須建立“大政翼贊會”，確立國家主義、準法西斯政治體系，以消除政治與經濟中的派系鬥爭，建立極權一黨制國家，從而最大限度發揮全面戰爭體制的效率。"
 JAP_form_the_yokusan_sonendan: "組建大日本翼贊壯年團"
 JAP_form_the_yokusan_sonendan_desc: "為保護國家主權，我們需要更多願意參戰的青年，同時還需地方民兵協助內政事務。因此，我們應組建“大政翼贊會”旗下的精英青年準軍事組織——“大日本翼贊壯年團”。"
 JAP_integrate_the_great_japan_youth_party: "整合大日本青年黨"
 JAP_integrate_the_great_japan_youth_party_desc: "大日本青年黨是模仿德國青年組織建立的民族主義青年團體，目前仍由橋本欣五郎上校獨立領導。我們必須將其納入大政翼贊會的直接控制。"
 JAP_sea_national_defense_state: "國家防衛體制"
 JAP_sea_national_defense_state_desc: "[ROOT.GetLeader]已宣佈實施“新體制”，將日本轉型為“國家防衛國家”，全民動員保衛祖國。根據國家動員法，政府將掌控全國一切資源。憑藉此體制，帝國將永世長存！"
 JAP_gain_national_defense_state_remove_total_mob_tt: "§R移除§!§Y$tot_economic_mobilisation$§!，獲得§Y$national_defense_state$§!"
 JAP_formalize_the_tonarigumi: "正式化鄰組制度"
 JAP_formalize_the_tonarigumi_desc: "“鄰組”已在國內長期存在，負責分配配給物資、國債、消防、防疫、民防、精神動員宣傳，並監視海岸與異見人士。我們應將其正式制度化，並加大財政支持。"
 JAP_formalize_the_tonarigumi_tt: "解鎖在附屬國§Y組織鄰組§!的決議"
 JAP_ichioku_isshin: "一億一心"
 JAP_ichioku_isshin_desc: "正如大政翼贊會的口號所說，[ROOT.GetAdjective]人民“億心一體”。雖臣民個體各異，但在天皇之下，眾志成城，心如一體。"
 JAP_issue_the_senjinkun_military_code: "發佈《戰陣訓》"
 JAP_issue_the_senjinkun_military_code_desc: "《戰陣訓》是袖珍軍規手冊，必須發給每位[ROOT.GetAdjective]士兵，教育他們軍紀、戰鬥準備、忠孝、神道信仰與國體精神。“寧死不辱，寧戰不降！”"
 cost_reduced_last_stand_2: "大幅降低使用§Y堅守到底§!指令的消耗，並將持續時間延長§G3§!天。\n"
 JAP_issue_the_shinmin_no_michi_manifesto: "發佈《臣民之道》宣言"
 JAP_issue_the_shinmin_no_michi_manifesto_desc: "我們的國民必須學習做臣民之道。我們將通過一份面向全體國民的意識形態宣言，明確說明他們“作為國民與國家的一分子”應當承擔的責任。文部省將負責起草與頒佈。"
 JAP_sea_greater_east_asian_co_properity_sphere: "大東亞共榮圈"
 JAP_sea_greater_east_asian_co_properity_sphere_desc: "我們必須在亞洲建立一個聯合體，實現經濟自給自足與成員國間的合作，並抵禦西方帝國主義與蘇聯共產主義的干涉。當然，這也將成為我們在亞洲實行霸權統治的宣傳工具。"
 JAP_CHI_pact_is_active_flag: "中國-日本聯盟生效"
 JAP_unlock_east_asia_occupation_law_tt: "解鎖對§Y亞洲§!地區的佔領法令：\n"
 JAP_sea_greater_east_asian_co_properity_sphere_tt: "解放和傀儡§Y亞洲§!和§Y大洋洲§!國家的花費降低§G25%§!。"
 JAP_sea_greater_east_asian_co_properity_sphere_2_tt: "解鎖在東南亞§Y建立傀儡政權§!的決議"
 JAP_expand_japan_manchukuo_economic_bloc: "日滿經濟集團"
 JAP_expand_japan_manchukuo_economic_bloc_desc: "我們應該主動與附屬國建立一個競技集團，以加強我們的經濟並確保戰略資源如鐵、煤、棉花和鹽的充足供應。"
 JAP_develop_the_yen_bloc: "發展日元區"
 JAP_develop_the_yen_bloc_desc: "我們必須進一步重視“大東亞共榮圈”的經濟建設，整合亞洲各國經濟，並推動所有國家採用日元作為共同貨幣。這一目標可通過深化日本-滿洲國-中國的日元區的發展並最終完善之來實現。"
 JAP_develop_the_yen_bloc_tt: "解鎖將§Y亞洲盟友§!的§Y經濟整合§!的決議"
 JAP_east_asia_development_board: "東亞開發事務局"
 JAP_east_asia_development_board_desc: "設立“興亞院”將有助於協調政府對華政策，支持中國地區的工業和商業發展，藉此增強對日本統治的支持。同時，也能為我方礦業與戰爭工業提供勞動力保障。"
 JAP_east_asia_development_board_tt: "解鎖在盟友境內啟動§Y工業化項目§!的決議"
 JAP_ministry_of_greater_east_asia: "大東亞省"
 JAP_ministry_of_greater_east_asia_desc: "設立“大東亞省”，將提高我們對太平洋新領地的行政效率，並協調大東亞共榮圈的建設與發展。"
 JAP_the_flying_geese: "飛雁隊形"
 JAP_the_flying_geese_desc: "東南亞的技術發展必須由我們來主導。亞洲各國將在一個區域性階梯體系中逐步追趕西方，商品製造將由發達國家向欠發達國家轉移。正如雁陣中的“V”字編隊，我們將引領亞洲發展！"
 JAP_greater_east_asia_railroad: "大東亞鐵路"
 JAP_greater_east_asia_railroad_desc: "我國首席工程師提出構建一條連接日本、亞洲大陸與歐洲的鐵路的設想，包括一條通往朝鮮屬地的海底隧道或橋梁。借鑑南滿鐵路的經驗，我們的高速列車將從東京通往仰光，再至德黑蘭。願帝國千秋萬代！"
 JAP_greater_east_asia_railroad_tt: "所有我國或盟友控制的、基礎設施等級低於§Y2§!的地區將獲得§G+1§!§Y基礎設施§!"
 JAP_promote_pan_asianism: "推廣泛亞主義"
 JAP_promote_pan_asianism_desc: "在大東亞共榮圈與帝國勇士的奮鬥之下，亞洲一體化的夢想比以往任何時候都更加接近實現。西方國家終將明白，亞洲不再是任其掠奪的對象，而是將與其最偉大的帝國並肩而立的力量。"
 JAP_promote_pan_asianism_tt: "解鎖將我們的亞洲附屬國§Y整合統一§!為一個§Y統一亞洲§!的決議"
 JAP_tojos_premiership: "東條內閣"
 JAP_tojos_premiership_desc: "當前局勢下，我們必須選擇一位能團結大日本帝國陸軍、同時具備軍事與政治領導力的首相。因此，陸軍大將東條英機將成為帶領國家走向輝煌的新領袖。"
 JAP_tojos_premiership_tt: "不是中國地區"
 JAP_yamamotos_premiership: "山本內閣"
 JAP_yamamotos_premiership_desc: "為應對當前形勢，我們必須選擇一位能團結海軍、兼具軍事與政治才能的首相。因此，海軍大將山本五十六將被選為國家新任領導人。"
 JAP_yamamoto_shot_down_flag: " 山本已經被擊落身亡"
 JAP_the_crysanthemum_throne: "菊花王座"
 JAP_the_crysanthemum_throne_desc: "軍方各派系爭權不休，遲遲無法就首相人選達成一致。在此動盪局勢下，或許天皇應親自幹預，直接掌控國家大權。"
 JAP_solidify_tohokai_rule: "鞏固東方會統治"
 JAP_solidify_tohokai_rule_desc: "隨著中野就任首相，大政翼贊會內的東方會派系成為最大勢力。如今我們有機會真正鞏固東方會的統治，並確保中野在未來數年對[ROOT.GetAdjective]政壇的影響力！"
 JAP_national_defense_brotherhood: "護國同志會"
 JAP_national_defense_brotherhood_desc: "為資助戰爭，岸信介與東條英機構想出“護國同志會”，作為協調國家財政戰略與工業計劃的政治組織。儘管該組合頗具爭議，但將成為帝國戰爭動員的中樞力量。"
 JAP_supreme_council_for_direction_of_war: "戰爭指導最高會議"
 JAP_supreme_council_for_direction_of_war_desc: "政府認識到需要迅速召開“御前會議-政府聯席會議”，以加強國家事務與軍事指揮的協調。這或將引領我們走向勝利。"
 JAP_found_the_boeitai: "成立防衛隊"
 JAP_found_the_boeitai_desc: "隨著本土遭到入侵的風險上升，我們必須建立一支可快速動員的國土防衛部隊，以保衛本土安全。包括原本不屬徵兵對象的人員也將被動員。"
 JAP_found_the_boeitai_tt: "解鎖在本土招募§Y志願戰鬥民兵部隊§!的能力"
 JAP_advance_one_hundred_million_fireballs: "一億火球前進！"
 JAP_advance_one_hundred_million_fireballs_desc: "“大政翼贊會”提出口號：“一億火球前進！”，表達人民對西方的憤怒與鬥志。為帝國而戰，哪怕付出生命，人民也將義無反顧！"
 JAP_advance_one_hundred_million_fireballs_tt: "若穩定度低於§Y40%§!，此精神將被移除"
 JAP_joshi_teishin_tai: "動員[ROOT.GetAdjective]婦女"
 JAP_joshi_teishin_tai_desc: "女子挺身隊將要成立，它賦予女性在婚前為國家服務的機會，承擔戰爭時期的勞動任務，擴大我方戰時動員能力。"
 JAP_the_metal_collection_order: "金屬徵集令"
 JAP_the_metal_collection_order_desc: "我國包括普通金屬在內的戰略物資極度短缺，必須頒佈帝國敕令第667號，向公眾與私營企業徵集金屬，以緩解戰局惡化所帶來的物資危機。"
 JAP_form_the_dai_nippon_fujinkai: "成立大日本婦人會"
 JAP_form_the_dai_nippon_fujinkai_desc: "山內幸子自願發起“大日本婦人會”，擬合併三個國家級婦女組織，動員女性參與戰爭工作、提高軍人士氣、推動節約精神與生產水平，並支援軍隊。"
 JAP_found_the_air_defense_surveilance_corps: "成立防空監視團"
 JAP_found_the_air_defense_surveilance_corps_desc: "為保障對敵軍空襲的早期預警，我們必須動員平民在全國設立防空哨所，偵測敵機並及時上報相關機關。該項目將通過《防空法》組織實施。"
 JAP_fund_propaganda_films: "資助宣傳影片"
 JAP_fund_propaganda_films_desc: "海軍建議加大對電影產業的投資，以激發國民的戰鬥熱情。為此，他們委託“活動寫真實驗所”製作宣傳動畫電影，藉此強化大日本帝國海軍的正面形象，同時貶低大日本帝國陸軍。"
 JAP_fund_propaganda_films_tt: "刷新§Y[ROOT.GetImportOrDomesticFilmIndustry]§!決議"
 JAP_fund_propaganda_films_2_tt: "§Y[ROOT.GetImportOrDomesticFilmIndustry]§!可額外執行一次"
 JAP_the_eternal_kingdom: "永恆的帝國"
 JAP_the_eternal_kingdom_desc: "日本是由神聖天皇統治的國家，因而也是受神明庇佑之地。有神助我邦，我國將不朽不滅，永世長存。天皇陛下萬歲！大日本帝國萬歲！"
 JAP_the_eternal_kingdom_tt: "若投降進度達到§Y50%§!，該精神效果將移除"
 JAP_revere_the_emperor_destroy_the_traitors: "尊皇討奸"
 JAP_revere_the_emperor_destroy_the_traitors_desc: "籌劃已久的日子終於來了。我方軍隊已佔領東京，且已開始與天皇談判，勸說其支持運動。儘管他最初疑慮重重，最終也是不得不妥協。最終，我們將能讓國家擺脫西方的墮落風氣，重揚昔日光輝。"
 JAP_authorize_aid_to_ethiopia: "授權援助埃塞俄比亞"
 JAP_authorize_aid_to_ethiopia_desc: "我方派系多年來與[ETH.GetAdjective]人保持聯繫，併成功說服政府協助[ETH.GetNameDef]推進現代化。如今他們正遭受西方列強攻擊，我們必須立即援助！"
 JAP_establish_the_gunbatsu: "建立軍閥"
 JAP_establish_the_gunbatsu_desc: "為重組政府，我們必須拆解其結構，從零開始構建。為此，我們已著手籌備建立一個軍事派系，協助天皇以封閉的核心圈子形式治理國家。"
 JAP_grand_army_purge: "陸軍大清洗"
 JAP_grand_army_purge_desc: "為確保對軍隊的絕對掌控，我們必須清除那些支持明治寡頭思想、反對並阻撓我方掌權的叛徒，其中就有那些為一己私利試圖控制天皇的惡毒統制派軍官。無論採用何種手段，軍隊必須肅清這些害群之馬！"
 JAP_grand_army_purge_tt: "§R清洗§!若干§Y統制派成員§!與§Y武士階層後裔的軍官§!，並§G提拔§!參與政變的§Y青年軍官§!。被§R移除§!的重要指揮官包括：\n"
 JAP_remove_the_weeds_from_the_crop: "剷除稗草"
 JAP_remove_the_weeds_from_the_crop_desc: "正如我方首席政治理論家荒木貞夫所言：“雜草不除，良田必毀。”我們必須剷除政府中阻礙國家進步、出賣國家利益、淪為外國資本家和代理人的“雜草”。清掃時刻已至！"
 JAP_can_no_longer_manually_promote_civ_government_tt: "我們將不再能§R手動支持§!§Y文官派系§!"
 JAP_sea_the_showa_restoration: "[JAP_sea_the_showa_restoration_key]"
 JAP_sea_the_showa_restoration_key_emperor_showa: "昭和維新"
 JAP_sea_the_showa_restoration_key_emperor_genka: "元化維新"
 JAP_sea_the_showa_restoration_desc: "[JAP_sea_the_showa_restoration_desc_key]"
 JAP_sea_the_showa_restoration_emperor_showa_desc: "大正自由民主時代終於結束。國家將再次由少數可勝任者輔佐偉大天皇領導。唯有如此，我國方能獲得救贖。"
 JAP_sea_the_showa_restoration_emperor_genka_desc: "大正自由民主時代終於結束。國家將再次由少數可勝任者輔佐偉大天皇領導。唯有如此，我國方能獲得救贖。"
 JAP_kodoha_the_emperor_cooperated_flag: "§Y昭和天皇§!選擇與皇道派合作"
 JAP_hirohito_has_been_killed_flag: "§Y裕仁§!已逝世"
 JAP_emperor_hirohito_has_abdicated_flag: "§Y裕仁§!已退位"
 JAP_emperor_hirohito_under_house_arrest_flag: "§Y裕仁§!被§Y軟禁§!"
 JAP_yasuhito_is_the_current_regent_or_emperor_flag: "§Y靖仁§!繼承皇位"
 JAP_nobuhito_is_the_current_regent_or_emperor_flag: "§Y宣仁§!繼承皇位"
 JAP_yasuhito_takes_up_the_throne_tt: "§Y雍仁§!將取代§Y裕仁§!在帝國影響中的位置"
 JAP_nobuhito_takes_up_the_throne_tt: "§Y宣仁§!將取代§Y裕仁§!在帝國影響中的位置"
 JAP_an_ode_to_showa_restoration: "昭和維新頌"
 JAP_an_ode_to_showa_restoration_desc: "海軍軍官三上卓創作了昭和維新頌歌，強烈訴諸自然與宗教，為我方運動譜寫了震撼人心的主旋律。既已恢復天皇權力，廢除大正自由民主，應將此歌作為第二國歌。"
 JAP_ikki_kitas_state_socialist_ideals: "北一輝的國家社會主義理想"
 JAP_ikki_kitas_state_socialist_ideals_desc: "作家兼政治哲學家北一輝對我方運動影響深遠，他自稱社會主義者，多次批判資本主義模式。我們應採納其思想，重組經濟，以更貼近這一理想。"
 JAP_oppose_the_zaibatsus: "反對財閥"
 JAP_oppose_the_zaibatsus_desc: "我國最大的企業集團長期擁有空前政治經濟權力。我們必須提醒他們仍需服從天皇旨意，確保貪婪的資本主義政策不再汙染國家靈魂。"
 JAP_oppose_the_zaibatsus_tt: "該民族精神結束時：\n"
 JAP_give_it_your_all_for_the_emperor: "為天皇盡忠至死！"
 JAP_give_it_your_all_for_the_emperor_desc: "[ROOT.GetAdjective]人勤勞，虔誠信奉偉大天皇。我們應宣傳此點，將勤勞作為[ROOT.GetAdjective]社會核心價值觀。"
 JAP_give_it_your_all_for_the_emperor_tt: "解鎖在擁有至少§Y4§!級§Y基礎設施§!的初始核心地區建造§G1§!§Y民用工廠§!的決議。\n§R該決議每個地區只能採取一次§!"
 JAP_revitalize_rural_areas: "鄉村復興"
 JAP_revitalize_rural_areas_desc: "我方運動中許多年輕軍官皆出身貧困農村。為爭取其支持，應振興農村地區，阻止鄉村人口流失。"
 JAP_nationalize_western_corporations: "國有化西方企業"
 JAP_nationalize_western_corporations_desc: "貪婪的西方資本家入侵我國，掠奪人民與資源，給國家靈魂留下難愈創傷。我們必須立即打擊這些企業。即使激怒西方，也要國有化其工廠。"
 JAP_ally_the_league_of_blood: "聯合血盟團"
 JAP_ally_the_league_of_blood_desc: "激進佛教日蓮宗傳教士井上日昭創立了血盟團，意圖消滅富商與自由派政治家，這一事件史稱“血盟團事件”。他目前已獲釋，因理念相近，我們應與之接觸。"
 JAP_integrate_the_kenkokutai: "吸納建國會"
 JAP_integrate_the_kenkokutai_desc: "國本會是反共組織，深受高畠基之的國家社會主義影響，尋求建立一個以人民與天皇一致為基礎的真正屬於人民的國家。因目標相似，我們應招募其入政府。"
 JAP_contact_the_masterless_samurai: "聯絡浪人"
 JAP_contact_the_masterless_samurai_desc: "浪人會是一個極端民族主義的反民主政治團體，其成員與玄洋社和黑龍會等類似組織有許多交集。該秘密社團由田中弘之於1908年創立，如今影響著我們大多數右翼政治家。我們必須與他們接觸，在政府與他們之間建立聯繫。"
 JAP_contact_former_sakurakai_members: "聯繫曾經的櫻會成員"
 JAP_contact_former_sakurakai_members_desc: "櫻會是1930年由年輕軍官成立的極端民族主義秘密社團，自錦旗革命事件後已被解散。他們的目標是通過軍事政變（如有必要）將國家重組為極權軍事體制。如今既然大局已定，我們應嘗試聯繫並重新邀請部分前成員加入政府。"
 JAP_the_great_spiritual_evil: "屬靈之大惡"
 JAP_the_great_spiritual_evil_desc: "《治安維持法》的頒佈是阻止共產主義墮落影響國民思想的良好開端，但這只是個開始。我們的國體同樣受到外國社會主義思想威脅，我們必須採取更積極措施防止其摧毀國家。"
 JAP_strike_down_the_enemy_of_the_people: "打擊人民公敵"
 JAP_strike_down_the_enemy_of_the_people_desc: "[ROOT.GetAdjective]人民最大的敵人是共產主義，而共產主義也無法與我國共存，這是亙古不變的事實。在東西方文明的終極較量中，你死我活是唯一的結局。"
 JAP_strike_down_the_enemy_of_the_people_tt: "獲得對任何§Y亞洲共產主義國家§!的§Y吞併§!的戰爭目標。當前目標："
 JAP_prepare_for_the_final_war: "準備最後的戰爭"
 JAP_prepare_for_the_final_war_desc: "技術決定戰爭史，而戰爭史決定歷史。不久之後，最後的戰爭將至，這場戰爭將由空戰來決定勝負。在未來，飛機將能夠遠距離飛行，直接打擊他國首都。為避免這種情況，我們應建立新的指令性經濟體制，推行一黨制的國防國家。"
 JAP_indoctrination_in_the_military_academy: "軍官學校思想灌輸"
 JAP_indoctrination_in_the_military_academy_desc: "必須確保軍中激進分子不會像過去那樣反叛政府。我們必須確保高度紀律，讓每個士兵都宣誓效忠天皇，而非任何團體或派系！"
 JAP_every_kodoha_member_tt: "每位§Y皇道派同情者§!："
 JAP_sea_supremacy_of_will: "意志至上"
 JAP_sea_supremacy_of_will_desc: "利劍若置於匹夫之手則不過爾爾，而武士縱手持木劍，亦能陷陣殺敵。唯有進攻精神與猛攻信念方能贏得戰爭。"
 JAP_tennoheika_banzai: "天皇陛下萬歲！"
 JAP_tennoheika_banzai_desc: "萬歲衝鋒體現了[ROOT.GetAdjective]的戰鬥精神。作為軍事課程的一部分，每個士兵都要熟知這一戰鬥口號，並接受刺刀衝鋒戰術的訓練。憑藉這些訓練，我軍士兵絕不會淪為戰俘，而是英勇赴死。天皇陛下萬歲！"
 JAP_a_truly_righteous_army: "真正的正義之師"
 JAP_a_truly_righteous_army_desc: "[ROOT.GetAdjective]帝國陸軍不僅為征服或榮耀而戰，更為天皇、國家、理想與人民而戰。每位士兵必須明白其職責所為，關乎天皇與人民，為陛下犧牲一切都在所不惜。"
 JAP_supremacy_of_the_kempeitai: "憲兵隊至上"
 JAP_supremacy_of_the_kempeitai_desc: "我們的“法務兵”將接替更忠於舊政權的特高課的職能。憲兵隊將接管國家警察系統，提升我們在鎮壓叛亂、反間諜及清除異見方面的能力。"
 JAP_sonnou_joui: "尊王攘夷！" # Sonnō Jōi!
 JAP_sonnou_joui_desc: "我們再次踐行了幕末時期強大天皇的理想，對抗外國帝國主義。正如當初驅逐德川幕府，我們也將驅逐所有反對偉大天皇統治之人。尊皇攘夷！是時候重拾天命了。"
 JAP_sonnou_joui_tt: "當通過§Y寶槍已出鞘§!獲取戰爭目標後，若我們成功佔領該目標國首都且§R該精神仍激活§!時，將重新激活該精神。"
 JAP_subdue_the_kwantung_army: "鎮壓關東軍"
 JAP_subdue_the_kwantung_army_desc: "關東軍長期以來不聽軍事集團指揮，成為我們的心腹大患。我們必須通過戰術晉升與威懾確保其完全服從。只要時機一到，荒木貞夫將成為關東軍的新任統帥。"
 JAP_subdue_the_kwantung_army_tt: "§G控制§!§Y關東軍§!，確保其行動無法獨立於政府意志行事。"
 JAP_subdue_the_kwantung_army_2_tt: "數名§Y關東軍§!將領將被降職並強制退役"
 JAP_hasten_the_integration_of_taiwan: "加速整合臺灣"
 JAP_hasten_the_integration_of_taiwan_desc: "我們對臺灣的同化除遭遇少數主要挫折外，總體進展順利。終有一日，臺灣將如琉球般成為日本的核心領土。但若想盡快將注意力轉移至其他地區，則需要加快步伐了。"
 JAP_integrate_the_government_general: "整合總督府"
 JAP_integrate_the_government_general_desc: "朝鮮總督府的自治權一直是個重大錯誤。他們任由抵抗運動存在太久，嚴重損害了我們在該地區的產業。我們必須直接干預，將朝鮮領土置於中央政府直接管轄下。"
 JAP_integrate_the_government_general_tt: "當朝鮮地區順從度足夠高時，解鎖§Y整合朝鮮§!的決議"
 JAP_align_the_concordia_association: "聯合協和會"
 JAP_align_the_concordia_association_desc: "我們控制下的滿洲協和會政黨秉持泛亞主義理念，主張建立一個多民族的國家，並逐步以文官取代滿洲國軍事統治。為推進泛亞事業，我們應提議兩國統一。"
 JAP_integrate_the_great_empire_of_manchuria: "整合大滿洲帝國"
 JAP_integrate_the_great_empire_of_manchuria_desc: "有了滿洲協和會的堅定支持，溥儀及其忠誠派無力阻止我們終結其自治。統一兩國於唯一真正天皇之下的時機終於到來！"
 JAP_MAN_accepted_our_proposal_for_integration: "§Y[MAN.GetNameDefCap]§!已接受統一提案"
 JAP_integrate_the_great_empire_of_manchuria_tt: "當滿洲地區順從度足夠高時，解鎖§Y整合滿洲§!的決議"
 JAP_embrace_kokutai: "採納國體"
 JAP_embrace_kokutai_desc: "我們的民族認同、精髓與特徵在在很長時間裡被過去歷代政府忽視淡化，隨時間流逝而已瀕臨消失。我們必須確保每位[ROOT.GetAdjective]公民明白，踐行國體，傳承和發揚傳統是其責任。"
 JAP_empower_the_shogun: "授權將軍"
 JAP_empower_the_shogun_desc: "天皇陛下仍然需要維持其禮節性的尊位，並通過得力的臣下代為統治這個國家，此舉必將能使陛下的玉音和聖意得到深入而有效的落實。"
 JAP_empower_the_emperor: "強化天皇權威"
 JAP_empower_the_emperor_desc: "長久以來，天皇陛下都僅作為帝國名義上的統治者，但而今，他必須親掌這個國家。只有如此，帝國方才能夠與西方列強相抗衡。"
 JAP_a_worthy_succssor_of_meiji: "明治之後的合適繼承者"
 JAP_a_worthy_succssor_of_meiji_desc: "如今，既已實施類似第二次明治維新的改革，我們的天皇再次成為國家最有權勢之人。或許，我們應踐行這場民族革命理想，嘗試推動工業與科學現代化，開啟新的[ROOT.GetAdjective]文藝復興。"
 JAP_the_art_of_warfare: "戰爭的藝術"
 JAP_the_art_of_warfare_desc: "東亞歷史上有許多偉大的戰術家與武士，但很少有人能比得上戰略大師孫子。或許我們能從他身上學到一二，使我們的計劃日益完善。"
 cost_reduced_staff_office_planning: "大幅降低§Y參謀本部計劃§!指令的使用消耗，並延長持續時間§G2§!天\n"
 JAP_the_imperial_colors: "錦之御旗"
 JAP_the_imperial_colors_desc: "為紀念1931年和我們一樣嘗試政變卻失敗的同胞們，我們應該將10月21日定為國家節日。在這一天，我們要升起帝國旗幟，緬懷他們為天皇所作犧牲。"
 JAP_utilize_our_polish_friendship: "利用波蘭友誼"
 JAP_utilize_our_polish_friendship_desc: "自俄國帝國時代起，我們收容了被流放至西伯利亞的波蘭人，由此與波蘭人保持著友好關係。自那以後，我們雙方持續就[SOV.GetNameDef]交換情報，並共同對抗該國。現在應與其正式締結防禦條約，讓雙方均可免受毛熊的威脅。"
 JAP_return_to_sakoku_ron: "迴歸鎖國論"
 JAP_return_to_sakoku_ron_desc: "我國曾因佩裡准將及[USA.GetAdjective]的炮艦外交而結束閉關鎖國狀態。如今，鑑於外來影響正腐蝕摧毀國家靈魂，我們應開啟第二次孤立時代。"
 JAP_japanese_supremacy_faction: "日本勢力圈"
 JAP_eth_is_invited_to_faction_tt: "§Y[ETH.GetNameDefCap]§!受邀加入我們的陣營"
 JAP_the_enemy_of_our_enemy: "敵人的敵人"
 JAP_the_enemy_of_our_enemy_desc: "必須解決[SOV.GetSovietThreatName]對我國北部邊境的威脅。我們必須開始為與[SOV.GetNameDef]的戰爭做準備。最佳方式是加強與[GER.GetNameDef]的關係，據報告其正在準備對[SOV.GetNameDef]開戰。"
 JAP_societal_bushido: "社會化的武士道"
 JAP_societal_bushido_desc: "荒木貞夫將軍將武士道與歐洲法西斯主義理念結合，形成其意識形態的哲學基礎，將天皇、人民、土地與道德視為不可分割的整體。為此，我們應推廣武士道信條，將其作為每個好公民都應遵守的準則。"
 JAP_politicize_the_education_system: "教育體制政治化"
 JAP_politicize_the_education_system_desc: "軍方長期掌控國家教育系統，但在激進化青年思想方面投入不足，未能充分動員其加入我方事業。我們應加大政治灌輸的投資，並增加對教育的資金支持。"
 JAP_the_spirit_of_the_imperial_nation: "皇國精神"
 JAP_the_spirit_of_the_imperial_nation_desc: "為統一國民思想，引導人民關注正確之事，確保他們始終堅定不移地支持[ROOT.GetAdjective]的使命，我們必須在各神社宣揚國體，並將[ROOT.GetLeader]供奉在東京的神社。"
 JAP_propagandize_the_nihon_shoki: "宣傳《日本書紀》"
 JAP_propagandize_the_nihon_shoki_desc: "《日本書紀》是解釋我國曆史的重要文獻，詳述了建國神話。我們必須確保學校對其重點講授，令孩童瞭解神武征服與我國未來天命的聯繫。"
 JAP_the_yamato_spirit: "大和魂"
 JAP_the_yamato_spirit_desc: "[ROOT.GetAdjective]人民心意相通，由貫穿社會的大和之魂聯結。我們應確保所有公民知曉昔日的榮耀，並明白為恢復傳統生活方式所需採取的行動。"
 JAP_children_of_the_sun: "日之子"
 JAP_children_of_the_sun_desc: "不僅我們的皇室血脈，[ROOT.GetAdjective]人民本身亦為太陽之子。偉大的天照大神曾將這片土地賜予我們，吾輩當心懷感恩。如今，是時候回報她所賜予的一切了！"
 JAP_the_footsteps_of_jimmu: "神武的足跡"
 JAP_the_footsteps_of_jimmu_desc: "我們的傳奇始祖神武天皇從瀨戶內海附近的日向發起東征，佔領大和並定都於此。受三足烏神八咫鴉指引，其發起大東征，擴展疆域。既然這位神武曾以神明之名征戰四方，我等亦當效仿。"
 JAP_yatagarasus_guidance: "八咫烏的指引"
 JAP_yatagarasus_guidance_desc: "三足烏神八咫鴉作為神明干預人間事務，指引神武征服大和與奈良。如今我等急需指引，理應以此神命名我們的新制度。"
 JAP_the_jeweled_spear_has_struck: "寶槍已出鞘"
 JAP_the_jeweled_spear_has_struck_desc: "天之御柱曾被創世神伊邪那岐與伊邪那美用以從海中升起陸地。正如他們曾用此柱開拓新土，我等亦將如此。現在是見證天之御柱再次揮舞之時。"
 JAP_the_jeweled_spear_has_struck_tt: "解鎖決議，可對§Y亞洲§!國家宣稱領土，並獲得對其所屬者的§Y戰爭目標§!。每次只能選擇一個目標國，並需先佔領已宣稱的所有地區，方可繼續宣稱更多。"
 JAP_hakko_ichiu: "八紘一宇" # Hakkō Ichiu
 JAP_hakko_ichiu_desc: "世界當歸於一統！我等有神聖權利統治天下，正如《日本書紀》所載。神武天皇登基時宣告：“兼六合以開都，掩八紘而為宇。”時機已到，正是實現這一宏願的時刻！"
 JAP_hakko_ichiu_tt: "解鎖整合§Y亞洲§!地區的決議，條件是這些地區已被我們§Y擁有§!，或§Y控制並提出領土主張§!"
 JAP_embodying_empress_jinguu: "化身神功皇后" # Embodying Empress Jingū
 JAP_embodying_empress_jinguu_desc: "正如良子皇后的丈夫遇害，昔日的神功皇后也曾遭遇同樣的厄運。她由此發起復仇征伐，隨後將目光投向應許之地。歷經三年征戰她凱旋歸來。我們應當延續這一傳奇，將其貫徹到底。"
 JAP_to_reach_princess_kaguya: "致敬輝夜姬"
 JAP_to_reach_princess_kaguya_desc: "竹取物語中，月宮公主輝夜姬嬰兒時被發現於一株發光竹中。故事末尾，她揭示自己的天界身份並返回月宮。既然現在技術已經允許，我們應竭力再度與她相會。"
 JAP_to_rival_zheng_yi_sao: "與鄭一嫂爭鋒"
 JAP_to_rival_zheng_yi_sao_desc: "鄭一嫂是活躍於南中國海的傳奇女海盜，堪稱史上最成功女性海盜。我們應繼承並超越此傳奇，就以偉大的良子皇后的名義！"
 JAP_amaterasus_aramitama: "天照荒魂的武器"
 JAP_amaterasus_aramitama_desc: "協助神功皇后征伐朝鮮諸國的神靈之一為天照大神的暴烈化身——撞賢木嚴之御魂天疎向津媛命。此神擁有太陽女神之大能，我們應當設法將其力量化為己用！"
 JAP_okadas_military_purge_speech: "岡田的軍事清洗演說"
 JAP_okadas_military_purge_speech_desc: "軍方此番行徑過甚。如果無數暗殺及邊緣勢力試圖推翻政府的舉動尚不足夠，如今他們又借近期事件強化自身權力，意圖從民眾手中奪取國家控制權。是時候採取行動遏制軍權膨脹，讓岡田明白誰才是這個國家的統治者了。"
 JAP_okadas_military_purge_speech_tt: "§R這將導致政府與軍方之間衝突升級，唯有廢除《治安維持法》才能解決！§!"
 JAP_ministry_of_commerce_and_industry: "商工省"
 JAP_ministry_of_commerce_and_industry_desc: "為了更好地掌控國家財政，我們應擴大商工省的職權，並確保其擁有足夠的資源履行職責。"
 JAP_continue_takahashi_korekiyos_policies: "延續高橋是清的政策"
 JAP_continue_takahashi_korekiyos_policies_desc: "高橋子爵是清使我國免於大蕭條的長期困擾，穩定了經濟。但為此，他削減了軍費，這一決定在軍方極不受歡迎。儘管如此，我們仍應繼承他的經濟路線！"
 JAP_increase_armament_spending: "增加軍備開支"
 JAP_increase_armament_spending_desc: "儘管高橋子爵對經濟貢獻巨大，但卻使我們在面對即將到來的戰爭時準備不足。我們必須重新投資軍事工業，以糾正這一失誤。"
 JAP_approach_mitsui: "拉攏三井財閥"
 JAP_approach_mitsui_desc: "三井財閥源於江戶時代，如今是我國最大的工業企業之一。我們必須贏得其支持，以最大化其在國家建設中的作用。"
 JAP_reduce_zaibatsu_focus_cost_tt: "採取§Y$JAP_sea_guide_the_zaibatsus$§!或§Y$JAP_democratic_work_with_the_zaibatsus$§!可將研究時間縮短至 §G35§!天。"
 JAP_approach_mitsubishi: "拉攏三菱財閥"
 JAP_approach_mitsubishi_desc: "三菱最初是明治時代的航運公司，如今在我國軍事工業中佔有主導地位。我們必須確保其支持國家政權，並充分利用其設施。"
 JAP_approach_sumitomo: "拉攏住友財閥"
 JAP_approach_sumitomo_desc: "住友財閥源自京都的書店，後因精煉銅而聞名。如今在礦產開採和銀行領域舉足輕重。我們必須利用好他們的資產。"
 JAP_approach_yasuda: "拉攏安田財閥"
 JAP_approach_yasuda_desc: "安田財閥始於明治時代，長期專注銀行業，現已深度滲透我國金融體系。我們必須獲取其支持，以充分調動其龐大財富。"
 JAP_fund_the_riken_institute: "資助理研"
 JAP_fund_the_riken_institute_desc: "理化學研究所創立於大正時代的1917年，目前由擁有約121家工廠和63家公司的理研集團控制。在大河內正敏子爵的領導下，我們應進一步擴建此機構，以便開展我國原子研究計劃。"
 JAP_fund_the_riken_institute_tt: "若$JAP_zaibatsu_faction$至少為$JAP_imperial_influence_tier_3$，則額外獲得§G1§!§Y核研究設施§!"
 JAP_build_the_nishotaki_and_miyanaka_dams: "修建西瀧與宮中水壩"
 JAP_build_the_nishotaki_and_miyanaka_dams_desc: "隨著新工廠與設施的建設，我國對電力的需求已超出現有產能。我們應建設新的水力發電站，以避免依賴燃煤發電，節約寶貴煤炭資源。"
 JAP_establish_synthetic_fuel_joint_venture: "建立合成燃料合資企業"
 JAP_establish_synthetic_fuel_joint_venture_desc: "自20世紀20年代起，我們已與德國開展合成資源開發合作。我們應擴大合作，與西方強國聯合開發煤與油的合成技術，達成能源自給。"
 JAP_establish_synthetic_fuel_joint_venture_tt: "若有§Y西方主要§!國家給予我們§Y擔保§!，或對§Y[ROOT.GetNameDef]§!評價不低於§Y75§!，我[ROOT.GetNameDef]將獲得額外的$cat_synth_oil$研究加成及§Y$synthetic_refinery$§!"
 JAP_establish_nippon_hassoden: "成立日本發送電株式會社"
 JAP_establish_nippon_hassoden_desc: "為加強政府對國家電力供應的控制與調配，我們應整合全國電力公司，成立統一的日本發送電株式會社，全面監管電力產業。"
 JAP_new_industrial_city_development_policy: "新工業城市發展政策"
 JAP_new_industrial_city_development_policy_desc: "國家土地規劃委員會制定了一項計劃，在全國設立以軍工為核心的新城市，集中發展軍隊與海軍物資工廠，並進行配套的大規模城市規劃。我們應投資該項目。"
 JAP_establish_housing_corporation: "成立住宅公社"
 JAP_establish_housing_corporation_desc: "為解決全國住房需求，我們應設立住宅公社，興建數以萬計的工人住宅，以及面向工匠和普通百姓的廉租房。"
 JAP_central_agricultural_association: "中央農業協會"
 JAP_central_agricultural_association_desc: "目前農業組織雜亂分散，若想解決供應鏈瓶頸問題，就必須整合各地農業機構。應由千石興太郎牽頭，依照農業團體法設立中央農業協會。"
 JAP_the_five_great_cities: "五大都市"
 JAP_the_five_great_cities_desc: "京都、大阪、橫濱、神戶與名古屋已被列為特別城市，享有超越普通城市的特殊地位，以促進其工業化與城市化進程。我們應加大對這些城市的投資。"
 JAP_resource_security: "資源保障"
 JAP_resource_security_desc: "我們打造資源自給的宏偉目標終於實現！我國自然資源充盈，將使我們更加強大，所向披靡！"
 JAP_ship_management_committee: "船舶管理委員會"
 JAP_ship_management_committee_desc: "隨著《戰時航運管制令》的通過，我們可以成立專責機構管理航運產業，配合國家戰略，充分釋放戰時航運潛能。"
 JAP_convoy_production_cost_tt: "[JAPGetConvoyProductionCostBonusText]"
 JAP_ship_management_committee_tt: "§Y$convoy_1$§!：\n   £production_cost 生產花費：§G-15.00%§!"
 JAP_danganressha: "子彈列車計劃" # Danganressha
 JAP_danganressha_desc: "鐵道省批准了“子彈列車”計劃（彈丸列車計劃），在現有標準軌道旁增設寬軌，用於高速貨運列車。鐵路先驅島安次郎及其子承諾協助開發該系統。"
 JAP_ministry_of_colonial_affairs: "拓殖省"
 JAP_ministry_of_colonial_affairs_desc: "最初設立為北海道開拓使的拓殖省如今職責已大幅擴展。我們應賦予其更大權限，以妥善管理南洋、朝鮮、樺太、關東與臺灣。願這些土地永遠被稱作日本領土！"
 JAP_manchuria_five_year_plan: "滿洲工業五年計劃"
 JAP_manchuria_five_year_plan_desc: "我們的島國缺乏可用土地，但我們在大陸的領地卻不然。我們無法在本土建造的，可以在大陸實現。因此我們將啟動一項大規模的工業化計劃，以發展[MAN.GetNameDef]。"
 JAP_establish_manchuria_airplane_manufacturing_company: "成立滿洲飛機公司"
 JAP_establish_manchuria_airplane_manufacturing_company_desc: "為了在更接近資源開採地的地方生產裝備，中島飛行機公司提出在滿洲建立一家子公司，目前稱為“滿洲航空”。我們必須支持這一卓越構想。"
 JAP_eastern_road_and_steel_expansion: "東部鐵道與鋼鐵擴建計劃"
 JAP_eastern_road_and_steel_expansion_desc: "為促進滿洲的礦業與工業擴展，我們應成立“東部道路開發公司”。完成後，將在鐵廠子、五道江與石人溝設立採礦站，並在大砬子和七道溝設立鐵礦辦事處。"
 JAP_sea_promote_japanese_settlement: "鼓勵日本人移民"
 JAP_sea_promote_japanese_settlement_desc: "通過將本國民眾遷往滿洲，我們可以增加勞動力，從而建設更多工廠。這些移民也能從事農業生產，將農產品運回本土。"
 JAP_construct_the_sui_ho_dam: "修建水豐大壩"
 JAP_construct_the_sui_ho_dam_desc: "為保障滿洲遼寧省的工業電力供應，我們應修建水豐重力式大壩。工程師已繪製出全亞洲最大的水壩設計，並計劃與鴨綠江水電公司與平北鐵道公司合作建造。"
 JAP_the_shuilikeng_power_plant: "水裡坑發電站"
 JAP_the_shuilikeng_power_plant_desc: "我們對臺灣的開發正按計劃推進，但發電問題日益緊迫。門牌潭發電廠等水電站的建設稍微緩解了這一狀況。我們應當效仿過去工程師的做法，繼續在島內建設水壩與發電站。"
 JAP_develop_the_south_seas_mandate: "開發南洋領"
 JAP_develop_the_south_seas_mandate_desc: "世界大戰後國際聯盟授予我國的南洋群島託管地廣袤且多未開發，極具利用價值。若我們能著力發展這些地區，並使其專注於為國民提供財富，管轄該地區的南洋廳甚至可能說服當地人完全融入我國。"
 JAP_build_up_korean_industries: "擴建朝鮮工業"
 JAP_build_up_korean_industries_desc: "我們應集中力量發展朝鮮半島工業基礎，尤其是重工業與軍火工業領域。畢竟，在即將到來的對華或對西方戰爭中，這些產業將發揮不可估量的作用。該政策最初由宇垣一成提出，我們應當繼續推進。"
 JAP_increase_agricultural_export: "增加農業出口"
 JAP_increase_agricultural_export_desc: "自取得朝鮮領土以來，這片土地一直充當帝國的糧倉。我們應大力拓展糧食生產，使其糧食可輸送至帝國全境。"
 JAP_hydroelectric_dams_in_korea: "水力發電大壩"
 JAP_hydroelectric_dams_in_korea_desc: "若無干預，朝鮮的工業化與電氣化進程將戛然而止。我們應在該地區建設新的重力壩，漢江水電公司的工程師已為名為華川大壩的工程制定了詳盡方案。"
 JAP_prepare_for_peninsular_warfare: "為半島戰爭做準備"
 JAP_prepare_for_peninsular_warfare_desc: "若戰事不利，朝鮮半島很可能會成為我們在大陸的最後據點。我們應做好準備，以在最壞情況發生時守住該地區。"
 JAP_establish_the_japanese_korean_army: "擴編朝鮮軍"
 JAP_establish_the_japanese_korean_army_desc: "自1904年以來，朝鮮軍一直作為駐朝鮮的守備部隊存在，除1931年侵略滿洲外，很少參與作戰。我們應廢除束縛朝鮮總督府的條約，擴編此部隊，使其成為真正的戰鬥力量。"
 JAP_increase_crop_yields: "提升農作物產量"
 JAP_increase_crop_yields_desc: "南洋群島盛產椰子，這是一種極具利潤潛力的經濟作物。我們應鼓勵將私人企業精神與政府資本相結合的壟斷經營模式。同時，同時，通過與南洋興發公司簽訂合約，可種植甘蔗、開設製糖廠，並栽培香蕉、菠蘿、芋頭、木薯、咖啡等熱帶農產品，使群島的產量與臺灣相當。"
 JAP_improve_agricultural_output: "改善農業產出"
 JAP_improve_agricultural_output_desc: "臺灣的工業產值即將超過農業產值。儘管這對工業發展有利，但遠非理想局面，因為臺灣的農產品出口對維持民眾幸福和軍隊供應極為重要。我們必須立即對此加以改善！"
 JAP_upgrade_the_oriental_development_company: "擴大東洋拓殖株式會社"
 JAP_upgrade_the_oriental_development_company_desc: "東洋拓殖株式會社目前設有九個活躍分支，業務幾乎覆蓋我們所有海外領地。它們分別引導地區發展方向以符合我們的目標，並主導工農業向效率優先的方向發展。因此，若要改善殖民地狀況，我們應擴大該公司規模，確保其所需資源有求必應。"
 JAP_the_imperial_defense_plan: "[JAP_the_imperial_defense_plan_key]"
 JAP_the_imperial_defense_plan_imperial: "帝國防禦計劃"
 JAP_the_imperial_defense_plan_national: "國防計劃"
 JAP_the_imperial_defense_plan_desc: "為保衛國家，我們必須制定一項主動防禦的新戰略。所有戰爭都應通過突如其來的大規模決定性打擊來獲勝，避免長期戰事，迫使敵人屈服。"
 JAP_first_strike_principle_tt: "當§Y[ROOT.GetNameDef]§!向§Y鄰國§!或附屬國鄰國§R宣戰§!時，獲得為期§Y90天§!的加成：\n§Y$JAP_first_strike_principle_dm$§!\n$MODIFIER_ATTACK_BONUS_AGAINST_A_COUNTRY$：§G+10.0%§!\n$MODIFIER_BREAKTHROUGH_BONUS_AGAINST_A_COUNTRY$：§G+10.0%§!"
 JAP_kantai_kessen_tt: "當§Y[ROOT.GetNameDef]§!向擁有§Y$capital_ship$§!的國家§R宣戰§!時，獲得為期§Y180天§!的加成：\n§Y$JAP_kantai_kessen_dm$§!\n對該國的主力艦攻擊加成：§G+10.0%§!\n對該國的偵測速度加成：§G+10.0%§!"
 JAP_first_strike_blocked_due_to_kwantung_army_tt: "注意：因關東軍發動§R計劃之外的進攻§!，將無法獲得§Y$JAP_first_strike_principle_dm$§!加成"
 JAP_divert_naval_guns_to_the_army: "艦炮移交陸軍"
 JAP_divert_naval_guns_to_the_army_desc: "為使陸軍能夠運用列車炮和坦克等重型武器，我們必須將部分艦炮產能轉移至陸軍。"
 JAP_divert_naval_guns_to_the_army_tt: "在[ROOT.capital.GetName]創建§Y2個$railway_gun_equipment_1$§!單位。"
 JAP_expand_kawagoe_army_arsenal: "擴建川越陸軍兵工廠"
 JAP_expand_kawagoe_army_arsenal_desc: "目前，我國軍工產業難以滿足現代戰場的生產需求。我們應擴建埼玉縣的川越陸軍兵工廠，以提高供需匹配能力。"
 JAP_reform_the_army: "陸軍改革"
 JAP_reform_the_army_desc: "迅速晉升的寺內壽一將軍提議修訂陸軍作戰原則。他認為舊有的大規模突擊戰術已過時，未來戰場將由更機動的戰爭方式主導。我們應採納其建議，確保不會落後於時代。"
 JAP_rely_on_supremacy_of_the_will: "依靠步兵進攻"
 JAP_rely_on_supremacy_of_the_will_desc: "東條英機將軍曾提出，戰爭應通過決定性的先發制人打擊取勝，戰鬥則依靠光榮的集群衝鋒和意志至上。它與我們現行軍事學說高度契合，我們應支持此理念。"
 JAP_rethink_armor_doctrine: "重新思考裝甲學說"
 JAP_rethink_armor_doctrine_desc: "寺內壽一得出了嚴峻結論：我軍現有裝甲與陸地車輛設計僅適合對抗輕步兵，若遭遇西方裝甲部隊必將損失慘重。我們應儘快糾正此缺陷！"
 JAP_foreign_tank_modernization_cooperation: "外國坦克現代化計劃"
 JAP_foreign_tank_modernization_cooperation_desc: "要戰勝西方，首先必須研究他們的設計，從而找到克敵制勝之道。我們應與某個西方強國建立友好關係，以期最終能製造出令他們驚歎的坦克。"
 JAP_foreign_tank_modernization_cooperation_tt: "一個§Y西方主要國家§!已對§Y[ROOT.GetNameDef]§!提供§Y保障§!或與其處於§Y同一陣營§!"
 JAP_foreign_tank_modernization_cooperation_2_tt: "為所有§Y坦克設計師§!解鎖軍工機構特性§Y$JAP_mio_trait_foreign_research_and_development_cooperation$§!。§R但僅能應用於其中之一§!。"
 JAP_domestic_tank_modernization_program: "國內坦克現代化計劃"
 JAP_domestic_tank_modernization_program_desc: "我們必須從錯誤中吸取教訓，確保裝甲部隊能抵禦反坦克武器，否則我軍必將失敗。此舉僅靠西方設計遙遙無期，我們真正應該改仰仗的是偉大的[ROOT.GetAdjective]民族的智慧。"
 JAP_the_ultimate_tank: "終極坦克"
 JAP_the_ultimate_tank_desc: "我們的工程師提出絕妙主意：與其部署大量小型戰車，不如建造能在最小支援下碾壓敵人的鋼鐵巨獸。首個草案為O-I坦克，我們應儘快著手將這一構想變為現實。"
 JAP_the_ultimate_tank_tt: "\n當§Y$super_heavy_tank_chassis$§!科技研發完成時：\n"
 JAP_prepare_the_northern_front: "備戰北方戰線"
 JAP_prepare_the_northern_front_desc: "關東軍渴望與[SOV.GetNameDef]進行一場真正的較量已久，但一直缺乏必要的軍事基礎設施。我們應投資擴建滿洲的公路與鐵路，以便最終將[SOV.GetAdjective]勢力驅逐出西伯利亞。"
 JAP_enact_the_national_conscription_law: "頒佈國家徵兵法"
 JAP_enact_the_national_conscription_law_desc: "已頒佈法令，徵召所有符合條件的[ROOT.GetAdjective]男子入伍。我們應派遣徵兵員四處徵兵，任何偏遠村莊都不可放過，以便迅速擴大兵源。"
 JAP_instill_the_spirit_of_bushido: "灌輸武士道精神"
 JAP_instill_the_spirit_of_bushido_desc: "利用國家神道和被稱為武士道的傳統道德觀念，我們得以向民眾灌輸為國家和皇室利益犧牲自我的必要性。"
 JAP_instill_the_spirit_of_bushido_tt: "啟用戰術：§Y$tactic_grand_banzai_charge$§!"
 JAP_adopt_new_assault_doctrine: "採納新型突擊學說"
 JAP_adopt_new_assault_doctrine_desc: "畑俊六將軍提出了一種在戰鬥中決定性擊敗敵軍的新戰法：通過集中大量火炮轟擊迫使敵人屈服，再以衝鋒擊潰殘餘。"
 JAP_develop_lethal_infantry_equipment: "開發致命步兵裝備"
 JAP_develop_lethal_infantry_equipment_desc: "陸軍已明確表示現有武器過於落後，要求採取改進措施。我們應大力投資研發更現代化的步兵裝備，確保今後不再戰敗。"
 JAP_develop_lethal_infantry_equipment_tt: "若$JAP_army_faction$至少為$JAP_imperial_influence_tier_3$，則額外獲得：\n"
 JAP_develop_sophisticated_artillery_equipment: "開發先進火炮裝備"
 JAP_develop_sophisticated_artillery_equipment_desc: "陸軍已明確表示現有武器過於落後，要求採取改進措施。我們應大力投資現代炮兵研發，如此，便不必等敵人投降就可以發起衝鋒。"
 JAP_expand_the_irago_proving_ground: "擴建伊良湖試驗場"
 JAP_expand_the_irago_proving_ground_desc: "為更好地掌控戰場，我們應擴建伊良湖試驗場用於測試新型實驗性武器。我們也許能在那裡研發出令敵人俯首稱臣的戰爭利器。"
 JAP_sea_mountaineers: "組建山地兵團"
 JAP_sea_mountaineers_desc: "我軍意識到，非採取重大改變，否則無法突破中國南部和西部的山區。因此，他們請求成立特種登山旅，以領導進攻並突破敵軍防線。"
 JAP_jungle_adaptation: "叢林適應訓練"
 JAP_jungle_adaptation_desc: "我軍意識到，非採取重大改變，否則無法穿越緬甸及大印度尼西亞的叢林地帶。因此，他們請求成立特種叢林師，以領導進攻並突破敵軍防線。"
 JAP_army_weapons_administration_headquarters: "陸軍武器管理總部"
 JAP_army_weapons_administration_headquarters_desc: "為統一陸軍武器製造、供應、研發、測試及訓練，我們應設立陸軍武器管理總部。此舉有望使我國工業與[SOV.GetNameDef]與[USA.GetNameDef]等強敵抗衡。"
 JAP_army_weapons_administration_headquarters_tt: "若$JAP_army_faction$至少為$JAP_imperial_influence_tier_3$，則額外獲得§G1§!§Y地面戰設施§!"
 JAP_pivot_towards_defensive_measures: "轉向防禦策略"
 JAP_pivot_towards_defensive_measures_desc: "戰爭形勢對我並非完全有利。敵軍登陸本土島嶼的可能性日益增加，而我方對此缺乏應對之力。我們應著手解決此問題，避免自招百年屈辱！"
 JAP_strenghten_the_supply_lines: "強化補給線"
 JAP_strenghten_the_supply_lines_desc: "我們的補給線已超出承受能力，導致部隊不斷遭受損失。若想持續取得勝利，必須儘快解決此問題。時間所剩無幾，部隊很快就會因支撐不住而潰敗。"
 JAP_ni_go_nuclear_project: "二號核計劃"
 JAP_ni_go_nuclear_project_desc: "陸軍委員會在理研所設立了一個名為“二號項目”的實驗項目，旨在通過熱擴散法分離鈾-235，而非選擇電磁分離、氣體擴散和離心分離等替代方法。希望我們能儘快掌握這一技術並將其用於軍事用途。"
 JAP_establish_showa_aircraft_idnsutry: "建立昭和航空工業"
 JAP_establish_showa_aircraft_idnsutry_desc: "我們收到請求，有人希望在東京昭島成立昭和飛機工業株式會社，該公司計劃製造軍用飛機供武裝部隊使用。我們應批准其申請，要求其立即著手提供航空裝備。"
 JAP_develop_new_fighters: "開發新型戰鬥機"
 JAP_develop_new_fighters_desc: "由三菱重工最新設計的一款艦載戰鬥機或許將被證明是該機型領域迄今為止最為強大的存在，其無與倫比的機動性以及優秀的航程意味著此型號足可堪用多年，我們應該立即開始對原型機展開設計以及試製。"
 JAP_modern_bombers: "現代轟炸機"
 JAP_modern_bombers_desc: "現代化戰術轟炸機部隊是支援地面部隊的關鍵。我們應命令陸軍和海軍同時研發具備戰術支援能力的飛機。"
 JAP_improve_the_type_91_aerial_torpedo: "改進91式航空魚雷"
 JAP_improve_the_type_91_aerial_torpedo_desc: "我們應研發專攻淺水區艦船的魚雷，以提升港口打擊能力。這些空投魚雷將借鑑最先進的長矛魚雷，其戰果或將遠超我們預期。"
 JAP_7075_aluminium_alloy: "7075鋁合金"
 JAP_7075_aluminium_alloy_desc: "單靠射程取勝是無稽之談，若飛機機動性不及敵機，將無法與敵機抗衡。我們必須製造具備優異機動性的飛機以避免被敵方迂迴。三菱工程師研發出的新型鋁合金將徹底革新飛機制造。"
 JAP_escort_efficiency: "投資護航機隊"
 JAP_escort_efficiency_desc: "必須在所有領域保持對敵優勢，包括空戰，否則轟炸機和運輸機將被攔截擊落。現代化戰鬥機是實現未來勝利的關鍵。"
 JAP_sea_sturdy_aircraft: "堅固的飛機"
 JAP_sea_sturdy_aircraft_desc: "機動性和射程固然重要，但並非決定空戰勝利的唯一因素。若飛機脆弱如紙，戰鬥尚未開始就已經宣告失敗。為確保未來數年掌握制空權，我們應投資研發更堅固機身和更厚裝甲。"
 JAP_sea_sturdy_aircraft_tt: "降低針對特定角色的空中襲擊概率"
 JAP_sea_long_operational_range: "遠距離作戰航程"
 JAP_sea_long_operational_range_desc: "儘管我們渴望快速取勝，但僅靠正面交鋒沒那麼容易贏得戰爭。太平洋戰區距離遼闊，若要取勝，需要研發能跨越長遠距離的機型。"
 JAP_project_z_bomber_project: "Z計劃轟炸機計劃"
 JAP_project_z_bomber_project_desc: "敵國首都距我們甚遠，難以實現快速結束戰爭所需的先發制人打擊。因此，我們應制造能抵達美國東海岸的飛行器，並投資研發可摧毀敵後工業的新型戰略轟炸機。"
 JAP_adopt_new_air_doctrine: "採納新空軍學說"
 JAP_adopt_new_air_doctrine_desc: "面對技術相當的敵軍，我們意識到必須現代化作戰原則以跟上時代。"
 JAP_the_divine_wind: "神風特攻"
 JAP_the_divine_wind_desc: "作為一支特攻隊，神風突擊隊將自殺式攻擊由最後時刻的突發奇想變作了既定的教條。在新式飛機——一種有人駕駛的飛彈——的協助下，這種攻擊將不可阻擋。"
 JAP_sea_unify_the_air_forces: "空軍統一"
 JAP_sea_unify_the_air_forces_desc: "長久以來，陸軍與海軍各自為政的航空研發一直困擾著我們。我們必須統一這些項目，以確保裝備的標準化，並更有效地利用有限的研究資源。"
 JAP_sea_unify_the_air_forces_tt: "為所有§Y飛機設計師§!解鎖軍工機構特性§Y$JAP_mio_trait_unified_research_and_development$§!。§R但僅能應用於其中之一§!。"
 JAP_sea_unify_the_air_forces_2_tt: "將§Y$JAP_army_and_naval_air_services_dm$§!替換為§Y$JAP_japanese_airforce_dm$§!，效果變化："
 JAP_improved_radio_communications: "改進無線電通信"
 JAP_improved_radio_communications_desc: "我們的無線電設備目前狀況極差，導致部隊因通訊不暢在叢林和偏遠島嶼頻繁失聯。我們必須更新設備，建設新無線電塔，以避免此類情況再次發生。"
 JAP_combined_arms: "聯合兵種"
 JAP_combined_arms_desc: "空陸兩軍協同作戰是取勝關鍵。為提供更好支援並掃清我軍可能遇到的戰場障礙，我們應投資發展能讓空軍與其他軍種協同作戰的聯合兵種戰術。"
 JAP_sea_jet_prototypes: "皇國二號兵器"
 JAP_sea_jet_prototypes_desc: "航空的未來不在螺旋槳，而在提升性能。我們必須著眼於噴氣推進技術。工程師將該實驗機項目命名為“帝國武器二號”，型號稱為“橘花”。"
 JAP_rockets_development: "火箭研發"
 JAP_rockets_development_desc: "巖畔豪雄在空對地導彈和地對空防空導彈方面提出了許多出色的構想。我們應推廣其理念，研發新型火箭技術，這將有助於我們取得未來的勝利。"
 JAP_expand_hiratsuka_navy_arsenal: "擴建平冢海軍彈藥廠"
 JAP_expand_hiratsuka_navy_arsenal_desc: "1905年成立的平塚海軍彈藥廠具有極大的擴建潛力。他們能夠將不同工廠專門化，用於設計與工程，包括機槍彈藥、海軍炮彈、溶劑回收以及硝化甘油生產。"
 JAP_expand_hiratsuka_navy_arsenal_tt: "已退出§Y倫敦海軍條約§!，或觸發了§Y升級條款§!"
 JAP_expand_navy_technical_department: "擴大海軍技術部"
 JAP_expand_navy_technical_department_desc: "我們必須重新評估海軍擴建規模及所需造船廠設施。滿足現代化需求的第一步是擴建海軍技術部門。"
 JAP_prepare_the_southern_front: "備戰南方戰線"
 JAP_prepare_the_southern_front_desc: "太平洋戰爭將在很大程度上涉及海軍登陸作戰。海軍特別陸戰隊必須擴編才能勝任此任務。與此同時，投資海軍傘兵也將回報豐厚，他們將先於主力部隊搶佔戰略要地和島嶼。"
 JAP_prepare_the_southern_front_tt: "當[ROOT.GetNameWithFlag]對控制§Y東南亞地區§!的國家§R宣戰§!時："
 JAP_focus_on_aircraft_carriers: "重視航母"
 JAP_focus_on_aircraft_carriers_desc: "戰列艦已是舊時代遺留的產物，如今我們必須放眼屬於航空作戰的未來，航母機動部隊將確保我們能夠在整個太平洋投射空軍力量。"
 JAP_balanced_naval_approach: "均衡型的海軍發展"
 JAP_balanced_naval_approach_desc: "若戰列艦或航空母艦對敵無效，我們應避免自陷僵局。我們應保持均衡的海軍發展策略，對兩個領域進行雙線投資。"
 JAP_sea_battleship_initiative: "戰列艦計劃"
 JAP_sea_battleship_initiative_desc: "憑藉我們卓越的戰列艦設計，我們只需一場決定性的海戰便能分出海上勝負。們必須確保艦隊完成優化配置，以求決戰決勝，如疾風般迅速奪取勝利。"
 JAP_sea_heavier_naval_guns: "加大海軍火力"
 JAP_sea_heavier_naval_guns_desc: "敵方在艦艇重裝甲方面投入巨大。我們必須跟進發展才能確保擊穿其艦體。投資重型海軍火炮勢在必行。"
 JAP_sea_bigger_better_yamato: "對馬級戰列艦"
 JAP_sea_bigger_better_yamato_desc: "鑑於我國資源有限，必須確保物盡其用。我們將建造有史以來地球上最大的戰列艦，足以在正面交鋒中擊敗任何敵人。以此武力，敵人若不臣服，便將滅亡。"
 JAP_yokosuka_naval_air_technical_arsenal: "橫須賀海軍航空技術廠"
 JAP_yokosuka_naval_air_technical_arsenal_desc: "橫須賀海軍航空技術廠將是為新航母艦隊提供最先進飛機的關鍵。它將專注於提供改良的設計方案，再由愛知航空機和九州飛行機株式會社大規模生產，最終於廣海軍工廠組裝。"
 JAP_establish_the_mine_warfare_force: "成立佈雷部隊"
 JAP_establish_the_mine_warfare_force_desc: "我們注意到，西方國家利用水雷控制海域。我們應當效仿，但同時也需要建立一支專責部隊，負責水雷監控與掃雷。"
 JAP_akizuki_class_destroyers: "秋月級驅逐艦"
 JAP_akizuki_class_destroyers_desc: "我們需要具備強大防空能力的多用途艦艇，配屬航母編隊和戰鬥艦隊。我們的工程師已著手改進夕雲級驅逐艦，並開始設計一種名為秋月級的新艦艇。"
 JAP_form_the_kido_butai: "組建機動部隊" # Form the Kidō Butai
 JAP_form_the_kido_butai_desc: "為在最大程度上發揮攻擊戰力，我們將實現世界上最大規模的航母集中作戰運用。通過踐行發展這種模式下的協同進攻理論，敵軍將斷無機會對抗我們壓倒性的海軍航空兵力量。"
 JAP_form_the_kido_butai_tt: "針對§Y[USA.GetNameWithFlag]§!的§Y襲擊§!珍珠港行動成功率將提高"
 JAP_nationalize_suzuka_naval_arsenal: "國有化鈴鹿海軍工廠"
 JAP_nationalize_suzuka_naval_arsenal_desc: "鈴鹿海軍工廠負責海軍航空彈藥、輕武器及軍需品生產。我們應將其國有化，控制其擴建規模，並在此增設新的海軍修理廠。"
 JAP_nationalize_fujinagata_shipyards: "國有化藤永田造船所"
 JAP_nationalize_fujinagata_shipyards_desc: "藤永田造船廠為大阪重要造船及鐵路車輛製造廠，戰略意義重大。為擴建設施並徵召更多勞動力，我們應推動其國有化。"
 JAP_naval_armaments_program: "海軍軍備計劃"
 JAP_naval_armaments_program_desc: "為確保我們的造船工業能跟上日益壯大的理想藍圖，海軍已制定快速海軍軍備補充計劃。該計劃包含建造新戰艦，目標是將艦艇數量擴充至最少293艘。"
 JAP_naval_armaments_program_tt: "完成§Y$JAP_focus_on_aircraft_carriers$§!時：生成航母§Y衍生型號§!並開啟§Y4 條生產線§!，用於建造§Y翔鶴級§!。\n完成§Y$JAP_balanced_naval_approach$§!時：生成航母與超級戰列艦§Y衍生型號§!，並分別開啟§Y2 條生產線§!，用於建造§Y翔鶴級§!和§Y大和級§!。\n完成§Y$JAP_sea_battleship_initiative$§!時：生成超級戰列艦§Y型號§!並開啟§Y4 條生產線§!，用於建造§Y大和級§!。\n"
 JAP_radio_guided_missiles: "熱尋導彈"
 JAP_radio_guided_missiles_desc: "帝國陸軍軍械委員會在制導武器研發上取得重大進展。他們即將在自由落體式、紅外製導、陀螺穩定的導彈技術上取得突破，這種導彈設計用於由飛機投放攻擊艦船目標。該新型武器被命名為“慶號”。"
 JAP_assure_superior_naval_quality: "保證海軍質量優勢"
 JAP_assure_superior_naval_quality_desc: "儘管數量上的優勢很重要，但我們絕不能允許敵人擁有比我們最強大的軍艦更強大的艦船。大和號是個良好的開端，但還需要改進發展。"
 JAP_seek_strength_in_numbers: "尋求數量優勢"
 JAP_seek_strength_in_numbers_desc: "單艦不敵眾。我們需要多樣化艦隊，擴大數量而非僅注重質量。畢竟，數量本身即是一種質量。"
 JAP_seek_strength_in_numbers_tt: "為所有§Y海軍設計師§!解鎖軍工機構特性§Y$JAP_mio_trait_strength_in_numbers$§!。§R但僅能應用於其中之一§!。"
 JAP_secure_the_sea_lanes: "保障海上航道安全"
 JAP_secure_the_sea_lanes_desc: "艦隊需要最先進的護航艦艇來防範敵潛艇和魚雷艇。只有在這方面投入資源，運輸艦隊才能安全抵達。"
 JAP_fix_flawed_naval_designs: "修正有缺陷的設計"
 JAP_fix_flawed_naval_designs_desc: "我們的艦船設計重心偏高，出港即有傾覆事故。必須立即解決這一問題，確保艦船能安全遠航。"
 JAP_f_go_nuclear_project: "F號核計劃"
 JAP_f_go_nuclear_project_desc: "海軍司令部希望啟動一項核研究計劃，並將此技術運用於我們的艦隊。他們提議由京都帝國大學的荒勝文策負責該項目，團隊成員包括著名的理論物理家湯川秀樹，他必定能取得我們所需的突破。"
 JAP_combined_nuclear_research_efforts: "聯合核研究計劃"
 JAP_combined_nuclear_research_efforts_desc: "隨著各軍種間的對立接近尾聲，現在正是將各自雄心勃勃的核計劃統一起來的時候，我們將集結全國智囊在同一個團隊中共事。"
 JAP_end_the_interservice_rivalry: "終結軍種對立"
 JAP_end_the_interservice_rivalry_desc: "我們的勝利證明我國有能力成為世界強國，內部派系間的資源爭鬥則顯得無關緊要。是時候結束因利益而來的長期分裂，確保[ROOT.GetAdjective]在未來數世紀內主導亞洲。"
 JAP_end_the_interservice_rivalry_tt: "將終結陸軍與海軍之間的§Y軍種對立§!。它們之間的地位差異將§G不再產生負面效果§!，而是像其他派系一樣運作"
 JAP_seek_yakuza_support: "尋求黑道支持"
 JAP_seek_yakuza_support_desc: "許多龐大的勢力團體暗中掌權，操控並影響著政客與將軍的決策。我們應嘗試說服這些團體與我們結盟，確保軍方不會獨斷專行。"
 JAP_seek_yakuza_support_tt: "§Y內戰§!時更大一部分§Y帝國陸軍§!將倒向我方"
 JAP_seek_yakuza_support_2_tt: "§G1§!名§Y將軍§!將效忠我方"
 JAP_expand_the_metropolitan_police: "擴充警視廳"
 JAP_expand_the_metropolitan_police_desc: "我們確信，民用警察部隊是一支隨時可投入戰鬥且堅定站在我們這一邊的隊伍。他們不受軍方控制，曾協助我們打倒皇道派，如今亦可協助我們恢復秩序。"
 JAP_expand_the_metropolitan_police_tt: "§G2§!名§Y將軍§!將效忠我方"
 JAP_expand_the_metropolitan_police_2_tt: "§Y內戰§!爆發時民主主義政府將額外獲得§G8§!個§Y警察師§!"
 JAP_secretly_rebuild_the_party: "秘密重建日本共產黨" # Can also be Secretly Rebuild the Party
 JAP_secretly_rebuild_the_party_desc: "1925年《治安維持法》簽署後，許多群體失去了發聲權與政治代表性。其中一支便是共產黨人——他們的組織被取締，在舊政權下遭受嚴重鎮壓。我們必須尋求使其運動合法化，以爭取他們成為我們反軍部鬥爭的支持者。"
 JAP_secretly_rebuild_the_party_tt: "解鎖§Y滲透反對派控制地區§!的決議，確保其§Y內戰§!爆發時加入§Y共產主義者§!"
 JAP_anti_militarist_speeches_in_the_diet: "在國會發表反對軍國主義的演說"
 JAP_anti_militarist_speeches_in_the_diet_desc: "隨著全國反軍部情緒的高漲，我們應當順勢將這些批評狂熱民族主義的人群進一步引向左翼。為此，可以由磯雄發表批評傳統的演講，並盡力在街頭分發共產黨宣傳資料。"
 JAP_anti_militarist_speeches_in_the_diet_tt: "解鎖在全國§Y增加共產主義支持度§!的決議"
 JAP_sway_disillusioned_young_officers: "拉攏失望的青年軍官"
 JAP_sway_disillusioned_young_officers_desc: "最近一次皇道派政變的參與者多為貧困農村出身的年輕軍官，他們對軍隊現行結構和論資排輩而非憑能晉升的制度極為不滿。我們應利用這一點，向他們承諾更美好的明天。"
 JAP_sway_disillusioned_young_officers_tt: "§Y皇道派青年軍官§!共情我方事業"
 JAP_sway_disillusioned_young_officers_2_tt: "§Y內戰§!時較大一部分§Y帝國陸軍§!將倒向我方。"
 focus_effects_are_as_follows_tt: "以下為國策效果："
 JAP_organize_the_student_movements: "組織學生運動"
 JAP_organize_the_student_movements_desc: "我方大學生群體對國家現狀不滿，他們的思想與日本共產黨部分重要成員不謀而合。我們應組織“全學共鬥會議”，以在校園中傳播社會主義思想。"
 JAP_organize_the_student_movements_tt: "§Y內戰§!爆發時，敵方將獲得持續§Y365§!天的以下國家精神："
 JAP_raise_support_within_the_proletarian_class: "在無產階級中爭取支持"
 JAP_raise_support_within_the_proletarian_class_desc: "我們的許多最高領導人出身工人階級，曾在造船廠和鋼鐵廠工作。我們應鼓勵日本無產階級建立工會，抵抗那些試圖踐踏他們權利的人。"
 JAP_raise_support_within_the_proletarian_class_tt: "§Y[529.GetName]§!將支持日本共產黨"
 JAP_raise_support_within_the_proletarian_class_2_tt: "我們將在§Y內戰§!時獲得§Y$JAP_strong_unions_idea$§!"
 JAP_organize_underground_resistance: "建立地下抵抗網絡"
 JAP_organize_underground_resistance_desc: "若我黨不僅要與軍部抗衡，還要挑戰中央政府，就必須擁有一個遠離其權力觸及的根據地。從那裡，我們可以開始解救被囚禁的同志，並著手奪取武器以備革命之用。"
 JAP_organize_underground_resistance_tt: "解鎖決議：§Y突襲軍隊武器庫§!，在革命初期獲得裝備，同時給予對方輕微懲罰。"
 JAP_mountain_village_operation_units: "山村作戰小組"
 JAP_mountain_village_operation_units_desc: "野坂參三已批准在農村與偏遠村莊建立地下準軍事部隊和秘密小組，目標是對政府展開游擊戰，併為全國性共產革命做準備。為此，全國開始秘密發放小冊子《如何培育花球根》。"
 JAP_mountain_village_operation_units_tt: "解鎖決議：可在各地區§Y建立游擊隊§!，待時機成熟時發動起義。"
 JAP_return_of_the_manchukuo_exiles: "滿洲國流亡者歸來"
 JAP_return_of_the_manchukuo_exiles_desc: "許多社會主義理論家和經濟學家曾在關東軍征服滿洲後前往各類工團合作社和工業工作，試圖在那裡傳播革命思想，但時間不長便被鎮壓。我們應促請臨時首相協助這些人返回，以交換部分將領流亡。"
 JAP_return_of_the_manchukuo_exiles_tt: "僅擁有§Y$JAP_state_infiltrated_by_the_jcp$§!的地區會在§Y內戰§!開始時加入我方"
 JAP_return_of_the_manchukuo_exiles_2_tt: "§G5§!名§Y貴族出身且忠於帝國陸軍的將軍§!將被派往§Y滿洲§!，以換取§Y社會主義工業家§!"
 JAP_organize_the_fifth_column: "組織第五縱隊"
 JAP_organize_the_fifth_column_desc: "在我們的四支縱隊逼近大阪和東京時，第五支縱隊將在城內起義，從內部瓦解敵人的防禦。我們將在所有進軍的城市中組織這些“第五縱隊”，為我們在全國解放戰爭中獲得決定性優勢。"
 JAP_organize_the_fifth_column_tt: "解鎖在內戰期間動員游擊隊§Y打擊敵方部隊§!的決議"
 JAP_organize_the_fifth_column_2_tt: "獲得5個由§Y5個民兵營§!組成的師。\n"
 JAP_revoke_the_peace_preservation_law: "廢除《治安維持法》"
 JAP_revoke_the_peace_preservation_law_desc: "萬惡的《治安維持法》促成特高課的成立。自岡田首次公開反對他們以來，特高課一直以軍方的名義肆虐破壞。該法條阻礙了民主進程，將多項民主原則和組織定為非法。是時候投票廢除這則萬惡之源了。"
 JAP_revoke_the_peace_preservation_law_requirements_tt: "§Y共產主義§!與§Y民主派§!支持度之和超過50%"
 JAP_revoke_the_peace_preservation_law_tt: "§R我們的許多殖民地可能會將此視為脫離帝國的良機§!"
 JAP_a_red_sun_rises_for_a_new_era: "紅日照耀新時代"
 JAP_a_red_sun_rises_for_a_new_era_desc: "革命取得勝利，今日我們大獲全勝！隨著最後的反革命殘餘被消滅，我們必須立即開始以社會主義方式重組國家。然而黨內對於具體方向存在重大分歧，因此必須召開一次大辯論，決定國家未來的路線。"
 JAP_the_lecture_group_ascendant: "講座派崛起"
 JAP_the_lecture_group_ascendant_desc: "更具威權色彩且以無產階級為中心的講座派於辯論中勝出，其領導人野坂參三與德田球一將承擔起建設新國家的重任。但問題仍然存在——誰應擔任主席，誰應擔任總理？"
 JAP_the_labor_farmer_faction_ascendant: "勞農派崛起"
 JAP_the_labor_farmer_faction_ascendant_desc: "辯論中，更加理想化、以農民為核心的勞農派奇蹟般擊敗講座派，贏得勝利。但主要問題依然是——誰將成為共和國的下一任總理？"
 JAP_the_labor_farmer_faction_ascendant_tt: "所有修正將轉移至§Y$JAP_rounouha_modifier$§!"
 JAP_sea_fate_of_the_imperial_family: "皇室命運"
 JAP_sea_fate_of_the_imperial_family_desc: "如今是徹底消滅日本世襲統治殘餘的時候了。處理方式有多種，但須謹慎行事，因為皇室在民間仍極具聲望。我們必須決定前天皇及其家族的最終命運。"
 JAP_hold_a_peoples_tribunal: "舉行人民法庭"
 JAP_hold_a_peoples_tribunal_desc: "許多人曾在舊政府名義下犯下嚴重罪行，並反對、破壞革命與信奉革命的人。我們必須公開審判這些人，並立刻清除一切反革命勢力！"
 JAP_hold_a_peoples_tribunal_tt: "部分§Y軍事顧問§!因與舊政府合作而被審判，並退出現役部隊："
 JAP_social_and_cultural_revolution: "社會與文化革命"
 JAP_social_and_cultural_revolution_desc: "我們現在必須著手消滅封建主義、民族主義與保守傳統的所有殘餘，並在全國推廣共產主義思想。必須將武士道從教育中剔除，鼓勵國民穿著洋服，丟棄任何傳統服飾，轉而採用西式服裝，使我們國家與其他革命社會接軌。"
 JAP_social_and_cultural_revolution_tt: "民族精神§Y$JAP_reorganization_of_society_idea$§!被移除後：\n"
 JAP_overhaul_the_education_system: "教育體制大規模改革"
 JAP_overhaul_the_education_system_desc: "教育體系仍充斥舊有思想與方式，宣揚民族主義與愛國主義。我們必須迅速糾正這一點，徹底改革教育，使青年學會成為未來的革命領袖。"
 JAP_sea_nationalize_the_zaibatsus: "財閥國有化"
 JAP_sea_nationalize_the_zaibatsus_desc: "財閥在我國政治經濟領域長期予取予求的局面，今日必將終結。從此以後，國家權威不可動搖，任何挑戰均不可容忍。必須實行國有化，發揮資本力量，造福全民。"
 JAP_can_no_longer_manually_promote_zaibatsus_tt: "我們將不再能§R手動支持§!§Y財閥派系§!"
 JAP_a_functionalist_housing_policy: "實用主義住房政策"
 JAP_a_functionalist_housing_policy_desc: "我們的理論家提出一項新計劃，建設大型公寓或特定風格的住宅群作為公共住房，由政府管理。以功能為導向的建設能讓更多人以更低成本獲得住房。"
 JAP_redistribute_land_and_wealth: "土地與財富再分配"
 JAP_redistribute_land_and_wealth_desc: "全國許多土地仍歸屬於舊時代的大名家族。這些土地必須重新分配給農民，並由國家徵收用於建設新城鎮與工業。"
 JAP_ganbarou: "加油幹！"
 JAP_ganbarou_desc: "[ROOT.GetAdjective]男性與女性都是勤勞的勞動者，他們願竭盡全力為國家奉獻。我們應以此為宣傳核心，將勤勞與努力塑造為[ROOT.GetAdjective]社會的核心價值之一。"
 JAP_cooperate_with_anarchists: "與無政府主義者合作"
 JAP_cooperate_with_anarchists_desc: "無政府主義者曾被日本共產黨其他派別拋棄，只能獨自對抗專制國家。我們應將他們納入統一戰線，並確保他們的一些理念也能在未來實現。"
 JAP_the_ie_system_and_socialism: "家制度與社會主義"
 JAP_the_ie_system_and_socialism_desc: "日本傳統的“家”制度長期影響著社會結構、商業慣例甚至公司組織。我們應確保其保留，但將國家置於其中的最高權威地位。"
 JAP_fukumotoism: "福本主義"
 JAP_fukumotoism_desc: "福本和夫強調先鋒隊政黨應通過理論鬥爭向工人階級注入馬克思主義意識，從而將運動發展為政治鬥爭。將其思想納入治國理念，將有助於我們更好地向人民傳播任何我們需要普及的思想。"
 JAP_fukumotoism_tt: "解鎖一個可執行§G6§!次的決議，每次獲得§Y民用工廠§!和§Y$MODIFIER_CONSUMER_GOODS_FACTOR$§!加成。"
 JAP_the_modern_ashigaru: "現代足輕"
 JAP_the_modern_ashigaru_desc: "在室町時代，“足輕”是諸侯用以補充武士的農民步兵，沒有忠誠度可言。為了補充我們的職業軍隊，我們應恢復類似制度，要求農民在戰爭時保衛國家。"
 JAP_the_modern_ashigaru_tt: "解鎖決議在戰時§Y集結民兵§!"
 JAP_learn_from_the_nkvd: "向內務人民委員部學習"
 JAP_learn_from_the_nkvd_desc: "蘇聯秘密警察在鎮壓異議與反革命方面堪稱登峰造極。雖然我們不願與他們合作，但或許可以借鑑其做法。"
 JAP_further_urban_investments: "進一步城市投資"
 JAP_further_urban_investments_desc: "我們的城市亟需投資。若要確保城市中的工業擁有完成產量指標所需的效率與勞動力，我們必須介入並援助。"
 JAP_the_first_five_year_plan: "第一個五年計劃"
 JAP_the_first_five_year_plan_desc: "為確保人民的未來，我們必須為[ROOT.GetNameDef]建立一個能夠制定並實施大膽新經濟模式的委員會。這份新的五年計劃將使我們真正繁榮昌盛！"
 JAP_form_pioneer_organizations: "建立先鋒組織"
 JAP_form_pioneer_organizations_desc: "黨必須建立青年組織，讓他們參與活動，成長為合格的共產主義者，將來甚至能夠保衛國家。"
 JAP_war_communism: "戰時共產主義"
 JAP_war_communism_desc: "我們應採納蘇俄在1918–1921年俄國內戰期間實行的經濟與政治模式——戰時共產主義。這將使我們在必要時控制局勢，並通過武力將革命推廣至亞洲各地。"
 JAP_war_communism_new_economy_law: "解鎖新經濟法案：§Y$JAP_war_communism_idea$§!"
 JAP_the_uno_school_of_economics: "宇野經濟學派"
 JAP_the_uno_school_of_economics_desc: "經濟與政治理論家宇野弘藏提出了將資本主義模式轉化為真正社會主義所需經濟發展的理論，是時候將其付諸現實了。"
 JAP_the_uno_school_of_economics_tt: "開始一項任務，每年將$MODIFIER_CONSUMER_GOODS_FACTOR$降低§Y-2.5%§!"
 JAP_incorporate_buddhist_socialism: "融合佛教社會主義"
 JAP_incorporate_buddhist_socialism_desc: "井上秀天與妹尾義郎提出了基於佛教原則實施社會主義的理論，認為兩者相通，因為二者都致力於轉化個人意識，以終結人類的異化與自私。我們應當邀請這些思想家加入我們的運動。"
 JAP_the_spirit_of_the_ikko_ikki: "復興一向一揆精神"
 JAP_the_spirit_of_the_ikko_ikki_desc: "我們歷史上的淨土真宗武裝佛教徒曾向世界證明，僧侶在戰鬥中同樣令人畏懼。他們的信仰具有優勢，寺廟在各地分佈，在召集軍隊時更高效、更有效。我們應當忠實地重振這些佛教武士的精神，在進軍淨土的道路上再現昔日輝煌！"
 JAP_achieving_joubukkokudo: "宣告“淨佛國土”"
 JAP_achieving_joubukkokudo_desc: "隨著東亞大乘佛教國家各個都城的統一，我們追求建立一個“淨佛國土”的事業即將完成。在這一理想中，依靠全新的佛教社會主義理念，我們的精神解放以及社會與經濟的解放都將最終實現。讚美妹尾義郎，淨佛國土萬歲！"
 JAP_uplift_ainu_revolution_theory: "振興阿伊努革命理論"
 JAP_uplift_ainu_revolution_theory_desc: "許多政治思想家認為流氓無產階級是我國革命的主體，而阿伊努人也屬於其中。他們還認為阿伊努人長期生活在原始共產主義制度中，因此足以成為“共產主義革命的領導者”。我們應更加廣泛地支持這一運動。"
 JAP_kikues_new_model: "菊榮的新模式"
 JAP_kikues_new_model_desc: "山川菊榮長期倡導提升日本女性在社會中的平等地位，保障同工同酬與就業權利，同時廢除父權家庭制度。現在是將這些理想付諸實踐的時候了！"
 JAP_women_in_industry: "工業中的女性"
 JAP_women_in_industry_desc: "長期以來，女性被期望留在家中照顧家庭。如果女性能夠擔任國家領導人，那麼她們理應能在其他行業工作。這將大大擴大勞動力，推動[ROOT.GetNameDef]的經濟發展。"
 JAP_form_national_cooperatives: "建立國家合作社"
 JAP_form_national_cooperatives_desc: "許多思想家主張建立更多國民合作社——由個人或企業基於共同經濟、社會或文化需求組成的組織，實行成員所有、民主管理與互利原則。我們應鼓勵其發展。"
 JAP_further_rural_investments: "加強農村投資"
 JAP_further_rural_investments_desc: "農村地區長期被中央政府忽視，東京等城市的快速工業化吸引了人口外流，使許多鄉鎮陷入困境。我們必須投資這些地區，確保所需勞動力不再流失。"
 JAP_further_rural_investments_tt: "解鎖決議：若上述地區擁有§Y4§!級及以上§Y基礎設施§!，可§G提升§!其§Y地區類別§!"
 JAP_adopt_syndicalist_ideas: "接納工團主義思想"
 JAP_adopt_syndicalist_ideas_desc: "我們應採納在工業中建立工團合作社的理念，並利用其僱傭關係理論來改進當前工業模式。"
 JAP_raise_the_red_flag_high: "高舉紅旗"
 JAP_raise_the_red_flag_high_desc: "紅旗是革命的象徵，昭示著我們推進革命的決心，並寄託著最終解放全亞洲工人免於資產階級壓迫的希望。現在是高舉紅旗、宣告革命將永遠前進的時候了！"
 JAP_guide_the_lesser_states: "引導弱小國家"
 JAP_guide_the_lesser_states_desc: "欠發達的亞洲國家尚無條件自行發動革命併成功建立工人共和國。我們必須引導他們，教會他們如何正確治理國家。"
 JAP_pan_asian_revolutuonary_front: "泛亞革命陣線"
 JAP_socialism_in_one_state: "一國建成社會主義"
 JAP_socialism_in_one_state_desc: "唯一能教育和提升亞洲人民的國家是我們，我們已經證明了革命的可行性。我們必須讓他們加入我們的行列，向他們展示如何主導自己的生活，必要時使用武力也在所不惜。"
 JAP_the_courage_to_defend_the_revolution: "保衛革命的勇氣"
 JAP_the_courage_to_defend_the_revolution_desc: "全體國民必須展現捍衛革命的勇氣與決心。是時候用我們的一切保衛理想了！"
 JAP_demand_submission_from_breawakay_states: "要求分裂勢力投降"
 JAP_demand_submission_from_breawakay_states_desc: "那些非法脫離我們政權的地區只是誤判了形勢，他們沒意識到人民革命終將成功。我們應向其提出嚴正要求，讓他們服從黨，免於資本主義壓迫。"
 JAP_ignite_the_korean_peninsula: "點燃朝鮮半島革命之火"
 JAP_ignite_the_korean_peninsula_desc: "[KOR.GetAdjective]人民尚未被解放。我們應該聯繫[KOR.GetAdjective]南方的革命者，讓他們開始革命。這將為我們提供機會介入並保護[KOR.GetAdjective]人民免受隨之而來的內戰傷害。"
 JAP_ignite_the_korean_peninsula_tt: "在[KOR.GetNameDef]發動內戰，共產主義一方將成為我們的傀儡國"
 JAP_protect_the_manchurians: "保護滿洲人"
 JAP_protect_the_manchurians_desc: "滿洲人民仍處於舊關東軍殘餘的壓迫之下。我們必須清理自己造成的爛攤子，解放那裡的人民。是時候結束這場戰鬥，與帝國軍隊算一算賬了！"
 JAP_guide_the_chinese: "指引中國人"
 JAP_guide_the_chinese_desc: "中國的革命尚未成功。我們必須介入，親自引導中國人民走向繁榮，將他們從封建落後的生活中解放出來。"
 JAP_guide_the_chinese_tt: "我們會獲得針對所有§Y非共產主義中華§!國家的§Y傀儡§!戰爭目標。當前目標："
 JAP_guide_the_chinese_2_tt: "所有§Y共產主義中華§!國家受邀加入我們的陣營。當前目標："
 JAP_guide_the_mongols: "指引蒙古人"
 JAP_guide_the_mongols_desc: "革命在蒙古部分地區取得了成功，但現在他們卻處於蘇聯的壓迫下。我們必須介入，親自引導蒙古人民走向繁榮，將它們從封建、落後和專制的生活中解放出來。"
 JAP_spread_the_revolutuon_south: "將革命傳播至南方"
 JAP_spread_the_revolutuon_south_desc: "亞洲人民若想得到解放，革命之火必須迅速向南蔓延。是時候動手為所有亞洲人贏得更光明的未來了！"
 JAP_free_asians_from_soviet_opression: "解放被蘇聯佔領的亞洲人民"
 JAP_free_asians_from_soviet_opression_desc: "俄羅斯布爾什維克並不比那些試圖控制人民並奪取他們未來的資本家好多少。我們不能坐視他們繼續壓迫亞洲人。是時候採取行動了！"
 JAP_go_after_the_capitalists: "清算資本家"
 JAP_go_after_the_capitalists_desc: "西方私奔家偷竊亞洲人民的勞動成功卻未曾給予任何回報。我們在他們對人民的剝削無法挽回前必須打倒他們。"
 JAP_a_free_asia_pacific: "建立自由的亞太地區"
 JAP_a_free_asia_pacific_desc: "這一天終於到來了，整個亞洲的人們將能夠自由地生活，不會再被那些無視他們福祉的外國人和政府剝削。[ROOT.GetNameDef]萬歲，亞洲工人萬歲！"
 JAP_the_pan_asian_revolutionary_front: "泛亞革命陣線"
 JAP_the_pan_asian_revolutionary_front_desc: "為了指導亞洲各革命政黨，我們必須組織一個聯盟和超國家組織，為欠發達國家提供指導，並協調投資，以更快地改善其社會。"
 JAP_educate_the_peasants: "教育農民"
 JAP_educate_the_peasants_desc: "農民的教育在整個大陸上被忽視得太久了。現在是時候在聯盟成員之間展開協調行動，提升勞動群體的知識水平。"
 JAP_educate_the_peasants_tt: "§Y$JAP_educating_the_peasants_modifier$§!的研究速度加成會隨著每新增一個陣營成員增加§G1%§!，最多增加§G10%§!"
 JAP_a_common_currency_for_all_of_asia: "推行亞洲統一貨幣"
 JAP_a_common_currency_for_all_of_asia_desc: "作為國際協調的一部分，我們應努力讓所有革命國家採用日元作為官方貨幣，以便正式建立關稅同盟和貿易聯盟。"
 JAP_the_minitry_of_pan_asian_development: "泛亞開發省"
 JAP_the_minitry_of_pan_asian_development_desc: "為了更好地改善亞洲各國的生活條件，我們應建立一箇中央部委，負責監督發展投資，並協助組織工業與經濟項目。"
 JAP_development_for_the_undeveloped: "欠發達國家開發計劃"
 JAP_development_for_the_undeveloped_desc: "為了實現真正的革命，我們必須開發欠發達國家，改善聯盟中的較弱成員的基礎設施與工業產能。"
 JAP_a_pan_asian_diet: "泛亞議會"
 JAP_a_pan_asian_diet_desc: "為了讓亞洲的革命國家更加團結，我們應成立一個包括所有成員國代表的政府機構，讓他們投票決定在我們的兄弟共和國中推行哪些法律與制度。"
 JAP_extensive_navy_maneuvers: "啟動大規模海軍演習"
 JAP_extensive_navy_maneuvers_desc: "為了打敗在內戰中出現的分裂政權，我們必須確保海軍能夠迎戰，因此應組織大規模演習來確保作戰準備。"
 JAP_extensive_army_maneuvers: "啟動大規模陸軍演習"
 JAP_extensive_army_maneuvers_desc: "為了打敗在我國崩潰後佔領滿洲的關東軍，我們必須確保陸軍能夠迎戰，因此應組織大規模演習來確保作戰準備。"
 JAP_reclaim_lost_territories: "收復失地"
 JAP_reclaim_lost_territories_desc: "現在是時候重返那些脫離我們勢力範圍的地區，將它們重新納入共和國。只有通過軍事幹預，我們才能確保這些地區的人民得以繁榮。"
 JAP_conquer_the_army_remnants: "消滅陸軍殘餘"
 JAP_conquer_the_army_remnants_desc: "是時候結束我們早已開始的戰鬥，徹底摧毀帝國陸軍的最後殘餘與我們的內戰宿敵——關東軍，並重新奪回滿洲！"
 JAP_put_an_end_to_chinese_feudalism: "終結中國封建主義"
 JAP_put_an_end_to_chinese_feudalism_desc: "封建傳統在中國仍佔據著主導地位，由數以百萬計的人民必須得到解放並加入我們的革命共和國。我們將頒佈法令，徹底解放中國人民！"
 JAP_mobilize_the_proletariat: "動員無產階級"
 JAP_mobilize_the_proletariat_desc: "工人們正努力為我們的軍隊製造武器，但絕望的時刻需要採取絕望的措施。現在是時候提高生產配額了，即使只是暫時的，這樣我們就能為軍隊提供他們需要的所有武器。"
 JAP_the_long_march_to_victory: "通往勝利的長征"
 JAP_the_long_march_to_victory_desc: "為了擊垮中國的各個割據政權，我們必須長驅直入亞洲大陸。我們應發動宣傳並重點宣揚長距離行軍，以提高士兵長途行軍的意志！"
 JAP_the_pacific_union_of_soviet_socialist_republics: "太平洋蘇維埃社會主義共和國聯盟"
 JAP_the_pacific_union_of_soviet_socialist_republics_desc: "我們一直努力為之奮鬥的時刻終於到來了。是宣佈成立一個新的亞洲國家，建立另一個蘇維埃聯盟了。"
 JAP_the_pacific_union_of_soviet_socialist_republics_tt: "我們將被稱為§Y太平洋蘇維埃社會主義共和國聯盟§!。"
 JAP_the_indochinese_soviet: "印度支那蘇維埃"
 JAP_the_indochinese_soviet_desc: "既然聯盟已經成立，我們必須建立新的蘇維埃共和國並將其納入聯盟。我們應建立“印度支那蘇維埃”，以此為我們佔領該地區提供正當理由。"
 JAP_transformation_of_nature: "自然的改造"
 JAP_transformation_of_nature_desc: "亞洲富含尚未開發的自然資源。在科學界不斷突破認知極限的推動下，即使是最大、最具侵入性的工程項目也變得可行。必須在大規模上改造自然環境，使其為人民服務！"
 JAP_the_south_pacific_soviet: "南太平洋蘇維埃"
 JAP_the_south_pacific_soviet_desc: "既然聯盟已經成立，我們必須建立新的蘇維埃共和國並將其納入聯盟。我們應建立“南太平洋蘇維埃”，以此為我們佔領該地區提供正當理由。"
 JAP_the_oceanian_soviet: "大洋洲蘇維埃"
 JAP_the_oceanian_soviet_desc: "在建立南太平洋蘇維埃後，我們應繼續向更南方推進。為此，我們應建立“大洋洲蘇維埃”，以此為我們佔領該地區提供正當理由。"
 JAP_strike_down_the_great_pretender: "打擊大篡權者"
 JAP_strike_down_the_great_pretender_desc: "蘇聯的布爾什維克假裝站在人民一邊，卻在亞洲部分地區實行暴政。我們應推翻這個偽裝成革命力量的資產階級獨裁政權，並宣告自己是革命的唯一捍衛者！"
 JAP_a_red_dawn_over_asia: "亞洲的紅色黎明"
 JAP_a_red_dawn_over_asia_desc: "隨著我軍取勝，而且我們擁有橫跨太平洋的廣闊疆域，革命比以往任何時候都更接近勝利。紅日照耀長空，新紀元正在亞洲破曉！"
 JAP_to_rival_the_comintern: "與共產國際爭鋒"
 JAP_to_rival_the_comintern_desc: "自從託派建立“第四國際”以來，許多人呼籲建立“第五共產國際”，以抗衡它與共產國際。我們應肩負起這一使命，宣告自己是真正的革命捍衛者！"
 JAP_alternative_communist_international: "第五共產國際"
 JAP_wrestle_mongolia_from_the_soviets: "將蒙古人從蘇聯勢力中奪回"
 JAP_wrestle_mongolia_from_the_soviets_desc: "多年來，蒙古人處於俄國人的控制下，並一直渴望遠離歐洲人。我們可以為他們提供機會，邀請他們加入我們的國際。但這可能會激化與[SOV.GetNameDef]的關係。"
 JAP_wrestle_tuva_from_the_soviets: "將圖瓦人從蘇聯勢力中奪回"
 JAP_wrestle_tuva_from_the_soviets_desc: "多年來，圖瓦人處於俄國人的控制下，並一直渴望遠離歐洲人。我們可以為他們提供機會，邀請他們加入我們的國際。但這可能會激化與[SOV.GetNameDef]的關係。"
 JAP_spread_revolutionary_flames_to_south_asia: "將革命烈火燃向南亞"
 JAP_spread_revolutionary_flames_to_south_asia_desc: "革命之火燎原，我們成功的行動鼓舞了各地的無產階級。我們應該開始在南亞資助革命團體，以動搖當地的穩定，將它們納入第五國際。"
 JAP_spread_revolutionary_flames_to_south_asia_tt: "解鎖決議邀請§Y共產主義南亞§!國家加入我們的陣營"
 JAP_spread_revolutionary_flames_to_south_asia_2_tt: "解鎖決議在§Y南亞§!國家§Y挑動共產主義情緒§!"
 JAP_spread_revolutionary_flames_to_west_asia: "將革命烈火燃向西亞"
 JAP_spread_revolutionary_flames_to_west_asia_desc: "革命之火燎原，我們成功的行動鼓舞了各地的無產階級。我們應該開始在西亞資助革命團體，以動搖當地的穩定，將它們納入第五國際。"
 JAP_spread_revolutionary_flames_to_west_asia_tt: "解鎖決議邀請§Y共產主義中東§!國家加入我們的陣營"
 JAP_spread_revolutionary_flames_to_west_asia_2_tt: "解鎖決議在§Y中東§!國家§Y挑動共產主義情緒§!"
 JAP_trans_pacific_influence: "跨太平洋影響力"
 JAP_trans_pacific_influence_desc: "革命之火燎原，我們成功的行動鼓舞了各地的無產階級。我們應該開始在大洋的另一端資助革命團體，以動搖當地的穩定，將它們納入第五國際。"
 JAP_trans_pacific_influence_tt: "解鎖決議邀請§Y共產主義南美§!國家加入我們的陣營"
 JAP_build_an_anti_army_coalition: "建立反陸軍聯盟"
 JAP_build_an_anti_army_coalition_desc: "為對抗軍方日益坐大的影響力，我們不能繼續黨派內鬥。我們必須尋求組建聯盟，共同推動日本走向光明未來。"
 JAP_ensure_cross_party_support: "確保跨黨派合作"
 JAP_ensure_cross_party_support_desc: "既然聯盟已成形，我們應努力爭取其他政黨支持，以免在逆境中崩潰。團結起來，我們將共振大正民主精神！"
 JAP_gather_royal_pacifists_support: "爭取皇室中的和平主義者的支持"
 JAP_gather_royal_pacifists_support_desc: "皇室中有許多人反對軍方凌駕於政治之上以及總體戰的理念。我們應該爭取九條節子、宣仁親王和木戶幸一的支持，協助我們將軍方勢力逐出政府。"
 JAP_gather_royal_pacifists_support_tt: "若§Y裕仁天皇§!在§Y內戰§!中站在軍方一邊，我們仍可獲得其弟§Y宣仁親王§!及其母親§Y九條貞子§!的§Y皇室支持§!"
 JAP_limit_military_power: "推進限制軍隊權力的法案"
 JAP_limit_military_power_desc: "為防止再次發生政變，我們應儘可能在不激起叛亂的前提下，將更多軍方人員調離要職。如此一來，或許能阻止他們扼殺民主自由的火炬。"
 JAP_limit_military_power_tt: "§Y內戰§!爆發時，敵方將獲得持續§Y365§!天的以下國家精神："
 JAP_divert_military_funds: "轉移軍費預算"
 JAP_divert_military_funds_desc: "隨著叛亂似乎迫近，如果我們想將軍方削弱到無力致勝的程度，必須將他們的資金引向其他渠道。如此，他們將長期陷入財政赤字。"
 JAP_divert_military_funds_tt: "所有未處於§Y軍隊控制§!的地區會在§Y內戰§!開始時加入我們"
 JAP_sway_the_navy_moderates: "爭取海軍溫和派"
 JAP_sway_the_navy_moderates_desc: "海軍中有許多高層人士比陸軍那些人理智得多。如果我們嘗試聯繫條約派的前成員，或許能獲得他們的支持，甚至在內戰時獲得援助。"
 JAP_sway_the_navy_moderates_tt: "§Y內戰§!時我們將保有更大比例的§Y帝國海軍§!及其部隊"
 JAP_sway_the_navy_moderates_2_tt: "§G4§!名§Y海軍將官§!將效忠我方"
 JAP_bribe_generals: "賄賂將領"
 JAP_bribe_generals_desc: "雖然激進，但並非所有軍官都甘願站在邪惡一方。他們因職責與榮譽加入軍隊，或可被說服支持正義事業，只是需要時間與努力。"
 JAP_bribe_generals_tt: "§G4§!名§Y將軍§!將效忠我方"
 JAP_appoint_new_generals: "任命新將領"
 JAP_appoint_new_generals_desc: "如今許多將領已決定與我們作對，我們正面臨缺乏能勝任的軍官來統領部隊的困境。我們必須全力招募新一代陸軍指揮官以彌補這一不足。"
 JAP_implement_army_reforms: "實施陸軍改革"
 JAP_implement_army_reforms_desc: "隨著舊軍官被撤換，我們也該摒棄他們過時的戰爭理念了。陸軍將逐步重組為自衛隊，“先發制人原則”也將成為過去。"
 JAP_implement_army_reforms_tt: "§R移除§!§Y帝國防衛計劃§!國策提供的獲得§Y先發制人原則§!及§Y艦隊決戰§!修正的能力"
 JAP_a_new_take_on_state_shintoism: "推廣世俗神社論"
 JAP_a_new_take_on_state_shintoism_desc: "明治時代興起的宗教政策與政治理論，即“神社非宗教論”，主張神社本質上是世俗的而非宗教的，神道僅為日本國家傳統的世俗表現。我們應繼續推廣此理論，利用好這場運動。"
 JAP_crush_the_spirit_of_gekokujo: "粉碎“下克上”的精神"
 JAP_crush_the_spirit_of_gekokujo_desc: "昭和初期，“下克上”事件屢屢發生，軍中低級軍官試圖罷免上級，這威脅到我們的指揮體系。必須儘快鎮壓此類思想！"
 JAP_organize_a_general_election: "組織大選"
 JAP_organize_a_general_election_desc: "內亂終結，現在是時候著手重建並回歸我們的民主傳統了。自明治以來，我們首次舉行無軍方和腐敗干預的選舉，讓人民決定自己的未來！"
 JAP_draft_the_showa_constitution: "[JAP_draft_the_showa_constitution_key]"
 JAP_draft_the_showa_constitution_desc: "[JAP_draft_the_showa_constitution_desc_key]"
 JAP_draft_the_showa_constitution_key_emperor_eian: "起草永安憲法" # Eian (永安)
 JAP_draft_the_showa_constitution_key_emperor_showa: "起草昭和憲法"
 JAP_draft_the_showa_constitution_desc_key_emperor_eian: "我們認可並尊重我國皇室的歷史地位，然而，威權主義在我們致力於建設的新日本中沒有立足之地。因此，我們將保留新天皇作為象徵性領袖，但其權力將如同許多西方立憲君主國那樣，受到憲法的嚴格規制。"
 JAP_draft_the_showa_constitution_desc_key_emperor_showa: "我們認可並尊重我國皇室的歷史地位，然而，我們致力於建設的新日本絕不容許威權主義存在。因此，我們將維持天皇陛下作為名譽統治者的地位，但其權力將如同許多西方立憲君主國那樣，受到憲法的嚴格規制。"
 JAP_form_the_ldp: "組建自由民主黨"
 JAP_form_the_ldp_desc: "立憲政友會已掌控議會與內閣，現在該將其改革為更高效的執政機構。遵照鳩山一郎指示，是時候成立自由民主黨，旨在領導國家的未來。"
 JAP_rikken_minseito_victory: "立憲民政黨勝選"
 JAP_rikken_minseito_victory_desc: "選舉結果已定，人民已選定國家未來之路。自由進步派的立憲民政黨以壓倒性優勢獲勝，並將在未來佔據絕對多數地位。"
 JAP_rikken_minseito_victory_flag: "立憲民政黨已贏得大選"
 JAP_rikken_seiyukai_victory: "立憲政友會勝選"
 JAP_rikken_seiyukai_victory_desc: "選舉結果已定，人民已選定國家未來之路。自由保守派的立憲政友會以壓倒性優勢獲勝，並將在未來佔據絕對多數地位。"
 JAP_rikken_seiyukai_victory_flag: "立憲政友會已贏得大選"
 JAP_minshu_shugi: "民主主義"
 JAP_minshu_shugi_desc: "雖然我們迄今奉行民本主義的學說，但真正的民主應屬於民主主義。畢竟“主權在民”乃法律原則，民本主義則更強調君主主權。我們必須將這些新理念寫入憲法！"
 JAP_minpon_shugi: "民本主義"
 JAP_minpon_shugi_desc: "大正時代誕生的民本主義理念可定義為“在行使政治權力時重視人民利益、幸福與意見的政策”。此理念既不違背天皇制度，且同時有利於人民與天皇。我們應繼續以君主主權為基礎推行民主制度，並將其寫入新憲法！"
 JAP_promote_meritocracy: "推動賢能政治"
 JAP_promote_meritocracy_desc: "若不提拔有才能者擔任適當職位，國家將難以高效運作。電子行業應由精通電子技術的人來領導，而非與內閣有關係的政客。是時候根除“官員空降”傳統，為國家的利益推行任人唯賢的制度了！"
 JAP_experimental_housing_solutions: "實驗性住房方案"
 JAP_experimental_housing_solutions_desc: "城市發展應圍繞四大功能展開：居住、工作、交通與娛樂。丹下健三及其他新興建築師提出一種新型城市建設理念，他們稱之為“新陳代謝”運動的一部分。我們應推廣此理念以改善全民居住環境。"
 JAP_embrace_amakudari: "鼓勵官員空降"
 JAP_embrace_amakudari_desc: "“天下り”，字面意義為“從天而降”，指退休高級官員進入私企擔任高管，通常是在其曾監管的行業。雖這會嚴重降低我國產業效率，卻使我們對社會擁有深入的洞察與控制力。"
 JAP_agricultural_protectionism: "農業保護"
 JAP_agricultural_protectionism_desc: "我國傳統的生產方式在世界經濟發展中越來越居於不利地位。如果不採取措施保護農民，危機就會接連不斷地到來，因為我們的農民在面對海外食品的大量湧入時毫無競爭力可言。"
 JAP_machida_chuuji_focus: "町田忠治內閣"
 JAP_machida_chuuji_focus_desc: "應鼓勵執政黨立憲民政黨領袖町田忠治組建新內閣，以推動新憲法的制定。屆時我們將不再有臨時首相，亂局前秩序終將恢復。"
 JAP_abe_isoo_focus: "安部磯雄內閣"
 JAP_abe_isoo_focus_desc: "應鼓勵社會大眾黨領袖、被譽為日本棒球之父的安部磯雄組建新內閣，以推動新憲法的制定。屆時我們將不再有臨時首相，亂局前秩序終將恢復。"
 JAP_uplift_labor_unions: "推動工會發展"
 JAP_uplift_labor_unions_desc: "工會幫助人民自治，協助修復內戰前後遭軍方破壞的產業。我們應進一步支持這些組織，直至有朝一日建立起日本的福利社會。"
 JAP_tokugawa_iesato_focus: "德川家達內閣"
 JAP_tokugawa_iesato_focus_desc: "應鼓勵極受歡迎的貴族院議長、德川幕府繼承人德川家達組建新內閣，以推動新憲法的制定。屆時我們將不再有臨時首相，亂局前秩序終將恢復。"
 JAP_ichiro_hatoyama_focus: "鳩山一郎內閣"
 JAP_ichiro_hatoyama_focus_desc: "應鼓勵執政黨立憲政友會領袖鳩山一郎組建新內閣，以推動新憲法的制定。屆時我們將不再有臨時首相，亂局前秩序終將恢復。"
 JAP_mitsumasa_yonai_focus: "米內光政內閣"
 JAP_mitsumasa_yonai_focus_desc: "應鼓勵溫和派海軍大將、親西方條約派重要成員米內光政組建新內閣，以推動新憲法的制定。屆時我們將不再有臨時首相，亂局前秩序終將恢復。"
 JAP_limit_the_emperors_power: "限制天皇權力"
 JAP_limit_the_emperors_power_desc: "天皇仍是我們社會的重要象徵，但若任其所為，仍可能威脅我們的民主。必須努力限制憲政君主的權力，以確保民主價值不再喪失。"
 JAP_ensure_civil_liberties: "保障公民自由"
 JAP_ensure_civil_liberties_desc: "隨著國家重歸和平繁榮，現在該兌現承諾了。我們應確保在新日本，所有公民的自由能得到保障，並開始製作宣傳民主理念的新電影。"
 JAP_crush_the_internal_factions: "清除黨內派系"
 JAP_crush_the_internal_factions_desc: "國內派系為爭取天皇支持而相互傾軋，這已造成了嚴重的後果。如今政府再次全面掌控局勢，是時候該鞏固實權，讓內部派系明白不可輕視我們。"
 JAP_democratic_war_with_manchukuo: "追殲窮寇"
 JAP_democratic_war_with_manchukuo_desc: "關東軍自內戰後便與我們斷絕聯繫，同時控制了滿洲。當地人民仍受專制壓迫，亟待解救。是時候完成未竟的事業了。"
 MAN_kwantung_army_took_control_flag: "關東軍已控制滿洲"
 JAP_democratic_war_with_china: "保障上海租界安全"
 JAP_democratic_war_with_china_desc: "上海國際租界的人民正受腐敗的中國政權及其爪牙的威脅。為避免無謂的犧牲，我們必須前往解救！"
 JAP_closer_ties_with_the_usa: "與美國建立更緊密聯繫"
 JAP_closer_ties_with_the_usa_desc: "隨著民主制度在我國確立，外交官正努力修復軍方破壞的國際關係，首當其衝便是美國。我們應主動接觸，爭取獲得未來數年的友好。"
 JAP_ally_the_philippines: "與菲律賓結盟"
 JAP_ally_the_philippines_desc: "我們剛剛恢復了與其前宗主的聯繫，或許是時候向[PHI.GetAdjective]政府發出邀請加入我們的同盟。我們認為，這將使雙方都獲益良多。"
 JAP_strike_the_soviets: "襲擊宿敵"
 JAP_strike_the_soviets_desc: "我們是抵禦竊取北樺太的布爾什維克的堡壘。自西伯利亞遠征與日俄戰爭以來，人民迫不及待想與[SOV.GetNameDef]再次一戰，將他們徹底驅逐出西伯利亞東部，鞏固我們的勢力範圍。"
 JAP_free_colonized_asian_countries: "解放亞洲殖民地國家"
 JAP_free_colonized_asian_countries_desc: "亞洲有不少國家仍被西方列強佔領。作為亞洲新的守護者，我們應向西方提出不容拒絕的條件，爭取這些殖民地的控制權。"
 JAP_free_colonized_asian_countries_tt: "解鎖附屬於§Y非亞洲國家§!的§Y亞洲國家§!§Y要求宗主權§!的決議"
 JAP_fund_resistance_groups_in_asia: "為亞洲抵抗組織提供資金"
 JAP_fund_resistance_groups_in_asia_desc: "在我們的大陸上，許多人正在反抗外國的壓迫。只要我們伸出援手，他們必將欣然接受。我們應藉此削弱西方勢力，推動亞洲的自由與解放！"
 JAP_fund_resistance_groups_in_asia_tt: "解鎖在被佔領亞洲地區增加抵抗並獲得攻擊加成的§Y決議§!"
 JAP_sea_rekindle_the_old_alliance: "重構舊同盟"
 JAP_sea_rekindle_the_old_alliance_desc: "我們最大的勝算在於世界大戰時的舊日盟友。我們將重啟舊聯盟，與[ENG.GetNameDef]共同捍衛民主。"
 JAP_create_greater_east_asian_treaty_organization: "西太平洋條約組織"
 JAP_create_greater_east_asian_treaty_organization_desc: "與其他亞洲國家結盟，是我們抵禦威脅新生活方式勢力的途徑。我們應擁抱作為大陸守護者的命運，引領它邁向未來。"
 JAP_greater_east_asian_treaty_organization: "大東亞條約組織"
 JAP_create_greater_east_asian_treaty_organization_tt: "解鎖邀請§Y中立§!及§Y民主主義§!的§Y亞洲§!和§Y大洋洲§!國家加入我方陣營的決議"
 JAP_form_greater_east_asian_customs_union: "建立大東亞關稅同盟"
 JAP_form_greater_east_asian_customs_union_desc: "正如經濟學家長期規劃的那樣，我們應建立太平洋關稅同盟，逐步而穩步統一亞洲經濟，將其整合為最強大的經濟體。"
 JAP_form_greater_east_asian_currency_union: "建立大東亞貨幣聯盟"
 JAP_form_greater_east_asian_currency_union_desc: "我們應推動全亞洲使用統一的貨幣，舊政治理論稱之為“日元集團”。現在是時候朝此邁進一步，與我們所有新盟友組建一個貨幣聯盟。"
 JAP_form_greater_east_asian_currency_union_tt: "解鎖邀請我國盟友加入§Y貨幣聯盟§!的決議"
 JAP_an_integrated_union: "一體化聯盟"
 JAP_an_integrated_union_desc: "整合盟友與我方經濟，以及設立可監管並協助各國經濟的亞洲中央銀行，從長遠來看有利於我方。這些措施不僅增強我方實力，也加深盟友對我方依賴，最終使我方掌控其外交。"
 JAP_an_integrated_union_tt: "每個§Y陣營成員§!都將收到§Y事件：§![JAP.GetNameDefCap]希望進一步整合我們的經濟"
 JAP_an_integrated_union_2_tt: "解鎖決議，邀請盟友與我國§Y經濟進一步整合§!，允許我國隨後§Y嘗試通過外交手段征服對方§!"
 JAP_greater_east_asian_federation: "大東亞聯邦"
 JAP_greater_east_asian_federation_desc: "將亞洲人民統一於一國之日終於到來！我們要迅速整合各組成部分，成立大東亞聯邦，將民主觀念傳播至亞洲各角落。"
 JAP_allied_civilian_administration_integration_tt: "解鎖決議：§Y整合附屬國的民政管理§!，允許我們§Y吞併§!我們的§Y傀儡國§!"
 JAP_greater_east_asian_federation_tt: "我們將被稱為§Y大東亞聯邦§!"
 JAP_greater_east_asian_federation_2_tt: "解鎖決議，整合我國§Y控制§!的§Y亞洲§!地區"
 JAP_democratic_womens_suffrage: "婦女選舉權"
 JAP_democratic_womens_suffrage_desc: "市川房枝長期倡導賦予女性選舉權。鑑於政治局勢已經穩定，是時候賦予日本女性投票權，讓她們也能為國家繁榮貢獻力量了。"
 JAP_launch_the_income_doubling_plan: "啟動收入翻倍計劃"
 JAP_launch_the_income_doubling_plan_desc: "近期加入日本經濟安定本部的經濟學家下村治提出“收入倍增計劃”，宣稱該計劃將在經濟規劃中發揮核心作用，為高速經濟增長奠定基礎。我們應採納他的建議，密切關注計劃進展。"
 JAP_reform_the_education_system: "改革教育體系"
 JAP_reform_the_education_system_desc: "現行教育體系仍保有帝國制度的各種弊端，且未能有效覆蓋兒童，致使我們仍落後於西方國家。我們必須火速推進改革，避免現狀固化。"
 JAP_democratic_women_in_the_workforce: "女性工作"
 JAP_democratic_women_in_the_workforce_desc: "性別長期以來一直是一個決定個人應該在哪裡為國家服務的因素，無論是在前線、工廠還是在家中。通過追求更平等的負擔分擔，我們可以擴大勞動力，必要時也能擁有更強大的軍隊。"
 JAP_taiheyo_belt: "太平洋工業帶"
 JAP_taiheyo_belt_desc: "我們的經濟學家提出了一項新規劃，即建設被稱為“太平洋帶”的城市化區域，該區域從東京延伸至福岡，連接南部主要島嶼的經濟與工業區，形成大都市圈，促進人員流動與經濟發展。我們必須實現這一目標！"
 JAP_shinkansen: "新幹線項目"
 JAP_shinkansen_desc: "總工程師島秀雄提議建設名為“東海道新幹線”的高速列車線路，連接東京、名古屋和大阪，使貨物與人員可以在主要城市間快速流動。我們應投資該項目。"
 JAP_shinkansen_tt: "民族精神§Y$JAP_shinkansen_construction_idea$§!被移除後：\n"
 JAP_pursue_international_trade: "推動國際貿易"
 JAP_pursue_international_trade_desc: "自馬修·佩裡准將結束我國孤立以來，儘管我國一直嘗試與外國進行貿易活動，但貿易量遠遠不夠。我們應重點關注國際市場，確保能通過外交而非戰爭獲取所需資源。"
 JAP_seek_foreign_investments: "尋求外國投資"
 JAP_seek_foreign_investments_desc: "鑑於我國已進一步提高開放程度，我們應利用新建立的聯繫吸引外資，促進本國產業發展。"
 JAP_seek_foreign_investments_tt: "解鎖決議以§Y吸引外國投資§!，用§Y政治點數§!換取§Y民用工廠§!"
 JAP_invest_in_foreign_industries: "投資外國產業"
 JAP_invest_in_foreign_industries_desc: "我們應將獲取的海量資本投資外國，以經濟援助換取部分自然資源，在解決自身問題的同時幫助其他亞洲國家。"
 JAP_invest_in_foreign_industries_tt: "解鎖§Y決議§!，投資小型§Y亞洲§!國家工業以換取資源"
 JAP_democratic_foreign_exchange_allocation_policy: "外匯分配政策"
 JAP_democratic_foreign_exchange_allocation_policy_desc: "股市是一種強大的工具。我們應利用外國流入資本，確保我們的經濟學家和工業家能為方興未艾的我國盡其所能。"
 JAP_democratic_research_slot: "重組東京帝國大學"
 JAP_democratic_research_slot_desc: "東京帝國大學仍沿用舊教育體系。為助力國家未來培養新一代人才，我們必須投資並調整課程，減少國家的政治干預。"
 JAP_offshore_coal: "擴建近海煤炭設施"
 JAP_offshore_coal_desc: "長崎近海的池島與端島是開採海底煤礦的重要基地，我們應擴建礦區，建設更多住房，容納更大規模常駐勞動力。"
 JAP_democratic_nationalize_zaibatsus: "財閥國有化"
 JAP_democratic_nationalize_zaibatsus_desc: "財閥在我國政治經濟領域長期予取予求的局面必須終結。從此以後，國家權威將不可動搖，任何挑戰均不可容忍。我們必須實行國有化，將他們的資本為全民所用。"
 JAP_split_uo_zaibatsu_monopolies: "拆分壟斷地位的財閥"
 JAP_split_uo_zaibatsu_monopolies_desc: "我國各大財閥長期在帝國掌握著巨大的政治與經濟影響力，我們必須明確要求其服從政府意志，並將其拆分為更易於管理的較小企業集團。"
 JAP_democratic_work_with_the_zaibatsus: "與財閥合作"
 JAP_democratic_work_with_the_zaibatsus_desc: "我國各大財閥長期在帝國掌握著巨大的政治與經濟影響力，若運作得當，我們可與之合作，引導其為國家利益所用。"
 JAP_lifetime_employment: "終身僱傭制"
 JAP_lifetime_employment_desc: "終身僱傭制自1920年代經濟騰飛後被各大企業採用。我們應確保這一日本企業文化特色助力實現經濟奇蹟，實現超越西方經濟的目標。"
 JAP_modernize_agriculture: "農業現代化"
 JAP_modernize_agriculture_desc: "我國的農業與工業同等重要。若我們無法養活國民，產業便也無法運轉。我們應投資新農具研發，改善連接農村與城市的道路網絡。"
 JAP_civilian_nuclear_reactor_investments: "投資民用核反應堆"
 JAP_civilian_nuclear_reactor_investments_desc: "理研科學家指出，核能將成為未來的能源。我們必須投資這一新技術，這樣或許就再也不用燒煤炭了。"
 JAP_civilian_nuclear_reactor_investments_tt: "將§Y$JAP_early_industrialization_efforts_dm$§!替換為§Y$JAP_the_economic_mirale_dm$§!，效果變化："
 JAP_guardian_of_the_pacific: "太平洋守護者"
 JAP_guardian_of_the_pacific_desc: "我們將承擔起守護太平洋周邊亞洲國家的責任。這些國家需要引導，才能在脫離西方帝國主義之後建立成熟的民主制。實現這一目標的第一步，就是主動成為[ENG.GetNameDef]太平洋殖民地的守護者。"
 JAP_build_diet_building_landmark_tt: "\n將§Y$landmark_tokyo_imperial_palace$§!替換為§Y$landmark_national_diet$§!"
 JAP_build_hakko_ichiu_landmark_tt: "在[1018.GetName]創建§Y$landmark_hakko_ichiu$§!"
 JAP_the_koiso_cabinet: "小磯內閣"
 JAP_the_koiso_cabinet_desc: "隨著天皇逐漸喪失對[ROOT.GetLeader]和日本帝國軍隊能力的信任，他已表示希望國家統一併尋求結束戰爭的方法，以避免國家陷入萬劫不復的境地。儘管小磯國昭不是一名受政客和將軍歡迎的候選人，但他或許有能力使國家從衝突中脫身。"
 JAP_the_war_has_not_necessarily_developed_focus: "堅決反對東亞衝突"
 JAP_the_war_has_not_necessarily_developed_focus_desc: "陸海軍之間的對立仍困擾著我們，而通過重創敵人來結束戰爭的戰略也已失敗，我們似乎已無計可施。或許是時候忍辱含垢，回到一個沒有衝突的時代了。"
 JAP_the_war_has_not_necessarily_developed_focus_tt: "軍隊中的激進派將試圖發動政變，以阻止天皇放送我國投降的決定。"
 JAP_japans_longest_day: "日本最漫長的一天"
 JAP_japans_longest_day_desc: "無恥的首相及其黨羽已被處置，誤入歧途的皇帝也已被軟禁。現在是時候重振戰備，帶領我國迴歸命中註定的榮光。"
 JAP_the_surrender_broadcast: "玉音放送"
 JAP_the_surrender_broadcast_desc: "朕深鑑世界之大勢與帝國之現狀，欲以非常之措置收拾時局。戰局未必好轉，世界大勢亦不我利，是朕所以使帝國政府應於共同宣言也。"
 JAP_the_surrender_broadcast_tt: "如果我們和平投降，就更有可能保住日本列島的控制權"
