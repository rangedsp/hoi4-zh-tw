 PRC_initialize_five_year_plan_tt: "§R未能在既定期限內完成工業目標將導致經濟效率受到嚴重懲罰，作為對中央計劃能力失去信心的體現。§!\n\n§Y達成目標所需工廠總數：\n[GetFiveYearPlanGoalCivFactoriesText]座民用工廠\n[GetFiveYearPlanGoalMilFactoriesText]座軍用工廠§!"
 PRC_initialize_shorter_market_plans_tt: "§R未能在既定期限內完成工業目標將導致經濟效率受到嚴重懲罰，作為對中央計劃能力失去信心的體現。§!\n\n§Y達成目標所需工廠總數：\n[GetShorterMarketPlansGoalCivFactoriesText]座民用工廠\n[GetShorterMarketPlansGoalMilFactoriesText]座軍用工廠§!"
 PRC_naval_infrastructure_effort_tt: "當滿足條件時，此國策將給予§Y海軍基地§!、§Y海岸要塞§!和1座§Y海軍指揮部§!（若尚未建造）"
 PRC_dockyard_construction_efforts_tt: "當滿足條件時，此國策將給予§Y海軍船塢§!"
 PRC_urbanization_two_tt: "若控制§Y西安§!與§Y山西§!，它們將成為§Y城鎮地區§!，給予\n §G3§!個建築位\n §G1§!座§Y民用工廠§!\n 獲得§Y城市化進程§!，其效果為：\n本地建設速度：§G+10%§!"
 PRC_reinforce_base_area_tt: "在§Y[622.GetName]§!與§Y[1046.GetName]§!的邊境建造§G2§!級§Y陸上要塞§!。\n如果已在任意邊境衝突中取勝：\n在與對方接壤的邊境建造§G1§!級§Y陸上要塞§!"
 PRC_he_long_has_arrived: "賀龍已抵達陝西"
 PRC_pavel_mif_alive: "帕維爾·米夫仍在世"
 PRC_zhang_guatao_arrived: "§Y$PRC_zhang_guotao$§!已抵達陝西"
