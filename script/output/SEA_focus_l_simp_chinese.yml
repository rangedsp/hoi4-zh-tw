 PRC_neighboring_SOV_tt: "§Y[ROOT.GetName]§!必須與§Y[SOV.GetName]§!有直接接壤，或是途徑§Y陣營成員§!的間接接壤。"
 PRC_request_territory_tt: "請求將當前控制者§Y未擁有§!或擁有者是§Y[ROOT.GetRulingIdeology]§!政體的§Y我方核心地區交還§!。\n當前效果："
 PRC_said_no_to_cuf: "拒絕第二次國共合作"
 #HISTORICAL
 PRC_put_an_end_to_the_sufan: "停止肅反"
 PRC_put_an_end_to_the_sufan_desc: "我們抵達[622.GetName]時，當地政治局中央委員會領導人劉志丹以及其他地方領導層正在遭受一場肅反運動的迫害。應該派$PRC_bo_gu$制止這場鬧劇。"
 PRC_usurp_control_over_yanan: "奪取延安控制權"
 PRC_usurp_control_over_yanan_desc: "南邊的[1032.GetName]是我們重建並鞏固根據地計劃中合乎情理的下一步。"
 PRC_usurp_control_over_yanan_tt: "如果[ROOT.GetName]與§Y[CHI.GetName]§!處於§Y同一陣營§!，且另一個國家控制了§Y[1032.GetName]§!以及§Y[744.GetName]§!或§Y[283.GetName]§!其中之一："
 PRC_the_westward_expedition: "西征"
 PRC_the_westward_expedition_desc: "西邊的[NXM.GetNameDefCap]是我們擴張的絕佳機會。如果我們在[1045.GetName]邊境組織一場小規模衝突，或許能從他們對我們的疏忽中獲益。"
 PRC_the_eastward_expedition: "東征"
 PRC_the_eastward_expedition_desc: "在我們東邊，[SHX.GetLeader]統治著[615.GetName]，但我們或許能突破他們在黃河對岸的防線。"
 PRC_develop_yanan_soviet: "發展延安蘇區"
 PRC_develop_yanan_soviet_desc: "我們現已成功控制[1032.GetName]，這為拓展根據地提供了機會。[1032.GetName]將成為我們政府所在地。"
 PRC_the_internal_enemy: "國內敵對勢力"
 PRC_the_internal_enemy_desc: "對抗[CHI.GetLeader]和[CHI.GetRulingParty]政府的鬥爭已經持續了十年。1927年4月12日的慘案刻苦銘心，我們必須確保這樣的屈辱永不重演。"
 PRC_know_the_enemy: "知己知彼"
 PRC_know_the_enemy_desc: "我們的鄰居目前可能很友好，但我們必須採取預防措施，調查他們的防禦部署，以防局勢有變。"
 PRC_unlock_border_defense_raids_tt: "解鎖針對§Y$STATE_615$§!和§Y$STATE_1045$§!的§Y$raid_type_PRC_probe_border_defenses_raid$§!襲擊"
 PRC_cooperate_ulanhu: "與烏蘭夫合作"
 PRC_cooperate_ulanhu_desc: "雲澤，又名烏蘭夫，是一名堅定的蒙古共產主義戰士，目前正在我們根據地的北方組織部隊。他提出率領麾下部隊來到[ROOT.capital.GetName]加入我們，為我們而戰。"
 PRC_know_the_enemy_tt: "完成§Y$PRC_the_westward_expedition$§!、§Y$PRC_the_eastward_expedition$§!和§Y$PRC_usurp_control_over_yanan$§!後："
 PRC_burn_the_paper_tigers: "燒燬紙老虎"
 PRC_burn_the_paper_tigers_desc: "我們將聯繫[CHI.GetName]和所有其他力量以尋求建立第二次統一戰線來對抗我們共同的敵人。"
 PRC_rally_the_peasants: "動員農民"
 PRC_rally_the_peasants_desc: "農民階層構成了我們的主要權力基礎，由於[CHI.GetNameDef]治國無方，他們將從我們承諾的改革中獲益良多。"
 PRC_rally_the_28_bolsheviks: "召集二十八個半布爾什維克"
 PRC_rally_the_28_bolsheviks_desc: "值此艱難時刻，必須讓在蘇聯以政府和軍隊領導人模式受訓的二十八布爾什維克完全發揮其才能。"
 PRC_guide_central_committee: "引領中央委員會"
 PRC_guide_central_committee_desc: "我們必須為中央委員會設定明確的路線，如果們無法保持黨內團結，就永遠沒有統一中國的希望。"
 PRC_leadership_of_mao: "$PRC_mao_zedong$的領導"
 PRC_leadership_of_mao_desc: "毛澤東在長征中展現了他的魄力，他憑藉才能所獲得的大量影響力或許並非壞事。畢竟，如果我們不願受限於現有疆界，就需要強有力的領導。"
 PRC_expel_the_occupiers: "驅逐敵寇"
 PRC_expel_the_occupiers_desc: "只要我們有力量，就應將外國勢力逐出中國，否則他們就會不擇手段地損我利彼。"
 PRC_restore_territorial_integrity: "恢復領土完整"
 PRC_restore_territorial_integrity_desc: "我們將向支持我方事業的勢力請求直接移交領土。"
 PRC_seek_support_from_ussr: "尋求[SOU.GetNameDef]支持"
 PRC_seek_support_from_ussr_desc: "我們長期的盟友[SOU.GetNameDef]，為我們的革命提供了至關重要的援助。然而，為確保革命成功，我們必須請求他們進一步增加援助。畢竟，我們革命的勝利將使他們能夠將精力集中在其他戰線上。"
 PRC_request_guarantees: "請求領土保障"
 PRC_request_guarantees_desc: "我們借鑑蘇聯模式而來的新路線，若能得到蘇聯庇護，將從中獲得巨大利益。對蘇聯來說，提供安全保障並非毫無風險，但此舉在威懾潛在的敵人方面具有重要意義，因而值得為此承擔風險。"
 PRC_request_guarantees_tt: "§R[SOV.GetNameDefCap]可能要求我們成為附屬國以換取保障……§!"
 PRC_on_guerilla_warfare: "抗日遊擊戰爭的一般問題"
 PRC_on_guerilla_warfare_desc: "作為游擊戰理論家和戰略權威，毛澤東及其新確立的領導地位，必將確保我們這支規模不大卻獨立自主的武裝力量得到最有效的運用。"
 PRC_dissent_in_the_united_front: "[GetDissentFocusName]"
 PRC_dissent_in_the_united_front_default: "在統一戰線中爭取支持"
 PRC_dissent_in_the_united_front_alt: "在[ROOT.GetFactionName]中爭取支持"
 PRC_dissent_in_the_united_front_desc: "即使在與盟友並肩作戰，我們也必須彰顯自身意識形態的優勢——這或許能為我們贏得支持者，甚至可能包括聯盟中舉足輕重的人物。"
 PRC_dissent_in_the_united_front_1_tt: "與[CHI.GetNameWithFlag]同處一§Y陣營§!時："
 PRC_halves_infiltration_cost_tt: "執行§Y$PRC_infiltration_sea_cat$§!決議的§G成本減半§!"
 PRC_establish_friendly_bases: "建立敵後根據地"
 PRC_establish_friendly_bases_desc: "淪陷區內的大量平民意味著我方滲透人員在執行破壞行動時應能輕鬆混入其中。"
 PRC_establish_friendly_bases_1_tt: "解鎖決議：§Y建立破壞行動§!"
 PRC_establish_friendly_bases_2_tt: "§R被敵軍佔領的地區§!，若擁有§Y$PRC_guerilla_cells_active_2$§!，或為外國宗主附屬國的§Y核心地區§!，現可獲得§Y$PRC_anti_japanese_base$§!"
 PRC_secure_the_peoples_support: "爭取群眾支持"
 PRC_secure_the_peoples_support_desc: "即使我們失去了對中國大部分地區的控制，我們也必須確保群眾忠於我們的事業，這樣才能避免內戰再度爆發時陷入被動局面。"
 PRC_secure_the_peoples_support_tt: "解鎖全部§Y3級§!的§Y$PRC_infiltration_sea_cat$§!決議。"
 PRC_rural_recruitment: "農村募兵"
 PRC_rural_recruitment_desc: "佔領者永遠不可能監控所有農村定居點，因此在鄉下募兵可以將風險降到最低。"
 PRC_rural_recruitment_tt: "當§Y滲透§!一個§Y鄉村§!、§Y發達鄉村§!或§Y牧區§!地區時，獲得§G[?PRC_rural_recruitment_manpower]§!人力"
 PRC_raid_weapon_depots: "掠襲武器倉庫"
 PRC_raid_weapon_depots_desc: "我們已經通過滲透行動洞悉了敵人的後勤網絡。我們可以利用這一優勢突襲後勤網絡，用繳獲的裝備來組建更多行動隊。"
 PRC_raid_weapon_depots_tt: "在[ROOT.GetNameWithFlag]已組建§Y游擊隊§!或§Y$PRC_anti_japanese_base$§!的地區解鎖獲取§Y$infantry_equipment$§!和§Y$artillery$§!的§Y$raid_type_PRC_weapons_depot_raid$§!"
 PRC_empower_the_guerillas: "壯大游擊隊"
 PRC_empower_the_guerillas_desc: "隨著游擊部隊逐漸積累經驗，我們可以開始讓各部隊獨立行動。這樣既能讓他們滲透得更深入，也能在聯絡被截獲時避免他們暴露。"
 PRC_empower_the_guerillas_tt: "執行§Y$PRC_guerilla_warfare_sea_cat$§!決議的§G成本減半§!，並解鎖將§Y$PRC_guerilla_cells_active_1$§!替換為§Y$PRC_guerilla_cells_active_2$§!的決議。效果變化："
 PRC_holding_half_the_sky: "撐起半邊天"
 PRC_holding_half_the_sky_desc: "中國社會中的女性長期以來處於不平等地位。在我們追求人人平等的同時，也必須改變這一現狀。正如毛澤東所言：“婦女能頂半邊天”，我們必須讓她們也能為革命事業貢獻力量。"
 PRC_question_the_faction_leadership: "質疑陣營領導層"
 PRC_question_the_faction_leadership_desc: "為了擴大影響力，我們應當強調聯盟領導層的失誤，同時突出我們自身的成就。"
 PRC_to_unify_a_country: "邁向統一的努力"
 PRC_to_unify_a_country_desc: "鑑於我們鞏固了在其他軍閥治地的政治和軍事地位，我們必須要求獲得與此相稱的資源和認可。"
 PRC_to_unify_a_country_tt: "交出所有已被§Y[ROOT.GetName]§!成功§Y滲透§!的地區"
 PRC_strengthen_the_central_party_school: "加強中央黨校"
 PRC_strengthen_the_central_party_school_desc: "在中央黨校培訓新黨員幹部，這意味著由這所學校培養的幹部，在數量上會逐漸超過在蘇聯受訓的二十八個半布爾什維克及其支持者。"
 PRC_propaganda_efforts: "宣傳攻勢"
 PRC_propaganda_efforts_desc: "宣傳是為我們革命事業招募追隨者，以及鞏固現有追隨者信心的關鍵手段。我們的宣傳材料甚至可以被盟友用於動員民眾保衛中國。"
 PRC_propaganda_efforts_1_tt: "通過§Y游擊戰§!決議和§Y滲透§![CHI.GetAdjective]地區獲得§G[?PRC_gain_faction_inluence_number|%]§!§Y陣營影響力§!"
 PRC_propaganda_efforts_2_tt: "通過§Y游擊戰§!決議獲得§G[?PRC_gain_faction_inluence_number|%]§!§Y陣營影響力§!"
 PRC_establish_yanan_university: "建立延安大學"
 PRC_establish_yanan_university_desc: "目前的文科、理科和政治教育學院各自獨立，效率極低。通過合併這些學院，我們可以更有效地進行教學，並通過讓學生交流各自不同的知識來拓寬他們的知識領域。"
 PRC_peaceful_reunification: "尋求和平統一"
 PRC_peaceful_reunification_desc: "我們才是中國真正的領導者，這一事實必須得到徹底承認。我們將努力讓[WTT_current_china_leader.GetNameDef]認識到這一點。若他們拒不承認……那麼……全國人民自會看清他們的真實面目。"
 PRC_adopt_sun_yat_sens_principles: "繼承三民主義"
 PRC_adopt_sun_yat_sens_principles_desc: "孫中山的三民主義：民族、民權、民生，與我們追求的共產主義價值觀絕非互斥。他當年穩定中國的願景，如今正得以更深遠地實現。"
 PRC_establish_democratic_socialism: "建立民主社會主義"
 PRC_establish_democratic_socialism_desc: "我們為中國所取得的重大成就或許會載入史冊，但當艱難時刻再度來臨時，這些成就的意義將大打折扣。因此，人民必須感受到他們能夠引導革命，並在政府失職時通過投票讓其承擔責任。"
 PRC_form_central_social_affairs_department: "建立中央社會部"
 PRC_form_central_social_affairs_department_desc: "我們革命目標的調整必將引發支持者與反對者之間的討論，然而這些意識形態層面的討論存在滑向反革命議題的風險，因此必須設立情報機構以監控確立毛澤東思想的影響。"
 PRC_reform_the_republic: "再造民國"
 PRC_reform_the_republic_desc: "共和制是好的，只是未能妥善貫徹。我們才是共和理念的真正追隨者。"
 PRC_asian_democratic_union: "亞洲民主聯盟"
 PRC_asian_democratic_union_desc: "為促進平等，我們必須與亞洲夥伴合作，確保他們在世界舞臺上擁有強有力的談判地位。"
 PRC_asian_democratic_union_tt: "每有一個新陣營成員，§Y$PRC_asian_democratic_union_modifier$§!使§Y研究速度§!提高§G+1.00%§!，§Y生活消費品工廠係數§!提高§Y-2.0%§!，最多使研究速度提高§G+10.0%§!，生活消費品工廠係數減少§Y-20.0%§!"
 PRC_yanan_rectification_movement: "延安整風運動"
 PRC_yanan_rectification_movement_tt: "根據§Y$PRC_communist_power_struggle$§!當前數值，§Y$PRC_maoism_dynamic_modifier$§!將獲得不同的修正效果。\n當前效果："
 PRC_yanan_rectification_movement_desc: "我們政權迄今為止的成功皆可歸功於毛澤東，我們必須利用這一威望在黨內鞏固毛澤東思想。將毛澤東的思想收入黨章，並宣稱這是共產主義適應中國的首次調整，將使反對這些思想變得更加困難。"
 PRC_enforce_maoism: "推行毛澤東思想"
 PRC_enforce_maoism_desc: "為了進一步鞏固毛澤東思想作為黨的思想路線的核心地位，我們應當確保黨的領導與國家治理的意識形態高度一致，並將毛澤東思想確立為全國各族人民的行動指南。"
 PRC_deepen_the_dixie_mission: "深化迪克西使團合作"
 PRC_deepen_the_dixie_mission_desc: "[USA.GetNameDef]對與[ROOT.GetNameDef]合作所展現的努力令人欽佩，或許他們願意擴大迪克西使團，派遣[USA.GetAdjective]專家來幫助我方工業實現現代化。"
 PRC_invite_the_dixie_mission: "邀請迪克西使團"
 PRC_invite_the_dixie_mission_desc: "作為亞洲的新興力量，我們應當試探[USA.GetNameDef]是否有意建立外交關係。或許他們會與周邊的帝國主義列強不同，願意幫助中國建設起抵禦外侮的能力。"
 PRC_overthrow_the_ussr: "打倒修正主義"
 PRC_overthrow_the_ussr_desc: "我們與所謂的社會主義兄弟國家之間的意識形態分歧，並非僅僅源於我們對國內形勢的調整。這些國家奉行的修正主義路線與黨內資產階級專政已走向極端，我們應當介入，使他們的無產階級從被修正主義篡改的革命事業中得到解放。"
 PRC_overthrow_the_ussr_tt: "對所有主要共產主義國家獲得§Y吞併§!戰爭目標。當前效果："
 PRC_two_soviets_together: "兩個蘇維埃心一條"
 PRC_two_soviets_together_desc: "儘管我們在意識形態上設定了不同的路線，但我們與[SOV.GetNameDef]仍保持著牢固的意識形態聯繫，當然也未曾忘記他們這些年給予的物質與非物質支持。"
 PRC_tech_agreement_with_ussr: "《國防新技術協定》"
 PRC_tech_agreement_with_ussr_desc: "我們革命的進步意味著現在可以為與[SOV.GetNameDef]的夥伴關係貢獻研究成果。在多個領域趕上他們的技術水平後，我們將能分享對其裝備的評估，不被參與研發帶來的偏見所影響。"
 PRC_the_end_of_capitalism: "讓一切剝削人的制度死亡"
 PRC_the_end_of_capitalism_desc: "我們與[SOV.GetNameDef]的緊密合作已使聯盟實力大增，足以挑戰資本主義列強。我們將攜手傳播革命火種，解放他們的殖民地。"
 PRC_purge_the_world_of_fascism: "向著法西斯蒂開火"
 PRC_purge_the_world_of_fascism_desc: "儘管承諾要改變資本主義，但法西斯對共產主義的仇恨已足以證明這只是一場鬧劇。我們為解放無產階級所採取的激進手段，卻被法西斯用來鎮壓無產階級，這是我們必須制止的。"
 PRC_hundred_regiments_offensive: "百團大戰"
 PRC_hundred_regiments_offensive_desc: "擴編我軍並將其改組為多個獨立縱隊，將使我們能夠對敵人的補給線造成嚴重破壞。"
 PRC_prepare_for_the_inevitable: "迎接最終較量"
 PRC_prepare_for_the_inevitable_desc: "[JAP.GetNameDef]乃至我們傳統盟友[SOV.GetNameDef]的擴張主義威脅迫在眉睫。我們必須擱置意識形態分歧，準備建立統一戰線以應對外部威脅。"
 PRC_ask_for_soviet_lend_lease: "請求蘇聯租借援助"
 PRC_ask_for_soviet_lend_lease_desc: "$PRC_secure_lend_lease_from_soviet_desc$"
 #28 BOLSHEVIKS ALT-HISTORY
 PRC_reclaim_the_grasp_of_power: "重奪權力"
 PRC_reclaim_the_grasp_of_power_desc: "長征期間因毛澤東的軍事領導權而轉移至其手中的權力，終於開始迴歸至黨的前任領導班子。隨著長征結束，$PRC_wang_ming$或$PRC_bo_gu$已為再次承擔領導職責做好準備。"
 PRC_playing_both_sides: "兩手準備"
 PRC_playing_both_sides_desc: "我們必須確保軍閥和[CHI.GetAdjective]控制地區內群眾的忠誠，以備決戰我國未來命運之時。"
 PRC_the_fight_of_a_people: "人民的鬥爭"
 PRC_the_fight_of_a_people_desc: "即便身處敵佔區，我們的人民也必須抵抗敵人的推進。我們應派遣小分隊動員民眾，為解放他們的家園實打實地削弱佔領者。"
 PRC_a_stronger_united_front: "一切經過統一戰線"
 PRC_a_stronger_united_front_desc: "我們應該向[CHI.GetName]展示我們是可靠的盟友，這樣他們就不會覺得需要為聯盟破裂而預留資源，並允許我們更多地參與決策過程。"
 PRC_sino_allied_pact_of_non_aggression: "與同盟國簽訂互不侵犯條約"
 PRC_sino_allied_pact_of_non_aggression_desc: "在我們清除中國所受的外國影響時，必須確保那些擴張性較弱的大國不會介入。"
 PRC_sino_allied_pact_of_non_aggression_accept_tt: "他們會與§Y[ROOT.GetName]§!簽署§Y互不侵犯條約§!"
 PRC_with_inspiration_from_nkvd: "效仿內務人民委員部"
 PRC_with_inspiration_from_nkvd_desc: "我們的許多領導人通過與蘇聯官員的聯繫所知悉的蘇聯內務部，必須被立為防範內部敵人的典範。"
 PRC_soviet_technological_cooperation: "蘇聯技術合作"
 PRC_soviet_technological_cooperation_desc: "我們將尋求與[SOV.GetNameDef]達成一項研究協議，以促進兩國事業。"
 PRC_reestablish_moscow_sun_yat_sen_university: "重建莫斯科中山大學"
 PRC_reestablish_moscow_sun_yat_sen_university_desc: "通過重建莫斯科中山大學並增加資助，我們可以將未來的學者按照二十八個半布爾什維克的方式培養，為指導並改善國家發揮作用。"
 PRC_a_truly_united_front: "真正的統一戰線"
 PRC_a_truly_united_front_desc: "我們需要加強外交使團，提高第二統一戰線的地位。"
 PRC_a_truly_united_front_tt: "執行§Y$PRC_28_bolshevik_faction_cat$§!決議的§G成本減半§!"
 PRC_part_of_the_comintern: "加入共產國際"
 PRC_part_of_the_comintern_desc: "隨著國內革命的推進，我們可以集中精力協助共產國際實現其國際目標。"
 PRC_petition_for_freedom: "請求獨立"
 PRC_petition_for_freedom_desc: "太久以來，我們的獨立掌握在他人手中——現在是時候徹底改變這一切了。"
 PRC_petition_for_freedom_not_subject_tt: "§Y不是附屬國則無效果§!"
 PRC_aggressive_pursuit_of_diplomacy: "請大炮發言"
 PRC_aggressive_pursuit_of_diplomacy_desc: "儘管我們希望採取更文明的談判手段，但有時僅僅是暴力的威脅就足以迫使對方屈服。若威脅不起作用……"
 PRC_supreme_infiltration: "終極滲透"
 PRC_supreme_infiltration_desc: "憑藉此前的滲透經驗，我們如今可將這些經驗運用於拓展此類行動，爭取越來越多同胞加入我方陣營。"
 PRC_scholarly_revolution: "知識分子革命"
 PRC_scholarly_revolution_desc: "我們的領導人出自知識分子階層，我們必須通過他們的視角塑造[ROOT.GetAdjective]的未來。"
 #COMMON END-FOCUSES
 PRC_towards_one_china: "邁向一箇中國"
 PRC_towards_one_china_desc: "軍閥割據嚴重損害中國的穩定，不可留之，必須建立中央集權的領導體制。"
 PRC_towards_one_china_bypass_tt: "§Y每個中國勢力§!：必須滿足以下之一：\n  不存在\n  與§Y[ROOT.GetNameWithFlag]§!交戰\n  是§Y[ROOT.GetNameWithFlag]§!附屬國\n  與§Y[ROOT.GetNameWithFlag]§!處於同一陣營\n  §Y[ROOT.GetName]§!：對其擁有§Y戰爭目標§!"
 PRC_towards_one_china_tt: "獲得針對所有非同盟的大中華區勢力的§Y吞併§!戰爭目標。當前效果："
 PRC_allow_autonomous_regions: "允許區域自治"
 PRC_allow_autonomous_regions_desc: "應承認中國各地區的獨特需求，並允許一定程度的自治權。"
 PRC_allow_autonomous_regions_tt: "\n所有§Y同盟大中華區勢力§!可選擇成為§Y[ROOT.GetNameDef]的§!附屬國。當前效果："
 PRC_the_peoples_republic: "人民共和國"
 PRC_the_peoples_republic_desc: "鑑於革命已經鞏固，我們可以開始從革命狀態轉為通過改革為公民提供穩定與繁榮的國家。"
 PRC_remove_iniltration_and_guerilla_decisions_tt: "§R移除§!§Y$PRC_infiltration_sea_cat$§!和§Y$PRC_guerilla_warfare_sea_cat$§!決議"
 PRC_taiwan: "解放臺灣"
 PRC_taiwan_desc: "清政府割讓臺灣給日本的歷史必須被糾正，即使空中或海上支援的必要性對我們意味著獨特的挑戰。"
 PRC_reclaim_tibet: "收復西藏"
 PRC_reclaim_tibet_desc: "中國的動盪使得[TIB.GetNameDef]得以脫離中國統治。但我們兩國之間的歷史聯繫不容忽視，我們必須致力於與他們統一，以便我們的邊界能再次延伸至喜馬拉雅山脈。"
 PRC_subjugate_korea: "降服朝鮮"
 PRC_subjugate_korea_desc: "[JAP.GetNameDef]對朝鮮的佔領及其隨後向東三省的擴張表明，聯合朝鮮對[ROOT.GetAdjective]安全至關重要。如果目前無法實現這一點，我們就該進行干預。"
 PRC_dare_to_struggle: "敢於鬥爭"
 PRC_dare_to_struggle_desc: "各路軍閥已歸順我方，是時候討伐那些侵佔中國領土的外來侵略者了。"
 PRC_dare_to_win: "敢於勝利"
 PRC_dare_to_win_desc: "[SOV.GetNameDef]的帝國主義前身曾對中華大地發動了侵略擴張，我們為改善雙邊關係暫時擱置了這段歷史，但我們沒有遺忘。如今我們已具備相應實力，理應嘗試恢復原有疆界。"
 PRC_move_capital: "遷都"
 PRC_move_capital_desc: "$PRC_proclaimed_communism$成立後，我們自然應該遷都並將這座城市的名稱恢復為北京。"
 PRC_beijing_capital_name: "北京"
 beijing_winter_capital_name: "大都"
 yuan_summer_capital_name: "上都"
 PRC_education_reform: "教育改革"
 PRC_education_reform_desc: "我們將採取措施，推動一場全國範圍的快速教育改革，旨在採用蘇聯式高等教育，重點發展工程學與技術類教育。"
 PRC_the_first_premier: "第一任總理"
 PRC_the_first_premier_desc: "$PRC_zhou_enlai$將成為$PRC_proclaimed_communism$的第一任總理，鞏固他作為黨內最重要政治家之一的地位。"
 PRC_the_party_builds_the_nation: "黨建設國家"
 PRC_the_party_builds_the_nation_desc: "如今我們已控制中國的大片地區，是時候發動一場全國性運動，利用好我們的人口與新興工業了。"
 PRC_the_chinese_century: "中國世紀"
 PRC_the_chinese_century_desc: "經濟的騰飛與足以塑造世界的政治影響力相結合——中國長久以來的夢想如今已成為現實。中國開始崛起，這是我們的世紀。"
 #UNWILLING DIARCHY ALT-HISTORY
 PRC_the_unwilling_diarchy_focus: "勉強合作的兩架馬車"
 PRC_the_unwilling_diarchy_focus_desc: "非常時期需要非常手段——我們必須更換黨的現有機構，以確保新的領導層能夠迅速對人民的敵人採取行動。\n\n毛澤東和張國燾必須擱置分歧，攜手合作。"
 PRC_the_unwilling_diarchy_focus_tt: "你將無法組建或加入§Y第二次統一戰線§!"
 PRC_the_response_to_a_threat: "回應威脅"
 PRC_the_response_to_a_threat_desc: "我們將採取一切必要措施來應對四周的威脅。我們必須為進攻做好準備。"
 PRC_promote_regular_army: "籌建正規軍"
 PRC_promote_regular_army_desc: "只有通過常規手段，我們才能確保紅軍有能力保衛並擴張[ROOT.GetNameDef]的領土。"
 PRC_strict_training_regiments: "嚴格訓練制度"
 PRC_strict_training_regiments_desc: "我們必須加強紅軍的紀律。\n\n每日的晨練訓練計劃將迅速造就一支專業化軍隊，並提升輸送到一線部隊新兵的質量。"
 PRC_army_reforms: "軍隊正規化改革"
 PRC_army_reforms_desc: "紅軍已經落後，其所依賴的舊學說在長征結束後早已不再適用。我們必須從頭開始重建紅軍。\n\n[ROOT.GetLeader]將與主要將領們一道，推行新一輪改革，建立一支更強大的紅軍。"
 PRC_centralized_army_command: "集中陸軍指揮"
 PRC_centralized_army_command_desc: "分散的指揮方式對我們毫無益處。所有情報必須通過新的指揮體系傳遞，從最高層一直貫徹到最底層的士兵，從而改善作戰計劃的執行。"
 PRC_soviet_battle_tactics: "蘇式作戰策略"
 PRC_soviet_battle_tactics_desc: "通過效仿[SOV.GetNameDef]的戰術，我們也能利用數量上的優勢。我們將指派一批軍官學習[SOV.GetNameDef]的經驗。"
 PRC_promote_guerilla_warfare: "發揚游擊戰"
 PRC_promote_guerilla_warfare_desc: "紅軍暫時無法與敵人實力抗衡——至少現在還不能。\n\n我們必須發揮自身優勢，在敵後作戰，然後迅速消失，再次發動襲擊。"
 PRC_the_battle_behind_the_front_lines: "敵後戰線"
 PRC_the_battle_behind_the_front_lines_desc: "我們必須加倍努力打擊敵後的外國侵略者。通過破壞他們的補給與增援前線的能力，我們將迫使敵人不得不投入寶貴的人力來保護後方。"
 PRC_gain_the_peoples_trust: "贏得人民的信任"
 PRC_gain_the_peoples_trust_desc: "我們將滲透到周邊鄉村，對相關人士進行收買與威脅，以確保那些尚未在我們控制下地區的民眾忠誠。我們將在未來的日子裡需要他們的支持……"
 PRC_limited_infiltration_efforts: "有限滲透行動"
 PRC_limited_infiltration_efforts_desc: "我們必須盡一切可能統一中國，不論採取何種手段。中國人民必須知道我們沒有忘記他們，並在必要時向他們提供物質與精神上的支持。"
 PRC_secure_the_lands: "鞏固根據地滲透"
 PRC_secure_the_lands_desc: "我們比以往任何時候都更接近於實現我們的目標，我們現在絕不能猶豫。我們需要投入更多資源來說服那些仍受反動政權控制的百姓，意識到我們事業的正義性。"
 PRC_launch_sabotage_campaigns: "開展破壞行動"
 PRC_launch_sabotage_campaigns_desc: "對侵略者的破壞行動將有助於紅軍的事業，並阻礙敵軍的進攻。"
 PRC_raiding_parties: "掠襲隊"
 PRC_raiding_parties_desc: "在工業實力上我們不如敵人，但我們以智慧彌補。派出襲擾部隊不僅有助於緩解我們的裝備問題，也會加劇敵人的困境。"
 PRC_mobilization_of_the_people: "動員群眾"
 PRC_mobilization_of_the_people_desc: "危機時刻，人民將會奮起。\n\n我們將組建由長征老兵領導的民兵部隊，並動員和武裝當地百姓。"
 PRC_mobilization_of_the_people_tt: "創建§Y4支中國§!民兵單位"
 PRC_mao_zedong_ascends: "$PRC_mao_zedong$上臺"
 PRC_mao_zedong_ascends_desc: "$PRC_mao_zedong$是[ROOT.GetNameDef]真正的領袖。\n\n$PRC_zhang_guotao$不再與毛主席平級，只能有一個領袖。"
 PRC_promote_womens_suffrage: "推廣婦女選舉權"
 PRC_promote_womens_suffrage_desc: "“婦女能頂半邊天。”黨的目標是真正的性別平等，我們必須採取措施，保障中國婦女在法律、政治、社會和經濟方面的參與。"
 PRC_zhang_guotao_ascends: "$PRC_zhang_guotao$上臺"
 PRC_zhang_guotao_ascends_desc: "$PRC_zhang_guotao$是[ROOT.GetNameDef]真正的領袖。\n\n$PRC_mao_zedong$不再與張國燾主席平級，只能有一個領袖。"
 PRC_consolidate_politcal_power: "鞏固政治權力"
 PRC_consolidate_politcal_power_desc: "如今，一位領袖已然凌駕眾人之上，我們必須在整個黨內結構中鞏固這一地位。絕不能容許異議分子存在。"
 PRC_consolidate_politcal_power_tt: "推動§Y$PRC_communist_power_struggle$§!向領先方傾斜。當前效果："
 PRC_secure_lend_lease_from_soviet: "打通中蘇援助通道"
 PRC_secure_lend_lease_from_soviet_desc: "過去試圖與[SOV.GetNameDef]建立陸路聯繫的努力以慘敗告終。但如今我們已打通這條道路，從他們那裡獲得補給將更為容易。"
 PRC_preemptive_strike: "先發制人"
 PRC_preemptive_strike_desc: "1927年南昌起義的後果顯示了國民黨軍的戰鬥力。若要避免再走長征的道路，我們必須先發制人，自行實施合圍並利用有利地勢。"
 PRC_an_end_to_the_japanese_threat: "終結[JAP.GetAdjective]威脅"
 PRC_an_end_to_the_japanese_threat_desc: "[JAP.GetAdjective]的存在構成了持續威脅，其帝國野心無窮無盡。若我們先發制人，或許能令其措手不及。"
 PRC_assume_leadership: "掌握領導權"
 PRC_assume_leadership_desc: "[GetAssumeLeaderShipText]"
 PRC_assume_leadership_tt: "根據§Y$PRC_communist_power_struggle$§!當前數值，§Y[ROOT.GetLeader]§!將獲得不同的特質。\n當前效果："
 PRC_GetAssumeLeaderShipText_Wentian: "新任主席的地位必須不可動搖。我們必須以黨和國家的名義向前邁進。"
 PRC_GetAssumeLeaderShipText_NotWentian: "新任主席的地位必須不可動搖。前任主席$PRC_zhang_wentian$已經完成了穩定黨的使命，但現在是[ROOT.GetLeader]的時代。"
 PRC_emergency_supply_protocols: "緊急供給方案"
 PRC_emergency_supply_protocols_desc: "我軍補給體系已難以為繼。我們必須傾盡全力改善這一情況，以防部隊陷入無槍、無彈、無糧之困境。"
 PRC_emergency_prodction_protocols: "緊急生產章程"
 PRC_emergency_prodction_protocols_desc: "為提高戰時生產，我們必須為工業設定生產配額。此舉可能疏遠支持者，但別無選擇。"
 PRC_extend_emergency_measures: "延長緊急措施"
 PRC_extend_emergency_measures_desc: "我們比以往更接近解決最關鍵的問題，但我們必須加大努力，否則一切都將前功盡棄。"
 PRC_extend_emergency_measures_1_tt: "完成§Y$PRC_emergency_supply_protocols$§!後，§Y時效延長[?PRC_emergency_protocol_idea_days]天§!，或者："
 PRC_extend_emergency_measures_2_tt: "完成§Y$PRC_emergency_prodction_protocols$§!後，§Y時效延長[?PRC_emergency_protocol_idea_days]天§!，或者："
 PRC_to_support_the_army: "支前供給制度化"
 PRC_to_support_the_army_desc: "我們必須採取一切手段，將已採取的措施延續下去，並將這些調整固化為常態化制度。軍隊要引領革命事業，就必須擁有其所需之物資。"
 PRC_to_support_the_army_1_tt: "完成§Y$PRC_emergency_supply_protocols$§!後："
 PRC_to_support_the_army_2_tt: "完成§Y$PRC_emergency_prodction_protocols$§!後："
 PRC_reach_out_to_the_west: "向西方國家請求援助"
 PRC_reach_out_to_the_west_desc: "儘管西方過去一再侵犯[ROOT.GetAdjective]主權，但其擁有的豐富資源仍有助於將[ROOT.GetNameDef]發展為世界強國。"
 PRC_reach_out_to_the_west_tt: "若一個非法西斯的§Y西方大國§!正在與共同敵人作戰，且雙方沒有盟友彼此交戰："
 PRC_closer_ties_to_sov: "與[SOV.GetName]更緊密的聯繫"
 PRC_closer_ties_to_sov_desc: "我們必須尋求與[SOV.GetNameDef]更加緊密的關係。中蘇關係已很穩固，但還必須進一步加強。"
 PRC_demand_warlord_loyalty: "爭取地方實力派"
 PRC_demand_warlord_loyalty_desc: "我們必須將中國統一於一個領導之下——並且必須向所有人表明這是誰的領導。\n\n我們將向各路軍閥發出信息——提議組建國防政府。[CHI.GetLeader]或許不會同意，但這是必要的。"
 PRC_bring_war_to_neighboring_warlords: "向周邊軍閥發動戰爭"
 PRC_bring_war_to_neighboring_warlords_desc: "中國只能有一個統一的國家政權——傳播革命的第一步就是戰勝割據軍閥。"
 PRC_bring_war_to_neighboring_warlords_tt: "獲得對所有§Y鄰近軍閥§!進行§Y吞併§!戰爭目標。當前效果："
 PRC_lessons_of_the_west: "西方的經驗"
 PRC_lessons_of_the_west_desc: "我們要把目光投向國境之外，看看能從其他國家借鑑哪些經驗——尤其要學習那些工業發展已達到我們目前尚未企及水平的國家。\n\n我們必須迎頭趕上。"
 PRC_the_long_march_towards_progress: "邁向進步的長征"
 PRC_the_long_march_towards_progress_desc: "我們必須不斷前進。我們或許在技術上落後，但不會永遠如此。我們必須將資源投入到加強[ROOT.GetNameDef]的教育部門中去。"
 PRC_every_peasant_a_soldier: "兵農合一"
 PRC_every_peasant_a_soldier_desc: "凡在田間勞作的身體健全之人，亦須枕戈待旦，以備國家徵召。\n\n“革命戰爭是群眾的戰爭，只有動員群眾才能進行戰爭，只有依靠群眾才能進行戰爭。”"
 PRC_every_peasant_a_soldier_1_tt: "完成§Y$PRC_promote_guerilla_warfare$§!後："
 PRC_every_peasant_a_soldier_2_tt: "完成§Y$PRC_promote_regular_army$§!後："
 PRC_avenge_the_century_of_humiliation: "為百年國恥復仇"
 PRC_avenge_the_century_of_humiliation_desc: "19世紀是西方列強羞辱我們的世紀。是時候讓他們償還了。"
 PRC_avenge_the_century_of_humiliation_tt: "[ROOT.GetNameWithFlag]獲得針對所有相鄰§Y西方國家§!或其附屬國的§Y征服（國策）§!戰爭目標。當前效果："
 PRC_the_march_to_victory: "邁向勝利"
 PRC_the_march_to_victory_desc: "邁向勝利的長征勢不可擋。從兩架馬車相互傾軋的領導開始，我們已經建立起強大而團結的政黨體系。如今，我們必須將目光轉向外部，聚焦於全國土地上的敵人。"
 PRC_a_new_central_committee: "新的中央委員會"
 PRC_a_new_central_committee_desc: "是時候改變了。$PRC_zhang_guotao$將下令對中央委員會進行全面審查並從頭組建。"
 PRC_a_new_central_committee_tt_1: "為期§Y180天§!："
 PRC_a_new_central_committee_tt_2: "然後："
 #COMMON BRANCHES
 PRC_expedite_land_revolution: "加速土地革命"
 PRC_expedite_land_revolution_desc: "從地主到農民的土地再分配打破了農村的封建結構。農村群眾現在堅定不移地支持革命"
 PRC_halt_land_revolution: "叫停土地革命"
 PRC_halt_land_revolution_desc: "為穩固政權，土地改革運動已被推遲。農民雖有怨言，但安撫了地方勢力，短暫的內部團結得以維繫。"
 PRC_reestablish_the_state_bank: "重建國家銀行"
 PRC_reestablish_the_state_bank_desc: "為有效管理經濟，我們需要重建中央銀行。此前，$PRC_communism$國家銀行曾在中央蘇區成立，後因長征而不得不停止運營。其設備自此一直在運輸途中，現在正陸續運抵[ROOT.capital.GetCapitalVictoryPoint.GetName]。"
 PRC_promote_the_silver_dollar: "推廣銀幣"
 PRC_promote_the_silver_dollar_desc: "取消銅幣的流通貨幣地位，改用銀幣，可以把舊銅幣回收用於軍需生產。銀幣的價值也能保證我們的貿易伙伴不必擔心貨幣價值的波動，因為它與銀價掛鉤。"
 PRC_promote_paper_bills: "推廣紙幣"
 PRC_promote_paper_bills_desc: "成本低廉的紙幣，可以成為銅幣的良好替代品，後者則能被軍工廠回收再利用。然而，這種貨幣也有重大弊端：我們的貿易伙伴可能會擔心這種貨幣的價值不穩，因為我們只需多印一些便能輕易改變其價值。"
 PRC_new_currency_established: "若§Y$PRC_equipment_from_copper_coins$§!尚未出現，完成該國策可防止其產生負面影響。"
 PRC_allow_special_goods_trade: "默許特貨貿易"
 PRC_allow_special_goods_trade_desc: "政權應當承認某些特種商品的存在價值，並通過嚴苛重稅等方式實現適度管控與利用。"
 PRC_ban_special_goods_trade: "禁止特貨貿易"
 PRC_ban_special_goods_trade_desc: "儘管“特貨”廣為流傳，但其惡劣的成癮性是個嚴重問題，必須通過嚴格的禁令予以徹底根除。即使這一措施最初可能不受歡迎，但從長遠看，它是維護革命進程的必要措施——我們需要避免重蹈[SOV.GetNameDef]因酒精濫用而導致的社會問題。"
 PRC_ban_special_goods_trade_tt: "一年後§Y民族精神§!將升級為："
 PRC_agricultural_reform: "農業改革"
 PRC_agricultural_reform_desc: "既然我們已經確保能夠掌控經濟資源，就應繼續農業改革，把地主的土地分配給貧困農民。"
 PRC_agricultural_reform_tt: "§Y$PRC_agrarian_society$§!改為§Y$PRC_agrarian_reform$§!，其效果為："
 PRC_eight_points_for_attention: "八項注意"
 PRC_eight_points_for_attention_desc: "$PRC_mao_zedong$制定的$PRC_eight_points_for_attention$規定了以下要點：（一）說話和氣；（二）買賣公平；（三）借東西要還；（四）損壞東西要賠；（五）不打人罵人；（六）不損壞莊稼；（七）不調戲婦女；（八）不虐待俘虜。"
 PRC_CSCEC_mils: "建工總局：軍工特化"
 PRC_CSCEC_mils_desc: "我們將督促國家建築工程總局專門從事軍事建設，併為此竭盡一切手段。我們必須提升軍事生產能力，以確保在未來幾年內具備競爭優勢。"
 PRC_CSCEC_civs: "建工總局：民工特化"
 PRC_CSCEC_civs_desc: "我們將督促國家建築工程總局專注於工業建設。畢竟這本就是基建工程兵們的優勢。"
 PRC_industrialization_efforts: "啟動工業化進程"
 PRC_industrialization_efforts_desc: "隨著農業產量的提高，一部分人手可以投入到其他產業。我們應當優先發展能促進進一步增長的部門，比如建築材料或農具生產。"
 PRC_construct_the_banqiao_dam: "建造板橋水庫"
 PRC_construct_the_banqiao_dam_desc: "在[602.GetName]修建瀘河的大壩可以為該地區提供電力，還能防止洪水——尤其是在近幾十年屢次爆發的嚴重洪災。"
 PRC_resource_extraction_focus: "資源開採"
 PRC_resource_extraction_focus_desc: "我們需要更全面地利用根據地範圍內的自然資源，以促進工業增長。"
 PRC_connecting_the_country: "連接全國"
 PRC_connecting_the_country_desc: "隨著工業擴張，以及商品從原本自給自足但效率低下的社區流通到全國，對基礎設施的需求比以往任何時候都更加重要。"
 PRC_establish_shorter_market_plans: "制定短期市場計劃"
 PRC_establish_shorter_market_plans_desc: "激進的長期計劃雖可能帶來巨大利益，但代價和風險都很高。相比之下，我們應確保現有工業能夠最優地發揮效能。"
 PRC_initialize_five_year_plan: "啟動第一個五年計劃"
 PRC_initialize_five_year_plan_desc: "首個五年計劃的目標是改善現有工業的生產力，然後利用剩餘產能建立全新的工業部門。"
 PRC_urbanization: "推動城市化"
 PRC_urbanization_desc: "要推動重工業的發展，就必須鼓勵原本自給自足的農民進入工業生產，同時由國家確保其他農民生產出足夠的糧食，分配到城鄉之間。"
 PRC_rural_region_development: "農村地區發展"
 PRC_rural_region_development_desc: "為了改善[ROOT.GetNameDef]的生活水平，我們必須通過投資農村農業現代化來提高糧食產量。"
 PRC_finalize_industrial_plan: "完成工業計劃"
 PRC_finalize_industrial_plan_desc: "隨著改革計劃的完成，我們可以通過確保新研究中心與生產設施的緊密合作來最終完善工業規劃。"
 PRC_great_production_movement: "大生產運動"
 PRC_great_production_movement_desc: "[ROOT.GetNameDef]的一連串的自然災害加劇了糧食短缺問題，這促使我們推動此前依賴政府供糧的各根據地開展變革。群眾已主動開墾昔日的荒閒土地、建立農場，如今我軍部隊亦應積極行動，將自身掌握的工程技術經驗傳授給群眾，與他們共同努力。"
 PRC_equipment_from_copper_coins: "銅幣鑄成裝備"
 PRC_equipment_from_copper_coins_desc: "由於嚴重缺乏採礦工業，可以將銅幣熔化，用於製造子彈或其他軍需品。"
 PRC_rally_the_industry: "整頓生產"
 PRC_rally_the_industry_desc: "我軍轉戰陝北後，工業生產陷入混亂。我們必須清點從中央蘇區帶來的生產設備，探究它們的潛在用途，並努力恢復利用根據地現有的資源。"
 PRC_red_army_reborn: "紅軍重生"
 PRC_red_army_reborn_desc: "我們在[622.GetName]的新根據地必須穩固，可通過招募當地志願者來彌補部分損失，並制定保衛新家園的計劃。"
 PRC_asymmetric_warfare: "非對稱作戰"
 PRC_asymmetric_warfare_desc: "幾個世紀以來，處於劣勢的軍隊都依靠不對稱優勢克敵制勝，我們也必須如此。更好地利用地形、團結當地群眾、運用游擊戰術，都能幫助我們佔據上風。"
 PRC_conventional_warfare: "常規戰爭"
 PRC_conventional_warfare_desc: "曠日持久的消耗戰雖有優勢，但並非沒有弊端。若只是侷限於零星襲擊，我們的生產設施將更易遭到敵軍報復打擊。此外，小規模的勝利難以提振士氣，迴避大會戰還會拖長本可儘快結束的衝突。"
 PRC_indirect_fire: "間接火力"
 PRC_indirect_fire_desc: "我們將重點打造一支改良的炮兵部隊，專門向敵人傾瀉間接火力打擊。"
 PRC_three_rules_of_discipline: "強調三大紀律"
 PRC_three_rules_of_discipline_desc: "正如毛澤東在二十年代確立的軍事原則，為了爭取民眾支持，我軍必須避免利用權力掠奪財產。而為了充分利用有限資源，從敵人手中繳獲的物資也必須交由高層統一分配。"
 PRC_request_for_aid: "請求援助"
 PRC_request_for_aid_desc: "自我黨成立以來，[SOV.GetNameDefCap]一直給予支持但避免直接介入。然而，當今世界局勢要求的不再是象徵性的援助，我們必須派遣代表團請求[SOV.GetAdjective]提供裝備，幫助我們建設軍隊。"
 PRC_long_march_to_recovery: "從長征中恢復"
 PRC_long_march_to_recovery_desc: "前往[622.GetName]的長征給我軍造成了巨大傷亡。是時候整頓剩餘部隊，為重振工農紅軍的榮耀指明方向。"
 PRC_best_of_the_best: "優中選優"
 PRC_best_of_the_best_desc: "我們的武裝力量將致力於灌輸最高水平的素質與專業精神。我們必須只接受那些對事業最為忠誠、且技能相匹配的人。"
 PRC_master_the_terrain: "山野機動"
 PRC_master_the_terrain_desc: "訓練山地作戰並繪製精良地形圖，將使我們能夠包抄敵軍並在打擊後安全撤退。"
 PRC_to_steal_an_army: "敵人給我們造"
 PRC_to_steal_an_army_desc: "由於有限的工業無法滿足我軍需求，必須儘可能使用繳獲的裝備。雖然這會帶來後勤挑戰，但只要做好準備、確保零件供應，就能克服這些困難。"
 PRC_role_of_kangda: "抗大的作用"
 PRC_role_of_kangda_desc: "我們最重要的軍事學校——被稱為抗大的[622.GetName]紅軍學校，以前主要側重於培訓。隨著資金增加，它現在可以成為創新的中心，專注於研究國內外的軍事理論與武器發展。"
 PRC_develop_the_army: "發展陸軍"
 PRC_develop_the_army_desc: "現有軍隊已盡力而為，現在是時候為其提供進一步現代化的手段。"
 PRC_to_serve_the_people: "為人民服務"
 PRC_to_serve_the_people_desc: "必須確保士兵感受到我們戰鬥是為了人民的利益。軍人和非軍人都應當認識到自己肩負的民族使命。"
 PRC_prepare_for_596: "備嫁邱小姐"
 PRC_prepare_for_596_desc: "核武器的威脅無法僅憑常規手段對抗。政府必須招募並支持相關領域的科學家，以便他們為核計劃作好準備。"
 GER_unlock_national_nuclear_corporation_tt: "解鎖工業集團§Y$PRC_china_national_nuclear_corporation$§!"
 PRC_increase_domestic_production_capacity: "增加本土軍工產能"
 PRC_increase_domestic_production_capacity_desc: "雖然我們憑有限手段擴展了影響力，但現在是時候投資軍工產業。如果再遭遇持久戰，庫存裝備遲早會耗盡或損壞，若無法提供替換將是災難性的。"
 PRC_army_tank_research: "準備本國坦克生產"
 PRC_army_tank_research_desc: "隨著新興工業能夠提供更重的武器裝備，我們必須追趕世界軍事強國，發展坦克生產設施。這將使我們在沒有裝甲部隊的鄰國面前佔據巨大優勢，也能增強對擁有裝甲力量國家的防禦水平。"
 PRC_army_doctrines: "理論付諸實踐"
 PRC_army_doctrines_desc: "我們在歷次衝突中形成的軍事學說，必須與新體制和新武器相結合，否則其優勢將大打折扣。"
 PRC_army_doctrines_tt: "根據你選擇的§Y主要學說§!獲得加成："
 PRC_army_doctrines_mobile_warfare_tt: "擁有§Y$GRAND_DOCTRINE_MOBILE_WARFARE$§!："
 PRC_army_doctrines_superior_firepower__tt: "擁有§Y$GRAND_DOCTRINE_SUPERIOR_FIREPOWER$§!："
 PRC_army_doctrines_grand_battleplan_tt: "擁有§Y$GRAND_DOCTRINE_GRAND_BATTLEPLAN$§!："
 PRC_army_doctrines_mass_assault_tt: "擁有§Y$GRAND_DOCTRINE_MASS_ASSAULT$§!："
 PRC_appeal_for_foreign_aid: "呼籲外援"
 PRC_appeal_for_foreign_aid_desc: "從[SOV.GetNameDef]引進裝甲車輛，可以使我軍建立裝甲部隊，同時研究其設計以改進我們自己的型號。"
 PRC_establish_pla_air_force: "人民解放軍空軍"
 PRC_establish_pla_air_force_desc: "隨著我們從山區向外擴張，收復更多低地地區，我們也愈發容易遭受空中襲擊。幸運的是，在擴張過程中我們已積累了足夠的工業實力，能夠立即著手應對這一威脅——通過建立自己的空軍力量來消除這種脆弱性。"
 PRC_appoint_chang_qiankun: "任命常乾坤"
 PRC_appoint_chang_qiankun_desc: "在蘇聯茹科夫斯基空軍學院學習過的常乾坤，現在是監督我軍空軍建設的最佳人選。"
 PRC_the_northeast_aviation_university_sea: "東北航空學校"
 PRC_the_northeast_aviation_university_sea_desc: "建立大型空軍教育中心，我們就不再需要依賴國外學校來為我們的軍官教授空軍理論和裝備操作，以及將技能傳授給飛行員的教學方法。"
 PRC_form_the_5th_research_institute: "成立國防部第五研究院"
 PRC_form_the_5th_research_institute_desc: "從近期戰爭得到的啟示是，我們應建造專注於噴氣和火箭推進的研究機構，用於改進飛機設計，並最終發展導彈與火箭。"
 PRC_aviation_infrastructure: "投資航空基礎設施"
 PRC_aviation_infrastructure_desc: "[ROOT.GetNonIdeologyName]疆域遼闊，僅靠飛機數量是不夠的。必須在關鍵地區建設基礎設施，並建立空情追蹤網絡。"
 PRC_anti_air_effort: "發展防空技術"
 PRC_anti_air_effort_desc: "我們的空域遼闊，難以用飛機與基地覆蓋全部空域。相比之下，部署高射炮不僅能提供對空防禦，還能成為極具成本效益的解決方案。"
 PRC_establish_domestic_aircraft_production: "建立本土飛機產線"
 PRC_establish_domestic_aircraft_production_desc: "本土生產飛機可以減少對外國的依賴，並使機型更符合我們的需求。"
 PRC_light_plane_focus: "輕型飛機研發"
 PRC_light_plane_focus_desc: "改進輕型飛機，可以在空戰中獲得優勢。"
 PRC_medium_plane_focus: "中型飛機研發"
 PRC_medium_plane_focus_desc: "要增強打擊戰術目標的能力，應專注於中型飛機設計。"
 PRC_large_plane_focus: "大型飛機研發"
 PRC_large_plane_focus_desc: "專注於大型飛機設計，我們可以打造出能夠承載重型載荷、攜帶足夠燃料飛行極遠距離的機型。"
 PRC_establish_pla_navy: "人民解放軍海軍"
 PRC_establish_pla_navy_desc: "由於過去我們未能獲得出海口，我們面臨著追趕敵方海軍力量的艱鉅任務。海軍不僅能保護海岸與新興的貿易通道，還能將我們的影響力投射至海洋。"
 PRC_dockyard_construction_efforts: "投資船塢建設"
 PRC_dockyard_construction_efforts_desc: "在建立海軍的過程中，必須投資相關產業來生產艦船，並推動部分工廠（如炮廠）與新海軍產業合作。"
 PRC_naval_mio: "加強海軍工業"
 PRC_naval_mio_desc: "鑑於我們過去缺乏海軍工業的產業基礎，政府必須確保新成立的海軍生產機構的高效運作。"
 PRC_the_pla_naval_school: "人民解放軍海軍學院"
 PRC_the_pla_naval_school_desc: "建立海軍教育中心，為新軍官和水手提供集中訓練，涵蓋航海、航空設計與維護等多方面技能。"
 PRC_reappoint_jinguang_as_admiral: "將肖勁光調任海軍"
 PRC_reappoint_jinguang_as_admiral_desc: "由於我軍缺乏海戰經驗，最合適的海軍新任指揮官，也許會是一位擁有豐富陸戰經驗的指揮官。"
 PRC_reappoint_jinguang_as_admiral_tt: "§R解除[PRC_ziao_jingguang.GetName]的陸軍將領職務§!"
 PRC_naval_infrastructure_effort: "發展海軍基礎設施"
 PRC_naval_infrastructure_effort_desc: "為了能夠在[ROOT.GetNonIdeologyName]漫長的海岸線上展開行動，必須為海軍提供補給與維修的基礎設施，使其無論身處何地都能迅速得到支援。"
 PRC_a_modern_army: "現代陸軍"
 PRC_a_modern_army_desc: "如今我們已經改進了裝備、作戰理論、訓練等各個方面，終於可以確信，無論面對何種敵人，我們都已儘可能做好了準備。"
 PRC_air_force_capstone: "現代空軍"
 PRC_air_force_capstone_desc: "我們對空軍裝備研發的投資，應當讓我們生產出能超越敵人的飛機。這也將促進噴氣式發動機等新技術的順利整合。"
 PRC_naval_capstone: "現代海軍"
 PRC_naval_capstone_desc: "隨著[PRC_ziao_jingguang.GetName]整編海軍併為其配備全面的火力資源，我們得以將影響力擴大至太平洋。"
 PRC_peoples_liberation_army_sea: "人民解放軍陸軍"
 PRC_peoples_liberation_army_sea_desc: "我們的工農紅軍如今擁有越來越多的老兵，是時候徹底轉變軍隊性質，從民兵武裝邁向一支訓練有素、裝備精良的軍隊了。是時候組建人民解放軍陸軍"
 PRC_central_military_commision: "中央軍事委員會"
 PRC_central_military_commision_desc: "隨著各軍種完成了整編與現代化改革，應當建立一個協調機構來統籌這些軍種。這不僅能加強我們對軍隊的掌控，還能提升我軍開展聯合作戰的能力。"
 PRC_prepare_for_third_phase: "迎接第三階段"
 PRC_prepare_for_third_phase_desc: "毛澤東曾指出，游擊戰分為三個階段。在完成爭取群眾支持和削弱敵人的前兩個階段後，現在是時候轉向常規作戰手段了。在第三個也即最後一個階段，我們將通過直接進攻城市來進一步擴大我們的解放區。"
 PRC_revolutionary_war_of_the_masses: "群眾的革命戰爭"
 PRC_revolutionary_war_of_the_masses_desc: "我們必須明確，我國代表的是普通人民，而非腐敗與精英主義的民族主義國家。我們的目標是打倒這些勢力，建立一個更美好的制度。"
 PRC_one_with_the_people: "聯繫群眾"
 PRC_one_with_the_people_desc: "我們致力於建設更好的[CHI.GetNonIdeologyName]，這一承諾必須廣泛宣傳，以吸引更多志願者參軍。"
 PRC_strengthen_the_air_arsenal: "加強空軍裝備"
 PRC_strengthen_the_air_arsenal_desc: "為改進空軍，我們應基於過往經驗投資裝備改良。一次性投資提高機型可靠性，甚至能在長期節省替換成本。"
 PRC_destroyers: "鞍山級驅逐艦"
 PRC_destroyers_desc: "儘管艦艇已顯老舊，但獲取蘇聯剩餘的憤怒級驅逐艦依然能為我海軍奠基——而無需耗費多年時間建造更大型艦艇。我們還可在研究其性能後，對這些艦艇進行全面檢修與現代化改造。"
 PRC_submarines: "近海潛艇"
 PRC_submarines_desc: "在近海使用潛艇，是一種經濟高效且極具生存能力的方式，可以保護沿海基礎設施。儘管這類潛艇並非為深海作業設計，至少也是邁向更先進型號的一步。"
 PRC_cruisers: "綠水巡洋艦"
 PRC_cruisers_desc: "輕武裝但多用途的巡洋艦，例如基洛夫級，能夠保護近海安全。讓我們購入一些未完成的艦體，並完成建造。"
 PRC_capital_ships: "初試主力艦"
 PRC_capital_ships_desc: "我們掌握的[SOV.GetAdjective]喀琅施塔得級戰列巡洋艦的設計資料，可以作為擴充艦隊主力艦的良好基礎。這些設計非常先進，甚至連[SOV.GetAdjective]工業都難以完全實現，但對我們正在擴張的海軍而言，這樣的挑戰值得付出代價。"
 PRC_carriers: "遠程投射力量"
 PRC_carriers_desc: "航空母艦的發展將使我們能夠與主要海軍強國相抗衡。海軍所及之處皆可部署空中力量，這也將提升我們有效介入遠離本土的衝突的能力。"
 PRC_naval_guns: "提升海軍火力"
 PRC_naval_guns_desc: "我們為建造大型艦船打下的基礎，也將使我們能夠使用更大型的武器。這些武器使我們能夠對重型船體目標造成威脅，甚至在進入敵方射程和造成傷害範圍之前就對其發起攻擊。"
 PRC_naval_ocean_navy: "從綠水到藍海"
 PRC_naval_ocean_navy_desc: "我國的海軍改革應能使其在遠離補給基地的情況下仍可有效作戰，這將使我們能夠在敵軍尚未抵達鄰近海域時就實施遏制。"
 PRC_pilot_training: "建立飛行員學院"
 PRC_pilot_training_desc: "我們現有的幾位經驗豐富的飛行員不能冒險投入戰鬥，相反，他們應該被招募為教官，在我們空軍擴充時培訓新飛行員。"
 PRC_night_attack: "利用夜幕"
 PRC_night_attack_desc: "對我軍進行夜襲訓練，將能進一步發揮我們在非對稱作戰方面的經驗優勢。"
 PRC_reorganize_divisions: "改組師級單位"
 PRC_reorganize_divisions_desc: "為進一步實現軍隊現代化，我們應將剩餘的民兵整編為師級部隊，並確保現有各師兵力均衡。這將有助於建立清晰的指揮體系，進而更便於協調部隊行動。"
 PRC_rural_region_development_two: "擴大農村發展"
 PRC_rural_region_development_two_desc: "我們必須進一步投資農村地區的基礎設施建設，如學校和道路，以此支持農場現代化，這將有助於提高農村生產力。"
 PRC_urbanization_two: "廣泛推動城市化"
 PRC_urbanization_two_desc: "城市的擴張意味著我們現在可以承接更大規模的建設項目，以建造住房和創造就業機會。這能讓更多人遷入城市，工程建設期間也能持續創造工作崗位。"
 PRC_make_agrarian_to_urban_tt: "§Y$PRC_agrarian_reform$§!改為§Y$PRC_urban_society$§!，其效果為："
 PRC_found_the_academy_of_science: "創立科學院"
 PRC_reinforce_base_area: "強化新根據地"
 PRC_reinforce_base_area_desc: "為避免民族主義勢力再次對我們的基地發起攻勢，我們應考慮所有可行方案來加強防禦。"
 PRC_rebuild_28_bolshevik: "重建二十八個半布爾什維克"
 PRC_rebuild_28_bolshevik_desc: "新領導層所獲得的支持清楚表明了人民的信任。這種合法性將使我們更容易在國內外凝聚支持者。"
 PRC_bolshevik_world_revolution: "傳播世界革命"
 PRC_bolshevik_world_revolution_desc: "我們的革命勝利不應被國界所限制。我們必須幫助其他國家的無產階級。"
 PRC_bolshevik_urbanization: "城市革命"
 PRC_bolshevik_urbanization_desc: "雖然我們目前的權力基礎主要源自尋求改善生活質量的農村農民，但我們也必須將我們的理念傳達給城市居民，因為他們同樣面臨不平等問題。"
 PRC_embrace_stalinism: "擁抱斯大林主義"
 PRC_embrace_stalinism_desc: "隨著領導地位得到鞏固，我們可以開始更大程度地推行斯大林主義理念。進一步推進集體化與快速工業化應成為我們的核心國策。"
 PRC_embrace_stalinism_tt: "根據§Y$PRC_communist_power_struggle$§!當前數值，§Y$PRC_bolshevik_dominance$§!將獲得不同的修正效果。\n當前效果："
 PRC_bolshevik_aid: "[GetBolshevikAid]"
 PRC_bolshevik_aid_default: "蘇聯布爾什維克的援助"
 PRC_bolshevik_aid_alt: "接納布爾什維克流亡者"
 PRC_bolshevik_aid_desc: "蘇聯布爾什維克在革命戰爭方面經驗豐富，或許也願意為我們的事業提供資金支持。"
 PRC_party_control: "鞏固黨內控制權"
 PRC_party_control_desc: "我們領導層的成功應使使我們能夠進一步掌控中國共產黨。"
 PRC_invite_pavel_mif: "邀請帕維爾·米夫"
 PRC_invite_pavel_mif_desc: "帕維爾·米夫是二十八個半布爾什維克共同的導師，應該邀請他為我們的政府提供建議，這也能加強我們與[SOV.GetNameDef]的聯繫。"
 PRC_invite_otto_braun: "恢復李德職務"
 PRC_invite_otto_braun_desc: "$PRC_otto_braun$與$PRC_bo_gu$是1934年第五次反圍剿的主要軍事指揮官，誠然，這次反圍剿以失敗告終，李德也因此在長征期間被邊緣化。不過，我們的新領導層認為這不是$PRC_otto_braun$本人的過錯，並尋求恢復他的職務。"
 PRC_invite_soviet_general: "邀請蘇聯將領"
 PRC_invite_soviet_general_desc: "$SOV_vasily_chuykov$和$SOV_aleksandr_cherepanov$在俄國內戰以及擔任[CHI.GetNameDef]軍事顧問期間所積累的豐富經驗，將為我軍提供寶貴的增益。"
 PRC_invite_soviet_general_tt: "§Y$SOV_vasily_chuykov$§!和§Y$SOV_aleksandr_cherepanov$§!成為陸軍將領"
 PRC_bolshevik_urbanization_2: "進一步推動城市化"
 PRC_bolshevik_urbanization_2_desc: "在城市創造就業機會以吸引農村人口遷入，不僅有利於我們的經濟發展，也將增強我們在對革命持懷疑態度的城市中的影響力。"
 PRC_bolshevik_urban_industrialization: "城鎮工業化"
 PRC_bolshevik_urban_industrialization_desc: "我們必須對城市進行投資，以促進重工業的形成發展。"
 PRC_bolshevik_urbanization_completed: "無產階級工人，聯合起來！"
 PRC_bolshevik_urbanization_completed_desc: "我們在城市化地區的投資已成功提升了我們在當地的影響力。現在，我們可以期待農村和城市的共產主義組織之間開展更緊密的合作。"
 PRC_join_comintern: "加入共產國際"
 PRC_join_comintern_desc: "在共產黨領導下，國家的權力越來越集中，現在我們可以申請作為一個可靠的盟友加入共產國際。"
 PRC_rebuild_28_bolshevik_tt: "所有§Y二十八個半布爾什維克§!成員：\n提高其特質的效果"
 PRC_rebuild_28_bolshevik_effect_tt: "失去§Y$PRC_28_bolshevik_trait$§!並獲得§Y$PRC_28_bolshevik_trait_improved$§!。\n§Y效果變化：§!\n每日政治點數獲取：§G+0.12§!\n穩定度：§G+5.00%§!\n相同意識形態每月評價：§G+5.00%§!" ## Make sure match values in trait file TODO_ML, change to variables
 PRC_agricultural_reform_boom: "農業自由"
 PRC_agricultural_reform_boom_desc: "我們必須為農民提供安全保障，讓他們能夠安心生產國家所需的糧食作物。"
 PRC_he_long_second_army: "賀龍與紅二軍團"
 PRC_he_long_second_army_desc: "賀龍的軍隊基本完好無損，這意味著我們擁有了一支新的主力部隊來保衛[ROOT.capital.GetName]。他在躲避國民黨軍隊追剿方面的經驗亦應為我們所用。"
 PRC_rural_survey: "農村調查"
 PRC_rural_survey_desc: "對農村地區的人口和生產情況進行摸底調查，將有助於我們後續經濟計劃的順利實施，對必要時需實施的徵兵亦有實用價值。"
 PRC_lessons_learnt: "吸取教訓"
 PRC_lessons_learnt_desc: "我們在長征期間積累的經驗，如今應該用於優化我軍軍事理論與訓練中的各項進步。"
