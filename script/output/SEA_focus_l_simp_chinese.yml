 ############
 SIK_six_great_policies: "六大政策"
 SIK_six_great_policies_desc: "通過人民反帝協會推動的六大政策——反帝、親蘇、民族平等、清廉政府、和平、建設——構成了盛世才在新疆派系統治的基礎。憑藉這些政策，我們將確保省份繁榮，避免倒退至封建統治。"
 SIK_invest_in_the_dushanzi_oil_fields: "投資獨山子油田"
 SIK_invest_in_the_dushanzi_oil_fields_desc: "獨山子地區的石油發現於世紀之交，到1909年我們已啟動初步開採。隨著近期蘇聯的投資，這一領域具備了進一步擴大生產的潛力。我們應加大對這項蘇新合作項目的投入，擴建煉油廠，這對我們和蘇聯的戰爭努力都至關重要。"
 SIK_three_year_plan_for_reconstruction: "三年重建計劃"
 SIK_three_year_plan_for_reconstruction_desc: "為鞏固統治並避免進一步動盪，我們必須在蘇聯支持下啟動三年重建計劃。通過貸款雖會暫時受制於蘇聯，但從長遠看將確保經濟繁榮並最終實現獨立。"
 SIK_a_new_xinjiang: "新的新疆"
 SIK_a_new_xinjiang_desc: "如今我們的工業已經現代化，我們的人民也學會了閱讀，我們省已經準備好在通往未來的道路上邁出下一步。現在，我們將開始一項將新疆及其人民與現代世界融合的大型項目，準備在全球舞臺上佔有一席之地！"
 SIK_transformation_of_nature: "改造自然"
 SIK_transformation_of_nature_desc: "亞洲富含尚未開發的自然資源。在科學界不斷突破認知極限的推動下，即使是最大、最具侵入性的工程項目也變得可行。必須在大規模上改造自然環境，使其為人民服務！"
 SIK_soviet_intervention: "蘇聯直接干預"
 SIK_soviet_intervention_desc: "盛世才在不同陣營間搖擺不定、反覆無常，已證明不可信賴。因此，我們必須換上一個值得信任的人來統治新疆，確保其治理方向不偏離黨的路線。"
 SIK_protector_of_the_kyrgiz: "吉爾吉斯的保護者"
 SIK_protector_of_the_kyrgiz_desc: "蘇聯邊境另一側的吉爾吉斯人民渴望有一位理解他們的人來領導。[ROOT.GetLeader]與他們同根同源，熟知他們的習俗。我們應當向[SOV.GetLeader]提出請求，實現與該省份的合併。"
 SIK_ensure_a_clean_government: "確保廉潔政府"
 SIK_ensure_a_clean_government_desc: "六大政策之一要求政府不僅要擺脫腐敗，同時還要杜絕叛亂。我們必須不惜一切代價確保政府的穩定，利用蘇聯內務人民委員會的幫助，清除所有可能威脅[ROOT.GetLeader]統治的人！"
 SIK_a_new_nationality_policy: "新的民族政策"
 SIK_a_new_nationality_policy_desc: "我們應當採納蘇聯的民族政策，也即不由一個群體主導一切，而是讓多個群體和諧共處。為此，漢族必須學習讀寫維吾爾語，反之亦然。我們還會在官方政府機構中推行無神論，但允許民眾自由信仰宗教，以此實現省份更加穩定與統一。"
 SIK_settle_dzungarian_tribes: "定居準噶爾部落"
 SIK_settle_dzungarian_tribes_desc: "我們收到了準噶爾部落的酋長和首領們希望在我國境內定居的請求，因為他們無法享受到我們豐收的成果。我們應該滿足他們的願望。"
 SIK_king_of_sinkiang: "新疆王"
 SIK_king_of_sinkiang_desc: "盛世才是新疆派系無可爭議的領導者，甚至有人稱其為新疆王。然而，該省正處在十字路口，一些人希望追隨中央政府，另一些人則想繼續沿著蘇聯的路線前進。無論這位“新疆王”作何決斷，都將決定新疆及其人民的未來，但目前其走向尚不明朗。"
 SIK_rejoin_the_central_government: "重新加入中央政府"
 SIK_rejoin_the_central_government_desc: "蘇聯並不像我們曾經認為的那樣可靠。看來最佳選擇是押注勝算更大的一方，轉而重新加入國民黨並迅速與中央政府整合。"
 SIK_reestablish_the_guominjun: "重建國民軍"
 SIK_reestablish_the_guominjun_desc: "國民軍是馮玉祥於1920年代創立的軍事派系。該組織信奉民族主義、反帝主義及基督教社會主義，若想在內戰中成為第三方力量，復興這一組織似乎是最佳選擇。更何況盛世才當年最終加入的正是國民軍，其忠誠從未歸屬於國民黨。"
 SIK_reaffirm_soviet_connections: "重申蘇聯關係"
 SIK_reaffirm_soviet_connections_desc: "中央政府辜負了中國，這一點正日益明朗。我們應徹底切斷與他們的聯繫，加入[SOV.GetNameDef]反對封建主義的鬥爭。"
 SIK_utilize_asperovs_contacts: "利用阿普列索夫的人脈"
 SIK_utilize_asperovs_contacts_desc: "加列金·阿普列索夫是蘇聯駐烏魯木齊的特別授權總領事，也是蘇聯人民外交委員部第二遠東司的代表，他在[SOV.GetNameDef]內部擁有重要人脈。我們應藉助他的權勢與關係，從與[SOV.GetAdjective]的合作中獲取更多利益。"
 SIK_office_of_sinkiang_border_commissioner: "新疆邊防督辦公署"
 SIK_office_of_sinkiang_border_commissioner_desc: "新疆邊防督辦公署是負責指揮地方駐軍的機構。這一自治體制使我們能加強省政府權力，幾乎可以隨時獨立於中央政府行事。"
 SIK_cooperate_with_the_nkvd: "與內務人民委員部合作"
 SIK_cooperate_with_the_nkvd_desc: "為了加強我們與[SOV.GetNameDef]的關係，同時鞏固我們的統治並保護烏魯木齊免受外國陰謀者的侵害，我們必須與內務人民委員部合作，協助他們在我國境內建立適當的存在。"
 SIK_cooperate_with_the_ussr: "與蘇聯合作"
 SIK_cooperate_with_the_ussr_desc: "我們與蘇聯的關係在中國境內獨一無二，為了確保領土完整，我們必須利用這一點。有了他們的援助，我們也許終於可以將國民黨趕出我們的省份。"
 SIK_military_cooperation: "軍事合作"
 SIK_military_cooperation_desc: "國民黨仍在和闐部署大量部隊，主要為新編第三十六師。為了確保趕走他們，我們應請求蘇聯的援助。"
 SIK_a_soviet_airforce: "蘇式空軍"
 SIK_a_soviet_airforce_desc: "得益於我們與[SOV.GetNameDef]日益增進的關係，我們將能夠從他們那裡獲取飛機。此外，他們還準備在烏魯木齊建立飛行員學校，並已開始派遣顧問來幫助我們為未來的戰爭做準備。"
 SIK_march_into_khotan: "進軍和闐"
 SIK_march_into_khotan_desc: "時機已到！很快整個新疆將歸於我方統治，馬虎山的部隊也將被驅逐！"
 we_will_play_as_kum_tt: "我們將扮演[KUM.GetFlag]§Y[KUM.GetNameDef]§!繼續遊戲！"
 SIK_march_into_khotan_tt: "屆時，來自§Y[SOV.GetNameDef]§!的§Y額外補給§!將送達"
 SIK_a_united_sinkiang_clique: "統一的新疆軍閥"
 SIK_a_united_sinkiang_clique_desc: "隨著新三十六師被驅逐，新疆完全歸於我方之下，我們在這一地區已成為一股不可小覷的力量。我們必須將目光投向東方，確保盟友和同志的領土完整，以抵禦日本侵略者。"
 SIK_pursue_further_soviet_integration: "尋求與蘇聯的進一步整合"
 SIK_pursue_further_soviet_integration_desc: "戰鬥結束、塵埃落定，我們必須關注其他威脅。在蘇聯的保護之下，我們將不再面臨中央政府吞併的威脅，因此這是最理智的選擇。"
 SIK_establish_the_xinjiangneft: "成立新疆石油公司"
 SIK_establish_the_xinjiangneft_desc: "[SOV.GetAdjective]政治局已討論新疆石油問題，並通過一項決議，呼籲在[SOV.GetAdjective]邊境附近，由我方政府主導籌備油田開發。為此，將成立“新疆石油公司”作為新疆與蘇聯的合資企業，以促進該地區自然資源的共同開採。"
 SIK_established_the_xinjiangneft_flag: "已成立新疆石油公司"
 KHM_call_for_aid: "呼籲援助"
 KHM_call_for_aid_desc: "盛世才的部隊已兵臨城下，我們必須向同胞呼救，否則就將崩潰。"
 KHM_strike_the_governor: "打擊督辦"
 KHM_strike_the_governor_desc: "我軍已整裝待發，士氣高昂，我們必須抓住機會，將這個蘇聯傀儡逐出我省！"
 KHM_push_them_back: "擊退他們"
 KHM_push_them_back_desc: "新疆的戰鬥不能以他們的勝利告終，我們要把他們一路逼回蘇聯境內！"
 KHM_the_sinkiang_ma_clique: "新疆馬家軍"
 KHM_the_sinkiang_ma_clique_desc: "隨著盛世才及其新疆軍閥被擊敗，我們如今是全省唯一的統治者。我們必須鞏固地位，成為這一地區更強大的力量。"
 KHM_kumul_rebellion_avenged: "哈密起義的復仇"
 KHM_kumul_rebellion_avenged_desc: "隨著盛世才及其新疆軍閥被擊敗，我們如今是全省唯一的統治者。那場遭受不公鎮壓的第一次哈密起義，此刻終於昭雪復仇。現在，我們可以將目光轉向重建該省，並擴充我們的常備軍力，以確保我們的獨立地位得以延續。"
 KHM_utilize_family_contacts: "利用家族關係"
 KHM_utilize_family_contacts_desc: "我們必須利用與其他馬家軍派系的緊密聯繫，將盛世才徹底逐出新疆。"
 KHM_undermine_kmt_rule: "動搖國民黨統治"
 KHM_undermine_kmt_rule_desc: "國民黨盤踞該省，掠奪和壓迫當地百姓已久。是時候準備將專橫的馬家勢力趕出和闐了！"
 KHM_establish_the_kashgar_clique: "建立喀什軍閥"
 KHM_establish_the_kashgar_clique_desc: "我們此前已尋求與國民黨保持距離。若要真正做到這一點，我們必須效仿馬家，建立我們自己的派系。現在是時候將其付諸實現，在喀什地區副軍事指揮官麻木提的麾下集結力量。"
 KHM_shizangs_coup: "麻木提奪權"
 KHM_shizangs_coup_desc: "隨著準備工作就緒，麻木提掌控下的第24和第25維吾爾軍團正前往包圍和闐，我們可開始行動，將回族的領導層逐出此城。麻木提師長威名遠揚，和闐埃米爾國萬歲！"
 KHM_shizangs_coup_tt: "許多§Y馬家軍將領§!將§R離開§!並加入其他馬家軍派系"
 KHM_take_control_of_zakat_and_waqf: "掌控天課與瓦合甫"
 KHM_take_control_of_zakat_and_waqf_desc: "為了資助我們的新政權，我們或許需要變通一些規則，接管和田的天課與宗教基金，將本地聖所的財富轉向教科書、治安、士兵和教師。"
 KHM_implement_jizyah: "徵收吉茲亞稅"
 KHM_implement_jizyah_desc: "在舊政權統治下，非穆斯林的權利被施加了諸多限制。現在是時候根據現代標準調整這些政策，向所有臣民證明我們是個開明的國家。"
 KHM_promote_jadidism: "推廣扎吉德主義"
 KHM_promote_jadidism_desc: "在[SOV.GetNameDef]，屬於扎吉德主義的伊斯蘭現代主義者與改革派正遭到政府積極打壓。鑑於布格拉本人就是一位活躍的扎吉德主義者，允許他們在我國尋求庇護，同時接納其部分改革理念，將是明智之舉。"
 KHM_revive_the_basmachi_movement: "復興巴斯瑪奇運動"
 KHM_revive_the_basmachi_movement_desc: "直到1934年，巴斯瑪奇運動仍在與[SOV.GetAdjective]軍隊作戰，試圖將中亞從他們的暴政統治中解放出來。儘管他們的運動後來基本被鎮壓，但部分領導人還是設法逃脫了。我們應當努力與這些自由戰士取得聯繫，並邀請他們加入我們。"
 KHM_rally_the_faithful: "召集信士"
 KHM_rally_the_faithful_desc: "為了確保我國不受外國干涉而獨立自主，我們必須團結信徒，在首都建立新的軍事教團。"
 KHM_indian_expeditionary_forces_plan: "印裔遠征軍計劃"
 KHM_indian_expeditionary_forces_plan_desc: "[ENG.GetAdjective]提議制定一項計劃，若我們遭敵軍攻擊，將由[RAJ.GetNameDef]向我們提供軍事援助。或許與他們建立更緊密的關係是明智之舉。"
 KHM_expand_the_madrasas: "擴建經學院"
 KHM_expand_the_madrasas_desc: "為了更好地管控我國民眾並教導他們應遵循的生活方式，我們應增加對國內穆斯林教育機構的資金投入。"
 KHM_promote_anti_communism: "推行反共政策"
 KHM_promote_anti_communism_desc: "將盛世才及其赤化團伙驅逐出境是當務之急，否則我們將落入蘇維埃共和國之手。因此必須將殘存的共產黨勢力從我國領土上徹底清除。"
 KHM_raise_additional_dungan_regiments: "擴編東干人部隊"
 KHM_raise_additional_dungan_regiments_desc: "軍隊在很大程度上仍由回民組成，這些士兵宣誓對其指揮官絕對效忠。儘管這種狀況並非理想，但我們仍需善加利用，因為在未來數年內，他們將會發揮極為重要的作用。"
 KHM_indian_expeditionary_forces_plan_tt: "§Y[ENG.GetNameDefCap]§!和§Y[RAJ.GetNameDef]§!將更可能向我們派遣志願軍"
 KHM_our_position_remains: "我們保住了地位"
 KHM_our_position_remains_desc: "戰爭的進展也許並非完全有利於我們，但和闐軍閥依然存在，新三十六師也為迎接即將到來的衝突做好了比以往更加充分的準備。"
 CHI_sea_gain_warlord_support: "爭取軍閥支持"
 CHI_sea_gain_warlord_support_desc: "要想被視為中國的合法統治者，我們必須先獲得其他軍閥的支持。"
 CHI_allow_warlord_support_tt: "解鎖決議，以對軍閥有利的條件換取陣營影響力"
 CHI_sea_propaganda_campaigns: "宣傳活動"
 CHI_sea_propaganda_campaigns_desc: "我們可以通過高效的宣傳從中央政府那裡搶走聚光燈，很快燈光就會落到我們身上。"
 CHI_propaganda_decisions_tt: "解鎖決議，通過宣傳活動獲得陣營影響力"
 CHI_sea_unified_army_structure: "統一軍隊架構"
 CHI_sea_unified_army_structure_desc: "要想有效抵禦內外威脅，我們必須改革軍隊，使其成為一支職業部隊。在共產黨顧問的幫助下，我們將能夠建立自己的紅軍，從而更好地抵禦來自外部的威脅。"
 CHI_sea_battle_for_china: "中國之戰"
 CHI_sea_battle_for_china_desc: "隨著中央政府越來越偏離正確的路線，越來越明顯的事實是，唯一的出路就是奪回控制權。我們必須一路戰鬥到首都，從這個失敗的國家手中奪取政權。"
 CHI_sea_rally_the_warlords: "集結軍閥"
 CHI_sea_rally_the_warlords_desc: "軍閥是中國權力鬥爭的重要部分。有他們站在我們這邊，控制局面會容易得多。"
 CHI_sea_a_new_expedition: "新遠征"
 CHI_sea_a_new_expedition_desc: "中央政府日益衰弱，我們必須銘記北伐的遺產並奪取各大首都。在它們歸於我們統治之後，只是時間問題，世人便會承認我們才是中國的合法政權。"
 PRC_sea_inward_focus: "獨立自主"
 PRC_sea_inward_focus_desc: "前進的道路並不在於一味跟隨蘇聯路線。我們必須證明獨立於他們，走出自己的道路，確保革命成功。"
 PRC_sea_rally_the_industry: "團結工人"
 PRC_sea_rally_the_industry_desc: "沒有團結的工人階級與提供革命所需的工業基礎，我們的事業只會逐漸消亡。因此，務必將他們爭取到我們一邊。"
 PRC_sea_reforming_our_ranks: "整編隊伍"
 PRC_sea_reforming_our_ranks_desc: "為了確保革命成功，我們必須整編隊伍，並動員農村階級。沒有他們的幫助，我們將無法組建一支真正的軍隊；但若能爭取他們，我們就能在對手面前獲得優勢。"
 PRC_sea_forging_our_own_path: "開闢自主道路"
 PRC_sea_forging_our_own_path_desc: "事實越來越清楚，共產國際辜負了中國的革命者，我們必須建立自己的聯盟。通過此舉，我們在中國以外的地區確立我們的權威也將只是時間問題。"
 PRC_sea_toe_the_soviet_line: "緊跟蘇聯路線"
 PRC_sea_toe_the_soviet_line_desc: "現在已十分明確，只有依靠蘇聯援助，中國革命才能成功。儘管黨內許多人持有不同意見，但孰對孰錯只有時間能證明。"
 PRC_sea_aid_from_soviet_bolsheviks: "來自蘇聯布爾什維克的援助"
 PRC_sea_aid_from_soviet_bolsheviks_desc: "要讓革命取得成功，我們必須有工業基礎來支撐。在蘇聯投資者的援助下，我們將能夠啟動屬於我們自己的工業。"
 PRC_sea_soviet_advisors: "蘇聯顧問"
 PRC_sea_soviet_advisors_desc: "蘇聯有幾名特工在中國活動。要想打敗國民政府，我們必須招募他們並利用他們的專業知識。"
 PRC_sea_industrialisation_of_nature: "自然的工業化"
 PRC_sea_industrialisation_of_nature_desc: "為了確保社會主義的條件，首先必須擁有產業工人階級。在蘇聯的援助下，我們將能更快地獲得這些條件。"
 PRC_sea_comintern_integration: "融入共產國際"
 PRC_sea_comintern_integration_desc: "條件已然成熟，現在是全面融入共產國際的時候了。"
 PRC_sea_new_economic_direction: "新經濟方向"
 PRC_sea_new_economic_direction_desc: "人民共和國成立後，是時候調整經濟的重心和結構了。通過周密計劃，我們將能夠及時趕超西方經濟體，成為不可忽視的力量。"
 PRC_sea_move_capital: "遷都"
 PRC_sea_move_capital_desc: "$PRC_proclaimed_communism$成立後，我們自然應該遷都並將這座城市的名稱恢復為北京。"
 china_communist_warlord_focus: "中共國策樹"
 china_nationalist_warlord_focus: "國民政府國策樹"
 CHI_sea_develop_capital: "發展[ROOT.Capital.GetName]"
 CHI_sea_develop_capital_desc: "沒有工業基礎，我們永遠無法維持我們的位置。因此，我們必須投資於首都。"
 CHI_sea_further_industrial_investment: "進一步工業投資"
 CHI_sea_further_industrial_investment_desc: "我們的工業仍然無法與中央政府相匹敵。因此，我們必須進一步投資於我們的工業。"
 CHI_sea_develop_capital_arsenal: "擴建[ROOT.Capital.GetName]兵工廠"
 CHI_sea_develop_capital_arsenal_desc: "沒有兵工廠就沒有軍隊，沒有軍隊就沒有國家。因此，為了確保我們的生存，我們必須增強工業實力。"
 CHI_sea_small_arms_production: "輕武器生產"
 CHI_sea_small_arms_production_desc: "輕武器是我們軍工業的支柱。沒有輕武器，我們的軍隊將毫無用處，我們的國家將難以承受任何壓力。從邏輯上講，我們應該進一步投資這一領域。"
 CHI_sea_industrial_research_projects: "工業研究項目"
 CHI_sea_industrial_research_projects_desc: "如果沒有現代工業，我們將落後於世界，也很快被中央政府超越。資助現代工藝與機械的研究將幫助我們使工業水平保持與世界同步。"
 CHI_sea_expand_public_education: "加強公共教育"
 CHI_sea_expand_public_education_desc: "沒有全民享有教育的條件，我們只會落後於其他國家。為了保障國家的繁榮，我們必須投資公共教育。"
 CHI_sea_fund_research_projects: "資助科研計劃"
 CHI_sea_fund_research_projects_desc: "要保持對敵手的優勢，關鍵是要掌握並運用最新的技術進步。通過資助科研項目，我們既能做到這一點，也能造福國民。"
 CHI_sea_rely_on_our_infantry: "依靠步兵"
 CHI_sea_rely_on_our_infantry_desc: "以步兵為核心的軍隊迄今未曾讓我們失望，也絕不會。邏輯上講，我們理應進一步投入其中，以在未來對抗任何潛在敵人時佔據優勢。"
 CHI_sea_modern_warfare: "現代戰爭"
 CHI_sea_modern_warfare_desc: "未來戰爭的關鍵不在於我們目前以步兵為主的部隊。為了避免被敵人迂迴包抄、一句殲滅，我們必須投資研發新技術。"
 CHI_sea_consolidate_our_rule: "鞏固我方統治"
 CHI_sea_consolidate_our_rule_desc: "雖然我們名義上掌控著本省，但仍有部分我們統治權威薄弱的地區。我們應嘗試與這些地區接觸，確保當地民眾知曉管轄者身份。"
 CHI_sea_fortification_efforts: "重視防禦工事"
 CHI_sea_fortification_efforts_desc: "雖然我們目前的地位尚且穩固，但或許未來會有需要我們戰至最後一兵一卒來捍衛邊境的時刻。因此，顯然我們必須加固防線，做好防禦的準備。"
 CHI_sea_infantry_efforts: "重視步兵"
 CHI_sea_infantry_efforts_desc: "步兵是我們軍隊的支柱。通過改進訓練方法和標準，我們將能夠確保他們在實戰中表現更佳。"
 CHI_sea_brigade_specialization: "旅級單位專業化"
 CHI_sea_brigade_specialization_desc: "儘管擁有一支適應大多數作戰任務的軍隊是戰勝入侵者的根本，但我們也必須在某些方面著重部隊的專業化發展。"
 CHI_sea_the_army: "[ROOT.GetAdjective]軍隊"
 CHI_sea_the_army_desc: "隨著軍隊改革完成，我們終於可以自豪地宣稱，我們已不再只是某個軍閥與其部隊，而是真正的指揮官與軍隊，隨時準備迎擊任何威脅。"
 CHI_crackdown_on_looting: "嚴打民生掠奪行為"
 CHI_crackdown_on_looting_desc: "為了讓我們的省份得以正常發展，我們必須制止士兵們不斷掠奪當地民眾食物和工具的行為，並確保政府能夠根據需要執行法律和伸張正義，以維護和平。"
 XSM_the_military_governor: "軍政長官"
 XSM_the_military_governor_desc: "雖然青海名義上的統治者是文職總督馬麟，但軍政長官、也是馬麟侄子的馬步芳，早已圖謀全面掌控該省。他是否能成功驅逐叔父尚未可知，但通過一些運作，這一切完全可能。"
 XSM_a_hui_army: "回族軍隊"
 XSM_a_hui_army_desc: "由馬步芳統領的軍隊，主要由對其絕對效忠的回族人組成。如果馬步芳必須通過軍事手段奪取權力，他們將極為有用。"
 XSM_sway_the_people: "爭取民心"
 XSM_sway_the_people_desc: "雖然軍隊牢牢站在馬步芳一邊，但百姓似乎更偏愛馬麟。試圖爭取他們至關重要，但除非發生重大變故，否則他們依然會留在馬麟陣營中。"
 XSM_sweep_out_communists: "清除共產黨人"
 XSM_sweep_out_communists_desc: "如果我們不想落入蘇維埃共和國之手，驅逐張國燾及其共產黨人集團就是首要任務。因此我們必須將殘餘的共產黨人徹底清除出我們的領地。"
 XSM_send_ma_lin_on_hajj: "送馬麟去麥加朝覲"
 XSM_send_ma_lin_on_hajj_desc: "馬麟心知時日已盡，但無緣無故將其罷黜仍會激怒百姓。因此，我們應當以“前往麥加朝覲”為名，迫使他辭去職務。"
 XSM_the_civilian_governor_remains: "省主席繼續留任"
 XSM_the_civilian_governor_remains_desc: "雖然馬步芳想要完全掌控局勢，但越來越明顯的是，如果強行推進，將有引發全面民變的風險。然而，馬麟提出了妥協方案，即雙方名義上共同執政，由他退居象徵性的領袖地位，而大多數事務則由馬步芳事實掌控。"
 XSM_solidifying_control: "鞏固統治"
 XSM_solidifying_control_desc: "既然內部紛爭已結束，現在就該在青海鞏固我們的統治，以避免任何來自內外的進一步動盪。"
 XSM_sideline_family_conflicts: "擱置家族紛爭"
 XSM_sideline_family_conflicts_desc: "馬家規模龐大且掌控著廣闊的領地。理論上，這意味著如果能夠團結一致，就能在該地區形成一股強大的力量。但現實是家族中充斥著紛爭與矛盾。若要真正團結，我們必須首先解決這些內鬥。"
 XSM_strengthening_our_position: "強化我們的地位"
 XSM_strengthening_our_position_desc: "若要實現團結，我們必須擁有一支戰鬥力量。潛在的武裝衝突可能隨時爆發，而我們的軍隊規模仍然遠不足以開展任何大規模行動。"
 XSM_demand_submission: "要求臣服"
 XSM_demand_submission_desc: "如有可能，我們應儘量避免衝突。正確的做法是先宣佈意圖，給對方一個投降的機會，然後再採取行動。"
 XSM_strike_at_the_detractors: "打擊叛逆"
 XSM_strike_at_the_detractors_desc: "家族中的其他成員不可輕信，提前表明意圖只會讓他們有時間做準備。我們必須先發制人，然後再提條件。"
 XSM_a_united_ma_state: "統一的馬家政權"
 XSM_a_united_ma_state_desc: "如今，全家族已在一面旗幟下團結一致，我們已成為一股不可忽視的力量，無論是在地方還是國際舞臺上。馬家軍閥將延續千年！"
 XSM_a_united_ma_state_tt: "我們將§Y吞併§!我們所有的馬家軍閥附庸並§Y獲得核心§!，並且我們將獲得他們的§Y將領§!"
 XSM_ma_qis_natural_successor: "馬麒理所當然的繼承人"
 XSM_ma_qis_natural_successor_desc: "儘管前省長馬麒之子馬步芳是位傑出的軍事戰略家且對權力極度渴望，但他並不適合統治該省。相反，前省長的兄弟馬麟則更有資格執政，他會將改革推行到底。"
 XSM_recruit_salar_officers: "招募撒拉族軍官"
 XSM_recruit_salar_officers_desc: "青海省的撒拉族在戰爭技藝方面展現出潛力。軍官將被派往循化縣，以發掘有前途的新領導者，並確保他們獲得適當的軍事訓練。"
 XSM_rebuild_the_ninghai_army: "重建寧海軍"
 XSM_rebuild_the_ninghai_army_desc: "為了再次恢復我們南方各省的秩序並鞏固邊境，我們必須重建寧海軍。通過此舉，我們應該能在與藏族的衝突中佔據優勢。"
 XSM_rebuilt_the_ninghai_army_flag: "重建了§Y寧海軍§!"
 KHM_established_the_kashgar_clique_flag: "建立了§Y喀什噶爾政權§!"
 KUM_victory_in_tihwa: "迪化大捷"
 KUM_victory_in_tihwa_desc: "隨著[617.GetName]的陷落，我們在全省的統治已堅如磐石。今日凱歌高奏，願大汗萬壽無疆！"
 KUM_restore_yettishar: "重建哲德沙爾"
 KUM_restore_yettishar_desc: "我們已完全掌控新疆省全境，現在應當致力於實現阿古柏的抱負，將西北各省的回民之地統一起來。"
 MAN_tsr_expand_the_navy: "擴建滿洲國帝國海軍"
 MAN_tsr_expand_the_navy_desc: "雖然我們仍必須依賴日本在海上的支持，但投資建設一支超越江河艦隊的力量是明智的。在旗艦“海威”號的率領下，並在與盟友的密切合作下，我們將能夠抵禦任何來自海上的入侵或襲擾企圖。"
 MAN_tsr_mangyo_tt: "§Y$MAN_showa_steel_works$§!與§Y$MAN_south_manchuria_railway_company$§!將合併為§Y滿洲產業開發公司§!"
 MAN_tsr_embrace_state_shintoism_tt: "解鎖決議改進§Y$MAN_state_shintoism_dm$§!民族精神"
 MAN_tsr_promote_manchu_identity_tt: "解鎖§Y$MAN_incoporate_manchu_nationalism_decision$§!"
 MAN_tsr_strengthen_ties_with_nissan: "加強與日產的聯繫"
 MAN_tsr_strengthen_ties_with_nissan_desc: "日產是我們軍事與民用工業的重要夥伴。我們應當尋求更緊密的關係，以確保兩大部門能夠輕鬆維持並擴展。"
 MAN_tsr_mangyo: "滿業"
 MAN_tsr_mangyo_desc: "滿洲產業開發公司，簡稱“滿業”，是日產財閥創始人鯰川義介與政府合作的努力，旨在進一步保障滿洲的經濟繁榮。其方式是發展特定的戰略產業，並逐漸擴展到其他領域。"
 MAN_tsr_obedience: "強化滿洲協和會"
 MAN_tsr_obedience_desc: "有人稱我們不過是日本的傀儡，但他們根本誤解了我們與協和會的密切和平等關係。違背恩主，如同孩童忤逆父母。"
 MAN_tsr_trading_illicit_goods: "交易違禁商品"
 MAN_tsr_trading_illicit_goods_desc: "雖然非法貿易不是我國的主要收入來源，但它帶來了鉅額利潤。貿然關閉它無疑是愚蠢的，但若放任不管，也可能對滿洲與中國社會帶來嚴重後果。"
 MAN_tsr_social_research_unit: "研究合作社"
 MAN_tsr_social_research_unit_desc: "合作社是活躍於日本與滿洲的農業合作社組織。我們應當研究其成功的原因，以便在其他環境中加以應用。"
 MAN_tsr_further_mobilization: "動員行動"
 MAN_tsr_further_mobilization_desc: "沒有士兵，我們就沒有軍隊。我們必須推動進一步的動員與訓練，這樣才能組建一支不容忽視的軍隊。"
 MAN_tsr_strengthen_the_manchukuo_imperial_army: "強化滿洲帝國陸軍"
 MAN_tsr_strengthen_the_manchukuo_imperial_army_desc: "我們需要一支強大的軍隊來擊敗敵人並維持獨立。過度依賴關東軍最終只會導致我們的滅亡。若要建立一個自由的滿洲國，我們必須首先擁有屬於自己的軍隊。"
 MAN_tsr_expand_xingan_army: "擴編興安軍"
 MAN_tsr_expand_xingan_army_desc: "興安軍是我軍中的一支重要力量。若要在未來的戰鬥中取得成功，擴編興安軍將是明智之舉。"
 MAN_tsr_request_dalian: "要求交還大連"
 MAN_tsr_request_dalian_desc: "日本目前佔據著位於遼東半島盡頭的滿洲港口城市大連，作為關東租借地的一部分。但我們應當設法說服他們將其移交給我們的政府，因為對他們來說差別不大，而對我們來說則意義重大。"
 MAN_tsr_the_question_of_leadership: "領導權問題"
 MAN_tsr_the_question_of_leadership_desc: "目前我們名義上由總理張景惠執政，而溥儀只是掛名皇帝。但這一切當然可能改變。如果關東軍認為有必要，他們可以將權力重新交還皇帝，甚至另立新帝，將溥儀徹底邊緣化。"
 MAN_tsr_empire_of_manchukuo: "滿洲帝國"
 MAN_tsr_empire_of_manchukuo_desc: "滿洲國，或其正式名稱“大滿洲帝國”，並非世界強權，但我們已在東亞格局中開闢出自己的一席之地。我們應當努力維持這一角色，不要陷入虛假的財富與榮耀幻想，而是找到屬於自己的定位。"
 MAN_tsr_embrace_state_shintoism: "推行國家神道"
 MAN_tsr_embrace_state_shintoism_desc: "國家神道在日本帝國中發揮了極大作用，動員了數百萬民眾。我們應當在自己的領土上進行效仿，即使一開始可能會遇到阻力。"
 MAN_tsr_work_with_the_kempeitai: "與憲兵隊合作"
 MAN_tsr_work_with_the_kempeitai_desc: "日本憲兵隊在滿洲十分活躍，他們致力於打擊土匪與反抗者。然而，由於與我方溝通不暢以及對土地缺乏瞭解，他們面臨巨大困難。我們應當與他們合作，打造一支更高效的部隊。"
 MAN_tsr_promote_manchu_identity: "弘揚滿洲身份"
 MAN_tsr_promote_manchu_identity_desc: "滿洲人民不只是另一個“中國民族”。我們應當強調他們與這片土地的聯繫，鼓勵滿洲民族主義，以此與中國其他地區區分開來。如此一來，我們能更容易維持獨立，同時與亞洲其他強國建立更緊密的聯繫。"
 MAN_tsr_claim_outer_manchuria: "收復外滿洲"
 MAN_tsr_claim_outer_manchuria_desc: "外滿洲被俄國佔據至今仍是滿洲民族主義者心中的刺。我們應當尋求糾正這一歷史錯誤，收復並重新整合這些領土，使其迴歸新生的滿洲國。"
 MAN_tsr_reclaim_our_lost_possessions: "收復我方失地"
 MAN_tsr_reclaim_our_lost_possessions_desc: "在《璦琿條約》和《北京條約》中丟失的外滿洲，以及蘇聯強佔的蒙古，至今仍是我們心中的創痛。我們必須扭轉這一歷史錯誤，徹底終結蘇維埃帝國！"
 MAN_tsr_reclaim_our_lost_possessions_tt: "解鎖整合§Y外滿洲§!、[MON.GetFlag]§Y[MON.GetAdjective]§!與[TAN.GetFlag]§Y[TAN.GetAdjective]§!領土的決議。"
 MAN_tsr_a_new_constitution: "新憲法"
 MAN_tsr_a_new_constitution_desc: "君主專制不符合任何人的利益。我們應當起草一部憲法，既賦予皇帝一定權力，又以民選政府對其加以限制。"
 MAN_tsr_division_of_power: "權力分立"
 MAN_tsr_division_of_power_desc: "憲法一經頒佈實施，軍人獨裁與皇權專制等野蠻統治形式將成為過去。華人的帝國將不僅僅是強者的國家，而是屬於所有人的國家。"
 MAN_tsr_reestablish_the_qing_army: "重建清軍"
 MAN_tsr_reestablish_the_qing_army_desc: "沒有軍隊，我們永遠無法統一曾經的帝國。我們應該從舊軍隊中汲取靈感，但也不能過於固守傳統。戰爭之道正在改變，我們必須跟上時代。"
 MAN_tsr_question_the_emperors_authority: "質疑皇帝的權威"
 MAN_tsr_question_the_emperors_authority_desc: "雖然溥儀在反對政府的人群中仍有一定支持，但他因對日本毫無作為而飽受批評。我們應當順勢而為，將他徹底排除在自由滿洲的未來藍圖之外。"
 MAN_tsr_bandit_recruitment: "招募土匪"
 MAN_tsr_bandit_recruitment_tt: "解鎖§Y招募土匪§!決議"
 MAN_tsr_bandit_recruitment_desc: "許多在我們的土地上游蕩的所謂土匪，其實是積極抗日的游擊戰士。若我們想要把握對抗日本帝國的機會，就應該與他們結盟並利用他們的經驗。"
 MAN_tsr_ally_bandit_leaders: "爭取土匪首領"
 MAN_tsr_ally_bandit_leaders_tt: "獲得5個由§Y5個步兵營§!組成的師。\n"
 MAN_tsr_ally_bandit_leaders_desc: "關東軍的存在意味著日本在我國掌控了巨大的權力。但這同樣意味著，有相當多的人願意拿起武器，將他們逐出我們的土地。我們必須抓住這一機會，確保人民的勝利。"
 MAN_tsr_a_new_dawn_over_manchuria: "滿洲的新黎明"
 MAN_tsr_a_new_dawn_over_manchuria_desc: "時候到了。我們的部隊已準備就緒，日本駐軍在叛軍的反覆襲擊下正在崩潰。如果我們能把侵略者趕出去，那就是現在。"
 MAN_kim_il_sung_tt: "部分朝鮮革命者也許會被鼓勵加入鬥爭"
 MAN_tsr_depose_puyi: "廢黜溥儀"
 MAN_tsr_depose_puyi_desc: "溥儀作為傀儡的作用已經結束，如今他只會阻礙真正的民主。繼續接受君主統治只會讓我們的國家陷入封建貴族與世襲的泥潭。因此，必須將他徹底罷黜。"
 MAN_tsr_the_new_beiyang_government: "新北洋政府"
 MAN_tsr_the_new_beiyang_government_desc: "北洋軍閥曾在此地領導中華民國。若我們要把真正的民主帶回中國，就必須繼承他們的衣缽，否則只會被視為由土匪操控的非法政權。"
 MAN_cores_beiyang_tt: "獲得§Y華北§!和§Y內蒙古§!的核心"
 MAN_tsr_reform_the_army: "改革陸軍"
 MAN_tsr_reform_the_army_desc: "目前我們的軍隊不過是由各路叛軍與滿洲舊軍殘部拼湊而成。若要避免在未來的戰爭中遭遇徹底災難，就必須將其改革為一支正規軍。"
 MAN_tsr_beiyang_university: "北洋大學"
 MAN_tsr_beiyang_university_desc: "若沒有良好的教育，我們的人民將缺乏機遇，科研也會落後於中國其他地區乃至世界。因此，我們應當建立一所大學，以紀念北洋政府最後一任總理潘復。"
 MAN_tsr_the_southern_expedition: "南征"
 MAN_tsr_the_southern_expedition_desc: "國民黨的北伐粉碎了我們美麗的共和國。我們應該通過南征來扭轉這一錯誤，最終終結目前佔領南京的失敗國家。"
 MAN_tsr_proclaim_the_republic_of_china: "宣告中華民國"
 MAN_tsr_proclaim_the_republic_of_china_desc: "當我們掌控所有都市後，便能最終宣佈成立中華民國，成為北洋政府的合法繼承者。未來尚不可知，但我們已將民主帶給全中國，並希望它能延續千年。"
 MAN_tsr_finish_off_the_japanese_threat: "消滅日本威脅"
 MAN_tsr_finish_off_the_japanese_threat_desc: "日本，這個最初的佔領者，已經被放任太久。是時候結束這場鬧劇，展示誰才有資格統治亞洲。"
 MAN_tsr_an_industrial_power: "工業強國"
 MAN_tsr_an_industrial_power_desc: "隨著我們的工業終於能與西方競爭，我們應當推動進一步擴張。憑此，我們終將成為亞洲乃至全世界的工業中心。"
 MAN_tsr_zhao_shangzhis_coup: "趙尚志政變"
 MAN_tsr_zhao_shangzhis_coup_desc: "塵埃落定，日本人被逐，溥儀被廢，滿洲出現了權力真空。趙尚志與東北抗日聯軍迅速填補了這一空缺，他們現在要求[MAN.GetLeader]下臺。"
 MAN_tsr_ally_the_soviet_republic: "與蘇維埃共和國結盟"
 MAN_tsr_ally_the_soviet_republic_desc: "我們在中國其他地區的中共朋友必然希望與我們攜手。唯有如此，我們才能更有力地抵禦一切外來或內部的威脅。"
 MAN_tsr_research_cooperation: "與中共開展科研合作"
 MAN_tsr_research_cooperation_desc: "目前我黨控制的各個地區之間缺乏有效溝通。我們應當協調科研工作，確保沒有任何地區落後。"
 MAN_tsr_the_long_march_south: "向南進軍"
 MAN_tsr_the_long_march_south_desc: "時機已到。只要我軍越過國境，中國內戰的最後階段便會拉開序幕。勝負尚未可知，但憑藉高超的機動，我們的敵人將難以跟上。"
 MAN_tsr_soviet_aid: "蘇聯援助"
 MAN_soviet_volunteers_tt: "[SOV.GetFlag]§Y蘇聯§!將更有可能派遣志願軍"
 MAN_tsr_soviet_aid_desc: "蘇聯位於我國北部與東部，運輸物資與人員並非難事。我們應當說服他們支援在中國的意識形態盟友。"
 MAN_tsr_proclaim_the_peoples_republic: "宣告新中國成立"
 MAN_tsr_proclaim_the_peoples_republic_desc: "當中國的主要都市盡入我方之手，便是宣佈成立中華人民共和國的時刻。從此，我們不再是世界列強眼中由土匪與罪犯操控的邊陲雜亂之地，而是一個真正意義上的國家！"
 MAN_tsr_request_our_lost_territories: "索要失地"
 MAN_tsr_request_our_lost_territories_tt: "要求[SOV.GetFlag]§Y蘇聯§!歸還曾屬於中國的土地"
 MAN_tsr_request_our_lost_territories_desc: "蘇聯如今仍佔據數塊曾屬中國與滿洲的領土。若我們要與他們建立有效關係，就必須要求歸還，或至少解決這一爭端。"
 MAN_tsr_persuade_the_IMPRP: "說服內人黨"
 MAN_tsr_persuade_the_IMPRP_tt: "一旦我們宣佈獨立，[MEN.Getflag]§Y內蒙古人民革命黨§!的成員將發動內戰。"
 MAN_tsr_persuade_the_IMPRP_desc: "內蒙古人民革命黨目前在[MEN.GetName]並非主導力量，但若我們自邊境一側給予足夠的勸說與支援，就能讓他們與我們一同反抗[JAP.GetNameDef]，並解放他們的人民。"
 MAN_tsr_raise_the_yong_ying: "重建勇營"
 MAN_tsr_raise_the_yong_ying_desc: "勇營，字面意思為“勇敢營”，是清朝時期的一種區域性軍隊。其成員由地方民兵組成，與正規軍不同，勇營由地方出資。這些部隊常用於地方自衛，並曾為我們效力良多。我們應當重建這一制度，使其適應現代戰爭。"
 MAN_tsr_raise_the_yong_ying_tt: "解鎖決議在戰時§Y集結民兵§!"
 MAN_tsr_a_new_self_strengthening_movement: "自強運動"
 MAN_tsr_a_new_self_strengthening_movement_desc: "自強運動或洋務運動是我們舊帝國的一個西化時期，目的主要是在幾次幾乎摧毀我們國家的危機之後提高我們的工業和軍事能力。我們應該繼續這種現代化，以避免未來任何潛在的災難。"
 MAN_tsr_reestablish_the_gansu_braves: "重建甘肅勇營"
 MAN_tsr_reestablish_the_gansu_braves_desc: "甘肅勇營由甘肅的穆斯林士兵組成。隨著馬家所控制的地區落入我們之手，我們應當重建這支軍隊，並吸納其將領協助我們控制該地。"
 CHI_sea_one_china_policy_tt: "解鎖決議整合曾屬於中國的地區"
 CHI_sea_annex_tuva: "吞併圖瓦"
 CHI_sea_annex_tuva_desc: "圖瓦曾經是我們國家的一部分，但在革命後，俄羅斯人從我們手中搶走了這裡。我們必須從俄羅斯人手中解放他們，讓他們與南方的兄弟團聚。"
 CHI_sea_push_into_manchuria: "攻入滿洲"
 CHI_sea_push_into_manchuria_desc: "1858年與1860年的條約讓我們將滿洲拱手讓與俄國，這是屈辱的歷史。若我們要成為帝國強權，就必須扭轉這一錯誤。"
 CHI_sea_dominate_siam: "支配暹羅"
 CHI_sea_dominate_siam_desc: "暹羅是亞洲少數未被列強佔領的國家之一。我們應當為其提供保護，以抵禦外來勢力的威脅，同時也藉此掌控該國。"
 SIC_the_sichuan_clique: "川系軍閥"
 SIC_the_sichuan_clique_desc: "川系處於一個微妙的位置，它是由觀念不一的各路軍閥因某種地方團結的思想而鬆散地聯合而成。我們應當發揮這些軍閥各自的優勢，使自身實力更上一層樓。"
 SIC_the_domain_of_liu_wenhui: "劉文輝的地盤"
 SIC_the_domain_of_liu_wenhui_desc: "劉文輝，劉湘的叔父兼昔日對手，在西康省開闢了自己的小王國。他最初擔任四川省主席，1935年被驅逐後，就一直在治理事實上獨立的西康，可能是意圖統一整個西康。"
 SIC_develop_xikang: "開發西康"
 SIC_develop_xikang_desc: "西康地廣人稀且多山，因此在省級開發計劃中常被忽視。我們應當投資此地以贏得民心，同時也能增強我們的經濟基礎。"
 SIC_push_back_the_tibetans: "擊退藏人"
 SIC_push_back_the_tibetans_desc: "出擊的時刻終於到來。我們要像1932年警告過的那樣果斷地跨過金沙江直取昌都，最終一統西康！"
 SIC_the_armies_of_yang_sen: "楊森的軍隊"
 SIC_the_armies_of_yang_sen_desc: "楊森是一位軍事生涯相當豐富的將領，曾於1924至1925年擔任四川督辦，後於1926年與英國人發生衝突並於1926年加入國民黨。我們應爭取獲得他的支持以增強軍事實力。"
 SIC_anti_communism: "反共"
 SIC_anti_communism_desc: "楊森是一名狂熱的反共派，此前曾積極抗爭，阻止共產黨滲透四川。我們應當堅持這一方針，避免四川落入錯誤之手。"
 SIC_drive_out_the_japanese: "驅逐日本侵略者"
 SIC_drive_out_the_japanese_desc: "日本徵服中國的企圖必須立即終結。雖然他們仍不太可能取得全面軍事勝利，但我們必須讓他們停下並徹底扭轉戰局。我們必須盡力把他們趕出我們光榮的祖國！"
 SIC_the_governor_of_sichuan: "四川省主席"
 SIC_the_governor_of_sichuan_desc: "劉湘，現任省主席以及劉文輝之侄，掌控著四川最富庶、最重要的部分。我們應該繼續推進他的改革，在進一步發展該區域的同時提高我們的技術水平。"
 SIC_develop_chongqing: "開發重慶"
 SIC_develop_chongqing_desc: "重慶是四川的心臟，我們應該進一步推動這裡的工業化。要抵禦國內外的威脅，我們也必須有工業的支持。"
 SIC_armor_efforts: "重視裝甲"
 SIC_armor_efforts_desc: "我們的裝甲和空軍力量太弱，無法應對現代衝突。我們應該努力提升技術水平以抵禦外來威脅。"
 SIC_sichuan_still_stands: "川系仍在"
 SIC_sichuan_still_stands_desc: "儘管中央政府以為劉湘去世後進軍重慶就代表我們投降了，但事實並非如此。我們反而證明了自己是中國的一支正統力量，並且在必要時有能力與中央政府抗衡。"
 SND_unlock_loyalty_decision_tt: "§Y解鎖嘗試證明韓復榘忠誠或投靠日本的決議§!"
 GXC_the_japanese_visit: "日本人來訪"
 GXC_the_japanese_visit_desc: "日本人對我們的兩個地區一直抱有濃厚興趣，他們希望我們與中央政府的對立能為其在華進一步擴張創造條件。雖然我們不同意日本的立場並堅決反對其進軍我方領土，但接受他們提供的援助是明智之舉——這樣在時機來臨時，我們就能用他們自己的武器來反擊。"
 GXC_question_chiangs_authority: "質疑蔣介石的權威"
 GXC_question_chiangs_authority_desc: "蔣介石近來一直試圖加強對我方省份的影響，企圖控制我們。我們應當質疑他是否真的有對我們的管轄權，畢竟我們在事實上是獨立的。"
 GXC_the_scorched_earth_speech: "焦土抗戰"
 GXC_the_scorched_earth_speech_desc: "中央政府對日本太過縱容。我們要戰鬥到最後一人，即使被迫撤退也要實行焦土政策。無論付出多大代價，都不能讓日本帝國控制整個中國。"
 GXC_rumors_of_deposition: "革職傳聞"
 GXC_rumors_of_deposition_desc: "近來有傳言稱，蔣介石認為陳濟棠過於獨立自主，因此試圖通過迫使其辭職來加強對該省份的控制。若傳言屬實，情況將極為棘手，我們必須立即採取行動！"
 GXC_denounce_chiang: "譴責蔣介石"
 GXC_denounce_chiang_desc: "蔣介石的姿態和在抵抗日本方面的無能恰恰證明了他是個軟骨頭，不配統治全國。我們應該譴責他，並提出一個不軟弱的替代方案。"
 GXC_formation_of_the_nraja: "組建國民革命抗日救國軍"
 GXC_formation_of_the_nraja_desc: "我們再次認識到，若要阻止日本逐步蠶食我國領土，除了組織武裝抵抗進軍南京外別無選擇。為此，我們應組建國民革命抗日救國軍，準備進軍湖南。"
 GXC_declare_opposition: "公開反對"
 GXC_declare_opposition_desc: "時機已至。我們要公開反對中央政府，揮師北上，迫使他們談判或徹底推翻他們。接下來會發生什麼尚不確定，但即便失敗，也表明了我們強硬的態度！"
 MA_develop_inter_province_ties: "發展省際關係"
 MA_develop_inter_province_ties_desc: "為了更有效地治理並發展我們幅員遼闊且人口稀少的地區，我們必須與家族成員加強聯繫，在所管轄的省份之間建立更緊密的關係。"
 cast_off_ma_ties_or_became_china_flag: " 已與馬氏家族斷絕關係或成為新的中央政府"
 MA_unified_training_program: "統一訓練計劃"
 MA_unified_training_program_desc: "為了保護邊境並牢牢掌控東北地區，提高部隊素質以及協調徵兵工作至關重要，這樣才能確保不會錯失任何有價值的兵源。"
 MA_strenghten_regional_trade: "加強區域貿易"
 MA_strenghten_regional_trade_desc: "雖然我們的土地幅員遼闊，但經濟在多個方面都存在不足。我們必須協調貿易和工業建設，以緩解這些問題。"
 MA_strenghten_regional_trade_tt: "所有成員在其首都獲得§G1§!座§Y民用工廠§!"
 MA_promises_of_mutual_defense: "共同防禦承諾"
 MA_promises_of_mutual_defense_desc: "在簽署了先前所有條約後，我們現在可以繼續制定一項共同防禦條約，以確保在面臨外部勢力（無論是否來自中國）的入侵時我們能互相幫助。"
 MA_promises_of_mutual_defense_tt: "所有馬家軍會彼此§Y保障獨立§!"
 MA_formalize_the_ma_clique_collective: "正式建立馬家軍集團"
 MA_formalize_the_ma_clique_collective_desc: "現在，將馬家軍集團從鬆散軍閥聯合轉變為緊密組織的基礎已經奠定。我們應該將這個實體正式化，並確保我們都有相同的外交政策。"
 MA_clique_collective_faction: "馬家軍集團"
 XIC_northwest_bandit_suppression_headquarters: "剿匪總司令部"
 XIC_northwest_bandit_suppression_headquarters_desc: "我們圍剿陝西共黨的行動已經陷入停滯，僅1935年下半年我們就在該區域損失了一個步兵師和一個步兵團。隨著官兵們要求停止徒勞的反共作戰並集中力量收復東北失地的壓力與日俱增，我們必須做出選擇。"
 XIC_discussions_in_luochuan: "洛川會談"
 XIC_discussions_in_luochuan_desc: "共產黨已派遣李克農為代表前往洛川會見$CHI_zhang_xueliang$。他們希望商討停止敵對行動的可能性，並集中精力應對我們雙方都視為對中國構成更大威脅的日本。我們應當順應他們的提議，儘快趕往指定地點。"
 XIC_send_a_representative_to_sheng_shicai: "向盛世才派遣代表"
 XIC_send_a_representative_to_sheng_shicai_desc: "李克農同意在我方與中共之間促成合作，前提是雙方需尋訪[SOV.GetAdjective]代表，爭取其為抗日鬥爭提供援助。我們應當利用在[SIK.GetNameDef]的人脈關係爭取[SOV.GetLeader]的支持。"
 XIC_non_agression_pact_with_the_cpc: "與中共的互不侵犯協議"
 XIC_non_agression_pact_with_the_cpc_desc: "為了證明我們對抗日事業的決心，我們應當嘗試暫時停止敵對行動，即便自滿的[CHI.GetLeader]可能因此決定而惱怒。假以時日，我們定能說服[CHI.GetAdjective]領導層與[PRC.GetNameDef]聯手。"
 XIC_the_fushi_conference: "膚施會議"
 XIC_the_fushi_conference_desc: "[PRC.GetLeader]已同意派李克農與周恩來為特使赴膚施參與第二次會晤，以商討爭取[CHI.GetLeader]正式加入統一戰線的具體條件和行動。擊敗[JAP.GetAdjective]、收復奉系故地的時刻日益臨近……"
 XIC_anti_japanese_national_salvation_agreement: "抗日救國協定"
 XIC_anti_japanese_national_salvation_agreement_desc: "陝西停戰協議正式達成後，是時候加強中共的力量，使其具備足夠的影響力，從而讓[CHI.GetLeader]認識到結束內戰並建立第二次統一戰線對國民黨來說是值得的。因此，我們應該將國民黨提供的武器和資金偷運到蘇區，增強他們的實力。"
 XIC_withdraw_forces_from_yanan: "從延安撤軍"
 XIC_withdraw_forces_from_yanan_desc: "為了激怒[CHI.GetLeader]並確保國民黨領導層前往西安調查我軍，我們需要製造事端——從延安撤出部隊，放任共產黨佔領該城。"
 XIC_form_the_anti_japanese_comrades_association: "成立抗日同志會"
 XIC_form_the_anti_japanese_comrades_association_desc: "為增強我軍實力並說服軍隊停止對抗中共，我們必須建立一個秘密核心組織來團結東北軍，並吸收具有積極抗日思想的人士。張學良將其命名為抗日同志會，由他擔任該組織主席，聯合共產黨抗日並培養抗日干部。"
 XIC_invite_chiang_for_troop_inspections: "邀請[CHI.GetLeader]檢閱部隊"
 XIC_invite_chiang_for_troop_inspections_desc: "在我國因內鬥而衰弱的同時，日本卻對我國領土虎視眈眈。儘管如此，[CHI.GetLeader]仍拒絕與中共合作，不顧我們懇切請求，執意要求繼續剿匪行動，否則將把我們調往南方。我們必須迫使國共兩黨認清形勢，建立統一戰線。"
 XIC_sixth_encirclement_campaign: "第六次圍剿"
 XIC_sixth_encirclement_campaign_desc: "儘管中共的威脅給我們造成了巨大的損失，但我們必須做好再次進攻的準備，因為[CHI.GetLeader]又命令我們繼續圍剿。只有這樣，[CHI.GetAdjective]的領導層才會滿意，並允許我們將注意力集中在東北地區。"
 XIC_request_relocation_to_northeastern_command: "請求調往東北司令部"
 XIC_request_relocation_to_northeastern_command_desc: "我們在陝西的剿匪任務現已完成，是時候向[CHI.GetLeader]提議由$CHI_zhang_xueliang$承擔北方壁壘的職責，保衛目前由[HBC.GetLeader]控制的[608.GetName]。這個計劃將讓我們向重建昔日奉系軍閥偉業的目標更進一步。"
 XIC_invite_zuolin_loyalsits: "邀請張作霖支持者"
 XIC_invite_zuolin_loyalsits_desc: "許多在[MAN.GetNameDef]軍中服役的士兵和將領，都曾效忠於[ROOT.GetLeader]之父張作霖。如今正是暗中聯絡並邀請他們迴歸[ROOT.GetNameDef]的時機。"
 XIC_reestablish_the_zhili_army: "重建直隸軍"
 XIC_reestablish_the_zhili_army_desc: "奉系的直隸軍曾是張作霖部署在今河北省與北平地區的部隊。我們應重建這一組織，為我們從頭重建奉系奠定良好基礎。"
 XIC_recruit_mancurian_bandits: "招募東北土匪"
 XIC_recruit_mancurian_bandits_desc: "許多在東北遊蕩的所謂“土匪”，實際上是與[JAP.GetNameDef]和[MAN.GetNameDef]積極作戰的游擊隊員。若我們想要把握對抗東方威脅的機會，就應該與他們結盟並利用他們的經驗。"
 XIC_recruit_mancurian_bandits_tt: "獲得3個由§Y5個步兵營§!組成的師和2個由§Y5個騎兵營§!組成的師。\n"
 XIC_restore_the_glory_of_the_fengtian_army: "重鑄奉軍榮光"
 XIC_restore_the_glory_of_the_fengtian_army_desc: "直隸軍已重建完成，是時候恢復奉軍曾經的實力，成為華北支配性力量了。很快，我們的榮光將會恢復！"
 XIC_reclaim_the_lost_birthright: "回到我那可愛的故鄉"
 XIC_reclaim_the_lost_birthright_desc: "終於到了將[MAN.GetAdjective]和[JAP.GetAdjective]禍害逐出東北，收復我們家園的時刻！我們要立即揮師北上，在敵軍反應過來前拿下這片土地。"
 XIC_restore_the_homeland: "重建家鄉"
 XIC_restore_the_homeland_desc: "隨著我們舊都奉天的光復，$CHI_zhang_xueliang$終於可以名正言順地加冕東北王，併兼中華民國軍政府陸海軍大元帥的頭銜，重振奉系的往昔雄風。奉天萬歲，少帥萬歲！"
 XIC_restore_the_homeland_tt: "獲得§Y奉系§!曾持有的最大領土的§Y核心§!"
 XIC_revive_the_beiyang_government: "重建北洋政府"
 XIC_revive_the_beiyang_government_desc: "作為北洋流亡政府的合法繼承人，我們終於可以宣佈自己是合法的中華民國。未來會如何還有待觀察，但現在我們已經將民主帶到了整個中國，希望它能延續一個千年。"
 CHI_tsr_repoen_the_natioal_assembly: "重新召開國會"
 CHI_tsr_repoen_the_natioal_assembly_desc: "國會曾是北洋政府的立法機關，遭袁世凱永久解散後被立法院取代。如果我們想要一個真正自由民主的國家立法機構，就不能僅僅滿足於讓立法院繼續運作。我們必須建立一個多層面的制度，確保人民的意志是至高無上的！"
 CHI_tsr_form_a_preparatory_committee: "成立籌備委員會"
 CHI_tsr_form_a_preparatory_committee_desc: "元首之爭不止，國家永無寧日。因此，必須像1915年8月19日所做的那樣，成立一個以建立君主立憲制為目標的籌備委員會。唯有如此，我們才能徹底解決內部紛爭和政治混亂！"
 CHI_tsr_legacy_of_the_hongxian_emperor: "洪憲皇帝的遺產"
 CHI_tsr_legacy_of_the_hongxian_emperor_desc: "袁世凱或許留下了一個軍閥割據、共和思潮洶湧的爛攤子，但他的本意是好的。於是他登基為洪憲皇帝，賜予國家憲政昌盛，成為護國之人。若有人值得敬仰，那便是他；我們必須努力復興他的遺志，莫讓他湮沒於時光。"
 CHI_tsr_coronation_at_the_temple_of_heaven: "天壇加冕"
 CHI_tsr_coronation_at_the_temple_of_heaven_desc: "為了鞏固我們的權威，[ROOT.GetLeader]必須著手匡正孔教綱常，並復興清朝的國家祭祀。因此，以皇帝的身份參加在天壇舉行的儀式並最終加冕是[ROOT.GetLeader]的最佳選擇。"
 CHI_tsr_outlaw_the_kmt_and_cpc: "取締國共兩黨"
 CHI_tsr_outlaw_the_kmt_and_cpc_desc: "共和制不適合中國的國情。因此，絕不能讓推翻了帝國並從中崛起的革命勢力再度得勢。國家只有在統一的領導下才能恢復昔日輝煌，故此必須迅速處理內部異議。"
 CHI_tsr_restoration_of_the_chinese_empire: "中華帝國復辟"
 CHI_tsr_restoration_of_the_chinese_empire_desc: "復興中華、終結百年屈辱的時機已至。是時候奪回我們在國際事務中的地位、雄立於世了。此刻正是[ROOT.GetLeader]擔當中華帝國偉大皇帝之時！"
 CHI_tsr_adopt_the_twelve_symbols: "採用十二章"
 CHI_tsr_adopt_the_twelve_symbols_desc: "十二章國徽曾是中華帝國的國徽，也必將再次成為國徽。它源於古老的十二章紋樣，借其神力，皇帝的威權將傳遍天下。憑青龍與鳳凰，皇帝的意志必將實現！"
 CHI_tsr_reinstate_the_new_imperial_code: "恢復新皇室規範"
 CHI_tsr_reinstate_the_new_imperial_code_desc: "在袁世凱登基前後，他的法律顧問有賀長雄以日本帝國憲法為藍本起草了《新皇室規範》。雖然我們並不想緊密追隨這樣一個“流氓國家”的法律基礎，但顯而易見，它將產生預期效果。因此，我們應著手以該法典為基礎，起草一部新憲法。"
 CHI_tsr_reestablish_xinhua_palace: "重建新華宮"
 CHI_tsr_reestablish_xinhua_palace_desc: "袁世凱登基後，將緊鄰紫禁城的“中南海”改名為“新華宮”。既然他選擇在此居住，[ROOT.GetLeader]似乎也應效仿。"
 CHI_tsr_reclaim_the_mandate_of_heaven: "天命攸歸"
 CHI_tsr_reclaim_the_mandate_of_heaven_desc: "我們先前在收復帝都之戰中的勝利已昭示蒼天：天命認定皇帝公正賢明，堪居龍位。面對如此鐵證，任何質疑他並非中國正統之主的念頭都應煙消雲散。"
 CHI_tsr_five_races_under_one_union: "五族大同"
 CHI_tsr_five_races_under_one_union_desc: "如果我們新的王朝要在未來的歲月裡存續，就必須吸納袁世凱得以掌權的共和原則。通過五色共和的理念，同地區內不同族群才能在一國之內和諧共存。"
 CHI_tsr_zhonghua_minzu: "中華民族"
 CHI_tsr_zhonghua_minzu_desc: "為了繼續建設一個成功的國家，我們必須藉助中華民族主義，將其與國家建設和歸屬感聯繫起來，有效向人民展示他們對[ROOT.GetNameDef]的皇帝與政府負有忠誠義務。"
 CHI_tsr_reestablish_the_beiyang_army: "重建北洋軍"
 CHI_tsr_reestablish_the_beiyang_army_desc: "北洋軍由袁世凱於1895年建立，是清朝對陳舊軍事體系進行全面改革的核心。我們也應如此，徹底整頓軍隊，避免國民黨體制固有的腐敗與低效。"
 CHI_tsr_reestablish_the_wuwei_corps: "重建武衛軍"
 CHI_tsr_reestablish_the_wuwei_corps_desc: "武衛軍實際上是北京和紫禁城的安全部隊，是清朝皇室在甲午戰敗後試圖建立的一支配備現代武器的西式軍隊。為了保護皇帝的生命和這座“天城”，我們也必須採取類似措施。"
 CHI_tsr_never_another_national_protection_war: "絕不再有護國戰爭"
 CHI_tsr_never_another_national_protection_war_desc: "護國戰爭發生於1915年至1916年，是不忠的軍隊將領與共和派企圖推翻洪憲皇帝合法統治的叛亂。為確保此類事件永不再現，必須迅速鎮壓割據軍閥與獨立武裝，確保一切權力歸於天子！"
 CHI_tsr_tianxia: "天下"
 CHI_tsr_tianxia_desc: "普天之下，所有土地皆由明確而普遍的秩序原則授予我朝天子；這片大地的中心，正是[ROOT.GetAdjective]朝廷與皇帝。如今，終於是時候確立我們作為中原正統、人類文明真正搖籃的地位！"
 CHI_tsr_the_reorganied_government: "改組國民政府"
 CHI_tsr_the_reorganied_government_desc: "隨著[CHI.GetLeader]政權的崩潰及其向西倉皇潰逃，我們成為合法的中國政權。為昭示天下，[ROOT.GetLeader]拜謁了孫中山之陵，並宣誓將堅守他曾確立的共和原則。"
 CHI_tsr_military_industrial_collaboration: "軍事合作"
 CHI_tsr_military_industrial_collaboration_desc: "我軍兵員不足，裝備匱乏，大部分部隊只能依靠繳獲的武器作戰。我們必須通過與日本合作並建立自己的兵工廠來糾正這一錯誤。"
 CHI_tsr_industrial_expansion_cooperation: "工業擴張"
 CHI_tsr_industrial_expansion_cooperation_desc: "沒有工業及其資源支撐，中國永遠無法繁榮昌盛。若要挺立於西方之林，就必須提升我們的工業能力。"
 CHI_tsr_expand_the_nanjing_army: "擴編和平建國軍"
 CHI_tsr_expand_the_nanjing_army_desc: "我們最多隻能指望名義上十分之一的力量忠於我們，因此面對這種情況，我們必須設法建立一支真正忠誠的部隊，由我們偉大的領袖來指引。"
 CHI_tsr_promote_tridemism: "標榜三民主義"
 CHI_tsr_promote_tridemism_desc: "先總理孫中山先生提出的三民主義包括民族主義、民權主義和民生主義。我們應當繼承他的遺志，同時結合還都之後實際情況，發展出更適合粉飾我們政權統治的原則理念。"
 CHI_tsr_peace: "和平"
 CHI_tsr_peace_desc: "我們必須為“永久和平”的事業不擇手段，即便這意味著需短暫地犧牲這一原則。任何阻礙東亞繁榮偉業的絆腳石，我們都將予以徹底清除。"
 CHI_tsr_anti_communism: "反共"
 CHI_tsr_anti_communism_desc: "赤色主義是我們國家的毒瘤，游擊隊是行政體系的潰瘡，我們將為剿滅這種意識形態鞍前馬後，即便這意味著將葬送許多同胞的鮮血。"
 CHI_tsr_national_construction: "建國"
 CHI_tsr_national_construction_desc: "若沒有新一輪的工業躍進，中國將永無真正繁榮之日。缺乏經濟脊梁的支撐，我們永遠無法成為他們所期望的那個中國。"
 CHI_tsr_pan_asianism: "大亞洲主義"
 CHI_tsr_pan_asianism_desc: "奉行大亞洲主義實屬必然，畢竟我們已是日本的兄弟之邦——就連孫中山先生要求亞洲聯合驅逐殖民者的主張，也正可被我們用來佐證驅逐美英勢力的正當性。這場戰爭不僅是中國的內部事務，更是將西方勢力從亞洲清除的“聖戰”。"
 CHI_tsr_establish_the_tewu: "組建76號機關"
 CHI_tsr_establish_the_tewu_desc: "搜捕異議分子的苦勞，豈能讓友邦的情報機構獨自承擔？我們理應建立本土化的特務機構。在日本顧問的悉心指導下，我們不僅能培養出合格的特工，更能早日擁有自己的特務機關。"
 CHI_tsr_embrace_japanese_cultural_institutions: "擁抱中日文化協會"
 CHI_tsr_embrace_japanese_cultural_institutions_desc: "為達成與日本的一體合作，實現所謂亞洲共榮對抗外侮的目標，我們應當構建統一文化，通過吸收日本的一部分文化，使我們更加緊密地團結在一起。"
 CHI_tsr_embrace_japanese_cultural_institutions_tt: "解鎖決議改進§Y$RNG_state_shintoism_dm$§!民族精神"
 CHI_tsr_a_new_chinese_identity: "塑造新中華認同"
 CHI_tsr_a_new_chinese_identity_desc: "既然中國的命運已掌握在我們手中，自當強化我們的政權合法性，證明我們配得上“合格友邦”的身份，更要標榜自己才是先總理理想中的“中華正統”。"
 CHI_tsr_our_place_in_the_sphere: "共榮圈中的角色"
 CHI_tsr_our_place_in_the_sphere_desc: "如今我們已不再是日本的普通衛星國，而是光榮的“兄弟之邦”，理應在大東亞共榮圈中找準定位——讓中國以“互尊獨立”的身份重歸世界強國之列！"
 CHI_tsr_deepen_our_collaboration: "深化我們的合作"
 CHI_tsr_deepen_our_collaboration_desc: "在日本帝國的指導下，我們已取得了對抗侵略者的巨大成功。我們應該尋求與他們的合作更加深入，以確保我們實現統一亞洲的目標。"
 YUN_rally_around_long_yun: "團結在龍雲周圍"
 YUN_rally_around_long_yun_desc: "北方各省的政府由一批激進獨裁者把持，他們為推行自身意識形態不擇手段；反觀滇省憑藉蒸蒸日上的經濟發展，以及社會、教育、政治各領域的革新舉措，省內安定穩固，更被民眾視作“民主堡壘”。為此，我們應當萬眾一心，擁戴這一治省奇蹟的開創者——龍雲將軍！"
 YUN_expand_local_infrastructure: "擴建本省基礎設施"
 YUN_expand_local_infrastructure_desc: "為了讓我們的省份便於通行，我們需要投資建設能夠在山地地形持續使用的基礎設施。如此一來，我們各城鎮之間就能轉運更多貨物。"
 YUN_strive_for_self_sufficiency: "力求自給自足"
 YUN_strive_for_self_sufficiency_desc: "要讓我們的民主基業真正蓬勃發展，就必須避免過度依賴北方那些滿口主義的空談家提供的援助，確保我們在未來數年能夠實現自給自足。"
 YUN_a_land_of_mountains: "群山之地"
 YUN_a_land_of_mountains_desc: "雲南是一片多山之地，我們的人民早就學習並適應了在如此惡劣的地區生活和戰鬥。我們必定能在時機成熟時從中受益。"
 YUN_political_reforms: "政治改革"
 YUN_political_reforms_desc: "為了把地方治理完善，我們必須儘量避免施政過程出現梗阻和腐敗問題，確保官僚體系為經濟發展服務，而不是反過來讓經濟為官僚體系牟利。"
 YUN_eduational_reforms: "推進教育革新"
 YUN_eduational_reforms_desc: "訓政階段的施行雖在北方陷入停滯，但欲使先總理的理想終成現實，我輩即便僅在一省之地，亦當賡續踐行此道。"
 YUN_the_democratic_fortress: "民主堡壘"
 YUN_the_democratic_fortress_desc: "經各項革新舉措落地，縱觀全中華波譎雲詭的政治格局，我省堪稱當之無愧的民主堡壘。如今，我們可以放眼外界，力求將此民主之光播撒於更多人心間。"
 YUN_strengthen_burmic_ties: "強化滇緬紐帶"
 YUN_strengthen_burmic_ties_desc: "我們當地的民眾，尤其是操持彝緬語族語言的族群，與中國內地及緬甸都有著深厚的淵源。作為一代土司之子，龍雲也必須也將民主帶到南方，讓他們擺脫殖民主義的枷鎖。"
