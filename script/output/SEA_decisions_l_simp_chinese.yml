 JAP_kodoha_insurgency_decisions: "皇道派"
 JAP_kodoha_insurgency_decisions_desc: "皇道派，我們帝國陸軍中的一個派系，目前正對其敵對勢力採取行動，1935年8月他們暗殺軍事將領永田鐵山便是實證。如果他們今後決定採取更大規模的行動，至少要等到其長官相澤三郎的審判結束後。或許現在最好加強對某些人的安保措施，皇道派聲稱這些人威脅到了國體——我們國家的靈魂。"
 JAP_aizawa_trial_ongoing: "相澤三郎進行中的審判"
 JAP_aizawa_trial_ongoing_desc: "中佐相澤三郎目前因謀殺軍事將領永田鐵山一案正在接受審判，目前處於軟禁狀態。然而，隨著該案審判成為媒體焦點，且法官與他的派系相互勾結，將審判變成了宣揚其意識形態的平臺，相澤三郎顯然不會得到任何實質性的判決。作為皇道派的核心成員，如果該派系要採取行動，他們至少得在相澤三郎的軟禁期結束後才會行動。"
 JAP_aizawas_trial_over_flag: "相澤三郎的審判已結束，§Y二二六事變§!已發生"
 JAP_takahashi_korekiyo_was_killed: "高橋是清被叛軍殺害"
