 JAP_kwantung_army_decisions: "關東軍"
 JAP_kwantung_army_decisions_desc: "我們在滿洲和中國境內活動的部隊——關東軍，目前行動高度自主，並以未經上級批准就擅自採取行動而聞名。該部隊最初作為關東租借地的警衛部隊而設立，如今其規模已遠遠超出其最初規模，如果我們不能牢牢控制局勢，他們可能會將我們捲入大規模衝突之中。"
 JAP_kwantung_army_impatience: "關東軍漸漸失去耐心"
 JAP_kwantung_army_impatience_desc: "關東軍對中國當前的現狀正迅速失去耐心，如果情況繼續這樣發展下去，他們很可能會在未經政府批准的情況下繼續擴大自己的勢力範圍。"
