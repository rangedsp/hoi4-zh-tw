 JAP_increase_takahashi_korekiyo_security_decision: "加強$JAP_takahashi_korekiyo$的安保"
 JAP_increase_takahashi_korekiyo_security_decision_tt: "我們將加強高橋是清的安保措施，以防陸軍激進分子襲擊。但這也可能導致他們重新調整目標優先級，集中更多力量對付其他人"
