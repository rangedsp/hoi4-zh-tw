 raid_type_facility_strike: "打擊設施"
 raid_type_facility_strike_desc: "對敵方實驗設施的空襲，目標是對該設施及其項目造成嚴重破壞。"
 raid_type_lock_bombing_raid: "鎖定轟炸襲擊"
 raid_type_lock_bombing_raid_desc: "裝備了特殊彈跳炸彈的飛機力圖摧毀水閘，以阻止船隻通過運河。"
 raid_type_lock_bombing_raid_no_bba: "$raid_type_lock_bombing_raid$"
 raid_type_lock_bombing_raid_no_bba_desc: "$raid_type_lock_bombing_raid_desc$"
 raid_type_dam_bombing_raid: "轟炸大壩襲擊"
 raid_type_dam_bombing_raid_desc: "裝備了特殊彈跳炸彈的飛機力圖摧毀大壩，限制它的效用，並使敵人更難在該地區行動。"
 raid_type_dam_bombing_raid_no_bba: "$raid_type_dam_bombing_raid$"
 raid_type_dam_bombing_raid_no_bba_desc: "$raid_type_dam_bombing_raid_desc$"
 raid_type_gun_emplacement_raid: "火炮襲擊"
 raid_type_gun_emplacement_raid_desc: "裝備有地震炸彈的轟炸機企圖摧毀一個$mega_gun_emplacement$工事。"
 raid_type_gun_emplacement_raid_no_bba: "$raid_type_gun_emplacement_raid$"
 raid_type_gun_emplacement_raid_no_bba_desc: "$raid_type_gun_emplacement_raid_desc$"
 raid_type_mega_gun_emplacement_strike: "打擊巨炮工事"
 raid_type_mega_gun_emplacement_strike_desc: "使用地震彈對巨炮工事進行打擊"
 raid_type_mega_gun_emplacement_strike_no_bba: "$raid_type_mega_gun_emplacement_strike$"
 raid_type_mega_gun_emplacement_strike_no_bba_desc: "$raid_type_mega_gun_emplacement_strike_desc$"
 raid_type_oilfield_raid: "油田襲擊"
 raid_type_oilfield_raid_desc: "空襲的目標是摧毀主要油田及其相關煉油廠，以便長期嚴重破壞敵人的燃料生產。"
 raid_type_nuclear_strike: "核打擊"
 raid_type_nuclear_strike_desc: "戰略轟炸機及其護航機將飛往指定目標並投放原子彈。轟炸機隨後將嘗試逃離該區域，以避免被爆炸衝擊波波及。"
 raid_type_nuclear_missile_strike: "核導彈打擊"
 raid_type_nuclear_missile_strike_desc: "一枚遠程導彈將從指定發射地點沿亞軌道彈道飛向預定目標，並在適當時刻引爆核彈頭。"
 raid_type_nuclear_missile_strike_submarine: "潛艇$raid_type_nuclear_missile_strike$"
 raid_type_nuclear_missile_strike_submarine_desc: "$raid_type_nuclear_missile_strike_desc$"
 raid_type_paratrooper_facility_sabotage: "設施破壞襲擊"
 raid_type_paratrooper_facility_sabotage_desc: "一隊空降兵突襲敵人的設施，試圖使用定向爆破破壞關鍵設備，從而擾亂他們的科研進展。"
 raid_type_mine_sabotage_raid: "礦場破壞襲擊"
 raid_type_mine_sabotage_raid_desc: "一隊空降兵空降到敵方重要礦區，嘗試引爆炸藥以長期破壞生產。"
 raid_type_pathfinder_raid: "前鋒突襲"
 raid_type_pathfinder_raid_desc: "一隊空降兵空降到敵後，破壞重要橋梁、設置伏擊點並製造混亂，為即將到來的入侵做好準備。"
 raid_type_commando_port_raid: "海軍港口襲擊"
 raid_type_commando_port_raid_desc: "一支海軍陸戰隊被派去破壞敵方控制的大型$naval_base$。港內的艦船也可能受到損害。"
 raid_type_commando_facility_raid: "海軍設施襲擊"
 raid_type_commando_facility_raid_desc: "一支海軍陸戰隊被派去破壞沿海省份的實驗設施。"
 raid_type_airfield_raid: "機場的襲擊"
 raid_type_supply_hub_raid: "補給中心襲擊"
 raid_type_rescue_captured_general: "營救被俘指揮官"
 raid_type_rescue_captured_general_desc: "一隊士兵潛入敵後，尋找並營救被俘的指揮官。"
 raid_type_rescue_captured_general_captive_line: "§Y$NAME$§!被關押於此。"
 raid_type_demo_dam_raid: "大壩爆破襲擊演示"
 raid_type_AUS_reichstag_bombing: "國會遭炸彈襲擊"
 raid_type_AUS_reichstag_bombing_desc: "派遣一組轟炸機攻擊敵人的主要指揮部，即德國權力的象徵性地點，我們可以同時提振我方的士氣，並對敵人造成打擊。"
 raid_type_ENG_reichstag_bombing: "國會遭炸彈襲擊"
 raid_type_ENG_reichstag_bombing_desc: "通過派遣轟炸機群攻擊敵方總部及象徵德國力量的地點，我們可以提振本國民眾的士氣，同時打擊敵方的士氣。"
 raid_type_GER_eben_emael_raid: "突襲埃本·埃馬爾堡壘"
 raid_type_GER_eben_emael_raid_desc: "一支由傘兵和滑翔兵組成的突擊分隊將從空中攻擊戰略要塞，並佔領該地區的重要橋梁、道路和鐵路，為主力部隊掃清障礙。"
 raid_type_GER_big_ben_bombing: "大本鐘轟炸突襲"
 raid_type_GER_statue_of_liberty_bombing: "自由女神像轟炸突襲"
 raid_type_GER_kremlin_bombing: "克里姆林宮轟炸突襲"
 raid_type_ENG_operation_jericho: "耶利哥計劃"
 raid_type_ENG_operation_jericho_desc: "根據法國抵抗組織的信息，德國在亞眠俘虜了大量抵抗戰士。通過派遣一支飛機中隊炸燬監獄牆壁，我們應該能夠解救大量被俘的抵抗戰士。"
 raid_type_thermonuclear_strike: "熱核打擊"
 raid_type_thermonuclear_strike_desc: "戰略轟炸機及其護航機將飛往指定目標並投放熱核彈。轟炸機隨後將嘗試逃離該區域，以避免被爆炸衝擊波波及。"
 raid_type_thermonuclear_missile_strike: "熱核導彈打擊"
 raid_type_thermonuclear_missile_strike_desc: "一枚遠程導彈將從指定發射地點沿亞軌道彈道飛向預定目標，並在適當時刻引爆熱核彈頭。"
 raid_type_thermonuclear_missile_strike_submarine: "潛艇$raid_type_thermonuclear_missile_strike$"
 raid_type_thermonuclear_missile_strike_submarine_desc: "$raid_type_thermonuclear_missile_strike_desc$"
 raid_type_CHI_huansheng_raid: "煥升行動"
 raid_type_CHI_huansheng_raid_desc: "我們的情報顯示，儘管八幡鋼鐵廠和佐世保海軍工廠是有價值的目標，但目前我們的空軍無法有效打擊。此，我們決定，停止這場戰爭的最有效的方法是，通過在長崎、福岡、佐賀和大阪等城市散發傳單，喚醒日本人民對日本帝國主義戰爭販子在中國犯下的暴行的良知。"
 raid_type_CHI_tokyo_imperial_palace_bombing: "轟炸東京皇居"
 raid_type_CHI_tokyo_imperial_palace_bombing_desc: "通過派遣轟炸機編隊襲擊敵軍總司令部及日本皇權的象徵地標，我們可以在提振本國民眾士氣的同時打擊敵方的士氣。"
 raid_type_CHI_national_diet_bombing: "襲擊國會議事堂"
 raid_type_CHI_national_diet_bombing_desc: "通過派遣轟炸機編隊襲擊敵軍總司令部及日本政權的象徵地標，我們可以在提振本國民眾士氣的同時打擊敵方的士氣。"
 raid_type_CHI_hakko_ichiu_bombing: "轟炸八紘一宇塔"
 raid_type_CHI_hakko_ichiu_bombing_desc: "通過派遣轟炸機編隊摧毀日本軍國主義的象徵，我們可以提振本國民眾的士氣，同時徹底暴露日本外強中乾的本質。"
 raid_type_CHI_great_wall_raid_land: "長城滲透突襲"
 raid_type_CHI_great_wall_raid_land_desc: "長城雖已不如昔日那般堅不可摧，但敵人若憑險據守，仍可佔據地利。我們只需派遣一支小分隊潛入敵軍陣地並引爆炸藥，便可以徹底瓦解他們的優勢。"
 raid_type_JAP_pearl_harbor_strike: "襲擊珍珠港"
 raid_type_JAP_pearl_harbor_strike_desc: "派遣轟炸機編隊突襲敵軍在太平洋的主要海軍總部及艦隊，此舉不僅能重創敵方海軍實力、挫敗其士氣，更能極大提振我國民眾信心。如此一來，我軍將至少掌控大洋制海權長達半年之久！"
