 raid_type_INS_militia_increase_activity_raid_desc: "我方將派遣民兵前往該地區，與當地革命人士取得聯繫並建立游擊據點。若行動順利，我方將嘗試滲透該區域，從荷蘭當局手中奪取控制權。\n\n§W目標地區必須位於共和派控制的§Y地堡§!、§Y鐵路§!或§Y海軍基地§!的範圍內。這些建築可作為行動起點。§!\n\n§Y效果：§!\n§R部署的師將會被消耗§!\n§Y成功：§!\n       §W成為該地區的所有者與控制者。\n       提升戰局態勢等級§R1§!§!級。\n§Y部分成功：§!\n       §W民兵活動等級提升§Y1級§!，提高後續行動的成功概率。§!\n§Y失敗：§!\n       §W沒有效果。§!"
