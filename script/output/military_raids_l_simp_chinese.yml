 raid_type_INS_militia_port_raid: "佔領海軍基地"
 raid_type_INS_militia_port_raid_desc: "我方將派遣民兵偽裝成漁民，乘坐小型船隻行動，力求不被當局發現。登陸後，他們將嘗試建立游擊隊據點；若時機成熟，便會同當地游擊隊協同奪取該海軍基地。此次行動風險極高，一旦民兵暴露行蹤，行動必將失敗。\n\n§Y效果：§!\n§R所分配的師將被消耗§!\n§Y成功：§!\n       §W成為該地區的所有者與控制者。§!\n       提升戰局態勢等級§R1§!級。\n§Y部分成功：§!\n       §W民兵活動等級提升§Y1級§!，提高後續行動的成功概率。§!\n§Y失敗：§!\n       §W沒有效果。§!"
