 tooltip_raid_category_air_raids: "§H空襲行動§!\n單個航空隊針對特定目標進行的空襲。"
 tooltip_raid_category_nuclear_raids: "§H核襲擊§!\n通過戰略轟炸機或攜帶核武器的彈道導彈進行的打擊。"
 tooltip_raid_category_paratrooper_raids: "§H傘兵突襲§!\n由空降特種部隊在敵後進行的小規模突襲，執行危險的破壞任務。"
 tooltip_raid_category_naval_commando_raids: "§H海軍突擊隊突襲§!\n海軍在沿海地區進行的小規模突襲，使用小型快艇等設備快速打擊，然後在敵人反應之前迅速撤離。"
 tooltip_raid_category_land_infiltration_raids: "§H陸地突襲§!\n由陸軍部隊在敵後戰線進行的小規模突襲，利用隱蔽和欺騙手段，實施快打快撤戰術。"
