 INS_no_raids_allowed_tt: "§W§R該決議激活時，突襲將不可用。§!§!"
 INS_is_deescalating_tt: "目前未在執行降低激化度的任務。"
 INS_escalate_the_conflict: "加劇衝突"
 INS_escalate_the_conflict_desc: "我們將組織與敵方部隊的暴動和小規模衝突，以提高緊張局勢和升級，為後續更嚴厲的行動減少國際監督奠定基礎。"
 INS_escalate_the_conflict_HOL: "$INS_escalate_the_conflict$"
 INS_escalate_the_conflict_HOL_desc: "$INS_escalate_the_conflict_desc$"
 INS_deescalate_the_conflict: "請求國際調解"
 INS_deescalate_the_conflict_2: "下令停火"
 INS_deescalate_the_conflict_desc: "荷蘭人不會跟我們誠意談判。在他們眼裡，我們仍然是叛亂分子，是需要鎮壓的麻煩，而不是一個值得認真對待的國家。但世界上的大國則是另一回事，海牙不能那麼輕易地打發它們。我們將呼籲國際社會調停，藉助外部壓力促成我方聲音無法達成的結果。"
 INS_deescalate_the_conflict_2_desc: "我們的突襲已見成效。殖民駐軍領教了我們的實力，海牙也知道我們並未屈服。但每一次打擊都讓荷蘭有新的理由派遣更多兵力和艦船，而我們尚未準備好面對公開戰爭。命令將傳至各指揮官：暫停開火。下一次打擊的時間將由我們自行決定，而不是聽由荷蘭向我們的挑釁。"
 INS_renville_tt_HOL: "§W§Y[USA.GetFlag][USA.GetNameDefCap]§!將向我們發出最後通牒。如果我們不投降並從印度尼西亞撤出，他們將對我們§R宣戰§!。§!"
 INS_renville_wont_happen_neutral_tt: "衝突將在美國談判結束前結束，他們將無法進行干預。"
 INS_renville_explain_USA_tt: "如果衝突未在§Y365天§!內解決：\n\n"
 INS_renville_timer_mission_republic: "倫維爾號協議待決"
 INS_renville_timer_mission_HOL: "$INS_renville_timer_mission_republic$"
 INS_national_revolution_peace_negotiation: "談判讓[FROM.GetName]撤軍"
 indonesia_reduce_escalation_1_effect_tooltip_for_min_4: "降低激化程度§G1§!，最低§Y4§!。"
 INS_ongoing_influence_process: "尚未建立民兵基地"
 INS_current_revolution_strength_3_tt: "該地區當前存在§G高度§!民兵活動。"
 INS_current_revolution_strength_0_tt: "該地區目前沒有任何民兵活動。"
 INS_has_spent_points_trigger_tt: "無法建立更多民兵基地"
 INS_national_revolution_cat: "印度尼西亞民族革命"
 INS_national_revolution_cat_desc: "經歷了350年的荷蘭暴政後，如今我們已掌握局面，宣佈獨立。荷蘭不承認我們的權威，依然將東印度群島作為其殖民地進行統治，並將我們視為罪犯。\n\n我們必須繼續掌控更多地區和重要城市，並從內部推翻荷蘭政府。但我們必須謹慎行事，未經周密策劃不能過於激進，冒險的行為可能會招致荷蘭的軍事行動。"
 INS_national_revolution_cat_map: "發動佯攻起義"
 INS_national_revolution_dutch_cat: "東印度革命民兵"
 INS_national_revolution_dutch_cat_desc: "東印度群島的革命分子已非法宣佈獨立，並依靠民兵武裝控制了該地區多處地域。儘管我們已盡最大努力，但因當地民兵數量龐大，我們始終未能重建對這些區域的控制。\n\n我們必須在他們控制更多城市、進一步破壞東印度群島行政穩定之前阻止他們。雖然這很極端，但若他們繼續如此行事，軍事手段或許將不可避免。"
 INS_HOL_revolution_not_going_well_tt: "§R沒有巴達維亞，我們就無法統治東印度群島，除了與革命者談判和平協議外別無選擇。§!"
 INS_gradual_escalation_republic: "態勢逐步升級"
 INS_gradual_escalation_HOL: "態勢逐步升級"
 INS_gradual_escalation_republic_desc: "荷蘭人的報復在我們每一次襲擊後都變得更加嚴厲，他們的巡邏隊推進到了幾個月前就已經放棄的地區。我們的指揮官報告說，在那些早就被認為已經平定的地方，戰鬥變得更激烈了，而我們的傷亡增長速度比徵兵人員補充的速度還要快。衝突已蔓延至去年尚屬平靜的省份。"
 INS_gradual_escalation_HOL_desc: "來自我們各駐紮地的報告一週比一週糟糕。叛軍在據信不活動的區域發動襲擊，巴達維亞的軍事指揮部要求採取前所未有的嚴厲措施。在海牙，每次內閣會議上主張耐心的人都越來越少。"
 INS_national_revolution_republic_win_ins_tt: "[INS.GetAdjective]共和派民兵將§G事實控制§!該地區，衝突將以§G共和派勝利§!告終。"
 INS_national_revolution_republic_win_hol_tt: "[INS.GetAdjective]共和派民兵將§R事實控制§!該地區，衝突將以§R共和派勝利§!告終。"
 INS_national_revolution_dutch_cat_map: "查看民兵佔領的地區"
 INS_take_batavia: "奪取爪哇控制權"
 INS_take_batavia_desc: "荷蘭人的貪婪使他們幾乎只投資於爪哇，而忽略了東部諸島，這使爪哇成為整個殖民地的致命弱點。這將是他們倒臺的關鍵！我們必須將兵力投入爪哇島，摧毀荷蘭人的通訊和補給網絡，讓東印度群島的行政機構無法運轉。"
 INS_hold_batavia_HOL: "守衛爪哇"
 INS_hold_batavia_HOL_desc: "共和軍已開始行動，將其大部分兵力轉移至爪哇，試圖控制整個島嶼。我們必須繼續抵抗，他們的行動風險極大，一旦失敗，我們就有了推翻他們政權的機會。"
 INS_militias_moestopo_mission: "穆斯托波要求憑藉其軍功獲得晉升"
 INS_militias_pki_uprising_mission: "共產黨起義不可避免"
 INS_pacific_revolution_cat: "太平洋革命"
 INS_instigate_in_country: "煽動[FROM.GetName]革命"
 INS_instigate_in_country_desc: "我們的革命並未隨著最後一名殖民士兵被逐出[ROOT.GetAdjective]土地而結束。[FROM.GetName]的工人與農民仍遭受著我們曾掙脫的同樣枷鎖，如今他們正將我們視為壓迫者能被擊敗的明證。我們將派遣鼓動者深入他們中間，分發傳單，資助他們的工會，並煽動不滿的火焰，直至革命條件成熟。"
 INS_launch_revolution: "號召革命"
 INS_launch_revolution_desc: "[FROM.GetName]的條件已經成熟。我們的特工報告工廠與田間的不滿情緒日益增長，當地黨支部已準備行動。此刻已到號召[FROM.GetName]的工人與農民奮起奪取他們應得的一切了。"
 INS_anti_colonialist_bonus: "在[FROM.GetName]傳播反殖民主義情緒"
 INS_anti_colonialist_bonus_desc: "[FROM.GetName]的人民為外國主子的利益而辛勞，被迫服務於非己之利。我們將提醒他們，屈服是一種選擇，他們的主人也並不像他們表面那樣強大。"
 INS_revolutionary_sentiment: "與[FROM.GetAdjective]革命者合作"
 INS_revolutionary_sentiment_desc: "[FROM.GetName]內部已有一些人自發投身於這項事業。他們缺乏組織與資源，卻不乏信念。通過與這些團體協作，我們能加速現有秩序的崩潰，即便由此引發的不穩定會在短期內使國家更難以治理。"
 INS_arm_militias: "武裝地方[FROM.GetAdjective]民兵"
 INS_arm_militias_desc: "傳單與演說所能推動的革命進程終究有限。時機到來時，我們在[FROM.GetName]的同志必須能夠戰鬥。剩餘的武器與補給將被偷運給同情我們的民兵，這樣反動的勢力將面對一支武裝的民眾，而非毫無防衛之力的人民。"
 INS_arm_militias_tt: "如果內戰爆發，共產黨將獲得額外的師。"
 INS_propoganda_mission: "通過[FROM.GetName]傳播共產主義"
 INS_propoganda_mission_desc: "黨的組織者將被派往[FROM.GetName]各地，建立讀書會，在工會中招募成員，並將革命的信息帶到村莊。我們今天播下的種子，不久便將結出果實。"
 INS_abandon_mission: "放棄任務"
 INS_abandon_mission_desc: "我們的資源並非無限，而[FROM.GetNameDef]的鬥爭所需要的遠超過我們目前所能提供的。我們將撤回我們的代理人，並把我們的努力轉向最需要的地方。"
 INS_aslia_cat: "太平洋統一"
 INS_integrate_subject: "整合[FROM.GetName]"
 INS_integrate_subject_in_progress: "正在整合一個附屬國"
 INS_can_raid_here_HOL: "可突襲地區"
 INS_can_raid_here_HOL_tt: "該地區是共和派民兵地面突襲的潛在目標。如果突襲成功，我們將失去該地區。為保衛該地區免受突襲，我們可以：\n$success_modifier_INS_has_influence_mod_counterplay$\n$success_modifier_INS_defense_modifier_counterplay$\n$success_modifier_INS_naval_dominance_modifier_counterplay$\n-提高§Y奪取制空權§!\n-減少敵方情報獲取\n-降低該地區的抵抗度"
 INS_war_escalation_text: "£generic_war_escalation_text_icon 戰局態勢等級：§Y[?INS.INS_war_escalation_level]§!"
 INS_war_escalation_level_tt: "§Y當前戰局態勢等級§!\n\n戰局態勢等級會隨時間推移而升級，也會因民兵§Y佔領新地區§!以及[HOL.GetNameDef]當局採取打擊民兵活動的行動而提高。若態勢激化至一定程度，將演變為§R全面戰爭§!。"
