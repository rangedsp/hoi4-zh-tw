 AST_communism_support_text: "[?party_popularity_100@communism|Y]%共產主義支持度"
 AST_union_control_1_cat: "工會控制"
 AST_union_control_1_cat_desc: "我們的工會成員已開始在全澳大利亞普通民眾中動員支持。我們可以滲透每個州的立法機構，從內部為共產黨領導的政府建立支持。這將耗費大量政治權力，並可能動搖國家的穩定。\n\n新衛隊退伍軍人正密切注視著我們的一舉一動，如果政府未能及時行動，或國家變得過於動盪，這場衝突可能會將整個國家徹底撕裂。\n\n共產主義支持率：[?party_popularity_100@communism|Y]§Y%§!\n\n§R若穩定度降至40%以下，或退伍軍人叛亂計時結束，內戰將爆發。§!"
 AST_union_control_1_cat_name: "選擇爭取工會支持的地點"
 AST_union_control_1_map_area_name: "仍可施加影響的地區"
 AST_nationalizing_cat: "國有化"
 AST_union_control_2_cat: "工會控制"
 AST_union_control_2_cat_desc: "[ROOT.GetNonIdeologyName]的工人推翻了自己的壓迫者，不是為了眼睜睜看著帝國主義列強繼續將我們海外的同志禁錮於鎖鏈之中。將共產主義傳播到我們邊界之外，不僅是意識形態的目標，更是戰略上的必要。我們必須在海洋彼岸煽起革命之火，為那些將掙脫帝國主義枷鎖的人們帶去希望和資源，直至舊秩序再無立足之地。"
 AST_union_control_2_foreign_cat: "鎮壓共產主義"
 AST_union_control_tt: "工會必須在澳大利亞各州建立勢力，然而新衛隊退伍軍人正在努力阻止共產主義的傳播。"
 AST_seize_local_leadership_in_state_major: "奪取[FROM.GetName]的地方領導權"
 AST_seize_local_leadership_in_state_mid: "奪取[FROM.GetName]的地方領導權"
 AST_seize_local_leadership_in_state_low: "奪取[FROM.GetName]的地方領導權"
 AST_seize_local_leadership_in_queensland: "奪取昆士蘭的地方領導權"
 AST_union_strike: "組織罷工"
 AST_union_strike_desc: "我們的工人走出工作場所，要求更好的條件和權利。這肯定會給政府帶來新的改革壓力。"
 AST_veterans_revolt: "退伍軍人叛亂"
 AST_veterans_revolt_desc: "軍隊中有許多反共分子，其中不少人曾是法西斯團體的成員。他們憎恨共產主義，寧願拿起武器也不願看到共產主義上臺。\n如果我們發動革命拖得太久，或讓穩定降得過低，他們就會自行採取行動來阻止革命發生。"
 AST_organize_in_nation: "滲透§Y[FROM.GetName]§!的工會"
 AST_organize_in_nation_desc: "勞工運動無國界。通過向同志網絡輸送資源，我們可以在[FROM.GetName]的工會內部安插共產主義組織者，從工人階級內部為革命建立基層支持。"
 AST_civil_war_in_nation: "煽動§Y[FROM.GetName]§!革命"
 AST_civil_war_in_nation_desc: "我們播下的種子已到了結果的時刻。[FROM.GetName]的共產主義支持率已增長到公開革命觸手可及的地步。有了資金、鼓動者和精心把握時機的一推，我們就能將民眾的不滿轉化為武裝起義，讓[FROM.GetName]向其應有的工人國家再邁進一步。"
 AST_take_it_to_foreign_streets: "組織國際工人團結遊行"
 AST_take_it_to_foreign_streets_desc: "工人沒有國界。我們將發起一場協調一致的國際運動，將澳大利亞的共產主義組織者派往每一個我們影響力已紮根的國家的街頭，重振當地運動，讓革命之火熊熊燃燒。"
 AST_take_it_to_foreign_streets_tt: "將所有已被滲透國家的境外共產主義影響持續時間延長60天。"
 AST_raj_locked_tt: "在新西蘭、馬來亞、緬甸、菲律賓和印度尼西亞全部落入共產主義統治之前，不能以印度為目標。"
 AST_supply_arms_to_nation: "向§Y[FROM.GetName]§!提供武器"
 AST_supply_arms_to_nation_desc: "我們將向我們的同志提供武器"
 AST_strikes_tt: "只有在罷工進行期間，你才能完成§Y$AST_workers_educational_association$§!、§Y$AST_off_leash$§!、§Y$AST_a_national_housing_commission$§!、§Y$AST_guaranteed_employment$§!和§Y$AST_equal_pay$§!。"
 AST_nationalization: "啟動國有化"
 AST_nationalizing_process_tt: "啟用§Y啟動國有化§!決議，施加§Y國有化進行中§!。這是完成以下國策所必需的，並在完成§Y公眾的澳大利亞§!後移除。§R任何未選擇的國策將被鎖定！§!"
 AST_nationalization_underway_tt: "§Y國有化進行中§!\n工廠產出：§R-30%§!\n船塢產出：§R-30%§!"
 AST_nationalizing_process_ends_tt: "§R選取該國策會鎖定以上所有國策！§!"
