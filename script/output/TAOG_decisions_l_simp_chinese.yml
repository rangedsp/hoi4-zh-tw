 SIA_develop_eastern_burma: "開發源泰邦"
 SIA_use_abandoned_french_tools: "利用法國廢棄設備"
 SIA_use_abandoned_french_tools_desc: "法國人在我們被佔領的領土上留下了一些重型設備，我們可以自己使用。"
 SIA_fortress_saigon: "西貢要塞"
 SIA_fortress_saigon_desc: "我們新帝國的北部將由河內負責守衛。其北面環山，前有紅河，地理位置極佳，足以阻擋任何入侵者。"
 SIA_fortress_hanoi: "河內要塞"
 SIA_fortress_hanoi_desc: "帝國南方將由西貢保衛。這座要塞城市將作為曼谷的守護者，保護[ROOT.GetName]灣免受入侵。"
 SIA_propaganda_poster_slot_available_tt: "擁有一個空的電影海報槽位。"
