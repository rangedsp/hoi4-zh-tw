 SIA_mandate_1: "第一號公告"
 SIA_mandate_1_desc: "國家、人民與民族均應稱為泰"
 SIA_mandate_1_tt: "§Y[THIS.GetName]§!將被稱為§Y$SIA_thailand$§!"
 SIA_mandate_2: "第二號公告"
 SIA_mandate_2_desc: "泰國國民從事任何商業活動時，都必須考慮國家的利益與安全。\n\n泰國國民絕不可向外國人透露任何可能損害國家的信息。此類行為是對國家的背叛。\n\n泰國國民在未考慮泰國國家利益的情況下，不得擔任外國人的代理人或代言人，在國際爭端中不得表達意見或偏袒外國人。此類行為是對國家的背叛。\n\n泰國國民不得以危害國家之方式，秘密為外國人代購土地。此類行為是對國家的背叛。\n\n當有人背叛國家時，泰國國民有責任積極、迅速地加以制止。"
 SIA_mandate_3: "第三號公告"
 SIA_mandate_3_desc: "停止使用與民族名稱不一致的稱謂，或依據群體偏好來指稱泰國國民。\n\n使用泰這一名稱來指代所有泰國人民，不再進行細分。"
 SIA_mandate_4: "第四號公告"
 SIA_mandate_4_desc: "當看到國旗依政府慣例升降，或聽到禮號或哨音，或收到升降旗信號時，應依照法規或習俗向國旗敬禮。\n\n當聽到國歌奏響，無論是出於官方目的還是在任何儀式場合，參與者或出席者都應依照法規或習俗向國旗敬禮。\n\n若發現有人未給予應有的尊重，應予以勸誡，使其明白尊重國旗、國歌及王室頌歌的重要性。"
 SIA_mandate_5: "第五號公告"
 SIA_mandate_5_desc: "泰國國民應努力只食用由泰國產品製作的食物。\n\n泰國國民應努力只穿著由泰國產品製成的衣物。\n\n泰國國民應支持本國同胞在農業、商業、工業及其他職業領域的努力。\n\n泰國國民應使用並支持由政府或泰國人民建立的任何公共事業。\n\n依據本指令從事農業、商業、工業或其他職業的泰國國民，必須努力維持標準、提高質量，並誠信經營。"
 SIA_mandate_6: "第六號公告"
 SIA_mandate_6_desc: "國歌的作曲將採用普拉·真都裡揚創作、並存檔於藝術廳的版本\n\n國歌的作詞將採用陸軍提交的版本"
 SIA_mandate_7: "第七號公告"
 SIA_mandate_7_desc: "每位泰國國民必須幫助建設國家，任何有行動能力者必須從事穩定的職業。無業者對國家無益，不值得其他國民的尊重。"
 SIA_mandate_8: "第八號公告"
 SIA_mandate_8_desc: "關於王室頌歌，我們將縮短其歌詞，並將暹羅一詞替換為泰"
 SIA_mandate_9: "第九號公告"
 SIA_mandate_9_desc: "泰國國民必須頌揚、尊崇並敬重泰語，且應以說泰語為榮。\n\n泰國國民必須將學習國語視為良好公民的職責，並至少應具備讀寫能力；泰國人民亦應將協助與支持不會說泰語或無法讀寫泰語的公民學習泰語，視作自身的重要責任。\n\n泰國國民不得將出生地、居住地或地方口音視為區隔的標誌。每個人都必須堅信，所有生為泰國人者皆擁有相同的泰人血脈，說相同的泰語。出生地或口音不造成任何區別。\n\n泰國國民必須將自身行為符合優秀泰國公民應有的標準視為職責，並敦促、指導那些尚不瞭解、不明白其作為泰王國好公民之責任的人認識這些職責。"
 SIA_mandate_10: "第十號公告"
 SIA_mandate_10_desc: "泰國國民不應在未穿著得體的情況下出現在公共集會、公共場所或城市範圍內。不得體的著裝包括：僅穿內衣、不穿襯衫，或僅裹纏腰布。\n\n泰國國民得體的著裝應包括：在職位與場合允許時穿制服；得體的國際風格服飾；得體的傳統服飾。"
 SIA_mandate_11: "第十一號公告"
 SIA_mandate_11_desc: "泰國國民應將時間劃分為三部分。一部分用於工作，一部分用於個人活動，一部分用於休息與睡眠。這應有條理並遵循時間表，直至成為習慣。\n\n泰國國民應按以下方式安排日常個人活動：在固定時間用餐，每日不超過四次；睡眠約六至八小時。\n\n泰國國民應忠實履行工作職責，不氣餒、不怠工。午間休息與午餐時間不應超過一小時。工作日結束後，應進行至少一小時的體育活動以鍛鍊身體，或從事其他活動，如園藝、照料寵物或植樹。之後，淋浴並用晚餐。\n\n泰國國民應利用夜間空閒時間完成必要的工作，與家人朋友交談，通過收聽廣播新聞或閱讀以獲取知識，或視情況從事其他娛樂或藝術活動"
 SIA_mandate_12: "第十二號公告"
 SIA_mandate_12_desc: "在公共場所或道路上，國民應協助並保護兒童、老人或殘障者。\n\n凡遵守上述第一條的人，都被視為有教養者，值得泰國國民尊重。"
 SIA_movie_theater_cat: "$SIA_sala_chaloem_thai_movie_theater$"
 SIA_movie_theater_cat_desc: "銀幕是現代國家最強大的工具之一。通過精心挑選的電影和宣傳運動，政府可以塑造公眾輿論，激發愛國主義，並壓倒異議的聲音。"
 SIA_celebrating_the_constitution: "慶祝憲法"
 SIA_the_revolution_of_24th_june: "六月二十四日革命"
 SIA_suppressing_the_rebellion_of_1933: "鎮壓博沃拉德叛亂"
 SIA_the_king_of_krung_thon: "吞武里大王"
 SIA_blood_of_suphan: "素攀之血"
 SIA_thai_soldiers_blood: "泰人士兵的鮮血"
 SIA_undauntedly_love_nation: "愛國無畏"
 #LIMITED WAR
 SIA_limited_war_cat: "有限戰爭"
 SIA_limited_war_cat_desc: "我們不能指望在公開戰爭中戰勝該區域的大國——現在還不能。通過一場場目標有限的戰役，逐塊推進我們的訴求，我們將在不斷壯大自身實力的同時，逐步削弱他們的陣地。"
 SIA_start_limited_war_indochina: "在印度支那發動對[FROM.GetName]的有限戰爭"
 SIA_start_limited_war_indochina_tt_main: "開始針對§Y[FROM.GetName]§!的§Y有限戰爭§!。\n控制屬於§Y[FROM.GetName]§!的高亮地區，我們將可以在不升級為全面戰爭的情況下奪取這些地區。\n§R若投降進度損失超過 [?var:global.limited_war_surrender_threshold|%.0]，我方將輸掉本場有限戰爭§!\n\n§R輸掉有限戰爭可能導致我方必須歸還此前征服的領土§!"
 SIA_start_limited_war_rejoin_faction: "我們將暫時離開當前的陣營，並在§Y有限戰爭§!結束後重新加入該陣營。"
 SIA_start_limited_war_can_join_faction: "我們將可以在§Y有限戰爭§!結束後重新加入陣營"
 is_not_engaged_in_a_limited_war: "未參與§Y有限戰爭§!"
 SIA_limited_war_indochina: "[SIA_GetLimitedWarTarget]"
 SIA_limited_war_indochina_desc: "控制所有高亮地區以贏得§Y有限戰爭§!，並在不升級為全面戰爭的情況下將其納入版圖。\n§R投降進度超過[?var:global.limited_war_surrender_threshold|%.0]將導致我們輸掉這場有限戰爭§!"
 SIA_limited_war_indochina_target: "針對§Y[?var:limited_war_target.GetName]§!的§Y有限戰爭§!"
 SIA_limited_war_indochina_no_target: "有限戰爭失敗"
 SIA_start_limited_war_malaysia_burma: "對[FROM.GetName]發動有限戰爭"
 SIA_new_territories_administration_cat: "新領土管理"
 SIA_new_territories_administration_cat_desc: "征服僅僅是個開始。我們所取得的領土必須加以治理、開發和保衛，才能成為國家持久的一部分，而不至於變成招致重新徵服的累贅。"
 SIA_finish_the_triangular_defense_network: "完成三角防禦網絡"
 SIA_finish_the_triangular_defense_network_desc: "隨著北方與南方的兩座要塞完工，我們可以將它們與曼谷連為一體，構建一個三角防禦網絡。即便其中一處失守，其餘兩處仍可正常運作。"
 has_built_fortress_saigon: "已建造西貢要塞"
 has_built_fortress_hanoi: "已建造河內要塞"
