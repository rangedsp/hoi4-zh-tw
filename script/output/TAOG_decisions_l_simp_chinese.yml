l_simp_chinese:
 HOL_recall_conrad_helfrich: "從東印度召回康拉德·赫爾弗裡赫"
 HOL_recall_conrad_helfrich_desc: "在此緊迫時刻，我們必須將祖國置於一切之上。康拉德·赫爾弗裡赫，身為荷蘭皇家海軍最優秀的海軍上將，必須返回荷蘭。"
 INS_is_taking_volksraad: "目前正在人民議會通過一項法律"
 INS_volksraad_cat: "人民議會"
 INS_volksraad_cat_desc: "人民議會於1918年成立，是試圖在東印度群島推行民主制度的一項舉措，也是所謂“倫理政策”實施的一部分。議會席位由荷蘭和印度尼西亞官員共同擔任，通過不同方式選拔產生。儘管荷蘭保留無條件否決權，但人民議會仍可向政府提交動議案和法律草案。"
 INS_volksraad_allow_language_in_schools: "允許在學校使用印尼語"
 INS_volksraad_allow_language_in_schools_desc: "在東印度群島，接受高等教育的機會主要限於荷蘭人和會說荷蘭語的印尼富裕階層，因為荷蘭語是高等教育使用的唯一教學語言。人民議會中一項關於開設印度尼西亞語學校的動議目前正等待總督做出決定。"
 INS_volksraad_allow_language_in_government: "允許在政府使用印尼語"
 INS_volksraad_allow_language_in_government_desc: "東印度群島的政府職位，包括人民議會的職位，均要求精通荷蘭語，這導致人民議會中的許多成員，尤其是本土社區的代表，質疑其民主的有效性。他們已提出一項議案，堅持認為政府職位應儘可能由會說印尼語的人擔任。"
 INS_volksraad_remove_education_quotas: "廢除教育配額制度"
 INS_volksraad_remove_education_quotas_desc: "東印度群島現行的教育體系採用教育配額制，規定必須招收一定數量的印度尼西亞學生和一定數量的荷蘭學生。這在人民議會中一直存在爭議，普遍認為這不公地偏向荷蘭人。雖然我們可以任由人民議會就如何改革這一制度爭論多年，但或許徹底廢除配額制更值得考慮。"
 INS_volksraad_reduce_rubber_export_tax: "降低私營橡膠出口稅"
 INS_volksraad_reduce_rubber_export_tax_desc: "目前，對私營公司出口橡膠徵收的稅率極高，使我們得以維持市場壟斷。然而，由於私營種植園難以運營，這已導致部分地區經濟停滯。在政策實施之初，這被認為是值得的，但大蕭條引發的國際保護主義已使我國的橡膠出口經濟利潤大幅縮水。或許降低這項賦稅以刺激經濟是值得考慮的。"
 INS_volksraad_knil_rank_limit: "通過軍銜反歧視法"
 INS_volksraad_knil_rank_limit_desc: "雖然並無明文規定禁止印尼本土人士在荷蘭皇家東印度陸軍晉升，但存在一條不成文的規定，導致即便表現最為出色的軍事人員也無法晉升至上校以上的軍銜。人民議會中的多個黨派一直在向政府施壓，要求認可表現優異的印尼軍官所做出的努力。"
 INS_volksraad_legalize_displaying_flag: "合法化紅白旗展示"
 INS_volksraad_legalize_displaying_flag_desc: "目前，“印度尼西亞”的紅白旗因與民族主義、反殖民組織有關聯而被禁止公開展示。將其展示合法化，或許能表明我們願意合作的意向，並可能阻止整個群島範圍內民族主義者的持續激進傾向。"
 INS_volksraad_education_subsidies_for_indonesians: "向非荷蘭居民開放教育補貼"
 INS_volksraad_education_subsidies_for_indonesians_desc: "人民議會內部一直就向東印度群島荷蘭學生提供的補貼和獎學金展開爭論。人民議會中多位本土社區代表認為，這一制度應擴大至所有學生，不論其背景如何。此舉雖花費不菲，但能為我們贏得民眾不少好感。"
 INS_volksraad_indonesian_national_language: "採納印度尼西亞語為官方語言"
 INS_volksraad_indonesian_national_language_desc: "印度尼西亞語已逐漸成為群島許多地區的通用語言，連接了不同文化間的語言隔閡。隨著印度尼西亞語如今在教育及政府職位中被允許使用，許多人民議會議員一直在請願，要求在法律上承認其作為殖民地的官方語言，與荷蘭語享有同等地位。"
 INS_volksraad_official_flag: "正式確立印度尼西亞國旗"
 indonesia_volksraad_official_flag_effect_tt: "我們的國旗將更改為紅白旗。"
 INS_volksraad_official_flag_desc: "人民議會中推動自治的動議最終獲得成功，數年前尚被稱為荷屬東印度的國家，如今已成為印度尼西亞自治領。我們的國旗應當相應調整，以反映這些變化。"
