 SIA_release_contigency_funds: "釋放應急資金"
 SIA_release_contigency_funds_tt: "§Y$idea_SIA_contingency_funds$§!追加效果\n"
 SIA_release_contigency_funds_tt2: "§Y[?var:SIA_contingency_funds]§!個月。到期後資金將消失。我們在和平時積累資金的時間越長，戰時資金持續的時間就越長。"
 has_released_contingency_funds: "已釋放應急資金"
 AST_election_approaching_cat: "選舉臨近"
 AST_election_approaching_cat_desc: "一屆政府剛剛安頓好，下一次選舉就已臨近。民主黨派正爭先恐後地尋求一切能提高支持率的手段，盼望著在投票站開啟、票箱裝滿選票之時，這足以確保勝利。"
 AST_final_reforms_mission: "最終改革"
 AST_final_reforms_mission_desc: "憑藉穩定的領導、保守的傾向和對英國的忠誠，澳大利亞聯合黨鞏固了支持，使連任的可能性日漸增大。為維持公眾支持，其領導人必須加快改革。\n\n§Y激活期間效果：§!\n§W（§Y民主§!國策）：\n完成時間減少§Y7§!天§!"
 AST_final_reforms_effect_tt: "\n§Y$AST_final_reforms_mission$§!激活期間效果（§Y180§!天）："
 AST_labor_campaign_tour_mission: "工黨巡迴競選"
 AST_labor_campaign_tour_mission_desc: "在其代表每一個公民的使命中，澳大利亞工黨對帝國主義和澳大利亞對帝國的忠誠採取了不同的視角。國內需求將放在首位，外國利益不應再被優先考慮。\n\n為了向當前執政黨和選民傳達這一信息，澳大利亞工黨將啟動一場全國性的巡迴競選。\n\n§Y激活期間效果：§!\n§W每日§Y澳大利亞工黨§!選票增長：§G+0.05§!§!"
 AST_labor_campaign_tour_effect_tt: "\n§Y$AST_labor_campaign_tour_mission$§!激活期間效果（§Y180§!天）：\n每日§Y澳大利亞工黨§!選票增長：§G+0.05§!\n\n§Y180§!天后效果："
 AST_election_season_cat: "選舉季"
 AST_election_season_cat_desc: "一屆政府剛剛安頓好，下一屆就準備接替其位置。此時已很難做什麼來左右公眾支持，儘管這並不會阻止各黨派嘗試。不到最後一刻，一切尚未結束，而那一天將在投票箱前到來。"
 AST_election_countdown: "選舉倒計時"
 AST_election_countdown_desc: "距離投票站開啟只剩數日。\n\n§W$AST_expected_election_winner_tt$§!"
 AST_government_formation_period: "政府組建期"
 AST_government_formation_period_desc: "每個黨派都希望有權制定自己的政策，但如果特定局勢需要，一個國民團結政府可能是最合理的選擇。\n\n§W§Y激活期間效果：§!\n£GFX_trigger_yes $AST_election_recently_concluded$\n\n$AST_ruling_party$可以組建一個§Y國民團結政府§!。\n\n在澳大利亞國策樹中的民主選舉窗口組建§Y國民團結政府§!。§!"
 AST_war_is_coming_cat: "戰爭將至"
 AST_war_is_coming_cat_desc: "緊張局勢正在加劇，澳大利亞官員和民眾都開始意識到，無論政策或意願如何迴避，戰爭或許都無法避免。\n\n我們必須召開內閣會議，以決定遭受入侵時的應對程序。但在會議之前，或許值得采取某些可能無法獲得全體內閣成員同意的行動。"
 AST_seize_civilian_industry: "徵用民用工業"
 AST_seize_civilian_industry_desc: "儘管消費品對我國的公民和經濟都至關重要，但無法迴避的事實是，戰時會有更迫切的需求。戰爭即將來臨，我們必須做好準備。"
 AST_scorch_the_north: "焦土北方"
 AST_scorch_the_north_desc: "如果我們懷疑北方有入侵的可能，有多種方法可以挫敗這種進攻，儘管這需要付出代價。焦土政策會阻礙我國北方各州的發展，但這或許正是抵禦侵略者所必需的。"
 AST_scorch_the_north_tt: "§Y北方地區被登陸時的效果：§!"
 AST_the_brisbane_line: "布里斯班防線"
 AST_the_brisbane_line_desc: "[AST.GetName]的國防能力可能不足以完全抵禦外來侵略。通過採取優先加強關鍵領土防禦的政策，而不是對所有地區進行薄弱防禦，我們可以確保國內最發達和人口最多的區域仍處在我們控制之下。\n\n儘管這一政策無疑會遭到那些反對任何形式妥協的人的反對，但政府有責任引導[AST.GetName]走向合理的道路。"
 AST_summon_the_cabinet_mission: "召集內閣"
 AST_summon_the_cabinet_mission_desc: "召集外交官、官員和軍事理論家到堪培拉；必須討論發生入侵的可能性。"
 AST_summon_the_cabinet_tt1: "\n此事件將顛覆現任政府，可能導致其§Y崩潰§!。"
 AST_australian_accusations_modifier: "澳大利亞的指控"
 AST_cabinet_trust_cat: "內閣信任度"
 AST_cabinet_trust_increase_tt: "\n§G增加§!§Y內閣信任度§!\n"
 AST_cabinet_trust_decrease_tt: "\n§R減少§!§Y內閣信任度§!\n"
 AST_cabinet_trust_remove_tt: "§G移除§!§Y內閣信任度精神§!"
 AST_australian_comforts_fund: "£BoP_right_texticon 澳大利亞慰軍基金"
 AST_australian_comforts_fund_desc: "政府將通過投資澳大利亞慰軍基金來紀念堪培拉空難的一位遇難者，該基金的積極工作者之一正是這位遇難者的遺孀。\n\n該基金旨在通過向士兵們提供軍隊口糧和個人裝備之外的補給品，來緩解他們在戰場上度過的時光。因此，投資也將有助於戰事。"
 AST_eminent_successors: "£BoP_right_texticon 傑出的繼任者"
 AST_eminent_successors_desc: "堪培拉空難的部分遇難者是備受尊敬的政府官員。雖然無法彌補他們遭遇的可怕命運，但任命幾位傑出的繼任者或許能夠穩定政府，並恢復公眾和部長們的信任。"
 AST_critics_to_shame: "£BoP_right_texticon 讓批評者蒙羞"
 AST_critics_to_shame_desc: "堪培拉空難影響了整個國家，哀悼之情觸及每一位澳大利亞人。在這樣的時刻，總有人試圖趁火打劫。我們將揭露那些最聒噪的批評者——他們的批評實質上是企圖破壞秩序。"
 AST_approach_the_independents: "£BoP_left_texticon 爭取獨立人士"
 AST_approach_the_independents_desc: "政府已不穩定，因為人們對其引領澳大利亞走出近期動盪的信心日漸喪失。通過爭取獨立人士，或許能說服他們認識到，更換政府才是最佳選擇。"
 AST_a_sound_voice: "£BoP_left_texticon 可靠的聲音"
 AST_a_sound_voice_desc: "在此政治動盪時期，一個充滿自信的聲音似乎贏得了澳大利亞人民的信任。這會是[AST.GetName]未來領導人的聲音嗎？"
 AST_challenge_government_narrative: "£BoP_left_texticon 挑戰政府敘事"
 AST_challenge_government_narrative_desc: "政府就堪培拉空難所公佈的細節似乎不同尋常，難免引發信息可能被隱瞞的猜測。一位經驗豐富的澳大利亞皇家空軍飛行員，怎會在理想的飛行條件下墜毀？必須要求政府給出答案。"
 AST_make_a_common_enemy: "製造共同敵人"
 AST_make_a_common_enemy_desc: "隨著堪培拉空難中遇難官員的離去，不信任的聲音日益增多。墜機事件的異常情況助長了對外國勢力介入的猜疑，而這並非唯一緣由——畢竟，沒有什麼比共同的敵人更能團結人心。"
 AST_make_a_common_enemy_tt: "§R事件可能效果：§!"
 AST_ensure_cabinet_loyalty: "確保內閣忠誠"
 AST_ensure_cabinet_loyalty_desc: "只要內閣多數投票支持現任政府，不信任動議的威脅就毫無危險。我們將確保內閣的忠誠。"
 AST_castle_crumbling_mission: "大廈將傾"
 AST_castle_crumbling_mission_desc: "澳大利亞在慘痛的堪培拉空難後仰賴其領導者的指引。現任政府在失去內閣官員後是否仍值得公眾信任？或者更換領導層才是最佳選擇？"
 AST_castle_crumbling_mission_event_tt: "§Y事件效果：§!"
 AST_castle_crumbling_mission_complete_tt: "已完成§Y大廈將傾§!任務"
 AST_cabinet_trust_complete_1_flag: "已執行決議：§Y製造共同敵人§!"
 AST_cabinet_trust_complete_2_flag: "已執行決議：§Y確保內閣忠誠§!"
 AST_cabinet_trust_complete_not_tt: "未採取國策§Y澳大利亞優先§!"
 AST_canberra_air_disaster_flag: "$AST_canberra_air_disaster_events.1.t$"
 AST_war_angst_cat: "戰爭焦慮"
 AST_deteriorating_prime_minister_nerves_mission: "總理日益緊張的神經"
 AST_deteriorating_prime_minister_nerves_desc: "[AST.GetLeader]在不可避免的戰爭壓力下不堪重負。若不能儘快找到解脫之法，他的神經可能崩潰。"
 AST_australian_demands_cat: "澳大利亞的要求"
 AST_aid_australian_military_construction: "援助澳大利亞軍事建設"
 AST_aid_australian_military_construction_desc: "英國尚未做好戰爭準備。通過援助澳大利亞的軍事建設，我們可以緩解他們的急躁情緒。"
 AST_japanese_war_mission: "對日戰爭"
 AST_japanese_war_mission_desc: "澳大利亞不想獨自面對其強敵——[JAP.GetNameDef]。他們正敦促我們邁出第一步，儘早解決這場迫在眉睫的衝突。"
 AST_resource_acquisition_cat: "資源獲取"
 AST_request_resource_rights_in_indonesia: "請求在[INS.GetNameDef]的資源權"
 AST_request_resource_rights_in_malaya: "請求在[MAL.GetNameDef]的資源權"
 AST_request_resource_rights_in_burma: "請求在[BRM.GetNameDef]的資源權"
 AST_request_resource_rights_in_indochina: "請求在法屬印度支那的資源權"
 AST_resource_request_ongoing_flag: "資源請求§Y進行中§!"
 AST_australia_first_movement_cat: "澳大利亞優先運動"
 AST_summons_to_australian_hall: "召集至澳大利亞大廳"
 AST_summons_to_australian_hall_desc: "在我們發展[AST.GetFascistParty]的努力中，必須團結並動員我們的支持者——澳大利亞大廳正等待著我們。"
 AST_summons_to_australian_hall_upgrade: "$AST_summons_to_australian_hall$"
 AST_summons_to_australian_hall_upgrade_desc: "$AST_summons_to_australian_hall_desc$"
 AST_print_the_publicist: "出版《輿論家》"
 AST_print_the_publicist_desc: "《輿論家》——澳大利亞優先運動的通訊刊物——在接觸潛在支持者方面扮演重要角色。通過出版新一期，我們可以傳播我們的主張。"
 AST_print_the_publicist_upgrade: "$AST_print_the_publicist$"
 AST_print_the_publicist_upgrade_desc: "$AST_print_the_publicist_desc$"
 AST_call_on_fascists: "[GET_AST_CALL_ON_FASCISTS]"
 AST_call_on_fascists_desc: "作為一個支持者甚少的小型運動，澳大利亞優先運動常常入不敷出。然而，擁有相似理念的外國團體已表示願意資助我們的雄心，為我們持續前進提供瞭解決方案。"
 AST_call_on_japanese_fascists: "呼籲日本法西斯援助"
 AST_call_on_foreign_fascists: "呼籲外國法西斯援助"
 AST_a_convenient_disaster: "適當的災難"
 AST_a_convenient_disaster_desc: "無論澳大利亞優先黨如何受到歡迎，保守派總會抵制該團體的意識形態。要讓澳大利亞優先黨成功掌權，可能需要比常規選舉更具衝擊力的事件——一個能讓政府陷入混亂的事件。\n\n我們本身沒有能力製造此類事件，但我們的外國法西斯支持者卻有。通過幫助我們上臺，外國法西斯分子將在[AST.GetName]獲得一個盟友。"
 AST_a_convenient_disaster_tt: "\n該事件將顛覆現任政府，最終使§Y[AST.GetFascistParty]§!成為執政黨。"
 AST_a_convenient_disaster_flag: "§Y堪培拉空難§!已通過§Y適當的災難§!決議觸發。"
 AST_insufficient_funds_mission: "$AST_insufficient_funds$"
 AST_sufficient_funds_tt: "資金充足（將在§Y[?AST_insufficient_funds:days_left]§!天后達成）"
 AST_sufficient_funds_tt_2: "§G獲得§!資金充足"
 AST_lose_sufficient_funds_tt_100: "§R失去§!資金充足（持續§Y100§!天）\n"
 AST_lose_sufficient_funds_tt_50: "§R失去§!資金充足（持續§Y50§!天）\n"
 AST_insufficient_funds: "資金不足"
 AST_afm_decisions_fascism_upgrade_tt: "\n升級§Y澳大利亞優先運動決議§!的每日法西斯主義支持率。\n\n"
 AST_afm_decisions_autonomy_upgrade_tt: "\n升級§Y澳大利亞優先運動決議§!的自治度提升。\n\n"
 AST_vichy_out_of_africa_cat: "維希法國退出非洲"
 AST_demand_madagascar: "索取馬達加斯加"
 AST_demand_central_africa: "索取中非"
 AST_demand_southwestern_territories: "索取西南領地"
 AST_vichy_req_ongoing_flag: "領土要求§Y進行中§!"
 AST_remove_vichy_out_of_africa_decisions: "\n移除§Y維希法國退出非洲§!決議。\n"
 AST_big_business_pact_cat: "大企業協定"
 AST_big_business_request_ongoing_flag: "大企業協定§Y進行中§!"
 AST_naval_expansion: "$NOR_alt_dem_naval_expansion$"
 AST_naval_expansion_desc: "作為[ROOT.GetFascistParty]推行有利於商界政策的回報，主要商業領袖已同意投資於符合黨內目標的工業改革。\n\n如果[AST.GetName]想要在面對擁有更強海軍力量的敵人時有一線生機，就必須擴充艦隊。在有限時間內，所有人員都將投身船塢工作，以確保艦船產量提升。"
 AST_factory_conversions: "工廠轉換"
 AST_factory_conversions_desc: "為了讓[ROOT.GetFascistParty]推行對他們有利的政策，作為交換，主要商界人士已同意投資符合該黨目標的工業改革。\n\n國防工業必須被優先考慮，因此澳大利亞的工廠必須進行改造以支持它。"
 AST_land_development: "土地開發"
 AST_land_development_desc: "為了讓[ROOT.GetFascistParty]推行對他們有利的政策，作為交換，主要商界人士已同意投資符合該黨目標的工業改革。\n\n[ROOT.GetName]過多的土地仍未工業化且發展不足。通過開發這些地區，我們將使其適宜進行建設。"
 AST_electrical_grid_expansions: "電網擴建"
 AST_electrical_grid_expansions_desc: "為了讓[ROOT.GetFascistParty]推行對他們有利的政策，作為交換，主要商界人士已同意投資符合該黨目標的工業改革。\n\n通過擴展我們的電網，我們可以促進不依賴進口的國內能源生產。"
 AST_factory_investments: "工廠投資"
 AST_factory_investments_desc: "為了讓[ROOT.GetFascistParty]推行對他們有利的政策，作為交換，主要商界人士已同意投資符合該黨目標的工業改革。\n\n如果我們想確保在衝突時期軍用與民用物資都保持充足，就需要擴展我們的工業產能。"
 AST_develop_port_kemla_steel_medium_decision: "建造第二座肯布拉港高爐"
 AST_develop_port_kemla_steel_medium_decision_desc: "肯布拉港僅憑一座高爐便始終運作良好，但需求的增長讓我們或許需要建造第二座。這將使該地區的鋼鐵產量大致翻一番。"
 AST_prospect_pilbara_iron_decision: "開放皮爾巴拉地區進行採礦"
 AST_prospect_pilbara_iron_decision_desc: "皮爾巴拉地區擁有巨大的鐵礦石儲量，位居世界前列。然而，在這個國家極其偏遠的地區，開發這一資源所需的投資將是巨大的……但反過來，其利潤也將同樣巨大。"
 AST_scale_up_pilbara_mines_steel_decision: "擴大皮爾巴拉礦區"
 AST_scale_up_pilbara_mines_steel_decision_desc: "既然皮爾巴拉地區已開放大規模開採，現在是讓投資流入的時候了！"
 AST_pilbara_mining_tt: "向§Y$STATE_870$§!開放進一步的勘探，將解鎖一項可重複執行的決議，可以無限地提高鋼鐵產量。"
 AST_scale_up_middleback_mines_steel_decision_1: "擴大艾恩諾布礦場"
 AST_scale_up_middleback_mines_steel_decision_1_desc: "儘管艾恩諾布礦場已運營一段時間，但隨著鐵礦石需求的不斷增長，現在是時候在此地擴大我們的投入了。"
 AST_scale_up_middleback_mines_steel_decision_2: "開放鐵君主礦場"
 AST_scale_up_middleback_mines_steel_decision_2_desc: "艾恩諾布礦場已無法滿足我們的需求，幸運的是中背山脈富含鐵礦。是時候建立我們迄今為止最大的礦山了！"
 AST_scale_up_middleback_mines_steel_decision_3: "開放鐵親王礦場"
 AST_scale_up_middleback_mines_steel_decision_3_desc: "戰爭使得對金屬的需求達到了史無前例的高度，而中背山脈仍能持續提供供應。"
 AST_expand_iron_mining_tt: "同時擁有§Y$AST_exports_for_economic_recovery$§!和§Y$AST_within_reach$§!將使我們能夠開發§Y$STATE_870$§!的皮爾巴拉地區，釋放近乎無限的§Y鋼鐵§!資源。我們可以利用這一點來推動我們的經濟發展。"
 AST_develop_port_kemla_steel_tt: "這將使我們能夠採用§Y建造第二座肯拉港高爐§!決議，從而顯著提升我們的§Y鋼鐵§!產量。"
 AST_develop_middleback_tt: "這將解鎖三項決議，以發展我們在§Y$STATE_519$§!的§Y鋼鐵§!生產"
 AST_expand_planned_extraction_pilbara_tt: "§Y$AST_planned_extraction$§!將開啟對§Y$STATE_870$§!的皮爾巴拉地區的開發，以此將獲得近乎取之不盡的§Y鋼鐵§!資源。我們可將其用於推動本國經濟發展。"
 AST_ireland_weapon_smuggling_cat: "武裝愛爾蘭人"
 AST_smuggle_arms_to_ireland: "向愛爾蘭走私武器"
 AST_smuggle_arms_to_ireland_desc: "我們必須為愛爾蘭人提供對抗英國人所需的武器。"
 AST_smuggle_arms_to_ireland_ongoing_flag: "武器走私§Y進行中§!"
 AST_smuggle_arms_to_northern_ireland: "向北愛爾蘭走私武器"
 AST_smuggle_arms_to_northern_ireland_desc: "如果我們能確保北愛爾蘭的武器供應充足，並與愛爾蘭建立足夠的聯繫，我們將能使其在英國介入之前完成與愛爾蘭的統一。"
 AST_northern_ireland_rises_up: "北愛爾蘭起義"
 AST_specialize_on_jungle_combat: "專精叢林作戰"
 AST_specialize_on_desert_combat: "專精沙漠作戰"
 AST_switch_combat_specialization: "切換作戰專精"
 AST_special_forces_cat: "特種部隊訓練"
 AST_you_can_switch_sf: "你將可以切換專精。"
 AST_training_camps_specialization: "我們的訓練營已準備好為我們的部隊提供專門訓練，提高其在各個戰區中的戰鬥力。"
 # Formables
 AST_australasia_flag: "§Y澳大拉西亞§!已成立"
 AST_australia_formables_category: "澳大拉西亞"
 AST_australia_formables_category_desc: "儘管[AST.GetName]的根脈始終將我們與遙遠的南方相連，但我們的臂膀已伸得又長又遠，使他人再也無法將我們對全球事務的看法置於不顧。我們開始擴張，並將不斷擴張，而一個新的國名將昭示這一點。我們將自[AST.GetName]的繭中破出，展翅翱翔，讓世界為之讚歎與認可，以我們的色彩與紋章命名為南方的新國度——澳大拉西亞。"
 AST_form_australasia: "成立澳大拉西亞"
 AST_form_australasia_malenesia_required_states_tt: "控制所有§Y美拉尼西亞§!地區。"
 AST_form_australasia_new_zealand_required_states_tt: "控制所有§Y[NZL.GetNonIdeologyName]§!地區。"
 AST_form_australasia_malenesia_core_states_tt: "獲得所有§Y美拉尼西亞§!地區的核心。"
 AST_form_australasia_new_zealand_core_states_tt: "獲得所有§Y[NZL.GetNonIdeologyName]§!地區的核心。"
 AST_integrate_indonesia: "整合[INS.GetNonIdeologyName]"
 AST_integrate_indonesia_indonesia_required_states_tt: "控制所有§Y[INS.GetNonIdeologyName]§!地區。"
 AST_integrate_indonesia_indonesia_core_states_tt: "獲得所有§Y[INS.GetNonIdeologyName]§!地區的核心。"
