 SIA_poster_center_days_remaining_text: "剩餘§Y[?SIA_propaganda_center_days_remaining_flag:days_left|Y0]§!日"
 SIA_poster_right_days_remaining_text: "剩餘§Y[?SIA_propaganda_right_days_remaining_flag:days_left|Y0]§!日"
 SIA_propaganda_campaign_cooldown_tt: "該宣傳活動將在被移除§Y[?constant:propaganda.SIA.default_propaganda_campaign_cooldown]日§!後再次可用。"
 SIA_public_credit_repayment: "公共信貸償還"
 SIA_public_credit_repayment_tt: "我們將一次性償還全部公共信貸，以承受巨大的臨時§Y消費品§!懲罰為代價，消除所有債務。"
 idea_SIA_deficit_spending: "赤字財政"
 idea_SIA_deficit_spending_desc: "政府正在入不敷出地開支，將借來的資金注入一項加速建設計劃。工業上的收益是真實的，但賬單終將到期。"
 SIA_print_additional_money: "印更多錢"
 SIA_print_additional_money_tt: "我們會為日本印更多錢。"
 SIA_appeal_to_industrialists: "拉攏實業家"
 SIA_implement_industrialists_reforms_countdown: "推行工業改革"
 SIA_implement_industrialists_reforms_countdown_trigger: "建造§Y2座民用工廠§!（不包括通過國策和貿易獲得的工廠）"
 SIA_appeal_to_industrialists_tt: "我們將獲得實業家的支持。\n\n他們將在內戰中為我們提供幫助，給予我們額外的裝備。但他們期望我們在掌權後的§Y720天§!內，通過在內戰結束時已有的工廠基礎上再建造§Y2§!座額外的§Y民用工廠§!來擴大工業基礎（不包括通過國策或貿易獲得的工廠）。\n\n若未能做到，將導致§Y穩定性§!和§Y戰爭支持度§!下降。\n\n內戰開始時，我們將獲得："
 SIA_seek_support_from_constitutional_monarchists: "爭取立憲君主派支持"
 SIA_implement_constitutionalist_reforms_countdown: "推行憲政改革"
 SIA_seek_support_from_constitutional_monarchists_tt: "我們將獲得立憲君主派的支持。\n\n他們將在內戰中為我們提供幫助，增派額外部隊。但他們期望我們在掌權後的§Y720天§!內完成§Y$SIA_a_constitutional_monarchy$§!國策，以維持君主立憲制。\n\n若未能做到，將導致§Y穩定性§!和§Y戰爭支持度§!下降。"
 SIA_appeal_to_rural_people: "爭取農村民眾支持"
 SIA_appeal_to_rural_people_tt: "我們將獲得農村民眾的支持。\n\n他們將在內戰中為我們提供幫助，給予民兵部隊。但他們期望我們在掌權後的§Y720天§!內，通過完成§Y$SIA_mechanization_of_agriculture$§!或§Y$SIA_reduction_of_agricultural_yield_taxes$§!國策，來通過有利的農業政策作為回報。\n\n若未能做到，將導致§Y穩定性§!和§Y戰爭支持度§!下降。\n\n內戰開始時，我們將獲得："
 SIA_implement_rural_reforms_countdown: "推行農村改革"
 SIA_implement_absolutist_reforms_countdown: "推行專制改革"
 SIA_seek_support_from_absolutists_monarchists: "爭取專制君主派支持"
 SIA_seek_support_from_absolutists_monarchists_tt: "我們將獲得專制君主派的支持。\n\n他們將在內戰中為我們提供幫助，增派額外部隊。但他們期望我們在掌權後的§Y720天§!內完成§Y$SIA_an_absolute_monarchy$§!國策，以恢復絕對君主制。\n\n若未能做到，將導致§Y穩定性§!和§Y戰爭支持度§!下降。"
 SIA_appeal_to_navy_clique: "爭取海軍派系支持"
 SIA_appeal_to_navy_clique_countdown: "推行海軍改革"
 SIA_appeal_to_navy_clique_tt: "我們將獲得海軍派系的支持。\n\n他們將在內戰中為我們提供幫助，給予我們全部海軍和一支海軍陸戰隊師。但他們期望我們在掌權後的§Y720天§!內完成§Y$SIA_thonburi_class_coastal_defense_ship$§!國策，以通過有利的海軍政策作為回報。\n\n若未能做到，將導致§Y穩定性§!和§Y戰爭支持度§!下降。\n\n內戰開始時，我們將獲得：\n§Y我們的整支海軍§!\n§Y皇家泰國海軍陸戰隊§!特種師\n§Y海軍陸戰隊§!科技"
 SIA_appeal_for_support_cat: "爭取支持"
 SIA_appeal_for_support_cat_desc: "沒有哪個政治運動能單憑自己成功。君主派、立憲派、軍人和平民，各自對國家的一部分擁有影響力。必須小心培植他們的支持，我們才有力量在時機到來之時果斷行動。"
 SIA_demand_independence: "要求§Y[FROM.GetName]§!從§Y[FROM.OVERLORD.GetNameDef]§!獨立"
 SIA_demand_independence_VIN: "要求釋放§Y[VIN.GetName]§!"
 SIA_demand_independence_VIN_tt: "我們會要求[VIN.GetName]的控制者給他們自由"
 SIA_demand_independence_LAO: "要求釋放§Y[LAO.GetName]§!"
 SIA_demand_independence_LAO_tt: "我們會要求[LAO.GetName]的控制者給他們自由"
 SIA_demand_independence_CAM: "要求釋放§Y[CAM.GetName]§!"
 SIA_demand_independence_CAM_tt: "我們會要求[CAM.GetName]的控制者給他們自由"
 SIA_invite_to_adc: "邀請§Y[FROM.GetName]§!加入我們的陣營"
 SIA_asian_democratic_compact_cat: "亞洲民主協定"
 SIA_asian_democratic_compact_cat_desc: "亞洲人民有權自治。作為亞洲自決的旗手，我們可以向殖民列強施壓，迫使其交出所控制的國家。"
 SIA_khana_ratsadon_cat: "人民黨"
 SIA_khana_ratsadon_cat_desc: "終結了絕對君主制的人民黨並非鐵板一塊。其軍方派與文官派對國家各有願景，兩者間的緊張關係潛藏於每一項決策之下。務必維持兩派滿意，否則聯合政府恐將分崩離析。"
 SIA_army_navy_reform_cat: "陸軍與海軍"
 SIA_army_navy_reform_cat_desc: "陸軍和海軍爭奪著同一池有限的資源。在兩軍之間轉移資金是一場持續的平衡術，每一次重新分配都會影響對方的戰備狀態。"
 SIA_divert_army_funds_to_navy_toggle: "[SIA_GetDivertingArmyFundsToNavyTitle]"
 SIA_divert_army_funds_to_navy_toggle_tt: "[SIA_GetDivertingArmyFundsToNavyTT]"
 SIA_divert_army_funds_to_navy_toggle_do: "將陸軍資金轉撥給海軍"
 SIA_divert_army_funds_to_navy_toggle_do_tt: "我們將把部分陸軍資金轉撥給海軍，以加速其發展。"
 SIA_divert_army_funds_to_navy_toggle_undo: "停止將陸軍資金轉撥給海軍"
 SIA_divert_army_funds_to_navy_toggle_undo_tt: "我們不再將部分陸軍資金劃撥給海軍。"
 SIA_standing_our_ground_mission: "堅持我方立場"
 SIA_standing_our_ground_mission_tt: "我們必須為自由而戰！"
 SIA_sway_generals_to_seri_thai_tt: "我們已爭取到的那批將軍將在內戰爆發時加入自由泰人一方，而非參與效忠者叛亂。"
 SIA_sway_general_cw_scale_tt: "內戰中的我方支持度提升§Y5%§!\n若支持度超過§Y80%§!，則可避免內戰，我方將兵不血刃地奪取政權"
 SIA_sway_luang_chawengsaksongkhram_to_seri_thai: "拉攏鑾·差勇薩頌堪"
 SIA_sway_luang_chawengsaksongkhram_to_seri_thai_desc: "將鑾·差勇薩頌堪爭取到自由泰人陣營。若成功，內戰爆發時他將站在我們一邊。"
 SIA_sway_aditya_dibabha_to_seri_thai: "拉攏阿提貼·阿帕"
 SIA_sway_aditya_dibabha_to_seri_thai_desc: "將阿提貼·阿帕爭取到自由泰人陣營。若成功，內戰爆發時他將站在我們一邊。"
 SIA_sway_mangkorn_phromyothi_to_seri_thai: "拉攏芒功·伏龍育提"
 SIA_sway_mangkorn_phromyothi_to_seri_thai_desc: "將芒功·伏龍育提爭取到自由泰人陣營。若成功，內戰爆發時他將站在我們一邊。"
 SIA_sway_luang_haansongkhram_to_seri_thai: "拉攏鑾·漢頌堪"
 SIA_sway_luang_haansongkhram_to_seri_thai_desc: "將鑾·漢頌堪爭取到自由泰人陣營。若成功，內戰爆發時他將站在我們一邊。"
 SIA_sway_charun_rattanakun_seriroengrit_to_seri_thai: "拉攏差倫·拉達那恭·社裡龍里"
 SIA_sway_charun_rattanakun_seriroengrit_to_seri_thai_desc: "將差倫·拉達那恭·社裡龍里爭取到自由泰人陣營。若成功，內戰爆發時他將站在我們一邊。"
 SIA_sway_phichit_kriangsakphichit_to_seri_thai: "拉攏披集·江沙披集"
 SIA_sway_phichit_kriangsakphichit_to_seri_thai_desc: "將披集·江沙披集爭取到自由泰人陣營。若成功，內戰爆發時他將站在我們一邊。"
 SIA_sway_jira_wichitsongkhram_to_seri_thai: "拉攏集拉·威集頌堪"
 SIA_sway_jira_wichitsongkhram_to_seri_thai_desc: "將集拉·威集頌堪爭取到自由泰人陣營。若成功，內戰爆發時他將站在我們一邊。"
 SIA_sway_phin_choonhavan_to_seri_thai: "拉攏屏·春哈旺"
 SIA_sway_phin_choonhavan_to_seri_thai_desc: "將屏·春哈旺爭取到自由泰人陣營。若成功，內戰爆發時他將站在我們一邊。"
 SIA_sway_tiang_sirikhan_to_seri_thai: "拉攏提昂·西里坎"
 SIA_sway_tiang_sirikhan_to_seri_thai_desc: "將提昂·西里坎爭取到自由泰人陣營。若成功，內戰爆發時他將站在我們一邊。"
 SIA_khana_ratsadon_dummy_military: "軍隊政變風險"
 SIA_khana_ratsadon_dummy_military_tt: "若我們過於激怒軍隊，他們將發動政變。為了避免內戰，我們不要讓§Y$idea_SIA_military_rebellious$§!持續太長時間。"
 SIA_khana_ratsadon_dummy_military_desc: "軍方在人民黨擁有強大勢力。他們不會批准有損其利益的政策，但會支持推動國家的軍事化。"
 SIA_khana_ratsadon_military_coup_mission: "軍隊正計劃推翻政府！"
 SIA_khana_ratsadon_military_coup_mission_desc: "軍隊認為當前的政府政策對其利益構成了威脅。若不提高他們的地位，他們將積極計劃推翻政府。"
 SIA_khana_ratsadon_dummy_civilian: "文官派政變風險"
 SIA_khana_ratsadon_dummy_civilian_tt: "若我們過於激怒文官派，他們將發動政變。為了避免內戰，我們不要讓§Y$idea_SIA_civilian_rebellious$§!持續太長時間。"
 SIA_khana_ratsadon_dummy_civilian_desc: "文官派在人民黨擁有強大勢力。他們不會批准有損其利益的政策，但會支持推動國家的民主化、文官化。"
 SIA_khana_ratsadon_civilian_coup_mission: "文官派正計劃推翻政府！"
 SIA_khana_ratsadon_civilian_coup_mission_desc: "文官派認為當前的政府政策對其利益構成了威脅。若不提高他們的地位，他們將積極計劃推翻政府。"
 SIA_promote_civilian_wing: "拉攏文官派"
 SIA_promote_civilian_wing_desc: "通過全力投入到文官派的土地改革、司法和憲法議程中，我們可以贏得比裡派系的感激。然而，這種偏袒並非無人察覺：軍官團會心生不滿，而在塵埃落定前，對日常行政的干擾將使我們付出沉重的代價。"
 SIA_promote_military_wing: "拉攏軍方派"
 SIA_promote_military_wing_desc: "通過縱容軍官的要求並炫耀武裝力量，我們可以贏得披汶派系的青睞。然而，這種偏袒並非無人察覺：重組會使軍隊的日常工作陷入混亂，而在塵埃落定前，對日常行政的干擾將使我們付出沉重的代價。這是一種粗暴的手段，只適用於將該派系從叛亂的邊緣拉回來。"
 SIA_cultivate_civilian_wing: "扶植文官派"
 SIA_cultivate_civilian_wing_desc: "王室局指令使我們得以耐心而持續地爭取文官的支持。沒有突然的偏袒激起反彈，只有緩慢而穩定的工作——通過一次次的讓步，逐步贏得比裡派系的支持。這是一條漫長的道路，但我們可以隨心所欲地走下去。"
 SIA_cultivate_military_wing: "扶植軍方派"
 SIA_cultivate_military_wing_desc: "王室局指令使我們得以耐心而持續地爭取軍方的支持。沒有突然的偏袒激起反彈，只有緩慢而穩定的工作——通過一次次的讓步，逐步贏得軍官團的支持。這是一條漫長的道路，但我們可以隨心所欲地走下去。"
 SIA_end_factionalism_mission: "維繫聯合政府"
 SIA_end_factionalism_mission_desc: "人民黨的兩派均堅定支持政府。如果能讓雙方在§Y270§!天內保持§G全力支持§!，兩派之間的紛爭便可永遠平息。若任何一方的熱情出現動搖，就必須從頭再來。"
