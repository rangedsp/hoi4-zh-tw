 INS_revolution_planning_cat: "地下革命"
 INS_revolution_planning_hq: "在[FROM.GetName]建立革命總部"
 INS_revolution_planning_hq_desc: "我們將在[FROM.GetName]設立民兵總部，作為我們在群島各地的民兵基地的中央指揮機構。我們的總部及其周邊地區將成為滲透行動的優先目標，並將牢牢處於我們的掌控之下。"
 INS_revolution_planning_hq_tt: "已建造最多§Y3§!個革命總部"
 INS_revolution_planning_hq_DONE: "革命總部"
 INS_revolution_planning_hq_DONE_desc: "這裡是我們的革命總部，民兵在此報到。一旦我們宣佈獨立，該地區將處於我們的控制之下。"
 INS_revolution_planning_hq_DONE_trigger_tt: "只能建立一個總部"
 INS_revolution_planning_envoy_DONE_trigger_tt: "無法在同一地區建立多個基地"
 INS_revolution_planning_envoy_DONE: "[FROM.GetName]的民兵基地"
 INS_has_revolutionary_hq: "已建立革命總部"
 INS_revolution_planning_influence_state: "在[FROM.GetName]建立民兵基地"
 INS_revolution_planning_influence_state_desc: "我們將派遣民兵前往[FROM.GetName]建立民兵基地，以確保當地革命者能與總部保持聯繫，並在我們宣佈獨立後更便於開展行動。"
 INS_revolution_planning_cat_map_name: "選擇一個地區來管理民兵活動"
 INS_state_revolution_hq_tt: "一旦我們宣佈獨立，該地區將由我們控制"
 INS_hq_warning: "§W§R在此設立總部十分困難，將消耗我們大部分資源。§!§!"
 INS_revolution_points_remaining_tt: "還能建造至少§Y1§!個民兵基地（當前剩餘§Y[?INS_revolution_points_remaining]§!個）"
 INS_revolution_planning_influence_state_points_notif_tt: "我們能夠在§Y[?INS_starting_revolution_points_count]§!個額外的§R非爪哇§!地區建立民兵基地。"
 INS_revolution_planning_influence_state_points_notif_tt_1: "我們將只能在§Y1§!個額外的§R非爪哇§!地區建立民兵基地。"
 INS_revolution_point_spend_tt: "在[FROM.GetName]建立了一處民兵基地"
 INS_revolution_points_in_state_tt: "[FROM.GetName]尚未擁有民兵基地"
