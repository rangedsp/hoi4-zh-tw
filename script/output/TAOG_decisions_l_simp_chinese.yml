 INS_soetardjo_petition: "蘇達喬請願等待批准中"
 INS_soetardjo_petition_desc: "蘇塔爾喬呼籲的圓桌會議已召開，會議得出結論，[INS.GetNameDef]必須滿足一系列經濟要求以確保自給自足。我們必須向這些目標展現出明確進展，否則[HOL.GetNameDef]最終將推翻決議以維持現狀。"
 INS_soetardjo_petition_refresh_tt: "重新激活任務：§Y蘇達喬請願等待批准中§!，任務限時為§Y120天§!。"
 INS_soetardjo_pending: "人民議會辯論《蘇塔爾喬自治請願書》"
 INS_soetardjo_pending_desc: "蘇塔爾喬是人民議會中以領導和平民族主義運動而聞名的議員。他目前正在組織一項請願，要求給予[INS.GetNameDef]更多自治權，並呼籲在荷蘭與印度尼西亞代表之間召開圓桌會議，以商討印度尼西亞人希望作為荷蘭聯邦一部分實現自治的意願。目前，該請願正在人民議會內部進行辯論。待這些辯論結束後，我們必須決定如何回應，而這份請願的後果意義重大。"
 INS_flag_legalized: "展示紅白旗是合法的"
 INS_owned_states_at_game_start_tt: "所有印度尼西亞地區"
 INS_win_condition_base_republic_warning: "擊垮東印度群島"
 INS_win_condition_base_republic_warning_desc: "我們必須繼續戰鬥，招募平民，並確保每一位印度尼西亞人心中的火焰持續燃燒。一旦我們推翻東印度群島的統治，[HOL.GetNameDef]將別無選擇，只能投降。"
 INS_win_condition_base_republic_real: "擊垮東印度群島"
 INS_win_condition_base_republic_real_desc: "我們必須繼續戰鬥，招募平民，並確保每一位印度尼西亞人心中的火焰持續燃燒。一旦我們推翻東印度群島的統治，[HOL.GetNameDef]將別無選擇，只能投降。"
 will_complete_when_conditions_met_tt: "滿足前置條件後將自動選擇。"
 INS_militias_cat: "人民武裝"
 INS_militias_basic_summon: "動員平民"
 INS_militias_basic_summon_desc: "我們將招募對印度尼西亞獨立充滿熱情的青年和學生，加入人民安全軍作為武裝民兵。"
 INS_militias_kris_repayment: "人民奉獻力量民兵要求投資蘇拉威西"
