 idea_AST_civil_war_on_their_own: "依靠我們自己"
 idea_AST_civil_war_on_their_own_desc: "我們必須獨自打贏這場戰爭。"
 ast_foreign_communist_influence_idea: "境外共產主義影響"
 ast_foreign_communist_influence_idea_desc: "來自澳大利亞的共產主義者正在影響我們！"
