 BUL_rearmament_main_factors_tt: "\n影響[ENG.GetAdjective]決策的主要因素：\n§G-公開譴責馬其頓內部革命組織\n-與§Y[ENG.GetNameWithFlag]§!保持良好外交關係\n-完成§Y永恆友誼條約§!或者§Y薩洛尼卡協定§!國策\n-意識形態上傾向民主主義\n-擁有與§Y[ENG.GetNameWithFlag]§!相同形態的政府§!\n§R-與§Y[ENG.GetNameWithFlag]§!關係差\n-支持馬其頓內部革命組織\n-委任波格丹·菲洛夫為顧問或國家領導人§!"
