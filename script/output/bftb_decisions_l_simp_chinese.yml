l_simp_chinese:
 GRE_1936_election_category: "1936年大選"
 GRE_1936_election_category_desc: "喬治二世重返王位之後的第一次選舉將在月末之前舉行。據說為了免遭再次被逼退位，國王已決意不惜一切代價加以應對，進而確保自己的統治。\n\n然而我國軍隊當中的部分人士私底下仍然效忠於著名的被流放者埃萊夫塞里奧斯·韋尼澤洛斯，並且他們也許會通過一些……比較強硬的手段來為希臘爭取一次自由且公正的選舉。"
 GRE_the_election_of_1936: "1936年希臘議會選舉"
 GRE_the_election_of_1936_desc: "喬治二世重返王位之後的第一次選舉將在月末之前舉行。據說為了免遭再次被逼退位，國王已決意不惜一切代價加以應對，進而確保自己的統治。"
 GRE_1936_election_tt: "如果§Y喬治二世§!國王沒有被逮捕，他將會介入一月的選舉並確保其忠君派臣屬繼續主導政府。\n"
 GRE_put_the_king_under_house_arrest: "對國王實施軟禁"
 GRE_put_the_king_under_house_arrest_desc: "如果我們阻止了喬治二世國王干涉希臘的民主進程，那麼想必更受歡迎的共和派韋尼澤洛斯黨人士將會贏得選舉。"
 GRE_1936_arrest_the_king_tt: "國王將會被逮捕，§Y韋尼澤洛斯黨人§!將會贏得選舉。\n"
 GRE_king_arrested: "國王受到軟禁"
 GRE_civil_war_imminent: "內戰將近！"
 GRE_civil_war_imminent_desc: "令人遺憾的是，共和派與君主派的緊張對峙即將達到頂峰，而內戰似乎已不可避免……"
