 GRE_pay_back_debt_to_the_ifc_category: "處理國際金融委員會債務"
 GRE_pay_back_debt_to_the_ifc_category_desc: "自1829年獨立戰爭之後，希臘就飽嘗負債之苦，然而上次大戰並未幫我們緩解財政問題。如果我們現在償清債務，將大大有助於確保表面上的經濟穩定。當然我們也可以寄希望於某些因抵制政治和經濟會議而誘發的極端政治運動，或者靜待時間流逝，任憑世界土崩瓦解，等待更極端的選項出現……\n\n欠§Y英國§!的§Y債務§!：[ROOT.GetDebtPercentageBritain]\n\n欠§Y法國§!的§Y債務§!：[ROOT.GetDebtPercentageFrance]\n\n欠§Y意大利§!的§Y債務§!：[ROOT.GetDebtPercentageItaly]\n\n總共已償還的§Y債務§!：[ROOT.GetDebtPercentagePaidTotal]"
