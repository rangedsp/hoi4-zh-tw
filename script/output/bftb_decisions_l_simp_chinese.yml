 GRE_attend_talks_with_the_presidium: "出席主席團座談"
 GRE_attend_talks_with_the_presidium_desc: "我國將派出代表團與[FROM.GetNameDefCap]主席團展開會晤，商議看能否說服其少量投資我國的軍事工業。"
 GRE_host_soviet_bureaucrats_in_greece: "在[ROOT.GetNameDef]招待[FROM.GetAdjective]官員"
 GRE_host_soviet_bureaucrats_in_greece_desc: "[FROM.GetNameDefCap]的代表團將會蒞臨考察我國，然後再決定是否對我國軍事工業進行適當的投資。"
 GRE_host_soviet_bureaucrats_in_greece_tt: "邀請§Y[FROM.GetAdjective]考察團§!"
 GRE_soviet_influence_tt: "對§Y[FROM.GetAdjective]§!的過分依賴將會置我國主權於危險的境地。\n"
 GRE_invest_back_into_neglected_siberian_regions: "再投資被忽視的西伯利亞省區"
 GRE_invest_back_into_neglected_siberian_regions_desc: "我們將向[FROM.GetNameDefCap]提議投資他們最受忽視的地區，以此互惠互利之舉，我們可以降低[FROM.GetAdjective]人所施加的影響力。"
