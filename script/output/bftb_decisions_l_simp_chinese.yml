 BUL_foreign_agreements_factions_ita_tt: "與§Y[ITA.GetNameWithFlag]§!不在同一陣營中（或者§Y[ITA.GetNameWithFlag]§!是§Y[ROOT.GetNameWithFlag]§!的附屬國）"
 BUL_uranium_concession_agreement: "對[FROM.GetNameDef]的鈾礦轉讓協議"
 BUL_uranium_concession_agreement_desc: "由於我們無法在最大程度上利用我國地層下儲備的鈾礦資源，因此對於我國和我們的[FROM.GetAdjective]盟友而言，簽訂一項為我國從他們那裡換取工農業生產必需的重要原料及產品的開採授權協議，對大家而言都更為獲益。"
 BUL_negotiate_claims_in_the_balkans: "協商巴爾幹領土宣稱"
 BUL_negotiate_claims_in_the_balkans_desc: "在我們與任何主要大國結盟前，我們必須就我國領土宣稱問題與德國人展開協商。世界局勢正日益緊張，而保加利亞只會為在我國領土問題上提供最佳出價的國家搖旗吶喊。"
 BUL_demand_our_historical_claims: "索取歷史宣稱"
 BUL_secure_occupation_in_balkan_state: "確保對[FROM.GetName]實施佔領"
 BUL_secure_occupation_in_balkan_state_desc: "我們必須為我國的統治標榜“和平捍衛者”的美名並且說服盟友們移交此地區的管控權，通過對[ROOT.GetFactionName]駐軍實現減負，使其可以投身於其他戰線。"
 BUL_secure_occupation_in_balkan_state_tt: "（§Y人力§!以及§Y步兵裝備§!庫存不足的國家將更容易接受此項議案）"
 BUL_bulgarian_reintegration_campaign: "對[FROM.GetName]保加利亞化再整合"
 bulgarian_territorial_expansion_arranged: "預定保加利亞擴張領土"
 BUL_bulgarian_territorial_expansion_arranged_tt: "如果具有§Y預定保加利亞擴張領土§!修正的地區被同處於德國所在陣營的盟友所控制，那麼此地區將會被立刻移交予保加利亞"
 BUL_align_bulgaria: "與保加利亞結盟"
 BUL_align_bulgaria_desc: "我們與保加利亞已經保持了數十年的友好外交關係，而且正是得益於我們的經濟援助，保加利亞政府才終於得以應對其岌岌可危的債務。因此，現在是時候正式提名他們成為[GER.GetNameDef]的盟友了。"
 BUL_germany_donate_fighters: "援贈保加利亞戰鬥機"
 BUL_germany_donate_fighters_desc: "我們將向新近重建的保加利亞空軍援贈一小批作戰飛機。"
 BUL_germany_demand_military_access: "要求保加利亞授權軍事過境"
 BUL_germany_demand_military_access_desc: "我們必須要求保加利亞授予我國軍事通行權，這樣即便他們屆時不會參與我們在巴爾幹的戰事，我軍部隊也能依託保加利亞邊境作為基點發動對希臘的入侵。"
 BUL_germany_demand_replacement_of_bulgarian_prime_minister: "要求保加利亞更迭首相"
 BUL_germany_demand_replacement_of_bulgarian_prime_minister_desc: "目前的保加利亞首相格奧爾基·喬塞瓦諾夫已證明其不過是個無能政客，我們應當建議[BUL.GetLeader]提拔一位更加契合我方理念的政治家去替換此人，例如波格丹·菲洛夫。"
 BUL_donate_aircraft_tt: "如果[BUL.GetNameDef]接受我方援贈，那麼便能夠提升他們對我們的評價，進而促進兩國接下來的合作事項。"
 BUL_the_balkan_federation_dream: "巴爾幹聯邦之夢"
 BUL_the_balkan_federation_dream_desc: "為了應對無產階級的諸多敵人，[ROOT.GetNameDefCap]必須努力促使一個強大的巴爾幹聯邦橫空出世，我們要讓巴爾幹諸國明白，深化各國人民的團結合作是走出當前困境的唯一道路，而這條道路，將會最終指向整個巴爾幹的徹底統一……"
 BUL_develop_balkan_federation_project: "巴爾幹聯邦計劃"
 BUL_develop_balkan_federation_project_desc: "我們必須召集政經工社等各領域的專家賢達齊聚一堂，在總結分析1920年代巴爾幹聯邦計劃流產原因的基礎上，重新起草一份兼容並蓄、足以確保巴爾幹諸國都能得到公平對待的新計劃草案。"
 BUL_balkan_federation_propaganda: "巴爾幹聯邦宣傳運動"
 BUL_balkan_federation_propaganda_desc: "為了巴爾幹聯邦計劃方案能在[FROM.GetAdjective]無產階級大眾當中獲得廣泛支持，我們將會在[FROM.GetNameDef]組織一場聲勢浩大的宣傳活動。"
 BUL_destabilize_country: "動搖[FROM.GetNameDef]穩定"
 BUL_destabilize_country_desc: "我們必須派遣[ROOT.GetAdjective]特工人員潛入到[FROM.GetNameDef]當中，並召集當地擁護聯邦建設計劃的活躍成員，通過為其提供基礎訓練並編組武裝游擊隊的方式動搖該國穩定。"
 BUL_fight_alongside_country_comrades: "攜手[FROM.GetAdjective]同志共奮戰"
 BUL_fight_alongside_country_comrades_desc: "我們必須對深陷[FROM.GetAdjective]內戰泥潭當中的[FROM.GetNameDef]同志伸出援手，攜手並肩，直至鬥爭的最終勝利。"
 BUL_fight_alongside_country_comrades_join_cw_tt: "§Y[ROOT.GetNameWithFlag]§!將會在該國內戰中加入§Y[FROM.GetNameWithFlag]§!一方。"
 BUL_balkan_federation_industrial_aid: "對[FROM.GetNameDef]工業援助"
 BUL_balkan_federation_industrial_aid_desc: "我們將向[FROM.GetAdjective]政府提供援助，幫助其在加入[ROOT.GetFactionName]之前，努力發展[FROM.GetNameDef]所缺乏的國家工業。"
 BUL_balkan_federation_economic_aid: "對[FROM.GetNameDef]經濟援助"
 BUL_balkan_federation_economic_aid_desc: "我們將向[FROM.GetAdjective]提供經濟援助，幫助其在加入[ROOT.GetFactionName]之前，[FROM.GetNameDef]岌岌可危的經濟不至於崩潰。"
 BUL_balkan_federation_military_aid: "對[FROM.GetNameDef]軍事援助"
 BUL_balkan_federation_military_aid_desc: "我們將向[FROM.GetAdjective]政府提供軍事援助，幫助其在加入[ROOT.GetFactionName]之前，對[FROM.Capital.GetName]周遭城鄉地區藏匿的異見者發起清剿行動。"
 BUL_balkan_federation_project_ready_flag: "巴爾幹聯邦計劃已準備就緒。"
 BUL_balkan_federation_demand_turkish_territory: "要求土耳其割地"
 BUL_balkan_federation_demand_turkish_territory_desc: "我們將會派遣外交使團面見[TUR.GetLeader]，就有關[TUR.GetAdjective]向[BUL.GetNameDef]割讓其巴爾幹領土的事宜進行磋商。"
 BUL_plot_against_boris_dec_cat: "陰謀暗算鮑里斯"
 BUL_plot_against_boris_dec_cat_desc: "[GetPlotAgainstBorisFocusLoc]"
 BUL_brainwash_political_prisoners: "脅迫政治犯"
 BUL_brainwash_political_prisoners_desc: "我國的某位政治犯將會被脅迫去完成我們這項“骯髒的工作”，如此一來，即便屆時東窗事發，也不會有政府成員被這場暗殺企圖所牽連。"
 BUL_persuade_faction_members: "勸服[GetFactionMembersToPersuade]成員"
 BUL_persuade_faction_members_desc: "我們將向供職於政府內部的反沙皇派系成員提供一筆數額驚人的鉅款，以驅使其為我們物色適合執行計劃的人選。"
 BUL_persuade_zveno_members: "[GetZvenoName]"
 BUL_persuade_bs_members: "[GetBsName]"
 BUL_persuade_bzns_members: "[GetBznsName]"
 BUL_persuade_nsm_members: "[GetNsmName]"
 BUL_persuade_generic_members: "派系"
 BUL_draw_up_a_plan_for_regicide: "謀定弒君計劃"
 BUL_draw_up_a_plan_for_regicide_desc: "是時候展開最後的準備並且決定行動時間和地點了。"
 BUL_seek_foreign_support: "尋求外國支持"
 BUL_seek_foreign_support_desc: "為了幫助我們更加巧妙地實行暗殺，同時也為了將來政府向公眾披露有關此次“意外”的報告時獲得足夠的信用擔保，我們必須尋求外國勢力的支持。"
 BUL_execute_plan: "執行暗殺計劃"
 BUL_execute_plan_desc: "我們已經等到了千載難逢的良機，是時候執行計劃了！\n去見上帝吧，鮑里斯……"
 BUL_has_repressed_faction_tt: "已鎮壓任意派系"
 BUL_has_imprisoned_faction_leaders_tt: "已拘捕任意派系領導層"
 BUL_has_integrated_faction_tt: "已整合任意派系"
 BUL_seek_foreign_support_variable_reduction_tt: "縮短刺殺鮑里斯沙皇時所需時間。"
 BUL_seek_foreign_support_reduced_stability_penalty_tt: "降低沙皇身亡後的穩定度懲罰。"
 BUL_assassin_persuaded_flag: "已脅迫某位政治犯或勸服某位已整合派系的成員"
 BUL_the_fate_of_the_balkans_dec_cat: "巴爾幹諸國之命運"
 BUL_the_fate_of_the_balkans_dec_cat_desc: "長久以來，保加利亞一直受外部勢力及其利益所肆意支配……\n然而如今時代已變，在我國繁榮昌盛的背景下，終於到了[ROOT.GetNameDef]攫取巴爾幹地區霸權的時候了。"
 BUL_fate_of_the_balkans_influence_government: "影響[FROM.GetAdjective]政府"
 BUL_fate_of_the_balkans_influence_government_desc: "我們將會與[FROM.GetAdjective]的某些政府閣僚建立聯繫，努力對其政府決策向著有利於我國利益的方向進行引導，同時規勸其採取對[ROOT.GetNameDef]友好的外交政策。當然，為達成這一目的，我們不僅要在他們身上花一些小錢，或許還要找找他們的小辮子。"
 BUL_fate_of_the_balkans_influence_government_tt: "[FROM.GetFlag]§Y[FROM.GetNameDefCap]§!將在未來更加傾向於服從保加利亞。"
 BUL_fate_of_the_balkans_influence_government_autonomy: "保加利亞親善宣傳"
 BUL_fate_of_the_balkans_ultimatum: "對[FROM.GetNameDef]最後通牒"
 BUL_fate_of_the_balkans_ultimatum_desc: "我們將會與[FROM.GetAdjective]政府組織會談，強邀其加入[ROOT.GetFactionName]並接受[ROOT.GetAdjective]的保護。我們亦會讓[FROM.GetAdjective]明白，若是不從，我國政府將絕不會善罷甘休。"
 BUL_fate_of_the_balkans_ultimatum_tt: "\n影響[FROM.GetFlag]§Y[FROM.GetNameDefCap]§!接受意願的因素：[ROOT.GetUltimatumOpinion][ROOT.GetUltimatumStrength][ROOT.GetUltimatumIdeology][ROOT.GetUltimatumFaction][ROOT.GetUltimatumInfluence][ROOT.GetUltimatumNeighbor][ROOT.GetUltimatumMajor]"
 BUL_ultimatum_opinion_high: "\n-§G對[ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§!的評價高§!"
 BUL_ultimatum_opinion_medium: "\n-§Y對[ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§!的評價§!"
 BUL_ultimatum_opinion_low: "\n-§R對[ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§!的評價低§!"
 BUL_ultimatum_strength_high: "\n-[ROOT.GetFlag]§Y[ROOT.GetAdjective]§!§G軍事實力強§!"
 BUL_ultimatum_strength_medium: "\n-[ROOT.GetFlag]§Y[ROOT.GetAdjective]軍事實力§!"
 BUL_ultimatum_strength_low: "\n-[ROOT.GetFlag]§Y[ROOT.GetAdjective]§!§R軍事實力弱§!"
 BUL_ultimatum_ideology_high: "\n-§G相同意識形態§!"
 BUL_ultimatum_ideology_medium: "\n-§Y可接受意識形態§!"
 BUL_ultimatum_ideology_low: "\n-§R是[FROM.GetRulingIdeology]§!"
 BUL_ultimatum_faction_good: ""
 BUL_ultimatum_faction_bad: "\n-§R是[FROM.GetFactionName]成員§!"
 BUL_ultimatum_influence_good: "\n-§G受到§![ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§!影響"
 BUL_ultimatum_influence_bad: ""
 BUL_ultimatum_neighbor_good: "\n-§G毗鄰§![ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§!"
 BUL_ultimatum_neighbor_bad: "\n-§R不毗鄰§![ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§!"
 BUL_ultimatum_is_not_major: ""
 BUL_ultimatum_is_major: "\n-§R是主要國家§!"
 BUL_fate_of_the_balkans_bring_back_state: "收復[FROM.GetName]"
 BUL_fate_of_the_balkans_bring_back_state_desc: "我們將會派遣外交使團前往[FROM.Controller.GetNameDef]，要求對方將[FROM.GetName]歸還於其法理所有者[ROOT.GetNameDef]。"
 BUL_fate_of_the_balkans_demand_submission: "勒令[FROM.GetNameDef]臣服"
 BUL_fate_of_the_balkans_demand_submission_desc: "[ROOT.GetAdjective]代表使團將被派往[FROM.GetAdjective]首都，勒令[FROM.GetName]奉迎[ROOT.GetNameDef]為其宗主國。"
 BUL_fate_of_the_balkans_demand_submission_tt: "擁有較[FROM.GetNameDef]更強的軍事實力將提升其服從我方意願的概率。"
 BUL_dominance_in_the_seas: "制霸諸洋"
 BUL_dominance_in_the_black_sea_mission: "制霸黑海"
 BUL_dominance_in_the_black_sea_mission_desc: "為了實現保加利亞對諸洋的制霸，我們必須清除黑海沿岸任何可能的威脅，並利用新佔據的領土提升軍艦的製造能力。"
 BUL_dominance_in_the_aegean_sea_mission: "制霸愛琴海"
 BUL_dominance_in_the_aegean_sea_mission_desc: "為了實現保加利亞對諸洋的制霸，我們必須清除愛琴海沿岸任何可能的威脅，並利用新佔據的領土提升軍艦的製造能力。"
 BUL_dominance_in_the_adriatic_sea_mission: "制霸亞得里亞海"
 BUL_dominance_in_the_adriatic_sea_mission_desc: "為了實現保加利亞對諸洋的制霸，我們必須清除亞得里亞海沿岸任何可能的威脅，並利用新佔據的領土提升軍艦的製造能力。"
 BUL_appoint_tsankov: "委任亞歷山大·燦科夫首相"
 BUL_appoint_tsankov_desc: "現在是時候調整航線，採取更加激進的政策了。亞歷山大·燦科夫及其統率的國家社會主義運動將是引領這個國家的最合適選項。"
 BUL_appoint_georgiev: "委任基蒙·格奧爾基耶夫首相"
 BUL_appoint_georgiev_desc: "基蒙·格奧爾基耶夫如今已貴為祖國陣線中舉足輕重的領導人之一，是時候認可其功績並邀請他出任[ROOT.GetNameDef]的國家首相了。"
 BUL_balkan_confederation_industrial_investment: "對[FROM.GetNameDef]工業投資"
 BUL_balkan_confederation_industrial_investment_desc: "為對[FROM.GetAdjective]政府施加影響，我們將會鼓勵[BUL.GetAdjective]工業巨頭展開一系列促進[BUL.GetAdjective]在[FROM.GetNameDef]附屬產業的投資，在刺激該國工業發展的同時，提升我們對其國家的掌控。"
 BUL_balkan_confederation_capital_injection: "對[FROM.GetNameDef]資本投注"
 BUL_balkan_confederation_capital_injection_desc: "我們將向經營不善的[FROM.GetAdjective]企業投注資金援助，在穩定該國金融秩序的同時，間接性的強化[BUL.GetAdjective]對[FROM.GetNameDef]經濟的控制。"
 BUL_balkan_confederation_balkan_summit: "舉辦巴爾幹峰會"
 BUL_balkan_confederation_balkan_summit_desc: "我們將邀請巴爾幹的所有主權國家前來參與巴爾幹峰會，而我們將得以在峰會上潛移默化地宣揚我方理念，同時提升保加利亞在地區諸國中的影響力。"
 BUL_balkan_confederation: "巴爾幹邦聯"
 BUL_balkan_confederation_desc: "[GetABalkanConfederationFocusLoc]"
 BUL_balkan_confederation_ai_tt: "§Y[FROM.GetNameWithFlag]§!將更傾向於接受我方外交議案。"
 BUL_balkan_confederation_balkan_summit_cooldown_tt: "[GetDecisionCooldownTooltip]§Y365日§!。\n"
 BUL_balkan_confederation_cooldown_tt: "[GetDecisionCooldownTooltip]§Y365日§!。\n"
