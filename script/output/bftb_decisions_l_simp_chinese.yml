 BUL_ff_root_out_sympathizers_desc: "那些曾公開支持祖國陣線及其理念者必須被抓捕歸案，其後施加正義的審判。"
 BUL_ff_massive_arrests: "大規模搜捕"
 BUL_ff_massive_arrests_desc: "為了終結祖國陣線的威脅，必須要採取更加激進的措施，鑑於此，我們將展開大規模的突襲搜查，對任何與該組織有關聯者予以抓捕。"
 BUL_ff_deal_the_final_blow: "實施終結打擊"
 BUL_ff_deal_the_final_blow_desc: "如今我們已極大地削弱了共黨分子的勢力，如此一來，祖國陣線的愚蠢叛亂可謂是命懸一線……我們已扼住他們命運的咽喉，並將在此徹底終結他們！"
 BUL_ff_approaching_faction_timer_effects_tt: "該派系將加入祖國陣線，並根據§Y該派系的支持率§!縮短觸發§Y祖國陣線政變將近§!前的天數。§Y該派系對政府的忠誠度§!則將略微降低此影響。"
 BUL_ff_approaching_faction_cw_effects_tt: "如果此派系加入祖國陣線，則叛亂將會得到加強。"
 BUL_ff_preventive_action_taken_tt: "降低§G[?BUL.BUL_ff_preventive_actions_base_value]%§!的祖國陣線政變概率。\n其上限值為§Y[?BUL.BUL_ff_preventive_actions_cap_value]%§!。"
 BUL_ff_deal_the_final_blow_tt: "我們將一勞永逸地根除祖國陣線！"
