 BUL_impending_zveno_coup_desc: "[GetZvenoCoupDesc]"
 BUL_impending_zveno_coup_size_tt: "[GetZvenoName]的支持者們挑起了一場內戰。\n環節集團在內戰開始時的軍隊規模將基於其派系支持率決定。"
 BUL_macedonian_revolutionary_organizations: "馬其頓革命組織"
 BUL_macedonian_revolutionary_organizations_desc: "[GetImroDecisionCategoryDesc]"
 BUL_macedonian_revolutionary_organizations_cooperation_desc: "鑑於我們必須在未來有朝一日對馬其頓的統治當中尋求與當地人展開合作，因此馬其頓內部革命組織（IMRO）或許將會是適用於此的完美工具。它不僅可以提升當地對保加利亞的好感，從長遠上看亦能促進實現對馬其頓的完全吞併。"
 BUL_macedonian_revolutionary_organizations_hostile_desc: "長久以來，馬其頓內部革命組織（IMRO）便被視作巴爾幹地區的災厄。面對這些與其說是革命者，毋寧說是匪盜的洪水猛獸，我們必須果斷出擊剿滅其依舊在保加利亞境內活動的殘部，徹底終結此等亂黨的恐怖肆虐。"
 BUL_repress_imro_propaganda: "反IMRO宣傳動員"
 BUL_repress_imro_propaganda_desc: "我們將在全國範圍內推行反對馬其頓內部革命組織的動員活動，通過演說、集會以及遊行等多種方式對該組織進行公開譴責。"
 BUL_repress_imro_persecute_activists: "清剿IMRO激進成員"
 BUL_repress_imro_persecute_activists_desc: "我們將對任何在本國境內煽動革命的叛黨以及活躍分子發動追捕並對其降下正義的審判。"
 BUL_repress_imro_destroy_organization: "消滅IMRO殘黨"
 BUL_repress_imro_destroy_organization_desc: "我們將在馬其頓交界沿線發起軍事行動，一勞永逸地根除馬其頓內部革命組織。"
 BUL_support_imro_make_contacts: "與IMRO聯絡"
 BUL_support_imro_make_contacts_desc: "我們將與馬其頓內部革命組織展開秘密聯絡，同時說服其領導層相信，與保加利亞政府展開合作是雙贏的選項。"
 BUL_support_imro_supply_activists: "資助IMRO成員"
 BUL_support_imro_supply_activists_desc: "我們將向馬其頓內部革命組織提供武器裝備，幫助其滲透南斯拉夫和希臘所屬馬其頓地區，進而動搖當地統治秩序。"
 BUL_support_imro_prepare_bulgarian_occupation: "準備策應保方統治"
 BUL_support_imro_prepare_bulgarian_occupation_desc: "馬其頓內部革命組織必須即刻組建聽命於保方的行動委員會，一旦保加利亞實現地區佔領，前者將確保立即接管地方政府。"
 BUL_support_imro_militias: "整編IMRO武裝"
 BUL_support_imro_militias_desc: "我們必須利用馬其頓革命黨的經驗，組建馬其頓內部革命組織民兵武裝為我軍效力。"
 BUL_support_imro_garrisons: "委任IMRO守備隊"
 BUL_support_imro_garrisons_desc: "鑑於馬其頓內部革命組織的成員作為本地人顯然能在維持地方治安工作方面更勝一籌，他們將被委任承擔我國馬其頓領土的守備任務。"
 BUL_macedonian_revolutionary_organizations_foreign: "$BUL_macedonian_revolutionary_organizations$"
 BUL_macedonian_revolutionary_organizations_foreign_desc: "馬其頓內部革命組織（IMRO），這個親保加利亞的組織長久以來便被視作巴爾幹地區的災厄，如今他們已經得到了其保加利亞主子的扶持和武裝，意欲在我國境內製造破壞並散佈保加利亞的價值理念。我們必須將其粉碎，徹底終結此等亂黨的恐怖肆虐。"
 BUL_repress_imro_foreign: "清剿IMRO激進成員"
 BUL_repress_imro_foreign_desc: "我們將對任何在本國境內煽動革命的叛黨以及活躍分子發動追捕並對其降下正義的審判。"
 BUL_destroy_imro_foreign: "消滅IMRO"
 BUL_destroy_imro_foreign_desc: "我們必須在馬其頓地區全境發起軍事行動，一勞永逸地根除馬其頓內部革命組織。"
