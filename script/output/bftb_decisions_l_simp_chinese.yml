 GRE_recommission_the_american_battleships: "復役美國戰列艦"
 GRE_recommission_the_american_battleships_desc: "自希土戰爭以來，戰列艦基爾基斯號和利姆諾斯號的處境就有些尷尬，但是隻要花費稍許的耐心與決心加以改裝，我們就可以使她們再度適合海戰。"
 GRE_build_the_salamis: "重建薩拉米斯號"
 GRE_build_the_salamis_desc: "在德國的幫助下，我們將得以重建在1932年被目光短淺地廢棄的戰列巡洋艦——薩拉米斯號。幸運的是，我們依然還保留有舊船體，所以從某種程度上來說這也不算從頭再來。"
