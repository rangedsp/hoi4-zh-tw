 byz_restore_byzantium_desc: "第二希臘文明毫無疑問是我國曆史上最輝煌奪目的篇章，就算如今那些西方蠻夷試圖在我們身上另套一層所謂“新希臘人”的外衣，我們也決不會摒棄我們的歷史傳承！"
