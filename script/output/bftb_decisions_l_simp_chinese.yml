 BUL_the_fatherland_front_dec_cat_desc: "[GetFfDecisionCategoryDesc]"
 BUL_the_fatherland_front_desc_planning: "§Y祖國陣線§!的領導層正為發動政變進行準備。\n鑑於此，他們勢必將尋求[GetZvenoName]、[GetBsName]以及[GetBznsName]對其給予支持。\n我們可以採取以下幾項行動對其密謀進行阻礙，同時弱化其顛覆政府的企圖：\n-搜捕§Y祖國陣線§!的支持者以及領導層。\n-消滅或整合其可能聯絡的派系。\n-當§Y共產主義支持§!少於1點時我們便能夠對§Y祖國陣線§!發動終結打擊。"
 BUL_the_fatherland_front_desc_coup: "祖國陣線領導層現已完成政變密謀，如今正窺探良機對其付諸實施。\n政變發生的概率為：\n基礎值§Y10%§![GetAtWarFfPercentage][GetAllyAtWarFfPercentage][GetSovNeighborFfPercentage][GetCommunistSovFfPercentage]"
