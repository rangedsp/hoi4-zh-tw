 BUL_internal_factions_desc: "鑑於如今的保加利亞社會乃至政界已經分裂為諸多派系，政府將不得不採取行動以妥善應對。保加利亞政府必須定奪這些派系中哪些可以為國家利益服務；哪些對政府構成了威脅，為了國家的利益必須予以剷除。"
