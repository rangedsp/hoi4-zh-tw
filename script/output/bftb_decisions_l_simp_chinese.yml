 GRE_move_capital_to_constantinople: "遷都君士坦丁堡"
 GRE_move_capital_to_constantinople_desc: "第二希臘文明的首都君士坦丁堡被譽為“所有希臘人的夢想和希望”及世界渴望之城。我們可以把我國的首都遷往舊都，以展示我們重拾的偉大。"
 move_capital_to_thessaloniki: "遷都塞薩洛尼基"
 move_capital_to_thessaloniki_desc: "雅典是第一希臘文明的首都，君士坦丁堡是第二希臘文明的首都，而塞薩洛尼基則是希臘歷史上永恆的“共有首都”，同時它也將成為第三希臘文明的新首都。"
 rename_antalya: "重命名安塔利亞"
 rename_gjirokaster: "重命名吉羅卡斯特"
 GRE_appoint_aristotle_onassis_as_prime_minister: "委任亞里士多德·奧納西斯首相"
 GRE_appoint_aristotle_onassis_as_prime_minister_desc: "亞里士多德·奧納西斯已經為推進韋尼澤洛斯主義至高的偉大理想作出了不可磨滅的貢獻。作為一個生於[339.GetName]的[ROOT.GetAdjective]公民，這位年富力強且充滿魅力的商界領袖或許正是可以團結我們的天選之子。"
 form_macedonian_empire_category: "重建馬其頓帝國"
 form_macedonian_empire_category_desc: "也許有人覺得重回舊日史詩般的亞歷山大帝國時代的想法過於瘋狂，但為了在真正意義上徹底鞏固第三希臘文明的存在，我們必須在此向我們的起源以及往昔榮光致敬。"
 form_macedonian_empire: "再興阿吉德王朝榮光"
 form_macedonian_empire_desc: "現在是時候將我們國家治下的各地區合併為一個完整的中央集權式超級大國了，我們的統一將向世界宣告，希臘將不再是一個被他人任意欺凌的弱國，從此刻起，我們將成為真正意義上令眾生畏服的帝國。"
 form_country_southern_yugoslavia_required_states_tt: "控制所有§Y保加利亞§!、§Y阿爾巴尼亞§!、§Y南斯拉夫§!地區以及§Y塞爾維亞§!南部地區。"
 form_country_southern_central_asia_required_states_tt: "控制§Y[742.GetName]§!、§Y[732.GetName]§!以及§Y[405.GetName]§!。"
 form_country_british_levant_required_states_tt: "控制§Y[454.GetName]§!、§Y[455.GetName]§!以及§Y[656.GetName]§!。"
 form_country_punjab_required_states_tt: "控制所有§Y巴基斯坦§!地區。"
 TUR_the_constitutional_arrows_category: "第3115號法令"
 TUR_the_constitutional_arrows_category_desc: "[ROOT.GetNameDef]的六項原則現已被編入我國憲法，我們可以相信，對其的遵守可保我國永不分裂。"
 TUR_republicanism_decision: "共和主義"
 TUR_republicanism_decision_desc: "這個國家自現已消亡的奧斯曼蘇丹國的餘燼中誕生。如今，我們的答案是，沒有蘇丹、沒有哈里發、沒有諸神——我們是自由的，我們所經歷的一切皆是為了我們的自由。"
 TUR_stoked_republicanism_flag: "近期已煽動共和主義情緒。"
 TUR_secularism_decision: "世俗主義"
 TUR_secularism_decision_desc: "如果我們繼續縱容自中世紀存續至今的古老信仰的教條掌控我們的政治和生活，那麼我們將永遠不能建成能夠被世界強權們平等對待的大國。"
 TUR_stoked_secularism_flag: "近期已煽動世俗主義情緒。"
 TUR_populism_decision: "平民主義"
 TUR_populism_decision_desc: "人民必須永遠被任何負責任的政府視作首位，在這一點上，沒有辯駁的餘地。"
 TUR_stoked_populism_flag: "近期已煽動平民主義情緒。"
 TUR_nationalism_decision: "民族主義"
 TUR_nationalism_decision_desc: "我國人民此前已經有過為我們的國家奮戰至死的壯舉，而如今我們都將準備好再次為國慷慨就義。"
 TUR_stoked_nationalism_flag: "近期已煽動民族主義情緒。"
 TUR_etatism_decision: "國家主義"
 TUR_etatism_decision_desc: "實行計劃經濟的好處是，行政人員能夠通過財政機制對經濟發展施加影響加以調控，而現在為了國家的利益，是時候發揮這些制度優勢了。"
 TUR_no_longer_has_etatism_tt: "不再維持§Y國家主義§!"
 TUR_etatism_abolished: "§Y國家主義§!已被廢除"
 TUR_reformism_decision: "改良主義"
 TUR_reformism_decision_desc: "我們的民眾一向走在時代的前沿——就算是奧斯曼帝國也知道要在政治和社會改革這方面挑戰自身極限。生機勃勃且充滿活力一向是[FROM.GetAdjective]人民的偉大品質。"
 TUR_stoked_reformism_flag: "近期已煽動改良主義情緒。"
 TUR_revolutionism_decision: "革命主義"
 TUR_revolutionism_decision_desc: "此前擺脫奧斯曼帝國的枷鎖並建立土耳其民族國家的努力對我們而言是一場革命，我們已經有所改變，並且我們也將繼續加以改變，我們摸索著國家蛻變和人民進步的前路，而我們命中註定要成為……"
 TUR_stoked_revolutionism_flag: "近期已煽動革命主義情緒。"
 TUR_liberalism_decision: "自由主義"
 TUR_liberalism_decision_desc: "個人主宰自身命運是實現我國未來夢想的基石。貿易自由、選舉自由、信仰自由、機會自由——這一切都是我們必須長久追求的存在。"
 TUR_stoked_liberalism_flag: "近期已煽動自由主義情緒。"
 TUR_jihad_decision: "聖戰主義"
 TUR_jihad_decision_desc: "通過引導與武力，我們會貫徹真主的意志，並將那些偏離正軌的叛逆遊魂一掃而空。"
 TUR_stoked_jihad_flag: "近期已煽動聖戰主義情緒。"
 TUR_fidelity_decision: "忠君主義"
 TUR_fidelity_decision_desc: "忠於蘇丹，忠於真主——這是每位帝國臣民都應頂禮膜拜的兩條重要基本原則。"
 TUR_stoked_fidelity_flag: "近期已煽動忠君主義情緒。"
 TUR_absolutism_decision: "專制主義"
 TUR_absolutism_decision_desc: "蘇丹的統治是不可動搖的，也許奧斯曼帝國曾經自內而外最終四分五裂，但歷史絕不會再次重演。"
 TUR_stoked_absolutism_flag: "近期已煽動專制主義情緒。"
 TUR_ultranationalism_decision: "極端民族主義"
 TUR_ultranationalism_decision_desc: "願意為國捐軀還遠遠不夠；為了國家強盛，每個公民都必須徹底奉獻自我，無論是從意識、軀體還是靈魂上。"
 TUR_stoked_ultranationalism_flag: "近期已煽動極端民族主義情緒。"
 TUR_socialism_decision: "社會主義"
 TUR_socialism_decision_desc: "我們過去曾推翻了舊皇室，而如今我們必須同工人階級協作，一起打倒當下那些囂張的資本家們。"
 TUR_stoked_socialism_flag: "近期已煽動社會主義情緒。"
 TUR_alter_the_royal_laws_of_succession: "修改蘇丹繼承法"
 TUR_alter_the_royal_laws_of_succession_desc: "如今嶄新的蘇丹國給我們提供了改革陳舊繼承法的大好機會，我們應該施行親族長子繼承法，如此一來，便可確保只有蘇丹的直系血脈才能繼承大統。"
 TUR_industrial_projects_category: "工業建設項目"
 TUR_industrial_projects_category_desc: "由於新生的[ROOT.GetAdjective]國家尚且稚嫩，新上馬的工業項目往往需要政府投資才能最終實現運行。"
 TUR_financing_private_enterprise_flag: "已完成民營企業融資。"
 TUR_open_the_nazilli_callico_factory: "開辦納濟利棉紡工廠"
 TUR_open_the_nazilli_callico_factory_desc: "政府有責任根據具體情況來評估潛在的工業項目。"
 TUR_finance_the_bursa_merinos_factory: "投資布爾薩毛紡工廠"
 TUR_finance_the_bursa_merinos_factory_desc: "政府有責任根據具體情況來評估潛在的工業項目。"
 TUR_fund_the_gemlik_silk_factory: "成立蓋姆利克絲綢工廠"
 TUR_fund_the_gemlik_silk_factory_desc: "政府有責任根據具體情況來評估潛在的工業項目。"
 TUR_construct_the_zonguldak_coal_refinery: "建造宗古爾達克煤炭精煉廠"
 TUR_construct_the_zonguldak_coal_refinery_desc: "政府有責任根據具體情況來評估潛在的工業項目。"
 TUR_modernise_the_general_directorate_of_military_factories: "對軍工委員會實施現代化改革"
 TUR_modernise_the_general_directorate_of_military_factories_desc: "政府有責任根據具體情況來評估潛在的工業項目。"
 TUR_authorise_the_nuri_killigil_factory: "準建努裡·基利吉爾工廠"
 TUR_authorise_the_nuri_killigil_factory_desc: "政府有責任根據具體情況來評估潛在的工業項目。"
 TUR_sponsored_killigil_armaments_flag: "§Y基裡吉爾軍工§!已通過§Y工業建設項目§!決議得到贊助。"
 TUR_sponsor_the_nuri_demirag_besiktas_aircraft_factory: "贊助貝西克塔斯·努裡·德米拉航空工廠"
 TUR_sponsor_the_nuri_demirag_besiktas_aircraft_factory_desc: "政府有責任根據具體情況來評估潛在的工業項目。"
 TUR_invest_in_malatya_cigarette_factory: "投資馬拉蒂亞制菸廠"
 TUR_invest_in_malatya_cigarette_factory_desc: "政府有責任根據具體情況來評估潛在的工業項目。"
 TUR_bankroll_the_malatya_clothing_factory: "資助馬拉蒂亞製衣廠"
 TUR_bankroll_the_malatya_clothing_factory_desc: "政府有責任根據具體情況來評估潛在的工業項目。"
 TUR_subsidise_the_karabuk_iron_steel_factory: "資助卡拉比克鋼鐵廠"
 TUR_subsidise_the_karabuk_iron_steel_factory_desc: "政府有責任根據具體情況來評估潛在的工業項目。"
 TUR_karabuk_iron_steel_factory_modernised_flag: "§Y卡拉比克鋼鐵廠§!已經通過§Y工業建設項目§!完成了現代化改造。"
 TUR_sponsor_petrol_olfisis_formation: "贊助籌建燃油辦工作處"
 TUR_sponsor_petrol_olfisis_formation_desc: "在石油開採及相關的能源問題上，政府一直被施壓要求成立一個專門的國家機構。"
 TUR_petrol_ofisi_formed: "已經贊助籌建燃油辦工作處。\n"
 TUR_repeal_the_wealth_tax: "廢除財富稅"
 TUR_repeal_the_wealth_tax_desc: "這項針對非穆斯林群體徵收的稅款不但難以為繼，也將成為凱末爾主義政績上的一個汙點；立刻廢除才是明智之舉。"
 TUR_repeal_the_faith_tax: "廢除信仰稅"
 TUR_repeal_the_faith_tax_desc: "這項針對宗教機構的稅收是難以為繼的，雖然我們有著偉大的目標，但事實卻是[ROOT.GetNameDef]目前還沒有為這樣激進的政策做好準備，比較合理的做法是廢除這一稅項。"
 TUR_abolish_etatism: "廢除國家主義"
 TUR_abolish_etatism_desc: "國家主義是凱末爾主義體系中的一項偉大的成就和試驗，但為了長遠的利益，這項試驗或許應該被永遠終止。"
 TUR_absorb_the_tpda: "合併土耳其公共債務管理局"
 TUR_absorb_the_tpda_desc: "土耳其公共債務管理局像腫瘤那樣侵蝕了我們的工業體系，但我們可以將重新整合該機構作為一項國家進程，從而剷除債務管理局這一長遠發展道路上的絆腳石。"
 TUR_pay_off_our_debts: "償還債務"
 TUR_pay_off_our_debts_desc: "奧斯曼帝國尚在時積欠了一大筆債務，而恰巧我們重建國家也要不小的開銷，所幸目前我們正有能力償還部分欠款！"
 TUR_discuss_investment_possibilities_with_FROM: "同[FROM.GetNameDef]商討投資的可能性"
 TUR_discuss_investment_possibilities_with_FROM_desc: "在過去，[ROOT.GetAdjective]的國家政策會盡量避免牽扯外國投資與干涉——但我們不用再擔心投資這樣的簡單交易了。他們現在會平等地對待我們，而我們也能因此變得更加富裕。"
 TUR_investment_in_turkey_pending_flag: "[FROM.GetNameDefCap]已經同意了我們的投資方案，但尚未交付。"
 TUR_investment_opinion_tt: "§Y[FROM.GetNameDef]§!對我們的評價越高，我們就越有機會獲得他們的投資。\n"
 ROOT_invest_in_turkish_state_building: "投資[FROM.GetAdjective]的地區建設"
 ROOT_invest_in_turkish_state_building_desc: "在[FROM.GetAdjective]本國很多地區，關鍵基礎設施尚不發達，但我們可以對此進行糾正。"
 ROOT_invest_in_turkish_state_light_industry: "投資[FROM.GetAdjective]輕工業"
 ROOT_invest_in_turkish_state_light_industry_desc: "[FROM.GetAdjective]輕工業在本國的很多地區都不發達，但我們可以對此進行糾正。"
 ROOT_invest_in_turkish_state_heavy_industry: "投資[FROM.GetAdjective]重工業"
 ROOT_invest_in_turkish_state_heavy_industry_desc: "[FROM.GetAdjective]重工業在本國的很多地區都不發達，但我們可以對此進行糾正。"
 TUR_investment_pursued: "進一步投資"
 ROOT_turkish_investment_ai_tt: "如果我們能更多地對§Y[TUR.GetNameDef]§!進行§Y投資§!，我們就能將其進一步與我們的利益綁定，同時疏遠他們和我們敵人間的聯繫。\n"
 TUR_kurdish_state_management_category: "庫爾德部族地區管理"
 TUR_kurdish_state_management_category_desc: "自共和國成立伊始，庫爾德問題便一直困擾著我們，如今這個問題似乎變得愈發嚴重。該部族猖獗的民族主義以及註定失敗的自建國行徑正威脅著我國獨立戰爭後保留下來的遺產，我們不能再繼續放任這些庫爾德人肆無忌憚在我國後院煽風點火的情況發生了。"
 TUR_kurdish_state_management_map_category_name: "這些地區存在庫爾德叛亂者。"
 TUR_agitate_kurdish_state_effect_tt: "£faction_tur_kurdish §Y庫爾德叛亂者§!將會在§Y[TUR_kurdish_state_event_target.GetName]§!更加激烈地抵抗政府。"
 TUR_pacify_kurdish_state_effect_tt: "位於§Y[TUR_kurdish_state_event_target.GetName]§!的£faction_tur_kurdish §Y庫爾德叛亂者§!將被平定。"
 TUR_placate_kurdish_state_effect_tt: "位於§Y[TUR_kurdish_state_event_target.GetName]§!的£faction_tur_kurdish §Y庫爾德叛亂者§!將被招安。"
 TUR_kurdish_modifiers_trigger_tt: "所有的£faction_tur_kurdish §Y庫爾德§!地區是§Y核心§!地區，或有§Y分離主義衰竭§!的修正。"
 TUR_no_current_integration_targets_available_tt: "任何£faction_tur_kurdish §Y庫爾德§!地區都至少需要將§Y順從度§!提升至§Y70%§!以上，同時§Y抵抗度§!降低至§Y30%§!以下才能取得核心。"
 TUR_integrate_kurdish_state_effect_tt: "此£faction_tur_kurdish §Y庫爾德§!地區將會失去當前修正併成為§Y[TUR.GetNameDef]§!的核心地區。"
 TUR_counter_the_rebels_in_diyarbakir: "鎮壓迪亞巴克爾的叛軍"
 TUR_counter_the_rebels_in_diyarbakir_desc: "或許是由於本地相對而言較為發達，迪亞爾巴克爾的叛亂者通常不像他們其它地方的同行那樣愛惹麻煩。"
 TUR_counter_the_rebels_in_erzurum: "鎮壓埃爾祖魯姆的叛軍"
 TUR_counter_the_rebels_in_erzurum_desc: "儘管埃爾祖魯姆一向是庫爾德政治運動及激進行動的活動中心，但是也很少出現相關的政治暴力事件，不過鑑於如今世界局勢正在發生變化，保不齊……"
 TUR_counter_the_rebels_in_van: "鎮壓凡城的叛軍"
 TUR_counter_the_rebels_in_van_desc: "凡城是我國最東部的地區之一，與我國西部諸地相比，它從任何方面來說對我們而言都顯得極為陌生。"
 TUR_counter_the_rebels_in_hakkari: "鎮壓哈卡里的叛軍"
 TUR_counter_the_rebels_in_hakkari_desc: "鑑於哈卡里的叛亂分子通常比其他地區的同行更有組織性，再加上此地眾多的山脈和丘陵，使得他們更加難以被根除。"
 TUR_decision_cost_kurd_rebels: "£command_power §Y15§!"
 TUR_decision_cost_kurd_rebels_blocked: "£command_power §R15§!"
 TUR_offer_conscription_exceptions_to_kurdish_groups: "£faction_tur_kurdish 授予庫爾德部族兵役豁免權"
 TUR_offer_conscription_exceptions_to_kurdish_groups_desc: "許多庫爾德部族其實並不尋求徹底的獨立，他們只是想要得到一定程度的自治，出於維護和平的目的，我們可以授予他們廣泛的兵役豁免權，以此來彰顯我們對其一定自治權的默許。"
 TUR_integrate_kurdish_state: "£faction_tur_kurdish 整合庫爾德地區"
 TUR_integrate_kurdish_state_desc: "通過與當地領袖的合作，我們將能夠最終確保國內的庫爾德聚居區能夠重新體面地被接納到民族國家的框架體系當中。"
 TUR_unlock_kurdish_integration_decisions_tt: "解鎖：§Y$TUR_integrate_kurdish_state$§!諸決議。"
 TUR_integrate_diyarbakir: "£faction_tur_kurdish 整合迪亞巴克爾"
 TUR_integrate_diyarbakir_desc: "$TUR_integrate_kurdish_state_desc$"
 TUR_integrate_hakkari: "£faction_tur_kurdish 整合哈卡里"
 TUR_integrate_hakkari_desc: "$TUR_integrate_kurdish_state_desc$"
 TUR_integrate_tunceli: "£faction_tur_kurdish 整合埃爾祖魯姆"
 TUR_integrate_tunceli_desc: "$TUR_integrate_kurdish_state_desc$"
 TUR_integrate_van: "£faction_tur_kurdish 整合凡城"
 TUR_integrate_van_desc: "$TUR_integrate_kurdish_state_desc$"
 TUR_kurdish_resistance_escalation_mission: "£faction_tur_kurdish 庫爾德人的抵抗升級為反政府勢力"
 TUR_kurdish_resistance_escalation_mission_desc: "庫爾德叛亂者再次在我國東南部加強反政府活動。"
 TUR_acted_against_kurd_rebels_recently_flag: "最近已突襲庫爾德人"
 TUR_fundamentalist_state_management_category: "宗教傳統派地區管理"
 TUR_fundamentalist_state_management_category_desc: "在我們的[ROOT.GetAdjective]國家當中，還存在著相當一部分尚未適應宗教地位發生的驟然鉅變的人士。對於這些遺老遺少們，我們應該慢慢加以引導，但歸根到底，我們決不會允許他們阻礙我們前進的步伐。"
 TUR_fundamentalist_state_management_map_category_name: "這些地區存在反凱末爾主義勢力。"
 TUR_encourage_avid_fundamentalist_disciples_to_migrate_into_state: "£faction_tur_traditionalist 鼓勵狂熱的傳統派教徒移居易被影響的社區"
 TUR_increase_influence_of_fundamentalists_in_state: "£faction_tur_traditionalist 增強宗教傳統派的影響力"
 TUR_increase_influence_of_fundamentalists_in_state_desc: "全知全能的真主以及他的光輝必將照亮我們引以為豪的國度的每一個角落。"
 TUR_hold_a_march_in_state: "£faction_tur_kemalist 在宗教傳統派聚居地區舉辦遊行"
 TUR_hold_a_march_in_state_desc: "當我們那些信仰堅定的擁護者們行進在這些反叛群體當中時，他們無私奉獻的赤誠精神必將令這些前朝渣滓般的宗教頑固派分子心生敬畏。"
 TUR_acquiesce_to_fundamentalists: "£faction_tur_traditionalist 默許宗教傳統派的存在"
 TUR_acquiesce_to_fundamentalists_desc: "這個共和國若要生存下去，那就必須要有妥協——即使那意味著要顛覆這個國家賴以維繫的憲法精神。"
 TUR_empower_fundamentalists_in_state: "£faction_tur_traditionalist 向地方宗教傳統派授權"
 TUR_empower_fundamentalists_in_state_desc: "我們的同宗兄弟需要從政府這裡得到他們所能得到的一切支持。"
 TUR_kemalist_state_management_category: "凱末爾主義派地區管理"
 TUR_kemalist_state_management_category_desc: "凱末爾主義的追隨者們通常居住在城鎮市區當中，他們傾向於如同捍衛自己當今生活方式一般捍衛自己的政治理念。"
 TUR_kemalist_state_management_map_category_name: "這些地區忠於凱末爾主義價值觀。"
 TUR_kemalist_loyalty_and_power_update_effect_tt: "§Y凱末爾軍官團§!將審視他們的態度以回應政府做出的行動。"
 TUR_kemalist_influenced_state_effect_tt: "£faction_tur_kemalist §Y凱末爾主義派§!將接管併成為該地區無可爭辯的治理者。"
 TUR_kemalist_turn_hostile_effect_tt: "£faction_tur_kemalist §Y凱末爾主義派§!將與政府§R敵對§!。"
 TUR_counter_influence_of_fundamentalists_in_state: "£faction_tur_kemalist 發動反宗教傳統派的行動"
 TUR_embed_kemalist_propagandists_into_state: "£faction_tur_kemalist 向該地區派遣凱末爾主義宣傳隊"
 TUR_embed_kemalist_propagandists_into_state_desc: "如果凱末爾主義要在未來生存下去，我們就必須非常努力地確保凱末爾主義的意識形態在儘可能多的人心中根深蒂固。"
 TUR_the_enemy_within: "內部之敵"
 TUR_the_enemy_within_desc: "我們的國家在政治、民族和宗教派系上已經產生裂痕，這些裂痕可能進一步肢解國家並把我們推入暴亂中。邪惡的力量正在我們國家肆意妄為，決不能讓他們壓倒[ROOT.GetNameDef]的合法政府。"
 TUR_unaligned_state_management_map_category_name: "這些地區目前保持中立態度。"
 TUR_ideological_battleground_state: "不是£faction_tur_unaligned §Y中立地區§!"
 TUR_is_fundamentalist_state_tt: "被認為是£faction_tur_traditionalist §Y傳統主義地區§!"
 TUR_is_kemalist_state_tt: "被認為是£faction_tur_kemalist §Y凱末爾主義地區§!"
 TUR_traditionalist_infiltration_mission: "£faction_tur_traditionalist 傳統主義者滲透危機"
 TUR_traditionalist_infiltration_mission_desc: "看起來我們社會中那些宗教分子正在那些只有中等支持率的地方再次試圖煽動鞏固他們的信徒。"
 TUR_thwarting_traditionalist_infiltration: "£faction_tur_kemalist 阻止傳統主義者的滲透企圖"
 TUR_thwarting_traditionalist_infiltration_desc: "我們決不能讓那些破壞這個國家世俗主義的異端毫無阻攔地向西部傳播他們的邪說，我們有義務去阻止他們。"
 TUR_entrench_kemalism_in_state: "£faction_tur_kemalist 加強凱末爾主義在該地區的影響"
 TUR_entrench_kemalism_in_state_desc: "如果凱末爾主義要在未來生存下去，我們就必須非常努力地確保凱末爾主義的意識形態在儘可能多的人心中根深蒂固。"
 TUR_root_out_kemalists_in_state: "£faction_tur_traditionalist 根除該地區的凱末爾主義者"
 TUR_root_out_kemalists_in_state_desc: "我們應該讓這些毫無信仰的、持續荼毒國家的凱末爾主義禍害們內心感到恐懼。"
 TUR_kemalist_infiltration_mission: "£faction_tur_kemalist 凱末爾主義者滲透危機"
 TUR_kemalist_infiltration_mission_desc: "那些凱末爾主義黨羽一直對被公眾罷黜一事懷恨在心，他們仍舊在玩他們的老把戲。他們試圖在西部地區實施獨裁——他們必須被制止。"
 TUR_hostile_kemalists_influenced_state_effect_tt: "£faction_tur_kemalist §Y凱末爾主義叛黨§!將會堅守§Y[TUR_kemalist_state_event_target.GetName]§!。"
 TUR_thwarting_kemalist_infiltration: "£faction_tur_traditionalist 阻止凱末爾主義者的滲透企圖"
 TUR_thwarting_kemalist_infiltration_desc: "阻止凱末爾主義者進一步傳播他們的惡毒言論已經不再只是基本的公民責任，而是一項神聖的使命。"
 TUR_reforming_our_armed_forces_category: "軍隊改革"
 TUR_reforming_our_armed_forces_category_desc: "我國的武裝力量在獨立戰爭後損失殆盡：為了從帝國主義者手中贏回自由我們透支了一切。雖然軍事改革這件事看起來可以推遲一段時間再做，但是現在的世界正變得愈發危險。"
 TUR_modernize_our_tactics: "戰術現代化"
 TUR_modernize_our_tactics_desc: "雖然目前武裝部隊的很多在編人員都是經歷過獨立戰爭的老兵，但是他們卻沒有意識到未來戰爭相比於1922年的戰爭已經截然不同了。"
 TUR_teach_the_proper_use_of_modern_infrastructure: "基礎設施使用指導"
 TUR_teach_the_proper_use_of_modern_infrastructure_desc: "軍隊中如今仍有許多人難以適應鐵路運輸與公路交通時代的到來，堅持採用傳統的騎馬機動方式。"
 TUR_commence_an_overhaul_of_our_training_methods: "全面推進訓練改革"
 TUR_commence_an_overhaul_of_our_training_methods_desc: "我軍當前的訓練方法已顯力不從心，就算老兵尚且可以汲取過往的經驗教訓，但新兵在這方面誠然收穫甚微。"
 TUR_streamline_communication_methods_between_ships: "優化艦船通訊"
 TUR_streamline_communication_methods_between_ships_desc: "我國海軍艦船上的許多裝備不僅陳舊過時，同時也是不可靠的。"
 TUR_put_new_safety_regulations_regarding_the_operation_of_aircraft_into_effect: "新訂航空安全條例"
 TUR_put_new_safety_regulations_regarding_the_operation_of_aircraft_into_effect_desc: "我們一直為身處歐洲航空創新前沿而感到自豪，同時我們的飛行員也享有特立獨行的美譽。"
 TUR_etatism_crisis_1: "通貨膨脹加劇"
 TUR_etatism_crisis_1_desc: "事實證明，既要保持我們的國家社會主義經濟模式，又要兼容戰時經濟的做法是有問題的。"
 TUR_etatism_crisis_2: "土耳其里拉貶值"
 TUR_etatism_crisis_2_desc: "事實證明，既要保持我們的國家社會主義經濟模式，又要兼容戰時經濟的做法是有問題的。"
 TUR_etatism_crisis_3: "經濟衰退惡化"
 TUR_etatism_crisis_3_desc: "事實證明，既要保持我們的國家社會主義經濟模式，又要兼容戰時經濟的做法是有問題的。"
 TUR_etatism_crisis_4: "蕭條將至"
 TUR_etatism_crisis_4_desc: "事實證明，試圖同時維持國家主義經濟模式和戰時經濟顯得困難重重。如果我們在這個問題上沒有成功採取有效措施，我們將會徹底摧毀我們的整個經濟。"
 ott_reform_the_eyalet_of_rumelia: "重組魯米利亞行省"
 ott_merge_the_eyalets_of_morea_crete_and_kibris: "整合摩里亞、克里特及塞浦路斯諸行省"
 ott_enlarge_the_vilayet_of_bosnia: "擴張波斯尼亞維拉耶"
 ott_restore_the_vilayet_of_the_danube_and_moldova: "重建多瑙及摩爾多瓦維拉耶"
 ott_restore_the_vilayet_of_halep: "重建哈勒普維拉耶"
 ott_restore_the_vilayet_of_beirut: "重建貝魯特維拉耶"
 ott_restore_the_vilayet_of_baghdad: "重建巴格達維拉耶"
 ott_extend_the_lasha_eyalet: "開拓哈薩行省"
 ott_merge_the_eyalets_of_jeddah_habesh_and_yemen: "整合吉達、哈比沙及也門諸行省"
 ott_integrate_the_khedivate_of_egypt: "整合埃及赫迪夫領"
 ott_restore_the_vilayet_of_tripolitania: "重建的黎波里塔尼亞維拉耶"
 ott_absorb_the_tunis_and_algerian_eyalets: "直轄突尼斯及阿爾及利亞行省"
 develop_malatya_chromium_deposits: "開發馬拉蒂亞鉻礦"
 develop_mersin_chromium_mines: "開發梅爾辛鉻礦"
 utilize_diyarbakir_chromium_deposits: "開發迪亞巴克爾鉻礦"
 expand_the_kirikkale_steel_mills: "擴建克勒克卡萊鋼鐵廠"
 develop_the_iron_mines_in_divrigi: "開發迪夫裡伊附近的鐵礦"
 exploit_the_raman_oil_field: "開發拉曼油田"
 drill_in_the_garzan_oil_field: "開採加爾贊油田"
 expand_the_west_raman_oil_field: "擴建西拉曼油田"
 form_rumelia_greece_required_states_tt: "控制§Y希臘§!本土的所有地區。"
 form_rumelia_bulgaria_required_states_tt: "控制§Y保加利亞§!的所有地區。"
 form_rumelia_yugoslavia_required_states_tt: "控制§Y塞爾維亞§!、§Y馬其頓§!以及§Y黑山§!的所有地區。"
 form_rumelia_albania_required_states_tt: "控制§Y阿爾巴尼亞§!的所有地區。"
 form_rumelia_greece_coring_states_tt: "獲得§Y希臘§!本土所有地區的核心。"
 form_rumelia_bulgaria_coring_states_tt: "獲得全部§Y保加利亞§!地區的核心。"
 form_rumelia_yugoslavia_coring_states_tt: "擁有全部§Y塞爾維亞§!、§Y馬其頓§!以及§Y黑山§!地區的核心。"
 form_rumelia_albania_coring_states_tt: "獲得所有§Y阿爾巴尼亞§!地區的核心。"
 TUR_appoint_nihal_atziz_as_president: "任命尼哈爾·阿特瑟茲為總統"
 TUR_appoint_nihal_atziz_as_president_desc: "尼哈爾·阿特瑟茲在幫助我們實現圖蘭主義之夢上發揮了重要作用。有了人民的支持，最好提升他的地位。"
 TUR_the_fading_father_category: "日漸虛弱的國父"
 TUR_the_fading_father_category_desc: "土耳其國父穆斯塔法·凱末爾·阿塔圖爾克近來患病癒加頻繁，如此一來，我們或許必須面對不幸的現實，即這位如同救世主般的國父可能無法在有生之年見證[ROOT.GetNameDef]挺過當前的世界危機。\n\n阿塔圖爾克目前的健康狀況為：[ROOT.GetAtaturkHealthBar]。\n"
 TUR_ataturk_health_worsening_crisis: "阿塔圖爾克病情惡化"
 TUR_ataturk_health_worsening_crisis_desc: "隨著穆斯塔法·凱末爾·阿塔圖爾克年歲日增，他的病症也必將變得愈發嚴重，誰能知道距離土耳其國父回天乏術的那一天還有多久？"
 TUR_seek_treatment_for_ataturk: "為阿塔圖爾克尋醫"
 TUR_seek_treatment_for_ataturk_desc: "如果我們的加齊想要挺過接下來的幾年，那麼使他能夠從監國的重擔中解放出一些時間來至關重要。我們將會安排他到全球最頂尖的療養院接受治療，並且到一些全世界最優秀的度假勝地放鬆身心。"
 TUR_worsen_ataturks_health_effect_tt: "§Y穆斯塔法·凱末爾·阿塔圖爾克§!將會因為§R健康狀況不佳§!而變為低效的領導人。"
 TUR_retire_ataturk: "奉請阿塔圖爾克退休"
 TUR_retire_ataturk_desc: "這細細想來確是一個糟糕的決定，但或許我們的加齊若能在生命的最後這段時間裡有家人陪伴並可周遊這片大陸上他所中意的地方的話，他應該會得到更為妥善的照料。我們不能再這樣自私地索取他那奉獻出的生命了：尤其是不能在他已經為了國家和人民犧牲了那麼多之後。"
 TUR_ataturk_health_poor_tt: "§Y穆斯塔法·凱末爾·阿塔圖爾克§!將被認定為身體情況§Y較差§!。"
 TUR_ataturk_health_terminal_tt: "基於其§Y病入膏肓§!的身體情況，§Y穆斯塔法·凱末爾·阿塔圖爾克§!將接受姑息治療。"
 TUR_ataturk_health_stable: "§Y穩定§!"
 TUR_ataturk_health_poor: "§Y較差§!"
 TUR_ataturk_health_terminal: "§R病入膏肓§!"
 TUR_acquiesce_to_fundamentalists_tt: "此處以及其他§Y2§!個額外的£faction_tur_traditionalist §Y宗教傳統派地區§!將會開始與政府展開更多合作。"
 the_national_oath_category: "國家誓言"
 the_national_oath_category_desc: "誠然奧斯曼帝國必須被顛覆，這是無法避免且必要的，儘管我們也因此在1923年被迫簽訂洛桑條約時失去了多於賭注回報的東西，但現在時過境遷，是時候奪回我們當初被偷走的一切了。"
 restore_the_borders_of_1920: "重返1920年疆界"
 restore_the_borders_of_1920_desc: "伴隨此項宣言，洛桑條約總算歸於終焉，我們在真正意義上擺脫了帝國主義的枷鎖，重獲自由。"
 form_turan_category: "圖蘭帝國之路"
 form_turan_category_desc: "儘管長久以來，所謂圖蘭看起來都更似一場幻夢，但既然現在我們已經有機會將世界上所有的突厥同胞都團結在同一面旗幟下，那麼我們又怎能拒絕呢？"
 form_turan: "建立圖蘭國家"
