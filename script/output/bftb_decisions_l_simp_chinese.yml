 BUL_rearmament: "保加利亞軍備重整"
 BUL_rearmament_desc: "在我國於上次大戰中戰敗後，根據訥伊條約的禁令，我國軍隊遭受了極大程度的限制。然而如今歐洲正值多事之秋，我們若想捍衛保加利亞領土完整及人民自由，則必須設法擺脫這些限制並將重整軍隊提上日程。"
 BUL_demonstrate_our_policies_of_peace: "闡述和平政策"
 BUL_demonstrate_our_policies_of_peace_desc: "如果我們想就軍隊重整事宜與英國政府進行交涉，則必須確保此前解決與諸鄰國間存在的任何領土爭端。"
 BUL_pressure_to_lift_army_restrictions: "施壓要求解除軍備限制"
 BUL_pressure_to_lift_army_restrictions_desc: "我們必須向[ENG.GetNameDef]施壓，努力使其最終同意解除對我國軍隊的一切限制。"
 BUL_refuse_army_restrictions: "撕毀軍備限制"
 BUL_refuse_army_restrictions_desc: "鑑於如今我們擁有[GetBulgarianFactionName]撐腰，我們不再需要看[ENG.GetNameDef]臉色便能進行軍備重整事宜。"
