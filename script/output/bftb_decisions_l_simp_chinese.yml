 GRE_investment_decisions_category: "投資計劃"
 GRE_investment_decisions_category_desc: "幾十年來，由於舊政權在經濟上管理不善以及外國勢力的肆意打壓，造成了我國缺乏實現工業富強的基礎。而更加令人悲哀的現實是，為了釋放我們的最大潛能，我們可能被迫需要向這些將我們置入如此窘境的國家求援。"
 GRE_invite_politicians_for_investment_talks_in_capital: "邀請政要洽談投資"
 GRE_invite_politicians_for_investment_talks_in_capital_desc: "如果我們能接洽一些合適的人士，並邀請他們造訪我們享有盛譽的國家，為其展現我國人民以及製造業上巨大的潛力，這應該能帶來相當多的好處。"
 GRE_hold_national_showcase_for_investors_ger: "為[FROM.GetAdjective]投資者舉辦全國展會"
 GRE_hold_national_showcase_for_investors_ger_desc: "我們應該在這個西方文明的搖籃國度舉辦一場宏大的展會，希望能藉此吸引對我國落後工業的投資。"
 GRE_exploit_errata_in_schachtplan: "利用沙赫特計劃漏洞"
 GRE_exploit_errata_in_schachtplan_desc: "沙赫特計劃不過又是[FROM.GetAdjective]企圖掠奪貧苦歐洲國家的陰謀詭計，但幸運的是，設計利用並炮製讓[FROM.GetAdjective]人承擔無條件援助我國義務的條款是輕而易舉的。"
 GRE_rebuke_german_investment: "譴責[FROM.GetAdjective]投資"
 GRE_invite_entrepreneurs_for_investment_talks_in_capital: "邀請企業家洽談投資"
 GRE_invite_entrepreneurs_for_investment_talks_in_capital_desc: "如果我們能接洽一些合適的人士，並邀請他們造訪我們享有盛譽的國家，為其展現我國人民以及製造業上巨大的潛力，這應該能帶來相當多的好處。"
 GRE_hold_national_showcase_for_investors_eng: "為[FROM.GetAdjective]投資者舉辦全國展會"
 GRE_hold_national_showcase_for_investors_eng_desc: "我們應該在這個西方文明的搖籃國度舉辦一場宏大的展會，希望能藉此吸引對我國落後工業的投資。"
 GRE_trade_manufactured_ship_parts_for_investment: "貿易船舶零件換取投資"
 GRE_trade_manufactured_ship_parts_for_investment_desc: "通過幫助英國人維持他們的皇家海軍，我們可以保證我們將獲得比正常情況下多得多的投資。"
 GRE_rebuke_british_investment: "譴責[FROM.GetAdjective]投資"
 GRE_go_to_paris_to_negotiate_investment_talks: "赴巴黎洽談投資事宜"
 GRE_go_to_paris_to_negotiate_investment_talks_desc: "通過在巴黎與相關人士的洽淡，我國將為其展現國民與工業領域的莫大潛力並獲得可觀的國家收益。"
 GRE_hold_national_showcase_for_investors_fra: "為[FROM.GetAdjective]投資者舉辦全國展會"
 GRE_hold_national_showcase_for_investors_fra_desc: "我們應該在這個西方文明的搖籃國度舉辦一場宏大的展會，希望能藉此吸引對我國落後工業的投資。"
 GRE_bribe_french_trade_unions_to_pressure_government_into_investment: "賄賂[FROM.GetAdjective]工會使其掣肘該國政府"
 GRE_bribe_french_trade_unions_to_pressure_government_into_investment_desc: "長久以來，[FROM.GetNameDef]一直為其國內的工會組織所掣肘，如果我們幫助該國工會在該國製造混亂，我們就能利用這一手段改善我國在討價還價當中的地位。"
 GRE_rebuke_french_investment: "譴責[FROM.GetAdjective]投資"
 GRE_request_italian_assistance_with_industrialisation: "請求工業化援助"
 GRE_italian_influence_tt: "對§Y[FROM.GetAdjective]§!的過分依賴將會置我國主權於危險的境地。\n"
