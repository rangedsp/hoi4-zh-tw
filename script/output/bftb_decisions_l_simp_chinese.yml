 BUL_zveno_name_text: "環節集團"
 BUL_bs_name_text: "社會民主工黨-廣泛派"
 BUL_bzns_name_text: "農民聯盟"
 BUL_nsm_name_text: "國家社會主義運動"
 BUL_ZVENO_TOOLTIP: "£faction_bul_zveno §Y環節集團§!是由軍官團體所創建的民族主義組織，目前由基蒙·格奧爾基耶夫領導。\n£faction_bul_zveno §Y環節集團§!將會拉攏軍官們加入其組織，假以時日，其甚至會陰謀政變並建立軍事獨裁政權。"
 BUL_BS_TOOLTIP: "£faction_bul_bs §Y社會民主工黨-廣泛派§!是信奉社會民主主義的泛階層聯盟。\n£faction_bul_bs §Y社會民主工黨-廣泛派§!在產業工人階級以及工會當中擁有著強大的影響力，若是其對政府不再忠誠，便將掀起聲勢浩大的罷工。"
 BUL_BZNS_TOOLTIP: "£faction_bul_bzns §Y農民聯盟§!是曾在1934年被取締的致力關注農業事務的政治組織。\n£faction_bul_bzns §Y農民聯盟§!在我國的鄉村地區擁有著強大的影響力，其會試圖在農民群體中爭取支持。"
 BUL_NSM_TOOLTIP: "£faction_bul_nsm §Y國家社會主義運動§!是由前環節集團成員亞歷山大·燦科夫領導的極右翼組織。\n£faction_bul_nsm §Y國家社會主義運動§!將會試圖通過煽動組織民眾在全國發起遊行示威的方式爭取支持率。"
 BUL_LOYALTY_TOOLTIP: "§Y忠誠度§!反映著各派系與政府合作的意願。\n§Y忠誠度§!越高，派系對抗政府的可能性就越小。\n在將某個派系整合進政府之前，有必要通過若干決議拉攏其成員效忠政府，並將其§Y忠誠度§!提升至100。"
 BUL_POPULARITY_TOOLTIP: "§Y支持率§!反映著各派系通過若干因素從民眾當中獲取的支持（通過軍隊、無產階級、農民階級或右翼激進派等）。\n§Y支持率§!越高，派系也將越有可能對抗政府。\n在摧毀某個派系前，有必要通過若干決議對其進行弱化，並將其§Y支持率§!降低至0。"
 BUL_reduced_faction_interaction_cost_tt: "執行任意§Y派系管理§!決議的花費減半。"
 BUL_reduced_communist_oppression_cost_tt: "鎮壓§Y社會民主工黨-廣泛派§!的決議花費已經減半。"
 BUL_improved_faction_effects_tt: "提升所有§Y派系管理§!決議對各派系產生的效果。"
 BUL_reduced_faction_interaction_cooldown_tt: "§Y派系管理§!決議的完成時間將會縮短，同時執行後的冷卻時間也將減少。"
