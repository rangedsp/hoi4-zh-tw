 ###   SIAM   ###
 ################
 SIA_the_khana_ratsadon: "人民黨"
 SIA_the_khana_ratsadon_desc: "人民黨終結了專制，開啟了通向憲政的道路。它的遺產曾被爭奪、被背叛、被血洗，但它依然是建設現代[SIA.GetName]的基石。"
 SIA_the_khana_ratsadon_tt: "\n§Y人民黨§!開始活躍。\n\n§Y人民黨§!是[ROOT.GetName]的執政黨，分為§Y軍方派系§!和§Y文官派系§!。\n\n§Y文官派系§!通常傾向於支持民主政策，注重民用工業；而§Y軍方派系§!通常傾向於支持法西斯政策以及工業軍事化。\n\n我們的選擇會影響他們對我們的支持度，帶來不同的加成或減益。\n如果他們變得叛逆，可能會嘗試發動政變。\n\n不同的支持狀態為：§Y叛逆§!、§Y反對§!、§Y中立§!、§Y略微支持§!和§Y全力支持§!"
 SIA_shuffle_pridi_to_the_minister_of_interior: "增強文官派系地位"
 SIA_shuffle_pridi_to_the_minister_of_interior_desc: "通過將比裡從外交部長調任為內政部長，他可以更有效地控制政府資源的分配，並對不斷擴張的軍方影響力形成制衡。"
 SIA_shuffle_pridi_to_the_minister_of_interior_tt: "§Y$anti_fascist_raids$§!將增加§Y文官派系§!的支持度，並減少§Y軍方派系§!的支持度"
 SIA_civil_nationalism: "公民民族主義"
 SIA_civil_nationalism_desc: "每一位泰國人，無論身份地位如何，都應明白他們的忠誠不應屬於某個政府或某個人，而應當忠於自由、解放與平等的價值，無論權力王座上坐著的是誰。"
 SIA_the_true_heirs_of_1932: "1932年的真正繼承者"
 SIA_the_true_heirs_of_1932_desc: "軍方常將1932年革命描繪成他們獨自的功績，卻忽視了那其實是人民的勝利。人民只需要被提醒這一事實，而我們將從他們那裡獲得力量。"
 SIA_thammasat_university: "泰國國立法政大學"
 SIA_thammasat_university_desc: "作為一所新成立的大學，泰國國立法政大學應當得到擴展，以為泰國創新時代鋪平道路。"
 SIA_defenders_of_constitutional_liberty: "憲政自由的捍衛者"
 SIA_defenders_of_constitutional_liberty_desc: "教師、銀行家、護士——受過教育的中產階層可以被動員起來，在軍方勢力越界時捍衛自由。"
 SIA_dominate_public_symbols: "掌控公共話語權"
 SIA_dominate_public_symbols_desc: "軍方長期主導公共象徵，通過建立雕像和設立紀念日來歌頌自身。我們必須建立自己的象徵，以慶祝人民的自決權和戰勝舊專制的勝利。"
 SIA_civil_service_heroism: "護憲主義"
 SIA_civil_service_heroism_desc: "每一位泰國人都必須被灌輸一種內在責任：當任何國內或外國勢力試圖篡奪權力時，都要維護法治。不僅需要人民在自由受到威脅時支持我們，還要讓人民自身成為維護原則的旗手。"
 SIA_spread_democratic_sentiment_in_universities: "在大學傳播民主思想"
 SIA_spread_democratic_sentiment_in_universities_desc: "學者們掌握著[SIA.GetName]未來的發展方向。今天他們所學的思想將影響未來，如果我們在當代學者中植入強烈的民主責任感，這種理念就可能傳播到學術殿堂之外。"
 SIA_sideline_disloyal_officers: "邊緣化不忠的軍官"
 SIA_sideline_disloyal_officers_desc: "陸軍軍官團並非鐵板一塊。在其隊伍中，有些人的忠誠屬於老上司、敵對派系或自身的野心，而非政府。通過審慎的人事調動與行政壓力，可將這些人物調至無威脅的職位，而那些已證明自己可靠的人，將得到他們應得的責任。"
 SIA_sideline_disloyal_officers_tt: "兩名隨機將領將獲得持續4年的§Y重新調職§!特質，使其不再提供任何加成。\n另外兩名沒有§Y重新調職§!特質的隨機將領將獲得額外屬性與一個正面特質。"
 SIA_direct_funds_from_the_military_towards_development: "調撥軍費投入發展建設"
 SIA_direct_funds_from_the_military_towards_development_desc: "儘管軍方派系會因其經費被調撥投入發展建設項目而感到不滿，但向公眾解釋為何這種投資減少對他們有利，將是軍方而非我們的責任。"
 SIA_as_the_eyes_turn_towards_southeast_asia: "當目光轉向亞洲"
 SIA_as_the_eyes_turn_towards_southeast_asia_desc: "東南亞已不再是遙遠的戰場，這裡是帝國、革命與戰爭的十字路口。[SIA.GetName]必須決定是甘當這場鬥爭中的棋子，還是做一個自主的強國。"
 SIA_support_songsuradets_military_clique: "支持頌素拉德的軍事派系"
 SIA_support_songsuradets_military_clique_desc: "並非所有軍官都是國家的敵人。頌素拉德及其忠誠者紀律嚴明，足以取代那些將暹羅推向崩潰邊緣的腐敗將領。在他們的支持下，秩序將得以恢復，國家不會陷入混亂。"
 SIA_support_songsuradets_military_clique_tt: "若爆發§Y內戰§!，頌素拉德將支持我們，並給予額外§Y3§!個師。\n§R若我們先強化頌素拉德的勢力，然後再通過$SIA_the_songsuradet_rebellion$試圖逮捕他，他可能會反抗。§!"
 SIA_the_royal_police_counterweight: "王家警察"
 SIA_the_royal_police_counterweight_desc: "王家警察作為一支獨立力量存在，如果反對派試圖奪權，我們可以利用他們來對抗對手。"
 SIA_the_royal_police_counterweight_tt: "若爆發§Y內戰§!，王家警察將支持我們，並給予額外§Y2§!個師。"
 SIA_for_the_preservation_of_siamese_independence: "鞏固軍方派系控制"
 SIA_for_the_preservation_of_siamese_independence_desc: "上個世紀世界列強不斷侵蝕[SIA.GetAdjective]的領土完整，而本世紀似乎也沒有改變。若我們想維持自己的生活方式，就必須果斷行動，否則國家將淪為殘破不堪的殘餘國家，被削弱、分裂並撕裂。"
 SIA_for_the_preservation_of_siamese_independence_tt: "§Y$anti_democratic_raids$§!將增加§Y軍方派系§!的支持度，並減少§Y文官派系§!的支持度"
 SIA_the_peoples_day: "人民日"
 SIA_the_peoples_day_desc: "與其進一步強調軍方推翻舊君主制的作用，我們應當提升人民自身的角色。設立“人民日”將激勵整個國家，並讓公民學會不再接受低於這一標準的政治現實。"
 SIA_hold_military_parades: "舉行閱兵"
 SIA_hold_military_parades_desc: "為了提升軍隊士氣、獎勵忠誠的將領，並提醒民眾[SIA.GetAdjective]武裝力量的強大，我們將在曼谷舉行盛大閱兵。讓報紙有值得報道的內容！"
 SIA_embed_technocrats_in_civilian_institutions: "在文職機構中安插技術官僚"
 SIA_embed_technocrats_in_civilian_institutions_desc: "我們可以與政府中的技術官僚結盟，讓他們成為文官派系的延伸力量，從而擴大影響力並對抗軍方勢力。"
 SIA_military_academies_indoctrination: "軍事學院思想灌輸"
 SIA_military_academies_indoctrination_desc: "我們的軍事學院是進行意識形態教育的理想場所。它們武裝精良，而年輕學員容易受到教官影響。贏得教官，就等於贏得軍隊青年。一支忠於統治階層的強大軍隊是強國的基礎，而我們必將成為強大的國家。"
 SIA_the_king_of_the_white_elephant: "《白象王》"
 SIA_the_king_of_the_white_elephant_desc: "關於收復失地的狂熱情緒正席捲全國，世界也在注視。為了緩和這種狂熱，我們將製作一部反戰電影——泰國第一部用英語拍攝的電影——向世界展示[SIA.GetName]的真實面貌。"
 SIA_the_king_of_the_white_elephant_tt: "完成國策§Y$SIA_sala_chaloem_thai_movie_theater$§!後，解鎖宣傳運動§Y$SIA_the_king_of_the_white_elephant$§!，效果為：\n每週穩定度：§G+0.45%§!，持續180天"
 SIA_drum_up_irredentism: "鼓動領土收復主義"
 SIA_drum_up_irredentism_desc: "僅僅獲得軍方對未來戰爭的支持還不夠，我們還必須贏得廣大民眾的支持。通過詩歌、電影與演講，我們將讓[SIA.GetName]為與奪走我們歷史領土的帝國主義勢力進行清算做好準備。"
 SIA_sell_privy_purse_lands: "出售王室私產土地"
 SIA_sell_privy_purse_lands_desc: "王室擁有大片如今由我們控制的土地。這些地產可以大大充實國庫，同時也可以以優惠價格出售給部分軍官，以確保他們的忠誠。"
 SIA_sell_privy_purse_lands_tt: "當該民族精神結束後，§Y[SIA_phraya_phahon.GetName]§!將捲入一場醜聞，使你能夠繞過法西斯主義要求，以啟用§Y$SIA_phibuns_premiership$§!"
 SIA_war_fervor: "戰爭狂熱"
 SIA_war_fervor_desc: "戰鼓已經敲響，預示著即將到來的衝突。人民已經被動員起來，導火索也已點燃，戰爭熱情即將達到頂點。我們必須謹慎地將這股能量引導到一個值得為之而戰的目標上。"
 SIA_war_fervor_tt: "戰爭支持度將持續永久性上升，直到我們向其他任何國家宣戰。一旦宣戰，該國家精神將被移除。\n\n若§Y戰爭支持度§!長時間保持在§Y95%§!以上卻未宣戰，則將爆發內戰。\n宣戰時："
 SIA_the_midnight_meeting: "午夜會議"
 SIA_the_midnight_meeting_tt: "[SIA_plaek_phibunsongkhram.GetName]將在[SIA.GetNameDef]奪取政權，領導政府。我們需要推翻他才能恢復君主制。"
 SIA_the_midnight_meeting_desc: "頌素拉德元帥注視著披汶日益集權，從中看到了清算的契機。若要讓君主制和頌素拉德本人得以存續，保皇派、高級軍官和民間名流必須秘密會面，商定在披汶動手之前先行將其剷除。"
 SIA_meet_with_king_prajadhipok: "會見流亡中的巴差提樸國王"
 SIA_meet_with_king_prajadhipok_desc: "沒有國王參與的陰謀不過是又一次軍方權謀。通過與流亡中的巴差提樸國王會面，我們可以將保皇派的事業置於王權正統的庇護之下，並贏得那位唯一可能讓猶豫者歸附、分裂現政權之人的祝福。"
 SIA_prajadhipok_audience_with_churchill: "巴差提樸與[ENG.GetLeader]會晤"
 SIA_prajadhipok_audience_with_churchill_desc: "巴差提樸身處[ENG.GetName]帶來的不僅是威望。如果他能說服[ENG.GetLeader]相信保皇派起事符合英國在亞洲的利益，那麼來自馬來亞的武器就可能落入仍忠於王座的人們手中。"
 SIA_prajadhipok_audience_with_churchill_tt: "[ENG.GetName]將向我們提供"
 SIA_prajadhipok_audience_with_churchill_tt2: "當內戰開始時。"
 SIA_facilitate_prajadhipoks_move_to_japan: "促成巴差提樸訪日"
 SIA_facilitate_prajadhipoks_move_to_japan_desc: "能從[ROOT.GetNameDef]的動盪中獲利的並非只有英國。安排巴差提樸前往日本，我們可以贏得東京的青睞，甚至獲得承諾：若保皇派起事演變為內戰，日軍將提供支援。"
 SIA_facilitate_prajadhipoks_move_to_japan_tt: "[JAP.GetNameDef]的3個遊騎兵師將在內戰中支援我們。"
 SIA_the_kings_gambit: "國王的豪賭"
 SIA_the_kings_gambit_desc: "巴差提樸返回曼谷，完全預料到現政權會將他逮捕。這一行動將為保皇派提供所需的憤慨、合法性與權威，使他們不再猶豫，以他的名義起事。一旦流亡國王被捕，信號即會發出，[ROOT.GetName]的鬥爭將正式開啟。"
 SIA_the_kings_gambit_tt: "我們的支持度取決於我們爭取到了多少派系。"
 SIA_restore_order: "恢復秩序"
 SIA_restore_order_desc: "內戰勝利了，但僅憑勝利無法治癒整個王國。廢墟必須重建，舊勢力必須安撫，行政機構必須重組，以便[ROOT.GetName]能從混亂中崛起，王權穩固，公共生活迴歸正軌。"
 SIA_ananda_age_trigger_12: "阿南塔國王已滿§Y12§!歲（目前§Y[?var:SIA_anandas_age]§!歲）。生日為9月20日"
 SIA_ananda_age_trigger_15: "阿南塔國王已滿§Y15§!歲（目前§Y[?var:SIA_anandas_age]§!歲）。生日為9月20日"
 SIA_ananda_trait_tt: "當阿南塔登基時，他將獲得："
 SIA_to_forge_a_king: "鑄造一位國王"
 SIA_to_forge_a_king_desc: "阿南塔國王遠在瑞士，尚且年幼，心智與品格仍在塑造之中。如果我們能精心引導他的學業，或許不僅能培養出一個有名無實的傀儡君主，更能造就一位符合我們為[ROOT.GetNameDef]所設之命運的統治者。"
 SIA_to_forge_a_king_tt: "未來的國王阿南塔·瑪希敦目前正在[SWI.GetName]求學，年紀尚輕。我們可以影響他未來的學業與志趣，確保他成為一位偉大的國王。\n\n每年他的生日，我們都可以為他選擇一項學習興趣，直到他年滿15歲，這些選擇將在他最終登基時提供不同的加成。\n\n他的生日是9月20日，目前年齡為§Y[?var:SIA_anandas_age]§!歲。"
 SIA_ascend_the_throne: "登上王位"
 SIA_ascend_the_throne_desc: "攝政不能永遠持續下去。阿南塔已到親政的年齡，他的正式登基將使復辟的君主政體從監護與陰謀過渡到新的合法統治期。"
 SIA_the_provincial_council_of_state: "省府政務委員會"
 SIA_the_provincial_council_of_state_desc: "戰火使政府機器支離破碎，權威難定。在年輕的阿南塔國王能夠親政之前，省政務委員會必須作為臨時政府履行職責，並宣告保皇派並非為自身而戰，而是為了恢復合法君主政體。"
 SIA_the_regency_of_boworadet: "博沃拉德攝政"
 SIA_the_regency_of_boworadet_desc: "博沃拉德親王承載著舊秩序的威望，無人能質疑他的忠誠。以阿南塔的名義任命他擔任攝政，我們將國家託付於保守派手中，並明確表明復辟不僅僅是更換內閣大臣。"
 SIA_the_sacred_hierarchy: "神聖階序"
 SIA_the_sacred_hierarchy_desc: "博沃拉德認為，當每個階層各安其位、王權凌駕於一切世俗野心之上時，王國最為強盛。君主制、信仰以及[ROOT.GetNameDef]的天然等級制度，必須再次被視為神聖的支柱，而非可供交易的遺物。"
 SIA_the_regency_of_songsuradet: "頌素拉德攝政"
 SIA_the_regency_of_songsuradet_desc: "頌素拉德並非自由派，但他對現代國家的需求也並非視而不見。作為攝政，他可以在維護王室權威的同時，將[ROOT.GetNameDef]的未來託付給紀律、規劃以及由軍方引導的國家發展計劃。"
 SIA_order_discipline_and_unity: "秩序、紀律與團結"
 SIA_order_discipline_and_unity_desc: "派系政治與內戰的混亂幾乎摧毀了整個國家。頌素拉德的答案簡單明瞭：政府有序、社會守紀、目標統一，從而讓王國得以重塑為一個更強大、更現代的國家。"
 SIA_the_regency_of_rangsit: "蘭實攝政"
 SIA_the_regency_of_rangsit_desc: "蘭實親王明白，君主制只有與代議制政府和解才能存續。在他的攝政下，王室的復辟將在尊嚴上保持保守，但在方法上奉行民主，並準備為[ROOT.GetNameDef]帶來穩定的議會制未來。"
 SIA_constitutional_virtue: "憲政美德"
 SIA_constitutional_virtue_desc: "尊重法律的君主制更難被推翻，也更容易捍衛。在蘭實的指導下，我們將復興憲政，約束專權，並教導國民：王權作為合法自由的守護者時最為穩固。"
 SIA_an_absolute_monarchy: "絕對君主制"
 SIA_an_absolute_monarchy_desc: "有限君主制的實驗只帶來了屈辱、政變以及野心軍官對王室權威的篡奪。如果王權要重新贏得忠誠，那麼國王就必須恢復其全部特權，不受制於政黨或議會。"
 SIA_a_constitutional_monarchy: "君主立憲制"
 SIA_a_constitutional_monarchy_desc: "國王無需支配國家也能保全王國。通過在一個持久的憲制安排內恢復君主制，我們可以將國王與人民緊密聯結，確保王室尊嚴與責任政府並存。"
 SIA_to_lay_the_bait: "設下誘餌"
 SIA_to_lay_the_bait_tt: "我們將洩露一份偽造的經濟計劃以激怒軍方。\n我們拖延§Y$SIA_and_spring_the_trap$§!越久，軍方的反彈就越大，我們獲得的支持也會越強。\n\n$SIA_dem_event_count_cw_scale_tt$\n\n每當軍方批評這份虛假草案，我們在內戰中的支持度就會增加，最高可達§Y75%§!的內戰支持。還可根據民主支持度總和（從§Y0%-100%§!比例折算）額外獲得§Y25%§!的內戰支持。"
 SIA_dem_event_count_cw_scale_tt: "§Y當前預計支持度§!：§G[?var:SIA_dem_event_count_cw_scale|%]§!"
 SIA_to_lay_the_bait_desc: "黃皮檔案呼籲經濟改革，但軍方會稱之為共產主義。先洩露一份偽造的激進草案，激怒他們，待真正較溫和的版本公佈時，便可令他們信用掃地。"
 SIA_and_spring_the_trap: "啟動陷阱"
 SIA_and_spring_the_trap_desc: "軍方將領已然中計。他們的憤怒演變為叛亂，野心也隨之徹底暴露，而文官政府早已佈下萬全之策。如今收網時刻已至，[ROOT.GetName]的未來，將由忠於憲法的忠志之士全權定奪。"
 SIA_and_spring_the_trap_tt: "若我們的總支持度超過§Y80%§!，將避免內戰並立即解除軍方權力。"
 SIA_rebuild_the_war_torn_economy: "重建飽受戰爭摧殘的經濟"
 SIA_rebuild_the_war_torn_economy_desc: "內戰破壞了道路、工廠、稻田與貿易路線。必須馬上開始重建。工資、糧食、鐵路和信貸，這比在曼谷的任何演說都更能穩定[ROOT.GetName]。"
 SIA_end_military_grift: "終結軍方貪腐"
 SIA_end_military_grift_desc: "軍事預算長期流入私人口袋、庇護網絡和無用的面子工程。戰爭揭露了這些腐敗現象。每一筆腐敗合同、每一支幽靈部隊、每一批被盜的物資，都必須徹查並從舊集團手中收回。"
 SIA_the_purge: "大清洗"
 SIA_the_purge_desc: "軍事集團寧可讓國家流血，也不願服從文官統治。對這些叛徒決不能妥協。凡是牽扯其中的軍官、合作者與支持者都必須從指揮職位上清除，以免他們再次威脅國家。"
 SIA_achieve_foreign_legitimacy: "獲取外國承認"
 SIA_achieve_foreign_legitimacy_desc: "外國列強一直以懷疑的目光注視著我們的危機，等著看暹羅會垮于軍政府統治還是革命。我們必須證明文官政府穩定、合法，並且有能力保衛國家。"
 SIA_achieve_foreign_legitimacy_trigger: "任意主要國家對我們的評價超過§Y75§!"
 SIA_countries_that_like_me_doctrine_tt: "§Y[?var:SIA_countries_that_like_me]x§!§G50%§!花費減免：§Y陸軍學說§!"
 SIA_achieve_foreign_legitimacy_tt: "每個對我們的評價超過§Y75§!的主要國家使穩定度提高§G[?var:SIA_achieve_foreign_legitimacy_base_stab_gain|%.0]§!。\n\n如果超過§Y3§!個主要國家符合條件，則超出部分的每個符合條件的國家還將使§Y陸軍學說§!的花費降低§Y1x§!§G50%§!。\n\n如果有§Y6§!個及以上主要國家符合條件，則我們將獲得§G+2§!§Y民用工廠§!。"
 SIA_secure_the_state: "穩定國政"
 SIA_secure_the_state_desc: "內戰勝利並不等於穩定。必須確保鐵路、港口、軍械庫和通訊樞紐的安全，以防反動軍官重整旗鼓。曼谷必須保持鎮定，與各地聯繫暢通，並牢牢處於文官控制之下。"
 SIA_expand_upon_the_dossier: "增訂黃皮檔案"
 SIA_expand_upon_the_dossier_desc: "黃皮檔案編寫於危機之時。那一刻已經過去。擊敗軍事集團後，我們可以走得更遠：更深入的土地改革、更強的勞工保護，以及一個有能力從根本重塑暹羅的國家。"
 SIA_military_oversight_bureau: "軍事監察局"
 SIA_military_oversight_bureau_desc: "決不能再讓軍隊成為國中之國。一個由文官領導的監察局將審查軍隊內的人事任命、預算和政治活動，確保這些當兵的服從曼谷，而不是反過來。"
 SIA_military_oversight_bureau_tt: "§Y軍事監察局§!每5至9個月便會對現役將領展開調查。在此期間，接受調查的將領將時刻忌憚愈發嚴密的政治審查，其行動效率因此降低。"
 SIA_the_yellow_dossier: "黃皮檔案"
 SIA_the_yellow_dossier_desc: "偽造的激進草案已發揮完作用。現在可以實施真正的黃皮檔案了：慎重的改革、經濟現代化以及旨在打破軍方主導同時又不讓國家陷入混亂的政治保障。"
 SIA_achieve_domestic_legitimacy: "獲取國內認可"
 SIA_achieve_domestic_legitimacy_desc: "政府憑藉武力得以生存，但如今必須靠法律、麵包和秩序贏得人心。必須恢復公眾信心，必須為緊急措施正名，必須讓人民看到文官統治提供的不只是苟活。"
 SIA_achieve_domestic_legitimacy_tt: "§Y人民黨體制§!將被廢止。\n§Y軍方派§!將遭到永久解散，完全移除其精神。\n\n§Y文官派§!將永久整合入§Y$idea_SIA_unwavering_civilian_support$§!。"
 SIA_allies_integration: "融入同盟國作戰體系"
 SIA_allies_integration_desc: "我軍必須學會與同盟國協同作戰。指揮體系、通訊機制、補給流程與軍械標準都需全面接軌，唯有如此，暹羅才能擺脫象徵性盟友的身份，真正融入同盟國作戰體系。"
 SIA_prepare_for_a_pacific_war: "準備太平洋戰爭"
 SIA_prepare_for_a_pacific_war_desc: "各帝國的目光正轉向太平洋。日本的野心、歐洲的殖民地以及同盟國的戰略，都指向一場迫近的風暴。暹羅必須在戰火燒到我們海岸之前做好準備。"
 SIA_the_end_of_gunboat_diplomacy: "炮艦外交的終結"
 SIA_the_end_of_gunboat_diplomacy_desc: "絕不能再允許外國軍艦盤踞湄南河口、恃強要挾了。暹羅必須自建岸防重炮、船塢設施、水雷佈設體系與海岸防禦工事，讓任何妄圖兵臨曼谷的挑釁都淪為自取滅亡的狂妄之舉。"
 SIA_preemtive_strike: "先發制人"
 SIA_preemtive_strike_desc: "坐等日本擇機開戰實屬愚行。倘若日本帝國意圖席捲亞洲，[SIA.GetName]便必須在其陸海軍主力深陷其他戰場之前，主動先發制人。"
 SIA_the_siamese_armada: "[SIA.GetAdjective]艦隊"
 SIA_the_siamese_armada_desc: "現代的[SIA.GetName]需要現代的艦隊。憑藉新式船艦、訓練有素的艦員和擴建的海軍基礎設施，[SIA.GetAdjective]艦隊將成為能夠保衛海岸並向遠海投射力量的軍事存在。"
 SIA_asian_democratic_compact: "亞洲民主協定"
 SIA_a_more_moderate_option: "更溫和的路線"
 SIA_a_more_moderate_option_desc: "改革必須持久，不能在反對的風暴中燃盡自己。將黃皮檔案保持在溫和範圍內，就能孤立極端分子，安撫中產階級，建立起一個能挺過首場勝利的文官秩序。"
 SIA_asian_democratic_compact_desc: "亞洲不能永遠依賴遙遠的帝國或列強的承諾。本地區的民主國家必須精誠團結，相互捍衛獨立，證明獨立與自由的理念可以在亞洲生存下去。"
 SIA_asian_democratic_compact_tt: "解鎖能力，允許我們要求別國釋放亞洲的附屬地區，並邀請它們加入我們的陣營。"
 SIA_asian_democratic_compact_modify: "對§Y$SIA_asian_democratic_compact$§!追加效果："
 SIA_southeast_asia_joint_command: "東南亞聯合司令部"
 SIA_southeast_asia_joint_command_desc: "我們的協定必須超越一紙外交承諾。一個聯合指揮部將協調整個東南亞的戰略、補給、情報和防禦計劃，將分散的軍隊鑄成共同的盾牌。"
 SIA_pan_asian_weapon_standardization: "泛亞洲武器標準化"
 SIA_pan_asian_weapon_standardization_desc: "各盟友若使用不同的步槍、口徑、電臺和車輛，無疑將後勤的災難。武器標準化與聯合生產計劃，將使我們聯盟的武裝更強、更省、更快。"
 SIA_united_against_aggression: "共同對抗侵略"
 SIA_united_against_aggression_desc: "我們協定中的任何成員都不應孤軍奮戰。無論威脅來自帝國、法西斯主義、軍國主義還是機會主義鄰邦，亞洲各國將聯手應敵。"
 SIA_the_hammers_that_strike: "揮下重錘"
 SIA_the_hammers_that_strike_desc: "我們的同盟已不再是一群掙扎求生的小國，而是一件武器。每一個國家都是一把錘子，我們將一齊痛擊任何妄圖主宰亞洲的力量。"
 SIA_mobilize_the_defenders_of_siam: "動員暹羅的保衛者"
 SIA_mobilize_the_defenders_of_siam_desc: "舊軍隊辜負了國家，但暹羅仍需要保衛者。志願兵、忠誠的軍官、地方衛隊和愛國公民，必須被組織成一支能保護憲法、抵禦內外之敵的力量。"
 SIA_join_the_allies: "加入同盟國"
 SIA_join_the_allies_desc: "當世界被戰火吞噬時，[ROOT.GetName]不能孤立無援。同盟國提供武器，承認並賦予它在抵抗侵略的國家中一席之地。加入他們，就是把暹羅的生存與更廣泛的自由世界鬥爭綁在一起。"
 SIA_the_malay_peninsular_defense_plan: "馬來半島防禦計劃"
 SIA_the_malay_peninsular_defense_plan_desc: "如果戰爭降臨東南亞，馬來亞將是首當其衝的戰場之一。修築工事、補給站，並與英國進行聯合規劃，將把這個半島變成抵禦入侵的盾牌。"
 SIA_the_malay_peninsular_defense_plan_tt: "修建曼谷與新加坡之間的鐵路。\n\n在[MAL.GetName]、新加坡、[724.GetName]、[289.GetName]和[1076.GetName]的每個勝利點\n增加§G2§!級§Y海岸堡壘§!\n增加§G2§!級§Y陸上堡壘§!\n每個地區：\n增加§G1§!級§Y防空陣地§!"
 SIA_join_the_united_front: "加入統一戰線"
 SIA_join_the_united_front_desc: "中國在[JAP.GetAdjective]的侵略下流血，卻仍在戰鬥。加入統一戰線，[SIA.GetName]能提供支援，把這場陸戰變成帝國野心的墳場。"
 SIA_a_land_war_in_asia_desc: "僅憑宣告贏不了戰爭。暹羅士兵必須在亞洲的艱險地形上進軍、戰鬥並堅持到底。我們對統一戰線的承諾，必須以行動來衡量。"
 SIA_death_to_the_communists: "消滅共產主義者"
 SIA_death_to_the_communists_desc: "擊敗軍事集團，決不能讓另一場暴政乘虛而入。共產主義煽動者以為這場危機削弱了國家。他們很快將明白，文官民主政府並非毫無還手之力。"
 SIA_death_to_the_nationalists: "消滅民族主義者"
 SIA_death_to_the_nationalists_desc: "日本已被擊退，但亞洲未來的問題仍在。舊的民族主義秩序只會用一種等級制替代另一種。若要重塑亞洲，共產主義者必須獲勝。"
 SIA_a_new_dawn_over_asia: "亞洲的新黎明"
 SIA_a_new_dawn_over_asia_desc: "日本帝國已垮臺，那些妄圖繼承其廢墟的腐敗勢力也被掃除。遍及亞洲，新曙光正升起在各民族之上，他們決心擺脫帝國統治，建設自己的未來。"
 SIA_phibuns_premiership: "披汶內閣"
 SIA_phibuns_premiership_desc: "隨著[SIA_phraya_phahon.GetName]的總理任期結束，黨內選定的繼任者鑾披汶·頌堪已準備好接掌政權。這將極大地取悅軍方，但也會讓文治派感到焦慮不安。\n對我們來說，在這個新時代只有一條道路——以堅定的信念前進！"
 SIA_siamese_youth_movement: "[THIS.GetAdjective]青年運動"
 SIA_siamese_youth_movement_desc: "[THIS.GetName]的年輕人需要像鋼鐵在烈火中淬鍊一樣被鍛造。他們將學會尊重國家、保衛祖國，併成為泰國社會中有價值的一員。"
 SIA_territorial_defense_student: "領土防衛學生"
 SIA_territorial_defense_student_desc: "在青年運動的基礎上，最有前途的成員將被送往初級士兵訓練營，在那裡他們將協助保衛[SIA.GetNameDef]。他們將接受正規的軍事訓練，併成為軍隊可以使用的額外力量。"
 SIA_expand_domestic_arms_workshops: "擴建國內武器工廠"
 SIA_expand_domestic_arms_workshops_desc: "我們國內生產戰爭物資的能力遠遠落後於其他發達國家。我們必須重點擴大本土軍工生產，以確保軍隊不斷獲得新的裝備。"
 SIA_look_to_european_fascism: "借鑑歐洲法西斯主義"
 SIA_look_to_european_fascism_desc: "我們有機會重塑這個國家。擺脫過去的束縛，我們將面向未來，並從西方正在發生的變化中獲得啟發。舊的世界秩序顯然正在被拆解，而那些缺乏遠見、落在後面的人，將為此付出代價。"
 SIA_the_songsuradet_rebellion: "頌素拉德叛亂"
 SIA_the_songsuradet_rebellion_desc: "高級軍官披耶·頌素拉德將軍對現政權構成了威脅——只要他有意願。這種對政權的危險不能繼續存在。作為披汶的主要對手，他必須被清除。\n毫無疑問，我們掌握著大量可用來打擊頌素拉德及其支持者的不利材料，這將有助於鞏固我們的權力並消滅國內反對派。"
 SIA_the_songsuradet_rebellion_historical_tt: "頌素拉德將軍將被指控密謀反對國家。他和顧問§Y[SIA_rangsit_prayurasakdi.GetName]§!將被清洗。\n\n我們將獲得：\n"
 SIA_the_songsuradet_rebellion_historical_tt2: "超時後獲得："
 SIA_the_songsuradet_rebellion_historical_tt3: "持續§Y[?var:SIA_purged_military_timer]§!天"
 SIA_the_songsuradet_rebellion_alt_tt: "披耶·頌素拉德將軍將被指控陰謀叛國。\n\n然而，由於我們增強了他的軍事派系力量，他可能會膽大妄為並拒絕傳喚，從而導致僵持局面，甚至可能引發內戰。"
 SIA_sue_the_king_in_exile: "起訴流亡國王"
 SIA_sue_the_king_in_exile_desc: "流亡的國王據說在前往[ENG.GetNameDefCap]時帶走了大量貴重物品。我們必須把它們拿回來，如果需要起訴他和他的配偶來實現這一點，那也在所不惜。"
 SIA_suspend_ordinary_legal_procedures: "暫停普通法律程序"
 SIA_suspend_ordinary_legal_procedures_desc: "頌素拉德叛亂為我們提供了一個以國家安全為名實施全面改革的機會。法院和其他政治機構所掌握的制衡機制將被削弱，使我們能夠爭取時間集中權力。"
 SIA_the_duty_of_the_thai_people_during_the_war_act: "戰爭時期泰國人民義務法"
 SIA_the_duty_of_the_thai_people_during_the_war_act_desc: "$idea_SIA_cemented_control_3_desc$"
 SIA_recognize_manchukuo: "承認滿洲國"
 SIA_recognize_manchukuo_desc: "TODO_CM"
 SIA_press_censorship: "新聞審查"
 SIA_press_censorship_desc: "自由媒體可能削弱國家穩定。雖然必須保留一定空間，但我們必須確保政府的聲音和意志在媒體中佔據優先地位。"
 SIA_department_of_publicity: "宣傳部"
 SIA_department_of_publicity_desc: "任何國家都離不開宣傳機器，尤其是像我們這樣懷有領土抱負的國家。資助建立宣傳部門將使我們能夠實現這一目標。"
 SIA_thai_cultural_mandates: "泰國文化公告"
 SIA_thai_cultural_mandates_desc: "我們可以通過發佈文化公告來鼓舞泰國人民、建立強大的民族文化，加強人民團結並塑造統一的國家認同。"
 SIA_thai_cultural_mandates_tt: "解鎖可實施文化公告的決議，需要消耗§Y政治點數§!並提供各種加成。第一號公告和首個其他公告無需花費。"
 SIA_relocate_the_capital_to_phetchabun: "將首都遷至碧差汶"
 SIA_relocate_the_capital_to_phetchabun_desc: "政府正面臨威脅！歷史證明，曼谷容易遭受海軍攻擊。雖然這肯定會是一個不受歡迎的決定，但將首都遷往更內陸地區是必須做出的選擇。"
 SIA_relocate_the_capital_to_phetchabun_tt: "從§Y[1076.GetName]§!遷移最多§G3§!座§Y軍用工廠§!到§Y[1077.GetName]§!\n從§Y[1076.GetName]§!遷移§G3§!座§Y民用工廠§!到§Y[1077.GetName]§!\n在碧差汶周圍建造§G3級要塞§!"
 SIA_relocate_the_capital_to_phetchabun_tt2: "該民族精神結束時獲得基礎穩定度：§R-25%§!"
 SIA_radio_propaganda: "廣播宣傳"
 SIA_radio_propaganda_desc: "隨著[SIA.GetName]的電氣化，廣播正成為主流媒介。正如我們需要控制新聞媒體一樣，我們也必須掌控廣播內容。"
 SIA_sala_chaloem_thai_movie_theater: "開設差倫泰劇院"
 SIA_sala_chaloem_thai_movie_theater_tt: "解鎖製作宣傳電影的決議，提供各種加成。例如：\n"
 SIA_sala_chaloem_thai_movie_theater_desc: "電影在我國是一種新媒介，但其潛力顯而易見。就像詩歌、書籍和廣播一樣，它能夠影響普通人和精英階層的思想。通過這種媒介，我們可以增強公民的決心，讓他們支持一個崛起的偉大[SIA.GetName]。"
 SIA_pan_thaiism: "泛泰主義"
 SIA_pan_thaiism_desc: "[ROOT.GetName]不僅要生存，它必須繁榮。[ROOT.GetAdjective]民族的未來不應只是一個三流國家，而應成為世界事務中的積極參與者。首先必須動員人民的思想與情感，讓他們反對那些奪走我們土地的帝國主義者，並提醒人民我們曾經失去的一切。"
 vichy_exist_trigger: "§Y維希法國§!存在"
 vichy_exist_not_trigger: "§Y維希法國§!不存在"
 SIA_retake_lost_british_states: "收復被英國奪走的領土"
 SIA_retake_lost_british_states_tt: "解鎖對§Y緬甸§!和§Y馬來西亞§!的英國領土發動有限戰爭的能力"
 INS_retake_lost_british_states_tt: "解鎖對英屬§Y馬來西亞§!領土發動有限戰爭的能力。"
 SIA_retake_lost_british_states_desc: "不僅是[FRA.GetAdjective]分裂了我們的王國，[ENG.GetAdjective]也同樣在野心驅使下抓住每一個機會奪取屬於他們的一份。如今他們的注意力被更強大的對手吸引，我們行動的時刻已經到來。"
 SIA_recover_indochina: "收復印度支那"
 SIA_recover_indochina_desc: "上個世紀，我們的國家被[FRA.GetAdjective]分裂，那是一個遠在世界另一端的政府，卻用炮艦和武器奪走了屬於我們的土地。而在這個世紀，[FRA.GetAdjecive]的力量正在衰落；這個世紀屬於我們。"
 SIA_recover_indochina_tt: "解鎖對§Y印度支那§!領土發動有限戰爭的能力"
 SIA_demand_the_return_of_lost_territory: "要求歸還失地"
 SIA_demand_the_return_of_lost_territory_desc: "[FRA.GetNameDefCap]已暴露出其虛弱，不過是一隻仍試圖維持殘餘影響力的紙老虎。隨著其軍隊崩潰，他們已無法像過去那樣投射力量，也沒有能力反對我們的要求。"
 SIA_demand_the_return_of_lost_territory_tt: "我們將向§Y印度支那§!與§Y[MAL.GetName]§!部分地區的擁有者請求歸還§Y[1069.Getname]§!、§Y[1067.Getname]§!、§Y[741.Getname]§!、§Y[1068.Getname]§!、§Y[1061.Getname]§!、§Y[1064.Getname]§!、§Y[1065.Getname]§!和§Y[670.Getname]§!於我方。\n\n影響因素：\n-戰鬥力相較於擁有者不少於30%\n擁有者正在與主要國家交戰\n-擁有者無陣營\n-擁有者是§Y維希法國§!\n-我們在一個陣營中\n-擁有者厭惡我國"
 SIA_the_greater_thai_empire: "大泰帝國"
 SIA_the_greater_thai_empire_available_trigger: "§Y[ROOT.GetName]§!控制所有印度支那地區\n所有印度支那地區的順從度大於：§Y[?var:SIA_greater_thai_empire_compliance_requirement]%§!\n\n此外還需要："
 SIA_the_greater_thai_empire_desc: "我們崛起的時刻已經到來。曾經被奪走的一切已經恢復，而當地人民也承認我們是事實上的統治者。我們已經牢固確立了自己作為新生大泰帝國合法領導者的地位。"
 SIA_crack_down_of_foreign_merchants: "打擊外國商人"
 SIA_crack_down_of_foreign_merchants_desc: "貿易長期受到外部勢力影響，這造成了可能危及國家韌性的漏洞。為了保障經濟安全，我們必須能夠控制自己的貿易體系，確保繁榮和穩定建立在我們自己掌控的基礎之上。"
 SIA_royal_palace_bureau_directive_no_1523: "王室局第1523號指令"
 SIA_royal_palace_bureau_directive_no_1523_desc: "隨著國內民族主義情緒高漲，甚至王室也開始支持政府，要求王室所有成員捐出10%的收入用於購買更新式的武器。"
 SIA_end_factionalism: "終結派系鬥爭"
 SIA_end_factionalism_desc: "自革命以來，人民黨內部軍方派和文官派之間的裂痕始終籠罩著每一項決策。如果我們能讓兩派在足夠長的時間內堅定地支持政府，我們就能最終將他們融合為一個統一的人民黨，並永遠驅散政變的幽靈。"
 SIA_end_factionalism_available_tt: "§Y文官派§!和§Y軍方派§!連續§Y270§!天處於§G全力支持§!狀態。"
 SIA_end_factionalism_tt: "人民黨的內部派系鬥爭已經平息：\n   §Y文官派§!和§Y軍方派§!融合為§G統一人民黨§!\n   獲得精神§Y$idea_SIA_unified_khana_ratsadon$§!"
 SIA_turn_off_the_khana_ratsadon: "人民黨已解散"
 SIA_factionalism_overcome: "派系鬥爭已被克服"
 SIA_new_territories_administration: "新領土管理"
 SIA_new_territories_administration_tt: "解鎖管理§Y印度支那§!領土的決議，可提高順從度、工業能力和防禦工事。"
 SIA_new_territories_administration_desc: "收復失地只是第一步。我們必須向當地居民證明，我們是更好的選擇。政府將實施全面計劃，提高所有人的生活水平，讓每一位公民都能在這個新的大[ROOT.GetName]中感到平等。"
 SIA_new_territories_administration_available_trigger: "任何§Y印度支那§!地區\n   由§Y[ROOT.GetName]§!控制"
 SIA_industrialization_drive: "工業化進程"
 SIA_industrialization_drive_desc: "幾代人以來，[ROOT.GetName]的財富一直植根於稻田和鄉村。然而，現代世界的塑造者並非農具，而是工廠與機器。若要在列強中保持獨立，我們必須將農業王國轉變為工業國家。"
 SIA_industrialization_drive_trigger: "§Y人民黨§!活躍中"
 SIA_asian_financial_compact: "亞洲金融協定"
 SIA_asian_financial_compact_desc: "歐洲資本仍主導著亞洲貿易的很大一部分，使我們的經濟暴露於外部壓力之下。通過與鄰國尋求更緊密的金融安排，我們可以在不放棄獨立的前提下，擴大信貸、市場和投資的渠道。"
 SIA_revision_of_unequal_treaties: "修訂不平等條約"
 SIA_revision_of_unequal_treaties_desc: "昔日因孱弱而簽訂的舊協定，至今仍給予外國利益集團任何現代國家都不應容忍的特權。我們必須修改這些不平等條約，恢復[ROOT.GetNameDef]對其商業、司法和租界的全部主權。"
 SIA_renegotiate_teak_control: "重新談判柚木控制權"
 SIA_renegotiate_teak_control_desc: "北方森林的利潤落入特許經營者囊中，而國家所得甚少。通過重新談判柚木控制權，我們可以收回收入，規範開採，確保暹羅的木材服務於暹羅的發展。"
 SIA_a_fledgling_tobacco_industry: "新興菸草產業"
 SIA_a_fledgling_tobacco_industry_desc: "菸草仍是一項零散、組織不善的小宗貿易。通過適度的保護和謹慎的投資，這種小作物可以成為消費稅收入、農村收入和工廠工作的可靠來源。"
 SIA_a_fledgling_tobacco_industry_tt: "處於§Y$limited_exports$§!或§Y$closed_economy$§!狀態將額外為我們提供§Y民用工廠§!。"
 SIA_all_weather_roads: "全天候公路"
 SIA_all_weather_roads_desc: "太多道路在雨季消失，使各省與首都和市場隔絕。一個全天候公路網將把王國聯結在一起，讓貨物和士兵在任何季節都能通行。"
 SIA_the_bank_of_siam: "暹羅銀行"
 SIA_the_bank_of_siam_desc: "工業發展不能僅憑慣例和私人恩惠推進。一個更強大的國家銀行將使國家在信貸、貨幣和資本流通方面擁有更大的控制權。"
 SIA_thai_rice_company: "泰國稻米公司"
 SIA_thai_rice_company_desc: "大米仍是[ROOT.GetName]的命脈，但其貿易過於分散、投機性強，且易受外部壓力影響。一家國家大米公司將使國家能夠引導出口、穩定價格，並將稻田的收成轉化為國家實力的更堅實基礎。"
 SIA_uk_japan_focus_tt: "這允許在[ENG.GetNameDef]和[JAP.GetNameDef]之間做出選擇，效果如下：\n\n§Y[ENG.GetFlag][ENG.GetNameDefCap]§!："
 SIA_japan_option_tt: "§Y[JAP.GetFlag][JAP.GetNameDefCap]§!"
 SIA_send_bureaucrats_abroad: "派遣官僚出國學習"
 SIA_send_bureaucrats_abroad_desc: "其他國家已經建立了我們如今所需的政府部門、學校和技術服務機構。通過派遣有前途的官員出國，我們可以引進行政經驗，而不必引入外國統治。"
 SIA_baht_stabilization_act: "泰銖穩定法"
 SIA_baht_stabilization_act_desc: "現代經濟需要一種商人和投資者都信任的貨幣。穩定泰銖將減少貿易中的不確定性，併為[ROOT.GetNameDef]在國際市場上提供更穩固的基礎。"
 SIA_siamese_development_cooperative: "暹羅發展合作社"
 SIA_siamese_development_cooperative_desc: "私人資本趨於謹慎，國家無法獨自建設一切。一個國家發展合作社將使官員、商人和地主能夠為服務於共同經濟的項目彙集資源。"
 SIA_boon_rawd_brewery: "勝獅啤酒廠"
 SIA_boon_rawd_brewery_desc: "國內釀酒業不僅僅是消費問題。像勝獅這樣的企業表明，暹羅的資本、機械和管理能力可以在暹羅的土地上創造現代工業。"
 SIA_national_savings_bond: "國家儲蓄債券"
 SIA_national_savings_bond_desc: "國家的財富不能閒置在保險箱和裝飾品中，而道路和工廠卻遲遲未建。國家儲蓄債券將把私人儲蓄轉化為公共投資。"
 SIA_national_savings_bond_tt: "獲得$SIA_national_savings_bond$精神，其強度根據你的§Y徵兵法案§!按比例變化。徵兵法案等級越低，正面效果越強；等級越高，效果越差。\n\n在§Y$disarmed_nation$§!下獲得："
 SIA_national_savings_bond_scraping_the_barrel: "在§Y$scraping_the_barrel$§!下獲得："
 SIA_national_savings_bond_volunteer_only: "在§Y$volunteer_only$§!下獲得："
 SIA_national_savings_bond_limited_conscription: "在§Y$limited_conscription$§!下獲得："
 SIA_national_savings_bond_extensive_conscription: "在§Y$extensive_conscription$§!下獲得："
 SIA_national_savings_bond_service_by_requirement: "在§Y$service_by_requirement$§!下獲得："
 SIA_national_savings_bond_all_adult_serve: "在§Y$all_adults_serve$§!下獲得："
 SIA_national_savings_bond_current: "我們當前的動員法案將為我們提供："
 SIA_deficit_spending: "赤字財政"
 SIA_deficit_spending_desc: "正統的記賬方式無法及時建立現代經濟以應對危險的世界。國家必須敢於在當前財政收入之前支出，通過公共工程和採購來強制推動工業增長。"
 SIA_deficit_spending_tt: "民族精神效果結束後獲得："
 SIA_acquire_light_tools: "購置輕型工具設備"
 SIA_acquire_light_tools_desc: "在製造出大型機器之前，我們必須首先掌握基礎的工業工具。進口輕工具和車間設備將使小型工廠和修理廠在[ROOT.GetName]各地迅速增加。"
 SIA_railway_and_port_extensions: "鐵路與港口擴建"
 SIA_railway_and_port_extensions_desc: "大米、木材和錫如果無法到達市場就毫無價值。延伸鐵路、擴建港口，將各個省份納入全國商業網絡，並將[ROOT.GetNameDef]與更廣闊的世界連接起來。"
 SIA_mechanization_of_agriculture: "農業機械化"
 SIA_mechanization_of_agriculture_desc: "過多的勞動力仍被束縛在傳統農業中，幾乎沒有剩餘可供工業使用。通過向農村引入現代工具和機器，我們可以提高產量，併為工廠釋放勞動力。"
 SIA_irrigation: "灌溉工程"
 SIA_irrigation_desc: "農民的命運仍然隨著洪水和乾旱而起落。更廣泛的灌溉系統將穩定收成、擴大耕地面積，並使農村成為國家發展的更堅實基礎。"
 SIA_siam_cement_group: "[ROOT.GetName]水泥集團"
 SIA_siam_cement_group_desc: "在皇家贊助下成立的[ROOT.GetName]水泥集團，是[ROOT.GetNameDef]最重要的工業企業之一。通過有針對性的投資和政府支持，該公司可以從一家國內供應商轉變為我國更廣泛工業能力的基石——從字面意義上，為國家的未來奠定根基。"
 SIA_chemical_imports: "化學品進口"
 SIA_chemical_imports_desc: "現代農業和工業都依賴於我們目前產量不足的化合物。進口化學品將供應化肥、藥品、染料和炸藥，直到國內工業能夠承擔起這項任務。"
 SIA_chemical_imports_tt: "完成此國策時，若評價高於§Y[?var:ROOT.SIA_chemical_imports_opinion_threshold]§!，則增加§G+1§!個地圖外§Y民用工廠§!。"
 INS_chemical_imports_stolen_tt: "完成此國策時，若好感度高於§Y75§!，則增加§G[?var:ROOT.INS_guns_from_seek_help_focus]§!單位的步兵裝備。"
 SIA_foreign_currency_exchange: "外匯兌換"
 SIA_foreign_currency_exchange_desc: "工業化需要外國機械、藥品和燃料，但這些只能通過稀缺的外匯購買。受控的貨幣兌換系統將把外匯引導至對國家最為重要的工業部門。"
 SIA_farmers_into_the_city: "農民進城"
 SIA_farmers_into_the_city_desc: "僅靠農村勞動力無法維持現代經濟。隨著工業擴張，國家必須鼓勵從稻田到城鎮的有序遷移，以便在那裡形成新的城市勞動力。"
 SIA_textile_mills: "紡織廠"
 SIA_textile_mills_desc: "布料是日常必需品，但其中有太多是在國外織造再賣回給我們的。紡織廠將取代進口商品，僱傭城市勞動力，併為[ROOT.GetNameDef]提供現代生活的基礎工業之一。"
 SIA_public_credit: "公共信貸"
 SIA_public_credit_desc: "商人、種植者和製造商都受到資本獲取渠道有限的制約。通過擴大公共信貸，政府可以在私人金融猶豫不決的領域提供貸款，並將發展推向被忽視的部門。"
 SIA_public_credit_trigger: "$idea_SIA_public_credit_debt$已激活至少§Y180天§!"
 SIA_a_modern_economy: "現代化經濟"
 SIA_a_modern_economy_desc: "舊的農業秩序不會在一朝一夕間消失，但它不能再決定[ROOT.GetNameDef]的未來。隨著銀行、學校、工廠和基礎設施的逐步成型，我們正在開始建設一個配得上獨立現代國家的經濟體。"
 SIA_reduction_of_agricultural_yield_taxes: "降低農業產量稅"
 SIA_reduction_of_agricultural_yield_taxes_tt: "每月將$idea_SIA_agricultural_tax_reduction$的§Y消費品§!需求降低§Y[?var:SIA_agricultural_tax_reduction_cg_decrease_rate|%]§!，並每月增加§Y穩定度§!§Y[?var:SIA_agricultural_tax_reduction_stability_gain|%]§!，直到§Y消費品§!負面效果降至§Y0%§!。\n\n當該國家精神被移除時：\n"
 SIA_reduction_of_agricultural_yield_taxes_desc: "不能要求農民在沒有任何救濟的情況下供養王國、資助國家並承受所有困苦。通過降低農業產量的稅收，我們在農村留下更多剩餘產出，增強耕種者的忠誠，並鼓勵土地的產量上升。"
 SIA_fuel_oil_act: "燃料油法案"
 SIA_fuel_oil_act_desc: "現代運輸、工業和國防都依賴燃料，但在戰爭中燃料獲取可能被切斷。《燃料油法案》將對消費、儲存和緊急分配實施更嚴格的國家監管，以免稀缺資源被浪費。"
 SIA_siam_electricity_company: "暹羅電力公司"
 SIA_siam_electricity_company_desc: "沒有可靠的電力，任何經濟體都無法承受現代壓力。通過加強暹羅電力公司，我們可以擴大發電規模、改善協調，並確保車間、倉庫和城市即使在逆境中也能保持供應。"
 SIA_revise_the_taxation_system: "稅制改革"
 SIA_revise_the_taxation_system_desc: "目前的稅收結構無法充分服務於一個正在為艱難和自力更生做準備的國家。修訂後的稅收制度將更均衡地徵收財政收入，減少浪費，並以更嚴格的方式將國防和發展的負擔進行分配。"
 SIA_census_the_hill_tribes: "山區部族人口普查"
 SIA_census_the_hill_tribes_desc: "高地仍然遠未達到行政、稅收和供應的全面覆蓋。適當的人口普查將為政府提供有效治理這些地區所需的知識，並將其人民和資源納入國家更廣闊的生活中。"
 SIA_increase_rice_exports: "增加大米出口"
 SIA_increase_rice_exports_desc: "大米是[ROOT.GetNameDef]可獲得的最可靠的外匯來源。通過在市場仍然開放時擴大出口，我們可以建立儲備、資助戰略進口，併為國庫應對可能到來的動盪做好準備。"
 SIA_pad_thai: "泰式炒河粉"
 SIA_pad_thai_desc: "現代國家不僅依靠部委和工廠維持，還需要將人民凝聚在一起的共同習慣。通過推廣使用暹羅食材製作的民族米食，我們鼓勵國內消費，支持我們的農民，並在不確定時期減少對外國食品的依賴。"
 SIA_rice_husk_steam_turbines: "稻殼蒸汽渦輪機"
 SIA_rice_husk_steam_turbines_desc: "外國人眼中的廢物，在必要性中教會我們去珍惜。通過燃燒稻殼進行蒸汽發電，我們可以從自己的收成中獲取能源，並減少對進口煤炭和石油的依賴。"
 SIA_domestic_tin_smelters: "國內錫冶煉廠"
 SIA_domestic_tin_smelters_desc: "僅僅從地下挖出礦石並運往海外已經不夠了。通過建造國內錫冶煉廠，我們將更多的資源價值留在國內，並獲取對商業和戰爭都至關重要的工業金屬。"
 SIA_use_ships_as_generators: "以艦船作為發電機"
 SIA_use_ships_as_generators_tt: "將我們擁有的§Y主力艦§!停泊在§Y核心州港口§!將為我們帶來每艘§Y主力艦§!§G-2%§!的工廠能耗增益，最高可達§G-15%§!。\n\n這些艦船離港將相應減少增益，重新將艦船停泊在港口即可恢復增益。"
 SIA_use_ships_as_generators_desc: "較舊型號的艦船即使不再適合戰鬥或貿易，仍可以為國家服務。通過將船舶繫泊作為浮動發電站，我們可以為港口和沿海工業提供應急電力，同時節省寶貴的燃料和基礎設施。"
 SIA_diversity_foreign_reserves: "外匯儲備多元化"
 SIA_diversity_foreign_reserves_desc: "[ROOT.GetNameDef]將財政安全寄託於任何一個外國勢力的貨幣或信用上是危險的。通過多元化我們的儲備，我們能減少外部衝擊的風險，並在貿易和外交中保留更大的行動自由。"
 SIA_diversity_foreign_reserves_tt: "開戰時增加額外§G2§!個地圖外§Y軍用工廠§!。\n開戰時在一個隨機核心地區增加§G8§!鋼鐵產量。"
 SIA_exclusivity_resource_contract: "資源獨家合同"
 SIA_exclusivity_resource_contract_desc: "一個外國夥伴提供資本和保證採購，以換取對我們資源的特權准入。這種排他性合同可能加速發展，但它將[ROOT.GetNameDef]的部分未來與另一個國家的喜惡捆綁在一起。"
 SIA_maintain_resource_independence: "維持資源獨立"
 SIA_maintain_resource_independence_desc: "外國合同可能帶來快速利潤，但依賴也隨之而來。通過保持對資源的控制，我們保留根據暹羅需求而非外國要求來支配資源的自由。"
 SIA_kasetsart_university: "農業大學"
 SIA_kasetsart_university_desc: "如果農業要提高生產力，它必須以科學為指導，而不僅僅依靠傳承。農業大學將培訓農學家、獸醫和技術專家，以實現土地的現代化。"
 SIA_mahidol_university: "瑪希隆大學"
 SIA_mahidol_university_desc: "現代國家需要醫生、研究人員和行政人員，正如它需要士兵和工程師一樣。瑪希敦大學將加強高等教育，為國家改革提供訓練有素的人才。"
 SIA_silpakorn_university: "泰國藝術大學"
 SIA_silpakorn_university_desc: "TODO_CM"
 SIA_contingency_funds: "應急資金"
 SIA_contingency_funds_desc: "如果國家在危機來臨時毫無準備，和平時期的繁榮就沒什麼價值。通過現在設立應急基金，我們確保封鎖、作物歉收或突然的戰爭不會立即導致政府機器停擺。"
 SIA_contingency_funds_tt: "我們將在和平時期積累應急基金。在積累基金期間，我們將獲得適度的§Y消費品系數§!。\n\n在戰爭期間，我們可以選擇釋放這筆基金，獲得巨大的生產加成。\n基金的持續時間取決於我們在釋放前積累基金的時間長短。"
 SIA_prepare_for_the_next_blockade: "為下一次封鎖做準備"
 SIA_prepare_for_the_next_blockade_desc: "一旦海洋陷入敵手，[ROOT.GetNameDef]可能會發現自己被切斷了市場、機械和燃料的渠道。因此，我們現在就必須為下一次封鎖做準備，在形勢所迫之前建立庫存、應急計劃和替代品。"
 SIA_domestic_arms_industry: "國內軍工產業"
 SIA_domestic_arms_industry_desc: "一個必須進口每一支步槍和每一發炮彈的王國不能自稱安全。無論起步多麼微小，國內軍工業將使[ROOT.GetNameDef]能夠用自己的車間武裝士兵，並在外國供應中斷時堅持下去。"
 SIA_war_material_substitutions: "戰爭物資替代"
 SIA_war_material_substitutions_desc: "在封鎖時期，完美的材料不如可用的材料有價值。我們必須研究金屬、化學品和進口部件的替代品，以便即使外國貨物無法抵達我們的海岸，生產也能繼續進行。"
 SIA_royal_thai_ordnance_factory: "泰國王家兵工廠"
 SIA_royal_thai_ordnance_factory_desc: "一個安全的國家需要的不僅僅是進口武器和零散的修理廠。皇家泰國軍械廠將把技術、機器和監督集中在王權之下，為[ROOT.GetNameDef]提供一個永久的武器彈藥製造中心。"
 SIA_built_to_withstand_every_flame: "經得起一切戰火"
 SIA_built_to_withstand_every_flame_desc: "一夜之間燒燬的工廠無法在第二天早晨為國家服務。我們的倉庫、工廠和車間在建設時必須考慮到分散佈局、防火和緊急保護，這樣破壞、轟炸或事故就不會輕易使生產癱瘓。"
 SIA_the_army_of_siam: "暹羅陸軍"
 SIA_the_army_of_siam_desc: "我們武裝部隊的舊結構，已不再適應時代要求。若[ROOT.GetName]要捍衛主權並在海外主張利益，就必須建立一支新型現代軍隊，其裝備、訓練和編制都要適應當今世界正在形成的戰爭。"
 SIA_plan_for_a_short_war: "短期戰爭計劃"
 SIA_plan_for_a_short_war_desc: "我們的資源有限，而敵人可能眾多。[ROOT.GetNameDefCap]經不起長期的消耗比拼。如果戰爭來臨，必須速戰速決，在敵人部隊集結前就結束戰事。"
 SIA_intermediate_war_preparation: "中期戰爭準備"
 SIA_intermediate_war_preparation_desc: "只准備閃電戰役是危險的，而完全為持久苦戰組織又是浪費。一套均衡的學說，能讓[ROOT.GetName]既有力出擊，又保持面對頑強對手所需的後勁。"
 SIA_prepare_for_a_long_war: "長期戰爭準備"
 SIA_prepare_for_a_long_war_desc: "大國也許能在幾個月內決出勝負，但小國往往被迫苦撐數年。因此，我們必須讓[ROOT.GetAdjective]的軍備、工業和運輸準備好應對一場漫長的消耗戰，耐心和韌性將與勇氣同樣重要。"
 SIA_specialized_warfare: "特種作戰"
 SIA_specialized_warfare_desc: "我國的地形不適於組建只有單一種類的陸軍。山地、叢林和河網地帶各有不同的技能要求。通過培養特種作戰的兵種，我們能確保[ROOT.GetNameDef]在任何戰場上都能以相適應的部隊迎敵。"
 SIA_artillery_reigns_supreme: "炮兵至上"
 SIA_artillery_reigns_supreme_desc: "現代戰鬥不只靠精神取勝。火炮依然是戰場之王，它能擊破據點、粉碎衝鋒、為我們的步兵開闢道路。若想獲勝，[ROOT.GetAdjective]的火力必須既充足又精準。"
 SIA_yield_the_air_war: "出讓制空權"
 SIA_yield_the_air_war_desc: "我們無法指望以對等條件在空中挑戰列強。與其在難以取勝的競爭中浪費寶貴資源，不如加強防空力量，讓敵機無法毫無代價地肆意攻擊我們的人員和城市。"
 SIA_the_thunder_at_the_gates: "門前驚雷"
 SIA_the_thunder_at_the_gates_desc: "有些堡壘是普通火炮無法摧毀的，有些攻勢則必須以壓倒性火力宣告。重炮、攻城炮和列車炮，將賦予[ROOT.GetNameDef]砸開敵人大門的力量，讓任何錯將我們的剋制當作軟弱的人都付出代價。"
 SIA_night_time_training: "夜間訓練"
 SIA_night_time_training_desc: "在準備充分的敵人面前，在白天莽撞進攻只會招致災難。訓練我們的士兵在夜色掩護下滲透、運動和攻擊，就能在敵人視線不清、混亂且最無力應對時奪得主動權。"
 SIA_steel_arteries: "鋼鐵動脈"
 SIA_steel_arteries_desc: "缺乏鐵路和公路的支撐，任何軍隊都走不遠。必須加強國家的鋼鐵動脈，使部隊、補給和火炮能被迅速運往每一個受威脅的邊境。在這項工作中，軍事安全與國家發展相輔相成。"
 SIA_prepare_northern_infrastructure_for_war: "為戰爭準備北方基礎設施"
 SIA_prepare_northern_infrastructure_for_war_desc: "在與緬甸及其背後勢力的任何角逐中，北部通道都將舉足輕重。必須立即擴建該地區的公路、鐵路和倉庫，使[ROOT.GetAdjective]部隊能夠毫無遲滯地前進或固守。"
 SIA_unconventional_tank_construction: "非常規坦克建造"
 SIA_unconventional_tank_construction_desc: "我們無法逐項模仿大國的裝甲計劃。若[ROOT.GetNameDef]真要裝備坦克，就必須採用更廉價、更靈活的製造方式，捨棄不必要的奢華部件以換取數量和實用性。"
 SIA_conventional_tank_construction: "常規坦克建造"
 SIA_conventional_tank_construction_desc: "裝甲兵已成為現代戰爭中公認的兵種，權宜之計終究有限。因此，我們應建立正規的坦克工業，遵循合理的原則、標準化的設計和可靠的生產方法，造就一支與現代化軍隊相稱的力量。"
 SIA_reverse_engineer_allied_tanks: "逆向工程盟友的坦克"
 SIA_reverse_engineer_allied_tanks_desc: "別人已經承擔了試驗的代價。繳獲的坦克和進口的機器，可被拆解、研究和模仿。通過學習他國設計，[ROOT.GetName]可以加快建設自己的裝甲部隊的進程。"
 SIA_tankettes: "超輕型坦克"
 SIA_tankettes_desc: "超輕型坦克輕便、廉價且易於生產，或許無法單獨決定大會戰，但仍能用於偵察、殖民地作戰和步兵支援。對一個財力有限的國家來說，這種小型裝甲車輛是踏入機械化戰爭的務實的第一步。"
 SIA_jungle_armor: "叢林裝甲"
 SIA_jungle_armor_desc: "我們地區的叢林，容不下為歐洲平原設計的笨重機械。若裝甲部隊要為[ROOT.GetNameDef]效力，就必須適應狹窄的小徑、惡劣的路況和壓抑的氣候，犧牲重量換取機動，以適應叢林地形。"
 SIA_mountain_tanks: "山地坦克"
 SIA_mountain_tanks_desc: "崎嶇山地與險要隘口不能僅靠步兵獨力死守。研發適配複雜地形的緊湊型裝甲載具，能讓我軍在常規坦克無法通行的地域，投送具備防護能力的機動火力。"
 SIA_reluctant_submission: "勉強屈服"
 SIA_reluctant_submission_desc: "若[ROOT.GetNameDef]面臨更強敵人的入侵，公開抵抗可能只會帶來毀滅。屈服是痛苦的，但有時政府必須退讓，以保全國家免於毀滅，並等待更有利的時機。"
 SIA_reluctant_submission_trigger: "若我們在被攻擊時選擇事件中的§Y屈服§!選項，該國策將自動完成。"
 SIA_reluctant_submission_tt: "我們將能夠與一個進攻中的主要大國達成和平。但他們會要求我們為他們印鈔。\n我們的§Y消費品工廠§!產出將每月增加§Y[?idea_SIA_printing_money_monthly_change|%]§!，最高至§Y[?idea_SIA_printing_money_monthly_change_max|%]§!。\n\n選擇§Y$SIA_thai_rice_company$§!國策將使增幅降低§G50%§!\n\n選擇§Y$SIA_demand_repatriation$§!國策將移除印鈔需求。"
 SIA_seri_thai: "自由泰國"
 SIA_seri_thai_desc: "屈服不意味著放棄民族精神。在佔領與順從的表象之下，可以組織忠誠的地下力量，以留存獨立事業、蒐集情報，併為[ROOT.GetName]再次崛起的日子做準備。"
 SIA_contact_the_south_east_asia_command: "聯繫東南亞司令部"
 SIA_contact_the_south_east_asia_command_desc: "抵抗若要不止於英勇的姿態，就必須與更宏大的戰略結合。通過與東南亞的盟軍指揮部建立聯繫，[ROOT.GetName]的愛國者們可以獲得指導、補給，並在更大範圍的鬥爭中佔據一席。"
 SIA_broadcast_weather_reports_to_the_allies: "向同盟國廣播天氣報告"
 SIA_broadcast_weather_reports_to_the_allies_desc: "該地區的天空與海洋，不僅受艦隊和陸軍左右，同樣受天氣支配。來自[ROOT.GetNameDef]的可靠報告，能協助同盟國的規劃，使其免遭突襲，並將我們的祖國變成他們戰爭中雖無聲卻珍貴的夥伴。"
 SIA_american_investment_aid: "美國投資援助"
 SIA_american_investment_aid_desc: "美國擁有的財富遠超我們地區所能獲取的一切。若能爭取到美國的援助和投資，用於我們的地下鬥爭和民族事業，[ROOT.GetNameDef]就將獲得忍受苦難、準備解放的物質手段。"
 SIA_thai_students_in_the_oss: "泰國學生加入戰略情報局"
 SIA_thai_students_in_the_oss_desc: "新一代愛國青年可被送往國外，接受諜報、破壞和非正規戰的訓練。將忠誠的泰國學生送入同盟國的情報體系，我們就能為將來的隱蔽戰線培養忠誠的干將。"
 SIA_prepare_to_drop: "準備空投行動"
 SIA_prepare_to_drop_desc: "當解放的號角吹響時，同盟國的力量也許會自天而降，落在我們的祖國大地上。因此，我們必須提前選定合適的著陸地點，做好接應準備，並組織起完善的支援網絡，以便能夠順利接收空降部隊，並將他們引導至最需要他們的地方。"
 SIA_unseat_the_government: "推翻政府"
 SIA_unseat_the_government_desc: "一個把[ROOT.GetNameDef]綁在外國統治上的政權，絕不能任其永存。通過抵抗、權謀和適時行動，我們可以除掉那些出賣國家者，重建一個更配得上暹羅的政府。"
 SIA_unseat_the_government_tt: "[ROOT.GetName]將退出當前陣營，並在戰爭中轉換立場，加入§Y同盟國§!。\n\n效忠派將反抗這一變化，激起內戰。\n\n若我們的總支持率§Y超過 80%§!，我們將推翻政府並避免內戰。除民主支持率以外，每爭取一位將軍倒戈可額外獲得§Y5%§!的支持率。\n\n我們來自倒戈將軍的支持率為§Y[?var:SIA_seri_thai_cw_scale|%]§!，我們的民主支持率為§Y[?var:party_popularity@democratic|%]§!"
 SIA_choose_new_leader_tt: "隨著舊政權的瓦解，勝利者必須決定由誰來領導新政府。"
 SIA_the_phayap_army: "帕亞普軍"
 SIA_the_phayap_army_desc: "若我們把命運與入侵者綁在一起，那我們的陸軍就必須在新戰爭秩序中佔有一席之地。一個向西、向北作戰的專門野戰指揮部，將讓[ROOT.GetName]能與其強大夥伴一同推進，並謀取自身利益。"
 SIA_securing_the_rubber_islands: "控制橡膠群島"
 SIA_securing_the_rubber_islands_desc: "橡膠是現代戰爭的命脈，為輪胎、密封件和無數機械化衝突的器具提供原料。我國南邊資源豐富的領土既意味著機遇，也是必需。我們應當搶在他人之前將其掌控。"
 SIA_breaking_the_burmese_line: "突破緬甸防線"
 SIA_breaking_the_burmese_line_desc: "緬甸橫亙在我們的雄心與外邊的世界之間。若[ROOT.GetAdjective]的陸軍要證明其價值，就必須憑決心、籌劃和集中用兵，來摧毀那裡的敵軍陣線。"
 SIA_pacific_war: "太平洋戰爭"
 SIA_pacific_war_desc: "東亞衝突已不能被視為遙遠之事。太平洋戰爭正塑造著我們區域所有國家的命運，而[ROOT.GetNameDef]必須決定自己在這場鬥爭中的位置——無論是追隨者、夥伴還是犧牲品。"
 SIA_joint_asian_military_command: "亞洲聯合軍事司令部"
 SIA_joint_asian_military_command_desc: "若與我們區域的夥伴協調努力，我們的力量將更強大。一個聯合指揮架構，能提高效率、清晰規劃，並賦予戰役以共同方向，否則這些戰役可能因彼此競爭和混亂而被浪費。"
 SIA_demand_repatriation: "要求遣返"
 SIA_demand_repatriation_desc: "那些以權宜之計為藉口進入我們國土的人，已欠下[ROOT.GetNameDef]的債。一旦我們的處境改善，就應要求歸還被奪走的一切，並迫使佔領者償還他們入侵的代價。"
 SIA_standing_our_ground: "堅持我方立場"
 SIA_standing_our_ground_desc: "總會有退讓和談判只會帶來更多屈辱的時刻。[ROOT.GetNameDefCap]必須展示它依然擁有意志，未曾倒下、可以戰鬥並驅逐那些自以為能用槍口決定我們命運的傢伙。"
 SIA_standing_our_ground_trigger: "若我們在被攻擊時選擇事件中的§Y抵抗§!選項，該國策將自動完成。"
 SIA_ask_for_the_release_of_american_commodities: "請求疏通美國商品"
 SIA_ask_for_the_release_of_american_commodities_desc: "美國的庫存、機器和貨物，或可提供我國所需的喘息之機。通過審慎的外交，我們可以請求發放該類物資，緩解短缺，鞏固戰爭努力的物質基礎。"
 SIA_japanese_fighters: "日本戰鬥機"
 SIA_japanese_fighters_desc: "雖然我們自身的航空工業依然弱小，但外國飛機能幫助填補缺口。將日本戰鬥機納入[ROOT.GetAdjective]手中，至少能給我們一定程度的現代空中力量，哪怕僅限於我們工業薄弱所容許的範圍。"
 SIA_get_off_our_shores: "離開我們的海岸"
 SIA_get_off_our_shores_desc: "外國軍隊出現在暹羅的土地上，是無法用藉口輕描淡寫的冒犯。無論是靠武力，還是靠海外事件的壓力，我們都必須堅持讓入侵者離開我們的海岸，恢復[ROOT.GetNameDef]的尊嚴。\n\n如同所有殘忍的人一樣，他們只是懦夫。現在，離開我們的海岸。"
 SIA_singaporean_reinforcements: "新加坡增援"
 SIA_singaporean_reinforcements_desc: "馬來亞及更遠地區的鬥爭，與我們自身的安全密不可分。抽調集結在新加坡周圍的部隊作為援軍，能加固我國的戰線，擴大我們與盟軍的合作，並在共同目標下將整個戰區緊密聯結。"
 modify_SIA_directorate_of_aeronautical_engineering: "§Y航空工程局§!追加效果："
 SIA_aid_for_resources: "資源換援助"
 SIA_aid_for_resources_desc: "我國擁有外國所渴望的資源，也缺乏他們能提供的某些工具。謹慎地用援助換取物資，將有助於維持[ROOT.GetNameDef]的供應，同時確保我們的財富為自保效力。"
 SIA_aid_for_resources_tt: "我們會要求[JAP.GetNameDef]加入我們的戰爭，以§Y[724.GetName]§!的橡膠資源權為條件"
 SIA_how_quickly_the_tables_turn: "風水輪流轉"
 SIA_how_quickly_the_tables_turn_desc: "那些曾視[ROOT.GetNameDef]為軟弱順從的傢伙，或許會發現局勢已然逆轉。戰爭中的運勢瞬息萬變，我們必須準備好在壓迫者開始衰敗、形勢終於對我有利的時刻，果斷抓住時機。"
 SIA_how_quickly_the_tables_turn_trigger: "我們曾遭一大國攻擊，並使該大國投降。"
 SIA_royal_thai_navy: "泰國王家海軍"
 SIA_royal_thai_navy_desc: "保衛[ROOT.GetNameDef]不止於海岸線。我們的海岸、河流與海上貿易，需要一支與王國相稱的艦隊。通過加強泰國皇家海軍，我們將確保暹羅始終是其水域的主人。"
 modify_royal_thai_navy: "§Y$idea_SIA_thai_royal_navy$§!追加效果："
 SIA_direct_army_fundings_towards_the_navy: "將陸軍資金投入海軍"
 SIA_direct_army_fundings_towards_the_navy_desc: "陸軍長期吞噬了軍費的大頭，然而[ROOT.GetNameDef]的戰略需求並不全在大陸。將經費轉向艦隊，我們便能著手糾正這種失衡，並保衛庇護我們貿易與海岸的海洋。"
 SIA_thonburi_class_coastal_defense_ship: "吞武里級海岸防禦艦"
 SIA_thonburi_class_coastal_defense_ship_desc: "一支規模適中的艦隊，若按本地條件合理設計，仍能擁有鋒利的牙齒。吞武里級為[ROOT.GetNameDef]提供了近海防禦的實用手段，將可觀的火力與最適合我們急需保衛水域的角色結合了起來。"
 SIA_acquire_submarines: "購置潛艇"
 SIA_acquire_submarines_desc: "潛艇能讓小國海軍打出超過其體量的重擊。潛藏於波濤之下，它們能威脅航運、威懾更強的艦隊，並讓任何針對我們海岸的敵對圖謀變得複雜。[ROOT.GetNameDefCap]不應忽視這樣的武器。"
 SIA_submarine_day: "潛艇日"
 SIA_submarine_day_desc: "將水下戰引入我們的艦隊，值得公眾的認可與全國的激情。通過頌揚潛艇兵種，我們能夠鼓勵民眾應徵入伍、提升政府威望，並在公眾心中牢固樹立暹羅正邁入一個新海軍時代的觀念。"
 SIA_the_thonburi_dockyard_project: "吞武里造船廠計劃"
 SIA_the_thonburi_dockyard_project_desc: "海軍不能只靠進口船體來維持。若[ROOT.GetNameDef]要維持並擴大其海上力量，就必須投資船塢、車間和勞動力，這些才是構成海權的真正基礎。"
 SIA_expand_the_slipways: "擴建船臺"
 SIA_expand_the_slipways_desc: "我們現有的設施，對正在成形的雄心來說已過於擁擠。通過擴建船臺，我們將增強建造和修理艦船的能力，使艦隊得以擴充規模並提升戰備。"
 SIA_a_new_drydock: "新建的幹船塢"
 SIA_a_new_drydock_desc: "正規的海軍維護需要現代化的幹船塢。沒有它，大型艦艇的保養便始終緩慢、低效且依賴外援。一座嶄新的幹船塢將讓[ROOT.GetNameDef]更有力地掌握自己的海軍未來。"
 SIA_install_heavy_cranes_and_power_plant: "安裝重型起重機與發電站"
 SIA_install_heavy_cranes_and_power_plant_desc: "造船不僅是木料和鋼鐵的事，更關乎機器與能源。重型起重機和可靠的電力供應，將把我們的船廠從簡陋的設施，改造成現代工業的合格工具。"
 SIA_establish_the_foundry_and_machine_shop: "建立鑄造廠與機床車間"
 SIA_establish_the_foundry_and_machine_shop_desc: "一支主權國家的海軍需要的，不只是用進口零件組裝的船殼。通過建立我們自己的鑄造與機械車間，我們將強化工業筋骨，從而使[ROOT.GetNameDef]能在國內鑄造、加工和修理軍艦的關鍵部件。"
 SIA_the_thonburi_arsenal: "吞武里兵工廠"
 SIA_the_thonburi_arsenal_desc: "缺乏武器裝備的船塢是不完整的。在吞武里設立兵工廠，將使海軍火炮、彈藥和相關裝備的製造與儲存成為可能，把我們的艦隊與國家工業更緊密地聯結起來。"
 SIA_focus_on_commercial_civilian_ships: "專注商用民船"
 SIA_focus_on_commercial_civilian_ships_desc: "並非每一根鋪設的龍骨都須為戰鬥而生。商船、運輸船和其他民用船舶，構成國民經濟的循環系統。通過鼓勵商業造船，[ROOT.GetNameDef]將同時增強經濟繁榮與戰時的韌性。"
 SIA_empower_the_coastguard: "強化海岸警衛隊"
 SIA_empower_the_coastguard_desc: "艦隊不可能無處不在，而海岸安全的許多任務由更輕便的勤務力量承擔更為恰當。一支強化後的海岸警衛隊，將保護我們的漁業、警戒我們的海岸，並使海軍得以騰出手來應對更嚴峻的威脅。"
 SIA_river_patrols: "河流巡邏"
 SIA_river_patrols_desc: "[ROOT.GetNameDef]的河流，既是道路，也是邊疆，又是生命線。這些水域上的巡邏艇，將幫助我們維護秩序、支援當地駐軍，並將國家的力量延伸至遙遠的首都難以迅速應對的區域。"
 SIA_sell_bangkok_dock_co: "出售曼谷船塢公司"
 SIA_sell_bangkok_dock_co_desc: "私人資本或許能做由國家管理完成得太過緩慢的事。將曼谷船塢公司賣給能力勝任的人，我們或許能吸引投資、激發效率，並將公共資金轉向更緊迫的軍事需求。"
 SIA_a_race_against_time: "與時間賽跑"
 SIA_a_race_against_time_desc: "我們的海軍過時、經費不足，對現代戰爭毫無準備。必須立刻將資金轉投向造船、改裝、岸防和海軍訓練。時鐘走得遠比我們的船塢更快。"
 SIA_a_race_against_time_tt: "民族精神效果結束後，我們將獲得："
 SIA_a_race_against_time_tt2: "持續§Y280§!天"
 #Tech
 the_thunder_at_our_gates_artillery: "門前驚雷"
 SIA_siamese_tankettes: "暹羅超輕型坦克"
 SIA_siamese_tankettes_desc: "我們的陸軍已熟悉所裝備的輕型小坦克，提升了可靠性，並降低了戰場維護成本。"
