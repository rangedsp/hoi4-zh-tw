l_simp_chinese:
 INS_nationalize_companies_tt: "所有軍工機構和工業企業將被國有化並重新命名。"
 available_focus_tt: "§G可用§!國策：\n"
 INS_is_union_tt: "已成立荷蘭-印度尼西亞聯邦"
 INS_is_union_tt_NOT: "尚未成立荷蘭-印度尼西亞聯邦"
 INS_denounce_soetardjo: "譴責蘇塔爾喬"
 INS_denounce_soetardjo_tt: "我們將開始策劃一場地下革命，滲透政府並在群島各地建立游擊小組。待準備充分後，我們將發動針對荷蘭的獨立游擊戰爭。"
 INS_soetardjo_petition_debate_done_tt: "人民議會關於蘇塔爾喬自治請願的辯論已結束"
 INS_tkr_tt: "§Y人民安全軍§!追加效果："
 INS_commander_sudirman_tt: "§Y蘇迪爾曼§!（[INS.GetFlag]）晉升為§Y陸軍元帥§!"
 INS_the_declaration_of_independence: "獨立宣言"
 INS_the_declaration_of_independence_desc: "我們不能再冒險等待，必須趁熱打鐵！我們應派遣民兵迅速控制港口、城市和工業中心，讓荷蘭當局來不及反應。然後，我們將宣佈獨立，成立印度尼西亞共和國。"
 INS_the_declaration_of_independence_tt: "我們將宣佈§Y獨立§!。所有我們建立了§Y民兵基地§!或§Y總部§!的地區都將由我們控制，其餘地區仍歸屬[HOL.GetNameDef]\n\n[HOL.GetNameDefCap]不會承認我們的主權，低烈度衝突將開始。這可能升級為§R戰爭§!。\n\n解鎖接管地區的地面襲擊。"
 INSHOL_the_declaration_of_independence: "民族革命"
 INS_laskar_rakjat: "人民武裝"
 INS_laskar_rakjat_desc: "革命由印度尼西亞各地眾多民兵組成，有大有小。組織民兵是取得勝利的必要步驟。但我們不能操之過急，因為把權力賦予那些與我們政治對手有關聯的民兵可能會招致災難。"
 INS_militia_tt: "創建一種新的§Y自由鬥士§!民兵師編制，並解鎖管理他們的決議。"
 INS_militia_warning_tt: "民兵是§Y半自治§!的自由鬥士團體。他們會為我們而戰，但他們的幫助不是無償的。他們期望自己的努力得到補償。§R如果要求得不到滿足，穩定性將受到嚴重影響！§!"
 INS_usa_tanks_opinion_mod: "購買我國坦克"
 INS_republic_add_generals_tt: "（§Y$INS_sudirman$§!（[INS.GetFlag]）、§Y$INS_soengkono$§!（[INS.GetFlag]）、§Y$INS_supriyadi$§!（[INS.GetFlag]）、§Y$INS_djatikoesoemo$§!（[INS.GetFlag]）、§Y$INS_maludin_simbolan$§!（[INS.GetFlag]））成為陸軍將領。"
 INS_big_militia_presence_tt: "宣佈獨立後將由我方民兵控制。"
 INS_prepare_raiding_bases: "準備突襲基地"
 INS_prepare_raiding_bases_desc: "我們將利用我們的間諜網絡，在整個群島秘密建立掩體，確保革命開始時我們已做好打擊準備。"
 # <Joint Tree - Central Milestones>
 INSHOL_dutch_east_indies: "荷屬東印度"
 INSHOL_dutch_east_indies_desc: "該殖民地建立於近500年前，此後經歷了多種形態。世界變化迅速，我們現在的行動將決定荷蘭與印度尼西亞關係的長遠未來。"
 INSHOL_the_war_in_europe: "歐洲戰火"
 INSHOL_the_war_in_europe_desc: "歐洲衝突迅速升級，荷蘭現已捲入戰爭。我們不能再依賴他們保護，必須堅守陣地，否則有被外國勢力征服的風險。"
 # <Joint Tree - Military Equipment Contracts>
 INSHOL_military_equipment_contracts: "軍事裝備合同"
 INSHOL_military_equipment_contracts_desc: "東印度群島是擁有數千萬公民的廣闊群島。我們遠未具備自衛所需的工業產能。然而，我們有足夠的資源來確保與全世界的貿易。通過與世界各地的民主國家簽訂合同，我們的問題可以得到解決。"
 INSHOL_hawk_75a7: "霍克75A-7"
 INSHOL_hawk_75a7_desc: "美國霍克75A-7戰鬥機是適合東印度群島的完美機型，價格實惠且性能強大。我們可以與製造商達成協議，為空軍進行急需的升級。"
 INSHOL_purchase_american_tanks: "購買美國坦克"
 INSHOL_purchase_american_tanks_desc: "雖然東印度群島缺乏製造坦克所需的工業能力，但我們可以直接用東印度群島的橡膠產業資金從美國購買坦克。"
 INSHOL_purchase_british_artillery: "購買英國火炮"
 INSHOL_purchase_british_artillery_desc: "我們可以將火炮製造外包給英國，從而優先生產其他裝備。"
 INSHOL_produce_own_goods: "生產自有裝備"
 INSHOL_produce_own_goods_desc: "雖然我們可以達成許多有利可圖的貿易協議，但我們不能忘記自己的生產線和軍事工業公司。我們應當補貼這些公司，以減少對外國進口的依賴。"
 # <Joint Tree - East Indies Investments>
 INSHOL_east_indies_investments: "東印度投資"
 INSHOL_east_indies_investments_desc: "好的宗主國應當投資其殖民地的發展。投資東印度群島的經濟發展符合我們的最佳利益，也對殖民地公民有益。"
 INSHOL_east_indies_student_exchange: "東印度學生交換計劃"
 INSHOL_east_indies_student_exchange_desc: "建立一個允許印度尼西亞人前往荷蘭大學學習的體系，對荷蘭和東印度群島的經濟都是重大利好。"
 INSHOL_east_indies_fokker_division: "組建東印度福克子公司"
 INSHOL_east_indies_fokker_division_desc: "福克公司已獲得東印度空軍足夠多的許可，值得考慮設立一個專注於東印度空軍的專門子公司。"
 INSHOL_expand_shell: "擴建殼牌基礎設施"
 INSHOL_expand_shell_desc: "殼牌正逐漸成為我們經濟中更大的一部分。顯然，我們必須擴建東印度群島的石油基礎設施，跟上殼牌的出口能力。"
 INSHOL_increase_funding_for_tix: "增加T.IX飛機項目資金"
 INSHOL_increase_funding_for_tix_desc: "福克公司的工程師正在開發一種新型雙引擎轟炸機，以取代東印度空軍使用的過時型號。該項目的預算非常低，有可能在很長一段時間內無法完成。我們可以增加資金，大幅加快進度。"
 INSHOL_reduce_land_ownership_taxes: "降低土地所有權稅"
 INSHOL_reduce_land_ownership_taxes_desc: "我們應降低對擁有土地的印度尼西亞公民徵收的稅款，鼓勵農場和企業的發展。"
 INSHOL_coffee_plantations: "咖啡種植園"
 INSHOL_coffee_plantations_desc: "我們應專注於在東部的島嶼獲得更多國有土地，並用這些土地建造咖啡種植園。"
 INSHOL_overallwagen: "多用途戰車"
 INSHOL_overallwagen_desc: "坦克未必是東印度陸軍的最佳解決方案。我們缺乏生產坦克所需的工業實力，且惡劣的地形使其應用受限。我們可以投資為印度尼西亞建造裝甲車以填補這一空白。"
 INSHOL_indonesian_cheap_labor: "印度尼西亞廉價勞工"
 INSHOL_indonesian_cheap_labor_desc: "$CONGO_cheap_labor_desc$" #LL: stealing this to save time, hope you don't mind!
 INSHOL_eastern_development_fund: "東部群島發展基金"
 INSHOL_eastern_development_fund_desc: "我們過於注重對爪哇和蘇門答臘的投資，而忽略了殖民地的大部分土地。我們必須致力於開發東部的基礎設施，為未來的工業化奠定基礎。"
 INSHOL_increase_rubber_taxes: "提高橡膠稅"
 INSHOL_increase_rubber_taxes_desc: "東印度群島的許多橡膠公司正利用殖民地的資源獲取鉅額財富。對這些企業徵收重稅才是公平之舉。"
 INSHOL_reform_knil: "改革荷蘭皇家東印度陸軍"
 INSHOL_reform_knil_desc: "自東印度完成對整個群島的征服以來，荷蘭皇家東印度陸軍一直停滯不前，且嚴重缺乏資金。隨著全球緊張局勢加劇，我們必須儘早開始重新武裝東印度。"
 INSHOL_fund_ml_knil: "資助荷蘭皇家東印度陸軍航空兵"
 INSHOL_fund_ml_knil_desc: "若要跟上世界各國陸軍的步伐，我們必須建立一支屬於自己的強大空中力量，否則將處於顯著劣勢。"
 INSHOL_bandung_aircraft_facility_tt: "§Y西爪哇：§!\n 每完成一項前置國策，增加§G1§!個建築槽位和§G1§!個§Y軍用工廠§!。"
 INSHOL_rangers: "遊騎兵"
 INSHOL_rangers_desc: "東印度群島是一個環境多樣的廣闊群島。我們應訓練能適應這些惡劣環境作戰的遊騎兵，確保做好防禦準備。"
 INSHOL_mountaineers: "山地部隊"
 INSHOL_mountaineers_desc: "我們應訓練能在群島的惡劣地形中作戰的山地部隊。"
 INSHOL_elevate_elite_infantry: "特別部隊基地"
 INSHOL_elevate_elite_infantry_desc: "我們不能永遠依賴大戰時期的戰略，必須適應新技術，確保不落人後。我們應建立數個能應對各類環境的精銳步兵師。"
 INSHOL_modernize_knil: "現代化荷蘭皇家東印度陸軍"
 INSHOL_modernize_knil_desc: "我們將為東印度陸軍研究新的戰略和學說，確保對敵保持優勢。"
 INSHOL_transfer_of_henri_winkelman: "調任亨利·溫克爾曼"
 INSHOL_transfer_of_henri_winkelman_desc: "亨利·溫克爾曼曾在荷蘭皇家東印度陸軍服役多年。顯然，東印度再次需要他，我們應安排他正式調任至東印度群島。"
 INSHOL_eastern_conscription: "徵集輔助部隊"
 INSHOL_eastern_conscription_desc: "爪哇和馬都拉島上有數支由當地王公控制的本土輔助部隊。在此危急時刻，我們可以與當地統治者談判達成協議，使這些部隊歸我們指揮。"
 INSHOL_establish_vk_knil: "建立荷蘭皇家東印度陸軍女子軍團"
 INSHOL_establish_vk_knil_desc: "我們將為荷蘭皇家東印度陸軍建立一個婦女志願軍團。她們的貢獻將在改善我們的後勤和通訊方面發揮重要作用。"
 INSHOL_emergency_dockyard_construction: "緊急船塢建設"
 INSHOL_emergency_dockyard_construction_desc: "登陸作戰的威脅不容小覷，我們必須將海防作為重中之重。"
 INSHOL_emergency_powers_gov_general: "授予總督緊急權力"
 INSHOL_emergency_powers_gov_general_desc: "當前的戰爭需要迅速做出艱難決策，而東印度的所有決策都須先經荷蘭批准，這兩者不可能同時實現。我們應授予[INS.GetLeader]緊急權力，使其能立即採取行動。"
 INSHOL_emergency_naval_purchases: "緊急海軍採購"
 INSHOL_emergency_naval_purchases_desc: "我們的海岸線防禦不足，有被登陸的危險。時間至關重要，我們必須獲得更強大的海軍，否則必將滅亡。我們將舉債從私營公司購買船隻，並將其改裝為海軍驅逐艦。"
 INSHOL_east_indies_navy: "東印度海軍"
 INSHOL_east_indies_navy_desc: "[INS.GetNameDefCap]缺乏正式海軍，導致荷蘭不得不負責該殖民地的防務。隨著歐洲和亞洲局勢日益緊張，這種狀況已難以為繼。我們必須邁出第一步，建立一支專門的[INS.GetAdjective]海軍。"
 INSHOL_marines: "海軍陸戰隊"
 INSHOL_marines_desc: "我們應該建立一支隸屬於新海軍的東印度海軍陸戰隊，並派遣海軍陸戰隊成員前往荷蘭船隻進行訓練。"
 INSHOL_domestic_ship_production: "國內船舶生產"
 INSHOL_domestic_ship_production_desc: "若想讓我國海軍足以抗衡鄰國，就必須著手擴大國內艦船的生產規模。"
 INSHOL_destroyers: "驅逐艦"
 INSHOL_destroyers_desc: "如果沒有護航艦艇的掩護，我方的重型戰艦便無法在群島間的狹窄海域行動。通過建造現代化驅逐艦，[ROOT.GetAdjective]海軍就能保衛海上航線，並將敵方魚雷艇驅逐出海峽水域。"
 INSHOL_cruisers: "巡洋艦"
 INSHOL_cruisers_desc: "在缺乏戰列艦的情況下，一支海軍必須更多地依賴巡洋艦。通過組建一支強大的巡洋艦分艦隊，能夠為[ROOT.GetAdjective]海軍奠定堅實的核心力量，使其得以在群島之間的廣闊海域執行巡邏任務，並有效迎擊任何侵入我國水域的敵方襲擊艦。"
 INSHOL_submarines: "潛艇"
 INSHOL_submarines_desc: "東印度群島的海峽天然適合設伏，而潛艇的成本遠低於被它送入海底的軍艦。一支強大的潛艇艦隊能讓[ROOT.GetAdjective]海軍掌控航線，在無需現身的情況下打擊敵方船隻。"
 INSHOL_outsourced_navy: "將生產外包給企業"
 INSHOL_outsourced_navy_desc: "我們的開支已經夠高了，不能再繼續將越來越多的殖民地預算挪用於海軍。我們可以出資委託企業代為生產。"
 INSHOL_divert_civilian_to_navy: "調撥民用與陸軍經費給海軍"
 INSHOL_divert_civilian_to_navy_desc: "鑑於當前世界局勢，遭受海上入侵的風險空前高漲。我們已無暇顧及財政緊縮，必須將政府各部門的經費悉數調撥給海軍。"
 INS_netherlands_can_remove_autonomy_tt_50: "\n若[HOL.GetFlag]§Y[HOL.GetNameDefCap]§!先完成此國策：\n （[INS.GetFlag]§Y[INS.GetName]§!）：§Y£autonomy_texticon -50.00§!"
 INS_netherlands_can_remove_autonomy_tt_75: "\n若[HOL.GetFlag]§Y[HOL.GetNameDefCap]§!先完成此國策：\n （[INS.GetFlag]§Y[INS.GetName]§!）：§Y£autonomy_texticon -75.00§!"
 INS_netherlands_can_remove_autonomy_tt_100: "\n若[HOL.GetFlag]§Y[HOL.GetNameDefCap]§!先完成此國策：\n （[INS.GetFlag]§Y[INS.GetName]§!）：§Y£autonomy_texticon -100.00§!"
 INS_netherlands_can_remove_autonomy_tt_150: "\n若[HOL.GetFlag]§Y[HOL.GetNameDefCap]§!先完成此國策：\n （[INS.GetFlag]§Y[INS.GetName]§!）：§Y£autonomy_texticon -150.00§!"
 INS_netherlands_can_remove_autonomy_tt_200: "\n若[HOL.GetFlag]§Y[HOL.GetNameDefCap]§!先完成此國策：\n （[INS.GetFlag]§Y[INS.GetName]§!）：§Y£autonomy_texticon -200.00§!"
 INS_netherlands_can_remove_autonomy_tt_250: "\n若[HOL.GetFlag]§Y[HOL.GetNameDefCap]§!先完成此國策：\n （[INS.GetFlag]§Y[INS.GetName]§!）：§Y£autonomy_texticon -250.00§!"
 INSHOL_begin_negotiations_soetardjo: "開始與蘇塔爾喬談判"
 INSHOL_begin_negotiations_soetardjo_desc: "蘇塔爾喬的自治請願很有前景，為我們提供了在民族主義者和效忠派之間妥協的機會。我們應開始與他的政黨進行正式談判。"
 INSHOL_urge_gov_veto: "敦促總督否決"
 INSHOL_urge_gov_veto_desc: "蘇塔爾喬請願就是民族主義者的陰謀，東印度政府上當了。我們必須敦促總督立即否決該請願，否則將有失去該殖民地的風險。"
 INSHOL_eventual_autonomy: "同意最終自治"
 INSHOL_eventual_autonomy_desc: "印度尼西亞的獨立願望強烈且勢頭不減。我們將同意東印度群島最終實現自治，但前提是殖民地必須證明自己能獨力維持，並堅持民主理念。"
 INSHOL_autonomous_dominion: "[GetYear]年蘇塔爾喬法案"
 INSHOL_autonomous_dominion_desc: "儘管荷蘭為蘇塔爾喬請願書的生效條件設定了“自力更生”這一不合理的定義，但印度尼西亞對獨立的渴望是如此強烈，以至於我們設法滿足了這些要求。根據協議，我們將宣佈徹底、無條件地脫離荷蘭王室獨立。"
 INS_cannot_become_independent_tt: "§W§Y[INS.GetFlag][INS.GetNameDefCap]§!在沒有外部干預的情況下將§R永遠無法獨立§!。§!"
 INSHOL_sideline_the_volksraad: "人民議會靠邊站"
 INSHOL_sideline_the_volksraad_desc: "蘇塔爾喬發起的請願明顯違反了荷蘭憲法第一條，只會給東印度群島的行政帶來困難。該請願必須被否決。"
 INSHOL_prioritize_dutch_profits: "優先考慮荷蘭收益"
 INSHOL_prioritize_dutch_profits_desc: "我們將專注於增加母國的收益。其經濟穩定對整個王國的福祉有益。"
 INSHOL_development_loans_netherlands: "從荷蘭獲取發展貸款"
 INSHOL_development_loans_netherlands_desc: "我們可以從荷蘭公司獲得貸款，以加快工業化進程。雖然我們會利用作為發展中殖民地的地位來確保低利率，但仍需支付利息。"
 INSHOL_request_economic_dev_subsidy: "請求經濟發展補貼"
 INSHOL_request_economic_dev_subsidy_desc: "作為有利可圖的殖民地，我們已向宗主國證明了自身價值。我們可以將此作為談判籌碼，爭取工業發展補貼。"
 INSHOL_loyalty_to_crown: "效忠王室"
 INSHOL_loyalty_to_crown_desc: "東印度群島擁有諸多特質，然而最為關鍵的在於，我們是一片忠誠於荷蘭的殖民地。威廉明娜女王將引領我們走向勝利。我們絕不能容許民族主義終結我們綿延近五個世紀的歷史，並且要持續表明我們對王室的堅定忠誠。"
 INS_loans_timer: "\n在§Y365§!天后："
 INS_expand_batavia_med_school_tt: "§Y$INS_dutch_east_indies$§!：研究速度修正至少為§G1.00%§!。"
 INS_subsidize_local_business: "補貼本地企業"
 INS_subsidize_local_business_desc: "我們應向本地企業提供補貼以刺激經濟增長，從而提振我們長期的經濟。"
 INSHOL_education_reforms: "教育改革"
 INSHOL_education_reforms_desc: "許多東印度群島居民缺乏接受教育的能力，只有極少數人從中學畢業。若要讓東印度群島成為一個富裕的工業化國家，我們必須確保民眾能夠獲得適當的教育機會。"
 INS_expand_batavia_med_school: "擴建巴達維亞醫學院"
 INS_expand_batavia_med_school_desc: "通過建設新校園設施並聘請更多教授來擴建巴達維亞醫學院，將使深造教育更加普及，這對我們的長期經濟增長至關重要。"
 INS_prepare_for_policy_shift: "為政策轉變做準備"
 INS_prepare_for_policy_shift_desc: "過去幾十年的民族覺醒已對東印度的政治格局產生影響，我們當前的政策顯然已經過時。應考慮對治理結構做出一些調整。"
 INS_reallocate_rubber_industry_funding: "重新分配橡膠產業資金"
 INS_reallocate_rubber_industry_funding_desc: "我們對橡膠銷售的依賴已經對經濟造成了災難性影響。應通過在群島上勘探資源、建設礦井和工廠來實現經濟多元化。這並非易事，因此必須削減用於維護橡膠種植園的預算。"
 INS_reallocate_rubber_industry_funding_tt: "解鎖一項決議，將一個地區的§Y橡膠§!替換為少量§Y其他資源§!。"
 INSHOL_nationalist_coallition: "民族主義聯盟"
 INSHOL_nationalist_coallition_desc: "人民議會長期意見一致，與此同時，議會的意見無人問津。遞交請願書與耐心拖延的時代已經過去。議會中的民族主義成員將組成聯盟，擱置彼此間的爭端，要求無條件獨立。那些曾一度被荷蘭人認為已安全排除在政治核心之外的老一輩政客，將重新被接納回派系之中。"
 INSHOL_volksraad_compromises: "人民議會的妥協"
 INSHOL_volksraad_compromises_desc: "在議會內部進行改革已將我們帶到此處，如今沒有理由放棄這條道路。人民議會將繼續其審慎的工作，向海牙讓步，以耐心而非決裂來追求自治。留在荷蘭聯邦內的未來，比在聯邦外為之奮戰的未來有更豐厚的回報。"
 INSHOL_establish_the_princely_council: "建立土邦理事會"
 INSHOL_establish_the_princely_council_desc: "群島上諸蘇丹與拉賈所掌握的忠誠，是巴達維亞任何議會都未曾擁有過的。他們的宮廷比東印度公司，以及之後崛起的共和國更為古老。一個由土邦家族正式組成的理事會，將給予這些統治者在新國家中的一席之地，並將他們的權威與我們捆綁在一起。"
 INSHOL_nationalize_dutch_companies: "將荷蘭公司收歸國有"
 INSHOL_nationalize_dutch_companies_desc: "那些大型商行、航運公司、種植園企業和銀行，在人們的記憶裡，一直冠以荷蘭的招牌。從今往後，它們將改冠印度尼西亞之名。董事會將重新任命，招牌將被摘下，三個世紀以來從這些島嶼上被榨取的資本，將最終歸屬這些島嶼自身。"
 INSHOL_democracy: "民主的印度尼西亞"
 INSHOL_democracy_desc: "人民議會以不徹底的折中方案起家，曾只是個被精心限制權力的諮詢機構，旨在提供代表權的表象，卻扣留其真實內容。它已超越了它的締造者。該議會將被重組為一個真正的立法機構，其成員由它所宣稱代表的人民選出，其決議對那個曾經將它牢牢拴在極短的韁繩上的政府具有約束力。"
 INSHOL_princely_authority: "土邦權威"
 INSHOL_princely_authority_desc: "一個顧問委員會各得其宜誠然是好事，但那些將自己的名號借予此國創建的蘇丹們，或許還可以借出更多。對於想讓其中某一位的地位超越其餘眾人之上的人，議會將不會橫加阻攔。這些古老的宮廷早已等了好久來回應這個問題。"
 INSHOL_encourage_further_investment: "鼓勵進一步投資"
 INSHOL_encourage_further_investment_desc: "在人民議會商定的條件，目前已暫時解決了政治問題，荷蘭資本也已注意到了這一點。關稅將得到減免，保障將得到延長，阿姆斯特丹與鹿特丹的商會將得到保證：本群島依然開放正常的商貿往來。在舊制度下有利可圖的，在新制度下亦將如此。"
 # <Joint Tree - ABDACOM>
 INSHOL_east_indies_artillery: "東印度群島火炮製造"
 INSHOL_east_indies_artillery_desc: "在爪哇開設火炮製造設施，將減少我軍在軍事行動上對外國貿易的依賴。"
 INSHOL_recall_gerardus_johannes_berenschot: "召回貝倫斯霍特將軍"
 INSHOL_recall_gerardus_johannes_berenschot_desc: "赫拉爾杜斯·約翰內斯·貝倫斯霍特是聯邦中最有才華的將軍之一。他職業生涯的大部分時間在東印度群島度過，但也曾在荷蘭待過數年。在這危急時刻，我們必須將他召回東印度群島，以助戰事。"
 INSHOL_east_indies_cruiser_manufacturing: "東印度群島巡洋艦製造"
 INSHOL_east_indies_cruiser_manufacturing_desc: "自行製造巡洋艦，而非直接向荷蘭訂購，是組建真正海軍的第一步。考慮到日本的威脅，這一努力十分必要。"
 INSHOL_transfer_of_conrad_helfrich: "將康拉德·赫爾弗裡赫調往東印度群島"
 INSHOL_transfer_of_conrad_helfrich_desc: "直接將海軍將領康拉德·赫爾弗裡赫調往東印度群島，將極大改善該地區的海軍作戰能力。"
 # <Joint Tree - Naval Program>
 INSHOL_naval_program: "荷蘭-印度尼西亞海軍計劃"
 INSHOL_naval_program_desc: "東印度海軍遠落後於其他國家的海軍，甚至落後於某些殖民地海軍。為了確保快速發展，各方最好協助這支新海軍的建設。"
 INSHOL_naval_program_transfer_25_tt: "將我方§Y25%§!的海軍力量移交給[INS.GetNameDef]。"
 INSHOL_naval_program_transfer_25_2_tt: "§Y[HOL.GetFlag][HOL.GetNameDefCap]§!將把其§Y25%§!的海軍力量移交給§Y[INS.GetNameDefCap]§!。"
 INSHOL_naval_program_transfer_100_tt: "將§R我方整個海軍§!移交給[INS.GetNameDef]。"
 INSHOL_naval_program_transfer_100_2_tt: "§Y[HOL.GetFlag][HOL.GetNameDefCap]§!將把其全部海軍力量移交給§Y[INS.GetNameDefCap]§!。"
 INSHOL_naval_program_rejected_tt: "解鎖國策§Y$INSHOL_naval_secondchance$§!。"
 INSHOL_hybrid_navy: "混合型海軍"
 INSHOL_hybrid_navy_desc: "我們的海軍不能僅依靠接管[HOL.GetNameDef]的太平洋艦隊，必須開始自行造船，否則一次失誤就可能使我們的全部海軍補給中斷。"
 INSHOL_request_naval_control: "東印度中隊"
 INSHOL_request_naval_control_desc: "[HOL.GetNameDefCap]已經淪陷，無法運作一支完整海軍。我們應在戰爭剩餘時間內接管其海軍。"
 INSHOL_naval_secondchance: "東印度海軍方案"
 INSHOL_naval_secondchance_desc: "儘管[HOL.GetNameDef]拒絕移交海軍控制權，但我們若不想被佔領，仍須保衛太平洋。雖然效果不如他們同意我方提議那樣理想，但我們會找到一個足夠好的替代方案。"
 # <Joint Tree - Netherlands in Exile>
 INSHOL_netherlands_in_exile: "流亡的荷蘭"
 INSHOL_netherlands_in_exile_desc: "王國的悲慘淪陷已成現實。我們不能陷入失敗主義。必須接受已發生的事，專注於我們還能挽救的部分。"
 # INSHOL_relocate_prime_minister: "Relocate the Prime Minister to Java"
 INSHOL_relocate_our_generals: "將陸軍調往爪哇"
 INSHOL_relocate_our_generals_desc: "必須搶在一切太晚之前，將餘下的流亡將領、指揮官及堅持抵抗的士兵，以最高優先級轉移到[1058.GetName]。"
 #INSHOL_relocate_our_soldiers: "Transfer Holdout Soldiers to Java"
 INSHOL_netherlands_indonesia_union: "荷蘭-印度尼西亞聯邦"
 INSHOL_netherlands_indonesia_union_desc: "對許多人而言，[HOL.GetNameDef]與[INS.GetNameDef]組成平等聯盟國家的想法很可笑，但鑑於我們當前的危機，這似乎是最大化維持主權幾率唯一途徑。"
 # <Sukarno Shared Branch - Resistance Buildup>
 INS_underground_revolution: "地下革命"
 INS_underground_revolution_desc: "我們將開始秘密策劃革命，逐步擴大成員數量和民兵活動，直到準備就緒發起打擊。"
 INS_infiltrate_the_media: "滲透媒體"
 INS_infiltrate_the_media_desc: "我們的運動已爭取到東印度多家媒體組織的高層成員的支持。我們可以藉此優勢，巧妙地在民眾心中植入親革命的情緒。"
 INS_infiltrate_the_army: "滲透陸軍"
 INS_infiltrate_the_army_desc: "我們的許多成員已應募加入荷蘭皇家東印度陸軍，從低階士兵到少校不等。我們應儘可能蒐集秘密，同時將自己人扶持到高位。一旦動手，我們就能在荷蘭皇家東印度陸軍中製造混亂。"
 INS_privately_owned_military_industry: "私營軍工產業"
 INS_privately_owned_military_industry_desc: "我們將在軍事工業部門建立若干影子公司，確保革命開始後我們仍能掌控軍工產業。"
 INS_privately_owned_military_industry_tt: "在你的總部添加§G2§!§Y軍用工廠§!"
 INS_instigate_chaos_sulawesi: "在蘇拉威西煽動混亂"
 INS_instigate_chaos_sulawesi_desc: "我們將與蘇拉威西的地方民族主義者合作，組織罷工、暴動，並激化民眾思想。"
 INS_instigate_chaos_sulawesi_tt: "一旦宣佈獨立，我們將獲得§Y[673.GetName]§!和§Y[1056.GetName]§!的§G核心§!。它們依然不是荷屬東印度的核心。"
 INS_instigate_chaos_medan: "在棉蘭煽動混亂"
 INS_instigate_chaos_medan_desc: "我們將與棉蘭和廖內的當地民族主義者合作，組織罷工、暴動，並激化民眾思想。"
 INS_instigate_chaos_medan_tt: "一旦宣佈獨立，我們將獲得§Y[1049.GetName]§!的§G核心§!。它依然不是荷屬東印度的核心。"
 INS_embezzlement_scheme_in_batavia: "巴達維亞侵佔計劃"
 INS_embezzlement_scheme_in_batavia_desc: "我們將制定一項計劃，在宣佈獨立時將我們的產能從巴達維亞轉移到共和國領土。"
 INS_embezzlement_scheme_in_batavia_tt: "宣佈獨立時，§Y[1058.GetName]§!一半的工廠將被轉移到我們的§Y革命總部§!。"
 INS_volksraad_rumors: "人民議會內部傳聞"
 INS_volksraad_rumors_desc: "我們將在人民議會內部開始秘密討論革命。如果成功，可以說服印度尼西亞裔人民議會成員加入我們的事業。"
 INS_volksraad_rumors_tt: "宣佈獨立後，人民議會內所有§Y印度尼西亞§!顧問將被§G保留§!。"
 INS_railway_youth_force: "與鐵路青年團合作"
 INS_railway_youth_force_desc: "鐵路青年團是一支主要活躍於中爪哇的伊斯蘭青年民兵組織，因其奪取鐵路的策略而得名。他們是寶貴的盟友，但活力四射且渴望戰鬥。若停火時間過長，他們會變得對政府不滿。"
 INS_sleeper_informant_network: "[GetInformantNetworkName]"
 INS_Sleeper_Informant_Network_name: "潛伏情報網絡"
 INS_KNIL_Informant_Network_name: "荷蘭皇家東印度陸軍情報網絡"
 INS_sleeper_informant_network_desc: "我們將建立一個遍佈荷蘭皇家東印度陸軍行政機構的情報網絡，使我們能提前獲得敵人的計劃。"
 INS_sleeper_informant_network_tt: "§R當宣佈獨立時：§!\n"
 # <Sukarno Shared Branch - Peoples Security Army>
 INS_the_peoples_security_army: "人民安全軍"
 INS_the_peoples_security_army_desc: "我們的成員（主要是年輕的印度尼西亞人）正變得不耐煩，渴望為獨立事業貢獻力量並戰鬥。我們應建立革命武裝力量，並開始訓練未來的士兵。"
 INS_commander_sudirman: "蘇迪爾曼之軍"
 INS_commander_sudirman_desc: "蘇迪爾曼雖然年輕，但展現出了巨大潛力，在抵抗組織的年輕成員中人氣極高。應該由他指引人民安全軍的道路，帶領我們走向勝利。"
 INS_commander_oerip: "烏里普之軍"
 INS_commander_oerip_desc: "烏里普在陸軍中服役數十年，是唯一被晉升為荷蘭皇家東印度陸軍少校的印度尼西亞人。他的知識和經驗遠超任何其他成員。應該由他指引人民安全軍的道路，帶領我們走向勝利。"
 INS_sudirmans_promotion: "蘇迪爾曼的晉升"
 INS_sudirmans_promotion_desc: "蘇迪爾曼展現了卓越的領導才能，並精心策劃了數次成功的突襲。是時候認可我們的司令的功績，授予他當之無愧的將軍頭銜了。"
 INS_tkr_steal_general: "策反荷蘭陸軍將領"
 INS_tkr_steal_general_desc: "若我們能說服荷屬東印度陸軍的高層成員加入我們的事業，不僅能壯大我軍，還能削弱敵軍。"
 INS_tkr_supply: "每位革命者都必須戰鬥"
 INS_tkr_supply_desc: "我們將確保運動的每位成員都接受正規軍事訓練，無一例外。"
 INS_tkr_professional_army: "職業化陸軍"
 INS_tkr_professional_army_desc: "我們不能只依賴民兵，應建立一支專業的共和國軍隊以維持秩序。"
 INS_arm_the_revolutionaries: "武裝革命者"
 INS_arm_the_revolutionaries_desc: "我們必須從那些充滿活力、願為印度尼西亞奉獻一切的革命者和民族主義者入手。我們將為他們提供所需的訓練和裝備，為國而戰。"
 INS_arm_the_youth: "武裝青年"
 INS_arm_the_youth_desc: "除了革命者，我們還必須武裝青年。他們充滿活力和希望，將傳承革命的火炬。我們必須確保儘可能多的印尼青壯年接受戰鬥訓練和裝備。一旦戰火蔓延至家園，他們將隨時行動。"
 INS_arm_the_students: "武裝學生"
 INS_arm_the_students_desc: "學生自數十年前就奠定了革命的基礎，他們將繼續引領革命前進。"
 INS_guerilla_industry: "奪取工業"
 INS_guerilla_industry_desc: "我們將利用遍佈群島的游擊力量，奪取工廠控制權，從而生產新槍械來武裝我們的民兵。"
 INS_indonesian_assault_doctrine: "印尼突擊學說"
 INS_indonesian_assault_doctrine_desc: "戰爭不僅僅依靠士兵。百萬人若無槍械作戰，則毫無意義。我們必須優先獲取高質量火炮，以便向敵佔區縱深推進。"
 INS_tighter_tkr_integration: "加強人民安全軍與民兵整合"
 INS_tighter_tkr_integration_desc: "人民安全軍與各路民兵力量未能統一行動，協調有限。隨著戰爭持續，這隻會引發越來越多的問題。儘管民兵軍官難免抗議，我們仍需將武裝部隊與民兵融合成一個統一的組織。"
 INS_quality_over_quantity: "質量勝於數量"
 INS_quality_over_quantity_desc: "一名訓練有素、具備周密戰略和現代裝備的士兵，能擊敗五名持手槍的學生。我們必須優先培養高質量、裝備精良的士兵和特種部隊，而非一味動員儘可能多的士兵。"
 INS_add_militia_cap_1_tt: "§Y自由戰士§!師編制上限增加§Y1§!。\n"
 INS_add_militia_cap_2_tt: "§Y自由戰士§!師編制上限增加§Y2§!。\n"
 INS_add_militia_cap_3_tt: "§Y自由戰士§!師編制上限增加§Y3§!。\n"
 INS_add_3_militia_unit_tt: "創建三個可用於§Y突襲§!的§Y自由戰士§!單位，以增加荷蘭各地區的§G民兵存在§!。"
 INS_add_fully_trained_militia_unit_tt: "創建一個已訓練完成的§Y自由戰士§!單位。\n"
 # <Sukarno Shared Branch - Expand Resistance Membership>
 INS_expand_resistance_membership: "擴招抵抗組織成員"
 INS_expand_resistance_membership_desc: "將整個運動集中於一個基地必然導致失敗。我們將徵召成員組成民兵小組，作為特使派往各地，以提升我們在不同地區的聲望和控制力。"
 # <Central Independence Branch - Militias>
 INS_deploy_the_kris: "蘇拉威西印尼人民服務組織"
 INS_deploy_the_kris_desc: "印尼蘇拉威西人民奉獻力量，印尼文簡稱KRIS，是一個活躍的民兵團體，構成了蘇拉威西和萬鴉老地區民兵的主要力量。我們應招募他們正式加入人民安全軍並肩作戰。"
 INS_assist_the_pemuda: "協助青年軍"
 INS_assist_the_pemuda_desc: "爪哇島遍佈著各種青年學生民兵組織。與他們聯手，並在他們針對荷蘭人的行動中提供軍事援助，或許能為我們贏得一個有用的盟友。"
 INS_mobilize_the_pemuda: "動員青年軍"
 INS_mobilize_the_pemuda_desc: "既然我們已成功贏得最大青年團體的信任，就應著手計劃將他們編入人民安全軍。"
 INS_organize_jakarta_pemuda: "組織雅加達青年軍"
 INS_organize_jakarta_pemuda_desc: "爪哇有許多規模不一的青年團體。雖然我們已經動員並招募了其中大部分，但雅加達仍有數十個小團體在獨立行動。我們必須聯繫他們並建立合作關係。"
 INS_recognize_moestopos_batallion: "承認穆斯托波營"
 INS_recognize_moestopos_batallion_desc: "一位名叫穆斯托波的革命者在泗水自封為“代理國防部長”，並掌控著泗水的民兵力量。他的努力值得正式認可，我們應正式晉升他為人民安全軍少將。"
 INS_darul_islam_focus: "伊斯蘭之家"
 INS_darul_islam_focus_desc: "卡爾托蘇維爾佐的伊斯蘭軍在西爪哇的山丘中已經證明了自己，我們不能讓這樣的戰士游離於我們的隊伍之外。讓他的非正規軍與我們的士兵並肩作戰，而他本人則應獲得應得的軍銜。信徒們很快便會在共和國境內提出他們的訴求。"
 # <Central Independence Branch - Navy>
 INS_just_a_fisherman: "偽裝漁民"
 INS_just_a_fisherman_desc: "在沒有海軍的情況下進行群島戰爭十分艱難，我們無法長期維持。我們將嘗試一個可能天真的策略：派遣民兵偽裝成漁民，乘坐漁船潛入荷蘭控制的港口。"
 INS_a_cheap_navy: "廉價海軍"
 INS_a_cheap_navy_desc: "我們沒有時間和資金來建設一支龐大的現代化海軍。必須因陋就簡，拼湊一切可用的資源。"
 INS_divert_army_funds_to_navy: "調撥陸軍經費給海軍"
 INS_divert_army_funds_to_navy_desc: "印度尼西亞是群島國家，沒有艦船運輸，我們的步兵就毫無用處。從人民安全軍調撥經費給新建海軍是值得的犧牲。"
 INS_indonesian_naval_doctrine: "印尼海軍學說"
 INS_indonesian_naval_doctrine_desc: "既然我們正在建設自己的海軍，明確作戰和訓練的學說至關重要。我們應優先儘快制定並採納一套海軍學說。"
 INS_domestic_shipbuilding: "國內造船"
 INS_domestic_shipbuilding_desc: "我們不能永遠依賴繳獲和購買來的艦船，用不了多久就沒有荷蘭船隻可供我們繳獲了。我們應儘早開始建造自己的艦船。"
 INS_acquire_modern_blueprints: "獲取現代藍圖"
 INS_acquire_modern_blueprints_desc: "我們將從其他國家和私營企業購買藍圖，用於建造我們的新海軍。"
 INS_reclaiming_the_dutch_navy: "回收荷蘭東印度海軍"
 INS_reclaiming_the_dutch_navy_desc: "荷蘭人在我們目前佔領的港口中留下了大量艦船。我們應趁此機會將這些船隻據為己有。"
 INS_admiral_mas_pardi: "馬斯·帕爾迪海軍上將"
 INS_admiral_mas_pardi_desc: "任何一支優秀的海軍都需要一位海軍上將指揮。馬斯·帕爾迪是顯而易見的人選。"
 INS_akademi_angkatan_laut: "建設海軍學院"
 INS_akademi_angkatan_laut_desc: "我們將建立一所擁有海軍研究設施的海軍學院，同時培養更多成為工程師和海軍將領的公民。"
 # <Central Independence Branch - Militia Logistics>
 INS_pki_militia_tt: "陳馬六甲擁有一支非常強大的民兵力量。然而，他們不僅為印度尼西亞的意志而戰，也為§R共產主義§!和蘇聯的意志而戰。§R最終，他們會以暴力手段反對任何非共產主義政府。§!"
 INS_increase_laskar_funding_tt: "§W每成功滿足一個民兵派系的要求，獲得§!1§Y個軍用§!工廠（最多§G6§!個）"
 INS_subsidize_laskar_armament: "補貼民兵武裝"
 INS_subsidize_laskar_armament_desc: "手持竹矛的民兵無法在裝備精良的部隊面前生存太久。我們需要優先為這些民兵生產更多的槍支和彈藥。"
 INS_loot_knil_weapons_caches: "繳獲荷蘭皇家東印度陸軍武器庫"
 INS_loot_knil_weapons_caches_desc: "革命前荷蘭皇家東印度陸軍儲備了大量武器。我們的許多成員曾是荷蘭皇家東印度陸軍成員，或許我們能找到並奪走這些倉庫。"
 INS_utilize_tan_malakas_militia: "利用陳馬六甲的民兵"
 INS_utilize_tan_malakas_militia_desc: "陳馬六甲的紅色民兵或許是全印尼最強大的一支民兵力量，將其編入人民安全軍將是一大助力。但這並非沒有風險——給予一支擁有強烈政治動機的強大民兵如此大的影響力，將使他們更容易奪取權力。"
 INS_increase_laskar_funding: "增加民兵經費"
 INS_increase_laskar_funding_desc: "民兵構成了我軍的主力。我們必須認識到這一點，並相應提供資金，即使他們並非完全忠於[INS.GetLeader]。"
 INS_develop_a_functioning_airforce: "建立正規空軍"
 INS_develop_a_functioning_airforce_desc: "空軍對陸軍影響巨大，我們應優先創建一支。"
 # <Vice Presidential Edict - Intro>
 INS_political_stabilization: "恢復秩序"
 INS_political_stabilization_desc: "我們的國家日益動盪。若不盡快採取行動，內戰幾乎不可避免。我們必須在民族委員會、總統和民兵領導人之間展開談判，尋求解決方案。"
 INS_vice_presidential_edict: "簽署第十號副總統法令"
 INS_vice_presidential_edict_desc: "民族委員會幾乎一致要求獲得真正的立法權。一份請願書已呈交給總統，提議建立混合體制：民族委員會成為獨立議會，與總統共享立法權。這一提議頗具吸引力，但總統權力可能變得微乎其微。"
 INS_local_cooperatives: "建立地方合作社"
 INS_local_cooperatives_desc: "我們不應建立西方那樣的資本主義體系，但也不應忽視私有化帶來的經濟效益。我們將允許建立地方合作社，其成功將為所有者帶來財富。然而，它們將受政府監督，並禁止向所在地以外擴張。"
 INS_local_unity: "土邦部分自治"
 INS_local_unity_desc: "我們將給予土邦部分自治權，作為在這本已動盪時期減少內鬥的臨時措施。"
 INS_education_subsidies: "教育補貼"
 INS_education_subsidies_desc: "若想建立一個經濟成功的國家，投資於國家青年的未來絕對必要。我們將在共和國各地建設負擔得起的學校。"
 INS_land_reform: "土地改革"
 INS_land_reform_desc: "在我們宣佈獨立之前，荷蘭直接擁有大量土地。我們應將這些土地低價分配給任何能善加利用的印尼人，以鼓勵經濟增長。"
 INS_dominion_of_atjeh: "亞齊自治領"
 INS_dominion_of_atjeh_desc: "亞齊的分離主義運動規模龐大且不斷壯大。沒有必要激化局勢，我們應通過談判達成妥協，讓亞齊在保持大部分自治的同時，仍是印度尼西亞的一部分。"
 # <Vice Presidential Edict - Presidential Balance>
 INS_dissolve_national_party: "解散民族黨"
 INS_dissolve_national_party_desc: "混合體制是為避免混亂而做出的必要妥協。我們不應允許總統以不民主的方式掌握如此大的權力。總統必須被議會罷免，否則我們將永遠無法實現民主。"
 INS_womens_sufferage: "婦女選舉權"
 INS_womens_sufferage_desc: "賦予女性投票權會導致短期不穩定，但對於長期穩定和民主卻是必要的。"
 INS_women_in_military: "女性參軍"
 INS_women_in_military_desc: "允許女性在軍隊服役，對於確保我們的武裝力量儘可能強大是必要的。"
 INS_fair_election: "公平選舉"
 INS_fair_election_desc: "隨著總統被罷免、革命結束，我們終於可以舉行第一次真正公平、沒有威權影響的選舉。"
 # < Hybrid Politics >
 INS_continue_hybrid_politics: "延續混合政體"
 INS_continue_hybrid_politics_desc: "混合政體是一種必要的惡。雖然最終目標是真正的民主，但印度尼西亞過於年輕和不穩定，無法將所有權力交給人民。總統和議會將繼續相互制衡，確保任何一方都不會過於強大。"
 INS_guided_economy: "指導型經濟"
 INS_guided_economy_desc: "我們將直接監督印度尼西亞的經濟，以確保我們維持控制。我們將所有銀行以及石油和農業部門國有化。"
 INS_reform_education_system: "強制性思想教育"
 INS_reform_education_system_desc: "革命證明，對社會秩序不滿的學生和青年總會引領反抗。為了政府和國家的安全，我們將要求學校按照我們的政府意識形態進行教學。"
 INS_reform_education_system_2: "教育改革"
 INS_reform_education_system_2_desc: "若要讓印度尼西亞未來成為一個富裕的國家，所有印尼人，無論出生地，都必須有權接受教育。"
 INS_three_year_plan: "三年計劃"
 INS_three_year_plan_desc: "我們可以制定一個三年計劃，在整個群島建設基礎設施並連接各島嶼。"
 INS_destroy_pacific_colonialism: "摧毀太平洋殖民主義"
 INS_destroy_pacific_colonialism_desc: "革命或許已經結束，但仍有戰鬥要打。我們家門口仍有許多人生活在殖民暴政之下。我們不能袖手旁觀，必須採取行動將他們從宗主國手中解放出來！"
 INS_rapid_mobilization: "快速動員"
 INS_rapid_mobilization_desc: "任何強大的國家都有一支強大的軍隊作為支撐。若想成為能保護自己的區域強國，就必須先大幅提高軍隊的實力。"
 INS_greater_indonesia: "成立大印度尼西亞"
 INS_greater_indonesia_desc: "努山達拉古國曾將馬來世界統一為一個實體、一個民族。既然我們已經將馬來亞從殖民暴政中解放出來，我們就應該像努山達拉先祖那樣，宣告整個馬來世界成為一個統一的國家。"
 # < State Religion >
 INS_secularism: "世俗主義"
 INS_secularism_desc: "印度尼西亞是多民族、多宗教的家園。將宗教與政治混為一談只會引發內鬥，因此我們應該禁止宗教政黨。"
 INS_integrate_sarekat_islam: "整合伊斯蘭聯盟"
 INS_integrate_sarekat_islam_desc: "大的伊斯蘭政黨擁有廣泛的民眾支持。將他們整合進政府符合我們的最大利益。"
 # <Vice Presidential Edict - Sjahrir>
 INS_sjahrirs_continued_tenure: "沙里爾連任"
 INS_sjahrirs_continued_tenure_desc: "總理沙里爾已證明自己是一位偉大的領導者，帶領我們度過了革命，改善了經濟，建立了民主。我們應該讓他連任總理。"
 INS_unity_in_diversity: "求同存異"
 INS_unity_in_diversity_desc: "幾個世紀以來，“求同存異”這四個字一直體現著我們群島的精神。在革命期間，這一理念成為了戰鬥口號，提醒印尼人：儘管我們說多種語言，遵循多種不同傳統，但我們團結為一體。我們應該將這一短語寫入憲法，以便我們的團結能夠代代相傳。"
 INS_the_timor_issue: "[INS_timor_issue_scripted_name]"
 INS_timor_issue_scripted_name_issue: "帝汶問題"
 INS_timor_issue_scripted_name_attack: "進攻東帝汶"
 INS_the_timor_issue_desc: "[INS_timor_issue_scripted_desc]"
 INS_timor_issue_scripted_desc_issue: "東帝汶顯然是印尼的合法領土，雖然革命已經結束，但它仍處於殖民統治之下。我們將向[721.OWNER.GetName]發出最後通牒，要求立即移交東帝汶。"
 INS_timor_issue_scripted_desc_attack: "東帝汶無疑是印度尼西亞的合法領土。島上的叛亂分子或許聲稱要獨立，但他們顯然不能代表全體人民。葡萄牙殖民主義的殘餘必須被整合進共和國。"
 INS_pledge_to_allies: "對同盟國的承諾"
 INS_pledge_to_allies_desc: "隨著全球衝突日益加劇，我們面臨被入侵的風險。雖然我們與同盟國的關係一直不穩定，但我們已經將自己確立為太平洋地區的一股民主力量，應該與強大的民主國家結盟。"
 INS_mixed_economy_system: "混合經濟體制"
 INS_mixed_economy_system_desc: "印度尼西亞是一個獨特的國家，難以適配傳統的資本主義或共產主義。我們應該建立一種混合經濟體制，兼有資本主義和共產主義的元素。"
 INS_social_democracy: "社會民主主義"
 INS_social_democracy_desc: "自沙里爾的經濟政策實施以來，[INS.GetAdjective]經濟已經大幅增長。我們應該宣佈印度尼西亞是一個完全的社會民主主義國家，並基於社會民主主義原則制定未來的經濟政策。"
 # <Vice Presidential Edict - Sjarifuddin>
 INS_prime_minister_sjarifuddin: "謝里夫丁總理"
 INS_prime_minister_sjarifuddin_desc: "謝里夫丁是領導印度尼西亞的最佳候選人，他的溫和政策允許在共產主義者和社會主義者之間達成妥協。"
 INS_concessions_to_communists: "向共產主義者讓步"
 INS_concessions_to_communists_desc: "印尼共產黨在議會中擁有相當數量的席位，我們應該授予印尼共產黨領導人幾個部長職位以確保穩定。"
 INS_sjarifuddin_focus_2: "自我管理的出口經濟"
 INS_sjarifuddin_focus_2_desc: "我們剛剛獲得了獨立，因而我們必須重新審視我們的出口經濟體系，並對其加以重組，使其不再將荷蘭的利潤納入考量。雖然出口導向型經濟仍有風險，但我們可以使它比過去更可靠。"
 # <Vice Presidential Edict - Hatta>
 INS_prime_minister_hatta: "哈達總理"
 INS_prime_minister_hatta_desc: "被稱為革命宣告者的穆罕默德·哈達，曾擔任蘇加諾的副總統，並通常是兩人中更傾向民主的人。他將成為多數政黨都能妥協接受的合適總理人選。"
 INS_hatta_focus_2: "下一步"
 INS_hatta_focus_2_desc: "革命已經結束，儘管某些政治人物堅稱革命必須繼續，但這些聲音應該被忽略。相反，我們應向前看，必須建設印度尼西亞，以使未來數代人能生活在繁榮之中。"
 INS_hatta_princely_advisors: "整合土邦"
 INS_hatta_princely_advisors_desc: "通過我們共同的多元性，我們建立了團結的原則。我們的國家基於此原則建立，但革命的結束使得這一理念因缺少共同奮鬥而面臨壓力。為防止來自少數群體的怨恨和暴動，我們應設立一個額外的理事會，讓土邦的地方統治者能在國家政治中有直接發言權。"
 INS_prime_minister_tt: "印度尼西亞首次大選已經舉行"
 # < Guided Democracy >
 INS_guided_democracy: "指導型民主"
 INS_guided_democracy_desc: "民主或許是理想，但現在將權力交給人民只會導致混亂。我們將扶植蘇加諾為終身總統，由他監督民主議會並在必要時進行干預。"
 INS_enact_militarism: "實行軍國主義"
 INS_enact_militarism_desc: "我們應該從[JAP.GetNameDefCap]及其軍國主義政策中學習。採用類似的原則將有利於我們的新政府。"
 INS_sukarnos_industrialization: "賦能爪哇工業"
 INS_sukarnos_industrialization_desc: "爪哇的工業是我們經濟和軍事的支柱。條條大路須通羅馬。"
 INS_sukarnos_industrialization2: "人人各盡其責"
 INS_sukarnos_industrialization2_desc: "戰爭是國家的頭等大事，因此每個印尼人為此貢獻力量也是頭等大事。奢侈是敵人，軍工複合體必須發展壯大。"
 INS_japanese_military_lessons: "借鑑日本軍事經驗"
 INS_japanese_military_lessons_desc: "我們應該研究日本的軍事學說，並相應地調整我們自己的軍隊。"
 # < Support Tan Malaka's Coup>
 INS_support_tan_malakas_coup: "支持陳馬六甲政變"
 INS_support_tan_malakas_coup_desc: "蘇加諾宣佈了我們的獨立，但他已證明自己是一個只知折中措施和外交讓步的人。陳馬六甲和他的鬥爭統一陣線的綱領才符合人民的要求：百分之百獨立，不談判，不妥協。如果蘇加諾不能為革命全力戰鬥，那麼革命必須找到一位願意這樣做的領袖。"
 INS_minimum_program: "最低綱領"
 INS_minimum_program_desc: "鬥爭統一陣線已提出其訴求：人民政府、人民軍隊，以及將所有外資種植園和工業國有化。我們需要有能力的人來推進這一綱領。約諾代表工人，塞蒂亞吉特代表黨內知識分子。他們將共同確保革命從工廠車間到政府大廳都得到組織。"
 INS_agrarian_reform: "農業改革"
 INS_agrarian_reform_desc: "三個世紀以來，印尼的土地一直在供養陌生人的種植園。耕作土地的農民對此幾乎一無所知。不改變這一點的革命根本算不上革命。我們將見證土地轉交給耕種它的人。"
 INS_soviet_aid: "蘇聯援助"
 INS_soviet_aid_desc: "蘇聯已經承認我們的革命，並準備提供支持。無論我們的綱領與莫斯科之間存在何種分歧，我們都無法拒絕對方提供的援助。我們應該接受武器，繼續前進。"
 INS_pacific_revolution: "太平洋革命"
 INS_pacific_revolution_desc: "殖民勢力並未從亞洲撤退，只是從印度尼西亞撤退。舊的秩序在馬來亞和菲律賓等地仍然存在，這些地方都有渴望推翻舊秩序的男男女女。我們的革命既賦予了我們去幫助他們的地位，也賦予了這種義務。我們必須這樣做。"
 INS_purge_oppurtunists_tt: "在共產主義支持率達到§Y60%§!或以上的國家解鎖§Y$INS_launch_revolution$§!。那些我們發動革命的國家將成為我們的§Y傀儡§!。"
 INS_purge_oppurtunists: "清洗機會主義者"
 INS_purge_oppurtunists_desc: "慕梭在莫斯科待了二十年學習服從命令。他帶著蘇聯的指示回來，並有一個將我們的共和國變成共產國際傀儡的計劃。我們擺脫荷蘭人不是為了向另一個外國主子下跪。那些要把我們的革命賣給莫斯科的機會主義者必須被根除，我們所解放的人民應該仰望雅加達，而不是克里姆林宮。"
 INS_federation_of_aslia: "阿斯利亞聯邦"
 INS_federation_of_aslia_desc: "我們所解放的國家不必孤軍奮戰。陳馬六甲一直設想著比一個共和國更宏大的藍圖。一個從大陸延伸到太平洋的聯邦，團結起來對抗任何膽敢回來的殖民勢力。我們將向他們提供我們國家的正式成員資格。"
 INS_aslia_tt: "允許核心化併吞並§Y太平洋§!附屬國"
 INS_musso_ascends: "慕梭崛起"
 INS_musso_ascends_tt: "在共產主義支持度達到§Y30%§!及以上的國家解鎖§Y$INS_launch_revolution$§!。那些我們煽動革命的國家將保持獨立。"
 INS_musso_ascends_desc: "陳馬六甲是一個夢想家。慕梭帶來了夢想家所不能企及的東西：蘇聯的全力支持以及國際共產主義運動的團結。我們的革命不必孤軍奮戰。"
 INS_soviet_economic_integration: "蘇維埃經濟一體化"
 INS_soviet_economic_integration_desc: "革命賦予了我們自由，但單憑自由無法建造工廠，也無法養活大眾。蘇聯提供了任何資本主義大國都不願給予的東西：工業技術、發展信貸以及不附帶殖民條件枷鎖的貿易。拒絕才是傻瓜。"
 # <National Revolution - Reasserting Control>
 INSHOL_revolution_ongoing_tt: "印度尼西亞革命仍在繼續"
 INSHOL_reasserting_control: "重新控制東印度群島"
 INSHOL_reasserting_control_desc: "我們不能袖手旁觀，任由這些機會主義者試圖毀掉我們數百年來的建設成果，同時摧毀我們的基礎設施、毒害年輕人的思想。我們必須採取行動！"
 INSHOL_request_british_support: "請求英國支持"
 INSHOL_request_british_support_desc: "[ENG.GetNameDefCap]作為殖民同行，很可能會同情我們的處境，尤其是如果革命者取得成功，可能會在東亞引發多米諾骨牌效應。我們應當請求他們的經濟和軍事援助。"
 INS_eng_treaty_holside_tt: "§Y[ENG.GetNameDefCap]§!將正式宣佈站在我們一方，並提供大量援助。如果戰爭以勝利告終，§Y[ENG.GetNameDefCap]§!將有權獲得婆羅洲。"
 INS_eng_treaty_engside_tt: "我們將在東印度群島衝突中正式與§Y[HOL.GetNameDefCap]§!結盟。如果§Y[HOL.GetNameDefCap]§!獲勝，我們將有權獲得婆羅洲。"
 INS_fra_treaty_holside_tt: "§Y[FRA.GetNameDefCap]§!將正式宣佈站在我們一方，並提供大量援助。如果戰爭以勝利告終，§Y[FRA.GetNameDefCap]§!將有權獲得蘇門答臘東北部。"
 INS_fra_treaty_fraside_tt: "我們將在東印度群島衝突中正式與§Y[HOL.GetNameDefCap]§!結盟。如果§Y[HOL.GetNameDefCap]§!獲勝，我們將有權獲得蘇門答臘東北部。"
 INSHOL_franco_dutch_accord: "法荷協定"
 INSHOL_franco_dutch_accord_desc: "儘管我們的士兵裝備和組織優於共和國民兵，但他們壓倒性的人數優勢使戰局對我們不利。為了確保勝利，我們需要外部援助，而且是超出大多數國家願意提供的援助。如果我們願意讓出東印度群島的部分領土以擴大法國在太平洋的存在，法國可能會願意介入。"
 INSHOL_london_batavia_accord: "倫敦-巴達維亞協定"
 INSHOL_london_batavia_accord_desc: "儘管我們的士兵裝備和組織優於共和國民兵，但他們壓倒性的人數優勢使戰局對我們不利。為了確保勝利，我們需要外部援助，而且是超出大多數國家願意提供的援助。[ENG.GetNameDefCap]因其在馬來亞的存在，可能會對此感興趣。如果我們提供一些回報，也許可以說服他們？"
 INSHOL_australian_divisions: "派遣澳大利亞步兵至爪哇"
 INSHOL_australian_divisions_desc: "根據倫敦-巴達維亞協定，一旦我們提出請求，英國需通過澳大利亞向東印度群島增派部隊，因為澳大利亞靠近東印度群島，是建立境外軍事基地的理想地點。"
 INSHOL_indian_divisions: "英屬印度陸軍師"
 INSHOL_indian_divisions_desc: "雖然英國極有可能不願派遣本國士兵到東印度群島，但說服他們派遣印度師團要容易得多，尤其是因為印度距離巴達維亞很近。"
 INSHOL_undermine_the_militias: "削弱民兵"
 INSHOL_undermine_the_militias_desc: "媒體誇大了局勢的嚴重性，民兵不過是一群試圖追求遙不可及目標的流氓青年。我們不需要調集所有資源去阻止他們，只需守住防線，等待他們疲憊即可。"
 INSHOL_flag_will_fly_again: "旗幟將再次飄揚"
 INSHOL_flag_will_fly_again_desc: "荷蘭的旗幟在東印度群島飄揚了數個世紀，我們絕不容許它降下。如果保住這顆王冠上的珠寶需要派遣坦克和轟炸機，那就派過去！"
 INSHOL_flag_will_fly_again_tt: "§Y革命結束後，該民族精神將被移除，規則改動將被還原。§!"
 # <National Revolution - Escalation>
 INSHOL_mass_mobilization: "大規模動員"
 INSHOL_mass_mobilization_desc: "沒有一支裝備精良的軍隊，我們無法贏得這場衝突並粉碎共和國。我們必須重新武裝東印度群島，並將民用部門的資金轉撥給荷蘭皇家東印度陸軍。"
 INSHOL_batavia_storm_operation: "風暴巴達維亞"
 INSHOL_instigate_infighting: "煽動共和國內鬥"
 INSHOL_ultimatum_to_republic: "向共和國發出最後通牒"
 INSHOL_comite_rijkseenheid: "國家統一委員會"
 INSHOL_comite_rijkseenheid_desc: "東印度的旗幟正在降下，而人們卻只是袖手旁觀。我們不能允許這種情況發生，必須說服東印度當局：荷蘭人民希望阻止這場革命！"
 INSHOL_increase_esclation_placeholder: "快速升級"
 INSHOL_increase_esclation_placeholder_desc: "我們的民兵已控制了諸多重要港口、城市和工業中心。我們將不再繼續等待荷蘭採取行動，我們將自行號召發起一場重大軍事攻勢！"
 INS_take_batavia_explination_tt: "如果我們成功佔領整個爪哇，我們將從內部摧毀殖民政府，並§G贏得戰爭§!。然而，如果我們未能在§Y730天§!內做到這一點，我們將§R滅亡§!。"
 INSHOL_linggadjati_agreement: "停火協議談判"
 INSHOL_linggadjati_agreement_desc: "事實證明，入侵爪哇困難重重，我們的政府也日益不穩。我們必須後撤並採取守勢，以免整個共和國覆滅。我們應當與荷蘭談判達成局部停火，從而在重回爪哇之前重組我們的部隊。"
 INSHOL_increase_esclation_placeholder_tt: "解鎖一項§Y決議§!，以談判局部停火併§Y增加佔領爪哇的時間限制§!。"
 # <National Revolution - Peace Negotiation>
 INSHOL_seek_foreign_help: "尋求外國援助"
 INSHOL_seek_foreign_help_desc: "一個尚未形成穩定經濟的新生國家，試圖戰勝一個高度工業化的殖民大國，幾乎是不可能完成的任務，這不是什麼秘密。我們應當聯繫其他支持我們事業的國家，看看他們是否願意幫助我們。"
 INSHOL_renville_agreement: "倫維爾協議"
 INSHOL_renville_agreement_desc: "荷蘭前所未有的侵略行動已引起國際社會對這場革命的關注，然而荷蘭仍在違反停火協議，並挑釁我們做出反應。我們必須嘗試向[USA.GetNameDef]發出呼籲，只要能說服他們支持印度尼西亞，荷蘭將別無選擇，只能退讓。"
 INSHOL_no_compromise: "不妥協，不投降"
 INSHOL_no_compromise_desc: "荷蘭人的貪婪導致他們幾乎只投資爪哇，忽視了東部諸島，這使爪哇成為整個殖民地的致命弱點。他們必將在此敗亡！"
 INSHOL_end_to_bloodshed: "兩國方案"
 INSHOL_end_to_bloodshed_desc: "這場衝突持續太久了，雙方都沒有取得什麼進展，每天都有更多人喪生。沒人希望這種情況繼續下去，是時候與荷蘭領導人在談判桌上討論了。"
 INSHOL_reorganize_colonies: "重組殖民地"
 INS_we_will_need_another_tt: "由於我們已經控制了整個爪哇，因此還需再控制一個除爪哇以外的地區。"
 # Industry Branch - New
 INS_centralize_the_state: "國家集權"
 INS_centralize_the_state_desc: "從蘇門答臘到蘇拉威西，從婆羅洲到邦加，我們的發展計劃為那些曾僅被[1058.GetName]名義上管轄的領土帶來了道路、工廠和機構。這些地區不再是遙遠的省份。它們就是[INS.GetNameDefCap]。"
 INS_centralize_the_state_1_tt: "滿足前提且擁有§Y核心§!的地區："
 INS_centralize_the_state_2_tt: "滿足前提且§Y無核心§!的地區："
 INS_fate_of_de_javasche_bank: "[INS_fate_of_de_javasche_bank_scripted_name]"
 INS_fate_of_de_javasche_bank_scripted_name_colony: "爪哇銀行的命運"
 INS_fate_of_de_javasche_bank_scripted_name_independent: "印度尼西亞銀行的命運"
 INS_fate_of_de_javasche_bank_desc: "[INS_fate_of_de_javasche_bank_scripted_desc]"
 INS_fate_of_de_javasche_bank_scripted_desc_colony: "自大蕭條爆發以來，東印度盾一直在自由落體式貶值，而爪哇銀行缺乏阻止這種頹勢的手段。我們必須決定如何穩定我們的貨幣，以免投資者徹底喪失信心。"
 INS_fate_of_de_javasche_bank_scripted_desc_independent: "我們繼承了一個處於危機中的貨幣體系。舊的殖民地盾幣已經搖搖欲墜，而向盧比的過渡也未能穩定市場。印度尼西亞銀行需要政府的明確指導，否則我們年輕的經濟將因此受損。"
 INS_finish_the_bauxite_project: "完成邦加項目"
 INS_finish_the_bauxite_project_desc: "隨著邦加-勿裡洞全境的新道路、港口和鐵路投入使用，勘察隊報告稱鎢和鉻的儲量超出了我們最初的預期。這些島嶼終將向共和國證明它們的全部價值。"
 INS_australian_contracts: "澳大利亞合同"
 INS_australian_contracts_desc: "我們的橡膠儲備已遠超國內需求。澳大利亞一直渴望獲得原材料來滋養其工業，是一個天然的貿易伙伴。與澳大利亞公司簽訂長期合同將帶來穩定的收入，並鞏固我們在區域經濟中的地位。"
 INS_coopereate_with_chinese_businessmen: "與華商合作"
 INS_coopereate_with_chinese_businessmen_desc: "一個富裕且人脈廣泛的商人階層長期以來一直促進著群島各地的貿易。與其將這些成熟的網絡邊緣化，不如與他們合作。他們的資本和商業專長對於拉動我國經濟走出當前的困境可能具有不可估量的價值。"
 INS_oil_decisions_unlock_tt: "解鎖新的§Y$INS_realign_supply_chains_cat$§!決議，用於出售§Y石油§!。"
 INS_negotiate_new_contracts_unlock_tt: "解鎖新的§Y$INS_realign_supply_chains_cat$§!決議。"
 INS_realign_supply_chains_explain_tt: "解鎖§Y$INS_realign_supply_chains_cat$§!決議，以兩年期租約向私營公司出售資源。"
 INS_negotiate_new_contracts: "談判新合同"
 INS_negotiate_new_contracts_desc: "我們作為可靠供應商的聲譽日益提升，這打開了之前對我們緊閉的大門。新的買家正在接洽，我們應迅速採取行動，搶在競爭對手壓價之前與他們簽訂長期協議。"
 INS_all_in_on_rubber: "全力押注橡膠"
 INS_all_in_on_rubber_desc: "橡膠是我們最強的底牌，我們打算好好利用它。每一英畝可用的種植園土地都將轉為橡膠種植，我們的出口機構也將重組，以實現比區域內任何國家都更快、更便宜的運輸。"
 INS_more_market_resources: "戰勝大蕭條"
 INS_more_market_resources_desc: "世界或許深陷經濟危機，但危機為那些敢於抓住機遇的人創造了機會。通過以競爭對手無法匹敵的價格向市場傾銷我們的商品，我們將確保當世界經濟復甦時，印尼商品已遍佈每一個貨架和倉庫。"
 # <Industry Branch - Trade Policy>
 INS_recovering_from_the_great_depression: "從大蕭條中復甦"
 INS_recovering_from_the_great_depression_desc: "大蕭條對[INS.GetNameDef]造成了毀滅性的影響。由於我國經濟以出口為主，世界各地的保護主義政策重創了我們。隨著全球貿易似乎有望重新開放，我們必須尋找新市場，並努力重建我們的舊貿易路線。"
 INS_first_come_first_serve: "先到先得"
 INS_first_come_first_serve_desc: "儘管大蕭條時期的保護主義正在放緩，但產量增加和荷蘭盾被高估已使荷蘭的出口市場支離破碎，因為我們在西方的老貿易伙伴已轉向南美來滿足其需求。與其追逐它們簽訂新的貿易協定，不如利用這個機會拓展亞洲的新市場。"
 INS_oil_export: "增加石油出口"
 INS_oil_export_desc: "我們將改善蘇門答臘和加里曼丹的石油基礎設施，以確保與新貿易伙伴達成交易。"
 INS_increased_trade_with_japan: "增加對日貿易"
 INS_increased_trade_with_japan_desc: "[JAP.GetNameDefCap]已成為價值日益增長的貿易伙伴，並未讓我們失望。我們應談判新的貿易協定，以深化兩國間的經濟合作，並幫助我們擺脫大蕭條的殘餘影響。這可能會讓我們在西方的盟友，尤其是荷蘭，感到不滿。然而，如果我們想對自己的命運有任何發言權，就必須建立自己的貿易渠道。"
 INS_asian_trade_investments: "亞洲貿易投資"
 INS_asian_trade_investments_desc: "大蕭條的破壞性影響向我們展示了我們對西方長期貿易伙伴的過度依賴。鑑於我國經濟以出口為主，發展並拓展東南亞的新市場，以確保我國經濟不依賴於任何一個國家，現在比以往任何時候都更為關鍵。"
 INS_asian_trade_investments_tt: "每§Y420§!天，源自§Y大蕭條§!的出口資源折價懲罰將§G改善§!§Y5%§!，直至負面修正消失。"
 INS_declare_free_trade: "宣佈自由貿易"
 INS_declare_free_trade_desc: "我們不應僅與單個國家結盟，而應讓市場自然地為[INS.GetNameDef]做出最佳決策。"
 INS_japanese_export_contracts: "一份合約統御一切"
 INS_japanese_export_contracts_desc: "我們將與[JAP.GetNameDef]談判一項重大貿易協定，出售[1049.GetName]和[672.GetName]的所有橡膠。雖然我們會以非常低的價格出售，但這將保證全部售出。"
 INS_realign_supply_chains: "重組供應鏈"
 INS_realign_supply_chains_desc: "儘管大蕭條時期的保護主義正在放緩，但產量增加和荷蘭盾被高估已使荷蘭的出口市場支離破碎，因為我們在西方的老貿易伙伴已轉向南美來滿足其需求。我們必須採取措施，說服我們的盟友重新與我們開展貿易。"
 INS_invite_foreign_companies: "支持美國石油企業"
 INS_invite_foreign_companies_desc: "自1930年以來，加州標準石油公司通過其荷蘭子公司——荷蘭太平洋石油公司在我國運營。他們在廖內的勘探前景喜人，我們應盡一切可能支持其上游業務。一次重大發現既能增加我們的收入，也能鼓勵其他國際公司在我國尋求投資。"
 INS_expand_sea_routes: "拓展海上航線"
 INS_expand_sea_routes_desc: "我國自然資源豐富，但我們的採掘業過於專業化，且缺乏開採某些稀有礦物（如鉻和鎢）所需的基礎設施。如果我們想提高軍事生產能力，就需要從其他地方進口這些礦物。為了充分利用我們不斷增長的貿易網絡，我們需要提高商船隊的運力。"
 INS_ship_contracts: "確保船舶合同"
 INS_ship_contracts_desc: "為了在戰爭期間維持我們的貿易航線，建設一支海軍是必要的。我們可以利用新建立的貿易關係來獲得海軍合同。"
 # <Industry Branch - Sumatra>
 INS_developing_sumatra: "開發蘇門答臘"
 INS_developing_sumatra_desc: "蘇門答臘是群島上資源最豐富的島嶼，但基礎設施極其落後，以至於開採的資源有很大一部分甚至無法運抵巴達維亞。交通運輸依賴於由土路和互不連通的鐵路線拼湊而成的網絡，完全不足以支持我們對這個島嶼的計劃。我們不能讓這種情況繼續下去。"
 INS_sumatra_railway: "蘇門答臘鐵路"
 INS_sumatra_railway_desc: "為了發展蘇門答臘的基礎設施，我們應該修建一條大型鐵路，連接亞齊北部和蘇門答臘最南部的港口——該港口與巴達維亞的海上連接極其迅速。這樣一來，資源只需運輸到最近的火車站，然後我們就能在幾天內將其運至巴達維亞。"
 INS_develop_borneo: "開發加里曼丹"
 INS_develop_borneo_desc: "加里曼丹擁有巨大的財富潛力，然而該島嶼的開發程度極低，人民飽受貧困之苦。貨物運輸嚴重依賴島上眾多的河流和水道，任何遠程通信都因缺乏電力而受阻。通過建造輸電線和道路，我們可以為未來的勘探和資源開採鋪平道路。"
 INS_kalimantan_mic: "加里曼丹軍事工業"
 INS_kalimantan_mic_desc: "我們在加里曼丹的基礎設施建設已見成效。電力和通信的普及讓我們接觸到了遠處於政府覆蓋範圍之外的社區。我們可以藉此機會，通過在該地區建造新工廠並利用這些新增勞動力來滿足我們提高軍事生產的需求。"
 INS_pontianak_to_balikpapan: "從坤甸到丹戎塞洛"
 INS_pontianak_to_balikpapan_desc: "在加里曼丹修建鐵路的設想已被詳細討論過，但島嶼中心惡劣且大部分未經勘探的地形讓這成為一項艱難的任務。唯一的解決方案是沿海岸修建一條U形鐵路。這不會便宜，但從長遠來看，它會收回成本。"
 INS_develop_sulawesi: "開發蘇拉威西"
 INS_develop_sulawesi_desc: "蘇拉威西位於群島的中心，戰略位置重要。我們應該修建道路、電力和通信設施，以確保它能在戰爭期間作為軍事樞紐。"
 # <Industry Branch - Bangka Project>
 INS_the_bangka_project: "邦加項目"
 INS_the_bangka_project_desc: "邦加-勿里洞島嶼雖小，但由於其鋁土礦儲量，是印度尼西亞經濟的基石。我們需要在邦加-勿裡洞修建道路、港口和鐵路，以確保我們能從這些島嶼豐富的礦產資源中獲得全部收益。"
 INS_aluminium_factory: "邦加檳榔鋁廠"
 INS_aluminium_factory_desc: "我們的鋁土礦原礦開採量正在增長，但國內鋁生產的缺乏限制了我們的利潤。作為邦加-勿裡洞省的省會，邦加檳港是建立我們自己工廠的理想地點。這樣做可以讓我們省去中間商，實現回報最大化。"
 INS_bauxite_export: "加倍押注鋁土礦出口"
 INS_bauxite_export_desc: "邦加項目的完成使我們擁有大量過剩的鋁土礦原礦，多得不知如何處理。雖然試圖全部售出會很困難，但我們可以提供遠低於市場上任何其他供應商的價格，確保每一克都售出。由於我們可以出售的鋁土礦數量巨大，與我們目前的出口相比，這仍將帶來利潤的相應增長。"
 INS_tin_mining: "投資錫礦開採"
 INS_tin_mining_desc: "邦加-勿里洞島嶼的錫礦開採歷史早於歐洲人在群島的存在。因此，這些島嶼上的錫產業早就該進行現代化改造了。徹底改革生產能力是一項昂貴的工作，在我們重建期間，現有的錫產業將暫時無法運營。然而，長期利潤潛力巨大。"
 in_240_days_tt: "§Y240天內：§!\n"
 INS_tin_to_usa: "向[USA.GetNameDef]出售錫"
 INS_tin_to_usa_desc: "[USA.GetNameDefCap]有許多正購買錫的公司和政府機構。既然我們已建立了成規模的採礦作業，我們將有機會從中大賺一筆。"
 INS_tin_to_japan: "向[JAP.GetNameDef]出售錫"
 INS_tin_to_japan_desc: "[JAP.GetNameDefCap]擁有許多如今已過時的可更換船隻，它們非常適合[INS.GetAdjective]海軍。我們應該用錫礦生產獲得的資金購買這些船隻。"
 INS_tin_to_japan_tt: "[JAP.GetNameDefCap]將給我們送來§Y9§!艘舊型號的驅逐艦。"
 INS_new_bauxite_routes: "新的鋁土礦路線"
 INS_new_bauxite_routes_desc: "我們通過壓低市場價格來增加鋁土礦出口量的策略已奏效，我們的總收入大幅增加。然而，我們不能止步於此。我們應該繼續擴大貿易網絡，優化供應鏈，並尋找其他機會來最大化我們的回報。"
 INS_bangka_bauxite_export_flag: "已完成國策§Y$INS_bauxite_export$§!："
 INS_not_industry: "規劃未來"
 INS_not_industry_desc: "爪哇是我們國家跳動的心臟，是我們大部分人口的家鄉和政府的所在地。在我們真正開始在這個島嶼實現工業化之前，我們必須首先打好基礎。土地勘測、區域劃分和場地清理將確保工廠建成後，它們被建在能發揮最大效益的地方。"
 INS_construction_focus: "工業繁榮"
 INS_construction_focus_desc: "外國資本正在湧入，出口收入不斷攀升，多年來首次有真正的資金可以投資於國內工業。我們必須抓住時機，在條件對我們有利的時候進行建設。"
 # <Industry Branch - Java>
 INS_developing_java: "擴建爪哇基礎設施"
 INS_developing_java_desc: "爪哇無疑是群島上工業化程度最高的島嶼，也是我們大部分財富的來源。然而，由於人口增長，巴達維亞等某些城市變得越來越擁擠。我們應該通過建造新的住宅、商業區、有軌電車、火車和工廠來擴建這些城市，以容納不斷增長的人口。"
 INS_prioritize_sugar_economy: "優先發展製糖經濟"
 INS_prioritize_sugar_economy_desc: "我們應減少政府在巴達維亞工業發展上的預算；這裡的工業化程度已經遠高於群島其他城市了。這筆資金應轉而用於在全國範圍內建立許多小型棕櫚種植園，生產國際需求旺盛的商品棕櫚糖。"
 INS_all_cards_into_industry: "全押工業"
 INS_all_cards_into_industry_desc: "工業化對[1058.GetName]的經濟產生了巨大影響。如果我們實現整個島嶼的工業化，使其擁有數千萬公民，我們就可以在全球範圍內發揮影響力。"
 INS_expand_batavia_technical_institute: "擴建巴達維亞理工學院"
 INS_expand_batavia_technical_institute_desc: "擴建巴達維亞理工學院將使更多學生接受教育，並提高我們的技術發展速度。"
 INS_quinine_export: "更有利可圖的奎寧協議"
 INS_quinine_export_desc: "阿姆斯特丹的金雞納管理局幾乎壟斷了奎寧出口，由於奎寧作為瘧疾治療藥物在全球範圍內需求旺盛，這尤其有利可圖。該局大部分的奎寧來自東印度群島。儘管如此，我們獲得的利潤份額卻非常小。我們應該利用我們的奎寧產量作為籌碼，以談判一個更公平的協議。"
 INS_spend_profits_on_rural: "將收益用於農村發展"
 INS_spend_profits_on_rural_desc: "隨著我們的新奎寧協議最終敲定，我們有了一個機會：利用我們的額外收入來發展農村地區的交通和通信基礎設施，為未來的工業發展鋪平道路。"
 INS_spend_profits_on_urban: "將收益用於城市發展"
 INS_spend_profits_on_urban_desc: "隨著我們的新奎寧協議最終敲定，我們有了一個機會：利用我們的額外收入來擴大巴達維亞的製造業，這將使我們的經濟多樣化，並減少我們對出口原材料的依賴。"
 INS_spend_profits_on_military: "將收益用於軍事發展"
 INS_spend_profits_on_military_desc: "隨著我們的新奎寧協議最終敲定，我們有了一個機會：利用我們的額外收入在日惹和三寶壟建造和維護新的武器工廠，從而顯著改善我們的軍事力量。"
 INS_end_to_bloodshed_tt: "戰爭將會結束，並根據當前的佔領情況劃定新的邊界。爪哇、蘇門答臘和婆羅洲將被目前在各自區域擁有最大控制權的一方§Y吞併§!。"
