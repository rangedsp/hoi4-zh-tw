 AST_through_the_barricades_tt: "如果§Y[ENG.GetNameDef]§!擁有至少§Y10%§!共產主義支持度，那麼戰爭開始時§Y[132.GetCapitalVictoryPointName]§!的碼頭工人會發動起義支持我們！"
 AST_end_the_kingdom_ireland_join_tt: "由於[IRE.GetName]簽署了反英條約，他們會在我們對[ENG.GetNameDef]宣戰時加入我們一方。"
