 # Alternative Communist Focus
 SIA_the_peoples_war_in_asia: "亞洲人民戰爭"
 SIA_the_peoples_war_in_asia_desc: "反對[JAP.GetAdjective]帝國主義的鬥爭不僅是國家間的較量，更是一場工人、農民和士兵反抗外來統治的戰爭。通過與中國的共產主義力量站在一起，[ROOT.GetNameDef]投身於一場遍及亞洲的更廣泛的人民戰爭。"
 SIA_peoples_war_in_asia_idea: "亞洲人民戰爭"
 SIA_peoples_war_in_asia_idea_desc: "支撐這場戰爭的不僅是正規部隊。地方委員會、游擊嚮導和農民補給隊如今都在戰場為軍隊服務。每個村莊都成為一座兵站，每條道路都可能是一次伏擊，每次撤退都是一次將敵人引向更深內陸的機會。"
 # Alternative Nationalist Focus
 SIA_national_defense_in_asia: "亞洲國防"
 SIA_national_defense_in_asia_desc: "亞洲的防衛需要紀律、等級體系與共同的戰略目標。通過與中國的民族主義政府站在一起，[ROOT.GetNameDef]加入了一個決心以有組織的軍隊和協調統一的指揮來抵抗[JAP.GetAdjective]擴張的聯盟。"
 SIA_national_defense_in_asia_tt: "§Y[ROOT.GetNameWithFlag]§!支持統一戰線的民族主義力量。\n添加§Y$SIA_national_defense_in_asia_idea$§!，給予：\n $MODIFIER_ARMY_ORG_FACTOR$：§G+5%§!\n $MODIFIER_PLANNING_SPEED$：§G+10%§!\n $MODIFIER_MAX_PLANNING$：§G+10%§!\n $MODIFIERS_ARMY_DEFENCE_FACTOR$：§G+5%§!"
 SIA_stronger_together: "團結就是力量"
 SIA_stronger_together_desc: "戰爭已將那些遙遠的許諾與各行其是的同盟化為近乎障礙的存在。若[ROOT.GetNameDef]要塑造亞洲的未來，我們必須要求我們的夥伴將他們的陣營與我們聯合，並在即將到來的鬥爭中接受單一指揮。"
 idea_SIA_national_defense_in_asia: "亞洲國防"
 SIA_directorate_of_aeronautical_engineering_desc: "[ROOT.GetNameDef]空中力量的未來不能僅靠飛行員來保障。它需要工程師、檢查員、車間，以及一個能將外國採購轉化為堪用戰機的中央權威。航空工程局將成為這一努力的基礎。"
 idea_SIA_aeronautical_engineering_directorate: "航空工程局"
 SIA_standardize_aircraft_maintenance: "標準化飛機維護"
 SIA_standardize_aircraft_maintenance_desc: "我們的飛機來源眾多，每種都有各自的零件、工具和維修習慣。通過在航空工程局下統一標準化維護流程，[ROOT.GetNameDef]能讓更多飛機保持升空狀態，並減少因地勤混亂造成的損耗。"
 SIA_expand_aircraft_workshops: "擴建飛機車間"
 SIA_expand_aircraft_workshops_desc: "航空工程局所需的不僅是辦公室和檢驗文件。新的車間、機床和訓練有素的機械師將使受損飛機能在國內維修，而簡單部件則可自行生產，無需等待外國交付。"
 SIA_license_modern_airframes: "現代機身許可生產"
 SIA_license_modern_airframes_desc: "[ROOT.GetNameDefCap]尚不能設計所有自身所需的飛機。一條更務實的道路是獲取外國型號的生產許可，研究其構造，並在航空工程局的監督下使其適應我國的氣候、機場及補給條件。"
 SIA_tropical_air_operations: "熱帶空中作戰"
 SIA_tropical_air_operations_desc: "炎熱、潮溼、季風雨和崎嶇的前線機場對飛機和機組人員有其特殊要求。通過使發動機、維護週期和飛行員戰術條令適應這些條件，航空工程局能使我空軍在東南亞上空更加可靠。"
 ##########
 #### AUSTRALIA ####
 ###################
 effects_of_event_tt: "\n§Y事件效果§!："
 AST_war_is_coming: "戰爭將至"
 AST_war_is_coming_desc: "在過去的三十年裡，我們接連面對各種挑戰，而現在似乎又有一場最終的考驗即將到來，它將再次檢驗澳大利亞民主制度的力量。前總理比利·休斯對此十分明確，並警告說——無論我們是否願意——戰爭即將來臨。如果我們忽視這一判斷，那將是極其不負責任的行為。"
 AST_war_is_coming_tt: "\n解鎖§Y民主選舉§!"
 AST_war_is_coming_uap_advisors_tt: "（§Y$AST_billy_hughes$§!）："
 AST_war_is_coming_alp_advisors_tt: "（§Y$AST_james_scullin$§!）："
 AST_war_is_coming_decrease_advisors_tt: "（§Y$AST_maurice_blackburn$§!）："
 AST_war_is_coming_advisors_tt: "\n政治顧問追加效果："
 AST_advance_pacific_initiatives: "推進太平洋倡議"
 AST_advance_pacific_initiatives_desc: "憑藉我國成功締結的互不侵犯條約，我國與亞洲鄰國的關係已然改善。我們應繼續充分利用這份睦鄰關係，並呼籲新晉盟友助力我國工業發展。"
 AST_advance_pacific_initiatives_tt: "\n與以下國家簽署互不侵犯條約："
 AST_advance_pacific_initiatives_jap_tt: " §Y[JAP.GetName]§!為修正添加§G2§!地圖外§Y船塢§!。"
 AST_advance_pacific_initiatives_ins_tt: " §Y[INS.GetName]§!為修正添加§G1§!地圖外§Y合成煉油廠§!。"
 AST_advance_pacific_initiatives_chi_tt: " §Y[CHI.GetName]§!為修正添加§G2§!地圖外§Y民用工廠§!。"
 AST_advance_pacific_initiatives_jap_2_tt: "§Y[JAP.GetName]§!提供："
 AST_advance_pacific_initiatives_ins_2_tt: "§Y[INS.GetName]§!提供："
 AST_advance_pacific_initiatives_chi_2_tt: "§Y[CHI.GetName]§!提供："
 AST_advance_pacific_initiatives_2_tt: "\n如果與相關國家開戰，建築將被移除。"
 AST_pacific_initiatives_modifier: "外交倡議"
 AST_domestic_industry: "國內工業"
 AST_domestic_industry_desc: "我們不能依賴盟國的國防工業在戰爭來臨時供應我們。我們必須擴大自己的工業，為即將到來的任何事情做好準備。"
 AST_a_democratic_bulwark: "民主堡壘"
 AST_a_democratic_bulwark_desc: "要同時抵禦法西斯與共產主義的威脅，民主必須走在前列。政府將採取積極政策，並確保政客們的不滿情緒可通過加入不同民主黨派來疏導，而非轉向有害的意識形態。"
 AST_the_pacific_pact: "太平洋協定"
 AST_the_pacific_pact_desc: "萊昂斯1934年推出的太平洋倡議，令澳大利亞與亞洲主要國家建立了直接外交聯繫，使我國不必再依附英國官員代為訴求本國利益。若能依託這份邦交關係，促成亞洲各國對澳大利亞保持不侵略立場，便達成了我國外交努力的最終目標。雖然這項任務充滿挑戰，但仍值得嘗試。"
 AST_a_collapsing_league_of_nations: "搖搖欲墜的國際聯盟"
 AST_a_collapsing_league_of_nations_desc: "國際聯盟正在崩潰——這是一個善意的倡議，可惜植根於不切實際的希望。制裁政策很容易變成空洞的姿態，尤其是在沒有武裝力量可以壓制不守規矩的國家時更是如此。我們的重新武裝必須開始。"
 AST_department_of_munitions: "軍需部"
 AST_department_of_munitions_desc: "為了確保前線士兵得到充分補給，我們需要加快軍需品生產。設立軍需部將使政府能夠對國防生產進行更嚴格的監督。"
 AST_call_for_a_referendum: "舉行全民公投"
 AST_call_for_a_referendum_desc: "我們希望加強聯邦政府的權力，但必須先獲得選民的支持。通過舉行公投，我們可以徵求公眾的同意。"
 AST_rural_concessions: "農村讓步"
 AST_rural_concessions_desc: "鄉村黨的農村代表獲得的選票遠不足以單獨執政，但他們在澳大利亞政治中仍具有重要影響力。我們作為現任執政黨可以獲得額外支持。"
 AST_rural_concessions_tt: "\n§Y$AST_country_party_influence_uap$§!將增加國策完成時執政黨的選票。"
 AST_solidarity_by_the_empire: "帝國的團結"
 AST_solidarity_by_the_empire_desc: "迄今為止，大英帝國在戰爭與和平時期都指引著我們。我們將繼續重視其建議，並在應對潛在衝突的準備工作中與其合作。"
 AST_solidarity_by_the_empire_modifier: "帝國的團結"
 AST_wool_agreement: "羊毛協議"
 AST_wool_agreement_desc: "羊毛是澳大利亞最重要的出口商品之一，它不僅帶來利潤，也能改善與進口國的關係。然而英國要求獲得全部羊毛，一方面用於軍裝生產，另一方面也用於與缺乏羊毛的國家進行外交談判。我們將同意英國的要求。"
 AST_australian_war_cabinet: "澳大利亞戰時內閣"
 AST_australian_war_cabinet_desc: "在英國的建議下，我們將設立自己的戰時內閣。這樣可以讓政府專注於國家安全事務，從而提高決策效率。"
 AST_singapore_strategy: "新加坡戰略"
 AST_singapore_strategy_desc: "新加坡戰略是澳大利亞國防政策的核心部分。作為駐太平洋英國皇家海軍的基地，新加坡本身具有極其重要的戰略意義。我們應說服英國加強當地防禦建設，同時強化澳大利亞海軍實力。"
 AST_singapore_strategy_tt: "在§Y180§!天后（§Y新加坡§!）：\n增加 §G2§!級§Y空軍基地§!\n增加 §G2§!級§Y海軍基地§!。\n增加 §G1§!級§Y海岸要塞§!。"
 AST_british_war_cabinet: "英國戰時內閣"
 AST_british_war_cabinet_desc: "戰爭已經爆發，英國成立了戰時內閣以確保盟軍戰爭行動的高效進行。他們邀請我們共同討論相關事務，因此首相將前往參加會議並代表澳大利亞的利益。"
 potential_consequence_tt: "§Y潛在後果§!：\n"
 AST_british_pacific_fleet: "英國太平洋艦隊"
 AST_british_pacific_fleet_desc: "英國在太平洋的存在對於遏制敵方艦隊向南擴張至關重要。作為[Root.GetFactionName]的一員，我們將推動建立聯合指揮體系，以保護沿海海域。"
 AST_all_dressed_up: "全副武裝"
 AST_all_dressed_up_desc: "如果澳大利亞士兵為英國作戰，那麼英國的工廠就應當為他們提供裝備。"
 AST_overseas_loyalties: "海外忠誠"
 AST_overseas_loyalties_desc: "我們將繼續參與海外戰爭，再次證明對澳大利亞士兵而言，沒有所謂的外國戰場。戰爭不會降臨到我們頭上——是我們主動走向戰爭。"
 AST_the_ultimate_overseas_duty: "最終的海外責任"
 AST_the_ultimate_overseas_duty_desc: "英國首相對其職責管理不善，以至於自己的內閣大臣間都瀰漫著不信任。孟席斯在出席英國戰時內閣會議期間給人留下了極為強烈的印象，如今甚至有人提議，他或許確實是英國更好的選擇。由他執掌英聯邦大權，我們便可利用孟席斯對[AST.GetName]的忠誠，來提升我們的權威。"
 AST_the_ultimate_overseas_duty_tt: "\n§Y$AST_robert_menzies$§!擔任§Y[ENG.GetNameDef]§!領導人時，我們可以通過§Y$AST_a_change_of_authority$§!國策成為§Y$autonomy_associated_dominion$§!。"
 AST_pleading_britain: "請求英國援助"
 AST_pleading_britain_desc: "戰爭顯然即將來臨，我們已不寒而慄。雖然不想冒犯我們的澳新軍團精神和“礦工”們的聲譽，但如果沒有[ENG.GetName]的援助，澳大利亞的戰爭能力將迅速枯竭。總理應在方便時儘早致電[ENG.GetLeader]。"
 AST_bound_once_more: "再度聯結"
 AST_bound_once_more_desc: "我們的道路曾分岔，但必將再度匯合。[ENG.GetNameDefCap]和[AST.GetName]都正經歷國家變革，但由此產生的我們之間的距離，僅是一個無心且不利的副作用。至少在我們這邊如此。我們將再度結盟，團結一致克服我們變革中國家的障礙。"
 AST_eng_to_ast_faction_tt: "§Y[ENG.GetName]§!和其附屬國加入§Y[AST.GetFactionName]§!。"
 AST_faction_leader_tt: "成為§Y[AST.GetFactionName]§!陣營的領袖"
 AST_eng_as_faction_leader_tt: "\n（[ENG.GetFlag]§Y[ENG.GetName]§!）$AST_faction_leader_tt$"
 AST_australian_command: "澳大利亞指揮體系"
 AST_australian_command_desc: "即使在[ENG.GetNameDef]，澳大利亞防務的重要性也越來越明顯。因此需要對聯合部隊進行重組。更多英國部隊將被置於澳大利亞指揮之下，從而使戰爭行動更加高效。"
 AST_taking_the_helm: "掌舵前行"
 AST_taking_the_helm_desc: "隨著我們在東南亞的影響力不斷擴張，我們的海軍力量必須壯大起來以捍衛它。我們應優先持續投資於澳大利亞皇家海軍，並確立對東部海域的控制。"
 AST_eastern_focus: "東方焦點"
 AST_eastern_focus_desc: "如果英國的戰爭就是澳大利亞的戰爭，那麼澳大利亞的戰爭同樣也是英國的戰爭。日本入侵的威脅早已顯而易見，我們不會再被動等待戰爭降臨。我們將讓日本見識到澳大利亞的決心，同時英國也將以最明確的方式證明自己的忠誠：對日本宣戰。"
 AST_eastern_focus_tt: "\n該任務將允許§Y[ENG.GetNameDef]§!立即對§Y[JAP.GetNameDef]§!宣戰，並且如果180天內未宣戰則強制宣戰。§Y[ENG.GetNameDefCap]§!可以通過投資澳大利亞國防建設來推遲任務的完成日期。"
 AST_holding_the_battlefield: "掌握戰場"
 AST_holding_the_battlefield_desc: "許多澳大利亞士兵在海外戰場陣亡，但他們的功績卻被算作英國的勝利。澳大利亞要求在與[ENG.GetNameDef]一同參與的和平會議上擁有更大的發言權，否則我們可能停止貢獻力量。"
 AST_holding_the_battlefield_tt: "在與§Y[ENG.GetNameDef]§!的和平會議中，對§Y傀儡§!和§Y吞併國家§!行動的成本§Y降低§!。"
 AST_a_change_of_authority: "權威的改變"
 AST_a_change_of_authority_desc: "從一個順從的臣屬，澳大利亞已成長為一個受人尊敬、堅定自信的國家，是時候邁出最後一步，躋身世界強國之林了。作為[AST.GetFactionName]的領袖，朋友將尊敬我們，敵人將畏懼我們。紮根穩固、不屈不撓，澳大利亞決不屈服。"
 AST_a_change_of_authority_tt: "§Y[ROOT.GetName]§!現在可以自行宣戰\n§Y[ROOT.GetName]§!現在可以拒絕參戰請求\n§Y[ROOT.GetName]§!不再將任何和談分數轉移給宗主國"
 AST_reinforcements: "增援"
 AST_reinforcements_desc: "我們將為開發程度較低的北部地區建設防禦設施和空軍基地。"
 AST_weekly_stability_tt: "每週穩定度：§G+1.00%§!"
 AST_ending_overseas_conscription: "結束海外徵兵"
 AST_ending_overseas_conscription_desc: "我們的士兵必須立即從海外戰場撤回；本土更加需要他們。"
 AST_unlocking_conscription_1903_tt: "需要解鎖§Y徵兵法案§!。"
 AST_unlocking_further_conscription_tt: "對於§Y廣泛徵兵§!或§Y按要求服兵役§!，你還需要以下任一國策：§Y$AST_british_pact$§!（法西斯）、§Y$AST_refuse_british_wars$§!（法西斯）、§Y$AST_toe_the_line$§!（法西斯）、§Y$AST_from_picket_line_to_front_line$§!（共產主義）或§Y$AST_part_with_colonizer$§!（共產主義）。"
 AST_unlocking_conscription_tt: "如果你已§Y$AST_invoke_the_1903_defence_act$§!，將解鎖所有剩餘§Y徵兵法案§!。"
 AST_an_uncle_for_father_figure: "長兄如父"
 AST_an_uncle_for_father_figure_desc: "我們缺乏現代化武器，因此將向[USA.GetName]尋求援助，請求他們為我們提供裝備。"
 AST_seven_million_britishers: "七百萬英國人"
 AST_seven_million_britishers_desc: "儘管[ENG.GetLeader]一直不願給出明確承諾，我們仍將相信他以及英國在關鍵時刻會履行對[AST.GetNameDef]的義務。畢竟，我們只是七百萬英國人。"
 AST_seven_million_britishers_reinforcements_tt: "\n§Y如果$AST_reinforcements$未完成§!："
 AST_seven_million_britishers_conscription_tt: "\n§Y如果$AST_ending_overseas_conscription$未完成§!："
 AST_seven_million_britishers_uncle_tt: "\n§Y如果$AST_an_uncle_for_father_figure$未完成§!："
 AST_we_endured: "我們挺過來了"
 AST_we_endured_desc: "最初，對即將到來的戰爭的預測令人不安，但正是這種危機感促使我們迅速擴張防禦能力。我們堅持了下來，並將繼續前進，現在我們完全致力於一個最終目標：贏得戰爭。"
 AST_under_the_rule_of_canberra: "在堪培拉統治之下"
 AST_under_the_rule_of_canberra_desc: "太平洋各國之間不斷上升的緊張局勢令人擔憂，而英國正忙於自己的戰爭，其能夠前來援助我們的可能性顯得十分渺茫。如果我們重組英聯邦，讓太平洋與印度洋地區的國家直接由堪培拉管理，我們或許能夠在同一戰線下團結起來——即使沒有[ENG.GetNameDef]也能做到。"
 AST_its_fight_work_or_perish: "戰鬥、工作，或滅亡"
 AST_its_fight_work_or_perish_desc: "戰爭已經開始，現在只剩下一件事：證明我們已經做好準備。"
 AST_no_foreign_battlefields: "拒絕外國戰場"
 AST_no_foreign_battlefields_desc: "長久以來的期盼終於實現，政府正式宣佈：任何公民都不會被強迫在外國戰場服役。"
 AST_no_foreign_battlefields_modifier: "拒絕外國戰場"
 AST_platypus_modifier: "國禮鴨嘴獸"
 AST_aerial_defense: "空中防禦"
 AST_aerial_defense_desc: "即使我們無法建立與世界強國相匹敵的龐大海軍，我們仍有能力維持一支足以與任何敵人抗衡的空軍。"
 AST_ratify_westminster_adoption_act: "批准《威斯敏斯特法令》"
 AST_ratify_westminster_adoption_act_desc: "即便改動沿襲已久的國策會引發輿論爭議，但批准《威斯敏斯特採納法令》勢在必行。今後哪些戰爭屬於我們，將由我們自己決定。"
 AST_ratify_westminster_adoption_act_tt: "£GFX_trigger_no 可以拒絕戰爭召喚"
 AST_administer_the_mandate: "管理託管地"
 AST_administer_the_mandate_desc: "自1920年以來，我們根據國際聯盟的授權管理新幾內亞，而巴布亞也幾乎從聯邦成立起就成為[AST.GetName]的海外領地。因此，將巴布亞新幾內亞東部地區納入[AST.GetName]核心領土是順理成章的。隨著國際聯盟解散，這樣的聯邦重組如今成為可能。"
 AST_a_rational_request: "合理的請求"
 AST_a_rational_request_desc: "新加坡戰略在理論上成立，但也僅僅是理論。亨利·溫特等人的警告是正確的：如果太平洋戰爭爆發，英國很可能被迫專注於歐洲戰場。因此，依賴英國援助的戰略並不可靠。我們將請求控制新加坡，以便由我們自己負責海域防禦。"
 add_trait_to_theorist_tt: "為§Y理論家§!添加特質："
 AST_volunteers: "志願兵"
 AST_volunteers_desc: "關鍵在於擁有選擇權；能夠拒絕參戰並不意味著澳大利亞一定會拒絕。澳大利亞人應當有權在本土或海外為正義而戰。"
 AST_until_the_tide_of_battle_swings: "直到戰局逆轉"
 AST_until_the_tide_of_battle_swings_desc: "我們將公開聲明：對家門口的威脅視而不見的時代已經結束。我們拒絕繼續將太平洋戰爭視為全球戰爭的次要戰場。澳大利亞必須立即為可能的入侵做好準備。"
 AST_walls_and_whispers: "高牆與低語"
 AST_walls_and_whispers_desc: "固若金湯的防線配上接地氣的耳目，為國家安全帶來了巨大潛力。我們將著手在各處，為陸軍與海岸防禦打下更好基礎，並在其中設立一個情報總部。"
 AST_united_states_as_our_keystone: "以美國為支柱"
 AST_united_states_as_our_keystone_desc: "我們理解英國所面臨的困難，也明白力量分散的危險。但我們同樣知道，即使澳大利亞淪陷，英國仍然可以繼續戰鬥。因此我們決心：澳大利亞絕不能淪陷。我們將傾盡全力制定一項計劃，並以美國作為核心支柱。"
 AST_liberty_loans: "自由貸款"
 AST_liberty_loans_desc: "憑藉擔任財政部長期間積累的經驗，本·奇夫利已經證明自己具備管理戰時經濟的能力——甚至有人稱他是國家歷史上最偉大的財政部長。根據他的建議，我們將鼓勵公民將多餘收入轉為儲蓄，並投資戰爭債券。"
 AST_inevitably_independent: "無可避免的獨立"
 AST_inevitably_independent_desc: "儘管澳大利亞聯合黨始終珍視英國公民身份，但[ENG.GetNameDef]對澳大利亞利益的漠不關心迫使我們不得不著手宣佈獨立並優先考慮自身的國防。如今，我們已不再需要遠赴海外參加英國的戰事，甚至連反保皇派也更傾向於聽命行事；因此，擴大徵兵規模將面臨更小的阻力。"
 AST_bring_on_the_giant: "巨人請進門"
 AST_bring_on_the_giant_desc: "我們終於成為一個統一且自治的主權國家，我們的勇氣即將經受考驗。太平洋彼岸的國家似乎與我們利益相通，憑藉其發達的軍事工業，[USA.GetNameDef]可以向我們的部隊租借其豐富的物資，極大地造福澳大利亞與該國自身。"
 AST_bring_on_the_giant_tt: "如果§Y[USA.GetNameDefCap]§!同意：\n 國家儲備中增加§Y+50§!個§Y運輸船§!。"
 AST_allied_after_all: "始終結盟"
 AST_allied_after_all_desc: "雖然澳大利亞獨立是必然之舉，但我們與舊主的一切合作不會就此終止。我們將一如既往地效忠於[ENG.GetFactionName]，但目標是在陣營內獲得更大的影響力。"
 AST_the_pacific_resistance: "太平洋抵抗組織"
 AST_the_pacific_resistance_desc: "澳大利亞終於迎來了獨立，我們脫離英國的諸多戰事也是理所應當的。通過轉而追求與[USA.GetNameDef]全方位密切合作，我們可以制定重視澳大利亞利益的聯合指揮戰略，同時獨立地完全控制我們自己的國防工業及其擴張策略。"
 AST_the_pacific_resistance_tt1: "§Y澳大利亞§!加入§Y[USA.GetFactionName]§!。"
 AST_the_pacific_resistance_tt2: "§Y[USA.GetName]§!加入§Y太平洋抵抗組織§!。"
 AST_conscription_at_last: "最後的徵兵"
 AST_conscription_at_last_desc: "獨立嚐起來很甜蜜，因為我們意識到我們現在有權優先考慮自己的國防——但這種權力也帶來了責任。不應輕易增加強制徵兵，但既然戰爭已經降臨，這已變得必要。"
 AST_equal_training: "同等訓練"
 AST_equal_training_desc: "與盟國的合作必須經過磨礪，而不能僅僅假設其能自動運作。澳大利亞將主動為[ROOT.GetFactionName]的國家組織聯合訓練營，並確保所有士兵都接受同樣嚴格的訓練。"
 AST_a_northern_barrier: "北部屏障"
 AST_a_northern_barrier_desc: "敵人正從北方襲來，他們可以首先肆意打擊那些位於其前進道路上、毫無防備的小國，然後再陳兵於我方國門之前。如果我們能與[INS.GetNameDef]聯合起來，構築一道統一的屏障，或許我們還有機會將他們拒之門外。"
 AST_demand_resources: "要求資源"
 AST_demand_resources_desc: "秉承擴張主義信條的侵略者垂涎印度支那，不僅是為了領土本身，更是為了其擁有的資源。如果這些財富落入敵人之手，只會延長戰爭；而若由我們掌控，則能助其結束。我們將要求獲得這些資源的控制權；如果持有者拒絕合作，他們便與敵人無異。"
 AST_demand_resources_tt: "解鎖§Y$AST_resource_acquisition_cat$§!決議，要求分享東南亞國家的資源。"
 AST_reclaim_the_lost_territory: "收復失地"
 AST_reclaim_the_lost_territory_desc: "在大洋洲各殖民地聯合成一個聯邦的過程中，新西蘭最終決定不參與。然而，自那時起，憲法始終將新西蘭定義為澳大利亞聯邦的潛在州之一，並允許其加入。我們將以此提醒我們的東部鄰國，並主張當前的國際局勢要求我們走向統一。"
 AST_reclaim_the_lost_territory_tt: "([NZL.GetFlag]§Y[NZL.GetName]§!)將其所有陸軍、海軍和空軍移交給§Y[AST.GetNameDef]§!"
 AST_australia_first: "澳大利亞優先"
 AST_australia_first_desc: "中央黨的極右活力是短暫的，隨著該黨於1935年解散而結束。然而，某種新的東西開始醞釀，源自商人和政治活動家威廉·約翰·邁爾斯的想法。倘若不主動造勢凝聚民意，這份思潮便會如興起時那般迅速消退。為此，我們必須主動採取行動。"
 AST_pankhurst_walsh: "阿德拉·潘克赫斯特"
 AST_pankhurst_walsh_desc: "在正式成立“澳大利亞優先運動”之際，我們應當任命阿德拉·潘克赫斯特·沃爾什擔任主席。作為帝國澳大利亞婦女協會的創始人，潘克赫斯特·沃爾什在與倫敦婦女協會保持密切聯繫的同時，長期倡導英國公民身份的價值。這一價值將成為該運動的核心原則：與英國維持聯繫。"
 AST_stephensen: "P·R·斯蒂芬森"
 AST_stephensen_desc: "在正式成立“澳大利亞優先運動”之際，我們應當任命P·R·斯蒂芬森擔任主席。作為威廉·約翰·邁爾斯的文學顧問，斯蒂芬森秉承其導師的孤立主義和民族主義觀點。這些觀點將形成該運動章程的兩個核心原則：脫離英國獨立和統一澳大利亞文化。"
 AST_stephensen_tt: "\n§Y澳大利亞優先運動§!主席的選擇將決定未來可能的行動。"
 AST_a_growing_womens_guild: "不斷壯大的婦女協會"
 AST_a_growing_womens_guild_desc: "自1928年成立以來，澳大利亞婦女帝國協會一直倡導勞資合作以解決國家經濟問題。為了國家利益，公民應協助政府，而非與之對立。有潘克赫斯特·沃爾什擔任“澳大利亞優先運動”的主席，我們便可通過其政治運動，將這一訊息傳播得更遠。"
 AST_realize_the_value_of_british_citizenship: "珍視大英公民身份"
 AST_realize_the_value_of_british_citizenship_desc: "[ENG.GetNameDefCap]對[AST.GetName]的宗主權，長久以來既是我國的保護傘，也是指路明燈。我們源自英國，也將留在英國——只要它仍對我們有用。"
 AST_the_bolsheviks_counterforce: "布爾什維克的對抗力量"
 AST_the_bolsheviks_counterforce_desc: "調查處幾十年來一直在對各類顛覆組織的活動進行情報調查，其鎮壓左翼勢力威脅的工作極具價值。即便澳大利亞優先運動的反對者刻意阻撓我們發展，也不能荒廢該部門的本職工作。我們將滲透澳大利亞情報部門的關鍵崗位，確保國安機構始終以應對真正的國家安全威脅為首要任務。"
 AST_public_meetings_tt: "解鎖§Y澳大利亞優先運動§!決議，可以動員成員並提高法西斯支持度。"
 AST_rile_up_veterans: "煽動老兵"
 AST_rile_up_veterans_desc: "大蕭條伊始，一戰老兵們便聯合起來組成極右準軍事團體，以對抗共產主義的興起。即使那些團體後來解散了，其前成員也並未消失；澳大利亞優先運動將吸收他們，反共的火炬也將由此傳承。"
 AST_eureka_stockade_monument_rally: "紀念尤利卡起義"
 AST_eureka_stockade_monument_rally_desc: "1854年的尤里卡柵欄戰役中，澳大利亞金礦礦工因採礦許可證價格不合理及金礦稅問題，與殖民地軍隊展開了激烈戰鬥。早在那時，民眾對英國宗主統治的不滿已然顯露，而今這份情緒依舊未曾消減。我們將齊聚戰役紀念碑前發起集會，呼籲脫離英國。"
 AST_australian_pivot_modifier: "澳大利亞的支點"
 AST_well-being_of_the_community: "社區福祉"
 AST_well-being_of_the_community_desc: "基督徒關於生活與家庭的理念，理應受到澳大利亞大眾的高度珍視。然而，過去這些年慘淡的出生率，無疑表明這些理念尚未得到足夠的尊崇。為了社群的福祉，我們將發起一場宣揚家庭生活的運動。"
 AST_covert_networks: "秘密網絡"
 AST_covert_networks_desc: "借澳大利亞優先運動在調查局內部活動之機，我們應尋求與[ENG.GetNameDef]境內志同道合的運動開展跨境合作。我們與宗主國的同盟或將再發揮一種作用，讓我們能隱秘地接觸意識形態一致的盟友，並加強我們的情報能力。"
 AST_refuse_british_wars: "拒絕英國的戰爭"
 AST_refuse_british_wars_desc: "第一次世界大戰中的加里波利戰役，充分展示了[ENG.GetNameDef]對待我們遠征軍的魯莽態度，使得以英國名義再進行一場海外征戰的念頭變得完全無法想像。澳大利亞人要求決不能再讓鮮血在英軍的指揮下流淌，這迫使政府採取行動；《威斯敏斯特法案》必須批准。"
 AST_walls_like_uluru: "如烏魯魯巖般的堅實城牆"
 AST_walls_like_uluru_desc: "澳大利亞自身便是一塊大陸。若我們必須在沒有帝國庇護的情況下自立，就必須建立我們自己的防線。海岸線將被加固，港口將被堡壘化；對任何覬覦我們國家的敵人，任何通道都將危機四伏。"
 AST_at_the_gates: "兵臨城下"
 AST_at_the_gates_desc: "世界正走向戰爭，澳大利亞絕不能措手不及。國家的工廠和船塢必須加速運轉。這不是為他人的衝突所做的準備，而是為我們自身的生存所做的準備。"
 AST_the_guild_for_the_war_effort: "戰爭動員協會"
 AST_the_guild_for_the_war_effort_desc: "澳大利亞帝國婦女協會本為效忠王室而建。其宗旨正被徹底轉向。它所建立起的龐大組織網絡，如今將把能量輸送到戰爭工業、醫院以及一個自力更生的澳大利亞的補給鏈之中。"
 AST_for_the_southern_cross: "為了南十字星"
 AST_for_the_southern_cross_desc: "南十字星不照耀不列顛。它照耀著我們。澳大利亞的身份認同是真實的，是贏得的，是值得捍衛的。一種新的民族自豪感正被鑄造，它不是從倫敦借來的，也不是由遙遠機構定義的，而是生長於此，在這片土地，在這片星空下。"
 AST_through_the_gates: "踏過城門"
 AST_through_the_gates_desc: "更緊迫的事務迫使各項事務讓位。國防計劃正在澳大利亞工業的全部力量支撐下進行擴展。新設施與現有設施一同拔地而起，產出目標向上修正，民用生產與軍事必需之間的界限悄然消除。"
 AST_toe_the_line: "嚴守界線"
 AST_toe_the_line_desc: "澳大利亞人在繁榮年代所習慣的舒適，現在必須擱置一旁。配給制、更長的工作時間和服役號召，是獨立的代價。那些響應號召的人將會發現，一個準備支持他們的國家。但對於那些認為犧牲是他人負擔的人，國家將不會有多少耐心。"
 AST_crush_the_gates: "攻破城門"
 AST_crush_the_gates_desc: "擴軍備戰已經完成。澳大利亞工業現已處於全面戰爭狀態，其產出完全投向國防力量的建設與投送。無論即將來臨的是何種風暴，澳大利亞都將迎接它，我們不再是一個倉促動員、心不甘情不願的自治領。"
 AST_national_defense: "國家防衛"
 AST_national_defense_desc: "通過有意識的投資和國家指導，澳大利亞已建立起足以維持自身防衛的工業基礎。工廠與船塢在國家監督下運作，衡量其產出的不再是利潤，而是國家的需求。"
 modify_AST_national_defense_tt: "§Y$AST_national_defense$§!追加效果："
 AST_nauru_pact: "瑙魯協定"
 AST_nauru_pact_desc: "奪權的首要阻礙仍橫亙眼前，獨立之事看似遙遙無期，但謀求澳大利亞自治絕非僅關乎我方一己之利。為換取[GER.GetNameDef]在英國阻撓澳大利亞優先運動，或是日後澳洲脫離英聯邦時為我們提供保障，我方承諾上臺後，將歸還他們失去的太平洋島嶼之一——瑙魯。"
 AST_australian_culture_investments: "澳大利亞文化投資"
 AST_australian_culture_investments_desc: "斯蒂芬森通過其論文《澳大利亞文化基礎》，影響了金迪沃羅巴克詩歌運動的形成，並闡明瞭一點：澳大利亞文化必須被置於優先地位。現行政府全然漠視文藝創作者的價值，而我們絕不會如此。我們將動員金迪沃羅巴克詩歌運動與澳大利亞優先運動的支持者，共同刺激本土文化發展。"
 AST_australian_culture_investments_tt: "\n§Y365§!天后："
 AST_australia_first_party_focus: "澳大利亞優先黨"
 AST_australia_first_party_focus_desc: "澳大利亞優先運動成員已壯大到無法再阻止其前進的地步。是時候讓澳大利亞公眾迎接這個新註冊、最響亮的民族主義聲音了：澳大利亞優先黨。"
 AST_australia_first_party_req_tt: "§Y澳大利亞優先黨§!已成立。"
 AST_in_from_the_cold: "結束危險"
 AST_in_from_the_cold_desc: "澳大利亞優先及其支持者無需再躲藏。我們國家在歷任政府領導下所遭受的虐待終於被揭露，現在是傾聽新聲音的時候了。"
 AST_absorb_the_uap: "吸納澳大利亞聯合黨"
 AST_absorb_the_uap_desc: "儘管澳大利亞聯合黨始終秉持自由主義，但它也屬於右翼政黨。如今新政黨掌舵，澳大利亞聯合黨的黨員已然別無選擇，只能轉而支持現政府的施政綱領。我們將主動接洽該黨核心骨幹，吸納其加入澳大利亞優先黨。"
 AST_big_business_pact: "大企業協定"
 AST_big_business_pact_desc: "由於澳大利亞優先黨旨在保護國內產業，它已在許多大企業巨頭中找到了支持者。作為推行增加其利潤的政策的交換，他們將支持我們的政治和軍事目標。"
 AST_big_business_pact_tt: "\n解鎖§Y大企業協定§!決議，影響工廠和建造目標。"
 AST_autarky: "自給自足"
 AST_autarky_desc: "依賴對外貿易是危險的，尤其是在衝突時期；澳大利亞工業必須被置於優先地位，而非被進口產品擊敗。只有限制我們的貿易法，才能保護國內經濟，確保澳大利亞能夠自給自足。"
 AST_energy_independence: "能源獨立"
 AST_energy_independence_desc: "依賴對外貿易是危險的，尤其是在衝突時期；能源獨立對於確保澳大利亞即使在最艱難時期也能正常運轉至關重要。通過投資煉油廠，我們可以促進國內能源生產。"
 remove_2_offsite_dockyard: "移除§R2§!地圖外§Y海軍船塢§!。"
 AST_british_pact: "英澳協定"
 AST_british_pact_desc: "儘管最近從英聯邦脫離，但繼續與舊日母國合作，仍符合[AST.GetName]的利益。考慮到[ENG.GetNameDef]在全球兵力捉襟見肘，我們願通過提供軍事合作來分擔其重擔，這應當會受到讚賞。"
 AST_naurus_return_to_german_hands: "瑙魯歸還德國"
 AST_naurus_return_to_german_hands_desc: "如今澳大利亞優先黨已完全執掌國家權柄，是時候兌現關於瑙魯的承諾，同時要求德國盟友履行盟約義務了。[AST.GetName]終將掙脫英聯邦的枷鎖，徹底剝奪英國對本國事務的干涉權。"
 AST_naurus_return_to_german_hands_tt: "“§Y瑙魯條約§!”將生效。"
 AST_naurus_return_to_german_hands_tt_2: "“§Y瑙魯條約§!”生效中。"
 AST_the_winner_takes_it_all: "勝者通吃"
 AST_the_winner_takes_it_all_desc: "過去為了能與德國合作而犧牲瑙魯島是合理的，但如今已然不合時宜。我國的實力已充分彰顯，理應向所羅門群島與新西蘭擴張勢力，即便此舉會進一步背棄《瑙魯協定》也在所不惜。畢竟，所羅門群島將成為又一塊落入澳洲手中、脫離德國掌控的領地。"
 AST_resist_western_intruders: "抵抗西方入侵者"
 AST_resist_western_intruders_desc: "西方國家似乎被迫干涉太平洋事務，但這不能再繼續下去了。在他們到達我們的海岸之前，我們將到達他們的海岸——以此證明[AST.GetName]不是一個屈從於他方要求的國家。"
 AST_invasion_preparation_tt: "登陸準備時間：§G-20.0%§!"
 AST_naval_invasion_penalty_tt: "登陸懲罰：§G-20.0%§!"
 AST_expand_the_fort: "擴建要塞"
 AST_expand_the_fort_desc: "西太平洋不是由[USA.GetNameDef]來支配的。美國聲稱擁有的島嶼屬於東亞國家，隨著澳大利亞影響力的增長，我們才應是那些島嶼的擁有者。"
 AST_integrate_the_fort: "整合要塞"
 AST_integrate_the_fort_desc: "自1920年以來，我們根據國際聯盟的授權管理新幾內亞，而巴布亞也幾乎從聯邦成立起就成為[AST.GetName]的海外領地。因此，將巴布亞新幾內亞東部地區納入[AST.GetName]核心領土是順理成章的。這就是我們統一澳大利亞文化的下一步。"
 AST_defying_american_interference: "無視美國干涉"
 AST_defying_american_interference_desc: "[USA.GetNameDefCap]的陰影籠罩著我們，每當我們的行動不符合其利益時，它就威脅要進行干預。有了這樣一個橫跨太平洋的全球大國對[PHI.GetNameDef]的鐵腕控制，東亞諸國將永遠不會真正屬於東亞。[AST.GetName]不會向任何外國入侵者的權威屈服——菲律賓將屬於我們。"
 AST_the_pacific_garrison: "太平洋駐軍"
 AST_the_pacific_garrison_desc: "雖然保護東南亞和太平洋符合英國的利益，但該地區距英國本土萬里之遙。作為對英國在補給上支持的回報，我們將主動提出接手這片領土的防禦指揮，使[ENG.GetNameDef]能將注意力轉向別處。"
 AST_vichy_out_of_africa: "維希法國退出非洲"
 AST_vichy_out_of_africa_desc: "降服或聯手維希法國，是[ENG.GetNameDef]的主要目標之一。作為善意的表示，[AST.GetName]將加入其中，並追擊法屬非洲殖民地，直到他們被征服。"
 AST_vichy_out_of_africa_tt1: "通過§Y維希法國退出非洲§!國策獲得§Y維希法國§!在§Y非洲§!領土的宣稱。\n"
 AST_vichy_out_of_africa_tt2: "通過§Y維希法國退出非洲§!決議獲得§Y維希法國§!在§Y非洲§!領土的宣稱。\n"
 AST_vichy_africa_claim_flag: "[AST.GetFlag]§Y[AST.GetName]§!對§Y維希法國§!所有§Y非洲§!領土的宣稱被添加到§Y停止干涉§!。"
 AST_vichy_claim_tt: "[AST.GetFlag]§Y[AST.GetName]§!的宣稱被添加到§Y停止干涉§!。"
 vichy_in_africa_trigger: "§Y維希法國§!：控制的任意地區：\n  位於§Y非洲§!"
 vichy_wargoal: "獲得針對§Y維希法國§!的§Y吞併§!戰爭目標。"
 AST_britain_supplying_ships: "英國提供艦船"
 AST_britain_supplying_ships_desc: "從肩負起保衛英國盟國海岸線的重擔以來，愈發明顯的事實是，[ROOT.GetName]的艦隊需要擴張。[ENG.GetNameDefCap]理當為我們提供艦船。"
 AST_hand_in_glove: "密切合作"
 AST_hand_in_glove_desc: "通過向北擴張，我們能夠增強澳大利亞在東南亞外交與衝突事務中的影響力。我們已充分證明，在維護本國利益的同時，也能有效保障英國的利益。因此，[ENG.GetNameDef]應當明白，將其偏遠領地交由我方管轄才是更為明智的選擇。"
 AST_claim_french_indochina: "宣稱法屬印度支那"
 AST_claim_french_indochina_desc: "法國的命運未決，其殖民地的歸屬也懸而未決。其他國家或想將貪婪之手伸向法屬印度支那，但它們絕對贏不過我們。"
 AST_undeniably_ours: "無可爭議屬於我們"
 AST_undeniably_ours_desc: "無論憑藉何種談判手段，我們都無法獲得全部成果。維希法國如今已是風雨飄搖，其國界不過形同虛設。若放棄全面佔領其領土的良機，實屬不明智之舉。戰爭的關鍵時刻，終於降臨了。"
 AST_done_meddling: "停止干涉"
 AST_done_meddling_desc: "[AST.GetName]始終未忘故土之根，昂首挺胸，繼續為英國而戰。澳大利亞人向來值得信賴，但這並不意味著他們的奉獻是理所應當的。當[AST.GetName]為[ENG.GetNameDef]浴血奮戰之時，[ENG.GetNameDef]也必將為[AST.GetName]挺身而出。"
 AST_northern_advancement: "向北推進"
 AST_northern_advancement_desc: "儘管澳大利亞更願意處理自己的政治事務，但除非我們展露獠牙，否則不要指望我們能不受干涉。[INS.GetNameDefCap]是一個與我們相似的國家——同樣受害於那些不願離開的歐洲闖入者。通過提出對領土的主張，我們發出明確的信號：太平洋國家不應受到干涉。"
 AST_soothing_australian_fears: "安撫澳大利亞的恐懼"
 AST_soothing_australian_fears_desc: "儘管一些政府官員認為澳大利亞與日本有合作的可能，但澳大利亞公眾並不這麼認為。在對日本入侵恐懼了這麼久之後，與這個潛在的侵略者攜手對大多數人來說是難以接受的。因此，我們將通過備戰來安撫他們的恐懼。"
 AST_soothing_australian_fears_tt: "\n§Y180§!天后："
 AST_dividing_the_pacific: "瓜分太平洋"
 AST_dividing_the_pacific_desc: "“澳大利亞優先”倡導與[JAP.GetNameDef]和平相處，將日本——與大多數澳大利亞公民不同——定義為潛在的太平洋盟友，而非時刻存在的威脅。隨著[AST.GetName]實力的提升，[JAP.GetName]也應該同意這一點，並且兩國潛在的衝突應當在有機會顯現前就已得到解決，這才是合理的。"
 AST_dividing_the_pacific_ast_gain_tt: "[GET_AST_DIVIDING_THE_PACIFIC_AST_GAIN]"
 AST_dividing_the_pacific_jap_gain_tt: "[GET_AST_DIVIDING_THE_PACIFIC_JAP_GAIN]"
 AST_dividing_the_pacific_tt1: "§G我們獲得§!："
 AST_dividing_the_pacific_tt2: "§R他們獲得§!："
 AST_dividing_the_pacific_tt3: "§Y[AST.GetName]§!移交以下控制的領土："
 AST_against_war_and_fascism: "反對戰爭與法西斯主義"
 AST_against_war_and_fascism_desc: "反戰反法西斯運動是共產國際發起、動員工人反抗反動勢力的國際努力之澳大利亞分支。儘管近年來已失勢頭，但再度高舉這面旗幟的責任落在了我們肩上。"
 AST_world_peace: "世界和平"
 AST_world_peace_desc: "反戰與反法西斯運動始終致力於出版一本名為《世界和平》的刊物，用以揭露德國與意大利法西斯運動的種種罪惡，尤其是在西班牙內戰期間所犯下的暴行。受這些文章所鼓舞，志願者們正紛紛踴躍投身於反抗法西斯的戰鬥之中。"
 AST_red_fred: "紅色弗雷德"
 AST_red_fred_desc: "“紅色”弗雷德·帕特森最初以共產主義運動候選人身份，於1934年競選布里斯班市長而嶄露頭角，結果慘敗。然而他的雄心未減，如今正競選湯斯維爾市議員。有了我們的支持，他或能成為首位當選公職的共產主義者。"
 AST_workers_defence_corps_sparks_anew: "工人防衛軍重燃火種"
 AST_workers_defence_corps_sparks_anew_desc: "工人防衛軍最初為保護糾察線和罷工而組建。隨著“新衛隊”等團體的侵犯日益加劇，它已被重組，為了爭取更好權利和機會而抗議的人們，而再次充當盾牌。"
 AST_a_controversial_recruitment: "頗具爭議的徵募"
 AST_a_controversial_recruitment_desc: "莫里斯·布萊克本，是一位著名的社會主義律師，以在法庭上對抗壓迫性僱主、捍衛工人權利而聞名。身為工黨成員，他因與更激進的反戰反法西斯運動有聯繫，其忠誠度已受質疑。"
 AST_from_picket_line_to_front_line: "從糾察線到前線"
 AST_from_picket_line_to_front_line_desc: "隨著反對工人階級解放者的恐嚇手段越發咄咄逼人，我們自身的防禦也必須相應加強。每發生一起事件，工人們就更堅定，越來越多的人站出來加入防衛軍。"
 AST_pig_iron_protests: "生鐵抗議"
 AST_pig_iron_protests_desc: "我們的碼頭工人在許多事務上不贊同其政府，尤其反對向交戰國出售生鐵。澳大利亞人無意參與侵略，或運輸用於傷害無辜平民的裝備，因此[AST.GetName]也絕不應如此；發動罷工吧。"
 AST_part_with_colonizer: "與殖民宗主決裂"
 AST_part_with_colonizer_desc: "我們苦難的根源在於大英帝國及其從遠方強加的資本主義制度。再也不能這樣下去了。趁不列顛被近在家門口的危機分散精力，現在正是掌握自身命運、開闢自由獨立國家之路的時候。"
 AST_take_it_to_the_streets: "走上街頭"
 AST_take_it_to_the_streets_desc: "產業行動是我們手中推動社會變革的最有力工具之一，我們必須用它來對付只為剝削而設計的制度。奪回生產資料的時候到了，澳大利亞工人們，團結起來！"
 AST_workers_educational_association: "工人教育協會"
 AST_workers_educational_association_desc: "工人教育協會是一個致力於讓勞動人民獲得教育機會的國際組織。我們應建立本國的分會，因為真正的機會平等始於課堂。"
 AST_off_leash: "解開束縛"
 AST_off_leash_desc: "碼頭工人是澳大利亞工會行動的脊梁。作為一個大陸般的島嶼，海事勞工在我國經濟中扮演如此關鍵的角色並不奇怪。是時候摘下項圈，解放該產業的老水手了。"
 AST_a_national_housing_commission: "國家住房委員會"
 AST_a_national_housing_commission_desc: "住房問題長期爭議不休。人人都應有遮頂之瓦，可這基本需求卻常被用來對付工人，其成本成了一種經濟壓迫。再也不能這樣。我們將要求讓所有人公平獲得住房。"
 AST_guaranteed_employment: "就業保障"
 AST_guaranteed_employment_desc: "社會主義常常被斥為助長需要幫助者的懶惰或依賴。這必須終結。我們追求的只是在工作中獲得公平的機會，以及能養家餬口的公平工資。"
 AST_equal_pay: "同工同酬"
 AST_equal_pay_desc: "一個持久的謬誤是，擁有生產資料者理應比在其中勞動的人獲得更多。企業主和管理者的辛勞不比工人多，也並非天生更有技能。通過均平工資，勞動的果實就能在全社會更公平地分配。"
 AST_all_for_one_one_for_all: "人人為我，我為人人"
 AST_all_for_one_one_for_all_desc: "“人人為我，我得更甚”早已是資產階級的戰鬥口號，其貪婪索求愈多，回報卻愈少。財富會向下流淌的承諾是個謊言。財富必須平等地共有、共享。"
 AST_abolition_of_private_property: "廢除私有制"
 AST_abolition_of_private_property_desc: "工業的齒輪以工人的鮮血潤滑。我們必須終結積累的暴行，徹底廢除私有財產。一切財產都將共有、共享，人們各盡所能，各取所需。"
 AST_centralized_production: "集中化生產"
 AST_centralized_production_desc: "市場力量混亂而不平等。要建設一個真正公平的社會，國家必須在決定生產什麼、由誰生產、在何處生產上發揮中心作用。我們的官僚機構保有詳盡的記錄，最有條件來制定生產配額。"
 AST_public_institutions: "公共機構"
 AST_public_institutions_desc: "社會的運轉需要許多基本服務，從醫療、住房到托兒和交通。國家必須普遍提供這些服務，確保人人不受限制地享有。擺脫了為私人盈利的強制，這些體系就能高效運轉，服務全體人民的需要。"
 AST_planned_extraction: "計劃性資源開採"
 AST_planned_extraction_desc: "我們有幸擁有一片資源如此豐富的土地。我們必須確保其財富被系統地開採，並導向最需要它們的產業。"
 AST_maritime_commission: "$USA_maritime_commission$"
 AST_maritime_commission_desc: "$USA_maritime_commission_desc$"
 AST_state_research_funding: "國家科研資助"
 AST_state_research_funding_desc: "為了最大限度發揮我們研究機構的效能，國家必須成為其主要資金來源，將努力引向最需要之處，並確保信息受到嚴格控制。畢竟，我們不能冒險讓公民被錯誤的思想所困擾。"
 AST_graziers_to_industry: "從牧民到工人"
 AST_graziers_to_industry_desc: "大蕭條期間，我們的城市人口外流，工人去鄉村尋求安穩。如今，掌控了生產資料，我們能把他們拉回工業。我們必須讓他們明白國家之需：工業的熔爐必須靠人的汗水來餵養。"
 AST_free_school_policy: "免費教育政策"
 AST_free_school_policy_desc: "要塑造模範公民，就必須塑造其思想。從搖籃到大學，國家將引導我們的孩子接受怎樣的教育。由此，我們就能確保後代懂得社會主義理想的重要性，以及自由市場……和自由思想的危險。"
 AST_free_healthcare_policy: "免費醫療政策"
 AST_free_healthcare_policy_desc: "我們的人民理應免於疾病和傷害，而萬一不幸發生，他們也不應像在其他社會那樣因厄運而淪落赤貧。我們將提供普遍享有的醫療、醫院和醫生——因為健康的人民才是生產力充沛的人民。"
 AST_the_publics_australia: "公眾的澳大利亞"
 AST_the_publics_australia_desc: "我們已拋棄舊秩序，建成了一個為多數人而非少數人存在的國家。工業、勞動和資源如今服務於全體人民。這就是人民的澳大利亞。平等、團結、牢不可破。"
 # 'Cominwealth' over 'Commonwealth' is intentional
 AST_the_australian_commonwealth: "澳大利亞聯邦"
 AST_the_australian_commonwealth_desc: "不列顛曾聲稱在英聯邦擁有領導地位，但其願景已遭資本主義利益腐化。我們將奪取這一角色，引領各國走向共同的社會主義烏托邦。"
 AST_union_control_commonwealth: "解鎖§Y工會控制§!決議。\n允許在新西蘭、馬來西亞、緬甸以及最終在印度進行共產主義滲透。"
 AST_a_comrade_emancipated: "解放的同志"
 AST_a_comrade_emancipated_desc: "放眼世界，許多國家仍被資本主義的鎖鏈束縛，他們的人民得不到真正的自由。作為一個自由的社會主義國家，援助他們解放是我們的義務。全世界的工人們，團結起來，我們將一同掙脫這些鎖鏈。"
 AST_union_control_local: "解鎖§Y工會控制§!決議。\n允許在印度尼西亞和菲律賓進行共產主義滲透。"
 AST_comintern: "加入共產國際"
 AST_comintern_desc: "儘管他們偶爾會背離真正的馬克思主義原則，但蘇聯仍是工人國際的旗手。通過加入共產國際，我們能聯合起來，將社會主義的火炬傳遍世界。"
 AST_comintern_tt: "如果§Y[AST.GetName]§!領導一個陣營，它將與共產國際合併。否則，§Y[AST.GetName]§!將獨自加入共產國際。"
 AST_for_greater_good: "為了更偉大的利益"
 AST_for_greater_good_desc: "我們的世界革命願景需要鮮血與犧牲。在太多地方，社會主義的火炬搖曳不定；我們必須響應召喚，給予支持，以確保它不會熄滅。畢竟，這是為了更偉大的利益（眾人合誦：更偉大的利益）。"
 AST_make_common_cause: "結成共同事業"
 AST_make_common_cause_desc: "在社會主義之光的指引下，聯邦在我們的領導下已走出資本主義壓迫的黑暗，開始走向繁榮。值此關鍵時刻，我們必須確保我們的意志不被摧毀，並肩向更美好的明天邁進。"
 AST_the_red_pacific: "紅色太平洋"
 AST_the_red_pacific_desc: "太平洋必須按照革命的面貌重塑。在區域內的島嶼和海岸，我們將支持社會主義政府的崛起，確保紅旗從一個海岸飄揚到另一個海岸。"
 AST_the_irish_anti-britain_pact: "愛爾蘭反英協定"
 AST_the_irish_anti-britain_pact_desc: "英國憑藉其島國位置和海軍力量，充當資本主義堡壘太久了。通過在愛爾蘭和北愛爾蘭的碼頭工人中煽動騷亂，我們可以突破其防禦，為我們跨越愛爾蘭海開闢一條通道。"
 AST_stretch_the_fleet: "擴充艦隊"
 AST_stretch_the_fleet_desc: "英國仍以其強大艦隊為護盾，充當資本主義的堡壘。是時候加強我們自己的海軍實力，主動向他們出擊，告訴世界哪個島更大。"
 AST_chinese_relations: "與中國的關係"
 AST_chinese_relations_desc: "我們在中國的同志們正在為生存而奮鬥。我們有能力援助他們，但必須迅速行動，以免他們被帝國主義勢力所壓倒。"
 AST_westward_battles: "西進作戰"
 AST_westward_battles_desc: "法西斯勢力主宰著西方，威脅著我們生存的根本。如今與共產國際結盟，我們必須主動向他們出擊，挺身面對那些企圖摧毀我們正在建設的工人烏托邦的勢力。"
 AST_strongholds: "要塞"
 AST_strongholds_desc: "為了鞏固我們在這一新戰區的地位，我們必須支持愛爾蘭的同志們，對抗資本主義帝國主義的核心。在我們共同為全球衝突的下一階段做準備之際，他們早期爭取獨立的鬥爭已經為我們提供了寶貴的經驗與啟示。"
 AST_out_of_the_den: "走出巢穴"
 AST_out_of_the_den_desc: "愛爾蘭仍有許多人對英國統治深懷怨恨。是時候展示我們的力量，吸引他們走出陰影，集結到我們共同對抗宿敵的事業中來。"
 AST_end_the_kingdom: "終結王國"
 AST_end_the_kingdom_desc: "時刻已到。帝國主義資本主義的根源將被刺入其腐爛的心臟。整個大英帝國工人的解放近在眼前。終結君主制。終結王國。終結壓迫。英聯邦的工人們，團結起來！"
 AST_red_solidarity: "紅色團結"
 AST_red_solidarity_desc: "中國的鬥爭仍在肆虐，數以百萬計的人在受苦和死去。他們的戰鬥就是我們的戰鬥，我們不能袖手旁觀。我們可以進行干預，分擔他們的重擔，確保革命的火焰不會黯淡。"
 AST_red_solidarity_tt: "§Y[AST.GetName]§!加入§Y[PRC.GetNameDef]§!針對§Y[CHI.GetNameDef]§!的戰爭。較小的陣營將被另一方吸收，如果雙方已結盟，§Y[AST.GetName]§!直接加入戰爭。"
 AST_free_the_colonies: "解放殖民地"
 AST_free_the_colonies_desc: "革命的烈火燒穿了分崩離析的大英帝國。殖民地將不再是殖民地，而是自由的國家。起來，同志們！掙脫你們的枷鎖，加入革命！"
 AST_free_the_colonies_tt: "§Y[AST.GetName]§!將其控制的所有前英國殖民地降級為半吞併傀儡國。"
 AST_battle_of_the_ocean: "海洋之戰"
 AST_battle_of_the_ocean_desc: "海洋長久以來是全球貿易的大動脈。如今，是時候將戰鬥引向太平洋，並切斷它所維繫的那個體系。海水將被腐朽資本家和革命英雄的鮮血一同染紅。"
 AST_borderless_solidarity: "無國界的團結"
 AST_borderless_solidarity_desc: "團結。這個詞將全世界的工人聯結在一起。沒有邊界能將我們劃分，沒有國家能獨自屹立。無論鬥爭在何處燃燒，我們都會回應召喚，在全球解放鬥爭中並肩而立。"
 AST_an_equal_union: "平等聯盟"
 AST_an_equal_union_desc: "雖然我們扛著革命的旗幟，但所有加入我們的都會得到平等對待。在這個聯合體中，資源、勞動和思想自由分享，共同締造一個集體繁榮、任何國家都不凌駕於他國之上的未來。"
 AST_expanding_influence: "擴大影響力"
 AST_expanding_influence_desc: "站在歷史正確的一邊，我們的思想不言自明。工人天堂的承諾不是夢幻，而是正在鑄就的現實。我們可以將這個願景向外延伸，邀請他人加入我們建設共同的未來。"
 AST_public_works: "公共工程"
 AST_public_works_desc: "大蕭條使澳大利亞經濟陷入嚴重困境。我們將啟動一系列公共工程計劃，讓人們重返工作崗位，恢復消費支出。"
 AST_lang_plan: "傑克·蘭計劃"
 AST_lang_plan_desc: "傑克·蘭認為應拒絕履行外債義務，轉而將這些資金用於旨在刺激國內增長的公共計劃，從而站到了經濟政治的前沿。畢竟，你不能從石頭上榨出血來。"
 AST_exports_for_economic_recovery: "經濟復甦的出口"
 AST_exports_for_economic_recovery_desc: "蘭的反對者則提議利用外國市場和債務來鼓勵海外投資和銷售，致力於出口導向型經濟，以促進國內生產、就業，並最終刺激消費支出。"
 AST_the_phosphate_commision: "磷酸鹽委員會"
 AST_the_phosphate_commision_desc: "大戰結束後，瑙魯被置於澳大利亞、新西蘭和英國的聯合託管之下。1919年，島上所有磷酸鹽銷售的權利被移交給以澳大利亞為首的這些託管國。利用我們的領導地位，我們可以影響定價，併為我們的國內市場爭取到極具競爭力的價格。"
 AST_goods_standard: "貨物標準"
 AST_goods_standard_desc: "傑克·蘭經濟理論的一個核心原則是在澳大利亞廢除金本位，代之以商品本位，將貨幣供應與實際生產的商品數量掛鉤。這確保了資本流動與國內生產力直接相關，而非外部因素。"
 AST_standard_gauge_line_to_darwin: "通往達爾文的準軌鐵路"
 AST_standard_gauge_line_to_darwin_desc: "長期以來，我們與北部領土缺乏正常的交通路線。作為旨在將資金迴流到經濟的更廣泛的公共工程計劃的一部分，我們可以修建一條連接我們南部城市與北部的鐵路。"
 AST_lang_is_right: "傑克·蘭沒錯"
 AST_lang_is_right_desc: "事實證明蘭是對的！通過拒絕優先考慮外國債權人，而是更積極地利用我們自己的銀行體系，我們可以釋放大量資金。然後，這些資金可以投向國內經濟，提供急需的投資並刺激增長。"
 AST_within_reach: "觸手可及"
 AST_within_reach_desc: "近在咫尺，卻又遙不可及。澳大利亞是一個資源極其豐富的國家，只要我們挖得更深一點，我們腳下就蘊藏著無盡的財富。基礎設施的擴展拉近了遙遠礦井的距離，一個由礦產財富驅動的澳大利亞繁榮時代就在眼前。"
 AST_a_domestic_supply_chain: "國內供應鏈"
 AST_a_domestic_supply_chain_desc: "我們對國內經濟的關注產生的一個副作用是形成了一個異常有韌性的生產體系。由於所有生產環節都在國內，我們在很大程度上不受外部衝擊的影響。"
 AST_broken_hill_propietary_company: "布羅肯希爾控股公司"
 AST_broken_hill_propietary_company_desc: "布羅肯希爾控股公司是澳大利亞首屈一指的礦業與鋼鐵生產商，被當地人稱為“澳洲巨人”，主導著整個行業。隨著原材料需求的急劇增長，該公司已做好準備迎接更迅猛的發展。"
 AST_radium_hill: "開發鐳錠山"
 AST_radium_hill_desc: "在南澳大利亞發現了鈾礦，鐳迪厄姆山礦井具有巨大的擴展潛力。雖然我們仍在探索這些新興技術的全部可能性，但很明顯，我們正站在原子時代的門檻上，這可能是我們進入原子時代的入口。"
 AST_industrial_expansion: "工業擴張"
 AST_industrial_expansion_desc: "大蕭條在過去十年的大部分時間裡嚴重削弱了我們國家的經濟產出。現在我們有了採取更直接行動的政治意願，我們應該將其投入到對工業基礎的大膽擴張中，創造就業機會，增加對資源的需求，併為市場生產更多商品。"
 AST_income_tax_assessment_act: "所得稅評估法案"
 AST_income_tax_assessment_act_desc: "我們的稅收體系狀況不佳，人們難以操作，需要我們所負擔不起的嚴厲政府監管。通過改革和簡化相關規定，我們可以顯著提高稅收徵收效率。"
 AST_council_for_scientific_and_industrial_research: "科學與工業研究委員會"
 AST_council_for_scientific_and_industrial_research_desc: "1923年帝國會議後，科學與工業研究理事會得到了加強，以幫助拓寬各個殖民地和自治領的經濟基礎。雖然它做出了重大貢獻，但現在是時候讓該機構聚焦於一個新的重點：製造業和第二產業。"
 AST_bring_home_the_farmers: "讓農民迴歸家園"
 AST_bring_home_the_farmers_desc: "在大蕭條期間，工人前往農村尋找農業勞動機會，我們的大城市人口嚴重減少。現在情況開始好轉，我們應該激勵勞動力迴流，以便工廠能恢復運轉和生產。"
 AST_reverse_wage_cuts: "撤銷工資削減"
 AST_reverse_wage_cuts_desc: "為了給企業一個競爭的機會，我們實施了一系列全經濟範圍的降薪。現在我們看到了復甦的跡象，就應該逆轉方向。工資上漲能帶來更強的消費能力，有助於推動消費和經濟增長。"
 AST_the_manpower_directorate: "人力資源理事會"
 AST_the_manpower_directorate_desc: "隨著我們的經濟變得越來越複雜，我們面臨著日益嚴重的人力挑戰。這個理事會將確保合適的人，在合適的時間，擁有合適的技能，被安置在合適的崗位上。"
 AST_recovery: "恢復"
 AST_recovery_desc: "我們的國內生產總值首次超過了蕭條前的水平。這是一個值得慶祝的時刻，因為我們的經濟現在唯一的軌跡是向上。我們正在進入一個強勁增長的時期，是時候收穫我們新繁榮的回報了。"
 AST_devalued_currency: "貶值貨幣"
 AST_devalued_currency_desc: "增加出口最有效的方法之一是使貨幣貶值。如果外國買家因為他們的錢更有價值而能購買更多我們的商品，我們在國際上就會變得更具競爭力。然而，這是一把雙刃劍，因為來自其他國家的進口商品也會變得更貴。"
 AST_reverse_industry_tariffs: "取消工業關稅"
 AST_reverse_industry_tariffs_desc: "過去，我們用關稅來保護國內產業免受外國競爭。然而，這導致了貿易戰和對我們出口商品的報復性關稅，抬高了價格。我們應該減少這些壁壘，並鼓勵對等削減，以幫助擴大貿易。"
 AST_foreign_competition: "外國競爭"
 AST_foreign_competition_desc: "競爭對商業有益；它鼓勵創新和效率，同時消除自滿。外面是一個狗咬狗的世界，我們需要確保我們的狗是最大的，並且我們已經解開了它的項圈，讓它完全自由地去競爭。"
 AST_expanding_into_new_markets: "開拓新市場"
 AST_expanding_into_new_markets_desc: "依賴外國市場而非國內市場的優勢很簡單。全球市場是廣闊的。總有新的市場可以開拓；我們只需要找到我們的優勢，並證明澳大利亞商品和商業實踐的優越性。"
 AST_populate_or_perish: "繁衍或者滅亡"
 AST_populate_or_perish_desc: "大蕭條襲來時，出生率急劇下降，此後一直難以恢復。為了持續推動國內發展，我們將設立聯邦移民部，開展並監督新的移民計劃。"
 AST_recruitment_drive: "徵兵運動"
 AST_recruitment_drive_desc: "歷屆政府的軟弱意志，加上對英國的過度依賴，導致了澳大利亞武裝力量長年廢弛。這種情況不能再繼續下去，我們將發起動員，推動適齡人口加入澳大利亞國防軍。"
 AST_new_deal: "新政"
 AST_new_deal_desc: "在[AST.GetName]150週年慶典期間發生的抗議，清楚地表明我們關於原住民的法律必須重新考量。應原住民權利活動家的請求，我們將與他們見面，共同確定一條通向原住民完整公民權的道路。"
 AST_the_1938_sesquicentenary_flag: "§Y1938年一百五十週年紀念§!事件已觸發。"
 AST_the_1938_sesquicentenary_tt: "§Y繁衍或者滅亡分支§!的“§Y新政§!”國策將開放。"
 AST_repeal_immigration_restrictions: "取消移民限制"
 AST_repeal_immigration_restrictions_desc: "移民部受困於過時的法律，這些法律決定了誰被允許移民到[AST.GetName]。儘管有引發爭議的風險，我們將廢除這些法律，代之以配額制度來控制移民流入。"
 AST_womens_armed_services: "婦女服役"
 AST_womens_armed_services_desc: "儘管遭遇激烈反對，婦女服役仍將繼續推進。無論性別，每一雙援手都將受到歡迎，以保衛[AST.GetName]抵禦侵略者。為激勵徵兵與訓練，部隊官員的人選至關重要。"
 AST_northern_territory_reconnaissance_unit: "北領地偵察部隊"
 AST_northern_territory_reconnaissance_unit_desc: "空軍中尉兼人類學家唐納德·湯姆森一直主張將原住民納入[AST.GetName]的武裝部隊，如今終獲採納。我們將親自委託湯姆森組建一支偵察分隊，徵召具備當地知識與叢林技能的士兵，以監視我國最偏遠荒涼之地。"
 AST_northern_territory_reconnaissance_unit_tt: "解鎖支援連§Y北領地偵察部隊§!。"
 AST_torres_strait_battalion: "托雷斯海峽營"
 AST_torres_strait_battalion_desc: "托雷斯海峽連隊作為守備部隊的表現一直可圈可點，但其麾下將士仍有更上一層樓的潛力。鑑於該部隊成員多出身於[AST.GetName]北海岸外的島嶼，他們對托雷斯海峽的地理環境瞭如指掌。我們應當將這些士兵訓練為海軍陸戰隊，並號召更多志願者加入，從而組建一個完整的營級單位。"
 AST_department_of_aboriginal_affairs: "原住民事務部"
 AST_department_of_aboriginal_affairs_desc: "我們將採納原住民權利活動團體的建議，設立一個新的原住民事務部。該部將由一個原住民傳統委員會提供諮詢，其目標在於確保原住民群體獲得適當的食物與醫療援助。"
 AST_immediate_rights: "立即賦予權利"
 AST_immediate_rights_desc: "[AST.GetName]內任何人口群體均不受聯邦管制，任何傳統也不得限制公民權利的授予。通過制定我們自己的公民法案，並擺脫我國人口僅系英國臣民的概念，澳大利亞人的權利將不再是有條件的。"
 AST_diverse_army: "多元化軍隊"
 AST_diverse_army_desc: "保衛國家的行為不僅是特權，更是權利。每一位自願的澳大利亞人都應能參軍入伍，每一位有抱負的士兵都應能在行伍中晉升。"
