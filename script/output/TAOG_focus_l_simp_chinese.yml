 HOL_taog_guarantee_colonial_loyalty: "保證殖民地忠誠"
 HOL_taog_guarantee_colonial_loyalty_desc: "東印度的民族主義高漲，顯然又一場革命正在醞釀。雖然我們在1927年面對的那場革命被輕易鎮壓，但情報顯示，這次我們面對的或許是準備充分得多的革命者。如果我們對蘇塔爾喬的和平民族主義運動作些讓步，或許能將平民的注意力從革命引向蘇塔爾喬？"
 HOL_taog_guarantee_colonial_loyalty_tt: "§W確保[INS.GetNameDef]不會發生革命。§!\n[INS.GetNameDefCap]將試圖和平宣佈獨立。可以通過§Y$INSHOL_industrialized_colony$§!國策來阻止，這需要在殖民地投入大量資金。"
