 idea_SIA_weather_broadcasts_desc: "定期天氣廣播使我空軍與海軍能更清晰地掌握氣象狀況，從而提升其作戰效能，並降低在惡劣天氣下行動的風險。"
 idea_SIA_seri_thai_contacts: "自由泰國運動聯絡"
 idea_SIA_seri_thai_contacts_desc: "與抵抗組織自由泰人運動網絡建立的聯繫正體現出其價值，為我們帶來了經驗豐富的戰士，並加強了與同盟國的關係。"
 idea_SIA_secure_rubber_islands: "控制橡膠群島"
 idea_SIA_joint_military_command: "聯合軍事指揮部"
 idea_SIA_joint_military_command_desc: "統一的指揮架構改善了各軍種間的協調，加速了經驗豐富的軍官培養與戰場理論的發展。"
