 ###########################
 # Root
 ABDA_abdacom: "建立美英荷澳司令部"
 ABDA_abdacom_desc: "隨著敵對勢力在東南亞和太平洋地區迅速推進，該地區的盟軍必須作為一個整體行動以阻止他們。通過建立一個聯合最高指揮部，我們可以整合資源，協調海軍資產，並形成統一戰線對抗敵人。"
 # Tier 1 - country-locked
 ABDA_fortress_singapore: "新加坡要塞"
 ABDA_fortress_singapore_desc: "新加坡是我們在該地區防禦戰略的關鍵。加強其防禦工事並部署重兵把守，將為美英荷澳司令部的更大規模的行動爭取關鍵時間，並阻止敵人取得快速的戰略勝利。"
 ABDA_corps_expeditionnaire: "法國遠東遠征軍"
 ABDA_corps_expeditionnaire_desc: "法屬印度支那位於美英荷澳聯合司令部防禦圈的北翼。通過派遣遠征軍積極參與作戰行動，[FRA.GetNameDef]將為其殖民部隊提供至關重要的人力資源和作戰經驗，以此支援聯合司令部的整體力量。"
 ABDA_maintain_strategic_flexibility: "保持戰略靈活性"
 ABDA_maintain_strategic_flexibility_desc: "美國絕不能將其兵力過度投入任何單一戰區。通過謹慎管理我們的戰略儲備，我們可確保美國的工業與軍事力量能在太平洋上任何最需要的地方發揮效能。"
 # Tier 2
 ABDA_the_malay_barrier: "馬來屏障"
 ABDA_the_malay_barrier_desc: "從馬來亞經[INS.GetNonIdeologyName]延伸的一系列島嶼形成了一道天然防禦屏障。美英荷澳司令部的部隊必須利用這一地理條件，建立協調的海陸防禦以遲滯敵軍推進。"
 ABDA_develop_naval_infrastructure: "發展海軍基建"
 ABDA_develop_naval_infrastructure_desc: "太平洋上的持續海軍行動需要基地、燃料庫和維修設施。投資於我們的港口和錨地基礎設施，將延伸美英荷澳司令部的海軍的活動範圍和續航能力。"
 # Tier 3
 ABDA_unified_naval_command: "統一海軍指揮"
 ABDA_unified_naval_command_desc: "在陸地防禦已建立、基礎設施就位的情況下，美英荷澳司令部現在可將所有海軍力量統一於一個指揮之下。標準化的信號、共享的情報以及協調的巡邏路線，將成倍增強戰區每一艘艦艇的效能。"
 # Tier 4
 ABDA_ship_a_day_sinking_quotas: "每日擊沉指標"
 ABDA_ship_a_day_sinking_quotas_desc: "橫跨太平洋的敵方補給線是其戰略弱點。通過為我們的潛艇和水面艦隊設定積極且協調的擊沉噸位指標，美英荷澳司令部可在後勤上拖垮敵人，迫使他們轉入防禦。"
 ABDA_naval_procurement: "海軍採購"
 ABDA_naval_procurement_desc: "已遭受的損失迫切需要補充。美英荷澳司令部的協調採購計劃將優先建造最適合太平洋戰區的驅逐艦、潛艇和巡邏艦，確保我們的聯合艦隊能與敵人的擴張相匹敵。"
 ABDA_keep_trade_open: "保持貿易暢通"
 ABDA_keep_trade_open_desc: "[INS.GetNonIdeologyName]的橡膠和石油對同盟國的戰爭努力至關重要。美英荷澳司令部必須保衛承載這些重要資源的海上通道，保護護航船隊免遭敵人攔截，保持貿易暢通，流向我們的工業。"
 # Tier 5 - capstone
 ABDA_expand_the_command: "擴大司令部"
 ABDA_expand_the_command_desc: "美英荷澳司令部已證明了其價值。現在我們必須在此基礎上再接再厲，將成員資格擴展至同盟國內該地區的其他國家，並深化我們的研究與情報共享，以領先於敵人。"
