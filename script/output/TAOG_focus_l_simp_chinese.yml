 AST_australian_military_forces: "澳大利亞軍事力量"
 AST_australian_military_forces_desc: "在世界大戰的烈火中淬鍊，澳大利亞軍隊在遙遠的異國海岸證明了其勇氣，在一戰中最殘酷的一些戰役中屹立不倒。此後的歲月裡，軍隊規模縮小，並重組為一支防禦力量，主要任務是保衛本土島嶼。過去艱難贏得的經驗教訓得以留存，隨時準備再次被徵調。"
 AST_permanant_military_forces: "常備軍事力量"
 AST_permanant_military_forces_desc: "澳大利亞的主要軍事力量是民兵，其任務為保衛本土。然而，在全球緊張局勢升溫之際，建立一支由職業軍官與士兵組成的骨幹隊伍是審慎之舉，他們中許多人曾在上個大戰中積累經驗。即便最初以預備役身份服役，這支部隊也能提供常備性與標準化的訓練水平。"
 AST_invoke_the_1903_defence_act: "援引1903年國防法"
 AST_invoke_the_1903_defence_act_desc: "傳統上，澳大利亞依賴其民兵進行國防。但在面臨重大威脅時，我們可以援引《1903年國防法案》。這使我們能夠為防禦目的徵召額外人力。"
 AST_lithgow_small_arms_factory: "利特高輕武器廠"
 AST_lithgow_small_arms_factory_desc: "利思戈輕武器工廠成立於1912年，旨在戰時減少對英國製造武器與裝備的依賴。隨著全球緊張局勢再度升高，我們應擴大生產以滿足武裝部隊日益增長的需求。"
 AST_dingo_scout_car: "丁戈偵察車"
 AST_dingo_scout_car_desc: "澳大利亞並無深厚的裝甲車輛研發傳統，但我軍對此領域增援的呼聲日益高漲。因此，我們應更積極地採用本土設計，例如丁戈偵察車。"
 AST_volunteer_defence_corps_taog: "志願防衛部隊"
 AST_volunteer_defence_corps_taog_desc: "志願防衛部隊作為一支類似於英國本土防衛軍的部隊組建，是由不符合常規服役條件者組成的無薪公民民兵。儘管有此侷限，他們熟悉當地地形，若最壞情況發生，極適合開展游擊戰。"
 AST_war_carriers: "戰地勞工"
 AST_war_carriers_desc: "後勤決定戰爭勝負，而澳大利亞部隊作戰的許多地形極不適合卡車或火車等常規運輸。相反，我們應依賴當地人力，他們適應環境，熟悉隱秘的小路與捷徑。"
 AST_anzac_spirit: "澳新軍團之魂"
 AST_anzac_spirit_desc: "澳新軍團在一戰期間贏得了赫赫威名，為帝國的勝利付出了巨大努力與大量鮮血。其品質有目共睹：堅韌、勇敢、機智與風趣——併兼有面對危險與困苦時頑強的反抗精神。"
 AST_lee_enfield_no1_mark3: "李-恩菲爾德 No.1 Mk III*"
 AST_lee_enfield_no1_mark3_desc: "那枚小星至關重要——李-恩菲爾德 No.1 Mk III*步槍標誌著為更快、更廉價生產而進行的戰時修改。當需求甚至超過這些改進時，我們必須採用“分散分包方案”，由較小企業生產零部件，在利思戈組裝以提升產量。"
 AST_new_south_wales_government_railways: "新南威爾士國營鐵路"
 AST_new_south_wales_government_railways_desc: "新南威爾士政府鐵路工坊提供了一項獨特能力：以單件鑄造大型鋼構件。作為少數能夠生產全鑄造坦克車體與炮塔的英聯邦國家之一，我們應善加利用這一能力。"
 AST_second_australian_imperial_force: "澳大利亞第二帝國軍"
 AST_second_australian_imperial_force_desc: "澳大利亞在上個大戰期間部署了第一澳大利亞帝國部隊，派兵海外作戰。隨著戰爭再次威脅吞噬世界，我們應組建第二帝國部隊，在海外彰顯澳大利亞的實力。"
 AST_expeditionary_leader: "該§Y陸軍將軍§!將獲得§Y遠征領袖§!特質，提升其海外作戰能力，但會限制其可指揮的陸軍師數量。"
 AST_expeditionary_leader_plural: "兩名§Y陸軍將領§!都將獲得§Y遠征軍領袖§!特質，該特質能提升他們在海外的能力，但會限制他們指揮的陸軍師數量。"
 AST_larrikinism: "“兵痞”精神"
 AST_larrikinism_desc: "“兵痞”精神，過去被定義為“缺乏教養、愛惹事但心地善良”，現已成為澳大利亞文化的象徵；粗獷的耐力，對權威的不敬，以及面對危險時風趣的反抗。澳大利亞士兵在上個大戰中因堅強面對困苦並泰然處之而聲名遠播。"
 AST_diggers: "礦工"
 AST_diggers_desc: "“挖，挖，挖，直到安全為止”，這是澳新軍團在加里波利登陸時給威廉·伯德伍德將軍的命令，此言已成為澳大利亞作戰方式的代名詞。然而，“挖地漢”精神更深的含義在於，通過“夥伴情誼”——為並肩作戰、為相互扶持的戰友而產生的不滅之紐帶——將澳大利亞和新西蘭士兵緊緊相連。"
 AST_owen_gun: "歐文衝鋒槍"
 AST_owen_gun_desc: "創新且本土製造的歐文衝鋒槍，以其粗獷耐用贏得了聲譽，恰如我們的士兵。當我軍在世界各地作戰時，我們應將此武器不僅作為澳大利亞創造與設計的象徵，更作為我們戰爭精神本身的象徵來採用。"
 AST_department_of_supply_and_development_taog: "供應和發展部"
 AST_department_of_supply_and_development_taog_desc: "隨著戰爭需求將我們的生產與後勤系統推向極限，我們必須將各項工作集中於一個專門機構之下，負責協調與維持這些系統。"
 AST_sentinel_tank_development: "哨兵式坦克研發"
 AST_sentinel_tank_development_desc: "歷史上，我們依賴進口的坦克設計，即使在國產化時亦然。我們應基於從這些機器中汲取的經驗教訓，融入澳大利亞的創新，開發我們自己的坦克，一種為我們的能力與資源量身定做的坦克。"
 AST_establish_training_camps: "建立訓練營"
 AST_establish_training_camps_desc: "如同上個大戰，第二帝國部隊可能被召喚到世界各地作戰。因此，我們必須制定全面的訓練計劃，使我軍士兵適應任何環境，從北非沙漠到南太平洋叢林。"
 AST_jungle_tanks_if_sentinel_tank_development: "如果我們已完成“哨兵式坦克研發”："
 jungle_heavy_tanks: "叢林重型坦克"
 AST_anti_malaria_campaign: "抗瘧疾運動"
 AST_anti_malaria_campaign_desc: "我們所在的部隊或許需要在太平洋的叢林地帶作戰，而那裡存在著一個比敵人子彈更為致命的威脅——瘧疾。面對這一無形的敵人，我們必須採取果斷措施，全力保護我們的部隊免受其侵害。"
 AST_defence_citizen_military_forces_act: "公民防衛軍法案"
 AST_defence_citizen_military_forces_act_desc: "到目前為止，只有職業志願士兵才能被部署到海外。隨著衝突繼續升級，我們必須建立法律框架，允許在必要時將民兵部隊派遣出國。"
 AST_call_that_a_knife: "沒啥事兒！"
 AST_call_that_a_knife_desc: "“那也算刀？這才叫刀子！”些許豪情與風趣足以振奮軍心。我們的士兵直面險境時自信果敢、堅韌不屈，更自帶十足的氣魄。"
 AST_army_inventions_directorate_taog: "軍事發明理事會"
 AST_army_inventions_directorate_taog_desc: "戰爭若還有少許好處可言，其中之一便是需求驅動的急速技術創新。我們應成立一個集中化組織，以開發、改進和利用這些突破。"
 AST_yeramba: "耶蘭巴自行火炮"
 AST_yeramba_desc: "在“哨兵”等澳大利亞自研車輛成功的基礎上，我們又邁出了一步，推出了耶蘭巴自行火炮，這是我軍的一款威力強大的新裝備。一門架設在坦克底盤上的25磅炮，能向敵人傾瀉機動而毀滅性的火力。"
 AST_alice_springs: "艾麗斯斯普林斯號"
 AST_alice_springs_desc: "內陸非常遼闊……真的非常遼闊。其中心坐落著愛麗斯泉小城，可作為全澳作戰的中央後勤樞紐。我們應加以開發，並建立軍事基地，訓練能適應任何環境的部隊。"
 AST_australian_regular_army: "澳大利亞正規軍"
 AST_australian_regular_army_desc: "從加里波利海灘，到北非沙漠、希臘山地和東南亞叢林，我們汲取了無數經驗。這些來之不易的經歷，鑄就了一支比任何軍隊都更靈活、更適應環境的軍隊。"
 AST_no1_flying_training_school: "第一飛行訓練學校"
 AST_no1_flying_training_school_desc: "飛行訓練學校於1921年隨澳大利亞皇家空軍成立而設立，隨著對空勤人員的需求波動時開時關。隨著全球緊張局勢升溫，我們應重新將其開放，以訓練新一代飛行員與空勤人員。"
 AST_empire_air_training_scheme_taog: "帝國空軍訓練計劃"
 AST_empire_air_training_scheme_taog_desc: "英聯邦空軍訓練計劃為一英聯邦國家提供大量資金與專業支持，以訓練大批飛行員與空勤人員。對其主辦權的競爭十分激烈，澳大利亞與加拿大是主要競爭者。我們已在帝國空軍訓練方案框架下提交了自己的方案。"
 AST_volunteer_air_corps: "志願防空觀測部隊"
 AST_volunteer_air_corps_desc: "澳大利亞空域極其遼闊，遠非單靠官方部隊所能覆蓋。我們應依託當地志願兵，遍佈全國的數千個觀察哨所將監視我們的天空。"
 AST_improved_ground_crews: "訓練地勤班組"
 AST_improved_ground_crews_desc: "每一位飛行員背後，都需要一整個地勤團隊來確保飛機妥善維護、飛行協調與基地運作。更不用說在空中陪伴他們的領航員、機槍手與轟炸機手。我們必須建立適當的訓練設施，確保空軍以最高效率運作。"
 AST_advanced_pilot_training: "高級飛行員培訓"
 AST_advanced_pilot_training_desc: "隨著飛機變得更復雜、更快、更先進，我軍飛行員的技能也必須相應提高，以充分利用這些技術。"
 AST_advanced_pilot_training_tt: "§Y空軍學說§!的精通度獲得速度§G+10%§!"
 AST_commonwealth_aircraft_corporation_taog: "聯邦飛機公司"
 AST_commonwealth_aircraft_corporation_taog_desc: "隨著全球對空戰的興趣日增，我們必須確保不落後於人。民間愛好者與創新者們已開始看到航空工業的潛力；通過向他們提供初始資金，我們可以培育並加強這一新興行業。"
 AST_reestablish_central_flying_school: "重建中央飛行學校"
 AST_reestablish_central_flying_school_desc: "另一所飛行學校，與第一飛行訓練學校並行運作的中央飛行學校，將有助於滿足一支現代化空軍日益增長的需求。隨著緊張局勢升級，我們必須確保空勤人員擁有他們所需的設施。"
 AST_aerodrome_of_democracy_democracy: "民主的機場"
 AST_aerodrome_of_democracy_fascism: "主宰的機場"
 AST_aerodrome_of_democracy_communism: "解放的機場"
 AST_aerodrome_of_democracy_neutrality: "力量的機場"
 AST_aerodrome_of_democracy: "[GET_AERODOME_NAME]"
 AST_aerodrome_of_democracy_desc: "已將前沿航空能力握於手中，澳大利亞空軍贏得了“[GET_AERODOME_NAME]”之名。我們的飛行員在全球展開空戰，而我們的轟炸機將死亡的陰影籠罩在敵人的工業設施之上。"
 AST_government_aircraft_factories: "政府飛機工廠"
 AST_government_aircraft_factories_desc: "由於遠離歐洲，戰時我們無法依賴傳統的飛機供應來源。因此，發展本土製造能力至關重要，使我們能按自身需求製造飛機機體與發動機。"
 AST_death_from_down_under_taog: "來自南半球的致命打擊"
 AST_death_from_down_under_taog_desc: "從南半球的盡頭，我們鍛造出了一支無可匹敵的空軍。我們的戰機遍佈全球，以精準而毀滅性的力量施展打擊，敵人無論藏身何處，死亡都將從澳大利亞降臨。"
 AST_ride_the_lightning: "風馳電掣"
 AST_ride_the_lightning_desc: "我們的戰鬥機飛行員是空中力量的矛頭；迅捷、凌厲、百折不撓。他們駕著閃電投身戰鬥，奪取天空的制空權，攔截敵機，並確保我軍所至之處，空中優勢緊隨其後。"
 AST_the_gathering_storm: "風暴將至"
 AST_the_gathering_storm_desc: "地平線上正聚集著風暴。我們日益壯大的空中力量帶來了與日俱增的來自空中的壓力，在敵人最薄弱之處打擊，支撐我軍的推進。始於遠方的低吼，即將迸裂為一場無休止的毀滅風暴。"
 AST_hear_the_thunder: "且聽雷鳴"
 AST_hear_the_thunder_desc: "你可聽見，你可聽見那雷鳴？從南方大地，我們的戰略轟炸機將澳大利亞的力量帶往全球。當天穹咆哮、大地震顫之時，我們的敵人終將明白：風暴已至，它帶來的只有毀滅。"
 AST_department_of_aircraft_production: "飛機生產部"
 AST_department_of_aircraft_production_desc: "澳大利亞皇家空軍的極速擴張，給我們的生產能力帶來了沉重壓力。我們必須拿出更大的雄心，擴張並協調工業基礎以滿足需求，確保我們能讓自己的戰機遮蔽天際。"
 AST_royal_australian_navy: "澳大利亞皇家海軍"
 AST_royal_australian_navy_desc: "澳大利亞皇家海軍在聯邦成立後由各殖民地艦隊聯合組建，在上個大戰期間幾乎征戰在所有戰場。此後，由於經費有限，海軍規模遭到削減，但隨著全球緊張局勢升溫，艦隊是時候重返大海了。"
 AST_coast_watchers: "海岸警備隊"
 AST_coast_watchers_desc: "雖然我們的大部分軍事力量仍集中在本土，但北部諸通道構成了至關重要的早期預警網絡。通過在這些外圍島嶼部署本地情報特工，遠在敵方海空行動威脅到澳大利亞海岸之前，我們便能將其察覺。"
 AST_marines: "海軍陸戰隊"
 AST_marines_desc: "身處群島環繞的大洋之中，作為其中最大的島嶼，我們必須確保自身具備兩棲作戰能力，以便將力量投送至國土之外。一旦我們需要由防禦轉為進攻，這支力量將確保跳島行動的有效開展。"
 AST_naval_auxiliary_patrol_taog: "輔助海上巡邏"
 AST_naval_auxiliary_patrol_taog_desc: "當職業部隊另有他用之時，我們可以仰仗熱忱的本地誌願者來守衛港口與沿岸設施。他們對當地水道的熟悉使其無比珍貴，而且無人會懷疑，一名本地漁民竟是在為我們效力。"
 AST_cockatoo_island_shipyards_taog: "鸚鵡島造船廠"
 AST_cockatoo_island_shipyards_taog_desc: "鸚鵡島造船廠長期充當帝國維修與保養的樞紐，支撐著皇家海軍的海外行動。如今，它已是皇家澳大利亞海軍的基石，我們必須擴大其產能，以滿足日益增長的艦隊需求，並維繫海軍的實力。"
 AST_kangaroo_point_dry_dock_taog: "袋鼠角幹船塢"
 AST_kangaroo_point_dry_dock_taog_desc: "儘管埃文斯-迪肯公司主要是一家工程公司，但隨著全球緊張局勢加劇，他們準確認識到了擴大造船能力的必要，並將目光投向了袋鼠角。我們應為他們接管這片土地提供便利，以支持艦隊的持續壯大。"
 AST_scrap_iron_flotilla_taog: "廢鐵艦隊"
 AST_scrap_iron_flotilla_taog_desc: "雖被批評者視作過時陳舊而不屑一顧，但我們一批較老舊的驅逐艦仍被整合為單一編隊。相比新型艦艇，儘管這些船艦缺乏聲望，但彰顯了對既有資產的巧妙運用。"
 AST_cruising_for_a_bruising: "自討苦吃"
 AST_cruising_for_a_bruising_desc: "我們的海軍長於運用巡洋艦，這是一項值得發揚的傳統。快速、多用途且火力猛烈，這些艦艇不久將享譽全球——任何擋道的敵人，都免不了頭破血流，遭受重創。"
 AST_strike_from_down_under: "來自南半球的打擊"
 AST_strike_from_down_under_desc: "在波濤下悄然滑行，無雷霆之轟鳴，一旦它們發現你，你的艦船就等著被洗劫一空。你可曾聽說，可曾聽說來自澳大利亞的潛艇？跑快些吧，否則你的艦隊將被揮霍一空。好耶——！"
 AST_hmas_sydney: "悉尼號巡洋艦"
 AST_hmas_sydney_desc: "戰列艦的時代已經結束了。海軍的未來在於空中力量，澳大利亞不會落後。經過多年的海軍重建和現代化改造，我們已準備好邁出最後一步；航母將定義澳大利亞未來一代的海上力量。"
 AST_conscription_level_allowed_tt: "爭取更多徵兵的政治意願（查看國策上的人力圖標）"
 AST_conscription_level_allowed_limited_conscription_tt: "解鎖下一級的§Y徵兵法案§!，可啟用§Y有限徵兵§!"
 AST_conscription_level_allowed_extensive_conscription_tt: "解鎖下一級的§Y徵兵法案§!，可啟用§Y廣泛徵兵§!"
 AST_conscription_level_allowed_service_by_requirement_tt: "解鎖下一級的§Y徵兵法案§!，可啟用§Y按要求服兵役§!"
 AST_conscription_level_allowed_all_adults_serve_tt: "解鎖下一級的§Y徵兵法案§!，可啟用§Y所有成人服兵役§!"
 AST_conscription_level_allowed_scraping_the_barrel_tt: "解鎖下一級的§Y徵兵法案§!，可啟用§Y榨乾他們§!"
 AST_conscription_law_so_far: "[CONSCRIPTION_LAW_SO_FAR]"
