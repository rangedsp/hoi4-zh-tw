 AST_natunity_desc: "§Y國民團結政府§!\n§L在危機時刻，小的鬥爭會讓位於大的鬥爭。周邊國家正面臨著一場又一場的衝突，儘管國內問題有其自身的緊迫性，但當流血威脅越來越近時，這種緊迫性就會減弱。[AST.GetName]的民主黨派必須擱置分歧，團結起來面對世界。§!"
