 # <Military Branch - Modernize our Army>
 INS_revolution_ended_tt: "民族革命已結束"
 # <Empower the Volksraad>
 INS_the_jewel_in_the_crown: "王冠上的明珠"
 INS_the_jewel_in_the_crown_desc: "東印度群島是荷蘭殖民王冠上最璀璨的明珠，我們打算保持這一地位。通過人民議會，我們的聲音能夠傳達到海牙。"
 INSHOL_java: "$HOL_java$"
 INSHOL_java_desc: "$HOL_java_desc$"
 INSHOL_sumatra: "$HOL_sumatra$"
 INSHOL_sumatra_desc: "$HOL_sumatra_desc$"
 INSHOL_borneo_and_the_grote_oost: "$HOL_borneo_and_the_grote_oost$"
 INSHOL_borneo_and_the_grote_oost_desc: "$HOL_borneo_and_the_grote_oost_desc$"
 INSHOL_foundations_of_defense: "$HOL_the_foundations_of_defense$"
 INSHOL_foundations_of_defense_desc: "$HOL_the_foundations_of_defense_desc$"
 INSHOL_investments_in_civ_railways_tt: "如果[HOL.GetFlag]§Y[HOL.GetName]§!完成國策：\n         （[INS.GetFlag]§Y[INS.GetName]§!：獲得§Y£autonomy_texticon -250.00§!）\n   如果[INS.GetFlag]§Y[INS.GetName]§!完成國策：\n         獲得§Y£autonomy_texticon 250.00§!"
 INSHOL_investments_in_civ_railways: "投資民用鐵路"
 INSHOL_investments_in_civ_railways_desc: "贏得東印度群島人民的支持需要投資民用基礎設施。目前，我們的鐵路主要用於貨物運輸。我們應該購置客運列車，在爪哇和蘇門答臘現有的鐵路上運行。"
 INSHOL_continue_exclusive_rights: "爪哇銀行獨家經營權"
 INSHOL_continue_exclusive_rights_desc: "東印度盾在大蕭條期間失去了大部分價值，我們的經濟增長陷入停滯。我們可以嘗試通過給予爪哇銀行獨家印鈔權來穩定盾幣，該銀行在1922年之前一直擁有這一權利。"
 INSHOL_peg_indies_guilder_to_dutch_guilder: "將東印度盾與荷蘭盾掛鉤"
 INSHOL_peg_indies_guilder_to_dutch_guilder_desc: "東印度盾在大蕭條期間失去了大部分價值，我們的經濟增長陷入停滯。最簡單的解決方案是將東印度盾與更為穩定的荷蘭盾掛鉤。這也會讓我們與宗主國聯繫更為緊密。"
 INSHOL_peg_indies_guilder_to_us_dollar: "將東印度盾與美元掛鉤"
 INSHOL_peg_indies_guilder_to_us_dollar_desc: "東印度盾在大蕭條期間失去了大部分價值，我們的經濟增長陷入停滯。雖然我們可以將東印度盾與荷蘭盾掛鉤，但美元是更為穩定的貨幣。將盾幣與美元掛鉤還能讓我們擁有更多的經濟獨立性，使自治成為一個更可實現的目標。"
 indonesia_currency_pegged_to_dollar_modifier: "荷屬東印度盾與美元掛鉤"
 INS_direct_rule_tt: "在印度尼西亞土邦中解鎖§Y$INS_direct_rule_occupation_law$§!佔領法令。\n效果：\n     §G增加§!從該地區獲得的工廠和資源\n     §R降低§!順從度增長\n     §R增加§!抵抗度增長"
 INS_local_autonomy_tt: "在印度尼西亞土邦中解鎖§Y$INS_local_autonomy_occupation_law$§!佔領法令。\n效果：\n     各方面給予§Y小幅§!提升\n     §G增加§!順從度增長"
 INS_invest_in_batavian_education_req_tt: "已成功完成至少§Y3§!項人民議會任務"
 INS_invest_in_batavian_education_req_2_tt: "已成功完成至少§Y6§!項人民議會任務"
 INSHOL_eventual_autonomy_req_tt: "已成功完成至少§Y4§!項人民議會任務"
 indonesia_volksraad_passed_12: "印度尼西亞國旗已獲得正式承認"
 INS_stronghold_java_tt: "任何印度尼西亞地區：未被[ROOT.GetFlag][ROOT.GetNameDefCap]佔領"
 INSHOL_request_east_timor: "要求歸還東帝汶"
 INSHOL_request_east_timor_desc: "葡萄牙無權佔領帝汶，這是殖民歷史的殘餘，我們絕不能繼續容忍，因為它是印度尼西亞的合法領土。我們將正式要求葡萄牙立即將帝汶歸還給我們。"
 INS_resist_occupation: "抵抗佔領"
 INS_resist_occupation_desc: "儘管有許多印度尼西亞人對荷蘭十分憤怒，但我們不能就因此倒向法西斯。我們必須盡一切努力抵抗日本的入侵，保衛祖國。"
 INS_local_resistance: "地方抵抗組織"
 INS_local_resistance_desc: "我們將在尚未被佔領的領土上建立抵抗組織，確保即使那裡被佔領，我們也已準備好在時機來臨時將其奪回。"
 INS_stronghold_java: "固守爪哇"
 INS_stronghold_java_desc: "東印度是一個廣闊的群島，居住著眾多民族，地形極其惡劣。面對一支遠強於我們的軍隊，試圖守住每一處島嶼、叢林和山脈，這注定會失敗。雖然放棄同胞並非易事，但撤離除爪哇以外的所有島嶼，從而將全部軍隊駐紮在爪哇，也許是對整個國家最有利的舉措。"
 INS_silence_nationalists: "壓制民族主義支持者"
 INS_silence_nationalists_desc: "日本的入侵導致革命民族主義運動因共同的敵人荷蘭而開始支持日本侵略者。入侵造成的不穩定使這些運動以前所未有的速度發展。如果我們現在不採取行動，它可能會完全脫離我們的控制。"
 INS_east_indies_exile_government: "東印度流亡政府"
 INS_east_indies_exile_government_desc: "唉，儘管我們盡了最大努力，東印度群島還是淪陷了。然而，我們還不能失去希望。我們必須繼續利用有限的資源盡一切所能。我們可能輸掉了戰鬥，但還沒有輸掉戰爭。"
 INS_establish_nefis: "建立荷蘭東印度武裝力量情報局"
 INS_establish_nefis_desc: "我們將與同盟國一起建立荷蘭東印度武裝力量情報局，駐紮在澳大利亞。通過該機構，我們將開展秘密行動，針對日本佔領軍展開破壞行動。每一次小勝利，都讓我們離重返故土更近一步。"
 INS_evacuate_soldiers_to_australia: "將士兵撤離至澳大利亞"
 INS_evacuate_soldiers_to_australia_desc: "我們將在澳大利亞北部的荷蘭東印度武裝力量情報局基地附近建立一個軍事基地。在那裡，我們將駐紮在佔領期間未被俘獲的荷蘭皇家東印度陸軍士兵，使我們能夠繼續戰鬥。"
 INS_australian_weapons: "澳大利亞武器"
 INS_australian_weapons_desc: "秘密行動並不容易開展，我們需要合適的裝備才能成功。我們可以授權澳大利亞的工廠，使其為荷蘭東印度武裝力量情報局生產武器。"
 INS_defenders_of_homeland: "鄉土防衛義勇軍"
 INS_defenders_of_homeland_tt: "如果建立“鄉土防衛義勇軍”，該國策將自動完成。"
 INS_resist_occupation_tt: "如果我們遭到入侵且未投降，該國策將自動完成。"
 INS_defenders_of_homeland_desc: "東印度群島政府已倒臺，新政權取而代之。在民族主義者和日本政府的領導下，我們將建立一支優於荷蘭皇家東印度陸軍的新軍隊，並贏得戰爭。然而，不可否認的是，民族主義者與帝國主義者之間的這個聯盟是脆弱的。聯盟會持續下去，還是以流血衝突告終？"
 INS_embrace_co_prosp_sphere: "加入共榮圈"
 INS_embrace_co_prosp_sphere_desc: "我們終於結束了荷蘭的統治，儘管我們只是用一個主人換來了另一個主人，但經濟繁榮與泛亞主義的承諾極具誘惑。我們將繼續協助日本的戰爭努力，以確保荷蘭永遠不會企圖重返印度尼西亞。"
 INS_seize_oppurtunity: "抓住機遇"
 INS_seize_oppurtunity_desc: "[JAP.GetNameDefCap]正在失敗，他們的佔領政府無比虛弱。數個世紀以來，我們第一次有了打破印度尼西亞的枷鎖、建立獨立國家的真正機會。若不趁此機會宣佈獨立，不知道還要等多久才能迎來下一次機會。"
 INS_japanese_resource_infrastructure: "資助更大的戰事"
 INS_japanese_resource_infrastructure_desc: "將我們核心資源開採基礎設施的控制權交給[JAP.GetNameDef]是贏得戰爭的必要步驟，因為確保[JAP.GetAdjective]部隊始終保持充足補給是重中之重。[JAP.GetNameDefCap]還將開發我們的當地基礎設施，以提高資源出口效率。"
 INS_japanese_army_training: "改革軍隊"
 INS_japanese_army_training_desc: "我們有很多東西要向我們的[JAP.GetAdjective]宗主學習，既然荷蘭皇家東印度陸軍已經解散，我們應該建立一支由日本陸軍教導的新軍隊，準備好保衛印度尼西亞免受外部威脅。"
 INS_governor_general_de_jonge: "德容格總督"
 INS_governor_general_de_jonge_desc: "博尼法修斯·科內利斯·德容格以鐵腕統治著稱，反對任何形式的民族主義，經常無視人民議會的意願。他對東印度群島的統治持續了很長時間，他的經驗可以一直追溯到第一次世界大戰，當時他擔任東印度群島戰爭部長。"
 INS_governor_general_tjarda: "恰爾達總督"
 INS_tjarda_explain_tt: "§Y博尼法修斯·科內利斯·德容格§!任期已到，§Y阿利迪厄斯·恰爾達·範·斯塔爾肯博赫·斯塔豪韋爾§!於1936年9月被選為繼任總督。"
 INS_governor_general_tjarda_desc: "阿利迪厄斯·恰爾達·範·斯塔爾肯博赫·斯塔豪韋爾對東印度的看法與他的前任略有不同。雖然他仍然反對民族主義，但他的政策略為自由，更願意聽取人民議會的意願。"
 INS_electrical_investments: "電力投資"
 INS_electrical_investments_desc: "每個歐洲工業化國家都有強大的電網來支持其工業。如果我們想停止依賴原材料出口，並像他們一樣建立自己的製造業，就應該建造覆蓋整個爪哇的高容量電網。"
 INS_reduce_land_taxes: "降低土地稅"
 INS_reduce_land_taxes_desc: "對土地所有權徵收的高額稅收使得印尼原住民難以擁有種植園和企業。雖然這讓我們能夠輕鬆壟斷橡膠行業，但也給整個國家帶來了經濟問題。我們應該考慮將這些稅收降至以前的水平，使規模較小、私人擁有的橡膠種植園能夠運營。"
 INS_invest_in_batavian_education: "投資巴達維亞教育"
 INS_invest_in_batavian_education_desc: "人民議會已經明確表示，印尼人民的意願是讓教育變得更加普及，因為目前只有荷屬印尼人和少數印尼精英階層能夠負擔得起教育費用。為了響應人民議會的動議，我們應在巴達維亞及其周邊地區建造若干所中小學。"
 INS_javanese_education_investments: "爪哇教育投資"
 INS_javanese_education_investments_desc: "除了我們正在進行的建造中小學的項目外，我們還可以建造一所社區大學和專門的職業學校，這將使中產階級家庭更容易接受高等教育。"
 INS_allow_local_autonomy: "允許地方自治"
 INS_allow_local_autonomy_desc: "授予土邦自治權的“王公領地”制度使民族主義運動更易於管理，並提高了整個國家的穩定性。我們應進一步提高授予土邦的自治權，讓政府能夠專注於更重要的議題。"
 INS_direct_rule: "直接統治"
 INS_direct_rule_desc: "授予土邦自治權的“王公領地”制度增加了行政管理的難度，需要額外的官僚機構並浪費時間。現在是時候徹底廢除這一制度，對整個群島實施直接統治。"
 INS_seize_oppurtunity_tt: "§Y[JAP.GetFlag][JAP.GetName]§!已被擊退，並且控制少於§Y[?var:temp_states_plus_more]§!個地區。（當前：§Y[?var:JAP.num_controlled_states]§!）"
 INS_seize_oppurtunity_refuse_warn_tt: "§R民族革命將開始，這可能導致與[HOL.GetNameDef]的戰爭。§!"
 INS_economic_stabilization: "經濟穩定"
 INS_economic_stabilization_desc: "大蕭條和全球範圍內的保護主義使我們的經濟陷入困境，許多曾經在原材料行業工作的印尼人發現自己也失業了。我們必須採取嚴厲措施，制定一項勞工計劃，為失業公民分配工作。"
 INS_restore_order_in_indies: "恢復東印度群島秩序"
 INS_restore_order_in_indies_desc: "東印度群島日益高漲的民族主義運動已經破壞了多個地區的穩定，如果不加以制止，情況可能會失控。我們必須將恢復秩序與穩定作為首要任務。"
 INS_detangle_supply_chains: "理順供應鏈"
 INS_detangle_supply_chains_desc: "我們的出口經濟要求貨物經過數十個中間商才能最終到達目的地，每次中間商都會以費用、稅收或其他名義從中抽取一部分。我們應該努力理清這一混亂局面，並直接控制供應鏈的大部分環節。"
 INS_prioritize_industrial_growth: "優先發展工業"
 INS_prioritize_industrial_growth_desc: "我們的出口經濟波動過大，使我們依賴於與荷蘭的合作。我們應該著手在巴達維亞各地建造工廠，發展製造業，成為太平洋地區工業化程度最高的國家。"
 INS_closer_economic_ties_to_netherlands: "加強與荷蘭的經濟聯繫"
 INS_closer_economic_ties_to_netherlands_desc: "我們有很多東西可以向我們的宗主國學習，尤其是在經濟方面。如果我們能進一步將我們的出口經濟與荷蘭整合，我們就可以利用他們的基礎設施和人脈來獲得更有利的貿易協議。"
 INS_prioritize_dutch_companies: "荷蘭公司優先"
 INS_prioritize_dutch_companies_desc: "幾個世紀以來，殼牌和福克等荷蘭公司一直是我們經濟的支柱，我們的原材料出口與殼牌高度整合。這為東印度群島帶來了巨大的財富，我們應該優先考慮這些公司，而不是本地的小型企業，以確保我們的合作關係保持牢固。"
 INSHOL_java_factories: "在爪哇開設武器工廠"
 INSHOL_java_factories_desc: "雖然基礎，但不可否認的是，僅僅建造更多的武器工廠就能極大地提高軍隊的實力。作為殖民地的工業中心，爪哇顯然是建造這些工廠的地點。"
 INSHOL_license_dutch_weapon_blueprints: "授權荷蘭武器藍圖"
 INSHOL_license_dutch_weapon_blueprints_desc: "與其投資建設完整的國內製造流程並自主研發技術設計，我們不如與荷蘭公司合作，購買他們的武器藍圖。"
 INSHOL_bangka_production_lines: "邦加生產線"
 INSHOL_bangka_production_lines_desc: "邦加項目使得邦加島的基礎設施飛速發展，將這個曾經微不足道的小島變成了新工業項目的理想地點。我們有機會通過在邦加島建造一座新的武器工廠來加強荷印皇家陸軍，由於該島集中的道路、鐵路和港口，這座工廠的運營效率將比建在其他地方更高。"
 INSHOL_artillerie_inrichtingen: "荷蘭兵器公司"
 INSHOL_artillerie_inrichtingen_desc: "荷蘭兵器公司在荷蘭製造火炮和其他武器已有超過250年的歷史，並在東印度群島運營了幾十年。通過在東印度群島開設新的製造工廠來擴大其生產能力，將顯著提升荷蘭皇家東印度陸軍的作戰能力，同時通過創造新的就業機會來增強資金不足地區的經濟。"
 INSHOL_ai_pyrotechnische: "荷蘭兵器公司煙火技術子公司"
 INSHOL_ai_pyrotechnische_desc: "繼續擴大荷蘭兵器公司在東印度群島的生產設施，我們應資助建立荷蘭兵器公司煙火技術子公司的東印度群島分部。"
 INSHOL_bio_pharma: "生物製藥"
 INSHOL_bio_pharma_desc: "擴大東印度群島的製藥行業顯然是改革荷蘭皇家東印度陸軍的下一步，以確保受傷士兵得到充分治療並安全康復。東印度群島盛產奎寧，這使得該項目的成本大大低於正常水平。"
 INSHOL_develop_fighters: "研發新型戰鬥機"
 INSHOL_develop_fighters_desc: "我們將派遣巴達維亞工程師前往阿姆斯特丹，親身學習福克公司的戰鬥機生產，接觸其嚴格保守的製造機密。他們將帶著在東印度群島建立現代國內戰鬥機工業所需的知識和技術專長返回。"
 INSHOL_develop_bombers: "研發新型轟炸機"
 INSHOL_develop_bombers_desc: "我們將派遣巴達維亞工程師前往阿姆斯特丹，親身學習福克公司的轟炸機生產，接觸其嚴格保守的製造機密。他們將帶著在東印度群島建立現代國內轟炸機工業所需的知識和技術專長返回。"
 INSHOL_bandung_aircraft_facility: "萬隆飛機制造廠"
 INSHOL_bandung_aircraft_facility_desc: "雖然藍圖和製造秘密很有用，但只有當我們據此造出飛機時才有價值。我們將在萬隆開設新的飛機制造廠，以滿足荷印皇家陸軍航空隊當前的需求。"
 INSHOL_netherlands_indies_air_doctrine: "荷印空軍學說"
 INSHOL_netherlands_indies_air_doctrine_desc: "我們將研究那些面臨與我們類似挑戰的國家的空軍，借鑑它們來之不易的經驗，形成一種適合東印度群島實際情況的學說，避免重蹈這些歷史錯誤。"
 INSHOL_manado_military_academy: "望加錫軍事學院"
 INSHOL_manado_military_academy_desc: "在爪哇以外建立一所軍事學院，通過使東部島嶼的徵兵成為可能，將極大地緩解我們的人力短缺。位於東印度群島中部附近的望加錫是理想的選址。"
 INSHOL_infantry_training_in_borneo: "婆羅洲步兵訓練"
 INSHOL_infantry_training_in_borneo_desc: "東印度群島的特點是茂密的叢林、崎嶇的山脈和嚴酷的地形。我們主要駐紮在爪哇的士兵完全沒有準備好在這種條件下作戰。我們必須將軍事訓練擴展到爪哇以外，並在更惡劣的環境中進行演習。地球上很少有地方能比得上婆羅洲的叢林和山脈，使其成為訓練世界級遊騎兵的完美地點。"
 INSHOL_knil_engineers: "工程兵軍團"
 INSHOL_knil_engineers_desc: "我們不能把所有精力都集中在步兵和步槍生產上，要記住後勤和通訊在戰鬥中起著至關重要的作用。我們應該訓練工兵並資助巴達維亞的職業學校，以確保我們的軍隊不會因糟糕的後勤而受限。"
 INSHOL_work_with_oil_barons: "與石油巨頭合作"
 INSHOL_work_with_oil_barons_desc: "大蕭條使我們以出口為基礎的經濟陷入悲慘境地。也許是時候考慮將部分貿易談判權交給蘇門答臘的石油巨頭，以保證石油能夠售出。然而，這是有代價的，因為為了讓他們同意這筆交易，我們需要以遠低於市場價的價格出售石油。"
 INSHOL_rubber_taxation: "橡膠稅"
 INSHOL_rubber_taxation_desc: "荷蘭的投資和專業技術已將東印度群島的橡膠種植園轉變為帝國最寶貴的資產之一。王室理應獲得其所創造的財富中應得的份額。儘管一些當地政客提出抗議，但帝國的利益不能被地方的煽動所左右。"
 INSHOL_padang_port: "巴東國際港口"
 INSHOL_padang_port_desc: "巴東生產的資源必須先運往爪哇，然後才能到達國際市場，因為該地區缺乏能夠處理大型船隊的設施。這種不必要的繞路給我們的供應鏈帶來壓力，並限制了蘇門答臘的經濟潛力。通過在巴東建造一個大型貨運港口，我們可以消除這一繞路，提高巴東種植園的盈利能力。"
 INSHOL_subsidize_bauxite: "補貼鋁土礦項目"
 INSHOL_subsidize_bauxite_desc: "東印度群島正在進行的旨在實現富含鋁土礦的邦加-勿裡洞群島現代化的項目非常有前景，長期盈利潛力巨大。我們應該通過經濟補貼來支持東印度群島政府，以加快項目進度。"
 INSHOL_agricultural_subsidies: "農業部門私有化"
 INSHOL_agricultural_subsidies_desc: "通過允許建立不同規模的私人農場，我們可以加速資金不足的農村地區的基礎設施發展，同時增加政府收入。為此，我們將建立一個結構化的稅收框架，即這些農場產生的所有稅收收入直接上繳給荷蘭，而不是先經過東印度群島。"
 INSHOL_import_sugar: "進口糖類"
 INSHOL_import_sugar_desc: "我們將在東印度群島不斷發展的農業部門實施價格管制，以便以其他政府無法比擬的價格從東印度群島的種植園進口全國所需的全部糖類，並建立政府對糖類的壟斷。"
 INSHOL_import_lumber: "進口木材"
 INSHOL_import_lumber_desc: "我們將在東印度群島不斷發展的農業部門實施價格管制，以便以其他政府無法匹配的價格從東印度群島的種植園進口全國所需的全部木材，並建立政府對木材的壟斷。"
 INSHOL_industrialized_colony: "工業化的殖民地"
 INS_no_peta_tt: "印度尼西亞將無法與外國侵略者合作。"
 INSHOL_industrialized_colony_desc: "東印度群島，曾經一個不起眼的殖民地，如今已成為全亞洲工業化程度最高、最富有的地區之一。這標誌著荷蘭歷史上、也是人類歷史上一個劃時代的時刻。我們的努力得到了回報，我們將繼續投資於我們殖民地的發展，並重新確立荷蘭作為世界強國的地位。"
 INSHOL_economic_integration: "經濟一體化"
 INSHOL_economic_integration_desc: "荷屬東印度是我們帝國皇冠上閃耀的明珠，其繁榮昌盛得益於女王、首相和總督的穩健領導。這種穩定絕不能因魯莽的獨立呼聲而受到威脅，那隻會帶來混亂和衰退。我們將使荷蘭與東印度群島的經濟聯繫更加緊密，確保持續的穩定與輝煌。"
 INSHOL_republic_of_indonesia: "印度尼西亞共和國"
 INSHOL_republic_of_indonesia_desc: "當荷蘭勉強同意蘇塔爾喬請願書時，由此產生的立法將印度尼西亞的獨立與一長串經濟自給自足的條件捆綁在一起。儘管如此，由於印尼人民的決心，這些條件現在已經完全滿足，荷蘭別無選擇，只能接受我們正式的獨立宣言。"
 INSHOL_propose_malay_unification: "提議馬來亞加入一統"
 INSHOL_propose_malay_unification_desc: "印度尼西亞是一個擁有數百種文化、語言和民族的群島。雖然有些相似，但另一些則截然不同。然而，通過殖民統治的共同鬥爭，我們找到了在一個國家，即，在印度尼西亞下的團結。也許我們應該問問自己，當隔海相望的馬來亞人民與我們有著許多共同的歷史和願望時，為什麼這種團結必須止步於此？"
 INSHOL_singapore_compromise: "新加坡妥協方案"
 INSHOL_singapore_compromise_desc: "無論從歷史還是文化上看，新加坡都是印尼的土地，將其納入統一的印尼是理所當然的。然而，鑑於其戰略重要性和作為軍事基地的必要性，英國不願意放棄新加坡。我們應該提出一個妥協方案：新加坡加入聯邦，條件是英國保留在該島駐軍的權利。"
 INSHOL_request_ceylon: "索要錫蘭"
 INSHOL_request_ceylon_desc: "英國殖民地錫蘭與更廣泛的馬來世界有著深厚的文化和語言聯繫。隨著泛馬來聯邦“馬菲印多”的發展，這座島嶼自然也應在聯邦中找到自己的位置。"
 INSHOL_papua_referendum: "巴布亞公投"
 INSHOL_papua_referendum_desc: "如今，巴布亞島被印度尼西亞和澳大利亞分割。我們通過投資與開發已將我們這一半變成了繁榮發展的地區，但澳大利亞管理的領土仍然被忽視且欠發達。這座島的未來應由其人民決定，因此我們必須要求就巴布亞統一問題舉行正式公投。"
 INSHOL_invite_phillipines: "提議成立馬菲印多"
 INSHOL_invite_phillipines_desc: "我們聯盟的眾多民族說著不同的語言，遵循著不同的傳統，但幾乎所有人的根源都可追溯到馬來世界。我們應將我們的聯邦國家改革為一個泛馬來聯邦，邀請菲律賓作為成員國加入。曾經的幾個微不足道的殖民地，如今將崛起成為東南亞的區域強國。"
 INS_focus_time_reduce_usa_tt: "§Y$INS_realign_supply_chains$§!將使此國策所需時間減少70天。"
 INS_focus_time_reduce_jap_tt: "§Y$INS_first_come_first_serve$§!將使此國策所需時間減少70天。"
 INS_focus_time_reduce_fokker_tt: "§Y$INSHOL_east_indies_fokker_division$§!將使此國策所需時間減少35天。"
 INS_focus_time_reduce_tjarda_tt: "§Y$INS_governor_general_tjarda$§!將使此國策所需時間減少35天。"
 INS_focus_time_reduce_pki_tt: "§Y$INS_utilize_tan_malakas_militia$§!將使此國策所需時間減少35天。"
