 ### MISC ###
 ############
 add_random_stat_to_general_tt: "為該將領添加1額外隨機技能點"
 generic_unlock_industrial_concern_tt: "可作為工業企業： \n"
 NZL_rail_standardization_tt: "§Y[?NZL_train_var]§!單位的§Y$NZL_train_equipment_1$§!添加到國家儲備中。"
 NZL_ministry_of_public_works: "公共工程部"
 NZL_ministry_of_public_works_desc: "通過協調規劃與嚴明投資，公路、鐵路和電力計劃將遵循一貫的國家戰略推進，而非零敲碎打。"
 NZL_abolish_the_railways_board: "廢除政府鐵路局"
 NZL_abolish_the_railways_board_desc: "政府鐵路局在實現交通網絡現代化方面毫無成效。是時候廢除這一反常機構，將鐵路重歸內閣管控。"
 NZL_rail_standardization: "機車標準化"
 NZL_rail_standardization_desc: "[ROOT.GetName]全國各地有多家作坊，生產過質量參差不齊的機車。為使鐵路系統更高效，我們將為它們設立一批標準機車進行製造，每類專用於特定目的。"
 NZL_full_employment: "充分就業"
 NZL_full_employment_desc: "通過持續的公共工程建設、審慎的規劃和穩健的工業擴張，失業終讓位於機遇。大蕭條年代閒置的工坊再度活躍，國家勞動已全面投入生產事業。恢復了信心與穩定，我們不僅實現了復甦，更已為前方的挑戰厲兵秣馬。"
 NZL_direct_the_coal_industry: "指導煤炭工業"
 NZL_direct_the_coal_industry_desc: "隨著煤炭對我們的鐵路、工業和發電站變得愈發關鍵，政府必須為國家利益介入協調生產與分配。"
 NZL_establish_the_ncb: "設立國家煤炭委員會"
 NZL_establish_the_ncb_desc: "通過成立國家煤炭委員會，我們可以將全國分散的煤礦納入協調指揮，為鐵路、工業和發電確保穩定的燃料供應。中央監管將使我們得以合理化生產、提高效率，並確保戰略需求優先於私人利益。"
 NZL_electrification: "提升發電量"
 NZL_electrification_desc: "通過加強水利，並發展水力發電，我們可為持久的工業實力奠定基礎。新的水壩和輸電工程將增加全國各地的容量，確保工廠、鐵路和港口獲得所需電力。"
 NZL_bureau_of_industry_taog: "$NZL_bureau_of_industry$"
 NZL_bureau_of_industry_taog_desc: "$NZL_bureau_of_industry_desc$"
 NZL_wairarapa_sheep_farms_taog: "$NZL_wairarapa_sheep_farms$"
 NZL_wairarapa_sheep_farms_taog_desc: "$NZL_wairarapa_sheep_farms_desc$"
