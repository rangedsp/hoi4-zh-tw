 medium_plane_airframe_0: "戰間期中型機身"
 medium_plane_airframe_0_desc: "雖然能夠搭載一定量的載荷執行長距離任務，但這種機身的發展潛力嚴重受限。"
 medium_plane_airframe_1: "基礎中型機身"
 medium_plane_airframe_1_desc: "通過應用最近開發的最新技術，這種機身比類似尺寸的前代機身的能力要大得多。"
 medium_plane_airframe_2: "改進型中型機身"
 medium_plane_airframe_2_desc: "利用現代化生產技術，這種機身使得飛機能夠攜帶更大的載荷執行更長距離的任務。"
 medium_plane_airframe_3: "先進型中型機身"
 medium_plane_airframe_3_desc: "為最大化性能和載荷而設計，這種機身代表傳統動力飛機的巔峰。"
 medium_plane_airframe_4: "現代中型機身"
 medium_plane_airframe_4_desc: "隨著噴氣動力飛機的優勢逐漸顯現，工程師們開始設想製造適用於噴氣推進的機身。"
 medium_plane_fighter_airframe_0: "戰間期重型戰鬥機"
 medium_plane_fighter_airframe_0_desc: "$medium_plane_airframe_0_desc$"
 medium_plane_fighter_airframe_1: "基礎重型戰鬥機"
