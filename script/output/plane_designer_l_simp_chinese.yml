 medium_plane_scout_plane_airframe_4_desc: "$medium_plane_airframe_4_desc$"
 large_plane_airframe_0: "戰間期大型機身"
 large_plane_airframe_0_desc: "這種巨大的機身有大量空間裝載炸彈或燃料箱。然而，它的發展潛力顯然已所剩無幾。新一代戰略轟炸機已是呼之欲出。"
 large_plane_airframe_1: "基礎大型機身"
 large_plane_airframe_1_desc: "這種機身是為測試一架真正意義上的戰略轟炸機的潛能而設計，它需要有能力襲擊敵人領土深處的工業目標，並將乘員活著帶回來。"
 large_plane_airframe_2: "改進型大型機身"
 large_plane_airframe_2_desc: "鑑於新型戰略轟炸機的概念已被完美檢驗，這種機身將著重於提升載重量和航程，同時為未來的發展保留充足的潛能。"
 large_plane_airframe_3: "先進型大型機身"
 large_plane_airframe_3_desc: "為超遠程和超高海拔飛行而優化，這種機身能夠深入敵方領土，並將相當數量的炸彈投放到敵人的核心地帶。"
 large_plane_airframe_4: "現代大型機身"
 large_plane_airframe_4_desc: "噴氣推進使飛機性能突飛猛進。這種機身為利用這項技術而設計。"
 large_plane_maritime_patrol_plane_airframe_0: "戰間期海上巡邏機"
 large_plane_maritime_patrol_plane_airframe_0_desc: "艦隊依賴長程飛機來搜尋遠在海上的敵人。雖然有些過時，但是這種機身可以提供搜尋廣闊的海洋所需的高航程。"
 large_plane_maritime_patrol_plane_airframe_1: "基礎海上巡邏機"
 large_plane_maritime_patrol_plane_airframe_1_desc: "更強力艦載機的出現使得在遠離海岸的地方摧毀敵軍艦隊成為必要。但想要打擊它們，首先得在廣闊的海洋中找到它們，這迫使我們需要一種新類型的飛機。"
 large_plane_maritime_patrol_plane_airframe_2: "改進型海上巡邏機"
 large_plane_maritime_patrol_plane_airframe_2_desc: "來自潛艇和破襲巡洋艦的雙重威脅使得在廣闊的海洋上巡邏成為了必需。這種機身正是為了這項任務而設計的。"
 large_plane_maritime_patrol_plane_airframe_3: "先進型海上巡邏機"
 large_plane_maritime_patrol_plane_airframe_3_desc: "雷達等傳感設備的出現意味著飛機即使在惡劣天氣或夜間也能搜尋到敵軍艦隊。但如此多的新式設備自然需要一種更大的機身來搭載。"
 large_plane_maritime_patrol_plane_airframe_4: "現代海上巡邏機機身"
 large_plane_maritime_patrol_plane_airframe_4_desc: "隨著導彈時代的到來，海上巡邏機必須能夠在離岸邊更遠的地方執行持續時間更久的任務。"
 cv_small_plane_airframe_0: "戰間期艦載機機身"
 cv_small_plane_airframe_0_desc: "配有著艦鉤和加固起落架，這種小型機身能夠在航空母艦上起降。"
 cv_small_plane_airframe_1: "基礎艦載機機身"
 cv_small_plane_airframe_1_desc: "這種機身使用了為陸基飛機開發的新技術，其性能與陸基飛機相差無幾，但可以從航母的甲板上起降。"
 cv_small_plane_airframe_2: "改進型艦載機機身"
 cv_small_plane_airframe_2_desc: "為了跟上陸基航空的發展，這種機身設計時採用了新式技術，以提高其航程和性能。"
 cv_small_plane_airframe_3: "先進型艦載機機身"
 cv_small_plane_airframe_3_desc: "艦載航空是一門極為嚴格的學問，對艦載機機身的尺寸和性能都有苛刻的限制。這種機身代表了採用傳統動力的機身能達到的性能上限。"
 cv_small_plane_airframe_4: "現代艦載機機身"
 cv_small_plane_airframe_4_desc: "這種機身為能利用噴氣式引擎產生的更大推力而生，將噴氣式引擎應用到了海軍航空之中。"
