 early_bombs: "炸彈"
 early_bombs_desc: "自世界大戰開戰伊始，飛機就越來越被常用於向敵方目標投下爆炸物。隨著時間的推移，這已經逐漸成為了空戰的基本作用之一。"
 heavy_bombs: "重型炸彈"
 heavy_bombs_desc: "現代戰爭需要飛機對敵方目標使用更大型的炸彈。這已逐漸發展為空戰的一個基本領域。"
 armor_piercing_bombs: "穿甲炸彈"
 armor_piercing_bombs_desc: "戰艦甲板裝甲在持續增厚，只有開發專用炸彈才能穿透這種裝甲。"
 air_torpedoe_1: "空射魚雷"
 air_torpedoe_1_desc: "輕型魚雷可由任何符合條件的飛行器裝載，從而擴展我們在海上的打擊能力。"
 air_torpedoe_2: "改進型空射魚雷"
 air_torpedoe_2_desc: "標準化的發射架和規格評級，有助於開發更大、威力更強的魚雷，同時也能提高它們的通用性。"
 air_torpedoe_3: "先進型空射魚雷"
 air_torpedoe_3_desc: "開發出的入水後自動脫落的新型輕量化配件，使空投魚雷的命中精度大幅提升，同時也提高了投放飛行器的安全性。"
 photo_reconnaisance: "攝像偵察"
 photo_reconnaisance_desc: "飛機最早的軍事應用就是搜尋敵人，並將其方位報告給地面上的將軍們。時至今日，這仍然是軍事航空最常見的任務之一。"
 aa_lmg: "輕機槍"
 aa_lmg_desc: "自上次大戰以來，發射步槍口徑子彈的機槍已經成為了主流的空對空武器。"
 survivability_studies: "生存性能研究"
 survivability_studies_desc: "通過細緻研究成功返航的飛機遭受的損傷，我們可以準確地判斷出飛機上的哪些部件是真正至關重要的。"
 aircraft_construction: "飛機結構"
 aircraft_construction_desc: "自使用膠合板和織物以來，飛機制造技術已經過了長久的發展。而最新的技術能夠允許飛機更好地執行特定的任務。"
 aa_hmg: "重機槍"
 aa_hmg_desc: "與老式飛機相比，現代飛機比能承受多得多的損傷，且其更高的機動性意味著被擊中的概率更低。因此，為了每一次命中都能造成最大程度的損傷，我們需要口徑更大的武器。"
 aa_cannon_1: "機炮 I"
 aa_cannon_1_desc: "機炮炮彈可以擊穿最堅固的飛機，也可以裝載足量的炸藥，在擊中時造成嚴重損傷。"
 aa_cannon_2: "大型機炮"
 aa_cannon_2_desc: "擁有更大的口徑和更大的彈體，這些機炮只需單次命中即可擊落大型飛機。"
 aa_cannon_3: "機炮 II"
 aa_cannon_3_desc: "有了以高彈速發射大型炮彈的現代機炮，即使是最堅固的飛行器也將被我軍擊落。"
 engines_1: "引擎 I"
 engines_1_desc: "飛機引擎不僅需要強大，還應輕便可靠。此種引擎設計滿足了飛機航空的動力需求，但在某種程度上亦限制了其充分發揮潛力。"
 engines_2: "引擎 II"
 engines_2_desc: "飛機速度的躍升需要其引擎功率的相應躍升。"
 engines_3: "引擎 III"
 engines_3_desc: "$engine_3_1x_desc$"
 engines_4: "引擎 IV"
 engines_4_desc: "$engine_4_1x_desc$"
 range_improvements: "航程改進"
 range_improvements_desc: "要想提高飛機航程，增加燃料容量是看起來最直接的辦法。但實際上，在不過度影響飛行性能的前提下增加足夠的燃料容量絕非易事。"
 sp_centrifugal_jet_tech: "離心式噴氣發動機"
 sp_centrifugal_jet_tech_desc: "離心式噴氣引擎使用單級壓縮機壓縮進氣，然後將其排出以產生推力。這就產生了更小、更容易維護的發動機。"
 jet_engine_axial_1x: "1x軸流式噴氣引擎"
 jet_engine_axial_1x_desc: "通過依次安裝多個壓縮機，軸流式引擎能夠將單級噴氣發動機產生的推力倍增。"
 jet_engine_axial_2x: "2x軸流式噴氣引擎"
 jet_engine_axial_2x_desc: "$engine_1_2x_desc$"
 jet_engine_axial_3x: "3x軸流式噴氣引擎"
 jet_engine_axial_3x_desc: "$engine_1_3x_desc$"
 jet_engine_axial_4x: "4x軸流式噴氣引擎"
 jet_engine_axial_4x_desc: "$engine_1_4x_desc$"
 jet_engine_axial_6x: "6x軸流式噴氣引擎"
 jet_engine_axial_6x_desc: "$engine_1_6x_desc$"
