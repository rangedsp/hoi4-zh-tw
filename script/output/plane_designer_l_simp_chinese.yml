 plane_modules_tech: "飛機模塊"
 AIR_TITLE_MOTHERSHIP: "空天母艦"
 AIR_TITLE_MOTHERSHIP_DESC: "空天母艦是一種大型飛行器，被設計用於攜帶並部署小型戰機投入戰場，顯著擴展了這些戰機的作戰範圍，遠超單個戰機獨立的作戰距離。"
