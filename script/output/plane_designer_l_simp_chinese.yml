 bba_air_techs_folder: "$air_techs_folder$"
 bba_air_techs_folder_desc: "$air_techs_folder_desc$"
 engine_1_1x: "1x 引擎 I"
 engine_1_1x_desc: "這種基本引擎可靠且造價低廉，但推力並不高。"
 engine_1_2x: "2x 引擎 I"
 engine_1_2x_desc: "雙引擎使飛機的推力顯著增加，但要付出相應的代價。"
 engine_1_3x: "3x 引擎 I"
 engine_1_3x_desc: "三臺引擎能夠提供比兩臺引擎更大的推力，且不如四臺引擎那麼昂貴。"
 engine_1_4x: "4x 引擎 I"
 engine_1_4x_desc: "四臺引擎能夠為重型飛機提供足夠的推力，並允許其攜帶可觀的載荷。"
 engine_1_6x: "6x 引擎 I"
 engine_1_6x_desc: "有了六臺引擎，任何飛機都能夠以不錯的速度攜帶大量載荷執行長距離任務。"
 engine_2_1x: "1x 引擎 II"
 engine_2_1x_desc: "更大更有力的引擎能夠提供更高的速度，並允許飛機攜帶更大的載荷。"
 engine_2_2x: "2x 引擎 II"
 engine_2_2x_desc: "$engine_1_2x_desc$"
 engine_2_3x: "3x 引擎 II"
 engine_2_3x_desc: "$engine_1_3x_desc$"
 engine_2_4x: "4x 引擎 II"
 engine_2_4x_desc: "$engine_1_4x_desc$"
 engine_2_6x: "6x 引擎 II"
 engine_2_6x_desc: "$engine_1_6x_desc$"
 engine_3_1x: "1x 引擎 III"
 engine_3_1x_desc: "該引擎具有甲醇噴射和自動混合等功能，使得其推力具有顯著的提高。"
 engine_3_2x: "2x 引擎 III"
 engine_3_2x_desc: "$engine_1_2x_desc$"
 engine_3_3x: "3x 引擎 III"
 engine_3_3x_desc: "$engine_1_3x_desc$"
 engine_3_4x: "4x 引擎 III"
 engine_3_4x_desc: "$engine_1_4x_desc$"
 engine_3_6x: "6x 引擎 III"
 engine_3_6x_desc: "$engine_1_6x_desc$"
 engine_4_1x: "1x 引擎 IV"
 engine_4_1x_desc: "這臺引擎經過大量的工程設計以避免錯過任何提升性能的可能，代表著活塞引擎技術的絕對巔峰。"
 engine_4_2x: "2x 引擎 IV"
 engine_4_2x_desc: "$engine_1_2x_desc$"
 engine_4_3x: "3x 引擎 IV"
 engine_4_3x_desc: "$engine_1_3x_desc$"
 engine_4_4x: "4x 引擎 IV"
 engine_4_4x_desc: "$engine_1_4x_desc$"
 engine_4_6x: "6x 引擎 IV"
 engine_4_6x_desc: "$engine_1_6x_desc$"
 jet_engine_1x: "1x 噴氣式引擎"
 jet_engine_1x_desc: "這種複雜而多變的引擎以完全不同的方式為飛機提供動力，且仍能大幅增加飛機的推力和速度。"
 jet_engine_2x: "2x 噴氣式引擎"
 jet_engine_2x_desc: "$engine_1_2x_desc$"
 jet_engine_3x: "3x 噴氣式引擎"
 jet_engine_3x_desc: "$engine_1_3x_desc$"
 jet_engine_4x: "4x 噴氣式引擎"
 jet_engine_4x_desc: "$engine_1_4x_desc$"
 jet_engine_6x: "6x 噴氣式引擎"
 jet_engine_6x_desc: "$engine_1_6x_desc$"
 rocket_engine_1: "火箭引擎 I"
 rocket_engine_1_desc: "這種發動機利用幾種易揮發的燃料和不穩定的氧化劑釋放大量的推力，以航程為代價使飛機能夠高速飛行。"
 rocket_engine_2: "火箭引擎 II"
 rocket_engine_2_desc: "對燃燒室的改進和對燃油混合物配比的些許調整使得這種發動機具有更高的性能，但其航程也隨之減小。"
 rocket_engine_3: "火箭引擎 III"
 rocket_engine_3_desc: ""
 light_mg_2x: "2x 輕機槍"
 light_mg_2x_desc: "兩支步槍口徑的機槍對空中目標的火力略有增加，且成本適中。"
 light_mg_4x: "4x 輕機槍"
 light_mg_4x_desc: "雖然四支步槍口徑的武器在破壞性上略有不足，但其數量彌補了這一點。"
 aircraft_cannon_1_1x: "1x 機炮 I"
 aircraft_cannon_1_1x_desc: "自動機炮能夠對空中目標傾瀉可觀的火力，但增加的額外重量會使得飛機的速度和機動性都有所降低。"
 aircraft_cannon_1_2x: "2x 機炮 I"
 aircraft_cannon_1_2x_desc: "兩門自動機炮為飛機提供了一種令人生畏的前向武器，足以對付空中目標和非裝甲地面目標。但這也相應地增加了飛機的重量並犧牲了一定敏捷性。"
 bomb_locks: "炸彈掛架"
 bomb_locks_desc: "在機翼或機身下方安裝小型炸彈掛載裝置，可以提高飛機打擊地面目標的成功率。"
 heavy_bomb_locks: "重型炸彈掛架"
 heavy_bomb_locks_desc: "在機翼或機身下方安裝大型炸彈掛載裝置，使飛機可以有效地打擊地面目標。"
 armor_piercing_bomb_locks: "穿甲炸彈掛架"
 armor_piercing_bomb_locks_desc: "在機翼或機身下方安裝大型穿甲炸彈掛載裝置，使飛機可以有效地打擊海上目標。"
 torpedo_mounting: "輕型魚雷掛架"
 torpedo_mounting_desc: "可將輕型魚雷安裝在機身下方的掛點，為飛機提供了一種用於摧毀敵艦的強力武器。"
 torpedo_mounting_2: "中型魚雷掛架"
 torpedo_mounting_2_desc: "可將中型魚雷安裝在機身下方的掛點，為飛機提供了一種用於摧毀敵艦的強力武器。"
 torpedo_mounting_3: "重型魚雷掛架"
 torpedo_mounting_3_desc: "可將重型魚雷安裝在機身下方的掛點，為飛機提供了一種用於摧毀敵艦的強力武器。"
 armor_plate_small: "裝甲板"
 armor_plate_small_desc: "飛行員座位後方和引擎周圍的鋼板提高了飛機面對來自後方的襲擊和地面火力時的生存能力。"
 heavy_mg_2x: "2x 重機槍"
 heavy_mg_2x_desc: "一對重機槍能擊穿現代飛機加固過的外蒙皮。"
 heavy_mg_4x: "4x 重機槍"
 heavy_mg_4x_desc: "四挺重機槍無論單獨還是一起使用都具有強大的威力。"
 aircraft_cannon_2_1x: "1x 機炮 II"
 aircraft_cannon_2_1x_desc: "一種發射大型高速炮彈的現代機炮。無論是戰鬥機還是戰略轟炸機，這種武器都能一概擊落。"
 aircraft_cannon_2_2x: "2x 機炮 II"
 aircraft_cannon_2_2x_desc: "兩門機炮為飛機提供了可觀的打擊能力，火力上的提升使得對敵機造成致命的傷害更為輕鬆。"
 large_aircraft_cannon_1x: "1x 大型機炮"
 large_aircraft_cannon_1x_desc: "這種武器以較低的彈速發射比舊式自動機炮更大更強的炮彈，甚至只需單次命中即可擊落一架大型飛機。"
 large_aircraft_cannon_2x: "2x 大型機炮"
 large_aircraft_cannon_2x_desc: "兩門機炮為飛機提供了可觀的打擊能力，火力上的提升使得對敵機造成致命的傷害更為輕鬆。"
 small_bomb_bay: "小型炸彈艙"
 small_bomb_bay_desc: "用於搭載炸彈的小型彈艙。處於機身內部的設計能夠降低阻力，但為安裝這種彈艙而作出的結構性改變意味著飛機在空戰中無法進行劇烈的機動動作。"
 medium_bomb_bay: "中型炸彈艙"
 medium_bomb_bay_desc: "中等大小的彈艙可以容納足夠的彈藥以打擊各式各樣的目標。"
 large_bomb_bay: "大型炸彈艙"
 large_bomb_bay_desc: "通過安裝能夠攜帶大量炸彈的大型彈艙，可以破壞甚至徹底摧毀大量的工廠和其他堅固的目標。"
 tank_buster_1: "反坦克機炮 I"
 tank_buster_1_desc: "該炮由陸軍使用的反坦克炮改造而成，可以用精確的射擊摧毀現代坦克。然而它的重量和笨拙的結構嚴重限制了飛機的性能。"
 tank_buster_2: "反坦克機炮 II"
 tank_buster_2_desc: "現役的重型坦克需要更大型的炮來擊毀。這門武器雖極為沉重和笨拙，但的確是攻擊敵人坦克部隊的利器。"
 fuel_tanks_small: "額外油箱"
 fuel_tanks_small_desc: "將更多的機身內部空間用於裝載燃料可以增加飛機的航程，但也使飛機更加易燃。"
 self_sealing_fuel_tanks_small: "自動密封式油箱"
 self_sealing_fuel_tanks_small_desc: "在油箱周圍包裹一層經過特殊處理的橡膠可使飛機不會因油箱被擊中而癱瘓，因為油箱會逐漸自行密封以防止燃油的損失。"
 armor_plate_medium: "$armor_plate_small$"
 armor_plate_medium_desc: "在引擎和機身脆弱的部分周圍安裝裝甲會使飛機的生存能力顯著提高，但會降低其航程。"
 fuel_tanks_medium: "$fuel_tanks_small$"
 fuel_tanks_medium_desc: "$fuel_tanks_small_desc$"
 self_sealing_fuel_tanks_medium: "$self_sealing_fuel_tanks_small$"
 self_sealing_fuel_tanks_medium_desc: "$self_sealing_fuel_tanks_small_desc$"
 armor_plate_large: "$armor_plate_small$"
 armor_plate_large_desc: "大量的鋼板保護著飛機的發動機、油箱和乘員艙等關鍵部位，使飛機能夠抵禦除了防空炮直接命中以外的任何攻擊，同時也使其難以被戰鬥機擊落。"
 fuel_tanks_large: "$fuel_tanks_small$"
 fuel_tanks_large_desc: "$fuel_tanks_small_desc$"
 self_sealing_fuel_tanks_large: "$self_sealing_fuel_tanks_small$"
 self_sealing_fuel_tanks_large_desc: "$self_sealing_fuel_tanks_small_desc$"
 lmg_defense_turret: "輕機槍防禦炮塔"
 lmg_defense_turret_desc: "儘管一挺安裝在炮塔中的輕機槍應付空對空戰鬥時有些力不從心，但還是能讓針對這架飛機的攻擊面臨更大的危險。"
 lmg_defense_turret_2x: "輕機槍防禦炮塔 2x"
 lmg_defense_turret_2x_desc: "裝有兩挺輕機槍的電動炮塔能夠覆蓋更廣的範圍，使飛機成為更難以被攻擊的目標。"
 hmg_defense_turret: "重機槍防禦炮塔"
 hmg_defense_turret_desc: "安裝在旋轉炮塔上的重機槍可以讓防禦者對裝備類似武器的戰鬥機進行有一定效果的反擊。"
 hmg_defense_turret_2x: "重機槍防禦炮塔 2x"
 hmg_defense_turret_2x_desc: "裝有重機槍的兩座電動炮塔使得飛機對任何來襲的戰鬥機來說都是一個危險的目標。"
 cannon_defense_turret: "機炮防禦炮塔"
 cannon_defense_turret_desc: "裝配在可迴轉炮塔上的現代機炮顯著改變了空戰進攻方和防禦方的力量平衡。鮮有戰鬥機能在承受一記來自現代機炮的直擊後繼續戰鬥。"
 cannon_defense_turret_2x: "機炮防禦炮塔 2x"
 cannon_defense_turret_2x_desc: "兩座裝有自動機炮的炮塔為飛機提供了一種可怕的防禦性力量，任何膽敢襲擊它的戰鬥機都將陷入重重危機。"
 rocket_rails: "火箭發射軌"
 rocket_rails_desc: "用於在機翼下方懸掛非制導火箭。由於從進攻飛機的前方發射，和投擲炸彈相比，飛行員更容易將火箭對準目標。"
 bomb_sights_1: "轟炸瞄準具 I"
 bomb_sights_1_desc: "一個複雜的機械式計算機在綜合分析風偏、終端速度和海拔後能讓投彈手以高精度投下炸彈。"
 bomb_sights_2: "轟炸瞄準具 II"
 bomb_sights_2_desc: "過去使用的轟炸瞄準具經常需要冗長的設置後才能得出瞄準方案，而這種完全穩定的轟炸瞄準具只需幾秒鐘就能完成計算，其高性能甚至可以補償較淺的俯衝帶來的影響。"
 radio_navigation_1: "無線電導航 I"
 radio_navigation_1_desc: "利用一個無線電接收器檢測兩束導航電波，並應用交叉原理進行定位，甚至能夠使在完全的黑暗當中找到目標成為可能。"
 radio_navigation_2: "無線電導航 II"
 radio_navigation_2_desc: "一個能夠提供多種輔助測距功能的無線電接收器即使在投彈手無法目視目標時也能告知其釋放炸彈的準確時機。"
 air_ground_radar_1: "空地雷達 I"
 air_ground_radar_1_desc: "一個機載雷達裝置，能向領航員提供對飛機下方地形的精確描繪，即使在黑暗中或惡劣天氣下也能實現精確導航。"
 air_ground_radar_2: "空地雷達 II"
 air_ground_radar_2_desc: "有了比早期型號更高的分辨率，這種雷達甚至使穿過雲層實施精確轟炸成為可能。"
 air_air_radar_1: "空空雷達 I"
 air_air_radar_1_desc: "一組機載雷達天線能幫助受過訓練的操作員發現空中目標，即便是在黑夜。"
 air_air_radar_2: "空空雷達 II"
 air_air_radar_2_desc: "有了功率更大的發射器，這種雷達裝置能在更遠距離探測目標。"
 non_strategic_materials_small: "使用非戰略資源材料"
 non_strategic_materials_small_desc: "利用特別處理的木材和織物儘可能地替代鋁能顯著降低我們對戰略資源的使用。但這些材料顯然無法有效地抵禦現代武器。"
 drop_tanks: "可拋棄式副油箱"
 drop_tanks_desc: "攜帶額外燃料的可丟棄小型油箱在進攻性任務中為我們的戰鬥機提供了額外航程。由於戰鬥前會丟棄這些油箱，戰鬥性能不會受到影響。"
 dive_brakes_small: "俯衝減速板"
 dive_brakes_small_desc: "當飛機進入俯衝狀態時，機翼後緣的一組擾流片就會展開，降低整體速度，從而讓飛機在不撕毀機翼的情況下爬升出陡峭的俯衝。這反過來允許飛機從接近垂直的俯衝攻擊，大大提高了精確度。"
 non_strategic_materials_medium: "$non_strategic_materials_small$"
 non_strategic_materials_medium_desc: "$non_strategic_materials_small_desc$"
 non_strategic_materials_large: "$non_strategic_materials_small$"
 non_strategic_materials_large_desc: "$non_strategic_materials_small_desc$"
 floats: "浮筒"
 floats_desc: "安裝在機身下方的漂浮裝置允許飛機降落在水面上。這將使偵查敵方海軍設施與艦船的任務更加簡單，但這同樣也會極大的降低機動性。"
 flying_boat_medium: "船身式改造"
 flying_boat_medium_desc: "飛機的底部可由起落架設計改造為可在水上漂浮和降落的設計，使得水上偵查任務更為輕鬆。"
 flying_boat_large: "$flying_boat_medium$"
 flying_boat_large_desc: "$flying_boat_medium_desc$"
 guided_anti_ship_missile: "制導反艦導彈"
 guided_anti_ship_missile_desc: "這種新型武器實際上是配有火箭引擎和無線電制導的反艦炸彈，能對目前所有的水面艦艇造成極大的威脅。"
 bouncing_bomb_release: "彈跳炸彈投彈裝置"
 bouncing_bomb_release_desc: "這是用於攜帶和投放特製彈跳炸彈的炸彈架，這些炸彈會在水面上彈跳滑行直到擊中目標。該裝置在釋放炸彈時會使炸彈反向旋轉，使其更有可能抵達預定的作戰目標。"
 earthshaker_bomb_release: "地震炸彈投彈裝置"
 earthshaker_bomb_release_desc: "一種大型地震炸彈的彈架和釋放機構，這種炸彈被設計用於撞擊並穿透地面並在地下爆炸，會對目標造成巨大的結構破壞。"
 rocket_propelled_bombs: "火箭推進炸彈"
 rocket_propelled_bombs_desc: "火箭推進的非制導炸彈能夠對艦船和類似的重裝甲大型目標造成相當大的破壞。"
 improved_rocket_propelled_bombs: "重型火箭推進炸彈"
 improved_rocket_propelled_bombs_desc: "更大尺寸的火箭推進的非制導炸彈，攜帶更重的彈頭，能夠更有效地穿透目標。"
 fixed_explosive_charge: "固定炸藥"
 fixed_explosive_charge_desc: "一種固定式的中空炸藥將整架飛機變為一個飛行的炸彈。若飛機撞向敵軍艦艇，將以損失飛機和乘員為代價造成嚴重的破壞。"
 recon_camera: "偵察相機"
 recon_camera_desc: "一組配有特殊鏡頭的照相機，允許飛機從高海拔拍攝敵軍編隊和設施的精確照片。"
 airdropped_mines: "空投水雷"
 airdropped_mines_desc: "一組配有降落傘的水雷，能從飛機上投下。"
 demining_coil: "排雷線圈"
 demining_coil_desc: "安裝在機身上的一座大型線圈使飛機能產生強力磁場，引爆航線上的磁性水雷。"
 small_plane_airframe_0: "戰間期小型機身"
 small_plane_airframe_0_desc: "自世界大戰早期開始，航空技術便在迅速進步。這種機身代表了這些發展的頂峰，但它的成長潛能顯然有限。"
 small_plane_airframe_1: "基礎小型機身"
 small_plane_airframe_1_desc: "近年來，一系列新技術的誕生使得生產好用的小型飛機成為可能。這種機身代表了這條道路的第一步。"
 small_plane_airframe_2: "改進型小型機身"
 small_plane_airframe_2_desc: "有了更堅固、更符合空氣動力學的結構，這種機身象徵著對於基礎型號的一次明顯的進步。"
 small_plane_airframe_3: "先進型小型機身"
 small_plane_airframe_3_desc: "為了性能而進行了徹底的優化，這種機身代表了活塞式飛機能達到的最高水平。"
 small_plane_airframe_4: "現代小型機身"
 small_plane_airframe_4_desc: "這種機身設計利用了現代發動機提供的高速並解決了高次音速飛行所帶來的一些結構性問題。"
 small_plane_airframe_5: "超音速小型機身"
 small_plane_airframe_5_desc: "這種先進機身能夠以1馬赫超音速飛行，體現了人類工程學的巔峰。"
