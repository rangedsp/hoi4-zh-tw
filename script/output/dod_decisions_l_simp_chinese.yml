 YUG_instigate_in_bulgaria: "煽動保加利亞農民起義"
 YUG_instigate_in_bulgaria_desc: "除了保加利亞外，幾乎所有的南斯拉夫工人階級均已被我國解放。如今只有鼓動保加利亞人民自己站出來打倒其壓迫者，我們才能真正光榮地宣告，全巴爾幹地區的斯拉夫工人大眾實現了徹底的解放。"
 YUG_instigate_in_albania: "煽動阿爾巴尼亞農民起義"
 YUG_instigate_in_albania_desc: "儘管阿爾巴尼亞人並不認同自身的斯拉夫身份，但鑑於我們兩國邊界毗鄰，兩族文化往來密切，他們理所當然將成為被納入到泛斯拉夫工人大會的合適族群。"
 YUG_instigate_in_greece: "煽動希臘農民起義"
 YUG_instigate_in_romania: "煽動羅馬尼亞農民起義"
 YUG_instigate_in_hungary: "煽動匈牙利農民起義"
 YUG_instigate_in_turkey: "煽動土耳其農民起義"
 YUG_propaganda_in_target: "對[YUG_communist_coup_target.GetNameDef]宣傳運動"
 YUG_propaganda_in_target_desc: "既然目標已經確定，現在要做的便是為我們的社會主義盟友們提供有力的宣傳造勢，如此一來，我們很快就將埋下顛覆巴爾幹地區上層統治階級的反抗火種。"
 YUG_arm_communist_militants: "武裝[YUG_communist_coup_target.GetAdjective]激進成員"
 YUG_arm_communist_militants_desc: "我們不能僅憑言語就將革命的勝利帶給外國的同志們，為此我們必須為盟友們提供推翻其壓迫者所必需的武器裝備。"
 YUG_communist_coup: "策動共產主義政變"
 YUG_communist_coup_desc: "激進同志們已經做好了充分的準備，我們現在所要做的便是為他們的過境潛入提供協助，其後，他們將會發動政變來推翻其國家腐朽的資本主義政權！"
 YUG_abandon_communist_effort: "放棄對[YUG_communist_coup_target.GetNameDef]進行輸出"
 YUG_abandon_communist_effort_desc: "很顯然，[YUG_communist_coup_target.GetNameDef]人民尚未做好準備砸碎本國現任政府的枷鎖贏得自由。我們必須放棄在該國策動共產主義政變的嘗試。"
 YUG_uprising_strength_tt: "在目前的支持力度下，§Y共產主義黨派§!的力量為[YUG_communist_coup_target.Get_Yugo_Uprising_strength]。\n此數值基於其目前的§Y共產主義黨派§!支持度以及農民被武裝的次數得出。"
