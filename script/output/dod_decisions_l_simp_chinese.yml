 ROM_change_sides_to_allies_desc: "隨著我國政府的更迭，我國在戰時的結盟政策亦發生了變化。加入同盟國後，我們在這場全球衝突中目前的“戰友們”將驚愕地看到羅馬尼亞的槍口轉向新的目標。"
 ROM_change_sides_to_commintern: "加入共產國際"
