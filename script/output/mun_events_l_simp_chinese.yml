l_simp_chinese:
 ##CZECHOSLOVAKIA##
 MUN_czech_skoda_priority.t: "斯柯達工廠"
 MUN_czech_skoda_priority.d: "斯柯達工廠涵蓋了多個領域，從火炮、坦克、列車和艦炮都有生產。我們可以在一定程度上予以指示，將資源轉移到需求最大的領域。"
 MUN_czech_skoda_priority.1.a: "有趣"
 MUN_czech.2.t.1: "蘇臺德地區準軍事部隊請求援助"
 MUN_czech.2.t.2: "蘇臺德自由軍團請求援助"
 MUN_czech.2.t.3: "蘇臺德工人民兵尋求幫助"
 MUN_czech.2.d.1: "得知我們對[CZE.getname]的計劃後，許多蘇臺德政黨迅速在蘇臺德各地建立準軍事組織，希望動搖[CZE.GetAdjective]政府。他們現在請求我們支持跨境襲擊和破壞行動，以幫助我們打擊[CZE.getname]。"
 MUN_czech.2.d.2: "得知我們對[CZE.getname]的計劃後，許多蘇臺德政黨迅速動員了他們的準軍事組織：蘇臺德自由軍。蘇臺德各地的自由軍集結起來，開始攻擊[CZE.GetAdjective]政府在蘇臺德的資產。他們現在請求我們全力支持他們針對[CZE.getname]的跨境襲擊和破壞行動。"
 MUN_czech.2.d.3: "得知我們對[CZE.getname]的計劃後，當地共產主義黨派迅速動員了工人民兵。這些工人民兵集結起來，開始攻擊[CZE.GetAdjective]政府在蘇臺德的資產。他們現在請求我們全力支持他們針對[CZE.getname]和其他反革命分子的跨境襲擊和破壞行動。"
 MUN_czech.2.a: "我們當然會予以協助"
 MUN_czech.2.b: "最好別再縱容他們"
 MUN_czech.3.t: "蘇臺德游擊活動"
 MUN_czech.3.d: "最近[FROM.getname]表示有興趣吞併蘇臺德地區的消息，導致以蘇臺德為基地的準軍事組織開始對我們發動游擊戰。他們開始襲擊政府大樓，並破壞我們在一些地區的防禦。如果我們希望改善在該地區的軍事形勢，就必須解決這些準軍事組織。"
 MUN_czech.3.a: "事態還能更糟嗎？"
 MUN_czech.4.t: "信任危機"
 MUN_czech.4.d: "最近針對我們的軍事入侵的消息動搖了政府的核心。[CZE.GetLeader]對政府領導國家度過這場危機的能力失去了信心。他要求$CZE_jan_syrovy$接管並領導國家。$CZE_jan_syrovy$曾表示拒絕，但考慮到目前的形勢，[CZE.GetLeader]告訴他，他別無選擇，只能指揮並帶領我們度過這場危機。"
 MUN_czech.4.a: "我們前所未有地需要你"
 MUN_czech.4.b: "我們不能失去我們的領袖"
 MUN_czech.5.t: "托馬什·馬薩里克逝世"
 MUN_czech.5.d: "馬薩里克在捷克斯洛伐克政壇穩定活躍了二十多年。當聯盟被認為不可能建立，政治僵局過大難以克服時，馬薩里克一次又一次創造了政治奇蹟，幫助加強和發展捷克斯洛伐克，使其成為今天的樣子。全國人民都會深深懷念他。"
 MUN_czech.5.a: "不可替代的政治巨人"
 MUN_czech.7.t: "重新評估對[CZE.getnamedef]的承諾"
 MUN_czech.7.d: "據最新消息，[GER.getnamedef]意圖吞併蘇臺德地區，並不惜與[CZE.getnamedef]開戰達成目的。我們目前與[CZE.getnamedef]簽有防禦協議，若其與[GER.getnamedef]開戰，我們將有義務支援。若想避免介入，我們必須立即終止與[CZE.getnamedef]的防禦協議。"
 MUN_czech.7.a: "我們支持我們的朋友"
 MUN_czech.7.b: "我們對抗[GER.getnamedef]毫無勝算"
 MUN_czech.1001.t: "[FROM.GetNameDefCap]要求獲得通往[SOV.GetNameDef]的走廊"
 MUN_czech.1001.d: "為了協調與[SOV.GetNameDef]的軍事行動，[FROM.GetNameDef]要求我們將[89.GetName]和[91.GetName]的邊境地區割讓給他們。"
 MUN_czech.1002.t: "[FROM.GetNameDefCap]要求對南斯拉夫聯盟施加影響力"
 MUN_czech.1002.d: "在向南擴張之後，[FROM.GetName]提出了一個不同尋常的要求。他們並不尋求領土，而是要求控制南巴爾幹地區國家現有的“南斯拉夫防衛同盟”，成為這些附屬國的保護者和宗主。他們聲稱自己比我們更有能力擔任這些國家的保護者，但這當然也可能只是藉口。"
 MUN_czech.1002.a: "也許他們說得有道理。"
 MUN_czech.1002.b: "不，他們在我們的保護之下！"
 MUN_czech.1003.t: "[FROM.GetName]拒絕要求"
 MUN_czech.1003.d: "儘管我們的外交官提出了令人信服的論點，[FROM.GetNameDef]仍拒絕了我們的要求。"
 MUN_czech.1003.a: "他們讓我們別無選擇"
 MUN_czech.1004.t: "[FROM.GetName]對匈牙利採取行動"
 MUN_czech.1004.d: "[ROOT.capital.GetCapitalVictoryPointName]得報，[FROM.GetAdjective]軍隊正在逼近[HUN.GetAdjective]邊境。雖然[HUN.GetAdjective]方面很快可能會聯繫我們，但我們應儘早決定是否協助[HUN.GetNameDef]以爭取潛在盟友，還是讓[FROM.GetNameDef]繼續執行其當前計劃。"
 MUN_czech.1004.a: "我們應保護我們的利益"
 MUN_czech.1004.b: "我們不應介入此事"
 MUN_czech.1005.t: "[FROM.GetName]索要沿海領土"
 MUN_czech.1005.d: "隨著[FROM.GetNameDef]不斷擴張，他們派出代表如今要求我們割讓一些曾為[FROM.GetAdjective]貴族所擁有的領地。他們稱這將賦予其通往亞得里亞海的潛在通道，顯然並不在意我們的看法。"
 MUN_czech.1006.t: "[FROM.GetName]提議建立夥伴關係"
 MUN_czech.1006.d: "[FROM.GetNameDef]提議簽訂一項共同防禦條約，以此聯合我們兩國的軍力來震懾潛在敵人。有趣的是，該條約還有一部分秘密內容，涉及[ROOT.GetAdjective]勢力可能擴張的計劃，以及[FROM.GetNameDef]如何協助我們實現這一目標。"
 MUN_czech.1007.t: "[FROM.GetName]要求結盟"
 MUN_czech.1007.d: "我們與[FROM.GetNameDef]之間自成立以來就缺乏互信，如今他們要求我們站隊，否則將面臨入侵。然而，[FROM.GetNameDef]也在迎合我們的領土野心，承諾若我們放棄對他們領土的要求，他們將協助我們奪取我們宣稱的其他領土。"
 MUN_czech.1007.b: "我們必須維護主權！"
 MUN_czech.1008.t: "[FROM.GetName]建議聯合[CZE_invited_country.GetName]"
 MUN_czech.1008.d: "我們通往中歐的橋梁[FROM.GetNameDef]的代表提議邀請[CZE_invited_country.GetName]加入我們的聯盟。"
 MUN_czech.1008.a: "進一步威懾試圖攻擊我們的勢力"
 MUN_czech.1008.b: "我們無法保衛整個歐洲"
 MUN_czech.1009.t: "[FROM.GetName]邀請我們加入[CZE.GetFactionName]"
 MUN_czech.1009.d: "[FROM.GetNameDef]的外交官表示，十分歡迎我們加入他們的聯盟。然而過去我們對[FROM.GetNameDef]的領土主張曾是雙方關係的爭議焦點。現在我們必須決定，是繼續堅持這些領土宣稱，還是專注於建立友好關係。"
 MUN_czech.1009.a: "為我們的新盟友乾杯！"
 MUN_czech.1009.b: "在他們承認我們的領土宣稱後我們將加入聯盟。"
 MUN_czech.1009.c: "我們對此毫無興趣。"
 MUN_czech.1010.t: "[FROM.GetName]邀請我們領導[CZE.GetFactionName]"
 MUN_czech.1010.d: "在最近嘗試將小協約國變成真正的聯盟後，[FROM.GetNameDef]提議讓我們領導這個新陣營。他們將放棄領導權，由我們擔任守護者，這項協議將擴大我們的勢力範圍，但也可能會讓其他國家感受到威脅。"
 MUN_czech.1010.a: "他們將是寶貴的盟友"
 MUN_czech.1010.b: "保護[ROOT.GetNameDef]已經夠了"
 MUN_czech.1011.t: "[FROM.GetName]提出保護協議"
 MUN_czech.1011.d: "作為威懾任何對[FROM.GetNameDef]發動侵略的手段，他們的外交官向我們提交了一份共同防禦條約草案。作為回報，他們也將為我們提供同等的保護，從而迫使任何進犯者陷入兩面作戰的困境。"
 MUN_czech.1011.a: "值得冒這個險"
 MUN_czech.1011.b: "保持中立更安全"
 MUN_czech.1012.t: "[FROM.GetName]要求我們臣服"
 MUN_czech.1012.d: "在建立新聯盟後信心倍增的[FROM.GetNameDef]提出了一系列要求，這些要求實際上意味著我們將失去主權。考慮到[SOV.GetName]對該地區的興趣並給予他們支持，我們必須決定是否還有能力拒絕。"
 MUN_czech.1012.a: "抵抗只會浪費[ROOT.GetAdjective]人的生命"
 MUN_czech.1012.b: "寧死不屈！"
 MUN_czech.1013.t: "[FROM.GetName]提議有條件結盟"
 MUN_czech.1013.d: "經過慎重考慮，[FROM.GetNameDef]政府宣佈，他們認同結盟的益處，但他們也宣佈，他們無法放棄領土的宣稱。因此，他們提議：他們將加入我們的陣營，但前提是我們放棄他們宣稱的領土。"
 MUN_czech.1013.a: "這個犧牲是值得的"
 MUN_czech.1013.b: "我們結盟就是要保衛領土！"
 MUN_czech.1014.t: "[FROM.GetName]請求保護"
 MUN_czech.1014.d: "來自[FROM.GetNameDef]的高級外交官拜訪了外交部長，要求我們落實《1935年捷克斯洛伐克-蘇聯條約》中措辭模糊的保護承諾。"
 MUN_czech.1014.a: "也許我們應盡力保護我們的盟友"
 MUN_czech.1014.b: "還是繼續保持模糊承諾"
 MUN_czech.1015.t: "[FROM.GetName]提議合併我們的派系"
 MUN_czech.1015.d: "如今我們有了共同的敵人，[FROM.GetName]向我們提出深化合作的建議，建議將我們陣營整合進他們的陣營。"
 MUN_czech.1015.a: "通力合作將拯救生命"
 MUN_czech.1015.b: "我們必須掌握主動權"
 MUN_czech.1016.t: "[FROM.GetName]提議互不侵犯條約"
 MUN_czech.1016.d: "在此前因外交方針改變而被中止的談判基礎上，[FROM.GetNameDef]提議繼續就互不侵犯條約進行談判。"
 MUN_czech.1016.a: "少一個需要防禦的邊境"
 MUN_czech.1016.b: "這會妨礙我們的雄心"
 MUN_czech.1017.t: "聯合入侵[GER.GetNameDef]？"
 MUN_czech.1017.d: "[FROM.GetNameDef]向[ROOT.GetAdjective]高層提交了一份秘密計劃，內容是入侵[GER.GetNameDef]。他們展示出消滅[GER.GetAdjective]威脅的堅定決心，請求我們提供協助，以聯手擊潰強大的[GER.GetAdjective]軍隊。"
 MUN_czech.1017.a: "我們將與他們共同打擊[GER.GetNameDef]！"
 MUN_czech.1017.b: "這太危險了"
 MUN_czech.1018.t: "單獨對抗[GER.GetNameDef]？"
 MUN_czech.1018.t.2: "聯合入侵[GER.GetNameDef]"
 MUN_czech.1018.d: "儘管我們做出了最大的外交努力，但沒有任何國家支持先發制人入侵[GER.GetName]。現在的問題是，我們是否要執行我們的攻擊計劃。"
 MUN_czech.1018.d.FRA_POL: "來自[FRA.GetNameDef]與[POL.GetNameDef]的捷報傳來。我們的外交官報告，兩國均已承諾協助我們發起對[GER.GetNameDef]的入侵。"
 MUN_czech.1018.d.FRA: "外交官自[FRA.GetNameDef]歸來，帶回振奮人心的消息：該國願與我們共同發起對[GER.GetNameDef]的聯合入侵。現在，我們必須評估聯軍的兵力是否足以完成這一任務。"
 MUN_czech.1018.d.POL: "外交官自[POL.GetNameDef]歸來，帶回振奮人心的消息：該國願與我們共同發起對[GER.GetNameDef]的聯合入侵。現在，我們必須評估聯軍的兵力是否足以完成這一任務。"
 MUN_czech.1018.a: "倘若真有那麼一天，他們也怪不了別人。"
 MUN_czech.1018.b: "事後看來，確實太過冒險。"
 MUN_czech.1019.t: "[FROM.GetName]索要[762.GetName]"
 MUN_czech.1019.d: "以恢復波希米亞舊有邊界、鞏固其對[72.GetName]的控制為理由，[FROM.GetAdjective]代表向我們提交最後通牒，要求我們割讓[762.GetName]。"
 MUN_czech.1019.a: "也許這將確保我們的安全"
 MUN_czech.1020.t: "[FROM.GetName]提議有條件投資"
 MUN_czech.1020.a: "好提議！"
 MUN_czech.1020.b: "這些條款讓人無法接受"
 MUN_czech.1020.d: "[FROM.GetNameDef]的外交官抵達，提出了一項協議：他們國家將投資於我們的工業和基礎設施，以換取一份資源協定。經歷了前些年失敗的投資，這一行動旨在改善我們之間的關係。"
 CZE_investment_effects_tt: "§Y100天§!後我們會獲得：\n§Y3§!個隨機地區的§Y基礎設施§!\n§Y1§!個隨機地區的§Y民用工廠§!\n"
 MUN_czech.1021.t: "重建奧匈關稅同盟？"
 MUN_czech.1021.d: "[CZE.GetNameDefCap]就之前奧匈帝國的貿易協議草案與我們聯繫。儘管對他們的獨立感到滿意，但新的[CZE.GetAdjective]政府似乎十分願意恢復奧匈國家的有利元素。"
 MUN_czech.1021.a: "更多的貿易聽起來很有吸引力"
 MUN_czech.1021.b: "我們必須保護國內的生產者"
 MUN_czech.1022.t: "[CZE.GetName]奪取西里西亞"
 MUN_czech.1022.d: "在[69.GetName]山區激烈戰鬥後，[CZE.GetAdjective]部隊突破敵軍防線，在敵軍恢復戰鬥能力前便掌控了整個西里西亞。"
 MUN_czech.1022.a: "我們必須干預"
 MUN_czech.1022.b: "我們不能再樹敵了"
 MUN_czech.1022.c: "偉大的勝利！"
 MUN_czech.1023.t: "[CZE.GetName]開始爭奪西里西亞"
 MUN_czech.1023.d: "[FROM.GetNameDef]援引中世紀王國和帝國的一些奇怪推理，將邊境的小規模衝突升級為有限戰爭，以建立對[ROOT.GetAdjective]西里西亞的控制。"
 MUN_czech.1023.a: "集結部隊"
 MUN_czech.1024.t: "[CZE.GetName]提出和平協議"
 MUN_czech.1024.d: "在西里西亞的邊境衝突升級為全面戰爭後，[FROM.GetNameDef]如今表示，只要他們提出的領土要求得到滿足，便願意結束這場戰爭。"
 MUN_czech.1024.a: "也許我們應將注意力轉向其他地區"
 MUN_czech.1024.b: "當前局勢對我們仍有利"
 MUN_czech.1024.c: "此事無可談判！"
 MUN_czech.1025.t: "西班牙志願軍行動的結束"
 MUN_czech.1025.d.1: "[ROOT.GetAdjective]派往[CZE_supported_spanish_faction.GetName]的部隊在幫助他們取得勝利後正在返鄉。戰鬥為我們的部隊，尤其是他們的醫療支隊開拓了視野。"
 MUN_czech.1025.d.2: "儘管[ROOT.GetAdjective]部隊在西班牙內戰中英勇作戰，但我們支持的一方最終還是被擊敗了。儘管如此，我們的部隊，特別是他們的醫療支隊還是獲得了寶貴的經驗。"
 MUN_czech.1025.a: "希望我們不必將這些經驗用在自己家裡"
 MUN_czech.1026.t: "[FROM.GetName]拒絕提議"
 MUN_czech.1026.a: "這是他們的損失"
 MUN_czech.1026.b: "令人擔憂的發展"
 MUN_czech.1026.france_refuses_to_lead: "儘管[FROM.GetAdjective]被提議加入我們的聯盟並擔任領導角色，他們仍選擇拒絕。這似乎表明[FROM.GetAdjective]希望保持中立，或仍在觀望局勢發展。"
 MUN_czech.1026.sphere_of_influence: "儘管[FROM.GetAdjective]政府成員對我們參與[ROOT.GetFactionName]表示感謝，但他們也指出，我們在巴爾幹地區擴大影響力的舉動過於激進，可能會嚇退潛在的盟友。"
 MUN_czech.1026.guarantee: "我們的外交官回報說，儘管他們付出了努力，[FROM.GetNameDef]還是不同意我們提出的共同防禦協議。看來他們認為我們面臨的風險要高於他們，但願他們錯了。"
 MUN_czech.1026.faction_merge: "儘管我們盡了最大努力，我們和[FROM.GetAdjective]的外交官還是未能達成一致，簽署協議統一[ROOT.GetFactionName]和[FROM.GetFactionName]。"
 MUN_czech.1026.non_aggression: "儘管[FROM.GetAdjective]的外交官向我們保證了他們的和平意向，但卻拒絕與我國簽署互不侵犯條約，具體原因未明。"
 MUN_czech.1026.trade_deal: "[FROM.GetNameDef]以希望保持經濟獨立為由，拒絕了我們提出的貿易協定。"
 MUN_czech.1026.faction_invite: "儘管我們的外交官提出了[FROM.GetNameDef]與我們結盟所能帶來的種種好處，但最終仍未能成功爭取他們的支持。"
 MUN_czech.1026.weapons_sale: "儘管我們提供了極具吸引力的報價，[FROM.GetNameDef]目前仍決定不購買我們的武器。"
 MUN_czech.1026.unification: "儘管他們承認聯邦制帶來的好處，[FROM.GetNameDef]仍將自己的流亡政府視為其領土的唯一合法政權。"
 MUN_czech.1026.white_peace: "我方代表今日帶回令人悲痛的消息：儘管我們已佔領[66.GetName]，[FROM.GetAdjective]領導層仍無意簽署和平條約。看來我們必須繼續推進征服行動，或者寄希望於拖垮對方。"
 MUN_czech.1027.t: "簽署[FROM.GetAdjective]-[ROOT.GetAdjective]貿易協議？"
 MUN_czech.1027.d: "儘管雙方在意識形態上存在初始分歧，[FROM.GetNameDef]還是向我們提出了務實的貿易協定建議。作為交換，[FROM.GetAdjective]將被允許在[202.GetName]開採資源，而他們則會向我們提供急需的機床，以擴大我們的工業產能。"
 MUN_czech.1027.a: "非常划算的交易"
 MUN_czech.1027.b: "我們應拒絕他們獲取這些資源"
 MUN_czech.1028.t: "防禦工事延期"
 MUN_czech.1028.d: "國內許多人現在質疑政府為什麼沒有繼續去年年底開始的防禦工事項目。政府已通過防禦工事委員會為額外的要塞建設工程撥款。由於該工程沒有取得進展，有些人要求繼續工程，有些人要求退還資金。如果我們確實希望繼續建造防禦工事，那麼就必須立即重啟工程，以便按時完工。"
 MUN_czech.1028.a: "我們沒有時間了！"
 CZE_no_time_to_lose_tt: "我們在威脅出現前完成防禦工事的時間不多了。"
 MUN_czech.1029.t: "防禦工事完工"
 MUN_czech.1029.d: "我們最近的防禦工事已經完工，可以開始將資源投入另一項工程中。我們的工程師已準備好在接到通知後立即部署到另一地點，開始新防禦工事的地基工作。"
 MUN_czech.1029.a: "幹得漂亮，先生們"
 MUN_czech.1030.t: "[FROM.GetName]要求整合"
 MUN_czech.1030.d: "[FROM.GetNameDefCap]要求我們加入他們的聯盟，因為他們正尋求擴展其聯盟影響力。儘管他們對該地區各國訴諸不同理由，如泛斯拉夫主義、泛巴爾幹主義，以及與奧匈帝國的共同歷史等，這一訴求中卻也明顯暗含著威脅：如果我們拒絕，後果自負。"
 MUN_czech.1030.a: "也許這也不算太糟"
 MUN_czech.1030.b: "不太令人信服"
 MUN_czech.1031.t: "[FROM.GetName]提議合邦"
 MUN_czech.1031.d: "儘管[ROOT.GetNameDef]已經投降，[FROM.GetAdjective]政府卻提出了一個激進的提議：將我們國家的殘餘部分併入他們國家，從而繼續戰鬥。"
 MUN_czech.1031.a: "團結一心讓我們能更好地保衛我們的家園"
 MUN_czech.1031.b: "我們之間的分歧太大了"
 MUN_czech.1032.t: "削除對立"
 CZE_divide_nation_title_dynamic_sudentenland: "在蘇臺德地區的$MUN_czech.1032.t$"
 CZE_divide_nation_title_dynamic_czech_states: "與捷克工人一道的$MUN_czech.1032.t$"
 CZE_divide_nation_title_dynamic_tesinko_poles: "[72.GetName]的$MUN_czech.1032.t$"
 CZE_divide_nation_title_dynamic_slovakia_states: "[SLO.GetNonIdeologyName]的$MUN_czech.1032.t$"
 CZE_divide_nation_title_dynamic_hungarian_states: "[664.GetName]的$MUN_czech.1032.t$"
 CZE_divide_nation_title_dynamic_ukrainian_states: "[73.GetName]的$MUN_czech.1032.t$"
 MUN_czech.1032.d: "近期解決[FROM.getname]地區問題的努力已成功緩解了民眾對中央政府的憤怒，我們政府的資源現在可以騰出來投入其他社會或經濟計劃，以持續應對那些正在分裂我國的問題。"
 MUN_czech.1032.a: "讓我們繼續"
 MUN_czech.1033.t: "[FROM.GetAdjective]流亡政府要求承認"
 MUN_czech.1033.d: "$CZE_edvard_benesh$領導的[FROM.GetAdjective]流亡政府要求我們接待他們的代表團，他們正在努力恢復[CZE.GetNonIdeologyName]的主權。"
 MUN_czech.1033.a: "對抗[GER.GetAdjective]的又一個盟友"
 MUN_czech.1033.b: "他們是非法的"
 MUN_czech.1034.t: "斯洛伐克的動盪"
 MUN_czech.1034.d: "由於我們向其他團體的民族主義情緒讓步，斯洛伐克人民黨成員組建了自己的準軍事部隊，正在尋求斯洛伐克獨立或至少自治。現在的問題是，我們是要阻止此事維持表面上的團結，還是允許此事並專注於忠於政府的土地。"
 MUN_czech.1034.a: "派遣軍隊進入斯洛伐克！"
 MUN_czech.1034.b: "阻止他們，但授予一些自治權。"
 MUN_czech.1034.c: "直接控制"
 MUN_czech.1034.c_tt: "§R我們將任由[GER.GetNameDef]擺佈捷克斯洛伐克的命運。§!"
 MUN_czech.1035.t: "[FROM.GetName]提議為我們製造武器"
 MUN_czech.1035.d: "鑑於我們與[CZE.GetNameDef]的緊密合作關係，他們提出了一項特殊的提議：他們將為我們製造我們國內正在生產的武器，當然，這是有條件的。這反過來將使我們能夠專注於產業的其他領域。"
 MUN_czech.1035.a: "這意味著能少些重複性工作"
 MUN_czech.1035.b: "我們不能讓軍隊依賴外國裝備"
 #MUN_czech.1036.t: "" #Event uses MUN_czech.1032.t
 MUN_czech.1036.d: "大蕭條在經濟和政治上對我國都沒什麼幫助。許多地方上的經濟和政治問題困擾著我們，即使我們奇蹟般地從大蕭條中復甦，這些問題似乎也在惡化。我們需要在這些問題進一步分裂國家之前解決它們。"
 MUN_czech.1036.a: "我們需要拯救我們的國家"
 CZE_divided_nation_event_onbroad_tt: "解鎖§Y決議§!，允許我們§Y移除§!核心地區上的負面§Y地區修正§!。\n\n完成這些§Y決議§!也會降低§Y$CZE_a_divided_nation_dynamic_modifier$§!民族精神的負面修正，直至完全§Y移除§!。"
 MUN_czech.1037.t: "[GER.GetName]保護[HUN.GetName]"
 MUN_czech.1037.d: "在察覺我們國內明顯正為對[HUN.GetNameDef]發動戰爭進行正當化活動後，[GER.GetAdjective]代表明確表示，對[HUN.GetAdjective]開戰就等同於對[GER.GetNameDef]宣戰。現在由我們決定是否繼續行動。"
 MUN_czech.1037.a: "我們必須取消計劃"
 MUN_czech.1037.b: "這什麼也改變不了"
 MUN_czech.1038.t.1: "[FROM.GetName]提議授權坦克設計"
 MUN_czech.1038.t.2: "[FROM.GetName]提議出售槍支"
 MUN_czech.1038.t.3: "[FROM.GetName]提議出售火炮"
 MUN_czech.1038.t.4: "[FROM.GetName]提議出售輕型坦克"
 MUN_czech.1038.t.5: "[FROM.GetName]提議出售戰鬥機"
 MUN_czech.1038.d: "[FROM.GetAdjective]政府及其武器公司的代表已與我們接洽，提出一項武器銷售提議。價格似乎頗為合理，而且[FROM.GetNameDef]還提供了一些非常現代化的武器。"
 MUN_czech.1038.a: "聽起來是筆不錯的交易"
 MUN_czech.1039.t: "[RUT.getname]要求籤署自治協議"
 MUN_czech.1039.d: "鑑於我們已經與[SLO.getname]簽署了自治協議，$RUT_augustin_voloshyn$也提出希望其所在地區也能達成類似的聯邦化協議。這要求聽起來荒謬，但考慮到當前局勢，我們必須認真對待這些訴求。"
 MUN_czech.1039.a: "我們拭目以待"
 MUN_czech.1040.t: "[CZE.getname]向我們提議關稅同盟條約"
 MUN_czech.1040.d: "[CZE.getnameDEFCAP]最近重新發起了關於兩國建立關稅同盟的外交談判。他們正在推動的協議看起來公平，但或許將來還會提出我們難以接受的新要求。這份條約及其中的貿易內容看似象徵性意義大於實際影響，因此簽署它應無大礙。"
 MUN_czech.1040.a: "似乎沒有什麼危害"
 MUN_czech.1040.b: "他們不值得信任"
 MUN_czech.1041.t: "[FROM.getname]拒絕簽署關稅同盟條約"
 MUN_czech.1041.d: "[From.getname]以條約可能擾亂其國內經濟為由拒絕簽署兩國之間的關稅同盟條約。這些理由看起來毫無根據，只是藉口。"
 MUN_czech.1041.a: "令人失望"
 MUN_czech.1042.t: "[FROM.getname]同意簽署關稅同盟條約"
 MUN_czech.1042.d: "[FROM.getname]認為條約內容令人滿意，並認可了其中的條款。希望這是我們兩國建立更緊密關係的第一步。"
 MUN_czech.1042.a: "棒極了"
 MUN_czech.1043.t: "[FROM.getname]要求我們加入他們的聯邦"
 MUN_czech.1043.d: "[FROM.getname]指出我們兩國關係日益密切以及當前世界局勢的變化，表示我們加入他們的聯邦將比孤立無援要好得多。這似乎只是他們藉口吞併我們領土的手段。我們該如何回應？"
 MUN_czech.1043.a: "我們接受"
 MUN_czech.1043.b: "這是個壞主意"
 MUN_czech.1044.t: "[FROM.getname]拒絕加入聯邦"
 MUN_czech.1044.d: "他們認為獨立要優於在我們控制下。[FROM.getname]拒絕了加入我們聯邦的機會。這打擊了我們在歐洲提升地位的目標是。現在[FROM.getname]仍未清醒，我們該怎麼辦？"
 MUN_czech.1044.a: "真遺憾"
 MUN_czech.1044.b: "我們得嘗試別的辦法"
 MUN_czech.1045.t: "[FROM.getname]同意加入聯邦"
 MUN_czech.1045.d: "他們認為接受我們的保護比單獨生存更安全。[FROM.getname]明智地加入了我們的聯邦。這將極大地提升我們在歐洲的地位。"
 MUN_czech.1045.a: "棒極了"
 MUN_czech.1046.t: "彌合裂痕"
 MUN_czech.1046.d: "我們已經解決了國內的諸多問題，國家內部的緊張局勢似乎正在緩解。在完成多項經濟與社會改革項目之後，如今我們的國家似乎正在走向恢復。"
 MUN_czech.1046.a: "喜訊"
 #MUN_czech.1047 is hidden
 MUN_czech.1048.t: "[FROM.GetName]接受要求"
 MUN_czech.1048.t2: "[FROM.GetName]同意提案"
 MUN_czech.1048.d: "[FROM.GetAdjective]官員不情願地告知我們，他們將滿足我們的領土要求。[FROM.GetAdjective]部隊已經開始從該地撤離。"
 MUN_czech.1048.d2: "經過長時間討論，我方官員與[FROM.GetNameDef]官員已成功達成協議，[FROM.GetAdjective]的經濟將在我們的聯盟中扮演新角色。這一安排必將為兩國人民帶來繁榮。"
 MUN_czech.1048.d3: "我們提出的互不侵犯條約提案立即得到了[FROM.GetAdjective]代表的熱烈響應，看來他們的野心目前集中在別處。"
 MUN_czech.1048.d4: "面對嚴峻威脅，[FROM.GetNameDef]已屈從於我方的結盟要求。"
 MUN_czech.1048.d5: "經過長時間的討論，我方官員與[FROM.GetNameDef]的代表已成功達成協議：我們的部分軍事工業將為他們生產裝備。作為回報，我們將獲得用於市場與生產的貿易物資。"
 #MUN_czech.1049 is a faction joining event so largely reuses generic loc
 MUN_czech.1049.d: "[FROM.GetNameDef]的新政府向我們提出結盟建議。儘管他們的新軍事政府起初持反德立場，但他們似乎已採取務實態度，意識到他們曾經的國際夥伴不再可靠。"
 MUN_czech.1050.d: "我們的外交官從[FROM.GetNameDef]返回，帶來了令人失望的消息：他們拒絕了我們加入其聯盟的請求。雖然理由尚不明確，但我們現在陷入了一個兩難的境地——我們暴露了對老盟友的擔憂，卻未能爭取到新的依靠。"
 MUN_czech.1050.a: "也許我們應該提出更有吸引力的條件"
 MUN_czech.1050.b: "我們該尋找更好的盟友"
 MUN_czech.1051.t: "[FROM.GetName]請求劃定勢力範圍"
 MUN_czech.1051.d: "我們的新盟友[FROM.GetNameDef]表示希望擴展其邊界之外的影響力。[FROM.GetAdjective]代表因此前來尋求對擴張行為的支持，並希望明確劃定[ROOT.GetAdjective]與[FROM.GetAdjective]勢力範圍的邊界。"
 MUN_czech.1051.a: "我們應當加強與關鍵盟友[FROM.GetAdjective]的關係"
 MUN_czech.1052.t: "[FROM.GetName]請求[SOV.GetAdjective]部隊的通行權"
 MUN_czech.1052.d: "在[FROM.GetNameDef]與[SOV.GetNameDef]達成新的外交協議後，[FROM.GetNameDef]確信如果爆發衝突，[SOV.GetNameDef]將對其提供保護。唯一的障礙是兩國之間沒有陸地連接，因此，[FROM.GetAdjective]外交官已與我國政府接觸，請求我們允許在衝突實際發生時，[SOV.GetAdjective]軍隊可經我方領土前往[FROM.GetNameDef]。"
 MUN_czech.1052.a: "他們的戰鬥也將保護我們"
 MUN_czech.1053.t: "[FROM.GetName]以[HUN.GetAdjective]領土要求向我們施壓"
 MUN_czech.1053.d: "在將[HUN.GetNameDef]變為附庸國後，[FROM.GetNameDef]現正要求我們接受同樣的命運。他們威脅稱，如果我們拒絕，他們將支持[HUN.GetAdjective]對[ROM.GetAdjective]領土的主權要求。現在我們必須在喪失主權或可能損害領土完整之間做出選擇。"
 CZE_cancel_anti_hungary_focus_tt: "取消國策§Y$CZE_neutralize_the_hungarian_threat$§!"
 MUN_czech.1054.t: "聯合入侵[LIT.GetName]？"
 MUN_czech.1054.d: "按照先前達成的協議，[FROM.GetNameDef]提出了一個有助於增強我國實力的建議。具體來說，就是通過武力與[LIT.GetNameDef]合併，這將使我們能夠獲得更多資源，並阻止敵人通過[LIT.GetNameDef]對我們發起攻擊。"
 MUN_czech.1054.a: "我們必須擴張以抵禦他國的擴張。"
 MUN_czech.1055.t: "[SOV.GetAdjective]志願軍抵達"
 MUN_czech.1055.d: "在一場前所未有的空運後勤行動中，[SOV.GetNameDef]動用其空軍，將數個志願師部署至我方位於[73.GetName]的機場，以支援我們當前的戰爭努力。"
 MUN_czech.1056.t: "[FROM.GetName]要求[975.GetName]"
 MUN_czech.1056.d: "正如第一次世界大戰後的巴黎和會上曾提議的那樣，[CZE.GetNameDef]宣稱建立一條通往其盟友[YUG.GetNameDef]的走廊對於其聯盟安全至關重要。為實現這一目標，[FROM.GetAdjective]代表已發出最後通牒，要求我們割讓[975.GetName]。"
 #THE FALL OF THE REPUBLIC EVENTS#
 MUN_the_fall_of_the_republic.1.t: "大範圍抗議"
 MUN_the_fall_of_the_republic.1.d: "[ROOT.GetLeader]近期決定放棄蘇臺德地區，導致全國爆發抗議活動。儘管軍政領導層希望避免流血衝突，不想面對不可能的困難進行毫無意義的抵抗，但全國各地的許多民眾認為他們做出了錯誤的決定。一些政治運動現在正在利用這次動亂來推進自己的目標。"
 MUN_the_fall_of_the_republic.1.a: "我們別無選擇！"
 MUN_the_fall_of_the_republic.2.t.1: "第一共和國的垮臺"
 MUN_the_fall_of_the_republic.2.t.2: "政府內部混亂"
 MUN_the_fall_of_the_republic.2.d: "在政府選擇放棄蘇臺德地區後，軍隊和政府的中下級領導的辭職信如雪片般飛來。據報道，其中一些人連夜逃離了我國。我們的政府需要進行重大改革，以阻止官員離職，並恢復人們對我們領導能力的信心。"
 MUN_the_fall_of_the_republic.2.a: "我們需要激進的改革。"
 MUN_the_fall_of_the_republic.2.b: "我們必須堅持到底！"
 MUN_the_fall_of_the_republic.3.t: "[RUT.getname]請求自治"
 MUN_the_fall_of_the_republic.3.d: "隨著最近我國發生的政治混亂，喀爾巴阡烏克蘭希望從[9.GetCapitalVictoryPointName]獲得更大的自治權。他們列舉了該地區與[ROOT.getname]其他地區間長期存在的差異。然而，這一要求似乎是當地領導人在抓住機會奪取權力。考慮到我們目前沒有多餘的政治資本，拒絕這一要求代價高昂。"
 MUN_the_fall_of_the_republic.3.a: "當然，為什麼不呢？"
 MUN_the_fall_of_the_republic.3.b: "絕對不行！"
 MUN_the_fall_of_the_republic.3.c: "讓他們自生自滅。"
 MUN_the_fall_of_the_republic.4.t: "[RUT.getname]的命運"
 MUN_the_fall_of_the_republic.4.d: "近期[CZE.getname]爆發混亂後，[RUT.getname]宣告獨立，並且正在與鄰國進行外交接觸。我們政府內部的許多人擔心邊境上如此重要的戰略要地會落入別國之手。軍隊建議立即向分裂地區發出最後通牒，要求他們歸順。"
 MUN_the_fall_of_the_republic.4.a: "立即發送最後通牒！"
 MUN_the_fall_of_the_republic.4.b: "這太冒險了，先按兵不動"
 MUN_the_fall_of_the_republic.5.t: "[FROM.getname]要求合併！"
 MUN_the_fall_of_the_republic.5.d: "在我們獨立後，鄰國尋求將我們納入他們的領土只是時間問題。[FROM.getname]似乎是第一個這麼做的國家，並且已經要求我們投降。我們該怎麼辦？"
 MUN_the_fall_of_the_republic.5.a: "我們會戰至最後一人！"
 MUN_the_fall_of_the_republic.5.b: "我們別無選擇只能同意"
 MUN_the_fall_of_the_republic.6.t: "[FROM.getname]拒絕了我們的最後通牒！"
 MUN_the_fall_of_the_republic.6.d: "令人驚訝的是，[FROM.getname]拒絕了我們的最後通牒，反而試圖以武力對抗我們。他們讓我們別無選擇只能入侵。作戰計劃和進攻路線已經制定好，我們只需要下達進攻命令。"
 MUN_the_fall_of_the_republic.6.a: "我們警告過他們"
 MUN_the_fall_of_the_republic.6.a_tt: "此行動不會影響§Y$HUN_pal_teleki$§!，除非[RUT.GetNameDef]擁有盟友"
 MUN_the_fall_of_the_republic.6.b: "這可能會適得其反，最好先緩一緩"
 MUN_the_fall_of_the_republic.7.t: "[FROM.getname]向我國妥協"
 MUN_the_fall_of_the_republic.7.d: "[FROM.getname]接受了我們的要求，願意以一些微不足道的條件被併入我們國家，沒有人對此感到意外。這個小地方完全無法抵抗像我們這樣強大的國家。我們的北方邊界現在比以前更加漫長，政府對於如此輕鬆取得勝利非常滿意。"
 MUN_the_fall_of_the_republic.7.a: "好消息"
 #BOP EVENTS#
 MUN_czech_bop.1.t: "軍隊就緒"
 MUN_czech_bop.1.d: "這十年前半段的改革努力開始初見成效。目前，我國軍隊已是歐洲最現代化的軍隊之一。然而，一些政客和眾多工業集團領導人卻開始滋生自滿情緒。如果要使我國軍隊保持最佳戰備狀態，我們必須消除外界對我國軍隊作戰能力的疑慮，並打擊那些為謀取私利而企圖削弱軍隊的人。"
 MUN_czech_bop.1.a: "我們會做好準備。"
 MUN_czech_bop.2.t.1: "德國軍備重整的威脅"
 MUN_czech_bop.2.t.2: "鄰國軍事擴張"
 MUN_czech_bop.2.d.1: "[GER.getnameDEFcap]近期在萊茵蘭的再武裝嚇壞了我們的一些軍事和政治領導人。儘管許多人對國家建立的聯盟以及軍隊目前為應對德國威脅所做的準備充滿信心。但有些人並不相信我們能夠抵禦[GER.GetAdjective]的威脅。"
 MUN_czech_bop.2.d.2: "最近有消息稱，我們的一些鄰國已開始大幅擴軍，我們的部分軍事和政治領導人對此十分擔心。儘管許多人對國家與其他國家組建的聯盟，以及軍隊目前為應對外國威脅所做的準備充滿信心。然而，有些人並不相信我們能夠抵禦外國的侵略。"
 MUN_czech_bop.2.a: "我們會準備好的"
 MUN_czech_bop.2.a_tt: "鄰國的軍備重整已使我軍內部部分人員對我們抵禦潛在侵略的能力產生懷疑。我們必須以實際行動重振軍心。"
 MUN_czech_bop.3.t: "[CZE.getname]向我國派遣觀察員"
 MUN_czech_bop.3.d: "[CZE.getname]近期向我國派遣了觀察員觀察持續中的衝突。與此同時，他們的一家武器製造商通過秘密渠道與我們的外交官聯繫，詢問我們是否有興趣購買他們的輕武器。由於國際聯盟對我們的制裁，這將涉及到向我國走私武器。"
 MUN_czech_bop.3.a: "讓我們看看局勢如何發展"
 MUN_czech_bop.3.b: "我們不能讓他們越過觀察的界限。"
 MUN_czech_bop_3_tt: "§Y[CZE.getname]§!武器製造商§Y$CZE_zbrojovka_brno_organization$§!可以嘗試向我們走私軍火。"
 MUN_czech_bop.4.t: "$CZE_zbrojovka_brno_organization$的計劃"
 MUN_czech_bop.4.d: "[ETH.getname]聯繫上了$CZE_zbrojovka_brno_organization$的代表，希望走私我國武器進入該國。儘管國際聯盟對[ETH.GetNameDef]實施了制裁，$CZE_zbrojovka_brno_organization$仍願意接受這一計劃。如果我們被發現，違反國際聯盟的命令將讓我們在國際上名聲掃地。"
 MUN_czech_bop.4.a: "幹吧"
 MUN_czech_bop.4.b: "這不值得冒險"
 CZE_gun_smuggling_tt: "走私武器進入國家"
 CZE_we_got_caught_tt: "§Y$CZE_zbrojovka_brno_organization$§!被發現了。"
 CZE_we_dont_get_caught_tt: "§Y$CZE_zbrojovka_brno_organization$§!未被發現。"
 MUN_czech_bop.5.t: "$CZE_zbrojovka_brno_organization$同意走私計劃"
 MUN_czech_bop.5.d: "在與捷克政府代表商討後，$CZE_zbrojovka_brno_organization$獲得秘密許可，開始向我國走私少量輕武器。他們的專業知識也將通過秘密渠道為我們所用。"
 MUN_czech_bop.5.a: "我們會好好利用"
 MUN_czech_bop_5_tt: "該§Y製造商§!會在戰爭結束後§R移除§!。"
 ##SLOVAKIA##
 MUN_slovakia_little_war.1.t: "[71.Getname]大捷"
 MUN_slovakia_little_war.1.d: "我軍在[71.Getname]擊敗敵軍，表現出色。指揮官們從戰鬥中汲取了寶貴的經驗。"
 MUN_slovakia_little_war.1.a: "幹得漂亮"
 MUN_slovakia_little_war.2.t: "在[71.Getname]的失敗"
 MUN_slovakia_little_war.2.d: "儘管我們全力以赴，我軍仍在[71.Getname]敗北。彈藥和摩托化裝備未能及時供應，是此次失利的關鍵原因。不過，指揮官們從這場戰鬥中吸取了寶貴教訓。"
 MUN_slovakia_little_war.2.a: "表現令人失望。"
 MUN_slovakia_little_war.3.t: "[71.Getname]邊境衝突"
 MUN_slovakia_little_war.3.d: "即便他們已在$GER_first_vienna_award$獲得領土，[HUN.getnamedef]仍在[71.getname]繼續尋求進一步的邊界調整。對此，我們必須以武力應對，表明我們絕不輕易讓步，更不會割讓國土。"
 MUN_slovakia_little_war.3.a: "他們簡直放肆！"
 MUN_slovakia_little_war.4.t: "[71.Getname]困局"
 MUN_slovakia_little_war.4.d: "儘管我們全力以赴，我軍仍在[71.Getname]敗北。彈藥和摩托化裝備未能及時供應，是此次失利的關鍵原因。不過，指揮官們從這場戰鬥中吸取了寶貴教訓。"
 MUN_slovakia_little_war.4.a: "令人失望。"
 ##Exile##
 MUN_czech_exile.1.t: "[CZE.GetAdjective]流亡者抵達[ROOT.GetNameDef]"
 MUN_czech_exile.1.d: "慕尼黑會議後，[GER.GetNameDef]解散了[CZE.GetAdjective]，他們的流亡者已經抵達包括我們在內的許多國家。他們願意拿起武器幫助我們，希望有朝一日能借助我們的力量解放自己的祖國。"
 MUN_czech_exile.1.a: "歡迎"
 ##NEWS EVENTS##
 MUN_czech.news.1.t: "蘇臺德危機"
 MUN_czech.news.1.desc: "蘇臺德地區的人們已經開始武裝反抗[CZE.getnameDef]。有報道稱，蘇臺德地區的準軍事組織已經開始襲擊整個地區的警察局和政府大樓。[FROM.getname]試圖吞併該地區的消息就是這場叛亂的緣由。\n\n這些叛亂似乎是[FROM.getname]和[CZE.GetNameDef]之間更大沖突的前奏。而這場衝突看起來已不可避免。"
 MUN_czech.news.1.a: "這對歐洲來說並不是個好兆頭"
 MUN_czech.news.1.b: "混亂是階梯"
 MUN_czech.news.1.c: "我們能贏！"
 MUN_czech.news.1.d: "希望能在外交上取得勝利"
 MUN_czech.news.2.t: "[FROM.GetNameDefCap]入侵[RUT.GetNameDef]"
 MUN_czech.news.2.desc: "\n[CZE.getname]的政治混亂導致了一系列的事件，[RUT.getname]就此脫離並宣告獨立，開始組建民兵試圖保衛其新獲得的國家地位。\n\n[FROM.getnamedefcap]一直以來都覬覦該地區，並瞅準計劃迅速入侵了這個小國。他們對[RUT.getname]的勝利在許多觀察員看來是註定的結果。"
 MUN_czech.news.2.a: "喀爾巴阡啥？"
 MUN_czech.news.2.b: "這會很容易。"
 MUN_czech.news.2.c: "有膽量就過來！"
 MUN_slovakia.news.1.t: "在[71.Getname]的邊境衝突"
 MUN_slovakia.news.1.desc: "儘管在$GER_first_vienna_award$後收復了[664.Getname]，[HUN.getnamedef]仍希望在[71.Getname]與[SLO.getnamedef]進一步調整邊界。\n\n此衝突似乎是[HUN.getnamedef]藉機測試軍力的藉口，而[SLO.getnamedef]這支年輕的軍隊恐怕還沒準備好迎接挑戰。"
 MUN_slovakia.news.1.a: "一群吵吵嚷嚷的小鬼。"
 MUN_slovakia.news.1.b: "我們已做好萬全準備。"
