 SOV_military_advisors_in_spain_desc: "$SOV_send_military_advisors_to_spain_desc$"
 SOV_soviet_advisors_spr: "蘇聯軍事顧問"
 SOV_soviet_advisors_spr_desc: "來自[SOV.GetNameDef]的軍事顧問和其他有技能的軍事人員已經到達並支持我們對抗法西斯主義和反革命分子的鬥爭。"
 SOV_face_western_fascism_ns: "直面西方的法西斯主義者"
 SOV_face_western_fascism_ns_desc: "$SOV_eradicate_western_fascism_desc$"
 SOV_liberation_of_the_european_proletariat_ns: "歐洲無產階級的解放"
 SOV_liberation_of_the_european_proletariat_ns_desc: "$SOV_liberation_of_the_european_proletariat$"
 SOV_soviet_atomic_bomb_project_ns: "蘇聯核彈計劃"
 SOV_soviet_atomic_bomb_project_ns_desc: "$SOV_soviet_atomic_bomb_project_desc$"
 SOV_stolen_vital_nuclear_information: "被盜的重要核武資料"
 SOV_stolen_vital_nuclear_information_desc: "$NSB_soviet_atomic_bomb_project.1.desc$"
 SOV_central_headquarters_of_the_partisan_movement: "游擊運動中央司令部"
 SOV_central_headquarters_of_the_partisan_movement_desc: "$SOV_organization_of_the_partisans_desc$"
 SOV_national_academy_of_sciences_puppet: "國家科學院"
 SOV_national_academy_of_sciences_puppet_desc: "以[GetTheUssrAcademyOfSciencesName]為藍本，[SOV.GetNameDef]在我國建立了一個新的研究機構，以促進我們雙方的科學發展。"
 SOV_rehabilitated_military_ns: "$SOV_rehabilitated_military$"
 SOV_rehabilitated_military_ns_desc: "是時候約束一下政治軍官，讓指揮官在如何管理方面有更多自由了。"
 SOV_military_reorganization_ns: "軍事重組"
 SOV_military_reorganization_ns_desc: "[GetSovietArmyAdjectiveBasedOnIdeology]軍隊正在進行大規模重組，預計短時間內會在一定程度上擾亂現有的編隊。"
 SOV_expanded_exploitation_of_gold_mines: "擴大金礦開採"
 SOV_expanded_exploitation_of_gold_mines_desc: "[SOV.GetAdjective]在[ROOT.GetNameDef]北境進行的基礎設施投資和工業援助使我們提高了當地金礦的開採效率。"
 SOV_ambassador_karim_khakimov: "蘇聯大使卡里姆哈基莫夫"
 SOV_ambassador_karim_khakimov_desc: "$NSB_soviet_foreign_politics_events.211.desc$"
 SOV_shocked_by_surprise_attack: "被偷襲震撼"
 SOV_shocked_by_surprise_attack_desc: "敵方代號為“贊同行動”的軍事行動完全出乎了我國政府和軍隊的意料。我們的通訊被切斷，部隊被完全壓制，召集敵方外交官要求解釋的嘗試也以徒勞告終。在我們試圖搞清混亂狀況的同時，我們的對外關係已經在實際上被無效化了。"
 SOV_shocked_by_surprise_attack_cant_join_factions_tt: "設定規則：£trigger_no 可以加入陣營。"
 SOV_soviet_commandos_poum: "蘇聯突擊隊"
 SOV_soviet_commandos_poum_desc: "[SOV.GetNameDef]的反斯大林右翼反對派已經在我們國家部署了訓練有素的特工執行特殊行動並且教我們的人民如何發動戰爭。"
 SOV_popular_speeches_poum: "公眾演講"
 SOV_popular_speeches_poum_desc: "在國外反斯大林主義反對派的當地組織和有影響力的成員的幫助下，我們正在控制的地區內進行一場大規模的宣傳和鼓動風潮，重新點燃群眾們的革命熱情。"
 SOV_agents_in_the_stalinist_command_poum: "斯大林總指揮部內的特工"
 SOV_agents_in_the_stalinist_command_poum_desc: "蘇聯右翼反對派設法在[SOU.GetLeader]派往西班牙共和國的一隊軍事顧問中滲入了幾個特工。這些特工已經建立了一個情報網絡從而讓我們能夠在敵人執行計劃前佔據先機。"
 SOV_organized_wreckers_idea: "破壞者"
 SOV_organized_wreckers_idea_desc: "國家的敵人已經在工人階級中部署了一些破壞者，這些人將破壞並擾亂關鍵工業部門的生產活動從而使其無法滿足國家產出需求。"
 SOV_organized_wreckers_idea_tt: "敵人可以執行破壞行動。"
 SOV_arms_purchases_idea: "採購軍火"
 SOV_arms_purchases_idea_desc: "為蘇聯反對派提供武器讓我們耗費甚巨，但從長遠來看，我們所獲得的收益將超過這一時的成本。"
 SOV_covert_military_buildup_idea: "秘密組建部隊"
 SOV_covert_military_buildup_idea_desc: "目前我們正在通過建立秘密的武器和彈藥生產設施來秘密支援蘇聯的反對派。"
 SOV_covert_ukrainian_military_buildup_idea: "秘密訓練烏克蘭武裝"
 SOV_covert_ukrainian_military_buildup_idea_desc: "通過利用秘密訓練營，我們正在訓練烏克蘭武裝以發動對斯大林主義者的起義。"
 SOV_the_fourth_international_idea: "第四國際"
 SOV_the_fourth_international_idea_desc: "作為國際上真正的領導者，現在我們可以指引世界共產主義事業的方向了。"
 SOV_foreign_funds_idea: "海外資助"
 SOV_foreign_funds_idea_desc: "來自外國個人和組織的慷慨資助將幫助我們進行革命。"
 SOV_support_from_farmers: "自耕農的支持"
 SOV_support_from_farmers_desc: "有了農民的支持，軍隊可以得到更充分的支援。"
 SOV_system_decentralization_idea: "體制去中心化"
 SOV_system_decentralization_idea_desc: "集中於政治局，特別是總書記一身的權力已經迴歸於黨本身。"
 SOV_the_local_soviets_idea: "地方蘇維埃"
 SOV_the_local_soviets_idea_desc: "地方蘇維埃已經部分恢復權力，這意味著可以就緊急事務直接決策，儘管政治局的控制力將不可避免地削弱。"
 SOV_strong_trade_unions_idea: "強有力的工會"
 SOV_strong_trade_unions_idea_desc: "強有力的工會意味著工人在生產活動中更具話語權。"
 SOV_the_peoples_revolution_idea: "人民革命"
 SOV_the_peoples_revolution_idea_desc: "革命若要成功，必須依靠人民。"
 SOV_puppet_international_of_soviet_republics_idea: "國際蘇維埃共和國"
 SOV_puppet_international_of_soviet_republics_idea_desc: "成為大整體的小部分對我國來說有巨大的好處。"
 SOV_support_of_the_peasants_idea: "支持農民階層"
 SOV_support_of_the_peasants_idea_desc: "全國各地農民的有力支持使得廣泛徵兵與維持更大規模的軍隊成為可能。"
 SOV_curtailment_collective_farms_idea: "削減集體農場"
 SOV_curtailment_collective_farms_idea_desc: "中小型農場在產出方面遠比大型農場有效率。"
 SOV_administrative_reforms_idea: "行政改革"
 SOV_administrative_reforms_idea_desc: "舊蘇維埃行政部門效率較為低下其原因為過於龐大的規模但主要原因還是過於嚴格的機構控制。通過適當削減規模和適當放鬆管制，我們將會獲得一個更加高效的行政部門。"
 SOV_local_organizations_idea: "地方組織"
 SOV_local_organizations_idea_desc: "通過更好地將當地組織納入國家政府，我們可以接觸到更多可以為這個國家所用的人才。"
 SOV_enemies_of_the_people_idea: "人民公敵"
 SOV_enemies_of_the_people_idea_desc: "總會有人想推翻人民政府。我們必須時刻警惕來自內部和外部的威脅。"
 SOV_soviet_hegemony_idea: "蘇維埃權威"
 SOV_soviet_hegemony_idea_desc: "事實證明，我們的政府體制無與倫比地優越。我們必須抓住機會傳播蘇維埃理念，引領那些遭受制度壓迫的人們，擁抱那些有幸加入聯盟大家庭一分子的人們。"
 SOV_fascist_womens_movement_idea: "法西斯婦女運動"
 SOV_fascist_womens_movement_idea_desc: "[ROOT.GetAdjective]的婦女挺立在民族主義運動之中。我們英勇戰士的母親、妻子與女兒們，已經組織了起來，為偉大斗爭做好了準備。"
 SOV_the_true_tsars_idea: "真正的沙皇"
 SOV_the_true_tsars_idea_desc: "沙皇乃是[ROOT.GetNameDef]的正統領袖。團結在沙皇身邊，比起各種參差不齊的外人或意識形態，更能為我們的事業吸引支持者。"
