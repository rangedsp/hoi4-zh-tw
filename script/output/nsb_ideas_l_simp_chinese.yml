 SOV_grigory_semyonov_man_tt: "§Y[SOV.GetName]§!尚未完成國策§Y$SOV_approach_semyonov$§!\n§Y[GetSovietCivilWarName]§!還沒有開始。\n僱用§Y$SOV_grigory_semyonov$§!作為政治顧問的同時將成為可用的§Y將軍§!。"
