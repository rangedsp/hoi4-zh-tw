 trait_SOV_foreign_military_advisor_desc: "國外是個學習戰術的好機會，也許某天我們會發現自己在與之競爭。"
 trait_SOV_monarchist_sympathizer_desc: "對舊制度頂禮膜拜，常與怨恨相伴。"
 trait_SOV_determined_desc: "某些人倔強無比，遠遠超出他人所認為的合理範圍。"
 heritage_of_accomplishment: "成就傳承"
 heritage_of_accomplishment_desc: "我們軍團的歷史和成就乃是士兵們英雄履歷的明證。通過習慣性地認可功勞偉績，即使是最普通的戰士也會因渴望偉大而奮勇爭先。"
