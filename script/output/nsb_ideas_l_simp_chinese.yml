l_simp_chinese:
 independent_air_force_spirit: "獨立的空軍"
 independent_air_force_spirit_desc: "空軍是個獨立的軍種，與陸軍和海軍同等重要。"
 industrial_destruction_spirit: "工業破壞"
 industrial_destruction_spirit_desc: "一千架轟炸機進行一波打擊，整場戰爭的走向就將改變。"
 dive_bombing_spirit: "俯衝轟炸"
 dive_bombing_spirit_desc: "擊沉一艘航母。"
 material_destruction_spirit: "物資破壞"
 material_destruction_spirit_desc: "摧毀敵方裝備和破壞其通信線路，比造成大量人員傷亡更能迅速鎖定勝局。"
 air_modernizers_spirit: "空軍現代化"
 air_modernizers_spirit_desc: "距離福克E.III式戰鬥機位列世界第一還沒過多久，形勢瞬息萬變。"
 industry_liasons_spirit: "產業聯絡"
 industry_liasons_spirit_desc: "只有飛機產業、軍隊和政府間的合作順通無阻，才能保證最高的質量。"
 air_crew_surveys_spirit: "機組訪談"
 air_crew_surveys_spirit_desc: "畢竟，他們才是使用武器裝備的人，為什麼不問問這幫人的意見？"
 maritime_patrol_spirit: "海上巡邏"
 maritime_patrol_spirit_desc: "只要是浮在水上的，我們都能找到。"
 long_range_patrol_spirit: "長距離巡邏"
 long_range_patrol_spirit_desc: "確保偏遠空域的制空權。"
 efficient_ground_crews_spirit: "高效地勤"
 efficient_ground_crews_spirit_desc: "王牌飛行員固然好，但是讓飛機儘快起飛更重要。"
 effective_training_programs_spirit: "高效訓練項目"
 effective_training_programs_spirit_desc: "良好的培訓勝過一切。"
 branch_independence_spirit: "兵種獨立"
 branch_independence_spirit_desc: "陸軍和海軍都不能對我們指手畫腳。我們照著自己的方式做事。"
 air_theory_spirit: "空戰理論"
 air_theory_spirit_desc: "空戰也要講科學。"
 subservience_to_army_spirit: "輔助陸軍"
 subservience_to_army_spirit_desc: "這工作其實很簡單，將軍讓你炸哪兒你就炸哪兒。"
 subservience_to_navy_spirit: "輔助海軍"
 subservience_to_navy_spirit_desc: "飛行器只有作為海軍支援和偵察時才能派上用場。"
 no_focus_on_training_spirit: "疏於訓練"
 no_focus_on_training_spirit_desc: "練習？有什麼必要嗎？有手就會的事！減少訓練還能節約燃料。"
 disorganized_ground_crews_spirit: "忽視地勤人員"
 disorganized_ground_crews_spirit_desc: "地勤人員？他們算老幾啊？給他們操心幹嘛？"
 conflicting_branches_spirit: "衝突的軍種"
 conflicting_branches_spirit_desc: "但他們說……"
 elite_fighter_pilots_spirit: "精英戰鬥機飛行員"
 elite_fighter_pilots_spirit_desc: "小子們記住，當第二名毫無意義。"
 long_range_navigation_spirit: "長距離導航"
 long_range_navigation_spirit_desc: "他們跑得了一時，躲不了一世。"
 dogfighting_training_spirit: "狗鬥訓練"
 dogfighting_training_spirit_desc: "這不是殷麥曼迴轉，而是半迴旋。"
 expert_marksmen_spirit: "射擊專家"
 expert_marksmen_spirit_desc: "一切都在於明白如何瞄準與何時開火。"
 battlefield_air_interdiction_spirit: "空域封鎖"
 battlefield_air_interdiction_spirit_desc: "空中與地面力量的緊密配合。"
 cag_night_fighting_spirit: "夜間航母作戰"
 cag_night_fighting_spirit_desc: "摸黑飛行很難是吧？給我試試在半夜在航母上降落！"
 veteran_air_instructors_spirit: "以老帶新"
 veteran_air_instructors_spirit_desc: "讓最好的飛行員來訓練其他人。"
 steel_wings_steel_hearts_spirit: "鋼翼雄心"
 steel_wings_steel_hearts_spirit_desc: "在一萬尺的高度進行作戰需要非凡的勇氣。\n\n§G由於我們的意識形態，該精神可用。§!"
 home_defence_spirit: "雲上英雄"
 home_defence_spirit_desc: "廣袤的天空為那些渴望成為傳奇的人帶來了不可言喻的希望。"
 centralized_control_spirit: "集中管理"
 centralized_control_spirit_desc: "有效的資源管理將確保飛機到達最需要它們的地方。"
 air_power_projection_spirit: "跨空域力量投射"
 air_power_projection_spirit_desc: "遠距離作戰需要非凡的膽量。"
 massed_strike_spirit: "大規模打擊"
 massed_strike_spirit_desc: "打敗敵人的最好方法是擾亂他們的地面部隊。"
 continuous_strike_spirit: "持續打擊"
 continuous_strike_spirit_desc: "摧毀敵方的關鍵裝備至關重要。"
 strategic_strike_spirit: "全面破壞"
 strategic_strike_spirit_desc: "對敵人核心地帶的大規模戰略打擊將破壞他們的戰鬥能力。"
 duelling_obsession_spirit: "決鬥痴迷"
 duelling_obsession_spirit_desc: "空戰的唯一光榮且有紳士風度的方式就是單挑。"
 lax_safety_regulations_spirit: "放寬安全條例"
 lax_safety_regulations_spirit_desc: "我想，反正沒人遵守這些指示，留著他們又有什麼意義呢？"
 officers_clique_spirit: "軍官結黨"
 officers_clique_spirit_desc: "他們也許是飛行員，但他們仍然是個人，對吧？"
 not_worth_the_risk_spirit: "不值得冒險"
 not_worth_the_risk_spirit_desc: "你知道的，飛機真的很貴。"
 merchant_mariners_spirit: "商船隊"
 merchant_mariners_spirit_desc: "航海是我們的第二天性。"
 naval_wargames_spirit: "海軍演習"
 naval_wargames_spirit_desc: "理論和戰術的訓練可以挽救生命，以及燃料。"
 instilled_aggression_spirit: "灌輸侵略"
 instilled_aggression_spirit_desc: "進攻，進攻，進攻！"
 instilled_aggression_spirit_tt: "海軍將官：升級時有§G50%幾率§!獲得§Y+1進攻§!。"
 calculated_restraint_spirit: "適當的剋制"
 calculated_restraint_spirit_desc: "經過仔細考慮……"
 calculated_restraint_spirit_tt: "海軍將官：升級時有§G50%幾率§!獲得§Y+1防禦§!。"
 signals_training_spirit: "信號訓練"
 signals_training_spirit_desc: "為了讓每個人盡到自己的職責，必須使其知道自己的職責是什麼。"
 signals_training_spirit_tt: "海軍將官：升級時有§G50%幾率§!獲得§Y+1機動和協調§!。"
 fleet_in_being_academy_spirit: "大艦隊"
 fleet_in_being_academy_spirit_desc: "大規模戰術訓練。"
 fleet_in_being_academy_spirit_tt: "新徵海軍將官：有§G50%幾率§!獲得§Y“炮術專家”§!特質。"
 merchant_mariners_spirit_tt: "新徵海軍上將：有§G50%幾率§!獲得§Y“海軍血統”§!特質。"
 trade_interdiction_academy_spirit: "武裝運輸船"
 trade_interdiction_academy_spirit_desc: "商船隊需要特殊的戰術和訓練。"
 trade_interdiction_academy_spirit_tt: "新徵海軍將官：有§G50%幾率§!獲得§Y“海狼”§!或§Y“封鎖穿行者”§!特質。"
 base_strike_academy_spirit: "一體化空軍"
 base_strike_academy_spirit_desc: "海空軍緊密合作至關重要。"
 base_strike_academy_spirit_tt: "新徵海軍將官：有§G50%幾率§!獲得§Y“海軍航空擁護者”§!特質。"
 damage_control_training_spirit: "損害控制"
 damage_control_training_spirit_desc: "船員訓練有素意味著我們的傷亡更少。"
 damage_control_training_spirit_tt: "新徵海軍將官：有§G50%幾率§!獲得§Y“首席工程師”§!特質。"
 best_of_the_best_naval_academy_spirit: "精益求精"
 best_of_the_best_naval_academy_spirit_desc: "激烈的競爭和嚴格的選拔培養出了我們想要的艦長。\n\n§G由於我們的意識形態，該精神可用。§!"
 best_of_the_best_naval_academy_spirit_tt: "新徵海軍將官：不會獲得任何個人特質。"
 naval_academy_scholarships_spirit: "學院制度"
 naval_academy_scholarships_spirit_desc: "這都是為了讓正確的人有機會發揮才能。"
 naval_academy_scholarships_spirit_tt: "新徵海軍將官：不會獲得任何個人特質。"
 underfunded_naval_academy_spirit: "經費不足的海軍學院"
 underfunded_naval_academy_spirit_desc: "至少我們還有一個……"
 traditionalism_naval_academy_spirit: "傳統主義"
 traditionalism_naval_academy_spirit_desc: "這就是我們一直以來的作風。為什麼現在要改變？"
 traditionalism_naval_academy_spirit_tt: "新徵海軍將官：增加獲得§Y“保守派”§!特質的幾率。\n新徵海軍將官：§G50%的幾率§!在兩個技能類別中各獲得額外的一點技能點。"
 political_appointments_naval_academy_spirit: "政治任命"
 political_appointments_naval_academy_spirit_desc: "重要的是，只有具有態度正確的教師才能在我們學院任教。"
 nepotism_naval_academy_spirit: "任人唯親"
 nepotism_naval_academy_spirit_desc: "我的父親是學院的老師，就像他的父親和哥哥一樣……"
 nepotism_naval_academy_spirit_tt: "減少了新徵海軍將官獲得正面特質的幾率。"
 jeune_ecole_spirit: "綠水學派"
 jeune_ecole_spirit_desc: "驅逐艦就是我們的未來!"
 big_gun_club_spirit: "巨炮俱樂部"
 big_gun_club_spirit_desc: "戰列艦不僅主宰著海洋，而且還主宰著政治。"
 aviation_enthusiasts_spirit: "航空愛好者"
 aviation_enthusiasts_spirit_desc: "未來的海戰將在空中打響。"
 cruiser_warfare_spirit: "巡洋艦戰法"
 cruiser_warfare_spirit_desc: "巡洋艦是最好的艦艇類型，它們可以勝任任何工作。"
 wolfpacks_spirit: "狼群戰術"
 wolfpacks_spirit_desc: "沉默的海洋獵手。"
 flexible_contracts_spirit: "靈活的合同"
 flexible_contracts_spirit_desc: "能終止的合同才是最好的合同。"
 integrated_designers_spirit: "設計商整合"
 integrated_designers_spirit_desc: "首要任務是讓我們的設計一直合適。"
 naval_reform_spirit: "海軍改革"
 naval_reform_spirit_desc: "戰爭一直在變。"
 naval_refit_yards_spirit: "海軍整修船塢"
 naval_refit_yards_spirit_desc: "減少在船塢的時間，就能增加船在海上的時間。"
 naval_modernism_spirit: "現代化思想"
 naval_modernism_spirit_desc: "未來就在我們眼前。"
 fleet_in_being_navy_spirit: "全球出擊"
 fleet_in_being_navy_spirit_desc: "我們的艦船要能在全世界的海洋上航行。"
 trade_interdiction_navy_spirit: "潛艇為主"
 trade_interdiction_navy_spirit_desc: "沒有補給，一個國家是打不了仗的。"
 base_strike_navy_spirit: "機動力量"
 base_strike_navy_spirit_desc: "隨時隨地準備襲擊。"
 landlocked_spirit: "陸地封鎖"
 landlocked_spirit_desc: "在沒有去海洋的通道之前，很難建立海軍傳統。"
 political_connections_navy_spirit: "政治聯繫"
 political_connections_navy_spirit_desc: "我的指揮權和我爸是財長無關！"
 overbearing_army_spirit: "專橫的陸軍"
 overbearing_army_spirit_desc: "海軍除了協助陸軍外屁用都沒。"
 bureau_of_ordnance_spirit: "海軍軍械局"
 bureau_of_ordnance_spirit_desc: "海軍軍械局影響了每一份艦船設計。\n\n§G由於我們神奇的魚雷，該精神可用。§!"
 only_big_guns_spirit: "只要巨炮"
 only_big_guns_spirit_desc: "戰列艦是公海上無可爭辯的女王。"
 close_combat_navy_spirit: "近距離作戰"
 close_combat_navy_spirit_desc: "拉近距離是制勝關鍵。"
 night_fighting_spirit: "夜戰"
 night_fighting_spirit_desc: "習慣於在黑暗中戰鬥將獲得明顯的優勢。"
 surprise_attacks_spirit: "奇襲"
 surprise_attacks_spirit_desc: "在敵人意識到威脅前打擊他們。"
 efficient_communications_spirit: "高效通訊"
 efficient_communications_spirit_desc: "通訊，通訊，和通訊。"
 discrete_valor_spirit: "不連續的英勇"
 discrete_valor_spirit_desc: "改日再戰。"
 surface_raiders_spirit: "水面襲擊"
 surface_raiders_spirit_desc: "為什麼把突襲行動都交給潛艇？"
 decisive_battle_spirit: "艦隊決戰"
 decisive_battle_spirit_desc: "投入所有兵力總會讓你取得主動權。"
 inclimate_weather_experience_spirit: "惡劣天氣適應"
 inclimate_weather_experience_spirit_desc: "根本沒有所謂的壞天氣……"
 brave_commanders_spirit: "英勇指揮官"
 brave_commanders_spirit_desc: "我才不管什麼魚雷，給我全速前進！"
 brown_water_spirit: "近海戰鬥"
 brown_water_spirit_desc: "在群島中航行和戰鬥需要一套特殊的技能。"
 green_water_spirit: "綠水"
 green_water_spirit_desc: "靠近岸邊是最安全的選擇。"
 blue_water_spirit: "藍水"
 blue_water_spirit_desc: "藍水是水手真正的家園。"
 poor_damage_control_training_spirit: "減少損害控制訓練"
 poor_damage_control_training_spirit_desc: "誰需要訓練這些？我們應該打擊敵人，而不是相反。"
 limited_sea_time_spirit: "限制出海時間"
 limited_sea_time_spirit_desc: "艦隊出海將提高其維護成本。"
 cult_of_the_signal_flag_spirit: "信號旗崇拜"
 cult_of_the_signal_flag_spirit_desc: "只要每個人都聽從指令，就沒有人會被指責。"
 overbearing_admirality_spirit: "強勢海軍"
 overbearing_admirality_spirit_desc: "總要和海軍部協商。"
 bold_attack_spirit: "大膽進攻"
 bold_attack_spirit_desc: "就像俗話所說：強力的進攻就是最好的防守。"
 tenacious_defense_spirit: "頑強防禦"
 tenacious_defense_spirit_desc: "他們休想通過！"
 meticulous_preparation_spirit: "精心準備"
 meticulous_preparation_spirit_desc: "戰爭帶來混亂，但可以事先做好準備面對混亂。"
 best_of_the_best_spirit: "精益求精"
 best_of_the_best_spirit_desc: "很少有人具備領軍作戰的能力。而其中能贏得戰鬥的人更少。"
 academy_scholarships_spirit: "學院制度"
 academy_scholarships_spirit_desc: "貧窮不應該阻礙人們為國效力。\n\n§G由於我們的意識形態，該精神可用。§!"
 political_loyalty_spirit: "政治忠誠"
 political_loyalty_spirit_desc: "一支不可靠的軍隊將威脅到它本應保護的國家。\n\n§G由於我們的意識形態，該精神可用。§!"
 political_loyalty_spirit_tt: "新徵陸軍將領：獲得§Y“政治關聯者”§!或§Y“媒體人物”§!特質。"
 inventive_leadership_spirit: "創造性的領導層"
 inventive_leadership_spirit_desc: "一個可被預測的將軍是個失敗的將軍。"
 inventive_leadership_spirit_tt: "新徵陸軍將領：§G50%幾率§!獲得§Y“特戰指揮官”§!，§Y“詭謀指揮官”§!或§Y“侵襲指揮官”§!特質。"
 mobile_warfare_academy_spirit: "擁抱未來"
 mobile_warfare_academy_spirit_desc: "無論未來哪裡發生戰爭，裝甲部隊都將起到決定性作用。"
 mobile_warfare_academy_spirit_tt: "新徵陸軍將領：有幾率獲得§Y“裝甲軍官”§!特質。"
 superior_firepower_academy_spirit: "工程學校"
 superior_firepower_academy_spirit_desc: "挖壕溝也要講科學。"
 superior_firepower_academy_spirit_tt: "新徵陸軍將領：有幾率獲得§Y“工兵軍官”§!特質。"
 theatre_training_spirit: "戰區訓練"
 theatre_training_spirit_desc: "一些官員或許會“入鄉隨俗”，但真正的本地人在自己熟悉的地形上作戰可是相當在行。"
 theatre_training_academy_spirit_tt: "新徵陸軍將領：§G50%幾率§!獲得§Y“天才的戰略家”§!或§Y“頑固的戰略家”§!特質。"
 mass_assault_academy_spirit: "戰場上的皇后"
 mass_assault_academy_spirit_desc: "步兵是戰場上的皇后，皇后想去哪就去哪。"
 underfunded_academy_spirit: "經費不足的陸軍學院"
 underfunded_academy_spirit_desc: "還有比教人如何有效率地自相殘殺更值得花錢的事。"
 nepotism_academy_spirit: "任人唯親"
 nepotism_academy_spirit_desc: "我叔叔是集團軍的領導，他說只要我願意，我也可以有我自己的師！"
 professional_officer_corps_spirit: "職業軍官團"
 professional_officer_corps_spirit_desc: "我們是專業的，戰爭就是我們的專業。"
 elevated_engineering_corps_spirit: "重視工程兵團"
 elevated_engineering_corps_spirit_desc: "判斷一個人的能力和品行的最好方式就是給他一整天的時間，讓他用一把鐵鍬做些有用的事情。"
 proper_heritage_spirit: "正規傳承"
 proper_heritage_spirit_desc: "好的將軍或許可以訓練出來，但一個偉大將軍必須經過培育，如同千里馬一樣。"
 quick_improvisation_spirit: "隨機應變"
 quick_improvisation_spirit_desc: "更快的理解，更快的思考，更快的行動——這就是通往勝利的關鍵。"
 adaptable_modernizers_spirit: "革新求變"
 adaptable_modernizers_spirit_desc: "無法更改的學說，不如稱為教條。"
 relief_of_command_spirit: "解除指揮權"
 relief_of_command_spirit_desc: "軍隊之所以存在，可不是為了滿足將領們的自負。\n\n§G由於我們的意識形態，該精神可用。§!"
 ideological_loyalty_spirit: "忠於意識形態"
 ideological_loyalty_spirit_desc: "一個意識形態出了問題的人絕不可能在戰鬥中發揮理想的作用。\n\n§G由於我們的意識形態，該精神可用。§!"
 state_serves_the_military_spirit: "國家服務軍隊"
 state_serves_the_military_spirit_desc: "國家存在的目的就是與其他的國家開戰。別的事情要麼是對其開戰的支持，要麼就是無用的干擾。\n\n§G由於我們的意識形態，該精神可用。§!"
 mobile_warfare_army_spirit: "摩托化推動力"
 mobile_warfare_army_spirit_desc: "更迅速的突擊，更遙遠的奔襲，更堅實的勝利！"
 superior_firepower_army_spirit: "優勢火力"
 superior_firepower_army_spirit_desc: "沒有什麼戰鬥是大炮打不贏的，如果有，那就說明還要更多的大炮。"
 grand_battleplan_army_spirit: "刀口舔血"
 grand_battleplan_army_spirit_desc: "黑夜裡的匕首有時候比白晝裡的長劍更有效。"
 mass_assault_army_spirit: "刺刀之鋒"
