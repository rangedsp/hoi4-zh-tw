 SOV_understaffed_bureaucracy: "人手不足的官僚機構"
 SOV_understaffed_bureaucracy_desc: "內務人民委員部發現了文官政府內部存在大規模陰謀的證據，並且一些官員已被免職。"
 SOV_anti_soviet_military_thinking_banned_army: "禁止反蘇軍事思想"
 SOV_anti_soviet_military_thinking_banned_army_desc: "現在我們將禁止在軍事學院的我軍軍官學習和討論那些可恥又反動的軍事理論家的文件和思想。與此同時我們也將對新的軍事學院畢業生進行嚴格審查，確保不會有人民的敵人進入紅軍隊伍。"
 SOV_training_activities_curtailed: "減少軍事演習"
 SOV_training_activities_curtailed_desc: "在最近的軍事演習中，大量作戰車輛出現故障，這導致數名新兵在演習中受傷。在我們找到導致大規模機械故障的原因之前，我們將減少主要的軍事演習，以避免對我們的新兵和軍事資產造成進一步的損害。"
 SOV_purged_junior_army_officers_1: "下級陸軍軍官已被清洗"
 SOV_purged_junior_army_officers_1_desc: "內務人民委員部以犯下煽動罪、破壞罪和反蘇言論罪為由逮捕了大量的初級陸軍軍官。損失如此多的老練且具有豐富戰爭經驗的陸軍軍官使紅軍陷入了危險的混亂之中。"
 SOV_anti_soviet_military_thinking_banned_navy: "禁止反蘇海軍思想"
 SOV_anti_soviet_military_thinking_banned_navy_desc: "現在我們將禁止在軍事學院的我軍海軍軍官學習和討論那些可恥又反動的軍事理論家的文件和思想。與此同時我們也將對新的軍事學院畢業生進行嚴格審查，確保不會有人民的敵人進入紅海軍。"
 SOV_shipyard_staff_purged: "造船廠工作人員被清洗"
 SOV_shipyard_staff_purged_desc: "內務人民委員部在對海軍內部數項有關於破壞活動和其他可疑活動的調查之後，逮捕了大量相關人員，這導致我們的一些造船廠和海軍基地的人手嚴重不足。"
 SOV_purged_junior_navy_officers_1: "下級海軍軍官已被清洗"
 SOV_purged_junior_navy_officers_1_desc: "內務人民委員部以犯下煽動罪、破壞罪和反蘇言論罪為由逮捕了大量的初級海軍軍官。損失如此多的老練且具有豐富戰爭經驗的海軍軍官使紅海軍陷入了危險的混亂之中。"
 SOV_anti_soviet_military_thinking_banned_airforce: "禁止反蘇空軍思想"
 SOV_anti_soviet_military_thinking_banned_airforce_desc: "現在我們將禁止在軍事學院的我軍空軍軍官學習和討論那些可恥又反動的軍事理論家的文件和思想。與此同時我們也將對新的軍事學院畢業生進行嚴格審查，確保不會有人民的敵人進入蘇維埃空軍。"
 SOV_ground_based_training: "轉入地面訓練"
 SOV_ground_based_training_desc: "在報告了數起訓練期間的空難和事故之後，內務人民委員部開始對空軍進行調查。按負責調查的特工指示，在調查期間空軍將不再進行飛行演習。"
 SOV_purged_junior_army_officers_1_tt: "§Y所有地面車輛§!：可靠性加成：§R-10%§!"
 SOV_purged_junior_army_officers_2_tt: "§Y所有地面車輛§!：可靠性加成：§R-20%§!"
 SOV_purged_junior_army_officers_3_tt: "§Y所有地面車輛§!：可靠性加成：§R-30%§!\n§Y$politically_connected$§!將是新招募的將軍唯一可用的特質。"
 SOV_purged_junior_navy_officers_3_tt: "§Y$politically_connected$§!將是新徵海軍將官唯一可用的特質。"
