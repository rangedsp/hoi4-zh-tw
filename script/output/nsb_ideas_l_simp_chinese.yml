 SOV_support_in_china_generic: "[SOU.GetAdjective]支援中國"
 SOV_support_in_china_generic_desc: "[SOU.GetAdjective]政府正在於我們對抗[JAP.GetAdjective]的戰爭中支持[ROOT.GetNameDef]，他們期望在與我們發展更緊密聯繫的同時影響我們的政治。"
 SOV_preparations_for_soviet_japanese_war: "備戰對日戰爭"
 SOV_preparations_for_soviet_japanese_war_desc: "$SOV_prepare_a_war_with_japan_desc$"
 SOV_soviet_japanese_reckoning: "蘇日決裂"
 SOV_soviet_japanese_reckoning_desc: "是時候對[JAP.GetAdjective]宣戰，併為他們給我們帶來的苦難報仇雪恨了。"
 SOV_soviet_japanese_anti_usa_pact: "蘇日反美協定"
 SOV_soviet_japanese_anti_usa_pact_desc: "我們將並肩作戰，將[USA.GetNameDef]踢下世界舞臺！"
 SOV_stakhanovite_movement: "斯達漢諾夫運動"
 SOV_stakhanovite_movement_desc: "$SOV_revive_the_stakhanovite_movement_desc$"
