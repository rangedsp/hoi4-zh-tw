 SOV_factionalism_modifier: "黨派之爭"
 SOV_factionalism_modifier_tt: "§L黨內的派系鬥爭始終是個問題。隨著反對派的呼聲與日俱增，意見分歧使黨的運作效率愈見低下。不過若能管理得當，意見分歧在長期上也能夠從弱點轉化為力量。§!\n\n"
 SOV_opposition_popular_support: "民眾支持反對派"
 SOV_opposition_popular_support_tt: "§L由於不少黨員與公眾輿論支持反對派，在戰爭中即使維持守勢都變得無比艱難。§!\n\n"
 SOV_workers_government_idea: "工人的政府"
 SOV_workers_government_idea_desc: "工人的政府萬歲！精英統治階級已經從權力中心被清除出去了，工人再一次成為了國家的主人。"
 SOV_revolutionary_spirit_idea: "革命精神"
 SOV_revolutionary_spirit_idea_desc: "反抗斯大林的勝利重新點燃了革命的熱情，現在是時候將革命帶給全世界的工人了。"
 SOV_trotskyist_revolutionary_agitation: "托洛茨基主義革命騷動"
 SOV_trotskyist_revolutionary_agitation_desc: "託派支持者以及其他同[SOV.GetAdjective]布爾什維克結盟的共產主義派別聯合起來了，煽動[ROOT.GetAdjective]群眾，在工人階級間傳播馬克思主義意識形態，號召進行一次反抗我國政府的武裝鬥爭。"
 SOV_trotskyist_revolutionary_agitation_tt: "啟用決議§Y$ban_communist_party$§!將降低該民族精神的效果。"
 SOV_politicized_military: "政治化的軍隊"
 SOV_politicized_military_desc: "政委經常在部隊裡進行意識形態宣講以及政治議題討論，但是許多時候他們的管理也會過頭，對軍官進行過度監察，甚至阻撓軍事指揮官的命令。"
 SOV_politicized_military_swap: "軍事政治顧問"
 SOV_politicized_military_swap_desc: "儘管不能讓政治考慮成為軍事決定的主導因素，但是我們也必須確保在進行軍事決定時對政治因素稍微有所考慮。"
 SOV_politicized_military_battle_priests: "軍隊中的戰鬥牧師"
 SOV_politicized_military_battle_priests_desc: "在我們的部隊中擔任著戰鬥牧師的角色，神職人員負責保持隊伍的高昂士氣，並確保部隊中的每一個人都知道教會和上帝站在我們一邊。"
 SOV_for_the_common_good_allies: "為了共同的利益"
 SOV_for_the_common_good_allies_desc: "我們或我們的盟友所做的每一個決定都必須以我們的共同利益為準。"
 SOV_for_the_common_good_subjects: "$SOV_for_the_common_good_allies$"
 SOV_for_the_common_good_subjects_desc: "我們的盟友所做的每一個決定都是為了我們的共同利益。因此，我們必須支持這些決定，並完全遵循其向我們提出的指導方針，即使我們的處境沒有得到立即改善。"
