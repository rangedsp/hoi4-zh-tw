 SOV_anti_capitalist_campaign_generic: "反資本主義之戰"
 SOV_anti_capitalist_campaign_generic_desc: "資本家是不可信任的。資產階級總是會壓迫無產階級。我們必須做好與他們爆發戰爭的準備。"
 SOV_anti_fascist_campaign_generic: "反法西斯之戰"
 SOV_anti_fascist_campaign_generic_desc: "我們與法西斯分子之間不可能和平共處。我們必須為不可避免的戰爭做好準備。"
 SOV_young_builders_of_communism: "年輕的共產主義建設者"
 SOV_young_builders_of_communism_desc: "我們不是為現在的這一代大人們建設社會主義，而是為了孩子們這一代以及他們的下一代。我們必須教導他們如何在我們已經取得成就的基礎上繼續前進，這樣他們才能夠完成我們開闢的事業。"
 SOV_broken_peace_dreams_attacker: "破碎的和平之夢"
 SOV_broken_peace_dreams_attacker_desc: "在我們公開承諾追求和平政策不久後身處的這場新的戰爭，已經導致人民的不穩和懷疑。"
 SOV_broken_peace_dreams_defender: "$SOV_broken_peace_dreams_attacker$"
