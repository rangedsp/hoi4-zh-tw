l_simp_chinese:
 DOD_hungary.1.t: "匈牙利要求進行全民公投"
 DOD_hungary.1.desc: "日前，在布達佩斯發表的演說中，[HUN.GetLeader]已表態希望他的奧地利臣民能夠重歸他的統治之下。不過，他也以和解的姿態公開聲明，應該允許奧地利人民自己作出選擇。"
 DOD_hungary.1.a: "讓人民表達意見"
 DOD_hungary.1.b: "此類事務應交給專業人士"
 DOD_hungary.1.c: "我們將確保結果符合預期"
 DOD_hungary.2.t: "全民公投通過"
 DOD_hungary.2.desc: "公投結果已經公佈。初步計票結果顯示，同意與匈牙利組成聯邦的投票佔顯著多數。"
 DOD_hungary.2.a: "人民已作出選擇"
 DOD_hungary.3.t: "全民公投失敗"
 DOD_hungary.3.desc: "儘管親匈牙利團體與保皇派人士竭盡全力、大肆鼓吹，但初步計票結果仍顯示，選擇維持現狀的投票佔微弱多數。"
 DOD_hungary.3.a: "明智的選擇"
 DOD_hungary.4.t: "全民公投成功"
 DOD_hungary.4.desc: "時間剛過午夜不久，[AUS.GetLeader]宣佈奧地利人民投票贊成與匈牙利聯合。作為復興二元君主制的第一步，一紙效忠通告已經送抵，並正式向[HUN.GetLeader]獻上了奧地利的王冠。"
 DOD_hungary.4.a: "好極了"
 DOD_hungary.5.t: "全民公投失敗"
 DOD_hungary.5.desc: "儘管我們盡了最大努力，奧地利人民還是決定維持現狀。"
 DOD_hungary.5.a: "我們必須為真命君主收復故國"
 DOD_hungary.5.b: "我們將尊重公投結果"
 DOD_hungary.6.t: "全民公投遭到拒絕"
 DOD_hungary.6.desc: "奧地利領導人[AUS.GetLeader]已經公開宣佈，將舉國一致反對哈布斯堡王朝，同時稱有關奧地利公投的想法是場徹頭徹尾的荒謬鬧劇。"
 DOD_hungary.6.a: "那就看看他們有多團結"
 DOD_hungary.6.b: "所謂“民主”在作祟"
 DOD_hungary.7.t: "引導全民公投"
 DOD_hungary.7.desc: "匈牙利提出的全民公投，讓我們在國際上陷入了兩難：既不能背上踐踏民意的罵名，亦不可信任民意能做出正確的選擇。幸好道路千萬條，總有門路來解決這個問題。我們想要哪種公投結果？"
 DOD_hungary.7.a: "引導人民拒絕"
 DOD_hungary.7.b: "引導人民同意"
 DOD_hungary.10.t: "奧匈帝國提供擔保"
 DOD_hungary.10.desc: "近期，巴爾幹地緣政治發生巨大變化，我們與新奧匈帝國的關係問題再度擺上檯面。日前，匈牙利大使遞交了一份官方照會，正式要求我國在其帝國面前自陳姿態。哈布斯堡王朝聲稱，一如古老的皇冠那般，波希米亞和摩拉維亞也理應歸屬於他們。\n\n但[HUN.GetLeader]亦表示，他同意接受一個折中的解決方案，即其本人只做我國名義上的元首，實際可並不去掌握國家的治權。"
 DOD_hungary.10.a: "我們將回歸帝國"
 DOD_hungary.10.b: "我們將接受折中方案"
 DOD_hungary.10.c: "我們絕不犧牲自由換取安全！"
 DOD_hungary.11.t: "波希米亞迴歸帝國"
 DOD_hungary.11.desc: "經過高層的徹夜商談，[CZE.GetAdjective]政府現已決定接受提議，宣佈擁戴[HUN.GetLeader]為波希米亞國王兼摩拉維亞藩侯。前捷克軍隊已向其新國王兼皇帝陛下宣誓效忠，該國行政機關亦已全面整合。"
 DOD_hungary.11.a: "重整天賦君權之路再進一步"
 DOD_hungary.12.t: "波希米亞同意深化關係"
 DOD_hungary.12.desc: "鑑於其政府中共和派與君主派微妙的僵持狀態，[CZE.GetLeader]選擇了折中方案。[HUN.GetLeader]將被加冕為波希米亞與摩拉維亞的國王，但[CZE.GetAdjective]憲法將限制他的權力，使其只可在議會的建議和授權下采取行動。"
 DOD_hungary.12.a: "尚可接受"
 DOD_hungary.13.t: "[CZE.GetNameDefCap]拒絕提議"
 DOD_hungary.13.desc: "[CZE.GetNameDefCap]已經拒絕與我方在未來達成任何和解或協議。當我們的大使抵達該國外交部，去討論早些時候遞交的官方照會時，卻被告知沒有什麼可談的，然後就被趕出了門。[CZE.GetAdjective]駐我國大使亦稱，儘管該國政府希望與我國保持和平友好的關係，但決不可能將[CZE.GetNameDef]併入奧匈帝國。"
 DOD_hungary.13.a: "這可真是遺憾"
 DOD_hungary.20.t: "匈牙利陷入戰爭"
 DOD_hungary.20.desc: "匈牙利爆發戰爭後，關於是否支持他們的問題一再浮現。保守派報紙呼籲採取行動幫助匈牙利，揚言國王沒理由袖手旁觀，畢竟那裡的國王是他親兒子。與此同時，某位軍官的一封匿名信件被洩露給了媒體，內容稱如果政府允許，大批士兵願意奔赴匈牙利作戰。\n\n政府現已就此開展會議，並討論了一些可選的方案。"
 DOD_hungary.20.a: "我們承擔不起捲入這場衝突"
 DOD_hungary.20.b: "大張旗鼓向匈牙利派遣觀察團"
 DOD_hungary.20.c: "他們的戰爭就是我們的戰爭"
 DOD_hungary.21.t: "瑞典拒絕援護"
 DOD_hungary.21.desc: "儘管瑞典國王和軍方部分成員多次呼籲，但瑞典政府仍不允許派出任何援助。該國政府拒絕給那些希望以個人名義來匈牙利打仗的人發放旅行簽證，並已立法禁止向我國出售軍備。"
 DOD_hungary.21.a: "我們只能依靠自己"
 DOD_hungary.22.t: "瑞典伸出援手"
 DOD_hungary.22.desc: "瑞典政府儘管在官方上保持中立，但也給相當數量的官兵延長了休假時間，甚至允許他們隨身攜帶個人武器。眼下，這批士兵已經抵達匈牙利，正準備加入我軍。"
 DOD_hungary.22.a: "好極了"
 DOD_hungary.23.t: "瑞典下場干預"
 DOD_hungary.23.desc: "事態的發展，讓即便經驗豐富的外交官都感到瞠目結舌。日前，瑞典政府發表公開聲明，認為我國的存亡與否，關乎瑞典的核心國家利益。有傳言說，瑞典國王為此親自出面干預，威脅稱除非政府進一步增派援助，否則他就直接退位，並以個人名義親自前往匈牙利參戰。"
 DOD_hungary.23.a: "他們能及時趕到這邊嗎？"
 DOD_hungary.24.t: "瑞典遭到攻擊"
 DOD_hungary.24.desc: "瑞典正深陷一場血腥的衝突。日前，國王罕見地在議會兩院前露面，表達了對自己故鄉的深切憂慮，尤其是瑞典戰敗後其父及家人所可能要遭受的命運。有鑑於此，政府決定召開會議，討論如何幫助瑞典。"
 DOD_hungary.24.a: "我們可不能被捲入其衝突中"
 DOD_hungary.24.b: "提供秘密援助"
 DOD_hungary.24.c: "我們要與瑞典人並肩作戰"
 DOD_hungary.25.t: "匈牙利拒絕援護"
 DOD_hungary.25.desc: "儘管匈牙利國王提出了個人訴求，但議會投票否決了任何對瑞典的援助。反對派威脅道，如果國王本人要繼續搞出任何破壞匈牙利中立現狀的事端，他們就會發起不信任投票來廢黜[HUN.GetLeader]。"
 DOD_hungary.25.a: "我們只能依靠自己"
 DOD_hungary.26.t: "匈牙利伸出援手"
 DOD_hungary.26.desc: "匈牙利日前倒騰了他們的舊軍械庫，並向我們輸送了一批翻新的步槍以及其它步兵裝備。同時，數千名匈牙利志願軍也已抵達我國。"
 DOD_hungary.26.a: "十分歡迎他們相助"
 DOD_hungary.27.t: "匈牙利下場干預"
 DOD_hungary.27.desc: "匈牙利政府日前發表聲明稱，任何對瑞典的攻擊都將被視為對匈牙利的攻擊。匈牙利軍隊已處於高度戒備狀態，一旦動員完成，預計將立即投入戰鬥。"
 DOD_hungary.27.a: "他們能及時趕到這邊嗎？"
 DOD_hungary.30.t: "匈牙利提議和解"
 DOD_hungary.30.desc: "匈牙利政府日前與我方接洽，提議重新就《特里亞農條約》展開談判。根據其提案，條約中對該國軍隊規模的限制將被修改，以允許匈牙利在現有軍隊的基礎上進一步發展。草案還將允許匈牙利在軍工現代化上投入更大比例的預算。\n\n由於該國現在牢牢掌控在一個民主政府手中，我國外交部門預計將對這一計劃予以大力支持。"
 DOD_hungary.30.a: "這是合理的請求"
 DOD_hungary.30.b: "他們擴軍又打算做什麼呢？"
 DOD_hungary.31.t: "《特里亞農條約》的修訂"
 DOD_hungary.31.desc: "[HUN.GetLeader]政府取得了重大的政治勝利。[From.GetNameDef]日前批准了《特里亞農條約》的修正案，現在我們可以恢復徵兵，併為軍事工業的建設公開調撥預算。"
 DOD_hungary.31.a: "好極了"
 DOD_hungary.32.t: "[From.GetNameDefCap]拒絕談判"
 DOD_hungary.32.desc: "[From.GetNameDef]政府拒絕在重整軍備問題上讓步。談判幾近破裂，[From.GetAdjective]代表不停地在每一件諸如座次這樣的芝麻小事上磨蹭，並將其拖延為以小時計的冗長辯論。很明顯，他們根本沒有讓我國再武裝的打算，但還盤算著讓我們成為首先退出談判的一方。"
 DOD_hungary.32.a: "那我們只好便順其意"
 DOD_hungary.32.b: "向法國求助"
 DOD_hungary.32.c: "向英國求助"
 DOD_hungary.33.t: "匈牙利請求獲得支持"
 DOD_hungary.33.desc: "匈牙利近期正就放寬戰後限制一事，與其鄰國進行意向溝通。具體而言，匈牙利方面希望恢復徵兵制並擴張其軍工產業。匈牙利方面認為，世界日益危險，其需要強大的軍隊以自衛。而[From.From.GetNameDefCap]則對此持異議。"
 DOD_hungary.33.a: "應當允許匈牙利有限軍備重整"
 DOD_hungary.33.b: "我們可不能破壞地區勢力平衡"
 DOD_hungary.34.t: "[From.GetName]支持匈牙利"
 DOD_hungary.34.desc: "[From.GetNameDef]大使已經明確表示，該國政府對我方拒絕認同匈牙利再武裝的權利表達強烈反對。他進一步闡明，如果我方堅持要匈牙利繼續保持非軍事化，那麼該國政府今後將在涉及我國的外交問題上考慮到這件事。\n\n換句話說，他們願意為此賭上兩國目前的良好關係。"
 DOD_hungary.34.a: "但願他們對此判斷無誤吧"
 DOD_hungary.34.b: "在此問題上我們必須堅定"
 DOD_hungary.35.t: "[From.GetName]拒絕提供支持"
 DOD_hungary.35.desc: "[From.GetNameDef]政府已經通知我們，他們認為修訂《特里亞農條約》的問題，純粹是國家間的內部事務，其拒絕捲入此事。看來他們更關心與前盟友保持良好關係，而非維護正義。"
 DOD_hungary.35.a: "他們真該死"
 DOD_hungary.36.t: "[From.GetNameDefCap]冥頑不化"
 DOD_hungary.36.desc: "儘管面臨[From.From.GetNameDef]的強大政治壓力，[From.GetNameDef]仍斷然拒絕討論此議題。他們似乎仍恐懼於我們會將武器對準他們。\n\n隨著外交途徑已經全數封死，眼下我們只能靜待未來是否還有機會再重議此事。"
 DOD_hungary.36.a: "我們就真有那麼嚇人嗎？"
 DOD_hungary.40.t: "[HUN.GetNameDefCap]撕毀《特里亞農條約》"
 DOD_hungary.40.desc: "[HUN.GetLeader]在今天公開聲明，他不再認為[HUN.GetNameDef]應當受《特里亞農條約》束縛。除此之外，他宣稱該條約無效，聲稱它是用武力逼迫匈牙利就範的，因此從來就沒有法律約束力。匈牙利政府甚至沒打算正式將他們的決定通知我們。\n\n對此，政府中的許多人都傾向採取強硬態度答覆。如果我們向匈牙利人表現出我們並不怕他們，則他們肯定會屈服。然而，他們也可能認為我們是在虛張聲勢。"
 DOD_hungary.40.a: "立即下達最後通牒"
 DOD_hungary.40.b: "我們現在可承受不起戰爭"
 DOD_hungary.41.t: "[From.GetName]發出最後通牒"
 DOD_hungary.41.desc: "我國近期撕毀《特里亞農條約》的決定，遭到了來自[From.GetNameDef]異常激烈的反對。[From.GetLeader]據說已要求[From.GetAdjective]軍方為隨時下場干涉擬定計劃。同時，[From.GetAdjective]的大使也已發出照會，要求我們闡明我國對於條約的最終立場，聲稱軍事手段仍在其考量範圍內。"
 DOD_hungary.41.a: "他們顯然是在虛張聲勢"
 DOD_hungary.41.b: "這其中似乎有些誤會"
 DOD_hungary.42.t: "[From.GetName]退讓屈服"
 DOD_hungary.42.desc: "儘管我們關於《特里亞農條約》的聲明措辭強烈，但[From.GetNameDef]並未作出任何阻止我們的行動。在最近的新聞發佈會上，[From.GetLeader]竭力避免回答任何與我國撕毀條約相關的問題。這清楚地證明了大家都在懷疑的一件事：[From.GetNameDef]不過是個紙老虎。"
 DOD_hungary.42.a: "意料之中"
 DOD_hungary.43.t: "[HUN.GetNameDefCap]拒絕讓步"
 DOD_hungary.43.desc: "看來[HUN.GetNameDef]對我們的警告置若罔聞。昨晚，在布達佩斯的一次集會上，人們高呼“為了[From.From.GetNameDef]而死！”，而[HUN.GetLeader]當眾起誓說，任何阻止[HUN.GetNameDef]重回其應有地位的企圖，都將被回敬以“一場1914年至1918年世界大戰與之相比，都無足輕重到像是酒館鬥毆的大戰”。\n\n我們正處在命運的十字路口，要麼毅然投身戰鬥捍衛榮耀，或者只能接受挫敗。"
 DOD_hungary.43.a: "如果[HUN.GetAdjective]人想要戰爭，那就讓他們得償所願"
 DOD_hungary.43.b: "他們已經識破了我們的虛張聲勢"
 DOD_hungary.44.t: "[HUN.GetNameDefCap]退讓"
 DOD_hungary.44.desc: "隨著戰爭威脅擺上檯面，匈牙利政府的態度突然變得友好起來。日前，我國大使受邀與[HUN.GetLeader]共進午餐，對方稱[HUN.GetNameDef]真誠地渴求和平，只希望能同我們建立友好關係。任何刊登於捕風捉影傳媒上的聲明報道均系對匈牙利政府的謠傳，畢竟他們從未期待一場戰爭。"
 DOD_hungary.44.a: "不出我們所料"
 DOD_hungary.45.t: "干涉[HUN.GetNameDef]"
 DOD_hungary.45.desc: "在[HUN.GetNameDef]公開撕毀《特里亞農條約》後，[From.GetNameDefCap]現已決定進行軍事幹涉。他們已經發出邀請，希望我國加入他們，趕在[HUN.GetNameDef]重整旗鼓前將其扼殺在搖籃中。"
 DOD_hungary.45.a: "我們必須趁為時未晚率先動手"
 DOD_hungary.45.b: "我們可不要被捲入這場衝突"
 DOD_hungary.46.t: "[From.GetNameDefCap]宣佈中立"
 DOD_hungary.46.desc: "[From.GetNameDef]的叛徒與懦夫們，拒絕響應我國的號召參戰！他們在布達佩斯的惡霸面前屁滾尿流，現在我們不得不獨自面對[HUN.GetAdjective]人了。"
 DOD_hungary.46.a: "我們自己也可以解決此事"
 DOD_hungary.50.t: "[HUN.GetNameDefCap]索取特蘭西瓦尼亞"
 DOD_hungary.50.desc: "在當地居民於世界大戰結束後自願加入我們之前，特蘭西瓦尼亞地區曾在很長一段時間裡屬於[HUN.GetNameDef]的一部分。遺憾的是，[HUN.GetNameDef]總是對其領土的更迭耿耿於懷。在各種各樣的場合裡，他們都公然宣稱特蘭西瓦尼亞是其國家不可分割的一部分。近期，隨著政治局勢的變化，他們又再次要求我們向其移交特蘭西瓦尼亞全境，否則就……"
 DOD_hungary.50.a: "不值得為此流血再打一仗"
 DOD_hungary.50.b: "否則……就怎樣？"
 DOD_hungary.51.t: "[ROM.GetNameDefCap]移交特蘭西瓦尼亞"
 DOD_hungary.51.desc: "與其面對我軍雷霆萬鈞的威勢，懦弱的[ROM.GetAdjective]人決定雙手奉還我國的合法領土。特蘭西瓦尼亞全境現已移交給我們的行政當局，我軍亦已掌控當地局勢。"
 DOD_hungary.51.a: "理應如此"
 DOD_hungary.52.t: "[ROM.GetNameDefCap]拒絕移交特蘭西瓦尼亞"
 DOD_hungary.52.desc: "最能說明問題的，或許是今晨在會見[HUN.GetLeader]時，[ROM.GetAdjective]大使在斷然拒絕討論領土移交的可能性後，竟還刻意補上了一句“一如既往”。一次又一次，[ROM.GetAdjective]政府不僅公開否認我們的主張，甚至還對其嗤之以鼻。多年來，我們軟弱無力，無法反擊。\n\n但現在不一樣了。"
 DOD_hungary.52.a: "憤怒乃兵家大忌，我們將靜待良機"
 DOD_hungary.52.b: "他們這次做得太過分了"
 DOD_hungary.53.t: "[HUN.GetNameDefCap]整軍動員"
 DOD_hungary.53.desc: "[HUN.GetNameDefCap]日前宣佈，其武裝部隊現已處於高度警備的狀態。在過去的幾個小時裡，匈牙利人的偵察機數次侵入我國領空。我國情報部門報告，匈牙利方面正有大批部隊向邊境地區調動，防空警報響徹布達佩斯上空。顯然[HUN.GetAdjective]人這次是要來真的，我們可能要開戰了。"
 DOD_hungary.53.a: "我們已表態無意戰爭"
 DOD_hungary.53.b: "他們休想得逞！"
 DOD_hungary.53.c: "或許是時候妥協退讓了"
 DOD_hungary.54.t: "[ROM.GetNameDefCap]整軍動員"
 DOD_hungary.54.desc: "作為對我軍備戰動員的回應，[ROM.GetLeader]現已簽發1號統帥令，授意[ROM.GetAdjective]軍隊進入最高警戒狀態。[ROM.GetAdjective]空軍現已進入其戰備地點，雙方飛行員爆發了數次逼真的近距離搏鬥。[ROM.GetAdjective]大使目前正申請護照回國，儘管現在還沒有實質交火發生，但這場危機演變成戰爭也僅僅只是時間問題了。\n\n我國駐英法德三國的大使們報告稱，在他們各自所在的國家內，當地外交部門正在進行頻繁而緊張的活動，這表明上述國家可能會介入這場正在醞釀的危機。因此，如果我們希望武力解決，就必須迅速出擊。"
 DOD_hungary.54.a: "局勢正在失去控制"
 DOD_hungary.54.b: "那就讓戰爭開始吧"
 DOD_hungary.54.c: "提議進行公正的調停"
 DOD_hungary.55.t: "選擇調停方"
 DOD_hungary.55.desc: "儘管局勢高度緊張，但現在仍有機會通過外交途徑解決問題。目前，另一方正通過私下渠道與我們接觸，暗示他們並不反對由非利益相關國家組成委員會來調停解決此事。現在，我們應該求助於哪個國家來參與調解呢？"
 DOD_hungary.55.a: "向德國求助"
 DOD_hungary.55.b: "向英國求助"
 DOD_hungary.55.d: "向法國求助"
 DOD_hungary.55.c: "向蘇聯求助"
 DOD_hungary.55.e: "向意大利求助"
 DOD_hungary.55.f: "沒人願意搭理我們……"
 DOD_hungary.57.t: "[HUN.GetNameDefCap]讓步"
 DOD_hungary.57.desc: "儘管布達佩斯當局依然措辭嚴厲，但匈牙利人在邊境的武裝力量卻已撤離，對我國領空的侵犯也已終止。看來，他們的外交部達成了一致意見，即[HUN.GetLeader]希望盡力平息風波。既然我們也想避免開戰，和解的姿態也是可以給出的。"
 DOD_hungary.57.a: "得勝凱旋"
 DOD_hungary.58.t: "[HUN.GetNameDefCap]尋求調停"
 DOD_hungary.58.desc: "值此巴爾幹半島形勢急速滑向全面戰爭之際，匈牙利當局決定尋求對特蘭西瓦尼亞的爭端進行調解。他們日前求助於我國，希望我們作為仲裁委員會的一員，參與決定特蘭西瓦尼亞命運的進程。顯然，他們相信我們將在即將舉行的會議中贊成他們的主張。"
 DOD_hungary.58.a: "我們樂意效勞"
 DOD_hungary.58.b: "我們沒興趣代表他們"
 DOD_hungary.59.t: "[ROM.GetNameDefCap]尋求調停"
 DOD_hungary.59.desc: "面對匈牙利方面與日俱增的壓力，羅馬尼亞當局日前提議，通過一個公正的委員會以解決有關特蘭西瓦尼亞的爭端。他們已經向我國求助，希望我們能作為委員會一員發聲。毫無疑問，他們相信我們將捍衛其對該地區的主張。"
 DOD_hungary.59.a: "我們自當相助"
 DOD_hungary.59.b: "我們沒興趣維護他們"
 DOD_hungary.60.t: "巴爾幹危機"
 DOD_hungary.60.desc: "數日以來，匈牙利與羅馬尼亞兩國間本就緊張的關係，已經徹底破裂。隨著匈牙利方面要求羅馬尼亞向其移交爭議領土特蘭西瓦尼亞，而羅馬尼亞對此斷然拒絕，兩國都已經動員了各自軍隊，地區的戰爭似乎已經不可避免。\n\n外交部認為，為了捍衛我國在該地區的利益，有必要準備下場進行干預。另一方面來說，也許我國準備下場的威脅，也可以迫使涉事的國家重新回到談判桌上來。"
 DOD_hungary.60.a: "我們應給匈牙利撐腰"
 DOD_hungary.60.b: "我們應當支持羅馬尼亞"
 DOD_hungary.60.c: "這不過是巴爾幹上演的又一蠢事"
 DOD_hungary.61.t: "巴爾幹危機-[From.GetNameDef]支持匈牙利"
 DOD_hungary.61.desc: "[From.GetAdjective]大使在今天早上造訪我國外交部，告知我們其政府對當前的危機相當關切。我們為特蘭西瓦尼亞冒險一戰的決定，已經迫使[From.GetNameAdj]政府考慮站在匈牙利一方進行軍事幹預。"
 DOD_hungary.61.a: "我們可不能指望與他們掰手腕"
 DOD_hungary.61.b: "我們現在也退無可退"
 DOD_hungary.61.c: "請求進行調停"
 DOD_hungary.62.t: "巴爾幹危機-[From.GetNameDef]支持羅馬尼亞"
 DOD_hungary.62.desc: "日前，我國駐[From.GetNameDef]大使被傳召前去展開磋商。在會談中，他被告知，[From.GetNameDef]認為，羅馬尼亞的領土完整攸關其國家利益，其中，普洛耶什蒂油田對[From.GetNameDef]來說尤為重要。假使特蘭西瓦尼亞落入我國手中，或是我國奪佔羅馬尼亞全境，其石油供給將受到極大威脅。[From.GetAdjective]政府顯然不願承受此風險，其甚至威脅，如果戰爭爆發，他們將站在羅馬尼亞一方下場進行軍事幹預。"
 DOD_hungary.62.a: "我們只得讓步"
 DOD_hungary.62.b: "戰爭將在他們下場前結束"
 DOD_hungary.62.c: "請求進行調停"
 DOD_hungary.63.t: "調停失敗"
 DOD_hungary.63.desc_HUN_refused: "儘管我們已經使盡渾身解數，我們仍然無法為本國的主張爭取到任何支持。每個我們接觸的國家都拒絕了我們，還勸誡我們應當接受特蘭西瓦尼亞屬於羅馬尼亞的事實。\n\n但怎會有人能接受這般不可接受的事實？"
 DOD_hungary.63.desc_HUN_nothing: "特蘭西瓦尼亞會議的結果是個徹頭徹尾的災難。由於未知的原因，會議決定將特蘭西瓦尼亞全境都判給羅馬尼亞。儘管最終的條約中有一些應當保護當地匈牙利民族權益的條款，但毫無疑問，我們慘遭重大的外交失敗。"
 DOD_hungary.63.a: "我們被所有人背叛了！"
 DOD_hungary.63.b: "我們將誓死奪回失地！"
 DOD_hungary.64.t: "調停失敗"
 DOD_hungary.64.desc_ROM_refused: "儘管我們竭盡全力為本國主張爭取支持，但似乎如今鮮有國家有意維護《凡爾賽和約》以及《特里亞農條約》所確立的秩序。在諸如[HUN.GetLeader]這般惡霸環伺的當下，一切只有靠實力說話。"
 DOD_hungary.64.desc_ROM_nothing: "看起來，似乎條約和公理已經一文不值了。特蘭西瓦尼亞會議現已決定，將所有的爭議領土都判歸匈牙利所有。儘管政府上下還在為此重磅消息震驚不已，但現在必須作出抉擇了，我們是嚥下這個苦果，還是奮力加以抗爭？"
 DOD_hungary.64.a: "黑暗的一天"
 DOD_hungary.64.b: "我們仍將繼續抗爭"
 DOD_hungary.65.t: "匈牙利拒絕接受調停結果"
 DOD_hungary.65.desc: "當告知其有關於爭議領土的劃分結果時，[HUN.GetLeader]表示斷然拒絕。根據他的說法，任何與恢復匈牙利舊日疆域相悖的結果，都將被認為是對每一個匈牙利人（無論生死）的侮辱和冒犯。\n\n他甚至還說，外交和談判的時機已經結束了，而今唯有一種方法可以解決這個爭端。\n\n考慮到此前我們已表態支持他們，羅馬尼亞政府現在再度徵詢我國在此爭端上的態度。"
 DOD_hungary.65.a: "我們的承諾可沒包括這些"
 DOD_hungary.65.b: "必須在匈牙利人征服全地區前阻止他們"
 DOD_hungary.66.t: "羅馬尼亞拒絕接受調停結果"
 DOD_hungary.66.desc: "近期會議磋商的結果，並不符合羅馬尼亞政府的心意。[ROM.GetLeader]據說甚至沒有看完整個條約內容，就把它撕了個粉碎，聲稱他寧願砍了自己的手，也不要簽署這般喪權辱國的條約。\n\n匈牙利政府已經宣佈，他們完全願意為其合法合理的領土而戰，不過他們也徵詢我國意見，將在這場衝突中是何立場。"
 DOD_hungary.66.a: "讓我們祝福他們勝利"
 DOD_hungary.66.b: "我們樂意對其伸出援手"
 DOD_hungary.67.t: "談判破裂"
 DOD_hungary.67.desc: "由於涉事的兩個國家遲遲無法達成任何共識，列強間的調停談判已經完全破裂。任何妥協讓步的嘗試，都因另一方不可接受的要求而付諸東流。眼下，各國代表團皆已啟程回國，徒留爭端懸而未決。"
 DOD_hungary.67.a: "只有烈火與鐵血才能解決問題了"
 DOD_hungary.68.t: "特蘭西瓦尼亞仲裁案"
 DOD_hungary.68.desc: "如今，爭議雙方都請求我國仲裁特蘭西瓦尼亞的歸屬。為此，外交部已經準備瞭如下通告：\n\n“在當前局勢下，將特蘭西瓦尼亞判歸於任何一方，都非明智之舉。應當促成一個不受歡迎但卻能為雙方所接受的折中方案，以盡力避免任何一方因遭受侮辱而拒絕調停。”"
 DOD_hungary.68.a: "特蘭西瓦尼亞全境判歸匈牙利"
 DOD_hungary.68.b: "北特蘭西瓦尼亞判歸匈牙利"
 DOD_hungary.68.c: "特蘭西瓦尼亞仍屬羅馬尼亞"
 DOD_hungary.69.t: "特蘭西瓦尼亞妥協案"
 DOD_hungary.69.desc: "經過數小時的艱難談判，我們似乎終於趨近達成某種解決方案。壞消息是，我們將不得不把部分領土割讓給匈牙利。特蘭西瓦尼亞的北部將移交給對方，而我們僅保留南部。這遠非我們所期望的結果，但對局勢的現實評估表明，這恐怕已是我們所能爭取到的最好結局了。"
 DOD_hungary.69.a: "這結果勉強可以接受"
 DOD_hungary.69.b: "我們寸土不讓！"
 DOD_hungary.70.t: "特蘭西瓦尼亞妥協案"
 DOD_hungary.70.desc: "在清晨時分，會議上的各方代表終於敲定了一項折中方案。按照這一方案，我們將獲得北特蘭西瓦尼亞，而南部地區則繼續由羅馬尼亞保留。羅馬尼亞代表團已經對此表示同意。外交部警告說，若我們拒絕這一提議，將可能在外交上陷入孤立。"
 DOD_hungary.70.a: "這已是我們能指望的最佳結果"
 DOD_hungary.71.t: "特蘭西瓦尼亞會議-第一天"
 DOD_hungary.71.desc: "在完成禮節性的流程之後，來自匈牙利、羅馬尼亞和[ROM_mediator.GetNameDef]的代表團隨即就座，開始討論當前議題。各方已同意，由我們作為匈牙利方面的代表率先提出議案。"
 DOD_hungary.71.a: "特蘭西瓦尼亞全境判歸匈牙利"
 DOD_hungary.71.b: "北特蘭西瓦尼亞判歸匈牙利"
 DOD_hungary.71.c: "特蘭西瓦尼亞仍屬羅馬尼亞"
 DOD_hungary.72.t: "特蘭西瓦尼亞會議-第二天"
 DOD_hungary.72.desc_HUN_all: "匈牙利方面向我們提出了一項解決當前危機的方案。毫不意外，他們要求在條件允許的情況下，將整個特蘭西瓦尼亞盡數移交給匈牙利。我們可以接受這一提議，但這無疑會令我們的羅馬尼亞盟友大為惱火。\n\n我們也可以提出反議，我方外交主官強烈建議採取後者。一項折中的解決方案或許更能為雙方所接受。"
 DOD_hungary.72.desc_compromise: "匈牙利方面向我們提出了一項解決當前危機的方案。按照他們的提議，特蘭西瓦尼亞的北部將移交給匈牙利，而南部地區則由羅馬尼亞繼續保留。\n\n我方外交主官認為，這表明匈牙利方面已然心生怯意，我們應當藉機爭取更為有利的條件。"
 DOD_hungary.72.desc_HUN_nothing: "出乎意料地，匈牙利方面提出了一份相當和解的提案。整個特蘭西瓦尼亞將繼續由羅馬尼亞保有，只需在少數民族問題上作出一些輕微讓步。羅馬尼亞代表強烈敦請我們接受這一提議，並承諾只要達成協議，這些讓步將在數日內迅速落實。"
 DOD_hungary.72.a: "接受此提案"
 DOD_hungary.72.b: "爭取更優條件"
 DOD_hungary.73.t: "特蘭西瓦尼亞會議-第三天"
 DOD_hungary.73.desc: "隨著我們拒絕了匈牙利方面的提案後，現在輪到我方提出不同的議案了。"
 DOD_hungary.73.a: "特蘭西瓦尼亞全境判歸匈牙利"
 DOD_hungary.73.b: "北特蘭西瓦尼亞判歸匈牙利"
 DOD_hungary.73.c: "特蘭西瓦尼亞仍屬羅馬尼亞"
 DOD_hungary.74.t: "特蘭西瓦尼亞會議-第四天"
 DOD_hungary.74.desc_HUN_all: "羅馬尼亞方面似乎急於將此事儘快了結，他們不僅拒絕了我們先前那份頗具和解意味的提案，反而提出將整個特蘭西瓦尼亞悉數移交給匈牙利。在私下討論中，我們的代表團始終無法理解他們為何會提出這樣的方案，但這一提議看上去確實是真誠的。我們沒理由不對此笑納。"
 DOD_hungary.74.desc_compromise: "羅馬尼亞方面提出了一項折中方案，將特蘭西瓦尼亞一分為二。在兩國關係高度緊張的當下，這或許已是最為現實的解決途徑了。"
 DOD_hungary.74.desc_HUN_nothing: "毫不意外，羅馬尼亞方面在特蘭西瓦尼亞問題上寸步不讓。他們似乎已堅定決意，要將整個特蘭西瓦尼亞牢牢掌握在羅馬尼亞治下。在當前談判進程中，我們的選擇已所剩無幾——要麼接受他們的提議，要麼直接退出談判。"
 DOD_hungary.74.a: "我方接受"
 DOD_hungary.74.b: "此次失敗要由他們承擔！"
 DOD_hungary.75.a: "我們已盡人事"
 DOD_hungary.80.t: "匈牙利索取南斯洛伐克"
 DOD_hungary.80.desc: "匈牙利政府日前向我方提出要求，聲稱鑑於當地匈牙利族群正遭受迫害，我們應當將南斯洛伐克移交給他們。與此同時，一群自稱“襤褸衛隊”的恐怖分子在試圖自匈牙利越境時被捕。儘管這些人堅稱與匈牙利政府毫無關係，但他們身上攜帶的裝備卻帶有匈牙利官方標記。\n\n戰爭的氣息已愈發濃烈，但如果我們能爭取到某個主要國家的支持，也許仍然能夠以外交方式平息這場危機。"
 DOD_hungary.80.a: "我們沒希望贏下戰爭，放棄這些領土"
 DOD_hungary.80.b: "向諸盟國呼籲援助"
 DOD_hungary.80.c: "向德國呼籲援助"
 DOD_hungary.80.d: "我們可不是嚇大的！"
 DOD_hungary.81.t: "[From.GetNameDefCap]歸還南斯洛伐克"
 DOD_hungary.81.desc: "[From.GetName]已經交還南斯洛伐克，並將其部隊撤至分界線之外。我們現在已經全面控制了該地區。"
 DOD_hungary.81.a: "很好"
 DOD_hungary.82.t: "[CZE.GetName]請求援助"
 DOD_hungary.82.desc: "[CZE.GetName]大使日前向我方遞交了緊急的求援照會。近期，[HUN.GetNameDef]在南斯洛伐克發動了一場大規模的破壞穩定行動，其目的昭然若揭——為一場“保護其所謂公民”的入侵製造藉口。\n\n[CZE.GetAdjective]政府已正式請求我們在此事上給予支持。"
 DOD_hungary.82.a: "他們應當得到幫助"
 DOD_hungary.82.b: "這不是我們的戰爭"
 DOD_hungary.83.t: "[SLO.GetName]請求援助"
 DOD_hungary.83.desc: "近期，[SLO.GetName]正承受著來自[HUN.GetNameDef]的巨大壓力，匈牙利方面要求其歸還南部邊境一帶的部分地區——這些領土在過去曾屬於匈牙利。[HUN.GetAdjective]政府已經表示，若事態發展至那一步，他們完全準備以武力奪回。\n\n我們絕不能容許如此微小的爭端在該地區引發戰爭，理應推動以外交方式解決此事。"
 DOD_hungary.83.a: "慫恿匈牙利放手去幹"
 DOD_hungary.83.b: "奉勸匈牙利即刻收手"
 DOD_hungary.84.t: "[From.GetName]拒絕"
 DOD_hungary.84.desc: "[From.GetName]甚至拒絕就我們的要求展開任何討論，堅稱該領土自始至終都是[From.GetName]的一部分，並誓言要“戰至最後一人、最後一顆子彈、最後一口氣”。"
 DOD_hungary.84.a: "我們還有機會，但不是現在"
 DOD_hungary.84.b: "那我們便如其所願"
 DOD_hungary.85.t: "[From.GetNameDefCap]就南斯洛伐克問題發出警告"
 DOD_hungary.85.desc: "[From.GetNameDef]政府正式通知我們，斯洛伐克的領土完整絕不容置疑，也不在任何談判之列。他們進一步要求我方立即撤出在該地區內的一切正規或非正規武裝，否則後果自負。"
 DOD_hungary.85.a: "我們已經受夠所謂“民族自決”了"
 DOD_hungary.85.b: "我們會拿回應得之物"
 DOD_hungary.86.t: "[From.GetNameDefCap]拒絕支持我方"
 DOD_hungary.86.desc: "[From.GetAdjective]政府拒絕在[HUN.GetAdjective]公然的侵略面前支持我們。雖然他們對我國處境表示同情，但亦不願為捍衛它付出鮮血或財富。"
 DOD_hungary.86.a: "我們可沒法僅靠善意言語贏得戰爭"
 DOD_hungary.86.b: "那我們便獨自應戰"
 DOD_hungary.90.t: "[HUN.GetNameDefCap]索取[45.GetName]"
 DOD_hungary.90.desc: "[HUN.GetAdjective]政府現已就伏伊伏丁那問題加大施壓力度，他們強調該地在舊帝國時期就是匈牙利的一部分，因此理應予以歸還。他們還聲稱，鑑於世界大戰末期此地被併入塞爾維亞是“迫於外界壓力的無效之舉”，故其在領土法理上也依然屬於[HUN.GetAdjective]。"
 DOD_hungary.90.a: "這不是我們能贏下的戰爭"
 DOD_hungary.90.b: "我們可不會縱容他們的妄想"
 DOD_hungary.91.t: "[FROM.GetNameDefCap]移交伏伊伏丁那"
 DOD_hungary.91.desc: "\n[FROM.GetNameDef]已經同意將伏伊伏丁那割讓給我國。我方軍隊現已接管該地控制。"
 DOD_hungary.91.a: "很好"
 DOD_hungary.92.t: "[From.GetNameDefCap]拒絕我方要求"
 DOD_hungary.92.desc: "在與[FROM.GetLeader]的一場緊張會晤中，我方代表團被明確告知，伏伊伏丁那的主權問題絕不在討論之列，[FROM.GetAdjective]政府也絕不會在當前壓力態勢下低頭。伏伊伏丁那的人民在1919年已經作出選擇，他們選擇留在[FROM.GetNameDef]。就[FROM.GetAdjective]政府而言，此事到此為止。"
 DOD_hungary.92.a: "或許就該這樣"
 DOD_hungary.92.b: "請求德國提供支持"
 DOD_hungary.92.c: "請求意大利提供支持"
 DOD_hungary.92.d: "呼籲德意兩國提供援助"
 DOD_hungary.92.e: "我們將自行了結此事"
 DOD_hungary.93.t: "匈牙利尋求聯合對南斯拉夫施壓"
 DOD_hungary.93.desc: "在日前於蘇黎世的會晤中，[HUN.GetAdjective]政府的代表試探性地與我方接觸，探討對[YUG.GetNameDef]採取聯合行動的可能性。迄今為止，[YUG.GetAdjective]政府始終拒絕了[HUN.GetAdjective]關於歸還其在世界大戰結束時被[YUG.GetNameDef]吞併領土的要求。鑑於我們同樣與[YUG.GetNameDef]存在領土爭議，我們可以選擇與匈牙利聯手並向其發出嚴厲的最後通牒，但這可能會將我們一併拖入戰爭。"
 DOD_hungary.93.a: "他們將獲得我方全力支持"
 DOD_hungary.93.b: "我們可不會介入此事"
 DOD_hungary.94.t: "[From.GetNameDefCap]就對抗南斯拉夫提供支持"
 DOD_hungary.94.desc: "\n通過與[From.GetNameDef]的秘密渠道談判，我們現在原則上達成了一致：南斯拉夫應當被徹底解體，或者至少被大幅削減其疆域。\n\n隨著新幫手的加入，我們如今可以憑壓倒性的優勢與[YUG.GetAdjective]政府談判。或者我們也可以選擇趁其軍隊尚未做好準備之際，以武力解決這一問題。"
 DOD_hungary.94.a: "向貝爾格萊德下達最後通牒！"
 DOD_hungary.94.b: "即刻發動突擊！"
 DOD_hungary.95.t: "[From.GetNameDefCap]拒絕我方提議"
 DOD_hungary.95.desc: "\n經過數輪談判，我們在重組南斯拉夫的問題上仍未能與[From.GetAdjective]政府達成任何協議。[From.GetLeader]親筆簽署的一份照會中指出，所有未解決的領土問題都將由雙方在“情況需要時”以雙邊方式處理。"
 DOD_hungary.95.a: "真是遺憾"
 DOD_hungary.95.b: "那我們就自己解決問題！"
 DOD_hungary.96.t: "來自布達佩斯的最後通牒"
 DOD_hungary.96.desc_HUN_GER: "我們對匈牙利在伏伊伏丁那問題上的最新要求作出了強硬回應，但這非但沒有緩和局勢，反而似乎促成了匈牙利與德國之間魔鬼的交易。在最近的一次演講中，[GER.GetLeader]將斯洛文尼亞稱為“祖國尚未收復的一箇舊省份”，並聲稱應儘快將其收回。隨後，匈牙利與德國的大使同時遞交了一份照會，要求我們立即將伏伊伏丁那與斯洛文尼亞移交於其各自的控制之下。"
 DOD_hungary.96.desc_HUN_ITA: "我們對匈牙利在伏伊伏丁那問題上的最新要求作出了強硬回應，但這非但沒有緩和局勢，反而似乎促成了匈牙利與意大利之間魔鬼的交易。在最近的一次演講中，[ITA.GetLeader]將達爾馬提亞稱為“亞得里亞海未贖回的彼岸”，並聲稱應儘快將其收回。隨後，匈牙利與意大利的大使同時遞交了一份照會，要求我們立即將伏伊伏丁那與達爾馬提亞移交於其各自的控制之下。"
 DOD_hungary.96.desc_HUN_both: "我們拒絕向匈牙利的要求低頭，但這並未促使布達佩斯有所收斂。來自匈牙利首都的激烈言辭，如今又得到了羅馬與柏林同樣令人不安的表態呼應。兩國不僅公開支持匈牙利的立場，還分別提出了各自的附加要求。日前，來自三國的大使一同出現在外交部，正式遞交了一份照會，要求我們將伏伊伏丁那、斯洛文尼亞與達爾馬提亞分別移交予其各自的聲索方。"
 DOD_hungary.96.a: "我們除接受外已別無他法"
 DOD_hungary.96.b: "我們寧願戰死沙場！"
 DOD_hungary.97.t: "南斯拉夫決意頑抗"
 DOD_hungary.97.desc: "儘管形勢對他們極為不利，[YUG.GetAdjective]政府仍拒絕聽取我們的勸告，甚至還告知我方代表，若我們試圖以武力解決問題，[YUG.GetAdjective]軍隊已做好充分準備，隨時迎戰。"
 DOD_hungary.97.a: "那就開戰吧"
 DOD_hungary.100.t: "匈牙利索取斯洛伐克"
 DOD_hungary.100.desc: "匈牙利政府日前就斯洛伐克的未來地位問題，向我方提出了接觸。他們堅信，鑑於斯洛伐克在舊帝國時期就屬於匈牙利，其命運理也應完全由匈牙利決定。\n\n儘管匈牙利代表刻意避免發出任何明確的威脅，但我方情報部門報告稱，匈牙利軍隊內部出現了令人不安的大量動向。"
 DOD_hungary.100.a: "我們別無選擇"
 DOD_hungary.100.b: "我們寸步不退"
 DOD_hungary.101.t: "斯洛伐克移交"
 DOD_hungary.101.desc: "斯洛伐克已經回到了我方的控制之下，接下來我們必須決定如何對其加以組織。政府內部的許多人主張直接吞併，稱之為“重返歷史疆界”；但也有人擔憂，將如此眾多的非匈牙利族群納入國家體系可能會帶來不良影響。他們更傾向於在布拉迪斯拉發設立一個權力下放的地方政府，賦予其一定的內部自治，但在其他一切事務上須與我們保持緊密一致。"
 DOD_hungary.101.a: "我們將重回歷史疆界"
 DOD_hungary.101.b: "建立傀儡政府更為可取"
 DOD_hungary.102.t: "[From.GetNameDefCap]拒絕移交斯洛伐克"
 DOD_hungary.102.desc: "關於斯洛伐克移交的談判幾乎在一開始便陷入僵局。[From.GetAdjective]代表團明確表示，其維持現狀的基本立場並未有任何改變。儘管我方代表團也不由分說地重申了本國立場，即斯洛伐克是我方在世界大戰末期被非法奪取的核心領土。\n\n談判現已陷入僵局，而雙方不斷累積的挫折感，也使得未來再出現任何進展的可能性變得愈發渺茫。"
 DOD_hungary.102.a: "且讓爭議就此擱置"
 DOD_hungary.102.b: "接洽德國商討瓜分該國"
 DOD_hungary.103.t: "匈牙利希望瓜分[CZE.GetNameDef]"
 DOD_hungary.103.desc: "匈牙利政府日前向我方提出了一項瓜分[CZE.GetNameDef]的建議。根據他們的設想，我們將獲得該國的西部地區，而匈牙利則取得斯洛伐克的大部分，兩國之間的分界線將大致在該國境內作等分劃定。\n\n他們向我方保證，只要最終能夠分得屬於他們的那一份，他們願意讓我們率先採取行動。"
 DOD_hungary.103.a: "我們將認真考慮其利益"
 DOD_hungary.103.b: "他們什麼也別想得到"
 germany.55.do: "兌現對匈牙利的承諾"
 DOD_hungary.104.t: "[GER.GetLeader]表示同意"
 DOD_hungary.104.desc: "在一份密電中，德國政府已經向我方保證其將在決定[CZE.GetNameDef]命運時考慮我們的利益。至於此事何時兌現則尚未可知。"
 DOD_hungary.104.a: "很好"
 DOD_hungary.105.t: "德國拒絕參與瓜分[CZE.GetName]"
 DOD_hungary.105.desc: "\n當聽說我方有關瓜分[CZE.GetNameDef]的提案後，[From.GetLeader]據稱勃然大怒，訓斥我們是“不知天高地厚的過氣之輩”。\n\n無須多言，我國的提議並未被接受。"
 DOD_hungary.105.a: "真是粗鄙"
 DOD_hungary.105.b: "我們將奪回應得之物"
 DOD_hungary.106.t: "[From.GetLeader]背信棄義"
 DOD_hungary.106.desc: "儘管[From.GetLeader]曾以書面形式向我方作出承諾，德國政府卻並未履行其對我們的任何義務。在最近決定[CZE.GetNameDef]命運的談判中，我方完全被排除在外，只是被當作迫使他人就範的工具而已。顯然，[From.GetLeader]從一開始就沒有打算信守承諾。"
 DOD_hungary.106.a: "提出最嚴正抗議"
 DOD_hungary.106.b: "動員軍隊"
 DOD_hungary.107.t: "匈牙利謀求建立宗主國地位"
 DOD_hungary.107.desc_SLO_independent: "在匈牙利軍方連續數週的緊張動員之後，[HUN.GetLeader]發表了一份公告，宣稱斯洛伐克當前局勢已對匈牙利構成嚴重關切，並要求我方作出若干保證。\n\n除其他事項外，我們在加入任何聯盟或簽署任何條約前，都必須事先徵得他們同意，同時還要接收一個負責協調我國軍事活動的匈牙利軍事代表團。"
 DOD_hungary.107.desc_SLO_puppet: "一個匈牙利的代表團日前造訪我國，就斯洛伐克問題與我方展開會談。他們認為，該國屬於其歷史勢力範圍，對於我方在斯洛伐克大政方針上施加的影響力深感憂慮。\n\n該代表團的負責人甚至聲稱，斯洛伐克領土可能被用作對匈牙利發動進攻的跳板。\n\n他們建議，應允許匈牙利政府在斯洛伐克國內擁有與我方目前相當的影響力。"
 DOD_hungary.107.a: "很好"
 DOD_hungary.107.b: "絕不可能"
 DOD_hungary.108.t: "我國成功掌控斯洛伐克"
 DOD_hungary.108.desc: "我國全權代表現已進駐布拉迪斯拉發，以確保斯洛伐克政府的大政方針與我國緊密配合。"
 DOD_hungary.108.a: "很好"
 DOD_hungary.109.t: "斯洛伐克拒絕接受掌控"
 DOD_hungary.109.desc: "儘管我們已盡最大努力，但斯洛伐克政府仍然拒絕在與我方交往中居於從屬地位。我們現在必須考慮軍事行動的可能性，以確保北部邊境的安全。"
 DOD_hungary.109.a: "無論如何我們都要得到此地"
 DOD_hungary.110.t: "匈牙利希望向羅馬尼亞施壓"
 DOD_hungary.110.desc: "[HUN.GetLeader]日前抵達莫斯科，就羅馬尼亞問題與我方展開討論。在世界大戰結束時，羅馬尼亞曾非法奪取了多處領土，其中包括比薩拉比亞與特蘭西瓦尼亞。我們匈牙利的同志們建議，應當向羅馬尼亞施加壓力，促使其將這些領土歸還給合法的所有者。"
 DOD_hungary.110.a: "這是絕妙的建議，同志們！"
 DOD_hungary.110.b: "眼下時機未到"
 DOD_hungary.111.t: "赤色的最後通牒"
 DOD_hungary.111.desc: "[HUN.GetNameDef]與[SOV.GetNameDef]兩國政府日前向我方遞交了一份聯合照會，聲明他們認為我國對特蘭西瓦尼亞與比薩拉比亞兩地的領土兼併毫無合法性可言。在他們看來，這些地區正處於我方的非法佔領之下，而現在，他們給予我們最後一次從上述地區撤出的機會。"
 DOD_hungary.111.a: "我們別無選擇"
 DOD_hungary.111.b: "也許我們可以達成妥協"
 DOD_hungary.111.c: "共產主義意識形態的政府或許能爭取到更好的結果。"
 DOD_hungary.111.d: "我國領土神聖不可侵犯！"
 DOD_hungary.112.t: "[SOV.GetLeader]拒絕我方提議"
 DOD_hungary.112.desc: "在最近的莫斯科之行中，[HUN.GetLeader]不得不忍受與[SOV.GetLeader]長達數小時的艱苦會晤，期間後者反覆斥責他在提出這樣明顯荒謬的方案時簡直愚不可及。顯然，我們至今仍未真正理解民族領土在革命鬥爭中的作用，因此在戰略判斷上得出了完全錯誤的結論。"
 DOD_hungary.112.a: "那我們就自行推進此事"
 DOD_hungary.112.b: "我們將反思自身錯誤"
 DOD_hungary.113.t: "羅馬尼亞提供折中方案"
 DOD_hungary.113.desc: "在[ROM.GetLeader]領導下的羅馬尼亞政府現已派出代表團前往莫斯科，就爭議領土問題展開談判。他們似乎認為，可以通過割讓部分爭議地區以換取保住其餘部分，從而達成某種折中解決的方案。若我們接受這一思路，那麼我們應要求哪一部分呢？"
 DOD_hungary.113.a: "強迫其割讓特蘭西瓦尼亞"
 DOD_hungary.113.b: "強迫其割讓比薩拉比亞"
 DOD_hungary.113.c: "嚴正重申我方最初要求"
 DOD_hungary.114.t: "羅馬尼亞提供政治妥協方案"
 DOD_hungary.114.desc: "出乎意料地，[ROM.GetLeader]提出，若我方願意為羅馬尼亞的邊界提供保障，他願意與羅馬尼亞共產黨分享政權。此舉或許能使我們在該地區擴大影響力，而不必冒著爆發戰爭的風險。"
 DOD_hungary.114.a: "革命的步伐永不停歇"
 DOD_hungary.114.b: "依舊堅持領土要求"
 DOD_hungary.115.t: "羅馬尼亞斷然拒絕我方要求"
 DOD_hungary.115.desc: "[ROM.GetAdjective]政府已拒絕就爭議領土展開任何談判。在一次私下會晤中，羅馬尼亞外長甚至對我方大使直言：若我們想獲得這些土地，唯一的途徑就是以百萬人的犧牲來換取。"
 DOD_hungary.115.a: "倒也不至於如此"
 DOD_hungary.115.b: "繼續堅持領土要求"
 DOD_hungary.115.c: "那就讓他們見識下百萬大軍"
 DOD_hungary.116.t: "[SOV.GetLeader]就提議作出回應"
 DOD_hungary.116.desc_transylvania: "在與我方代表團會晤後，[SOV.GetLeader]向我們提出了一種折中方案。[SOV.GetNameDefCap]原則上同意比薩拉比亞應繼續由我方保有，但由蘇聯與唐努圖瓦官員組成的所謂“獨立邊界委員會”卻得出結論：特蘭西瓦尼亞的大部分應當劃歸匈牙利所有。"
 DOD_hungary.116.desc_bessarabia: "在與我方代表團會晤後，[SOV.GetLeader]向我們提出了另一種折中方案。在匈牙利代表團明顯缺席的情況下，蘇方告知我方：只要我們同意將比薩拉比亞割讓給他們，他們就放棄關於移交特蘭西瓦尼亞的要求。"
 DOD_hungary.116.desc_no_deal: "在與我方代表團的會晤中，蘇聯和匈牙利方面再次重申了他們的要求：除非比薩拉比亞與特蘭西瓦尼亞分別移交給各自的聲索方，否則他們將考慮採取軍事手段。"
 DOD_hungary.116.a: "可以接受"
 DOD_hungary.116.b: "我們對此絕不接受！"
 DOD_hungary.117.t: "[SOV.GetLeader]接受提議"
 DOD_hungary.117.desc: "蘇聯人已接受我方讓共產黨執掌政權的提議。[SOV.GetLeader]親自向我方代表團保證，今後將不再對我方提出任何新的領土要求——至少不會由共產國際提出。"
 DOD_hungary.117.a: "我們會讓其信守承諾的"
 DOD_hungary.118.t: "蘇聯人退縮讓步"
 DOD_hungary.118.desc: "我方對蘇匈兩國的強硬回應似乎已初見成效。《真理報》近日發表頭版社論，公開抨擊“反社會主義的修正主義領土訴求”，並特別點名比薩拉比亞與特蘭西瓦尼亞問題，稱此類主張是“發達社會主義國家絕不會採取的帝國主義行徑”。\n\n然而，布達佩斯方面的反應卻異常冷淡。[HUN.GetLeader]或許仍對我方領土心懷企圖。"
 DOD_hungary.118.a: "我們樂於看到他們前來試試"
 DOD_hungary.120.t: "匈牙利提議支持捷克斯洛伐克"
 DOD_hungary.120.desc: "[HUN.GetLeader]日前訪問莫斯科，帶來了一項提案：若我方願與匈牙利共同向[CZE.GetNameDef]提供安全保證，作為交換，捷克斯洛伐克將解除對共產黨的一切限制，並將南斯洛伐克的主權移交給匈牙利。"
 DOD_hungary.120.a: "好主意"
 DOD_hungary.120.b: "為何我們要捲入帝國主義的戰爭中？"
 DOD_hungary.121.t: "共產國際提供保證"
 DOD_hungary.121.desc: "[HUN.GetNameDef]與[SOV.GetNameDef]兩國大使日前與我們接洽，向我方提出了一項聯名的建議：他們願意對我方邊界提供抵禦任何外來侵略的安全保證。作為交換，我方必須確保共產黨在我國政府中佔有席位。此外，匈牙利還將其承諾與向其歸還南斯洛伐克捆綁在了一起。"
 DOD_hungary.121.a: "可以接受的代價"
 DOD_hungary.121.b: "這些要求正是我們要抵制的！"
 DOD_hungary.122.t: "捷克斯洛伐克拒絕我方提議"
 DOD_hungary.122.desc: "我方提出的安全保證並未得到[CZE.GetAdjective]方面的積極回應。而我方所要求的那些政治讓步也在[CZE.GetNameDef]國內引發強烈反彈，多名高級將領與政界要員揚言，一旦政府接受這些條件，他們將立刻辭職。\n\n[CZE.GetAdjective]政府以“無法確保支援能及時抵達”為由，現已正式拒絕了我方的提議。"
 DOD_hungary.122.a: "情理之中的反應"
 DOD_hungary.122.b: "尋求與德國人接洽"
 DOD_hungary.123.t: "[SOV.GetLeader]拒絕我方提議"
 DOD_hungary.123.desc: "站在一幅巨大的歐洲地圖前，[SOV.GetLeader]對我方代表團進行了長達一小時的訓誡，反覆指出我們方案中的各種缺陷與漏洞，並就我方提議的荒謬愚蠢大加批判，甚至指責我方與帝國主義者同流合汙。\n\n我方代表團現已從莫斯科空手而歸——但至少人都還活著。"
 DOD_hungary.123.a: "或許這終究不是最佳方案"
 DOD_hungary.123.b: "尋求與德國人接洽"
 DOD_hungary.124.t: "[From.GetNameDefCap]提議瓜分捷克斯洛伐克"
 DOD_hungary.124.desc: "[From.GetAdjective]外長日前抵達柏林，就一項兩分[CZE.GetNameDef]的方案展開磋商。根據擬議條約的內容，雙方將對各自劃定的區域擁有完全的控制權。理所當然，我們將獲得西部的波希米亞與摩拉維亞，而他們則會收下斯洛伐克。"
 DOD_hungary.124.a: "誘人的計劃"
 DOD_hungary.124.b: "我們絕不容忍其干涉鄰國事務！"
 DOD_hungary.126.t: "[CZE.GetAdjective]人表示拒絕"
 DOD_hungary.126.desc: "根據日前的報道，[CZE.GetAdjective]政府以交涉方所要求的種種讓步“難以接受”為由，拒絕了後者為其提供的安全保證。\n\n然而，我方駐[SOV.GetNameDef]大使報告稱，[SOV.GetAdjective]外交部近期動向頻繁。外交圈內流言四起，指向蘇聯可能正在與德國探討某項協議。"
 DOD_hungary.126.a: "且讓我們拭目以待"
 DOD_hungary.127.t: "德國同意參與瓜分[CZE.GetNameDef]"
 DOD_hungary.127.desc: "[GER.GetLeader]已簽署一份名為《柏林秘密條約》的協議，德方在其中同意將[CZE.GetNameDef]劃分為兩大勢力範圍，並承諾尊重我方在斯洛伐克問題上所作出的任何決定。"
 DOD_hungary.127.a: "外交上的勝利"
 DOD_hungary.127.b: "這並非我們預期的方案"
 DOD_hungary.128.t: "德國拒絕提議"
 DOD_hungary.128.desc: "日前，在與我國大使的會晤中，[GER.GetLeader]已明確表示，德國政府認為[CZE.GetNameDef]完全處於其勢力範圍之內，任何對該國疆界的干涉都將被視為敵對行為。"
 DOD_hungary.128.a: "真是無禮"
 DOD_hungary.128.b: "他們顯然是在虛張聲勢"
 DOD_hungary.129.t: "德國下達最後通牒"
 DOD_hungary.129.desc: "德國大使在今日遞交了由[GER.GetLeader]簽署的照會，作為新任的“護國公”，後者要求我們立即將政府大權交由他本人暫管，直到柏林方面指派的特別行政長官抵達為止。同樣在這份照會中，德國大使還要求在斯洛伐克相關事務上，[From.From.GetNameDef]也要享有相同的權力。\n\n照會威脅稱，若我方拒絕，其將採取“迅速而果斷的軍事行動”。"
 DOD_hungary.129.a: "我們別無選擇"
 DOD_hungary.129.b: "把他擲出窗外！"
 DOD_hungary.130.t: "[From.GetAdjective]人放棄對話談判"
 DOD_hungary.130.desc: "儘管先前進展順利，但看來[From.GetLeader]的政府在最後關頭改變了主意，不再接受原定條約草案。他們對這一決定的具體原因諱莫如深，不過我方情報部門懷疑，其武裝力量的準備程度不足才是背後的主要動因。"
 DOD_hungary.130.a: "真是遺憾"
 DOD_hungary.140.t: "[FROM.GetNameDefCap]要求獲權軍備重整"
 DOD_hungary.140.desc: "以歐洲政局日益惡化以及國際聯盟在遏止局勢方面的徹底失能為由，日前，[HUN.GetLeader]公開宣佈，其政府將尋求鄰國的支持，以推動《特里亞農條約》的修訂。[HUN.GetLeader]在發言中並未提及任何領土訴求，而是將重點放在條約對匈牙利軍事力量的限制上。\n\n匈牙利方面的代表團現已抵達我國首都，意在爭取我方正式同意其重整軍備。"
 DOD_hungary.140.a: "他們理所當然得獲准自衛"
 DOD_hungary.140.b: "他們可已經把世界捲入過一次戰爭了！"
 DOD_hungary.141.t: "[HUN.GetNameDefCap]在軍備重整問題上獲得[From.GetAdjective]支持"
 DOD_hungary.141.desc: "日前，[From.GetAdjective]政府未經與我方商議，便與匈牙利簽署了一項新條約，對《特里亞農條約》的軍事限制進行了修訂乃至徹底取消。根據該協議，匈牙利現被允許自由重整軍備，發展包括坦克與飛機在內的各類軍事裝備。\n\n儘管匈牙利擴軍一事早已是公開的秘密，但有了這份新協議，他們的軍事實力將很快增長到足以再度對我國構成威脅的程度。"
 DOD_hungary.141.a: "我們必須趁為時未晚率先動手！"
 DOD_hungary.141.b: "提出外交抗議"
 DOD_hungary.141.c: "遵從[From.GetAdjective]的意見"
 DOD_hungary.142.t: "《布萊德協議》"
 DOD_hungary.142.desc: "我方已成功爭取到[From.GetAdjective]方面對《特里亞農條約》部分修訂的支持，條約中針對我國軍事的所有限制都已被解除。國際軍備調查員現已離境，戰爭部也已擬定初步方案，準備著手對我國武裝部隊進行適度擴編。"
 DOD_hungary.142.a: "非常好"
 DOD_hungary.143.t: "[From.GetNameDefCap]發出抗議照會"
 DOD_hungary.143.desc: "日前，[From.GetAdjective]大使轉交了如下照會：\n“[From.GetNameDef]政府對[HUN.GetNameDef]近期的動向深表關切。《特里亞農條約》一直以來都是本地區和平與穩定的保障。雖然[From.GetAdjective]政府原則上接受各國選擇自身道路的權利，但我們必須以最嚴正的態度敦促[HUN.GetNameDef]政府切實遵守該條約。若局勢進一步遭到破壞，其後果極可能迅速失控。”"
 DOD_hungary.143.a: "那他們自便"
 DOD_hungary.144.t: "[From.GetNameDefCap]在軍備重整問題上立場強硬"
 DOD_hungary.144.desc: "關於《特里亞農條約》可能修訂的談判在最初的階段之後，便幾乎再沒有取得任何進展。[From.GetNameDef]政府明確表示，他們絕不會在維持現狀的立場上退讓分毫。\n\n我方唯有接受這一結果，或嘗試爭取第三方的支持。"
 DOD_hungary.144.a: "我們只能屈服於其壓力"
 DOD_hungary.144.b: "尋求得到某大國的支持"
 DOD_hungary.145.t: "尋求支持"
 DOD_hungary.145.desc: "隨著布萊德會議陷入徹底僵局，我方必須通過引入外部力量來重新奪回外交主動權。若能爭取到一方大國的支持，[From.From.GetLeader]或許仍會被迫讓步。那麼，我們應當接觸哪國？"
 DOD_hungary.145.a: "德國"
 DOD_hungary.145.b: "法國"
 DOD_hungary.145.c: "蘇聯"
 DOD_hungary.145.d: "意大利"
 DOD_hungary.145.e: "英國"
 DOD_hungary.146.t: "[HUN.GetLeader]尋求外交支持"
 DOD_hungary.146.desc: "匈牙利政府目前正試圖推動修訂《特里亞農條約》，以便著手重建其軍備。然而，布萊德會議上的談判已連續數日停滯不前。對此，匈牙利大使已向我方政府提出請求，希望我們對另一方施加外交壓力。\n\n外交部警告稱，若在此事上站在匈牙利一邊，必將損害我們與其周遭鄰國的關係，且會撼動該地區的力量平衡。然而，若拒絕匈牙利，後者或將採取激進行動以至徹底放棄外交途徑，從而令整個地區局勢地動山搖。"
 DOD_hungary.146.a: "必須准許匈牙利重整軍備"
 DOD_hungary.146.b: "匈牙利別想指望能重整軍備"
 DOD_hungary.147.t: "[From.GetNameDefCap]介入匈牙利軍備重整危機"
 DOD_hungary.147.desc: "在一封致我方的私人信函中，[From.GetLeader]敦促我們重新考慮在匈牙利軍備重整問題上的立場。其中他特別指出，即便現在允許匈牙利重新武裝，對方也需要數年時間才能組建出足以對本地區造成威脅的軍隊。\n\n若在此事上繼續堅持，只會讓我方面臨外交上的孤立。我們必須做出決斷，這樣的安全收益是否值得付出相應的代價。"
 DOD_hungary.147.a: "但願他們是對的吧"
 DOD_hungary.147.b: "我們知道怎麼做對自己是最好的"
 DOD_hungary.148.t: "布萊德會議失敗"
 DOD_hungary.148.desc: "在數日激烈的談判後，布萊德方面最終還是毫無進展，各代表團現已陸續打道回府。就連[From.From.GetLeader]的介入也未能改變僵局。\n\n外交體系內部如今怨氣頗深。許多資深外交官建議我們無論如何都應立即重整軍備，以此向[From.GetLeader]展示拒絕談判會導致怎樣的後果。"
 DOD_hungary.148.a: "我們可不能冒險開戰"
 DOD_hungary.148.b: "此刻應當以行動代替言辭！"
 DOD_hungary.150.t: "戰鬥機競標"
 DOD_hungary.150.desc: "最新的現代空戰研究表明，我國空軍體系存在嚴重弱點。相較於其他國家，我國在戰鬥機的發展上已遠遠落後。對此，空軍部現已啟動緊急項目，以期儘快獲得一款現代化戰鬥機。由於本國自行研發所需時間過長難以枯等，政府決定從國外購買生產許可，並已追加撥款。\n\n然而，專家們對於何種機型最適合用來推進我軍戰鬥機聯隊的現代化，至今仍然意見不一。"
 DOD_hungary.150.a: "小巧的輕型截擊機"
 DOD_hungary.150.b: "龐大的重型戰鬥機"
 DOD_hungary.151.t: "輕型戰鬥機競標"
 DOD_hungary.151.desc_light_fighter: "空軍部正尋求購入一款新式輕型戰鬥機，用於實施戰鬥機掃蕩與要點防空等進攻性任務。然而，外交部則建議，在決定購自何國時，也應將政治與外交層面的因素納入考量之中。"
 DOD_hungary.151.desc_light_fighter_refused: "以國家安全為由，[From.GetAdjective]政府拒絕向我方出售生產許可。我們或許更應嘗試向其他國家尋求合作，或者將現役機型進行緊急升級，以作為權宜之計。"
 DOD_hungary.151.a: "與德國接洽"
 DOD_hungary.151.b: "與意大利接洽"
 DOD_hungary.151.c: "與法國接洽"
 DOD_hungary.151.d: "與英國接洽"
 DOD_hungary.151.e: "與美國接洽"
 DOD_hungary.151.f: "運用競標經驗改進國產飛機"
 DOD_hungary.152.t: "重型戰鬥機競標"
 DOD_hungary.152.desc_heavy_fighter: "空軍部正尋求購入一款新式重型戰鬥機，用於執行遠程截擊與轟炸機護航等任務。然而，外交部則建議，在決定購自哪一國家時，也應將政治與外交層面的因素納入考量之中。"
 DOD_hungary.152.desc_heavy_fighter_refused: "以國家安全為由，[From.GetAdjective]政府拒絕向我方出售生產許可。我們或許更應嘗試向其他國家尋求合作，或者將現役機型進行緊急升級，以作為權宜之計。"
 DOD_hungary.153.t: "[From.GetAdjective]戰鬥機競標"
 DOD_hungary.153.desc: "[From.GetAdjective]空軍目前正在舉行新式輕型戰鬥機的試飛評估。根據我方駐外空軍武官的情報，我國的最新機型極有可能拔得頭籌。[From.GetAdjective]政府預計將很快向我們正式提出採購請求。\n\n雖然製造商代表強烈支持這筆出口，但向外國出售我軍最先進的裝備仍存在國家安全方面的隱患。我們是否應當批准這筆軍售？"
 DOD_hungary.153.a: "當然批准"
 DOD_hungary.153.b: "我們不能冒險洩密"
 DOD_hungary.154.desc: "[From.GetAdjective]空軍目前正在舉行新式重型戰鬥機的試飛評估。根據我方駐外空軍武官的情報，我國的最新機型極有可能拔得頭籌。[From.GetAdjective]政府預計將很快向我們正式提出採購請求。\n\n雖然製造商代表強烈支持這筆出口，但向外國出售我軍最先進的裝備仍存在國家安全方面的隱患。我們是否應當批准這筆軍售？"
 DOD_hungary.155.t: "戰鬥機競標完成"
 DOD_hungary.155.desc: "經過與製造商及政府官員的談判，我方已成功取得新型戰鬥機的生產許可。該機的一架樣機已運抵國內，用於培訓維修人員；完整的設計圖紙與製造藍圖也預計將很快送達。我們隨時都可以開始投入生產。"
 DOD_hungary.155.a: "真不錯"
 DOD_hungary.160.t: "轟炸機競標"
 DOD_hungary.160.desc: "空軍部的一項研究顯示，我軍空中力量在支援陸軍作戰方面裝備嚴重不足。無論是遠程空襲還是近距空中支援，我們都存在關鍵性的能力缺口。政府現已撥付專項經費，用於開展緊急採購項目以獲取一款現代化轟炸機，但我們必須儘快決定應當採購哪一種機型。"
 DOD_hungary.160.a: "近距支援的輕型轟炸機"
 DOD_hungary.160.b: "續航更優的中型轟炸機"
 DOD_hungary.161.t: "輕型轟炸機競標"
 DOD_hungary.161.desc_cas: "空軍部正尋求購入一款新式輕型轟炸機，以加強對地面部隊的近距支援能力。然而，外交部則建議，在決定從哪一個國家採購時，也應將政治與外交層面的因素納入考量之中。"
 DOD_hungary.161.desc_cas_refused: "以國家安全為由，[From.GetAdjective]政府拒絕向我方出售生產許可。我們或許更應嘗試向其他國家尋求合作，或者將現役機型進行緊急升級，以作為權宜之計。"
 DOD_hungary.162.t: "中型轟炸機競標"
 DOD_hungary.162.desc_tac: "空軍部正尋求購入一款新式中型轟炸機，以執行遠程阻絕與戰術空襲等任務。然而，外交部則建議，在決定從哪一個國家採購時，也應將政治與外交層面的因素納入考量之中。"
 DOD_hungary.162.desc_tac_refused: "以國家安全為由，[From.GetAdjective]政府拒絕向我方出售生產許可。我們或許更應嘗試向其他國家尋求合作，或者將現役機型進行緊急升級，以作為權宜之計。"
 DOD_hungary.163.t: "[From.GetAdjective]轟炸機競標"
 DOD_hungary.163.desc: "[From.GetAdjective]空軍目前正在舉行新式輕型轟炸機的試飛評估。根據我方駐外空軍武官的情報，我國的最新機型極有可能拔得頭籌。[From.GetAdjective]政府預計將很快向我們正式提出採購請求。\n\n雖然製造商代表強烈支持這筆出口，但向外國出售我軍最先進的裝備仍存在國家安全方面的隱患。我們是否應當批准這筆軍售？"
 DOD_hungary.164.t: "[From.GetAdjective]轟炸機競標"
 DOD_hungary.164.desc: "[From.GetAdjective]空軍目前正在舉行新式中型轟炸機的試飛評估。根據我方駐外空軍武官的情報，我國的最新機型極有可能拔得頭籌。[From.GetAdjective]政府預計將很快向我們正式提出採購請求。\n\n雖然製造商代表強烈支持這筆出口，但向外國出售我軍最先進的裝備仍存在國家安全方面的隱患。我們是否應當批准這筆軍售？"
 DOD_hungary.165.t: "轟炸機競標完成"
 DOD_hungary.165.desc: "經過與製造商及政府官員的談判，我方已成功取得新型轟炸機的生產許可。該機的一架樣機已運抵國內，用於培訓維修人員；完整的設計圖紙與製造藍圖也預計將很快送達。我們隨時都可以開始投入生產。"
 DOD_hungary.165.a: "真不錯"
 DOD_hungary.170.t: "《特里亞農條約》的終結"
 DOD_hungary.170.desc: "隨著昔日條約的擁護者相繼退場，《特里亞農條約》如今已毫無意義。再也沒有任何人能夠否認我們重整軍備的權利了！"
 DOD_hungary.170.a: "太棒了！"
 SWE_HUN_ALLIANCE: "貝爾納多特王朝"
 DOD_romania.1.t: "羅馬尼亞希望重修盟約"
 DOD_romania.1.desc: "我國與羅馬尼亞的舊日同盟在近年間事實上已告失效，畢竟曾幾何時匈牙利與德國的威脅都還似乎遙不可及。然而，面對近期局勢的突然變化，[ROM.GetLeader]日前到訪華沙，與我方商討續訂羅波同盟的有關事宜。就目前而言，此項協議仍僅限於防禦性條款，雙方承諾，將在戰爭爆發時相互支援。"
 DOD_romania.1.a: "合理的請求"
 DOD_romania.1.b: "我們並不感興趣"
 DOD_romania.2.t: "[From.GetNameDefCap]同意結盟"
 DOD_romania.2.desc: "我方赴華沙的代表團已攜帶由[POL.GetLeader]簽署的援助條約歸國。自此起，若戰爭爆發，雙方均有義務相互防禦。"
 DOD_romania.2.a: "很好"
 DOD_romania.3.t: "[From.GetNameDefCap]拒絕結盟"
 DOD_romania.3.desc: "[From.GetLeader]拒絕在華沙會見我方代表團，僅轉來一則簡短訊息，稱與羅馬尼亞深化關係“目前不符合[From.GetAdjective]政府的利益”。\n\n而我方就此提出的進一步說明請求，則未獲得答覆。"
 DOD_romania.3.a: "真是不幸"
 DOD_romania.10.t: "隔離線聯盟"
 DOD_romania.10.desc: "“隔離線”原本旨在遏制共產主義的擴散，阻止紅軍進入歐洲。如今，[ROM.GetLeader]重新提出了這一構想，目的則是將外交上已成國際棄兒的[GER.GetNameDef]與[SOV.GetNameDef]隔離開來。\n\n羅馬尼亞人目前已開始試探我方，詢問我們是否願意加入一項正式的同盟安排。"
 DOD_romania.10.a: "我們團結一致"
 DOD_romania.10.b: "中立才是最好的防禦"
 DOD_romania.11.t: "[From.GetNameDefCap]同意加入隔離線聯盟"
 DOD_romania.11.desc: "[From.GetLeader]領導的政府已公開宣佈支持“隔離線”構想。[From.GetNameDef]方面的代表團現已抵達，與我方商討加入我方陣營的具體事宜，並就戰爭情況下的軍事支援安排進行籌劃。"
 DOD_romania.11.a: "很好"
 DOD_romania.12.t: "[From.GetNameDefCap]表示拒絕"
 DOD_romania.12.desc: "與[From.GetNameDef]就其加入我方陣營的談判現已徹底破裂。[From.GetNameDef]代表團遞交了一份冗長的條件清單，將一系列廣泛而深遠的軍事援助作為其加入的前提。\n\n總參謀部以“根本不可能履行”為由斷然拒絕。而外交部則認為，此舉乃[From.GetLeader]蓄意為之，旨在拒絕我方提議的同時，又避免承擔責任。"
 DOD_romania.12.a: "太無禮了"
 DOD_romania.20.t: "羅馬尼亞要求獲得保障"
 DOD_romania.20.desc: "數月以來，我方一直試圖與[ROM.GetNameDef]締結同盟——哪怕只是為了不讓其石油落入敵手。然而如今，[ROM.GetLeader]卻宣稱：若要其政府考慮加入我方陣營，則不可或缺的先決條件，在於要正式地向其承諾戰時軍事支援的保證。"
 DOD_romania.20.a: "那就給他們這樣的保證"
 DOD_romania.20.b: "這樣只會令我們的力量更分散"
 DOD_romania.21.t: "[From.GetNameDefCap]為羅馬尼亞疆界提供保障"
 DOD_romania.21.desc: "在羅馬尼亞-[From.GetAdjective]兩國友好協會的一次會議上發表講話時，[From.GetLeader]宣稱，羅馬尼亞國家現行疆域“不容更改且永續存在”，他保證，其政府將在戰爭來臨之時，不遺餘力地捍衛這些疆界。"
 DOD_romania.21.a: "很好"
 DOD_romania.22.t: "[From.GetNameDefCap]拒絕提供保障"
 DOD_romania.22.desc: "我國近期的外交攻勢遭到了[From.GetNameDef]的冷淡拒絕。[From.GetLeader]在議會發言時表示，向羅馬尼亞提供正式保障一事，“將於其真正具有相關性時再作決定”。"
 DOD_romania.22.a: "真是無情"
 DOD_romania.30.t: "羅馬尼亞提供駐軍基地"
 DOD_romania.30.desc: "隨著歐洲局勢愈發緊張，[ROM.GetLeader]日前向我方提出了一項令人意外的提議：若我方承諾在羅馬尼亞遭受任何外部威脅時協同防衛，他們便允許我軍駐紮於羅馬尼亞領土之上。\n\n作為善意的表示，[ROM.GetLeader]亦已放寬了對羅馬尼亞共產黨活動的諸多限制。"
 DOD_romania.30.desc_alt: "隨著歐洲局勢愈發緊張，[ROM.GetLeader]日前向我方提出了一項出人意料的建議：若我方承諾在羅馬尼亞遭受任何外部威脅時協同防衛，他們便允許我軍駐紮在羅馬尼亞領土之上。"
 DOD_romania.30.a: "他們應當得到保障"
 DOD_romania.30.b: "絕不同帝國主義者做交易！"
 DOD_romania.31.t: "[From.GetNameDefCap]接受我方提議"
 DOD_romania.31.desc: "[SOV.GetLeader]已親自指示[SOV.GetSovietArmyAdjectiveBasedOnIdeology]軍隊制訂在戰爭情況下保衛羅馬尼亞的作戰預案。一支小型軍事代表團已抵達當地，為即將部署的駐軍準備基地與機場設施。"
 DOD_romania.31.a: "希望我們將來不會為此後悔"
 DOD_romania.32.t: "[From.GetNameDefCap]拒絕我方提議"
 DOD_romania.32.desc: "有關在羅馬尼亞境內部署[SOV.GetAdjective]部隊的會談，僅進行了數小時便草草收場，[SOV.GetAdjective]方面明確表示，無意為我方邊界提供任何保障。\n\n我軍多名將領立刻揣測起這一表態背後令人不安的深意——或許正是因為並不滿意我國現在的疆界形狀，他們圖謀在未來進行改變。"
 DOD_romania.32.a: "真是令人深感不安"
 DOD_romania.40.t: "羅馬尼亞施壓"
 DOD_romania.40.desc: "日前，我國駐[ROM.GetNameDef]大使被[ROM.GetLeader]緊急召見至辦公室。我國大使尚還未來得及就羅馬尼亞軍隊近期在我國邊境一線的調動提出質詢，就反被對方下達了最後通牒。[ROM.GetLeader]強調，[BUL.GetNameDefCap]今後不得再未經他的明確同意自行其是，所有重大政策決定均須提交他批准。\n\n若拒不從命，他將以武力相向。"
 DOD_romania.40.a: "我們只得屈從於他們的要求"
 DOD_romania.40.b: "士可殺不可辱！"
 DOD_romania.41.t: "[From.GetNameDefCap]表示順從"
 DOD_romania.41.desc: "[BUL.GetNameDefCap]已經接受了我方的各項要求，他們現在將在做出任何政治決策前徵詢我方意見。\n\n一名特別代表已抵達索非亞，與其政府進行協調。"
 DOD_romania.41.a: "很好"
 DOD_romania.42.t: "[From.GetNameDefCap]決意頑抗"
 DOD_romania.42.desc: "在聽完我方提出的一系列要求後，據報[BUL.GetLeader]先是大笑出聲，隨後當場將文件撕得粉碎，揚言羅馬尼亞的軍隊根本不可能在戰場上擊敗保加利亞。"
 DOD_romania.42.a: "這可不值得去流血拼命"
 DOD_romania.42.b: "那就讓我們看看他說對沒有"
 DOD_romania.50.t: "羅馬尼亞要求我國改組政府"
 DOD_romania.50.desc: "當[ROM.GetLeader]此前公開要求，凡屬[HUN.GetAdjective]政府的任何任命，只要“涉及羅馬尼亞利益”，就必須賦予其一票否決權時，我國外交系統的大多數人士都認為，這不過是其面向本國內部的宣傳言論而已。\n\n然而不久之後，我們卻意外地收到了措辭完全相同的官方照會。\n\n若我方拒絕遵從，將面臨其武力相向的威脅——這一點已令總參謀部陷入恐慌，而軍方高層也對我軍能否在邊境線上頂住羅馬尼亞人的進攻表示了嚴重懷疑。"
 DOD_romania.50.a: "我們別無選擇"
 DOD_romania.50.b: "我們可以做出一定讓步"
 DOD_romania.50.c: "寧為自由死，不為奴隸生"
 DOD_romania.51.t: "[From.GetNameDefCap]同意城下之盟"
 DOD_romania.51.desc: "在認識到武力抵抗既不可能也無意義之後，匈牙利政府現已決定採納我方的建議，並將自身置於我方的處置之下。[HUN.GetLeader]承諾，今後在任何重大政策決策前都將徵詢我方的意見。"
 DOD_romania.51.a: "很好"
 DOD_romania.52.t: "[From.GetNameDefCap]提議締結友好條約"
 DOD_romania.52.desc: "就我方近期提出的對匈牙利政府進行若干調整的要求，[HUN.GetLeader]現已提出一份友好互助條約作為回應。根據該條約，匈牙利將在戰時向我方提供援助，但其中亦有條款，要求我方發誓不得干涉匈牙利的國內政治。"
 DOD_romania.52.a: "可以接受的妥協"
 DOD_romania.52.b: "這可不符合我們的心意"
 DOD_romania.53.t: "[From.GetNameDefCap]決意頑抗"
 DOD_romania.53.desc: "儘管其武裝力量顯然處於絕對劣勢，[HUN.GetLeader]仍拒絕聽從理性勸告，下令軍隊在我方邊境一線進入防禦部署。雖然原因不明，但看來他們軍隊中的相當一部分竟確實執行了這一命令。\n\n看樣子，他們是準備打一仗了。"
 DOD_romania.53.a: "這倒也不值得去耗時費力"
 DOD_romania.53.b: "勝利毋庸置疑，開戰！"
 DOD_romania.60.t: "羅馬尼亞勒令我國徹底重組"
 DOD_romania.60.desc: "隨著羅馬尼亞軍隊在我方邊境嚴陣以待，關於其真正意圖的各種傳言不脛而走。當我國駐布加勒斯特大使就此向對方詢問時，卻被直截了當地告知：[ROM.GetLeader]已經認定，統一的南斯拉夫國家不再符合他的利益。取而代之的，他要將我國肢解，重組為若干在羅馬尼亞直接控制下的附庸邦國。\n\n來自其官方的最後通牒，預計將在一小時內送達。"
 DOD_romania.60.a: "我們可不能指望忤逆他們"
 DOD_romania.60.b: "想都別想！"
 DOD_romania.61.t: "[From.GetNameDefCap]退讓屈服"
 DOD_romania.61.desc: "就在遞交給貝爾格萊德方面的最後通牒即將到期的數分鐘前，一份官方公報送達，宣稱南斯拉夫政府現在宣告解散，其權力移交給若干地方政權，而這些政權全都已經對我方宣誓效忠。"
 DOD_romania.61.a: "很好"
 DOD_romania.62.t: "[From.GetNameDefCap]決意頑抗"
 DOD_romania.62.desc: "[YUG.GetAdjective]政府任由最後通牒失效而未作任何回覆。偵察機已發現南斯拉夫一側出現部隊調動，這促使總參謀部重新審視入侵方案。數位高級軍事顧問已經明確表示，他們無法保證對南斯拉夫的戰爭能夠迅速取得勝利。"
 DOD_romania.62.a: "我們將擊潰他們"
 DOD_romania.62.b: "讓我們尋求外援"
 DOD_romania.63.t: "[From.GetLeader]圖謀瓜分南斯拉夫"
 DOD_romania.63.desc: "羅馬尼亞與南斯拉夫之間已爆發一場危機，而這或許為我方提供了一個可乘之機。目前，[YUG.GetLeader]已經拒絕了[ROM.GetLeader]勒令其交出國家主權的全部要求。作為回應，[ROM.GetLeader]轉而向我方提出了一項瓜分南斯拉夫的協議，他允諾斯洛文尼亞將歸我方所有，同時成立一個在我方控制下的克羅地亞獨立國。"
 DOD_romania.63.a: "誘人的計劃"
 DOD_romania.63.b: "我們何需他們的幫助？"
 DOD_romania.64.desc: "羅馬尼亞與南斯拉夫之間已爆發一場危機，而這或許為我方提供了一個可乘之機。目前，[YUG.GetLeader]已經拒絕了[ROM.GetLeader]勒令其交出國家主權的全部要求。作為回應，[ROM.GetLeader]轉而向我方提出了一項瓜分南斯拉夫的協議，他允諾達爾馬提亞將歸我方所有，同時在黑山成立一個由我方控制的傀儡政權。"
 DOD_romania.65.t: "[From.GetNameDefCap]接受提議"
 DOD_romania.65.desc: "[From.GetLeader]已經簽署並接受了此前的條款，現在[From.GetAdjective]政府將會支援我們在南斯拉夫的一切行動。"
 DOD_romania.65.a: "太棒了"
 DOD_romania.66.t: "[From.GetNameDefCap]拒絕提議"
 DOD_romania.66.desc: "儘管[From.GetNameDef]政府並未明確警告我方不要干涉南斯拉夫，但他們還是拒絕為我方的提案背書。\n\n或許，他們是在坐等我方鎩羽而歸，好在我們被踢出局後，再由其自己鯨吞整個南斯拉夫。"
 DOD_romania.66.a: "那我們要抱歉會讓他們期望落空"
 DOD_romania.67.t: "對南斯拉夫的最後通牒"
 DOD_romania.67.desc: "既然我們已爭取到了更多的外部支持，那麼是時候正告南斯拉夫方面，局勢已經發生了翻天覆地的變化。他們的軍隊正被拉得過長，在漫長的邊界線上捉襟見肘，其如今的軍事處境比以往任何時候都更加絕望。"
 DOD_romania.67.a: "勝利唾手可得"
 DOD_romania.68.t: "外交行動失敗"
 DOD_romania.68.desc: "我們試圖爭取德國與意大利支持的努力並未取得成功。這段外交空窗期無疑給予了南斯拉夫苟延殘喘的寶貴時間，並勢必影響即將到來的戰役進程。儘管如此，總參謀部仍保持謹慎樂觀的判斷，認為我們依舊能夠在短時間內取得勝利。"
 DOD_romania.68.a: "拿起武器！"
 DOD_romania.69.t: "大包圍網"
 DOD_romania.69.desc_GER: "第二份最後通牒已經送達。這一次，羅方的要求還附帶了來自[GER.GetNameDef]大使的同等照會，對方明確表示支持羅馬尼亞的計劃，並勒令我軍不得干涉德軍對斯洛文尼亞與克羅地亞的佔領行動。"
 DOD_romania.69.desc_ITA: "第二份最後通牒已經送達。這一次，羅方的要求還附帶了來自[ITA.GetNameDef]大使的同等照會，對方明確表示支持羅馬尼亞的計劃，並勒令我軍不得干涉意軍對達爾馬提亞與黑山的佔領行動。"
 DOD_romania.69.desc_GERITA: "第二份最後通牒已經送達。這一次，羅方的要求還附帶了來自[GER.GetNameDef]與[ITA.GetNameDef]兩國大使的同等照會，對方明確表示支持羅馬尼亞的計劃，並勒令我軍不得干涉其各自的佔領行動，以免造成不必要的流血。"
 DOD_romania.69.a: "放棄抵抗"
 DOD_romania.69.b: "我們將奮戰至最後一刻！"
 DOD_romania.70.t: "南斯拉夫國崩解體"
 DOD_romania.70.desc: "南斯拉夫政府現已接受其戰敗的命運。各盟國的部隊已經接管該國，並進駐了各自劃定的佔領區。"
 DOD_romania.70.a: "又一次外交上的勝利"
 DOD_romania.71.t: "南斯拉夫決意頑抗"
 DOD_romania.71.desc: "南斯拉夫軍隊現已在我方邊境沿線佔據陣地，南斯拉夫空軍也已進入其戰備位置，顯然一副隨時準備迎戰的姿態。\n\n然而，據南斯拉夫戰爭部的一名消息人士稱，這不過是一次示威式的強硬表態，[YUG.GetLeader]堅信我們只是在虛張聲勢，並斷定不會真的爆發戰爭。"
 DOD_romania.71.a: "我們可絕沒有虛張聲勢"
 DOD_romania.81.t: "國王情婦購置豪宅"
 DOD_romania.81.desc: "根據報道，國王卡羅爾二世的情婦瑪格達·盧佩斯庫近日在布加勒斯特一處地段昂貴的高檔郊區，購置了一棟全新的別墅。她究竟如何負擔得起這一開銷，長期以來一直是坊間熱議的主題。外國媒體的新披露則強烈暗示，國王陛下親自批准使用政府公款完成了這樁“私人投資”。\n\n醜聞正迅速發酵，我們必須儘快就此作出公開回應。"
 DOD_romania.81.a: "是政府購置此房產並許可盧佩斯庫女士居住的"
 DOD_romania.81.b: "是國王陛下從其私人津貼中支取該款項的"
 DOD_romania.82.t: "國王查封批評書籍"
 DOD_romania.82.desc: "一位知名社會學者的新書近日出版，書中詳述了國王核心圈子對政策制定的深度影響，而多數決策最終都會“恰巧”讓相關成員獲利。更為引人注目的是書中對國王情婦的篇幅，據說這位女士多次利用自身的人脈紐帶為自己牟利。對此，國王陛下已下令逮捕作者。\n\n自由派報紙與極右翼陣營都對此震怒——儘管雙方憤怒的理由完全不同。在局勢失控之前，我們必須儘快發表正式聲明。"
 DOD_romania.82.a: "誹謗畢竟是刑事犯罪"
 DOD_romania.82.b: "本書作者將被立即釋放"
 DOD_romania.83.t: "國王舉辦奢華宴會"
 DOD_romania.83.desc: "儘管新聞稿在發表前已由國王陛下親自把關，皇家宮殿近日舉辦的奢華宴會仍在全國範圍內引起了巨大民怨。報紙上刊登的，是國王情婦身著昂貴法式晚禮服的照片，以及用黃金餐盤呈上的七道菜全套盛宴的細緻描寫——而與此同時，全國民眾仍在大蕭條餘波中艱難度日。\n\n在輿論愈演愈烈之際，國王強烈要求我們立即發表公開支持聲明。"
 DOD_romania.83.a: "這是陛下作為國家象徵的應有體面"
 DOD_romania.83.b: "陛下的私事並非政府事務範疇"
 DOD_romania.84.t: "國王情婦現身巴黎"
 DOD_romania.84.desc: "法國媒體近日大篇幅報道了瑪格達·盧佩斯庫在巴黎的“英勇事蹟”——據稱她正在進行一場規模驚人的購物狂歡。\n\n雖說這種行徑本身並不算稀奇，但據報道稱，她動用了羅馬尼亞大使館人員協助搬運大批戰利品，甚至直接告知商家將賬單寄給羅馬尼亞政府。這些報導已被本國媒體迅速轉載。我們已被要求就此事作出回應。"
 DOD_romania.84.a: "盧佩斯庫女士系受陛下旨意行事"
 DOD_romania.84.b: "政府對公民的個人行為不予置評"
 DOD_romania.85.t: "國王赴尼斯度假"
 DOD_romania.85.desc: "在情婦與其核心親信的陪同下，國王卡羅爾二世日前抵達尼斯度假。在下榻於內格雷斯科酒店的皇家貴賓廳後，國王對當地記者表示，未來數週他將盡情享受當地最頂級的美食與款待，並計劃前往尼斯歌劇院觀賞演出，閒暇時還將順道赴巴黎進行購物小憩。\n\n然而，當地媒體已開始對本次出行的時機，以及這趟行程的經費來源提出尖銳質疑。"
 DOD_romania.85.a: "這是正式的國事訪問"
 DOD_romania.85.b: "國王陛下每年都會去尼斯度假"
 DOD_romania.86.t: "國王牽涉貪腐醜聞"
 DOD_romania.86.desc: "隨著軍隊採購體系中出現腐敗傳聞，國王已承諾對此展開一項公正調查。然而，一份初步報告卻在不久前遭媒體洩露，內容不僅證實了相關傳聞，甚至將矛頭直接指向國王最為倚重的顧問集團。\n\n整起事件已令政府顏面盡失。國王要求我們立即採取行動，但同時也公開表達對涉事的顧問“全力支持”。"
 DOD_romania.86.a: "合同白紙黑字鐵證如山"
 DOD_romania.86.b: "改革採購流程"
 DOD_romania.110.t: "羅馬尼亞提議瓜分[CZE.GetNameDef]"
 DOD_romania.110.desc: "[ROM.GetLeader]已就[CZE.GetNameDef]問題向我方提出一項建議。他指出，鑑於我們在該地區擁有共同利益，因此可以將該國進行三方分割：由我國獲得西部地區，羅馬尼亞控制斯洛伐克，而匈牙利則在南部邊境獲得一小塊狹長的領土。"
 DOD_romania.110.a: "我們必須抓住機會"
 DOD_romania.110.b: "既然我們自己就能拿到手，何必要談判呢？"
 DOD_romania.111.t: "[GER.GetLeader]接受提議"
 DOD_romania.111.desc: "德國政府已經同意了我方條約的草案以及擬議的疆界劃分，剩下要做的，就是向布拉格方面下達最後通牒。"
 DOD_romania.111.a: "那就讓我們下達最後通牒"
 DOD_romania.113.t: "[GER.GetLeader]拒絕提議"
 DOD_romania.113.desc: "在與[GER.GetLeader]的激烈會晤中，我國大使遭到嚴厲警告，德國方面斷然拒絕就任何涉及[CZE.GetNameDef]的問題進行討論或談判。德國政府認為該國完全處於其勢力範圍之內，並警告稱，我方的任何介入都將被視為對[GER.GetLeader]明確意願的忤逆。"
 DOD_romania.113.a: "是時候重新考量策略了"
 DOD_romania.113.b: "那我們就自行出擊"
 DOD_romania.114.t: "德國下達最後通牒"
 DOD_romania.114.desc: "隨著德軍在我國邊境集結，德國與羅馬尼亞的大使已聯合遞交最後通牒：除非我方同意將斯洛伐克交予匈牙利與羅馬尼亞，併成為德國的“保護國”，否則德意志空軍將隨時準備“抹除”布拉格，而匈牙利軍隊也已整裝待發，準備自南方入侵我國。"
 DOD_romania.114.a: "我們別無選擇"
 DOD_romania.114.b: "我們寧可赴死亦不受辱"
 DOD_romania.115.t: "[CZE.GetLeader]決意頑抗"
 DOD_romania.115.desc: "[CZE.GetAdjective]政府已無視我方的最後通牒並下令軍隊動員。[CZE.GetLeader]宣稱，任何入侵者都將面對他們“誓死捍衛祖國、戰至最後一人”的軍隊。"
 DOD_romania.115.a: "我們將會考慮我們的選擇。"
 DOD_romania.120.t: "外國汽車公司招商案"
 DOD_romania.120.desc: "多家外國汽車公司都已經表示了在羅馬尼亞開設工廠生產投入商業市場和軍事用途的新型載具的興趣。我們選中的一方將會被視為今後的主要交易對象，這也將決定我們未來所能取得的生產許可。\n\n我們應該與哪方接洽？"
 DOD_romania.120.a: "基於高速載具選擇沃克斯豪爾"
 DOD_romania.120.b: "基於可靠德國工藝選擇歐寶"
 DOD_romania.120.c: "基於大批量生產選擇福特"
 DOD_yugoslavia.1.t: "軍方發動政變"
 DOD_yugoslavia.1.desc: "由於我們決定與德國簽署協議，一部分空軍軍官發動了一場政變。其下軍隊控制了貝爾格萊德的要地。宣稱彼得國王已到執政之年並結束[YUG.GetLeader]的攝政。\n\n人民大眾對於政變者基本處於支持中，而群眾則高呼“寧願開戰反條約，寧可入土不做奴！”\n\n現今政府正需抉擇，我們可以支持政變者——儘管這意味著與德國開戰。亦或是打壓叛亂——而我國將陷入四分五裂的血腥內戰。"
 DOD_yugoslavia.1.a: "我們早該聽從軍官們的意見"
 DOD_yugoslavia.1.a.tt: "§Y彼得二世§!成為§Y[YUG.GetIdeologyNameWithCaps]§!政黨的領導人。\n"
 DOD_yugoslavia.1.b: "我們要堅持此前的決定！"
 DOD_yugoslavia.2.t: "[YUG.GetNameDef]發生政變"
 DOD_yugoslavia.2.desc: "在保羅親王簽署條約加入三國同盟後，一群[YUG.GetAdjective]空軍軍官立即發動了一場精密策劃的政變以替換掉現有合法政府並讓彼得二世登上王位。\n\n前南斯拉夫政府已然全面讓步，其新領導人宣稱保羅親王所簽署之條約既不合法也無效力。"
 DOD_yugoslavia.2.a: "立即執行第25號元首令"
 DOD_yugoslavia.3.desc: "在保羅親王簽署條約加入三國同盟後，一群[YUG.GetAdjective]空軍軍官立即發動了一場精密策劃的政變以替換掉現有合法政府並讓彼得二世登上王位。\n\n前政府成員譴責該政變的行為並宣佈全國進入緊急戒嚴狀態。顯而易見，這是外國間諜乾的好事；他們稱我國責任為其提供防護。"
 DOD_yugoslavia.3.a: "他們這回可是鑄下大錯了"
 DOD_yugoslavia.3.b: "我們將出手援救他們"
 DOD_yugoslavia.10.t: "第五縱隊"
 DOD_yugoslavia.10.desc: "在向德國宣戰的消息傳遍我國之後，顯然國內許多人根本沒有拿起武器抵抗入侵者的意願。主由克羅地亞人組成的軍事單位拒絕執行前往國境的命令，甚至還有些向正在執行命令的其他單位開火的事例。\n\n很明顯，克羅地亞人是靠不住的，至少與德國交壤地區的防衛無法穩定了。"
 DOD_yugoslavia.10.a: "這幫叛徒！"
 DOD_yugoslavia.10.b: "事實上他們的想法有點道理……"
 warning_we_will_change_to_this_country_tt: "§R將切換至[CRO.GetNameDef]§!"
 YUG_CRO_independence_war_troops_tt: "1個§Y[CRO.GetAdjective]騎兵師§!以及5個§Y[CRO.GetAdjective]步兵師§!將會加入起義"
 DOD_yugoslavia.20.t: "[YUG.GetName]請求訂購飛機"
 DOD_yugoslavia.20.desc: "意識到戰略層級上的弱點，[YUG.GetAdjective]空軍已發起一系列迅速的空軍現代化及拓展項目。數目可觀的預算已為這些支出做好了準備。一個使團正巡迴歐洲，尋求著戰鬥機及中型轟炸機的新提供商。\n\n基於該問題急切需要解決，[YUG.GetAdjective]使團堅持從生產商手中直接運輸或交付購入的飛機。"
 DOD_yugoslavia.20.a: "批准出售我國庫存戰鬥機"
 DOD_yugoslavia.20.b: "批准出售我國庫存轟炸機"
 DOD_yugoslavia.20.d: "調撥戰鬥機生產線完成其訂單"
 DOD_yugoslavia.20.e: "調撥轟炸機生產線完成其訂單"
 DOD_yugoslavia.20.c: "我們這裡沒貨可以提供"
 DOD_yugoslavia.21.t: "[From.GetNameDefCap]批准出售戰鬥機"
 DOD_yugoslavia.21.desc: "我國在[From.GetNameDef]的交易使團已為我國空軍確保了一定數量的戰鬥機。首批飛機已然送達，而我國飛行員正開展機種轉換訓練。"
 DOD_yugoslavia.21.a: "太好了"
 DOD_yugoslavia.22.t: "[From.GetNameDefCap]批准出售轟炸機"
 DOD_yugoslavia.22.desc: "我國在[From.GetNameDef]的交易使團已為我國空軍確保了一定數量的中型轟炸機。首批飛機已然送達，而我國飛行員正開展機種轉換訓練。"
 DOD_yugoslavia.30.t: "[YUG.GetNameDef]問題"
 DOD_yugoslavia.30.desc: "\n在奧地利迴歸帝國後，我們現今與[YUG.GetNameDef]邊境接壤。而[YUG.GetLeader]所領導的該國政府在關於我國所提出的歐洲重整計劃和該國立場上出奇地安靜。也許我們該提醒他們一下需要作出抉擇的時刻總會來的。"
 DOD_yugoslavia.30.a: "對此向他們施壓"
 DOD_yugoslavia.30.b: "他們的想法並不重要"
 DOD_yugoslavia.31.t: "德國施壓"
 DOD_yugoslavia.31.desc: "幾天前，德國大使在一場招待會上攔住了[YUG.GetLeader]。他指出在德奧合併之後，[YUG.GetNameDef]和[GER.GetNameDef]現已接壤。德國大使向[YUG.GetLeader]表示，德國在發展友好關係方面很有興趣。\n\n他僅要求我們在對未來政策的權衡上留點心。"
 DOD_yugoslavia.31.a: "他可真是個好人"
 DOD_yugoslavia.31.b: "我們必須繼續與他們保持親善……"
 YUG_wavering_to_GER_pressure_opm: "屈服於我國的施壓"
 YUG_wavering_to_GER_pressure_reverse_opm: "屈服於德國的施壓"
 YUG_GER_pressured_us_annoyed_opm: "為外交施壓所惱怒"
 DOD_yugoslavia.32.desc: "在[CZE.GetNameDef]退出歷史舞臺後，歐洲東南部的政治局勢發生了重大變動。以往接受捷克的武裝和資金支援的國家現在需要新的贊助商。也許是時候提醒一下[YUG.GetLeader]這件事了。"
 DOD_yugoslavia.32.a: "對此向他施壓"
 DOD_yugoslavia.32.b: "我們自有其他打算"
 DOD_yugoslavia.33.desc: "僅在德軍士兵進入布拉格的幾個小時後，在[CZE.GetAdjective]大使仍在進行道別時，[GER.GetNameDef]大使致電了外務處。\n\n據她所說，德國政府對不得不這樣處理[CZE.GetNameDef]表示很後悔，而[GER.GetLeader]很高興看到[YUG.GetLeader]未採取會讓他考慮以同樣方式應對南斯拉夫的行為。\n\n德國大使表示他希望未來也會是這樣並結束了通話。"
 DOD_yugoslavia.33.a: "他可真是個好人"
 DOD_yugoslavia.33.b: "事態惡化，立即鎮壓反德分子！"
 DOD_yugoslavia.34.desc: "我國現今在歐洲處於至高的地位。長久以來，法國一直是歐洲東南部局勢穩定的根基，但現今該地之境皆唾手可得。我們可以將周邊全部國家拉入陣營而後便無人能夠阻擋我國大勢。\n\n是時候讓南斯拉夫人做出選擇了。要麼與我們站在一邊——要麼準備受死吧。"
 DOD_yugoslavia.34.a: "我們的耐心已快耗盡"
 DOD_yugoslavia.34.b: "我大德意志猛虎怎會在意區區鼠輩之見"
 DOD_yugoslavia.35.desc: "近日在伯格霍夫的一次會議中，[GER.GetLeader]和[YUG.GetLeader]談及了現今歐洲局勢以及我國在其中的處境。[GER.GetLeader]表明南斯拉夫不可能在逐漸逼近的生死抉擇中不選好要站的隊伍。而德國則無法容忍一個非其盟國的鄰居。\n\n他表示如果南斯拉夫選擇和同盟國在一邊倒也不差，至少大家都知道自己站在哪邊了。"
 DOD_yugoslavia.35.a: "時間緊迫。"
 DOD_yugoslavia.35.b: "不，我們絕不能再放縱他們！"
 enemy_of_the_reich_opm: "帝國的敵人"
 YUG_wavering_to_GER_pressure_2_opm: "屈服於我國的施壓"
 YUG_wavering_to_GER_pressure_reverse_2_opm: "屈服於德國的施壓"
 DOD_yugoslavia.36.t: "南斯拉夫的命運"
 DOD_yugoslavia.36.desc: "在對其陣營選擇的屢次施壓後，[YUG.GetLeader]領導下的南斯拉夫政府仍覺得他們能不參與這場衝突而靠邊站。現在他們要面對自己優柔寡斷而懦弱所導致的後果了。"
 DOD_yugoslavia.36.a: "他們若不順從，便是我等之敵！"
 DOD_yugoslavia.36.b: "他們一直，也永遠會是無關緊要的。"
 DOD_yugoslavia.40.desc: "南斯拉夫是我們新巴爾幹戰略的關鍵。到目前為止，他們還沒有明確表態，並與德國進行貿易，但距離加入軸心國還有很長一段距離。我們應該提醒他們，一旦戰爭爆發，我們決不能容忍與敵人進行貿易。"
 DOD_yugoslavia.40.a: "給他們提個醒"
 DOD_yugoslavia.40.b: "我們可不能干涉他國內政"
 DOD_yugoslavia.41.t: "英國施壓"
 DOD_yugoslavia.41.desc: "[ENG.GetLeader]近期宣佈了一項在巴爾幹地區的外交進程。其項目的一部分即為他本人在倫敦與我國大使進行私人訪談。會面途中，他詢問了我國對德政策的立場。他指出，[GER.GetNameDefCap]購入了數量可觀的非資源類出口品。他表示，如果我們減少對德國的依賴也能過得很好。"
 DOD_yugoslavia.41.a: "對此我們會考慮的"
 DOD_yugoslavia.42.desc: "慕尼黑協定代表著我們這一代人的和平——也許不是。德國並非唯一一個試圖重新規劃歐洲各國邊境的國家。令人驚訝的是，[YUG.GetLeader]領導下的政府對其前主要裝備供應商的命運毫無反響。\n\n這使得不少外務人員質疑南斯拉夫人究竟知不知道將來會發生什麼，且他們很有可能就這麼接受一切。\n\n我們應該考慮提醒一下他們假設戰爭爆發，任何與德國的協定將會被視為敵對行為。"
 DOD_yugoslavia.42.a: "對此派出特別代表"
 DOD_yugoslavia.42.b: "他們顯然還沒緩過勁來"
 DOD_yugoslavia.43.desc: "一位從英國來的特別代表已抵達我國來查明我國對慕尼黑協定的看法。看來由於伴隨著當時談判而來的戰爭威脅，[ENG.GetLeader]希望我們做出更實際的聲明以表支持其立場。他指出，[CZE.GetNameDef]的命運與我國未來緊緊相連。如果[CZE.GetNameDef]落入日耳曼人手中，我們在大陸上的局勢將更為孤立。"
 DOD_yugoslavia.43.a: "他們不過是又在招攬新的馬前卒"
 DOD_yugoslavia.44.desc: "儘管戰火已然熊熊燃燒了數月，[YUG.GetLeader]仍不願明確表達己方立場，甚至在嚴謹中立政策的掩護下繼續和德國交易。儘管他們對德國的支援還並不是很關鍵，我們必須決定要不要允許他們繼續支持一個證與我國處於戰爭中的國家。"
 DOD_yugoslavia.44.a: "他們必須做出選擇"
 DOD_yugoslavia.44.b: "他們維持中立於我們更有利"
 DOD_yugoslavia.45.desc: "英國大使今天訪問了外務部並要求澄清我國是否還在和德國交易。他聲稱英國政府視其為敵對行為，如果我們不立刻中止，則會考慮進行“妥善處理”。"
 DOD_yugoslavia.45.a: "我們必須做出選擇"
 YUG_if_we_dont_side_with_britain_within_a_year_warning_tt: "§R如果我們在接下來的1年中不加入[ENG.GetAdjective]的陣營，則他們有可能將我方視為敵人。§!"
 DOD_yugoslavia.46.desc: "看來我們對南斯拉夫的施壓沒達到預期效果。比起中止與德國的交易或宣稱對同盟國事業的支持，[YUG.GetLeader]領導下的政府仍保持其中立並拒絕讓步。而後，軍情六處收到報告稱南斯拉夫政府正考慮向德國發布軍事通行權。"
 DOD_yugoslavia.46.a: "他們可能已經算是敵人了"
 DOD_yugoslavia.46.b: "我們現在不應樹敵過多"
 DOD_yugoslavia.181.t: "共產主義思潮流行[This.GetNameDef]"
 DOD_yugoslavia.181.d: "隨著泛斯拉夫工人大會的成立，看起來似乎許多[This.GetAdjective]的工人階級開始支持按照[From.GetNameDef]模式構建的[This.GetNameDef]作為共產主義國家加入到該陣營中的想法。儘管現在還尚在萌芽階段，但許多[This.GetAdjective]官員擔心如果對此想法不加以阻止，[This.GetNameDef]很可能將會面臨一場全國性的罷工，甚至是左翼武裝組織的抬頭。"
 DOD_yugoslavia.182.t: "泛斯拉夫主義宣傳"
 DOD_yugoslavia.182.d: "縱觀我們的國家，泛斯拉夫工人大會的支持者們已經開始用宣傳海報裝點[This.Capital.GetName]的街道，同時宣揚著[From.GetAdjective]模式的社會主義。他們為[From.GetLeader]和他的政權歡呼，並堅信[This.GetAdjective]政府也將從社會改革中取得他們類似於[From.GetNameDef]的收益。儘管許多人懷疑這將是[From.GetLeader]破壞[This.GetAdjective]獨立性的危險嘗試。但不可否認的是，上述宣傳對一般人的態度產生了相當大的影響。[This.GetAdjective]公民對共產主義和巴爾幹聯盟的前景充滿了期望。"
 DOD_yugoslavia.183.t: "泛巴爾幹民兵武裝"
 DOD_yugoslavia.183.d: "隨著共產主義狂熱繼續在我們的國家內部肆虐，許多小型武裝團體開始構成了我國的極左勢力，南斯拉夫被懷疑是其武器的來源。大量小道消息認為[From.GetLeader]和他的政權正計劃顛覆[This.GetAdjective]政府以重塑一個更樂於與他的新[From.GetRulingIdeology]國家交好的盟友。"
 DOD_yugoslavia.183.a: "我們最好小心行事"
 DOD_yugoslavia.184.t: "共產主義武裝要求政權更迭"
 DOD_yugoslavia.184.d: "在遍及全國的左翼激進分子得到了確信來自於[From.GetNameDef]的武器進而全副武裝後，[This.GetAdjective]政府與本國農民階級的緊張態勢已然是劍拔弩張。農民們現在要求[This.GetLeader]交出他的權力並將其奉還到他宣稱所代表的人民手中。他們的要求中隱含著警告：若對他們的要求置若罔聞，農民階級將以[From.GetRulingIdeology]新政府之名揭竿而起。"
 DOD_yugoslavia.184.a: "如果這是人民所希望的……"
 DOD_yugoslavia.184.b: "消滅這幫可惡的刁民！"
 DOD_yugoslavia.50.t: "格羅夫納盛宴"
 DOD_yugoslavia.50.desc: "[YUG.GetName]的婚姻和繼承問題一直是政界津津樂道的話題。很長一段時間內，由於我們沒有一位具備正統性的國王君臨王座，以至於一些人質疑卡拉喬傑維奇家族統治的正統性。然而，在最近倫敦的一次聚會上，年輕的彼得國王對一位美麗的貴婦人一見傾心。為確保國王的浪漫姻緣，王室內閣成員已經在討論婚禮計劃。毫無疑問，他與誰結婚都將對我國產生持久的外交影響，並可能影響其他國家與南斯拉夫結盟的意願。"
 DOD_yugoslavia.50.a: "希臘的亞歷山德拉公主得國王傾心"
 DOD_yugoslavia.50.b: "意大利的瑪利亞·弗朗切斯卡公主"
 DOD_yugoslavia.50.c: "德國的亞歷山德琳公主"
 DOD_yugoslavia.50.d: "阿黛爾海德·馮·哈布斯堡女大公"
 DOD_yugoslavia.50.e: "西班牙的瑪麗·弗朗索瓦絲公主"
 DOD_yugoslavia.501.t: "[From.GetNameDefCap]尋覓王后"
 DOD_yugoslavia.501.desc: "[From.GetNameDef]的卡拉喬傑維奇王朝試圖通過皇室聯姻來延續他們的皇家血脈以及國統。看起來[From.GetLeader]似乎對[Root.GetPrincessName]——一位[Root.GetFamilyName]家族的王室成員相當迷戀，並已向她求婚。如果這位年輕的女士選擇接受，那麼[From.GetNameDef]和[Root.GetNameDef]便會在血脈上緊密相連。儘管[From.GetAdjective]—[Root.GetAdjective]兩家的聯姻不會很快有所結果，但這仍將推進此事在不遠的將來成為現實。"
 DOD_yugoslavia.501.a: "良緣婚典實屬美事！"
 DOD_yugoslavia.501.b: "[Root.GetPrincessName]絕不會屈嫁給[From.GetLeader]！"
 italian_princess_name: "瑪利亞公主"
 german_princess_name: "亞歷山德琳公主"
 hungarian_princess_name: "阿黛爾海德女大公"
 spanish_princess_name: "瑪麗·弗朗索瓦絲公主"
 italian_dynasty_name: "薩伏依"
 german_dynasty_name: "霍亨索倫"
 hungarian_dynasty_name: "哈布斯堡"
 spanish_dynasty_name: "波旁"
 DOD_yugoslavia.19.t: "彼得國王陛下成年！"
 DOD_yugoslavia.19.desc: "在全球衝突的惡劣環境下早早地登上了王位，[Root.GetLeader]國王如今終於長大成人並證明了自己是一位睿智的明君。有這樣一位正值壯年的正統繼承人君臨王座，[YUG.GetNameDef]人民終於獲得了一位可以團結在其周圍的國家象徵併為之奮鬥。"
 DOD_yugoslavia.19.a: "吾王萬歲！"
 DOD_yugoslavia.502.t: "[From.GetPrincessName]應允婚事！"
 DOD_yugoslavia.502.desc: "在[Root.GetLondonBelgrade]舉辦的婚禮上，面向歡呼的人群，年輕的國王[Root.GetLeader]通過神聖的契約誓言公開向[From.GetPrincessName]表達了他的愛意與忠貞，在場的人見證了危機時代下走到一起的兩位戀人童話般的浪漫故事。儘管這場[Root.GetWeddingGoodBad]婚禮並沒有締結任何正式的[yugoslavia_wedding_partner.GetAdjective]—[Root.GetAdjective]王朝盟約，但似乎可以肯定的是這兩個國家間的合作不會就此止步。"
 DOD_yugoslavia.502.a: "多麼浪漫！"
 YUG_wedding_bad: "然而在[Root.GetNameDef]國內，年輕的君王仍因在此國家危急存亡之秋私定終身，遭到了[Root.GetAdjective]保守派刊物的諸多非議。"
 YUG_wedding_good: "從貝爾格萊德到布加勒斯特，全體巴爾幹人，都為[Root.GetAdjective]君主在面對迫近毀滅時的剛毅果決而齊聲歡慶。"
 DOD_yugoslavia.503.t: "[From.GetPrincessName]回絕婚事！"
 DOD_yugoslavia.503.desc: "儘管[Root.GetLeader]國王一再表白他的一片真情，但作為他夢中情人的那位外國公主對他的痴情無動於衷。經過了幾週熱烈的追求與交往，[From.GetPrincessName]已經拒絕了國王的求婚，她的決定得到了[From.GetAdjective]政府的公開支持。儘管國王顯然為他的感情遭到蔑視而感到心碎，但他堅信總有一天他將為他的王國找到一位合適的王后。"
 DOD_yugoslavia.503.a: "或可考慮好心的亞歷山德拉公主……"
 DOD_yugoslavia.60.t: "加冕典禮"
 DOD_yugoslavia.60.peter: "在現代南斯拉夫國家宗教多元的背景下，自二十世紀伊始以來，[YUG.GetNameDef]第一次見證了以頗為世俗的方式在貝爾格萊德的大教堂舉辦的加冕儀式。儘管有人會質疑年輕的彼得國王是否能堪統治重任，但現在他已加冕為王，無論好壞，南斯拉夫的未來都已掌握在[YUG.GetLeader.GetHerHis]的手中。"
 DOD_yugoslavia.60.paul: "自二十世紀伊始以來，[YUG.GetNameDef]第一次見證了在貝爾格萊德的大教堂裡以塞爾維亞正教的傳統方式舉行的加冕儀式。儘管相比於一位稱職的君主，很多人仍舊視保羅國王為一個篡位者甚至是法西斯獨裁者，但現在他已加冕為王，無論好壞，南斯拉夫的未來都已掌握在[YUG.GetLeader.GetHerHis]的手中。"
 DOD_yugoslavia.60.a: "吾王萬歲！"
 DOD_yugoslavia.70.t: "[FROM.GetNameDefCap]尋求籤訂《三國同盟條約》"
 DOD_yugoslavia.70.desc: "今日一份來自[From.GetLeader]送抵[Root.Capital.GetName]的電報表達了與當今世界法西斯強權簽訂互不侵犯條約的興趣。出於對[SOV.GetAdjective]侵略以及[From.GetLeader.GetHerHis]國內日益增長的民族主義的憂慮，[From.GetLeader]尋求以[Root.GetNameDef]與[From.GetLeader.GetHerselfHimself]結盟。儘管這並不意味著一份正式的盟約，但它確實將[From.GetNameDef]納入了我們的勢力範圍並將加速[From.GetAdjective]加入[Root.GetFactionName]的進程。"
 DOD_yugoslavia.70.a: "我方同意"
 DOD_yugoslavia.70.b: "我們對[FROM.GetNameDef]另有看法"
 DOD_yugoslavia.701.t: "[FROM.GetNameDefCap]拒絕提議！"
 DOD_yugoslavia.701.tripartite_rejection: "[FROM.GetLeader]已經回絕了[ROOT.GetAdjective]有關簽訂《三國同盟條約》的提案，同時聲稱他們對我國的前景“另有看法”。"
 DOD_yugoslavia.701.allied_objection: "由於簽署《三國同盟條約》的決定在國內外引起了軒然大波，[ROOT.GetLeader]作為彼得二世國王的攝政，其權力的合法性現在已經遭到了質疑，甚至其存在的必要性都打上了大大的問號。日前，在得到[From.GetAdjective]的支持後，一群隸屬於南斯拉夫皇家陸軍的軍官們宣稱，鑑於彼得二世陛下業已成年，他們將進軍貝爾格萊德並要求[ROOT.GetLeader]立即移交權力。"
 DOD_yugoslavia.701.a: "除了逆來順受我們別無選擇"
 DOD_yugoslavia.701.b: "拿起武器！"
 DOD_yugoslavia.702.t: "[YUG.GetNameDefCap]簽署《三國同盟條約》"
 DOD_yugoslavia.702.desc: "在簽署三國同盟條約後，[YUG.GetAdjective]政府今天加入了法西斯國家的行列中。即便這並不意味著[YUG.GetNameDef]已經加入了[From.GetFactionName]，但已表現出正在升溫的兩國關係以及[YUG.GetLeader]或許對法西斯主義持同情態度。很多人期望得到[Root.GetAdjective]對此憂慮態勢的答覆，但[Root.GetLeader]目前為止仍就此問題保持沉默…"
 DOD_yugoslavia.702.a: "[YUG.GetLeader]就是個懦弱的偽君！"
 DOD_yugoslavia.702.b: "我看這沒什麼好擔心的"
 DOD_yugoslavia.80.t: "扎拉的結盟交易案"
 DOD_yugoslavia.80.desc: "[From.GetLeader]今天宣佈[From.GetNameDef]將有意與[Root.GetNameDef]結盟並正式加入[Root.GetFactionName]，但是作為交換條件，我們必須以交出[163.GetName]控制權的方式表明我們放棄對巴爾幹半島的控制。"
 DOD_yugoslavia.80.a: "這聽起來很公平"
 DOD_yugoslavia.80.b: "倒是他們該割讓[103.GetName]"
 DOD_yugoslavia.801.t: "[From.GetNameDefCap]索取[103.GetName]！"
 DOD_yugoslavia.801.desc: "鑑於大使被要求以[103.GetName]作為我們加入[From.GetFactionName]的交換條件，我們的代表團看來似乎在[From.GetNameDef]受到了冷遇。"
 DOD_yugoslavia.801.a: "那就這樣吧……"
 DOD_yugoslavia.801.b: "絕無可能"
 DOD_yugoslavia.802.t: "[From.GetNameDefCap]接受提議！"
 DOD_yugoslavia.802.desc: "隨著[From.GetAdjective]政府同意將目前由[From.GetAdjective]佔據的達爾馬提亞領土歸還給該地的合法擁有者南斯拉夫，與[From.GetNameDef]的邊境摩擦將最終得到解決。[Root.GetLeader]今天宣佈，[From.GetLeader]是[Root.GetAdjective]在民族自由和自決方面真正的朋友，兩國現在將作為盟友並肩向前。"
 DOD_yugoslavia.802.a: "正如計劃的那樣"
 czech.1.t: "共產國際的新成員"
 czech.1.d: "我們過去和捷克人的關係時好時壞，但是最近他們的政策朝著歷史正確的方向發生了急劇的轉變。德國給他們的壓力越來越大，再加上他們對西方民主陣營的庇護喪失信心，導致他們正式提出了加入共產國際的請求。"
 czech.1.a: "我們對此竭誠歡迎"
 czech.1.b: "他們還不夠資格"
 czech.2.d: "[SOV.GetLeader]已經接受了我們加入共產國際的要求，我國的代表團已經加入了共產國際的執行委員會並有著完全的投票權。"
 czech.3.d: "[SOV.GetLeader]拒絕了我們加入共產國際的要求，並沒有給出任何理由。"
 czech.3.a: "我們和斯拉夫人的交情也就這樣……"
 czech.4.t: "羅馬尼亞問題"
 czech.4.d: "我們和羅馬尼亞的關係一直以來都因為他們佔領了我們的合法領土比薩拉比亞而變得緊張，然而現在這一邊界糾紛因為他們拒絕讓我們幫助我們的盟友[From.GetNameAdj]而進一步升級。然而我們的盟友提出了一個絕妙的解決方案：瓜分羅馬尼亞！一勞永逸的解決我們兩國的問題！"
 czech.4.a: "這方案簡單而絕妙"
 czech.4.b: "我們會另尋其他解決方案"
 czech.5.d: "[From.GetNameDefCap]已經批准了我們對羅馬尼亞問題的解決方案。軍方已經準備好了，隨時可以開始行動。"
 czech.6.d: "[From.GetLeader]拒絕了我們關於羅馬尼亞問題的解決方案。似乎他對於羅馬尼亞還有別的計劃。"
 czech.6.a: "這值得我們嘗試"
 czech.7.t: "波蘭局勢"
 czech.7.d: "從我們追求解放世界工人的偉大理想的那一刻開始，波蘭一直我們的大麻煩。現在我們的盟友[From.GetNameAdj]提出了一個有趣的方案：波蘭已經從我們兩國的土地上掠奪了足夠土地，那麼為什麼我們不去要求波蘭償還這一切併為此付出代價呢？"
 czech.7.a: "確實應當如此"
 czech.8.d: "[From.GetNameDefCap]已經同意我們一起去解決波蘭的局勢了，我們的軍隊一旦受到命令便會開始行動。"
 czech.9.d: "[From.GetNameDefCap]並沒有同意我們的建議，我們必須抓緊時間並考慮其他選擇。"
 czech.10.d: "自上次大戰結束以來，波蘭一直佔據著德意志的土地。他們的胃口似乎永遠也填不飽，持續地襲擊鄰國，貪婪地攫取土地。我們與[From.GetNameAdj]盟友得出了共同的結論：為了確保歐洲的和平，必須把波蘭國家再一次從地圖上抹去。"
 czech.10.a: "讓我們立即動手"
 czech.11.d: "[From.GetNameDefCap]已經同意了我們處理波蘭的計劃，一旦我們的部隊準備就緒，對波蘭的突襲就將開始。"
 czech.12.d: "[From.GetNameDefCap]拒絕了我們解決波蘭的計劃，也許時間會給我們另一次的機會。"
 czech.14.t: "斯洛伐克叛亂"
 czech.14.d: "自從我們把斯洛伐克人從政府中剔除之後，那些斯洛伐克官員就一直在怨恨著我們，在斯洛伐克人裡煽動暴力與衝突的思想。今天他們的行為終於成功了，他們得到了他們想要的戰爭。斯洛伐克叛亂開始了。"
 czech.14.a: "如果他們想要戰爭，那就滿足他們"
 czech.15.d: "隨著最後一處斯洛伐克軍隊的據點被我們碾碎，這場叛亂終於宣告了平定。"
 czech.15.a: "勝利！"
 czech.16.t: "捷克加入軸心國？"
 czech.16.d: "儘管一開始雙方都疑慮重重，但現在捷克人已經認識到布爾什維克才是真正的迫在眉睫的威脅，他們現在要求加入軸心國。[CZE.GetLeader]政府具體指出，這並不影響處理蘇臺德地區的問題。"
 czech.17.d: "[From.GetNameDefCap]同意我國加入軸心國的請求！"
 czech.17.a: "太好了！"
 czech.18.d: "[From.GetNameDefCap]拒絕我國加入軸心國的請求！"
 czech.18.a: "這下麻煩了"
 czech.19.t: "恥辱苟存"
 czech.19.d: "[From.GetLeader]和他的政府已經認識到一個事實：[From.GetNameDef]只能在我們的保護下繼續存在，雖然這樣我們就不可能直接佔領他們的土地，但卻能收穫一個忠心的盟友，且避免了外國勢力的任何干擾。"
 czech.20.t: "恥辱苟存"
 czech.20.d: "[From.GetLeader]現已同意我方請求。一位[From.GetAdjective]的全權代表已經抵達布拉格，就政策協調的相關問題開展工作。"
 czech.20.a: "這是唯一的辦法"
 czech.21.t: "恥辱苟存"
 czech.21.d: "據說在收到我們的提議之後，[From.GetLeader]領導人大呼“痴心妄想！”，然後就開始了關於我國人民如何低賤、我國政府如何落後以及[CZE.GetLeader]的領導能力如何糟糕的長篇大論。雖然現在還沒有收到正式拒絕，但我國大使表示希望渺茫。"
 czech.21.a: "這或許才是最好的結果"
 czech.22.t: "蘇臺德問題"
 czech.22.d: "[From.GetNameDef]政府決定獻上蘇臺德地區以換取兩國的互相諒解。一方面來說，這是一個讓我們幾近兵不血刃、毫無風險地獲得一片富庶之地的絕佳機會；另一方面，就蘇臺德問題製造一場危機是向全世界展示那些支持凡爾賽條約的所謂列強是不講道義的紙老虎的一個大好機會。"
 czech.23.d: "[From.GetNameDefCap]已經同意了我們的要求，[From.GetAdjective]軍隊在當地人的歡呼下進駐蘇臺德。"
 czech.23.a: "他們肯定不能再貪得無厭了"
 czech.24.d: "[From.GetLeader]拒絕向交出蘇臺德。因為他沒有任何理由去交出自己國家的土地，但[From.GetAdjective]的決定已經讓軍方感到震驚，他們認為德國人將會對我們有一個更大的計劃。"
 czech.24.a: "讓我們拭目以待"
 czech.25.t: "南斯拉夫加入小協約國"
 czech.25.d: "[From.GetNameDef]政府已經決定重新組建小協約國聯盟以抑制近年來不斷擴大影響力的德國。他們的外交部長近日邀請了我們的大使前往首都討論是否有興趣再一次的加入聯盟並作為小協約國的常任理事國。"
 czech.26.d: "[From.GetName]已經同意了加入小協約國，一個軍事代表團到達了我們的首都，就共同防禦事宜展開商討。"
 czech.27.d: "雖然來自[From.GetLeader]的大使同意了與我們進行會面，但他迄今依然拒絕讓他的國家重新回到小協約國來。看上去[From.GetAdjective]在擔心我們的聯盟將會破壞該地區的地緣政治平衡。"
 czech.28.t: "羅馬尼亞加入小協約國"
 czech.32.t: "捷匈和解"
 czech.32.d: "[From.GetNameDef]領導的小協約國長期以來遏制著我們國家，然而近來隨著德國力量不斷地增長，[From.GetNameDef]開始感到腹背受敵，並希望從雙方威脅裡下掙脫出來。因此[From.GetLeader]現在希望與我們達成和解。\n\n我們的政府在這個問題上出現了分裂，一派認為與[From.GetNameDef]的和解將是打破包圍圈以及兩國交往正常化的第一步，而另一派則指出這毫無疑問會引起[GER.GetLeader]並可能招來報復。"
 czech.32.a: "我方同意其提案"
 czech.32.b: "想都別想！"
 czech.33.d: "令人驚訝的是，[From.GetLeader]同意了我們的協議。隨後我們簽署了“互相友好條約”，確保我們兩國互相之間都沒有任何領土要求。"
 czech.33.a: "真是意料之外的好消息！"
 czech.34.d: "令人驚訝的是，[From.GetLeader]拒絕了我們的提議，並指責我們不願把某些地區交給匈牙利。"
 czech.34.a: "這倒也沒什麼新鮮的"
 dod_news.1.t: "小協約國的重建"
 dod_news.1.d: "[From.GetName]在今天宣佈，幾乎已經崩潰的“小協約國”聯盟從今天開始將持續恢復舊日的效能。一份來自[From.GetNameAdj]的外交聲明稱：\n“[From.GetName]並不是一個強權國家，而只是一個區域性的力量，但我們堅信，像我們這樣的有著區域性力量的國家的聯盟將會團結在一起阻止所謂的大國干預我們的政治事務。”"
 dod_news.1.a: "我等攜手便是列強"
 dod_news.1.b: "有趣的想法"
 dod_news.1.c: "我們可沒忘這盟約原本是對付誰的"
 dod_news.1.e: "如有必要我等必除之而後快"
 dod_news.1.f: "真是絕妙的進展！"
 dod_news.2.a: "我們將攜手新盟友奮戰到底"
 dod_news.2.b: "他們做出了明智的選擇"
 dod_news.2.c: "真是令人不安的消息……"
 dod_news.2.t: "[CZE.GetName]加入軸心國"
 dod_news.2.d: "令整個歐洲震驚的是，[CZE.GetName]與[GER.GetNameDef]簽署了一份結盟條約。此前就有報告表示[CZE.GetName]的民主黨派，近幾個月來思想上一直在走向右派。"
 dod_news.3.t: "[CZE.GetName]加入共產國際"
 dod_news.3.d: "令整個歐洲震驚的是，[CZE.GetName]與[SOV.GetNameDef]簽署了一份結盟條約，此前就有報告表示[CZE.GetName]的民主黨派近幾個月來思想上一直在走向左派。"
 dod_news.4.t: "[CZE.GetName]割讓蘇臺德地區"
 dod_news.4.d: "令大多數人意想不到的是，[CZE.GetName]今天單方面拱手將蘇臺德地區交給了德國。當被問及此事時，[CZE.GetName]外交部發言人回答道：“如今哪方佔據上風已然明瞭，此乃國家存續的不得已之策。”\n\n一位不願透露姓名的法國部長對[CZE.GetNameAdj]的行為進行了譴責，同時聲稱西方國家在[CZE.GetName]面對德國的施壓時毫無作為。"
 dod_news.4.a: "他們倒也別無選擇"
 dod_news.4.b: "他們以深謀遠慮化解了危機"
 dod_news.4.c: "他們的選擇頗為明智"
 dod_news.4.e: "我們本可以做點什麼嗎？"
 DOD_romania.999.t: "真愛的禮讚"
 DOD_romania.999.desc: "在今日的戰略會議上，醉酒上頭而情緒高漲的卡羅爾二世國王，突然強行接管了會議的進程，要求所有人傾聽他“昨夜靈光乍現”的絕妙構想。\n\n作為一名真正浪漫至深的君主，國王陛下在淚光中宣稱，他希望自己生命中的那些紅顏知己們，都能夠切身感受到他那份熾烈而真摯的愛。於是，面對參謀總長與諸位內閣大員，陛下展開了一段長篇大論的演說——儘管措辭略顯含糊——但他懇切呼籲眾人體察人世間最細膩、最深沉的情感。這番飽含激情的陳詞，最終落在了一個莊嚴而奇特的結論上：陛下鄭重呼籲，將敵國的兩座大城市改名，以此向人類所能體會的最偉大、最深邃之情——“愛”——致敬。\n\n國王顯然已深深執念於這個想法。若我們有意勸阻，他極可能毫不動搖。"
 DOD_romania.a: "陛下真是位天降的奇才！"
 DOD_romania.b: "來場超棒的宴會轉移陛下的關注吧"
 DOD_romania.16.t: "[FROM.GetNameDefCap]尋求加入[ROOT.GetFactionName]"
 DOD_romania.16.desc: "儘管目前與[romania_former_ally_target.GetNameDef]結盟，但[FROM.GetAdjective]政府內部的變化使這個國家更加符合[ROOT.GetAdjective]的理念，[FROM.GetLeader]也表達了想要加入[ROOT.GetFactionName]的願景。這是一個千載難逢的機會，當敵人對[FROM.GetNameDef]毫無防備的時候，他們決不會想到[FROM.GetAdjective]軍隊會把槍口對準他們。"
 DOD_romania.16.a: "歡迎[FROM.GetAdjective]的朋友們！"
 DOD_romania.161.t: "[FROM.GetNameDefCap]背叛[ROOT.GetNameDef]！"
 DOD_romania.161.desc: "不幸的是，[FROM.GetAdjective]外交部長所遞交的[FROM.GetNameDef]的信息毫無疑問是對[ROOT.GetFactionName]和[ROOT.GetRulingIdeology]理想的背叛！[FROM.GetNameDefCap]已經公然宣佈它將為[romania_new_ally_target.GetFactionName]而戰。"
 DOD_romania.161.a: "我們早該知道[FROM.GetLeader]不值信任！"
 DOD_romania.162.t: "[romania_new_ally_target.GetNameDefCap]同意結盟！"
 DOD_romania.162.desc: "我們獲悉[romania_new_ally_target.GetNameDef]已經同意我們進入[romania_new_ally_target.GetFactionName]的請求，很快[romania_former_ally_target.GetLeader]將會學習到一個真正的[ROOT.GetAdjective]勇士是如何去戰鬥的。"
 DOD_romania.162.a: "拿起武器！"
 DOD_romania.601.t: "[FROM.GetName]提議瓜分[YUG.GetNameDef]"
 DOD_romania.601.desc: "在意識到內鬥是[YUG.GetNameDef]這個國家的主要特徵後，[ROM.GetLeader]決定繼續推進[ROM.GetLeader.GetHerHis]通過拉攏區域強權瓜分南斯拉夫的政策。[Root.GetNameDefCap]是受邀參與瓜分南斯拉夫的國家之一，雖然這是一個擴大我方巴爾幹領土的誘人機會，但如果南斯拉夫拒絕最後通牒，我們將有義務參戰。"
 DOD_romania.601.a: "絕妙的主意！"
 DOD_romania.601.b: "也許我們應該置身事外"
 invited_to_split_yugo: "已接受瓜分南斯拉夫的邀請"
 strongest_claimant_ROM: "§Y羅馬尼亞§!擁有最強的宣稱"
 strongest_claimant_GER: "§Y德國§!擁有最強的宣稱"
 strongest_claimant_ITA: "§Y意大利§!擁有最強的宣稱"
 strongest_claimant_HUN: "§Y匈牙利§!擁有最強的宣稱"
 DOD_romania.163.t: "科德雷亞努之死"
 DOD_romania.163.desc: "科德里亞努是羅馬尼亞國家未來的威脅。他的魯莽行為破壞了穩定，致其被逮捕。他的死將成為一個引人深省提醒：要麼當我們的好榜樣，要麼變成一個可怕的警告。一位更加謹慎和負責任的領導人正在等待著羅馬尼亞的法西斯黨人。"
 DOD_romania.163.a: "人雖死而猶存"
