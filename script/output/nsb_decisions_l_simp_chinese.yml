 SOV_set_civil_war_state_tt: "我們已經成功的在[FROM.GetName]建立了反對派據點，這將保證內戰開始時這個地區對我們的忠誠。 "
 SOV_start_infiltrating_state_tt: "開始在[FROM.GetName]建立基層組織"
 SOV_sabotage_behind_enemy_lines_decision: "破壞敵人後方"
 SOV_sabotage_behind_enemy_lines_decision_desc: "在敵後活動的忠於我們的游擊隊可以被用於破壞敵人在[FROM.Getname]的通訊。他們將襲擊指揮所、切斷電報線或拆除火車軌道，使敵人更難抵禦我們部隊的攻擊，並增加我們成功解放俄羅斯的機會。"
 SOV_sabotage_behind_enemy_lines_decision_tt: "§Y敵軍部隊§!的§Y組織度§!將會減少"
 sabotage_behind_enemy_lines_flag: "準備一次破壞行動"
 SOV_dismiss_the_counter_revolution: "譴責反革命"
 SOV_dismiss_the_counter_revolution_desc: "通過公開譴責所謂的反革命言論，我們應該能夠將內務部的注意力從我們的特工身上轉移開。然而，這也意味著我們可能會失去一些對我們的譴責行為信以為真的潛在支持者。"
 SOV_dismiss_the_counter_revolution_tt: "以犧牲未來的穩定和減少軍事支持為代價，減少政治偏執度"
 SOV_dismiss_cd_tt: "\n這項決議可以在§Y60日§!後再次使用。"
