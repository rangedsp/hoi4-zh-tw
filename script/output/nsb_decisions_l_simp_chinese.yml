 SOV_preparations_for_operation_countenance: "準備“贊同行動”"
 SOV_operation_countenance: "贊同行動"
 SOV_preparations_for_operation_countenance_tt: "在$SOV_operation_countenance$開始並向[PER.GetNameDef]宣戰之前我們將有§Y[?SOV.SOV_operation_countenance_preparation_days]日§!的準備時間。\n$SOV_preparations_for_operation_countenance_mission_tt$\n"
