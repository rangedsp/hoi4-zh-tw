 SOV_gosproyektstroy_bring_foreign_experts: "邀請[FROM.GetAdjective]專家"
 SOV_gosproyektstroy_bring_foreign_experts_desc: "我們將與主要的[FROM.GetAdjective]工業單位簽署一項協議以僱傭專業的[FROM.GetNameDef]工程師和建築師作為我們工業項目的顧問。"
 SOV_gosproyektstroy_focus_civ: "民用工業專業化"
 SOV_gosproyektstroy_focus_civ_desc: "在大規模工業現代化期間，我們將會專注於升級民用輕重工業。"
 SOV_gosproyektstroy_focus_mil: "軍事工業專業化"
 SOV_gosproyektstroy_focus_mil_desc: "在大規模工業現代化期間，我們將會專注於提高軍事生產的效率。"
 SOV_gosproyektstroy_focus_dock: "造船廠專業化"
 SOV_gosproyektstroy_focus_dock_desc: "在大規模工業現代化期間，我們將會專注於提高海軍生產的效率。"
