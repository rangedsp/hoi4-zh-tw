 SOV_generic_industry_relocation: "遷移[FROM.GetName]的工業"
 SOV_generic_industry_relocation_desc: "儘管將[FROM.GetName]的工業用重裝設備撤離到烏拉爾是一項浩大的工程，但這對於確保我國戰時生產而言卻是必要的。"
 SOV_industry_relocation_complete_effect_tt: "最多§Y4座軍用或民用工廠§!將從§Y[FROM.GetName]§!移除。\n"
 SOV_industry_relocation_remove_effect_tt: "移除的工廠將會被遷移到烏拉爾的某個地區。 "
 SOV_relocate_industry_repair_tt: "§R部分工廠將需要重建。§!"
 SOV_relocate_industry_lose_control_tt: "§R失去對[FROM.GetName]的控制將使工廠在遷移過程中遭受更多傷害。§!"
