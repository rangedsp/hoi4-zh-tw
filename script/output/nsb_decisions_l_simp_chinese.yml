 SOV_concessions_japan_vladivostok_SCW: "承諾將符拉迪沃斯托克給予日本"
 SOV_concessions_japan_vladivostok_SCW_desc: "日本軍方一直對符拉迪沃斯托克垂涎欲滴。因此，如果我們用該地區未來的所有權作為談判的籌碼，他們應該會很樂意為我們提供志願部隊。"
 SOV_concessions_japan_vladivostok_SCW_accept: "如果他們同意，[JAP.GetNameDef]將在內戰期間為[GetSovietOppositionName]提供部隊。作為交換，[JAP.GetNameDefCap]將在內戰結束後獲得對符拉迪沃斯托克的所有權。"
 SOV_not_has_conflict_with_japan: "§Y[ROOT.GetNameWithFlag]§!：未與§Y[JAP.GetNameWithFlag]§!處於戰爭狀態"
 SOV_CSW_transfer_vladivostok_flag: "§Y符拉迪沃斯托克§!讓步"
 SOV_concessions_japan_sakhalin_SCW: "以薩哈林換取軍火"
 SOV_concessions_japan_sakhalin_SCW_desc: "起義需要武器。如果我們將北薩哈林的所有權給予日本人，他們應該會給我們一些。"
 SOV_concessions_japan_sakhalin_SCW_accept: "如果他們同意，[JAP.GetAdjective]將在內戰開始時為[GetSovietOppositionName]提供火炮和步槍，可能還會有額外人力。作為交換，[JAP.GetNameDefCap]將在內戰結束後獲得對北薩哈林的所有權。"
 SOV_CSW_transfer_sakhalin_flag: "§Y北薩哈林§!讓步"
 SOV_concessions_germany_baku_SCW: "以巴庫油田的開採權換取軍事建設"
 SOV_concessions_germany_baku_SCW_desc: "[GER.GetNameDefCap]需要大量的石油用於他們自己的軍事建設。如果我們承諾在內戰結束後給予他們巴庫油田的開採權，他們應該會向我們伸出援手。"
 SOV_concessions_germany_baku_SCW_accept: "如果他們同意，[GER.GetNameDef]將在[?SOV.SOV_civil_war_start_state.GetName]開始建設軍用工廠。[GetSovietOppositionName]將獲得[GER.GetAdjective]的坦克和步槍。作為交換，戰爭結束後[GER.GetNameDefCAP]將獲得[229.GetName]的資源開採權。"
 SOV_CSW_baku_oil_flag: "巴庫油田讓步"
 SOV_CSW_german_generals_flag: "德國軍事顧問"
 SOV_concessions_germany_ukraininan_oil_SCW: "德國資助的烏克蘭人起義"
 SOV_concessions_germany_ukraininan_oil_SCW_desc: "雖然我們也不想失去烏克蘭的寶貴資源，但在對抗斯大林主義者的戰爭中，他們可以成為一個寶貴的盟友。德國可以秘密地訓練烏克蘭民兵，然後烏克蘭起義者可以在準備好的時候發動突然襲擊。"
 SOV_concessions_germany_ukraininan_oil_SCW_accept: "如果他們同意，[GER.GetNameDef]將訓練烏克蘭部隊，在他們準備好後發動起義。戰爭結束後，[GER.GetNameDefCAP]將獲得烏克蘭地區的資源開採權。"
 SOV_concessions_uk_belarus_SCW: "以白俄羅斯獨立換取英國支持"
 SOV_concessions_uk_belarus_SCW_desc: "[ENG.GetAdjective]政府同情[BLR.GetAdjective]流亡政府的獨立呼籲。如果我們答應他們在戰後給予[BLR.GetNameDef]獨立，他們肯定會為我們提供武器。"
 SOV_concessions_uk_belarus_SCW_accept: "如果他們同意，[ENG.GetNameDef]將開始在[?SOV.SOV_civil_war_start_state.GetName]建設軍用工廠。戰爭結束後，[BLR.GetNameDefCAP]將成為獨立國家。"
 SOV_recruit_manchurian_cavalry_exiles: "在[FROM.GetName]招募滿洲騎兵"
 SOV_recruit_manchurian_cavalry_exiles_desc: "內戰開始時，在[?SOV.SOV_civil_war_start_state.GetName]獲得一個滿洲騎兵旅。"
 SOV_recruit_cavalry_exiles: "在[FROM.GetName]招募西伯利亞騎兵"
 SOV_recruit_cavalry_exiles_desc: "內戰開始時，在[FROM.GetName]獲得一個西伯利亞騎兵旅。"
