 SOV_forge_production_reports: "偽造令人滿意的生產報告"
 SOV_forge_production_reports_desc: "我們最新的生產報告有些令人擔憂。我們不知道沒有達到預期的數字是因為破壞者的行動，還是由於設定了不切實際的定額。但有一點是明確的，如果我們想避免內務人民委員會發起新的恐怖活動，我們最好把生產數據調整到可以接受的程度。"
