 SOV_sabotage_behind_enemy_lines_cost_blocked: "£command_power  §R15§!"
 SOV_wreckers_sabotage_contruction: "破壞建設"
 SOV_wreckers_sabotage_contruction_desc: "活動家們正蠢蠢欲動，只要一聲令下，他們就能在全國的建築工地舉行罷工。"
 SOV_wreckers_sabotage_contruction_tt: "§Y$industrial_complex$§!建築受損"
 SOV_wreckers_sabotage_military_production: "破壞軍事生產"
 SOV_wreckers_sabotage_military_production_desc: "沒有軍備，[SOS.GetLeader]的軍隊就沒法繼續作戰。"
 SOV_wreckers_sabotage_military_production_tt: "§Y$arms_factory$§!建築受損"
 SOV_wreckers_sabotage_dockyards: "破壞敵軍海軍船塢"
 SOV_wreckers_sabotage_dockyards_desc: "通過破壞[SOS.GetAdjective]的海軍生產設施，[SOS.GetLeader]的注意力將被轉移到其他地方。"
 SOV_wreckers_sabotage_dockyards_tt: "§Y$dockyard$§!建築受損"
 SOV_wreckers_sabotage_railways: "破壞敵軍鐵路網"
 SOV_wreckers_sabotage_railways_desc: "失去了補給以後，敵軍就沒法繼續行軍或戰鬥了。"
 SOV_wreckers_sabotage_railways_tt: "敵人控制的§Y$rail_way$§!將受損"
 SOV_secure_moscow_opposition: "確保莫斯科"
 SOV_secure_moscow_opposition_desc: "利用我們在莫斯科的內部網絡，我們將確保游擊隊會在這個地區起義，以儘快佔領首都。"
 SOV_secure_moscow_opposition_tt: "當內戰開始時，游擊隊將在莫斯科發動起義"
 SOV_secure_leningrad_opposition: "確保列寧格勒"
 SOV_secure_leningrad_opposition_desc: "利用我們在列寧格勒的內部網絡，我們將確保游擊隊會在這個地區起義，以儘快從斯大林派手裡奪取這座城市。"
 SOV_secure_leningrad_opposition_tt: "當內戰開始時，游擊隊將在列寧格勒發動起義"
 SOV_opposition_support_very_low_increase_effect_tt: "民眾對起義的支持度增加了§G+0.5%§!"
 SOV_opposition_support_low_increase_effect_tt: "民眾對起義的支持度增加了§G+1%§!"
 SOV_opposition_support_medium_increase_effect_tt: "民眾對起義的支持度增加了§G+1.5%§!"
 SOV_opposition_support_high_increase_effect_tt: "民眾對起義的支持度增加了§G+2%§!"
 SOV_opposition_support_low_decrease_effect_tt: "民眾對起義的支持度下降了§R1%§!"
 SOV_the_head_of_the_nkvd_yezhov: "內務人民委員-葉若夫"
 SOV_the_head_of_the_nkvd_yezhov_desc: "現任內務人民委員$SOV_genrikh_yagoda$與許多右翼反對派關係良好。我們應該可以說服他我們選擇的道路對這個國家來說是最好的選擇。"
 SOV_the_head_of_the_nkvd_yagoda: "內務人民委員-亞戈達"
 SOV_the_head_of_the_nkvd_yagoda_desc: "$SOV_genrikh_yagoda$與右翼反對派的領導人關係可能並不友好，但至少我們還有和他講道理的餘地。我們應該可以讓他看到我們倡議的價值，並讓他相信我們會是勝利的一方。"
 SOV_aligned_right_opposition_flag: "右翼反對派支持者"
 SOV_the_head_of_the_nkvd_yagoda_tt: "§Y$SOV_genrikh_yagoda$§!成為了一名右翼反對派支持者。"
 SOV_the_head_of_the_nkvd_yezhov_tt: "§Y$SOV_nikolay_yezhov$§!成為了一名右翼反對派支持者。"
 SOV_assassinate_stalin: "除掉斯大林"
 SOV_assassinate_stalin_desc: "和平地推翻暴政的唯一方法是將暴君斬首。這是一種無奈之舉，但廣大人民群眾將不必再經受另一次內戰的折磨。我們應該把他打倒，然後在他的繼任者能夠呼叫支援之前，繼續推進政變的計劃。"
 SOV_assassinate_stalin_good_tt: "一場暗殺行動正在執行中\n成功概率：§G80%§!\n£trigger_yes 基礎值：50%\n£trigger_yes $SOV_infiltrate_the_nkvd$：+30%"
 SOV_assassinate_stalin_bad_tt: "一場暗殺行動正在執行中\n成功概率：§Y50%§!\n£trigger_yes 基礎值：50%\n£trigger_no  $SOV_infiltrate_the_nkvd$：+30%"
 SOV_assassinate_stalin_outcome_tt: "---\n如果行動成功，§Y$SOV_lavrenty_beriya$§!將成為臨時領導人，而這就是我們發動政變的最佳時機。\n如果行動失敗，$SOV_paranoia_very_high_increase_effect_tt$"
 SOV_send_supporters_abroad: "將支持者送出國門"
 SOV_send_supporters_abroad_desc: "對我們的人來說，離斯大林和他的走狗越遠就越安全。我們需要把關鍵人物送往海外以確保他們的安全，這樣到時候他們就可以平平安安的回來，繼續參與我們的事業。"
 SOV_send_supporters_abroad_exile_tt: "以下角色將流亡（§G流亡中的角色不會被清洗§!）："
 SOV_send_supporters_abroad_back_tt: "\n當內戰爆發時，這些角色將回國並支持我們。\n"
 SOV_character_purged_flag: "已被清洗"
 SOV_align_general_stalin: "[ROOT.GetLeader]確保了一位將軍的忠誠"
 SOV_align_general_stalin_desc: "用盡了他所能使用的一切手段以後，[ROOT.GetLeader]設法確保了一位陸軍指揮官的忠誠，以為未來的衝突做準備。"
 SOV_align_general_stalin_tt: "§Y[?SOV.SOV_selected_general_stalin.GetName]§!將忠於[ROOT.GetLeader]"
 SOV_permanent_revolution_dec_cat: "不斷之革命"
 SOV_permanent_revolution_dec_cat_desc: "[GetAppropriatePermanentRevolutionDecCatDesc]"
 SOV_permanent_revolution_dec_cat_desc_soviet: "$SOV_the_permanent_revolution_desc$"
 SOV_permanent_revolution_dec_cat_desc_targets: "馬克思主義理論告訴我們，在特定的條件下，革命的爆發是無可避免的，而在我國境內活動的多個[SOV.GetAdjective]特工正在工人階級中間創造條件，以便在[ROOT.GetName]舉行武裝起義。"
 SOV_organize_fifth_columnists_in_enemy_neighbor: "動員[FROM.GetAdjective]第五縱隊"
 SOV_organize_fifth_columnists_in_enemy_neighbor_desc: "整個[FROM.GetNameDef]境內同情布爾什維克黨的工人和農民已經為武裝起義做好了準備，他們將在敵人最意想不到的地方展開攻擊。"
 SOV_ignite_uprising_timer_mission: "即將到來的革命派起義"
 SOV_ignite_uprising_timer_mission_desc: "[ROOT.GetAdjective]同情[SOV.GetAdjective]布爾什維克黨的工人和農民正準備在國內發起一場武裝起義。"
 SOV_ignite_uprising_timer_mission_tt: "§R託派革命民兵將在多個已控制的地區起義。§!\n"
 SOV_ignite_revolutionary_uprisings_effect_tt: "根據該國國內§Y共產主義支持率§!，減少£stability_texticon §Y穩定度§!並增加[FROM.GetNameDef]的§Y共產主義支持率§!。目前的效果為："
 SOV_ignite_revolutionary_uprisings: "煽動[FROM.GetNameDef]的群眾"
 SOV_ignite_revolutionary_uprisings_desc: "[FROM.GetNameDef]的工人已經開始對[FROM.GetRulingParty]和其資產階級政策表示不滿。現在是在[FROM.GetAdjective]的工人階級中宣傳共產主義思想的時候了。"
