 SOV_sinkiang_investment_ongoing_flag: "另一援助新疆的計劃正在進行中"
 SOV_sinkiang_mineral_prospection_sik: "提議在[SIK.GetNameDef]南部進行資源勘探"
 SOV_sinkiang_mineral_prospection_sik_desc: "[ROOT.GetAdjective]官員對[SIK.GetNameDef]阿勒泰地區開採的金礦和稀有礦物產生了興趣。為了進入新疆市場，我們將提議在[619.GetName]尋找新的礦床並且改善基礎設施，該區域礦產豐富，我們的鄰國的開採方法卻非常原始。"
 SOV_sinkiang_mineral_prospection: "在新疆南部進行資源勘探"
 SOV_sinkiang_mineral_prospection_desc: "位於原新疆西南部的[619.GetName]礦產豐富，但目前僅有一小部分正在被開採，且開採方法非常古老低效。我們必須勘探當地的戰略資源並且改善基礎設施以促進其開發。"
 SOV_sinkiang_mineral_prospection_mission_dummy: "[SOV.GetAdjective]資源勘探"
 SOV_sinkiang_prospection_rejected_flag: "我們的提議被拒絕了"
 SOV_sinkiang_oil_prospection_sik: "提議在[SIK.GetNameDef]北部進行資源勘探"
 SOV_sinkiang_oil_prospection_sik_desc: "位於[SIK.GetNameDef]北部的[618.GetName]石油及礦物資源豐富，但目前均未被我們的鄰居開採。我們將請求在該地區勘探戰略資源並且開發我們發現的所有礦床。"
 SOV_sinkiang_oil_prospection: "在新疆北部進行資源勘探"
 SOV_sinkiang_oil_prospection_desc: "位於原新疆北部的[618.GetName]地區石油及礦產資源豐富，但目前均未被開採。我們必須勘探當地的戰略資源並且改善基礎設施以促進其開發。"
 SOV_jiuquan_oil_prospection: "酒泉石油勘探"
 SOV_jiuquan_oil_prospection_desc: "我們的專家確信，在[XSM.GetNeutralParty]曾經統治領地北端的[756.GetName]或許存在著儲量可觀的石油資源。我們必須加緊開發該地的基礎設施，促進我們對當地礦藏的勘探。"
 SOV_sinkiang_oil_prospection_mission_dummy: "[SOV.GetAdjective]進行礦物及石油勘探"
 SOV_sinkiang_oil_prospection_rejected_flag: "$SOV_sinkiang_prospection_rejected_flag$"
 SOV_sinkiang_military_aid_sik: "對[SIK.GetNameDef]提供軍事援助"
 SOV_sinkiang_military_aid_sik_desc: "我們將向[SIK.GetNameDef]提供軍事援助。作為交換，他們增加了對我國所需的當地資源的出口。"
 SOV_sinkiang_military_aid_mission_dummy: "[SOV.GetAdjective]軍事援助"
 SOV_sinkiang_military_aid_rejected_flag: "$SOV_sinkiang_prospection_rejected_flag$"
 SOV_sinkiang_support_expansion_mission_dummy: "[SOV.GetAdjective]支持領土擴張"
 SOV_sinkiang_support_expansion_sik: "支持[SIK.GetNameDef]擴張"
 SOV_sinkiang_support_expansion_sik_desc: "我國在[SIK.GetNameDef]的貿易代表要求擴大對[ROOT.GetNameDef]的出口，現在新疆的領土擴張已使其能夠出口更多的貨物。"
 SOV_sinkiang_support_expansion_rejected_flag: "$SOV_sinkiang_prospection_rejected_flag$"
 SOV_formalize_of_the_soviet_republic_of_sinkiang: "成立新疆蘇維埃共和國"
 SOV_formalize_of_the_soviet_republic_of_sinkiang_desc: "是時候把[SIK.GetNameDef]改組成一個獨立的蘇維埃社會主義共和國了，只是附屬於[FROM.GetNameDef]政府而已。"
 SOV_formalize_of_the_soviet_republic_of_sinkiang_only_once_tt: "僅可執行一次這項決議。\n§gAI總是會接受。§!"
 SOV_sinkiang_prospection_flag: "已在新疆南部進行資源勘探"
 SOV_sinkiang_oil_prospection_flag: "已在新疆北部進行資源勘探"
 SOV_sinkiang_military_aid_flag: "已向新疆提供軍事援助"
 SOV_sinkiang_support_expansion_flag: "已通過在新疆新佔領的領土上興建基礎設施以支持其擴張"
