 SOV_send_infantry_equipment_asia: "援助步兵裝備"
 SOV_send_infantry_equipment_asia_desc: "必須向我們的中國盟友進行軍事援助，從而使他們能夠在對抗環伺的帝國主義國家和中國軍閥中佔據上風。"
