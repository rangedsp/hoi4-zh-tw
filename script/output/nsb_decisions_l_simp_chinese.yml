 SOV_soviet_aid_decision_category: "[SOV.GetAdjective]援助與投資項目"
 SOV_soviet_aid_decision_category_desc: "[SOV.GetNameDefCap]對援助我國，或者說，對我國自然資源、商品市場與外交關係產生了興趣。根據此前的協定，[SOV.GetAdjective]政府目前正在我國進行一項投資計劃，並聲稱這將刺激我國發展。"
