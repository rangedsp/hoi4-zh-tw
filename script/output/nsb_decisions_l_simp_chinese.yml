 restructure_supply_system: "重組鐵路系統"
 restructure_supply_system_desc: "通過重新引導建築材料和鐵路工人，我們可以在一些鐵路沿線快速建立少量臨時補給站。然而，這並不是一種可持續的運行鐵路系統的方式。\n\n§R這項決議僅可被執行一次。在建設3座額外的補給中心之後，這一加成將會消失。§!"
