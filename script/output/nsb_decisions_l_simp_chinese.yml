 form_siberia_category: "統一西伯利亞"
 form_siberia_category_desc: "西伯利亞從未有過統一的身份，無論是在文化上、種族上還是政治上；唯一的例外是，他們現在都成了“俄羅斯人”。然而正是因為被俄羅斯人逼入同一地域，西伯利亞人民從未像現在這樣團結。如果一個國家想要統一西伯利亞，並驅逐俄羅斯帝國主義者，那麼一定會有很多西伯利亞人願意接受這個新國家。事實上，目前也有很多人渴望著這樣一個國家的出現。"
