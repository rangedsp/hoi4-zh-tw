 SOV_influence_airforce_opposition: "促進空軍支持"
 SOV_influence_airforce_opposition_desc: "通過利用我們在紅軍中的關係，我們應該能夠找到同情我們事業的飛行員和空軍指揮官。讓空軍站在我們這邊肯定會使這場戰爭對我們來說更加容易。"
 SOV_influence_airforce_opposition_tt: "增加空軍支持度"
 SOV_influence_air_opposition_level_tt: "空軍支持度小於§Y70%§!"
 SOV_recruit_general_opposition: "為你的事業招募一名將軍"
 SOV_recruit_general_opposition_desc: "我們應該利用我們在紅軍內部的關係，試圖說服高級軍官在發生內戰時加入我們這邊。"
 SOV_recruit_general_opposition_tt: "一名陸軍將領或陸軍元帥將忠於我們的事業"
 SOV_recruit_admiral_opposition: "為你的事業徵召1名海軍將官"
 SOV_recruit_admiral_opposition_desc: "我們應該利用我們在紅海軍內部的關係，試圖說服高級軍官在發生內戰時加入我們這邊。"
 SOV_recruit_admiral_opposition_tt: "1名海軍將官將忠於我們的事業"
 SOV_recruit_cd_tt: "\n這項決議可以在§Y30日§!後再次使用。"
 SOV_army_framejob: "陷害一名陸軍軍官"
 SOV_army_framejob_desc: "通過散佈關於忠於[ROOT.GetLeader]的將軍的謠言，並將一些偽造的“證據”交到內務部手中，我們應該能夠暫時轉移內務部對我們的注意力。如果我們足夠幸運的話，作為意外收穫，其他人還可能會對鎮壓行動產生不滿。"
 SOV_army_framejob_tt: "一名陸軍將領或陸軍元帥將被誣陷以叛國罪名。"
 SOV_army_framejob_cd_tt: "\n這項決議可以在§Y[?SOV_army_framejob_decision_re_enable_days_display]日§!後再次使用。"
 SOV_navy_framejob: "陷害1名海軍將官"
 SOV_navy_framejob_desc: "通過散佈關於忠於[ROOT.GetLeader]的海軍將官的謠言，並將一些偽造的“證據”交到內務部手中，我們應該能夠暫時轉移內務部對我們的注意力。如果我們足夠幸運的話，作為意外收穫，其他人還可能會對鎮壓行動產生不滿。"
 SOV_navy_framejob_tt: "1名海軍將官將被誣陷以叛國罪名。"
 SOV_navy_framejob_cd_tt: "\n這項決議可以在§Y[?SOV_navy_framejob_decision_re_enable_days_display]日§!後再次使用。"
 SOV_plan_start_of_uprising_archangelsk: "在[FROM.GetName]建立秘密總部。"
 SOV_plan_start_of_uprising_archangelsk_desc: "北部地區有港口，離莫斯科比較近，這使它成為一個很好的基地。然而，它的基礎設施建設較差，發展水平較低，所以在這裡發動內戰會有些困難，除非採取一些措施來緩解這一問題。"
 SOV_plan_start_of_uprising_odessa: "在[FROM.GetName]建立秘密總部。"
 SOV_plan_start_of_uprising_odessa_desc: "烏克蘭地區是發起起義的絕佳根據地，這裡有豐富的物產，龐大的城市以及完善的港口和基建。但這個選擇也意味著，想要轉變[SOV.GetNameDef]發展落後地區的態度，並且讓他們加入我們的事業，會是一件極其困難的事情。"
 SOV_plan_start_of_uprising_chita: "在[FROM.GetName]建立秘密總部。"
 SOV_plan_start_of_uprising_chita_desc: "西伯利亞一直都是一個反斯大林、反布爾什維克的堅固壁壘。該地區可能不太發達，但在這裡建立秘密總部應該會幫助我們比較輕易地完成我們的事業。"
 SOV_plan_start_of_uprising_omsk: "在[FROM.GetName]建立秘密總部。"
 SOV_plan_start_of_uprising_omsk_desc: "鄂木斯克位於西西伯利亞，與烏拉爾山和大草原接壤，地理位置優越。雖然略顯落後，但在這裡為起義打一個堅實的地基，然後從這裡向莫斯科進軍，應該是比較容易的。"
 SOV_plan_start_of_uprising_tashkent: "在[FROM.GetName]建立秘密總部。"
 SOV_plan_start_of_uprising_tashkent_desc: "在大草原區域建立我們的基地的好處在於能確保我們的後方安全。雖然這也意味著我們需要長途跋涉才能到達莫斯科，但我們不必陷入兩線作戰的泥潭。此外，在這一地區獲取支持應該也相對比較容易。"
 SOV_plan_start_of_uprising_ufa: "在[FROM.GetName]建立秘密總部。"
 SOV_plan_start_of_uprising_ufa_desc: "烏拉爾山脈具有易守難攻的優勢，在這裡建立基地還能夠使我們的影響力滲透到西伯利亞、北部地區和南方的大草原地區。這將給我們許多選擇的餘地。"
 SOV_align_state_in_process: "目前正在滲透一個地區"
 SOV_planning_uprising_in_state: "滲透[FROM.GetName]"
 SOV_planning_uprising_in_siberia: "§W滲透§!西伯利亞§W區域內的§![FROM.GetName]"
