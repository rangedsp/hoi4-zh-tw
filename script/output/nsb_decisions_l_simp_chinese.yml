 SOV_soviet_aid_to_poum_decision_category: "秘密支持馬統工黨"
 SOV_soviet_aid_to_poum_decision_category_desc: "$SOV_covert_support_for_spanish_poum_desc$"
 SOV_organize_covert_depots_poum: "準備秘密據點"
 SOV_organize_covert_depots_poum_desc: "我們在西班牙的反斯大林主義聯絡人會準備隱蔽的武器裝備藏匿點以讓我們的特工通過各種方式取得它們。"
 SOV_organize_covert_depots_poum_tt: "馬統工黨起義時的效果：\n"
 SOV_send_infantry_equipment_poum: "提供步槍與彈藥"
 SOV_send_infantry_equipment_poum_desc: "一批新式步槍與彈藥將使我們的西班牙同志能夠繼續與法西斯主義和資產階級反革命鬥爭。"
 SOV_organize_popular_brigades_poum: "組織國際縱隊"
 SOV_organize_popular_brigades_poum_desc: "我們將與不同的反斯大林左翼陣線組織成員聯絡，無論他們來自國內還是國外，以此組建國際縱隊來幫助我們戰爭中的西班牙同志。"
 SOV_send_elite_commandos_poum: "派遣精銳突擊隊"
 SOV_send_elite_commandos_poum_desc: "我們擁有訓練有素、技能嫻熟、能夠成功進行特種作戰的人員，以及精通戰爭的非斯大林主義前內戰軍人和陸軍老兵。\n我們必須將這些人派往馬統工黨政府以對抗法西斯主義和斯大林主義。"
 SOV_send_elite_commandos_poum_flag: "已向西班牙派遣精銳突擊隊"
 SOV_organize_popular_speeches_poum: "組織民間宣講"
 SOV_organize_popular_speeches_poum_desc: "我們的西班牙同志需要人民的全力配合以繼續進行戰爭。我們必須與地方組織中有影響力的個人合作，通過宣傳和鼓動重新點燃西班牙群眾的革命火焰。"
 SOV_infiltrate_stalinist_plans_in_spain_poum: "滲透西班牙斯大林主義者的指揮部"
 SOV_infiltrate_stalinist_plans_in_spain_poum_desc: "一批蘇軍顧問將被派往西班牙幫助共和軍的資產階級政府，我們有機會將幾名反斯大林主義特工混入其中。\n這些特工會在資產階級共和軍政府那裡聯絡並招募支持馬統工黨的士兵、國際縱隊成員和民兵，從而建立一個能讓我們提前瞭解敵軍計劃的情報網絡。"
