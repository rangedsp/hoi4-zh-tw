 POL_cossack_republic_decisions: "哥薩克共和國"
 POL_cossack_republic_decisions_desc: "在俄國內戰期間，獨立的哥薩克部族建立了好幾個政權，與白軍聯合作戰。現在白軍流亡勢力已經深入俄羅斯腹地，我們有機會重建這個一度滅亡的共和國了。"
 POL_restore_don_cossacks: "重建頓河共和國"
 POL_restore_don_cossacks_desc: "作為堅定的反布爾什維克主義者，頓河哥薩克在俄國內戰中與白軍並肩作戰。現在他們的所有領土都歸我們控制了，我們可以邀請被流放的頓河哥薩克重新回到他們的土地並與他們並肩作戰。"
 POL_restore_kuban_cossacks: "重建庫班共和國"
 POL_restore_kuban_cossacks_desc: "庫班哥薩克人的背叛是俄國內戰時白軍失敗的一個重要因素。現在，我們需要確保庫班人由一個忠誠的政府領導。"
