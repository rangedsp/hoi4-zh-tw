 SOV_SOS_civil_war_divisions_tt_long: "§Y內戰支持度§!\n§L最重要的是，在內戰的爆發已經不可避免的情況下，我們要在武裝部隊和全體民眾中獲取儘可能多的支持。\n\n§![GetArmedForcesText]\n\n----\n當斯大林的偏執度高於§R90%§!的時候，每日斯大林有§Y20%§!的可能性會發動內戰\n----\n[GetCategoryStateText]"
