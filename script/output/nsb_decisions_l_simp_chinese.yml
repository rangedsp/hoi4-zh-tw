 SOV_raid_trotskys_villa_tt: "一隊武裝刺客將試圖突襲托洛茨基的別墅並將其擊斃。\n\n如果§Y[FROM.GetFlag][FROM.GetNameDefCap]§!有以下條件，成功刺殺托洛茨基的概率將會增加：\n-高共產主義支持度\n-與[ROOT.GetFlag][ROOT.GetNameDefCap]在同一陣營內\n-是[ROOT.GetFlag][ROOT.GetNameDefCap]的傀儡\n"
 SOV_carefully_planned_assassination: "滲透與刺殺"
 SOV_carefully_planned_assassination_desc: "西班牙裔內務部特工拉蒙·麥卡德將會與托洛茨基德心腹交好，然後他會假裝成托洛茨基的支持者，前往墨西哥，只待時機合適便開始刺殺。"
 SOV_carefully_planned_assassination_tt: "一位內務部特工將會試圖滲透進入托派內部圈子並刺殺托洛茨基。\n\n如果§Y[FROM.GetFlag][FROM.GetNameDefCap]§!有以下條件，成功刺殺托洛茨基的概率將會增加：\n-高共產主義支持度\n-與[ROOT.GetFlag][ROOT.GetNameDefCap]關係良好\n-與[ROOT.GetFlag][ROOT.GetNameDefCap]在同一陣營中\n-是[ROOT.GetFlag][ROOT.GetNameDefCap]的傀儡\n-已經進行了一次對托洛茨基別墅的突襲\n"
