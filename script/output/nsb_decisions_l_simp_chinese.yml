 form_mountainous_republic_category: "成立北高加索山區共和國"
 form_mountainous_republic_category_desc: "在俄國內戰期間，偉大的塔帕·切爾莫耶夫嘗試將北高加索諸共和國統一在一面大旗下，以抵禦俄國入侵者。現在，北高加索人民將再次團結起來，趕跑外國勢力，重現榮光！"
 form_mountainous_republic: "統一山區共和國"
 form_transcaucasus_category: "外高加索共和國"
 form_transcaucasus_category_desc: "外高加索共和國在1936年蘇聯憲法頒佈後不久才解散，它仍然是一個深深烙印在人們腦海中的理念。如果一個國家能夠統一這些領土，就有可能重新建立聯邦，外高加索可能會再次團結且強大。"
