l_simp_chinese:
 BALTIC_entente: "波羅的海協約"
 BALTIC_entente_desc: "我們波羅的海國家有共同的兄弟情誼，其中最顯著的就是我們長期被外來帝國主義壓迫的歷史。我們不能再向外國勢力屈服了，否則就是把我們主權的鑰匙交給又一個帝國主義勢力。只有團結一致我們才有希望保持獨立自主。"
 formalize_the_entente: "成立波羅的海協約"
 formalize_the_entente_desc: "一直以來我們都在猶豫是否將波羅的海協約稱為一個合乎體統的陣營，但現在我們確定已經有足夠的成員站出來抵禦我們國界外激增的帝國主義。"
 abandon_the_entente: "拋棄協約"
 abandon_the_entente_desc: "這是個愚蠢的計劃。不管我們投入多少希望，波羅的海國家根本不可能只靠自己就能存活。我們必須向某個外國勢力屈服，無論是哪個勢力。"
 baltic_entente_leader_flag: "是波羅的海協約的領導者。\n"
 baltic_entente_flag: "已經同意加入波羅的海協約"
 convert_neighbours_baltic_cat: "傳播革命"
 convert_neighbours_baltic_cat_desc: "在[Root.GetNameDef]的革命是一次令人矚目的成功，現在只剩把革命的消息傳播給我們的波羅的海兄弟。波羅的海的工人們將親手從資產階級壓迫者獲得解放，當然[Root.GetAdjective]的援助會在途中幫一手。"
 BALTIC_promote_communism: "在[From.Owner.GetNameDef]的社會主義宣傳運動"
 BALTIC_promote_communism_desc: "許多[From.Owner.GetNameDef]的農民仍然視社會主義為他們生活方式的敵人。儘管我們可能永遠無法治癒紅軍留下的傷疤，我們仍可能讓他們相信我們的革命不會那麼血腥。"
 BALTIC_promote_communism_militancy: "支持[From.Owner.GetAdjective]的武裝分子"
 BALTIC_promote_communism_militancy_desc: "社會主義熱情在許多[From.Owner.GetAdjective]的工人心中熊熊燃燒，他們只需要一些外部力量的支持就能踏上顛覆專制的道路。"
 BALTIC_communist_propaganda: "波羅的海共產主義宣傳"
 BALTIC_communist_militancy: "波羅的共產黨武裝"
 infiltrate_belarus_decisions: "滲透白俄羅斯"
 infiltrate_belarus_decisions_desc: "蘇聯宣稱他們代表著白俄羅斯下層階級的利益，然而波羅的社會主義者宣稱蘇聯只是裝個樣子。他們宣稱[SOV.GetLeader]是一個徹頭徹尾的資產階級獨裁者，只有武裝白俄羅斯人民才能解放他們並建立一個社會主義國家。"
 BALTIC_promote_unity_BLR: "[From.GetName]的控制權競爭"
 BALTIC_promote_unity_BLR_desc: "當白俄羅斯內戰爆發時，所有州都要獨自決定他們站在這次革命的哪一邊。我們必須確保[From.GetName]是勝利的一方。"
 BALTIC_belarus_uprising: "即將到來的白俄羅斯內戰"
 BALTIC_belarus_uprising_desc: "白俄羅斯民族已被撕裂：有一半希望作為一部分留在[SOV.GetNameDef]，另一半則希望投奔波羅的海諸國。"
 support_polish_falange_decisions: "支持波蘭長槍黨"
 support_polish_falange_decisions_desc: "法西斯主義已經在立陶宛成功，我們沒有理由拋棄曾經的兄弟波蘭。通過在波蘭百姓之間傳播長槍黨的理念，我們也許能賦予[POL.GetFascistParty]權力並由此在整個大陸上主張波蘭—立陶宛霸權。"
 LIT_promote_fascism: "在波蘭的法西斯主義宣傳"
 LIT_promote_fascism_desc: "幾十年來，法西斯主義一直處於波蘭政治的邊緣。儘管我們樂於見到波蘭人為自己起身反抗，但我們若不在他們國家公開推進法西斯主義，他們幾乎沒有任何機會。"
 LIT_promote_falange_militancy: "支持長槍黨武裝分子"
 LIT_promote_falange_militancy_desc: "[POL.GetFascistParty]因其狂暴而猛烈的示威方式而臭名昭著。許多法西斯主義者畏懼[POL.GetFascistParty]的民族主義狂熱，但我們知道這只不過是他們心中燃燒著的，必須被支持的愛國精神的表現。"
 LIT_ignite_civil_war_in_POL: "發動起義"
 LIT_ignite_civil_war_in_POL_desc: "準備行動已經完成。波蘭不久將成為不僅是意識形態的，更是英勇與榮耀的戰場。我們已經做了所有能做的來支持波蘭的長槍黨人，我們現在只要擲下骰子然後希望上帝站在他們那邊。"
 LIT_adopt_the_dobuzhinsky_flag_design_decision: "採用多布任斯基的紋章旗設計"
 LIT_adopt_the_dobuzhinsky_flag_design_decision_desc: "我們旗幟的顏色必須與國徽的顏色相匹配。國徽中沒有綠色，因此國旗上也不應該出現綠色。因此，我們應該採納姆斯蒂斯拉夫·多布任斯基和維杜納斯的提案。"
 march_through_estonia: "穿越愛沙尼亞的遊行"
 march_through_estonia_desc: "康斯坦丁·佩茨的軟弱政府已經封鎖愛沙尼亞愛國者的呼聲太久了。我們缺少獨自與愛沙尼亞軍隊戰鬥的人力，但或許在遍佈全國的一系列遊行中申明我們對獨裁統治的擔憂後，我們或能讓愛沙尼亞的年輕人明白，他們的父輩為他們而戰換來的美好生活，正在被帕斯和他的陰謀集團所否認。"
 EST_stomp_the_vaps: "即將到來的政府鎮壓"
 EST_stomp_the_vaps_desc: "[EST.GetLeader]知道我們試圖瓦解[EST.GetLeader.GetHerHis]的政權。[EST.GetLeader.GetSheHe]正在準備鎮壓我們並終止我們的遊行。如果我們沒有在此之前顛覆政府，愛沙尼亞將面臨內戰！"
 EST_march_in_state: "在[FROM.GetName]遊行"
 EST_convert_FIN_cat: "穿越芬蘭的遊行"
 EST_convert_FIN_cat_desc: "[FIN.GetFascistParty]與[EST.GetFascistParty]有長久而緊密的聯繫。現在我們已經取得了自己國家的統治權，我們必須讓芬蘭老兵們有能力接管他們的國家。"
 EST_march_in_FIN_state: "在[FROM.GetName]遊行"
 EST_march_in_FIN_capital: "向[FROM.GetName]進軍"
 EST_march_in_FIN_capital_desc: "一旦我們覺得芬蘭的老兵們已經被鼓動起來，我們就只需要給出向[FROM.GetName]進軍的信號，之後芬蘭人就終於能在法西斯主義的指導下變得更加強大了。"
 promote_baltic_fascism_cat: "促進波羅的法西斯主義"
 promote_baltic_fascism_cat_desc: "波羅的海地區軟弱而幼稚的政權無力代表它們國民血管裡流淌的波羅的海血脈。立陶宛，愛沙尼亞，甚至是波蘭的一些人必須回想起他們祖輩的榮光，回想起曾經奮起反抗現在妄圖壓迫我們的日耳曼人與斯拉夫人的光榮歲月。"
 LAT_promote_fascism: "在[From.Owner.GetNameDef]的法西斯宣傳"
 LAT_promote_fascism_desc: "在[From.Owner.GetNameDef]的許多人目前並還沒有接受他們的[From.Owner.GetFascistParty]黨是保證[From.Owner.GetAdjective]人至少能獨立自主的唯一選擇。這一點必須用宣傳手段，和對[From.Owner.GetFascistParty]黨的積極支持來加以修正。"
 LAT_promote_falange_militancy: "支持[From.Owner.GetFascistParty]的激進分子"
 LAT_promote_falange_militancy_desc: "有一些來自[From.Owner.GetNameDef]的人們內心依然湧動著波羅的海人的熱血，因此我們的責任是向他們提供軍事和政治支持。"
 LAT_ignite_civil_war_in_target: "引發[From.Owner.GetAdjective]內戰"
 LAT_ignite_civil_war_in_target_desc: "政治宣傳能夠做的已經到頭了，一些時候直接行動才能夠給國家帶來力量與穩定。我們已經做了所有能做的，現在就讓[From.Owner.GetFascistParty]直面自己的命運吧。"
 LIT_iron_wolf_coup: "鐵狼團政變"
 LIT_iron_wolf_coup_desc: "奧古斯丁納斯·沃爾德馬拉斯的追隨者們正在國內策劃一場叛亂。如果我們再不做些什麼來智取鐵狼的話，我國就會面臨墮入內戰的風險。我們必須決定是要對鐵狼團做出讓步並承擔賦予他們權力的風險；還是直接將他們的領導人驅逐出境，讓那些一盤散沙般的追隨者們失去他們曾經宣稱擁有過的強大領導。"
 LIT_iron_wolf_partisans: "鐵狼的黨羽"
 LIT_iron_wolf_partisans_desc: "鐵狼團正在我們的國內被組織起來。隨著時間的推移，他們會不可避免地在立陶宛人民中獲得更多支持；最後這種支持可能會鼓勵他們發動一場針對現有政府的政變。"
 LIT_iron_wolf_appeasement: "拖延鐵狼叛亂"
 LIT_iron_wolf_appeasement_desc: "我們必須盡力去干擾鐵狼在國內的活動。儘管這些方法都不可能將他們完全消滅；我們可能還是可以干擾他們一段時間，並用這段時間來找到一個一勞永逸的解決方案。"
 LIT_relocate_iron_wolf_recruitment: "遷移鐵狼團徵募中心"
 LIT_relocate_iron_wolf_recruitment_desc: "鐵狼團依賴那些當地的招募官們招募新人加入他們的隊伍。通過強制遷移這些招募官，我們可以迷惑任何鐵狼組織的潛在追隨者，並可能可以組織他們加入鐵狼團伙。"
 LIT_promote_alternative_paramilitaries: "支持其他準軍事組織"
 LIT_promote_alternative_paramilitaries_desc: "雖然我們希望公民們能加入立陶宛政府軍，但他們中的一些人不可避免地會對政府外的某些團體保持忠誠。也許我們可以通過晉升立陶宛步槍兵聯盟一類的團體來防止更多民族主義者加入鐵狼團。"
 LIT_grant_concessions_to_iron_wolf: "向鐵狼團讓步"
 LIT_grant_concessions_to_iron_wolf_desc: "我們也許可以通過向鐵狼團做一些象徵性的表態來一定程度上平息他們的激憤。"
 EST_vaps_revolt_category: "瓦普叛亂"
 EST_vaps_revolt_category_desc: "愛沙尼亞的多個退伍兵群體組成了一個名為瓦普運動的法西斯主義集團並威脅要顛覆政府。我們必須用行動遏制愛沙尼亞民族主義的抬頭以保全我們的政權。"
 EST_vaps_uprising: "在塔林示威的瓦普人員"
 EST_vaps_uprising_desc: "作為非法組織的瓦普運動不斷在愛沙尼亞境內進行遊行示威。如果我們長時間放任這個民族主義組織作妖，更多的人將加入他們的行動。"
 EST_vaps_crackdown: "對瓦普運動的鎮壓"
 EST_vaps_crackdown_desc: "我們正計劃對所有與瓦普運動勾結的團體進行全面鎮壓。如果瓦普運動能停留在政治邊緣，此次鎮壓應大事化小。但如果他們積累了過多的支持，鎮壓的結果將是與部分愛沙尼亞退伍兵的血腥內戰。"
 EST_fight_vaps_decisions: "對抗瓦普運動"
 EST_fight_vaps_decisions_desc: "只有瓦普運動被反制了，我們的鎮壓才會見成效。擾亂瓦普運動會劇烈地動搖他們在國內的影響力，而且會使得他們被強制驅逐的進程更加順利。"
 EST_divide_veterans_societies: "分化退伍兵團體"
 EST_divide_veterans_societies_desc: "瓦普運動的成員絕大多數是在愛沙尼亞獨立戰爭中鬥爭過的士兵，雖然看著我們的英雄們被極端民族主義所左右是一件苦事，但我們必須切割並分化這些被瓦普運動所裹挾的退伍兵群體。"
 EST_disrupt_vaps_recruitment: "破壞瓦普運動的部隊招募"
 EST_disrupt_vaps_recruitment_desc: "雖然瓦普運動的成員多為中老年的退伍兵，但其中也不缺乏為了父輩之名而加入運動的年輕支持者。我們必須想方設法破壞他們的部隊招募來讓這些年輕人免於跌入法西斯主義的深淵。"
 EST_crackdown_on_vaps: "圍剿瓦普運動"
 EST_crackdown_on_vaps_desc: "瓦普運動變得越來越膽大包天了。我們必須對他們進行圍剿來挫挫他們越發鋒利的銳氣。"
 EST_put_vaps_leaders_on_trial: "審判瓦普運動支持者"
 EST_put_vaps_leaders_on_trial_desc: "有的政府官員對瓦普運動的贊同態度已經路人皆知。這樣的情況不能再繼續下去了；軍隊中與瓦普運動有勾結的士官們必須作為叛國者受到審判。"
 EST_launch_vaps_investigation: "發起對瓦普運動的調查"
 EST_launch_vaps_investigation_desc: "我們必須發動我們的情報部門來滲透瓦普運動的組織並破壞他們推翻政府的行徑。"
 EST_anti_vaps_propaganda: "反法西斯主義宣傳"
 EST_anti_vaps_propaganda_desc: "我們正按部就班地在國內進行反法西斯主義宣傳。反對法西斯主義的大多是民主派和共產主義者，但如果我們攜手對抗法西斯主義，或許我們可以勸服他們支持獨裁政權。"
 EST_delay_the_crackdown: "推遲鎮壓行動"
 EST_delay_the_crackdown_desc: "雖然我們希望瓦普運動能夠立刻得到解決，但是我們不能承擔讓國家陷入混亂的風險。我們的鎮壓行動必須被推遲。"
 EST_vapsid_takeover: "瓦普運動已統治國家"
 LAT_perkonkrust_revolt_category: "雷霆十字黨叛亂"
 LAT_perkonkrust_revolt_category_desc: "作為鼓吹波羅的海部族和拉脫維亞種族的極端民族主義者，雷霆十字黨嚴重威脅了我們通過艱苦鬥爭而創立的拉脫維亞。雷霆十字黨是我們傷痕累累的民族自豪感上的蛀蟲，因此他們必須被消滅掉。"
 LAT_perkonkrust_uprising: "雷霆十字黨暴動"
 LAT_perkonkrust_uprising_desc: "雷霆十字黨將不斷在國內爭取支持，並且如果我們坐視不理，他們將會有膽量開始進行顛覆政權的嘗試。"
 LAT_delay_perkonkrust_decisions: "對抗雷霆十字黨"
 LAT_delay_perkonkrust_decisions_desc: "雖然這不是長久之計，但我們也許需要在國內開始進行打擊法西斯主義的戰鬥，直到雷霆十字黨叛軍被不惜代價地解決為止。"
 LAT_equality_campaigns: "平權運動"
 LAT_equality_campaigns_desc: "雷霆十字黨人反對[Root.GetLeader]建立一個普天之下人人平等的拉脫維亞，而我們必須堅定地闡明我們的立場，那就是這樣的種族優越論敘事已經動搖了我們國家的根本價值。"
 LAT_empower_democrats: "賦予民主派權力"
 LAT_empower_democrats_desc: "儘管民主主義者並不受我們歡迎，但他們是雷霆十字黨的堅定反對者，並且對我們國家的威脅要小得多。雖然這將增加反對派民主主義者的支持度，但我們必須先竭盡全力遏制雷霆十字黨的活動。"
 LAT_support_loyalists: "整合反對派"
 LAT_support_loyalists_desc: "通過合併反對派力量，我們將更有能力讓雷霆十字黨在我們國家的政治生活中邊緣化。"
 BALTIC_forest_brother_resistance_cat: "森林兄弟抵抗運動"
 BALTIC_forest_brother_resistance_cat_desc: "在我國，並不是人人都能接受社會主義。而在這群人中間，森林兄弟在表達對新興[Root.GetNonIdeologyName]不滿的活躍度上則是無出其右。作為[Root.GetAdjective]國家主義的堅定擁護者，森林兄弟不僅拒接接受一切來自[Root.GetNonIdeologyName]的影響，還會試圖將共產黨替換為更國家主義的政府。"
 BALTIC_forest_brothers_resistance: "抵抗活動"
 BALTIC_forest_brothers_resistance_desc: "森林兄弟正準備在我國國內進行叛國活動。我們暫時還不知道他們要幹什麼，但是我們知道他們一定會阻止我們在國內傳播社會主義。"
 POL_purchase_madagascar: "購買[543.GetName]"
 POL_purchase_madagascar_desc: "馬達加斯加島是一塊陌生的土地，波蘭人對這裡的大量動植物群體全然不知。儘管大多數人將這些不確定因素視作波蘭人不適宜定居的理由，但也有人將這裡視為嶄新生活的開始。這座島的大小和潛在的未開採資源為波蘭流亡政府提供了理想的根據地，而這一切會如此順利嗎。"
 POL_purchase_gambia: "訂購[701.GetName]"
 POL_purchase_gambia_desc: "數百年前，庫爾蘭公爵領曾試圖以波蘭-立陶宛聯邦的名義殖民[701.GetName]。儘管他們和當地人建立了良好的關係，但最後還是被外國勢力給驅逐了出去。是時候改正這個錯誤了。"
 POL_purchase_cheap_colony: "訂購[FROM.GetName]"
 POL_purchase_cheap_colony_desc: "波蘭對[FROM.GetName]的興趣日漸增長。雖然這些關注本身不在政府考慮範圍之內，但是它們可以被波蘭人用作購買這些地區的理由。"
 POL_anti_capitalist_decisions: "反資本主義革命"
 POL_anti_capitalist_decisions_desc: "資本主義是這個世界的毒瘤。儘管許多資本主義國家宣稱他們所謂的“民主”，但他們只是在資產階級當權的民主下奴役無產階級，是然，從資產階級手中解放他們的同志是每個社會主義者義不容辭的使命。"
 POL_anti_fascist_revolution_category: "反法西斯革命"
 POL_anti_fascist_revolution_category_desc: "法西斯主義盜用了無產階級同資產階級鬥爭的話語體系，並用其創造了一套超國家主義的獨裁體制來繼續壓迫工人階級。作為一個社會主義國家，我們必須將全世界的工人從法西斯的恐怖統治下解放出來。"
 POL_support_monarchy_in_LIT_cat: "宣稱[Root.GetRoyalClaim]"
 POL_support_monarchy_in_LIT_cat_desc: "既然[Root.GetLeader]坐上了[Root.GetAdjective]王位，我們也就擁有了對[Root.GetRoyalClaim]無可爭辯的宣稱。\n\n我們當前的宣稱強度為[Root.GetPolRoyalClaimStrength]"
