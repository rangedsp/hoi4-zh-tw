 SOV_peace_deal_for_south_sakhalin_and_kuril_islands: "以[537.GetName]和[555.GetName]為條件提出和談"
 SOV_peace_deal_for_south_sakhalin_and_kuril_islands_desc: "如果[JAP.GetAdjective]政府同意歸還我們以前的領土[537.GetName]和[555.GetName]，我們將對其停止一切敵對活動。"
 SOV_peace_deal_for_hokkaido: "以庫頁島、千島群島和北海道為條件提出和談"
