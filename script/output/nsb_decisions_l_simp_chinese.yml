 form_idel_ural_category: "伊德爾—烏拉爾再統一"
 form_idel_ural_category_desc: "1918年3月1日，國民議會試圖宣佈建立一個伊德爾-烏拉爾共和國，但這個夢想被內戰雙方共同擊碎了。今天，在該地區建立一個統一國家的概念仍未得到廣泛的探討，但如果有人為了保護人民不受俄羅斯帝國主義的影響而宣佈建立這個國家，那麼民眾無疑將熱情地擁護他。"
