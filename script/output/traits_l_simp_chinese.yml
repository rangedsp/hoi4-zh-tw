 FIN_personal_agenda_tanner_tt: "§G團結的國家§!：在$democratic$意識形態支持度高於§Y95%§!時控制§Y卡累利阿§!和所有擁有地區將提高£GFX_power_balance_texticon §Y公眾信任§!。\n  -§R極端分子支持度如鯁在喉§!：$fascism$或$communism$意識形態支持度大於§Y9%§!將降低£GFX_power_balance_texticon §Y公眾信任§!。\n  -$losing_soverignty_threatened_tt$"
