 #Event for GER
 GER_operation_panzerfaust_events.01.t: "霍爾蒂忠誠問題"
 GER_operation_panzerfaust_events.01.desc: "我們發現我們的盟友霍爾蒂·米克洛什可能正與敵方秘密接觸達成和平協議。我們必須向他施壓，確保匈牙利忠於我們的事業。"
 GER_operation_panzerfaust_events.01.a: "要求他服從元首"
 GER_operation_panzerfaust_events.01.b: "這反應過度了，霍爾蒂是忠誠的！"
 #Event for HUN
 GER_operation_panzerfaust_events.02.t: "[GER.GetLeader]要求霍爾蒂辭職"
 GER_operation_panzerfaust_events.02.desc: "今天我們收到消息，德國要求米霍爾蒂·米克洛什下臺，以便由他們認為更為可靠的薩拉希·費倫茨接任。他們還表示，如果不如他們所願，他們可能會採取干涉手段。"
 GER_operation_panzerfaust_events.02.a: "我們無力反抗"
 GER_operation_panzerfaust_events.02.b: "他們沒有權力在這裡為所欲為"
 #Event for GER
 GER_operation_panzerfaust_events.03.t: "匈牙利屈服"
 GER_operation_panzerfaust_events.03.desc: "霍爾蒂·米克洛什已屈服，匈牙利現在完全在我們掌控之下。看來我們的威脅奏效了。"
 GER_operation_panzerfaust_events.03.a: "太好了"
 #Event for GER
 GER_operation_panzerfaust_events.04.t: "霍爾蒂保持強硬"
 GER_operation_panzerfaust_events.04.desc: "霍爾蒂·米克洛什今天宣佈他不會屈服於德國壓力，匈牙利將繼續獨立於德國之外。僅靠外交壓力似乎不足以奏效，我們必須決定下一步的行動。"
 GER_operation_panzerfaust_events.04.a: "這太過分了，開啟瑪格麗特行動！"
 GER_operation_panzerfaust_events.04.b: "我們不會配合他的把戲"
 GER_operation_panzerfaust_events.04.c: "那就交給我們的特工去處理吧……"
 #Event for HUN
 GER_operation_panzerfaust_events.05.t: "德國開啟瑪格麗特行動"
 GER_operation_panzerfaust_events.05.desc: "元首兌現了他的承諾，宣佈開始瑪格麗特行動，他們為了征服我國而發動入侵。我們必須堅決抗戰！"
 GER_operation_panzerfaust_events.05.a: "讓他們放馬過來"
 #Event for HUN
 GER_operation_panzerfaust_events.06.t: "德國嘗試緩和局勢"
 GER_operation_panzerfaust_events.06.desc: "德國儘管對我們的邊境和主權發出威脅，他們現在卻試圖放棄要求，緩和局勢。"
 GER_operation_panzerfaust_events.06.a: "那就如此吧"
 #Event for GER
 GER_operation_panzerfaust_events.07.t: "鐵拳行動失敗"
 GER_operation_panzerfaust_events.07.desc: "我們原本期望這將是對愈加叛逆的匈牙利的最後一擊，但今日鐵拳行動告敗，我方特工在霍爾蒂住宅外被捕。"
 GER_operation_panzerfaust_events.07.a: "目前，我們還不能控制他們"
 #Event for GER
 GER_operation_panzerfaust_events.08.t: "鐵拳行動成功"
 GER_operation_panzerfaust_events.08.desc: "我們成功逮捕了霍爾蒂和他的兒子，並將權力移交給薩拉希·費倫茨。匈牙利現在將忠於我們的事業。"
 GER_operation_panzerfaust_events.08.a: "非常好"
 #Event for HUN
 GER_operation_panzerfaust_events.09.t: "針對霍爾蒂的陰謀被挫敗"
 GER_operation_panzerfaust_events.09.desc: "今天我們收到消息，德國試圖罷黜並綁架霍爾蒂及其兒子的計劃失敗了，德國特工在霍爾蒂住宅外被捕。"
 GER_operation_panzerfaust_events.09.a: "我們暫時是安全的"
 #Event for HUN
 GER_operation_panzerfaust_events.10.t: "霍爾蒂被綁架"
 GER_operation_panzerfaust_events.10.desc: "今天德國坦克開進城堡山，逮捕了霍爾蒂·米克洛什。據傳他們還扣押了霍爾蒂·米克洛什的兒子並將其帶至奧地利。他們廣播了消息，要求我們投降，否則他們將採取強制手段。"
 GER_operation_panzerfaust_events.10.a: "我們不得不接受他們的條件"
 GER_operation_panzerfaust_events.10.b: "我們永不投降！"
 GOT_GER_fading_eagle.01.t: "[FROM.GetNameDefCap]要求我們的臣服"
 GOT_GER_fading_eagle.01.desc: "[FROM.GetNameDef]的[FROM.GetLeader]要求我們接受他們的統治，企圖在巴爾幹地區及前意大利帝國恢復控制。我們目前確實沒有抵抗的能力，但或許這也是我們等待已久的機會？"
 GOT_GER_fading_eagle.01.a: "暫且允許"
 GOT_GER_fading_eagle.01.b: "我們永遠不會放棄主權！"
 GOT_GER_fading_eagle.02.t: "[FROM.GetNameDefCap]接受我們的要求"
 GOT_GER_fading_eagle.02.desc: "[FROM.GetNameDef]的[FROM.GetLeader]宣佈，[FROM.GetAdjective]民族將向我們臣服，並對我們的事業忠誠到底。"
 GOT_GER_fading_eagle.02.a: "我們正在重新控制局面！"
 GOT_GER_fading_eagle.03.t: "[FROM.GetNameDefCap]拒絕我們的要求"
 GOT_GER_fading_eagle.03.desc: "[FROM.GetNameDef]的[FROM.GetLeader]宣稱他們不會再次接受征服，如果我們想要他們的領土，只能訴諸武力。"
 GOT_GER_fading_eagle.03.a: "他們會後悔自己的決定"
 GOT_GER_fading_eagle.03.b: "我們無法再樹敵了"
