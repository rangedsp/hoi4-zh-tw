 wuw_GER_reichskommissariats.9.t: "伏爾加德意志的地位"
 wuw_GER_reichskommissariats.9.desc: "[ROOT.GetLeader]明確表示希望將伏爾加德意志殖民地變成帝國領土並儘可能將其整合。然而，許多當地政府官員認為，由周邊的地區的官員來治理此地會更明智。這個問題該如何處理？"
 wuw_GER_reichskommissariats.9.a: "它應該變成帝國領土！"
 wuw_GER_reichskommissariats.9.b: "它應當併入莫斯科"
 wuw_GER_reichskommissariats.9.c: "它應當併入突厥斯坦"
 wuw_GER_reichskommissariats.10.t: "南烏拉爾的地位"
 wuw_GER_reichskommissariats.10.desc: "隨著我們佔領具有戰略意義的南烏拉爾，如何處理該地區成為了一個問題。有些計劃提出，將該地區納入莫斯科專員轄區，而有些人建議它可以作為一個獨立的地區，甚至成為突厥斯坦的一部分。我們如何處理？"
 wuw_GER_reichskommissariats.10.a: "它應該成為獨立的專員轄區"
 wuw_GER_reichskommissariats.10.b: "它應當併入莫斯科"
 wuw_GER_reichskommissariats.10.c: "它應當併入突厥斯坦"
 wuw_GER_reichskommissariats.11.t: "東卡累利阿的地位"
