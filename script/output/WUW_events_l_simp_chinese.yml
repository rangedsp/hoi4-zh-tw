l_simp_chinese:
 #News events
 wuw_GER_news.1.t: "德國統一"
 wuw_GER_news.1.d: "經歷了長期的割裂，過去兄弟之間被人為的邊界分隔，如今德國人民終於可以因為一個嶄新的德國國家的崛起而高興了！在近期取得政治上的實績之後，[FROM.GetLeader]儼然繼承了俾斯麥的精神，宣佈德國的統一，這是一個將延續千古的國家！"
 wuw_GER_news.1.a: "德國終於統一了。"
 wuw_GER_news.1.b: "這只是開始。"
 wuw_GER_news.2.t: "西里西亞暴動"
 wuw_GER_news.2.desc: "這是《凡爾賽條約》簽訂以來，德國西里西亞的叛亂分子第四次起義反抗政府。這次，[SIL.GetLeader]領導人聲稱他們的軍事行動目標主要是確保西里西亞的獨立，同時在德國內戰期間保護西里西亞人民免受傷害，儘管之前的叛亂目標是爭取在波蘭國家內的自治。只有時間能證明他們能否抵抗德國軍隊。"
 wuw_GER_news.2.a: "有趣的轉折"
 wuw_GER_news.2.b: "他們之前嘗試過並且失敗了"
 wuw_GER_news.2.c: "這是我們的時刻！"
 wuw_GER_news.2.d: "希望他們這次能成功"
 #Austrian events
 AUS_political_events.1.t: "奧地利聯合信貸銀行的命運"
 AUS_political_events.1.desc: "我們注意到，1934年的銀行合併，重組後的奧地利信貸公司接管了維也納聯合銀行的所有資產和負債，以及下奧地利企業聯盟的可行業務，這件事現在反噬了我們，因為這極大地阻礙了我們的經濟發展，並無意中形成了對金融行業的一種壟斷。既然我們現在正在監管這個行業，我們應該如何處理這種情況？"
 AUS_political_events.1.a: "維持原狀最穩妥。"
 AUS_political_events.1.a_tt: "我們的工業企業不會發生變化。奧地利聯合信貸銀行將繼續可用，給予："
 AUS_political_events.1.b: "奧地利信貸公司是最明智的選擇。"
 AUS_political_events.1.c: "維也納聯合銀行不會讓我們失望的"
 AUS_reestablish_creditanstalt: "奧地利聯合信貸銀行將會解散，新的奧地利信貸公司將得到我們的全力支持。"
 AUS_reestablish_benkverein: "奧地利聯合信貸銀行將會解散，新的維也納聯合銀行將得到我們的全力支持。"
 AUS_political_events.2.t: "鳳凰保險醜聞"
 AUS_political_events.2.desc: "緊隨其受人愛戴的總經理威廉·柏林納去世之後，鳳凰保險公司遇到了進一步的麻煩。新任總經理埃伯哈德·賴寧豪斯向政府提交了偽造的資產負債表，揭露了該公司自1929年起的財務赤字，高達2.5億先令。\n\n該公司已宣佈破產並立即停止運營。極受歡迎的戰爭參與者保險也因此突然終止，引發許多依賴此保險津貼的人士的強烈抗議。"
 AUS_political_events.2.a: "太糟糕了！"
 AUS_political_events.2.b: "我們會承擔付款！"
 AUS_political_events.2.b_tt: "繼續支付保險津貼將使我們有可能重新振興鳳凰保險。"
 AUS_political_events.3.t: "德國軍備重整引發廣泛擔憂"
 AUS_political_events.3.desc: "近期萊茵蘭的重軍備引發了我們民眾的廣泛擔憂。政府內部開始提出疑問：“我們會是下一個嗎？”儘管元首一再保證並不打算吞併奧地利，但我們必須考慮到，這種行動可能不再是完全不可能的。"
 AUS_political_events.3.a: "我們應該做最壞的打算……"
 AUS_political_events.3.a_tt: "解鎖§Y反德奧合併措施§!決議"
 AUS_political_events.4.t: "輿論變化"
 AUS_political_events.4.desc: "此前一直公開支持法西斯主義的紅衣主教西奧多·因尼策最近徹底改變了他的言論。他從公開聲援納粹主義及[GER.GetAdjective]元首，到在10月7日的彌撒中明確反對元首。他不再像往常那樣宣講民眾應該把信仰寄託於[GER.GetLeader]，而是引導他們迴歸主的懷抱。\n\n[GER.GetAdjective]領導層對此非常憤怒，並希望我們採取行動。"
 AUS_political_events.4.a: "讓這個叛徒滾蛋！"
 AUS_political_events.4.b: "因尼策先生有權保持自己的觀點。"
 AUS_political_events.5.t: "[AUS.GetNameDefCap]尋求空軍合作"
 AUS_political_events.5.desc: "我們國內的[AUS.GetAdjective]外交官剛向我們提交了一份提議。他們剛從《聖日耳曼昂萊條約》的約束中解放出來，現在希望重建他們的軍隊，他們向我們保證這是出於防禦目的。他們的國家在製造堅固的飛機框架和培養優秀飛行員方面有著悠久的歷史，但由於生產和訓練的間斷，他們現在面臨重建這些能力的挑戰。如果我們願意放下他們在那次世界大戰中的行為，這次合作可能會為我們帶來好處。"
 AUS_political_events.5.a: "這是值得的，我們將盡可能提供幫助！"
 AUS_political_events.5.b: "我們可以學會合作。"
 AUS_political_events.5.c: "我們不相信他們說的這種“防禦性”謊言。"
 AUS_political_events.6.t: "[FROM.GetNameDefCap]接受我們的提議並允許我們購買裝備。"
 AUS_political_events.6.desc: "[FROM.GetNameDefCap]對我們合作建設空軍並分享經驗的建議做出了積極響應。他們看到了我們擺脫《聖日耳曼昂萊條約》後所面臨的困難，並且還向我們提供了購買他們多餘裝備的可能性！"
 AUS_political_events.6.a: "為偉大的合作乾杯！"
 AUS_political_events.7.t: "[FROM.GetNameDefCap]接受我們的提議"
 AUS_political_events.7.desc: "[FROM.GetNameDefCap]對我們最近合作加強各自空軍力量的建議反應相當積極。雖然他們無法提供任何物質支持，但他們同意分享一些他們最近的飛行員訓練方法。"
 AUS_political_events.7.a: "太好了！"
 AUS_political_events.8.t: "[FROM.GetNameDefCap]拒絕我們的合作提議"
 AUS_political_events.8.desc: "[FROM.GetNameDefCap]拒絕了我們的提議。他們宣稱該協議並不平等，不會給他們帶來任何好處，我們目前的處境全是因為在世界大戰中的行動。"
 AUS_political_events.8.a: "這對他們有什麼好處？"
 AUS_air_force_partnership_big: "空軍廣泛合作"
 AUS_air_force_partnership_small: "空軍合作"
 AUS_rejected_air_force_partnership: "拒絕空軍合作"
 AUS_political_events.9.t: "威廉·策納被暗殺"
 AUS_political_events.9.desc: "我軍高層之一的威廉·澤納被發現死在自己的公寓裡。[GER.GetAdjective]外交官否認一切，聲稱澤納一定是飲彈自盡的，此事與他們毫無干係。但刑事調查卻與之相反……"
 AUS_political_events.9.a: "所以[GER.GetAdjective]人既是騙子又是殺人犯……"
 AUS_political_events.9.a_tt: "§Y威廉·澤納§!§R被殺！§!"
 AUS_anschluss_ratio_lowered: "§Y德奧合併§!所需的§Y陸軍總戰鬥力§!將§Y降低§!"
 AUS_anschluss_ratio_raised: "§Y德奧合併§!所需的§Y陸軍總戰鬥力§!將§Y提高§!"
 AUS_political_events.10.t: "刺殺威廉·澤納的企圖被挫敗了"
 AUS_political_events.10.desc: "昨天晚上，蓋世太保闖入了威廉·澤納的公寓，遇見了我們在最高統帥部周圍佈置的警衛。爭吵沒有持續很長時間，澤納完全沒有受傷。"
 AUS_political_events.10.a: "我們早就知道會這樣！"
 AUS_political_events.11.t: "[GER.GetNameDefCap]表示對我們軍隊統帥部的厭惡"
 AUS_political_events.11.desc: "[GER.GetNameDef]的外交官對我們的一位軍事高層表示了擔憂。他們聲稱，儘管我們當然是一個主權國家並且可以隨意行動，但這可能會導致我們與[GER.GetNameDef]的外交關係出現問題。\n\n如果我們未能按照他們的最佳利益行事，我們可以預料他們將親自採取行動。"
 AUS_political_events.11.a: "這幹他們什麼事！"
 AUS_political_events.11.a_tt: "觸發任務：§Y[GER.GetAdjective]對軍事高層的敵意§!\n\n未能防止澤納的死亡將導致§Y德奧合併§!所需的§Y陸軍總戰鬥力§!§Y降低§!。"
 AUS_political_events.11.b: "如果這能阻止他們的滑稽行為的話……"
 AUS_political_events.12.t: "[FROM.GetNameDefCap]提供步兵裝備"
 AUS_political_events.12.desc: "[FROM.GetNameDefCap]已經向我們伸出援手，為我們提供步兵裝備。他們把我們視為最寶貴的盟友，並希望這些步槍用於我們在[ETH.GetNameDef]的戰爭，以確保我們在這場戰爭中取得勝利。"
 AUS_political_events.12.a: "結果出乎意料，但我們很歡迎這一結果。"
 AUS_political_events.13.t: "[FROM.GetNameDefCap]反對禁運[ITA.GetNameDef]"
 AUS_political_events.13.desc: "我們和許多其他國家一樣，對[ITA.GetNameDef]實施禁運，我們因此收到了抗議。[AUS.GetAdjective]領導層聲稱禁運是不合理和無根據的，並要求我們廢除禁運措施。\n\n我們追問他們抗議禁運的理由時，[FROM.GetNameDef]的領導層拒絕進一步說明。"
 AUS_political_events.13.a: "[AUS.GetAdjective]人無權提出這樣的要求。"
 AUS_political_events.13.b: "行吧"
 AUS_political_events.14.t: "[FROM.GetNameDefCap]公開反對針對我們實施的禁運"
 AUS_political_events.14.desc: "[FROM.GetNameDefCap]最近抗議針對我們的禁運。他們聲稱我們是最有價值的盟友，並積極向所有對我們實施禁運的國家發出反對意見，試圖為我們稍微緩解局勢。"
 AUS_political_events.14.a: "[FROM.GetAdjective]人的大膽之舉"
 AUS_political_events.15.t: "[FROM.GetNameDefCap]取締德意志國家社會主義工人黨"
 AUS_political_events.15.desc: "我們剛剛得到消息，[FROM.GetAdjective]政府剛剛發佈了一項禁令，取締了[FROM.GetNameDef]境內的德意志國家社會主義工人黨。儘管當局在1934年已經發布了一些軟禁令，但該禁令在很大程度上被政黨和政府所忽視。如今的局面標誌著[FROM.GetAdjective]領導層對我們的態度發生了巨大轉變。\n\n除了顯而易見的侮辱之外，這也限制了我們對[FROM.GetNameDef]的影響力。"
 AUS_political_events.15.a: "他們不會輕易擺脫我們的！"
 AUS_political_events.15.b: "真是無禮！"
 AUS_political_events.15.c: "我們現在沒時間！"
 AUS_banned_dnsap: "取締德意志國家社會主義工人黨"
 AUS_meddling_with_our_politics: "干涉我們的政治"
 AUS_political_events.16.t: "納粹進入政府"
 AUS_political_events.16.desc: "正如預期的那樣，[FROM.GetNameDef]對我們最近的德意志國家社會主義工人黨禁令反應強烈。除了明顯要求我們立即取消禁令外，他們還要求我們任命阿圖爾·賽斯-英夸特為顧問。他們對此非常堅決，雖然我們一直知道他非常欣賞[FROM.GetAdjective]的方式，但這確實引發了一個問題，為什麼？"
 AUS_political_events.16.a: "我們得密切監視他。"
 AUS_political_events.16.b: "絕對不行！"
 AUS_political_events.16.a_tt: "安插§Y阿圖爾·賽斯-英夸特§!作為顧問，§R不能被解僱§!\n"
 AUS_political_events.17.t: "[FROM.GetNameDefCap]抗議我們取締德意志國家社會主義工人黨"
 AUS_political_events.17.desc: "正如預期的那樣，[FROM.GetNameDef]對我們最近的德意志國家社會主義工人黨禁令反應不佳。他們將這視為對自己意識形態的攻擊，並對我們的決定表達了極大的失望和憤怒。儘管我們有充分的理由禁止德意志國家社會主義工人黨，但[FROM.GetAdjective]領導層現在要求我們立即取消禁令。"
 AUS_political_events.17.a: "他們無權干涉我們的政治。"
 AUS_political_events.18.t: "[FROM.GetNameDefCap]安插阿圖爾·賽斯-英夸特作為顧問"
 AUS_political_events.18.desc: "看來[FROM.GetAdjective]終於明白了道理。我們在[FROM.GetNameDef]的姊妹黨的禁令仍然有效，但他們至少任命了阿圖爾·賽斯-英夸特為顧問，讓我們對他們的政治操作有了一些瞭解。"
 AUS_political_events.18.a: "很好"
 AUS_political_events.19.t: "戈德溫·馮·布魯莫夫斯基提供服務"
 AUS_political_events.19.desc: "我們在上次世界大戰中最成功的王牌飛行員在我們陷入戰爭時再次服役。儘管他已不再年輕，也無法再像曾經那樣飛行，但他提出要從地面上引領我們的空軍走向勝利。我們目前的飛行員仍十分尊重他，人們普遍認為他將能夠進一步訓練我們的飛行員，使其達到與他自己相媲美的高超水平。"
 AUS_political_events.19.a: "我們需要一切能得到的幫助！"
 AUS_political_events.19.b: "他參與了1934年的政變，我們不能冒這個險。"
 AUS_von_brumowski_recruited_flag: "招募戈德溫·馮·布魯莫夫斯基"
 AUS_political_events.20.t: "[FROM.GetNameDefCap]尋求我們的支持"
 AUS_political_events.20.desc: "[GetGuarantorFlavorText]"
 AUS_guarantor_is_italy_key: "[FROM.GetNameDefCap]派遣了將軍兼常務軍事聯絡官埃米爾·利比茨基向我們尋求援助。他和[FROM.GetAdjective]領導層的其他人已經看到了[GER.GetNameDef]的一些令人擔憂的傾向，他們現在希望我們在他們對形勢的評估確實正確的情況下，提供更正式的支持。\n\n作為《聖日耳曼昂萊條約》的簽署方，我們可能被期望來援助他們，儘管在條約文本中可能找到一些漏洞。"
 AUS_guarantor_is_not_italy_key: "[FROM.GetNameDefCap]已派遣大使向我們請求援助。[FROM.GetAdjective]領導層注意到[GER.GetNameDef]領導層的令人擔憂的傾向，由於《聖日耳曼昂萊條約》的限制，他們無法動員應對威脅，現在他們正正式請求我們的支持。根據條約和後續協議，我們同意幫助他們，但具體支持方式並未明確。"
 AUS_political_events.20.a: "他們的獨立對我們來說至關重要！"
 AUS_political_events.20.b: "我們將在外交上支持他們"
 AUS_political_events.20.c: "也許我們可以達成一項互惠互利的協議。"
 AUS_political_events.20.d: "我們不會為他們冒任何風險"
 AUS_political_events.21.t: "[FROM.GetNameDefCap]保障我國獨立"
 AUS_political_events.21.desc: "根據《聖日耳曼昂萊條約》的規定，[FROM.GetNameDef]已同意保障我們的獨立。為了保險起見，他們還允許我們獲取一些裝備，因為我們目前還無法自行生產裝備。"
 AUS_political_events.21.a: "好極了！"
 AUS_political_events.22.t: "[FROM.GetNameDefCap]在外交上支持我們的獨立"
 AUS_political_events.22.desc: "[FROM.GetNameDef]利用一些鮮為人知的條款和細則，決定不提供保障，而只是在入侵事件中提供外交支持。他們聲稱相信他們的話語能像干預威脅一樣有效地說服[GER.GetLeader]，因此看不到為我們備戰的理由。"
 AUS_political_events.22.a: "這不是我們想要的，但總比沒有好。"
 AUS_political_events.22.b: "外交和裝備救不了我們！"
 AUS_political_events.23.t: "[FROM.GetNameDefCap]有條件地提供保證"
 AUS_political_events.23.desc: "[FROM.GetNameDefCap]對我們的援助請求作出了自己的請求。自從這項條約被強加給我們以來，我們一直努力奪回上阿迪傑和特倫蒂諾，因為這些地區確實屬於我們。[FROM.GetNameDef]視這些土地為他們的領土，如果他們要保障我們的獨立，他們希望我們徹底放棄這些領土要求。"
 AUS_political_events.23.a: "我們眼前的安全比那些宣稱更重要"
 AUS_political_events.23.b: "他們想從我們的困境中獲利，絕對不行。"
 AUS_political_events.24.t: "[FROM.GetNameDefCap]拒絕我國援助請求"
 AUS_political_events.24.desc: "通過利用《聖日耳曼昂萊條約》中的一系列邊緣案例、細節和不起眼的條款，[FROM.GetNameDef]設法逃避了對我們的支持。文件中明確規定，為了不被允許擁有足夠的軍隊，我們應該得到外部幫助，但現在看來[FROM.GetNameDef]決定這不適用於他們。我們只能靠自己了。"
 AUS_political_events.24.a: "我們向其他各方指出了這個確切的缺陷……"
 AUS_political_events.24.b: "我們會給他們一些獎勵！"
 AUS_political_events.25.t: "[FROM.GetNameDefCap]撤銷對我們領土的宣稱"
 AUS_political_events.25.desc: "[FROM.GetNameDefCap]對我們要求他們撤銷對我們領土的主張做出了回應，他們屈服於這些要求。他們完全放棄了佔領這些領土的想法，以換取我們的支持。"
 AUS_political_events.25.a: "真是個好消息！"
 AUS_political_events.26.t: "[FROM.GetNameDefCap]拒絕撤回他們的宣稱"
 AUS_political_events.26.desc: "我們曾認為[FROM.GetAdjective]是一個理性的國家，畢竟他們最近向我們尋求幫助。事實證明，我們錯了。當我們要求他們撤銷對我們合法領土的主張時，他們公然拒絕了。"
 AUS_political_events.26.a: "這對他們絕對沒有好處。"
 AUS_political_events.27.t: "[AUS.GetNameDefCap]尋求重整軍備"
 AUS_political_events.27.desc: "[AUS.GetNameDefCap]已向我們尋求軍備重整並廢除《聖日耳曼昂萊條約》的批准。他們表示，最近他們的鄰近地區變得更加敵對，他們感到沒有自己的軍隊就不再安全。這個問題已經提交給了簽署該條約的三個主要大國[ITA.GetNameDef]、[ENG.GetNameDef]和[FRA.GetNameDef]，另外還包括[USA.GetNameDef]，根據該條約，我們中的任何一方都可以選擇否決。"
 AUS_political_events.27.a: "他們不會造成任何傷害。"
 AUS_political_events.27.b: "絕對不行。"
 AUS_political_events.28.t: "擔保國同意軍備重整"
 AUS_political_events.28.desc: "我們終於收到了擔保國的回應，這值得等待。經過他們之間的多次討論和談判，他們同意我們可以軍備重整，並宣佈《聖日耳曼昂萊條約》已過時。我們不再受我們先輩行為的束縛。"
 AUS_political_events.28.a: "好極了！"
 AUS_political_events.29.t: "擔保國拒絕軍備重整的申請"
 AUS_political_events.29.desc: "經過長時間的討論和多次辯論，擔保國決定不批准我們重新武裝的請求。我們試圖與他們理性交流，但儘管我們的主權和獨立顯然面臨風險，他們的回答仍然堅定。"
 AUS_political_events.29.a: "我們別無選擇……"
 AUS_political_events.29.a_tt: "§R選擇此項將永久廢除《聖日耳曼昂萊條約》，但可能會有後果§!"
 AUS_political_events.29.b: "我們必須好好談談！"
 AUS_political_events.29.c: "他們讓我們陷入失敗，但我們能怎麼辦？"
 AUS_political_events.29.c_tt: "§R選擇此項將使《聖日耳曼昂萊條約》生效至1940年7月16日§!"
 AUS_political_events.30.t: "[AUS.GetNameDefCap]違反《聖日耳曼昂萊條約》"
 AUS_political_events.30.desc: "[GetTreatyStatus]"
 AUS_treaty_asked_permission_key: "儘管我們竭盡全力阻止，[AUS.GetAdjective]政府還是決定命令[AUS.GetNameDef]軍備重整，這明顯違反了條約。我們希望事情不至於走到這一步，但似乎無法阻止他們走上這條路。"
 AUS_treaty_no_permission_key: "在沒有任何預警的情況下，我們被告知[AUS.GetNameDef]將不再遵守聖日耳曼條約及其相關內容。最重要的是，這意味著他們將自由重整軍備，不再考慮那次世界大戰後對他們施加的限制。他們為什麼突然想要重整軍備，目前尚不清楚。"
 AUS_political_events.30.a: "我們無法阻止他們，但我們可以減緩他們的步伐"
 AUS_political_events.30.b: "好吧，隨他們去吧。"
 AUS_political_events.30.c: "不再為他們提供擔保了！"
 AUS_broke_the_treaty: "破壞了我們的條約"
 AUS_broke_the_treaty_democratic: "破壞了我們的條約"
 AUS_political_events.31.t: "[FROM.GetNameDefCap]為他們的援助尋求補償"
 AUS_political_events.31.desc: "在內戰塵埃落定後，[FROM.GetAdjective]與我們聯繫，討論了他們在內戰中所做努力的補償問題。他們尋求某種形式的補償，以彌補他們的工作、損失的人員以及由志願兵使用和損壞的槍支。"
 AUS_political_events.31.a: "我們將在工業上提供幫助。"
 AUS_political_events.31.b: "他們可以拿走一些我們繳獲的裝備"
 AUS_political_events.31.c: "他們的支持微不足道"
 AUS_political_events.32.t: "[FROM.GetNameDefCap]援建一座新工廠"
 AUS_political_events.32.desc: "我們的補償請求已被[FROM.GetAdjective]民族主義者聽到，作為感謝我們，他們借給了我們工人和材料在下奧地利建立了一家新工廠。這將幫助我們替換丟失的設備，未來也會非常有幫助。"
 AUS_political_events.32.a: "太好了！"
 AUS_political_events.33.t: "[FROM.GetNameDefCap]提供繳獲的裝備"
 AUS_political_events.33.desc: "我們向[SPA.GetAdjective]人提出的賠償請求得到了回應，作為感謝，他們送給我們一些他們在內戰中從對手那裡繳獲的裝備，以補償我們在援助他們時損失的一些設備。"
 AUS_political_events.33.a: "太好了！"
 AUS_political_events.34.t: "[FROM.GetNameDefCap]拒絕補償我們"
 AUS_political_events.34.desc: "在[SPA.GetAdjective]內戰中援助他們之後，我們最起碼期望的是某種形式的補償和感激之情，但看來我們期望得太多了。[SPA.GetNameDef]的領導聲稱我們的援助無關緊要，拒絕了我們應得到任何形式的補償的想法。"
 AUS_political_events.34.a: "真是無禮……"
 AUS_political_events.35.t: "準軍事活動造成國內動亂"
 AUS_political_events.35.desc: "我們最近與[GetMilitiaName]的合作產生了一些麻煩的副作用。由於國家領導層已經合法化了該組織，[GetMilitiaName]在針對平民人口的行動中變得更加大膽。\n\n我們的人民不再完全放心該組織的運作方式，國內的動盪加劇了。人們開始質疑我們的領導層是否真正控制了[GetMilitiaName]，以及這一決定是否真的有助於保障國家的安全。"
 AUS_political_events.35.a: "[GetMilitiaName]已有過機會了。"
 AUS_political_events.35.b: "人民只需適應。"
 AUS_political_events.35.c: "這將是新的[ROOT.GetName]！"
 AUS_political_events.36.t: "[ROOT.GetNameDef]的未來"
 AUS_political_events.36.desc: "我們從一個嚴重削弱的小國迴歸的旅程是漫長而艱苦的。回顧我們的起點使這一旅程的價值變得非常明顯。重生，並比以前更強大，現在是時候讓我們決定我們的未來，以及我們希望如何被認識了。"
 AUS_political_events.36.a: "在適當的時候，我們將被稱為[GetGrossosterreichCosmeticIdeology]"
 AUS_grossosterreich_fascism_key: "大奧地利"
 AUS_grossosterreich_neutrality_key: "大奧地利帝國"
 AUS_political_events.36.a_tt: "§Y解鎖決議§!逐步§Y整合德國核心§!。"
 AUS_political_events.36.b: "我們將被稱為南德意志"
 AUS_political_events.36.c: "我們本來就很完美"
 AUS_political_events.37.t: "來自[FROM.GetNameDef]的最後通牒"
 AUS_political_events.37.desc: "[GetIntegrationEventTarget]"
 AUS_integration_target_is_poland_key: "[FROM.GetAdjective]政府已傳達給我們一則嚴厲的信息。他們要求我們將[Get37PuppetOrNotDesc]移交給他們，並警告我們如果試圖抵抗可能造成後果。\n\n在對其他鄰國提出一系列類似要求後，[FROM.GetNameDef]發生這種侵略行為並非完全出乎意料。"
 AUS_integration_target_is_not_poland_key: "[FROM.GetAdjective]政府已經向我們發出了最後通牒。要麼自願交出[Get37PuppetOrNotDesc]，自願融入他們，要麼在戰場上面對他們重新建立的戰爭機器的威力。無論我們在這個問題上選擇哪條道路，似乎都無法避免後果。"
 AUS_political_events.37.a: "我們不會向他們屈服！"
 AUS_political_events.37.b: "我們無法對抗他們"
 AUS_political_events.37_tt: "我們會將他們聲索的領土移交給他們。"
 37DescIsPuppet: "[FROM.FROM.OWNER.GetNameDef]"
 37DescIsNotPuppet: "曾經屬於他們的地區"
 AUS_political_events.38.t: "[FROM.GetNameDefCap]拒絕我們的要求"
 AUS_political_events.38.desc: "我們曾希望給[FROM.GetAdjective]一個機會，[Get38PuppetOrNotDesc]，融入我們的社會，但看來我們最慷慨的提議未被接受。最終，我們非常清楚[FROM.GetNameDef]在我們的領導下會有更好的發展。"
 AUS_political_events.38.a: "不管他們想要什麼，他們都會加入我們。"
 AUS_political_events.38_tt: "對§Y[FROM.FROM.OWNER.GetNameWithFlag]§!發起§Y奪取聲索地區§!的戰爭目標"
 38DescIsPuppet: "交出[FROM.FROM.OWNER.GetName]並任由它被整合"
 38DescIsNotPuppet: "和平接受整合"
 AUS_political_events.39.t: "[FROM.GetNameDefCap]屈服了"
 AUS_political_events.39.desc: "[FROM.GetAdjective]領導層的回應非常受歡迎。他們將放下武器，在我們接管本屬於我們的領土時，他們不會進行反抗。顯然，他們已經明白了，任由這些問題而讓國家陷入毫無意義的戰爭，是沒有價值的。"
 AUS_political_events.39.a: "歡迎加入[ROOT.GetNameDef]！"
 AUS_political_events.40.t: "[FROM.GetNameDefCap]尋求加入[ROOT.GetFactionName]"
 AUS_political_events.40.desc: "[FROM.GetNameDefCap]已經聯繫我們，請求加入我們的陣營。他們已開始軍事化努力，並表示希望共同努力使我們雙方都變得更強大。從歷史上看，這個國家一直是戰場上不容小覷的力量，儘管他們現在已經被削弱，但他們仍然堅信他們將是我們最有用的盟友。"
 AUS_political_events.40.a: "我們非常歡迎他們的加入"
 AUS_political_events.40.b: "我們並不需要他們。"
 AUS_political_events.41.t: "[FROM.GetNameDefCap]同意我們加入[FROM.GetFactionName]"
 AUS_political_events.41.desc: "[FROM.GetNameDefCap]對我們的加入請求表現出熱情，並歡迎我們加入該陣營。我們不再孤軍奮戰對抗那些威脅我們的人！"
 AUS_political_events.41.a: "團結使我們強大！"
 AUS_political_events.42.t: "[FROM.GetNameDefCap]拒絕我們加入[FROM.GetFactionName]"
 AUS_political_events.42.desc: "我們加入[FROM.GetFactionName]的申請被冷漠地拒絕了。我們試圖爭取表明我們的用處，但[FROM.GetNameDef]已經下定決心。雖然這很煩人，但我們不會因此氣餒，而是會尋找其他解決方案。"
 AUS_political_events.42.a: "我們會向他們證明"
 AUS_political_events.43.t: "[FROM.GetNameDefCap]要求[Get43PuppetOrNotTitle]"
 43TitleIsPuppet: "我們交出我們的附屬國"
 43TitleIsNotPuppet: "我國臣服"
 AUS_political_events.43.desc: "今早我們收到了來自[FROM.GetNameDef]的強硬要求，要我們立即[Get43PuppetOrNotDesc]。要求中隱含的侵略威脅似乎表明，如果我們拒絕這一提議，敵對行動可能會隨之而來。"
 43DescIsPuppet: "交出[FROM.FROM.OWNER.GetNameDef]的控制權"
 43DescIsNotPuppet: "服從他們的要求，成為他們治下的附屬國"
 AUS_political_events.43.a: "我們根本無力反擊"
 AUS_political_events.43.a.tt: "§Y[Get43PuppetOrNotTt]§!可能會被迫加入[FROM.GetAdjective]的陣營"
 AUS_political_events.43.b: "從我們的屍體上踏過去吧"
 AUS_political_events.43.c: "我們從未是他們的附屬，但他們可以奪回曾經所擁有的地區。"
 43TtIsPuppet: "[FROM.FROM.OWNER.GetNameDefCap]"
 43TtIsNotPuppet: "[ROOT.GetNameDefCap]"
 AUS_political_events.44.t: "[FROM.GetNameDefCap]屈從於我們的要求"
 AUS_political_events.44.desc: "我們對[FROM.GetNameDef]提出的要求得到了非常積極的回應。他們將立即讓[Get44PuppetOrNotDesc]服從我們的統治，成為我們的附屬。這標誌著我們在重建帝國的努力中取得了巨大的成功！"
 AUS_political_events.44.a: "太棒了！"
 44DescIsPuppet: "[FROM.FROM.OWNER.GetNameDef]"
 44DescIsNotPuppet: "他們自己"
 AUS_political_events.45.t: "[FROM.GetNameDefCap]拒絕我們的要求"
 AUS_political_events.45.desc: "[FROM.GetNameDef]表現出明顯的不尊重和對自身安全的無視，決定拒絕我們的提議。這筆交易本可以對雙方都有利，但他們似乎不認同我們關於這一點的看法。"
 AUS_political_events.45.a: "那我們就為此而戰吧！"
 AUS_political_events.46.t: "[FROM.GetNameDefCap]移交多個地區以免遭附庸"
 AUS_political_events.46.desc: "為了避免被征服和削弱獨立性，[FROM.GetAdjective]領導層採取了極端措施。他們選擇將曾經由我們控制的地區移交給我們，而不是成為我們的附屬國。這不是我們對他們要求的預期結果，我們現在必須決定是否接受。"
 AUS_political_events.46.a: "更好了！"
 AUS_political_events.46.b: "不。我們希望他們在我們的控制之下！"
 AUS_political_events.47.t: "[FROM.GetNameDefCap]拒絕我方提議"
 AUS_political_events.47.desc: "儘管我們盡力安撫[FROM.GetAdjective]，他們似乎堅決認為這件事的唯一可接受的結果是我們屈服於他們的要求，讓他們在我國扶植傀儡政權。他們強調，我們要麼支持他們，要麼反對他們，沒有妥協的餘地。"
 AUS_political_events.47.a: "我們不會被這樣的威脅嚇倒！"
 AUS_political_events.47.b: "值得一試。"
 AUS_political_events.48.t: "[FROM.GetNameDefCap]在我國扶植了哈布斯堡君主"
 AUS_political_events.48.desc: "鑑於[FROM.GetNameDef]的歷史，作為我們的宗主國，他們遲早會干涉我們的內政。我們已被告知，他們已將[ROOT.GetLeader]扶植為我們國家的領導人。"
 AUS_political_events.48.a: "就像哈布斯堡家族那樣……"
 AUS_political_events.49.t: "[FROM.GetNameDefCap]請求移交西里西亞"
 AUS_political_events.49.desc: "隨著緊張局勢的升級，我們的世界正在發生變化。今天，我們收到了一份通信，[FROM.GetAdjective]政府請求我們將西里西亞移交給他們。西里西亞歷史上是他們帝國的一部分，但在那次世界大戰結束後直至現在，都歸我們控制。\n\n[FROM.GetNameDefCap]提出以幾家工廠作為交換，希望我們將下西里西亞和上西里西亞移交給他們，希望這能便於我們的決策。"
 AUS_political_events.49.a: "好吧，他們可以擁有這些地區。"
 AUS_political_events.49.b: "我們的領土價值遠不止這些！"
 AUS_political_events.50.t: "[FROM.GetNameDefCap]交出西里西亞"
 AUS_political_events.50.desc: "我們收到了[FROM.GetAdjective]關於我們希望為他們獲取西里西亞的請求的回覆。他們慷慨地同意了這筆交易，並將立即轉移這些地區給我們。作為回報，我們在他們選擇的地區建立了幾家工廠，"
 AUS_political_events.50.a: "公平的交易！"
 AUS_political_events.51.t: "[FROM.GetNameDefCap]拒絕交出西里西亞"
 AUS_political_events.51.desc: "來自[FROM.GetAdjective]外交官的通訊並非我們所希望聽到的。[FROM.GetNameDef]不僅拒絕了交易，而且他們的態度可以說是貶低和輕蔑的，質疑為什麼他們應該同意做這樣的事，以及為什麼我們覺得我們有權要求任何東西。"
 AUS_political_events.51.a: "他們會後悔說這些話的！"
 AUS_political_events.52.t: "[FROM.GetNameDefCap]要求我們合併！"
 AUS_political_events.52.desc: "基於歷史悠久的主張和家族關係，[FROM.GetAdjective]君主[FROM.GetLeader]要求我們服從他的統治。他聲稱哈布斯堡市作為他家族的老領地，理所當然屬於他的國家，他要求我們立即整合，否則面對他新重建的軍隊的怒火。"
 AUS_political_events.52.a: "我們別無選擇，只能服從"
 AUS_political_events.52.b: "哈布斯堡家族對哈布斯堡沒有權利！"
 AUS_political_events.53.t: "[FROM.GetNameDefCap]和平整合"
 AUS_political_events.53.desc: "我們收到消息，[FROM.GetAdjective]不會抵抗對他們國家的吞併，而是和平地整合到我們光榮的[ROOT.GetName]中。我們終於重新獲得了我們的老家鄉——哈布斯堡村的控制權和所有權。"
 AUS_political_events.53.a: "終於！"
 AUS_political_events.54.t: "[FROM.GetNameDefCap]拒絕我們對哈布斯堡的合法要求"
 AUS_political_events.54.desc: "我們已經收到了[FROM.GetAdjective]領導層的回應，他們不會屈服於我們的要求。通過無視我們對哈布斯堡市的家族宣稱，他們否認了我們對這片土地的合法所有權，這對我們的榮譽是一種汙點。這是不可容忍的！"
 AUS_political_events.54.a: "為了哈布斯堡！"
 AUS_political_events.55.t: "[FROM.GetNameDefCap]想就[39.GetName]和[850.GetName]的所有權達成協議"
 AUS_political_events.55.desc: "[FROM.GetAdjective]領導層已經向我們提出了一個提議。很久以前他們就希望從我們這裡獲取[39.GetName]和[850.GetName]。他們提出如果我們將這些地區實際出售給他們，他們就會提供一些工廠作為回報。"
 AUS_political_events.55.a: "公平的交易。"
 AUS_political_events.55.b: "我國的領土是無價的！"
 AUS_political_events.56.t: "[GetHostilityItalianClaimTitle56]"
 AUS_seeks_a_deal_title_56: "[FROM.GetNameDefCap]為工業投資交出這些地區"
 AUS_makes_demands_title_56: "[FROM.GetNameDefCap]交出領土"
 AUS_political_events.56.desc: "[GetHostilityItalianClaimDesc56]"
 AUS_seeks_a_deal_desc_56: "我們與[FROM.GetNameDef]的提議已經獲得批准。作為對大規模工業投資的回報，[FROM.GetAdjective]已同意按照我們的要求交出[39.GetName]和[850.GetName]。"
 AUS_makes_demands_desc_56: "我們對[FROM.GetNameDef]的要求已獲批准。[FROM.GetAdjective]將立即將[39.GetName]和[850.GetName]交給我們，這兩個地區終將再次歸我們所有！"
 AUS_political_events.56.a: "喜訊"
 AUS_political_events.57.t: "[GetHostilityItalianClaimTitle57]"
 AUS_seeks_a_deal_title_57: "[FROM.GetNameDefCap]拒絕我們提出的交易"
 AUS_makes_demands_title_57: "[FROM.GetNameDefCap]拒絕我們的要求"
 AUS_political_events.57.desc: "[GetHostilityItalianClaimDesc57]"
 AUS_seeks_a_deal_desc_57: "來自[FROM.GetADjective]的回應已經到達，他們不同意這筆交易。他們聲明他們的土地不出售，並堅決拒絕就有關地區的任何交易或任何形式的協議。"
 AUS_makes_demands_desc_57: "我們向[FROM.GetAdjective]領導層提出的要求沒有得到好的接受。他們拒絕了我們的要求，使我們沒有任何進一步施壓或再次嘗試提出此類要求的餘地。"
 AUS_political_events.57.a: "值得一試"
 AUS_political_events.58.t: "[FROM.GetNameDefCap]索取[39.GetName]和[850.GetName]的所有權"
 AUS_political_events.58.desc: "[FROM.GetNameDefCap]已經向我們發出了似乎是威脅的通信。他們用不友好的言辭告知我們，他們希望擁有[39.GetName]和[850.GetName]，他們聲稱這些是他們的合法領土。這些地區曾經是[FROM.GetAdjective]的心臟地帶，但自那次世界大戰以來一直屬於我們。"
 AUS_political_events.58.a: "行吧"
 AUS_political_events.58.b: "絕對不行！"
 AUS_political_events.59.t: "[FROM.GetNameDefCap]支持阿爾弗雷德·揚薩的計劃"
 AUS_political_events.59.desc: "[FROM.GetNameDef]再次信任阿爾弗雷德·揚薩這位明顯帶有反[ROOT.GetAdjective]觀點的元帥。他計劃加固我們的邊界，並制定了一套針對我們攻擊的應對計劃，這位元帥之前就給我們帶來了麻煩，看來將來也會如此。"
 AUS_political_events.59.a: "他必須離開！"
 AUS_political_events.59.b: "這是他們的決定"
 AUS_political_events.60.t: "[FROM.GetNameDefCap]反對阿爾弗雷德·揚薩的防禦計劃"
 AUS_political_events.60.desc: "[FROM.GetNameDef]對我們最近對阿爾弗雷德·揚薩的防禦計劃的承諾提出了正式投訴。他們聲稱這一行動顯然是出於對他們的敵意，並且將阻礙我們未來的外交關係。我們不確定為何這會引起如此激烈的反應。"
 AUS_political_events.60.a: "好吧，那我們選擇弗朗茨·勃姆"
 AUS_political_events.60.a_tt: "§Y弗朗茨·伯梅§!將§G可擔任§!陸軍部長。\n\n§Y阿爾弗雷德·揚薩§!將§R不再可擔任§!陸軍部長。"
 AUS_political_events.60.b: "這更加說明阿爾弗雷德·揚薩需要留下來！"
 AUS_political_events.60.b_tt: "§Y阿爾弗雷德·揚薩§!將繼續可用為陸軍部長"
 AUS_political_events.61.t: "[FROM.GetNameDefCap]取代了阿爾弗雷德·揚薩"
 AUS_political_events.61.desc: "我們對[FROM.GetAdjective]立即替換阿爾弗雷德·揚薩及其愚蠢的防禦計劃的壓力已經奏效。現在，[FROM.GetAdjective]已經選用了更加令人滿意的弗朗茨·勃姆，取代了非常反[ROOT.GetAdjective]的揚薩。"
 AUS_political_events.61.a: "好極了！"
 AUS_political_events.62.t: "[FROM.GetNameDefCap]保留了阿爾弗雷德·揚薩的職位"
 AUS_political_events.62.desc: "儘管我們要求[FROM.GetNameDef]不要執行所謂的揚薩計劃，並確保這個人不持有任何權力或影響力，[FROM.GetAdjective]拒絕聽從我們的要求。我們只能認為這是我們未來關係的不祥之兆。"
 AUS_political_events.62.a: "他們怎麼敢的？"
 AUS_political_events.63.t: "流亡[AUS.GetAdjective]人為我們效勞"
 AUS_political_events.63.desc: "[AUS.GetNameDef]被合併使許多反對這一事態的[AUS.GetAdjective]人被驅逐出他們以前的家園。一些這樣的持不同政見者現在已經到達[ROOT.GetNameDef]，並在工廠、街頭和前線效勞。"
 AUS_political_events.63.a: "我們無法確保他們的忠誠"
 AUS_political_events.63.b: "我們能用得上他們的幫助"
 AUS_political_events.64.t: "[FROM.GetNameDefCap]提議工業支持"
 AUS_political_events.64.desc: "似乎沒有什麼特別的原因，[FROM.GetAdjective]向我們提議，由他們幫忙進一步提升我們的工業。他們願意承擔我們的部分民用消費品生產，讓我們進一步專注於工廠建設。"
 AUS_political_events.64.a: "意外之喜！"
 AUS_industrial_help: "工業支持"
 AUS_political_events.65.t: "[FROM.GetNameDefCap]提議市場支持"
 AUS_political_events.65.desc: "似乎沒有什麼特別的原因，[FROM.GetAdjective]向我們提議，給予我們國際市場的裝備折扣。目前還不清楚這是讓我們更多購買他們裝備的策略，還是真誠的提議。"
 AUS_political_events.65.a: "不管怎樣，這很有用！"
 AUS_market_help: "市場支持"
 AUS_political_events.66.t: "[FROM.Get.GetNameDefCap]提議聯邦"
 AUS_political_events.66.desc: "[FROM.GetNameDef]的[FROM.GetLeader]向我們提出了他所謂的提議。隨著聯邦的不斷壯大，確保所有參與國家無一例外地共同努力變得越來越重要。為了簡化這一過程，[FROM.GetLeader]建議我們全部統一到他們的領導下。\n\n我們將對我們的主權作出讓步，但作為一個聯邦國家的一部分，我們也將享受到更強大軍隊和更強大的外交力量帶來的安全。"
 AUS_political_events.66.a: "聽起來是個公平的交易"
 AUS_political_events.66.b: "這對我們一點好處都沒有！"
 AUS_political_events.67.t: "[FROM.GetNameDefCap]接受聯邦統一聯盟"
 AUS_political_events.67.desc: "[FROM.GetNameDef]接受成為我們新聯邦國家的一部分的喜訊剛剛傳來。我們所能提供的顯然足以讓他們認為這個提議是有利的，儘管他們的主權受到了輕微的打擊。"
 AUS_political_events.67.a: "太好了！"
 AUS_political_events.68.t: "[FROM.GetNameDefCap]拒絕加入聯邦統一聯盟"
 AUS_political_events.68.desc: "儘管這顯然對聯邦有利，而且明顯是最好的選擇，[FROM.GetNameDef]還是拒絕了我們關於更緊密聯合的提議。人們只能推測他們的原因，但看起來他們可能沒有將聯邦的最佳利益放在心上。"
 AUS_political_events.68.a: "他們對聯盟的團結構成威脅！"
 AUS_political_events.68.b: "我們將密切關注他們"
 AUS_political_events.69.t: "德奧合併風險得到緩解"
 AUS_political_events.69.desc: "[GetHowAvoidedAnschluss]"
 AUS_joined_faction: "我們現在是[ROOT.GetFactionName]的一員，[GER.GetLeader]似乎已決定不試圖將我們整合進[GER.GetNameDef]。\n\n我們為此付出了巨大努力，以確保我們能保持獨立，這非常值得。"
 AUS_became_subject: "自從我們失去獨立的權利，[ROOT.GetNameDefCap]正在經歷一些激烈的變化。儘管許多變化是不完全獨立帶來的不太愉快的副作用，但最近我們發現了一個罕見的積極效應。由於我們不再獨立，若再有試圖吞併我們的行為，那麼被激怒的將不再僅僅是我們自己。\n\n很明顯[GER.GetLeader]已經取消了強迫我們加入[GER.GetNameDef]的計劃。"
 AUS_political_events.69.a: "我們當前情況下的一線希望"
 AUS_political_events.69.b: "我們時代的安定！"
 AUS_political_events.69.a_tt: "移除§Y反德奧合併措施§!決議。"
 AUS_political_events.70.t: "[FROM.GetAdjective]政府為了擔保提供補償"
 AUS_political_events.70.desc: "\n這一次是[FROM.GetNameDef]的[FROM.GetLeader]親自與我們接觸。我們之前的互動沒有按照他們希望的方式發展，他們決定提出新的提議，希望能改變我們的想法。\n\n由於這對他們來說是一個非常嚴重的問題，他們提出承擔我們國家建立兩家新工廠的費用，並向我們保證，如果我們改變主意並給予他們擔保，他們將不勝感激。"
 AUS_political_events.70.a: "這改變了一切！"
 AUS_political_events.70.b: "我們的回答仍然不變，不行。"
 AUS_political_events.71.t: "[FROM.GetNameDefCap]提議用保障獨立換取工業支持"
 AUS_political_events.71.desc: "我們說服[FROM.GetAdjective]領袖[FROM.GetLeader]的努力取得了成功。我們需要以兩座工廠支持他們，雖然這很可能會阻礙我們自己的工業，但當我們的主權受到攻擊時，他們會站在我們一邊，現在我們可以更安全地休息了。"
 AUS_political_events.71.a: "終於有一些好消息了！"
 AUS_political_events.72.t: "[FROM.GetNameDefCap]不顧補償，拒絕幫助"
 AUS_political_events.72.desc: "我們已經盡力了。我們引用了《聖日耳曼昂萊條約》，並提出了遠超我們這樣規模和處境的國家所能預期的補償。儘管如此，[FROM.GetNameDef]仍然固執地拒絕按照他們自己參與制定的條約為我們擔保。我們不能指望將來得到他們的幫助。"
 AUS_political_events.72.a: "我們將獲勝，讓他們瞧瞧！"
 AUS_political_events.73.t: "[FROM.GetNameDef]提議修訂《聖日耳曼昂萊條約》"
 AUS_political_events.73.desc: "\n[FROM.GetAdjective]堅持要求軍備重整，再次提出了一個修改過的、不那麼嚴格的條約，允許我們控制他們的軍備重整速度。修訂條約將允許他們開始訓練軍隊，但他們的工業仍將又受到一年的限制。"
 AUS_political_events.73.a: "我們可以接受"
 AUS_political_events.73.a_tt: "我們會支持[FROM.GetNameDef]提出的修訂。必須所有擔保國都同意，修訂才能通過。"
 AUS_political_events.73.b: "不，條約必須維持現狀。"
 AUS_political_events.73.b_tt: "我們§R不會§!支持[FROM.GetNameDef]提出的修訂。必須所有擔保國都同意，修訂才能通過。"
 AUS_political_events.73.c: "如果他們想要重新武裝，那我們需要有人監督！"
 AUS_political_events.73.c_tt: "修訂後的條約持續期間，一位民主傾向的監督者會被委派到奧地利"
 AUS_political_events.74.t: "擔保國同意修訂條約"
 AUS_political_events.74.desc: "經過多次辯論和商討，擔保國終於得出了結論。我們將被允許部分再武裝，從今天起，在訓練新部隊和增加戰場士兵人數上，我們將不再受任何限制。\n\n我們的工業仍然受到限制，雖然不再那麼嚴格。如果世界未發生任何決定性變化，這些限制將在一年後完全取消。"
 AUS_political_events.74.a: "這些外交努力是值得的！"
 AUS_political_events.75.t: "擔保國拒絕修訂條約"
 AUS_political_events.75.desc: "無論我們如何努力，擔保國仍然堅定不移。我們不得在任何情況下軍備重整。我們試圖說服他們並提出妥協的外交努力，都被置若罔聞。[ROOT.GetAdjective]民眾現在對這些擔保國懷有強烈的怨恨。"
 AUS_political_events.75.a: "我們只能堅持下去"
 AUS_political_events.75.b: "夠了，我們不需要他們！"
 AUS_political_events.76.t: "擔保國同意修訂條約，並將委派監督者"
 AUS_political_events.76.desc: "\n經過多次辯論和商討，擔保國終於得出了結論。我們將被允許部分再武裝，從今天起，在訓練新部隊和增加戰場士兵人數上，我們將不再受任何限制。我們的工業仍然受到限制，雖然不再那麼嚴格。如果世界未發生任何決定性變化，這些限制將在一年後完全取消。\n\n然而，這場勝利是有代價的。擔保國不相信我們有能力避免衝突，他們任命了一名監督員，在整個重新武裝的過程中，此人必須留在我們的政府中。"
 AUS_political_events.76.a: "我們接受！"
 AUS_political_events.77.t: "迫在眉睫的威脅"
 AUS_political_events.77.desc: "我們一些最有經驗和技能的外交官長期以來一直在監視[GER.GetNameDef]可能根據計劃行動的風險，這些計劃有時被[GER.GetLeader]確認、有時否認。最近似乎發生了相當激烈的變化，我們的消息來源現在認為，他們可能很快就會試圖吞併我們。"
 AUS_political_events.77.a: "做好最壞的打算……"
 AUS_political_events.77.a_tt: "§R[GER.GetNameWithFlag]已經開始併吞我國，我們已無法影響這一進程！§!"
 AUS_political_events.78.t: "[FROM.GetNameDef]的共產主義者尋求我們的支持"
 AUS_political_events.78.desc: "[FROM.GetNameDef]的[FROM.GetCommunistParty]領導人再次向我們尋求援助。雖然他們目前沒有發生武裝衝突，但1934年社會民主黨人在內戰和政變中的慘痛失敗仍在每個人的腦海中燃燒。他們希望得到我們的援助，以再次爭奪國家權力。"
 AUS_political_events.78.a: "我們將盡力提供幫助！"
 AUS_political_events.78.b: "我們還有更重要的事要做"
 AUS_political_events.79.t: "[FROM.GetNameDefCap]提供支持"
 AUS_political_events.79.desc: "正如我們所希望的那樣，[FROM.GetAdjective]領導層在這艱難的時刻給予了我們支持。我們當然不能依靠他們來徹底解決所有問題，但是再次得到他們的支持，無疑是非常令人愉快的幫助。尤其是在我們的權力鬥爭艱難前行時。"
 AUS_political_events.79.a: "太好了！"
 AUS_political_events.79.a_tt: "如果爆發戰爭，[FROM.GetFlag]§Y[FROM.GetNameDef]§!更有可能向我們派遣志願軍並租借裝備給我們。"
 AUS_political_events.80.t: "[FROM.GetNameDefCap]拒絕我們的求援"
 AUS_political_events.80.desc: "由於我們在意識形態上的微小差異和對革命性共產主義的猶豫，[FROM.GetNameDef]拒絕了我們的求助。我們得靠自己了。"
 AUS_political_events.80.a: "我們真的以為他們會幫忙！"
 AUS_political_events.81.t: "[FROM.GetNameDefCap]向我們的政治靠攏"
 AUS_political_events.81.desc: "很長一段時間以來，[FROM.GetAdjective]們頑固地堅持他們自己的共產主義形式，稱之為奧地利馬克思主義。這種政治分裂是社會民主主義和真正的共產主義的結合，我們對此並不看好。現在看來，他們終於意識到這種意識形態錯誤，放棄了這一錯誤，試圖與我們結盟，希望在敵對勢力攻擊他們時獲得我們的保護。"
 AUS_political_events.81.a: "很好，我們將提供我們的保護"
 AUS_political_events.81.b: "他們會成為最寶貴的盟友……但現在還不是"
 AUS_aligned_with_our_values: "與我們的價值觀相合"
 AUS_political_events.82.t: "[FROM.GetNameDefCap]提議保障獨立"
 AUS_political_events.82.desc: "我們更靠近[FROM.GetLeader]政治意識形態的決定得到了熱烈反響。[FROM.GetNameDefCap]提出要保障我們獨立，會在我們遭遇敵對行動時支持我們。"
 AUS_political_events.82.a: "太好了！"
 AUS_political_events.83.t: "[FROM.GetNameDefCap]贊同我們的政治轉變"
 AUS_political_events.83.desc: "我們更靠近[FROM.GetLeader]政治意識形態的決定得到了熱烈反響。[FROM.GetNameDefCap]表示他們欣賞這一舉動，認為這是朝正確方向邁出的一步，他們希望在未來與我們成為盟友。"
 AUS_political_events.83.a: "我們十分期待！"
 AUS_political_events.84.t: "[FROM.GetAdjective]在我國推廣共產主義思想"
 AUS_political_events.84.desc: "\n我們注意到，[AUS.GetNameDef]目前正在試圖在我們的勞工中煽動共產主義思想。雖然這可能是無害的，但也可能是某種準備的一部分。我們不知道他們的真正意圖是什麼，但我們必須考慮所有可能性。"
 AUS_political_events.84.a: "我們認為這沒問題"
 AUS_political_events.84.b: "禁止他們！"
 AUS_political_events.84.b_tt: "§R這可能會導致可怕的後果！§!"
 AUS_political_events.85.t: "[FROM.GetNameDefCap]允許我們組織工人"
 AUS_political_events.85.desc: "\n我們很清楚我們在[FROM.GetNameDef]的活動遲早會被發現。幸運的是，看來[FROM.GetLeader]並不介意我們在他們的勞工中推廣共產主義思想，並告知他們作為優秀工人的權利和義務。"
 AUS_political_events.85.a: "好極了"
 AUS_political_events.85.a_tt: "一旦完成了國策§Y要求解放工人階級§!，解鎖決議§Y要求解放工人階級§!"
 AUS_political_events.85.2.a_tt: "解鎖決議§Y要求解放[FROM.GetNameDef]的工人階級§!。"
 AUS_political_events.86.t: "[FROM.GetNameDefCap]禁止嘗試組織工人"
 AUS_political_events.86.desc: "\n[FROM.GetLeader]禁止我們告知工人他們在社會中的權利的行為，是對他自己工人的不尊重。這顯然是對我們以及全世界工人的敵對行動。"
 AUS_political_events.86.a: "該死！"
 AUS_political_events.86.b: "我們將阻止這種敵意！"
 AUS_political_events.87.t: "[FROM.GetAdjective]要求共產主義政權"
 AUS_political_events.87.desc: "隨著[FROM.GetAdjective]的宣傳在我們工人中傳播，共產主義思潮逐漸壯大，現在我們收到了最後通牒。[FROM.GetLeader]要求我們允許和平的共產主義接管，因為他認為我們的人民希望如此。如果我們拒絕，他向我們保證，他們將支持我們的工人，不管他們希望做什麼。"
 AUS_political_events.87.a: "我們別無選擇"
 AUS_political_events.87.b: "我們自己做決定"
 AUS_political_events.88.t: "[FROM.GetNameDefCap]建立共產主義政府"
 AUS_political_events.88.desc: "我們在[FROM.GetNameDef]的不懈努力終於取得了回報。新領袖[FROM.GetLeader]就任國家領導人，工人們歡欣鼓舞。"
 AUS_political_events.88.a: "歡迎，同志們！"
 AUS_political_events.89.t: "[FROM.GetNameDefCap]拒絕我們的要求"
 AUS_political_events.89.desc: "儘管明顯的跡象表明他們的人民都希望讓更適合的政府接管，但是[FROM.GetAdjective]及其領導人[FROM.GetLeader]決定不辭職。“我們”必須自行考慮決策，為人民做正確的事。"
 AUS_political_events.89.a: "戰爭會更糟"
 AUS_political_events.89.b: "人民的聲音必被聽到！"
 AUS_political_events.90.t: "我們的選舉結果"
 AUS_political_events.90.desc: "自“議會自毀”以來的第一次選舉已經結束。選民的投票率很高，因為國民已經意識到，如果他們不履行選民的職責，我們的國家會變成什麼樣子。在計票的最後階段，三位領先的候選人僅相差幾票。"
 AUS_political_events.90.a: "庫爾特·舒施尼格是一位民主主義者！"
 AUS_political_events.90.a_tt: "§Y庫爾特·舒施尼格§!成為§Y民主§!黨派的領袖。"
 AUS_political_events.90.b: "卡爾·倫納此前有良好的公職經歷！"
 AUS_political_events.90.c: "文森茨·舒米能滿足大多數選民！"
 AUS_political_events.91.t: "[ROOT.GetLeader]希望上戰場"
 AUS_political_events.91.desc: "近來我們發現我們的大公，[ROOT.GetLeader]閣下不斷地思考前線的情況。他表示自己的能力未能被滿足，並希望更直接地領導他的士兵。今天這件事又被提了出來，我們的大公希望勇敢地帶領他的軍隊參加戰鬥，把治理的責任交給其他人。"
 AUS_political_events.91.a: "大公，上戰場去吧！我們會有人幫你暖好你的寶座"
 AUS_political_events.91.b: "大公也要安分守己"
 AUS_political_events.91.a_tt: "新首都將被命名為§Y瓦杜茲§!"
 AUS_political_events.91.a_tt2: "§Y奧托·馮·哈布斯堡§!成為§Y能力2§!陸軍元帥"
 AUS_political_events.92.t: "[FROM.GetNameDefCap]請求購買阿拉斯加"
 AUS_political_events.92.desc: "[FROM.GetNameDef]的[FROM.GetLeader]向我們提出了購買[463.GetName]州的請求。1867年，當時的俄羅斯帝國將該地賣給了[USA.GetNameDef]，最初的購買提議也曾向[FROM.GetNameDef]提出。當時遭到他們拒絕，但自那以後他們改變了想法，如今希望從我們這裡購買該地。作為交換，他們提出將給予我們豐厚的資金。"
 AUS_political_events.92.a: "我國的領土是無價的！"
 AUS_political_events.92.b: "[463.GetName]對我們沒用"
 generic_this_might_cause_tt: "§R這可能導致§!："
 AUS_political_events.93.t: "[FROM.GetNameDefCap]將[463.GetName]賣給我們"
 AUS_political_events.93.desc: "我們已經接到[FROM.GetLeader]的消息，他們同意按照我們提出的金額出售[463.GetName]。該地將立即移交給我們，以便我們開展整合工作。"
 AUS_political_events.93.a: "太好了"
 AUS_political_events.94.t: "[FROM.GetNameDefCap]拒絕出售[463.GetName]"
 AUS_political_events.94.desc: "儘管我們向[FROM.GetNameDef]提供了一大筆錢來購買[463.GetName]，但他們拒絕了這筆交易。我們對[463.GetName]有非常合法的主張，現在他們正公然拒絕我們。我們必須思考如何最好地繼續推進。"
 AUS_political_events.94.a: "值得一試"
 AUS_political_events.94.b: "我們將解放他們！"
 AUS_political_events.95.t: "[ROOT.GetAdjective]軍隊在戰勝後返回"
 AUS_political_events.95.desc: "當1866年7月22日奧普戰爭結束時，我們勇敢的軍隊回到了家中，據說歸來的軍隊的人數反而比出徵時多了一個士兵。這是真的還是隻是誇張的故事尚有爭議。然而，我們可以確認，如今我們的光榮軍隊歸來，成為了更勇猛的戰士。"
 AUS_political_events.95.a: "歡迎來到[ROOT.GetNameDef]！"
 AUS_political_events.95.a_tt: "一位真正的[ROOT.GetAdjective]愛國者加入了我們的行列"
 AUS_political_events.96.t: "[FROM.GetNameDefCap]尋求加入[ROOT.GetFactionName]"
 AUS_political_events.96.desc: "[FROM.GetName]最近成為了民主國家，該國的[FROM.GetLeader]向我們提出加入[ROOT.GetFactionName]的請求。儘管他們自那次大戰結束以來一直選擇孤立，但當前的政治氣候和世界緊張局勢使他們改變了心意。鑑於他們現在再次成為了一個真正的民主國家，他們選擇向我們靠攏，並向我們保證他們將成為陣營的重要資產！"
 AUS_political_events.96.a: "非常歡迎他們加入！"
 AUS_political_events.96.b: "我們不相信他們"
 AUS_political_events.97.t: "[FROM.GetNameDefCap]歡迎我們加入[ROOT.GetFactionName]"
 AUS_political_events.97.desc: "我們加入[ROOT.GetFactionName]的請求已獲批准！雖然我們非常確定這一劇變正是我們國家所需要的，但這種情況的嚴重性不容小覷。大戰後，我們切斷了與所有盟友的聯繫，希望類似的情況不再發生。雖然我們現在適應了我們新聯盟的相對安全，但我們知道和平確實是一件脆弱的事情。"
 AUS_political_events.97.a: "這是必要之舉"
 AUS_political_events.98.t: "[FROM.GetNameDefCap]拒絕我們加入[FROM.GetFactionName]的請求"
 AUS_political_events.98.desc: "儘管我們盡了最大努力，我們向[FROM.GetAdjective]提出加入[FROM.GetFactionName]的請求被拒絕了。他們沒有給出任何實質的理由，看來我們又只能靠自己了。"
 AUS_political_events.98.a: "他們真是太可怕了！"
 AUS_political_events.98.b: "看來我們得事事親力親為了！"
 AUS_political_events.99.t: "[FROM.GetNameDefCap]拒絕我們的要求"
 AUS_political_events.99.desc: "[GetRejectionAmounts]"
 AUS_has_not_rejected_before: "[FROM.GetAdjective]領導層的[FROM.GetLeader]對我們的要求作出了回應。信函措辭符合外交禮儀，但仍然帶有侮辱的潛臺詞。我們的擔憂被輕描淡寫，如同無關緊要的事一樣，這意味著我們對[FROM.GetNameDef]的擔憂確實是正當的。我們領導中的一些聲音呼籲繼續向[FROM.GetAdjective]施壓，以便更容易實現我們的未來計劃，但少數人認為我們應該考慮讓[FROM.GetAdjective]贏得這個無聊的勝利。"
 AUS_GER_cannot_take_a_no: "儘管我們對[FROM.GetNameDef]不斷施加壓力，[FROM.GetLeader]仍然堅持[FROM.GetLeader.GetHerHis]的立場。阿圖爾·賽斯-英夸特不會被任命為政府顧問，不管我們說什麼或做什麼。我們將不得不解決這個問題，這只是一個小的困擾。"
 AUS_political_events.99.a: "他們會向我們屈服！"
 AUS_refuses_to_submit: "拒絕向我們屈服"
 AUS_political_events.99.b: "讓他們得逞，讓他們疏忽大意……"
 AUS_bullied_austria: "[AUS.GetNameDef]受威脅"
 AUS_political_events.100.t: "進一步施壓，要求扶植阿圖爾·賽斯-英夸特"
 AUS_political_events.100.desc: "\n儘管我們早先拒絕了阿圖爾·賽斯-英夸特加入我們的政府，但[FROM.GetAdjective]的領袖[FROM.GetLeader]卻繼續要求這樣做。鑑於此，我們承受的壓力增加了，但我們仍然保留著自己的主權和政治控制，選擇權仍然在我們手中。"
 AUS_political_events.100.a: "他們對我們施壓是有原因的，不要退讓！"
 AUS_trying_to_control_us: "試圖控制我方"
 AUS_political_events.100.b: "如果我們拒絕可能會遭報復"
 AUS_political_events.101.t: "[FROM.GetNameDefCap]中止讓阿圖爾·賽斯-英夸特上臺的努力"
 AUS_political_events.101.desc: "經過在一些無關緊要的事情上反覆的拉拉扯扯，[FROM.GetNameDef]終於停止了非法干涉我們政治的行徑。可以假設他們現在對我們非常不滿，但那不是我們的主要關心。我們的主要關心始終是、現在是、將來也是[ROOT.GetNameDef]的更好發展。"
 AUS_political_events.101.a: "終於。"
 AUS_political_events.102.t: "元首的擴張計劃"
 AUS_political_events.102.desc: "在最近由[ROOT.GetLeader]召開的會議上，元首分享了他對[ROOT.GetNameDef]未來擴張的一些雄心。這次擴張是[ROOT.GetLeader.GetSheHe]認為風險很小的。與我們沒有太大區別的[AUS.GetAdjective]人民大多持有相似的觀點，這一點從該國的政治氣候中可以看出。元首相信，考慮到給予足夠的時間讓[ROOT.GetAdjective]的友好情緒在[AUS.GetNameDef]中發展，這樣的擴張是可以通過外交手段實現的。"
 AUS_political_events.102.a: "真是好主意！"
 AUS_anschluss_ratio_ticking_down: "啟動國策§Y德奧合併§!所需的§Y陸軍總戰鬥力§!，將每週降低，降低的幅度與§Y[AUS.GetNameWithFlag]§!境內§Y中立主義§!的受歡迎程度相關。"
 AUS_anschluss_ratio_ticking_down_monarchist: "啟動國策§Y德奧合併§!所需的§Y陸軍總戰鬥力§!，將每週降低，降低的幅度與§Y[AUS.GetNameWithFlag]§!境內§Y法西斯主義§!的受歡迎程度相關。"
 AUS_political_events.103.t: "[GER.GetAdjective]擴張的報告令人憂慮"
 AUS_political_events.103.desc: "雖然我們早就懷疑[GER.GetAdjective]有吞併我們的意圖，但今天早上收到的報告讓事情變得更加嚴峻。看起來最近召開了一次會議，在會上，[GER.GetLeader]提出了關於我們如何融入他們國家的可怕想法。儘管我們盡力保密，但這條高度機密的信息似乎已經傳到了大眾中，更令人擔憂的是，一些政黨似乎認為這是個好主意。如果[GER.GetLeader]的這些可惡計劃付諸實施，這些團體很可能會削弱我們人民反擊的意志。"
 AUS_political_events.103.a: "太糟了。"
 AUS_political_events.104.t: "[GER.GetAdjective]流亡者"
 AUS_political_events.104.desc: "今天早上發生了一場非常不尋常的會議。我們的領導層面見了一位奇怪的男人，這個男人給他們一種似曾相識的感覺，甚至連聲音都很熟悉。他自稱是一位有抱負的藝術家，從[GER.GetNameDef]來到這裡，希望幫助我們。他表示自己是一位有能力的領導者，而我們的國家迫切需要這樣的人。\n\n在詢問我們的邊境守衛時，他們否認有任何叫這個名字的人越過邊界，並表示一個叫伊麗莎白·希德勒的人是最接近的匹配。"
 AUS_political_events.104.a: "沒門，我們不會上當的"
 AUS_political_events.104.b: "能有什麼問題呢？"
 AUS_political_events.104.c: "伊麗莎白……？"
 AUS_british_monarch: "領導人是英國女王的後裔"
 AUS_political_events.105.t: "[FROM.GetNameDefCap]撤回了支持"
 AUS_political_events.105.desc: "隨著[GER.GetNameDef]要求吞併我國的呼聲愈演愈烈，我們原本以為可以依靠[ITA.GetAdjective]的保證。但事實證明情況並非如此。當面對[GER.GetAdjective]的威脅時，他們立刻退縮了，徒留我們陷於困境。看來他們的承諾不過是空話。"
 AUS_political_events.105.a: "現在已經沒有希望了"
 AUS_political_events.105.b: "我們將孤軍奮戰！"
 AUS_political_events.106.t: "[FROM.GetNameDefCap]重申了他們的支持"
 AUS_political_events.106.desc: "鑑於[GER.GetNameDef]最近的敵對行為，[ITA.GetAdjective]方面主動聯繫了我們，重申了他們的支持。不論威脅如何，他們都會保證我們的獨立，並且如果發生武裝衝突，他們將與我們並肩作戰。"
 AUS_political_events.106.a: "[GER.GetAdjective]必將為他們的行為後悔！"
 AUS_political_events.107.t: "[FROM.GetNameDefCap]屈服於[GER.GetAdjective]的壓力"
 AUS_political_events.107.desc: "我們收到了令人沮喪的消息，[FROM.GetLeader]已經屈服於[GER.GetAdjective]的要求，接受了他們對[GER.GetNameDef]的吞併。儘管我們向[FROM.GetAdjective]提供了保證，但這似乎還不足以鼓勵他們反抗。我們仍然對該地區有興趣，所以在未來我們可能會考慮解放[FROM.GetAdjective]。"
 AUS_political_events.107.a: "我們會拯救他們的！"
 AUS_political_events.107.a_tt: "對[GER.GetNameDef]發動戰爭後，我們將獲得：\n"
 AUS_political_events.107.b: "這注定失敗"
 AUS_political_events.108.t: "[FROM.GetNameDefCap]在我們邊境舉行軍事演習"
 AUS_political_events.108.desc: "我們注意到[FROM.GetAdjective]軍隊在我們邊境舉行了一場相當大規模的軍事演習。雖然沒有明確的威脅言辭，但我們敏銳地感到這似乎是某種警告。我們需要謹慎對待他們，以免他們採取更激烈的行動。"
 AUS_political_events.108.a: "我們會保持警惕！"
 AUS_political_events.109.t: "[FROM.GetNameDefCap]武裝邊境警衛"
 AUS_political_events.109.desc: "最近，我們的邊境巡邏隊報告說，邊境對面的[FROM.GetAdjective]巡邏隊數量大幅增加，甚至警衛也已武裝起來。更令人擔憂的是，這些警衛不再是輕裝，而是攜帶了類似於軍隊制式的步槍。如果他們之前的聲明言之有物，目前的變化可能值得關注。"
 AUS_political_events.109.a: "令人擔憂……"
 AUS_political_events.110.t: "[FROM.GetNameDef]反[ROOT.GetAdjective]情緒高漲"
 AUS_political_events.110.desc: "政府資助的集會之後，我們收到報告稱[FROM.GetNameDef]境內的反[ROOT.GetAdjective]情緒急劇上升。[FROM.GetAdjective]領導層並未直接接觸我們解決這些問題，因此只能推測他們對外交活動並不感興趣。"
 AUS_political_events.110.a: "令人擔憂"
 AUS_political_events.111.t: "[FROM.GetNameDefCap]提出互不侵犯條約"
 AUS_political_events.111.desc: "來自[FROM.GetAdjective]領導層的通訊剛剛到達我們手中。他們請求我們簽署兩國之間的和平協議。他們承認過去我們之間有不少難處，但希望現在及未來能夠進行更具建設性的對話。"
 AUS_political_events.111.a: "過去的就讓它過去吧，我們會簽署的！"
 AUS_political_events.111.b: "我們瞭解[FROM.GetAdjective]人還有他們曾經的作為，所以絕對不行！"
 AUS_political_events.112.t: "[FROM.GetNameDefCap]簽署互不侵犯條約"
 AUS_political_events.112.desc: "我們關於[FROM.GetNameDef]的計劃今天向前邁出了一步，因為我們已經簽署了一項互不侵犯條約。我們將繼續努力，將他們逐步拉近我們。未來仍然充滿不確定性，但如果我們希望繼續推進我們的計劃，必須保持這種勢頭。"
 AUS_political_events.112.a: "很好"
 AUS_political_events.113.t: "[FROM.GetNameDefCap]拒絕簽署互不侵犯條約"
 AUS_political_events.113.desc: "看起來我們的提議對[FROM.GetAdjective]領導層來說還不夠好。要麼他們看穿了我們未來的計劃，要麼他們自己對我們有不良企圖。我們必須為此做好準備，如果我們希望推進我們的計劃，可能需要採取更具敵意的行動。"
 AUS_political_events.113.a: "真是遺憾"
 AUS_political_events.114.t: "[FROM.GetNameDef]提供工業支持"
 AUS_political_events.114.desc: "鑑於我們兩國之間最近達成的和平協議，[FROM.GetAdjective]方面提供了一些工業支持。雖然我們的工業部門通常能夠達到我們的標準，但他們的幫助當然是受歡迎的。一些謹慎的聲音提出了疑問，認為[FROM.GetNameDefCap]肯定事出有因。"
 AUS_political_events.114.a: "轉達我們的感謝"
 AUS_political_events.115.t: "建議舉行[FROM.GetAdjective]-[ROOT.GetAdjective]聯合軍事演習"
 AUS_political_events.115.desc: "[FROM.GetAdjective]軍隊的官員主動聯繫了我們，希望組織一次聯合軍事演習。他們保證這對兩國都是最有利的，他們表示這樣我們就可以互相學習、互通有無。"
 AUS_political_events.115.a: "為什麼不呢？"
 AUS_political_events.115.b: "這聽起來很可疑……"
 AUS_political_events.116.t: "[ROOT.GetAdjective]-[FROM.GetAdjective]軍事演習結束"
 AUS_political_events.116.desc: "今天標誌著[ROOT.GetAdjective]-[FROM.GetAdjective]聯合軍事演習的結束。我們的部隊從這次演習中受益匪淺，我們希望[FROM.GetAdjective]方面也能從中獲益。通過更深入瞭解[FROM.GetAdjective]軍隊的行動方式，也讓我們更好地掌握了我們在未來計劃中的合作對象。"
 AUS_political_events.116.a: "好極了！"
 AUS_political_events.117.t: "[FROM.GetAdjective]拒絕參加聯合[ROOT.GetAdjective]-[FROM.GetAdjective]軍事演習"
 AUS_political_events.117.desc: "\n儘管聯合軍事演習對我們和[FROM.GetNameDef]都顯而易見地有利，他們卻拒絕了我們的提議。我們的軍隊本可以從彼此中學到很多。這也本可以是我們影響[FROM.GetNameDef]的好機會，用以推動他們向我們期望的方向發展。"
 AUS_political_events.117.a: "無所謂……"
 AUS_political_events.118.t: "帝國的組織"
 AUS_political_events.118.desc: "隨著我們踏上重建帝國的道路，如何組織帝國的問題再次擺在我們面前。我們的前任在這個問題上失敗了，導致了一個龐大但無序的帝國。我們被建議成立一個陣營，以確保我們的附屬國對我們忠誠，同時避免彼此爭鬥。"
 AUS_political_events.118.a: "他們將不得不加入我們"
 AUS_political_events.118.b: "我們將擱置目前的安排來解決此事"
 AUS_political_events.118.c: "我們將為此設立適當的組織！"
 AUS_political_events.118.c.tt: "§Y[FROM.FROM.GetNameDefCap]§!將被迫加入§Y[ROOT.GetAdjective]§!的陣營"
 AUS_political_events.119.t: "[FROM.GetNameDefCap]要求進一步的讓步"
 AUS_political_events.119.desc: "雖然他們已經在巴爾幹地區提出了相當大的主權要求，但[FROM.GetAdjective]人似乎仍然不滿足。這次他們提出的要求將侵犯我們的利益範圍，但拒絕的後果可能會非常嚴重。"
 AUS_political_events.119.a: "我們不得不屈服"
 AUS_political_events.119.b: "我們決不接受！"
 AUS_political_events.120.t: "[FROM.GetNameDefCap]屈服於我們的要求"
 AUS_political_events.120.desc: "我們對[FROM.GetAdjective]領導層提出的領土要求得到了認可。雖然我們預料到這一結果，但仍然很高興無需採取更激烈的措施來確保我們的合法領土。"
 AUS_political_events.120.a: "多麼光榮啊"
 AUS_political_events.121.t: "[FROM.GetNameDefCap]拒絕了我們的要求"
 AUS_political_events.121.desc: "儘管我們對目前[FROM.GetAdjective]佔領的領土擁有完全合法的主張，[FROM.GetLeader]卻決定不交出這些要求的領土。這無疑是一個挫折，但我們必將收復這些土地，不惜一切代價。"
 AUS_political_events.121.a: "我們會得到那片土地的！"
 AUS_political_events.122.t: "[ROOT.GetAdjective]潛艇的聲音？"
 AUS_political_events.122.desc: "格奧爾格·馮·特拉普曾是奧匈帝國海軍備受尊敬的海軍上將。隨著我們偉大帝國的崩潰以及海岸線的喪失，他像許多人一樣轉向了其他事業。在金融領域的一次嘗試失敗後，他失去了大部分財富，轉而投身於音樂。\n\n現在我們重新獲得了海岸線，馮·特拉普提出為我們偉大的國家再次出海效力。"
 AUS_political_events.122.a: "好極了，讓他加入海軍！"
 AUS_political_events.122.b: "儘管我們喜歡他……但不需要"
 AUS_political_events.123.t: "[FROM.GetAdjective]重組同盟國"
 AUS_political_events.123.desc: "今天早上我們收到了奧地利重新組建同盟國的消息。這一軍事聯盟在世界大戰期間團結一致，但隨著大多數主要成員國的垮臺而瓦解。[FROM.GetAdjective]人決定重新建立這個陣營，並且鑑於我們曾是該陣營的前成員，他們認為邀請我們加入是十分恰當的。"
 AUS_political_events.123.a: "我們將共同進退！"
 AUS_political_events.123.b: "曾經的一回已經足夠"
 AUS_political_events.124.t: "[FROM.GetNameDefCap]加入了[ROOT.GetFactionName]"
 AUS_political_events.124.desc: "正如我們所期望的那樣，我們的盟友欣然接受了我們的邀請，重新組建我們光榮的聯盟。他們同意與我們共同對抗那些在世界大戰結束時不公正對待我們的國家。"
 AUS_political_events.124.a: "我們的帝國會再次崛起！"
 AUS_political_events.125.t: "[FROM.GetNameDefCap]拒絕了我們的邀請"
 AUS_political_events.125.desc: "我們曾希望[FROM.GetAdjective]人能看到再次聯合的顯而易見的好處，但看來我們曾經遭受的挫折矇蔽了他們的視線。我們的領袖[ROOT.GetLeader]對此的回應是優雅而堅定的，這只是一個小小的挫折。"
 AUS_political_events.125.a: "如果他們不和我們一起……"
 AUS_news_events.1.t: "[AUS.GetNameDefCap]拒絕[GER.GetAdjective]的合併要求"
 AUS_news_events.1.desc: "面對一個實力更強的敵人，[AUS.GetAdjective]領導層決定不屈服於最近[GER.GetAdjective]的要求，即加入[GER.GetNameDef]。[GER.GetNameDef]的軍隊已在[AUS.GetAdjective]邊界列隊，但是否會發起全面入侵尚未可知。\n\n這些事件是在兩國關係日益惡化和[GER.GetAdjective]不斷向[AUS.GetNameDef]施壓要求其整合進[GER.GetNameDef]後發生的。"
 AUS_news_events.1.a: "我們希望[AUS.GetNameDef]一切順利……"
 AUS_news_events.1.b: "讓他們瞧瞧……"
 AUS_news_events.1.c: "東部自由！"
 AUS_news_events.3.t: "王牌飛行員墜落"
 AUS_news_events.3.desc: "[AUS.GetAdjective]的王牌飛行員戈德溫·馮·布魯莫夫斯基在訓練一個[HOL.GetAdjective]飛行學員期間，在史基浦機場發生了一起致命的墜機事故。\n\n馮·布魯莫夫斯基，曾經是強大的奧匈帝國空軍中最成功的王牌飛行員。他在那次世界大戰和1934年[AUS.GetNameDef]的內戰中，個人獲得了35次空戰勝利，12次共享勝利，還有8次未經證實的勝利。"
 AUS_news_events.3.a: "他做出了許多貢獻，願他安息"
 AUS_news_events.3.b: "真是悲劇啊"
 AUS_news_events.4.t: "王牌飛行員死裡逃生"
 AUS_news_events.4.desc: "[AUS.GetAdjective]的王牌飛行員戈德溫·馮·布魯莫夫斯基昨天在史基浦機場訓練一個[HOL.GetAdjective]飛行學員時，差點遭遇災難。\n\n馮·布魯莫夫斯基，曾經是強大的奧匈帝國空軍中最成功的王牌飛行員。他在那次世界大戰和1934年[AUS.GetNameDef]的內戰中，個人獲得了35次空戰勝利，另有12次與他人共同得到的勝利，還有8次未經證實的勝利。\n\n這次事件中，兩人基本上安然無恙地倖存了下來。"
 AUS_news_events.4.a: "千鈞一髮"
 AUS_news_events.5.t: "[AUS.GetAdjective]廢除《聖日耳曼昂萊條約》"
 AUS_news_events.5.desc: "\n[AUS.GetNameDef]的[AUS.GetLeader]最近表示，他們打算徹底廢除《聖日耳曼昂萊條約》，並重新武裝。這項條約是在那次世界大戰後制定的，目的是防止[AUS.GetNameDef]重蹈覆轍，為了獲取權力而擴張領土。理論家推測，這是對世界局勢逐漸緊張的回應，這種軍事化努力的意圖是防禦性的還是侵略性的尚不得而知。"
 AUS_news_events.5.a: "令人擔憂"
 AUS_news_events.5.b: "終於！"
 AUS_news_events.6.t: "[AUS.GetNameDefCap]重組同盟國"
 AUS_news_events.6.desc: "\n\n由於在其周邊地區沒有可行的聯盟選項，[AUS.GetNameDef]決定再次重組同盟國。在擺脫了他們的條約束縛後，該國迅速轉向重新軍事化。他們的這個新聯盟是否會像那次世界大戰中的同名組織一樣，還有待觀察。"
 AUS_news_events.6.a: "令人擔憂"
 AUS_news_events.6.b: "真是偉大的一天！"
 AUS_news_events.7.t: "奧托·馮·哈布斯堡回到[AUS.GetNameDef]"
 AUS_news_events.7.desc: "\n奧托·馮·哈布斯堡在流亡生涯中的大部分時間先後在[SWI.GetNameDef]和[POR.GetNameDef]的馬德拉島度過，如今他已返回[AUS.GetNameDef]。這位王子在1918年隨他的父母查理一世皇帝和齊塔皇后在大戰結束後君主制垮臺時逃離了國家。他作為[AUS.GetAdjective]國家元首的迴歸標誌著[AUS.GetNameDef]政治氛圍的明顯變化。"
 AUS_news_events.7.a: "哈布斯堡皇子萬歲！"
 AUS_news_events.7.b: "這不是我們在條約中所規定的！"
 AUS_news_events.7.c: "祝他好運"
 AUS_news_events.8.t: "哈布斯堡家族控制下的哈布斯堡"
 AUS_news_events.8.desc: "在[AUS.GetLeader]的統治下，[AUS.GetNameDef]已經重新奪回了哈布斯堡城。他們已經使[SWI.GetAdjective]屈服於他們的意願，這一行為旨在增強哈布斯堡家族的權力，並標誌著一個更加帝國主義的[AUS.GetName]鮮明迴歸。"
 AUS_news_events.8.a: "他們為什麼要這樣做？"
 AUS_news_events.8.b: "哈布斯堡屬於我們！"
 AUS_news_events.9.t: "[FROM.GetNameDef]發生共產主義政變"
 AUS_news_events.9.desc: "[FROM.GetNameDef]一直在加強對[FROM.GetCommunistParty]的支持，[FROM.GetNameDef]終於發生了一場和平政變。共產主義者已和平接管了國家的權力，並且在政府內幾乎沒有遇到任何抵抗。\n\n這是幾十年來[FROM.GetNameDef]的首場劇變。"
 AUS_news_events.9.a: "出乎意料"
 AUS_news_events.9.b: "祝他們好運！"
 AUS_news_events.9.c: "終於！"
 AUS_news_events.10.t: "[FROM.GetNameDef]內戰"
 AUS_news_events.10.desc: "[FROM.GetNameDef]爆發了一場激烈的內戰。共產主義的[FROM.GetCommunistParty]對執政的[FROM.GetNeutralParty]發動了起義。共產主義者最近獲得了相當大的支援，在[FROM.GetNameDef]已成為不可小覷的力量。"
 AUS_news_events.10.a: "太荒謬了"
 AUS_news_events.10.b: "幹得好，祝好運！"
 AUS_news_events.10.c: "向前！"
 AUS_news_events.11.t: "[AUS.GetNameDefCap]成立多瑙河集團"
 AUS_news_events.11.desc: "在徹底摒棄過去後，由[AUS.GetLeader]領導的[AUS.GetAdjective]領導層決定自行建立陣營。他希望中歐的其他國家的工人能起來反抗壓迫他們的人，並加入他們的行列，為人民權利而戰。"
 AUS_news_events.11.a: "他們為什麼要這樣做？"
 AUS_news_events.11.b: "我們祝他們一切順利！"
 AUS_news_events.11.c: "對[AUS.GetNameDef]來說是偉大的一天！"
 AUS_news_events.12.t: "[AUS.GetNameDefCap]再次舉行民主選舉"
 AUS_news_events.12.desc: "\n自1930年9月11日以來，[AUS.GetNameDef]首次舉行了民主選舉。投票率很高，隨著計票接近尾聲，[AUS.GetLeader]代表[AUS.GetDemocraticParty]贏得了選舉。他現在將面臨帶領國家走上一條嶄新的、更加民主的道路的艱難任務。"
 AUS_news_events.12.a: "太好了"
 AUS_news_events.12.b: "知道了"
 #Hungarian country events
 WW_hungary.1.t: "[HUN.GetName]啟動聯合制造計劃"
 WW_hungary.1.desc: "我們的盟友[HUN.GetNameDef]已啟動一項聯合開發飛機的計劃，並已開始投資我們的研發，以便將來進一步推進他們自己的研發工作。"
 WW_hungary.1.a: "這無疑是個好消息"
 WW_hungary.2.t: "[FROM.GetAdjective]武器運輸抵達"
 WW_hungary.2.desc: "[FROM.GetAdjective]政府已明確表態支持我們的戰爭努力。作為他們新支持的一部分，他們給我們運來了武器裝備。這對我們打贏這場戰爭肯定有幫助。"
 WW_hungary.2.a: "太好了！"
 WW_hungary.3.t: "根伯什·久洛總理之死"
 WW_hungary.3.desc: "我們的總理、匈牙利國防軍協會的軍官和領導者根伯什·久洛據報道在慕尼黑的一次外交任務中因睪丸癌去世。雖然[ROOT.GetLeader]已經有了新的總理人選，即中間派的道拉尼·卡爾曼，但根伯什領導的法西斯準軍事組織的去向問題仍然存在。考慮到他們和[ROOT.GetLeader]共同的反共立場，我們或許能說服他們為我們效力，但如果我們將他們納入我們的武裝力量，不知道他們的真正忠誠是否可能對我們的未來構成威脅。我們應該如何應對匈牙利國防軍協會？"
 WW_hungary.3.a: "我們應該全力整合匈牙利國防軍協會"
 WW_hungary.3.b: "立即解散這些塞格德法西斯分子！"
 WW_hungary.3.c: "讓他們自由發展。最糟糕還能怎樣？"
 HUN_gombos_has_died_flag: "§Y根伯什·久洛§!已死亡"
 WW_hungary.4.t: "[HUN.GetNameDefCap]索取特蘭西瓦尼亞"
 WW_hungary.4.desc: "特蘭西瓦尼亞曾長期是[HUN.GetNameDef]的一部分，直到在特里亞農條約中被割讓。不幸的是，[HUN.GetNameDef]從未放下對失去領土的記憶。在不同時期，他們曾公開聲稱特蘭西瓦尼亞是他們國家不可分割的一部分。隨著最近政治局勢的變化，他們再次提出要求，要求我們將整個特蘭西瓦尼亞交給他們……否則。"
 WW_hungary.4.a: "隨便，給他們好了……"
 WW_hungary.4.b: "否則……會怎樣？"
 WW_hungary.5.t: "[FROM.GetNameDefCap]移交特蘭西瓦尼亞"
 WW_hungary.5.desc: "懦弱的[FROM.GetAdjective]人已經決定歸還我們的合法領土而非負隅頑抗。特蘭西瓦尼亞已經完璧歸趙，我們重新掌控了該地區。"
 WW_hungary.5.a: "理應如此"
 WW_hungary.6.t: "[FROM.GetNameDefCap]拒絕轉交特蘭西瓦尼亞"
 WW_hungary.6.desc: "[FROM.getNameDef]中的傲慢領導者拒絕了我們的和平提議，聲稱與其把特蘭西瓦尼亞交給我們，不如選擇戰爭。也許他們是在叫我們的虛張聲勢，或者現在正是出手的好時機。只有時間能告訴我們答案。"
 WW_hungary.6.a: "那麼，只有戰爭了"
 WW_hungary.6.b: "這根本不值得努力"
 WW_hungary.7.t: "[FROM.GetNameDefCap]索要斯洛伐克南部"
 WW_hungary.7.desc: "激進的[FROM.GetLeader]最近譴責了我們非法佔領[FROM.GetAdjective]斯洛伐克南部。現在，我們收到了[FROM.GetAdjective]的最後通牒，他們的軍隊正在我們邊境集結。我們應該如何回應？"
 WW_hungary.7.a: "不值得為此流血"
 WW_hungary.7.b: "那就來試試看吧！"
 WW_hungary.8.t: "[HUN.GetNameDefCap]提議用[975.GetName]換取保護"
 WW_hungary.8.desc: "[HUN.GetNameDef]的[HUN.GetLeader]向我們提出了一個有趣的提議。他表示，作為交換，他們願意把[975.GetName]，或如他們所說的萊塔班沙格，歸還給[HUN.GetAdjective]，並在[GER.GetAdjective]來侵犯我們時提供獨立保證並站在我們這邊。我們應該接受他們的提議嗎？"
 WW_hungary.8.a: "我們需要所有可能的幫助……"
 WW_hungary.8.b: "他們的保證究竟值多少錢？"
 WW_hungary.9.t: "[FROM.GetNameDefCap]交出[975.GetName]以換取保障獨立"
 WW_hungary.9.desc: "[FROM.GetNameDef]明智的管理層已決定接受我們的提議，會立即將[975.GetName]的控制權轉交給我們，以換取獨立保障。我們變得更大了，而我們與[FROM.GetAdjective]的友誼之火再次點燃。"
 WW_hungary.9.a: "今天我們就像兩個老朋友重聚一樣！"
 WW_hungary.10.t: "[FROM.GetNameDefCap]拒絕了我們的保護"
 WW_hungary.10.desc: "[FROM.GetNameDef]愚蠢的領導層拒絕了我們的提議，稱比起他們，這顯然更適合我們，還說他們不相信我們會信守承諾……他們以為我們是什麼人！？"
 WW_hungary.10.a: "他們真是有病……"
 WW_hungary.11.t: "[FROM.GetNameDefCap]要求控制我們的[SLO.GetAdjective]領土"
 WW_hungary.11.desc: "近來，[FROM.GetLeader]公開譴責了我們所謂的非法佔領[FROM.GetAdjective]的斯洛伐克。現在，我們收到了[FROM.GetAdjective]的最後通牒，他們的軍隊正在我們的邊境集結。我們應該如何回應？"
 WW_hungary.11.a: "不值得為此流血"
 WW_hungary.11.b: "那就過來拿啊！"
 WW_hungary.12.t: "[FROM.GetNameDefCap]交出他們的[SLO.GetAdjective]領土"
 WW_hungary.12.desc: "[FROM.GetNameDef]理性的[FROM.GetLeader]同意交出他們在斯洛伐克的領土，已通知他們的部隊撤離該地區。我們再次取得了勝利！"
 WW_hungary.12.a: "真是偉大的一天！"
 WW_hungary.13.t: "[FROM.GetNameDefCap]在斯洛伐克問題上態度堅決"
 WW_hungary.13.desc: "儘管這並不完全出乎意料，但[FROM.GetNameDef]的愚蠢的[FROM.GetLeader]在收到我們的最後通牒後，已經使國家軍隊進入高度戒備狀態，並派遣特使表明他們在這一爭端上不會退讓一步。"
 WW_hungary.13.a: "他們會後悔自己的決定！"
 WW_hungary.13.b: "我們必須忘掉此事"
 WW_hungary.14.t: "[FROM.GetNameDefCap]索要伏伊伏丁那"
 WW_hungary.14.desc: "[HUN.GetAdjective]政府開始就伏伊伏丁那問題施加更多壓力，聲稱過去在帝國時期伏伊伏丁那屬於匈牙利管轄，因此它應該被歸還。他們還聲稱在大戰末期和塞爾維亞的合併是無效的，促成合並的原因僅僅是外界的壓力，因此這裡依舊是屬於[HUN.GetAdjective]的合法領土。"
 WW_hungary.14.a: "這不是我們能夠取勝的戰爭"
 WW_hungary.14.b: "我們不會支持他們的妄想"
 WW_hungary.15.t: "[FROM.GetNameDefCap]移交伏伊伏丁那"
 WW_hungary.15.desc: "\n[FROM.GetNameDef]同意放棄伏伊伏丁那。我們的軍隊已完全控制該地區，整合將馬上開始。"
 WW_hungary.15.a: "太好了"
 WW_hungary.16.t: "[From.GetNameDefCap]拒絕我們的要求"
 WW_hungary.16.desc: "在和[FROM.GetLeader]的緊張會晤中，我們的大使被告知伏伊伏丁那的主權問題沒有商量的餘地。[FROM.GetAdjective]不會屈服於外界的壓力。伏伊伏丁那的人民在1919年沒有選擇加入我們。[FROM.GetAdjective]政府認為這件事應該到此為止。"
 WW_hungary.16.a: "也許確實該如此"
 WW_hungary.16.b: "他們會後悔的"
 WW_hungary.17.t: "[HUN.GetName]要求佔領西巴納特"
 WW_hungary.17.desc: "[HUN.GetNameDef]的[HUN.GetLeader]今天向我們發出了最後通牒，要求我們允許[HUN.GetName]佔領西巴納特地區。如果我們不遵從[HUN.GetLeader]的要求，我們很可能將面臨一場軍事衝突。"
 WW_hungary.17.a: "那麼就給他們吧"
 WW_hungary.17.b: "他們以為自己是誰？"
 WW_hungary.18.t: "[FROM.GetNameDefCap]接受我們的要求"
 WW_hungary.18.desc: "[FROM.GetNameDef]的[FROM.GetLeader]優雅地接受了我們關於佔領西巴納特的要求，隨和將該領土割讓給了我們。他們傾向於安撫我們，而不是站在我們的對立面，這隻會幫助意大利在巴爾幹地區進一步實現其目標。"
 WW_hungary.18.a: "一切按計劃進行"
 WW_hungary.19.t: "愚蠢的[FROM.GetLeader]拒絕我們的最後通牒"
 WW_hungary.19.desc: "愚蠢的[FROM.GetNameDef]領導人[FROM.GetLeader]拒絕了我們應有的領土要求，是時候一擊打倒[FROM.GetNameDef]了。我們很快就能拿下西巴納特的宣稱領土。"
 WW_hungary.19.a: "那就用武力說話吧"
 WW_hungary.20.t: "[FROM.GetNameDefCap]索要喀爾巴阡魯塞尼亞"
 WW_hungary.20.desc: "[HUN.GetAdjective]政府開始就喀爾巴阡魯塞尼亞問題施加更多壓力，聲稱過去在帝國時期那裡屬於匈牙利管轄，因此它應該被歸還。他們還聲稱胡特蘇爾共和國和那片地區的所有後繼國家都是非法的，只有當這片區域再次屬於[HUN.GetAdjective]，這種不公正才能被消除。"
 WW_hungary.20.a: "這不是我們能夠取勝的戰爭"
 WW_hungary.20.b: "他們真的能支持自己的聲明嗎？"
 WW_hungary.21.t: "[FROM.GetNameDefCap]轉交喀爾巴阡魯塞尼亞"
 WW_hungary.21.desc: "[FROM.GetNameDef]理性的[FROM.GetLeader]同意交出他們在喀爾巴阡魯塞尼亞的領土，已通知他們的部隊撤離該地區。我們再次取得了勝利！"
 WW_hungary.21.a: "太好了"
 WW_hungary.22.t: "[From.GetNameDefCap]拒絕我們的要求"
 WW_hungary.22.desc: "儘管並不完全出乎意料，[FROM.GetNameDef]的愚蠢的[FROM.GetLeader]在收到我們的最後通牒後，已經使國家軍隊進入高度戒備狀態，並派遣特使聲明他們在喀爾巴阡盧森尼亞的爭端上不會退讓一步。"
 WW_hungary.22.a: "他們會後悔自己的決定！"
 WW_hungary.22.b: "我們必須忘掉此事"
 WW_hungary.23.t: "[FROM.GetNameDefCap]索取布爾根蘭"
 WW_hungary.23.desc: "[HUN.GetAdjective]政府開始在布爾根蘭問題上施加更多壓力，聲稱該地區在帝國時期曾是匈牙利的一部分，因此應該歸還。他們聲稱該地區必須重新建立萊塔班沙格，我們的統治是非法的。我們應該如何回應？"
 WW_hungary.23.a: "這不是我們能夠取勝的戰爭"
 WW_hungary.23.b: "他們真的能支持自己的聲明嗎？"
 WW_hungary.24.t: "[FROM.GetNameDefCap]轉交布爾根蘭"
 WW_hungary.24.desc: "[FROM.GetNameDef]理性的[FROM.GetLeader]同意交出他們在布爾根蘭的領土，已通知他們的部隊撤離該地區。我們再次取得了勝利！"
 WW_hungary.24.a: "太好了"
 WW_hungary.25.t: "[From.GetNameDefCap]拒絕我們的要求"
 WW_hungary.25.desc: "儘管並不完全出乎意料，[FROM.GetNameDef]的愚蠢的[FROM.GetLeader]在收到我們的最後通牒後，已經使國家軍隊進入高度戒備狀態，並派遣特使聲明他們在布爾根蘭的爭端上不會退讓一步。"
 WW_hungary.25.a: "他們會後悔自己的決定！"
 WW_hungary.25.b: "我們必須忘掉此事"
 WW_hungary.26.t: "[FROM.GetNameDefCap]希望加入我們的陣營"
 WW_hungary.26.desc: "[FROM.GetLeader]在訪問我們的首都後找到我們，聲稱代表所有[FROM.GetAdjective]人民發言，希望我們兩國建立軍事同盟，以進一步擴大[ROOT.GetAdjective]和[FROM.GetAdjective]的領土。"
 WW_hungary.26.a: "我們歡迎他們的加入"
 WW_hungary.26.b: "他們對我們沒用"
 WW_hungary.27.t: "[FROM.GetNameDefCap]讓我們加入他們"
 WW_hungary.27.desc: "[FROM.GetNameDef]的偉大的[FROM.GetLeader]已經同意組建一個新的軍事聯盟，加強我們國家之間已有的聯繫。我們的人民已經走上街頭慶祝這一重大時刻，因為這標誌著[ROOT.GetAdjective]國家的重生，及其人民的新時代的開始。"
 WW_hungary.27.a: "讓我們一起建設我們的未來！"
 WW_hungary.28.t: "[FROM.GetNameDefCap]不允許我們加入他們"
 WW_hungary.28.desc: "[FROM.GetNameDef]可惡的[FROM.GetLeader]拒絕了我們的請求，從根本上斷絕了我們兩國在不久的將來進行合作的所有機會。因此，我們將不得不尋求其他聯盟，或者走我們自己的路。"
 WW_hungary.28.a: "本不應如此"
 WW_hungary.29.t: "[FROM.GetNameDefCap]恢復哈布斯堡統治"
 WW_hungary.29.desc: "[FROM.GetNameDef]的政府宣佈了其意圖恢復1713年《國事遺詔》，有效地再次允許哈布斯堡家族登基，這違背了我們在那次世界大戰後的要求。我們無法真正為此發動戰爭，但鑑於他們可能很快就會對我們構成威脅，也許我們應該嘗試對他們施加壓力？"
 WW_hungary.29.a: "提出外交抗議"
 WW_hungary.29.b: "禁運並提出抗議"
 WW_hungary.30.t: "小協約國要求和平承諾"
 WW_hungary.30.desc: "小協約國成員國對於查理四世於1921年試圖恢復哈布斯堡君主制的行動並不輕視，他們至今仍不允許採取此類行動。然而，這一次，他們沒有因此事威脅我們開戰，而是要求我們展示我們的和平意圖，以免他們需要一勞永逸地終結我們的君主制。"
 WW_hungary.30.a: "我們可以保證不對外侵略。暫時如此……"
 WW_hungary.30.b: "他們不能強迫我們這樣做！"
 HUN_habsburg_refused_promises_of_peace: "拒絕向小協約國承諾和平"
 WW_hungary.31.t: "[FROM.GetNameDefCap]為我們安排了一位新君主"
 WW_hungary.31.desc: "[FROM.GetNameDefCap]已指定約瑟夫·奧古斯特·馮·哈布斯堡為我們國家的新任巴拉丁。這肯定會加強我們的政權。"
 WW_hungary.31.a: "確實"
 WW_hungary.32.t: "[FROM.GetLeader]要求我們恢復哈布斯堡的統治"
 WW_hungary.32.desc: "[FROM.GetNameDefCap]的[FROM.GetLeader]皇帝要求我們恢復內萊塔尼亞的土地，再次加冕一位哈布斯堡作為我們的君主。這將從根本上結束我們的獨立，但可能使我們免於完全吞併。我們要加入新的帝國聯邦嗎？"
 WW_hungary.32.a: "他們是對的"
 WW_hungary.32.b: "哈布斯堡被流放是有原因的！"
 WW_hungary.33.t: "[FROM.GetNameDefCap]接受哈布斯堡君主"
 WW_hungary.33.desc: "[FROM.GetNameDef]明智的領導層已決定依照我們的要求，為一位哈布斯堡君主加冕，並讓位於他們的新王。我們的帝國聯邦將迎來新的曙光！"
 WW_hungary.33.a: "他們做出了正確的選擇"
 WW_hungary.34.t: "[FROM.GetNameDefCap]拒絕哈布斯堡君主"
 WW_hungary.34.desc: "[FROM.GetNameDef]的頹廢領導層決定不辭去他們的職位，他們以某種方式相信他們比天主親自選出的君主更有智慧。不管他們喜不喜歡，我們將推翻他們，讓約瑟夫·奧古斯特登基！"
 WW_hungary.34.a: "他們做了錯誤的選擇"
 WW_hungary.35.t: "[FROM.GetNameDefCap]希望加入我們的陣營"
 WW_hungary.35.desc: "[FROM.GetLeader]在訪問我們的首都後找到我們，聲稱代表所有[FROM.GetAdjective]人民發言，希望我們兩國建立軍事同盟，以進一步擴大[ROOT.GetAdjective]和[FROM.GetAdjective]的領土。"
 WW_hungary.35.a: "我們歡迎他們的加入"
 WW_hungary.35.b: "他們對我們沒用"
 WW_hungary.36.t: "[FROM.GetNameDefCap]恢復舊同盟國"
 WW_hungary.36.desc: "[FROM.GetNameDef]的偉大而尊貴的[FROM.GetLeader]同意建立一個新的軍事聯盟，加強我們國家之間已有的聯繫。我們的人民已經走上街頭慶祝這一重大時刻，因為這標誌著[ROOT.GetAdjective]國家的重生，及其人民的新時代的開始。"
 WW_hungary.36.a: "讓我們一起建設我們的未來！"
 WW_hungary.37.t: "[FROM.GetNameDefCap]羞辱了我們"
 WW_hungary.37.desc: "[FROM.GetNameDef]可惡的[FROM.GetLeader]拒絕了我們的請求，從根本上斷絕了我們兩國在不久的將來進行合作的所有機會。因此，我們將不得不尋求其他聯盟，或者走我們自己的路。"
 WW_hungary.37.a: "本不應如此"
 WW_hungary.38.t: "[FROM.GetNameDefCap]邀請我們加入舊同盟國"
 WW_hungary.38.desc: "[FROM.GetLeader]在訪問我們的首都後找到我們，聲稱代表所有[FROM.GetAdjective]人民發言，希望我們兩國再次加入軍事同盟，以進一步擴大[ROOT.GetAdjective]和[FROM.GetAdjective]的領土。我們該如何回應？"
 WW_hungary.38.a: "他們永遠不會獨行"
 WW_hungary.38.b: "他們不過是個累贅"
 WW_hungary.39.t: "[FROM.GetNameDefCap]加入舊同盟國"
 WW_hungary.39.desc: "[FROM.GetNameDef]的偉大而尊貴的[FROM.GetLeader]已同意加入我們的新軍事聯盟，加強我們國家之間已有的聯繫。我們的人民已經走上街頭慶祝這一重大時刻，因為這標誌著[ROOT.GetAdjective]國家的重生，及其人民的新時代的開始。"
 WW_hungary.39.a: "讓我們糾正那次世界大戰的錯誤！"
 WW_hungary.40.t: "[FROM.GetNameDefCap]羞辱了我們"
 WW_hungary.40.desc: "[FROM.GetNameDef]可惡的[FROM.GetLeader]拒絕了我們的請求，從根本上斷絕了我們兩國在不久的將來進行合作的所有機會。因此，我們將不得不尋求其他聯盟，因為他們不願意與我們結盟。"
 WW_hungary.40.a: "那我們就來領軍！"
 WW_hungary.40.b: "我們必須嘗試其他辦法"
 WW_hungary.41.t: "[FROM.GetNameDefCap]希望恢復大同盟"
 WW_hungary.41.desc: "[FROM.GetLeader]在訪問我們的首都後找到我們，聲稱代表所有[FROM.GetAdjective]人民發言，希望我們兩國建立軍事同盟，以進一步擴大[ROOT.GetAdjective]和[FROM.GetAdjective]的領土。"
 WW_hungary.41.a: "我們歡迎他們的加入"
 WW_hungary.41.b: "他們對我們沒用"
 WW_hungary.42.t: "[FROM.GetNameDefCap]向大聯盟致敬"
 WW_hungary.42.desc: "[FROM.GetNameDef]的偉大而尊貴的[FROM.GetLeader]已同意建立一個新的軍事聯盟。我們的人民已經走上街頭慶祝這一重大時刻，因為這標誌著[ROOT.GetAdjective]國家的重生，及其人民的新時代的開始。"
 WW_hungary.42.a: "讓我們一起守護我們的未來！"
 WW_hungary.43.t: "[FROM.GetNameDefCap]羞辱了我們"
 WW_hungary.43.desc: "[FROM.GetNameDef]可惡的[FROM.GetLeader]拒絕了我們的請求，從根本上斷絕了我們兩國在不久的將來進行合作的所有機會。因此，我們將不得不尋求其他聯盟，或者走我們自己的路。"
 WW_hungary.43.a: "你只能真正信任家人"
 ENG_Rejected_HUN_grand_alliance: "英格蘭拒絕恢復大同盟"
 WW_hungary.44.t: "[FROM.GetLeader]要求我們恢復維德王朝統治"
 WW_hungary.44.desc: "[FROM.GetNameDefCap]的[FROM.GetLeader]皇帝要求我們復辟維德王朝，再次加冕威廉·維德為我們的君主。這將從根本上結束我們的獨立，但可能使我們免於完全吞併。我們要加入新的帝國聯邦嗎？"
 WW_hungary.44.a: "他們是對的"
 WW_hungary.44.b: "維德被流放是有原因的！"
 WW_hungary.45.t: "[FROM.GetNameDefCap]接受維德家族君主"
 WW_hungary.45.desc: "[FROM.GetNameDef]明智的領導層已決定依照我們的要求，為威廉·維德加冕，並讓位於他們的新王。我們的帝國聯邦將迎來新的曙光！"
 WW_hungary.45.a: "他們做出了正確的選擇"
 WW_hungary.46.t: "[FROM.GetNameDefCap]拒絕維德家族君主"
 WW_hungary.46.desc: "[FROM.GetNameDef]的頹廢領導層決定不辭去他們的職位，他們以某種方式相信他們比天主親自選出的君主更有智慧。不管他們喜不喜歡，我們將推翻他們，讓威廉·維德登基！"
 WW_hungary.46.a: "他們做了錯誤的選擇"
 WW_hungary.47.t: "[FROM.GetLeader]要求我們恢復哈布斯堡的統治"
 WW_hungary.47.desc: "[FROM.GetNameDefCap]的[FROM.GetLeader]皇帝要求我們恢復哈布斯堡對我們土地的統治，如同十一月五日法案商定的那樣，再次加冕一位哈布斯堡作為我們的君主。這將使我們與他們結盟，並加入他們的聯盟，同時不會完全終結我們的獨立。"
 WW_hungary.47.a: "這是我們的職責"
 WW_hungary.47.b: "君主制去死吧！"
 WW_hungary.48.t: "[FROM.GetNameDefCap]接受哈布斯堡君主"
 WW_hungary.48.desc: "[FROM.GetNameDef]明智的領導層已決定依照我們的要求，為一位哈布斯堡君主加冕，並讓位於他們的新王。"
 WW_hungary.48.a: "他們做出了正確的選擇"
 WW_hungary.49.t: "[FROM.GetNameDefCap]拒絕哈布斯堡君主"
 WW_hungary.49.desc: "[FROM.GetNameDef]的頹廢領導層決定不辭去他們的職位，他們以某種方式相信他們比天主親自選出的君主更有智慧。不管他們喜不喜歡，我們將推翻他們，讓卡爾·阿爾布雷希特登基！"
 WW_hungary.49.a: "他們做了錯誤的選擇"
 WW_hungary.50.t: "[FROM.GetNameDefCap]為我們安排了一位哈布斯堡君主"
 WW_hungary.50.desc: "[FROM.GetNameDefCap]已指定卡爾·皮烏斯·馮·哈布斯堡作為我國的新國王。這必將加強我們的政權。"
 WW_hungary.50.a: "確實"
 WW_hungary.51.t: "[FROM.GetLeader]要求我們恢復哈布斯堡的統治"
 WW_hungary.51.desc: "[FROM.GetNameDefCap]的[FROM.GetLeader]皇帝要求我們恢復哈布斯堡對我們土地的統治，如同1516至1700年那樣，再次加冕一位哈布斯堡作為我們的君主。這將使我們與他們結盟，並加入他們的聯盟，同時不會完全終結我們的獨立。"
 WW_hungary.51.a: "這是我們的職責"
 WW_hungary.51.b: "他們以為自己是誰？"
 WW_hungary.52.t: "[FROM.GetNameDefCap]接受哈布斯堡君主"
 WW_hungary.52.desc: "[FROM.GetNameDef]明智的領導層已決定依照我們的要求，為一位哈布斯堡君主加冕，並讓位於他們的新王。"
 WW_hungary.52.a: "他們做出了正確的選擇"
 WW_hungary.53.t: "[FROM.GetNameDefCap]拒絕哈布斯堡君主"
 WW_hungary.53.desc: "[FROM.GetNameDef]的頹廢領導層決定不辭去他們的職位，他們以某種方式相信他們比天主親自選出的君主更有智慧。不管他們喜不喜歡，我們將推翻他們，讓卡爾·皮烏斯登基！"
 WW_hungary.53.a: "他們做了錯誤的選擇"
 WW_hungary.54.t: "[FROM.GetNameDefCap]為我們安排了一位哈布斯堡君主"
 WW_hungary.54.desc: "[FROM.GetNameDefCap]已任命瓦西爾·維希瓦尼伊·馮·哈布斯堡為我們國家的新國王。這無疑會加強我們的政權。"
 WW_hungary.54.a: "確實"
 WW_hungary.55.t: "奧匈帝國提供“保護”"
 WW_hungary.55.desc: "隨著近期巴爾幹地區政局發生巨大變化，我們與新奧匈帝國的關係問題再度湧現。日前，匈牙利大使已經遞交了一份官方照會，正式要求我們表明對帝國的姿態。哈布斯堡王朝聲稱，正如古老的皇冠那樣，波希米亞和摩拉維亞也理應屬於他們。\n\n然而，[HUN.GetLeader]已表示，他會接受一個折衷的解決方案，即他本人名義上是我們國家元首，但實際並不掌握國家大權。"
 WW_hungary.55.a: "我們將回歸帝國"
 WW_hungary.55.b: "我們永遠不會為了安全放棄自由！"
 WW_hungary.56.t: "波希米亞迴歸帝國"
 WW_hungary.56.desc: "經過領導高層的連夜討論，[CZE.GetAdjective]政府已經決定接受我們的提議，同時擁戴阿爾布雷希特·弗朗茨加冕為波希米亞國王、摩拉維亞邊境伯爵兼泰申公爵。前捷軍官兵已宣誓效忠他們的新國王兼皇帝，該國政府機關也已完全整合。"
 WW_hungary.56.a: "距離恢復我們與生俱來的權利，我們又進了一步"
 WW_hungary.57.t: "[CZE.GetNameDefCap]拒絕聯合"
 WW_hungary.57.desc: "[CZE.GetNameDefCap]已拒絕接受與我們在未來達成任何和解或協議。當我們大使抵達該國外交部討論早些時候他遞交的官方照會時，他被告知沒有什麼可談的，並很快就被趕出了門。[CZE.GetAdjective]駐我國大使已經宣佈，雖然其政府希望與我國保持和平友好的關係，但決不可能將[CZE.GetNameDef]併入奧匈帝國。"
 WW_hungary.57.a: "真是不幸……"
 WW_hungary.58.t: "[FROM.GetNameDefCap]要求加利西亞和布科維納的控制權"
 WW_hungary.58.desc: "魯莽的[FROM.GetLeader]最近譴責了我們，宣稱我們非法佔領了加利西亞和布科維納。現在，我們已經收到了[FROM.GetAdjective]的最後通牒，他們的軍隊正在我們邊境集結。我們應該如何回應？"
 WW_hungary.58.a: "不值得為此流血"
 WW_hungary.58.b: "那就過來拿啊！"
 WW_hungary.59.t: "[FROM.GetNameDefCap]交出他們在加利西亞和布科維納的土地"
 WW_hungary.59.desc: "[FROM.GetNameDef]理性的[FROM.GetLeader]同意交出他們在加利西亞和布科維納的領土，已通知他們的部隊撤離該地區。我們再次取得了勝利！"
 WW_hungary.59.a: "真是偉大的一天！"
 WW_hungary.60.t: "[FROM.GetNameDefCap]態度堅決"
 WW_hungary.60.desc: "儘管這並不完全出乎意料，但[FROM.GetNameDef]的愚蠢的[FROM.GetLeader]在收到我們的最後通牒後，已經使國家軍隊進入高度戒備狀態，並派遣特使表明他們在這一爭端上不會退讓一步。"
 WW_hungary.60.a: "他們會後悔自己的決定！"
 WW_hungary.60.b: "我們必須忘掉此事"
 WW_hungary.61.t: "[FROM.GetNameDefCap]恢復德·伊圖爾維德的統治"
 WW_hungary.61.desc: "[FROM.GetNameDefCap]已指定瑪麗亞·約瑟法·索菲婭·德·伊圖爾維德作為我國的新女王。這必將加強我們的政權。"
 WW_hungary.61.a: "確實"
 WW_hungary.62.t: "[FROM.GetLeader]要求我們恢復帝國統治"
 WW_hungary.62.desc: "[FROM.GetNameDefCap]的[FROM.GetLeader]皇帝要求我們恢復伊圖爾維德-哈布斯堡對我們土地的統治，如同1821至1823年和1864至1867年那樣，再次加冕一位君主。這將使我們與他們結盟，並加入他們的聯盟，同時不會完全終結我們的獨立。"
 WW_hungary.62.a: "反正也差不多是時候了"
 WW_hungary.62.b: "他們以為自己是誰？"
 WW_hungary.63.t: "[FROM.GetNameDefCap]接受帝國統治"
 WW_hungary.63.desc: "[FROM.GetNameDef]明智的領導層已決定依照我們的要求，為瑪麗亞·約瑟法·索菲婭·德·伊圖爾維德加冕，並讓位於他們的新女王。"
 WW_hungary.63.a: "他們做出了正確的選擇"
 WW_hungary.64.t: "[FROM.GetNameDefCap]拒絕帝國統治"
 WW_hungary.64.desc: "[FROM.GetNameDef]的頹廢領導層決定不辭去他們的職位，他們以某種方式相信他們比天主親自選出的君主更有智慧。不管他們喜不喜歡，我們將推翻他們，讓瑪麗亞·約瑟法·索菲亞·德·伊圖爾比德登基！"
 WW_hungary.64.a: "他們做了錯誤的選擇"
 WW_hungary.65.t: "[FROM.GetNameDefCap]為我們安排了一位哈布斯堡君主"
 WW_hungary.65.desc: "[FROM.GetNameDefCap]已指定約瑟夫·弗朗西斯·馮·哈布斯堡作為我國的新國王。這必將加強我們的政權。"
 WW_hungary.65.a: "確實"
 WW_hungary.66.t: "[FROM.GetLeader]要求我們恢復哈布斯堡的統治"
 WW_hungary.66.desc: "[FROM.GetNameDefCap]的[FROM.GetLeader]皇帝要求我們恢復哈布斯堡對我們土地的統治，就像奧匈帝國解體前那樣，再次加冕一位哈布斯堡作為我們的君主。不過，他們承諾給予我們比以前更多的自治權，建立所謂的三元帝國。我們該怎麼答覆？"
 WW_hungary.66.a: "這正是我們一直想要的！"
 WW_hungary.66.b: "他們以為自己是誰？"
 WW_hungary.67.t: "[FROM.GetNameDefCap]接受哈布斯堡君主"
 WW_hungary.67.desc: "[FROM.GetNameDef]明智的領導層已決定依照我們的要求，為一位哈布斯堡君主加冕，並讓位於他們的新王。"
 WW_hungary.67.a: "他們做出了正確的選擇"
 WW_hungary.68.t: "[FROM.GetNameDefCap]拒絕哈布斯堡君主"
 WW_hungary.68.desc: "[FROM.GetNameDef]的頹廢領導層決定不辭去他們的職位，他們以某種方式相信他們比天主親自選出的君主更有智慧。不管他們喜不喜歡，我們將推翻他們，讓約瑟夫·弗朗西斯登基！"
 WW_hungary.68.a: "他們做了不明智的選擇……"
 WW_hungary.69.t: "[FROM.GetLeader]要求我們恢復哈布斯堡的統治"
 WW_hungary.69.desc: "[FROM.GetNameDefCap]的[FROM.GetLeader]皇帝要求我們恢復哈布斯堡對我們土地的統治，就像我們與意大利統一之前的那樣，再次加冕一位哈布斯堡作為我們的君主。不過，他們承諾給予我們比以前更多的自治權。我們該怎麼答覆？"
 WW_hungary.69.a: "我們很樂意加入"
 WW_hungary.69.b: "他們以為自己是誰？"
 WW_hungary.70.t: "[FROM.GetNameDefCap]接受哈布斯堡君主"
 WW_hungary.70.desc: "[FROM.GetNameDef]明智的領導層已決定依照我們的要求，為一位哈布斯堡君主加冕，並讓位於他們的新王。"
 WW_hungary.70.a: "他們做出了正確的選擇"
 WW_hungary.71.t: "[FROM.GetNameDefCap]拒絕哈布斯堡君主"
 WW_hungary.71.desc: "[FROM.GetNameDef]的頹廢領導層決定不辭去他們的職位，他們以某種方式相信他們比天主親自選出的君主更有智慧。不管他們喜不喜歡，我們將推翻他們，讓羅伯特登基！"
 WW_hungary.71.a: "他們做了不明智的選擇……"
 WW_hungary.72.t: "[FROM.GetNameDefCap]要求控制我們的[SIL.GetAdjective]領土"
 WW_hungary.72.desc: "魯莽的[FROM.GetLeader]最近譴責了我們，他聲稱我們非法佔領了[FROM.GetAdjective]的西里西亞。現在，我們已經收到了[FROM.GetAdjective]最後通牒，他們的軍隊正在我們邊境集結。我們應該如何回應？"
 WW_hungary.72.a: "不值得為此流血"
 WW_hungary.72.b: "那就過來拿啊！"
 WW_hungary.73.t: "[FROM.GetNameDefCap]交出他們的[SIL.GetAdjective]領土"
 WW_hungary.73.desc: "[FROM.GetNameDef]理性的[FROM.GetLeader]同意交出他們在西里西亞的領土，已通知他們的部隊撤離該地區。我們再次取得了勝利！"
 WW_hungary.73.a: "真是偉大的一天！"
 WW_hungary.74.t: "[FROM.GetNameDefCap]在西里西亞問題上態度堅決"
 WW_hungary.74.desc: "儘管這並不完全出乎意料，但[FROM.GetNameDef]的愚蠢的[FROM.GetLeader]在收到我們的最後通牒後，已經使國家軍隊進入高度戒備狀態，並派遣特使表明他們在這一爭端上不會退讓一步。"
 WW_hungary.74.a: "他們會後悔自己的決定！"
 WW_hungary.74.b: "我們必須忘掉此事"
 WW_hungary.75.t: "[FROM.GetNameDefCap]索取聖地"
 WW_hungary.75.desc: "魯莽的[FROM.GetLeader]已呼籲[FROM.GetAdjective]軍隊佔領聖地，並要求我們交出該地區並撤回我們的軍隊。如果我們不小心，情況可能會失控。我們應該如何回應？"
 WW_hungary.75.a: "天主教的捍衛者可以擁有它"
 WW_hungary.75.b: "已經有多少次十字軍失敗了？"
 WW_hungary.76.t: "[FROM.GetNameDefCap]交出聖地"
 WW_hungary.76.desc: "[FROM.GetNameDef]理性的[FROM.GetLeader]同意交出巴勒斯坦，已通知他們的部隊撤離該地區。我們再次取得了勝利！"
 WW_hungary.76.a: "真是偉大的一天！"
 WW_hungary.77.t: "[FROM.GetNameDefCap]在聖地問題上態度堅決"
 WW_hungary.77.desc: "儘管這並不完全出乎意料，但[FROM.GetNameDef]的愚蠢的[FROM.GetLeader]在收到我們的最後通牒後，已經使國家軍隊進入高度戒備狀態，並派遣特使表明他們在這一爭端上不會退讓一步。"
 WW_hungary.77.a: "他們會後悔自己的決定！"
 WW_hungary.77.b: "我們必須忘掉此事"
 WW_hungary.78.t: "[FROM.GetNameDefCap]為我們安排了一位新領袖"
 WW_hungary.78.desc: "[FROM.GetNameDefCap]已指定了一位新教宗作為我國的領袖。這必將加強我們的政權。"
 WW_hungary.78.a: "確實"
 WW_hungary.79.t: "[FROM.GetNameDefCap]為我們安排了一位新領袖"
 WW_hungary.79.desc: "[FROM.GetNameDefCap]已指定了一位新君主作為我國的領袖。這必將加強我們的政權。"
 WW_hungary.79.a: "確實"
 WW_hungary.80.t: "[HUN.GetNameDefCap]正在想辦法吞併我們"
 WW_hungary.80.desc: "[HUN.GetNameDefCap]已決定是時候將我們的土地重新整合進奧匈帝國了。我們除了接受現實沒什麼可做的……"
 WW_hungary.80.a: "理應如此"
 WW_hungary.80.b: "他們永遠不會活著抓住我們！"
 WW_hungary.81.t: "[FROM.GetNameDefCap]接受整合"
 WW_hungary.81.desc: "[FROM.GetNameDefCap]決定接受我們的要求，讓他們的土地被重新整合進奧匈帝國。今天對帝國來說是偉大的一天！"
 WW_hungary.81.a: "世界上一切都很好"
 WW_hungary.82.t: "[FROM.GetNameDefCap]拒絕整合"
 WW_hungary.82.desc: "[FROM.GetNameDefCap]決定拒絕我們的要求，不讓他們的土地被重新整合進奧匈帝國。因此，我們將不得不使用武力……"
 WW_hungary.82.a: "我們會讓他們付出代價"
 WW_hungary.83.t: "[FROM.GetNameDefCap]提議購買[975.GetName]"
 WW_hungary.83.desc: "[HUN.GetAdjective]政府仍將[975.GetName]視為其領土的一部分，稱其在帝國時期曾是匈牙利的一部分，因此應該得到歸還。他們現在已經向我們提出了一個提議，希望以一個不錯的價格從我們這裡回購該地區。"
 WW_hungary.83.a: "我們將盡可能多地拿錢"
 WW_hungary.83.b: "[975.GetName]是[ROOT.GetAdjective]的！"
 WW_hungary.84.t: "[FROM.GetNameDefCap]將[975.GetName]賣給我們"
 WW_hungary.84.desc: "[FROM.GetNameDef]的理智的[FROM.GetLeader]已同意將[975.GetName]移交給我們，並已收到我們承諾的付款。今天對[ROOT.GetAdjective]人民來說是個偉大的日子！"
 WW_hungary.84.a: "完美"
 WW_hungary.85.t: "[From.GetNameDefCap]拒絕我們的提議"
 WW_hungary.85.desc: "儘管並不完全出人意料，[FROM.GetNameDef]的愚蠢的[FROM.GetLeader]拒絕了我們的請求，並派遣了一名特使聲明他們將在[975.GetName]的爭端中絕不退讓。"
 WW_hungary.85.a: "他們會後悔自己的決定！"
 WW_hungary.85.b: "他們不同意，我們將尊重他們的決定"
 WW_hungary.86.t: "[FROM.GetNameDefCap]在[975.GetName]發動起義"
 WW_hungary.86.desc: "隸屬於[FROM.GetAdjective]的準軍事組織的叛軍已經控制了[975.GetName]地區的關鍵建築，並匆忙舉行了一次全民公投，以便重新加入[FROM.GetNameDef]，結果明顯被操縱，贊成加入的票數遠遠超過反對。我們的部隊已在附近待命，但正在等待命令，以判斷干預是否為正確的行動選擇。"
 WW_hungary.86.a: "我們無力對抗他們"
 WW_hungary.86.b: "他們會後悔自己的決定！"
 WW_hungary.87.t: "[FROM.GetNameDefCap]希望加入我們的陣營"
 WW_hungary.87.desc: "[FROM.GetLeader]訪問我們的首都後與我們會談，聲稱代表所有[FROM.GetAdjective]人民，希望我們兩國能夠在軍事聯盟中相互加入，他們的目的是保護[ROOT.GetAdjective]和[FROM.GetAdjective]兩國人民的安全。"
 WW_hungary.87.a: "我們歡迎他們的加入"
 WW_hungary.87.b: "他們對我們沒用"
 WW_hungary.88.t: "[FROM.GetNameDefCap]讓我們加入他們"
 WW_hungary.88.desc: "[FROM.GetNameDef]的[FROM.GetLeader]已同意組建一個新的軍事聯盟，加強我們國家之間的聯繫。我們的人民走上街頭慶祝這一重大時刻，因為這標誌著[ROOT.GetAdjective]國家的重生，以及我們人民的一個新的、更安全的時代的開始。"
 WW_hungary.88.a: "讓我們一起建設我們的未來！"
 WW_hungary.89.t: "[FROM.GetNameDefCap]不允許我們加入他們"
 WW_hungary.89.desc: "[FROM.GetNameDef]的[FROM.GetLeader]拒絕了我們的請求，實質上是禁止了我們兩國在不久的將來進行合作的所有機會。因此，我們將不得不尋求其他聯盟，或者依靠我們自己。"
 WW_hungary.89.a: "本不應如此"
 WW_hungary.90.t: "使徒國王的加冕"
 WW_hungary.90.desc: "現在已經決定正式恢復君主制，但我們遇到了一個問題。還沒有出現合適的候選人，攝政王需要儘快做出選擇。他可以加冕自己，儘管這將廣受不滿，或者可能選擇另一條路線，加冕他的兒子霍爾蒂·伊斯特萬，他在人民中非常受歡迎。應該選擇誰來擔任這個職位？"
 WW_hungary.90.a: "霍爾蒂·米克洛什是當然的人選"
 WW_hungary.90.b: "霍爾蒂·伊什特萬有人民的支持"
 WW_hungary.91.t: "[FROM.GetNameDefCap]提議聯合"
 WW_hungary.91.desc: "[HUN.GetAdjective]政府向我們提出了一個有趣的提議，希望建立一個統一的國家。當然，他們希望按照他們的條件進行，這意味著他們的政府將統治兩國，但這也許是最安全的選擇？"
 WW_hungary.91.a: "很好，我們接受"
 WW_hungary.91.b: "他們真是自大至極"
 WW_hungary.92.t: "[FROM.GetNameDefCap]同意共治"
 WW_hungary.92.desc: "[FROM.GetNameDef]理性的[FROM.GetLeader]同意交出政府控制權，已開始了將我們兩國統一在一位國王治下的流程。我們再次取得了勝利！"
 WW_hungary.92.a: "太好了！"
 WW_hungary.93.t: "[From.GetNameDefCap]拒絕共治"
 WW_hungary.93.desc: "儘管並不完全出人意料，[FROM.GetNameDef]的愚蠢領導人[FROM.GetLeader]在收到我們的提議後，使國家部隊進入了高度戒備狀態，並派遣了一名特使，聲明他們不會退讓一步，聲稱“羅馬尼亞就是羅馬尼亞！”"
 WW_hungary.93.a: "這是他們的選擇"
 WW_hungary.94.t: "選舉新的[ROOT.GetAdjective]總統"
 WW_hungary.94.desc: "內戰塵埃落定後，國家迫切需要一個民選的人民代表。一方有深受歡迎的保守政治家，匈牙利前總理卡羅伊·米哈伊。另一方是共產主義者，他們中的部分支持將前匈牙利蘇維埃共和國領導人庫恩·貝拉重新掌權，另外一部分支持最近在前線表現出色的斯大林主義者拉科西·馬加什。誰將引領國家走向未來？"
 WW_hungary.94.a: "庫恩·貝拉必須重掌權力"
 WW_hungary.94.b: "拉科西·馬加什贏得了人民的尊敬"
 WW_hungary.94.c: "卡羅伊·米哈伊應該領導我們"
 WW_hungary.95.t: "第二共和國的首次總統選舉"
 WW_hungary.95.desc: "現在終於到了為國家舉行總統選舉的時候，確保我們的民主原則能在歐洲中心熠熠生輝。參選的主要候選人有第一共和國總統卡羅伊·米哈伊，匈牙利社會民主黨領袖薩卡希奇·阿爾帕德，以及匈牙利基督教經濟和社會黨領袖、匈牙利科學院成員齊奇·亞諾什。匈牙利的未來將如何？"
 WW_hungary.95.a: "卡羅伊·米哈伊知道如何領導"
 WW_hungary.95.b: "薩卡希奇·阿爾帕德可以開創良好的中間路線"
 WW_hungary.95.c: "齊奇·亞諾什可以幫助我們重新崛起"
 WW_hungary.96.t: "[FROM.GetNameDefCap]要求控制我們的[SLO.GetAdjective]領土"
 WW_hungary.96.desc: "冒失的[FROM.GetLeader]最近譴責我們非法佔領[FROM.GetAdjective]的斯洛伐克。現在，我們收到了[FROM.GetAdjective]的最後通牒，他們的軍隊正在我們的邊界集結。我們應該如何應對？"
 WW_hungary.96.a: "不值得為此流血"
 WW_hungary.96.b: "那就過來拿啊！"
 WW_hungary.97.t: "[FROM.GetNameDefCap]交出他們的[SLO.GetAdjective]領土"
 WW_hungary.97.desc: "[FROM.GetNameDef]理性的[FROM.GetLeader]同意交出他們在斯洛伐克的領土，已通知他們的部隊撤離該地區。我們再次取得了勝利！"
 WW_hungary.97.a: "真是偉大的一天！"
 WW_hungary.98.t: "[FROM.GetNameDefCap]在斯洛伐克問題上態度堅決"
 WW_hungary.98.desc: "儘管這並不完全出乎意料，但[FROM.GetNameDef]愚蠢的[FROM.GetLeader]在收到我們的最後通牒後，已經讓國家軍隊進入高度戒備狀態，並派遣特使表明他們在這一爭端上不會退讓一步。"
 WW_hungary.98.a: "他們會後悔自己的決定！"
 WW_hungary.98.b: "我們必須忘掉此事"
 WW_hungary.99.t: "匈牙利要求塞凱伊地區的宗主權"
 WW_hungary.99.desc: "包括[76.GetName]大部分地區的區域，被[HUN.GetAdjective]人稱為塞凱伊地區，主要居住著他們的同胞塞凱伊匈牙利人。他們說著自己獨特的方言，擁有自己獨特的文化，因此[HUN.GetLeader]表示不需要這些人成為他們國家的一部分。然而，他們希望成為這些人民的守護者，並向我們索要該地區的宗主權。"
 WW_hungary.99.a: "為了一個更公正的世界！"
 WW_hungary.99.b: "他們顯然是妄想"
 WW_hungary.100.t: "[FROM.GetName]授予我們塞凱伊地區的保護權"
 WW_hungary.100.desc: "[FROM.GetNameDef]的[FROM.GetLeader]接受了我們的要求，將塞凱伊地區作為一個自治區交給了我們。我們現在的任務是保護和改善該地區。"
 WW_hungary.100.a: "終於團聚了！"
 WW_hungary.101.t: "[FROM.GetName]拒絕給予我們塞凱伊地區的保護權"
 WW_hungary.101.desc: "[FROM.GetNameDef]的[FROM.GetLeader]拒絕了我們對塞凱伊自治區索取保護權。塞凱伊人民仍然處於脆弱和無保護的狀態。鑑於他們當前的統治者對他們漠不關心，我們是否應該介入並佔領該地區？"
 WW_hungary.101.a: "他們會後悔自己的行動"
 WW_hungary.101.b: "我們能做的不多"
 WW_hungary.102.t: "進軍布達佩斯"
 WW_hungary.102.desc: "經過數月針對攝政霍爾蒂·米克羅什的抗議活動後，法西斯運動受到鐮刀十字叛亂和墨索里尼進軍羅馬的啟發，現在已經向我們的首都進軍，要求霍爾蒂下臺，讓更受青睞的根伯什·久洛接替他的職位。"
 WW_hungary.102.a: "必須讓根伯什行使緊急權力！"
 WW_hungary.103.t: "薩拉希·費倫茨政變"
 WW_hungary.103.desc: "根伯什武裝了國民意志黨讓他們前往布達佩斯遊行，以便他能夠取得國家領導權，之後便不再需要他們，他已採取行動壓制他們。然而今天早上，這夥人包圍了布達佩斯的山多爾宮，要求他讓位於他們的領袖薩拉希·費倫茨。作為回應，匈牙利國防軍協會開始包圍城市，國家處於崩潰的邊緣。下一步該怎麼辦？"
 WW_hungary.103.a: "退位，讓薩拉希成為新的國家領袖。"
 WW_hungary.103.b: "我們同意他們的條款，但有一個條件"
 WW_hungary.104.t: "[FROM.GetNameDefCap]要求克羅地亞的控制權"
 WW_hungary.104.desc: "最近，魯莽的[FROM.GetLeader]譴責我們非法佔領了克羅地亞的土地。現在，我們收到了[FROM.GetAdjective]的最後通牒，他們的部隊正在邊境集結。我們該如何回應？"
 WW_hungary.104.a: "不值得為此流血"
 WW_hungary.104.b: "那就過來拿啊！"
 WW_hungary.105.t: "[FROM.GetNameDefCap]交出他們在克羅地亞的土地"
 WW_hungary.105.desc: "[FROM.GetNameDef]理性的[FROM.GetLeader]同意交出他們在克羅地亞的領土，已通知他們的部隊撤離該地區。我們再次取得了勝利！"
 WW_hungary.105.a: "真是偉大的一天！"
 WW_hungary.106.t: "[FROM.GetNameDefCap]態度堅決"
 WW_hungary.106.desc: "儘管這並不完全出乎意料，但[FROM.GetNameDef]愚蠢的[FROM.GetLeader]在收到我們的最後通牒後，已經讓國家軍隊進入高度戒備狀態，並派遣特使表明他們在這一爭端上不會退讓一步。"
 WW_hungary.106.a: "他們會後悔自己的決定！"
 WW_hungary.106.b: "我們必須忘掉此事"
 WW_hungary.108.t: "[FROM.GetNameDefCap]希望加冕赫爾曼·戈林為國王"
 WW_hungary.108.desc: "\n隨著[FROM.GetAdjective]領導層在[FROM.GetLeader]的帶領下與我們緊密結盟，他們請求為一位德國國王加冕[FROM.GetAdjective]的王冠。他們選定了赫爾曼·戈林，並且他們的歷史學家已經開始撰寫他與舊匈牙利領袖阿爾帕德的聯繫。我們應該允許他前往[FROM.GetNameDef]嗎？"
 WW_hungary.108.a: "我們允許"
 WW_hungary.108.b: "這不合適"
 WW_hungary.109.t: "[FROM.GetLeader]允許加冕戈林"
 WW_hungary.109.desc: "偉大的[GER.GetLeader]已允許赫爾曼·戈林移居我們的國家，並按新憲法的規定成為我們人民的國王。我們的關係日益緊密，長久以來空缺的王位終於有人坐上了。"
 WW_hungary.109.a: "我們十分感激"
 WW_hungary.110.t: "[FROM.GetLeader]不允許戈林加冕"
 WW_hungary.110.desc: "儘管糾纏不斷、論據充分，偏執的[FROM.GetLeader]決定不允許赫爾曼·戈林移居到我們的國家。我們將不得不在沒有國王的情況下，讓薩拉西成為國家的唯一領導。"
 WW_hungary.110.a: "似乎不再是一個王國了"
 WW_hungary.111.t: "公投加入[HUN.GetAdjective]國家"
 WW_hungary.111.desc: "在過去的一個月中，[664.GetName]正在進行一項公眾公投，目的是決定他們是否希望加入[HUN.GetNameDef]。該公投經國際觀察員批准，可以認為幾乎沒有投票舞弊行為發生。然而，結果顯示，大部分人投票選擇離開我們的國家。我們應該接受這個結果嗎？"
 WW_hungary.111.a: "如果這是人民的願望"
 WW_hungary.111.b: "公投造假"
 WW_hungary.112.t: "[FROM.GetNameDefCap]接受公投結果"
 WW_hungary.112.desc: "[FROM.GetNameDef]的領導層公開表示，他們堅定支持[664.GetName]地區人民的自決權。[FROm.GetLeader]在本週早些時候表示，現在是這些民眾選擇希望居住的國家的時候了，該國從根本上放棄了對該地區的主張。"
 WW_hungary.112.a: "合理的回應"
 WW_hungary.113.t: "[FROM.GetNameDefCap]宣佈公投結果無效"
 WW_hungary.113.desc: "[FROM.GetNameDef]的領導層公開宣稱，本月早些時候在[664.GetName]地區舉行的公投結果無效，他們聲稱投票率和國際觀察員存在嚴重欺詐行為，這些人顯然對[ROOT.GetAdjective]政府持有偏見。"
 WW_hungary.113.a: "我們只能接受"
 WW_hungary.114.t: "公投加入[HUN.GetAdjective]國家"
 WW_hungary.114.desc: "在過去一個月中，[73.GetName]進行了一場公投，目的是決定他們是否希望加入[HUN.GetNameDef]。公投經過國際觀察員審查，可以放心認為幾乎沒有選舉舞弊行為。然而，結果顯示，大部分人投票選擇離開我們的國家。我們應該接受這個結果嗎？"
 WW_hungary.114.a: "如果這是人民的願望"
 WW_hungary.114.b: "公投造假"
 WW_hungary.115.t: "[FROM.GetNameDefCap]接受公投結果"
 WW_hungary.115.desc: "[FROM.GetNameDef]的領導層公開表示，他們堅定支持[73.GetName]地區人民的自決權。[FROm.GetLeader]在本週早些時候表示，現在是時候讓當地人選擇希望居住的國家了，該國從根本上放棄了對該地區的主張。"
 WW_hungary.115.a: "合理的回應"
 WW_hungary.116.t: "[FROM.GetNameDefCap]宣佈公投結果無效"
 WW_hungary.116.desc: "[FROM.GetNameDef]的領導層公開宣稱，本月早些時候在[73.GetName]地區舉行的公投結果無效，他們聲稱投票率和國際觀察員存在嚴重欺詐，明顯偏向[ROOT.GetAdjective]政府。"
 WW_hungary.116.a: "我們只能接受"
 WW_hungary.117.t: "公投加入[HUN.GetAdjective]國家"
 WW_hungary.117.desc: "在[45.GetName]地區已進行了一個月的公共公投，目的是決定他們是否希望加入[HUN.GetNameDef]。由於得到了國際觀察員的審查，可以認為幾乎沒有投票舞弊。然而，結果顯示，大部分人投票選擇離開我們的國家。我們應該接受這個結果嗎？"
 WW_hungary.117.a: "如果這是人民的願望"
 WW_hungary.117.b: "公投造假"
 WW_hungary.118.t: "[FROM.GetNameDefCap]接受公投結果"
 WW_hungary.118.desc: "[FROM.GetNameDef]的領導層公開表態，他們堅定支持[45.GetName]地區人民的自決權。[FROm.GetLeader]本週早些時候表示，現在是當地人選擇希望居住的國家的時候了，該國基本上放棄了對該地區的主張。"
 WW_hungary.118.a: "合理的回應"
 WW_hungary.119.t: "[FROM.GetNameDefCap]宣佈公投結果無效"
 WW_hungary.119.desc: "[FROM.GetNameDef]的領導層公開宣稱，本月早些時候在[45.GetName]地區舉行的公投結果無效，他們聲稱投票率和國際觀察員存在嚴重欺詐，明顯偏向[ROOT.GetAdjective]政府。"
 WW_hungary.119.a: "我們只能接受"
 WW_hungary.120.t: "公投加入[HUN.GetAdjective]國家"
 WW_hungary.120.desc: "在[76.GetName]地區已進行了一個月的公共公投，目標是決定他們是否希望加入[HUN.GetNameDef]。由於得到了國際觀察員的審查，可以認為幾乎沒有投票舞弊。然而，結果顯示，大部分人投票選擇離開我們的國家。我們應該接受這個結果嗎？"
 WW_hungary.120.a: "如果這是人民的願望"
 WW_hungary.120.b: "公投造假"
 WW_hungary.121.t: "[FROM.GetNameDefCap]接受公投結果"
 WW_hungary.121.desc: "[FROM.GetNameDef]的領導層公開表態，他們堅定支持[76.GetName]地區人民的自決權。[FROm.GetLeader]本週早些時候表示，現在是當地人選擇希望居住的國家的時候了，該國基本上放棄了對該地區的主張。"
 WW_hungary.121.a: "合理的回應"
 WW_hungary.122.t: "[FROM.GetNameDefCap]宣佈公投結果無效"
 WW_hungary.122.desc: "[FROM.GetNameDef]的領導層公開宣稱，本月早些時候在[76.GetName]地區舉行的公投結果無效，他們聲稱投票率和國際觀察員存在嚴重欺詐，明顯偏向[ROOT.GetAdjective]政府。"
 WW_hungary.122.a: "我們只能接受"
 WW_hungary.123.t: "鐮刀十字進軍布達佩斯"
 WW_hungary.123.desc: "我們的部隊攔截了一夥人，他們是激進的國家社會主義政治家伯瑟爾梅尼·佐爾坦及其追隨者，正在向布達佩斯進軍，這些人的政變企圖受到了墨索里尼“進軍羅馬”的重大影響。這位自稱為“智慧巨人中的巨人，偉大的匈牙利詩人，擁有先知使命”的邊緣政治活動人士，已將其一群不滿的農民追隨者聚集在他們的“鐮刀十字”旗幟下，正向我們的首都前進。我們應該如何處理這種情況？"
 WW_hungary.123.a: "驅散他們並逮捕他們可悲的領袖！"
 WW_hungary.123.b: "開火嚇走他們"
 HUN_third_mexican_empire_tt: "§Y墨西哥§!將被稱作§Y墨西哥第三帝國§!。\n"
 HUN_croatia_slavonia_tt: "§Y克羅地亞§!將被稱作§Y克羅地亞-斯拉沃尼亞王國§!。\n"
 HUN_bohemia_and_silesia_tt: "§Y捷克斯洛伐克§!將被稱作§Y波希米亞-摩拉維亞及西里西亞王國§!。\n"
 HUN_cisleithania_tt: "§Y奧地利§!將被稱作§Y帝國議會代表之王國及領土§!。\n"
 WW_hungary.124.t: "一個男人重返故鄉"
 WW_hungary.124.desc: "今天早上，哥里當局報告稱，有一名男子要求歸還他聲稱曾屬於他的農場莊園，稱他剛剛從俄羅斯的魔掌中逃脫並返回家鄉。他還承諾，如果允許他進入政界，他可以帶領我們的國家走向輝煌，據稱他出身於一個成功的政治家世家。為了實現大格魯吉亞夢想，這是我們需要的那個人嗎？"
 WW_hungary.124.a: "立刻給這個人一個職位！"
 WW_hungary.124.b: "無論他說什麼，我們都不能信任他"
 ### HUN news events ###
 wuw_HUN_news_events.1.t: "[HUN.GetNameDEFCAP]宣佈傑爾計劃"
 wuw_HUN_news_events.1.d: "\n在[HUN.GetLeader]的領導下，[HUN.GetAdjective]政府宣佈了一項新的大規模工業計劃，旨在儘可能快地重新武裝國家。外國觀察家認為這是[HUN.GetNameDef]對其鄰國的一種侵略行為，但時間將告訴我們他們的真正意圖。"
 wuw_HUN_news_events.1.a: "他們在為某事做準備……"
 wuw_HUN_news_events.1.b: "這將確保我們的未來！"
 wuw_HUN_news_events.2.t: "[HUN.GetNameDefCap]加入[GER.GetAdjective]人"
 wuw_HUN_news_events.2.d: "在簽署了一項新的互助和進一步推進各自國家目標的協定後，[GER.GetLeader]和[HUN.GetLeader]今天宣佈[HUN.GetNameDef]加入[GER.GetAdjective]的陣營。"
 wuw_HUN_news_events.2.a: "這將如何發展？"
 wuw_HUN_news_events.2.b: "為了更偉大的未來！"
 wuw_HUN_news_events.2.c: "他們將成為有用的棋子"
 wuw_HUN_news_events.3.t: "[HUN.GetNameDefCap]重組同盟國"
 wuw_HUN_news_events.3.desc: "\n由於在其近鄰區域沒有可行的聯盟選擇，[HUN.GetNameDef]決定再次重組同盟國。在擺脫了強加給他們的條約後，這個國家迅速轉向重新軍事化。這個新聯盟是否會像那次世界大戰時期的同名聯盟一樣，尚待觀察。"
 wuw_HUN_news_events.3.a: "非常令人擔憂"
 wuw_HUN_news_events.3.b: "我們將重奪過去的榮耀！"
 wuw_HUN_news_events.3.c: "他們繼承了我們的遺產"
 GER_Rejected_HUN_central_powers: "德國拒絕我們加入同盟國"
 wuw_HUN_news_events.4.t: "[HUN.GetNameDefCap]宣佈全球霸權"
 wuw_HUN_news_events.4.desc: "[HUN.GetNameDef]的[HUN.GetLeader]宣佈了該國主宰全球的雄心，並在所有大陸上建立[HUN.GetAdjective]霸權。他們聲稱這是使徒王國的人民的天賦權利，並且他們再也不會向外國勢力低頭。"
 wuw_HUN_news_events.4.a: "他們必須被摧毀！"
 wuw_HUN_news_events.4.b: "世界是我們的囊中之物！"
 wuw_HUN_news_events.5.t: "[HUN.GetLeader]秉承匈牙利王位"
 wuw_HUN_news_events.5.desc: "尋求國王的[HUN.GetAdjective]經過長時間的談判和準備，本週早些時候正式加冕了[HUN.GetLeader]。今天，在布達佩斯皇宮的莊嚴儀式中，他在廣大的歡呼和慶祝中被加冕為匈牙利國王。"
 wuw_HUN_news_events.5.a: "終於，一位國王！"
 wuw_HUN_news_events.5.b: "一個新敵人崛起了"
 wuw_HUN_news_events.5.c: "一個潛在的盟友？"
 wuw_HUN_news_events.6.t: "約瑟夫·奧古斯特秉承匈牙利王位"
 wuw_HUN_news_events.6.desc: "尋求國王的[HUN.GetAdjective]經過長時間的談判和準備，在本週早些時候正式加冕了約瑟夫·奧古斯特·馮·哈布斯堡，他是匈牙利的最後一位巴拉丁、奧地利大公以及匈牙利和波希米亞的王子，同時還是前奧匈帝國軍隊的戰地元帥。今天，在布達佩斯皇宮的莊嚴儀式中，他在廣大的歡呼和慶祝中被加冕為匈牙利國王。\n作為一位維泰茲和哈布斯堡貴族，新國王的意識形態傾向非常明確，他已經宣佈他將“不破壞解散奧匈帝國的條約，讓匈牙利得到應有的偉大。”，並且國王承諾“糾正過去加諸於我們的不公”，因此這次加冕不太可能導致該地區緊張局勢的緩解。"
 wuw_HUN_news_events.6.a: "終於，一位國王！"
 wuw_HUN_news_events.6.b: "一個新敵人崛起了"
 wuw_HUN_news_events.6.c: "一個潛在的盟友？"
 wuw_HUN_news_events.7.t: "恢復匈牙利蘇維埃共和國"
 wuw_HUN_news_events.7.desc: "今天，匈牙利中央執行委員會主席庫恩·貝拉宣佈重新建立匈牙利蘇維埃社會主義聯邦共和國，該共和國曾在1919年8月突然結束。雖然它過去曾被反革命力量和小協約國聯合鎮壓，但庫恩·貝拉表示，這次將會有所不同。未來幾年巴爾幹半島會有何變數？"
 wuw_HUN_news_events.7.a: "全世界的工人們，聯合起來！"
 wuw_HUN_news_events.7.b: "他們到底在計劃什麼？"
 wuw_HUN_news_events.7.c: "修正主義者的假象……"
 wuw_HUN_news_events.8.t: "宣佈成立匈牙利人民共和國"
 wuw_HUN_news_events.8.desc: "今天，匈牙利總書記馬加什·拉科西宣佈成立新的匈牙利人民共和國，並宣佈尋求與[SOV.GetNameDef]加強合作。儘管他宣稱國家是一個開放的民主國家，但並不難察覺該國的獨裁統治。匈牙利人民的未來將如何？"
 wuw_HUN_news_events.8.a: "終於！"
 wuw_HUN_news_events.8.b: "和平從未是一種選擇……"
 wuw_HUN_news_events.8.c: "這當然令人意外，但也是個驚喜"
 wuw_HUN_news_events.9.t: "[HUN.GetNameDefCap]佔領布爾根蘭"
 wuw_HUN_news_events.9.desc: "本週早些時候，[HUN.GetAdjective]部隊進入艾森施塔特，佔領了該地區。他們聲稱這是為了保護該地區的[HUN.GetAdjective]民眾，這些民眾最近走上街頭抗議在他們看來是《特里亞農條約》後對該地區的非法佔領。這是否可能導致巴爾幹地區的新戰爭，還是僅僅是輕微的邊界調整？"
 wuw_HUN_news_events.9.a: "物歸原主"
 wuw_HUN_news_events.9.b: "那不屬於他們！"
 wuw_HUN_news_events.9.c: "有趣的發展"
 ##### Belgian events #####
 #### Historical ####
 ### Political Events
 #Government Resigns
 ww_BEL_event_political.1.t: "政府辭職，開啟提前選舉"
 ww_BEL_event_political.1.desc: "由於正在發生的腐敗醜聞，政府最終迫於壓力垮臺了。萊昂·德格萊勒——法西斯性質的雷克斯主義黨領導人——率領的調查員團隊，已經對政府部長的賄賂進行了數年的調查，結果發現了大量的賄款。\n\n為了恢復合法性，飽受爭議的總理保羅·範澤蘭宣佈開啟提前選舉，以恢復公信力和合法性，現在選舉結果已經公佈。\n\n由埃米爾·王德威爾得領導的比利時工人黨（Parti Ouvrier Belge）表現最佳，主要原因是他的政治對手不受群眾歡迎。他可以以此勝利為基礎，單獨組建少數黨政府，或與保羅·範澤蘭的天主教黨合作，組建一個更穩定的多數黨，成立民族團結政府。\n\n同樣值得注意的是萊昂·德格萊勒的雷克斯主義黨也取得了非常好的成績，他的反腐敗立場證明非常受歡迎。"
 ww_BEL_event_political.1.a: "組建民族團結政府"
 ww_BEL_event_political.1.b: "王德威爾得組建少數派政府"
 BEL_paul_van_zeeland_remains_tt: "§Y保羅·範澤蘭§!仍擔任總理，領導擴大的§Y民主§!黨派聯盟。"
 #Corrupt Zeeland
 ww_BEL_event_political.2.t: "保羅·範澤蘭腐敗醜聞"
 ww_BEL_event_political.2.desc: "保羅·範澤蘭領導的天主教黨今天因為腐敗醜聞遭到更大的打擊，因為發現總理本人接受了“捐款”！看起來他的政府很快就會再次垮臺……"
 ww_BEL_event_political.2.a: "這腐敗還沒完沒了了？！"
 #Royal Appointment
 ww_BEL_event_political.3.t: "王室欽點"
 ww_BEL_event_political.3.desc: "保羅·範澤蘭終於辭去了總理職務，並以恥辱的身份離開他的崗位。這次，國王利奧波德三世親自宣佈他將介入此事並任命一名新總理。有兩個主要候選人：\n\n既是自由黨成員，也是民族團結政府成員的保羅·埃米爾·揚松被認為是一個穩健的選擇。另一人是萊昂·德格雷勒，此人被譽為法治和秩序的代言人，且其黨派最近在選舉中的成功助漲了這一讚譽。"
 ww_BEL_event_political.3.a: "任命穩健的人，自由派的保羅·埃米爾·揚松。"
 ww_BEL_event_political.3.b: "選擇雷克斯主義者萊昂·德格雷勒，恢復法律與秩序。"
 #Budgetary Crisis
 ww_BEL_event_political.4.t: "預算危機"
 ww_BEL_event_political.4.desc: "儘管我們的經濟復甦初見曙光，但我們再次面臨財務危機。首相[BEL.GetLeader]未能通過議會批准[BEL.GetHerHis]的預算，無法就需要的稅改改革達成廣泛的共識，以對抗不斷惡化的公共財務狀況，從而再次導致政府垮臺。\n\n這導致權力很快移交給了勞動黨的新秀保羅-亨利·斯巴克，他成為了比利時的第一位社會黨首相。"
 ww_BEL_event_political.4.a: "希望斯巴克能夠堅挺的久一些！"
 #Adriaan Martens Crisis
 ww_BEL_event_political.5.t: "阿德里安·馬滕斯危機"
 ww_BEL_event_political.5.desc: "起初看似正常的任命，演變成了我國政府的又一個政治危機。首相需要為皇家醫學學院任命一名新成員，而他提名了阿德里安·馬滕斯作為候選。這一選擇引發了爭議，因為馬滕斯是佛蘭德民族主義者，並曾在大戰期間與德國佔領者合作。這一提名遭到了退伍軍人、自由主義者和法語系比利時人的強烈反對，甚至國王也表示不滿。\n\n[BEL.GetLeader]試圖為這個選擇辯護，但受到越來越大的壓力。反對者呼籲舉行提前選舉以選出新的領導人，儘管斯巴克可能仍有政治資本來競爭這一職位。"
 ww_BEL_event_political.5.a: "首相應該引咎辭職，並舉行提前大選。"
 ww_BEL_event_political.5.b: "斯巴克擁有足夠的政治支持度過這一關。"
 #The Flemish Question
 ww_BEL_event_political.6.t: "佛蘭德問題"
 ww_BEL_event_political.6.desc: "自建國以來，比利時內部一直分為兩個語言群體：講法語的瓦隆人和講荷蘭語的佛蘭德人。這導致了我國的各種問題，包括朋友之間的簡單誤解、軍事命令被錯誤執行、因被告與法庭語言不通導致的不公正審判。\n\n現在是時候徹底解決這種分裂問題了，並決定如何在通用語言的模式下團結我們的國民。"
 ww_BEL_event_political.6.a: "荷蘭語應該優先"
 ww_BEL_event_political.6.b: "法語應該優先"
 ww_BEL_event_political.6.c: "比利時由兩種文化平等地定義"
 #The Snap Election
 ww_BEL_event_political.7.t: "提前選舉"
 ww_BEL_event_political.7.desc: "隨著憲法危機暫時得到控制，現在是時候確保政府重新具有合法性，否則與他們剛剛推翻的政府沒有什麼不同。目前，社會黨的保羅-亨利·斯巴克和天主教黨的于貝爾·皮耶洛是潛在的提前選舉的領先的候選人。"
 ww_BEL_event_political.7.a: "于貝爾·皮耶洛和天主教黨將繼續對抗威脅我們的人"
 ww_BEL_event_political.7.b: "保羅-亨利·斯巴克和工黨將帶領我們走向嶄新的社會主義未來。"
 #Communist Language Problems
 ww_BEL_event_political.8.t: "人民的語言"
 ww_BEL_event_political.8.desc: "我們的人民長期以來因語言而割裂。講法語的瓦隆人和講荷蘭語的佛蘭德人之間存在著輕微的裂痕，阻礙了更統一的[ROOT.GetName]的發展。我們必須就官方語言問題做出決定，否則朋友之間的誤解、軍事命令的執行錯誤和司法不公將永遠成為[ROOT.GetAdjective]人日常生活的一部分。"
 ww_BEL_event_political.8.a: "荷蘭語是我們的語言"
 ww_BEL_event_political.8.b: "法語是我們的語言"
 ww_BEL_event_political.8.c: "我們的語言是平等的，我們將保留兩者！"
 ### Diplomatic Events
 #Repudiate Treaties
 ww_BEL_event_diplomatic.1.t: "[FROM.GetNameDefCap]斷絕了我們的擔保"
 ww_BEL_event_diplomatic.1.desc: "[FROM.GetLeader]通知我們，我們兩國之間的互助防務條約已經作廢，因為他們尋求在這些動盪時期採取中立的態度。然而，那並沒有在大戰期間為他們帶來好的結果……"
 ww_BEL_event_diplomatic.1.a: "讓他們獨自前行吧。"
 #Luxembourg Receives Ultimatum - to LUX
 ww_BEL_event_diplomatic.2.t: "[FROM.GetNameDefCap]要求我們投降"
 ww_BEL_event_diplomatic.2.desc: "[FROM.GetLeader]藉助歷史上的紐帶以及我們共同的文化和語言，設法確保我們被併入他們的國家。"
 ww_BEL_event_diplomatic.2.a: "我們在一起更強大。"
 ww_BEL_event_diplomatic.2.b: "盧森堡是個自豪而獨立的國家！"
 #Luxembourg Yields - to BEL
 ww_BEL_event_diplomatic.3.t: "[FROM.GetNameDefCap]屈從要求"
 ww_BEL_event_diplomatic.3.desc: "我們收到了好消息！[FROM.GetNameDefCap]的人們明智地決定，團結在一起能更強大，目前已經開始安排新政權的管理事宜。"
 ww_BEL_event_diplomatic.3.a: "太棒了！"
 #Luxembourg Resists - to BEL
 ww_BEL_event_diplomatic.4.t: "[FROM.GetNameDefCap]抵抗！"
 ww_BEL_event_diplomatic.4.desc: "不幸的是，看來[FROM.GetNameDefCap]的人們對自己的主權力量有些自負，選擇拒絕我們慷慨的統一提議。我們需要向他們展示我們國家的力量，以武力將他們納入我們的統一體。"
 ww_BEL_event_diplomatic.4.a: "他們做出了錯誤的選擇"
 ##Demand Calais Events
 #To Belgium : What can we offer?
 ww_BEL_event_diplomatic.5.t: "我們應該如何取得加來？"
 ww_BEL_event_diplomatic.5.desc: "我們決定向法國索要加來，但我們仍然需要選擇取得加來的方式。當然，我們強大的軍隊可以毫無問題地佔領這片土地，但我們也應該考慮到可能的附帶損害，因此也許應該追求另一種獲取方式。對我們來說，統一的方式並不重要，只要我們能得到屬於我們的土地！"
 ww_BEL_event_diplomatic.5.a: "以戰爭相威脅"
 ww_BEL_event_diplomatic.5.b: "用剛果換取加來"
 ww_BEL_event_diplomatic.5.c: "提供經濟補償"
 ww_BEL_event_diplomatic.5.d: "提出結盟作為交換條件"
 #To France : Belgium demand Calais
 ww_BEL_event_diplomatic.6.t: "比利時索要加來"
 ww_BEL_event_diplomatic.6.desc: "我們剛剛收到了[BEL.GetName]的無禮要求，要我們交出加來！他們聲稱，基於歷史上的勃艮第公國，這片土地而理應屬於比利時，並宣佈自己繼承了某種形式的勃艮第遺產。他們的大使明確表示，如果我們不答應他們的要求，他們將會採取暴力威脅，但考慮到他們的軍事力量，這很可能只是虛張聲勢。"
 ww_BEL_event_diplomatic.6.a: "該死！不行！"
 ww_BEL_event_diplomatic.6.b: "我們現在承受不起再多一個敵人"
 #To France : Belgium offers Congo land for Calais
 ww_BEL_event_diplomatic.7.t: "比利時希望換取加來"
 ww_BEL_event_diplomatic.7.desc: "我們剛剛收到了[BEL.GetAdjective]代表團提出的有趣提議。他們提出以剛果的大部分領土換取加來。如此，我們將佔據與我們目前在該地區接壤的科基拉維爾和斯坦利維爾。他們的外交官隱含地威脅我們，如果我們拒絕此提議，可能會導致緊張局勢升級，但這是否值得？"
 ww_BEL_event_diplomatic.7.a: "不，加來對我們來說更有價值"
 ww_BEL_event_diplomatic.7.b: "很好，這筆交易很公平"
 #To France : Belgium offers payment for Calais
 ww_BEL_event_diplomatic.8.t: "比利時希望購買加來"
 ww_BEL_event_diplomatic.8.desc: "我們剛剛收到了[BEL.GetAdjective]代表團提出的有趣提議。他們表示有興趣購買加來，以“重新統一他們的歷史領土”。他們提出的金額相當高，這無疑可以改善我們的經濟，但問題在於，我們是否認為損失這片土地值得這個價格。還應注意到，他們的外交官暗示，如果我們拒絕他們的提議，緊張局勢可能會升級。"
 ww_BEL_event_diplomatic.8.a: "不，加來對我們來說更有價值"
 ww_BEL_event_diplomatic.8.b: "這個價格似乎合理！"
 #To Congo : Belgium just handed land over to France
 ww_BEL_event_diplomatic.9.t: "科基拉維爾和斯坦利維爾出售給法國！"
 ww_BEL_event_diplomatic.9.desc: "我們的殖民地總督剛剛被告知，[BEL.GetName]已經與[FRA.GetName]達成協議，用加來換取我們的若干地區，即科基拉維爾和斯坦利維爾。歐洲列強再次改變非洲的邊界，而我們這些真正居住在這裡的人卻毫無參與！"
 ww_BEL_event_diplomatic.9.a: "我們得再次更新地圖了……"
 #To Belgium : France accepted! We got the land.
 ww_BEL_event_diplomatic.10.t: "法國接受了！"
 ww_BEL_event_diplomatic.10.desc: "我們從派往巴黎的代表團收到消息，[FRA.GetName]選擇接受我們的提議，加來及其周邊地區的行政權的移交工作已經開始！"
 ww_BEL_event_diplomatic.10.a: "我們的合法領土已恢復！"
 #To Belgium : France refused. Escalate?
 ww_BEL_event_diplomatic.11.t: "因加來問題而升級的緊張局勢"
 ww_BEL_event_diplomatic.11.desc: "我們在巴黎的代表團發來消息，加來的談判已經破裂，我們可能需要動用武力來確保這片本屬於我們的土地。我們已經盡力提出合理的提議，但他們每一回都拒絕我們。是時候向他們展示[BEL.GetAdjective]的真正軍事實力了。"
 ww_BEL_event_diplomatic.11.a: "退一步，不要逼得太緊"
 ww_BEL_event_diplomatic.11.b: "那麼他們就是選擇了戰爭！" #Tool tip to say occupying Paris may be enough to force peace.
 #To ENG/FRA/SOV: Belgium requests guarantee
 ww_BEL_event_diplomatic.12.t: "[FROM.GetNameDefCap]請求我們的援助"
 ww_BEL_event_diplomatic.12.desc: "來自[FROM.GetAdjective]領導層的通訊剛剛到達我們手中。隨著世界變得越來越敵對，他們擔心自己保家衛國的能力。我們的幫助將是非常有用的，並且對維持該地區的和平至關重要。"
 ww_BEL_event_diplomatic.12.a: "他們將得到我們的援助！"
 ww_BEL_event_diplomatic.12.b: "我們無法援助他們"
 #To Belgium: Gets guarantee from ENG/FRA/SOV
 ww_BEL_event_diplomatic.13.t: "[FROM.GetNameDefCap]保證我們的獨立"
 ww_BEL_event_diplomatic.13.desc: "我們收到了[FROM.GetAdjective]外交官傳來的非常令人欣喜的消息。他們同意我們的安全可能受到威脅，而我們的軍隊可能不足以保護我們的獨立。為此，他們向我們提供了我們所請求的保證。"
 ww_BEL_event_diplomatic.13.a: "這將確保我們的安全"
 #To Belgium: Does not get guarantee from ENG/FRA/SOV
 ww_BEL_event_diplomatic.14.t: "[FROM.GetNameDefCap]拒絕為我們提供保證"
 ww_BEL_event_diplomatic.14.desc: "儘管我們生存面臨明顯的威脅，[FROM.GetAdjective]領導層還是拒絕了我們對保證的請求。我們試圖與他們講道理，但他們拒絕認識到局勢的嚴重性。看來我們只能靠自己了。"
 ww_BEL_event_diplomatic.14.a: "他們太無禮了！"
 #To GER/FRA/ENG: Exiled Belgium Requests equipment
 ww_BEL_event_diplomatic.15.t: "[FROM.GetNameDefCap]請求裝備援助"
 ww_BEL_event_diplomatic.15.desc: "我們剛剛收到流亡中的[FROM.GetAdjective]領導層的請求。他們希望從我們這裡獲得一些裝備，以訓練他們剩餘的部隊，希望有朝一日能夠收復他們的家園。"
 ww_BEL_event_diplomatic.15.a: "我們會為他們提供$infantry_equipment$！"
 ww_BEL_event_diplomatic.15.c: "我們將向他們輸送$support_equipment$！"
 ww_BEL_event_diplomatic.15.b: "他們的抱負值得欽佩，但我們無能為力"
 #To GER/FRA/ENG: Exiled Belgium Requests factories
 ww_BEL_event_diplomatic.16.t: "[FROM.GetNameDefCap]請求工廠援助"
 ww_BEL_event_diplomatic.16.desc: "我們收到了[FROM.GetAdjective]領導層的請求，希望使用我們的工廠為他們剩餘的部隊生產裝備。他們渴望奪回自己的家園，為此，他們的部隊需要裝備。"
 ww_BEL_event_diplomatic.16.a: "我們當然會幫忙"
 ww_BEL_event_diplomatic.16.b: "我們心有餘而力不足"
 #To GER/USA/ENG: BEL requests military experience sharing
 ww_BEL_event_diplomatic.17.t: "[FROM.GetNameDefCap]提議分享軍事經驗"
 ww_BEL_event_diplomatic.17.desc: "[FROM.GetNameDef]的流亡政府聯繫了我們，提議共同努力，在我們的軍隊之間分享軍事經驗。這對我們和他們都有好處。"
 ww_BEL_event_diplomatic.17.a: "這是個好主意！"
 ww_BEL_event_diplomatic.17.b: "這不值得花費時間"
 #To BEL: Generic accept
 ww_BEL_event_diplomatic.18.t: "[FROM.GetNameDefCap]同意"
 ww_BEL_event_diplomatic.18.desc: "我們提出的加強我們地位並幫助重建軍隊以收復家園的建議得到了[FROM.GetNameDef]的認可。儘管這不足以單獨解決我們的問題，但這將是我們最終重獲獨立的重要一步。"
 ww_BEL_event_diplomatic.18.a: "好消息！"
 #To BEL: generic reject
 ww_BEL_event_diplomatic.19.t: "[FROM.GetNameDefCap]拒絕"
 ww_BEL_event_diplomatic.19.desc: "我們提出的加強我們地位並幫助重建軍隊以收復家園的建議被[FROM.GetNameDef]拒絕了。我們本希望這是未來計劃的一個起點，但看來只能擱置這些計劃了。"
 ww_BEL_event_diplomatic.19.a: "真是不幸"
 ww_BEL_event_diplomatic.20.t: "[FROM.GetNameDefCap]邀請我們加入歐洲合作計劃"
 ww_BEL_event_diplomatic.20.desc: "我們收到了來自[FROM.GetNameDef]的正式邀請，加入他們的新倡議[FROM.GetFactionName]，其目的是促進該地區的合作，他們希望這一倡議能穩定地區局勢，並促進更好的外交關係。"
 ww_BEL_event_diplomatic.20.a: "這是個偉大的倡議！"
 ww_BEL_event_diplomatic.20.b: "這聽起來有些可疑……"
 ww_BEL_event_diplomatic.21.t: "[FROM.GetNameDefCap]加入[ROOT.GetFactionName]"
 ww_BEL_event_diplomatic.21.desc: "我們向[FROM.GetNameDef]發出的邀請得到了他們的贊同。他們同意一個更大的歐洲共同體是正確的方向。通過共同努力，我們將能夠再次穩定該地區。"
 ww_BEL_event_diplomatic.21.a: "好消息！"
 ww_BEL_event_diplomatic.22.t: "[FROM.GetNameDefCap]拒絕了我們的邀請，不同意加入[ROOT.GetFactionName]"
 ww_BEL_event_diplomatic.22.desc: "[FROM.GetAdjective]外交官帶來了令人失望的回覆。他們聲稱，儘管這個想法可能是高尚的，但它註定會失敗，就像我們之前的類似倡議一樣。"
 ww_BEL_event_diplomatic.22.a: "真遺憾……"
 ww_BEL_event_diplomatic.23.t: "[FROM.GetNameDefCap]邀請我們加入他們的研究項目"
 ww_BEL_event_diplomatic.23.desc: "一支[FROM.GetAdjective]代表團向我們提議發起一個[FROM.GetFactionName]範圍內的研究項目。作為親密盟友，我們需要在聯盟內部分享我們的科技，以推動全體成員的進步。"
 ww_BEL_event_diplomatic.23.a: "當然，我們加入"
 ww_BEL_event_diplomatic.23.b: "我們的科技將繼續保持獨有"
 ww_BEL_event_diplomatic.24.t: "[FROM.GetNameDefCap]加入了歐洲聯盟研究組"
 ww_BEL_event_diplomatic.24.desc: "我們提出的在盟友間共享技術的倡議得到了[FROM.GetNameDef]的認可。他們加入了這一努力，將與我們和共同盟友分享他們的科技進步，正如我們將與他們分享我們的成果。"
 ww_BEL_event_diplomatic.24.a: "太好了！"
 ww_BEL_event_diplomatic.25.t: "[FROM.GetNameDefCap]拒絕加入歐洲聯盟研究組"
 ww_BEL_event_diplomatic.25.desc: "儘管我們認為向[FROM.GetNameDef]提出的歐洲聯盟研究組計劃非常有力，他們卻拒絕了加入該倡議的提議。我們仍然希望從這個項目中獲益，但這將不得不在沒有[FROM.GetNameDef]的情況下進行。"
 ww_BEL_event_diplomatic.25.a: "唉，沒辦法……"
 ww_BEL_event_diplomatic.26.t: "[FROM.GetNameDefCap]請求有限聯邦化"
 ww_BEL_event_diplomatic.26.desc: "我們收到了來自[FROM.GetNameDef]的請求。作為[ROOT.GetFactionName]的領袖，他們意識到一個更加聯邦化的歐洲將提升防禦和商業的效率，因此請求我們加入這一事業。"
 ww_BEL_event_diplomatic.26.a: "為了[FROM.GetFactionName]的進步"
 ww_BEL_event_diplomatic.26.b: "不，我們必須考慮我國的主權！"
 ww_BEL_event_diplomatic.26.b_tt: "§R他們可能會把我們踢出陣營！§!"
 ww_BEL_event_diplomatic.27.t: "[FROM.GetNameDefCap]允許有限聯邦化"
 ww_BEL_event_diplomatic.27.desc: "[FROM.GetNameDefCap]批准了我們加強與[FROM.GetFactionName]的紐帶的請求。我們將獲得對他們外交政策的一些控制權，貿易也將在我們之間簡化。"
 ww_BEL_event_diplomatic.27.a: "太棒了！"
 ww_BEL_event_diplomatic.28.t: "[FROM.GetNameDefCap]拒絕有限聯邦化"
 ww_BEL_event_diplomatic.28.desc: "儘管有明顯的優勢，[FROM.GetNameDef]決定不加入我們的聯邦化歐洲計劃。他們聲稱自己的主權高於整個$EU_tech_sharing_group_name$的福祉，這種觀點在聯盟內部令人擔憂。"
 ww_BEL_event_diplomatic.28.a: "確實令人擔憂"
 ww_BEL_event_diplomatic.28.b: "他們是對我們所有人的威脅！"
 ww_BEL_event_diplomatic.29.t: "奧托·馮·哈布斯堡表示支持"
 ww_BEL_event_diplomatic.29.desc: "我們收到了來自一位令人意外的人物的支持提議。奧托·馮·哈布斯堡是奧地利皇帝、匈牙利國王和克羅地亞國王查理一世的繼承人，但似乎與他的父親不同，奧托更加傾向於歐洲內部的合作。他讚賞我們的努力，並提出在外交方面提供幫助，他廣泛的外交網絡對我們來說可能是一筆財富，他將樂意為我們提供這種幫助。"
 ww_BEL_event_diplomatic.29.a: "我們很榮幸能得到他的支持"
 ww_BEL_event_diplomatic.29.b: "哈布斯堡家族屬於過去"
 ww_BEL_event_diplomatic.30.t: "[FROM.GetNameDefCap]請求加入[ROOT.GetFactionName]"
 ww_BEL_event_diplomatic.30.desc: "在[FROM.GetAdjective]決定放棄中立立場後，[FROM.GetNameDef]的領導層愈發與我們的政治議程保持高度一致。現在他們向我們提出加入[ROOT.GetFactionName]的請求。他們的幫助可能對我們有用，為我們未來的擴張提供新的戰略途徑。"
 ww_BEL_event_diplomatic.30.a: "歡迎他們"
 ww_BEL_event_diplomatic.30.b: "我們不需要他們"
 ww_BEL_event_diplomatic.31.t: "[FROM.GetNameDefCap]接納我們加入[FROM.GetFactionName]"
 ww_BEL_event_diplomatic.31.desc: "[FROM.GetAdjective]領導人[FROM.GetLeader]歡迎我們加入[FROM.GetFactionName]。從現在起，我們將並肩作戰，共同應對共同的威脅。我們的中立時代已經過去！"
 ww_BEL_event_diplomatic.31.a: "好消息！"
 ww_BEL_event_diplomatic.32.t: "[FROM.GetNameDefCap]拒絕我們加入[FROM.GetFactionName]"
 ww_BEL_event_diplomatic.32.desc: "儘管有明顯的好處，[FROM.GetAdjective]領導人[FROM.GetLeader]依然拒絕我們加入[FROM.GetFactionName]。我們本可以為此貢獻很多，但考慮到這個回應，我們應該重新考慮加入他們的願望，不僅是現在也包括未來。"
 ww_BEL_event_diplomatic.32.a: "我們可以創造更好的東西！"
 BEL_tried_to_join_the_axis_flag: "曾試圖加入[GER.GetFactionName]"
 ww_BEL_event_diplomatic.33.t: "[ROOT.GetAdjective]中立的未來"
 ww_BEL_event_diplomatic.33.desc: "中立為我們的國家帶來了很大好處，但保持中立可能會讓其他人認為我們只是一個被動的旁觀者和目標。我們必須認真考慮未來的外交政策，以及我們對武裝鬥爭的立場，因為衝突似乎可能很快波及我們。"
 ww_BEL_event_diplomatic.33.a: "我們必須掙脫枷鎖，做好準備！"
 ww_BEL_event_diplomatic.33.b: "必須保持中立！"
 ww_BEL_event_diplomatic.34.t: "[FRA.GetNameDefCap]：是敵是友？"
 ww_BEL_event_diplomatic.34.desc: "無論我們的武裝多麼精良，我們都必須接受這樣一個事實：我們的南方鄰國可能永遠比我們更強大。我們必須達成一致意見，是將他們視為朋友，還是敵人？"
 ww_BEL_event_diplomatic.34.a: "[FRA.GetAdjective]人是我們的朋友"
 ww_BEL_event_diplomatic.34.b: "[FRA.GetAdjective]人不可信任！"
 ww_BEL_event_diplomatic.35.t: "[FROM.GetNameDefCap]主動聯繫我們"
 ww_BEL_event_diplomatic.35.desc: "我們的北方鄰居聯繫了我們。他們希望與我們建立更緊密的外交關係。他們的提議對雙方都有利，但我們必須確保在這件事上做出正確的選擇。"
 ww_BEL_event_diplomatic.35.a: "當然可以！"
 ww_BEL_event_diplomatic.35.b: "不，我們看不出任何好處"
 ww_BEL_event_diplomatic.36.t: "[FROM.GetAdjective]同意"
 ww_BEL_event_diplomatic.36.desc: "[FROM.GetNameDef]的領導層同意我們可以通過加深外交關係獲得共同利益。在這個越來越充滿敵意的世界中，我們可以依靠他們作為朋友和盟友。"
 ww_BEL_event_diplomatic.36.a: "太棒了！"
 ww_BEL_event_diplomatic.37.t: "[FROM.GetAdjective]不同意"
 ww_BEL_event_diplomatic.37.desc: "儘管對雙方來說有明顯的好處，但[FROM.GetAdjective]似乎不願意在現有外交關係的基礎上進一步合作。我們對此寄予厚望，但顯然他們並不認同。"
 ww_BEL_event_diplomatic.37.a: "真遺憾……"
 ### War Events
 #Relocate Air Industries
 ww_BEL_event_war.1.t: "啟用已轉移的航空工業"
 ww_BEL_event_war.1.desc: "我們提前與外國工業公司建立良好的工作聯繫的遠見卓識已經獲得了回報。他們的設施已經準備好，可以立即投入生產。"
 ww_BEL_event_war.1.a: "這就是為什麼我們要提前佈局！"
 ### King's Surrender Chain
 #Unknown Sympathies
 ww_BEL_event_war.2.t: "搖擺不定的國王"
 ww_BEL_event_war.2.desc: "利奧波德三世國王一直生活在他的父親、被譽為戰士國王的阿爾貝一世的陰影下，後者因在大戰期間保衛比利時、阻止德意志帝國的勝利而聞名。儘管在此過程中，他的國家變成了戰場，但國家的軍事榮譽沒有受到玷汙，比利時在世界舞臺上的聲譽也隨之上升。\n\n現在，比利時再次陷入戰爭，利奧波德的真正考驗開始了，已經有一些令人擔憂的傳言。\n\n國王聲稱要保護他的人民的生命，已經在為和平試探，考慮到布魯塞爾、列日或安特衛普的陷落，國王可能會在不顧人民繼續戰鬥的民主意願的情況下早早投降。"
 ww_BEL_event_war.2.a: "利奧波德國王將帶領我們走向勝利"
 BEL_unknown_sympathies_tt: "§R如果我們失去列日、安特衛普或布魯塞爾中的任意一個，利奧波德國王會投降。到那時你仍可以有其他選擇。§!"
 #The King's Surrender
 ww_BEL_event_war.3.t: "國王投降"
 ww_BEL_event_war.3.desc: "未先等待[BEL.GetAdjective]議會的批准，作為武裝部隊總司令的國王今天提議[BEL.GetName]無條件投降。嚴格來說，作為總司令，他有權讓軍隊投降，但沒有權力投降整個國家。\n\n平民議會已經流亡，明確表示將利用[BEL.GetAdjective]帝國的所有資源繼續戰爭。"
 ww_BEL_event_war.3.a: "這是國王的意志！"
 ww_BEL_event_war.3.b: "繼續戰鬥！"
 ww_BEL_event_war.3.c: "他沒這個權利！軟禁國王"
 #Royal Prisoner
 ww_BEL_event_war.4.t: "皇家囚徒"
 ww_BEL_event_war.4.desc: "國王將國家交給侵略者，這種背叛行為使他遭到軟禁，並被剝奪了武裝部隊總司令的職務、頭銜，當然還有王冠。然而，人民仍然需要一位統治者，現在我們必須選擇由誰來領導攝政，直到他的兒子年齡足夠大到登上王位。有兩個選擇：\n\n第一個是合法任命的首相和人民領袖萊昂·德格雷爾。另一個選擇是利奧波德的兄弟，佛蘭德伯爵查爾斯，他將給王位帶來合法性和連續性。"
 ww_BEL_event_war.4.a: "讓萊昂·德格雷勒成為新攝政"
 ww_BEL_event_war.4.b: "讓查理保障合法順位"
 #The King's Surrender - Triggered via capitulation rather than event
 ww_BEL_event_war.5.t: "國王投降"
 ww_BEL_event_war.5.desc: "在全國的英勇防禦之後，利奧波德三世國王最終提議[BEL.GetName]投降，我們的政府被迫流亡。利奧波德選擇與他的人民在一起，成為自己家的囚犯。我們仍然可以依靠盟友的善意，並依賴[BEL.GetAdjective]帝國的資源，終有一天我們可以光復我們的家園。"
 ww_BEL_event_war.5.a: "未來仍不確定"
 ## King's Surrender Chain Ends
 #Belgium demands special treatment (-_-)ゞ゛ - Event for any occupier of Belgium
 ww_BEL_event_war.6.t: "總秘書處"
 ww_BEL_event_war.6.desc: "一群比利時公務員向我們提出了一項提議：允許他們繼續在政府職務上工作，他們將確保在這個過渡時期，當地政府能夠順利運作。比利時政府已經通過立法，使他們與我們合作合法化，以減少佔領對其人民的影響。他們甚至授權比利時銀行繼續支付這些行政人員的工資。這是一個展示我們願意與當地人合作的機會，也可以在一定程度上緩解該地區的劇烈抵抗。"
 ww_BEL_event_war.6.a: "很好的倡議，與他們合作，確保佔領的順利推進"
 ww_BEL_event_war.6.b: "有趣的想法，我們會考慮他們的提議"
 ww_BEL_event_war.6.c: "這只不過是為合法抵抗找藉口，不行"
 BEL_set_secretaries_general_tt: "§Y總秘書處§!將作為比利時的§Y佔領法§!加入"
 BEL_available_secretaries_general_tt: "§Y總秘書處§!現在可作為比利時的§Y佔領法§!使用"
 BEL_no_secretaries_general_tt: "§Y總秘書處§!將不再作為比利時的§Y佔領法§!"
 BEL_remove_secretaries_general_civs_tt: "移除2個§Y地圖外民用工廠§!"
 ## France Limited War
 #To Belgium: Inform Belgium of Limited War goals
 ww_BEL_event_war.7.t: "潛在的有限戰爭——巴黎必須陷落！"
 ww_BEL_event_war.7.desc: "我們外交總長和將軍最近會面，並建議我們，如果衝突保持在有限的範圍內，即如果沒有其他大國介入，我們或許能夠迫使[FRA.GetName]坐到談判桌前，迅速達成和平協議。我們知道他們害怕緊張局勢加劇，和我們一樣，他們也不願再次捲入全球衝突。\n\n因此按我們的預測，如果巴黎陷落，這將足以證明我們的實力，他們可能願意談判移交有爭議的加來。"
 ww_BEL_event_war.7.a: "我們的軍隊很快就會在巴黎街頭行進！"
 #To France: Paris has fallen! Sue for peace?
 ww_BEL_event_war.8.t: "巴黎淪陷！"
 ww_BEL_event_war.8.desc: "這是一場國家災難，我們引以為傲的首都巴黎淪陷了！我們的軍隊再次在明顯不如我們的敵人面前顯得不堪一擊。[FROM.GetAdjective]人提出撤回他們的部隊並饒過我們國家的其他部分，但作為交換，他們要求我們將加來交給他們。\n\n我們已經感受到禿鷲在盤旋，這將為我們爭取時間，從中吸取教訓，併為未來可能遇到的更強大的敵人做好準備。"
 ww_BEL_event_war.8.a: "用加來換取和平"
 ww_BEL_event_war.8.b: "繼續戰鬥！戰爭還沒有結束"
 #To Belgium: Accept peace offer?
 ww_BEL_event_war.9.t: "法國同意和平協議"
 ww_BEL_event_war.9.desc: "今天，我們接待了一支法國代表團，他們前來商討在首都淪陷後，當前衝突的和平解決方案。經過多次商議，他們最終決定以加來換取立即停火。\n\n需要注意的是，這是一次性的提議，如果我們拒絕，他們將更加堅定地進行防禦，並且不太可能再提出類似的建議。"
 ww_BEL_event_war.9.a: "我們接受！加來換和平"
 ww_BEL_event_war.9.b: "繼續戰鬥！我們可以得到更多"
 ww_BEL_event_war.10.t: "巴黎在[ROOT.GetAdjective]的控制下"
 ww_BEL_event_war.10.desc: "在我們對抗[FRA.GetAdjective]的戰爭初期的會議中設定的目標已經實現。巴黎在我們的控制之下，因此可以推測[FRA.GetAdjective]可能已經承受了足夠的壓力，如果我們提議撤回軍隊，換取加來的領土，他們可能會勉強同意。\n\n與此同時，反對的聲音越來越大，我們已經走到了這一步，而[FRA.GetAdjective]顯然無法阻止我們。為什麼現在要停止呢？"
 ww_BEL_event_war.10.a: "我們已經達到了目的，現在需要和平！"
 ww_BEL_event_war.10.b: "我們想要全部！"
 ### King's Surrender Chain End
 ### Spanish Civil War Interaction Events ###
 ww_BEL_event_spanish_interaction.1.t: "[FROM.GetNameDefCap]運送裝備"
 ww_BEL_event_spanish_interaction.1.desc: "我們收到了一批來自[FROM.GetAdjective]政府的步槍。他們與我們一樣認為必須阻止國民派，並希望不僅僅用言辭來幫助我們的鬥爭。"
 ww_BEL_event_spanish_interaction.1.a: "我們會好好利用這些裝備！"
 ww_BEL_event_spanish_interaction.2.t: "進一步提供裝備給[SPR.GetAdjective]共和派"
 ww_BEL_event_spanish_interaction.2.desc: "我們之前向[SPR.GetAdjective]人提供的物資對我們的共和派盟友非常有用。然而，他們的戰鬥還遠未結束，我們應該能夠為他們提供更多的裝備。"
 ww_BEL_event_spanish_interaction.2.a: "輸送更多步槍！"
 ww_BEL_event_spanish_interaction.2.b: "他們需要一些支援裝備！"
 ww_BEL_event_spanish_interaction.2.c: "給他們送去火炮！"
 ww_BEL_event_spanish_interaction.3.t: "[FROM.GetNameDefCap]運送更多裝備"
 ww_BEL_event_spanish_interaction.3.desc: "我們收到了另一批[FROM.GetAdjective]裝備。他們對我們的支持將在抵抗國內國民派災難的鬥爭中提供極大的幫助。"
 ww_BEL_event_spanish_interaction.3.a: "太棒了！"
 ww_BEL_event_spanish_interaction.4.t: "支持我們鬥爭的[FROM.GetAdjective]演講"
 ww_BEL_event_spanish_interaction.4.desc: "我們被告知，幾個小時前在[FROM.GetNameDef]舉行了一場集會和演講，以支持我們。[FROM.GetAdjective]的領導層再次重申了他們對我們的支持，希望這能為我們爭取更多的行動空間，讓我們的人民對我們更加信任。"
 ww_BEL_event_spanish_interaction.4.a: "向[FROM.GetAdjective]表示感謝！"
 ww_BEL_event_spanish_interaction.5.t: "促進[FROM.GetAdjective]移民"
 ww_BEL_event_spanish_interaction.5.desc: "最近我們看到[FROM.GetAdjective]公民的移民數量有所增加。許多移民表示願意在我們需要時加入我們的軍隊。可以想像，這可能是[FROM.GetAdjective]有意推動的結果。"
 ww_BEL_event_spanish_interaction.5.a: "好消息！"
 ww_BEL_event_spanish_interaction.6.t: "[FROM.GetNameDefCap]提議結盟"
 ww_BEL_event_spanish_interaction.6.desc: "曾經中立的[FROM.GetAdjective]提出了一個令人驚訝的提議。他們希望與我們結盟，認為這將使他們能夠更好地支持我們與國民派的鬥爭。"
 ww_BEL_event_spanish_interaction.6.a: "好主意！"
 ww_BEL_event_spanish_interaction.6.b: "我們感謝他們的支持，但不需要"
 ww_BEL_event_spanish_interaction.7.t: "[FROM.GetNameDef]加入[ROOT.GetFactionName]"
 ww_BEL_event_spanish_interaction.7.desc: "[FROM.GetAdjective]對我們成立[ROOT.GetFactionName]的提議給出了肯定的答覆。我們將共同對抗國民派的威脅！"
 ww_BEL_event_spanish_interaction.7.a: "前進！"
 ww_BEL_event_spanish_interaction.8.t: "[FROM.GetNameDefCap]拒絕了我們的結盟提議"
 ww_BEL_event_spanish_interaction.8.desc: "考慮到我們不斷向[FROM.GetAdjective]提供的支持，我們原本希望我們的結盟提議能得到積極的回應。然而，事實並非如此，他們拒絕了我們的建議，表示他們歡迎我們的幫助，但並不希望結成聯盟。"
 ww_BEL_event_spanish_interaction.8.a: "太無禮了！"
 ww_BEL_event_spanish_interaction.9.t: "[FROM.GetNameDefCap]解散了$BEL_SPR_alliance$"
 ww_BEL_event_spanish_interaction.9.desc: "隨著我們內戰的結束，[FROM.GetAdjective]認為是時候結束我們的夥伴關係了。儘管這暫時結束了我們的聯盟，但他們非常堅決地表示，這並不意味著斷絕我們再次成為盟友的可能。"
 ww_BEL_event_spanish_interaction.9.a: "真是遺憾"
 ww_BEL_event_misc.1.t: "老闆去世了"
 ww_BEL_event_misc.1.desc: "埃米爾·王德威爾得，綽號“老闆”，[BEL.GetName]的資深社會主義政治家和總理，去世了。他以參加巴黎和會的比利時代表團成員而聞名，該會議結束了那次世界大戰，他還成為了法西斯主義的堅定反對者，甚至主張在西班牙內戰中直接干預並支持共和派。\n\n亨利·德曼接任為新任總理，並將在今天晚些時候在國王的見證下宣誓就職。"
 ww_BEL_event_misc.1.a: "他的繼任者是能完成這項工作的人！"
 ww_BEL_event_misc.3.t: "柯克里爾：比利時製造業的心臟"
 ww_BEL_event_misc.3.desc: "柯克里爾公司是比利時製造業的核心企業。自成立以來，該公司不僅生產鐵和鋼，還製造精密機械，包括蒸汽機、火車，甚至戰艦。它建立了卓越的聲譽，成為西歐鋼鐵工業的重要力量。\n\n在那次世界大戰期間，柯克里爾的總經理阿道夫·格賴納及其他管理層成員在列日圍城期間一直堅守崗位，確保為員工提供儘可能長的就業機會。城市被佔領後，公司拒絕為佔領軍生產產品，因此大部分重型鋼鐵設備遭到破壞。\n\n在戰間期，它已經恢復，並繼續作為一個重要的工業力量存在。"
 ww_BEL_event_misc.3.a: "他們可能建造了我們的經濟引擎！"
 ### Congolese events ###
 ww_congo.1.t: "比利時投資我國的發展建設"
 ww_congo.1.desc: "比利時殖民辦公室今天通過了一項法案，將大量資源分配給我們的工業發展，並已開始在[295.GetName]建設工業設施。"
 ww_congo.1.a: "巨大的恩惠"
 ww_congo.4.t: "拉烏爾·範奧弗斯特拉滕返回比利時"
 ww_congo.4.desc: "直到最近一直在我國服役的比利時軍官拉烏爾·範奧弗斯特拉滕，在得知了我國新獨立的消息後，決定返回歐洲大陸。我們不再需要像他這樣的歐洲人了，這種損失肯定只會讓我們變得更強大。"
 ww_congo.4.a: "帝國主義者滾吧！"
 ww_congo.5.t: "[COG.GetLeader]想要提高剛果的糧食生產"
 ww_congo.5.desc: "我們的剛果總督，[COG.GetLeader]，表示他希望通過減少採礦生產來增加糧食產量，以“改善殖民地人口的社會條件”。這肯定會在短期內損害殖民地的盈利能力，但幾乎可以肯定，從長遠來看會有所改善。"
 ww_congo.5.a: "這會降低利潤！"
 ww_congo.5.b: "如果他認為這樣最好……"
 CONGO_refused_increased_food_production: "我們的宗主國拒絕了我們提高糧食生產的計劃"
 CONGO_accepted_increased_food_production: "我們的宗主國同意了我們提高糧食生產的計劃"
 ww_congo.6.t: "[BEL.GetAdjective]拒絕我們的糧食生產計劃"
 ww_congo.6.desc: "[BEL.GetNameDef]殖民政府拒絕了我們通過減少礦石生產，增加糧食生產，以“改善殖民地人口的社會條件”的請求。"
 ww_congo.6.a: "意料之中"
 ww_congo.7.t: "[BEL.GetAdjective]同意我們的糧食生產計劃"
 ww_congo.7.desc: "[BEL.GetNameDef]殖民政府同意了我們通過減少礦石生產，增加糧食生產，以“改善殖民地人口的社會條件”的請求。"
 ww_congo.7.a: "太好了！"
 ww_congo.8.t: "新中產階級出現"
 ww_congo.8.desc: "剛果人口中有很大一部分正在增長，他們精通法語，信奉基督教，並且接受過一定程度的中等教育。殖民地管理員開始稱他們為進化者，他們進化成了歐洲化的非洲人。儘管由於殖民管理的要求，他們在社會中的上升空間仍然有限，但受過更多教育的人口肯定會有一天為我們的國家帶來繁榮。"
 ww_congo.8.a: "我們將拭目以待"
 evolue_will_start_attempting_to_enter_politics_tt: "先進階級開始嘗試進入政治領域，許多新的§Y政治顧問§!將出現。"
 evolue_have_entered_politics: "各種§Y獨立倡導者§!和§Y剛果政治思想家§!將成為可用的§Y政治顧問§!"
 ww_congo.9.t: "先進階級開始進入[ROOT.GetAdjective]政壇"
 ww_congo.9.desc: "隨著我們最近不斷增長的中產階級和許多城市地區的人口接受了中等教育，許多[COG.GetAdjective]人開始閱讀政治理論家的著作，許多新的政治家和獨立倡導者開始登上政治舞臺。這標誌著[COG.GetAdjective]國家的新時代的到來！"
 ww_congo.9.a: "這些人必將帶領我們的國家走向獨立"
 ww_congo.10.t: "[FROM.GetNameDefCap]索要[772.GetName]"
 ww_congo.10.d: "剛果軍隊在我們殖民地[772.GetName]的邊境佈防，他們要求自由使用我們的基地和設施！如果我們同意他們的要求，就等於把[772.GetName]的控制權交給他們。另一方面，我們在這個問題上並沒有太多可抗爭的手段。"
 ww_congo.10.a: "我們別無選擇，只能同意"
 ww_congo.10.b: "絕不！"
 ww_congo.11.t: "法國接受我們的要求"
 ww_congo.11.d: "法國接受了我們提出的要求，他們在[772.GetName]的基地和其他設施現在完全由我們掌控。他們實際上已經把殖民地的完整控制權交給了我們。"
 ww_congo.11.a: "明智之舉"
 ww_congo.12.t: "法國拒絕我們的要求"
 ww_congo.12.d: "法國蠻橫地拒絕了我們的要求！看起來如果我們想要得到[772.GetName]，那麼我們就得用武力去奪取它！"
 ww_congo.12.a: "蠢貨！"
 ww_congo.13.t: "[FROM.GetNameDefCap]要求我們合併"
 ww_congo.13.d: "剛果部隊沿著我們的邊界駐紮，並且要求我們的基地、機構和設施的完全控制權！如果我們同意他們的要求，我們實際上是同意結束我們的獨立，成為他們國家的一部分。換句話說，這意味著我們完全不會同他們爭論這個問題。"
 ww_congo.13.a: "團結使我們更強大！"
 ww_congo.13.b: "絕不！"
 ww_congo.14.t: "[FROM.GetNameDefCap]接受我們的要求"
 ww_congo.14.d: "[FROM.GetNameDefCap]已同意我們的要求，他們國家在未來幾天後將不再作為獨立實體存在。他們已經有效地將他們國家的完全控制權交給了我們。"
 ww_congo.14.a: "明智之舉"
 ww_congo.15.t: "[FROM.GetNameDefCap]拒絕我們的要求"
 ww_congo.15.d: "[FROM.GetNameDefCap]蠻橫地拒絕了我們的要求！看起來如果我們想要得到[772.GetName]，那麼我們就得用武力去奪取它！"
 ww_congo.15.a: "蠢貨！"
 ww_congo.16.t: "拉丁非洲統一"
 ww_congo.16.d: "作為對全球日趨緊張的局勢的回應，以及[FROM.GetLeader]最近勝利的影響，說羅曼語的中非國家已經實現了統一。現在，他們宣佈自己是一個新的世界大國，並承諾不惜一切代價保護[FROM.GetAdjective]人民。"
 ww_congo.16.a: "他們註定要失敗"
 ww_congo.16.b: "[ROOT.GetNameDef]萬歲！"
 ww_congo.17.t: "剛果獲得獨立"
 ww_congo.17.d: "在獲得[BEL.GetAdjective]當局批准後，新任[COG.GetAdjective]總理帕特里斯·盧蒙巴發表了簡短演講，慶祝國家新獲得的獨立。在講話中，他公開批評了殖民主義以及所謂的“[BEL.GetAdjective]文明開化使命”。雖然這一講話在國內獲得了積極反響，但許多國家將其解讀為對[BEL.GetAdjective]國家元首的個人攻擊。去殖民化的時代才剛剛開始！"
 ww_congo.17.a: "非洲的力量平衡發生了變化"
 ww_congo.17.b: "是時候證明我們是兩個平等獨立的國家了"
 ww_congo.17.c: "也許這是最好的結果……"
 ww_congo.18.t: "剛果起義被鎮壓"
 ww_congo.18.d: "最近，斯坦利維爾的自由剛果政府試圖脫離比利時殖民帝國。儘管他們在國內得到了極大的支持，但這場叛亂很快就被忠於比利時的軍隊和外國僱傭兵鎮壓了。"
 ww_congo.18.a: "帝國主義時代還沒結束"
 ww_congo.18.b: "這些叛徒不過是罪有應得"
 ww_congo.18.c: "團結就是力量"
 ww_congo.19.t: "剛果起義成功"
 ww_congo.19.d: "最近，斯坦利維爾的自由剛果政府發動了一場脫離比利時殖民帝國的獨立戰爭。儘管花了一些時間，但他們的叛軍最終戰勝了駐紮於此的殖民軍隊，並佔領了剛果的主要城市。現在，他們正式宣佈獨立，並和曾經的壓迫者締結了一份和平協議。"
 ww_congo.19.a: "帝國主義時代結束了"
 ww_congo.19.b: "我們贏了！"
 ww_congo.19.c: "真是致命的一擊……"
 ww_congo.20.t: "盧旺達革命"
 ww_congo.20.d: "由於我們的政府對盧旺達-烏隆迪託管地的控制非常鬆散，再加上民族主義情緒在整個地區的蔓延，盧旺達國王、姆瓦米，穆塔拉三世·魯達希瓜，宣佈該國為獨立國家，從而與我們的中央政府斷絕了聯繫。我們是否應該進行干預？"
 ww_congo.20.a: "我們沒有資格阻止他們"
 ww_congo.20.b: "誰允許他們獨立的？"
 ww_congo.21.t: "姆瓦姆布扎宣言"
 ww_congo.21.d: "隨著我們政府對盧旺達—烏隆地託管地的控制力度不斷減弱，並且民族主義情緒在當地逐步瀰漫，布隆迪國王姆瓦米·姆瓦姆布扎三世·盧達希格瓦已經宣佈國家獨立，斷絕了與我們的中央政府的關係。我們是否應該介入？"
 ww_congo.21.a: "我們沒有資格阻止他們"
 ww_congo.21.b: "誰允許他們獨立的？"
 threatened_us_opinion_modifier: "他們威脅了我們！"
 attempted_diplomacy_opinion_modifier: "他們試圖以外交方式接觸我們"
 BEL_commonwealth_faction: "比利時聯邦"
 ww_congo.22.t: "[COG.GetLeader]要求擴大對剛果的移民"
 ww_congo.22.desc: "我們的剛果總督[COG.GetLeader]表達了增加[ROOT.GetAdjective]移民來本地區的願望，旨在吸引具有知識和資金的人才。加丹加富饒溫暖的土地將吸引有探險精神或使命感的人，如果我們推廣這項政策，必將吸引許多人遷徙過來。"
 ww_congo.22.a: "我們會接受。"
 ww_congo.22.b: "他以為他是誰？"
 ww_congo.23.t: "[FROM.GetAdjective]同意我們的移民計劃"
 ww_congo.23.desc: "[FROM.GetNameDef]殖民政府同意了我們推動[FROM.GetAdjective]移民的請求。新一波準備協助好我們國家建設的人肯定會開始湧入。"
 ww_congo.23.a: "完美"
 ww_congo.24.t: "[FROM.GetAdjective]拒絕我們的移民計劃"
 ww_congo.24.desc: "[FROM.GetNameDef]殖民政府拒絕了我們推動[FROM.GetAdjective]移民的請求。真是遺憾，但我們無法改變他們的主意。"
 ww_congo.24.a: "我說，我們在期望什麼？"
 ww_congo.25.t: "阿爾貝特·德·弗萊斯豪韋爾前往國外遊說支持"
 ww_congo.25.desc: "比利時殖民部長阿爾貝特·德·弗萊斯豪韋爾，皮埃爾·裡克曼斯的親密盟友，決定出國遊說我們新盟友的支持，目前形勢似乎十分嚴峻，大陸政客拒絕採取行動。也許有了他的幫助，我們可以達成一些有利的協議？"
 ww_congo.25.a: "這是戰爭真正開始的地方"
 ww_congo.26.t: "[FROM.GetNameDefCap]佔領[796.GetName]！"
 ww_congo.26.desc: "\n本週早些時候，[COG.GetNameDef]軍隊開進並佔領了我們在[796.GetName]的領地，宣稱他們的任務是保護該地區免受敵人可能的佔領。這顯然是一種戰爭行為，但我們也許可以選擇無視，因為他們大概不是想要與我們開戰，而是在尋求統一剛果盆地。"
 ww_congo.26.a: "不值得為之開戰"
 ww_congo.26.b: "他們以為自己是誰？"
 ww_congo.27.t: "盧盧阿堡兵變"
 ww_congo.27.desc: "本週早些時候，由一級軍士長恩戈伊·穆卡拉布什領導的剛果士官在卡賽省的盧盧阿堡發動了叛變。主要的觸發因素之一似乎是他們遭到了比利時軍官的錯誤對待。叛變者在早晨闖入基地的軍械庫，洗劫了鎮上的白人區。他們還攻擊了殖民當局的顯著標志，並宣稱他們的獨立願望。隨後，他們分散到各自的村莊，在途中進行掠奪，但似乎未能將叛亂擴散到鄰近的駐軍。我們應該如何處理這個情況？"
 ww_congo.27.a: "逮捕他們，並拿穆卡拉布希殺雞儆猴"
 ww_congo.27.b: "這意味著需要做出大的改變"
 COG_pro_independence_reforms_in_the_force_publique_structure: "公安軍內支持獨立的改革"
 ww_congo.28.t: "對民族解放委員會的懷疑增加"
 ww_congo.28.desc: "由於新成立的民族解放委員會對殖民政府採取了更對立的立場，許多鄉村地區的人們開始擔心委員會可能不會採取和平路線實現獨立。此外，在加丹加地區，已經開始有分裂的傳言，當我們的解放戰爭開始時，該地區可能會嘗試宣佈獨立……"
 ww_congo.28.a: "他們需要被說服，或者被武力解放"
 COG_coquilatville_and_lusambo_will_join_the_belgian_loyalsits_tt: "獨立戰爭爆發時，§Y[538.GetName]§!和§Y[888.GetName]§!會加入§Y親比利時忠誠者§!"
 ww_congo.29.t: "剛果民族主義者向我們求助"
 ww_congo.29.desc: "自稱為民族解放委員會的剛果民族主義者正在準備一場對抗其宗主國的獨立戰爭。他們向我們保證，一旦戰爭勝利，他們將與我們結為更緊密的聯盟，前提是我們在戰鬥開始時向他們提供武器，並且他們聲稱削弱[BEL.GetName]符合我們的利益。"
 ww_congo.29.a: "當然可以"
 ww_congo.29.b: "沒理由插手"
 ww_congo.30.t: "[FROM.GetNameDefCap]決定幫助我們"
 ww_congo.30.desc: "我們的外交官已經從與[FROM.GetAdjective]軍事人員的會談中返回，並與他們達成了一項協議，即在我們決定向壓迫者宣戰時，他們將向我們派遣人員和裝備。今天是剛果人民的好日子！"
 ww_congo.30.a: "完美"
 ww_congo.31.t: "[FROM.GetNameDefCap]決定不幫助我們"
 ww_congo.31.desc: "我們的外交官從與[FROM.GetAdjective]軍事人員的會談中空手而歸。看來協議沒有達成，我們所謂的盟友背叛了我們……"
 ww_congo.31.a: "真可惜"
 ww_congo.32.t: "辛巴政變"
 ww_congo.32.desc: "辛巴運動最近在全國獲得了廣泛支持。現在，他們進入了全國代表大會，要求更換領導層。我們的政治家無能為力，只能接受這種情況。然而，問題在於，現在誰應該領導我們的國家？"
 ww_congo.32.a: "西里爾·阿杜拉是個好政治家"
 ww_congo.32.b: "克里斯托弗·格本耶應當領導"
 ww_congo.33.t: "領導權問題"
 ww_congo.33.desc: "由於西里爾·阿杜拉與美國人和比利時工會的聯繫，我國領導層最近遭到了質疑。許多人認為辛巴運動的領導人克里斯托夫·格貝涅應該成為國家的新主席。我們是否應該向他們屈服？"
 ww_congo.33.a: "西里爾·阿杜拉是個治國能手，他不能離開"
 ww_congo.33.b: "克里斯托弗·格本耶應當領導"
 ww_congo.34.t: "誇梅·恩克魯瑪的國事訪問"
 ww_congo.34.desc: "應[ROOT.GetLeader]的正式邀請，加納泛非主義政治家誇梅·恩克魯瑪今天抵達了我們的首都。他是一位積極的社會主義者，許多人認為，如果我們希望確保非洲的未來，與他合作或許是有益的，有些人甚至宣稱他應該接過我們國家領導人的責任。哪一個是最好的行動方案？"
 ww_congo.34.a: "我們相信可以實現偉大的合作"
 ww_congo.34.b: "他正是我們需要的領袖！"
 ww_congo.35.t: "[COG.GetNameDefCap]鼓動殖民地抵抗"
 ww_congo.35.desc: "\n據報，[COG.GetAdjective]政府已經開始向非洲的抵抗組織運送武器，並窩藏和訓練持不同政見者和民兵，以便這些人解放被我們佔領的國家。我們需要對該地區保持警惕……"
 ww_congo.35.a: "我們必須馬上終結這種行為！"
 ww_congo.35.b: "非洲的時代到來了"
 ww_congo.36.t: "[FROM.GetName]拒絕和平提議"
 ww_congo.36.desc: "來自[FROM.GetNameDef]的大使拒絕了我們的和平請求。他們聲稱我們對他們所發起的進攻是完全沒有緣由的，因此，他們不接受來自已成為地區性威脅的我們的任何除無條件投降外的提議。"
 ww_congo.36.a: "真是虛偽，對於他們的帝國主義暴行只能以暴制暴"
 ww_congo.37.t: "[FROM.GetNameDefCap]就[?COG.COG_disputed_colony.GetAdjective]獨立提出和平提議"
 ww_congo.37.desc: "[FROM.GetAdjective]外交官向我們呈遞了一份和平協議。這項協議要求我們放棄對在與[FROM.GetNameDef]的衝突中所丟失的[?COG.COG_disputed_colony.GetAdjective]領土的宣稱。外交官同時提出，會在我們放棄的[?COG.COG_disputed_colony.GetAdjective]領土上舉行公投，以此選舉出新的政府，但選舉是否獨立公正卻沒人清楚。"
 ww_congo.37.a: "我們決不會放棄我們的領土"
 ww_congo.37.b: "我們別無選擇，只能同意"
 ww_congo.38.t: "[FROM.GetName]同意和平提議"
 ww_congo.38.desc: "[FROM.GetNameDef]的外交官通知我們，他們的政府願意放棄對我們解放的[?COG.COG_disputed_colony.GetAdjective]領土的主張。他們現在正在將部隊撤回到該地區新建立的邊界。"
 ww_congo.38.a: "反對帝國主義的英勇勝利！"
 ww_congo.39.t: "第一次剛果選舉"
 ww_congo.39.desc: "第一次自由選舉已經結束，約瑟夫·卡薩武布成功當選。現在，他正在努力組建剛果第一任部長內閣。他在全國廣受歡迎，工作出色，肯定會成為一名被後人銘記的偉大總統。"
 ww_congo.39.a: "卡薩武布是一位出色的政治家，我們需要他"
 ww_congo.40.t: "卡薩武布的第一任內閣"
 ww_congo.40.desc: "我們的總統[ROOT.GetLeader]在最近選舉中獲勝後，正在組建我國的第一屆正式內閣。他在全國範圍內廣受歡迎，肯定會成為現代國家幾代人心中的國父！"
 ww_congo.40.a: "卡薩武布真的是這份工作的最佳人選"
 ww_congo.41.t: "[FROM.GetLeader]要求重新統一巴剛果族"
 ww_congo.41.desc: "\n[FROM.GetNameDef]的領導人、巴剛果聯盟的領袖，[FROM.GetLeader]，已向我們提出要求，要求我們將任何巴剛果族佔據多數的領土割讓給他們。我們應該如何回應？"
 ww_congo.41.a: "這是為了更大的利益"
 ww_congo.41.b: "沒門！"
 ww_congo.42.t: "[FROM.GetLeader]交出巴剛果族領土"
 ww_congo.42.desc: "\n[FROM.GetNameDef]的領導人[FROM.GetLeader]，已同意交出巴剛果族佔據多數的領土，祝願我們未來一切順利。今天是剛果民族的偉大日子。"
 ww_congo.42.a: "好極了！"
 ww_congo.43.t: "[FROM.GetLeader]不願交出巴剛果族領土"
 ww_congo.43.desc: "\n對於我們要求巴剛果族佔據多數的領土，[FROM.GetNameDef]的領導人[FROM.GetLeader]予以拒絕。我們應該如何應對外國勢力對我們同胞的壓迫？"
 ww_congo.43.a: "我們能做的不多"
 ww_congo.43.b: "給他們點顏色看看！"
 ww_congo.44.t: "阿瓜羅薩達王室"
 ww_congo.44.desc: "委員會決定，最合法的剛果統治者應是佩德羅七世，他是最近廢除的剛果王國的現任王位繼承人，該王國曾位於我們西部省份，即現在的卡賓達和安哥拉境內。毫無疑問，他能夠帶來穩定，實現巴剛果族的統一。"
 ww_congo.44.a: "他是我們能找到的最合法的候選人！"
 ww_congo.44.b: "不，我們需要別人！"
 ww_congo.45.t: "巴庫巴的尼姆"
 ww_congo.45.desc: "委員會決定，剛果的下一個最合法統治者應是姆博普·馬比因克·馬姆貝基，他是庫巴王國的國王，這是一個位於我們中部省份的小王國。毫無疑問，他能夠帶來穩定，並實現少數人才能實現的目標。"
 ww_congo.45.a: "他會帶領我們走向偉大！"
 ww_congo.45.b: "不，我們需要別人！"
 ww_congo.46.t: "馬盧安果"
 ww_congo.46.desc: "委員會決定，剛果的下一個最合法統治者應是莫伊·波阿提三世，他是盧安果王國的馬盧安果，這是一個大部分位於我們西部省份的國家，主要在現在的中剛果地區。毫無疑問，他能夠帶來穩定，並實現與西剛果省份的統一。"
 ww_congo.46.a: "他能給予我們對中剛果的合法宣稱！"
 ww_congo.46.b: "不，我們需要別人！"
 ww_congo.47.t: "布隆迪的恩圖韋羅家族"
 ww_congo.47.desc: "委員會決定，另一個可能的剛果統治者應是姆萬布薩四世，他是布隆迪王國的姆瓦米，布隆迪是東部的一個王國。毫無疑問，他能夠帶來穩定，並實現與布隆迪的統一。"
 ww_congo.47.a: "他至少能給予我們對布隆迪的合法宣稱……"
 ww_congo.47.b: "不，我們需要別人！"
 ww_congo.48.t: "盧旺達的阿巴尼吉尼亞氏族"
 ww_congo.48.desc: "委員會決定，另一個可能的剛果統治者應是穆塔拉三世·魯達希瓜，他是盧旺達王國的烏姆瓦米，盧旺達是東部的一個王國。毫無疑問，他能夠帶來穩定，並實現與盧旺達的統一。"
 ww_congo.48.a: "他至少能給予我們對盧旺達的合法宣稱……"
 ww_congo.48.b: "不，我們需要別人！"
 ww_congo.49.t: "德國的合作者"
 ww_congo.49.desc: "委員會決定，由於沒有其他選擇，最後一個可能的剛果統治者可以是尤希五世·穆辛加，他是盧旺達王國的烏姆瓦米，在世界大戰後由於與德國殖民帝國的合作和對其的崇拜而被比利時總督罷黜。選擇他可能風險很大，但至少他有遠大的抱負……"
 ww_congo.49.a: "他將不得不這樣如此……"
 ww_congo.49.b: "這與我們的計劃不一樣……"
 ww_congo.50.t: "[FROM.GetNameDefCap]尋求結盟"
 ww_congo.50.desc: "\n[FROM.GetNameDefCap]已經聯繫我們，提出建立共同聯盟。他們已經開始軍事化，並表達了希望合作以使我們雙方更加強大的願望。從歷史上看，我們的關係一直不太穩定，但沒有比現在更好的和解時機了。"
 ww_congo.50.a: "我們很樂意"
 ww_congo.50.b: "我們不需要他們"
 ww_congo.51.t: "[FROM.GetNameDefCap]同意結盟"
 ww_congo.51.desc: "\n[FROM.GetNameDefCap]熱情地回應了我們與他們結盟的請求，並簽署了所有必要的文件，使其正式生效。從此，對抗那些威脅我們的人，我們將不再孤軍奮戰！"
 ww_congo.51.a: "團結使我們強大！"
 ww_congo.52.t: "[FROM.GetNameDefCap]拒絕了我們的結盟提議"
 ww_congo.52.desc: "\n我們建立聯盟的提議被[FROM.GetLeader]冷淡地拒絕了。我們曾試圖證明我們的用處，但遺憾的是[FROM.GetNameDef]已經下定決心。雖然這令人非常惱火，但我們不會因此氣餒，而是尋找其他解決方案。"
 ww_congo.52.a: "我們會向他們證明"
 ww_congo.53.t: "[FROM.GetLeader]要求重新統一布隆迪人"
 ww_congo.53.desc: "\n[FROM.GetNameDef]和布隆迪人的領導人[FROM.GetLeader]，已經向我們提出要求，要求我們割讓任何布隆迪人佔多數的領土。我們應該如何回應？"
 ww_congo.53.a: "這是為了更大的利益"
 ww_congo.53.b: "沒門！"
 ww_congo.54.t: "[FROM.GetLeader]交出布隆迪人的領土"
 ww_congo.54.desc: "\n[FROM.GetNameDef]的領導人[FROM.GetLeader]，已同意交出布隆迪人佔據多數的領土，祝願我們未來一切順利。今天是剛果民族的偉大日子。"
 ww_congo.54.a: "好極了！"
 ww_congo.55.t: "[FROM.GetLeader]不願交出布隆迪人的領土"
 ww_congo.55.desc: "\n對於我們要求布隆迪人佔據多數的領土，[FROM.GetNameDef]的領導人[FROM.GetLeader]予以拒絕。我們應該如何應對外國勢力對我們同胞的壓迫？"
 ww_congo.55.a: "我們能做的不多"
 ww_congo.55.b: "給他們點顏色看看！"
 ww_congo.56.t: "[FROM.GetLeader]要求重新統一盧旺達人"
 ww_congo.56.desc: "\n[FROM.GetNameDef]和盧旺達人的領導人[FROM.GetLeader]，已經向我們提出要求，要求我們割讓任何盧旺達人佔多數的領土。我們應該如何回應？"
 ww_congo.56.a: "這是為了更大的利益"
 ww_congo.56.b: "沒門！"
 ww_congo.57.t: "[FROM.GetLeader]交出盧旺達人的領土"
 ww_congo.57.desc: "\n[FROM.GetNameDef]的領導人[FROM.GetLeader]，已同意交出盧旺達人佔據多數的領土，祝願我們未來一切順利。今天是剛果民族的偉大日子。"
 ww_congo.57.a: "好極了！"
 ww_congo.58.t: "[FROM.GetLeader]不願交出盧旺達人的領土"
 ww_congo.58.desc: "\n對於我們要求盧旺達人佔據多數的領土，[FROM.GetNameDef]的領導人[FROM.GetLeader]予以拒絕。我們應該如何應對外國勢力對我們同胞的壓迫？"
 ww_congo.58.a: "我們能做的不多"
 ww_congo.58.b: "給他們點顏色看看！"
 ww_congo.59.t: "[FROM.GetLeader]請求成為保護國"
 ww_congo.59.desc: "\n[FROM.GetNameDef]的領導人[FROM.GetLeader]，最近找到了我們的外交官，乞求我們重新恢復對他的王國的宗主權，甚至把他的國家命名為德意志中非帝國。他曾在統治盧旺達時受到我們的保護，但後來被比利時當局趕下了臺。我們是否應該回應這位瘋王的請求？"
 ww_congo.59.a: "這是我們不可錯過的機會"
 ww_congo.59.b: "不！"
 ww_congo.60.t: "[FROM.GetLeader]接受我們成為他們保護國的請求"
 ww_congo.60.desc: "\n[FROM.GetNameDef]的領導人[FROM.GetLeader]，決定接受我們的請求，允許我們再次成為他們國家的保護國。非洲的平衡終於恢復了！"
 ww_congo.60.a: "今天是值得銘記的一天！"
 ww_congo.61.t: "[FROM.GetLeader]拒絕我們成為他們保護國的請求"
 ww_congo.61.desc: "\n[FROM.GetNameDef]的領導人[FROM.GetLeader]，決定拒絕我們的請求，因為他認為我們的地區價值不大，他聲稱對於他們未曾擁有的東西，我們沒有什麼能帶給他們的。"
 ww_congo.61.a: "今天是值得銘記的一天……"
 ww_congo.62.t: "拉烏爾·範奧弗斯特拉滕返回比利時"
 ww_congo.62.desc: "比利時軍官拉烏爾·範奧弗斯特拉滕在我們國家服務至今，鑑於他們家園的失守，他被召回[BEL.GetName]。他在這裡為我們恪盡職守，我們希望他能夠協助趕走入侵者。"
 ww_congo.62.a: "祝好運！"
 ww_congo.63.t: "[FROM.GetLeader]希望向我們出售鈾"
 ww_congo.63.desc: "\n[FROM.GetLeader]，[FROM.GetNameDef]的領導人，向我們提出了一個有趣的提議。顯然，該國的鈾礦藏比預期更為豐富，現在有計劃將部分原材料走私到我們國家，當然是有償的。"
 ww_congo.63.a: "這是巨大的恩惠"
 ww_congo.63.b: "我們不會墮落到犯罪的地步"
 ww_congo.64.t: "[FROM.GetLeader]同意鈾交易"
 ww_congo.64.desc: "\n[FROM.GetNameDef]的領導人[FROM.GetLeader]同意簽署我們提議的鈾協議，並且送來了我們要求的款項。"
 ww_congo.64.a: "好極了！"
 ww_congo.65.t: "[FROM.GetLeader]拒絕鈾交易"
 ww_congo.65.desc: "\n[FROM.GetLeader]，[FROM.GetNameDef]的領導人，拒絕了我們走私鈾礦的請求，聲稱他們不會讓自己墮落為國際罪犯。"
 ww_congo.65.a: "太糟糕了……"
 ww_congo.66.t: "[FROM.GetNameDefCap]取消鈾交易"
 ww_congo.66.desc: "\n[FROM.GetNameDef]的領導人[FROM.GetLeader]決定取消我們之間的鈾協議，他們認為這對[FROM.GetAdjective]來說代價太過高昂。"
 ww_congo.66.a: "這太糟了……"
 ww_congo.67.t: "[FROM.GetLeader]邀請我們加入鈾礦開發托拉斯"
 ww_congo.67.desc: "\n[FROM.GetLeader]，[FROM.GetNameDef]的領導人，向我們提出了一個有趣的提議。他們希望我們加入聯合鈾礦開發托拉斯，共享核材料和研究。雖然這可能會增加信息洩露的風險，但為了我們迫切需要的鈾，這可能非常值得。"
 ww_congo.67.a: "我們很樂意！"
 ww_congo.67.b: "這太危險了"
 ww_congo.68.t: "[FROM.GetLeader]加入鈾礦開發托拉斯"
 ww_congo.68.desc: "\n[FROM.GetLeader]，[FROM.GetNameDef]的領導人，同意加入我們提出的聯合鈾開發信託，得益於他們新獲得的鈾礦資源，他們的核計劃現在終於可以再次走上正軌。"
 ww_congo.68.a: "好極了！"
 ww_congo.69.t: "[FROM.GetLeader]否決了我們的提議"
 ww_congo.69.desc: "\n[FROM.GetLeader]，[FROM.GetNameDef]的領導人，拒絕了我們加入聯合鈾礦開發托拉斯的邀請，聲稱他們需要嚴格保密所有核項目，任何信息洩露給敵人的風險都太高，因此無法接受這一提議。"
 ww_congo.69.a: "太糟糕了……"
 ww_congo.70.t: "揚·祖姆巴赫加入了[ENG.GetAdjective]"
 ww_congo.70.desc: "我們的飛行員揚·祖姆巴赫已經離開我們，決定為英國皇家空軍而戰。他離開戰友的決定並不容易，但我們必須為他想要為一個自由、擺脫壓迫的波蘭而繼續戰鬥而喝彩。"
 ww_congo.70.a: "祝他飛行順利"
 ww_congo.71.t: "揚·祖姆巴赫想去剛果"
 ww_congo.71.desc: "我們的王牌飛行員揚·祖姆巴赫從波蘭來到這裡，現在他表示希望離開，前往剛果幫助建立空軍。我們應該允許他這樣做嗎？"
 ww_congo.71.a: "讓他離開"
 ww_congo.71.b: "阻止他離開！"
 ww_congo.72.t: "揚·祖姆巴赫抵達"
 ww_congo.72.desc: "波蘭戰鬥機飛行員揚·祖姆巴赫剛剛抵達我國，表示他希望加入我們的空軍併為我們而戰。當然，我們可以為他安排一個職位。"
 ww_congo.72.a: "我們會給他安排工作"
 ww_congo.73.t: "[FROM.GetNameDefCap]就我們殖民地的獨立提出和平提議"
 ww_congo.73.desc: "[FROM.GetAdjective]的外交官們帶著和平的提議來找我們。這一提議取決於我們是否同意放棄對某些非洲領土的要求，並從那裡撤軍。我們是否接受？"
 ww_congo.73.a: "我們不會放棄我們的領土"
 ww_congo.73.b: "我們別無選擇，只能同意"
 #### THE WHISPERS AND NEGOTIATIONS OF INDEPENDENCE EVENT CHAIN ####
 congo_independence_struggle.1.t: "獨立的低語"
 congo_independence_struggle.1.d: "自從我們的大陸被歐洲人瓜分以來，我們一直渴望自由，渴望有能力開創自己的未來。作為[BEL.GetNameDefCap]的殖民地，我們的歷史充滿了剝削和非人化，但我們總是因為自己的分裂和他們的強大武力而被壓制。\n\n街頭和叢林中再次傳來煽動的低語，我們的人民表達了他們希望剛果擺脫殖民干涉的夢想。一個能夠自行立法、執法的剛果，一個能夠勞有所得的剛果，一個能夠塑造自己未來的剛果。"
 congo_independence_struggle.1.a: "我們應該嘗試通過外交獲得自由"
 congo_independence_struggle.1.b: "我們必須不惜一切代價獲得獨立"
 congo_independence_struggle.2.t: "[FROM.GetNameDefCap]就獨立問題與我們接觸"
 congo_independence_struggle.2.d: "我們剛剛收到一個聲稱代表我們殖民地的[COG.GetNameDef]獨立運動的團體的來信。儘管那裡的殖民政府早已意識到日益高漲的獨立情緒，但真正提出這個要求的大膽舉動讓他們有些措手不及。他們警告我們，當地人廣泛支持實現這一自由獨立國家的目標，如果我們選擇反應過於激烈，這可能會導致暴力甚至戰爭。\n\n我們還必須考慮我們的全球承諾和聲望。因此，最外交的提議是允許他們作為平等夥伴國加入我們的[BEL.GetAdjective]聯邦。\n\n另外，我們很大一部分財富來自於那個地區，如果失去這些領土，我們的財政將受到特別嚴重的打擊。我們可以要求他們以相當高的價格為他們的自由買單。\n\n最後，我們可以簡單地說不，並動員我們的軍隊，以警告任何潛在的起義。"
 congo_independence_struggle.2.a: "只要他們繼續與我們並肩作戰"
 congo_independence_struggle.2.b: "很好，但前提是他們得給我們很大的補償"
 congo_independence_struggle.2.c: "我們絕不會心甘情願地放手！"
 congo_independence_struggle.3.t: "[FROM.GetNameDefCap]將給予我們自由，前提是我們加入他們的陣營"
 congo_independence_struggle.3.d: "[BEL.GetName]告知我們，他們承認殖民帝國的時代即將結束。因此，他們提出，我們作為自由和獨立的國家加入[Bel.GetAdjective]聯邦的邀請，並因此成為平等的夥伴國。我們仍需遵守提供給任何其他軍事盟友的相同條款，因此需要在任何戰爭中共同參戰。\n\n這是在外交手段下，我們可以期望的最好成果，這將使我們完全避免與歐洲朋友的流血衝突，同時維護非洲的自豪感和獨立性。"
 congo_independence_struggle.3.a: "這聽起來很合理。我們接受！"
 congo_independence_struggle.3.b: "我們不能同意那些條件……"
 congo_independence_struggle.4.t: "[FROM.GetNameDefCap]會在我們支付賠償金後讓我們獲得自由"
 congo_independence_struggle.4.d: "[BEL.GetName]告知我們，他們已經為我們的獨立付出了實實在在的代價。他們提醒我們，他們在我們國家投入了鉅額資本，包括鋪設了大量鐵軌、發展採礦能力以及基礎設施的大規模擴建。\n\n當時這被認為是作為殖民宗主國對我們的責任的一部分，僅僅是國家文明化過程的一部分。然而，現在他們將此作為抵押，旨在通過經濟依賴維持我們的持續忠誠。\n\n要價雖然不是無法承受，但太高了，會讓我們的國家在短期內陷入貧困，並在此後很長一段時間內因債務而依賴他們。現在的問題是，為獨立付出這等代價是否值得，還是應該用鮮血來支付？"
 congo_independence_struggle.4.a: "不管用何種方式，我們會籌措資金。"
 congo_independence_struggle.4.b: "我們不能同意那些條件……"
 congo_independence_struggle.5.t: "讓[FROM.GetNameDef]獨立"
 congo_independence_struggle.5.d: "[COG.GetName]新上任的大使剛剛告知我們，他們已經接受了從[BEL.GetAdjective]殖民統治中獨立的提議，作為交換，他們作為完全平等的成員國加入[BEL.GetAdjective]聯邦。現在的工作是將行政權力從殖民辦公室中剝離出來，並將這一責任轉交給他們的新政府。"
 congo_independence_struggle.5.a: "我們的使命結束了！"
 congo_independence_struggle.6.t: "[FROM.GetNameDefCap]不會接受我們的條件"
 congo_independence_struggle.6.d: "事實證明，[COG.GetNameDef]拒絕了我們為和平和互利的獨立道路所提供的慷慨提議。因此，現在由我們決定要以多大的力度，來維持控制這個不守規矩的殖民地。我們有三個選項，如下：\n\n第一，如果我們認為他們對獨立的決心在動搖，我們可以提供他們海外省的地位，實際上將他們從殖民資產轉變為我們國家的一部分，給予非常有限的自治權。\n\n第二，是挑起他們的公開衝突，然後在戰場上展示我們對他們的力量。這是一場賭博，但如果我們贏了，通向完全統治的道路就會打開，我們可以在不受國際譴責的情況下奪取他們的所有資產。\n\n第三個選項是最具外交性的，我們採用類似於大英帝國的模式，給予[COG.GetNameDef]成為自治領的權利。仍由我們代管他們的外交活動，但除此之外，他們的自治權將大大擴大。\n\n然而，我們應該注意，如果他們拒絕以上任何一個選項，那麼除了訴諸暴力，可能沒有其他辦法。"
 congo_independence_struggle.6.a: "要求他們成為海外省"
 congo_independence_struggle.6.b: "那就沒必要談判了"
 congo_independence_struggle.6.c: "讓我們繼續用外交手段。也許他們願意成為自治領？"
 congo_independence_struggle.7.t: "讓[FROM.GetNameDef]獨立"
 congo_independence_struggle.7.d: "[COG.GetNameDef]新任大使剛剛告知我們，他們接受了購買獨立的提議。現在的工作是將行政權力從殖民辦公室中剝離，並將這一責任轉交給他們的新政府——當然，還要確保已備好銀行賬戶和控股公司，以便開始接收應付款項。"
 congo_independence_struggle.7.a: "我們的使命已經結束，但我們的利潤還在繼續！"
 congo_independence_struggle.8.t: "[FROM.GetNameDefCap]希望我們成為海外省"
 congo_independence_struggle.8.d: "[BEL.GetName]似乎認為我們無法通過武力從他們手中奪取獨立，並認為我們是虛張聲勢。他們提供了成為海外省的“機會”，實際上將我們變成他們國家的一部分，享有公民權利，但沒有自主塑造未來的自治權。他們可能是對的，我們缺乏反對這種情況的軍事力量，然而，最終的選擇權在我們手中。"
 congo_independence_struggle.8.a: "好吧，我們接受……"
 congo_independence_struggle.8.b: "這是無法接受的，我們要求完全獨立！"
 congo_independence_struggle.9.t: "公安軍在利奧波德維爾對我們的部隊發起了進攻"
 congo_independence_struggle.9.d: "今天早晨，黎明時分，叛亂的公安軍襲擊了利奧波德維爾的政府大樓，槍聲大作。忠誠的衛兵進行了還擊，併成功將叛軍擊退，然而，緊張局勢極高，並有報告稱各地的公安軍進一步發生叛亂，地方民兵開始在剛果各地武裝集結。"
 congo_independence_struggle.9.a: "剛果正在醞釀危機"
 congo_independence_struggle.22.t: "新海外省的形成"
 congo_independence_struggle.22.d: "被嚴厲訓斥的[COG.GetNameDef]代表團告知我們，他們決定接受成為[BEL.GetName]的海外省。我們的公民和稅務辦公室已經開始起草文件，以便將這些新公民適當地整合到我們的系統中，殖民辦公室也開始起草一套更貼近[BEL.GetAdjective]模式的地方政府新系統。"
 congo_independence_struggle.22.a: "我們成功愚弄了他們！"
 congo_independence_struggle.23.t: "[FROM.GetNameDefCap]希望我們成為自治領"
 congo_independence_struggle.23.d: "我們與[BEL.GetName]外交官的會晤取得了成果，似乎他們仍希望走外交路線。他們為我們提供了類似於大英帝國模式的自治領地位。我們仍需要遵循[BEL.GetAdjective]的外交政策，但我們將有更多的自治權，同時仍然受到他們的保護。"
 congo_independence_struggle.23.a: "我們可以同意"
 congo_independence_struggle.23.b: "這是無法接受的，我們要求完全獨立！"
 congo_independence_struggle.10.t: "[FROM.GetNameDefCap]願意接受自治領地位"
 congo_independence_struggle.10.d: "我們剛剛收到[COG.GetNameDef]對我們提升其為自治領提議的回覆，他們同意了！\n\n現在我們已經看到他們願意談判，如果我們再推一把，我們也許可以進一步說服他們，但這不是沒有風險的，我們可能會完全失去他們，或者更糟的是，將他們逼入絕境。"
 congo_independence_struggle.10.a: "我們可以同意他們成為自治領"
 congo_independence_struggle.10.b: "不，我們可以施壓令他們進一步整合。"
 congo_independence_struggle.11.t: "剛果自治領的建立"
 congo_independence_struggle.11.d: "根據與[BEL.GetName]的協議，今天早上我們破土動工，開始建造新的政府大樓，以容納自治領議會。下一步將是開始起草憲法，並舉行第一次選舉。從這些瑣碎的行動開始，我們可以開始塑造這個國家未來的政治身份。"
 congo_independence_struggle.11.a: "是時候艱苦奮鬥，建設我們的全新自治領了！"
 congo_independence_struggle.12.t: "[FROM.GetNameDefCap]拒絕自治領方案"
 congo_independence_struggle.12.d: "令人震驚的是，[BEL.GetName]決定撤銷成立自治領的提議！我們不完全確定導致這種態度轉變的原因，或許是在我們的一次讓步之後，殖民者正在做他們最擅長的事情，得寸進尺。我們必須決定如何回應此等侮辱。"
 congo_independence_struggle.12.a: "這是不可接受的！用武力威脅他們！"
 congo_independence_struggle.12.b: "我們應該退讓，一處海外領地也沒那麼差。"
 congo_independence_struggle.13.t: "剛果退讓並同意成為海外領地"
 congo_independence_struggle.13.d: "我們對[COG.GetName]的外交策略奏效了！他們的代表團今天前來接受成為海外領地。"
 congo_independence_struggle.13.a: "完美！"
 congo_independence_struggle.14.t: "[FROM.GetNameDefCap]威脅開戰"
 congo_independence_struggle.14.d: "一位來自[COG.GetNameDef]的非常好戰的代表早些時候會見了殖民地總督。顯然對談判進展感到沮喪，於是發出了最後通牒。\n\n要麼我們立即接受他們的獨立，要麼他們將敲響對抗我們的自由之鐘。我們已經收到他們的民兵部隊集結的報告，並且已經發生了幾起針對公安軍駐軍的衝突。目前還沒有人員死亡，但在如此緊張的情況下，這只是時間問題。"
 congo_independence_struggle.14.a: "那就讓他們嚐嚐戰爭的滋味！[COG.GetNameDef]屬於我們！"
 congo_independence_struggle.14.b: "我們在當下確實擴張太過度了。給他們想要的自由吧。"
 congo_independence_struggle.15.t: "[FROM.GetNameDefCap]不會不戰而退"
 congo_independence_struggle.15.d: "忠誠的公安軍今天試圖逮捕獨立運動的領導人。[COG.GetAdjective]民兵介入，雙方發生了槍戰。看來外交手段已經失敗，這場獨立戰爭正式開始了。"
 congo_independence_struggle.15.a: "我們能贏"
 congo_independence_struggle.16.t: "[FROM.GetNameDefCap]退讓並讓我們獲得獨立"
 congo_independence_struggle.16.d: "我們設法從與殖民宗主國的戰爭邊緣退了回來。確切地說，是前殖民宗主國。\n\n我們派出的代表團今天上午會見了殖民地總督，雙方簽署了正式宣佈[COG.GetNameDef]獨立的文件。我們現在是一個自由的國家，權力的移交已經開始。\n\n從現在起，我們牢牢掌握自己的命運，且沒有付出血、驕傲或金錢的代價。"
 congo_independence_struggle.16.a: "今天是值得慶祝的一天！"
 congo_independence_struggle.17.t: "[FROM.GetNameDefCap]不惜一切代價尋求獨立"
 congo_independence_struggle.17.d: "今天早上，我們通過無線電收到了來自[COG.GetNameDef]殖民地總督倉促拼湊而成的報告。他聲稱，一群暴徒闖入他的官邸，用外國製造的武器制服了守衛，並把一份獨立宣言交到他手中。隨後他們迅速離開。最令人擔憂的是，這群暴徒似乎由公安軍的成員領導，這支憲兵部隊本應負責維持秩序。\n\n這份宣言要求殖民政府立即撤出行政機構，隨後將合法權力移交給由叛軍領導層組成的民選政府。我們不能有任何幻想，風險是真實存在的，而且這群暴徒使用了非[BEL.GetAdjective]設計的武器，這可能表明已有外國勢力直接插手那裡的局勢，並可能在軍事上支持叛軍。"
 congo_independence_struggle.17.a: "我們別無選擇，只能接受"
 congo_independence_struggle.17.b: "他們簡直痴心妄想！立刻部署一支遠征軍恢復秩序！"
 congo_independence_struggle.18.t: "[FROM.GetNameDefCap]讓我們獨立"
 congo_independence_struggle.18.d: "看起來我們的最後通牒被我們的宗主國認真對待了，因為今天我們收到了殖民地政府簽署的獨立敕令。官方正在計劃降下[BEL.GetAdjective]旗幟，和平地移交權力給我們的新政權。儘管我們的主要目標已經實現，但建立政府的真正工作現在才開始。我們有很多事情要做，需要發展經濟、要與其他國家的關係正常化，當然還有償還支持我們實現這一夢想的勢力的債務。"
 congo_independence_struggle.18.a: "今天是值得慶祝的一天！"
 congo_independence_struggle.19.t: "[FROM.GetNameDefCap]準備開戰"
 congo_independence_struggle.19.d: "我們收到報告稱，[BEL.GetAdjective]軍隊已經開始在利奧波德維爾集結，並對公安軍中的叛亂分子進行鎮壓。儘管我們盡了最大的努力讓[BEL.GetAdjective]政府屈服，並實現不流血的獨立目標，但殖民勢力選擇了他們唯一知道的方式來維持權力——通過武力。我們的機會窗口正在迅速關閉，我們必須決定是否要發出指令，讓我們的支持者起義，還是在局勢失控前讓他們停下來。"
 congo_independence_struggle.19.a: "勝利將歸於他們！"
 congo_independence_struggle.19.b: "這太危險了。我們必須退讓。"
 congo_independence_struggle.20.t: "剛果發動獨立戰爭！"
 congo_independence_struggle.20.d: "我們採取了儘可能的措施來控制迅速惡化的局勢，包括系統地清除公安軍中的叛徒分子。不幸的是，這種更公開的行動被視為好戰行為，叛亂部隊一看到軍官接近就開火了。隨著這些子彈的射出，雙方都無法控制局勢，獨立戰爭正式開始。\n\n有些地區仍然忠於我們，因為他們最直接地感受到了殖民的好處，然而，那裡的大多數人現在都反對我們。"
 congo_independence_struggle.20.a: "兄弟們，武裝起來！"
 congo_independence_struggle.21.t: "剛果退讓並同意成為海外領地"
 congo_independence_struggle.21.d: "我們對剛果當前局勢的迅速反應似乎平息了那裡的緊張局勢。[BEL.GetAdjective]軍官迅速行動，平定了公安軍的已知的叛亂分子。隨著他們的忠誠得到保障，叛亂的火焰迅速熄滅，最響亮的聲音被靜音——大多數情況是在厚厚的監獄牆後。\n\n殖民地政府主動出擊，抓住機會，擴大了他們對各級政府的控制，因此我們對殖民地的控制程度比以前高得多。"
 congo_independence_struggle.21.a: "榮耀歸於[BEL.GetAdjective]帝國！"
 congo_independence_struggle.24.t: "利奧波德維爾的效忠派激化衝突"
 congo_independence_struggle.24.d: "槍聲打破了清晨的寧靜。[BEL.GetAdjective]警察部隊被派遣去抓捕公安軍的愛國分子，他們遭遇的卻是一陣槍林彈雨。叛亂迅速蔓延，民兵開始在全國各地武裝起來。全國範圍內廣泛存在對獨立事業的支持，然而，殖民軍隊仍控制著幾個地區，特別是在他們最先進行剝削並因此擁有最多軍事存在的地方。\n\n這場獨立戰爭已經正式開始，我們不會休息，直到剛果擺脫歐洲的佔領。"
 congo_independence_struggle.24.a: "這是一場我們輸不起的戰爭！"
 congolese_civil_war_starting_tt: "剛果將對我們發動獨立戰爭。如果他們控制了§Y利奧波德維爾§!、§Y伊麗莎白維爾§!和§Y斯坦利維爾§!，他們將能夠強行實現和平並獲得完全獨立。\n\n同樣地，我們也能通過控制§Y利奧波德維爾§!、§Y伊麗莎白維爾§!和§Y斯坦利維爾§!來強行實現和平，並保留我們對該地的控制權。"
 congolese_civil_war_starting_congo_side_tt: "效忠比利時派將對我們發動內戰。如果我們控制了§Y利奧波德維爾§!、§Y伊麗莎白維爾§!和§Y斯坦利維爾§!，將能夠與我們的前宗主國強行實現和平並獲得完全獨立。\n\n同樣地，他們們也能通過控制§Y利奧波德維爾§!、§Y伊麗莎白維爾§!和§Y斯坦利維爾§!來強行實現和平，並保留對我國的控制權。"
