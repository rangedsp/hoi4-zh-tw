 wuw_GER_realpolitik.1.t: "[FROM.GetNameDefCap]邀請我們加入聯盟"
 wuw_GER_realpolitik.1.desc: "[FROM.GetNameDef]的[FROM.GetLeader]今天抵達我們的首都，向我們提出了一項邀請。他們希望我們加入他們的聯盟，並參與他們之前建立的所有夥伴關係和同盟。我們是否接受這項邀請？"
 wuw_GER_realpolitik.1.a: "我們謙遜地接受這一提議"
 wuw_GER_realpolitik.1.b: "我們不需要他們的友誼！"
 wuw_GER_realpolitik.2.t: "[FROM.GetNameDefCap]接受我們的提議"
 wuw_GER_realpolitik.2.desc: "[FROM.GetNameDef]的[FROM.GetLeader]對我們的提議做出了積極的回應，他們的外交官已經抵達我國簽署必要的文件，以促進他們全面加入我們的聯盟。"
 wuw_GER_realpolitik.2.a: "很好"
 wuw_GER_realpolitik.3.t: "[FROM.GetNameDefCap]拒絕我們的提議"
 wuw_GER_realpolitik.3.desc: "[FROM.GetNameDef]的[FROM.GetLeader]對我們的聯盟邀請表示強烈不滿，並聲稱我們兩國之間的任何形式的合作都是絕不可能的。他們以為我們是什麼？某種征服者嗎？"
 wuw_GER_realpolitik.3.a: "他們失去了一個機會……"
 wuw_GER_realpolitik.4.t: "[FROM.GetNameDefCap]提供軍事支持"
 wuw_GER_realpolitik.4.desc: "[FROM.GetAdjective]人希望支持我們的戰爭，並送來了一些裝備。雖然這是相當小的一批物資，但任何援助我們都接受。"
 wuw_GER_realpolitik.4.a: "這肯定派得上用場"
 wuw_GER_weltpolitik.16.t: "[FROM.GetNameDefCap]建立勢力範圍"
 wuw_GER_weltpolitik.16.desc: "[FROM.GetNameDefCap]通知我們，他們已經建立了一個勢力範圍。雖然這並未直接影響我們，因為沒有正式協議，但這是我們需要注意的事情。他們可能會試圖將此強加給我們，或者在我們控制該區域後要求我們讓出領土。"
 wuw_GER_weltpolitik.16.a: "我們將一起征服世界！"
 wuw_GER_weltpolitik.16.b: "絕不可能！"
 wuw_GER_weltpolitik.17.t: "[FROM.GetNameDefCap]同意建立勢力範圍"
 wuw_GER_weltpolitik.17.desc: "我們從[FROM.GetAdjective]方面得到了消息，他們批准了建立勢力範圍的提議。這將防止敵對行動，並減少因周邊土地導致衝突的風險。"
 wuw_GER_weltpolitik.17.a: "太好了！"
 wuw_GER_weltpolitik.18.t: "[FROM.GetNameDefCap]拒絕建立勢力範圍"
 wuw_GER_weltpolitik.18.desc: "我們從[FROM.GetAdjective]方面得到了消息，他們將拒絕承認和認可我們的勢力範圍。而對於他們自己的勢力範圍，他們表示將自行決定，不會讓我們參與。這可能會在該地區引發一些緊張局勢。"
 wuw_GER_weltpolitik.18.a: "真無禮！"
 wuw_GER_weltpolitik.19.t: "[FROM.GetNameDefCap]要求控制我們的[ANG.GetAdjective]領土"
 wuw_GER_weltpolitik.19.desc: "衝動的[FROM.GetLeader]最近譴責我們非法佔領了[FROM.GetAdjective]的安哥拉。現在，我們收到了[FROM.GetAdjective]的最後通牒，他們的軍隊正在我們邊境集結。我們該如何回應？"
 wuw_GER_weltpolitik.19.a: "不值得為此流血犧牲"
 wuw_GER_weltpolitik.19.b: "那就過來拿啊！"
 wuw_GER_weltpolitik.20.t: "[FROM.GetNameDefCap]交出了他們的[ANG.GetAdjective]領土"
 wuw_GER_weltpolitik.20.desc: "[FROM.GetNameDef]的理智的[FROM.GetLeader]同意交出他們在安哥拉的領土，並命令他們的軍隊停止行動，撤出該地區。我們再次取得了勝利！"
 wuw_GER_weltpolitik.20.a: "這是偉大的一天！"
 wuw_GER_weltpolitik.21.t: "[FROM.GetNameDefCap]在安哥拉問題上態度堅決"
 wuw_GER_weltpolitik.21.desc: "雖然並不出人意料，但[FROM.GetNameDef]的愚蠢的[FROM.GetLeader]在收到我們的最後通牒後讓全國軍隊進入高度戒備狀態，並派遣使者聲明他們對於爭端領土絕不會退讓一步。"
 wuw_GER_weltpolitik.21.a: "他們會為自己的決定後悔的！"
 wuw_GER_weltpolitik.21.b: "我們必須放棄這一計劃"
 wuw_GER_realpolitik.5.t: "[LIT.GetAdjective]問題"
 wuw_GER_realpolitik.5.desc: "根據《佈列斯特-立托夫斯克和約》，目前被稱為立陶宛的土地應成為我們的附屬國，儘管具體細節尚未完全確定。現在，這個問題再次變得重要，我們必須決定，如何處理[LIT.GetNameDef]？"
 wuw_GER_realpolitik.5.a: "他們應該併入[ROOT.GetNameDef]"
 wuw_GER_realpolitik.5.b: "或許我們可以讓他們成為我們的附屬國"
 wuw_GER_realpolitik.6.t: "[FROM.GetNameDefCap]要求吞併我國"
 wuw_GER_realpolitik.6.desc: "[FROM.GetNameDef]的[FROM.GetLeader]要求我們服從他們的統治，成為他們國家的一個自治區域，正如《佈列斯特-立托夫斯克和約》中最初規定的那樣。我們是否應該屈服於他們的要求？"
 wuw_GER_realpolitik.6.a: "我們無力阻止他們……"
 wuw_GER_realpolitik.6.b: "我們永遠不會放棄我們的自由！"
 wuw_GER_realpolitik.7.t: "[FROM.GetNameDefCap]要求我們成為他們的附屬國"
 wuw_GER_realpolitik.7.desc: "[FROM.GetNameDef]的[FROM.GetLeader]要求我們服從他們的統治，成為他們的附屬國，正如《佈列斯特-立托夫斯克和約》中最初規定的那樣。我們是否應該屈服於他們的要求？"
 wuw_GER_realpolitik.7.a: "我們無力阻止他們……"
 wuw_GER_realpolitik.7.b: "我們永遠不會放棄我們的自由！"
 wuw_GER_realpolitik.8.t: "[FROM.GetNameDefCap]接受我們的要求"
 wuw_GER_realpolitik.8.desc: "[FROM.GetNameDef]的[FROM.GetLeader]宣佈，[FROM.GetAdjective]將服從我們的統治，因為他們無力阻止我們，戰爭只會給他們的土地和人民帶來更多的毀滅。"
 wuw_GER_realpolitik.8.a: "[ROOT.GetNameDef]偉大的一天！"
 wuw_GER_realpolitik.9.t: "[FROM.GetNameDefCap]拒絕我們的要求"
 wuw_GER_realpolitik.9.desc: "[FROM.GetNameDef]的[FROM.GetLeader]宣佈，我們要求他們服從的理由基於毫無價值的文件，並公開譴責了我們整個國家。看來，如果必要的話，他們決心為自己的自由而戰……"
 wuw_GER_realpolitik.9.a: "他們會為自己的決定後悔的"
 wuw_GER_realpolitik.10.t: "[FROM.GetNameDefCap]要求恢復君主制"
 wuw_GER_realpolitik.10.desc: "[FROM.GetNameDef]的[FROM.GetLeader]要求我們服從他們的統治，成為他們的附屬國，正如我們在1918年接受一位馮·黑森登上王位時的最初計劃那樣。我們是否應該屈服於他們的要求？"
 wuw_GER_realpolitik.10.a: "或許他們可以保護我們免受[SOV.GetAdjective]人的威脅"
 wuw_GER_realpolitik.10.b: "以“西蘇”精神為誓，我們絕不屈服！"
 wuw_GER_realpolitik.11.t: "[FROM.GetNameDefCap]接受我們的要求"
 wuw_GER_realpolitik.11.desc: "[FROM.GetNameDef]的[FROM.GetLeader]宣佈，[FROM.GetAdjective]將服從我們的統治，因為他們的前政府放棄君主制和德裔王位宣稱者是一個錯誤。"
 wuw_GER_realpolitik.11.a: "[ROOT.GetNameDef]偉大的一天！"
 wuw_GER_realpolitik.12.t: "[FROM.GetNameDefCap]拒絕我們的要求"
 wuw_GER_realpolitik.12.desc: "[FROM.GetNameDef]的[FROM.GetLeader]宣佈，我們要求他們服從的理由與我們人民和國家意志一樣脆弱。看來，如果必要的話，他們決心為自己的自由而戰……"
 wuw_GER_realpolitik.12.a: "他們會為自己的決定後悔的"
 wuw_GER_realpolitik.13.t: "[FROM.GetNameDefCap]要求我們成為他們的附屬國"
 wuw_GER_realpolitik.13.desc: "[FROM.GetNameDef]的[FROM.GetLeader]要求我們服從他們的統治，成為他們的附屬國，聲稱這是為了更容易保護我們免受[SOV.GetAdjective]人的威脅。我們是否應該屈服於他們的要求？"
 wuw_GER_realpolitik.13.a: "或許他們可以保護我們免受[SOV.GetAdjective]人的威脅"
 wuw_GER_realpolitik.13.b: "以“西蘇”精神為誓，我們絕不屈服！"
 wuw_GER_realpolitik.14.t: "[FROM.GetNameDefCap]接受我們的要求"
 wuw_GER_realpolitik.14.desc: "[FROM.GetNameDef]的[FROM.GetLeader]宣佈，[FROM.GetAdjective]將服從我們的統治，因為如果他們希望繼續進行援助親屬民族戰爭，他們需要一切可能得到的幫助。"
 wuw_GER_realpolitik.14.a: "[ROOT.GetNameDef]偉大的一天！"
 wuw_GER_realpolitik.15.t: "[FROM.GetNameDefCap]拒絕我們的要求"
 wuw_GER_realpolitik.15.desc: "[FROM.GetNameDef]的[FROM.GetLeader]宣佈，我們要求他們服從的理由與我們人民和國家意志一樣脆弱。看來，如果必要的話，他們決心為自己的自由而戰……"
 wuw_GER_realpolitik.15.a: "他們會為自己的決定後悔的"
 wuw_GER_realpolitik.16.t: "[FROM.GetNameDefCap]要求吞併我國"
 wuw_GER_realpolitik.16.desc: "[FROM.GetNameDef]的[FROM.GetLeader]宣佈，我國的存在必須儘快終結，因為我們應該被併入[FROM.GetAdjective]。我們應該接受他們的要求嗎？"
 wuw_GER_realpolitik.16.a: "這就是我們的終點了嗎？"
 wuw_GER_realpolitik.16.b: "拿起武器，戰鬥吧！"
 wuw_GER_realpolitik.17.t: "[FROM.GetNameDefCap]索要帝國領土"
 wuw_GER_realpolitik.17.desc: "[FROM.GetNameDef]的[FROM.GetLeader]要求我們歸還他們的舊帝國東部領土，即西普魯士、西里西亞和波森。這是一大片土地，但或許歸還給他們是避免被征服的唯一辦法。"
 wuw_GER_realpolitik.17.a: "如果這是必須的……"
 wuw_GER_realpolitik.17.b: "他們必須親自從我們手中奪走！"
 wuw_GER_realpolitik.18.t: "[FROM.GetNameDefCap]接受我們的要求"
 wuw_GER_realpolitik.18.desc: "[FROM.GetNameDef]的[FROM.GetLeader]宣佈，[FROM.GetAdjective]將歸還我們的舊帝國東部領土。最終，凡爾賽條約的歷史性的不公得以平反！"
 wuw_GER_realpolitik.18.a: "[ROOT.GetAdjective]民族偉大的一天！"
 wuw_GER_realpolitik.19.t: "[FROM.GetNameDefCap]拒絕我們的要求"
 wuw_GER_realpolitik.19.desc: "[FROM.GetNameDef]的[FROM.GetLeader]宣佈，我們要求他們的領土的理由已被凡爾賽條約所廢除，我們沒有權利違反該條約。"
 wuw_GER_realpolitik.19.a: "他們會為自己的決定後悔的"
 wuw_GER_realpolitik.19.b: "現在不是操之過急的時候"
 GER_kaiserreich_decided_not_to_attack_poland: "決定不因拒絕歸還舊帝國領土而攻擊§Y波蘭§!"
 wuw_GER_realpolitik.20.t: "[FROM.GetNameDefCap]要求進一步的讓步"
 wuw_GER_realpolitik.20.desc: "[FROM.GetNameDef]的[FROM.GetLeader]要求我們交出更多的領土。這次他們索要[87.GetName]、[98.GetName]和[97.GetName]。他們再次侵佔我們的國土，但或許這是避免滅亡的唯一方法。我們是否應該接受他們的條件？"
 wuw_GER_realpolitik.20.a: "希望這是最後一次了……"
 wuw_GER_realpolitik.20.b: "他們這次太過分了！"
 wuw_GER_realpolitik.21.t: "[FROM.GetNameDefCap]接受我們的要求"
 wuw_GER_realpolitik.21.desc: "[FROM.GetNameDef]的[FROM.GetLeader]宣佈，[FROM.GetAdjective]將把[87.GetName]、[98.GetName]和[97.GetName]交還給我們。或許他們還沒有看穿我們對[FROM.GetAdjective]的計劃。"
 wuw_GER_realpolitik.21.a: "[ROOT.GetAdjective]民族偉大的一天！"
 wuw_GER_realpolitik.22.t: "[FROM.GetNameDefCap]拒絕我們的要求"
 wuw_GER_realpolitik.22.desc: "[FROM.GetNameDef]的[FROM.GetLeader]宣佈，我們索要[FROM.GetAdjective]土地的理由是編造的謊言，他們不會坐視不管，任由我們從其人民手中竊取自古以來的[FROM.GetAdjective]土地。看來他們識破了我們的騙局。"
 wuw_GER_realpolitik.22.a: "他們沒有上當，但我們不會退縮！"
 wuw_GER_realpolitik.23.t: "[FROM.GetNameDefCap]邀請我們加入聯盟"
 wuw_GER_realpolitik.23.desc: "[FROM.GetNameDef]的[FROM.GetLeader]今天抵達我們的首都，向我們提出了一項邀請。他們希望我們加入他們的聯盟，並參與他們之前建立的所有夥伴關係和同盟。他們還聲稱，他們將幫助我們收復舊奧斯曼帝國的土地。我們是否接受這項邀請嗎？"
 wuw_GER_realpolitik.23.a: "是時候恢復我們自古以來的邊界了！"
 wuw_GER_realpolitik.23.b: "我們不需要他們的友誼！"
 wuw_GER_realpolitik.24.t: "[FROM.GetNameDefCap]接受我們的提議"
 wuw_GER_realpolitik.24.desc: "[FROM.GetNameDef]的[FROM.GetLeader]對我們的提議表示贊同，他們的外交官已經抵達我們的國家，簽署必要的文件，以促進他們全面加入我們的聯盟。他們很樂意接受我們的援助，收復舊奧斯曼帝國的土地。"
 wuw_GER_realpolitik.24.a: "很好"
 wuw_GER_realpolitik.25.t: "[FROM.GetNameDefCap]拒絕我們的提議"
 wuw_GER_realpolitik.25.desc: "[FROM.GetNameDef]的[FROM.GetLeader]對我們的聯盟邀請表示強烈不滿，並聲稱我們兩國之間的任何形式的合作都是絕不可能的。看來他們不想要我們幫助他們收復舊奧斯曼帝國的土地……"
 wuw_GER_realpolitik.25.a: "他們失去了一個機會……"
 wuw_GER_realpolitik.26.t: "[FROM.GetNameDefCap]請求貿易協定"
 wuw_GER_realpolitik.26.desc: "[FROM.GetNameDef]的[FROM.GetLeader]派遣外交官前往我們的首都，討論與[FROM.GetAdjective]建立複雜精細的貿易關係的前景。這將使我們兩國關係更加緊密，但也會讓他們以更低的價格獲取我們的資源，這可能會對我們的經濟造成不利影響。"
 wuw_GER_realpolitik.26.a: "我們認為這沒有問題"
 wuw_GER_realpolitik.26.b: "你們可以把文件帶回柏林了！"
 wuw_GER_realpolitik.27.t: "[ROOT.GetNameDef]內戰"
 wuw_GER_realpolitik.27.desc: "在經歷了長時間的君主主義思潮的增長之後，[ROOT.GetAdjective]的保守派分子似乎對等待政府的和平變革感到厭倦，他們聲稱我們的政府意圖獨攬大權，不願迴歸過去的時代。激烈的討論之後，談判似乎已經破裂，武裝衝突隨之而來。"
 wuw_GER_realpolitik.27.a: "為了國王！"
 wuw_GER_realpolitik.27.b: "我們必須制止這種愚蠢的行為！"
 wuw_GER_realpolitik.28.t: "[ROOT.GetNameDef]內戰"
 wuw_GER_realpolitik.28.desc: "在經歷了長時間的民主思潮的增長之後，[ROOT.GetAdjective]的民主派分子似乎對等待政府的和平變革感到厭倦，他們聲稱現任政府企圖獨攬大權，必須推翻它以使民主得以綻放。激烈的討論之後，談判途徑似乎已經破裂，武裝衝突隨之而來。"
 wuw_GER_realpolitik.28.a: "為了共和！"
 wuw_GER_realpolitik.28.b: "我們必須制止這種愚蠢的行為！"
 wuw_GER_realpolitik.29.t: "[ROOT.GetNameDef]內戰"
 wuw_GER_realpolitik.29.desc: "在經歷了一段時間的法西斯主義思潮的增長之後，[ROOT.GetAdjective]的法西斯主義分子似乎對等待政府和平變革感到厭倦，且在一起炸燬當地警察局的事件中，引發了街頭戰鬥。激烈的討論之後，談判途徑似乎已經破裂，武裝衝突隨之而來。我們只能屏住呼吸，靜觀[ROOT.GetAdjective]未來將走向何方。"
 wuw_GER_realpolitik.29.a: "為了革命！"
 wuw_GER_realpolitik.29.b: "我們必須制止這種愚蠢的行為！"
 #wuw_GER_realpolitik.30, wuw_GER_realpolitik.31 and wuw_GER_realpolitik.32 use other loc
 wuw_GER_realpolitik.33.t: "[FROM.GetNameDefCap]要求經濟一體化"
 wuw_GER_realpolitik.33.desc: "[FROM.GetNameDef]的[FROM.GetLeader]今天抵達我們的首都，向我們提出了一項提議。他們希望我們加強關稅同盟的活動，並進一步與他們進行經濟一體化。這將大大有利於我們的經濟，但這一切似乎有些不對勁……"
 wuw_GER_realpolitik.33.a: "這實在太誘人了，不可錯過"
 wuw_GER_realpolitik.33.b: "我們不會放棄經濟獨立！"
 wuw_GER_realpolitik.34.t: "[FROM.GetNameDefCap]接受我們的提議"
 wuw_GER_realpolitik.34.desc: "[FROM.GetNameDef]的[FROM.GetLeader]對我們的提議表示贊同，他們的外交官已經抵達我們的國家，簽署了必要文件，以促進進一步的經濟一體化。"
 wuw_GER_realpolitik.34.a: "我們感謝他們的天真"
 wuw_GER_realpolitik.35.t: "[FROM.GetNameDefCap]拒絕我們的提議"
 wuw_GER_realpolitik.35.desc: "[FROM.GetNameDef]的[FROM.GetLeader]對我們的一體化邀請表示強烈不滿，並聲稱兩國之間任何形式的更緊密的經濟合作都將永遠不可能實現。或許他們看出了我們計劃中的意圖……"
 wuw_GER_realpolitik.35.a: "糟糕的消息……"
 wuw_GER_realpolitik.36.t: "[FROM.GetNameDefCap]提議統一"
 wuw_GER_realpolitik.36.desc: "[FROM.GetNameDef]的[FROM.GetLeader]提議我們國家與他們統一，他們認為兩國人民是同一個民族，統一在一個更強大的國家下會更有安全感。儘管這份提議中帶有一些強硬和侵略性，但或許成為更大整體的一部分會更好？"
 wuw_GER_realpolitik.36.a: "小德意志方案是個錯誤"
 wuw_GER_realpolitik.36.b: "我們不會在獨立問題上妥協！"
 wuw_GER_realpolitik.37.t: "[FROM.GetNameDefCap]接受我們的要求"
 wuw_GER_realpolitik.37.desc: "[FROM.GetNameDef]的[FROM.GetLeader]宣佈，經過公投決定，[FROM.GetAdjective]將從今天起正式不復存在，它會成為[ROOT.GetAdjective]帝國的一個組成部分。看來我們的勸說成功了。"
 wuw_GER_realpolitik.37.a: "[ROOT.GetAdjective]民族偉大的一天！"
 wuw_GER_realpolitik.38.t: "[FROM.GetNameDefCap]拒絕我們的要求"
 wuw_GER_realpolitik.38.desc: "[FROM.GetNameDef]的[FROM.GetLeader]宣佈，我們要求[FROM.GetAdjective]屈服的理由完全破壞了[FROM.GetAdjective]主權和自決的理念。他們似乎不願成為大德意志國家的一部分。"
 wuw_GER_realpolitik.38.a: "在這種情況下，我們必須尊重他們的意願"
 wuw_GER_realpolitik.38.b: "[FROM.GetNameDefCap]就是[ROOT.GetAdjective]！"
 AUS_is_more_likely_to_accept_being_brothers_in_arms_flag: "§Y[AUS.GetAdjective]§!人民已經被我們爭取到了我們這邊"
 wuw_GER_realpolitik.39.t: "[FROM.GetNameDefCap]邀請我們加入聯盟"
 wuw_GER_realpolitik.39.desc: "[FROM.GetNameDef]的[FROM.GetLeader]今天抵達我們的首都，向我們提出了一項邀請。他們希望我們加入他們的聯盟，並參與他們之前建立的所有夥伴關係和同盟。他們還聲稱，他們將幫助我們收復舊匈牙利的土地，並幫助我們恢復大匈牙利。我們應該接受這項邀請嗎？"
 wuw_GER_realpolitik.39.a: "是時候恢復我們自古以來的邊界了！"
 wuw_GER_realpolitik.39.b: "我們不需要他們的友誼！"
 wuw_GER_realpolitik.40.t: "[FROM.GetNameDefCap]接受我們的提議"
 wuw_GER_realpolitik.40.desc: "[FROM.GetNameDef]的[FROM.GetLeader]對我們的提議表示贊同，他們的外交官已經抵達我們的國家，簽署必要的文件，以促進他們全面加入我們的聯盟。他們很樂意接受我們的援助，收復舊匈牙利的土地。"
 wuw_GER_realpolitik.40.a: "很好"
 wuw_GER_realpolitik.41.t: "[FROM.GetNameDefCap]拒絕我們的提議"
 wuw_GER_realpolitik.41.desc: "[FROM.GetNameDef]的[FROM.GetLeader]對我們的聯盟邀請表示強烈不滿，並聲稱兩國之間任何形式的合作都是永遠不可能的。看來他們不想要我們幫助他們收復舊匈牙利的土地……"
 wuw_GER_realpolitik.41.a: "他們失去了一個機會……"
 wuw_GER_realpolitik.42.t: "[FROM.GetNameDefCap]邀請我們加入聯盟"
 wuw_GER_realpolitik.42.desc: "[FROM.GetNameDef]的[FROM.GetLeader]今天抵達我們的首都，向我們提出了一個邀請。他們希望我們加入他們的聯盟，並再次像在那次世界大戰中那樣並肩作戰。他們還聲稱，他們將幫助我們收復舊奧匈帝國的土地，並幫助我們恢復帝國的領土完整。我們應該接受他們的提議嗎？"
 wuw_GER_realpolitik.42.a: "是時候恢復我們自古以來的邊界了！"
 wuw_GER_realpolitik.42.b: "我們不需要他們的友誼！"
 wuw_GER_realpolitik.43.t: "[FROM.GetNameDefCap]接受我們的提議"
 wuw_GER_realpolitik.43.desc: "[FROM.GetNameDef]的[FROM.GetLeader]對我們的提議表示贊同，他們的外交官已經抵達我們的國家，簽署必要的文件，以促進他們全面進入中歐同盟。他們很樂意接受我們的援助，收復舊奧匈帝國的土地，並希望再次像兄弟一樣並肩作戰，與世界為敵。"
 wuw_GER_realpolitik.43.a: "輝煌燦爛！"
 wuw_GER_realpolitik.44.t: "[FROM.GetNameDefCap]拒絕我們的提議"
 wuw_GER_realpolitik.44.desc: "[FROM.GetNameDef]的[FROM.GetLeader]對我們的聯盟邀請表示強烈不滿，並聲稱兩國之間任何形式的合作都是永遠不可能的。看來他們不想要我們幫助他們收復舊奧匈帝國的土地……"
 wuw_GER_realpolitik.44.a: "他們不明白什麼最符合自己人民的利益"
 wuw_GER_realpolitik.45.t: "[FROM.GetLeader]希望瓜分捷克斯洛伐克"
 wuw_GER_realpolitik.45.desc: "[FROM.GetNameDef]的[FROM.GetLeader]向我們提出了一個有趣的提議。他們希望我們兩國瓜分舊捷克斯洛伐克的土地。聽起來不錯，不是嗎？"
 wuw_GER_realpolitik.45.a: "成交！"
 wuw_GER_realpolitik.45.b: "我們不同意"
 wuw_GER_realpolitik.46.t: "[GER.GetNameDefCap]索要捷克斯洛伐克領土"
 wuw_GER_realpolitik.46.desc: "[GER.GetNameDef]的[GER.GetLeader]要求我們將曾屬奧匈帝國的所有捷克斯洛伐克領土歸還給他們及其盟友。對我們來說，這聽起來是筆糟糕的交易，但也許我們無力對抗他們？"
 wuw_GER_realpolitik.46.a: "我們無法與他們兩國同時作戰……"
 wuw_GER_realpolitik.46.b: "我們永遠不會投降！"
 wuw_GER_realpolitik.47.t: "[FROM.GetLeader]接受瓜分捷克斯洛伐克的提議"
 wuw_GER_realpolitik.47.desc: "儘管這些要求很苛刻，[FROM.GetNameDef]的[FROM.GetLeader]還是屈服於我們的要求。我們的軍隊已經開始行動，現在終於是恢復失去已久的輝煌的時候了。"
 wuw_GER_realpolitik.47.a: "很好"
 wuw_GER_realpolitik.48.t: "[FROM.GetLeader]拒絕瓜分捷克斯洛伐克"
 wuw_GER_realpolitik.48.desc: "[FROM.GetNameDef]的[FROM.GetLeader]否認了我們對合法領土的權利，並聲稱如果我們想要獲得它，我們必須親自去奪取。[FROM.GetAdjective]人確實口氣很大，但他們真有實力嗎？"
 wuw_GER_realpolitik.48.a: "我們會奪回屬於我們的東西！"
 wuw_GER_realpolitik.49.t: "我們的宗主國將我們交給了[GER.GetNameDef]"
 wuw_GER_realpolitik.49.desc: "我們的宗主國徹底背叛了我們，選擇將我們的領土交給[GER.GetNameDef]。我們應該接受他們的選擇還是嘗試抵抗他們？"
 wuw_GER_realpolitik.49.a: "好吧……"
 wuw_GER_realpolitik.49.b: "那麼他們就必須用武力來奪取我們的國土！"
 wuw_GER_realpolitik.50.t: "[FROM.GetNameDefCap]拒絕我們的提議"
 wuw_GER_realpolitik.50.desc: "[FROM.GetNameDef]的[FROM.GetLeader]否決了我們瓜分舊奧匈捷克斯洛伐克土地的提議。看來這筆交易終究破裂了……"
 wuw_GER_realpolitik.50.a: "我們無能為力了……"
 wuw_GER_realpolitik.51.t: "第一次柏林仲裁"
 wuw_GER_realpolitik.51.desc: "[FROM.GetNameDef]的[FROM.GetLeader]最近譴責了我們，聲稱我們非法佔領了加利西亞，因為這些土地據稱仍然是舊奧匈帝國的合法領土，[FROM.GetNameDef]及其盟友堅決聲稱這些領土屬於他們。現在，我們收到了[FROM.GetAdjective]最後通牒，他們的軍隊正在我們邊境集結。我們該如何回應？"
 wuw_GER_realpolitik.51.a: "不值得為此流血犧牲"
 wuw_GER_realpolitik.51.b: "那就過來拿啊！"
 wuw_GER_realpolitik.52.t: "[FROM.GetNameDefCap]移交加利西亞"
 wuw_GER_realpolitik.52.desc: "[FROM.GetNameDef]的理智的[FROM.GetLeader]同意將他們在加利西亞的領土移交給我們聯盟，並命令他們的軍隊停止行動，撤出該地區。我們再次取得了勝利！"
 wuw_GER_realpolitik.52.a: "這是偉大的一天！"
 wuw_GER_realpolitik.53.t: "[FROM.GetNameDefCap]立場堅定"
 wuw_GER_realpolitik.53.desc: "雖然並不出人意料，但[FROM.GetNameDef]的愚蠢的[FROM.GetLeader]在收到我們的最後通牒後讓全國軍隊進入高度戒備狀態，並派遣使者聲明他們對於爭端領土絕不會退讓一步。"
 wuw_GER_realpolitik.53.a: "他們會為自己的決定後悔的！"
 wuw_GER_realpolitik.53.b: "我們只能放棄……"
 wuw_GER_realpolitik.54.t: "第二次柏林仲裁"
 wuw_GER_realpolitik.54.desc: "[FROM.GetNameDef]的[FROM.GetLeader]最近譴責了我們，聲稱我們非法佔領了巴納特和特蘭西瓦尼亞的土地，因為這些土地據稱仍然是舊奧匈帝國的合法領土，[FROM.GetNameDef]及其盟友堅決聲稱這些領土屬於他們。現在，我們收到了[FROM.GetAdjective]最後通牒，他們的軍隊正在我們邊境集結。我們該如何回應？"
 wuw_GER_realpolitik.54.a: "不值得為此流血犧牲"
 wuw_GER_realpolitik.54.b: "那就過來拿啊！"
 wuw_GER_realpolitik.55.t: "[FROM.GetNameDefCap]移交舊匈牙利領土"
 wuw_GER_realpolitik.55.desc: "\n[FROM.GetNameDef]的理智的[FROM.GetLeader]同意將他們在舊匈牙利土地的領土移交給我們的聯盟，並命令他們的軍隊停止行動，撤出該地區。我們再次取得了勝利！"
 wuw_GER_realpolitik.55.a: "這是偉大的一天！"
 wuw_GER_realpolitik.56.t: "[FROM.GetNameDefCap]立場堅定"
 wuw_GER_realpolitik.56.desc: "雖然並不出人意料，但[FROM.GetNameDef]的愚蠢的[FROM.GetLeader]在收到我們的最後通牒後讓全國軍隊進入高度戒備狀態，並派遣使者聲明他們對於爭端領土絕不會退讓一步。"
 wuw_GER_realpolitik.56.a: "他們會為自己的決定後悔的！"
 wuw_GER_realpolitik.56.b: "我們只能放棄……"
 wuw_GER_realpolitik.57.t: "[FROM.GetNameDefCap]整合我國經濟"
 wuw_GER_realpolitik.57.desc: "[FROM.GetNameDef]的[FROM.GetLeader]比最初承諾的更進一步，並且正在操縱市場，進一步增加我們對他們經濟的依賴，確保我國無法偏離他們的道路。如果我們現在不立即與他們決裂，這將標誌著我們作為獨立國家的地位終結。我們應該如何應對？"
 wuw_GER_realpolitik.57.a: "我們只能接受這種情況"
 wuw_GER_realpolitik.57.b: "勝利或死亡！"
 wuw_GER_realpolitik.58.t: "[FROM.GetNameDefCap]接受進一步整合"
 wuw_GER_realpolitik.58.desc: "[FROM.GetNameDef]的領導層同意與我們進一步整合，今天早些時候，德國國會對這個令人振奮的消息報以熱烈掌聲。我們提出的條件顯然足以讓他們認為這一提議對他們有利，儘管這會稍微損害他們的主權。"
 wuw_GER_realpolitik.58.a: "太好了！"
 wuw_GER_realpolitik.59.t: "[FROM.GetNameDefCap]拒絕進一步整合"
 wuw_GER_realpolitik.59.desc: "儘管有顯而易見的優勢，而且顯然如此對聯盟最有利，[FROM.GetNameDef]還是拒絕了我們提出的進一步整合提議。我們只能猜測他們的理由，但看來他們可能並不關心聯盟的最佳利益。"
 wuw_GER_realpolitik.59.a: "他們是聯邦統一的威脅！"
 wuw_GER_realpolitik.59.b: "我們將密切關注他們"
 wuw_GER_realpolitik.60.t: "[FROM.GetNameDefCap]要求全面整合"
 wuw_GER_realpolitik.60.desc: "整合我們的經濟顯然不足以滿足[FROM.GetAdjective]人，[FROM.GetNameDef]的[FROM.GetLeader]今天更進一步，要求我們完全併入他們的國家。如果我們現在不立即與他們決裂，這將標誌著我們作為獨立國家的地位終結。我們應該如何應對？"
 wuw_GER_realpolitik.60.a: "我們只能接受這種情況"
 wuw_GER_realpolitik.60.b: "勝利或死亡！"
 wuw_GER_realpolitik.61.t: "[FROM.GetNameDefCap]接受全面整合"
 wuw_GER_realpolitik.61.desc: "[FROM.GetNameDef]的領導層同意併入我們的國家，今天早些時候，德國國會對此令人振奮的消息報以熱烈的掌聲。我們提出的條件顯然足以讓他們認為這一提議對他們有利，儘管這意味著他們的主權的終結。"
 wuw_GER_realpolitik.61.a: "太好了！"
 wuw_GER_realpolitik.62.t: "[FROM.GetNameDefCap]拒絕全面整合"
 wuw_GER_realpolitik.62.desc: "儘管有顯而易見的優勢，而且顯然如此對聯盟最有利，[FROM.GetNameDef]還是拒絕了我們提出的全面整合提議。我們只能猜測他們的理由，但看來他們可能並不關心聯盟的最佳利益。"
 wuw_GER_realpolitik.62.a: "他們是聯盟團結的隱患！"
 wuw_GER_realpolitik.62.b: "我們將密切關注他們"
 wuw_GER_realpolitik.63.t: "[FROM.GetNameDefCap]邀請我們加入關稅同盟"
 wuw_GER_realpolitik.63.desc: "[FROM.GetNameDef]的[FROM.GetLeader]向我們提出加入關稅同盟的提議，這將只會加強我們兩國的經濟。聽起來像是個不容錯過的好機會，對吧？"
 wuw_GER_realpolitik.63.a: "我們欣然接受"
 wuw_GER_realpolitik.63.b: "這聽起來有些可疑……"
 GOT_GER_integrated_puppet_economies.01.t: "[FROM.GetAdjective]發展援助"
 GOT_GER_integrated_puppet_economies.01.desc: "德國人正在投資工業，以進一步發展我們的軍事生產並整合部分經濟。雖然這無疑會提升我們的生產力，但也將削弱我們的自主性和獨立性。"
 GOT_GER_integrated_puppet_economies.01.a: "我們必須使其對我們有利"
 GOT_GER_integrated_puppet_economies.02.t: "[FROM.GetAdjective]開發計劃"
 GOT_GER_integrated_puppet_economies.02.desc: "為了增強他們的工業能力，德國人正在實施剝削政策，利用我們所有的資源和生產力，最終將我們榨乾。"
 GOT_GER_integrated_puppet_economies.02.a: "我們必須使其對我們有利"
 GER_idea_added_for_limited_time: "以下理念將被添加§Y$TIME$§!天：\n$IDEA$"
 wuw_GER_the_battle_of_britain.01.t: "不列顛之戰"
 wuw_GER_the_battle_of_britain.01.desc: "$GER_hermann_goring$急於展示空軍的優勢，並打擊[ENG.GetAdjective]人民的士氣。他打算通過轟炸倫敦的標誌性地標大本鐘來實現這一目標。他認為這將使[ENG.GetNameDef]屈服，並縮短戰爭的進程。他還親自保證，在這場戰役中，不會有一枚炸彈落在柏林，否則你可以稱他為赫爾曼“邁耶”。"
 wuw_GER_the_battle_of_britain.01.a: "讓他試試"
 wuw_GER_the_battle_of_britain.01.b: "他承諾得太多了"
 GER_unlocks_big_ben_raid_tt: "解鎖對§Y大本鐘§!的§Y空襲§!"
 wuw_GER_uncertain_future.01.t: "$GER_growing_public_dissent_mission$"
 wuw_GER_uncertain_future.01.desc: "隨著內戰終於結束，我們正在逐步重建國家，而人民渴望穩定和安全，但也越來越覺得自己沒有明確的目標或方向。民眾對這種不確定性感到厭倦，要求我們制定明確的路線。"
 wuw_GER_uncertain_future.01.a: "我們需要迅速行動！"
 wuw_GER_uncertain_future.02.t: "[ROOT.GetNameDefCap]面臨不確定的未來"
 wuw_GER_uncertain_future.02.desc: "隨著內戰的結束，德國正在逐步重建，但其人民渴望穩定和安全。[ROOT.GetLeader]未曾採取任何行動，似乎對新德國國家的未來走向毫無興趣。這引起了人民的極大擔憂，他們急切希望擺脫過去的破碎局面。"
 wuw_GER_uncertain_future.02.a: "民眾鬧事了，對嗎？"
 wuw_GER_german_politics.01.t: "民主的迴歸"
 wuw_GER_german_politics.01.desc: "隨著自由選舉的迴歸，[ROOT.GetAdjective]人民紛紛前往投票站，決定德國的未來。一種狂熱的情緒在街頭蔓延，大家普遍感到終於擺脫了黑暗的日子，使得這一天更像是慶典而非全國大選。"
 wuw_GER_german_politics.01.a: "我們需要一個謹慎的傳統主義者"
 wuw_GER_german_politics.01.b: "我們需要一個有遠見的社會主義者"
 wuw_GER_german_politics.02.t: "人民的領袖"
 wuw_GER_german_politics.02.desc: "隨著斯巴達克同盟的理念的迴歸，人民希望能夠更加積極地參與選舉。選舉已經結束，計票結果顯示，兩位候選人的得票非常接近。顯然，人民認為兩位候選人都是[ROOT.GetNameDef]的合適領導者，然而我們只能任命一人。"
 wuw_GER_german_politics.02.a: "海因裡希·布蘭德勒是正確的選擇！"
 wuw_GER_german_politics.02.b: "恩斯特·臺爾曼繼續執政！"
 wuw_GER_german_politics.02.c: "我們需要一位務實的社會主義者！"
 GOT_GER_amerikabomber.01.t: "美洲轟炸機工程"
 GOT_GER_amerikabomber.01.desc: "隨著決定研製遠程轟炸機的計劃展開，各設計團隊提交了方案，每個團隊都承諾能造出一款能將戰火帶到大西洋彼岸的轟炸機。現今唯一剩下的步驟就是選擇哪個團隊來實現這個雄心勃勃的計劃。"
 GOT_GER_amerikabomber.01.a: "$GER_focke_wulf_organization$"
 GOT_GER_amerikabomber.01.b: "$GER_heinkel_organization$"
 GOT_GER_amerikabomber.01.c: "$GER_junkers_organization$"
 GOT_GER_amerikabomber.01.d: "$GER_messerschmitt_organization$"
 when_intercontinental_bomber_project_is_completed_tt: "專項計劃§Y$sp_air_intercontinental_bomber$§!完成後："
 GER_amerikabomber_focke_wulf_flag: "§Y$GER_focke_wulf_organization$§!被指定負責研發§Y美洲轟炸機§!"
 GER_amerikabomber_heinkel_flag: "§Y$GER_heinkel_organization$§!被指定負責研發§Y美洲轟炸機§!"
 GER_amerikabomber_messerschmitt_flag: "§Y$GER_messerschmitt_organization$§!被指定負責研發§Y美洲轟炸機§!"
