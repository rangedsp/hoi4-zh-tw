 GER_inner_circle_himmler.00.t: "希姆萊的職責"
 GER_inner_circle_himmler.00.desc: "希姆萊在掌控了黨衛隊和蓋世太保後，在德國政治和決策制定中積累了巨大的影響力。雖然這使他成為德國事務中的強大人物，但他只能有限地加強其中一個組織。問題是，應該優先發展哪一個？"
 GER_inner_circle_himmler.00.a: "武裝黨衛軍是我們的優先部隊"
 GER_inner_circle_himmler.00.b: "專注提高我們的情報能力"
 GER_inner_circle_himmler_ss_tt: "§Y$GER_heinrich_himmler$§!很快會開始致力於研究國策§Y$GER_expand_ss_security_duties$§!。"
 GER_inner_circle_himmler_gestapo_tt: "§Y$GER_heinrich_himmler$§!很快會開始致力於研究國策§Y$GER_expand_gestapo$§!。"
 GER_inner_circle.01.t: "[GetAscendingAdvisorName]的崛起"
 GER_inner_circle.01.desc: "[GetAscendingAdvisorName]展現了強烈的野心，並在黨內獲得了影響力。然而，他加強控制的努力引發了其他成員的反對，導致了權力鬥爭。問題是，[GER.GetLeader]是否對[GetAscendingAdvisorName]留下了足夠深刻的印象，以確保後者進入核心集團。"
 GER_inner_circle.01.a: "替換[GetAscendedAdvisorName1]"
 GER_inner_circle.01.b: "替換[GetAscendedAdvisorName2]"
 GER_inner_circle.01.c: "替換[GetAscendedAdvisorName3]"
 GER_inner_circle.01.d: "[GetAscendingAdvisorName]不值得元首的信任"
 GER_inner_circle.02.t: "新元首上臺"
 GER_inner_circle.02.desc: "[GER.GetLeader]最親近的國家領袖們開始質疑[GER.GetLeader.GetHersHis]的領導能力以及[GER.GetLeader.GetSheHe]對[GER.GetNameDef]未來的願景。他們現在策劃推翻[GER.GetLeader]並奪取元首之位。問題是，誰將超越其他人，引領通往輝煌未來的道路？"
 GER_inner_circle.02.a: "[GetAscendedAdvisorName1]將領導國家"
 GER_inner_circle.02.b: "[GetAscendedAdvisorName2]最適合這項任務"
 GER_inner_circle.02.c: "[GetAscendedAdvisorName3]將成為[ROOT.GetAdjective]人民的真正領袖"
 GER_inner_circle.02.d: "我們還未準備好更替領導層"
 GER_inner_circle.03.t: "[GetIntrigueCharacterName]的工業計劃受到質疑"
 GER_inner_circle.03.desc: "[GER.GetLeader]核心集團內的對手之間爆發了一場激烈的權力鬥爭。隨著[GetIntrigueCharacterName]獲得影響力並加強權威，[GetIndustrialReichsleiterNames]對彼此管理德國工業和武器生產的方法公開表示不滿，同時他們都在爭取[GER.GetLeader]的青睞。"
 GER_inner_circle.03.a: "[GetIntrigueCharacterName]擁有元首的完全信任"
 GER_inner_circle.03.b: "$GER_fritz_todt$具備處理這項事務的必要經驗"
 GER_inner_circle.03.c: "$GER_albert_speer$將接管工業事務"
 GER_inner_circle.03.d: "$GER_hermann_goring$是元首的得力助手，任命他吧！"
 GER_inner_circle_industrial_reichsleiter: "[GetIndustrialReichsleiterNames]"
 GER_inner_circle_industrial_reichsleiter_all: "$GER_fritz_todt$、$GER_albert_speer$和$GER_hermann_goring$"
 GER_inner_circle_industrial_reichsleiter_no_goring: "$GER_fritz_todt$和$GER_albert_speer$"
