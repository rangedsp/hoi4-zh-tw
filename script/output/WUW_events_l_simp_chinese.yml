 GOT_guarantee_events.01.t: "保障波蘭的主權"
 GOT_guarantee_events.01.desc: "很明顯，[GER.GetLeader]無法通過談判解決問題，他不會停止對世界統治的追求。[GER.GetLeader.GetSheHe]堅信，沒有人敢阻止[GER.GetNameDef]及其日益增長的野心與對領土的渴望。"
 GOT_guarantee_events.01.a: "我們必須向波蘭提供保護！"
 GOT_guarantee_events.01.b: "任由[GER.GetLeader]隨心所欲"
 #NEWS EVENTS
 GOT_newsevents.1.t: "[FROM.GetNameDef]的崛起"
 GOT_newsevents.1.desc: "[FROM.GetAdjective]人已成功征服歐洲，成為這片大陸的霸主，並採取措施整合新徵服的領土。[FROM.GetAdjective]政府試圖團結民眾，支持國家和社會主義理想，發起了數次泛民族主義宣傳活動，增進無產階級的支持。\n\n[FROM.GetLeader]宣佈，統一的歐洲無產者將從此被稱為“[From.GetNameDef]”。"
 GOT_newsevents.1.a: "我們一同崛起"
 GOT_newsevents.1.b: "這不祥之兆"
