 wuw_GER_reichskommissariats.1.desc: "既然我們已經在比利時和北法建立了新的民政管理機構，我們必須不僅決定我們的新附屬國的目標，還要決定由誰來領導這裡的人民，確保我們的政策得到妥善實施。我們應該讓一位[ROOT.GetAdjective]政治家擔任專員，還是應該利用當地的合作者？"
