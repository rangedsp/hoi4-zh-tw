 #### GERMAN RELEASABLE AND FORMABLE EVENTS ####
 wuw_GER_releasable.1.t: "德意志人民的首都"
 wuw_GER_releasable.1.desc: "隨著德國的改革，我們的許多政治家認為，我國首都需要重新考慮。他們宣稱它配不上“德意志人民的首都”這樣的稱號。在這種情況下，我們希望將首都遷移到哪裡？"
 wuw_GER_releasable.1.a: "柏林是當然的選擇！"
 wuw_GER_releasable.1.b: "應該選慕尼黑"
 wuw_GER_releasable.1.c: "法蘭克福會成為優秀的西方首都"
 wuw_GER_releasable.1.d: "我們的首都很好啊"
 wuw_GER_releasable.2.t: "選舉"
 wuw_GER_releasable.2.desc: "鑑於選舉結果有利於右翼黨，現在是時候選擇最適合管理國家的人選了。該黨希望皮埃爾·杜蓬暫時擔任領導職務，以便約瑟夫·伯克有時間處理其他重要事務。然而，隨著歐洲上空烏雲密佈，或許我們需要在政治格局上做出重大改變，以免落入鄰國的手中……"
 wuw_GER_releasable.2.a: "皮埃爾·杜蓬負責掌舵"
 wuw_GER_releasable.2.b: "仍然需要約瑟夫·伯克"
 wuw_GER_releasable.2.c: "在這個危險時期，皇室必須採取行動！"
 wuw_GER_releasable.2.d: "人民應該抗議這樣一個明顯被操縱的選舉！"
 ### GERMAN CIVIL WAR EVENTS ###
 wuw_GER_civil_war.1.t: "流亡共產主義者重返故土"
 wuw_GER_civil_war.1.desc: "隨著國防軍最近針對納粹政權的政變，許多之前離開國家的共產主義者現在紛紛回國，因為他們看到機會來幫助我們對抗那些曾經傷害他們的人。我們是否應該允許他們參戰，還是應該試圖掩蓋他們的迴歸，只願他們不會變得足夠受歡迎，從而發動自己的革命？"
 wuw_GER_civil_war.1.a: "歡迎回來，同志！"
 wuw_GER_civil_war.1.b: "有些人必須被盯著"
 wuw_GER_civil_war.2.t: "恩斯特·臺爾曼被釋放"
 wuw_GER_civil_war.2.desc: "有報道稱，一群共產主義游擊隊闖入薩克森的包岑監獄，並釋放了堅決的共產主義者和前德國共產黨領導人恩斯特·臺爾曼。他的黨內對手瓦爾特·烏布利希譴責對監獄的襲擊是反革命的恐怖行為，這一聲明可能源於他害怕廣受歡迎的臺爾曼能夠重新獲得黨內領導權。"
 wuw_GER_civil_war.2.a: "有趣的發展"
 GER_thalmann_freed_from_prison_tt: "§Y恩斯特·臺爾曼§!被共產黨人釋放"
 GER_thalmann_freed_from_prison_flag: "§Y恩斯特·臺爾曼§!被釋放"
 wuw_GER_civil_war.3.t: "準軍事部隊的改革"
 wuw_GER_civil_war.3.desc: "我們的政客和將軍們最近討論了將準軍事部隊引入士兵隊伍的想法。保守黨希望重建俾斯麥青年團，這是為了對抗馬克思主義青年運動，該運動從屬於德國國家人民黨。然而，其他人則認為，已經投入戰場的社會民主主義的鋼鐵陣線，是我們希望在武裝部隊中使用更多準軍事力量的理想組織。"
 wuw_GER_civil_war.3.a: "新俾斯麥號應該是首要任務"
 wuw_GER_civil_war.3.b: "如果要授權任何組織，我們應該首先授權鋼鐵陣線"
 wuw_GER_civil_war.4.t: "準軍事部隊的未來"
 wuw_GER_civil_war.4.desc: "隨著內戰的結束和納粹政權的徹底瓦解，允許公開的政治準軍事組織在我國自由活動是否明智這一問題引起了質疑。鑑於軍政府對他們幾乎沒有正式控制，禁止他們並強迫其解散可能是明智之舉。否則，我們或許可以嘗試讓他們繼續存在，只是將其規模縮小到不構成威脅的程度？"
 wuw_GER_civil_war.4.a: "試著一口氣解散他們"
 wuw_GER_civil_war.4.b: "也許我們可以暫時簡單的遣散他們？"
 wuw_GER_civil_war.5.t: "第四次西里西亞起義"
 wuw_GER_civil_war.5.desc: "我們接到報告稱西里西亞和波蘭的游擊隊在西里西亞向德國士兵開火。他們尋求國家獨立，並將我們的內戰視為他們所需的軟弱信號，這才鼓起勇氣準備脫離我們。我們必須確保他們的目標不會實現，並儘快鎮壓他們的叛亂。"
 wuw_GER_civil_war.5.a: "不能允許他們成功！"
 wuw_GER_civil_war.6.t: "[ROOT.GetNameDef]共產主義內戰"
 wuw_GER_civil_war.6.desc: "經過一段時間由無產階級發起的強烈不滿，[ROOT.GetNameDef]的局勢變得敵對。[ROOT.GetLeader]的軍隊在多個州遭到了徹底擊潰，接連不斷的暴動讓局勢更加嚴峻。這場反抗的結果將如何，尚未可知。"
 wuw_GER_civil_war.6.a: "為了無產階級！"
 wuw_GER_civil_war.6.b: "我們將粉碎這些烏合之眾！"
 GER_shalva_maglakelidze_and_giorgi_kvinitadze_join: "§Y喬治·克維尼塔德澤§!和§Y沙爾瓦·馬格拉凱利澤§!將分別作為§Y元帥§!和§Y將軍§!加入我們\n"
 GER_georgian_legion_recruitment_tt: "獲得兩個格魯吉亞軍團§Y步兵§!單位"
 GER_andrey_shckuro_and_pyotr_krasnov_join_tt: "§Y安德烈·史庫羅§!和§Y彼得·克拉斯諾夫§!將作為將軍加入我們\n"
 GER_white_russian_exiles_divisions_recruitment_tt: "獲得兩個哥薩克單位和一個俄羅斯§Y步兵§!單位"
 GER_cossack_exiles_divisions_recruitment_tt: "獲得兩個哥薩克§Y騎兵§!單位"
 wuw_GER_civil_war.7.t: "德國海軍的忠誠"
 wuw_GER_civil_war.7.desc: "我們注意到，在我們實施政變時，德國海軍可能選擇支持[ROOT.GetLeader]。原因似乎是他們的領導人埃裡希·雷德爾得到過[ROOT.GetLeader]的承諾，在他執政時，海軍將獲得大量投資和自由，這是舊政府未能實現的。也許我們應該做出類似的承諾，努力爭取他的支持？"
 wuw_GER_civil_war.7.a: "我們必須不惜一切代價確保他們的忠誠"
 wuw_GER_civil_war.7.b: "我們不應討好埃裡希·雷德爾"
 GER_promised_erich_raeder_a_great_navy_tt: "在政變發生時，埃裡希·雷德爾和大部分德國海軍將加入我們一方。然而，如果我們在兩年內未能完成§Y$GER_rebuild_the_high_seas_fleet_ww$§!或§Y$GER_high_seas_fleet$§!和§Y$GER_re_establish_the_seekriegsleitung$§!，他可能會§R反叛我們的政權§!"
 GER_chose_to_not_placate_erich_raeder_tt: "政變發生時，只有一小部分德國海軍會加入我們一方，但我們不會被對埃裡希·雷德爾的任何承諾所束縛"
 wuw_GER_civil_war.8.t: "德國海軍的政變"
 wuw_GER_civil_war.8.desc: "在我們做出承諾要恢復海軍昔日輝煌的數年後，看來埃裡希·雷德爾和德國海軍已經對我們無休止的拖延感到厭倦，今天早些時候他們試圖對我們的政府發動政變。幸運的是，這次失敗了，但為了確保這種情況不再發生，我們必須清除武裝部隊中的許多高級官員和叛亂分子……"
 wuw_GER_civil_war.8.a: "他們將為背叛付出代價！"
 wuw_GER_civil_war.8.b: "國家會為違背承諾感到後悔"
 this_will_happen_tt: "以下情況將發生：\n"
 wuw_GER_civil_war.9.t: "奧古斯特·馮·馬肯森從軍隊退役"
 wuw_GER_civil_war.9.desc: "隨著對納粹威脅的勝利，軍政府首腦奧古斯特·馮·馬肯森由於年齡和健康狀況惡化，再次決定退出前線指揮，並表示今後只會從事行政工作。"
 wuw_GER_civil_war.9.a: "他為我們效力良久"
 GER_mackensen_went_into_retirement_tt: "§Y奧古斯特·馮·馬肯森§!不再是§Y陸軍元帥§!"
 GER_recalled_hans_krebs_from_russia_flag: "從§Y[SOV.GetNameDef]§!召回§Y漢斯·克雷布斯§!"
 ### GERMAN FOREIGN LEGIONS AND LEGIONARIES EVENTS ###
 wuw_GER_legions.1.t: "格魯吉亞外籍軍團的組建"
 wuw_GER_legions.1.desc: "隨著我們最近宣佈打算恢復《佈列斯特-立托夫斯克和約》的邊界，一些流亡的格魯吉亞將軍和士兵前來，希望幫助我們收復他們的故土，作為交換，我們承諾重建格魯吉亞國家，並授予其統治高加索地區的權利。我們是否應接受他們的協助？"
 wuw_GER_legions.1.a: "歡迎他們加入我們"
 wuw_GER_legions.1.b: "我們不需要他們"
 wuw_GER_legions.2.t: "從[SOV.GetNameDef]召回的漢斯·克雷布斯"
 wuw_GER_legions.2.desc: "我們與[SOV.GetAdjective]的宣佈進入敵對狀態後，少將武官漢斯·克雷布斯提前幾週被召回，最近已返回柏林。他現在準備在東線作戰，並表示自己具備我們發動入侵戰爭所需的[SOV.GetAdjective]軍隊的經驗和知識。"
 wuw_GER_legions.2.a: "我們可以利用他的軍事情報"
 wuw_GER_legions.3.t: "洛科季的合作機會"
 wuw_GER_legions.3.desc: "在佔領布良斯克、庫爾斯克和奧廖爾地區後，我們的軍隊制定了一個計劃，利用洛科季的當地合作者更容易地管理該區域，同時讓他們招募更多部隊對抗[SOV.GetAdjective]。然而，這將剝奪我們軍隊在該地區的戰利品。我們是否應授權建立洛科特自治？"
 wuw_GER_legions.3.a: "敵人的敵人就是朋友！"
 wuw_GER_legions.3.b: "我們不需要當地合作者"
 wuw_GER_legions.4.t: "洛科季的合作者！"
 wuw_GER_legions.4.desc: "我們獲悉，[GER.GetAdjective]軍隊在覆蓋布良斯克、庫爾斯克和奧廖爾的區域設立了洛科季自治政府，由康斯坦丁·沃斯科博伊尼克和布羅尼斯拉夫·卡明斯基等熱心合作者負責治理該地區，處理游擊隊和抵抗運動。我們必須迅速打擊敵人，摧毀這個偽政權！"
 wuw_GER_legions.4.a: "他們做出了錯誤的選擇"
 lokot_autonomy_has_been_established_flag: "§Y洛科季自治政府§!已建立"
 lokot_autonomy_has_been_crushed_flag: "§Y洛科季自治政府§!被摧毀"
 SOV_recapture_lokot_to_destroy_the_autonomy_tt: "如果我們奪回§Y[224.GetName]§!、§Y[220.GetName]§!和§Y[222.GetName]§!，我們可以迅速解散§Y洛科季自治政府§!"
 wuw_GER_legions.5.t: "洛科季自治政府的解散"
 wuw_GER_legions.5.desc: "在我們重新佔領布良斯克、庫爾斯克和奧廖爾地區後，我們的軍隊俘獲了大部分洛科季的合作者，並重新在該地區建立了地方政府。[GER.GetAdjective]軍隊已從該區域撤退，我們的指揮官向我們保證，勝利的日子越來越近了。"
 wuw_GER_legions.5.a: "我們必將勝利！"
 wuw_GER_legions.6.t: "洛科季自治政府的毀滅"
 wuw_GER_legions.6.desc: "[SOV.GetAdjective]重新佔領洛科季區域之後，他們解散了我們之前建立的自治政府，並逮捕並處決了所有地方合作政府的成員。"
 wuw_GER_legions.6.a: "戰爭出現了轉機"
 GER_lokot_collaborators_have_been_captured_by_the_soviets_tt: "§Y[GER.SOV_bronislav_kaminski.GetName]§!和§Y[GER.SOV_konstantin_voskoboinik.GetName]§!已被[SOV.GetAdjective]部隊俘獲"
 wuw_GER_legions.7.t: "塞爾維亞的俄羅斯流亡者的提議"
 wuw_GER_legions.7.desc: "在我們最近佔領的領土上建立了塞爾維亞國家救國政府後，一些白俄流亡者提出幫助我們組建俄羅斯保護軍團，協助保護被佔領的塞爾維亞的工廠和政府建築，同時協助鎮壓祖國軍和其他抵抗力量。我們是否應該接受他們的協助？"
 wuw_GER_legions.7.a: "我們可以利用他們來鎮壓塞爾維亞人"
 wuw_GER_legions.7.b: "我們不需要這些俄羅斯流民"
 wuw_GER_legions.8.t: "不滿的哥薩克人的提議"
 wuw_GER_legions.8.desc: "隨著我們準備對[SOV.GetNameDef]發動進攻的意圖愈發明確，許多在俄羅斯內戰中失敗的人找上門來，想借機終結當前的[SOV,GetAdjective]政府。其中包括頓河和庫班哥薩克的[SOV.SOV_pyotr_krasnov.GetName]和[SOV.SOV_andrey_shkuro.GetName]，他們希望為我們作戰。我們是否應該接受他們的幫助？"
 wuw_GER_legions.8.a: "我們可以利用他們對庫班草原的瞭解"
 wuw_GER_legions.8.b: "我們為什麼需要這些哥薩克人的幫助？"
 ### GERMAN MONROE DOCTRINE EVENTS ###
 wuw_GER_monroe.1.t: "[FROM.GetAdjectiveCap]對門羅主義的興趣"
 wuw_GER_monroe.1.desc: "我們收到了令人不安的報告，對於破壞門羅主義，[FROM.GetNameDef]開始表現出越來越大的興趣。該主義是為了防止外國在我們認為是勢力範圍的美洲大陸製造麻煩而制定的。根據之前與[FROM.GetNameDef]的接觸，我們只能假設他們的意圖不善。"
 wuw_GER_monroe.1.a: "我們必須介入！"
 wuw_GER_monroe.1.a_tt: "解鎖決議§Y加強門羅主義§!。\n\n[GER.GetNameDefCap]已解鎖決議設法§R破壞門羅主義§!。"
 wuw_GER_monroe.1.b: "誰在乎？"
 wuw_GER_monroe.1.b_tt: "[GER.GetNameDefCap]已解鎖決議設法§R破壞門羅主義§!。\n\n選擇此選項後，我們將§R不再§!收到關於門羅主義的任何進一步通知。允許[FROM.GetNameDefCap]嘗試在沒有干預的情況下移除該主義。\n\n§R僅在有備用計劃時選擇此選項！§!"
 wuw_GER_monroe.2.t: "門羅主義崩潰"
 wuw_GER_monroe.2.desc: "在[FROM.GetAdjective]的巨大壓力下，門羅主義似乎終於分崩離析了。多國反對該主義，並與[FROM.GetAdjective]們走得更近了。雖然反對聲音很大，但仍有一些人可能認為該主義至少在某種程度上值得保存。如此，我們所有的行動都將被視為緩解措施，我們應該仔細選擇我們的應對措施。"
 wuw_GER_monroe.2.a: "我們將保護所有沒有反對我們的國家！"
 wuw_GER_monroe.2.a_tt: "§Y門羅主義§!將從所有仍然持有它的國家中移除。以每個被保障國家花費§R每個國家§!£GFX_pol_power §Y25政治點數§!的代價，來保障所有沒有明確反對該主義的國家！\n\n目前有§Y[?global.monroe_countries_in_support^num]個國家§!支持該主義，並有§Y[?global.monroe_doctrine_countries_to_destabilize^num]個國家§!被動支持該主義。\n\n當前保障的總成本為£GFX_pol_power §Y[?USA.monroe_countries_all_in_support_guarantee_cost]政治點數§!"
 wuw_GER_monroe.2.b: "我們只能保障那些保持忠誠的"
 wuw_GER_monroe.2.b_tt: "§Y門羅主義§!將從所有仍保有它的國家中移除。對所有公開支持門羅主義的國家提供保障，代價是§R每個受保障的國家§!£GFX_pol_power §Y25政治點數§!！\n\n目前有§Y[?global.monroe_countries_in_support^num]§!個國家支持。\n\n目前的保障成本是£GFX_pol_power §Y[?USA.monroe_countries_strict_in_support_guarantee_cost]政治點數§!"
 wuw_GER_monroe.2.c: "如果他們想要保障，就應該阻止這種情況"
 wuw_GER_monroe.3.t: "[FROM.GetNameDefCap]加強門羅主義"
 wuw_GER_monroe.3.desc: "毫不意外，[FROM.GetNameDef]識破了我們破壞該地區穩定的企圖。通過大規模的宣傳、勒索和賄賂活動，[FROM.GetAdjective]們已經將門羅主義國家拉攏到他們的一邊，並集結這些國家對抗我們。門羅主義比以往任何時候都更加強大。"
 wuw_GER_monroe.3.a: "該死！"
 wuw_GER_monroe.4.t: "[FROM.GetNameDefCap]要求我們放棄門羅主義"
 wuw_GER_monroe.4.desc: "我們收到了一封來自[FROM.GetNameDef]的措辭嚴厲的通信。他們宣佈門羅主義將瓦解，不久我們將不再受[USA.GetNameDef]的保護。如果我們現在廢除門羅主義，他們提出以他們的保護作為替代，但他們非常明確地表示，這個提議取決於我們是否迅速行動。"
 wuw_GER_monroe.4.a: "[USA.GetNameDef]為我們做了什麼？"
 wuw_GER_monroe.4.a_tt: "我們將明確表示我們對門羅主義的§R反對§!。如果該主義繼續存在，我們將處於§R缺乏保障§!的狀態。§Y[USA.GetFlag][USA.GetNameDefCap]§!將無法進一步影響我們。"
 wuw_GER_monroe.4.b: "我們不會聽信他們的謊言！"
 wuw_GER_monroe.4.b_tt: "我們將拒絕在此事上表明立場。§Y[USA.GetNameWithFlag]§!可能會設法拉攏我們到他們一邊。"
 monroe_country_in_opposition_flag: "該國已明確反對門羅主義。"
 wuw_GER_monroe.5.t: "[FROM.GetNameDefCap]干涉[ROOT.GetAdjective]的政局"
 wuw_GER_monroe.5.desc: "我們注意到，[FROM.GetAdjective]特工正在積極試圖影響我們國家的政局。這種影響並不具有侵擾性，只是在集結已經存在的團體並加強他們在政治氣候中的地位。"
 wuw_GER_monroe.5.a: "好吧"
 wuw_GER_monroe.5.b: "他們無權干涉我們的政局！"
 wuw_GER_monroe.6.t: "[FROM.GetNameDefCap]要求我們重申對門羅主義的立場"
 wuw_GER_monroe.6.desc: "我們剛剛收到一封來自[FROM.GetNameDef]的通信。他們發現[GER.GetAdjective]特工在試圖破壞該地區的穩定，圖謀瓦解門羅主義，現在他們希望確認我們對門羅主義的忠誠。"
 wuw_GER_monroe.6.a: "我們將像一如既往地支持該主義"
 wuw_GER_monroe.6.a_tt: "我們將明確表示我們對門羅主義的§G支持§!。如果該主義崩潰，我們還有機會獲得來自[FROM.GetNameDef]的§G保障§!。§Y[GER.GetFlag][GER.GetNameDefCap]§!將無法進一步影響我們。"
 wuw_GER_monroe.6.b: "我們不會自我束縛"
 wuw_GER_monroe.6.b_tt: "我們將拒絕在此事上表明立場。§Y[GER.GetNameWithFlag]§!可能會嘗試拉攏我們到他們一邊。"
 monroe_country_in_support_flag: "該國已明確支持門羅主義。"
 wuw_GER_monroe.7.t: "[FROM.GetAdjective]的最後通牒"
 wuw_GER_monroe.7.desc: "我們收到了一封來自[FROM.GetAdjective]的措辭強硬的通信。他們聲稱他們破壞門羅主義的努力已經成功，[USA.GetNameDef]徹底廢除該主義只是時間問題。他們希望給我們一個機會，放棄門羅主義，避免他們的憤怒，因此給了我們最後一次反對該主義的機會。"
 wuw_GER_monroe.7.a: "放棄它，避免[FROM.GetAdjective]的怒火！"
 wuw_GER_monroe.7.b: "我們不會被威脅！"
 wuw_GER_monroe.8.t: "[FROM.GetNameDefCap]加倍堅持門羅主義"
 wuw_GER_monroe.8.desc: "[FROM.GetAdjective]領導人[FROM.GetLeader]親自與我們聯繫。[FROM.GetLeader.GetSheHeCap]警告我們，儘管[GER.GetAdjective]試圖破壞門羅主義，但該主義依然存在。他們強調我們享受了他們的保護，而這也伴隨著共同維護門羅主義的責任。"
 wuw_GER_monroe.8.a: "迴歸門羅主義"
 wuw_GER_monroe.8.b: "我們從一開始就沒有要求門羅主義！"
 wuw_GER_monroe.8.c: "當然，我們只是等待風暴過去"
 wuw_GER_monroe.9.t: "[FROM.GetNameDefCap]廢除了門羅主義"
 wuw_GER_monroe.9.desc: "我們的努力終於有了回報。[FROM.GetNameDef]的領導人[FROM.GetLeader]剛剛宣佈廢除門羅主義。當然[FROM.GetLeader.GetSheHe]認為這是一件壞事，但我們知道，曾經被納入該主義的國家會對事態的發展表示讚賞。"
 wuw_GER_monroe.9.a: "太好了！"
 wuw_GER_monroe.10.t: "[FROM.GetNameDefCap]部分廢除了門羅主義"
 wuw_GER_monroe.10.desc: "我們的努力終於有了回報。[FROM.GetNameDef]的領導人[FROM.GetLeader]剛剛宣佈部分廢除門羅主義。[FROM.GetLeader.GetSheHe]繼續表示，他們打算保證所有沒有反對的國家的獨立，因為他們認為這是正確的決定。這可能會阻礙我們在該地區的進展，但我們肯定能克服這一點。"
 wuw_GER_monroe.10.a: "前進"
 wuw_GER_monroe.11.t: "[FROM.GetNameDefCap]部分廢除了門羅主義"
 wuw_GER_monroe.11.desc: "我們的努力終於有了回報。[FROM.GetNameDef]的領導人[FROM.GetLeader]剛剛宣佈部分廢除門羅主義。[FROM.GetLeader.GetSheHe]繼續表示，他們打算保證那些仍然支持門羅主義國家的獨立。雖然這些國家現在數量較少，但他們聲稱自己和以前一樣強大。這可能會阻礙我們在該地區的進展，但並未對我們構成重大障礙。我們一定會克服這一點。"
 wuw_GER_monroe.11.a: "前進"
 wuw_GER_monroe.12.t: "[USA.GetNameDef]和[GER.GetNameDef]之間的戰爭終結了門羅主義的爭端"
 wuw_GER_monroe.12.desc: "隨著我們的兩個國家陷入戰爭，對門羅主義的低水平和低強度爭端已經消退。即使對遠離前線的政治家來說，在外國土地上的外交和秘密行動也顯得毫無意義，因為我們的國家正在更直接地正面交鋒。"
 wuw_GER_monroe.12.a: "我們要用槍炮來解決這個問題！"
 wuw_GER_monroe.13.t: "境外勢力試圖破壞該地區的穩定"
 wuw_GER_monroe.13.desc: "我們注意到該地區的[GER.GetAdjective]勢力表現出日益增長的興趣。我們的報告內容簡略，但似乎有人試圖破壞甚至廢除門羅主義。"
 wuw_GER_monroe.13.a: "哦，天哪……"
 wuw_GER_monroe_news.1.t: "門羅主義的崩潰"
 wuw_GER_monroe_news.1.desc: "在[GER.GetNameDef]的巨大施壓和外交努力之後，所謂的門羅主義已經瓦解。由[USA.GetNameDef]制定的門羅主義旨在保護美洲，該主義在一定程度上確保了大陸的和平。[GER.GetAdjective]這樣做的動機尚不清楚。"
 wuw_GER_monroe_news.1.a: "真是了不起"
 wuw_GER_monroe_news.1.b: "太可怕了"
 wuw_GER_monroe_news.1.c: "偉大的一天！"
 wuw_GER_monroe_news.1.d: "糟糕的一天！"
 GER_crushed_the_monroe_doctrine_good: "粉碎門羅主義"
 GER_crushed_the_monroe_doctrine_bad: "粉碎門羅主義"
 GER_saved_the_monroe_doctrine_bad: "加強門羅主義"
 GER_supported_the_monroe_doctrine_good: "支持門羅主義"
 GER_opposed_the_monroe_doctrine_good: "反對門羅主義"
 ###### OTHER GERMAN EVENTS ######
 germany_mefo_bills.1.t: "德國軍備重整計劃的未來"
 germany_mefo_bills.1.desc: "軍備重整計劃的財政負擔可能會導致我們的經濟崩潰。如果我們打算保持與以前相同水平的武器生產，我們必須尋找新的資金來源——或改變我們的優先級。"
 germany_mefo_bills.1.a: "軍備重整一直是我們的目標"
 germany_mefo_bills.1.b: "該計劃過於昂貴"
 germany_mefo_bills.2.t: "日益擴大的軍備重整"
 germany_mefo_bills.2.desc: "我們的軍備重整計劃雖然必要且目標高尚，但已經引起了一些經濟學家的擔憂。他們擔心軍事生產需要越來越多的資金來維持。我們必須密切關注，以防軍事開支失控。"
 germany_mefo_bills.2.a: "目前我們還能應對"
 germany_mefo_bills.3.t: "對軍備重整的日益擔憂"
 germany_mefo_bills.3.desc: "隨著我們的軍備重整計劃愈加強大，維持該計劃的資金負擔也越來越重。軍事生產現已佔據了我們國家大量財政資源，越來越多的人對我們經濟的穩定性感到擔憂。如果我們無法控制軍事開支，將嚴重阻礙經濟發展。"
 germany_mefo_bills.3.a: "我們必須找到替代資金"
 germany_mefo_bills.4.t: "軍事生產引發經濟危機"
 germany_mefo_bills.4.desc: "軍事開支達到了前所未有的水平，對我們的財政造成了重大影響。如果的資金支持無法立即到位，我們的軍備生產將陷入停滯，而整個經濟也將因試圖維持軍備生產而承受巨大壓力。"
 germany_mefo_bills.4.a: "我們不能讓這場危機繼續下去！"
 GER_mefo_bills_warning_tt: "§Y[GetMilitaryProductionModifierName]§!已達到$MODIFIER_CONSUMER_GOODS_FACTOR$：§Y[?ROOT.GER_industrial_consumer_goods_factor|1%]§!"
 anschluss_mefo_bills_tt: "使用奧地利黃金來降低§Y[GetMilitaryProductionModifierName]§!的成本。\n"
 end_of_czechoslovakia_mefo_bills_tt: "使用捷克斯洛伐克黃金來降低§Y[GetMilitaryProductionModifierName]§!的花費。\n"
 yugoslavia_mefo_bills_tt: "使用南斯拉夫的黃金來減少§Y[GetMilitaryProductionModifierName]§!的成本。\n"
 lithuania_mefo_bills_tt: "使用立陶宛黃金來降低§Y[GetMilitaryProductionModifierName]§!的成本。\n"
 poland_mefo_bills_tt: "使用波蘭黃金來降低§Y[GetMilitaryProductionModifierName]§!的成本。\n"
 generic_lower_mefo_bills_tt: "使用新繳獲的黃金來降低§Y[GetMilitaryProductionModifierName]§!的成本。\n"
 wuw_GER_military_events.2.t: "飛行員放過[USA.GetAdjective]轟炸機"
 wuw_GER_military_events.2.desc: "在我們的軍事工業遭到密集轟炸之後，一個令人難以置信的故事浮出水面。儘管明確下令擊落所有侵犯我們領空的敵機，但有名飛行員拒絕執行命令。這名飛行員是弗朗茨·斯蒂格勒，他發現了一架在轟炸後受損的轟炸機，並選擇不開火。他解釋說，這架受損的轟炸機和跳傘的士兵沒有什麼不同，向他們開火同樣令人憎惡。在最初試圖與轟炸機機組人員溝通中，他讓他們在[GER.GetNameDef]降落並投降，或者至少前往中立地區，之後，斯蒂格勒放棄了這些體面的努力，轉而護送敵方轟炸機安全離開。\n\n弗朗茨·斯蒂格勒是一名出色的飛行員，但如果他繼續這樣做，他和他的挑釁行為可能會給我們造成麻煩。"
 wuw_GER_military_events.2.a: "饒他一命，但這種行為不能重複！"
 wuw_GER_military_events.2.b: "拿他殺雞儆猴！"
 wuw_GER_military_events.2.c: "對此一言不發"
 wuw_GER_diplomacy.1.t: "[FROM.GetNameDefCap]提供貿易伙伴關係"
 #wuw_GER_diplomacy.1.desc - there is none - using AAT_germany.1.desc
 wuw_GER_diplomacy.1.a: "我們雙方都將從中受益"
 wuw_GER_diplomacy.1.b: "這筆交易只會讓其中一方受益……"
 wuw_GER_diplomacy.2.t: "[FROM.GetNameDefCap]接受了我們的貿易提議"
 wuw_GER_diplomacy.2.desc: "[FROM.GetLeader]似乎是一位理智的領導者，他在尋求[FROM.GetLeader.GetHerHis]國家的最佳利益。巧合的是，恰好也符合我們國家的最佳利益。我們將充分利用來自[FROM.GetName]的額外資源。"
 #wuw_GER_diplomacy.2.a - there is none
 wuw_GER_diplomacy.3.t: "[FROM.GetNameDefCap]拒絕了我們的貿易提議"
 wuw_GER_diplomacy.3.desc: "[FROM.GetLeader]似乎是一個不講理且不明智的領導者，對於[FROM.GetLeader.GetHerHis]國家的最佳利益毫不關心。我們將去他處尋找我們所需的資源。"
 wuw_GER_diplomacy.3.a: "這是他們的損失"
 #wuw_GER_diplomacy.10.t - using old loc
 #wuw_GER_diplomacy.10.desc - using old loc
 wuw_GER_diplomacy.10.a: "我們不敢說不……"
 wuw_GER_diplomacy.10.b: "這不可接受！"
 wuw_GER_diplomacy.11.t: "[FROM.GetNameDefCap]挫敗我們的計劃"
 wuw_GER_diplomacy.11.desc: "[FROM.GetName]的[FROM.GetLeader]以非常直白的方式告知[FROM.GetLeader.GetSheHe]對我們最近試圖影響其國內政治的看法。不用說，我們的外交官在向[ROOT.GetLeader]彙報前不得不重新編寫這封信的部分內容的措辭。"
 wuw_GER_diplomacy.11.a: "太無禮了！"
 wuw_GER_diplomacy.20.t: "邀請加入[FROM.GetFactionName]"
 wuw_GER_diplomacy.20.desc: "[FROM.GetLeader]親自向[ROOT.GetLeader]發出邀請加入[FROM.GetFactionName]。來自[FROM.GetAdjective]最高指揮部的代表保證，只要我們與他們已經強大的聯盟一起，必將毫不費力地擊敗我們共同的敵人，確保[ROOT.GetAdjective]在我們周邊的主導地位。"
 wuw_GER_diplomacy.20.a: "共赴勝利！"
 wuw_GER_diplomacy.20.b: "我們另有打算"
 wuw_GER_diplomacy.21.t: "[FROM.GetNameDefCap]加入[ROOT.GetFactionName]"
 wuw_GER_diplomacy.21.desc: "我們的軍事最高指揮部和熟練的外交官成功說服了[FROM.GetLeader]和[FROM.GetAdjective]政府與我們聯手打擊共同的敵人。我們當然不需要他們的幫助就能摧毀敵人，但他們的士兵在我們擊潰任何反對者時將很好地充當炮灰。"
 wuw_GER_diplomacy.21.a: "歡迎加入大家庭"
 wuw_GER_diplomacy.22.t: "[FROM.GetNameDefCap]拒絕我們的邀請"
 wuw_GER_diplomacy.22.desc: "儘管我們盡了最大的努力，並且[FROM.GetNameDef]與我們聯合會獲得顯而易見的好處，但[FROM.GetLeader]和[FROM.GetAdjective]政府還是錯誤地決定拒絕我們加入[ROOT.GetFactionName]的邀請。當然，這對我們沒有多大影響，這次邀請更多的是為了[FROM.GetName]的利益。"
 wuw_GER_diplomacy.22.a: "看看他們能獨自撐多久"
 wuw_GER_diplomacy.23.t: "[FROM.GetNameDefCap]索取前殖民地的控制權"
 wuw_GER_diplomacy.23.desc: "[FROM.GetAdjective]領袖[FROM.GetLeader]向我們提出一份互惠性協議，至少按[FROM.GetLeader.GetHerHis]的說法是互惠的。[FROM.GetLeader.GetHerHis]希望我們歸還他們曾經的殖民地，作為回報，他們將提供對坦克生產的見解，並承諾兩國和平。"
 wuw_GER_diplomacy.23.a: "[FROM.GetADjective]提出了令人信服的方案"
 wuw_GER_diplomacy.23.b: "這對我們一點好處都沒有！"
 wuw_GER_diplomacy.24.t: "[FROM.GetAdjective]移交前[ROOT.GetAdjective]殖民地"
 wuw_GER_diplomacy.24.desc: "我們收到來自[FROM.GetNameDef]的最讓人愉快的消息。他們看到了我們的提議的好處，並將先前由他們控制的所有我們的舊殖民地轉交給了我們。"
 wuw_GER_diplomacy.24.a: "好消息！"
 wuw_GER_diplomacy.25.t: "[FROM.GetAdjective]拒絕移交我們的舊殖民地"
 wuw_GER_diplomacy.25.desc: "我們曾認為[FROM.GetNameDef]的[FROM.GetLeader]是一個非常通情達理的人，但看來我們錯了。[FROM.GetAdjective]固執地拒絕了我們提出的明顯對他們有利的協議。我們將不得不放棄我們的舊殖民地。"
 wuw_GER_diplomacy.25.a: "他們做了個糟糕的決定……"
 wuw_GER_diplomacy.26.t: "聯合研究提議"
 wuw_GER_diplomacy.26.desc: "[FROM.GetAdjective]領導人[FROM.GetLeader]向我們提出了科學合作的提議。[FROM.GetLeader.GetSheHeCap]表示，雖然我們有相似的意識形態，但在海軍運作方面有著非常不同的側重點，這為合作提供了充足的機會。接受這一協議意味著我們將與他們分享一些研究成果，但也能從他們那裡學習。"
 wuw_GER_diplomacy.26.a: "聽起來不錯"
 wuw_GER_diplomacy.26.b: "我們對此不感興趣"
 wuw_GER_diplomacy.27.t: "[FROM.GetNameDefCap]同意開展聯合研究"
 wuw_GER_diplomacy.27.desc: "[FROM.GetAdjective]領導層對我們提出的聯合研究項目做出了非常積極的回應。鑑於我們的海軍工作有很大差異，他們也看到了互相學習的價值，這樣我們兩國就可以一起變得更加強大。"
 wuw_GER_diplomacy.27.a: "太好了！"
 wuw_GER_diplomacy.28.t: "[FROM.GetNameDefCap]拒絕我們的聯合研究提議"
 wuw_GER_diplomacy.28.desc: "來自[FROM.GetNameDef]的回應並不是我們所期望的。他們似乎不願意分享他們在海軍工程方面的研究成果，即使我們向他們提供了一個最有利的交易，願意與他們分享我們的研究成果。他們的拒絕聲明中還提到，[FROM.GetAdjective]海軍遠遠優於我國，我國在海軍技術方面取得重大進展之前，任何此類交易都是不可能的。"
 wuw_GER_diplomacy.29.t: "老盟友提出貿易協議"
 wuw_GER_diplomacy.29.desc: "曾幾何時，我們將[FROM.GetNameDef]，或至少他們的前身，視為我們的盟友。在最近幾年裡，我們漸行漸遠，但似乎他們現在希望重新燃起這段友誼。[FROM.GetAdjective]提出了一項互利的貿易協議，再次向我們伸出了友誼之手。"
 wuw_GER_diplomacy.29.a: "意料之外，但歡迎"
 wuw_GER_diplomacy.29.b: "聽起來很可疑……"
 wuw_GER_diplomacy.30.t: "[FROM.GetAdjective]接受貿易提議"
 wuw_GER_diplomacy.30.desc: "[FROM.GetNameDef]的領導人[FROM.GetLeader]積極回應了我們提出的貿易協議。我們曾經與他們達成過十分有利的貿易協議，[ROOT.GetLeader]非常肯定這將為我們帶來巨大的利益。"
 wuw_GER_diplomacy.30.a: "好消息！"
 wuw_GER_diplomacy.31.t: "[FROM.GetAdjective]拒絕我們的貿易提議"
 wuw_GER_diplomacy.31.desc: "儘管我們有歷史淵源，並且協議對他們有明顯的好處，[FROM.GetNameDef]還是拒絕了我們提出的貿易協議。該協議本可以促進兩國之間的更多貿易並鞏固我們的友誼。可惜，[FROM.GetAdjective]人似乎有其他的想法。"
 wuw_GER_diplomacy.31.a: "這是他們的損失"
 wuw_GER_diplomacy.32.t: "[FROM.GetAdjective]請求恢復[743.GetName]租界"
 wuw_GER_diplomacy.32.desc: "在1898年的談判中，[743.GetName]租借給當時的德意志帝國。如今，他們的繼承者[FROM.GetNameDef]與我們接洽，希望恢復這一租界。原本的租約應持續到1997年，但因世界大戰和[JAP.GetAdjective]的佔領而提前終止。"
 wuw_GER_diplomacy.32.a: "我們沒有興趣恢復這份租約"
 wuw_GER_diplomacy.32.b: "我們將履行原有協議"
 wuw_GER_diplomacy.33.t: "[FROM.GetNameDefCap]拒絕恢復我們的協議"
 wuw_GER_diplomacy.33.desc: "我們在1898年的協議很明確，[743.GetName]屬於我們直至1997年，然而[FROM.GetAdjective]似乎退縮了。他們似乎認為因為那場戰爭和隨後的[JAP.GetAdjective]佔領，我們的協議不再有效。協議中並沒有這樣的條款，但看來我們別無選擇。如果我們想要收回[743.GetName]，可能需要採取更激烈的措施。"
 wuw_GER_diplomacy.33.a: "他們真是太無禮了！"
 wuw_GER_diplomacy.34.t: "[FROM.GetNameDefCap]恢復[743.GetName]租界"
 wuw_GER_diplomacy.34.desc: "[FROM.GetAdjective]證明了自己是最忠誠的夥伴。我們在1898年簽署了[743.GetName]為期99年的租約，但由於世界大戰中斷。經過[JAP.GetNameDef]的佔領，這片領土被歸還給了[FROM.GetNameDef]，幸運的是，他們將履行我們的協議。"
 wuw_GER_diplomacy.34.a: "真是好消息！"
 wuw_GER_diplomacy.35.t: "[FROM.GetNameDefCap]要求控制前殖民地"
 wuw_GER_diplomacy.35.desc: "我們收到了[FROM.GetAdjective]領袖[FROM.GetLeder]的消息，[FROM.GetLeader.GetSheHe]希望重新掌控目前由我方管理的前殖民地。這份通告表面看來並無惡意，但考慮到[FROM.GetNameDef]當前的政治形勢，若我方予以拒絕，恐將引發嚴重後果。"
 wuw_GER_diplomacy.35.a: "那些土地不是他們的！"
 wuw_GER_diplomacy.35.b: "不值得冒險拒絕他們！"
 wuw_GER_diplomacy.36.t: "[FROM.GetAdjective]拒絕移交我們的殖民地"
 wuw_GER_diplomacy.36.desc: "我們以為已經明確告訴[FROM.GetNameDef]，轉交我們應得的殖民地不是選項而是必須。然而，他們仍然固執地拒絕做正確的、對他們最有利的事。我們仍然對這片領土有主權，他們沒有理由阻礙我們！"
 wuw_GER_diplomacy.36.a: "那些土地是我們的！"
 wuw_GER_diplomacy.37.t: "[FROM.GetNameDefCap]將領土割讓給我們"
 wuw_GER_diplomacy.37.desc: "我們要求從[FROM.GetNameDef]收回我們的殖民地的請求得到了[FROM.GetLeader]的理解和配合。他們聲稱更重視我們兩國之間的關係，慷慨地將我們應得的領土歸還給我們。"
 wuw_GER_diplomacy.37.a: "明智的選擇"
 wuw_GER_diplomacy.38.t: "[FROM.GetAdjective]索要領土"
 wuw_GER_diplomacy.38.desc: "[GetGERAfricanColonyOverlordDesc]"
 GER_is_not_colonial_overlord_desc: "我們收到了將我們的領土交給[FROM.GetNameDef]的要求。出於歷史原因，他們聲稱自己是這些土地的合法所有者。儘管要求措辭嚴厲，但我們仍有空間根據自己的議程做出回應。"
 GER_is_colonial_overlord_desc: "我們曾擔心這一天會到來，但希望它不會發生。[FROM.GetNameDef]的[FROM.GetLeader]要求我們成為[FROM.GetLeader.GetHerHis]的附屬，放棄獨立併成為[FROM.GetNameDef]的一部分。我們在這個問題上的意見已不再重要，我們只能服從。"
 wuw_GER_diplomacy.38.a: "[GetGERAfricanColonyOverlordOption]"
 GER_is_not_colonial_overlord_option: "安全比冒險好……"
 GER_is_colonial_overlord_option: "我們曾有過一段美好的時光"
 wuw_GER_diplomacy.38.b: "絕對不行！"
 wuw_GER_diplomacy.39.t: "[FROM.GetNameDefCap]將領土割讓給我們"
 wuw_GER_diplomacy.39.desc: "我們對[FROM.GetAdjective]領導層的要求勉強得到了批准。雖然他們對割讓領土並不高興，但他們的想法與我們無關，得到我們應得的領土才是關鍵。"
 wuw_GER_diplomacy.39.a: "太好了！"
 wuw_GER_diplomacy.40.t: "[FROM.GetNameDefCap]拒絕我們的領土要求"
 wuw_GER_diplomacy.40.desc: "儘管對[FROM.GetAdjective]的領導人[FROM.GetLeader]和[FROM.GetAdjective]的其他領導層施加了越來越大的壓力，他們依然不為所動。我們無法和平地收回目前在他們控制下的舊殖民地。"
 wuw_GER_diplomacy.40.a: "我們會想其他辦法"
 wuw_GER_diplomacy.100.t: "[FROM.GetAdjective]不再支付佔領金"
 wuw_GER_diplomacy.100.desc: "[FROM.GetName]的大使通知我們，他們將不再支付我們之前商定的佔領費用。"
 wuw_GER_diplomacy.100.a: "那就這樣吧"
 wuw_GER_diplomacy.50.t: "[FROM.GetNameDefCap]希望啟動海軍發展合作"
 wuw_GER_diplomacy.50.desc: "\n[FROM.GetNameDef]的外交官和海軍工程師向我們提出了一個特別的提議。他們表示希望開始大範圍的海軍合作項目，在兩國之間分享發展進度和技術。這對我們有利，但也存在洩露機密信息給[FROM.GetAdjective]的風險。我們怎麼應對？"
 wuw_GER_diplomacy.50.a: "太棒了！"
 wuw_GER_diplomacy.50.b: "不與德國佬合作！"
 wuw_GER_diplomacy.51.t: "[FROM.GetNameDefCap]接受海軍發展合作"
 wuw_GER_diplomacy.51.desc: "今天，[FROM.GetLeader]公開表示支持我們最近提出的海軍合作協議，並表示[FROM.GetAdjective]海軍工程師計劃下週就開始聯合開發和研究海軍艦艇和武器。對於[ROOT.GetNameDef]和她的海軍來說，這是偉大的一天！"
 wuw_GER_diplomacy.51.a: "我們的海軍將再次強大起來"
 wuw_GER_diplomacy.52.t: "[FROM.GetNameDefCap]拒絕海軍發展合作"
 wuw_GER_diplomacy.52.desc: "今天，[FROM.GetLeader]公開反對我們最近提出的海軍合作協議，聲稱這是一個明顯的企圖，旨在竊取[FROM.GetAdjective]的工程秘密……"
 wuw_GER_diplomacy.52.a: "愚蠢的選擇"
 wuw_GER_diplomacy.53.t: "[FROM.GetNameDefCap]提出貿易伙伴關係"
 wuw_GER_diplomacy.53.desc: "[FROM.GetNameDef]的外交官向我們提出了一個有利可圖的提議。他們希望購買我們殖民地中某些自然資源的開採權，並提供工業援助作為回報。我們應該接受這筆交易嗎？"
 wuw_GER_diplomacy.53.a: "我們雙方都能從中受益"
 wuw_GER_diplomacy.53.b: "這筆交易只對其中一方有利……"
 wuw_GER_diplomacy.54.t: "[FROM.GetNameDefCap]接受了我們的貿易提議"
 wuw_GER_diplomacy.54.desc: "[FROM.GetLeader]似乎是一位明智的領導者，注重[FROM.GetLeader.GetHerHis]本國的最大利益。而這恰好也符合我國的最大利益。我們將充分利用[FROM.GetName]提供的額外資源。"
 wuw_GER_diplomacy.54.a: "完美！"
 wuw_GER_diplomacy.55.t: "[FROM.GetNameDefCap]拒絕了我們的貿易提議"
 wuw_GER_diplomacy.55.desc: "[FROM.GetLeader]似乎是一個不講理且不明智的領導者，對於[FROM.GetLeader.GetHerHis]國家的最佳利益毫不關心。我們將去他處尋找我們所需的資源。"
 wuw_GER_diplomacy.55.a: "這是他們的損失"
 wuw_GER_diplomacy.56.t: "[FROM.GetNameDefCap]清空了我們的賬戶"
 wuw_GER_diplomacy.56.desc: "[FROM.GetAdjective]的官員和銀行家切斷了我們在德國賬戶的權限，並清空了賬戶。這意味著[GER.GetNameDef]已經沒收了錢款，我們通過根伯什貿易條約獲得的現金實際上歸零了。我們再也不能相信他們的話了……"
 wuw_GER_diplomacy.56.a: "他們怎麼敢！"
 wuw_GER_diplomacy.57.t: "[FROM.GetNameDefCap]要求歸還北石勒蘇益格"
 wuw_GER_diplomacy.57.desc: "\n最近，[FROM.GetLeader]和[FROM.GetAdjective]政府對我們的態度變得更加敵對，聲稱1920年的石勒蘇益格公投是非法的、欺詐的，並要求我們歸還該領土。我們知道這不是真的，但也許最好避免與[FROM.GetNameDef]公開衝突？"
 wuw_GER_diplomacy.57.a: "我們不希望發生衝突，所以我們一定要遵從……"
 wuw_GER_diplomacy.57.b: "讓他們自己來拿吧！"
 wuw_GER_diplomacy.58.t: "[FROM.GetNameDefCap]向我們的要求屈服"
 wuw_GER_diplomacy.58.desc: "[FROM.GetLeader]宣佈，由於他們不希望與我們發生武裝衝突，他們決定歸還在1920年石勒蘇益格公投中獲得的領土。該地區的人民歡欣鼓舞，因為他們再次被納入我們的版圖。"
 wuw_GER_diplomacy.58.a: "這對[ROOT.GetAdjective]人民來說是偉大的一天！"
 wuw_GER_diplomacy.59.t: "[FROM.GetNameDefCap]堅持石勒蘇益格公投的結果"
 wuw_GER_diplomacy.59.desc: "\n自信滿滿的[FROM.GetLeader]宣稱北石勒蘇益格將永遠屬於[FROM.GetAdjective]。[FROM.GetNameDefCap]的部隊已經動員，並迅速部署到我們的邊境，似乎他們正在為戰爭做準備。我們該如何應對這種挑釁？"
 wuw_GER_diplomacy.59.a: "那麼我們就從他們冷酷的手中奪過來！"
 wuw_GER_diplomacy.59.b: "我們真的不應該升級衝突……"
 wuw_GER_mutual_guarantees.1.t: "[FROM.GetNameDefCap]請求互助合作"
 wuw_GER_mutual_guarantees.1.desc: "[FROM.GetNameDef]的[FROM.GetLeader]向我們提出了相互保障和合作的提議。該協議將擴展到相互保護彼此的領土，並有可能在未來發展為更大的合作。我們如何回應？"
 wuw_GER_mutual_guarantees.1.a: "這是一項互利的協議"
 wuw_GER_mutual_guarantees.1.b: "我們認為這項協議毫無價值"
 wuw_GER_mutual_guarantees.2.t: "[FROM.GetNameDefCap]歡迎互助合作"
 wuw_GER_mutual_guarantees.2.desc: "[FROM.GetNameDef]的[FROM.GetLeader]接受了我們提出的互助合作和保障的請求，並熱情歡迎我們的外交官，聲稱只有團結在一起，才能保護我們兩國免受威脅平衡的外來勢力的侵害。"
 wuw_GER_mutual_guarantees.2.a: "太好了"
 wuw_GER_mutual_guarantees.3.t: "[FROM.GetNameDefCap]拒絕互助合作"
 wuw_GER_mutual_guarantees.3.desc: "[FROM.GetNameDef]的[FROM.GetLeader]拒絕了我們提出的共同防禦和合作協議，聲稱這是我們秘密滲透他們人民內心並最終統治他們國家的策略。他們真的不知道自己錯過了什麼樣的機會……"
 wuw_GER_mutual_guarantees.3.a: "他們犯了一個大錯誤"
 wuw_GER_weltpolitik.1.t: "[FROM.GetName]要求歸還前殖民地"
 wuw_GER_weltpolitik.1.desc: "[FROM.GetNameDef]的[FROM.GetLeader]向我們提出了一個有趣的請求。他們要求我們歸還曾經的[FROM.GetAdjective]殖民地，以換取加深兩國關係，並承諾在全球範圍內正式支持我們政府。這似乎有些單方面，但也許這是最好的選擇？"
 wuw_GER_weltpolitik.1.a: "為了我們的朋友，什麼都行"
 wuw_GER_weltpolitik.1.b: "不，它們現在屬於我們了"
 wuw_GER_weltpolitik.2.t: "[FROM.GetNameDefCap]歸還我們的殖民地"
 wuw_GER_weltpolitik.2.desc: "[FROM.GetNameDef]的[FROM.GetLeader]接受了我們歸還前殖民地的請求，稱它們在我們手中會更好。人們在街頭慶祝，因為[ROOT.GetAdjective]殖民帝國似乎終於重回版圖。"
 wuw_GER_weltpolitik.2.a: "我們正快速走向新的黃金時代！"
 wuw_GER_weltpolitik.3.t: "[FROM.GetNameDefCap]不歸還我們的殖民地"
 wuw_GER_weltpolitik.3.desc: "\n[FROM.GetNameDef]的[FROM.GetLeader]拒絕了我們歸還舊殖民地的請求，聲稱這是一項單方面的交易，他們幾乎得不到任何好處。"
 wuw_GER_weltpolitik.3.a: "本不應如此……"
 wuw_GER_diplomacy.60.t: "[FROM.GetNameDefCap]索要北石勒蘇益格"
 wuw_GER_diplomacy.60.desc: "\n[FROM.GetLeader]和[FROM.GetAdjective]政府最近對我們在[912.GetName]的地方行政人員變得更加敵對，聲稱北石勒蘇益格一直都是德國的，並要求我們歸還該領土。我們知道這不是真的，但也許最好避免與[FROM.GetNameDef]公開衝突？"
 wuw_GER_diplomacy.60.a: "他們是對的"
 wuw_GER_diplomacy.60.b: "他們是在妄想嗎？"
 wuw_GER_diplomacy.61.t: "[FROM.GetNameDefCap]向我們的要求屈服"
 wuw_GER_diplomacy.61.desc: "[FROM.GetLeader]宣佈，由於他們不希望與我們發生武裝衝突，他們決定歸還[912.GetName]。該地區的人民歡欣鼓舞，因為他們再次被納入我們的版圖。"
 wuw_GER_diplomacy.61.a: "這對[ROOT.GetAdjective]人民來說是偉大的一天！"
 wuw_GER_diplomacy.62.t: "[FROM.GetNameDefCap]在[912.GetName]的問題上態度堅決"
 wuw_GER_diplomacy.62.desc: "\n自信滿滿的[FROM.GetLeader]宣佈，北石勒蘇益格永遠屬於[FROM.GetAdjective]。[FROM.GetNameDefCap]的軍隊已經動員，並駐紮在該地區以威懾入侵。我們該如何應對這一挑釁？"
 wuw_GER_diplomacy.62.a: "我們絕不會在人民自由的問題上妥協！"
 wuw_GER_diplomacy.62.b: "我們真的不應該升級這場衝突……"
 wuw_GER_diplomacy.63.t: "[FROM.GetNameDefCap]奪取[912.GetName]"
 wuw_GER_diplomacy.63.desc: "\n我們的統治者[FROM.GetLeader]宣佈，北石勒蘇益格永遠屬於[FROM.GetAdjective]。[FROM.GetNameDefCap]的軍隊已經進入該地區，他們的新地方行政人員迫使我們的政客簽署了一項法案，將該領土租借給他們100年。"
 wuw_GER_diplomacy.63.a: "很遺憾我們無法阻止他們……"
 GER_seized_north_schleswig: "德國奪取北石勒蘇益格"
 wuw_GER_chinese_diplomacy.1.t: "[FROM.GetNameDefCap]向我們提供武器和物資"
 wuw_GER_chinese_diplomacy.1.desc: "\n我們西方的偉大盟友[FROM.GetAdjective]們給我們送來了一批武器和彈藥。不僅如此，他們還派來了一組工程師和實業家，幫助我們發展自己的武器工業，以便我們的軍事經濟在幾個世紀的屈辱之後重新步入正軌。"
 wuw_GER_chinese_diplomacy.1.a: "這將派上用場"
 wuw_GER_chinese_diplomacy.2.t: "[FROM.GetNameDefCap]提供工業援助以換取資源權"
 wuw_GER_chinese_diplomacy.2.desc: "\n我們西方的偉大盟友[FROM.GetAdjective]派來了一個代表團。代表團表示，他們願意投資我們的工業，以換取更好的自然資源交易權。他們真是值得擁有的好朋友。"
 wuw_GER_chinese_diplomacy.2.a: "確實是好朋友"
 wuw_GER_chinese_diplomacy.2.b: "我們不能出讓我們的自然資源"
 wuw_GER_chinese_diplomacy.3.t: "[FROM.GetNameDefCap]接受我方提議"
 wuw_GER_chinese_diplomacy.3.desc: "\n我們的代表團帶來了令人振奮的消息。他們表示[FROM.GetAdjective]政府非常樂意簽署我們提出的協議，並且協議將立即生效。因此，我們以幫助他們工業化為代價，成功獲得了他們的自然資源。"
 wuw_GER_chinese_diplomacy.3.a: "太好了"
 wuw_GER_chinese_diplomacy.4.t: "[FROM.GetNameDefCap]拒絕我們的提議"
 wuw_GER_chinese_diplomacy.4.desc: "\n我們的代表團帶來了令人失望的消息。他們表示[FROM.GetAdjective]政府拒絕簽署協議，稱我們是在利用工業援助的幌子剝削他們。"
 wuw_GER_chinese_diplomacy.4.a: "真令人失望"
 wuw_GER_diplomacy.64.t: "[FROM.GetNameDefCap]提供保護以換取貢賦"
 wuw_GER_diplomacy.64.desc: "\n[FROM.GetNameDef]的[FROM.GetLeader]向我們提出了提供對抗東方威脅的保護。然而，這種保護並不是免費的，據說如果我們希望得到保護，必須向[FROM.GetAdjective]們繳納貢賦。"
 wuw_GER_diplomacy.64.a: "如果這是必要的話"
 wuw_GER_diplomacy.64.b: "代價太昂貴，我們無法接受……"
 wuw_GER_diplomacy.65.t: "[FROM.GetNameDefCap]接受我們的條件"
 wuw_GER_diplomacy.65.desc: "[FROM.GetNameDef]的[FROM.GetLeader]回應了我們的提議，表示為了確保[FROM.GetAdjective]的未來，他們將滿足我們的條件，並立即進行所需的款項支付。"
 wuw_GER_diplomacy.65.a: "一切都在按計劃進行！"
 wuw_GER_diplomacy.66.t: "[FROM.GetNameDefCap]拒絕我們的條件"
 wuw_GER_diplomacy.66.desc: "[FROM.GetNameDef]的[FROM.GetLeader]回應了我們的提議，表示我們的保護條件太苛刻，相應的成本也太高了。他們認為自己能夠獨立應對，不需要自以為是的普魯士軍隊的協助。"
 wuw_GER_diplomacy.66.a: "哦，好吧"
 wuw_GER_diplomacy.66.b: "即使他們拒絕支付貢賦，他們仍然需要保護！"
 wuw_GER_diplomacy.67.t: "[FROM.GetNameDefCap]提出秘密協議"
 wuw_GER_diplomacy.67.desc: "[FROM.GetNameDef]的[FROM.GetLeader]私下接觸我們，提議共同瓜分我們的鄰國，並達成一個聯盟協議，在低地建立勢力範圍。我們是否應該接受他們這項陰暗提議？"
 wuw_GER_diplomacy.67.a: "這肯定會對我們有利"
 wuw_GER_diplomacy.67.b: "這是不道德的！"
 wuw_GER_diplomacy.68.t: "[FROM.GetNameDefCap]同意該協議"
 wuw_GER_diplomacy.68.desc: "[FROM.GetNameDef]的[FROM.GetLeader]回應了我們的提議，表示為了保證[FROM.GetAdjective]的未來，他們將同意該協議，並建立自己的勢力範圍。"
 wuw_GER_diplomacy.68.a: "那麼，是時候採取行動了！"
 wuw_GER_diplomacy.68.b: "好消息，不過我們必須耐心等待"
 wuw_GER_diplomacy.69.t: "[FROM.GetNameDefCap]拒絕該協議"
 wuw_GER_diplomacy.69.desc: "[FROM.GetNameDef]的[FROM.GetLeader]回應了我們的提議，對於瓜分鄰國和背後捅刀的想法，他們感覺不對勁，如果我們想在未來的衝突中成為侵略者，應該另尋盟友。"
 wuw_GER_diplomacy.69.a: "我們將不得不尋找其他盟友"
 warning_they_may_instead_apporach_our_neighbor_tt: "§R[FROM.GetNameDefCap]可能會轉而接觸我們的鄰國§!"
 wuw_GER_diplomacy.70.t: "[FROM.GetNameDefCap]干涉我們的政局"
 wuw_GER_diplomacy.70.desc: "[FROM.GetAdjective]宣傳者最近開始影響我們的民眾，誘導民眾支持該國，承諾如果我們作為盟友加入他們的國家，我們的人民將迎來美好的未來。這並不一定是對我們獨立的威脅，但毫無疑問是對我們現政府的侵略行為，許多新發行的報紙宣揚我們體制固有的弱點。也許我們可以在這個世界上再另外找一個朋友，不過這可能不是我們最後一次聽到[FROM.GetLeader]和[FROM.GetLeader.GetHerHis]的走狗的消息。"
 wuw_GER_diplomacy.70.a: "這個主意不錯，我們可以再找個盟友"
 wuw_GER_diplomacy.70.b: "不要與[FROM.GetAdjective]合作，快讓這些宣傳者閉嘴！"
 wuw_GER_diplomacy.71.t: "[ROOT.GetNonIdeologyName]人民委員轄區成立"
 wuw_GER_diplomacy.71.desc: "我們的[FROM.GetNameDef]宗主剛剛通知我們，當前協議將進行重組。為了團結各地的工人，我們被要求讓他們接管我們工業的更大部分，以便為我們人民的更高尚的利益服務。我們對此沒有發言權，也沒有抱怨的餘地。我們知道，當他們提供幫助時，這很可能就是我們需要付出的代價。"
 wuw_GER_diplomacy.71.a: "這符合我們人民的最佳利益。"
 wuw_GER_diplomacy.72.t: "[FROM.GetNameDef]的共產主義影響"
 wuw_GER_diplomacy.72.desc: "我們注意到，目前在我國有[FROM.GetAdjective]的組織在傳播共產主義思想。儘管這本身似乎無害，但一些宣傳內容卻顯得相當具有革命性。關於工人被鼓勵組織起來團結一致的報道越來越頻繁，結合近期的歷史，我們無法確定這是否是[GER.GetAdjective]領導層的一個複雜陰謀，最終目的是要將我們整合進來。"
 wuw_GER_diplomacy.72.a: "我們沒有理由不信任他們"
 wuw_GER_diplomacy.72.a_tt: "§R如果共產主義支持者贏得內戰，[FROM.GetNameWithFlag]可能會試圖征服我們！§!"
 wuw_GER_diplomacy.72.b: "我們不會上這個當！"
 wuw_GER_diplomacy.73.t: "[FROM.GetNameDefCap]允許我們鼓勵共產主義情懷"
 wuw_GER_diplomacy.73.desc: "我們在[FROM.GetNameDef]進行活動以加強共產主義運動的特工，已引起該國領導層的注意。幸運的是，他們對越來越多支持無產階級事業的人群似乎表現得相對漠不關心，這讓我們得以繼續我們的努力。"
 wuw_GER_diplomacy.73.a: "為了無產階級！"
 wuw_GER_diplomacy.74.t: "[FROM.GetNameDefCap]不允許政治渲染行動"
 wuw_GER_diplomacy.74.desc: "我們在[FROM.GetNameDef]開展加強共產主義運動的行動已引起該國領導層的注意。我們收到了他們的一封嚴正信件，要求我們立即停止這一行動。看起來，我們出於善意告知工人他們的權利，暴露了[FROM.GetLeader]作為普通人民敵人的真實面目。"
 wuw_GER_diplomacy.74.a: "我們必須解放我們的[FROM.GetAdjective]同志！"
 wuw_GER_diplomacy.75.t: "[ROOT.GetNameDef]內戰"
 wuw_GER_diplomacy.75.desc: "在經歷了一段時間的共產主義情緒上升後，似乎[ROOT.GetAdjective]無產階級已經對等待和平政權更迭感到厭倦。經過激烈的討論，外交途徑似乎已破裂，武裝衝突隨之而來。"
 wuw_GER_diplomacy.75.a: "為了無產階級！"
 wuw_GER_diplomacy.75.b: "我們必須阻止這種愚行！"
 wuw_GER_diplomacy.76.t: "[FROM.GetNameDefCap]要求我們臣服"
 wuw_GER_diplomacy.76.desc: "在內戰終於平息後，[FROM.GetNameDef]歸來要求我們屈服。我們曾懷疑這一局面會到來，但選擇忽視，以便獲得他們的支持來推翻先前的政府。到目前為止，他們對我們表現得相當仁慈，因此我們希望這對我們而言可能並不太糟糕。"
 wuw_GER_diplomacy.76.a: "這是我們付出的代價。"
 wuw_GER_diplomacy.77.t: "[FROM.GetNameDefCap]要求我們舉行全民公投加入他們"
 wuw_GER_diplomacy.77.desc: "我們北方的鄰國向我們提出了要求，呼籲我們舉行公投以加入他們。他們表示我們的人民與他們十分相似，應該共同生活在一個統一的國家，因此他們暗示我們應向他們屈服。雖然我們仍然可以享有一定程度的自由，但我們的外交政策等方面將由[FROM.GetAdjective]的監督和管理。"
 wuw_GER_diplomacy.77.a: "為什麼不呢？"
 wuw_GER_diplomacy.77.b: "絕對不行！"
 wuw_GER_diplomacy.78.t: "[FROM.GetNameDefCap]規範行事"
 wuw_GER_diplomacy.78.desc: "在近期的公投中，渴望加入我們的[FROM.GetAdjective]人獲得了勝利，[FROM.GetNameDef]的領導層已向我們反饋了積極的回應。此後，他們將為了我們的人民而服從於我們。"
 wuw_GER_diplomacy.78.a: "值得慶祝的一天！"
 wuw_GER_diplomacy.79.t: "[FROM.GetNameDefCap]領導層拒絕加入我們"
 wuw_GER_diplomacy.79.desc: "來自[FROM.GetAdjective]領導層的負面回應讓我們感到震驚，我們很難相信真的舉行過公投。儘管有明確的跡象表明他們的人民在我們的安全領導下會表現得更好，但[FROM.GetLeader]卻選擇了[FROM.GetLeader.GetHerHis]自己的權力，而不是考慮[FROM.GetLeader.GetHerHis]人民的利益。"
 wuw_GER_diplomacy.79.a: "我們必須解放他們！"
 wuw_GER_diplomacy.80.t: "[FROM.GetNameDefCap]投資我國工業"
 wuw_GER_diplomacy.80.desc: "[FROM.GetAdjective]政府已經進行了大量投資，以使我們的產業達到他們的水平。我們將其視為一項互利的協議。作為一個國家，我們獲得了一個更發達的產業，隨著我們能力的提高，他們也將能夠利用這一點。"
 wuw_GER_diplomacy.80.a: "太好了！"
 wuw_GER_diplomacy.81.t: "整合[ROOT.GetNameDef]"
 wuw_GER_diplomacy.81.desc: "我們作為人民委員轄區的時代已經結束。[FROM.GetAdjective]領導層對我們的努力非常滿意，現在把這個國家視為不僅僅是一個附屬國。因此，他們希望通過允許我們成為他們偉大國家的一部分來獎勵我們，而不僅僅是一個附屬國。當然，這意味著我們將不再擁有任何獨立性，但他們向我們保證，他們會好好照顧我們的人。"
 wuw_GER_diplomacy.81.a: "算不上獎勵，但我們別無選擇。"
 wuw_GER_diplomacy.82.t: "[FROM.GetAdjective]對起義的支持"
 wuw_GER_diplomacy.82.desc: "我們的[FROM.GetNameDef]同志向我們送來了一批步槍，幫助我們對抗資本主義和資產階級。這種幫助的代價可能在未來發生，但眼下，我們又怎能拒絕他們的援助呢？"
 wuw_GER_diplomacy.82.a: "好好利用這些槍！"
 wuw_GER_diplomacy.83.t: "[GER.GetNameDefCap]邀請我們加入[GER.GetFactionName]"
 wuw_GER_diplomacy.83.desc: "我們成功贏得內戰，接著建立共產主義政權，隨後，[GER.GetNameDef]主動與我們接觸。[GER.GetAdjective]對我們的支持在其中起了多大作用最好還是不提了。既然我們現在有了相似的意識形態，他們向我們提出了這項邀請。然而，我們在這件事上有多少選項仍然有些不明朗。"
 wuw_GER_diplomacy.83.a: "我們當然會加入"
 wuw_GER_diplomacy.83.b: "我們寧願獨立自主。"
 wuw_GER_diplomacy.84.t: "[FROM.GetNameDefCap]要求加強無產階級的團結"
 wuw_GER_diplomacy.84.desc: "[GetIsRootProletarianSubject]"
 GER_root_is_proletarian_subject: "我們的國家現在得到工人和無產階級的代表的合法領導，[FROM.GetAdjective]主動聯繫我們。他們談到了所謂的無產階級團結，以及作為他們的附庸，我們應該向他們貢獻一些工業能力，以換取他們在建設我們國家方面的幫助。"
 GER_root_not_proletarian_subject: "我們的國家現在得到工人和無產階級的代表的合法領導，[FROM.GetAdjective]主動聯繫我們。他們談到了共產主義國家間的團結，以改善我們人民的生活。允許我們兩國之間的貿易可以使兩國的工人受益，同時還可以防止來自資本主義國家的影響侵蝕我們精心建立的政治體系。"
 wuw_GER_diplomacy.84.a: "我們同意，團結萬歲！"
 wuw_GER_diplomacy.84.b: "這聽起來對他們更有利。"
 wuw_GER_diplomacy.85.t: "[FROM.GetNameDefCap]要求合併我們"
 wuw_GER_diplomacy.85.desc: "我們收到了一份措辭嚴厲的要求，[FROM.GetAdjective]認為我們當前的合作雖然有利，但還不夠好。他們的解決方案是要求我們併入[FROM.GetNameDef]。雖然沒有提到拒絕的後果，但可以想像，拒絕的代價不會輕。"
 wuw_GER_diplomacy.85.a: "我們別無選擇"
 wuw_GER_diplomacy.85.b: "如果必須戰鬥，那就戰鬥！"
 wuw_GER_diplomacy.86.t: "[FROM.FROM.GetNameDefCap]移交我們勢力範圍內的領土"
 wuw_GER_diplomacy.86.desc: "今天我們收到了令人振奮的消息，[FROM.FROM.GetNameDef]在控制了我們勢力範圍內的[FROM.GetAdjective]領土後，決定履行我們的協議。該勢力範圍內的領土已移交給我們。"
 wuw_GER_diplomacy.86.a: "太好了！"
 wuw_GER_diplomacy.87.t: "尊重勢力範圍"
 wuw_GER_diplomacy.87.desc: "我們在最近的戰爭中取得了勝利，我們面臨一個抉擇。我們征服的部分土地不在我們的勢力範圍內。根據協議，我們應交出這些土地。然而，這份協議從未有過書面記錄，因此，有人可能會認為它不具有約束力……"
 wuw_GER_diplomacy.87.a: "我們必須履行協議！"
 wuw_GER_diplomacy.87.b: "我們光明正大地贏得了那塊土地！"
 wuw_GER_diplomacy.88.t: "[FROM.GetNameDefCap]移交我們勢力範圍內的領土"
 wuw_GER_diplomacy.88.desc: "今天我們收到了令人振奮的消息，[FROM.FROM.GetNameDef]在控制了我們勢力範圍內的[FROM.GetAdjective]領土後，決定履行我們的協議。該勢力範圍內的領土已移交給我們。"
 wuw_GER_diplomacy.88.a: "太好了！"
 wuw_GER_diplomacy.89.t: "[FROM.GetNameDefCap]建立勢力範圍"
 wuw_GER_diplomacy.89.desc: "[FROM.GetNameDefCap]通知我們，他們已經建立了一個勢力範圍。雖然因為沒有正式協議，這並不直接影響我們，但這是我們需要注意的事態。如果我們控制了這些領土，他們可能會試圖向我們施加壓力或索要領土。"
 wuw_GER_diplomacy.89.a: "好吧……"
 wuw_GER_diplomacy.89.b: "不可接受"
 wuw_GER_diplomacy.90.t: "[FROM.GetNameDefCap]請求籤訂互不侵犯條約"
 wuw_GER_diplomacy.90.desc: "[FROM.GetLeader]向我們提出了一項請求。[FROM.GetLeader.GetSheHe]希望與我們簽訂一份互不侵犯條約，鞏固我們雖然不是盟友但也絕不是敵人的理念。這樣的條約確實會限制我們在與[FROM.GetAdjective]關係惡化時的行動自由，但它也有可能最大限度地降低這種情況發生的風險。"
 wuw_GER_diplomacy.90.a: "這將增強我們的實力！"
 wuw_GER_diplomacy.90.b: "我們不能跟他們綁在一塊兒"
 wuw_GER_diplomacy.91.t: "[FROM.GetNameDefCap]表達加盟的意願"
 wuw_GER_diplomacy.91.desc: "我們剛剛收到[FROM.GetAdjective]領導層的通知，他們希望全盤吸收我們的政治綱領。他們希望這能成為未來繼續合作的良好基礎，但強調不必現在就實施。這是一個影響他們政治精英的絕佳機會。"
 wuw_GER_diplomacy.91.a: "我們有個人能幫上忙……"
 wuw_GER_diplomacy.92.t: "[FROM.GetNameDefCap]批准我們的加盟請求"
 wuw_GER_diplomacy.92.desc: "我們在[FROM.GetNameDef]的同志們反響積極。他們歡迎我們全盤吸收他們的政治綱領，並希望在未來建立良好的合作關係。至於最佳的實現辦法，他們提出了一個建議，使這一過渡更快、更容易。他們建議我們更換政治領導人，儘管恩斯特·臺爾曼是一個有能力的領導人，但他們確信瓦爾特·烏布利希特可以為我們的未來合作提供更好的基礎。"
 wuw_GER_diplomacy.92.a: "烏布利希特也同樣能力出眾，我們同意"
 wuw_GER_diplomacy.92.b: "不，我們不會讓他們插手的！"
 wuw_GER_diplomacy.93.t: "[FROM.GetNameDef]扶植瓦爾特·烏布利希特"
 wuw_GER_diplomacy.93.desc: "也許令人驚訝的是，[FROM.GetAdjective]領導層願意換掉恩斯特·臺爾曼。他們進行了這次更換，以促進與我們的良好關係，並確保我們的政治綱領保持一致，以減少我們的合作摩擦。必須承認這是一次成功！"
 wuw_GER_diplomacy.93.a: "太好了！"
 wuw_GER_diplomacy.94.t: "[FROM.GetNameDefCap]拒絕換掉恩斯特·臺爾曼"
 wuw_GER_diplomacy.94.desc: "為了幫助[FROM.GetAdjective]的同志們，儘管我們提出了充滿善意的建議，他們卻頑固地拒絕了。他們似乎認為這一提議是干涉他們的政治，雖然這完全不是我們的本意。"
 wuw_GER_diplomacy.94.a: "頑固的[FROM.GetAdjective]人"
 wuw_GER_diplomacy.95.t: "工業合作提案"
 wuw_GER_diplomacy.95.desc: "[FROM.GetAdjective]領導層向我們提出了一個關於兩國之間工業合作的建議。他們的建議詳細說明了我們如何能夠共同改善並擴大工業規模。我們是否真的能從中受益，還是僅對[FROM.GetAdjective]有利，還有待觀察。"
 wuw_GER_diplomacy.95.a: "聽起來不錯"
 wuw_GER_diplomacy.95.b: "他們一定認為我們很蠢"
 wuw_GER_diplomacy.96.t: "[FROM.GetNameDefCap]同意工業合作"
 wuw_GER_diplomacy.96.desc: "我們向[FROM.GetAdjective]提出的工業合作建議得到了認可。未來我們將共同擴張和優化我們的工業。"
 wuw_GER_diplomacy.96.a: "太好了！"
 wuw_GER_diplomacy.97.t: "[FROM.GetNameDefCap]拒絕我們的提案"
 wuw_GER_diplomacy.97.desc: "我們向[FROM.GetAdjective]提出的提案被拒絕了。儘管這項協議對我們雙方都有利，他們還是拒絕了我們的建議。雖然這個計劃失敗了，但我們可以靠自己實現部分目標。我們仍然可以獨自擴張工業。"
 wuw_GER_diplomacy.97.a: "那我們就自己擴張吧"
 wuw_GER_diplomacy.98.t: "[FROM.GetNameDefCap]邀請我們加入科技共享計劃"
 wuw_GER_diplomacy.98.desc: "我們在[FROM.GetNameDef]的同志最近聯繫了我們，探討建立一個共享工業和生產知識項目的可能性。我們將與他們分享我們的知識，他們也會與我們分享他們的知識。這將使我們的工人和生產線受益。"
 wuw_GER_diplomacy.98.a: "這是一個好計劃"
 wuw_GER_diplomacy.98.b: "他們不可信"
 wuw_GER_diplomacy.99.t: "[FROM.GetNameDefCap]加入科技共享計劃"
 wuw_GER_diplomacy.99.desc: "[FROM.GetAdjective]認識到了我們提出的技術共享計劃的好處，我們非常滿意。從現在起，我們將能夠獲取他們的知識，他們也將獲取我們的知識。這樣一來，我們在工業和生產領域應該會取得巨大進步。"
 wuw_GER_diplomacy.99.a: "太好了"
 wuw_GER_diplomacy.101.t: "[FROM.GetNameDefCap]不贊成科技共享計劃"
 wuw_GER_diplomacy.101.desc: "儘管各方都能受益，[FROM.GetNameDef]仍然拒絕加入我們的科技共享計劃。他們表示，我們不配得到他們的技術，並拒絕了我們的提議，還要求我們不要再向他們提出這樣的建議。"
 wuw_GER_diplomacy.101.a: "不可理喻的[FROM.GetAdjective]人……"
 wuw_GER_diplomacy.102.t: "[FROM.GetNameDefCap]同意簽訂互不侵犯條約"
 wuw_GER_diplomacy.102.desc: "我們與[FROM.GetNameDef]簽訂互不侵犯條約的請求得到了批准。從現在起，我們雙方都將避免對彼此的侵略。我們確信這將極大地造福我們兩國。"
 wuw_GER_diplomacy.102.a: "太好了"
 wuw_GER_diplomacy.103.t: "[FROM.GetNameDefCap]拒絕互不侵犯條約"
 wuw_GER_diplomacy.103.desc: "儘管對我們雙方都有明顯好處，[FROM.GetNameDef]還是拒絕了我國提出的互不侵犯條約。我們不知道拒絕的原因是什麼，但他們的拒絕確實令人擔憂。我們將保持密切關注。"
 wuw_GER_diplomacy.103.a: "令人擔憂"
 wuw_GER_diplomacy.104.t: "[FROM.GetNameDefCap]同意建立勢力範圍"
 wuw_GER_diplomacy.104.desc: "我們從[FROM.GetAdjective]方面得到了消息，他們批准了建立勢力範圍的提議。這將防止敵對行動，並減少因周邊土地導致衝突的風險。"
 wuw_GER_diplomacy.104.a: "太好了！"
 wuw_GER_diplomacy.105.t: "[FROM.GetNameDefCap]拒絕建立勢力範圍"
 wuw_GER_diplomacy.105.desc: "我們從[FROM.GetAdjective]方面得到了消息，他們將拒絕承認和認可我們的勢力範圍。而對於他們自己的勢力範圍，他們表示將自行決定，不會讓我們參與。這可能會在該地區引發一些緊張局勢。"
 wuw_GER_diplomacy.105.a: "真是無禮！"
 wuw_GER_diplomacy.107.t: "[FROM.GetAdjective]用工業換取資源"
 wuw_GER_diplomacy.107.desc: "我們收到[FROM.GetNameDef]的提議。他們有意開展長期資源貿易，作為交換，他們會將一些工業設施搬遷到我們這裡。目前，他們看中了[FROM.FROM.GetName]的資源，希望能獲得其中的一部分。"
 wuw_GER_diplomacy.107.a: "為什麼不呢？"
 wuw_GER_diplomacy.107.b: "這不是好時機"
 wuw_GER_diplomacy.107.c: "不公平的提議，別再提了！"
 wuw_GER_diplomacy.108.t: "[FROM.GetAdjective]同意遷移工業設施"
 wuw_GER_diplomacy.108.desc: "關於我們請求遷移工業設施來換取[FROM.GetAdjective]的部分資源，我們收到了的他們答覆。看起來我們雙方都認同這筆交易的益處，他們愉快地同意了。我們將很快收到這些資源。"
 wuw_GER_diplomacy.108.a: "太好了"
 wuw_GER_diplomacy.109.t: "[FROM.GetAdjective]拒絕工業設施搬遷協議"
 wuw_GER_diplomacy.109.desc: "儘管對我們提出的協議大多持中立態度，[FROM.GetAdjective]最終還是選擇拒絕我們提出的遷移工業設施換取資源的提議。他們聲稱現在不是合適的時機，似乎是在暗示我們，可能需要在未來關係進一步加強後才能達成協議。"
 wuw_GER_diplomacy.109.a: "如果一開始不成功……"
 wuw_GER_diplomacy.110.t: "[FROM.GetAdjective]強烈拒絕工業設施搬遷協議"
 wuw_GER_diplomacy.110.desc: "我們向[FROM.GetAdjective]提出的非常公平的協議遭到了冷酷的拒絕。他們不僅如此，還明確表示不希望我們再次就此事聯繫他們。如果我們想要那些資源，可能需要找到其他辦法。"
 wuw_GER_diplomacy.110.a: "自私的[FROM.GetAdjective]人……"
 GER_SOV_have_had_enough_tt: "§R取消將工業遷至§Y[SOV.GetNameWithFlag]§!以換取資源的§Y決議§!§!"
 wuw_GER_diplomacy.111.t: "經濟關係發展協議"
 wuw_GER_diplomacy.111.desc: "[FROM.GetNameDef]的外交官堅決要求我們簽署他們提出的《德國-羅馬尼亞經濟關係發展協議》。他們聲稱，這項協議將使兩國受益，因為他們需要我們的自然資源來供應工業，而我們則可以用更優惠的價格購買德國軍備。這項協議對我們來說似乎並不像德國人所說的那麼有利，但拒絕他們肯定會激怒他們……"
 wuw_GER_diplomacy.111.a: "我們別無選擇，只能接受……"
 wuw_GER_diplomacy.111.b: "我們不能接受，去他孃的後果！"
 wuw_GER_diplomacy.112.desc: "[FROM.GetLeader]似乎是位理智的領導者，他在為[FROM.GetLeader.GetHerHis]國家的最佳利益著想。巧合的是，這個不公平的協議恰好也符合我們國家的最佳利益。我們將把來自[FROM.GetName]的額外資源加以利用。"
 wuw_GER_diplomacy.113.desc: "[FROM.GetLeader]似乎是一個不理智且不明智的領導者，他根本不關心[FROM.GetLeader.GetHerHis]國家的最佳利益。[FROM.GetAdjective]人民將因這種愚蠢行為而受苦。"
 wuw_GER_diplomacy.113.b: "那就開戰吧！"
 wuw_GER_diplomacy.117.a: "我們無力抵抗他們……"
 wuw_GER_diplomacy.117.b: "我們絕不會屈服！"
 wuw_GER_diplomacy.118.t: "[FROM.GetNameDefCap]屈服了"
 wuw_GER_diplomacy.118.desc: "[FROM.GetNameDef]的[FROM.GetLeader]宣佈，[FROM.GetAdjective]將屈服於我們的統治，這是最好的選擇，因為他們沒有能力阻止我們，戰爭只會給他們的土地和人民帶來毀滅。"
 wuw_GER_diplomacy.119.t: "[FROM.GetNameDefCap]拒絕屈服"
 wuw_GER_diplomacy.119.desc: "頑固的[FROM.GetAdjective]人拒絕了我們合併國家以組成更強大的政治實體的提議。難道這就是我們為他們所做的一切的回報嗎？"
 wuw_GER_weltpolitik.4.t: "[FROM.GetLeader]想瓜分剛果"
 wuw_GER_weltpolitik.4.desc: "[FROM.GetNameDef]的[FROM.GetLeader]就失去的[FROM.GetAdjective]殖民地問題接觸我們，他們認為自己被《凡爾賽條約》掠奪了。他們現在要求我們與[GER.GetAdjective]簽署協議，將剛果瓜分為勢力範圍，共同提出索求。我們是否應該屈服並簽署這樣的協議？"
 wuw_GER_weltpolitik.4.a: "這是一項互利的協議"
 wuw_GER_weltpolitik.4.b: "我們不會支持這種侵略行為"
 wuw_GER_weltpolitik.5.t: "[FROM.GetLeader]要求我們放棄剛果"
 wuw_GER_weltpolitik.5.desc: "[FROM.GetNameDef]的[FROM.GetLeader]在與[GER.GetLeader]的聯合聲明中，要求我們將剛果交給他們代表的兩個國家。我們應該在這個問題上與他們鬥爭，還是應該直接交出剛果？"
 wuw_GER_weltpolitik.5.a: "遺憾的是，對此我們無能為力"
 wuw_GER_weltpolitik.5.b: "我們不能接受"
 wuw_GER_weltpolitik.6.t: "[FROM.GetLeader]拒絕了協議"
 wuw_GER_weltpolitik.6.desc: "[FROM.GetLeader]表示，[FROM.GetLeader.GetSheHe]作為[FROM.GetNameDef]的勇敢公民的代表，[FROM.GetLeader.GetSheHe]不會支持我們將剛果瓜分的荒謬想法，這是一個與我們雙方都無關的國家。看來這是最後的決定了。"
 wuw_GER_weltpolitik.6.a: "那樣的話，就全是我們的了！"
 wuw_GER_weltpolitik.6.b: "我們不應該再推動這項議題"
 wuw_GER_weltpolitik.7.t: "[BEL.GetNameDefCap]計劃放棄我們的自由"
 wuw_GER_weltpolitik.7.desc: "[BEL.GetNameDef]的[BEL.GetLeader]向[GER.GetAdjective]和[ENG.GetAdjective]的聯合要求屈服，決定簽署協議將我們的國家瓜分給他們，這將有效地結束我們目前可能擁有的任何形式的獨立。我們真的應該就這樣接受這種命運嗎？"
 wuw_GER_weltpolitik.7.a: "我們無法對此進行抗爭……"
 wuw_GER_weltpolitik.7.b: "我們不能接受，拿起武器！"
 wuw_GER_weltpolitik.8.t: "[BEL.GetNameDefCap]將放棄剛果"
 wuw_GER_weltpolitik.8.desc: "[BEL.GetNameDef]的[BEL.GetLeader]屈服於我們的要求，表示將立即簽署文件，把剛果移交給我們。目前尚不確定剛果的民眾和總督是否會接受，但至少[BEl.GetAdjective]已經屈服。"
 wuw_GER_weltpolitik.8.a: "完美"
 wuw_GER_weltpolitik.9.t: "[BEL.GetNameDefCap]拒絕放棄剛果"
 wuw_GER_weltpolitik.9.desc: "[BEL.GetNameDef]的[BEL.GetLeader]決定在我們的要求面前堅定立場，表示[BEL.GetAdjective]軍隊不會在面對反對時退縮，並將為剛果戰鬥到最後一人。他們不知道他們在與誰作對。"
 wuw_GER_weltpolitik.9.a: "那他們將被摧毀"
 wuw_GER_weltpolitik.9.b: "那就沒必要推動了"
 wuw_GER_weltpolitik.10.t: "剛果危機"
 wuw_GER_weltpolitik.10.desc: "條約已經正式簽署，土地將被移交。然而，剛果內部存在抵抗，我們必須處理……"
 wuw_GER_weltpolitik.10.a: "我們將用武力奪取它"
 wuw_GER_weltpolitik.10.b: "今天是個好日子"
 wuw_GER_weltpolitik.11.t: "剛果危機"
 wuw_GER_weltpolitik.11.desc: "我們在剛果的總督向我們報告，他們不會接受我們為他們選擇的命運，並將在[COG.GetAdjective]自治問題上堅定立場。我們必須鎮壓他們的抵抗，否則他們將成為我國的垮臺因素，特別是[ENG.GetNameDef]和[GER.GetNameDef]會因此認為這是我們自身的抵抗行為。"
 wuw_GER_weltpolitik.11.a: "為了我們人民的安全，我們必須消滅他們！"
 wuw_GER_chinese_diplomacy.5.t: "中德聯合研究項目"
 wuw_GER_chinese_diplomacy.5.desc: "我們西方的偉大盟友[FROM.GetAdjective]派來了一個代表團，要求我們在新技術開發上進行合作，並把他們的新計劃稱為“中德聯合研究計劃”。我們應該加入他們嗎？"
 wuw_GER_chinese_diplomacy.5.a: "很好的倡議！"
 wuw_GER_chinese_diplomacy.5.b: "我們認為這對我們沒有幫助"
 wuw_GER_chinese_diplomacy.6.t: "[FROM.GetNameDefCap]同意合作"
 wuw_GER_chinese_diplomacy.6.desc: "[FROM.GetNameDef]的[FROM.GetLeader]決定同意我們的提議，並且表示對我們的中德聯合研究項目非常感興趣。現在，讓工作開始吧！"
 wuw_GER_chinese_diplomacy.6.a: "太棒了"
 wuw_GER_chinese_diplomacy.7.t: "[FROM.GetNameDefCap]拒絕合作"
 wuw_GER_chinese_diplomacy.7.desc: "[FROM.GetNameDef]的[FROM.GetLeader]決定拒絕我們的提議，宣稱他們可以獨立發展，不需要西方的科技。事情就是這樣……"
 wuw_GER_chinese_diplomacy.7.a: "他們沒有意識到自己錯過了什麼"
 wuw_GER_weltpolitik.12.t: "[FROM.GetName]要求歸還前殖民地"
 wuw_GER_weltpolitik.12.desc: "\n[FROM.GetLeader]的[FROM.GetNameDef]向我們提出了一個有趣的請求。他們要求我們歸還曾經的[FROM.GetAdjective]殖民地，以換取加深兩國關係，並承諾在全球範圍內正式支持我們政府。這似乎有些單方面，但也許這是最好的選擇？"
 wuw_GER_weltpolitik.12.a: "為了我們的朋友，什麼都行"
 wuw_GER_weltpolitik.12.b: "不，它們現在屬於我們了"
 wuw_GER_weltpolitik.13.t: "[FROM.GetNameDefCap]歸還我們的殖民地"
 wuw_GER_weltpolitik.13.desc: "\n[FROM.GetLeader]的[FROM.GetNameDef]接受了我們歸還前殖民地的請求，稱它們在我們手中會更好。人們在街頭慶祝，因為[ROOT.GetAdjective]殖民帝國似乎終於重回版圖。"
 wuw_GER_weltpolitik.13.a: "帝國主義又回到菜單上了！"
 wuw_GER_weltpolitik.14.t: "[FROM.GetNameDefCap]不歸還我們的殖民地"
 wuw_GER_weltpolitik.14.desc: "\n[FROM.GetLeader]的[FROM.GetNameDef]拒絕了我們歸還舊殖民地的請求，稱這是一個單方面的交易，他們幾乎沒有任何收益。"
 wuw_GER_weltpolitik.14.a: "本不應如此……"
 wuw_GER_weltpolitik.15.t: "[FROM.GetNameDefCap]簽署文件移交土地給[GER.GetNameDefCap]"
 wuw_GER_weltpolitik.15.desc: "\n[FROM.GetLeader]的[FROM.GetNameDef]出人意料地決定將所有曾經的[GER.GetAdjective]殖民地歸還給他們，包括我們持有的那些。遺憾的是，我們無法阻止這種新行為，但至少我們可以要求他們給予某種形式的補償。"
 wuw_GER_weltpolitik.15.a: "我們要求某種形式的補償！"
