 wtt_border_conflict_won_attacker.1.t: "[their_state.GetName]大捷"
 wtt_border_conflict_won_attacker.1.desc: "日前在[our_state.GetName]和[their_state.GetName]交界地區發生的衝突最終以我軍完勝[their_country.GetLeader]軍隊而告捷。[their_country.GetAdjective]軍隊現已被擊退，而我方則順勢攻佔了此爭議地區。"
 wtt_border_conflict_won_attacker.1.a: "我們展現了自身的實力！"
 wtt_border_conflict_won_defender.1.t: "[their_state.GetName]大捷"
 wtt_border_conflict_won_defender.1.desc: "日前在[our_state.GetName]和[their_state.GetName]交界地區發生的衝突最終以我軍完勝[their_country.GetLeader]軍隊而告捷。[their_country.GetAdjective]軍隊現已被擊退，我方依舊保持著對此爭議地區的控制。"
 wtt_border_conflict_won_defender.1.a: "我們展現了自身的實力！"
 wtt_border_conflict_lost_attacker.1.t: "[our_state.GetName]兵敗"
 wtt_border_conflict_lost_attacker.1.desc: "日前[their_country.GetLeader]麾下的軍隊在[our_state.GetName]和[their_state.GetName]的爭議地區擊退了我軍。所幸我軍轉進途中秩序井然，正在重整以備未來的再戰。"
 wtt_border_conflict_lost_attacker.1.a: "我們必須儘快反擊！"
 wtt_border_conflict_lost_defender.1.t: "[our_state.GetName]兵敗"
 wtt_border_conflict_lost_defender.1.desc: "日前[their_country.GetLeader]麾下的軍隊從[our_state.GetName]和[their_state.GetName]的爭議地區擊退了我軍。所幸我軍轉進途中秩序井然，正在重整以備未來的再戰。"
 wtt_border_conflict_lost_defender.1.a: "我們必須儘快反擊！"
 wtt_border_conflict_canceled_attacker.1.t: "[their_state.GetName]困局"
 wtt_border_conflict_canceled_attacker.1.desc: "由於雙方均無力擊退對方，日前在[our_state.GetName]和[their_state.GetName]交界地區的交火已陷入了僵局，敵我兩軍均未取得任何較大進展。偵察兵報告稱[their_country.GetAdjective]的士兵正在其戰線一側構築防禦工事，看起來相比於進攻，他們更希望維持現狀。"
 wtt_border_conflict_canceled_attacker.1.a: "我們還會殺回來的。"
 wtt_border_conflict_canceled_defender.1.t: "[their_state.GetName]困局"
 wtt_border_conflict_canceled_defender.1.desc: "由於雙方均無力擊退對方，日前在[our_state.GetName]和[their_state.GetName]交界地區的戰鬥已經陷入了僵局，敵我兩軍均未取得任何較大進展。偵察兵報告稱[their_country.GetAdjective]的士兵正在其戰線一側構築防禦工事，看起來相比於進攻，他們更希望維持現狀。"
 wtt_border_conflict_canceled_defender.1.a: "我們還會殺回去的。"
 wtt_border_incident_defender_warning.1.t: "[From.GetNameDefCap]進犯我方邊境"
 wtt_border_incident_defender_warning.1.desc: "昨日早些時候，我們發現[their_country.GetAdjective]的士兵正自[attacker_state.GetName]出擊越境侵入[defender_state.GetName]。而在當日晚間，更多的[their_country.GetAdjective]部隊業已開抵此地區，並在我方領土內構築防禦陣地。\n\n在此之後，[their_country.GetLeader]麾下的軍隊與我方在整條邊境線上爆發了一系列的邊境衝突以及交火。\n\n至此，形勢已然十分明顯，[their_country.GetAdjective]軍隊進犯我方疆界且拒不撤退。我們必須儘快組織力量進行反擊，阻止其進一步的侵略。"
 wtt_border_incident_defender_warning.1.a: "全軍立即動員！"
 wtt_border_conflict_escalate_to_war.1.t: "[From.GetNameDefCap]備戰動員"
 wtt_border_conflict_escalate_to_war.1.desc: "偵察兵報告稱，[From.GetAdjective]的軍隊目前正在其[their_state.GetName]地區集結，意欲採取大規模軍事行動進犯我[our_state.GetName]疆界。根據[From.GetLeader]調配的物資判斷，其意圖似在擴大局勢，這已不再是一場侷限於爭議邊境的邊界衝突了。\n\n全面戰爭已迫在眉睫。"
 wtt_border_conflict_escalate_to_war.1.a: "做好狹路相逢的準備！"
