l_simp_chinese:
 poland.13.t: "[From.GetNameDefCap]尋求與[faction_invitee_target.GetAdjective]合作"
 poland.13.d: "[From.GetLeader]請求[Root.GetAdjective]政府向[Root.GetFactionName]發出邀請，理由是在發生入侵時，與[faction_invitee_target.GetAdjective]結盟會帶來可觀的戰略優勢。"
 poland.13.a: "[faction_invitee_target.GetNameDefCap]當然是我們的朋友！"
 poland.13.b: "我們不能信任[faction_invitee_target.GetLeader]。"
 poland.1301.t: "[From.From.GetNameDefCap]尋求合作"
 poland.1301.d: "已經是[From.GetFactionName]成員的[From.From.GetLeader]尋求與[Root.GetNameDef]的軍事合作，理由是在[GER.GetAdjective]或[SOV.GetAdjective]入侵時，[From.From.GetAdjective]與[Root.GetAdjective]結盟會帶來可觀的戰略優勢。"
 poland.1301.a: "當然！"
 poland.1301.b: "我們對所謂的“[From.GetFactionName]”不感興趣。"
 poland.1302.t: "[From.GetNameDefCap]拒絕加入[faction_invitee_target.GetAdjective]"
 poland.1302.d: "和[Root.GetLeader]所預想的不同，[From.GetLeader]並不認為有加入[faction_invitee_target.GetAdjective]的必要。我們尚未查明這一決定的確切理由，但[From.GetAdjective]政府顯然認定[faction_invitee_target.GetNameDef]對[From.GetFactionName]的國家利益來說弊大於利。"
 poland.1302.a: "試試看總是好的。"
 poland.1303.t: "[From.GetNameDefCap]拒絕！"
 poland.1303.d: "出於某種原因，[From.GetAdjective]政府決定不與我國共同站在[From.From.GetFactionName]一方為自由而戰。無論他們理由看起來有多麼正當，[Root.GetAdjective]與[From.GetAdjective]已經不太可能繼續長久合作下去了。"
 poland.1303.a: "真是遺憾。"
 poland.15.t: "[From.GetNameDefCap]要求合併[Root.GetAdjective]！"
 poland.15.d: "今天，一紙令人擔憂的電文送到了[Root.GetLeader]的辦公桌上。這封電文發自[From.GetAdjective]總統，他在電文中不僅要求[LIT.GetNameDef]放棄對其原首都維爾紐斯的宣稱，還要求其解除武裝，將全部領土移交給[From.GetAdjective]。自[Root.GetNameDef]政權之始，[From.GetNameDefCap]就致力於恢復早已不復存在的波蘭-立陶宛聯邦，而如今他們又認為，只要威脅與[Root.GetLeader]再打一仗，就能讓它屈服。"
 poland.15.d.notlit: "今天，一紙令人擔憂的電文送到了[Root.GetLeader]的辦公桌上。這封電文發自[From.GetAdjective]總統，他在電文中要求[Root.GetNameDef]解除武裝，將全部領土移交給[From.GetAdjective]。自[Root.GetNameDef]政權之始，[From.GetNameDefCap]就致力於恢復早已不復存在的波蘭-立陶宛聯邦，而如今他們又認為，只要威脅與[Root.GetLeader]再打一仗，就能讓它屈服。"
 poland.15.a: "非常好。"
 poland.15.b: "絕對不行！"
 poland.1501.t: "[From.GetNameDefCap]同意！"
 poland.1501.d: "今天是值得[Root.GetNameDef]慶祝的好日子。[From.GetAdjective]軍隊放下了武器，允許[Root.GetAdjective]士兵開進首都，宣佈[Root.GetNameDef]與[From.GetNameDef]重新統一！聯邦重生了，在[Root.Capital.GetName]的街道上，到處都是揮舞著[Root.GetAdjective]和[From.GetAdjective]旗幟的男男女女。但[From.GetAdjective]首都卻沒有這樣的慶祝活動，人們面色凝重，似乎都一反尋常地沉浸在悲痛中。"
 poland.1501.a: "聯邦重生！"
 poland.1502.t: "[From.GetNameDefCap]反對統一！"
 poland.1502.d: "[From.GetAdjective]高層於今日做出回應，拒絕了[Root.GetAdjective]的一切要求，聲稱“不允許 [Root.GetLeader]踐踏[From.GetAdjective]主權”。雖然許多人不太願意與[From.GetNameDef]再度開戰，但如果[Root.GetLeader]不盡快回應，未來[Root.GetAdjective]發出的任何索求都將難以得到重視。"
 poland.1502.a: "[Root.GetNameDef]和[From.GetNameDef]將迎來統一！"
 poland.16.t: "[From.GetNameDefCap]邀請我們加入海間聯邦"
 poland.16.a: "當然！"
 poland.16.b: "我想不出憑什麼要和波蘭佬結盟。"
 poland.17.t: "薩納齊亞左派的勝利"
 poland.17.d: "瓦萊雷·斯瓦韋克終於又坐上了[Root.GetNameDef]政府首腦的位置。他架空了[Root.GetLeader]，而後者在政府裡只能充當顧問了。然而，很多人都不清楚斯瓦韋克真正的政治傾向。有些人覺得他是一個尋求改革的社會主義者，批評他的人則認為他是一個新的獨裁者，與[Root.GetLeader]和雷茲-希米格維這些人沒什麼不同。既然斯瓦韋克現在當上了政府首腦，那麼，當他再次修憲的時候，這些疑問自然就水落石出了。"
 poland.17.a: "維持強有力的政府。"
 poland.17.b: "實施社會改革。"
 poland.18.t: "民族團結陣營的勝利"
 poland.18.d: "愛德華·雷茲-希米格維，以及他在薩納齊亞運右派中的黨羽，一直以來都是隱藏在[Root.GetNameDef]幕後的真正操手。然而，隨著[Root.GetLeader]與民族團結陣營達成共識，雷茲-希米格維掌權的事實終於在法理上得到了確認。鑑於他與長槍黨人的密切關係，一些人擔心[Root.GetNameDef]與極右翼過於親密；而雷茲-希米格維對法西斯展現的同情態度，最終亦可能導致[Root.GetNameDef]與其盟友決裂，陷入外交孤立。"
 poland.18.a: "我們的專政會保持絕對中立。"
 poland.18.b: "邀請長槍黨人進入政府。"
 poland.19.t: "瓦萊雷·斯瓦韋克自殺身亡"
 poland.19.d: "“我將結束我的生命。勿要責備旁人。我已焚盡一切私人書信及秘密文件。如有遺漏，懇請原諒。全能的上帝或將寬恕我的罪過，寬恕我飲彈自盡的忤逆。”昨日晚間8時45分，瓦萊雷·斯瓦韋克的遺體被發現，一同還有他身邊的槍和遺書。哪怕是畢蘇斯基軍醫院最高明的醫生也無力迴天，前總統於今日清晨被宣告死亡。與遺書放在一起的，還有一份寫明只准[Root.GetLeader]過目的書信，書信內容與斯瓦韋克的自殺原因仍未明朗，各種猜測仍在[Root.Capital.GetName]的大街小巷中傳播。許多人推斷，薩納齊亞左派遭到邊緣化，以及斯瓦韋克在政壇上逐漸處於孤立，很大程度上導致了他的抑鬱。另一方面，這一影響力最廣的左翼領袖之死，無疑將使許多人頓覺前途渺茫。"
 poland.19.a: "安息吧。"
 poland.20.t: "四年計劃完成！"
 poland.20.desc.a: "過去四年間，由於吸引不到投資，許多人認定四年計劃已然完全失敗。波蘭東部的貧農仍然與世隔絕，所謂的“中央工業區”只有寥寥幾家工廠及火車站，而波蘭的工業體系已將國家陷於進退兩難。財政專家確信，從長遠來看，四年計劃的徹底失敗將使波蘭的工業發展從此一蹶不振。"
 poland.20.desc.b: "在適度投資的支持下，儘管比東西鄰國仍然落後一步，波蘭工業的未來已是一片光明。雖然產業規模並未達到[Root.GetLeader]所承諾的地步，但政府投資無疑將對下一個四年計劃大有裨益！"
 poland.20.desc.c: "鐵軌上刺耳尖嘯的火車，空氣中刺鼻燻人的煤煙，都是進步的象徵。如今，波蘭的中部地區已經打開了工業與進步的大門。工廠、公路、鐵路、火車，還有汽車，波蘭國家終於實現了這一切。全國如今遍佈公路與鐵路網，波蘭團結為統一的工業體，克維亞特科夫斯基的四年計劃至此宣告成功。儘管這並不意味著波蘭對工業投資告一段落，但該計劃的全面成功，為波蘭社會實現了長久穩定，也為人民創造了大量就業機會。無論波蘭前路還面臨多少艱難險阻，大多數人都已經做好了準備。"
 poland.20.a: "該死！"
 poland.20.b: "好極了！"
 poland.20.c: "好極了！"
 poland.20.d: "沒有團結就沒有自由！"
 poland.20.e: "好極了！"
 poland.20.f: "該死！"
 poland.21.t: "[DNZ.GetNameDef]尋求併入[Ger.GetNameDefCap]"
 poland.21.d: "當戰火燃遍[DNZ.GetNameDef]街道時，[DNZ.GetLeader]堅決抵抗[POL.GetLeader]的軍隊，然而，一座孤城顯然不足以抵禦[POL.GetNameDef]軍隊的猛攻。作為[Root.GetRulingParty]的黨員，[DNZ.GetLeader]應對[Root.GetLeader]負責，而[DNZ.GetAdjective]絕對不能戰敗。[GER.GetNameDefCap]將作為[DNZ.GetNameDef]的保護國介入戰爭。他們的出現，不僅意味著城防大大增強，同時也是奪取這座城市的千載良機……"
 poland.21.a: "但澤不能成為格但斯克！"
 poland.21.b: "我們不應介入。"
 poland.2101.t: "[From.GetNameDefCap]提議支持！"
 poland.2101.d: "德國[GER.GetRulingParty]提議支持我們對抗波蘭，以此換取[From.GetNameDef]對[Root.GetNameDef]更為直接的控制。"
 poland.2101.a: "我們別無選擇"
 poland.2101.b: "但澤就是但澤！"
 poland.2102.t: "吞併但澤"
 poland.2102.d: "事實證明，[DNZ.GetLeader]是對抗[POL.GetNameDef]的有力工具，但自治地區的行政建制已經沒有了利用價值。[DNZ.GetLeader]註定要成為但澤帝國市-西普魯士的大區長官，將該大區整合進[Root.GetNameDef]版圖之中。"
 poland.2102.a: "歡迎回歸祖國"
 poland.2102.b: "也許該給他們保留一些自治權。"
 poland.22.t: "[DNZ.GetNameDefCap]提議和談"
 poland.22.d: "戰爭已經持續了很久，即使是掀起反旗的[DNZ.GetLeader]也希望與[POL.GetNameDef]和談。鑑於連格丁尼亞都淪陷於[DNZ.GetAdjective]之手，許多人認為，繼續與自由市交戰會使風險遠超回報。我們已經無力繼續打下去了，而這座城市最終落入[GER.GetAdjective]掌控已成定局。"
 poland.22.a: "人事已盡。"
 poland.22.b: "只有我發話才能停火，給我繼續打！"
 poland.23.t: "[poland_state_withdrawn.GetName]工業遭到破壞"
 poland.23.d: "[Root.GetAdjective]的部隊已開進[poland_state_withdrawn.GetName]，他們前腳剛奪取了當地鐵路及工業設施，震耳欲聾的爆炸後腳就將這些設備轟上了天。這顯然是[POL.GetAdjective]軍隊留下的陷阱。我們預測，將來每當我軍試圖接管[POL.GetAdjective]工業設施的時候，同樣的爆炸聲只會一而再再而三的響起。"
 poland.23.a: "他們擋不了我們太久的。"
 poland.24.d: "緊張局勢在東部持續升溫。警方已在東部地區部署警力以應對抗議者，但暴力鎮壓反而給民眾的反抗又添了一把火。\n\n如果不盡早解決這場危機，我們將面臨一場內戰。農民黨領袖斯坦尼斯瓦夫·米科拉伊奇克組織了這起罷工，並組建了包括民主派、社會主義者與共產主義者在內的反對派聯盟。如果政府坐視不理，叛亂將會爆發。"
 poland.24.a: "農民造反！"
 poland.25.t: "[hosting_country_target.GetNameDefCap]要求[Root.GetLeader]辭職！"
 poland.25.d: "儘管[hosting_country_target.GetNameDef]承諾接受[Root.GetAdjective]流亡政府，但[hosting_country_target.GetLeader]要求[Root.GetLeader]立即辭去[Root.GetLeader.GetHerHis]的[Root.GetNameDef]首腦職務。在投降與逃亡的亂局之中，[Root.GetLeader]已經逃到了歐洲的一箇中立國，而[Root.GetAdjective]流亡政府餘下成員將決定，誰將繼續領導重奪祖國的鬥爭。"
 poland.25.a: "一名與薩納齊亞無關的愛國者。"
 poland.25.b: "我們需要這個波蘭軍團的老兵。"
 poland.25.c: "這是我們為波蘭重建民主的機會。"
 poland.26.t: "革命的低語"
 poland.26.d: "在[Root.GetAdjective]佔領下的波蘭，坊間革命傳聞風聲鶴唳。大街上到處張貼著“抵抗不息”的標語與類似口號，呼籲人們奮起抵抗[Root.GetAdjective]佔領。此前，抵抗活動僅限於散佈傳單、破壞生產，零星的爆炸以及蓄意破壞；但現在，抵抗運動卻出奇地沉默。叛離與懷疑的氣氛籠罩了波蘭。\n\n安插在波蘭各地的[Root.GetAdjective]特工預測，由[POL.GetAdjective]流亡政府組織的全面叛亂即將爆發。只有堅決鎮壓抵抗，[Root.GetNameDef]才有望繼續控制波蘭。"
 poland.26.a: "我們必須圍剿這些叛徒。"
