 COG_approach_the_barotse_litunga_tt: "當解放戰爭開始時，我們會獲得2§Y巴羅策師§!，以及§Y[981.GetName]§!的核心"
 COG_slander_the_colonial_authorities_tt: "§R在我們的獨立戰爭結束後，該民族精神會被移除！§!"
 COG_strike_while_the_iron_is_hot_tt: "我們的部隊將開始向利奧波德維爾進軍，正式開始獨立戰爭。如果我們控制了§Y利奧波德維爾§!、§Y伊麗莎白維爾§!和§Y斯坦利維爾§!，或者如果我們能夠徹底擊潰敵人並強迫他們屈服，我們將能夠迫使我們的前宗主國簽訂和平協議，並獲得完全獨立。\n\n同樣，如果他們控制了§Y利奧波德維爾§!、§Y伊麗莎白維爾§!和§Y斯坦利維爾§!，他們將能夠迫使我們簽訂和平協議，並保持對我們國家的控制。"
