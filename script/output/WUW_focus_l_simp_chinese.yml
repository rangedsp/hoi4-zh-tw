 ### CONGO SHARED FOCUS TREE ###
 CONGO_belgian_congo: "比屬剛果"
 CONGO_belgian_congo_desc: "該殖民地於1908年建立，當時剛果自由邦被比利時政府吞併，擺脫了比利時王室的剝削。比屬剛果仍然是比利時殖民核心政策上的寶石。"
 CONGO_expand_villages: "擴建村莊"
 CONGO_expand_villages_desc: "剛果有很大的潛力，但這隻能通過龐大而充滿活力的勞動力來實現。我們應該在要開發的地區建立新的村莊，鼓勵這種發展。"
 CONGO_free_enterprise_fund: "自由企業基金"
 CONGO_free_enterprise_fund_desc: "比利時殖民行政當局深知需要投資才能從剛果中獲取最大收益。因此，他們向小企業提供財政補助，幫助他們創業。"
 CONGO_secure_international_funding: "確保國際資金支持"
 CONGO_secure_international_funding_desc: "比利時殖民當局並不是唯一認識到剛果潛力的力量。我們應該尋找國際投資夥伴，與他們開展業務，無論是否有[BEL.GetName]的參與。"
 CONGO_secure_international_funding_tt: "解鎖決議§Y向剛果基礎設施和工業投資國際資金§!"
 CONGO_weapon_repair_workshops: "武器修復工坊"
 CONGO_weapon_repair_workshops_desc: "儘管大多數軍事生產都在比利時進行，但仍有一些小型作坊可以修理和改裝舊的軍事設備。我們應該確保他們擁有完成這些工作的資源，以備將來我們需要用到這些設備。"
 CONGO_rawji_group: "拉吉集團"
 CONGO_rawji_group_desc: "羅吉公司的生意從草創起步，逐步擴張到了剛果各地的各個行業和企業。"
 CONGO_the_heart_of_africa: "非洲之心"
 CONGO_the_heart_of_africa_desc: "剛果的廣袤領土位於非洲中部，雖然相對貧窮且欠發達，但在內陸孕藏著豐富的資源和無限的可能性。我們所要做的，就是出擊並找到它們。"
 CONGO_establish_university_of_louvain: "建立洛瓦尼姆大學"
 CONGO_establish_university_of_louvain_desc: "最初是一所醫學院，旨在研究熱帶醫學，我們如今有機遇擴張這個學府，設立農業科學系，一旦將其指定為正式大學，它肯定會成為非洲的驕傲。"
 CONGO_congo_investments: "剛果投資"
 CONGO_congo_investments_desc: "比利時中央政府非常清楚剛果的財富，因此我們可以利用這些財富，進一步復甦比利時經濟。所需要的只是一點前期投資。"
 CONGO_societe_generale_de_belgique: "比利時興業銀行"
 CONGO_societe_generale_de_belgique_desc: "這家巨型公司是比利時經濟的核心。如果我們想要發展整個國家所需的組織和財務力量，除了它之外，沒有其他更合適的合作對象來加強我們在剛果的利益。"
 CONGO_ccci: "剛果貿易與工業公司"
 CONGO_ccci_desc: "剛果貿易與工業公司是活躍在剛果的大型礦業集團。他們控制著大量的礦產資源，而我們主要希望幫助他們開發冶金資源。"
 CONGO_forminiere: "剛果國際林業與礦業公司"
 CONGO_forminiere_desc: "剛果國際林業與礦業公司是一家主要從事剛果林業和礦產開採的組織。儘管他們在林業方面的經驗很有價值，但他們在開賽地區的鑽石壟斷遠比其他資源更具盈利潛力。我們必須加強並擴大這一領域的業務！"
 CONGO_ruanda_urundi: "盧旺達-烏隆迪"
 CONGO_ruanda_urundi_desc: "它曾經是德屬東非的一部分，在世界大戰後被國際聯盟割讓給[BEL.GetName]託管。這是一個擁有棉花、咖啡和鎢等寶貴資源的地區。"
 COG_approached_ruanda_urundi_governor_flag: "與盧旺達-烏隆迪總督商談"
 CONGO_jungle_industry: "叢林工業"
 CONGO_jungle_industry_desc: "投資者通常對一片巨大的叢林的價值感到困惑，但他們只需要知道在哪裡尋找就行了。我們必須找到那種專業知識，併為他們提供工具，以解鎖那些隱藏的財富。"
 CONGO_jungle_industry_available_tt: "控制§Y大剛果盆地§!的任意§Y叢林地區§!"
 CONGO_belgian_devaluation: "比利時貨幣貶值"
 CONGO_belgian_devaluation_desc: "[BEL.GetAdjective]政府制定了貨幣貶值政策，使總督能夠降低進口關稅，提高出口關稅。這將大大改善殖民地的預算。"
 CONGO_french_congo: "法屬剛果"
 CONGO_french_congo_desc: "法國人拿走了剛果盆地的一部分，將我們的人民與我們分離。現在是消除這一歷史不公的有利時機。只能有一個剛果！"
 CONGO_force_publique: "公安軍"
 CONGO_force_publique_desc: "他們最初被設想為殖民地警察部隊，他們在那次世界大戰期間被軍事化，並在對抗德屬非洲的戰爭中獲得了很高的評價。讓我們繼續加強這支部隊，使這支殖民地武裝力量達到更現代的標準。"
 COG_force_publique_reformed_flag: "公安軍已經改組為剛果國民軍"
 COG_comitted_to_our_overlords_war_flag: "我們已經決定全力支持宗主國的戰爭"
 CONGO_symbiotic_industrialization: "共生性工業化"
 CONGO_symbiotic_industrialization_desc: "兩者相輔相成，隨著比利時工業的發展，對資源的需求也隨之增加。我們可以從剛果進口這些資源，推動更快速的工業化，因此需要更多的資源。兩者的繁榮緊密相連。"
 CONGO_prince_leopold_mine: "利奧波德親王礦場"
 CONGO_prince_leopold_mine_desc: "幾個世紀以來人們一直在基普希地區開採銅礦，雖然我們在這裡已經工作了一段時間，但隨著全球緊張局勢的加劇，銅的潛在價值預計會增加。讓我們為即將到來的需求做好準備。"
 CONGO_bakwanga_mine: "巴寬加礦井"
 CONGO_bakwanga_mine_desc: "人們發現巴寬加地區鑽石礦藏特別豐富。雖然這些鑽石的個頭不像南非和印度發現的那樣大，但對於這種世界上最堅硬的礦物，此處的礦藏規模尤為巨大，而且可以用於各種工業用途。"
 CONGO_expand_tungsten_mines: "擴建鎢礦"
 CONGO_expand_tungsten_mines_desc: "隨著對鎢芯彈藥需求的不斷增加，我們必須確保擁有自己的鎢資源。幸運的是，我們在盧旺達-烏隆迪的託管領土中發現了這種重要的金屬。"
 CONGO_rubber_plantations: "橡膠種植園"
 CONGO_rubber_plantations_desc: "比利時在剛果的橡膠開採歷史極為糟糕。儘管如此，我們仍需在國際社會的密切監督下發展橡膠生產。"
 CONGO_interfaith_school_subsidies: "跨宗教學校津貼"
 CONGO_interfaith_school_subsidies_desc: "全國已有許多天主教傳教學校，但如果我們真想以低成本提高人口的教育水平，就需要鼓勵更多的組織進入我們的這項事業。"
 CONGO_colonial_ambitions: "殖民野心"
 CONGO_colonial_ambitions_desc: "剛果是塊令人印象深刻的領土，但這片大陸很大。我們應該向其他殖民國家表明，對非洲的爭奪還沒有真正結束。"
 CONGO_congo_army: "剛果軍隊"
 CONGO_congo_army_desc: "越來越明顯的是，有境外勢力對剛果感興趣。因此，我們應加大對軍事的投資，使剛果能夠更有效地自衛，或許還能幫助[BEL.GetName]在海外擴張影響力。"
 CONGO_modernize_force_publique: "公安軍現代化"
 CONGO_modernize_force_publique_desc: "儘管公安軍表現出色，但毫無疑問它急需現代化。現在似乎是投入資金實現這一目標的最佳時機。"
 CONGO_cheap_labor: "廉價勞動力"
 CONGO_cheap_labor_desc: "有許多勞動操縱技術可以用來最大限度地利用勞動力，例如，確保有儘可能少的勞動保護，使被解僱的風險始終存在，並確保他們仍然依賴公司維持生計。"
 CONGO_societe_miniere_de_bakwanga: "巴寬加礦業公司"
 CONGO_societe_miniere_de_bakwanga_desc: "儘管鑽石的利潤由很大一部分來自珠寶市場，但在這個工業佔主導地位的時代，這種硬質材料出現了許多新用途，例如鋸片和鑽頭。"
 CONGO_kasai_secessionist_state: "開賽分離主義地區"
 CONGO_kasai_secessionist_state_desc: "開賽地區受[BEL.GetAdjective]軍隊的控制一直較為鬆散，如果有正確的人脈，我們就可以在剛果追求獨立時取得一個據點。"
 CONGO_regional_specialization: "區域專業化"
 CONGO_regional_specialization_desc: "剛果是一個大國，包含各種地理環境，跨越了許多不同的生物群落。我們應該確保將合適的資源、專業知識和工具送往最能利用它們的地區。"
 CONGO_expanded_rubber_plantations: "擴建橡膠種植園"
 CONGO_expanded_rubber_plantations_desc: "橡膠需求變得如此巨大，現在大規模擴建種植園在財政上變得可行。我們可以建立專門的農場，並進口現代化設備來真正推動生產。"
 CONGO_separate_corporations_from_politics: "政企分離"
 CONGO_separate_corporations_from_politics_desc: "從剛果自由邦時期開始，剛果一直由大公司掌控。因此，企業利益已經滲入政治層面。我們必須採取行動，將這些集團從權力的韁繩上剝離。"
 CONGO_belgian_officer_corps: "比利時軍官團"
 CONGO_belgian_officer_corps_desc: "目前公安軍由比利時軍官團領導，但隨著公安軍規模的擴大，軍官團並未相應增長。我們應請求派遣額外的[BEL.GetAdjective]軍官，以確保所有這些新兵都得到正規的領導。"
 CONGO_appoint_van_overstraeten: "任命範奧弗斯特拉滕"
 CONGO_appoint_van_overstraeten_desc: "拉烏爾·範奧弗斯特拉滕可能是[BEL.GetAdjective]軍隊中最有能力的人之一——問題是他自己也知道這一點。他的個性使他在國內不受歡迎，但他在那次世界大戰期間曾在剛果服役。我們可以利用這種懷舊情緒，將這位最有才華的軍官召回。"
 CONGO_fuel_for_belgium: "比利時燃料"
 CONGO_fuel_for_belgium_desc: "我們在剛果擴大資源開採的努力取得了如此成功，以至於[BEL.GetAdjective]公司毫不掩飾地利用這些廉價材料為其在比利時的工廠提供燃料，並在此過程中賺取了豐厚的利潤。"
 CONGO_antwerp_diamond_district: "安特衛普鑽石區"
 CONGO_antwerp_diamond_district_desc: "成為主要鑽石生產國附帶產生的結果是，安特衛普成為這種礦物的主要分銷和銷售中心，這反過來又為我們提供了非常可觀的收入來源。"
 CONGO_shinkolobwe_mine: "欣科洛布韋礦井"
 CONGO_shinkolobwe_mine_desc: "欣科洛布韋礦場是世界上為數不多的高品位鈾礦之一。不幸的是，該礦場的下層被嚴重淹沒，導致礦井關閉。重新開放並恢復生產將需要大量投資和努力。"
 CONGO_chefs_coutumiers: "傳統首領"
 CONGO_chefs_coutumiers_desc: "酋長委員會是[BEL.GetAdjective]政府委託管理地方事務的一類部落首領。隨著近期對該地區投資的增加，我們必須確保我們的部落盟友在繼續這一重要角色時得到適當的激勵和支持。"
 COG_evolue_in_politics: "§Y先進階級§!已進入§Y[COG.GetAdjective]§!政壇"
 CONGO_chefs_coutumiers_tt: "§Y先進階級§!將開始形成中產階級。"
 CONGO_humanitarian_aid: "人道主義援助"
 CONGO_humanitarian_aid_desc: "剛果有許多地區處於貧困和飢餓之中。我們與人道主義組織有些接觸，因此應該允許它們進入，因此應允許它們進入以幫助減輕苦難。"
 CONGO_purchasing_commission: "採購委員會"
 CONGO_purchasing_commission_desc: "隨著剛果越來越依賴現代設備和硬件，顯然我們需要設立一個部門來處理這些物資的進口。"
 CONGO_expand_force_publique_recruitment: "公安軍擴大招募"
 CONGO_expand_force_publique_recruitment_desc: "對公安軍的需求不斷增加，因此對新兵的需求也在不斷增加。我們應提供更大的激勵措施，以鼓勵當地人口報名參軍。"
 CONGO_jungle_fighting: "叢林作戰"
 CONGO_jungle_fighting_desc: "剛果大部分地區被看似無法穿越的叢林覆蓋，但當地人卻在其中生存和繁榮。我們應招募這些人作為嚮導和教官，以使我們的武裝力量在這種地形中更好地部署。"
 CONGO_jungle_figthing_random_generals_tt: "§Y兩名§!隨機選擇的陸軍將領會獲得§Y叢林之鼠§!"
 CONGO_requisition_funds: "徵用資金"
 CONGO_requisition_funds_desc: "雖然這可能不是最受歡迎的舉措，但剛果仍有未開發的財富，等待著那些知道如何開採的人去發掘。"
 CONGO_gold_and_diamonds: "黃金和鑽石"
 CONGO_gold_and_diamonds_desc: "我們相當幸運地控制著大量的黃金和鑽石供應。我們應利用這些資源購買所需的物資、專業知識和工具，並將它們輸送到最需要的地方。"
 CONGO_uranium_development_trust: "鈾礦開發托拉斯"
 CONGO_uranium_development_trust_desc: "隨著鈾對許多利益相關方變得越來越重要，我們應該與國際夥伴合作，支持創建鈾礦開發托拉斯。該機構將負責鈾資源的適當開發和分配。"
 CONGO_smuggle_uranium: "走私鈾礦"
 CONGO_smuggle_uranium_desc: "我們擁有許多非常珍貴的資源，很多人非常渴望得到，但我們不能總是自由提供。我們應聯繫一些秘密渠道，看看能在暗中達成什麼交易。"
 CONGO_develop_infrastructure: "發展基礎設施"
 CONGO_develop_infrastructure_desc: "長期以來，我們都面臨著這樣一個現實：剛果的面積實在太大，地形也過於難以穿越，無法建立良好的基礎設施和交通網絡。不過，這並不意味著我們不應該嘗試。"
 CONGO_new_vegetable_produce_markets: "新蔬菜生產市場"
 CONGO_new_vegetable_produce_markets_desc: "儘管剛果經濟的重點大多放在礦產開採和經濟作物上，但我們仍然擁有強大而健康的農業部門。隨著全球糧食短缺問題的日益嚴重，人們對簡單食品的需求達到了前所未有的高度。"
 CONGO_congolese_generals: "剛果將軍"
 CONGO_congolese_generals_desc: "公安軍的發展已經到了無法完全依賴殖民地引進軍官來領導的地步。非洲人完全有能力自己領導，因此我們應該取消限制他們的排他性政策，允許有才華的當地人進入軍官行列。"
 CONGO_even_a_hospital_can_do_better: "即便是醫院也能做得更好"
 CONGO_even_a_hospital_can_do_better_desc: "一些小型剛果部隊一直在世界各地的各種戰場上服役。特別是醫療兵團的努力已經成為傳奇，即便在前線面對壓倒性的不利局面；甚至有一位當地指揮官訓斥他的部隊說，“甚至醫院都能做得更好！”。"
 CONGO_expand_metallurgical_industry: "發展冶金產業"
 CONGO_expand_metallurgical_industry_desc: "比利時長期以來以其出色的冶金工業聞名，然而，它並不總是擁有充足的原材料來實現繁榮。現在有了從剛果進口的資源，他們有了繁榮起來的辦法。"
 CONGO_smuggle_diamonds: "走私鑽石"
 CONGO_smuggle_diamonds_desc: "鑽石是一種非常有價值且幾乎無法追蹤的貨幣，因此在某些圈子中非常受歡迎。我們應該把自己的一些人投入到這個地下運動中，並從中獲得回報。"
 CONGO_smuggle_diamonds_tt: "解鎖決議，降低我們的§Y自治度§!以換取§Y政治點數§!"
 CONGO_office_des_transports_coloniaux: "殖民地運輸辦公室"
 CONGO_office_des_transports_coloniaux_desc: "負責殖民地運輸和物流的部門長期以來一直處於崩潰的邊緣，它被巨大距離和惡劣地形所困擾。讓我們把急需的資金轉移給他們，讓剛果成為一個聯繫更加緊密的地方。"
 CONGO_improved_employment_contracts: "改善僱傭合同"
 CONGO_improved_employment_contracts_desc: "對原材料的需求已達到如此高的水平，以至於我們無法像過去那樣操縱勞動力市場。礦工們本身已成為寶貴的資源，他們自己也知道這一點。為了確保他們持續的生產力，我們需要為他們提供更好的就業前景。"
 CONGO_compagnie_belge_maritime_du_congo: "剛果比利時海運公司"
 CONGO_compagnie_belge_maritime_du_congo_desc: "剛果比利時海運公司負責剛果和[BEL.GetNameDef]之間的物資運輸。我們應提供補貼，以確保維持這些重要貿易渠道的暢通。"
 CONGO_heat_resistant_cobalt: "耐熱鈷"
 CONGO_heat_resistant_cobalt_desc: "我們長期以來一直在剛果開採鈷，然而，這裡發現的材料具有特別高的熱耐受性，對於新型噴氣發動機的開發至關重要。"
 CONGO_copper_cartridges: "銅製彈殼"
 CONGO_copper_cartridges_desc: "彈殼——沒有它們，現代戰爭就無法進行，而碰巧的是，銅是製作彈殼的最佳材料。銅耐腐蝕且柔軟，易於加工。多麼幸運，我們正坐擁一座真正的銅山！"
 CONGO_research_grants: "研究補助"
 CONGO_research_grants_desc: "剛果不僅資源豐富，還擁有豐富的智力資源。這種最寶貴的資源尚未得到充分利用。我們應提供研究補助，以鼓勵智力產業的發展。"
 CONGO_congos_place_in_the_world: "剛果在世界上的地位"
 CONGO_congos_place_in_the_world_desc: "到目前為止，這條道路充滿了曲折，但現在是剛果在世界上佔據一席之地的時候了。過去對我們的未來將有多大影響？現在是決定的時候了。"
 CONGO_legacy_of_lake_tanganyika: "坦噶尼喀湖的遺產"
 CONGO_legacy_of_lake_tanganyika_desc: "公安軍在那次世界大戰期間的一項最令人驚歎的壯舉是將一些艦船拆卸後，穿過叢林，再重新部署到位於非洲心臟地帶的湖泊上，然後擊敗駐紮在那裡的德國艦船。"
 CONGO_soviet_interest: "蘇聯利益"
 CONGO_soviet_interest_desc: "有許多競爭大國都在爭奪剛果的影響力，尤其是[SOV.GetNameDef]。我們至少應該聽聽他們提供什麼條件！"
 CONGO_whispers_of_independence: "獨立的低語"
 CONGO_whispers_of_independence_desc: "我們已經聽說過他們很久了。那些不滿者的低語，那空氣中隱約的反叛氣息，對未來不同的期盼。對不同未來的興奮低沉的嗡嗡聲。我們應該傾聽，看看這種不滿的暗流將引向何處。"
 CONGO_congo_free_state: "剛果自由邦"
 CONGO_congo_free_state_desc: "殖民政府在阻止任何自由夢想方面非常有效，以至於剛果的未來幾乎已經確定——未來再次在布魯塞爾的絕對統治下被粉碎。"
 CONGO_overseas_department_of_belgium: "比利時海外省"
 CONGO_overseas_department_of_belgium_desc: "模範殖民地實驗成熟得比預期更好。剛果已經成為效率和進步的典範，因此獲得了更正式的稱號。"
 CONGO_dominion_of_congo: "剛果自治領"
 CONGO_dominion_of_congo_desc: "作為模範殖民地的地位得到了很好的體現，剛果通過與[BEL.GetName]共同經歷艱難困苦，已經日趨成熟。因此，已經達到了某種程度的平等。"
 CONGO_republic_of_congo: "剛果共和國"
 CONGO_republic_of_congo_desc: "自由的濃烈氣息瀰漫在新共和國的空氣中。不論未來是與比利時並肩而立，還是反對前殖民宗主，只有一件事是確定的。這個未來要由剛果自己來決定。"
 CONGO_african_union: "非洲聯盟"
 CONGO_african_union_desc: "泛非主義的思想已經在整個大陸激增，許多自由的非洲人民希望團結在共同的事業下。我們應該推動這一進程，並建立一個能夠使我們所有國家更緊密地聯繫在一起的組織。"
 CONGO_great_war_of_africa: "非洲大戰"
 CONGO_great_war_of_africa_desc: "團結在同一面旗幟之下的時刻已經降臨大剛果盆地的各族人民。我們必須突破歐洲列強恣意劃定的疆界，收復原本屬於我們的一切。"
 CONGO_aviation_militaire_de_la_force_publique: "公安軍航空隊"
 CONGO_aviation_militaire_de_la_force_publique_desc: "毫無疑問，剛果的廣袤面積使得軍事和治安任務極具挑戰。然而，有一種交通工具可以輕鬆克服這些距離：飛機。我們應該在這方面進行投資，並確保我們保持對天空的控制。"
 CONGO_expand_matadi_seaport: "擴建馬塔迪海港"
 CONGO_expand_matadi_seaport_desc: "馬塔迪是為利奧波德維爾服務的主要海港，通過眾多河流通向大陸內陸。我們應該根據其日益增長的重要性擴展這個地點的海運設施。"
 CONGO_expand_ndolo_and_elisabethville_airports: "擴建恩多洛和伊麗莎白維爾機場"
 CONGO_expand_ndolo_and_elisabethville_airports_desc: "剛果作為非洲心臟的一個優勢在於，它有潛力成為穿越非洲廣大區域的主要航空運輸樞紐。"
 CONGO_establish_cometro: "成立科梅特羅"
 CONGO_establish_cometro_desc: "公安軍在確保[BEL.GetAdjective]利益方面發揮了重要作用，但這不是一個按照歐洲武裝部隊嚴格標準設置的專業軍事機構。是時候讓真正的軍隊介入了。"
 COG_congolese_bussinessowners: "剛果商人"
 COG_congolese_bussinessowners_desc: "為了讓我們的社會從多年的制度性壓迫中痊癒，並邁向更加公正的社會，我們必須開始鼓勵剛果公民開辦自己的企業，希望他們能夠進入市場。"
 COG_desgregate_the_universites: "廢除大學種族隔離"
 COG_desgregate_the_universites_desc: "在我們國家有許多聰明人因大學不允許某些人接受高等教育的政策而被壓制和踐踏。我們必須立即結束這種情況，因為有許多人想要幫助我們的國家，但卻無能為力。"
 COG_shatter_the_roof: "打破天花板"
 COG_shatter_the_roof_desc: "終於到了打破長期以來懸在我們人民頭上的無形天花板的時候了，終於讓他們能夠體驗到選擇自己生活方式的自由！"
 COG_establish_the_anc: "建立剛果國民軍"
 COG_establish_the_anc_desc: "我們的要求一直很多，但直到現在才終於得到滿足。今天是我們組建一支真正的剛果軍隊的日子，這支軍隊可以對抗我們未來可能遇到的任何敵人。"
 COG_marine_nationale: "國民海軍"
 COG_marine_nationale_desc: "儘管以前我們沒有大量投資於海軍力量，但對大多數現代國家來說，海軍力量是必不可少的。唯一的問題是我們是否希望建造一支能夠進入大西洋的海軍力量，還是希望它在剛果盆地的眾多河流上更好地執行任務。"
 COG_expand_shipping_industry: "擴大航運業"
 COG_expand_shipping_industry_desc: "如果不搭乘飛機或者坐船，便難以到達我國的許多地方。另一個重要的方面是與外國的海上往來，因此我們需要擴展我們的航運業，以滿足我們國家進行現代化的需求。"
 COG_south_atlantic_navy: "南大西洋海軍"
 COG_south_atlantic_navy_desc: "如果我們希望真正保障自己的獨立，我們必須確保殖民列強永遠不再能登陸我們的海岸。"
 COG_brown_water_navy: "褐水海軍"
 COG_brown_water_navy_desc: "大海對我們來說意義不大。然而，如果我們要維護國家的安全，我們就需要對廣大的河流和湖泊進行適當的巡邏。"
 COG_coastal_defence_fleet: "發展海岸防禦艦隊"
 COG_coastal_defence_fleet_desc: "博馬和馬塔迪需要得到適當的保護。這隻能通過建造強大的艦船來實現，行動宗旨是緊貼我們的海岸執行任務。"
 COG_supply_line_disruption_tactics: "供給線破壞戰術"
 COG_supply_line_disruption_tactics_desc: "一次精準打擊，就能切斷敵人的供給線。這將由我們的潛艇部隊執行，並將成為我們未來參與的任何戰爭的關鍵作戰內容。"
 COG_command_post_matadi: "馬塔迪指揮部"
 COG_command_post_matadi_desc: "我們需要在馬塔迪建立指揮部，以便我們更好地巡邏本國的西部河流。"
 COG_command_post_albertville: "阿爾貝維爾指揮部"
 COG_command_post_albertville_desc: "我們需要在阿爾貝維爾建立一個指揮部，以便我們更好地巡邏本國的東南部河流。"
 COG_command_post_goma: "戈馬指揮部"
 COG_command_post_goma_desc: "我們需要在戈馬建立一個指揮部，以便我們更好地巡邏本國的東北部河流。"
 COG_force_arienne_congolaise: "剛果空軍"
 COG_force_arienne_congolaise_desc: "為了真正跟上敵人的步伐，我們必須重組我們的空軍分隊，並在我們新成立的軍隊中正式建立空軍分支。"
 COG_procure_foriegn_equipment: "採購外國裝備"
 COG_procure_foriegn_equipment_desc: "鑑於我們既沒有技術知識也沒有工業能力，來支持開發並生產自己的飛機，明智的做法是集中精力借用設計並從我們的盟友那裡購買飛機。"
 COG_aeronautical_research_department: "航空研究部"
 COG_aeronautical_research_department_desc: "雖然我們以前沒有在這方面投入大量資金，但不能忘記，我們不能過度依賴外國力量。無論成本如何，我們必須嘗試開發並生產自己的飛機。"
 COG_scouting_the_terrain: "地形偵察"
 COG_scouting_the_terrain_desc: "我們廣闊的叢林使人很難穿越這些地方，而更難的是，需要在敵人接近我們重要城市之前發現他們。因此，空軍將在提供空中偵察方面發揮重要作用。"
 COG_expand_production_facilities: "擴大生產設施"
 COG_expand_production_facilities_desc: "我們必須提升軍事裝備的生產能力，而要實現這一目標，唯一的途徑就是建設具備相應制造能力的新型生產設施。"
 COG_forces_terrestres: "陸軍"
 COG_forces_terrestres_desc: "任何軍隊最重要的部分是陸戰部隊，而我們的部隊還有很多需要改進的地方。我們必須進行投資，這樣它才能在面對敵人時屹立不倒。"
 COG_from_a_gendarmerie_to_a_fighting_force: "從憲兵隊到戰鬥部隊"
 COG_from_a_gendarmerie_to_a_fighting_force_desc: "該拋棄我們公安軍的過往了，是時候重組我們的軍隊，使它不再像曾經的憲兵隊，而更像一支真正的戰鬥部隊。"
 COG_academie_militaire_de_kananga: "卡南加軍事學院"
 COG_academie_militaire_de_kananga_desc: "不僅是普通士兵需要訓練，軍官和將軍也需要培訓。我們必須投資於卡南加軍事學院，以便我們的軍隊能夠為今後的任務接受更好的教育。"
 COG_standardize_military_production: "軍事生產標準化"
 COG_standardize_military_production_desc: "由於我們目前混合使用外國和自制的裝備，我們的工業無法以足夠快的速度生產必要的替換零部件。因此，我們必須努力標準化武裝部隊使用的裝備。"
 COG_societe_africaine_dexplosifs_congo: "剛果非洲炸藥公司"
 COG_societe_africaine_dexplosifs_congo_desc: "為了更好地獲取我們的武器，我們需要在境內建立一家能夠滿足我們需求的國有公司。為此，我們應該成立剛果非洲炸藥公司，以便他們能夠為我們生產彈藥，而且只能為我們生產。"
 COG_triga_i_project: "TRIGA反應堆原型項目"
 COG_triga_i_project_desc: "能源的未來在於核能，因此我們的科學家一直在努力建設非洲第一座核電站——TRIGA反應堆原型。這個項目完成後，如果我們認為有必要的話，我們應該能夠將它的電力重新用於我們的軍事。"
 COG_military_service_for_citizenship: "服役換取公民身份"
 COG_military_service_for_citizenship_desc: "在我們國家，有許多人沒有公民身份或護照。因此，我們應該效仿古羅馬，向在武裝部隊服役一段時間的人提供公民身份，這樣就有希望吸引新的潛在新兵。"
 COG_guerilla_tactics_drills: "游擊戰術訓練"
 COG_guerilla_tactics_drills_desc: "我們的地形非常適合游擊戰術。因此，我們的目標應該是訓練我們的士兵最大限度地利用這些技術，並確保我們能夠擊退任何入侵者。"
 COG_french_as_martial_language: "法語作為軍事語言"
 COG_french_as_martial_language_desc: "傳統上，公安軍使用法語作為主要軍事語言。事實證明這是一項成功的設計，我們沒有理由在短時間內更換它。"
 COG_adopt_lingala_and_swahili_as_martial_languages: "林加拉語和斯瓦希里語作為軍事語言"
 COG_adopt_lingala_and_swahili_as_martial_languages_desc: "雖然法語是公安軍的主要用語，但為了與前宗主國劃清界限，我們仍然有必要在軍隊中推廣剛果本地語言。鑑於林加拉語和斯瓦希里語是當前使用最廣泛的兩種本土語言，大多數部隊將逐步改用這兩種語言進行交流。"
 COG_31e_brigade_parachutiste: "第31空降旅"
 COG_31e_brigade_parachutiste_desc: "我們應該嘗試組建一支精銳的空降部隊，能夠迅速佔領定居點並消滅其中的敵人，還可以在國家領導人受到威脅時充當精銳衛隊。"
 COG_peacekeeping_forces: "維和部隊"
 COG_peacekeeping_forces_desc: "儘管剛果目前沒有戰爭，但世界各地戰火不斷。我們必須為更好的未來而戰，即使這意味著派遣軍隊到遙遠的地方為外國勢力而戰。"
 COG_governor_general_pierre_ryckmans: "總督皮埃爾·裡克曼斯"
 COG_governor_general_pierre_ryckmans_desc: "儘管[BEL.GetNameDef]的高官們對我們的國家有許多計劃，但他們並不是唯一有籌謀的人。皮埃爾·裡克曼斯也有自己的宏大願景，利用他的行政知識來改善國家狀況將是明智之舉。"
 COG_invest_in_urban_centers: "投資城市中心"
 COG_invest_in_urban_centers_desc: "我國幅員遼闊、人口眾多，卻資金不足。如果我們在任何地方投資，農村就會被忽視。但這不會阻止我們投資於我們的兩個最大城市，利奧波德維爾和伊麗莎白維爾。"
 COG_uplift_the_apostolic_vicar_of_leopoldville: "提拔利奧波德維爾宗座代牧"
 COG_uplift_the_apostolic_vicar_of_leopoldville_desc: "比屬剛果宗座代牧區由教皇利奧十三世於1888年建立，是我們國家主要的天主教機構。由利奧波德維爾的宗座代牧約里斯·西斯領導。如果我們希望獲得教會的支持，應使此人在政府中獲得一席之地。"
 COG_promote_marcel_maquet_to_provincial_commisioner: "提拔馬凱為省份專員"
 COG_promote_marcel_maquet_to_provincial_commisioner_desc: "馬塞爾·馬凱作為初級殖民管理員和地區專員為我們做出了傑出貢獻。因此明智得做法是，提拔他為省級專員，將他的職責擴大到更大的區域。"
 COG_cooperate_with_the_comite_special_du_katanga: "加丹加特別委員會"
 COG_cooperate_with_the_comite_special_du_katanga_desc: "前比屬剛果總督奧古斯特·蒂爾肯斯現執掌加丹加特別委員會。該準政府機構創立於1900年，肩負管理和開發加丹加省資源之重任。充分運用這一機構，實為明智之舉。"
 COG_lecho_du_katanga: "加丹加回聲"
 COG_lecho_du_katanga_desc: "《加丹加回聲》是一份由社會殖民主義創始人讓·德科斯特和編輯阿爾伯特·德科斯特在伊麗莎白維爾出版的報紙。他們共同推動歐洲人在剛果的定居，這可能是值得抓住的機會，以更快地發展我們正在成長的國家。"
 COG_strengthen_the_banque_du_congo_belge: "加強比屬剛果銀行"
 COG_strengthen_the_banque_du_congo_belge_desc: "沒有一個國家可以在沒有適當銀行的情況下高效運行，我們也不例外。為了更好地掌握國家的貨幣狀況，我們應該致力於加強比利時國有的比屬剛果銀行。"
 COG_contract_the_empain_group: "與昂潘集團簽約"
 COG_contract_the_empain_group_desc: "昂潘集團由愛德華·昂潘於1881年創立，是我們這個時代規模最大的公司之一。它負責電車、鐵路、發電、建築和採礦等業務，公司機構遍佈比利時、法國、俄羅斯、埃及和中國，並已在東比屬剛果的發展中發揮了重要作用。我們急需他們的服務！"
 COG_invest_in_geomines: "投資地質與礦業公司"
 COG_invest_in_geomines_desc: "世界上最大的錫生產商之一，比利時工程師和工業家地質與礦業公司，在我們國家東南部的大量金屬礦床的開採和利用中發揮了重要作用。如果我們現在投資他們，長期來看他們肯定能幫助我們提振經濟。"
 COG_attempt_to_centralize_the_state: "嘗試中央集權"
 COG_attempt_to_centralize_the_state_desc: "我們廣闊的國家從一箇中央位置進行控制是極其困難的，除非我們能夠發明更好的通信和運輸技術。然而，我們應該儘可能努力，使國家更好地圍繞首都集中權力。"
 COG_allow_local_autonomy: "允許地方自治"
 COG_allow_local_autonomy_desc: "鑑於無法做到真正的中央集權，我們應該努力允許地區自治，以更好地保持我們國家眾多人民的支持，儘管我們對他們沒有那麼大的控制。"
 COG_closer_cooperation_with_eugene_jungers: "加強與歐仁·容格斯的合作"
 COG_closer_cooperation_with_eugene_jungers_desc: "歐仁·容格是現任盧旺達-烏隆迪殖民地的總督。如果我們能獲得他的支持，我們可能會加強合作，並最終利用殖民地的資源為我們所用。"
 COG_found_the_congolese_national_movement: "成立剛果民族運動"
 COG_found_the_congolese_national_movement_desc: "為了讓剛果在面對種族和宗教衝突時能夠共同合作，我們必須創建一個致力於使剛果變得更美好的統一戰線組織。為此，帕特里斯·盧蒙巴建議成立剛果民族運動。"
 COG_formally_recognize_the_kimbanguist_church: "正式承認金邦古教會"
 COG_formally_recognize_the_kimbanguist_church_desc: "西蒙·金邦古，自稱為耶穌基督的特使，多年來一直是我們當局的眼中釘。然而，鑑於他的運動獲得了大量當地民眾的支持，現在或許是時候正式承認由耶穌基督的特使西蒙·金邦古創立的教會作為我們國家的合法宗教團體。"
 COG_found_the_parti_solidaire_africain: "成立非洲團結黨"
 COG_found_the_parti_solidaire_africain_desc: "泛非主義運動日益壯大，我們作為非洲最大的國家之一不能在局勢發展中落後。因此，我們必須成立非洲團結黨，旨在促進我們大陸上社會主義國家和民主國家之間的合作。"
 COG_the_intore_lion_dancers: "因托雷獅子舞者"
 COG_the_intore_lion_dancers_desc: "因托雷獅子舞者是盧旺達姆瓦米的精銳皇家衛隊，在傳統的盧旺達軍隊中通常被稱為“天選之人”。最好確保這支武裝力量在中央政府的指揮之下。"
 COG_improve_colonial_lawmaking: "改進殖民立法"
 COG_improve_colonial_lawmaking_desc: "我們的法律繁多，而且大部分都嚴重過時，仍然沿用自由邦時期的法律。最好聘請著名的殖民律師羅伯特·德·穆埃萊納爾，來協助重新制定我國的大部分過時法律。"
 COG_establish_new_sabena_air_routes: "薩貝納航空公司的新航線"
 COG_establish_new_sabena_air_routes_desc: "我國國土遼闊，薩貝納航空公司長期以來一直為我們的主要人口中心之間提供空中運輸服務。或許我們可以嘗試建立直抵偏遠地區的新航線，這樣交通和通信將變得更易於管理。"
 COG_congo_and_the_war_in_europe: "歐洲戰爭與剛果"
 COG_congo_and_the_war_in_europe_desc: "我們的宗主國正受到外國勢力的攻擊，戰爭可能最終蔓延到我們的國境。是時候準備戰鬥，並向他們表明，我們絕不會投降！"
 COG_emergency_powers_for_pierre_ryckmans: "給予殖民地總督緊急權力"
 COG_emergency_powers_for_pierre_ryckmans_desc: "自從與比利時政府的通信中斷以來，我們的行政管理完全停滯。因此，我們必須緊急授權裡克曼斯和弗萊斯豪埃爾，以使我們的法令更具權威。"
 COG_an_independent_colonial_cabinet: "殖民地獨立內閣"
 COG_an_independent_colonial_cabinet_desc: "為了妥善管理這個國家，我們必須建立臨時內閣，在利奧波德維爾建立我們自己的議會。與此同時，弗萊斯豪埃爾將對我們的各個盟友進行國事訪問，希望與他們達成有利的貿易協議。"
 COG_acquire_american_investments: "吸引美國投資"
 COG_acquire_american_investments_desc: "我國位於非洲的中心位置，同時又靠近美洲大陸，因此，對於利用我國的廣闊領土作為物資和武器運輸的樞紐，美國人非常感興趣。我們應該利用這一優勢，嘗試吸引美國投資者。"
 COG_make_use_of_the_british_proposal: "利用英國的提議"
 COG_make_use_of_the_british_proposal_desc: "鑑於比利時政府的軟弱，英國人提出他們將允許一個獨立的剛果國家成為他們聯盟的一部分，前提是我們允許他們擁有幾個礦山和橡膠種植園的權利。這是一個明智的提議，我們應該接受！"
 COG_prepare_for_offensive_action: "做好進攻準備"
 COG_prepare_for_offensive_action_desc: "國內的政治家對我們在這場戰爭中的角色猶豫不決，但我們必須牢記，我們擁有拯救那些人的能力，並且我們有能力以英勇的行動在這場戰爭中贏得我們的獨立。每個人都到前線去！"
 COG_utilize_sabena_for_military_purposes: "薩貝納航空用於軍事"
 COG_utilize_sabena_for_military_purposes_desc: "薩貝納航空公司以前僅用於民用運輸。然而，隨著戰爭逼近我們的後院，我們必須利用它們來訓練飛行員，並改裝這家公司的飛機以便用於空戰。"
 COG_raf_and_saaf_cooperation: "英國皇家空軍與南非空軍合作"
 COG_raf_and_saaf_cooperation_desc: "我國的許多飛行員已經離開我軍，加入英國皇家空軍。儘管我們不願與英聯邦進一步合作，但學習他們的專業知識和戰場經驗將對我們大有幫助。"
 COG_enter_the_sterling_area: "加入英鎊區"
 COG_enter_the_sterling_area_desc: "為了在宗主國被外國佔領時能夠維持獨立，英國人要求我們必須加入英鎊區，向他們支付補貼，並遵循他們的殖民地市場定價。這對我們的經濟不會有好處，但這是我們必須付出的代價。"
 COG_safeguard_cabinda: "保護葡屬剛果"
 COG_safeguard_cabinda_desc: "卡賓達省曾是剛果王國的一部分；隨著戰爭在全球範圍內肆虐，現在是時候介入並保護我們的無辜同胞免受進一步的傷害。目前的佔領者可能不喜歡這一舉動，但這對保護非洲的未來是必要的。"
 COG_central_bank_of_congo_ruanda_urundi: "剛果及盧旺達-烏隆迪中央銀行"
 COG_central_bank_of_congo_ruanda_urundi_desc: "是時候建立我們自己的銀行了，一家不受外國勢力控制或位於海外的銀行！"
 COG_national_committee_for_liberation: "民族解放委員會"
 COG_national_committee_for_liberation_desc: "剛果民族運動中的軟弱中間派似乎滿足於妥協，接受可能永遠不會到來的獨立，部分同意耶夫·範比爾森的三十年解放比屬非洲計劃。我們必須在殖民當局有機會撲滅我們的火焰之前，向他們發動攻擊！"
 COG_alliance_de_bakongo: "巴剛果聯盟"
 COG_alliance_de_bakongo_desc: "巴剛果聯盟由偉大的思想家約瑟夫·卡薩武布領導，他必將成為獨立剛果的指路明燈。我們應該確保巴剛果聯盟能夠在不受政府幹預的情況下開展活動。"
 COG_progressive_congolese_students: "進步的剛果學生"
 COG_progressive_congolese_students_desc: "鑑於我國許多人開始相信社會主義言論，明智的做法是，建立青年組織、傳播並進一步發展這些思想。青年是未來，因此他們必須接受必要的教育，以便他們在時代到來時領導我們。"
 COG_manifeste_convience_africaine: "非洲良知宣言"
 COG_manifeste_convience_africaine_desc: "剛果的民族意識開始形成，進化者開始對耶夫·範比爾森的三十年計劃感到失望。是時候讓剛果的知識分子發聲，向世界展示剛果的前進方向！"
 COG_endorse_force_publique_mutinies: "支持公安軍叛變"
 COG_endorse_force_publique_mutinies_desc: "儘管公安軍是殖民當局的工具，但該組織內有許多人看清了文明開化使命的真相。我們應該使他們相信，叛變是最佳選擇，只有通過這種方式，我們才能獲得完全的獨立。"
 COG_encourage_unionism: "鼓勵工會"
 COG_encourage_unionism_desc: "剛果的大量民眾苦於同工不同酬。為了解決這個問題，我們必須鼓勵人民成立工會，因為只有團結合作，我們才能創造更美好的未來！"
 COG_make_contact_with_irving_brown: "與歐文·布朗接觸"
 COG_make_contact_with_irving_brown_desc: "美國工會主義者、美國勞工聯合會領導人歐文·布朗長期以來與西里爾·阿杜拉有聯繫；作為美國陸軍的中尉，他可能非常值得爭取。通過利用他作為聯絡人，我們可能會嘗試吸引與工會有聯繫的美國投資方。"
 COG_invite_the_general_labour_federation_of_belgium: "比利時勞工聯合總會"
 COG_invite_the_general_labour_federation_of_belgium_desc: "比利時勞工聯合總會是為取代工會委員會而成立的，旨在將其影響力擴展到比利時本土以外。藉助我們的聯絡人，我們可以確保他們在剛果紮根，以提供一個統一的組織，讓人民參與其中。"
 COG_union_nationale_des_travailleurs_du_congo: "剛果全國工會"
 COG_union_nationale_des_travailleurs_du_congo_desc: "我們需要建立一個以剛果為重心的工會，它應獨立於我們和其他任何國家政府。"
 COG_approach_the_disfavored_mwami: "接觸遭冷落的姆瓦米"
 COG_approach_the_disfavored_mwami_desc: "有許多人對比利時佔領者心懷不滿。其中之一是前盧旺達的姆瓦米，尤希五世·穆辛加。我們可以爭取他的支持，確保他和他的追隨者在時機成熟時加入我們的起義隊伍。"
 COG_the_simba_movement: "辛巴運動"
 COG_the_simba_movement_desc: "推翻我們的殖民宗主國的最佳方式是腳踏實地，並爭取普通民眾的支持。為此，克里斯托夫·格貝涅正在組織一個名為“辛巴”的團體，象徵兇猛的巨獅，他們會打擊我們的敵人。他們將是我們贏得獨立的最佳選擇！"
 COG_attempt_to_sway_moise_thsombe: "爭取莫伊茲·衝伯的支持"
 COG_attempt_to_sway_moise_thsombe_desc: "加丹加省似乎並不支持我們的分離主義思想，如果我們發動起義，他們可能會脫離我們。因此，我們必須爭取他們最著名的政治家之一，莫伊茲·衝伯的支持，讓他為我們的共同事業說服那裡的人們。"
 COG_secure_soviet_aid: "爭取蘇聯援助"
 COG_secure_soviet_aid_desc: "當前有不少國際勢力都期望我們能夠獨立，或者至少希望看到我們的宗主國比利時的勢力削弱。如果我們想要尋找一個長期可靠的盟友，一個在戰後仍然可以依靠的強援，蘇聯或許是最佳的選擇。"
 COG_secure_german_aid: "爭取德國援助"
 COG_secure_german_aid_desc: "有許多國家希望見證我們的獨立，或至少見證我們的比利時宗主國被削弱。儘管他們對我們的整體獨立興趣不大，但德國人非常希望看到比利時被削弱。因此，他們將在戰爭期間成為我們強大的盟友。"
 COG_approach_the_barotse_litunga: "接觸巴羅策的利通加"
 COG_approach_the_barotse_litunga_desc: "我們南方的巴羅策人的利通加，耶塔二世，在反帝國主義方面與我們有許多共同目標。也許獲得他的信任，並讓他的戰士協助我們的解放事業是明智之舉？"
 COG_slander_the_colonial_authorities: "詆譭殖民當局"
 COG_slander_the_colonial_authorities_desc: "我們現在需要做的是開始一場反對殖民當局的大規模宣傳運動，並向公眾揭露他們對我們所做的和仍在做的一切。只有這樣，我們才能真正獲得人民的支持。"
 COG_strike_while_the_rion_is_hot: "趁熱打鐵"
 COG_strike_while_the_rion_is_hot_desc: "時機已到。機不可失，時不再來。我們將使用暴力擊倒敵人，使我們的國家徹底擺脫殖民壓迫！"
 COG_the_lion_roars: "獅吼"
 COG_the_lion_roars_desc: "正如曾經的我們，非洲人民如今渴望從壓迫者手中得到解放。辛巴最近獲得了極大的人氣，此時此刻，沒有什麼可以阻止他們走上領導國家的舞臺。"
 COG_proclaim_the_peoples_republic: "宣佈剛果人民共和國成立"
 COG_proclaim_the_peoples_republic_desc: "如果幾年前你問我們的人民，他們是否認為我們會有今天，他們會回答說不會。但我們做到了。今天是我們宣佈成立剛果人民共和國的日子，我們為了這一天奮鬥已久。主席萬歲，國家萬歲！"
 COG_the_arme_populaire_de_liberation: "剛果人民解放軍"
 COG_the_arme_populaire_de_liberation_desc: "革命的力量需要觸及所有人，並且要強大到足以保護我們的公民。為此，我們需要成立自己的剛果人民解放軍，讓我們的人民不再擔憂自己的安危！"
 COG_nationalization_of_foreign_industrial_assets: "國有化外國工業資產"
 COG_nationalization_of_foreign_industrial_assets_desc: "縱觀我國曆史，許多外國公司和企業來到我國，剝削我國的資源和人民。我們必須將這些工業資產國有化，使其成為我國自己的產業。"
 COG_form_the_gecamines: "成立剛果採石場和礦場總局"
 COG_form_the_gecamines_desc: "下一步是將剛果礦業公司國有化，將其併入我們新成立的國企，剛果採石場和礦場總局。如此，我國的資源才屬於我們自己。"
 COG_societe_nationale_chemins_du_congo: "剛果國家鐵路公司"
 COG_societe_nationale_chemins_du_congo_desc: "我國如此遼闊，目前大多數鐵路都處於失修狀態，成立一個全國性的機構來管理我國的大量鐵路非常重要，如此我國各地就可以前所未有地通暢連接。"
 COG_cooperate_with_the_congolese_churches: "與剛果教會合作"
 COG_cooperate_with_the_congolese_churches_desc: "教會雖然本性保守，但並不反對我們，對我們的統治沒有太大威脅。因此，最好確保我們贏得他們的好感，讓他們成為國家機器的一部分。"
 COG_strict_anti_clericalism: "嚴格的反教權主義"
 COG_strict_anti_clericalism_desc: "天主教會和金邦古教會的神職人員都是一群貪圖私利的人。如果想要讓我們的民眾走向繁榮，就必須努力消除這些教會在社會中的影響勢力。"
 COG_invite_kwame_to_the_capital: "邀請誇梅·恩克魯瑪來到首都"
 COG_invite_kwame_to_the_capital_desc: "誇梅·恩克魯瑪是一位頗具影響力且廣受歡迎的泛非主義加納政治家。我們應該邀請他來我們的首都，與該運動建立良好的關係，也許他在很多方面對我們有用。"
 COG_liberation_by_force: "武力解放"
 COG_liberation_by_force_desc: "非洲人民沒有解放自己的力量。我們必須努力將他們從壓迫者手中解放出來，使他們能像很久以前那樣再次體驗自由。"
 COG_hold_the_pan_african_congress: "主持泛非洲會議"
 COG_hold_the_pan_african_congress_desc: "所有有影響力的非洲政治家必須聚集在一起，共同決定非洲大陸的未來。議程中必須包括反抗殖民國家和解放非洲人民。"
 COG_establish_the_west_african_national_secretariat: "非洲國家秘書處"
 COG_establish_the_west_african_national_secretariat_desc: "是時候執行泛非洲會議上決定的行動了。我們必須向革命者提供武器，並協助全球反殖民主義鬥爭，這樣才能徹底終結這個黑暗的時代！"
 COG_socialist_education_reforms: "社會主義教育改革"
 COG_socialist_education_reforms_desc: "人民必須接受適當的教育才能獨立思考，而不會再次陷入部落習性和野蠻行徑的陷阱。因此，我們必須努力建立符合我們觀點的教育體系和課程。"
 COG_foster_a_personality_cult: "建立個人崇拜"
 COG_foster_a_personality_cult_desc: "只有[ROOT.GetLeader]能為非洲人民帶來繁榮。他是偉大的領袖，是我們獨立的基石，必須得到相應的對待。"
 COG_join_the_comitern: "加入共產國際"
 COG_join_the_comitern_desc: "我們在蘇聯的意識形態盟友希望終結殖民主義時代。因此，我們應該與他們建立更密切的外交關係，甚至可以尋求結盟。"
 COG_african_research_and_development_department: "非洲研究與技術發展部"
 COG_african_research_and_development_department_desc: "為了取得進步，我們必須建立致力於非洲研究與技術發展的聯合部門，它將匯聚許多非洲國家的技術知識。"
 COG_organization_of_african_unity: "非洲統一組織"
 COG_organization_of_african_unity_desc: "迄今為止，擺脫歐洲殖民統治、獲得自由的標誌僅僅是獲得獨立。然而，在許多非洲以外的領導人看來，我們仍然是潛在的征服目標。只有團結合作，非洲人民才能希望避免再次成為他國的附屬。"
 COG_mutual_defense: "共同防禦"
 COG_mutual_defense_desc: "只有在全世界都能意識到要殖民非洲人民要付出巨大代價時，我們的人民才能獲得持久的和平。為了達到這個目的，非洲統一組織的成員應該建立一個共同防衛協定，承諾當任一成員國遭到攻擊時時保衛其獨立。"
 COG_central_african_bank: "非洲中央銀行"
 COG_central_african_bank_desc: "在建立了[ETH_GetCentralBankName]之後，我們可以開始整合非洲統一組織內部的經濟。這可以讓我們更好地運用我們的資源和基礎設施來促進各成員國的發展。"
 COG_the_executive_council: "執行理事會"
 COG_the_executive_council_desc: "我們應該建立一個能夠執行人民意願和快速對影響我們地區穩定的威脅做出反應的行政實體，來推進非洲統一組織的合作進展。"
 COG_the_african_union: "非洲聯盟"
 COG_the_african_union_desc: "是時候讓所有非洲人民統一在一個非洲聯盟的旗幟下了。我們通過艱苦鬥爭成為非洲的第一個超級大國，再也不會受到帝國主義者和法西斯主義者的威脅了。"
 COG_kasa_vubus_first_cabinet: "卡薩武布的第一任內閣"
 COG_kasa_vubus_first_cabinet_desc: "第一次自由選舉已經結束，約瑟夫·卡薩武布成功當選。現在，他正在努力組建剛果第一任部長內閣。他在全國廣受歡迎，工作出色，肯定會成為一名被後人銘記的偉大總統。"
 COG_national_insitute_of_agronomic_study: "國家農業研究所"
 COG_national_insitute_of_agronomic_study_desc: "我們必須建立一個組織，旨在分析和改進我們的農業技術和土地。如此可以使我國真正走向繁榮。"
 COG_the_ten_year_plan: "十年計劃"
 COG_the_ten_year_plan_desc: "為了讓我們的工業重新運轉起來，我們應該啟動剛果的十年經濟和社會發展計劃。"
 COG_expanded_peasantry_program: "農業振興項目"
 COG_expanded_peasantry_program_desc: "農業部門是我國最大的部門，需要大量投資以實現現代化，而這正是我們將要做的。"
 COG_declaration_of_congolese_unity: "剛果統一宣言"
 COG_declaration_of_congolese_unity_desc: "巴剛果族目前因國際邊界而分離。我們必須努力盡快統一我們的族群，並確保巴剛果族能夠在未來數百年走向繁榮。"
 COG_improve_the_civil_administration: "完善民政管理"
 COG_improve_the_civil_administration_desc: "我們許多偏遠地區的行政管理還有很大的改進空間。我們必須努力改善這一點，才能讓我國如我們所希望的那樣順暢、無縫地運行。"
 COG_mend_the_linguistic_divides: "彌合語言分歧"
 COG_mend_the_linguistic_divides_desc: "我國內部存在很大的分歧，其中最大的一個是語言分歧，使用者較多的語言包括基孔戈語、林加拉語、斯瓦希里語、齊盧巴語和法語，以及數百種小語言。我們必須將多個語言作為官方語言，才能實現真正的平等。"
 COG_women_in_the_military: "允許女性參軍"
 COG_women_in_the_military_desc: "儘管有許多愛國女性希望參軍，目前我國不允許女性服役。我們必須修改法律，允許她們參軍，以便儘可能多的有能力的士兵加入我們的武裝力量。"
 COG_assemble_a_regency_council: "組建攝政委員會"
 COG_assemble_a_regency_council_desc: "我們政治困境的解決辦法遙遙無期。沒有哪個政黨或政治家擁有足夠的公眾支持來領導國家，這種情況不能再繼續下去了。我們需要組建一個委員會，向某些部落領袖和君主提供領導權，以為我們的新政府獲得儘可能多的合法性。"
 COG_the_kingdom_of_kongo_focus: "阿瓜羅薩達王室"
 COG_the_kingdom_of_kongo_focus_desc: "19世紀至20世紀期間的統治剛果王國的最後一個王室是阿瓜羅薩達王室，也是剛果內戰期間的主要派別之一。它的現任繼承人佩德羅七世現在再次被加冕為剛果國王。"
 COG_the_nyim_of_kuba_focus: "庫巴的尼姆"
 COG_the_nyim_of_kuba_focus_desc: "庫巴王國自1625年開始存在，並在1884年成為剛果國際協會的地區酋長國。他們由一位尼姆統治，現任尼姆名為，姆博普·馬比因克·馬姆貝基，他將能夠讓我們的國家恢復昔日的輝煌！"
 COG_the_ma_loango_focus: "馬盧安果"
 COG_the_ma_loango_focus_desc: "馬盧安果盧安果王國的傳統統治者。既然我們已經採用了這個頭銜，我們應該努力重新整合這個王國曾經擁有的舊領土。"
 COG_the_mwami_of_burundi_focus: "布隆迪的姆瓦米"
 COG_the_mwami_of_burundi_focus_desc: "穆瓦姆布薩四世·班吉里森傑登上我們的王位，如此我們便可以宣稱布隆迪王國的頭銜。如此，我們將能夠合法地宣稱東部小王國的主權，或許我們還能走得更遠。"
 COG_the_umwami_of_rwanda_focus: "盧旺達的烏姆瓦米"
 COG_the_umwami_of_rwanda_focus_desc: "隨著穆塔拉三世·魯達希瓜登上我們的王位，我們就能夠宣稱盧旺達王國的頭銜。如此，我們將能夠合法地宣稱對東部小王國的主權，或許我們還能走得更遠。"
 COG_the_pro_german_mwami_focus: "親德的姆瓦米"
 COG_the_pro_german_mwami_focus_desc: "與德國合作的盧旺達人，尤希五世·穆辛加，他在被我們的攝政委員會選舉後，接管了該國。然而，出人意料的是，他宣佈剛果是德國殖民帝國的延續，並宣稱自己是中非王國的統治者！"
 COG_uniao_dos_povos_do_norte_de_angola: "安哥拉北部人民聯盟"
 COG_uniao_dos_povos_do_norte_de_angola_desc: "安哥拉北部人民聯盟是一支目前在安哥拉北部活動的游擊隊，他們的目標是將我們的舊領土重新納入剛果王國。資助該組織是明智之舉。"
 COG_bundu_dia_kongo: "剛果之邦"
 COG_bundu_dia_kongo_desc: "為了使我們的國家真正回到過去的狀態，我們必須擺脫葡萄牙人多年前引入的基督教枷鎖。是時候再次復興布剛果了！"
 COG_devout_catholic_kingdom: "虔誠的天主教王國"
 COG_devout_catholic_kingdom_desc: "作為非洲第一批天主教王國之一，我們知道宗教和教宗的合法性的重要性。如果我們要從經歷了數世紀的動盪中恢復過來，我們必須忠於我們的基督教信仰。"
 COG_reestablish_the_royal_council: "重建王室議會"
 COG_reestablish_the_royal_council_desc: "剛果王國的王室議會，通常被稱為上流中的上流，是當時的官員和貴族的統治機構。我們應該重建這個機構，因為沒有哪個國王可以真正獨自統治。"
 COG_bakongo_military_might: "剛果的軍事力量"
 COG_bakongo_military_might_desc: "既然我們已經再次穩定了王國的局勢，是時候宣稱並征服屬於我們的土地，讓非洲都在我們的統治之下！"
 COG_royal_university_of_higher_education: "皇家高等教育大學"
 COG_royal_university_of_higher_education_desc: "為了使國家進步，我們需要教育我們的人民，使他們能夠在科學上取得突破。為此，我們應該建立一所高等教育大學。"
 COG_invest_in_the_textile_industry: "投資紡織工業"
 COG_invest_in_the_textile_industry_desc: "為了使我們的國家繁榮，我們必須投資傳統的庫巴紡織品生產，並在國際市場上銷售。"
 COG_traditional_masks_and_armor: "傳統面具與盔甲"
 COG_traditional_masks_and_armor_desc: "為了提高我們士兵的士氣，我們應該為他們配備傳統的庫巴盔甲。我們還可以用我們的傳統面具嚇唬敵人。"
 COG_children_of_woot: "烏特的孩子"
 COG_children_of_woot_desc: "烏特是一個超自然存在，他給動物和其他生物命名，第一個給人類帶來了文明。我們是他的孩子，行事不能辜負他的期望。"
 COG_spirit_of_loko_yima: "洛科·伊馬之靈"
 COG_spirit_of_loko_yima_desc: "[ROOT.GetLeader]內心帶有純白的洛科·伊馬之靈，他是大地上的神靈，在創世時由天空之父布姆巴吐出。因此，所有人都必須遵從[ROOT.GetLeader]的意志。"
 COG_a_society_of_trade: "以貿易為基礎的社會"
 COG_a_society_of_trade_desc: "因為有經過剛果的貿易路線，我們的社會得以持續發展。如果我們希望獲得更強大的經濟基礎，我們必須加以保持。"
 COG_a_multiethnic_conglomeration: "多民族混合體"
 COG_a_multiethnic_conglomeration_desc: "我們的社會一直由多個民族和語言群體組成，並因此而變得更好。我們應該鼓勵更多這樣的行為，改變徵服者與被征服者之間的關係。"
 COG_reclaim_loango: "收復盧安果"
 COG_reclaim_loango_desc: "雖然目前情況並非如此，但我們的真正首都盧安果位於[772.GetName]，必須將它改造成一個世界從未見過的偉大城市。然而，第一步必須是確保它的安全。"
 COG_the_kings_divine_power: "國王的神聖權柄"
 COG_the_kings_divine_power_desc: "國王擁有統治的神聖權利，且必須被允許如此。他知道什麼才是對他的忠實臣民最好的，並以鐵腕統治。"
 COG_appoint_a_royal_council: "任命王室內閣"
 COG_appoint_a_royal_council_desc: "國王可能知道很多，但並不是全部。因此，他需要王室內閣加以指導，幫助他在統治王國時提供幫助。"
 COG_occupy_cabinda: "佔領卡賓達"
 COG_occupy_cabinda_desc: "卡賓達位於我們的盧安果和博馬兩省之間，隨著戰爭在全球蔓延，現在是時候介入並保護我們的無辜同胞免受進一步的傷害。目前佔據那裡的勢力可能不喜歡這一舉動，但為了保護非洲的未來，這是必要的。"
 COG_reestablish_the_bouvandji: "重建布萬吉"
 COG_reestablish_the_bouvandji_desc: "在11世紀，布萬吉是來自沃約族的鐵匠兄弟會。他們精通火與鐵，領導著恩戈約對我們進行統治。然而，隨著我們近年來的勝利，現在或許是我們利用他們的時候了。"
 COG_invest_in_rubber_plantations: "投資橡膠種植園"
 COG_invest_in_rubber_plantations_desc: "橡膠是我們經濟的燃料，可以幫助我們與外國勢力達成有利的貿易協議。因此，這是一個我們必須大力投資的行業。"
 COG_friendship_with_france: "與[FRA.GetName]簽訂友好條約"
 COG_friendship_with_france_desc: "雖然[FRA.GetNameDefCap]曾經殖民過我們，但他們允許了我們名義上的獨立，我們對此表示感謝。我們應該嘗試糾正過去的錯誤，並與他們建立聯盟。"
 COG_attempt_to_ally_the_portuguese: "尋求與[POR.GetAdjective]結盟"
 COG_attempt_to_ally_the_portuguese_desc: "我們與[POR.GetNameDef]及其探險家的關係一直反覆無常，但現在是我們修正過去並展望未來的時候了。因此，我們應該尋求與他們建立聯盟。"
 COG_reclaim_bujumbura: "奪回布瓊布拉"
 COG_reclaim_bujumbura_desc: "如果我們不控制我們的故都，就不能宣稱自己是新的布隆迪王國。我們必須盡一切努力收復該地區！"
 COG_the_embodiment_of_god: "神之化身"
 COG_the_embodiment_of_god_desc: "[ROOT.GetLeader]就是上帝的化身，擁有統治大湖地區所有土地的獨一無二的神聖權利。陛下萬歲！"
 COG_claim_the_great_lakes: "宣稱大湖地區各王國"
 COG_claim_the_great_lakes_desc: "大湖區的各個王國，包括我們曾經的王國，現在都被外國勢力征服。作為這些古老王國之一，我們對該地區擁有比任何帝國主義強權更為合法的宣稱，因此必須儘快將此地佔為己有。"
 COG_new_empire_of_kitara: "新基塔拉帝國"
 COG_new_empire_of_kitara_desc: "我們東部地區的許多居民都在談論偉大而古老的基塔拉帝國。通過傳承這個神秘而傳奇的國家的使命，我們可以完全合法化我們對大湖區王國的主張。"
 COG_south_to_lake_malawi: "南進馬拉維湖"
 COG_south_to_lake_malawi_desc: "我們還需要最後一次推進，前往另一個偉大的湖泊，一個在古老的基塔拉帝國地圖上未曾標明的湖泊。那就是馬拉維湖，它將像該地區的其他大湖一樣被我們宣稱為我們的領土。"
 COG_reclaim_kigali: "收復基加利"
 COG_reclaim_kigali_desc: "如果我們不控制我們的故都，我們就不能宣稱自己是新的盧旺達王國。我們必須盡一切努力收復該地區！"
 COG_centralize_military_structure: "中央軍事結構"
 COG_centralize_military_structure_desc: "為了更好地協調我們的軍隊，我們必須建立一箇中央軍事結構，這是我們過去輕鬆征服所有鄰近王國的關鍵。"
 COG_an_expansionist_state: "擴張主義國家"
 COG_an_expansionist_state_desc: "任何國家如果想要跟上其人口的需求，就需要不斷發展壯大，我們也不例外。我們必須迅速擴張國境，以滿足那些不斷渴望更多的人。"
 COG_great_military_chiefs: "偉大的軍事首領"
 COG_great_military_chiefs_desc: "我們過去的特點是擁有偉大的軍事指揮官。我們應該加強嚴格的訓練制度，以便我們現在的指揮官能夠達到過去的標準。"
 COG_great_cattle_chiefs: "偉大的牧牛首領"
 COG_great_cattle_chiefs_desc: "我們過去的特點是擁有擅長組織和管理的偉大首領。他們可以使我們的農業領域比任何其他國家都強大，這是我們迫切需要恢復的。"
 COG_expand_banana_plantations: "擴建香蕉種植園"
 COG_expand_banana_plantations_desc: "香蕉是任何健康經濟的命脈。我們應該努力將香蕉產量提高十倍，這樣我們的人民和經濟都能得到滿足。"
 COG_tutsi_warrior_training: "圖西戰士訓練"
 COG_tutsi_warrior_training_desc: "多年前我們偉大的圖西戰士幫助我國征服了鄰國。我們應該加強徵兵制度，只有最健康、訓練有素的人才能參軍。"
 COG_unify_east_africa: "統一東非"
 COG_unify_east_africa_desc: "現在，我們終於可以實現古代盧旺達國王的夢想——統一東非。這是一個偉大的成就，將為我們帶來巨大的榮耀！"
 COG_a_german_protectorate: "德國保護國"
 COG_a_german_protectorate_desc: "為了賦予我們新國家合法性，並保護它免受英國和法國等貪婪禿鷲的侵害，我們應該嘗試成為我們老朋友[GER.GetNameDef]的保護國。"
 COG_invite_german_kasierist_exiles: "邀請德國君主主義者"
 COG_invite_german_kasierist_exiles_desc: "看來德國人已經放棄了他們輝煌的皇帝，選擇了真正的平庸。我們應該努力邀請忠誠的德國君主主義者到我們的國家，並嘗試建立真正的德意志中非！"
 COG_colonial_administration: "殖民管理"
 COG_colonial_administration_desc: "我們應該利用德國過去在我們國家進行殖民管理時學到的經驗，更好地管理非洲。"
 COG_prussia_of_africa: "非洲的普魯士"
 COG_prussia_of_africa_desc: "我們德意志中非是真正的征服者，將把整個非洲納入我們的統治之下。我們的軍隊已經被高度普魯士化，人們常常稱我國為非洲的普魯士。"
 COG_german_west_africa: "德屬西非"
 COG_german_west_africa_desc: "我們必須推進到德屬西非的舊領土，使它們再次回到我們的懷抱！"
 COG_german_east_africa: "德屬東非"
 COG_german_east_africa_desc: "我們必須推進到德屬東非的舊領土，使它們再次回到我們的懷抱！"
 COG_german_south_west_africa: "德屬西南非洲"
 COG_german_south_west_africa_desc: "我們必須推進到德屬西南非洲的舊領土，使它們再次回到我們的懷抱！"
