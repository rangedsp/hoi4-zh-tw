 HUN_every_fascist_sympathizer_tt: "每個§Y法西斯支持者§!："
 wuw_HUN_seek_german_contracts_tt: "如果§Y[GER.GetName]§!對§Y[ROOT.GetName]§!的評價高於25但低於50，獲得1§Y地圖外軍用工廠§!。如果對§Y[ROOT.GetName]§!的評價高於50但低於75，獲得2§Y地圖外軍用工廠§!。如果對§Y[ROOT.GetName]§!的評價高於75，獲得2§Y地圖外軍用工廠§!和1§Y地圖外民用工廠§!。\n當前我們會獲得："
