 ### AUSTRO-HUNGARIAN JOINT FOCUS TREE ###
 HABSBURG_is_subject_puppeteer_faction_leader_or_member_trigger_tt: "是§Y[AUS.GetNameDef]§!或§Y[HUN.GetNameDef]§!，且擁有任意§Y奧匈帝國代表國§!為附屬國；或是兩國之一的附屬國；或是§Y[AUS.GetNameDef]§!或§Y[HUN.GetNameDef]§!且為陣營領導者；或是與兩國處於同陣營中的任意§Y奧匈帝國代表國§!。"
 HABSBURG_is_originator_country: "§Y[ROOT.GetName]§!是§Y發起國家§!"
 HABSBURG_part_of_something_bigger: "不可分割、不可分離"
 HABSBURG_part_of_something_bigger_desc: "所有人都知道他們必須保衛自己的家園，但如果他們沒有認識到跨境合作與支援鄰國保衛珍重之物的重要性，我們新成立的聯邦就肯定會垮臺。"
 HABSBURG_economic_cooperation_policy: "經濟合作政策"
 HABSBURG_economic_cooperation_policy_desc: "目前，我們的聯邦成員完全自主管理各自的經濟。雖然這確實允許每個成員擁有儘可能多的自由，但這也削弱了聯邦的經濟實力。通過制定合作政策，我們可以確保成員在面對更大的經濟問題時共同應對。"
 HABSBURG_joint_consumer_goods_endeavors: "多瑙中央銀行"
 HABSBURG_joint_consumer_goods_endeavors_desc: "聯邦內各個地區的經濟能力差異很大。我們的中央銀行在經濟實力上也有很大差異，雖然每個地區都應該保留自己的中央銀行，但成立聯邦中央銀行將確保我們擁有一個注重聯邦整體經濟狀況的機構。"
 HABSBURG_technology_sharing: "科研合作"
 HABSBURG_technology_sharing_desc: "我們聯邦境內有許多人才。我們必須將他們集中起來以促進各區域發展，並推動我們的聯邦走向應有的未來。"
 HABSBURG_increase_scientific_cooperation: "建立聯合研究設施"
 HABSBURG_increase_scientific_cooperation_desc: "現在是時候共同資助新的實驗室和秘密研究設施，讓我們的科學家們能夠更緊密地合作，提高他們的研究速度，並帶我們邁向新的領域。"
 HABSBURG_simplify_economic_lawmaking: "簡化經濟立法"
 HABSBURG_simplify_economic_lawmaking_desc: "我們的成員在貿易和經濟方面的法律目前差異很大。雖然沒有必要在所有成員中統一法律，但由於情況需要而動態改變法律的過程可以從精簡中受益。"
 HABSBURG_securing_the_consumer_rights: "為人民謀繁榮"
 HABSBURG_securing_the_consumer_rights_desc: "儘管戰爭販子無處不在，但我們必須牢記是人民讓這個聯邦成為可能。因此我們必須確保他們始終對自己所處的情況感到滿意。"
 HABSBURG_discounted_licenses: "建立有益武器合同"
 HABSBURG_discounted_licenses_desc: "我們或許沒有最現代化的武器，但這不是問題，因為我們的政治家與一些人有聯繫，後者可以幫助我們更好地獲取外國技術以便在我們自己的設施中生產。通過利用廣泛的關係網，我們將獲得最先進設備的生產權，並利用我們龐大的工業，使我們的部隊擁有優越的裝備。"
 HABSBURG_reform_gemeinsame_armee: "改革聯合陸軍"
 HABSBURG_reform_gemeinsame_armee_desc: "在過去，奧匈帝國建立了一支規模可觀的聯合陸軍，各國為我們的共同事業做出了貢獻。無論我們當前的意識形態差異和相似之處如何，聯合軍事行動只會讓我們更強大。"
 HABSBURG_motorizing_the_armies: "摩托化陸軍"
 HABSBURG_motorizing_the_armies_desc: "現代戰爭或許仍然取決於步兵攻勢，但即便如此，我們也應該確保步兵部隊能儘快而高效地從聯邦境內的一地趕到另一地。通過發起摩托化運動，用卡車運載更多的部隊，我們將確保部隊始終能及時到達所需位置。"
 HABSBURG_mechanized_initiative: "機械化計劃"
 HABSBURG_mechanized_initiative_desc: "一些科學家已在研究將半履帶車用於部隊運輸以及裝備重型裝甲的可能性。這種選擇可能比坦克更便宜，但比卡車更堅固，並能夠應對更具挑戰性的地形。或許我們應該為這個項目提供資金。"
 HABSBURG_armor_initiative: "裝甲計劃"
 HABSBURG_armor_initiative_desc: "戰爭的未來取決於裝甲載具，就像我們前輩輸掉的那場大戰的尾聲一樣。我們必須彌補這些錯誤並重視這方面，以免再次受挫。"
 HABSBURG_effectivizing_the_motorized_troops: "高效用油"
 HABSBURG_effectivizing_the_motorized_troops_desc: "隨著我們將更多的摩托化、機械化和裝甲單位整合到我們的軍隊中，我們的燃料使用量急劇上升。燃料本身已經成為一個最令人擔憂的瓶頸，阻礙了我們的軍事能力。我們應該研究改進燃料使用，這將使我們在軍事和經濟上都受益。"
 HABSBURG_the_strength_of_the_common_man: "匹夫之力"
 HABSBURG_the_strength_of_the_common_man_desc: "即使是最大的組織也依賴於最小的部分。對我們來說，特別是對我們的軍隊而言，這意味著依賴普通人，我們的士兵。我們必須確保每一位士兵都明白肩上的重擔，也要明白他有力量去承擔這些重擔，而且這是他的職責。"
 HABSBURG_joint_training_initiative: "帝國和皇家戰爭部"
 HABSBURG_joint_training_initiative_desc: "曾經的聯合陸軍由指定的門管理。回顧往昔，這個部門管理得很糟糕，與戰場上的實時戰況脫節。然而，這個理念是正確的。如果我們要聯合運作，我們的規劃和組織也需要協同調配。"
 HABSBURG_organizational_exercises: "聯合演習"
 HABSBURG_organizational_exercises_desc: "機動能力將決定未來的戰爭。隨著戰爭以越來越快的速度進行，高速和完美組織的需求也在增長。如果我們的部隊不知道如何快速移動而不失去目標，再多的火力也救不了我們。隨著我們的軍隊中包括了許多不同國籍的人，必須努力協調和組織我們的部隊。"
 HABSBURG_meeting_the_logistical_challenge: "應對後勤挑戰"
 HABSBURG_meeting_the_logistical_challenge_desc: "隨著我們的聯邦不斷壯大，後勤挑戰也在增加。現在，補給到達部隊的時間變長了，我們擔心如果不加以解決，未來可能會成為一個問題。我們的部隊必須接受更多的訓練，以更少的資源完成更多的任務，同時必須改善對部隊的補給分配。"
 HABSBURG_bring_back_royal_and_imperial_hussars: "重建皇家驃騎兵"
 HABSBURG_bring_back_royal_and_imperial_hussars_desc: "想當年，曾經的奧匈帝國擁有一支皇家驃騎兵。儘管大多數驃騎兵部隊早已解散，但驃騎兵的精神至今依然存在。這樣受我們自己和敵人尊敬的部隊，即使在現在也會對我們大有裨益。"
 HABSBURG_defensive_hussars: "效仿匈牙利驃騎兵"
 HABSBURG_defensive_hussars_desc: "我們復興的驃騎兵部隊需要進行一些改變，以無縫融入我們現在更現代化的軍隊。目前的匈牙利輕騎兵，他們對現代驃騎兵的詮釋，應成為我們新驃騎兵軍隊的榜樣。通過利用他們的經驗，並努力達到他們的靈活性和速度，我們可以建立一支令人敬畏的部隊。"
 HABSBURG_offensive_hussars: "效仿波蘭驃騎兵"
 HABSBURG_offensive_hussars_desc: "我們復興的驃騎兵部隊需要進行一些改變，以無縫融入我們現在更現代化的軍隊。目前的波蘭重騎兵，即波蘭翼騎兵，已經在敵人心中種下了恐懼和尊敬。考慮到這些因素，很明顯我們的驃騎兵應該按照同樣的模式運作。"
 HABSBURG_the_modern_hussar: "現代驃騎兵"
 HABSBURG_the_modern_hussar_desc: "時間不會為任何人停留，甚至包括我們勇敢的驃騎兵。儘管這些勇敢的人仍然是我們聯合陸軍的一大資產，我們必須使這些驃騎兵真正現代化。我們受人尊敬的驃騎兵的未來可能不再總是騎馬，但這無關緊要，重要的是驃騎兵精神永存!！"
 HABSBURG_for_the_glory_of_the_empire: "為了國家的榮耀"
 HABSBURG_for_the_glory_of_the_empire_desc: "如今我們的軍隊已經回到正軌，是時候向我國公民灌輸愛國意識了，讓他們認識到自己就是保護每個小家免受敵人侵害的力量。"
 HABSBURG_joint_industry_spirit: "聯合工業規劃"
 HABSBURG_joint_industry_spirit_desc: "聯邦內的每個國家都必須在工業方面儘自己的職責。目前我們都在根據不同的計劃運作，這導致了合作過程中出現了困難。通過共同規劃我們的工業發展，我們可以確保最大的效率。"
 HABSBURG_supplying_the_federation: "供給聯邦"
 HABSBURG_supplying_the_federation_desc: "隨著我們的聯邦不斷壯大，我們的供應和鐵路網絡也必須隨之增長。如果不加以努力，我們可能會超出自身基礎設施的承載能力，遭受痛苦和羞辱的失敗。"
 HABSBURG_optimizing_the_land_usage: "優化土地使用"
 HABSBURG_optimizing_the_land_usage_desc: "在一個聯邦內有這麼多國家一起運作，土地的使用不盡完美也就不足為奇了。通過彙集我們對如何最好利用工業區的知識，我們可能會優化建廠的方式。"
 HABSBURG_joint_ventures_in_resource_extraction: "資源開採合營企業"
 HABSBURG_joint_ventures_in_resource_extraction_desc: "不可避免的是，一些資源由於經濟或時間等原因而被忽視或未被開採。然而，現在這些資源都歸聯邦所有，我們可以利用自身更大的經濟規模和更廣博的知識來最好地開發這些資源！"
 HABSBURG_industrializing_our_capitals: "首都工業化"
 HABSBURG_industrializing_our_capitals_desc: "我們聯邦內的大多數首都是古老的歷史城市。雖然這很好，說明我們的成員國有著悠久而強大的歷史，但在工業方面它們卻讓我們有所遺憾。共同努力進一步工業化這些城市可能會非常有益。"
 HABSBURG_specializing_in_civilian_logistics: "重視民用物流"
 HABSBURG_specializing_in_civilian_logistics_desc: "落後的基礎設施和腐敗的工廠主影響了全聯邦的工具與裝備流動。我們必須高度重視並儘快改善這一領域。"
 HABSBURG_specializing_in_the_arms_industry: "重視軍備工業"
 HABSBURG_specializing_in_the_arms_industry_desc: "如果我們想與[GER.GetAdjective]、[SOV.GetAdjective]、[ENG.GetAdjective]和[FRA.GetAdjective]這些巨頭競爭，我們就必須大幅擴張我們的軍事工業！"
 HABSBURG_industrial_effectivization: "工業增效"
 HABSBURG_industrial_effectivization_desc: "我們的工廠不僅需要在戰時運作，顯然也要在和平時期運作。在一個完美的世界裡，後者的重要性遠高於前者，不幸的是，這個世界並不完美。然而，我們仍然不能忽視和平時期的工業活動。"
 HABSBURG_reinforced_industry: "工業加固"
 HABSBURG_reinforced_industry_desc: "雖然我們的工廠能在和平時期運轉很重要，但現在不是處理這個問題的時候。我們的工業部門必須能夠承受在本土進行的戰爭，在實現這一目標之前，我們無法騰出時間來考慮和平時期的運作。"
 HABSBURG_improved_production_methods: "改進生產方法"
 HABSBURG_improved_production_methods_desc: "鑑於我們的工業正在高效運轉，我們可以努力改進我們的生產方法，發揮潛藏於我國人民及其辛勤工作中的真正力量。"
 HABSBURG_call_the_imperial_diet: "召集帝國議會"
 HABSBURG_call_the_imperial_diet_desc: "終於到了重新召集帝國議會的時候了。作為聯邦的領導者，我們對這個聯邦的願景一直很清晰。帝國的重新整合一直是我們的目標，現在是我們實現它的時候了。"
 HABSBURG_united_in_the_face_of_danger: "團結面對危險"
 HABSBURG_united_in_the_face_of_danger_desc: "這是玉碎瓦全的問題，我們的人民深知這一點。我們將全力團結一致，抵禦任何可能出現的威脅！"
 HABSBURG_an_empire_not_just_in_name: "千年聯邦"
 HABSBURG_an_empire_not_just_in_name_desc: "我們的聯邦將實實在在屹立千年。如今，沒有什麼能阻擋我們通往未來。要讓人們知道，多瑙河地區是世界上最富饒、最令人讚歎的地區!"
 HABSBURG_an_empire_not_just_in_name_no_puppets_tt: "所有擁有該§Y共享國策樹§!的附屬國會獲得："
 HABSBURG_joint_ft_unlock_tt: "解鎖奧匈§Y共享國策樹§!"
