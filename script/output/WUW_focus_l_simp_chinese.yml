 COG_the_lion_roars_2_tt: "我們將可以選擇保留§Y西里爾·阿杜拉§!為國家領袖，或是用§Y克里斯托弗·格本耶§!取而代之"
 CONGO_expanded_rubber_plantations_available_tt: "我們的一個敵人奪取了整個§Y法屬印度支那§!的控制權"
