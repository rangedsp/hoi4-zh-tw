 wuw_HUN_renew_the_rome_protocols_interventionalism_tt: "將移除§Y干涉主義§!精神中的政治點數懲罰"
 wuw_HUN_strengthen_the_turani_vadaszok_requirement_tt: "§Y$HUN_hungarian_national_defense_association$§!仍然存在"
 wuw_HUN_demand_the_vojvodina_tt: "解鎖一個索要§Y西巴納特§!的決議"
 wuw_HUN_reaffirm_territorial_claims_tt: "解鎖§Y重新整合舊匈牙利領土§!的決議"
 wuw_HUN_reinstate_the_pragmatic_sanction_tt: "§Y小協約國§!成員將可以選擇§Y禁運§!我們"
 habsburg_alliance_faction: "哈布斯堡同盟"
 wuw_HUN_the_kingdom_of_ukraine_required_states_tt: "§Y[ROOT.GetNameDefCap]§!或其一個附屬國控制了§Y蘇聯§!所有的§Y烏克蘭§!核心地區，以及§Y[137.GetName]§!、§Y[218.GetName]§!、§Y[93.GetName]§!和§Y[234.GetName]§!。"
 wuw_HUN_the_kingdom_of_ukraine_tt: "我們會以所需地區釋放一個新的§Y烏克蘭國家§!作為我們的附屬國"
 wuw_HUN_the_kingdom_of_georgia_required_states_tt: "§Y[ROOT.GetNameDefCap]§!或其一個附屬國控制了§Y蘇聯§!所有§Y格魯吉亞§!核心地區"
 wuw_HUN_enlarge_the_ganz_danubius_division_tt: "在控制的隨機§Y沿海地區§!添加§G3§!§Y海軍船塢§!"
 wuw_HUN_renew_the_shipping_industry_tt: "在控制的隨機§Y沿海地區§!添加§G3§!§Y海軍船塢§!"
 wuw_HUN_economic_intervention: "經濟干預"
 wuw_HUN_economic_intervention_desc: "我們必須投入充足的政治資源來指導經濟，也許目前經濟狀況姑且還算過得去，但我們可以使其變得更加繁榮高效。"
 wuw_HUN_avoid_interventionalist_destablilization: "避免干涉主義者破壞穩定"
 wuw_HUN_avoid_interventionalist_destablilization_desc: "我們必須充分利用我們掌握的資源。精心規劃和平衡的預算是我國政府成功的關鍵。"
 wuw_HUN_secret_rearmament: "秘密軍備重整"
 wuw_HUN_secret_rearmament_desc: "儘管《特里亞農條約》嚴禁我國擴大軍隊規模，然而如今世界政局動盪不安，衝突已迫在眉睫，我們不能再繼續這樣毫無防備。軍備重整勢在必行，即便這意味著要秘密打破上次世界大戰後對我國所施加的和約限制。"
 wuw_HUN_forcefully_revitalize_the_industries: "大力振興工業"
 wuw_HUN_forcefully_revitalize_the_industries_desc: "我們得給我國工業下一劑猛藥，才能使之從經濟蕭條中提振並恢復過來。這可能會對我國經濟造成副作用，但對我國的未來而言無疑將會是一筆值得的投資。"
 wuw_HUN_reintigrate_the_imperial_railroads: "重整帝國鐵路"
 wuw_HUN_reintigrate_the_imperial_railroads_desc: "自舊奧匈帝國解體為眾獨立國家之時，曾貫穿全國的鐵路網絡就已是支離破碎。我們應該與前組成國接洽，提議整合各國鐵路網絡以改進全體基礎設施。"
 wuw_HUN_promote_increased_urbanization: "促進城市化"
 wuw_HUN_promote_increased_urbanization_desc: "越來越多的人正離開村莊和小城鎮，前往大都市中心，在新建的工廠中謀生。即便我們無法立刻給他們安排工作，我們也可以建造新的城市區塊，為之後的擴張做準備。"
 wuw_HUN_expand_the_ganz_muvek: "擴建岡茨工廠"
 wuw_HUN_expand_the_ganz_muvek_desc: "為了更好地集中我國工業能力以及管理未來用於工業發展的資金，我們應該擴建岡茨及合夥人鐵廠與機械工廠，並使之吸收規模較小的工廠。"
 wuw_HUN_devalue_the_pengo: "升值帕戈"
 wuw_HUN_devalue_the_pengo_desc: "帕戈正處於史上最惡劣的通貨膨脹這一非常不利的處境。儘管完全不受歡迎，我們也必須採取嚴厲措施升值並鞏固貨幣。"
 wuw_HUN_announce_the_gyor_program: "傑爾計劃"
 wuw_HUN_announce_the_gyor_program_desc: "我國武裝力量兵微將寡，急需在規模以及作戰能力上有所提升。而要實現這點，我們就必須大力扶持本國工業，滿足不斷增長的軍備需求。政府為期五年的傑爾計劃不僅將在軍事，同時亦將在工業、農業、基建和教育等配套領域進行廣泛的投入。"
 wuw_HUN_enlarge_the_ganz_danubius_division: "擴大岡茨-多瑙河分部"
 wuw_HUN_enlarge_the_ganz_danubius_division_desc: "位於布達佩斯的岡茨工廠多瑙河分部主營民用與褐水海軍艦艇的建造和維修。我們應該擴大他們的業務，並在我們新獲得的海岸線上為他們建設新工廠。"
 wuw_HUN_support_for_our_finnish_brothers: "支持我們的芬蘭兄弟"
 wuw_HUN_support_for_our_finnish_brothers_desc: "我們與芬蘭人有共同先祖的觀念被廣泛接受不過百年有餘，然而如今我國已有許多人視芬蘭為我們的骨肉至親。如今他們正陷於戰火，我們必須輸送裝備並派遣志願軍幫助他們作戰。"
 wuw_HUN_support_for_our_finnish_brothers_tt: "芬蘭必須有一個順從我們的政府"
 wuw_HUN_undercover_air_maneuvers: "秘密空中演習"
 wuw_HUN_undercover_air_maneuvers_desc: "我們必須投入大量資源來發展有關空戰的新理論。如果加入戰爭，我們可能發展出的理論將是無價之寶，而秘密訓練將使我們的飛行員在戰鬥中表現得更好。"
 wuw_HUN_hold_war_games: "舉行軍事演習"
 wuw_HUN_hold_war_games_desc: "通過組織小規模的軍事演習，我們可以找出當前軍隊架構當中的缺陷，並利用所習得的經驗來彌補不足之處。"
 wuw_HUN_negotiate_the_restrictions: "談判限制條款"
 wuw_HUN_negotiate_the_restrictions_desc: "偷偷摸摸展開小規模的軍備重整顯然無濟於事，我們必須為此與鄰國相接洽，請求重修世界大戰後強加給本國的條約內容。匈牙利也該擁有發展軍備的平等權利。"
 wuw_HUN_reinstate_the_navy: "恢復海軍"
 wuw_HUN_reinstate_the_navy_desc: "在重獲海岸線後，我們必須集中精力重建一支適合大國的海軍艦隊。"
 wuw_HUN_make_the_magyar_legiero_known: "宣明匈牙利空軍"
 wuw_HUN_make_the_magyar_legiero_known_desc: "匈牙利空軍是我國軍隊的空軍分支。儘管我們被禁止擁有軍用飛行器，然而在民間飛行俱樂部的掩護下，我們逐漸建立了一支秘密空軍。現在新條約已經落實，我們能向世界宣佈它的存在了。"
 wuw_HUN_initiate_army_maneuvers: "開始軍事演習"
 wuw_HUN_initiate_army_maneuvers_desc: "我國軍隊必須迴歸良好狀態，以應對未來潛在的武裝衝突。我們將讓他們進行演習以發展新的戰術和戰略。"
 wuw_HUN_invest_in_ludovica_academy: "投資盧多維卡學院"
 wuw_HUN_invest_in_ludovica_academy_desc: "匈牙利皇家盧多維卡國防學院是我們的軍官學員培訓機構。它應該得到擴建，以便我們的將領都能接受更好的教育。"
 wuw_HUN_expand_the_diosgyor_machinery_factory: "擴建迪歐什久爾機械廠"
 wuw_HUN_expand_the_diosgyor_machinery_factory_desc: "迪歐什久爾機械廠應該擴張至更多的領域，從而加快工業材料和工具、引擎和發動機以及許多其他產品的生產。"
 wuw_HUN_manred_weiss_steel_and_metal_works: "曼弗雷德·魏斯鋼鐵和金屬工坊"
 wuw_HUN_manred_weiss_steel_and_metal_works_desc: "通常被稱為切佩爾鋼鐵廠的曼弗雷德·魏斯鋼鐵和金屬工坊顯示出巨大的潛力。我們必須儘可能地擴大它的規模，以支持我們國家的進一步發展。"
 wuw_HUN_expand_the_hungarian_academy_of_sciences: "擴大匈牙利科學院"
 wuw_HUN_expand_the_hungarian_academy_of_sciences_desc: "匈牙利科學院是[ROOT.GetName]最重要、最負盛名的學術團體。其主要職責是培養科學意識、傳播科學成果、支持研發項目以及在國內外代表[ROOT.GetAdjective]的科學水平。"
 wuw_HUN_expand_the_lignite_industry: "發展褐煤產業"
 wuw_HUN_expand_the_lignite_industry_desc: "我國褐煤產業規模雖大，但仍欠發展。我們應該開設新的礦場和工廠，這樣我們就不會浪費這些自然資源。"
 wuw_HUN_tap_newfound_oil_deposits: "挖掘新發現的石油儲藏"
 wuw_HUN_tap_newfound_oil_deposits_desc: "我國各地已發現許多小型油井，其中部分由匈美石油產業上市公司探明。而更值得注意的是在布達法普斯塔發現的油田，我們應該儘快開採它。"
 wuw_HUN_hungarian_autarky: "[ROOT.GetAdjective]式自給自足"
 wuw_HUN_hungarian_autarky_desc: "我們太依賴外國石油資源了。我們應該效仿德國在開發合成油方面的努力，強化我們的經濟，這樣我們才能自力更生。"
 wuw_HUN_invite_foreign_investors: "邀請外國投資者"
 wuw_HUN_invite_foreign_investors_desc: "[ROOT.GetNameDefCap]位於東歐腹地，我們完全可以利用這得天獨厚的地理位置，吸引那些有意投資基礎設施和工業發展的外國資本。"
 wuw_HUN_hungarian_tradition: "[ROOT.GetAdjective]傳統"
 wuw_HUN_hungarian_tradition_desc: "[ROOT.GetAdjective]傳統深深植根於潘諾尼亞草原上的農業，因此我們必須努力保護這些傳統並提高產量以便進一步發展。"
 wuw_HUN_magyar_allamvasutak: "匈牙利國家鐵路"
 wuw_HUN_magyar_allamvasutak_desc: "我們應該擴大我國國營鐵路公司，即匈牙利國家鐵路的業務，使其營運全國的每一列火車。這樣我們就能更全面地控制鐵路，使我們的鐵路網絡更高效地運轉。"
 wuw_HUN_expand_the_aluminum_industry: "發展鋁礦工業"
 wuw_HUN_expand_the_aluminum_industry_desc: "無論是出口還是自用，我們都需要竭盡所能地蒐羅任何可用的資源。儘管我國的鋁業已經有所發展，但也仍有擴張的空間。我們應立即對這個領域展開投資。"
 wuw_HUN_budapest_university_of_technology_and_economics: "擴大布達佩斯技術大學"
 wuw_HUN_budapest_university_of_technology_and_economics_desc: "我們需要更多優秀的頭腦集思廣益，幫助國家在未來的衝突當中實現技術上的突破。而通過對首都大學的擴建，我們可以顯著提升軍工領域的熟練工程師以及科研工作者人數。"
 wuw_HUN_the_matyasfold_fighter_factory: "馬賈什弗爾德戰鬥機工廠"
 wuw_HUN_the_matyasfold_fighter_factory_desc: "魏斯·曼弗雷德鋼鐵與金屬工廠應在布達佩斯的馬賈什弗爾德開設一家新的飛機生產設施，專門生產他們自行研發的戰鬥機機型。"
 wuw_HUN_expand_on_the_weiss_wm_16: "基於魏斯WM-16機型開展研發工作"
 wuw_HUN_expand_on_the_weiss_wm_16_desc: "我們應該在魏斯WM-16布達佩斯機型的基礎上開展研發工作，努力使我們的轟炸機生產達成新的技術突破。"
 wuw_HUN_develop_the_weiss_wm_21_solyom: "研發魏斯 WM-21 隼式"
 wuw_HUN_develop_the_weiss_wm_21_solyom_desc: "我們應該從之前失敗的飛機研發中學習總結，從而製造出魏斯WM-21紹約姆輕型轟炸機。無論我們的敵人在哪裡，這種“獵鷹”都能從天而降打擊他們。"
 wuw_HUN_weiss_manfred_wm_23_ezust_nyil: "魏斯·曼弗雷德WM-23銀箭"
 wuw_HUN_weiss_manfred_wm_23_ezust_nyil_desc: "我們需要儘快開發出新型戰鬥機，魏斯·曼弗雷德鋼鐵與金屬工廠的科學家已經研發出號稱的銀箭的藍圖，正在等待投入生產前的確認流程。"
 wuw_HUN_establish_the_mavag_aircraft_factory: "建立馬瓦格飛行器工廠"
 wuw_HUN_establish_the_mavag_aircraft_factory_desc: "霍爾蒂·伊斯特萬將與馬瓦格合作，建立新的飛機生產工廠，並將立即開始向匈牙利空軍交付新技術。"
 wuw_HUN_the_mavag_heja: "馬瓦格隼型"
 wuw_HUN_the_mavag_heja_desc: "基於意大利的雷賈納Re.2000機型，馬瓦格的飛行器部門研發出了新的原型機，他們將它命名為“隼型”。我們應該支持他們儘可能多地生產這種新機型。"
 wuw_HUN_repulo_muszaki_intezet: "航空技術研究所"
 wuw_HUN_repulo_muszaki_intezet_desc: "天空已成為戰爭的一個新領域，事實證明許多人低估了它的重要性。我們必須學會掌握這一新的維度，並分配資源來發展適於空戰的新學說和裝備。"
 wuw_HUN_develop_laszlo_vargas_design: "發展拉斯洛·沃爾高設計"
 wuw_HUN_develop_laszlo_vargas_design_desc: "我國傑出的航空科學家拉斯洛·沃爾高為我們的軍隊提出了許多自主設計，其中包括沃爾高RMI-1原型機。我們應該進一步資助他的活動，這樣我國的發展和進步才不會止步於此。"
 wuw_HUN_the_szekesfehervar_sosto_plant: "塞克什白堡-索斯托工廠"
 wuw_HUN_the_szekesfehervar_sosto_plant_desc: "我們應該開設一個由航空技術研究所控制的新飛機生產廠，可以生產前者設計的飛機，並對它們進行測試，以確保它們正常運行。"
 wuw_HUN_joint_air_development: "聯合空軍研發"
 wuw_HUN_joint_air_development_desc: "研發新機種的最佳方法是與盟國展開合作。通過彙集各國最優秀的人才集思廣益，我們定將取得最理想的結果。"
 wuw_HUN_the_arado_ar_96: "阿拉多 Ar 96"
 wuw_HUN_the_arado_ar_96_desc: "我們應該從[GER.GetAdjective]飛行器製造商阿拉多飛機制造廠獲得生產許可，並藉此將我們的飛機生產和使用的重點轉向空中偵察。"
 wuw_HUN_extensive_licensing_programs: "大規模生產許可項目"
 wuw_HUN_extensive_licensing_programs_desc: "外國空軍的表現已經證明，其擁有著歷經實戰考驗的高性能設計機種。因此，與其冒險靠我們剛剛起步的半吊子航空技術進行自研，還不如請求授權來生產這些外國機型。"
 wuw_HUN_allied_manufacturing_programs: "聯合制造計劃"
 wuw_HUN_allied_manufacturing_programs_desc: "我們的工業本身或許有一定實力，但無法與任何世界列強競爭。因此，我們應該在盟友的設施中生產新飛機，並向他們支付帕戈。"
 wuw_HUN_danuvia_submachine_guns: "達努維亞衝鋒槍"
 wuw_HUN_danuvia_submachine_guns_desc: "我們步兵需要好的武器來提高作戰效能。達努維亞43m原型的最初版本在測試中表現良好，通過增加其開發資金，我們很快就可以開始大量生產該武器。"
 wuw_HUN_form_the_gyorshadtest: "組建快速軍團"
 wuw_HUN_form_the_gyorshadtest_desc: "我們要努力建成一支能在戰鬥中勝過敵營的現代化、裝備精良的機械化部隊——快速軍團。因此，將創建兩支這樣的快速部隊，一支由少將葉內·毛約爾領導，另一支由少將費倫茨·比紹領導。"
 wuw_HUN_establish_the_mavag_army_division: "建立馬瓦格陸軍分部"
 wuw_HUN_establish_the_mavag_army_division_desc: "匈牙利皇家國家鋼鐵和機械工廠，也以其縮寫馬瓦格而聞名，負責許多單獨的項目，併為我們的軍隊提供各種各樣的裝備。我們應該要求增加他們的設施，這樣他們就可以開始幫助生產自動突擊炮和防空坦克。"
 wuw_HUN_doctrinal_studies: "學說研究"
 wuw_HUN_doctrinal_studies_desc: "我們在軍官交流會和戰略研討會議上從我們的盟友那學到了很多東西。結合不同的觀點可以讓我們的軍事理論得到新的突破。"
 wuw_HUN_award_military_promotions: "授予軍隊晉升"
 wuw_HUN_award_military_promotions_desc: "[ROOT.GetAdjective]軍隊中的確有很多優秀的人才，但目前他們中許多人並沒有擔任與其應得的軍銜相稱的職務。因此，我們應該採取措施，提拔我們認為合適的人，讓我們的軍隊比今天更強大。"
 wuw_HUN_magyar_kiralyi_csendorseg: "匈牙利皇家憲兵隊"
 wuw_HUN_magyar_kiralyi_csendorseg_desc: "我們應該努力擴建[ROOT.GetAdjective]憲兵隊，給予他們更多的自主權，並賦予他們在鎮壓叛亂和對抗敵方小規模衝突時更多的自由行動權。"
 wuw_HUN_legacy_of_the_black_legion: "黑軍的遺產"
 wuw_HUN_legacy_of_the_black_legion_desc: "為了讓我們的騎兵和憲兵更好地發揮作用，我們應該以我們的傳奇國王馬蒂亞斯·科維努斯的黑軍為榜樣，而這支黑軍又受到了羅馬將軍和皇帝尤利烏斯·凱撒的偉大軍隊的啟發。"
 wuw_HUN_light_infantry_divisions_doctrine: "輕型步兵師學說"
 wuw_HUN_light_infantry_divisions_doctrine_desc: "我們必須對我國有限的人力善加利用。如果我們想組建更多的師，就必須對師團編制進行縮編。輕型步兵師能兼顧突擊能力和部隊規模，因此我們要將其作為軍隊的核心力量。"
 wuw_HUN_szent_laszlo_infantry_division: "聖拉斯洛步兵師"
 wuw_HUN_szent_laszlo_infantry_division_desc: "我們應該致力於組建新的步兵部隊，以適當地保護我們的家園免受即將到來的威脅。我們可以用聖拉迪斯拉斯——1077年至1095年的匈牙利國王，也是軍人和流亡者的守護神——來命名這個新的步兵師。"
 wuw_HUN_quantity_over_quality: "質量勝過數量"
 wuw_HUN_quantity_over_quality_desc: "儘管我們的軍隊可能規模不大，但仍然可以通過增強它的戰鬥力來彌補這一點。為此需要提高我們對敵人的技術優勢，並使用尖端部隊擊敗在數量上遠遠超過我們的敵軍。"
 wuw_HUN_expand_the_army: "擴建匈牙利國民衛隊"
 wuw_HUN_expand_the_army_desc: "匈牙利國民衛隊是我們當前的常備軍，它的規模太小了，無法真正與我們的鄰國抗衡。因此，我們必須致力於儘快擴大軍隊的規模。"
 wuw_HUN_the_botond: "博通德卡車"
 wuw_HUN_the_botond_desc: "為了滿足我軍補給和運輸的需求，我們急需一款新型的卡車。而拉巴·博通德38M的原型車已在測試中被證明可用，只要調撥資源，我們就可以完善設計並開始量產。"
 wuw_HUN_the_turan: "圖蘭"
 wuw_HUN_the_turan_desc: "我們可以利用斯柯達T-21中型坦克原型的基礎，創造一種我們自己的中型坦克，足以突破敵人最堅固的防線。我們會將這個新項目命名為圖蘭，以推廣匈牙利圖蘭主義，並將其傳播到全世界。"
 wuw_HUN_assault_gun_focus: "發展突擊炮"
 wuw_HUN_assault_gun_focus_desc: "與其把注意力集中在成熟的坦克上，還不如依靠我們的突擊炮使步兵獲得突破能力，這是一種更划算的選擇。"
 wuw_HUN_the_toldi: "托爾迪"
 wuw_HUN_the_toldi_desc: "我們可以利用瑞典蘭斯韋克L-60的基礎，創造一種我們自己的輕型坦克，足以快速包圍大量敵軍。我們會以14世紀匈牙利騎士托爾迪·米克羅什的姓氏命名這種新坦克。"
 wuw_HUN_invest_in_the_special_forces: "投資特種部隊"
 wuw_HUN_invest_in_the_special_forces_desc: "我們的軍隊雖說現在已經擁有了進行正式作戰所需的兵員，但對我們來說，對新兵進行強化訓練並投資新的特種部隊計劃，將是非常有益的。"
 wuw_HUN_construct_the_arpad_line: "建造阿爾帕德防線"
 wuw_HUN_construct_the_arpad_line_desc: "為了保護我們的人民免受來自東部的威脅，我們必須在特蘭西瓦尼亞山脈建造一條龐大的防線。這些防線將以9世紀至10世紀之交匈牙利部落聯盟的阿爾帕德大公的名字命名。"
 wuw_HUN_transylvanian_mountaineers: "特蘭西瓦尼亞山地步兵"
 wuw_HUN_transylvanian_mountaineers_desc: "特蘭西瓦尼亞山脈是我們地區最高的山脈之一，是我們訓練山地部隊的理想之地。"
 wuw_HUN_expand_the_arpad_line: "擴建阿爾帕德防線"
 wuw_HUN_expand_the_arpad_line_available_tt: "可以在§Y[73.GetName]§!和§Y[76.GetName]§!的北部和東部邊界建造至少2座§Y陸上要塞§!"
 wuw_HUN_expand_the_arpad_line_desc: "到目前為止，阿爾帕德防線被證明行之有效，但如果我們想要真正阻止攻擊的浪潮，就必須擴建它，不僅在規模上，還要在範圍上。"
 wuw_HUN_construct_the_szeretfalva_deda_railway_line: "塞賴特福爾沃-代道鐵路線"
 wuw_HUN_construct_the_szeretfalva_deda_railway_line_desc: "為了更好地補給駐守在特蘭西瓦尼亞山脈的阿爾帕德線前線的部隊，我們必須建設新的鐵路線和後勤中心，以使我們的部隊能夠更好地保護我們的人民。"
 wuw_HUN_the_szekel_command: "塞凱伊指揮官"
 wuw_HUN_the_szekel_command_desc: "由於我們最近重新徵服了[76.GetName]以及塞凱伊地區，我們可以讓我們的塞凱伊人在我軍的精英部隊中服役，這些匈牙利人是山區導航和作戰方面的專家。"
 wuw_HUN_renew_the_shipping_industry: "復興造船業"
 wuw_HUN_renew_the_shipping_industry_desc: "為了收復領土，我們必須著手發展一隻能與往日榮光相媲美的地中海艦隊。"
 wuw_HUN_embrace_navy_traditions: "繼承海軍傳統"
 wuw_HUN_embrace_navy_traditions_desc: "我們不能把時間浪費在試驗新的、未經證實的技術上。我們將堅持舊帝國時代的經過試驗和測試設計。"
 wuw_HUN_a_reformed_navy: "改革後的海軍"
 wuw_HUN_a_reformed_navy_desc: "抱著過時的觀念來建立海軍是毫無意義的。而今，既然我們有機會摒棄舊日的負擔，重新建立一支嶄新的海軍，那麼我們就應該抓住機遇，締造出最為現代化的勝利艦隊。"
 wuw_HUN_invest_in_destroyer_models: "投資驅逐艦型號"
 wuw_HUN_invest_in_destroyer_models_desc: "驅逐艦是艦隊中至關重要但經常被忽視的一部分。再加上低成本，它們對任何海軍擴張計劃來說都是好的開始。"
 wuw_HUN_cruiser_investments: "巡洋艦投資"
 wuw_HUN_cruiser_investments_desc: "即使是最強大的艦隊，如果不能找到敵人或保護自己免受飛機的傷害，也是無用的。設計新的輕型和重巡洋艦有助於我們將一批船隻轉變為一支真正的艦隊。"
 wuw_HUN_wolfs_of_the_sea: "海中狼群"
 wuw_HUN_wolfs_of_the_sea_desc: "在上一次戰爭中，潛艇幾乎擊敗了世界上最強大的海軍。如果我們不擁有自己的潛艇，我們就不能被認為是現代海軍。"
 wuw_HUN_bringing_the_air_battle_to_the_seas: "把空戰帶到海上"
 wuw_HUN_bringing_the_air_battle_to_the_seas_desc: "戰列艦是很久以前的遺物。海戰的未來是航母和飛機。我們將走在這個發展的最前沿。"
 wuw_HUN_capital_ship_efforts: "聚焦主力艦"
 wuw_HUN_capital_ship_efforts_desc: "海軍的核心是戰列艦。我們必須彌補失去的時間，儘快開始建造新船。"
 wuw_HUN_a_new_pride_of_the_fleet: "新艦隊榮耀"
 wuw_HUN_a_new_pride_of_the_fleet_desc: "我們海軍傳統的豐富歷史充滿了考驗、磨難和背叛。為了恢復我們遺產的榮光並振奮全國上下，海軍將領們提議建造一艘新旗艦。"
 wuw_HUN_degauss_ship_hulls: "消磁船體"
 wuw_HUN_degauss_ship_hulls_desc: "我們將開始對我們的船體進行消磁，減少它們的磁信號。這將保護它們免受磁性水雷的傷害，並減少船隻的電子特徵。"
 wuw_HUN_continue_the_regency: "延續攝政"
 wuw_HUN_continue_the_regency_desc: "自霍爾蒂海軍上將在20年代初的內戰期間掌權以來，儘管華爾街崩盤對我國造成了影響，[HUN.GetNameDef]仍舊漸漸地持續迴歸正軌。如果我們希望延續繁榮，他就必須繼續攝政。"
 wuw_HUN_strengthen_horthys_reign: "加強霍爾蒂的統治"
 wuw_HUN_strengthen_horthys_reign_desc: "儘管我們的法西斯首相可能有其他想法，但維持國家和平並恢復[ROOT.GetNameDef]往日輝煌的最好辦法就是讓攝政官鞏固他的控制，並親自確保他的意志得到執行。"
 wuw_HUN_pass_statute_xix: "通過第十九號法令"
 wuw_HUN_pass_statute_xix_desc: "鑑於[ROOT.GetLeader]身體欠佳，通過關於在攝政官職位空缺時建立國民議會的第十九號法令是有益之舉。這能讓我們在現任攝政官離世時通過國民議會選出新任攝政官。有些人可能覺得這是試圖建立王朝，但我們不介意。"
 wuw_HUN_restrict_voting_rights: "限制投票權"
 wuw_HUN_restrict_voting_rights_desc: "為了妥善遏止日漸增長的共產主義和左翼民主主義影響，必須限制投票權，收緊條件要求，確保只有那些為我們國家著想的人才能參加選舉。"
 wuw_HUN_renounce_the_treaty_of_trianon: "撕毀《特里亞農條約》"
 wuw_HUN_renounce_the_treaty_of_trianon_desc: "上次大戰之末強加給我國的不平等條約，奪走了曾為泱泱大國的我國三分之二的領土和人口，這恥辱堪比凡爾賽條約之於德國。我們必須洗刷這一恥辱。"
 wuw_HUN_renew_the_rome_protocols: "重申羅馬議定書"
 wuw_HUN_renew_the_rome_protocols_desc: "鑑於[GER.GetNameDef]正在修正主義的歧途上漸行漸遠，我們必須重申在1934年起草簽署的羅馬議定書。這些協議不僅將進一步隔絕來自[GER.GetAdjective]和[YUG.GetAdjective]的威脅，甚至還可能成為一個真正聯盟體系的前身。"
 wuw_HUN_join_the_axis: "加入軸心國"
 wuw_HUN_join_the_axis_desc: "鑑於我國經濟已與德國密不可分，因此在戰時追隨他們是唯一合乎邏輯的選擇。為此，我們將向他們遞交申請，正式加入軸心國集團。"
 HUN_can_not_trust_germany_again_flag: "德國為了自身利益剝削了我們"
 wuw_HUN_an_alliance_with_italy: "與[ITA.GetNameDef]結盟"
 wuw_HUN_an_alliance_with_italy_desc: "現在可以對羅馬議定書最初提議的聯盟進行擴展了。為此，我們將派遣代表團訪問意大利，討論簽署一項具有約束效力、在攻防兩方面進行廣泛軍事合作的協議。"
 wuw_HUN_joint_aluminum_mining_company: "聯合鋁業公司"
 wuw_HUN_joint_aluminum_mining_company_desc: "鑑於鋁是現代戰爭工業中不可或缺的資源，我們可以很容易地從[GER.GetAdjective]方面得到援助，進而擴大我國北部鋁礦的採掘。"
 wuw_HUN_reestablish_the_rongyos_garda: "重建襤衫軍"
 wuw_HUN_reestablish_the_rongyos_garda_desc: "準軍事部隊“襤衫軍”是1921年首次成立的，成立目的是對抗特里亞農條約，支援我們在萊塔班沙格對抗奧地利人，以及在內戰期間與霍爾希的國民衛隊並肩作戰。他們的長官帕爾‧普魯奈現在又準備好再次幫助我們，因此重建這樣的組織將對我們有益。"
 wuw_HUN_the_hungarian_life_and_renewal_party: "匈牙利生活與復興黨"
 wuw_HUN_the_hungarian_life_and_renewal_party_desc: "為了更好地控制社會，我們應該讓我們的首相組建新的政黨，充當對抗激進左派的先鋒。"
 wuw_HUN_act_of_defense: "防衛法案"
 wuw_HUN_act_of_defense_desc: "世界在升溫，衝突在醞釀，我們必須為即將到來的風暴做好準備。是時候制定新的法律來幫助我們保衛我們的國家了，如果需要的話，戰鬥到最後一個人！"
 wuw_HUN_seek_german_contracts: "尋求[GER.GetAdjective]的合同"
 wuw_HUN_seek_german_contracts_desc: "我們的工業正在再次增長，但如果我們要生產我們需要的所有設備，與[GER.GetAdjective]建築師和建築公司簽訂合同來建設新設施將頗有益處。"
 wuw_HUN_license_fiat_tankettes: "菲亞特小坦克"
 wuw_HUN_license_fiat_tankettes_desc: "為了強化我國軍事產業並擴編偵察連，明智的選擇應該是與[ITA.GetAdjective]載具公司菲亞特合作，為我們新的機械化集群生產輕型坦克和小坦克。"
 wuw_HUN_strenghten_the_order_of_vitez: "加強維泰茲騎士團"
 wuw_HUN_strenghten_the_order_of_vitez_desc: "1920年成立的維泰茲騎士團由尊貴的霍爾蒂·米克洛什領導，他可以引導更多的資金和人力向該團的指揮官們集中，儘可能地加強這支部隊。"
 wuw_HUN_absolute_rule_of_the_national_unity_party: "利用國家統合黨"
 wuw_HUN_absolute_rule_of_the_national_unity_party_desc: "通過利用現任首相所在的統一黨，[ROOT.GetLeader]可以有效地控制[ROOT.GetAdjective]政治，在不完全禁止選舉的情況下有效地左右局勢。"
 wuw_HUN_spur_on_the_trianon_trauma: "特里亞農創傷的刺激"
 wuw_HUN_spur_on_the_trianon_trauma_desc: "大家都知道[ROOT.GetNameDef]的過去比現在要好。都是因為那個該死的特里亞農條約，我們失去了三分之二的合法土地，分給了那些利用了我們的弱勢地位的鄰國們。當[ROOT.GetAdjective]軍隊進軍奪回那些土地的時候，他們會知道什麼是恐懼。"
 wuw_HUN_outlaw_the_party_of_national_will: "宣佈國民意志黨非法"
 wuw_HUN_outlaw_the_party_of_national_will_desc: "由薩拉希·費倫茨領導的國家社會主義政黨國民意志黨是對我們當前統治的威脅，因為他們在[GER.GetAdjective]納粹中更受歡迎，不喜歡我們現任領導人近乎絕對的統治。"
 wuw_HUN_carrying_on_arpads_legacy: "延續阿爾帕德的遺產"
 wuw_HUN_carrying_on_arpads_legacy_desc: "偉大的阿爾帕德是9世紀至10世紀之交匈牙利部落聯盟的首領，極大鼓舞了[ROOT.GetLeader]，他的王朝持續了很久，使[ROOT.GetnameDef]日臻完美。我們應該向他學習，並以他為榜樣。"
 wuw_HUN_the_turul_association: "圖魯爾協會"
 wuw_HUN_the_turul_association_desc: "圖魯爾協會是在布達佩斯一場大學運動中於1919年成立的。他們在內戰和1921年秋天的布達厄爾什戰役期間堅定地支持霍爾蒂·米克洛什。該組織擁有大約40000名成員，我們可以利用他們來控制我們國家的教育。"
 wuw_HUN_demand_transylvania: "索取特蘭西瓦尼亞"
 wuw_HUN_demand_transylvania_desc: "如果我們能在不流血的情況下奪回世界大戰後失去的領土，那就再好不過了。非法佔領我們塞凱伊兄弟的那些人將收到最後通牒，並被要求交回我們的合法土地。"
 wuw_HUN_strengthen_the_turani_vadaszok: "加強圖拉尼獵人協會"
 wuw_HUN_strengthen_the_turani_vadaszok_desc: "1927年，根伯什·久洛創建了名為圖拉尼獵人協會的法西斯準軍事力量。儘管他們是法西斯分子，但他們反對德國國家社會主義的觀念，並且該組織建立在匈牙利主義和匈牙利圖拉尼主義的理念之上。如果我們願意，可以讓他們為我們所用。"
 wuw_HUN_demand_southern_slovakia: "索取[664.GetName]"
 wuw_HUN_demand_southern_slovakia_desc: "[664.GetName]的[ROOT.GetAdjective]少數民族目前正受到佔領政府的虐待和剝削，因此，我們必須確保[ROOT.GetAdjective]人及其所在地區再次為我們所控。"
 wuw_HUN_claim_overlordship_over_slovakia: "索取[SLO.GetNameDef]宗主權"
 wuw_HUN_claim_overlordship_over_slovakia_desc: "斯洛伐克的其餘部分也必須通過直接合並亦或是成為附屬國的方式重新併入匈牙利。為此，我們將再次遞交最後通牒。"
 wuw_HUN_invite_german_investors: "邀請[GER.GetAdjective]投資者"
 wuw_HUN_invite_german_investors_desc: "正如我們之前的貿易協議所確定的，目前只有[GER.GetAdjective]人和[ROOT.GetAdjective]人被允許在我們國家進行勘探。至少應該利用這一點並邀請投資者來我國。"
 wuw_HUN_protect_austria: "保護[AUS.GetNameDef]"
 wuw_HUN_protect_austria_desc: "為了進一步對抗[GER.GetNameDef]，我們必須阻止他們合併[AUS.GetNameDef]的野心。我們可以作出承諾，給予現任政府他們所需要的政治力量，以支持他們對抗親[GER.GetAdjective]分子，前提是他們把布爾根蘭還給我們。"
 wuw_HUN_proclaim_greater_hungary: "宣告大匈牙利"
 wuw_HUN_proclaim_greater_hungary_desc: "在收復了我們的法理領土後，我國的疆域已經拓展至歷史上的界線。我們現在可以自信地向世人宣告大匈牙利的成立，並將目光投向新的目標。"
 wuw_HUN_demand_the_return_of_slovakia: "要求整合[SLO.GetAdjective]"
 wuw_HUN_demand_the_return_of_slovakia_desc: "長期以來，[SLO.GetNameDef]都是大匈牙利的一部分，而如今我們再次追求在世界上的地位，我們應該主張對該地區的所有權。"
 wuw_HUN_promote_hungarianism: "推動匈牙利主義"
 wuw_HUN_promote_hungarianism_desc: "為了再次奪回我們過去的榮耀，我們必須支持那些渴望這一目標的人，無論這些人有多激進。因此，我們應該推廣基於天主教主教普羅哈斯考·歐托卡爾的訓導所發展出的匈牙利主義思想——無論代價如何，都要為匈牙利的利益而奮鬥。"
 wuw_HUN_demand_the_vojvodina: "索取伏伊伏丁那"
 wuw_HUN_demand_the_vojvodina_desc: "巴奇卡地區一直是我國不可分割的一部分，但在大戰結束後，它被[YUG.GetAdjective]政府從我們手中奪走了。我們必須消除這種歷史不公，收回屬於我們的領土！"
 wuw_HUN_demand_carpathian_ruthenia: "索取喀爾巴阡魯塞尼亞"
 wuw_HUN_demand_carpathian_ruthenia_desc: "自1919年奸詐的胡楚爾共和國宣佈獨立以來，喀爾巴阡魯塞尼亞地區的[ROOT.GetAdjective]人長期受到外國政權的壓迫。為了我們的人民，我們必須收復這片土地！"
 wuw_HUN_demand_burgenland: "索取布爾根蘭"
 wuw_HUN_demand_burgenland_desc: "勇敢的襤衫軍在世界大戰末期建立了萊塔班沙格，以期控制該地區並恢復[HUN.GetAdjective]對該地區的統治，但最終被奪走並被併入奧地利。如果我們想恢復我們的榮譽，我們必須收復這個地區。"
 wuw_HUN_reaffirm_territorial_claims: "重申領土主張"
 wuw_HUN_reaffirm_territorial_claims_desc: "隨著《特里亞農條約》被否決，我們現在必須重申我們對被偷走的領土的主權要求。"
 wuw_HUN_end_the_regency: "結束攝政"
 wuw_HUN_end_the_regency_desc: "霍爾蒂作為攝政王已經做得很好，但現在終於是時候再次尋找一個願意掌管[ROOT.GetAdjective]王位的國王了。我們需要一位新的君主，無論來自哈布斯堡家族，還是更符合小協約國願望的人。"
 wuw_HUN_crack_down_on_radicals: "打擊激進分子"
 wuw_HUN_crack_down_on_radicals_desc: "國內有許多民兵和政治組織反對恢復君主制。我們必須確保限制他們的影響力，並解散任何準軍事組織，以免他們日後給我們帶來問題。"
 wuw_HUN_reach_out_to_candidates: "聯繫候選人"
 wuw_HUN_reach_out_to_candidates_desc: "我們必須組建一個委員會負責尋找合適的王位候選人。最合適的候選人是奧托，哈布斯堡領地目前的繼承人，以及約瑟夫·奧古斯特，我們最近的國王，同樣屬於哈布斯堡家族。然而，小協約國禁止我們擁立哈布斯堡血統的國王，所以我們可能需要尋找其他可能的候選人。"
 wuw_HUN_subvert_gombos_troops: "顛覆根伯什的軍隊"
 wuw_HUN_subvert_gombos_troops_desc: "法西斯極端主義首相根伯什·久洛掌管著多個準軍事民兵組織，其中最大的是匈牙利國防協會。我們必須確保在這些組織對我們的新王國構成威脅之前消滅他們。"
 wuw_HUN_reinstate_the_pragmatic_sanction: "重新實施1713年《國事遺詔》"
 wuw_HUN_reinstate_the_pragmatic_sanction_desc: "1713年《國事遺詔》是由神聖羅馬帝國皇帝查理六世頒佈的，以確保哈布斯堡的領地可以完完整整地由女兒繼承，本質上這部詔令認為我們的國家未來將是哈布斯堡的土地。在查理四世未遂的政變之後，詔令被撤銷。為了恢復這種統治，我們必須重新實施《國事遺詔》，即便這會違背小協約國的意願。"
 wuw_HUN_aid_the_carlist_struggle: "援助卡洛斯派"
 wuw_HUN_aid_the_carlist_struggle_desc: "西班牙卡洛斯派正為恢復該國傳統價值觀，並讓正統君主再次登上王位進行一場崇高的戰爭。如果我們未來需要一個該區域內的潛在盟友，在西班牙內戰中幫助一個與我們聯繫密切的派系獲得勝利將是明智之舉。"
 wuw_HUN_invite_otto_to_the_throne: "邀請奧托登基"
 wuw_HUN_invite_otto_to_the_throne_desc: "哈布斯堡王朝曾長期統治匈牙利，在他們的統治下，匈牙利是歐洲最偉大帝國之一的一部分。讓一位意圖恢復奧匈帝國的哈布斯堡重新掌權，必將帶領我們再次走向偉大。作為整個帝國的合法繼承人，他將是我們恢復奧匈帝國的關鍵。"
 wuw_HUN_attempt_economic_independence: "嘗試經濟獨立"
 wuw_HUN_attempt_economic_independence_desc: "如果我們要恢復昔日的輝煌，就不能依靠外國勢力來改善和管理我們的經濟。只有靠我們自己的雙手，國家才能再次繁榮起來！"
 wuw_HUN_the_lands_of_the_crown_of_saint_stephen: "聖斯蒂芬王冠領地"
 wuw_HUN_the_lands_of_the_crown_of_saint_stephen_desc: "作為奧匈帝國的一部分，我們被稱為聖斯蒂芬王冠領地，或簡稱外萊塔尼亞。作為我們重塑帝國的第一步，我們應該再次採用這個名字。這將向世界展示我們的真正意圖。"
 wuw_HUN_the_old_habsburg_king: "舊哈布斯堡國王"
 wuw_HUN_the_old_habsburg_king_desc: "奧地利的約瑟夫·奧古斯特大公是最後一任匈牙利巴拉丁，且曾照查理之命出任帝國攝政，直到協約國因不認可由哈布斯堡家族擔任國王而要求他辭職。現在，他已經準備好再次登上王位，以神聖國王的身份統治匈牙利。作為前任元帥，他的戰爭知識肯定會派上用場。"
 HUN_feldmarchall_augusts_expertise: "約瑟夫·奧古斯特元帥的專長"
 wuw_HUN_secure_army_loyalty: "確保軍隊忠誠"
 wuw_HUN_secure_army_loyalty_desc: "為了確保軍隊站在我們一邊，讓我們能安全地將資金投入其中，我們必須確保清除任何對君主忠誠有問題的指揮官。"
 wuw_HUN_royal_hussars: "皇家驃騎兵"
 wuw_HUN_royal_hussars_desc: "我們人民有著悠久且驕傲的騎兵傳統，至今也是如此。必須建立一支精銳騎兵部隊，作為保護陛下安全的王室衛隊。"
 wuw_HUN_abide_by_the_little_ententes_stipulations: "遵守小協約國的規定"
 wuw_HUN_abide_by_the_little_ententes_stipulations_desc: "自世界大戰結束後，由羅馬尼亞、捷克斯洛伐克和南斯拉夫組成的小協約國規定，我們再也不能有哈布斯堡家族的國王了。坦率地說，這很適合我們，因為我們心中還有另一位王位候選人。"
 wuw_HUN_elect_a_democratic_king: "推舉立憲君主"
 wuw_HUN_elect_a_democratic_king_desc: "我們必須推選一位維護國家民主原則和人民權利的國王，為了做到這一點，我們必須將目光轉向北歐的社會民主主義君主立憲制國家，看看他們是否有任何潛在的候選人可以擔任我們的國王。"
 wuw_HUN_honor_the_great_war_veterans: "向世界大戰老兵致敬"
 wuw_HUN_honor_the_great_war_veterans_desc: "儘管新的、聰明的指揮官掌握著未來，但我們不能忘記我們對世界大戰老兵的虧欠，他們為保護我們人民的家園而戰。我們應該授予他們勳章，確保在未來有更多人願意效仿他們。"
 wuw_HUN_the_legacy_of_the_isonzo_front: "伊松佐前線的遺產"
 wuw_HUN_the_legacy_of_the_isonzo_front_desc: "約瑟夫·奧古斯特陛下為奧匈帝國服役，在俄羅斯、塞爾維亞和意大利戰線上領導了許多戰鬥。然而，最值得注意的是，他認為在伊松佐戰役中使用的戰術鼓舞人心，試圖實施這項前線制定的軍事戰略。"
 wuw_HUN_the_bastion_of_catholicism: "天主教的堡壘"
 wuw_HUN_the_bastion_of_catholicism_desc: "我們的國民大多信奉天主教，君主也是如此。現在是時候讓匈牙利使徒王國承擔起基督之盾的責任，將不信神的共產主義者趕出我們的大陸了。"
 wuw_HUN_enact_agrarian_reform: "實施農業改革"
 wuw_HUN_enact_agrarian_reform_desc: "我們的農業有很大的改進空間。精簡人數、提高效率可以解放農業勞動力，將其投入建設和武器生產等其他領域。"
 wuw_HUN_demand_austrian_restoration: "要求奧地利復辟"
 wuw_HUN_demand_austrian_restoration_desc: "奧地利，或者用當時的稱呼內萊塔尼亞，是我們聯邦帝國不可分割的一部分。我們要再次確保哈布斯堡對他們國家的統治，並將我們兩個王國統一在一個聯邦之下，現在這比以往任何時候都更重要。"
 wuw_HUN_seek_an_alliance_with_the_kaiser: "尋求與德皇結盟"
 wuw_HUN_seek_an_alliance_with_the_kaiser_desc: "隨著曾經的[GER.GetAdjective]帝國復辟，我們應該明智地恢復與[GER.GetLeader]過去的聯繫，嘗試撤銷在大戰結束後施加在我們身上的糟糕條例。"
 wuw_HUN_a_grand_habsburg_alliance: "哈布斯堡同盟"
 wuw_HUN_a_grand_habsburg_alliance_desc: "沒有人能比自己的親人更值得信任，縱觀歷史，所有人都對抗過偉大的哈布斯堡家族。因此，我們應該僅在家族內部締結同謀，組建一個僅由哈布斯堡統治的國家組成的陣營。"
 wuw_HUN_the_old_grand_alliance: "恢復大同盟"
 wuw_HUN_the_old_grand_alliance_desc: "早在1689年，我們就與代表荷蘭共和國和英格蘭的威廉三世共同簽署了一項條約。目標是組建一個聯盟來遏制法國的擴張政策。現在，世界再次燃燒，我們需要恢復這個舊聯盟，來確保大陸的安全。"
 wuw_HUN_demand_wiedist_restoration: "要求維德王朝復辟"
 wuw_HUN_demand_wiedist_restoration_desc: "威廉·維德親王曾作為舊同盟國的盟友統治阿爾巴尼亞公國。然而，在那次世界大戰結束後，他被不公正地廢黜，多年後，令人憤慨的偽王艾哈邁德·索古竊取了阿爾巴尼亞的寶座。我們必須立即糾正這個錯誤！"
 wuw_HUN_a_habsburg_poland: "哈布斯堡波蘭"
 wuw_HUN_a_habsburg_poland_desc: "波蘭的土地曾經是潛在的哈布斯堡領地，現在是時候再次擴大哈布斯堡王朝控制的土地了。我們應該聯繫波蘭政府，要求他們恢復王國，讓卡爾·阿爾布雷希特登上王位。"
 wuw_HUN_habsburg_ascension_in_spain: "哈布斯堡登基西班牙"
 wuw_HUN_habsburg_ascension_in_spain_desc: "哈布斯堡家族曾長期統治西班牙。我們應該嘗試在西班牙恢復君主制，利用西班牙人擴大哈布斯堡同盟，從側面包抄我們在西歐的對手。"
 wuw_HUN_reenlist_the_sich_riflemen: "再召烏克蘭塞契步槍軍"
 wuw_HUN_reenlist_the_sich_riflemen_desc: "烏克蘭塞契步槍軍在世界大戰期間曾為我方作戰，隨後又在俄國內戰期間為建立一個自由的烏克蘭國家而戰。我們應該重建這支軍事單位，由奧地利的威廉·弗朗茨哈布斯堡大公，一位被其稱為瓦西里·維什萬尼的，舊時頗受其歡迎的指揮官統領。"
 wuw_HUN_the_kingdom_of_ukraine: "烏克蘭王國"
 wuw_HUN_the_kingdom_of_ukraine_desc: "世界大戰後，我們在德意志帝國的幫助下在烏克蘭建立了一個新的國家。然而，它後來被布爾什維克所摧毀，但現在我們再次控制了烏克蘭本土，並可以在那裡建立一個由哈布斯堡家族領導的新王國。"
 wuw_HUN_restore_the_georgian_monarchy: "復辟格魯吉亞君主制"
 wuw_HUN_restore_the_georgian_monarchy_desc: "我們的聯絡人已聯繫到了流亡的喬治·巴格拉季翁·穆赫拉尼王子，他是格魯吉亞王位的合法繼承人。他保證永遠支持我們的事業只要我們答應解放他的家園並恢復那裡的君主制。現在輪到我們採取行動了。"
 wuw_HUN_protect_czechoslovakia: "保護捷克斯洛伐克"
 wuw_HUN_protect_czechoslovakia_desc: "自[CZE.GetNameDefCap]獨立以來，它逐漸強大，百業興旺，但它的土地被鄰國貪婪地覬覦。我們將保護他們免受這些威脅，要麼再次歡迎他們成為我們帝國不可分割的一部分，要麼授予他們聯盟地位。"
 wuw_HUN_reclaim_transylvania: "收回特蘭西瓦尼亞"
 wuw_HUN_reclaim_transylvania_desc: "大戰結束時，[ROM.GetAdjective]佔領了我們已統治數個世紀的特蘭西瓦尼亞。時間還沒過去多久，我們的人民還清楚地記得這件事。是時候為我們自己奪回這些土地了。"
 wuw_HUN_a_hungarian_galicia: "[ROOT.GetAdjective]加利西亞"
 wuw_HUN_a_hungarian_galicia_desc: "加利西亞和布科維納曾經由內萊塔尼亞統治，但現在我們是帝國的主導者，我們才應是這些領土的保護者與管理者。"
 wuw_HUN_reintigrate_slovakia: "重新整合斯洛伐克"
 wuw_HUN_reintigrate_slovakia_desc: "斯洛伐克幾個世紀以來曾一直是[ROOT.GetAdjective]領土的一部分，而且可惡的特里亞農條約剝奪了我們這些土地。是時候將我們的北部地區重新納入版圖了。"
 wuw_HUN_press_maximilians_and_the_iturbides_claims: "索取馬克西米利安和伊圖爾維德王朝的宣稱"
 wuw_HUN_press_maximilians_and_the_iturbides_claims_desc: "墨西哥由伊圖爾維德家族宣告建立了第一帝國，後來，在第二帝國時又由馬克西米利安·馮·哈布斯堡統治，直到他被不公正地處決。目前的皇位繼承人是被他收養的瑪麗亞·約瑟法·索菲婭·德·伊圖爾維德，我們將確保她能夠奪回皇位！"
 wuw_HUN_the_triple_kingdom: "三元君主制"
 wuw_HUN_the_triple_kingdom_desc: "在世界大戰結束時，甚至在此之前，有人曾討論廢除二元君主制，以三元君主制取而代之，其中包括克羅地亞-斯拉沃尼亞的王冠。我們現在應該努力兌現這些承諾，這樣我們的帝國就不會在未來再次崩潰。"
 wuw_HUN_restore_the_lombardo_venetian_kingdom: "恢復倫巴第-威尼西亞王國"
 wuw_HUN_restore_the_lombardo_venetian_kingdom_desc: "在1815至1866年間，倫巴第-威尼西亞王國是我們帝國的一部分，在第三次意大利獨立戰爭中被新成立的意大利王國奪走。現在是時候回到半島，嘗試恢復哈布斯堡對這曾經的王冠領地的統治了。"
 wuw_HUN_restore_the_duchy_of_teschen: "恢復泰申公國"
 wuw_HUN_restore_the_duchy_of_teschen_desc: "西里西亞的土地被波希米亞統治了很長一段時間，後來也一起併入了帝國。然而，在奧地利王位繼承戰爭後，它被普魯士偷走了，我們沒有忘記這一點。我們必須“回報”他們，併為自己奪回這片土地！"
 wuw_HUN_reclaim_the_holy_city: "收復聖城"
 wuw_HUN_reclaim_the_holy_city_desc: "在1291年，埃及馬穆魯克王朝征服並摧毀了耶路撒冷王國，但我們皇帝仍通過洛林家族的利奧波德一世獲得了耶路撒冷國王的頭銜。現在是時候讓我們，天主教信仰的守護者，收復聖城耶路撒冷，做到十字軍都未能做到的事了。"
 wuw_HUN_a_holy_empire: "神聖帝國"
 wuw_HUN_a_holy_empire_desc: "現在耶路撒冷聖地由真正的耶路撒冷國王控制，耶路撒冷王國終於光復了，我們可以藉此尋求教宗的降福。這將使我們帝國的人民理解君主在我們國家中的角色，並理解他們確實是被天主選中的。"
 wuw_HUN_a_holy_empire_tt: "§Y奧托·馮·哈布斯堡§!和他的附庸會得到教宗的祝福"
 wuw_HUN_a_multi_ethnic_empire: "多民族帝國"
 wuw_HUN_a_multi_ethnic_empire_desc: "我們的帝國囊括了許多不同的民族和文化，這是我們必須完全接受的，將自治權大幅給予我國這些迥異的地區，可以在未來的歲月裡使我們的人民更願意作為我國的一份子安居樂業。"
 wuw_HUN_reverse_the_risorgimento: "逆轉復興運動"
 wuw_HUN_reverse_the_risorgimento_desc: "意大利的統一是統治者一系列不負責任的選擇給世界帶來的錯誤，也是奧匈帝國的悲劇。只有糾正這個錯誤，世界才能從中恢復過來！"
 wuw_HUN_reverse_the_risorgimento_tt: "§Y[ROOT.GetNameDefCap]§!會將§Y復興運動前§!控制的§Y意大利半島§!地區釋放為§Y附屬國§!，並加強它們"
 wuw_HUN_integrate_bohemian_and_austrian_industries: "整合波希米亞-奧地利工業"
 wuw_HUN_integrate_bohemian_and_austrian_industries_desc: "組成我們帝國的一部分的這些地區自身擁有強大的工業。既然他們再次被納入我們的版圖，將它們整合進我們全國的工業體系方為明智之舉。"
 wuw_HUN_renovato_imperii: "重建帝國"
 wuw_HUN_renovato_imperii_desc: "“羅馬帝國復興”是恢復或復興羅馬帝國的願景，這個口號自創造以來被多次使用。我們也應進行效仿：正式宣佈我們恢復奧匈帝國的願景，並使它再次偉大！"
 wuw_HUN_renovato_imperii_tt: "解鎖§Y整合帝國附屬國§!進入國家的決議，以及§Y核心化舊奧匈帝國領土§!的能力"
 wuw_HUN_revenge_for_the_brusilov_offensive: "為布魯西洛夫突破復仇"
 wuw_HUN_revenge_for_the_brusilov_offensive_desc: "俄國人在世界大戰初期羞辱了我們，特別是他們大獲全勝的布魯西洛夫攻勢。我們必須確保我們有統一的民族精神來報復那些羞辱過我們的人，尤其是俄羅斯人。如此，我們也會有機會重建屬於哈布斯堡的烏克蘭。"
 wuw_HUN_purchase_burgenland: "購買布爾根蘭"
 wuw_HUN_purchase_burgenland_desc: "被[AUS.GetAdjective]稱為布爾根蘭的地區，長達數個世紀曾是[ROOT.GetAdjective]領土的一部分，但它被特里亞農條約從我們這裡奪走。鑑於他們的經濟目前處於混亂狀態，我們應該向他們的政府提出一項提議：向他們支付一大筆錢，以換取該地區。"
 wuw_HUN_the_legacy_of_arpad_andrew_and_matthias: "阿爾帕德、安德魯和馬蒂亞斯的遺產"
 wuw_HUN_the_legacy_of_arpad_andrew_and_matthias_desc: "阿爾帕德、威尼斯人安德魯三世和馬蒂亞斯·科爾維努斯是我們古老國家最偉大的英雄統治者。如果約瑟夫·奧古斯特想要不辜負他們的傳奇，他必須要奪回曾經屬於他們的一切，徹底地擁抱他們的精神，將他們的精神帶到未來。"
 wuw_HUN_a_declaration_of_intentions: "宣佈意圖"
 wuw_HUN_a_declaration_of_intentions_desc: "是時候向全世界明確我們的意圖，並向他們展示[ROOT.GetAdjective]人的優越本質了。"
 wuw_HUN_undoing_the_yugoslav_mistake: "糾正南斯拉夫的錯誤"
 wuw_HUN_undoing_the_yugoslav_mistake_desc: "創建南斯拉夫是人類歷史上最大的錯誤之一，我們必須竭盡全力收復斯洛文尼亞人、克羅地亞人和塞爾維亞人的舊國土。匈牙利將再次崛起！"
 wuw_HUN_undoing_the_yugoslav_mistake_tt: "解鎖決議，在過去斯洛文尼亞人、克羅地亞人和塞爾維亞人的地區§Y重新整合舊匈牙利領土§!"
 wuw_HUN_reclaim_the_slovak_possessions: "收復斯洛伐克國土"
 wuw_HUN_reclaim_the_slovak_possessions_desc: "斯洛伐克長期以來一直是我們國家的一部分，在特里亞農條約簽訂後的戰爭中離重新與我們統一隻差絲毫。我們應再次踏足該地區，為我們自己奪回它！"
 wuw_HUN_reclaim_the_slovak_possessions_tt: "解鎖決議，在斯洛伐克§Y重新整合舊匈牙利領土§!"
 wuw_HUN_revenge_for_1919: "為1919年復仇"
 wuw_HUN_revenge_for_1919_desc: "1919年，[ROM.GetAdjective]人在我們特蘭西瓦尼亞的合法領土上羞辱了我們，衝突中他們不僅佔領了整個地區，還攻佔了布達佩斯，並在我們的首都遊行炫耀。如果[ROOT.GetAdjective]民族想要再次崛起直至輝煌，這種恥辱是不能容忍的。"
 wuw_HUN_revenge_for_1919_tt: "解鎖決議，在特蘭西瓦尼亞§Y重新整合舊匈牙利領土§!"
 wuw_HUN_a_bulwark_against_communism: "對抗共產主義的堡壘"
 wuw_HUN_a_bulwark_against_communism_desc: "布爾什維克的威脅日益蔓延，如果沒有人願意阻止，它還將進一步擴展。我們必須承擔起大地守衛者的責任，抵禦這一禍害！"
 wuw_HUN_on_a_high_horse: "騎一匹高馬而來"
 wuw_HUN_on_a_high_horse_desc: "最近的發展證明了[ROOT.GetAdjective]人是這個世界真正的主宰。現在是時候讓我們在陽光下佔據我們應得的位置，並沐浴在榮耀中，統治整個地球！使徒王國將統治天主的子民。"
 wuw_HUN_cancel_the_german_trade_deal: "取消[GER.GetAdjective]貿易協議"
 wuw_HUN_cancel_the_german_trade_deal_desc: "我們的前總理、法西斯主義者根伯什·久洛，與[GER.GetAdjective]人簽訂了一份魔鬼條約。這份貿易條約將我們與他們捆綁在一起，進度緩慢但最終必定會摧毀了我們的民族精神。我們必須儘快終止這項協議。"
 wuw_HUN_establishing_a_royal_guard: "建立王室衛隊"
 wuw_HUN_establishing_a_royal_guard_desc: "眾所周知，每位國王都需要自己的貼身侍衛，霍爾蒂也不例外。現在我們的國家再次有了國王，是時候實現這一點了。"
 wuw_HUN_magyar_cserkeszszovetseg: "匈牙利童子軍協會"
 wuw_HUN_magyar_cserkeszszovetseg_desc: "匈牙利童子軍協會成立於1912年，已經培訓了許多有才能的[ROOT.GetAdjective]年輕人，使他們能夠照顧好自己，並參與準軍事行動。是時候我們正式將他們整合到我們的王室衛隊中，並授予組織領導人貴族頭銜。"
 wuw_HUN_magyar_cserkeszszovetseg_tt: "§Y王室衛隊§!追加效果\n可徵募人口係數§G+10%§!\n意識形態變化抵制力度§G+15%§!\n§Y$category_support_battalions$§!：組織度：§G+10§!, HP：§G+5§!"
 wuw_HUN_dissolve_the_volksbund: "解散人民聯盟"
 wuw_HUN_dissolve_the_volksbund_desc: "人民聯盟是一個與德國國家社會主義工人黨有關的組織，由我國境內的[GER.GetAdjective]族裔組成。他們接受來自[GER.GetNameDef]的資金支持，並在我國境內為其效力。為了防止他們危害國家穩定，我們必須儘快將這個組織解散。"
 wuw_HUN_an_airforce_to_be_reckoned_with: "未來的空軍"
 wuw_HUN_an_airforce_to_be_reckoned_with_desc: "為了更好地與敵人競爭，我們的空軍需要得到現代化和增強。兵種協同作戰是未來的潮流，這是我們必須接受的事實。"
 wuw_HUN_a_mobile_army: "機動部隊"
 wuw_HUN_a_mobile_army_desc: "我們的軍隊在軍隊人數上無法與任何世界強國競爭，我們應該把重點放在技術優勢上。裝甲和其他能夠突破並包圍敵人單位的陸基車輛是未來戰爭的發展方向，我們必須接受這一事實。"
 wuw_HUN_royalist_education_initiative: "王室教育計劃"
 wuw_HUN_royalist_education_initiative_desc: "人們不僅需要被教導如何行動，而且最重要的是要為我們所希望的美好未來做好準備，以大量培養新晉的、聰明的[ROOT.GetAdjective]科學家。"
 wuw_HUN_a_unifying_heritage: "統一的遺產"
 wuw_HUN_a_unifying_heritage_desc: "[ROOT.GetAdjective]人民可能已經分散在多個不同的國家，但這並不妨礙我們彼此團結一致。我們應該接受我們的泛匈牙利主義，並致力於儘早將所有[ROOT.GetAdjective]人民統一在同一面旗幟下。"
 wuw_HUN_stage_an_uprising_in_leitha: "在萊塔發動起義"
 wuw_HUN_stage_an_uprising_in_leitha_desc: "1921年在萊塔班沙格的反奧地利起義證明了[975.GetName]的人民希望成為我們偉大國家的一部分。我們應該派遣特工再次嘗試這一行動，立即為他們提供保護，並佔領該地區。"
 wuw_HUN_stage_an_uprising_in_leitha_tt: "§R這可能會導致與[975.GetName]所有者的戰爭！§!"
 wuw_HUN_anglo_hungarian_alliance: "英匈同盟"
 wuw_HUN_anglo_hungarian_alliance_desc: "霍爾蒂家族一直與英國關係密切，隨著我們周圍的緊張局勢加劇，現在是時候為我們的國家尋找同盟了。英國人當然是天然的合作伙伴，因為他們的援助可以讓我們專注於大陸事務，而他們則專注於其他地方。"
 wuw_HUN_establishing_a_new_dynasty: "建立新王朝"
 wuw_HUN_establishing_a_new_dynasty_desc: "鑑於條約不允許哈布斯堡家族復辟，在對我們王國的宣稱上沒有明顯的贏家。一種選擇是加冕我們的攝政王，儘管這不受歡迎，或者走一條更安全的路線，加冕他的兒子，廣受喜愛的霍爾蒂·伊什特萬為匈牙利的新國王。"
 wuw_HUN_establishing_a_new_dynasty_tt: "我們可以選擇加冕§Y霍爾蒂·米克洛什§!或他的兒子§Y霍爾蒂·伊什特萬§!為§Y匈牙利國王§!"
 HUN_fascist_uprising_mission_activation_tt: "§R匈牙利法西斯主義者會開始準備政變！§!"
 wuw_HUN_elect_a_fascist_king: "推舉法西斯君主"
 wuw_HUN_elect_a_fascist_king_desc: "我國需要一位鐵腕領袖來領導它挺過即將到來的動盪歲月。因此，我們的統治者必須是一位受人民敬仰，同時也令敵人畏懼的偉人。"
 wuw_HUN_guarantee_religious_liberties: "保障宗教自由"
 wuw_HUN_guarantee_religious_liberties_desc: "當我們的國家開始壓迫非天主教徒時，許多人選擇了逃離。為了扭轉這種人才外流的趨勢，我們必須修改法律，努力建立一個世俗國家。這應該會讓許多逃離我們國家的聰明人回到我們身邊。"
 wuw_HUN_joint_oil_exploitation_company: "聯合石油開發公司"
 wuw_HUN_joint_oil_exploitation_company_desc: "由於我國領土上可能有油田，我們引起了外國的注意。友好國家渴望用他們的技術知識來支持我們的石油工業，這將是一個學習他們先進技術的有利機會。"
 wuw_HUN_join_the_allies: "加入同盟國"
 wuw_HUN_join_the_allies_desc: "匈牙利及其民主價值觀的未來取決於西方主要民主國家及其聯盟。作為這個聯盟的一員，我們可以向他們提供力量，也可以依靠他們的支持。"
 wuw_HUN_a_responsible_government: "責任政府"
 wuw_HUN_a_responsible_government_desc: "長久以來由於我國政府只對國王負責，其常常對人民的意願置若罔聞。為此，我們將修訂憲法來確保政府從對統治者負責轉而對人民負責。"
 wuw_HUN_the_balkan_pact: "巴爾幹條約"
 wuw_HUN_the_balkan_pact_desc: "鑑於西方民主諸國相距甚遠，倘若有事無法及時相援，我們必須就近與鄰國締盟。屆時，作為巴爾幹條約陣營的領袖，我們將守望相助，共赴勝利！"
 wuw_HUN_the_balkan_pact_tt: "解鎖§Y邀請巴爾幹國家§!進入我們陣營的決議"
 wuw_HUN_the_balkan_pact_invitation_tt: "[ROM.GetNameDef]觸發事件：§Y[ROOT.GetNameDefCap]邀請[ROM.GetNameDef]加入巴爾幹條約§!"
 wuw_HUN_end_the_white_terror: "結束白色恐怖"
 wuw_HUN_end_the_white_terror_desc: "雖然這個國家的大多數人聲稱白色恐怖已經結束，但我們知道真相……霍爾蒂·米克洛什和他的準軍事暴徒仍在追捕那些夢想著更美好明天的人，如果我們要結束迫害，我們必須通過暴力革命終結他的統治。"
 wuw_HUN_parade_istvan_bethlens_platform: "拜特倫·伊什特萬的新反對派"
 wuw_HUN_parade_istvan_bethlens_platform_desc: "前總理拜特倫·伊什特萬，因不滿當前局勢，並對總理根伯什·久洛日益增加的威權言論感到警惕，於是他組建了新的反對派。我們必須利用這一機會進一步削弱這位海軍將領及其法西斯走狗的力量。"
 wuw_HUN_politicize_the_levente_associations: "政治化萊文泰協會"
 wuw_HUN_politicize_the_levente_associations_desc: "準軍事組織萊文泰青年協會幫助組織[ROOT.GetAdjective]的青年並訓練他們應對不可避免到來的衝突。我們應該試圖滲透這些團體，確保他們的成員知道他們應該效忠於誰。"
 wuw_HUN_politicize_the_levente_associations_tt: "當§Y[ROOT.GetAdjective]內戰§!開始時，§Y萊文特協會§!會忠於我們，我們會獲得額外 §G+8000§!人力"
 wuw_HUN_salami_slicing_tactics: "切香腸戰術"
 wuw_HUN_salami_slicing_tactics_desc: "通過採取一系列許多小型反霍爾蒂行動，來一次性產生一個更大的結果，這將是困難的、甚至是非法的，成功的話我們就可能破壞他的統治，以後幾乎不再有士兵願意捍衛他的政策。"
 wuw_HUN_salami_slicing_tactics_tt: "§Y[ROOT.GetAdjective]內戰§!開始後，稍大的一部分§Y軍隊§!將忠於我們。"
 wuw_HUN_undermine_the_volksbund: "削弱法西斯準軍事組織"
 wuw_HUN_undermine_the_volksbund_desc: "現在有眾多法西斯準軍事組織很有可能會在我們發動革命時拿起武器反抗，就比如名為“民族聯盟”的德裔匈牙利人組織，它與德國法西斯主義者有著密切聯繫。我們必須設法在為時過晚前，從內部或外部摧毀他們。"
 wuw_HUN_undermine_the_volksbund_tt: "當§Y[ROOT.GetAdjective]內戰§!開始時，反對方不會獲得額外的§Y人民聯盟§!單位，我們會獲得額外§G+15%§!戰爭支持度和§G+75§!政治點數"
 wuw_HUN_reviving_the_spirit_of_1848: "重燃1848年精神"
 wuw_HUN_reviving_the_spirit_of_1848_desc: "1848—1849年的匈牙利革命和獨立戰爭是1848年歐洲革命之一，雖然它未能賦予我們所期望的獨立，但它為我們今天生活的精神和理想鋪平了道路。我們應該重新點燃革命的火焰，推翻那些阻礙我們自由的暴君！"
 wuw_HUN_reviving_the_spirit_of_1848_tt: "國內的各種君主派和法西斯主義分子將在§R內戰§!中追隨§Y霍爾蒂·米克洛什§!對抗我們！"
 wuw_HUN_reviving_the_spirit_of_1848_requirements_tt: "§Y共產主義者§!或§Y民主主義者§!的支持率大於對§Y民族統一黨§!和§Y匈牙利民族社會主義黨§!的支持率"
 wuw_HUN_officialize_the_rakosi_battalion: "正式認可拉科西營"
 wuw_HUN_officialize_the_rakosi_battalion_desc: "即便身在異鄉，[ROOT.GetAdjective]的勇士們總是為了更美好的明天而奮鬥。這就是為什麼我們必須努力正式認可這樣的人們，並將革命帶給那些需要的人。"
 wuw_HUN_elections_in_the_revolutionary_council: "革命委員會選舉"
 wuw_HUN_elections_in_the_revolutionary_council_desc: "既然內戰已經結束，對於為了監督國家向共和國過渡的革命委員會，進行選舉已然安全。目前看來共產主義候選人受到青睞，但也許民主主義仍然是一個選項？"
 wuw_HUN_join_the_comintern: "加入共產國際"
 wuw_HUN_join_the_comintern_desc: "革命的前進之路在於共產國際。與我們的同志們站在一起，我們將掃除資本主義的不公和潛伏在西方的法西斯威脅。"
 wuw_HUN_restore_the_socialist_federative_republic: "恢復社會主義聯邦共和國"
 wuw_HUN_restore_the_socialist_federative_republic_desc: "共產國際放棄了反帝國主義的鬥爭，轉而選擇與之共存。如果全世界的工人要獲得自由，我們就必須高舉馬克思和列寧的火炬前進——如果需要的話，甚至對抗蘇聯。"
 wuw_HUN_restore_the_hungarian_red_army: "恢復匈牙利紅軍"
 wuw_HUN_restore_the_hungarian_red_army_desc: "凡是熱愛祖國的愛國者，都必須為保衛祖國盡到自己的職責。我們將仿效蘇聯模式，建立匈牙利紅軍來保衛剛剛起步的革命。"
 wuw_HUN_instate_a_socialist_economy: "建立社會主義經濟"
 wuw_HUN_instate_a_socialist_economy_desc: "為了真正改善我們的社會，我們必須改變金錢流動的方式，並去除那些只通過裙帶關係獲得職位的公司高層。工人將再次在自己的國家中擁有發言權，所有[ROOT.GetAdjective]人都將平等！"
 wuw_HUN_nationalize_key_industries: "國有化關鍵產業"
 wuw_HUN_nationalize_key_industries_desc: "儘管我們嘗試邁向經濟公有化，我國仍存在許多由外國公司和商人運營的工廠和企業。因此，邁向社會主義的下一步將是國有化外國資產。"
 wuw_HUN_invest_in_universal_education: "投資普及教育"
 wuw_HUN_invest_in_universal_education_desc: "人民是國家的統治者，如果沒有接受教育，他們就不知道什麼對他們最好，這樣肯定會把國家推向毀滅。因此，我們必須投資於全民免費教育，這樣每個[ROOT.GetAdjective]人都能接受教育，並在投票時判斷什麼是最好的。"
 wuw_HUN_kadars_hussars: "卡達爾驃騎兵"
 wuw_HUN_kadars_hussars_desc: "我們的革命權力軍團普福伊卡什，是由戰爭部設立的紅軍的軍警部隊，主要目的是鎮壓持不同政見者的活動。為了保障人民和國家的安全，我們應該加大對這些部隊的投資。"
 wuw_HUN_reinstate_the_lenin_boys: "重建列寧小隊"
 wuw_HUN_reinstate_the_lenin_boys_desc: "列寧小隊是1919年蘇維埃共和國時期的共產主義準軍事組織，用於根除和鎮壓國內的反革命分子。我們應該恢復這一準軍事組織，並將其編入我們的武裝力量。"
 HUN_lenin_boys_militia_recruitment: "獲得兩個列寧小隊§Y民兵§!單位"
 wuw_HUN_promote_revanchist_sentiment: "煽動復仇主義情緒"
 wuw_HUN_promote_revanchist_sentiment_desc: "可憎的特里亞農條約剝奪了我們一半以上的人口，導致成千上萬的[ROOT.GetAdjective]人流離失所。我們必須一勞永逸地糾正這一歷史上的重大不公，並給我們人民灌輸強烈的復仇心態。"
 wuw_HUN_denounce_marxism_leninism: "譴責馬克思列寧主義"
 wuw_HUN_denounce_marxism_leninism_desc: "惡劣的約瑟夫·斯大林踐踏了我們的理想，長期竊用我們的術語。他的法西斯和專制政策向我們證明，他不過是一個革命的騙子和叛徒，是時候終結他的可悲偽裝了。"
 wuw_HUN_proclaim_greater_hungary_core_states_requirement: "完全控制所有初始匈牙利地區"
 wuw_HUN_a_revolutionary_greater_hungary_tt: "我們將被稱為§Y潘諾尼亞社會主義共和國聯盟§!"
 wuw_HUN_a_revolutionary_greater_hungary: "潘諾尼亞社會主義聯盟"
 wuw_HUN_a_revolutionary_greater_hungary_desc: "隨著我們的邊界再次恢復，是時候將我們的目光投向真正的目標了。我們必須抓住機遇，宣佈建立一個包容所有民族的潘諾尼亞社會主義共和國聯盟，以便集中精力實現更偉大的目標——推進全球革命。"
 HUN_hero_of_the_revolution: "革命英雄"
 HUN_hero_of_the_revolution_desc: "隨著昔日領土的迴歸和潘諾尼亞社會主義共和國聯盟的成立，庫恩·貝拉顯然已成為國際革命的英雄。"
 HUN_balkan_ambitions: "巴爾幹野心"
 HUN_balkan_ambitions_desc: "巴爾幹的工人階級正處於資本家、君主派和法西斯主義者的壓迫之下，這些都是全球革命的公然敵人。我們必須解放他們，以確保巴爾幹地區的和平。"
 wuw_HUN_revenge_for_the_romanian_humiliations: "為羅馬尼亞的羞辱復仇"
 wuw_HUN_revenge_for_the_romanian_humiliations_desc: "在1918至1919年的匈羅戰爭中，我們受到了羞辱，我們的特蘭西瓦尼亞領土被偷走了。為了恢復我們的榮耀，我們必須收復這片理所當然屬於我們的土地。"
 wuw_HUN_the_second_northern_campaign: "第二次北方戰役"
 wuw_HUN_the_second_northern_campaign_desc: "我們在1919年進行的第一次北方戰役不幸失敗，斯洛伐克人民落入捷克人手中。我們必須迅速行動，不僅解放匈牙利人，還要解放特里亞農條約所失去的斯洛伐克人民。"
 wuw_HUN_march_south: "向南進軍"
 wuw_HUN_march_south_desc: "我們不僅曾在北方、東方和西方失去領土，南方也因南斯拉夫的成立而使我們失去了大片領土。我們必須儘早糾正我們人民在伏伊伏丁那和巴納特遭受的不公。"
 wuw_HUN_soviet_hungarian_military_academy: "蘇聯-匈牙利軍事學院"
 wuw_HUN_soviet_hungarian_military_academy_desc: "若是沒有領導，我們的軍隊便是一群烏合之眾。蘇聯人在軍事上積累了很多經驗，所以與他們合作培養我們自己的軍事將才或許將事半功倍。為此，我們將設立一個由兩國最有經驗的教官構成的軍事學院。"
 wuw_HUN_goulash_communism: "土豆燒牛肉式共產主義"
 wuw_HUN_goulash_communism_desc: "在一場血腥內戰後，因缺乏經驗豐富的人員，許多年輕人才迅速晉升。其中一位是卡達爾·亞諾什，他帶來了“匈牙利式共產主義”的理念，這一制度旨在確保高生活水平，進而使民眾團結在政府周圍。在匈牙利，每個公民都能享用一碗美味的匈牙利燉牛肉！"
 wuw_HUN_joint_hungarian_soviet_research_effort: "蘇匈聯合研究項目"
 wuw_HUN_joint_hungarian_soviet_research_effort_desc: "為了提升我們自己的國家科學院，我們應邀請蘇聯的理論專家和工程師，讓他們幫助發展我們國家可以利用的新理論和新技術。"
 wuw_HUN_soviet_hungarian_war_indsutry: "蘇聯-匈牙利軍工合作"
 wuw_HUN_soviet_hungarian_war_indsutry_desc: "為了進一步加強我們的合作，我們應請求蘇聯投資我們的軍事工業，這樣我們才能履行我們的義務，並保護我們的共產主義盟友免受任何敢於威脅他們的勢力的侵害。"
 wuw_HUN_state_protection_authority: "國家保衛局"
 wuw_HUN_state_protection_authority_desc: "為了保護我們驕傲的公民，並確保反革命分子不再出現，我們必須建立一支秘密警察部隊，它可以全權根除任何他們認為反對我們政府行為的人。"
 wuw_HUN_central_military_planning_committee: "中央軍事計劃委員會"
 wuw_HUN_central_military_planning_committee_desc: "如果世界革命要取得成功，我們必須建立一個委員會，在我們和我們的盟國之間進行更大規模的戰略和軍事合作，同時確保我們的軍隊處於最佳戰鬥狀態，隨時準備打擊我們的敵人。"
 wuw_HUN_a_cult_of_personality: "個人崇拜"
 wuw_HUN_a_cult_of_personality_desc: "[ROOT.GetNameDef]的孩子們需要一位他們可以敬仰的人物，一個他們能夠給予最大尊重的革命靈魂。因此，我們必須將權力集中在拉科西·馬加什身上，建立一種個人崇拜，使他的意志貫穿人民的思想，教會他們需要依賴的真正價值觀。"
 wuw_HUN_pressure_romania: "向[ROM.GetNameDef]施壓"
 wuw_HUN_pressure_romania_desc: "當我們把注意力集中在西方的法西斯主義危險，我們不能允許潛在的威脅繼續存在於我們的後方，特別是當它位於我們與東方盟友之間。羅馬尼亞必須被確保為一個共產主義國家，要麼它把通往我們盟友的重要陸路移交給我們，以保障我們能夠得到盟友的支援。"
 wuw_HUN_intervene_in_czechoslovakia: "干預[CZE.GetNameDef]"
 wuw_HUN_intervene_in_czechoslovakia_desc: "在特里亞農條約中，捷克斯洛伐克獲得了我們的部分領土。我們同時獲悉德國在圖謀那些領土。也許我們可以安排一筆交易；用我們的合法領土，換取在德國侵略我們時，蘇聯提供軍事援助的保證。"
 wuw_HUN_the_bulwark_against_the_west: "對抗西方的堡壘"
 wuw_HUN_the_bulwark_against_the_west_desc: "作為國際共產主義運動的驕傲成員，我們需要隨時準備捍衛我們的生活方式，而目前最大的威脅就是西方的法西斯主義者和資本家。如果我們想繼續頑強地站立著，就必須成為一座不可撼動的堡壘。"
 wuw_HUN_establish_the_second_republic: "建立第二共和國"
 wuw_HUN_establish_the_second_republic_desc: "我們絕不能忘記，1918年至1920年間斷斷續續存在的第一共和國是在共產主義者和民族主義者的共同努力下被粉碎的，前者希望建立自己的蘇維埃共和國，後者則恢復了王國，後者更為成功。我們必須現在就採取行動保護我們的民主，以免它再次被從我們身邊永遠奪走！"
 wuw_HUN_reverse_the_brain_drain: "逆轉人才流失"
 wuw_HUN_reverse_the_brain_drain_desc: "當我們國家開始採取壓制和歧視行為，試圖進一步控制社會時，許多著名科學家離開了我們的國家，因此我們的知識界遭受了巨大的損失。我們必須努力將這些人帶回來，並進一步發展[ROOT.GetAdjective]科學！"
 wuw_HUN_the_spirit_of_the_aster_revolution: "紫菀革命精神"
 wuw_HUN_the_spirit_of_the_aster_revolution_desc: "在世界大戰結束時，卡羅伊·米哈伊和匈牙利人民謀求民主和獨立。雖然共和國結束了，但我們應該喚起我國人民在紫菀革命中感受到的精神和團結，共同努力走向未來。"
 wuw_HUN_promote_entrepreneurship: "鼓勵創業"
 wuw_HUN_promote_entrepreneurship_desc: "一個不斷發展的社會最需要的就是創業者，他們願意承擔風險，改善他們生活的國家，並將資本投資回這裡。為了使我們的家園儘可能繁榮，我們應該提倡這種行為。"
 wuw_HUN_uplift_the_dragon_movement: "抬高龍運動的地位"
 wuw_HUN_uplift_the_dragon_movement_desc: "龍運動，也稱為匈牙利原住民聯盟，主要代表中產階級的利益，其口號是“匈牙利屬於匈牙利人！”他們要求由匈牙利知識分子作為統治階層，並出臺以匈牙利為中心的多瑙河谷政策，以實現擁有古老價值觀的大匈牙利。我們應該支持他們，因為他們的想法與我們的非常一致。"
 wuw_HUN_a_danubian_federation: "多瑙聯邦"
 wuw_HUN_a_danubian_federation_desc: "憑藉我們在歐洲中部的獨特位置，我們完全有潛力在不需要明顯領土擴張的情況下變得非常有影響力。與我們軍隊的力量同樣重要的是，我們的言論和外交行動的力量。通過圍繞多瑙河建立一個共同體，我們可以擁有遠超我們自身邊界的外交影響力和權力。"
 AUS_otto_von_habsburg_has_joined_austria_flag: "奧托·馮·哈布斯堡返回了奧地利"
 wuw_HUN_ward_against_extremism: "防範極端主義"
 wuw_HUN_ward_against_extremism_desc: "隨著極端主義日益臨近，多瑙河國家必須作為自由與民主的堡壘，抵禦一切與自由為敵的勢力。我們必須共同捍衛民主！"
 wuw_HUN_ward_against_extremism_tt: "所有陣營成員也會獲得該民族精神"
 wuw_HUN_bringing_down_the_giants: "打倒巨人"
 wuw_HUN_bringing_down_the_giants_desc: "有許多所謂的列強將挑戰我們，試圖終結我們的自由。我們不會讓他們得逞，為了確保我們人民的安全，我們必須先發制人，擊敗這些國家，從而使我們永遠不再面臨被消滅的威脅。"
 HUN_bringing_down_the_giants_tt: "獲得針對歐洲主要非民主國家的§Y[GetWargoalBasedOnGovernment]§!戰爭目標："
 wuw_HUN_the_cult_of_arpad: "阿爾帕德崇拜"
 wuw_HUN_the_cult_of_arpad_desc: "偉大的阿爾帕德是九至十世紀之交馬扎爾部落聯盟的首領，他一直鼓舞著匈牙利人民，他的王朝延續了很長時間，使[ROOT.GetnameDef]達到了極盛。我們應該學習他的經歷、效仿他的榜樣，同時將他塑造為傳奇英雄。"
 wuw_HUN_demand_szekely_autonomy: "要求塞凱伊自治"
 wuw_HUN_demand_szekely_autonomy_desc: "居住在特蘭西瓦尼亞的塞凱伊人和任何人一樣渴望與他們的匈牙利兄弟團聚，我們必須確保塞凱伊地區能夠獲得獨立，當然前提是在我們的管理之下。"
 wuw_HUN_approach_the_diasporas: "接觸僑民"
 wuw_HUN_approach_the_diasporas_desc: "自特里亞農條約簽訂以來，匈牙利僑民遍佈世界各地。我們必須重新接觸這些人，並向他們灌輸強烈的匈牙利民族自豪感和愛國主義，使他們為最終從殘暴的壓迫者手中解放出來做好準備。"
 wuw_HUN_revive_the_tribal_consolidation: "復興匈牙利民族"
 wuw_HUN_revive_the_tribal_consolidation_desc: "許多人可能已經忘記了匈牙利民族的輝煌往昔，但龍運動沒有忘。現在是時候奪回屬於我們的東西，並按照龍運動的計劃改革我們的社會。"
 wuw_HUN_reclaim_the_pannonian_steppe: "收復潘諾尼亞草原"
 wuw_HUN_reclaim_the_pannonian_steppe_desc: "很久以前，馬扎爾人到達潘諾尼亞盆地並宣稱了這片土地的所有權，建立了匈牙利部落聯盟。現在，外國入侵者佔據了我們的祖先土地，這顯然侵犯了我們的祖先權利。我們必須迅速行動，從敵人手中奪回潘諾尼亞。"
 wuw_HUN_undermine_the_admiral: "打壓海軍上將"
 wuw_HUN_undermine_the_admiral_desc: "海軍上將霍爾蒂·米克洛什已經坐在空蕩蕩的[ROOT.GetAdjective]寶座上太久了，他可能會開始建立自己的王朝。我們必須結束他的統治，讓一個更明智的人，譬如根伯什·久洛來掌管攝政工作。此舉可使該設想成為現實。"
 wuw_HUN_integrate_the_volksbund: "整合人民聯盟"
 wuw_HUN_integrate_the_volksbund_desc: "為了推翻霍爾蒂，我們需要大量人手。我們可以在民族社會主義運動、匈牙利德意志人民團中找到這樣的人，儘管他們微不足道。如果能說服他們加入我們的陣營，我們不僅可以利用他們來接管政權，還可以在以後作為準軍事力量。"
 wuw_HUN_volksbund_der_deutschen_in_ungarn: "匈牙利德意志民族聯盟"
 wuw_HUN_volksbund_der_deutschen_in_ungarn_desc: "由國家社會主義德意志工人黨贊助的國家社會主義運動組織——匈牙利德意志民族聯盟，將是一支完美的、忠誠於我們新德意志君主的護衛與民兵組織。我們應該主動接觸他們，促進與他們領導層的合作。"
 franz_and_henrik_available_tt: "§Y弗朗茨·安東·巴施§!和§Y韋特·亨裡克§!分別作為2級§Y將軍§!和3級§Y陸軍元帥§!可供使用"
 HUN_volksbund_militia_recruitment_tt: "獲得四個人民聯盟§Y民兵§!單位"
 wuw_HUN_empower_the_greenshirts: "賦權綠衫軍"
 wuw_HUN_empower_the_greenshirts_desc: "雖然匈牙利國家社會主義黨及其追隨者在意識形態上與根伯什有所不同，但他們不忠於霍爾蒂，因此他們是很好的盟友。雖然有風險，但把武器偷運給他們可能會有幫助，以便他們能夠幫助我們更換攝政王。"
 wuw_HUN_the_march_on_budapest: "進軍布達佩斯"
 wuw_HUN_the_march_on_budapest_desc: "現在法西斯分子已經被組織起來並武裝起來，我們可以讓他們去首都遊行，要求攝政王霍爾蒂·米克洛什辭職。如此，根伯什可以合法地成為國家的統治者，並迅速恢復秩序，宣佈自己為匈牙利總統。"
 wuw_HUN_government_of_national_unity: "民族團結政府"
 wuw_HUN_government_of_national_unity_desc: "根伯什加強並武裝了民族意志黨等組織，圖謀從霍爾蒂手中奪取攝政王權力。然而他未能意識到的是，在目前掌握實權的這些人中，沒有人能阻擋那些人的領袖薩拉希·費倫茨的上臺。"
 wuw_HUN_institute_corporatism: "實施社團主義"
 wuw_HUN_institute_corporatism_desc: "在經歷了那次世界大戰及特里亞農條約帶來的破壞和屈辱後，為了恢復我們國家的穩定，我們必須採納墨索里尼的經濟模型，並採取一系列社團主義改革。"
 wuw_HUN_a_roman_catholic_state: "羅馬天主教國家"
 wuw_HUN_a_roman_catholic_state_desc: "自950年左右以尊稱為“豪爾考”的布爾丘和尊稱為“久洛”的蓋烏洛為代表的首批匈牙利族長皈依基督以來，我國就一直是基督宗教國家。直到今天，我們仍是虔誠的天主教徒，並且無論面臨何種困難，我們都不會偏離我們的道路。"
 wuw_HUN_incorporate_the_hungarian_life_movement: "“匈牙利生活”運動"
 wuw_HUN_incorporate_the_hungarian_life_movement_desc: "我們應該努力將右翼政治家伊姆雷迪·貝洛及其匈牙利生命運動納入我們的組織，讓他在我們的政府中擔任職位。"
 wuw_HUN_wherever_the_cross_points: "無論箭十字指向哪裡"
 wuw_HUN_wherever_the_cross_points_desc: "遵照我們運動的象徵——箭十字，匈牙利必須奪回其與生俱來的權利，並向箭十字指向的每個方向擴張。現在是時候奪回屬於我們的東西了！"
 wuw_HUN_the_war_on_atheism: "反對無神論的戰爭"
 wuw_HUN_the_war_on_atheism_desc: "近年來，人們開始遺忘神明。無神論這一日益增長的禍害將繼續蔓延，除非我們打擊其要害。我們必須現在就打倒共產主義者，否則這種異端將永遠持續。"
 wuw_HUN_heirs_of_the_huns: "匈人的繼承人"
 wuw_HUN_heirs_of_the_huns_desc: "關於我們人民的起源有許多不同的觀點，包括芬蘭-烏拉爾或突厥。雖然這些說法可能在某種程度上是正確的，但必須強調我們是匈人的真正繼承者，我們將摧毀任何反對我們的人。"
 wuw_HUN_sway_the_count: "拉攏伯爵"
 wuw_HUN_sway_the_count_desc: "帕爾菲·菲德爾伯爵是一位貴族，也是我們國家德式納粹主義的大力支持者。他似乎非常受國家社會主義德意志工人黨的聯繫人的青睞，在我們試圖與志同道合的國家進行外交時，他可能非常有用。"
 HUN_hire_fidel_palffy_tt: "僱傭§Y帕爾菲·菲德爾伯爵§!為顧問"
 wuw_HUN_our_ancestral_lands: "我們的祖先之地"
 wuw_HUN_our_ancestral_lands_desc: "通過加強我們對古代芬蘭-烏拉爾土地的主張，以及因著我們聲稱的突厥血統，對古老的突厥土地的主張，我們可以宣稱所有古老的土地，並奪回屬於我們的法理領土。"
 wuw_HUN_demand_croatian_reintigration: "要求重新整合克羅地亞"
 wuw_HUN_demand_croatian_reintigration_desc: "我們的新聯盟保障了我們的安全和道路，我們因而可以關注手頭上更重要的事情。直到那次世界大戰結束前，目前得克羅地亞大部分地區還曾都是我們王國的一部分，如今我們必須執行我們對該地區的主張。"
 wuw_HUN_increase_economic_cooperation: "加強經濟合作"
 wuw_HUN_increase_economic_cooperation_desc: "隨著我國政府現在對與鄰國和國際行動者的合作持更加開放的態度，我們應該努力與我們新結交的盟友進行新的貿易協議和經濟協定。"
 HUN_increase_economic_cooperation_tt: "我們將從地圖外獲得§Y民用工廠§!這適用於在§Y西巴爾幹§!、§Y東巴爾幹§!和§Y北巴爾幹§!的每個初始國家，條件是這些國家對我們的§Y評價§!高於§G85§!。這同樣適用於§Y[AUS.GetNameDef]§!、§Y[CZE.GetNameDef]§!、§Y[TRA.GetNameDef]§!和§Y[SLO.GetNameDef]§!。"
 wuw_HUN_hold_territorial_referendums: "舉行領土公投"
 wuw_HUN_hold_territorial_referendums_desc: "世界大戰後，許多有大量匈牙利人的領土在沒有國際觀察員監督的民主過程中被剝奪，然而西里西亞和石勒蘇益格的地區的情況就是如此。我們應該以外交手段接觸鄰國，要求舉行這樣的公投，讓人民決定他們希望生活在哪個國家。"
 wuw_HUN_hold_territorial_referendums_tt: "解鎖決議§Y在失去的領土舉行公投§!，以嘗試再次獲取它們"
 wuw_HUN_sailing_the_danube: "航行多瑙河"
 wuw_HUN_sailing_the_danube_desc: "偉大的多瑙河長期以來一直是我國的命脈，我們無論是運輸貨物還是調動軍隊，我們都有著悠久而自豪的航行傳統。因此，我們應該投資於我們的內河海軍，並確保我們在內河上的航運能夠儘可能順利地繼續運作。"
 ### AUSTRIAN FOCUS TREE ###
 AUS_totalitarian_safety: "極權主義的安全"
 AUS_totalitarian_safety_desc: "1933年，為了我們國家的安全，恩格爾伯特·陶爾斐斯將[AUS.GetNameDef]引入了其當前的政治狀態。完全廢除議會的這一決定在我們人民中引起了爭議，但我們確信這是保護我們安全所必需的。陶爾斐斯已經離開了我們，但為了我們自己的安全，我們應該繼續這一道路。"
 AUS_clamp_down_on_dnsap: "打擊德意志國家社會主義工人黨"
 AUS_clamp_down_on_dnsap_desc: "除了我們的祖國陣線，其他政黨早已在我們國家被禁。儘管如此，一些黨派仍然潛伏著，最令人不安的是所謂的德意志國家社會主義工人黨。他們荒謬地聲稱自己代表真正的奧地利法西斯主義，並認為我們應該放棄主權、與[GER.GetNameDef]合併。我們應該立即處理他們！"
 AUS_clamp_down_on_dnsap_tt: "§Y$AUS_kurt_schuschnigg$§!成為§Y$AUS_fascism_vaterlandische_front_long$§!的領袖，執政黨切換為§Y法西斯主義§!。"
 AUS_supporting_italy_in_ethiopia_focus: "支持[ITA.GetNameDef]在[ETH.GetNameDef]的行動"
 AUS_supporting_italy_in_ethiopia_focus_desc: "長期以來，[ITA.GetNameDef]一直站在我們這邊。他們是我們獨立擔保國之一，保持與他們的良好關係至關重要，我們不能讓他們被[GER.GetAdjective]的勸說所動搖。通過增援[ITA.GetAdjective]在[ETH.GetNameDef]的行動，我們在兩國之間建立了信任，並增加了在將來需要時他們幫助我們的可能性。"
 AUS_supporting_italy_in_ethiopia_focus_tt: "解鎖決議§Y在意埃戰爭中支持[ITA.GetNameDef]§!"
 AUS_reach_out_to_italy: "接觸意大利"
 AUS_reach_out_to_italy_desc: "儘管我們之間有過不少分歧，意大利仍然是我們當前形勢下最值得信賴的盟友。隨著周圍不安和緊張局勢的加劇，向他們尋求支持似乎是有益的。"
 AUS_approach_democratic_guarantors: "接觸民主陣營的擔保國"
 AUS_approach_democratic_guarantors_desc: "簽署了《聖日耳曼昂萊條約》後，我們發現自己的軍隊過於弱小，無法自衛。如果我們想在日益危險的形勢中生存下去，我們將需要支持。雖然我們大多數時候與條約的其他簽署國意見不一，但我們應該向他們伸出橄欖枝，請求他們在我們周圍的冷衝突升溫時給予支持。"
 AUS_approach_democratic_guarantors_tt: "§Y如果他們接受，對各自國家的影響：§!"
 AUS_refine_vaterlandische_front: "完善祖國陣線"
 AUS_refine_vaterlandische_front_desc: "長時間以來，祖國陣線一直是“議會自毀”之後政黨合併的產物。隨著時間的推移，奧地利法西斯主義最初的意識形態慢慢地發生了變化，這種變化並不完全符合我們的利益。現在是時候讓我們回到正確的道路上。"
 AUS_seek_agreement_for_rearmament: "尋求軍備重整協議"
 AUS_seek_agreement_for_rearmament_desc: "我們的內政現已得到進一步控制，是時候轉向外部了。我們仍然受到不公正的《聖日耳曼昂萊條約》的約束，這限制了我們的軍事增長和自衛能力。由於我們在一定程度上依賴其他簽署國的保護，明智的做法是通知他們我們重新武裝的意圖，並徵求他們的同意。"
 AUS_seek_agreement_for_rearmament_tt: "一個事件將被髮送給§Y[ITA.GetFlag][ITA.GetName]、[ENG.GetFlag][ENG.GetName] 、[FRA.GetFlag][FRA.GetName]§!和§Y[USA.GetFlag][USA.GetName]§!以供他們批准或拒絕請求。無論他們如何回應，你都能選擇重新武裝。"
 AUS_rearmament_and_guarantees_tt: "§R違背擔保國的意願可能會導致外交後果，包括從評價降低到擔保撤銷！§!"
 AUS_disregard_the_treaties: "無視條約"
 AUS_disregard_the_treaties_desc: "雖然我們尊重《聖日耳曼昂萊條約》簽署國的意願，他們希望繼續讓我們受條約約束，但目前世界局勢不再允許我們遵守條約的規定。這些行動可能會激怒與我們簽訂條約的各國，我們可能會承受後果，但我們不能再讓自己受到束縛。"
 AUS_rapid_rearmament: "快速軍備重整"
 AUS_rapid_rearmament_desc: "擺脫了條約的束縛，我們現在必須立即重整軍備。我們的陸軍和空軍在過去十年中受到嚴重忽視，需要作出重大努力才能使我們再次達到可接受的水平。"
 AUS_spanish_intervention: "干涉西班牙"
 AUS_spanish_intervention_desc: "伊比利亞半島被內戰的火焰吞噬。民族主義者和共和黨人在暴力衝突中發生衝突時，許多外部力量正在干預，我們看不出有什麼理由不干預。通過干預，我們可以讓我們的軍隊獲得更多的現代戰爭經驗，並對我們的部隊與當今標準相比的表現進行評估。"
 AUS_demand_part_of_spanish_winnings: "請求西班牙戰爭的部分勝利成果"
 AUS_demand_part_of_spanish_winnings_desc: "隨著伊比利亞半島上的衝突逐漸平息，我們在[SPA.GetNameDef]的朋友們取得了勝利，現在是時候看看我們從這次行動中獲得了什麼。我們對[SPA.GetAdjective]的幫助應該已經讓我們受到了他們的歡迎，我們有理由請求一些補償以回報我們的援助。"
 AUS_volunteer_effort_SPA_flag: "以向[SPA.GetFlag]§Y[SPA.GetNameDef]§!派遣志願軍"
 AUS_invite_spanish_refugees: "邀請西班牙民族主義者"
 AUS_invite_spanish_refugees_desc: "儘管我們在內戰中盡了最大努力，但我們未能幫助我們的[SPA.GetAdjective]兄弟獲勝。儘管這是一個非常令人失望的結果，我們仍然可以通過邀請那些為同一事業而戰的人來到我們這裡，並將他們融入[AUS.GetAdjective]的社會和軍隊，從而幫助他們和我們一起恢復元氣。"
 AUS_integrate_dnsap_remnants: "整合德意志國家社會主義工人黨的殘餘勢力"
 AUS_integrate_dnsap_remnants_desc: "儘管對德意志國家社會主義工人黨實施了更嚴格的禁令，[AUS.GetNameDef]仍然有該黨的殘餘存在。雖然他們中的大多數已經支持大德意志人民黨，但仍有一些人處於政治真空中。我們應該嘗試將他們招募進祖國陣線，以防止他們再次發動叛亂。"
 AUS_heimwehr_support: "爭取保安團支持"
 AUS_heimwehr_support_desc: "在《聖日耳曼昂萊條約》下的這些年裡，[AUS.GetNameDef]的準軍事組織數量迅速增加。這些活動通常是被禁止的，而且大多數都有他們希望推動的政治議程。保安團的理念從未與我們的理念相距太遠。通過獲得他們的支持，我們可以說服他們與我們的聯邦軍肩並肩作戰。"
 AUS_frontmiliz_focus: "前線民兵"
 AUS_frontmiliz_focus_desc: "現在我們已經贏得了[GetMilitiaName]的信任，我們必須確保他們迅速融入聯邦軍。雖然他們仍將保持自己的獨立實體，但我們必須確保雙方無縫合作。這將確保我們在戰場和我們國家的街道上都能取得成功。"
 AUS_fit_for_fight: "隨時準備行動"
 AUS_fit_for_fight_desc: "我們在重建國家的過程中取得了長足的進步，但我們不能止步於此。在我們重整軍備和重新建設的努力產生效果的同時，我們必須準備好我們的司法系統，以確保我們的法律不會阻礙我們的努力。"
 AUS_form_nachrichtenabteilun: "成立情報部門"
 AUS_form_nachrichtenabteilun_desc: "我們已經被解除武裝很長時間了，儘管這帶來了可怕的後果，但也有積極的一面。世界認為我們只是一個關注軍隊的小暴發戶。在這個時間窗口專注於情報和間諜活動，我們可以利用他們對我們的假設來為我們自己爭取優勢。"
 nachrichtenabteilung_bonus: "新聞部獎勵"
 AUS_wienfilm_propaganda_effort: "維也納電影宣傳"
 AUS_wienfilm_propaganda_effort_desc: "戰爭在世界上肆虐時，我們有必要保持自己國家的穩定。最近我們看到一些國家利用電影工業來增強人民的士氣。既然我們有自己的維也納電影，我們應該考慮做同樣的事情。"
 AUS_consolidate_industries: "國家產業"
 AUS_consolidate_industries_desc: "我們的工業部門在短時間內顯著增長，這對我們經濟和軍隊的積極影響顯而易見。為了進一步加強它，我們應該制定一個整合計劃，確保這些產業的效率和產量達到最佳。"
 AUS_universitat_graz: "格拉茨大學"
 AUS_universitat_graz_desc: "格拉茨大學培養了許多傑出的人才和數位諾貝爾獎得主。與該大學更密切的合作可以大大加快我們自己的研究。"
 AUS_recruiting_the_graduates: "從大學招募"
 AUS_recruiting_the_graduates_desc: "為了使我們的科學工作長期持續下去，我們必須確保不斷吸引新的人才。通過與格拉茨大學合作，我們可以吸引學生、校友和教授加入我們的項目。"
 AUS_heritage_of_an_empire: "帝國的傳承"
 AUS_heritage_of_an_empire_desc: "我們沒有忘記幾十年前的我們。在我們內心深處，[AUS.GetNameDef]仍然是一個帝國，只要努力工作，我們很快就會再次成為帝國。現在是時候讓我們的人民為這種轉變做好準備了。"
 AUS_second_brothers_war: "第二次兄弟戰爭"
 AUS_second_brothers_war_desc: "1866年，我們與[GER.GetNameDef]的前身之間爆發了一場戰爭。當時只是關於石勒蘇益格-荷爾斯泰因的小爭執，但現在情況已經改變。[GER.GetAdjective]人繼續對我們的北部邊境構成威脅。是時候徹底結束這場兄弟之間的競爭了。"
 AUS_unlocks_reichstag_raid: "解鎖§Y襲擊§!：\n對§Y[GER.GetNameWithFlag]§!國會大廈進行炸彈襲擊"
 AUS_an_improved_german_state: "更好的德意志國家"
 AUS_an_improved_german_state_desc: "我們一直視自己為世界上更好的那個德意志國家，近期的情況也證明了這一點。我們不會再讓[GER.GetNameDef]玷汙德意志民族集體的聲譽了。是時候將他們整合到我們光榮的國家中，收他們的力量為我們所用了！"
 AUS_restoring_our_rightful_flag: "恢復使用國旗的權利"
 AUS_restoring_our_rightful_flag_desc: "我們參加1936年奧運會時發現我們的國旗與[HAI.GetNameDef]的相同。我們不情願地改變了我們的國旗來與他們區分，但事實依然是，這面旗幟屬於我們，而[HAI.GetAdjective]當時並沒有放棄，我們必須用另一種方式處理這個問題。"
 AUS_seek_to_purchase_alaska: "購買[463.GetName]"
 AUS_seek_to_purchase_alaska_desc: "1867年俄國的亞歷山大二世提議我們購買[463.GetName]，我們當時因為該地區沒多少價值而放棄了這一提議。然而時代已經改變，我們應該考慮接觸[463.GetName]的所有者，努力通過談判達成協議。"
 AUS_bring_hungary_back_into_the_fold: "將匈牙利重新納入版圖"
 AUS_bring_hungary_back_into_the_fold_desc: "在就不久前，我們和[HUN.GetAdjective]還曾同屬一個偉大國家。我們在世界大戰之後被迫分裂，我們都被強加給我們的不公正條約嚴重削弱。為了防止這種情況再次發生，我們應該提議將他們完全整合進[ROOT.GetNameDef]！"
 AUS_bring_hungary_back_into_the_fold_tt: "解鎖§Y吞併舊領土§!決議以及單獨的§Y增加外交吞併可能性§!決議。"
 target_hun_tt: "這些決議將針對§Y[HUN.GetNameWithFlag]§!"
 target_cze_tt: "這些決議將針對§Y[CZE.GetNameWithFlag]§!"
 target_yug_tt: "這些決議將針對§Y[YUG.GetNameWithFlag]§!或目前擁有§Y[102.GetName]§!、§Y[109.GetName]§!和§Y[853.GetName]§!的§Y任何國家§!。"
 target_pol_tt: "這些決議將針對§Y[POL.GetNameWithFlag]§!"
 target_rom_tt: "這些決議將針對§Y[ROM.GetNameWithFlag]§!"
 target_alb_tt: "這些決議將針對§Y[ALB.GetNameWithFlag]§!"
 more_likely_to_accept_if_military_inferior_tt: "通過§Y增強我們的軍隊實力§!，我們提高了他們接受§G和平吞併§!的概率！"
 AUS_the_czechoslovakian_lands: "捷克斯洛伐克的土地"
 AUS_the_czechoslovakian_lands_desc: "[CZE.GetNameDef]北部的領土曾經是我們偉大帝國的一部分，直到一切崩潰。直到今天，這些地區仍有許多說[GER.GetAdjective]語言的群體生活在這些地區，基於這一點，讓他們重新成為我們重生帝國的一部分是合理的，至於他們是否願意和平加入則取決於他們自己。"
 AUS_reclaiming_yugoslavian_territories: "收復巴爾幹領土"
 AUS_reclaiming_yugoslavian_territories_desc: "我們偉大的帝國曾經一直延伸到亞得里亞海。這些土地也在世界大戰結束時被剝奪。若收復這些土地，我們也將得到戰略要地的海岸線。我們應該向這些國家的領導人建議，讓他們將這些地區和平移交給我們，否則後果自負。"
 AUS_reclaiming_yugoslavian_territories_tt: "擁有§Y[102.GetName]§!、§Y[103.GetName]§!和§Y[853.GetName]§!的所有者將收到事件“§Y來自[AUS.GetNameDef]的最後通牒§!”"
 AUS_take_albania: "佔領阿爾巴尼亞"
 AUS_take_albania_desc: "[ALB.GetNameDefCap]或許並非我們領土中最重要的一部分，事實上，它從未真正屬於我們，儘管我們確實曾制定計劃吞併它。如今，我們再次鞏固自身在巴爾幹的存在，我們沒有理由不再次聲索此地。"
 AUS_take_back_galicia: "收回加利西亞"
 AUS_take_back_galicia_desc: "隨著我們的帝國再次開始擴張，我們不能迴避向更大的國家要求歸還我們的合法土地。[POL.GetNameDefCap]可能至少看起來比我們大，但加利西亞仍然應該屬於我們，如果他們不願意交出，我們可能不得不使用武力。"
 AUS_demand_romanian_lands: "索取特蘭西瓦尼亞和布科維納"
 AUS_demand_romanian_lands_desc: "我們從鄰近區域拿回一些土地後，我們現在可以開始考慮更遠的領土。我們曾經在[ROM.GetNameDef]擁有的土地對我們來說是一個巨大的資產，我們應該儘快收復它們。[ROM.GetAdjective]領導層的想法無關緊要，如果他們不願意順從，我們可能不得不考慮其他選擇。"
 AUS_integrate_northwest: "整合波默恩"
 AUS_integrate_northwest_desc: "為了更好地利用我們現在重新奪回的領土，我們必須確保國家保持統一。表現出最大意願和用途的地區必須儘快整合到帝國本土。我們從[CZE.GetNameDef]奪回的領土已經顯示出最大的潛力。我們應該立即開始整合工作！"
 AUS_integrate_hungary: "整合匈牙利"
 AUS_integrate_hungary_desc: "為了更好地利用我們現在重新奪回的領土，我們必須確保國家保持統一。表現出最大意願和用途的地區必須儘快整合到帝國本土。我們從[HUN.GetNameDef]奪回的領土已經顯示出最大的潛力。我們應該立即開始整合工作！"
 AUS_proclaim_austrian_empire: "宣告奧地利帝國"
 AUS_proclaim_austrian_empire_desc: "我們重建帝國的努力終於得到了回報。我們已經征服了我們所有的舊領土，可以再次自豪地稱自己為帝國！"
 AUS_beyond_our_old_lands: "超越我們的舊領土"
 AUS_beyond_our_old_lands_desc: "隨著我們再次成長為一個大國，一個問題呈現出來。我們控制了我們所有的舊領土，但為什麼要在此停止？憑藉我們目前擁有的力量，進一步擴張應該不成問題。"
 AUS_join_the_axis: "人多力量大"
 AUS_join_the_axis_desc: "雖然我們自己已經很強大了，但不可否認，加入某種形式的軍事聯盟對我們和我們試圖加入的聯盟都有好處。我們應該考慮與我們最為一致的派系進行接觸，並尋求加入的許可。"
 AUS_join_the_axis_tt: "§R[GER.GetNameWithFlag]非常不可能接受我們作為[GER.GetFactionName]的成員，即使關係非比尋常他們也可能拒絕！§!"
 AUS_reforming_the_central_powers: "重建舊同盟國"
 AUS_reforming_the_central_powers_desc: "雖然我們同意成為一個軍事聯盟的一部分將增強我們的力量，但衡量現有選項後，我們並不覺得它們完全符合我們的標準。世界大戰期間我們曾是強大的舊同盟國的一員，既然缺乏更好的選擇，我們就應該考慮重建這個陣營。"
 AUS_reforming_the_central_powers_tt: "邀請§Y[GER.GetNameWithFlag]§!、§Y[TUR.GetNameWithFlag]§!和§Y[BUL.GetNameWithFlag]§!加入§Y舊同盟國§!，只要他們是§Y法西斯主義§!或§Y中立主義§!，並且目前不在陣營中。"
 AUS_for_a_better_future: "[AUS.GetAdjective]的未來"
 AUS_for_a_better_future_desc: "回顧過去，我們的目標一直是重建失去的東西。既然已經實現，我們需要開始展望我們的未來。"
 AUS_war_against_bolshevism: "對布爾什維克的戰爭"
 AUS_war_against_bolshevism_desc: "東方的[SOV.GetAdjective]布爾什維克一直是我們的眼中釘。為了防止他們打我們個措手不及，我們必須先發制人。"
 AUS_crusade_on_communism: "反共聖戰"
 AUS_crusade_on_communism_desc: "只要歐洲大陸上還有共產主義者，我們的國家和人民就不安全。我們需要在這種紅色威脅成為真正的麻煩來源之前終結它。"
 AUS_crusade_on_communism_tt: "獲得對§Y歐洲§!所有§Y共產主義§!國家的§Y吞併§!戰爭目標"
 AUS_crusade_on_communism_d_tt: "獲得對§Y歐洲§!所有§Y共產主義§!國家的§Y顛覆政權§!戰爭目標"
 AUS_repeal_the_may_constitution: "廢除五月憲法"
 AUS_repeal_the_may_constitution_desc: "恩格爾伯特·陶爾斐斯在1934年制定的所謂五月憲法在過去幾年中阻礙了[AUS.GetNameDef]的政治發展。政黨被禁止，剝奪了國家往好的一面發展的一切可能性。如果我們的國家要再次繁榮，我們必須廢除這部不公正的憲法。"
 AUS_austria_against_fascism: "奧地利帝國聯盟"
 AUS_austria_against_fascism_desc: "隨著我們國家從長期的政治孤立中恢復過來，湧現出各種政治團體並不奇怪，因為人們終於敢於說出自己的想法。奧地利帝國聯盟就是這樣一個正統派團體。幸運的是，他們的政治議程與我們為國家制定的計劃一致。我們應確保最大限度地利用這次合作。"
 AUS_reinstate_the_imperial_council: "恢復貴族院"
 AUS_reinstate_the_imperial_council_desc: "正如我們所預料的那樣，我們的人民表達了迴歸舊時代的願望。我們不再需要一個明顯有缺陷的系統，它可能會像法西斯分子在1934年“議會自毀”中所做的那樣被濫用。在雙重君主制中，單人統治一直是一種安全而受歡迎的制度，現在是時候將其恢復了。"
 AUS_legacy_of_the_empire: "帝國的遺產"
 AUS_legacy_of_the_empire_desc: "雖然我們現在只不過是曾經那個強大帝國的影子，但這並不意味著我們不能渴望重建曾經的輝煌。通過在我們國家激發君主主義情緒，我們可以為再次成為一個強大的君主國做好準備。"
 AUS_imperilalist_sentiments: "帝國主義思潮"
 AUS_bring_back_the_habsburg_rule: "承擔王冠"
 AUS_bring_back_the_habsburg_rule_desc: "我們需要加冕一位國王來領導國家才能真正成為一個王國。我們當前的攝政一定會成為一位優秀的國王，我們應該立即為他的加冕做準備。"
 AUS_bring_back_the_habsburg_rule_tt: "如果你的當前攝政是§Y奧托·馮·哈布斯堡§!或§Y恩斯特·呂迪格·施塔爾亨貝格§!，他會被加冕為奧地利大公並獲得特質：\n\n§Y奧地利大公§!：\n-政治點數獲取：§G+10%§!\n-可徵募人口：§Y0.50%§!\n-穩定度：§G+5%§!\n-戰爭支持度：§G+5%§!\n-每日中立主義支持率：§G+0.03§!"
 AUS_repeal_the_habsburgergesetz: "廢除哈布斯堡法"
 AUS_repeal_the_habsburgergesetz_desc: "世界大戰後1919年頒佈的哈布斯堡法大大限制了哈布斯堡家族的權利和權力。無論現在誰統治我們的國家，這項法律都是對[AUS.GetNameDef]作為君主國聲譽的汙點，必須立即廢除。"
 AUS_rebellious_rearmament: "叛逆的軍備重整"
 AUS_rebellious_rearmament_desc: "[AUS.GetNameDef]已經受困於極不公正且十分令人不安的《聖日耳曼昂萊條約》太久了。恢復君主制使我們早已在某種程度上違反了該條約，因此我們也沒有理由繼續遵守其餘條款了。是時候廢除這一災難性的條約了！"
 AUS_strengthen_legitimistische_corps: "加強正統派軍團"
 AUS_strengthen_legitimistische_corps_desc: "正統派軍團最初是[AUS.GetAdjective]貴族在我國高等教育中的學生組織。起初，他們不過是一群有著類似興趣的學生聚集在一起，但隨著政治氣候變得更加嚴峻，他們變得越來越具有軍事化傾向。我們應考慮從他們中招募，以加快部署時間。"
 AUS_legitimistische_studentenverbindung: "正統主義學生會"
 AUS_legitimistische_studentenverbindung_desc: "正統主義學生會是學生興趣組織，它服務於所有教育層次中的保皇派學生。與軍團相比，他們更熱衷演講與辯論以及科學活動，軍事化傾向較少。他們對君主的堅定忠誠可能對我們非常有用！"
 AUS_legitimistische_jugend: "正統主義青年團"
 AUS_legitimistische_jugend_desc: "我們發現，讓兒童和青少年儘早瞭解君主制及其所有核心價值觀，可以使他們成長為忠誠和幸福的公民，這些公民在需要時，既能為國家工作，也能為國家戰鬥。有人危言聳聽，說這會導致更糟糕的事情，但我們確信，這種教育對他們完全是有益的。"
 AUS_repeal_the_adelsaufhebungsgesetz: "廢除《廢除貴族法》"
 AUS_repeal_the_adelsaufhebungsgesetz_desc: "《廢除貴族法》與《哈布斯堡法》同時生效的那時，實際上取締了[AUS.GetAdjective]貴族的存在。貴族家族的頭銜、榮譽特權和權力被一揮而就地剝奪。這項法律顯然是不公正的，通過恢復我們的貴族及其家族榮譽，我們可以確保他們在未來的忠誠。"
 AUS_the_evidenzburo: "證據檔案局"
 AUS_the_evidenzburo_desc: "證據檔案局與我們精心構建的諸多重要部門一樣，在那場世界大戰結束後被迫解散。如今，相關條約已不再對我們構成約束，繼續遵守這項禁止設立情報機構的限制性規定，已經毫無必要。"
 AUS_the_evidenzburo_bonus: "證據檔案局"
 AUS_a_royal_alliance: "皇家聯盟"
 AUS_a_royal_alliance_desc: "高處不勝寒，作為少數現存君主制國家之一，尋求與仍然看重強大君主統治他們國家的人結盟，這才是正確之舉。我們必須接觸那些與我們志同道合的人，並建議他們與我們聯合起來對抗更具威脅的邪惡。"
 AUS_a_royal_alliance_tt1: "邀請§Y[ENG.GetNameWithFlag]§!加入§Y$AUS_a_royal_alliance$§!"
 AUS_a_royal_alliance_tt2: "邀請§Y[FRA.GetNameWithFlag]§!加入§Y$AUS_a_royal_alliance$§!"
 AUS_sturmscharen_support: "獲得風暴隊的支持"
 AUS_sturmscharen_support_desc: "風暴隊一直扮演著社會民主黨的保衛聯盟和民族主義的國防聯盟之間的中間道路。雖然歷史上由我們的對手庫爾特·舒施尼格領導，但我們相信，憑藉政治上的一致以及我們的傳統價值觀，我們可以獲得東馬克風暴隊的支持，並讓他們為我們效勞。"
 AUS_eiserne_legion: "建立鋼鐵軍團"
 AUS_eiserne_legion_desc: "我們的領導層現已重組，再次允許建立準軍事組織，為[ROOT.GetLeader]建立一個精英衛隊的可能性出現了。一小群曾經的法西斯派官員自願建立一支精英衛隊，以鎮壓反對派並控制民眾。這是一個絕佳的機會！"
 AUS_the_royals_of_liechtenstein: "邀請列支敦士登王室"
 AUS_the_royals_of_liechtenstein_desc: "我們與列支敦士登歷來關係密切，他們最近的一位親王弗朗茨·約瑟夫一世甚至娶了一位[AUS.GetAdjective]女性為妻。由於費迪南沒有子嗣，王位曾經由列支敦士登的阿洛伊斯或約翰內斯繼承，但兩位王子都放棄了對王位的要求。兩位王子現在向我們提供幫助，我們應該充分利用這個機會！"
 AUS_osterreichische_akademie: "奧地利科學院"
 AUS_osterreichische_akademie_desc: "奧地利科學院於1846年由皇帝斐迪南的手諭成立。自那以後，學院從一個小型科學協會和社團發展成為一個受人尊敬的學院，培養出了諾貝爾獎得主。學院在我們的財政危機期間遇到了困難，但我們的投資肯定能使它重回正軌，並在未來為我們帶來巨大的利益。"
 AUS_royal_scientific_grants: "皇家科學資助"
 AUS_royal_scientific_grants_desc: "我們對奧地利科學院的投資對我們和學院都大有裨益，我們現在正在考慮是否將這種合作關係提升到一個新的水平。學院目前有許多才華橫溢的科學家，若能說服他們，我們應該能夠讓他們也為我們的項目工作。"
 AUS_demand_hungarian_submission: "要求[HUN.GetAdjective]臣服"
 AUS_demand_hungarian_submission_desc: "我們與[HUN.GetNameDef]曾經長時間以雙重君主制的形式共同繁榮。雖然這種安排在當時起了作用，但事實證明，他們不像我們那樣善於治國，他們為我們的國家所做的貢獻寥寥可數。通過使他們成為我們的傀儡政權，我們可以保留雙重君主制的最佳部分，同時避免最糟糕的情況。"
 AUS_demand_hungarian_submission_tt: "解鎖§Y降伏[HUN.GetNameDef]§!決議以及單獨的§Y增加外交降伏可能性§!決議。"
 AUS_subjugate_lands_of_old: "降伏故土"
 AUS_subjugate_lands_of_old_desc: "處理完眼前的問題後，我們必須開始向我們以前的邊界擴張。雖然我們對我們的外交官和軍隊充滿信心，但我們明智的做法是分步驟計劃這一擴張，而不是在所有戰線上發動全面進攻。"
 AUS_subjugate_lands_of_old_tt: "解鎖§Y降伏故土§!決議以及單獨的§Y增加外交降伏可能性§!決議。"
 AUS_the_silesian_question: "西里西亞問題"
 AUS_the_silesian_question_desc: "西里西亞地區曾長期是我們廣闊帝國的一部分。雖然這些地區與我們的心臟地帶不相連，但它們對我們仍具有非常大的價值。我們應該要求這些地區的迴歸。"
 AUS_reclaim_habsburg: "奪回哈布斯堡"
 AUS_reclaim_habsburg_desc: "我們自己的家鄉仍然不在我們的控制之下。哈布斯堡家族從未忘記他們在哈布斯堡村的卑微起點，即使在他們成為貴族之後，他們仍被視為低級貴族。現在，局勢已經改變，是時候收復故土了。"
 AUS_reclaim_habsburg_tt: "如果我們比他們§G更強大§!，他們更可能接受。\n\n解鎖§Y重新整合瑞士各州§!的決議。"
 AUS_war_against_guarantors: "對抗擔保國的戰爭"
 AUS_war_against_guarantors_desc: "《聖日耳曼昂萊條約》中的文本是明確的，如果我們需要幫助來捍衛我們的獨立，我們將得到援助。但事實證明這只是空話，只是為了控制我們。現在我們正在慢慢恢復實力，是時候復仇了。我們要讓他們明白永遠不要再招惹[ROOT.GetNameDef]！"
 AUS_tighten_control_of_subjects: "控制附屬國"
 AUS_tighten_control_of_subjects_desc: "我們已經成為我們以前一些土地的宗主國，雖然這確實偉大，但我們不能止步於此。我們的這些傀儡國家應該由偉大的領導人領導，就像我們一樣，幸好，我們知道人選！"
 AUS_tighten_control_of_subjects_tt: "如果§Y奧托·馮·哈布斯堡§!是§Y[ROOT.GetNameWithFlag]§!的當前統治者，解鎖決議，可以在降伏§Y[HUN.GetNameWithFlag]§!、§Y[CZE.GetNameWithFlag]§!和§Y[POL.GetNameWithFlag]§!後§Y扶植哈布斯堡君主§!。"
 AUS_tighten_control_of_subjects_tt2: "解鎖決議，可以在降伏§Y[HUN.GetNameWithFlag]§!、§Y[CZE.GetNameWithFlag]§!和§Y[POL.GetNameWithFlag]§!後§Y扶植哈布斯堡君主§!。"
 AUS_renew_claims_in_italy: "重申在[ITA.GetNameDef]的領土要求"
 AUS_renew_claims_in_italy_desc: "領土在那次世界大戰後被分割時，[ITA.GetAdjective]從我們這裡奪走了上阿迪傑和特倫蒂諾，儘管他們並不真正想要這些土地。現在我們的力量已經基本恢復，要求他們歸還我們的合法領土是完全合理的。"
 AUS_extend_italian_claims: "加大我們對[ITA.GetAdjective]的領土要求"
 AUS_extend_italian_claims_desc: "我們已經確定瞭如何處理[ITA.GetNameDef]在那次世界大戰結束時從我們這裡竊取的地區。我們從未擁有過[160.GetName]和[159.GetName]，但它們一直是我們高度關注的地區。既然我們已經索回了我們之前擁有的領土，為什麼不更進一步，取得我們過去想要的，而且現在仍然想要的領土呢？"
 AUS_extend_italian_claims_tt: "解鎖決議§Y重新整合意大利的宣稱§!。"
 AUS_strike_deal_with_italy: "與[ITA.GetNameDef]達成協議"
 AUS_strike_deal_with_italy_desc: "自從這些領土在那次世界大戰結束時被奪走以來，我們一直希望擁有意大利北部的特倫蒂諾和上阿迪傑。那時的[ITA.GetAdjective]表達了他們並不想吞併這些被強加給他們的領土，只是為了阻止我們得到它們。通過一些外交努力，我們應該能夠就這些領土與他們達成協議。"
 AUS_the_danubian_federation: "多瑙聯邦"
 AUS_the_danubian_federation_desc: "憑藉我們在歐洲中部的獨特位置，我們完全有潛力在不需要明顯領土擴張的情況下變得非常有影響力。與我們軍隊的力量同樣重要的是，我們的言論和外交行動的力量。通過圍繞多瑙河建立一個共同體，我們可以擁有遠超我們自身邊界的外交影響力和權力。"
 AUS_invite_danubian_countries: "邀請多瑙國家"
 AUS_invite_danubian_countries_desc: "既然我們的意圖聲明已經公之於眾，現在是時候擴大這個聯盟，使其達到可能的最佳狀態了。我們的第一步自然需要邀請目前尚未加入任何陣營的其他多瑙河國家加入我們。"
 AUS_invite_danubian_countries_tt: "解鎖決議§Y邀請多瑙國家加入多瑙聯邦§!"
 AUS_danubian_unity: "多瑙河聯盟"
 AUS_danubian_unity_desc: "隨著我們的聯盟穩步增長，我們必須確保不會忽視我們自己的國家和內政。我們的人民必須知道我們的陣營將給帶來他們的偉大！"
 AUS_inviting_the_observers: "邀請觀察員國"
 AUS_inviting_the_observers_desc: "隨著我們陣營的壯大，越來越明顯，我們可以在歐洲成為一支不容小覷的力量。多瑙河不僅對它流經的國傢俱有重要作用，對依靠它進行貨物運輸的國家也同樣重要。我們應該考慮邀請這些國家加入[ROOT.GetFactionName]"
 AUS_inviting_the_observers_tt: "解鎖決議§Y邀請更多國家加入多瑙聯邦§!"
 AUS_unexpected_alliances: "意料之外的盟友"
 AUS_unexpected_alliances_desc: "我們必須對所有可能希望加入我們陣營的多瑙河國家持開放態度。不管我們過去有何分歧，我們都必須伸出手來，邀請他們站在我們一邊以支持多瑙河聯盟。"
 AUS_diplomatic_effort: "多瑙外交"
 AUS_diplomatic_effort_desc: "為了保持我們聯盟應有的強大領導者地位，我們必須確保所有成員國都喜歡我們。我們應該加強外交努力，深化聯盟內部的關係。"
 AUS_diplomatic_effort_tt: "一旦我們§Y擴大了我們的聯邦§!，我們將通過外交努力§Y改善與其他成員的關係§!。"
 AUS_danubian_leader: "多瑙利益的保護者"
 AUS_protector_of_the_danube: "多瑙河保護者"
 AUS_protector_of_the_danube_desc: "隨著我們緊鄰國家的局勢持續惡化，必須採取措施確保我們所有成員的長治久安。作為[ROOT.GetFactionName]的領導者，這一責任必然落在我們身上。"
 AUS_protector_of_the_danube_tt: "解鎖決議以§Y建議統一為聯邦國家§!並§Y說服成員國支持我們§!\n\n§R列強極不可能接受這一點，除非他們被大大削弱，或者[AUS.GetNameDef]成為更強大的列強！§!"
 AUS_via_danube_to_europe: "經由多瑙河到達歐洲"
 AUS_via_danube_to_europe_desc: "拉攏了周邊國家後，我們的陣營已相當可觀，雖然可以止步於此，但我們也可以放眼多瑙河以外的地方。在歐洲範圍內建立一個注重合作和共同體的陣營有可能是一項非常有價值的事業。"
 AUS_via_danube_to_europe_tt: "將§Y$AUS_the_danubian_federation_category$§!決議替換為§Y$BEL_closer_european_union_cat$§!決議，允許邀請更多國家並推動§Y有限聯邦化§!\n\n§R這將鎖定共享國策§!“§Y$HABSBURG_an_empire_not_just_in_name$§!”§R，如果是§Y中立主義§!，為所有擁有該§Y共享國策樹§!的附屬國添加降低自治的§Y民族精神§!，使完全整合附屬國變得更容易§!。"
 AUS_the_right_to_rearm: "軍備重整的權利"
 AUS_the_right_to_rearm_desc: "自從那次世界大戰以來，我們一直受《聖日耳曼昂萊條約》的約束，限制我們的常備軍規模不得超過三萬人。隨著我們周圍的事態發展，我們認為這已不再是可持續的，我們必須獲得重整軍備的權利。"
 AUS_the_right_to_rearm_dem_tt: "作為一個§Y民主§!國家，尋求軍備重整的許可。"
 AUS_the_right_to_rearm_dem_instead_tt: "如果[ROOT.GetNameDef]是§Y民主§!國家，效果將改為尋求軍備重整的許可。"
 AUS_the_right_to_rearm_fed_tt: "作為§Y中立§!國家，不顧後果地進行軍備重整。"
 AUS_the_right_to_rearm_fed_instead_tt: "如果[ROOT.GetNameDef]是§Y中立§!國家，效果將改為不顧後果地進行軍備重整。"
 AUS_defence_of_the_homeland: "保衛家園"
 AUS_defence_of_the_homeland_desc: "現在我們終於可以重建我們的軍隊，我們需要研究如何使其專業化。目前我們的地理位置相當脆弱，讓我們的軍隊成為防禦戰專家，並教會他們如何利用我們獨特的地形為他們帶來優勢將是有益的。"
 AUS_the_political_front: "守住政治戰線"
 AUS_the_political_front_desc: "戰爭的勝利不僅取決於前線和戰場，同樣也依賴於工廠和街道。通過加強我們的政治系統，我們可以確保即使在最壞的情況下，我們也能大權在握。"
 AUS_austrian_aggression: "奧地利出擊"
 AUS_austrian_aggression_desc: "儘管在這樣的時期，防禦似乎是顯而易見的選擇，但這隻意味著等待攻擊的到來。如果我們能加強軍隊力量，確保有能力隨時發動進攻，我們就能有效地威懾潛在的攻擊者。畢竟，進攻是最好的防禦。"
 AUS_at_the_ready: "準備就緒"
 AUS_at_the_ready_desc: "不僅是我們的軍隊需要訓練到精益求精，始終保持戰備狀態。那些為我們的軍隊提供裝備支持的人也應該意識到他們對國家的責任。通過確保工人隨時準備支持我們的武裝力量，我們為勝利做好了準備。"
 AUS_form_evidenzburo: "改革證據檔案局"
 AUS_form_evidenzburo_desc: "無論是採取進攻態勢還是防禦姿態，掌握對手的情報都至關重要。我們既不能讓敵方的實力、行動速度和組織協調能力打我們一個措手不及，也決不能讓他們獲取我方的關鍵信息。眼下正是改革傳統情報檔案體系、以適應新時代需求的最佳時機。"
 AUS_form_evidenzburo_tt: "對該機構的升級將取決於[ROOT.GetNameDef]在§Y保衛家園§!和§Y奧地利出擊§!之間的選擇"
 AUS_release_imprisoned_leaders: "合法化政治反對派"
 AUS_release_imprisoned_leaders_desc: "隨著我們的國家逐漸變得更加專制，那些敢於反對的人被迅速監禁。這樣的監禁完全是不公正的，純粹基於政治。我們應該釋放那些被監禁的人，並再次合法化政治反對派。"
 AUS_hold_elections: "舉行選舉"
 AUS_hold_elections_desc: "自從1930年11月9日進行了最後一次選舉，到1934年的“議會自毀”以來，我們的人民幾乎失去了對[ROOT.GetAdjective]民主制度的信心。恢復人民的信心、讓人民有發言權，這些應該是我們的首要任務！"
 AUS_rebuild_democratic_systems: "重建民主制度"
 AUS_rebuild_democratic_systems_desc: "民主制度是非常脆弱的，容易被拆除，但難以建立或恢復。但為了人民，這件事必須立即進行。為了國家的利益，提倡獨裁的政黨必須被取締。"
 AUS_rebuild_democratic_systems_tt: "當前的§Y法西斯§!政黨§Y德意志國家社會主義工人黨§!將被取締，並且："
 AUS_a_new_constitution: "新憲法"
 AUS_a_new_constitution_desc: "我們最後一次憲法修訂以五月憲法和獨裁政權加強對國家控制的災難告終。通過重新建立一套嚴格的民主憲法，我們必能確保這種情況不再發生。"
 AUS_seek_support_from_guarantors: "尋求擔保國的支持"
 AUS_seek_support_from_guarantors_desc: "《聖日耳曼昂萊條約》給我們帶來諸多限制，但也有一線希望。由於我們被禁止擁有任何形式的具有威懾力的軍隊，因此所謂的擔保國應該來保護我們。我們應該向他們尋求支持。"
 AUS_seek_support_from_guarantors_tt: "如果他們對我們的評價較§G高§!，他們更有可能給予積極回應。"
 AUS_stabilize_the_political_climate: "穩定政治氣候"
 AUS_stabilize_the_political_climate_desc: "也許是黨禁的歷史遺留問題，我們當前的反對派激進且極端。我們需要確保他們遵守現行法律，並且不會有被禁止的風險。這種寬容的態度應該能夠贏得他們較為溫和的追隨者的支持。"
 AUS_outlaw_the_radicals: "取締激進分子"
 AUS_outlaw_the_radicals_desc: "我們處於非常微妙的政治局勢中。現在不是任憑激進政黨在政治光譜兩端相互爭鬥的時候。在最糟糕的情況過去之前，我們不能讓他們散佈他們的惡劣宣傳！"
 AUS_strengthen_the_cabinet: "加強內閣"
 AUS_strengthen_the_cabinet_desc: "雖然民主思想在[ROOT.GetNameDef]中傳播得相當快，但我們的內閣仍然相對薄弱。權力當然應該屬於人民以及作為權力延伸的議會和內閣，但說到底，為了有效治理，必須優先考慮內閣。"
 AUS_pardon_political_exiles: "赦免政治流亡者"
 AUS_pardon_political_exiles_desc: "在奧地利法西斯主義統治下的所謂社團主義國家期間，許多傑出政治家逃離了我們的國家。不論他們的政治立場如何，我們應該邀請他們歸國。"
 AUS_join_the_allies: "加入同盟國"
 AUS_join_the_allies_desc: "傳統上，我們總是認為單憑自己我們就是最強大的國家，然而，隨著周邊國際形勢的持續惡化，我們被迫承認那可能不是真的。孤立主義並不總是最好的選擇。我們應該尋求加入一個強大的民主陣營。"
 AUS_join_the_allies_tt: "被接受為成員國的可能性取決於本身是否為民主國家以及陣營領袖對你的評價。\n\n如果我們被拒絕，我們將能夠建立自己的陣營。"
 AUS_industrial_exchange: "知識交流"
 AUS_industrial_exchange_desc: "我們有很多東西要向我們的新盟友學習，特別是在建設方面，同樣在軍事策略方面也是如此。由於我們的盟友願意與我們分享這些信息，我們應該充分利用這一點。"
 AUS_alpine_federation_focus: "阿爾卑斯聯邦"
 AUS_alpine_federation_focus_desc: "我們不再覺得[ROOT.GetNameDef]選擇孤立路線是最好的選擇，然而，其他陣營似乎都不是可行的選項。這將是我們向阿爾卑斯地區的其他國家提出我們的提議的絕佳機會。"
 AUS_alpine_federation_focus_tt: "邀請§Y[SWI.GetNameWithFlag]§!、§Y[FRA.GetNameWithFlag]§!和§Y[ITA.GetNameWithFlag]§!加入你的陣營，只要他們是§Y民主主義§!或§Y中立主義§!，並且目前不在陣營中。"
 AUS_invite_the_entente: "邀請小協約國"
 AUS_invite_the_entente_desc: "我們將受益於區域之外的新成員國，即便這意味著突破阿爾卑斯的地理範圍。小協約組織成立是為了防止哈布斯堡家族的復辟，既然我們現在立場一致，為什麼不邀請他們呢？"
 AUS_invite_the_entente_tt: "邀請§Y[YUG.GetNameWithFlag]§!、§Y[ROM.GetNameWithFlag]§!和§Y[CZE.GetNameWithFlag]§!加入你的陣營，只要他們是§Y民主主義§!或§Y中立主義§!，並且目前不在陣營中。"
 AUS_offensive_on_the_fascists: "反法西斯攻勢"
 AUS_offensive_on_the_fascists_desc: "我們不能再忽視這樣一個事實：我們的南方鄰國是許多問題的根源。雖然外交始終是我們的首選方案，但有時需要更激烈的干預。"
 AUS_lawmaking_leniency: "法律制定的靈活性"
 AUS_lawmaking_leniency_desc: "我們用來通過新法律的制度過時了，需要儘快得到重製。在這樣的時代，我們需要能夠隨著形勢的日新月異迅速通過新法律。我們應該考慮推動更精簡的立法程序。"
 AUS_empowering_the_chancellor: "賦權總理"
 AUS_empowering_the_chancellor_desc: "擔當我們國家總理的角色並不容易。如果沒有[ROOT.GetLeader]，[ROOT.GetNameDefCap]不會有今天的成就，雖然我們不應該變成個人崇拜的國家，但我們可能想要表達對總理的感激。"
 AUS_join_the_research_program: "聯合研究項目"
 AUS_join_the_research_program_desc: "既然我們加入了志同道合的國家陣營，我們應該儘可能從中受益。通過為我們和我們的盟友建立一個技術共享團體，我們可以通過技術上的卓越增強整個陣營的實力。"
 AUS_join_the_research_program_tt: "§Y[ROOT.GetNameDef]§!以及所有與我們在同一陣營的國家，將加入一個§Y科技共享組織§!"
 AUS_the_right_to_self_determination: "我們的自決權"
 AUS_the_right_to_self_determination_desc: "我們曾經依賴於自決權及其保護。現在我們站在另一邊，我們必須成為那些在暴力壓迫面前為生存而戰的國家的保護者！"
 AUS_our_brothers_in_the_east: "我們的東方兄弟"
 AUS_our_brothers_in_the_east_desc: "儘管我們現在終於重新確立了自己的民主地位，但仍然有其他人生活在獨裁者的陰影下。雖然我們無意與我們的[HUN.GetAdjective]兄弟重新融合，但我們仍然認為他們也應該有機會為自己做出選擇。他們也必定會實現民主！"
 AUS_deal_with_the_german_threat: "解決德國威脅"
 AUS_deal_with_the_german_threat_desc: "[GER.GetNameDefCap]多年來一直是我們西北邊界的威脅。他們的政策一直很苛刻，而且他們經常對我們的生存發出威脅。現在是我們徹底結束這種威脅的時候了。"
 AUS_end_european_fascism: "終結歐洲法西斯"
 AUS_end_european_fascism_desc: "在我們所有人安全之前，沒有人是安全的。法西斯主義在歐洲仍然盛行，並且無疑將在未來引發更多問題。我們應採取行動防止這種意識形態的蔓延。"
 AUS_end_european_fascism_tt: "獲得對§Y歐洲§!所有§Y法西斯主義§!國家的§Y傀儡§!戰爭目標"
 AUS_end_european_fascism_d_tt: "獲得對§Y歐洲§!所有§Y法西斯主義§!國家的§Y顛覆政權§!戰爭目標"
 AUS_austromarxism_focus: "奧地利馬克思主義"
 AUS_austromarxism_focus_desc: "由維克托·阿德勒、奧托·鮑威爾、卡爾·倫納、馬克斯·阿德勒和魯道夫·希爾弗丁等人首創的奧地利馬克思主義概念長期指導著我們。在他們不同觀點的推動下，一種介於社會民主主義和共產主義之間的中間地帶誕生了。這使得相比單獨兩派，它擁有更廣泛的民眾支持。"
 AUS_rally_the_people: "團結人民"
 AUS_rally_the_people_desc: "在我們的歷史上，那些與我們有共同理想的人曾多次發動政變。為了不重蹈覆轍，我們必須團結人民，推動改革。"
 AUS_ban_dnsap: "剷除民族主義者"
 AUS_ban_dnsap_desc: "目前，我們國內存在著真正威脅社會的政黨。雖然我們希望看到政治反對派，但我們必須確保這樣做不會危及我們的安全。必須真正禁止德意志國家社會主義工人黨，而且必須認清祖國陣線的本質！"
 AUS_renounce_the_treaties: "廢除條約"
 AUS_renounce_the_treaties_desc: "雖然我們的政府通常傾向於對話和外交，而不是衝突和魯莽的行動，但在《聖日耳曼昂萊條約》的問題上我們沒有理由拖延。隨著我們的國家逐漸穩定並重新掌控局勢，我們沒有理由繼續受到如此嚴格的規則束縛。我們將立即廢除這一條約。"
 AUS_emergency_measaures: "緊急措施"
 AUS_emergency_measaures_desc: "雖然我們從未支持革命，但越來越明顯的是，我們不能依靠社會民主黨來實現我們國家再次繁榮所需的變革。我們必須準備好為[ROOT.GetNameDef]的工人階級而戰！"
 AUS_schutzbund_support: "獲得保衛聯盟的支持"
 AUS_schutzbund_support_desc: "大多數[ROOT.GetAdjective]準軍事組織都有民族主義、正統主義甚至法西斯主義的政治圖謀，毫無疑問，他們在一定程度上要為我國的部分武裝衝突負責。雖然共和國保衛聯盟也引發了不少問題，但事實是，從政治上講，我們非常相似。我們應該招募他們加入我們的事業。"
 AUS_schutzbund_support_tt: "在§Y共產主義§!內戰開始後，§Y3§!支§Y保衛聯盟§!部隊將在§Y[4.GetName]§!出現。\n\n對立方將在§Y[152.GetName]§!生成§Y1§!支§Y保安團§!部隊，而不是§R2§!個。"
 AUS_intervention_in_spain: "干預西班牙"
 AUS_intervention_in_spain_desc: "[SPR.GetAdjective]目前陷入了一場席捲伊比利亞半島的暴力內戰。不管我們的處境多麼危險，我們仍然應該努力幫助他們，畢竟他們正在與民族主義者進行一場正義的戰鬥。"
 AUS_invite_spanish_exiles: "邀請西班牙的流亡者"
 AUS_invite_spanish_exiles_desc: "我們希望西班牙內戰有另一種結果。正如我們在戰場上提供援助一樣，我們現在必須在其他方面提供幫助，並接納那些逃離民族主義統治的人。"
 AUS_volunteer_effort_SPR_flag: "向西班牙派遣志願軍"
 AUS_celebrate_spanish_victory: "慶祝西班牙的勝利"
 AUS_celebrate_spanish_victory_desc: "隨著伊比利亞半島上的暴力衝突逐漸平息，很明顯共和派仍然控制著他們的國家。我們的援助可能也在這場勝利中發揮了作用，我們有權要求對我們的付出給予一定的補償。"
 AUS_revolution: "重奪紅色維也納"
 AUS_revolution_desc: "時機已到，我們不能再僅作為執政黨的反對派而存在。我們的人民應得到當前領導層所無法提供的更好待遇，而我們日益增長的人氣證明現在是採取行動的時候了！"
 AUS_revolution_tt: "擁有民族精神§Y民兵支持§!，將在內戰開始後生成3支§Y保衛聯盟§!部隊。"
 AUS_revolution_tt_2: "給予每方的部隊數量取決於§Y共產主義§!的支持率。\n\n如果§Y共產主義支持率§!超過§Y60%§!，則內戰將完全避免。"
 AUS_seek_soviet_support: "尋求蘇聯支持"
 AUS_seek_soviet_support_desc: "如果我們要同時抵抗北方的[GER.GetAdjective]威脅，並將我們的國家轉變為他們應得的共產主義社會，我們將需要外部支持。我們與[SOV.GetNameDef]之間有過輕微的意識形態差異，但在根本上，我們仍然有許多相似之處。"
 AUS_seek_soviet_support_tt: "§R現在依賴[SOV.GetAdjective]的支持將使我們以後無法攻擊他們！§!"
 AUS_politicized_general_staff: "總參謀部政治化"
 AUS_politicized_general_staff_desc: "儘管我們之前已經看到帶有政治圖謀的準軍事團體最終可能成為我們的真正麻煩，但他們對於我們的正規軍卻不可同日而語。一支充分了解我們政策並與我們有共同願景的軍隊，將更願意並且更有能力為我們的安全而戰！"
 AUS_promote_the_worthy: "提拔有才之將"
 AUS_promote_the_worthy_desc: "我們的一些將軍對我們的事業和國家的做出巨大承諾和並表現得極為忠誠。將他們立為模範，並通過晉升來獎勵他們，我們有望鼓勵更多軍官效仿他們！"
 AUS_align_with_ussr: "與[SOU.GetAdjective]保持一致"
 AUS_align_with_ussr_desc: "我們越來越清楚地瞭解為什麼[SOV.GetNameDef]會以這種方式運行。雖然最初我們對[SOV.GetAdjective]體制有所疑慮，但我們已經意識到這可能是治理國家的最佳方式。只要我們遵行[SOV.GetLeader]的宗旨，我們的國家將更穩定，並且可能獲得他們的好感。"
 AUS_align_with_ussr_tt: "§Y奧地利共產黨§!的當前領袖會獲得一項特質，只要§Y[SOV.GetFlag][SOV.GetNameDef]§!仍是§Y共產主義§!，就與§Y[SOV.GetFlag][SOV.GetLeader]§!的學說保持一致"
 AUS_raid_military_storages: "查抄舊軍備倉庫"
 AUS_raid_military_storages_desc: "全國各地的舊倉庫中有大量軍事裝備。鑑於當前情況，我們認為這些裝備在人民手中比鎖在倉庫裡更有用。現在是我們充分利用這些資源的時候了。"
 AUS_properly_trained_militias: "訓練有素的民兵"
 AUS_properly_trained_militias_desc: "我們的民兵已成為國防的重要組成，但目前他們未經正式訓練。雖然民兵的性質是永遠不可能完全控制和充分訓練他們，但開展訓練將對我們所有人有益。"
 AUS_the_peoples_army: "人民軍隊"
 AUS_the_peoples_army_desc: "我們致力於確保人們在這種情況下有適當的武裝，這產生了意想不到但非常受歡迎的副作用。越來越多的人現在想要加入軍隊。"
 AUS_a_safe_harbor_for_dissidents: "異見人士的安全港"
 AUS_a_safe_harbor_for_dissidents_desc: "最近，政治流亡者在世界上已經成為一種非常普遍的景象，其中一些人與我們有類似的政治觀點。通過招募這些流亡者到我們這邊，我們可以從他們的技能中獲益良多。"
 AUS_a_safe_harbor_for_dissidents_tt: "§Y奧爾加·塔拉圖塔§!，其效果為（§G+5%§!戰爭支持，§R-10%§!穩定性，§G+10%§!可招募人口係數，§G+0.03§!每日共產主義支持）"
 AUS_establish_rote_hilfe: "重建紅色援助"
 AUS_establish_rote_hilfe_desc: "奧地利紅色援助於1925年由馬爾克·朔爾創立並領導。從那時起直到被腐敗的奧地利法西斯政權禁止，該組織幫助了[ROOT.GetNameDef]無數政治難民和尋求庇護者。現在我們的舊政權已成往昔，是時候再次允許該組織自由運作了。"
 AUS_a_new_beginning: "一個新的開始"
 AUS_a_new_beginning_desc: "“隨著塵埃落定，我們的新政府正式上任，我們必須放眼未來。這只是[ROOT.GetNameDef]的開始，我們將共同成長！”"
 AUS_join_comintern: "加入共產國際"
 AUS_join_comintern_desc: "在與蘇聯結盟之後，現在我們有了一條非常明確的道路。我們必須加入共產國際的同志們，這是我們人民願望和應得的！"
 AUS_danubian_socialist_communes: "建立多瑙河集團"
 AUS_danubian_socialist_communes_desc: "截至目前，[ROOT.GetNameDef]一直在獨自面對我們的對手。我們希望未來不再如此，但目前沒有任何與我們國家理念一致的聯盟。創建我們自己的陣營顯然是最佳選擇！"
 AUS_womens_education_initiative: "女性教育計劃"
 AUS_womens_education_initiative_desc: "自20世紀初以來，女性被允許在大學接受教育，但只限於特定院系。推動大學對所有人開放，很可能會對我們的國家有益。"
 AUS_universitat_wien: "維也納大學"
 AUS_universitat_wien_desc: "就像我們的大多數大學一樣，維也納大學在法西斯統治下也遭受了困境。法西斯主義的思潮主要被學生們自由傳播。通過加強規定，並確保這種情況不再繼續，我們可以確保提供更高質量的教育。"
 AUS_scientific_grants: "科學資助"
 AUS_scientific_grants_desc: "隨著我們增加科學研究的預算，這些新知識的潛在應用已經變得明顯。通過提供一系列資助，我們應該能夠進一步加強這種積極影響。"
 available_scientist_tt: "一名§Y科學家§!§G可用§!："
 AUS_centralize_the_industrial_sector: "國有化工業部門"
 AUS_centralize_the_industrial_sector_desc: "隨著時間的推移和共產主義思想在國家內部紮根，我們現在能夠採取更激進的措施。幾年前，國有化工業的想法還會受到我們人民的反對，現在這似乎是下一個合乎邏輯的步驟。"
 AUS_cut_ties_with_the_church: "切斷與教會的紐帶"
 AUS_cut_ties_with_the_church_desc: "我們政府與教會的紐帶只是所謂神職法西斯主義的殘留物。法西斯主義已被消除，現在我們也該剝奪神職人員的政治權力。"
 generic_remove_as_political_advisor_tt: "§R移除§!§Y政治顧問§!："
 AUS_spur_the_communist_resistance: "推廣共產主義思想"
 AUS_spur_the_communist_resistance_desc: "我們周圍的世界對普通人和工人的敵意明顯加大了。雖然我們自己倖免於難，但我們不能忽視我們周圍兄弟姐妹的痛苦。"
 AUS_danubian_communism_bypass_tt: "所有§Y多瑙§!國家和在§Y多瑙區域§!擁有§Y歷史利益§!的國家：\n當前執政黨是§Y共產主義§!。"
 AUS_danubian_communism_bypass_has_rejected_tt: "已拒絕[ROOT.GetAdjective]推動§Y共產主義§!的嘗試。"
 AUS_spur_the_communist_resistance_tt: "解鎖決議§Y鼓勵共產主義情緒§!於："
 AUS_rapid_revolutions: "快速革命"
 AUS_rapid_revolutions_desc: "雖然我們解放外國工人並確保他們的生產資料的行動使我們自己的狀況有所惡化，但我們不能有絲毫休息的時間。我們必須儘快從資本主義的枷鎖中解放我們的同志，即使這可能讓我們的人民暫時受到極輕微的損傷。"
 AUS_meticulous_preparations: "細緻的準備"
 AUS_meticulous_preparations_desc: "解放我們周圍的工人確實有一種誘惑，但這可能會讓後方空虛。我們在境外的行動已在[ROOT.GetNameDef]引起了一些騷動，我們應在致力於幫助他人之前先解決這個問題。"
 AUS_demand_liberation_of_workers: "要求解放工人"
 AUS_demand_liberation_of_workers_desc: "我們採取行動的時機已經到來。通過在多瑙河沿岸發揚共產主義精神，我們現在必須解放那些與我們思想一致的人們！"
 AUS_demand_liberation_of_workers_tt: "解鎖決議，在我們之前成功增強共產主義情緒的國家§Y要求解放工人§!。"
 AUS_union_of_danubian_socialist_republics: "多瑙社會主義聯盟"
 AUS_union_of_danubian_socialist_republics_desc: "我們的影響現已遍及整個歐洲，我們周圍的工人正在被解放。我們的舊名字不再能描述我們的真實身份，我們應該考慮我們希望別人如何認識我們。"
 AUS_the_correct_communism: "共產主義的正確形式"
 AUS_the_correct_communism_desc: "實踐共產主義的方式有很多種，大多數都不是我們喜歡的。[SOV.GetNameDefCap]的統治方式正在拖累我們意識形態的名聲。不能讓他們繼續下去。"
 AUS_seize_galicia: "奪取加利西亞的土地"
 AUS_seize_galicia_desc: "隨著時間的推移，我們逐漸意識到我們非常懷念我們舊帝國的故土。近年來，看到加利西亞在不同的國家之間四分五裂，使我們更加堅定了應再次奪取它的決心。"
 AUS_seize_galicia_tt: "獲得§Y[88.GetName]§!、§Y[89.GetName]§!和§Y[91.GetName]§!的核心。\n\n獲得奪回§Y加利西亞§!核心的§Y戰爭目標§!。"
 AUS_regulate_austrian_finance_sector: "監管金融部門"
 AUS_regulate_austrian_finance_sector_desc: "儘管我們盡最大努力使經濟重新平衡，[AUS.GetAdjective]的經濟仍然舉步維艱。如果不採取措施，我們擔心另一場全面的經濟崩潰及伴隨的惡性通貨膨脹可能很快就會到來。是時候重新控制我們的金融部門了。"
 AUS_regulate_austrian_finance_sector_tt: "解鎖並專門化銀行§Y工業關注§!以提升§Y初始生產效率§!或降低§Y消費品§!需求。或者，銀行可能在§Y兩方面§!都有所影響，但效果較小。"
 AUS_seek_papal_support: "尋求教宗支持"
 AUS_seek_papal_support_desc: "作為一個天主教國家，我們一直非常重視神職人員的教誨。通過獲得教宗陛下的支持，我們可能會增強人民對我們的信心。"
 AUS_seek_papal_support_tt: "現執政黨的支持率上升：§G5%§!"
 AUS_saved_creditanstalt_flag: "重新定向資金支持奧地利信貸公司"
 AUS_saved_bankverein_flag: "重新定向資金支持維也納聯合銀行"
 AUS_kept_creditanstalt_bankverein_flag: "奧地利聯合信貸銀行保持合併"
 AUS_invest_in_erzberg_steel_mines: "投資埃爾茨山鋼鐵礦場"
 AUS_invest_in_erzberg_steel_mines_desc: "[AUS.GetNameDefCap]一直擁有相當豐富的鋼鐵礦藏。埃爾茨山的礦藏似乎尤其豐富。我們應考慮進一步投資，以充分開發它。"
 AUS_courting_the_princess_of_industry: "追求工業公主"
 AUS_courting_the_princess_of_industry_desc: "我們國家有許多工業巨頭可能會協助我們。曾在奧地利貿易界佔據主導地位的業界創始人格布呂德·古特曼的女兒伊麗莎白·馮·古特曼看起來最有希望。我們應該聯繫她，請求她的幫助。"
 AUS_expand_stpoltner_steelworks: "擴建聖珀爾滕鋼鐵廠"
 AUS_expand_stpoltner_steelworks_desc: "聖珀爾滕的鋼鐵廠顯示出非常有前景的成果。如果我們迅速行動，應該能夠按照我們的意願塑造它們，以最大限度地從工廠獲得收益。"
 AUS_invest_in_semperit_synthetics: "投資瑟姆珀裡特合成材料公司"
 AUS_invest_in_semperit_synthetics_desc: "在我們的鋼鐵供應問題得到解決後，我們需要考慮未來發展可能需要的其他資源。由於缺乏足夠的橡膠和石油來源，我們需要尋找其他途徑在本地獲取這些資源。"
 AUS_invest_in_semperit_synthetics_bonus: "投資瑟姆珀裡特公司"
 AUS_pulverfabrik_skodawerke: "投資斯柯達火藥廠"
 AUS_pulverfabrik_skodawerke_desc: "位於下奧地利的化工廠斯柯達火藥廠在過去有多種產品，包括火藥、炸藥和為鋼鐵廠生產化學品。目前，將他們的專長引導向合成資源的生產可能是最佳用途。"
 AUS_pulverfabrik_skodawerke_tt: "§Y3×§!§G25%§!研究加成：§Y燃料儲存§!和§Y燃料精煉§!。"
 AUS_pulverfabrik_skodawerke_bonus: "投資斯柯達公司"
 AUS_the_matzen_oil_fields: "開發馬岑油田"
 AUS_the_matzen_oil_fields_desc: "我們最近很幸運，在[AUS.GetNameDef]東部地區發現了石油。這是個好機會，讓我們能夠開發這一資源，並在工業上獲得優勢！"
 AUS_autobahn_west: "擴建西部高速公路"
 AUS_autobahn_west_desc: "我們的基礎設施需要更新，儘管我們希望加強全國的基礎設施，但現實情況是我們的經濟和工業狀況不允許這樣做。向西擴建並將我們的高速公路與[GER.GetNameDef]連接起來是我們當前情況下的最佳選擇。"
 AUS_autobahn_south: "擴建南部高速公路"
 AUS_autobahn_south_desc: "我們的基礎設施需要更新，儘管我們希望加強全國的基礎設施，但現實情況是我們的經濟和工業狀況不允許這樣做。向南擴建並將我們的高速公路與[ITA.GetNameDef]連接起來是我們當前情況下的最佳選擇。"
 AUS_autobahn_east: "擴建東部高速公路"
 AUS_autobahn_east_desc: "我們已經將我們的高速公路與我們的夥伴連接起來，這對雙方都非常有益。向東看，我們看到了在雙重君主制中的老盟友[HUN.GetNameDef]，如果將我們的基礎設施連接起來，我們可能同時會與他們建立更好的關係。"
 AUS_bbo_focus: "投資奧地利聯邦鐵路公司"
 AUS_bbo_focus_desc: "目前為止，我們的鐵路被忽視了，而且我們的鐵路公司，奧地利聯邦鐵路公司，被剝奪了資金。但是，要運行一個成功的國家，無論大小，我們需要確保全國都建有良好的鐵路。我們應該開始投資奧地利聯邦鐵路公司和我們的鐵路。"
 AUS_bbo_focus_tt: "§G提高§!可用§Y工業企業§!的效能："
 AUS_architechtual_advancements: "建築的發展"
 AUS_architechtual_advancements_desc: "最近我們在一所大學中發現了一位極具才華的建築師。他的建築不僅結構堅固，而且具有我們國家應有的優雅風格。我們應該考慮招募此人。"
 AUS_economic_resuscitation: "經濟復甦"
 AUS_economic_resuscitation_desc: "我們的經濟已經穩定並停滯在一個極低的水平上。雖然有些人認為這樣挺好，我們的經濟不再像石頭一樣墜落，但我們知道我們可以做得更好。我們仍有工作要做，這一次我們要確保我們的努力不止在短期生效。"
 AUS_economic_resuscitation_tt: "如果奧地利經濟進一步崩潰，再次給予奧地利民族精神§Y從經濟大蕭條中恢復§!。"
 AUS_devalue_the_schilling: "貶值先令"
 AUS_devalue_the_schilling_desc: "我們的經濟陷入困境和停滯的部分原因是我們的貨幣疲軟。雖然遠沒有達到1929年2877%的通脹率，但我們的通脹率仍然太高了。這可能不是最受人民歡迎的決定，但我們應該考慮讓我們的貨幣貶值。"
 AUS_devaluing_the_schilling_tt: "民族精神§Y$AUS_devalued_the_schilling$§!被移除後，國策§Y$AUS_bring_phonix_insurance_from_the_ashes$§!和§Y$AUS_great_austrian_economic_push$§!將會可用。"
 AUS_bring_phonix_insurance_from_the_ashes: "讓鳳凰保險公司浴火重生"
 AUS_bring_phonix_insurance_from_the_ashes_desc: "直到1936年初的鳳凰保險公司醜聞之前，我們的經濟一直在好轉。他們的戰爭參戰者保險確保了我們能夠招募人進入軍隊，即使面對戰爭，也能滿足國家的需求。讓鳳凰從灰燼中重生可能是明智的。"
 AUS_bring_phonix_insurance_from_the_ashes_tt1: "§Y為鳳凰保險公司承保§!替換為§Y鳳凰保險公司§!"
 AUS_great_austrian_economic_push: "奧地利經濟大推進"
 AUS_great_austrian_economic_push_desc: "我們不懈的努力正在逐漸收穫成效，我們的經濟再次增長。我們可以對此感到滿足，但在振興經濟的過程中，我們看到了未被開發的潛力。既然我們的金融部門可以進一步擴大，為什麼要滿足於現狀呢？"
 AUS_great_austrian_economic_push_tt: "進一步增強[ROOT.GetNameDef]的經濟和工廠產出，將§Y經濟恢復期§!替換為§Y經濟繁榮§!"
 AUS_volkschule: "國民學校"
 AUS_volkschule_desc: "在經濟危機期間，孩子們通常不上學，而是去工作或幫忙做家務。現在最糟糕的危機已經過去，我們需要解決欠下的知識債，否則我們將在技術和科學上落後。"
 AUS_industrialization_effort: "工業化努力"
 AUS_industrialization_effort_desc: "[AUS.GetAdjective]的工業部門讓我們平安度過了困境，效果出奇地好。鑑於當前高失業率，這也可能成為一個機遇。通過擴展我們的工業規模，我們可以同時解決兩個問題：增強我們的工業能力並降低失業。"
 AUS_invest_in_alpen_elektrowerke: "阿爾卑斯電子工程公司"
 AUS_invest_in_alpen_elektrowerke_desc: "為了在國際市場上保持競爭力，我們需要不斷創新並提出新的解決方案。投資於如阿爾卑斯電子工程公司這類專門從事電子開發的公司，可能會為我們提供我們所需要的優勢。"
 AUS_invest_in_kapsch: "電話與電報公司"
 AUS_invest_in_kapsch_desc: "為了在國際市場上保持競爭力，我們需要不斷創新並提出新的解決方案。投資同時處理電子產品和雷達的電話與電報工廠股份公司，可以讓我們的知識廣度達到競爭對手難以企及的水平。"
 AUS_construction_guilds: "建立建築行業協會"
 AUS_construction_guilds_desc: "隨著[AUS.GetNameDef]對工業越來越具吸引力，我們意識到新建廠房的速度已不足以跟上需求。建立建築行業協會將有助於加快國內的建設速度。"
 AUS_apprentice_programmes: "開展學徒計劃"
 AUS_apprentice_programmes_desc: "經過長時間的經濟衰退和失業，許多人缺乏工廠工作所需的技能和經驗。通過實施學徒計劃，我們將為工廠和工人提供雙贏的方案。"
 AUS_osterreichische_luftstreitkrafte: "奧地利空軍"
 AUS_osterreichische_luftstreitkrafte_desc: "因我們先輩的所作所為而強加給我們的條約，使我們的空軍受到了嚴重的負面影響。為了在這個新的、更加嚴酷的世界中立足，我們必須考慮按照當今時代的標準重建我們的空軍。"
 AUS_preparing_the_industry: "洛內工廠的飛機生產"
 AUS_preparing_the_industry_desc: "自《聖日耳曼昂萊條約》生效以來，我們最重要和最有價值的飛機制造商之一完全停止了新飛機的生產。現在我們正在重建空軍，我們也必須確保重建我們的供應商。"
 AUS_purchase_foreign_designs: "購買外國飛機"
 AUS_purchase_foreign_designs_desc: "為了在空中真正具有競爭力，我們必須研究其他國家是如何設計他們的飛機的。雖然國內生產有其優勢，但通過從多個國家採購飛機，我們可以獲得最適合我們需求的最佳型號，而無需支付鉅額的前期成本。"
 AUS_seek_international_partners: "尋找國際合作夥伴"
 AUS_seek_international_partners_desc: "如果我們希望在空中具有競爭力，我們需要向周圍的人學習如何最好地管理空軍。通過向主要強國和麵臨與我們相似挑戰的國家學習，我們可以達到前所未有的高度。"
 AUS_seek_international_partners_tt: "§Y對所有接受國家的影響：§!"
 AUS_seek_international_partners_tt2: "每有一個國家接受，§Y[ROOT.GetNameWithFlag]§!就會獲得50§Y空軍經驗§!！"
 AUS_seek_international_partners_tt3: "§Y[ROOT.GetNameWithFlag]§!會獲得所有接受國家的§Y市場準入§!！"
 AUS_air_research_boost: "創新的空軍"
 AUS_air_research_boost_desc: "[GetAirPartners]"
 AUS_has_no_air_partners: "儘管我們盡了最大努力，但我們未能在空軍發展方面獲得合作伙伴。我們將別無選擇，只能投資於我們自己的研究。"
 AUS_has_air_partners: "我們現已測試並試飛了各式飛行器，研究進展進入了無與倫比的階段，我們可以按喜好擇選飛行器的特徵。我們可能需要考慮利用這新知識，對一些我們已經採樣的飛行器中最理想的特性開展逆向工程。"
 AUS_innovative_airforce_bonus: "創新空軍"
 AUS_focus_on_domestic_production: "本國生產飛機"
 AUS_focus_on_domestic_production_desc: "完全獨立地建立和維持空軍是一項龐大的任務。但在如此不穩定的形勢下，我們不能讓自己依賴他人來維護我們武裝力量的核心部分。無論前期成本多高，我們都必須在空軍方面實現自給自足。"
 AUS_revitalize_austrian_air_industry: "振興航空工業"
 AUS_revitalize_austrian_air_industry_desc: "在那次世界大戰前和世界大戰期間，[AUS.GetNameDef]曾有一些飛機制造商。然而，自從《聖日耳曼昂萊條約》被強加於我們後，這已經變成了不可能。現在條約已經無效，我們應該迅速重建我們的工業，並在需要時使它恢復活力。"
 AUS_light_specialization: "戰鬥機航空連計劃"
 AUS_light_specialization_desc: "涉及到更大的機身時，我們無法與列強真正競爭，但通過擁有優越的戰鬥機和近距支援機，我們可以確保敵人甚至無法到達我們的領土。畢竟，空戰的勝負取決於空中纏鬥的勝負。"
 AUS_light_specialization_bonus: "戰鬥機航空連計劃"
 AUS_medium_specialization: "攻擊機航空連計劃"
 AUS_medium_specialization_desc: "我們的空軍必須能夠承擔多種角色。我們沒有資源來全面建設空軍的各個方面，因此找到一個好的折衷方案至關重要。雙引擎飛機可以同時用作轟炸機和戰鬥機，這對我們來說是完美的折衷方案。"
 AUS_medium_specialization_bonus: "攻擊機航空連計劃"
 AUS_heavy_specialization: "大型飛機航空連計劃"
 AUS_heavy_specialization_desc: "可以肯定的是，其他人會期望我們的空軍主要由小型飛機組成。擁有一支重型空軍可能看似不可能或不便，但如果投入得當，我們可以憑藉強大的力量壓倒大多數敵人。"
 AUS_heavy_specialization_bonus: "大型飛機航空連計劃"
 AUS_air_base_intiative: "空軍基地建設工作"
 AUS_air_base_intiative_desc: "儘管[AUS.GetNameDef]有一些空軍基地，但它們已不足以容納我們最近顯著增加的空軍規模。為了優化我們空軍的運轉，我們應該考慮建設必要的基礎設施，以保障我們飛機的起降。"
 AUS_wien_anti_air_effort: "維也納防空塔"
 AUS_wien_anti_air_effort_desc: "我們完全信任我們的空軍能夠保護這個國家免受空襲，但在人口密集地區建造防空建築可能會提供額外的保護層。我們應該考慮在維也納地區建造防空建築。"
 AUS_radar_effort: "黃金帽雷達系統工作"
 AUS_radar_effort_desc: "現代空軍不僅依賴於飛機，還依賴於良好的技術來引導它們。雷達技術已然發明，我們不能讓自己在技術上落後！"
 AUS_flight_schools: "奧地利飛行學校"
 AUS_flight_schools_desc: "要在空中取得成功，我們不僅需要更先進的飛機。為了確保我們在空中的優勢，我們還必須為我們的飛行員提供最好的訓練，使他們為可能遇到的每一種情況做好準備。就像我們訓練我們的地面部隊一樣，我們必須為我們的飛行員設立訓練計劃。"
 AUS_neustadter_flugzeugwerke: "諾伊施泰特飛機制造廠"
 AUS_neustadter_flugzeugwerke_desc: "最近，一家新的飛機制造商收購了一家停產的奧地利飛機制造廠。新公司諾伊施泰特飛機制造廠的本意是製造輕型運動飛機，但由於公司是由兩位前戰鬥機飛行員創立的，我們或可說服他們為我們生產。"
 AUS_aerial_strategies: "空戰策略"
 AUS_aerial_strategies_desc: "從經驗中學習是各種戰鬥中的美德。通過不斷發展和進一步增強我們的空戰策略，我們可以確保始終領先於敵人一步。"
 AUS_secret_rearmament: "秘密軍備重整"
 AUS_secret_rearmament_desc: "長時間的軍備重整限制使得我們無法建立任何形式的軍事存在。雖然《聖日耳曼昂萊條約》仍然有效，但我們找到了一些可以利用的漏洞以秘密進行軍備重整。"
 AUS_militarization_effort: "格拉茨機械車輛製造廠"
 AUS_militarization_effort_desc: "我們曾經強大的軍隊嚴重依賴的公司之一是格拉茨機械車輛製造股份公司。它不僅製造車輛，還製造榴彈炮和步槍的膛線，它曾經是我們軍事能力的基石。我們應該再次使它恢復盛況。"
 AUS_osterreichische_bundesheer: "奧地利[GetArmyName]"
 AUS_army_is_bundesheer: "奧地利聯邦軍"
 AUS_army_is_landwehr: "後備軍"
 AUS_osterreichische_bundesheer_desc: "《聖日耳曼昂萊條約》不再是障礙，現在是時候開始恢復建設了。不能讓[ROOT.GetNameDefCap]猝不及防，也不能指望我們在面對一個更具威脅性的世界時只是等待。"
 AUS_standardized_army_training: "標準化軍事訓練"
 AUS_standardized_army_training_desc: "由於多年無法訓練新兵，我們的部隊訓練體系已經顯露出問題。如果我們希望為我們的軍隊提供最好的訓練，我們應該考慮更新新兵的訓練程序。"
 AUS_osterreichische_fallschirmsjager: "奧地利傘兵"
 AUS_osterreichische_fallschirmsjager_desc: "在重建了我們的陸軍和空軍之後，現在是時候考慮如何最好地將這兩個部門結合起來，以實現更大的利益了。"
 AUS_osterreichische_gebirgsjager: "奧地利山地步兵"
 AUS_osterreichische_gebirgsjager_desc: "作為一個多山的國家，確保我們的部隊能夠充分訓練以應對這些條件和環境中的戰鬥符合我們的最佳利益。"
 AUS_osterreichische_gebirgsjager_tt: "啟用§H山地防禦訓練§!\n§H步兵\n    山地§!\n      防禦：§G+5%§!\n      移動：§G+5%§!\n§H山地步兵\n    山地§!\n      防禦：§G+5%§!\n      移動：§G+10%§!\n"
 AUS_osterreichische_seebataillon: "奧地利海軍陸戰隊"
 AUS_osterreichische_seebataillon_desc: "我們經歷了很多才在海岸線上獲得立足點，但發現我們的軍隊對實際在這些條件下作戰準備不足。我們必須研究一下怎樣才能使這些士兵更有效率地作戰。"
 AUS_steyr_arms_investment: "投資斯太爾武器公司"
 AUS_steyr_arms_investment_desc: "我們曾經的旗艦級槍械製造商因《聖日耳曼昂萊條約》的限制而受到嚴重影響。為了重新啟動他們的生產能力，我們應該考慮進行投資。"
 AUS_steyr_arms_investment_tt: "解鎖設計商§Y斯太爾武器公司§!"
 AUS_improve_army_logistics: "改善軍隊後勤"
 AUS_improve_army_logistics_desc: "我們的國家擁有美麗的風景，但不幸的是，這也意味著我們擁有難以逾越的地形和物流挑戰。如果我們不解決這些問題，我們最終的戰時努力可能會比預期的更差。"
 AUS_reinforcing_the_supply_network: "加強補給網絡"
 AUS_reinforcing_the_supply_network_desc: "我們已經意識到，我們為改善補給情況所做的努力，即提高軍隊對補給不足的適應能力是不夠的。要徹底解決這個問題，我們需要實際改善補給網絡本身。"
 AUS_supporting_the_troops: "支援部隊"
 AUS_supporting_the_troops_desc: "為了進一步提升我們部隊在戰場上的表現，我們必須儘可能地為他們提供支援。配備野戰醫院、偵察和支援炮兵的支援公司將極大地有益於我們。"
 AUS_bring_generals_out_of_retirement: "召回退役將軍服役"
 AUS_bring_generals_out_of_retirement_desc: "我們的國家有著豐富的戰爭歷史，雖然這有其不利之處，但這也意味著我們有大量有才華的指揮官可供我們使用。其中一些已經退役，但通過勸說，我們應該能夠讓他們重返崗位。"
 AUS_follow_the_jansa_plan: "執行阿爾弗雷德·揚薩計劃"
 AUS_follow_the_jansa_plan_desc: "經驗豐富的陸軍元帥阿爾弗雷德·揚薩長期以來一直在制定一套保衛[AUS.GetNameDef]免受[GER.GetAdjective]攻擊的計劃。鑑於目前世界形勢，看來我們可能不幸地需要這個計劃。"
 AUS_follow_the_jansa_plan_tt: "§R將會永久移除可用陸軍部長弗朗茨·伯梅！§!"
 AUS_follow_the_jansa_plan_tt2: "可用為§Y陸軍部長§!："
 AUS_fortify_the_traun_line: "加固特勞恩防線"
 AUS_fortify_the_traun_line_available_tt: "至少有一個與§Y[GER.GetNameWithFlag]§!接壤的§Y[152.GetName]§!或§Y[4.GetName]§!省份有建造§Y3§!個或更多§Y陸上要塞§!的空間"
 AUS_fortify_the_traun_line_bypass_tt: "沒有與§Y[GER.GetNameWithFlag]§!接壤的§Y[152.GetName]§!或§Y[4.GetName]§!省份有建造§Y3§!個或更多§Y陸上要塞§!的空間"
 AUS_fortify_the_traun_line_desc: "揚薩計劃的第一步是沿著特勞恩河修建防禦工事，但目前的決定是將防禦工事推進到[GER.GetAdjective]邊界。我們應該在這個項目變得無用之前啟動它。"
 AUS_fortify_the_traun_line_tt: "沿著從林茨到薩爾茨堡的[GER.GetAdjective]邊界，在有建築空餘的省份修建3級§Y陸上要塞§!"
 AUS_extend_the_traun_line: "延長特勞恩防線"
 AUS_extend_the_traun_line_desc: "雖然當前的防禦工事已經確保了西北邊界的安全，但因斯布魯克附近的一處山口仍未受到保護。通過延長防線，我們可以確保沒有敵人從我們的防禦背後潛入。"
 AUS_extend_the_traun_line_available_tt: "至少有一個與§Y[GER.GetNameWithFlag]§!接壤的§Y[153.GetName]§!省份有建造§Y3§!個或更多§Y陸上要塞§!的空間"
 AUS_extend_the_traun_line_bypass_tt: "沒有與§Y[GER.GetNameWithFlag]§!接壤的§Y[153.GetName]§!省份有建造§Y3§!個或更多§Y陸上要塞§!的空間"
 AUS_extend_the_traun_line_tt: "沿著薩爾茨堡到因斯布魯克的[GER.GetAdjective]邊界，在有建築空餘的省份修建3級§Y陸上要塞§!"
 AUS_the_homeland_front: "國土陣線"
 AUS_the_homeland_front_desc: "如果我們遭受大規模入侵，每位奧地利人都需要為國土盡責。我們應該針對這一場景專門訓練我們的士兵，為國土戰鬥，以確保一旦發生，我們已做好準備。"
 AUS_establish_bohme_plan: "建立弗朗茨·伯梅計劃"
 AUS_establish_bohme_plan_desc: "我們的陸軍元帥弗朗茨·伯梅，一直在研究一項進攻性作戰計劃，用於我們希望跨過邊境發動進攻時。以我們目前的雄心，這個計劃也許能用得上。"
 AUS_establish_bohme_plan_tt: "§R將會永久移除可用陸軍部長阿爾弗雷德·揚薩！§!"
 AUS_intensify_training_efforts: "加強訓練工作"
 AUS_intensify_training_efforts_desc: "雖然我們的訓練工作已經取得了成效，但我們認為還有提升的空間。通過提高基礎訓練的效率，我們可以進一步縮短訓練士兵所需的時間。"
 AUS_heeding_the_call_of_duty: "響應使命召喚"
 AUS_heeding_the_call_of_duty_desc: "奧地利人民必須面對我們國家的現狀。雖然沒人希望需要戰爭，但誰也無法保證戰爭不會發生。通過確保我們的國家信任我們的判斷，並願意在需要時奮戰，我們將大幅提升我們的戰備狀態。"
 AUS_strengthen_the_arms_industry: "利奧波德·加塞爾武器工廠"
 AUS_strengthen_the_arms_industry_desc: "我們的一些老製造商仍在生產民用商品，儘管我們現在對武器的需求非常明顯。通過經濟激勵，我們應能讓利奧波德·加塞爾武器工廠重返軍工業務，並生產一些急需的槍支。"
 AUS_improved_warfare_strategies: "改進的作戰策略"
 AUS_improved_warfare_strategies_desc: "在《聖日耳曼昂萊條約》的多年影響下，我們的戰爭策略和作戰守則已經非常過時。雖然我們到目前為止還算撐過來了，但如果我們不加以改進，我們就是在給自己設下失敗的陷阱。"
 AUS_improved_warfare_strategies_bonus: "改進的作戰策略"
 AUS_hirtenberger_artillery: "投資希爾滕貝格火炮廠"
 AUS_hirtenberger_artillery_desc: "長時間以來，希爾滕貝格是我們需要火炮和彈藥時的首選品牌。現在他們和我們的其他軍事工業一樣，在《聖日耳曼昂萊條約》下資金匱乏。我們應該進行投資，幫助他們重回正軌。"
 AUS_hirtenberger_artillery_tt: "解鎖設計商§Y希爾滕貝格防務系統§!"
 AUS_saurerwerke: "奧地利紹勒爾工廠"
 AUS_saurerwerke_desc: "長時間以來，奧地利紹勒爾工廠一直在生產各種用途的卡車。但在如今這樣的時期，我們需要他們專注於他們最擅長的領域，那就是為軍隊製造卡車。"
 AUS_graf_und_stift_focus: "格拉夫-施蒂夫特"
 AUS_graf_und_stift_focus_desc: "雖然格拉夫與施蒂夫特從未為軍隊製造過卡車，但他們在製造快速汽車和卡車方面享有很高的聲譽。雖然這是一種非常規的方法，但它肯定會在現場證明是有用的。"
 AUS_invite_foreign_tank_designers: "邀請外國坦克設計商"
 AUS_invite_foreign_tank_designers_desc: "[AUS.GetNameDefCap]目前缺乏可靠的坦克設計商。到目前為止，我們使用了各種各樣的坦克，但現在是時候開始自己生產坦克了。邀請安薩爾多來這裡經營是很好的第一步。"
 AUS_invite_foreign_tank_designers_tt: "解鎖設計商§Y安薩爾多§!"
 AUS_basic_tanks: "坦克研發努力"
 AUS_basic_tanks_desc: "我們的大多數坦克都略顯過時，需要進行一些改進。現在我們有了製造坦克的能力，我們可能會從研究如何最好地改進我們的坦克中獲益。"
 AUS_panzer_effort_bonus: "坦克研發努力"
 AUS_advanced_tanks: "先進坦克研發努力"
 AUS_advanced_tanks_desc: "看看我們的坦克，我們意識到它們要麼裝甲厚重而緩慢，要麼輕巧敏捷但不夠堅固。通過結合這兩種設計理念的優點，我們應該能夠生產出堅固而靈活、裝甲厚重且速度快的坦克。"
 AUS_reestablish_austrian_navy: "重建海軍"
 AUS_reestablish_austrian_navy_desc: "那次世界大戰結束後，我們失去了海岸線，意味著我們不再有建造新船的可能。我們不情願地將我們剩餘的艦隊交給了分裂出去的[YUG.GetNameDef]，而他們在不到兩週的時間內就將其交出。現在我們再次有機會發展海軍，我們必須確保這種錯誤不再重演。"
 AUS_build_dockyards_if_coastal: "將立即在奧地利控制的隨機沿海地區建造§Y海軍造船廠§!，只有在奧地利控制了至少一個沿海地區時才能使用。"
 AUS_rebuild_the_armada: "重建艦隊"
 AUS_rebuild_the_armada_desc: "我們有生產強大戰艦並統治海洋的歷史。那些日子似乎很遙遠，但相關知識並未丟失。現在是時候重新奪回海洋，建立一支規模龐大的艦隊，配備大型戰艦以威懾所有潛在的攻擊者。"
 AUS_revive_stt: "重振第裡雅斯特技術工廠"
 AUS_revive_stt_desc: "第裡雅斯特技術工廠曾是我們大型船隻的首選船廠。他們生產的船隻質量卓越，在過去曾很好地為我們效勞。現在我們再次控制了若干船塢，我們應該讓它重新投入運營。"
 AUS_rebuild_the_armada_bonus: "重建艦隊"
 AUS_streamline_production: "精簡船舶生產"
 AUS_streamline_production_desc: "大型船隻有很多優點，比如作為攻擊的威懾力量，能夠對我們的對手造成嚴重的傷害。然而，它們也有一個主要的缺點，即時間和材料的成本都很高。我們的造船工人有辦法加快生產速度。"
 AUS_continue_old_production: "繼續使用舊的生產線"
 AUS_continue_old_production_desc: "在我們失去對海岸線的控制之前，我們已經開始生產兩艘光榮的戰列艦。儘管它們的船體現在略顯過時，但他們仍然可以證明是我們新的海軍努力的寶貴資產。"
 AUS_continue_old_production_tt: "如果建造§Y戰列艦§!的科技尚未解鎖，解鎖該科技。"
 AUS_reclaim_dockyards: "收復舊船廠"
 AUS_reclaim_dockyards_desc: "隨著海戰性質的變化，我們的海軍需求也在變化。早已不是隻帶幾艘強大的船參戰的日子了。現代海戰要求我們擁有更大的能力，不僅要建造新船隻，還要修復我們自己的船隻。我們應該擴張船廠的數量。"
 AUS_promote_admirals: "提拔海軍將官"
 AUS_promote_admirals_desc: "由於長時間沒有海軍，我們自然不再擁有曾經的海軍將官數量。雖然可能的候選人並不多，但我們仍有幾位至少具備一些經驗的人有能力帶領我們的艦隊走向勝利。"
 AUS_promote_admirals_tt: "解鎖可用海軍將領§Y約翰內斯·列支敦士登§!（能力3）和§Y卡爾·海因茨·比恩巴赫爾§!（能力2）"
 AUS_promote_admirals_fasc_com_tt: "解鎖海軍將領§Y卡爾·海因茨·比恩巴赫爾§!（能力2）"
 AUS_defending_the_coast: "保衛海岸線"
 AUS_defending_the_coast_desc: "儘管重建我們昔日的輝煌海軍很有吸引力，但我們必須面對現實。大規模生產主力艦在不久的將來並非我們的計劃。事實上，除非我們立即啟用這弱小的海岸陣地，否則我們更有可能失去它，而不是再次贏得海戰。大型艦船的建造週期太久，現在我們需要的是一支能夠保護我們海岸的艦隊。"
 AUS_defending_the_coast_bonus: "保衛海岸線"
 AUS_elin: "依林"
 AUS_elin_desc: "靈感有時來自最奇怪的地方。主要製造電子產品的依林公司，最近已開始嘗試製造實驗性潛艇。這些潛艇出奇的優秀。我們應該考慮與他們接洽，讓他們未來建造我們的潛艇。"
 AUS_light_ship_bonus: "防禦性艦隊群"
 AUS_light_ship_bonus_desc: "我們的船廠工人很快就想出了加快小型船隻和潛艇生產的方法。通過標準化這些方法，我們應該能夠建造一支龐大的艦隊來保護我們的海岸線。"
 AUS_coastal_defence_forts: "駐守海岸"
 AUS_coastal_defence_forts_desc: "我們在海上的活動只是決定我們成功幾率的一部分。另一部分是我們的海岸線，以及其防禦工事的完備性。幾個佈置得當的海岸堡壘能夠挫敗最周密的入侵計劃。"
 AUS_naval_efficiency: "[ROOT.GetAdjective]海軍效率"
 AUS_naval_efficiency_desc: "通過辛勤工作和奉獻，我們已經重建了一個相當規模的海軍力量。我們的成功激勵了我們的水手和船塢工人，我們應該利用這一優勢，向卓越邁進！"
 ### BELGIAN FOCUS TREE ###
 BEL_perpetual_neutrality: "永久中立"
 BEL_perpetual_neutrality_desc: "在世界大戰時，由於我們成為了主要戰場，我國被夷為廢墟。這種情況決不能再次發生。因此，我們將宣佈，[BEL.GetNameDef]會成為一個獨立且永久中立的國家，對所有其他國家保持同樣的中立。"
 BEL_independent_neutral_and_loyal: "獨立、中立和忠誠"
 BEL_independent_neutral_and_loyal_desc: "在上一場戰爭中，我們過分依賴盟友，結果使得國土淪為戰場。為了避免[BEL.GetNameDef]再次陷入戰火，我國統治者已經正式宣佈我們將奉行“獨立、中立、忠誠”的方針。\n\n這一宣言將促使各個政治派別團結一致，共同加強國防建設，從而發展我們自己的軍事威懾力量。"
 BEL_defensive_neutrality: "防禦性中立"
 BEL_defensive_neutrality_desc: "現在我們已經表明了我們的中立立場，是時候開始努力執行了。我們將使自己變得難以征服，從而杜絕入侵。"
 BEL_national_redoubt_at_antwerp: "安特衛普的國家壁壘"
 BEL_national_redoubt_at_antwerp_available_tt: "必須至少滿足以下條件之一：\n布魯塞爾可以建造1座§Y$bunker$§!\n安特衛普可以建造2座§Y$bunker$§!"
 BEL_national_redoubt_at_antwerp_bypass_tt: "所有以下條件必須為真：\n 布魯塞爾市不能建造1座§Y$bunker$§!\n 安特衛普市不能建造2座§Y$bunker$§!"
 BEL_national_redoubt_at_antwerp_desc: "安特衛普在歷史上一直是我們的防禦基石。我們將升級那裡的防禦工事，並將其作為加強全國其他地區的支點。"
 BEL_belgian_gates: "比利時之門"
 BEL_belgian_gates_desc: "被稱為寬特構件的這些大型鐵製構造專門設計用來阻止坦克通過。"
 BEL_fortify_liege: "鞏固列日"
 BEL_fortify_liege_available_tt: "至少有一個位於馬斯河邊的§Y[34.GetName]§!省份可以建造1座§Y$bunker$§!"
 BEL_fortify_liege_bypass_tt: "沒有位於馬斯河邊的§Y[34.GetName]§!省份可以建造1座§Y$bunker$§!"
 BEL_fortify_liege_tt: "在有空間的省份內沿馬斯河的§Y[34.GetName]§!建設1級§Y$bunker$§!"
 BEL_fortify_liege_desc: "在世界大戰期間，列日的防禦陣地在阻擋德軍方面發揮了重要作用，使得成功的防禦成為可能。儘管如此，這種工事的設計暴露了嚴重的缺陷。我們已經從教訓中學到了，現在是時候再次升級這些防禦工事了。"
 BEL_iron_wall: "鐵壁"
 BEL_iron_wall_desc: "我們的比利時之門在測試中已被證明是敵方機動的重大障礙，因此我們應該在全國範圍內大規模部署它們，以阻止那些企圖入侵的敵人。"
 BEL_eben_emael_fortress: "埃本·埃馬爾堡壘"
 BEL_eben_emael_fortress_available_tt: "可以在§Y列日§!建造至少2座§Y$bunker$§!"
 BEL_eben_emael_fortress_bypass_tt: "不能在§Y列日§!建造至少2座§Y$bunker$§!"
 BEL_eben_emael_fortress_desc: "我們防線上最大、最宏偉的堡壘，位於阿爾伯特運河上方的一個高地上，埃本·埃馬爾堡壘將為任何周邊部隊提供防禦陣地和炮兵支援，並證明是任何侵犯我們邊境者的堅不可摧的障礙。"
 BEL_our_southern_neighbour: "我們的南方鄰居"
 BEL_our_southern_neighbour_desc: "多虧了我們在上一場戰爭中的經驗，我們的大部分防禦都是針對我們的東部鄰國，然而，他們不是邊界上唯一的大國。我們應該確保我們的南部同樣也有足夠的防禦。"
 BEL_koningshooikt_wavre_line: "康尼斯胡特-瓦夫爾防線"
 BEL_koningshooikt_wavre_line_desc: "康尼斯胡特-瓦夫爾防線（簡稱KW線）是連接康尼斯胡特和瓦夫爾之間的第二防線。這些防禦工事專為我們和盟軍部隊佔領準備，而非常駐部隊，包括戰壕、掩體和比利時之門。這是一條非常堅固的防線，應該是我們的主要抵抗點。"
 BEL_mobilize_the_nation: "全國動員"
 BEL_mobilize_the_nation_desc: "我們不僅應該準備防禦工事，人口本身也可以成為我們最大的資產。在上次戰爭中，他們英勇地對抗入侵者，讓我們利用這種相同的熱情，動員我們的人民保衛祖國。"
 BEL_flooded_tank_barriers: "淹沒式反坦克屏障"
 BEL_flooded_tank_barriers_desc: "我們認為坦克將在未來的戰爭中發揮至關重要的作用，我們的防禦措施應該反映這一點。我們可以準備比利時之門，並將它們沉入水中，使它們的效力加倍。"
 BEL_protect_against_france: "防範法國"
 BEL_protect_against_france_desc: "之前對南方的準備是為了防止被包圍，但現實是法國人可能會全面入侵——我們應該相應地準備堡壘和防禦工事！"
 BEL_protect_against_france_available_tt: "可以在§Y沙勒羅瓦§!、§Y科特賴克§!或§Y科特賴克西北的沿海省份§!建造§Y1座陸上要塞§!"
 BEL_dam_the_consequences: "堰塞之力"
 BEL_dam_the_consequences_desc: "大型的吉勒普大壩為我們東部地區提供水和電力，它還提供了一個絕佳的機會，在潛在的敵人突破時，我們可以淹沒這片土地。"
 BEL_defensive_reorganization: "國防重組"
 BEL_defensive_reorganization_desc: "我們已經竭盡全力準備好面對入侵，現在唯一要做的就是根據最新的防禦思想，確定更具戰略性的高級理論變革。"
 BEL_defense_bill: "國防法案"
 BEL_defense_bill_desc: "我們的永久中立宣言在國際舞臺上並未受到好評，然而，現實是這樣做是為了集中政治支持，實施重大的軍備重整計劃。"
 BEL_royal_military_academy: "皇家軍事學院"
 BEL_royal_military_academy_desc: "皇家軍事學院是[ROOT.GetNameDef]唯一的軍事教育機構，但隨著全球局勢變得越來越不確定，我們必須確保以最佳的軍事理論培養未來的軍官，這將需要擴張學院。"
 BEL_multi_language_courses: "多語言課程"
 BEL_multi_language_courses_desc: "我們軍隊面臨的一個主要問題是人口的雙語性質。讓我們將其轉化為優勢！我們可以教導我們的軍官法語和荷蘭語，充分利用雙語軍官團的優勢。"
 BEL_department_of_telecommunications: "電信部"
 BEL_department_of_telecommunications_desc: "通信對軍隊來說至關重要，所以我們必須引導教育使用新技術，如無線電，以及舊的，經過驗證的技術，如信鴿。"
 BEL_department_of_ballistic_metrology: "彈道計量部"
 BEL_department_of_ballistic_metrology_desc: "彈道計量部重點研究測量和彈道學，使其能夠精確計算軌跡。"
 BEL_resist_and_bite: "抵抗與反擊"
 BEL_resist_and_bite_desc: "阿登獵兵是[ROOT.GetAdjective]精銳部隊之一，主要由適應了當地密林環境的盧森堡省居民組成。他們的座右銘是“抵抗與反擊！”"
 BEL_center_for_advanced_military_studies: "先進軍事研究中心"
 BEL_center_for_advanced_military_studies_desc: "隨著軍隊規模的擴大，指揮的要求變得更為嚴格。我們必須保持領先地位，用最新的戰略原則訓練我們的高級指揮官，培養他們在後勤、指揮和控制、聯合武器整合等領域的能力，也可以考慮與盟友軍方的合作。"
 BEL_anti_tank_guns: "優秀反坦克炮"
 BEL_anti_tank_guns_desc: "[ROOT.GetAdjective]高超的冶金使我們的機械師能造出最好的槍炮，我們應該利用我們的能力製造出一些真正的高速猛獸！我們甚至可以更進一步，將這些火炮也加入我們擁有的任何坦克中。"
 BEL_junior_officer_training: "初級軍官培訓"
 BEL_junior_officer_training_desc: "一位像樣的軍官能激勵他的士兵在逆境中奮戰，但可能對無望的情況視而不見。一位優秀的領導者會正確認識到困境，但會盡可能利用它。一位偉大的領導者將有計劃地從困境中脫身，並從更有利的位置再次出擊。我們將甄別並培訓我們的軍官，使他們儘可能地優秀。"
 BEL_belgian_special_forces: "[ROOT.GetAdjective]特種部隊"
 BEL_belgian_special_forces_desc: "[ROOT.GetAdjective]士兵一直以來都是堅韌和敬業的，但我們不禁要思考，如果由像埃迪·布朗迪爾這樣能幹的人領導，這些部隊得有多麼出色。"
 BEL_senior_officer_training: "高級軍官培訓"
 BEL_senior_officer_training_desc: "可以說軍官具備以下四種特質中的兩種：懶惰、愚蠢、勤奮和聰明。參謀軍官應該是勤奮和聰明的，高級軍官是懶惰和聰明的。即使是愚蠢和懶惰的人也有他們的用處。最重要的是要甄別出愚蠢而勤奮的人，因為他們會做出導致災難的決定，還有意志和精力去實現它。"
 BEL_fonderie_royale_de_canons_liege: "列日皇家大炮廠"
 BEL_fonderie_royale_de_canons_liege_desc: "拿破崙·波拿巴於1803年在列日建立了皇家大炮廠，當時列日是法國的一部分。這家皇家大炮廠是比利時重型武器的主要開發商，得益於該地區金屬工藝的高質量，大口徑武器頗有聲名，這些設施非常適合進一步投資以擴大我們的生產能力。"
 BEL_interpreters: "口譯員"
 BEL_interpreters_desc: "為了指揮佛蘭德和瓦隆士兵，軍官團需要掌握兩種語言，這曾是我國武裝力量不得不克服的一個重大障礙。如今這卻使我們可以在鄰近區域順利行動，不受語言隔閡的影響，成為我們的一大優勢。"
 BEL_interpreters_tt: "這個§Y民族精神§!將添加到現有和未來的成員國中。"
 BEL_center_of_nuclear_chemistry: "核化學中心"
 BEL_center_of_nuclear_chemistry_desc: "我們一直在仔細研究奧本海默、海森堡和玻爾的理論，並決定親自應用這門科學。畢竟，我們是少數幾個能輕易從剛果獲得鈾的國家之一。"
 BEL_strategic_doctrine_development: "戰略理論發展"
 BEL_strategic_doctrine_development_desc: "僅僅考慮一場接一場的戰鬥是不夠的，我們必須牢牢掌握戰略層面，並根據特定的理論運籌帷幄，確保所有力量都朝著同一個目標推進，那就是勝利。"
 BEL_belgian_tank_development: "[ROOT.GetAdjective]坦克研發"
 BEL_belgian_tank_development_desc: "儘管我們擁有強大的汽車工業，但我們從未特別關注裝甲戰的發展。考慮到最新的軍事進展，顯然是時候我們投資自己的坦克開發計劃了。"
 BEL_doctrinal_innovations: "理論創新"
 BEL_doctrinal_innovations_desc: "理論可以幫助指導軍隊並確保每個人都在按同一節奏前進，然而，有時要真正取得領先，你需要跳出固定思維。我們要超越這一點，打破常規，走自己的路。我們的敵人永遠不會看到它的到來。"
 BEL_modernized_army: "現代化軍隊"
 BEL_modernized_army_desc: "戰爭中勝者和敗者的區別往往在於誰從經歷中學到了最好的教訓。現在是時候我們反思自己的得與失，然後改革軍隊，使其達到新的現代標準。"
 BEL_increased_length_of_service: "增加服役期"
 BEL_increased_length_of_service_desc: "隨著全球緊張局勢的升溫，以及我們位於軍事大國之間的戰略位置，我們必須顯示出我們保衛自身並確保領土主權的意願。因此，我們將提高預備役的警戒狀態，並延長現役人員的服役期。"
 BEL_fn_herstal: "埃斯塔勒國營工廠"
 BEL_fn_herstal_desc: "[ROOT.GetNameDefCap]擁有享譽世界的武器工業，其中最著名的是埃斯塔勒國家工廠。這家武器製造商生產的武器質量卓越，由業界頂尖人士設計。與勃朗寧武器公司的緊密合作進一步加強了我們公司的全球影響力。"
 BEL_legacy_of_the_great_war: "大戰的遺產"
 BEL_legacy_of_the_great_war_desc: "自“大戰”以來，我們已經走過了很長的路，儘管我們的傷口尚未完全癒合，但我們自豪地展示著我們的傷疤。我們曾經抵抗過入侵者，我們可以，不，我們將再次抵抗他們。"
 BEL_poudreries_reunies_de_belgique: "比利時聯合火藥廠"
 BEL_poudreries_reunies_de_belgique_desc: "比利時第二古老的武器公司，比利時聯合火藥廠專門生產彈藥，所以優化他們在我們後勤網絡中的地位將為我們提供真正的爆炸性成果。"
 BEL_minerva_imperia: "密涅瓦-因佩里亞"
 BEL_minerva_imperia_desc: "比利時不僅在世界大戰期間是裝甲車的積極使用者，而且在整個戰間期，我們的汽車工業也享有盛譽。我們最大的兩家制造商密涅瓦和因佩里亞最近合併了，如果我們不利用他們的優勢為我們的統一利益服務，那就真的太丟臉了。"
 BEL_repudiate_treaty_with_france: "否定對法條約"
 BEL_repudiate_treaty_with_france_desc: "[FRA.GetNameDefCap]拒絕將馬其諾防線延伸到我們的邊境，這實際上給敵人留了一扇洞開的大門，他們將被迫從這裡發起進攻。通過否認與他們的條約，我們可以擺脫任何協助他們的軍事義務，但如果我們受到攻擊，他們仍將依約進行干預，否則他們未設防的領土將面臨入侵的風險。"
 BEL_german_non_aggression: "德國互不侵犯"
 BEL_german_non_aggression_desc: "[GER.GetName]對我們宣佈的中立表示讚賞，並公開表示有興趣簽訂互不侵犯條約以加強這一立場，並確保他們邊界的安全。"
 BEL_dyle_plan: "迪勒計劃"
 BEL_dyle_plan_desc: "儘管我們公開宣佈中立和軍事不干涉主義，但我們在幕後繼續與我們的戰略伙伴合作，制定計劃和應急措施，以防入侵。總體思路是我們在代爾河後面儘可能堅持，直到遠征軍抵達增援我們的防線。"
 BEL_dyle_plan_tt: "如果戰爭爆發，§Y[ENG.GetNameWithFlag]§!和§Y[FRA.GetNameWithFlag]§!將更有可能援助我們！"
 BEL_british_guarantee: "英國保障"
 BEL_british_guarantee_desc: "我們與[ENG.GetNameDef]的良好關係從未是秘密，讓我們將這種關係正式化，並擴大相互軍事保證。"
 BEL_government_resigns: "政府辭職"
 BEL_government_resigns_desc: "由於法西斯主義的雷克斯黨提出了大量腐敗指控，政府面臨的壓力不斷增加，導致政府倒臺，並開始準備新的選舉。"
 BEL_auto_complete_government_resigns_tt: "這個國策將由§Y政府辭職§!事件的結果自動完成。"
 BEL_government_of_national_unity: "民族團結政府"
 BEL_government_of_national_unity_desc: "儘管針對法西斯運動的反對日益增長，民主主義的自由派、社會主義者和天主教黨派在保羅·範澤蘭的領導下再次團結起來，組建了新的民族團結政府。"
 BEL_investigate_bribery_charges: "調查賄賂指控"
 BEL_investigate_bribery_charges_desc: "政府的腐敗指控從未消失，對調查的呼聲日益高漲。法西斯雷克斯黨領袖萊昂·德格雷勒甚至直接指控保羅·範澤蘭自己也收受賄賂。"
 BEL_royal_intervention: "王室干預"
 BEL_royal_intervention_desc: "政府再次倒臺，現在是國王介入並採取行動的時候了。有兩位候選人角逐首相，保羅·埃米爾·讓松是穩健的選擇；另一位是萊昂·德格雷勒，他曾經帶領人們抗議前政權的腐敗。"
 BEL_auto_complete_royal_intervention_tt: "這個國策將根據§Y王室欽點§!事件的結果自動完成。"
 BEL_paul_emile_janson: "保羅·埃米爾·讓松"
 BEL_paul_emile_janson_desc: "作為自由派的首相候選人，保羅·埃米爾·讓松被國王選中，他被公認為是在這些日益不穩定的日子裡引導政府迴歸穩定的可靠人選。"
 BEL_plan_de_man: "德曼計劃"
 BEL_plan_de_man_desc: "儘管付出了巨大的政治代價，但首相一直在努力繼續亨利·德曼的改革，並實施進一步的失業應對措施。此舉旨在將1932年高達23.5%的失業率進一步降低到15%。"
 BEL_economic_recovery: "經濟復甦"
 BEL_economic_recovery_desc: "儘管面臨眾多障礙，我們政府的工作導致了經濟的增長和迅速復甦，但即便如此，仍有人抱怨這還不夠。"
 BEL_adriaan_martens_crisis: "阿德里安·馬滕斯危機"
 BEL_adriaan_martens_crisis_desc: "阿德里安·馬滕斯被任命為皇家醫學院院長，這似乎是一個簡單的任命，現已演變成一場全面的政治危機。因為事實表明，馬滕斯是上一場戰爭中的通敵者，且公開持有法西斯觀點。這很可能導致斯巴克政府的垮臺。"
 BEL_benelux_union: "比荷盧聯盟"
 BEL_benelux_union_desc: "首相斯巴克提出了一項提案，旨在將[BEL.GetNameDef]、[HOL.GetNameDef]和[LUX.GetNameDef]三國統一為單一關稅同盟，最終目標可能是全面統一為超級聯邦國。這甚至可能成為未來歐洲聯盟的藍圖。"
 BEL_benelux_union_tt: "如果§Y[HOL.GetNameWithFlag]§!和§Y[LUX.GetNameWithFlag]§!是民主主義或中立主義意識形態，將被邀請加入§Y$BEL_benelux_union_faction$§!"
 BEL_tripartite_government: "三方政府"
 BEL_tripartite_government_desc: "與之前的民族團結政府一樣，首相皮埃洛成功地將幾個民主主義黨派團結在一起，以顯示比利時的團結。有了這個政治統一戰線，他終於有能力推動更激進的立法。"
 BEL_the_council_of_europe: "歐洲議會"
 BEL_the_council_of_europe_desc: "越來越明顯的是，中立無法保護我們免受好戰鄰國的軍事擴張。因此，確保歐洲和平的唯一方式是團結。我們應該將外交官和國家元首聚集在一個桌子旁，從而創立歐洲理事會。"
 BEL_the_council_of_europe_tt: "解鎖決議§Y邀請其他國家加入$BEL_european_union$§!。"
 BEL_broken_neutrality: "打破中立"
 BEL_broken_neutrality_desc: "我們的中立宣言讓我們的國家得以發展壯大。現在，我們可以擺脫這些束縛，引領[BEL.GetNameDef]進入一個新時代。"
 BEL_degrelle: "德格雷勒"
 BEL_degrelle_desc: "[BEL.GetName]的雷克斯黨領袖、最重要的法西斯分子之一的萊昂·德格雷勒，一段時間以來，他一直在鼓動反對現任領導層，併成功地向公眾揭露了他們的腐敗。在範澤蘭政府倒臺後，國王介入並任命德格雷勒為新總理。"
 BEL_support_the_rexists: "支持雷克斯黨"
 BEL_support_the_rexists_desc: "現在，德格雷勒已經成為首相，是時候讓支持他登上這一職位的黨派得到服務的回報，將高級成員提拔入內閣了。"
 BEL_dissolve_political_parties: "解散政黨"
 BEL_dissolve_political_parties_desc: "民主制度的弊端已經昭然若揭，它不過是滋生腐敗與貪婪的溫床。人民需要的不是選擇的權利，而是堅強有力的領導，而唯有[ROOT.GetRulingPartyLong]才有這樣的能力。"
 BEL_the_flemish_question: "佛蘭德問題"
 BEL_the_flemish_question_desc: "[BEL.GetName]內部的持續分裂繼續導致我們人民之間產生裂痕。我們應該一勞永逸地解決這個問題，並自己決定什麼是正確的語言標準。人民將按照指示行事，畢竟我們都是[BEL.GetAdjective]人，這勝過任何單一的如同狡辯一般的語言。"
 BEL_christian_corporatism: "基督教社團主義"
 BEL_christian_corporatism_desc: "我們一直饒有興趣地研究著意大利的社團主義，即國家領導的工人集體組織全都努力實現相同經濟目標的概念。我們打算遵循這一模式，但要運用基督教的倫理和理想，創造出更獨特的比利時特色社團主義。"
 BEL_legacy_of_the_soldier_king: "士兵王的遺產"
 BEL_legacy_of_the_soldier_king_desc: "士兵王阿爾貝，戰爭英雄，比利時的救主。我們可以從這位偉人身上學到許多，他是我們所有武裝部隊，不，我們國家所有人都要學習的榜樣。我們將抵抗並與任何入侵者戰鬥到底。"
 BEL_the_lost_tribe: "失落的部落"
 BEL_the_lost_tribe_desc: "與被征服和奴役的高盧人混為一談，曾是[BEL.GetName]不得不忍受的一個汙點。我們是失落的日耳曼部落。我們是抵抗者。我們是戰鬥者。我們是征服者。"
 BEL_invite_german_tank_organization: "邀請[GER.GetAdjective]坦克研發人員"
 BEL_invite_german_tank_organization_desc: "由於我們之前的大部分裝甲戰車的合作伙伴已經與我們斷絕關係，我們需要尋找新的合作伙伴，將坦克帶給人民。"
 BEL_the_walloon_legion: "瓦隆軍團"
 BEL_the_walloon_legion_desc: "我們正確地確立和澄清了我們真正的祖先，現在是時候抓住這光榮的傳統，向世界展示我們真正能做些什麼了。"
 BEL_the_new_ruhr: "新魯爾"
 BEL_the_new_ruhr_desc: "德國的魯爾區以其工業原料產出而聞名，甚至成為了其他大國羨慕的對象。比利時也有資格稱自己擁有強大的工業實力，我們的潛力可以遠遠超過我們的鄰國。我們有機遇，我們有資源，我們有動力，還有最重要的，我們有人民。"
 BEL_traditional_family_values: "傳統家庭價值觀"
 BEL_traditional_family_values_desc: "天主教會一直在正確的家庭道德上引導我們，我們應該繼續遵守這些教義。我們在未來的擴張和繁榮需要穩定和增長，而這些教義是確保穩定和增長的唯一途徑。"
 BEL_the_french_horse_and_the_red_rider: "法國馬和紅騎手"
 BEL_the_french_horse_and_the_red_rider_desc: "長期以來，比利時一直被法國這頭由共產主義騎手駕馭的野獸踩在蹄下。我們必須起來反抗這種潛在的侵略。只有展示我們的信心和力量，這頭野獸才會被嚇退。"
 BEL_nationalize_the_banks: "銀行國有化"
 BEL_nationalize_the_banks_desc: "長期以來，銀行一直由貪婪的，只關心利潤的小人物經營。銀行是服務所有人的機構，所以我們必須控制它們，並恰當地引導其金融工具為集體的利益服務。"
 BEL_abandon_neutrality: "放棄中立"
 BEL_abandon_neutrality_desc: "要求中立的呼聲是弱者的呼聲。在這個世界上，實力才是唯一重要的外交。"
 BEL_international_stipend: "國際津貼"
 BEL_international_stipend_desc: "法西斯國家為了收買我們繼續在他們的事務中保持中立，提供了津貼。如果這是不干涉的價碼，那我們可以接受。畢竟，他們似乎忘記定下結束日期了。"
 BEL_civil_service_purge: "清洗行政部門"
 BEL_civil_service_purge_desc: "腐敗長期得不到處理，已經滲透到政府的各個階層。大病需要猛藥，在這種情況下，猛藥就是徹底清洗我們懷疑有腐敗行為的所有人。"
 BEL_royal_commander_in_chief: "皇家總司令"
 BEL_royal_commander_in_chief_desc: "國王利奧波德三世出身於優秀的軍人家族。阿爾貝一世國王是一位戰爭英雄，他曾在國家最黑暗的時刻與之並肩作戰，並帶領我們取得了輝煌的勝利。利奧波德國王只想證明自己，走出父親的陰影。我們只需給他機會。"
 BEL_the_european_crusade: "歐洲十字軍"
 BEL_the_european_crusade_desc: "有些禿鷲在歐洲的邊界上盤旋，它們的野蠻意識形態正在尋找文明國家的弱點。我們的使命是作為秩序和進步的堡壘，我們的國家已經證明了其無與倫比的決心，理應在這場鬥爭中擔任領導角色。"
 BEL_belgian_renaissance: "比利時復興"
 BEL_belgian_renaissance_desc: "我們曾遭受打擊和重創，但從未被打垮。這一切只有在[ROOT.GetRulingPartyLong]的傑出領導下才得以實現。只有在我們的領導下，比利時的復興才能繼續下去，走向另一個黃金時代。"
 BEL_support_the_vnv: "支持佛蘭德國民聯盟"
 BEL_support_the_vnv_desc: "在最近的選舉中，佛蘭德國民聯盟與雷克斯黨結盟，意圖建立一個社團主義國家。既然德格雷爾已經掌權，是時候回報他的盟友，並開始朝著一個更具擴張性的法西斯國家邁進，他們的目標是與荷蘭統一。"
 BEL_vnv_dominant_tt: "§Y[BEL.GetName]§!將被稱為§Y佛蘭德§!"
 BEL_revitalize_nederlands: "振興荷蘭語"
 BEL_revitalize_nederlands_desc: "我們的語言幾乎消失了！甚至法院的判決也是用法語宣告的，只剩下各地的方言還有人說。復興偉大的佛蘭德的第一步是確保我們的政府和人民使用正確的語言——荷蘭語！"
 BEL_flanders_ascendant: "佛蘭德斯優勢"
 BEL_flanders_ascendant_desc: "鑑於佛蘭德傳統和歷史的自豪感正在上升，是時候利用這種重新點燃的民族主義情感，帶領我們的國家走向它的命運——與荷蘭統一。"
 BEL_dietsland: "大荷蘭"
 BEL_dietsland_desc: "我們保護歐洲其他荷蘭語國家的努力取得了成功，但似乎並不是我們所有的兄弟都像我們預期的那樣適應了這個新的未來。我們應該提醒他們我們共享的文化和語言。"
 BEL_dietsland_tt: "§Y[BEL.GetName]§!將被稱為§Y大荷蘭§!"
 BEL_demand_calais: "索取加來"
 BEL_demand_calais_desc: "雖然我們統一國家的計劃幾乎完成，但還有佛蘭德地區的一處關鍵部分仍在外國手中：加來。它在一千年前最初是佛蘭德伯國的一部分，因此，現在它應該歸還給我們。"
 treaty_of_calais: "《加來條約》已簽署"
 BEL_demand_calais_tt: "我們的選項包括嘗試§Y購買加來§!，或者§Y以剛果的一部分換取加來§!，甚至可以§Y提出索求§!，並在必要時§Y為之開戰§!。"
 BEL_belgian_east_indies: "比屬東印度"
 BEL_belgian_east_indies_desc: "荷蘭人在國外擁有大量的殖民地，特別是東印度群島。我們自己的帝國野心從未消失，我們的王冠上總是有空間再添幾顆寶石。"
 BEL_burgundy_rising: "勃艮第崛起"
 BEL_burgundy_rising_desc: "佛蘭德的權力和影響力的黃金時代是我們控制勃艮第公國的時候。如果我們想恢復我們的全球聲望，就必須堅持祖先的軍事和金融傳統。實現這一目標的第一步當然是收復這些領土。"
 BEL_burgundy_tt: "§Y[BEL.GetName]§!將改名為§Y勃艮第§!"
 BEL_join_axis: "加入軸心國"
 BEL_join_axis_desc: "我們保持孤立已經太久了，是時候與我們的日耳曼兄弟聯合起來，確保我們的同盟，以保護和擴張我們的共同雄心了。"
 BEL_strength_and_brotherhood: "力量與紐帶"
 BEL_strength_and_brotherhood_desc: "我們將尋求那些在力量與紐帶上與我們看法一致的人，同時他們也會像獅子一樣塑造自己的自豪感。通過這種方式，我們可以傳承使我們強大的力量，像獵物一樣撕裂那些心智和精神脆弱的敵人。"
 BEL_demand_further_gallic_concessions: "要求高盧的進一步讓步"
 BEL_demand_further_gallic_concessions_desc: "是時候揭開秘謀的面紗，讓我們的真正意圖展現出來。我們之間的裂痕從來都不是秘密，但我們必須一勞永逸地展現我們的優越性。不論前途有多艱難，是時候抓住我們的命運了。"
 BEL_demand_further_gallic_concessions_tt: "在我們控制這些地區後，解鎖決議§Y獲得高盧的核心§!。"
 BEL_belgica: "貝爾吉卡"
 BEL_belgica_desc: "貝爾吉卡是羅馬帝國最北部的領土之一，之所以被稱為貝爾吉卡，是因為居住在該地區的最有影響力的人群。顯然，如果羅馬人能夠認識到比利時人的力量，那麼我們理應以他們為榜樣，走得比羅馬人想像的更遠。"
 BEL_belgica_tt: "§Y[BEL.GetName]§!將改名為§Y貝爾吉卡§!"
 BEL_constitutional_crisis: "憲政危機"
 BEL_constitutional_crisis_desc: "于貝爾·皮埃洛是法西斯主義的直言不諱的批評者，反對國王任命萊昂·德格雷勒為總理的決定。他在議會中贏得了支持，並強行通過了一項緊急法案，宣佈國王暫時無法統治，得以在該項任命得到御批之前宣佈其無效。"
 BEL_kings_abdication: "國王退位"
 BEL_kings_abdication_desc: "在議會與君主關係公開破裂之後，利奧波德國王受到了退位的壓力。希望他能和平地退位。"
 BEL_kings_abdication_tt: "§G隨著利奧波德國王的離去，比利時將更能抵禦入侵。§!"
 BEL_snap_election: "提前選舉"
 BEL_snap_election_desc: "隨著憲政危機暫時得到控制，現在是時候確保政府再次具有合法性，否則它與它剛剛推翻的政權沒有區別。目前，社會主義黨派的保羅-亨利·斯巴克和天主教黨的于貝爾·皮埃洛是最有可能的人選。"
 BEL_auto_complete_snap_election_tt: "這個國策將由§Y突發選舉§!事件的結果自動完成。"
 BEL_liberal_victory: "自由派勝利"
 BEL_liberal_victory_desc: "經濟上自由主義的天主教黨在最近的選舉中名列前茅，于貝爾·皮埃洛將領導[BEL.GetName]，承諾捍衛國家和比利時人民直到最後一刻。"
 BEL_socialist_victory: "社會主義者勝利"
 BEL_socialist_victory_desc: "保羅-亨利·斯巴克帶領工黨在突發選舉中獲勝，並誓言盡其所能維護比利時邊界的完整，無論手段是與共產主義者還是民主主義者結盟。"
 BEL_expression_of_belgian_unity: "比利時團結的表現"
 BEL_expression_of_belgian_unity_desc: "構成[BEL.GetAdjective]身份的多元文化是我們最大的力量，因為正是不同的理念、視角，甚至語言使我們能夠找到真正的理解。那些將我們分裂的事物，最終將我們團結起來。"
 BEL_anti_corruption_taskforce: "反腐工作組"
 BEL_anti_corruption_taskforce_desc: "國家的腐敗現象已經猖獗太久，現在我們已經剷除了高層的腐敗，是時候打擊其餘的腐敗分子了。我們將下令成立一個擁有最高權力的特別調查工作組，揭露並清除那些以納稅人利益為代價而中飽私囊的人。"
 BEL_diplomatic_rapprochment: "外交友好"
 BEL_diplomatic_rapprochment_desc: "我們在那個時代的政治和外交現實中表達中立是必要的，但現在情況已經改變。我們從未停止與其他國家的朋友對話，但現在我們應該更公開和積極地開展這些外交活動。"
 BEL_belgian_maginot: "比利時馬奇諾"
 BEL_belgian_maginot_desc: "比利時是兩大軍事強國之間的緩衝國，歷史上一直受到雙方的威脅。因此，我們已經成為防禦戰的專家。法國的馬奇諾防線延伸到我們的邊界，我們需要將其延長，以保衛我們的國家。如果我們讓自己變得不可征服，我們甚至永遠不會被攻擊。"
 BEL_belgian_maginot_available_tt: "控制並且能夠在§Y[980.GetName]§!、§Y[6.GetName]§!、§Y[34.GetName]§!或§Y[977.GetName]§!位於§Y[ROOT.GetAdjective]§!-§Y[HOL.GetAdjective]§!邊境的省份內建造至少§Y3座陸上要塞§!"
 BEL_belgian_maginot_bypass_tt: "§R沒有§!控制或無法在§Y[980.GetName]§!、§Y[6.GetName]§!、§Y[34.GetName]§!或§Y[977.GetName]§!位於§Y[ROOT.GetAdjective]§!-§Y[HOL.GetAdjective]§!邊境的省份內建造至少§Y3座陸上要塞§!"
 BEL_belgian_maginot_tt: "在§Y[ROOT.GetAdjective]§!與§Y[HOL.GetAdjective]§!邊境修建§Y陸上要塞§!"
 BEL_soviet_guarantee: "蘇聯保障"
 BEL_soviet_guarantee_desc: "儘管我們更傾向於民主主義，但我們已經擁抱了社會主義，我們有很多東西可以提供給[SOV.GetNameDef]。只要我們適當地奉承，並遵守他們開明的外交提議，那麼我們可能會成為俄羅斯熊的朋友。"
 BEL_soviet_guarantee_tt: "如果我們完成了§Y$BEL_raise_the_red_flag$§!，他們將更有可能§G接受§!"
 BEL_expedite_fort_construction: "加快堡壘建設"
 BEL_expedite_fort_construction_desc: "這個世界充滿危險，充滿敵對勢力。我們需要確保自己準備充分，加強防禦工事和工程部門的投資，以便在需要之前做好準備。"
 BEL_democratization_of_education: "教育民主化"
 BEL_democratization_of_education_desc: "我們的社會有互相關懷的傳統，這最好體現在工人和企業之間的社會契約中。同樣，國家也應努力為每個人提供平等的機會，並強調良好教育的重要性。"
 BEL_invite_soviet_tank_makers: "邀請[SOV.GetAdjective]坦克研發人員"
 BEL_invite_soviet_tank_makers_desc: "儘管我們過去一直依賴盟友提供裝甲部隊，但即使我們的朋友發生了變化，這一政策卻未曾改變。由於我們與蘇聯的友好關係，我們或許能夠說服他們為我們提供一些見解。"
 BEL_join_allies: "加入同盟國"
 BEL_join_allies_desc: "在那次大戰中，我們作為盟友站在一起，面對入侵的考驗。我們將再次站在一起，抵禦所有企圖傷害我們的人。"
 BEL_unity_makes_strength: "團結就是力量"
 BEL_unity_makes_strength_desc: "最初，這個口號是荷蘭共和國的座右銘，當時它照拂著荷蘭和比利時。1830年革命後，比利時獨立，這一口號被比利時正式接受。它真正被確立為比利時的理想，是自由進步派和天主教保守派在比利時政治中心的團結的象徵，自此成為比利時的象徵。"
 BEL_join_comintern: "加入共產國際"
 BEL_join_comintern_desc: "共產國際有著支持社會主義道路的歷史，而我們在四面八方都被那些試圖扼殺我們工人解放運動的勢力所包圍，我們必須向東方尋找新的朋友。"
 BEL_better_than_maginot: "強於馬奇諾"
 BEL_better_than_maginot_desc: "我們的防禦工事必須從世界領先變成世界最強。我們永遠不知道下一次攻擊會來自哪裡，所以我們必須做好萬全準備。我們必須興建工事，戰壕接戰壕，掩體連掩體，最重要的是，我們需要更多、更大的槍。"
 BEL_vandervelde_minority: "王德威爾得少數派"
 BEL_vandervelde_minority_desc: "埃米爾·王德威爾得雖在選舉中大獲全勝，其工黨卻僅以微弱優勢勝出。執政聯盟談判破裂後，儘管前路艱險，其黨派仍決意獨自組建政府。"
 BEL_problem_of_language: "語言問題"
 BEL_problem_of_language_desc: "比利時長期以來因語言問題而分裂，如果工黨希望在自己的統治下團結整個國家，他們必須在哪種語言優先的問題上明確自己的立場——或者甚至效仿布魯塞爾的做法，推動官方雙語化。"
 BEL_trade_union_support: "工會支持"
 BEL_trade_union_support_desc: "在政治鬥爭中，工會是我們的天然盟友，但到目前為止，對我們的運動，他們十分冷淡。我們可以提高對他們的承諾，進而他們會動員工會成員支持我們。"
 BEL_cooperative_cooperation: "合作組織"
 BEL_cooperative_cooperation_desc: "合作社在比利時社會中存在已久，它們的商業模式非常符合我們所倡導的經濟理想。我們應該與那些已經建立起來的合作社合作，利用他們的專業知識來培養具有社會責任感的新一代企業。"
 BEL_aid_for_spain: "援助西班牙"
 BEL_aid_for_spain_desc: "西班牙共和派為了民主理想，正在與危險的法西斯和安那其主義激進分子交戰。我們應該悄悄地支持他們的鬥爭，但要小心保持我們中立的外表。"
 BEL_the_grand_place: "大廣場"
 BEL_the_grand_place_desc: "布魯塞爾市中心的大廣場長期以來一直是社會主義思想的溫床。最著名的是，卡爾·馬克思在這裡寫下了《共產黨宣言》，隨後這裡還舉辦了第一國際第三次代表大會，並最終成為第一個社會主義政黨——比利時工人黨的發源地。"
 BEL_la_belgique_et_le_congo: "比利時與剛果"
 BEL_la_belgique_et_le_congo_desc: "比利時在剛果的角色長期以來是剝削和迫害，但它本應是促進平等、創造機遇的。我們已經在國內重視社會主義理想，現在是時候開始在我們的殖民地同胞中傳播這一理念，並開始投資他們的社會主義未來。"
 BEL_spanish_intervention: "西班牙干預"
 BEL_spanish_intervention_desc: "西班牙的共和派局勢岌岌可危，為了民主的勝利，對於那些在為民主而戰的人，那些珍視民主的人顯然必須加大支持力度。"
 BEL_spanish_intervention_tt: "解鎖決議進一步§Y$BEL_intervention_in_spain_cat$§!。\n\n我們將能夠提供裝備、鼓勵移民以幫助他們的事業，並在政治上支持他們。"
 BEL_contradictions_in_socialism: "社會主義內部矛盾"
 BEL_contradictions_in_socialism_desc: "我們最近在剛果推廣社會主義理念的成功顯而易見，那裡的人民比以往任何時候都更加繁榮。因此，我們顯然必須將這種“社會主義使命”推廣到整個非洲！"
 BEL_contradictions_in_socialism_tt: "對當前持有從此國策獲得的領土的國家獲得戰爭目標§Y奪取聲索地區§!。"
 BEL_growing_threat_of_fascism: "法西斯日益增長的威脅"
 BEL_growing_threat_of_fascism_desc: "激進的法西斯主義在歐洲乃至全世界的支持率不斷上升，成為一個非常令人擔憂的趨勢，我們應該做好準備，必要時阻止其蔓延。即使這樣的行動必須先發制人。"
 BEL_peacekeeping_missions: "維和行動"
 BEL_peacekeeping_missions_desc: "世界各地的衝突持續引發我們的關注，然而，為了保持表面的中立，我們只能在經過批准的維和任務中向國外派遣軍隊。"
 BEL_international_socialist_bureau: "社會黨國際局"
 BEL_international_socialist_bureau_desc: "第二國際在布魯塞爾設有常務秘書處，雖然第二國際整個組織在1916年解散，但社會主義鬥爭仍在繼續。現在我們在國際舞臺上重新站穩了腳跟，我們應該重新建立該機構，並再次在社會主義國際中發揮領導作用。"
 BEL_raise_the_red_flag: "高舉紅旗"
 BEL_raise_the_red_flag_desc: "到目前為止，我們的大部分事業都符合較為溫和的社會主義理想，然而，為了與蘇聯陣營更加一致，我們可能需要加強對共產黨的支持。邁向這一目標的第一步是支持比利時的共產黨報紙《紅旗報》。"
 BEL_raise_the_red_flag_tt: "解鎖決議§Y$BEL_rekindle_the_red_flame_cat$§!，並將[BEL.GetNameDef]轉變為§Y共產主義§!。"
 BEL_support_the_european_project: "支持歐洲計劃"
 BEL_support_the_european_project_desc: "在一個充滿戰爭和衝突的世界中，我們越來越明顯地認識到中立並不能保證和平。因此，我們應該與其他歐洲國家接觸，建立一個致力於共同安全和經濟穩定的機構，這樣我們才可以共同繁榮。"
 BEL_european_community: "歐洲共同體"
 BEL_european_community_desc: "歐洲計劃的初期進展順利，因此我們應該考慮擴大成員規模，並批准一系列指導我們共同體未來的條約。我們甚至可以考慮向更為聯邦化的模式邁進，同時比利時在其核心位置扮演領導角色。"
 BEL_european_community_tt: "解鎖決議推進§Y$BEL_closer_european_union_cat$§!"
 BEL_the_king_surrenders: "國王投降"
 BEL_the_king_surrenders_desc: "國王利奧波德三世出人意料地動用了他作為總司令的權力，宣佈比利時所有軍隊無條件向敵人投降。表面上看，這是為了儘可能多地挽救生命，但有傳言說存在更陰暗的動機。"
 BEL_unfit_to_reign: "不適合統治"
 BEL_unfit_to_reign_desc: "鑑於國王利奧波德三世在未經議會批准的情況下提出無條件投降，人民政府宣佈他不適合統治，併發誓將在海外繼續戰爭。"
 BEL_prisoner_king: "囚徒王"
 BEL_prisoner_king_desc: "國王利奧波德三世渴望與他的人民一起服刑，選擇留在[BEL.GetNameDef]成為俘虜。他現在被稱為“囚犯國王”，人民們擁護他的行為，並開始在這個困難時期以他為榜樣。"
 BEL_government_in_exile: "流亡政府"
 BEL_government_in_exile_desc: "倖存的[BEL.GetAdjective]政治精英現已抵達他們的東道主首都，其中包括多位重要部長，如於貝爾·皮埃洛、保羅-亨利·斯巴克、卡米耶·居特和阿爾貝特·範弗萊斯豪韋爾。他們共同組建了“四人政府”，並誓言要將戰爭進行到勝利的最後。"
 BEL_la_dame_blanche: "白夫人"
 BEL_la_dame_blanche_desc: "“白夫人”是世界大戰期間的地下抵抗組織。當時，該組織的領導人瓦爾泰爾·德韋一直在悄悄地為比利時再次被佔領做準備，現在是時候讓我們第二次釋放該組織的能力了。"
 BEL_government_in_exile_tt: "解鎖§Y$BEL_government_in_exile_cat$§!以加強[ROOT.GetName]的合法性和抵抗能力。"
 BEL_moi_dabord: "吾輩當先"
 BEL_moi_dabord_desc: "“我先！”當敵國大使帶著宣戰書到來時，斯巴克發出了這句著名的呼喊。斯巴克對戰爭的爆發感到憤怒，他想在戰爭宣言被遞交前讓這次突襲被國際社會記錄下來。而這後來也成為了流亡政府支持者的口號。"
 BEL_v_for_victory: "V即勝利"
 BEL_v_for_victory_desc: "“勝利！自由！”這兩個單詞在比利時的語言中有相同的首字母“V”。在傳播到國外之前，豎起的食指和中指已經成為比利時民眾反抗和決心的象徵，並被具有類似抗爭精神的其他國家領導人採納。"
 BEL_democratic_homecoming: "民主歸來"
 BEL_democratic_homecoming_desc: "贏回我們家園的不是王室，而是我們的民主制度和讓最優秀的公民帶領我們的過程。我們應該認可他們在這一時刻的重要貢獻，並將他們的成就銘刻於後代。"
 BEL_charles_count_of_flanders: "佛蘭德伯爵夏爾"
 BEL_charles_count_of_flanders_desc: "顯然，利奧波德無法被再次信任委以王權，他在代表國家投降時放棄了他的責任。幸運的是，他有一個年輕的弟弟，查理王子，佛蘭德斯伯爵，他將成為一個出色的攝政王，直到我們正式決定如何處理那位“國王”。"
 BEL_leopolds_return: "利奧波德迴歸"
 BEL_leopolds_return_desc: "國王利奧波德三世是[BEL.GetNameDef]的合法統治者，既然比利時已經歸還給我們，他就應該恢復他的王位。"
 BEL_secretaries_general: "總秘書處"
 BEL_secretaries_general_desc: "雖然我們會竭盡全力保衛我們的國家，但面對我們龐大的鄰國，我們必須務實地做出決策，並制定投降的法律。因此，我們組建了總秘書處，這些公務員被法律允許與任何佔領者合作，確保地方政府能夠繼續運作。"
 BEL_the_secret_army: "秘密軍隊"
 BEL_the_secret_army_desc: "現在我們的國家已被佔領，我們需要開始建立抵抗力量，從事破壞和干擾行動。秘密軍隊是我們實現這一目標的渠道，它由我們被打敗的軍隊的部分官員創立，他們具有組織和後勤技能，足以執行任務。我們需要做的就是下達命令。"
 BEL_the_belgian_legion: "比利時軍團"
 BEL_the_belgian_legion_desc: "比利時軍團是一群保守派和效忠王室的忠誠分子，隨時準備拿起武器為他們的國王效力。我們應該儘可能將他們偷運出國，並有效利用他們。"
 BEL_develop_home_support: "發展國內支持"
 BEL_develop_home_support_desc: "儘管大部分戰爭工作是從我們的流亡地協調的，我們在國內仍然享有廣泛的支持。這主要歸功於總秘書處的工作，在不必過分激怒佔領者的情況下，他們已經很好地組織了民眾的力量。"
 BEL_military_service_for_all_in_exile: "流亡者皆服兵役"
 BEL_military_service_for_all_in_exile_desc: "全世界有許多[BEL.GetAdjective]人。我們應該下令，他們都必須立即服役，為解放我們的祖國效力。愛國熱情高漲，我們可以期待得到大量支援。"
 BEL_consolidate_resistance_groups: "整合抵抗組織"
 BEL_consolidate_resistance_groups_desc: "[BEL.GetNameDef]境內有許多抵抗組織，他們都渴望支持我們的解放事業，但由於不同的意識形態、觀點、理念、利益團體和支持者而產生分歧。作為流亡政府，我們有權提供中央組織倡議，將它們全部團結在我們的統一目標下。"
 BEL_free_belgian_forces: "自由比利時部隊"
 BEL_free_belgian_forces_desc: "我們在海外的力量已經足夠強大，現在我們可以開始針對佔領者的採取正式軍事行動。儘管這場戰鬥可能不會立即影響比利時本身，但至少我們總算將戰火帶給我們的敵人，並通過[BEL.GetAdjective]的血和鋼直接為戰爭做出更大的貢獻。"
 BEL_free_belgian_forces_tt: "2支§Y步兵師§!將在流亡政府的本土內隨機生成。"
 BEL_king_law_freedom: "國王，法律，自由"
 BEL_king_law_freedom_desc: "優秀的比利時人會為國王、法律和自由而戰。應該注意的是，國王在一切之前，就像利奧波德三世應該是我們的國王一樣。因為我們擁護他的法律，我們為他的自由而戰。"
 BEL_king_of_the_belgians: "比利時人之王"
 BEL_king_of_the_belgians_desc: "“我宣誓遵守比利時人民的憲法和法律，維護國家獨立和領土完整”，這是成為國王的誓詞，用法語、荷蘭語和德語三種語言說出。"
 BEL_rally_to_the_king: "為了國王陛下"
 BEL_rally_to_the_king_desc: "國王已經不僅僅是一個囚犯，他已經成為我們這個正在掙扎的國家的象徵。我們相信，在他的領導下，憑藉他的才智、智慧和決心，我們將度過這些黑暗的日子，最終成為一個更強大、更繁榮的國家。"
 BEL_van_overstraeten_on_the_home_front: "範奧弗斯特拉滕在大後方"
 BEL_van_overstraeten_on_the_home_front_desc: "範奧弗斯特拉滕是所有軍事人員中最聰明的，缺點是他自知這種名聲。在戰爭爆發前，他已經能夠作為國王的軍事顧問服務，儘管他的性格使得與他合作具有挑戰性，但我們的處境使我們必須請求他出馬，帶領我們的國家走向勝利。"
 BEL_expand_the_belgian_legion: "擴充比利時軍團"
 BEL_expand_the_belgian_legion_desc: "越來越多的人聚集到國王的旗幟下，準備為王室奉獻一切。我們只需一聲令下，他們將會按我們的命令行動。"
 BEL_expand_the_belgian_legion_tt: "3支§Y步兵師§!將在流亡政府的本土內隨機生成。"
 BEL_the_price_to_pay: "要付出的代價"
 BEL_the_price_to_pay_desc: "國王已經與我們的佔領者進行了一段時間的討論，他的品格使他能夠贏得他們的信任。因此，我們有可能收復在比利時失去的土地。他們要求的回報很簡單。跪下服從。"
 BEL_monetary_reconstruction: "財政重建"
 BEL_monetary_reconstruction_desc: "世界大戰之後，比利時經濟一片狼藉。為了促進重建並償還鉅額債務，比利時財政部開始印刷數量驚人的貨幣。儘管這在當時起到了作用，但我們面臨著惡性通脹的風險，它必須在進行其他改革之前得到控制。"
 BEL_rebuild_wallonian_industry: "重建瓦隆工業"
 BEL_rebuild_wallonian_industry_desc: "瓦隆尼亞是世界大戰遭德國佔領期間受災最嚴重的地區，其大部分工業和資源都被佔領者掠奪。儘管重建工作目前已經取得了一定的進展，但要發揮其作為[ROOT.GetAdjective]工業中心的真正潛力，仍然需要更多的投資。"
 BEL_gold_reserves: "黃金儲備"
 BEL_gold_reserves_desc: "幸運的是，[ROOT.GetAdjective]保持了相當大的黃金儲備。目前，這為我們國內的借貸提供了穩定的基礎，但我們也可以選擇出售黃金來暫時促進發展和建設。"
 BEL_social_partners: "社會夥伴"
 BEL_social_partners_desc: "我們的政府召開了全國勞工會議，彙集了工會和公司代表。其結果是引入了最低工資標準和每年六天的帶薪假期。"
 BEL_revive_coal_mining: "振興煤炭開採"
 BEL_revive_coal_mining_desc: "瓦隆工業的基石一直是鋼鐵，為了更好地生產這種重要材料，我們需要在該地區積極擴張我們的煤礦。"
 BEL_40_hour_workweek: "40小時工作制"
 BEL_40_hour_workweek_desc: "全國勞工會議的另一項成果是激進地引入了每週40小時工作制。雖然最初持懷疑態度，但我們見證了生產力和工人幸福感的提高。"
 BEL_cockerill: "柯克里爾"
 BEL_cockerill_desc: "柯克里爾公司是[ROOT.GetNameDef]最重要的鋼鐵製造商，這座大型工廠有能力生產從引擎到火炮。隨著這些產品需求的增加，我們目前處於促進其進一步擴展的有利地位。"
 BEL_cockerill_tt: "§G降低§!將§Y$BEL_cockerill_industrial$§!指定為工業企業的費用"
 BEL_railway_expansion: "擴建鐵路"
 BEL_railway_expansion_desc: "作為[ROOT.GetAdjective]商業和工業的生命線，鐵路至關重要。隨著我們的經濟復甦和反彈，我們必須確保我們的基礎設施能跟上步伐。"
 BEL_corporate_social_responsibility: "企業社會責任"
 BEL_corporate_social_responsibility_desc: "儘管[ROOT.GetNameDef]的工業化和城市化程度很高，但出人意料的是，工會從未擁有過預期中的權力。這是因為企業對員工負有社會責任是一種文化傳統——儘管時不時地提醒他們這一點也無妨。"
 BEL_val_benoit_institutes: "瓦爾-貝努瓦學院"
 BEL_val_benoit_institutes_desc: "我們應該在列日大學建立瓦爾-貝努瓦學院，在舊瓦爾-貝努瓦修道院的廢墟上建立幾個新的科學部門。"
 BEL_stk: "建立核能應用研究中心"
 BEL_stk_desc: "我們旨在建立核能應用研究中心，作為一個專門的機構，研究原子能背後的科學可能性。"
 BEL_embrace_export_economy: "採納出口經濟"
 BEL_embrace_export_economy_desc: "儘管[ROOT.GetNameDef]從未像我們的北部鄰國那樣以此聞名，但它以安特衛普市為中心的貿易傳統讓人自豪。讓我們更多地挖掘這種盈利潛力——畢竟，這只是一筆好生意。"
 BEL_engine_of_the_economy: "經濟引擎"
 BEL_engine_of_the_economy_desc: "火車在[ROOT.GetAdjective]人的心中佔有特殊的地位，它們激發了新的創新，使生產走上正軌，併為進一步增長提供動力。但最重要的是，它們是經濟的引擎。"
 BEL_belgian_miracle: "比利時奇蹟"
 BEL_belgian_miracle_desc: "很難想像，二十年前，比利時還是一片廢墟，被許多人視為另一個歐洲戰場。將那時的情況與現在的我們相比，我們已成為生產力和創新的燈塔。這要歸功於我們士兵的勇敢、我們工人的堅韌以及我們盟友和朋友的忠誠。"
 BEL_belgian_air_force: "[ROOT.GetAdjective]空軍"
 BEL_belgian_air_force_desc: "[ROOT.GetNameDef]是空中力量的早期採用者，在上次戰爭中發展了一支表現出色的空軍。不幸的是，由於預算限制，自那以後創新一直受到阻礙。隨著緊張局勢的升級，我們必須確保我們的空中威懾力保持強大。"
 BEL_develop_belgian_air_industry: "發展比利時航空業"
 BEL_develop_belgian_air_industry_desc: "我們沒有多少開發自己飛行器的經驗，自上次戰爭以來，飛機產業發展嚴重不足。我們可以資助非常有創新精神的年輕設計師和初創公司，幫助其取得發展。"
 BEL_renard_constructions_aeronautiques: "勒納爾飛機制造廠"
 BEL_renard_constructions_aeronautiques_desc: "近來，最有前途的設計師之一是阿爾弗雷德·雷納德，他有一些非常創新的設計，我們應該支持他的付出和他的公司。"
 BEL_stampe_et_vertrongen: "斯坦普與威特隆根公司"
 BEL_stampe_et_vertrongen_desc: "儘管斯坦普與威特隆根公司主要生產教練機，我們應該投資這家本土公司，並調整他們的設計以承擔更多前線任務。"
 BEL_relocate_air_production: "搬遷空軍生產"
 BEL_relocate_air_production_desc: "飛機制造需要大量的專業部件，並依賴難以替代的航空工程師。然而，一旦生產出來，飛機可以部署到幾乎任何地方。我們應該與外國公司簽訂合同，在國外生產我們的飛機，以保護我們的生產線。"
 BEL_pressurized_cabin_development: "研發增壓艙"
 BEL_pressurized_cabin_development_desc: "為了提高比利時與剛果之間的空中旅行質量，我們一直在研究增壓艙，這將使我們飛得比通常可能的海拔高得多。將這項技術應用到我們的戰時飛機上將顯著提高它們的能力。"
 BEL_foreign_plane_purchases: "購買外國飛機"
 BEL_foreign_plane_purchases_desc: "不幸的是，由於[ROOT.GetAdjective]航空工業的窘況，我們被迫向國外尋找飛機採購。讓我們宣佈一場競賽，讓其他國家為合同競標。"
 BEL_aviation_school: "航空學院"
 BEL_aviation_school_desc: "我們的飛行員需要有場地學習技能，我們應該相應地開發自己的培訓設施。"
 BEL_polish_licences: "波蘭許可"
 BEL_polish_licences_desc: "[POL.GetNameDef]已經向我們提供了一些他們的飛行器設計許可，並以遠低於市場價格提供給我們。"
 BEL_early_helicopters: "早期直升機"
 BEL_early_helicopters_desc: "尼古拉斯·弗洛林在俄國內戰後選擇移民到[ROOT.GetNameDef]，他對一種使用快速旋轉的旋翼的全新飛行形式表現出了濃厚的興趣。我們應該資助這項研發，看看這個新的航空科學領域將把我們帶向何方！"
 BEL_air_doctrine: "空軍學說"
 BEL_air_doctrine_desc: "現代戰爭在不斷變化和發展。我們應該資助研究其他軍事力量目前使用的理論，看看可以吸取哪些經驗並應用於我們自己的空軍。"
 BEL_legacy_of_the_belgian_airforce: "比利時空軍的遺產"
 BEL_legacy_of_the_belgian_airforce_desc: "我們的飛行員在那次世界大戰的戰場上被認為是最勇敢的，這一值得驕傲的傳統至今仍在延續。"
 BEL_re_establish_belgian_navy: "重建比利時海軍"
 BEL_re_establish_belgian_navy_desc: "世界大戰結束後，儘管比利時通過凡爾賽條約從德國手中得到了幾艘軍艦，但受限於預算，它還是於1927年解散了自己的海軍。面對國外日益增長的威脅以及我們保持與剛果的戰略通訊和貿易的需求，我們必須確保我們的艦隊得到重建。"
 BEL_re_build_the_fleet: "重建艦隊"
 BEL_re_build_the_fleet_desc: "恢復我們海軍力量的第一步，實際上是建立一支新的海軍。這將需要對新造船廠和造船能力進行大量投資。"
 BEL_allied_donations: "盟友捐贈"
 BEL_allied_donations_desc: "我們需要加強海上存在的情況變得更為緊迫，因此我們應該向我們的盟友尋求幫助，看看他們是否能在重新發展我們的海軍建設方面提供一些協助。"
 BEL_port_of_antwerp: "安特衛普港"
 BEL_port_of_antwerp_desc: "安特衛普是一座以商業歷史著稱的城市，其港口至今仍然非常重要。讓我們利用這一聲譽促成有利的貿易協議。"
 BEL_corvette_fleet: "護衛艦艦隊"
 BEL_corvette_fleet_desc: "造船需要很長時間，尤其是對於大型主力艦來說。因此，由於迫切需要擴張我們的海軍，我們應該重點生產小型、容易製造的艦船，專門從事我們最需要它們的用途：保護我們的商業利益。"
 BEL_boelwerf: "布爾韋夫"
 BEL_boelwerf_desc: "布爾韋爾夫造船廠f是安特衛普最大的造船廠之一，我們應該利用他們的能力，並更加重點擴建他們的船塢，以便我們更易於增強自己的海軍力量。"
 BEL_cockerill_shipyards: "柯克里爾造船廠"
 BEL_cockerill_shipyards_desc: "柯克里爾造船廠是柯克里爾集團的子公司，這種工業紐帶正是我們真正應該建立的。這個時代的軍艦是用鋼材建造的，沒有誰比柯克里爾更擅長鋼鐵加工。"
 BEL_antwerp_maritime_academy: "安特衛普海事學院"
 BEL_antwerp_maritime_academy_desc: "儘管更專注於民用和商業航運，我們仍然可以利用這裡教師的專業知識來訓練和發展我們海軍的海洋力量。在向我們的官員展示如何最好地與維持我們貿易流動的商船合作方面，他們將特別有用。"
 BEL_naval_doctrine: "海軍理論"
 BEL_naval_doctrine_desc: "我們的平民教練能教我們的只有那麼多，要真正擴大我們對海軍事務的瞭解，我們必須尋求聘請一些外國人才，從而加強我們的知識和培訓能力。"
 BEL_convoy_protection_duties: "武裝商船"
 BEL_convoy_protection_duties_desc: "在極大的危險和需要時，給商船配備武器並提供炮兵和海軍補給以保護自身是可以接受的。這樣，那些獵捕我們商人的人將會發現，獵物突然間有了尖牙。"
 BEL_maritime_phoenix: "海上鳳凰"
 BEL_maritime_phoenix_desc: "從無到有，我們的艦隊已經開花結果。我們的船塢被工業的火光照亮，新船不斷從船臺上下水，我們的戰略利益正在被飄揚著[ROOT.GetAdjective]旗幟的艦隊實現。"
