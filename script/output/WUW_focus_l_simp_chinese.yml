 GER_fuhrer_title_text_female: "女元首"
 GER_ascended_advisor_1_name_text: "§Y[GetAscendedAdvisorName1]§!"
 GER_ascended_advisor_2_name_text: "§Y[GetAscendedAdvisorName2]§!"
 GER_ascended_advisor_3_name_text: "§Y[GetAscendedAdvisorName3]§!"
 GER_fuhrer_tooltip: "[GetFuhrerGenderedName]§Y[GetFuhrerName]§!。"
 remove_character_as_tt: "§R移除§!§Y$ROLE$§!§Y$CHARACTER$§!。\n"
 GER_oppose_hitler_ww: "召集國防軍"
 GER_oppose_hitler_ww_desc: "希特勒的統治必須結束。他打算通過重新軍事化萊茵蘭來挑釁西方列強，但這樣做將為我們提供藉口，我們需要在國防軍忠誠分子的幫助下奪取政權，並團結德國人民反對他。"
 GER_rally_the_nation: "召集國民"
 GER_rally_the_nation_desc: "現在機會來了，我們國家中有許多人願意站出來反對納粹。我們應該把人民團結起來，甚至可以接觸那些自魏瑪共和國時期以來一直與納粹作鬥爭的準軍事組織。"
 GER_rally_the_nation_tt: "我們將能夠選擇一種民族精神，該精神在內戰結束時要麼被§Y改變§!，要麼被§R移除§!。"
 GER_denazification_campaigns: "去納粹化運動"
 GER_denazification_campaigns_desc: "為了真正清除感染[GER.GetNameDef]核心的納粹毒瘤，我們必須努力進行去納粹化，並一旦發現納粹分子或庇護他們的人就立即逮捕。"
 GER_rebuild_the_nation_ww: "重建國家"
 GER_rebuild_the_nation_ww_desc: "如果我們希望從納粹的禍害中恢復過來，就必須全力以赴地進行快速重建。在此期間，人民將不得不過著簡樸的生活並努力工作，但他們一定會為了更美好的明天而這樣做。"
 GER_revitalize_the_nation: "振興國家"
 GER_revitalize_the_nation_desc: "經歷內戰的蹂躪後，我們必須著眼於重建國家。我們將請求人民暫時放下個人的舒適，以便我們集中所有資源實現這一目標。"
 GER_rebuild_the_nation_ww_tt: "解鎖決議：§Y$GER_public_works_modifier$§!"
 GER_tend_to_the_future_of_germany: "展望德國的未來"
 GER_tend_to_the_future_of_germany_desc: "現在德國已經成功地從納粹手中拯救出來，我們必須展望新的前景，並決定國家未來的發展方向。為了團結、正義和自由！"
 GER_tend_to_the_future_of_germany_tt: "任何§Y分離主義叛亂§!的企圖都將被成功規避。"
 #COMMUNISM
 GER_start_the_proletarian_revolution: "發動無產階級革命"
 GER_start_the_proletarian_revolution_desc: "我們希望在第一次內戰後，工人的聲音能被更多人聽到。然而，情況似乎並非如此。無產階級值得更好的待遇，只有讓他們奮起反抗，我們才能最終將權力交給支持無產階級的人們，一勞永逸。"
 GER_start_the_proletarian_revolution_civil_war_tt: "如果該任務超時，將會導致§R內戰§!！"
 GER_states_with_proletarian_uprising_joins_cw_tt: "擁有§Y$GER_proletariat_uprising_modifier$§!修正的地區會在內戰中加入§Y共產主義者§!一方。"
 GER_the_proletarian_revolution_flag: "無產階級革命正在進行中。"
 GER_formalize_the_intelligence_wing: "正式成立情報部門"
 GER_formalize_the_intelligence_wing_desc: "這個國家在那些不關心人民利益的統治者手下遭受了許多苦難。為了確保我們能夠重建國家，我們首先必須知道我們有什麼可以利用的資源。建立一個有效的情報部門將是一個好的開端！"
 GER_propaganda: "全國性宣傳"
 GER_propaganda_desc: "我們之前見過宣傳的力量，無法否認它的有效性。通過分配資源來增強對我們光榮領袖的支持，我們能確保人民的態度正如我們所希望的那樣。"
 GER_form_the_stasi: "成立斯塔西"
 GER_form_the_stasi_desc: "情報部門取得了巨大的成功，我們現在開始考慮成立一個負責國家安全的部委。雖然這可能不是最受人民歡迎的決定，但這是一個必要的措施。"
 GER_effective_operations: "有效行動"
 GER_effective_operations_desc: "隨著斯塔西的持續壯大，我們必須擴大其行動範圍。境外任務與境內任務對於[ROOT.GetAdjective]的國家安全同樣重要。"
 GER_assemble_red_orchestra: "組建紅色管絃樂隊"
 GER_assemble_red_orchestra_desc: "紅色管絃樂隊從來都不是一個嚴密的組織，而只是圍繞幾個有資源的個人聚集的一群人。然而，其中一些成員十分內行，我們應該考慮招募他們。"
 GER_ressurect_the_red_front_fighters_league: "復興紅色前線戰士聯盟"
 GER_ressurect_the_red_front_fighters_league_desc: "紅色前線戰士聯盟是一個與魏瑪共和國時期的運動相關的準軍事組織。在法西斯政權下，他們勇敢地抵抗警察和其他壓迫者。就像我們舊政權常用的手段一樣，紅色前線戰士因此被取締。是時候讓他們復興了！"
 GER_spawn_more_communist_militias_in_civil_war_tt: "如果再次爆發§Y內戰§!，則在受§Y$GER_proletariat_uprising_modifier$§!影響的三個核心地區中創建§Y2個德國§!單位"
 GER_ressurect_the_red_front_fighters_league_tt: "§Y2民兵部隊§!將會在受§Y$GER_proletariat_uprising_modifier$§!影響或被§Y[ROOT.GetAdjective]共產主義者§!控制的§Y三個隨機地區§!出現。"
 GER_reorganize_nationale_volksarmee: "重組國家人民軍"
 GER_reorganize_nationale_volksarmee_desc: "腐敗和法西斯思想在我們的軍隊中仍然根深蒂固。為了防止叛亂和兵變，我們必須清除那些對我們懷有敵意的人。這將導致軍隊中出現一個巨大的空缺，因此，為了確保人民的安全，我們必須任命新的、忠誠的將領來帶領我們的勇士應對可能的戰鬥。"
 GER_cannot_join_oppossing_civil_war_side_tt: "這些角色將無法在潛在的§Y內戰§!中加入對立陣營："
 GER_ensure_army_loyalty: "確保軍隊忠誠"
 GER_ensure_army_loyalty_desc: "隊伍中還有一些人可以被說服支持我們的事業，而不是繼續堅持他們被迫遵從的愚行。這需要一些努力，但通過培養士兵們的良好集體精神，我們可以確保他們在未來幾年保持忠誠。"
 GER_political_commissars: "政治委員"
 GER_political_commissars_desc: "我們的隊伍中還有一些人可以被我們爭取到我們的事業中來，而不是他們被迫遵守的錯誤道路。我們必須任命負責的軍官，向普通士兵宣傳共產主義的好處，並把他們組織起來，確保忠誠。"
 GER_rapid_army_expansion: "快速軍事擴張"
 GER_rapid_army_expansion_desc: "我們的軍隊在經歷了必要的變化後，增長速度不再像以前那樣快。我們仍然需要一支強大的軍隊來保護我們的人民，面對越來越敵對的世界。大規模的動員和訓練推進應該能解決這個問題。"
 GER_the_peoples_victory: "人民的勝利"
 GER_the_peoples_victory_desc: "人民發聲了，人民的聲音被聽到了。我們舊的腐敗政府顯露出軟弱的跡象，我們必須抓住這個機會要求他們辭職，替人民奪回權力！"
 GER_legacy_of_the_spartacus_league: "斯巴達克同盟的遺產"
 GER_legacy_of_the_spartacus_league_desc: "斯巴達克斯聯盟在1919年隨著德國共產黨的成立而解散，但他們的一些思想值得重新提倡。該聯盟設想建立一個以民主選舉和人民意志為基礎的社會主義共和國，但在必要時也允許革命團體存在。是時候再次朝這個目標努力了。"
 GER_social_ownership: "社會所有制"
 GER_social_ownership_desc: "我們已經看到了當重要的國家服務由那些目標與人民利益不一致的人經營時會發生什麼。為了防止這種情況再次發生，我們應該將我們的工業轉為公有制。"
 GER_civil_liberties: "公民自由"
 GER_civil_liberties_desc: "我們的同志中存在一種誤解，認為為了使國家高效和安全運轉，必須強迫每個人服從一致。但這與社會主義的目標背道而馳。只有通過保護公民自由，人民才會真正忠誠於國家。"
 GER_embrace_democratic_institutions: "採納民主制度"
 GER_embrace_democratic_institutions_desc: "自由民主不過是資產階級的偽裝。真正的民主不僅要求社會平等，還要求經濟平等。因此，只有我們能夠真正將人民的意願充分納入治理國家的進程。"
 GER_establish_volkskommissariats: "建立人民委員轄區"
 GER_establish_volkskommissariats_desc: "外國佔領是不可接受的，但為了在我們新解放的鄰國中建立合法的工人主導政府，我們將承擔起管理的艱鉅責任，並引導他們走向社會主義理想。"
 GER_establish_volkskommissariats_tt: "解鎖在任何當前和未來的與我們意識形態相同的§Y鄰近附屬國§!建立§Y人民委員轄區§!的決議。"
 GER_industrialize_volkskommissariats: "工業化人民委員轄區"
 GER_industrialize_volkskommissariats_desc: "由於設備短缺導致勞動力效率低下，該人民委員轄區的工業落後於[ROOT.GetAdjective]的其他轄區。我們必須投資工業化方案以糾正這一不平衡。"
 GER_industrialize_volkskommissariats_tt: "解鎖在§Y人民委員轄區§!內實施§Y專注工業化§!的決議"
 GER_protect_the_revolution: "保衛革命"
 GER_protect_the_revolution_desc: "儘管一些人認為我們在國外的干預是為了獲得影響力，但我們清楚我們的使命是保護國際範圍內的無產階級。要做到這一點，我們必須有能力在國際可接受的正常範圍之外採取行動。"
 GER_protect_the_revolution_tt: "針對[ROOT.GetNameDef]煽動內戰的§Y鄰近國家§!，解鎖決議§Y要求臣服§!"
 GER_instill_german_discipline: "強調德式軍紀"
 GER_instill_german_discipline_desc: "從人民委員轄區的軍隊中可以明顯看出，他們缺乏[ROOT.GetAdjective]的紀律和效率標準。我們必須在這些方面對他們進行教育，以便他們能更好地防禦我們的對手。"
 GER_integrate_subjects_economies: "整合附屬國經濟"
 GER_integrate_subjects_economies_desc: "在我們的領導下，人民委員轄區的經濟取得了巨大進展。為了進一步提高效率，我們將把各國工業全部整合為一個單一的經濟體。"
 GER_current_future_volkskommisariats_tt: "所有當前和未來的§Y人民委員轄區§!："
 GER_integrate_volkskommissariats: "整合人民委員轄區"
 GER_integrate_volkskommissariats_desc: "人民委員轄區的初衷是引導歐洲被解放的人民走向社會主義。然而，隨著我們的經濟和文化的交融，一種新的身份意識正在興起，倡導擴展[ROOT.GetAdjective]的含義。從此，我們是一個民族，一個國家。"
 GER_integrate_volkskommissariats_tt: "解鎖決議§Y整合人民委員轄區§!。一旦§Y[ROOT.GetNameWithFlag]§!整合完第一個§Y人民委員轄區§!，國家將重新命名為§Y$GER_german_socialist_union_communism$§!"
 GER_expand_social_welfare: "擴大社會福利"
 GER_expand_social_welfare_desc: "世界大戰後，我們開始發展福利制度以造福人民，但在大蕭條之後，這一制度變得更加有限。我們應該投入資源重建這一制度，並使它成為每個德國人的榮譽徽章，向世界證明共產主義的優越性。"
 GER_liberate_austria: "解放奧地利"
 GER_liberate_austria_desc: "我們南方的鄰居們長期以來生活在對人民極為惡劣的條件下。雖然他們稱另一個國家為家，但我們有很多相似之處，甚至還共享一種語言。為了我們這群[AUS.GetAdjective]人民的利益，我們將提出一個要求，不，應該說是一個邀請，歡迎他們與我們一起！"
 GER_spark_the_flame_of_revolution: "點燃革命之火"
 GER_spark_the_flame_of_revolution_desc: "鄰國的工人們的處境並不像我們希望的那樣好。從長遠來看，這些國家的武裝革命是不可避免的，但目前，我們應該盡力在這些國家傳播共產主義的思想。"
 GER_spark_the_flame_of_revolution_tt: "解鎖決議§Y周遭小國§!§Y加強共產主義思潮§!。一旦受到影響的國家中共產主義者獲得了多數支持，就會爆發一場將該國變為§Y共產主義§!的§Y內戰§!。"
 GER_proletarian_international_alliance: "無產階級國際"
 GER_support_the_proletarian_uprising: "支持無產階級起義"
 GER_support_the_proletarian_uprising_desc: "鑑於我們預見到周邊地區的內戰會急劇增加，我們必須更新我們的立場，以更好地支持起義的工人。這些工人可能對這樣的行動準備不足，而通過提供他們足夠的武裝，我們可以確保紅色浪潮將在我們歐洲這一部分蔓延開來。"
 GER_support_the_proletarian_uprising_tt: "解鎖§Y決議§!，允許向因§Y[ROOT.GetAdjective]§!鼓動§Y共產主義§!思潮而陷入內戰的國家提供§Y步兵裝備§!。"
 GER_the_proletarian_legion: "無產階級軍團"
 GER_the_proletarian_legion_desc: "我們必須為我們發起的起義負責。這些國家的無產階級現在正被內戰摧殘，急需我們的幫助來儘快結束腐敗的政權。我們必須考慮派兵去支援他們！"
 GER_the_proletarian_legion_tt: "一旦§Y任何國家§!因§Y[ROOT.GetNameWithFlag]§!鼓動§Y共產主義§!而爆發§Y內戰§!："
 GER_strengthen_the_proletarian_international: "加強無產階級國際"
 GER_strengthen_the_proletarian_international_desc: "隨著鄰國的工人們為自己的權利而奮起，我們看到增強我們作為可靠聯盟的地位的絕佳機會。通過邀請這些新成立的共產主義國家加入無產者國際，我們都可以變得更強大。"
 GER_strengthen_the_proletarian_international_tt: "§Y歐洲§!所有在§Y[GER.GetNameWithFlag]§!影響下轉向§Y共產主義§!的國家將被邀請加入§Y無產階級國際§!。這一效果也將適用於在§Y該國策完成後§!受到共產主義影響的國家。"
 GER_proletarian_solidarity: "無產階級團結"
 GER_proletarian_solidarity_desc: "我們在讓歐洲走上共產主義道路的努力上投入了大量時間和資源。現在我們享受我們勞動成果的回報不是理所當然的嗎？"
 GER_proletarian_solidarity_decision_tt: "解鎖決議：§Y鼓勵無產階級團結§!，與[GER.GetName]幫助過轉向共產主義的國家增進資源貿易"
 GER_liberate_italy: "解放意大利"
 GER_liberate_italy_desc: "[ITA.GetAdjective]人長期以來在[ITA.GetLeader]的統治下飽受苦難。曾幾何時，他們是我們之前政府的盟友，而現在我們已經變得更好，理應將他們一起帶上這條路！"
 GER_the_end_to_fascist_europe: "法西斯歐洲的終結"
 GER_the_end_to_fascist_europe_desc: "即使在這個時候，歐洲仍然有一些國家處於法西斯統治之下。我們深知這給人民帶來的壓力，因此我們必須確保這些國家立即獲得解放！"
 GER_bypass_end_to_fascist_europe_tt: "沒有： 任意其他國家：\n   首都：位於§Y歐洲§!\n   當前執政黨是§Y法西斯主義§!。" #The indentations are there so the tt looks correct
 GER_war_against_fascism_tt: "獲得針對§Y歐洲§!任何§Y法西斯§!國家的§Y吞併§!戰爭目標（尚未被[GER.GetNameDef]獲得戰爭目標的國家）。當前效果："
 GER_red_europe: "紅色歐洲"
 GER_red_europe_desc: "我們不能僅僅把鼓勵工人拿起武器、舉起紅旗的努力侷限於我們的鄰國。我們必須將無產階級革命傳播到整個歐洲！"
 GER_spark_the_flame_of_revolution_red_europe_tt: "解鎖決議以在§Y歐洲小國§!中§Y加強共產主義思潮§!。一旦受影響國家的共產黨獲得多數支持，§Y內戰§!將爆發並使國家轉向§Y共產主義§!"
 GER_root_out_imperialism: "剷除帝國主義"
 GER_root_out_imperialism_desc: "帝國主義的根深深紮在非洲和亞洲的土地上，束縛了那裡的工人。這些人民在殖民主義下受苦太久了。我們必須結束剝削，賦予被壓迫的人民掌握自己命運的力量，並轉移我們敵人的注意力。"
 GER_root_out_imperialism_tt: "解鎖§Y決議§!以增強§Y非洲§!和§Y亞洲§!國家的抵抗和自治。"
 GER_strengthen_the_proletarian_international_internationally_tt: "每個在§Y歐洲§!之外受到§Y[GER.GetNameWithFlag]§!推動走向§Y共產主義§!的國家都將被邀請加入§Y無產階級國際§!。這個效果也適用於§Y在採取這一國策之後§!受到共產主義影響的國家。"
 GER_hegemony_over_europe: "歐洲霸權"
 GER_hegemony_over_europe_desc: "古老的帝國主義歐洲正在崩潰。我們將在其基礎上建立一個新的社會主義秩序，歐洲的工人將仰仗我們來領導他們對抗資產階級的暴政。無產階級的勝利將確立我們在整個大陸的霸權。"
 GER_war_against_major_countries_in_europe_tt: "對控制至少一個§Y歐洲§!地區的所有§Y主要§!國家獲得戰爭目標§Y吞併§!。當前效果："
 GER_align_south_america: "與南美結盟"
 GER_align_south_america_desc: "南美的工人們在資本主義的枷鎖下已經受夠了。爭取他們支持我們的事業，肯定會讓我們的堅定盟友遍佈整片大陸。"
 GER_communist_propaganda_south_america_decision_tt: "解鎖決議以在§Y南美小國§!中§Y加強共產主義思潮§!。一旦受影響國家的共產黨獲得多數支持，§Y內戰§!將爆發並使國家轉向§Y共產主義§!。"
 GER_wage_war_on_capitalism: "對資本主義發動戰爭"
 GER_wage_war_on_capitalism_desc: "資本主義是共產主義的天敵，必要時必須用武力予以消滅。我們將帶領這場對抗象徵資本主義的[USA.GetNameDef]的鬥爭，為新的社會主義時代鋪平道路。"
 GER_instigate_middle_eastern_revolutions: "煽動中東革命"
 GER_instigate_middle_eastern_revolutions_desc: "中東長期受到外國勢力的壓迫，已經到了社會主義革命的臨界點。我們應該激起人民對最終擺脫剝削的渴望，升起社會主義的紅旗。"
 GER_communist_propaganda_middle_east_decision_tt: "解鎖決議以在§Y中東小國§!中§Y加強共產主義思潮§!。一旦受影響國家的共產黨獲得多數支持，§Y內戰§!將爆發並使國家轉向§Y共產主義§!。"
 GER_intervene_in_spain: "干涉西班牙"
 GER_intervene_in_spain_desc: "我們有義務以任何方式幫助我們在西班牙的同志對抗法西斯主義的力量。派遣久經沙場的部隊一定會受到歡迎。"
 GER_assist_our_eastern_comrades: "支援我們的東方同志"
 GER_assist_our_eastern_comrades_desc: "我們遠東的同志們的鬥爭已經讓他們疲憊不堪。我們應該盡力幫助他們。派遣久經沙場的部隊可能會扭轉他們的命運。"
 GER_strike_at_the_rising_sun: "打擊旭日帝國"
 GER_strike_at_the_rising_sun_desc: "[JAP.GetNameDefCap]仍然是帝國主義的堡壘，壓迫著任何追求平等和社會主義的人。是時候讓日本人屈服並接受無產階級世界新秩序了。"
 GER_nationalize_industries: "國有化工業"
 GER_nationalize_industries_desc: "看到我們國家經濟中央集權的積極成果後，我們也可能考慮對工業採取同樣的措施。目前，工業在許多私有企業的分割下運營，各自使用不同的生產工藝和方法。國有化工業將讓我們對產出和生產效率有更多的控制。"
 GER_form_agricultural_cooperatives: "成立農業合作社"
 GER_form_agricultural_cooperatives_desc: "農業部門對我們來說至關重要。許多產業依賴農民及其勞作，把他們放任自流實在不是負責任的做法。通過成立合作社，我們可以確保農業部門齊心協力，發揮最大效率，減少損失。"
 GER_effectivize_the_volkswerke: "提升國民企業的效能"
 GER_effectivize_the_volkswerke_desc: "所謂的“人民企業”是我們前輩們提出的少數幾個想法之一。作為一個國家控制的工業集團，負責監督礦業和鋼鐵行業的增長與生產，人民企業值得我們做出所有可能的改進。"
 GER_womens_rights_and_equality: "婦女權利和平等"
 GER_womens_rights_and_equality_desc: "性別長期以來一直是一個決定個人應該在哪裡為國家服務的因素，無論是在前線、工廠還是在家中。通過追求更平等的負擔分擔，我們可以擴大勞動力，必要時也能擁有更強大的軍隊。"
 GER_locks_women_in_workforce_decision_tt: "§Y$women_in_the_workforce$§!決議變為§Y不可用§!"
 GER_labor_rights_and_union_stuff: "建立工會"
 GER_labor_rights_and_union_stuff_desc: "允許工人們組建工會，共同表達他們的關切並規定工作條件，在我們國家長期以來一直被忽視。國家不僅應該允許，而且應該鼓勵工會的成立，正是時候了！"
 GER_proletarian_dictatorship: "無產階級專政"
 GER_proletarian_dictatorship_desc: "為了給我們的人民提供最好的機會和生活水平，我們必須確保有一個與人民及其需求緊密相連的穩定領導。作為長期為無產階級奮鬥的鬥士，[ROOT.GetLeader]具備所有資格，並且證明自己始終為工人們著想。"
 GER_state_controlled_economy: "國家控制經濟"
 GER_state_controlled_economy_desc: "我們的經濟太脆弱，不能交給不懂得如何最佳管理它的人。為了避免對我們人民造成長期影響的經濟危機，國家必須控制我們的經濟。"
 GER_central_planning: "中央計劃"
 GER_central_planning_desc: "既然我們的經濟已經掌握在國家手中，那麼我們的經濟規劃也應該集中化。這是因為只有對國家經濟有整體把握的人，才能做出最佳的投資決策和資源分配。"
 GER_the_german_stakhanovite_movement: "德國斯達漢諾夫運動"
 GER_the_german_stakhanovite_movement_desc: "薩霍諾夫運動起源於[SOV.GetName]的共產主義統治下，當時工人們開始為自己努力工作、產出超過預期而感到自豪。這個運動極大地提升了生產力，並給工人們帶來了更強烈的使命感。我們應該考慮在[ROOT.GetNameDef]鼓勵類似的情感。"
 GER_the_german_stakhanovite_movement_tt: "完成§Y$GER_establish_the_reichswerke$§!或§Y$GER_invest_in_vereinigte_stahlwerke$§!後，該國策將使資源產量增加§G5%§!。"
 GER_spheres_of_influence: "勢力範圍"
 GER_spheres_of_influence_desc: "在如此接近的兩個志同道合的國家之間，我們必須為我們和[SOV.GetAdjective]建立一個公平的競爭環境。通過建立一個勢力範圍，併為我們東部的同志劃定一個區域，我們可以降低武裝衝突的風險。"
 GER_spheres_of_influence_tt: "我們與§Y[SOV.GetNameWithFlag]§!將在§Y歐洲§!建立各自的勢力範圍。\n\n我們的§Y勢力範圍§!將包括：\n§Y[SWE.GetNameWithFlag]\n[NOR.GetNameWithFlag]\n[DEN.GetNameWithFlag]\n[POL.GetNameWithFlag]§!（西部）\n§Y[CZE.GetNameWithFlag]§!（西部）\n§Y[HUN.GetNameWithFlag]§!\n\n他們的§Y勢力範圍將包括§!：\n§Y[FIN.GetNameWithFlag]\n[EST.GetNameWithFlag]\n[LAT.GetNameWithFlag]\n[LIT.GetNameWithFlag]\n[SLO.GetNameWithFlag]\n[POL.GetNameWithFlag]§!（東部）\n§Y[ROM.GetNameWithFlag]\n[BUL.GetNameWithFlag]\n[YUG.GetNameWithFlag]§!"
 GER_czechoslovakia: "解放[CZE.GetName]的工人"
 GER_czechoslovakia_desc: "就在南邊的[CZE.GetNameDef]，還有一些工人需要擺脫資本主義的枷鎖。他們還沒有完全領悟到正確的共產主義形式，而我們必須確保以各種方式將其帶給他們。這是我們作為好同志的責任。"
 GER_poland: "保護[POL.GetAdjective]的無產者"
 GER_poland_desc: "在[POL.GetNameDef]的無產階級還沒有享受到與我們[ROOT.GetAdjective]工人相同的權利。他們在現有領導下無法發展，也許是時候我們出手解放和保護他們了。"
 GER_hungary: "終結[HUN.GetAdjective]工人的受壓迫境遇"
 GER_hungary_desc: "在[HUN.GetNameDef]的工人們仍在為基本權利而奮鬥。該國政府顯然未能理解他們的需求，因此我們必須介入，確保[HUN.GetName]的無產階級得到公平對待，並獲得應有的尊重。"
 GER_the_northern_shield: "北方之盾"
 GER_the_northern_shield_desc: "北歐國家資源豐富，但儘管他們努力組織工人，無產階級仍然在資本主義利益的壓迫下苦苦掙扎。我們認為，工人們不僅應得更好的待遇，同時我們也能更有效地利用這些資源。對北歐工人的剝削必須結束！"
 GER_sign_the_second_treaty_of_berlin: "簽署第二次柏林條約"
 GER_sign_the_second_treaty_of_berlin_desc: "我們知道自己擁有一支龐大的軍隊，但同樣也明白[SOV.GetNameDef]有一支我們不想與之交戰的軍隊。通過接觸並確保我們在同一立場，以避免敵對沖突，我們可以為我們各自國家的所有工人確保一個更好的未來。"
 GER_defense_treaty_with_the_soviet: "與蘇聯簽訂防禦條約"
 GER_defense_treaty_with_the_soviet_desc: "既然我們已經與[SOV.GetAdjective]達成一致，不進行敵對行動，那麼我們應該考慮進一步發展外交關係。我們認為他們值得我們保護，我們也假設他們會有同樣的感覺，共同防禦條約對他們的利益和對我們是一致的。"
 GER_industrial_cooperation: "工業合作"
 GER_industrial_cooperation_desc: "我們與[SOV.GetAdjective]的合作到目前為止主要集中在軍事事務上。考慮到[SOV.GetNameDef]是我們的盟友，我們在其他領域進行合作也是理所當然的。我們的工業理念已經足夠相似，工業領域的聯合努力應該不會太難實現。"
 GER_tech_sharing: "工業技術共享"
 GER_tech_sharing_desc: "我們與其他志同道合的國家之間應當努力實現技術共享。為了這個目標，與[SOV.GetAdjective]接觸似乎是最合乎理智的選擇。"
 GER_resource_trade: "資源貿易"
 GER_resource_trade_desc: "儘管我們努力盡可能自給自足，但我們還是要允許自己與那些共享我們理想的國家進行貿易。通過以工業能力的形式向[SOV.GetNameDef]提供一些補償，我們應該能夠與他們達成非常有利的交易。"
 GER_factories_for_resources: "資源換工廠"
 GER_factories_for_resources_desc: "在[ROOT.GetNameDef]，我們有大量的民用工業可以更好地利用。我們知道[SOV.GetNameDef]在某些地區相對欠發達，而這些地區恰好通常富含寶貴的資源。提出將一些工業遷移以換取這些資源，可能會為我們帶來豐厚的機會。"
 GER_factories_for_resources_tt: "解鎖§Y決議§!，允許將工業設施遷移至§Y[SOV.GetNameWithFlag]§!，以換取資源。"
 #NON-ALIGNED/DEMOCRATIC
 GER_monarchist_sentiment: "君主主義情緒"
 GER_monarchist_sentiment_desc: "人民想要君主制，這正是他們將得到的。雖然具體的政府形式尚未確定，但很明顯德國人民需要他們的皇帝歸來。"
 GER_the_monarchy_compromise_ww: "$GER_the_monarchy_compromise$"
 GER_the_monarchy_compromise_ww_desc: "$GER_the_monarchy_compromise_desc$"
 GER_re_establish_free_elections_ww: "$GER_reestablish_free_elections$"
 GER_re_establish_free_elections_ww_desc: "$GER_reestablish_free_elections_desc$"
 GER_re_ratify_the_locarno_treaty: "重新批准《洛迦諾公約》"
 GER_re_ratify_the_locarno_treaty_desc: "《洛迦諾公約》於1925年簽署，協約國嘗試與我們正常化關係，同時確保歐洲的領土完整。雖然它被視為對我們的壓迫，但很明顯，撤銷希特勒反對它的錯誤是最好的選擇。"
 GER_re_ratify_the_locarno_treaty_tt: "§Y[FRA.GetNameDefCap]§!將更有可能接受我們採取的任何外交行動"
 GER_franco_germanic_pact: "法德條約"
 GER_franco_germanic_pact_desc: "隨著我們最近與[FRA.GetAdjective]關係的正常化，因此明智的選擇是，深化我們的關係並正式建立友誼和互助條約，以便我們可以共同對抗東方的[SOV.GetAdjective]。"
 GER_request_the_return_of_french_held_colonies: "請求歸還法國佔領的殖民地"
 GER_request_the_return_of_french_held_colonies_desc: "世界大戰結束後，我們被剝奪了我們的殖民地。隨著德國殖民協會在阿登納領導下重獲民心，也許是時候要求歸還我們昔日的殖民地喀麥隆和多哥蘭了。我們與法國的關係越好，他們就越有可能讓我們收回領土。"
 GER_offer_trade_proposal: "提供貿易提案"
 GER_offer_trade_proposal_desc: "資源豐富的國家有許多，與它們開展貿易將非常有利可圖。印度尼西亞和剛果的領土富含橡膠和稀有金屬，因此與[BEL.GetNameDEF]和[HOL.GetNameDef]建立貿易協議，將使我們能夠獲得其殖民地豐富的資源，來推動我們的工業發展。"
 GER_reverse_the_brain_drain_ww: "$GER_reverse_the_brain_drain$"
 GER_reverse_the_brain_drain_ww_desc: "$GER_reverse_the_brain_drain_desc$"
 GER_shared_rd_programs_ww: "$GER_shared_rd_programs$"
 GER_shared_rd_programs_ww_desc: "$GER_shared_rd_programs_desc$"
 GER_shared_rd_programs_ww_tt: "§Y$GER_rnd_programs_modifier$§!的研究速度加成會隨著每新增一個陣營成員增加§G+1.00%§!，最多增加§G+10.00%§!"
 GER_shared_rd_programs_2_tt: "我們§Y陣營§!中的每個§Y國家§!也將加入§Y中歐同盟科研§!共享組。"
 GER_pool_technical_know_how_ww: "$GER_pool_technical_know_how$"
 GER_pool_technical_know_how_ww_desc: "$GER_pool_technical_know_how_desc$"
 GER_the_mannheim_project_ww: "曼海姆計劃"
 GER_the_mannheim_project_ww_desc: "我們應該加倍努力破解原子的秘密，並研究將其武器化，以對抗[SOV.GetAdjective]。這要感謝我們新結交的盟友，他們可能願意分享他們在這方面的任何信息，這將使這一過程變得更加容易。"
 GER_ban_political_uniforms: "禁止政治制服"
 GER_ban_political_uniforms_desc: "在魏瑪時代，準軍事組織和政治團體在我們的街道上進行鬥爭。為了確保未來的穩定，我們應該禁止這些公開的政治派別活動。"
 GER_embrace_liberal_leanings: "擁抱自由主義傾向"
 GER_embrace_liberal_leanings_desc: "在我們的皇帝無法在戰爭結束時，做成政治家所能做到的事情時，保守主義就被證明是過時的。我們應該始終向前看，為更美好的明天而奮鬥！"
 GER_strive_for_conservative_values: "追求保守價值觀"
 GER_strive_for_conservative_values_desc: "自由主義思想在我們的國家肆虐太久，削弱了我們人民的心智，腐蝕了我們的從政者。我們必須迴歸到我們古老的良好價值觀，以確保魏瑪共和國的混亂永不重現。"
 GER_strengthen_the_welfare_state: "加強福利國家"
 GER_strengthen_the_welfare_state_desc: "我們的國家作為一個福利國家有著悠久的歷史，這是我們現在不打算改變的。我們必須堅持我們的原則，盡我們所能，確保我們的人民過上好生活。"
 GER_democratic_shield: "民主盾牌"
 GER_democratic_shield_desc: "世界各地的民主都面臨危險，一如我國的過往。我們知道權威主義、極權主義、民粹主義的恐怖，必須確保其他國家的人民不必經歷我們曾經的痛苦。"
 GER_send_military_support_democratic_shield_tt: "解鎖決議§Y向交戰的§Y民主陣營§!國家提供軍事裝備§!"
 GER_revive_the_kaiserreich_ww: "$GER_revive_the_kaiserreich$"
 GER_revive_the_kaiserreich_ww_desc: "$GER_revive_the_kaiserreich_desc$"
 GER_return_of_the_kaiser_ww: "皇帝歸來"
 GER_return_of_the_kaiser_ww_desc: "帝國需要一位皇帝，而威廉二世仍然活著，在荷蘭流亡。我們將解除針對他的流亡令，並邀請他重回皇位，無論西方民主國家會怎麼想。"
 GER_military_dictatorship: "軍事獨裁"
 GER_military_dictatorship_desc: "那次世界大戰向我們證明，僅靠皇帝不足以引導我們的國家去往最好的方向。正如當時所做的那樣，新的最高陸軍指揮部必須再次承擔起獨裁權力，成為帝國唯一的政治權威。"
 GER_military_dictatorship_tt: "§Y德意志帝國§!將被稱作§Y德意志凱撒國§!。\n"
 GER_invite_scientists_back: "帝國科學計劃"
 GER_invite_scientists_back_desc: "許多才智出眾的人在納粹上臺後逃離了這個國家，他們理由充分。然而，現在隨著我們光榮帝國的復興，許多人可能願意再次回到我們身邊。"
 GER_glorious_mechanical_machinations: "偉大的機械設計"
 GER_glorious_mechanical_machinations_desc: "我們的皇帝長期以來對大型機器充滿了興趣，並命令我們的科學家優先研究那些曾經只在夢中見到的創造物，比如巨大的鐵路炮、能飛越大西洋的飛機，以及輪廓遮天蔽日的艦船。"
 GER_prussian_artillery: "普魯士炮兵理論"
 GER_prussian_artillery_desc: "在過去，我們憑藉優越的理論贏得了一場又一場的戰鬥。質量和火力是使這種戰術如此成功的重要部分，這是我們必須再次努力效仿的！"
 GER_fan_prussian_militarism: "$GER_fan_the_prussian_militarism$"
 GER_fan_prussian_militarism_desc: "$GER_fan_the_prussian_militarism_desc$"
 GER_fan_prussian_militarism_tt: "解鎖4級陸軍元帥§Y魯普雷希特·馮·維特爾斯巴赫§!"
 GER_re_form_the_freikorps: "重建自由軍團"
 GER_re_form_the_freikorps_desc: "自由軍團長期以來一直幫助我們與意識形態上的對手進行鬥爭，在整個魏瑪時代幫助我們鎮壓了巴伐利亞蘇維埃共和國以及其他革命企圖。我們應該設法重建這樣一支準軍事力量，使共產主義者和納粹都不能在我國立足。"
 GER_freikrops_militia_recruitment_tt: "獲得五個自由軍團§Y民兵§!單位"
 GER_re_form_the_freikorps_generals_tt: "§Y弗朗茨·裡特·馮·埃普§!和§Y赫爾曼·埃哈特§!可用作為將軍。"
 GER_re_establish_the_landwehr: "重建後備軍"
 GER_re_establish_the_landwehr_desc: "自1813年以來，後備軍一直是有用的自衛工具，對魏瑪共和國非常有用。我們也應該努力使我國的男性變得有用，並建立我們自己的後備軍和地方步槍營。"
 GER_all_for_the_front: "一切為了前線！"
 GER_all_for_the_front_desc: "每個人如果希望他的祖國重獲昔日的輝煌，就必須將他的心、血和靈魂獻給德國。我們所做的一切都應該是為了前線，隨著時間的推移，我們的人民將必定理解這一現實。"
 GER_expatriate_the_communists_ww: "$GER_expatriate_the_communists$"
 GER_expatriate_the_communists_ww_desc: "$GER_expatriate_the_communists_desc$"
 GER_demand_the_return_of_southern_jutland: "要求歸還南日德蘭"
 GER_demand_the_return_of_southern_jutland_desc: "石勒蘇益格公爵領地的所有權一直是我們與丹麥人之間的爭議問題。儘管沒有參與戰爭，但在那次世界大戰結束時，協約國將北石勒蘇益格交給了他們。我們必須糾正這一歷史上的不公，並要求丹麥政府將其歸還給我們。"
 GER_glory_to_the_imperial_army: "榮耀歸於帝國軍隊"
 GER_glory_to_the_imperial_army_desc: "帝國軍隊贏得了一場又一場的勝利，確保了普魯士和德國提高了在歐洲的地位。儘管政治家們在戰爭結束時背叛了軍隊，但軍隊將能夠重新獲得曾經失去的輝煌。"
 GER_glory_to_the_imperial_army_tt: "解鎖2級陸軍將領§Y艾特爾·弗里德里希親王§!"
 GER_restore_the_holy_roman_empire: "重建神聖羅馬帝國"
 GER_restore_the_holy_roman_empire_desc: "許多人懷疑這一天是否會到來，但現在我們做到了。隨著帝國舊邊界的收復，我們可能再次能夠為神聖羅馬帝國的皇帝加冕，不過這次是以一個統一國家的形式。榮耀歸於帝國！"
 GER_weltpolitik: "世界政治"
 GER_weltpolitik_desc: "除非我們恢復了我們的全球性帝國，或者在原來的位置上建立一個新的帝國，否則我們不會被認真地視為一個大國。因此，我們必須開始放眼全球，而不再僅僅把目光集中在歐洲大陸。"
 GER_prepare_for_the_next_naval_blockade: "為下一次海上封鎖做準備"
 GER_prepare_for_the_next_naval_blockade_desc: "我們很清楚上次與艦隊規模比我們大的敵人作戰時發生了什麼。由於我們現在掌握了知識，只要在戰爭到來之前精心準備，我們就能設法規避曾經面臨的許多問題。"
 GER_accept_british_naval_dominance_ww: "$GER_accept_british_naval_dominance$"
 GER_accept_british_naval_dominance_ww_desc: "$GER_accept_british_naval_dominance_desc$"
 GER_carve_up_congo: "瓜分剛果"
 GER_carve_up_congo_desc: "剛果的殖民時機已經成熟，而且自然資源豐富。也許我們可以與英國的綏靖主義者達成協議，共同瓜分這片廣袤的領土，作為重建我們殖民帝國努力的重大一步。"
 GER_anglo_germanic_defense_pact: "英德防禦條約"
 GER_anglo_germanic_defense_pact_desc: "英國長期以來一直是我們的敵人，但隨著最近的事態發展，我們或許能夠與他們達成共同防禦協議，協議規定，如果有人攻擊我們中的一方，等同於在攻擊我們雙方。這將是正常化我國與英國關係的重要一步。"
 GER_signed_the_anglo_german_defence_pact_opm: "簽署英德防禦條約"
 GER_anglo_germanic_cooperation_program: "英德合作計劃"
 GER_anglo_germanic_cooperation_program_desc: "皇家海軍在造船和海戰方面擁有豐富的知識。由於我們的密切合作，我們也許能夠獲得並利用英國人以前一直嚴守的秘密。"
 GER_carte_blanche_for_alsace_and_french_colonies_ww: "$GER_carte_blanche_for_alsace_and_french_colonies$"
 GER_carte_blanche_for_alsace_and_french_colonies_ww_desc: "$GER_carte_blanche_for_alsace_and_french_colonies_desc$"
 GER_petition_for_the_return_of_old_colonies: "請求歸還舊殖民地"
 GER_petition_for_the_return_of_old_colonies_desc: "我們新結交的英國朋友可能願意討論歸還他們在世界大戰後佔據的我們的殖民地。他們可能會要求某種形式的補償，但如果這意味著光復我們的故土，我們願意這樣做。"
 GER_unify_west_africa: "統一西南非洲"
 GER_unify_west_africa_desc: "我們對中非夢想目前因安哥拉地區的存在而受阻。為了將我們在西南非洲的領土與剛果的領土連接起來，我們必須發出最後通牒，要求立即承認我們對該地區的統治。"
 GER_expand_pacific_holdings: "擴張太平洋領地"
 GER_expand_pacific_holdings_desc: "在太平洋地區建立帝國的願望鼓舞了我們的政客，他們倡導擴展我們在該地區的影響力，目標是在遠東建立[ROOT.GetAdjective]霸權。我們應該支持這一倡議，並採取攻勢。"
 GER_closer_sino_germanic_relations: "加強中德關係"
 GER_closer_sino_germanic_relations_desc: "[CHI.GetAdjective]一直是我們的長期盟友，許多人認為[CHI.GetAdjective]政府很可能在當時加入我們一方參加世界大戰。我們應該重視與他們的關係，並努力加強兩國之間的紐帶。"
 CHI_has_accepted_german_overtures: "中國已接受[ROOt.GetAdjective]的提議"
 GER_industrial_investments: "工業投資"
 GER_industrial_investments_desc: "[CHI.GetNameDefCap]非常不發達，缺乏成為大國所需的工業化能力。我們應該派遣工程師幫助他們實現工業化，並資助新興的[CHI.GetAdjective]公司，幫助他們實現工業發展。"
 GER_launch_sino_germanic_joint_research_program: "啟動中德聯合研究項目"
 GER_launch_sino_germanic_joint_research_program_desc: "[CHI.GetAdjective]擁有許多寶貴的知識，而我們也掌握許多對他們有用的知識。因此，我們應該努力建立一個聯合研發團隊，共同促進兩國的進步。"
 GER_send_military_aid: "派遣軍事援助"
 GER_send_military_aid_desc: "我們的[CHI.GetNameDef]朋友被敵人包圍，多國試圖威脅他們的存在。我們必須向他們運送彈藥和設備，以便他們能夠保衛邊疆，並在未來幾年對我們有所幫助。"
 GER_send_volunteers: "遠東軍團"
 GER_send_volunteers_desc: "許多[ROOT.GetAdjective]人渴望冒險，並希望為偉大的事業而戰。因此，我們應該成立一支“志願兵”軍團，前去幫助我們的[CHI.GetAdjective]朋友參與他們的戰爭。"
 GER_request_the_return_of_qingdao: "要求歸還青島"
 GER_request_the_return_of_qingdao_desc: "青島是在百年屈辱中從中國獲得的眾多通商口岸之一。雖然我們在世界大戰結束後失去了這座多年前割讓給我們的城市，但我們現在可能有機會向[CHI.GetNameDef]要回它，只要我們準備好適當的補償。"
 GER_the_sino_germanic_pact: "中德條約"
 GER_the_sino_germanic_pact_desc: "正式承認[CHI.GetAdjective]政府為盟友的時機終於到來。我們應該立即正式建立這個聯盟，這樣我們就可以共同抵抗所有試圖壓迫我們的勢力！"
 GER_divide_and_conquer: "分而治之"
 GER_divide_and_conquer_desc: "我們和[CHI.GetAdjective]在遠東地區都有各自想要的勢力範圍，總有一天必須劃定並尊重彼此的邊界。因此，我們應該儘快這樣做，以便我們兩國的帝國夢想都能得到承認。"
 GER_asian_spheres_of_influence_tt: "我們和§Y[CHI.GetNameWithFlag]§!會在§Y亞洲§!建立我們的勢力範圍，修正在各自勢力範圍內和範圍外佔領土地的成本。\n\n我們的§Y勢力範圍§!包括：\n§Y[MAL.GetNameWithFlag]§!\n§Y[INS.GetNameWithFlag]§!\n§Y[PHI.GetNameWithFlag]§!\n§Y[AST.GetNameWithFlag]§!\n§Y[NZL.GetNameWithFlag]§!\n所有§Y南太平洋島嶼§!\n\n他們的§Y勢力範圍§!包括：\n§Y[SIA.GetNameWithFlag]\n[VIN.GetNameWithFlag]\n[CAM.GetNameWithFlag]\n[LAO.GetNameWithFlag]\n[CHI.GetNameWithFlag]\n[RAJ.GetNameWithFlag]\n[TIB.GetNameWithFlag]\n[NEP.GetNameWithFlag]\n[BHU.GetNameWithFlag]\n[KOR.GetNameWithFlag]\n[JAP.GetNameWithFlag]\n[MON.GetNameWithFlag]§!"
 GER_the_second_naval_race: "第二次海軍競賽"
 GER_the_second_naval_race_desc: "我們被英國和法國羞辱得太久了！是時候恢復我們的艦隊，正式宣佈我們不打算再向他們屈服。很快，他們會發現海洋獨屬於我們。"
 GER_rebuild_the_high_seas_fleet_ww: "$GER_rebuild_the_high_seas_fleet$"
 GER_rebuild_the_high_seas_fleet_ww_desc: "$GER_rebuild_the_high_seas_fleet_desc$"
 GER_break_anglo_french_colonial_hegemony_ww: "$GER_break_the_anglo_french_colonial_hegemony$"
 GER_break_anglo_french_colonial_hegemony_ww_desc: "$GER_break_the_anglo_french_colonial_hegemony_desc$"
 GER_break_anglo_french_colonial_hegemony_ww_tt: "如果我們與§Y法國§!簽署了互助合作條約，他們就無法成為我們的戰爭目標。"
 GER_asian_allies: "亞洲盟友"
 GER_asian_allies_desc: "亞洲有些小國還沒有被我們的敵人控制。或許通過承諾安全的未來和更多的領土，他們會願意在全球衝突中幫助我們。"
 GER_our_place_in_the_sun_ww: "陽光下的地盤"
 GER_our_place_in_the_sun_ww_desc: "讓所有人知道，[ROOT.GetNameDef]再次宣示其在陽光下佔據一席之地的權利！我們的人民將不再在日不落帝國的陰影下受辱！"
 GER_realize_mittelafrika: "實現德意志中非"
 GER_realize_mittelafrika_desc: "我們的殖民帝國將延伸到遙遠而廣闊的疆域，中非的富饒一直具有吸引力。我們應該儘快實現建立德意志中非的夢想，以便利用非洲的心臟地帶。"
 GER_realize_mittelafrika_tt: "獲得對§Y剛果§!、§Y肯尼亞§!、§Y安哥拉§!和§Y莫桑比克§!所有地區的宣稱。"
 GER_african_allies: "非洲盟友"
 GER_african_allies_desc: "非洲人民渴望從歐洲人手中解放出來。或許我們可以通過承諾自治來吸引他們加入我們。"
 GER_african_allies_tt: "解鎖決議支持§Y非洲§!國家的§Y獨立§!"
 GER_asian_allies_faction_tt: "當前不屬於任何陣營的獨立亞洲小國將收到以下事件："
 GER_african_allies_faction_tt: "當前不屬於任何陣營的獨立非洲小國將收到以下事件："
 GER_asian_allies_tt: "解鎖決議對§Y亞洲§!國家§Y支持獨立§!"
 GER_expand_african_reach: "擴大非洲影響力"
 GER_expand_african_reach_desc: "我們對非洲的某些地區提出了領土要求，但這些地區不在我們當前敵人的控制之下。我們應確保明確表達我們的主張，並立即向他們索要這些領土。"
 GER_realpolitik: "現實政治"
 GER_realpolitik_desc: "現在是時候讓我們向外看看歐洲其他國家，看看風向如何了。如果有結盟或征服的機會，我們必須立即抓住它們。"
 GER_restore_the_brest_litovsk_borders: "恢復佈列斯特-立托夫斯克邊界"
 GER_restore_the_brest_litovsk_borders_desc: "儘管俄羅斯在世界大戰中戰敗並將那些土地割讓給我們，然而《佈列斯特-立托夫斯克和約》確立的邊界早已被《凡爾賽條約》非法撤銷。我們必須努力收回失去的東部領土，即使這可能在未來導致戰爭。"
 GER_demand_further_polish_concessions: "要求波蘭進一步讓步"
 GER_demand_further_polish_concessions_desc: "我們已經讓波蘭人將舊帝國的重要部分歸還給我們，但我們不會止步於此。《佈列斯特-立托夫斯克和約》確立的邊界尚未恢復，波蘭仍然阻礙著我們實現夢想。"
 GER_restore_eastern_imperial_possessions: "恢復帝國東部領地"
 GER_restore_eastern_imperial_possessions_desc: "帝國的核心領土目前被外國勢力剝奪。為了實現《佈列斯特-立托夫斯克和約》確立的邊界，我們必須首先關注波茲南、西普魯士和西里西亞。"
 GER_incorporate_the_polish_rump_state: "吞併殘餘的波蘭"
 GER_incorporate_the_polish_rump_state_desc: "如《佈列斯特-立托夫斯克和約》中所規定的那樣，波蘭的最後一塊領土也理應屬於帝國。我們必須收復這些領土，必要時可以使用武力。"
 GER_memel_ultimatum: "梅梅爾最後通牒"
 GER_memel_ultimatum_desc: "如果我們從那次世界大戰中學到了一點，那就是我們必須為攻擊東部邊境做準備。這些邊境必須恢復，並加強防禦、以防入侵。然而，如果不控制具有重要戰略意義的梅梅爾，這一目標無法實現，我們必須將其收復。"
 GER_demand_lithuanian_integration: "要求整合立陶宛"
 GER_demand_lithuanian_integration_desc: "立陶宛王國曾計劃成為我們國家的半自治區，如今它將實現這一目標。我們必須尋求吞併立陶宛領土，並加冕明道加斯為該領土的公爵。"
 GER_establish_eastern_grand_duchies: "[GetEasternDuchiesName]"
 GER_establish_eastern_grand_duchies_desc: "條約中涵蓋的所有領土都不能由我們直接控制。然而，我們有計劃在東方建立大公國和衛星王國，它們將能夠為我們控制這些領土。"
 GER_eastern_duchies_name_democratic: "東方自治地區"
 GER_eastern_duchies_name_neutrality: "建立東方大公國"
 GER_subduing_the_baltic_states: "征服波羅的海國家"
 GER_subduing_the_baltic_states_desc: "波羅的海國家是不合法的，他們佔據了我們波羅的海聯合公國的領土。我們必須征服他們，並將這些土地交給波羅的海德意志貴族。"
 GER_subduing_the_baltic_states_tt: "獲得三支波羅的海防衛軍§Y步兵§!單位。\n如果§Y波蘭§!尚未§Y恢復貝蒙德§!，§Y呂迪格·馮·德·戈爾茨§!將以3級陸軍元帥的身份加入我們。"
 GER_strike_eastward: "向東進軍"
 GER_strike_eastward_desc: "邊界安全之後，是時候擊敗我們的最大對手了，那就是撕毀《佈列斯特-立托夫斯克和約》並威脅東歐穩定的[SOV.GetNameDef]。是時候攻佔莫斯科，真正讓[SOV.GetAdjective]巨人跪下了。"
 GER_unlocks_kremlin_raid_tt: "與§Y[SOV.GetNameWithFlag]§!交戰時，解鎖對§Y克里姆林宮§!的§Y空襲§!"
 GER_end_european_communism: "終結歐洲共產主義"
 GER_end_european_communism_desc: "現在我們國家的最大威脅已經被消滅，是時候清理他們在歐洲留下的爛攤子了。共產主義對我們的價值觀構成根本威脅，必須徹底消滅。"
 GER_strike_eastward_eq_trigger_tt: "在軍中超過§Y100000§!件步兵裝備"
 GER_second_vienna_award_eq_trigger_tt: "陸軍中擁有超過§Y60,000§!件步兵裝備"
 GER_sea_lion_eq_trigger_tt: "陸軍中擁有超過§Y90,000§!件步兵裝備。"
 GER_puppet_finland: "確保[FIN.GetAdjective]的忠誠"
 GER_puppet_finland_desc: "[GetFinlandpuppetDescription]"
 GER_finland_puppet_description_democratic: "[FIN.GetAdjective]人可能是我們的戰友，但我們永遠不能確定他們是否會有一天背叛我們並倒戈。無論付出多大的代價，我們必須確保這種情況永遠不會發生！"
 GER_finland_puppet_description_neutrality: "[FIN.GetAdjective]人過去曾拒絕我們扶持國王的提議，但我們不會再允許他們這樣做。是時候讓黑森的沃爾夫岡王子登上他們的王位了，不論他們是否願意。"
 GER_see_to_the_eastern_front_ww: "關注東線戰場"
 GER_see_to_the_eastern_front_ww_desc: "我們在上次戰爭中的行動對許多人來說仍記憶猶新。我們必須重新集中大陸的恐懼，關注真正的危險：東方隱隱呈現的[GER.GetGreatRedMenaceDesc]。我們將開始一場大規模的宣傳活動，讓整個大陸清醒過來。"
 GER_the_eastern_threat: "東方威脅"
 guardian_against_the_eastern_threat: "對抗東方威脅的守護者"
 existential_threat: "生存威脅"
 GER_seeks_to_restore_brest_litovsk: "尋求恢復《佈列斯特-立托夫斯克和約》"
 GER_seeks_to_restore_brest_litovsk_worse: "$GER_seeks_to_restore_brest_litovsk$"
 GER_safeguard_the_baltic_ww: "$GER_safeguard_the_baltic$"
 GER_safeguard_the_baltic_ww_desc: "$GER_safeguard_the_baltic_desc$"
 GER_tributes_for_guarantees: "貢賦換取獨立保障"
 GER_tributes_for_guarantees_desc: "我們應該保護波羅的海國家免受東方巨熊的威脅，但我們不會無償這樣做。鑑於這些國家處於如此脆弱的地位，要求保護補償將是輕而易舉的事情。"
 tributes_from_lithuania_tt: "如果§Y[LIT.GetNameWithFlag]§!接受："
 tributes_from_latvia_or_estonia_tt: "如果§Y[LAT.GetNameWithFlag]§!或§Y[EST.GetNameWithFlag]§!接受："
 GER_will_also_recieve_trade_and_civs_tt: "我們還將獲得一小部分他們的資源和民用工業。\n§Y$MODIFIER_CONSUMER_GOODS_FACTOR$§!的數量將取決於有多少國家接受我們的要求。"
 GER_support_the_finns_ww: "$GER_support_the_finns$"
 GER_support_the_finns_ww_desc: "[GER.GetRussiansDemonym]人處於俄羅斯的炮火之中。我們將為他們提供對抗東方威脅的保證，並給予他們一些適度的工業援助。"
 GER_danzig_for_guarantees_ww: "$GER_danzig_for_guarantees$"
 GER_danzig_for_guarantees_ww_desc: "$GER_danzig_for_guarantees_desc$"
 GER_safeguard_poland: "保護波蘭"
 GER_safeguard_poland_desc: "波蘭人容易受到來自東方的攻擊。我們必須不惜一切代價保護他們，以便在我們與[SOV.GetAdjective]之間的存有一個緩衝國。"
 GER_safeguard_poland_tt: "如果§Y波蘭§!在完成§Y舉行聯合軍事演習§!時，屬於我們的陣營，或受到我們的保障，那麼我們將獲得額外的§G25§!§Y陸軍經驗§!和§G15§!§Y空軍經驗§!"
 GER_offer_military_production_support: "提供軍事生產支持"
 GER_offer_military_production_support_desc: "東部的緩衝國缺乏我們擁有的強大工業基礎。我們應該為他們提供支持，幫助他們生產武器和彈藥，這樣如果[SOV.GetNameDef]攻擊他們，他們也能自己堅持一段時間。"
 GER_offer_military_production_support_tt: "所有處於我們保護下的東歐地區會獲得以下§Y軍事生產§!增益，持續§Y700§!天："
 GER_liberate_oppressed_people: "解放受壓迫的人民"
 GER_liberate_oppressed_people_desc: "在[SOV.GetNameDef]有許多人對我們很順從，他們比任何生靈都渴望解放。也許我們應該將他們從壓迫者手中解救出來，讓他們成為我們在東方的新盟友。"
 GER_liberate_oppressed_people_tt: "解放§Y[SOV.GetNameDef]§!的附屬國的花費降低§G40%§!，對其扶持傀儡政權的花費降低§G20%§!。"
 GER_liberate_oppressed_people_cossacks_tt: "允許重建南俄羅斯的§Y哥薩克共和國§!"
 GER_build_the_eastern_bulwark: "建立東部堡壘"
 GER_build_the_eastern_bulwark_desc: "在我們東方的國家防禦能力太弱，無法有效抵禦[SOV.GetAdjective]的威脅。我們必須在這些國家投資修建防禦工事，以便讓敵人奪取它們的代價變得儘可能高昂。"
 GER_build_the_eastern_bulwark_tt: "在§Y[ROOT.GetNameDef]§!，或者在被§Y[ROOT.GetNameDef]§!保證獨立的任何國家，或者在其陣營的國家，於與§Y[SOV.GetNameDef]§!接壤的所有地區，建設2級§Y陸上要塞§!。"
 GER_build_the_eastern_bulwark_ns_tt: "在與§Y[SOV.GetNameDef]§!交戰時，我們將獲得："
 GER_ally_white_russian_forces: "結盟俄國白軍"
 GER_ally_white_russian_forces_desc: "在紅軍贏得俄羅斯內戰後，許多俄羅斯人逃往國外。我們應該與他們接觸，看看他們是否願意合作收復家園，代價是，對於根據《佈列斯特-立托夫斯克和約》給予我們或我們盟友的土地，他們必須放棄任何領土要求。"
 GER_hold_joint_military_drills: "舉行聯合軍事演習"
 GER_hold_joint_military_drills_desc: "我們的東方盟友最近與[SOV.GetAdjective]作戰，較於我們時間更近，他們可能擁有如何擊敗那些傢伙的寶貴知識。我們應該組織聯合軍事演習，這樣這些知識就可以傳播開來。"
 GER_hold_joint_military_drills_tt: "我們和任何我們保護或在我們陣營中的東歐國家將獲得以下民族精神："
 GER_extend_mitteleuropas_bounderies: "向東拓展中歐同盟的邊界"
 GER_extend_mitteleuropas_bounderies_desc: "在我們東方的國家不僅僅是緩衝國。我們應該邀請他們加入中歐同盟，並確保他們也有助於加強我們的聯盟和關稅同盟。"
 GER_extend_mitteleuropas_bounderies_tt: "邀請受保證的東歐國家加入§Y中歐同盟§!"
 GER_reach_out_to_scandinavia: "接觸斯堪的納維亞"
 GER_reach_out_to_scandinavia_desc: "山區和寒冷不能阻擋[GER.GetGreatRedMenaceName]的威脅，斯堪的納維亞人必須意識到這一點。我們將邀請他們加入並提供保護，以防禦[SOV.GetAdjective]的威脅。"
 GER_mitteleuropa: "中歐同盟"
 GER_mitteleuropa_desc: "德意志人民的主要利益區域是中歐，那裡是最初由普魯士人設想為泛德意志國家中心的帝國。這些想法仍需加以完善，但它們是我們在歐洲建立新秩序的良好基礎。"
 GER_mitteleuropa_tt: "解鎖決議：§Y在奧地利爭取公眾輿論支持我們§!，使他們更願意接受聯盟與臣服。"
 GER_mitteleuropa_alliance: "中歐同盟"
 GER_brothers_in_arms: "並肩作戰"
 GER_brothers_in_arms_desc: "我們的奧地利兄弟曾經作為同盟國的一員與我們並肩作戰。我們應該向他們提出一個他們無法拒絕的邀請，以便我們可以再次並肩作戰。"
 GER_carve_up_czechoslovakia: "瓜分捷克斯洛伐克"
 GER_carve_up_czechoslovakia_desc: "[CZE.GetAdjective]不僅妨礙了我們的野心，也妨礙了我們南方盟友的雄心壯志。我們應該將他們瓜分，以實現中歐同盟。"
 GER_rekindle_imperial_sentiment_ww: "$GER_rekindle_imperial_sentiment$"
 GER_rekindle_imperial_sentiment_ww_desc: "$GER_rekindle_imperial_sentiment_desc$"
 GER_the_first_berlin_award: "第一次柏林仲裁"
 GER_the_first_berlin_award_desc: "波蘭人不僅佔據了我們的領土，還佔據了奧匈帝國的領土。我們應該設法恐嚇他們，讓波蘭將這些地區歸還給中歐同盟，否則他們將面臨德意志軍隊的怒火。"
 GER_the_first_berlin_award_hun_tt: "如果我們與§Y[HUN.GetNameDef]§!在同一陣營："
 GER_the_first_berlin_award_aus_tt: "如果我們與§Y[AUS.GetNameDef]§!在同一陣營："
 GER_the_second_berlin_award: "第二次柏林仲裁"
 GER_the_second_berlin_award_desc: "羅馬尼亞人和斯拉夫人也佔據了奧匈帝國的合法領土。我們必須立即要求他們歸還這些土地！"
 GER_trade_agreements: "貿易協定"
 GER_trade_agreements_desc: "中歐同盟不僅是軍事聯盟，也旨在建立更好的貿易關係和經濟合作。我們應該強調這一角色，並利用它來接觸那些自然資源豐富的國家。"
 GER_trade_agreements_tt: "所有盟友將獲得§Y民族精神§!："
 GER_mitteleuropa_cooperation_sphere: "中歐合作圈"
 GER_mitteleuropa_cooperation_sphere_desc: "中歐擁有許多聰明的人才。儘管如此，由於各國政府希望保守自己的知識，他們無法合作。我們必須鼓勵與盟友的更緊密的科學合作。"
 GER_conquer_italy: "征服意大利"
 GER_conquer_italy_desc: "在那次世界大戰期間，意大利攻擊奧匈帝國並站在協約國一邊時，他們背叛了我們。我們永遠不會忘記，也永遠不會原諒。是時候讓他們知道背叛最終會導致什麼了。"
 GER_align_italy: "與意大利結盟"
 GER_align_italy_desc: "意大利在大戰期間背叛了我們，但我們不能忘記他們擁有一支強大的海軍，這支海軍可能有能力與我們的敵人抗衡。因此，我們應該尋求重建與他們的舊聯盟。"
 GER_the_austrian_question: "奧地利問題"
 GER_the_austrian_question_desc: "小德意志解決方案是一個錯誤，我們必須立即糾正。我們應該脅迫奧地利加入我們的國家，或許甚至利用這個機會以布爾根蘭換取與[HUN.GetNameDef]的聯盟。"
 GER_the_austrian_question_more_likely_to_accept_tt: "如果他們目前領導一個陣營，他們§R不太可能§!接受。"
 GER_align_czechoslovakia: "與捷克斯洛伐克結盟"
 GER_align_czechoslovakia_desc: "捷克斯洛伐克擁有豐富的工業能力和自然資源，是奧匈帝國工業化的中心地帶之一。我們應該讓他們加入中歐同盟，以便利用他們的財富。"
 GER_sway_the_balkans: "影響巴爾幹"
 GER_sway_the_balkans_desc: "巴爾幹有許多國家感覺受到外國勢力的威脅。我們應該為他們提供中歐同盟的席位，這樣我們的聯盟才能不斷壯大。"
 GER_sway_the_balkans_tt: "解鎖決議以§Y加強[ROOT.GetRulingIdeology]意識形態§!在§Y巴爾幹§!國家中的影響力並§Y將其納入中歐同盟§!"
 GER_establish_a_customs_union: "建立關稅聯盟"
 GER_establish_a_customs_union_desc: "正如舊時的九月計劃所計劃的那樣，我們現在應該建立中歐關稅同盟，逐步統一歐洲經濟，成為最強大的力量。"
 GER_integrated_economies: "整合經濟"
 GER_integrated_economies_desc: "將我們盟友的經濟與我們的經濟一體化，並建立一個可以監督和幫助其他國家經濟狀況的德國中央銀行，從長遠來看對我們非常有利，不僅能加強我們的實力，還能增加他們對我們的依賴，最終使我們能夠控制他們的外交事務。"
 GER_integrated_economies_tt: "每個§Y陣營成員§!都將收到§Y事件：§![GER.GetNameDefCap]希望進一步整合我們的經濟"
 GER_european_confederation: "歐洲聯盟"
 GER_european_confederation_desc: "隨著我們盟友對我們的依賴性大增，是時候懷揣著建立歐洲聯邦的夢想，開始嘗試進一步整合他們。"
 GER_bring_turkey_into_the_fold: "將[TUR.GetNameDef]重新納入陣營"
 GER_bring_turkey_into_the_fold_desc: "土耳其對其當前邊界之外的地區有主權要求，很容易被脅迫加入我們的陣營。是時候讓他們重新回到我們的懷抱了。"
 GER_german_hegemony_in_the_middle_east: "在中東建立德國霸權"
 GER_german_hegemony_in_the_middle_east_desc: "征服中東的時機已經成熟，許多國家可能願意與我們結盟，希望我們反對大英帝國或法蘭西帝國。是時候在中東建立我們的霸權了。"
 GER_sway_the_middle_east_decisions_tt: "解鎖在§Y中東§!國家§Y加強[ROOT.GetRulingIdeology]意識形態§!，並§Y將他們納入中歐同盟§!的決議"
 GER_reject_the_locarno_treaty: "拒絕《洛迦諾公約》"
 GER_reject_the_locarno_treaty_desc: "《洛迦諾公約》顯然是為了阻止我們收復被不公正剝奪的領土。我們應該完全拒絕這項條約，並準備重新奪回我們的故土。"
 GER_backdoor_negotiations: "秘密談判"
 GER_backdoor_negotiations_desc: "我們可以嘗試避開西方對低地的干涉，不攻擊所有低地國家，而是煽動一個國家攻擊另一個國家，然後加入其中一個國家的陣營，有效地導致大尼德蘭地區古老國家之間的分裂。"
 GER_backdoor_negotiations_tt: "這些決議使我們能夠在攻擊目標國家的同時將其中一個目標國家納入我們的陣營。"
 GER_schlieffen_once_more_ww: "$GER_schlieffen_once_more$"
 GER_schlieffen_once_more_ww_desc: "$GER_schlieffen_once_more_desc$"
 GER_bypass_maginot_in_the_south_ww: "$GER_bypass_maginot_in_the_south$"
 GER_bypass_maginot_in_the_south_ww_desc: "$GER_bypass_maginot_in_the_south_desc$"
 GER_reinstate_imperial_possessions_ww: "$GER_reinstate_imperial_possessions$"
 GER_reinstate_imperial_possessions_ww_desc: "$GER_reinstate_imperial_possessions_desc$"
 GER_establish_western_grand_duchies: "[GetWesternDuchiesName]"
 GER_western_duchies_name_democratic: "西方自治地區"
 GER_western_duchies_name_neutrality: "建立西方大公國"
 GER_establish_western_grand_duchies_desc: "正如九月計劃中所計劃的那樣，我們應該通過建立自己的附屬國，在我們認為合適的地方劃分邊界，努力建立起我們對西部地區的控制。"
 GER_integrate_western_german_speakers: "整合西部德語族裔"
 GER_integrate_western_german_speakers_desc: "九月計劃曾設想將大盧森堡地區併入德意志國家。該地區和瑞士曾都是神聖羅馬帝國的一部分，而我們是其唯一合法繼承者。這些日耳曼地區必須儘快重新併入我們的國土。"
 GER_core_ardennes_tt: "如果[ROOT.GetnameDef]§Y不與[BEL.GetNameDef]在同一陣營§!且§Y完全控制§![980.GetName]："
 GER_core_german_switzerland_tt: "如果[ROOT.GetnameDef]§Y不與[SWI.GetNameDef]在同一陣營§!且§Y完全控制§![3.GetName]、[847.GetName]和[151.GetName]："
 GER_core_alto_adige_tt: "如果[ROOT.GetnameDef]§Y不與[ITA.GetNameDef]在同一陣營§!且§Y完全控制§![39.GetName]："
 GER_assassinate_mussolini_ww: "刺殺墨索里尼"
 GER_assassinate_mussolini_ww_desc: "時機已到，必須確保終結[ITA.GetAdjective]法西斯主義的關鍵人物。德國人將暗殺該領袖，隨後[ITA.GetAdjective]的保王派將一舉奪取政權。"
 GER_prepare_italian_coup_ww: "策劃[ITA.GetAdjective]政變"
 GER_prepare_italian_coup_ww_desc: "如果陷入法西斯主義的泥潭，意大利必將覆滅。我們將向[ITA.GetAdjective]保皇派提出一項由我們支持的政變提議。"
 #TOOLTIPS
 GER_unlock_influence_countries_tt: "解鎖決議：§Y$GER_influence_countries_cat$§!"
 GER_middle_eastern_trade_tt: "解鎖決議：§Y$GER_middle_eastern_trade_cat$§!"
 GER_allied_trade_tt: "解鎖決議：§Y$GER_mitteleuropa_allied_trade_cat$§!"
 GER_allied_customs_union_integration_request_tt: "解鎖決議：§Y$GER_mitteleuropa_economic_integration_cat$§!"
 GER_plan_z_lock_other_focus_tt: "國策§Y$GER_trade_interdiction$§!會被鎖定，直到國策§Y$GER_high_seas_fleet$§!完成。"
