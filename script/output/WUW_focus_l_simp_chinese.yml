 ### GERMAN FOCUS TREE ###
 FOCUS_ICON_SET_HISTORICAL_KEY_FOCUS: "歷史重點國策"
 GER_prioritize_economic_growth: "經濟增長優先"
 GER_prioritize_economic_growth_desc: "多年疏忽的財政政策幾乎毀了我們的經濟。我們必須製造拖拉機而不是坦克，分發鏟子而不是步槍，優先發展經濟而不是擴大軍工產業！"
 GER_currency_reforms: "貨幣改革"
 GER_currency_reforms_desc: "經濟復甦的第一步是推行全面的貨幣改革。"
 GER_lower_taxes: "減稅"
 GER_lower_taxes_desc: "對我們民眾的稅收負擔逐漸變得越來越沉重，以支付重新武裝計劃的費用。通過減輕這一負擔，我們可能會在短期內失去國家收入，但人們將能夠花費更多辛苦賺來的錢。"
 GER_workers_rights: "工人權利"
 GER_workers_rights_desc: "過去幾年裡，工會發生了根本性的變化，已與過去截然不同。通過改革，我們可以團結工人並從中獲益。"
 GER_abolish_price_controls: "取消物價管制"
 GER_abolish_price_controls_desc: "為了支持重新武裝實施的價格控制措施正在扼殺經濟。取消這些措施可能會減少國家資金，但將使人們能夠創辦新企業並盤活經濟。"
 GER_increased_trade: "增進貿易"
 GER_increased_trade_desc: "如果德國人民要繁榮昌盛，我們必須引進我們在自己邊界內無法提取或製造的東西。我們必須向外看，與其他國家簽訂新的貿易協議——當然是有利於我們的協議。"
 GER_housing_developments: "住房開發計劃"
 GER_housing_developments_desc: "我們可以通過啟動住房開發計劃來振興經濟，旨在翻新和創建現代住宅，並設立新的生活標準。"
 GER_invest_in_vereinigte_stahlwerke: "投資聯合鋼鐵公司"
 GER_invest_in_vereinigte_stahlwerke_desc: "聯合鋼鐵公司是我們最大、最重要的鋼鐵生產商之一。向該公司投入資源肯定會提高生產力，並改變德國鋼鐵工業。"
 GER_industrial_expansion: "工業擴張"
 GER_industrial_expansion_desc: "擁有能在國際上競爭並引領新技術的強大工業對我們的持續增長至關重要。[ROOT.GetNameDefCap]將成為品質的代名詞。"
 GER_agricultural_reforms: "農業改革"
 GER_agricultural_reforms_desc: "我們的農業部門大多由小規模、家庭經營的農場組成，他們從事大量的體力勞動。我們可以通過引入現代設備並提高每個農場的生產產出來改革整個農業部門。我們的整個國家都將從中受益！"
 GER_urbanization: "城市化"
 GER_urbanization_desc: "農業中現代機械的引入已經釋放了許多人力，這些人現在湧向城市尋找新的就業機會。這些人可以在我們的工廠中發揮作用，繼續使我們的經濟成為世界上最強大的經濟之一。"
 GER_wirtschaftswunder: "經濟奇蹟"
 GER_wirtschaftswunder_desc: "我們所有振興經濟的計劃和舉措終於取得了成效！世界各地的人們對我們的金融和工業復甦感到敬畏，稱之為“經濟奇蹟”。"
 GER_mass_production: "大規模生產"
 GER_mass_production_desc: "隨著我們最近在工業進步方面取得的成就，我們已經學到了很多關於生產方式的知識。我們應該將所有這些新發現的知識和理解應用於精簡我們的裝配線，並以前所未有的規模生產材料。"
 GER_build_defense_industry: "建設國防工業"
 GER_build_defense_industry_desc: "在終於能夠穩定甚至大幅增強我們的經濟之後，我們現在可以將注意力轉向保障我們國家的主權並建立一個適當的國防工業，保障德國人民的勤奮精神和對進步及卓越的追求。"
 GER_war_production: "戰時生產"
 GER_war_production_desc: "戰爭再次將我們捲入其中，但我們不會屈服，我們不會倒下！我們將動員我們的工業力量，去打到任何敢於認為他們可以壓垮德國人民堅不可摧的意志的敵人！"
 GER_construct_the_reichsautobahn: "建設[GetAutobahnName]"
 GER_autobahn_fascism: "國家高速公路"
 GER_autobahn_neutral: "帝國高速公路"
 GER_autobahn_democratic: "高速公路"
 GER_autobahn_communism: "人民高速公路"
 GER_construct_the_reichsautobahn_desc: "$GER_autobahn_desc$"
 GER_kdf_wagen_factories: "[GetKfdWagenNames]"
 GER_kdf_wagen_factories_fascist: "力量來自歡樂汽車廠"
 GER_kdf_wagen_factories_neutral: "威廉汽車廠"
 GER_kdf_wagen_factories_volkswagen: "大眾汽車廠"
 GER_kdf_wagen_factories_desc: "[GetKDFFactoriesText]"
 GER_kdf_wagen_factories_autarky_text: "$GER_kdf_wagen_desc$" #old loc
 GER_kdf_wagen_factories_economic_growth_text: "隨著新的[GetAutobahnName]建成，我們必須讓它們裝滿汽車。為了成為一個真正繁榮和現代化的經濟體，我們需要建設工廠來生產這些汽車，同時創造就業機會。"
 GER_expand_the_reichsautobahn_south: "擴建南部[GetAutobahnName]"
 GER_expand_the_reichsautobahn_south_desc: "向南擴建高速公路網絡將刺激該區域的經濟增長和發展。它還能快速向阿爾卑斯山運送部隊，加強我們的軍事能力。"
 GER_expand_the_reichsautobahn_south_tt: "如果§Y[ROOT.GetName]§!或德國的一個附屬國控制這些地區，在以下地區添加§G1§!點§Y$infrastructure$§!：§Y[53.GetName]§!、§Y[52.GetName]§!、§Y[152.GetName]§!、§Y[4.GetName]§!，並從§Y[53.GetName]§!到§Y[4.GetName]§!增設§Y1§!級鐵路。當前效果："
 GER_expand_the_reichsautobahn_east: "擴建東部[GetAutobahnName]"
 GER_expand_the_reichsautobahn_east_desc: "將高速公路網絡擴展到東普魯士將展示我們國家再次將最東部地區與[ROOT.GetNameDef]其餘部分連接和統一的決心。這也將使我們在需要時能夠更快、更猛烈地向東發動攻擊。"
 GER_expand_the_reichsautobahn_east_tt: "如果§Y[ROOT.GetName]§!或德國的一個附屬國控制這些地區，在以下地區添加§G1§!點§Y$infrastructure$§!：§Y[68.GetName]§!、§Y[63.GetName]§!、§Y[807.GetName]§!、§Y[85.GetName]§!，並從§Y[63.GetName]§!到§Y[85.GetName]§!增設§Y1§!級鐵路。當前效果："
 GER_develop_heraeus_facilities: "發展賀利氏研究設施"
 GER_develop_heraeus_facilities_desc: "投資新設施可以確保獲得現代軍事需求日益增長的貴金屬。這些專業材料對於電子設備和高質量武器裝備至關重要。"
 GER_build_the_rur_dam: "建造魯爾水壩"
 GER_build_the_rur_dam_desc: "修建魯爾大壩不僅僅是一項工程壯舉——它是對未來的投資。大壩不僅將促進該地區的經濟發展，還將助力我們的工業努力和生產產出。"
 GER_trade_deal_with_sweden: "與瑞典的貿易協議"
 GER_trade_deal_with_sweden_desc: "$GER_swedish_trade_agreement_desc$" #old loc
 GER_the_four_year_plan: "四年計劃"
 GER_the_four_year_plan_desc: "$GER_four_year_plan_desc$" #old loc
 GER_autarky_efforts: "自給自足的努力"
 GER_autarky_efforts_desc: "$GER_autarky_desc$" #old loc
 GER_gain_autarkic_economy_lock_free_trade_tt: "§R鎖定§!§Y$free_trade$§!和§Y$export_focus$§!。獲得§Y$autarkic_economy$§!。"
 GER_improve_trade_relations_tt: "提升與現有和未來的§Y陣營成員§!的§Y貿易影響力§!"
 GER_institute_price_controls: "實施價格控制"
 GER_institute_price_controls_desc: "我們必須實施各種措施來加強對財政的控制，以支撐我們實現自給自足的雄心壯志。我們必須能夠調節進口品、基本商品和工人工資的價格，以抑制通貨膨脹並確保經濟穩定。"
 GER_unlock_price_controls_decision_tt: "解鎖決議：§Y$GER_price_controls_cat$§!，可以降低§Y$MODIFIER_CONSUMER_GOODS_FACTOR$§!"
 GER_industrial_consumer_goods_factor_limit_tt: "§Y[GetIndustrialModifier]§!的$MODIFIER_CONSUMER_GOODS_FACTOR$§R低於§!§Y90%§!"
 GER_establish_the_reichswerke: "建立$GER_reichswerke$"
 GER_establish_the_reichswerke_desc: "$GER_hermann_goring_werke_desc$" #old loc
 GER_unlock_reichswerke_tt: "解鎖工業企業§Y$GER_reichswerke$§!"
 GER_seize_foreign_industries: "兼併外國工業"
 GER_seize_foreign_industries_desc: "通過將外國工業整合到我們的經濟中，我們確保了支持我們戰爭努力和生產的重要資源。"
 GER_coal_liquefaction: "煤液化"
 GER_coal_liquefaction_desc: "$GER_coal_liquidization_desc$" #old loc
 GER_subsidize_hoesch_benzin: "資助霍施-本欽公司"
 GER_subsidize_hoesch_benzin_desc: "曾經有句話說，軍隊靠胃部行軍，但現代軍隊依賴燃料。為了維持我們的軍事能力，我們必須加大合成燃料的生產力度。"
 GER_establish_buna_werke: "建立布納工廠"
 GER_establish_buna_werke_desc: "由於我們在德國本土沒有橡膠資源，而大規模的機械化和航空需要大量橡膠。為了減少對外貿的依賴，我們必須建立工廠生產合成橡膠。"
 GER_autarky_achieved: "實現自給自足"
 GER_autarky_achieved_desc: "我們終於實現了成為完全自給自足的雄心勃勃的目標！我們的國家已經充滿了豐富的自然資源，這將進一步增強我們的實力——使我們無堅不摧！"
 GER_improve_autarkic_economy_tt: "改善§Y$autarkic_economy$§!"
 GER_accelerate_the_rearmament_program: "加速軍備重整計劃"
 GER_accelerate_the_rearmament_program_desc: "我們必須打破《凡爾賽條約》的枷鎖，讓工業的鐵砧鍛造[ROOT.GetNameDef]的輝煌命運。每一輛生產的坦克，每一架組裝的飛機，都將成為德國人民不屈意志的見證。"
 GER_concentrated_armament_program: "集中軍備計劃"
 GER_concentrated_armament_program_desc: "我們的工業必須支持我們重新武裝國家的軍事需求。必須啟動一項全面的軍備重整計劃，迅速現代化和擴展我們的武裝力量！"
 GER_establish_production_targets: "設立生產指標"
 GER_establish_production_targets_desc: "在發動任何軍事行動之前，我們必須首先讓我們的武裝力量現代化並配備裝備。為了提高產量，我們必須實行限額，並設立雄心勃勃的生產指標。"
 GER_prioritize_the_army: "優先發展陸軍"
 GER_prioritize_the_army_desc: "德國及其前身普魯士一直是陸上強國，依靠陸軍維護我們的主權和安全。我們必須重新調整我們的工業重心，確保我們的陸軍裝備精良，能夠征服任何敵人。"
 GER_prioritize_the_navy: "優先發展海軍"
 GER_prioritize_the_navy_desc: "如果我們想擴張我們的疆域，控制海洋將至關重要。我們必須優先發展海軍，使其在規模和力量上能與任何敵方艦隊匹敵。"
 GER_extra_funds_to_waffenamt: "撥付額外資金給武器署"
 GER_extra_funds_to_waffenamt_desc: "武器署負責監督軍事裝備的設計和發展。它與武器製造商和研究機構合作，通過撥付額外資金，我們可能會加快進度。"
 GER_zentrale_planung: "成立中央計劃局"
 GER_zentrale_planung_desc: "戰爭暴露了我們軍備建設的不足，這是我們必須解決的問題！通過成立一個由政府、工業和軍方成員組成的中央規劃局，我們可以協調經濟政策，並有效地重新分配資源，以增強我們的武器生產，支持我們的國家目標和軍事霸權。"
 GER_criteria_for_economy_laws_tt: "啟用§Y$partial_economic_mobilisation$§!，將會在經濟法可用時更改為§Y$war_economy$§!。"
 GER_create_rustungsstab: "創建武裝部隊司令部"
 GER_create_rustungsstab_desc: "我們簡化武器製造的努力已經取得了成功，但還需要進一步改進！創建一個武裝部隊司令部將使我們能夠制定策略來分配資源和優先考慮項目，以增加我們的武器生產。"
 GER_armament_rationalization: "武器合理化"
 GER_armament_rationalization_desc: "我們的生產線幾乎跟不上我們武裝部隊的需求。我們必須實施武器合理化措施，提高我們的工業戰爭機器的效率和效果。"
 GER_totaler_krieg: "總體戰"
 GER_totaler_krieg_desc: "為了取得全面勝利，我們必須動員全社會，把全面戰爭帶到敵人家門口。[ROOT.GetNameDef]是時候起來了，讓風暴爆發吧！"
 GER_gain_totaler_krieg_remove_total_mob_tt: "§R移除§!§Y$tot_economic_mobilisation$§!。獲得§Y$totaler_krieg_economy$§!。"
 #ARMY
 GER_develop_modern_maneuver_warfare: "發展現代機動戰術"
 GER_develop_modern_maneuver_warfare_desc: "我們必須認識到現代戰爭的演變性質，並開發一種新的戰術，強調步兵與新技術的整合，以最大限度地提高我們在戰場上的軍事效能。"
 GER_fortify_the_vaterland: "加固祖國"
 GER_fortify_the_vaterland_desc: "為了確保[GER.GetNameDef]的安全，我們必須在需要的地方修建防禦工事。鞏固我們的防禦將使我們能夠用更少的人力守住邊界，從而騰出部隊參加其他潛在的進攻行動。"
 GER_fortify_the_vaterland_unlock_decision_tt: "解鎖決議：§Y$GER_fortify_the_vaterland_cat$§!"
 GER_all_terrain_military_motorcycle: "全地形軍用摩托車"
 GER_all_terrain_military_motorcycle_desc: "對於快速偵查再重視也不為過。投資摩托車部隊將提供關鍵的戰場情報，協助做出戰略決策，提高作戰效率。"
 GER_salvage_captured_equipment: "回收利用戰俘裝備"
 GER_salvage_captured_equipment_desc: "通過建立設施，為我們的軍隊回收和重新利用繳獲的敵人裝備，我們可以翻新並整合戰俘武器、車輛和機械，以增強我們的武裝力量。"
 GER_salvage_captured_equipment_custom_tt: "隨機兩名[ROOT.GetAdjective]將官會獲得§Y清揀繳獲大師§!特質。"
 GER_unlock_operational_planning_blitzkrieg_tt: "解鎖決議：§Y$GER_operational_planning_category$§!，激活後會提供§Y45天§!："
 GER_unlock_operational_planning_bewegungskrieg_tt: "解鎖決議：§Y$GER_operational_planning_category$§!，激活後會提供§Y90天§!："
 GER_the_prussian_legacy: "普魯士的遺產"
 GER_the_prussian_legacy_desc: "伏爾泰曾經說過：“有些國家擁有一支軍隊，而普魯士軍隊擁有一個國家。”我們將通過發展古老的德國的運動戰學說來體現這一點，以確保在戰場上迅速而壓倒性的勝利。"
 GER_improve_motorized_troops: "改進摩托化部隊"
 GER_improve_motorized_troops_desc: "現代戰爭圍繞速度和快速進攻能力展開。我們必須確保我們的機械化部隊隨時準備領導衝鋒，並取得快速決定性的勝利。"
 GER_lessons_of_the_great_war: "大戰的歷史教訓"
 GER_lessons_of_the_great_war_desc: "我們在那次世界大戰中的失敗提供了對未來衝突至關重要的寶貴見解。我們已經非常詳細地研究了過去，現在我們必須落實歷史教給我們的教訓。"
 GER_stormtroopers: "衝鋒隊"
 GER_stormtroopers_desc: "那次世界大戰中的風暴突擊隊是精銳突擊部隊，旨在領導突擊敵人的戰壕，以便創造主力步兵能夠利用的突破口。我們應該復興這一理念，訓練新的精銳突擊部隊，使其在戰場上體現速度、敏捷和無情的效率。"
 GER_sturmtruppe_battalion_tt: "解鎖支援營§Y$sturmtruppe_battalion$§!。"
 GER_artillery_bombardment: "火炮轟擊"
 GER_artillery_bombardment_desc: "步兵是我軍的中堅力量，要使他們發揮優勢，就需要適當的支援。我們必須大力投資於炮兵，以便我們的步兵能夠利用任何優勢並擊敗任何敵人。"
 GER_instill_auftragstaktik: "灌輸任務戰術"
 GER_instill_auftragstaktik_desc: "我們的軍隊長期實行任務戰術，或稱為任務指揮，強調去中心化指揮和個人主動性。這增強了我們的靈活性和自主性，提高了我們在不可預見情況下的適應能力和成功率。繼續實行這種做法對於我們的部隊常勝是至關重要的！"
 GER_establish_the_afrikakorps: "組建非洲軍團"
 GER_establish_the_afrikakorps_desc: "為了能破壞我們敵人的補給線，獲取重要資源和戰略地位，我們必須將戰爭帶出歐洲，帶到外國海岸！"
 GER_unlock_operational_planning_in_africa_tt: "解鎖決議：§Y非洲行動計劃§!"
 GER_revive_the_schutztruppe: "重振防衛軍"
 GER_revive_the_schutztruppe_desc: "防衛軍是我們往殖民帝國非洲領土派駐的殖民部隊。他們在那次世界大戰的東非戰役以及早期的小規模衝突中表現出色。鑑於我們再次將戰略重心轉移至非洲和亞洲，現在或許是時候重新設立殖民地機構，並考慮建立新改良的防衛軍。"
 GER_revive_the_schutztruppe_tt: "解鎖§Y防衛軍§!殖民民兵和§Y招募§!並§Y改進§!他們的決議"
 GER_establish_the_skijager: "建立滑雪獵兵部隊"
 GER_establish_the_skijager_desc: "為確保我們的武裝力量在所有天氣條件下保持效能和適應性，我們必須掌握冬季戰爭的藝術。為此，我們將訓練和裝備專門的山地部隊，稱為滑雪獵兵，使其能夠在多雪和山區地形中有效作戰。"
 GER_panzergrenadier: "裝甲擲彈兵"
 GER_panzergrenadier_desc: "我們的軍事學說依賴於機動性，並將取決於我們的摩托化部隊表現如何。沒有適當的支援，步兵或裝甲部隊將無法成功推進。通過將摩托化步兵與我們的突擊部隊整合，我們確保我們的部隊在進攻行動中保持優勢。"
 GER_modify_bewegungskrieg_or_blitzkrieg_tt: "§Y$GER_blitzkrieg_modifier$§!或§Y$GER_bewegungskrieg_modifier$§!追加效果："
 GER_heavy_armored_car_recon_company_tt: "\n§Y$armored_car_recon$§!：\n§Y裝甲厚度§!：§G+5%§!\n§Y森林§!：\n 移動修正改變：§G+5%§!\n§Y沙漠§!：\n 移動修正改變：§G+10%§!\n§Y平原§!：\n 移動修正改變：§G+10%§!\n"
 GER_nationalize_ford_factories: "國有化福特工廠"
 GER_nationalize_ford_factories_desc: "奪取[51.GetName]的福特工廠的控制權並將其置於國家控制之下，將加強我們的工業產能，並確保重要設備和車輛的穩定供應，支持我們的武裝部隊和後勤。"
 GER_kriegslokomotiven: "戰爭機車"
 GER_kriegslokomotiven_desc: "戰爭的物流挑戰要求生產戰爭機車。這些火車將針對我們的經濟環境和對快速、廉價大規模生產的需求進行定製。"
 GER_improve_the_logistics_system: "完善物流體系"
 GER_improve_the_logistics_system_desc: "我們高級指揮部的許多將軍對物流和供應鏈持輕視態度，因對當前系統的問題理解不足。我們開始全面提升物流系統的計劃的同時，必須讓他們意識到現代戰爭中高效物流的極端重要性。"
 GER_defend_the_vaterland: "保衛祖國"
 GER_defend_the_vaterland_desc: "面對國境線上迫近的威脅，我們必須堅定地保衛祖國！為了保護德國人民，我們必須加固陣地並召集我們的部隊——[ROOT.GetNameDef]將堅持並取得勝利！"
 GER_uranverein: "鈾俱樂部"
 GER_uranverein_desc: "我們的國家必須在原子能研究方面走在前列，併為我們自己利用這一潛力。我們擁有一些地球上最聰明的頭腦去追求這一目標，成為世界的毀滅者。"
 GER_adopt_new_panzer_doctrine: "採納新的裝甲作戰學說"
 GER_adopt_new_panzer_doctrine_desc: "$GER_army_innovation_desc$" #old loc
 GER_panzer_troops_school: "裝甲部隊學校"
 GER_panzer_troops_school_desc: "裝甲師將在任何現代衝突中發揮關鍵作用，我們必須確保我們的裝甲部隊處於軍事創新的前沿。通過嚴格的訓練和專家指導，我們將培養出勝利所需的精銳裝甲部隊。"
 GER_advanced_panzer_research: "先進坦克研究"
 GER_advanced_panzer_research_desc: "將資源投入到研究和開發尖端坦克技術將帶來新的見解和突破性成果。這將增強我們的戰鬥能力，使我們的裝甲戰車更加致命。"
 GER_expand_kummersdorfs_capacity: "擴大庫默斯多夫的產能"
 GER_expand_kummersdorfs_capacity_desc: "我們必須引領裝甲戰車的發展並推動創新，以確保我們在戰場上的主導地位。通過在庫默斯多夫的設施研究敵方坦克設計並利用尖端技術，我們將開創超越所有競爭對手的先進技術。"
 GER_combined_arms: "聯合兵種"
 GER_combined_arms_desc: "科技的快速發展改變了戰爭的方式，這是我們應該利用的。我們將堅持兵種並舉的原則，制定步兵、裝甲和空中支援同步化的綜合戰略，打造一支強大的戰鬥力量，確保其至高無上的地位。"
 #LUFTWAFFE
 GER_expanding_the_luftwaffe: "擴張空軍"
 GER_expanding_the_luftwaffe_desc: "$air_innovation_desc$" #old loc
 GER_aeronautical_research_institute: "航空研究所"
 GER_aeronautical_research_institute_desc: "自從大戰以來，空戰的重要性和複雜性不斷增長，而由於凡爾賽條約禁止我們組建空軍，我們在飛機發展上一直落後。為了解決這個問題，我們必須建立航空研究所，開發創新的機身、引擎和武器，以確保空中優勢。"
 GER_dive_bombers: "俯衝轟炸機"
 GER_dive_bombers_desc: "$GER_tactical_air_effort_desc$" #old loc
 GER_tactical_bombers: "戰術轟炸機"
 GER_tactical_bombers_desc: "$GER_strategic_air_effort_desc$將我們國界以外的每個工廠夷為平地，確保只有我們能夠部署有效的軍事力量。" #Old and new loc
 GER_uralbomber_program: "烏拉爾轟炸機計劃"
 GER_uralbomber_program_desc: "一旦我們能夠開發出能飛往烏拉爾山脈的飛機，幾乎任何潛在的敵人都將在我們的攻擊範圍之內，從而實現勝利。"
 GER_aerodynamic_research_institute: "空氣動力研究所"
 GER_aerodynamic_research_institute_desc: "因為我們在空軍上投入了大量資源，[ROOT.GetNameDefCap]最近已成為航空創新的代名詞。為了在競爭中保持領先地位，我們必須繼續在該領域投入資源。資助了空氣動力學研究所及其新型推進科技的研發，無疑會在我們追求成為天空霸主的過程中帶來新的創新。"
 GER_aerodynamic_research_institute_tt: "為所有§Y飛機設計§!解鎖軍工機構特質§Y$GER_mio_trait_aerodynamic_research_insitute$§!。§R然而它只能應用於其中之一§!。"
 GER_fallschirmjager: "傘兵"
 GER_fallschirmjager_desc: "我們並未忽視空降部隊的戰略重要性。訓練這些精英傘兵在敵後快速部署，將增強他們的多功能性和戰鬥力，從而增強我們的整體進攻能力。"
 GER_unlocks_eben_emael_raid_tt: "解鎖對§Y埃本·埃馬爾堡壘§!的§Y空降兵突襲§!"
 GER_form_the_jagdwaffe: "組建戰鬥機部隊"
 GER_form_the_jagdwaffe_desc: "我們應該組建一支專門的戰鬥機部隊，以確保制空權。結合嚴格的訓練、先進的戰術和尖端的科技，我們將主宰天空，讓我們的地面部隊如雷霆般碾過戰場。"
 GER_reorganize_the_luftwaffe: "改組空軍"
 GER_reorganize_the_luftwaffe_desc: "儘管我們的空軍成立只有幾年時間，但它已成為國家力量的一項強大工具。然而，其快速形成和迅猛擴張留下了組織中的一些結構性缺陷。增加更多職責，並抑制競爭性和內部權力鬥爭，將使我們的空軍能夠實現更高的作戰效率和效果。"
 GER_solve_the_logistical_bottlenecks: "解決後勤瓶頸"
 GER_solve_the_logistical_bottlenecks_desc: "空軍重組完成後，我們可以將注意力轉向效率低下的後勤系統和供應鏈。簡化這些問題將解放更多人進行其他活動，並將加快我們飛機的修理速度。"
 GER_experimental_rotorcrafts: "實驗性旋翼機"
 GER_experimental_rotorcrafts_desc: "通過投資尖端設計並開發新技術，我們力求開發早期原型機，以徹底改變戰場上的空中機動現狀。我們力圖通過所謂的直升機高效轉變垂直起降的能力。"
 GER_develop_the_knickebein: "研發曲腿導航系統"
 GER_develop_the_knickebein_desc: "通過使用複雜的無線電導航系統，我們找到了一種方法來引導我們的飛機進行更精確的精確轟炸。通過利用這些新技術，我們可能有能力在夜間更有效地將敵人的工廠夷為平地。"
 GER_defense_of_the_reich: "保衛[GetDefenseofGermanyName]"
 GER_defense_of_the_reich_fascism: "帝國"
 GER_defense_of_the_reich_neutral: "帝國"
 GER_defense_of_the_reich_democratic: "[GER.GetName]"
 GER_defense_of_the_reich_communism: "無產階級革命"
 GER_defense_of_the_reich_desc: "我們必須保護祖國不受敵人空襲的侵害。保護[ROOT.GetNameDef]上空的安全並保衛地面工業必須優先於一切！"
 GER_construct_the_kammhuber_line: "建造卡姆胡伯防線"
 GER_construct_the_kammhuber_line_desc: "我們不能允許敵方轟炸機和戰鬥機在[ROOT.GetNameDef]上空自由活動。我們必須在法國海岸線建立一條防線，以便在他們抵達我們的核心地帶之前攔截他們。"
 GER_controls_atlantic_coast_brittany_finnmark_tt: "§Y[ROOT.GetName]§!或德國附屬國完全控制非德國沿§Y大西洋海岸§!的地區，從§Y[14.GetName]§!到§Y[925.GetName]§!。"
 GER_controls_atlantic_coast_brittany_finnmark_effects_tt: "沿著§Y歐洲大西洋海岸§!的每個受控地區：增加 §G1§!§Y$anti_air_building$§!。當前效果："
 GER_establish_night_fighter_squadrons: "建立夜間戰鬥機中隊"
 GER_establish_night_fighter_squadrons_desc: "作為我們保衛祖國的下一步行動，我們應該創建夜間戰鬥機中隊（Nachtjagdgeschwader）。使用機載雷達將使它們在白天和夜晚都能有效地保持我們的天空不受敵人侵擾。"
 GER_torpedobomber: "魚雷轟炸機"
 GER_torpedobomber_desc: "$naval_air_effort_desc$" #old loc
 GER_establish_carrier_groups: "建立航母戰鬥群"
 GER_establish_carrier_groups_desc: "為了建立一支無與倫比的航母艦隊，我們必須訓練我們的飛行員在這些甲板上起降。我們的飛機將統治海洋和陸地的天空！"
 GER_rocketry_innovations: "火箭創新"
 GER_rocketry_innovations_desc: "航空發展中的下一個重大飛躍已在我們掌握之中！我們的工程師們孜孜不倦地致力於完善火箭推進技術，這可能在我們成為天空霸主的追求中發揮重大影響和用途。"
 GER_amerikabomber: "亞美利加轟炸機"
 GER_amerikabomber_desc: "我們必須全力以赴，實現掌控天空的雄心壯志，並創造一種遠程飛機，能夠通過打擊敵方領土深處的目標或穿越大西洋，向所有人表明，在我們的打擊範圍內沒有人是安全的。"
 GER_war_with_american_country_tt: "與一個§Y美洲§!國家交戰"
 GER_unlocks_statue_of_liberty_raid_tt: "與§Y[USA.GetNameWithFlag]§!交戰時，解鎖對§Y自由女神像§!的§Y空襲§!"
 #KRIEGSMARINE
 GER_strengthen_the_kriegsmarine: "加強[GetStrengthenKriegsmarineName]"
 GER_strengthen_kriegsmarine_fascism: "德國海軍"
 GER_strengthen_kriegsmarine_neutrality: "帝國海軍"
 GER_strengthen_kriegsmarine_democratic: "德國海軍部隊"
 GER_strengthen_kriegsmarine_communism: "人民海軍"
 GER_strengthen_the_kriegsmarine_desc: "$GER_naval_rearmament_desc$" #old loc
 GER_expand_kriegsmarinewerft: "擴建[GetKriegsmarinewerftName]"
 GER_expand_kriegsmarinewerft_fascism: "海軍造船廠"
 GER_expand_kriegsmarinewerft_neutrality: "帝國海軍造船廠"
 GER_expand_kriegsmarinewerft_democratic: "海軍造船廠"
 GER_expand_kriegsmarinewerft_communism: "人民海軍造船廠"
 GER_expand_kriegsmarinewerft_desc: "我們必須加倍努力建造一支能夠與敵人抗衡的海軍。通過部署最先進的造船技術並建造尖端戰艦，我們一定能從敵人手中奪回制海權。"
 GER_construct_aircraft_carriers: "建造航空母艦"
 GER_construct_aircraft_carriers_desc: "任何一個值得尊重的現代海軍都必須擁有航空母艦。這些船隻將越來越重要，以主宰海洋，因此為了不落後於我們的敵人，我們必須啟動一項雄心勃勃的航母建造計劃。"
 GER_carrier_variants_tt: "根據§Y$early_ship_hull_carrier$§!、§Y$basic_ship_hull_carrier$§!或§Y$ship_hull_carrier_2$§!技術，製造航母§Y衍生型號§!和§Y生產線§!。當前效果：\n"
 GER_grosskampfschiff_construction: "大型戰艦建造"
 GER_grosskampfschiff_construction_desc: "$GER_pride_of_the_modern_germany_desc$" #old loc
 GER_high_seas_fleet: "公海艦隊"
 GER_high_seas_fleet_desc: "我們的雄心壯志不應小於使[ROOT.GetNameDef]成為一個真正的全球列強。為此，我們需要復興高海艦隊，這支艦隊曾幾乎與英國皇家海軍在海洋上的統治地位相匹敵。"
 GER_unlock_trade_interdiction_tt: "解鎖§Y$GER_trade_interdiction$§!國策。"
 GER_re_establish_the_seekriegsleitung: "重建海軍戰爭指揮部"
 GER_re_establish_the_seekriegsleitung_desc: "重建海軍戰爭指揮部將使海軍命令和直接部署的規劃和實施變得高效。"
 GER_marinestosstrupp: "組建海軍突擊隊"
 GER_marinestosstrupp_desc: "如果我們希望建立海外影響力，我們需要組建一支海軍陸戰隊，即“海軍突擊隊”，這支部隊能夠進行大膽的海上入侵和突破敵人的沿海防禦。"
 GER_atlantic_naval_bases: "大西洋海軍基地"
 GER_atlantic_naval_bases_desc: "考慮到大西洋沿岸地區的戰略重要性，作為我們在大西洋上確立主導地位努力的一部分，我們必須優先擴展和現代化海軍基地，以實現海上優勢。"
 GER_naval_bases_along_atlantic_coast_tt: "§Y歐洲大西洋海岸§!的每一個§Y[ROOT.GetName]§!或德國附屬國控制的地區都有一座§Y$naval_base$§!：增加§G1§!§Y$naval_base$§!。增加§G1§!§Y$coastal_bunker$§!。當前效果："
 GER_atlantic_naval_dominance: "大西洋海軍的主導地位"
 GER_atlantic_naval_dominance_desc: "為了確保我們在大西洋的主導地位，我們需要進一步擴大我們的作戰範圍，從海岸到海岸擴張我們的海軍存在。"
 GER_controls_an_atantic_island_tt: "§Y[ROOT.GetName]§!或德國附屬國完全控制北大西洋的一座島嶼"
 GER_naval_bases_on_atlantic_islands_tt: "每一個§Y[ROOT.GetName]§!或德國附屬國在§Y北大西洋§!控制的帶有§Y$naval_base$§!的島嶼：增加§G1§!§Y$naval_base$§!。增加§G1§!§Y$coastal_bunker$§!。當前效果："
 GER_trade_interdiction: "貿易封鎖"
 GER_trade_interdiction_desc: "為了破壞敵人的補給線，削弱他們的作戰能力，我們必須採取貿易封鎖戰略，以削弱他們發動戰爭的能力。通過在海上部署我們的水面艦隊和U型潛艇，我們將阻止重要資源和商船的運輸，迫使敵人屈服。"
 GER_cruiser_warfare: "巡洋艦戰法"
 GER_cruiser_warfare_desc: "我們的輕型巡洋艦不應僅僅被限制於護航任務；我們必須將它們派往公海，中斷敵人的商運船隊並削弱他們的工業能力。"
 GER_panzerschiff_raiders: "裝甲突擊艦"
 GER_panzerschiff_raiders_desc: "我們應當在我們的貿易阻斷策略中利用我們的重型船隻。這些艦船可以猛擊敵軍，並在敵軍的主力艦隊有機會出港前就撤離。"
 GER_wolfpack_tactics: "狼群戰術"
 GER_wolfpack_tactics_desc: "在大戰期間使用潛艇攻擊商船隊的策略並不新鮮，但已經提出了一種新的戰術。這種新方法將看到我們的潛艇在一個狼群中合作，找到並擊沉商船。這可能是剝奪敵人原材料和繼續戰爭能力的關鍵。"
 GER_u_boat_efforts: "U型潛艇攻勢"
 GER_u_boat_efforts_desc: "狼群戰術的成功已經讓海軍高級指揮部深信不疑，加倍採取這種方法，專注於建造更多更好的U型潛艇，以確保我們在公海上的勝利。"
 GER_unrestricted_convoy_raiding: "無限制護航襲擊"
 GER_unrestricted_convoy_raiding_desc: "我們必須將護航艦隊襲擊的效率提高一倍，將我們的計劃中的努力提高三倍，以將海洋完全置於我們的控制之下！"
 GER_unlock_plan_z_tt: "解鎖§Y$GER_plan_z$§!國策。"
 GER_with_panzerschiff_completed_tt: "§Y$GER_panzerschiff_raiders$§!完成後："
 GER_with_u_boat_efforts_completed_tt: "§Y$GER_u_boat_efforts$§!完成後："
 GER_seeherrschaft: "海上霸權"
 GER_seeherrschaft_desc: "我們正順利成為無可爭議的海洋霸主，實現我們的海上霸權願景。現在[ROOT.GetNameDef]統治著波濤！"
 GER_remilitarize_the_rhineland: "萊茵蘭重新軍事化"
 GER_remilitarize_the_rhineland_desc: "$GER_rhineland_desc$"
 GER_legion_condor: "禿鷹軍團"
 GER_legion_condor_desc: "隨著內戰在伊比利亞半島愈演愈烈，給我們帶來了絕佳的機會。只要儘可能多地派遣志願兵，我們不僅可以確保正確的一方獲勝，還可以讓我們的部隊獲得實戰經驗，並將那些與我們理想一致的[SPR.GetAdjective]人更緊密地聯繫在一起。"
 GER_reorganize_secret_services: "改組情報機關"
 GER_reorganize_secret_services_desc: "$GER_wilhelm_canaris$的表現效率低下，甚至如果謠言屬實，他對現政府的不忠誠已成事實。我們需要將他撤職，並重組阿勃維爾情報機構，使其成為一個更加勝任的機構。"
 GER_fuhrerprinzip: "元首原則"
 GER_fuhrerprinzip_desc: "元首期望最親近的人對他保持絕對忠誠，但那些受到他信任的人必須記住，他們的價值不超過他們所站的石頭。任何一次越軌或未能按照元首的意願行事都可能帶來嚴重後果。只有元首才能為我們指明方向。"
 GER_party_chancellor_hess: "黨魁赫斯"
 GER_party_chancellor_hess_desc: "魯道夫·赫斯長期以來一直是該黨的積極成員。他得到了幾位政界精英成員的信任，包括元首本人。理所當然地，他應該被任命為黨的黨魁。"
 GER_party_chancellor_bormann: "黨魁鮑曼"
 GER_party_chancellor_bormann_desc: "馬丁·鮑曼在擔任副元首私人秘書期間表現得非常出色。他還因之前擔任國家社會主義德意志工人黨輔助基金的負責人而具有相當廣泛的財務知識，他將成為黨的理想黨魁。"
 GER_mega_reichskommissariats: "巨型專員轄區"
 GER_mega_reichskommissariats_desc: "看起來建立專員轄區已經被證明是一項有效的措施，毫無疑問，我們的領導人[ROOT.GetLeader]花了很多時間考慮作進一步改進。例如，專員轄區的一個問題是其數量不斷增加，隨之而來的管理需求也在增加。顯然，我們可以將其中的有一些轄區合併……"
 GER_optimize_reich_labour_service: "優化國家勞役"
 GER_optimize_reich_labour_service_desc: "國家勞役團在保持人口就業方面起到了重要作用，但我們認為它可以發揮更多作用。我們可以善用國家勞役團，以確保在勞動、宣傳和戰爭準備的各個方面最大限度地發揮他們的作用。"
 GER_ascension_of_himmler: "$GER_inner_circle_member_title$希姆萊"
 GER_ascension_of_himmler_desc: "在海因裡希·希姆萊的組織和領導下，黨衛軍已經從最初的小規模成長為我們國家內十分顯著的力量。提拔他將使我們能夠進一步利用他的才能，並更好地利用現有的黨衛軍。"
 GER_expand_ss_recruitment: "擴大黨衛軍招募"
 GER_expand_ss_recruitment_desc: "加入黨衛軍的要求非常嚴格，這個過程被形容為通過針眼。雖然要求必須保持高標準以確保優質部隊，但可以通過其他方式擴招，同時不降低我們的標準。"
 GER_create_four_militia_units_tt: "創建§Y4支德國民兵§!單位"
 GER_create_two_motorized_units_tt: "創建§Y2支德國摩托化§!單位"
 GER_SS_recruitment_tt: "解鎖決議：§Y$SS_recruitment$§!"
 GER_strengthen_the_waffen_ss: "加強武裝黨衛軍"
 GER_strengthen_the_waffen_ss_desc: "武裝黨衛軍，黨衛軍的戰鬥分支，在戰鬥中證明了其寶貴的價值。儘管技術上是一個準軍事部門，但我們堅信如果給予更多資源，他們可以與我們的正規軍一樣有效地作戰。"
 GER_create_two_militia_units_tt: "創建§Y2支德國民兵§!單位"
 GER_create_one_motorized_units_tt: "創建§Y1支德國摩托化§!單位"
 GER_create_two_light_panzer_units_tt: "創建§Y2支德國輕型裝甲§!單位"
 GER_create_two_medium_panzer_units_tt: "創建§Y2支德國中型裝甲§!單位"
 GER_expand_ss_security_duties: "擴大黨衛軍的安全職責"
 GER_expand_ss_security_duties_desc: "在海因裡希·希姆萊的指導下，黨衛軍穩步發展，現在是時候讓他們承擔更大的安全責任了。通過擴大他們的職責，我們可以釋放出資源用於其他地方。"
 GER_hegemony_of_the_ss: "黨衛軍霸權"
 GER_hegemony_of_the_ss_desc: "隨著招募擴大和裝備改進，黨衛軍現在是一支在戰場上非常強大的力量。在希姆萊的領導下，這個組織已經成長為我們最重要的資產之一，表現超出我們的預期。決定賦予他們現行權力是明智的，未來我們必須繼續提供他們成功所需的手段。"
 GER_expand_gestapo: "擴張蓋世太保"
 GER_expand_gestapo_desc: "在處理政治反對派和其他麻煩製造者方面，蓋世太保表現得非常出色。該機構的擴張使我們可以確保我們的人民按照當前的法律和我們的期望行事。"
 GER_absorb_the_abwehr: "將阿勃維爾併入"
 GER_absorb_the_abwehr_desc: "將阿勃維爾與軍隊指揮部分開是當時的明智決定。鑑於當前形勢，或許相反的做法現在更為適合。我們應該考慮合併阿勃維爾。"
 GER_innovative_warfare: "創新戰爭"
 GER_innovative_warfare_desc: "我們的作戰方法必須不斷發展，否則就有停滯不前的危險。只有不斷地進化和改變，我們才能不讓敵人識破我們的戰術和技術。"
 GER_form_organization_todt: "成立托特組織"
 GER_form_organization_todt_desc: "儘管元首希望看到幾個大型建設項目完成，但大多數項目將不得不等待。最緊迫的是[ROOT.GetNameDef]急需更多的軍事工業。在弗裡茨·托德手中進行規劃，我們相信結果會很不錯。"
 GER_employ_philipp_holzmann: "僱用菲利普·霍爾茨曼"
 GER_employ_philipp_holzmann_desc: "阿爾伯特·施佩爾提出了僱傭菲利普·霍爾茨曼股份公司來進行元首希望進行的幾個大型建設項目的想法。該公司有著良好的聲譽和悠久的歷史，曾建造過如漢堡市政廳和原國會大廈等建築傑作。他們將非常符合我們的需求！"
 GER_prioritize_the_four_year_plan: "四年計劃優先"
 GER_prioritize_the_four_year_plan_desc: "我們從一開始就知道[ROOT.GetLeader]的四年計劃是為戰爭做好準備的必要步驟。由於元首本人非常忙碌，需要有人監督和協調所需措施。"
 GER_plenipotentiary_of_the_four_year_plan: "四年計劃的全權代表"
 GER_plenipotentiary_of_the_four_year_plan_desc: "很明顯，監督並有效執行四年計劃的工作比最初想像的要複雜得多。通過任命赫爾曼·戈林為帝國全權代表，我們將大量權力授予一個人，但鑑於他的卓越成果，元首對此很有信心。赫爾曼·戈林對我們來說太有用了，不允許他在這方面擁有全面的外交權利是不明智的。"
 GER_autonomous_organization_todt: "托特組織自治"
 GER_autonomous_organization_todt_desc: "弗裡茨·托特的倡議——托特組織，已經證明非常有效。建設項目快速完成，甚至連元首本人也感到滿意。托特組織作為德國軍備和戰爭的帝國全權代表，將成為我國的真正資產。"
 GER_plenipotentiary_of_armaments: "軍備全權代表"
 GER_plenipotentiary_of_armaments_desc: "越來越明顯的是，需要有人承擔起為國防軍提供所需物資的全面責任。阿爾伯特·施佩爾在為國防軍提供物資方面展示出了最有前景的成果。賦予他戰爭生產的帝國全權代表地位，這個人將能夠取得奇蹟般的好成績！"
 GER_integration_of_puppet_economies: "整合傀儡國經濟"
 GER_integration_of_puppet_economies_desc: "當我們觀察我們的臣民時，就會清楚地看到他們管理經濟是多麼糟糕。當然，這主要影響到他們，但間接上也在拖累我們的經濟。元首要求立即解決這個問題！"
 GER_ministry_of_public_enlightenment: "公共啟蒙部"
 GER_ministry_of_public_enlightenment_desc: "宣傳部在最近的時期裡為我們做出了巨大的貢獻。通過將宣傳部重新命名為公眾啟蒙部，我們既可以擴大其職責，又可以在不引起擔憂的情況下增加經費。"
 GER_fund_the_film_department: "資助電影部門"
 GER_fund_the_film_department_desc: "電影已被證明是一種激勵和引導人民的強大工具。通過製作和推廣愛國電影，我們將激勵整個國家全身心地投入到我們光榮的[ROOT.GetName]事業中！"
 GER_the_triumphant_will: "勝利的意志"
 GER_the_triumphant_will_desc: "$GER_improve_national_spirit_desc$"
 GER_propaganda_master: "宣傳大師"
 GER_propaganda_master_desc: "任命約瑟夫·戈培爾為我們的宣傳部長時，我們毫不猶豫。他已經是一位傑出的演講者和作家。現在他提出了改進我們情報組織的想法，我們完全相信，實施這些想法符合我們的最佳利益。"
 GER_bribe_senior_officers: "賄賂高級官員"
 GER_bribe_senior_officers_desc: "為了確保高級軍官對元首的忠誠，我們應該考慮獎勵忠誠和服從。通過提供金錢、土地和稅收豁免，我們不僅可以確保他們保持忠誠，還可以確保他們守規矩，不會質疑元首的決定。"
 GER_army_indoctrination: "軍隊教育"
 GER_army_indoctrination_desc: "賄賂和金錢激勵對高級軍官和國防軍中的某些個人非常有效。然而，對於普通士兵，我們不能依賴賄賂，否則我們的經濟將陷入崩潰。通過宣傳手段對他們進行灌輸，使他們完全認同我們的決定，可能是更明智的做法。"
 GER_autonomy_in_the_kriegsschulen: "軍校自治"
 GER_autonomy_in_the_kriegsschulen_desc: "戰爭學院在我國有著悠久的傳統。儘管管理和定製學院提供的每一項教育內容很有誘惑力，但我們允許並授權學校自己為我們未來的軍官提供最好的培訓可能會更好。"
 GER_strafbataillon: "懲戒營"
 GER_strafbataillon_desc: "在制定了對軍隊進行思想灌輸的措施之後，我們現在可以在更多方面利用它，而不僅僅是使我們的士兵忠於我們。通過部署懲戒營，我們可以通過灌輸和讓他們為祖國服務來培養這些人的民族主義情感！"
 GER_expand_the_truppenschulen: "擴建軍校"
 GER_expand_the_truppenschulen_desc: "為了跟上對專業軍官日益增長的需求，我們的軍校分支需要大幅擴張。為我們的軍官候選人提供最好的培訓將確保我們在戰場上的成功。"
 GER_demonstration_of_military_achievements: "軍事成果展示"
 GER_demonstration_of_military_achievements_desc: "我們的歷史充滿了偉大的軍事成就。通過承認我們的部隊目前取得的成就將是這些偉大的軍事成就中的另一項，我們可以提高士氣，進一步增加他們對我們的忠誠。"
 GER_demonstration_of_military_achievements_trigger: "必須滿足以下條件之一：\n   擁有超過§Y2§!個附屬國\n   在§Y歐洲§!擁有超過§Y19§!個被佔領地區" #TODO_Danne make these numbers into a variable!
 GER_country_leader_change_blocks_progress_demonstration_military_achievement_tt: "§R在完成§Y$GER_demonstration_of_military_achievements$§!後更換國家領導人將阻礙完成§Y$GER_an_invincible_army$§!和§Y$GER_the_supreme_leader$§!§!"
 GER_an_invincible_army: "不可戰勝的德國軍隊"
 GER_an_invincible_army_desc: "我們的軍隊在戰場上取得了眾多成就和勝利，經由此我們向世界證明，不管敵人的煽動者怎麼說，[ROOT.GetAdjective]軍隊確實是無敵的！"
 GER_country_leader_change_blocks_progress_invincible_army_tt: "§R在完成§Y$GER_an_invincible_army$§!後更換國家領導人將阻礙完成§Y$GER_the_supreme_leader$§!§!"
 GER_an_invincible_army_trigger: "必須滿足以下條件之一：\n   擁有超過§Y5§!個附屬國\n   在§Y歐洲§!擁有超過§Y49§!個被佔領地區"
 GER_the_supreme_leader_trigger: "[ROOT.GetNameDefCap]已經使§Y2個主要國家§!§Y投降§!"
 GER_the_supreme_leader: "最高領袖"
 GER_the_supreme_leader_desc: "通過有針對性的改革和振興計劃，國防軍對[ROOT.GetLeader]及其事業的忠誠達到了新的高度。這種對我們領導人和祖國的全力支持趨勢必須繼續下去。"
 GER_a_strong_successor: "強大的繼承者"
 GER_a_strong_successor_desc: "換崗之時已經到來，一位新元首必須登基。我們有機會任命一位反映我們[ROOT.GetNameDef]抱負的新領袖。這一轉變將重振我們的努力，為德國人民帶來更光明的未來。"
 GER_loyalty_to_the_fuhrer: "忠於元首"
 GER_loyalty_to_the_fuhrer_desc: "根據1934年的全民公投，總統和總理的角色合併了，我們意識到希特勒在我國人民中的支持度極高。我們沒有看到政治格局發生變化的任何跡象，因此我們將繼續支持元首。"
 GER_heed_von_neuraths_concerns: "聽從馮·紐賴特"
 GER_heed_von_neuraths_concerns_desc: "我們的一些高級軍事人員，以康斯坦丁·馮·紐賴特為首，對當前的軍事戰術和政策提出了擔憂。他們認為元首過於激進的軍事計劃是站不住腳的，如果我們追求這些計劃，可能引發全面戰爭，我們的軍隊還不夠強大。"
 GER_reorganize_the_wehrmacht: "改組國防軍"
 GER_reorganize_the_wehrmacht_desc: "為了能夠執行元首的宏偉計劃，必須在國防軍內部進行大規模的重組。當前許多領導人將時間花在發表無關痛癢和毫無根據的擔憂上，而不是執行元首的命令。只有清除這些人，我們的目標才能實現！"
 GER_anschluss: "德奧合併"
 GER_anschluss_desc: "儘管[AUS.GetAdjective]的政客們言之鑿鑿，但顯然大部分說[GER.GetAdjective]語言的[AUS.GetNameDef]人口渴望與祖國重新統一。我們應該向腐敗的[AUS.GetLeader]領導人施加壓力，要求其辭職，讓人民的意願得以實現。"
 GER_anschluss_army_trigger_tt: "僅計算裝備齊全的部隊，§Y[ROOT.GetAdjective]§!軍隊規模至少是§Y[AUS.GetAdjective]§!軍隊的§Y[?global.deployed_manpower_ratio_needed_for_anschluss]§!倍。\n\n我們估計該目標已[GetAnschlussProgress]"
 GER_antischluss_progress_minimal: "取得§R極小§!程度的進展"
 GER_antischluss_progress_moderate: "取得§O適中§!程度的進展"
 GER_antischluss_progress_significant: "取得§Y顯著§!程度的進展"
 GER_antischluss_progress_complete: "§G實現§!"
 GER_austrian_army_does_not_exist: "當前§Y[AUS.GetnameDef]§!沒有任何常備軍。"
 GER_befriend_czechoslovakia: "$GER_czech_friend$"
 GER_befriend_czechoslovakia_desc: "$GER_czech_friend_desc$"
 GER_war_preparations: "戰爭準備"
 GER_war_preparations_desc: "為了讓國家充分準備迎接即將到來的戰爭，我們不僅要確保在國防軍內部進行準備，還要在工業和基礎設施方面做好準備。"
 GER_prepare_for_the_next_blockade_ww: "防備下次封鎖"
 GER_prepare_for_the_next_blockade_ww_desc: "隨著其他國家意識到我們準備的程度，某些國家不可避免地會提出反對意見。我們以前經歷過封鎖，並知道如何應對它們。只要有充分的準備，他們的封鎖將對我們幾乎沒有影響。"
 GER_subversive_infiltrators: "顛覆性滲透者"
 GER_subversive_infiltrators_desc: "關於敵人的情報和信息對於成功的入侵至關重要。隨著我們在許多領域增加支出，顯然我們也應該投資於改進情報收集工作。"
 GER_integrate_czechoslovakia: "整合捷克斯洛伐克"
 GER_integrate_czechoslovakia_desc: "隨著我們越來越瞭解[CZE.GetNameDef]的管理方式，越來越清楚的是，那裡的人民渴望改變。融入[GER.GetNameDef]將提供這種急需的變革。我們應該派遣代表團帶著最後通牒前往。"
 GER_fate_of_czechoslovakia: "$GER_end_of_czechoslovakia$"
 GER_fate_of_czechoslovakia_desc: "$GER_end_of_czechoslovakia_desc$"
 GER_support_a_coup_in_liechtenstein: "支持列支敦士登政變"
 GER_support_a_coup_in_liechtenstein_desc: "我們收到消息稱，一些同道中人正在計劃推翻列支敦士登這一微型國家的攝政王。一個名叫阿方斯·古普的人前來請求我方支持，並保證我們也將從中受益。"
 GER_reassert_eastern_claims: "$GER_demand_memel$"
 GER_reassert_eastern_claims_desc: "$GER_demand_memel_desc$"
 GER_expand_claims_in_baltic: "擴大在波羅的海的宣稱"
 GER_expand_claims_in_baltic_desc: "歷史上在波羅的海國家有相當數量的[ROOT.GetAdjective]僑民。對他們來說，迴歸[ROOT.GetNameDef]是他們的最佳利益，也符合我們的最大利益！"
 GER_influence_the_baltics: "影響波羅的海"
 GER_influence_the_baltics_desc: "波羅的海國家位於我們與[SOV.GetNameDef]之間的危險地帶。通過一些外交努力和互惠互利的提議，我們應該能夠在不需要衝突的情況下使它們更緊密地支持我們。"
 GER_danzig_for_slovakia: "$GER_danzig_vs_slovakia$"
 GER_danzig_for_slovakia_desc: "$GER_danzig_vs_slovakia_desc$"
 GER_befriend_poland: "$GER_poland_friend$"
 GER_befriend_poland_desc: "$GER_poland_friend_desc$"
 GER_subjugate_romanian_economy: "征服羅馬尼亞經濟"
 GER_subjugate_romanian_economy_desc: "[ROM.GetNameDefCap]已經成為我們重要的貿易伙伴。該國開採的大量原油提升了該國的經濟，他們現在開始提高價格。我們當然可以施加一些壓力，確保像我們這樣的老客戶獲得最優惠的價格。"
 GER_influence_the_benelux: "影響比荷盧"
 GER_influence_the_benelux_desc: "貝內盧克斯地區對我們繼續的戰爭努力具有重要意義，但也因為它們的工業能力和地理位置。雖然我們可能輕易征服它們，但為什麼不把它們爭取我們這一邊呢？"
 GER_operation_weserubung: "$GER_weserubung$"
 GER_operation_weserubung_desc: "$GER_weserubung_desc$"
 GER_utilize_the_nordliche_gesellschaft: "利用北方聯盟" #was Befriend Scandinavia
 GER_utilize_the_nordliche_gesellschaft_desc: "斯堪的納維亞一向保持中立。如果我們能通過外交手段獲得他們所擁有的資源，就沒有必要再開闢一個戰線。因此，我們應該利用阿爾弗雷德·羅森伯格的北方協會，這個旨在加強德國-北歐文化和政治合作的組織，以便對北歐國家說好話。"
 GER_form_rome_berlin_axis: "建立羅馬-柏林軸心"
 GER_form_rome_berlin_axis_desc: "$GER_italy_ally_desc$"
 GER_invade_italy: "阿拉里克行動"
 GER_invade_italy_desc: "乍看之下，[ITA.GetNameDef]可能是我們潛在的好盟友，但我們知道他們的真面目。在那次世界大戰初期，他們拒絕與我們並肩作戰，而且儘管我們之前是盟友甚至在1915年背叛了我們。我們從那時起吸取了教訓，決不會再犯信任他們的錯誤。"
 GER_alliance_with_spain: "$GER_nationalist_spain_ally$"
 GER_alliance_with_spain_desc: "$GER_nationalist_spain_ally_desc$"
 GER_operation_felix: "費利克斯行動"
 GER_operation_felix_desc: "隨著西班牙內戰的最終結束，是時候從[ENG.GetAdjective]手中奪取[118.GetName]了。然而，由於我們無法從海上進攻，我們必須首先確保[SPR.GetAdjective]的忠誠，以允許我們通過他們的領土。鑑於我們的意識形態，使他們屈服應該不難。"
 GER_secure_spain_desc: "[SPR.GetNameDef]已經證明是一個極為動盪的國家。當他們與政府當局鬥爭時，或許我們應該向他們伸出援手？在這種情況下，成為我們的傀儡政權必定比他們習慣的混亂要好得多吧？"
 GER_alliance_with_portugal: "與葡萄牙結盟"
 GER_alliance_with_portugal_desc: "歷史上我們與[POR.GetNameDef]的關係並不十分積極。儘管在那次世界大戰中我們是苦敵，但他們似乎已經改變了看法。由於我們都支持西班牙的民族主義者，我們相信雙方在意識形態上可能有相似之處，我們可以與[POR.GetAdjective]達成協議。"
 GER_operation_isabella: "伊莎貝拉行動"
 GER_operation_isabella_desc: "只有[POR.GetNameDef]阻礙我們完全控制伊比利亞半島，我們的下一步行動必須是讓他們屈服於我們。保留當地政府但確保他們對我們的忠誠，應該能讓我們得到我們需要的一切，包括土地、基礎設施和軍事組織。"
 GER_secure_portugal_desc: "在那次世界大戰期間，[POR.GetAdjective]被我們對手的宣傳所影響，轉而對抗我們。我們的一些舊船仍然停泊在他們的港口，關於歸還它們的事卻隻字未提。雖然他們現在看起來足夠友好，但我們不能信任他們，我們應該向他們表明，除非他們想要戰爭，否則是時候服從我們的統治了。"
 GER_operation_sea_lion: "海獅計劃"
 GER_operation_sea_lion_desc: "[ENG.GetNameDef]的地理位置已經證明是我們當前戰爭努力的一個複雜因素。從空中和海上發起全面攻勢似乎是最終擊潰[ENG.GetAdjective]的最佳方案！"
 GER_operation_green: "綠色行動"
 GER_operation_green_desc: "為了策應海獅行動，我們對西部側翼的作戰指揮部應該計劃對愛爾蘭進行全面行動，並做好佔領該島的準備，以確保不列顛群島能完全落入我們的控制之下。為此，我們的高級指揮部已經起草了綠色計劃，作為詳細的作戰計劃。"
 GER_challenge_the_monroe_doctrine: "挑戰門羅主義"
 GER_challenge_the_monroe_doctrine_desc: "儘管距離我們很遠，但中南美的一些國家在意識形態上與我們非常接近。通過建立和維護與他們的良好關係，我們雙方都能大大受益。此外，在另一個大陸上建立立足點對未來可能非常有價值。"
 GER_shatter_usas_hegemony: "粉碎[USA.GetAdjective]霸權"
 GER_shatter_usas_hegemony_desc: "[USA.GetAdjective]人在國際舞臺上長期擁有過多的權力。隨著我們變得更加強大，現在是他們讓位的時候了。"
 GER_challenge_the_monroe_doctrine_tt: "解鎖決議§Y破壞門羅主義§!。\n\n知會§Y[USA.GetNameDef]§!並允許他們設法§R干預§!。"
 GER_challenge_the_monroe_doctrine_tt_2: "至少7個國家仍然有§Y門羅主義§!活躍"
 GER_establish_protectorates_in_america: "在美洲建立保護國"
 GER_establish_protectorates_in_america_desc: "美洲的國家長期以來的治理方式與我們的理想不符。需要進行全面的重組，以糾正這些地區長期以來的次優管理。"
 GER_demands_to_sweden: "施壓瑞典"
 GER_demands_to_sweden_desc: "[SWE.GetNameDef]北部的鋼礦是我們軍事工業的重要資產。關於能否能繼續與[SWE.GetAdjective]進行貿易，我們不能聽憑運氣。這條貿易路線需要儘快得到保障。"
 GER_the_swiss_gold: "瑞士黃金"
 GER_the_swiss_gold_desc: "鑑於[SWI.GetAdjective]決定暫時不參與任何全球衝突，他們為貿易和間諜活動提供了一個絕佳的機會。我們應該確保在他們的國家派駐特工，並在儲備我們獲得的黃金時充分利用他們的潛力。"
 GER_secure_finland: "控制芬蘭"
 GER_secure_finland_desc: "[FIN.GetNameDefCap]與[SOV.GetNameDef]有著漫長的陸地邊界。獲得這一邊界的通道將為我們對抗東方紅色威脅提供另一個潛在的前線，如果我們需要與[SOV.GetAdjective]作戰，這可能非常有價值。"
 GER_befriend_china: "$GER_china_friend$"
 GER_befriend_china_desc: "$GER_china_friend_desc$"
 GER_befriend_japan: "$GER_japan_friend$"
 GER_befriend_japan_desc: "$GER_japan_friend_desc$"
 GER_reclaim_former_african_colonies: "奪回曾經的非洲殖民地"
 GER_reclaim_former_african_colonies_desc: "亞洲並不是我國唯一失去領土的大洲。非洲故土關乎我國的利益，我們應該盡最大努力重新獲得這些領土，並再次將其整合。"
 GER_mittelafrika: "中非"
 GER_mittelafrika_desc: "在非洲，我們未曾佔有的廣袤土地關乎我國的利益。我們稱之為中非的地區擁有豐富的自然資源，此地將大大有利於[ROOT.GetNameDef]。"
 GER_mittelafrika_revive_the_schutztruppe_tt: "解鎖殖民地民兵§Y防衛軍§!以及在§Y非洲§!§Y招募§!並§Y加強§!這些部隊的決議。"
 GER_asia_revive_the_schutztruppe_tt: "解鎖殖民地民兵§Y防衛軍§!以及在§Y亞洲§!§Y招募§!並§Y加強§!這些部隊的決議。"
 GER_re_establish_german_control_over_qingdao: "重新確立德國對青島的控制"
 GER_re_establish_german_control_over_qingdao_desc: "1898年我們談判租借了青島。這一租借協議在1914年世界大戰爆發後不久由於[JAP.GetAdjective]的佔領而中斷。既然該地區不再被佔領，也許是時候提醒他們這一協議了。"
 GER_claim_old_colonies_in_the_east: "宣稱東方舊殖民地"
 GER_claim_old_colonies_in_the_east_desc: "凡爾賽條約剝奪了我們的殖民地，並將這些殖民地分配給協約國。我們的人民明確表示，他們和我們一樣認為這是非法的。作為在東方建立外交關係的一部分，我們也應該考慮嘗試收回我們的殖民地。"
 GER_ally_chiang_kai_shek: "與蔣介石結盟"
 GER_ally_chiang_kai_shek_desc: "我們目前在東亞的行動不僅僅對我們有利。通過與[CHI.GetNameDef]的[CHI.GetLeader]結盟，並使他與我們結盟，我們可以擴大我們的勢力範圍，並促進該地區的殖民擴張。"
 GER_japanese_naval_cooperation: "日本海軍合作"
 GER_japanese_naval_cooperation_desc: "我們可以向[JAP.GetAdjective]學習很多，特別是在海軍事務方面。通過建立聯合技術合作，我們可以確保充分利用彼此的知識，減少在重新發明我們作為聯合力量已經擁有的技術上浪費的時間。"
 GER_negotiate_old_colonies_in_the_east: "談判東方舊殖民地"
 GER_negotiate_old_colonies_in_the_east_desc: "在那次世界大戰期間，我們在東亞的許多殖民地被[JAP.GetAdjective]奪走。既然我們現在正積極改善外交關係，我們或許可以通過外交手段重新獲得這些殖民地。"
 GER_claim_old_colonies_in_the_east_tt: "向§Y陣營成員§!和§Y[CHI.GetNameWithFlag]§!發送事件，請求控制在§Y東南亞§!的前[GER.GetAdjective]殖民地。如果他們拒絕，或者領土被一個我們不認為是盟友的國家控制，則對有爭議的地區獲得§Y宣稱§!。"
 GER_negotiate_old_colonies_in_the_east_tt: "他們控制的以下地區都會被轉交給我們：\n§Y[684.GetName]\n[647.GetName]\n[646.GetName]\n[633.GetName]\n[743.GetName]\n[979.GetName]\n[737.GetName]\n[726.GetName]\n[725.GetName]\n[1070.GetName]§!"
 GER_sentinels_of_the_pacific: "太平洋哨兵"
 GER_sentinels_of_the_pacific_desc: "我們在太平洋的據點通常開發不足，不足以讓我們自己的海軍或盟友的海軍進行使用。我們必須做出重大努力，確保在太平洋相關地區建立適當的海軍基礎設施。"
 GER_sentinels_of_the_pacific_tt: "受控制的所有地區如下：§Y\n[336.GetName]\n[335.GetName]\n[743.GetName]\n[633.GetName]\n[646.GetName]§!"
 GER_create_asian_reichskommissariat: "建立亞洲專員轄區"
 GER_create_asian_reichskommissariat_desc: "普通的殖民地有很多好處，但我們的元首對亞洲的殖民地有更大的計劃。實施他的殖民法應該對所有參與方都有利！"
 GER_south_east_asian_natural_wealth: "東南亞自然財富"
 GER_south_east_asian_natural_wealth_desc: "東南亞地區的自然資源豐富，對我們大有裨益。目前這些土地的擁有者並沒有理想地開發這些土地，雖然這些土地從未屬於我們，但這種觀點並沒有阻止所謂的民主國家竊取本應屬於我們的殖民地，也不會阻止我們！"
 GER_south_east_asian_natural_wealth_tt: "解鎖§Y地圖上的重要決議§!改善我們在東南亞的領土。"
 GER_the_proud_eagle_and_the_resurgent_dragon: "豪鷹與醒龍"
 GER_the_proud_eagle_and_the_resurgent_dragon_desc: "我們一直很擔憂我們的[CHI.GetNameDef]朋友遭受[JAP.GetAdjective]入侵的威脅。被動等待他們進攻毫無意義。我們必須為與[JAP.GetNameDef]武士開戰做好準備，不論是在我們的領土上，還是在他們的領土上。"
 GER_blitzkrieg_across_the_pacific: "跨太平洋閃電戰"
 GER_blitzkrieg_across_the_pacific_desc: "在太平洋上進行戰爭與我們的部隊大部分接受的訓練不同。此外，我們的戰術可能需要一些調整。我們不認為這是一個弱點，實際上我們認為這使我們更強。敵人的防禦建立在他們固有的認知上，如果我們設計一種新的在太平洋上進行戰爭的方式，我們可以讓他們措手不及。"
 GER_molotov_ribbentrop_pact: "$GER_mol_rib_pact$"
 GER_molotov_ribbentrop_pact_desc: "$GER_mol_rib_pact_desc$"
 GER_treaty_with_the_ussr: "$GER_soviet_treaty$"
 GER_treaty_with_the_ussr_desc: "$GER_soviet_treaty_desc$"
 GER_support_finland: "支持芬蘭"
 GER_support_finland_desc: "[FIN.GetAdjective]與[SOV.GetAdjective]之間圍繞[146.GetName]的爭端由來已久。隨著該地區緊張局勢的升級，支持他們更進一步，並促使他們與我們結盟符合我們的最佳利益。"
 GER_alliance_with_the_ussr: "$GER_soviet_ally$"
 GER_alliance_with_the_ussr_desc: "$GER_soviet_ally_desc$"
 GER_war_with_the_ussr: "$GER_ussr_war_goal$"
 GER_war_with_the_ussr_desc: "$GER_ussr_war_goal_desc$"
 GER_puppet_turkey: "$GER_turkey_puppet$"
 GER_puppet_turkey_desc: "$GER_turkey_puppet_desc$"
 GER_befriend_turkey: "$GER_turkey_friend$"
 GER_befriend_turkey_desc: "$GER_turkey_friend_desc$"
 GER_influence_the_middle_east: "影響中東"
 GER_influence_the_middle_east_desc: "儘管我們歷史上與中東沒有太多交集，但沒人能否認該地區對我們的重要性。我們應該在該地區擴大影響力，以確保在需要時我們在該地區擁有一定的外交份量。"
 GER_the_final_blow_to_communism: "對共產主義的最後一擊"
 GER_the_final_blow_to_communism_desc: "處理[SOV.GetNameDef]不能是我們對歐洲共產主義進行鬥爭的終點。只要我們周邊還存在共產主義國家，我們就必須繼續戰鬥。我們不能停息，直到紅色威脅被徹底根除！"
 GER_war_against_communism_tt: "獲得對世界上任何§Y共產主義§!國家的§Y吞併§!戰爭目標。當前效果："
 GER_war_against_european_communism_tt: "對任何§Y歐洲§!§Y共產主義§!國家獲得§Y吞併§!戰爭目標。當前目標："
 GER_crossing_the_atlantic_dockyards_tt: "在[ROOT.GetNameWithFlag]完全控制的歐洲沿海省份增加§Y2個$dockyard$§!，每建造一個船塢將移除§Y1個$arms_factory$§!。\n（效果最多作用於[?crossing_the_atlantic_max_states_for_dockyards|Y0]個省份，優先選擇擁有至少1個$arms_factory$的沿海省份）"
 #INNER CIRCLE
 GER_inner_circle_member_title: "全國領導"
 GER_ascension_of_todt: "$GER_inner_circle_member_title$托特"
 GER_ascension_of_todt_desc: "作為一名擁有軍事經驗的優秀工程師，弗裡茨·托德已經證明自己是元首的得力顧問。如果給予他相對的行動自由，我們相信他能對[ROOT.GetNameDef]發揮很大作用。"
 GER_ascension_of_speer: "$GER_inner_circle_member_title$施佩爾"
 GER_ascension_of_speer_desc: "作為一名受過訓練的建築師，阿爾伯特·斯佩爾擁有使國家持續繁榮極為重要的技能。若是給予他相對的行動自由，我們一方面將受益於他的專業技能，另一方面還能與[ROOT.GetAdjective]建築行業的大佬構築良好關係。"
 GER_ascension_of_goring: "$GER_inner_circle_member_title$戈林"
 GER_ascension_of_goring_desc: "一位優秀的指揮官在元首的核心集團中佔有一席之地。赫爾曼·戈林不僅是一位能幹的指揮官，還是元首的長期同盟，給予他一定的行動自由，風險不大而收益卻很可觀。"
 GER_ascension_of_goebbels: "$GER_inner_circle_member_title$戈培爾"
 GER_ascension_of_goebbels_desc: "元首的核心集團始終歡迎那些能夠幫助他維持民眾支持的人。作為一位親密追隨者和擅長演講的人，給予約瑟夫·戈培爾一定的行動自由對我們來說將是非常有利的。"
 GER_rally_the_industrialists: "團結實業家"
 GER_rally_the_industrialists_desc: "工業家在我們國家擁有重要的權力。爭取他們的支持需要時間投資，但魯道夫·赫斯已經向我們保證，這筆投資是值得的。"
 GER_glorify_party_rallies: "頌揚黨的集會"
 GER_glorify_party_rallies_desc: "沒有我們的政治核心，這個國家將會動搖。馬丁·鮑曼指出，我們的黨派集會可以改進，以獲得更多民眾的支持，從而讓我們在政府組建方面擁有更多的自由行動空間。"
 GER_total_control_over_domestic_affairs: "全面控制國內事務"
 GER_total_control_over_domestic_affairs_desc: "完全放手國內事務，讓黨首來處理，這看起來似乎是個大膽的舉動。不過，元首對此是十分確定的。到目前為止，黨首所承擔的職責遠超預期，而[ROOT.GetLeader]對此很放心，能夠將這些事務交給他，從而專注於更重要的事情。"
 GER_fuhrerprinzip_inner_circle_tt: "激活§Y核心集團§!機制。\n\n"
 GER_rally_the_industrialists_hess_tt: "將防止§Y$germany.107.t$§!事件鏈發生。"
 GER_wunderwaffe_dornberger_trait_tt: "§Y$GER_walter_dornberger$§!（$high_command$）：\n§Y$GER_head_of_the_missile_department$§!特質被§Y$GER_head_of_experimental_weapons$§!取代\n效果變化：\n設施補給消耗：§G-10.00§!\n$specialization_naval_speed_factor$：§G+10%§!\n$specialization_nuclear_speed_factor$：§G+10%§!"
 GER_rally_the_industrialists_hess_stays_tt: "阻止§Y$GER_rudolf_hess$§!進行他臭名昭著的飛行。"
 unlock_decision_category_explained: "解鎖決議§Y$CATEGORY$§!。$DESC$"
 GER_integration_of_puppet_economies_decisions_tt: "這些決議允許我們發展或剝削傀儡國的經濟。"
 GER_a_strong_successor_trigger_tt: "§Y核心集團§!中所有§Y3§!名高級顧問均已完成其終極國策。"
 GER_a_strong_successor_tt: "獲得事件‘§Y$GER_inner_circle.02.t$§!’。\n當前§Y核心集團§!中的$GER_inner_circle_member_title$可以取代§Y[ROOT.GetLeader]§!成為國家領導人。"
 GER_a_strong_successor_current_advisors_tt: "當前高級顧問：§Y[GetAscendedAdvisorName1]§!，§Y[GetAscendedAdvisorName2]§!或§Y[GetAscendedAdvisorName3]§!"
 GER_focus_can_only_be_completed_by_advisor_tt: "該國策只能由§Y$CHARACTER$§!在完成§Y$FOCUS$§!之後開始。"
 GER_focus_can_only_be_completed_by_advisor_multiple_tt: "該國策只能由§Y$CHARACTER$§!或§Y$CHARACTER_2$§!在完成§Y$FOCUS$§!或§Y$FOCUS_2$§!之後開始。"
 GER_ascension_of_character_focus_tt: "§Y$CHARACTER$§!將開始隨著時間的推移處理他分支中的國策。"
 GER_ascension_of_character_tt: "§Y$CHARACTER$§!被任命為§Y全國領導§!，並在§Y核心集團§!中晉升為："
 GER_ascended_character_trait_swap_tt: "§Y$CHARACTER$§!在§Y核心集團§!中崛起："
 GER_total_control_over_domestic_affairs_chancellors_tt: "根據§Y核心集團§!內任命的黨魁："
 GER_event_to_replace_ascended_advisor_tt: "獲得事件§Y$CHARACTER$的崛起§!'：\n§Y$CHARACTER$§!可以在§Y核心集團§!中取代§Y[GetAscendedAdvisorName1]§!、§Y[GetAscendedAdvisorName2]§!或§Y[GetAscendedAdvisorName3]§!。"
 replace_ascended_advisor_tt: "§R移出§!§Y核心集團§!：\n§Y$CHARACTER$§!，擔任$TRAIT$"
 GER_stop_progress_on_advisor_focus_tt: "§Y$CHARACTER$§!將終止致力於國策§Y$FOCUS$§!。"
 GER_advisor_will_continue_focus_tt: "§Y$CHARACTER$§!在§Y核心集團§!中佔據上風，並將繼續致力於國策§Y$FOCUS$§!。"
 GER_inner_circle_industrial_me_focuses_tt: "(完成該國策將§R鎖定§!§Y$FOCUS_1$§!和§Y$FOCUS_2$§!及其各自的$GER_inner_circle_member_title$）"
 GER_intrigue_replacing_advisor_already_ascended_tt: "§Y$CHARACTER$§!在§Y核心集團§!中佔據上風，並能夠完成國策§Y$FOCUS$§!。\n\n§Y$CHARACTER_2$§!和§Y$CHARACTER_3$§!將不再嘗試完成各自的互斥國策。"
 GER_inner_circle_event_pending_flag: " 有一個待處理的§Y核心集團§!事件。\n"
 GER_intrigue_replacing_advisor_new_ascending_tt: "§Y$CHARACTER$§!在§Y核心集團§!中晉升為：\n$IDEA$\n§Y$CHARACTER$§!將能夠完成國策§Y$FOCUS$§!。\n\n§Y$CHARACTER_2$§!和§Y$CHARACTER_3$§!將不再嘗試完成各自的互斥國策。"
 GER_inner_circle_cd_flag: " 已任命另一位§Y$GER_inner_circle_member_title$§!"
 GER_inner_circle_cd_days_tt: "到可以任命下一位§Y$GER_inner_circle_member_title$§!的天數：[?GER_inner_circle_cd_flag:days_left|Y0]"
 GER_inner_circle_focus_in_progress_tt: "§Y$CHARACTER$§!正致力於該國策。\n進度：§Y$FLAG_DAYS$§!/[?temp_focus_days]天"
 GER_industrialists_intrigue_prevailed_tt: "§Y$PREVAILED_CHARACTER$§!被託付領導工業發展，且是唯一可以同時推進互斥國策的人。\n\n"
