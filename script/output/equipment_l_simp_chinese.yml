 light_tank_equipment: "輕型坦克"
 light_tank_equipment_desc: "輕型坦克是體型較小、靈活性較高的裝甲戰鬥車輛，可以承擔偵查任務，也可以對抗輕裝甲目標。"
 light_tank_equipment_1: "輕型坦克 I型"
 light_tank_equipment_1_short: "輕型坦克 I型"
 light_tank_equipment_1_desc: "輕型坦克是體型較小、靈活性較高的裝甲戰鬥車輛，可以承擔偵查任務，也可以對抗輕裝甲目標。"
 GER_light_tank_equipment_1: "I號坦克"
 GER_light_tank_equipment_1_short: "I號坦克"
 GER_light_tank_equipment_1_desc: "I號坦克是德國在20世紀30年代製造的一種輕型坦克。I號坦克的設計工作始於1932年，到1934年開始大規模投產。儘管I號坦克最初的設計用途只是當做德國陸軍掌握裝甲戰爭理念的訓練工具，但是由於德國缺乏現代坦克，所以I號坦克在戰爭中得到了廣泛地使用。"
