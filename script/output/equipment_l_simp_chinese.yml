 GER_heavy_tank_equipment_3_short: "虎王"
 GER_heavy_tank_equipment_3_desc: "因其被盟軍士兵半直譯為老虎之王的非正式名字而廣為人知。其與虎I基於同樣設計原則但更為強大。虎II結合了虎I的厚裝甲和黑豹中型坦克的傾斜裝甲。整車重量將近70噸，前部有著厚達100至180毫米的裝甲保護，裝備有8.8cm KwK 43 L/71主炮。"
