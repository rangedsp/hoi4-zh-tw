 light_tank_equipment_2_desc: "輕型坦克是體型較小、靈活性較高的裝甲戰鬥車輛，可以承擔偵查任務，也可以對抗輕裝甲目標。"
 GER_light_tank_equipment_2: "II號坦克"
 GER_light_tank_equipment_2_short: "II號坦克"
 GER_light_tank_equipment_2_desc: "II號坦克最初是德國在更大更先進的載具還未開發出來前，設計的一種權宜性質的坦克，由於缺乏堪用的其他型號高性能坦克，II號坦克被廣泛地用於各種戰鬥。"
 light_tank_equipment_3: "輕型坦克 III型"
 light_tank_equipment_3_short: "輕型坦克 III型"
 light_tank_equipment_3_desc: "輕型坦克是體型較小、靈活性較高的裝甲戰鬥車輛，可以承擔偵查任務，也可以對抗輕裝甲目標。"
 GER_light_tank_equipment_3: "VK1602“豹”式"
 GER_light_tank_equipment_3_short: "“豹”式"
 GER_light_tank_equipment_3_desc: "VK1602“豹”式坦克是德國在1942年設計的一種偵查坦克。這種坦克原計劃裝備75mm的Kwk41型火炮，但隨後改為裝備更小的50mm口徑的火炮。VK1602擁有傾斜的正面裝甲，這受到了黑豹中型坦克的影響。為了提高VK1602在鄉野間的行進能力，德國人為它裝備了寬達350mm的履帶。"
