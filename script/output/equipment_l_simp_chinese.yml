 gw_tank_equipment: "一戰坦克"
 gw_tank_equipment_short: "一戰坦克"
 gw_tank_equipment_desc: "第一次世界大戰中的坦克由英國和法國在同一時間分別研發出來，它們被用於打破西線戰場塹壕戰的僵局。英國人在研發的最初階段使用了坦克（tank，本意為水箱）這個稱呼，用於掩蓋它們真正的研發內容。早期的坦克裝備著機槍和小型的加農炮，移動速度緩慢，它們的裝甲只能抵擋輕武器的火力。"
 GER_gw_tank_equipment: "輕型拖拉機"
 GER_gw_tank_equipment_short: "輕型拖拉機"
 GER_gw_tank_equipment_desc: "輕型拖拉機是德國的一款實驗性坦克。在第一次世界大戰結束後，德國在軍事發展上受到凡爾賽和約的嚴格限制，但是德國人以研究“拖拉機”為名，秘密地開展了研究軍事裝甲車輛和火炮的項目。"
