 GER_medium_tank_aa_equipment_1: "III號防空坦克“傢俱車”"
 GER_medium_tank_aa_equipment_1_short: "“傢俱車”"
 GER_medium_tank_aa_equipment_1_desc: "這是一種基於IV號坦克底盤臨時改裝的、裝備了3.7cm火炮的自行防空炮。由於炮塔封閉時像一個櫃子，它得到了“傢俱車”這個綽號。"
 GER_medium_tank_aa_equipment_2: "IV號防空坦克“東風”"
 GER_medium_tank_aa_equipment_2_short: "“東風”"
 GER_medium_tank_aa_equipment_2_desc: "IV號防空坦克“東風”是德國在二戰中使用IV號坦克底盤研製的一種自行防空炮。它在1944年開始研發，作為之前IV號防空坦克的繼任者。IV號坦克的炮塔被移除，替換為一個敞篷的六邊形炮塔，裡面安裝了1門3.7cmFlaK43型防空炮。儘管採用頂棚封閉式炮塔會更好一點，但是火炮產生的濃煙使得這變得不可能。"
