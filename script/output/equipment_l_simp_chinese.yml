 GER_light_tank_artillery_equipment_1: "I號突擊炮“野牛”"
 GER_light_tank_artillery_equipment_1_short: "野牛"
 GER_light_tank_artillery_equipment_1_desc: "在戰鬥中，摩托化步兵團火炮連的牽引式火炮很難跟上坦克的腳步。解決這個問題最簡單的方法就是把火炮加裝到多餘的坦克底盤上。以“野牛”自行火炮來說，它使用的是I號坦克的底盤。"
