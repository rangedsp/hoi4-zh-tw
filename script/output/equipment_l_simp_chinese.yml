 mechanized_equipment: "機械化裝備"
 mechanized_equipment_short: "機械化裝備"
 mechanized_equipment_desc: "機械化步兵是裝備有裝甲運兵車和步兵戰車用於運輸和戰鬥的步兵部隊。機械化步兵與摩托化步兵的區別在於這些裝甲車輛比起摩托化步兵的軟麵皮輪車輛（卡車或吉普等）一定程度上為步兵提供了免於敵方火力的保護。"
