 train_equipment: "火車"
 train_equipment_desc: "火車在由鐵路連接補給首都和補給中心中運輸補給"
 train_equipment_1: "民用火車"
 train_equipment_1_desc: "這類火車由軍方從民用貨運用途接管，其引擎非常適合遠距離運輸大量補給。然而，民用構造使其在遭受攻擊時較為脆弱。"
 train_equipment_2: "戰備簡化型火車"
 train_equipment_2_desc: "一種簡化的設計，為了降低生產成本，省略了常規貨運火車上常見的許多功能。它仍然像普通火車一樣脆弱，但更容易替換。"
 train_equipment_3: "裝甲火車"
 train_equipment_3_desc: "火車引擎為重型裝甲所保護，不易受到敵人的攻擊。它的運載量與其它設計一樣多，但生產成本更高。"
 railway_gun_equipment: "列車炮"
 railway_gun_equipment_desc: "一門通過鐵路運輸的重炮。"
 railway_gun_desc: "鐵路可以將重炮快速移動到內陸，使我們能夠遠程轟炸敵人的陣地並造成大量破壞。"
 railway_gun_equipment_1: "列車炮"
 floating_harbor_equipment: "浮動港口"
 floating_harbor_equipment_desc: "由一系列浮筒和預製混凝土結構組成，可以在水面上移動並在數小時內組裝起來，作為有遮蔽的停泊空間來裝卸補給。"
