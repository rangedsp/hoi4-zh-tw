 GER_land_cruiser_equipment_1_short: "巨鼠"
 GER_land_cruiser_equipment_1_desc: "P.1000鼠式坦克是德國在二戰期間開發的超重型坦克概念車。由克虜伯公司在1942年提出，該設計設想了一個1000噸的裝甲龐然大物，配備兩門280毫米艦炮，多個副武器，裝甲厚達360毫米。鼠式坦克的目的是作為一個移動堡壘，能夠壓制任何戰場上的對手。然而，由於其巨大的尺寸，高燃料消耗和後勤上的不可行性，該項目被認為是不可行的，並最終在1943年被取消。"
