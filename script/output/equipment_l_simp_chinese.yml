 medium_tank_equipment: "中型坦克"
 medium_tank_equipment_desc: "中型坦克是比較靈活的多用途載具，可以承擔多種任務，例如偵查、支援步兵以及坦克戰。"
 medium_tank_equipment_1: "中型坦克 I型"
 medium_tank_equipment_1_short: "中型坦克 I型"
 medium_tank_equipment_1_desc: "中型坦克是比較靈活的多用途載具，可以承擔多種任務，例如偵查、支援步兵以及坦克戰。"
 GER_medium_tank_equipment_1: "III號坦克"
 GER_medium_tank_equipment_1_short: "III號坦克"
 GER_medium_tank_equipment_1_desc: "早在1934到1935年的時候，海因茨·古德里安將軍就為德國裝甲師預想出了兩種主要的裝甲車輛型號。一種裝備著一門反坦克炮和兩挺機槍，另一種則是裝備著更大口徑火炮的支援性裝甲車輛。第一種最終演變成了III號坦克，它是一種標準的坦克，適用於每個坦克營擁有三個輕坦克連這樣的編制。第二種則變成了IV號坦克。"
