l_simp_chinese:
 submarine: "潛艇"
 submarine_desc: "潛艇裝備著隱蔽而強大的魚雷，可以打擊敵人的護航隊。"
 both_cruisers_desc: "輕巡洋艦——輕型的屏衛艦。其主要功能是防護己方主力艦隻免受敵方輕型軍艦的攻擊，不過輕巡洋艦同樣也可以發射威力強大的魚雷，足以對更大型的軍艦造成傷害。\n\n重巡洋艦——裝備著重型裝甲並且極其靈活的大型巡洋艦。對於造不起更大型主力艦的國家來說，重巡洋艦是一個很好的選擇。"
 light_cruiser: "輕巡洋艦"
 light_cruiser_desc: "輕型的屏衛艦。其主要功能是防護己方主力艦隻免受敵方輕型軍艦的攻擊，不過輕巡洋艦同樣也可以發射威力強大的魚雷，足以對更大型的軍艦造成傷害。"
 heavy_cruiser: "重巡洋艦"
 heavy_cruiser_desc: "裝備著重型裝甲並且極其靈活的大型巡洋艦。對於造不起更大型主力艦的國家來說，重巡洋艦是一個很好的選擇。"
 destroyer: "驅逐艦"
 destroyer_desc: "最小型的屏衛艦。它的任務是保護己方大型軍艦，尋找並摧毀敵方的潛艇。"
 ship_hull_light: "輕型船體"
 ship_hull_light_desc: "最小型的屏衛艦。它的任務是保護己方大型軍艦，以及尋找並摧毀敵方的潛艇。"
 carrier: "航空母艦"
 carrier_desc: "攜帶著大量艦載機投入戰鬥的主力艦。你也可以將其作為浮動的機場，部署在敵方的海岸之外。"
 battleship: "戰列艦"
 battleship_desc: "最大型的主力艦，裝備著用錢可以買到的最大口徑的火炮和最堅固的裝甲。這種造價昂貴的鉅艦值得你再造一批小型掩護型軍艦去支援它。"
 armor_desc: "用錢可以買到的最大最強的裝甲。"
 battle_cruiser: "戰列巡洋艦"
 battle_cruiser_desc: "一種大型的主力艦，在火力上通常和戰列艦相差無幾，但是為了提高速度而犧牲了裝甲防護。"
 convoy: "運輸船"
 convoy_desc: "運輸船承擔著國際間貨物和資源的運輸。它同時也被用來運輸部隊以及開展登陸作戰行動。"
 sh_battleship: "超重型戰列艦"
 sh_battleship_desc: "最大型的主力艦，裝備著用錢可以買到的最大口徑的火炮和最堅固的裝甲。這種造價昂貴的鉅艦值得你再造一批小型掩護型軍艦去支援它。"
 light_airframe: "輕型機身"
 light_airframe_desc: "基於輕型機身的飛機"
 medium_airframe: "中型機身"
 medium_airframe_desc: "基於中型機身的飛機"
 heavy_airframe: "重型機身"
 heavy_airframe_desc: "基於重型機身的飛機"
 jet_engines: "噴氣引擎"
 JET_ENGINES_SPECIAL: "研發噴氣引擎是研發噴氣動力飛機的一個基本先決條件。在研究高級飛機之前，必須先完成這項研究。"
 jet_engines_desc: "推動力科技的一次突破。噴氣引擎將打開研究新一代飛機的大門。"
 convoy_1: "運輸船"
 armored_car_equipment: "裝甲車"
 armored_car_equipment_desc: "輕型裝甲輪式車輛。通常用於偵察和鎮壓抵抗，但可以配備更重型的武裝。"
 motorized_equipment: "卡車"
 motorized_equipment_desc: "使用卡車來轉移部隊、補給，以及提高部隊摩托化。"
 motorized_equipment_0: "早期卡車"
 motorized_equipment_0_desc: "世界大戰期間，軍隊開始使用基礎型的民用卡車來運輸物資與裝備。自此，卡車就成為了大多數軍隊不可或缺的組成部分。"
 motorized_equipment_1: "卡車"
 motorized_equipment_1_desc: "摩托化是陸軍機械化的第一步。民用卡車可以很容易地被用來運輸士兵、牽引火炮以及輸送裝備和補給。這極大地提高了步兵的戰略機動能力，使其不再依賴於步行。"
 support_equipment_short: "支援裝備"
 support_equipment: "支援裝備"
 support_equipment_desc: "用於支援部隊作戰的無線電臺、吉普車、浮橋和其他裝備。"
 tech_support: "支援裝備"
 support_equipment_1: "支援裝備"
 support_equipment_1_desc: "用於支援部隊作戰的無線電臺、吉普車、浮橋和其他裝備。"
