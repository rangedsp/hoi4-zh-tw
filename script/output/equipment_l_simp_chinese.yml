 medium_tank_destroyer_equipment: "中型自行反坦克炮"
 medium_tank_destroyer_equipment_short: "中型自行反坦克炮"
 medium_tank_destroyer_equipment_desc: "自行反坦克炮就是在炮塔位置安裝了一門固定火炮的裝甲載具，其口徑超過通常坦克的標準。中型自行反坦克炮的設計基於中型坦克底盤，這意味著它們即擁有良好的機動性，也擁有強大的火力。"
 medium_tank_destroyer_equipment_1: "中型自行反坦克炮 I型"
 medium_tank_destroyer_equipment_1_short: "中型自行反坦克炮 I型"
 medium_tank_destroyer_equipment_1_desc: "自行反坦克炮就是在炮塔位置安裝了一門固定火炮的裝甲載具，其口徑超過通常坦克的標準。中型自行反坦克炮的設計基於中型坦克底盤，這意味著它們即擁有良好的機動性，也擁有強大的火力。"
 medium_tank_destroyer_equipment_2: "中型自行反坦克炮 II型"
 medium_tank_destroyer_equipment_2_short: "中型自行反坦克炮 II型"
 medium_tank_destroyer_equipment_2_desc: "自行反坦克炮就是在炮塔位置安裝了一門固定火炮的裝甲載具，其口徑超過通常坦克的標準。中型自行反坦克炮的設計基於中型坦克底盤，這意味著它們即擁有良好的機動性，也擁有強大的火力。"
 medium_tank_destroyer_equipment_3: "中型自行反坦克炮 III型"
 medium_tank_destroyer_equipment_3_short: "中型自行反坦克炮 III型"
 medium_tank_destroyer_equipment_3_desc: "自行反坦克炮就是在炮塔位置安裝了一門固定火炮的裝甲載具，其口徑超過通常坦克的標準。中型自行反坦克炮的設計基於中型坦克底盤，這意味著它們即擁有良好的機動性，也擁有強大的火力。"
 GER_medium_tank_destroyer_equipment_1: "III號突擊炮"
 GER_medium_tank_destroyer_equipment_1_short: "III號突擊炮"
 GER_medium_tank_destroyer_equipment_1_desc: "III號突擊炮是德國在二戰中產量最多的裝甲戰鬥車輛。它使用了久經考驗的III號坦克的底盤。最初，III號突擊炮被設計成一種機動的步兵支援火炮，但隨後經過不斷地改進，它被廣泛地當做自行反坦克炮使用。"
 GER_medium_tank_destroyer_equipment_2: "IV號坦克殲擊車"
 GER_medium_tank_destroyer_equipment_2_short: "IV號坦克殲擊車"
 GER_medium_tank_destroyer_equipment_2_desc: "IV號坦克殲擊車服役於德國國防軍軍裝甲師和黨衛軍裝甲師的反坦克營。它們曾在諾曼底、突出部戰役以及東線作戰。這是一種十分成功的自行反坦克炮，但作為坦克的替代時則表現不佳。儘管如此，在戰爭後期，IV號坦克殲擊車逐漸被當做坦克的替代品，因為那時通常沒有其他東西可用了。"
 GER_medium_tank_destroyer_equipment_3: "“獵豹”"
 GER_medium_tank_destroyer_equipment_3_short: "獵豹"
 GER_medium_tank_destroyer_equipment_3_desc: "“獵豹”坦克殲擊車是納粹德國在二戰中使用黑豹坦克底盤研製的一種自行反坦克炮。它在戰爭末期才開始服役（1944年），東線和西線戰場都出現過它的身影。獵豹坦克殲擊車裝備著與虎II坦克相同的威力強大的8.8cmPaK43型火炮，並且擁有極佳的裝甲防護性能，同時黑豹坦克的底盤提供了優秀的懸掛系統。不過德國在戰爭後期整體的糟糕狀況讓獵豹坦克殲擊車大受影響，它的產量很低，零部件匱乏，而且成員缺乏訓練。"
