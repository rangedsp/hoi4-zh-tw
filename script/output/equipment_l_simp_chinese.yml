 tank_armor_upgrade: "裝甲"
 tank_armor_upgrade_desc: "超過敵人穿甲能力的裝甲會讓你的部隊獲得巨大的優勢，但也會使它們速度更慢。"
 tank_gun_upgrade: "主炮"
 tank_gun_upgrade_desc: "裝備穿甲厚度超過敵人裝甲的主炮是非常重要的。"
 tank_aa_upgrade: "防空武器"
 tank_aa_upgrade_desc: "確保我們的防空武器裝備能夠擊落敵人最新型號的飛機。"
 tank_at_upgrade: "反坦克武器"
 tank_at_upgrade_desc: "確保我們的自行反坦克炮能幹掉敵人最新的坦克。"
 tank_art_upgrade: "火炮裝備"
 tank_art_upgrade_desc: "確保我們的自行火炮擁有巨大火力，能夠摧毀任何沒有裝甲的敵人。"
 tank_reliability_upgrade: "可靠性"
 tank_reliability_upgrade_desc: "提高穩定性能夠減少那些需要被替換的拋錨的裝備。"
 mech_cost_upgrade: "生產花費"
 mech_cost_upgrade_desc: "對設計進行優化以及在不太重要的部位採用替代材料可以使車輛的製造速度更快，但這樣製出來的單位存在略多缺陷。"
 tank_engine_upgrade: "引擎"
 tank_engine_upgrade_desc: "更強的機動性給你更多的戰略和戰術優勢，允許裝備更厚的裝甲而不會顯著降低速度。"
 ac_engine_upgrade: "引擎"
 ac_engine_upgrade_desc: "更好的機動性會給你帶來戰略和戰術優勢，不但允許裝備更厚的裝甲而且不會顯著降低速度。"
 ship_gun_upgrade: "艦炮"
 ship_gun_upgrade_desc: "裝備穿甲厚度超過敵人裝甲的主炮是非常重要的。"
 ship_torpedo_upgrade: "魚雷"
 ship_torpedo_upgrade_desc: "魚雷是一種強大的攻擊武器，由較小船隻在射程內發射，具有很大機會打出致命一擊"
 ship_armor_upgrade: "裝甲厚度"
 ship_armor_upgrade_desc: "更厚的裝甲以保護你的船隻免於敵人炮火"
 carrier_armor_upgrade: "裝甲厚度"
 carrier_armor_upgrade_desc: "更厚的裝甲以保護你的船隻免於敵人炮火"
 ship_engine_upgrade: "引擎"
 ship_engine_upgrade_desc: "具有更強大引擎的船隻可以在戰鬥中更好地控制其與敵人的距離"
 ship_reliability_upgrade: "可靠性"
 ship_reliability_upgrade_desc: "具有更高可靠性的船隻不會輕易被致命一擊擊沉，那些會被致命一擊的船隻明顯沒有經過深思熟慮的設計與建設。"
 ship_anti_air_upgrade: "防空"
 ship_anti_air_upgrade_desc: "裝備更多的火炮意味著我們將擊落更多的敵機！"
 ship_ASW_upgrade: "反潛武器"
 ship_ASW_upgrade_desc: "反潛武器對於定位和擺脫潛艇非常重要。"
 destroyer_engine_upgrade: "引擎"
 destroyer_engine_upgrade_desc: "具有更強大引擎的船隻可以在戰鬥中更好地控制其餘敵人的距離"
 sub_engine_upgrade: "引擎"
