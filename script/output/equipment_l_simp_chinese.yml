 GER_medium_tank_artillery_equipment_1: "“蟋蟀”"
 GER_medium_tank_artillery_equipment_1_short: "蟋蟀"
 GER_medium_tank_artillery_equipment_1_desc: "138/1號特種機動車“蟋蟀”是德國在二戰中使用的一種自行火炮。“蟋蟀”大約生產了490到500輛。它們被裝甲擲彈兵團中的步兵炮連用於提供重型移動火力支援。"
 GER_medium_tank_artillery_equipment_2: "“野蜂”"
 GER_medium_tank_artillery_equipment_2_short: "野蜂"
 GER_medium_tank_artillery_equipment_2_desc: "“野蜂”自行火炮是德國使用III號或IV號坦克底盤搭載15cm火炮而研發出的一種自行火炮。德國國防軍從1943年開始使用這型自行火炮，直至戰爭結束。"
