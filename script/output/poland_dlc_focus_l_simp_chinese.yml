l_simp_chinese:
 POL_central_region_strategy: "中部地區戰略"
 POL_central_region_strategy_desc: "將工業集中於遠離邊境的中部地區，我們不僅能夠提高生產效率，同時也能使其免遭任何潛在侵略者的破壞。"
 POL_expansion_of_new_towns: "新興波蘭工業"
 POL_expansion_of_new_towns_desc: "隨著此前從德國人手中收回了西部領土，我們現在必須進一步發展格丁尼亞等城市中欣欣向榮的工業，使其不久後能在規模上與華沙相媲美。"
 POL_fill_the_railways_gaps: "整合鐵路幹線"
 POL_fill_the_railways_gaps_desc: "由於波蘭曾被三個大國所瓜分，所以我們各地的鐵路網相距甚遠且互不相連。如果我們想要實現波蘭工業的集中發展，就必須將這些四散的鐵路幹線加以整合！"
 POL_start_central_industrial_region: "擴建克拉科夫工業"
 POL_start_central_industrial_region_desc: "作為波蘭的舊都，儘管早已擺脫了奧地利帝國的束縛，但克拉科夫的城市建設卻依舊停留在過去，缺乏與那些西方名城相匹敵的現代工業。通過投資，我們將令克拉科夫重煥新生。"
 POL_expand_central_industrial_region: "加利西亞工業現代化"
 POL_expand_central_industrial_region_desc: "正如克拉科夫，加利西亞也曾是奧地利人手中不受重視的寶地。不過既然此地已經重回波蘭的懷抱，我們或許可以增加對當地的投資，進一步推動我國亟需的現代化進程。"
 POL_the_four_year_plan: "四年計劃"
 POL_the_four_year_plan_desc: "我們必須有計劃地擴建我國基礎設施，以同當下及未來的工業發展規模相匹配。"
 POL_national_defence_fund: "國防基金"
 POL_national_defence_fund_desc: "無論公民個人還是國家整體，都必須為我們日益增長的工業投注基金，以應對將來潛在的威脅。"
 POL_warsaw_main_railway_station: "華沙鐵路樞紐"
 POL_warsaw_main_railway_station_desc: "華沙是重要的交通貨運樞紐，為避免其出現擁堵，對鐵路的管理需要受到額外重視。"
 POL_invest_in_the_old_polish_region: "投資舊波蘭工業區"
 POL_invest_in_the_old_polish_region_desc: "我們不僅要對凱爾採、斯卡日斯科、拉多姆、斯塔拉霍維採和奧斯特羅維茨等地的老舊工業園區進行現代化改造，同時也要興建新工業區以增強工業實力。"
 POL_develop_upper_silesia: "發展上西里西亞"
 POL_develop_upper_silesia_desc: "儘管西里西亞僅有小部分地區為我國控制，但它的工業價值卻十分巨大。作為我國工業化程度最高的地區之一，西里西亞只需進行少量投資，即可繼續支持整個國家的長遠工業化發展。"
 POL_additional_research_slot1: "波蘭數學流派"
 POL_additional_research_slot1_desc: "數學幾乎是一切技術領域的核心。而在波蘭，從利沃夫到華沙，各數學流派正蓬勃發展。我們必須利用好這個波蘭在思想上的黃金時代，予其所需，將國家打造為科技的強國！"
 POL_the_bombe: "“炸彈”破譯機"
 POL_the_bombe_desc: "“炸彈”是一種先進的破譯機，使我們能夠破譯逐步升級的德國英格瑪密碼。"
 POL_the_cyclometer: "循環測定機"
 POL_the_cyclometer_desc: "有了這項發明，德國人的加密信息在我們面前將如同明文，他們再也藏不住什麼機密了。"
 POL_atomic_physics_institute: "原子物理研究院"
 POL_atomic_physics_institute_desc: "我們定要成為首個駕馭核裂變毀滅之力的國家。"
 POL_additional_research_slot2: "擴張華沙大學"
 POL_additional_research_slot2_desc: "波蘭舉國最偉大的頭腦多集中於華沙大學，他們不僅從事著教學工作，同時也為波蘭的科研發展添磚加瓦。投資擴建這所大學就能為更多的傑出之士提供機會，為強大的波蘭國家錦上添花！"
 POL_prepare_for_the_next_war: "準備下一場戰爭"
 POL_prepare_for_the_next_war_desc: "上次世界大戰可能只是開始，我們必須為風雲變幻的戰場做好準備。"
 POL_the_defence_of_poland: "波蘭本土防衛"
 POL_the_defence_of_poland_desc: "為了捍衛我們的本土，必須制定更加大膽的策略。"
 POL_romanian_bridgehead_strategy: "羅馬尼亞橋頭堡戰略"
 POL_romanian_bridgehead_strategy_desc: "我們必須提前制定計劃，以便在戰局不利時能夠與盟友有效協同部隊並組織反擊。"
 POL_silesia_fortified_area: "西里西亞防線"
 POL_silesia_fortified_area_desc: "在南部修建更多的要塞將有利於鞏固防禦。"
 POL_hel_fortified_area: "赫爾防線"
 POL_hel_fortified_area_desc: "戰火可能同時從海陸邊境上再次燃起，我們必須強化要塞防禦，不打無準備之仗。"
 POL_standardisation_of_equipment: "裝備標準化"
 POL_standardisation_of_equipment_desc: "通過實現我軍士兵裝備的標準化，我們將為現代化的補給體系打下基礎。"
 POL_modernising_the_cavalry: "騎兵現代化"
 POL_modernising_the_cavalry_desc: "雖然騎兵仍可派上用場，但我們也需要為其配備能馳騁在現代戰場上的新式鋼鐵坐騎。"
 POL_study_foreign_tanks: "研究外國坦克"
 POL_study_foreign_tanks_desc: "鑑於這些叫“坦克”的玩意兒或將成為如今武裝衝突的重要組成部分，我們必須不惜一切代價趕上鄰近諸國的技術水平。"
 POL_cruiser_tank_experiments: "巡洋坦克測試"
 POL_cruiser_tank_experiments_desc: "隨著對坦克設計基礎理論的通曉，我們現在已經準備好在這機械化載具領域開創自己的道路了。"
 POL_artillery_modernisation: "火炮現代化"
 POL_artillery_modernisation_desc: "我們決不能忽視對火炮進行改進或現代化升級的重要性，這能為我軍士兵提供更有效的支援。"
 POL_anti_tank_guns: "反坦克槍炮"
 POL_anti_tank_guns_desc: "鑑於任何敵人都肯定會動用坦克來對付我們，我們必須為他們備下“熱烈的歡迎”。"
 POL_army_modernisation: "軍隊現代化"
 POL_army_modernisation_desc: "現代化的裝備，配上現代化的士兵！"
 POL_air_base_expansion: "擴建空軍基地"
 POL_air_base_expansion_desc: "空軍基地之於空中支援，正如空中支援之於現代戰爭般重要。"
 POL_fighter_modernisation: "戰鬥機現代化"
 POL_fighter_modernisation_desc: "戰鬥機作為空軍的中流砥柱，性能上絕不能落後。隨著我國空軍其餘機種紛紛趕上時代，戰鬥機也必須現代化。"
 POL_air_innovations: "空軍改革"
 POL_air_innovations_desc: "航空領域的戰略戰術仍有改進空間。"
 POL_heavy_fighter_concept: "重型戰鬥機概念"
 POL_heavy_fighter_concept_desc: "如果我們不得不發起攻勢，一種能在漫長戰線上巡航的新式戰機則必不可少。"
 POL_naval_bomber_experiments: "海軍轟炸機實驗"
 POL_naval_bomber_experiments_desc: "制空權在陸地與海面上都很重要，專門用於海戰的戰機有助於我們爭奪海上制空權。"
 POL_medium_bomber_focus: "重視中型轟炸機"
 POL_medium_bomber_focus_desc: "精確轟炸理論的發展，能夠指導延長執行支援任務時的航程。"
 POL_light_bomber_focus: "重視輕型轟炸機"
 POL_light_bomber_focus_desc: "俯衝轟炸機在近距支援上的價值不應被低估。"
 POL_air_modernisations_programme: "空軍現代化方案"
 POL_air_modernisations_programme_desc: "航空理論與技術同等重要，我軍飛行員仍有潛力發掘更多的新戰略。"
 POL_rocket_development: "發展火箭"
 POL_rocket_development_desc: "速度在所有性能指標中位列第一，火箭和噴氣發動機在理論上可以允許我們突破之前的速度紀錄。"
 POL_develop_polish_ship_building: "發展波蘭造船業"
 POL_develop_polish_ship_building_desc: "但澤已無可挽回地為納粹黨的邪惡政權所篡奪，波蘭貿易必須另闢蹊徑以顛覆納粹對我國經貿的限制。我們可能永遠無法收復格但斯克，但也許格丁尼亞可以成為與一個之相媲美的大海港。"
 POL_study_foreign_built_ships: "研究英國軍艦設計"
 POL_study_foreign_built_ships_desc: "幾十年來，英國海軍一直支持著波蘭的海域，但其最近的綏靖政策讓波蘭危機重重，無所指望。通過研究英國的軍艦設計，我們或有能力開始生產一樣強勁且宏偉的艦艇。"
 POL_a_cruiser_navy: "巡洋海軍"
 POL_a_cruiser_navy_desc: "我們需要噸位更大的艦船，以此實現我國海軍的存在艦隊方案。"
 POL_import_submarine_technology: "“鷹”行動"
 POL_import_submarine_technology_desc: "現代海戰不僅發生在海面之上，波濤之下亦是危機四伏。我們若想與德國U型潛艇匹敵，就必須設計並實裝波蘭自研的潛艇。"
 POL_commerce_attack: "商船襲擾戰略"
 POL_commerce_attack_desc: "潛艇是非常規的海軍，需要特定戰術加以有效利用，這樣就能和其它艦種一樣為國效力。"
 POL_the_twin_threats: "重啟海軍現代化"
 POL_the_twin_threats_desc: "既然海岸線現已重歸我手，海軍現代化即可著手重啟。勝利將來自於在投產前，先行研究海戰戰略。"
 POL_coastal_defense: "適度現代化"
 POL_coastal_defense_desc: "作為海岸線的經濟劣勢國家，海軍現代化必須適度。驅逐艦是一種保護海岸線的廉價而有效的方式，我們對此力所能及。"
 POL_strike_force: "巨龍野心"
 POL_strike_force_desc: "迄今為止，波蘭海軍在現代化的努力中一直是適度且軟弱的，但到此為止了。一條偉大的波蘭巨龍將掀起巨浪，當天際線上的龐然大物一樣升起時，德意志和俄羅斯都會因她的咆哮而顫抖！"
 POL_baltic_navy: "波羅的海守護者"
 POL_baltic_navy_desc: "我們的陸地禁止敵人通行，我們及盟友的海岸也禁止敵人登陸。波羅的海屬於波蘭，任何外來勢力都不得插手干預。"
 POL_strengthen_the_polish_state: "團結波蘭"
 POL_strengthen_the_polish_state_desc: "分裂不可容忍，我們的力量因在參議院和眾議院的團結一致而愈加強大。"
 POL_defensive_focus: "重視防禦"
 POL_defensive_focus_desc: "我們不會主動發起下一場戰爭，但得確保能夠打贏。"
 POL_polish_militarism: "波蘭軍國主義"
 POL_polish_militarism_desc: "我們在以前的戰爭被打敗了，但從未被打倒。士兵愈加勇猛，軍官愈加精進，我們將再次崛起。"
 POL_polish_revanchism: "波蘭復仇主義"
 POL_polish_revanchism_desc: "很少有國家像我們一樣，在如此短的時間內失去如此之多。若正義尚奄奄一息，我等將不擇手段予以扶正。"
 POL_poland_first: "波蘭優先"
 POL_poland_first_desc: "國家利益必須優先於所謂“真理”。我們掌握了自己的命運，也必須掌握自己的事實。"
 POL_ideological_fanaticism: "民族主義教育"
 POL_ideological_fanaticism_desc: "無數年輕人在全國各地的大學就讀，而這是將我們共同為之奮鬥的波蘭夢融入他們心中的絕佳機會。應該鼓勵年輕人成為愛國者與戰士，以此鑄就波蘭夢的堅不可摧堡壘！"
 POL_the_between_the_seas_concept: "海間理念"
 POL_the_between_the_seas_concept_desc: "約瑟夫·畢蘇斯基有一個建立從海洋到海洋的國家聯盟的野心。波蘭、羅馬尼亞、前聯邦構成國，甚至意大利都在共同努力，以確保在互不影響主權的同時繼續共存。現在，我們有能力實現畢蘇斯基的偉大願景。通過接觸羅馬尼亞，我們將邁出通往海間聯邦的第一部！"
 POL_treaty_with_lithuania: "與立陶宛的條約"
 POL_treaty_with_lithuania_desc: "舊怨已逝，前路黑暗，我等將攜手砥礪前行。"
 POL_the_baltic_alliance: "與波羅的國家結盟"
 POL_the_baltic_alliance_desc: "朋友永遠不嫌多。"
 POL_internationalism: "國際主義"
 POL_internationalism_desc: "敵人的敵人就是我們的朋友。"
 POL_authoritarianism: "威權主義"
 POL_authoritarianism_desc: "民主解決不了迫切棘手的問題。集權才能辦成大事。"
 POL_paramilitarism: "準軍事組織"
 POL_paramilitarism_desc: "軍隊之外也應該進行軍事化訓練。隨著社會的軍事化程度加深，每個公民都能隨時拿起武器戰鬥。"
 POL_go_right: "向右轉"
 POL_go_right_desc: "強權即是真理。鄰國已經接受了這個事實，我們也必須跟上。"
 POL_military_youth: "青年軍"
 POL_military_youth_desc: "通過招收我國的年輕人，對其進行組織紀律和意識形態教育，從而培育我國未來的忠誠戰士。"
 POL_seek_accommodation_with_germany: "尋求對德和解"
 POL_seek_accommodation_with_germany_desc: "既然相似多於分歧，為何仍要鬥爭不休？"
 POL_go_left: "向左轉"
 POL_go_left_desc: "只有團結我們的人民，才能戰勝我們的敵人。"
 POL_political_commissars: "政治委員"
 POL_political_commissars_desc: "軍隊需要設立政委，堅持黨指揮槍的原則不動搖，才能牢牢掌控軍隊。"
 POL_seek_accommodation_with_USSR: "尋求對蘇和解"
 POL_seek_accommodation_with_USSR_desc: "蘇聯和我們一樣不想打仗。也許，我們不必流血就能化解歷史恩怨。"
 POL_liberalism_focus: "自由主義"
 POL_liberalism_focus_desc: "暴君或獨裁者都不能讓我們屈服。永遠不要忘記，一個國家應該且只應該為其人民服務。"
 POL_intervention_focus: "重視干涉"
 POL_intervention_focus_desc: "如果我們重視自由，那不僅需要保護好自己的自由，也應該保護其他國家的自由。如果這意味著戰爭，就讓它來吧！"
 POL_draw_closer_to_britain: "親近英國"
 POL_draw_closer_to_britain_desc: "英國致力於保護我國的獨立，改善兩國關係是必要之舉。"
 POL_volunteer_corps: "志願軍"
 POL_volunteer_corps_desc: "不願則無自由，否則就是一種嘲弄。然而，那些志願選擇拿起武器為自由而戰的人，必須獲取得以實現目的之手段。"
 POL_militarism_focus: "波蘭軍國主義"
 POL_authoritarianism_focus: "威權主義"
 POL_polish_revanchism_focus: "波蘭復仇主義"
 POL_slavic_revanchism: "波蘭復仇主義"
 POL_internationalism_focus: "國際主義"
 POL_invite_to_faction_tooltip: "被邀請加入[Root.GetFlag]§Y[Root.GetName]§!的陣營。\n"
 POL_central_defence_of_poland: "波蘭中央防禦"
 POL_central_defence_of_poland_desc: "波蘭缺乏抵禦無數邊境威脅所需的裝備。擴張國防部的職能將使我軍裝備更加精良，抗擊任何試圖蹂躪波蘭領土的敵人。"
 POL_modernize_congressional_factories: "前議會波蘭工業現代化"
 POL_modernize_congressional_factories_desc: "會議波蘭地區坐擁冠絕全波蘭的發展潛力，曾是我國最強大、最團結的地區。通過對華沙這樣的主要城市進行現代化改造，我們將有望使會議波蘭地區轉變為我國的工業心臟。"
 POL_expand_katowice_mines: "擴大卡托維茲資源開發"
 POL_expand_katowice_mines_desc: "儘管面積相對較小，上西里西亞仍然蘊藏有豐富的鋼鐵和鋁資源。雖說控制整個西里西亞不太現實，但我們必須從現在開始就全力挖掘上西里西亞的工業潛力。"
 POL_abolish_segregated_seating: "廢除種族隔離坐席制"
 POL_abolish_segregated_seating_desc: "儘管在教育中保留著坐席隔離糟粕，但波蘭仍然是不同種族、文化和信仰的人們交融共生的典範。如果大家都認同波蘭公民身份，那理應自由地來往相處與交流思想。種族隔離是我國教育事業中雖小但切實存在的阻礙，必須予以廢除。"
 POL_agrarian_reform: "農業改革"
 POL_agrarian_reform_desc: "農民罷工迫在眉睫。食品價格在全國瘋漲，不平衡的工業體系和缺乏效能的政府使得波蘭最貧窮的人缺乏幫助，這導致了農民的極大不安。但是，只要有足夠的投入和改革，我們應該能夠完全滿足農民的需求。"
 POL_invest_in_eastern_poland: "投資東波蘭"
 POL_invest_in_eastern_poland_desc: "東部既貧瘠又荒涼，無論是俄羅斯還是波蘭國家都從未留心過這個地區。若要對此投資，我們可以找到很多理想的工廠位置，也能為工人提供就業崗位。"
 POL_complete_the_plan: "完成四年計劃"
 POL_complete_the_plan_desc: "是時候回顧四年計劃的成果，為波蘭工業化的下一個四年做準備了！我們對波蘭的工業投資越多，就能更好地應對我國工業體系的潛在短板。"
 POL_woo_the_sanation_generals: "拉攏薩納齊亞將領"
 POL_woo_the_sanation_generals_desc: "親薩納齊亞的軍官對政權心存不滿，缺乏忠誠。有人會說，薩納齊亞氣焰如此囂張，若是不清洗軍官，恐怕後患無窮。但這些人實在是太過重要了。"
 POL_sanationist_army: "薩納齊亞軍隊"
 POL_sanationist_army_desc: "隨著一位忠誠的薩納齊亞運動高級指揮官處在了我方控制下，是時候在軍隊中發揮利用這位老兵的經驗了。"
 POL_purge_the_sanation: "清除薩納齊亞"
 POL_purge_the_sanation_desc: "薩納齊亞的將軍們既善變又不忠，事實證明，比起波蘭國家，他們更願意忠於自己的私心。我們必須把所有涉及薩納齊亞政變的將軍們從我軍指揮高層中清除出去！"
 POL_appoint_new_officers: "任命新軍官"
 POL_appoint_new_officers_desc: "既然那些不忠的將軍們已被清除出軍隊，我們就有機會授權給那些真正心繫波蘭主權，而非苟且於城堡派，左派和右派的人們。"
 POL_new_military_academy: "新軍事學院"
 POL_new_military_academy_desc: "我們的指揮中樞變得寥落而空蕩，但這是一個為了未來播種的黃金時機：確保未來的將軍們忠於我們的國家且深諳戰爭之道。通過在全國範圍內資助軍事院校，我們將確保新的波蘭軍官具有比他們任何前輩都高的才幹。"
 POL_attract_foreign_motors: "吸引外國汽車公司"
 POL_attract_foreign_motors_desc: "雖然一些人認定LRL的原設計就是波蘭機械化裝備的未來所在，但問題是，如果我們只需要調整現有的設計就可以滿足需求，為什麼還要費時費力的去從頭研究呢？外國的汽車公司早已掌握了讓材料更便宜更堅固且製造更快的工藝，因此邀請他們來設計裝備似乎是個更明智的選擇。"
 POL_adaptive_designs: "適應性設計"
 POL_adaptive_designs_desc: "維持從外國獲得的設計商許可對我們的國家來說是一筆龐大的開支，但也許有一些方法可以讓我們將軍事設計重新用於私營部門。通過將一部分材料分配給企業，我們可以降低僱傭這些外國設計商的花費。"
 POL_complete_april_constitution: "完成四月憲法"
 POL_complete_april_constitution_desc: "四月憲法是一系列旨在將波蘭改革為一個總統領導下更加集權專制國家的改革。薩納齊亞政府由此得以合法化，但仍有一些人懷念從前的體制。四月憲法必須得以完善，以進一步擴大[GetAppropriateLeaderNameInBookmark]的權力，建立中央集權的波蘭國家！"
 POL_consolidate_sanation_government: "鞏固薩納齊亞政府"
 POL_consolidate_sanation_government_desc: "自約瑟夫·畢蘇斯基去世以來，薩納齊亞政府四分五裂，分崩離析。政府被割裂成三個派系：城堡派，薩納齊亞左派與薩納齊亞右派。尚不確定城堡派能否維持其獨裁控制，但為了抵禦迫在眉睫的戰爭風暴，政府必須儘快擺脫這種動盪不安的狀態。"
 POL_the_castle: "城堡派"
 POL_the_castle_desc: "城堡派代表了在伊格納齊·莫希奇茨基領導下在華沙王宮城堡的官員們。他們是保守現狀的堅定支持者，支持駐地在城堡的政府，試圖保持國家穩定並防止左右派的薩納齊亞篡取煽動政變之必要基礎。"
 POL_eliminate_socialist_parties: "消滅社會主義黨派"
 POL_eliminate_socialist_parties_desc: "社會主義意識形態在世界上快速 傳播，但其根本上與城堡派政府的理念不容。左翼不僅作為農業與社會民主黨派上反對我們，還幹出了賣國的共產黨行徑。為了波蘭國家持久的穩定與安全所計，我們不接受任何形式的社會主義，一切社會主義黨派必須被查禁。"
 POL_dissolve_the_sejm: "解散波蘭眾議院"
 POL_dissolve_the_sejm_desc: "波蘭眾議院始終在薩納齊亞政府的庇護下苟且維續，僅作為曾經的波蘭民主之象徵。然而，現在是時候剝奪波蘭眾議院的一切權力，並將轉授給參議院和城堡派的參議員了。"
 POL_promote_chemical_industry: "支持化學工業"
 POL_promote_chemical_industry_desc: "在投身於薩納齊亞運動之前，伊格納齊·莫希奇茨基是一位知識分子和化學家。現今已成為波蘭國家總統的他，也許能夠大力支持波蘭的化學工業和該領域的理論研究。"
 POL_camp_of_national_unity: "維持獨裁政權"
 POL_camp_of_national_unity_desc: "薩納齊亞的左右派將不再對政府產生威脅，剩下的就是正式解散這幫殘兵敗將，以此擁護伊格納齊·莫希奇茨基的領導，將波蘭引向一個更加美好的未來。"
 POL_the_sanation_left: "薩納齊亞左派"
 POL_the_sanation_left_desc: "薩納齊亞左派忠於瓦萊雷·斯瓦韋克，並認為斯瓦韋克是畢蘇斯基真正的繼任者，他們嘗試與反對派尋求和解，而不是像右派和城堡派那樣將反對者完全排除在政府之外。雖然與他們的合作極有可能會惹惱薩納齊亞右派，但我們需要左派人士手中的內部權力來建立一個可靠的部門內閣。"
 POL_modus_vivendi: "妥協手段"
 POL_modus_vivendi_desc: "薩納齊亞左翼分子尋求與反動派取得通融；待時機成熟給予他們政府內的權力席位。然鵝當反動派成員有了足夠的權利，被拋棄是不可避免的。"
 POL_draft_a_new_constitution: "起草新憲法"
 POL_draft_a_new_constitution_desc: "長久以來，斯瓦韋克一直抱有修憲的野心。若賦予他這麼做的權限，我們對波蘭國家的控制將更加直接，並進一步完善四月憲法。"
 POL_department_for_home_defence: "國土防衛部"
 POL_department_for_home_defence_desc: "長久以來波蘭在兩條邊界上都缺乏國防實力。現在通過建立國土防衛部，我們將得以有辦法去保家衛國。"
 POL_legion_of_merit: "榮譽軍團勳章"
 POL_legion_of_merit_desc: "作為瓦列裡-斯瓦韋克的構想，榮譽軍團勳章將向任何對國家有突出貢獻的共和國公民授予特權地位。該勳章將保證個人在參議院擁有席位，因此無論是誰被邀請加入軍團，都肯定沒有理由對我們的政權不滿。"
 POL_the_left_chairman: "左派國家主席"
 POL_the_left_chairman_desc: "薩納齊亞左右兩派在意識形態上勢同水火，無法調和。雖然我們也許能從右派的改革中中收點蠅頭小利，但真正把波蘭放在心上是左派。通過賦予他們更大的權力，我們或許能將右派徹底邊緣化。"
 POL_common_organization_of_society: "普羅大眾會"
 POL_common_organization_of_society_desc: "斯瓦韋克早有野心，想用一個被他稱之為“普羅大眾會”的權力結構取代無黨聯盟。唯有這個結構可以在賦予波蘭各州和鄉鎮極大自治權的同時，將政府凝聚在一個強大的威權政體內並準備好在戰時干涉地方管治。左翼當政，斯瓦韋克或許終將實現他的野心。"
 POL_dissolve_the_bbwr: "城堡派的新王"
 POL_dissolve_the_bbwr_desc: "左派在獨裁政府中變得如此強勢，以至於莫希奇茨基充其量已是個象徵性的總統。現在我們只需要讓左派走上臺前，並從政府中清除掉城堡派的殘垣斷壁，將斯瓦韋克推向國家權力的巔峰。"
 POL_the_sanation_right: "薩納齊亞右派"
 POL_the_sanation_right_desc: "薩納齊亞右派是愛德華·雷茲-希米格維的追隨者，其成員多由將軍和高級軍官組成。手握軍政大權的右派控制了政府的主要職位，通過賦予權力與讓步可以讓右派繼續保持忠誠，且有可能將他們併入城堡派。"
 POL_support_right_paramilitaries: "支持右派準軍國主義"
 POL_support_right_paramilitaries_desc: "波蘭政治格局中的法蘭德斯派經常被描述為狂熱、法西斯，甚至可以與納粹相提並論，但他們的言論對波蘭的愛國主義者充滿吸引力，耶日·魯特科夫斯基提議建立一支由願意為波蘭的獨立而戰鬥和犧牲的青年志願者組成的準軍隊。"
 POL_codify_national_unity: "將民族團結陣營編入法典"
 POL_codify_national_unity_desc: "民族團結陣營代表著薩納齊亞右派與城堡派的共同利益，迄今為止該政黨的政策和目標尚未明確。然而，我們可以通過修改四月憲法來將民族主義，法律，秩序與反對共產主義的價值觀刻在我們共和國的根基上。"
 POL_second_man_of_the_state: "國家二把手"
 POL_second_man_of_the_state_desc: "薩那齊亞左派已經被充分邊緣化，現在希米格維和莫希奇茨基可以徹底清除左派的影響力。希米格維將成為“二號人物”，意味著在戰爭時期，莫希齊茨基必須將他的總統席位讓給薩納齊亞右派與軍隊。"
 POL_ozon: "民族團結陣營（OZN）的勝利"
 POL_ozon_desc: "儘管協議要求莫希奇茨基在戰爭時期交出他的席位，但很明顯，邊境上的迫在眉睫的威脅超出了我們的抵擋能力。在希米格維掌控了國家後，我們的軍隊和文職政府將合為一體，並隨時準備好與任何敢於威脅波蘭主權的人戰鬥到底。"
 baltic_security_opinion: "保護波羅的海的安全"
 POL_align_with_the_west: "與西方結盟"
 POL_align_with_the_west_desc: "英國，法國以及其他西方國家是波蘭主權的忠實捍衛者，我們應該儘可能的與他們保持良好關係。"
 POL_lithuanian_ultimatum: "對立陶宛最終通牒"
 POL_lithuanian_ultimatum_desc: "多年來，我們在官面上與立陶宛處於戰爭狀態，儘管維爾紐斯被吞併時，根本沒有人採取過激的行動。隨著德國在整個歐洲大陸掀起的腥風血雨，僅僅用戰爭威脅就能得到想要的東西，也許我們可以對立陶宛做同樣的事情；為了我們兩個國家的利益，必須立刻結束這種軍事敵對態勢。"
 POL_lithuanian_alliance: "聯合立陶宛"
 POL_lithuanian_alliance_desc: "我們已同北方舊敵握手言和，現在則必須學會如何作為朋友共同前進。我們有著共同的敵人和盟友，立陶宛自然也應同我們結盟。"
 POL_lithuanian_annexation: "要求合併立陶宛"
 POL_lithuanian_annexation_desc: "德奧合併已經證明，捎帶一點威脅性的聲索即可恢復舊日聯盟。也許可以提議說，如果立陶宛依附於一個強大的國家，其國民可能會更安全……舉個例子，波蘭。"
 POL_restore_the_sejm: "恢復波蘭眾議院"
 POL_restore_the_sejm_desc: "我們必須承認，實行四月憲法是個錯誤，而當務之急是立刻予以修正。權力必須迴歸到眾議院的手中，同時也要通過更民主手段決定我們國家的未來。"
 POL_plan_west: "西部計劃"
 POL_plan_west_desc: "軸心國的威脅近在眼前。儘管政府內部的一些人時常認為自己和[GER.GetLeader]的關係非常親近，但我們仍然堅信德國不可信任。為了波蘭的未來，我們必須向西進行領土擴張。"
 POL_the_prusya_line: "普魯士防線"
 POL_the_prusya_line_desc: "東普魯士是德國入侵的關鍵點，我方在此的防衛也有重大缺口。通過擴建沿普魯士邊境的要塞，我軍將更有力地抵禦北方的威脅。"
 POL_invest_anti_air: "投資防空炮"
 POL_invest_anti_air_desc: "我國在飛行器的產量可能比不上德國，但這並不是必須的。相反，我們將在地上投產一批防空武器。只要每個地區都安排上了博福斯防空炮，德國飛行員飛不太遠就會撞見我們的炮火。"
 POL_the_prusya_army: "普魯士駐防"
 POL_the_prusya_army_desc: "我國與普魯士的邊境並未設防。若沒有部隊把手要塞，我們在普魯士邊境的一切投入都會打了水漂。"
 POL_expand_poznan_forts: "擴建波茲南要塞"
 POL_expand_poznan_forts_desc: "波茲南已建有大量堡壘和防禦結構，但仍有很多改進空間。波茲南是禦敵的第一道防線，必須不計代價予以強化。"
 POL_local_western_plans: "西部地區計劃"
 POL_local_western_plans_desc: "波德邊境一帶有一系列重要戰略地區。在當地開展全面計劃並在適當的時候執行，對於波蘭國家的持續生存和更長遠的戰爭規劃都很必要。"
 POL_sudeten_mountaineers: "蘇臺德山地軍"
 POL_sudeten_mountaineers_desc: "臨近蘇臺德的邊境並不安全，但也給予我們獨特的防守姿態。通過山地戰訓練，我們將能在扎奧爾傑高山上智取德軍。"
 POL_complete_plan_west: "完成西部計劃"
 POL_complete_plan_west_desc: "針對與德國不可避免的衝突，波蘭軍隊高層對這一充分的計劃十分滿意。西部計劃業已告結。"
 POL_sabotage_polish_industry: "破壞波蘭工業"
 POL_sabotage_polish_industry_desc: "我們的敵人擁有著遠比我們強大且更龐大的軍隊。雖然我們應該相信我們不會失敗，但事實是我們不可能永遠堅持下去。通過在我們的工廠和鐵路上安放爆破物，也許我們能確保它們在被敵人佔領時毫無用處。"
 POL_plan_east: "東部計劃"
 POL_plan_east_desc: "幾個世紀以來，我們一直與俄羅斯人有著大大小小的軍事衝突，且我們幾乎可以肯定[SOV.GetLeader]會像[SOV.GetLeader.GetHerHis]的祖輩那樣試圖入侵波蘭。這次我們必須讓他們折戟沉沙，必須制定計劃以確保波蘭對[SOV.GetNameDef]的絕對勝利！"
 POL_eastern_conscripts: "東部徵募"
 POL_eastern_conscripts_desc: "儘管相比于波蘭人，許多東部的人更認為自己是烏克蘭人或者白俄羅斯人，但仍需說服他們去戰鬥!儘管我們發現願意為了波蘭而戰的人並不多，但他們之中會有無數的人前赴後繼的拿起武器對抗[SOV.GetAdjective]!"
 POL_belorussian_army: "白俄羅斯軍隊"
 POL_belorussian_army_desc: "在白俄羅斯境內有大量的獨立軍事組織有意對抗[SOV.GetNameDef]，我們要做的是承認他們的正式地位並且派遣軍事指揮官給他們，"
 POL_ruthenian_army: "魯塞尼亞軍隊"
 POL_ruthenian_army_desc: "就像在波蘭人和烏克蘭人中一樣，反[SOV.GetAdjective]情緒在東部極為常見。通過資金和軍事支持，這些準軍事主義者將很快成為我們軍隊的後備軍力"
 POL_fortification_of_belarus: "北部要塞"
 POL_fortification_of_belarus_desc: "東波蘭的北部是一大片荒無人煙的茂密森林。這種情況不能再繼續下去了，為了應對入侵的威脅，這些森林必須被改造成抵禦布爾什維克的屏障。"
 POL_fortification_of_ukraine: "烏克蘭要塞"
 POL_fortification_of_ukraine_desc: "東部主要是落後農業經濟，而且波蘭屬烏克蘭仍是南波蘭首當其衝的軟肋。必須沿邊境線修建一些基礎防禦工事，以此保衛我們的祖國！"
 POL_supply_the_rail_nexus: "鐵路補給中心"
 POL_supply_the_rail_nexus_desc: "波蘭東部的鐵路系統和中部相比不甚理想。與[SOV.GetNameDef]作戰的成敗關鍵在於補給調配，為我軍維持狀況良好的供給鏈可以是個不錯的開始。"
 POL_local_eastern_plans: "東部地區計劃"
 POL_local_eastern_plans_desc: "我們的軍官十分值得信任，他們有能力獨立草擬各項計劃，但在現在這樣的戰爭中，對於細節的直接干預更加必要。若想阻止[SOV.GetAdjective]的帝國主義霸權，每一寸土地都至關重要。即使是最小的衝突，我們也都必須嚴陣以待。"
 POL_complete_plan_east: "完成東部計劃"
 POL_complete_plan_east_desc: "針對與[SOV.GetAdjective]不可避免的衝突，波蘭軍隊高層對這一充分的計劃十分滿意。東部計劃業已告結。"
 POL_prepare_for_the_inevitable: "人事已盡，天命難違"
 POL_prepare_for_the_inevitable_desc: "抵抗人事已盡，失敗不可避免。是時候承認了，波蘭已經不復存在，但波蘭精神沒有滅亡。即使在流亡中，波蘭精神始終與我們同在。有了盟國足夠的支持，我們將有能力建立一支流亡軍，支持仍在國內抵抗敵佔的同志們。"
 POL_foreign_air_support: "外國空軍支援"
 POL_foreign_air_support_desc: "在我們盟友的援助下，我們仍有能力部署一支強力的波蘭空軍。對流亡的波蘭空軍來說，購置工廠和裝備僅僅只是開始！"
 POL_foreign_army_support: "外國陸軍援助"
 POL_foreign_army_support_desc: "每天都有大量從波蘭而來的難民加入我們的隊伍，只需要提供一支步槍，他們將隨時準備好為了祖國衝上任何一座山峰。而我們需要做的則是請求控制盟友更多的工業"
 POL_aces_in_exile: "流亡飛行員"
 POL_aces_in_exile_desc: "敵人也許佔領了我們的國土，但我們最好的飛行員們在天空翱翔，鼓舞著士兵們前仆後繼地向家鄉推進！"
 POL_foreign_naval_support: "外國海軍援助"
 POL_foreign_naval_support_desc: "我們所剩無幾的海軍正處於令人悲傷的狀態。即使我們或許永遠無法重塑過去海軍的輝煌，但我們盟友的援助也許能讓波蘭的水手們從海上給予盟友一些幫助。"
 POL_resistance_industries: "抵抗工業"
 POL_resistance_industries_desc: "儘管家園已然淪陷，但我們仍需要強大的工業基礎來支持波蘭情報部門的擴展，並重新發展我們從敵人手中奪回的土地。"
 POL_exile_industries: "流亡工業"
 POL_exile_industries_desc: "隨著逃離家鄉越來越久，我們需要全力發展流亡生產基地，為反擊戰做好準備。"
 POL_expand_polish_intelligence: "擴張波蘭情報部門"
 POL_expand_polish_intelligence_desc: "隨著我軍慘遭擊潰，敗退並被迫轉入地下，波蘭只能被迫在陰影中進行抵抗。如果目前重踏故土的希望十分渺茫，那我們就必須得優先發展波蘭的情報部門"
 POL_pomscimy_wawer: "為瓦韋復仇"
 POL_pomscimy_wawer_desc: "傳言到，在華沙的大街小巷裡，抵抗組織正在準備一次對敵人的大膽行動。全城大大小小的牆上塗上了危險的標語，向敵人昭示者我們的復仇決心。雖然困難，但這次起義可能是我們最終回家並對敵反擊不可或缺的動力。抵抗組織需要波蘭高層進行一些組織安排，願他們能夠成功……"
 POL_the_long_push_home: "長路歸鄉"
 POL_the_long_push_home_desc: "起義成功了！現在要做的就是堅持下去直到救援到達。與親眼目睹了敵人在淪陷區的殘暴與恐怖的人民一起，波蘭軍隊將再次抵抗四十倍於我軍的敵人！而這一次，我們將與敵人奮戰到底！"
 POL_the_north_sea: "守望北海"
 POL_the_north_sea_desc: "在開始考慮把北方的中立國拉入聯盟之前，我國必須在全球外交舞臺上產生一定影響力。我們必須讓北方國家意識到我國渴望合作的意願，並把舌燦金蓮的約瑟夫·貝克派到北歐國家，使其相信加入海間聯邦擁有諸多好處。"
 POL_finno_polish_pact: "芬波條約"
 POL_finno_polish_pact_desc: "芬蘭的情況與我國分外相似：東側守著與[SOV.GetAdjective]漫長的國境線，而後者只想著如何再次把我們兩國並進其帝國中。這樣看來，芬蘭是海間聯邦在北歐國家中擴張最理想的候選人。"
 POL_invite_denmark: "邀請丹麥"
 POL_invite_denmark_desc: "丹麥雖小，卻控制著波羅的海的重要戰略區域——丹麥海峽。若與丹麥結盟，我們就能保證出入波羅的海的通道。我們只需相信丹麥自己能抗住其跟前的威脅。"
 POL_invite_sweden: "邀請瑞典"
 POL_invite_sweden_desc: "在這個衝突不斷加劇的時代，瑞典人奉行著有趣的中立理念。也許我們可以說服其外交部長，告訴他海間聯邦是世上所有聯盟中最中立的，而這種共同提供的防禦是他們阻止列強直接干預的最佳機會。"
 POL_invite_norway: "邀請挪威"
 POL_invite_norway_desc: "毫無疑問，德國對挪威有所打算，後者國內甚至也有一幫人已經準備好與未來的外國入侵者合作。只是多發幾封海間聯邦的邀請函，我們就能給挪威提供有尊嚴的抵抗而非向德國屈服這一獨一無二的機會。"
 POL_the_mediterranean: "直到地中海"
 POL_the_mediterranean_desc: "在波蘭和地中海之間有一群被惡狼盯上的綿羊。南斯拉夫、奧地利，甚至希臘和土耳其都是待西方諸強所瓜分的獵物。我們必須使巴爾幹等地區的所有國家意識到，我國有著保護其主權及其人民安全的迫切願望。只有這樣，正式的保護能被落實，海間聯邦得以擴張。"
 POL_coerce_czechoslovakia: "守衛捷克斯洛伐克"
 POL_coerce_czechoslovakia_desc: "捷克和斯洛伐克于波蘭如同手足，保護他們不僅符合我們的我最高利益，亦屬道義之必要。"
 POL_austro_hungarian_alliance: "聯合奧匈"
 POL_austro_hungarian_alliance_desc: "雖然奧匈帝國一度瓜分了波蘭，但他們現在同我們一樣，都成了德國的靶子。對他們來說，屈服似乎不可避免。但如果存在另一個選擇，他們可能不會那麼衝動地把自己的國家賣給[GER.GetLeader]。"
 POL_protect_yugoslavia: "保護南斯拉夫"
 POL_protect_yugoslavia_desc: "南斯拉夫一直不在狀態，也是其鄰國入侵的首選目標。我們得邀請他們加入海間聯邦，保衛其免受國內外敵人的滋擾。"
 POL_invite_greece: "邀請希臘"
 POL_invite_greece_desc: "希土矛盾重重，而海的對面是意大利。希臘無疑會得益於我們的保護。"
 POL_control_the_bosporus: "控制博斯普魯斯海峽"
 POL_control_the_bosporus_desc: "如果我們沒法讓軍隊和艦艇自由通行博斯普魯斯海峽的話，與羅馬尼亞的盟約就沒有了意義。土耳其處在在我國的戰略利益節點上，必須把他們拉進聯邦裡。"
 POL_italian_alliance: "聯合意大利"
 POL_italian_alliance_desc: "意大利政府毫無疑問是海間聯邦所代表的自決理念之敵，但如兩國政府如果願意對內進行適當的改革，或許我們能夠在對歐洲未來的願景上保持一致。"
 POL_anti_blitz_vehicles: "反閃電戰載具"
 POL_anti_blitz_vehicles_desc: "敵軍將試圖用裝甲洪流來沖垮我們。我們在坦克數目不太可能比得上敵軍，但可以投產專門設計用來破壞載具的武器，讓敵軍付出巨大代價。"
 POL_clamp_down_on_danzig: "在但澤戒嚴"
 POL_clamp_down_on_danzig_desc: "形式上，但澤是由波蘭保護的自由市。但近來這座城市已經深陷納粹控制，在事實上淪為阿道夫·希特勒的傀儡。這已演變成我國北境上的汙點，嚴重阻礙波蘭經貿發展。我們必須重新控制這座城市，否則就要被德國給奪去。"
 POL_attract_poles_to_gdynia: "格丁尼亞人口遷移"
 POL_attract_poles_to_gdynia_desc: "一個大港需要許多人員來運營，現在國內失業的波蘭人恰有許多。通過鼓勵他們遷移到格丁尼亞，我們或許可以進一步推進海港發展計劃。"
 POL_ban_the_nazi_party: "查禁納粹黨"
 POL_ban_the_nazi_party_desc: "我們已經在格但斯克已得到足夠多的民眾支持，可以正式開始清洗城中的納粹分子，為波蘭國家奪回這座城市！"
 POL_develop_gdansk_ship_building: "發展格但斯克造船業"
 POL_develop_gdansk_ship_building_desc: "格但斯克現已重回我國掌控，我們可以提供亟需的海軍投資，開始建設波蘭強大的波羅的海艦隊！"
 POL_expand_gdynia_seaport: "擴建格丁尼亞港口"
 POL_expand_gdynia_seaport_desc: "格丁尼亞現已發展成可以同但澤相媲美的貿易大城，剩下的工作就是將其正式開闢為貿易城市。我國的經濟將能且只能被我們自己控制！"
 POL_integrate_gdansk_industries: "整合格但斯克工業"
 POL_integrate_gdansk_industries_desc: "數十年來，格但斯克一直與我國若即若離，但這一情況很快就會改變。通過將格但斯克納入行政管轄，我們可以重新掌控我國的進出口商埠。"
 POL_expand_northern_rail: "修建北部鐵路"
 POL_expand_northern_rail_desc: "波蘭生產的所有商品都需要經由北部進行運輸，但那裡的基礎設施建設並不理想。我們必須在北部修築足夠的鐵路基建。"
 POL_join_allies: "加入同盟國"
 POL_join_allies_desc: "[Root.GetNameDef]的未來掌握在我國在西方的老盟友手中。雖然我們現在已經與同盟國捆在了一根繩上，但正式加入要求我們遵守對西方的承諾，並同時寄希望於西方國家同樣遵守對波蘭的承諾。"
 uncontrolled_exports: "經貿受限"
 uncontrolled_exports_desc: "外國幾乎完全控制了我國全部進出口貿易，導致我國處於實質的經貿受限狀態，無法同世界上的其他國家進行自由貿易。"
 POL_anti_german_offensive: "反德計劃"
 POL_anti_german_offensive_desc: "我們制定了在城市街道上圍殲德國的作戰計劃。"
 POL_anti_soviet_offensive: "反蘇計劃"
 POL_anti_soviet_offensive_desc: "波蘭軍隊已制定了高度針對性的計劃，以應對[SOV.GetAdjective]在該地區的攻勢。"
 POL_new_military_academy_idea: "新軍事學院"
 POL_looming_peasants_strike: "迫在眉睫的農民大罷工"
 POL_looming_peasants_strike_desc: "由於政府沒有對東部的嚴重落後狀況作出任何有效的應對措施，一場農民大罷工已經迫在眉睫。如果問題在年底前沒有得到解決，很有可能會在波蘭全國範圍內發生某種程度的動亂。"
 POL_great_peasants_strike: "農民大罷工"
 POL_great_peasants_strike_desc: "政府的不作為導致農村地區發生了大規模的抗議。警方治安維持已是杯水車薪，只會進一步刺激到抗議群體的情緒。若不迅速採取行動，這場大規模抗議很可能將演變成一場全面內戰。"
 POL_four_year_plan_idea: "四年計劃"
 POL_four_year_plan_complete_1: "四年計劃"
 POL_four_year_plan_complete_2: "四年計劃"
 POL_four_year_plan_complete_3: "四年計劃"
 POL_four_year_plan_complete_4: "四年計劃"
 POL_four_year_plan_idea_desc: "該國已在大規模工業化方面做出卓越努力。"
 POL_san_left_desc: "薩納齊亞左派支持改革，並認為瓦萊雷·斯瓦韋克是前任獨裁者約瑟夫·畢蘇斯基真正的繼承人。"
 POL_sanation_left_opposition_1: "輕微的左派反對"
 POL_sanation_left_opposition_1_desc: "[Root.GetLeftDesc]當下，薩納齊亞左派對政局的影響很小，很難威脅到政權的穩定。"
 POL_sanation_left_opposition_2: "中等的左派反對"
 POL_sanation_left_opposition_2_desc: "[Root.GetLeftDesc]當下，薩納齊亞左派正在政府中篡取權力，已有干預我們行政部門的日常運作的能力。"
 POL_sanation_left_opposition_3: "廣泛的左派反對"
 POL_sanation_left_opposition_3_desc: "[Root.GetLeftDesc]當下，薩納齊亞左派的勢力非常強大，完全隨時讓我們的行政部門陷入癱瘓。"
 POL_sanation_left_opposition_4: "激烈的左派反對"
 POL_sanation_left_opposition_4_desc: "[Root.GetLeftDesc]當下，薩納齊亞左派距離發動政變僅一步之遙。他們不願再被排擠和邊緣化，尚不清楚斯瓦韋克將怎麼做。"
 POL_san_right_desc: "政府右派主要由一群集結在愛德華·雷茲-希米格維身後的高級軍事官員組成。"
 POL_sanation_right_opposition_1: "輕微的右派反對"
 POL_sanation_right_opposition_1_desc: "[Root.GetRightDesc]目前，薩納齊亞右派對政府很滿意，對現政權威脅不大。"
 POL_sanation_right_opposition_2: "中等的右派反對"
 POL_sanation_right_opposition_2_desc: "[Root.GetRightDesc]當下，薩納齊亞右派與我們的關係略有緊張。他們將莫希齊茨基的命令更多地看做建議，而非嚴格的命令。"
 POL_sanation_right_opposition_3: "廣泛的右派反對"
 POL_sanation_right_opposition_3_desc: "[Root.GetRightDesc]當下，薩納齊亞右派認為獨裁政權正企圖動搖該派在軍隊權威，並開始在最高指揮部利用職權之便干預波蘭軍隊。"
 POL_sanation_right_opposition_4: "激烈的右派反對"
 POL_sanation_right_opposition_4_desc: "[Root.GetRightDesc]當下，薩納齊亞右派正在策劃發動一場政變，他們在軍隊中的勢力使其在政府中擁有很大的話語權。如果不盡快做出讓步，這幫右派很可能會將波蘭撕裂。"
 POL_april_constitution_1: "四月憲法"
 POL_april_constitution_1_desc: "波蘭眾議院於1935年通過了這項憲法，以此確保波蘭國家的和平穩定。這項憲法賦予了總統幾乎一切的權力，也給予了他對眾議院與參議院的絕對控制。"
 POL_april_constitution_2: "四月憲法"
 POL_april_constitution_2_desc: "波蘭眾議院於1935年通過了這項憲法，以此確保波蘭國家的和平穩定。這項憲法賦予了總統幾乎一切的權力，也給予了他對眾議院與參議院的絕對控制。"
 POL_april_constitution_3: "四月憲法"
 POL_april_constitution_3_desc: "波蘭眾議院於1935年通過了這項憲法，以此確保波蘭國家的和平穩定。這項憲法賦予了總統幾乎一切的權力，也給予了他對眾議院與參議院的絕對控制。"
 POL_april_constitution_4: "四月憲法"
 POL_april_constitution_4_desc: "波蘭眾議院於1935年通過了這項憲法，以此確保波蘭國家的和平穩定。這項憲法賦予了總統幾乎一切的權力，也給予了他對眾議院與參議院的絕對控制。"
 POL_april_constitution_5: "四月憲法"
 POL_april_constitution_5_desc: "波蘭眾議院於1935年通過了這項憲法，以此確保波蘭國家的和平穩定。這項憲法賦予了總統幾乎一切的權力，也給予了他對眾議院與參議院的絕對控制。"
 POL_april_constitution_left: "四月憲法"
 POL_april_constitution_left_desc: "波蘭眾議院於1935年通過了這項憲法，以此確保波蘭國家的和平穩定。這項憲法賦予了總統幾乎一切的權力，也給予了他對眾議院與參議院的絕對控制。"
 POL_april_constitution_right: "四月憲法"
 POL_april_constitution_right_desc: "波蘭眾議院於1935年通過了這項憲法，以此確保波蘭國家的和平穩定。這項憲法賦予了總統幾乎一切的權力，也給予了他對眾議院與參議院的絕對控制。"
 POL_april_constitution_dem: "四月憲法修正案"
 POL_april_constitution_dem_desc: "波蘭眾議院於1935年通過了這項憲法，以此確保波蘭國家的和平穩定。憲法修正案確保地方部分權利與特殊待遇的神聖不可侵犯，例如自治與民主權利等，儘管在國家層面，總統仍擁有對全國的絕對權力。"
 POL_april_constitution_dem_left: "四月憲法修正案"
