 POL_april_constitution_fas: "四月憲法修正案"
 POL_april_constitution_fas_desc: "波蘭眾議院於1935年通過了這項憲法，以此確保波蘭國家的和平穩定。憲法修正案使軍隊成為國內外一切事務的主權代表。此外，極端民族主義的長槍黨原則已被軍隊高層所接納，使兩者間僅剩技術上的區別。"
