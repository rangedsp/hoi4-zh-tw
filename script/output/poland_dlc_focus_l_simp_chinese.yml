 POL_april_constitution_fas_right_desc: "波蘭眾議院於1935年通過了這項憲法，以此確保波蘭國家的和平穩定。憲法修正案使軍隊成為國內外一切事務的主權代表。此外，極端民族主義的長槍黨原則已被軍隊高層所接納，使兩者間僅剩技術上的區別。"
 POL_walery_slawek_chairman: "左派主席"
 POL_edward_rydz_smigly_chairman: "軍委會主席"
 POL_right_paramilitarism_idea: "波蘭青年軍"
 POL_right_paramilitarism_idea_desc: "波蘭青年軍是由愛德華·雷茲-希米格維創立的組織，並由耶日·魯特科夫斯基這位長槍黨內舉足輕重的人物執掌。儘管該組織在明面上宣稱其目的是建立青年軍，但這確實有效地將法西斯主義灌輸進了年輕一代不可再塑的思想中。"
 POL_common_organization_of_society_idea: "普羅大眾會"
 POL_common_organization_of_society_idea_desc: "為了實現瓦萊雷·斯瓦韋克的雄心壯志，波蘭的社會結構經歷了重組。地方社區被賦予了更大的自治權，而總統則保持國家層面的絕對控制。"
 POL_eastern_conscription_idea: "東部徵兵"
 POL_eastern_conscription_idea_desc: "東波蘭的適役居民正在接受速成軍事訓練，以便在戰爭爆發時能在前線與[SOV.GetNameDef]交戰。"
 POL_expand_intelligence_idea: "擴張波蘭情報部門"
 POL_expand_intelligence_idea_desc: "隨著本土淪陷，波蘭或許只能寄希望於支持抵抗運動並通過秘密特工的暗中行動來干擾敵軍部署，從而重獲獨立。"
 POL_push_home_idea: "長路歸鄉"
 POL_push_home_idea_desc: "我們已經做好了滲透淪陷區並重奪祖國的準備，剩下的就是牢牢堅守，撐到盟軍抵達。"
 POL_segregated_seating_abolished: "廢除種族隔離坐席制"
 POL_segregated_seating_abolished_desc: "數十年來，波蘭教育中一直有著一套將不同種族背景的人隔離排座的制度。這個慣例現已廢除，我國正在創造一個真正文化多元的平等社會的道路上大步前進。"
 POL_national_defence_fund_idea: "國防經費"
 POL_national_defence_fund_idea_desc: "波蘭已在國防上已經進行了大筆投資，挪用民用領域的資本來建設軍用建築。"
 POL_central_defence_of_poland_idea: "波蘭中央防禦"
 POL_central_defence_of_poland_idea_desc: "該國專注於要塞建設與步兵裝備生產，目的在於迅速的國家軍事化。"
 POL_baltic_security: "波羅的海安保"
 POL_baltic_security_desc: "雖然依賴著西方的支持，但其對德國不斷的綏靖也我們懷疑，一旦遭到入侵，協約國是否真的會衝出戰壕來保護我們。也許通過擔保在東歐的友國，我們可以維持些許和平。"
 POL_protect_czechozlovakia: "保護捷克斯洛伐克"
 POL_protect_czechozlovakia_desc: "顯然[GER.GetLeader]對捷克斯洛伐克的命運有[Ger.GetLeader.GetHerHis]自己的一套算盤，定是個迫害捷克斯洛伐克民族獨立自主的勾當。這股帝國主義式的浪潮必須被遏止住。"
 POL_baltic_alliance_focus: "聯合波羅的海國家"
 POL_baltic_alliance_focus_desc: "波羅的海國家無疑會在波蘭淪亡後緊接著遭殃。因此，三國應該放下對波蘭國家的偏見，與我國站在一起，在共同邊界的兩側攜手抗敵。"
 POL_romanian_alliance: "聯合羅馬尼亞"
 POL_romanian_alliance_desc: "我們與羅馬尼亞保持著長期的海間的聯盟關係。雖然兩國在歷史上沒有什麼瓜葛，但現在已是正式邀請羅馬尼亞加入陣營，實現海間聯邦的雄心之時。"
 POL_baltic_ultimatums: "對波羅的海國家的最後通牒"
 POL_baltic_ultimatums_desc: "處理完立陶宛後，剩下的就是把北方從前屬於波蘭-立陶宛聯邦的國家納入我們日益壯大的帝國。其版圖如此之小，軍隊如此之弱，我們懷疑波羅的海國家是否真有勇氣拒絕我國的最後通牒。"
 POL_sea_to_sea: "從海洋到海洋"
 POL_sea_to_sea_desc: "我們的聯邦不僅是波蘭與立陶宛的聯合，更是從海洋到海洋、從波蘭到克里米亞的榮耀帝國。"
 POL_pan_slavic_revanchism: "泛斯拉夫復仇主義"
 POL_pan_slavic_revanchism_desc: "迄今為止，泛斯拉夫運動不過是俄羅斯對全體斯拉夫人宣稱霸權的一個接口，但這也有助於將各個斯拉夫民族團結為統一的國家，如南斯拉夫和捷克斯洛伐克這種精神的部分實現。波蘭為什麼要當例外？波蘭不也應該利用下這波泛斯拉夫主義浪潮嗎？"
 POL_the_old_borders: "中古邊界"
 POL_the_old_borders_desc: "幾個世紀以來，斯拉夫人一直居住於現被認為屬於日耳曼人的地區：波美拉尼亞、西里西亞和普魯士。幾個世紀以來，德意志帝國主義始終是波蘭國家和鄰近的斯拉夫民族的禍根。歷史錯誤須得糾正，是時候收回我們的祖地了。"
 POL_annex_czech: "吞併捷克斯洛伐克"
 POL_annex_czech_desc: "捷克斯洛伐克瑟縮在西方保護下，缺乏自衛能力。是時候將捷克和斯洛伐克兩個民族納入波蘭軍隊的保護之下了。"
