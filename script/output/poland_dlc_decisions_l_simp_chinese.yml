 POL_defensive_plans: "防禦計劃"
 POL_defensive_plans_desc: ""
 POL_defend_in_east_state: "[From.GetName]防禦計劃"
 POL_defend_in_east_state_desc: "東部偏遠落後，原始的大自然是這片地區的支配者。因此我們訓練士兵時需要注意善於運用周圍的環境，於未發之時將俄國入侵者逐個殲滅。"
 POL_defend_in_west_state: "[From.GetName]防禦計劃"
 POL_defend_in_west_state_desc: "西部承載了我國的大部分工業，必須注意使其遠離對德戰線。這樣一來，如果必須在邊境上抵抗有壓倒性數量優勢的敵人，就必須制定符合西部當地條件的防禦戰略。"
 POL_four_year_plan_mission: "準備下一個四年計劃"
 POL_four_year_plan_mission_desc: "四年計劃正在進行中。若要為今後四年做好充分的準備，就必須確保兌現有關我國改革與工業化的承諾。"
