l_simp_chinese:
 POL_danzig_decisions: "但澤“自由”市"
 POL_danzig_decisions_desc: "但澤長期以來是波蘭經濟麻煩的掣肘！是時候徹底控制這座城市了，但我們首先得與當地居民達成某種程度的合作……"
 POL_unification_propaganda: "統一化宣傳"
 POL_unification_propaganda_desc: "但澤是一個由波蘭人、德意志人和其他許多民族共同聚居的城市，而納粹黨正試圖破壞這種多元文化的共生。我們可以言之鑿鑿地告訴少數民族，納粹黨死也不願與其平等相待，這樣一來宣傳就可以有效地讓他們倒向我們這邊。"
 POL_military_appeasement: "軍事綏靖"
 POL_military_appeasement_desc: "但澤自由市不能僅靠武統來整合，一定程度的綏靖可以使但澤的民兵組織對波蘭更加順從。"
 POL_raid_nazi_resistance: "打擊納粹抵抗組織"
 POL_raid_nazi_resistance_desc: "一些反動團體試圖將自由市的自由獻給納粹，逼迫這座城市臣服在柏林面前。這些反動成分必須不惜一切代價從自由市裡根除，儘管的粗暴的軍事行動可能使當地居民對我國產生消極態度。"
 POL_tighten_control: "加強控制"
 POL_tighten_control_desc: "我們已經在自由市裡爭取到了足夠多順從度，有能力在不引起內亂的情況下加強控制。完成這一步，我國就能從但澤獲取更多資源，並更加接近實現統一這座城市的目標。"
 POL_sanation_decisions: "波蘭薩納齊亞政府"
 POL_sanation_decisions_desc: "薩納齊亞運動包括左右兩派，兩邊都在爭取動搖我們的統治。在適當安撫與暗中邊緣化影響力上，我們必須兩手都要抓，這樣才能在未來創造一個穩定的波蘭政府！"
 POL_sanation_left_irritation: "薩納齊亞左派不滿"
 POL_sanation_left_irritation_desc: "薩納齊亞左派已經受夠了在莫希齊茨基政府下的被邊緣化，他們開始試圖重建前總理瓦萊雷·斯瓦韋克政府的統治秩序。"
 POL_sanation_right_irritation: "薩納齊亞右派不滿"
 POL_sanation_right_irritation_desc: "依靠大部分軍隊的支持，薩納齊亞右派開始試圖逐步瓦解莫希齊茨基的獨裁統治，並建立一個由愛德華·雷茲-希米格維領導的軍政府。坐擁軍隊與長槍黨等準軍事組織的協助，薩納齊亞右派極其危險。"
 POL_sideline_the_left: "邊緣化左派"
 POL_sideline_the_left_desc: "在右派的協助下，我們有能力邊緣化左派，從而進一步淡化其政治影響。"
 POL_sideline_the_right: "邊緣化右派"
 POL_sideline_the_right_desc: "儘管右派勢力龐大，但左派和城堡派仍然能夠聯手在政府中將其邊緣化。"
 POL_peasant_strike_category: "農民大罷工"
 POL_peasant_strike_category_desc: ""
 POL_looming_peasants_strike_mission: "迫在眉睫的農民大罷工"
 POL_looming_peasants_strike_mission_desc: "農民對現狀十分不滿，並要求提高收入以及大幅降低食物價格。波蘭東部地區的鐵路十分不暢，這使得向該地區供應食物和設備的成本較為高昂。但隨著進一步的鐵路投資，我們也許能夠實現這些農民的訴求。"
 POL_peasants_strike: "農民大罷工！"
 POL_peasants_strike_desc: "東部地區的緊張局勢目前正在持續升溫。這場危機如果不能儘快解決，就很可能會引發內戰。由農民黨領袖斯坦尼斯瓦夫·米科拉伊奇克組織的罷工已經形成了一個由民主派、社會主義者和共產黨人組成的聯盟，共同反對現在的波蘭政府。若不理會，暴亂將至。"
 POL_invite_foreign_motor_decisions: "邀請外國汽車公司"
 POL_invite_foreign_motor_decisions_desc: ""
 POL_invite_ford: "邀請福特汽車"
 POL_invite_ford_desc: "物美價廉的美國福特汽車能以無可比擬的速度大規模生產摩托化裝備。"
 POL_invite_vauxhall: "邀請沃克斯豪爾"
 POL_invite_vauxhall_desc: "英國人的摩托化裝備已證明是又快又耐用，世上其它同類產品難以望其項背。"
 POL_invite_somua: "邀請索瑪"
 POL_invite_somua_desc: "法國的摩托化裝備和裝甲車比其他國家的都要結實，在敵方載具的火力下幾乎能夠毫髮無傷。若要在戰爭中生存下來，這些載具正符合我們所需。"
 POL_miedzymorze_decisions: "海間聯邦"
 POL_miedzymorze_decisions_desc: ""
 POL_diplomatic_mission_to_FIN: "赴[FIN.GetNameDef]外交任務"
 POL_diplomatic_mission_to_FIN_desc: "如果我們要說服其他國家加入海間聯邦，就需要舌燦金蓮的外交大使來進行利益說服。把約瑟夫·貝克派去執行這項外交任務，這樣就距離建立我們夢寐以求的防禦性聯盟更進一步。"
