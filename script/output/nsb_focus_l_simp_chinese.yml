 SOV_the_left_opposition: "左翼反對派"
 SOV_the_left_opposition_desc: "蘇聯業已背棄初衷，甚至有觀點稱要一國建成社會主義，棄世上其他工人於不顧。如果斯大林同志不採取行動，其他人將會代勞。"
 SOV_the_left_opposition_tt: "在[ROOT.GetNameDef]啟動§Y內戰§!進程。"
 SOV_the_fourth_international: "第四國際"
 SOV_the_fourth_international_desc: "所謂的“第三國際”中的斯大林主義傀儡已經證明自己完全沒有能力領導革命。他們對共產主義的看法與馬列理論毫無關係，反而把工人民主國家的夢想扭曲為了反烏托邦的噩夢。我們需要的是一個能夠捍衛革命的新共產國際!"
 SOV_bring_old_trotskyists_back: "託派元老迴歸"
 SOV_bring_old_trotskyists_back_desc: "在革命初期，黨內各派別之間曾有過許多激烈的爭論。一些與黨的路線不太一致的人僅因為微小分歧而被開除，如卡爾·拉狄克和葉夫根尼·普列奧布拉任斯基。也許這些老黨員的懺悔姿態就足以讓他們重新迴歸黨內。"
 SOV_bring_old_trotskyists_back_trigger_tt: "§Y$SOV_karl_radek$§!和§Y$SOV_yevgeny_preobrazhensky$§!已被斯大林清洗"
 SOV_bring_old_trotskyists_back_effect_tt: "§Y$SOV_karl_radek$§!和§Y$SOV_yevgeny_preobrazhensky$§!成為可用的顧問。"
 SOV_organize_the_wreckers: "組織破壞分子"
 SOV_organize_the_wreckers_desc: "如果斯大林和他的黨羽們想和我們硬碰硬，而不顧全革命大局乖乖辭職，我們必須放棄幻想，準備鬥爭。情況之危急，以至於我們甚至不得不考慮破壞人民財產。我們在進行破壞行動時也得謹慎細微，以免白白毀壞了蘇維埃工人創造的偉大成就。"
 SOV_organize_the_wreckers_tt: "解鎖在內戰期間進行工業破壞的§Y決議§!。"
 SOV_integrate_smirnovs_bloc: "整合斯米爾諾夫集團"
 SOV_integrate_smirnovs_bloc_desc: "最近有一群託派元老因反對斯大林的壓迫而被逮捕入獄。只要上下打點一番，我們就可以讓他們獲釋並被流放，從而免遭政治偏執之害。他們不會忘記是誰幫助他們逃亡的。"
 SOV_integrate_smirnovs_bloc_tt: "關押中的§Y$SOV_ivan_smirnov$§!，§Y$SOV_ivar_smilga$§!和§Y$SOV_aleksandr_shlyapnikov$§!將被流放（§G流放中的角色不會被清洗§!）。當內戰開始時，他們將作為顧問可用。\n在兩個地區增加左翼反對派的支持。"
 SOV_left_eliminate_right: "消滅右翼"
 SOV_left_eliminate_right_desc: "我們黨內有幾個互不相容的派系。如果我們馬上要接管國家並且讓革命回到正軌上來，那麼我們就不能因為他們的掣肘而分散注意力。不過如果斯大林“同志”想找內部敵人來鬥爭的話，我們倒是可以把一些人推上前去……"
 SOV_left_eliminate_right_tt: "§Y$SOV_nikolay_bukharin$§!、§Y$SOV_aleksey_rykov$§!和§Y$SOV_mikhail_tomsky$§!成為斯大林大清洗的潛在目標。"
 SOV_eliminate_opposition_factionalism_tt: "§Y$SOV_factionalism_modifier$§!追加效果：\n政治點數：§G+5%§!。"
 SOV_committee_in_exile: "流亡委員會"
 SOV_committee_in_exile_desc: "我們永遠都說不清斯大林的怒火會燒上誰身，所以我們必須準備好秘密路線和安全屋，這樣如果發現一些支持者成為下一輪清洗的目標，便可將其偷渡出國。"
 SOV_committee_in_exile_tt: "解鎖§Y$SOV_send_supporters_abroad$§!決議，我們可以把支持者送到海外流亡（§G流亡中的角色無法被清洗§!）。流亡中的角色將在內戰爆發後可用。"
 SOV_approach_tukhachevsky: "接觸圖哈切夫斯基"
 SOV_approach_tukhachevsky_desc: "米哈伊爾·圖哈切夫斯基無疑是我們最偉大的軍事思想家之一。雖然他關於快速機動的步坦合成部隊穿插深入敵人後方的理論並非沒有批評者，但他仍然得到了一些將才的支持。如果我們能說服他支持我們的事業，價值將不可估量。"
 SOV_approach_tukhachevsky_tt: "§Y$SOV_mikhail_tukhachevsky$§!將會站在左翼反對派一邊並帶來軍隊和忠於我們的將領。"
 SOV_approach_primakov: "接觸普里馬科夫"
 SOV_approach_primakov_tt: "§Y$SOV_vitaly_primakov$§!將會站在左翼反對派一邊並帶來軍隊和忠於我們的將領。"
 SOV_approach_primakov_desc: "維塔利·普里馬科夫是我國主要的騎兵指揮官之一，他的支持對於確保國家安全非常有價值。"
 SOV_funds_for_the_cause: "籌措事業資金"
 SOV_funds_for_the_cause_desc: "$SOV_lev_trotsky$和其他海外人員肯定有法子為我們提供幫助，我們應該在全世界組織社會主義募捐活動，同時暗中說服各國政府為我們提供武器。"
 SOV_funds_for_the_cause_tt: "在內戰爆發時添加§Y$SOV_foreign_funds_idea$§!民族精神，持續365日。"
 SOV_left_opposition_coup: "重燃戰火"
 SOV_left_opposition_coup_desc: "時機已至。讓我們高舉反抗暴君的旗幟。偉大的革命將再次開始！"
 SOV_left_opposition_coup_tt: "在紅軍、紅海軍及紅軍航空兵中增加左翼反對派的支持。\n發起§Y蘇聯內戰§!。 "
 SOV_exiled_advisors_available_tt: "§Y流亡中的角色將可用。§!"
 SOV_the_vanguard_of_the_true_revolution: "真正革命的先鋒隊"
 SOV_the_vanguard_of_the_true_revolution_desc: "讓世界聽到我們的革命呼聲吧。我們將號召全世界的革命者團結在我們的旗幟下。團結一致，我們將戰勝斯大林。團結一致，我們將帶來革命的勝利。"
 SOV_long_live_the_workers_government: "工人政權萬歲"
 SOV_long_live_the_workers_government_desc: "既然我們已經開始踏上了實現工人階級真正解放的漫長道路，我們決不能被蠱惑去用一個權貴政府取代另一個權貴政府。我們聯盟的政府必須永遠是真正被工人所有，由工人統治，為工人所享的政府。"
 FOURTH_INTERNATIONAL_FACTION: "第四國際"
 SOV_left_purges: "消滅反革命分子"
 SOV_left_purges_desc: "還有許多人對斯大林懷有怨恨。當我們還在鞏固我們的統治時，我們絕不能讓這些人開始形成反革命的秘密團伙，以免我們在短時間內又有一場內戰。"
 SOV_left_right_purges_factionalism_tt: "從§Y$SOV_factionalism_modifier$§!中移除政治點數修正"
 SOV_left_purges_tt: "右翼反對派顧問將被移除"
 SOV_the_builder_of_the_red_army: "紅軍的締造者"
 SOV_the_builder_of_the_red_army_desc: "無論紅軍在斯大林統治期間變成什麼樣，它永遠是$SOV_lev_trotsky$的傑作。現在正是他回到以前的位置，帶領重獲活力的全新紅軍投入戰鬥的時候了。"
 SOV_reigniting_the_revolutionary_spirit: "賡續革命精神"
 SOV_reigniting_the_revolutionary_spirit_desc: "多年的斯大林主義統治消磨了我國人民的革命熱情。我們的工人被告知革命終將爆發，但我們知道情況並非如此——從目前世界的發展水平來看，革命必須在其他欠發達國家爆發，而我們將點燃革命的星星之火。"
 SOV_the_permanent_revolution: "不斷之革命"
 SOV_the_permanent_revolution_desc: "馬克思主義理論告訴我們，如果環境合適，革命必然爆發。然而，情況顯然不正確，或者說不是完全正確。我們不能沾沾自喜，等待可能是幾百年後的世界革命。世界各地的工人和農民現在就在受苦，今天，他們的解放不能等待。"
 SOV_the_permanent_revolution_decisions_tt: "解鎖§Y組織第五縱隊§!決議以在歐洲的敵國發動革命起義"
 SOV_the_permanent_revolution_trotsky_trait_tt: "若§Y$SOV_lev_trotsky$§!是國家領導人"
 SOV_depoliticize_the_military: "軍隊去政治化"
 SOV_depoliticize_the_military_desc: "軍隊的主要目的是保護工人階級。我們的士兵在很大程度上已經是工人階級的成員，因此不需要有人監管他們。更重要的是，紅軍應當專注於自己的主要戰鬥任務，而不應被允許在政治上做文章。"
 SOV_depoliticize_the_military_ns_tt: "$SOV_modify_the_red_army_ns_intro$\n最大指揮點數提高乘數：§G+10§!\n\n"
 SOV_system_decentralization: "體制去中心化"
 SOV_system_decentralization_desc: "斯大林不僅集中了黨內權力，連國家大權也集於他一身。把權力從工人身上拿走，放到腐朽的權貴手中，這顯然是反革命的作為。我們需要逆轉這個趨勢，讓工人們能夠再度掌握他們自己的命運。"
 SOV_strengthen_heavy_industry: "強化重工業"
 SOV_strengthen_heavy_industry_desc: "重工業是我們經濟的心臟。如果我們想確保革命事業不只是存續下去，而是能夠蓬勃發展，就必須繼續強化這一方面。"
 SOV_a_global_class_struggle: "全球階級鬥爭"
 SOV_a_global_class_struggle_desc: "解放工人階級的鬥爭必然要被定義為一場全球鬥爭。只要有一個國家依然奉行資本主義制度，革命事業則並不安全。一旦全世界的工人階級看到革命事業的不斷推進，他們將集結在我們的旗幟之下支持我們的鬥爭。"
 SOV_a_global_class_struggle_decision_tt: "解鎖動搖歐洲鄰國並對他們正當化戰爭目標的§Y煽動無產階級§!決議。"
 SOV_all_power_to_the_soviets: "一切權力歸蘇維埃"
 SOV_all_power_to_the_soviets_desc: "革命起源於一個再簡單不過的理想——通過組建工人、士兵及農民的委員會，人民有權決定他們自己的命運。只不過，這個制度後來又變了回去，未經選舉的官僚高高在上地發號施令。每當官僚的決策無可避免地引火自焚的時候，承受代價的從來都是工人階級。再也不會這樣了！"
 SOV_regional_development: "地區發展"
 SOV_regional_development_desc: "我們必須確保工業發展要在整個國家擴散開來，而不是將工廠集中在小部分地區並忽視其他地區。"
 SOV_autonomous_soviet_republics: "自治蘇維埃共和國"
 SOV_autonomous_soviet_republics_desc: "在革命之後的數年間，斯大林主義者在聯盟的某些地區努力地抹殺地區認同並壓制工人的自決權。這些行為的反革命性質不證自明。如果某些蘇維埃共和國的工人想要更大程度的自治，我們應當毫不猶豫的給予他們。"
 SOV_autonomous_soviet_republics_tt: "可以釋放國家。"
 SOV_international_union_of_soviet_republics: "國際蘇維埃共和國聯盟"
 SOV_international_union_of_soviet_republics_desc: "在我們的革命歷史上，或許最大的背叛就是認為社會主義可以——或者說應該——在一國建成。要麼全世界的工人階級都聯合起來實現社會主義，要麼就是誰都實現不了社會主義。儘管革命在不同國家處於不同的發展階段，但我們會向我們的盟友分享資源，確保每一個工人階級掌權的國家都能穩步向前發展。"
 SOV_international_union_of_soviet_republics_tt: "§Y$SOV_factionalism_modifier$§!追加效果：\n宗主國貿易花費：§G-10%§!\n黨派支持度對穩定度修正：§G+10%§!\n"
 SOV_international_union_of_soviet_republics_puppet_tt: "在首都地區添加§Y一座民用工廠§!。"
 SOV_the_onslaught_on_colonialism: "討伐殖民主義"
 SOV_the_onslaught_on_colonialism_decision_tt: "解鎖在非洲鄰國§Y組建第五縱隊§!和§Y煽動無產階級§!的決議。"
 SOV_the_onslaught_on_colonialism_desc: "帝國主義與殖民擴張是資本主義晚期階段的重要組成部分。不過，被奴役的百萬群眾為我們提供了可以輕鬆利用的巨大的革命契機。這些殖民帝國的廣大受壓迫人民渴望自由——我們將打破奴役他們的鎖鏈。"
 SOV_carry_revolution_east: "向東發動革命"
 SOV_carry_revolution_east_desc: "對非洲殖民地的殘酷剝削導致當地社會無法發展到革命能輕易成功的水平。與其不同的是亞洲更成熟的社會則有巨大的革命潛力等待被釋放。"
 SOV_carry_revolution_east_decision_tt: "解鎖在亞洲鄰國§Y組建第五縱隊§!和§Y煽動無產階級§!的決議。"
 SOV_the_end_of_the_imperialist_era: "帝國主義的末日"
 SOV_the_end_of_the_imperialist_era_desc: "也許對於帝國主義最赤裸裸的表達就是所謂的門羅主義，一個國家竟然可以宣稱兩個大洲是他們的專屬領土。這絕對是不可接受的。革命將在美洲找到立足點，最終，西半球的工人們將會獲得自由。"
 SOV_the_end_of_the_imperialist_era_decision_tt: "解鎖在美洲和大洋洲鄰國§Y組建第五縱隊§!和§Y煽動無產階級§!的決議。"
 SOV_military_support: "軍隊支持"
 SOV_military_support_desc: "武裝部隊內部的支持總是有價值的，即便是冒著把我們密謀的風聲走漏給斯大林的眼線的風險。如果事態真的如此發展，我們只能希望斯大林發現時已經無力迴天。"
 SOV_military_support_tt: "增加內戰時的軍隊支持。\n解鎖獲取更多支持的決議。"
 SOV_divert_attention_towards_military: "移禍軍隊"
 SOV_divert_attention_towards_military_desc: "如果斯大林認為軍隊對他不滿，他將攻擊軍隊而不是我們。如此一來，軍隊中無論如何都將充斥著對他的不滿了……"
 SOV_divert_purge_attention_tt: "對軍隊發動一次隨機清洗。\n解鎖陷害軍官的§Y決議§!。\n將跳過中間派的§Y$SOV_the_zinovyevite_terrorist_center$§!國策。"
 SOV_gain_support_from_party_members: "爭取黨員支持"
 SOV_gain_support_from_party_members_desc: "斯大林的一些傀儡之所以會成為傀儡，主要因為他們害怕斯大林。我們應該讓他們相信我們的密謀終會成功，他們只需坐享其成，就可以成為英雄。說服他們的辦法多著呢……"
 SOV_gain_support_from_party_members_tt: "內戰開始時，§Y$SOV_vsevolod_merkulov$§!、§Y$SOV_mikhail_kalinin$§!和§Y$SOV_nikita_khrushchyov$§!加入反對派。\n內戰開始時，§G+10%§!穩定度。"
 SOV_sway_the_railway_workers: "策反鐵路工人"
 SOV_sway_the_railway_workers_desc: "革命需要補給。我們必須爭取鐵路工人投身於我們的事業。如此一來，我們便可以在作戰基地周圍準備並隱藏補給站。"
 SOV_sway_the_railway_workers_tt: "在§Y[GetSovietCivilWarName]§!開始的時候在總部所在州的周圍添加§Y鐵路§!和§Y補給中心§!。"
 SOV_infiltrate_the_nkvd: "滲透內務部"
 SOV_infiltrate_the_nkvd_desc: "內務人民委員會的基層幹部們為斯大林執行骯髒工作，且經常被認為是他的忠僕。然而即使是最堅固的牆也存在著裂縫。我們應該拉攏儘可能多的內務部幹部為我們效力，為暴君斯大林提供錯誤信息。"
 SOV_infiltrate_the_nkvd_tt: "§Y[GetSovietCivilWarName]§!開始時，部分內務部部隊將加入你的革命大業。\n解鎖§Y決議§!：$SOV_expand_nkvd_opposition$"
 SOV_infiltrate_the_nkvd_coup_tt: "提高暗殺斯大林行動的成功幾率。"
 SOV_cooperation_against_stalin: "聯合反對斯大林"
 SOV_cooperation_against_stalin_desc: "到了如此境地，我們應該摒棄前嫌，聯手反對斯大林。"
 SOV_cooperation_against_stalin_right_tt: "§Y$SOV_karl_radek$§!和§Y$SOV_yevgeny_preobrazhensky$§!成為可用的顧問。"
 SOV_cooperation_against_stalin_left_tt: "§Y$SOV_nikolay_bukharin$§!和§Y$SOV_aleksey_rykov$§!成為可用的顧問。"
 SOV_cooperation_against_stalin_other_tt: "新顧問可用。"
 SOV_cooperation_against_stalin_factionalism_tt: "§Y$SOV_factionalism_modifier$§!追加效果：§G-15%§!政治顧問花費，§R-10%§!政黨支持率對穩定度修正，以及§R-5%§!政治點數。"
 SOV_align_the_zinovyevites: "拉攏季諾維也夫"
 SOV_align_the_zinovyevites_desc: "$SOV_grigory_zinovyev$曾經和斯大林一道反對托洛茨基。斯大林在後來很快就背叛了他並免去了他的一切實權職務。他不會忘記這種侮辱。如果我們給$SOV_grigory_zinovyev$一個復仇的機會，想必他會接受的。"
 SOV_align_the_zinovyevites_tt: "關押中的§Y$SOV_grigory_zinovyev$§!和§Y$SOV_lev_kamenev$§!將被流放（§G流放中的角色不會被清洗§!）。當內戰開始時，他們將作為顧問可用。\n解鎖內戰爆發時在關鍵地區獲得游擊隊的§Y決議§!。\n"
 SOV_align_the_zinovyevites_factionalism_tt: "§Y$SOV_factionalism_modifier$§!添加效果：§R-5%§!政治點數。"
 SOV_liberate_ryutin: "釋放柳廷"
 SOV_liberate_ryutin_desc: "柳廷同志一針見血毫不猶豫地指出了斯大林的許多錯誤和缺點。毫無疑問斯大林決定拿他來殺一儆百。不過現在，我們應當找關係將他送到國外直到斯大林被幹掉再回來，這樣他就可以在斯大林死後幫助我們管理國家。"
 SOV_liberate_ryutin_tt: "關押中的§Y$SOV_martemyan_ryutin$§!將被流放（§G流放中的角色不會被清洗§!）。當內戰開始時，他將作為顧問可用，並且其支持者將加入反對派。"
 SOV_return_democracy_to_the_party: "重建黨內民主"
 SOV_return_democracy_to_the_party_desc: "在革命中的某個時刻，我們認識到我們不能陷入對革命道路無休止的爭論中。時過境遷，現在是時候兌現我們對工人生活各方面的民主承諾了。這也意味著，曾經發表了善意批評就被認定是阻礙革命的被流放者們，可以重回黨內。"
 SOV_return_democracy_to_the_party_unlock_right_tt: "§Y右翼反對派顧問§!將可用。"
 SOV_return_democracy_to_the_party_unlock_left_tt: "§Y左翼反對派顧問§!將可用。"
 SOV_return_democracy_to_the_party_factionalism_tt: "§Y$SOV_factionalism_modifier$§!添加效果：§R-5%§!政治點數。"
 SOV_strengthen_the_trade_unions: "強化工會"
 SOV_strengthen_the_trade_unions_desc: "在斯大林的領導之下，工會已經從代表工人對抗管理層的工具墮落成了管理層指導工人的工具。雖然這看上去只是他較小的罪過之一，但這徹底改變了工人的民主自我領導權，實際上阻止了工人享受革命果實。"
 SOV_the_peoples_revolution: "人民革命"
 SOV_the_peoples_revolution_desc: "革命想要長久，就必須滲透到社會的各個方面。只有全體人民都把自己看作革命不可或缺的一部分，革命才能經受得住道路上的艱難險阻。"
 SOV_the_supreme_soviet: "最高蘇維埃"
 SOV_the_supreme_soviet_desc: "讓一個人代表整個國家本身就是一種不民主的做法，因此也是一種反革命的行為。我們將拋棄這種個人崇拜作風，並且宣佈我們的聯盟自今日起，將永遠由匯聚於最高蘇維埃的人民集體意志來代表。"
 SOV_the_right_opposition: "右翼反對派"
 SOV_the_right_opposition_desc: "斯大林偏執的領導正在摧毀這個國家。他過於激進的大規模集體化和殘酷的工業化政策更將這一點體現的淋漓盡致。我們必須立刻做點什麼來挽救這個國家。只有布哈林領導下的右翼反對派才能治癒殘酷統治下產生的創傷，恢復經濟，並重新帶領這個國家走向輝煌。"
 SOV_the_right_opposition_tt: "在[ROOT.GetNameDef]啟動中間派與右翼反對派的§Y內戰§!進程。"
 SOV_the_need_for_policy_changes: "改弦更張之需"
 SOV_the_need_for_policy_changes_desc: "很明顯，這個國家正在向著錯誤的方向前進，斯大林和他盟友做得太過太急。我們必須循序漸進。我們要將索科利尼科夫同志帶回來，這位在蘇聯成立初期工作出色的同志一定能將我們帶回正軌。"
 SOV_the_need_for_policy_changes_tt: "§Y$SOV_grigory_sokolnikov$§!將成為可用的政治顧問。"
 SOV_reverse_the_collectivization_process: "推翻集體化進程"
 SOV_reverse_the_collectivization_process_desc: "推行集體化是一場徹頭徹尾的災難，在本是國家糧倉的地方造成了大量的貧困和饑荒。我們必須立刻推翻集體化政策。"
 SOV_reverse_the_collectivization_process_tt: "增加內戰期間來自自耕農的支持\n§Y$SOV_factionalism_modifier$§!追加效果：\n地區最大工業值：§R-10%§!\n政黨支持率對穩定度修正：§G+10%§!\n"
 SOV_organize_uprisings_in_the_country: "組織國內暴動"
 SOV_organize_uprisings_in_the_country_desc: "如果我們不採取武裝鬥爭的形式，那麼我們根本無法推翻斯大林。我們要將斯大林的注意力先從我們身上調開，才能確保準備工作有條不紊進行。"
 SOV_organize_uprisings_in_the_country_tt: "在國內各地發動起義，將在蘇聯內戰中獲取更多支持。"
 SOV_dissent_in_the_party: "黨內異見"
 SOV_dissent_in_the_party_desc: "我們要在不同戰線上向斯大林施壓，破壞他對黨的控制力。比如說，我們可以在黨報上公開發表批評斯大林的文章、論文，指出他的決策失誤並要求改革。這不僅會讓斯大林如坐針氈，還能提高我們在各反對派中的地位。"
 SOV_eliminate_the_left: "消滅左翼"
 SOV_eliminate_the_left_desc: "雖然我們的主要對手是斯大林，但我們不得不承認，黨內有許多人還在等待時機，還有人的無休爭吵會妨礙我們奪權。斯大林已經對我們的行動變得越來越偏執了，那麼我們自然可以借這個機會一石二鳥。"
 SOV_eliminate_the_left_tt: "§Y$SOV_karl_radek$§!，§Y$SOV_ivar_smilga$§!和§Y$SOV_yevgeny_preobrazhensky$§!成為斯大林的潛在清洗目標。"
 SOV_concessions_to_foreign_powers: "向外國勢力妥協"
 SOV_concessions_to_foreign_powers_desc: "雖然是為了拯救國家，但低聲下氣地乞求外國援助我們的鬥爭仍然不失為奇恥大辱。然而，正是斯大林的暴政及其偏執迫使我們這麼做。"
 SOV_concessions_to_foreign_powers_tt: "解鎖請求外國勢力的§Y決議§!，以妥協換取外國勢力援助。"
 SOV_covert_support_for_spanish_poum: "秘密支持西班牙馬統工黨"
 SOV_covert_support_for_spanish_poum_desc: "在西班牙，反革命勢力已經佔了上風，法西斯與反動派武裝都在援助西班牙國民軍。儘管西班牙共和軍空有滿腔熱血，但他們一來缺槍少彈，二來缺乏政治覺悟。不過，這些東西我們都能提供給他們。"
 SOV_covert_support_for_spanish_poum_tt: "在西班牙內戰中向馬克思主義統一工人黨提供暗中援助，將使其成為安那其暴動的主導派系，使之成為一場§Y$communism$§!暴動而非$neutrality$暴動。\n\n"
 SOV_if_poum_wins_tt: "\n如果§Y馬統工黨$SPC_communism_DEF$§!贏得了西班牙內戰，一部分西班牙部隊將會在我國爆發的內戰中援助我們這一邊。"
 SOV_undermine_stalins_authority: "削弱斯大林權威"
 SOV_undermine_stalins_authority_desc: "斯大林之所以能獨掌大權，正是因為人民對他的恐懼，以及他的所作所為。我們還不能完全消除人民的恐懼，但我們可以減輕斯大林對其他人的傷害。如果事情進展順利，我們甚至可以架空他，讓他變成孤家寡人。"
 SOV_undermine_stalins_authority_paranoia_tt: "£SOV_paranoia_text_icon 每週偏執度增長：§R+1§!"
 SOV_clandestine_cells: "密謀集團"
 SOV_clandestine_cells_desc: "斯大林派的眼中四處都是工賊、敵特、破壞分子。他們一直以來在喊“狼來了”，後果就是大多數人再也不會相信他們。我們可以利用這一點，在工業體系的要害部門中成立組織。一旦斯大林企圖負隅頑抗，阻擋我們接管國家，他們就會實施破壞行動。"
 SOV_clandestine_cells_tt: "解鎖在內戰期間進行工業破壞的§Y決議§!。"
 SOV_the_plan_for_the_coup: "準備政變"
 SOV_the_plan_for_the_coup_desc: "權力鬥爭不一定非要通過公開暴力的方式進行。如果我們策略得當，讓合適的人負責合適的事務，我們或許可以逐漸凍結斯大林的權力然後除掉他。"
 SOV_the_plan_for_the_coup_tt: "解鎖使內務部主管加入你的革命大業的§Y決議§!，從而使通過不流血政變除掉斯大林成為可能。"
 SOV_the_socialist_bulwark: "社會主義堡壘"
 SOV_the_socialist_bulwark_desc: "我們和西班牙同志團結一致並肩作戰。作為國際主義的團結範例，他們的鬥爭就是我們的鬥爭，我們的鬥爭就是他們的鬥爭。我們將在歐洲的兩頭建立兩座堅固的社會主義革命中心。"
 SOV_the_socialist_bulwark_join_war_tt: "§Y[ROOT.GetFlag][ROOT.GetNameDefCap]§!將會加入§Y[SPC.GetFlag]西班牙馬統工黨§!與所有西班牙派系的內戰。"
 SOV_poum_exists_tt: "§Y$SPC_communism$§!：\n存在\n已完成§Y$SPR_the_anti_fascist_workers_revolution$§!國策"
 SOV_coup_detat: "發動政變"
 SOV_coup_detat_desc: "接管這個國家的時刻到了。如果一切順利，我們將迅速出擊，通過不流血的政變清除改變政府的最大障礙。如果不順利，我們將不得不為我們的國家而內戰。"
 SOV_coup_detat_success_tt: "§Y右翼反對派§!通過一場政變奪得控制權。§Y$SOV_lavrenty_beriya$§!被移除。"
 SOV_coup_detat_civil_war_tt: "在紅軍、紅海軍及紅軍航空兵中增加右翼反對派的支持。\n發起§Y蘇聯內戰§!。 "
 SOV_right_purges: "國家的敵人"
 SOV_right_purges_desc: "還有很多黨員沒有完全接受我們的領導。我們需要把他們抓個典型讓其他人和我們保持一致。"
 SOV_right_purges_tt: "左翼反對派顧問將被移除"
 SOV_the_power_of_the_peasantry: "農民的權力"
 SOV_the_power_of_the_peasantry_desc: "馬克思主義普遍觀念認為工人才是革命的生力軍，但在我們國家，毫無疑問農民才是構成革命的主體。教育和培養這幾百萬農民的階級意識必不可少，只有這樣他們才會在革命成果受到威脅時挺身而出。"
 SOV_curtailment_of_the_collective_farms: "削減集體農場"
 SOV_curtailment_of_the_collective_farms_desc: "大規模的集體農莊是斯大林式臃腫官僚系統的典例。這種將農民與他們的勞動成果剝離的行為，實際上將他們變為了田間的產業工人。與此同時，糧食生產上的干擾早已引發災難，產量已經大幅下降。我們急需推翻這項荒唐的政策。"
 SOV_curtailment_of_the_collective_farms_tt: "封鎖五年計劃國策"
 SOV_administrative_reforms: "行政改革"
 SOV_administrative_reforms_desc: "斯大林視忠誠高於一切，以致於懼怕惹禍上身的行政官員不願體現他們的主觀能動性和獨立思考能力。我們必須要麼給他們灌輸這些新的價值觀，要麼替換他們。"
 SOV_a_new_theory_of_revolution: "新革命理論"
 SOV_a_new_theory_of_revolution_desc: "馬克思主義理論完全符合19世紀的情境，但是20世紀的現實情況使我們要提出新的見解。最發達的國家並非總是革命的發源地，所以我們有必要調整原有的策略。"
 SOV_back_to_the_nep: "重拾新經濟政策"
 SOV_back_to_the_nep_desc: "在建設社會主義社會之前，我們必須先打好經濟基礎再發展我們的經濟。在革命之初，我們曾頒佈新經濟政策，它允許我們利用自由市場刺激經濟的增長。然而，這項政策在初具成效前就被廢止了。現在我們再次掌控了政權，我們可以重新拾起這項夭折的政策，以建設更美好的社會。"
 SOV_back_to_the_nep_new_economy_law: "解鎖經濟法案：§Y$new_economic_policy$§!"
 SOV_planned_economy: "計劃經濟"
 SOV_planned_economy_desc: "新經濟政策的確存在一些缺陷，但它也的確碩果累累。我們離徹底建成社會主義社會還有很長的路要走，但現在我們可以用更正規的方法計劃我國經濟。具體來看，我們應該制定一項充分考量我們友邦和盟國實力的經濟政策，並建設更加互利互惠的經濟體系。"
 SOV_planned_economy_subjects_tt: "所有附屬國："
 SOV_planned_economy_dynamic_modifier_tt: "\n添加§Y$SOV_planned_economy_dynamic_modifier$§!，其效果為（工廠產出：§G+[?SOV_planned_economy_industrial_capacity_factory_extra|2+%]§!，缺乏戰略資源懲罰：§G[?SOV_planned_economy_production_lack_of_resource_penalty_factor_extra|2-%]§!）\n每有一個附屬國採用§Y$new_economic_policy$§!，就額外獲得：\n工廠產出：§G+[?SOV_planned_economy_industrial_capacity_factory_extra|2+%]§!\n缺乏戰略資源懲罰：§G[?SOV_planned_economy_production_lack_of_resource_penalty_factor_extra|2-%]§!\n（額外加成上限為：工廠產出：§Y+10.00%§!，缺乏戰略資源懲罰：§Y-10.00%§!）\n\n"
 SOV_paced_industrialization: "穩步工業化"
 SOV_paced_industrialization_desc: "儘管斯大林偏重於重工業的行為拖延了其他領域的發展，但我們的規劃也不能忽略這一領域。我們必須有相當的工業基礎來支持其他領域的現代化和機械化。"
 SOV_the_trade_union_as_labor_organizer: "由工會組織勞工"
 SOV_the_trade_union_as_labor_organizer_desc: "在資本主義制度下，工會負責保障工人基本權益與反抗工廠主的壓榨。如今在新制度下卻略顯多餘。因此為了優化生產效益，工會的作用必須轉為組織勞工。"
 SOV_incorporate_local_organizations: "與地方組織合作"
 SOV_incorporate_local_organizations_desc: "相比首都官員，地方組織更能體恤民情。我們應停止強調部長及其他高層黨員幹部的作用，並交給地方組織更多權力。"
 SOV_for_the_common_good: "為了共同利益"
 SOV_for_the_common_good_desc: "我們盟友所做的任何決定都應遵循使效益最大化的基本原則。即使付出的犧牲一開始沒有帶來即刻的改善，我們也要堅信這在長期上將使效益最大化。"
 SOV_victory_over_devastation: "戰勝瘡痍"
 SOV_victory_over_devastation_desc: "在我國人民的齊心協力下，我們走出了內戰的泥沼。我國重建的速度將永遠成為標誌著工人階級本領與奉獻的豐碑。"
 SOV_victory_over_devastation_tt: "§Y$SOV_planned_economy_dynamic_modifier$§!追加效果： \n生活消費品工廠：§Y-2.0%§! \n黨派支持度對穩定度修正：§G+15.00%§! \n投降界限：§G+10.00%§! \n工廠修復速度：§G+10.00%§! \n\n"
 SOV_victory_over_devastation_industrial_relocation_tt: "§Y$SOV_industry_relocation$§!決議持續時間：§G-50%§!"
 SOV_socialist_humanism: "社會主義的人道主義"
 SOV_socialist_humanism_desc: "有些馬克思主義理論家認為人無力影響自身的命運，因此生活完全由物質因素決定。這種觀點明顯是錯誤的，並且實際上是一種資產階級對工人階級的觀點。我們應該時刻牢記人不僅僅是器官的集合，而需要以人道相待。"
 SOV_international_revolutionary_marxist_centre: "國際革命馬克思主義"
 SOV_international_revolutionary_marxist_centre_desc: "倒向斯大林極權主義的第三國際已幾乎無法挽救，我們要向全世界的共產主義黨派提供協調與合作的新平臺。"
 SOV_international_revolutionary_marxist_centre_faction_name: "國際革命馬克思主義中心"
 SOV_international_revolutionary_marxist_centre_allies_tt: "\n所有與[ROOT.GetName]處於和平的獨立非斯大林主義共產主義國家： "
 SOV_international_revolutionary_marxist_centre_no_allies_tt: "\n所有與[ROOT.GetName]處於和平的獨立非斯大林主義共產主義國家： \n  獲得§Y$SOV_international_socialist_association$§!（對§Y[ROOT.GetFlag][ROOT.GetName]§!的評價§G+40§!。）\n  觸發事件“§Y[ROOT.GetNameDefCap]邀請我們加入[ROOT.GetFactionName]§!”。"
 SOV_international_revolutionary_marxist_centre_stalinists_tt: "所有斯大林主義國家： "
 SOV_international_revolutionary_marxist_centre_stalinists_lacking_tt: "所有斯大林主義國家： \n  獲得§Y$SOV_international_socialist_association$§!（對§Y[ROOT.GetFlag][ROOT.GetName]§!的評價§R-40§!。）"
 SOV_international_revolutionary_marxist_centre_marxism_tt: "其國家領導人擁護該$marxism$的子意識形態。"
 SOV_a_sustainable_economy: "可持續經濟"
 SOV_a_sustainable_economy_desc: "轉向新經濟政策以降低工業化速度為代價將生產重心顯著地轉移至生活消費品。如果要長期保持競爭力，我們必須將經濟調整為更加可持續的模式。"
 SOV_the_enemies_of_the_people: "人民之敵"
 SOV_the_enemies_of_the_people_desc: "反革命勢力仍在遊蕩，在陰謀破壞我們已取得的成就。我們與盟國必須時刻警惕這一威脅，做好不得不為保衛革命而戰的準備。"
 SOV_proclaim_soviet_hegemony: "宣佈蘇維埃權威"
 SOV_proclaim_soviet_hegemony_desc: "蘇維埃體制的政府，蘇維埃的經濟，蘇維埃的社會，在一切方面都遠勝舊時代的一切制度。儘管舊制度仍然在世界上其他地區存在，總有奮起反抗之人可以被我們利用。"
 SOV_first_moscow_trial_flag: "已完成§Y$SOV_the_zinovyevite_terrorist_center$§!國策"
 SOV_second_moscow_trial_flag: "已完成§Y$SOV_the_anti_soviet_trotskyist_center$§!國策"
 SOV_trial_of_the_generals_flag: "已完成§Y$SOV_the_military_conspiracy$§!國策"
 SOV_third_moscow_trial_flag: "已完成§Y$SOV_the_bloc_of_rights_and_trotskyites$§!國策"
 SOV_last_purge_focus_days_tt: "當前天數為：[?SOV_first_moscow_trial_flag:days|Y0]"
 SOV_last_purge_focus_days_military_tt: "當前天數為：[?SOV_second_moscow_trial_flag:days|Y0]"
 SOV_last_purge_focus_days_rights_tt: "當前天數為：[?SOV_trial_of_the_generals_flag:days|Y0]"
 SOV_last_purge_focus_days_cult_tt: "當前天數為：[?SOV_third_moscow_trial_flag:days|Y0]"
 SOV_beaten_but_not_defeated: "敗而不餒"
 SOV_beaten_but_not_defeated_desc: "共產主義者把我們曾經光榮無限的祖國帶上了一條不歸路，不久之後，虎視眈眈的鄰國就會意識到這一政權的色厲內荏，並發動致命一擊。若要拯救我等深愛的祖國，就必須把共產主義者趕下臺！"
 SOV_beaten_but_not_defeated_tt: "在[ROOT.GetNameDef]啟動共產主義者和流亡反對派的§Y[GetSovietCivilWarName]§!進程。"
 SOV_unification_of_the_exiles: "團結流亡者"
 SOV_unification_of_the_exiles_desc: "經歷了革命與內戰後，許多人寧願流亡他鄉，也不願在新政權所謂的“正義”中苟活。他們如今身處異國，夢想著俄羅斯有朝一日重歸自由，而俄國政治制度如何對他們來說已經是次要問題了。在建立我國真正合法合理的政府之前，我們必須先接管國家權力，而合作將會使我們的事業奮力前進。"
 SOV_womens_fascist_movement: "婦女法西斯運動"
 SOV_womens_fascist_movement_desc: "雖然婦女的角色理應是在丈夫打拼奮鬥時為其準備一個舒適安詳的家，但許多男性都忘卻了應為國家與人民所承擔的責任。假若一些敬業的婦女先作表率，大概可以讓其丈夫的良知自我發現，並激勵他們去完成未竟之事。"
 SOV_the_true_tsars: "真正的沙皇"
 SOV_the_true_tsars_desc: "俄羅斯人民需要一個強力的領導人，否則就會成一盤散沙，甚至淪落到兄弟鬩牆的地步。從前的沙皇們軟弱不堪、優柔寡斷，不能勝任這一角色。未來，我們的沙皇需要有能力承擔起國家的重任。"
 SOV_national_unification: "國民團結"
 SOV_national_unification_desc: "如果我們要在接下來的戰爭中生存下來，就決不能允許國民處於分裂的狀態。無論所持的政治觀點多麼不同，無論如何，我們都是俄羅斯人。"
 SOV_national_unification_tt: "在§Y[GetSovietCivilWarName]§!開始的時候，為首都添加兩個§Y$arms_factory$§!建築。"
 SOV_covert_operations: "秘密行動"
 SOV_covert_operations_desc: "共產黨人之間很容易產生猜疑和內訌。如果我們稍加挑撥，也許就能讓他們自相殘殺。"
 SOV_covert_operations_tt: "解鎖§Y決議§!來陷害黨員和軍隊人員。"
 SOV_embrace_the_black_hundreds: "接納黑色百人團"
 SOV_embrace_the_black_hundreds_desc: "早在過去革命的混亂席捲全國之前，就有一些人始終信仰堅定。他們堅信會有一個強大的、統一的無懼於己的俄羅斯。他們人稱黑色百人團。雖然其中倖存的成員現今分散於許多不同的國家，但他們的信念依舊堅定，而我們則可以找到他們並將其帶回故國。"
 SOV_muster_the_old_guard: "集結老白衛軍"
 SOV_muster_the_old_guard_desc: "有許多曾為沙皇和祖國戰鬥的老兵仍在人世。他們雖已逐漸變老，稜角也被歲月磨平，但是從戰爭中獲得的經驗卻是無可替代的。如果我們可以與他們進行接觸，當奪取國家控制權的時刻來臨時，他們或許能夠為新軍隊建立一個經驗老道的核心機構。"
 SOV_approach_semyonov: "接觸謝苗諾夫"
 SOV_approach_semyonov_desc: "$SOV_grigory_semyonov$現在在[MAN.GetName]內擔任顧問。隨著我們事業的進一步壯大，我們有必要說服他回來。他的首要任務就是為嶄新的俄羅斯帝國組建一支強大的騎兵軍團。"
 SOV_approach_semyonov_tt: "當[GetSovietCivilWarName]開始時§Y$SOV_grigory_semyonov$§!將會作為可用的顧問和將領。\n解鎖§Y決議§!徵募額外的騎兵師。"
 SOV_fascist_youth_union: "法西斯青年團"
 SOV_fascist_youth_union_desc: "與其回望過去，不如展望未來的年輕一代與現代科技。青年法西斯主義者們熱切希望看到俄羅斯重歸往日榮耀。他們的一腔熱血足以彌補他們在戰鬥經驗方面的不足。"
 SOV_fascist_youth_union_tt: "當§Y[GetSovietCivilWarName]§!開始時徵募青年團摩托化步兵單位並加入你方。"
 SOV_tolkachi: "中介人"
 SOV_tolkachi_desc: "蘇聯經濟內部存在著這樣一種人，他們的任務是確保生產計劃中的數字與工業產能實際能夠提供的數字相符。如果我們能說服這些人為我們工作，我們可以給蘇共一個數字，給工廠經理另一個數字，並將生產出的差額轉移到一個地方儲存下來，直到時機來臨。"
 SOV_tolkachi_tt: "當§Y[GetSovietCivilWarName]§!開始時添加§Y$infantry_equipment$§!、§Y$support_equipment$§!和§Y$artillery_equipment$§!"
 SOV_organize_wreckers: "組織破壞分子"
 SOV_organize_wreckers_desc: "蘇維埃政府早已預料到境外間諜與階級敵人會製造大量破壞活動，可諷刺的是，即使是在最小的軋鋼廠裡，也已有許多工人因為他們的安全措施而感到緊張，因此我們能輕易地找到一些試圖向小氣專橫的工廠展開報復的人，併為其指條明路。"
 SOV_south_manchuria_railway: "南滿鐵路"
 SOV_south_manchuria_railway_desc: "日本南滿鐵道株式會社是[MAN.GetName]內部的國中之國。有了他們的幫助，我們應該就能準備好接下來起義所需的補給網絡。"
 SOV_the_eyes_fear: "觀之非易……"
 SOV_the_eyes_fear_desc: "我們面臨的任務異常險阻，我們必須與一個已花了數十年時間鞏固自身並獲得大多數人支持的政權一較高下，但我們目標明確，如今只欠動手。"
 SOV_the_hands_do: "……行且克難"
 SOV_the_hands_do_desc: "時機已經成熟，我們必須全力投入到這一神聖的任務中：為祖國母親剷除蘇維埃政府。這樣我們的後代才有可能在某一天徹底擺脫共產主義的幽靈。"
 SOV_the_hands_do_tt: "§Y$SOV_metropolitan_meletius$§!將成為可用的政治顧問。"
 SOV_call_for_aid: "請求援助"
 SOV_call_for_aid_desc: "雖然俄羅斯國內的反共鬥爭只是全世界反共鬥爭的一部分，但是俄羅斯反共事業的勝利將會是一次對國際共運的致命打擊，因此已有許多國家希望對我們伸出援手。"
 SOV_request_imperial_protection: "請求日本帝國保護"
 SOV_request_imperial_protection_desc: "絕望時刻亦需孤注一擲。倘若戰勝共產主義的唯一途徑是向裕仁天皇俯首稱臣，那我們也只能出此下策。俄羅斯再度屹立為自由自主帝國之時刻遲早會到來，但著眼當下，我們正急需另一個帝國的支持協助。"
 SOV_request_imperial_protection_tt: "如果他們同意：§Y[JAP.GetNameDef]§!加入戰爭。§Y[ROOT.GetNameDefCap]§!成為§Y[JAP.GetNameDef]§!的傀儡國。"
 SOV_sabotage_behind_enemy_lines: "敵後破襲"
 SOV_sabotage_behind_enemy_lines_desc: "數十年的失敗管理已經讓眾多民眾對共產主義政府感到憤怒，並不再對其抱有幻想。我們可以善加利用他們，並藉此為共產黨在其掌權地區的失敗添柴加薪。"
 SOV_aristocratic_investments: "貴族投資"
 SOV_aristocratic_investments_desc: "許多曾經的俄羅斯貴族現今散落於世界各地，而其中不少人都有著可觀的財富。這些財富中的一部分可以為我們所用，並以此購置各式武器裝備。"
 SOV_consolidate_power: "鞏固權力"
 SOV_consolidate_power_desc: "我們已經贏得了使祖國四分五裂的戰爭。我們必須鞏固地位，並有條不紊地消滅所有膽敢反對我們的人。"
 SOV_consolidate_power_tt: "§Y$SOV_nikolay_ustryalov$§!將成為可用的政治顧問。"
 SOV_rebuild_the_nation: "重建國家"
 SOV_rebuild_the_nation_desc: "我們現在必須要重建飽受戰火摧殘的祖國。我們的宣傳鼓動可以確保所有男女老少都為重建工作做出貢獻。"
 SOV_bringing_breakaways_back_to_the_fold: "將獨立地區關回樊籠"
 SOV_bringing_breakaways_back_to_the_fold_desc: "我們已經贏得了本國主要地區的領導權，現在是時候處理那些分裂出去的國家了。他們總不能指望，我們會接受永久失去俄羅斯帝國領土的損失吧？"
 SOV_offer_autonomy_to_former_soviet_republics: "給予前蘇聯加盟國自治權"
 SOV_offer_autonomy_to_former_soviet_republics_desc: "為了實現目標，我們不得不接受損失一些帝國領土的事實，但所有人都必須明白這些地區實質上是俄羅斯帝國疆域內不可分割的一部分。不過，考慮到各地政權確實幫助我們奪回了帝國，我們理應給予他們一些自治權以彰顯感謝之情。"
 SOV_restore_the_glory_of_the_motherland: "重鑄祖國榮光"
 SOV_restore_the_glory_of_the_motherland_desc: "在我們嶄新的領導下，我們將確保俄羅斯的榮光更勝以往！我們將開始一個規模龐大、類別豐富的建設計劃，而這將會讓整個西方世界都羨慕我們的國家！"
 SOV_article_124: "124號法案"
 SOV_article_124_desc: "[SOV.GetArticle124Desc]"
 SOV_ARTICLE_124_DESC_COMMUNIST: "在追求馬列主義的道路上，我們可能對宗教迫害有些過於…狂熱了，或許宗教仍然能在蘇維埃社會中發揮作用。我們的新憲法將包含一項保護所有蘇聯公民宗教自由的法案。"
 SOV_ARTICLE_124_DESC_EXILES: "共產黨宣稱他們只是將教會與國家切割開來，但實際上他們是想讓教會在普通民眾的生活中徹底消失。幾個世紀以來，教會一直都是俄羅斯社會中不可或缺的一部分，而現在它將再度迴歸到俄羅斯民眾的生活中來。"
 SOV_reopen_novodevichi: "重開新聖女修道院"
 SOV_reopen_novodevichi_desc: "長久以來教會被剝奪了培訓新神父的權力。為了重振教會，我們必須創建一個可以教育新一代神父和僧侶的地方，重開新聖女修道院似乎是個顯而易見的選項。"
 SOV_rebuild_the_savior_cathedral: "重建基督救世主大教堂"
 SOV_rebuild_the_savior_cathedral_desc: "[SOV.GetRebuildtheSaviorCathedralDesc]"
 SOV_REBUILD_THE_SAVIOR_CATHEDRAL_DESC_COMMUNIST: "1931年，為了給宏偉的“蘇維埃宮”騰出建設空間，花哨的基督救世主大教堂被炸燬。隨著戰爭的幽靈籠罩整個歐洲，我們已不太可能籌備完建設“蘇維埃宮”所需的資源，而重新修復大教堂將是一支揮向宗教信徒的橄欖枝。"
 SOV_REBUILD_THE_SAVIOR_CATHEDRAL_DESC_EXILES: "1931年，華麗的基督救世主大教堂被炸燬，以為花哨的“蘇維埃宮”騰出建設空間。為什麼一個建立在平等理念上的社會需要一座宮殿？這仍然是一個懸而未決的問題。現在我們已經重新掌權，是時候扭轉這一可怕的罪行並重建大教堂了。"
 SOV_the_synod: "主教會議"
 SOV_the_synod_desc: "隨著新聖女修道院的宗教研討會重新啟動，我們應該鼓勵教會召開主教會議，來討論自從他們被禁止舉行主教會議以來正教會都出現了哪些信仰問題。"
 SOV_the_declaration: "發佈宣言"
 SOV_the_declaration_desc: "[SOV.GetTheDeclarationDesc]"
 SOV_THE_DECLARATION_DESC_COMMUNIST: "在著名的1927宣言中，謝爾蓋牧首在教會與國家存在巨大分歧的情況下，宣誓效忠蘇聯。也許現在是時候讓支持這一宣言的各大都主教區發揮更大的作用了。"
 SOV_THE_DECLARATION_DESC_EXILES: "在沒有解決教會與國家分歧的情況下，謝爾蓋牧首曾發佈了臭名昭著的1927宣言以宣誓效忠蘇聯。儘管這種行為十分懦弱，但俄羅斯正教會的建設依然仰賴於支持該宣言的人，因此我們沒有別的選擇，只能歡迎他們重新加入教會。"
 SOV_the_declaration_tt: "§Y$SOV_patriarch_sergy$§!、§Y$SOV_metropolitan_nikolay$§!和§Y$SOV_metropolitan_aleksy$§!成為可用的顧問。"
 SOV_return_of_the_rocor: "域外教會的迴歸"
 SOV_return_of_the_rocor_desc: "域外俄羅斯正教會是由那些在俄國內戰後選擇逃亡而非放棄自己信仰和原則的流亡者所組成的。現在，隨著迫使他們離開祖國的共產主義政府已然倒臺，我們終於可以迎接他們回家並恢復其原有的教職了。"
 SOV_the_return_of_the_rocor_tt: "§Y$SOV_metropolitan_anastasy$§!將成為可用的政治顧問。"
 SOV_the_third_rome_tt_2: "§Y麥勒提都主教§!將被稱為§Y麥勒提大牧首§!"
 SOV_reformalize_the_role_of_the_patriarchate: "重建牧首區的職能"
 SOV_reformalize_the_role_of_the_patriarchate_desc: "[SOV.GetReformalizetheRoleofthePatriarchateDesc]"
 SOV_REFORMALIZE_THE_ROLE_OF_THE_PATRIARCHATE_DESC_COMMUNIST: "自124號法案邁出第一步以來，教會在我們聯盟的地位已經有了很大改善。很明顯，教會是無法從蘇維埃社會中移除的——所以也許我們應該接受這一點，並將其置於蘇維埃工人生活中的中心位置。"
 SOV_REFORMALIZE_THE_ROLE_OF_THE_PATRIARCHATE_DESC_EXILES: "牧首區已經被共產主義的陰影籠罩太久了，現在是時候讓它迴歸正道，重新成為俄羅斯社會和文化的中心了。"
 SOV_reconvene_the_zemsky_sobor: "重開縉紳會議"
 SOV_reconvene_the_zemsky_sobor_desc: "在過去，俄羅斯人民會召集一種被稱作縉紳會議的議會來討論事件與議題。直到我們決定帶領國家走上何種路線之前，我們都應該讓人民來決定他們想要關心什麼。"
 SOV_recognized_country_tt: "國際社會承認§Y[ROOT.GetNameDefCap]§!："
 SOV_reconvene_the_zemsky_sobor_tt: "§Y$SOV_aleksandr_kazembek$§!和§Y$SOV_anastasy_vonsyatsky$§!從流亡中迴歸。"
 SOV_dismantle_the_zemsky_sobor: "取締縉紳會議"
 SOV_dismantle_the_zemsky_sobor_desc: "縉紳會議已經完成了它的使命。1917年的教訓表明，民主過度可能最終會適得其反，我們不應重蹈覆轍。"
 SOV_religious_primacy: "宗教至上"
 SOV_religious_primacy_desc: "宗教在我們社會中的重要性不可被一筆帶過。現在正是國家接受且支持宗教的卓越地位，並邁出政教合一第一步的好時機。"
 SOV_romanov_reconstruction: "羅曼諾夫王朝復辟"
 SOV_romanov_reconstruction_desc: "在經過針對我國最後合法統治者的二十年迫害後，祖國最終又一次迎來了一位沙皇的統治。現在是時候再一次擁戴我們的統治王朝，並消除那些阻礙我們執行沙皇意志的微小障礙了。"
 SOV_church_candidates: "[SOV.GetChurchCandidatesName]"
 SOV_church_candidates_desc: "[SOV.GetChurchCandidatesDesc]"
 SOV_CHURCH_CANDIDATES_NAME_TSARIST: "教會候選人"
 SOV_CHURCH_CANDIDATES_NAME_FASCIST: "宗教至上"
 SOV_CHURCH_CANDIDATES_DESC_TSARIST: "教會請求我們允許其候選人參加縉紳會議未來的選舉。為感謝牧首區在俄羅斯社會中起的重要作用，我們已經決定接受該請求，為將上帝與君主的意志合二為一的可能鋪設道路。"
 SOV_CHURCH_CANDIDATES_DESC_FASCIST: "宗教在我們社會中的重要性不可被一筆帶過。現在正是國家接受且支持宗教的卓越地位，並邁出政教合一第一步的好時機。"
 SOV_reinstitute_the_mestnichestvo: "重建門第選官制"
 SOV_reinstitute_the_mestnichestvo_desc: "以前，國家的事務由最古老傑出的家族掌控。這確保了精英階層對國家的忠誠，新生代也會按照老一輩的嚴格標準受到教導。為了保障我們的新政權，我們應該重建這個系統。"
 SOV_my_brothers_keeper: "王室手足的守護者"
 SOV_my_brothers_keeper_desc: "曾經的羅曼諾夫王朝與其他諸多高貴家族維繫著血緣關係，而後者中僅有一部分人如今仍在掌權，其他人則丟掉了應屬於其的王位。既然我國現已重建君主制，那幫助他國迎回正確統治者也是我們義不容辭的應做之事。"
 SOV_the_rightful_heir_to_the_empire: "帝國正統嫡傳"
 SOV_the_rightful_heir_to_the_empire_desc: "古老的拜占庭帝國已經淪喪多年，但是塵世天國仍然需要有人保衛。英法兩國現在很明顯不足以勝任這一重擔，該讓我們來挑起這份大梁了。"
 SOV_the_third_rome: "第三羅馬"
 SOV_the_third_rome_desc: "隨著我們確立了聖地保護者的職責，我們即是這一信仰不容置疑的衛士，而我們也要相應地塑造自己。在君士坦丁堡陷落之後，莫斯科已經毋庸置疑地成為了第三羅馬。"
 SOV_the_third_rome_tt: "§Y$SOV_metropolitan_meletius$§!不再是顧問。"
 SOV_vengeance_for_the_yoke: "雪恥韃靼之軛"
 SOV_vengeance_for_the_yoke_desc: "幾個世紀前，蒙古人發起了對俄羅斯土地的兇殘入侵。直至今日，他們也可謂唯一曾完全征服過俄羅斯的民族。雖然蒙古當下看似軟弱無力，但我們必須確保他們再無重現舊日實力的可能，如此一來就能避免經歷二度的“韃靼之軛”了。"
 SOV_reclaim_uryankhay_krai: "收復烏梁海邊疆區"
 SOV_reclaim_uryankhay_krai_desc: "在1911年的蒙古革命中，烏梁海共和國和蒙古的博克多汗國脫離了清朝的統治，我們介入保護他們，並將烏梁海地區變成了[ROOT.GetAdjective]的領土。然而，隨著最近內戰的動盪，他們似乎試圖從我們手中獨立，而這絕不能允許，否則世界上的列強將會鄙視我們數個世紀！"
 SOV_westward_bound: "西部邊界"
 SOV_westward_bound_desc: "國內革命及帝國崩潰時，我們失去了許多西境領土。現在，是時候建設基礎設施，預備重新宣稱我們的正統領土了。"
 SOV_the_old_enemy: "舊日勁敵"
 SOV_the_old_enemy_desc: "瑞典一直是帝國側翼的芒刺，他們不是反覆攻擊俄羅斯，就是試圖拉攏包圍網來對抗我們。彼得一世最早在波爾塔瓦擊退過瑞典，然後在1809年我們又擊敗過他們。本以為，這會讓他們明白自己的位置，但瑞典仍一直試圖挑戰我國在波羅的海地區的利益。現在，是時候一勞永逸地碾碎此等蕞爾小邦了。"
 SOV_secure_finland: "平定芬蘭"
 SOV_secure_finland_desc: "芬蘭大公國保衛我國北境長達一個多世紀，直到在內戰時遭分割獨立。芬蘭迴歸祖國的那一天已然來臨。"
 SOV_secure_the_baltics: "平定波羅的海"
 SOV_secure_the_baltics_desc: "波羅的海區域自古以來便是俄羅斯不可分割的一部分，可他們居然趁國勢虛弱之時分裂了出去。現在，我們必須要儘快收復這片領土。"
 SOV_panslavic_nationalism: "泛斯拉夫民族主義"
 SOV_panslavic_nationalism_desc: "俄羅斯自古以來就是斯拉夫大家族的老大哥。歷史告訴我們，如果我們不團結在一起，斯拉夫人就會遭到無盡的侵略、凌虐和壓迫。"
 SOV_panslavic_nationalism_tt: "§R這些國家必須批准該協議才能使獎益生效。§!\n"
 SOV_pacify_the_rim: "平定遠東邊疆"
 SOV_pacify_the_rim_desc: "我們不能再像日俄戰爭那樣，遠東領土被攻擊時卻不幸地發現我們沒有為突襲做好準備。我們需要在當地興建基礎設施，以在需要時快速調兵。"
 SOV_eastern_expansion: "向東擴張"
 SOV_eastern_expansion_desc: "俄羅斯的未來在於東方。在馴服西伯利亞之後，盡力獲取更多的土地和資源是我們唯一應盡之事。"
 SOV_restore_the_old_eastern_empire: "重建舊東方帝國"
 SOV_restore_the_old_eastern_empire_desc: "我們光榮的帝國曾經越過了太平洋的邊緣並深入美洲，可未經充分考慮便決定用這些領地換來了短期的財政收入。然而在我們的領導之下，俄羅斯將要求收回她的美洲領地。我們只需要讓其現在的所有者撤出該地。"
 SOV_intervention_in_the_americas: "干涉美洲"
 SOV_intervention_in_the_americas_desc: "政權動盪的瘟疫一直籠罩著加勒比和拉丁美洲地區的諸小國邦。現在正是我們在政治上大展拳腳並“鼓勵”他們國內政治發展朝向力量和穩定的時機。一旦他們發展出了與我們有著相似體制的政府，我們日漸成長的軍事同盟將為他們提供一席之地。"
 SOV_intervention_in_the_americas_tt: "受到影響的國家更有可能轉變為法西斯政體。\n因該影響轉變為法西斯政體的國家會被邀請到我們的陣營。"
 SOV_memories_of_1905: "一九零五年的恥辱回憶"
 SOV_memories_of_1905_desc: "1905年俄日戰爭的戰敗仍是我國人民共同記憶中的一塊汙點。我們必須利用這點，勸告工人們盡心盡力打造出一支足以讓我們主宰太平洋的新艦隊，並在他們的國仇家恨上煽風點火，這樣他們就會呼籲用這支艦隊向我們的宿敵復仇。"
 SOV_rebuild_the_far_eastern_fleet: "重建遠東艦隊"
 SOV_rebuild_the_far_eastern_fleet_desc: "如果我們想要守護在遠東的利益，甚至是在該地區發動進攻，我們就必須極大地提升該地區的船舶製造修理能力。"
 SOV_modernize_the_far_eastern_fleet: "遠東艦隊現代化"
 SOV_modernize_the_far_eastern_fleet_desc: "對馬島之戰教會我們不能依賴數量。我們需要經過良好訓練的船員駕駛毫無瑕疵的現代戰艦才能真正贏得一場海戰的勝利。我們建造的新艦隊必須能在這點上和我們技術先進的太平洋敵手較量。"
 SOV_the_lonely_island: "[SOV.GetLonelyIslandName]"
 SOV_the_lonely_island_desc: "[SOV.GetLonelyIslandDesc]"
 SOV_THE_LONELY_ISLAND_NAME_NORMAL: "海外孤島"
 SOV_THE_LONELY_ISLAND_NAME_INDEPENDENCE: "偉大的獨立衛國戰爭"
 SOV_THE_LONELY_ISLAND_DESC_NORMAL: "是時候糾正日本人在1905年施加於我們的羞辱了。這次，沒有什麼能阻止我們統治日本海並讓他們屈服！"
 SOV_THE_LONELY_ISLAND_DESC_INDEPENDENCE: "我們為內戰時來自[JAP.GetAdjective]的援助已經付出了太多、太多的代價了。到此為止！我們將不惜一切代價以奪回我們的獨立自由。"
 SOV_an_empire_in_the_pacific: "太平洋帝國"
 SOV_an_empire_in_the_pacific_desc: "隨著我們的帝國開始跨越太平洋，我們的艦船設計也得要足以支撐我們越過重洋展現國力、施加影響。"
 SOV_dismantle_the_zemsky_sobor_tt: "當前§Y非法西斯黨派§!支持度的一半將適用於§R穩定度§!的懲罰：\n"
 SOV_an_empire_in_the_pacific_tt: "獲得§Y大中華區§!內所有地區的§G宣稱§!。"
 SOV_capital_of_the_tsars: "沙皇舊都"
 SOV_capital_of_the_tsars_desc: "聖彼得堡在歷史上一直是我們偉大祖國的國都。現在，隨著羅曼諾夫王朝重返冬宮，是時候將正式國都遷回這座恢宏之城了，而所有的努力都將會讓它更加光彩照人。"
 SOV_capital_of_the_tsars_tt: "其效果為：\n當地建設速度：§G+25%§!"
 SOV_the_iron_wall_of_russian_resolve: "俄國信念的鐵壁"
 SOV_the_iron_wall_of_russian_resolve_desc: "沙皇期望建造一支由巨型戰爭兵器所組成的軍團。這些戰爭巨獸將會讓現有的坦克相形見絀，並在戰場上所向披靡。俄羅斯民族從未被征服，也無人能征服！這些巨械將成為這種信念的化身，而我們會依靠它們擊敗所有來犯敵軍。"
 SOV_the_triple_entente: "重鑄三國協約"
 SOV_the_triple_entente_desc: "我們必須遏制虎視眈眈的中歐宿敵。曾有一個聯盟為此而生，然而我們在世界大戰中的屈辱敗退宣告了它的結束，而現在正是再造這一連結的時候。"
 SOV_our_slavic_commitments: "斯拉夫承諾"
 SOV_our_slavic_commitments_desc: "我們曾是所有斯拉夫人的保護者，甚至曾為協防弱小的斯拉夫同胞而參加世界大戰。此刻我們將再次承擔起這一重任，並將我們的軍力借予他們以供防禦。"
 SOV_the_fate_of_romania: "羅馬尼亞的命運"
 SOV_the_fate_of_romania_desc: "羅馬尼亞境內有著大量的斯拉夫族裔，並且其阻斷了我們與巴爾幹斯拉夫人的陸地通道。為了一次性解決這兩大難題，羅馬尼亞的獨立地位必須被終結，即便這意味著需要我們付諸武力。"
 SOV_russian_corporate_state: "俄羅斯社團國"
 SOV_russian_corporate_state_desc: "俄羅斯的未來並非階級鬥爭，而應階級合作。為此，我國將建立國家工會以協調勞動者和資本家的利益，並以此規範生產。"
 SOV_the_berlin_moscow_axis: "柏林-莫斯科軸心"
 SOV_the_berlin_moscow_axis_desc: "鑑於如今我國新政府的建立參照了德意兩國體制，我們應該嘗試修補與西境鄰邦的關係。如果可以求同存異，我們或許能與[GER.GetName]建立一個牢固而持久的聯盟。"
 SOV_japanese_overtures: "對日提議"
 SOV_japanese_overtures_desc: "隨著西部側翼現在已經安全，我們必須處理東部側翼。儘管他們自己可能不願意承認這一點，但日本人在各方面都與德國人頗為相似，與我們的新政府相比更是如此。讓我們詢問一下德國人對於向日本拋出橄欖枝的看法吧。"
 SOV_into_central_asia: "進入中亞"
 SOV_into_central_asia_desc: "征服中亞能讓我們獲得威脅印度的戰略位置，同時也打通了前往波斯灣的通路。此地的戰略必要性一目瞭然，我們的帝國也絕不會在這裡踏入墳場。"
 SOV_the_last_break_southward: "終破南方"
 SOV_the_last_break_southward_desc: "最後的一系列征服行動將奪取西亞和博斯普魯斯海峽的剩餘部分，使我們能在爭奪印度控制權時確保側翼安全。從鄰近的地中海至遙遠的印度洋，我們終將無可爭議地獲得通往四海的航道。"
 modify_the_red_army_tt: "§Y紅軍§!追加效果："
