 CHI_overlordship_over_indochina_tt: "我們獲得了針對他們的戰爭目標"
 transfer_state_tt: "我們收復了該地區"
 #Custom Tooltips
 POL_find_a_king_tt: "§Y在該國策完成後§!，波蘭王位的候選人將經由一系列§Y事件§!宣稱自己為[Root.GetFlag]§Y波蘭§!的§Y國王§!。\n選定一位候選人後，相應的國策就會§Y完成§!。"
 has_sanation_left_tt: "政府還未驅逐§Y薩納齊亞左派§!。"
 has_sanation_right_tt: "政府還未驅逐§Y薩納齊亞右派§!。"
