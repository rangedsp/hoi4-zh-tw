 SOV_focus_select_effect_tt: "自選擇國策起即開始生效："
 SOV_focus_complete_effect_tt: "\n國策完成時獲得以下效果："
 SOV_infrastructure_effort_nsb: "重視基建"
 SOV_infrastructure_effort_nsb_desc: "$SOV_infrastructure_effort_desc$"
 SOV_heavy_industry: "重工業"
 SOV_heavy_industry_desc: "隨著工業化進程的加速，是時候將重心轉向重工業來預備生產更多的軍需物資了。"
 SOV_finish_the_five_year_plan: "[GetFinishTheFiveYearPlanName]"
 SOV_finish_the_five_year_plan_default: "完成第二個五年計劃"
 SOV_finish_the_five_year_plan_alt: "廢除五年計劃"
 SOV_finish_the_five_year_plan_desc: "[GetFinishTheFiveYearPlanDesc]"
 SOV_finish_the_five_year_plan_desc_default: "第二個五年計劃優先發展重工業。蘇聯必須快速發展以趕超西方資本主義和法西斯主義列強。"
 SOV_finish_the_five_year_plan_desc_alt: "蘇維埃政權的五年計劃把國家的密集工業化置於其他事項之上，使其成為布爾什維克壓迫的最顯著象徵之一。我們必須推倒這一計劃並開始構想新的國家工業化計劃。"
 SOV_third_five_year_plan: "[GetThirdFiveYearPlanName]"
 SOV_third_five_year_plan_default: "第三個五年計劃"
 SOV_third_five_year_plan_alt: "國家工業化新計劃"
 SOV_third_five_year_plan_desc: "[GetThirdFiveYearPlanDesc]"
 SOV_third_five_year_plan_desc_default: "趁著和平時光，我們必須加速工業化來滿足人民和軍隊的需求。"
 SOV_third_five_year_plan_desc_alt: "我們已經調整了國家工業化計劃，以便使軍民生產獲得長期的發展，且無需壓迫人民或犧牲他們的基本需求。"
 SOV_reorganize_the_pc_of_heavy_industry: "[GetReorganizeThePcOfHeavyIndustryName]"
 SOV_reorganize_the_pc_of_heavy_industry_name_default: "重組重工業人民委員部"
 SOV_reorganize_the_pc_of_heavy_industry_name_alt: "重組工業部"
 SOV_reorganize_the_pc_of_heavy_industry_desc: "我們此前將重心轉向重工業的過程暴露出了行政管理中的一些低效環節。我們必須確保把正確的人用在正確的崗位上，讓生產工作能夠繼續順利進行。"
 SOV_industrial_modernization: "工業現代化"
 SOV_industrial_modernization_desc: "西方國家正迅速採用新生產方式並引入新技術。我們不能只是滿足於跟上他們的步伐——我們必須超過他們！"
 SOV_increase_state_reserves: "增加國家資源儲備"
 SOV_increase_state_reserves_desc: "我們發展中的工業需要越來越多的資源。我們無法保證資源生產的增速總是能跟得上工業發展的腳步，因此我們必須抓住一切機會盡可能地建立資源儲備。"
 SOV_shift_to_armaments_production: "轉向軍備生產"
 SOV_shift_to_armaments_production_desc: "一場戰爭正在醞釀著。我們還不知道誰將率先出擊，但我們遲早也會成為被攻擊的對象。我們必須從現在就開始做準備，以應對這一天的到來。"
 SOV_optimize_production_lines: "優化生產線"
 SOV_optimize_production_lines_desc: "其他國家已經成功在其工廠中推行“福特製”來實現產量最大化。我們必須學習這些先例。"
 SOV_steel_casting_industry: "鑄鋼工業"
 SOV_steel_casting_industry_desc: "我們的金屬冶煉行業一直處於工業發展的最前沿，但我們可以採用最新的生產方法進一步推動冶煉行業的發展。"
 SOV_synthetic_rubber: "合成橡膠"
 SOV_synthetic_rubber_desc: "總有一天，我們將不能再依賴於從外國進口橡膠。當那天到來時，我們必須準備好使用自產的橡膠滿足我們的需求。"
 SOV_oil_production: "石油生產"
 SOV_oil_production_desc: "為了我們的工業發展和軍隊現代化，我們合乎邏輯的下一步計劃就是增加摩托化。然而，這將需要大量的潤滑劑和燃料儲備。值得慶幸的是，我們擁有大量的石油儲備可用，只需發展必要的工業即可加以利用。"
 SOV_restoration_and_development: "重建和發展"
 SOV_restoration_and_development_desc: "現在戰爭已經結束，我們可以專心於和平發展工業，以及改善人民生活。"
 SOV_fourth_five_year_plan: "[GetFourthFiveYearPlanName]"
 SOV_fourth_five_year_plan_default: "第四個五年計劃"
 SOV_fourth_five_year_plan_alt: "新的開始"
 SOV_fourth_five_year_plan_desc: "完全消除戰爭所帶來的影響還需要一些時間，但通過樹立一個正確的目標，我們已經可以在生產力上取得一些提升。"
 SOV_found_the_comecon: "成立經互會"
 SOV_found_the_comecon_desc: "戰爭已經表明，我們需要加強我們的合作並且促進我們的朋友和夥伴們之間的繁榮提升。為此，我們將建立一個組織來協調我們國家之間的貿易和經濟發展。"
 SOV_found_the_warsaw_pact: "華沙條約組織已成立"
 SOV_found_the_warsaw_pact_desc: "變革之風正席捲歐洲大陸，形勢愈發清晰地表明：我們必須締結集體防禦條約，方能抵禦腐朽西方勢力的任何侵略。為此，我們應當正式成立華沙條約組織，將其作為經濟互助委員會在軍事層面的重要補充。"
 SOV_warsaw_pact_faction: "華沙條約組織"
 SOV_the_common_economic_space_initiative: "共同經濟空間倡議"
 SOV_the_common_economic_space_initiative_desc: "如果我們能夠讓我們的產品更容易地進入新市場並且以更低的貿易壁壘獲取我們的經濟所需的戰略資源，那麼我們的經濟增長將會更加容易。我們應當設立一個組織來促成這一目的。"
 SOV_no_time_for_peace: "無暇和平"
 SOV_no_time_for_peace_desc: "無論我們多麼渴望它，長久的和平都是一件希望渺茫的事情。新的武器和科技將使戰爭比以往更具毀滅性。可悲的是，我們只能投入我們來之不易的資源，確保我們的軍事力量能跟上敵人的步伐。"
 SOV_national_specialists: "本國專家"
 SOV_national_specialists_desc: "我們的經濟發展必須依靠熟悉本地情況的本國人。外國人需要更長的時間來學習相應的知識，而且更可怕的是，他們離開的時候也會帶走知識。"
 SOV_foreign_experts: "外國專家"
 SOV_foreign_experts_desc: "有很多外國專家可以教我們如何發展經濟。幸好他們大都是些資本主義者，方便了我們直接購買他們的服務。"
 SOV_eastern_development: "發展東部"
 SOV_eastern_development_desc: "烏拉爾山另一邊的遠東地區提供了工業發展所需的大量未開採資源與廣袤土地。我們必須確保這裡準備就緒以待大規模開發。"
 SOV_develop_the_urals: "發展烏拉爾"
 SOV_develop_the_urals_desc: "我國的最大威脅應該是在歐洲的國家。通過開發烏拉爾山另一側的地區，我們將建立連超遠程轟炸機都無法觸及的工業後備實力。"
 SOV_the_ussr_academy_of_sciences: "[GetTheUssrAcademyOfSciencesName]"
 SOV_the_ussr_academy_of_sciences_default: "蘇聯科學院"
 SOV_the_ussr_academy_of_sciences_alt: "帝國科學院"
 SOV_the_ussr_academy_of_sciences_desc: "為了在應用科學領域保持競爭力，我們必須在理論科學方面也走在最前沿。我們已經擁有一座趨於完善的科學院，但如果能為它提供一些額外的資金，它將成為真正的世界一流的科研基地。"
 SOV_national_academies_of_sciences: "加盟共和國科學院"
 SOV_national_academies_of_sciences_desc: "在我們自己的科學院做出表率之後，我們的成員國也應當積極建立類似的機構來提升他們自己的科研能力。"
 SOV_transformation_of_nature: "改造自然"
 SOV_transformation_of_nature_desc: "隨著科學界不斷突破著舊思想觀念中可能性的邊界，即使是最宏大、最激進的計劃也變得可行起來。"
 SOV_transformation_of_nature_alt: "$SOV_transformation_of_nature$"
 SOV_transformation_of_nature_alt_desc: "$SOV_transformation_of_nature_desc$"
 SOV_expand_the_aircraft_industry: "發展航空工業"
 SOV_expand_the_aircraft_industry_desc: "在即將到來的戰爭中，我們的空軍必須能夠抵禦配備了最新式裝備的敵人的攻擊。我們不僅要確保空軍的飛機和敵人同樣先進，還要確保飛機的數量足夠多。"
 SOV_modernize_aircraft_facilities: "航空設施現代化"
 SOV_modernize_aircraft_facilities_desc: "就算我們擁有世界上最好的飛機，如果它們只能從崎嶇的跑道上起飛，在漏雨的棚屋中維護，那它們也將很快變得毫無用處。想要確保我們的飛機有最好的性能，我們還需要擁有最好的配套設施。"
 SOV_modernize_aircraft_facilities_tt: "如果§Y[260.GetName]§!未建設其他§Y實驗設施§!，我們將在§Y[260.GetName]§!獲得§G1§!座§Y空氣動力學與航空電子研究設施§!。"
 SOV_merge_aircraft_plants: "合併航空工廠"
 SOV_merge_aircraft_plants_desc: "不同設計局之間的競爭固然產生了不斷改進的動力，但由此帶來的重複工作也消耗了我們負擔不起的寶貴資源。我們應該合併我們的設計局以消除這種浪費。"
 SOV_found_the_jet_institute: "建立噴氣機研究院"
 SOV_found_the_jet_institute_desc: "目前的活塞引擎已經到達了極限。未來的飛機將要依靠於新的推進方式。我們應該成立噴氣引擎研究所，以保證我們不會落後於外國的發展。"
 SOV_increase_aircraft_production: "增加飛機產量"
 SOV_increase_aircraft_production_desc: "目前我們對於安全已經過於強調，以至於妨礙了飛機的產量。我們可以減少一些冗餘的安全系統，以節省大量的資源，同時仍然可以維持一支安全而可靠的空軍。"
 SOV_foster_flying_clubs: "扶持飛行俱樂部"
 SOV_foster_flying_clubs_desc: "如果一個人從沒見過飛機，那麼他的飛行員訓練將會非常昂貴。但是相當多的年輕人都痴迷於飛行，只要給予一點鼓勵，他們就能知道如何操縱一架飛機，進而會非常容易從他們中挑選並培養出優秀的戰鬥機飛行員。"
 SOV_women_in_aviation: "航空業中的女性"
 SOV_women_in_aviation_desc: "過去，社會中的反動勢力宣稱飛行是屬於男人的領域。但是，全世界的女性可不認同他們的觀點，並證明了在天空上她們和男同胞們一樣優秀。我們應當鼓勵我們的婦女也嘗試飛行，並從她們中選取最優秀的飛行員。"
 SOV_raskovas_aviation_group: "[GetRaskovasAviationGroupName]"
 SOV_raskovas_aviation_group_default: "拉斯科娃航空團"
 SOV_raskovas_aviation_group_alt: "帝國首支全女性航空團"
 SOV_raskovas_aviation_group_desc: "[GetRaskovasAviationGroupDesc]"
 SOV_raskovas_aviation_group_desc_default: "瑪麗亞·拉斯科娃已經證明了她是極其優秀的飛行員與領航員。隨著在戰爭中的資源逐漸吃緊，把這樣一位傑出的飛行員晾在一旁是莫大的浪費。我們應當給她建立一些航空隊的資源以加入戰鬥。"
 SOV_raskovas_aviation_group_desc_alt: "我們有極其優秀的女性飛行員與領航員。隨著在戰爭中的資源逐漸吃緊，把這樣經驗豐富的飛行員們晾在一旁是莫大的浪費。我們應該組建一些全部由女性飛行員組成的航空隊來加入戰鬥。"
 SOV_intensify_pilot_training_program: "強化飛行員訓練項目"
 SOV_intensify_pilot_training_program_desc: "為了能與敵軍一較高下，我們的空軍必須在所有狀況下都能執行飛行和戰鬥任務。用最高的標準訓練我們的飛行員是達成這一目的最切實可行的辦法。我們的飛機在數量和技術條件上均不佔優勢，但我們一定會用最棒的技巧來彌補。"
 SOV_expand_aviation_institutes: "擴建航校"
 SOV_expand_aviation_institutes_desc: "限制我們空軍擴編的最嚴重瓶頸在於訓練飛行員的數量。通過擴增航空學院，我們將會有一支更大更完善的空軍。"
 SOV_ground_support: "對地支援"
 SOV_ground_support_desc: "我們空軍的首要任務就是支援地面部隊。所有決定都必須遵循這一基本原則。"
 SOV_long_range_aircraft: "長程飛機"
 SOV_long_range_aircraft_desc: "科技的發展使得我們的轟炸機可以深入敵方本土腹地，摧毀他們的工業能力並縮短戰爭。陸軍的存在無非就是守住戰線並等待戰略轟炸的勝利。"
 SOV_the_modern_war_in_the_skies: "現代空戰"
 SOV_the_modern_war_in_the_skies_desc: "自雙翼飛機在戰壕上空搏擊以來，空戰的歷史就由來已久。現今的空戰究其本質是工業實力的比拼，利用高性能，快節奏對敵人實施晝夜不停的持續作戰。我們必須認清這一事實，並制定相應的規劃。"
 SOV_expand_the_red_fleet: "擴建[GetSovietArmyAdjectiveBasedOnIdeology]海軍"
 SOV_expand_the_red_fleet_desc: "[GetExpandTheRedFleetDesc]"
 SOV_expand_the_red_fleet_desc_default: "$SOV_expand_red_fleet_desc$"
 SOV_expand_the_red_fleet_desc_alt: "相比其他強國，[GetSovietArmyAdjectiveBasedOnIdeology]海軍太過羸弱。現在，我們國家的首要任務必須是擴充艦隊！"
 SOV_reinforce_western_naval_bases: "增建西部海軍基地"
 SOV_reinforce_western_naval_bases_desc: "波羅的海艦隊基地的防護很差。我們應該投入一些資源以保護它的錨地，並提高它的艦船修復能力。"
 SOV_reinforce_northern_naval_bases: "增建北部海軍基地"
 SOV_reinforce_northern_naval_bases_desc: "摩爾曼斯克位於北極圈以北，但諷刺的是，它是我國唯一的全年不凍港，且這個港口可以通往公海。我們應該進一步發展這裡，以更好地與全世界交通。"
 SOV_reinforce_southern_naval_bases: "增建南部海軍基地"
 SOV_reinforce_southern_naval_bases_desc: "黑海可能看起來像個次要戰區。但是如若我們失去了對黑海的控制，我們南部的大片領土都將暴露於敵人的入侵之下，就像克里米亞戰爭中發生過的那樣。為了不讓這種情況再次發生，我們需要強化該區域的海軍基地。"
 SOV_reinforce_eastern_naval_bases: "增建東部海軍基地"
 SOV_reinforce_eastern_naval_bases_desc: "即使在1905年的羞辱以後，日本人也沒有斷絕想要侵佔我們領土的小動作。我們必須做好與之交戰的準備，這意味著我們必須加強在該地區的海軍基地建設。"
 SOV_expand_shipbuilding_plants: "擴建造船廠"
 SOV_expand_shipbuilding_plants_desc: "我國的地理環境迫使我們的船塢分散於各處以增援各大洋的艦隊。試圖擴大造船能力，就必須將資源散於全國各地。"
 SOV_merge_naval_plants: "合併造船廠"
 SOV_merge_naval_plants_desc: "海軍艦艇的建造與設計是一項費時費力的工程，過度競爭帶來的重複工作只會導致無效的資源浪費和低下的效率。我們應該合併設計局以減少這種無謂的損失。"
 SOV_pc_of_the_ussr_navy: "[GetPcOfTheUssrNavyName]"
 SOV_pc_of_the_ussr_navy_default: "蘇聯海軍人民委員部"
 SOV_pc_of_the_ussr_navy_alt: "俄羅斯海軍部"
 SOV_pc_of_the_ussr_navy_desc: "隨著我們海軍的現代化與實力增長，是時候將海軍視為與陸軍同等重要的武裝力量了。第一步就是允許海軍建立獨立於陸軍的管理部門。"
 SOV_surface_warfare: "水面作戰"
 SOV_surface_warfare_desc: "建造主力艦需要花費大量的時間與資源，還往往在建造完成之前就過時了。小型艦艇不僅建造得更快，也容易趕上最新的科技進步。我們應當專注於建造輕型艦船以作為水面作戰的中堅力量。"
 SOV_submarine_warfare: "水下作戰"
 SOV_submarine_warfare_desc: "潛艇在海戰中有著不可比擬的優勢。一條設計精良的現代潛艇在發射魚雷前幾乎是不可探測的，同時還有潛力重創造價與大小數倍於己的主力艦。我們應當專注於建造潛艇以作為海戰攻勢的主力。"
 SOV_offensive_maritime_strategy: "進攻性海軍戰略"
 SOV_offensive_maritime_strategy_desc: "我們可不能等著敵人來找我們作戰。我們必須搶佔先機、逢敵必戰。"
 SOV_an_oceangoing_navy: "藍水海軍"
 SOV_an_oceangoing_navy_desc: "$SOV_ocean_going_navy_desc$"
 SOV_mine_warfare: "水雷戰"
 SOV_mine_warfare_desc: "使用艦船來保衛我們的整條海岸線經濟上是不合算的。通過在戰略要地佈設水雷，我們可以阻擾乃至擊傷試圖接近我國海岸的敵方艦隊。"
 SOV_long_range_raiders: "萬里奇兵"
 SOV_long_range_raiders_desc: "我們的海軍基地與主要航線的距離都很遠，所以現有的潛艇難以抵達最好的獵殺場地。我們應當開發長程潛艇以確保在最有效的地點展開進攻。"
 SOV_advanced_maneuvers: "先進演習"
 SOV_advanced_maneuvers_desc: "如果船員們不知道如何操作這些艦艇，擁有大型的和現代化的艦艇是毫無意義的。我們必須定期舉行大規模的海軍演習，以訓練我們的船員和海軍軍官學習現代海戰的方式。"
 SOV_expand_the_morskaya_aviatsiya: "擴編海軍航空部隊"
 SOV_expand_the_morskaya_aviatsiya_desc: "飛機的出現極大地改變了陸戰的本來面目。在未來，哪怕是最先進的水面艦艇，也要面臨來自天空的嚴重威脅。我們要時刻堅持打造一支先進的海軍航空兵部隊，與我們的水面艦艇部隊協同作戰。"
 SOV_naval_infantry: "海軍步兵"
 SOV_naval_infantry_desc: "[GetNavalInfantryDesc]"
 SOV_naval_infantry_desc_default: "雖然我們無意以帝國主義的方式入侵敵方海岸，但在突襲敵方海岸設施和威脅敵方海岸線方面，一支專門的海軍步兵部隊非常有用。"
 SOV_naval_infantry_desc_alt: "如果我們要開疆拓土，一支專門的海軍步兵部隊會在突襲敵方海岸設施、威脅敵方海岸線與支援入侵部隊主力的任務中大有可為。"
 SOV_found_the_pcdi: "[GetFoundThePcdiName]"
 SOV_found_the_pcdi_name_default: "建立國防工業人民委員部"
 SOV_found_the_pcdi_name_alt: "建立國防工業部"
 SOV_found_the_pcdi_desc: "[GetFoundThePcdiDesc]"
 SOV_found_the_pcdi_desc_default: "我們的軍備工業已經發展得十分龐大，如果它要進一步得到發展，就需要一個專門的政府部門來協調。為此我們將建立國防工業人民委員部。"
 SOV_found_the_pcdi_desc_alt: "我們的軍備工業已經發展得十分龐大，如果它要進一步得到發展，就需要一個專門的政府部門來協調。為此我們將建立國防工業部。"
 SOV_pc_of_mechanical_engineering: "[GetPcOfMechanicalEngineeringName]"
 SOV_pc_of_mechanical_engineering_name_default: "機械工程人民委員部"
 SOV_pc_of_mechanical_engineering_name_alt: "機械工程部"
 SOV_pc_of_mechanical_engineering_desc: "我們的工業已經有能力製造更加巨大和複雜的機床以及其他重型機械了，因此我們有必要成立一個獨立的政府機構來協調這些工作。"
 SOV_superior_war_machines: "先進戰爭機器"
 SOV_superior_war_machines_desc: "過去幾十年來坦克以及其他裝甲載具飛速發展，既然有了大型的軍工企業生產並向軍隊供應這些裝甲車輛，我們可以發明更加強大的裝甲戰車並將大規模地使用它們以對抗敵軍。"
 SOV_the_means_to_wage_war: "平衡發展軍備"
 SOV_the_means_to_wage_war_desc: "儘管軍隊中的飛機坦克大炮是閱兵式上最威風，最引人注目的，但是普通士兵還是更在意他們手中槍支的質量和軍靴的舒適度。我們不得不承認，這些事情和任何的飛機大炮對於進行戰爭至少是同等重要的。"
 SOV_development_of_tankograd: "發展坦克城"
 SOV_development_of_tankograd_desc: "我們的國家幅員遼闊，從一個工廠到另一個工廠運送零部件是不現實的。我們應該將手頭的坦克工廠進行垂直整合——讓鋼材從一端進入，坦克成品從另一端出來。"
 SOV_pc_of_mortar_armament: "[GetPcOfMortarArmamentName]"
 SOV_pc_of_mortar_armament_name_default: "迫擊炮裝備人民委員部"
 SOV_pc_of_mortar_armament_name_alt: "迫擊炮裝備部"
 SOV_pc_of_mortar_armament_desc: "結構簡單的迫擊炮，正迅速成為我們部隊實施間瞄火力支援的主要力量。因此，我們必須全力盡可能多地生產各種口徑的迫擊炮，併為此專門組建一個政府部門。"
 SOV_soviet_artillery: "[ROOT.GetAdjective]火炮"
 SOV_soviet_artillery_tech_bonus_name_default: "蘇制火炮"
 SOV_soviet_artillery_tech_bonus_name_alt: "俄製火炮"
 SOV_soviet_artillery_desc: "現代戰爭的勝利是通過在正確的地方科學地應用火力而取得的。我們不僅要將關注點放在開發更好的火炮上，而且也要關注如何儘可能地有效發揮火炮的作用。"
 SOV_merge_tank_and_materiel_plants: "合併坦克和軍需品製造廠"
 SOV_merge_tank_and_materiel_plants_desc: "坦克和火炮可能最適合利用規模經濟進行批量生產。因此我們應該命令坦克生產商與軍需品生產商合併以利用這一特點。"
 SOV_strengthen_the_mobilization_plan: "強化動員計劃"
 SOV_strengthen_the_mobilization_plan_desc: "我們最大的軍事戰略優勢就在於我們廣袤的國土以及眾多的人口。可是一旦涉及到將部隊及時部署到前線，這兩個要素反而會相互衝突。我們必須不斷改進並完善我們的動員計劃以確保一旦戰爭爆發可以迅速集中軍力。"
 SOV_military_engineering_university: "軍事工程學院"
 SOV_military_engineering_university_desc: "雖然許多人都在宣稱塹壕戰已經隨著坦克和飛機的發展而終結，但軍事工程在現代戰場上明顯仍有一席之地。我們應該成立一個學院研究建造現代野戰工事的現代方法。"
 SOV_leningrad_polytechnical_institute: "[195.GetName]理工學院"
 SOV_leningrad_polytechnical_institute_desc: "作為我們最重要的工程學校，[195.GetName]理工學院長期以來一直為我國提供工程師和工業設計師。我們應該進一步擴張它，以確保不斷增長的工業中總是有最好的人可以填補任何新職位。"
 SOV_soviet_atomic_bomb_project: "[ROOT.GetAdjective]原子彈計劃"
 SOV_soviet_atomic_bomb_project_desc: "我們知道其他國家的科學家正在努力研究將宇宙中最基本的力量變成一種新式武器的方法。雖然我們落後了，但我們可以利用他們的工作來推進我們自己的工作，並確保殺傷力均勢的維持。"
 SOV_soviet_atomic_bomb_project_tt: "如果§Y[588.GetName]§!未建設其他§Y實驗設施§!，我們將在§Y[588.GetName]§!獲得§G1§!座§Y核研究設施§!。"
 SOV_move_industry_to_the_urals: "向烏拉爾轉移工業"
 SOV_move_industry_to_the_urals_desc: "戰爭已經迫近，祖國正受到威脅。雖然我們的部隊將戰鬥到最後一顆子彈，不讓出土地一步，但考慮到敵人的力量，這可能還遠遠不夠。在工廠被攻陷之前，必須將其疏散到安全地帶。"
 SOV_the_road_of_life: "生命之路"
 SOV_the_road_of_life_desc: "我們的數個城市都面臨著被圍城的危險，必須向這些城市派出增援部隊，不計代價地保衛它們。"
 SOV_improve_the_stalin_line: "[GetImproveTheStalinLineName]"
 SOV_improve_the_stalin_line_name_default: "鞏固斯大林防線"
 SOV_improve_the_stalin_line_name_alt: "加強西部防禦線"
 SOV_improve_the_stalin_line_desc: "我們的西部邊界太長，以至於不可能整體強化其防禦。但是我們可以在一些敵人進攻時的必經之路上修建一系列防禦工事，以便到時候我們可以輕易地用大部隊發起反擊。"
 SOV_the_molotov_line: "[GetTheMolotovLineName]"
 SOV_the_molotov_line_name_default: "莫洛托夫防線"
 SOV_the_molotov_line_name_left: "托洛茨基防線"
 SOV_the_molotov_line_name_right: "布哈林防線"
 SOV_the_molotov_line_name_exiles: "沙皇防線"
 SOV_the_molotov_line_desc: "近期歐洲地緣政治的改變，使得我們的西部邊界獲得了延伸。所有舊的築壘計劃都已經過時了。我們必須沿我們的新邊界建造一條新的防禦線，這樣在遭到進攻時我們可以遲滯敵人，直到我們完成動員並開始反擊。"
 SOV_the_defense_of_moscow: "莫斯科防衛"
 SOV_the_defense_of_moscow_desc: "敵人就在莫斯科的大門。這裡就是我們誓死堅守並且要讓敵人潰敗的地方，就像當年對拿破崙一樣！"
 SOV_impregnable_forts: "堅不可摧的要塞"
 SOV_impregnable_forts_desc: "[ROOT.GetAdjective]工程現在能夠創造出真正可怕的防禦工事，即使是最猛烈的轟炸也能輕鬆抵禦，而且幾乎不可能在攻擊中易手。如果有必要，有了大量的彈藥和物資儲備，這些要塞可以抵禦敵人的攻擊多年。"
 SOV_protect_the_white_sea_baltic_canal: "保護白海—波羅的海運河"
 SOV_protect_the_white_sea_baltic_canal_desc: "波羅的海和白海之間的運河是現代工程的奇蹟，不能讓它落入敵人手中。"
 SOV_far_east_fortification: "設防遠東"
 SOV_far_east_fortification_desc: "自1905年與日本的戰爭以來，我們一直厭倦於關注該地區。日本軍部無恥而貪婪地窺視我們在遠東的資源，這已不是什麼秘密。我們必須為在此地的對抗做好準備，並且必須採取措施遲緩敵人的任何進攻，以贏得時間將部隊從俄羅斯西部部署到該地區。"
 SOV_restore_cossack_units: "恢復哥薩克部隊"
 SOV_restore_cossack_units_desc: "在需要的時候，祖國不會事無鉅細地詢問為了保衛它而服役的人。任何願意拿起武器對抗侵略者的人都是受歡迎的，並將盡其所能地受用。"
 SOV_cohesion_first: "團結第一"
 SOV_cohesion_first_desc: "在這種情況下，最不需要的就是降低我們的標準。我們歡迎任何想參軍的人——但他們將在現有的部隊中服役，並按照合適的軍事標準訓練。"
 SOV_rehabilitated_military: "改造軍隊"
 SOV_rehabilitated_military_desc: "[GetRehabilitatedMilitaryName]"
 SOV_rehabilitated_military_desc_default: "現在很清楚，我們對軍隊的密切關注也許有點過於熱心了。雖然在和平時期完全合理，但在戰爭期間，我們應該讓專業人員基於軍事情況作出判斷，而不是基於政治考慮。現在是時候約束一下政工幹部，讓指揮官在如何管理方面有更大的自由度。"
 SOV_rehabilitated_military_desc_alt: "布爾什維克極其狂熱地監視軍隊，而這對他們來說有什麼用？雖然我們必須保留政工軍官的身影，以確保剷除共產主義思想，但在戰爭期間，應該讓軍官基於軍事情況作出判斷，而不是基於政治考慮。"
 SOV_military_reorganization: "軍事重組"
 SOV_military_reorganization_desc: "建立機械化大軍是崇高的嘗試，但超過了我們的承受能力。為了贏得這場戰爭，我們將不得不把重點放在幾個世紀以來使俄羅斯軍隊取勝的武器上：步兵和炮兵。這就必然要求我們在一定程度上破壞現有的編制。"
 SOV_desperate_measures: "非常措施"
 SOV_desperate_measures_desc: "在這種非常的情況下，我們必須採取我們以前認為不可能的措施。必須做任何能夠阻止入侵的事情。"
 SOV_an_adaptable_army: "強於適應"
 SOV_an_adaptable_army_desc: "這場戰爭橫跨幾個氣候帶和許多不同的地形。如果想贏得這場戰爭，我們必須能夠在各種地形和任何天氣下作戰。"
 SOV_lessons_of_war: "戰爭的教訓"
 SOV_lessons_of_war_desc: "無論我們在戰前有什麼計劃，在與敵人的接觸中都無所幸存。我們必須對這場戰爭給我們帶來的教訓持開放態度，而不是堅持過時的教條。只有這樣，我們才能停止退卻，重新開始發動進攻。"
 SOV_penal_battalions: "懲戒營"
 SOV_penal_battalions_desc: "在撤退過程中，許多本來精幹的士兵蒙羞於在陣地陷落前就撤退，或者以其他方式背叛了我軍的優良作風。但在這種情況下，僅僅監禁或處決他們會使我們失去善戰之兵。我們應該組建特殊部隊，讓這些人通過戰鬥來為己贖罪。"
 SOV_organization_of_the_partisans: "組織游擊隊"
 SOV_organization_of_the_partisans_desc: "在淪陷後，許多留在敵後的士兵選擇繼續戰鬥，而不是屈辱地被俘。他們與敵佔區的農民和工人一起，繼續與侵略者作戰。我們必須給他們送去支援，以便能拖住更多敵軍。"
 SOV_smersh: "施密爾舒"
 SOV_smersh_desc: "我們必須讓每一個公民清楚地認識到，間諜和敵方特工無處不在，任何任何閒言碎語都可能給敵人提供關鍵的信息，使他們獲得優勢。"
 SOV_barrier_troops: "督戰隊"
 SOV_barrier_troops_desc: "戰鬥往往是混亂的，有時士兵與上級指揮部失去聯繫是可以理解的。我們應該在前線後方設立單位，負責聚攏這些散兵遊勇，把他們帶回交戰的方向——並逮捕任何試圖逃避職責而背叛自己戰友的人。"
 SOV_experts_in_camouflage: "偽裝高手"
 SOV_experts_in_camouflage_desc: "為了達到並保持出其不意的效果，在為時已晚之前，我們必須絕對確保敵人不會發現我們部隊的位置或行動。每個士兵都必須接受偽裝技巧訓練。"
 SOV_keep_commissars_organization: "保留政委組織"
 SOV_keep_commissars_organization_desc: "即使在我們的新組織中，也需要人們確保軍隊對政府保持絕對忠誠。如果士兵對政府失去了信任，我們就會輸掉、而且很快輸掉這場戰爭。"
 SOV_adjoined_battle_priests: "隨軍戰鬥牧師"
 SOV_adjoined_battle_priests_desc: "隨著最近教會的權力和影響力在國內不斷增強，現在可能是允許教會參與軍事事務的時候了。神職人員在我們的軍事單位中擔任戰鬥牧師的角色，這將確保部隊知道上帝站在我們這邊，可能提高士氣，使普通士兵更熱忱地為國而戰。"
 SOV_swap_to_political_advisors: "軍事政治顧問"
 SOV_swap_to_political_advisors_desc: "我們的戰爭不僅僅是關於國家之間資源的較量。它是一場政治制度的較量。雖然我們不應該讓政治因素決定軍事決策，但仍然要在作出決定時確保考慮到這些政治因素。"
 SOV_the_glory_of_the_red_army: "[GetSovietArmyAdjectiveBasedOnIdeology]軍的榮耀"
 SOV_the_glory_of_the_red_army_desc: "我們已經成功擋住了敵人的進攻。現在是發動進攻的時候了，把戰爭帶回到它來的地方去吧！"
 SOV_the_glory_of_the_red_army_alt: "$SOV_the_glory_of_the_red_army$"
 SOV_the_glory_of_the_red_army_alt_desc: "$SOV_the_glory_of_the_red_army_desc$"
 SOV_the_path_of_marxism_leninism: "馬克思-列寧主義道路"
 SOV_the_path_of_marxism_leninism_desc: "馬克思、恩格斯和列寧同志絕對正確的教導讓我們的國家從積重難返的落後狀態一躍成為技術與工業強國。現在絕對不可以進行愚蠢的改弦更張。永遠高舉戰無不勝的工人解放旗幟前進再前進！"
 SOV_the_centre: "中間派"
 SOV_the_centre_desc: "斯大林同志是我們祖國最偉大的革命戰士。我們應該將革命的未來交到這位最能幹的戰士手中。"
 SOV_socialism_in_one_country: "一國建成社會主義"
 SOV_socialism_in_one_country_desc: "雖然世界革命是我們的最終目標——理論也論證了世界革命一定是最終的歸宿——但是我們必須首先保衛我們自己的社會主義革命成果，以免因為我們的失敗使得世界其他地區的工人革命受到消極影響。"
 SOV_the_stalin_constitution: "斯大林憲法"
 SOV_the_stalin_constitution_desc: "1924年憲法是內戰後為了重建國家進行的一次良好嘗試，但是它的使命已經完成了。我們現在需要一部新憲法。我們首先要非常感謝斯大林同志為了聯盟的強大和安穩所付出的不懈奮鬥。斯大林同志的才華與智慧對共產主義事業的發展壯大具有重要作用。"
 SOV_the_zinovyevite_terrorist_center: "季諾維也夫恐怖中心"
 SOV_the_zinovyevite_terrorist_center_desc: "1934年基洛夫同志遇刺案說明，黨內明顯有黨員密謀反對斯大林同志甚至危害蘇維埃聯盟。目前我們已經從幾個反革命同謀者那裡獲得了一些情報，這些情報牽扯出了更多的人。這個季諾維也夫陰謀明顯是由托洛茨基或西方代理人組織甚至共同實施的，必須在它擴散之前像癌症一樣被切除。"
 SOV_secure_the_administration: "確保政府忠誠"
 SOV_secure_the_administration_desc: "恐怖分子季諾維也夫和他的同謀者們的供述令我們大為震驚，我們必須對其他黨員的忠誠提出疑問。當務之急是知道每個政治局委員的立場。"
 SOV_the_collectivization_process: "集體化進程"
 SOV_the_collectivization_process_desc: "儘管我們還有許多工作需要完成，並且農業集體化在部分地區的貫徹和處理不太適當，蘇聯的農業集體化進程也算基本完成了，很快我們的農業產量將會有極大的提升。"
 SOV_the_anti_soviet_trotskyist_center: "托洛茨基反蘇維埃中心"
 SOV_the_anti_soviet_trotskyist_center_desc: "我們關於季諾維也夫陰謀的調查進一步揭露出存在於我們黨內的一個巨大的反蘇維埃恐怖串聯網絡。這個串聯網絡中的某些同志根本沒有意識到他們的所作所為在幫誰！這一陰謀必須被立刻剷除！為了實現這個目標，有些嚴酷手段是必須的。"
 SOV_the_workers_dictatorship: "工人階級專政"
 SOV_the_workers_dictatorship_desc: "我們國家的一切權力歸工人階級所有。我們無法承擔拉山頭搞宗派主義的代價，並且我們必須確保政治局的一切決議體現工人階級的意志。"
 SOV_organization_centralization_discipline: "集中化與黨紀"
 SOV_organization_centralization_discipline_desc: "在當下這個不確定的時刻，蘇聯人民期盼政治局帶來穩定並繼續指引革命方向。我們必須確保這個決策機構不光要緊緊團結在斯大林同志的周圍，而且要完全贊成斯大林同志的一切決定。"
 SOV_war_economy: "戰時經濟"
 SOV_war_economy_desc: "很明顯，我們國境外的那些資本主義反動國家正在計劃趁虛而入襲擊我們。我們必須將我們的經濟轉入戰時狀態，越快越好。"
 SOV_the_military_conspiracy: "軍隊陰謀"
 SOV_the_military_conspiracy_desc: "托洛茨基分子的陰謀已經蔓延到了我們的軍隊之中。現有證據表明有高級將領甚至是元帥已經與國外情報機構合謀顛覆我們的國家！我們決不能讓那些忠誠受到哪怕些微質疑的將領繼續呆在軍隊裡，防止他們進一步削弱我們的軍隊。"
 SOV_the_bloc_of_rights_and_trotskyites: "右派與託派反蘇聯盟"
 SOV_the_bloc_of_rights_and_trotskyites_desc: "我們終於觸及了在我們中間的陰謀集團的核心。尼古拉·布哈林事實上也是托洛茨基—季諾維也夫反革命集團的成員，並且很有可能是試圖在政府內部進行反革命暴動的集團的領導人。我們現在已經掌握了充分的證據，在最後的審判中，這些證據可以公之於眾。"
 SOV_behead_the_snake: "斬斷蛇頭"
 SOV_behead_the_snake_desc: "毫無疑問的是，不將托洛茨基集團徹底消滅，蘇聯永無寧日。儘管審判托洛茨基並且將他的反蘇維埃罪行公之於眾是個不錯的選擇，可這僅僅是一種奢望。除此之外剩下的唯一手段就是刺殺他以使反政府陰謀集團失去其主要領導人和煽動者。"
 SOV_stalins_cult_of_personality: "斯大林個人崇拜"
 SOV_stalins_cult_of_personality_desc: "隨著令人震驚的顛覆蘇聯的陰謀被揭露於世，很明顯只有斯大林同志的英明領導才能避免我們的國家陷入內戰甚至更壞的境況。每一位蘇聯人民，以及世界上所有的工人階級，都應當對斯大林同志為捍衛革命所做的不懈努力感激涕零。"
 SOV_they_will_know_fear: "他們將知曉恐懼"
 SOV_they_will_know_fear_desc: "我們的敵人已經開始逐漸懼怕紅軍與蘇聯人民了。我們經受住了敵人最初攻擊的考驗，現在則是我們反擊的時候了。我們必須研發驚人的新型戰爭機器以撕開敵人最堅固的防線。這樣的戰爭機器僅僅是它的名號就足以讓所有敵人對它恐懼萬分。"
 SOV_inheritor_of_the_mantle_of_lenin: "列寧衣缽繼承者"
 SOV_inheritor_of_the_mantle_of_lenin_desc: "斯大林同志是列寧最親近的夥伴和最信任的追隨者。作為列寧主義最堅定的信仰者與追隨者，斯大林同志理所應當地接過了引導我們國家向共產主義前進並且準備實現世界工人階級革命的使命。"
 SOV_brilliant_genius: "英明的天才"
 SOV_brilliant_genius_desc: "作為毫無疑問的世界最英明的領袖，斯大林同志將引導我們的國家向著科學發展的更高處去，同時將推動人類社會實現跨越式發展。"
 SOV_the_faithful_servant_of_lenin: "列寧的忠實僕從"
 SOV_the_faithful_servant_of_lenin_desc: "列寧給我們留下了世界歷史上最艱鉅的任務：建立一個所有人事實上平等，沒有壓迫、苦難，沒有物質生活貧瘠的社會。沒有人比斯大林同志更適合實現這一理想了，斯大林同志一路上追隨列寧同志，現在是時候實現革命期間作出的承諾了。"
 SOV_ban_excessive_hero_worship: "禁止過度英雄崇拜"
 SOV_ban_excessive_hero_worship_desc: "現在存在著一種爭相出版關於斯大林同志私人生活和童年經歷的誇張想像的出版物的傾向。無論出於怎樣的良好期望，這些試圖在蘇聯人民心中建立英雄化崇拜，並且試圖用盲目的偶像崇拜來代替對斯大林同志思想體系的研究的操作本質上說都是反革命的。"
 SOV_leader_of_the_party_and_the_people: "黨和人民的領袖"
 SOV_leader_of_the_party_and_the_people_desc: "斯大林同志憑藉著勤懇的工作和超人的能力完成了黨交給他的重大任務，他得到了全黨上下和全人民的全部支持。任何可能導致虛榮自大或自我吹捧的暗示對斯大林同志來說都是不合適的；他或許是世界上最謙遜的人了。"
 SOV_great_commander: "偉大的統帥"
 SOV_great_commander_desc: "斯大林同志在軍事思想和領導方面的成就不勝枚舉。儘管托洛茨基那個叛徒是紅軍的創建者，但正是斯大林同志將紅軍改組為能夠真正捍衛工人階級利益的武裝。"
 SOV_architect_of_communism: "共產主義設計師"
 SOV_architect_of_communism_desc: "斯大林同志對革命的信念理想堅定不移，這使他洞悉在一國建成社會主義的機遇和挑戰。隨著建設社會主義工作的順利進行，斯大林同志可以轉向新的歷史任務：即如何將社會主義進一步建設為徹底的共產主義。"
 SOV_father_of_nations: "各民族的慈父"
 SOV_father_of_nations_desc: "我們的聯盟是一個多民族大家庭，而任何家庭都需要一個大家長。慈父斯大林同志正是這位大家長，他確保著自己的孩子永遠接受社會主義思想的薰陶並指引我們走向更加光明的未來。他該嚴厲的時候就得嚴厲，不過這種嚴厲永遠是建立在公平公正的基礎上。"
 SOV_freedom_of_debate_unity_of_action: "自由討論，一致行動"
 SOV_freedom_of_debate_unity_of_action_desc: "治理並統御一個國家始終前進在正確的方向上面臨許多複雜的問題與矛盾，因此所有的可能選擇必須被充分公開地討論。一旦做出決定，政治局以及全黨上下必須毫無保留地支持。"
 SOV_the_construction_of_communism: "共產主義建設"
 SOV_the_construction_of_communism_desc: "即將來臨的共產主義建設必然會存在挑戰和阻礙。現在政治局上下緊緊團結在斯大林同志周圍，我們可以邁出建設共產主義的第一步。"
 SOV_addressing_internal_affairs: "處理國內事務"
 SOV_addressing_internal_affairs_desc: "儘管世界上還有許多革命的敵人，儘管還有成百萬的工人仍在翹首以求解放，我們必須首先將目光轉移到目前國內亟待解決的問題上。"
 SOV_nkvd_primacy: "內務部優先"
 SOV_nkvd_primacy_desc: "在祖國的所有敵人被徹底消滅之前，我們必須繼續依靠內務人民委員會來保護革命。"
 SOV_the_new_soviet_woman: "新蘇維埃婦女"
 SOV_the_new_soviet_woman_desc: "革命讓我們國家數百萬人民獲得自由，首先則是數百萬女性不再被囚禁於妻子和母親的身份桎梏中，她們在工作生產領域獲得了平等自由的地位。"
 SOV_expand_the_agitprop: "擴大宣傳"
 SOV_expand_the_agitprop_desc: "為了教育我們國家數以百萬計的勞動者，我們必須運用他們聽得懂的語言。我們必須讓我們的討論更加簡潔更加易於理解，這樣才能讓他們形成社會主義公民的意識，我們必須在這方面加大投入。"
 SOV_positive_heroism: "英雄主義宣傳"
 SOV_positive_heroism_desc: "儘管工人階級取得的成就應該由全體工人階級分享，但是我們依然可以挑選出一些值得他人學習效仿的先進模範。"
 SOV_revive_the_stakhanovite_movement: "重啟斯達漢諾夫運動"
 SOV_revive_the_stakhanovite_movement_desc: "資本主義國家的殘酷剝削強迫工人努力為生產資料的所有者生產更多的商品。在我們國家，像阿列克謝·斯達漢諾夫這樣的工人則是自己自主地努力勞動，因為他們明白，每一塊砌好的磚，每一噸開採出的煤，每一顆安好的鉚釘都在幫助建立一個使工人從剝削中徹底解放的世界。"
 SOV_war_heroes: "戰爭英雄"
 SOV_war_heroes_desc: "俄羅斯人民向來能夠在保衛祖國抵禦侵略者的過程中展現出極其英勇的行為。儘管我們是團結在一起對抗敵人，但是我們也不能忽視那些軍隊中那些超越自己的使命展現出極大勇敢的戰鬥英雄們。"
 SOV_collectivist_propaganda: "集體主義宣傳"
 SOV_collectivist_propaganda_desc: "我們所面臨的許多挑戰絕不僅僅針對的是個別人。我們所有的奮鬥都是集體的奮鬥，當然，我們所有的成就也是集體的成就。"
 SOV_socialist_emulation: "社會主義競賽"
 SOV_socialist_emulation_desc: "在資本主義體制下，工人們相互競爭只是為了賺得每天果腹的麵包，而工人們提高社會生產力所帶來的利潤悉數被資本家拿走。這完全是對生產力的浪費和沒有人性的剝削。社會主義體制則是鼓勵那些不夠優秀的人們向先進模範學習以實現他們自身的發展。"
 SOV_socialist_realism: "社會主義的現實主義"
 SOV_socialist_realism_desc: "通向社會主義光明未來道阻且長，有些或許半途喪失信心的人會認為這一目標永遠無法實現。我們必須鼓勵發展描繪社會主義國家真實風貌的藝術形式，來確切地向他們展現我們為之奮鬥的前景。"
 SOV_the_komsomol: "蘇維埃社會主義青年團"
 SOV_the_komsomol_desc: "我們不是為當今這一代大人們建設社會主義，而是為了孩子們這一代以及他們的下一代。我們必須教導他們如何在我們已經取得成就的基礎上繼續前進，這樣他們才能夠完成我們開闢的事業。我們應當建立一個特殊的青年組織，不光教育文化，也要教導他們如何成為一個優秀的共產主義者。"
 SOV_patriarch_of_all_russia: "全俄羅斯牧首"
 SOV_patriarch_of_all_russia_desc: "儘管開明進步的共產主義社會幾乎沒有理由允許落後的迷信行為存在，但不可否認的是許多人在困難時期從他們的宗教信仰中汲取了力量和慰藉。建設一個新社會的過程困難重重，因此只要那些宗教組織對國家保持忠誠，或許我們應該允許他們繼續發揮作用。"
 SOV_the_comintern: "共產國際"
 SOV_the_comintern_desc: "為工人階級解放的奮鬥事業不僅僅侷限於任何一個國家，它是世界性的鬥爭。我們必須向世界任何國家的同志們提供援助，鼓勵他們在世界任何地方同反動勢力與反革命勢力堅決鬥爭。"
 SOV_development_aid_for_eastern_allies: "建設支援東方盟友"
 SOV_development_aid_for_eastern_allies_desc: "幾個世紀以來，西方帝國主義與殖民主義殘酷地剝削壓迫亞洲各國。一點來自我們的適當投入可以讓我們亞洲的盟友們更好地抵抗資本主義的鎮壓。"
 SOV_war_measures_in_the_east: "東方戰時措施"
 SOV_war_measures_in_the_east_desc: "對抗法西斯主義和其他反革命意識形態的全球性鬥爭即將到達亞洲。我們必須向我們的盟友認識到在絕望的時刻，極端手段是必要的。"
 SOV_fortify_mongolian_border: "鞏固蒙古邊境"
 SOV_fortify_mongolian_border_desc: "儘管日本的強硬派目前著眼於在中國的擴張，我們也不能排除他們希望通過攻擊我們來擴大他們的收益的可能性。我們應當確保蒙古盟友不會變成毫無防備的側翼。"
 SOV_send_military_advisors_to_spain: "向西班牙派遣軍事顧問"
 SOV_send_military_advisors_to_spain_desc: "我們在西班牙的同志贏得民主選舉之後面臨著強大的反革命力量的威脅。我們必須援助他們以免他們的失敗鼓舞其他國家的法西斯勢力。"
 SOV_policy_of_collective_security: "集體安全政策"
 SOV_policy_of_collective_security_desc: "儘管歐洲的民主政府信仰資本主義又常常是反動派，但是他們也清楚法西斯主義者認為他們又脆弱又腐朽。一旦戰爭到來，他們將在法西斯衝擊我們革命始源地之前首先被法西斯浪潮攻陷。那些有足夠遠見的政治家應當能夠意識到他們可以在莫斯科找到同情者。"
 SOV_anti_fascist_policies: "反法西斯政策"
 SOV_anti_fascist_policies_desc: "與法西斯主義者絕不可和平共存，我們應當儘可能多地尋找盟友以求為不可避免的對抗做準備。"
 SOV_seek_a_defense_pact_with_the_allies: "尋求與同盟國的防衛條約"
 SOV_seek_a_defense_pact_with_the_allies_desc: "雖然我們與西方民主國家進行了非正式的接觸，但是並沒有達成任何有法律約束力的具體條約。現在是時候落實到紙上並向世界宣佈，西方民主國家願意與我們組成反抗法西斯擴張的聯合陣線。"
 SOV_the_khakimov_proposal: "哈基莫夫提案"
 SOV_the_khakimov_proposal_desc: "哈基莫夫為提高我們在[SAU.GetNameDef]政府中的影響力進行了不懈的努力。專家推測，這一地區擁有大量自然資源，資本家特別期望開採。我們應當繼續發展與他們穩定互信的關係以使[SAU.GetNameDef]遠離任何與我們敵對的陣營，並讓我們獲得潛在資源的優先開採權。"
 SOV_eradicate_western_fascism: "根除西方法西斯"
 SOV_eradicate_western_fascism_desc: "我們不能坐等西歐的法西斯政權選好進攻我們的時機。對付法西斯最好的方法是先發制人並施以重擊。"
 SOV_policy_of_individual_security: "單獨安全政策"
 SOV_policy_of_individual_security_desc: "我們在世界上幾乎沒有朋友，卻有眾多的敵人。我們不應當過分關注誰和我們達成協議——畢竟只要達到目的，無論是對方還是我們都會把協議當作一張廢紙。"
 SOV_approach_germany: "接觸德國"
 SOV_approach_germany_desc: "為什麼我們就一定不能與納粹德國共存呢？當然，我們二者之間不可能永遠和平共存下去，但是在還沒有解決西方同盟國之前，德國人不可能對付我們，因此我們應當鼓動他們先對付西邊的那些傢伙。"
 SOV_liberation_of_the_european_proletariat: "解放歐洲無產階級"
 SOV_liberation_of_the_european_proletariat_desc: "軟弱的西歐資產階級政府已經表現出對法西斯的徹底妥協。在這場即將到來的法西斯主義與共產主義的偉大斗爭中，他們將毫無立足之地。但是這些國家的工人階級依然願意與我們並肩作戰反抗法西斯，只要我們為他們建立值得為之一戰的政府就好。"
 SOV_anti_capitalist_policies: "反資本主義政策"
 SOV_anti_capitalist_policies_desc: "顯而易見的是，至少是大多數的資本主義國家為了他們的利益擴張更樂意將法西斯進攻的矛頭引向東方。只要有選擇，這些資產階級必然會選擇壓迫無產階級。因此，我們決不能相信他們，要做好與他們鬥爭的準備。"
 SOV_recover_alaska: "收復阿拉斯加"
 SOV_recover_alaska_desc: "將阿拉斯加賣給美國人是統治階級對俄羅斯人民的背叛。但是這一背叛已經成為歷史，我們收復了阿拉斯加。相比他們當下生活的這個剝削制度，當地人民更願意成為我們偉大蘇維埃聯盟的組成部分。"
 SOV_the_fight_for_the_pacific: "為太平洋而戰"
 SOV_the_fight_for_the_pacific_desc: "無論陸軍實力如何強大，我們必須跨越海洋才能與太平洋地區的敵人戰鬥。因此，必須發展我們的沿海基礎設施和造船業，然後才能在世界的這一地區發動有效的戰爭。"
 SOV_baltic_security: "波羅的海安全"
 SOV_baltic_security_desc: "波羅的海諸國的命運同我們息息相關，我們絕不允許在我們的邊境上出現一個敵對的政府。"
 SOV_respect_baltic_self_determination: "尊重波羅的海民族自決"
 SOV_respect_baltic_self_determination_desc: "任何人有權以民主的方式決定他們自己的事務。當然，在西方的許多資產階級民主體制下，這一民主進程被大量的金錢異化了。我們將確保愛沙尼亞、拉脫維亞和立陶宛的工人階級在他們各自政府中的代表權。"
 SOV_claims_in_baltic: "宣稱波羅的海"
 SOV_claims_in_baltic_desc: "波羅的海各國曾經是俄羅斯不可分割的一部分，他們的人民需要一個大國的保護以對抗剝削與壓迫。如果他們拒絕了我們的建議，我們將訴諸武力以確保我們對波羅的海的保護。"
 SOV_secure_leningrad: "保障[195.GetName]安全"
 SOV_secure_leningrad_desc: "我國目前和芬蘭的邊界距離[195.GetName]實在是太近了。來自芬蘭的突然襲擊只需幾個小時就會兵臨城下。與此同時，這裡的地理態勢極有可能讓我們的波羅的海艦隊被封鎖在港口內。我們實在難以接受這種狀態，因此我們必須向芬蘭政府闡明這一點。"
 SOV_control_scandinavia: "控制斯堪的納維亞"
 SOV_control_scandinavia_desc: "剩餘的斯堪的納維亞半島諸政權也是對我國北部邊境的威脅。我們必須向他們明確這樣一個事實，即和平共存建立在互信的基礎之上，而我們並不相信意識形態與我們相異的政權。"
 SOV_claims_on_poland: "宣稱波蘭"
 SOV_claims_on_poland_desc: "波蘭佔領著大片幾個世紀以來屬於俄羅斯的領土，把烏克蘭和白俄羅斯的部分土地從我們這裡分離出去。這種情況是我們無法接受的，1921年他們擊敗了我們，而現在我們必須讓他們知道：時代變了。"
 SOV_demand_eastern_poland: "索取波蘭東部"
 SOV_demand_eastern_poland_desc: "在世界大戰結束時，人為劃定的寇松線被作為波蘭的東部邊界。這條線大約在波蘭目前東部邊界以西200公里處，我們應當提醒他們這一基本的歷史事實並且確保蘇波邊界在它該在的地方。"
 SOV_offer_poland_protection: "給予波蘭保護"
 SOV_offer_poland_protection_desc: "幾個世紀以來，波蘭和她的人民受盡剝削與凌辱。現如今，德國準備通過武力手段奪回在上次大戰結束後割讓給波蘭的領土已經成為公開的秘密。只要波蘭願意同我們重啟邊界談判，我們將給予波蘭安全保障。"
 SOV_claim_on_bessarabia: "聲索比薩拉比亞"
 SOV_claim_on_bessarabia_desc: "1918年，羅馬尼亞人無恥地趁我國內亂時佔領併吞並了比薩拉比亞地區。現在是時候提醒他們所佔有的是我們的合法領土了，如果他們不願意重新回到正確的邊境，我們將通過軍事手段逼他們就範。"
 SOV_demand_balkan_submission: "要求巴爾幹屈服"
 SOV_demand_balkan_submission_desc: "歷史經驗表明，我國的鄰國常常會利用我們所暴露出的任何弱點。隨著歐洲上空戰雲密佈，我們絕不能忍受周邊有任何忠誠可疑的鄰國，巴爾幹和小亞細亞各國必須選擇是和我們一起還是與我們為敵。"
 SOV_seek_balkan_cooperation: "尋求巴爾幹合作"
 SOV_seek_balkan_cooperation_desc: "如果我們能讓巴爾幹半島和小亞細亞各國的意識形態更加接近我們，他們也可以成為強有力的盟友。"
 SOV_middle_east_diplomacy: "中東外交"
 SOV_middle_east_diplomacy_desc: "我們有很多機會可以在阿拉伯半島和亞洲提高我們的影響力，與英國人的“大博弈”即將迎來轉折。"
 SOV_the_southern_thrust: "刺向南方"
 SOV_the_southern_thrust_desc: "我國的南部邊境是一片能讓敵人找出軟肋的開闊邊區。我們不能容忍這種事情，也不能坐等這一地區的和平演變。"
 SOV_support_afghan_ideology: "支持阿富汗[GetIdeologyNameWithCaps]"
 SOV_support_afghan_ideology_desc: "阿富汗曾經讓許多強國鎩羽而歸，在此實施軍事行動可能將付出慘重代價卻不能保證成功。我們目前在阿富汗國內有一些聯繫人，他們意圖建立一個意識形態方面更加親近我們的政府，我們應該支持他們的嘗試。"
 SOV_preemptive_invasion_of_iran: "先制入侵伊朗"
 SOV_preemptive_invasion_of_iran_desc: "一旦戰爭降臨，我們不能相信[PER.GetNameDef]政府會支持我們，同樣我們也不相信他們一定不會加入一場侵略我們的戰爭。與其坐等觀之，不如主動出擊武力解決問題。"
 SOV_the_threat_from_the_land_of_the_rising_sun: "日升之地的威脅"
 SOV_the_threat_from_the_land_of_the_rising_sun_desc: "很明顯，日本意圖徹底掌控中國。一旦他們達成了這個目標，他們毫無疑問將轉而向北索取西伯利亞的大量資源。只要他們還陷在對華戰爭的泥沼中，他們就不會轉過來進攻我們，所以我們必須確保中國能夠堅持抵抗到我們做好對日戰爭準備。"
 SOV_the_gobi_gambit: "戈壁謀略"
 SOV_the_gobi_gambit_desc: "日本和中國軍事衝突不斷升級的時候，正是我們搶佔中國邊陲戈壁沙漠的好機會，我們說不定也可以在中國的未來事務方面擁有話語權並佔有談判的一席之地。"
 SOV_two_red_flags: "兩面紅旗"
 SOV_two_red_flags_desc: "雖然目前中國的革命不是那麼成功，但是前景也未可知。這個國家目前還沒有正宗的社會主義革命所必需的工業化社會條件，即使如此，中國共產黨的革命也還是中國人民實現共產主義未來的最佳機會。"
 SOV_support_the_kuomintang: "支持國民黨"
 SOV_support_the_kuomintang_desc: "中國的共產主義者軍力薄弱，也缺乏建立強大軍隊的工業基礎。顯而易見的是，國民黨是最適合掌控中國並且創造成功的共產主義革命所必要的資產階級社會階段的一支力量。"
 SOV_intervention_in_china: "干涉中國"
 SOV_intervention_in_china_desc: "中國的局勢已惡化到威脅我們自身安全的地步了。我們必須介入亂局，並在當地扶持一個可靠的政權。"
 SOV_prepare_a_war_with_japan: "準備對日作戰"
 SOV_prepare_a_war_with_japan_desc: "在打擊日本之前，我們必須確保不出現任何意外情況，並且加大我們的偵察力度。"
 SOV_end_the_khalkhin_gol_conflict: "結束諾門罕戰役"
 SOV_end_the_khalkhin_gol_conflict_desc: "與日本的邊境衝突已經持續了相當長的時間了。如果我們不信任當前的日本政府會遵守現在的兩國邊界，那麼我們不得不直接顛覆該政權。"
 SOV_recover_the_kuril_islands: "收復千島群島"
 SOV_recover_the_kuril_islands_desc: "千島群島在1905年慘敗之後被日本割走，如果我們發動迅速堅決的襲擊，我們可以立即收復失地並讓日本處於一旦選擇擴大事態就得不償失的被動局面。"
 SOV_reconcile_japan: "對日和解"
 SOV_reconcile_japan_desc: "我們最主要的威脅來自於歐洲，我們應當立刻解決與日本之間的一切懸而未決的問題，使我們能夠專心於西部邊境的事務而不必擔心兩面受敵。"
 SOV_spheres_of_influence_in_china: "在華勢力範圍"
 SOV_spheres_of_influence_in_china_desc: "蘇日之間最後的爭論點在於中國問題，我們的在華利益是相當有限的，如果我們可以就在華利益範圍達成一項協議以換取日本的支持，我們應當毫不猶豫地這樣做。"
 SOV_soviet_japanese_pact_against_usa_focus: "蘇日對美協定"
 SOV_soviet_japanese_pact_against_usa_focus_desc: "日本為了推動經濟增長需要進一步擴張，讓日本的擴張矛頭儘可能遠離我們以及得到一個海軍強國的協助是符合我國根本利益的。讓我們團結起來一起把美帝國主義從地圖上抹掉吧！"
