 #Poland paid content
 POL_KPP_focus: "組建左派內閣"
 POL_KPP_focus_desc: "波蘭共產黨是一個準備在必要時採用暴力手段使波蘭走向社會主義的革命政黨。雖然一部分薩納齊亞的忠誠者如今已倒向了我們這邊，但我們還是不能放心地讓他們在黨內身居高位；我們得把他們撤下，換上我們的革命同志。"
 POL_LIT_union: "重建波蘭-立陶宛聯邦"
 POL_LIT_union_desc: "[Root.GetLeader]已經成為了波蘭和立陶宛兩國共同的國王，我們只需要再次整合兩國議會，一個嶄新的波蘭-立陶宛聯邦就將再次屹立於世間。"
 POL_a_leftist_sejm: "組建左翼波蘭眾議院"
 POL_a_leftist_sejm_desc: "雖然波蘭人民黨更傾向於薩納齊亞，但社會民主主義者們缺乏激進改革所必須的主心骨，也就無法真正地解放波蘭無產階級。只有處於共產黨的直接領導下，波蘭人民才能斬斷鎖鏈，迎接光明的未來。"
 POL_anti_imperialism: "打倒帝國主義"
 POL_anti_imperialism_desc: "反對帝國主義的戰爭行徑是值得稱讚的行為，但停留在口頭上的譴責是遠遠不夠的，我們需要發起一場針對帝國主義本身的世界革命！"
 POL_arm_monarchist_militants: "武裝保王派民兵"
 POL_arm_monarchist_militants_desc: "我們知道許多人希望[Root.GetLeader]為他們的國家帶去秩序與繁榮，就像[Root.GetLeader.GetSheHe]在我國所實現的那樣。我們必須把這些君主派武裝成民兵，讓他們為其正統君主之王位而戰。"
 POL_armia_ludowa: "波蘭人民軍"
 POL_armia_ludowa_desc: "我們的軍隊火力遠不如帝國主義侵略者，但我們可以組織那些不畏死亡的左翼武裝分子進行鬥爭。我們可以設立人民軍作為我黨的武裝力量，這樣我們就擁有了一支永不叛變社會主義革命理想的軍隊！"
 POL_assert_eastern_claims_pavel: "宣佈東方領土主張"
 POL_assert_eastern_claims_pavel_desc: "波蘭-立陶宛聯邦包括了許多過去曾屬於沙俄的領土。要是在過去，帕維爾吞併東方領土的行為毫無疑問是叛國行徑；但現在沙俄帝國已經灰飛煙滅，帕維爾作為白軍的一份子，從蘇聯人的手中奪回這些領土之然就成了他義不容辭的使命。"
 POL_assert_western_claims: "重申西部領土宣稱"
 POL_assert_western_claims_desc: "之前波蘭丟掉的許多領土如今恰好都成為了重要的工業中心。若波蘭能重新控制這些地區，它們將會為貝蒙德的事業發揮巨大的作用。"
 POL_baltic_socialism: "在波羅的海推行社會主義"
 POL_baltic_socialism_desc: "獨裁者、資本家和法西斯分子都在壓迫著波羅的海人民的意志，唯有波蘭進行直接干預才能幫助當地的工人們解放自己。"
 POL_claim_greater_lithuania: "宣稱大立陶宛"
 POL_claim_greater_lithuania_desc: "我們今天所知道的立陶宛僅僅是它的前身立陶宛大公國的影子罷了。這個聯邦不僅僅展現的是波蘭和立陶宛的聯盟，它還是波蘭人、立陶宛人、烏克蘭人和白俄羅斯人的聯盟。"
 POL_claim_livonia: "宣稱利沃尼亞"
 POL_claim_livonia_desc: "波羅的海國家之間有一種牢不可破的同袍與同胞之情。既然我們現在代表著立陶宛的利益，那麼我們也應該與波羅的海國家擁有相同的情誼，將波羅的海國家併入我們日益強大的帝國更是理所應當。"
 POL_claim_prussia: "奪取東普魯士"
 POL_claim_prussia_desc: "東普魯士居住著數不清的立陶宛和波蘭少數群體，是時候讓他們與波蘭-立陶宛聯邦的同志們統一了。"
 POL_claiming_lithuania: "波蘭-立陶宛聯邦的宣稱者"
 POL_claiming_lithuania_desc: "有許多人認為波蘭與立陶宛均屬於聯邦的一部分，如果有一位國王能夠同時繼承兩國王位，這將對波蘭人恢復波蘭-立陶宛聯邦的雄心大有幫助。"
 POL_com_independence: "獨立自主"
 POL_com_independence_desc: "我們已經被[SOV.GetNameDef]壓榨太久了！波蘭的革命者們，是時候再次拿起武器為獨立自主而戰了！"
 POL_committee_of_national_liberation: "民族解放委員會"
 POL_committee_of_national_liberation_desc: "我們被夾在德國和俄國這兩大帝國主義國家之間，他們二者都對我們虎視眈眈，策劃著對我們的入侵。通過建立民族解放委員會，所有身陷圍困的波蘭人都能夠在統一指揮下組織抵抗運動。"
 POL_complete_the_bermontian_mission: "完成西俄志願軍使命"
 POL_complete_the_bermontian_mission_desc: "我們與白軍並肩作戰，為沙皇收復俄羅斯的使命曾一度因對立陶宛的入侵失敗而被擊碎；但如今，我們帶著一個強大的聯邦又回來了。我們必須起程出擊，將蘇維埃聯盟燒成灰燼！"
 royal_legitimist: "正統王室繼承人"
 POL_cossack_king: "哥薩克國王"
 POL_cossack_king_desc: "1918年，身為哥薩克人的格魯吉亞王子帕維爾·貝蒙德-阿瓦洛夫受命為俄國白軍而戰，但之後卻調轉槍口入侵了立陶宛和拉脫維亞。儘管帕維爾·貝蒙德不怎麼受歡迎，也並非天主教徒，但他身後除了德國人以外，甚至可能還有西俄志願軍的支持。"
 POL_demand_LIT_pavel: "索取立陶宛"
 POL_demand_LIT_pavel_desc: "上一次，西俄志願軍未能成功拿下立陶宛，但這一次有了波蘭軍隊的支持，帕維爾擁有了無比強大的實力，或許只要他對立陶宛人稍加威脅，他們就會被嚇得乖乖束手就擒。卑躬屈膝永遠不能讓王國強大，國王必須用實力去取得那本應屬於他的東西。"
 POL_demand_slovakia_pavel: "索取斯洛伐克"
 POL_demand_slovakia_pavel_desc: "捷克斯洛伐克如此虛弱而鄰國都覬覦她的土地。如果德國人可以僅憑要求就獲取蘇臺德，我們為什麼不能同樣拿走斯洛伐克呢？"
 POL_demand_slovakia: "索取斯洛伐克"
 POL_demand_slovakia_desc: "捷克斯洛伐克如此虛弱而鄰國都覬覦她的土地。如果德國人可以僅憑要求就獲取蘇臺德，我們為什麼不能同樣拿走斯洛伐克呢？"
 POL_dismantle_capitalist_empires: "肢解資本主義帝國"
 POL_dismantle_capitalist_empires_desc: "資本主義乃是社會主義的宿敵。革命現已於波蘭取勝，我們要以此為基摧毀全世界的資本帝國主義，就從徹底摧毀各殖民帝國開始。"
 POL_dismantle_fascist_empires: "肢解法西斯帝國"
 POL_dismantle_fascist_empires_desc: "法西斯主義是世界的禍害。他們挪用和曲解階級鬥爭的理論，使受蠱惑的無產階級跨過邊境和自己的同志做錯誤的鬥爭。法西斯主義者們是波蘭共產黨不共戴天的敵人，必須被迅速處理掉。"
 POL_dismantle_soviet_empire: "肢解[SOV.GetAdjective]帝國"
 POL_dismantle_soviet_empire_desc: "[GetDismantleSovietEmpireDesc]"
 POL_dismantle_soviet_empire_desc_default: "[SOV.GetNameDefCap]自稱是由許多獨立共和國組成的聯邦，但其本質上不過是塗了一層紅色油漆的沙俄帝國。它和其他所有帝國一樣，都是波蘭的敵人。"
 POL_dismantle_soviet_empire_desc_alt: "蘇聯的紅色油漆已經脫落，我們得以看到[SOV.GetNameDef]的真實面目，他們的帝國野心比以往更加顯眼。我們必須在為時已晚之前收拾掉這個波蘭的敵人。"
 POL_expand_lithuanian_shipyards: "擴建立陶宛造船廠"
 POL_expand_lithuanian_shipyards_desc: "我們終於不再受限於格丁尼亞和格但斯克的港口。現在我們控制了立陶宛，我們可以利用這個機會大幅擴大我們的海軍規模，以此爭奪波羅的海的主導地位。"
 POL_anti_capitalist_revolution: "反資本主義革命"
 POL_anti_capitalist_revolution_desc: "儘管波蘭與西方國家此前一直保持著良好關係，但這不過是外交上的權宜之計，我們不能因此就將自己的信仰拱手出賣給那些外國資本家。與資產階級進行鬥爭乃是世界革命的必由之路，而那些自稱“法西斯主義者”或是“民主主義者”的人毫無疑問都是我們的革命對象。"
 POL_assemble_the_regency_council: "重建攝政議會"
 POL_assemble_the_regency_council_desc: "十一月五日敕令是舊同盟國做出的承諾，其目的是在俄羅斯帝國的灰燼中建立一個自由獨立的波蘭王國。由於攝政議會未能找到合適的君主，因此一切權力均被畢蘇斯基奪取。不過，由於薩納齊亞沒能建立穩定的政府，也許是時候重新建立攝政議會，為波蘭找到其正統的國王了。"
 POL_fulfil_fifth_of_november: "實行十一月五日敕令"
 POL_fulfil_fifth_of_november_desc: "攝政議會既已重新召集完畢，是時候開門迎接那些波蘭王位的宣稱者了。"
 POL_governorate_livonia: "利沃尼亞總督區"
 POL_governorate_livonia_desc: "多年前，當帕維爾入侵立陶宛和拉脫維亞時，他有能力收回利沃尼亞總督區作為自己的個人封地。如今，拉脫維亞勢單力薄，波蘭強權又在帕維爾的背後，恢復利沃尼亞總督區是大勢所趨。"
 POL_greater_commonwealth: "大波蘭-立陶宛聯邦"
 POL_greater_commonwealth_desc: "隨著波蘭-立陶宛聯邦浴火重生的野心並不止步於她曾經的邊境。波蘭人民心目中的聯邦是一個雄踞於海間的偉大多元文化帝國！"
 POL_greater_polish_SSR: "大波蘭蘇維埃社會主義共和國"
 POL_greater_polish_SSR_desc: "我們已向蘇聯證明自己的價值，我們應該慎重要求蘇聯歸還波蘭東部，並就我們為革命立下的汗馬功勞提供一些補償。"
 POL_hohenzollern: "霍亨索倫家族"
 POL_hohenzollern_desc: "在德國人的設想中，新的波蘭王國應該由一位來自霍亨索倫家族的國王統治。我們與羅馬尼亞有著密切的外交關係，這使得羅馬尼亞王室成為了波蘭國王的最佳人選。"
 POL_institute_royal_guards: "建立王室衛隊"
 POL_institute_royal_guards_desc: "我們的君主已經登基，現在我們必須找到波蘭軍隊中最精銳的將士來負責保護我們愛戴的君主。"
 POL_internal_romanian_support: "尋求羅馬尼亞內部支持"
 POL_internal_romanian_support_desc: "羅馬尼亞現任國王的肆意揮霍和貪汙腐敗正把這個國家一步步推向毀滅的邊緣。米哈伊國王或許只剩一條路可走，那就是與他父親的批評者們合作，以確保羅馬尼亞能夠繼續生存，哪怕這對他來說是個不幸的消息。"
 POL_king_michaels_coup: "米哈伊國王政變"
 POL_king_michaels_coup_desc: "現在到了米哈伊國王奪取羅馬尼亞政府，並加冕為國王的時刻了，這也是他與生俱來的權利。曾經只是盟友關係的波蘭和羅馬尼亞現在將合二為一。"
 POL_king_of_lithuania: "立陶宛王國"
 POL_king_of_lithuania_desc: "時機已然成熟；立陶宛民眾對[LIT.GetLeader]的反對情緒已被挑起，君主制的支持者們也已經準備好向政府提出他們的訴求。在波蘭人民的支持下，他們將認定[Root.GetLeader]為上帝指定的統治者。"
 POL_dabrowszczacy: "東布羅夫斯基營"
 POL_dabrowszczacy_desc: "世界各地都有波蘭籍的國際縱隊戰士為社會民主運動而戰。由於波蘭國家現已由社會主義政府控制，我們有能力為這些勇敢的志願軍提供援助。"
 POL_leftist_economics: "建立社會主義經濟"
 POL_leftist_economics_desc: "在資本主義經濟模式中，資本是為了精英階層的利益而服務。隨著社會主義支持者逐漸控制了政府，我們必須調整經濟模式，讓其為了廣大革命人民的利益而服務。"
 POL_lithuanian_rail: "波蘭-立陶宛鐵路"
 POL_lithuanian_rail_desc: "如果波蘭和立陶宛真正地合二為一，在兩地之間通行也一定是會稀鬆平常。通過將兩地各自的鐵路聯結起來，我們將極大地改善我們的供應鏈狀況並提升工業能力。"
 POL_lower_class_education: "基層教育"
 POL_lower_class_education_desc: "在很長的時間裡，教育被權高位重者和資本所掌控，但是在社會主義國家中，教育將不再被資本所裹挾，個人所擁有的財富將不會影響其受到的教育。"
 POL_merge_civilian_industries: "合併民用工業"
 POL_merge_civilian_industries_desc: "隨著兩國統一，讓立陶宛與波蘭仍然各自為政毫無意義。兩國工業必須為了一國聯邦的福祉而統合起來。"
 POL_merge_internal_governments: "合併內部政府"
 POL_merge_internal_governments_desc: "儘管現在波蘭和羅馬尼亞由同一位君主擔任政府首腦，但它們各自原有的政府卻又造成了兩國之間隔閡。我們必須讓羅馬尼亞人的代表進入波蘭眾議院，並將波蘭與羅馬尼亞所有的政府部門合為一體。"
 POL_merge_the_arms_industries: "合併軍事工業"
 POL_merge_the_arms_industries_desc: "數十年來，波蘭和立陶宛的軍火製造們始終分別獨立地運作著。現如今既然兩國已經合二為一，我們可以在工業體系中建立分工機制，並構建波蘭與立陶宛之間的工廠協作。"
 POL_non_discriminatory_recruitment: "廢除歧視性徵兵政策"
 POL_non_discriminatory_recruitment_desc: "藉由薩納齊亞徵兵政策的實行，波蘭天主教徒的人數在軍隊中佔比過大。長遠來看，我們必須為所有願意與法西斯主義戰鬥的愛國者或社會主義者提供支持。"
 POL_organize_the_peasants_strike: "組織農民大罷工"
 POL_organize_the_peasants_strike_desc: "波蘭因為農民的流血衝突而逐漸走向分裂。波蘭政府對農民訴求和生活處境的惡意忽視，使得全國的農民日漸激進與憤怒。[POL.GetLeader]將原本的罷工抗議推向了失控的暴力運動，我們必須讓無產階級人民團結起來，準備好反抗壓迫者的暴行。"
 POL_polish_path_to_socialism: "波蘭的社會主義道路"
 POL_polish_path_to_socialism_desc: "自1918年成立以來，波蘭共產黨一直在受到布爾什維克的影響，許多共產黨員現在只不過是斯大林的走狗。然而，瑪麗亞·柯舒茨卡與一些著名黨員正準備將斯大林主義分子清除出黨派，並讓波蘭站到莫斯科的對立面。"
 POL_polish_peoples_republic: "波蘭蘇維埃社會主義共和國"
 POL_polish_peoples_republic_desc: "[GetSovietPolishPeoplesRepublicDesc]"
 POL_polish_peoples_republic_desc_default: "波蘭是工業化程度最高，獨立性最強的蘇聯加盟國之一，我們理當獲得更多的自治權。"
 POL_polish_peoples_republic_desc_alt: "波蘭在[SOV.GetAdjective]勢力範圍內從其他國家中脫穎而出，得益於其相對的工業化和不同的意識形態，因此我們享有更高程度的自治是理所當然的。"
 POL_preserve_baltic_independence: "保障波羅的海諸國獨立"
 POL_preserve_baltic_independence_desc: "儘管波羅的海諸國政府大多是不民主的資本主義政府，但他們和我們一樣面臨東西兩面的威脅，所以我們寧願他們維持資產階級專政也不願看到他們落入德國和俄羅斯的帝國主義野心當中。"
 POL_preserve_bougoise_democracy: "保護資產階級民主"
 POL_preserve_bougoise_democracy_desc: "波蘭共產黨的最終目標是將社會主義傳遍全世界，但在至暗時刻，法西斯主義的全球崛起迫使我們必須與資產階級統一戰線，以保護資產階級民主制度。只有在法西斯主義被消滅殆盡的世界裡，物質條件才能推動全球社會主義革命。"
 POL_press_for_liberia: "向利比里亞施壓"
 POL_press_for_liberia_desc: "1932年，波蘭和利比里亞政府同意將利比里亞置於波蘭的監管之下。美國認為我們在利比里亞的存在對其是一種侮辱，但這個國家十分脆弱，急需波蘭的保護。"
 POL_pressure_for_the_west: "對西部施壓"
 POL_pressure_for_the_west_desc: "波蘭與德國的邊界問題一直延續到了一戰後的幾十年。德國保住了他們大部分的工業中心，而波蘭卻幾乎沒有獲得多少工業。我們被迫向[SOV.GetNameDef]交出了我們的東部領土，就必須獲得西里西亞和波美拉尼亞以補償所失。"
 POL_pro_allied_government: "任命親同盟國政府"
 POL_pro_allied_government_desc: "許多地方議會已經支持波蘭繼續與西方結盟，通過將這些代表晉升到更高的治理級別，我們使自己對盟國的事業更加公開友好。"
 POL_push_for_ruthenia: "擴建魯塞尼亞鐵路"
 POL_push_for_ruthenia_desc: "儘管烏克蘭和白俄羅斯的鐵路網不幸遭到忽視，但這部分領土同樣是聯邦的一部分。我們若要向蘇聯進軍並重新重奪失地，就必須投資加強東部鐵路的建設。"
 POL_reopen_the_maritime_and_colonial_league: "重啟波蘭殖民聯盟"
 POL_reopen_the_maritime_and_colonial_league_desc: "波蘭的殖民帝國野心因未能獲取巴勒斯坦而告終，但隨著我們建立與西方密切聯繫和社會主義政府，我們有能力利用我們的資本將殖民地的工人從歐洲殖民者手中解放出來並置於新的波蘭管理下。"
 POL_restoration_of_the_royal_sejm: "重建王室眾議院"
 POL_restoration_of_the_royal_sejm_desc: "在波蘭王國的舊時代，眾議院是公眾和王室的忠實僕人。隨著眾議院的恢復和第二共和國的覆滅，我們必須確保所有的議員都忠於王室，不會想著讓波蘭重回薩納齊亞統治。"
 POL_restore_bermontians: "重建西俄志願軍"
 POL_restore_bermontians_desc: "西俄羅斯志願軍是一支由帕維爾·貝蒙德·阿瓦洛夫領導的部隊，他試圖在俄羅斯西部領土上恢復君主制和秩序。雖然波蘭現在是帕維爾的首要任務，但摧毀俄羅斯共產主義仍然是西俄志願軍的使命，所有白俄軍人都應該把為西俄志願軍而戰視為自己的職責！"
 POL_restore_poland_hungary: "重建波蘭-匈牙利王國"
 POL_restore_poland_hungary_desc: "波蘭和匈牙利的王冠在幾個世紀前曾為一體，這讓我國在東歐處於統治地位。現在，隨著特蘭西瓦尼亞和尼特拉已在波蘭的控制之下，唯一阻止我們收回波蘭-匈牙利王國遺產的就是匈牙利的繼續存在。"
 POL_royal_dictatorship: "確立國王獨裁"
 POL_royal_dictatorship_desc: "波蘭眾議院對國王所做的任何決定都擁有否決權。儘管這個體制迄今依然發揮著良好作用，但當下世界局勢風雲變幻，我們不能再容許其妨礙神聖的王權了。"
 POL_seek_german_alignment: "尋求對德友好"
 POL_seek_german_alignment_desc: "作為[GER.GetLeader]的崇拜者和國家社會主義者，帕維爾使自己成為世界法西斯勢力的知名盟友，剩下的就是接觸法西斯分子，看看他們是否會歡迎在西俄志願軍的控制下的波蘭加入他們的軸心。"
 POL_social_commonwealth: "社會主義共和國聯邦"
 POL_social_commonwealth_desc: "儘管任何恢復波蘭-立陶宛的野心都與我們革命的目標背道而馳，但不可否認的是，波蘭、立陶宛和聯邦的許多前成員國有著共同的歷史和共同的敵人。鑑於我們的共同鬥爭，一個新的聯邦是必要的；一個將社會主義下工人的安全和解放放在第一位的聯邦。"
 POL_soviet_industry: "[GetSovietIndustrialInvestmentTitle]"
 POL_soviet_industry_default: "蘇聯工業投資"
 POL_soviet_industry_alt: "工業擴張"
 POL_soviet_industry_desc: "[GetSovietIndustrialInvestmentDesc]"
 POL_soviet_industry_desc_default: "加入蘇維埃聯盟的一大好處是，我們能成為一個擁有強大工業實力的國家聯盟的一員，同時在投資上享受諸多好處。儘管我國工業的一部分將被用於發展整個聯盟，但作為回報，我國所得到的工業投資也會極大地增強我國的製造業實力。"
 POL_soviet_industry_desc_alt: "儘管我們受制於[SOV.GetNameDef]的監管，但我們必須堅持自主發展工業。如果我們想要打破身上的枷鎖，這可能是一條出路。"
 POL_soviet_military_staff: "蘇聯軍事參謀"
 POL_soviet_military_staff_desc: "隨著波蘭第二共和國的成立，許多左翼波蘭將軍逃到蘇聯繼續著世界革命的鬥爭。現在，既然掌權的政府已與蘇聯結盟，那些人可以榮歸鄉里了。"
 POL_support_colonial_workers_strikes: "支持殖民地工人罷工"
 POL_support_colonial_workers_strikes_desc: "歐洲國家那些殖民地的工人們正在剝削中苦苦掙扎著，以維持一個對他們毫無益處的殖民帝國。這些工人缺乏解放自己所需的物質條件。如果真要發動一場全球革命，我們就必須武裝被壓迫者，以此對抗那些殖民者上等人。"
 POL_support_monarchism_in_LIT: "支持立陶宛君主制"
 POL_support_monarchism_in_LIT_desc: "一如波蘭，立陶宛也打算著選個國王出來；不如波蘭，公平選舉德意志人是為非法。但我們可以為立陶宛人提供他們想要的強大領袖，亦保衛立陶宛免受德帝國主義侵犯的國王。"
 POL_warsaw_to_crimea_railway: "華沙-克里米亞鐵路"
 POL_warsaw_to_crimea_railway_desc: "在我們統治海間的雄心壯志中，將一切新領土整合為我國不可分割的核心部分十分重要。我國的自然邊界自北到南、自東到西延伸，將克里米亞通過鐵路連接到首都的野心將鞏固對該地區的控制。"
 POL_elect_a_PSL_leader: "選舉人民黨領袖"
 POL_elect_a_PSL_leader_desc: "儘管共產黨在政府裡鬧騰得很歡，但軍隊支持的還是人民黨。若鞏固一下我們的領導地位，共產黨就會無力插手政府。"
 POL_invest_in_the_peasantry: "投資農民社區"
 POL_invest_in_the_peasantry_desc: "農民因為我們承諾改善農村生活才為我們而戰，我們要兌現這一承諾。合理規劃的鐵路和基建網絡將保證沒有人會被落下。"
 POL_seek_an_alliance_with_kaiser: "尋求與德皇結盟"
 POL_seek_an_alliance_with_kaiser_desc: "波蘭王國的存在源於德意志皇帝的十一月五日敕令，該敕令承諾在俄羅斯所屬的會議波蘭基礎上建立一個全新的波蘭王國。目前我們還不知道德意志皇帝對波蘭有什麼打算，但也許對帝國的這一敕令進行一個溫和的提醒，可以為一份雖然不太可能的盟約播下種子。"
 POL_surrender_the_east: "割讓東波蘭"
 POL_surrender_the_east_desc: "蘇聯將東波蘭視為烏克蘭和白俄羅斯的一部分，由蘇聯代為宣稱。把這些區域割給蘇聯，我們或許可以成為盟友。"
 POL_woo_morges_staff: "邀請莫爾日陣線"
 POL_woo_morges_staff_desc: "如果沒有軍方的支持，我們的暴動就絕無成功的可能。儘管軍隊中大多數人依然分別支持薩納齊亞的左中右三派，但致力於恢復波蘭民主的莫爾日陣線可能會以此為由與我們合作。"
 POL_ease_sanationist_tensions: "緩解與薩納齊亞派的緊張局面"
 POL_ease_sanationist_tensions_desc: "許多莫爾日陣線的成員都在薩納齊亞的軍隊身居高位，也許我們可以令他們利用其政治資本干擾政府對罷工的鎮壓，為我們在波蘭國內發展壯大爭取寶貴的時間。"
 POL_arm_peasant_militia: "武裝農民民兵"
 POL_arm_peasant_militia_desc: "波蘭農民解放自己擺脫壓迫的唯一齣路只有拿起武器與資產階級作鬥爭。我們可以利用莫爾日陣線的政治資本並且盜取薩納齊亞的武器裝備，以建立一支裝備精良且訓練有素的農民軍來應對將來的戰爭。"
 POL_state_national_council: "地區國民議會"
 POL_state_national_council_desc: "薩納齊亞以《四月憲法》成文作為其信仰，我們也早該效仿了。我們將成立國家議會，雲集波蘭各地的社會主義政治家，對薩納齊亞的反動法律進行撥亂反正。"
 POL_communal_governance: "公社政府"
 POL_communal_governance_desc: "農民們奮起反抗的戰爭固然是必要的，但也對我們的家園造成了嚴重破壞。現在是時候建立地方社區政府，並重建我們的家園以撫平戰爭的創傷。"
 POL_raise_the_black_madonna: "召集黑聖母派"
 POL_raise_the_black_madonna_desc: "聖母瑪利亞是波蘭國家與勞苦大眾的保護者，其黑聖母像廣受波蘭底層人民歡迎。通過把黑聖母作為我們運動的象徵，我們的人民將知道聖母瑪利亞將會在時機成熟時站在我們這邊。"
 POL_reassemble_the_sejm: "重建波蘭眾議院"
 POL_reassemble_the_sejm_desc: "隨著波蘭重新迴歸民主的懷抱，那些被薩納齊亞驅逐的議會代表們也該重回政府了。"
 POL_empower_the_morges: "為莫爾日陣線賦權"
 POL_empower_the_morges_desc: "莫爾日陣線已證明是民主的堅定守衛者，若無其支持我們將一事無成。這些將軍也許已經為自己贏得了領導自己軍隊的權力。"
 POL_ROM_join_allies: "加入同盟國"
 POL_ROM_join_allies_desc: "隨著波蘭與羅馬尼亞的王國合併，我們必須將外交重點轉向在西方的盟友。"
 POL_anti_blitz_tactics: "反閃擊戰戰術"
 POL_anti_blitz_tactics_desc: "德國人試圖用迅捷且強大的兵力推平我們的國家，但也許他們的戰爭機器只是紙老虎。人們可以被強迫面對危險而不後退，而坦克只有在我們沒有準備應對的時候才是可怕的。"
 POL_anti_fascist_military_desc: "儘管社會主義的政府讓波蘭人分裂了，但我們與西方的結盟使舉國上下擁有了一個共同的目標，那就是強烈反對法西斯主義和德帝國主義。有了支持和宣傳，我們的軍隊將在法西斯主義在全球興風作浪時強大而團結。"
 POL_anti_germans_abroad: "支持國外反德勢力"
 POL_anti_germans_abroad_desc: "在這場反對布爾什維克和納粹的鬥爭中，波羅的海國家是我們的好兄弟。儘管他們又小又軟弱，只要背後有著強大的波蘭政府，我們仍可能將其鞭策成為功能性的戰爭機器。"
 POL_assert_eastern_claims: "宣佈東方領土主張"
 POL_assert_eastern_claims_desc: "現在波蘭曾不及往日輝煌的一角。波蘭不僅僅是波蘭民族碰巧住下的地方，波蘭是聯邦的繼業國，我們必須恢復東方的舊邊界。"
 POL_assurance_of_loyalty: "劃定戰後邊界"
 POL_assurance_of_loyalty_desc: "德國人從我們手中拿走了大片土地，而我們的戰爭貢獻是無可爭議的。我們長久以來叩頭求和，現在我們是時候為我們失去的要求補償了。"
 POL_beck_ribbentrop: "貝克-裡賓特洛甫條約"
 POL_beck_ribbentrop_desc: "德國渴望吞併格但斯克和其它從前領土，司馬昭之心早已路人皆知。但這也許不必通過血腥衝突來實現，或許約瑟夫·貝克能夠為兩國邊界問題創造一個雙贏的外交解決方案。"
 POL_declare_independence: "宣佈獨立"
 POL_declare_independence_desc: "德國是且僅是消滅[SOV.GetNameDef]威脅的有用工具，但現在該將矛頭轉向那些企圖用鎖鏈捆住波蘭的人了。反擊德意志國的戰爭即將開始。"
 POL_demand_LIT: "索取立陶宛"
 POL_demand_LIT_desc: "立陶宛政府派系對立，軟弱無能，在經濟和軍事方面的領導力也一塌糊塗。沒有附庸的波蘭才不是完整的波蘭國家，或許只要略施壓力，立陶宛就會同意與我國統一。"
 POL_demand_pomerania: "索取波美拉尼亞"
 POL_demand_pomerania_desc: "波美拉尼亞曾是波蘭國家的一部分，但現在被德國佔據。雖說在很多人看來我們機會渺茫，但即使孤注一擲，我們也必須奪回屬於我們的領土。"
 POL_divide_lit: "肢解立陶宛"
 POL_divide_lit_desc: "我們希望恢復聯邦，德國試圖拿走梅梅爾。也許我們能夠達成共識，共同向立陶宛發出最後通牒。"
 POL_empower_falangist_militants: "賦權長槍黨民兵"
 POL_empower_falangist_militants_desc: "許多長槍黨準軍事組織正在厲兵秣馬，準備迎接與共產主義者那不可避免的一仗。有了政府的支持，這些狂熱分子將成為長槍黨麾下一支令人生畏的武裝力量。"
 POL_falangist_international: "長槍黨國際"
 POL_falangist_international_desc: "我們始終在反對納粹主義與意大利法西斯主義的鬥爭中處於劣勢，我們必須尋找可以協助對抗德國的盟友。長槍主義也許可以成為法西斯主義的一個替代方案，並藉此吸引志同道合的國家組成聯盟。"
 POL_force_polish_upper_class: "建立波蘭人的上層階級"
 POL_force_polish_upper_class_desc: "作為剛剛解放的新生國家，許多波蘭人仍處在社會的經濟底層。我們必須創造一批生來就是為了治國的精英階層來領導國家前進。"
 POL_german_staff: "德裔自衛隊"
 POL_german_staff_desc: "波蘭境內有一定規模的德裔少數族群，雖然德國很可能會利用這些人來對付我們，但鑑於目前波蘭與德國友好的合作關係，這些德裔很可能會支持我們的事業。"
 POL_german_training: "德國軍事參謀"
 POL_german_training_desc: "我們的德國“盟友”對他們的軍事機密嚴防死守，但若我們邀請他們管理我們的內部軍務，他們也許就不得不向我們透漏一些機密。"
 POL_integrate_greater_kashubia: "整合波美拉尼亞"
 POL_integrate_greater_kashubia_desc: "斯拉夫民族的卡舒比人將整個波美拉尼亞視為他們國家的合法邊界，而很多波蘭人也視其為波蘭的合法領土。現在這片土地已經掌握在我們的手裡，只需將其整合進我國的行政體制中，東德意志從此將成為西波蘭。"
 POL_integrate_the_endecja: "整合民族民主運動"
 POL_integrate_the_endecja_desc: "雖然民族民主黨中的七人眾派系正在和薩納齊亞尋求聯盟，但該黨絕大多數人仍反對同薩納齊亞進行合作。我們如果邀請民族民主運動一同組閣，就有可能成立一個團結在波蘭民族主義之下的堅強政府。"
 POL_integrate_the_falanga: "整合長槍黨"
 POL_integrate_the_falanga_desc: "民族激進陣營-長槍黨是一個充滿了暴力和破壞性的組織，但隨著民族主義在政府中日益抬頭，長槍黨很有可能會為了波蘭的未來而加入我們。"
 POL_invite_the_baltics: "邀請波羅的海國家"
 POL_invite_the_baltics_desc: "大多數信仰天主教的國家正面臨布爾什維克的威脅，因此波羅的海國家是我國天然的盟友，我們必須保護他們免受威脅。"
 POL_invite_the_lowlands: "邀請低地國家"
 POL_invite_the_lowlands_desc: "儘管長槍黨勢力在比荷盧的政壇中處於邊緣地位，但只要我們肯投入時間和資源，他們就可以掌握政治話語權，並可能同我國結盟。"
 POL_konfederacja_narodu: "民族聯合會"
 POL_konfederacja_narodu_desc: "民族聯合會是由波蘭民族主義者組成的小團體，他們致力於反抗德國侵佔波蘭的一切手段。通過宣揚我們的反德言論，這些人也許會與我們統一戰線。"
 POL_nationalist_constitution: "民族主義憲法"
 POL_nationalist_constitution_desc: "四月憲法未能徹底明確波蘭的定義和地位，民族民主黨和長槍黨的一些成員則表示支持修改憲法，以鞏固國家至上的原則。"
 POL_polish_shock_battallions: "精銳士官軍"
 POL_polish_shock_battallions_desc: "隸屬於民族聯合會的精銳士官軍是一支經過專業訓練的突擊營，他們準備好為了華沙的自由而奮戰至死。"
 POL_underground_conscripts: "地下徵兵行動"
 POL_underground_conscripts_desc: "從波蘭地下國招募的士兵將大大增強我們對抗壓迫者的能力。"
 POL_prepare_german_line: "準備對德防線"
 POL_prepare_german_line_desc: "與德國接壤的邊境是我國最為脆弱和危險的地方。如果我們想確保華沙永遠不會落入德國人之手，我們就必須在邊境直面他們，並徹底摧毀他們侵略的企圖。"
 POL_privatize_education: "收繳外國企業"
 POL_privatize_education_desc: "雖然外國的投資者對我國起到了極大的作用，但這些企業在波蘭人的手裡才能發揮更大的作用。這將會損害投資者們的利益並惹怒他們，但為了祖國，我們必須這麼做。"
 POL_radicalize_poles_in_germany: "煽動在德波蘭裔民兵"
 POL_radicalize_poles_in_germany_desc: "德國境內的波蘭族裔正日漸激進。如果我們將德國準備侵略波蘭的企圖透漏出去，他們的情緒也許會被調動起來，並團結在一起準備好為我們的事業而奮戰。"
 POL_reach_out_to_underground_state: "接觸波蘭地下國"
 POL_reach_out_to_underground_state_desc: "波蘭地下國正在暗中運作。通過接觸並給予他們支持，我們將有希望在未來擺脫我們宗主國的束縛。"
 POL_reassert_silesian_claims: "重申西里西亞領土主張"
 POL_reassert_silesian_claims_desc: "西里西亞問題在波蘭共和國中一直備受爭議，當時懦弱的政府決定將交出西里西亞的大部分區域，只保留了上西里西亞的一小部分。一個強大的政府不會容忍這種懦弱的行徑，我們必須確保對失去領土的宣稱。"
 POL_reopen_national_elections: "重啟國家選舉"
 POL_reopen_national_elections_desc: "民族民主運動的意圖是恢復波蘭的民主制度。我們必須重啟國家選舉，但必須確保不愛國的政黨不能參與其中。"
 POL_request_autonomous_status: "要求自治地位"
 POL_request_autonomous_status_desc: "我們在德國的沉重壓迫下喘不過氣，如果我們想要擁有未來，我們就必須得到更多工業自主權。"
 POL_riot_of_37: "華沙暴動"
 POL_riot_of_37_desc: "薩納齊亞派絕不可能將權力和平交接給長槍黨，但逐漸壯大的長槍黨已經遠超薩納齊亞派的掌控。在華沙發起的暴力示威將有可能讓長槍黨直接控制國家。"
 POL_sideline_the_sanacja: "邊緣化薩納齊亞"
 POL_sideline_the_sanacja_desc: "長槍黨和民族民主運動在政府中的影響力已經足夠龐大，兩者的聯合將迫使薩納齊亞失去重要的政治資本，並且在政變時將更加脆弱……"
 POL_siodemki: "鞏固憲法"
 POL_siodemki_desc: "薩納齊亞擁護支持四月憲法，而民族民主運動則希望修憲。鑑於兩黨正在合作，我們容不下任何內部糾紛；為了波蘭共和國的未來，我們必須支持修憲意見。"
 POL_state_catholicism: "天主教國家"
 POL_state_catholicism_desc: "天主教是長槍黨意識形態的固有核心，因此，國家和教會必須緊密地聯繫在一起。"
 POL_support_falangists_in_the_americas: "支持美洲長槍黨"
 POL_support_falangists_in_the_americas_desc: "長槍黨運動在拉丁美洲國家中此起彼伏。為了確保全球長槍黨人的利益，並保護我國國民免受美國影響，我們的聯盟必須延伸到美洲。"
 POL_support_global_falangism: "支持全球長槍主義"
 POL_support_global_falangism_desc: "在引領祖國走向長槍主義的道路上，我們並非孤軍奮戰。波蘭各地都有志願者渴望投身於全球長槍主義之中，理應得到國家的支持。"
 POL_the_national_commonwealth: "一國聯邦"
 POL_the_national_commonwealth_desc: "舊聯邦是由波蘭人建立的帝國，統治著遼闊的土地和人民。隨著立陶宛重歸我們的控制，波蘭帝國將再次浴火重生！"
 POL_romanov: "羅曼諾夫家族"
 POL_romanov_desc: "儘管又是一位不太可能的候選人，但這位自稱阿納斯塔西婭·羅曼諾夫的年輕女士聲稱波蘭的最後一位君主是沙皇尼古拉二世。因此，她對波蘭王位的宣稱授自上帝。"
 POL_invite_exiled_nobility: "邀請流亡貴族"
 POL_invite_exiled_nobility_desc: "儘管許多俄國貴族拒絕承認阿納斯塔西婭國王的合法地位，但邀請他們以貴族的身份迴歸並承諾授予貴族頭銜也許會改變其立場，讓他們也承認阿納斯塔西婭是沙皇尼古拉斯二世的合法繼承人。"
 POL_pan_slavism: "泛斯拉夫復仇主義"
 POL_pan_slavism_desc: "迄今為止，泛斯拉夫運動不過是俄羅斯對全體斯拉夫人宣稱霸權的一個說法，但這也有助於將各個斯拉夫民族團結成聯合的國家，如南斯拉夫和捷克斯洛伐克。波蘭為什麼要從中獨善其身？波蘭不也應該利用下泛斯拉夫主義浪潮嗎？"
 POL_demand_yugoslav_subjugation: "要求南斯拉夫臣服"
 POL_demand_yugoslav_subjugation_desc: "如果我們希望實現泛斯拉夫民族的統一，就不能忽視南斯拉夫人。雖然我們被層層國界和崇山峻嶺所分隔，但我們都是斯拉夫民族的一份子。"
 POL_claim_russia: "宣稱俄羅斯"
 POL_claim_russia_desc: "阿納斯塔西婭·羅曼諾夫國王是沙皇尼古拉二世的最後一個在世繼承人，因此她對俄羅斯王位的要求不僅合法，而且是上帝的旨意。在擁有俄羅斯貴族支持的基礎上，阿納斯塔西婭已經準備好奪回她君權神授的俄羅斯女皇之位。"
 POL_proclaim_slavic_unity: "統一泛斯拉夫"
 POL_proclaim_slavic_unity_desc: "既然控制了俄羅斯和波蘭的全部領土，我們將實現此前沙皇所未竟之成就。在兩國人民的一致認可下，我們將宣佈斯拉夫民族的大一統。"
 POL_niech_zyje_opor: "波蘭地下組織"
 POL_niech_zyje_opor_desc: "起義與自由的呼聲響徹波蘭全境。在教會與地下集會中，勇敢的波蘭愛國者聚集在一起，謀求著波蘭國家的獨立與自由。只要有合適指引與武裝，華沙就能自行從侵略者手中得以解放！"
 POL_niech_zyje_opor_no_mtg: "$POL_niech_zyje_opor$"
 POL_niech_zyje_opor_no_mtg_desc: "$POL_niech_zyje_opor_desc$"
 POL_morges_pact: "莫爾日條約"
 POL_morges_pact_desc: "隨著民主制度在波蘭得以重建，莫爾日陣線的雄心壯志幾近完成，只剩下鞏固同法國的關係，並正式恢復法波同盟。"
 POL_morges_economic_union: "法波經濟條約"
 POL_morges_economic_union_desc: "隨著法國和波蘭的關係更加緊密，我們可以保證在戰時互相進行經濟援助。"
 POL_invite_romania_to_morges: "邀請羅馬尼亞加入條約"
 POL_invite_romania_to_morges_desc: "法波同盟的力量遠不足以抗衡整個軸心國。我們必須將聯盟的範圍在海間擴張。"
 POL_align_with_habsburgs: "哈布斯堡同盟"
 POL_align_with_habsburgs_desc: "哈布斯堡家族坐擁波蘭與匈牙利兩國的王座，也許是時候將王朝紐帶正式化成同盟關係了。"
 POL_habsburg: "哈布斯堡家族"
 POL_habsburg_desc: "卡爾·阿爾布雷希特·馮·哈布斯堡是一名波蘭愛國者，同時還幸運地是一名王室候選人。也許我們應該邀請他登上從出生起就開始為之準備的王位。"
 POL_habsburg_monarchist_militants: "武裝哈布斯堡民兵"
 POL_habsburg_monarchist_militants_desc: "仍有不少捷克斯洛伐克人渴望回到王權至高無上的統治之下。只要給他們足夠的武器，這些人就會讓捷克斯洛伐克重新成為哈布斯堡王朝的一部分！"
 POL_join_CZE_industry: "連通捷克工業"
 POL_join_CZE_industry_desc: "我們尚未將波希米亞和波蘭的工業相互連通，導致現在出現了彼此脫鉤的情況。為了充分利用我們的工業能力，這個問題必須得到解決。"
 POL_join_CZE_military: "連通捷克軍工產業"
 POL_join_CZE_military_desc: "我們的軍工產業缺乏統一調度，彼此分離運作。我們必須對捷克工業複合體的產能加以評估，並將其併入波蘭軍事體系中。"
 POL_join_CZE_rails: "連通鐵路"
 POL_join_CZE_rails_desc: "途徑蘇臺德山脈運送物資過於昂貴至利不抵本。為了保衛我們的新國家，關鍵的鐵路系統必須得以連通。"
 POL_king_of_bohemia: "波希米亞國王"
 POL_king_of_bohemia_desc: "捷克斯洛伐克的君主主義情緒正日漸高漲。我們只需要堅持對波希米亞王位的宣稱，而捷克政府毫無疑問必須滿足這一要求。"
 POL_kings_guard: "王室衛隊"
 POL_kings_guard_desc: "國王陛下有著領導軍隊的雄心壯志，還有什麼能比組建一支陛下私人王室衛隊更合適的呢？"
 POL_press_the_habsburg_claim: "施壓哈布斯堡宣稱"
 POL_press_the_habsburg_claim_desc: "匈牙利王位長期空懸，而奧托·馮·哈布斯堡大公卻又沒有應得的王位。同為哈布斯堡家族的一員，我們必須幫助大公奪得王位，以確保哈布斯堡王朝在歐洲的統治！"
 POL_reclaim_west_slavia: "收復西斯拉夫"
 POL_reclaim_west_slavia_desc: "卡舒比人，波拉布人與索布人都屬於西斯拉夫人的一員，而他們中的許多人仍生活在我們的國境之外，不受我們的影響。身為西斯拉夫人的保護者，我們必須保證所有西斯拉夫人不受外國壓迫殘害。"
 POL_restore_the_diet_of_galicia: "恢復加利西亞行省"
 POL_restore_the_diet_of_galicia_desc: "加利西亞和洛多梅里亞行省代表曾屬於哈布斯堡王朝統治下的波蘭領土。現在哈布斯堡家族的後裔既然已經成為我國國王，是時候將該地區重新建立為哈布斯堡王朝治下的波蘭行省了。"
 POL_royal_hussars: "組建王室翼騎兵"
 POL_royal_hussars_desc: "翼騎兵曾是最令波蘭驕傲的兵種。即使騎兵馳騁沙場的時代早已結束，但波蘭依然保有大量騎兵作戰的經驗和技巧。只要對其稍加支持，翼騎兵的威名將再次傳遍世界。"
 POL_royal_officer_corps: "王室軍官團"
 POL_royal_officer_corps_desc: "作為我們的君主與將軍，卡爾·阿爾布雷希特閣下是波蘭所有有身份的人的表率。我國軍官都應該像國王陛下一樣前往前線戰壕，經歷血與火的淬鍊，學習如何成為一名稱職的軍人。"
 POL_soldier_king: "士兵國王"
 POL_soldier_king_desc: "國王陛下渴望能在前線為了他的國家揮灑鮮血，但我們不能讓一國之君處在如此危險致命的環境之中。通過授予他元帥的軍銜，這樣既能在保證國王安全的情況下滿足他對戰爭的渴望，也能讓他在危難之際成為我們國家團結統一的象徵。"
 POL_support_monarchy_in_CZE: "支持捷克斯洛伐克君主派"
 POL_support_monarchy_in_CZE_desc: "哈布斯堡家族在捷克斯洛伐克的統治已化作過往雲煙。但既然哈布斯堡家族已在我國復辟，而波蘭民族認同感也十分堅定，我們就有能力通過哈布斯堡家族對波希米亞的宣稱來團結全西斯拉夫民族。"
 POL_trust_in_the_west: "信任西方"
 POL_trust_in_the_west_desc: "儘管奧地利哈布斯堡曾在上一次大戰中與西方為敵，但身為波蘭，我們則始終是西方的友國。我們堅信在海外的盟友會像過去一樣繼續對我們施以援手。"
 POL_unite_west_slavia: "聯合波希米亞"
 POL_unite_west_slavia_desc: "隨著陛下加冕為波蘭與波希米亞的共主，波蘭和捷克斯洛伐克的內政部門也將被合併，西斯拉夫團結夢也行將變為現實。"
 POL_restore_poland_hungary_tt: "若匈牙利同意，他們將成為我國的§Y共主邦聯§!，並在名義上仍保持獨立。"
 polish_focus: "波蘭國策樹"
