 #Latvia
 LAT_suspend_the_constitution: "終止拉脫維亞憲法"
 LAT_suspend_the_constitution_desc: "制訂於1922年的拉脫維亞憲法將我們的民主權利編入了法典。然而，隨著戰爭逐漸靠近，憲法很明顯已經無法發揮作用，如果我國想要渡過危機，就必須終止憲法。"
 LAT_appease_democrats: "安撫民主派"
 LAT_appease_democrats_desc: "儘管我們的手段並不民主，但我們的初衷是為了拉脫維亞共和國。我們必須讓民主黨反對派明白我們所做的一些都是為了拉脫維亞，也許重新召集議會能讓他們認識到我們的初衷。"
 LAT_renew_kviesis_term: "延長克維埃西斯任期"
 LAT_renew_kviesis_term_desc: "就目前而言，阿爾貝茨·克維埃西斯已經證明了他是個稱職的國家總理，儘管他是舊民主政府的遺老，但他和他內閣中的任何人一樣服從並忠於烏爾馬尼斯。民主黨會很樂意看到我們延長他的任期。"
 LAT_martial_prime_minister: "軍方總理"
 LAT_martial_prime_minister_desc: "克維埃西斯在和平時期做的很好，但現在戰爭已經迫在眉睫，我們需要一個軍人來領導人民。亞尼斯·巴洛迪斯將會是個合適的人選。"
 LAT_establish_chambers_of_professions: "建立行業商會"
 LAT_establish_chambers_of_professions_desc: "拉脫維亞議會會根據地圖軸線來劃分民眾，但我們知道這不是唯一一種方法。通過建立行業商會，人們將被各自的行業代表，而不是他們所處的地方。"
 LAT_restore_saeima: "重建拉脫維亞議會"
 LAT_restore_saeima_desc: "拉脫維亞議會是地方代表們所在的地。雖然議會已不再管理我們的政府，但可以將其作為獨裁政府的智囊而重新開放，以讓人們抱有民主的幻想。"
 LAT_what_is_socialism: "拉脫維亞社會主義"
 LAT_what_is_socialism_desc: "拉脫維亞社會民主黨是目前議會中最受歡迎的黨派，弗裡西斯·門德爾斯的追隨者們數量眾多且敢於發聲。也許在實行他的一系列改革之後，拉脫維亞的工人們將獲得更好更高效的工作環境。"
 LAT_what_is_capitalism: "國家資本主義"
 LAT_what_is_capitalism_desc: "隨著行業商會建立事宜的籌措完備，是時候直接控制國家經濟了。雖然我們的經濟本質上仍然是資本主義，但現在關鍵的產業必須被控制在獨裁政府手中。"
 LAT_integrate_farmers_party: "整合農民黨"
 LAT_integrate_farmers_party_desc: "民主制度的小把戲已經持續了很久了。現在是時候將農民黨整合進政府並清除其他所有的政黨了。"
 LAT_nationalised_industry: "工業國有化"
 LAT_nationalised_industry_desc: "資本主義經濟早已過時，我們必須保證政府在戰爭時期能牢牢地控制住國家的經濟。"
 LAT_merge_presidential_titles: "合併總統職務"
 LAT_merge_presidential_titles_desc: "巴洛迪斯危險的影響力在政府中逐漸擴大，他作為共同統治者的時代是時候結束了。只有烏爾馬尼斯知道如何保障拉脫維亞的安全。"
 LAT_improve_military_life: "改善軍旅條件"
 LAT_improve_military_life_desc: "如果我們想讓人們為了拉脫維亞而戰鬥，我們就必須給予他們值得為之奮戰的生活。我們可以通過提供更好的口糧以及戰後美好生活的承諾來實現這一點。"
 LAT_military_diarchy: "軍事雙頭制"
 LAT_military_diarchy_desc: "巴洛迪斯在政府中的影響力已經即為龐大，以至於很多人認為政府實質上是由軍隊和烏爾馬尼斯組成的二元政治。我們應該讓這種誤解變為現實，並授予巴洛迪斯對政府更大的控制權。"
 LAT_military_dictatorship: "軍事獨裁"
 LAT_military_dictatorship_desc: "烏爾馬尼斯是個有用且受歡迎的傀儡，這點無可否認，但是隨著衝突的日漸激烈，他最好還是成為一個傀儡，或者說一個花瓶。政府應該交給軍隊來運作。"
 LAT_beyond_the_baltic: "[Root.Get_Beyond_Baltic_Focus_Loc]"
 LAT_beyond_the_baltic_desc: "[Root.Get_Beyond_Baltic_Focus_desc_Loc]"
 LAT_join_the_allies: "[Root.Get_Join_Allies_Focus_Loc]"
 LAT_join_the_allies_desc: "[Root.Get_Join_Allies_Focus_desc_Loc]"
 LAT_formalize_baltic_entente: "[Root.Get_Baltic_Entente_Focus_Loc]"
 LAT_formalize_baltic_entente_desc: "[Root.Get_Baltic_Entente_Focus_desc_Loc]"
 LAT_look_north: "[Root.Get_Look_North_Focus_Loc]"
 LAT_look_north_desc: "[Root.Get_Look_North_Focus_desc_Loc]"
 LAT_threat_on_our_border: "[Root.Get_Threat_Border_Focus_Loc]"
 LAT_threat_on_our_border_desc: "[Root.Get_Threat_Border_Focus_desc_Loc]"
 LAT_empower_paramilitarists: "賦權準軍事組織"
 LAT_empower_paramilitarists_desc: "拉脫維亞的軍隊母庸質疑的比準軍事主義者們要更有用和強大，但我們也不能忽視他們，我們應當給予這些為國家赴湯蹈火之人足夠的回報與承諾。"
 LAT_the_sun_shines_equally: "普天之下人人平等"
 LAT_the_sun_shines_equally_desc: "拉脫維亞的太陽照耀每一個人，這是我們獨裁政府運作的原則。多年來，拉脫維亞的社會因文化與種族問題而嚴重的撕裂，分化，我們不能容許這種情況繼續惡化下去；我們要為每一個拉脫維亞人爭取平等，因此，我們無法繼續支持反對我們理想的準軍事主義者。"
 LAT_banish_clemens: "流放採爾明什"
 LAT_banish_clemens_desc: "危險的法西斯分子古斯塔夫斯·採爾明什威脅著拉脫維亞的統治穩定和全國上下少數民族的安危。在他手下的“雷霆十字”黨對國家造成破壞之前，我們必須把他本人放逐國外。"
 LAT_aizsargi: "資助拉脫維亞衛士團"
 LAT_aizsargi_desc: "臨時政府於1919年組建的拉脫維亞衛士團是政府手下的正規準軍事組織，由於他們在烏爾馬尼斯的政變中功不可沒，我們應當為其提供充足的支援以示獎賞。"
 LAT_womens_aizsargi: "擴大婦女衛士團"
 LAT_womens_aizsargi_desc: "越來越多的國家開始放開對婦女參軍的限制，但在拉脫維亞，只要你有一顆上陣殺敵的心，不管你是男是女，軍隊的大門都將一直為你敞開。"
 LAT_latvia_for_latvians: "拉脫維亞人的拉脫維亞"
 LAT_latvia_for_latvians_desc: "我們的國家不是為了安撫德國人或者俄羅斯人而存在的，我們的國家是且只是為了拉脫維亞人而存在。儘管有些人認為雷霆十字黨是極端民族主義者，但我們明白，如果拉脫維亞想要生存下去，我們就不得不與他們合作。"
 LAT_lift_ban_on_perkonkrusts: "解禁雷霆十字黨"
 LAT_lift_ban_on_perkonkrusts_desc: "雖然雷霆十字黨組織早已被正式取締，但他們的人數仍然與日俱增。為了讓他們明白政府對他們理想的贊同，我們將正式解除對其的禁令。"
 LAT_fanatic_recruitment: "招募激進分子"
 LAT_fanatic_recruitment_desc: "在過去，我們很難決定是否要讓激進分子加入我們的軍隊，因為讓他們更忠於意識形態而非拉脫維亞。但現在我們可以肯定的是，採爾明什和他的追隨者們希望捍衛拉脫維亞與民族獨立的意願絕對不會比任何人遜色。"
 LAT_military_industrial_complex: "拉脫維亞軍工複合體"
 LAT_military_industrial_complex_desc: "為了讓雷霆十字黨武裝起來，我們需要提供他們所需要的一切，現在的拉脫維亞更需要成為一個軍火工廠而不是一個國家。"
 LAT_the_old_ways: "古老教義"
 LAT_the_old_ways_desc: "雷霆十字黨所宣誓對象並不是基督與他的教義，而是更為古老的神明。保守派宣稱採爾米什對古代諸神的異常狂熱令人毛骨悚然，但雷霆十字黨會為了真正的拉脫維亞而奮戰到底，而不受外來神明的影響。"
 LAT_anti_german_propaganda: "反德宣傳"
 LAT_anti_german_propaganda_desc: "我們必須明確一點，雖然我們國家的理念是法西斯主義，但我們絕不是[GER.GetLeader]手中的玩物，我們也決不會與壓迫了我國人民數百年的敵人合作。"
 LAT_supply_forest_brothers: "[Root.Get_Forest_Focus_Loc]"
 LAT_supply_forest_brothers_desc: "[Root.Get_Forest_Focus_desc_Loc]"
 LAT_multicultural_latvia: "多元文化的拉脫維亞"
 LAT_multicultural_latvia_desc: "我們的國家由無數群體和個體組成；拉脫維亞人，波羅的德意志人，猶太人與其他數不盡的個體。我們必須創造一個能讓所有人為之奮鬥的家園，保護我們的多文化社會不受破壞。"
 LAT_ready_the_resistance: "[Root.Get_Ready_Resistance_Focus_Loc]"
 LAT_ready_the_resistance_desc: "[Root.Get_Ready_Resistance_Focus_desc_Loc]"
 LAT_prepare_underground_resistance: "[Root.Get_Underground_Resistance_Focus_Loc]"
 LAT_prepare_underground_resistance_desc: "[Root.Get_Underground_Resistance_Focus_desc_Loc]"
 LAT_prepare_covert_resistance: "[Root.Get_Covert_Resistance_Focus_Loc]"
 LAT_prepare_covert_resistance_desc: "[Root.Get_Covert_Resistance_Focus_desc_Loc]"
 LAT_cave_to_enemy_pressure: "[Root.Get_Enemy_Pressure_Focus_Loc]"
 LAT_cave_to_enemy_pressure_desc: "[Root.Get_Enemy_Pressure_Focus_desc_Loc]"
 LAT_alignment_with_germany: "尋求與德國結盟"
 LAT_alignment_with_germany_desc: "和我們一樣，德國人同樣也對左派和懦弱者充滿了鄙夷和蔑視。雖然他們曾錯誤的有過征服拉脫維亞的想法，但只要我們成為他們堅定的盟友，這種事情就不會再次發生。"
 LAT_the_thunder_strikes_alone: "雷電獨鳴"
 LAT_the_thunder_strikes_alone_desc: "我們不需要任何外國人對我們指手畫腳。拉脫維亞有能力自己捍衛自己的獨立，但這隻可能在雷霆十字黨的指導下實現。"
 LAT_free_the_ugonskrusts: "釋放火十字團"
 LAT_free_the_ugonskrusts_desc: "在我們成為雷霆十字黨之前，我們曾是遭受舊政府壓迫的火十字團。現在我們得到了自由，我們可以釋放無數為了更好地拉脫維亞而奮鬥的政治犯。"
 LAT_lightning_strike: "雷霆進擊"
 LAT_lightning_strike_desc: "我們的鄰國非常的弱小，很容易遭到強權的壓迫與剝削。我們應當將立陶宛和愛沙尼亞置於我們的控制與保護之下，當然，此舉也是為了他們的安全著想。"
 LAT_support_baltic_fascists: "支持波羅的海法西斯主義"
 LAT_support_baltic_fascists_desc: "波羅的海國家自古以來便是情同手足的兄弟。我們也同樣是外敵侵略的目標，我們不能讓軟弱無能的政府繼續統治波羅的海的人民。通過支持立陶宛，愛沙尼亞與波蘭的極右翼運動，波羅的海諸國將團結起來，並準備好與任何人奮戰到底。"
 LAT_consecrate_the_brotherhood: "神化兄弟會"
 LAT_consecrate_the_brotherhood_desc: "儘管彼此之間有許多不同之處，但波羅的海地區的人民依然是一家人。我們文化有別，但數個世紀以來我們一致有著共同的敵人，也面臨著共同的問題。如果我們不想被他人所征服，那我們就必須將兄弟會聯合成為一個統一的聯盟。"
 LAT_consecrate_the_brotherhood_custom_tt: "觸發事件“§Y[LAT.GetNameDef]§!邀請我們加入他們的陣營”。"
 LAT_dievs_keepers: "舊神守護者"
 LAT_dievs_keepers_desc: "優秀的拉脫維亞異教徒開始以更加軍事化的姿態擁護我方，並將採爾明什視作宗教領袖。我們政府中較為保守的天主教徒擔心，波羅的海異教會變為以採爾明什為精神領袖的邪教組織，但是把槍桿子交給這些激情澎湃的年輕人著實讓我們獲益良多。"
 LAT_state_paganism: "國家異教主義"
 LAT_state_paganism_desc: "狄厄瓦斯崇拜在軍中的影響力已經遠遠超過了其它所有宗教。採爾明什身邊的狂熱信徒聲稱他們願意為了舊神赴湯蹈火，但實際上他們的“舊神”正是採爾明什本人。只要把狄厄瓦斯信仰定為拉脫維亞國教，我們就能開始在全國各地的教堂和寺廟中傳播和宣揚雷霆十字黨的意識形態。"
 LAT_wrath_of_the_old_gods: "舊神之怒"
 LAT_wrath_of_the_old_gods_desc: "波羅的海地區並不是唯一一片未受外來宗教所玷汙的地區。世界上大多數地區都信奉基督教義，而這必須被改變。我們必須發動一場屬於我們自己的聖戰，一場針對基督教世界的聖戰！"
 LAT_ostland: "東方領"
 LAT_ostland_desc: "德國人已經計劃把整個波羅的海地區和部分東波蘭地區一起劃定為一個統一的國家。儘管在他們的構想中，波羅的海德意志人無疑將會是這裡的人上人，但我們沒有理由不抓住此機會建立一個由拉脫維亞主導的東方領。"
 LAT_reorganize_forest_brothers: "重組森林兄弟"
 LAT_reorganize_forest_brothers_desc: "森林兄弟是拉脫維亞民族認同和民族自決的守護者。但同樣要保護立陶宛人和愛沙尼亞人的思想如同一劑毒藥，腐蝕了他們的思想。不能再這個樣子下去了，拉脫維亞的森林兄弟會必須向採爾明什和雷霆十字黨宣誓效忠，並立志保衛拉脫維亞！"
 LAT_avenge_the_ancestors: "為先祖復仇"
 LAT_avenge_the_ancestors_desc: "自波羅的海地區被諸部落統治起，拉脫維亞人就未曾嘗過獨立的滋味，而這都是因為德國人、瑞典人和俄國人無窮無盡的入侵和征服。在被如此蹂躪了一千年之後，我們的下一個千年將不再活在野蠻壓迫之中，這些外國的帝國主義者都將拜倒在拉脫維亞的腳下！"
 LAT_united_baltic_empire: "統一的波羅的海帝國"
 LAT_united_baltic_empire_desc: "儘管建立團結統一的波羅的海國家的想法似乎有些不切實際，但不可否認的是我們的兄弟會的影響力早已擴展到了國境之外。如今立陶宛和愛沙尼亞都已落入我們的掌控，只需將兩國的行政體系整合進來，我們稱霸波羅的海的雄心就將成為現實。"
 LAT_renew_the_constitution: "重啟拉脫維亞憲法"
 LAT_renew_the_constitution_desc: "誠然，卡爾利斯·烏爾馬尼斯建立起了一個強有力的拉脫維亞政府，使我國扛過了法西斯主義和共產主義的風暴，但現在的平民政府中已經全是農民黨的成員，我們已經沒理由不重啟公共選舉了。"
