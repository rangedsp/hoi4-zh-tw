 BALTIC_supported_fascism: "支持波羅的民族主義"
 accepted_catholics: "接納天主教徒"
 annex_liberia_opinion: "吞併利比里亞"
 #Estonia
 EST_era_of_silence: "緘默時代"
 EST_era_of_silence_desc: "從薩列馬到沃魯馬，當暴虐的極端民族主義組織“瓦普運動”席捲全國之際，國老當為愛沙尼亞開闢嶄新的時代。沒有選舉，沒有異議，也沒有反對者；這正是這個國家所必需的緘默時代。"
 EST_ismaaliit: "祖國聯盟"
 EST_ismaaliit_desc: "鑑於佩茨本人的政黨都被各政府機關拒之門外，本國的專制政權如今急需新的黨派以支持自己的統治。祖國聯盟正是那個選擇，它將勇擔職責，保護愛沙尼亞國家免遭國內外威脅的迫害。"
 EST_establish_the_rahvuskogu: "建立國民議會"
 EST_establish_the_rahvuskogu_desc: "由於舊愛沙尼亞憲法已被證實無法保護人民免遭法西斯主義和暴政的迫害，我們必須另起草新的憲法來捍衛國家的安全，及時恢復愛沙尼亞人民1918年曾為之奮鬥和犧牲的民主傳統。"
 EST_chamber_of_deputies: "確保下議院"
 EST_chamber_of_deputies_desc: "隨著祖國聯盟如今牢牢掌控上議院，接下來要做的便是奪取下議院的控制權。只要能夠在上下議院佔據絕對多數的席位，我們的專制政權就能徹底鞏固對本國及國家產業的控制。"
 EST_exploit_the_banks: "盤剝銀行業"
 EST_exploit_the_banks_desc: "儘管有些人會大逆不道地斷言佩茨在銀行業的腐敗中分了羹，還對愛沙尼亞工人群眾進行了剝削。但不可否認，康斯坦丁·佩茨長久以來都是愛沙尼亞銀行業領域頗有影響力的人物。他在這個私人行業領域中的關係，無疑將會幫助我們的專制政權為自己謀得些利益。"
 EST_modernize_capital: "塔林現代化"
 EST_modernize_capital_desc: "我們偉大的都城——塔林在德俄兩國壓迫者的魔爪中沉淪已久，至今沒能發揮出作為波羅的海地區心向神往之都的潛力。這座偉大的都城過去從未，將來也絕不會被外敵褻瀆或焚燬，我們必須對其展開現代化建設，讓它能與其他歐洲名城相匹敵。"
 EST_squash_the_opposition: "粉碎反對派"
 EST_squash_the_opposition_desc: "隨著我方徹底掌控中央政府，現在的當務之急便是徹底從內閣乃至地方政府中清理所有可能的叛黨。膽敢忤逆我們領導的人必須認識到，反對祖國聯盟就是反對愛沙尼亞。"
 EST_formalize_baltic_entente: "波羅的海協約正式化"
 EST_formalize_baltic_entente_desc: "波羅的海協約是我等波羅的海諸國兄弟為了在戰時相互援助而締結的協定，但這份協定是否真的可靠或許還有待商榷。面對蘇德兩國死亡的氣息漸逼我等的咽喉，而英國人卻遠在天邊時，合作對於確保我等諸國脆弱的獨立來說便至關重要了。"
 EST_look_north: "放眼北境"
 EST_look_north_desc: "我們都清楚僅靠波羅的海諸國自身可能無法阻止納粹和蘇聯人蹂躪國境，而鑑於我們的敵人對斯堪的納維亞同樣抱有野心，也許我們能夠說服北方的盟友加入到波羅的海協約當中。"
 EST_beyond_the_baltic: "波羅的海之外"
 EST_beyond_the_baltic_desc: "也許有人自信波羅的海協約便足以捍衛我等小國免遭侵略，但我們都知道那不過是天真的幻想。鑑於同盟國成員曾在1918年對我們的獨立鬥爭伸出了援手，再次期待他們的援助也許並非不可！"
 EST_join_the_allies: "加入同盟國"
 EST_join_the_allies_desc: "同盟國已被證明誠為捍衛[ROOT.GetAdjective]獨立的真正朋友，現在我們只需要帶領[ROOT.GetNameDef]正式加入同盟國陣營，來讓這份友誼得到正式化的保障。"
 EST_national_council: "確保上議院"
 EST_national_council_desc: "上議院是在我國政府中代表著地方自治團體、城市以及商會的機構。如果我們要切實代表這些群體的利益，我們就必須確保他們的代表是忠誠的祖國聯盟成員或軍方人士；畢竟，只有這些人才有能力捍衛愛沙尼亞人民的主權。"
 EST_new_economic_policy: "重新審視經濟政策"
 EST_new_economic_policy_desc: "我國經濟目前幾乎完全依賴與蘇聯的貿易。要知道，俄國人是愛沙尼亞民族自決的最大敵人，只要還在某些方面有求於他們，我們就仍未獲得真正的自由。我們必須從這個壓迫者的掌控中解脫出來，更加獨立自主地發展本國經濟。"
 EST_support_independent_militaries: "扶持獨立民兵組織"
 EST_support_independent_militaries_desc: "如今，各類獨立民兵組織遍佈整個愛沙尼亞。他們儘管渴望著投入到保衛我國免遭帝國主義荼毒的鬥爭中，但無奈意志有餘，資源不足。無論是官方正編還是民間豪勇，我們必須為所有的士兵提供保家衛國所需的資源。"
 EST_fight_the_vaps: "打擊瓦普運動"
 EST_fight_the_vaps_desc: "右翼的瓦普運動正伺機破壞著愛沙尼亞的繁榮與穩定。雖然此運動起初只是由老兵和戰爭英雄組成的團體，但眼下其已迅速發展成為在[EST.GetLeader]看來能與納粹相提並論的極端民族主義組織。如果想讓愛沙尼亞擁有穩定的未來，就必須剷除瓦普運動這種有損國內安泰的因素。"
 EST_republican_defence_league: "共和國防衛聯盟"
 EST_republican_defence_league_desc: "隨著瓦普運動聲勢漸微，許多準軍事團體如今都迷失了方向，不知道自己該為何而戰。通過將這些準軍事組織整合為愛沙尼亞的正規軍團，我們將收穫大批願為愛沙尼亞獨立奮戰至死的無畏鬥士。"
 EST_womens_defence_league: "婦女防衛聯合會"
 EST_womens_defence_league_desc: "婦女防衛聯合會是共和國防衛聯盟的下屬組織，由那些願意投身保家衛國戰線的女性組成。我們應該為這個組織提供充足的物資和裝備，以使她們能夠在國內承擔駐軍職責，亦或是作為醫療人員隨軍行動。"
 EST_corporate_chambers: "與議院合作"
 EST_corporate_chambers_desc: "左翼分子一直以來就對社團主義嗤之以鼻，但如今議會終於可以不再受其掣肘，我們也終於可以建立一個團結一致的上議院。工人們將不再由意識形態，而是由職業進行劃分，其利益也完全被私人僱主們所代表。這又會出什麼問題呢？"
 EST_cave_to_enemy_pressure: "懾於敵威"
 EST_cave_to_enemy_pressure_desc: "有一點在未來是十分清楚的，即國家與人民不可兩全。儘管我們為了保護同胞已經做出了許多努力，但顯然，如果人民不付出巨大的犧牲，[Root.GetNonIdeologyName]則無法保持獨立。"
 EST_threat_on_our_border: "我們邊境上的威脅"
 EST_threat_on_our_border_desc: "戰爭已經一觸即發。我們還不知道我們將為何而戰，也不知道將與誰作戰。但可以肯定的是，戰爭的矛頭如同禿鷲的利爪一般，正筆直地向著[Root.Capital.GetName]而來。我們必須決定在接下來的衝突中誰是敵，誰是友。這一決策必須被提上日程，決定我國的重點是抵禦南方的納粹還是東方的蘇聯。"
 EST_fortify_tallinn: "鞏固塔林"
 EST_fortify_tallinn_desc: "儘管許多人願意相信我們能保衛愛沙尼亞的全部邊境，但我們心裡清楚，為了生存下去，必須犧牲一些地區。首都周圍的要塞將使我們能夠保衛我國基礎設施的核心地帶，不惜一切代價。"
 EST_hold_saaremaa: "堅守薩列馬"
 EST_hold_saaremaa_desc: "我們必須為長期艱苦的抵抗做好準備。儘管愛沙尼亞群島缺乏本土工業，但我們可以將其建設成為支持反抗軍的最後基地，並且在時機來臨之時收復家國。"
 EST_fortify_the_border: "鞏固邊境"
 EST_fortify_the_border_desc: "我們將在邊境對敵作戰，並且堅信在拉脫維亞和立陶宛的友軍不會失敗。無論這個計劃如何艱鉅，面對蘇聯或德國，我們必須寸土不讓。"
 EST_fight_against_communism: "決不投降"
 EST_fight_against_communism_desc: "目睹敵佔區民生之艱，勇士英勇奮起，烈士壯烈犧牲。行伍中人心向國，我軍決不坐以待斃。"
 EST_long_push_east: "艱辛征途"
 EST_long_push_east_desc: "我們從未想過戰爭竟會如此順利，但事實的確如此。戰士們全副武裝地在敵人的核心領土上推進。敵國相比我國過於遼闊，這注定是場艱苦的旅途，我們必須做好準備。"
 EST_prepare_for_the_inevitable: "人事已盡，天命難違"
 EST_prepare_for_the_inevitable_desc: "我們堅持不了太久，現在重要的是準備讓政府流亡海外，在海外支持[Root.GetAdjective]本土的抵抗運動。"
 EST_forest_brothers: "森林兄弟"
 EST_forest_brothers_desc: "遍佈波羅的海三國的反共民兵藏身於白雪皚皚的深山老林之中，向著侵犯家鄉的敵人發起了一次又一次的襲擊，如今他們的英勇事蹟也傳入了我們的耳中。我們必須與這些自由鬥士建立聯繫，並竭盡所能支援他們在波羅的海地區進行的軍事行動。"
 EST_prepare_underground_resistance: "準備工業抵抗"
 EST_prepare_underground_resistance_desc: "[Root.GetNonIdeologyName]全國大多數工廠都已經被迫關停或落入敵手，因此從海外謀得工業投資和軍事裝備就成了當下的頭等大事。只有這樣，我們才能繼續生產用於抵抗的武器彈藥——即使我們的鬥爭不得已轉入地下。"
 EST_prepare_covert_resistance: "準備地下抵抗"
 EST_prepare_covert_resistance_desc: "抵抗運動不是有了人和槍就夠的，而是包括了破壞補給線、聯繫反抗軍，分散和迷惑敵軍以同時打擊等多項活動。如果我們想重奪故土，那就必須在[Root.GetAdjective]情報上花些功夫。"
 EST_rally_the_nation: "全國號召"
 EST_rally_the_nation_desc: "瓦普運動是一個由愛沙尼亞獨立戰爭中的老兵組成的組織，長期遭受著康斯坦丁·帕斯政府不公正的迫害。我們若想建立一個愛沙尼亞人自己的愛沙尼亞，那就必須讓瓦普運動的名號響徹全球。我們必須向外出擊，讓世人知曉我們的存在。我們為愛沙尼亞而戰，我們的威名必將傳遍四海！"
 EST_march_on_talinn: "向塔林進軍"
 EST_march_on_talinn_desc: "有了為數眾多的愛沙尼亞老兵團體和準軍事組織支持，我們確信康斯坦丁·帕斯將無力阻止我們進軍塔林。我們將控制議會，並十分明確地宣佈成立一個團結於阿蒂爾·西爾克之下的愛沙尼亞瓦普政府。"
 EST_glory_of_war: "戰爭的榮光"
 EST_glory_of_war_desc: "我們的政府是老兵的政府，但許多瓦普運動的成員都因年事已高或為傷病所困而無法再次服役。或許這些“老驥”能在對新一代愛沙尼亞士兵的戰爭訓練上繼續發光發熱。"
 EST_mobilize_the_vets: "動員老兵"
 EST_mobilize_the_vets_desc: "許多愛沙尼亞老兵因參加瓦普運動而被前政府剝奪了重新入伍的權利。如今政府已歸我們掌控，或許我們能恢復其服役的權利。"
 EST_vapsid_youth: "瓦普青年團"
 EST_vapsid_youth_desc: "瓦普運動的大多數成員都已壯年不再，但組織中的新鮮血液仍為幾十年前愛沙尼亞獨立鬥爭激勵下砥礪前行。通過建立瓦普青年團，這些充滿激情的年輕人將得以繼承父輩的榮耀。"
 EST_veterans_government: "老兵政府"
 EST_veterans_government_desc: "前內閣大臣們都是一群屈從於康斯坦丁·帕斯的膽小無能之輩。我們需要組建新的內閣，以與瓦普運動共進退。"
 EST_anti_communist_militia: "反共民兵"
 EST_anti_communist_militia_desc: "我們民族有著打倒東方布爾什維克威脅的意願，但舊政府卻以過於激進為由加以拒絕。對於瓦普運動來說，一切反共思想都不會過於激進，因此這些人理應在我們的軍隊中享有一席之地。"
 EST_reach_out_to_germany: "接觸德國"
 EST_reach_out_to_germany_desc: "如果我們能以靈與智痛擊蘇維埃，蘇聯的末日就在明天。可惜的是，面對如此巨大的威脅，愛沙尼亞缺乏自衛用的人力。如果與德國聯合，我們或許能絕處逢生。"
 EST_baltic_shield: "波羅的海之盾"
 EST_baltic_shield_desc: "蘇聯帝國主義妄想碾碎愛沙尼亞，這決不能發生。堡壘將在邊境落成，或許我們無力擊敗蘇聯，但至少要撐到蘇聯被擊敗的那天！"
 EST_join_the_axis: "加入軸心國"
 EST_join_the_axis_desc: "既然德國人已經完全理解了我們的想法，那愛沙尼亞定能加入軸心國。"
 EST_the_brotherhood: "兄弟會"
 EST_the_brotherhood_desc: "愛沙尼亞並非孑然一身。在南方有著兩個非常脆弱的國家，他們只有併入愛沙尼亞才有能力生存下去。波羅的海諸國是兄弟，我們作為兄弟必須共進退。"
 EST_empower_finnish_militants: "賦權芬蘭裔民兵"
 EST_empower_finnish_militants_desc: "如果沒有北方芬蘭老兵的援助，瓦普運動是不可能成事的。芬蘭志願軍曾幫助愛沙尼亞謀得獨立，現在正謀求推翻軟弱無能的現任芬蘭政府，並建立一個只對國民負責的新芬蘭政府。"
 EST_national_pride_in_finland: "在芬蘭的民族自豪遊行"
 EST_national_pride_in_finland_desc: "芬蘭老兵缺少像我們這樣的組織，因此我們倘若僅是被動支援，還不足以在芬蘭掀起如愛沙尼亞一般的變革。通過在芬蘭組織遊行，假以時日，我們也許能見證兩國在上次戰爭的英雄面前團結一致。"
 EST_finno_estonian_supremacy_league: "芬蘭-愛沙尼亞至高聯盟"
 EST_finno_estonian_supremacy_league_desc: "舊芬蘭政府如今已經灰飛煙滅，而新芬蘭政府與我國建立了良好而緊密的關係。我們也許能利用這一點，為兩國以民族自治和反共情緒為基礎的長久友誼奠定基礎。"
 EST_unite_our_nations: "團結兩國"
 EST_unite_our_nations_desc: "隨著老兵團體控制了芬蘭，我們的影響也滲透到了新芬蘭政府的每一個角落。現如今我們只需要略施計策，就能讓兩國人民統一於同一面旗幟下。"
 EST_sieze_swedish_assets: "收繳瑞典資源"
 EST_sieze_swedish_assets_desc: "瑞典坐擁斯堪的納維亞半島的大量資源，對敵人卻只會割肉飼虎、委曲求全。這種暴殄天物的行為也就到此為止了，半島的資源必須歸於愛沙尼亞！"
 EST_secure_the_straits: "控制海峽"
 EST_secure_the_straits_desc: "丹麥橫亙在我國與大西洋之間。愛沙尼亞的船隻若想進入北海，那丹麥就必須從地圖上被抹去。"
 EST_occupy_norway: "佔領挪威"
 EST_occupy_norway_desc: "瑞典和芬蘭已然收入囊中，只需再征服挪威，整個斯堪的納維亞半島都將落入愛沙尼亞的控制中。"
 EST_form_scandinavia: "愛沙尼亞即斯堪的納維亞"
 EST_form_scandinavia_desc: "曾幾何時，半島上的許多人都認為愛沙尼亞對斯堪的納維亞的宣稱不過是一個笑話。但隨著整個半島都歸於我國的控制中，還有誰能嘲笑我們呢？隨著瑞典、挪威和丹麥完全被愛沙尼亞征服，如今已無人能阻止我們宣佈自己是整個斯堪的納維亞的統治者！"
 EST_proclaim_finno_ugra: "宣佈成立芬蘭-烏戈爾"
 EST_proclaim_finno_ugra_desc: "隨著芬蘭落入我國手中，我們擁有了獨一無二的命運之石：鞏固國民的芬蘭身份認同。北歐有無數的芬蘭-烏戈爾人，利用這一身份認同，無數的族人將前仆後繼投身於瓦普統一運動的大業中。"
 EST_unite_the_sami: "團結薩米人"
 EST_unite_the_sami_desc: "薩米人是一個廣泛分佈於芬蘭、瑞典、挪威和俄羅斯的民族，長期飽受外族欺壓。長久以來，薩米人被禁止使用芬系母語，而也缺乏足以反抗壓迫者的力量。我們必須團結國內的薩米人，保護其免受北歐帝國主義的侵害。"
 EST_unite_karelia: "統一卡累利阿"
 EST_unite_karelia_desc: "卡累利阿地區有許多芬族人，包括本土的卡累利阿人和東部的薩米人。隨著芬蘭現已落入我手，我們或許能夠將我國疆域擴展至卡累利阿，並團結那裡的芬族人。"
 EST_unite_the_finnic_identity: "團結芬語族"
 EST_unite_the_finnic_identity_desc: "隨著斯堪的納維亞半島上的所有芬族地區均處於我國的控制之下，我們可以團結芬蘭語群體，並建立一個愛沙尼亞人、芬蘭人、薩米人、涅涅茨人等諸芬蘭-烏戈爾民族都能稱之為家園的嶄新國度！"
 EST_break_the_silence: "打破緘默"
 EST_break_the_silence_desc: "康斯坦丁·帕斯保護愛沙尼亞免受法西斯主義和共產主義荼毒是假，實行獨裁統治是真。既然現在這兩種意識形態在愛沙尼亞國內已無足輕重，那麼他的獨裁統治就沒有理由再維持下去，自由選舉也必須得以恢復。"
 #Lithuania
 LIT_secure_a_loyal_cabinet: "重新召集議會"
 LIT_secure_a_loyal_cabinet_desc: "隨著政變成功以及安塔納斯·斯梅托納對政府的絕對控制，我們應該與忠於獨裁者的部長們重開議會，以此更有效地治理國家。"
 LIT_rastikis_military_reforms: "拉斯蒂吉斯的軍事改革"
 LIT_rastikis_military_reforms_desc: "我國軍隊還沒有準備好面對新一輪德國入侵這一巨大且嚴峻的威脅。因此政府軍事部門對立陶宛軍隊中愛國者稱職的領導至關重要。"
 LIT_patriotic_education: "愛國主義教育"
 LIT_patriotic_education_desc: "立陶宛的教育事業日漸發展，但我們不能允許錯誤思想在年輕群體間氾濫。年輕人們必須像理塔斯教會裡的立陶宛天主教徒那樣接受正確的愛國主義教育。"
 LIT_soviet_mutual_assistance: "[SOV.GetAdjective]互助條約"
 LIT_soviet_mutual_assistance_desc: "眾所周知，波蘭同時是蘇聯與德國的首要目標。有傳言稱，蘇德兩國已簽訂條約準備瓜分波蘭。或許我們能就此與蘇聯進行談判，以在此事給予蘇聯支持為籌碼，換取對方將維爾紐斯歸還我國。"
 LIT_victory_in_trust: "信任就是勝利"
 LIT_victory_in_trust_desc: "政府中可被我們信任的人寥寥無幾：卡濟斯·格里紐斯不能，奧古斯丁納斯·沃爾德瑪拉斯不能，甚至連拉斯蒂奇也不能。肉食者鄙，未能遠謀，那些手裡有真傢伙的軍隊男兒才真正值得我們信賴，並將帶領我們走向勝利。"
 LIT_integrate_the_opposition: "整合反對派"
 LIT_integrate_the_opposition_desc: "雖然安塔納斯·斯梅托納認為前政府裡的官員不是不稱職的政治家就是與蘇聯沆瀣一氣的內奸，但不可否認的是他們之中的確有一些出類拔萃之人。如果我們不讓這些人在新的議會中繼續發光發熱，那可就太無知了。"
 LIT_patriotic_socialism: "愛國社會主義"
 LIT_patriotic_socialism_desc: "過去的民主政府中有很多人是社會民主黨人和中間派，這導致社會主義思想在立陶宛的工人流毒無窮。儘管卡濟斯·格里紐斯毫無疑問是個社會主義者，但他的愛國之心也同樣是不容置疑的。通過踐行其部分觀點，立陶宛的工人也許會工作的更加賣力，同時還會更加擁護我們的獨裁統治。"
 LIT_peace_with_poland: "與波蘭和解"
 LIT_peace_with_poland_desc: "雖然明面上波蘭與立陶宛之間的戰爭已經持續了數十年，但實際上雙方在戰爭的絕大多數時間內並未發生交火。儘管維爾紐斯還在他們的手裡，我們仍需打破僵局，與波蘭和解，以此把精力放在我國東西兩側真正的敵人上。"
 LIT_strength_in_unity: "團結就是力量"
 LIT_strength_in_unity_desc: "我們攜手同行，不懼萬難，世間再沒有其他國家能如波立兩國這般緊密地結合在一起。儘管我們不會讓立陶宛重新成為波蘭-立陶宛聯邦的一部分，但波蘭和立陶宛還是可以如朋友一般互相合作，以保衛兩國脆弱的獨立地位。"
 LIT_indivisible_power_of_the_state: "國家權力不容分裂"
 LIT_indivisible_power_of_the_state_desc: "我即國家，國家即我。隨著與獨裁統治相關的法條和規則的正式落地，獨裁者的地位已經堅如磐石、不可動搖。儘管依然有些人妄圖迴歸民主，但大家都明白，在蘇維埃巨熊和日耳曼禿鷲同時對立陶宛這塊肥肉虎視眈眈的時候，這種想法是多麼危險和愚蠢。"
 LIT_purge_popular_resistance: "清洗群眾抵抗"
 LIT_purge_popular_resistance_desc: "人民群眾中的一部分不安定分子反對斯梅托納與其獨裁統治。這些人是立陶宛獨立的敵人，必須加以消滅來確保我國的長治久安和持續生存。"
 LIT_anti_communist_militia: "反共民兵"
 LIT_anti_communist_militia_desc: "我們立志要把左翼思想從我國驅逐出去，幸運的是全國上下有許多志願軍持有和我們一樣的看法。我們應當支持這些反共組織，來協助解決國內的親蘇分子。"
 LIT_arrest_nazis_in_memel: "逮捕梅梅爾納粹分子"
 LIT_arrest_nazis_in_memel_desc: "充斥著納粹黨和法西斯主義者的梅梅爾無疑在未來會成為德國入侵的橋頭堡。如果我們想控制住梅梅爾，那就必須將加入納粹黨定性為足以入獄的犯罪行為，併為潛在的納粹入侵的可能做好充足的準備。"
 LIT_reminder_of_true_enemy: "警示真正的敵人"
 LIT_reminder_of_true_enemy_desc: "在1918年戰爭期間，我們同時面臨著來自蘇俄紅軍和德國自由軍團的威脅。如今世界局勢又是山雨欲來，這些往昔的苦澀回憶再次在我國高層的腦海中浮現。時不我待，我們必須作出決斷，把蘇德之一視作我國真正的威脅，並做好迎接戰爭的準備！"
 LIT_appease_soviets: "安撫俄國"
 LIT_appease_soviets_desc: "我們雖已全力備戰，但若想保全立陶宛人民，只能向俄國俯首投降。"
 LIT_appease_nazis: "安撫德國"
 LIT_appease_nazis_desc: "我們雖已全力備戰，但若想保全立陶宛人民，只能向德國俯首投降。"
 LIT_offer_military_basing: "提供駐軍權"
 LIT_offer_military_basing_desc: "我們不想再打一場世界大戰了。立陶宛將同時向德國和蘇聯開放其戰略利益，包括兩國在立陶宛境內的通行、駐軍以及修建並使用要塞的權利。或許這能讓我們免受侵略。"
 LIT_offer_military_basing_tt_1: "§G取決於安撫對象：§!\n"
 LIT_offer_military_basing_tt_2: "§R或§!\n"
 LIT_occupation: "軍事佔領"
 LIT_occupation_desc: "太遲了。立陶宛國內到處都是敵國士兵，他們能在任何時候對我們發起攻擊。或許這時只能讓我們的領袖和政府辭職，然後眼睜睜地看著敵人在我們的土地上為所欲為了。"
 LIT_free_voldemares: "釋放沃爾德馬拉斯"
 LIT_free_voldemares_desc: "或許斯梅托納在逮捕沃爾德馬拉斯這件事上有些操之過急了。這位前任首相顯然對立陶宛的獨立有所幫助，如果不好好利用他的才能和他在政府內部的忠實擁躉，那可就太愚蠢了。"
 LIT_lithuanian_activist_front: "立陶宛行動陣線"
 LIT_lithuanian_activist_front_desc: "立陶宛全國到處都是活動家和準軍事團體。儘管這些個人及組織彼此獨立，意識形態也不盡相同，但他們為立陶宛祖國及其獨立而奮戰的心意是一致的。立陶宛行動前線的建立能夠確保我國不再輕易地成為帝國主義擄掠的目標。"
 LIT_organize_the_iron_wolf: "組織鐵狼團"
 LIT_organize_the_iron_wolf_desc: "鐵狼團目前仍是群龍無首、一盤散沙，和沃爾德馬拉斯本人一樣在對待現任政府的態度上舉棋不定。只要給鐵狼團一個明確的願景和目標，他們就能從仿徨中再度清醒。"
 LIT_new_kind_of_iron_wolf: "新鐵狼團"
 LIT_new_kind_of_iron_wolf_desc: "如今鐵狼團的威脅已被消除，我們得以重新拿起我們的國家象徵，並驕傲地將其用於我軍。"
 LIT_lithuanian_youth: "鐵狼青年團"
 LIT_lithuanian_youth_desc: "軍隊需要戰士，但出於意識形態的考慮，我們需要將愛國主義根植於青少年的心中。這樣一來，等他們長大成人後，只要給每人發一杆槍，他們就能即刻踏上戰場，為立陶宛的每一寸土地拋頭顱灑熱血。"
 LIT_rapid_fortifications_in_the_east: "東線快速要塞化"
 LIT_rapid_fortifications_in_the_east_desc: "毫無疑問，共產主義一直以來是我國獨立的最大威脅。我們必須竭盡所能，保護祖國免受其威脅。"
 LIT_defence_from_above: "防衛領空"
 LIT_defence_from_above_desc: "如果我國的要塞工事遭到敵人持續的空中轟炸，那麼其意義就一點也沒有了。我們必須做好應對敵方空軍的準備，把他們從空中傾瀉下來的彈藥一點不少地回敬過去。"
 LIT_exile_voldemares: "流放沃爾德馬拉斯"
 LIT_exile_voldemares_desc: "只要奧古斯丁納斯·沃爾德馬拉斯還在老老實實地蹲大牢，鐵狼團就暫時成不了氣候。但他的殘黨一直在叫囂，要求釋放沃爾德馬拉斯，是為我國政府的顯著威脅。如果把沃爾德馬拉斯流放到海外，不允許其再次入境，那鐵狼團運動自然就會群狼無首，從而再也不會對我們構成威脅了。"
 LIT_root_out_the_iron_wolf: "剷除鐵狼團"
 LIT_root_out_the_iron_wolf_desc: "儘管流放沃爾德馬拉斯已經讓鐵狼團再無可能推翻政府，但該組織仍舊存在。這幫傢伙必須從政治中清除掉，以保證未來立陶宛軍隊的穩定。"
 LIT_prepare_forest_brothers: "[Root.Get_Forest_Focus_Loc]"
 LIT_prepare_forest_brothers_desc: "[Root.Get_Forest_Focus_desc_Loc]"
 LIT_unify_the_military: "聯合軍隊"
 LIT_unify_the_military_desc: "部分立陶宛軍隊已經完全聽信於沃爾德馬拉斯的鐵狼團準軍事組織，若鐵狼團再次發出邀請，幾乎所有的立陶宛軍隊恐怕都會被其納入麾下。事已至此，我們只好決定將斯梅托納逐出政府，重新奪回立陶宛！"
 LIT_seek_ties_with_germany: "尋求與德國聯合"
 LIT_seek_ties_with_germany_desc: "儘管德國是立陶宛明面上的敵國，但是兩國也有個共同的敵人——波蘭。或許我們可以嘗試與德國合作，從而解放波蘭佔領下的立陶宛同胞。"
 LIT_fortify_memel: "梅梅爾要塞化"
 LIT_fortify_memel_desc: "與其相信德國人能夠捍衛立陶宛的主權，倒不如相信一隻黃鼠狼不去偷雞！毫無疑問，梅梅爾問題已讓讓德國的鋒芒直向我們而來。現在，[GER.GetLeader]已然是立陶宛的敵人！"
 LIT_proclaim_greater_lithuania: "宣稱大立陶宛"
 LIT_proclaim_greater_lithuania_desc: "立陶宛曾經是歐洲最強大的國家之一，但自從數個世紀前遭到波蘭打壓後，我們就失去了重回昔日榮耀的能力。今時不同往日，立陶宛一定會再次成為歐洲的霸主！"
 LIT_claim_livonia: "宣稱利沃尼亞"
 LIT_claim_livonia_desc: "北方有兩個年輕的國家，在過去的幾個世紀中不知獨立為何物。他們在立陶宛的指導下定會更好……"
 LIT_claim_lithuania_minor: "宣稱下立陶宛"
 LIT_claim_lithuania_minor_desc: "德國人所謂的“柯尼斯堡”地區，實際上是立陶宛人祖先的故鄉。自從北方十字軍入侵後，當地立陶宛裔就一直處於德國人統治下，現在我們必須拿回這一地區。"
 LIT_demand_vilnius: "聲索維爾紐斯"
 LIT_demand_vilnius_desc: "立陶宛的傳統首都長期以來被敵國波蘭控制，而我國政府從前始終態度軟弱，無力應對。現在，維爾紐斯將再次屬於立陶宛！"
 LIT_support_polish_fascists: "支持波蘭法西斯"
 LIT_support_polish_fascists_desc: "波蘭與我們有著共同的敵人，況且我們也不能忘記波蘭-立陶宛聯邦時期兩國的交情，因此我們必須支持波蘭國家境內的法西斯主義。"
 LIT_invade_poland: "入侵波蘭"
 LIT_invade_poland_desc: "立陶宛曾被波蘭主導的所謂“波蘭-立陶宛聯邦”束縛了數個世紀。波蘭人一直盤算著重建聯邦，也許是時候“成全”他們了。"
 LIT_request_polish_occupation: "要求佔領波蘭"
 LIT_request_polish_occupation_desc: "在過去的幾十年間，一個不包含立陶宛的波蘭國家概念是不可想像的，立陶宛的主權在當代波蘭政客們看來也是尤為可笑。或許他們對於立陶宛佔領其可憐國度會非常滿意。"
 LIT_restore_order: "重建舊秩序"
 LIT_restore_order_desc: "很久之前，立陶宛曾經是所謂的“聯邦”中更強大的一方，而波蘭只不過是我們邊界上的蕞爾小國。是時候把世界恢復成原本的樣子了。"
 LIT_restore_greater_lithuania: "重建大立陶宛"
 LIT_restore_greater_lithuania_desc: "在我國東方，有無數合作者期望在我國政府中任職。其他人雖然效忠於地方政府，但同時也正大步走向立陶宛屬魯塞尼亞新時代！"
 LIT_prepare_resistance: "[Root.Get_Ready_Resistance_Focus_Loc]"
 LIT_prepare_resistance_desc: "[Root.Get_Ready_Resistance_Focus_desc_Loc]"
 LIT_underground_production_centers: "[Root.Get_Underground_Resistance_Focus_Loc]"
 LIT_underground_production_centers_desc: "[Root.Get_Underground_Resistance_Focus_desc_Loc]"
 LIT_infiltrate_homeland: "[Root.Get_Covert_Resistance_Focus_Loc]"
 LIT_infiltrate_homeland_desc: "[Root.Get_Covert_Resistance_Focus_desc_Loc]"
 LIT_a_corporatist_economy: "社團主義經濟"
 LIT_a_corporatist_economy_desc: "西方國家期待立陶宛國內迅速實現經濟自由化。然而，安塔納斯·斯梅托納傾向於社團主義模式帶來的控制力與集權。"
 LIT_a_martial_prime_minister: "軍方總理"
 LIT_a_martial_prime_minister_desc: "總理辦公室通常由民選上臺的政治人物主持，但在戰火紛飛的當下，隨著總統的權力與日俱增，我們必須選擇一位強有力的領導人來作為[ROOT.GetLeader]的左右手！"
 LIT_a_priestly_prime_minister: "教士總理"
 LIT_a_priestly_prime_minister_desc: "作為前國民大會議員，弗拉達斯·米羅納斯教士是代表民族黨出任總理的理想人選。他在天主教會中的地位，以及對農民和農業的奉獻，使他在立陶宛下層階級中頗受歡迎。"
 LIT_formalize_baltic_entente: "[Root.Get_Baltic_Entente_Focus_Loc]"
 LIT_formalize_baltic_entente_desc: "[Root.Get_Baltic_Entente_Focus_desc_Loc]"
 LIT_beyond_the_baltic: "[Root.Get_Beyond_Baltic_Focus_Loc]"
 LIT_beyond_the_baltic_desc: "[Root.Get_Beyond_Baltic_Focus_desc_Loc]"
 LIT_enforce_military_rule: "實行軍事統治"
 LIT_enforce_military_rule_desc: "立陶宛在爭取獨立的鬥爭中並非孤軍奮戰。拉脫維亞和愛沙尼亞同我們一道被相同的敵人包圍，但他們的政府缺乏為了保護人民不擇手段的骨氣。我們必須在整個波羅的海地區實行軍事統治。"
 LIT_expand_military_budget: "增加軍事預算"
 LIT_expand_military_budget_desc: "軍人們普遍抱怨其工資比起幹文職的公務員更低。隨著拉什蒂基斯出任國家總理，給軍隊劃撥所需預算的時機已經成熟。"
 LIT_exploit_the_international_bank: "利用國際銀行"
 LIT_exploit_the_international_bank_desc: "作為國際銀行理事會的一員，安塔納斯·斯梅托納能夠利用其位置在國際銀行中為國家謀得利益。如今戰爭迫在眉睫，我們還能有什麼別的選擇？"
 LIT_join_the_allies: "加入同盟國"
 LIT_join_the_allies_desc: "[Root.Get_Join_Allies_Focus_desc_Loc]"
 LIT_lithuanian_preservationism: "立陶宛保護主義"
 LIT_lithuanian_preservationism_desc: "立陶宛共和國是一個在探索前路的年輕國家。許多人認為立陶宛可能會被迫倒向產主義、法西斯主義或自由主義，但我們決不能屈服於這些外國勢力的影響。立陶宛應該走真正獨立自主的道路。"
 LIT_look_north: "[Root.Get_Look_North_Focus_Loc]"
 LIT_look_north_desc: "[Root.Get_Look_North_Focus_desc_Loc]"
 LIT_martial_law: "軍法管制"
 LIT_martial_law_desc: "自由是那些處於和平中的國家才能享受的奢侈品，而四面受敵的立陶宛根本就沒有機會這麼奢侈。"
 LIT_merge_the_military_and_civilian_governments: "軍民政府合併"
 LIT_merge_the_military_and_civilian_governments_desc: "軍隊和總統的分權一度非常有效，但斯梅托納很快就江郎才盡，顯出疲態。如今，只有把緊急處置權轉交給軍隊，才能確保立陶宛的持續安全。"
 LIT_peasants_reform: "農民改革"
 LIT_peasants_reform_desc: "農民是立陶宛最貧窮的群體，但卻創造了我國大部分經濟財富。當弗拉達斯·馬諾內斯出任首相併將關注點放在農業上，我們將能以使農民階層過上更好的生活。"
 LIT_presidential_reform: "[GetLithuanianPowerIdeaAdj]改革"
 LIT_presidential_reform_desc: "政黨政治長期以來使立陶宛混亂不堪，極大限制了[GetLithuanianLeaderTitle]權力。新任立陶宛[GetLithuanianLeaderTitle]必須凌駕於政黨紛爭之上，只忠於立陶宛母親。"
 LIT_restore_public_elections: "恢復公眾選舉"
 LIT_restore_public_elections_desc: "立陶宛的獨裁統治在前段時間十分有效，但如今隨著國家步入穩定，我們需要更多地聆聽人民的呼聲。我們一直在內部爭論所謂立陶宛究竟意味著什麼，但現如今，人民會告訴我們答案。"
 LIT_state_media: "國有媒體"
 LIT_state_media_desc: "出版的報紙中充斥著太多法西斯主義和共產主義的宣傳。廣大民眾應當被鼓勵去閱讀國家支持的出版物——這才是瞭解真相的可靠資料。"
 LIT_the_nation_and_its_power: "國家及其權力"
 LIT_the_nation_and_its_power_desc: "在議會中喋喋不休的爭吵毫無意義，只是阻礙了[GetLithuanianLeaderTitle]的權力。我們若要建立一個能夠自衛的國家，就必須授予[GetLithuanianLeaderTitle]絕對的權力。"
 LIT_the_nationalist_council: "國民議會"
 LIT_the_nationalist_council_desc: "儘管我們的總統已不再是任何黨派的成員，但是議會裡仍然像小屁孩似的吵個不休。要麼把他們拉去同[ROOT.GetRulingParty]合作，要麼就趕緊把這幫人解職了。"
 LIT_support_monarchism_in_POL: "支持波蘭君主制"
 LIT_support_monarchism_in_POL_desc: "和立陶宛一樣，波蘭也曾打算選舉國王，但卻沒能找到合適的王位候選人。我們可以給波蘭人一位他們一直以來期待的強大領袖——一位可以在德帝國主義面前保衛波蘭的國王。"
 LIT_king_of_poland: "波蘭王國"
 LIT_king_of_poland_desc: "時機已然成熟。波蘭民眾已被煽動去反對[POL.GetLeader]，而君主制支持者也準備好向政府提出訴求。在立陶宛人民的支持下，他們將見證由上帝揀選的[Root.GetLeader]成為他們的統治者。"
 LIT_arm_monarchist_militants: "武裝君主派民兵"
 LIT_arm_monarchist_militants_desc: "我們知道，許多鄰國的民眾希望[Root.GetLeader]給他們是國家帶來秩序與繁榮，就像[Root.GetLeader.GetSheHe]在我國所實現的那樣。我們必須把這些君主派武裝成民兵，讓他們為其正統君主之王位而戰。"
 LIT_POL_union: "重建波蘭-立陶宛聯邦"
 LIT_POL_union_desc: "隨著[Root.GetLeader]成為波蘭與立陶宛共的共主，剩下要做的就是將議會和眾議院重新合併，從此波蘭-立陶宛聯邦將浴火重生。"
 LIT_expand_lithuanian_shipyards: "擴建立陶宛造船廠"
 LIT_expand_lithuanian_shipyards_desc: "控制波蘭後，我們終於有機會大力發展海軍，並爭奪波羅的海霸權了。"
 LIT_lithuanian_rail: "波蘭-立陶宛鐵路"
 LIT_lithuanian_rail_desc: "如果波蘭和立陶宛真正地合二為一，在兩地之間通行也一定是會稀鬆平常。通過將兩地各自的鐵路聯結起來，我們將極大地改善我們的供應鏈狀況並提升工業能力。"
 LIT_push_for_ruthenia: "擴建魯塞尼亞鐵路"
 LIT_push_for_ruthenia_desc: "儘管烏克蘭和白俄羅斯的鐵路網不幸遭到忽視，但這部分領土同樣是聯邦的一部分。我們若要向蘇聯進軍並重新重奪失地，就必須投資加強東部鐵路的建設。"
 LIT_warsaw_to_crimea_railway: "華沙-克里米亞鐵路"
 LIT_warsaw_to_crimea_railway_desc: "在我們統治海間的宏偉藍圖之中，把各個領土加以整合的重要性不言而喻。我國的自然邊界南北縱深，東西相延。將克里米亞鏈入鐵路網的構想，必將落實我國對於該地區的掌控。"
 LIT_merge_the_arms_industries: "合併軍事工業"
 LIT_merge_the_arms_industries_desc: "數十年來，波蘭和立陶宛的軍火製造們始終分別獨立地運作著。現如今既然兩國已經合二為一，我們可以在工業體系中建立分工機制，並構建波蘭與立陶宛之間的工廠協作。"
 LIT_merge_civilian_industries: "合併民用工業"
 LIT_merge_civilian_industries_desc: "隨著兩國統一，讓立陶宛與波蘭仍然各自為政毫無意義。兩國工業必須為了一國聯邦的福祉而統合起來。"
 LIT_claim_livonia_monarchy: "宣稱利沃尼亞"
 LIT_claim_livonia_monarchy_desc: "波羅的海國家之間有一種牢不可破的同袍與同胞之情。既然我們有了一位國王，亦當肯定這種兄弟情誼乃是我等天授之權。"
 LIT_claim_greater_lithuania: "宣稱大立陶宛"
 LIT_claim_greater_lithuania_desc: "我們今天所知道的立陶宛僅僅是其前身——立陶宛大公國的殘垣斷壁罷了。這個聯邦不僅僅展現了波蘭和立陶宛的國家聯合，還應當是波蘭人、立陶宛人、烏克蘭人和白俄羅斯人的民族聯合。"
 LIT_greater_commonwealth: "大波蘭-立陶宛聯邦"
 LIT_greater_commonwealth_desc: "隨著波蘭-立陶宛聯邦浴火重生的野心並不止步於她曾經的邊境。波蘭人民心目中的聯邦是一個雄踞於海間的偉大多元文化帝國！"
 LIT_institute_royal_guards: "建立王室衛隊"
 LIT_institute_royal_guards_desc: "隨著君主登基，我們應當在立陶宛軍隊中遴選最為精銳之士，授之以保衛偉大君主人身安全的重任。此乃頭等大事，不得有誤。"
 LIT_a_king_for_our_people: "我們民族的國王"
 LIT_a_king_for_our_people_desc: "安塔納斯·斯梅托納無法獨自統治立陶宛。儘管許多人希望這位總統任命一位總理，但還有另外一個選項。卡爾·吉羅·馮·烏拉赫是明道加斯二世的合法子嗣，且隨著德國統治者不再享有立陶宛頭銜，將沒有什麼能阻止我們加冕我們的國王。"
 LIT_a_new_noble_class: "新貴族階級"
 LIT_a_new_noble_class_desc: "我們的國家已經被政客和寡頭統治地太久了。國王要想服務於立陶宛，他必須執掌一個由忠誠的貴族們組成的宮廷。"
 LIT_abolish_the_presidency: "廢除總統制"
 LIT_abolish_the_presidency_desc: "迄今為止，雖然斯梅托納仍然保持著對國家政權的控制，但隨著明道加斯三世支持率的提升，似乎廢除總統制政府並代之以國王的絕對統治才是明智之選。斯梅托納將被重新任命為首相，作為顧問為年輕的明道加斯三世效勞。"
 LIT_claim_prussia: "奪取東普魯士"
 LIT_claim_prussia_desc: "東普魯士居住著大量的立陶宛與波蘭少數族裔，這些同胞是時候該與[Root.GetNameDef]的同志團結在一起了。"
 #Shared Baltic
 BALTIC_rejoin_the_railways: "重連鐵路網"
 BALTIC_rejoin_the_railways_desc: "那些曾經染指過我們土地的俄國人和德國人認為，我國不過是片窮鄉僻壤，也就比荒地稍好一些。[ROOT.GetNonIdeologyName]將會從鐵路和基礎設施開始，迎來工業化的起步，直至完全發揮這片土地的潛力。"
 BALTIC_axis_investments: "尋求[GetBalticAxisInvesmentsAdj]投資"
 BALTIC_axis_investments_desc: "[GetBalticAxisInvesmentsDesc]"
 BALTIC_axis_investments_desc_ger: "德國的貿易港口沿著波羅的海分佈。雖然我們一度敵對，但毋庸置疑的是，來自軸心國的貿易與投資將會極大地促進[ROOT.GetNonIdeologyAdjective]的經濟。"
 BALTIC_axis_investments_desc_fasc_eur: "法西斯主義正在整個歐洲擴張。雖然有一些可以理解的保留意見，但毋庸置疑的是，來自法西斯國家的貿易與投資將會極大促進[ROOT.GetNonIdeologyAdjective]的經濟發展。"
 BALTIC_axis_investments_desc_fasc_int: "法西斯主義正在全世界擴張。雖然有一些可以理解的保留意見，但毋庸置疑的是，法西斯分子的貿易與投資將會極大促進[ROOT.GetNonIdeologyAdjective]的經濟發展。"
 BALTIC_axis_investments_desc_jap: "[JAP.GetName]已經證明了其經濟和軍事實力。儘管兩國並非比鄰，但毋庸置疑的是，來自[JAP.GetAdjective]的貿易和投資將會極大促進[ROOT.GetNonIdeologyAdjective]的經濟發展。"
 BALTIC_german_war_economics: "採用[GetBalticAxisInvesmentsAdj]戰時經濟"
 BALTIC_german_war_economics_desc: "[GetGermanWarEconomicsDesc]"
 BALTIC_german_war_economics_desc_default: "德國人正以在歐洲幾乎前所未見的方式與程度推動軍事工業化。我們應該努力加以效仿，並嘗試從德意志帝國銀行拿到投資。"
 BALTIC_german_war_economics_desc_alt: "我們的法西斯投資者正以我們幾乎前所未見的方式與手段推動軍事工業化。我們應該努力加以效仿，並嘗試從他們那裡拿到投資。"
 BALTIC_autobahn: "[Root.GetAdjective]高速公路"
 BALTIC_autobahn_desc: "如果基礎設施無法為不斷湧入的勞動力提供便利，[Root.GetNonIdeologyName]工業化會收效甚微。如果讓基建部門仿效德國同行，我們也許能夠讓他們達到應有的效率。"
 BALTIC_eastwall: "東牆"
 BALTIC_eastwall_desc: "德國人和我們一樣對來自東邊的威脅做足了預案，德國高層會非常明智地選擇加固他們的防線，更會投入大量精力在我們的防線上。"
 BALTIC_balticwall: "波羅的海壁壘"
 BALTIC_balticwall_desc: "如果我們的敵人選擇從海上發起進攻，那麼東部的防禦工事將變得毫無意義！我們也許無法擁有一支能與英國，德國，或是蘇聯匹敵的海軍，但我們能夠建立起讓他們束手無策的海岸防禦。"
 BALTIC_german_tank_licences: "[GetBalticAxisInvesmentsAdj]坦克生產許可"
 BALTIC_german_tank_licences_desc: "[GetGermanTankLicencesDesc]"
 BALTIC_german_tank_licences_desc_default: "德國的坦克已然證明了它們的能力，面對它們的突襲，敵軍分崩離析、一片混亂。要想在即將開戰的東部效仿這些閃擊戰術，[Root.GetNonIdeologyName]能夠提供巨大的幫助。"
 BALTIC_german_tank_licences_desc_alt: "我們法西斯盟友的坦克已然證明了它們的能力，面對它們的突襲，敵軍分崩離析、一片混亂。要想在即將開戰的東部效仿這些閃擊戰術，[Root.GetNonIdeologyName]能夠提供巨大的幫助。"
 BALTIC_german_baltic_industry: "軸心國-波羅的海工業"
 BALTIC_german_baltic_industry_desc: "[GetGermanBalticIndustryDesc]"
 BALTIC_german_baltic_industry_desc_default: "我國現在有著大量來自德國的投資。德國和[Root.GetNonIdeologyName]的私營部門幾乎沒有區別，許多公司同時為[Root.GetNonIdeologyAdjective]和德國人提供工作。"
 BALTIC_german_baltic_industry_desc_alt: "我國現在有著大量法西斯國家的投資。我們的法西斯投資者和[Root.GetNonIdeologyName]的私營部門幾乎沒有區別，許多公司同時為[Root.GetNonIdeologyAdjective]和他們的人民提供工作。"
 BALTIC_request_german_support: "請求[GetBalticAxisInvesmentsAdj]援助"
 BALTIC_request_german_support_desc: "[GetRequestGermanSupportDesc]"
 BALTIC_request_german_support_desc_default: "我們不及德國的工業能力，但也許我們能夠說服德國官員援助我們一些額外的庫存儲備，以便我國可以更好地防禦東方共產主義即將到來的威脅。"
 BALTIC_request_german_support_desc_alt: "我們不及法西斯援助國的工業能力，但也許我們能夠說服他們的官員援助我們一些額外的庫存儲備，以便我國可以更好地防禦東方共產主義即將到來的威脅。"
 BALTIC_renew_allied_trade: "[GetBalticRenewAlliedTradeTitle]"
 BALTIC_renew_allied_trade_default: "恢復與同盟國的貿易"
 BALTIC_renew_allied_trade_alt: "尋求外國投資"
 BALTIC_renew_allied_trade_desc: "[GetBalticRenewAlliedTradeDesc]"
 BALTIC_renew_allied_trade_desc_default: "自建國以來，我們一直高度依賴英國的貿易和軍事支持，現在放棄這些已由的幫助實屬魯莽。如果我們想再次從德國與俄羅斯的兩面夾擊中倖存下來，我們就必須吸引更多的盟國投資到我國。"
 BALTIC_renew_allied_trade_desc_allied: "自建國以來，我們一直高度依賴盟國的貿易和軍事支持，現在放棄這些已由的幫助實屬魯莽。如果我們想再次從德國與俄羅斯的兩面夾擊中倖存下來，我們就必須吸引更多的盟國投資到我國。"
 BALTIC_renew_allied_trade_desc_international: "自建國以來，我們一直高度依賴外國的貿易和軍事支持，現在放棄這些已由的幫助實屬魯莽。如果我們想再次從德國與俄羅斯的兩面夾擊中倖存下來，我們就必須吸引更多的外國投資到我國。"
 BALTIC_ford_motors: "[Root.Capital.GetName]福特工業"
 BALTIC_ford_motors_desc: "福特汽車長期以來為美國與其他盟國供應大量物美價廉的汽車。如果在[Root.Capital.GetName]建設福特工廠，我們既可以為軍隊提供充足的載具，也可以將其出口以賺取利潤。"
 BALTIC_crossley_motors: "[Root.Capital.GetName]克羅斯利汽車公司"
 BALTIC_crossley_motors_desc: "隨著外國投資在我國逐漸拓展業務並高效的生產汽車，我們或許可以和克羅斯利公司合作，開發我國的原創設計以供[Root.GetNonIdeologyAdjective]軍隊使用。"
 BALTIC_british_designers: "邀請英國設計商"
 BALTIC_british_designers_desc: "我們已經吃透了英國人的設計，成立[Root.Capital.GetName]克羅斯利汽車公司也被證明是明智的舉措。我們可以正式邀請英國設計商加入[Root.GetNonIdeologyAdjective]工程公司。"
 BALTIC_technology_sharing: "科技共享"
 BALTIC_technology_sharing_desc: "我們已經生產了很多友邦設計的武器裝備，通過研究他們的設計，我們可以將學到的用於改進[Root.GetNonIdeologyAdjective]自己的設計。"
 BALTIC_british_aircraft: "[GetBritAircraftManufTitle]"
 BALTIC_british_aircraft_default: "英國飛機工廠"
 BALTIC_british_aircraft_alt: "外國飛機工廠"
 BALTIC_british_aircraft_desc: "[GetBritAircraftManufDesc]"
 BALTIC_british_aircraft_desc_default: "目前，國產的飛機設計一直難當大任。空軍一直依賴於從德國和蘇聯手中繳獲飛機，但若我們想要生存下去，就必須開始自主的飛機生產，而英國空軍或許會是這一切的關鍵……"
 BALTIC_british_aircraft_desc_alt: "目前，國產的飛機設計一直難當大任。空軍一直依賴於從德國和蘇聯手中繳獲飛機，但若我們想要生存下去，就必須開始自主的飛機生產，而來自外國空軍的幫助或許會是這一切的關鍵……"
 BALTIC_allied_shipments: "增加同盟國航運"
 BALTIC_allied_shipments_desc: "自1918年以來，[Root.GetNonIdeologyAdjective]軍隊的裝備依賴於英國的大量援助，我們應該讓同盟國知道，如果他們不大幅度增加對我們的援助，[Root.GetNonIdeologyName]很有可能會變成另一個臣服於蘇聯的傀儡。"
 BALTIC_baltic_fleet: "波羅的海艦隊"
 BALTIC_baltic_fleet_desc: "儘管[Root.GetNonIdeologyAdjective]的艦隊在世界上並不起眼，但通過適當的投資，她們也許可以保護[Root.GetNonIdeologyName]免受任何來自海上的威脅。"
 BALTIC_attract_workers_to_capital: "吸引工人到[Root.Capital.GetName]"
 BALTIC_attract_workers_to_capital_desc: "[Root.GetNonIdeologyName]的工人們分散在全國各地，大量的工人在為落後的農業工作。如果我們想讓國家發展工業以應對戰爭，就必須將工人吸引到位於[Root.Capital.GetName]的工廠裡！"
 BALTIC_rebuild_forts: "重建[Root.Capital.GetName]要塞"
 BALTIC_rebuild_forts_desc: "在獨立戰爭期間，[Root.Capital.GetName]更像是一座要塞而不是城市。即使其中的防禦工事大多已被拆除與塵封，但我們必須重建它們以應對戰爭的威脅。"
 BALTIC_arm_the_nation: "武裝全國"
 BALTIC_arm_the_nation_desc: "全[Root.GetNonIdeologyName]人民都準備好面對蘇聯即將到來的入侵，但是我們缺少相應的裝備。為了飛速生產步兵裝備，我們必須準備好我們的軍用工廠。"
 BALTIC_unchain_education: "開放教育"
 BALTIC_unchain_education_desc: "[Root.GetNonIdeologyAdjective]教育系統一直以來都被分散的人口中心所限制，但如今，隨著鄉村的農民們移居得離城市更近了，我們就可以有更高的效率去教育[Root.GetNonIdeologyAdjective]青年。"
 BALTIC_defence_of_our_nation: "保家衛國"
 BALTIC_defence_of_our_nation_desc: "民用工廠對於我們的國防來說和軍用工廠一樣重要。機器持續的轟鳴聲將響徹[Root.GetNonIdeologyName]，因為愛國群眾在完成實現祖國工業化的使命。"
 BALTIC_modernize_industry: "工業現代化"
 BALTIC_modernize_industry_desc: "長期以來，[Root.GetNonIdeologyName]的出口貿易僅限於農業。如果我們想讓[Root.GetNonIdeologyName]發展出現代經濟，我們就必須將工業集中在各個地區的主要城市中。"
 BALTIC_domestic_motors: "國產汽車公司"
 BALTIC_domestic_motors_desc: "外國的設計固然很好，但我們不能永遠依賴他們。[Root.GetNonIdeologyName]是個自豪的國度，我們必須向世界證明我們的設計師和思想家絲毫不遜色於西方。"
 BALTIC_school_of_aviation: "波羅的海航空學院"
 BALTIC_school_of_aviation_tech_bonus: "航空學院"
 BALTIC_school_of_aviation_desc: "在獨立戰爭期間，英國保衛了我們的天空和海洋，但近來英國對納粹讓步讓我們不得不懷疑他們是否會再次保衛我們，我們必須自己保衛我們的天空！"
 BALTIC_original_designs: "原創設計"
 BALTIC_original_designs_desc: "自1918年建國以來，[Root.GetNonIdeologyName]軍隊的裝備高度依賴英國，但這一切必須被改變。我們必須擺脫對英國人的依賴，並開始製造[Root.GetNonIdeologyAdjective]自主研發的武器。"
 BALTIC_arms_industry: "完成戰備"
 BALTIC_arms_industry_desc: "現在，我們的工業現代化已經實現，國內運作著無數的軍工產業，[Root.GetAdjective]的軍工機構終於可以發揮它真正的潛力了！"
 BALTIC_natural_resources: "開發自然資源"
 BALTIC_natural_resources_desc: "[Root.GetNaturaResource_BAL]讓我們從蘇聯、盟國以及波羅的海同胞的貿易中獲得了財富，我們最好通過在全國範圍內投資[Root.GetExtraction_BAL]來為這一行業賺的更多!"
 BALTIC_trade_with_neighbors: "與鄰互市"
 BALTIC_trade_with_neighbors_desc: "每當我們向與德國或蘇聯的貿易投資時，我們都是在加重未來的劫難。我們不能允許吃著立陶宛的穀物做成的口糧，開著拉脫維亞的鋼鐵製成的，裡面加著愛沙尼亞的油的坦克的軍隊侵略[Root.GetNonIdeologyName]。相反，我們必須相互幫助來打敗共同的敵人。"
 BALTIC_invest_in_baltic_trade: "投資波羅的海貿易"
 BALTIC_invest_in_baltic_trade_desc: "往來於斯堪的納維亞、德國和俄國之間的波羅的海貿易發達，而我們的港口幾乎無法滿足貿易需求。我們必須與共享這片海洋的朋友們建立新的貿易航線來建設更美好更富饒的[Root.GetNonIdeologyName]！"
 BALTIC_restore_workers_republic: "重建工人共和國"
 BALTIC_restore_workers_republic_desc: "在我們爭取獨立的鬥爭中，蘇聯幫助創建了一個[Root.GetAdjective]工人共和國。儘管共和國失敗了，他的領導者們依舊活動在[Root.GetNameDef]和[SOV.GetNameDef]，因此工人共和國的希望沒有消失！"
 BALTIC_seek_support_of_soviets: "尋求蘇聯支持"
 BALTIC_seek_support_of_soviets_desc: "儘管紅軍摧毀了[Root.GetNameDef]並將我們的國家帶入了新的俄羅斯帝國主義時代，可是沒有他們的幫助我們是無法將社會主義帶到[Root.GetNameDef]的。"
 BALTIC_soviet_equipment: "蘇聯裝備"
 BALTIC_soviet_equipment_desc: "如果不首先獲得武裝我們民兵所需的武器和彈藥，我們推翻政府將遙遙無期。如果舊政府試圖阻止革命，我們可以向蘇聯提出援助，這會使我們獲得額外的武器來支援我們的軍隊。"
 BALTIC_soviet_volunteer_forces: "蘇聯志願軍"
 BALTIC_soviet_volunteer_forces_desc: "蘇聯實際上有很多願意為世界革命戰鬥犧牲的人。雖然[Root.GetNameDef]只是共產主義偉大斗爭的一小部分，但也不乏勇敢的俄羅斯社會主義信徒準備為我們的事業而犧牲。"
 BALTIC_soviet_military_staff: "蘇聯軍事參謀"
 BALTIC_soviet_military_staff_desc: "在[Root.GetAdjective]工人共和國被解散之後，我們的軍官大量流亡到了蘇聯。現在是時候帶他們回家了。"
 BALTIC_communist_opposition: "吸納反對派"
 BALTIC_communist_opposition_desc: "蘇聯的表現證明其並非[Root.GetNameDef]的朋友，也不是人民的朋友，把[Root.GetNameDef]的命運交給那些只想著掠奪[Root.GetAdjective]的紅軍禿鷲，簡直是蠢到家了。他們比資本家更加惡劣，[Root.GetCommunistParty]若想要走向光輝的未來，就必須自力更生！"
 BALTIC_forment_disloyalty: "團結反對派"
 BALTIC_forment_disloyalty_desc: "[Root.GetAdjective]政府已經內憂外患，如果我們要推翻目前困擾[Root.GetNameDef]的暴政，我們必須聯合所有反對[Root.GetNeutralParty]的聲音!"
 BALTIC_concessions_for_catholics: "對天主教讓步"
 BALTIC_concessions_for_catholics_desc: "在第一工人共和國時期，大多數[Root.GetNameDef]的底層民眾都是虔誠的天主教徒，而蘇聯紅軍卻無情地鎮壓了他們的宗教活動。這招致許多[Root.GetNameDef]的窮苦人民反對革命，現今，如果我們想要真正變成一個人民當家做主的共和國，毫無疑問，天主教徒的信仰是必須受到保護的。"
 BALTIC_secure_military_support: "確保軍隊支持"
 BALTIC_secure_military_support_desc: "軍隊中很多人都在嘗試讓自己的國家擺脫[Root.GetLeader]的領導，而我們要做的就是和他們展開接觸。成為人民英雄的承諾將會吸引追求榮譽與名望的將軍支持我們的事業。"
 BALTIC_overthrow_the_government: "推翻[Root.GetNeutralParty]"
 BALTIC_overthrow_the_government_desc: "現在，已經有足夠的支持者加入到了推翻[Root.GetLeader]以及[Root.GetLeader.GetHerHis]政權的隊伍當中！我們要做的就只剩下挺進首都，宣佈一個嶄新的工人共和國成立！"
 BALTIC_sieze_the_means_of_production: "奪取生產資料"
 BALTIC_sieze_the_means_of_production_desc: "舊政府邀請海外投資者來剝削[Root.GetAdjective]的工人。我們不能繼續讓無產階級為這些外國資本家服務，所有跨國公司建造的工廠必須劃入[Root.GetNameDef]的管控。"
 BALTIC_revolutionary_cabinet: "革命內閣"
 BALTIC_revolutionary_cabinet_desc: "既然我們現在重新成為了底層階級堅定的哨兵，那我們便需要重組一個與新政權的意識形態一致的內閣。"
 BALTIC_direct_intervention: "蘇聯直接干預"
 BALTIC_direct_intervention_desc: "我們已經嘗試過了，但憑我們自己無力奪回國家控制權，必須在我們鬥爭的同時依靠我們盟友[SOV.GetNameDef]的幫助。"
 BALTIC_squash_resistance: "粉碎一切抵抗"
 BALTIC_squash_resistance_desc: "仍然有人相信社會主義是[Root.GetAdjective]主權的敵人，如果我們要繼續革命就必須根除這些人。"
 BALTIC_purge_of_our_own: "清洗國內"
 BALTIC_purge_of_our_own_desc: "儘管我們竭盡全力粉碎一切抵抗勢力，但敵人仍在暗處密謀組織對抗無產階級，試圖在[Root.GetNonIdeologyName]重新建立資產階級獨裁統治。我們必須開展一次大規模的肅清運動，根除那些舊統治階層以及他們的支持者。"
 BALTIC_crush_forest_brothers: "鎮壓森林兄弟"
 BALTIC_crush_forest_brothers_desc: "自從我們掌權以來，森林兄弟運動長久以來都是國家的蛀蟲。他們破壞我們的工業和鐵路，並干擾政府的官方宣傳。我們必須挺進[Root.GetNonIdeologyName]的密林之中並將這些被蠱惑的人連根拔除。"
 BALTIC_red_army: "[Root.GetAdjective]紅軍"
 BALTIC_red_army_desc: "我國軍隊必須被打造成自願保衛[Root.GetNameDef]社會主義的部隊，並向世界人民傳播社會主義。這一目標只能通過重建[Root.GetAdjective]紅軍來完成。"
 BALTIC_align_paramilitarists: "重整準軍事部隊"
 BALTIC_align_paramilitarists_desc: "在[Root.GetNameDef]境內有多個準軍事組織，而他們的目標大多是保護[Root.GetAdjective]的自決權。雖然這一目標值得肯定，但我們希望這些組織能夠把我們看作[Root.GetAdjective]政府的合理繼承者，而不是[SOV.GetAdjective]的傀儡。"
 BALTIC_influence_neighbours: "影響鄰國"
 BALTIC_influence_neighbours_desc: "雖然建立自由的社會主義波羅的海國家的願景不再像獨立戰爭之前那樣受人追捧，但這一願景和波羅的海民族自決的願景一樣古老。我們的政權是那些被獨裁暴政壓迫過的人民的政權，而我們可以將其化作能兵不血刃地向鄰國輸出革命的武器。"
 BALTIC_arm_baltic_reds: "武裝波羅的海紅軍"
 BALTIC_arm_baltic_reds_desc: "舞臺已經搭建完畢，共產主義的烈火正在波羅的海地區熊熊燃燒。只要我們提供物資，一聲令下，波羅的海的共產主義者們就會發動革命！"
 BALTIC_belarus_ssr: "[Root.GetNonIdeologyName]-白俄羅斯蘇維埃"
 BALTIC_belarus_ssr_desc: "白俄羅斯和波羅的海地區統一的願景並不是聞所未聞的。很久以前的立陶宛-白俄羅斯蘇維埃社會主義共和國就是兩個看似涇渭分明的民族間和諧的交融。社會主義無視文化和語言的界限，而[Root.GetAdjective]和白俄羅斯的工人也無疑可以和諧共處。"
 BALTIC_end_bourgeouis_dictatorships: "結束資產階級專政"
 BALTIC_end_bourgeouis_dictatorships_desc: "波羅的海國家現在正在被所謂的“中立”獨裁者們統治。這些獨裁者無視人民的意願，靠著軍隊的支持實行對無產階級們的壓迫。只有解放[Root.GetAdjective]工人的雙手，他們才能打破彼此之間的隔閡，將光榮的解放傳遞下去。"
 BALTIC_focus_on_the_interior: "專注國內"
 BALTIC_focus_on_the_interior_desc: "儘管許多工人迫切地希望進軍我們的鄰國，把我們引以為傲的革命事業惠及所有波羅的海人民，但是我們現今必須放眼國內，穩固革命成果，保衛當下政權。"
 BALTIC_focus_on_the_interior_2: "準備對抗德國"
 BALTIC_focus_on_the_interior_2_desc: "我們絕對不能忘記多年以前自由軍團帶給[Root.GetNameDef]的慘烈災難，當時的農民和工人們像牲畜一樣被屠殺，村莊被夷為滿目瘡痍的平地。我們絕對不能讓[Root.GetAdjective]人民再次受到那樣殘忍的欺凌！"
 BALTIC_united_baltic_ssr: "統一的波羅的海蘇維埃"
 BALTIC_united_baltic_ssr_desc: "儘管文化、語言和民族各不相同，但波羅的海三國之間依然有著血濃於水的兄弟情誼和同甘共苦的革命友誼。我們必須承認：三國不僅是革命同志，也是[Root.GetAdjective]的不可或缺的一份子。波羅的海國家若不能成為同一個工人共和國，蒙受損失的就將是工人階級。"
 BALTIC_western_revolution: "向西輸出革命"
 BALTIC_western_revolution_desc: "革命並非止步于波羅的海，幾乎全歐的下層階級被奴役在工廠裡，被資本主義的鋼靴踩在腳底下。只有[Root.GetAdjective]工人才能解放他們。"
 BALTIC_finnish_invasion: "入侵芬蘭"
 BALTIC_finnish_invasion_desc: "芬蘭對我們來說是迷失並束縛在資本主義枷鎖中的兄弟。只有通過暴力革命，芬蘭才能像波羅的海國家一樣獲得自由。"
 BALTIC_path_to_the_north_sea: "北海之路"
 BALTIC_path_to_the_north_sea_desc: "丹麥人依然在不斷升級的國際衝突中保持可悲地中立，而丹麥海峽則是社會主義陣營通向北海的唯一途徑。"
 BALTIC_end_swedish_neutrality: "終結瑞典中立"
 BALTIC_end_swedish_neutrality_desc: "瑞典驢所謂的中立不過是軟弱的自欺欺人，只是屈服於任何一時的強權，幾乎從不考慮國外下層階級的福祉問題。這樣一個意志薄弱的政府不配當我們的鄰國，必須建立一個挺直脊梁骨的新瑞典來保護其人民不受暴政侵害。"
 BALTIC_free_the_workers_of_poland: "解放波蘭工人"
 BALTIC_free_the_workers_of_poland_desc: "雖然波蘭人曾經統治過波羅的海，但他們現在正生活在水深火熱的[GER.GetNameDef]的殘暴政權之中。我們必須保衛我們南方的同志們並幫助他們團結地建立一個波蘭社會主義共和國！"
 #Baltic Entente
 LIT_baltic_economic_union: "波羅的海經濟聯盟"
 LIT_baltic_economic_union_desc: "自由與民主已經回到了我們的國家，且我們正在與鄰國建立更緊密的外交關係，以建立一個涵蓋波羅的海國家的經濟聯盟。儘管自己的經濟實力尚且弱小，但我們團結的力量將不容忽視。"
 LIT_baltic_defence_army: "波羅的海防衛軍"
 LIT_baltic_defence_army_desc: "我們的軍隊在一起協作，但本質上還是獨立的實體。隨著我們國家之間的聯繫日益緊密，我們也許可以建設一支波羅的海聯合武裝部隊，這支部隊不受任何國家的單獨控制，它將為整個波羅的海聯盟而戰。"
 LIT_pan_baltic_bank: "泛波羅的海銀行"
 LIT_pan_baltic_bank_desc: "隨著經濟聯盟的建立，我們也許可以建立泛波羅的海銀行併發行通用的貨幣。"
 LIT_propose_baltic_union: "提議成立波羅的海聯盟"
 LIT_propose_baltic_union_desc: "隨著我們國家的各個實體之間的聯繫日漸緊密，似乎建立一個正式的波羅的海聯盟已經迫在眉睫。聯盟將賦予每一個成員國投票權與否決權，並將我們的國家更加緊密的團結在一起。"
 LIT_baltic_stronger_together: "聯合而獨立"
 LIT_baltic_stronger_together_desc: "波羅的海國家長期以來義結金蘭、肝膽相照，但我們一直被邊境和政治所分隔。我們為了捍衛獨立在外交上團結一心，我們也必須為了朋友而奮戰到底，並建設波羅的海聯合武裝部隊！"
 LIT_baltic_unification: "實現波羅的國家統一"
 LIT_baltic_unification_desc: "波羅的國家長期以來義結金蘭、肝膽相照，但我們一直被邊境和政治所分隔。儘管我們有著強烈的獨立性，但為了生存而奮戰的信念將我們團結到一起。也許是時候讓波羅的海同盟轉變為一個統一的國家了。"
 LAT_baltic_economic_union: "波羅的海經濟聯盟"
 LAT_baltic_economic_union_desc: "自由與民主已經回到了我們的國家，且我們正在與鄰國建立更緊密的外交關係，以建立一個涵蓋波羅的海國家的經濟聯盟。儘管自己的經濟實力尚且弱小，但我們團結的力量將不容忽視。"
 LAT_baltic_defence_army: "波羅的海防衛軍"
 LAT_baltic_defence_army_desc: "我們的軍隊在一起協作，但本質上還是獨立的實體。隨著我們國家之間的聯繫日益緊密，我們也許可以建設一支波羅的海聯合武裝部隊，這支部隊不受任何國家的單獨控制，它將為整個波羅的海聯盟而戰。"
 LAT_pan_baltic_bank: "泛波羅的海銀行"
 LAT_pan_baltic_bank_desc: "隨著經濟聯盟的建立，我們也許可以建立泛波羅的海銀行併發行通用的貨幣。"
 LAT_propose_baltic_union: "提議成立波羅的海聯盟"
 LAT_propose_baltic_union_desc: "隨著我們國家的各個實體之間的聯繫日漸緊密，似乎建立一個正式的波羅的海聯盟已經迫在眉睫。聯盟將賦予每一個成員國投票權與否決權，並將我們的國家更加緊密的團結在一起。"
 LAT_baltic_stronger_together: "聯合而獨立"
 LAT_baltic_stronger_together_desc: "波羅的海國家長期以來義結金蘭、肝膽相照，但我們一直被邊境和政治所分隔。我們為了捍衛獨立在外交上團結一心，我們也必須為了朋友而奮戰到底，並建設波羅的海聯合武裝部隊！"
