 SPA_awaiting_the_rebellion: "靜待起義"
 SPA_awaiting_the_rebellion_desc: "我們已經詳細制定了政變計劃，現已做好了萬全的準備。然而為了避免重蹈1932年桑胡爾霍起義失敗的覆轍，我們將靜待到民意支持足夠的時候再動手，以免屆時被輕而易舉地趕下臺。"
 SPA_carlism: "卡洛斯派"
 SPA_carlism_desc: "費迪南德七世國王在1830年發佈了國事詔書，將其女兒立為儲君，即未來的伊莎貝拉二世。國王的弟弟卡洛斯親王因此從繼承順位中除名。在國王逝世後，卡洛斯親王的支持者發動了一系列內戰，團結在卡洛斯主義的旗幟下為恢復薩利克繼承法而奮鬥。\n\n一個世紀以後，卡洛斯主義運動仍然非常活躍，其支持者組成的民兵組織（稱作呼嘯兵）一直在接受訓練，以備他們再次保衛基督徒並擁護真命天子歸位。"
 SPR_government_power_struggle: "政府權鬥"
 SPR_government_power_struggle_desc: "儘管最近的大選獲得了勝利，但左翼陣營各派別已經為了奪取新政府的主導權而爭得四分五裂。由於總統和左翼各派間的各種矛盾日趨緊張，總統辦公室甚至遭到了針對性的攻訐。渴望權力的政客們正如群狼般環伺在總統寶座的周圍。"
 SPR_death_before_surrender: "寧死不屈"
 SPR_political_violence: "政治暴力"
 SPR_political_violence_desc: "西班牙政治是兩極分化和暴力的舞臺。距離上一次大規模暴動——阿斯圖里亞斯礦工罷工才僅僅過去兩年，當前的政治氣候似乎已經又具備了滋生一場規模更大且範圍更廣的全新暴動的所有條件。即將到來的選舉似乎也不太可能終止這場社會動盪的惡性循環。"
 SPR_national_strikes: "全國罷工"
 SPR_national_strikes_desc: "這個國家似乎正處於工人革命的早期階段，此起彼伏的罷工導致工業生產乃至日常生活瀕臨癱瘓。工人要求減少勞動時間且獲得更多的報酬，貧窮佃農不斷侵佔著國家的耕地。而對於這一切，政府卻都視而不見。"
