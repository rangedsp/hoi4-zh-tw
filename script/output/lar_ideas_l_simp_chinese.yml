 FRA_full_employment: "充分就業"
 FRA_full_employment_desc: "我們有令人生羨的高就業率，這要部分歸功於血流成河的一戰。然而，這也造成了公司缺少技術工人，軍隊因難以與勞動力市場競爭而缺乏補員。擴大徵兵只會使問題更加嚴重，我們應該設法從其它途徑獲得人力來彌補我們在軍隊動員和經濟發展上的缺口。"
 FRA_worker_shortage: "勞工短缺"
 FRA_worker_shortage_desc: "軍事需求得以凌駕於勞動力短缺之上。目前許多企業報告，技術工人的缺失已經開始影響正常生產與足額產出。放寬徵召法案可以使青壯年回到工廠，但不能解決根本問題。"
 FRA_inefficient_economy_1: "低效的經濟"
 FRA_inefficient_economy_1_desc: "法國雖然仍是主要工業國，但在產能集中這一項上已落後於世界。為了使我國經濟在全球範圍內上更具競爭力，我們需要進行大刀闊斧的改革。"
 FRA_political_violence: "政治暴力"
 FRA_political_violence_desc: "共產主義者和極右翼極端主義聯盟時刻準備著藉助武力來完成政治目標。"
