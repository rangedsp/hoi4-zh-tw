 UNITS_VIEW_BTN_DRAW_OFFENCE: "§H進攻線§!\n§G右鍵點擊並按住§!在地圖上繪製§Y進攻線§!。\n只能在你已經分配§H前線§!或§H登陸作戰§!的領土繪製進攻線。\n\n被分配至帶有一個進攻線的計劃的部隊會嘗試攻佔領土並將他們的前線推進到那裡。\n\n§G按住鼠標§!之後在執行方針按鈕上§G鬆開§!可以改變命令執行類型"
 UNITS_VIEW_BTN_DRAW_DEFENCE: "§H前線§!\n - §G點擊§!一條與其他國家接壤的邊界可將整個邊界全部設置為前線。\n - §G右鍵點擊並拖動鼠標§!在與其他國家接壤的邊界上可將邊界的一部分設置為前線。\n - §G右鍵點擊並拖動§!已有前線的端點可以進行編輯。\n\n前線是向著進攻線入侵敵軍區域的起始點，另外還可以幫助你在國境線上快速部署單位。"
 UNITS_VIEW_BTN_DRAW_DEFENCE_ARMY_GROUP: "§H前線§!\n - §G點擊§!一條與其他國家接壤的邊界可將整個邊界全部設置為前線。\n - §GShift+點擊§!一條與其他國家接壤的邊界可將整個邊界全部設置為前線，同時不影響下屬集團軍的前線。\n - §G右鍵點擊並拖動鼠標§!在與其他國家接壤的邊界上可將邊界的一部分設置為前線。\n - §GShift+右鍵點擊並拖動鼠標§!在與其他國家接壤的邊界上可將邊界的一部分設置為前線，同時不影響下屬集團軍的前線。\n - §G右鍵點擊並拖動§!已有前線的端點可以進行編輯。\n\n前線是向著進攻線入侵敵軍區域的起始點，另外還可以幫助你在國境線上快速部署單位。"
 UNITS_VIEW_BTN_DRAW_FALLBACK: "§H防禦線§!\n - §G右鍵點擊並拖動鼠標§!在友方地區以繪製§Y僅用於§!防禦的命令。\n\n防禦線便於部署防禦單位，比如說在河流的對岸或其他友好區域。"
 UNITS_VIEW_BTN_AREA_DEFENSE: "§H區域防衛§!\n - §G點擊§!地區以從指令中添加或移除它們。\n擁有這個指令的部隊無法同時擁有其他類型的指令。\n\n一個單位分配給擁有這個指令的部隊後將分散在指定地區並防禦重要的城市、港口或其他目標，同時處理小規模的敵軍。"
 UNITS_VIEW_BTN_DRAW_NAVAL_INV: "§H登陸作戰指令§!\n第一步，§G點擊§!一個高亮省份以設置出發點。\n第二步，§G右鍵點擊§!需要的海岸省份以登陸。\n一旦計劃激活，登陸行動將開始準備並在儲備中預留所需的運輸船。"
 UNITS_VIEW_BTN_DRAW_PARADROP: "§H傘兵指令§!\n第一步，§G點擊§!我方的空軍基地以設置起飛點。該空軍基地必須擁有可用的運輸機。\n第二步，§G右鍵點擊§!當地運輸機航程內的省份以確定降落點。\n§g請記住僅有攜帶傘兵裝備的單位可以登上運輸機。§!"
