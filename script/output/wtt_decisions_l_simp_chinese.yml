 demob_manpower_mission: "放寬徵兵制度"
 demobilization_desc: "戰爭的威脅似乎還很遙遠，人們不願再忍受嚴苛的戰時法律。我們需要重新審視當前政策，並在局勢升級之前做出改變，以安撫抗議者。"
 demobilization_economic_desc: "戰爭的威脅似乎還很遙遠，人們不願再忍受嚴苛的戰時經濟。我們應該重新審視當前政策，並考慮予以調整，生產更多消費品以滿足人民的需求。"
 draft_dodging_mission: "解決逃服兵役危機"
 draft_dodging_mission_desc: "除非迅速解決，否則拒服兵役的問題只會惡化，甚至可能導致人們對政府本身權威的質疑。"
