 GER_reichskommissariats: "專員轄區"
 GER_reichskommissariats_desc: "隨著新領土的佔領而來的是抵抗和有效管理的需求。因此，帝國部長阿爾弗雷德·羅森堡提出建立他稱之為“專員轄區”的特別佔領政權，這將有助於在更地方化的層面上控制當地人口，並且相比常規部隊，能夠更有效地處理抵抗戰鬥人員。"
