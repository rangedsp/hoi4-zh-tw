 GER_aid_hun_democratic_civil_war: "干涉匈牙利內戰"
 GER_aid_rom_democratic_civil_war: "干涉羅馬尼亞內戰"
 GER_austro_hungarian_empire: "奧匈帝國"
 GER_mefo_bills_category: "梅福券"
 GER_mefo_bills_category_desc: "為了在英法兩國眼皮底下秘密投資發展我國擴張的軍事工業，我們不得不通過賬外實體本票的形式來運作資金。如果不動用政治關係來延長這些本票的期限，那麼屆時我們將被迫對其進行承兌，且將所賺的紅利損失殆盡。"
 GER_mefo_bills_mission: "梅福券到期"
 GER_can_delay_mefo_payment: "可以延遲償付梅福券。"
 GER_mefo_bills_mission_desc: "我們此前發行的債券就要到期了，必須決定是延期償付還是即刻兌現。"
 GER_extend_mefo_bills: "梅福券"
 GER_extend_mefo_bills_desc: "延長3個月的梅福券償付期，使我們可以在這段時間內繼續享受其加成。然而，此舉同樣也會增加我們最終償付時的花費。"
 GER_extend_mefo_bills_tt: "決定延長§Y梅福券§!或是即刻償付。\n"
 GER_mefo_bills_mission_tt: "延長6個月的§Y梅福券§!償付期，在當前批次梅福券到期後進而生效。\n\n每批次的延期花費會逐步提高，當戰爭爆發時，梅福券的效果將會被移除，而對其的償付則將推遲到終戰和談之後。\n\n"
 GER_mefo_bills_effect_in_days: "下列情況將在[?Root.days_mission_timeout@GER_mefo_bills_mission|H0]日後發生：\n"
 GER_mefo_bills_extension_timer: "在梅福券到期前。"
 GER_mefo_bills_extension: "自上次梅福券延期後尚不滿60日。"
 GER_mefo_bills_extended: "梅福券延期"
 GER_renew_mefos: "再延期梅福券"
 GER_renew_mefos_desc: "帝國銀行對於重振我國經濟和軍事而言至關重要，此前兌付梅福券顯然是給錯誤的決定，我們應當再延長梅福券幾個月的支付期限。"
 GER_cancel_mefos: "取消梅福券"
 GER_cancel_mefos_desc: "長期以來，我們十分依賴帝國銀行來重建本國軍工。是時候和我國的軍事製造商們兌現承諾，並結束“梅福券”這個障眼法了。"
 GER_case_anton_category: "安東行動"
 GER_case_anton_category_desc: "原本，組建維希法國的背後之意在於確保法屬殖民地及海軍艦隊不落入盟軍之手，然而，這也是我們可以隨時宣告作廢的決議。我們已經制定了強制接管維希法國領土的計劃，屆時，也會對維希法國海軍停泊的土倫軍港展開閃電突襲。"
 GER_case_anton: "執行安東行動"
 GER_case_anton_tt2: "未控制法國在北非的大部分地區。"
 GER_case_anton_desc: "鑑於在法國的傀儡政權已經失去了其存在的意義，我們會即刻開始將其整合進[Root.GetName]的領土。此外，若是行動足夠迅速，我們甚至還能接管殘餘的法國海軍艦隊。"
 GER_case_anton_tt: "在7日的期限內吞併維希法國並奪佔法國海軍艦隊。\n\n§R除非德軍部隊能在2日內開抵土倫，否則法國方面將會自沉其艦隊！§!\n"
 GER_case_red: "紅色方案"
 GER_operation_marita: "瑪麗塔行動"
 political_actions: "政治行動"
 ban_fascist_party: "查禁法西斯黨派"
 ban_fascist_party_desc: "鑑於當前的局勢，繼續允許法西斯黨派活動勢必對我方的執政造成影響，必須對其採取嚴厲的措施。"
 ban_fascist_party_tt: "改變法西斯主義黨派支持率：§G-§![?.Root.party_popularity@fascism|%0G]。\n"
 ban_democratic_party: "查禁民主黨派"
 ban_democratic_party_desc: "長久以來活躍於政壇中心的那些黨派對政府而言猶如芒刺在背，他們對“個人權利”的追求勢必會破壞我們為全體民眾建設更美好國家的努力。"
 ban_democratic_party_tt: "改變民主主義黨派支持率：§G-§![?.Root.party_popularity@democratic|%0G]。\n"
 ban_communist_party: "查禁共產黨派"
 ban_communist_party_desc: "共產黨每次都跳出來反對政府，到處散播不滿情緒讓我們難以執政，是時候對其重拳出擊了。"
 ban_communist_party_tt: "改變共產主義黨派支持率：§G-§![?.Root.party_popularity@communism|%0G]。\n"
 ban_neutrality_party_tt: "中立主義支持率變化：§G-§![?.Root.party_popularity@neutrality|%0G]。\n"
