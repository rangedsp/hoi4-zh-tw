 improved_worker_conditions_desc: "工廠中的勞作不僅辛苦，而且還充斥著許多危險。改善工廠作業人員的工作環境儘管會在短期內降低產出，但是從長遠收益來看是值得的。"
 promises_of_peace: "承諾和平"
 promises_of_peace_desc: "歷史已經告誡了今人戰爭的可怖，我們決不能再重蹈前人的覆轍，和平與繁榮應於我國長存。"
 refuse_the_tribute: "拒絕納貢"
 refuse_the_tribute_desc: "蘇聯的苛刻要求正在榨乾我國，決不能縱容這群所謂的“同志”如此放肆。"
