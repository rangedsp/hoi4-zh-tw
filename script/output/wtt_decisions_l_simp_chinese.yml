 reinstate_wilhelm_iv_succession_rights: "恢復威廉王子繼承權"
 reinstate_wilhelm_iv_succession_rights_desc: "德皇威廉三世之子此前由於在結婚事宜上違背家族領袖威廉二世的意志，而被迫放棄了其繼承權。但隨著如今威廉三世已然登基，他或許可以向其流亡中的父皇施壓，以解除此項懲罰。"
 reinstate_wilhelm_iv_succession_rights_tt: "繼承順位得到改變。\n"
 modernize_the_succession_laws: "繼承法現代化"
 modernize_the_succession_laws_desc: "現任德皇之子——即將來的威廉四世，膝下僅有兩個女兒。為了確保繼承順位的秩序，我們必須實現繼承法的與時俱進，以便有朝一日，費莉西塔斯公主殿下能夠繼承大統。"
 modernize_the_succession_laws_tt: "女性將可以繼承皇位。\n"
 request_restoration_of_british_titles: "申請恢復在英爵銜"
 request_restoration_of_british_titles_desc: "由於上次大戰的關係，英國議會於1917年時表決廢除了德國皇室乃至各諸侯家族在英國的爵位和頭銜，然而時局更迭，兩國目前已是親密無間的盟友，也許是時候向英方申請廢除此項決議了。"
 hindenburg_destroyed_tt: "興登堡號§Y沒有§!墜毀。\n"
 request_restoration_of_british_titles_tt: "這無疑將會帶來空前的結果……\n"
 GER_request_polish_war_participation: "要求波蘭參戰"
 GER_request_polish_war_participation_desc: "我國如今正和[SOV.GetName]交戰，軍隊需要借道[POL.GetAdjective]的領土奔赴前線，鑑於我們此前曾承諾對其予以庇護，那麼要求他們參戰自然也是理所應當。"
 GER_reform_austro_hungarian_empire: "重組奧匈帝國"
 GER_reform_austro_hungarian_empire_tt: "要求奧匈帝國的諸繼業國聯合起來重建帝國。\n§R如果上述國家接受，你將會捲入其身處的所有戰爭！§!\n"
 GER_reformed_austro_hungarian_empire: "重組奧匈帝國"
 GER_barbarossa_mission: "第21號元首令"
 emergency_factory_conversion_defensive: "緊急工廠轉換"
 emergency_factory_conversion_defensive_desc: "前線急需更多裝備，我們必須轉換更多的工廠來製造武器，以此保衛我們的國家。"
 emergency_factory_conversion_offensive: "緊急工廠轉換"
 emergency_factory_conversion_offensive_desc: "我軍急需更多裝備，我們必須轉換更多的工廠來製造武器，以此贏得戰爭。"
 demolish_enemy_fortifications: "爆破敵方防禦工事"
 dismantle_maginot: "拆除馬奇諾防線"
 propaganda_efforts: "宣傳活動"
 war_propaganda: "戰爭宣傳"
 war_propaganda_desc: "儘管周遭的世界正處於戰火之中，但不幸的是，我國人民卻對戰爭毫無準備。我們必須贏得人們的支持，說服其為我們的國家拿起武器。"
 desperate_defense: "殊死防禦"
 desperate_defense_desc: "我們已經退無可退，士兵們必須掘壕固守並且撐住防線。"
 war_bonds: "戰爭債券"
 war_bonds_desc: "我們需要更多的資源以維持戰時經濟，而戰爭債券正好是可取的來源途徑。"
 CHI_lessons_of_war: "戰爭之誡"
 CHI_bolster_our_ranks: "強化軍隊"
 CHI_industrial_evacuations_from_beijing: "遷移北京工業"
 GER_barbarossa_mission_desc: "德國武裝部隊必須做好準備，通過一場迅猛的攻勢擊垮蘇維埃俄國。俄軍主力部隊，必將在德軍裝甲先鋒的無畏閃擊下灰飛煙滅。"
 USA_war_measures: "戰時措施"
 USA_homeland_defense: "本土緊急防衛法案"
 USA_homeland_defense_desc: "敵軍已經在我們引以為豪祖國的領土上登陸，美利堅人民必將奮勇反擊，把入侵者趕下海！"
 USA_aid_britain: "援助英國"
 USA_establish_personal_communication_with_former_naval_person: "聯絡英國前海軍大臣"
 USA_establish_personal_communication_with_former_naval_person_desc: "一位新的領導人已被委任為[ENG.GetName]首相，我們必須通過私人渠道與其展開聯絡，為我們最終參戰進行先期準備和協調。"
 USA_battle_domestic_isolationism: "駁斥本國孤立主義"
 USA_battle_domestic_isolationism_desc: "如果坐視孤立主義者按照其意願行事，我國屆時將會在面對敵國時毫無防備。為了自身的利益，我們必須開始消除盛行的孤立主義論調。"
 USA_emergency_arms_deliveries: "緊急軍備輸送"
 USA_emergency_arms_deliveries_desc: "法國已經陷落，而英國正獨自對抗侵略者，竭力保衛其海岸免遭入侵。激烈的言辭彰顯了英國人堅定的決心一如既往，他們並不打算就此墮入黑暗。為了民主的大義，我們應該確保他們有足夠的裝備以捍衛自由。"
 USA_arsenal_of_democracy_decision: "民主兵工廠"
 USA_arsenal_of_democracy_decision_desc: "儘管眼下我們還不應捲入戰爭，但我們可以作為兵工廠援助我們的盟友。行動起來，讓人民知曉這樣做的理由。"
 USA_women_in_the_workforce: "鉚釘工羅西"
 USA_women_in_the_workforce_desc: "你會使用電動攪拌機嗎？如果會用，那你也能學會如何操作鑽孔機。縱貫整個戰時，超過六百萬美國女性投身於工業生產、工程建造以及其他體力勞動當中，切實證明了女性可以在這些領域做得和男性一樣好。"
 CAN_women_in_the_workforce: "布倫機槍女孩羅妮"
 CAN_women_in_the_workforce_desc: "羅妮說：“讓它們來！”隨著我國男性參軍服役，軍工生產的重責就落到了女性的肩頭上。縱貫整個戰時，八十多萬加拿大女性接替了參軍服役者留下的工作，切實證明了女性可以在這些領域做得和男性一樣好。"
