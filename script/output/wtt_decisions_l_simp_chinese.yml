 recall_von_lettow_vorbeck_desc: "隨著霍亨索倫家族重歸皇位，昔日的東非雄獅願再為帝國效勞。"
 GER_sharpen_air_safety_regulations: "強化航空安全條例"
 GER_sharpen_air_safety_regulations_desc: "隨著更為嚴格的安全條例生效，我們可以防止一些經常出現的飛行災難性事故的發生，包括飛艇事故在內。"
 MAN_recruit_bandits_north: "招安北部土匪"
 MAN_recruit_bandits_north_desc: "為剿匪所消耗的每顆子彈對於將至的大戰來說都可謂是浪費，相較於內耗，我們應該給這群鬍子一條出路——通過為皇上效力的方式來改過自新。"
 MAN_recruit_bandits_west: "招安西部土匪"
 MAN_recruit_bandits_west_desc: "為剿匪所消耗的每顆子彈對於將至的大戰來說都可謂是浪費，相較於內耗，我們應該給這群鬍子一條出路——通過為皇上效力的方式來改過自新。"
 MAN_recruit_bandits_east: "招安東部土匪"
 MAN_recruit_bandits_east_desc: "為剿匪所消耗的每顆子彈對於將至的大戰來說都可謂是浪費，相較於內耗，我們應該給這群鬍子一條出路——通過為皇上效力的方式來改過自新。"
 MAN_recruit_bandits_generic: "招安殘餘土匪"
 MAN_recruit_bandits_generic_desc: "我國的監獄和勞改營中如今塞滿了那些曾和我們作對的傢伙，而為了自由，我們急需所能蒐羅到的任何人手或槍械。天子陛下將恩賜予這些罪犯仁慈，使他們能夠通過服役效力來改過自新。"
 MAN_release_bandits: "赦免服法土匪"
 MAN_release_bandits_desc: "昔日的罪犯已經獻上了尊崇吾皇的忠誠，他們現在已可被安然遣返回社會。"
 MAN_war_preparations: "獨立戰爭"
 MAN_raise_manchu_banner: "召集旗軍"
 MAN_raise_manchu_banner_desc: "大清天子在昔日可召集八旗子弟披掛上陣，如今雖時過境遷，然傳統仍舊，清廷依舊可以要求旗軍子弟再次獻上其忠誠。"
 MAN_disband_the_banners: "解散旗軍"
 MAN_disband_the_banners_desc: "旗軍子弟已經完成了天子賦予他們的使命，現在可以回家和親人們團聚了——直到朝廷再次徵召前。"
 MAN_fund_underground_gun_shops: "建立地下工坊"
 MAN_fund_underground_gun_shops_desc: "儘管不如大工廠生產那樣成本低廉且產品質量也參差不齊，但把武器生產工作交給國內遍佈的小作坊，已經是提升武器產量的最好辦法了。"
 MAN_remove_underground_gun_shops: "關閉地下工坊"
 MAN_remove_underground_gun_shops_desc: "我們此前建立的地下武器工坊已經完成了其使命，現在是時候重回有組織的規模生產了。"
 MAN_divert_machine_tools: "挪用機械設備"
 MAN_divert_machine_tools_desc: "由於鐵路沿線位於我方的管控下，我們可以“確保”部分機械設備在運輸途中因“管理失誤”而“丟失”。"
 MAN_prepare_to_seize_arms: "準備奪取日本軍火庫"
 MAN_prepare_to_seize_arms_desc: "四散在我國境內的日本軍械和彈藥庫缺乏足夠的守備，只需要精心謀劃並展開一場協同突襲就可以最低的代價將其盡收囊中。這不僅可以使我軍獲取現代化的武器裝備，同時也能令日本人的彈藥和補給出現短缺。花費更多的時間和資源對此進行準備，我們就可以奪取更多的軍火。"
 MAN_seize_arms: "執行計劃"
 MAN_seize_arms_desc: "即刻行動！皇上萬歲！"
 MAN_can_prepare_more_tt: "仍可進行更為充分的準備以奪取更多的軍火。\n"
