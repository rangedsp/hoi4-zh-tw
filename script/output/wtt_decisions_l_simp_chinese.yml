 JAP_test_the_soviets: "試探[SOV.GetAdjective]"
 JAP_test_the_soviets_desc: "我們同[SOV.GetNameDef]在朝鮮和滿洲共享著相當漫長的邊境線，而在沿線各地，兩軍士兵隨時都可能擦槍走火。對於我們來說，這是試探[SOV.GetAdjective]對輕度挑釁反應程度的機會。"
 JAP_border_conflict_warning_SOV: "日本邊境挑釁"
 JAP_border_conflict_warning_SOV_desc: "我國邊防軍日前於朝鮮邊境線上同日軍士兵爆發了衝突，而根據從日本方面探得的情報顯示，這很可能是大規模衝突的先聲。我們應該立即強化同日本邊境的戒備。"
 JAP_border_conflict_escalation_warning_SOV: "日本備戰"
 JAP_border_conflict_escalation_warning_SOV_desc: "空中偵察已經確認了日方在其邊境一側的主力部隊調動情況，雖然尚不知曉日軍是否或者何時發動突襲，但我們必須做好準備。"
 JAP_border_incident_forgotten: "最佳時機"
 JAP_border_incident_forgotten_desc: "如果我們想利用蘇朝邊境發生的事變，就必須果斷採取行動。"
 JAP_escalate_incident_to_border_conflict_SOV: "升級事態"
 JAP_escalate_incident_to_border_conflict_SOV_desc: "鑑於蘇聯人似乎並不打算在這場衝突當中讓步，我們只能在將事變升級為武裝衝突或者悻然退卻當中作出選擇了。"
 JAP_border_conflict_time_until_cancelled: "結束衝突"
 JAP_border_conflict_time_until_cancelled_desc: "就目前的態勢來說，我們已經不再能維持更久的作戰了。"
 JAP_border_conflict_escalate_conflict: "加劇衝突"
 JAP_border_conflict_escalate_conflict_desc: "我們和[FROM.GetNameDef]在邊境線的衝突現已陷入僵局，但如果進一步擴大事態並投入更多部隊，我們仍有機會斬獲勝利。"
 JAP_border_conflict_escalate_to_war: "正式開戰"
 JAP_border_conflict_escalate_to_war_desc: "爭議地帶的戰事已經持續了一段時間，然卻絲毫沒有終戰的希望。我們必須做好準備，將目前的衝突視為全面戰爭的開端，進而展開下一步方略。"
 JAP_border_conflict_back_out_of_conflict: "悻然讓步"
 JAP_border_conflict_back_out_of_conflict_desc: "放任這場衝突失控並將我等兩國推向全面戰爭的危險實在是太大了。我們應該及時止損，向對方提出外交磋商。"
