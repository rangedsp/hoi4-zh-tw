 JAP_colonial_independence: "殖民地獨立"
 JAP_colonial_independence_desc: "鑑於我們已收復帝國的舊屬地，是時候解放當地人民並給予他們應得的獨立了。"
 JAP_return_manchuria: "歸還滿洲"
 PRC_return_manchuria_communist: "要求歸還東北"
 PRC_return_manchuria_communist_desc: "日本帝國主義分子此前從自由的中國人民手中奪走了東三省，但鑑於我們的日本同志已經將這些壓迫者趕下了臺，我們也許應該照會他們將這片土地歸還給中國人民。"
 JAP_liberate_manchuria_alliance_tt: "遞交結盟提案。"
 JAP_interservice_rivalry: "軍種對立"
 JAP_interservice_rivalry_desc: "圍繞著有限的資源，帝國海陸兩軍之間爆發了惡性的衝突。為此，我們必須定期召開聯席會議，以確保資源運用得當。無論偏向哪一方，都將造成長遠的影響。"
