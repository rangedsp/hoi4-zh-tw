 hold_fight_on_the_beaches_speech: "發表“我們將在海灘上戰鬥”演說"
 hold_fight_on_the_beaches_speech_desc: "“我們將戰鬥到底。我們將在法國戰鬥，我們將在海洋上戰鬥，我們將充滿信心與力量地在空中戰鬥，我們將不惜任何代價地保衛我們的本土。我們將在海灘上戰鬥，我們將在敵人的登陸地點戰鬥，我們將在田野和街頭戰鬥，我們將在山區戰鬥，我們決不投降！”"
 fight_on_the_beaches_speech: "“我們將在海灘上戰鬥”演說"
 operation_fork: "叉子行動"
 operation_fork_desc: "新近獨立的冰島國在北大西洋海域的戰略位置十分重要。隨著挪威陷落，這座島嶼十分易受攻擊。我們必須挫敗敵方入侵或佔領冰島的嘗試，以免其利用該島作為戰略基地，進而威脅到我方的補給線。只有在我方的保護下，冰島人民才能遠離敵方的侵擾。"
 ENG_operation_valentine: "瓦倫丁行動"
 ENG_operation_valentine_desc: "我們將保護法羅群島不受一切戰爭的侵害，並順便在島上安置海空軍，同時鞏固我們在北海的地位。等丹麥從敵對侵略造成的骯髒奴役中解放後，我們就會交還。"
 invade_ireland: "入侵愛爾蘭"
 invade_ireland_desc: "我們必須以任何必要的手段確保我方運輸船隊的安全，也許部分我方人士對入侵愛爾蘭持有異議，但若只有如此我們才能使用其空軍基地，那麼也別無他法。"
 macdonald_proposal: "麥克唐納提案"
 macdonald_proposal_desc: "我們必須確保我方運輸船隊的安全，為達成此目標，愛爾蘭的海空軍基地至關重要。我們將向愛爾蘭派遣特使，就此事以北愛爾蘭地區作為籌碼展開談判，換取愛爾蘭加入我方陣營參戰。"
 hold_blood_toil_tears_sweat_speech: "發表“熱血·辛勞·汗水和眼淚”演說"
 hold_blood_toil_tears_sweat_speech_desc: "“我能盡心奉獻的別無他物，唯有熱血、辛勞、汗水和眼淚。[...]你們要問，我們的政策是什麼？我的回答是，在海洋、陸地和空中作戰，盡我們所能，以上帝賜予我們的一切力量戰鬥，同一個邪惡悲慘的人類罪惡史上前所未見的窮兇極惡的暴政進行戰鬥，這就是我們的政策。你們要問，我們的目的是什麼？我可以用一個詞來答覆：勝利——不惜一切代價地去爭取勝利，無論多麼恐怖也要去爭取勝利；無論道路多麼遙遠和艱難，也要去爭取勝利；因為沒有勝利，就不能生存。”"
 blood_toil_tears_sweat_speech: "“熱血·辛勞·汗水和眼淚”演說"
 hold_this_was_their_finest_hour_speech: "發表“最光輝的時刻”演說"
 hold_this_was_their_finest_hour_speech_desc: "“因此，讓我們振作起來，承擔起自身的職責，如此，當大英帝國和英聯邦長存千年後，人們仍然會說，這是他們最光輝的時刻。”"
 this_was_their_finest_hour_speech: "“最光輝的時刻”演說"
 mers_el_kebir_raid: "弩炮行動"
 mers_el_kebir_raid_desc: "法國艦隊已經落入了維希政權的手中，這些船決不能被轉交給德國人。無論多麼令人不悅，我們也必須以轟沉相要挾，勒令作為前盟友的法國海軍立即投降。"
 FRA_vichy_france: "維希法國"
 FRA_scuttle_the_fleet: "艦隊自沉"
 FRA_scuttle_the_fleet_desc: "外國勢力正試圖強行接管我國海軍，我們決不能容許此事發生，哪怕為此必須得自沉我方戰艦！"
 FRA_case_anton_mission: "安東行動進行中"
 case_anton: "安東行動"
 FRA_case_anton_mission_tt: "吞併被迴避。"
 war_measures: "戰時措施"
 women_in_the_workforce: "女性勞工"
 women_in_the_workforce_desc: "當男性服役參戰時，成千上萬的女性接替了在工廠裡的崗位以維持戰爭機器的運轉。"
 scientist_refuge: "科學家庇護"
 scientist_refuge_desc: "鑑於當下的歐洲政治氣候，相當數量的科學家決定離開他們的祖國，目前他們已經對我國的入境簽證遞交了申請。儘管批准之將有助於我國科研，但也有人認為此乃他國內政，我國不應捲入其中。"
 give_refuge_ger: "給予德國科學家庇護"
 give_refuge_ita: "給予意大利科學家庇護"
 operations: "行動"
 GER_military_buildup: "軍隊擴編"
 GER_weserubung_sud: "威瑟堡行動·南部"
 GER_weserubung_sud_desc: "為了獲取一個入侵挪威的良好出發點，我們需要先行進軍丹麥。"
 GER_weserubung_nord: "威瑟堡行動·北部"
 GER_weserubung_nord_desc: "挪威的戰略位置十分重要，同時，對於想要破壞我國和瑞典之間鋼鐵貿易的敵人來說，這也是相當顯而易見的進攻位置。我們不能冒讓敵人在此建立基地的風險。"
 GER_case_yellow_netherlands: "黃色方案·荷蘭"
 GER_case_yellow_netherlands_desc: "僅從比利時發起進攻的話，作戰前線將會過於狹窄。我們必須將荷蘭也納入作戰計劃內，以免重蹈1914年的覆轍。"
 GER_case_yellow_belgium_luxembourg: "黃色方案·比利時&盧森堡"
 GER_case_yellow_belgium_luxembourg_desc: "鑑於向馬奇諾防線發起進攻無異於自殺，我們將沿其側翼向北，穿越阿登山區來繞開這設防嚴密的工事。"
 GER_polish_ultimatum: "對波蘭下達最後通牒"
 SOV_industry_relocation: "工業遷移"
 SOV_relocate_industry_from_moscow: "遷移莫斯科工業"
 SOV_relocate_industry_from_moscow_desc: "儘管將莫斯科的工業重裝設備撤離到烏拉爾是一項浩大的工程，但這對於確保我國戰時生產而言十分必要。"
 SOV_relocate_industry_from_moscow_tt: "§R我們需要控制莫斯科才能使此決議在計時結束時生效。§!"
 SOV_relocate_industry_from_leningrad: "遷移列寧格勒工業"
 SOV_relocate_industry_from_leningrad_desc: "儘管將列寧格勒的工業重裝設備撤離到烏拉爾是一項浩大的工程，但這對於確保我國戰時生產而言十分必要。"
 SOV_relocate_industry_from_leningrad_tt: "§R我們需要控制[569.GetName]才能使此決議在計時結束時生效。§!"
