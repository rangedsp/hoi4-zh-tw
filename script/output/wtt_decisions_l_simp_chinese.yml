 LUX_ban_neutrality_party: "禁止君主主義者的活動"
 anti_fascist_raids: "搜捕法西斯分子"
 anti_fascist_raids_desc: "為了局勢的長期穩定，必須對國內的法西斯分子進行嚴厲打擊。法西斯勢力影響甚眾，或許會成為當前政府的一大威脅。"
 anti_democratic_raids: "搜捕民主分子"
 anti_democratic_raids_desc: "為了局勢的長期穩定，必須對國內的民主分子進行嚴厲打擊。民主勢力影響甚眾，或許會成為當前政府的一大威脅。"
 anti_communist_raids: "搜捕共產分子"
 anti_communist_raids_desc: "為了局勢的長期穩定，必須對國內的共產分子進行嚴厲打擊。共產勢力影響甚眾，或許會成為當前政府的一大威脅。"
 anti_neutrality_raids: "突襲民族主義異見分子"
 LUX_anti_neutrality_raids: "搜捕保皇派"
 anti_neutrality_raids_desc: "為了國家長期的國內穩定，我們必須打擊國內的不同政見活動。他們的政治理想與我們相差甚遠，可能會對政權構成威脅。"
 object_to_attaches: "抗議顧問派駐"
 object_to_attaches_desc: "敵國正在接受外國援助！我們必須提出強烈抗議，要求對方撤回全部顧問。"
 infrastructure_building_slot: "區域工業整合"
