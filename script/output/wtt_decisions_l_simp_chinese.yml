 demand_tribute_from_new_communist_china: "要求貢賦增額"
 blow_suez_canal: "炸燬蘇伊士運河"
 blow_suez_canal_desc: "我們決不能讓敵人奪取戰略意義極大的蘇伊士運河，為此必須開始部署針對運河的破壞工程，目的在於使其在未來相當長的一段時間內無法使用。這將極大地限制敵軍艦船從亞洲和東非海域進出地中海的進出能力。"
 blow_panama_canal: "炸燬巴拿馬運河"
 blow_panama_canal_desc: "我們決不能讓敵人奪取戰略意義極大的巴拿馬運河，為此必須開始部署針對運河的破壞工程，目的在於使其在未來相當長的一段時間內無法使用。這將極大地限制敵軍艦船在太平洋和大西洋之間機動的能力。"
 rebuild_suez_canal: "修復蘇伊士運河"
 rebuild_suez_canal_desc: "蘇伊士運河對我國的戰爭而言至關重要。為了在地中海和印度洋之間自由調動艦船和部隊，我們必須調用一切可能的資源來修復這條大運河。"
 rebuild_panama_canal: "修復巴拿馬運河"
 rebuild_panama_canal_desc: "巴拿馬運河對我國的戰爭而言至關重要。為了在太平洋和大西洋之間自由調動艦船和部隊，我們必須調用一切可能的資源來修復這條大運河。"
 border_war_with_from: "和[From.GetNameDef]的邊境戰爭"
 MAN_banditry_category: "匪患"
 MAN_banditry_category_desc: "關東軍目中毫無滿洲百姓，與其說是來支援國家建設，毋寧說是來進行軍事佔領。由於日本人僅撥了極少的資源給滿洲國政府用以維持秩序，因此這片權力真空的地區幾乎烏煙瘴氣、流寇成災：有些人自詡為“自由鬥士”，借“民族解放”或“無產階級國際主義”之名，行殺戮偷竊之實。但對於大多數土匪來說，甚至沒有任何明確的意識形態來粉飾其暴虐的行徑。"
 MAN_bandit_raids: "土匪劫掠"
 MAN_bandit_raids_desc: "遊蕩的土匪和恐怖分子正在肆意燒殺劫掠，調集更多的部隊去阻止他們！"
 PRC_border_clashes: "邊境衝突"
