 SOV_seize_manchuria: "奪取滿洲"
 SOV_seize_manchuria_desc: "承蒙日本內戰之賜，[MAN.GetName]現已脫離日本的統治。如果我們能行動迅速，那麼而今正是在當地建立蘇維埃統治的絕佳機會。"
 SOV_return_manchuria: "歸還滿洲"
 SOV_return_manchuria_desc: "我們將把滿洲歸還給中國唯一合法的人民政權。"
 fascism_on_the_rise: "法西斯思潮崛起"
 fascism_on_the_rise_desc: "主流政治思潮現已開始傾向法西斯主義的價值觀念，並且正在尋求大眾的支持。國家步入法西斯道路的大門已經敞開，問題只在於是以和平還是暴力的方式實現過渡。"
 prepare_for_fascist_civil_war: "準備內戰"
 prepare_for_fascist_civil_war_desc: "我們沒有時間去等待民意的緩慢轉變，為了人民的利益，即使有些人可能因此喪命，我們也必須果斷行事。與和平公投不同，內戰會對我國的工業、基礎設施乃至軍事實力都造成巨大的損害，但它可畢其功於一役，在未來也可以更容易地貫徹我們的意志。"
 expand_civil_fascism_support: "擴大民意支持"
 expand_civil_fascism_support_desc: "鑑於政府威信的喪失以及社會不穩定因素的增加會讓我們更容易達成目標，我們必須確保得到人民廣泛而持續的支持，同時鼓勵其公開挑戰政府權威。畢竟，相較於合法的政府更迭，這些對政權交替推波助瀾的方式更沾點……不光彩。"
 army_support_for_fascist_civil_war: "擴大軍隊支持"
 army_support_for_fascist_civil_war_desc: "沒有軍方的充分支持，一切贏得意識形態武裝鬥爭的指望都是徒勞的。我們必須確保軍隊武裝力量的絕對忠誠。"
 army_support_TT: "每次軍隊支持度的提升都會給你的陣營在內戰中帶來10%的兵力加成，最多可達到70%。\n"
 ensure_general_loyalty_for_fascist_civil_war: "確保低階指揮官忠誠"
 ensure_general_loyalty_for_fascist_civil_war_desc: "某些軍官可能會私下贊同法西斯主義。我們必須加以拉攏，確保其在開戰時對我方效忠。"
 ensure_marshal_loyalty_for_fascist_civil_war: "確保高階指揮官忠誠"
 ensure_marshal_loyalty_for_fascist_civil_war_desc: "某些元帥可能會私下贊同法西斯主義。我們必須加以拉攏，確保其在開戰時對我方效忠。"
 siphon_equipment_stockpiles_for_fascist_civil_war: "挪用軍備"
 siphon_equipment_stockpiles_for_fascist_civil_war_desc: "通過私藏國家的軍備庫存，我們可以挪用小部分武器，得以在將來的鬥爭中派上用場。"
 formulate_surprise_attack_plan_for_fascist_civil_war: "謀劃奇襲"
 formulate_surprise_attack_plan_for_fascist_civil_war_desc: "敵人對行將到來的滅頂之災仍然一無所知。我們必須確保消息繼續保密，這楊我們的作戰計劃就可以在最大限度上利用突襲所帶來的優勢。"
 formulate_surprise_attack_plan_for_civil_war_tt: "奇襲計劃會給予所有在核心領土作戰的陸軍師25%的攻擊加成，持續30日。\n"
 ignite_the_fascist_civil_war: "引爆內戰"
 ignite_the_fascist_civil_war_desc: "骰子已經擲下，我們已經完成了所有必需的準備工作，從此再無回頭之路。"
 rebuild_the_nation_fascism: "重建國家"
 rebuild_the_nation_fascism_desc: "內戰已經結束，是時候在廢墟上重建家園了。"
 open_up_political_discourse_fascism: "開啟政治對話"
 open_up_political_discourse_fascism_desc: "我們必須公開接納政府中的不同意見，或許這最終會實現我國政局和平的變革。"
