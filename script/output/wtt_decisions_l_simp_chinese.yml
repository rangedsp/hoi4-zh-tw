 form_rattanakosin_kingdom: "鞏固拉達那哥欣王朝遺產"
 form_hre: "復興神聖羅馬帝國"
 form_scandinavia_category: "重建卡爾瑪同盟"
 form_scandinavia_category_desc: "我們已然征服斯堪的納維亞的所有領土，現在是時候重拾卡爾瑪聯盟的精神了，整個斯堪的納維亞將在我國治下繁榮昌盛。"
 form_nordic_league_category: "宣告北歐統合"
 form_nordic_league_category_desc: "北歐各族長久以來彼此親近。鑑於我國已然掌控所有原屬於北歐諸國的領土，我們現在有機會將這種情誼上升到新的高度。"
 form_gran_colombia_category: "重拾玻利瓦爾的遺產"
 form_gran_colombia_category_desc: "雖然大哥倫比亞共和國政權在一個世紀前的短命嘗試後便草草落幕，但我們現在又一次成功奪得其法理領土。或許，我們能夠再一次實現玻利瓦爾的偉夢。"
 form_austria_hungary_category: "重建奧匈帝國"
 form_austria_hungary_category_desc: "舊奧匈帝國的法理領土已皆被我國收復，作為僅存的繼業者國家，我們應當重建帝國。吾輩切勿躊躇，此事著應立刻落實。"
 form_commonwealth_category: "重組波蘭-立陶宛聯邦"
 form_commonwealth_category_desc: "波蘭和立陶宛兩國之間有著深厚的歷史淵源，隨著兩國業已經由武力統合，或許是時候重溫過去那最光輝的歲月了。"
 form_united_netherlands_category: "否認倫敦條約"
 form_united_netherlands_category_desc: "1839年簽署的倫敦條約卑鄙地將尼德蘭低地拆分為了南北兩部分，短暫的統一歲月就此黯然告終。但現在，憑藉著我國英明神武的統治，我們或可重拾往昔的榮光，亦能使我國足以同法德兩國相抗衡。"
 form_united_central_america_category: "重建中美洲聯邦共和國"
 form_united_central_america_category_desc: "儘管其存續時間不長，但我國也曾是一個世紀以前那個強國的組成部分。現在我們業已征服了致其垮臺的各路地方勢力，那麼就可以著手推進重建聯邦共和國，而統一的中美洲必將布國威於四方。"
 form_baltic_federation_category: "統合波羅的海諸國"
 form_baltic_federation_category_desc: "我國此前就地區團結和統一外交政策的聲明只有在徹底掌控整個波羅的地區後才能落實。面對東西方迫近的危險，只有將鄰國與我整合為一體，才能給所有人帶來更堅實的安全保障。"
 form_ottoman_empire_category: "重建奧斯曼帝國"
 form_ottoman_empire_category_desc: "通過武力，我們討回了在上次大戰中因積貧積弱而淪喪的領土。為了紀念這歷史性的時刻，宣佈奧斯曼帝國的重建可謂是最佳的選擇。"
 form_european_union_category: "實現歐洲統一"
 form_european_union_category_desc: "儘管在過去幾十年裡，從政治上統一歐陸的理念進展頗微，但鑑於近來我們已經征服了歐陸最強大的幾個國家，這個不切實際的想法令人意外的有了實現的機會。我們或許需要對國家進行重組，以便充分利用此次千載難逢的機會。"
 form_mutapa_category: "再造津巴布韋帝國"
 form_mutapa_category_desc: "隨著非洲大陸南部掙脫殖民枷鎖，或許是時候將人民聚集在復興我們往昔強大帝國的理念下了，本地區有著許多崇敬往昔帝國的人士，而我們只需一個切實的國名作為象徵將他們團結起來。"
 form_roman_empire_category: "實現羅馬雄心"
 form_roman_empire_category_desc: "近年來，建立環地中海帝國的主張已經取得了大量的支持。隨著不斷擴張的軍事行動，我們所取得的成就甚至已遠超那些最狂熱擁護者們的想像，如今正身處實現重建羅馬帝國雄心壯志的關鍵節點。羅馬永不屈服！"
 form_persian_empire_category: "再造波斯帝國"
 form_persian_empire_category_desc: "我方近來的征服已經抵至舊波斯帝國的疆界，憑藉著深厚的歷史底蘊，我們怎可坐失良機，不借此宣告我國對逝往波斯帝國的繼承和延續呢？"
 form_byzantine_empire_category: "重建拜占庭帝國"
 form_byzantine_empire_category_desc: "在將土耳其的桎梏從我國舊法理領土上清除後，我們僅需稍加宣傳，即可正式宣告我國乃五個世紀前被土耳其人毀滅的古老帝國光榮的繼業者。如此神聖的傳承，定當令我國在國際上威名顯赫！"
 form_arabia_category: "統一阿拉伯"
 form_arabia_category_desc: "阿拉伯諸國因互相爭鬥而分裂已久。鑑於整個半島現已置於我國統治之下，我們可以宣告統一的阿拉伯國家就此誕生！"
 form_majapahit_empire_category: "統一努山達拉的夢想"
 form_majapahit_empire_category_desc: "在遙遠的歷史長河中，一個強盛的帝國曾主宰印度尼西亞群島，掌控著這片海域的商貿命脈。如今，我們成功將國土疆域擴展至與那個古老帝國比肩的規模，並以此為基石構建新的民族國家，這無疑將成為這片區域重現統一輝煌的重要象徵。"
 form_rattanakosin_kingdom_category: "鞏固拉達那哥欣王朝遺產"
 form_rattanakosin_kingdom_category_desc: "近年來，我們已與建國初期的傳統民族認同漸行漸遠。但現在，隨著我們重回黃金時代的疆域，或許是時候更加緊密地契合本國的歷史了。"
 form_hre_category: "復興神聖羅馬帝國"
 form_hre_category_desc: "[GetWhoIsFormingHre]"
 GER_is_forming_hre: "我們的女皇陛下的輝煌無與倫比，我們國家的疆界也同樣無邊無際。這些疆界已擴展至涵蓋了舊神聖羅馬帝國的範圍，而站在我們道路上的國家也不再有資格反對我們的政策。女皇陛下已經下令，我們應把握住當下的機會，讓我國成為神聖羅馬帝國的精神繼承者。鷹擊天翱，主宰萬物！"
 GER_is_forming_hre_without_victoria: "我們政府的輝煌無與倫比，我們國家的疆界也同樣無邊無際。這些疆界已擴展至涵蓋了舊神聖羅馬帝國的範圍，而擋住我們道路的國家也不再有資格反對我們的政策。我們應把握住當下的機會，讓我國成為神聖羅馬帝國的精神繼承者。鷹擊天翱，主宰萬物！"
 AUS_is_forming_hre: "我們的大公[ROOT.GetLeader]的輝煌無與倫比，我們國家的疆界也同樣無邊無際。這些疆界已擴展至涵蓋了舊神聖羅馬帝國的範圍，而站在我們道路上的國家也不再有資格反對我們的政策。大公已經下令要把握住當下的機會，讓我國成為神聖羅馬帝國的精神繼承者。鷹擊天翱，主宰萬物！"
 form_greater_german_reich_category: "德意志民族的大德意志國"
 form_greater_german_reich_category_desc: "如今諸敵已然勢微，東征行將功成。全世界應當知曉我等民族之偉大，世人皆會在改建之後的國都面前驚歎不止。"
 form_greater_german_reich: "宣告新秩序"
 form_greater_german_state_category: "無產階級新秩序"
 form_greater_german_state_category_desc: "儘管舉目皆敵，但我們還是戰勝了西歐的腐敗政府。他們再也不能壓迫工人了，工人已被我們解放，並加入我們的事業。資本主義的枷鎖已被打破，新的秩序在歐洲和世界嶄露頭角。"
 form_greater_proletarian_state: "宣告大德意志無產國成立"
