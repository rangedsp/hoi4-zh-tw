 JAP_china_step_up_war_effort: "升級對華戰爭態勢"
 JAP_ichi_go: "一號作戰"
 JAP_ichi_go_desc: "戰事的終點已指日可待，我國或可通過一場最終攻勢以加速結果的進程。然而，若是我們不能在此後的一年內斬獲勝利，那麼隨著社會輿論對擴大戰爭投入的質疑，我們或許會面臨內部穩定問題的困擾……"
 JAP_conquer_china: "征服中國"
 JAP_release_korea: "朝鮮獨立"
 JAP_southern_expansion: "南進擴張"
 JAP_southern_expansion_desc: "為了貫徹海軍的南進策略，是時候與南方的帝國主義者和殖民者掰掰手腕了，必須將整條南方航路納入我國領域。"
 JAP_sue_for_peace_CHI: "向[From.GetNameDef]呈請議和"
 JAP_sue_for_peace_TT: "§Y日本§!或其附屬國不再控制任何§Y中國§!大陸或§Y朝鮮§!的核心地區。"
 JAP_sue_for_peace_CHI_desc: "我們已經失去了在東亞大陸的所有據點。鑑於軍方認為我國已不太可能捲土重來，文官政府建議，為了至少保全對本土列島的統治，我們應該尋求達成和約。"
 JAP_sue_for_peace_MAN: "向[From.GetNameDef]呈請議和"
 JAP_sue_for_peace_MAN_desc: "我們已經失去了在東亞大陸的所有據點。鑑於軍方認為我國已不太可能捲土重來，文官政府建議，為了至少保全對本土列島的統治，我們應該尋求達成和約。"
 JAP_sue_for_peace_nuke: "宣佈無條件投降"
 JAP_sue_for_peace_nuke_desc: "敵新使用殘虐爆彈，戰局必不好轉，時運所趨，只能堪所難堪，忍所難忍，欲以為萬世開太平。"
 JAP_sue_for_peace_nuke_mission: "對日本本土發動核打擊"
 JAP_sue_for_peace_nuke_mission_desc: "最近成功的核試驗為全面入侵日本列島提供了替代的方案。情報顯示，如果我們可以從日本手中奪取沖繩島和硫磺島，同時將其海軍艦隊削弱至不多於30艘艦船的規模，最後再對日本列島的兩處地點實施核打擊的話，就能有效迫使日本政府無條件投降。"
 JAP_request_soviet_support: "請求蘇聯援助"
 JAP_request_soviet_support_desc: "當前的內戰態勢下，我方急需獲得援助，而距離最近且最可能為革命提供支持的，也只有作為北方鄰國的蘇聯了。或許我們可以將南樺太作為籌碼，換取一些蘇聯方面的志願部隊。"
 JAP_nuke_1: "已實施第一次對日核打擊"
 JAP_nuke_2: "已實施第二次對日核打擊"
 foreign_politics: "外交政策"
 JAP_pressure_france: "索取印度支那"
 JAP_break_the_london_naval_treaty: "撕毀倫敦海軍條約"
 JAP_break_the_london_naval_treaty_desc: "倫敦海軍條約的蠻橫限制對本國的安全而言實屬威脅，我們必須擁有建設海軍的自由，才能抗擊那些膽敢挑戰我國合法權益的國家。"
 JAP_tora_tora_tora: "虎！虎！虎！"
 JAP_tora_tora_tora_desc: "第一批攻擊編隊已蓄勢待發，無論如何，我們都必須迅速行動，在敵人醒悟過來前，充分利用其在明我在暗的優勢予以打擊削弱。"
 JAP_war_with_soviet_union: "對[SOV.GetNameDef]宣戰"
 JAP_war_with_soviet_union_desc: "儘管歐洲盟友們已經和[SOV.GetNameDef]方面簽訂了互不侵犯條約，但我們可沒法坐失良機。因此，即便可能要冒被盟友疏遠的風險，我們也必須單方面向共產主義分子開戰。"
 prospect_for_resources: "資源勘查"
 prospect_for_resources_desc: "我國地質學家已在本國領土上發現了一批富礦，我們可以投入一些資金進行拓掘。隨著挖掘技術的進步，我們還能發現更多可利用的礦藏。"
 economy_decisions: "經濟政策"
 institute_press_censorship_fascist_state: "規制新聞審查"
 institute_press_censorship_fascist_state_desc: "而今正是危難之際，我們決不能讓異見邪說分裂國家。有必要通過限制出版自由的方式，來確保真理之聲清明嘹亮。"
