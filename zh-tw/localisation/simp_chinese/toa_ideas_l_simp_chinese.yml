 CHL_chilean_economy_dynamic_modifier: "智利經濟"
 CHL_chilean_economy_dynamic_modifier_desc: "由於嚴重依賴銅和硝酸鹽出口，智利經濟在大蕭條後遭受了巨大打擊，當時智利最大的貿易伙伴美國停止了從智利的進口，智利被迫出售部分土地，以免經濟完全崩潰。已採取了措施解決這個問題，但還需要做更多工作。智利經濟總有一天會再次繁榮起來！"
