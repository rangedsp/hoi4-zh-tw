l_simp_chinese:
 URG_terra_dictatorship: "特拉專政"
 URG_terra_dictatorship_desc: "自1933年3月31日革命以來，加布裡埃爾·特拉和他的支持者們就一直掌控著權力，不論是巴特列主義的追隨者，還是白黨和其領導人路易斯·阿爾貝托·德·埃雷拉，都沒有足以動搖其決策的威信。對烏拉圭而言，這意味著絕對中立，因為特拉關心國內發展和控制甚於在意料之外的戰爭中選邊站，無論戰爭是發生在南美還是在大西洋彼岸。"
 BOL_toll_of_the_chaco_war: "查科戰爭的代價"
 BOL_toll_of_the_chaco_war_desc: "從1932年持續到1935年的查科戰爭剛剛結束了。即使是玻利維亞和巴拉圭最狂熱的擴張主義支持者，也完全喪失了戰鬥的意志，許多人因仍有爭議的北查科地區而死。"
 BOL_toll_of_the_chaco_war_2: "查科戰爭的代價"
 BOL_toll_of_the_chaco_war_2_desc: "從1932年持續到1935年的查科戰爭剛剛結束了。即使是玻利維亞和巴拉圭最狂熱的擴張主義支持者，也完全喪失了戰鬥的意志，許多人因仍有爭議的北查科地區而死。"
 PRU_amazonian_war: "亞馬遜戰爭"
 PRU_no_factions_tt: "可以加入陣營：§R否§!"
 CHL_the_mapuche_conflict: "馬普切衝突"
 CHL_the_mapuche_conflict_desc: "自阿勞卡尼亞平定戰爭以來，土地和人民被強行併入智利，馬普切原住民流離失所、受盡歧視、忿忿不平。雖然他們中有一些團體努力尋求合作和融合，但也有一些團體竭力以各種可能的方式顛覆國家。"
 CHL_mapuche_conflict_up_tt: "馬普切衝突§R惡化§!。\n"
 CHL_mapuche_conflict_down_tt: "馬普切衝突§G緩和§!。\n"
 idea_CHL_the_Hacienda_inquilinaje_system: "莊園佃戶制度"
 idea_CHL_the_Hacienda_inquilinaje_system_desc: "莊園佃戶制度源於古羅馬和西班牙帝國的治國方式，可以預見，這種制度已經極為陳舊和壓迫。當前智利的莊園以工人條件惡劣和經濟的落後而引人注目，這主要是因為他們迄今仍然實際上在使用農奴制。如果我們希望恢復經濟，唯一能妥善解決這個問題的方法是§Y土地改革§!，這應該是我們的主要優先事項。"
 idea_CHL_near_anarchic_society: "近乎無政府社會"
 idea_CHL_near_anarchic_society_desc: "我們的國家目前飽受政變企圖和騷亂的困擾，以及日常普遍的抗議活動。此外，由於政治家、軍隊和政府機構之間的巨大敵意，沒有什麼能夠有效地運作。如果我們希望一勞永逸地穩定國家，我們必須解決這些問題"
 CHL_anarchic_society_level_down_tt: "§G降低§!$idea_CHL_near_anarchic_society$的影響"
 CHL_anarchic_society_up_tt: "§R惡化§!$idea_CHL_near_anarchic_society$的影響"
 CHL_can_not_have_anarchy_tt: "沒有$idea_CHL_near_anarchic_society$"
 idea_CHL_repubican_guard: "共和國衛隊"
 idea_CHL_repubican_guard_desc: "就目前的情況來看，共和國面臨極大的危險，幾乎瀕臨崩潰的邊緣。然而，自1925年以來，總統阿圖羅·亞歷山德里成功穩定了局勢，現在對這支秘密民兵的依賴正在轉移原本應該用於軍隊的資金，從而阻止了正規軍隊的擴張。"
 CHL_german_compensation_idea: "德國的賠償"
 CHL_spirit_of_the_conquistadors: "征服者的精神"
 CHL_spirit_of_the_conquistadors_desc: "正是征服者們的榮耀將我們的人民帶到南大西洋上的偉大王國。他們在我們歷史上扮演著重要角色，現在作為我們人民的靈感來源，他們的意志將引導我們走向未來。[CHL.GetNameDefCap]將在我們征服較弱的鄰國時變得更大，成為南美洲的主導力量。"
 CHL_relief_efforts_idea: "救災工作"
 CHL_relief_efforts_idea_desc: "政府成立了重建與救濟公司，以更好地組織並支持1939年奇廉地震後的救援和重建工作。"
 CHL_spanish_refugees: "西班牙知識分子難民"
 CHL_has_left_wing_government: "擁有左翼政府"
 CHL_has_right_wing_government: "擁有右翼政府"
 CHL_public_works_modifier: "公共工程項目"
 CHL_deeper_mines_modifier: "擴張的礦業網絡"
 CHL_devalue_the_peso_idea: "貶值比索"
 CHL_devalue_the_peso_idea_desc: "為了讓我們的經濟獲得增長的力量，比索正在經受貶值，儘管這是一項不受歡迎的措施。"
 CHL_devalue_the_franc_idea: "貶值法郎"
 CHL_devalue_the_franc_idea_desc: "為了讓我們的經濟獲得增長的力量，法郎正在經受貶值，儘管這是一項不受歡迎的措施。"
 CHL_introduced_the_franc_idea: "引進法郎"
 CHL_introduced_the_franc_idea_desc: "為了讓國家從傷痛中恢復，並在世界舞臺上找到自己的位置，它需要成為更大的法語圈的一部分。用阿勞卡尼亞法郎取代舊比索是邁向這一目標的重要一步。"
 CHL_hydroelectric_power: "水力發電"
 CHL_hydroelectric_power_desc: "多虧了對阿勞卡尼亞的投資，我們終於建立了一個可以發電和調節河流水流量的水壩網絡。"
 CHL_siphoning_funds: "挪用資金"
 CHL_siphoning_funds_desc: "智利民族社會主義運動的宣傳部門目前正在從公共部門中挪用資金，以加強對[CHL.GetAdjective]民眾的控制。"
 CHL_the_kings_scouts: "國王童子軍"
 CHL_the_kings_scouts_desc: "自我們的國王還小的時候，他就喜歡參加法國童子軍的準軍事活動。現在，他將把這種快樂和激情帶給[CHL.GetAdjective]的青年。"
 CHL_national_falange: "國家長槍黨"
 CHL_national_falange_desc: "基督教政黨國家長槍黨是一個進步和改革派的政黨，於1935年從保守黨中分裂出來，他們非常願意支持我們目前的政治聯盟。"
 CHL_popular_front_in_power: "人民陣線"
 CHL_liberal_party_in_power: "自由黨"
 CHL_communist_party_in_power: "共產黨"
 CHL_democratic_alliance_in_power: "民主聯盟"
 CHL_conservative_party_in_power: "保守黨"
 CHL_radical_party_in_power: "激進黨"
 CHL_popular_freedom_alliance_in_power: "人民解放聯盟"
 CHL_from_support_chile_static_modifier: "支持阿勞卡尼亞和巴塔哥尼亞王國"
 CHL_non_lar_encryption: "加密加成"
 CHL_lar_encryption: "加密加成"
 CHL_imposed_new_taxes: "徵收新稅"
 CHL_impose_new_taxes_tt: "民族精神§Y$CHL_imposed_new_taxes$§!被移除後，§Y$CHL_chilean_economy_dynamic_modifier$§!追加效果：\n $MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$：§G+5%§!\n $MODIFIER_CONSUMER_GOODS_FACTOR$：§Y-10%§!"
 CHL_relief_efforts_idea_tt: "民族精神§Y$CHL_relief_efforts_idea$§!被移除後："
 CHL_aid_SPR: "援助西班牙共和國"
 CHL_aid_araucania: "援助阿勞卡尼亞和巴塔哥尼亞王國"
 CHL_aiding_CHL_payment: "援助阿勞卡尼亞和巴塔哥尼亞王國的支付款"
 CHL_payment_for_aid: "對外援助支付"
 CHL_anti_americanism: "反美主義"
 CHL_empowered_preparations_department: "得到賦權的作戰準備部門"
 CHL_empowered_preparations_department_desc: "民族社會主義籌備部目前是該黨的優先事項，該組織正準備對自由派政府發動政變。"
 CHL_lack_of_funds: "缺乏資金"
 CHL_lack_of_funds_desc: "自由黨政府竊取了國內大量的現金，並攜款逃往國外。我們需要很長時間才能從這次經濟損失中恢復過來。"
 CHL_republican_guards_in_exile: "[CHL.GetAdjective]流亡共和國衛隊"
 CHL_republican_guards_in_exile_desc: "[CHL.GetAdjective]自由黨政府已經在我國建立了準軍事武裝力量，如果我們與[CHL.GetAdjective]開戰，這支武裝力量將幫助他們應對國內的法西斯威脅。"
 CHL_naval_mutiny: "海軍兵變"
 CHL_naval_mutiny_desc: "另一場海軍兵變正在發生，以抗議我們的運動獲得權力，這嚴重削弱了我們的國家實力。"
 CHL_the_international_revolution: "國際革命"
 CHL_the_international_revolution_desc: "我們必須確保革命之火一旦在國外燃起，就不能被扼殺。"
 CHL_laissez_faire: "自由放任"
 CHL_laissez_faire_desc: "市場必須自由流動，只有避免政府對產業的影響，我們的經濟才能復甦。"
 CHL_strict_secularism: "嚴格的世俗主義"
 CHL_strict_secularism_desc: "教會在政治上沒有發言權，應該被視為與之完全分離。我們必須要求我們的政客宣誓不將他們的宗教帶進議會。"
 CHL_catholic_church_holding_political_power: "天主教會掌握政治權力"
 CHL_catholic_church_holding_political_power_desc: "天主教會目前被允許在官方政府政策中擁有發言權，這限制了左翼集團聯合反對我們的企圖。"
 CHL_development_inwards_idea: "向內發展"
 CHL_development_inwards_idea_desc: "這種被稱為“向內發展”的新經濟學說將有助於我國在多年的苦難和無所作為之後進行重建。"
 CHL_socialist_land_reform: "社會主義土地改革"
 CHL_socialist_land_reform_desc: "莊園主的時代結束了，我們的農民將不再生活在農奴制下。[CHL.GetNameDef]真正迎來了新時代！"
 CHL_abolished_serfdom: "廢除農奴制"
 CHL_abolished_serfdom_desc: "莊園主的時代結束了，我們的農民將不再生活在農奴制下！"
 CHL_comptroller_general_of_chile: "國家審計署"
 CHL_comptroller_general_of_chile_desc: "智利共和國審計長官是智利的最高審計機關，具有自主性和憲法級別，負責對公共行政行為的合法性進行控制，監督財政、市政和其他法律確定的組織和部門的收入和投資，審核並稽查財政和市政資產的人的賬目，管理國家的會計總賬，履行法律規定的其他職責。"
 CHL_oppressed_working_class: "被壓迫的工人階級"
 CHL_oppressed_working_class_desc: "由於我們對任何形式的共產主義進行殘酷鎮壓，工會再也不能在這個國家發揮作用，工人階級可以被命令接受我們的出價，無法進行真正的抗議，否則他們將違反永久防禦法。"
 CHL_socialist_youth_idea: "社會主義青年"
 CHL_socialist_youth_idea_desc: "社會主義青年組織將幫助我們組織準軍事部隊，在戰鬥中幫助我們的士兵。"
 CHL_anti_communist_action: "智利反共行動"
 CHL_anti_communist_action_desc: "為了切實打擊國內的共產主義威脅，我們必須組織愛國團體準備好鎮壓任何左派運動。"
 CHL_ligas_patrioticas: "愛國聯盟"
 CHL_ligas_patrioticas_desc: "愛國聯盟是在[CHL.GetNameDef]運作的極右翼的準警察民間組織，幫助我們鎮壓任何異見並阻止任何人逃避徵兵。"
 CHL_hosting_german_intel_lar: "接納德國情報人員和特工"
 CHL_hosting_german_intel_lar_desc: "我們正在積極協助德國在我們半球對其他國家進行間諜活動。"
 CHL_hosting_german_intel_non_lar: "接納德國情報人員和特工"
 CHL_hosting_german_intel_non_lar_desc: "我們正在積極協助德國在我們半球對其他國家進行間諜活動。"
 CHL_fascist_assault_department: "智利民族社會主義運動衝鋒隊"
 CHL_fascist_assault_and_provinces_department: "智利民族社會主義運動衝鋒隊"
 CHL_fascist_youth_department: "民族社會主義青年部"
 CHL_fascist_youth_and_provinces_department: "民族社會主義青年部"
 CHL_pan_hispanic_rhetoric: "泛西班牙裔言論"
 CHL_pan_hispanic_rhetoric_desc: "不久，西班牙裔人民的時代即將到來，我們將統治這個大陸。現在是時候打破盎格魯霸權，團結西班牙裔人民了！"
 CHL_pan_hispanic_rhetoric_2: "泛西班牙裔言論"
 CHL_pan_hispanic_rhetoric_2_desc: "不久，西班牙裔人民的時代即將到來，我們將統治這個大陸。現在是時候打破盎格魯霸權，團結西班牙裔人民了！"
 CHL_pan_hispanic_rhetoric_3: "泛西班牙裔言論"
 CHL_pan_hispanic_rhetoric_3_desc: "不久，西班牙裔人民的時代即將到來，我們將統治這個大陸。現在是時候打破盎格魯霸權，團結西班牙裔人民了！"
 CHL_fascist_military_excercises: "軍事演習"
 CHL_the_true_enemy_idea: "打擊真正的敵人"
 CHL_spirit_of_the_pacific_war: "喚醒了南美太平洋戰爭的精神"
 CHL_spirit_of_the_pacific_war_desc: "我們曾經以少勝多地擊敗過[PRU.GetAdjective]和[BOL.GetAdjective]的軍隊。現在我們要利用這一點作為宣傳，激勵我們的士兵向前推進！"
 CHL_ancestral_mapuche_resistance: "馬普切人祖傳的抵抗"
 CHL_mapuche_ancestral_resistance_good: "馬普切人祖傳的抵抗"
 CHL_democratic_volunteer_corps: "民主的國際保護"
 CHL_democratic_volunteer_corps_desc: "無論專制主義敢於在何處顯露其醜惡面孔，我們的士兵都將驕傲地站立並隨時準備根除它。"
 CHL_stubbornly_maintaining_neutrality: "頑固保持中立"
 CHL_stricter_labor_laws: "更嚴格的勞動法"
 CHL_enact_stricter_labor_laws_tt: "民族精神§Y$CHL_stricter_labor_laws$§!被移除後，§Y$CHL_chilean_economy_dynamic_modifier$§!追加效果：\n $MODIFIER_STABILITY_FACTOR$：§G+10%§!\n $MODIFIER_CONSUMER_GOODS_FACTOR$：§Y-25%§!"
 CHL_carabineros_de_chile_fascist: "智利卡賓槍騎兵"
 CHL_carabineros_de_chile_fascist_desc: "智利卡賓槍騎兵是我們的國家憲兵執法隊，擁有全國管轄權。由我們的前總統卡洛斯·伊瓦涅斯·德爾坎波於1927年創立，其任務是維護智利的秩序和執行智利的法律。"
 CHL_carabineros_de_chile_neutrality: "智利卡賓槍騎兵"
 CHL_carabineros_de_chile_neutrality_desc: "智利卡賓槍騎兵是我們的國家憲兵執法隊，擁有全國管轄權。由我們偉大的總統卡洛斯·伊瓦涅斯·德爾坎波於1927年創立，其任務是維護智利的秩序和執行智利的法律。"
 CHL_the_francoist_model: "佛朗哥模式"
 CHL_the_francoist_model_desc: "通過遵循中立獨裁者的信條，比如西班牙獨裁者弗朗西斯科·佛朗哥所承諾的那樣，我們可以置身於全球衝突之外，而是專注於自己的勢力範圍。"
 CHL_the_francoist_model_conquest: "佛朗哥模式"
 CHL_the_francoist_model_conquest_desc: "通過遵循中立獨裁者的信條，比如西班牙獨裁者弗朗西斯科·佛朗哥所承諾的那樣，我們可以置身於全球衝突之外，而是專注於自己的勢力範圍。"
 CHL_state_supporting_resistance_modifier: "智利支持的抵抗"
 CHL_state_supporting_resistance_modifier_desc: "智利秘密地向當地抵抗組織和游擊隊提供武器、裝備及軍事訓練。"
 CHL_mapuche_nationalism_dynamic_modifier: "馬普切民族主義"
 CHL_mapuche_nationalism_dynamic_modifier_desc: "馬普切民族主義儘管存在，但在我們國家並不盛行。因此，我們必須塑造它，以確保它按照我們最希望的方式發展。"
 CHL_an_empire_in_the_pacific_idea: "太平洋帝國"
 CHL_an_empire_in_the_pacific_idea_desc: "[CHL.GetNameDef]終於到了宣稱它的天命並在太平洋建立一個強大帝國的時候。"
 CHL_mapuche_social_classes: "馬普切人的社會階層和性別認同"
 CHL_mapuche_social_classes_desc: "通過在新社會中實施我們舊社會的社會階層和規範，我們可以使其再次繁榮。"
 CHL_cattle_and_wool: "馬普切牛和羊毛"
 CHL_cattle_and_wool_desc: "多虧了馬普切人出色的畜牧和動物飼養技術，國家可以最大限度地利用所擁有的一切。"
 CHL_machi_in_the_army: "隨軍馬奇巫醫團"
 CHL_machi_in_the_army_desc: "通過讓我們的馬奇薩滿和我們的部隊一起行軍，我們可以確保他們始終保持活力和動力。"
 CHL_legacy_of_caupolican: "考波利坎的遺產"
 CHL_legacy_of_caupolican_desc: "考波利坎的遺產至今仍然影響著我們，他的精神和意志將在我們部隊的思想和行動中傳承下去。"
 CHL_unified_in_spirit_idea: "精神統一"
 CHL_unified_in_spirit_idea_desc: "美洲原住民和波利尼西亞人正在協調並訓練他們的軍隊，使他們的效率大大提高。"
 CHL_patagonian_giants: "巴塔哥尼亞巨人"
 CHL_patagonian_giants_desc: "曾經，巴塔哥尼亞人在最勇敢的歐洲探險家的心中激發了恐懼。我們應確保我們的軍隊體現了這些想像中人的民的精神，並贏得周圍所有國家的尊重。"
 CHL_crusade_against_imperialism_idea: "反帝國主義大十字軍"
 CHL_crusade_against_imperialism_idea_desc: "終於到了將帝國主義和殖民主義勢力從我們大陸趕出去的時候，並從外國壓迫中解放美洲原住民和波利尼西亞人！"
 CHL_local_mapuche_defense_groups: "地方馬普切防禦團體"
 CHL_ibanez_foriegn_support: "外國經濟投資"
 CHL_ibanez_foriegn_support_desc: "多虧了大量新貸款的注入，新資金湧入我們的產業，國家可以緩慢地重新運轉了。"
 CHL_state_catholicism_idea: "國家天主教"
 CHL_state_catholicism_idea_desc: "作為邁向法語圈的又一步，[CHL.GetNameDef]已將天主教定為新的國教。"
 CHL_french_investments: "法國投資"
 CHL_french_investments_desc: "雅克·安托萬·伯納德帶著不滿自己的共和國現狀的法國貴族的資金支持來到這個國家，希望在[CHL.GetNameDef]擁有更好的未來。"
 CHL_veteran_legionaries: "軍團老兵"
 CHL_veteran_legionaries_desc: "法國外籍軍團的許多成員已經在安托萬·伯納德的旅途中加入他，並將在他的“偉大征服”中幫助他。"
 CHL_popular_resistance: "民眾的抵抗"
 CHL_popular_resistance_desc: "這個國家仍然有很多人不相信安東尼·伯納德國王才華的力量。我們必須立即處理他們！"
 CHL_french_aristocracy: "法國貴族"
 CHL_araucanian_aristocracy: "新阿勞卡尼亞貴族"
 araucanian_capital_perquenco: "佩爾肯科"
 CHL_invited_french_academia: "法國學術界"
 CHL_invited_french_academia_desc: "作為法語圈的一部分，思維一致是很重要的，為此，我們將鼓勵法國學術界移居[CHL.GetNameDef]。"
 CHL_royal_mountaineers: "皇家山地部隊"
 CHL_royal_mountaineers_desc: "雖然巴塔哥尼亞可能不是，但阿勞卡尼亞確實是一個山區和叢林地帶。國王因此呼籲成立一支皇家山地兵團，專門在這種崎嶇地形中作戰。"
 CHL_peru_payments_to_chile: "向智利支付款項"
 CHL_peru_payments_to_chile_desc: "目前，我們每月需要向[CHL.GetNameDef]支付一大筆款項，因為我們購買了[951.GetName]。"
 CHL_chile_payments_from_peru: "秘魯支付款"
 CHL_chile_payments_from_peru_desc: "由於最近購買了[951.GetName]，[PRU.GetNameDef]每月向我們支付一大筆款項，刺激了我們的經濟。"
 CHL_puppeteering_idea: "陰影下的規則"
 CHL_puppeteering_idea_desc: "一個人不能僅僅通過征服一切並試圖為自己加冕成為國王來統治。他必須找到忠誠的臣民，並把他們放在他征服的敵人的寶座上，就像偉大的拿破崙·波拿巴曾經做過的那樣！"
 BOL_plurinational_democracy: "民主多民族主義"
 BOL_plurinational_democracy_desc: "我們的國家由一個政體內多個封閉或保存下來的民族群體共存所定義。在[BOL.GetNameDef]，民族性是多元的，意味著在一個有組織的社區或人民團體中有許多民族。"
