 #Legacy Content
 USA_monroe_doctrine_idea: "門羅主義"
 USA_monroe_doctrine_idea_desc: "美國長期以來一直承諾保護西半球不受殖民列強的外部干涉，這意味著任何對我們領土的入侵都可能意味著美國將來援助我們。然而，如果我們的政治路線不再與美國一致，我們可能會發現自己不受保護。"
 USA_monroe_doctrine_enforcer: "門羅主義執行者"
 USA_monroe_doctrine_enforcer_desc: "自19世紀中葉以來，我們一直努力保護西半球免受殖民列強的外部干涉。儘管這一主義的特徵隨著時間的推移而演變，但其核心意味著我們在北美和南美的鄰國將期望我們在衝突時援助他們。當然，具體如何執行這一主義，取決於我們自己的政府。"
 idea_VEN_blockade_inactive: "封鎖未激活"
