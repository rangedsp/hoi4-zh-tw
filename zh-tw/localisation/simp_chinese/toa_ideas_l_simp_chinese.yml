 CHL_compania_general_electricidad: "智利通用電氣公司"
 CHL_compania_general_electricidad_desc: "智利通用電氣公司成立於1905年2月21日，由一群專業人士領導，其中包括工程師弗朗西斯科·胡尼烏斯·加納和勞爾·克拉羅·索拉爾。它是[ROOT.GetName]最大的電子開發公司。"
 CHL_compania_sudamerica_vapores: "南美航運公司"
 CHL_compania_sudamerica_vapores_desc: "南美蒸汽船公司是一家[CHL.GetAdjective]航運公司，成立於1872年，是目前是拉丁美洲同類公司中最大的，也是最古老的公司之一。它可以用來增加民用海船的產量。"
 CHL_via_trans_radio: "智利電報無線電公司"
 CHL_via_trans_radio_desc: "智利電報無線電公司成立於1928年9月26日，由美國無線電公司、英國的馬可尼無線電報公司、法國的無線電報通訊總公司和德國的無線電公司共同投資創辦。該公司提供國內外的無線電報服務，是[ROOT.GetName]最早的私營電信公司之一。"
 CHL_banco_central_de_chile: "智利中央銀行"
 CHL_banco_central_de_chile_desc: "智利中央銀行成立於1925年8月，由法令486號創建，該法案還規定了銀行在金本位制下發行銀行券的壟斷權。它是在阿圖羅·亞歷山德里擔任總統的第一屆任期內成立的。"
 CHL_compania_electro_industrial_valdivia: "瓦爾迪維亞電冶金和工業公司"
 CHL_compania_electro_industrial_valdivia_desc: "瓦爾迪維亞電冶金和工業公司是位於智利瓦爾迪維亞的一家鋼鐵工業公司。該企業被認為是阿爾托斯·奧諾斯·伊·阿塞里亞斯·德科拉爾的繼承者，它在1926年由瓦爾迪維亞的企業家創建，併購買了後者的基礎設施。"
 CHL_empresa_ferrocarries_del_estado: "國家鐵路公司"
 CHL_empresa_ferrocarries_del_estado_desc: "國家鐵路公司是智利國有的鐵路公司，也是智利歷史最悠久的國有企業。它負責管理國內的鐵路基礎設施並運營鐵路服務。"
 CHL_compania_manufacura_cartones: "紙張和紙板製造公司"
 CHL_compania_manufacura_cartones_desc: "紙張和紙板製造公司是一家[CHL.GetAdjective]的紙漿和紙張公司，總部位於聖地亞哥。它是該國最大的紙張製造商，公司於1920年成立，是卡爾頓·德爾·邁波和埃斯佩蘭薩以及商人路易斯·馬特·拉賴恩與德國工程師赫爾曼·埃賓豪斯的工廠的合併而成。"
 CHL_corporacion_fomento_production: "智利生產促進公司"
 CHL_corporacion_fomento_production_desc: "奇廉地震後成立的智利生產促進局是為了向受災者分發物資，並幫助控制、分發和運輸[ROOT.GetAdjective]境內的商品貨物"
 CHL_fabricas_maestranzas_ejercito: "陸軍工廠與車間"
 CHL_famae_corvo: "“威利斯-陸軍工廠-科爾沃”多用途車"
 CHL_arsenales_de_marina: "海軍兵工廠"
