 BRA_radio_nacional_idea: "國家廣播電臺"
 BRA_radio_nacional_idea_desc: "隨著國家廣播電臺的建立，政府現在有了與公眾直接溝通的方法。我們可以用它來確保他們獲得最客觀、最新的信息，或者僅僅是我們想讓他們知道的信息。"
 BRA_anaue_idea: "阿瑙埃"
 BRA_anaue_idea_desc: "土著問候語“阿瑙埃”作為整合主義運動的戰鬥口號獲得了新的生命。身穿綠色制服的該黨成員在街頭高呼這一口號，這句話給民族主義者灌輸了自豪感，給反對派灌輸了焦慮。"
 BRA_ethical_internationalism_idea: "倫理國際主義"
 BRA_ethical_internationalism_idea_desc: "$BRA_ethical_internationalism$"
 BRA_secure_our_borders_idea: "保護我們的邊境"
 BRA_secure_our_borders_idea_desc: "$BRA_secure_our_borders$"
 BRA_army_reward: "獎勵陸軍忠誠"
 BRA_navy_reward: "獎勵海軍忠誠"
 BRA_psad_idea: "公共服務行政部門"
 BRA_psad_idea_desc: "公共服務行政部門的任務是通過整合和重新組織各個部門的前身，建立一體的、現代化的部門，幫助政府維持良好的制度和經濟運作。"
 BRA_commonwealth_idea: "葡語國家聯盟成員國"
 BRA_commonwealth_idea_desc: "該國是葡語國家聯盟的成員，葡語國家聯盟是一個主要語言為葡萄牙語，並且擁有緊密歷史聯繫的團體。成員國已同意在技術和外交政策等共同關注的問題上相互合作。"
 BRA_proletarian_equality: "無產階級的平等"
 BRA_proletarian_equality_desc: "$BRA_equality_for_women_desc$"
 BRA_promoting_communism: "共產思潮崛起"
 BRA_promoting_communism_desc: "巴西試圖通過支持各種共產主義聯盟來影響我們的政局。"
 BRA_sway_the_neighbors_lar: "影響鄰國的情報活動"
