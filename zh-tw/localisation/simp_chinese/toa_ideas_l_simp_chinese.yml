 SOV_ARG_BRA_rubin_design_bureau_manufacturer: "魯賓"
 ARG_argentina_for_all_idea: "人人享有阿根廷"
 ARG_argentina_for_all_idea_desc: "我們偉大的國家擁有如此眾多多元的居民，長期以來將這些人民團結在一起幾乎是不可能的任務。現在是我們改變方法的時候了。[ARG.GetNameDef]應該成為一個歡迎並接納所有稱其為家園的人的國家。"
 ARG_us_army_training_idea: "$ARG_us_army_training$"
 ARG_us_army_training_idea_desc: "由於與[USA.GetNameDef]的關係更密切，我們已經能夠將他們的訓練制度納入我們的軍隊。如果我們像[USA.GetNameDef]那樣訓練我們的軍隊，我們將擁有一支更強大、更具韌性的軍隊。"
 ARG_monroe_doctrine_idea: "堅持門羅主義"
 ARG_monroe_doctrine_idea_desc: "長期以來，門羅主義一直被視為防止歐洲干涉西半球的一種方式。如果我們要在戰爭的衝擊中倖存下來，堅持這一原則至關重要。"
 ARG_argentina_first_idea: "$ARG_argentina_first$"
 ARG_argentina_first_idea_desc: "獨自前行從不容易，尤其是當我們在南美洲大陸有如此宏偉的征服目標時。然而，如果我們與歐洲的法西斯運動糾纏在一起，我們可能會失去對我們真正目標的關注：一個統一的南美洲。"
 ARG_united_workers_idea: "團結的工人"
 ARG_united_workers_idea_desc: "工人是社會主義革命的中堅力量。無產階級團結起來，反對資本主義在[ARG.GetNameDef]蔓延的腐敗和欺詐。"
 ARG_agrarian_reforms_idea: "土地改革"
 ARG_agrarian_reforms_idea_desc: "$ARG_support_the_farmers_decisions_desc$"
