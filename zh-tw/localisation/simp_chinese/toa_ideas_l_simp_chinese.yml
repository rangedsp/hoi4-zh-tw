 JUNO_natal_base_sharing: "納塔爾空軍基地共享"
 ToA_aid_against_communists: "反共旅"
 ToA_aid_against_communists_desc: "美國政府對那些裝備精良、訓練有素的志願軍視而不見，他們正在前往海外，幫助全球抗擊共產主義。"
 ARG_resource_extration_focus: "重視資源開採"
 ARG_ferrocarriles_argentinos: "阿根廷鐵路公司"
 ARG_construction_guilds_idea: "阿根廷建築行業協會"
 ARG_roca_runciman_new_partner_idea: "拉普拉塔條約"
 ARG_argentine_beef_trade_idea: "阿根廷牛肉貿易"
 BRA_defense_of_the_fatherland_idea: "走向對美洲的統治"
 BRA_defense_of_the_fatherland_idea_desc: "$BRA_domination_of_the_americas$"
 BRA_neglected_state_dynamic_modifier: "被忽視的地區"
 BRA_neglected_state_dynamic_modifier_desc: "連續幾屆政府對該地區的投資長期不足，導致基礎設施缺乏、失業和對中央政府的不滿。"
 BRA_growing_state_dynamic_modifier: "不斷壯大的地區"
 BRA_growing_state_dynamic_modifier_desc: "通過中央政府的大力投資和發展，現在這個地區的經濟正在增長，並將在未來幾年實現全面工業化。"
 BRA_modify_economy_intro: "§Y$BRA_undiversified_economy_modifier$§!追加效果："
 BRA_rail_investment: "鐵路投資"
 BRA_rail_investment_desc: "$BRA_invest_in_railways_desc$"
 BRA_road_investment: "道路投資"
 BRA_road_investment_desc: "$BRA_invest_in_road_infrastructure_desc$"
 BRA_port_investment: "港口投資"
 BRA_port_investment_desc: "$BRA_invest_in_ports_desc$"
 BRA_new_capital_modifier: "新首都建設"
 BRA_new_capital_modifier_desc: "我們正在國家的中心地帶建立一個新首都，以減輕農村地區的孤立感。"
 BRA_separatism_idea: "分離主義情緒"
 BRA_separatism_idea_desc: "全國範圍內有許多人對巴西中央政府抱怨不滿，或者對支持國家較不富裕的地區感到憤怒。過去，這些情感曾導致短暫的分離主義運動，使他們的地區脫離國家。如果我們不能儘快穩定政治局勢，這些運動可能會導致巴西的分裂。"
 BRA_propaganda_idea: "宣傳部"
 BRA_propaganda_idea_desc: "在這樣一個不穩定的時期，我們必須確保公眾只獲得他們繼續工作和支持政府所需的信息。"
 BRA_cangaceiro_state: "地區內有坎加索活動"
 BRA_cangaceiro_state_desc: "巴西東北部曾經出現過權力真空，導致了被稱為“坎加索”的土匪的崛起。這些土匪已經在該地區肆虐了幾十年，而且經常得到當地同情他們的人的支持。在我們完全失去對該地區的控制之前，我們必須對他們持續的搶劫和謀殺採取行動。"
 BRA_disrupt_bolivar_LaR: "反間諜資金"
 BRA_disrupt_bolivar_LaR_desc: "外國情報機構在這裡的肆無忌憚的行為已經太久了。有了新的資金，我們將確保在事先不知情的情況下不會發生任何事情。"
 BRA_disrupted_bolivar: "玻利瓦爾計劃中斷"
 BRA_disrupt_bolivar_no_lar: "玻利瓦爾計劃中斷"
 BRA_good_neighbor_policy: "睦鄰政策"
 BRA_good_neighbor_policy_desc: "$BRA_cooperation_in_the_americas_desc$"
 BRA_accepted_washington_accords: "華盛頓協定被接受"
 BRA_rejected_washington_accords: "華盛頓協定被否決"
 BRA_washington_accords_idea: "華盛頓協定"
 BRA_washington_accords_idea_desc: "$BRA_washington_accords$"
 BRA_departamento_de_political_e_social_no_lar: "政治和社會秩序部"
 BRA_departamento_de_political_e_social_no_lar_desc: "$BRA_departamento_de_political_e_social_no_desc$"
 BRA_supporting_operation_bolivar: "支持玻利瓦爾計劃"
 BRA_aid_operation_bolivar: "玻利瓦爾計劃"
 BRA_aid_operation_bolivar_desc: "$BRA_expand_operation_bolivar_desc$"
 BRA_international_crisis: "國際危機"
 BRA_international_crisis_desc: "$BRA_the_international_crisis_desc$"
 BRA_unwilling_subjects: "不情願的臣民"
 BRA_unwilling_subjects_desc: "隨著君主制再次逐漸主導國家政治體制，人們對再次成為獨裁者的臣民感到不安和沮喪。"
 BRA_federal_republic: "採納聯邦制"
 BRA_federal_republic_desc: "$BRA_greater_federalism_desc$"
 BRA_presidential_republic: "總統制共和國"
 BRA_presidential_republic_desc: "這個國家需要強有力的、果斷的領導才能團結人民，保衛我們的疆土。為此，我們正在將政治權力集中在共和國總統手中，儘管我們必須確保有強有力的制衡，以防止另一個瓦加斯試圖奪取權力。"
 BRA_tax_haven: "新興的避稅天堂"
 BRA_tax_haven_desc: "針對企業的低稅收和稅務漏洞導致越來越多的跨國公司遷往巴西。我們從他們那裡得到一些稅收總比什麼都沒有好。"
 BRA_nationalized_banks: "國有銀行"
 BRA_nationalized_banks_desc: "通過將銀行國有化，我們可以加強對經濟中貨幣供應的控制，並將資金從股東口袋中重新分配到工人手中。"
 #BRA_court_the_military_ideaa: "Courting the Military"
 #BRA_court_the_military_ideaa_desc: "We can not maintain our grip on power without the established influence and resources of the military. At least for the time being, we must try to keep them on our side."
 BRA_collaboration_with_the_church: "與教會合作"
 BRA_collaboration_with_the_church_desc: "教會對許多巴西人來說至關重要。通過與他們協商政策，我們可以獲得他們對我們政府的廣泛支持。"
 BRA_atheist_state: "無神論國家"
 BRA_atheist_state_desc: "作為一個注重科學進步的國家，我們不能把時間花在討好神職人員上。一個國家的行政管理和人民的宗教信仰不應該混為一談，我們打算保持這種狀態。"
 BRA_collectivized_agriculture: "農業集體化"
 BRA_collectivized_agriculture_desc: "通過農業集體化，我們提高了農業生產效率，加強了人民的共產主義意識形態。"
 BRA_article_138: "第138條"
 BRA_article_138_desc: "$BRA_implement_article_138_desc$"
 BRA_court_the_military_idea: "討好軍方"
 BRA_court_the_military_idea_desc: "如果沒有軍隊的現有影響力和資源，我們就無法維持對權力的控制。至少目前，我們必須設法使他們站在我們這一邊。"
 BRA_king_vassouras: "唐·佩德羅·恩裡克"
 BRA_king_vassouras_desc: ""
 BRA_king_petropolis: "唐·佩德羅·德·阿爾坎塔拉"
 BRA_king_petropolis_desc: ""
 BRA_us_of_brazil: "捍衛自由"
 BRA_us_of_brazil_desc: "自由和民主的理想是我們共和國建立的基礎。如有必要，我們將不惜一切代價在國內外捍衛這些價值觀。"
 BRA_radicalized_proletariat: "激進的無產階級"
 BRA_radicalized_proletariat_desc: "共產主義思想已在[BRA.GetNameDef]工人階級中紮根。在取悅他們和不得罪軍方之間，我們正在走一條微妙的路線。"
 BRA_aid_brazilian_communists: "援助巴西共產主義者"
 BRA_us_of_south_america: "南方的捍衛者"
 BRA_us_of_south_america_desc: "我們的領土已經擴展到了大陸的大部分地區。因此，我們將把捍衛所有以南美洲為家的人的權利作為我們的神聖職責。"
 BRA_stability_and_unity: "秩序與進步"
 BRA_stability_and_unity_desc: "通過謹慎的政治運作，我們成功地建立了一個更加強大和日益統一的共和國。在這個基礎上，我們將繼續保護我們偉大國家的公民。"
 BRA_romanticize_the_old_empire_idea: "帝制情結"
 BRA_romanticize_the_old_empire_idea_desc: "對巴西政府有不滿的人不在少數。通過重新點燃對帝制的感情和懷舊之情，我們將把這些分裂的派系團結在一起，形成統一的力量。"
 BRA_undermine_democracy_idea: "破壞民主"
 BRA_undermine_democracy_idea_desc: "$BRA_undermine_democracy_desc$"
 BRA_modify_neglected_state: "§Y$BRA_neglected_state_dynamic_modifier$§!/§Y$BRA_growing_state_dynamic_modifier$§!追加效果："
 BRA_liberated_by_communist_brazil: "由[BRA.GetNameDefCap]解放"
 BRA_liberated_by_communist_brazil_desc: "我們國家終於從殖民者手中贏得了應有的獨立。在[BRA.GetNameDef]的幫助下，我們再次成為一個自由的國家。他們的行動顯然是在幫助我們，他們所宣揚的共產主義思想開始在我們的人民中紮根。"
 BRA_expanding_the_revolution: "擴大革命"
 BRA_expanding_the_revolution_desc: "革命已經帶到了[BRA.GetNameDef]，我們現在必須超越國界。為了我們在[BRA.GetNameDef]以外的同志，現在是傳播革命的時候了。"
 BRA_banco_do_brasil_idea: "巴西銀行"
 BRA_banco_do_brasil_idea_desc: "$BRA_banco_do_brasil_desc$"
 BRA_cprm_idea: "馬可尼廣播電臺"
 BRA_ef_central_do_brasil_idea: "巴西中央鐵路公司"
 BRA_lloyd_brasileiro_idea: "巴西勞埃德航運公司"
 BRA_departamento_nacional_do_cafe_idea: "國家咖啡部"
 BRA_brown_water_navy_idea: "擴編褐水海軍"
 BRA_brown_water_navy_idea_desc: "$SMB_brown_water_navy_desc$"
 BRA_brown_water_navy_idea_bonus_tt: "所有步兵：\n §Y河流：§!\n 移動：§G+10%§!\n 攻擊：§G+10%§!\n 防禦：§G+5%§!"
 ARG_political_corruption_modifier: "政治腐敗"
 ARG_political_corruption_modifier_desc: "多年來，[ARG.GetNameDef]一直被政府內部猖獗的腐敗所困擾。雖然人們認為，如果允許建立協和同盟，這種情況可能會減少，但欺詐性投票和選民恐嚇仍然存在。"
 ARG_modify_corruption_ns_intro: "§Y$ARG_political_corruption_modifier$§!追加效果："
 ARG_international_loan_modifier: "國際貸款"
 ARG_international_loan_modifier_desc: "在危機時期，一個國家向世界其他國家尋求財政援助並不罕見。鑑於[ROOT.GetNameDef]目前的經濟狀況，接受在這場衝突中發揮作用的主要大國的援助是完全合理的。"
 ARG_modify_international_loan_intro: "§Y$ARG_international_loan_modifier$§!追加效果："
 ARG_corruption_crackdown_modifier: "$ARG_crack_down_on_corruption$"
 ARG_corruption_crackdown_modifier_desc: "困擾我國政府的腐敗是完全不能接受的。多虧了羅伯托·瑪麗亞·奧爾蒂斯的政策，我們終於能夠開始終結政客們參與的明目張膽的欺詐活動。"
 ARG_anti_corruption_modifier: "反腐敗政策"
 ARG_anti_corruption_modifier_desc: "困擾我國政府的腐敗是完全不能接受的。多虧了馬塞洛·托爾誇托·德阿爾韋亞爾的政策，我們終於能夠開始終結政客們參與的明目張膽的欺詐活動。"
 ARG_infamous_decade_idea: "臭名昭著的十年"
 ARG_infamous_decade_idea_desc: "“臭名昭著的十年”是阿根廷歷史上的一個時期，始於1930年針對總統伊波利托·伊裡戈延的政變。這是一個有兩個特點的時代。一方面，大蕭條後大量農村人口外流，另一方面，公然的選舉舞弊使保守派政府得以長期執政。"
 ARG_infamous_decade_2_idea: "$ARG_infamous_decade_idea$"
 ARG_infamous_decade_2_idea_desc: "$ARG_infamous_decade_idea_desc$"
 ARG_infamous_decade_3_idea: "$ARG_infamous_decade_idea$"
 ARG_infamous_decade_3_idea_desc: "$ARG_infamous_decade_idea_desc$"
 ARG_infamous_decade_4_idea: "$ARG_infamous_decade_idea$"
 ARG_infamous_decade_4_idea_desc: "$ARG_infamous_decade_idea_desc$"
 ARG_public_works_investment_idea: "公共工程投資"
 ARG_public_works_investment_idea_desc: "[ARG.GetAdjective]政府必須資助和採購用於娛樂、就業、衛生和安全用途的公共工程項目。這將有助於提高整個[ARG.GetAdjective]社區的生活質量。"
 ARG_towards_a_greater_argentina_idea: "$ARG_towards_a_greater_argentina$"
 ARG_towards_a_greater_argentina_idea_desc: "[ARG.GetNameDefCap]在20世紀初遭受了巨大的損失，經歷了大蕭條的衝擊和隨後開始的“臭名昭著的十年”。儘管不斷有選舉舞弊、政變企圖和腐敗的政府官員，我們仍然能夠成為一個穩定而高效的國家。"
 ARG_economic_reactivation_idea: "經濟復甦"
 ARG_economic_reactivation_idea_desc: "經濟復甦法案是一項旨在確保更多政府資金流入經濟和工業部門發展的立法措施。"
 ARG_civilian_economy_boost_idea: "發展民用經濟"
 ARG_civilian_economy_boost_idea_desc: "通過精心的規劃和妥善的捐贈，我們已經能夠充分發展我們的民用經濟。我們的公民可以享受的便利設施的增加意味著國民幸福指數將隨著時間的推移而緩慢上升。"
 ARG_invest_in_roads_idea: "投資道路"
 ARG_invest_in_roads_idea_desc: "高速公路對[ARG.GetNameDef]的經濟、工業和軍事能力至關重要。我們對它們的建設和維護的投資將在未來數年對我們大有裨益。"
 ARG_invest_in_railways_idea: "投資鐵路"
 ARG_invest_in_railways_idea_desc: "在現代，每個行業都依賴於國家鐵路服務的支持。隨著我們在全國範圍內擴建鐵路，我們為從農村向城市運送貨物打下了堅實的基礎。"
 ARG_roca_runciman_treaty_idea: "羅卡-朗西曼條約"
 ARG_roca_runciman_treaty_idea_desc: "《羅卡-朗西曼協定》是[ARG.GetNameDef]和[ENG.GetNameDef]於1933年5月簽署的一項重要貿易協定，保證了[ARG.GetNameDef]在[ENG.GetAdjective]肉類市場的固定份額。作為交換，[ARG.GetNameDef]同意在貿易和貨幣兌換方面實施限制，維護[ENG.GetNameDef]在該國的商業利益。"
 ARG_eden_malbran_treaty_idea: "伊登-馬爾夫蘭條約"
 ARG_eden_malbran_treaty_idea_desc: "作為對《羅卡-朗西曼協定》中施加的苛刻限制的回應，名為《伊登-馬爾夫蘭條約》的新協議已經談判完成。這使得[ENG.GetNameDef]在降低小麥運費成本的同時獲得了額外的優惠。"
 ARG_raf_cooperation_idea: "英國皇家空軍合作"
 ARG_raf_cooperation_idea_desc: "隨著世界各地的衝突繼續肆虐，我們必須盡我們所能支持我們的盟友。與[ENG.GetNameDef]皇家空軍的密切合作肯定會使我們的飛行員達到更現代化的標準。"
 ARG_argentine_beef_idea: "阿根廷牛肉"
 ARG_argentine_beef_idea_desc: "自西班牙征服者於1536年首次將牛帶到[ARG.GetNameDef]以來，牛肉一直是阿根廷傳統美食的支柱。正因如此，我們的牛肉世界聞名，進而對其出口有著巨大的需求。"
 ARG_argentine_metropole_idea: "阿根廷的現代都市"
 ARG_argentine_metropole_idea_desc: "直到最近，我國一直以農村農業和採礦社區為經濟支柱。然而，隨著我們在20世紀的持續發展，時代已經發生了變革，[ARG.GetAdjective]人理想的生活方式也發生了轉變。大量人口湧入我們現今擴張和繁榮的城市，希望在此安家落戶，並適應現代都市化的生活方式。"
 ARG_our_own_path_idea: "$ARG_our_own_path$"
 ARG_our_own_path_idea_desc: "儘管我們經歷了很多艱辛才走到了這一步，[ARG.GetNameDef]仍然能夠自立自強，不向其他國家、陣營和集團屈服。在這個動盪的時代，我們選擇自己的道路。"
 ARG_british_cooperation_idea: "$ARG_british_cooperation$"
 ARG_british_cooperation_idea_desc: "[ENG.GetNameDefCap]一直是我們最長期的貿易伙伴之一。隨著我們繼續維護我們的眾多條約和協議，我們可能會發現我們的意識形態開始趨向於與他們一致。"
 ARG_subdue_dissension_idea: "平息糾紛"
 ARG_subdue_dissension_idea_desc: "持續不斷的軍事紛爭終於平息了。這應該成為我們未來警惕政府各個部門內部不安定的教訓。"
 ARG_improved_cooperation_idea: "提升合作"
 ARG_improved_cooperation_idea_desc: "[ARG.GetNameDefCap]與[ENG.GetNameDef]的利益正趨於一致。"
 ARG_refused_embargo_idea: "拒絕禁運請求"
 ARG_refused_embargo_idea_desc: "[ARG.GetNameDefCap]拒絕了針對軸心國實施禁運的請求"
 ARG_maintain_neutrality_idea: "獨善其身"
 ARG_maintain_neutrality_idea_desc: "我們已經表明我們對世界範圍內的大沖突沒有興趣。讓這句話向所有人表明，[ARG.GetNameDef]堅定地獨善其身。"
 ARG_american_allyship_idea: "與華盛頓關係密切"
 ARG_american_allyship_idea_desc: "在美洲合作的精神下，我們已經加強了與[USA.GetNameDef]的政治關係。當我們站在蒙羅主義的重要原則下共同行動時，來自歐洲大國的任何事物都無法分裂我們的團結。"
 ARG_envoy_to_london_idea: "與倫敦關係密切"
 ARG_envoy_to_london_idea_desc: "只要我們繼續支持彼此，[ARG.GetNameDef]就是[ENG.GetNameDev]的朋友。我們兩國保持政治聯繫並確保我們的目標保持一致，這一點非常重要。"
 ARG_counter_interlligence_program_idea: "阿根廷反間諜計劃"
 ARG_counter_interlligence_program_idea_desc: "間諜活動是我們在這場全球衝突中必須面對的眾多戰線之一，因此能夠有效啟用我們自己的反間諜計劃對於在這場戰爭中生存至關重要。我們已經採取了側重於防禦政策而不是攻擊性秘密行動策略的立場。"
 ARG_disrupt_bolivar_lar: "對抗玻利瓦爾計劃"
 ARG_disrupt_bolivar_lar_desc: "玻利瓦爾計劃多年來一直是我們的眼中釘，現在輪到我們採取立場對抗這種卑鄙的敵對間諜行為了。"
 ARG_cut_ties_with_britain_idea: "與英國斷交"
 ARG_cut_ties_with_britain_idea_desc: "[ARG.GetNameDefCap]與我方斷交。"
 ARG_disrupt_bolivar_no_lar: "被中斷的玻利瓦爾計劃"
 ARG_disrupt_bolivar_no_lar_desc: "$ARG_disrupt_bolivar_lar_desc$"
 ARG_red_scare_idea: "紅色恐慌的影響"
 ARG_red_scare_idea_desc: "這兩個國家之間圍繞意識形態的緊張關係已經開始浮現。"
 ARG_anti_soviet_idea: "反蘇情緒"
 ARG_anti_soviet_idea_desc: "共產主義的威脅和它對我們國家的危險是不容忽視的。[SOV.GetNameDefCap]繼續證明自己有能力摧毀我們現有的生活方式。人們害怕紅色威脅，而他們也理應如此！"
 ARG_buying_the_islands_idea: "購買南大西洋諸島"
 ARG_buying_the_islands_idea_desc: "事實證明，購買兩個完整的島嶼是相當昂貴的。我們將在一段時間內還清這筆債務。"
 ARG_siam_di_tella: "特利亞攪拌機械工業公司"
 ARG_chade_cade: "查德-凱德"
 ARG_anti_british_sentiment_idea: "反英情緒"
 ARG_anti_british_sentiment_idea_desc: "自從我們與[ENG.GetNameDef]斷交以來，一波反英情緒就進入了我們的政府。我們不再受制於他們的條約和貿易協定！現在我們可以更專注於更重要的事情：戰爭。"
 ARG_growing_nationalism_modifier: "不斷壯大的民族主義運動"
 ARG_growing_nationalism_modifier_desc: "阿根廷民族黨在全國範圍內掀起了波瀾，因此越來越多的人加入他們的行列，支持他們不斷壯大的意識形態。阿根廷民族主義遵循著復興[ARG.GetAdjective]人身份認同並將自己鞏固為南美主要強國的理念。"
 ARG_modify_growing_nationalism_ns_intro: "§Y$ARG_growing_nationalism_modifier$§!追加效果："
 ARG_military_government_idea: "軍政府"
 ARG_military_government_idea_desc: "佩德羅·巴勃羅·拉米雷斯已經接管了政府，並建立了一個由軍方主導的國家。由於協和同盟之前充滿腐敗和欺詐，使許多人呼籲變革，從而導致了這一政權變動。軍政府的綱領側重於[ARG.GeAdjective]的擴張主義政策，因此我們的國家未來肯定會面臨許多衝突。"
 ARG_spirit_of_the_conquistadors_idea: "征服者精神"
 ARG_spirit_of_the_conquistadors_idea_desc: "正是征服者的輝煌事蹟將我們的人民帶到了這片美麗的白銀之地。他們在我們的歷史中起到了重要作用，現在成為尼米奧·德安金的民族主義新政府的靈感來源。[ARG.GetNameDefCap]將隨著我們征服較弱的鄰國而不斷壯大，成為南美洲的主導力量。"
 ARG_rapid_militarization_idea: "快速軍事化"
 ARG_rapid_militarization_idea_desc: "快速軍事化是一個社會為軍事衝突和暴力而組織起來的過程。我們已經全力發展我們的軍工複合體，併為即將到來的戰鬥做好準備。"
 ARG_argentine_nationalism_idea: "阿根廷民族主義"
 ARG_argentine_nationalism_idea_desc: "作為[ARG.GetAdjective]人，我們有很多值得自豪的地方，因此我們繼續鼓勵國內的人民認同並支持我們國家的利益。我們不需要那些試圖實施嚴厲規定或威脅我們以發動戰爭的傢伙的幫助。[ARG.GetNameDefCap]是一個獨立自主的主權國家。"
 ARG_war_division_idea: "戰爭部"
 ARG_war_division_idea_desc: "現在我們的國家已經鞏固了政府，建立了強大的經濟，我們終於從人民那裡獲得了足夠的支持，得以準備實現我們的擴張目標。"
 ARG_preparing_for_war_idea: "備戰"
 ARG_preparing_for_war_idea_desc: "南美洲大陸在我們頭頂隱隱呈現，時機成熟，只待採摘。我們的軍隊為戰爭做好了準備，而我們的政治家和外交官則狂熱地製作文件和最後通牒，為我們的征服做準備。我們如響尾蛇般已蓄勢待發。"
 ARG_spirit_of_the_cisplatine_war_idea: "內普拉塔戰爭的精神"
 ARG_spirit_of_the_cisplatine_war_idea_desc: "內普拉塔戰爭通常也被稱為阿根廷-巴西戰爭。這是19世紀20年代發生的一場武裝衝突，從那以後，我們兩國之間一直保持著緊張而不穩定的和平。現在情況已經不同了。[BRA.GetNameDefCap]是一個需要處理的威脅。我們的軍隊帶著我們往昔的精神前進。"
 ARG_integrate_operation_bolivar_idea_lar: "整合玻利瓦爾計劃"
 ARG_integrate_operation_bolivar_idea_lar_desc: "由於我們與軸心國的關係愈加緊密，我們已經成功開始整合玻利瓦爾計劃，並努力通過我們自己的間諜計劃來援助南美洲戰區。"
 ARG_integrate_operation_bolivar_idea_no_lar: "整合玻利瓦爾計劃"
 ARG_integrate_operation_bolivar_idea_no_lar_desc: "$ARG_integrate_operation_bolivar_idea_lar_desc$"
 ARG_anti_american_idea: "反美情緒"
 ARG_anti_american_idea_desc: "$ARG_red_scare_idea_desc$"
 ARG_anti_american_propaganda_idea: "反美宣傳"
 ARG_anti_american_propaganda_idea_desc: "[USA.GetNameDefCap]是我們政權的一個明顯威脅。儘管大家都知道他們是沉睡的巨人，但我們永遠無法知道他們何時會決定醒來並把注意力轉向我們。多虧了我們的宣傳部門，我們的軍隊已經準備好應對[USA.GetAdjective]對北部的威脅。"
 ARG_state_unions_idea: "國家工會"
 ARG_state_unions_idea_desc: "工會是決心維護和改善他們就業條件的工人組織。這些條件包括更好的工資和福利、更安全的工作環境，以及確保普通工人不受管理層的不公平對待。"
 ARG_FJC_empowered_idea: "賦權阿根廷共產主義青年聯盟"
 ARG_FJC_empowered_idea_desc: "阿根廷共產主義青年聯盟是該國曆史上最有影響力的青年政治組織之一。它是與阿根廷共產黨保持一致的青年組織，成立於1921年，旨在在阿根廷青年中推廣黨的政策。隨著阿根廷共產黨現在完全掌握政府的控制權，阿根廷共產主義青年聯盟可以繼續培養和發展阿根廷的年輕人，使他們成為成熟的革命者！"
 ARG_state_atheism_idea: "國家無神論"
 ARG_state_atheism_idea_desc: "國家無神論是將堅決無神論納入政治體制的做法。許多人認為它是神學的完全對立面，這是許多共產主義國家仿效蘇聯初次掌權時採納的常見政策。"
 ARG_liberation_theology_idea: "解放神學"
 ARG_liberation_theology_idea_desc: "解放神學是一種強調解放被壓迫者的基督宗教的教義。作為一種宗教，它進行社會經濟分析，關注窮人的社會問題，並支持被壓迫民族的政治解放。解放神學是通過我們人民對宗教自由的渴望以及對我們革命目標的支持而形成的。"
 ARG_committee_of_state_security_idea_lar: "國家安全委員會"
 ARG_committee_of_state_security_idea_lar_desc: "阿根廷國家安全委員會以俄羅斯情報機構為藍本，旨在執行境外情報行動、反間諜和秘密警察職能。"
 ARG_committee_of_state_security_idea_no_lar: "$ARG_committee_of_state_security_idea_lar$"
 ARG_committee_of_state_security_idea_no_lar_desc: "$ARG_committee_of_state_security_idea_lar_desc$"
 ARG_socialist_unification_idea: "社會主義統一"
 ARG_socialist_unification_idea_desc: "通過我們光榮革命的力量，我們終於成功確立了自己作為南美洲大陸主導意識形態的地位。這場經過鮮血和勇氣贏得的戰爭，激發了我們人民為各個南美洲社會主義共和國建立一個更偉大的祖國的渴望。"
 ARG_eliminate_american_imperialism_idea: "猩紅日落行動"
 ARG_eliminate_american_imperialism_idea_desc: "北方的巨人長期以來一直是資本主義的堡壘。是時候終結美帝國主義，帶來猩紅的日落了。"
 ARG_women_in_industry_idea: "$ARG_women_in_industry$"
 ARG_women_in_industry_idea_desc: "既然一位女性成為了[ARG.GetNameDef]的領導人，那麼女性也應該擁有在其他行業工作的權利。勞動力將大大提高，我們可以期待我國經濟取得巨大進步。"
 ARG_socialist_volunteers_idea: "$ARG_socialist_volunteers$"
 ARG_socialist_volunteers_idea_desc: "為了保證國際革命的順利進行，我們必須在需要的時候向我們的社會主義國家同胞提供援助。如果我們有多餘的人力，我們一定要派志願軍到全世界去幫助同資產階級作鬥爭！"
 ARG_free_association_idea: "生產者自由聯合體"
 ARG_free_association_idea_desc: "自由聯合體，也稱為生產者自由聯合體，是個人之間的一種關係，其中不存在國家、社會階級、等級制度或生產資料的私有制。根據掌權的安那其工團主義者的說法，這將使個人能夠在沒有社會約束的情況下自由結社，不受社會限制，生產和再生產自己的生存條件。"
 ARG_no_gods_no_masters_idea: "解放！"
 ARG_no_gods_no_masters_idea_desc: "儘管這個大陸上的其他國家可能與我們的政府意見不合，但坐視他們被憤怒和好戰的侵略者征服將違揹我們的意識形態。如果我們的任何鄰國被入侵者佔領，我們必須挺身而出，解放他們。"
 ARG_regulated_salaries: "最低工資"
 ARG_regulated_salaries_desc: "我們已經採取措施，防止我們的受僱公民被國內產業低薪壓榨。與工業界和工人同時達成的協議已被證明對我們國家非常有益。"
 ARG_social_welfare_fund_ns: "[ARG.GetAdjective]社會福利基金"
 ARG_social_welfare_fund_ns_desc: "[ARG.GetNameDef]提高了社會福利措施的支出。我們目前看到，預算的增加帶來了積極的影響，人們更加滿足，並且對政府的態度越來越積極。"
 ARG_british_argentine_agreement: "[ENG.GetAdjective]-[ARG.GetAdjective]協議"
 ARG_british_argentine_agreement_desc: "我們與[ENG.GetAdjective]達成了一項改善貿易條件的協議。從現在起，我們在與[ENG.GetAdjective]的貿易中將享有些許折扣。"
