 CHL_csav: "南美航運公司"
 CHL_famae_rama_de_artilleria: "陸軍工廠-火炮部"
 PAR_febrerista_land_reform: "二月土地改革"
 PAR_guarani_in_the_army: "軍中的瓜拉尼語"
 PAR_guarani_in_the_army_desc: "在查科戰爭期間，巴拉圭軍隊採用瓜拉尼語作為士兵和高級指揮官之間的交流語言，而不是西班牙語，以便他們的玻利維亞敵人不容易破譯它們，這被證明是非常有效的。"
 BOL_era_of_national_regression: "國家倒退的時代"
 BOL_era_of_national_regression_desc: "近幾十年來，玻利維亞經歷了許多艱難的時刻。首先是從1879年到1883年的南美太平洋戰爭，然後是從1899年到1903年的阿克里戰爭，最近的一次失敗是查科戰爭，發生在1932年到1935年。"
 BOL_era_of_national_regression_tt: "如果已重建大玻利維亞則將被移除：\n已完全控制§Y阿克里§!、§Y安托法加斯塔§!、§Y北查科§!。"
