 SMB_MTG_naval_arms_race_legacy: "海軍軍備競賽的遺產"
 SMB_MTG_naval_arms_race_legacy_desc: "雖然沒有正式條約阻止[BRA.GetAdjective]、[CHL.GetAdjective]或[ARG.GetAdjective]海軍的擴張，但自那次世界大戰以來，存在一種非明文規定的共識，阻止了這種情況發生。如果該地區的任何一個國家開始用新的主力艦武裝他們的艦隊，一場新的軍備競賽將不可避免。"
 SMB_organization_of_american_states_member: "美洲國家組織成員"
 BRA_undiversified_economy_modifier: "單一經濟"
 BRA_undiversified_economy_modifier_desc: "巴西過於依賴咖啡出口，在大蕭條來襲時，世界各國停止購買這種令人上癮的刺激物，導致巴西經濟陷入癱瘓。如果巴西希望繁榮發展，任何政府都必須將經濟多元化，發展新的領域。"
 BRA_weak_government: "軟弱的政府"
 BRA_weak_government_desc: "多年來的革命和未遂政變削弱了巴西政府的權威。1934年的憲法使情況變得更糟，這是一項在妥協中達成的協議，支持者寥寥無幾。無論巴西的未來如何，當前的政治安排顯然是站不住腳的。"
 BRA_aftermath_of_the_coup: "緊急狀態"
 BRA_aftermath_of_the_coup_desc: "1935年11月，共產黨發動了一場有可能演變成全面內戰的政變，國家宣佈進入緊急狀態。儘管政變被挫敗，總統仍未結束緊急狀態。政界的許多人現在擔心，政府將繼續使用緊急權力來平息任何進一步的異議。"
