 SMB_navy_URG: "烏拉圭國家海軍"
 SMB_mountain_guns: "投資山地火炮"
 SMB_mountain_guns_desc: "我軍注意到，雖然這種火炮可能非常強大，但目前在智利山區幾乎無法使用。因此，他們訂購了山地火炮，以便在山區更容易使用，這樣我們就可以繼續使用這種致命的武器。"
 SMB_tierra_del_fuego_training: "在火地島訓練"
 SMB_tierra_del_fuego_training_desc: "如果我們希望我們的士兵在寒冷的南方和山區有效地作戰，他們就需要接受相應的訓練。因此，我們必須確保為火地島的部隊設立訓練營，使他們能夠更好地適應寒冷。"
 SMB_atacama_training: "在阿塔卡馬沙漠訓練"
 SMB_atacama_training_desc: "如果我們希望我們的士兵能在炎熱的熱帶和沙漠中有效地作戰，他們就需要接受相應的訓練。解決這個問題的最好辦法是在阿塔卡馬沙漠建立訓練營，在那裡他們可以更好地適應高溫。"
 SMB_a_land_of_mountains: "群山之地"
 SMB_a_land_of_mountains_desc: "長期以來，[ROOT.GetName]在戰鬥中一直有利用山地地形的強大傳統，未來也不會例外。我們是一個習慣於生活在山區的民族，我們將利用我們的專業知識擊敗我們遇到的任何勁敵。"
 SMB_navy_desc: "[SMB_navy_desc_key]"
 SMB_navy_desc_default: "自那次世界大戰以來，我們的海軍已經停滯不前，以至於許多艦船不再適用。是時候投資艦隊，並開始一項大規模現代化計劃。"
 SMB_CHL_navy_desc: "雖然我們的艦隊有著悠久而自豪的傳統，但海軍在1931年的海軍暴動中聲望受損。通過投資智利海軍，我們可以幫助重建公眾對海軍的信心。"
 SMB_naval_academy_desc: "[SMB_naval_academy_desc_key]"
 SMB_naval_academy_default_desc: "僅僅生產和維護艦船是不足以構成一支海軍的。我們需要訓練有素的軍官和專家來學習如何在戰鬥中利用海軍資產。因此，我們將建立[ROOT.GetAdjective]海軍學院來培養下一代海軍軍官。"
 SMB_naval_academy_CHL_desc: "我們的海軍學校有著培訓熟練海軍軍官的悠久歷史，但持續投資對於確保我們的海軍將官和船長們準備好應對現代海戰至關重要。"
 SMB_construct_naval_bases_desc: "我們的海軍設施陳舊，亟需現代化。通過投資這些設施，我們將能夠建造和支持更強大的海軍資產。"
 SMB_naval_foreign_advisors_desc: "我們的海軍軍官最近很少有機會在戰鬥中檢驗他們的能力。因此，我們可以邀請外國海軍軍官來用現代海軍戰術訓練我們自己的軍官，我們將以此獲益。"
 SMB_reescalate_the_naval_arms_race_desc: "雖然我們與鄰國沒有就海軍規模達成正式協議，但自那次世界大戰以來，我們一直避免過度擴張海軍。然而，戰爭再次出現在地平線上，我們最好在重整軍備方面領先於我們的鄰國。"
 SMB_blue_water_fleet_desc: "海軍力量投射對任何渴望加入大國行列或保持強大威懾力量的國家都是至關重要的。因此，我們應該確保我們的海軍擁有優質的裝備和訓練，即使在遠離母港的地方也能有效行動。"
 SMB_coastal_fleet_desc: "我們不太想在全球範圍內打仗。因此，我們艦隊的首要目標應該是保護我們的海岸線，防止任何敵人登陸我們的海岸。"
 SMB_purchase_cruisers_and_dreadnoughts_desc: "雖然我們的工業實力持續增長，但時間並不站在我們這一邊。為了充分加強我們的海軍，我們需要儘快增加主力艦艇。因此，我們將與大國接觸，看看他們是否願意出售他們封存的無畏艦和巡洋艦。"
 SMB_minelaying_desc: "維持足夠數量的艦船來隨時保衛我們廣闊的海岸線可能是非常昂貴的。地雷提供了一個更便宜的解決方案，可以協助阻止或減緩敵軍，直到艦隊抵達。"
 SMB_escort_fleet_desc: "大型艦隊的時代已經過去了，現代海戰需要由小型船隻組成的艦隊與有限數量的主力艦一起護航。因此，海軍需要重新調整他們的計劃，以適應這種戰術。"
 SMB_raiding_fleet_desc: "海軍補給線對大多數經濟體的運轉至關重要。利用我們的海軍力量來破壞這些補給線可能是一種讓最強大的國家屈服的方式。"
 SMB_degaussing_desc: "我們將開始對我們的船體進行消磁，減少它們的磁信號。這將保護它們免受磁性水雷的傷害，並減少船隻的電子特徵。"
 SMB_naval_invasion_desc: "對付敵國通常需要士兵登陸他們的海岸。為了最大限度地發揮我們執行這種行動的能力，我們將開始進行陸海軍聯合演習的訓練。"
 SMB_cruiser_subs_desc: "大西洋和太平洋無比遼闊，需要能夠長時間高效自主運作的潛艇。因此，我們需要投資發展我們自己的巡洋潛艇。"
 SMB_midget_subs_desc: "在浩瀚的海洋中行動的自給自足的潛艇是徒勞無用的。我們可以更好地利用我們的資源，建造在我們海岸線淺水海域行動的較小艦船。"
 SMB_expand_repair_yards_desc: "即使是擁有最高效船員的最堅固的船隻，在重新服役之前也最終需要維修。我們應該投資我們的海軍修理廠，以確保這一過程儘快進行。"
 SMB_enlarge_naval_facilities_desc: "全球最近的事態發展清楚地表明，如果我們要維持一支適應時代的艦隊，我們的海軍必須得到加強。實現這一目標的第一步是擴建我們現有的海軍設施。"
 SMB_merchant_marine_desc: "海上資源運輸對許多國家的國家安全至關重要，我國也不例外。因此，我們應該建立一支能夠在危機時刻支持我軍的專業商船隊。"
 SMB_aircraft_carriers_desc: "為了避免被敵人甩在後面，我們需要將飛機編入海軍。為了做到這一點，我們需要生產自己的航空母艦。利用我們的大型過時船隻的船體可能是加速它們生產的一種方法。"
 SMB_fortification_effort_desc: "雖然海軍和空軍是我們防止敵軍到達我們海岸的主要手段，但我們仍然應該維持一套堅固的沿海防禦工事，作為抵禦任何可能的入侵者的最後防線。"
