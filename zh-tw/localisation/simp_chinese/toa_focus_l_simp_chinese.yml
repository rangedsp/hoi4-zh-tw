 SMB_brown_water_navy: "褐水海軍"
 SMB_brown_water_navy_desc: "我國軍隊尚未充分利用南美叢林中的蜿蜒河流。我們應該用一些小型河流攻擊艇來擴編褐水艦隊，為遠離增援或補給的我國士兵提供支援。"
