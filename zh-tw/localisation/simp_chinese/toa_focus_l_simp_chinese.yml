 chilean_trade_deals_opinion_modifier: "有利的貿易協定"
 CHL_high_quality_nitrate: "高品質硝酸鹽"
 CHL_high_quality_nitrate_desc: "雖然我們的工業目前可能並不最強，但還有另一件事讓我們脫穎而出。那就是我們豐富的硝酸鹽，而且世界上大部分的硝酸鹽產量都在我們的境內。因此，我們可以確保我們獨自獲得最高質量的產品，而我們會出售不那麼精煉的硝酸鹽。"
 CHL_contract_efe: "與國家鐵路公司簽約"
 CHL_contract_efe_desc: "國家鐵路公司目前在運營我們的鐵路系統，通過確保我們對他們有更直接的控制和管理，我們可以保證他們的資源和優先事項被安排在我們想要的地方。"
 CHL_public_works: "公共工程項目"
 CHL_public_works_desc: "自從美國關閉邊境、停止出口導致經濟大崩潰以來，我們的經濟被毀、人心四散。為了儘可能有效地從這場災難中恢復過來，我們應該鼓勵大規模的公共工程項目，類似於美國的新政，以使我們的人民再次找到工作，並使經濟再次運轉起來。"
 CHL_dissolve_covensa: "解散硝碘銷售公司"
 CHL_dissolve_covensa_desc: "我們所有人都心知肚明，建立用於國內資源分配的智利硝石與碘鹽銷售公司就是一個錯誤。解決我國經濟問題的唯一方法是重啟大規模出口。為此，我們必須清算該機構並將其重組為類似其前身智利硝酸鹽公司的存在。"
 CHL_issue_bonds: "鼓勵購買債券"
 CHL_issue_bonds_desc: "對最近經濟崩潰的記憶讓我們的人民非常害怕投資，這阻礙了經濟增長。通過鼓勵我們的人民購買政府發行的債券，並承諾將資金重新投資回國家，我們可以更快地建立一個更強大的[CHL.GetName]。"
 CHL_expand_the_forestry: "擴大林業"
 CHL_expand_the_forestry_desc: "我國中部地區，特別是阿勞卡尼亞，木材資源豐富。雖然有些人反對在這些地區擴大木材產業，但如果我們希望我們的國家能夠獲得經濟安全，這是必須的，而獲得木材和清理土地是最快的方法。"
 CHL_expand_the_forestry_decision_tt: "解鎖在§Y[950.GetName]§!和§Y[279.GetName]§!§Y擴大林業§!的決議。\n"
 CHL_government_mandated_contracts: "政府補貼合約"
 CHL_government_mandated_contracts_desc: "為了讓更多的人工作，儘自己的一份力量，我們應該考慮補貼產業僱傭合同，由我們來支付部分工資。這樣，更多的公司可以放心地僱傭更多的人，更多的人可以有錢消費，並把錢投入到經濟中。"
 CHL_we_must_dig_deeper: "我們必須深入挖掘"
 CHL_we_must_dig_deeper_desc: "不存在挖得太深的問題，即使我們在自己的城市下面挖隧道，輕微地破壞它們的地基。如果我們要依靠出口來恢復經濟，我們就必須冒險，而且要快，儘可能多地開採我們的礦藏。"
 CHL_establish_trade_relationships: "建立有利的貿易關係"
 CHL_establish_trade_relationships_desc: "成功的貿易有多種要求，擁有所需的資源並不是唯一的要求。我們還需要可以信任的貿易伙伴，以及不會以過低的價格出售我們的勞動力和自然資源的合同。因此，我們應該同我們在美洲的兄弟姐妹進行接洽，以確保我們瞭解那些我們的貿易伙伴。"
 CHL_international_loans: "國際貸款"
 CHL_international_loans_desc: "我們的前總統卡洛斯·伊瓦涅斯·德爾坎波試圖利用外國勢力的貸款來解決經濟危機，並將這些錢投資到國家，希望能夠從中產生足夠的價值，以便以後償還，這種策略在某種程度上是成功的。我們應該嘗試跟隨他的腳步，再做一次同樣的事情。"
 CHL_CHL_international_loans_tt: "解鎖從外國§Y貸款§!以提振經濟的決議"
 CHL_connect_the_northern_railways: "連接北方鐵路網"
 CHL_connect_the_northern_railways_desc: "北部特別是阿里卡的鐵路和公路與我們其他基礎設施系統的交通聯繫很差，因此必須努力改善最北部地區的大部分基礎設施。"
 CHL_expand_southern_infrastructure: "擴建南方基礎設施"
 CHL_expand_southern_infrastructure_desc: "目前，智利最南部地區幾乎沒有基礎設施，甚至根本沒有鐵路。因此，我們必須花大力氣把南部港口城鎮蓬塔阿雷納斯和蓬塔德爾加達同我們的鐵路線連接起來。"
 CHL_devalue_the_peso: "[CHL_devalue_the_peso_key]"
 CHL_devalue_the_peso_desc: "[CHL_devalue_the_peso_key_desc_key]"
 CHL_devalue_the_peso_peso: "貶值比索"
 CHL_devalue_the_peso_peso_desc: "雖然其他國家允許本幣貶值以幫助本國經濟，但我們還沒有這樣做。結果，我們遠遠落後了。如果我們想迎頭趕上，就不能坐等我們的貨幣自行貶值，即使這將被證明是一項不受歡迎的措施。"
 CHL_devalue_the_peso_franc: "貶值法郎"
 CHL_devalue_the_peso_franc_desc: "雖然其他國家允許本幣貶值以幫助本國經濟，但我們還沒有這樣做。結果，我們遠遠落後了。如果我們想迎頭趕上，就不能坐等我們的貨幣自行貶值，即使這將被證明是一項不受歡迎的措施。"
 CHL_utlilize_famae: "利用“陸軍工廠與車間”"
 CHL_utlilize_famae_desc: "我國裝備工業目前依賴於國際交易與零星的本土產步槍。如要提高軍事生產，我們就必須有一家國有武器製造商，例如有百年曆史但急需現代化改造的“陸軍工廠與車間”。"
 CHL_they_shall_not_pass: "誓死堅守"
 CHL_they_shall_not_pass_desc: "我國不僅受到我們在南美太平洋戰爭中的宿敵的威脅，還受到我們的強大鄰國阿根廷的威脅，而且我們與他們的邊境線還十分漫長。如果我們想有哪怕是一絲抵禦他們的機會，我們就必須把他們困在山裡。我們誓死堅守，絕不投降！"
 CHL_domestic_production_of_the_willys_mb: "國產威利斯吉普車"
 CHL_domestic_production_of_the_willys_mb_desc: "我們能在本土生產輕武器和彈藥，但仍缺乏生產機動車與裝甲載具所需的專業知識。為了緩解這一問題，我們應該從有意出售的國家購買汽車並仿製他們的設計。"
 CHL_strengthen_the_central_bank: "加強中央銀行"
 CHL_strengthen_the_central_bank_desc: "為了進一步提振我們的經濟，而不僅僅是表面上改善，我們應該努力加強由阿圖羅·亞歷山德里總統創立的智利中央銀行。我們將給他們更多的自由，讓他們做他們認為可以做的事情，致力於讓他們最終幫助我們擺脫困境。"
 CHL_expand_the_naval_arsenal: "擴建海軍工廠"
 CHL_expand_the_naval_arsenal_desc: "馬里納海軍工廠是我們值得信賴的船舶製造商，他們也幫助我們維持艦隊的良好狀態，正如我們最近幾年所做的那樣，這遠遠超過了任何其他南美國家所做的維護質量。我們現在應該增加他們的經費，為戰爭做準備。"
 CHL_fortify_the_coastlines: "鞏固岸防"
 CHL_fortify_the_coastlines_desc: "我們的海岸線很長，與國土面積成比例，可能是世界上最長的。因此，如果我們以某種方式輸掉海戰，我們整個國家就會暴露在外，我們就會很脆弱，容易受到來自海上的攻擊。因此，我們必須建造能夠擊退任何海軍登陸的大型軍事設施！"
 CHL_invest_in_shipping: "投資航運"
 CHL_invest_in_shipping_desc: "軍事並不是海洋的唯一優勢。由於我們是一個很大程度上依賴貿易的國家，也是一個擁有拉帕努伊島等離岸地區的國家，我們應該擴充商船，並投資於擴大航運業。"
 CHL_advancements_in_telecommunications: "電信進步"
 CHL_advancements_in_telecommunications_desc: "在研發部門工作的科學家已經開始開發更好的技術，他們不僅利用無線電，還給電視開發了新的使用功能，通過這種方式，我們可以更容易地向民眾傳播基礎知識，也可以更好地在遙遠的國家科學實驗室部門之間交流科學發現。"
 CHL_protect_the_easter_island_tt: "如果§Y[JAP.GetName]§!、§Y[NZL.GetName]§!或§Y[AST.GetName]§!§Y獨立§!且是§Y法西斯主義§!或§Y中立主義§!政體，同時正與§Y民主主義美國§!交戰中，我們將得到針對他們的§Y顛覆政府戰爭目標§!。"
 CHL_upgrade_central_bank_tt: "升級§Y智利中央銀行§!：\n$MODIFIER_CONSUMER_GOODS_FACTOR$：§Y-10%§!"
 right_wing_tt: "§Y右翼§!總統上臺"
 left_wing_tt: "§Y左翼§!總統上臺"
 propping_up_gustavo_ross_tt: "當§Y古斯塔沃·羅斯§!成為智利總統時，獲得§G+75§!政治點數和§G+5%§!穩定度，並給予其§Y受人歡迎§!特質，其效果為：§G+2%§!順從度增長速度係數、§G+25%§!意識形態變化抵制力度和§G+10%§!穩定度。"
 CHL_has_idea_near_anarchy: "還沒有完全移除§Y$idea_CHL_near_anarchic_society$§!民族精神"
 CHL_not_has_idea_near_anarchy: "已完全移除了§Y$idea_CHL_near_anarchic_society$§!民族精神"
 CHL_found_national_steelworks_tt: "解鎖在§Y[950.GetName]§!獲得更多§Y鋼鐵§!的§Y$CHL_expand_araucanian_steelworks_decision$§!決議"
 denounced_catholicism: "抨擊天主教"
 embraced_catholicism: "信奉天主教"
 CHL_dispute_over_tierra_del_fuego_tt: "這可能會導致與火地島的所有者發生§R戰爭§!"
 CHL_reapproach_america_tt: "解鎖從§Y美利堅合眾國§!§Y採購武器§!的決議"
 CHL_mapuche_reconcilliation_campaigns_tt: "解鎖§G緩和§!與§G解決§!§Y馬普切衝突§!的決議"
 CHL_use_the_fascist_movement_tt: "民族社會主義叛亂將導致一場小規模的§R內戰!§!"
 CHL_suppress_the_nacistas_tt: "智利民族社會主義運動的叛亂將被§G削弱§!"
 CHL_endorse_the_constitution: "支持1925年憲法"
 CHL_endorse_the_constitution_desc: "在20世紀20年代，我們經歷了一場嚴重的社會和經濟危機，導致舊統治階級的聲望喪失，阿圖羅·亞歷山德里領導的政府崛起。1924年，他在一場政變中被推翻，但在1925年被召回，之後他利用總統任期起草了一部新憲法來取代1833年的憲法。作為新智利的國父，我們應該努力遵循他的指導思想。"
 CHL_cooperation_with_the_falange: "與國家長槍黨合作"
 CHL_cooperation_with_the_falange_desc: "國家長槍黨是一個成立於1935年的基督教民主黨，主要由進步和改革派天主教徒組成。他們的許多政策與我們非常相似，所以邀請他們進入我們的政府應該不是難事。"
 CHL_denounce_the_anarchy: "譴責國家近無政府狀態"
 CHL_denounce_the_anarchy_desc: "在華爾街崩潰後開始的無政府狀態還沒有得到解決，這一事實很大程度上表明瞭當前政府固有的巨大弱點及其消極的自由主義理想。我們必須公開反對他們，並向人民保證，如果我們團結起來，未來將屬於普羅大眾。"
 CHL_look_to_tradition: "關注傳統"
 CHL_look_to_tradition_desc: "阿圖羅·亞歷山德里已經在聚光燈下享受了屬於他的時光，但他卻沒有解決任何仍然籠罩著這個國家的突出問題。因此，我們必須從自由主義後退一步，回頭看看我們過去所依賴的那些美好的老式價值觀。"
 CHL_impose_new_taxes: "徵收新稅"
 CHL_impose_new_taxes_desc: "多次嘗試使國家恢復到原有狀態之後，我們的國庫已經枯竭。為了緩解這一狀況，對我們的人口徵收新的所得稅或許是一個不錯的計劃。人們一開始可能會不喜歡，但只要假以時日，他們就會平靜下來，而我們就有更多的錢可以花。"
 CHL_1938_chilean_presidential_election: "1938年智利總統選舉"
 CHL_1938_chilean_presidential_election_desc: "1938年的總統選舉即將到來，這個國家必須從四位主要候選人中選出自己的領導人。左邊是佩德羅·阿吉雷·塞爾達和人民陣線，右邊是卡洛斯·伊瓦涅斯·德爾坎波和人民自由聯盟，中間是古斯塔沃·羅斯和自由主義者，更左的是埃利亞斯·拉斐特·加維尼奧和共產主義者。誰會獲勝？"
 CHL_1938_chilean_presidential_election_tt: "§Y1938年10月§!下旬舉行§Y總統選舉§!時，這一國策將自動完成"
 CHL_construct_new_hydroelectric_stations: "新建水電站"
 CHL_construct_new_hydroelectric_stations_desc: "雖然這一舉動在當地的馬普切人中可能不受歡迎，但阿勞卡尼亞地區擁有豐富的自然資源，其中之一就是它的湖泊和瀑布。我們可以利用這些水資源來建造水電站，雖然這可能會打攪當地居民。"
 CHL_policies_of_arturo_alessandri: "阿圖羅·亞歷山德里的政策"
 CHL_policies_of_arturo_alessandri_desc: "亞歷山德里的政策有很多，他的最後一個任期甚至還沒有結束。他極大地幫助了這個國家，而且仍然有能力進一步幫助它，不愧為新智利的國父。"
 CHL_suppress_the_nacistas: "鎮壓智利民族社會主義運動"
 CHL_suppress_the_nacistas_desc: "民族社會主義運動最近一直在行動，很明顯，他們將在不久的將來鬧出點動靜。我們必須保持警惕，鎮壓任何可能出現的異議。"
 CHL_use_the_fascist_movement: "利用法西斯運動"
 CHL_use_the_fascist_movement_desc: "雖然很明顯法西斯分子在策劃什麼，但應該考慮到他們中的許多高級成員可能對我們政府有用。因此，我們應該秘密地接觸他們中的一些人。希望至少在他們決定嘗試採取行動之前，我們能利用他們的優勢。"
 CHL_reestablish_the_republican_guard: "重建共和國衛隊"
 CHL_reestablish_the_republican_guard_desc: "既然我們再次受到攻擊，共和國衛隊必須重新集結以對抗那些要獵殺我們的重大威脅。戰士們，為你們的共和國而戰！"
 CHL_volunteers_to_the_republicans: "共和主義志願軍"
 CHL_volunteers_to_the_republicans_desc: "我們在西班牙的兄弟們目前正在同希望推翻其民主共和國的軍隊進行鬥爭。雖然在智利，進行干預的想法不一定那麼受歡迎，但它可以展示我們捍衛民主的力量和戰備實力。"
 CHL_volunteers_to_the_republicans_tt: "@SPR 西班牙共和國存在"
 CHL_volunteers_to_the_republicans_tt_2: "@SPR Republican Spain has not completed §Y$SPR_regional_defense_council_of_aragon$§!"
 CHL_prop_up_gustavo_ross: "支持古斯塔沃·羅斯"
 CHL_prop_up_gustavo_ross_desc: "古斯塔沃·羅斯是阿圖羅·亞歷山德里最重要的學生，他最希望此人贏得即將到來的總統選舉。因此，亞歷山德里應該確保讓公眾知道這一點，並嘗試通過各種各樣的宣傳將羅斯塑造成他的精神繼承人。"
 CHL_inflation_control_by_the_central_bank: "智利中央銀行控制通貨膨脹"
 #CHL_inflation_control_by_the_central_bank_desc: "The Banco Central de Chile was founded by president Arturo Alessandri in 1925. We should task them with making sure that inflation stays on a level that is currently desired, so that the budget can be distributed as desired, and the populace be kept as happy as possible."
 CHL_inflation_control_by_the_central_bank_desc: "智利中央銀行由總統阿圖羅·亞歷山德里於1925年創立。我們應該命他們控制通貨膨脹，以支持智利的長期經濟發展，並防止螺旋上升的物價對經濟和政治造成損害。"
 CHL_construct_the_estadio_nacional: "建設國家體育場"
 CHL_construct_the_estadio_nacional_desc: "亞歷山德里為恢復經濟和人民信任所做的最大努力是開展公共工程，他的代表作是國家體育場，一座宏偉的國家級體育比賽場館，這是他領導國家能力的偉大展示。"
 CHL_establish_corfo: "創立智利生產促進局"
 CHL_establish_corfo_desc: "我們應該嘗試建立一個能夠負責產業發展、資源分配和重建工作的組織。它可以被稱為智利生產促進公司。"
 CHL_work_towards_laissex_faire: "努力實現自由放任"
 CHL_work_towards_laissex_faire_desc: "自由主義政府的最終目標是實現自由放任經濟，因此我們必須盡一切努力實現這一目標。"
 CHL_align_the_marxists: "聯合馬克思主義者"
 CHL_align_the_marxists_desc: "我們國家有許多人認為目前的政府結構很脆弱，但如果一個左傾的總統向他們伸出手，他們中的許多人很容易被說服支持政府。"
 CHL_low_cost_housing: "低成本住房"
 CHL_low_cost_housing_desc: "我們國家有許多流離失所或貧窮的人，我們應該盡最大努力支持這些不幸的人，他們仍然是我們國家的人民。因此，我們應該建立全國性的住房組織，並將建設社會之網作為政府政策，以接住任何不幸掉落下來的人們。"
 CHL_align_the_police: "與調查警察結盟"
 CHL_align_the_police_desc: "$CHL_expand_the_investigations_police_desc$"
 CHL_privatize_national_industries: "國有工業私有化"
 CHL_privatize_national_industries_desc: "目前，國家工業薄弱，效率低下，我們應該努力把它們交給那些有能力更好地管理每一處地方工業園區的私營組織。"
 CHL_strengthen_instituto_nacional: "加強國家研究院"
 CHL_strengthen_instituto_nacional_desc: "雖然早在“老祖國”時期國家研究院就創立了，但它應該得到擴大和加強，以確保我國人民能夠讀到他們需要的東西，並確保我們能夠以對我們有利的速度進步。"
 CHL_enact_universal_suffrage: "實行普選"
 CHL_enact_universal_suffrage_desc: "選舉權是任何民主社會的基礎，而我國並非所有人都能享有同樣的選舉權，這是一種極大的恥辱。我們應該爭取平等，儘早給予智利婦女投票的機會。"
 CHL_host_spanish_refugees: "收容西班牙難民"
 CHL_host_spanish_refugees_desc: "我們在西班牙的兄弟們與他們的朋友和家人作戰，精神上受到了打擊。現在，隨著內戰的結束，許多人試圖逃離當前的政權，作為西班牙的兄弟，我們是接納難民的主要候選國。"
 CHL_expand_the_investigations_police: "智利調查警察"
 CHL_expand_the_investigations_police_desc: "智利調查警察成立於1933年，是智利兩大警察機構之一，另外一個是執法警察：智利卡賓槍騎兵。調查警察根據所調查的案件劃分調查區域，並設有專門的警察調查單位，這些單位僱有偵探專家。"
 CHL_increase_presidential_powers: "增加總統權力"
 CHL_increase_presidential_powers_desc: "總統是領導這個國家所需要的唯一人選，因為一個強人總比一個支離破碎、軟弱無力的議會強。總統就是議會，那些人沒有必要參與政治。"
 CHL_reapproach_america: "重新與美國接洽"
 CHL_reapproach_america_desc: "當大蕭條開始時，美國切斷了與我們的許多關係，這些關係到目前為止還沒有完全解決。因此，總統和國會應該共同努力，儘快恢復與他們的關係。"
 CHL_return_to_the_parliamentary_era: "回到議會時代"
 CHL_return_to_the_parliamentary_era_desc: "只有一個普遍的真理，那就是權力會導致腐敗，絕對的權力會導致絕對的腐敗。因此，我們必須確保議會有儘可能大的發言權，這樣就不會讓一個瘋狂的總統指導我們國家的全部未來。"
 CHL_development_inwards: "向內發展"
 CHL_development_inwards_desc: "我們的政策應該是置身於世界事務之外，在國內發展，而不是再次嚴重依賴出口。"
 CHL_kickstart_the_arsenal_of_democracy: "啟動民主兵工廠"
 CHL_kickstart_the_arsenal_of_democracy_desc: "在不久的將來，我們很可能會被捲入一場巨大的衝突，為了確保我們不會在這種情況下被消滅，我們應該迅速擴大我們的軍工機構。"
 CHL_chilean_anti_communist_action: "智利反共行動"
 CHL_chilean_anti_communist_action_desc: "共產主義者和其他任何人一樣對我們的國家構成巨大威脅，我們必須竭盡全力確保他們永遠不會有機會實現他們所渴望的革命。"
 CHL_chilean_anti_communist_action_dem_version: "智利反共行動"
 CHL_chilean_anti_communist_action_dem_version_desc: "$CHL_chilean_anti_communist_action_desc$"
 CHL_organize_patriotic_leagues: "組織愛國聯盟"
 CHL_organize_patriotic_leagues_desc: "愛國聯盟是曾經在聖地亞哥和布宜諾斯艾利斯街頭遊蕩的法西斯黑手黨集團，我們應該努力重建他們，同時確保他們忠於我們的政府，而不是像以前那樣獨立運作。"
 CHL_preemtively_strike_foreign_revolutionaries: "先制打擊外國革命者"
 CHL_preemtively_strike_foreign_revolutionaries_desc: "我們或許已經保護了我們的國家免受內部共產主義威脅，但外部威脅仍然存在。我們必須先發制人，在他們發動革命之前打倒他們。"
 CHL_preemtively_strike_foreign_revolutionaries_tt: "獲得針對南美所有的§Y共產主義§!國家的傀儡§Y戰爭目標§!"
 CHL_law_of_permanent_defense_of_democracy: "永久捍衛民主法"
 CHL_law_of_permanent_defense_of_democracy_desc: "共產主義威脅不僅籠罩著我們，也籠罩著全世界。如果我們要在必將到來的冷戰中生存下去，我們必須確保共產主義者無法推翻我們的政權並威脅我們的人民。"
 CHL_law_of_permanent_defense: "永久性防禦"
 CHL_law_of_permanent_defense_desc: "$CHL_law_of_permanent_defense_of_democracy_desc$"
 CHL_promote_immigration_to_chile: "$BRA_promote_immigration_to_brazil$"
 CHL_promote_immigration_to_chile_desc: "[CHL.GetName]是一個多元化的國家，這裡的人民的祖先來自全球各地。隨著我們的經濟再次增長，大量資源等待開發，我們應該鼓勵更多人搬到這裡，並稱自己為[CHL.GetAdjective]人。"
 CHL_socialist_youth: "社會主義青年組織"
 CHL_socialist_youth_desc: "青年中有許多人已經變得激進，傾向於左派和右派。特別是社會主義者，他們對保護自己的價值觀非常直言不諱，充滿激情，因此願意與任何威脅我們偉大國家的人作鬥爭。"
 CHL_counter_operation_bolivar: "努力對抗玻利瓦爾計劃"
 CHL_counter_operation_bolivar_desc: "德國正試圖通過他們邪惡的玻利瓦爾計劃，利用間諜活動和破壞活動影響南美國家。我們應該盡一切力量來抵制他們的惡行。"
 CHL_strike_down_south_american_fascism: "打倒南美法西斯主義"
 CHL_strike_down_south_american_fascism_desc: "南美洲有許多人被法西斯主義所吸引，我們需要確保我們地區沒有人威脅到我們的安全，這使得我們難以與他們共存。因此，我們必須在他們想要傷害我們之前就把他們打倒。"
 CHL_land_reforms: "土地改革"
 CHL_land_reforms_desc: "莊園佃戶制度是嚴重過時的，並造成了社會階層之間的巨大鴻溝。我們必須努力重新分配哈森達多家族的土地，並徹底結束這種野蠻的農奴制行徑。"
 CHL_support_the_democracies: "支持民主國家"
 CHL_support_the_democracies_desc: "歐洲和美國的民主國家正陷入困境，作為民主國家的同胞，我們有責任盡一切可能幫助他們渡過難關。因此，我們必須派遣智利人去確保我們民主國家同胞的利益。"
 CHL_mapuche_reconcilliation_campaigns: "馬普切人和解運動"
 CHL_mapuche_reconcilliation_campaigns_desc: "自從19世紀征服阿勞卡尼亞以來，馬普切人一直受到我們政府的嚴重虐待。我們必須在改善他們的處境方面取得重大進展，並確保他們能夠與智利同胞一起和平生活。"
 CHL_an_attempt_to_maintain_our_neutrality: "嘗試維持我國中立"
 CHL_an_attempt_to_maintain_our_neutrality_desc: "許多捲入世界衝突的國家希望把我們拉進一場由他們無意義的爭吵引起的戰爭。我們必須盡我們所能遠離他們的衝突，不要介入我們不應該參與的衝突。"
 CHL_embargo_strategies: "禁運戰略"
 CHL_embargo_strategies_desc: "支持我們的民主國家有更多的方式，而不僅僅是派遣士兵去戰鬥，時間已經證明，經濟措施也可以同樣強大。這就是為什麼我們應該對我們朋友的敵人實行禁運，這樣我們就可以使他們缺乏發動戰爭所需的銅和硝酸鹽。"
 CHL_embargo_strategies_tt: "我們將§Y禁運§!與世界主要§Y民主§!國家交戰的所有國家。"
 CHL_enact_stricter_labor_laws: "實施更嚴格的勞動法"
 CHL_enact_stricter_labor_laws_desc: "目前的勞動法對一個真正的民主社會來說過於寬鬆，我們應該確保企業和資本家不能利用智利貧窮的工人階級。為了更平等的未來！"
 CHL_found_national_steelworks: "成立國家鋼鐵廠"
 CHL_found_national_steelworks_desc: "這個國家急需鋼鐵，而我們的勘探員發現這片阿勞卡尼亞鬱鬱蔥蔥的地區正好有鋼鐵。因此，我們應該努力建立新的鋼鐵廠，以便我們能夠利用現有的國家資源。"
 CHL_found_the_contraloria_general_de_la_republica: "成立國家審計署"
 CHL_found_the_contraloria_general_de_la_republica_desc: "智利國家審計署將是智利政府在憲法上的一個自治機構。它將負責控制中央和分散的公務員制度的所有活動的法律方面、管理、審計前和審計後的職能，不論其組織形式如何，也不論法律賦予的其他權力。"
 CHL_establish_the_ministry_of_mining: "成立礦業部"
 CHL_establish_the_ministry_of_mining_desc: "我們還應該成立一個負責我國採礦作業的國家部門，這樣我們就可以集中控制在哪裡採礦，以及如何經營它們。"
 CHL_the_nationalization_of_copper: "銅礦國有化"
 CHL_the_nationalization_of_copper_desc: "我國大片的銅礦目前掌握在私營礦業公司手中，我們應該確保礦藏落入更明智的政府和礦業部手中。"
 CHL_enforce_stricter_secularism: "實行更嚴格的世俗主義"
 CHL_enforce_stricter_secularism_desc: "我們已經在自由憲法中確立了世俗主義，但教會仍然對人民和傑出的從政者擁有很大的權力。因此，我們必須要求宗教與政治保持距離，與任何想要參與政治的人保持距離。"
 CHL_repeal_the_separation_of_church_an_state: "廢除政教分離"
 CHL_repeal_the_separation_of_church_an_state_desc: "教會和國家之間的分裂是一個嚴重的錯誤，必須儘快消除。我們都很清楚，教會是我們的盟友。"
 CHL_a_joint_application_to_the_allies: "聯合申請加入同盟國"
 CHL_a_joint_application_to_the_allies_desc: "美國和阿根廷一直與過去的同盟國有足夠好的關係，現在終於到了與它們聯合起來，為一個更光明的未來共同努力的時候了。"
 CHL_dispute_over_tierra_del_fuego: "火地島爭端"
 CHL_dispute_over_tierra_del_fuego_desc: "阿根廷政府仍然聲稱火地島的東半部是他們自己的，儘管它與土地沒有聯繫，而我們顯然對這片領土有著更古老、更合法的要求。我們必須立即採取行動保護它。"
 CHL_protect_the_easter_island: "保護復活節島"
 CHL_protect_the_easter_island_desc: "復活節島，也被當地人稱為拉帕努伊島，經常受到來自西部的法西斯分子的威脅。我們不僅要加強島上的防禦工事並修建港口，還要先制打擊任何聲索太平洋之人。"
 form_country_south_america_required_states_tt: "§Y[ROOT.GetName]§!控制所有§Y南美§!§Y大陸地區§!"
 CHL_joint_research_initiatives_tt: "§Y智利§!以及所有與我們在同一陣營的國家，將加入一個§Y科技共享組織§!"
 CHL_the_future_of_Chile: "[CHL.GetName]的未來"
 CHL_the_future_of_Chile_desc: "鑑於目前的迎合各種觀點的“大帳篷”聯盟無法在所有問題上達成完全一致，共產黨必須召開會議，以決定未來幾年的路線。它目前站在馬克思主義者埃利亞斯·拉斐特·加維尼奧、社會主義者馬馬杜克·格羅夫·巴列霍、斯大林主義者卡洛斯·孔特雷拉斯·拉巴爾卡和托洛茨基主義者曼努埃爾·伊達爾戈·普拉薩之間。"
 CHL_support_for_the_international_revolution: "支持國際革命"
 CHL_support_for_the_international_revolution_desc: "有許多人不僅要與入侵他們家園的外國作鬥爭，還要與腐敗的政府和奪去他們生計的產業作鬥爭。我們必須竭盡所能，確保世界人民感到安全，免受邪惡的侵害。"
 CHL_sponsor_american_revolutions: "贊助美洲革命者"
 CHL_sponsor_american_revolutions_desc: "有許多人，如果他們嘗試革命，他們有可能取得成功，但他們沒有資金或武器來達到目的。因此，我們應該確保贊助這些革命者，並將資本主義趕出南美。"
 CHL_sponsor_american_revolutions_tt: "解鎖在其他§Y南美洲和北美洲§!國家§Y贊助意識形態集會§!的決議"
 CHL_union_of_hispanic_republics: "西班牙裔共和國聯盟"
 CHL_union_of_hispanic_republics_desc: "現在，所有的西班牙裔都團結在同一面旗幟下，我們是時候向世界展示我們的能力了，我們打算解放任何還在外國帝國主義統治下的人民。"
 CHL_propose_closer_cooperation: "提議加強合作"
 CHL_propose_closer_cooperation_desc: "我們周圍的共產主義國家可能認同我們的意識形態，但他們在戰略上是分散的，沒有協調。我們應該保護他們，幫助他們並更好地指導他們。"
 CHL_nationalize_foreign_industries: "國有化外國產業"
 CHL_nationalize_foreign_industries_desc: "還留在我國的資本家們一定非常緊張，因為他們知道我們下一步要做什麼。我們必須沒收他們所有的一切財產，重新分配給人民。"
 CHL_align_with_the_russian_soviet: "與[SOU.GetNameDef]結盟"
 CHL_align_with_the_russian_soviet_desc: "[SOU.GetNameDefCap]是我們意識形態上的親密同志。我們應該向他們提出互助提議，以換取加入[SOU.GetFactionName]。"
 CHL_hub_of_the_world_revolution: "世界革命的中心"
 CHL_hub_of_the_world_revolution_desc: "有許多革命者對世界現狀不滿意，更重要的是，他們可能對蘇聯的現狀感到失望。我們應該共同努力，創造一個更美好的世界！"
 CHL_hub_of_the_world_revolution_tt: "其他國家的共產主義顧問將根據本國的政治情況前往[CHL.GetName]。目前這些顧問將調往[CHL.GetName]："
 CHL_joint_development_programs: "聯合開發項目"
 CHL_joint_development_programs_desc: "既然我們是盟友，我們就應該努力共同建設新工廠，以便更好地發展我們各自的國家。"
 CHL_joint_research_initiatives: "聯合科研計劃"
 CHL_joint_research_initiatives_desc: "既然我們是盟友，我們應該努力共同建立實驗室和研究合作計劃，以便進一步研發出超越這個世界的資本家和帝國主義能力的武器。"
 CHL_one_more_fascist_focus_done_tt: "§G降低§!政變帶來的負面影響，其效果為：\n 戰爭支持度：§G+5%§!\n 穩定度：§G+5%§!"
 CHL_commence_the_counter_revolution_negative_tt: "基於完成的§Y準備國策§!數量損失戰爭支持度和穩定度"
 CHL_propose_closer_cooperation_tt: "向§Y南美洲和中美洲§!的所有§Y共產主義國家§!發出事件，要求他們向我們屈服"
 CHL_sway_ariosto_hererra_tt: "§Y阿里奧斯托·埃雷拉§!和他的手下會加入我們的政變"
 CHL_proliferate_national_populism_tt: "完成§Y發動反革命§!國策後：\n政治點數§G+75§!。"
 CHL_more_funds_or_the_propaganda_department_tt: "完成§Y發動反革命§!國策後：\n人力§G+5000§!。"
 CHL_recruit_young_officers_tt: "某些年輕軍官將晉升為§Y將軍§!"
 CHL_enforce_the_chilean_identity_tt: "民族精神§Y$CHL_ancestral_mapuche_resistance$§!被移除後，會重新獲得[950.GetName]的核心。"
 CHL_expand_the_department_of_provinces_change_tt: "修正了之前獲得的§Y民族精神§!，效果略有不同，取決於先前哪個§Y部門§!得到了加強。"
 CHL_expand_the_department_of_provinces_coring_tt: "解鎖智利領土收復主義者宣稱§Y地區之整合§!決議"
 CHL_abide_by_the_francoist_model_tt: "我們將§R無法再加入陣營§!"
 CHL_hipanic_alliance_faction: "西班牙裔聯盟"
 CHL_undo_colonialist_occupations_tt: "解鎖§Y佔領伯利茲和巴拿馬運河§!的決議"
 CHL_press_our_demands_tt: "向圭亞那群島的非法佔領者發出要求對各地區§Y加強我們的主權§!"
 CHL_the_latin_american_alliance_tt: "邀請§Y非西班牙裔拉丁美洲§!國家加入我們的陣營"
 CHL_sponsor_anti_colonialist_rebellions_tt: "解鎖在§Y南美洲和中美洲§!被殖民地區加強抵抗的決議"
 CHL_empower_the_preparation_department: "賦權作戰準備部門"
 CHL_empower_the_preparation_department_desc: "為了使我們的政變儘可能順利地進行，我們不僅需要確保普通民眾的支持，還需要為最終到來的那一天做好人員、計劃和後勤準備。"
 CHL_sway_ariosto_hererra: "影響阿里奧斯托·埃雷拉"
 CHL_sway_ariosto_hererra_desc: "阿里奧斯托·埃雷拉將軍表現出強烈的反社會主義的同理心，但他並不一定忠於我們。確保他和他最忠誠的士兵的支持是明智的，因為我們肯定可以在我們的隊伍中使用像他這樣的人。"
 CHL_inflitrate_the_carabinieros: "滲透智利卡賓槍騎兵"
 CHL_inflitrate_the_carabinieros_desc: "智利卡賓槍騎兵的任務是保護國家不受任何叛亂分子的侵害，我們也是其中之一。如果我們反對他們，肯定會血流成河，但如果我們贏得他們的忠誠，他們肯定會成為最有用的棋子。"
 CHL_unify_the_fascist_movements: "統一法西斯運動"
 CHL_unify_the_fascist_movements_desc: "雖然豪爾赫·岡薩雷斯·馮·馬雷斯牢牢控制著智利民族社會主義運動，但仍有其他有類似想法的團體不跟隨他。應該敦促他領導智利法西斯分子的先鋒保護傘運動，這樣政變才能成功。"
 CHL_proliferate_national_populism: "擴散民族民粹主義"
 CHL_proliferate_national_populism_desc: "平民和其他任何東西一樣重要，尤其是如果我們想要在政變發生後穩定我們的國家。我們必須獲得他們的支持，如果有必要的話，可以通過不正當手段！"
 CHL_more_funds_or_the_propaganda_department: "增加宣傳部經費"
 CHL_more_funds_or_the_propaganda_department_desc: "我們的宣傳部門正在加班加點地讓人們相信我們是他們的救世主，但如果我們不向他們提供資金，他們就無法保持任何效率。我們必須通過腐敗的政客洗錢，為政變做準備。"
 CHL_request_foreign_support: "請求外國支持"
 CHL_request_foreign_support_desc: "許多國家已經被與我們有著相似意識形態傾向的人所控制，站在他們好的一邊可能是明智的。通過這種方式，我們可以向他們索要武器和士兵，幫助我們發動政變。"
 CHL_the_popular_freedom_alliance: "人民自由聯盟"
 CHL_the_popular_freedom_alliance_desc: "這個國家有一些人和我們有同樣的理想，但不敢公開地說出來。因此，我們應該說服卡洛斯·伊瓦涅斯·德爾坎波將軍領導一個新的聯盟，即人民自由聯盟，這個聯盟呼籲保守價值觀，但卻在暗中支持我們。"
 CHL_rally_the_people: "團結人民"
 CHL_rally_the_people_desc: "政變已經準備就緒。現在所需要做的就是激怒人民，並通知自由黨政府，他們的時代即將結束。是時候結束這種悲慘的狀態了！"
 CHL_commence_the_counter_revolution: "發動反革命"
 CHL_commence_the_counter_revolution_desc: "我們的部隊已做好準備，正急切地等待命令，準備佔領聖地亞哥的每一個主要陣地，以及其他各城市的市政廳。現在需要做的就是執行計劃，等著看一旦事情結束，我們能得到多少民眾的支持。"
 CHL_promote_broad_anti_americansim: "促進廣泛的反美主義"
 CHL_promote_broad_anti_americansim_desc: "美國人都是些混蛋，他們把我們榨乾，直到我們變成白人，他們把我們所有的東西都拿走了，好像這是他們的權利，而我們卻沒有得到任何回報，儘管美國人制造了這麼多事端，但他們為我們做過什麼呢？我再說一遍，美國人為我們做過什麼？！"
 CHL_ban_liberalism: "禁止自由主義"
 CHL_ban_liberalism_desc: "即使我們把自由主義者趕出了政府，他們仍然存在，就像那裡有無數的沙粒一樣。我們必須鎮壓他們的組織，確保他們永遠不會強大到威脅到我們的統治。"
 CHL_recruit_young_officers: "招募年輕軍官"
 CHL_recruit_young_officers_desc: "在我國，許多身居高位的將軍更傾向於左翼，在我們掌權後，除了少部分人以外，他們全都遞交了辭呈。我們應該從隊伍中培養一些愛國的、狂熱的年輕軍官，來代替他們腐朽的老長官。"
 CHL_enforce_the_chilean_identity: "鑄就新智利認同"
 CHL_enforce_the_chilean_identity_desc: "目前看來，智利人民處於四分五裂的狀態，我們必須出手，讓他們團結在我們的旗幟下。西班牙人、馬普切人、智利人，他們並無不同，因為他們都是我們的公民，他們同出一轍。有些人可能會排斥我們的觀點，但總的來說，新的智利認同應該能讓大多數人滿意。"
 CHL_cooperate_with_operation_bolivar: "配合玻利瓦爾計劃"
 CHL_cooperate_with_operation_bolivar_desc: "德國人為我們做了很多。在我們最需要的時候，德國移民來到阿勞卡尼亞殖民，現在，他們需要幫助來對付美國人。在這方面協助他們是我們的責任，報答他們我們所欠的。"
 CHL_abide_by_the_francoist_model: "遵守佛朗哥模式"
 CHL_abide_by_the_francoist_model_desc: "雖然德國人可能有很大的影響，但我們的運動真正需要研究的是墨索里尼和佛朗哥等地中海思想家的理論。我們應該效仿他們的榜樣，我們應該樹立他們的理想來成就我們自己。"
 CHL_host_german_intelligence: "招待德國情報人員"
 CHL_host_german_intelligence_desc: "在德國人的玻利瓦爾計劃中，試圖從南方對美國進行間諜活動。只要他們派遣間諜並讓阿勃維爾與我們的政府更加密切地合作，我們可能能夠為他們提供大量有趣的信息。"
 CHL_militarize_the_state: "國家軍事化"
 CHL_militarize_the_state_desc: "雖然我們以前贏得過大規模戰爭，但我們的國家目前還沒有為另一場大規模衝突做好準備。因此，如果我們希望我們的軍隊再次做好戰鬥準備，就必須首先使國家軍事化。"
 CHL_the_spirit_of_the_war_of_the_pacific: "南美太平洋戰爭的精神"
 CHL_the_spirit_of_the_war_of_the_pacific_desc: "如果我們想讓我們的軍隊振作起來，就應該提醒他們我們在太平洋戰爭中所取得的偉大成就，那就是對秘魯和玻利維亞的戰爭。我們也可以藉此機會重申我們對某些地區的主權，而那正是我們的德國盟友可能願意給予的。"
 CHL_syndicalize_the_production_sector: "工團化生產部門"
 CHL_syndicalize_the_production_sector_desc: "生產部門目前受到低效率和殘忍的地主的困擾，他們只考慮自己的利益。我們應該工團化生產部門，並提出一種真正的工團主義企業的產業模式。"
 CHL_expand_the_mountain_regiments: "加強山地部隊"
 CHL_expand_the_mountain_regiments_desc: "我們擁有的最精銳的部隊是我們的特化山地部隊，他們適應在全國任何地方進行殘酷的戰鬥。我們應該強制要求我們的將軍與這些部隊一起輪換和訓練，並向他們提供他們可能需要的任何專業裝備。"
 CHL_departemento_de_las_tropas_nacistas_de_asalto: "衝鋒隊"
 CHL_departemento_de_las_tropas_nacistas_de_asalto_desc: "我們智利民族社會主義運動的衝鋒隊應該得到鼓舞和加強。我們應該確保他們不辜負那次世界大戰突擊部隊的精神，併為他們配備適當的裝備。"
 CHL_departamento_de_la_juventad_nacista: "民族社會主義青年部"
 CHL_departamento_de_la_juventad_nacista_desc: "其他國家如德國，已經成功地將他們的青年軍事化，我們也不應該例外，因為我們需要更多的人投入戰場，而且我們現在就需要。"
 CHL_expand_the_department_of_provinces: "擴編省部"
 CHL_expand_the_department_of_provinces_desc: "省部正在加班加點地工作，以確保我們控制智利所有地區，但如果我們充分支持並加以擴編，我們可以利用它們更好地進行管理，甚至更有效地管理外國領土。"
 CHL_revoke_the_treaty_of_lima: "廢除利馬條約"
 CHL_revoke_the_treaty_of_lima_desc: "1929年將塔克納區域交還秘魯的利馬條約沒有合法性，除了我們被迫插手這件事之外，沒有其他解釋。現在是我們糾正錯誤並要求歸還領土的時候了。"
 CHL_demand_the_fireland: "索取火地島"
 CHL_demand_the_fireland_desc: "火地島理應是我們的，阿根廷不能聲稱他們的所有權是合法的，因為他們甚至與它沒有聯繫。我們應該向民眾保證，我們沒有惡意，並將該地區從阿根廷的魔掌中解放出來。"
 CHL_escalate_the_laguna_del_desierto_issue: "德爾德謝爾托湖問題升級"
 CHL_escalate_the_laguna_del_desierto_issue_desc: "德爾德謝爾托湖附近的邊境線非常模糊，更偏向阿根廷人。我們應該採取行動，佔領本應屬於我們的那部分地區，甚至可能佔得更遠一點。"
 CHL_demand_demilitarization_of_patagonia: "巴塔哥尼亞去軍事化"
 CHL_demand_demilitarization_of_patagonia_desc: "阿根廷人持續以其在巴塔哥尼亞的軍事存在威脅我國人民。現在是我們要求他們不要干涉我們的時候了，並讓他們承諾不派軍隊進入該地區。"
 CHL_enter_patagonia: "挺進巴塔哥尼亞"
 CHL_enter_patagonia_desc: "如果阿根廷人相信我們哪怕一秒鐘，那就證明我們愚弄了他們，嚇到了他們。是時候讓我們的軍隊進入巴塔哥尼亞，在他們還沒反應過來之前就狠狠地打擊他們。"
 CHL_controlled_education: "嚴格控制教育"
 CHL_controlled_education_desc: "如果要讓孩子們正確成長，以我們希望的方式思考，我們必須確保他們的教育遵循我們現有的標準和規定，使他們成為模範公民。"
 CHL_promote_pan_hispanic_rhetoric: "宣傳泛西班牙裔言論"
 CHL_promote_pan_hispanic_rhetoric_desc: "我們都是個體。但即便如此，作為西班牙裔，我們在精神上和血緣上是團結在一起的，現在是時候要求我們與生俱來的權利，推翻任何試圖讓我們的人民分裂的帝國主義者。"
 CHL_military_excercises: "軍事演習"
 CHL_military_excercises_desc: "軍隊還沒有完全做好戰鬥的準備，在西班牙裔統一的那一天到來之前，他們必須進行大量的訓練。"
 CHL_cultivate_fanaticism: "培養狂熱"
 CHL_cultivate_fanaticism_desc: "如果不統一，南美洲和中美洲人民就沒有未來，這一點必須讓所有人都知道。如果我們現在不站起來反對美國人，我們肯定會落入他們的操縱和帝國主義的魔爪。榮譽造就了西班牙裔，而任何反對我們的人都會經歷我們的殘暴。"
 CHL_the_path_to_conquest: "通過征服實現統一"
 CHL_the_path_to_conquest_desc: "像過去的征服者一樣，光榮的征服行動將使我們的人民團結在一起，因為他們處於自負和狹隘的民族主義政府的控制之下，這些政府看不到他們是大局的一部分。我們必須用武力解放所有西班牙裔！"
 CHL_hispanic_supremacy_pact_faction: "西班牙裔至上聯盟"
 CHL_the_hispanic_alliance: "西班牙裔聯盟"
 CHL_the_hispanic_alliance_desc: "我們的人民應該團結在一起，不是在國家層面，而是在友誼和合作層面，只有通過聯盟，泛西班牙裔聯盟才能存在。我們應該接觸任何與我們有共同理想的人，確保他們忠於我們的事業。"
 CHL_the_latin_american_alliance: "拉丁美洲聯盟"
 CHL_the_latin_american_alliance_desc: "雖然泛西班牙主義是我們努力和奮鬥的目標，但在我們的大陸上，仍有一些人希望與我們一起反對帝國主義的壓迫，儘管他們只是拉丁人。我們應該邀請他們，因為拉丁人民團結起來是強大的。"
 CHL_sponsor_anti_colonialist_rebellions: "贊助反殖民主義叛亂"
 CHL_sponsor_anti_colonialist_rebellions_desc: "有些人的想法和我們一樣，但他們沒有控制和掌控自己未來的自主權。我們必須把他們從殖民主義列強的魔爪下解放出來。"
 CHL_joint_development_and_research: "聯合開發與研究"
 CHL_joint_development_and_research_desc: "既然我們正在更加緊密地合作，我們可以共同投資並建立實驗室，從每個成員國吸收研究人員，以便更好地合作。"
 CHL_push_past_the_darien_gap: "穿過達連隘口"
 CHL_push_past_the_darien_gap_desc: "哥倫比亞和巴拿馬之間的達連隘口可能難以跨越，但如果我們要到達美洲邊界並最終解放那裡的兄弟，這是必要的。"
 CHL_the_might_to_defend_our_homes: "保衛家園的力量"
 CHL_the_might_to_defend_our_homes_desc: "我們的生命不斷受到世界上列強的威脅，我們的人民感到受到政府保護的重要性。這是再怎麼強調也不為過的。我們應該加強軍事力量，使戰爭永遠不會來到我們的家門口。"
 CHL_undo_colonialist_occupations: "廢除殖民主義佔領"
 CHL_undo_colonialist_occupations_desc: "殖民主義列強佔領西班牙美洲部分地區的時間太長了，現在該讓我們向他們表明，他們不是那麼好惹的。派軍隊去！"
 CHL_unite_hispanic_america: "聯合西班牙裔美洲"
 CHL_unite_hispanic_america_desc: "這一刻終於到來了！今天，我們正在見證歷史，西班牙裔美洲人的一大部分再次統一，但這次是在我們自己的政府治下，而不是在西班牙帝國的治下。歡慶吧，因為這是大陸新時代的到來！"
 CHL_the_true_enemy: "真正的敵人"
 CHL_the_true_enemy_desc: "美國是我們人民的真正敵人，它在南部壓迫西班牙裔太久了。現在我們已經準備好進行最後的推進，我們所需要做的就是邁出最後一步。"
 CHL_demand_the_guayanas: "索取圭亞那"
 CHL_demand_the_guayanas_desc: "圭亞那被其他勢力佔領太久了。曾經聲稱擁有埃爾多拉多的地區可能實際上並不擁有它，但它有許多其他的財富，我們迫切希望自己擁有的財富。"
 CHL_liberate_the_caribbean: "解放加勒比"
 CHL_liberate_the_caribbean_desc: "加勒比地區可能不全是西班牙的，甚至也不全是拉丁美洲的，但它仍然應該屬於我們的影響範圍，我們必須採取一切措施為我們自己奪取這些島嶼。"
 CHL_press_our_demands: "提出我們的要求"
 CHL_press_our_demands_desc: "如今我們佔領了整個圭亞那，我們可以執行我們的要求，把它們從帝國主義者的控制中解放出來，並試圖與該地區的之前的佔領者尋求和解。"
 CHL_defense_of_the_hemisphere: "半球防禦"
 CHL_defense_of_the_hemisphere_desc: "在我們的半球，有許多國家將從美國的保護中受益匪淺，而這正是我們和德國人可以提供給他們的。"
 CHL_support_the_colonial_plan: "支持殖民計劃"
 CHL_support_the_colonial_plan_desc: "德國殖民辦公室曾經制定了一項計劃，旨在迅速奪取烏拉圭國家機器的控制權，並扶植一個殖民傀儡政府。我們現在有能力試圖使這成為現實，並應要求烏拉圭向我們的聯盟屈服，並在歷史上選擇正確的一方。"
 CHL_unite_with_our_brothers_in_hispania: "與希斯帕尼亞兄弟團聚"
 CHL_unite_with_our_brothers_in_hispania_desc: "我們在古希斯帕尼亞失散已久的兄弟有與我們貌離神合的意識形態，但在任何戰爭中都不願加入德國一方。我們可以推動他們最終成為德國陣營的一員。"
 CHL_restore_the_old_kingdom: "重建舊王國"
 CHL_restore_the_old_kingdom_desc: "鑑於我們已控制領土收復主義者宣稱之智利王國疆域內的所有領土，即舊秘魯總督轄區的一部分，我們可以努力使這些領土融入我國，甚至跨越歷史上主張的邊界。"
 CHL_an_empire_on_the_pacific: "太平洋帝國"
 CHL_an_empire_on_the_pacific_desc: "現在我們的黃金時代真正開始了，是時候擴大我們的視野，向西看。我們將建立一個橫跨整個太平洋的偉大帝國！"
 CHL_modern_conquistadors: "征服者佩德羅·德·巴爾迪維亞"
 CHL_modern_conquistadors_desc: "現在舊智利王國終於恢復，是時候真正向我們的第一任皇家總督、征服者佩德羅·德·巴爾迪維亞致敬。前進，走向未知！"
 CHL_no_more_advisors_tt: "當前大部分§Y顧問§!將§R不可用§!"
 CHL_indigenous_union: "美洲原住民聯盟"
 CHL_carabineros_secured_by_opposition: "智利卡賓槍騎兵已經被反對派控制了"
 CHL_annex_and_core_all_american_subjects: "§Y吞併§!並獲得所有§Y美洲印第安和波利尼西亞附屬國§!的§Y核心地區§!"
 CHL_unified_in_spirit_tt: "所有§Y美洲印第安和波利尼西亞附屬國§!也將獲得該民族精神"
 CHL_avenge_the_pacification_tt: "國內各種反馬普切分子將在§R內戰§!中追隨§Y卡洛斯·伊瓦涅斯·德爾坎波§!對抗我們！"
 CHL_undermine_the_carabineros_de_chile_tt: "§Y內戰§!爆發時，防止伊瓦涅斯的一方獲得§Y額外的智利卡賓槍騎兵§!部隊"
 CHL_crusade_against_imperialism_tt: "解鎖從帝國主義壓迫中§Y解放美洲印第安§!和§Y波利尼西亞§!地區的決議"
 CHL_undermine_the_carabineros_de_chile_bonuses_tt: "§Y馬普切獨立戰爭§!爆發時：\n陸軍經驗：§G+25§!。\n增加基礎戰爭支持度：§G+5.00%§!。"
 CHL_ibanezs_coup: "伊瓦涅斯政變"
 CHL_ibanezs_coup_desc: "前總統兼將軍卡洛斯·伊瓦涅斯·德爾坎波一直渴望重新獲得失去的總統職位，如果有必要，他願意做一些見不得人的交易來確保這一點。因此，他願意支持保守派和法西斯主義者的聯合政變，只要他們承諾讓他領導國家。"
 CHL_address_the_mapuche_conflict: "解決馬普切衝突"
 CHL_address_the_mapuche_conflict_desc: "國家不穩定，但馬普切人的情況在伊瓦涅斯的統治下仍然不會好轉，因此我們必須迅速採取行動。為了一勞永逸地推翻智利政府，原住民活動家和政治家曼努埃爾·曼基萊夫開始聚集和團結許多分裂的馬普切組織。"
 CHL_undermine_the_carabineros_de_chile: "削弱智利卡賓槍騎兵"
 CHL_undermine_the_carabineros_de_chile_desc: "智利卡賓槍騎兵曾經由卡洛斯·伊瓦涅斯·德爾坎波總統創建，並且他們仍然非常忠於他。如果我們要建立一個由我們領導的國家，他們肯定會站在他一邊，阻礙我們。因此，我們必須盡我們所能，確保他們在未來擁有儘可能少的權力。"
 CHL_la_corporacion_araucania: "阿勞卡尼亞社團"
 CHL_la_corporacion_araucania_desc: "阿勞卡尼亞社團由保守派和社團主義者貝南西奧·科紐埃潘·溫克瓦爾領導，他是阿瓦希諾一位著名軍閥的孫子，可能會成為反對智利政府的有用盟友。"
 CHL_la_federacion_araucania: "阿勞卡尼亞聯邦"
 CHL_la_federacion_araucania_desc: "馬普切傳統主義者曼努埃爾·阿布爾托·潘吉萊夫領導的阿勞卡尼亞聯邦強烈反對與現代智利社會合作，他們會很容易被納入我們的獨立運動。"
 CHL_sociedad_caupolican_defensora_de_la_araucania: "阿勞卡尼亞考波利坎協會"
 CHL_sociedad_caupolican_defensora_de_la_araucania_desc: "由曼努埃爾·曼基萊夫領導的阿勞卡尼亞考波利坎捍衛者協會是目前最大的馬普切組織之一，也是成功革命的基礎。獲得該組織成員的支持應該被視為首要任務。"
 CHL_union_araucana: "阿勞卡尼亞聯盟"
 CHL_union_araucana_desc: "阿勞卡尼亞聯盟是智利最古老的馬普切組織之一。他們通過與阿勞卡尼亞的方濟嘉布遣會的密切聯繫，推動了天主教傳福音和融入智利社會的進程，但如果能成功說服他們，這些人將支持我們的事業。"
 CHL_la_moderna_araucania: "現代阿勞卡尼亞"
 CHL_la_moderna_araucania_desc: "現代阿勞卡尼亞是最早在智利成立的馬普切人組織之一，其重點是教育和進步。我們應該努力使他們融入我們的運動，儘可能地利用他們的所長。"
 CHL_electing_a_toqui: "選舉一位托基"
 CHL_electing_a_toqui_desc: "根據馬普切人的傳統，在戰爭期間，托基是由隆科大會選出的軍事領袖，隆科是馬普切人的政治與宗教首領。托基在馬普切社會中扮演著最高的角色，需要在戰爭期間領導著戰士和隆科。現在是時候選舉一位新的托基了，這人要有能力領導我們的反帝國主義運動！"
 CHL_electing_a_toqui_tt: "我們將能夠選出一位具有獨特特質的領導人"
 CHL_convene_the_araucanian_congress: "召集阿勞卡尼亞議會"
 CHL_convene_the_araucanian_congress_desc: "發動獨立戰爭的時機已近，但我們的組織內部出現了分裂。有人說，共產黨和我們的目標相似，會是一個有用的盟友；也有人說，他們只會造成黨派之爭，在最關鍵的時候背叛我們。應該信任誰？"
 CHL_avenge_the_pacification_of_araucania: "為阿勞卡尼亞平定戰爭復仇"
 CHL_avenge_the_pacification_of_araucania_desc: "1861年至1883年智利對阿勞卡尼亞的佔領是馬普切歷史上的黑暗時期，現在是我們為智利人給我們帶來的不公正和戰爭報仇雪恨的時候了。戰鬥吧，勇敢的戰士們！奪回那些曾經屬於你們的，它將再次屬於你們！向基拉潘和考波利坎的遺產致敬！"
 CHL_revise_the_social_classes: "修正社會階層"
 CHL_revise_the_social_classes_desc: "現在我們又有了自己的社會，是時候重組社會階層，使之更好地適應我們的觀點和理想了。歐洲人的時代很快就要結束了！"
 CHL_adopt_mapundungun: "採用馬普切語"
 CHL_adopt_mapundungun_desc: "向重建一個真正的馬普切國家邁出的一大步將是採用馬普切語作為官方語言，至少要在法庭上使用這種語言。我們還必須開始教育我們國家的人民，讓他們能夠學習我們的語言。"
 CHL_embrace_indigenous_corporatism: "採納本土社團主義"
 CHL_embrace_indigenous_corporatism_desc: "貝南西奧·科紐埃潘·溫克瓦爾基於智利土著手工藝和建築的古老理念的社團主義思想應該被採納，同時被制定為我國工業界的官方國家政策。"
 CHL_expand_the_agricultural_field: "加強農業領域"
 CHL_expand_the_agricultural_field_desc: "儘管貝南西奧·科紐埃潘·溫克瓦爾提出了現代思想，仍有許多人想回到以農業為基礎的舊社會，只是這一次國家會對那些無法維持自己生活的人進行更多的干預。我們必須順應人民的意願，鞏固國家穩定。"
 CHL_focus_on_cattle_and_wool: "注重牛和羊毛"
 CHL_focus_on_cattle_and_wool_desc: "如今，國內最普遍的兩種家畜是牛和羊，試圖改變這一點是不明智的。相反，我們應該推動全國農民購買這些動物。"
 CHL_enlarge_the_textile_industries: "擴大紡織工業"
 CHL_enlarge_the_textile_industries_desc: "紡織品一直在全國範圍內大量生產，今天應該也不例外。國家應該補貼新紡織工業的發展，並嘗試與志同道合的國家建立貿易路線。"
 CHL_silverworking: "銀器加工"
 CHL_silverworking_desc: "銀器加工一直是馬普切人的特殊傳統手工藝之一，高檔昂貴的銀飾很容易出口，因為我們也擁有大量的天然銀礦，特別是一旦我們從阿根廷人手中奪回普埃爾馬普。"
 CHL_incorporate_machi_into_the_army: "吸收馬奇巫醫入軍"
 CHL_incorporate_machi_into_the_army_desc: "馬奇巫醫是我們信仰中的傳統醫師和宗教領袖，以其傳統的醫藥手藝聞名。我們應該讓每個師都擁有一位馬奇巫醫，保障我軍的戰時健康。"
 CHL_the_patagonian_giants: "巴塔哥尼亞巨人"
 CHL_the_patagonian_giants_desc: "巴塔哥尼人或巴塔哥尼亞巨人是傳說中生活在巴塔哥尼亞的巨人種族，在早期的歐洲記載中也有描述，據說他們的身高至少超過了正常人類的兩倍。儘管這些謠言是不真實的，但我們應該努力使我們的武裝部隊不辜負這些巨人的形象，並在我們的敵人眼中散佈恐懼。"
 CHL_taking_back_patagonia: "[CHL_taking_back_patagonia_key]"
 CHL_taking_back_patagonia_desc: "[CHL_taking_back_patagonia_desc_key]"
 CHL_honor_the_legacy_of_caupolican: "致敬考波利坎的遺產"
 CHL_honor_the_legacy_of_caupolican_desc: "考波利坎是一位托基，他曾在16世紀領導他的人民抵抗入侵馬普切領土的西班牙征服者。如果我們希望我們的大陸擺脫歐洲帝國主義者，我們應該努力不辜負考波利坎和勞塔羅這樣的人物。"
 CHL_union_of_american_indigenous_peoples: "美洲原住民聯盟"
 CHL_union_of_american_indigenous_peoples_desc: "世界上有許多民族受到歐洲帝國主義的殘暴壓迫和折磨。是時候讓美洲印第安人、因紐特人和波利尼西亞人團結在一面旗幟下，擊退這些邪惡的侵略者了！"
 CHL_union_of_american_indigenous_peoples_tt: "§Y金廷·拉梅§!解鎖為§Y陸軍將領§!"
 CHL_crusade_against_imperialism: "討伐帝國主義"
 CHL_crusade_against_imperialism_desc: "現在終於到了我們準備以正義的名義征服更廣闊的世界的時候了！現在是我們向頹廢的歐洲人表明，我們不會再對他們卑躬屈膝的時候了。士兵們，拿起武器，這一次，我們將向他們宣戰！"
 CHL_unified_by_will: "意志統一"
 CHL_unified_by_will_desc: "在我們反帝國主義的努力下，美洲印第安人和波利尼西亞人現在已經團結起來了，但這還不夠。如果我們希望在未來的幾個世紀裡遏止歐洲人的入侵，我們必須團結起來，為我們所有的人民組成一個國家，按照我們的意願，建立一個不受歐洲人統治的國家。"
 CHL_unified_in_spirit: "精神統一"
 CHL_unified_in_spirit_desc: "鑑於我們有著共同的目標，我們可以像上了油的齒輪一樣合作無間。因此，儘管無需將各國合為一體，我們仍然應該爭取各國軍隊聯合以及更廣泛的合作。美洲和太平洋人民在精神上是一致的，而且會永遠肩並肩！"
 CHL_taking_back_patagonia_kingdom: "重新統一王國"
 CHL_taking_back_patagonia_kingdom_desc: "儘管我們宣稱自己是阿勞卡尼亞和巴塔哥尼亞的新王國，但我們實際上仍然缺少王國的很大一部分，即巴塔哥尼亞。我們應該努力盡快統一王國，以免失去我們僅有的一點正統性。"
 CHL_taking_back_patagonia_mapuche: "光復普埃爾馬普"
 CHL_taking_back_patagonia_mapuche_desc: "普埃爾馬普的老馬普切人地區，即今天阿根廷巴塔哥尼亞的大部分地區，仍然處於外國的壓迫之下，除非我們先成功地解放我們自己的美洲印第安人，否則我們又如何去解放任何其他的土著。因此，既然沒有別的辦法，我們將不得不開戰……"
 CHL_ibanez_as_prime_minister_tt: "僱傭§Y卡洛斯·伊瓦涅斯·德爾坎波§!為顧問"
 CHL_return_to_the_parliamentary_era_tt: "僱傭§Y米格爾·克魯查加·托科納爾§!為顧問"
 CHL_je_suis_le_deluge_tt: "§Y安托萬三世§!獲得特質§Y法蘭西與美洲真正的皇帝§!"
 CHL_the_straight_line_tt: "直線組織將會推翻§Y安托萬三世§!並將王國交給§Y卡洛斯·伊瓦涅斯·德爾坎波§!"
 CHL_satellite_kingdoms_tt: "解鎖§Y建立衛星王國§!的決議，在我國控制對應歷史領土時，提供建立§Y[INC.GetNameDef]§!、§Y[SUR.GetName]§!和§Y[HAI.GetName]§!傀儡國的選項。"
 CHL_rule_by_decree: "敕令治國"
 CHL_rule_by_decree_desc: "在他的第一任總統任期內，從1927年到1931年，伊瓦涅斯通過敕令治國，行使獨裁權力。現在，他必須再一次這樣做，以引導這個國家走向正確的方向。"
 CHL_strengthen_the_carabinieros: "加強智利卡賓槍騎兵"
 CHL_strengthen_the_carabinieros_desc: "智利卡賓槍騎兵於1927年由伊瓦涅斯親自建立，該組織的大部分成員仍然非常忠於他。因此，確保那些在組織中擁有權力的人是忠誠的人可能是值得的。"
 CHL_seek_foreign_investments: "尋求境外投資"
 CHL_seek_foreign_investments_desc: "利用從外國借來的資金幫助和重建國家產業，這是伊瓦涅斯行之有效的方法，這次也不例外。"
 CHL_increase_spending_on_public_works: "增加公共工程開支"
 CHL_increase_spending_on_public_works_desc: "如果說亞歷山德里在他的總統任期內確實證明了什麼，那就是公共工程是振興經濟的好方法。"
 CHL_alianza_popular_libertadora_as_a_vanguard: "人民解放聯盟"
 CHL_alianza_popular_libertadora_as_a_vanguard_desc: "由於單純依靠自己的力量很難進行統治，所以最好是組建一個聯合政府，由各右翼政黨的顧問提出自己的意見。"
 CHL_utilize_national_populism: "利用民族民粹主義"
 CHL_utilize_national_populism_desc: "人民是容易受騙的，任何承諾給他們土地、財富或榮譽的東西，不管多麼空洞，都會讓他們站在你這邊，儘管他們的支持可能反覆無常。"
 CHL_outlaw_socialism: "禁止社會主義"
 CHL_outlaw_socialism_desc: "有許多人反對伊瓦涅斯的獨裁統治，但沒有一個像社會主義者那樣堅定。因此，我們必須儘快把他們從這個國家清除出去。"
 CHL_sell_arica_to_peru: "把阿里卡賣給秘魯"
 CHL_sell_arica_to_peru_desc: "獲得大量資金以助力解決經濟問題的一個好方法是將南美太平洋戰爭期間從秘魯人和玻利維亞人手中奪取的大片土地賣給他們。"
 CHL_sell_arica_to_peru_civil_war_tt: "§R完成此國策，且完成$CHL_outlaw_socialism$和$CHL_utilize_national_populism$之一時將會導致內戰。§!"
 CHL_sell_arica_to_peru_civil_war_tt_2: "§R完成此國策和$CHL_sell_arica_to_peru$將會導致內戰§!"
 CHL_crown_antoine_as_sovereign_king: "加冕安托萬為至高君王"
 CHL_crown_antoine_as_sovereign_king_desc: "雅克·安托萬·伯納德從法國回到這裡，在我們內戰期間為我們的政府提供了援助，但代價是我們不得不給他權力並授予他阿勞卡尼亞和巴塔哥尼亞的至高君王的頭銜。這難道會出問題？"
 CHL_strike_a_deal_with_the_mapuche: "與馬普切人達成協議"
 CHL_strike_a_deal_with_the_mapuche_desc: "正是馬普切人曾經允許奧雷列-安托萬一世成為阿勞卡尼亞和巴塔哥尼亞的第一任國王，正是通過我們與他們的紐帶，我們才能讓新的馬普切組織站在我們這一邊。"
 CHL_request_assistance_in_the_war: "請求戰爭援助"
 CHL_request_assistance_in_the_war_desc: "世界上有多個國家將受益於又一個對歐洲友好的政府。我們應該尋求他們的支持以擊敗我們政府的敵人。"
 CHL_request_assistance_in_the_war_tt: "如果被接受，這個國家將能夠在內戰期間向我們派遣志願軍，並且更傾向於這樣做。"
 CHL_mobilize_the_veteran_legionaries: "動員軍團老兵"
 CHL_mobilize_the_veteran_legionaries_desc: "國王安托萬三世為訓練和幫助動員新部隊而調來的法國外籍軍團現在急需投入前線，應認真考慮將他們招募到正規部隊中。"
 CHL_establish_a_royal_guard: "建立王室衛隊"
 CHL_establish_a_royal_guard_desc: "任何身邊沒有大批僕人和侍衛的國王都是不完整的，遺憾的是安托萬三世恰恰缺乏這些，因此當務之急是儘快建立一支王室衛隊。"
 CHL_attract_additional_french_investments: "吸引更多法國投資"
 CHL_attract_additional_french_investments_desc: "法國商人和實業家最初在安托萬遠征智利時聞到了巨大的商機，現在他們被他的偉大壯舉所打動，並很容易被說服，願意接受以未來土地的承諾而提供更多的援助。"
 CHL_invite_french_aristocracy: "邀請法國貴族"
 CHL_invite_french_aristocracy_desc: "為了解決國內莊園佃戶制度的問題，我們應該引進新的法國貴族制度，重新設計國家貴族制度的運作方式。"
 CHL_ibanez_as_prime_minister: "伊瓦涅斯就任首相"
 CHL_ibanez_as_prime_minister_desc: "毫無疑問，安托萬三世無法完全獨自統治，因為他缺乏伊瓦涅斯那樣的政治才能和知識。因此，君主制國家必須立憲。"
 CHL_no_deluges_tt: "這會§R禁止§!你使用國策樹中的§Y我即浪潮§!"
 CHL_an_absolute_monarchy: "君主專制國家"
 CHL_an_absolute_monarchy_desc: "還有很多事情要做，唯一有能力控制和指引國家的是國王。這就是為什麼至關重要的是通知內閣他們都可以回家了，因為我們不需要他們。"
 CHL_an_absolute_monarchy_tt: "這會§R禁止§!你使用國策樹中的§Y走直線§!"
 CHL_approach_the_moderates: "與溫和派接洽"
 CHL_approach_the_moderates_desc: "儘管他們不喜歡君主制，但如果他讓他們這麼做，這個國家有很多人至少會聽從伊瓦涅斯，而這正是他必須要做的。"
 CHL_introduce_the_franc: "引進法郎"
 CHL_introduce_the_franc_desc: "智利比索疲軟且不斷貶值，而且與舊智利政府有關。為了國家的利益，我們應該努力引進法郎來取代這種貨幣。"
 CHL_strengthen_control: "加強控制"
 CHL_strengthen_control_desc: "我們必須從弱智的叛軍手中奪回各省的控制權，他們看不清現實的本質，居然反抗安托萬的偉大政權。"
 CHL_invite_carlist_refugees: "邀請卡洛斯派流亡者"
 CHL_invite_carlist_refugees_desc: "同為君主制的支持者，西班牙的卡洛斯派與我們關係密切。鑑於他們已經被趕出家園，我們可以通過在這裡為他們提供避難所來贏得他們的好感。"
 CHL_expand_the_officer_corps: "擴大軍官隊伍"
 CHL_expand_the_officer_corps_desc: "有許多忠於法西斯或社會主義事業的軍官後來都離開了我們的部隊。我們應該擴大軍官隊伍，培養年輕軍官，以解決新的短缺問題。"
 CHL_the_scouts_monarchist_youth_organization: "皇家童子軍"
 CHL_the_scouts_monarchist_youth_organization_desc: "我們應該建立一個準軍事組織，在必要的時候教年輕人如何履行戰時的職責，教我們的人民如何生存和作戰。"
 CHL_state_catholicism: "尊天主教為國教"
 CHL_state_catholicism_desc: "舊自由派政府將天主教會從國家中分離出來，這在我們現在看來是一種嚴重的罪行。我們必須立即糾正這個巨大的錯誤！"
 CHL_invite_french_academia: "邀請法國學術界"
 CHL_invite_french_academia_desc: "為了讓我們國家的人民學習和取得偉大的成就，為了讓我們的國家在全球舞臺上取得競爭所需的突破，我們必須邀請來自歐洲大陸的法國學術界助力我們相應的教育和組織工作。"
 CHL_a_new_araucanian_noble_class: "新阿勞卡尼亞貴族階級"
 CHL_a_new_araucanian_noble_class_desc: "雖然我們現在確實有大量的貴族，但我們應該制定計劃，讓人們成為國家的貴族，以換取對國家的投資，或以國王的名義做貢獻。"
 CHL_establish_the_royal_mountaineers: "組建皇家山地部隊"
 CHL_establish_the_royal_mountaineers_desc: "南安第斯山脈是我國的象徵，而山地部隊則是打下我國立國之基的精英部隊。我們應該擴編這隻部隊，並確保他們能獲得所有需要的裝備。"
 CHL_an_imperial_capital: "帝都"
 CHL_an_imperial_capital_desc: "就目前的情況而言，我們的首都是聖地亞哥，也是舊智利的首都。最好把首都遷到另一個地方，至少應該考慮一下這個提議。"
 CHL_an_imperial_capital_tt: "我們將獲得選項保持§Y聖地亞哥§!作為首都並增加§G2§!個建築位，或將首都遷至§Y特木科§!並增加§G4§!個建築位。"
 CHL_satellite_kingdoms: "衛星王國"
 CHL_satellite_kingdoms_desc: "拿破崙大帝對安托萬是一個很大的啟發，他的學說對世界上所有的政治家都是如此。我們應該像他那樣做，建立更小的緩衝國，讓當地民眾不去想他們的新宗主國。"
 CHL_secure_the_brazilian_border: "確保與巴西的邊境"
 CHL_secure_the_brazilian_border_desc: "巴西是該大陸上能夠與我們競爭的少數幾個國家之一。我們應該確保我們與他們的邊境，這樣一旦時機成熟，就可以儘可能容易地入侵。"
 CHL_a_new_empire_of_brazil: "新巴西帝國"
 CHL_a_new_empire_of_brazil_desc: "我們要讓巴西臣服於我們，建立一個新的巴西帝國，由一個非葡萄牙血統的新國王統治！"
 CHL_ruler_of_the_inca: "印加統治者"
 CHL_ruler_of_the_inca_desc: "古印加帝國幅員遼闊，橫跨安第斯山脈的大部分地區。我們應該重現這一幕，但需換一批人來管理，得換成我們來管。"
 CHL_a_french_alliance: "團結法語圈"
 CHL_a_french_alliance_desc: "隨著我們在法國的君主主義朋友取得控制權，尋求與他們結盟將被證明是明智的，因為他們與我們有著相同的意圖和目標，以及相同的傳統和語言。團結起來，我們勢不可擋。"
 CHL_return_to_the_continent: "回到歐洲大陸"
 CHL_return_to_the_continent_desc: "法國現行體制存在固有的弱點，我們就是來利用它的。是時候再次回到歐洲大陸，奪回我們與生俱來的權利了！"
 CHL_joint_invasion_of_mexico: "聯合入侵墨西哥"
 CHL_joint_invasion_of_mexico_desc: "現在我們已經與法蘭西帝國建立了聯盟，是時候重新開始我們曾經失敗的事情了。墨西哥帝國必須再次崛起，否則我們都會被強大的美國人打敗！"
 CHL_claim_the_mexican_throne: "奪取墨西哥王位"
 CHL_claim_the_mexican_throne_desc: "儘管時間很短，墨西哥的王位曾經屬於一位法國皇帝。我們應該利用這一事實，宣稱我們是他們的後代，隨時準備奪回這個國家。"
 CHL_the_straight_line: "走直線"
 CHL_the_straight_line_desc: "瘋子安托萬三世在聚光燈下度過了他的時光。現在是讓直線組織重建祖國秩序，並加冕伊瓦涅斯為偉大智利國的新國王之時了。"
 CHL_je_suis_le_deluge: "我即浪潮"
 CHL_je_suis_le_deluge_desc: "從前，人們說洪水總有一天會來，現在就是那一天。我們是洪水，我們將摧毀腐朽的世界秩序，帶來一個新時代！"
 CHL_offer_to_protect_pitcairn: "提議保護皮特凱恩島"
 CHL_offer_to_protect_pitcairn_desc: "目前[270.GetName]的防禦比我們預期的要弱，這為我們的敵人提供了佔領並利用它作為入侵復活節島甚至我們的心臟地帶的基地的機會。為了我們自己的安全，我們應該主動提議保護該島。"
 CHL_a_grand_armada: "無敵艦隊"
 CHL_a_grand_armada_desc: "就像古老的大西班牙帝國，我們是從那裡創建的，卡洛斯·伊瓦涅斯·德爾坎波希望擁有一支強大的艦隊，足以挑戰英國皇家海軍，美國和德國公海艦隊，讓它成為現實吧！"
 CHL_reclaiming_quebec: "收復魁北克"
 CHL_reclaiming_quebec_desc: "我們需要將在魁北克的講法語兄弟從外國的壓迫和佔領的魔爪中解放出來，並且他們應該被當作我們的兄弟來珍惜，我們要一同對抗那些英語國家的霸權。我們現在必須解救他們！"
 CHL_reclaiming_quebec_tt: "解鎖決議：§Y整合魁北克§!"
 CHL_work_on_the_pan_american_highway: "泛美高速公路項目"
 CHL_work_on_the_pan_american_highway_desc: "在近年來舉行的各種泛美會議上，我們一致同意與北美和南美的兄弟國家合作，幫助連接南北美兩大洲，完成泛美公路項目。"
 working_on_the_pan_american_highway: "泛美高速公路正在動工"
 #### Brazil ####
 BRA_defense_spending: "增加防衛開支"
 BRA_defense_spending_desc: "世界局勢已經被點燃，沒有國家可以長久地獨善其身。因此，我們應當增加國防開支。無論是生產我們武器的工廠還是建設新的防禦工事，我們都將確保巴西的安全直至最後一刻！"
 BRA_natal_naval_base: "建造帕納米林機場"
 BRA_natal_naval_base_desc: "得益於我們與美國的新合作，他們提出主要使用他們自己的資金在我國建立空軍基地，以換取我們允許美國海軍、美國陸軍和英國皇家空軍使用該機場在南美洲和西非之間飛行。"
 natal_airbase_modifier: "允許我們使用帕納米林機場"
 BRA_no_fascism_in_south_america: "清除南美法西斯"
 BRA_no_fascism_in_south_america_desc: "隨著我們直言不諱地反對法西斯主義，是時候對當前的危機採取行動，保護我們的大陸免受惡劣意識形態的影響了。不，[BRA.GetNameDef]不是你們的殖民地！"
 BRA_no_fascism_in_south_america_tt: "獲得對§Y南美洲§!所有§Y法西斯主義§!國家的§Y$puppet_wargoal_focus$§!戰爭目標"
 BRA_no_communism_in_south_america_tt: "獲得針對§Y南美§!所有§Y共產主義§!國家的§Y$puppet_wargoal_focus$§!戰爭目標"
 BRA_anti_democracy_in_south_america_tt: "獲得對§Y南美洲§!所有§Y民主主義和中立主義§!國家的§Y$puppet_wargoal_focus$§!戰爭目標"
 BRA_tribunal_de_seguranca_nacional: "國家安全法庭"
 BRA_tribunal_de_seguranca_nacional_desc: "雖然民族解放聯盟未能推翻我們的政府，但他們的成員仍然走在街頭，策劃和尋找另一個破壞國家的機會。在緊急狀態期間設立特別軍事法庭，這些罪犯將得到更有效的審判。"
 BRA_ensure_continued_military_support: "確保軍事支持"
 BRA_ensure_continued_military_support_desc: "確保軍隊的支持對我們政權的壽命至關重要。只要國家和領導者之間做出些許承諾，他們必定會為我們的事業而戰。"
 BRA_work_with_the_integralists: "與整合運動者合作"
 BRA_work_with_the_integralists_desc: "整合運動的目標大體上是與我們一致的，因此，獲得他們的支持有助於我們對抗任何進一步的共產主義叛亂。他們的準軍事力量和根深蒂固的民族主義，將成為反革命的先鋒。"
 BRA_estado_moderno: "國家現代化"
 BRA_estado_novo_desc: "在處於內戰邊緣多年之後，我們終於可以打破長久的政治僵局，建立一個基於和平、正義和工作的新國家。與此同時，我們將繼續剷除那些反對新常態的人，以免他們散播更多異議。"
 BRA_estado_moderno_tt: "§Y$BRA_getulio_vargas$§!成為§Y$BRA_fascism_party_long$§!的領袖"
 BRA_estado_moderno_tt_desc: ""
 BRA_estado_novo: "新國家體制"
 BRA_estado_moderno_desc: "隨著我們國內的敵人被分散和擊敗，是時候廢除舊的政治安排，宣佈建立一個現代國家，一個能夠確保[BRA.GetName]人民長期和平與穩定的國家了。"
 BRA_cohen_plan: "科恩計劃"
 BRA_cohen_plan_desc: "隨著選舉的臨近和我們在選民中的支持率的下降，我們需要通過其他方式確保我方政權的持續。通過偽造另一場共產主義政變的計劃，我們可以重振支持度，同時為了國家安全暫停選舉。"
 BRA_cohen_plan_tt: "解鎖§Y$BRA_execute_the_cohen_plan$§!任務，必須在完成該國策後的100日內完成。完成該任務需完成§Y$BRA_estado_novo$§!或§Y$BRA_estado_moderno$§!國策。§R任務失敗將導致政變！§!"
 BRA_the_polaca: "第三共和國憲法"
 BRA_the_polaca_desc: "雖然已經很少有人有能力對我們的政權構成嚴重威脅，但如果我們起草一部概述總統權力的新憲法將增加我們的合法性。也許我們可以從最近頒佈的波蘭憲法中汲取靈感。"
 BRA_anaue: "阿瑙埃！"
 BRA_anaue_desc: "我們的運動已經採用圖皮人的詞語“阿瑙埃”為口號。這個詞囊括了成員間的兄弟情誼和他們堅定不移保衛我國的信念。阿瑙埃！"
 BRA_anaue_tt: "解鎖在各地區完成集會後招募整合主義民兵師的決議。\n招募一位新陸軍將領，擁有§Y$militias_officer$§!特質：\n 民兵防禦§G+5%§!\n 民兵速度§G+5%§!\n 民兵組織度§G+5%§!"
 BRA_autarky: "巴西封閉經濟"
 BRA_autarky_desc: "華爾街崩盤後的經濟動盪波及全球，摧毀了我們的經濟。從咖啡消費到鋼鐵生產，我們必須在所有事情上自給自足，並使自己免受未來任何外國危機的影響。"
 BRA_corporatism: "擁抱社團主義"
 BRA_corporatism_desc: "勞工和資本家之間的爭端破壞了[BRA.GetAdjective]經濟太久了。為了應對這種情況，我們將引入一種新的經濟模式，該模式基於近年來許多更成功的歐洲國家的社團主義政策。"
 BRA_departamendo_de_propaganda: "宣傳部"
 BRA_departamendo_de_propaganda_desc: "最近十年的政治動盪充分表明了當政府和人民的觀點不一致時會發生什麼。為了防止進一步的動亂，我們將成立一個宣傳部門，促使人民與我們的政策保持一致。"
 BRA_departamento_de_ordem_politica_e_social: "政治和社會秩序部"
 BRA_departamento_de_ordem_politica_e_social_desc: "宣傳和脅迫不足以阻止最忠誠的激進分子或外國代理人進行危害國家的活動。因此，我們需要一支新的秘密警察部隊來調查這種威脅。"
 BRA_collective_bargaining: "集體談判"
 BRA_collective_bargaining_desc: ""
 BRA_cooperation_in_the_americas: "睦鄰政策"
 BRA_cooperation_in_the_americas_desc: "富蘭克林·羅斯福的“睦鄰政策”在西半球仍然具有影響力。我們應該接受這一政策，努力與美洲國家合作，而不是干涉彼此的事務。"
 BRA_tech_slot_1: "聖保羅大學"
 BRA_tech_slot_1_desc: "聖保羅大學是最近才成立的，但它的益處已經在整個[BRA.GetAdjective]經濟中感受到了。我們應該利用這一點，加大對這一新興機構的投資。"
 BRA_reject_cosmopolitanism: "拒絕世界主義"
 BRA_reject_cosmopolitanism_desc: "最近走向世界主義的趨勢只不過是共產主義干涉我們偉大國家的特洛伊木馬。我們是[BRA.GetAdjective]人，我們必須在我們的文化和理想被摧毀之前捍衛它們。"
 BRA_ban_political_parties: "禁止政黨"
 BRA_ban_political_parties_desc: "事實證明，政黨只不過是製造分裂和破壞的工具。通過禁止和消除他們，我們可以削弱激進分子組織起來反對我們的能力。"
 BRA_decree_no_37: "第37號法令"
 BRA_decree_no_37_desc: "由於一些地區對國家政治的影響力過大，前政權充斥著腐敗和國內的爭端。因此，我們應該打擊任何地方主義的表達，並將權力集中在國家政府。"
 BRA_establish_psad: "建立公共服務行政部"
 BRA_establish_psad_desc: "使我國政府的政策得以實施的國家機構已經陳舊過時。我們將設立公共服務行政部（DASP），以幫助我們更有效地管理國家和保持經濟效率。"
 BRA_federal_employment_plan: "聯邦就業計劃"
 BRA_federal_employment_plan_desc: "大規模失業將導致持續的激進主義和暴力。為了防止這種情況的發生，我們應該通過創建國有企業和新的基礎設施項目來擴大就業機會。"
 BRA_secure_our_borders: "保護我們的邊境"
 BRA_secure_our_borders_desc: "我們被那些想要孤立和摧毀我們偉大國家的敵人包圍了。在國內局勢得到控制的情況下，我們應該把注意力轉向外交事務，並開始採取措施確保我們的國家安全。"
 BRA_ethical_internationalism: "倫理國際主義"
 BRA_ethical_internationalism_desc: "即使是最偉大的國家也不能創造和供應所有的東西給他們的人民。為了確保我國人民的和平與繁榮，我們的外交政策應該建立在與志同道合的國家建立互利的經濟夥伴關係的基礎上。"
 BRA_brazil_integral: " 巴西整合"
 BRA_brazil_integral_desc: "我們花了數年時間才達到這一時刻，但我們終於鞏固了對國家的控制，擺脫了陳舊的共和主義的最後痕跡。"
 BRA_in_vargas_we_trust: "我們信靠瓦加斯"
 BRA_in_vargas_we_trust_desc: "$BRA_getulio_vargas$已經證明了自己是一位有能力的政治家，能夠經受住領導的風暴。此外，他通過採納我黨的政策，證明了自己是一位英明的領導人。黨內許多人現在相信，他註定要把這個國家帶到更高的高度。"
 BRA_departamento_feminino: "女性部"
 BRA_departamento_feminino_desc: "有無數的婦女像她們的丈夫和父親一樣愛國和忠誠。我們應該給她們機會，讓她們參加我們的運動，為復興[BRA.GetAdjective]而共同努力。"
 BRA_integrity_of_the_fatherland: "為了祖國"
 BRA_integrity_of_the_fatherland_desc: "$BRA_getulio_vargas$一直是一個有用的政治盟友，但他只關心權力，並不是一個真正的整合主義者。有了我們在全國的廣泛支持，我們應該採取行動推翻總統，並任命像$BRA_plinio_salgado$這樣的真正信徒擔任公職。"
 BRA_no_communism_in_south_america: "南美沒有共產主義"
 BRA_no_communism_in_south_america_desc: "共產黨人是不可信任的，正如我們在1935年的革命中注意到的那樣，我們公正地鎮壓了那次革命。為了我們國家的未來，我們必須儘快處理任何接近的外國顛覆分子！"
 BRA_defense_of_the_fatherland: "保衛祖國"
 BRA_defense_of_the_fatherland_desc: "我們的雄心遠遠超出了我們目前的國界，但即便如此，我們也必須絕對確保沒有人能威脅到我們的國土。巴西萬歲！"
 BRA_german_subs: "德國潛艇發展項目"
 BRA_german_subs_desc: "與德國人結盟，我們就能夠將他們的技術用於我們以前難以自主現代化的領域，其中之一就是潛艇戰。我們要利用我們的新盟友，並控制佛得角平原！"
 BRA_german_sub_initiative: "德國潛艇資料交換"
 BRA_german_tanks: "獲取德國坦克"
 BRA_german_tanks_desc: "多虧我們和德國人站在一起，我們現在不僅可以更輕鬆地為研究和製造與德國坦克類似的坦克獲取藍圖和詳情，也可以直接從他們那裡購買這樣的載具。吸菸眼鏡蛇將在敵人心中散播恐懼！"
 BRA_german_tanks_tt: "獲得§Y200§![GER.GetAdjective]的§Y四號坦克A型-中型坦克§!"
 BRA_German_tank_exchange: "德國坦克資料交換"
 BRA_italian_trucks: "意大利聯合汽車開發"
 BRA_italian_trucks_desc: "我們不僅應該努力獲得意大利在開發和製造最先進機動車輛方面的專門知識，而且還應該下訂單，要求立即裝送意大利卡車。"
 BRA_italian_trucks_mio_tt: "解鎖§Y$ITA_fiat_organization$§!軍工機構。"
 BRA_italian_air_mio_tt: "解鎖§Y$ITA_fiat_aviazione_organization$§!軍工機構。"
 BRA_ford_mio_tt: "解鎖§Y$USA_ford_motor_company_organization$§!軍工機構。"
 BRA_italian_truck_exchange: "意大利摩托化資料交換"
 BRA_italian_aircraft: "意大利飛行器發展項目"
 BRA_italian_aircraft_desc: "與意大利人合作，我們就能夠將他們的技術用於我們以前一直致力於實現現代化的部門，而其中一個領域就是飛行器。使用意大利技術，我們將統治南美的天空！"
 BRA_Italian_plane_exchange: "意大利飛機資料交換"
 BRA_support_rural_folk: "窮人之父"
 BRA_support_rural_folk_desc: "生活在這個國家農村地區的[BRA.GetAdjective]人已經被政客們遺忘幾十年了。在這些領域進行投資，我們可以增加就業，改善基礎設施，同時也能獲得這一龐大人口的支持。"
 BRA_support_the_landowners: "支持糖業大亨"
 BRA_support_the_landowners_desc: "幾十年來，全球對糖的需求持續擴大，導致了在[ROOT.GetNonIdeologyName]種植這種作物的富有的地主階級被稱為“糖業大亨”。我們應該壓制農民中要求土地改革的呼聲來爭取他們的支持。"
 BRA_washington_accords: "[USA.Capital.GetCapitalVictoryPointName]協定"
 BRA_washington_accords_desc: "作為對美國軍事保證的交換，我們將把我們的經濟轉向戰爭裝備的生產，以支持他們捍衛我們共同的價值觀。"
 BRA_washington_accords_tt: "如果[USA.GetNameDef]同意協定："
 BRA_disrupt_operation_bolivar: "破壞玻利瓦爾計劃"
 BRA_disrupt_operation_bolivar_desc: "舊世界的國家長期干涉南美洲的事務。以前他們派士兵和堅船利炮，現在他們派情報人員。我們不能再對此類活動視而不見了，必須在我國境內追捕任何此類特工。"
 BRA_potenji_river_conference: "波滕日河會議"
 BRA_potenji_river_conference_desc: "我們花了很大的努力讓我們的經濟為戰爭做好準備，但現在是時候加入我們[USA.GetAdjective]同盟，並充分致力於西半球防禦，即便是需要應對全球範圍內的威脅。"
 BRA_potenji_river_conference_tt: "§Y[ROOT.GetFlag][ROOT.GetNameDefCap]將加入[USA.GetFlag][USA.GetNameDef]所在的陣營§!§R\n這同時也會導致我們向[USA.Getflag][USA.GetAdjective]當前的敵人宣戰！§!"
 BRA_smoking_cobras: "吸菸眼鏡蛇"
 BRA_smoking_cobras_desc: "許多人曾說讓我們的部隊抵達前線比讓眼鏡蛇吸菸還難，而如今將這個頭銜作為榮譽勳章的士兵們卻用他們的堅韌和專業震懾了我們的敵人。"
 BRA_senta_a_pua: "猛攻敵人！"
 BRA_senta_a_pua_desc: "我們的飛行員最近有一個戰鬥口號，把他們無與倫比的兇猛和對勝利的奉獻濃縮成一句話。猛攻敵人！"
 BRA_reach_out_to_our_neighbors: "向鄰國示好"
 BRA_org_american_states_faction: "美洲國家組織"
 BRA_reach_out_to_our_neighbors_desc: "由於我們是大陸上唯一說葡萄牙語的國家，我們長期以來與鄰國隔絕。也許現在是時候伸出手嘗試與他們建立更好的關係，而不是用懷疑的態度來對待他們。"
 BRA_rio_conference: "里約協議"
 BRA_rio_conference_desc: "最近的衝突加劇了我們地區長期以來存在的邊界爭端。在這些爭端進一步升級之前，南美國家應該一起通過外交途徑解決它們。"
 BRA_organization_of_american_unity: "美洲國家組織"
 BRA_organization_of_american_unity_desc: "我們的國內政策近年來取得了成功，現在是時候將我們的重心轉向外交事務，並通過美洲統一組織促進整個半球的合作了。"
 BRA_organization_of_american_unity_tt: "解鎖§Y邀請至美洲國家組織§!決議以邀請其他國家加入這個超國家組織。"
 BRA_org_american_unity_warning_tt: "§R請記住，本組織成員國將被要求保護任何受到攻擊的其他成員國。未能保護需要援助的成員國，或向其他成員國宣戰，將被組織開除！§!"
 BRA_financial_stimulation_tt: "決議將允許增加農村地區§G20%§!的§Y當地建設速度§!、§Y最大工廠數§!和§Y當地可用資源§!"
 BRA_coffee_crisis_aftermath: "咖啡危機的後果"
 BRA_coffee_crisis_aftermath_desc: "由於過度依賴咖啡為主的商品出口，導致大蕭條摧毀了巴西經濟。雖然前輩們已經為修復經濟做出了努力，但完成這項工作的責任落在我們身上。我們將重振我們的工業，成為這片大陸的經濟強國。"
 BRA_radio_nacional: "國家廣播電臺"
 BRA_radio_nacional_desc: "許多國家開始建立國家廣播機構，利用電波向大眾提供時事內容和娛樂節目。通過建立我們自己的國家廣播電臺，我們將避免在這些發展浪潮中落後。"
 BRA_desenvolvimentismo: "發展"
 BRA_desenvolvimentismo_desc: "如果我們希望人們重返工作崗位，並且讓我們的出口再次流動，我們就需要拉動經濟增長。為此，我們將創造新的產業，使人們更容易獲得金融服務。"
 BRA_promote_resource_extraction: "促進資源開採"
 BRA_promote_resource_extraction_desc: "我們國家有幸擁有豐富的自然資源。為了促進更大的經濟增長和經濟獨立，我們將為我們的產業投資現代化的開採設備。"
 BRA_companhia_siderurgica_nacional: "國家鋼鐵公司"
 BRA_companhia_siderurgica_nacional_desc: "鋼鐵已成為許多行業的重要資源，但我國國內的鋼鐵產量不足以滿足需求。因此，我們應該建立一家擁有尖端機械的國有國家鋼鐵公司，而不是從海外進口。"
 BRA_stimulate_the_civilian_economy: "刺激經濟"
 BRA_stimulate_the_civilian_economy_desc: "國內商品生產仍然不足，導致資金流出國內購買進口商品。我們必須通過發展我們自己的工業來減少這種情況的發生。"
 BRA_domestic_arms_industry: "國內軍火工業"
 BRA_domestic_arms_industry_desc: "國際局勢看起來日益緊張，這已導致世界主要武器生產國限制武器裝備出口。如果我們想保持我們的軍事實力，我們需要迅速發展我們自己的武器工業。"
 BRA_war_production: "戰時生產"
 BRA_war_production_desc: "戰火在全球迅速蔓延。如果戰火來到我們的土地上，我們必須能夠迅速將我們的工業從生產汽車和烤麵包機轉向生產坦克和炸彈。"
 BRA_deal_with_the_cangaceiro: "處理坎加索"
 BRA_establish_trade_relationships: "$CHL_establish_trade_relationships$"
 BRA_establish_trade_relationships_desc: "$CHL_establish_trade_relationships_desc$"
 BRA_reach_out_to_the_great_powers: "$ARG_reach_out_to_the_great_powers$"
 BRA_reach_out_to_the_great_powers_desc: "$ARG_reach_out_to_the_great_powers_desc$"
 BRA_deal_with_the_cangaceiro_desc: "坎加索只不過是一群強盜，長期以來一直是我們的眼中釘。是時候把這些北方之刺徹底驅逐出去了。"
 BRA_deal_with_the_cangaceiro_tt: "解鎖在受影響地區消滅坎加索的§Y$BRA_deal_with_the_cangaceiro$§!決議。"
 BRA_consolidation_of_labor_laws: "鞏固勞動法"
 BRA_consolidation_of_labor_laws_desc: "我們的勞動法為工人提供的保護很少，這不可避免地導致工人與企業主的分歧，並最終導致罷工。在這樣危險的時刻，我們不能承受這樣的打擊，也不能承受布爾什維克滲透的危險。因此，我們將鞏固我們的法律，在工人和資本家之間找到一個平衡。"
 BRA_consolidation_of_labor_laws_fallback_tt: "按照之前選擇的國策，將會改變§Y$BRA_estado_novo_modifier$§!或§Y$BRA_estado_moderno_modifier$§!民族精神："
 BRA_promote_immigration_to_brazil: "促進移民"
 BRA_promote_immigration_to_brazil_desc: "[BRA.GetName]是一個多元化的國家，他們的祖先曾經遍佈全球。隨著我們的經濟再次增長，豐富的資源等待開發，是時候鼓勵更多的人搬到這裡，也稱自己為[BRA.GetAdjective]人了。"
 BRA_promote_immigration_to_brazil_tt: "解鎖§Y$JUNO_promote_immigration_cat$§!決議來發展各個地區。"
 BRA_pact_of_silence: "沉默協議"
 BRA_pact_of_silence_desc: "國家崛起，國家衰落。隨著最近這麼多人的倒臺，各個領域的專家都在尋找更安全的家園。也許我們可以對他們的出身視而不見，只要我們能從他們的專業知識中獲得回報就行了。"
 BRA_national_petroleum_council: "國家石油委員會"
 BRA_national_petroleum_council_desc: "從田地裡的拖拉機到保衛我們海岸的戰艦，石油已經成為現代機器的命脈。依賴如此重要的資源是對我們國家安全的威脅。為了減輕這種風險，我們將建立一個國家石油委員會來監督國內石油的發現和開採。"
 BRA_batalha_do_borracha: "橡膠戰爭"
 BRA_batalha_do_borracha_desc: "[BRA.GetNameDefCap]曾經主宰著全球的橡膠供應，直到[ENG.GetAdjective]人在他們的帝國建立了自己的大片種植園。由於後者的補給線受到威脅，世界再次指望我們來提供這種寶貴的資源。"
 BRA_establish_companhia_vale_do_rio_doce: "淡水河谷公司"
 BRA_establish_companhia_vale_do_rio_doce_desc: "在米納斯吉拉斯州，尤其是伊塔比拉地區發現了大型鐵礦脈及其他多種豐富的礦藏。我們必須確保該州能夠開採這些資源並開發這些礦床，為此應成立一家以此為宗旨的新公司。"
 BRA_invest_in_road_infrastructure: "投資道路基礎設施"
 BRA_invest_in_road_infrastructure_desc: "汽車和卡車對經濟發展越來越重要。然而，我們的道路網絡還不夠發達，無法支持在全國範圍內大規模使用汽車。因此，在我們的經濟陷入停滯之前，我們需要投資大規模的高速公路建設項目。"
 BRA_invest_in_railways: "投資鐵路"
 BRA_invest_in_railways_desc: "火車仍然是長途大規模運輸人員和貨物最經濟的方法。因此，我們應該投資擴大鐵路網絡並使其現代化，同時還要研發我們自己的火車。"
 BRA_invest_in_ports: "投資港口"
 BRA_invest_in_ports_desc: "我們在滿足國內經濟需求方面取得了重大進展，使我們可以再次把出口作為促進經濟增長的手段。要做到這一點，我們需要對國家的主要港口進行投資。"
 BRA_fabrica_nacional_de_motores: "國家汽車廠"
 BRA_fabrica_nacional_de_motores_desc: "汽車是複雜的機器，因此進口要花很多錢。從長遠來看，這有可能阻礙我們的經濟增長。防止這種情況發生的最好辦法是發展我們自己的國產汽車。"
 BRA_expand_fordlandia: "發展福特公司的土地"
 BRA_expand_fordlandia_desc: "福特汽車公司投資在亞馬遜建立了一個社區，可以作為橡膠生產的工業基地。近年來，由於經濟動盪，該項目進展緩慢，但也許現在是重新啟動該項目的時候了。"
 BRA_fordlandia_name: "福特蘭迪亞"
 BRA_banco_do_brasil: "巴西銀行"
 BRA_banco_do_brasil_desc: "自大蕭條以來，中央銀行發行和控制貨幣供給的好處已經非常明顯。巴西銀行這樣做了很長一段時間，但現在是我們將這種措施制度化的時候了。"
 BRA_federal_development: "[BRA_federal_development_key]"
 BRA_imperial_development_key: "帝國發展"
 BRA_wealth_redistribution_key: "財富再分配"
 BRA_land_reform_key: "土地改革"
 BRA_federal_development_key: "聯邦發展"
 BRA_federal_development_desc: "必須在全國範圍內開展經濟發展，使所有人都能獲得辛勤工作的回報。因此，我們不僅需要使我們工業產出的商品多樣化，而且需要使它們的地點多樣化。"
 BRA_centralize_development: "建立新首都"
 BRA_centralize_development_desc: "我們目前的首都離這個國家的偏遠地區太遠，這導致了怨恨和分裂主義。為了兩全其美，我們應該在國家的中心位置建立一個新的首都，對所有人都更方便。"
 BRA_new_capital: "巴西利亞"
 BRA_centralize_development_tt: "新首都將被命名為§Y“$BRA_new_capital$”§!"
 BRA_financial_stimulation: "財政刺激"
 BRA_financial_stimulation_desc: "近年來，我們建立了新的產業和基礎設施項目，為強勁的經濟奠定了基礎。要保持增長，我們只需要拉動央行和國家產業的槓桿。"
 BRA_resource_extraction_bonus: "資源開採加成"
 BRA_oil_industry_bonus: "石油產業加成"
 BRA_industry_bonus: "刺激經濟紅利"
 BRA_electronics_bonus: "電子紅利"
 BRA_invest_in_railways_bonus: "鐵路加成"
 BRA_nacional_de_motores_bonus: "國家汽車廠加成"
 BRA_boost_integralist_support_tt: "解鎖在國內較大城鎮和城市中加強法西斯支持的§Y整合主義者集會§!決議。"
 BRA_domination_of_the_americas: "統治美洲"
 BRA_domination_of_the_americas_desc: "家門口有這麼多敵人，我們永遠不可能完全安全。只有我們成為該地區無可爭議的大國，才是拯救[BRA.GetAdjective]的唯一途徑。"
 BRA_berlin_accords: "簽訂柏林協定"
 BRA_berlin_accords_desc: "[USA.GetNameDefCap]長期干涉美洲其他國家的事務。通過與[GER.GetNameDef]結盟，我們可能獲得一種戰略威懾，防止[USA.GetAdjective]未來干涉我們自己的事務。"
 BRA_accords_tt: "如果他們同意合作："
 faction_name_bra_ger: "柏林-里約協議"
 faction_name_bra_ita: "羅馬-里約協議"
 BRA_expand_operation_bolivar: "加強玻利瓦爾計劃"
 BRA_expand_operation_bolivar_desc: "[GER.GetAdjective]人一直在南美進行大規模的情報行動，監視經濟和政治活動。我們被要求幫助他們擴大行動，以換取更多的情報合作。"
 BRA_guyana_crisis: "圭亞那危機"
 BRA_guyana_crisis_desc: "在全球其他地方的歐洲列強的注視下，我們有機會迫使它們將其在圭亞那的領土移交給我們，否則這些國家將在戰爭中面臨新戰線。"
 BRA_provoke_argentina: "挑釁阿根廷"
 BRA_provoke_argentina_desc: "很明顯，[ARG.GetName]希望孤立和摧毀我們，但如果我們在阻止他們這樣做時行動過於匆忙，我們可能會遭受[USA.GetName]的怒火。相反，我們應該挑釁[ARG.GetAdjective]人，讓他們先開火，我們最終會為內普拉塔戰爭復仇！"
 BRA_form_mercosul: "建立南方共同市場"
 BRA_faction_mercosul_name: "南方共同市場"
 BRA_form_mercosul_desc: "南美長期以來一直受到[USA.GetName]或歐洲帝國等其他列強的影響。但是，如果該洲各國團結起來，成為一個單一的經濟和政治集團，就沒有人敢再幹涉我們洲了。"
 BRA_form_mercosul_focus_tt: "解鎖邀請其他南美國家加入南方共同市場的決議"
 BRA_uruguay_ultimatum: "烏拉圭最後通牒"
 BRA_uruguay_ultimatum_desc: "[URG.GetNameDefCap]早就應該併入[BRA.GetName]，但我們的祖先沒能做到這一點。現在是時候糾正這個歷史錯誤，將我們的人民團結在一項共同的事業中了。"
 BRA_paraguay_intervention: "對巴拉圭的干預"
 BRA_paraguay_intervention_desc: "[PAR.GetNameDefCap]變得過於不穩定和不可預測。為了我們自己的國家安全，我們必須干預他們的國家事務，穩定他們的政局。"
 BRA_rome_accords: "簽訂羅馬協定"
 BRA_rome_accords_desc: "由於歷史上有許多[ITA.GetName]人移民到[BRA.GetName]，我們與他們的關係一直很密切。隨著世界開始變化，我們的政府變得更加一致，我們兩國之間建立正式的夥伴關係是有意義的。"
 BRA_italian_car_industry: "與意大利汽車工業合作"
 BRA_italian_car_industry_desc: "我們的汽車工業還處於起步階段，與此同時，我們在[ITA.GetName]的朋友有龐大而成功的汽車工業。也許是時候向他們請教如何改善我們羽翼未豐的汽車企業了。"
 BRA_penal_battalions: "懲戒營"
 BRA_penal_battalions_desc: "軍隊中的許多人對為流亡數十年的君主制而戰的前景並不感興趣。然而，自從國家安全法實施以來，我們製造了過剩的囚犯，他們可以被投入懲戒營，從而加強了我們士氣低落的常規部隊。"
 BRA_penal_battalions_tt: "創建師編制§Y懲戒營§!，它充分利用了受懲的官兵。同時會在§Y[ROOT.Capital.GetCapitalVictoryPointName]§!招募§Y6個單位§!。"
 BRA_end_the_state_of_emergency: "結束緊急狀態"
 BRA_end_the_state_of_emergency_desc: "曾經被視為英雄的[BRA.GetLeader]如今卻成為了[BRA.GetAdjective]民主制度的最大威脅。他對權力的渴望和機會主義傾向，使他幾乎完全剝奪了我們奮鬥爭取來的權利。所有珍視自由的人都必須反對這種危險的緊急狀態。"
 BRA_repeal_the_national_security_law: "廢除國家安全法"
 BRA_repeal_the_national_security_law_desc: "除非我們廢除$BRA_getulio_vargas$在緊急狀態期間使用的國家安全法，否則又一個機會主義總統破壞我們民主的威脅將永遠存在。"
 BRA_greater_federalism: "強化聯邦制"
 BRA_greater_federalism_desc: "政治權力的集中與我們的民主價值觀是不相容的。我們必須打破[ROOT.Capital.GetCapitalVictoryPointName]政治精英的束縛，把權力交還給共和國各地區。"
 BRA_democratic_socialism: "民主社會主義"
 BRA_democratic_socialism_desc: "1935年失敗的巴西共產黨和隨後的緊急狀態迫使許多左翼政治家和活動家逃離該國或轉入地下，無論他們是否支持暴力革命。隨著民主政權的牢固建立，民主社會主義者終於有機會回家了。"
 BRA_continue_centralization: "推動中央集權"
 BRA_continue_centralization_desc: "[ROOT.GetNameDefCap]是一個地域遼闊、文化多元的國家。如果我們不採取更多措施來團結這個國家的各個地區，我們就會面臨分裂的風險，甚至有可能遭到鄰國的軍事入侵。只有通過一個強大的中央政府，我們才能希望保護我們的人民和民主。"
 BRA_court_the_military: "接觸軍方"
 BRA_court_the_military_desc: "如果推行一種令軍方不快或削弱軍方的政策路線，那就太理想化了。我們唯一的希望是為國家的更大利益找到共同點並與他們合作。如果我們失敗了，我們所擁有的權利將再次被消滅。"
 BRA_implement_a_national_guard: "建立國民警衛隊"
 BRA_implement_a_national_guard_tt: "創建師編制§Y國民警衛隊§!，並在§Y[ROOT.Capital.GetCapitalVictoryPointName]§!招募§Y6個單位§!。"
 BRA_implement_a_national_guard_desc: "軍方繼續給國家政治蒙上陰影，如果他們不喜歡民主，就威脅要終止民主。為了對抗他們的影響，我們將建立一支忠於國民議會的新的國民警衛隊。"
 BRA_nationalize_the_banks: "銀行國有化"
 BRA_nationalize_the_banks_desc: "我們的經濟尚未從大蕭條中復甦，我們的許多公民陷入了貧困。現在是時候讓我們將經濟復甦的負擔從大蕭條的受害者轉移到經營銀行的作惡者身上了。"
 BRA_establish_the_brazilian_investment_bank: "商業稅收"
 BRA_establish_the_brazilian_investment_bank_desc: "很多國際公司都可以從比現在繳納更少的稅中受益。通過為這些公司制定優惠的稅收政策，我們可以吸引他們搬到[ROOT.GetNameDef]，使我們的經濟受益。"
 BRA_church: "與教會合作"
 BRA_church_desc: "儘管政教分離制度已經建立了幾十年，但天主教會對我們的政治仍有廣泛的影響。這是因為虔誠的天主教徒佔了選民的大多數。如果我們能得到教會的支持，我們的政策就可能獲得大眾的支持。"
 BRA_implement_article_138: "實施第一百三十八條"
 BRA_implement_article_138_desc: "1934年憲法第一百三十八條規定，政府應該幫助有許多子女的家庭。這條模糊的條款將適用於大多數家庭，這意味著任何援助都將產生巨大的成本。然而，通過為這些家庭實施基本福利制度，我們可以在一代人的時間內使數百萬人擺脫貧困。"
 BRA_tech_slot_2: "[ROOT.Capital.GetCapitalVictoryPointName]聯邦大學"
 BRA_tech_slot_2_desc: "科技正在迅速改變我們活著的方式，從如何工作到如何打仗。我們投資於新技術的研究和開發，對我們國家的持續繁榮和安全至關重要。"
 BRA_ban_the_communist_party: "查禁共產黨"
 BRA_ban_the_communist_party_desc: "儘管1935年的暴動失敗了，但共產主義運動仍在驚嚇著全國的軍隊和企業主。也許我們可以通過鎮壓這場運動，來獲得軍方對我們政策的更大支持。"
 BRA_ban_the_communist_party_dynamic_tt: "§R降低的穩定度與共產黨的支持率成正比！§!"
 BRA_posts_for_generals: "授予將領內閣職位"
 BRA_posts_for_generals_desc: "向有影響力的軍官提供內閣中的職位，可以讓他們參與政府的決策，從而減少他們對政府決策的焦慮。這將減少他們對我們動機的懷疑，並防止發生更多流血事件。"
 BRA_posts_for_generals_tt: "解鎖§Y$BRA_eurico_gaspar_dutra$§!作為政治顧問：\n 可徵募人口：§Y2%§!\n 戰爭支持度：§G+10%§!\n 部隊核心領土防禦：§G+5%§!\n 民主主義外交接納度：§R-25§!"
 BRA_end_military_interference: "終結軍事幹涉"
 BRA_end_military_interference_tt: "中立支持率變化：§G-§![?.Root.party_popularity@neutrality|%0G]。\n"
 BRA_end_military_interference_desc: "隨著國民警衛隊的建立，我們終於有能力削弱軍方的影響，最終將我們的軍隊置於文官政府的監督之下。"
 BRA_free_speech: "開啟政治對話"
 BRA_free_speech_desc: "隨著軍方對國民議會的影響力減弱，再次獨裁的可能性也降低了。現在是時候更好地保護言論自由，鼓勵公民更多地參與政治了。"
 BRA_free_speech_tt: "下列角色會成為可用的政治顧問：\n"
 BRA_the_international_crisis: "國際危機"
 BRA_the_international_crisis_desc: "隨著大國之間的緊張局勢加劇，過去的邊界爭端再次成為外交焦點，世界變得越來越不穩定。我們必須謹慎行事，但也必須為我們的共同安全與該地區其他民主國家接觸。"
 BRA_third_republic: "秩序與進步"
 BRA_third_republic_desc: "隨著國家最終恢復穩定，軍事政變的威脅減弱，我們有機會制定一部更加強健的憲法，能夠強有力的制約與平衡，但允許內閣在必要時採取果斷行動。"
 BRA_united_states_of_brazil: "巴西合眾國"
 BRA_united_states_of_brazil_desc: "儘管我們根據1934年憲法為促進政治和經濟平等做了大量工作，但我們仍然受到諸多憲法條款的限制。現在應該放棄這部暗淡的憲法，以一部類似於我們美利堅合眾國朋友的憲法取而代之，這符合國家的利益。"
 BRA_united_states_of_south_america: "南美合眾國"
 BRA_united_states_of_south_america_desc: "我們的國家已經成為自由的燈塔，吸引著所有與我們有共同價值觀的人，懷揣著新開始的憧憬來到這裡。我們應該接受這種多樣性，並讓我們為南美合眾國，來明確我們對未來的渴望。"
 BRA_united_states_of_south_america_tt: "解鎖§Y$BRA_us_of_south_america_cat$§!決議，邀請陣營中的§Y民主§!或§Y中立§!南美成員國與[ROOT.GetNameDef]§Y合併§!。"
 BRA_bonus_tech_slot: "國家科技基金"
 BRA_bonus_tech_slot_desc: "儘管近年來我們的工業和軍事都有了很大的發展，但要與外國對手保持技術上的平衡卻變得越來越困難。為解決這一問題，我們將設立國家基金，投資新興技術。"
 BRA_address_labor_disputes: "解決勞資糾紛"
 BRA_address_labor_disputes_desc: "上屆政府對共產主義威脅的關注是正確的，但在處理導致人們轉向激進主義的根本問題上做得很少。我們不會再犯同樣的錯誤，並將在處理勞資糾紛中發揮更積極的作用。"
 BRA_address_labor_disputes_tt_1: "§Y事件允許在以下選項之間選擇：§!"
 BRA_address_labor_disputes_tt_2: "§Y或：§!"
 BRA_combat_separatism: "打擊分裂主義"
 BRA_combat_separatism_desc: "每當這個國家面臨政治動盪時，在首都之外心懷不滿的人們就會開始謀求分裂主義計劃，這可能會導致[ROOT.GetNonIdeologyName]分裂。我們必須採取更多措施，在全國範圍內促進共同的[ROOT.GetAdjective]身份認同。"
 BRA_war_bonds: "戰爭債券"
 BRA_war_bonds_desc: "我們不能排除在軍事上被拖入衝突或在經濟上支持其他國家的可能性，因此我們應該開始出售戰爭債券的計劃，為我們的重整軍備提供資金。"
 BRA_invite_foreign_companies: "邀請外國公司"
 BRA_invite_foreign_companies_desc: "是時候向外國資本敞開大門了。我們應當通過激勵外國公司在[BRA.GetNonIdeologyName]開展業務來做到這一點，這反過來將減少失業並增加稅收。"
 BRA_invite_foreign_companies_tt: "解鎖§Y$BRA_invite_foreign_companies_cat$§!決議，允許我們從§Y[ENG.GetFlag][ENG.GetName]§!、§Y[USA.GetFlag][USA.GetName]§!、§Y[FRA.GetFlag][FRA.GetName]§!或§Y[SWE.GetFlag][SWE.GetName]§!邀請§Y軍工機構§!來到[BRA.GetNonIdeologyName]\n§G每邀請一個軍工機構來到[BRA.GetNonIdeologyName]，獲得1個軍用工廠或船塢。§!\n§R我們從每個國家只能邀請一個軍工機構！§!\n\n§G從下列選項中選擇4個：§!"
 BRA_pro_labor_agreement: "支持勞動者的政策"
 BRA_romanticize_the_old_empire: "浪漫化帝國曆史"
 BRA_romanticize_the_old_empire_desc: "不乏心懷不滿的政客、商界領袖或公民，出於這樣或那樣的原因，希望看到這個失敗的共和國終結。也許我們可以圍繞帝國曆史和過去的榮耀聯合起來，將他們所有人團結進一項具有凝聚力的運動。"
 BRA_vassouras_line: "支持佩德羅·恩裡克的宣稱"
 BRA_vassouras_line_desc: "我們試圖發起一場破壞政治現狀的運動，這導致人們呼籲通過迎回帝國皇室來復興我們的帝國曆史。許多人現在團結在被流放的巴西皇室領袖佩德羅·恩裡克周圍，認為他是這個國家的合法統治者。"
 BRA_petropolis_line: "支持佩德羅·德·阿爾坎塔拉的宣稱"
 BRA_petropolis_line_desc: "佩德羅·德·阿爾坎塔拉曾經是流亡的巴西皇室的領袖，為了能和伯爵夫人伊麗莎白·多布任斯克結婚，他徹底放棄了皇位。隨著復辟運動的發展，他現在聲稱他當時的放棄行為是非法的，他才是合法的皇位繼承人。"
 BRA_monarch_choice_1_tt: "§Y佩德羅·德·阿爾坎塔拉§!會成為皇室領袖。\n§R如果[ROOT.GetNonIdeologyName]完成$BRA_constitutional_monarchy$國策，會添加以下民族精神§!："
 BRA_monarch_choice_2_tt: "§Y佩德羅·恩裡克§!會成為皇室領袖。\n§R如果[ROOT.GetNonIdeologyName]完成$BRA_constitutional_monarchy$國策，會添加以下民族精神§!："
 BRA_restore_the_coffee_barons: "咖啡牛奶政治"
 BRA_restore_the_coffee_barons_desc: "曾經掌控[ROOT.GetAdjective]政治數十年的咖啡大亨在1930年的革命中被趕下臺。許多人在經濟上仍有很大的影響力，可以被說服支持我們的帝國復辟運動，以換取政治上的讓步。"
 BRA_constitutional_monarchy: "君主立憲制妥協方案"
 BRA_constitutional_monarchy_desc: "隨著帝制復辟運動的發展和對現政權的支持逐漸減弱，為穩定國家而尋求妥協方案的呼聲越來越高。最突出的建議是建立一個名義上的君主立憲制，同時保留國民議會的政治權力。"
 BRA_constitutional_monarchy_tt: "根據之前在§Y$BRA_petropolis_line$§!與§Y$BRA_vassouras_line$§!之間的選擇，下列之一民族精神將被激活："
 BRA_constitutional_monarchy_tt_2: "§Y或§!"
 BRA_united_kingdom_of_brazil_and_portugal: "巴西及葡萄牙聯合王國"
 BRA_united_kingdom_of_brazil_and_portugal_desc: "巴西皇室的復辟也重新點燃了葡萄牙的君主主義情緒。也許我們應該利用這一機會，再次將我們的國家統一在一位君主之下。畢竟，兩國都將從彼此的資源和專業知識中受益。"
 BRA_united_kingdom_of_brazil_and_portugal_tt: "要求§Y[POR.GetFlag][POR.GetNonIdeologyName]§!和§Y[BRA.GetFlag][BRA.GetNonIdeologyName]§!合一。如果§Y[POR.GetFlag][POR.GetNonIdeologyName]§!同意，他們會成為巴西的附屬國。不過他們可能會提出替代方案或是拒絕提議。"
 BRA_claim_the_french_throne: "聲索法國王位"
 BRA_claim_the_french_throne_desc: "奧爾良-布拉幹薩家族手握對法國王位的宣稱。奧爾良-布拉幹薩家族的佩德羅·加斯唐希望利用這一點來擴大我們的領土。必須利用這一宣稱！"
 BRA_undermine_democracy: "破壞國民議會"
 BRA_undermine_democracy_desc: "我們最有影響力的支持者並不滿足於這種君主立憲制的妥協。他們越來越不耐煩，希望看到君主利用他們新獲得的影響力，通過任命新的內閣來推翻國民議會。"
 BRA_use_the_national_security_law: "利用國家安全法"
 BRA_use_the_national_security_law_desc: "儘管國民議會成員提出了微弱的抵抗，我們的新內閣已經成功地確立了自己作為國家合法政府的地位。現在，他們將利用$BRA_getulio_vargas$政權頒佈的國家安全法來維護對政治事務的絕對權威。"
 BRA_amazonian_settlement: "重啟亞馬遜殖民"
 BRA_amazonian_settlement_desc: "亞馬遜擁有豐富的資源和土地，適合開發利用。為了刺激經濟並激勵我們的士兵戰鬥，我們應該為那些參軍的人提供一個機會，讓他們在適當的服役時間後獲得這樣的土地。"
 BRA_amazonian_settlement_tt: "解鎖§Y亞馬遜軍事定居點§!決議來開發亞馬遜地區。"
 BRA_empire_of_brazil: "重建巴西帝國"
 BRA_empire_of_brazil_desc: "隨著權力牢牢掌握在君主及其任命的大臣手中，是時候讓我們的國家恢復昔日的輝煌了。這樣做的第一步應是恢復巴西帝國，並恢復它賴以建立的傳統價值。"
 BRA_reclaim_territory_in_south_america: "內普拉塔復仇主義"
 BRA_reclaim_territory_in_south_america_desc: "在這場代價高昂的戰爭結束一個世紀之後，內普拉塔戰爭的恥辱仍然籠罩著皇室。重申我們對烏拉圭土地的索取要求將大大有助於重新點燃我們臣民的自豪感，並提醒世界，我們不再是曾經的那個破舊的國家。"
 BRA_demand_portugese_territory: "索取葡萄牙殖民地"
 BRA_demand_portugese_territory_desc: "如今的[POR.GetNonIdeologyName]不過是一個曾經偉大帝國的軀殼。在世界其他地方陷入混亂的時候，我們應該進行炮艦外交，說服[POR.GetAdjective]政府把海外領土交給我們。"
 BRA_demand_portugese_submission: "要求葡萄牙徹底臣服"
 BRA_demand_portugese_submission_desc: "[POR.GetNonIdeologyName]的土地是由非法權力統治的，因為只有我們的皇帝擁有神賦予的權力來統治他們。我們將要求他們交出所有的土地給我們，或者必要時我們將用武力奪取他們。"
 BRA_restoration_of_honor: "復興巴西的榮耀"
 BRA_restoration_of_honor_desc: "雖然我們的許多臣民對君主制的迴歸持懷疑態度，但大多數人現在對結果感到滿意。隨著我們的邊界擴大，我們的經濟得到改善，社會的自然等級制度得到加強，我們終於可以說，[ROOT.GetAdjective]的榮譽已經恢復。"
 BRA_spirit_of_acre_war: "重燃阿克里戰爭"
 BRA_spirit_of_acre_war_desc: "儘管阿克里地區現在處於我們的控制下，但我們可以用那裡歷史上的邊境衝突作為藉口，瓜分玻利維亞更多地區。這可以讓我們獲得大量未開發的自然資源，為我們的工業提供未來幾十年的養料。"
 BRA_expand_colonial_empire: "擴張殖民帝國"
 BRA_expand_colonial_empire_desc: "隨著我們最近的海外擴張，我們現在有了一個立足點，可以將我們的統治擴展到非洲。雖然非洲的大部分地區仍處於歐洲列強的統治之下，但有許多資源豐富的地區可供攫取。"
 BRA_invest_in_the_armed_forces: "賄賂軍方"
 BRA_invest_in_the_armed_forces_desc: "軍方高層的忠誠反覆無常，而且他們偏執於國內外共產主義威脅。我們應該利用這一點來賄賂他們，通過增加軍事預算以換取他們支持我們的統治。"
 BRA_royal_colleges: "成立[ROOT.Capital.GetCapitalVictoryPointName]皇家學院"
 BRA_royal_colleges_desc: "皇帝最近對我們國家的學術水平產生了濃厚的興趣，因此頒佈了一項法令，在首都成立了一所新的皇家學院，以促進國內更多的技術創新。"
 BRA_issue_lordships: "頒發皇室頭銜"
 BRA_issue_lordships_desc: "隨著我們開始重新控制我們的合法領土，控制多樣化地區的負擔正在成為我們親愛的君主的負擔。因此，他宣佈將頒發新的貴族頭銜給那些被認為值得信賴的人，以幫助管理王國。"
 BRA_promote_agriculture: "恢復咖啡大亨"
 BRA_promote_agriculture_desc: "在恢復君主制方面，所謂的“咖啡大亨”幫助我們獲得了足夠的支持，他們發揮了重要作用。現在，我們將通過將他們納入政府來獎勵他們，以監督經濟重建工作。"
 BRA_promote_agriculture_tt: "§Y解鎖顧問：§!"
 BRA_acceptance_tt: "如果他們接受：\n"
 BRA_prepare_for_second_intentona: "第二次巴西共產主義革命"
 BRA_prepare_for_second_intentona_desc: "我們推翻$BRA_getulio_vargas$資產階級政權的第一次嘗試失敗了。如果我們不能迅速回擊，第二次革命的可能性將在他正在通過的新反左派法案中消失。我們必須重燃革命之火。"
 BRA_seek_soviet_support: "尋求[SOV.GetAdjective]支持"
 BRA_seek_soviet_support_desc: "如果我們要成功把我們的國家變成我們的人民應得的共產主義社會，我們將需要來自外部的支持。[SOV.GetNameDefCap]曾經幫助過我們，現在我們應該再次請求他們的支持，以確保我們的成功。"
 BRA_radicalize_the_proletariat: "策動無產階級"
 BRA_radicalize_the_proletariat_desc: "我們上次奪取政權的鬥爭之所以失敗，很大程度上是因為我們沒有得到工人們足夠協調一致的支持。我們必須向他們傳達我們的信息，確保他們對我們絕對忠誠。"
 BRA_launch_the_revolution: "發動革命"
 BRA_launch_the_revolution_desc: "時機已經到來。我們將糾正1935年國際共產主義運動期間我們未能做到的事情。我們必須奮起反抗[BRA.GetLeader]和他的暴虐政權。"
 BRA_launch_the_revolution_tt: "在[BRA.GetNameDef]發起§Y共產主義革命§!。我們獲得的軍隊數量取決於§Y[BRA.GetCommunistParty]§!的支持度。\n§R這會導致對抗民主黨的共產主義內戰！§!"
 BRA_tech_slot_3: "[BRA.GetNonIdeologyName]人民大學"
 BRA_tech_slot_3_desc: "為了建設一個強大的國家，我們需要一個先進的教育系統，讓我們能夠輕鬆接觸到[BRA.GetName]最偉大、最聰明的人。儘早參與可以獲得控制該機構研究領域的影響力。把大學奉獻給人民，只是為了確保這些知識分子在未來幾年裡樂於留下來，幫助我們的事業。"
 BRA_international_brigades: "國際縱隊"
 BRA_international_brigades_desc: "我們周圍的世界正在進行戰爭，我們雖然不積極參與戰爭，但是作為好同志，我們有責任在力所能及的情況下幫助那些需要幫助的人。草率參戰對我們沒有好處，現在我們應該把目標放在派遣志願軍上。"
 BRA_soviet_economic_aid: "蘇聯經濟援助"
 BRA_soviet_economic_aid_desc: "多年來，我們的經濟一直處於與我們想法不同的領導人的管理之下，我們的經濟並沒有達到我們所希望的水平。為了加快恢復到理想狀態的進程，我們應該考慮向與我們有類似心態的其他國家尋求援助。"
 BRA_license_soviet_designs: "與[SOV.GetNameDef]的許可協議"
 BRA_license_soviet_designs_desc: "我們的科研落後於世界上的主要大國。建設趕上那些國家的能力需要很長時間，但在那之前，我們可能會努力獲得在[BRA.GetNameDef]生產[SOV.GetNameDef]裝備的許可。考慮到這筆交易的成本，我們應該爭取一點折扣。"
 BRA_license_soviet_designs_tt: "（[SOV.GetFlag]§Y[SOV.GetName]§!）獲得事件“§Y[BRA.GetNameDefCap]尋求生產許可協議§!”\n\n如果他們§Y對我們有高評價§!，他們更有可能接受！"
 BRA_purchase_soviet_equipment: "購買蘇聯裝備"
 BRA_purchase_soviet_equipment_desc: "我軍目前急需裝備。為了擴大軍隊規模，我們希望有可能從一個值得信賴的盟友那裡以優惠的價格購買裝備。我們通過談判應該能與[SOV.GetNameDef]達成協議。"
 BRA_infilitrate_the_military: "滲透軍隊"
 BRA_infilitrate_the_military_desc: "雖然軍隊高層對我們的意識形態持反對態度，但很多下級軍官都渴望有機會把上級趕下臺。如果我們滲透進他們的隊伍，就能說服他們支持我們。"
 BRA_infilitrate_the_military_tt: "選擇該國策後，更高比例的§Y軍隊§!將在接下來的§R內戰§!中加入共產主義者。"
 BRA_seek_international_support: "尋求國際支持"
 BRA_seek_international_support_desc: "雖然我們為恢復共產主義運動作了很大的努力，但是與我們必須克服的力量相比，我們仍然是弱小的。因此，我們必須獲得世界各地誌同道合的個人和政府的支持。"
 BRA_join_the_comintern: "加入共產國際"
 BRA_join_the_comintern_desc: "長期以來，[BRA.GetNameDef]置身於共產國際之外，卻依賴共產國際的支持。現在是我們尋求加入它的時候了！"
 BRA_create_faction: "拉丁美洲社會主義合作組織"
 BRA_create_faction_desc: "對於共產主義社會應該是什麼樣子，還有很多人和我們有同樣的看法。現在是我們開放與這些國家合作的時候了，這樣我們就可以一起為我們的事業挺身而出！"
 BRA_free_prestes: "從監獄裡釋放新聞工作者"
 BRA_free_prestes_desc: "$BRA_luis_carlos_prestes$多年來一直站在[ROOT.GetAdjective]激進政治的前沿。然而，隨著第一次共產主義革命的失敗，他和該運動的領導人一起被捕。如果我們想把握任何勝利的希望，就必須把我們的領袖從$BRA_getulio_vargas$的魔掌中解放出來。"
 BRA_free_prestes_tt: "成功推翻現政府後，親[SOU.GetAdjective]的§Y共產黨§!顧問將可用。"
 BRA_revive_the_anl: "重振全國解放聯盟"
 BRA_revive_the_anl_desc: "儘管全國解放聯盟未能推翻$BRA_getulio_vargas$的獨裁政權，但仍有數百萬希望真正變革的[BRA.GetAdjective]人支持它。在希望完全破滅之前，我們必須重振這一運動。"
 BRA_revive_the_anl_tt: "在即將到來的共產主義革命中，額外獲得§G2§!支§Y共產主義民兵§!部隊。"
 BRA_revive_the_anl_tt_2: "在成功推翻現政權後，§Y全國解放聯盟§!的顧問將可用。"
 BRA_align_with_moscow: "與[SOU.Capital.GetCapitalVictoryPointName]結盟"
 BRA_align_with_moscow_desc: "我們黨的一些黨員有幸訪問了[SOU.Capital.GetCapitalVictoryPointName]。他們回來後，對[SOU.GetAdjective]的治國方式大加讚揚。我們應該考慮更緊密地與[SOU.GetNameDef]結盟。"
 BRA_oust_prestes: "防止個人崇拜"
 BRA_oust_prestes_desc: "共產主義社會不是由少數人管理的。雖然肯定有一些國家做到了這一點，但我們擔心，這些國家變成個人崇拜只是時間問題。為了防止這種命運降臨到我們身上，我們應該讓全國解放聯盟委員會掌控國家的政治事務。"
 BRA_soviet_arms_industry: "引進蘇聯武器工業"
 BRA_soviet_arms_industry_desc: "我們在[BRA.GetNameDef]擁有強大的軍事工業，但最近我們一直在尋找進一步增強其實力的方法。一些[SOV.GetAdjective]軍工機構表示有興趣在[BRA.GetNameDef]開展業務，我們應該考慮邀請它們。"
 BRA_spread_the_revolution: "擴大革命"
 BRA_spread_the_revolution_desc: "我們給巴西帶來的革命得到了[BRA.GetNameDef]人民的高度讚賞。現在我們已經穩定了我們的內部事務，是時候從更大的角度考慮問題，把目光投向我們自己的邊界之外了。"
 BRA_smash_fascism: "粉碎南美法西斯主義"
 BRA_smash_fascism_desc: "在南美大陸上，革命尚未傳播到部分國家。其中一些國家的無產階級仍然受到法西斯統治者的嚴重壓迫我們不能聽之任之，我們必須解放我們的工人同志！"
 BRA_anti_imperialism: "驅逐帝國主義"
 BRA_anti_imperialism_desc: "我們附近的一些國家還沒有獲得應有的獨立。仍然有一些帝國聲稱控制著這些領土。殖民主義和帝國主義屬於過去的時代，我們早就應該向這些帝國表明這一點了。"
 BRA_anti_imperialism_tt: "解鎖§Y南美反殖民主義§!決議，解放南美的殖民地。"
 BRA_jaguar_diplomacy: "美洲豹外交"
 BRA_jaguar_diplomacy_desc: "[CHI.GetName]最近用一種本土動物作為外交禮物。儘管存在意識形態上的差異，但這似乎是緩和與外國政府緊張關係的一個成功方法。也許我們可以用同樣的技巧來勸阻大國不要干涉我們自己的事務。"
 BRA_jaguar_diplomacy_tt: "解鎖§Y$BRA_jaguar_diplomacy_cat$§!決議，與反對南美共產主義的列強簽署互不侵犯條約以安撫他們。"
 BRA_sway_the_neighbors: "影響鄰國"
 BRA_sway_the_neighbors_desc: "我們要用一切必要的手段，提高鄰國的階級覺悟，幫助他們擺脫資產階級壓迫的枷鎖。"
 BRA_sway_the_neighbors_tt: "解鎖§Y$BRA_sway_the_neighbors_cat$§!決議，在南美國家推廣共產主義。"
 BRA_julieta_soria: "胡列塔·索里亞"
 BRA_union_of_latin_american_socialist_republics: "建立拉丁美洲社會主義共和國聯盟"
 BRA_union_of_latin_american_socialist_republics_desc: "我們的革命運動持續削弱整個大陸的資產階級社會結構。很明顯，我們不再僅僅是[ROOT.GetAdjective]人的運動，我們更是南美人的運動，我們的政治結構是時候更好地代表這種變化了。"
 BRA_smash_democracy: "終結南美資本主義"
 BRA_smash_democracy_desc: "資產階級民主和資本主義繼續侵蝕著許多南美人的權利和生活條件。我們必須盡我們所能把整個大陸的同志從壓迫者手中解放出來。"
 BRA_kgbrazil: "[BRA_kgbrazil_key]"
 BRA_create_kgbrazil_with_agents: "成立巴西安全委員會"
 BRA_kgbrazil_just_add_operatives: "[SOU.GetAdjective]情報合作"
 BRA_kgbrazil_no_lar: "加強情報戰線建設"
 BRA_kgbrazil_cangaco: "科伊特羅斯網絡"
 BRA_kgbrazil_desc: "[BRA_kgbrazil_desc_key]"
 BRA_create_kgbrazil_with_agents_desc: "有關敵人的情報和信息是我們在需要時保衛國家和利益的能力的關鍵組成部分。建立一個強大的機構可能需要時間，但意識形態一致的外國情報部門會幫助我們。"
 BRA_kgbrazil_just_add_operatives_desc: "有關敵人的情報和信息是我們在需要時保衛國家和利益的能力的關鍵組成部分。我們的機構最近已經投入了大量的工作，但如果能招募一些有經驗的蘇聯特工協助我們的事業就更好了"
 BRA_kgbrazil_no_lar_desc: "關於敵人的情報和信息是我們在需要時保衛國家和利益的能力的關鍵組成部分。我們應該優先考慮我們的技術需求，既要收集敵人的情報，又要防止他們獲得我們的敏感信息。"
 BRA_robert_ivanov: "羅伯特·伊萬諾夫"
 BRA_nadiya_morozova: "納迪亞·莫羅佐娃"
 BRA_collectivization_of_transport: "運輸系統集體化"
 BRA_collectivization_of_transport_desc: "我們的運輸系統曾有過較好的日子，現在迫切需要改革，以便更有效地利用它滿足我們的需要。運輸系統的集體化將賦予工人們權力，以他們認為最合適的方式進行這些亟需的改革。"
 BRA_nationalization_of_industry: "工業國有化"
 BRA_nationalization_of_industry_desc: "我們的民用工業還沒有國有化。在那些追求利潤而忽視滿足人民和國家需求的私人所有者手中，效率受到了極大的影響。為了[BRA.GetNameDef]全體人民的利益，我們需要國有化並擴大我們的工業。"
 BRA_rapid_industrialization: "快速工業化"
 BRA_rapid_industrialization_desc: "我們對民用工業的投資似乎對我們的工人和國家都非常有益。也許我們應該考慮對國內軍事工業進行類似的投資。"
 BRA_collectivization_of_agriculture: "農業集體化"
 BRA_collectivization_of_agriculture_desc: "我們的農業相當分散，效率沒有達到應有的水平。通過將工業集體化並將其交給工人作為一個集體來處理所需的改革，我們可以解決它以及更多的問題。"
 BRA_allow_the_church_to_operate: "接納社會主義神學家"
 BRA_allow_the_church_to_operate_desc: "一場新的神職人員運動開始在南美洲紮根。神職人員正在倡導社會主義政策，這將使我們最需要幫助的人一勞永逸地擺脫貧困。也許我們應該接納這些激進的神學家，而不是激怒那些支持他們的忠實的無產階級。"
 BRA_state_atheism: "無神論國家"
 BRA_state_atheism_desc: "為了確保我們的人民心中不被不良思想所充斥，我們必須保證這種宣傳在任何地方都不能傳播。[BRA.GetAdjective]神學家的老套教義和他們所宣揚的思想，與我們對人民的期望水火不容。我們不能再這樣放任下去了！"
 BRA_support_industrialists: "支持實業家"
 BRA_support_industrialists_desc: "雖然在我們的人口中，工人多於資本家，但後者控制著更多的財富和資源。我們應該制定限制工人權利的政策，允許實業家更有效地運營，以改善整個經濟。"
 BRA_reward_army_loyalty: "獎勵陸軍忠誠"
 BRA_reward_army_loyalty_desc: "軍隊不僅在我們奪取政權的過程中，而且在保持對政權的控制方面都是不可或缺的。是時候通過增加軍隊基礎設施項目的資源分配來回報盟友的忠誠了。"
 BRA_reinvigorate_the_navy: "振興海軍"
 BRA_reinvigorate_the_navy_desc: "海軍軍官長期以來一直支持整合主義運動，即使這樣做在公眾中不受歡迎。為了他們的長期支持，我們將增加資金，使他們能夠開始更新換代老舊艦隊的進程。"
 BRA_establish_caloi: "成立卡洛伊工廠"
 BRA_establish_caloi_desc: "世界各地不斷升級的緊張局勢使得從歐洲和北美進口自行車和零部件變得困難。鑑於我們有豐富的橡膠和鋼鐵資源，也許我們應該建立自己的自行車工廠，並將其應用於軍事。"
 BRA_us_brazil_technology_exchange: "[USA.GetAdjective]-[ROOT.GetAdjective]技術交流"
 BRA_us_brazil_technology_exchange_desc: "近年來，我國的專業技術知識得到了廣泛的提高，但我們還有很多東西要向[USA.GetNameDef]的朋友學習。也許我們可以勸說他們與我們互相分享知識。"
 BRA_us_brazil_technology_exchange_tt: "如果[USA.GetFlag]§Y[USA.GetNameDef]§!接受提議："
 BRA_depose_vargas: "廢黜[ROOT.GetLeader]"
 BRA_depose_vargas_desc: "[ROOT.GetLeader]成了累贅。雖然他是一個老練的政治家，但人們對一個人的容忍是有限的。如果我們要避免再次陷入貧困，我們就需要將他趕下臺，並從軍隊中選出一位更受歡迎的領導人來取代他。"
 BRA_equality_for_women: "無產階級的平等"
 BRA_equality_for_women_desc: "舊的資產階級秩序的一切偽裝都必須被打破。為此，巴西的婦女和少數民族長期以來一直被國家忽視，現在是我們解決他們的歷史冤屈的時候了。我們還必須鼓勵他們為我們無產階級共和國的發展而發揮他們的才能。"
 BRA_equality_for_women_tt: "§Y$BRA_olga_benario_prestes$§!解鎖為部隊指揮官"
 BRA_italian_cooperation: "[ITA.GetAdjective]-[ROOT.GetAdjective]瓜分非洲"
 BRA_italian_cooperation_desc: "隨著老牌帝國的紛紛崩潰，對非洲的新一輪爭奪正在興起。通過我們與[ITA.GetNameDef]的特殊關係，我們有機會為自己在非洲開闢一片領土。"
 BRA_german_cooperation: "南大西洋霸主"
 BRA_german_cooperation_desc: "長期以來，大西洋一直被美國和英國海軍所統治。通過我們與[GER.GetNameDef]的合作，我們已經準備好驅逐他們，為我們自己控制大西洋。"
 BRA_german_cooperation_tt: "獲得§Y南大西洋§!中不為[ROOT.GetNonIdeologyName]或[GER.GetNonIdeologyName]所擁有的島嶼的§Y宣稱§!"
 BRA_german_cooperation_tt_2: "獲得§Y10§!艘[GER.GetAdjective]§YIIA型早期潛艇。§!"
 BRA_attack_bolivia: "奪取亞馬遜"
 BRA_attack_bolivia_desc: "亞馬遜雨林本質上屬於[BRA.GetAdjective]。不能再容忍[BOL.GetNameDef]繼續實際佔領其中的部分土地。"
 BRA_attack_chile: "先發制人的打擊"
 BRA_attack_chile_desc: "只要[CHL.GetAdjective]的殘餘勢力還躲在山後，我們的西部邊境就永遠不會徹底安寧。因此，我們必須清算[CHL.GetAdjective]政府，並且把它併入我們自己的領土。"
 BRA_panama_push: "巴拿馬攻勢"
 BRA_panama_push_desc: "如果我們要為我們自己保護這片大陸，我們必須迅速行動，在敵人作出反應之前碾壓他們。"
 BRA_unify_south_america: "一統南美"
 BRA_unify_south_america_desc: "憑藉我們人民的力量和勇氣，南美洲已經落入了我們的掌控之中。現在，我們必須開始困難的任務，將整片大陸統一起來，團結在我們的統治和文化下。"
 BRA_unify_south_america_tt: "解鎖獲取所擁§Y南美§!領土§Y核心§!的決議"
 BRA_sway_the_cangaco: "使坎加索支持我方事業"
 BRA_sway_the_cangaco_desc: "坎加索多年來一直與各種政權作鬥爭，儘管他們不是馬克思主義者，但他們在重新分配地方財富方面得到了廣大農民的強烈支持。也許我們可以將他們和他們的經驗引入進我們的革命運動中？"
 BRA_sway_the_cangaco_tt: "§R移除§!§Y$BRA_cangaceiro_decision_cat$§!§R決議，我們不再會在受影響的地區打壓坎加索！§!\n\n內戰觸發或者政府為§Y共產主義§!時，獲得§G3§!支坎加索民兵單位"
 BRA_cangaco_coup: "坎加索政變"
 BRA_cangaco_coup_desc: "儘管革命承諾了很多，但運動的領導層優柔寡斷，陷入了關於堅持哪些正確理念的教條主義辯論中。隨著人民的支持空前增強，現在是時候讓坎加索接管國家，並一勞永逸地剷除其核心的腐敗了。"
 BRA_south_american_defense_cooperation: "南美聯合軍事演習"
 BRA_south_american_defense_cooperation_desc: "我們的大陸在人口和地理上都是多樣化的。通過與鄰國舉行聯合軍事演習，我們的人民不僅可以瞭解他們的戰鬥方式，還可以瞭解他們的生活方式。"
 BRA_south_american_defense_cooperation_tt: "每一個§Y陣營成員§!的所有§Y陸軍將領§!將有§G50%§!概率獲得一個隨機§Y地形特質§!。"
 BRA_foreign_legion: "外籍兵團"
 BRA_foreign_legion_desc: "在這動盪時期，[ROOT.GetName]已成為外國人的避難所。在他們中間不乏願意為我們共同的價值觀獻出生命的人。我們應該給予他們這樣的機會，把他們招募進外籍兵團。"
 BRA_foreign_legion_tt: "創建編制§Y外籍兵團§!並且在[ROOT.Capital.GetCapitalVictoryPointName]部署§G3§!單位。\n\n解鎖§Y$BRA_foreign_legion_cat$§!決議來招募更多§Y外籍兵團§!編制的部隊。"
 BRA_legion_name: "外籍兵團"
 BRA_south_american_research_cooperation: "拉丁美洲研究委員會"
 BRA_south_american_research_cooperation_desc: "眾所周知，相比於我們的競爭對手，我們拉丁美洲的工業和大學並沒有獲得同樣水平的資金支持。然而，通過聯合研究機構進行合作，我們可以避免重複工作，並加快整個地區的創新步伐。"
 BRA_south_american_tech_sharing_group_tt: "如果陣營中的南美洲成員國同意加入："
 ### ARGENTINA ###
 ARG_preparation_for_the_elections: "選舉的準備工作"
 ARG_preparation_for_the_elections_desc: "阿古斯丁·佩德羅·胡斯托的任期即將結束，[ARG.GetName]即將迎來一位新總統。雖然正式的政府候選人是羅伯托·瑪麗亞·奧爾蒂斯，但由馬塞洛·托爾誇托·德阿爾韋亞爾領導的反對黨仍然有機會為更民主的[ARG.GetName]而戰。這次選舉的先例已經設定，現在剩下的就是看看它會如何發展。"
 ARG_roberto_maria_ortiz: "羅伯托·瑪麗亞·奧爾蒂斯"
 ARG_roberto_maria_ortiz_desc: "羅伯托·瑪麗亞·奧爾蒂斯以明顯多數贏得了選舉，這意味著協和同盟將繼續統治[ARG.GetName]。在他的獲獎感言中，他強調了他對民主的信念，並承諾尊重自由和憲法為[ARG.GetAdjective]人民建立的保障。"
 ARG_roberto_maria_ortiz_tt: "§Y$ARG_roberto_maria_ortiz$§!成為§Y$ARG_neutrality_party_long$§!的領袖"
 ARG_coup_imminent_tt: "§R選取該國策會開啟軍方紛爭的限時任務。§!"
 ARG_defense_and_democracy: "協和宣言"
 ARG_defense_and_democracy_desc: "國防與民主是奧爾蒂斯政府的首要目標，總統希望在協和同盟的治理下重建一個更加民主的[ARG.GetName]。這也將意味著增加軍事開支，以確保[ARG.GetName]能夠正常自衛。"
 ARG_crack_down_on_corruption: "打擊貪汙"
 ARG_crack_down_on_corruption_desc: "儘管這次選舉是[ARG.GetAdjective]歷史上最具欺詐性的選舉之一，但奧爾蒂斯仍決心打擊政府內部的腐敗程度。撇開諷刺不談，這隻會讓[ARG.GetName]更強大。"
 ARG_british_cooperation: "英國經濟"
 ARG_british_cooperation_desc: "與[ENG.GetName]更密切的合作將有助於促進我們的經濟，特別是考慮到他們在上次選舉中所發揮的巨大影響力。改善我們與[ENG.GetAdjective]的關係將意味著在未來達成更好的貿易協議。"
 ARG_the_castillo_cabinet: "卡斯蒂略內閣"
 ARG_the_castillo_cabinet_desc: "不幸的是，由於病情加重，奧爾蒂斯總統準備遞交辭呈。接替他的是前副總統拉蒙·卡斯蒂略。隨著軍方派系之間的緊張局勢升級，卡斯蒂略必須謹慎行事，以保住自己的總統職位。"
 ARG_the_castillo_cabinet_tt: "§Y$ARG_ramon_castillo$§!成為§Y$ARG_neutrality_party_long$§!的領袖"
 ARG_import_substitution: "替代進口"
 ARG_import_substitution_desc: "隨著全球緊張局勢的加劇，從歐洲的進口大幅減少。雖然我們與[ENG.GetAdjective]有密切的貿易關係，但[ARG.GetAdjective]經濟將不得不開始以工業化程度的提高來取代進口。"
 ARG_emphasis_on_public_works: "重視公共工程"
 ARG_emphasis_on_public_works_desc: "為了從大蕭條的廢墟中重建我們的國家，我們需要在公共工程項目上投入更多的時間。如果我們把更多的錢投入到當地的基礎設施中，那麼它不僅會幫助我們的經濟，還會改善[ARG.GetAdjective]公民的生活。"
 ARG_towards_a_greater_argentina: "邁向更偉大的[ARG.GetName]"
 ARG_towards_a_greater_argentina_desc: "通過我們的共同努力，提高我們的工業產能，以及我們對公共工程和基礎設施的著重投資，我們已經為[ARG.GetName]真正從大蕭條的灰燼中崛起，成為南美大陸上一個嶄露頭角的大國奠定了基礎！"
 ARG_universidad_de_buenos_aires: "布宜諾斯艾利斯大學"
 ARG_universidad_de_buenos_aires_desc: "自1918年大學改革以來，布宜諾斯艾利斯大學一直能夠維持共同治理，民主選舉的機構和當局。作為[ARG.GetName]最大的大學，對其發展的投資將繼續培養出適合領導國家走向未來的高學歷人才。"
 ARG_consolidating_power: "鞏固權力"
 ARG_consolidating_power_desc: "拉蒙·卡斯蒂略以比前幾任總統更專制的政策來維護他的總統任期。他的目的是通過國家民主黨鞏固他的權力，並慢慢瓦解協和同盟。政治和軍事對手也注意到了這一點。"
 ARG_maintain_the_status_quo: "維持現狀"
 ARG_maintain_the_status_quo_desc: "穩定高於一切。剛上臺就沒有直接的必要再小題大做了。如果卡斯蒂略想留在政府中，他需要更加小心地處理敵對派系中日益增長的異議。"
 ARG_march_to_la_casa_rosada: "向玫瑰宮進軍"
 ARG_march_to_la_casa_rosada_desc: "卡斯蒂略政府最終還是到了那步。軍方內部的不滿情緒在總統下令戰爭部長佩德羅·巴勃羅·拉米雷斯辭職後達到了臨界點，原因是他與反對黨激進公民聯盟進行了會談。軍方領導人召集其效忠者，準備向玫瑰宮進軍。"
 ARG_march_to_la_casa_rosada_tt: "§Y$ARG_pedro_pablo_ramirez$§!成為§Y$ARG_militarist_party_long$§!的領袖"
 ARG_military_coup_happens_tt: "將通過允許軍方接管來結束“迫在眉睫的軍事政變任務”。"
 ARG_intervenciones_federales: "聯邦干預"
 ARG_intervenciones_federales_desc: "隨著軍事政變對我們政府的威脅越來越大，我們必須決定頒佈聯邦干預法案。通過花時間在每個地區通過這項立法，[ARG.GetName]能以更充分地準備抵抗叛亂。"
 ARG_balancing_act: "平衡法案"
 ARG_balancing_act_desc: "如今軍方控制了政府，我們可以把目光轉向歐洲的風暴。由於同盟國和軸心國都與[ARG.GetName]有往來，我們必須小心行事，不要疏遠任何一方。"
 ARG_subdue_dissension: "懾服紛爭"
 ARG_subdue_dissension_desc: "真是夠了。軍事叛亂分子已經失去控制，我們需要在政變再起之前堅決鎮壓這場政變。這可能會在短期內削弱我們的軍事發展，但有一支忠誠的軍隊支持我們是值得的。"
 ARG_subdue_dissension_tt: "你必須至少實施三次聯邦干預才能解鎖該國策！"
 ARG_the_american_push: "美國的催促"
 ARG_the_american_push_desc: "[USA.GetName]並沒有忽視我們致力於在同盟國與軸心國之間保持平衡關係。他們已經明確表示，他們不滿意我們溫和的觀點，可能會要求我們與軸心國永久斷交。"
 ARG_juan_peron_elected: "胡安·庇隆"
 ARG_juan_peron_elected_desc: "經過一段時間的政治劇變後，[ARG.GetNameDef]也是時候迎來一位受歡迎、受愛戴的領導人了。胡安·庇隆誓要喚起阿根廷民眾自豪感和安全感的承諾讓他成為了我們偉大國家新任總統的明確選擇。有了深愛的妻子伊娃相伴，庇隆終於迎來了鞏固[ARG.GetNameDef]抵擋風暴的時機。"
 ARG_peronism: "庇隆主義"
 ARG_peronism_desc: "庇隆上臺後推動建立了一個基於其本人思想和影響的新政治運動。庇隆主義，又稱正義主義，在庇隆的反對者中引起了爭議。一些人將其比作法西斯主義，而另一些人則將其描述為民族主義、勞工主義和民粹主義的模糊混合體。"
 ARG_help_the_allies: "幫助同盟國"
 ARG_help_the_allies_desc: "隨著戰爭進一步升級，來自[USA.GetName]的壓力越來越大，要求我們放棄中立，正式加入同盟國。如果我們選擇這樣做，那麼我們將正式成為這場全球衝突的參與者。"
 ARG_maintain_neutrality: "拒絕同盟國"
 ARG_maintain_neutrality_desc: "儘管有來自同盟國的壓力，但是捲入他們的戰爭並不符合我們的利益。我們有足夠的精力來處理我們自己大陸的事務，而不必擔心歐洲的衝突。如果這會冒著被[USA.GetName]禁運的風險，那就這樣吧。"
 ARG_accept_german_advisors: "接受德國顧問"
 ARG_accept_german_advisors_desc: "我們一直與[GER.GetName]保持著密切的聯繫，我們可以大量邀請他們的聰明人來[ARG.GetName]，幫助我們進一步發展我們的目標計劃，我們將從中受益。"
 ARG_our_own_path: "我們自己的道路"
 ARG_our_own_path_desc: "在過去的幾年裡，我們得以獨善其身，置身於蹂躪其他國家的重大全球衝突之外。[ARG.GetName]站在自己的立場上，我們將自己決定我們的道路將把我們帶到哪裡。我們是繼續繁榮和經濟增長，還是尋求實現自己的擴張目標，還有待觀察。"
 ARG_change_of_course: "改變航向"
 ARG_align_with_the_monroe_doctrine: "與門羅主義一致"
 ARG_align_with_the_monroe_doctrine_desc: "多年來，門羅主義一直是防止歐洲干涉西半球的政策。雖然我們現在與歐洲列強結盟，但我們必須完全遵守這一原則，防止他們入侵美洲。"
 ARG_envoy_to_london: "駐倫敦特使"
 ARG_envoy_to_london_desc: "[ENG.GetName]多年來一直是我們最親密的盟友之一，現在我們和他們站在一起對抗他們的敵人，為了與[ENG.GetAdjective]政府建立更緊密的聯繫，我們派一個[ARG.GetAdjective]人去倫敦是明智的。"
 ARG_study_the_battle_of_the_river_plate: "研究拉普拉塔河口海戰"
 ARG_study_the_battle_of_the_river_plate_desc: "拉普拉塔河口海戰是這場戰爭的第一場海戰，它發生在南美洲領土上。我們應該努力研究這場戰役，從中學習如何提高我們自己的海軍能力。"
 ARG_islas_del_atlantico_sur: "南大西洋群島"
 ARG_islas_del_atlantico_sur_desc: "福克蘭群島和南喬治亞島是[ENG.GetName]的主權領土，多年來一直是。儘管我們聲稱對這些離[ARG.GetName]很近的島嶼擁有主權，但它們仍然處於[ENG.GetAdjective]的統治之下。隨著我們與[ENG.GetName]的新聯盟，也許我們可以通過談判將這些島嶼移交給我們控制。畢竟，我們將能夠在這場戰爭中更好地保護他們。"
 ARG_improving_the_islands: "改善島嶼"
 ARG_improving_the_islands_desc: "既然我們擁有福克蘭和南喬治亞群島的所有權，我們就應該集中精力改善它們的軍事基礎設施，以確保它們繼續處於我們的控制之下。"
 ARG_firmes_volamos: "我們堅定地飛翔"
 ARG_firmes_volamos_desc: "居住在[ARG.GetName]的[ENG.GetAdjective]人向皇家空軍捐贈了一箇中隊。通過將這個中隊派往[ENG.GetName]，我們也許能夠與英國皇家空軍更密切地合作，提高我們自己的空戰能力。"
 ARG_extinguish_south_american_fascism: "消滅南美法西斯主義"
 ARG_extinguish_south_american_fascism_desc: "法西斯主義在世界上留下的汙點已經蔓延到南美洲。我們不能袖手旁觀，任由事態發展。我們必須挺身而出，去處理那些那些在民主蔓延到整片大陸之前放棄民主而贊成專制獨裁的國家。"
 ARG_no_fascism_in_south_america_tt: "獲得針對§Y南美§!所有§Y法西斯§!國家的§Y$puppet_wargoal_focus$§!戰爭目標"
 ARG_american_allyship: "與美國的盟友關係"
 ARG_american_allyship_desc: "我們最強大的盟友之一是北方已經覺醒的巨人。本著泛美團結的精神，我們應該派遣一名[ARG.GetAdjective]特使到華盛頓特區，以便與[USA.GetAdjective]政府發展更密切的關係。"
 ARG_us_marine_program: "美國海軍陸戰隊訓練計劃"
 ARG_us_marine_program_desc: "[USA.GetAdjective]海軍陸戰隊是精銳部隊，是美國軍事實力的象徵。我們可以從他們身上學到很多東西，現在我們正在與[USA.GetName]更密切地合作，我們有機會這樣做。"
 ARG_us_marine_program_doctrine: "美國海軍陸戰隊訓練"
 ARG_encourage_the_red_scare: "紅色恐慌"
 ARG_encourage_the_red_scare_desc: "看來法西斯主義並不是我們唯一應該擔心的事情。[SOV.GetName]日益增長的實力也同樣緊迫。共產主義是民主的另一個對立面，我們應該警惕它的傳播。"
 ARG_counter_intelligence_program: "反間諜計劃"
 ARG_counter_intelligence_program_desc: "看來間諜活動在這場戰爭中扮演著重要的角色，而我們在自己的情報行動上嚴重落後。有傳言說[GER.GetAdjective]在[ARG.GetName]和其他南美國家有情報行動，我們應該儘快做好對抗的準備。"
 ARG_end_operation_bolivar: "終止玻利瓦爾計劃"
 ARG_end_operation_bolivar_desc: "我們發現[GER.GetName]源源不斷地向我國輸送間諜任務。他們幽默地稱之為玻利瓦爾計劃。這是不可接受的，我們必須立即終止[GER.GetAdjectives]在[ARG.GetName]的一切行動。"
 ARG_extinguish_south_american_communism: "消滅南美共產主義"
 ARG_extinguish_south_american_communism_desc: "紅色威脅不僅僅是一個用來嚇唬孩子的妖怪。共產主義已經蔓延到南美，並迅速侵蝕[ARG.GetName]。為了民主和自由，我們必須動員起來，在紅色復興蔓延到整片大陸之前將其鎮壓下去。"
 ARG_no_communism_in_south_america_tt: "獲得針對§Y南美§!所有§Y共產主義§!國家的§Y$puppet_wargoal_focus$§!戰爭目標"
 ARG_banco_central_de_la_republica_argentina: "阿根廷中央銀行"
 ARG_banco_central_de_la_republica_argentina_desc: "阿根廷中央銀行於1935年由國會通過六項法案成立，取代了[ARG.GetName]的貨幣發行局。該行行長埃內斯托·博世的目標是發展該行，幫助啟動我們的經濟，幫助我們最終開始從大蕭條中復甦。"
 ARG_reach_out_to_the_great_powers: "與列強接觸"
 ARG_reach_out_to_the_great_powers_desc: "為了幫助我們的經濟形勢增長，我們擁有的選擇之一是向世界大國尋求援助，向它們貸款以加速我們的復甦。不過，我們應該小心，因為我們不想揹負比開始時更多的債務。"
 ARG_industrial_expansion: "工業擴張"
 ARG_industrial_expansion_desc: "強大的工業是任何經濟的支柱。我們應該集中精力研究為我們的工業發展提供更多的選擇。"
 ARG_industrial_expansion_bonus: "產業技術提升"
 ARG_production_initiative: "生產計劃"
 ARG_production_initiative_desc: "我們的生產工具過時了，需要更新換代。我們應該投入資金髮展我們的生產技術，以幫助加快生產我們軍隊所需的部件。"
 ARG_tech_initiative_bonus: "技術創新"
 ARG_economic_tax_reforms: "經濟稅制改革"
 ARG_economic_tax_reforms_desc: "我們農村的基礎設施很不發達。如果我們對現行的稅收政策進行一些改革，我們就能把重點放在建設欠發達的農業土地上。"
 ARG_economic_reactivation_act: "經濟振興法案"
 ARG_economic_reactivation_act_desc: "經濟振興法案將優先發展民用基礎設施，加快我們在城市建造新工廠的速度。"
 ARG_immigration_wave: "移民潮"
 ARG_immigration_wave_desc: "[ARG.GetName]是一個建立在移民基礎上的國家。雖然我們的大多數人口都來自西班牙，但我們境內也有相當多的德國人，甚至威爾士人。我們可以通過促進這些國家的人們移民到[ARG.GetName]來提振我們的經濟。"
 ARG_develop_civilian_economy: "發展民用經濟"
 ARG_develop_civilian_economy_desc: "當我們更加關注我們的城市時，重要的是我們要提供[ARG.GetName]人民需要的便利設施。如果我們能讓我們的人民幸福，那麼這隻會讓我們更強大。投資建設更多的工廠是前進的方向。"
 ARG_the_argentinian_metropole: "阿根廷的大都市"
 ARG_the_argentinian_metropole_desc: "布宜諾斯艾利斯將成為[ARG.GetName]真正大都市生活的象徵。城市的發展幫助我們鼓勵人們過上幸福、富有成效的生活。在這樣做的過程中，我們現在有了人口的激增和全國範圍內更高的受教育率。"
 ARG_invest_in_the_roads: "投資道路"
 ARG_invest_in_the_roads_desc: "[ARG.GetName]的基礎設施亟需翻新。如果我們努力為我們的道路投資，它將有助於在每個省實現本地的互聯互通。"
 ARG_invest_in_the_railways: "投資鐵路"
 ARG_invest_in_the_railways_desc: "從[ENG.GetName]的鐵路發展歷史來看，我們繼續推進鐵路現代化進程是有道理的。這將有助於通過鐵路網連接整個國家，使[ARG.GetName]成為一個更加統一的國家。"
 ARG_expand_steel_extraction: "擴大鋼鐵開採"
 ARG_expand_steel_extraction_desc: "自從[ARG.GetName]被認為是白銀之國以來，採礦業一直是阿根廷的主要產業。然而，我們的注意力更集中在擴大我國山區的鋼鐵開採上。"
 ARG_expand_aluminum_extraction: "擴大鋁礦開採"
 ARG_expand_aluminum_extraction_desc: "鋁是我國汽車發展的重要資源。我們應該發展採礦業務，提高這種有用金屬的提取率。"
 ARG_yacimientos_petroliferos_fiscales: "阿根廷財政油田公司"
 ARG_yacimientos_petroliferos_fiscales_desc: "阿根廷財政油田公司是一家[ARG.GetAdjective]國有能源公司，從事石油勘探、生產、精煉和商業化。為了更好地控制我們的石油生產，我們應該向公司投入更多的資金。"
 ARG_yacimientos_petroliferos_fiscales_tt: "解鎖決議：§Y開採瓦卡穆爾塔§!"
 ARG_rapid_urbanization: "快速城市化"
 ARG_rapid_urbanization_desc: "[ARG.GetName]的很多地方仍然是農村土地，但20世紀的前進方向是城市化。通過發展我們的城市，我們可以說服更多的人搬到那裡，這意味著我們將為高度工業化的中心獲得大量的勞動力。"
 ARG_agricultural_improvements: "農業進步"
 ARG_agricultural_improvements_desc: "多年來，農業一直是[ARG.GetName]發展不可或缺的一部分，許多人依靠這種生活方式謀生。這是一個很好的機會來改善我們農村社區的一些農業基礎設施。"
 ARG_military_production_lines: "軍用生產線"
 ARG_military_production_lines_desc: "隨著全球危機的加劇，投資於我們未來的軍事生產將是一個明智的主意。如果我們建造更多專門生產軍事裝備的工廠，那麼我們將以最好的方式為即將到來的風暴做好準備。"
 ARG_capitalize_the_beef_industry: "牛肉產業資本化"
 ARG_capitalize_the_beef_industry_desc: "[ARG.GetAdjective]牛肉是我們的主要出口產品之一，尤其是對[ENG.GetNameDef]的出口。我們應該利用這一點，擴大我們的牧場能力，確保我們的美味肉類享譽全球！"
 ARG_revisit_the_roca_runciman_treaty: "重溫羅卡-朗西曼條約"
 ARG_revisit_the_roca_runciman_treaty_desc: "羅卡-朗西曼條約自1933年起生效，確保了我們對[ENG.GetName]的牛肉出口。然而，隨著我國經濟最近的發展，我們可能是時候與[ENG.GetAdjective]談判一項新條約，為我們自己達成一項更好的貿易協議了。"
 ARG_a_new_trading_partner: "修訂羅卡-朗西曼條約"
 ARG_a_new_trading_partner_desc: "羅卡-朗西曼條約自1933年起生效，確保了我們對[ENG.GetName]的牛肉出口。然而，隨著世界各地最近的事態發展，撕毀這個條約並與我們的新盟友達成一個更有利的新條約才是明智的。"
 ARG_develop_the_electricity_sector: "發展電力行業"
 ARG_develop_the_electricity_sector_desc: "我們的電力行業需要升級，因此，我們應該集中資源研究進一步的技術，以幫助我們的電力發展。"
 ARG_invest_in_construction_guilds: "投資建築行業"
 ARG_invest_in_construction_guilds_desc: "建築業行會是城市發展的中堅力量。我們的下一個任務應該是向[ARG.GetName]的行業協會提供資金，以確保我們的建築技術能夠跟上世界其他地區的步伐。"
 ARG_technical_schools: "技術學校"
 ARG_technical_schools_desc: "通過發展技術學校，我們可以積極增加政府各部門技術顧問的數量。推進這種類型的教育只會幫助提升我們的經濟實力。"
 ARG_work_with_the_nationalists: "與民族主義者合作"
 ARG_work_with_the_nationalists_desc: "也許現在是我們採取一種不同的治理方式的時候了。畢竟，多年來一直困擾選舉的日益嚴重的腐敗顯然沒有放緩的跡象。如果我們與國內的民族主義實體合作，那麼我們可能有更好的機會恢復[ARG.GetNameDef]的秩序。"
 ARG_end_the_coup_tt: "§G選取該國策將結束軍事政變任務。§!"
 ARG_cut_ties_with_britain: "與英國斷交"
 ARG_cut_ties_with_britain_desc: "雖然[ENG.GetNameDef]這個島國確實是我們最親密的貿易伙伴，但他們的牛肉條約只會阻礙我們為自己的國家提供牛肉的能力。我們應該在民眾中激起反英情緒，並向世界證明，我們可以在沒有歐洲殖民勢力的情況下自立。"
 ARG_support_radical_nationalism: "支持激進民族主義"
 ARG_support_radical_nationalism_desc: "自從我們解除了西班牙帝國的枷鎖以來，我們一直在努力尋找[ARG.GetAdjective]人的身份定義。我們在這裡繁衍生息，證明了這片土地是我們的。現在由我們自己來定義[ARG.GetAdjective]人的身份，提醒大家誰才是南美洲真正的強國。"
 ARG_corporatism: "社團主義"
 ARG_corporatism_desc: "社團主義是法西斯主義的一個基本理念，我們應該儘快實施。要做到這一點，我們必須依靠當地的精英和人才，為[ARG.GetNameDef]新法西斯等級制度的發展打開大門。只有這樣，我們才能領導我們的國家走向一個充滿忠誠和效率的未來。"
 ARG_reestablish_ligas_patrioticas: "重建愛國聯盟"
 ARG_reestablish_ligas_patrioticas_desc: "愛國聯盟是20世紀20年代在[ARG.GetNameDef]運作的極右翼準警察性民間組織。後來他們都分散了。也許是時候重振這一運動，以幫助我們在我國猖獗的腐敗中建立秩序。"
 ARG_fascist_researchers: "法西斯主義研究人員"
 ARG_fascist_researchers_desc: "隨著我們的國家慢慢走向法西斯主義的道路，投資於擴大我們的國家研究將是明智的。畢竟，在[ARG.GetNameDef]建立秩序和忠誠只是開始。如果一切按計劃進行，那麼我們可能需要比現在更強大的軍事技術。"
 ARG_support_the_spanish_coup: "支持西班牙政變"
 ARG_support_the_spanish_coup_desc: "我們在西班牙的兄弟們目前正在為他們國家的未來進行一場血腥的內戰。佛朗哥建立軍事控制政府的想法與我們的想法非常一致。我們應該立即提供援助，並向世界展示民主的謬誤。"
 ARG_demand_spanish_compensation: "要求西班牙補償"
 ARG_demand_spanish_compensation_desc: "我們的西班牙兄弟已經成功奪回了他們應得的權力。現在，也許我們應該提醒他們，我們在他們的成功中發揮了我們的作用，是時候付出代價了！"
 ARG_demand_spanish_compensation_tt: "向§Y[SPA.GetNameDef]§!發出事件要求他們給予我們§Y赤道幾內亞§!。如果他們對我們評價為§G高§!，他們更有可能接受！"
 ARG_argentinian_volunteers_in_spain_flag: "§Y[ARG.GetName]§!向§Y[SPA.GetName]§!派遣志願軍"
 ARG_invite_spanish_nationalists: "邀請西班牙民族主義者"
 ARG_invite_spanish_nationalists_desc: "不幸的是，佛朗哥的政變被擊退，內戰正式結束。成千上萬的西班牙民族主義者現在正尋求離開伊比利亞半島，尋找一個更適合他們意識形態的家園。鑑於我們兩國之間的歷史聯繫，我們應該向他們敞開大門，幫助[ARG.GetNameDef]日益壯大的民族主義運動。"
 ARG_encourage_german_investments: "鼓勵德國投資"
 ARG_encourage_german_investments_desc: "儘管被許多人視為歐洲的賤民，[GER.GetNameDef]已經成為一個工業和軍事強國。我們一直對[GER.GetAdjective]人相對友好，因為有大量的[GER.GetAdjective]人生活在[ARG.GetNameDef]。我們應該與他們接觸，看看他們是否願意為我們日益增長的民族主義運動投資。"
 ARG_german_investments_bonus: "德國投資"
 ARG_encourage_italian_argentine_diplomacy: "意大利-阿根廷外交"
 ARG_encourage_italian_argentine_diplomacy_desc: "[ITA.GetAdjective]法西斯主義一直是[ARG.GetNameDef]主要民族主義政黨制定政策的標準模式。我們應該派特使去[ITA.capital.GetCapitalVictoryPointName]，在我們兩國之間開闢一條新的外交渠道。這將是一個建立科研協議的好機會，使我們兩國都能從快速的技術進步中受益。"
 ARG_guardia_nacional: "國民警衛隊"
 ARG_guardia_nacional_desc: "是時候讓我們推翻協和同盟了，取而代之的是把阿根廷置於軍政府的保護之下。國民警衛隊在[ARG.GetNameDef]獨立戰爭期間為我們的主權而戰，現在，在佩德羅·巴勃羅·拉米雷斯的領導下，將帶領[ARG.GetNameDef]進入一個繁榮的新時代。"
 ARG_union_nacional_fascista: "全國法西斯聯盟"
 ARG_union_nacional_fascista_desc: "通過無休止的腐敗和內鬥，很明顯協和同盟的領導層是無用的。現在是[ARG.GetAdjective]政治發生重大變化的時候了。尼米奧·德安金作為全國法西斯聯盟的領導人已經獲得了足夠的人氣，他準備領導這個國家，讓[ARG.GetNameDef]重拾民族主義自豪感。"
 ARG_rapid_militirization: "快速軍事化"
 ARG_rapid_militirization_desc: "既然我們有穩固的軍事政府掌權，我們就可以開始展望我們的擴張目標。現在是擴大我們的軍事工業模式，增加武器和部隊生產的時候了。世界必須準備好面對[ARG.GetNameDef]的力量。"
 ARG_argentine_nationalism: "阿根廷民族主義"
 ARG_argentine_nationalism_desc: "我們的血管裡流淌著征服者的精神，我們應該明智地支持他們征服美洲的名字。讓我們團結那些願意為國戰鬥和犧牲的人，讓我們的工業為大規模生產武器和機器做好準備。[ARG.GetNameDefCap]準備開戰！"
 ARG_war_division: "戰爭部"
 ARG_war_division_desc: "一切戰爭都是建立在充分準備的基礎上的。隨著我們組建內閣，製造戰爭機器，我們每天都離擴張主義目標越來越近。"
 ARG_argentina_first: "阿根廷優先"
 ARG_argentina_first_desc: "經過仔細考慮，我們決定，對[ARG.GetNameDef]未來最好的做法是遠離歐洲日益加劇的衝突，而是專注於[ARG.GetNameDef]對增長和穩定的需求。讓我們組成自己的陣營，獨立對抗世界。"
 ARG_join_the_axis: "加入軸心國"
 ARG_join_the_axis_desc: "我們非常感謝軸心國有能力將[ARG.GetNameDef]置於一個強大而穩定的領導之下。因此，我們應該努力接近他們，並要求加入他們的戰爭，幫助在世界各地傳播法西斯主義！"
 ARG_dominate_the_south: "主宰南美"
 ARG_dominate_the_south_desc: "在這片大陸上有如此多的對手包圍著我們，我們必須採取鐵腕政策，在潛在威脅出現之前將其摧毀，這一點至關重要。讓我們告訴他們誰是南美最具統治力的國家。"
 ARG_preparations_for_war: "戰爭準備"
 ARG_preparations_for_war_desc: "雖然我們可能隨時準備開戰，但我們邊境的供應情況卻不一樣。通過改善我們的補給線，我們可以確保迅速擊敗我們的敵人。"
 ARG_conquer_paraguay: "征服[PAR.GetNameDefCap]"
 ARG_conquer_paraguay_desc: "沒有談判的餘地。[PAR.GetNameDef]擋在我們統治南美的路上。與其發出最後通牒，我們最好還是迎難而上，向我們的鄰國宣戰。"
 ARG_paraguayan_ultimatum: "[PAR.GetAdjective]的最後通牒"
 ARG_paraguayan_ultimatum_desc: "[PAR.GetNameDefCap]是一塊戰略領土，對我們對抗南美大陸其他國家的戰爭目標至關重要。他們要麼同意在我們手下幹活，要麼在軍事上被迫屈服於我們的旗幟下。選擇權在他們手中。發出最後通牒。"
 ARG_uraguayan_ultimatum.tt: "（[URG.GetFlag]§Y[URG.GetNameDefCap]§!）獲得事件“§Y$ARG_political_events.19.t$§!”，這會要求他們成為我們的§Y傀儡§!。如果他們§Y對我們有高評價§!，他們更有可能接受。"
 ARG_paraguayan_ultimatum.tt: "（[PAR.GetFlag]§Y[PAR.GetNameDefCap]§!）獲得事件“§Y$ARG_political_events.19.t$§!”，這將要求他們成為我們的§Y傀儡§!。如果他們§Y對我們有高評價§!，他們更有可能接受"
 ARG_chilean_ultimatum.tt: "（[CHL.GetFlag]§Y[CHL.GetNameDefCap]§!）獲得事件“§Y$ARG_political_events.19.t$§!”，這會要求他們成為我們的§Y傀儡§!。如果他們§Y對我們有高評價§!，他們更有可能接受。"
 ARG_revive_the_colonial_plan: "復興殖民計劃"
 ARG_revive_the_colonial_plan_desc: "為了在南美獲得立足點，[GER.GetNameDef]曾啟動在[URG.GetNameDef]建立殖民地的計劃。然而，這個計劃從未實現。我們應該肩負起恢復這個計劃的責任，代表我們的法西斯朋友傀儡[URG.GetNameDef]。"
 ARG_conquer_uruguay: "建立立足點"
 ARG_conquer_uruguay_desc: "在我們的新政權穩固之際，我們必須決定如何處理我們的弱小鄰國。[URG.GetNameDefCap]一直是有爭議的領土，強行佔領它將向世界其它國家展示我們不容小覷。"
 ARG_reach_out_to_chile: "接近[CHL.GetNameDefCap]"
 ARG_reach_out_to_chile_desc: "與我們的其他鄰國相比，[CHL.GetNameDefCap]更大、更強大。與他們接觸並提供與我們結盟的機會將是明智的。也許如果我們將他們垂涎的領土割讓給他們，他們會更有可能同意。"
 ARG_reach_out_to_chile_tt: "如果他們§Y對我們有高評價§!且是§Y法西斯§!或§Y中立§!，他們更有可能接受"
 ARG_reach_out_to_chile_2_tt: "如果他們§Y接受§!，我們將給予他們§Y[954.GetName]§!和§Y[953.GetName]§!。"
 ARG_chilean_ultimatum: "[CHL.GetAdjective]的最後通牒"
 ARG_chilean_ultimatum_desc: "長期以來，我們與[CHL.GetNameDef]的邊境關係緊張，如果我們真的想確保自己在南美的主導地位，那麼我們需要儘快消滅他們。他們要麼和平加入我們，要麼我們進軍他們的土地，索取屬於我們的東西。"
 ARG_the_old_enemy: "宿敵"
 ARG_the_old_enemy_desc: "終於到了我們把注意力轉向北方的時候了，在那裡，我們最老的對手的影子正在逼近我們。[BRA.GetNameDefCap]一直是我們在這片大陸最大的敵人。是時候重燃內普拉塔戰爭的精神，開闢一條征服[BRA.capital.GetCapitalVictoryPointName]的道路了。"
 ARG_south_american_unity: "南美洲統一"
 ARG_south_american_unity_desc: "既然我們已經在獲得了整片大陸的領土，現在是我們取一個新名字的時候了，它象徵著我們不僅是[ARG.GetNameDef]，而是整個南美洲。我們終於把這些爭吵不休的國家團結在一個強大的旗幟下。"
 ARG_integrate_operation_bolivar: "整合玻利瓦爾計劃"
 ARG_integrate_operation_bolivar_desc: "一段時間以來，[GER.GetNameDef]一直在南美各地執行間諜任務。這一指令被親切地稱為“玻利瓦爾計劃”，已在[ARG.GetNameDef]實施。既然我們與[GER.GetAdjective]人關係良好，我們就可以努力整合這個項目，並鼓勵它在整個南美大陸推廣。"
 ARG_release_hellmuth: "釋放赫爾穆特"
 ARG_release_hellmuth_desc: "奧斯馬爾·赫爾穆特是一名[GER.GetAdjective]裔[ARG.GetAdjective]人，曾在我們的舊政府統治下，因被發現與[GER.GetNameDef]法西斯政府勾結而被捕。我們應該立即釋放他，讓他加入我們自己的情報機構。"
 ARG_anti_american_propaganda: "反美宣傳"
 ARG_anti_american_propaganda_desc: "[USA.GetNameDefCap]是美洲的民主堡壘，自然反對我們所做的一切努力。如果我們希望解決它們，那麼我們需要團結我們的人民支持我們的事業。為了做到這一點，我們可以在全國範圍內煽動反美情緒。有了這種鬥志，我們就有理由攻擊北邊的巨人了。"
 ARG_the_war_machine: "戰爭機器"
 ARG_the_war_machine_desc: "隨著我們新政權的壯大，我們需要一支與之相匹配的軍隊。至關重要的是，我們要在全國範圍內投資建設更多的軍事工業基地，而不僅僅是在[ARG.capital.GetCapitalVictoryPointName]。讓[ARG.GetAdjective]的戰爭機器崛起吧！"
 ARG_secure_the_borders: "確保邊境安全"
 ARG_secure_the_borders_desc: "對我們來說，明智的做法是確保我們目前的邊界安全，防範最危險的對手。我們必須沿著與[CHL.GetNameDef]和[BRA.GetNameDef]的共同邊境線建立一系列防禦工事，並訓練我們的將領在覆蓋北部的廣袤森林中作戰。防守是至關重要的！"
 ARG_argentine_island_sovereignty: "阿根廷島嶼主權"
 ARG_argentine_island_sovereignty_desc: "儘管南大西洋群島顯然在[ARG.GetNameDef]的勢力範圍內，但已經被英國人控制了太長時間。我們應該站起來，爭取屬於我們的東西，即使這意味著向[ENG.GetNameDef]宣戰。無論如何，這些島嶼都將屬於[ARG.GetAdjective]！"
 ARG_argentine_island_sovereignty.tt: "如果當前不在與（[ENG.GetFlag]§Y[ENG.GetNameDefCap]§!）交戰，我們可以獲得針對他們的§Y征服§!戰爭目標。"
 ARG_a_call_to_reform: "呼籲改革"
 ARG_a_call_to_reform_desc: "很明顯，在過去的十年裡，[ARG.GetNameDef]的政治一直一團糟。徹底的民主隨著伊波利托·伊裡戈延而消亡，在[ARG.GetAdjective]政府內部造成的只有混亂和腐敗。現在是我們開始尋求快速和必要的改革，使我們的國家回到正確道路上的時候了。"
 ARG_invite_ghioldi_back_to_argentina: "邀請吉奧爾迪回到阿根廷"
 ARG_invite_ghioldi_back_to_argentina_desc: "羅多爾福·吉奧爾迪是[ARG.GetNameDef]著名的共產主義者，不幸的是，由於我們政府的起訴，他不得不逃離這個國家。如今我們開始轉變對[ARG.GetNameDef]左派的態度，也許是時候赦免吉奧爾迪並邀請他回到祖國了。"
 ARG_invite_ghioldi_back_tt: "§Y羅多爾福·吉奧爾迪§!將返回[ARG.GetFlag]§Y[ARG.GetNameDef]§!，並可以擔任§Y顧問§!。作為阿根廷共產主義的主要參與者，他將有能力領導任何未來的§Y革命§!。"
 ARG_ghioldi_returns: "羅多爾福·吉奧爾迪已回到[ARG.GetNameDef]"
 ARG_support_the_spanish_republicans: "支持西班牙共和軍"
 ARG_support_the_spanish_republicans_desc: "我們在西班牙的兄弟陷入了一場血腥的衝突，他們與同胞作戰，試圖阻止法西斯政權掌管他們的土地。讓西班牙陷入法西斯主義不符合我們的利益，我們應該盡最大努力支持我們在歐洲最密切的文化紐帶。"
 ARG_legitimize_the_PCA: "合法化阿根廷共產黨"
 ARG_legitimize_the_PCA_desc: "阿根廷共產黨是[ARG.GetNameDef]的主要共產主義政黨。從一開始，該黨就與蘇聯共產黨保持一致，經常與[ARG.GetNameDef]其他左翼政黨產生摩擦。然而，現在我們需要徹底的改變來結束臭名昭著的十年，也許是時候讓這個政黨在[ARG.GetAdjective]政壇中合法化了。"
 ARG_reach_out_to_the_soviet_union: "尋求[SOV.GetNameDef]的幫助"
 ARG_reach_out_to_the_soviet_union_desc: "眾所周知，我們需要擺脫舊有的政府形式，並進行快速變革，以塑造[ARG.GetNameDef]的未來。由於這可能導致一場血腥的革命，我們應該向曾經經歷過這種情況的國家尋求援助。如果我們的崛起伴隨著不幸但必要的暴力，與[SOV.GetNameDef]的聯繫可能會確保獲得幫助。"
 ARG_reach_out_to_the_soviet_union_tt: "選擇這個國策將在§Y內戰§!爆發時解鎖§Y社會主義先鋒§!師編制，並在§Y[955.GetName]§!招募§Y五§!個社會主義先鋒單位。"
 ARG_unite_the_workers_of_argentina: "團結阿根廷工人"
 ARG_unite_the_workers_of_argentina_desc: "如果我們要讓[ARG.GetNameDef ]變得更好，我們必須說服我們國家的無產階級，徹底的改善是結束他們苦難的必要條件。讓我們把各行各業的工人聯合起來，向政府表明需要結束現狀！"
 ARG_viva_la_revolucion: "革命萬歲"
 ARG_viva_la_revolucion_desc: "現在是我們向[ARG.GetNameDef]政府發出最後通牒的時候了，我們必須掀起變革之風，把我們的國家轉變成一個真正的社會主義國家。如果事情進展順利，這將和平結束，政權將輕鬆易手。然而，總有可能他們不會不戰而退。"
 ARG_communist_civil_war_tt: "會在§Y[ROOT.GetFlag][ROOT.GetName]§!觸發§R共產主義者和現政府§!的§R內戰！§!"
 ARG_forge_our_own_future: "開創我們自己的未來"
 ARG_forge_our_own_future_desc: "隨著革命取得巨大成功，是時候決定我們要如何塑造[ARG.GetNameDef]的未來了。範妮·埃德爾曼同志多年來一直堅定支持阿根廷共產黨，並在[ARG.GetNameDef]為爭取婦女權利而努力。許多人認為她適合從現在開始領導我們的國家，帶領[ARG.GetNameDef]走入繁榮的新時代。"
 ARG_women_in_industry: "工業中的女性"
 ARG_women_in_industry_desc: "長久以來，女性一直被期望呆在家裡照顧家庭。如果一個女人能夠成為我們國家的領導人，那麼允許她們在其他行業工作也是正確的。這隻會有助於[ARG.GetNameDef]的經濟未來，因為它將極大地擴充我們的勞動力。"
 ARG_support_the_farmers: "支持農民"
 ARG_support_the_farmers_desc: "[ARG.GetNameDefCap]一直擁有強大的農業，我們的牛肉尤其受到世界各地的歡迎。在上屆政府的束縛下，許多農業社區幾乎得不到支持。現在是時候實施改革，改善我們的農業資金，支持[ARG.GetNameDef]農村的無產階級工人。"
 ARG_socialist_volunteers: "社會主義志願軍"
 ARG_socialist_volunteers_desc: "世界上還有許多其他的社會主義運動也在為自己的革命夢想而奮鬥。如果有需要，我們必須提供自己的力量，幫助那些希望走上與我們類似的紅色道路的國家。孤立並不意味著我們應該忽視我們的國際同志的困境。"
 ARG_the_buenos_aires_conference: "布宜諾斯艾利斯會議"
 ARG_the_buenos_aires_conference_desc: "既然我們已經開始穩定這個國家，我們必須小心，不要讓我們的領導層重蹈上屆政府陷入的近乎獨裁的覆轍。因此，在布宜諾斯艾利斯召開了一次社會主義會議，目的是討論和選舉[ARG.GetNameDef]的下一任領導人。"
 ARG_the_buenos_aires_conference_1_tt: "將觸發“§Y布宜諾斯艾利斯會議開始§!”事件，要求我們是選擇保留§Y範妮·埃德爾曼§!掌權還是轉向§Y安東尼奧·索托§!。"
 ARG_the_buenos_aires_conference_2_tt: "保留§Y範妮·埃德爾曼§!將解鎖§Y統一大陸§!和§Y解放大陸§!的國策分支。選擇§Y安東尼奧·索托§!將解鎖§Y改善巴塔哥尼亞§!的國策分支。"
 ARG_align_with_the_soviets: "與蘇聯結盟"
 ARG_align_with_the_soviets_desc: "隨著革命取得巨大成功，是時候決定我們要如何塑造[ARG.GetNameDef]的未來了。羅多爾福·吉奧爾迪同志是回國後領導革命的人，因此是領導[ARG.GetNameDef]的優秀候選人。吉奧爾迪打算與[SOU.GetNameDef]建立更緊密的聯繫，並相信我們的新社會主義國家將通過模仿他們而發展成為一個強國。"
 ARG_soviet_industrial_model: "蘇聯工業模式"
 ARG_soviet_industrial_model_desc: "俄國革命後，[SOU.GetNameDef]在軍工複合體現代化方面取得了長足的進步。我們應該從中得到啟發，跟隨他們的腳步，增加我們在國內的軍用工廠的數量。"
 ARG_committee_of_state_security: "國家安全委員會"
 ARG_committee_of_state_security_desc: "隨著世界緊張局勢的加劇，我們意識形態的敵人越來越多。為了保持我們的權力，我們必須專注於創建一個情報機構，在[ARG.GetNameDef]和國際上加強我們的價值觀。"
 ARG_russian_manufacturers: "[SOU.GetAdjective]製造商"
 ARG_russian_manufacturers_desc: "為了提高我們的工業實力，與這片大陸上的其他國家抗衡，我們應該與[SOU.GetNameDef]接觸，邀請他們的一些製造商到[ARG.GetNameDef]。畢竟，我們共享一種意識形態，只有共享我們的軍事技術才有意義。"
 ARG_centralize_power: "集中權力"
 ARG_centralize_power_desc: "迄今為止，羅多爾福·吉奧爾迪在革命後的旅程中帶領我們走得很好。他政府內部的許多人認為，將權力集中到總理一人手中，將有助於我們這個新興的蘇維埃國家免受來自內部和外部的威脅。畢竟，這是為了[ARG.GetNameDef]的安全和保障。"
 ARG_workers_rights: "工人的權利"
 ARG_workers_rights_desc: "我國社會主義革命的核心原則之一是提高[ARG.GetNameDef]無產階級工人的生活質量。我們既然掌握了生產資料，就應該使我們的田地和工廠不再受惡劣的勞動條件的影響。"
 ARG_reform_our_industry: "工業改革"
 ARG_reform_our_industry_desc: "長期以來，我們的工業創新落後於世界其他國家。現在是時候加強[ARG.GetNameDef]的工業，使其達到更現代的標準。我們可以從建設新工廠開始，讓它們立即投入生產。"
 ARG_empower_the_fjc: "賦權共產主義青年聯合會"
 ARG_empower_the_fjc_desc: "共產主義青年聯合會是一個青年和革命政治組織，成立的目的是在[ARG.GetAdjective]青年中推廣阿根廷共產黨的政策。為了在全國範圍內鞏固我們的社會主義思想，儘早讓我國的兒童參與進來是明智的。"
 ARG_state_atheism: "國家無神論"
 ARG_state_atheism_desc: "[ARG.GetNameDefCap]長期以來一直是一個天主教國家，宗教在許多公民的日常生活中發揮著重要作用。然而，我們可以選擇實施國家無神論，因為宗教往往在社會主義革命中沒有多少地位。然而，我們必須記住，這可能會引起群眾的不安，他們長期以來一直把宗教作為他們生活的一部分。"
 ARG_liberation_theology: "解放神學"
 ARG_liberation_theology_desc: "鑑於天主教在[ARG.GetNameDef]的悠久歷史及其在公民生活中的重要性，許多神職人員已經開始採用一種新的基督教形式，即解放神學，作為對[ARG.GetNameDef]意識形態轉變的反應。考慮到解放神學的思想與我們的革命運動是一致的，對我們來說，採用教會的這個教派作為我們的國教是明智的。"
 ARG_socialist_researchers: "社會主義研究人員"
 ARG_socialist_researchers_desc: "隨著我國成為社會主義國家，投資擴大我國的研究將是明智的。畢竟，革新和現代化我們的技術對我們國家的發展很重要。"
 ARG_a_red_south_america: "猩紅日落"
 ARG_a_red_south_america_desc: "終於，我們成功地將南美洲納入同一面共產主義旗幟之下。隨著紅色浪潮席捲整個大陸，受壓迫的工人階級終於可以在我們的指導下過上更自給自足的生活。然而，我們為何要止步於此？現在是時候實施猩紅日落行動，給所有反對全球革命的人帶來最後的猩紅日落了。"
 ARG_conquer_south_america: "解放大陸"
 ARG_conquer_south_america_desc: "南美大陸沒有其他世界意識形態的容身之地，因為它們對我們的社會主義國家構成威脅。如果他們不加入我們，那麼我們必須儘快解放他們的人民，把他們置於[ARG.GetNameDef]的保護之下。"
 ARG_more_communism_in_south_america_tt: "對§Y南美§!所有§Y非共產主義§!國家獲得§Y$annex_everything$§!戰爭目標"
 ARG_unify_south_america: "統一大陸"
 ARG_unify_south_america_desc: "南美大陸上有許多國家開展了自己的革命運動，並建立了共產主義政府。如果我們要保持強大，我們必須團結在一起。是時候向這些國家伸出援手，請求它們加入我們的國際行動。"
 ARG_unify_the_continent_tt: "選擇這個國策將向§Y南美洲§!的任何§Y共產主義§!國家發出邀請加入我們的§Y陣營§!。"
 ARG_integrate_the_motherland: "整合美洲"
 ARG_integrate_the_motherland_desc: "在我們從資本主義和法西斯的腐朽中解放出來的領土上的曾經的統治階級，如果我們不採取行動使他們融入我們不斷發展的聯盟，他們還可能繼續反抗我們。"
 ARG_eliminate_american_imperialism: "消滅美帝國主義"
 ARG_eliminate_american_imperialism_desc: "這個北方的巨人長期以來一直是企業貪婪和腐敗的堡壘。由於我們現在已經成長為自己的超級大國，華盛頓的資本主義狗們決定我們是一個需要被消滅的威脅只是時間問題。我們不能允許這種情況發生。現在是實施奧卡索·埃斯卡拉塔行動的時候了，給[USA.GetNameDef]帶來最後的猩紅日落。"
 ARG_improve_patagonia: "改善巴塔哥尼亞"
 ARG_improve_patagonia_desc: "隨著安東尼奧·索托領導下的安那其工團主義者控制了[ARG.GetNameDef]的命運，他們已經決定，他們的家鄉巴塔哥尼亞最終得到幾十年來迫切需要的關注是非常必要的。"
 ARG_establish_the_free_association: "建立自由協會"
 ARG_establish_the_free_association_desc: "自由協會是指個人之間的一種關係，在這種關係中沒有國家、社會階級、等級制度或生產資料的私有制。這是安那其工團主義者的長期目標，現在是時候我們開始打破這些界限，創造一個每個人都能自由滿足個人需求的社會。"
 ARG_no_gods_no_masters: "沒有神明，沒有主人"
 ARG_no_gods_no_masters_desc: "任何人都不應該被那些企圖傷害他們的人所控制。儘管我們的鄰國可能不理解我們的意識形態，但我們可以承擔起責任，把他們從那些貪婪地想要擴大其勢力範圍的好戰國家手中解放出來。"
 ARG_in_memory_of_yrigoyen: "紀念伊裡戈延"
 ARG_in_memory_of_yrigoyen_desc: "[ARG.GetNameDefCap]曾經經歷過這樣的局面。雖然他的統治並非沒有過錯，但伊波利托·伊裡戈延仍然進行了必要的改革，這些改革至今仍使我們的國家受益。我們需要有人接過衣缽，帶領我們再次走上民主的既定道路。"
 ARG_in_memory_of_yrigoyen_tt: "§Y馬塞洛·德·阿爾維爾§!成為§Y$ARG_democratic_party_long$§!的領袖，執政黨切換為§Y民主主義§!"
 ARG_promote_urbanization: "促進城市化進程"
 ARG_promote_urbanization_desc: "雖然我們周圍的世界一直在工業化和城市化，但[ARG.GetNameDef]基本上沒有什麼變化。這使我們不得不依賴其他國家來維持我們的經濟。承認這一點並推動城市化應該能迅速結束這些依賴。"
 ARG_secure_the_opposition: "監管反對派"
 ARG_secure_the_opposition_desc: "一定程度的反對對我們的民主價值觀是有益的。我們目前面對的對手相當強大，但我們的主要問題是他們沒有公平競爭。我們不能允許他們樹立這種危險的榜樣，為了每個人的安全，政治反對派需要受到監管。"
 ARG_the_clean_election: "廉潔選舉"
 ARG_the_clean_election_desc: "在經歷了[ARG.GetNameDef]政壇數十年的腐敗和欺詐之後，激進公民聯盟在一場激烈的運動中成功地取得了勝利，這場運動的重點是揭露協和同盟的選票舞弊。目前正在討論由誰來領導該黨。"
 ARG_anti_corruption_policies: "反腐敗政策"
 ARG_anti_corruption_policies_desc: "我們必須確保在過去十年中玷汙我們國家的政治腐敗絕不能再次出現在我們的政府選舉中。通過實施新的政策，重點根除我國政府內部的賄賂、貪汙和裙帶關係文化。"
 ARG_a_true_democracy: "真正的民主"
 ARG_a_true_democracy_desc: "自1861年以來，[ARG.GetNameDefCap]一直被認為是一個民主國家，但最近，我國政治制度的狀況使自由、民主共和國的概念蒙羞。現在我們終於可以作為一個真正的民主國家向前邁進了。作為一個重視穩定和改善[ARG.GetAdjective]經濟的國家。"
 ARG_argentina_for_all: "所有人的阿根廷"
 ARG_argentina_for_all_desc: "作為前殖民地，[ARG.GetNameDef]是來自世界各地的許多人的家園。在我們國家未來的願景中，我們希望生活在它境內的每個人都能稱自己為[ARG.GetAdjective]人，並自豪地稱這個國家為自己的家。我們必須努力確保[ARG.GetNameDef]是所有決定住在這裡的人的家園。"
 ARG_reinforce_the_education_system: "加強教育體系"
 ARG_reinforce_the_education_system_desc: "教育是民主國家的基礎。每個生活在[ARG.GetNameDef]的人都應該自由上學，成長為誠實、勤奮的公民。我們應該利用這個機會把資金集中到特定的從業者，希望這將使我們能夠發展自己的技術和經濟進步。"
 ARG_education_electronics_bonus: "注重電子教育"
 ARG_education_industrial_bonus: "注重工業教育"
 ARG_education_synthetics_bonus: "注重合成教育"
 ARG_university_reforms: "大學改革"
 ARG_university_reforms_desc: "隨著我們的教育體系得到加強，這將是改革我們大學的一個好機會。推進高等教育將使我們能夠更充分地利用大學的研究部門。"
 ARG_seek_american_support: "尋求美國的支持"
 ARG_seek_american_support_desc: "隨著戰爭的陰影在世界各地醞釀，我們必須準備好面對任何可能威脅到我們邊界的衝突。[USA.GetNameDefCap]可能是北方沉睡的巨人，但作為一個民主國家，我們可以從他們的外交政策和民防計劃中學到很多東西。我們應該請求他們幫助，並讓我們開始與北美鄰國建立融洽關係。"
 ARG_us_army_training: "美國陸軍訓練"
 ARG_us_army_training_desc: "[USA.GetNameDefCap]友好地提出向我們提供他們的軍事訓練方案，以便我們可以開始為可能發生的戰爭準備我們自己的部隊。這不僅會造就一支更有經驗、更堅強的軍隊，我們還可以利用我們學到的東西來加強我們的特種部隊計劃。"
 ARG_us_army_training_bonus: "$ARG_us_army_training$"
 ARG_american_defense_investments: "來自美國的國防投資"
 ARG_american_defense_investments_desc: "雖然擁有一支訓練有素的強大軍隊是件好事，但人們經常說，堅強的防禦和強大的進攻一樣好。我們與[USA.GetNameDef]的紐帶使我們提高了在最脆弱地區的防禦能力，特別是幫助我們抵禦來自空中的攻擊。叢林和山脈在地面上保護我們，這些炮塔將保衛我們的天空。"
 ARG_joint_military_exercises: "聯合軍事演習"
 ARG_joint_military_exercises_desc: "為了表示對[USA.GetAdjective]人的善意，我們應該提議在[ARG.GetNameDef]境內舉行聯合軍事演習。通過共同努力，我們可以提高海軍和空軍的訓練和技能水平。"
 ARG_join_the_allies: "加入同盟國"
 ARG_join_the_allies_desc: "現在是我們在這場衝突中選擇立場的時候了。作為一個致力於保護民主神聖性的國家，我們必須與同盟國接觸並確保我們在陣營中的地位。我們必須幫助保護世界不受那些企圖征服它的人的傷害。"
 ARG_bastion_of_democracy: "和平堡壘"
 ARG_bastion_of_democracy_desc: "我們在堅持一個民主國家的理念方面取得了巨大的進步，自我們危險的腐敗選舉以來已經取得了長足的進步。隨著戰爭在世界各地醞釀，我們必須堅守陣地，作為和平的堡壘，並保證保護這片大陸上的小國。"
 ARG_regulated_national_salaries: "國家最低工資"
 ARG_regulated_national_salaries_desc: "我們在國內企業和公司中看到了一種令人擔憂的趨勢。我們沒有興趣控制他們的預算，但我們確實有興趣確保我們所有的公民都得到公平的工資。在這種情況下，設定最低工資肯定會對每個人有所幫助。"
 ARG_social_welfare_fund: "社會福利基金"
 ARG_social_welfare_fund_desc: "我們用於社會福利支出的預算曆來很低。儘管看到增加社會福利預算可能帶來的利潤，我們開始相信也許不應該這樣做。建立社會福利支出基金可能是一項值得努力的工作。"
 ARG_british_gaurantee: "加強與英國的關係"
 ARG_british_gaurantee_desc: "從歷史上看，我們與英國有著密切的聯繫，他們在我們國家投入了大量資金。我們應該考慮重新點燃這些聯繫，加強這種聯繫，這很可能對我們有益！"
 ARG_royal_airforce_influence: "英國皇家空軍的影響"
 ARG_royal_airforce_influence_desc: "隨著我們與英國的關係越來越密切，我們應該研究一下我們是否也可以學習他們的軍事活動。英國皇家空軍廣受好評，研究他們的運作可能會大有裨益。當我們這麼做的時候，我們也應該考慮嘗試購買一些類似的飛機。"
 ARG_royal_airforce_influence_bonus: "$ARG_royal_airforce_influence$"
 ARG_royal_navy_influence: "英國皇家海軍的影響"
 ARG_royal_navy_influence_desc: "隨著我們與英國的關係越來越密切，我們應該研究一下我們是否也可以學習他們的軍事活動。英國皇家海軍廣受好評，研究他們的運作可能會有所裨益。當我們這樣做的時候，我們也應該考慮研製與他們類似的艦船。"
 ARG_royal_navy_influence_bonus: "$ARG_royal_navy_influence$"
 ARG_reinforced_alliance: "加強合作"
 ARG_reinforced_alliance_desc: "事實證明，我們與英國保持密切關係大有裨益，但我們對他們的軍事研究得越多，就越痛苦地發現我們並沒有為終將到來的衝突做好充分準備。我們應該考慮請求他們以保障獨立和互不侵犯條約的形式提供更明確的支持。"
 ARG_reinforced_alliance.tt: "（[ENG.GetFlag]§Y[ENG.GetNameDefCap]§!）獲得事件‘§Y$ARG_political_events.73.t$§!’，這將會在我們兩國之間提供§Y互不侵犯條約§!並§Y保障獨立§!。如果他們§Y對我們有高評價§!，他們更有可能接受"
 ARG_internal_focus: "關注內部"
 ARG_internal_focus_desc: "雖然可以選擇接觸那些主要民主強國，但我們政府中的很多人認為我們更應該關注並把資源投入[ARG.GetNameDef]內部。目前，我們應該限制我國與世界的貿易，以確保[ARG.GetNameDef]擁有抵禦戰爭衝擊所需的東西。"
 ARG_alvears_democracy: "阿爾維亞爾的民主"
 ARG_alvears_democracy_desc: "許多人認為[ARG.GetLeader]是一個以嚴法治國的嚴厲之人，但隨著時間的推移，顯然他確實將[ARG.GetNameDef]的最大利益放在了心上。他確實是伊波利托·伊裡戈延的繼承者，應當被視作阿根廷的民主之父。"
 ARG_south_american_alliance: "泛美合作"
 ARG_south_american_alliance_desc: "隨著我們的新陣營的形成並致力於維持南美洲大陸的和平，我們應該向我們周圍的其他民主國家伸出手來，並要求它們加入我們對和平與自由的保證。團結在一起，我們會更強大、更能屹立不倒。"
 ARG_bolstering_the_army: "徵兵活動"
 ARG_bolstering_the_army_desc: "戰爭仍在升溫，我們必須準備好響應它的號召。在整個[ARG.GetNameDef]上下，不論男女都願意為捍衛自己的自由權不受那些試圖奪走自由的人的傷害而拼死戰鬥。我們必須開展徵兵活動，鼓勵我們偉大國家的人民拿起武器，準備為自己的家園而戰。"
 ARG_the_second_argentine_republic: "阿根廷第二共和國"
 ARG_the_second_argentine_republic_desc: "在經歷了多年的腐敗和欺詐之後，我們終於從舊國家的灰燼中崛起，成為西半球新的民主堡壘。從今天起，為了使我們從過去的錯誤中分離出來，我們將被稱為阿根廷第二共和國。在團結和自由中！"
 ARG_the_second_argentine_republic_tt: "（[ARG.GetFlag]§Y[ARG.GetNameDefCap]§!）將為§Y南美洲§!的所有民主國家§Y保障獨立§!"
 ARG_hitler_1: "第四次的魅力"
 ARG_hitler_1_desc: "我們的新總統一上臺就立刻在[ARG.GetNameDef]推動深刻變革，以期復現[GER.GetNameDef]曾經擁有的力量。希勒特閣下似乎堅決要在南美建立第四帝國。這次還能出什麼問題呢？"
 ARG_hitler_2: "閃電戰"
 ARG_hitler_2_desc: "閃電戰是一種我們可以使用壓倒性的機械化火力來克服敵人的方式。我們的總統希望迅速擴張，聲稱要“彌補失去的時間”。不知何故，這些計劃也延伸到了[GER.GetNameDef]舊有的土地上。"
 ARG_hitler_2_tt: "獲得針對§Y南美洲§!所有§Y非法西斯§!國家的§Y$annex_everything$§!戰爭目標"
 ARG_hitler_2_core_tt: "獲得所有曾經屬於§Y德國§!的地區的§Y核心§!。"
 ARG_hitler_3: "奇蹟武器"
 ARG_hitler_3_desc: "奇蹟武器是我們將嘗試開發更強大的火箭和可能改變戰爭進程的武器的計劃。我們的總統帶著一系列受水損的文件來到我們面前，其中包含了我們可以立即付諸行動的不可思議的想法。"
 ARG_arma_maravillosa_bonus: "奇蹟武器"
 ARG_worst_timeline_flag: "§Y希勒特閣下§!是§Y[ARG.GetNameDef]§!的領袖"
 ARG_hitler_4: "打撈船舶"
 ARG_hitler_4_desc: "根據希勒特閣下的指示，作為第一艘在戰爭中被擊沉的[GER.GetAdjective]戰列艦，尋回施佩伯爵將軍號的殘骸乃是我國頭等要務。當被詢問此事時，他就用蹩腳的西班牙語嘟囔著“尊嚴”和“別質疑我”之類的話。無論如何，讓我們把施佩伯爵將軍號打撈上來！"
 ARG_ligas_patrioticas_tt: "解鎖愛國聯盟師編制並在§Y[ROOT.capital.GetCapitalVictoryPointName]§!招募§Y5§!個單位"
 ARG_guardia_nacional_tt: "§Y$ARG_pedro_pablo_ramirez$§!成為§Y$ARG_gen_nazism_party_long$§!的領袖，執政黨切換為§Y法西斯主義§!"
 ARG_union_nacional_fascista_tt: "§Y尼米奧·德安金§!成為§Y$ARG_fascism_party_long$§!的領袖，執政黨切換為§Y法西斯主義§!"
 ARG_nationalist_faction: "法西斯同盟"
 ARG_communist_faction: "南美國際"
 ARG_democratic_faction: "門羅聯盟"
 #GUAY#
 GUAY_disperse_military_power: "分散軍方勢力"
 GUAY_disperse_military_power_desc: "為了確保我們政府內閣的未來，我們需要確保軍隊不能奪取政權。"
 GUAY_nationalize_foreign_owned_companies: "將外資公司國有化"
 GUAY_nationalize_foreign_owned_companies_desc: "長期以來，外資公司利用我們的資源為自己謀利，這種情況不會再發生了。"
 GUAY_urbanization: "城市化"
 GUAY_urbanization_desc: "為了讓我們的公民擺脫貧困，我們應該把他們帶到大城市，在那裡可以獲得更多的財富和教育。"
 GUAY_abolish_low_level_income_tax: "廢除低收入稅"
 GUAY_abolish_low_level_income_tax_desc: "對我們社會中最貧窮的人徵稅是沒有意義的，這必須被廢除"
 GUAY_free_seconday_schools: "免費中學"
 GUAY_free_seconday_schools_desc: "教育是經濟運轉良好的基石。為了子孫後代，我們應該在這方面進行投資。"
 GUAY_the_stuff_of_legends: "傳奇故事"
 GUAY_the_stuff_of_legends_cores_tt_arg: "控制所有初始§Y阿根廷§!核心地區"
 GUAY_the_stuff_of_legends_cores_tt_bra: "控制所有初始§Y巴西§!核心地區"
 GUAY_the_stuff_of_legends_cores_tt_bol: "控制所有初始§Y玻利維亞§!核心地區"
 GUAY_the_stuff_of_legends_cores_tt_urg: "控制所有初始§Y烏拉圭§!核心地區"
 GUAY_the_stuff_of_legends_cores_tt_par: "控制所有初始§Y巴拉圭§!核心地區"
 GUAY_the_stuff_of_legends_desc: "起初的夢想變成了現實。在我們的領導下，我們已經牢牢掌握了這片大陸，並鑄造了獨特的身份。這將被載入史冊，成為傳奇。"
 GUAY_meet_with_the_old_powers: "會見老牌列強"
 GUAY_meet_with_the_old_powers_tt: "解鎖與主要老牌列強結盟的決議，這會給予你一個加成，取決於結盟的勢力。"
 GUAY_meet_with_the_old_powers_desc: "我們的國家雖小，但雄心勃勃，因此我們需要從列強那裡獲得如何在與鄰國的較量中佔上風的訣竅。"
 GUAY_dam_construction: "大壩建設"
 GUAY_dam_construction_desc: "我國有足夠的機會建設水電大壩，但沒有足夠的儲備來進行這樣昂貴的項目。也許有夥伴國願意向我們提供貸款呢？"
 GUAY_dam_construction_desc_tt: "我們需要在§Y720天§!內償清這筆投資。如果在付款到期之前與該國發生戰爭，還款將作廢。"
 GUAY_not_at_war_with_old_power: "不在與所選結盟的老牌列強交戰"
 GUAY_has_picked_old_power: "已選擇了與之結盟的老牌列強"
 GUAY_old_world_power_faction: "舊世界政權處於陣營中或是陣營領導者"
 GUAY_old_world_power_scope: "§Y老牌列強夥伴國§!："
 GUAY_tag_the_economic_miracle: "南美經濟奇蹟"
 GUAY_beef_and_hide_industry: "牛肉和獸皮產業"
 GUAY_beef_and_hide_industry_desc: "我們國家的核心經濟圍繞著牛肉和皮革展開，加以擴張是非常有意義的。"
 GUAY_protect_domestic_industries_beef: "$GUAY_beef_and_hide_industry$完成後\n增加：§G1§!§Y民用工廠。§!\n增加：§G1§!建築位。"
 GUAY_protect_domestic_industries_agricultural: "$GUAY_agricultural_colonization$完成後\n增加：§G1§!§Y民用工廠。§!\n增加：§G1§!建築位。"
 GUAY_protect_domestic_industries_cash_crop: "$GUAY_cash_crop_exports$完成後\n增加：§G1§!§Y民用工廠。§!\n增加：§G1§!建築位。"
 GUAY_protect_domestic_industries_wool_makers: "$GUAY_wool_makers$完成後\n增加：§G1§!§Y民用工廠。§!\n增加：§G1§!建築位。"
 GUAY_cash_crop_exports: "經濟作物出口"
 GUAY_cash_crop_exports_desc: "我國充分具有向其他國家大量出口經濟作物的條件。這種高附加值的商品出口將給我們帶來更大的繁榮。"
 GUAY_export_focus: "重視出口"
 GUAY_export_focus_desc: "我們應該確保人們遍及四方都知道我們的國家，以推動從旅遊到牛肉出口等全球範圍的需求。讓他們瞭解[FROM.GetNameDefCap]！"
 GUAY_agricultural_colonization: "農業殖民"
 GUAY_agricultural_colonization_desc: "農業一直是我們經濟的重要組成部分。通過土地清算來擴大農業規模將產生更多的利潤。"
 GUAY_wool_makers: "羊毛廠商"
 GUAY_wool_makers_desc: "羊毛對每個人來說都是一種重要的商品，我們已經備好羊毛供應。畢竟每個人在冬天都需要保暖。"
 GUAY_form_ties_with_the_military: "與軍方建立紐帶"
 GUAY_form_ties_with_the_military_desc: "現任政府未能提供國家所需的穩定。我們將動用軍隊採取果斷行動，推翻這個失敗的政權。"
 GUAY_place_opposition_leaders_in_house_arrest: "軟禁反對派領導人"
 GUAY_place_opposition_leaders_in_house_arrest_desc: "我們需要迅速行動以鞏固我們對國家的掌控。我們將把反對派軟禁起來，直到政變結束。"
 GUAY_enact_martial_law: "頒佈戒嚴令"
 GUAY_enact_martial_law_desc: "動盪正在加劇。我們需要控制輿論，使人們保持克制，避免不必要的流血事件，以免局勢失控。"
 GUAY_coup_detat: "政變的後果"
 GUAY_coup_detat_desc: "舊政府倒臺了！儘管與政府附屬勢力發生了短暫的對峙，但我們已經控制了所有機構。他們被解除武裝，沒有發生傷亡，他們的武器已被存入我們的儲備。"
 GUAY_cult_of_personality: "個人崇拜"
 GUAY_cult_of_personality_desc: "為了使國家強大，我們將支持我們親愛的領袖，並建立個人崇拜。一個可以團結普通人並使他們為之奮鬥的象徵。"
 GUAY_appease_the_generals: "安撫眾將領"
 GUAY_appease_the_generals_tt: "將領們將獲得額外的屬性和一個隨機分配的特質。"
 GUAY_appease_the_generals_desc: "那些允許我們接管國家的將軍們確實期望我們以同樣的方式回報他們。最好不要拖延太久，否則他們可能會反對我們。"
 GUAY_appease_the_generals_eq_trigger_tt: "陸軍正在使用的步兵裝備多於§Y2500§!"
 GUAY_a_domestic_arms_factory: "國內武器工廠"
 GUAY_a_domestic_arms_factory_desc: "雖然我們的經濟無法與歐洲老牌列強競爭，但我們不能完全依賴外國武器貿易。如果我們被孤立，我們將開始國內武器製造進程。"
 GUAY_penal_battalions: "懲戒營"
 GUAY_penal_battalions_tt: "添加滿員的§Y6個懲戒營§!。解鎖§Y懲戒營§!"
 GUAY_penal_battalions_desc: "我們的軍隊狀況堪憂，自願參軍的人寥寥無幾。從監獄中徵召可能是解決方案。"
 GUAY_rekindle_old_gripes: "[GUAY_rekindle_old_gripes]"
 GUAY_rekindle_old_gripes_desc: "[GUAY_rekindle_old_gripes_desc]"
 GUAY_rekindle_old_gripes_URG: "重燃舊怨"
 GUAY_rekindle_old_gripes_URG_desc: "[ARG.GetName]和[BRA.GetName]歷史上都曾利用我們達到他們自己的目的，給我們的人民帶來災難性的後果。我們需要向外擴張，以防止敵對勢力再次接近蒙得維的亞。"
 GUAY_rekindle_old_gripes_PAR: "在三國同盟的陰影下"
 GUAY_rekindle_old_gripes_PAR_desc: "在三國同盟戰爭期間，我們有60%的人口死亡，我國再也沒有恢復過來。只有擴張才能給我們的人民帶來穩定和繁榮；我們不再生活在那個該死的同盟的陰影下。"
 GUAY_rekindle_old_gripes_ARG_PAR_tt: "如果我們在戰爭爆發後§Y365日§!內控制§Y[957.GetName]§!，[ARG.GetName]將不得不接受無條件和平，否則將面臨災難性的士氣損失。"
 GUAY_rekindle_old_gripes_BRA_PAR_tt: "如果我們在戰爭爆發後§Y365日§!內控制§Y[504.GetName]§!，[BRA.GetNameDef]將不得不接受無條件和平，否則將面臨災難性的士氣損失。"
 GUAY_rekindle_old_gripes_ARG_URG_tt: "如果我們在戰爭爆發後§Y365日§!內控制§Y[510.GetName]§!，[ARG.GetName]將不得不接受無條件和平，否則將面臨災難性的士氣損失。"
 GUAY_rekindle_old_gripes_BRA_URG_tt: "如果我們在戰爭爆發後§Y365日§!內控制§Y[502.GetName]§!，[BRA.GetNameDef]將不得不接受無條件和平，否則將面臨災難性的士氣損失。"
 GUAY_mobalize_the_economy: "動員經濟"
 GUAY_mobalize_the_economy_desc: "我們需要開始動員經濟，以應對任何可能的情況。人們可能會抱怨，但他們需要知道他們服務於更高的目標。"
 GUAY_adopt_minority_languages: "採用少數民族語言"
 GUAY_adopt_minority_languages_desc: "為了增強士氣並減少軍事情報失誤的風險，我們將在整個軍隊中採用我們自己的語言。"
 GUAY_mythologize_the_father_of_the_nation: "神化國父"
 GUAY_mythologize_the_father_of_the_nation_desc: "[GUAY_mythologize_the_father_of_the_nation_desc]"
 GUAY_mythologize_the_father_of_the_nation_urg: "何塞·阿蒂加斯被視為我們的國父，他為我們的獨立而戰，對抗敵對的鄰國和歐洲強權。他的遺產和理想將被制度化，成為烏拉圭人身份的一部分。"
 GUAY_mythologize_the_father_of_the_nation_par: "弗朗西斯科·洛佩斯帶領國家對抗三國同盟，面對三個國家的猛攻仍拒絕屈服。這種決心和意志將被銘刻在每個士兵心中。"
 GUAY_the_permanent_leader: "永久領袖"
 GUAY_the_permanent_leader_desc: "[ROOT.GetLeader]是國家的象徵，因此我們應該將他置於高位，可以用來團結普通士兵。他將成為我們國家的永久領袖。"
 GUAY_long_term_contracts: "長期武器合同"
 GUAY_long_term_contracts_desc: "我們無法指望在武器製造的最前沿與鄰國競爭。然而，與主要強國簽訂長期許可合同將使我們能以折扣價生產這些物件。"
 GUAY_clamp_down_on_new_territories: "對新領土進行鎮壓"
 GUAY_clamp_down_on_new_territories_desc: "我們的新領土不能出現無政府狀態。我們需要鎮壓抵抗，懲罰國家的敵人。"
 GUAY_develop_new_territories: "開發新領土"
 GUAY_develop_new_territories_desc: "解決領土交換問題的最好辦法是為人們提供比以前更高質量的生活。這將是我們的政策。"
 GUAY_a_deal_with_devil: "與魔鬼交易"
 GUAY_a_deal_with_devil_desc: "很明顯，在這個不確定的世界中，我們沒有盟友就無法生存。我們將尋求加入比我們更強大的夥伴國，建立更緊密的紐帶；希望他們不會將我們帶入混亂。"
 GUAY_no_second_american_colonization: "不再有第二次美洲殖民"
 GUAY_no_second_american_colonization_desc: "我們的大陸在軸心國和盟國之間搖擺不定，而我們的鄰國只能眼睜睜地看著自己處於他國的束縛之下。南美洲應該有一個更好的命運，不受老牌列強的束縛，自由地塑造我們的命運，不受殖民遺產的限制，如果我們為了達到目的而必須踐踏那些視野狹窄的人，那就這樣吧。"
 GUAY_demand_a_seat_at_the_high_table: "要求平等對待"
 GUAY_demand_a_seat_at_the_high_table_desc: "儘管我們做出了貢獻，但我們仍然僅僅被列強視為二流盟友。我們必須要求獲得與其他國家平起平坐的地位，在這個世界新秩序中成為南方的管理者。"
 GUAY_laissez_faire: "自由放任"
 GUAY_laissez_faire_desc: "除特殊情況外，政府沒有理由干預經濟。自由市場將會獲勝！"
 GUAY_laissez_faire_tt: "地主將開始在我國建造建築。"
 GUAY_land_reforms: "改善土地"
 GUAY_land_reforms_desc: "我們需要改善我國的基礎設施，因為這是任何社會進行現代化的第一步。"
 GUAY_empower_the_land_owners: "賦權地主"
 GUAY_empower_the_land_owners_desc: "地主是我國最有權勢的集團之一。我們將通過給他們更多的土地來賦予他們權力，反過來我們將獲得他們的支持。"
 GUAY_empower_the_land_owners_desc_tt: "地主將更有可能建造高價值的建築，比如§Y民用工廠§!、§Y軍用工廠§!、§Y船塢§!和§Y額外建築位§!"
 GUAY_river_trade: "河流貿易"
 GUAY_river_trade_desc: "我們的國家是眾多河流國家之一。自這個國家存在以來，沿著這些河流行駛的渡輪一直是國家的主要支柱。只有在我們的鄰國願意的情況下，擴大這類貿易才有意義。"
 GUAY_river_trade_tt: "增加：如果對[THIS.GetNameDef]的評價高於§Y49§!，§G+1§!§Y民用工廠§!。"
 GUAY_the_tag_economic_miracle: "[THIS.GetAdjective]經濟奇蹟"
 GUAY_the_tag_economic_miracle_desc: "我們的國家正在經歷一些分析師所稱的經濟奇蹟。過去幾年我們經歷了快速增長，使我們能夠迅速工業化；來自世界各地的投資者蜂擁而至，投資經濟活動，進一步推動了這種增長。"
 GUAY_heavy_industry: "重工業"
 GUAY_heavy_industry_desc: "雖然我們的經濟主要依賴基礎產品，但我們不能忽視重工業。過分依賴國外製造的商品會讓我們在貿易中斷時處於脆弱地位。"
 GUAY_exploit_mineral_wealth: "開發礦產資源"
 GUAY_exploit_mineral_wealth_desc: "我們在礦產資源方面並不豐富，但我們將充分利用我們僅有的一點資源。"
 GUAY_protect_domestic_industries: "保護國內產業"
 GUAY_protect_domestic_industries_desc: "在進行國際貿易時，我們必須非常小心，不要讓廉價的國外商品擠壓國內產業。我們需要實施一系列進口稅，優先保護我們的國內經濟。"
 GUAY_national_academy_of_sciences: "國家科學院"
 GUAY_national_academy_of_sciences_desc: "對科研的額外投資將使我們能夠更快地開發新的戰爭武器，並追趕上列強。"
 GUAY_national_academy_of_sciences_2: "[THIS.GetAdjective]機械大學"
 GUAY_national_academy_of_sciences_2_desc: "未來的戰爭著眼於高科技戰爭。我們需要讓一些人離開農場，進入軍事工程領域。"
 GUAY_national_academy_of_sciences_3: "南美高等大學"
 GUAY_national_academy_of_sciences_3_desc: "每個南美人都應該接受高等教育。控制整個大陸給了我們足夠的資源，讓每個男人和女人都能夠實現這一理念。"
 GUAY_cooperation_in_the_americas: "$BRA_cooperation_in_the_americas$"
 GUAY_cooperation_in_the_americas_desc: "$BRA_cooperation_in_the_americas_desc$"
 GUAY_defense_force: "[THIS.GetAdjective]國防力量"
 GUAY_defense_force_desc: "為了保護我們的公民，我們需要組建一支防禦部隊，抵禦來自鄰國的任何潛在侵略。"
 GUAY_specialized_terrain_training: "特化地形訓練"
 GUAY_specialized_terrain_training_desc: "我們的軍隊規模雖小，但是我們在人力和裝備上的不足可以在質量上彌補。特化的部隊可以發揮超出其重量級的作用，並起到威懾作用。"
 GUAY_volunteers: "[THIS.GetAdjective]志願軍"
 GUAY_volunteers_desc: "我們可以通過派遣志願軍而不是直接介入外交事務，避免直接衝突和潛在的滅亡。也許這樣能扭轉局勢？"
 GUAY_mass_drafts: "大規模徵兵"
 GUAY_mass_drafts_desc: "很明顯，邊境的警戒不能再由一支小部隊負責了。隨著世界變得越來越不確定，我們需要準備好守衛我們的天賜疆域。"
 PAR_mass_drafts: "$GUAY_mass_drafts$"
 PAR_mass_drafts_desc: "$GUAY_mass_drafts_desc$"
 GUAY_workers_rights: "工人權利"
 GUAY_workers_rights_desc: "壽命更長、更快樂的工人也會工作得更努力。為國家的健康和經濟實施工人權利是雙贏的。"
 GUAY_military_licenses: "軍事許可"
 GUAY_military_licenses_desc: "我們需要與軍事發達國家建立聯繫，獲得他們的戰爭武器許可。我們不能僅依靠國內生產。"
 one_of_the_options_tt: "其事件選項之一將產生以下效果："
 PAR_reach_out_to_european_contacts: "尋求[USA.GetAdjective]援助"
 PAR_reach_out_to_european_contacts_desc: "與我們拼湊起來的部隊相比，那些軍隊太強大了。我們需要放下驕傲，向[USA.GetName]尋求援助，並讓他們認識到一個共產主義國家出現在他們後院可不是什麼好事。"
 PAR_ban_vouchers: "禁止以代金券支付"
 PAR_ban_vouchers_desc: "我們必須停止僱主以所謂的“白色貨幣”支付工人的做法。僱主給員工的代金券作為金錢的替代品，延續了不平等並使員工產生依賴性。這種做法必須停止。"
 PAR_allow_unions_to_strike: "允許工會罷工"
 PAR_allow_unions_to_strike_desc: "強大的工會對保護工人至關重要。政府曾經削弱了工會的力量，但現在不再如此。"
 PAR_allow_women_workers: "允許女性工作"
 PAR_allow_women_workers_desc: "在災難性的三國同盟戰爭和隨後的查科戰爭之後，由於缺乏適齡男性，我們急需有效的勞動力。"
 PAR_order_italian_planes: "購買[ITA.GetAdjective]飛機"
 PAR_order_italian_planes_desc: "我們需要現代化我們的軍隊。我們將與[ITA.GetName]商洽，確保我們的空軍達到標準，避免來自鄰國的任何威脅。"
 PAR_a_call_out_for_aid: "呼籲援助"
 PAR_a_call_out_for_aid_desc: "我們將利用總統的[FRA.GetAdjective]妻子游說[FRA.GetAdjective]政府允許志願軍參與我們的戰鬥。"
 PAR_request_weapons: "向[USA.GetName]請求武器"
 PAR_request_weapons_desc: "我們現在擁有的輕型武器微不足道，無法贏得這場戰鬥。我們需要同[USA.GetName]接洽，讓他們相信他們不希望在他們的勢力範圍內出現一個共產主義政府。"
 PAR_to_cross_a_river: "渡河"
 PAR_to_cross_a_river_desc: "巴拉圭河對我們來說是一個主要的障礙，它天然地阻止了大多數越境行為。我們應該尋求一個擁有強大的海軍陸戰隊的軍事力量的幫助，以便我們能夠跨越這一天塹。"
 PAR_ask_for_bankroll: "請求資金支持"
 PAR_ask_for_bankroll_desc: "在經濟陷入困境的情況下，我們負擔不起這場戰爭。顯然，我們需要外國勢力為我們提供資金，以免整個國家陷入無政府狀態。"
 PAR_assasinate_rafael_franco: "刺殺拉斐爾·佛朗哥"
 PAR_assasinate_rafael_franco_desc: "如果我們能割斷蛇頭，可能會大大降低敵人的士氣。我們將與查科地區的當地異見分子聯繫，為他們提供完成此事的工具。"
 PAR_goad_bolivia: "煽動玻利維亞"
 PAR_goad_bolivia_desc: "如果我們能讓玻利維亞捲入衝突，將使叛軍變得更加虛弱。雖然有風險，但我們會發布一份假電報，暗示佛朗哥在內戰結束後有意擴張到玻利維亞，以此有望激怒[BOL.GetAdjective]政府介入。"
 PAR_revenge_for_the_chaco_war: "為查科戰爭復仇"
 PAR_revenge_for_the_chaco_war_desc: "[BOL.GetName]仍在覬覦查科地區，他們再次聲索這片土地只是時間問題。我們需要主動出擊，先發制人。"
 PAR_access_the_sea: "通往大海"
 PAR_access_the_sea_desc: "我們的國家從未擁有過出海口，但顯然，這是任何一個偉大的國家為了國家安全的必需。我們要不惜一切代價獲得一個。"
 PAR_by_all_means_which_to_win: "竭盡所能贏得勝利"
 PAR_by_all_means_which_to_win_desc: "在戰爭結束之前，我們需要整個經濟集中於當前的衝突。人民將因此而受苦，但如果我們輸了戰爭，在共產主義的枷鎖下，他們會更糟……"
 PAR_military_pensions: "軍人撫卹金"
 PAR_military_pensions_desc: "舊政府拒絕為查科戰爭的退伍軍人發放軍人撫卹金。我們不會犯同樣的錯誤。"
 PAR_rebuild_humaita: "重建烏邁塔"
 PAR_rebuild_humaita_desc: "烏邁塔堡在巴拉圭戰爭期間被夷為平地，但它曾是抵禦任何南部襲擊的堡壘。我們將再次重建這座強大的堡壘，作為我們堅忍不拔的象徵，也作為我們對敵人的唾棄。"
 PAR_a_great_charter: "偉大憲章"
 PAR_a_great_charter_desc: "我們的憲法需要被廢除，需要起草一部新的偉大憲章。為這個國家開啟一個新的未來！"
 PAR_pull_back_troops_from_the_chaco: "從查科撤回部隊"
 PAR_pull_back_troops_from_the_chaco_desc: "我們在查科駐紮的部隊必須撤回，以免加劇與[BOL.GetName]的緊張關係，儘管軍方會有所不滿。"
 PAR_central_bank_of_paraguay: "巴拉圭共和國中央銀行"
 PAR_central_bank_of_paraguay_desc: "我們將成立一箇中央銀行，成為對外貿易的唯一渠道。"
 PAR_emergency_powers: "緊急授權"
 PAR_emergency_powers_desc: "國內外形勢的岌岌可危要求一個強大的領導者來維繫我們的團結。只有授予這位領導者迅速而果斷行動的權力，才能實現這一目標。"
 PAR_chaco_war_decoration: "查科戰爭勳章"
 PAR_chaco_war_decoration_desc: "查科戰爭的退伍軍人應得到前政府未曾給與他們的戰爭勳章。這是一個安撫軍隊的小代價。"
 PAR_invite_japanese_settlers: "邀請日本移民"
 PAR_invite_japanese_settlers_desc: "由於[BRA.GetName]停止了日本移民入境，我們有大量機會邀請他們來這裡。這些定居者將促進農業和整體經濟的發展。"
 PAR_suspend_elections: "推遲選舉"
 PAR_suspend_elections_desc: "在當前形勢下，必須推遲選舉。政府中自由派部長的辭職使幾乎沒有人反對我們了。"
 PAR_discipline_hierarchy_and_order: "紀律、等級和秩序"
 PAR_discipline_hierarchy_and_order_desc: "取消選舉後，我們將宣佈新的“紀律、等級和秩序”政策。這是一套管理我們國家的原則，並且傳播顛覆性思想的人將受到監禁。"
 PAR_get_rid_of_colonel_peredes: "解除帕雷德斯上校的職權"
 PAR_get_rid_of_colonel_peredes_desc: "內政部長帕雷德斯由於其影響力可能成為潛在競爭對手。我們將把他撤職，以加強我們的權威。"
 PAR_ban_the_liberal_party: "取締自由黨"
 PAR_ban_the_liberal_party_desc: "自由黨正在與玻利維亞人密謀。流放他們的領導人是唯一合適的懲罰。我們將從紅黨獲得力量。"
 PAR_ensure_army_loyalty: "確保軍隊的忠誠"
 PAR_ensure_army_loyalty_desc: "異議不斷增長，人民進行廣泛的抵抗和大規模罷工。為了避免面臨與我們的前任相同的政變，軍隊將獲得我國國內生產總值的大部分。"
 PAR_fedrerista_land_reforms: "二月土地改革"
 PAR_fedrerista_land_reforms_desc: "我們需要進行嚴格的土地改革，以賦予農民權力，並將土地從強大的地主手中重新分配。"
 PAR_align_with_the_guion_rojo: "與紅黨結盟"
 PAR_align_with_the_guion_rojo_desc: "我們需要將紅黨的準軍事組織及其領導人胡安·納塔利西奧·岡薩雷斯納入我們的麾下。我們將利用他們來威脅和騷擾我們的政治對手。"
 PAR_nazify_the_army: "納粹化軍隊"
 PAR_nazify_the_army_desc: "納粹符號已在軍隊中迅速傳播。不接受甚至鼓勵這一點將激怒軍隊。我們可以利用這一點來加強與[GER.GetName]的關係，同時培養更強大的軍事身份。"
 PAR_radicalize_the_police: "激進化警察"
 PAR_radicalize_the_police_desc: "警察在維持內部秩序方面至關重要，而軍隊則專注於外部威脅，但警察可以成為支持國家的更大工具。我們將為他們提供更多資源，作為回報，將他們納入政府的掌控之中。如果軍隊或警察變得過於強大，我們總是可以讓他們互相對抗。"
 PAR_neuter_the_guion_rojo: "削弱紅黨"
 PAR_neuter_the_guion_rojo_desc: "紅黨的激進準軍事組織紅旗對政府構成安全威脅，是我們身邊持續的痛點。我們需要在他們爆發全面衝突之前壓制並解除他們的武裝。"
 PAR_get_rid_of_obsolete_guns: "淘汰陳舊槍支"
 PAR_get_rid_of_obsolete_guns_desc: "我們軍隊的武器裝備陳舊。我們需要通過淘汰阻礙我們的廢舊金屬來實現現代化，並更新我們的儲備。"
 PAR_liga_nacional_independiente: "獨立國家聯盟"
 PAR_liga_nacional_independiente_desc: "為了進一步推進我們領導人的議程，我們將加強進步組織獨立國家聯盟，並抓捕異見人士，以加強政府的合法性。"
 PAR_union_nacional_revolucionaria: "二月革命黨"
 PAR_union_nacional_revolucionaria_desc: "我們的新政黨將成為國內唯一合法的黨派。一個全新的革命國家聯盟，國家的權力和機構源於黨的領導。"
 PAR_accept_american_loans: "接受美國貸款"
 PAR_accept_american_loans_desc: "美國人正在向我們施壓，以免我們加入軸心國，並願意大力投資我們的國家，以防我們靠近他們的對手。"
 PAR_agricultural_technical_assistence: "農業和醫療技術援助"
 PAR_agricultural_technical_assistence_desc: "美國人願意為我們提供農業和醫療技術現代化，只要我們推遲任何威脅他們利益的計劃。"
 PAR_put_estigarribia_on_a_pedestal: "將埃斯蒂加里比亞捧為英雄"
 PAR_put_estigarribia_on_a_pedestal_desc: "何塞·費利克斯·埃斯蒂加里比亞被廣泛視為查科戰爭和現在贏得內戰的英雄。我們將利用他進行宣傳，以降低內戰的動盪、團結國家、獎勵他的效忠。"
 PAR_purge_the_military_of_dissent: "清洗軍隊中的異見分子"
 PAR_purge_the_military_of_dissent_desc: "埃斯蒂加里比亞已同意清除軍隊中任何殘餘的異見，並清除與佛朗哥革命的聯繫。"
 PAR_aftermath_of_the_coup: "內戰的餘波"
 PAR_aftermath_of_the_coup_desc: "經歷了連續的打擊後，我們的國家已經遭受了嚴重破壞。三國同盟戰爭、查科衝突，現在又是第二次內戰，使我們的土地遭受了破壞，但除了堅持不懈我們能做什麼呢？今天開始偉大的重建工作，和平與正義！為了巴拉圭！"
 PAR_soliders_for_prisoners: "囚犯充軍"
 PAR_soliders_for_prisoners_desc: "內戰後，我們的軍隊人手不足，使我們的國家處於脆弱狀態。隨著[BOL.GetName]等待機會奪回查科地區，我們迫切需要大量人員作為支撐。我們將赦免同意加入軍隊的囚犯，並加強我們的力量，直到能夠組建一支真正的軍隊。"
 PAR_brazilian_road_finance: "[BRA.GetAdjective]道路融資"
 PAR_brazilian_road_finance_desc: "[USA.GetName]已說服[BRA.GetAdjective]政府投資擴建我們的道路基礎設施"
 par_has_accepted_american_funds: "已接受@USA 美國資金"
 par_has_accepted_american_funds_tt: "將接受@USA§Y[USA.GetAdjective]§!資金，以防止加入其他陣營為期§Y210天§!"
 PAR_join_the_allies: "加入同盟國"
 PAR_join_the_allies_desc: "[USA.GetName]一直在向我們施壓，要求我們加入同盟國，我們看不到有任何不會導致重大禁運的其他選擇。"
 PAR_join_the_axis: "加入軸心國"
 PAR_join_the_axis_desc: "很明顯，我們的意識形態盟友是[GER.GetAdjective]及其盟友。我們將加入軸心國，共享這個新的世界秩序。"
 PAR_join_the_cominterm: "加入共產國際"
 PAR_join_the_cominterm_desc: "軸心國或同盟國都不符合我們的意識形態，比起其他兩大邪惡組織，[SOV.GetName]顯然是更好的選擇。"
 PAR_mythologize_the_father_of_the_nation: "$GUAY_mythologize_the_father_of_the_nation$"
 PAR_mythologize_the_father_of_the_nation_desc: "$GUAY_mythologize_the_father_of_the_nation_desc$"
 PAR_cult_of_personality: "$GUAY_cult_of_personality$"
 PAR_cult_of_personality_desc: "$GUAY_cult_of_personality_desc$"
 PAR_nationalize_foreign_owned_companies: "$GUAY_nationalize_foreign_owned_companies$"
 PAR_nationalize_foreign_owned_companies_desc: "$GUAY_nationalize_foreign_owned_companies_desc$"
 PAR_adopt_minority_languages: "$GUAY_adopt_minority_languages$"
 PAR_adopt_minority_languages_desc: "$GUAY_adopt_minority_languages_desc$"
 PAR_free_seconday_schools: "$GUAY_free_seconday_schools$"
 PAR_free_seconday_schools_desc: "$GUAY_free_seconday_schools_desc$"
 PAR_the_permanent_leader: "$GUAY_the_permanent_leader$"
 PAR_the_permanent_leader_desc: "$GUAY_the_permanent_leader_desc$"
 PAR_specialized_terrain_training: "$GUAY_specialized_terrain_training$"
 PAR_specialized_terrain_training_desc: "$GUAY_specialized_terrain_training_desc$"
 PAR_urbanization: "$GUAY_urbanization$"
 PAR_urbanization_desc: "$GUAY_urbanization_desc$"
 idea_PAR_emergency_powers: "國家實施緊急權力"
 idea_PAR_emergency_powers_desc: "國家實施了一項緊急法案，允許政府打擊反對派並行使更大的對外政治權力。"
 URG_terras_dictatorship: "特拉的獨裁"
 URG_terras_dictatorship_desc: "加布裡埃爾·特拉在兩年前的自行政變中奪取了國家的大部分控制權，但我們仍然需要進一步鞏固對政府機構的控制。"
 URG_prohibition_of_usury: "禁止高利貸"
 URG_prohibition_of_usury_desc: "我們不能再允許放貸人發放對放貸人過於有利的貸款。需要制定高利貸法，以防止此類行為。"
 URG_womens_vote: "婦女投票權"
 URG_womens_vote_desc: "任何希望進入新世紀的國家都需要承認婦女的權利以及性別平等。"
 URG_break_relations_with_the_ussr: "與[SOV.GetName]斷交"
 URG_break_relations_with_the_ussr_desc: "[SOV.GetName]是一個違背自然的構造。很明顯，如果未來的世界秩序存在，它只能與中歐和[USA.GetName]有關，而我們看不出維持與一個賤民國家的關係的任何理由。"
 URG_pay_of_all_external_debts: "償還所有外債"
 URG_pay_of_all_external_debts_desc: "我們仍然欠著一些國家的外債，在當前形勢下，一個國家不宜有未償付的債務。"
 URG_import_substitution: "替代進口"
 URG_import_substitution_desc: "我國現代經濟應以進口替代的比利時模式為基礎，建設現代經濟。"
 URG_la_teja_refinery: "拉特哈煉油廠"
 URG_la_teja_refinery_desc: "建立現代煉油廠將使我們能夠在世界舞臺上更具競爭力，並使我們的經濟多樣化。"
 URG_revaluation_law: "重新估值法"
 URG_revaluation_law_desc: "1935年的重新估值法中關於發行部門將壟斷所有銀行活動的部分需要進一步擴展。"
 URG_brou: "東烏拉圭共和國銀行"
 URG_brou_desc: "東烏拉圭共和國銀行需要承擔額外的職責，並設立貨幣基金來清算我們的外債。"
 URG_right_to_food_housing_and_health: "食物權、住房權和健康權"
 URG_right_to_food_housing_and_health_desc: "我們將把食物、住房和健康的權利作為憲法中的關鍵基石，併為最貧困的公民提供支持。"
 URG_conaprole: "全國牛奶生產者合作社"
 URG_conaprole_desc: "牛奶很好，營養豐富、供應充足，我們是開發牛奶的主要國家。國家牛奶生產者合作社將擁有乳製品及其相關基礎設施的壟斷權，促進國家增長。"
 URG_ministry_of_public_works: "公共工程部援助"
 URG_ministry_of_public_works_desc: "為了推動我國的工業化，我們將通過公共工程部制定大規模的道路和工人住房計劃。"
 URG_rapid_industrialization: "快速工業化"
 URG_rapid_industrialization_desc: "一切都已準備就緒，我們的國家將進入一個新時代。我們將踏上快速工業化的征程，把我國真正帶進20世紀。"
 URG_pluna: "普盧納"
 URG_pluna_desc: "普盧納是一家新興的提供貨運和包租服務的航空公司。投資該公司可以將我們的航空業帶入現代。"
 URG_mercado_modelo: "模範市場"
 URG_mercado_modelo_desc: "是時候拋下舊農業市場，開創國家最大的農業市場模範市場了。"
 URG_tour_to_italy: "[ITA.GetName]訪問之旅"
 URG_tour_to_italy_desc: "我們的領導人將前往[ITA.GetName]訪問，以加強我們兩國之間的經濟聯繫。"
 URG_recognize_francoist_spain: "承認佛朗哥統治的西班牙"
 URG_recognize_francoist_spain_desc: "很明顯，弗朗哥統治下的西班牙是合法的西班牙國家。我們將立即承認它是真正的西班牙。"
 URG_rincon_del_bonete_hydroelectric_power_station: "盆角水電站"
 URG_rincon_del_bonete_hydroelectric_power_station_desc: "電氣化是我國實現現代化的關鍵。[GER.GetAdjective]願意資助此類項目的建設，以加強我們之間的聯繫。"
 URG_allow_nazi_movements_among_german_uruguayan: "[GER.GetAdjective]裔[URG.GetAdjective]人的納粹運動"
 URG_allow_nazi_movements_among_german_uruguayan_desc: "國內有一小部分[GER.GetAdjective]裔[URG.GetAdjective]人支持納粹運動，無疑受到他們祖國外交政策的影響。儘管有人呼籲禁止這種言論，但它可以用來進一步推廣我們的議程。"
 URG_merge_falangist_movements: "合併長槍運動"
 URG_merge_falangist_movements_desc: "除了由阿道弗·阿戈里奧領導的烏拉圭修正主義運動外，長槍運動是該國最受歡迎的威權主義運動，但他們分裂為幾個團體。我們將把他們聚集在一起，使其成為一個比他們單獨行動更大的運動。"
 URG_accion_revisionista_del_uruguay: "烏拉圭修正主義行動"
 URG_accion_revisionista_del_uruguay_desc: "阿道弗·阿戈里奧是烏拉圭法西斯主義的主要人物之一。他和他的同類的影響可能成為一個跳板，一個更大的運動將席捲[URG.GetName]。我們將邀請他們進入政府，給予他們適當的合法性。"
 URG_force_through_corporatism: "強行推行社團主義"
 URG_force_through_corporatism_desc: "政府曾經試圖強行推行社團主義，但當時受到政客們的堅決反對，這一想法被擱置了。今天不會有任何妥協，我們將不惜一切代價推動這項立法。"
 URG_establish_the_german_uruguayan_cultural_center: "賦權富爾曼文化中心"
 URG_establish_the_german_uruguayan_cultural_center_desc: "[GER.GetAdjective]裔[URG.GetAdjective]人文化中心由阿努爾夫·富爾曼設立，旨在國內傳播親納粹宣傳，自軸心國崛起以來影響力只增不減。儘管政府試圖打壓這一運動，我們將資助這一事業，賄賂相應人士以保持它不受外界影響。"
 URG_the_fuhrmann_plan: "富爾曼計劃"
 URG_the_fuhrmann_plan_desc: "阿努爾夫·富爾曼建議[URG.GetName]成為[GER.GetName]的殖民地，充當軸心國在南美洲的跳板。也許不是作為殖民地，而是作為軸心國南美洲的管家？"
 URG_the_american_springboard: "美洲跳板"
 URG_the_american_springboard_desc: "權力得到鞏固，並且有了強大的支持者，我們已準備好開始征服我們的鄰居。"
 URG_food_for_the_warmachine: "戰爭機器之糧"
 URG_food_for_the_warmachine_desc: "隨著大部分農業用地處於我們的控制下，我們可以開始向盟友運送糧食，進一步增強我們的力量。"
 URG_colorado_victory: "紅黨選舉勝出"
 URG_colorado_victory_desc: "毫無疑問，紅黨會繼續統治[URG.GetName]"
 URG_terra_election: "1938年選舉已發生"
 URG_blanco_victory: "白黨選舉勝出"
 URG_blanco_victory_desc: "一場可能是由加布裡埃爾·特拉獨裁政權引發的騷動，導致選民與紅黨疏遠，使白黨掌握權力"
 URG_declare_neutrality: "宣告中立"
 URG_declare_neutrality_desc: "我們沒必要插手歐洲事務。"
 URG_legalize_the_pool: "合法化賭池"
 URG_legalize_the_pool_desc: "合法化賭池將增加國家收入，同時也受到大眾的歡迎。"
 URG_break_diplomatic_relations_with_the_axis: "斷絕與軸心國的外交關係"
 URG_break_diplomatic_relations_with_the_axis_desc: "儘管我們宣佈了中立，但很明顯，邪惡的軸心國已不能再被容忍。戰爭的風向非常有利於同盟國，我們不應站在失敗的一方。"
 URG_join_the_allies: "加入同盟國"
 URG_join_the_allies_desc: "在受到[USA.GetName]的壓力後，很明顯我們不能再置身事外了。我們現在僅能做的一點事就是投入戰鬥。"
 URG_a_new_constitution: "新憲法"
 URG_a_new_constitution_desc: "現行憲法已經不切實際。我們需要一部新憲法來推動國家進入新時代。"
 URG_the_good_coup: "“好”政變"
 URG_the_good_coup_desc: "憲法遇到了激烈的抵制。如果我們要把烏拉圭帶到未來，就不能在毫無意義的政治上磨蹭。正如特拉之前做的那樣，我們將進行自我政變，但沒有大規模逮捕和暴力，我們會在不流血不迫害的情況下進行。"
 URG_law_no_9914: "9914號法律"
 URG_law_no_9914_desc: "[FIN.GetName]遭受[SOV.GetNameDef]的襲擊，政府批准了9914號法案，允許將比索用於援助芬蘭。我們已經籌集了羊毛和10,600,000克罐裝牛肉，每罐上都寫著“來自烏拉圭人民對芬蘭英勇軍隊的支持”。"
 URG_investigate_german_and_italian_cultural_organization: "調查德國和意大利組織"
 URG_investigate_german_and_italian_cultural_organization_desc: "與意大利和德國有關的文化和體育組織涉嫌窩藏法西斯同情者。我們需要密切關注並調查他們是否有任何不當行為。"
 URG_american_air_bases: "美國空軍基地"
 URG_american_air_bases_desc: "美國正向我們施壓，希望我們允許他們在我國領土建立空軍基地。這肯定會有助於保護我國免受軸心國的任何威脅"
 URG_law_no_9943: "9943號法令"
 URG_law_no_9943_desc: "儘管我們保持中立，但很明顯，世界正迅速陷入不確定性。我們需要準備好部隊，並在全國範圍內徵兵以保衛我們的邊境。"
 URG_herrerismo: "埃雷拉主義"
 URG_herrerismo_desc: "我們領袖創造了埃雷拉主義，融合了民族主義、保守主義和平民主義。他希望以此建立強大的政治基礎。"
 URG_traditionalism: "傳統主義"
 URG_traditionalism_desc: "迴歸傳統就是走向未來。以前管用的東西現在也管用。"
 URG_ruralism: "鄉村主義"
 URG_ruralism_desc: "我們的選民基礎在國家的農村地區，我們必須在這裡進行大量投資。"
 URG_americanism: "美洲主義"
 URG_americanism_desc: "我們需要確保我們的國家重點符合南美價值觀，並在外交事務中保護它們。"
 URG_anti_imperialism: "反帝國主義"
 URG_anti_imperialism_desc: "我們需要旗幟鮮明地反對帝國主義和外國勢力對南美的侵佔。"
 URG_anticentralism: "反集權主義"
 URG_anticentralism_desc: "很明顯，將國家集中在蒙得維的亞周圍是不合理的。更好的做法是維持農村階層和城市人口的價值觀，以便所有人都能共同繁榮。"
 URG_legacy_of_batlle: "巴特列的遺產"
 URG_legacy_of_batlle_desc: "無論未來如何，很明顯，紅黨永遠與何塞·巴特列·奧爾多涅斯的遺產息息相關。我們將永遠接受其普遍社會公正的理念。"
 URG_statism: "國家主義"
 URG_statism_desc: "在這個時代，必須有一個明確而強大的國家，集中控制社會和經濟事務。"


