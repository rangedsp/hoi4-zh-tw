l_simp_chinese:
 SMB_army_default: "武裝陸軍"
 SMB_army_default_desc: "儘管我們的武裝力量不容小覷，但仍然比預期的要弱。為士兵配備更現代化的武器以及訓練他們隨時做好戰鬥準備是至關重要的。"
 SMB_military_facilities_default: "擴建軍工設施"
 SMB_military_facilities_default_desc: "為了適應武裝軍隊的需要，我們必須擴大武器產業。因此，必須建立專門用於生產軍事裝備的新工業設施。"
 SMB_department_of_propaganda_default: "宣傳部"
 SMB_department_of_propaganda_default_desc: "世界風雲變幻，儘管我們付出了最大的努力，但並不是我們所有的平民都支持參與戰爭。因此，我們必須成立一個部門，致力於說服人們參與國際武裝鬥爭的好處。"
 SMB_logistics_department_default: "成立後勤部"
 SMB_logistics_department_default_desc: "也許對於我們來說南美是家園，但對於現役部隊來說，它仍然是一片殘酷無情的大陸。為了緩解這個問題，成立一個專門負責物流管理和分配的武裝力量部門將是有益的。"
 SMB_support_company_default: "支援連的重要性"
 SMB_support_company_bra: "叢林先鋒訓練"
 SMB_jungle_pioneers: "$SMB_support_company_bra$"
 SMB_jungle_pioneers_desc: "$SMB_support_company_default_desc$"
 SMB_jungle_pioneers_tt: "解鎖§Y叢林先鋒§!支援營：\n §Y叢林§!：\n 移動：§G+30%§!\n 攻擊：§G+10%§!\n 防禦：§G+20%§!"
 SMB_support_company_default_desc: "與我們最近成立的後勤部門隨之而來的是一系列新發現的問題。首先，為了維持物資的流動，需要製造足夠數量的合適的設備和物資，而我們目前的材料還不夠。如果我們想趕上競爭對手，就必須使我們的輔助裝備現代化。"
 SMB_department_of_military_intelligence_default: "軍事情報部"
 SMB_department_of_military_intelligence_default_desc: "雖然這兩個詞可能在意思上相互矛盾，但關鍵是要明白，如果不準確瞭解敵人的立場和動機，就很難在正面戰鬥中擊敗他們。因此，必須為軍隊設立軍事情報部門。"
 SMB_motorized_default: "投資汽車產業"
 SMB_motorized_default_desc: "未來的戰爭需要快速移動的車輛包圍並摧毀敵人且不給他們足夠的反應時間；不需要的是16或17世紀的步兵火力線，那種策略不必要地浪費時間和人力，效果還不明顯。"
 SMB_tank_warfare_default_CHL: "巴塔哥尼亞戰爭"
 SMB_tank_warfare_default: "坦克戰"
 SMB_tank_warfare_default_desc: "對機動部隊最好的補充是由強大的金屬巨獸組成的單位，它們的火力幾乎可以壓制任何敵人。唯一的問題是，我們的坦克生產的側重點應該放在德式閃電戰戰略，還是應該作為步兵的支援？"
 SMB_tank_warfare_tt: "解鎖§Y特化§!我國裝甲項目的決議"
 SMB_domestic_production_default: "專注國內生產"
 SMB_domestic_production_default_desc: "雖然這無疑會增加困難和耗時，但在我們自己的國內開發和生產坦克更有利，這可以確保產品的質量，還能避免我們的武器交付在到達之前被盜的風險。"
 SMB_mechanized_troops_default: "部隊機械化"
 SMB_mechanized_troops_default_desc: "為了推進我軍的發展，並適應未來戰爭的要求，我們應大力推進普通步兵的機械化，使他們和坦克部隊一道，能在安全的裝甲中肆虐戰場。"
 SMB_army_academy_default: "擴建陸軍學院"
 SMB_army_academy_default_desc: "擁有有效的武器並不是決定戰鬥勝負的唯一因素。另一個重要因素是單兵的技能，再加上將軍指揮部隊的技能。為了達到這個目的，我們應該投資於擴張我們軍校陸軍部的業務。"
 SMB_regular_infantry_default: "普通士兵的力量"
 SMB_regular_infantry_default_desc: "雖然裝備比什麼都重要，但捍衛祖國、捍衛核心價值觀、為親人而戰的單兵才是軍隊的真正力量。這就是為什麼我們必須最大限度地提高普通士兵的士氣，讓他們有最好的機會贏得最艱難的戰鬥。"
 SMB_artillery_CHL: "利用硝酸鹽生產"
 SMB_artillery_default: "特化重炮產業"
 SMB_artillery_default_desc: "我們的經濟不如英、法、意等大國強大。因此，如果我們想要更強大、更好的裝備，我們就需要特化重炮生產，儘管我們希望有足夠的錢來購買所有我們想要的裝備。"
 SMB_foreign_designs_default: "獲取外國設計"
 SMB_foreign_designs_default_desc: "即使我們希望我們有科學家和工程師來製造我們自己的裝甲，最好還是利用我們擁有的關係在國際市場上為自己達成一些優質的交易，因為這是目前獲得特化裝備的唯一真實可行的選擇。"
 SMB_foreign_advisors_default: "外國顧問"
 SMB_foreign_advisors_default_desc: "雖然[ROOT.GetAdj]軍事教官很不錯，但他們並不像那些參加過多次衝突並接受過其他國家最高聲望的軍事學院培訓的人那樣優秀。因此，我們應該努力吸引境外各國的專長領域的軍事顧問來幫助培訓我們的軍隊，以進一步加強我們的武裝力量。"
 SMB_army_professionalism_CHL: "軍隊普魯士化"
 SMB_army_professionalism_default: "進一步提高軍隊職業化水平"
 SMB_army_professionalism_default_desc: "儘管讓儘可能多的士兵待命等待參軍可能是一種好的做法，但根據我們的外國軍事顧問的說法，確保軍隊在任何時候都處於最佳狀態要重要得多。"
 SMB_conscription_default: "增加徵兵"
 SMB_conscription_default_desc: "儘管我們的士兵的專業性可能會受到質疑，但毫無疑問，我們的軍隊當前迫切需要的是更多的士兵填補隊伍，因為我們正為缺乏自願加入我們軍隊的人而苦惱。"
 SMB_conscription_CHL: "世界大戰的教訓"
 SMB_experimental_weapons_department_default: "實驗武器部"
 SMB_experimental_weapons_department_default_desc: "如果我們不希望在技術部門落後於我們的競爭對手，那麼我們最好開始研究相應理論並嘗試開發所謂的奇蹟武器，以免在戰場上被打敗。"
 SMB_nuclear_program_default: "國內核研究項目"
 SMB_nuclear_program_default_desc: "美國人和德國人正在努力揭開原子的秘密，我們不能讓自己落在他們後面。儘管他們是為了戰爭而研究，但我們的科學家也提到了利用原子分裂來改善平民生活的方法。"
 SMB_nuclear_program_key_BRA: "平行核計劃"
 SMB_special_forces_default: "特種部隊計劃"
 SMB_special_forces_default_desc: "我們的軍隊雖然規模小，但可以通過特訓讓士兵擅長某些情況和戰鬥類型，從而大大加強我們的軍隊。因此，建立培訓和收容這類士兵的項目應該被視為我們的首要任務。"
 SMB_special_forces_option_1_default: "強化山地部隊"
 SMB_special_forces_option_1_default_desc: "軍隊中的山地部隊應該受到我們上級命令的特別關注，因為他們所能做到的壯舉對於我們的一般士兵來說只能夢裡想想。他們能夠在危險的安第斯山脈進行戰鬥，並在向前推進時支援我們的常規部隊。"
 SMB_special_forces_option_2_default: "強大的海軍陸戰隊"
 SMB_special_forces_option_2_default_desc: "海軍是我們目前的優勢之一，如果能利用這一事實，讓他們擁有由訓練有素、戰鬥力極強的海軍陸戰隊組成的自己的軍隊，將會更加有利。"
 SMB_special_forces_option_2_CHL_desc: "[ROOT.GetNameDefCap]擁有悠久的海軍步兵傳統，但自太平洋戰爭結束以來，它們已經被削減為沿岸炮兵部隊。通過將這些部隊轉變為裝備完善、適合遠征作戰的海軍陸戰隊，[ROOT.GetNameDef]將能夠像19世紀那樣再次向海外投射力量。"
 SMB_special_forces_option_3_default: "擴大空軍部門"
 SMB_special_forces_option_3_default_desc: "空軍是我們目前的優勢之一，如果能利用這一事實，讓他們擁有經過專門訓練、戰鬥力極強的空降兵，將會更加有利。"
 SMB_special_forces_option_1_continuation_default: "遊騎兵訓練計劃"
 SMB_special_forces_option_1_continuation_default_desc: "為了支援我們的山地部隊，我們應該僱用遊騎兵，這些士兵不僅在山地區域受過專門訓練，而且還在南美洲的森林和叢林中戰鬥過。"
 SMB_special_forces_option_2_continuation_default: "加強海軍陸戰隊"
 SMB_special_forces_option_2_continuation_default_desc: "為了讓我們的海軍陸戰隊充分發揮作用，我們應該考慮開發支持他們的技術，例如登陸車輛和更好的補給分配技術，以支援他們的海岸登陸作戰。"
 SMB_special_forces_option_3_continuation_default: "空投補給與裝備"
 SMB_special_forces_option_3_continuation_default_desc: "為了讓我們的傘兵在執行跳傘任務時有最高的成功機會，我們應該考慮開發有助於提高他們生存能力的技術，無論是可空頭的裝甲車還是帶偽裝的補給箱。"
 SMB_air_defense_default: "防空"
 SMB_air_defense_default_desc: "既然我們的對手已經露出了真面目，並開始開發自己的空中武器，我們必須做好應對的準備。因此，我們應該從下令快速建造並部署防空陣地和防空火炮開始準備。"
 SMB_air_force_default: "武裝空軍"
 SMB_air_force_default_desc: "許多理論家會認為，我們目前最落後的領域是現代化空軍的發展。因此，我們必須建設新的機庫和設施並培訓更多的飛行員，努力彌補這一缺陷。"
 SMB_air_academy_default: "建立正規空軍學院"
 SMB_air_academy_default_desc: "不僅僅是那些將在地面部隊作戰的士兵需要接受適當的教育。我們的飛行員雖然充滿熱情，但缺乏在空戰中取勝所需的專業訓練。為了解決這個問題，我們應該擴建軍事學院，增加符合空軍要求的課程。"
 SMB_construct_air_bases_default: "建設新空軍基地"
 SMB_construct_air_bases_default_desc: "除了需要專業、受過良好教育和積極進取的飛行員外，我們還缺乏大型空軍所需的另一項關鍵功能——機場。雖然我們有一些機場，但如果我們希望將空軍擴大到具有競爭力的水平，僅憑它們是遠遠不夠的。"
 SMB_domestic_designs_default: "本國設計"
 SMB_domestic_designs_default_desc: "我們最好自行創造和生產我們自己的模型和飛機設計，因為其他國家設計或生產號稱適合我們飛行員的飛機是不值得信賴的。"
 SMB_license_designs_default: "外國設計許可"
 SMB_license_designs_default_desc: "研究和開發我們自己設計的飛機需要花費太多的時間和精力。這就是為什麼我們應該獲得外國裝備的生產許可，而不是執拗於在[ROOT.GetNameDef]國內的生產。"
 SMB_purchase_aircraft_default: "購買外國飛機"
 SMB_purchase_aircraft_default_desc: "我們的空軍已經決定，不僅要開發，還要生產我們自己的飛機，這將是非常昂貴和耗時的。相反，他們主張購買外國裝備，我們也應該採納這種立場。"
 SMB_establish_aircraft_industry_default: "國內飛機產業"
 SMB_establish_aircraft_industry_BRA: "巴西航空公司"
 SMB_establish_aircraft_industry_default_desc: "很明顯，如果我們希望保持我們的生產效率儘可能高，我們必須在我們自己的境內大規模建設飛機產業。"
 SMB_flying_fortress_default: "飛行堡壘"
 SMB_flying_fortress_default_desc: "正確利用空軍的唯一方法是用它轟炸敵人，使他們屈服，直到在地平線前一無所有。因此，我們應該建造大型飛機，讓它們能夠攜帶我們所需要的儘可能多的炸藥。"
 SMB_tactical_air_force_default: "戰術空軍"
 SMB_tactical_air_force_default_desc: "空軍不僅要用來支援地面部隊，還要執行許多地面部隊無法單獨完成的更復雜的任務。這才是造就一支偉大空軍的真正精髓。"
 SMB_nimble_air_force_default: "靈活空軍"
 SMB_nimble_air_force_default_desc: "戰機不僅要能戰勝敵機，還要能勝過他們的防空炮和海軍艦艇的虎視眈眈。空軍應該由小型飛機組成，適合以足夠有效的方式進行空中纏鬥和戰術打擊，同時永遠不要變得過於沉重而無法快速果斷地機動。"
 SMB_strategic_bombing_default: "專注戰略轟炸"
 SMB_strategic_bombing_default_desc: "要贏得一場戰爭，不僅要在戰鬥中打敗敵人，還要削弱其經濟和工業能力。這就是為什麼戰略轟炸應該被視為我們在戰爭中的首要目標。"
 SMB_army_support_default: "陸軍支援"
 SMB_army_support_default_desc: "如果受到空中打擊，陸軍是無法取勝的。這就是為什麼不僅要用我們的空軍來保護他們，我們的戰機也應該對我們的對手做同樣的事情。"
 SMB_winning_the_air_war_default: "贏得空戰"
 SMB_winning_the_air_war_default_desc: "雖然地面支援和海上轟炸都被認為是重要的，但非常有必要認識到，如果沒有制空權，這些行動都毫無價值。因此，我們的空軍應該儘可能地控制天空。"
 SMB_naval_support_default: "專注海軍支援"
 SMB_naval_support_default_desc: "我軍的飛機的首要目標是幫助我們為我們的海軍和民用艦船保障航線安全並保護他們。因此，重要的是要在設計飛機時考慮到支援海軍和巡邏的作用，並確保它們能夠避免被艦載防空炮擊落。"
 SMB_air_modifier_boost_1_default: "地面支援專精"
 SMB_air_modifier_boost_1_default_desc: "確保步兵總能到達他們要去的地方是非常重要的，因此，集中空軍力量協助他們做到這一點也很重要，無論是通過直接空中支援，還是轟炸敵人後方。"
 SMB_air_modifier_boost_2_default: "研發先進機身"
 SMB_air_modifier_boost_2_default_desc: "如果我們希望我們的飛機在與敵人的交火中倖存下來，重要的是它們不僅能夠儘可能避免中彈，同時還能夠在一到兩次中彈後倖存下來，並且能夠飛到所需的最遠的地方去接受修理。這就是為什麼我們應該為我們的飛機開發更好的機身和引擎，以便飛行員在任何情況下都能安全。"
 SMB_air_doctrine_default: "理論進步"
 SMB_air_doctrine_default_desc: "重要的是要注意，如果缺乏正確的戰略，即使是最偉大的飛行員和飛機也無法在戰鬥中獲勝。戰爭就是計劃、戰略並充分利用國內所有個人的力量。因此，我們應該大力發展可供空軍實踐的新理論。"
 SMB_aircraft_carriers_default: "航空母艦"
 SMB_joint_operative_command_default: "聯合作戰司令部"
 SMB_joint_operative_command_default_desc: "現在我們不僅發展了我們的陸軍，而且也為我們的空軍奠定了良好的基礎，現在是建立這些不同軍種之間的協調與合作的時候了。因此，我們將建立一個聯合作戰司令部，由從兩個軍種中選出的指揮官組成。"
 SMB_war_planning_office_default: "作戰計劃處"
 SMB_war_planning_office_default_desc: "我們現在還需要確保我們的軍隊能夠接受正確的、經過深思熟慮的計劃和命令，以免在信息戰中落後，那樣可能會得到過時的情報導致我軍被伏擊和摧毀。因此，我們應該成立一個作戰計劃處，以便更好地協調這些工作。"
 SMB_women_in_aviation_default: "空軍中的女性"
 SMB_women_in_aviation_default_desc: "儘管並非總是受到這樣的對待，但女性在社會中一直扮演著重要的角色，現在是時候讓她們挺身而出，完成以前被視為只有男性才能完成的任務，比如生產和駕駛我們國家的飛機。"
 SMB_navy_default: "海軍"
 SMB_naval_academy_default: "加強海軍學院建設"
 SMB_construct_naval_bases_default: "建設新海軍基地"
 SMB_naval_foreign_advisors_default: "邀請海軍顧問"
 SMB_purchase_destroyers_and_subs_default: "購買驅逐艦和潛艇"
 SMB_reescalate_the_naval_arms_race_default: "重啟海軍軍備競賽"
 SMB_blue_water_fleet_default: "藍水海軍"
 SMB_coastal_fleet_default: "沿岸船隊"
 SMB_purchase_cruisers_and_dreadnoughts_default: "購買巡洋艦和無畏艦"
 SMB_minelaying_default: "改進水雷佈設"
 SMB_escort_fleet_default: "護航艦隊"
 SMB_raiding_fleet_default: "襲擊艦隊"
 SMB_degaussing_default: "消磁"
 SMB_naval_invasion_default: "登陸作戰"
 SMB_cruiser_subs_default: "巡洋潛艇"
 SMB_midget_subs_default: "袖珍潛艇"
 SMB_expand_repair_yards_default: "擴建修理碼頭"
 SMB_enlarge_naval_facilities_default: "擴建海軍設施"
 SMB_merchant_marine_default: "強大的商船隊"
 SMB_fortification_effort_default: "重視防禦工事"
 SMB_navy_BRA: "巴西海軍"
 SMB_navy_ARG: "阿根廷海軍"
 SMB_navy_CHL: "智利海軍"
 SMB_army_BRA: "巴西陸軍"
 SMB_army_ARG: "阿根廷陸軍"
 SMB_army_CHL: "智利陸軍"
 SMB_air_force_ARG: "阿根廷空軍"
 SMB_air_force_BRA: "巴西空軍"
 SMB_air_force_CHL: "智利空軍"
 SMB_army_PAR: "巴拉圭陸軍"
 SMB_air_force_PAR: "巴拉圭空軍"
 SMB_navy_PAR: "巴拉圭海軍"
