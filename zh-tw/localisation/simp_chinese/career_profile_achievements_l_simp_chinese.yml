 #Medals
 CAREER_PROFILE_STALWART_DEFENDER_MEDAL: "不屈衛士"
 CAREER_PROFILE_STALWART_DEFENDER_MEDAL_DESCRIPTION: "成功防禦特定次數的敵軍進攻。"
 CAREER_PROFILE_SHIELD_MEDAL: "堅實盾牌"
 CAREER_PROFILE_SHIELD_MEDAL_DESCRIPTION: "使一個師達到特定的防守總加成。"
 CAREER_PROFILE_MILITARY_PLANNER_MEDAL: "運籌帷幄"
 CAREER_PROFILE_MILITARY_PLANNER_MEDAL_DESCRIPTION: "使一個師達到特定的計劃加成百分比。"
 CAREER_PROFILE_COMBAT_EFFICIENCY_MEDAL: "高效作戰"
 CAREER_PROFILE_COMBAT_EFFICIENCY_MEDAL_DESCRIPTION: "消滅特定數量的遭受“被包圍”戰鬥修正懲罰的師。"
 CAREER_PROFILE_GRAND_ENCIRCLEMENT_MEDAL: "重重包圍"
 CAREER_PROFILE_GRAND_ENCIRCLEMENT_MEDAL_DESCRIPTION: "在一個省份包圍一定數量的敵軍師。"
 CAREER_PROFILE_MILITARY_MASTERY_MEDAL: "當世軍神"
 CAREER_PROFILE_MILITARY_MASTERY_MEDAL_DESCRIPTION: "在一場戰鬥中擁有一定數量的正面戰鬥修正。"
 CAREER_PROFILE_TURNING_THE_TIDE_MEDAL: "力挽狂瀾"
 CAREER_PROFILE_TURNING_THE_TIDE_MEDAL_DESCRIPTION: "戰時在48小時內部署一定數量的師。最小師規模：5個營。"
 CAREER_PROFILE_LORD_OF_THE_SEAS_MEDAL: "七海霸主"
 CAREER_PROFILE_LORD_OF_THE_SEAS_MEDAL_DESCRIPTION: "在一定數量的海域擁有至少75%的制海權。"
 CAREER_PROFILE_VETERANCY_MEDAL: "身經百戰"
 CAREER_PROFILE_VETERANCY_MEDAL_DESCRIPTION: "在一支集團軍中擁有一定數量的老兵師。"
 CAREER_PROFILE_SKY_SUPPLIES_MEDAL: "空投補給"
 CAREER_PROFILE_SKY_SUPPLIES_MEDAL_DESCRIPTION: "讓運輸機在一片區域提供一定數量的補給。"
 CAREER_PROFILE_PARADROP_MEDAL: "傘兵天降"
 CAREER_PROFILE_PARADROP_MEDAL_DESCRIPTION: "使用一定數量的傘兵師執行一個空投戰鬥計劃。最小師規模：5個營。"
 CAREER_PROFILE_NAVAL_INVASION_MEDAL: "登陸作戰"
 CAREER_PROFILE_NAVAL_INVASION_MEDAL_DESCRIPTION: "96小時內用一定數量的師執行登陸作戰計劃。最小師規模：5個營。"
 CAREER_PROFILE_LAND_ACQUISITION_MEDAL: "攻城略地"
 CAREER_PROFILE_LAND_ACQUISITION_MEDAL_DESCRIPTION: "在48小時窗口期內通過陸戰獲得（並持有）一定數量的額外省份。"
 CAREER_PROFILE_RAINING_DEBRIS_MEDAL: "天女散花"
 CAREER_PROFILE_RAINING_DEBRIS_MEDAL_DESCRIPTION: "在48小時窗口期內擊落一定數量的敵機。"
 #Ribbons
 CAREER_PROFILE_OFFENSE_IS_THE_BEST_DEFENSE: "以攻為守"
 CAREER_PROFILE_OFFENSE_IS_THE_BEST_DEFENSE_DESCRIPTION: "在2年的週期內，參加的進攻戰鬥數是防禦戰斗數的兩倍，最少100場戰鬥。"
 CAREER_PROFILE_OFFENSE_IS_THE_BEST_DEFENSE_QUOTE: "\n“如果你身處勢均力敵的戰鬥中，那麼你之前就沒有計劃好任務。”\n\n——戴維·哈克沃斯上校"
 CAREER_PROFILE_GOING_THROUGH_NOT_AROUND: "直插而過"
 CAREER_PROFILE_GOING_THROUGH_NOT_AROUND_DESCRIPTION: "成功進攻並控制一塊有10級要塞的地區。"
 CAREER_PROFILE_GOING_THROUGH_NOT_AROUND_QUOTE: "“在100個士兵中，有10個壓根就不該上戰場，80個是活靶子。值得我們慶幸的是，還有9個真正的戰士——因為有他們在，我們還能打像樣的仗。啊，但是最後那個人，是一個可以讓所有人回家的勇士。”\n\n——《犬儒手札》"
 CAREER_PROFILE_YOU_SHALL_NOT_PASS: "此路不通"
 CAREER_PROFILE_YOU_SHALL_NOT_PASS_DESCRIPTION: "防禦性加成達到400%。"
 CAREER_PROFILE_YOU_SHALL_NOT_PASS_QUOTE: "“戰鬥不意味著你可能會陣亡——儘管那時有發生——而是讓你搞明白你能不能活下去。不要小瞧這句真理的力量。不要小瞧年輕人為了再證明一次這句真理，還願意再賭多少。”\n\n——塞巴斯蒂安·榮格爾，《戰爭》"
 CAREER_PROFILE_THOUSAND_SPLENDID_SUNS: "千日凌空"
 CAREER_PROFILE_THOUSAND_SPLENDID_SUNS_DESCRIPTION: "引爆3枚核彈，兩次引爆之間不得超過12小時。"
 CAREER_PROFILE_THOUSAND_SPLENDID_SUNS_QUOTE: "“從前，人類無法迴避個體的死亡；此後，人類無法迴避物種的滅亡。”\n\n——亞瑟·庫斯勒"
 CAREER_PROFILE_THE_GUNS_OF_AUGUST: "八月炮火"
 CAREER_PROFILE_THE_GUNS_OF_AUGUST_DESCRIPTION: "有至少15場戰鬥同時獲得列車炮轟擊支援。"
 CAREER_PROFILE_THE_GUNS_OF_AUGUST_QUOTE: "“尋不畏死者易，尋堅忍者難。”\n\n——尤利烏斯·凱撒"
 CAREER_PROFILE_LEARNING_ON_THE_JOB: "邊幹邊學"
 CAREER_PROFILE_LEARNING_ON_THE_JOB_DESCRIPTION: "有一個升級4次技能的指揮官（師指揮官除外）。"
 CAREER_PROFILE_LEARNING_ON_THE_JOB_QUOTE: "“一將功成萬骨枯。”\n\n——斐迪南·福煦"
 CAREER_PROFILE_THEY_CAME_FROM_ABOVE: "神兵天降"
 CAREER_PROFILE_THEY_CAME_FROM_ABOVE_DESCRIPTION: "執行一個有15個傘兵師的空投計劃。"
 CAREER_PROFILE_THEY_CAME_FROM_ABOVE_QUOTE: "“他們所種的是風，所收的是暴風。”\n\n——《聖經》何西阿書 8:7"
 CAREER_PROFILE_COORDINATED_INVASION: "協同登陸"
 CAREER_PROFILE_COORDINATED_INVASION_DESCRIPTION: "同時執行在4個不同登陸區的4個登陸計劃。"
 CAREER_PROFILE_COORDINATED_INVASION_QUOTE: "“戰爭需以殺戮與謀略取勝。將之愈偉者愈重於謀略，而愈輕於殺戮。”\n\n——溫斯頓·丘吉爾，《世界危機》"
 CAREER_PROFILE_NOT_SO_FAST: "還不夠快"
 CAREER_PROFILE_NOT_SO_FAST_DESCRIPTION: "擊潰一支敵方師。"
 CAREER_PROFILE_NOT_SO_FAST_QUOTE: "“如果當地語言是暴力，那你最好說的流利點。”\n\n——佚名"
 CAREER_PROFILE_TANKS_NO_THANKS: "坦克？癱殼！"
 CAREER_PROFILE_TANKS_NO_THANKS_DESCRIPTION: "擊潰一支敵方坦克師。"
 CAREER_PROFILE_TANKS_NO_THANKS_QUOTE: "“說白了，坦克就是個裝滿了易燃易爆品的小鐵盒，很容易變成它那專業車組的移動火葬場。”\n\n——謝爾福德·比德威爾准將"
 CAREER_PROFILE_WE_SHALL_FIGHT_IN_THE_SHADE: "遮天蔽日"
 CAREER_PROFILE_WE_SHALL_FIGHT_IN_THE_SHADE_DESCRIPTION: "在單個空域內部署超過5000架飛機。"
 CAREER_PROFILE_WE_SHALL_FIGHT_IN_THE_SHADE_QUOTE: "“飛機總是出各種技術故障，讓所有長腦子的人意識到其就是無用的鋪張，只是個時間問題！”\n\n——引自《科學美國人》（1910）上的一篇文章"
 CAREER_PROFILE_ACES_HIGH: "空戰英豪"
 CAREER_PROFILE_ACES_HIGH_DESCRIPTION: "讓20名空軍王牌使用同一座機場作為其基地。"
 CAREER_PROFILE_ACES_HIGH_QUOTE: "“天界是他們的戰場，而他們則是雲中騎士。”\n\n——大衛·勞合·喬治"
 CAREER_PROFILE_BEHIND_ENEMY_LINES: "敵後作戰"
 CAREER_PROFILE_BEHIND_ENEMY_LINES_DESCRIPTION: "通過空降奪取敵國的首都。"
 CAREER_PROFILE_BEHIND_ENEMY_LINES_QUOTE: "“我們是傘兵，中尉。我們本來就該被包圍。”\n\n——溫特斯少校，《兄弟連》"
 #First Startup Splash Screen Text
 SUB_MESSAGE_SPLASHSCREEN_TITLE: "通過在戰場上的傑出表現贏得勳章與勳表！"
 SUB_MESSAGE_SPLASHSCREEN_DESC: "勳章與勳表是一系列新挑戰和獎勵，可於非鐵人模式遊戲中取得。多多查看“生涯檔案”中的列表，並與朋友們比比各自的統計數據和勳章吧。\n\n此外，生涯檔案現在可以統計mod啟用時的各項數據了！"
 #Backup Flavor Texts
 CAREER_PROFILE_BACKUP_QUOTE_01: "“吾乃騰格里之鞭。如果你沒有犯下滔天大罪，騰格里便不會讓我這種人前來懲戒你。”\n\n——成吉思汗"
 CAREER_PROFILE_BACKUP_QUOTE_02: "“世上有三種人：頑固不化的，通情達理的，口若懸河的。”\n\n——引自本傑明·富蘭克林"
 CAREER_PROFILE_BACKUP_QUOTE_03: "“……蕩平風暴、駕馭雷電之人。”\n\n——泰迪·羅斯福"
 CAREER_PROFILE_BACKUP_QUOTE_04: "“趁對面不注意，以最快的速度和最大的力氣揍他最要命的地方。”\n\n——威廉·斯利姆子爵"
 CAREER_PROFILE_BACKUP_QUOTE_05: "“當你回家時給他們講述我們的時候說：為了他們的明天，我們犧牲了自己的今天。”\n\n——約翰·麥克韋爾·愛德蒙茲"
 CAREER_PROFILE_BACKUP_QUOTE_06: "“如果有什麼值得你去為之戰鬥，用下三濫的手段也無妨。”\n\n——佚名"
 CAREER_PROFILE_BACKUP_QUOTE_07: "“我將盡快帶著儘可能多的支援回來。在這期間，你們必須守住！”\n\n——道格拉斯·麥克阿瑟"
 CAREER_PROFILE_BACKUP_QUOTE_08: "“不知在哪裡，敵人的炮火來襲，炮彈隨之落下——你可以在這些炮彈飛過來的時候扳著指頭數。一段時間後，你就數不清了；炮彈毫無規律地砸下來，一枚——兩枚——三枚，但它們卻很清楚的知道我們在哪裡——左邊、右邊、前面、後面，如同巨人舉起的巨大垃圾桶一般摔得粉碎。土塊砸在我們的身上，破碎的岩石飛濺到山坡那仍然完好無損的峭壁上。夜已深，卻並不寧靜。”\n\n——阿爾瓦·貝西，《戰爭中的人：美國人在西班牙的故事》（1939）"
 CAREER_PROFILE_BACKUP_QUOTE_09: "“噢，當耀眼的光芒播下太陽的種子時，你想前往何方？沐在灰燼之雨中，你又想做什麼？可是，倘耀眼的光芒毀滅了你那緊緻的肉體，焚盡了你那可愛的骨骼時，又會發生什麼呢？於灰燼之雨中孑然而立，你還剩下些什麼？”\n\n——摘自查爾斯·馬丁《末日談話》"
 CAREER_PROFILE_BACKUP_QUOTE_10: "“反覆重溫亞歷山大、漢尼拔、凱撒、古斯塔夫、蒂雷納子爵、歐根親王和腓特烈大帝的戰例，才是成為名將並通曉兵法奧秘的不二法門。”\n\n——拿破崙·波拿巴"
 CAREER_PROFILE_BACKUP_QUOTE_11: "“我必須學習政治和軍事，只有這樣我的孩子才有學習數學和哲學的自由……才能讓他們的孩子擁有學習繪畫、詩歌和音樂的權利。”\n\n——約翰·亞當斯"
 CAREER_PROFILE_BACKUP_QUOTE_12: "“一整片海洋都不足以使一艘船沉沒，除非這些水能夠灌入船艙。”\n\n——佚名"
 CAREER_PROFILE_BACKUP_QUOTE_13: "“船開快點，最好和這船是你偷的一樣。”\n\n——佚名"
 CAREER_PROFILE_BACKUP_QUOTE_14: "“對面人這麼多，我們人這麼少，怎麼才能把他們都埋完呢？”\n\n——芬蘭冬季戰爭耳語"
 CAREER_PROFILE_BACKUP_QUOTE_15: "“只有無畏的人才配成為紅軍中的懦夫。”\n\n——約瑟夫·斯大林"
 CAREER_PROFILE_BACKUP_QUOTE_16: "“你的名字無人知曉，你的功績永世長存。”\n\n——無名烈士墓"
 CAREER_PROFILE_BACKUP_QUOTE_17: "“為天皇死，就是永生。”\n\n——佚名"
 CAREER_PROFILE_BACKUP_QUOTE_18: "“孫子曰：凡用兵之法，全國為上，破國次之。”\n\n——孫武，《孫子兵法》"
 CAREER_PROFILE_BACKUP_QUOTE_19: "“四海之內皆兄弟，緣何風雨亂人間？”\n\n——裕仁天皇"
 CAREER_PROFILE_BACKUP_QUOTE_20: "“Facta non-Verba”\n\n——拉丁語格言“光幹不說”"
 CAREER_PROFILE_BACKUP_QUOTE_21: "“戰爭就是在人命前面加上一個天文數字。”\n\n——塞巴斯蒂安·榮格爾，《戰爭》"
 CAREER_PROFILE_BACKUP_QUOTE_22: "“動機不必正義，作戰不必取勝；但是古往今來，人們總是寧可和朋友一起在戰場上赴死，也不願意一個人逃跑苟活。”\n\n——塞巴斯蒂安·榮格爾，《戰爭》"
 CAREER_PROFILE_BACKUP_QUOTE_23: "“然而，恐懼最大的問題在於，它不止有一種形式。恐懼有一套完整的分類——焦慮、畏懼、恐慌、不安——而你也許能扛住一種，卻在另一種面前完全崩潰。”\n\n——塞巴斯蒂安·榮格爾，《戰爭》"
 CAREER_PROFILE_BACKUP_QUOTE_24: "“人們總是不願意承認，戰爭中最痛苦的事情就是不得不放棄一些東西。戰爭顯然是邪惡而錯誤的，因此那種認為戰爭可能有益的想法簡直聽起來像是褻瀆。“\n\n——塞巴斯蒂安·榮格爾，《戰爭》"
 CAREER_PROFILE_BACKUP_QUOTE_25: "“戰鬥時，你會分泌大量的腎上腺素，這使得恐懼幾乎不復存在；更能體現真正的勇氣的，是你在一場大戰前的心理活動，因為那時你才會真正有可能意識到，你有可能失去生命。我的個人弱點與其說是恐懼死亡，倒不如說是期待死亡。”\n\n——塞巴斯蒂安·榮格爾，《戰爭》"
 CAREER_PROFILE_BACKUP_QUOTE_26: "“馬奇諾防線固若金湯，和約已得到同意，而我得到了她不侵略波蘭的保證。”\n\n——斐迪南·福煦"
 CAREER_PROFILE_BACKUP_QUOTE_27: "“唯一比讓軍隊接受新觀點更難的事情，就是放棄一箇舊觀點。”\n\n——英國陸軍上尉巴塞爾·李德哈特爵士，《反思戰爭》，1944"
 CAREER_PROFILE_BACKUP_QUOTE_28: "“戰爭包含許多方面，假裝興奮不是其中之一純屬自欺欺人。”\n\n——塞巴斯蒂安·榮格爾，《戰爭》"
 CAREER_PROFILE_BACKUP_QUOTE_29: "“哲學家和科學家們已經證明，適應是生存的奧秘。然而，歷史卻是一系列由於未能伴隨著需求及時改變而導致的失敗。而本應當適應能力最強的軍隊，卻一直是最僵化的——而這往往以他們所服務的事業為代價。”\n\n——英國陸軍上尉巴塞爾·李德哈特爵士，《反思戰爭》，1944"
 CAREER_PROFILE_BACKUP_QUOTE_30: "“變革代表了當今世界。你要麼推動變革，或者被變革推動。”\n\n——戈登·R·沙利文將軍"
