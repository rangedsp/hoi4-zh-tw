l_simp_chinese:
 generic.8.t: "核武主宰"
 generic.8.d: "就在剛才，我們使用了世界上的第一枚核武器，如今在軍備競賽中可謂傲視群雄。隨著此前的努力終得回報，世界將不得不驚歎於我國之威。也許有朝一日他們或可迎頭趕上，但我們將保證此事絕不會發生。"
 generic.8.a: "讓敵人灰飛煙滅吧！"
 generic.9.t: "落居人後"
 generic.9.d: "就在剛才，其他國家使用了世界上的第一枚核武器，成為了軍備競賽中的佼佼者。儘管我們此前竭盡全力，但現在仍然失去了防禦和報復打擊的能力，只得落於下風。我們必須在他們製造更多毀滅之前加緊步伐，盡力縮小差距。"
 generic.9.a: "我們必須在此項目中竭盡全力。"
 generic.10.t: "強力盟友"
 generic.10.d: "就在剛才，我國盟友使用了世界上的第一枚核武器，如此使己方聯盟成為了軍備競賽中冠絕群雄的存在。儘管我國暫落下風，但鑑於這種武器的擁有者是我們的盟友，因此，縱使敵人也掌握了原子之力，我們也具備打擊報復的能力。"
 generic.10.a: "這樣也可以接受。"
 wtt_denmark.1.t: "冰島獨立"
 wtt_denmark.1.d: "隨著丹麥遭到入侵併中斷聯繫之後，冰島議會現已經接管了該國的外交事務。在佔領狀態結束前，這被認為是一項臨時的措施。"
 wtt_denmark.1.a: "祝他們好運。"
 news.331.t: "冰島接管本國外務"
 news.331.desc: "隨著丹麥停止抵抗，它的聯統國——冰島的議會現在接管了本國的外交事務，如此一來，他們便從根本上成為了完全獨立的國家。儘管作為母國的丹麥遭到侵略，但新當選的冰島臨時總督仍然宣佈在當前的戰事中維持中立。"
 news.331.a: "保持中立可沒有護佑丹麥。"
 wtt_britain.24.t: "麥克唐納提案"
 wtt_britain.24.d: "隨著目前的戰事給英國航運造成的極大壓力，我們這位東邊的鄰居已經愈發迫切地希望使用我國的海空軍基地，以擴大其航路保護的範圍。針對此事，名為馬爾科姆·麥克唐納的英國特使已經抵達我國，提出了將北愛爾蘭歸還予我國，來換取我方在這場戰爭中和英國結盟的提案。"
 wtt_britain.24.a: "不錯的提案。"
 wtt_britain.24.b: "得不償失。"
 wtt_britain.25.t: "英國要求接管法國艦隊"
 wtt_britain.25.d: "英國海軍艦隊現已開抵我國各主要艦隊泊地海域，同時我們還收到了他們要求我國海軍立即投降的最後通牒。英軍艦隊司令威脅道，如果我們不將艦船立即駛向英國港口，他將旋即下令開火發動攻擊。"
 wtt_britain.25.a: "我們別無選擇……"
 wtt_britain.25.b: "我國艦隊絕不會讓他國染指！"
 wtt_britain.26.t: "法國艦隊投降"
 wtt_britain.26.d: "法國人做出了明智的抉擇，將艦船開到了我國的港口。我們現在已經完全掌控了法國艦隊。"
 wtt_britain.26.a: "至少沒落入德國佬手中。"
 wtt_britain.27.t: "法國拒絕最後通牒"
 wtt_britain.27.d: "法國人拒絕了我們的要求，如此將我們置於了艱難的抉擇境地：要麼只能悻然退讓，要麼就得狠心背刺昔日的盟友……"
 wtt_britain.27.a: "我們絕不能看著法國艦隊為德國賣命！"
 wtt_britain.27.b: "真不是滋味，但我們必須退讓。"
 news.332.t: "法國艦隊投降"
 news.332.desc: "昨日，英國皇家海軍將法國海軍封鎖在了後者位於北非的各主要泊地當中，同時向其下達了最後通牒，勒令法軍將艦船駛向英國港口並交出艦隊的控制權。如若不從，英軍艦隊將向昔日的盟友悍然開火。面對擁有壓倒性優勢火力的英軍，法軍最終接受了通牒，其艦隊現在已經置於英國人的控制下。"
 news.332.a: "明智之舉。"
 news.332.b: "血光之災所幸得以避免。"
 news.332.c: "他們怎敢如此？！"
 news.332.d: "我們別無選擇"
 news.332.e: "法國海軍將在英軍麾下繼續戰鬥。"
 news.333.t: "英軍襲擊凱比爾港"
 news.333.desc: "昨日，英國皇家海軍將他們的法國海軍同行封鎖在了後者位於北非的各主要泊地當中，同時向其下達了最後通牒，勒令法國人將艦船駛向英國港口並交出艦隊的控制權。如若不從，英軍艦隊將向昔日的盟友悍然開火。在法國人拒絕了英國人的要求後，雙方旋即爆發了交火，至少有一艘法國戰列艦在戰火中被擊沉，而整個法國艦隊也遭受了相當程度的嚴重打擊。"
 news.333.a: "我們只是行必做之事。"
 news.333.b: "真是駭人聽聞！"
 news.333.c: "我們可能低估了他們。"
 news.333.d: "我們不會忘記如此背叛！"
 news.333.e: "他們證明了自己的決心。"
 wtt_britain.28.t: "愛爾蘭接受麥克唐納提案"
 wtt_britain.28.d: "愛爾蘭政府現已同意我方提案，為換取北愛爾蘭的迴歸，加入到了我們的大業當中。"
 wtt_britain.29.t: "愛爾蘭拒絕麥克唐納提案"
 wtt_britain.29.d: "愛爾蘭政府拒絕了我方提案，不願加入到我們捍衛民主的大業當中。"
 wtt_britain.29.a: "等德國佬上岸還有誰能幫他們？！"
 wtt_britain.30.t: "美國輸送應急軍備"
 wtt_britain.30.d: "承蒙美國捍衛不列顛本土委員會不遺餘力的支持，美國政府日前向我國輸送了一批包括舊型號步槍、支援裝備和若干火炮組件在內的應急軍備。儘管對我國正規軍來說，這批裝備由於類型太過雜亂，不太能夠真的派上用場，但這對我們武裝本土防衛軍而言，無疑有極大的幫助。"
 wtt_britain.30.a: "大洋彼岸的表兄救我們於水火！"
 wtt_germany.1.t: "國防軍將領忤逆希特勒"
 wtt_germany.1.d: "在萊茵蘭地區再軍事化的政府行動所造成的危機後，原本對希特勒統治潛在的不滿也已浮出了水面。一群國防軍將領已經集結在了德高望重的奧古斯特·馮·馬肯森元帥麾下，決意實施一系列計劃以除掉希特勒，並將納粹黨趕出德國。\n\n隨著德國高級軍事領導層分裂的日益明晰，有所察覺的外國勢力也決定不再反對萊茵蘭的再軍事化，而將關注的焦點聚集在了德國內部的政治動盪上面。老元帥馬肯森的勢力發展迅速，甚至已經建立了臨時政府，並且在反對納粹統治的人群當中獲得了大量的支持。\n\n軍事政變似乎已是一觸即發。"
 wtt_germany.1.a: "把這個納粹渣滓趕出祖國！"
 wtt_germany.2.t: "德國流亡者加入大業"
 wtt_germany.2.d: "在遭受嚴苛的壓迫以及強制驅逐出境的待遇後，許多慘遭放逐的德國同胞聚集到了我們的旗幟下。而通過一定的領導，我們現已將這些熱切的志願者編組為了若干陸軍師，他們已經做好準備，抗擊我們共同的敵人！"
 wtt_germany.3.t: "德國解除對威廉二世的流放"
 wtt_germany.3.d: "德國日前邀請威廉二世迴歸祖國重任德皇之位。鑑於德國最近的動盪，這或許有助於該國恢復，並且建立和平與穩定。然而，世界的目光同時也聚焦到了我們身上，畢竟許多人並沒有忘記，二十年前這位老皇帝是怎樣將歐洲捲入到了駭人的戰爭之中。"
 wtt_germany.3.a: "我們必須恭送德皇去領導他的臣民。"
 wtt_germany.3.b: "我們絕不能冒另一場大戰的風險，必須阻止他。"
 wtt_germany.4.t: "德皇歸來"
 wtt_germany.4.d: "在民眾欣喜若狂的慶賀下，威廉二世重返了他的祖國，再次榮登德意志皇帝寶座！過去的十多年裡，荷蘭政府慷慨地為陛下提供了庇護居所，並且多次拒絕將陛下引渡給我們此前的敵人，對於他們崇高的善舉，我們深表感謝。我們的國家在近來的內戰當中飽受創傷，但願德皇陛下的迴歸，能夠使我們重鑄穩定和團結。"
 wtt_germany.4.a: "陛下無疑將會賢治祖國。"
 wtt_germany.5.t: "荷蘭阻撓德皇歸國"
 wtt_germany.5.d: "在故作高尚地為威廉二世提供庇護居所這麼多年後，卑鄙的荷蘭現在竟敢把皇帝陛下在邊境上攔了下來！在將陛下遣送回他在荷蘭的府邸多倫莊園後，荷蘭用“擔憂危害歐洲大陸的穩定”這樣的藉口，拒絕放行陛下返德復位。"
 wtt_germany.5.a: "那就親眼讓他們看看這一“擔憂”！"
 wtt_germany.5.b: "或許他們在理……我們倒也有其他人選。"
 wtt_germany.5_tt: "老皇帝仍可輔佐其子嗣進行統治。\n"
 wtt_germany.6.t: "威廉二世重獲自由"
 wtt_germany.6.d: "在我軍肅清多倫莊園周邊殘餘的荷蘭守軍後，我們找到了毫髮無傷的皇帝陛下，並用摩托化部隊護送他踏上了歸國之途。就在數小時前，威廉二世陛下以凱旋之姿跨過德荷邊境，在抵達柏林後，他莊嚴地接受了作為德意志皇帝的職責。"
 wtt_germany.6.a: "任何人都不可阻擋我們。"
 GER_fascism_civil_war_tt: "法西斯支持者發動內戰。\n"
 wtt_germany.7.t: "對[From.GetName]的重度經濟依賴"
 wtt_germany.7.d: "不知不覺間，我們已經深陷於[From.GetNameDef]的勢力範圍當中，致使我們在經濟上越來越依賴我們這位盟友。今天，德國人最終還是越過了底線，他們要求進一步控制我國經濟，而對此，我們無能為力。至此，德國對我國外交事務的掌控達到了前所未有的程度。"
 wtt_germany.7.a: "我們只得暫時忍受此現狀……"
 wtt_germany.8.t: "德國為君主派政變提供援助"
 wtt_germany.8.d: "[From.GetNameDefCap]日前和意大利政府內部乃至地下組織中的親君主派和反法西斯人士展開了接觸，並就刺殺墨索里尼以及擁立維托里奧·埃馬努埃萊三世領導國家的計劃進行了討論。德國人向我們保證他們能夠執行刺殺任務，而我們只需要確保有能力組建新政府並在未來為德國的利益提供軍事支持即可。"
 wtt_germany.8.a: "我們必須邁向君主治下的未來。"
 wtt_germany.8.b: "荒謬！我們絕不會摒棄現行制度！"
 wtt_germany.9.t: "意大利人接受政變提案"
 wtt_germany.9.d: "意大利政府和地下組織內的君主派和反法西斯人士已經接受了我們的政變提議，他們正在為政權過渡進行準備，以確保刺殺成功後，國王可以迅速奪取權力。"
 wtt_germany.9.a: "我們可以啟動計劃了。"
 wtt_germany.10.t: "意大利人拒絕政變提案"
 wtt_germany.10.d: "意大利政府和地下組織內的君主派和反法西斯人士毫不客氣地告訴我們，他們對我們的政變提議毫無興趣。他們還威脅道，倘若我們膽敢再提，他們就要向意大利政府揭露我們的密謀。"
 wtt_germany.10.a: "真是不幸。"
 wtt_germany.11.t: "德國刺殺墨索里尼"
 wtt_germany.11.d: "德國的計劃按部就班，墨索里尼今天在羅馬街道上坐車巡視時被人槍殺。維托里奧·埃馬努埃萊三世陛下已經掌握了國家政權，他保證將與[From.GetNameDef]攜手共建舊同盟國。"
 wtt_germany.11.a: "我們必須感謝他們。"
 wtt_germany.12.t: "墨索里尼刺殺計劃成功"
 wtt_germany.12.d: "我方計劃得到了切實的執行，現在維托里奧·埃馬努埃萊三世已經掌控了國家政權並施行統治，他所頒佈的第一道敕令就是簽署意大利加入舊同盟國的協定。"
 wtt_germany.12.a: "君權王業再起！"
 wtt_germany.13.t: "奧匈帝國復統"
 wtt_germany.13.d: "在我們的幫助下，[From.GetOldName]已經領導了奧匈帝國的統合事宜。今天早晨，有關各方在充分交換意見後簽署了條約，就此消融了長達兩個世紀的分離主義對立。新成立的聯合政府旋即承諾對我們的事業提供軍事協助，加入到了舊同盟國的陣營當中。"
 wtt_germany.13.a: "我們的舊日盟友終再聚首。"
 wtt_germany.14.t: "德國提議以庇護交換領土"
 wtt_germany.14.d: "[From.GetNameDefCap]日前向我方提出了一則據稱“雙贏”的提議。德國人指出，基於當下的政局形勢以及我國東境領土所面臨的威脅，他們願意為我們提供獨立保障，以在我們未來與[SOV.GetNameDef]開戰時提供軍事援助。但作為交換，他們“僅希望”我國能歸還其在上次大戰中失去的但澤和波茲南這兩處領土。"
 wtt_germany.14.a: "他們的軍力對我們而言比領土更有用。"
 wtt_germany.14.b: "我們絕不會割讓本國的領土！"
 wtt_germany.15.t: "波蘭接受提案"
 wtt_germany.15.d: "波蘭人最終接受了我方的提案，並著手將其邊境省份歸還予我方。他們決定信任我方，也希望我們能夠做好準備，應對隨時爆發的[SOV.GetAdjective]入侵……"
 wtt_germany.15.a: "凡爾賽條約之殤終得消散！"
 wtt_germany.16.t: "波蘭拒絕提案"
 wtt_germany.16.d: "波蘭人最終拒絕了我方的提案。他們措辭強硬地明確告知我們，即便是要在面對敵國入侵時孤軍奮戰，他們也絕不會拿自己的領土以換得幫助。"
 wtt_germany.16.a: "那我們也絕不會放棄己方宣稱！"
 wtt_germany.16.b: "或許我們只得對此逆來順受。"
 wtt_germany.17.t: "德國共產黨人流亡法國"
 wtt_germany.17.d: "由於德國政府近來嚴厲打擊其國內的共產主義組織，並且將其成員驅逐出境，因此我們現在從這一鄰國那裡收容了大量的共產主義信徒……"
 wtt_germany.17.a: "如果這不會太影響本國穩定的話……"
 wtt_germany.17.b: "增加警務資金，限制他們對我國政界的影響！"
 wtt_germany.18.t: "納粹領導人審判案"
 wtt_germany.18.d: "我們終於將祖國從敵人的魔掌當中解救出來了，那些忠誠地支持我們大業的公民們，現在也可榮歸其故里。而隨著國家的再度統一，我們即將開始漫長而又艱辛的重建工作。國家的領導精英們正齊聚一堂，熱切討論著我國未來可能的道路：是建立民主，還是重回往昔的帝制。\n\n然而，伴隨著內戰的結束，我軍抓獲了大批納粹統治時期的軍政領導人。面對著這幫象徵著我國近來令人所不齒歷史的前納粹黨徒，如何處置他們，成為了我們亟需解決的一個問題。"
 wtt_germany.18.a: "統統處以絞刑！"
 wtt_germany.18.b: "判處終身監禁，或許以後還用得上他們。"
 wtt_germany.19.t: "[GER.GetName]公開呼籲反對[SOV.GetName]"
 wtt_germany.19.d: "最近一段時間來，德國人矛頭直指我方的無恥抹黑正愈發損害著我國在歐洲的名聲和地位。其中，他們對我國“侵略企圖他國”的誹謗中傷，甚至已經讓許多國家對我們的真實意圖產生了恐懼和誤解。"
 wtt_germany.19.a: "開展大規模軍事演習以儆效尤！"
 GER_soviet_military_exercises: "軍事演習"
 wtt_germany.19.b: "我們必須挽回聲譽並改善關係。"
 GER_soviet_smoothes_relationships: "改善關係"
 wtt_germany.19.c: "他們真覺得我們會在乎被別人怎麼談論嗎？"
 wtt_germany.20.t: "德國組建中歐同盟"
 wtt_germany.20.d: "為了繼續展開誹謗中傷我國的毒計，德國人現已宣佈組建一個全新的聯盟體。毫無疑問，這個聯盟旨在對抗我方，且定會干涉我方的勢力範圍。"
 wtt_germany.20.a: "他們最好遠離我方勢力範圍！"
 GER_soviet_reiterated_claims: "重申宣稱"
 wtt_germany.20.b: "我們絕不能落給他們任何藉口來激化事端。"
 wtt_germany.21.t: "德國邀請波羅的海諸國"
 wtt_germany.22.t: "德國邀請波蘭"
 wtt_germany.23.t: "德國邀請芬蘭"
 wtt_germany.21.d: "德國人已經向一個位於我方勢力範圍內的國家發出了同盟邀約，其對祖國的險惡用心不言而喻！"
 wtt_germany.21.a: "我們必須發起反擊以捍衛餘下的勢力範圍！"
 GER_soviet_securing_sphere: "捍衛勢力範圍"
 wtt_germany.21.b: "我們承受不起與西方的對抗。"
 wtt_germany.24.t: "巨大的[GER.GetGreatRedMenaceName]威脅"
 wtt_germany.24.d: "通過官方和民間渠道，德國人已經明確指出，[GER.GetGreatRedMenaceEventDesc1]。對此，他們試圖使我方相信，在對抗[GER.GetGreatRedMenaceEventDesc2]的大業當中我們並不是孤軍奮戰，只要整個歐陸團結起來，我們便能打倒赤色巨熊。"
 SOV_GREAT_RED_MENACE_EVENT_DESC_1_COMMUNIST: "對歐洲穩定而言最大的威脅，便是迄今已建國二十餘年的[SOV.GetNameDef]"
 SOV_GREAT_RED_MENACE_EVENT_DESC_1_EXILES: "縱觀近來的歷史，[SOV.GetAdjective]帝國主義一直是歐洲穩定的主要威脅"
 SOV_GREAT_RED_MENACE_EVENT_DESC_2_COMMUNIST: "共產主義的威脅"
 SOV_GREAT_RED_MENACE_EVENT_DESC_2_EXILES: "來自東方的威脅"
 wtt_germany.24.a: "但願他們是對的。"
 wtt_germany.24.b: "永遠不能相信[GER.GetAdjective]人！"
 wtt_germany.25.t: "蘇聯改善外交形象"
 wtt_germany.25.d: "蘇聯近來已經做出了努力，試圖緩和歐洲諸國對其的忌憚。通過此前的一份公開聲明，蘇聯人公然宣稱其絕無敵意，且他們也希望通過剋制回應德國的好戰言論，來多少挽回些本國的外交聲譽。"
 wtt_germany.25.a: "後續進展有待觀察。"
 wtt_germany.26.t: "威廉二世駕崩"
 wtt_germany.26.d: "昨夜，我們敬愛的皇帝威廉二世陛下，在睡夢中平靜地離開了人世。儘管此前顛沛流離在外，但天意使然，在陛下生命最後的日子裡，他終究還是迴歸了故土的懷抱。而在這段時間裡，陛下恪盡為君之責，賢明地統治著我們的國家……賢君已逝，萬古長存！無論如何，皇子弗里德里希·威廉殿下現已繼承大統，在其正式登基繼位後，他將以威廉三世之名為世人所知。"
 wtt_germany.26.a: "皇帝陛下萬歲！"
 wtt_germany.27.t: "奧古斯特·馮·馬肯森逝世"
 wtt_germany.27.d: "昨夜，我們尊敬的大元帥奧古斯特·馮·馬肯森，在睡夢中平靜地離開了人世。我們將永遠銘記他在上次世界大戰當中的赫赫戰功，以及將法西斯壓迫者趕出祖國的豐功偉業。流亡的德皇陛下之子弗里德里希·威廉殿下，現已正式接管了政權，作為自1918年其父遜位後的首位德意志帝國皇帝，他將在登基後以威廉三世之名為世人所知。"
 wtt_germany.28.t: "德國解除對威廉二世的流放"
 wtt_germany.28.d: "德意志帝國現已解除了對威廉二世的流放，並與荷蘭方面就迎接老皇帝回國一事展開了接洽。儘管此前，荷蘭政府收到了大量要求引渡這個上次世界大戰的發動者使其伏法的照會，但現在看來，這個戰爭狂人似乎即將重回德意志再掌帝國的大權。"
 wtt_germany.28.d.2: "德意志帝國現已解除了對威廉二世的流放，並與荷蘭方面就迎接老皇帝回國一事展開了接洽。然而，在遭到了荷蘭方面的拒絕後，此事已即將升級為軍事衝突！"
 germany.60.c: "他們不應孤軍奮戰！鼓動英國一起參戰！"
 wtt_germany.29.d: "德意志帝國現已解除了對威廉二世的流放，並與荷蘭方面就迎接老皇帝回國一事展開了接洽。儘管此前，荷蘭政府收到了大量要求引渡這個上次世界大戰的發動者使其伏法的照會，但現在看來，這個戰爭狂人似乎即將重回德意志再掌帝國的大權。\n\n法國方面早已表態此事不可接受，並似乎打算以武力作後盾下達最後通牒。因此，儘管英國的總體民意反對戰爭，但若是我們拒絕和法國人站到一邊，雙方的聯盟無疑便會宣告終結。"
 wtt_germany.29.d.2: "德意志帝國現已解除了對威廉二世的流放，並與荷蘭方面就迎接老皇帝回國一事展開了接洽。然而，在遭到了荷蘭方面的拒絕後，此事已即將升級為軍事衝突！\n\n法國方面早已表態此事不可接受，並似乎打算以武力作後盾下達最後通牒。因此，儘管英國的總體民意反對戰爭，但若是我們拒絕和法國人站到一邊，雙方的聯盟無疑便會宣告終結。"
 germany.61.c: "我們必須幫助荷蘭人！"
 wtt_germany.30.d: "德意志帝國現已解除了對威廉二世的流放，並與荷蘭方面就迎接老皇帝回國一事展開了接洽。儘管此前，荷蘭政府收到了大量要求引渡這個上次世界大戰的發動者使其伏法的照會，但現在看來，這個戰爭狂人似乎即將重回德意志再掌帝國的大權。\n\n法國方面似乎僅僅滿足於發表怒不可遏的外交抗議，而英國的總體民意也明確反對戰爭。"
 wtt_germany.31.d: "英國人拒絕協助我方抗擊德國人的行動，他們聲稱德國的君主制復辟是該國內政。如果我們執意要和德國人打一仗，那麼屆時我們只能靠自己。\n\n儘管法國的總體民意反對戰爭，但德國人正羽翼漸豐，而德皇的迴歸甚至還可能誘發其全新的帝國野望。在英國人拒絕支援的情況下，下達最後通牒的效力已然大減。那麼，我們是否決意獨立對抗德國人？"
 wtt_germany.32.d: "儘管缺乏民意對開戰的支持，但英國政府還是知曉德國人的威脅，並表示將全力支持我方的行動。我們將聯手向德方下達最後通牒，以阻止這個戰狂皇帝復辟。若他們膽敢拒絕，那就是我們的聯合部隊開進德意志，終結他們暴政之時！"
 wtt_germany.33.d: "英法雙方均表示拒絕接受德皇陛下的歸國，他們聲稱對於目睹“上次世界大戰的發動者”重回皇位這件事感到“怒不可遏”。目前他們正動員部隊來對抗我方，同時還下達了最後通牒勒令我軍部隊讓步，並使德皇陛下重回流亡的狀態。如若不允，則視作各國正式進入交戰狀態。"
 wtt_germany.33.a: "絕不退讓！皇帝陛下萬歲！"
 wtt_germany.34.d: "雖然明事理的英國人默許了德皇的歸位，但那些瘋狂的法國佬並不打算收手！在聲稱此事將對他們的國家安全構成直接威脅後，法國方面現已動員部隊並隨時可能越過邊境展開進犯！我們現已處於戰爭狀態！"
 wtt_germany.35.d: "儘管我們警告過威廉二世的復辟便意味著戰爭，但德國方面依舊對此置若罔聞，沒有絲毫讓步亦或是送其皇帝再度流亡的意思。如此一來，儘管我們長久以來一直致力於維護歐陸的和平，戰爭還是不可避免地再度爆發了。"
 wtt_germany.38.t: "[FROM.GetAdjective]索取青島"
 wtt_germany.38.desc: "[FROM.GetNameDefCap]要求迴歸殖民主義的呼聲與日俱增。他們現已通過外交渠道，正式請求我們歸還其曾在青島的飛地，希望重建其舊日帝國。儘管這可能是我國屈辱年代中的又一份不平等條約，但或許我們可以藉此來達成一些有利可圖的協議……"
 wtt_germany.38.a: "要求換取馮·法肯豪森的繼續效力。"
 wtt_germany.38.b: "也許讓他們佔據此地能在今後派上用場。"
 wtt_germany.38.c: "我們絕不會再度割讓主權領土！"
 wtt_germany.39.t: "中國提出青島交換案"
 wtt_germany.39.desc: "中國官方現已與我方展開接洽，並提供了一項據他們所言“雙贏”的提案。根據協議，他們可以將青島還給它的德國主人，但作為交換，他們希望能夠確保我方不會召回目前正在華活動的馮·法肯豪森顧問團。"
 wtt_germany.39.a: "我們可以接受此提案。"
 wtt_germany.39.b: "不，我們必須留有選擇餘地。"
 wtt_germany.40.t: "[From.GetNameDefCap]拒絕交出青島"
 wtt_germany.40.desc: "[From.GetNameDefCap]斷然拒絕了我方索取青島的要求，如此我們只能尋求之後再見機將該地重新納入版圖。"
 wtt_germany.40.a: "我們可以對此保持耐心。"
 wtt_germany.41.t: "德國同意青島交換案"
 wtt_germany.41.desc: "德意志帝國接受了我方關於青島的交換案，他們保證馮·法肯豪森將繼續為我們效力。"
 wtt_germany.42.t: "德國拒絕青島交換案"
 wtt_germany.42.desc: "德意志帝國拒絕了我方關於青島的交換案，他們顯然沒那麼渴望能夠收回這塊飛地。"
 wtt_germany.43.t: "德國索取青島"
 wtt_germany.43.desc: "近來，德意志帝國內重振該國殖民主義的呼聲已愈發高漲。儘管德國人曾在1914年被我們奪取了青島，但現在他們打算通過外交渠道，從我們手中收回這塊舊飛地。或許我們可以此來達成一些有利可圖的協議……"
 wtt_germany.43.a: "以此換取德國召回馮·法肯豪森。"
 wtt_germany.43.b: "他們休想再踏足遠東半步！"
 wtt_germany.44.t: "日本提出青島交換案"
 wtt_germany.44.desc: "日本官方現已與我方展開接洽，並提供了一項據他們所言“雙贏”的提案。根據協議，他們可以將青島還給它的德國主人，但作為交換，他們希望能夠確保我方即刻召回目前正在華活動的馮·法肯豪森顧問團。"
 wtt_germany.46.desc: "德意志帝國接受了我方關於青島的交換案，他們已即刻終止了馮·法肯豪森在華的活動並將其召回。"
 wtt_germany.48.t: "[From.GetNameDefCap]接受要求"
 wtt_germany.48.desc: "[From.GetNameDefCap]現已接受我方提案，並著手安排青島即刻重回德意志版圖！"
 wtt_germany.49.t: "驅逐納粹作戰造成[nazi_state_withdrawn.GetName]嚴重損毀"
 wtt_germany.49.desc: "我方終於設法奪取了[nazi_state_withdrawn.GetName]，但戰況總體而言不容樂觀。我軍每推進一步，那些頑抗阻截的納粹黨徒便會愈發狂熱絕望幾分，每場戰鬥幾乎都會令交戰區域化作一片焦土。而根據希特勒頒佈的“尼祿法令”，有關納粹使用焦土戰術的報告也已屢見不鮮。\n\n直到這場內戰徹底終結前，我們無疑可以預見還會有更多這樣對祖國慘烈的破壞。"
 wtt_germany.49.a: "只要能使祖國掙脫納粹枷鎖，這些都是微不足道的代價。"
 wtt_germany.50.t: "希特勒之死"
 wtt_germany.50.desc: "攻佔柏林之後，我軍部隊在城中的一座地堡內發現了希特勒的屍體。顯然，在這個國家即將被反法西斯勢力接管的前夕，與其束手就擒，這位領導人最終還是選擇了終結自己的生命。\n\n而在他身死後，海因裡希·希姆萊現已接過了納粹的領導權，明確表示其政府將在這場“背叛德國人民”的內戰當中血戰到底。"
 wtt_germany.50.a: "這就是納粹末日的開端。"
 wtt_germany.51.t: "重新任用被捕納粹領導人？"
 wtt_germany.51.desc: "這場曠日持久的戰爭正變得愈發慘烈，如今，每位成年德國公民都得入伍服役。另一方面，雖然我們在意識形態上與此前抓獲的納粹領導人們有著差異，但他們確實擁有著目前國家急需要的才能。\n\n我們或可向他們許諾在戰後能夠重獲自由，以換取其即刻的效忠。"
 wtt_germany.51.a: "是的，恢復部分納粹領導人的職務。"
 reinstate_nazi_leadership_TT: "啟用之前僅對法西斯主義開放的顧問。\n"
 wtt_germany.51.b: "算了，他們現在待的地方就挺好。"
 wtt_germany.51.c: "我們不能坐視他們在戰局崩壞之時重掌天下……即刻統統處以絞刑！"
 wtt_germany.52.t: "[From.From.GetName]爆發民主內戰"
 wtt_germany.52.desc: "為重建自由選舉的政制並還政於民，[From.From.GetName]民主勢力現已發動了內戰。他們或許要仰仗我方的援助，而他們的勝利將確保我們在未來能擁有一個為我方大業赴湯蹈火的盟友。"
 wtt_germany.52.a: "我們將站在民主道義上並肩作戰！"
 wtt_germany.52.b: "他們還是得自己解決本國問題。"
 wtt_germany.53.t: "奧地利親德情緒高漲"
 wtt_germany.53.desc: "隨著雙方締結同盟，近來我們的南方鄰居奧地利國內的親德意志思潮愈發高漲。若是現在發起全民公投的話，奧地利人民或許有可能會同意德奧之間實現聯合。那麼，我們是否要敦促奧地利政府發起公投呢？"
 wtt_germany.53.a: "沒錯，小德意志方案就是個錯誤。"
 wtt_germany.53.b: "不對，大德意志方案才是個錯誤。"
 wtt_germany.54.t: "德國政府敦促發起統一公投"
 wtt_germany.54.desc: "德國政府日前致函我方，提議實現兩國的合邦，並聲稱此乃奧地利民心所願。他們敦促我方即刻舉行公投，以實民情。"
 wtt_germany.54.a: "支持統一。"
 wtt_germany.54.b: "反對統一。"
 wtt_germany.55.t: "奧地利民眾公投贊成統一"
 wtt_germany.55.desc: "鑑於奧地利民眾現已表決同意與北方的兄弟聯合，對於奧地利國家以及軍隊的整合將即刻開始。"
 wtt_germany.55.a: "德意志問題歷史性的一天！"
 wtt_germany.56.t: "德國法理領土案"
 wtt_germany.56.desc: "我們與蘇聯的戰事進展並不順利，甚至已有滿盤皆輸的風險。而在我們的西方，德國在過去幾年裡發生了天翻地覆的變化，眼下他們可謂是民主價值觀堅定的捍衛者。若是能將但澤和波茲南等舊德國領土物歸原主，無疑可使數百萬人從蘇聯的侵略鐵蹄下解放。"
 wtt_germany.56.a: "與其被蘇聯奪走，還不如還給德國！"
 wtt_germany.56.b: "不可能！就是毀滅也得跟著波蘭陪葬！"
 wtt_germany.57.t: "波蘭提議歸還德國法理領土"
 wtt_germany.57.desc: "由於波蘭在同蘇聯的戰事當中並不順利，該國政府現已通過秘密渠道與我方展開接洽，提議將但澤和波茲南等我國舊日領土物歸原主。他們認為在德國的民主政權統治下，民眾無疑會比在蘇聯的壓迫下得到更好的待遇。"
 wtt_germany.57.a: "點子真多！我們會確保他們安全無虞的。"
 wtt_germany.57.b: "不行，我們擔不起被蘇聯報復的風險。"
 wtt_germany.58.t: "奧地利民眾公投拒絕統一"
 wtt_germany.58.desc: "奧地利民眾拒絕了我們對統一的號召，而是寧願他們的國家能夠再多獨立一段時間。"
 wtt_germany.58.a: "我們必須尊重他們的意願。"
 wtt_germany.59.t: "德國接收但澤和波茲南"
 wtt_germany.59.desc: "德國政府決定重新接納其舊日的領土，其誓言將為這些地區的波蘭公民提供庇護。"
 wtt_germany.59.a: "至少他們的安全能夠得到保障。"
 wtt_germany.60.t: "德國拒收但澤和波茲南"
 wtt_germany.60.desc: "德國政府通知我方稱無法接受此前的提案，他們畏懼遭到蘇聯的打擊報復，不敢鋌而走險。"
 wtt_germany.60.a: "等到赤匪奪走了一切，還有誰能幫他們？"
 wtt_germany.62.t: "諸公司要求償付梅福券"
 wtt_germany.62.desc: "隨著近來戰爭的結束，持有我們此前發放的梅福券的公司紛紛敦促政府兌現本票。他們聲稱，“為了祖國的繁榮偉大”，繼續拒付這些債券已毫無意義。"
 wtt_germany.62.a: "行吧。"
 wtt_germany.63.t: "[GER.GetName]整合阿爾薩斯-洛林"
 wtt_germany.63.desc: "[GER.GetAdjective]政府現已通過立法，正式將阿爾薩斯-洛林以及盧森堡兩地整合進[GER.GetName]版圖。這也意味著，對於上述地區我國人口的大規模勞役徵發，也已經同步開始……"
 wtt_germany.63.a: "這幫混蛋！還沒完呢！"
 wtt_germany.64.t: "[GER.GetName]整合盧森堡"
 wtt_germany.64.a: "我們又能做些什麼呢？"
 wtt_germany.65.t: "[From.GetName]要求我國參戰"
 wtt_germany.65.desc: "[From.GetNameDefCap]日前通知我方，稱他們的軍隊需要通過我國領土以開赴前線，與其對手蘇聯交戰。他們對此提醒道，鑑於我國是在他們的庇護下才能免遭共產黨迫害，因此我們理應在這場戰爭中為他們提供援助。"
 wtt_germany.65.a: "他們在理，我們會參戰。"
 wtt_germany.65.b: "他們自以為是誰？！不可能！"
 wtt_germany.66.t: "[From.GetName]接受要求"
 wtt_germany.66.desc: "[From.GetNameDefCap]現已決定加入我們對抗[SOV.GetNameDef]的戰爭，允諾我國部隊可暢行無阻。"
 wtt_germany.67.t: "[From.GetName]拒絕要求"
 wtt_germany.67.desc: "[From.GetNameDefCap]拒絕了我方要求參戰的要求，並且繼續對我軍緊閉其國境線。既然波蘭人不願授權我軍入境，那我們只能碾過他們以繼續前進。"
 wtt_germany.67.a: "這是他們自找的。"
 wtt_germany.68.t: "[From.GetName]提議重整帝國"
 wtt_germany.68.desc: "[From.GetAdjective]政府日前與我方接洽，提出了有關整合舊奧匈帝國的方案。鑑於傾向帝國復辟的思潮在我等繼業者諸國當中呼聲甚高，因此他們聲稱此聯合無疑將會使各國人民從中獲益良多。"
 wtt_germany.68.a: "我等欣然接受此等良案！"
 wtt_germany.68.b: "屈尊合邦？不可能！"
 wtt_germany.69.t: "[From.GetName]同意實現聯合"
 wtt_germany.69.desc: "[From.GetAdjective]政府對於我方此前的舊奧匈帝國整合方案作出回應。他們承認此舉無疑是有利的，並表示如果各方均無異議，那麼他們很願意與我國合邦。"
 wtt_germany.70.t: "[From.GetName]拒絕實現聯合"
 wtt_germany.70.desc: "[From.GetAdjective]政府對於我方此前的舊奧匈帝國整合方案作出回應。他們明確表示，絕不會冒險接受我方的領導。"
 wtt_germany.71.t: "奧匈帝國的重建"
 wtt_germany.71.desc: "毗鄰的奧匈帝國繼業者國家均已同意將其領土重新併入我國，進而重組為奧匈帝國的提案。歡欣鼓舞的人民在街頭熱烈慶祝再統一條約的簽署，而[GER.GetAdjective]政府亦熱切希望我國能重返其聯盟。"
 wtt_germany.71.a: "奧匈帝國新時代的開端。"
 wtt_germany.72.t: "[From.GetName]提議經濟整合"
 wtt_germany.72.desc: "鑑於我等雙方已是親密的盟友，[From.GetNameDef]日前提議，通過更為充分地整合我國經濟，來實現對我國軍工產業的援建及擴展。無疑，此舉將極大地促進我國的軍事發展，但與此同時，我們也得被迫在外交政策上成為他們的跟班。"
 wtt_germany.72.a: "好主意，畢竟我們的命運已緊密相連"
 wtt_germany.72_tt: "§R我們將失去對任何已有附屬國的控制。§!\n"
 wtt_germany.72.b: "恕難從命，國家主權高於一切。"
 wtt_germany.73.t: "[From.GetName]接受經濟整合"
 wtt_germany.73.desc: "[From.GetAdjective]政府現已作出回應，同意我方將其整合進我國戰時經濟的提案。他們正迫切等候我方的指導，以便仿照我們的成功案例編組本國的軍隊。"
 wtt_germany.73.a: "他們的軍隊將在我方指導下邁向強大。"
 wtt_germany.74.t: "[From.GetName]拒絕經濟整合"
 wtt_germany.74.desc: "[From.GetAdjective]政府現已作出回應，拒絕了我方將其整合進我國戰時經濟的提案。看起來，他們更加重視自己的國家主權，而非自己的軍隊是否可堪一戰……"
 wtt_germany.74.a: "他們竟還自絕於繁榮昌盛？！"
 wtt_germany.999.t: "[From.GetLeader]呈請恢復在英爵銜"
 wtt_germany.999.desc: "以德皇[From.GetLeader]的名義，[From.GetAdjective]政府日前向我國提交申請，請求恢復德國皇室乃至各諸侯家族在1917年的頭銜剝奪法案當中被廢除的在英爵位和頭銜。他們認為此舉能向世界證明英德兩國皇室及貴族已重回上次大戰前的親密關係，同時亦能作為英德兩國間友誼的象徵。"
 wtt_germany.999.a: "所見略同！"
 wtt_germany.999.b: "恕難苟同。"
 wtt_germany.1000.t: "[From.GetAdjective]政府接受請求"
 wtt_germany.1000.desc: "[From.GetAdjective]政府現已作出決定，同意我方關於恢復德國皇室及各諸侯家族在英爵位和頭銜的請求。同時他們還提議為此舉辦一場宏偉的“世紀皇家典禮”，邀請所有德國皇室成員到場，以正式恢復二十年前眾人曾被錯誤剝奪的爵銜。\n\n根據皇室顧問的建議，皇室成員可搭乘象徵著德意志頂尖科技的交通工具華麗入場，而本國最先進的興登堡號飛艇正好就是最完美的選擇。"
 wtt_germany.1000.a: "好主意，但還是委託一位皇室成員作聯絡人！"
 wtt_germany.1000.a_tt: "維多利亞·路易絲公主殿下將作為聯絡人被委任去籌備這場盛大的典禮，這會在一定程度上增加政府的財政負擔。希望其餘皇室成員能讓其安然抵達[ENG.GetNameDef]。\n"
 wtt_germany.1000.b: "好主意，皇室全員都應盛裝出席！"
 wtt_germany.1000.b_tt: "整個皇室家族都將搭乘興登堡號飛艇赴英參加典禮，這將在我國盟友乃至本國民眾當中極大地提升皇室的威望，並且鞏固政府的地位。\n"
 wtt_germany.1001.t: "興登堡號於倫敦焚燬"
 wtt_germany.1001.desc: "在今天發生的一場可怕悲劇當中，興登堡號飛艇在試圖於倫敦降落的過程中慘遭焚燬。儘管事故的原因尚未查明，但可知的是飛艇被大火吞噬，旋即墜入地面，導致包括幾乎所有德國皇室成員在內的機上乘員均不幸遇難。\n\n皇室中唯一的倖存者是此前被派去協助典禮籌備工作的維多利亞·路易絲公主殿下。如此一來，繼其祖母——德國皇后維多利亞，以及她的曾祖母維多利亞女皇之後，第三位名為維多利亞的公主成為了皇位唯一的繼承人。儘管尚還沉浸在喪失至親的悲痛當中，但如今她依舊登上了皇位，正式加冕為德意志帝國女皇維多利亞一世。"
 wtt_germany.1001.a: "先皇已逝……女皇陛下萬歲！"
 wtt_germany.1002.desc: "在今天發生的一場可怕悲劇當中，興登堡號飛艇在試圖於倫敦降落的過程中慘遭焚燬。儘管事故的原因尚未查明，但可知的是飛艇被大火吞噬，旋即墜入地面，導致包括所有德國皇室成員在內的機上乘員均不幸遇難。\n\n隨著皇室的徹底絕嗣，該國政府目前接管了大權。但即便如此，短期之內我們仍不太可能看到民主在該國的迴歸。"
 wtt_germany.1002.a: "一場悲劇！"
 wtt_germany.1003.t: "[From.GetAdjective]政府拒絕請求"
 wtt_germany.1003.desc: "經過該國議會冗長的討論後，[From.GetAdjective]政府最終還是回絕了我們關於恢復德國皇室乃至各諸侯家族在英爵銜的申請。"
 wtt_germany.1003.a: "真是遺憾……"
 wtt_news.1000.desc: "在今天發生的一場可怕悲劇當中，興登堡號飛艇在試圖於倫敦降落的過程中慘遭焚燬。儘管事故的原因尚未查明，但可知的是飛艇被大火吞噬，旋即墜入地面，導致包括幾乎所有德國皇室成員在內的機上乘員均不幸遇難。\n\n皇室中唯一的倖存者是此前被派去協助典禮籌備工作的維多利亞·路易絲公主殿下。如此一來，繼其祖母——德國皇后維多利亞，以及她的曾祖母維多利亞女皇之後，第三位名為維多利亞的公主成為了皇位唯一的繼承人。儘管尚還沉浸在喪失至親的悲痛當中，但如今她依舊登上了皇位，正式加冕為德意志帝國女皇維多利亞一世。"
 wtt_news.1000.a: "災難性的悲劇……以及出乎意料的結局。"
 wtt_news.1001.desc: "在今天發生的一場可怕悲劇當中，興登堡號飛艇在試圖於倫敦降落的過程中慘遭焚燬。儘管事故的原因尚未查明，但可知的是飛艇被大火吞噬，旋即墜入地面，導致包括所有德國皇室成員在內的機上乘員均不幸遇難。\n\n隨著皇室的徹底絕嗣，該國政府目前接管了大權。但即便如此，短期之內我們仍不太可能看到民主在該國的迴歸。"
 wtt_news.1001.a: "多麼可怕的悲劇！"
 wtt_news.1.t: "德國陷入內戰"
 wtt_news.1.desc: "今天清晨，德意志國防軍在著名的奧古斯特·馮·馬肯森元帥的領導下突然發動政變，拉開了德國內戰的序幕。法西斯派、保皇派以及民主派均已武裝起來，將槍口指向了他們昔日的同胞，而軍隊亦已從邊境撤回，加入到內戰的序列當中。\n\n希特勒領導下的法西斯主義者們已賭咒發誓，即使讓這個國家化作一片焦土，也絕不讓其落入“德意志的叛徒”之手。"
 wtt_news.1.a: "骰子已經擲下。"
 wtt_news.1.b: "遭軍隊背叛？！我們絕不可再重蹈覆轍！"
 wtt_news.1.c: "讓我們祈禱和平能儘快重回歐陸……"
 wtt_news.2.t: "[From.GetNameDefCap]阻撓威廉二世歸國"
 wtt_news.2.desc: "就在昨天上午德意志帝國出人意料地宣佈解除對威廉二世的流放後不久，荷蘭當局在德荷邊境攔下了老德皇即將越境的車隊，旋即將其遣送回了多倫莊園的住所。\n\n根據荷蘭的官方通報，鑑於威廉二世重返皇位將會有損於歐陸的和平穩定，荷蘭政府決定將繼續對這位老皇帝予以軟禁。\n\n儘管德國官方尚未對此次危機作出回應，但該國民眾的抗議示威內容當中，已包括要求動用武力實現德皇的歸國復位。\n"
 wtt_news.2.a: "他們好大的膽子？！"
 wtt_news.2.b: "他們最好清楚自己在幹什麼……"
 wtt_news.2.c: "總有人必須挺身而出。"
 wtt_news.3.t: "威廉二世重返德意志帝國"
 wtt_news.3.desc: "昨天上午，德意志帝國出人意料地宣佈解除了對威廉二世的流放。緊接著在今天，老德皇的車隊順利越過德荷邊境，旋即回到柏林，隆重地重登帝位。\n\n儘管德皇已經誓言要讓德意志重回往昔的榮光，但其國家外交方針究竟如何，還有待進一步觀察。"
 wtt_news.3.a: "皇帝陛下萬歲！"
 wtt_news.3.b: "夢迴世紀之初？"
 wtt_news.3.c: "我國已盡到了對這位陛下的安全保障義務。"
 wtt_news.3.d: "我們本應該加大力度迫使荷蘭人將其引渡！"
 wtt_news.4.t: "威廉二世從荷蘭軟禁中獲救"
 wtt_news.4.desc: "儘管荷蘭徒勞地試圖阻擋德軍前進的步伐，但面對德國壓倒性的戰力，荷蘭政府最終別無選擇只能宣告投降。德軍將老德皇從軟禁地多倫莊園當中解救，旋即帶他返回柏林，隆重地重登帝位。\n\n儘管德皇已經誓言要讓德意志重回往昔的榮光，但其國家外交方針究竟如何，還有待進一步觀察。"
 wtt_news.4.a: "任何人都不可忤逆德意志帝國！"
 wtt_news.4.b: "不過是荷蘭人的愚蠢行徑。"
 wtt_news.4.c: "也許這本就不是個好主意……"
 wtt_news.5.t: "墨索里尼遇刺"
 wtt_news.5.desc: "來自羅馬的報告稱，今天早些時候，意大利領袖墨索里尼在光天化日之下於街頭遭到槍殺。而與此同時，意大利政府中的部分成員旋即發難，從法西斯黨成員手中奪取了政權。此外，大規模的逮捕行動亦同步展開，軍隊查封了若干政府大樓及街道，並且設置了宵禁。\n\n根據政變後的新政府發言人所稱，他們宣誓效忠於維托里奧·埃馬努埃萊三世。而作為意大利領導人所簽發的第一道敕令，國王與德意志帝國正式締結盟約。"
 wtt_news.5.a: "行事順利。"
 wtt_news.5.b: "國王陛下萬歲！"
 wtt_news.5.c: "德國人肯定是幕後黑手……"
 wtt_news.6.t: "奧匈帝國的重建"
 wtt_news.6.desc: "日前，多瑙河畔的原奧匈帝國繼業者諸國，在歷經了贊成帝國復辟思潮的洗禮後，現已在[From.GetOldNameDef]的主持下，正式公投決定將其各自的國家再次重組為奧匈帝國。\n\n而新的奧匈帝國政府亦立即採取行動，與德意志帝國正式締結了盟約，公開支持德國反對英法的外交政策。"
 wtt_news.6.a: "這一切甚至是兵不血刃。"
 wtt_news.6.b: "再次團結起來！"
 wtt_news.6.c: "新的歐陸陣營集團？令人擔憂"
 wtt_news.7.t: "波蘭歸還但澤"
 wtt_news.7.desc: "波蘭政府現已接受了德國關於用但澤換取武裝庇護的提案。根據已簽訂的條約，德國人將會在任何針對波蘭人的敵對行徑當中向後者施以援手。\n\n儘管代價高昂，並且再次使波蘭徹底失去了出海口，但此舉很有可能將在該國面對東方共產主義威脅時發揮作用。"
 wtt_news.7.a: "“但澤或戰爭”？哈，外交上的再次勝利！"
 wtt_news.7.b: "但願這值得如此的付出。"
 wtt_news.7.c: "德國人這是在插手我們的勢力範圍……"
 wtt_news.7.d: "“雙贏”？且讓我們拭目以待。"
 wtt_news.8.t: "德國內戰結束"
 wtt_news.8.desc: "肆虐德國全境的內戰即將塵埃落定。由於納粹黨徒狂熱而又絕望的頑抗，這場戰爭所造成的慘烈破壞甚至不禁讓人將其與上次大戰相提並論。\n\n希特勒似乎已然身死，而其他納粹軍政領導人們也均被監禁或處決。臨時政府日前宣佈，在有能力推進憲政改革事宜前，他們將致力於確保對全國的控制，並努力使秩序與穩定重回這個國家。"
 wtt_news.8.a: "且讓重建趕緊開始吧。"
 wtt_news.8.b: "讓我們希望新政權能更加通情達理……"
 wtt_news.9.t: "蘇聯宣佈開展大規模演習"
 wtt_news.9.desc: "作為對其所謂的“德國日益敵對言論”的回應，蘇聯軍方日前宣佈將在今年開展一系列大規模軍事演習。\n\n根據蘇聯政府發言人所說，希望本國對備戰事宜的加劇能夠“奉勸”德國人停止“他們不斷的惡意中傷及誹謗”。"
 wtt_news.9.a: "此舉可謂正中下懷！"
 wtt_news.9.b: "此舉定會令他們有所忌憚。"
 wtt_news.9.c: "希望德國人不會讓我們失望……"
 wtt_news.9.d: "這對緩和局勢沒有半點幫助……"
 wtt_news.10.t: "蘇聯加強軍隊建設"
 wtt_news.10.desc: "作為對德國近來宣佈組建所謂“抵抗蘇聯侵略”的中歐同盟的回應，蘇聯政府日前採取行動，開始大規模提升其軍工生產及製造。\n\n一位克林姆林宮的發言人態度明確地指出，蘇聯絕不會坐視如此威脅在其邊境肆意滋生，他們必定且已經對此作出了反制措施。"
 wtt_news.10.a: "他們還在渾然不覺地推動我方大業！"
 wtt_news.10.b: "他們定不敢嘗試更愚蠢的事情！"
 wtt_news.10.c: "至少已經就此組建了聯盟。"
 wtt_news.10.d: "局勢正在迅速升級……"
 wtt_news.11.t: "蘇聯決意捍衛勢力範圍"
 wtt_news.11.desc: "作為對某個毗鄰國家近來入夥[GER.GetFactionName]的回應，蘇聯政府日前發出了明確的警告，稱不要再進一步干涉其“勢力範圍內事務”。\n\n而未經證實的報告表明，蘇聯軍隊正在動員，很有可能正在準備戰爭。"
 wtt_news.11.a: "我們終於把他們逼到極限了？"
 wtt_news.11.b: "我們必須保衛本國的邊境！"
 wtt_news.11.c: "我們能夠攜手對抗他們！"
 wtt_news.11.d: "那麼這就是導火索？"
 wtt_news.11.e: "我們必須整軍備戰！"
 wtt_news.12.t: "抗議德皇復辟升級為戰爭"
 wtt_news.12.desc: "作為對[GER.GetAdjective]決意令威廉二世返國復位的回應，[FRA.GetNameDef]和[ENG.GetNameDef]日前正式對[GER.GetNameDef]宣戰。[FRA.GetAdjective]和[ENG.GetAdjective]均表示是“臭名昭著的[GER.GetAdjective]式固執”縱容一個“人盡皆知的戰犯”再度成為國家領導人，導致瞭如今局勢的惡化。\n\n儘管兩國政府發言人明確指出，縱容一個上次大戰的“主要煽動者”重登[GER.GetAdjective]帝位實屬不義，但[GER.GetAdjective]政府依舊對所有的警告置若罔聞。正如後者所言，“我們別無選擇”。"
 wtt_news.12.a: "他們還想對我國領導人說三道四？！"
 wtt_news.12.b: "他們這是逼著我們出手！"
 wtt_news.12.c: "那麼且讓我們夢迴1914吧。"
 wtt_news.13.t: "威廉三世妥協案"
 wtt_news.13.desc: "作為對英法兩國堅決反對威廉二世重登帝位一事的回應，德國政府現已提出了折中方案，即威廉二世可以維持其流亡生涯，但他的兒子威廉三世將即位成為德意志帝國的皇帝。\n\n此方案目前已被[ENG.GetNameDef]和[FRA.GetNameDef]所接受，但願歐洲列強間的和平能夠就此持續下去。"
 wtt_news.13.a: "我們別無選擇。"
 wtt_news.13.b: "幸虧德國人識時務。"
 wtt_news.13.c: "總算維持住了和平……"
 wtt_news.14.desc: "作為對德國決意令威廉二世返國復位的回應，儘管沒有得到英國人的支持，但[FRA.GetNameDef]還是對[GER.GetNameDef]正式宣戰。法方表示是“臭名昭著的德式固執”縱容一個“人盡皆知的戰犯”再度成為國家領導人，導致瞭如今局勢的惡化。\n\n儘管法國政府發言人明確指出，縱容一個上次大戰的“主要煽動者”重登帝位實屬不義，但德國政府依舊對所有的警告置若罔聞。正如後者所言，“我們別無選擇”。"
 wtt_news.14.c: "愚蠢而又固執的法國佬！"
 wtt_news.14.d: "但英國人又會怎麼做呢？"
 wtt_news.15.desc: "作為對法國堅決反對威廉二世重登帝位一事的回應，德國政府現已提出了折中方案，即威廉二世可以維持其流亡生涯，但他的兒子威廉三世將即位成為德意志帝國的皇帝。\n\n此方案目前已被[FRA.GetNameDef]所接受，但願歐洲列強間的和平能夠就此持續下去。"
 wtt_news.15.c: "幸虧德國人比法國人更識時務……"
 wtt_news.16.t: "中國向德國移交青島管治權"
 wtt_news.16.desc: "中國政府日前決定接受德國此前提出的要求，將其昔日的飛地青島返還。\n\n隨著德國人對該城的統治旋即恢復，德國政府正式將此地更名為舊日的德國名稱——德屬青島。"
 wtt_news.16.a: "我們終將重拾殖民時代的輝煌。"
 wtt_news.16.b: "這只不過是微小的代價。"
 wtt_news.16.c: "既然我們曾將其從他們手中剝奪，那如今也能！"
 wtt_news.16.d: "德國殖民主義再臨？"
 wtt_news.17.t: "日本向德國移交青島管治權"
 wtt_news.17.desc: "日本政府日前決定接受德國此前提出的要求，將其昔日的飛地青島返還。\n\n隨著德國人對該城的統治旋即恢復，德國政府正式將此地更名為舊日的德國名稱——德屬青島。"
 wtt_news.17.b: "他們竟敢將我國領土轉送他人？！"
 wtt_news.17.c: "就算是在1914年也應考慮我方立場。"
 wtt_news.18.t: "奧地利公投決定併入德國"
 wtt_news.18.desc: "自從[AUS.GetNameDef]和[GER.GetNameDef]間形成親密的盟友關係以來，贊成兩國合併的呼聲便在奧國境內愈發高漲。而根據昨天舉行的公投結果可以看出，壓倒性多數的奧地利人民均投票贊成與北方的兄弟合邦。\n\n目前對奧地利國家的整合工作正有條不紊地推進著，至今天早晨為止，作為獨立主權國家存在的舊奧地利業已成為歷史的篇章。"
 wtt_news.18.a: "為大德意志乾杯。"
 wtt_news.18.b: "如果這就是他們所願。"
 wtt_news.19.t: "波蘭歸還但澤和波茲南"
 wtt_news.19.desc: "面對蘇聯持續不斷的猛攻，波蘭政府在今天早晨突然宣佈將舊日屬於德國的但澤和波茲南兩處領土歸還給[GER.GetNameDef]。\n\n儘管波德兩國政府均對此事原由保持沉默，但有關專家們一致同意，這很有可能是波蘭方面基於軍事崩潰已近在咫尺的現狀，力圖使上述地區免遭蘇聯統治的嘗試。"
 wtt_news.19.a: "我們將誓死捍衛這些領土。"
 wtt_news.19.b: "這便是最好的選擇了……"
 wtt_news.19.c: "狡詐陰險的外交詭計！"
 wtt_news.19.d: "顯而易見的外交謀略……"
 wtt_news.20.t: "德國呼籲簽署反蘇條約"
 wtt_news.20.desc: "基於對蘇聯假定侵略行徑的評估，[GER.GetName]日前向“暴露在共產主義直接威脅下的諸國”提議組建聯手對抗[SOU.GetName]的同盟。一旦同盟中的任意國家遭到[SOU.GetName]的攻擊，那麼其他成員國均有義務施以援手。"
 wtt_news.21.t: "[From.GetNameDefCap]公開呼籲反[SOV.GetNameDef]"
 wtt_news.21.desc: "\n[FROM.GetAdjective]政府近來進一步強化了對[SOV.GetNameDef]的誹謗中傷，警告其東歐諸鄰國稱“巨大的赤色威脅”正籠罩著這片大陸。無論是出於恐懼還是有爭議的事實，但看起來[FROM.GetAdjective]人的目標顯然是力圖拉攏整個歐陸與東方相抗衡。"
 wtt_news.21.a: "世界必須知曉[SOV.GetAdjective]的威脅！"
 wtt_news.21.b: "他們竟敢這樣誹謗我們？！"
 wtt_news.21.d: "我們且看蘇聯人對此作何回應。"
 wtt_news.22.t: "[From.GetName]宣佈組建中歐同盟"
 wtt_news.22.desc: "德國繼續著他們近來的反蘇誹謗和中傷，現在甚至已經制定了具體的計劃來遏制蘇聯在歐陸其他地區的影響力。為此，一個新的聯盟體系——中歐同盟，現已被組建起來。德國人希望隨著時間的推移，這個同盟能夠為其成員國提供庇護，以對抗其所謂“蘇聯肆無忌憚的侵略行徑”。"
 wtt_news.22.a: "我們將領導歐洲自由國家抵禦共產主義威脅！"
 wtt_news.22.b: "他們正愈發威脅到我方的地位……"
 wtt_news.22.c: "德國人終於採取了行動。"
 wtt_news.22.d: "蘇聯人似乎不太可能坐以待斃……"
 wtt_news.23.t: "維希法國的末路"
 wtt_news.23.desc: "本週早些時候由德國發動，旨在吞併維希法國的行動現已宣告結束。德軍在法國艦隊收到自沉命令前便控制了作為其泊地的土倫港。如此一來，整個法國艦隊已經完好無損的落入了德國人的手中。"
 wtt_news.23.a: "巨大的成功！"
 wtt_news.23.b: "他們沒能履行自己的職責……"
 wtt_news.23.c: "德國人著實殘忍無情。"
 wtt_news.24.t: "法國艦隊自沉"
 wtt_news.24.desc: "本週早些時候由德國發動，旨在吞併維希法國的行動現已宣告結束。由於德軍沒能在法國艦隊收到自沉命令前控制作為其泊地的土倫港。因此，整個法國艦隊為避免落入德國人之手，全部自沉於海底。"
 wtt_news.24.a: "略有失望，但無傷大雅。"
 wtt_news.24.b: "他們到底貫徹了自己的職責。"
 wtt_news.24.c: "法國人抗爭的終幕。"
 wtt_burma_road.1.t: "滇緬公路遭到封鎖"
 wtt_burma_road.1.desc: "由於[occupying_country.GetAdjective]軍隊攻入[state_occupied.GetName]並在幾處要道切斷了滇緬公路的運輸，因此已經沒有補給能從這條交通線運送到我們這裡來了。"
 wtt_burma_road.1.a: "這也不會令局勢變得輕鬆。"
 wtt_burma_road.2.desc: "由於[From.GetAdjective]政府日前決定不再允許任何交通工具通過滇緬公路，因此路上的所有運輸隊均被截停並勒令返回，已經沒有補給能從這條交通線運送到我們這裡來了。"
 wtt_burma_road.2.desc_war_with_from: "由於[From.GetAdjective]軍隊沿著滇緬公路快速行進，造成了該條線路上的若干重要橋梁和路口的過載。目前這條線路已全面禁止交通運行，沒有補給能從這條交通線運送到我們這裡來了。"
 wtt_burma_road.3.t: "[From.GetNameDefCap]部分重開滇緬公路"
 wtt_burma_road.3.desc: "在成功收復滇緬公路的大部分沿線後，[From.GetAdjective]當局現已允許交通在沿線運行。儘管殘餘的敵軍襲擊致使運輸比往常更加危險，但至少補給已再次開始輸送。"
 wtt_burma_road.3.a: "良好的開端。"
 wtt_burma_road.4.t: "[From.GetNameDefCap]重開滇緬公路"
 wtt_burma_road.4.desc: "首批途徑滇緬公路的運輸隊在今天抵達了雲南，儘管距離整條線路交通暢行還有待時日，但至少補給已能再次運送到我們這裡來了。"
 wtt_burma_road.4.a: "此誠為雪中送炭。"
 wtt_ledo_road.1.t: "中印公路遭到封鎖"
 wtt_ledo_road.1.desc: "由於[occupying_country.GetAdjective]軍隊攻入[state_occupied.GetName]並在幾處要道切斷了中印公路的運輸，因此已經沒有補給能從這條交通線運送到我們這裡來了。"
 wtt_ledo_road.2.desc: "由於[From.GetAdjective]政府日前決定不再允許任何交通工具通過中印公路，因此路上的所有運輸隊均被截停並勒令返回，已經沒有補給能從這條交通線運送到我們這裡來了。"
 wtt_ledo_road.2.desc_war_with_from: "由於[From.GetAdjective]軍隊沿著中印公路快速行進，造成了該條線路上的若干重要橋梁和路口的過載。目前這條線路已全面禁止交通運行，沒有補給能從這條交通線運送到我們這裡來了。"
 wtt_ledo_road.3.t: "[From.GetNameDefCap]重開部分中印公路"
 wtt_ledo_road.3.desc: "在成功收復中印公路的大部分沿線後，[From.GetAdjective]當局現已允許交通在沿線運行。儘管殘餘的敵軍襲擊致使運輸比往常更加危險，但至少補給已再次開始輸送。"
 wtt_ledo_road.3.a: "良好的開端。"
 wtt_ledo_road.4.t: "[From.GetNameDefCap]重開中印公路"
 wtt_ledo_road.4.desc: "首批途徑中印公路的運輸隊在今天抵達了雲南，儘管距離整條線路交通暢行還有待時日，但至少補給已能再次運送到我們這裡來了。"
 wtt_ledo_road.4.a: "令人滿意的消息！"
 wtt_the_hump.1.t: "駝峰航運暫停"
 wtt_the_hump.1.desc: "由於[occupying_country.GetAdjective]攻佔了[state_occupied.GetName]境內的數個機場，該地往返喜馬拉雅山航線的航空運輸隊不得不被迫撤離。隨著敵方戰鬥機活動以及打擊距離增長所帶來的威脅，單次加油實現輸送已不太可能，空運至此只得暫停。已經沒有補給能從這條交通線運送到我們這裡來了。"
 wtt_the_hump.2.desc: "[From.GetAdjective]政府日前下令，從即刻起中止所有往返喜馬拉雅山航線的航班，儘管我們提出了抗議，但沒有跡象表明他們可能會重新考慮改變主意。"
 wtt_the_hump.2.desc_war_with_from: "由於[From.GetAdjective]軍隊攻佔了用於裝載駝峰航線補給的機場，導致我們無法再通過空運來獲得補給，已經沒有補給能從這條交通線運送到我們這裡來了。"
 wtt_the_hump.3.t: "[From.GetNameDefCap]重啟駝峰航運"
 wtt_the_hump.3.desc: "首批滿載著重要補給物資的[From.GetAdjective]航空運輸隊現已翻越喜馬拉雅山抵達，儘管敵軍活動仍對空中運輸造成了極大威脅，但至少補給已再次開始輸送。"
 wtt_the_hump.3.a: "良好的開端。"
 wtt_the_hump.4.t: "[From.GetNameDefCap]重啟駝峰航運"
 wtt_the_hump.4.desc: "喜馬拉雅山航線如今再次實現滿負荷運轉，伴隨著精密的航空運輸管制，大量我們所急需的物資源源不斷的抵達。"
 wtt_the_hump.4.a: "從天而降的援贈！"
 wtt_hanoi_route.1.t: "河內交通線遭到封鎖"
 wtt_hanoi_route.1.desc: "由於向北至中國邊境的線路遭到[GetVietnamOwner]關停，攜帶著我軍補給品的運輸船隊無法在河內港靠岸。\n\n已經沒有補給可以通過這條交通線進行運輸。"
 wtt_hanoi_route.2.desc: "[From.GetAdjective]地方當局日前收到命令，阻止任何用於戰爭目的的物資在河內卸貨並運往中國邊境。武裝警衛現已在碼頭佈防，以防任何人試圖冒險衝卡。而[From.GetAdjective]海岸警衛隊亦在相關海域驅離所有仍在逗留的船隻。\n\n已經不能指望通過這條交通線獲得補給了。"
 wtt_hanoi_route.2.desc_war_with_from: "日前控制河內的[From.GetAdjective]軍隊將一批為我方運送補給的貨船據為己有，而仍舊滯留海上的船隻也只能掉頭駛往其他中立港口。\n\n已經不能指望通過這條交通線獲得補給了。"
 CHI_vietnam_JAP: "日本軍方"
 CHI_vietnam_FRA: "法國當局"
 wtt_china.1.t: "[FROM.GetNameDefCap]要求我方臣服"
 wtt_china.1.desc: "看來[From.GetLeader]最終已經決定要在這廣袤的中華大地號令群雄。一位代表中央政府的特使現已抵達，要求我方服從[From.GetLeader]的領導。如若不從，他們就要用更為順從的地方政府班子來將我們取代。"
 wtt_china.1.a: "讓我們共就大業！"
 wtt_china.1.b: "那就讓他們試試看"
 wtt_china.2.t: "[From.GetLeader]表示服從"
 wtt_china.2.desc: "[From.GetLeader]已經恭送我方特使返回並捎帶上了他的口信，保證絕對服從我方命令並配合中央政府的指揮。"
 wtt_china.2.a: "公誠識時務俊傑也。"
 wtt_china.3.t: "[From.GetLeader]不服管轄"
 wtt_china.3.desc: "[From.GetLeader]致函回覆，稱中央政府沒有法定授權撤換地方的省督。除此之外，他還附帶了一份詳細的報告以彰顯其部隊的戰備情況。"
 wtt_china.3.a: "我們等著瞧吧。"
 wtt_china.10.t: "[FROM.GetName]要求歸附"
 wtt_china.10.desc: "[From.GetLeader]的政府日前送來了措辭強硬的信函，將我們過去幾個月裡制定的若干政策都數落了一番，指責我們的這些決議嚴重損害了[From.GetNameDef]的國家利益。如若我們今後不在政策上更為緊密地配合[From.GetAdjective]政府，他們屆時將採取“他們所認為必要的措施”。"
 wtt_china.10.a: "我們別無選擇"
 wtt_china.10.b: "我們將奮戰到底！"
 wtt_china.11.t: "[From.GetNameDefCap]表示服從"
 wtt_china.11.desc: "[From.GetAdjective]政府對我方此前的照會作出回應，保證其政府今後做出決定前定會先行請示我們的意見。我們駐[From.GetNameDef]的大使現已被晉升為特別代表，全權負責確保[From.GetAdjective]聽命於我方的控制。"
 wtt_china.11.a: "非常好！"
 wtt_china.12.t: "[From.GetNameDefCap]反對統一"
 wtt_china.12.desc: "我們此前發送給[From.GetNameDef]的外交照會現在被披露給了媒體，造成了輿論的一片譁然。如今，甚至是國際新聞都刊載了令人不快的社論，將我們合理的訴求抹黑為“插手他國內政”，“危險的先例”甚至是“赤裸裸的帝國主義行徑”。\n\n更不用說，[From.GetAdjective]政府也拒絕就此事展開進一步討論，還警告稱若是膽敢再提此事，便即刻中止雙方的外交往來。"
 wtt_china.12.a: "必須對此採取措施。"
 wtt_infiltration.1.t: "反滲透掃蕩"
 wtt_infiltration.2.t: "[infiltrated_state.GetName]發現共產黨地下組織"
 wtt_infiltration.2.desc: "根據我方有關機構的調查，日前在[infiltrated_state.GetName]發現了共產黨人的根據地。我軍應即刻出動以全力剿滅這夥赤匪，任何拖延都可能造成其進一步擴大根據地，使清剿行動變得更加困難。"
 wtt_infiltration.2.a: "立刻派軍鎮壓！"
 wtt_infiltration.3.t: "共產黨潛伏者尚存"
 wtt_infiltration.3.desc: "在近期對共產黨藏匿窩點的突襲行動中，我們的特務無功而返。儘管我們都知道仍有共產黨在境內潛伏著，但看起來他們的地下黨組織似乎尚未進行活動，亦或者說我們還根本不知道他們的存在。"
 wtt_infiltration.3.a: "我們定要將共匪斬盡殺絕！"
 wtt_infiltration.4.t: "共產黨滲透行動失敗？"
 wtt_infiltration.4.desc: "看來有關於共產黨廣泛滲透的報道似乎有些言過其實。鑑於我們對已知的共產黨藏匿窩點和激進黨羽的清剿皆無功而返，這意味著赤匪們尚未形成任何地下黨組織，或者說我們早已將其破壞殆盡。但我們還是必須保持警惕，畢竟在他們再次行動前，毫無疑問會試圖讓我們麻痺在虛幻的安全感當中。"
 wtt_infiltration.4.a: "希望我們已將共匪一網打盡了。"
 wtt_infiltration.5.t: "[infiltrated_state.GetName]根據地暴露"
 wtt_infiltration.5.desc: "國民黨巡邏隊已經逼近了我們在[infiltrated_state.GetName]的根據地。如果他們願意花費功夫，便很有可能在接下來策劃的軍事行動中徹底將該根據地剿滅。"
 wtt_infiltration.5.a: "希望事態不會進一步惡化。"
 wtt_infiltration.6.t: "[infiltrated_state.GetName]根據地遇襲"
 wtt_infiltration.6.desc: "敵軍現已正式對我們的[infiltrated_state.GetName]根據地發起了進攻。儘管我們還沒有收到當地同志的消息，但敵方的媒體報道業已宣稱“對[infiltrated_state.GetName]的圍剿作戰宣告結束”。我們必須做最壞的打算。"
 wtt_infiltration.6.a: "革命大業慘遭重創。"
 wtt_infiltration.10.t: "共產黨密謀武裝暴動"
 wtt_infiltration.10.desc: "看起來，共產黨正在謀劃著什麼。日前，我方情報機構抓獲了若干共產黨在其各根據地間往來的特派員，他們均攜帶著要在全國各隱蔽根據地同時發起“革命反攻”的機密指令。而大量共軍以及物資正被動員起來投向另一個主要行動——這很有可能是在全國範圍內發起暴動。我們必須即刻整軍備戰。"
 wtt_infiltration.10.a: "為中華之未來而戰！"
 wtt_infiltration.21.t: "[infiltrated_state.GetName]發現共產黨地下組織"
 wtt_infiltration.21.desc: "根據我方情報機關收集的信息，我們的巡邏隊現已發現了一處主要的共產黨根據地。在他們聚集更多力量並變得難以剷除前，我們應即刻發動打擊。"
 wtt_infiltration.21.a: "兵貴神速。"
 wtt_infiltration.23.t: "共產黨威脅衰退？"
 wtt_infiltration.23.desc: "儘管我們發起了一系列對已知共產黨藏匿窩點的突襲，但似乎並沒有得到關於其滲透狀況的情報。而與此同時，對於此前逮捕的共產黨人的嚴刑拷打同樣無功而返，未能探得什麼我們所不知道的信息。\n\n看起來只能說，我們的情報機關目前為止仍然牢牢掌控著局面。"
 wtt_infiltration.23.a: "我們應即刻清剿已知的地下黨組織。"
 wtt_infiltration.24.a: "希望我們已將共匪一網打盡了。"
 wtt_infiltration.24.t: "共產黨威脅被挫敗"
 wtt_infiltration.24.desc: "看起來，共產黨在最近幾個月裡遭到了嚴重的打擊和挫敗。我方特務正不斷截獲來自於共產黨中央要求其地方黨組織領導人彙報現狀的訊息——但上述地方領導人多已被逮捕，這些攜帶訊息的特派員也被我們埋伏並抓獲。就目前來說，共產黨似乎已相當被動，他們在地方層級的組織架構幾乎已被徹底粉碎。\n\n但即便如此，我們也仍必須保持警惕，畢竟只要共產黨一息尚存，他們就有可能捲土重來。"
 CHI_xian_warlords_upset: "此舉會招致各路軍閥的不滿。他們或許會考慮§R離開你的陣營§!，或者拒絕你將他們納入麾下的企圖，並且在未來相當的時間內將這件小事牢記於心。"
 wtt_xian_incident.1.t: "[From.GetLeader]致函邀約"
 wtt_xian_incident.1.desc: "[From.GetLeader]日前正式致函[CHI.GetLeader]，邀請其共會西安，商討當前的局勢以及對付共產黨的下一步計劃。\n\n若是拒絕赴約，則將被視作對[From.GetLeader]個人的輕慢，且此事勢必將為其他各路軍閥所牢記。"
 wtt_xian_incident.1.a: "欣然赴會。"
 wtt_xian_incident.1.b: "婉言謝絕。"
 wtt_xian_incident.2.t: "[From.GetLeader]抵達西安"
 wtt_xian_incident.2.desc: "[From.GetLeader]現已應邀抵達西安與我方共商國是，其身邊僅有少量警衛跟隨。無疑，此君希望我們重申堅決反共的立場。但鑑於日本人如今已兵臨城下，家國大義面前，我們或許需要開門見山，向他痛陳利害。"
 wtt_xian_incident.2.a: "“奉請”委座聯共抗日。"
 wtt_xian_incident.3.t: "[From.GetLeader]婉拒赴會"
 wtt_xian_incident.3.desc: "由於聲稱自己近來突染惡寒，[CHI.GetLeader]“極不情願地”謝絕了我們的邀約。而至於真實原因是他打算在不遠的將來更加直接地干涉我們地方政務，還是有人將我們的計劃提前洩露給了他，這就有待進一步的觀察了。"
 wtt_xian_incident.3.a: "也許他確有風寒？"
 wtt_xian_incident.4.t: "[From.GetLeader]提議聯共抗日"
 wtt_xian_incident.4.desc: "在日前西安舉行的會議上，[From.GetLeader]提出了出人意料的建議：他認為我們應該與共產黨締結同盟組成統一戰線，聯手對抗日本人的威脅。"
 wtt_xian_incident.4.a: "也許此言著實有理。"
 wtt_xian_incident.4.b: "我們都還記得上次合作的結局如何。"
 wtt_xian_incident.5.t: "[CHI.GetLeader]提議結盟"
 wtt_xian_incident.5.desc: "看起來，國民黨方面終於對將我們剿滅一事感到了厭倦。在日前西安舉行的會議上，[CHI.GetLeader]據說已經同意就聯合我方共抗日寇的可能性展開商討。\n\n對此，我們應該謹慎作出決斷。"
 wtt_xian_incident.5.a: "日寇才是更大的威脅。"
 wtt_xian_incident.5.b: "絕不和國民黨反動派談判！"
 reject_second_united_front_tt: "§R選擇此選項意味著第二次統一戰線不會組建§!"
 wtt_xian_incident.6.t: "[From.GetLeader]拒絕聯共抗日"
 wtt_xian_incident.6.desc: "儘管我們有充分的理由和要求來制止這場無意義的戰爭，但[From.GetLeader]最終還是拒絕與共產黨組成統一戰線共赴國難。而今之計，只能採取更加果斷決絕的措施，我們是否要將其逮捕並移交給共產黨人？"
 wtt_xian_incident.6.a: "我們別無選擇。"
 wtt_xian_incident.6.b: "如此局勢定易失控。"
 wtt_xian_incident.7.t: "[CHI.GetLeader]遭到[CHI_xian_instigator.GetNameDef]控制！"
 wtt_xian_incident.7.desc_a: "[CHI_xian_instigator.GetLeader]日前向我方發來急電，聲稱其現已將[CHI.GetLeader]逮捕，並且也願意將此君引渡予我方。\n\n這或許正是我們將這個人民公敵審判正法的最好機會！"
 wtt_xian_incident.7.desc_b: "[From.GetLeader]已經駁回了我方有關正法[CHI.GetLeader]的提案。相反，鑑於引領革命大業和抵禦日寇侵略兩事不可兼顧，我們還被指示應當與國民黨在當下結成同盟。"
 wtt_xian_incident.7.a: "請示蘇聯同志是否批准。"
 wtt_xian_incident.7.b: "直接將其梟首示眾！"
 wtt_xian_incident.7.c: "我們還是應該團結此君共同抗日。"
 wtt_xian_incident.7.d: "拒絕第二次統一戰線的提議"
 wtt_xian_incident.7.e: "$PRC_mao_zedong$和$PRC_zhang_guotao$都認為[CHI.GetLeader]不可信任。"
 wtt_xian_incident.8.t: "[CHI.GetLeader]被[From.GetLeader]控制！"
 wtt_xian_incident.8.desc: "我們日前截獲了[From.GetLeader]發出的訊息，稱他現已將[CHI.GetLeader]軟禁，並打算將其移交給共產黨人處置。而鑑於共產黨人與委座的血海深仇，他可能在共產黨手中活不了多久。\n\n如果我們不想看到[CHI.GetLeader]被[PRC.GetLeader]公審後處決的話，就必須立刻展開行動！"
 wtt_xian_incident.8.a: "立刻出兵展開救援！"
 wtt_xian_incident.8.b: "他們可不敢加害委座，靜觀其變吧。"
 wtt_xian_incident.9.t: "[CHI.GetLeader]遭到[CHI_xian_instigator.GetNameDef]控制！"
 wtt_xian_incident.9.desc: "[PRC.GetLeader]日前發來消息指出，中國共產黨人眼下正握有絕佳的機會，將[CHI.GetLeader]這個對人民和革命犯下累累罪行的戰犯予以審判。對此人的正法將是中國共產黨的巨大勝利，同時也會是中國革命的重大勝利。\n\n然而，如此一來也同樣會在這關鍵的時刻削弱國民黨的勢力，或許還會誘使日本人在未來對中國發起更進一步的侵略。"
 wtt_xian_incident.9.a: "又一個白匪頭子邁向了末日。"
 wtt_xian_incident.9.b: "他仍然還需要活著。"
 wtt_xian_incident.10.t: "[PRC.GetLeader]提議結盟"
 wtt_xian_incident.10.desc: "原本預期的公審和處決並沒有出現，相反，共產黨人表示他們願意正式締結盟約以共同抗擊日本人的侵略。\n\n顯然，在深知更進一步的圍剿會令他們徹底被抹殺的情況下，他們此舉意在拖延時間。但如果他們真的想要[CHI.GetLeader]的項上人頭，他肯定早就被處決了。\n\n另一方面，我國政府內的部分人士亦對共產黨人在如今推動雙方結盟的用意感到好奇——也許，他們知道些我們還不知道的？"
 wtt_xian_incident.10.a: "只要他們服從我方指揮。"
 wtt_xian_incident.10.b: "絕不和共匪談判！"
 wtt_china_shared.1.t: "[From.GetNameDefCap]提出支持"
 wtt_china_shared.1.desc: "[From.GetLeader]現已抵達我國首都討論我國形勢。他廣泛會見了獨立的活躍人士以及政府成員，明確指出我國的獨立對於[From.GetNameDef]的國家利益來說至關重要。因此，他們願意竭盡所能協助我國進一步獨立自主的嘗試。"
 wtt_china_shared.1.a: "他們的幫助令我等不勝感激。"
 wtt_china_shared.1.b: "我們對現狀很滿意。"
 wtt_china_shared.2.t: "[From.GetNameDefCap]接受我國支持"
 wtt_china_shared.2.desc: "在日前的一場秘密會談中，來自[From.GetNameDef]政府官方的人士對我們將如何支持其成為獨立國家的事宜表現出了極大的興趣。我們不僅為其擁護進一步獨立運動的團體調撥了大量的資金，同時也開始協助其組建“自由[From.GetAdjective]的臨時流亡政府”。"
 wtt_china_shared.2.a: "他們的鬥爭就是我們的鬥爭。"
 wtt_china_shared.3.t: "[From.GetNameDefCap]謝絕我方援助"
 wtt_china_shared.3.desc: "在一份措辭嚴肅的備忘錄中，[From.GetLeader]明確告知我方，他的政府絕不容許任何干涉[From.GetAdjective]內政的行為。該國外交部門現已將[From.From.GetLeader]列為不受歡迎的人士並禁止其入境，或者更準確地說，我們整個代表團的成員至此均被禁止再次踏足[From.GetNameDef]的領土。"
 wtt_china_shared.3.a: "真是自討沒趣。"
 wtt_china_shared.4.t: "[From.GetNameDef]獨立運動風起雲湧"
 wtt_china_shared.4.desc: "看來[From.From.GetLeader]最近對[From.GetNameDef]的訪問似乎並不僅僅是單純的品茶交流。鑑於近段時間來，該國那些此前原本各自為戰的獨立運動團體已開始極有組織地團結在一起，我們有理由相信他們得到了境外勢力的援助。"
 wtt_china_shared.4.a: "令人不安。"
 wtt_china_shared.10.t: "飛虎隊"
 wtt_china_shared.10.desc_a: "日前，蔣介石的夫人宋美齡，亦其最信任的幕僚之一啟程前往華盛頓，為中國抗擊日本侵略的戰爭謀取支援。中國空軍目前急需現代化的戰機以及駕駛它們的有經驗飛行員。\n\n可以說，宋美齡的遊說呼籲成功引起了我國民眾的同情，空軍中甚至有一些飛行員為此退役，隨後以提供“訓練和指導”的名義加入到中國飛行團之中。\n\n隨著飛行員問題的解決，宋美齡同時也與我方展開了接洽，請求獲准調配150架我方最先進的戰鬥機用以武裝中國的空軍力量。"
 wtt_china_shared.10.desc_b: "目前的中國戰事可謂讓中國空軍損失慘重，但面對在火力和數量上均壓倒自己的對手，他們仍然英勇地奮戰在天際，捍衛著本國的領空。\n\n儘管中國飛行員驍勇善戰，但[From.GetAdjective]的空軍急需得到新戰機和飛行員以補充損失。為此，[From.GetLeader]已派出了一個代表團趕赴華盛頓進行談判，力圖為本國爭取到150架現代化戰鬥機，以及同等數量的飛行員赴華參戰馳援。"
 wtt_china_shared.10.a: "我們必須竭盡所能地支援他們。"
 wtt_china_shared.10.b: "我們絕不能將自己捲入這場戰爭。"
 wtt_china_shared.11.t: "蘇聯志願航空隊"
 wtt_china_shared.11.desc_a: "面對持續不斷的中國戰事，[From.GetAdjective]紅軍的同志目前急需我們為其提供空中支援。[From.GetLeader]已就此事聯絡我方，請求我方派遣一支由志願飛行員和戰機組成的航空隊。他認為大約50架轟炸機和100架戰鬥機便足以捍衛其領空。\n\n這或許能夠為我方飛行員提供有價值的作戰經驗，同時也能在實戰中測試我們最新設計的機型。"
 wtt_china_shared.11.desc_b: "隨著中國的戰事繼續進行，[From.GetAdjective]空軍已經在試圖捍衛[From.GetNameDef]領空以及支援地面部隊的戰鬥中精疲力竭。[From.GetLeader]為此向[SOV.GetLeader]發出了個人的呼籲，希望後者能夠派遣一支由50架中型轟炸機以及100架戰鬥機組成的聯合航空隊來華支援。\n\n這或許是我們能夠在實戰中測試我國最新裝備的絕佳機會。"
 wtt_china_shared.11.a: "我們必須竭盡所能地支援他們。"
 wtt_china_shared.11.b: "他們或許只能用現有裝備奮戰到底。"
 wtt_china_shared.12.t: "援助[From.GetNameDef]的新任將領"
 wtt_china_shared.12.desc: "[From.GetLeader]日前致函[USA.GetLeader]，希望我方能夠派遣一位將軍擔任[From.GetAdjective]軍隊的總參謀長。\n\n若應允此事顯然能夠為我們贏得[From.GetLeader]個人的感謝，或許也能在幫助[From.GetLeader]的軍隊贏得戰爭的同時，使我們自己的將軍積累寶貴的經驗。\n\n那麼，我們要派遣哪位將軍赴任呢？"
 wtt_china_shared.12.a: "派遣約瑟夫·史迪威。"
 wtt_china_shared.12.b: "他們或許只能自求多福。"
 wtt_china_shared.12.c: "派遣道格拉斯·麥克阿瑟。"
 wtt_china_shared.12.d: "派遣德懷特·艾森豪威爾。"
 wtt_china_shared.13.t: "[CHI_USA_General.GetName]赴任中國"
 wtt_china_shared.13.desc: "[From.GetLeader]現已接受我方的求援請求，並指示[CHI_USA_General.GetName]儘快赴華就任。\n\n這位將軍不僅可被視作[Root.GetLeader]的顧問，同樣也可指揮部隊親赴戰場，在戰鬥中不斷獲取有關現代戰爭的最新經驗。"
 wtt_china_shared.13.a: "真是難能可貴的新援。"
 wtt_china_shared.14.t: "[From.GetNameDef]方面無人來援"
 wtt_china_shared.14.desc: "[From.GetLeader]對我們的請求置若罔聞。儘管有數位美軍的高級將領表示願意承擔此項任務，但是該國戰爭部長以及[From.GetLeader]總統還是以“不切實際”和“不符合國家利益”為由雙雙予以了回絕。"
 wtt_china_shared.14.a: "他們到底是懦夫還是蠢貨！？"
 wtt_prc.1.t: "[From.GetLeader]提議結盟"
 wtt_prc.1.desc: "歷經多年無意義的衝突後，面對日本人步步緊逼的威脅，共產黨人現已就組建聯合政府的事宜與我方展開了接洽。如此一來，雙方軍隊將並肩作戰，而彼此間的政策也能夠得到協調。\n\n儘管對於共產黨人突然轉變方略的動機尚不明確，但政府內部有人士認為，此不過是前者圖謀接管整個國家的第一步。"
 wtt_prc.1.a: "我們必須團結起來對抗共同之敵。"
 wtt_prc.1.b: "我們是不會被這種小把戲騙到的。"
 wtt_prc.2.t: "[From.GetLeader]拒絕結盟"
 wtt_prc.2.desc: "在深思熟慮之後，[From.GetLeader]最終還是決定驅逐我方的代表團。我們在政府內部的消息來源指出，由於此君目睹了共產黨人在各地的密謀，其堅信我們不過是打算從政府內部奪權，並將這個國家從他的掌控中偷走。"
 wtt_prc.2.a: "真是個偏執狂。"
 wtt_prc.10.t: "[From.GetNameDefCap]要求我方合作"
 wtt_prc.10.desc: "隨著國防政府的成立，[From.GetNameDef]現已明確表示不會再容忍任何“僭越獨立或妄自行徑之事”。鑑於和日本的戰爭已迫在眉睫，任何不配合國防政府的勢力都將被視作潛在的敵人。[From.GetLeader]公開揚言稱，他不會坐等到戰爭爆發才去消滅那些拒絕合作的軍閥。"
 wtt_prc.10.a: "我們會在國防政府中把握機遇。"
 wtt_prc.10.b: "那狂妄的白痴顯然是虛張聲勢"
 wtt_prc.11.t: "[From.GetNameDefCap]加入國防政府"
 wtt_prc.11.desc: "[From.GetLeader]深明大義並決定加入到我們的聯盟當中來，他的軍隊將會在接下來的戰事當中援助我方。"
 wtt_prc.12.t: "[From.GetNameDefCap]拒絕要求"
 wtt_prc.12.desc: "由於難以理解的原因，[From.GetLeader]在事關家國大義的核心事務上還是拒絕與我方合作。他蔑稱我們不過是一幫終將被歷史進程浪潮所吞噬的土匪流寇，甚至還呼籲其他各路軍閥也加入到他的抵制行列當中。"
 wtt_prc.12.a: "他這是敬酒不吃吃罰酒！"
 PRC_provoke_japan_korea: "朝鮮"
 PRC_provoke_japan_manchuria: "滿洲"
 wtt_prc.20.t: "來自中國的挑釁"
 wtt_prc.20.desc: "有關於最近發生於我國領土上襲擊事件的最新細節現已浮出水面。儘管迄今為止尚未能逮捕任何涉事者，但有證據表明，這顯然是中國人精心策劃的蓄意挑釁。\n\n不僅中國政府在對這起襲擊事件表示譴責的事宜上令人生疑的遲緩，中國的報紙新聞甚至已公然盛讚這次行動是抗擊“日本帝國主義”的英勇之舉。\n\n內閣現已對此召開會議，討論要如何應對這般明目張膽的襲擊。"
 wtt_prc.20.a: "要求官方致歉。"
 wtt_prc.20.b: "軍隊動員準備開戰。"
 wtt_prc.21.t: "軍用工廠毀壞案"
 wtt_prc.21.desc: "我們在[JAP.GetManchuriaPuppet]的工廠日前發來報告，稱昨晚該地發生了一場大火。當地消防部門目前仍在與火勢作鬥爭，但他們相信大火能夠在今天結束前得到控制。但由於火勢最先是從工廠的易燃化學品儲區爆發的，所以工廠本身遭到了嚴重的破壞。\n\n軍方情報部門現已展開調查，力圖查明在如此嚴格的安全保障措施下火災仍然發生的原因所在。而初步證據表明，這很有可能是一場人為的縱火。"
 wtt_prc.21.a: "誰會幹這種事！？"
 wtt_prc.22.t: "民用工廠毀壞案"
 wtt_prc.23.t: "橋梁垮塌案"
 wtt_prc.23.desc: "昨夜某時，一座[JAP.GetManchuriaPuppet]境內的主要橋梁在途經的軍火列車重壓下發生垮塌。車上軍火隨後的二次爆炸對搜救以及修復工作造成了巨大的困難，儘管車上乘員目前仍舊下落不明，但估計均已在此次事故中身亡。\n\n軍方情報部門已派遣了調查小組，正在確保安全的情況下儘速調查這樣一座堅固的大橋是怎樣在毫無預警的情況下發生垮塌的。\n\n根據當地目擊者的證詞，他們在事發前一天曾看到有一小群人在橋下的山谷間遊蕩，而這夥人目前下落不明。"
 wtt_prc.24.t: "巡邏隊遇襲案"
 wtt_prc.24.desc: "我們在[JAP.GetManchuriaPuppet]的一個巡邏隊日前下落不明。而沿著巡邏隊的行進軌跡，搜救隊伍最終發現了其慘烈的遇害現場，所有跡象都表明，巡邏隊是在遭遇突然襲擊後，在殘忍的近距離搏鬥中慘遭殺害的。\n\n目前尚不清楚是否有襲擊者在此事件中傷亡，現場僅留下了遍地的日軍士兵遺骸。\n\n他們看起來是故意將兵士們的屍體棄置荒野，或許是要以此傳遞某種訊息。"
 wtt_japan.1.t: "[From.GetNameDefCap]要求接管我國殖民地"
 wtt_japan.1.desc: "趁著我國而今式微之際，[From.GetAdjective]日前提議“幫助”我方“維持殖民地的秩序”。他們解釋說，鑑於我國本土業已陷落，我們已無力維持既有局面。\n\n很顯然這不過是他們打算奪取我國殖民地的託辭，但我們又能有什麼選擇呢？"
 wtt_japan.1.a: "是時候承認日本在東方的霸權了。"
 wtt_japan.1.b: "那就讓他們用武力來奪吧！"
 wtt_japan.2.t: "[From.GetNameDefCap]同意移交殖民地"
 wtt_japan.2.desc: "在仔細研討我方有關“維護”其殖民地秩序的提案後，[From.GetNameDefCap]方面最終決定接受，他們已經將其殖民地的全權正式移交予我方。"
 wtt_japan.2.a: "明智的決定。"
 wtt_japan.3.t: "[From.GetNameDefCap]拒絕移交殖民地"
 wtt_japan.3.desc: "在仔細研討我方有關“維護”其殖民地秩序的提案後，[From.GetNameDefCap]方面最終決定斷然予以回絕。"
 wtt_japan.3.a: "我們倒要看看他們能強硬多久。"
 wtt_japan.11.t: "對[From.GetNameDef]的互不侵犯條約之抉擇"
 wtt_japan.11.desc: "儘管近來[From.GetAdjective]和[Root.GetNameDef]兩國關係日趨緊張，但現在[From.GetAdjective]有意就雙方簽訂互不侵犯條約一事展開談判。誠然，此議案對我方的好處良多，但我們也應該考慮到如此將會給[From.GetAdjective]帶來什麼好處，以及我們將來是否會因此而後悔。"
 wtt_japan.11.a: "我們必須確保和平……至少暫時的。"
 wtt_japan.11.b: "絕不能讓他們佔任何的便宜！"
 wtt_japan.12.t: "[From.GetNameDefCap]接受互不侵犯條約"
 wtt_japan.12.desc: "[From.GetNameDefCap]已經正式接受了我方有關簽署互不侵犯條約的提案。"
 wtt_japan.12.a: "如此可謂正中下懷。"
 wtt_japan.13.t: "[From.GetNameDefCap]拒籤互不侵犯條約"
 wtt_japan.13.desc: "無論出於何種原因，[From.GetNameDef]還是對我方有關簽署互不侵犯條約的提案予以拒絕。"
 wtt_japan.13.a: "他們難道是在密謀對抗我們？"
 wtt_japan.21.t: "[From.GetAdjective]高層發生變動"
 wtt_japan.21.desc: "[From.GetAdjective]日前決定，將其左翼的公務員和將領傳召回國。而與此同時，也將他們那些右翼的公務員和將領以非正式流放的形式派遣到了我國作為替代。"
 wtt_japan.21.a: "看來[From.GetNameDef]國內正發生著什麼……"
 wtt_japan.22.t: "[Root.GetAdjective]高層人事調動完畢"
 wtt_japan.22.desc: "此前以非正式流放的形式派駐到[From.GetNameDef]的左翼公務員和將領們已被傳召回國，他們將被用以頂替那些右翼的同僚。高層的人事變動已圓滿完成。"
 wtt_japan.22.a: "這將有助於增強我們在[Root.GetNameDef]的勢力。"
 wtt_japan.31.t: "皇族的命運"
 wtt_japan.31.desc: "是時候來考慮天皇及其家族的命運了。顯而易見，世襲統治階級在我們正努力建設的新日本當中沒有容身之所。那麼應該如何處置他們呢？"
 wtt_japan.31.a: "將皇族驅逐出境！"
 wtt_japan.31.b: "將皇族梟首正法！"
 wtt_japan.32.t: "流亡的皇族"
 wtt_japan.32.desc: "新生的[From.GetNameDefCap]政權日前宣佈，將自古以來便統治著這個國家的天皇家族驅逐出境，而如此冒失之舉，或可令我方受益匪淺！目前，那位天皇陛下已經抵達[Root.GetNameDef]，儘管他遭到罷黜流放，但作為神君，他在人民和軍隊當中的影響力依舊無與倫比。"
 wtt_japan.32.a: "我們必須無愧天皇新居之責！"
 wtt_japan.101.t: "滿洲歸還案"
 wtt_japan.101.desc: "在近期擊敗[MAN.GetName]的勝利後，日本新政府基於本地區與中國緊密的歷史淵源，決定從即日起正式將此地的全權移交予我方。而隨此善意同時遞來的，還有他們的結盟提案。"
 wtt_japan.101.a: "也許真的可以和日本人攜手共進。"
 wtt_japan.101.b: "我們會收回東三省，但謝絕結盟的提案。"
 wtt_japan.102.desc: "[From.GetNameDefCap]對我們歸還滿洲的善舉表示感謝，同時也同意了我方的結盟提案。"
 wtt_japan.103.desc: "[From.GetNameDefCap]對我們歸還滿洲的善舉表示感謝，但是婉言謝絕了我方的結盟提案。"
 wtt_japan.104.t: "菲律賓主權案"
 wtt_japan.104.desc: "[From.GetNameDefCap]日前發表公開聲明稱，他們“絕不會再坐視”一個受到西方列強所操縱的國家存續於其勢力範圍內。為此，他們現在要求我國加速去殖民化進程，立即賦予菲律賓人全面而徹底的國家主權。"
 wtt_japan.104.a: "他們在理，菲律賓人應當獲得自由。"
 wtt_japan.104.b: "菲律賓仍將隸屬於合眾國！"
 wtt_japan.105.desc: "[From.GetNameDefCap]已經回應了我方有關菲律賓全面獨立的要求，目前，美國政府正著手即刻推進授予這個太平洋屬國徹底的獨立主權。"
 wtt_japan.105.a: "還好他們明事理。"
 wtt_japan.106.desc: "[From.GetNameDefCap]已經回應了我方有關菲律賓全面獨立的要求，重申菲律賓在此地區代表了“至關重要的美利堅國家利益”。"
 wtt_japan.106.a: "就這他們還有臉自詡“自由衛士”？！"
 wtt_japan.107.desc: "[From.GetNameDefCap]已經回應了日本要求實現我國全面獨立的要求，目前，美國政府正著手即刻推進授予我國徹底的獨立主權！"
 wtt_japan.107.a: "讚美日本朋友！"
 wtt_japan.108.t: "少壯派軍官發動政變"
 wtt_japan.108.desc: "日前，皇國軍隊中的一群少壯派軍官發生了暴動，將包括首相在內的諸多政府閣僚殘忍殺害。他們目前已經佔領了東京市區，同時也將皇居置於其掌控當中。起事者們聲稱，他們今日之舉是為了清洗政府當中的“腐敗之徒”，挽救“國體之危”，重振天皇陛下作為君王至高無上的地位。\n\n由於他們的起事出乎意料地在軍隊當中吸引了大批的追隨者，以至於本該作出的反制行動也在這幫人對舊政府忠誠派的大規模逮捕和刺殺行動當中被先行剿滅。而由於事發突然且事態的發展迅速，同時皇居亦被叛軍所控制，天皇陛下本人並未對這幫叛軍降下聖怒表示責罰。\n\n鑑於政府方面有組織的抵抗似乎已經土崩瓦解，可以想見，距離叛軍方面正式宣佈天皇陛下獨斷皇國內外並建立由陛下統攬軍政大權的皇道政制，只是時間問題了。"
 wtt_japan.108.a: "天皇陛下萬歲！"
 wtt_japan.109.t: "日本提議締結三國同盟條約"
 wtt_japan.109.desc: "[From.GetNameDefCap]日前正試探性的詢問我方是否有意願，和[JAP_initiator.GetAdjective]以及[ITA_fascism.GetAdjective]簽署三國同盟條約。[JAP_initiator.GetAdjective]認為在如今全球輿論日益敵對我等的情況下，我們很有必要互幫互助。"
 wtt_japan.109.a: "不錯的方案，我們加入。"
 wtt_japan.109.b: "不行，我們擔不起惹惱世界的風險。"
 wtt_japan.110.desc: "[JAP_initiator.GetNameDefCap]日前正試探性的詢問我方是否有意願，和[JAP_initiator.GetAdjective]以及[GER_fascism.GetAdjective]簽署三國同盟條約。[JAP_initiator.GetAdjective]認為在如今全球輿論日益敵對我等的情況下，我們很有必要互幫互助。[GER_fascism.GetAdjective]方面亦對這一看法深表贊同。"
 wtt_japan.111.t: "三國同盟條約的簽署"
 wtt_japan.111.desc: "[GER_fascism.GetAdjective]和[ITA_fascism.GetAdjective]政府均已同意簽署三國同盟條約，保證一旦開戰定將站到我方這邊。"
 wtt_japan.112.t: "[From.GetNameDefCap]拒籤三國同盟條約"
 wtt_japan.112.desc: "[From.GetAdjective]政府仍然想要自行其是，因此拒絕簽署三國同盟條約。"
 wtt_japan.113.t: "[From.GetNameDefCap]簽署三國同盟條約"
 wtt_japan.113.desc: "[ITA_fascism.GetAdjective]政府同意簽署三國同盟條約，保證一旦開戰定將站到我方這邊。"
 wtt_japan.114.t: "民主派發動政變"
 wtt_japan.114.desc: "在軍部威脅要再次剝奪人們來之不易的民主權利後，政府中的民主派日前出人意料地發動了政變奪權。由於行動迅速，有相當一部分軍隊成員也調轉槍口，前去捍衛人民以及他們與生俱來的自由權利。\n\n軍隊內部的分裂幫助人民的代表們奪取了立法以及行政機關的大權，儘管這場內戰才剛剛開始，但顯然目前的政府是難以被輕易撼動了。"
 wtt_japan.114.a: "軍部之流再不能作威作福了！"
 wtt_japan.115.t: "[From.GetName]進攻蘇聯"
 wtt_japan.115.desc: "[From.GetNameDefCap]日前無視我們與蘇聯的互不侵犯條約，單方面向其發動了進攻。我們如今別無選擇，要麼遵照盟約加入到[From.GetAdjective]的進攻當中，要麼恪守和蘇聯人的互不侵犯條約，對此次進攻表示譴責。"
 wtt_japan.115.a: "我們當然會支持盟友！"
 wtt_japan.115.b: "和蘇聯的條約暫時……還不能打破。"
 wtt_japan.116.t: "[From.GetName]參戰"
 wtt_japan.116.desc: "儘管與蘇聯人此前訂有互不侵犯條約，但[From.GetNameDefCap]還是決定加入到我們對抗前者的戰爭當中。"
 wtt_japan.116.a: "他們理應如此。"
 wtt_japan.117.t: "[From.GetName]譴責我國戰事"
 wtt_japan.117.desc: "儘管我們此前訂有同盟條約，但[From.GetNameDefCap]還是決定遵守他們與蘇聯人的互不侵犯條約。同時，似乎是為了挽救他們與蘇聯的外交關係，他們還公開譴責了我方所發起的進攻性戰爭。"
 wtt_japan.117.a: "真是太不走運了。"
 wtt_japan.118.t: "[From.GetName]請求支援"
 wtt_japan.118.desc: "[From.GetNameDefCap]目前正身陷一場毀滅性的內戰當中，且在軍事實力上落後於他們當前所面對的敵人。為此，他們的過渡政府日前與我方派駐代表展開接洽，提議以南薩哈林島作籌碼從我們這裡換取他們所急需的軍事援助。\n\n只需要派遣若干志願部隊便能換取領土，這或許是極為輕鬆的差事。"
 wtt_japan.118.a: "絕妙的主意！"
 wtt_japan_118_TT: "如果§Y[From.GetName]§!贏得內戰，這些志願兵將重歸人力池。"
 wtt_japan.118.b: "這對我們可不是好的交易。"
 wtt_japan.119.t: "[From.GetName]接受交換提案"
 wtt_japan.119.desc: "[From.GetNameDefCap]同意了我們以南薩哈林島換取他們軍事援助的提案，他們現已派出了若干“志願者”組成的師團與我們並肩作戰！"
 wtt_japan.119.a: "他們正派得上用場！"
 wtt_japan.119.TT: "獲得8個由§Y12個步兵營§!和§Y3個支援連隊§!組成的師。"
 wtt_japan.120.t: "[From.GetName]拒絕交換提案"
 wtt_japan.120.desc: "[From.GetNameDefCap]通知我方，稱他們對南薩哈林島換取其軍事援助一事予以拒絕。"
 wtt_japan.120.a: "那我們只能靠自己了……"
 wtt_japan.121.t: "[From.GetName]攻佔東京"
 wtt_japan.121.desc: "隨著[From.GetNameDefCap]攻佔日本的首都，[From.From.GetAdjective]的法西斯政權正式宣告倒臺。因此，若我們想有所動作，就必須儘速行動。對於我們而言，遏制共產黨威脅的關鍵，在於利落果斷地控制日本的外海諸島並且收編殘餘的法西斯黨羽。"
 wtt_japan.121.a: "實施此項計劃。"
 wtt_japan.121.b: "如此並不符合我方利益。"
 wtt_japan.122.t: "法西斯殘部逃亡滿洲"
 wtt_japan.122.desc: "隨著東京的陷落，法西斯政府正式宣告倒臺，而他們殘存的黨羽和軍隊現在已經逃亡到了[MAN.GetName]，該國不久前剛剛出兵佔據了我國的外海諸島以及在朝鮮和中國的殖民地。\n\n內戰儘管在短時間內落下了帷幕，但局勢依舊並不太平，畢竟那些法西斯分子還未遭到徹底性的毀滅打擊。"
 wtt_japan.122.a: "我們稍後就料理他們"
 wtt_japan.123.t: "法西斯殘部抵抗瓦解"
 wtt_japan.123.desc: "隨著東京的陷落，法西斯政府徹底土崩瓦解。由於他們殘餘的黨羽和軍隊無處集結再戰，只得四散而逃，我方得以輕易攻佔了剩餘的海外領土。"
 wtt_japan.123.a: "內戰勝利了！"
 wtt_japan.124.t: "赴日誌願軍歸國"
 wtt_japan.124.desc: "隨著日本的共產黨同志取得勝利，我們的志願軍戰士現在已經回到了他們的家鄉。"
 wtt_japan.125.t: "蘇聯歸還滿洲"
 wtt_japan.125.desc: "在將滿洲從日本人手中解放，並打倒了那個遜位的清朝皇帝后，[From.GetNameDef]日前正式提議將此地歸還給我們。他們認為，此地理應重歸[Root.GetAdjective]管轄。"
 wtt_japan.126.t: "[From.GetName]提議和談"
 wtt_japan.126.desc: "[From.GetAdjective]政府日前與我方展開接觸並提出和談，希望以其撤離大陸作為交換，即刻終止雙方之間的一切敵對行為。"
 wtt_japan.126.a: "戰爭至此宣告勝利。"
 wtt_japan.126.b: "我們只接受徹底的全面勝利！"
 wtt_japan.127.t: "[From.GetName]同意和談"
 wtt_japan.127.desc: "[From.GetNameDef]接受了我方此前的和談提案，並在得到我們於東亞大陸的全部領土後，全面終止了雙方之間的一切敵對行為。"
 wtt_japan.127.a: "他們不過是暫時取勝……"
 wtt_japan.128.t: "[From.GetName]拒絕和談"
 wtt_japan.128.desc: "[From.GetNameDef]拒絕了我方此前的和談提案，他們發誓要繼續戰爭，直至我國無條件投降。"
 wtt_japan.128.a: "那我們就奉陪到底！"
 wtt_japan.40.t: "[From.GetLeader]索取滿洲"
 wtt_japan.40.desc: "幾天前，[From.GetNameDef]政府開始不斷向我方施壓，在各大報紙頭條上呼籲我們將滿洲交還給[From.GetAdjective]管轄。這或許不僅僅是其為了內部需求而展開的造勢，畢竟就連[From.GetLeader]的代表也通過秘密外交渠道展開試探，希望就滿洲的未來歸屬問題達成協議。\n\n而就在今天，[From.GetLeader]本人甚至親自就此事發表看法，呼籲儘快實現將滿洲徹底交還給[From.GetNameDef]的進程。如若不然，他的政府或將重新考慮我等雙方目前的合作關係。"
 wtt_japan.40.a: "此地應歸他們所有。"
 wtt_japan.40.b: "他們尚還不能自行統治。"
 wtt_japan.41.t: "[From.GetNameDef]提供軍事援助"
 wtt_japan.41.desc: "日本帝國大本營現已決定從根本上轉變其國家戰略。在日前一場天皇列席的御前會議上，陸軍大臣就未來可能與蘇聯間爆發的戰爭作出了假設和計劃。而為了準備這場戰爭，日本帝國陸軍認為至少要確保我軍有能力守住一部分前線，因此，我軍得以獲贈列裝大量僅稍有過時的武器裝備。"
 wtt_japan.41.a: "他們可真好。"
 wtt_news.25.t: "[JAP.GetNameDefCap]接管[From.GetAdjective]殖民地"
 wtt_news.25.desc: "鑑於目前[From.GetNameDef]的國勢衰微，[JAP.GetAdjective]近來屢屢向[From.GetAdjective]施壓要求接管其在東亞的殖民地或許並不足為奇。然而今天早晨，出乎所有人的意料，[From.GetAdjective]政府官方竟然真的宣佈，從即日起，[From.GetAdjective]的殖民地將正式轉交給[JAP.GetNameDef]管轄。"
 wtt_news.25.a: "屬於亞細亞人的亞細亞！"
 wtt_news.25.b: "歐洲的傷心日……"
 wtt_news.25.c: "這難道是殖民主義的末路？"
 wtt_news.26.t: "菲律賓獨立"
 wtt_news.26.desc: "作為[JAP.GetAdjective]方面施壓的結果，[From.GetAdjective]政府現已宣佈即刻終止[From.GetAdjective]對菲律賓群島的殖民統治。從今日起，該地的全權將被移交給[PHI.GetNameDef]。"
 wtt_news.26.b: "我們定要徹底砸碎殖民枷鎖。"
 wtt_news.26.c: "值得慶祝的一天！"
 wtt_news.27.t: "日軍少壯派軍官發動政變"
 wtt_news.27.desc: "日本軍隊中的一群少壯派軍官日前成功發動政變，在推翻該國政府的同時，也擁戴天皇再度成為了能夠獨斷日本國家乾坤的至高統治者。看起來，此事似乎是對政府內部的普遍腐敗以及敵對意識形態所發起的一場清洗。\n\n即使目前已經誓言要讓這個國家更加唯天皇的意志是從，起事的軍官們也還是宣佈他們會繼續發動清洗，“直到除盡政府和軍部中的國賊”。裕仁天皇本人就此事發表了簡短的聲明，在接受這些叛軍所帶給他的至高權力的同時，也明確表達了與中國和太平洋地區西方殖民列強的和解意願。"
 wtt_news.27.a: "萬歲！"
 wtt_news.27.b: "真糟糕……他們可沒向我們示好……"
 wtt_news.27.c: "這就能確保太平洋地區的和平嗎？"
 wtt_news.27.d: "真可謂事出突然。"
 wtt_news.30.t: "蔣介石遭處決"
 wtt_news.30.desc: "在遭到[CHI_xian_instigator.GetLeader]監禁後，蔣介石據報道已於今天早晨被共產黨的行刑隊擊斃。在針對其犯下的反黨反人民罪行召開了一場簡短的審判後，[PRC.GetLeader]宣佈對蔣介石判處死刑。即便是蘇聯政府代表親自出面，也還是沒能救下他的性命。\n\n[SOV.GetLeader]據稱對[PRC.GetLeader]的“背叛”極為震怒，他為此下令將中方的共產國際代表即刻扣押。\n\n作為繼任的國民黨新領袖，[CHI.GetLeader]已經發誓要為蔣介石報仇，將共產黨人徹底“抹殺”。"
 wtt_news.30.a: "他不過是罪有應得。"
 wtt_news.30.b: "他們公然謀殺卻還自命正義！？"
 wtt_news.30.c: "此事定將帶來連鎖效應。"
 wtt_news.30.d: "中國的未來將愈發動盪。"
 wtt_news.31.t: "蔣介石遭處決"
 wtt_news.31.desc: "在遭到[CHI_xian_instigator.GetLeader]監禁後，蔣介石據報道已於今天早晨被共產黨的行刑隊擊斃。在針對其犯下的反黨反人民以及叛國反革命罪行召開了一場簡短的審判後，[PRC.GetLeader]宣佈對蔣介石判處死刑。由於蘇聯代表在這場審判中充當了公訴人，坐實了[SOV.GetLeader]暗地裡支持這項決議的傳聞。\n作為繼任的國民黨新領袖，[CHI.GetLeader]已經發誓要為蔣介石報仇，將共產黨人徹底“抹殺”。"
 wtt_news.31.c: "我等所行皆為正義。"
 wtt_news.32.t: "蔣介石從軟禁中獲釋"
 wtt_news.32.desc: "在遭到[CHI_xian_instigator.GetLeader]監禁並隨後移交給共產黨人後，[CHI.GetLeader]據稱日前在廣泛的談判後被釋放。儘管具體細節尚不明確，但有證據表明，[PRC.GetLeader]就此提出了締結同盟以共抗日本人。不過雙方均對上述傳言表示否定，[PRC.GetLeader]甚至聲稱他寧可國破家亡也不願與國民黨人並肩作戰，[CHI.GetLeader]亦對這種觀點予以回敬。"
 wtt_news.32.a: "他們到底在對我們打什麼主意？"
 wtt_news.32.c: "就像是孩童間的吵鬧爭執……"
 wtt_news.32.d: "如此日本定會漁翁得利。"
 wtt_news.32.e: "吾輩正可藉此乘虛而入。"
 wtt_news.33.t: "[PRC.GetLeader]譴責國民黨之背叛"
 wtt_news.33.desc: "\n在日前與[CHI.GetLeader]的會晤結束後，[PRC.GetLeader]公開譴責對方“公然或暗地裡打算利用紅軍為國民黨以及其他反革命勢力牟利”。對此，[CHI.GetLeader]拒絕發表任何評論，只是揚言稱國軍已做好準備從任何外敵的兵鋒下保衛中國。\n\n據稱，兩位領導人在席間確有商討組建統一戰線抗擊日本的可能性。\n\n但這次會談破裂是否會造成國共兩黨再度兵戎相見，仍有待進一步觀察。"
 wtt_news.33.b: "我們怎會相信他們能洗心革面呢？"
 wtt_news.34.t: "飛虎隊的建立"
 wtt_news.34.desc: "基於中國方面此前提出希望美方派遣飛行員和設備組建志願部隊援華的提案，美國總統[USA.GetLeader]現已正式批准向中國空軍移交100多架現代化戰鬥機。而來自美國陸軍、海軍以及海軍陸戰隊的若干飛行員們亦將加入到這支志願航空隊當中。\n\n只待必要的設備裝載完畢，運送這些新戰鬥機的首批船運便會起航。另一方面，國會當中的部分領導人對此事表達了擔憂，認為如此試探國際法邊緣的舉動，或許將會引起某些不可知的後果。"
 wtt_news.34.a: "狩獵愉快！"
 wtt_news.34.b: "歡迎諸位美利堅勇士。"
 wtt_news.34.c: "志願者？倒毋寧說是僱傭兵！"
 wtt_news.34.d: "美利堅孤立主義的終結？"
 wtt_news.35.t: "上海事變"
 wtt_news.35.desc: "中日兩國之間緊張的局勢，伴隨著昨晚雙方在上海的衝突急速升溫。\n\n根據西方觀察員的報告，事件的起因是一夥日本水兵與中國警察發生了衝突，打鬥當中雙方均有人受傷。而隨後當一名日本巡邏兵過來查看狀況時，大批中國軍隊已經封鎖了現場並將鬧事的日本水兵逮捕，後者旋即被中方指控謀殺未遂。\n\n日本政府對此發表了措辭尖銳的警告，要求中方立刻釋放涉事水兵，否則他們將採取必要措施以確保其人員的人身自由。"
 wtt_news.35.a: "豈有此理！"
 wtt_news.35.b: "一切正照計劃進行。"
 wtt_news.35.c: "大戰將至。"
 wtt_news.35.d: "這似乎是有預謀的行動。"
 wtt_news.36.t: "蔣介石喪生空難"
 wtt_news.36.desc: "今天早些時候，[CHI.GetNameDef]的上空發生了一起悲劇，蔣介石所搭乘的專機在起飛後不久於半空中爆炸。儘管救援人員還在努力搜尋失事飛機的殘骸，但沒幾個人還抱著能夠找到生還機組成員或乘客的希望。\n\n看起來，蔣委員長夫婦應該都已經死於這場空難了。\n\n儘管繼任的中國新領導人[CHI.GetLeader]承諾定要徹查此次事故的原因，但大量的坊間傳言都稱這是一場謀殺蔣委員長的陰謀，畢竟很多人都將其視作一統中國境內各派勢力的障礙。"
 wtt_news.36.a: "又一個問題不必擔心了。"
 wtt_news.36.b: "這可不是什麼“意外”。"
 wtt_news.36.d: "真是悲劇啊。"
 wtt_news.37.t: "中華人民共和國宣佈成立"
 wtt_news.37.desc: "在日前舉行的勝利遊行上所發表的講話中，[PRC.GetLeader]自豪地宣佈“中國人民從此站起來了”，共產黨人在中國內戰當中成為了最後的贏家。隨著國民黨人的全面敗退，共產黨人在歷經數十年的鬥爭後，終於贏得了最後的勝利。從今往後，昔日僅能棲身於窮鄉僻壤當中的革命武裝，將會成為代表著中華人民共和國的合法正統政府。"
 wtt_news.37.a: "偉大的建國日！"
 wtt_news.37.b: "不過是走個形式。"
 wtt_news.37.d: "他們什麼也搞不出來的。"
 wtt_news.38.t: "[PRC.GetLeader]贏得黨內權力鬥爭"
 wtt_news.38.desc: "中國共產黨內部各派系間的紛爭，看起來終於要落下帷幕了。隨著[PRC.GetLeader]當選為新的最高領導人，毛澤東以及那些更為溫和的派系在黨內的影響力均已不再值得一提。由於[PRC.GetLeader]的勝利得到了蘇聯在背後的扶持，因此，[SOV.GetLeader]在此次鬥爭當中究竟扮演了怎樣的角色，一時間成為了熱議的焦點。"
 wtt_news.38.a: "願他領導黨走向勝利！"
 wtt_news.38.b: "不過是無關緊要。"
 wtt_news.38.c: "這會是有用的盟友。"
 wtt_news.38.d: "他可撿了個燙手山芋。"
 wtt_news.39.t: "對華安靖作戰"
 wtt_news.39.desc: "作為對近來遭遇一系列被其稱作“公然挑釁”的事故的回應，日本政府日前宣佈中國境內的某地區正存在著“武裝衝突”的問題。他們聲稱，鑑於[CHI.GetLeader]所領導的中央政府看起來似乎不願或者說沒有能力承擔起他們應盡的職責，日方將派遣一支“維持治安”的軍隊赴華以恢復秩序，並且防範未來可能的進攻。"
 wtt_news.39.a: "正如計劃的那樣。"
 wtt_news.39.b: "所以到底是誰幹的？"
 wtt_news.39.c: "我們都做了些什麼！？"
 wtt_news.39.d: "不過是顯而易見的託辭。"
 wtt_news.39.e: "他們將因此認識到自己的錯誤。"
 wtt_warlord.1.t: "[From.GetNameDefCap]致函表達忠心"
 wtt_warlord.1.desc: "鑑於中國中央政府無力保護人民免遭流寇以及赤匪的威脅，[From.GetLeader]終於明確了自己所處的境地並與我方展開接洽，希望我方能夠確保其當下的地位。他可以全力配合我方要求，並且允許我軍在其境內暢行無阻。但作為回報，他請求我們派出部分部隊來保護他的轄區，並且在將來我們重組中國之後還能記著他的功勞。"
 wtt_warlord.1.a: "終於來了個識時務之俊傑！"
 wtt_warlord.1.b: "我們可沒有在未來大業中給他們留位置。"
 wtt_warlord.2.t: "[From.GetNameDefCap]接受效忠"
 wtt_warlord.2.desc: "[From.GetAdjective]政府接受了我方此前的提案，但作為換取其庇護的代價，我們現在必須“著重考慮”他們所給出的建議。同時，一位[From.GetAdjective]政府的官員也已抵達，前來指導我方的大政方針。"
 wtt_warlord.2.a: "不過是偏安的微小代價。"
 wtt_warlord.3.t: "[From.GetNameDefCap]拒絕受領效忠"
 wtt_warlord.3.desc: "[From.GetAdjective]拒絕了我方此前的提案，甚至根本不願就此作出討論。他們聲稱，我們壓根就不是真正的國家政府，完全沒有資格和他們在談判桌前平起平坐。"
 wtt_warlord.3.a: "那我們就變得更強給他們瞧瞧。"
 wtt_britain_lease_azores.1.t: "[From.GetNameDefCap]請求租借亞速爾群島"
 wtt_britain_lease_azores.1.desc: "由於我國的亞速爾群島戰略地位極佳，是確保大西洋航線的重要基地，[From.GetAdjective]日前與我方展開接洽，請求在其戰爭期間租借該群島。他們表示，一旦戰爭結束，就會立刻將該地物歸原主。"
 wtt_britain_lease_azores.1.a: "這還是比強迫我們參戰好點……"
 wtt_britain_lease_azores.1.b: "那這又對我們有何好處呢？"
 wtt_britain_lease_azores.2.t: "[From.GetNameDefCap]接受提案"
 wtt_britain_lease_azores.2.desc: "由於理解我國正承擔著保衛他們免遭侵略的責任，[From.GetAdjective]政府現已接受我方請求，將亞速爾群島的管轄全權移交予我方。一支小規模的先遣隊現已抵達該群島，正著手在島上構建各項行動所需的基地。"
 wtt_britain_lease_azores.2.a: "日後將會證明此舉甚妙。"
 wtt_britain_lease_azores.3.t: "[From.GetNameDefCap]拒絕"
 wtt_britain_lease_azores.3.desc: "援引了其中立政策以及戰爭法案相關條例，[From.GetLeader]的政府對我們租借亞速爾群島作為基地的請求予以回絕。眼下，除非我們想法子把他們也拖到我們的戰車上加入這場戰爭，不然就沒辦法使這片群島為我方所用。"
 wtt_britain_lease_azores.3.a: "我們會記住此事的。"
 wtt_britain_lease_azores.4.t: "亞速爾群島租借案到期"
 wtt_britain_lease_azores.4.desc: "隨著歐陸的戰事落下帷幕，[POR.GetAdjective]政府日前提醒我們稱亞速爾群島的租借案僅在戰時有效，現在是時候將這片群島還給他們了。"
 wtt_britain_lease_azores.4.a: "英國人向來有借有還。"
 wtt_britain_lease_azores.5.t: "英國歸還亞速爾群島"
 wtt_britain_lease_azores.5.desc: "隨著歐陸的戰事落下帷幕，[From.GetNameDef]遵照協議將亞速爾群島還給了我國，我們現已派出一小隊官員前去收回管轄權。"
 wtt_britain_lease_azores.5.a: "這便是最好的結果了。"
 wtt_soviet_hold_city_t_success: "[soviet_city.GetName]堅守尚存"
 wtt_soviet_hold_city_d_success: "儘管敵軍的攻勢猛烈，但[soviet_city.GetName]的守軍仍然牢牢地牽制住了他們，守住了自己的陣地。侵略者在銅牆鐵壁的防守面前流盡了鮮血，每推進一步，他們都要付出高昂的代價。無論如何，屬於[state.GetName]英雄們的事蹟定將流傳千古！"
 wtt_soviet_hold_city_o_success: "[soviet_city.GetName]還是我們的！"
 wtt_soviet_hold_city_t_fail: "[soviet_city.GetName]陷落"
 wtt_soviet_hold_city_d_fail: "在集結了所有可用的部隊後，那些[controller.GetAdjective]入侵者終究還是擊垮了我們在[soviet_city.GetName]外圍的防禦。[controller.GetAdjective]軍隊正魚貫湧入整座城市，儘管我方守軍正在慘烈的巷戰當中拼死抵抗，但預計這座城市仍將在不日陷落。"
 decisions.1.t: "低階指揮官忠誠案"
 decisions.1.desc: "若干軍隊的低階指揮官目前對本國的領導層有些“不同的看法”。為了打消顧慮，我們應該把有限的精力和資源都集中到爭取某一潛在支持方上面，絕不可浪費資源在試圖爭取所有人的忠誠上面。"
 decisions.1.a: "無所謂，我們只需要有人來指揮部隊。"
 decisions.1.b: "我們至少還是要選拔有基礎能力的人選。"
 decisions.1.c: "擇優錄選，我們不應在這方面有所妥協。"
 decisions.1.d: "只有頂級精英方可選拔起用。"
 decisions.2.t: "高階指揮官忠誠案"
 decisions.2.desc: "若干軍隊的高階指揮官目前對本國的領導層有些“不同的看法”。為了打消顧慮，我們應該把有限的精力和資源都集中到爭取某一潛在支持方上面，絕不可浪費資源在試圖爭取所有人的忠誠上面。"
 wtt_soviet_hold_city_o_fail: "不過是微小的挫敗。"
 wtt_news.40.t: "蘇伊士運河損毀"
 wtt_news.40.desc_eng: "鑑於敵對勢力現已迫近蘇伊士運河，為避免如此重要的商業幹線落入敵人手裡，[From.GetNameDef]最終決定將其炸燬。而在一系列的船舶自沉封鎖、爆破以及鑽孔後，破壞工作可以說是完成了。之後若是想要再恢復運河的航行，或許需要數月時間以及大量的工業支持才能實現。"
 wtt_news.40.desc_not_eng: "在一場只能堪稱是悍勇無畏的軍事行動當中，[From.GetNameDef]成功地將蘇伊士運河這條重要的商業幹線予以毀壞。伴隨著一系列的船舶自沉封鎖、爆破以及鑽孔，破壞工作可以說是完成了。之後若是想要再恢復運河的航行，或許需要數月時間以及大量的工業支持才能實現。"
 wtt_news.40.a: "真是場災難！"
 wtt_news.40.b: "絕不能讓它為敵人所用。"
 wtt_news.40.c: "看來我們可不能再小瞧他們的決心了。"
 wtt_news.40.d: "我們已然斬斷其帝國的紐帶！"
 wtt_news.40.e: "對英國的沉重打擊！"
 wtt_news.40.f: "他們做出了正確的決定。"
 wtt_news.40.g: "此誠對盟友的巨大打擊……"
 wtt_news.40.h: "此舉將會震撼整個世界……"
 wtt_news.41.t: "巴拿馬運河損毀"
 wtt_news.41.desc_usa: "鑑於敵對勢力現已迫近巴拿馬運河，為避免如此重要的軍事通行幹線落入敵人手裡，[From.GetNameDef]最終決定將其炸燬。而在一系列的船舶自沉封鎖、爆破以及鑽孔後，破壞工作可以說是完成了。之後若是想要再恢復運河的航行，或許需要數月時間以及大量的工業支持才能實現。"
 wtt_news.41.desc_not_usa: "在一場只能堪稱是悍勇無畏的軍事行動當中，[From.GetNameDef]成功地將巴拿馬運河這條重要的軍事通行幹線予以毀壞。伴隨著一系列的船舶自沉封鎖、爆破以及鑽孔，破壞工作可以說是完成了。之後若是想要再恢復運河的航行，或許需要數月時間以及大量的工業支持才能實現。"
 wtt_news.41.a: "真是場災難！"
 wtt_news.41.b: "絕不能讓它為敵人所用。"
 wtt_news.41.c: "看來我們可不能再小瞧他們的決心了。"
 wtt_news.41.d: "他們的海軍自此相隔兩洋！"
 wtt_news.41.e: "對美國的沉重打擊！"
 wtt_news.41.f: "他們做出了正確的決定。"
 wtt_news.41.g: "此誠對盟友的巨大打擊……"
 wtt_news.41.h: "太平洋和大西洋又被分隔開了。"
 wtt_news.42.t: "蘇伊士運河修復"
 wtt_news.42.desc: "在花費了大量的工業投入後，[From.GetNameDef]終於設法修好了蘇伊士運河。今天早晨，在歷時半年多加班加點的修復工作後，這條連通地中海的重要商業幹線終於再度通航。"
 wtt_news.42.a: "帝國的紐帶再度連通。"
 wtt_news.42.b: "對我國而言必要的投入。"
 wtt_news.42.c: "這將幫上我們大忙。"
 wtt_news.42.d: "他們竟然又修好了……"
 wtt_news.42.e: "如此大家都將獲益。"
 wtt_news.43.t: "巴拿馬運河修復"
 wtt_news.43.desc: "在花費了大量的工業投入後，[From.GetNameDef]終於設法修好了巴拿馬運河。今天早晨，在歷時近一年加班加點的修復工作後，這條連通太平洋和大西洋的重要軍事通行幹線終於再度通航。"
 wtt_news.43.a: "兩洋間的紐帶再度連通。"
 wtt_news.43.b: "我等終可再度暢行於太平洋和大西洋兩岸。"
 wtt_news.43.c: "這將幫上我們大忙。"
 wtt_news.43.d: "他們竟然又修好了……"
 wtt_news.43.e: "如此大家都將獲益。"
 wtt_news.44.t: "[MAN.GetLeader]宣佈重拾天命"
 wtt_news.44.desc: "日前，中華帝國的大皇帝[MAN.GetLeader]，這位滿清帝室的正統嫡裔，如同他的列祖列宗般，身著華麗的龍袍端坐於龍椅之上，以天子萬歲之尊在紫禁城內依照傳統禮制舉行了他不同尋常的第二次登基大典，再度加戴真龍帝冕。依照傳統，[MAN.GetLeader]隆重宣佈他的天軍在中國內戰當中取得了勝利，他本人即為領導中國的真龍天子。\n\n這位皇帝有志於開疆拓土，而人們也拭目以待，看他是否能像其列位先帝那樣，開拓出“普天之下，莫非王土”的豐功偉業。"
 wtt_news.44.a: "真龍天子歸來。"
 wtt_news.44.b: "撥亂反正。"
 wtt_news.44.c: "他自以為是哪位呢？"
 wtt_news.44.d: "出乎意料的反轉。"
 wtt_news.44.e: "真是荒唐！"
 wtt_news.45.t: "[new_leader.GetLeader]奪得中國領導權"
 wtt_news.45.desc: "[old_leader.GetLeader]和[new_leader.GetLeader]這兩位領導人在歷經一系列權鬥交鋒後，前者日前終於承認了自己的失敗，並在自己的府邸召見了[new_leader.GetLeader]展開會談。在隨後兩個多小時的談判妥協後，[old_leader.GetLeader]最終同意向[new_leader.GetLeader]移交國家元首的權力，自己則退居為民國的行政院長。\n\n由於兩位領導人的支持者們均齊聚在府邸外，讓人不由得擔憂起隨後雙方是否會爆發衝突和騷亂。\n\n然而，並沒有出現暴力事件的報道。看起來，政權似乎是得到了平穩的過渡。"
 wtt_news.45.a: "政治，政治從未改變。"
 wtt_news.45.b: "絕佳的勝利。"
 wtt_news.45.c: "和平過渡終究是好的。"
 wtt_news.45.d: "他們或許恰好因此免遭內戰。"
 wtt_news.46.t: "[From.GetLeader]發表“一箇中國”政策"
 wtt_news.46.desc: "面對著大批支持者，[From.GetLeader]在今天宣佈了他的政府所推行政策的巨大改動。儘管在此前，[From.GetLeader]願意容忍中國部分地區享有極高的獨立自主權力，但現在，這等好事到此為止。從即日起，[From.GetNameDef]將被視作全中國唯一的合法政府，依法直接統轄全中國各地的領土。而任何膽敢拒絕來自中央政府命令的人，均將被視為叛國者，依法遭到嚴苛的懲治。\n\n然而，局勢還有待進一步觀察，[From.GetLeader]的政府或許真能兌現他們的威脅，亦或是僅僅將此作為拉攏民眾支持的手段。"
 wtt_news.46.a: "此誠公然之威脅。"
 wtt_news.46.b: "我等定將一統中華！"
 wtt_news.46.d: "多少英豪此前為此競折戟。"
 wtt_news.47.t: "[From.GetNameDefCap]宣稱印度支那主權"
 wtt_news.47.desc: "[From.GetLeader]的政府日前發表聲明稱，當前的印度支那局勢對[From.GetAdjective]的安全構成了直接的威脅。該國官方發言人表示，世界上沒有一個國家的政府會默視一把尖刀直插自己的軟肋。因此，除非本地區局勢緩和，亦或是[671.Controller.GetAdjective]當局更迭為更願與[From.GetNameDef]合作的存在，否則[From.GetAdjective]的國家利益便會一直受到威脅。\n\n雖然[From.GetLeader]的發言人強調[From.GetAdjective]政府願意努力採取和平手段以解決問題，但也絕不放棄動用武力的可能。"
 wtt_news.47.a: "總有人必須行應盡之惡。"
 wtt_news.47.b: "他們夠膽就來奪吧！"
 wtt_news.47.c: "不會因此發生壞事的。"
 wtt_news.47.d: "別逼我們走到那步！"
 wtt_news.48.t: "滿洲國發動獨立戰爭"
 wtt_news.48.desc: "隨著來自日本的派駐官員與[MAN.GetLeader]的政府之間一系列的內部權鬥愈演愈烈，有關於滿洲大地歸屬的爭鬥在今天終於達到了白熱化。\n\n根據報道，導火索來自於滿清宮廷內部的一次衝突，當時一位日本將軍嚴重冒犯了滿洲帝國皇帝，竟要求後者向其鞠躬。\n\n[MAN.GetLeader]對此龍顏大怒，在答曰“天子不折腰”後，便揮杖擊倒了此人。旋即他命令麾下的軍隊調轉槍口，立刻將所有日本駐軍從中華大地上驅逐出去。"
 wtt_news.48.a: "豎子的嚎叫？"
 wtt_news.48.b: "我們將重拾天命！"
 wtt_news.48.c: "那個小叛徒！"
 wtt_news.48.d: "正可謂……巨龍逐日？"
 wtt_news.50.t: "希特勒遇刺"
 wtt_news.50.desc: "德國電臺報道稱，該國軍隊當中的叛逆組織在今天發動了政變。伴隨著元首大本營的劇烈爆炸，希特勒被殺身亡，其他多人身受重傷。而與此同時，國防軍陸軍部隊也對若干黨衛隊辦公地點以及黨衛軍單位發起了攻擊。\n\n儘管[GER.GetLeader]聲稱他對國家以及軍隊掌有全權，但據報道，該國各地仍有大量忠誠派軍隊和叛軍之間的交火發生。\n\n而根據坊間傳言，納粹黨的其他領導人也正計劃在這場混亂當中搶班奪權。"
 wtt_news.50.a: "卑鄙的叛徒！"
 wtt_news.50.b: "局勢並未有所改善。"
 wtt_news.50.c: "謝天謝地！"
 wtt_news.50.d: "他確實太過嚴苛了。"
 wtt_news.51.t: "針對[GER.GetLeader]的暗殺企圖"
 wtt_news.51.desc: "德國電臺報道稱，該國軍隊當中的叛逆組織在今天發動了政變。儘管元首大本營發生了劇烈爆炸，但在其他多人身受重傷的情況下，希特勒本人竟然奇蹟般的僅受了些輕傷。而與此同時，國防軍陸軍部隊發起了進攻，試圖攻佔柏林城內的若干政府辦公地點。\n\n由於[GER.GetLeader]絕處逢生的消息很快便傳播開來，因此絕大部分叛軍部隊只得悻悻返回了自己的軍營。\n\n政變未遂後，多名德國高級軍官選擇自殺，以免落到那臭名昭著的“人民法庭”當中接受屈辱的審判。"
 wtt_news.51.c: "此即結局的開端？"
 wtt_news.52.desc: "德國電臺報道稱，由於元首本人在此前元首大本營的激烈交火中身受致命傷，因此[GER.GetLeader]在今天接管了政府的大權。黨衛軍部隊現已火速出動，控制了通往柏林城的各主要道路以及鐵路樞紐。與此同時，國防軍陸軍以及空軍部隊據稱也收到了命令，同時趕往柏林以恢復秩序。"
