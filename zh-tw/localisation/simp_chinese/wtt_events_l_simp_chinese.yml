 #Ask soviet for support
 wtt_warlord_vs_prc.1.t: "[warlord.GetLeader]懇求獲得支持"
 wtt_warlord_vs_prc.1.desc: "日前，一位代表[warlord.GetLeader]的特使抵達莫斯科，向我們試探性地詢問能否在其黨內的權力鬥爭當中提供支持。他們聲稱，[communist_china.GetLeader]沒有遠大的共產主義理想，思想覺悟實際上極為落後反動，甚至很有可能在當下的緊要關頭背叛革命。\n\n有鑑於此，[warlord.GetLeader]請求我們對其予以支持，他發誓將永遠忠於共產主義事業，尤其是服從[SOU.GetLeader]的領導。"
 wtt_warlord_vs_prc.1.a: "忠誠的傀儡或許會很有用。"
 wtt_warlord_vs_prc.1.a_tooltip: "如果遭到其拒絕，將導致與§H[communist_china.GetNameDef]§!開戰。\n"
 wtt_warlord_vs_prc.1.b: "我們不需要此等投機分子。"
 #soviet support new warlord and tells communist_china that they are done.
 wtt_warlord_vs_prc.2.t: "[soviet.GetLeader]致函照會"
 wtt_warlord_vs_prc.2.desc: "日前，[SOV.GetAdjective]政府的代表前來通知我方，稱[SOV.GetLeader]近來嚴重懷疑[communist_china.GetLeader]對馬克思主義理論的理解有誤。要知道，在中國階級鬥爭進入關鍵時刻的當下，我方絕不能在馬列主義的理解上偏離正軌。此外，莫斯科方面表示，他們認為[warlord.GetLeader]似乎對中國的共產主義事業有著更好的理解，因此，由[warlord.GetLeader]出任我黨的新主席或將能領導本黨走向更好的未來。當然，如若此建議不被採納，[SOV.GetLeader]同志定會有所不悅。"
 wtt_warlord_vs_prc.2.a: "由[communist_china.GetLeader]親赴莫斯科據理力爭。"
 wtt_warlord_vs_prc.2.b: "我們絕不會向叛徒屈膝臣服！"
 #soviet tells Warlord no support
 wtt_warlord_vs_prc.3.t: "[SOV.GetLeader]拒絕提案"
 wtt_warlord_vs_prc.3.desc: "[SOV.GetLeader]據稱仍然對我方的忠誠和領導能力保持懷疑，因此，[SOV.GetAdjective]政府將會繼續支持[communist_china.GetLeader]作為中國共產黨的主席。"
 wtt_warlord_vs_prc.3.a: "那此事就此作罷吧。"
 #Warlord is told they are now the new communist_china.
 wtt_warlord_vs_prc.4.t: "[communist_china.GetNameDefCap]讓位於賢"
 wtt_warlord_vs_prc.4.desc: "縱使[communist_china.GetLeader]竭盡全力，也還是無法說服[SOV.GetLeader]站到他一方。鑑於自己的敗局已定，[communist_china.GetLeader]只得公開檢討了自己的錯誤，承諾將與我們並肩戰鬥，直至革命的勝利。"
 wtt_warlord_vs_prc.4.a: "太好了。"
 ##Neighboring warlord told to join or die
 wtt_warlord_vs_prc.10.t: "屈從或是滅亡"
 wtt_warlord_vs_prc.10.desc: "在放棄掌權亦或是直面蘇聯恐嚇的抉擇當中，[communist_china.GetLeader]最終還是選擇了後者。但不幸的是，看起來[SOV.GetLeader]似乎不僅僅是虛張聲勢，而是直接挑起了敵對行動。我方不僅承受著雙方所施加的壓力，同時目前也正身處於危險的境地，畢竟蘇聯人已經發話，要我們出手幫他們一道罷黜這個黨的叛徒。\n\n他們警告，若是膽敢拒絕，則將被視作與[communist_china.GetLeader]同流合汙。"
 wtt_warlord_vs_prc.10.a: "不值得為[communist_china.GetLeader]陪葬……"
 wtt_warlord_vs_prc.10.b: "我們不會趟這道渾水。"
 #Soviet asks WTT_communist_china for more stuff after having supported them
 wtt_warlord_vs_prc.21.t: "[From.GetLeader]要求我方合作"
 wtt_warlord_vs_prc.21.desc: "來自[From.GetLeader]的指示已經送達，要求我們上交較此前商定的經濟援助條約更多的款項。"
 wtt_warlord_vs_prc.21.a: "這就是我們要付出的代價。"
 wtt_warlord_vs_prc.21.b: "這簡直是趁火打劫！"
 wtt_warlord_vs_prc.22.t: "[From.GetNameDefCap]接受要求"
 wtt_warlord_vs_prc.22.desc: "儘管[From.GetLeader]仍舊如往常般提出了抗議，但他還是乖乖同意上交我們加價過後的款項。"
 wtt_warlord_vs_prc.22.a: "他應該慶幸我們沒繼續抬高要價。"
 wtt_warlord_vs_prc.23.t: "[From.GetNameDefCap]拒絕"
 wtt_warlord_vs_prc.23.desc: "[From.GetLeader]斷然拒絕了我方要其上交額外款項的要求，聲稱他的勢力絕不會接受此等“荒謬”的提案。"
 wtt_warlord_vs_prc.23.a: "他早有承諾，我們必須得到所許諾之物！"
 wtt_warlord_vs_prc.23.b: "這次就放他一馬好了。"
 #Soviet asks WTT_communist_china to become puppet
 wtt_warlord_vs_prc.31.t: "[From.GetLeader]要求加強合作"
 wtt_warlord_vs_prc.31.desc: "[From.GetLeader]日前發來指示，稱鑑於我方當前的革命鬥爭階段極易遭到反革命勢力的反攻倒算，因此他的特別代表將被指派來關注我們的革命進程，並在爭取階級鬥爭勝利的過程中提供指導和建議。\n\n除此之外，指示還提到，任何對他“建議”的違背，都將被視作反動分子在我們政府內部掌權，屆時，他將採取必要的行動。"
 wtt_warlord_vs_prc.31.a: "我們熱烈歡迎能夠得到指導。"
 wtt_warlord_vs_prc.31.b: "我們不需要別人來指手畫腳。"
 wtt_warlord_vs_prc.32.t: "[From.GetNameDefCap]接受要求"
 wtt_warlord_vs_prc.32.desc: "[From.GetLeader]熱烈歡迎我方特別代表蒞臨，並且將其任命為他的私人顧問。我們現在可以很好地掌控他們的內政外交了。"
 wtt_warlord_vs_prc.32.a: "他可算是識時務。"
 wtt_warlord_vs_prc.33.t: "[From.GetNameDefCap]拒絕"
 wtt_warlord_vs_prc.33.desc: "儘管對於我們的觀點表示了尊重，但[From.GetLeader]還是委婉卻堅決地回絕了我方要求更為直接的對其政策施加影響的提案。他認為由於我方對本地的形勢“不太瞭解”，因此還是應該把馬克思主義的實踐交由本地的專家。"
 wtt_warlord_vs_prc.33.a: "或許我們需要更“明確”地重申己方立場。"
 wtt_warlord_vs_prc.34.t: "[From.GetNameDefCap]拒絕支付款項"
 wtt_warlord_vs_prc.34.desc: "[From.GetLeader]最終還是對我們以更強硬措辭提醒他兌付此前商定款項的要求置若罔聞。他甚至充耳不聞，拒絕前來莫斯科與我們解釋此事。"
 wtt_warlord_vs_prc.34.a: "所以他這是想試探我們？！"
 #PRC informed a warlord wants to create a faction
 wtt_warlord_vs_prc.35.t: "[From.GetAdjective]提議結盟"
 wtt_warlord_vs_prc.35.desc: "[From.GetNameDefCap]日前發出了提案，邀請中國共產黨人共同加入名為“人民陣線”的全新統一陣營。以在此陣營旗幟下，攜手擊敗國民黨、反動派以及其他外國侵略者。"
 wtt_warlord_vs_prc.35.a: "人民群眾才是真正的英雄！"
 wtt_warlord_vs_prc.35.b: "這不符合[Root.GetAdjective]的利益。"
 #If a human PRC rejects the faction, the warlord can dismantle it altogether
 wtt_warlord_vs_prc.36.t: "[From.GetLeader]拒絕結盟"
 wtt_warlord_vs_prc.36.desc: "[From.GetNameDefCap]對於組建人民陣線——這樣一個明顯有利於對抗國民黨、反動派以及其他外國侵略者的提案表示了拒絕。不僅如此，他們還說，與我方的聯盟將會“損害[From.GetAdjective]的利益”。"
 wtt_warlord_vs_prc.36.a: "那我們只能孤軍奮戰了。"
 wtt_warlord_vs_prc.36.b: "那我們也完全可以摒棄統一戰線！"
 wtt_manchukou.1.t: "[From.GetNameDefCap]號令天下臣服"
 wtt_manchukou.1.desc: "看來[From.GetLeader]最終已經決定要在這廣袤的中華大地凌駕天威。一位代表[From.GetAdjective]政府的特使現已抵達，要求我方向中華帝國無出其右的大皇帝、真龍天子[From.GetLeader]俯首稱臣。如若不從，這位特使補充道，便會因犯下忤逆聖意的滔天大罪遭到嚴懲。"
 wtt_manchukou.1.a: "看來所謂民國終究已是過往雲煙。"
 wtt_manchukou.1.b: "那就讓他試試看。"
 wtt_manchukou.2.t: "[From.GetLeader]俯首稱臣"
 wtt_manchukou.2.desc: "[From.GetLeader]已經恭送我方特使返回並捎帶上了他的口信，保證絕對服從我方命令，並尊奉[MAN.GetLeader]為全中國的真龍天子。"
 wtt_manchukou.2.a: "看來他很清楚自己的位置。"
 wtt_manchukou.3.t: "[From.GetLeader]拒不臣服"
 wtt_manchukou.3.desc: "[From.GetLeader]以通篇的粗鄙咒罵回覆了我們慷慨的提議，甚至還咄咄逼人地對我們[MAN.GetLeader]皇上尊貴的血統以及傑出的素養髮表了胡謅的評價。"
 wtt_manchukou.3.a: "讓我們來教教此等匹夫何謂禮節。"
 wtt_manchukou.11.t: "五年計劃"
 wtt_manchukou.11.desc: "論述我國政府將要如何在未來幾年內實現經濟增長的新訂五年計劃正趨於定案，但在發展的重心問題上，各部門間仍然存在著顯著的分歧。\n\n儘管重工業應被視作發展目標是眼下所達成的共識，但新興的工業產能應當投入哪個領域，目前仍然處於激烈的討論當中。\n\n為打破僵局，必須對此作出決斷了。"
 wtt_manchukou.11.a: "建立本國航空工業。"
 wtt_manchukou.11.b: "投資汽車製造工業。"
 wtt_manchukou.11.c: "部署總體工業化發展。"
 wtt_manchukou_bandit_sabotage.21.t: "軍用工廠毀壞案"
 wtt_manchukou_bandit_sabotage.21.desc: "我們在[FROM.GetName]的工廠日前發來報告，稱該廠昨晚發生了一場大火。當地消防部門目前仍在與火勢作鬥爭，但他們相信大火能夠在今天結束前得到控制。但由於火勢最先是從工廠的易燃化學品存儲區爆發的，所以工廠本身遭到了嚴重的破壞。\n\n軍方情報部門現已展開調查，力圖查明在如此嚴格的安全保障措施下火災仍然發生的原因所在。而初步證據表明，這很有可能是一場人為的縱火。"
 wtt_manchukou_bandit_sabotage.21.a: "必須將此等賊黨緝拿歸案！"
 wtt_manchukou_bandit_sabotage.22.t: "民用工廠毀壞案"
 wtt_manchukou_bandit_sabotage.23.t: "橋梁垮塌案"
 wtt_manchukou_bandit_sabotage.23.desc: "昨夜某時，一座[FROM.GetName]境內的主要橋梁在途經的軍火列車重壓下發生垮塌。車上軍火隨後的二次爆炸對搜救以及修復工作造成了巨大的困難，儘管車上乘員目前仍舊下落不明，但估計均已在此次事故中身亡。\n\n軍方情報部門已派遣了調查小組，正在確保安全的情況下儘速調查這樣一座堅固的大橋是怎樣在毫無預警的情況下發生垮塌的。\n\n根據當地目擊者的證詞，他們在事發前一天曾看到有一小群人在橋下的山谷間遊蕩，而這夥人目前下落不明。"
 generic.11.t: "內戰結束"
 generic.11.d: "撕裂我國的內戰終於塵埃落定，現在我們可以開始專注於團結人民以及重建家園的工作了。"
 generic.11.a: "我們將攜手共創未來！"
 generic.12.t: "[From.GetAdjective]企圖毀壞蘇伊士運河"
 generic.12.d: "軍事情報表明，[From.GetAdjective]正打算通過大規模的爆破和阻塞作業來破壞蘇伊士運河。如果想要阻止他們的話，我們的時間已相當緊迫。"
 generic.12.a: "絕不能允許此事發生！"
 generic.13.t: "[From.GetAdjective]企圖毀壞巴拿馬運河"
 generic.13.d: "軍事情報表明，[From.GetAdjective]正打算通過大規模的爆破和阻塞作業來破壞巴拿馬運河。如果想要阻止他們的話，我們的時間已相當緊迫。"
 generic.14.t: "[From.GetName]提出外交抗議"
 generic.14.d: "[From.GetAdjective]公使日前就我國軍事顧問團正派駐於其敵國境內一事，向我國政府提出了強烈的外交抗議。他們要求我們立即將該軍事顧問團從涉事國家召回。"
 generic.14.a: "這是個合理的請求。"
 generic.14.b: "將本國顧問派往何處是我們的自由。"
 attache_political_power_tt: "由於我們雙方的相對實力以及我們對他們的§Y評價§!，此選項將會產生以下效果：\n"
 attache_fascism_tt: "由於§Y法西斯主義§!在我國的受支持度，將會產生以下效果：\n"
 attache_communism_tt: "由於§Y共產主義§!在我國的受支持度，將會產生以下效果：\n"
 attache_democratic_tt: "由於§Y民主主義§!在我國的受支持度，將會產生以下效果：\n"
 attache_neutrality_tt: "由於§Y中立主義§!在我國的受支持度，將會產生以下效果：\n"
 generic.15.t: "[From.GetName]召回顧問"
 generic.15.d: "作為對我方要求的答覆，[From.GetNameDef]現已將他們留駐在敵對勢力境內的軍事顧問團撤走。"
 generic.16.t: "[From.GetName]留駐顧問"
 generic.16.d: "儘管我們已經提出抗議，但[From.GetNameDef]還是拒絕撤走其留駐在我們敵對勢力境內的軍事顧問團，還聲稱“我方無權干涉[From.GetAdjective]內政”。"
 generic.16.a: "我們等著瞧吧。"
 canals_tt: "下個月之內奪取運河沿岸領土的控制權可以阻止敵人的計劃。"
 japan_border_conflict.1.t: "日軍在我國邊境發起挑釁"
 japan_border_conflict.1.desc: "作為維持我國與[JAP.GetNameDef]邊境現狀的工作，我軍的一個工作組日前被派往哈桑湖查看該地的界標。而就在他們臨近邊境線時，這個工作組卻突然遭到了當地日軍哨兵的攻擊。\n\n儘管我們已就此提出了正式的外交抗議，但日本大使卻堅稱，這個工作組是被我們派來挪動界標以謀取宣稱更多領土的。\n\n日本人向我方保證，他們會尊重雙方邊境現狀，但絕不會容忍任何對當前界線的“篡改”。若是我方企圖如此，那他們必將以武力相回敬。\n\n這次事件或許實際上意味著，我們在上述地區我方領土的行動已經不再那麼自由了。"
 japan_border_conflict.1.a: "真是豈有此理！"
 japan_border_conflict.2.t: "日軍取得哈桑湖之戰勝利"
 japan_border_conflict.2.desc: "[SOV.GetAdjective]和日本兩國的軍隊日前圍繞著哈桑湖所爆發的邊境衝突落下帷幕，[SOV.GetAdjective]軍隊據說目前已經全線撤退。在佔據了地區周遭若干頗具戰略地位的山頭後，日軍現已開始構築陣地，鞏固現有的態勢。\n\n戰鬥當中，日軍還繳獲了若干[SOV.GetAdjective]的坦克，後者現已被運往東京，以展開進一步的測試和評估。"
 japan_border_conflict.2.a: "我們已經體面地解決了爭端。"
 japan_border_conflict.2.b: "我們必須為此準備適當的回應。"
 japan_border_conflict.3.t: "日軍在哈桑湖之戰落敗"
 japan_border_conflict.3.desc: "[SOV.GetAdjective]和日本兩國的軍隊日前圍繞著哈桑湖所爆發的邊境衝突落下帷幕，日本駐莫斯科大使現已呼籲兩國停火。\n\n戰鬥當中，日軍數次對[SOV.GetAdjective]陣地的猛攻均以傷亡慘烈的失敗告終，這不由得引起了日本軍方對本國軍隊戰鬥力的擔憂。"
 japan_border_conflict.3.a: "光榮戰敗總勝過怯懦避戰。"
 japan_border_conflict.3.b: "我軍此戰表現出色。"
 japan_border_conflict.4.t: "哈桑湖之戰陷入僵局"
 japan_border_conflict.4.desc: "在雙方均撤出爭議地段以重新補給和集結後，日本和[SOV.GetAdjective]兩國的軍隊圍繞著哈桑湖所爆發的邊境衝突暫且偃旗息鼓。也許是意識到繼續進攻亦無濟於事，日本軍方現已要求停火談判，以期恢復邊境態勢。"
 japan_border_conflict.4.a: "我們至少得到了寶貴的經驗"
 japan_border_conflict.5.t: "哈桑湖之戰衝突升級"
 japan_border_conflict.5.desc: "日本和[SOV.GetAdjective]兩國的軍隊圍繞著哈桑湖所爆發的戰鬥仍在進行。也許是為了打破戰場的僵局，這個大地區下轄其他各地的日軍均已開始與[SOV.GetAdjective]軍隊交戰。而情報表明，日本人很有可能會很快從其帝國的其他地域徵調新軍，以增援此次戰事。"
 japan_border_conflict.5.a: "我們必須堅守戰線。"
 japan_border_conflict.6.t: "哈桑湖之戰衝突升級"
 japan_border_conflict.6.desc: "[FROM.GetAdjective]和[JAP.GetAdjective]兩國的軍隊圍繞著哈桑湖所爆發的戰鬥仍在進行。也許是為了打破戰場的僵局，這個大地區下轄其他各地的[FROM.GetAdjective]軍隊均已開始與[JAP.GetAdjective]軍隊交戰。而情報表明，[FROM.GetNameDef]很有可能會很快從其國家的其他地域徵調新軍，以增援此次戰事。"
 japan_border_conflict.6.a: "我們必須準備進攻！"
 JAP_kalkin_gol: "蘇聯人經受住試探"
 wtt_prc.30.t: "尋釁成功"
 wtt_prc.30.desc: "在夜色的掩護下，我們在[JAP.GetManchuriaPuppet]的同志日前已經成功將一座日本人的工廠炸上了天。不過由於帝國主義分子將整個地區宣佈封禁，關於殺傷破壞的詳情我們所知不多。\n\n但這次行動已經證明，我們的打擊是奏效的。至於此事是否會促使日寇採取行動，則還有待進一步的觀察。"
 wtt_prc.30.a: "我們成功捅了馬蜂窩。"
 wtt_prc.31.desc: "在夜色的掩護下，我們在[JAP.GetManchuriaPuppet]的同志日前已經成功破壞了一座重要的橋梁。投入行動的突擊小分隊報告稱橋梁已被徹底摧毀，在其垮塌時，還連帶著一列敵人途經的軍火列車一併葬身火海。\n\n他們確信自己行動時被當地人所注意到，以此表明這就是蓄意破壞。至於此事是否會促使日寇採取行動，則還有待進一步的觀察。"
 wtt_prc.32.desc: "我們日前成功伏擊並消滅了一支[JAP.GetManchuriaPuppet]境內的日軍巡邏隊。這些鬼子的屍骸都被扔在了現場，以確保那些帝國主義分子能夠清晰地收到我們所傳遞的信息。\n\n時間將會證明，此舉是否能夠迫使他們認為足夠理由發動戰爭了。"
 wtt_prc.20.c: "我們應該就此從整個大陸撤退。"
 wtt_germany.1006.t: "德皇要搞政變！"
 wtt_germany.1006.desc: "軍事情報局報告了君主派內部的可疑活動。一些只對國王效忠的人似乎在接觸外國特工——具體來講，就是德國特工。看來有人在招募、召集君主派來反對我們偉大的領袖。不過如今為時不晚，我們可以派人關照下他們，在尚有能力的時候鎮壓他們。我們要怎麼做呢？"
 wtt_germany.1006.a: "志願安保團會處理好這事兒的。"
 britain.25.t: "[ENG.GetNameDefCap]要求服從"
 britain.25.desc: "[ENG.GetAdjective]政府似乎受到了[DEN.GetNameDef]陷落與[GER.GetAdjective]外交官在[ICE.GetNameDef]出沒的影響，現已邀請我國作為參戰國加入同盟國。他們表達了對於我國安全的關切，畢竟[GER.GetNameDef]有可能將冰島基地用作襲擊英國運輸船與城市的跳板。\n英方的威脅昭然若揭，他們陳之以當前世界局勢，稱我方任何“意圖中立”的聲明都不可與英國公民的安危以及反法西斯戰爭大業相提並論。"
 britain.25.a: "我們沒有選擇，只能加入[ENG.GetFactionName]。"
 britain.25.b: "萬惡的[ENG.GetAdjective]。"
 britain.25.c: "我國必須恪守中立，即使這會引來戰火。"
 britain.26.t: "[ICE.GetNameDefCap]在[ENG.GetNameDef]威脅下尋求我國庇護"
 britain.26.desc: "我國駐[ICE.GetNameDef]外交官向我們發來許多訊息，稱英國正在威脅新生的[ICE.GetAdjective]政權，後者若不受降便會遭英軍佔領。走投無路的[ICE.GetLeader.GetName]希望我國保護冰島免遭英國的脅迫。拉攏一個如此靠近英國本土的基地，也許對我國益處不小？"
 britain.26.a: "必須保衛[ICE.GetNameDef]人民。"
 britain.26.b: "我們騰不出資源。"
 britain.27.t: "[ICE.GetNameDefCap]拒絕我方提案"
 britain.27.desc: "[ICE.GetAdjective]政府拒絕了我國要求合作的最後通牒，重申了中立主張，強調了拒絕捲入與其毫不相干的戰爭的決心。\n他們譴責稱，如果遵辦這一最後通牒，冰島的獨立性將會被公然踐踏侵犯。然而很不幸，這場現代戰爭中沒有選擇也是一種選擇。儘管我國對接下來的行動表示遺憾，但必要之事，必須落實。"
 britain.27.a: "令人遺憾，但這是必要之事。"


