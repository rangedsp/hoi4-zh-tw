 wtt_news.53.t: "斯堪的納維亞的統一"
 wtt_news.53.desc: "[From.GetOldName]現已通過武力將全斯堪的納維亞的人民置於其統治之下，該國政府也已著手對新徵服的領土進行整合。而為了將民眾團結於一國，政府同時還展開了一系列泛民族主義的宣傳活動。\n\n儘管從消極的方面來說，斯堪的納維亞的統一在歷史上多次發生，如今的情形只不過就像是歷史重複循環當中所自然經過的一環。但[From.GetOldAdjective]政府卻是迫切地希望能夠跳出這個思維定式，為此，他們官方宣告了“卡爾馬聯盟的重建”，並正式改國號為“[From.GetNameDef]”。"
 wtt_news.53.a: "全斯堪的納維亞人的榮耀之日！"
 wtt_news.53.b: "團結的斯堪的納維亞將更加強大。"
 wtt_news.53.c: "這持續不了多久的！"
 wtt_news.54.t: "北歐諸國的統一"
 wtt_news.54.desc: "隨著北境諸國皆已克滅，[From.GetOldAdjective]政府現已開始加速對新徵服領土的整合。而為了將民眾團結於一國，政府同時還展開了一系列泛民族主義的宣傳活動。\n\n[From.GetOldAdjective]官方對此引用舊諺，稱“北歐諸國相親，合當聚而為一，使民得同心共存。”看起來，該國政府是打算通過親緣上的聯繫來團結民眾。而作為“真正的北歐共同體”，該國正式改其國號為“[From.GetNameDef]”。"
 wtt_news.54.a: "團結的北境將更加強大！"
 wtt_news.54.b: "北境諸國或將很快成為其鄰國的憂慮……"
 wtt_news.55.t: "[From.GetNameDef]的重生"
 wtt_news.55.desc: "在收復所有原屬於舊大哥倫比亞的法理領土後，[From.GetOldAdjective]政府現已開始加速對新徵服領土的整合。而為了將民眾團結到一個國家的旗幟之下，政府同時還展開了一系列泛民族主義的宣傳活動。\n\n早在此前，[From.GetOldAdjective]官方就反覆強調著他們的信念，即南美洲北部諸國應當正視所共有的歷史，並將曾經的親緣關係作為統一國家存在的基礎。而現在，[From.GetOldAdjective]政府則更進一步，在宣稱“重拾玻利瓦爾的遺產”後，正式改國號為“[From.GetNameDef]”。"
 wtt_news.55.a: "一統拉美之夢已觸手可及！"
 wtt_news.55.b: "全新的美洲強國就此誕生？"
 wtt_news.56.t: "[From.GetNameDef]的重生"
 wtt_news.56.desc: "在佔領了舊奧匈帝國的全部法理領土後，作為最後的繼業者國家，[From.GetOldAdjective]政府現已開始將其治下的各領土進行整合。該國政府的宣傳機器正開足馬力，大肆頌揚著“昔日帝國的光榮歲月”，試圖以此拉攏民眾，使大家支持目前全面的國家改革及對舊帝國律法的重塑。\n\n而作為計劃的一部分，[From.GetOldAdjective]政府亦已宣佈了[From.GetNameDef]的重建，併為此正式修改國號以照應。"
 wtt_news.56.a: "從此再不分離！"
 wtt_news.56.b: "那個雙元君主國又回來了。"
 wtt_news.57.t: "[From.GetNameDefCap]的重生"
 wtt_news.57.desc: "自波蘭和立陶宛兩國再度統合以來，[From.GetOldAdjective]政府就著手利用歷史作為宣傳手段，來團結民眾支持國家的大政方針。該國“歷史學家們”一邊通過各種渠道向大眾搖唇鼓舌，滔滔不絕地灌輸統一的波蘭-立陶宛國家足以無懼任何外敵威脅，同時也追憶著波蘭-立陶宛聯邦在歷史上作為強國的高光時刻。種種努力看起來似乎是成功轉移了人民群眾當下的憤怒，同時也引導他們將注意力集中到了對舊日輝煌歲月的嚮往上。\n\n而就在今天，[From.GetOldAdjective]政府更進一步，在宣告聯邦的再度成立後，正式改國號為“[From.GetNameDef]”。"
 wtt_news.57.a: "神佑吾輩，何人能敵？！"
 wtt_news.57.b: "所以他們這次能挺過瓜分嗎？"
 wtt_news.58.t: "低地諸國的統一"
 wtt_news.58.desc: "隨著低地諸國盡被[From.GetOldAdjective]征服，該國政府也開始設法為自己的行動進行辯護。他們現在自詡為尼德蘭聯合王國在法理上的直接繼承國，並且對1839年的倫敦條約嗤之以鼻，稱後者不過是本國政府當時遭到外國勢力罪惡壓迫的產物。正因如此，統一的低地國家從未解體，[From.GetOldNameDef]而今只不過是收回了本就屬於他們的法理領土而已。\n\n緊隨著這些辯詞之後，[From.GetOldAdjective]政府正式改國號為“[From.GetNameDef]”。而與此同時，相匹配的大規模宣傳活動早已展開。當前的全球危機局勢則被該國政府利用起來，用以爭取民眾支持，共同抗擊外部的威脅。"
 wtt_news.58.a: "就如同1815年預想的那樣，重歸一統……"
 wtt_news.58.b: "是的……這完全就是內政……"
 wtt_news.59.t: "[From.GetNameDef]的重生"
 wtt_news.59.desc: "隨著[From.GetOldAdjective]對中美洲諸國的征服，該國政府現已開始在國際上為其行為進行辯護。該國政府不僅自詡為中美洲聯邦共和國法理上的直接繼承國，還給那些在1830年代末自立的國家扣上了非法割據政權的帽子。藉此，他們不斷強調近期的征服行動只不過是他們“收復”這些地區的合理之舉。\n\n為貫徹其說辭，[From.GetOldAdjective]政府正式改國號為“[From.GetNameDef]”，並就此大肆宣傳，利用當前的全球危機作為外部威脅來拉攏本國的民眾。"
 wtt_news.59.a: "邁向世界舞臺的關鍵一步。"
 wtt_news.59.b: "新的美洲合眾國就此崛起。"
 wtt_news.60.t: "波羅的海諸國的統一"
 wtt_news.60.desc: "隨著波羅的海諸國皆已克滅，[From.GetOldAdjective]政府現已開始加速對新徵服領土的整合。而為了將民眾團結到一個國家的旗幟之下，政府同時還展開了一系列泛民族主義的宣傳活動。\n\n一位[From.GetOldAdjective]官員引用舊諺，稱“波羅的海諸國血濃於水，理應合而為一，尤其在面臨外界威脅時，更應戮力同心，外禦其侮，只有如此，人民才能享有獨立和自由”。而鑑於“真正的波羅的海共同體”業已建立，該國正式改國號為“[From.GetNameDef]”。"
 wtt_news.60.a: "這對我們的生存而言至關重要。"
 wtt_news.60.b: "但這個新國家真的足夠強大嗎？"
 wtt_news.61.t: "[From.GetNameDef]的重生"
 wtt_news.61.desc: "在收復所有奧斯曼帝國於上次大戰中淪喪的領土後，[From.GetOldAdjective]政府日前作為前奧斯曼帝國的繼業者，正式開始對這些領土重新展開整合。為爭取民眾支持目前全面的國家改革及對舊帝國律法的重塑，該國政府的宣傳活動用意明確，不僅對上次大戰後協約國集團對舊同盟國成員進行領土肢解的罪行予以痛斥，同時也對“昔日帝國的光榮歲月”不吝辭藻，大肆宣揚。\n\n而作為計劃的一部分，[From.GetOldAdjective]政府亦已宣佈了[From.GetNameDef]的重建，併為此正式修改國號以照應。"
 wtt_news.61.a: "我等終究重拾破碎的舊河山！"
 wtt_news.61.b: "那個永恆之國又回來了……"
 wtt_news.62.t: "歐羅巴的統一"
 wtt_news.62.desc: "隨著歐洲各路列強均已敗伏於[From.GetOldNameDef]兵鋒之下，近年來成立統一歐羅巴國家的構想第一次變得如此觸手可及。對此，受僱於該國政府的大批“專家”已經開始搖唇鼓舌，稱今日之政治態勢，是通往實現“歐陸無戰事”的唯一康莊大道。\n\n而為了讓“屬於全歐洲人之國”更為名副其實，各級政府的改革正以驚人的速度推進。作為改革的一部分，今天，這個國家正式改國號為“[From.GetNameDef]”，以使“歐陸全民相皆然”。"
 wtt_news.62.a: "這就是所有歐戰的終結？"
 wtt_news.62.b: "且讓我們靜看他們能否成功。"
 wtt_news.63.t: "[From.GetNameDef]的崛起"
 wtt_news.63.desc: "隨著[From.GetOldAdjective]日益強盛並鯨吞諸鄰國，為團結國內民眾，該國政府試圖銜接國家歷史連續性的嘗試亦愈發明顯。為此，歷史上赫赫有名的大津巴布韋帝國所創造的成就被賦予了濃厚的浪漫色彩，並在不斷的宣傳活動中對公眾的輿論產生了深刻的影響。\n\n而就在今天，面對著各大城市街道上歡欣鼓舞的民眾，[From.GetOldAdjective]政府更進一步，正式宣佈改國號為“[From.GetNameDef]”。"
 wtt_news.63.a: "非洲屬於非洲人！"
 wtt_news.63.b: "這就是非洲殖民時代的終結？"
 wtt_news.64.t: "[From.GetNameDef]的崛起"
 wtt_news.64.desc: "鑑於[From.GetOldAdjective]軍隊的攻勢看起來已不可阻擋，建立新羅馬帝國——這個近年來曾經飽受嘲笑的想法，現在似乎已經完全有可能被意大利人實現。畢竟，絕大部分有能力阻擋的歐陸列強均已灰飛煙滅，而今，只有意大利人方可將其意志凌駕於萬民之上。\n\n目前，為了著手開展被其稱作“羅馬領土再征服”的整合運動，意大利政府現已昭示天下，羅馬帝國至此重生，國家正式改國號為“[From.GetNameDef]”。"
 wtt_news.64.a: "羅馬不可戰勝！"
 wtt_news.64.b: "他們不會是認真的吧？！"
 wtt_news.65.t: "[From.GetNameDef]的崛起"
 wtt_news.65.desc: "隨著[From.GetOldAdjective]不斷開疆拓土，該國如今的成就已足以在波斯歷史上留下印象深刻的一筆。該國著名的公眾人物們，甚至已經開始將如今的擴張與居魯士大帝時代的偉業相提並論，對本民族的自豪感正在[From.GetOldAdjective]社會當中廣泛興起。\n\n而隨著該國政府對新領土的掌控愈發牢固，他們也趁著這波民眾高度擁護的浪潮，以官方的名義正式將國號改為“[From.GetNameDef]”。"
 wtt_news.65.a: "我國實力還將蒸蒸日上！"
 wtt_news.65.b: "如此能給該地區帶來和平與穩定嗎？"
 wtt_news.66.t: "[From.GetNameDef]的崛起"
 wtt_news.66.desc: "也許[From.GetOldAdjectiveCap]的成功曾令全球許多軍事專家倍感困擾，但事實就是如此。只不過是短短幾年間，希臘人便完成了從雄踞巴爾幹，再度征服伊斯坦布爾，到粉碎安納托利亞地區所有土耳其人有組織抵抗的宏偉壯舉。如此一來，希臘和土耳其之間長達五個世紀的宿命對決似乎終於已近尾聲。\n\n為了更進一步弘揚本民族的自豪感，[From.GetOldAdjectiveCap]政府基於歷史的連貫性，將他們的軍事成就描繪為“驅逐突厥韃虜，再興拜占庭榮光”。而作為宣傳造勢的一部分，在複稱君士坦丁堡的舊都近期舉辦的華麗慶典遊行上，[From.GetOldNameDef]正式宣佈改國號為“[From.GetNameDef]”。"
 wtt_news.66.a: "就此踏上再征服之途！"
 wtt_news.66.b: "命運神奇的反轉……"
 wtt_news.67.t: "阿拉伯的統一"
 wtt_news.67.desc: "隨著其軍事力量橫掃阿拉伯半島，[From.GetOldAdjective]政府在其統治區域內掀起了一場聲勢浩大的泛阿拉伯民族主義復興運動。由於先前已經通過武力手段徹底清除了外部勢力的抵抗政權，在不存在國際爭議的背景下，阿拉伯世界的統一已然觸手可及。對此，[From.GetOldAdjective]政府已經明確表態，將全力推進這一歷史性目標的實現。\n\n無論是順應民意潮流，將這片土地打造成所有阿拉伯人真正的共同家園，抑或是著眼於領土整合的戰略考量，[From.GetOldAdjective]當局已經正式宣佈，將國號更改為“[From.GetNameDef]”。"
 wtt_news.67.a: "薩迪之夢終得實現。"
 wtt_news.67.b: "這會為該地區帶來長久的和平嗎？"
 wtt_news.68.t: "[From.GetNameDef]的崛起"
 wtt_news.68.desc: "伴隨著[From.GetOldAdjective]勢力向周邊國家的持續擴張，政府致力於構建歷史連續性的戰略意圖愈發昭然。這顯然是為了凝聚民心、統一意志的深謀遠慮。在官方敘事中，滿者伯夷帝國等歷史輝煌被賦予了濃厚的理想色彩，而持續不斷的輿論引導也確實開始影響著公眾的歷史認知。\n\n在這一背景下，[From.GetOldAdjective]政府今日採取更為重要的舉措，正式將國號改為“[From.GetNameDef]”。這一充滿象徵意義的更名，既是對這片土地悠久歷史的致意，也期望能夠成為這一區域所有民眾共同認同的歷史紐帶。"
 wtt_news.68.a: "這將是亞洲殖民時代的終結！"
 wtt_news.68.b: "他們已然掌控了自身的命運。"
 wtt_news.69.t: "[From.GetNameDef]的重生"
 wtt_news.69.desc: "隨著[From.GetOldAdjective]日益強盛並鯨吞諸鄰國，該國政府日前已打算重拾拉達那哥欣這個國名。鑑於該國目前的疆域已經越來越接近歷史上那個王國的巔峰版圖，為向公眾宣傳，達拉那哥欣王國的過往功業開始被頻繁提及。\n\n而就在今天，[From.GetOldAdjective]政府更進一步，正式宣佈改國號為“[From.GetNameDef]”，希望以此從歷史中謀取本國政權的合法性。"
 wtt_news.69.a: "我們必將重拾霸權。"
 wtt_news.69.b: "諸殖民帝國正土崩瓦解？"
 wtt_news.70.t: "[From.GetNameDef]的重生"
 wtt_news.70.desc: "在[FROM.GetLeader]的領導下，[From.GetOldNameDef]極大地擴展了本國的疆界，甚至已經超過了舊神聖羅馬帝國曾下轄的版圖。歐陸諸敵國皆已被[From.GetOldAdjective]的戰爭機器打倒在地，在政治上，再無任何人可忤逆她的意志。\n\n現在，陛下業已降旨宣佈，就當前局勢來說，本國將成為神聖羅馬帝國在精神上的繼承者，而本國的國號，亦將更正加以呼應。陛下認為，憑藉此等功業，自己已成功達成了數百年間的歷代神聖羅馬帝國皇帝之夙願，即實現本地區在政治上的再度統一。"
 wtt_news.70.a: "朱庇特選中的雄鷹征服一切！"
 wtt_news.70.b: "陛下之榮光著實令人歎服！"
