 RAJ_risk_of_famine_desc: "印度的食物生產體系十分脆弱，一點小干擾即可導致崩潰。"
 RAJ_risk_of_famine_instant_desc: "如果滿足以下條件之一，會觸發§R饑荒§!：\n-我們丟失了初始的印度地區，且未能在§Y30天§!內奪回（亞丁除外）\n-地區新控制者並非遊戲初始時由我們佔領的可釋放國家\n-地區新控制者並非我們的附屬國。"
 RAJ_famine: "饑荒"
 RAJ_famine_desc: "無能勝任、置若罔聞、厚顏無恥的殖民政府和印度的鐵路系統陷入全面危機，全國將受災數月。"
