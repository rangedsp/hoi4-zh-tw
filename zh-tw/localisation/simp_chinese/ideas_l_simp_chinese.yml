 office_of_strategic_services_desc: "§L戰略情報局是一個美國於二戰期間成立的一個戰時情報機構。它是當今中情局的前身。§!"
 nkvd: "內務人民委員部"
 nkvd_desc: "§L內務人民委員部是蘇聯的一個執法機構，直接執行全聯盟共產黨的裁決。同時還擔負著保護蘇聯邊界和間諜活動的任務，包括在國外進行政治暗殺，影響外國政府，以及在其他國家的共產主義運動中執行斯大林主義政策。§!"
 nkvd_2: "內務人民委員部"
 nkvd_2_desc: "§L內務人民委員部是蘇聯的一個執法機構，直接執行全聯盟共產黨的裁決。同時還擔負著保護蘇聯邊界和間諜活動的任務，包括在國外進行政治暗殺，影響外國政府，以及在其他國家的共產主義運動中執行斯大林主義政策。§!"
