 POR_unreliable_army_desc: "自共和國於1910年成立以來，政變與反政變就層出不窮，軍官們更關注政治，而非維持軍紀和訓練軍隊。借其所賜，普通士兵軍紀渙散、裝備簡陋，並且訓練不足。"
 POR_unstable_republic: "不穩定的共和國"
 POR_unstable_republic_desc: "始於1910年的共和國時期通常都被描述為一段“頻繁陷入無政府階段、政府腐敗、暴動劫掠接連不斷、暗殺監禁以及宗教迫害為所欲為”的動盪年代。共和國總共見證了9位總統就職、44次內閣重組以及21次革命。即便在1926年的軍事政變之後，仍有幾次以失敗告終的革命嘗試。"
 POR_british_influence: "英國影響"
 POR_british_influence_desc: "英國政府正在投資開發我國境內資源。這是一個可以提升我們研發能力的寶貴時機。"
