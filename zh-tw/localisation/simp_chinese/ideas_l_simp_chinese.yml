 home_of_revolution: "革命始源地"
 home_of_revolution_desc: "同志們，在打倒托洛茨基反革命分子之後，我們能夠著重於保衛革命的事業上。我們的目標、希望與口號是打造統一的社會主義國家。我們將在蘇聯打造一個社會主義的理想國；那時，整個世界將會羨慕我們。"
 en_svensk_tiger: "瑞典虎"
 en_svensk_tiger_desc: "假若瑞典是一隻暗伺時機的老虎的話，那麼暗中觀察我們的人就不應該知道我們要做什麼。在此多事之秋，每一個愛國的瑞典人都應該保持靜默。"
 state_shintoism: "國家神道"
 state_shintoism_desc: "自從明治維新以來，我們一直使用對神社的崇拜來宣揚忠誠與發展。這個政策使得我們能夠建立一個為天皇犧牲的國家。 "
 vittoria_mutilata: "被暗中捅刀的勝利"
 vittoria_mutilata_desc: "§L我們的盟友在違反倫敦條約的同時背叛了意大利。我們在伊松佐河一役付出了血汗，換來的卻是被拒絕的正當權利。如今意大利將會將她的命運掌握在自己手中來維護正義。§!"
 stiff_upper_lip: "英國斯多葛主義"
 stiff_upper_lip_desc: "如果別人拿他們的失敗橫加怪罪\n你仍能保持樂觀自若\n如果你能直面勝利與失敗\n並將兩者一視同仁\n你會與這遼闊世界無二\n更重要的是，你將成為一個真正的人 "
 trotskyite_plot: "托洛茨基的陰謀？"
 trotskyite_plot_desc: "早期權力鬥爭的偏執和病態的猜疑仍然影響著我國領導層。"
