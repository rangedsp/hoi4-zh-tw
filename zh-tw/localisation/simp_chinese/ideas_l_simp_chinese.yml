l_simp_chinese:
 fascist_influence: "法西斯主義影響"
 fascist_influence_desc: "法西斯的影響讓法西斯主義十分受歡迎，使該國易於同其他法西斯國家結盟。"
 communist_influence: "共產主義影響"
 communist_influence_desc: "共產黨的影響讓共產主義十分受歡迎，使該國易於同其他共產主義國家結盟。"
 democratic_influence: "民主主義影響"
 democratic_influence_desc: "民主派的影響讓民主主義十分受歡迎，使該國易於同其他民主國家結盟。"
 neutrality_influence: "威權主義影響"
 neutrality_influence_desc: "威權主義的影響讓人們對那些擁有強大政府和高貴王室的國家產生了新的尊重，使這個國家能很容易的和其他威權主義國家結盟。"
 soviet_german_friendship: "蘇德友誼"
 soviet_german_friendship_desc: "德意志國與蘇維埃聯盟聯起手來，共同對抗墮落的西方世界。"
 sour_loser: "苦澀的失敗者"
 sour_loser_desc: "世界大戰屈辱戰敗的怨恨支配著這個國家的政治。"
 received_attache: "接受軍事顧問"
 received_attache_desc: "外國軍事顧問正駐於我國。"
 ATTACHE_LIST: "我國接受了$LIST$的軍事顧問，給予我國以下效果："
 porsche: "保時捷"
 porsche_desc: "保時捷傾向於設計具有重裝甲的坦克。"
 henschel: "亨舍爾"
 henschel_desc: "亨舍爾在解決了初期的可靠性問題後，生產了戰場表現良好的量產型虎式坦克。"
 GER_MAN: "曼恩"
 GER_MAN_desc: "曼恩公司最著名的產品是V號坦克“黑豹”，同時還生產和設計了一些早期型號的坦克。"
 rheinmetall: "萊茵金屬"
 rheinmetall_desc: "萊茵金屬設計和生產各類口徑的火炮。"
 mauser: "毛瑟"
 mauser_desc: "毛瑟設計和生產各類小口徑槍械。"
 ig_faben: "IG法本"
 ig_faben_desc: "IG法本致力於工業研究。"
 messerschmitt: "梅塞施密特"
 messerschmitt_desc: "梅賽施密特著力於輕型飛機的研究，例如Me-109戰鬥機。"
 focke_wulf: "福克-沃爾夫"
 focke_wulf_desc: "福克·沃爾夫對於大中型飛機的開發有著強烈的興趣，例如Fw-190戰鬥機和Fw-200四發巡邏機。"
 junkers: "容克斯"
 junkers_desc: "容克斯成名於開發Ju-87斯圖卡俯衝轟炸機。"
 todt: "弗裡茨·托特"
 todt_desc: "德國工程師弗裡茨·托特是托特組織的創始人，他將提高民用工業的建造速度。"
 speer: "阿爾伯特·施佩爾"
 speer_desc: "阿爾伯特·施佩爾是希特勒的御用建築師，他在1942-1945年間作為帝國軍備部長，讓德國的工業生產效率得到極大提升，成就了“軍備神話”。他將提高工業效率。"
 raeder: "埃裡希·雷德爾"
 raeder_desc: "埃裡希·雷德爾是運用傳統水面艦艇戰術的德國海軍指揮官，支持“存在艦隊”學說。"
 donitz: "卡爾·鄧尼茨"
 donitz_desc: "卡爾·鄧尼茨是運用U艇的德國海軍指揮官，支持“海上破交”學說。"
 goering: "赫爾曼·戈林"
 goering_desc: "赫爾曼·戈林是一戰中的王牌飛行員，他後來成為希特勒的重要支持者。他雖然幫了不少倒忙，但是他對希特勒有著絕對的忠誠。"
 walther_wever: "瓦爾特·韋佛"
 walther_wever_desc: "瓦爾特·韋佛是早期的戰略轟炸理論的倡導者之一，極富前瞻性的眼光。"
 ritter_von_greim: "裡特爾·馮·格萊姆"
 ritter_von_greim_desc: "裡特爾·馮·格萊姆是一位戰術封鎖支持者。"
 ernst_udet: "恩斯特·烏德特"
 ernst_udet_desc: "恩斯特·烏德特是使用斯圖卡俯衝轟炸機進行近接對地支援的專家。"
 werner_von_fritsch: "威爾納·馮·弗裡奇"
 werner_von_fritsch_desc: "威爾納·馮·弗裡奇，一位保守派指揮官，注重於步兵的集中使用。"
 ludwig_beck: "路德維希·貝克"
 ludwig_beck_desc: "路德維希·貝克注重強調補給線的重要性。"
 franz_halder: "弗朗茨·哈爾德"
 franz_halder_desc: "弗朗茨·哈爾德是一位大炮兵主義支持者，堅信口徑就是真理。"
 heinz_guderian: "海因茨·古德里安"
 wilhelm_keitel: "威廉·凱特爾"
 wilhelm_keitel_desc: "威廉·凱特爾，保守派指揮官，注重於步兵，他缺少的指揮素養被對元首的忠誠所彌補。"
 ferdinand_schorner: "費迪南德·舍爾納"
 ferdinand_schorner_desc: "費迪南德·舍爾納善於防禦和冬季作戰。"
 general_staff: "總參謀部"
 general_staff_desc: "德軍總參謀部對戰爭中各個方面負責，包括對動員及作戰進行規劃、決策和計劃復盤等，大大提高了軍隊的組織度水平。"
 v_weapons: "復仇武器（V系列導彈）"
 v_weapons_desc: "V系列火箭是對我們敵人復仇的理想武器，比如攻擊英國本土。"
 hermann_gortz: "赫爾曼·格爾茨"
 hermann_gortz_desc: "§H赫爾曼·格爾茨§!是一名精通業務的德國間諜。"
 elyesa_bazna: "艾利薩·巴茲納"
 elyesa_bazna_desc: "§H艾利薩·巴茲納§!更廣為人知的是他的代號“西塞羅”。"
 marina_lee: "瑪麗娜·李"
 marina_lee_desc: "§H瑪麗娜·李§!是一名專門竊取敵方作戰計劃的芭蕾舞演員。"
 german_advisors: "德國軍事顧問"
 german_advisors_desc: "由亞歷山大·馮·法肯豪森率領的德國軍事顧問團目前正在中國，其顧問正幫助國軍達到西方標準。"
