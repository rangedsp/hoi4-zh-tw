 NSB_soviet_civil_war_common.100.t: "以符拉迪沃斯托克換取支持"
 NSB_soviet_civil_war_common.100.desc: "[FROM.GetNameDef]的反對派正計劃掀起反抗[FROM.GetLeader]的起義。他們的首席談判代表提議，只要在內戰中支援他們一邊，擊敗[FROM.GetLeader]後他們就會將符拉迪沃斯托克移交給我們。"
 NSB_soviet_civil_war_common.100_exiles.desc: "位於滿洲的俄羅斯反對派正計劃掀起反抗[FROM.GetLeader]的起義。他們的首席談判代表，$SOV_konstantin_rodzayevsky$提議，只要在內戰中支援白軍一方，他們在擊敗[FROM.GetLeader]後就會將符拉迪沃斯托克移交給日本。"
 NSB_soviet_civil_war_common.100.a: "完美。"
 NSB_soviet_civil_war_common.100.b: "我們人手不夠。"
 vladivostock_concession_tt: "一支由§Y[?SOV.SOV_japanese_general.GetName]§!領導的[ROOT.GetAdjective]遠征軍將被派去支援反對派部隊。\n§Y[408.GetName]§!將在[SOV.GetNameDef]內戰結束後轉移到§Y[ROOT.GetName]§!。"
 NSB_soviet_civil_war_common.101.t: "[FROM.GetName]站在我們一邊"
 NSB_soviet_civil_war_common.101.desc: "[FROM.GetAdjective]政權同意了我們的請求，一旦反抗斯大林派的戰爭局勢對我們不利，他們就將派遣一支強大的遠征軍來支援我們。作為交換，他們會在戰爭結束後接管符拉迪沃斯托克。"
 NSB_soviet_civil_war_common.101.desc_exiles: "[FROM.GetAdjective]政權同意了我們的請求，只要我們打響了反抗布爾什維克的第一槍，他們就會派遣一支強大的遠征軍來支援我們。雖然割讓符拉迪沃斯托克的代價過於高昂，但我們有時必須做出犧牲——至少是暫時的犧牲。"
 NSB_soviet_civil_war_common.101.a: "我們的大後方應該安全了。"
 NSB_soviet_civil_war_common.102.t: "日本拒絕接收符拉迪沃斯托克"
 NSB_soviet_civil_war_common.102.desc: "在一系列相當意外的轉折之後，[FROM.GetAdjective]政府拒絕了得到海參崴港口和其周圍地區以換取對斯大林的積極支持的提議。"
 NSB_soviet_civil_war_common.102.a: "真是有趣的時代。"
 NSB_soviet_civil_war_common.103.t: "以北薩哈林換取軍火支援"
 NSB_soviet_civil_war_common.103.desc: "作為對用軍備武裝支持反對斯大林的叛亂分子的回報，蘇聯的反對派準備將他們稱之為薩哈林島的整個島嶼交還給[ROOT.GetName]。"
 NSB_soviet_civil_war_common.103.desc_exiles: "滿洲俄族移民社區的一名代表找到我們，要求我們在第二次俄國內戰時為他們提供物資。作為回報，他們將會承認[ROOT.GetNameDef]對整個庫頁島的主權。"
 NSB_soviet_civil_war_common.103.a: "如果他們能遵守承諾，他們會得到他們想要的援助的。"
 NSB_soviet_civil_war_common.103.b: "我們也許可以抽出一些多餘的物資。"
 NSB_soviet_civil_war_common.103.c: "至少我們可以為他們購置一些軍火。"
 NSB_soviet_civil_war_common.103.d: "冒這個風險並不值得。"
 sakhalin_concession_tt: "在[SOV.GetNameDef]的內戰結束後，[655.GetName]會被轉移到[ROOT.getName]"
 NSB_soviet_civil_war_common.104.t: "[FROM.GetNameDefCap]將提供武器支持"
 NSB_soviet_civil_war_common.104.desc: "與[FROM.GetAdjective]的談判已經成功。[FROM.GetName]已承諾為我們的起義大業提供武器，以換取對薩哈林島北部的控制權。"
 NSB_soviet_civil_war_common.104.a: "代價很大，希望這是值得的。"
 NSB_soviet_civil_war_common.105.t: "[FROM.GetNameDefCap]拒絕提供武器"
 NSB_soviet_civil_war_common.105.desc: "儘管我們向[FROM.GetLeader]提出了一個肯定符合[FROM.GetAdjective]利益的協議，但代表團還是空手而歸。"
 NSB_soviet_civil_war_common.105.a: "太糟了。"
 NSB_soviet_civil_war_common.106.t: "以巴庫油田換取秘密協助"
 NSB_soviet_civil_war_common.106.desc_right_opp_before: "[FROM.GetNameDef]的反對派集團正在策劃一場反對斯大林的政變。他們已經與我們接觸，要求我們幫助他們進行秘密的軍事建設，以換取我們未來對巴庫油田的資源開採權。"
 NSB_soviet_civil_war_common.106.desc_right_opp_civil_war: "由[SOV.GetLeader]領導的[SOV.GetNameDefCap]已經起兵反對[SOS.GetLeader]，他們正在打一場希望渺茫的內戰。叛軍已經與我們接觸，承諾為我們提供巴庫油田的未來開採權，以換取對他們的軍事援助。"
 NSB_soviet_civil_war_common.106.desc_exiles_before: "滿洲的反共團體正在策劃起兵反抗[SOV.GetLeader]。他們計劃用另一場內戰來推翻布爾什維克的統治。這個團體的代表已經與我們接觸，要求我們幫助他們進行秘密的軍事建設，以換取我們未來在巴庫油田的資源開採權。"
 NSB_soviet_civil_war_common.106.desc_exiles_civil_war: "俄羅斯白軍已經起兵反對[SOS.GetLeader]，在俄羅斯開始了另一場內戰。叛軍已經與我們接觸，請求我們提供對他們的軍事建設援助，以換取我們未來對巴庫油田的資源開採權。"
 NSB_soviet_civil_war_common.106.a: "只要能破壞蘇聯的穩定，我們就要不遺餘力的支持！"
 NSB_soviet_civil_war_common.106.b: "聽起來不錯，我們還應該派點顧問過去。"
 NSB_soviet_civil_war_common.106.c: "不要參與其中。"
 SOV_baku_oil_fields_tt: "[ROOT.GetNameDefCap]將幫助建立軍事工業，為即將爆發[FROM.GetNameDef]內戰做準備。作為回報，[ROOT.GetNameDef]將在蘇聯內戰結束後獲得巴庫油田的§Y資源開採權§!。\n"
 SOV_german_advisors_tt: "兩位陸軍將領將在蘇聯內戰期間與反對派並肩作戰。\n"
 NSB_soviet_civil_war_common.107.t: "[FROM.GetNameDefCap]同意援助我們以換取巴庫油田"
 NSB_soviet_civil_war_common.107.desc_normal: "我們對軍事建設的援助請求得到了[FROM.GetNameDef]的正面回應。[FROM.GetAdjective]政府將幫助我們建設軍用工廠，以換取未來在高加索的石油開採權。"
 NSB_soviet_civil_war_common.107.desc_advisors: "[FROM.GetAdjective]政府已經同意幫助我們建設軍事工業，以換取未來的石油開採權。此外，他們還同意派遣一些軍事“顧問”，在內戰期間與我們並肩作戰。"
 NSB_soviet_civil_war_common.107.a: "好消息。"
 NSB_soviet_civil_war_common.108.t: "[FROM.GetNameDefCap]拒絕提供援助"
 NSB_soviet_civil_war_common.108.desc: "我們與[FROM.GetNameDef]的談判一直沒有結果。儘管我們提供了未來的石油開採權，但他們還是不願意幫助我們建設更多的軍用工廠。"
 NSB_soviet_civil_war_common.108.a: "那我們就只能靠自己了。"
 NSB_soviet_civil_war_common.109.t: "向[SOV.GetNameDef]派遣“顧問”"
 NSB_soviet_civil_war_common.109.desc: "內戰又一次在俄羅斯爆發了。[SOV.GetLeader]領導著對[SOS.Getleader]的戰爭。如果叛軍們獲得了勝利，我們將得到許多好處。我們承諾會支持他們。與此同時，[?ROOT.SOV_foreign_military_advisor_1.GetName]和[?ROOT.SOV_foreign_military_advisor_2.GetName]已經準備好前往[SOV.GetName]，協助準備作戰計劃，同時獲得有關[SOV.GetAdjective]軍事實力的寶貴資料。"
 NSB_soviet_civil_war_common.109.a: "非常有趣。"
 NSB_soviet_civil_war_common.110.t: "協助煽動烏克蘭的起義"
 NSB_soviet_civil_war_common.110.desc: "蘇聯反對派們已經向我們請求對他們的權力鬥爭伸出援手。他們希望我們秘密地訓練烏克蘭武裝分子。作為回報，我們將會在未來得到來自一個獨立自主的烏克蘭的資源。"
 NSB_soviet_civil_war_common.110.a: "難以拒絕的好提議。 "
 NSB_soviet_civil_war_common.110.b: "不要參與其中。"
 SOV_ukraine_insurrection_tt: "[ROOT.GetName]將會訓練烏克蘭武裝分子。作為回報我們將會在未來得到在烏克蘭的§Y資源開採權§!。\n"
 NSB_soviet_civil_war_common.111.t: "[FROM.GetNameDefCap]將會訓練烏克蘭武裝分子"
 NSB_soviet_civil_war_common.111.desc: "[FROM.GetNameDefCap]已經作出承諾，他即將開始訓練烏克蘭武裝分子。這個單位在訓練完成後會在準備就緒後潛入烏克蘭，並發動針對斯大林政權的叛亂。"
 NSB_soviet_civil_war_common.111.a: "這最好有用。"
 NSB_soviet_civil_war_common.112.t: "[FROM.GetNameDefCap]拒絕了烏克蘭的提案"
 NSB_soviet_civil_war_common.112.desc: "在幾天的討論後，[FROM.GetLeader]突然決定反對支援烏克蘭的武裝叛亂，我們的談判專家們對他們拒絕提案的理由毫無頭緒。"
 NSB_soviet_civil_war_common.112.a: "太糟了。"
 NSB_soviet_civil_war_common.113.t: "烏克蘭武裝分子準備就緒"
 NSB_soviet_civil_war_common.113.desc_before: "我們的德國聯繫人報告說，他們訓練的烏克蘭武裝分子已準備出戰。這些部隊已經裝備訓練完畢，將秘密部署在烏克蘭，等待戰爭的爆發。"
 NSB_soviet_civil_war_common.113.desc_started: "我們的德國聯絡人報告說，他們訓練的烏克蘭武裝分子已準備好發動襲擊。這些部隊已經全副武裝，並被秘密運送到戰略要地。命令已至，起義隨時可以發動。"
 NSB_soviet_civil_war_common.113.a: "[SOS.GetLeader]又多了一個敵人。"
 NSB_soviet_civil_war_common.113.b: "這是好的。"
 NSB_soviet_civil_war_common.113.c: "等等，什麼？"
 NSB_soviet_civil_war_common.114.t: "烏克蘭起義"
 NSB_soviet_civil_war_common.114.desc: "由德國訓練的烏克蘭士兵已完全控制了烏克蘭各個主要城市。[UKR.GetLeader]領導下的預備政府業已成立，[UKR.GetNameDef]已宣佈獨立。"
 NSB_soviet_civil_war_common.114.a: "不可接受！"
 NSB_soviet_civil_war_common.114.b: "嗯，我們畢竟同意了。"
 NSB_soviet_civil_war_common.114.c: "這將會沉重打擊[SOS.GetLeader]。"
 NSB_soviet_civil_war_common.115.t: "以未來白俄羅斯的獨立換取支持"
 NSB_soviet_civil_war_common.115.desc: "蘇聯的反對派們已經與我們接洽，請求我們暗中支持他們。作為我們提供給養與協助建立軍隊的回報，他們已經準備好接受[BLR.GetAdjective]的流亡政府迴歸。"
 NSB_soviet_civil_war_common.115.a: "一個絕妙的主意。"
 NSB_soviet_civil_war_common.115.b: "我們自己的問題已經夠多了。"
 SOV_belarus_tt: "[BLR.GetNameDefCap]將在[GetSovietCivilWarName]結束後被釋放為獨立國家。"
 NSB_soviet_civil_war_common.116.t: "[FROM.GetNameDefCap]站在我們一邊"
 NSB_soviet_civil_war_common.116.desc: "我們與[FROM.GetAdjective]的談判是成功的。作為我們允許[BLR.GetAdjective]流亡政府在戰後回國的回報，[FROM.GetAdjective]政府將會在裝備與軍隊建設方面支持我們。"
 NSB_soviet_civil_war_common.116.a: "很好。"
 NSB_soviet_civil_war_common.117.t: "[FROM.GetNameDef]拒絕提供援助"
 NSB_soviet_civil_war_common.117.desc: "我們與[FROM.GetAdjective]的談判並沒有取得任何實質性進展。[FROM.GetLeader]拒絕了我們的提議，所以我們將不會從[FROM.GetName]那裡得到任何幫助。"
 NSB_soviet_civil_war_common.117.a: "我們只能自力更生了。"
 NSB_soviet_civil_war_common.118.t: "蘇聯反對派請求支援"
 NSB_soviet_civil_war_common.118.desc: "反斯大林的蘇聯反對派成員目前正在開展反對斯大林政權的運動。他們已經組織了一些反斯大林的集會，並在[ROOT.GetName]境內進行籌款活動。\n除了為他們的事業籌集民眾支持外，他們還秘密地與我們接觸，要求我方提供武器以支援其起義。"
 NSB_soviet_civil_war_common.118.a: "給他們提供步槍吧"
 NSB_soviet_civil_war_common.118.b: "我們至少可以拿出一些步槍！"
 NSB_soviet_civil_war_common.118.c: "我們沒有，但也許我們可以買一些給他們"
 NSB_soviet_civil_war_common.118.d: "不要參與進去"
 NSB_soviet_civil_war_common.119.t: "[FROM.GetNameDefCap]站在我們一邊"
 NSB_soviet_civil_war_common.119.desc: "[FROM.GetAdjective]政府已同意秘密提供武器給我們。"
 NSB_soviet_civil_war_common.119.a: "非常好！"
 NSB_soviet_civil_war_common.120.t: "[FROM.GetAdjective]政府將不會支持我們"
 NSB_soviet_civil_war_common.120.desc: "我們在[FROM.GetNameDef]的籌款已大獲成功。然而其政府拒絕提供武器給我們。"
 NSB_soviet_civil_war_common.120.a: "太糟了"
 NSB_soviet_civil_war_common.121.t: "[FROM.GetName]請求我們保護"
 NSB_soviet_civil_war_common.121.desc: "[FROM.GetLeader]已派出一支代表團請求我們的幫助以對抗[SOS.GetNameDef]。\n[FROM.GetAdjective]政府願意獻上主權來換取[ROOT.GetAdjective]參戰。"
 NSB_soviet_civil_war_common.121.a: "這就我們一直所等待的"
 NSB_soviet_civil_war_common.121.b: "不要被牽扯進去"
 NSB_soviet_civil_war_common.122.t: "[FROM.GetName]接受了我們的提議"
 NSB_soviet_civil_war_common.122.desc: "事到如今真為此感到羞愧。但我們必須為了重奪昔日失去的一切而做出犧牲。這只是一項臨時性的緊急措施。\n一旦布爾什維克完蛋，我們將去努力地實現全面獨立。"
 NSB_soviet_civil_war_common.122.a: "直至勝利。"
 NSB_soviet_civil_war_common.123.t: "[FROM.GetName]拋棄了我們"
 NSB_soviet_civil_war_common.123.desc: "在我們最絕望的時刻，[FROM.GetLeader]已決定撤回對[FROM.GetNameDef]的支援承諾，儘管為了保護它我們已做最大準備。"
 NSB_soviet_civil_war_common.123.a: "我們不會忘記！"
 NSB_soviet_civil_war_common.124.t: "[FROM.GetAdjective]工廠已建設完畢"
 NSB_soviet_civil_war_common.124.desc: "在[?SOV_civil_war_start_state.GetName]建造的工廠已經準備好運轉。無論在現在還是未來，這都將對我們的事業大有裨益。"
 NSB_soviet_civil_war_common.124.a: "很好"
 NSB_soviet_civil_war_common.125.t: "敵軍逃兵"
 NSB_soviet_civil_war_common.125.desc: "在我們佔領[?SOV.SOV_defections_army_state.GetName]後，[SOS.GetLeader]的軍隊士氣低落。士兵們集體逃跑，有的直接放下武器，還有的直接加入我們。"
 NSB_soviet_civil_war_common.125.a: "非常好！"
 SOS_army_desertions_tt: "§Y[SOS.GetNameWithFlag]§!陸軍將失去§Y裝備§!、§Y人力§!和§Y組織度§!，且一些部隊投奔到§Y[ROOT.GetNameWithFlag]§!麾下。"
 NSB_soviet_civil_war_common.126.t: "在[?SOV.SOV_captured_stockpile_state.GetName]繳獲庫存陸軍裝備"
 NSB_soviet_civil_war_common.126.desc: "在[?SOV.SOV_captured_stockpile_state.GetName]，一個[SOS.GetAdjective]軍隊倉庫被我們的部隊勝利佔領。撤退的[SOS.GetAdjective]士兵們曾試圖摧毀它，但我們的士兵成功地繳獲了一些裝備。"
 NSB_soviet_civil_war_common.126.a: "我們可以好好利用它。"
 NSB_soviet_civil_war_common.127.t: "海軍投誠"
 NSB_soviet_civil_war_common.127.desc: "在我們取得在[?SOV.SOV_defections_navy_state.GetName]的勝利後，一些海軍軍官已經意識到他們在為必敗的一方而戰。因此，一些艦艇已經離開了紅海軍，他們的船員提出要加入我方。"
 NSB_soviet_civil_war_common.127.a: "饋贈之馬，切莫挑剔。"
 SOS_navy_desertions_tt: "§Y[SOS.GetNameWithFlag]§!的海軍單位叛逃到§Y[ROOT.GetNameWithFlag]§!"
 NSB_soviet_civil_war_common.128.t: "[SOS.GetNameDef]的動亂"
 NSB_soviet_civil_war_common.128.desc: "報告指出，我們最近的軍事勝利，比如佔領[?SOV.SOV_civilian_unrest_state.GetName]，導致[SOS.GetNameDef]全境爆發抗議。不出所料，[SOS.GetLeader]的狗腿子殘酷鎮壓了抗議，但這無疑損害了[SOS.GetAdjective]的戰局。"
 NSB_soviet_civil_war_common.128.a: "我們會勝利的。"
 SOS_civilian_unrest_tt: "§Y[SOS.GetNameWithFlag]§!的工業遭受損失。\n§Y[SOS.GetLeader]§!的投降界限降低了。"
 NSB_soviet_civil_war_common.129.t: "[?SOV.SOV_japanese_general.GetName]啟程"
 NSB_soviet_civil_war_common.129.desc: "隨著俄國內戰爆發，我們是時候應該兌現諾言了，[?SOV.SOV_japanese_general.GetName]會領導[ROOT.GetAdjective]遠征軍，帶領他們走向勝利與輝煌，捍衛[ROOT.GetNameDef]的榮耀。"
 NSB_soviet_civil_war_common.129.a: "人必盡其責"
 NSB_soviet_nationalist.001.t: "[?SOV.SOV_nationalist_country.GetNameDef]爆發民族起義！"
 NSB_soviet_nationalist.001.desc: "[?SOV.SOV_nationalist_country.GetLeader]宣佈[?SOV.SOV_nationalist_country.GetName]獨立。[SOS.GetLeader]譴責這為叛國行徑，下令要抓捕、槍決所有叛軍。現在，[SOS.GetNameDef]和[?SOV.SOV_nationalist_country.GetNameDef]處於戰爭狀態了。[GetFinnishCommittmentInKareliaOrNot]"
 FIN_karelian_uprising_supported_by_finland: "\n\n[FIN.GetAdjective]軍隊越過邊界時，局勢進一步升級，擴大了衝突，使[FIN.GetNameDef]捲入了與[SOS.GetNameDef]的衝突。"
 SOV_breakaway_country_flag: "宣佈從蘇聯獨立"
 NSB_soviet_nationalist.001.a: "敵人的敵人就是朋友。"
 NSB_soviet_nationalist.001.b: "這是[ROOT.GetAdjective]合法領土！"
 indepence_war_threat: "宣佈獨立"
 NSB_soviet_nationalist.002.t: "[FROM.GetNameDefCap]要求歸附"
 NSB_soviet_nationalist.002.desc: "[FROM.GetAdjective]大使已與我國政府接觸，“請求”我們承認[FROM.GetNameDef]是[ROOT.GetName]真正的合法政府。作為回報，他們將提供“一定程度的自治權”。"
 NSB_soviet_nationalist.002.a: "我們打敗了蘇聯，我們也可以打敗他們。"
 NSB_soviet_nationalist.002.b: "或許這才是最好的。"
 NSB_soviet_nationalist.003.t: "[FROM.GetNameDefCap]接受"
 NSB_soviet_nationalist.003.desc: "[FROM.GetLeader]沒有理由拒絕我們的合理要求。[FROM.GetNameDef]即將回歸帝國，並保有一定自治權。"
 NSB_soviet_nationalist.003.a: "對俄羅斯來說是偉大的一天。"
 NSB_soviet_nationalist.004.t: "[FROM.GetNameDefCap]拒絕"
 NSB_soviet_nationalist.004.desc: "儘管[FROM.GetLeader]面臨著相當大的壓力，而且也完全瞭解[FROM.GetLeader.GetHerHis]國內的不穩定狀況，他們還是拒絕接受在重建的俄羅斯帝國內實現自治的慷慨提議。"
 NSB_soviet_nationalist.004.a: "我們一定要讓他們屈服！"
 NSB_soviet_nationalist.004.b: "我想，還是得等一等了。"
 NSB_soviet_permanent_revolution.1.t: "託派革命分子煽動群眾"
 NSB_soviet_permanent_revolution.1.desc: "[FROM.GetNameDef]的托洛茨基派正在用革命宣傳煽動群眾，他們甚至對[ROOT.GetAdjective]的無產階級許諾，如果無產階級揭竿而起反抗國家，他們定會前來支援。局勢已經有失控的態勢了。"
 NSB_soviet_permanent_revolution.1.a: "這基本就是侵略行徑了"
 NSB_soviet_for_the_common_good.1.t: "為了人民群眾的共同利益"
 NSB_soviet_for_the_common_good.1.desc: "集體強於個人，在經濟領域也是這個道理。[SOV.GetNameDefCap]決定重組其全體盟友的經濟，以更好為集體而非某一個國家服務。這意味著我們要改變處事方式了，儘管開頭可能會有些困難，但最終所有人的福祉都能得到改善。"
 NSB_soviet_for_the_common_good.1.a: "為了共同的利益！"
 NSB_soviet_fascist_tsarist.1.t: "泛斯拉夫聯盟成員"
 NSB_soviet_fascist_tsarist.1.desc: "當世界墮入暴力的深淵時，[FROM.GetNameDef]站出來併發誓保衛全體斯拉夫人免於那些敵視我們的人的傷害。他們已向我們發出加入新“泛斯拉夫聯盟”的邀請，並且宣稱所有斯拉夫人將被偉大的[FROM.GetAdjective]軍隊保護，並在這個聯盟中獲得公平公正的對待。"
 NSB_soviet_fascist_tsarist.1.a: "我們將參與這個斯拉夫民族的偉大聯盟！"
 NSB_soviet_fascist_tsarist.1.b: "他們的保護不值得我們放棄獨立。"
 NSB_soviet_fascist_tsarist.2.t: "泛斯拉夫聯盟：[FROM.GetNameDef]接受了"
 NSB_soviet_fascist_tsarist.2.desc: "我們已收到來自[FROM.GetAdjective]政府的答覆：[FROM.GetNameDef]接受了成為泛斯拉夫聯盟成員國的邀請。"
 NSB_soviet_fascist_tsarist.2.a: "明智的決定。"
 NSB_soviet_fascist_tsarist.3.t: "泛斯拉夫聯盟：[FROM.GetNameDef]拒絕"
 NSB_soviet_fascist_tsarist.3.desc: "來自[FROM.GetAdjective]的外交代表告知我們：他們是斷然不會加入泛斯拉夫聯盟的。"
 NSB_soviet_fascist_tsarist.3.a: "泛斯拉夫聯盟終將實現——不論他們願意與否。"
 NSB_soviet_fascist_tsarist.4.t: "[FROM.GetNameDef]影響著我們的政治"
 NSB_soviet_fascist_tsarist.4.desc: "我們收到了一些令人不安的消息：[FROM.GetAdjective]煽動家在我們國家進行的法西斯宣傳逐漸擴散，並且有來自[FROM.GetAdjective]資金支援國內法西斯政黨的活動以及各項支出。"
 NSB_soviet_fascist_tsarist.4.a: "我們必須保持警戒以防不戰而敗。"
 NSB_soviet_fascist_tsarist.5.t: "加入[FROM.GetFactionName]的邀請"
 NSB_soviet_fascist_tsarist.5.desc: "由於我們相近的世界觀，[FROM.GetNameDef]邀請我們加入[FROM.GetFactionName]，並且在我們繼續追求國家光榮前途的歷程中，他們將繼續為我們提供軍事和經濟支持！"
 NSB_soviet_fascist_tsarist.5.a: "我們將在[FROM.GetAdjective]領導下變得更加強大。"
 NSB_soviet_fascist_tsarist.5.b: "我們不需要俄羅斯人也可以強大！"
 NSB_soviet_fascist_tsarist.6.t: "[FROM.GetNameDef]加入了[ROOT.GetFactionName]"
 NSB_soviet_fascist_tsarist.6.desc: "[FROM.GetNameDef]接受了提議，毫不猶豫地加入了我們的陣營！"
 NSB_soviet_fascist_tsarist.6.a: "他們現在就是我們在美洲的橋頭堡了。"
 NSB_soviet_fascist_tsarist.7.t: "[FROM.GetNameDef]拒絕提議"
 NSB_soviet_fascist_tsarist.7.desc: "[FROM.GetAdjective]政府告知我們他們拒絕同盟邀請，他們寧願選擇在美洲保持獨立。"
 NSB_soviet_fascist_tsarist.7.a: "蠢貨！"
 NSB_soviet_fascist_tsarist.8.desc: "現在，由於意識到我們擁有相近的世界觀，[FROM.GetNameDef]邀請我們加入[FROM.GetFactionName]，並且在我們繼續追求國家光榮前途的歷程中，他們將繼續為我們提供軍事和經濟支持，就像當初他們支持我們的黨壯大並奪取[ROOT.GetNameDef]國家權力那樣。"
 NSB_soviet_fascist_tsarist.9.desc: "[FROM.GetNameDef]最終選擇了法西斯道路。所以，他們已經被接納為我們聯盟的成員。"
 NSB_soviet_fascist_tsarist.10.desc: "[FROM.GetNameDef]最終選擇了法西斯道路。但是，儘管我們為他們的法西斯政黨上臺提供了幫助，並且提議他們加入我們的聯盟，他們還是拒絕了我們的邀請並選擇獨立自主。"
 NSB_soviet_fascist_tsarist.11.t: "[FROM.GetAdjective]海軍擴建"
 NSB_soviet_fascist_tsarist.11.desc: "有情報指出，[FROM.GetNameDef]正在遠東大肆擴建海軍基礎設施。這也許預示著遠東形勢的變動……"
 NSB_soviet_fascist_tsarist.11.a: "毫無疑問，他們在試圖挑戰我們的霸權。"
 NSB_soviet_fascist_tsarist.12.t: "[FROM.GetAdjective]的反日宣傳"
 NSB_soviet_fascist_tsarist.12.desc: "[FROM.GetAdjective]報紙上出現了越來越多批評[ROOT.GetAdjective]開發遠東的文章，並且他們的政治家用越來越具有煽動性的話語譴責我們並且提醒[FROM.GetAdjective]民眾牢記在1905年戰爭中的恥辱和損失。其中最激進的那些人打出了“為對馬海戰復仇”的號召口號！"
 NSB_soviet_fascist_tsarist.12.a: "我們將做好與這個老敵手的戰爭準備……"
 NSB_soviet_fascist_tsarist.13.t: "[FROM.GetAdjective]在堪察加進行建設"
 NSB_soviet_fascist_tsarist.13.desc: "報告指出，[FROM.GetNameDef]正在堪察加大肆擴建軍事基礎設施。軍事分析家認為，這些設施的作用只可能是加強[FROM.GetAdjective]力量投射以對抗我們在阿拉斯加的力量部署，最壞的情況可能是——這些設施就是侵略我們的前進跳板！"
 NSB_soviet_fascist_tsarist.13.a: "我們將根據這一情報展開行動……"
 NSB_soviet_fascist_tsarist.14.t: "沙皇歸來"
 NSB_soviet_fascist_tsarist.14.desc: "祖國在幾十年前遭受的不公現在現已驅除殆盡。在聖母大教堂舉行的盛大而華麗的儀式上，弗拉基米爾·基裡洛維奇大公加冕為弗拉基米爾一世沙皇，向歡呼的人群致敬。\n\n之後，沙皇的第一件事是率領儀仗隊緩緩走出克里姆林宮大門，迎接歡欣鼓舞的民眾，並親自參加雄偉壯觀的軍事遊行。\n\n在這場精彩的演講中，新任沙皇讚揚了俄羅斯人民的美德，併發誓要再次帶領國家走上重返往日榮耀的道路。"
 NSB_soviet_fascist_tsarist.14.a: "光榮啊！"
 NSB_soviet_fascist_tsarist.15.t: "麥勒提牧首的加冕"
 NSB_soviet_fascist_tsarist.15.desc: "隨著宗教在我們國家越來越重要，教會的地位再次達到——不，是超過——它曾經的地位。為了表現我們對上帝的崇敬，讓上帝的使者登上國家領導人的地位是再正常不過的事情了。\n\n今天，在莫斯科的基督救世主主教座堂和聖母安息主教座堂舉行的雙重盛大儀式上，哈爾濱和滿洲教區的麥勒提，因其在流亡生涯中對上帝的服務而當選，被加冕為莫斯科和全俄羅斯的牧首，以及全俄羅斯的沙皇。\n\n隨著政教最終完全合一，在塵世間執行上帝的旨意就沒有任何障礙了……"
 NSB_soviet_fascist_tsarist.15.a: "爾旨承行於地如於天。"
 NSB_soviet_fascist_tsarist.16.t: "三國協約"
 NSB_soviet_fascist_tsarist.16.desc: "在擺脫國內混亂並建立了與我們親近的新政府後，[SOV.GetNameDef]現在向我們提出了一個改革舊盟約的提議，用以抑制[GER.GetAdjective]在歐洲的侵略。"
 NSB_soviet_fascist_tsarist.16.a: "絕妙的主意！"
 NSB_soviet_fascist_tsarist.16.b: "我們可沒忘記上次他們的承諾最後是什麼下場。"
 NSB_soviet_fascist_tsarist.17.t: "三國協約-接受提議"
 NSB_soviet_fascist_tsarist.17.desc: "[FROM.GetNameDefCap]通知我們，他們正式接受了結盟的提議，並立即採取措施增加與我國的外交聯繫。"
 NSB_soviet_fascist_tsarist.17.a: "這可以嚇唬一下德國了。"
 NSB_soviet_fascist_tsarist.18.t: "三國協約-拒絕提議"
 NSB_soviet_fascist_tsarist.18.desc: "[FROM.GetNameDef]已通知我們，他們當下並不覺得與我國結盟有什麼好處。"
 NSB_soviet_fascist_tsarist.18.a: "令人沮喪的外交失敗……"
 NSB_soviet_fascist_tsarist.19.desc: "[FROM.GetAdjective]與[SOV.GetAdjective]政府已經開始談判，重建曾經的三國協約。他們現在打算推進這個計劃，並邀請我國加入。"
 NSB_soviet_fascist_tsarist.19.a: "為了歐洲未來的穩定，我們會同意。"
 NSB_soviet_fascist_tsarist.19.b: "很不幸，“三國協約”只能是他們兩國了。"
 NSB_soviet_fascist_tsarist.20.a: "我們因團結而強大！"
 NSB_soviet_fascist_tsarist.21.a: "至少我們還有俄羅斯人。"
 NSB_soviet_fascist_tsarist.22.t: "柏林-莫斯科軸心"
 NSB_soviet_fascist_tsarist.22.desc: "[SOV.GetAdjective]的代表已經向我們提出了結盟的建議。他們建議，由於該國新政府和我國對世界局勢有著相似的看法和利益，兩國在經濟和軍事領域進行更密切的合作將有利可圖。"
 NSB_soviet_fascist_tsarist.22.a: "全世界都要圍著這個新的軸心轉！"
 NSB_soviet_fascist_tsarist.22.b: "結盟？我們不同意。"
 NSB_soviet_fascist_tsarist.23.t: "柏林-莫斯科軸心：接受提案"
 NSB_soviet_fascist_tsarist.23.desc: "[SOV.GetAdjective]政府通知我們很高興能參與軸心國的對外策略。他們已開始準備派遣外交和軍事聯絡員。"
 NSB_soviet_fascist_tsarist.24.t: "柏林-莫斯科軸心：拒絕提案"
 NSB_soviet_fascist_tsarist.24.desc: "[SOV.GetAdjective]外交官今天照會我們，稱其政府拒絕了我國的提議。"
 NSB_soviet_fascist_tsarist.24.a: "太糟了……這肯定不是傳達惡意的信號吧。"
 NSB_soviet_fascist_tsarist.25.t: "東京軸心"
 NSB_soviet_fascist_tsarist.25.desc: "[SOV.GetAdjective]代表提出了一項希望拉攏[JAP.GetNameDef]加入陣營的提鑑於案。鑑於[SOV.GetName]和[JAP.GetName]兩國曆史上的對峙關係，他們建議我國充當調解角色，在兩國之間進行斡旋。"
 NSB_soviet_fascist_tsarist.25.a: "我們會派外交官的。"
 NSB_soviet_fascist_tsarist.25.b: "我們的利益恐怕不會和那些日本人一致。"
 NSB_soviet_fascist_tsarist.26.t: "東京軸心-[JAP.GetName]接受"
 NSB_soviet_fascist_tsarist.26.desc: "我們已從[GER.GetAdjective]政府那裡收到了回覆：他們已在我國和日本之間進行了斡旋調解，日本也已經接受了提議！"
 NSB_soviet_fascist_tsarist.26.a: "大好消息——我們的東側安全了！"
 NSB_soviet_fascist_tsarist.27.t: "東京軸心-[JAP.GetName]拒絕"
 NSB_soviet_fascist_tsarist.27.desc: "[GER.GetAdjective]政府通知我們，儘管他們已經盡了最大努力，日本人遺憾地拒絕了我們的同盟請求。"
 NSB_soviet_fascist_tsarist.27.a: "一個重大的挫折……"
 NSB_soviet_fascist_tsarist.28.t: "東京軸心-[GER.GetName]拒絕"
 NSB_soviet_fascist_tsarist.28.desc: "[GER.GetAdjective]政府考慮了關於邀請日本加入聯盟的提議，但他們遺憾地通知我們這種聯盟目前不符合他們的利益。"
 NSB_soviet_fascist_tsarist.28.a: "可惜了！他們肯定有他們的道理。"
 NSB_soviet_fascist_tsarist.29.desc: "[GER.GetAdjective]與我們聯繫，提出建立我們三個大國之間的[SOV.GetAdjective]聯盟的提議。他們認為，在我們三國聯合的情況下，世界其他國家不可能有希望對抗我們。"
 NSB_soviet_fascist_tsarist.29.a: "讓這個聯盟成為我們外交的答案！"
 NSB_soviet_fascist_tsarist.29.b: "歷史經驗告訴了我們三巨頭的下場……我們拒絕。"
 NSB_soviet_fascist_tsarist.30.desc: "[JAP.GetName]告知我們他們已經選擇接受[SOV.GetAdjective]提議並且準備儘可能快地加入我們的同盟。"
 NSB_soviet_fascist_tsarist.30.a: "光榮啊！"
 NSB_soviet_fascist_tsarist.31.desc: "[JAP.GetName]遺憾地通知我們，由於他們認為[SOV.GetAdjective]提議目前並不符合他們的最大利益，因此不得不拒絕我們。"
 NSB_soviet_fascist_tsarist.31.a: "沒有他們，我們也能辦到。"
 NSB_soviet_fascist_tsarist.32.t: "弗拉索夫被俘"
 NSB_soviet_fascist_tsarist.32.desc: "最近，在敵軍撤退時，一名[SOV.GetAdjective]高級將領被我軍俘虜了。這名將軍名叫安德烈·弗拉索夫，他在監牢中聲稱自己“反對布爾什維克主義”，並希望利用俄國戰俘組建部隊，同我們一道打擊“斯大林主義”。"
 NSB_soviet_fascist_tsarist.32.a: "歡迎反對布爾什維克主義的戰友"
 NSB_soviet_fascist_tsarist.32.b: "這人不可信任！"
 NSB_soviet_fascist_tsarist.33.desc: "我們收到消息，[SOV_andrey_vlasov.GetName]將軍被敵人俘虜了。我們只能為他的命運祈禱……"
 NSB_soviet_fascist_tsarist.33.a: "真不幸，但我們還有更要緊的事要馬上處理！"
 nsb_news.301.t: "山區共和國統一"
 nsb_news.301.d: "在塔帕·切爾莫耶夫精神的指引下，[FROM.GetLeader]領導著山區共和國再度實現統一。他們宣稱要打倒一切闖入北高加索地區的外國侵略者，並要在歷史上留下濃墨重彩的一筆。自此，北高加索山區共和國重生了！"
 nsb_news.301.a: "我們不再分裂！"
 nsb_news.301.b: "有意思"
 nsb_news.302.t: "外高加索再次統一"
 nsb_news.302.d: "外高加索第一次成立是在俄國內戰伊始，但卻很快分崩離析；第二次成立是作為蘇維埃共和國，但1936年蘇聯憲法頒佈後又再次解體。現在，[FROM.GetLeader]做出了第三次嘗試，再次統一了外高加索諸國，這一次他們不僅做好了保衛家園的準備，還計劃對外擴張。只有時間才能告訴我們他們能成就什麼。"
 nsb_news.302.a: "事不過三"
 nsb_news.302.b: "又來？"
 nsb_news.303.t: "西伯利亞統一"
 nsb_news.303.d: "幾個世紀以來，西伯利亞一直處在俄羅斯的統治下，但現在，西伯利亞不再是外國勢力的一部分，而是獨立的政治實體，其人民團結一心，準備好為捍衛權利拼上一切。西伯利亞人民歡欣鼓舞，帝國主義時代一去不復返，他們可以不受外國干預地獨立發展。因為還有更多的西伯利亞人民需要保護、解放，共和國宣佈對此不會作壁上觀，而這一次定要不惜一切代價！"
 nsb_news.303.a: "終於，西伯利亞從帝國主義的手中解放了出來！"
 nsb_news.303.b: "俄羅斯對東方的控制力正在減弱……"
 nsb_news.304.t: "伊德爾-烏拉爾重建"
 nsb_news.304.d: "自俄羅斯內戰以來，伏爾加-烏拉爾地區首次重新統一為一個國家，稱為伊德爾-烏拉爾。這一次，他們宣佈不再會頂著俄羅斯的名號而存在了，將不惜一切代價保持獨立。只有未來才能告訴我們這個國家能否生存下去……"
 nsb_news.304.a: "這次我們會團結一致！"
 nsb_news.304.b: "那麼……呃……他們在哪兒？"
 nsb_news.400.t: "弗拉基米爾三世加冕"
 nsb_news.400.desc: "在被布爾什維克統治近三十年後，今日莫斯科聖母昇天大教堂見證了沙皇弗拉基米爾三世盛大的加冕儀式，[SOV.GetName]恢復了沙皇制。在皇家巡遊之後，新沙皇向前來見證加冕的人民發表講話，盛讚俄羅斯人民的精神並且誓言“恢復祖國的往日榮耀”。"
 nsb_news.400.a: "大喜事！"
 nsb_news.400.b: "戰爭販子！"
 nsb_news.400.c: "虛偽滑稽！"
 nsb_news.401.t: "取締縉紳會議"
 nsb_news.401.desc: "就在縉紳會議的重建賦予了政府合法性的幾個月後，[SOV.GetAdjective]政府中的法西斯主義者就解散了新議會並且將國家徹底置於[SOV.GetLeader]的掌控之下。到目前為止，新加冕的沙皇徹底淪為了一個幾乎沒有任何實權的傀儡。\n\n在政權更迭之後，民族主義的相關言論開始興起，這些言論大多是盛讚“斯拉夫民族”的兄弟情誼以及控訴鄰國以前對我們的不法行徑。"
 nsb_news.401.a: "我們榮耀的國家需要強有力的領袖！"
 nsb_news.401.b: "這是否有助於形勢發展還有待觀察。"
 nsb_news.401.c: "新的盟友出現了？"
 nsb_news.402.t: "柏林-莫斯科軸心"
 nsb_news.402.desc: "今日早些時刻，[GER.GetNameDef]和[SOV.GetNameDef]的發言人發表聯合聲明，宣佈成立“柏林-莫斯科軸心”。兩大強權將會在經濟、政治和軍事方面開展合作，以“保護兩國的利益”，聲稱他們“非常關切東歐和中歐的穩定”。\n\n至於這是否是他們的真實目的，還有待觀察。"
 nsb_news.402.a: "我們偉大的同盟必將崛起！"
 nsb_news.402.b: "我們東方新盟友的好主意。"
 nsb_news.402.c: "他們這是要塑造世界新秩序嗎？"
 nsb_news.402.d: "他們現在可以對歐洲為所欲為……"
 nsb_news.403.t: "[SOV.GetAdjective]介入美洲"
 nsb_news.403.desc: "越來越多的揭露出的證據表明，[SOV.GetAdjective]開始深刻干預中南美洲許多國家的政治事務。他們通過扶植右傾政治組織和準軍事團體、賄賂、誘騙和散播虛假消息使得這些國家的內部變得越來越不穩定。\n\n專家認為，如果[SOV.GetAdjective]的秘密活動繼續下去，其中一些國家將不可避免地成為[SOV.GetName]在美洲的意識形態立足點。如此一來，[SOV.GetAdjective]對這些國家的支持將變本加厲、更加張揚。"
 nsb_news.403.a: "很不幸，我們的介入被公開了。"
 nsb_news.403.b: "他們把腳踩進了我們的地盤？！"
 nsb_news.403.c: "他們很快就會見識到強人領導的優越性了。"
 nsb_news.403.d: "法西斯的擴散失控了！"
 nsb_news.404.t: "第三羅馬的崛起"
 nsb_news.404.desc: "自從令國家元氣大傷的內戰以來，俄羅斯東正教會已經逐漸確立了穩固的權力地位。現在隨著他們征服了昔日的拜占庭，他們已經完成了教會和國家統一的最後一步。\n\n在加冕成為東正教最高牧首以及全俄羅斯沙皇之後，[SOV.GetLeader]領導著被命名為“[SOV.GetNameDef]”的新國家以追求他所謂的“上帝的旨意”。"
 nsb_news.404.a: "意義重大！"
 nsb_news.404.b: "他們不是認真的吧？！"
 nsb_news.405.t: "[SOV.GetNameDefCap]"
 nsb_news.405.desc: "在宣稱自己是“全體斯拉夫人的守護者”之後，俄羅斯認為守護斯拉夫人最好的方式就是將所有斯拉夫民族統一在一個國家之下。\n\n隨著統一的最終實現，[SOV.GetLeader]日前宣佈建立[SOV.GetNameDef]，誓言“將動用新國家的一切資源使全斯拉夫民族受益，並且保護他們免於外部的威脅。”"
 nsb_news.405.a: "聯合起來，斯拉夫人戰無不勝！"
 nsb_news.405.b: "一股不容忽視的力量。"
 nsb_news.406.t: "斯拉夫人的守護者"
 nsb_news.406.desc: "[SOV.GetNameDef]再一次宣稱自己是“斯拉夫人的守護者”，並且承擔起了保障其他歐洲斯拉夫民族的責任。在聲明中，[SOV.GetLeader]宣誓“[SOV.GetNameDef]將施展自己的一切能力造福斯拉夫民族，並且保護斯拉夫人免受外部威脅。”\n\n[SOV.GetAdjective]政府特別強調了俄國參與一戰的歷史，以此來表明自己信守了諾言。他們似乎從來沒有體現這種保證的後果，而只想著扛起自己的責任。"
 nsb_news.406.a: "我們對兄弟們信守了承諾。"
 nsb_news.406.b: "只要他們尊重我們的獨立……"
 nsb_news.406.c: "斯拉夫人的老大哥回來了……"
 nsb_news.407.t: "三國協約？"
 nsb_news.407.desc: "[From.GetNameDefCap]和[SOV.GetNameDef]日前宣佈在舊三國協約終結三十年之後重建新的軍事合作同盟。\n\n雖然沒有公開挑明，但是這個新同盟的建立似乎是為了抑制中歐某些國家的擴張。這個聯盟是否會繼續擴充有待進一步觀察。"
 nsb_news.407.a: "向著穩定的歐洲邁進的一大步。"
 nsb_news.407.b: "歷史的遺留……"
 nsb_news.408.t: "三國協約"
 nsb_news.408.desc: "[From.GetNameDefCap]日前決定與它之前的盟友再度組建新的三國協約以應對歐洲中部的擴張主義威脅。"
 nsb_news.408.a: "我們再一次站在了一起。"
 nsb_news.408.b: "讓我們看看它能夠撐多久。"
 nsb_news.409.t: "柏林-莫斯科軸心：東京加入"
 nsb_news.409.desc: "[GER.GetNameDef]，[SOV.GetNameDef]和[JAP.GetNameDef]的三方聲明正式宣佈[JAP.GetNameDef]將成為軸心國的又一成員。\n\n伴隨著[SOV.GetAdjective]和[JAP.GetNameDef]之間緊張氣氛的緩和（也許是[GER.GetAdjective]從中協調的結果），這一新的外交進展基本上確保了[SOV.GetAdjective]東部邊境安全，並且可以讓[JAP.GetNameDef]將注意力集中在太平洋上。"
 nsb_news.409.a: "一次強有力的外交行動。"
 nsb_news.409.b: "意料之外的進展！"


