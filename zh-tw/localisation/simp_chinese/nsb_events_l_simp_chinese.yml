l_simp_chinese:
 BALTIC_events.1.t: "[From.GetNameDefCap]尋求保障"
 BALTIC_events.1.d: "今早[Root.GetLeader]收到一份來自[From.GetNameDef]的電報，請求[Root.GetNameDef]重申對[From.GetAdjective]的獨立保障。[From.GetLeader]堅稱[From.GetLeader.GetHerHis]的國家之存續對延續東歐的和平至關重要，並提及了自其1918年建國以來[Root.GetNameDef]和[From.GetNameDef]之間的長久友誼。\n\n隨著[From.GetNameDef]和[SOV.GetNameDefCap]之間局勢升溫，接受[From.GetLeader]的提議可能使[Root.GetNameDef]與[SOV.GetAdjective]陷入衝突……"
 BALTIC_events.1.a: "我們將保衛我們的[From.GetAdjective]朋友。"
 BALTIC_events.1.b: "我們不支持[From.GetLeader]或[From.GetLeader.GetHerHis]的政府。"
 BALTIC_events.101.t: "[From.GetNameDefCap]同意！"
 BALTIC_events.101.d: "[From.GetLeader]已宣佈[From.GetHerHis]繼續支持[Root.GetAdjective]的獨立，並且將加入任何繼續威脅[Root.GetNameDef]的衝突。"
 BALTIC_events.101.a: "我們安全了。"
 BALTIC_events.102.t: "[From.GetNameDefCap]拒絕！"
 BALTIC_events.102.d: "令[Root.GetLeader]十分沮喪的是，[From.GetAdjective]外交部決定不尋求與[Root.GetNameDef]的軍事關係。"
 BALTIC_events.102.a: "我們只能找其它的解決方案。"
 BALTIC_events.2.t: "[From.GetNameDefCap]尋求波羅的海合作。"
 BALTIC_events.2.d_baltic: "[From.GetLeader]和[From.GetHerHis]的內閣已接觸[Root.GetAdjective]政府，向其提議將波羅的海協約鬆散的軍事聯盟正式化。簽署該協議將意味著在戰時，我們的軍隊將團結起來共同面我們主權所受到的威脅。\n\n儘管是國家防禦性質的，但[From.GetLeader]希望將波羅的海協約最後正式轉為自里加至奧斯陸的聯盟，然而這樣有野心的目標似乎不大可能。"
 BALTIC_events.2.d_scandi: "[From.GetLeader]和[From.GetHerHis]的內閣已接觸[Root.GetAdjective]政府，向其提議將波羅的海協約鬆散的軍事聯盟正式化。簽署該協議將意味著我們的軍隊將在戰時團結起來，共同面我們主權所受到的威脅。\n\n[From.GetLeader]堅稱一旦威脅沿其邊境征服了波羅的海三國，斯堪的納維亞自然是其下一個戰爭目標，我們應當明智地在這個全球衝突年代一起保持強大。"
 BALTIC_events.2.a: "我們應該加入！"
 BALTIC_events.2.b: "我認為我們有更好的選擇。"
 BALTIC_events.202.a: "他們哪來膽子拒絕我們！"
 BALTIC_events.203.t: "波羅的海協約遭廢棄！"
 BALTIC_events.203.d: "因為未能獲得足夠的幫助來抵抗[SOV.GetAdjective]入侵，[From.GetLeader]已經決定放棄波羅的海協約議案，並轉向其它選擇。我們國家的許多人都感到十分沮喪，一個同我們朋友們在[From.GetNameDef]對抗[SOV.GetAdjective]軍隊的夢想就這樣化作泡影。"
 BALTIC_events.203.a: "令人失望。"
 BALTIC_events.3.t: "[From.GetNameDefCap]請求直接介入"
 BALTIC_events.3.d: "[From.GetLeader]領導的[From.GetAdjective]人民軍隊與誤入歧途為[From.GetNonIdeologyName]的資產階級獨裁政權賣命的無產階級之間的內戰仍在進行，但似乎事實已經證明[From.GetLeader]沒有能力單獨領導革命取得勝利。駐[From.GetNonIdeologyName]的[Root.GetAdjective]大使向[Root.GetLeader]的辦公桌遞交了一份報告，對[From.GetAdjective]革命者的前途表示擔憂。他認為，如果在這場內戰中失敗，社會主義在[From.GetNonIdeologyName]勝利的可能性將化為泡影。"
 BALTIC_events.3.a: "直接行動勢在必行！"
 BALTIC_events.3.b: "無產階級只能自己解放自己。"
 BALTIC_events.301.t: "[From.GetNameDefCap]拒絕介入"
 BALTIC_events.301.d: "我們在[From.GetNameDef]的朋友和盟友對[Root.GetLeader]直接干預的請求作出了拒絕介入的回應。[From.GetLeader]聲稱，如果要解放[Root.GetAdjective]的工人，他們必須自己動手，任何代表[From.GetNameDef]的直接干預都將被視為帝國主義的行為。"
 BALTIC_events.301.a: "[From.GetLeader.GetSheHeCap]有一個想法。"
 BALTIC_events.4.t: "共產黨向[Root.Capital.GetName]進軍！"
 BALTIC_events.4.d: "[Root.GetAdjective]的人民對政府越來越失望，今天，在[Root.Capital.GetName]的街頭，緊張局勢已經達到了沸點。對底層人民待遇表示不滿的反政府抗議活動導致了與[Root.GetAdjective]軍警的幾次暴力衝突，抗議者最終在[Root.GetLeader]和[Root.GetRulingParty]黨的幾個主要成員舉行的會議期間到達[Root.Capital.GetName]的議會大廈。抗議者的要求相當明確：要麼將[Root.GetLeader]和[Root.GetLeader.GetHerHis]的[Root.GetRulingParty]黨趕出政府，要麼面臨一場暴力的革命。"
 BALTIC_events.4.a: "我們別無選擇"
 BALTIC_events.4.b: "下臺？決不！"
 BALTIC_events.5.t: "[From.GetNameDefCap]尋求建立[From.GetNonIdeologyName]-白俄羅斯"
 BALTIC_events.5.d: "受到過去短暫的立陶宛-白俄羅斯蘇維埃社會主義共和國啟發，[From.GetLeader]尋求統一[From.GetNameDef]及其掌控的白俄羅斯蘇維埃社會主義共和國。[From.GetLeader.GetSheHeCap]聲稱兩國統一將清除東西方之間的屏障，從而極大強化[From.GetNameDef]為全球革命服務的能力。"
 BALTIC_events.5.a: "一個天才的想法！"
 BALTIC_events.5.b: "白俄羅斯應當保持獨立[Root.GetAdjective]。"
 BALTIC_events.501.t: "[From.GetNameDefCap]同意了！"
 BALTIC_events.501.d: "[From.GetNameDef]已經就[Root.GetAdjective]提出組建[Root.GetNonIdeologyName]-白俄羅斯蘇維埃社會主義共和國這一要求做出了回應。[From.GetLeader]為這個統一東歐和波羅的海諸國的機會而欣喜若狂，他宣佈該聯盟終將成為連同東西方的橋梁，讓革命更容易地輸出至整片大陸。"
 BALTIC_events.501.a: "[Root.GetNonIdeologyName]版圖更大了！"
 BALTIC_events.502.t: "[From.GetNameDefCap]拒絕！"
 BALTIC_events.502.d: "儘管立陶宛-白俄羅斯蘇維埃社會主義共和國已被建立用來當作東西歐之間溝通的橋梁，但似乎[From.GetLeader]不再認為這是一個有必要存在的國家，並且宣稱白俄羅斯是蘇聯不可分割的一部分[Root.GetNameDef]。"
 BALTIC_events.502.a: "人事已盡。"
 BALTIC_events.503.t: "在白俄羅斯的戰爭宣傳"
 BALTIC_events.503.d: "為了組建立陶宛-白俄羅斯蘇維埃社會主義共和國，[From.GetNameDef]正在煽動政府成員叛變加入[From.GetNonIdeologyName]，以此來動搖白俄羅斯政權。"
 BALTIC_events.503.a: "我們會盡快處理好它。"
 BALTIC_events.6.t: "[From.GetNameDefCap]尋求波羅的海諸國的統一"
 BALTIC_events.6.d: "波羅的海國家有著共同的長期被外來帝國主義的鐵蹄蹂躪的歷史，但是這將不再延續。[Root.GetNameDefCap]與[From.GetNameDef]已經在社會主義的指導下獲得解放，但是[From.GetLeader]聲稱波羅的海國家的延續仍未得到保障。[From.GetLeader.GetSheHeCap]聲稱在波羅的海國家仍為國界線所分割的同時，我們面對帝國主義和資本主義也更加脆弱，只有團結為一個聯合的波羅的海共和國我們才能承受外國侵略者的猛攻。"
 BALTIC_events.6.a: "[From.GetLeader]是正確的，我們一定要統一！"
 BALTIC_events.6.b: "這超出了底線！[Root.GetNonIdeologyName]仍然是[Root.GetAdjective]！"
 BALTIC_events.601.t: "[From.GetNameDefCap]拒絕了！"
 BALTIC_events.601.d: "[From.GetLeader]以毫不掩飾的厭惡回絕了[Root.GetAdjective]的統一請求。儘管非常尊重[From.GetNameDef]人的自治權，但無可爭議的是一支統一的波羅的海力量比分成一個個更好。"
 BALTIC_events.601.a: "我們將從他們自己手中把他們拯救出來。"
 BALTIC_events.601.b: "畢竟他們有自決權。"
 BALTIC_events.7.t: "[From.GetNameDefCap]請求入侵[baltic_wargoal_target.GetAdjective]"
 BALTIC_events.7.d: "[From.GetNameDefCap]，[Root.GetAdjective]通向西歐的門戶在今天代表[Root.GetNameDefCap]提出一套入侵[baltic_wargoal_target.GetNameDef]的計劃。[From.GetLeader]聲稱入侵[baltic_wargoal_target.GetAdjective]將對我們共同努力向歐洲另一邊傳播革命十分重要，並且一旦推翻[baltic_wargoal_target.GetAdjective]政府將帶來更多的擴張機會。"
 BALTIC_events.7.a: "頗受鼓舞！"
 BALTIC_events.7.b: "革命不能急於事功。"
 BALTIC_events.701.t: "[From.GetNameDefCap]阻止入侵[baltic_wargoal_target.GetAdjective]"
 BALTIC_events.701.d: "[From.GetNameDef]認為展開侵略戰爭代價太過高昂，根本不值得[From.GetAdjective]和[Root.GetAdjective]為之付出傷亡，因此否決了[Root.GetAdjective]提出的入侵[baltic_wargoal_target.GetNonIdeologyName]這一請求。現在，[baltic_wargoal_target.GetNameDef]將不再面臨任何共產主義革命力量的威脅。"
 BALTIC_events.701.a: "哦，好吧……"
 BALTIC_events.11.t: "森林兄弟的宣傳"
 BALTIC_events.11.d: "一些反共產主義的出版物已經進入我國各地的[Root.GetAdjective]公民的手中。這些宣傳品攻擊了[Root.GetLeader]的人格，將[Root.GetLeader.GetHerHim]稱為叛徒和[SOV.GetAdjective]的走狗。這些出版物的性質美化了[Root.GetAdjective]民族主義，貶損了共產主義革命的國際價值。毫無疑問，民族主義情緒將因這些出版物的地下發行而得到增強。"
 BALTIC_events.11.a: "叛徒！"
 BALTIC_events.12.t: "在[forest_brothers_raid_state_target.GetName]的森林兄弟大突襲"
 BALTIC_events.12.d: "他們好像無處不在，打擊[forest_brothers_raid_state_target.GetName]的幾個主要工業區，導致其中的設備遭到嚴重損害。好在襲擊發生在工廠晚上關閉的時候，但這對國家財產損害十分巨大。"
 BALTIC_events.12.a: "全都是階級叛徒。"
 BALTIC_events.13.t: "與森林兄弟的小規模衝突"
 BALTIC_events.13.d: "在[forest_brothers_raid_state_target.GetName]巡邏時，守備部隊被森林兄弟所伏擊。儘管我們方面一直損失不大，衝突的消息還是迅速在當地傳播開來，許多人開始視森林兄弟為[Root.GetAdjective]的民族翹楚，這在挑戰[Root.GetLeader]作為領袖的合法性。"
 BALTIC_events.13.a: "挫敗他們！"
 BALTIC_events.14.t: "森林兄弟挪用裝備"
 BALTIC_events.14.d: "在過去的幾週裡，生產線上的一些步槍和軍用裝備人間蒸發了，它們從工廠出去後從未抵達[Root.GetAdjective]紅軍手中。遺失裝備被揭露去向森林兄弟。儘管政府現在知道此案兇手是誰，但要花費數週嚴管生產線，來確保其不會有一顆子彈通過這種方式進到森林兄弟的步槍槍管去。"
 BALTIC_events.14.a: "我們將消滅這些叛徒！"
 BALTIC_events_7_tt: "觸發事件'§Y[Root.GetNameDefCap]請求入侵芬蘭§!'。"
 BALTIC_events_8_tt: "觸發事件'§Y[Root.GetNameDefCap]請求入侵丹麥§!'。"
 BALTIC_events_9_tt: "觸發事件'§Y[Root.GetNameDefCap]請求入侵瑞典§!'。"
 BALTIC_events_10_tt: "觸發事件'§Y[Root.GetNameDefCap]請求入侵波蘭§!'。"
 BALTIC_events_15_tt: "觸發事件“§Y[Root.GetNameDefCap]請求入侵立陶宛§!”。"
 BALTIC_events_16_tt: "觸發事件“§Y[Root.GetNameDefCap]請求入侵拉脫維亞§!”。"
 BALTIC_events_17_tt: "觸發事件“§Y[Root.GetNameDefCap]請求入侵愛沙尼亞§!”。"
 BALTIC_events.18.t: "輿論戰"
 BALTIC_events.18.d: "[From.GetNameDefCap]開始影響[Root.GetAdjective]的政治，在我們的城市宣傳共產主義，還為異見者提供武器。只有對他們的宣傳採取反制措施，我們才有希望徹底取締共產主義，擺脫[From.GetAdjective]的威脅。"
 BALTIC_events.18.a: "[Root.GetNameDefCap]絕不會淪為共產主義國家！"
 BALTIC_events.19.t: "[SOV.GetNameDefCap]把[BALTIC_country_to_transfer.GetNonIdeologyName]委託於我們。"
 BALTIC_events.19.desc: "對於[ROOT.GetNameDef]來說，今天簡直不能再美妙了。在我們的同志進行了英勇的戰役之後，[SOV.GetNameDefCap]正式宣佈，新解放的[BALTIC_country_to_transfer.GetNonIdeologyName]領土及其勇敢的工人將歸我國管轄。[GetExtraBalticTerritories]\n\n這使我們距離建立一個強大到足以擊退工人階級敵人，並統一波羅的海國家的偉大目標又近了一步。"
 BALTIC_events.19.extra: "此外，他們也將佔領的[BALTIC_loose_territory_country.GetNonIdeologyAdjective]領土的管控權交予我們，因此我們必須繼續證明我們有資格成為[BALTIC_loose_territory_country.GetNonIdeologyName]的永久管控者。"
 BALTIC_events.19.a: "自然如此！"
 BALTIC_entente_events.1.t: "[From.GetNonIdeologyName]投資了波羅的海聯盟"
 BALTIC_entente_events.1.d: "作為波羅的海聯盟的領導者，[From.GetNameDef]為聯盟成員國的一項新倡議提供資金。該項資金使得[Root.GetNameDef]和[From.GetNameDef]互利共惠，這展示出我們對自由長久的承諾，以及我們兩國的發展！"
 BALTIC_entente_events.1.a: "我們團結起來會更加強大。"
 BALTIC_entente_events.1.b: "恢復民主的機會！"
 BALTIC_entente_events.6.t: "[From.GetNonIdeologyName]推動統一"
 BALTIC_entente_events.6.d: "波羅的海協約從最初的波羅的海諸國之間的鬆散聯盟至今已變化巨大。現在波羅的海諸國在政治上水乳交融，就如同一個國家。[From.GetLeader]提議本聯盟組成一個完整國家，統一波羅的海諸國的軍民政府，似乎這是可能的。"
 BALTIC_entente_events.6.a: "絕妙的提案！"
 BALTIC_entente_events.6.b: "決不可能！"
 LIT_events.1.t: "[SOV.GetAdjective]-[LIT.GetAdjective]瓜分[POL.GetNameDef]"
 LIT_events.1.d: "很明顯[LIT.GetLeader]謀求[LIT.GetAdjective]舊都維爾紐斯地區的再統一。當然他們的威脅對於[POL.GetNameDef]十分微弱，[LIT.GetAdjective]尋求[Root.GetNameDef]與[POL.GetAdjective]烏克蘭和白俄羅斯同[Root.GetNameDefCap]一起分離出去，且維爾紐斯迴歸[LIT.GetNameDef]。\n\n[POL.GetNameDefCap]當然可以拒絕聯合通牒，後果就是[POL.GetNameDef]和[Root.GetNameDef]兩國之間的戰爭。"
 LIT_events.1.a: "一個很棒的提議！"
 LIT_events.1.b: "我們不會和[LIT.GetLeader]簽署任何協議。"
 LIT_events.101.t: "[SOV.GetAdjective]-[LIT.GetAdjective]最後通牒"
 LIT_events.101.d: "自1920年以來，維爾諾就在[Root.GetNameDef]的控制之下，這讓[LIT.GetNameDef]人更加視這座城市為他們的國家合法首都。緊張氛圍在[SOV.GetLeader]的一支援助下到達沸點，立陶宛人現在要求將波蘭東部劃分至[SOV.GetAdjective]和立陶宛。如果我們接受，我們將放棄整個波蘭東部；但如果我們拒絕，我們就將是[SOV.GetAdjective]-[LIT.GetAdjective]聯盟的主要目標。"
 LIT_events.101.a: "我們投降！"
 LIT_events.101.b: "決不會不戰而降！"
 LIT_events.102.t: "[From.GetNameDefCap]同意！"
 LIT_events.102.d: "[SOV.GetNameDefCap]已經同意與我們一同瓜分[POL.GetNameDef]，現在剩下要做的就是將我們的要求告知[POL.GetAdjective]。"
 LIT_events.102.a: "維爾紐斯唾手可得！"
 LIT_events.103.t: "[From.GetNameDefCap]拒絕！"
 LIT_events.103.d: "[SOV.GetNameDefCap]拒絕與我們一同瓜分[POL.GetNameDef]，儘管我們仍然可以對[POL.GetNameDef]發起戰爭，但是我們的首相確信這樣的戰爭會以我們的失敗收場。"
 LIT_events.103.a: "挫敗他們！"
 LIT_events.104.t: "[POL.GetNameDefCap]拒絕了！"
 LIT_events.104.d: "雖然他們已經四面楚歌，但[POL.GetNameDef]拒絕了我們的要求。"
 LIT_events.104.a: "那就開戰吧！"
 LIT_events.104.b: "得不償失。"
 LIT_events.2.t: "[From.GetNameDefCap]呼籲和平"
 LIT_events.2.d: "雖然武裝衝突已經停止了數年之久，[Root.GetNonIdeologyName]和[From.GetNonIdeologyName]卻並沒有簽署任何官方停戰協議。[From.GetLeader]今天提出要求讓[From.GetNameDef]和[Root.GetNameDef]握手言和並作為盟友一起抵禦他們共同的國境線上的外敵。雖然[From.GetLeader]仍然聲稱維爾諾才是[From.GetNonIdeologyName]的唯一合法首都，但[From.GetLeader.GetSheHe]已經表示，正式停戰並放下武器才是兩國的共同利益所在。"
 LIT_events.2.a: "[From.GetLeader.GetSheHeCap]說得有道理。"
 LIT_events.2.b: "我不同意。"
 LIT_events.201.d: "[From.GetLeader]似乎同意了[Root.GetAdjective]官方的觀點並決定暫時與[Root.GetNameDef]進入友好和平狀態。隨著和平而來的是雙方對彼此獨立地位的保證。而在戰時，[From.GetNameDef]的朋友們將成為我們可靠的支援！"
 LIT_events.201.a: "好極了！"
 LIT_events.202.d: "[From.GetNameDefCap]拒絕與[Root.GetNameDef]簽署任何正式的停戰協議。這場冷戰似乎會無限期地繼續下去。"
 LIT_events.202.a: "不過，我們也許不接受否定的答案。"
 LIT_events.3.t: "[From.GetNameDefCap]請求保持永久和平。"
 LIT_events.3.d: "[Root.GetNonIdeologyName]和[From.GetNonIdeologyName]在過去十年內爭執的焦點是[Root.GetAdjective]對於[From.GetNonIdeologyName]的傳統首都維爾紐斯的侵佔。既然雙方現在已經達成了友好關係，[From.GetLeader]提議兩國保持永久的和平狀態，而條件是[Root.GetNameDef]要交出對維爾紐斯的管轄權並停止宣稱對任何[From.GetAdjective]領土的主權。[From.GetLeader]提出，拒絕此提案將會令人失望，但不會導致[From.GetNonIdeologyName]對[Root.GetNameDef]發起戰爭。"
 LIT_events.3.a: "聽起來還不錯。"
 LIT_events.3.b: "太荒謬了。"
 LIT_events.301.d: "[Root.GetNonIdeologyName]和[From.GetNonIdeologyName]終於達成了和平協定，自從[Root.GetNameDef]以來長時間暗濤洶湧的衝突似乎終於結束了。雖然在許多[From.GetAdjective]人的心中仍然保留著建立聯邦的野心，但可以確定的是一個新型的聯邦已經建成了，而它是建立在盟友間的互相尊重上的。"
 LIT_events.301.a: "我們一代人的和平！"
 LIT_events.302.d: "[From.GetLeader]拒絕承認[Root.GetNameDef]對於[Root.GetAdjective]的歷史上的首都的宣稱。雖然這不會切斷雙方的和平關係，但這一行為無疑已經重燃了[Root.GetNameDef]對於它曾經的對手的不信任。"
 LIT_events.302.a: "令人失望。"
 LIT_events.4.t: "[From.GetNameDefCap]提供了駐軍權！"
 LIT_events.4.d: "出於對於被入侵的恐慌，[From.GetNameDef]官方願意讓[Root.GetAdjective]軍隊駐紮在[From.GetNonIdeologyName]境內。作為條件，[From.GetAdjective]政府希望[Root.GetNameDef]可以在他們被外敵威脅主權時可以提供保護。實際上，由於[Root.GetAdjective]的軍隊已經在境內，[From.GetNameDef]在面對他們的要求時根本力不從心。"
 LIT_events.4.a: "聽起來是個好機會！"
 LIT_events.4.b: "我不同意。"
 LIT_events.401.d: "[From.GetNameDefCap]拒絕了我們慷慨的提議，理由是他們不想為了[Root.GetNonIdeologyName]而被捲進衝突之中。"
 LIT_events.5.t: "[From.GetNameDefCap]聲索[784.GetName]"
 LIT_events.5.desc: "自從1919年的維爾諾攻勢以來，立陶宛舊都一直被[Root.GetNameDef]所侵佔。這裡是我們兩國之間長達幾十年的持續衝突的焦點。\n\n這座城市一直充斥著冷戰氛圍，而今天，[From.GetLeader]威脅說如果這座城市再不被讓渡給[From.GetNameDef]，那麼戰爭將不可避免。\n\n這座城市對我們來說食之無味棄之可惜，但它代表著舊聯邦最後的生機。我們真的願意放棄波蘭-立陶宛的願景以換取和平嗎？"
 LIT_events.5.a: "這座城市百無一用。拿走吧。"
 LIT_events.5.b: "我們決不投降"
 LIT_events.501.t: "維爾紐斯迴歸了！"
 LIT_events.501.desc: "[From.GetNameDefCap]已經同意和平歸還維爾紐斯，這標誌著我們兩個國家間數十年冷戰的正式結束。隨著維爾紐斯的迴歸，立陶宛終於統一了。"
 LIT_events.502.desc: "不出所料，[From.GetNameDef]拒絕了[Root.GetLeader]要求他們將維爾紐斯割讓給[Root.GetNameDef]的要求。雖然外交手段沒能解決問題，但[Root.GetLeader]還沒有排除戰爭的可能性，而且隨著邊境緊張局勢升級，戰爭似乎不可避免。"
 LIT_events.502.a: "戰爭？我管這叫進攻性談判。"
 LIT_events.6.t: "[From.GetNameDefCap]提議成立波蘭-立陶宛至高聯盟"
 LIT_events.6.d: "[From.Capital.GetName]今日發來電報，他們希望[Root.GetNonIdeologyName]和[From.GetNonIdeologyName]攜手組建一個足以與[GER.GetNameDef]和[SOV.GetNameDef]匹敵的新陣營。作為被兩大強權包圍的民族主義國家，我們兩國和其他歐洲強國的聯繫幾乎被中斷，而西方民主勢力也不太願意加入我們和法西斯國家的衝突。\n\n[From.GetLeader]提議[Root.GetAdjective]和[From.GetAdjective]兩國放下自建國以來的衝突，[From.GetLeader.GetSheHeCap]希望我們統一成為波蘭-立陶宛至高聯盟，這個同盟基於聯邦原則，但尊重民族主義價值觀。"
 LIT_events.6.a: "多麼令人鼓舞！"
 LIT_events.6.b: "我不同意。"
 LIT_events.601.t: "[From.GetNameDef]加入聯盟"
 LIT_events.601.d: "毫不意外，波蘭人同意加入波蘭-立陶宛至高聯盟。儘管這不是立陶宛人對波蘭命運的最終構想，但這是為波羅的海的未來保駕護航的重要第一步。"
 LIT_events.601.a: "終為一體。"
 LIT_events.602.t: "[From.GetNameDefCap]拒絕聯盟"
 LIT_events.602.d: "[Root.GetAdjective]部長很驚訝，[From.GetNameDef]拒絕加入波蘭-立陶宛至高聯盟。這似乎讓緊張氛圍在兩國之間無處消散，這次拒絕合作很可能導致近期再發暴力衝突。"
 LIT_events.602.a: "或許他們必須被強行說服。"
 LIT_events.7.t: "[From.GetNameDefCap]要求[POL.GetAdjective]加入[Root.GetFactionName]"
 LIT_events.7.d: "[From.GetAdjective]同[POL.GetAdjective]積極開展合作，[From.GetAdjective]外交部長在今天與[Root.GetAdjective]官員會面，我方要求[POL.GetNameDef]加入[Root.GetFactionName]。"
 LIT_events.7.a: "一個很棒的提議！"
 LIT_events.7.b: "我們對波蘭另有打算。"
 LIT_events.701.t: "[From.GetNameDefCap]阻止[POL.GetAdjective]加入[From.GetFactionName]"
 LIT_events.701.d: "可悲的是，[From.GetFactionName]的領導人認為，[POL.GetAdjective]加入[From.GetFactionName]並不符合他們的最大利益。很明顯，[From.GetNameDef]對[POL.GetNameDef]另有打算。"
 LIT_events.701.a: "哦，好吧。"
 LIT_events.8.t: "[From.GetNameDefCap]呼籲統一"
 LIT_events.8.d: "長期以來，[Root.GetAdjective]官員一直致力於重塑舊聯邦，但總是遭到立陶宛方面的拒絕。然而在今天，[From.GetLeader]提出了一個歷史性的提案，即重塑波蘭-立陶宛聯邦。但令人困惑的是，這項提案並不會將波蘭與立陶宛置於平等的地位，事實上，這項提議會使[From.GetLeader]成為兩國的絕對獨裁者。"
 LIT_events.8.a: "我願意做出這樣的犧牲。"
 LIT_events.8.b: "沒門。"
 LIT_events.801.t: "[From.GetNameDefCap]同意！"
 LIT_events.801.d: "[From.GetLeader]以放棄波蘭獨裁者的職位和讓權於[Root.GetLeader]的方式，回應了[Root.GetAdjective]有關兩國再聯合的要求。聯邦的再次統一，是[From.GetNameDef]和[Root.GetNameDef]兩國未來同呼吸共命運的歷史里程碑。"
 LIT_events.801.a: "好極了。"
 LIT_events.802.t: "[From.GetNameDefCap]拒絕"
 LIT_events.802.d: "這些波蘭人似乎還沒有準備好同[Root.GetNameDef]再次聯合。儘管[Root.GetNameDefCap]嘗試去恢復舊聯邦聯盟的架子，但[From.GetAdjective]部長們似乎一點也不為所動。"
 LIT_events.802.a: "或許波蘭人必須要被強行說服。"
 LIT_events.9.t: "[From.GetNameDefCap]要求佔領波蘭"
 LIT_events.9.d: "根據波蘭和立陶宛之間長久的合作歷史，[From.GetLeader]建議如果讓[From.GetNameDef]由[Root.GetFactionName]單方面管理，那麼波蘭的事將萬事大吉。這麼做後會犧牲波蘭所提供的戰略資源，但這同時也意味立陶宛將負責應對波蘭的抵抗。"
 LIT_events.9.a: "我看可以。"
 LIT_events.9.b: "我們不同意。"
 LIT_events.901.t: "[From.GetNameDefCap]移交了波蘭佔領區"
 LIT_events.901.d: "[Root.GetAdjective]要求支配[From.GetNameDef]的波蘭佔領區獲得了成功。[From.GetAdjective]的將士們正在返回[From.GetNonIdeologyName]以根據戰事而重新調遣，[Root.GetAdjective]的士兵們將接管並進駐他們原來的波蘭地區駐地。"
 LIT_events.901.a: "立陶宛萬歲！"
 LIT_events.902.t: "[From.GetNameDefCap]拒絕"
 LIT_events.902.d: "[Root.GetAdjective]對波蘭佔領區的統治要求被[From.GetNameDef]徹底的拒絕了。這次嘗試被認為是[Root.GetLeader]的代表試圖控制波蘭主要的工業區並削弱[From.GetAdjective]對波蘭領土的宣稱而被無視了。"
 LIT_events.902.a: "值得一試"
 LIT_events.10.t: "長槍黨內戰"
 LIT_monarchy_events.1.t: "雙王困局"
 LIT_monarchy_events.1.desc: "如今波蘭和立陶宛的都有國王在位，任何和平統一聯邦的嘗試看起來都不太可能。然而，鑑於兩國在意識形態上的一致，或許還有另一種把兩國關係更進一步的方法。如果我們願意，可以向[POL_or_LIT_target.GetLeader]提議兩國結盟，作為聯邦在外交層面上的一種重新構想。團結一致，我們就作為朋友齊步向前，如若不能，則有一方必須成為敵人。"
 LIT_monarchy_events.1.a: "聯盟聽上去不錯"
 LIT_monarchy_events.1.b: "天無二日！"
 LIT_monarchy_events.101.t: "[From.GetLeader]拒絕和平"
 LIT_monarchy_events.101.desc: "[From.GetLeader]無視了我們和平統一聯邦的嘗試，拒絕與我國結成友好合作關係，還聲稱“[From.GetNonIdeologyName]只有一個國王”。看起來同[From.GetNameDef]的戰爭已避無可避。"
 LIT_monarchy_events.101.a: "真是太沒有教養了。"
 LIT_monarchy_events.2.t: "明道加斯三世"
 LIT_monarchy_events.2.desc: "1918年6月4日，威廉·卡爾·馮·烏拉赫以壓倒性優勢被民主選舉為立陶宛國王，然而德意志帝國橫加干涉，宣佈全民公投無效，從此斬斷了立陶宛與她的國王之間的紐帶。但是已故的國王育有一子，隨著德國對立陶宛的統治成為了遙遠的記憶，[Root.GetLeader]已經對卡爾·吉羅·馮·烏拉赫發出邀請，成為立陶宛的新國王！\n\n這位年輕的王室成員被加冕為明道加斯三世，儘管他目前仍被限制為一個禮儀性的虛君，但立陶宛新君逐漸掌權的計劃已排上日程。"
 LIT_monarchy_events.2.a: "國王陛下萬歲！"
 LIT_monarchy_events.2_tt: "§Y明道加斯三世§!成為了[Root.GetNonIdeologyName]的國王。同時§Y[Root.GetLeader]§!將作為[Root.GetRulingParty]的領袖留任。"
 LAT_events.1.t: "真正的敵人"
 LAT_events.1.d: "雖然[Root.GetNameDef]取得了獨立，但這個民族從未真正擺脫帝國主義的民族枷鎖。[GER.GetAdjective]和[SOV.GetAdjective]都有野心和計劃，要把[Root.GetNameDef]併入他們各自的帝國，而對[Root.GetNameDef]的自決權置之不理。雖然為了維持[Root.GetAdjective]的獨立，許多人渴望在所有戰線上作戰，但在這兩個大國中，我們必須決定誰是最緊迫的威脅，並採取適當措施準備應對入侵。"
 LAT_events.1.a: "[SOV.GetNameDefCap]是真正的威脅！"
 LAT_events.1.b: "我們不能信任[GER.GetNameDef]。"
 LAT_events.8.t: "拉脫維亞一片火海"
 LAT_events.8.d: "政府決定解除對法西斯主義組織“雷霆十字”的禁令，這使得古斯塔夫斯·採爾明什和他的支持者有恃無恐，在拉脫維亞各地更加活躍和暴力。這種暴力在今天達到了頂峰，因為雷霆十字黨已經武裝起來並向里加進軍，要求拉脫維亞政府立即投降。\n\n雖然政府顯然有意與雷霆十字黨合作，但該組織似乎無意將[Root.GetLeader]接納進政權。"
 LAT_events.8.a: "我們會碾碎這些叛徒！"
 LAT_events.8.b: "為了更強大的拉脫維亞！"
 nsb_coup.0.t: "軍官團內的陰謀？"
 nsb_coup.0.desc: "我們的一些將軍對[Root.GetNameDef]的情況不滿意，雖然這是公開的秘密，但為了解決我們的分歧，他們中的一些人似乎可能已經開始考慮採取更激烈的措施。在一個未知地點，各個軍官之間已經召開了一些會議，據信是在[?.Root.meeting_location.GetName]的某個地方。\n\n雖然細節不詳，但我們有理由相信[coup_member_1.GetName]和[coup_member_2.GetName]就在這群人中。後者被認為與[coup_member_3.GetName]有聯繫，儘管他們之間關係的確切性質尚不清楚。"
 nsb_coup.0.a: "一定要究根問底。"
 nsb_coup.1.t: "[Root.GetLeader]接管政府"
 nsb_coup.1.desc: "經過數週的籌謀，[Root.GetLeader]麾下的幾位軍官啟動了[Root.GetOperationName]計劃，意在奪取政權。\n\n長時間的準備終於有了回報，忠於[Root.GetLeader]的部隊迅速佔領所有政府重要建築。面對壓倒性的人數優勢，衛兵和警察部隊未做抵抗。同時，首都周圍設置的關卡抓獲了所有企圖逃跑的政府要員。\n\n基於[Root.GetLeader]圈禁了前政府內閣，擺在[Root.GetNameDef]的其他人面前的是已成定局的事實。據信各地方行政機構也會立刻歸順。"
 nsb_coup.1.a: "我，代表個人，歡迎我們的新統治者。"
 #translation notes: these are names and shouldn't be translated - non-latin alphabets may however transcribe them
 GER_operation_1: "女武神行動"
 GER_operation_2: "磨刀石行動"
 GER_operation_3: "鬥牛行動"
 GER_operation_4: "天使長行動"
 USA_operation_1: "烈日行動"
 USA_operation_2: "狂歡節行動"
 USA_operation_3: "墨池行動"
 USA_operation_4: "野貓行動"
 ENG_operation_1: "長劍行動"
 ENG_operation_2: "甜魚行動"
 ENG_operation_3: "小丑行動"
 ENG_operation_4: "日珥行動"
 #translation notes: these generic operation names can be translated
 generic_operation_1: "意外事件1"
 generic_operation_2: "意外事件2"
 generic_operation_3: "意外事件3"
 generic_operation_4: "意外事件4"
 nsb_coup.2.t: "政變嘗試失敗"
 nsb_coup.2.desc: "經過數週的密謀，昨夜幾位軍官發動了[Root.GetOperationName]計劃，意在奪取政權。\n\n他們似乎出於某些原因被迫提前行動，人員內部明顯缺乏協調，準備不足。一群負責執行政變計劃的士兵突然出現在了[Root.GetLeader]的辦公室內，他們受命將其拘禁或擊斃，卻由於忽略守衛排班表的變化，恰遇了輪值時間，不得不面對兩倍於預期的守軍。在短暫和激烈的交火後，雙方互有傷亡，而[Root.GetLeader]早已逃之夭夭。\n\n之後，[Root.GetLeader]在公共場合露面，並在廣播節目內發聲，表示了刺殺行動的失敗。政變敗露後，部分軍隊軍官不願被捕，選擇自殺，亦或與前來拘捕他們的軍隊死戰到底，各地衛戍部隊的指揮官也都無不向[Root.GetLeader]宣誓效忠。"
 nsb_coup.2.a: "就這些人還想統治這個國家？"
 nsb_coup.3.t: "軍官試圖發動政變"
 nsb_coup.3.desc: "經過數週的密謀，昨夜幾位軍官啟動了[Root.GetOperationName]計劃，意在奪取政權。\n\n他們似乎出於某些原因被迫提前行動，而事態急轉直下，很快失去控制。拘禁和刺殺[Root.GetLeader]的嘗試均被挫敗，首都四周的關卡也未及時關閉，從而許多政府要員得以逃脫。\n\n[Root.GetNameDef]政府因此逃過一劫，[Root.GetLeader]則承諾會採取一切必要手段將叛徒繩之以法。"
 nsb_coup.3.a: "我們會粉碎這場叛亂！"
 LAT_events.2.t: "[From.GetNameDefCap]要求合併[Root.GetAdjective]"
 LAT_events.2.d: "鑑於波羅的海局勢緊張，[From.GetLeader]表明：為了三個國家的存續，統一勢在必行。然而[From.GetNameDef]外交部長的這個提案不僅會把[Root.GetLeader]趕下臺，而且[From.GetLeader]和[From.GetLeader.GetHerHis]的政府會從根本上把控整個[Root.GetRulingParty]黨。"
 LAT_events.2.a: "我們有得選嗎？"
 LAT_events.2.b: "決不可能！"
 LAT_events.3.t: "[From.GetNameDefCap]支持[Root.GetAdjective]民族主義"
 LAT_events.3.d: "在一場關於波羅的海團結實質的激情演說上，[From.GetLeader]讚揚了[Root.GetLeader]在面對日漸增長的布爾什維克威脅時仍堅定不移地投身民族主義。儘管[From.Getleader.GetSheHe]聲稱尊重[From.GetAdjective]與[Root.GetAdjective]的獨立國家認同，但[From.Getleader.GetSheHe]同時呼籲[From.GetNonIdeologyName]與[Root.GetNonIdeologyName]應為保證自身獨立的共同目標而通力合作。儘管這些話現在看上去只是表面文章，但許多人推測一個聯盟提案正在悄悄醞釀。"
 LAT_events.3.a: "有意思"
 LAT_events.5.t: "[From.GetLeader]尋求統一東方領"
 LAT_events.5.d: "隨著白俄羅斯西部現已被[Root.GetFactionName]牢牢控制，[From.GetNonIdeologyName]的獨裁者宣佈有意在佔領區建立[From.GetAdjective]治下的東方領。該提議意在於波羅的海和白俄羅斯地區宣傳法西斯主義意識形態，並擴張[Root.GetFactionName]在東方的勢力。"
 LAT_events.5.a: "頗受鼓舞！"
 LAT_events.5.b: "不行。"
 LAT_events.501.t: "[From.GetNameDefCap]移交東方領"
 LAT_events.501.d: "東方領已成功移交給[Root.GetAdjective]，[From.GetNameDef]已經承認[Root.GetNameDef]是波羅的海國家和白俄羅斯西部的唯一統治者。"
 LAT_events.501.a: "好極了！"
 LAT_events.502.t: "[From.GetNameDefCap]拒絕"
 LAT_events.502.d: "[From.GetNameDef]斷然拒絕了[Root.GetAdjective]想要獲取東方領控制權的要求。這項行為被揣測為[Root.GetLeader]意在掌控東部人口中心，同時削弱[From.GetNameDef]的實力。"
 LAT_events.502.a: "真是拉脫維亞悲傷的一天。"
 LAT_events.6.t_both: "[From.GetNameDefCap]請求波羅的海國家加入[Root.GetFactionName]"
 LAT_events.6.d_both: "今天，[From.GetNameDefCap]向所有波羅的海國家發出了加入[Root.GetFactionName]的邀請。鑑於民族主義在[LIT.GetNameDef]及[EST.GetNameDef]大獲成功，且波羅的海國家之間的紐帶也為合作提供了便捷。[From.GetLeader]便提出了一份振奮人心的提議：[Root.GetAdjective]政府會把[LIT.GetLeader]和[EST.GetLeader]當作民族主義事業道路上的堅實盟友。"
 LAT_events.6.t_estonia: "[From.GetNameDefCap]請求[EST.GetAdjective]加入[Root.GetFactionName]"
 LAT_events.6.d_estonia: "今天，[From.GetNameDefCap]向[EST.GetNonIdeologyName]發出了加入[Root.GetFactionName]的邀請。鑑於民族主義在[EST.GetNameDef]大獲成功，且波羅的海國家之間的紐帶也為合作提供了便捷。[From.GetLeader]便提出了一份振奮人心的提議：[Root.GetAdjective]政府會把[EST.GetLeader]當作民族主義事業道路上的堅實盟友。"
 LAT_events.6.t_lithuania: "[From.GetNameDefCap]請求[LIT.GetAdjective]加入[Root.GetFactionName]"
 LAT_events.6.d_lithuania: "今天，[From.GetNameDefCap]向[LIT.GetNonIdeologyName]發出了加入[Root.GetFactionName]的邀請。鑑於民族主義在[LIT.GetNameDef]大獲成功，且波羅的海國家之間的紐帶也為合作提供了便捷。[From.GetLeader]便提出了一份振奮人心的提議：[Root.GetAdjective]政府會把[LIT.GetLeader]當作民族主義事業道路上的堅實盟友。"
 LAT_events.6.a: "好主意！"
 LAT_events.6.b: "荒謬！"
 LAT_events.601.t: "[From.GetNameDefCap]拒絕波羅的海國家加入[From.GetFactionName]"
 LAT_events.601.d: "雖然我們十分熱切地歡迎[Root.GetNameDef]加入[From.GetFactionName]，但[From.GetLeader]在[From.GetLeader.GetHerHis]的心裡似乎並不想讓波羅的海同胞有能力自衛。我們對波羅的海同胞的邀請遭到拒絕，看來兩國暫時仍將各自為政。"
 LAT_events.601.a: "好吧。"
 LAT_events.7.t: "[Root.GetFascistParty]進軍[Root.Capital.GetName]!"
 LAT_events.7.d: "在[From.GetNameDef]法西斯政府的大力支持下，[Root.GetFascistParty]的支持者以暴力的方式聚集在[Root.Capital.GetName]的街頭。這群狂徒在抵達[Root.Capital.GetName]的議會大樓後，叫囂著要求[Root.GetLeader]下臺。而此時以[Root.GetLeader]為首的幾個[Root.GetRulingParty]要員正在開會。"
 LAT_events.7.a: "解決這幫暴民！"
 LAT_events.7.b: "也許[Root.GetLeader]該下臺了。"
 EST_events.1.t: "[From.GetNameDefCap]希望締結友好條約"
 EST_events.1.d: "出於對[SOV.GetAdjective]入侵的擔憂，[From.GetLeader]正式發出請求，希望[Root.GetNameDef]與[From.GetNameDef]兩國間締結盟約。條約的內容除了承諾互不侵犯外，還包含了一系列意在建立[Root.GetNonIdeologyName]及[From.GetNonIdeologyName]雙方合作的條款。"
 EST_events.1.a: "不錯的提議。"
 EST_events.1.b: "我們對[From.GetNameDef]另有打算。"
 EST_events.101.t: "[From.GetNameDefCap]同意"
 EST_events.101.d: "[From.GetLeader]清楚地看到了[Root.GetNameDef]和[From.GetNameDef]兩國間未來潛在聯盟的價值，並同意與我國構建友好關係。"
 EST_events.101.a: "好極了。"
 EST_events.102.t: "[From.GetNameDefCap]拒絕"
 EST_events.102.d: "儘管[Root.GetLeader]已盡到最大努力，[From.GetNameDef]似乎仍與[Root.GetNonIdeologyName]作對。其拒絕當前影響不大，但若面臨[SOV.GetAdjective]入侵，[From.GetNameDef]將會作壁上觀。"
 EST_events.102.a: "該死。"
 EST_events.2.t: "[From.GetNameDefCap]尋求統一"
 EST_events.2.d: "[From.GetLeader]今天提出了統一[From.GetNameDef]和[Root.GetNameDef]兩國的議案。[From.GetAdjective]政府與[Root.GetNameDef]緊密聯繫已是無可辯駁的事實，沒有瓦普運動，[Root.GetFascistParty]就幾乎不可能掌控[Root.GetNonIdeologyName]。即使當下，我國軍隊仍十分支持瓦普運動。[From.GetLeader]聲稱一個由芬蘭和愛沙尼亞組成的聯盟將更好地武裝兩國與同一個民族，以抵禦可預期內[SOV.GetAdjective]入侵。"
 EST_events.2.a: "我們別無選擇"
 EST_events.2.b: "立刻驅逐瓦普運動！"
 EST_events.201.t: "[From.GetNameDefCap]接受統一"
 EST_events.201.d: "[From.GetLeader]已明智地決定，接受兩國的統一。為了支持[Root.GetLeader]，[From.GetLeader]已經辭去[From.GetAdjective]政府首腦的職務並接受了新統一的[Root.GetAdjective]-[From.GetAdjective]政府中的一個副職。"
 EST_events.201.a: "太好了！"
 EST_events.202.t: "[From.GetNameDefCap]拒絕與[Root.GetAdjective]統一"
 EST_events.202.d: "儘管瓦普政府的[Root.GetNonIdeologyName]對[From.GetNameDef]的影響力極大，[From.GetLeader]還是拒絕了[Root.GetAdjective]統一的努力。"
 EST_events.202.a: "這持續不了多久的！"
 EST_events.4.t: "[From.GetNameDefCap]尋求實現波羅的國家統一"
 EST_events.4.d: "波羅的國家有著共同的被外國壓迫的歷史：波蘭、德意志、俄羅斯。然而如今，[From.GetLeader]宣佈被壓迫時代到此為止！儘管民族主義與自決的美德在所有波羅的民族的心中燃燒著，[From.GetLeader]卻令人信服地斷言我們被外國統治的歷史可以被獨一地歸咎於缺乏團結。儘管人們渴望獨立，逐漸增長的[SOV.GetAdjective]入侵威脅需要我們的政府採納某種形式上的泛民族主義。\n\n[From.GetLeader.GetSheHeCap]提議建立[BAL_UNIFIED_fascism]以確保我等民族國家的安全，並有能力反擊試圖奴役我們的外來勢力。"
 EST_events.4.a: "也許我們的相似多於分歧。"
 EST_events.4.b: "泛波羅的海認同？不存在的！"
 EST_events.401.t: "[From.GetNameDefCap]同意！"
 EST_events.401.d: "[From.GetLeader]已經被[Root.GetAdjective]建構泛波羅的民族認同的努力成功動搖，且已同意將[From.GetFascistParty]併入[Root.GetFascistParty]。這是[Root.GetLeader]一統波羅的目標的一次堅實的勝利，[Root.GetNameDef]無疑將在抵禦[SOV.GetAdjective]入侵時處於更好的位置。"
 EST_events.401.a: "[From.GetNonIdeologyName]僅僅是個開始。"
 EST_events.402.t: "[From.GetNameDefCap]拒絕統一"
 EST_events.402.d: "[From.GetNameDef]沒有被[Root.GetLeader]波羅的統一的說辭所動搖，且已拒絕與[Root.GetNameDef]統一，認為這不過是妨礙[From.GetAdjective]民族為[From.GetNonIdeologyAdjective]民族讓渡[From.GetNonIdeologyName]權力的帝國主義行徑。"
 EST_events.402.a: "他們難道更想加入[SOV.GetAdjective]嗎？叛徒！"
 EST_events.5.t: "[From.GetNameDefCap]抨擊[Root.GetAdjective]獨立"
 EST_events.5.d: "[From.GetLeader]今天已經播報對[Root.GetAdjective]政府毫無保留的抨擊，聲稱該政府無力保護其民眾免遭外部帝國主義者的侵害。雖然當下仍停留在口頭層面，但我們能預感[From.GetAdjective]的入侵即將來臨。"
 EST_events.5.a: "[From.GetLeader]只會吹牛逼。"
 EST_events.6.t: "[From.GetNameDefCap]請求[FIN.GetAdjective]加入[Root.GetFactionName]"
 EST_events.6.d: "[From.GetNameDefCap]今天向[FIN.GetNonIdeologyName]請求其發出加入[Root.GetFactionName]的邀請。基於民族主義在其國家的壓倒性成功以及芬蘭-愛沙尼亞合作的天然意願，[From.GetLeader]熱情地提議[Root.GetAdjective]政府將[FIN.GetLeader]作為民族主義事業的盟友。"
 EST_events.6.a: "好主意！"
 EST_events.6.b: "荒謬！"
 EST_events.601.t: "[From.GetNameDefCap]拒絕[FIN.GetAdjective]進入[From.GetFactionName]"
 EST_events.601.d: "雖然[From.GetFactionName]張開雙臂歡迎[Root.GetNameDef]的加入，但[From.GetLeader]的內心似乎並不打算給予[FIN.GetNameDef]自衛權。我們對芬蘭人邀請被拒絕了，看來兩國將暫時保持分離。"
 EST_events.601.a: "[From.GetLeader]到底是瘋子還是傻子？"
 EST_events.7.t: "瓦普內戰"
 EST_events.7.d: "長久以來的遊行示威終於徹底破壞掉了[Root.GetNonIdeologyName]僅存的團結，全面的內戰已經在國境內爆發。政府原本對[Root.GetFascistParty]輕微的鎮壓計劃於昨天演變成了與抗議者們暴力的衝突，衝突中的老兵們與他們曾經效忠的[Root.GetAdjective]陸軍刀劍相向。[Root.GetFascistParty]的支持者們和政府的效忠者們已經兩極分化，他們為了[Root.Capital.GetName]的控制權必須決一生死，[Root.GetLeader]和[neutral_EST_civil_war.GetLeader]只能成王敗寇。"
 EST_events.7.a: "為了[Root.GetNonIdeologyName]！"
 EST_events.9.b: "要不然我們投降算了……"
 EST_events.701.t: "[Root.GetLeader]退讓"
 EST_events.701.d: "當[Root.GetLeader]政府的代表們和瓦普運動成員最終爆發衝突時，瓦普運動的全國遊行於今天達到了沸點。在亞瑟·瑟克的號召下，抗議者們砸開了愛沙尼亞議會的大門並設置了臨時掩體，以此來防止執法部門進入建築。\n很多愛沙尼亞人都盼著[Root.GetLeader]能夠用武力來回應這些抗議者，但國民們沒想到的是，愛沙尼亞議會今天收到了[Root.GetLeader]的辭職信。信中宣佈，愛沙尼亞的總統席位將被讓位於亞瑟·瑟克。"
 EST_events.701.a: "愛沙尼亞站起來了！"
 EST_events.801.t: "在[?ROOT.vaps_from.GetName]的混亂進軍"
 EST_events.801.d: "[Root.GetFascistParty]於[?ROOT.vaps_from.GetName]的示威遊行在民間反響不一，地方政府則使用暴力打壓。示威人群中能夠說明本次抗議原因的人寥寥無幾，而遊行的重點似乎也變成了抗議者和反抗議者們之間的暴力衝突。[Root.GetAdjective]政府已經展開了打擊[Root.GetFascistParty]的工作，而今天的暴力事件對他們百無一利，卻似乎只能加快他們的末日的到來。"
 EST_events.801.a: "簡直是一場災難。"
 EST_events.801.b: "我們必須立即鎮壓這些叛軍！"
 FIN_putting_down_insurgents_tt: "該地區不會向§Y獨立戰士聯盟叛軍§!效忠"
 EST_events.802.t: "在[?ROOT.vaps_from.GetName]的進軍"
 EST_events.802.d: "[Root.GetFascistParty]跨越[?ROOT.vaps_from.GetName]的進軍無關痛癢地結束了。[Root.GetFascistParty]將遊行的地點選在了[?ROOT.vaps_from.GetName]的鄉間而不是主要的人口集中地點，從而向[Root.GetName]的人民表明了他們的立場，同時也避免了來自[Root.GetAdjective]軍官們的回擊。"
 EST_events.802.a: "有意思"
 EST_events.803.t: "在[?ROOT.vaps_from.GetName]的法西斯大進軍"
 EST_events.803.d: "在[?ROOT.vaps_from.GetName]全境，[Root.GetFascistParty]的示威者們蜂擁而至，展現了他們對強大的民族主義政權的支持。雖然軍官們盡力阻止了他們進入高人口密度地區，但他們只能放下武器並讓[Root.GetFascistParty]成員和平地在街道上游行。反抗議力量的缺失導致了[Root.GetFascistParty]運動的重大勝利。"
 EST_events.803.a: "非常有意思"
 EST_events.901.t: "[?FIN.EST_previous_finnish_leader.GetName]退讓"
 EST_events.901.d: "今天，當[FROM.GetFascistParty]的武裝進入[From.GetAdjective]首都的時候，看似不可避免的內戰出乎意料地並沒有爆發。前[From.GetAdjective]政府宣佈交出自己的權力並讓位於[FROM.GetFascistParty]黨的領袖。"
 EST_events.901.a: "好吧，這我真沒想到！"
 EST_events.10.t: "干預問題"
 EST_events.10.d: "[FIN.GetNonIdeologyName]爆發了內戰，但[Root.GetNameDef]仍未決定要在此次衝突中扮演何種角色。現在，瓦普運動與[FIN.GetNonIdeologyAdjective]法西斯主義者的聯合僅能夠為自主奪權而勉強武裝組織起來，但就像他們從前為了[EST.GetAdjective]的獨立而奮鬥那樣，也許[Root.GetLeader]會將這視為一次償還[EST.GetNonIdeologyName]對芬蘭人欠下的債的機會。"
 EST_events.10.a: "老兵們再一次並肩而戰了！"
 EST_events.10.b: "只要一支相對龐大的志願軍就夠了。"
 EST_events.11.t: "瓦普運動和[Root.GetFascistPartyName]"
 EST_events.11.d: "在愛沙尼亞獲取了權力的瓦普運動與[Root.GetFascistPartyName]簽署了合作條約。瓦普運動已經開始支持芬蘭境內的法西斯主義團體進行政治宣傳和境內示威，但如果政府能夠快速果斷地制止這些法西斯主義行動，也許它們可以直接被斬草除根。"
 EST_events.11.a: "世界上沒有善良的暴發戶。"
 NSB_poland_communist_events.1.a: "[POL.GetNameDefCap]孤立無援"
 NSB_poland_communist_events.1.b: "波蘭屬於蘇聯。"
 NSB_poland_communist_events.1.desc: "波蘭共產黨長期以來分裂為相互鬥爭的兩派。一派希望波蘭與蘇聯結盟，而另一派視蘇聯與沙俄帝國主義無異。\n瑪麗亞·科蘇茨卡作為反蘇派的代表，據稱是個[Root.GetStalinistOrTrotskyite]，指責親蘇的同志們為“軟骨頭”和革命的敵人。\n作為事實上的領導人，瓦迪斯瓦夫·哥穆爾卡是黨內親蘇派的代表。儘管在黨內聲望很高，但在群眾間因其親俄立場而倍受指責。\n雖然共產黨現在控制了波蘭，但也陷入了將哪一派的候選人推上大位的爭執。在一片猶豫不決之中，來自莫斯科的壓力越來越大。他們不僅要求拒絕科蘇茨卡擔任領導人，還要求拿她按[Root.GetStalinistOrTrotskyite]與反革命罪審判。"
 NSB_poland_communist_events.1.nosov.desc: "波蘭共產黨長期以來分裂為相互鬥爭的兩派。一派希望波蘭與蘇聯結盟，而另一派視蘇聯與沙俄帝國主義無異。\n然而，自從蘇聯沒落後，這個問題就無關緊要了。斯大林倒臺後，親蘇派領導人瓦迪斯瓦夫·哥穆爾卡的影響力也一落千丈，從此無人與反蘇派的瑪麗亞·科蘇茨卡競爭黨的領導人職務。"
 NSB_poland_communist_events.1.t: "波蘭共產黨的內訌"
 NSB_poland_events.1.a: "我們別無選擇"
 NSB_poland_events.1.b: "我們不會在波蘭面前畏縮！"
 NSB_poland_events.1.desc: "基於我國明顯缺少對[Root.GetNameDef]的防衛能力的理由，[From.GetNameDef]的官員要求將整個斯洛伐克地區置於波蘭的直接控制下。他們直截了當地要求，若不退讓，就要入侵。我們該怎麼回覆？"
 NSB_poland_events.1.t: "[From.GetNameDefCap]要求獲得斯洛伐克"
 NSB_poland_events.101.a: "沒想到居然成了！"
 NSB_poland_events.101.desc: "[From.GetNameDefCap]已經接受了我國此前的要求，移交了整個斯洛伐克地區。[Root.GetAdjective]部隊已經開進該地區鎮壓抵抗，以防發生暴動。這場勝利儘管只是一小步，卻代表著這個世界至少還是對[Root.GetAdjective]戰爭機器有所忌憚！"
 NSB_poland_events.101.t: "[From.GetNameDefCap]同意！"
 NSB_poland_events.102.a: "好吧，開戰！"
 NSB_poland_events.102.desc: "[From.GetAdjective]政府令人震驚地拒絕了我國有關移交斯洛伐克地區的要求。我國試圖尋求外交途徑解決的方案失敗了，接下來就是軍隊的事了。"
 NSB_poland_events.102.t: "[From.GetNameDefCap]拒絕了！"
 NSB_poland_events.2.a: "我覺得必須同意。"
 NSB_poland_events.2.b: "啥“宣稱”啊，哪來的？"
 NSB_poland_events.2.d: "[Root.GetNameDef]長期的攝政通知讓[From.GetLeader]覺得自己能讓[From.GetLeader.GetHerselfHimself]當上匈牙利國王。這一宣稱僅基於中世紀曇花一現的波蘭-匈牙利王國，顯然不過是領土擴張的公然企圖。"
 NSB_poland_events.2.t: "[From.GetLeader]宣稱[Root.GetAdjective]王位！"
 NSB_poland_events.201.a: "好極了。"
 NSB_poland_events.201.desc: "現在看來，別的匈牙利王位宣稱者都被否決掉了，因為[Root.GetLeader]當上了匈牙利國王。既然[Root.GetLeader]現在已經波蘭和匈牙利兩國國王，[Root.GetAdjective]愈加接近其巴爾幹霸權的野心。"
 NSB_poland_events.201.t: "匈牙利屈服"
 NSB_poland_events.202.a: "他們讓我們別無選擇的。"
 NSB_poland_events.202.desc: "[From.GetAdjective]政府的領導人宣佈不會承認[Root.GetLeader]對[From.GetAdjective]王位的任何宣稱，這封住了任何和平方式吞併[From.GetNameDef]的途徑，也就意味著這隻能通過戰爭實現了。"
 NSB_poland_events.202.t: "[From.GetNameDefCap]拒絕[Root.GetLeader]的宣稱"
 NSB_poland_events.3.a: "我們接受！"
 NSB_poland_events.3.b: "[From.GetNonIdeologyName]仍是我們的敵人。"
 NSB_poland_events.3.c: "給他們但澤，交易有了！"
 NSB_poland_events.3.desc: "[From.GetNameDef]官員宣佈有意於同新生的德意志帝國簽署同盟條約。[From.GetNameDef]一面相信[Root.GetLeader]皇帝比起[Root.GetHerHis]前任更能接受獨立的[From.GetAdjective]，同時基於舊同盟國所簽署的十一月五日敕令當下在[From.GetNameDef]運用，提議兩國建立正式同盟關係。\n如果我們接受，則標誌著[Root.GetNonIdeologyName]與[From.GetNonIdeologyName]歷史關係的重大轉折，以及兩國共同的光明未來。"
 NSB_poland_events.3.t: "[From.GetNameDefCap]提議結盟"
 NSB_poland_events.301.a: "波蘭歷史上的偉大一天！"
 NSB_poland_events.301.desc: "[From.GetNameDef]令人驚訝地同意與[Root.GetNameDef]建立正式同盟關係！儘管一度宿敵，[Root.GetNonIdeologyName]與[From.GetNonIdeologyName]勢不兩立的時代已經進了歷史的垃圾堆，兩國在未來將在極端意識形態興風作浪的時代裡攜手前行。\n許久之前，德國通過十一月五日敕令在其佔領區上建立以一個獨立的[Root.GetAdjective]王國，現在已演變成載入史冊的一段佳話——“十一月同盟”。"
 NSB_poland_events.301.t: "德皇同意了！"
 NSB_poland_events.302.a: "多麼令人失望"
 NSB_poland_events.302.desc: "儘管我國付出了最大的外交努力，兩國利益看起來真的很一致，但是德意志皇帝拒絕簽署任何正式同盟協定。德國無論是君主在位還是法西斯在位，似乎並沒有多少差別。"
 NSB_poland_events.302.t: "窮兵黷武的德皇"
 NSB_poland_events.303.a: "拿那座麻煩的城市換一支軍隊似乎挺好。"
 NSB_poland_events.303.desc: "[From.GetNameDefCap]回覆提出了一個有條件的協議，且聲稱這是雙贏互利的。該國認為，十一月五日敕令從未正式將格但斯克和格丁尼亞地區割讓新成立的[Root.GetAdjective]王國。他們同時聲明瞭同意簽署同盟條約的意向，前提是這些違背得過意願的事情必須得以糾正。"
 NSB_poland_events.303.t: "但澤換取保障"
 NSB_poland_events.304.a: "我們將用武力接管它。"
 NSB_poland_events.304.desc: "不幸的是，我們似乎沒能同波蘭達成協議，後者拒絕了用但澤換取結盟的提議。[From.GetAdjective]邊界上的緊張局勢不斷升溫，一些人擔心戰爭即將來臨。"
 NSB_poland_events.304.t: "[From.GetNameDefCap]拒絕"
 NSB_poland_events.4.a: "賣給他們吧！"
 NSB_poland_events.4.b: "[POL_colony_purchase.GetName]是[Root.GetAdjective]殖民帝國不可分割的一部分！"
 NSB_poland_events.4.desc: "波蘭海事與殖民聯盟今日在[From.Capital.GetName]同[Root.GetAdjective]大使接觸，提出購買我國在[POL_colony_purchase.GetName]的海外領土。把[POL_colony_purchase.GetName]賣給波蘭能給[Root.GetNameDef]提供可觀的財政盈餘，然同時也會將整個[POL_colony_purchase.GetName]同其大量資源與人口拱手讓與[From.GetNameDef]。"
 NSB_poland_events.4.t: "波蘭要求購買[POL_colony_purchase.GetName]"
 NSB_poland_events.401.a: "[POL_colony_purchase.GetName]的人們，歡迎加入波蘭！"
 NSB_poland_events.401.desc: "[From.GetNameDefCap]今日回覆我們，表示同意出售海外領土[POL_colony_purchase.GetName]。我們現在只需要和[From.GetNameDef]確定我們的債務，而這片殖民地則會成為蒸蒸日上的[Root.GetAdjective]殖民帝國不可分割的一部分。"
 NSB_poland_events.401.desc.com: "[From.GetNameDefCap]今日回覆我們，表示同意出售海外領土[POL_colony_purchase.GetName]。我們現在只需要和[From.GetNameDef]確定我們的債務，但[POL_colony_purchase.GetName]人民已經從[From.GetAdjective]的殖民主義魔爪中解放出來了。"
 NSB_poland_events.401.desc.dem: "[From.GetNameDefCap]今日回覆我們，表示同意出售海外領土[POL_colony_purchase.GetName]。雖然我們背上了[From.GetNameDef]的債務，但是這次交易正是[Root.GetNameDef]急需的。[POL_colony_purchase.GetName]現在置於我們控制之下，我們又掌握了一處據點，流亡政府可在此繼續存在下去。"
 NSB_poland_events.401.t: "成功購買[POL_colony_purchase.GetName]"
 NSB_poland_events.402.a: "人事已盡。"
 NSB_poland_events.402.desc: "壞消息，[From.GetAdjective]政府目前對轉讓[POL_colony_purchase.GetName]沒有絲毫興趣。雖然這並沒有終結[Root.GetAdjective]的殖民雄心，但是這次失敗也使得[POL_colony_purchase.GetName]的和平移交變得完全不可能。"
 NSB_poland_events.402.t: "[From.GetNameDefCap]拒絕出售[POL_colony_purchase.GetName]"
 NSB_poland_events.6.a: "明智的提議。"
 NSB_poland_events.6.b: "決不。"
 NSB_poland_events.6.desc: "1932年秋季，波蘭得到國際聯盟授權，成為利比里亞獨一的保護者，但由於美國干預，這一決議從未落到實地。儘管如此，在波蘭海事與殖民同盟的運作下，我國的定居和商業事務依然繁榮起來。雙方一直受益於這筆交易，但是[From.GetNameDef]變得日益獨斷，[From.GetLeader]已經正式要求[Root.GetNameDef]成為[From.GetAdjective]的保護國。\n\n如果我們接受，我們將成為[From.GetAdjective]的屬國，這自然伴隨著各種好處與弊端，但如果我們拒絕，那[From.GetLeader]為了實現[From.GetLeader.GetHerHis]的野心，也不排除動武的可能。"
 NSB_poland_events.6.t: "[From.GetNameDefCap]提供保護"
 NSB_poland_events.601.a: "那我們就用武力奪取。"
 NSB_poland_events.601.b: "不要再激化矛盾了。"
 NSB_poland_events.601.desc: "儘管保護國一事已在1932談妥，但看來[From.GetAdjective]已經不願在本國繼續維護[Root.GetAdjective]的利益。"
 NSB_poland_events.601.t: "[From.GetNameDefCap]拒絕"
 NSB_poland_events.7.a: "一個很棒的提議！"
 NSB_poland_events.7.b: "這聽起來像個致命的陷阱。"
 NSB_poland_events.7.desc: "隨著波蘭重建民主，新一屆的波蘭政府尋求加強法波關係，在德國的兩側建立同盟。儘管波蘭仍未從最近的內戰中恢復過來，毫無疑問若兩側同時開戰，將會對[GER.GetNameDef]十分不利。"
 NSB_poland_events.7.t: "波蘭提議締結莫爾日條約"
 NSB_poland_events.701.a: "沒準英國佬會帶上我們。"
 NSB_poland_events.701.desc: "[From.GetNameDef]政府當下拒絕同我國締結正式的同盟。這一慘痛的外交失敗使法波聯盟計劃中的莫爾日陣線徹底泡湯，我們必須轉求其他國家的支持。"
 NSB_poland_events.8.t: "阿納斯塔西婭·羅曼諾夫的命運"
 NSB_poland_events.8.d: "在[From.GetNameDefCap]和他們的盟友奪取了莫斯科之後，我們的特工們在內務人民委員部的檔案裡發現了揭示羅曼諾夫家族的可怖命運的記錄。報告顯示，包括阿納斯塔西婭在內的整個沙皇家族都於1918年的七月被布爾什維克黨殺害了。如果我們的行動不夠果斷，那麼全世界都會知道我們的女王金玉其外，敗絮其中。"
 NSB_poland_events.8.a: "埋藏證據，世界將永遠不會知道"
 NSB_poland_events.8.b: "找個真正能配得上波蘭王冠“熊”姿的來！"
 NSB_poland_monarchist_events.1.t: "[From.GetNameDefCap]宣稱我們的王位"
 NSB_poland_monarchist_events.2.a: "好吧。"
 NSB_poland_monarchist_events.2.desc: "不幸的是我們無法再為索取[From.GetNonIdeologyName]而競爭了。[From.GetAdjective]現在的政府已經獲得了這場宣傳戰的最終勝利，以至於任何關於[Root.GetLeader]宣稱的言論都淪為笑柄。"
 NSB_poland_monarchist_events.2.t: "[Root.GetNameDefCap]的宣稱告吹"
 NSB_poland_monarchist_events.3.a: "該死！"
 NSB_poland_monarchist_events.3.desc: "今天，[From.GetLeader]加冕為[Root.GetNonIdeologyName]國王。在一系列政治宣傳活動後，許多[Root.GetAdjective]的官員們開始反對舊有的政權，進而發動了一場未流血的政變。這場政變讓[Root.GetNonIdeologyName]淪為了[From.GetNameDef]的傀儡國，[Root.GetAdjective]走向自治的道路看起來一片渺茫。"
 NSB_poland_monarchist_events.3.t: "[From.GetLeader]發起政變"
 NSB_poland_monarchist_events.4.a: "叛徒！"
 NSB_poland_monarchist_events.4.desc: "今天，[Root.GetNonIdeologyName]的街道火光沖天，支持和反對君主主義的武裝團體把這個國家推入了內戰的漩渦！[Root.GetLeader]以及[From.GetLeader]兩方的支持者在全國範圍內發生了多起小規模衝突，而[From.GetNameDef]的官員也拒絕表態參與進這個危及我國主權的紛爭之中。如今只能看著這場爭鬥究竟鹿死誰手。"
 NSB_poland_monarchist_events.4.t: "一場君主主義內戰"
 NSB_poland_monarchist_events.5.t: "[From.GetLeader]要求下臺"
 NSB_poland_monarchist_events.5.desc: "在[From.GetLeader]和[From.GetLeader.GetHerHis]政府煽動的長期保王派宣傳之後，[Root.GetLeader]的支持者和那些試圖推動[Root.GetNonIdeologyName]-[From.GetNonIdeologyName]統一的人之間的關係已經到了無法再和平共處的地步。君主主義的支持者毫不含糊地要求[Root.GetLeader]退位，承認[From.GetLeader]是[Root.GetNonIdeologyName]的唯一真正的國王。\n\n接受將使[Root.GetNonIdeologyName]幾乎成為[From.GetAdjective]的傀儡，但拒絕幾乎肯定會導致一場內戰。"
 NSB_poland_monarchist_events.5.a: "我們投降！"
 NSB_poland_monarchist_events.5.b: "寧可要一場戰爭，也不能成為[From.GetAdjective]的傀儡。"
 NSB_poland_royal_election.1.a: "他是我們的國王！"
 NSB_poland_royal_election.1.b: "不，我們有別的打算……"
 NSB_poland_royal_election.1.desc: "邁森侯爵和薩克森王子，阿爾貝特·利奧波德·弗里德里希·克里斯蒂安·西爾維斯特·阿諾·馬卡里烏斯尋求將“波蘭國王”加入到其眾多顯赫的頭銜之中。聯邦許多偉大的君主都是韋廷和薩克森選帝侯家族的成員，況且我國正在尋找一位國王，弗里德里希·克里斯蒂安似乎是國王最顯眼也是最合法的候選人。\n在他宣稱聯邦王位的同時，選舉他為國王也將毫無疑問地加強我國政府對於所有前聯邦領土的宣稱。在弗里德里希·克里斯蒂安的背後，是作為一名歷史上的波蘭王室成員、一份顯赫的血統和一個對立陶宛的索求，這使得他具有對波蘭王國王位的強大宣稱。"
 NSB_poland_royal_election.1.t: "弗里德里希·克里斯蒂安宣稱王位"
 NSB_poland_royal_election.2.a: "聯合兩家王冠？一個絕佳的主意！"
 NSB_poland_royal_election.2.b: "我們不能危害我們同羅馬尼亞之間的關係。"
 NSB_poland_royal_election.2.desc: "霍亨索倫對於波蘭的宣稱最早可以追溯到波蘭國家這一地理概念形成之時。現在，隨著波蘭和羅馬尼亞之間的關係為了維持彼此的生存變得愈發重要之時，向羅馬尼亞前國王和繼承人——米哈伊一世提供我國王位是非常有意義的。\n米哈伊國王因其父親的關係在1930年退位，他提供了一個波蘭和羅馬尼亞組成共主聯盟的潛在機會。由於羅馬尼亞國內法西斯鐵衛團的建立，我們也許可以通過武裝反法西斯力量來作為再次罷黜卡羅爾國王並代之以米哈伊國王的辦法。這一壯舉將在我們兩國之間創建一個不可分離的聯盟，並且我們的這一組合將成為對抗我們在[SOV.GetNameDef]和在[GER.GetNameDef]中的敵人的強大力量。"
 NSB_poland_royal_election.2.t: "加冕米哈伊爾王子"
 NSB_poland_royal_election.3.a: "瘋狂的主意，但誰讓我們身處瘋狂的時代呢？我們的國王有了！"
 NSB_poland_royal_election.3.b: "帕維爾什麼夫？"
 NSB_poland_royal_election.3.desc: "今天，攝政委員會接見了一個不太尋常的王位候選。格魯吉亞親王、哥薩克、前白俄將領帕維爾·別爾蒙特-阿瓦羅夫向攝政委員會提出由他來當國王——不僅僅是波蘭王國的國王，而是整個波蘭-立陶宛聯邦的國王。\n許多年以前，哥薩克不知為何曾試圖入侵波羅的海國家，看來這位親王的野心如今更甚。\n儘管受盡波蘭人反感，這個奇特的王位候選人卻能召來一眾流亡白軍。此舉或許會刺激[SOV.GetNameDef]，但卻可以壯大我們的武裝力量，甚至能讓我們與歐洲的法西斯勢力聯手。"
 NSB_poland_royal_election.3.t: "哥薩克國王"
 NSB_poland_royal_election.4.a: "也許，我們的國王會是羅曼諾夫的僅存血脈了。"
 NSB_poland_royal_election.4.desc: "“華沙城堡，彩繪雄鷹，是的，我還記得它們。我還記得我是波蘭唯一真正的國王。”聲名狼藉的阿納斯塔西婭·羅曼諾夫今天和她的公關人員一起來到華沙城堡，聲稱羅曼諾夫家族仍然擁有波蘭的王位繼承權，而作為羅曼諾夫家族的僅存血脈，她順理成章地成為了國王。阿納斯塔西婭的主張不僅建立在羅曼諾夫對波蘭的領土要求這一基礎上，而且還建立在其血統的合法性上。\n儘管許多前俄羅斯貴族證明她確實是真正的阿納斯塔西婭，但許多人認為她是一個古怪的人，因為媒體有關於她的報道實在太多了。\n雖然她的合法性值得懷疑，但我們沒有別的選擇了。如果現在我們把她拒之門外，那波蘭毫無疑問會回到群龍無首的境地。"
 NSB_poland_royal_election.4.t: "阿納斯塔西婭·羅曼諾夫抵達波蘭"
 NSB_poland_royal_election.5.t: "哈布斯堡候選人"
 NSB_poland_royal_election.5.desc: "卡爾·阿爾布雷希特·馮·哈布斯堡既是一位哈布斯堡家族成員，也是一位波蘭的愛國者，他幾乎在波蘭軍隊成立伊始就在其中服役。雖然他的血統並不屬於這片土地，但他願意為波蘭戰鬥和犧牲，這使他成為王位的理想候選人。\n\n雖然大公似乎沒有什麼統治的野心，但我們也許可以說服他在王位上繼續為波蘭服務。"
 NSB_poland_royal_election.5.a: "哈布斯堡波蘭誕生了！"
 NSB_poland_royal_election.5.b: "我們還是選別人比較好……"
 pavel_events.1.a: "頓河哥薩克必將獨立。"
 pavel_events.1.b: "他們將直接對我們負責。"
 pavel_events.1.desc: "隨著整個頓河流域現在處於[Root.GetLeader]和[Root.GetLeader.GetHerHis]部隊的控制之下，我們已有能力復辟頓河共和國，並邀請其領袖回國，再次領導頓河哥薩克人對抗共匪！\n現在唯一的問題是，我們是應該相信其作為一個獨立國家對我們的忠誠，還是應該直接讓他們成為[Root.GetLeader]的一個傀儡國？"
 pavel_events.1.t: "頓河共和國的重生"
 pavel_events.2.a: "非常好。"
 pavel_events.2.b: "他們不值得信任，他們將成為我們的臣民。"
 pavel_events.2.desc: "曾經的庫班人民共和國是一個先為白軍而戰，後又為紅軍而戰的叛徒國家，[Root.GetLeader]已經決定利用新的白軍領導層復辟庫班共和國。\n雖然庫班人曾經背叛了白軍的事業，但新的領導層向我們保證，它將盡一切努力壓制對舊政府的任何支持。"
 pavel_events.2.t: "庫班共和國的重生"
 NSB_poland_democratic_events.1.t: "領導權問題"
 NSB_poland_democratic_events.1.desc: "既然薩納齊亞已經從政府裡連根拔起了，現在剩下的問題是由誰來擔任全新的波蘭農民黨的領袖。為農民群體最操勞且最直言不諱的人選是現任領導人斯坦尼斯瓦夫·米科拉伊奇克，但不能被忽視的是，如果沒有莫爾日陣線的支持，內戰勝利就是空談。\n\n莫爾日陣線支持長期擔任領導人職位的波蘭前總理文岑蒂·維托斯，以此代表將軍們支持重建自由選舉。\n\n儘管將維托斯任命為黨的領袖能夠安撫莫爾日陣線，但解除米科拉伊奇克的職務可能會讓許多為民主事業而戰的農民們產生剝奪感，認為遭到了黨的背叛。"
 NSB_poland_democratic_events.1.a: "維托斯有經驗，他將成為我們的領袖。"
 NSB_poland_democratic_events.1.b: "米科拉伊奇克是人民的衛士，他配得上這個職位。"
 NSB_poland_communist_events.2.a: "這是我們擁有的最好機會了。"
 NSB_poland_communist_events.2.b: "絕不！"
 NSB_poland_communist_events.2.desc: "[From.GetNameDefCap]提出給予我們全面的軍事保護，以換取對[Root.GetNonIdeologyName]的宗主權。以俄羅斯和德國對[Root.GetNonIdeologyName]構成的直接和長遠的威脅為由，來自[From.GetNameDef]的政治家建議我們成為其保護國。如果我們接受，這無疑將使[Root.GetNonIdeologyName]成為一個傀儡國，但似乎[From.GetNonIdeologyName]並不接受拒絕。"
 NSB_poland_communist_events.2.t: "[From.GetNameDefCap]提供保護"
 NSB_poland_communist_events.201.a: "好極了。"
 NSB_poland_communist_events.201.desc: "[From.GetNameDefCap]已經成為[Root.GetNameDef]的附屬國。隨著[From.GetAdjective]政府現在直接對[Root.Capital.GetName]負責，我們正距離波羅的海霸權目標越來越近。"
 NSB_poland_communist_events.201.t: "[From.GetNameDefCap]同意！"
 NSB_poland_communist_events.202.a: "軍隊總是能靠得住。"
 NSB_poland_communist_events.202.desc: "[From.GetNameDefCap]拒絕了我們的保護提議，堅持要保持其獨立性。目前，[Root.GetAdjective]最高指揮部已經開始準備在外交部失敗的地方取得成功，只要[Root.GetLeader]一聲令下，對[From.GetNameDef]的全面進攻就會開始。"
 NSB_poland_communist_events.202.t: "[From.GetNameDefCap]拒絕"
 NSB_poland_communist_events.3.a: "[Root.GetNonIdeologyName]和[From.GetNonIdeologyName]的工人們，團結起來！"
 NSB_poland_communist_events.3.b: "這根本無法接受。"
 NSB_poland_communist_events.3.desc: "[From.GetNameDefCap]要求立刻合併[Root.GetNameDef]。為了完成[From.GetLeader]建立“社會主義共和國聯邦”的偉大理想，該合併計劃也不可或缺。如果接受，意味著我們的獨立權將不復存在，而[Root.GetNonIdeologyName]也會淪為[From.GetAdjective]所管轄的一個區域。"
 NSB_poland_communist_events.3.t: "[From.GetNameDefCap]要求合併[Root.GetAdjective]"
 NSB_poland_communist_events.301.a: "真可惜。"
 NSB_poland_communist_events.301.desc: "[From.GetNameDefCap]拒絕了併入社會主義共和國聯邦的提議。雖然這並不代表[Root.GetAdjective]對這一地區計劃的失敗，但毫無疑問，我們與[From.GetNameDef]之間再也達不成和平了。"
 NSB_poland_communist_events.301.t: "[From.GetNameDefCap]拒絕"
 NSB_poland_communist_events.302.a: "好極了。"
 NSB_poland_communist_events.302.desc: "隨著[From.GetAdjective]的政府同意接受[Root.GetAdjective]的直接領導，[Root.GetLeader]試圖推動[From.GetNameDef]加入社會主義共和國聯邦的雄心壯志終於得以實現。"
 NSB_poland_communist_events.302.t: "[From.GetNameDefCap]接受合併"
 NSB_poland_communist_events.4.a: "我們接受。"
 NSB_poland_communist_events.4.b: "他們還沒準備好。"
 NSB_poland_communist_events.4.desc: "[From.GetNameDefCap]提出向我們割讓東波蘭，以換取保護國地位以及與蘇聯的緊密聯繫。如果我們接受，[From.GetNameDef]將成為[Root.GetNameDef]的附屬國，而目前被波蘭佔領的西白俄羅斯和西烏克蘭將被割讓給蘇聯。\n\n雖然這看起來是一個明智的選擇，但考慮到德國對波蘭的野心，這同時意味著[Root.GetNameDef]與[GER.GetNameDef]之間的戰爭可能會難以避免。"
 NSB_poland_communist_events.4.t: "[From.GetNameDefCap]割出東部"
 NSB_poland_communist_events.401.a: "這是必要的犧牲。"
 NSB_poland_communist_events.401.desc: "[From.GetNameDefCap]已經同意給予保護國地位，我國已經作為一個附屬國併入蘇聯。雖然全國上下許多人都因為這一決定而感到被背叛，但[Root.GetLeader]已向波蘭人民保證，[From.GetLeader]是波蘭人民的朋友，現在生活在蘇聯統治下的任何波蘭人都會他們新的[From.GetAdjective]統治感到滿意。"
 NSB_poland_communist_events.401.t: "[From.GetNameDefCap]同意！"
 NSB_poland_communist_events.402.a: "好吧。"
 NSB_poland_communist_events.402.desc: "[From.GetLeader]拒絕接納[Root.GetNameDef]加入蘇聯，稱[Root.GetLeader]“還沒準備好”。雖然這個理由給得很官方，但許多人懷疑德國對波蘭的野心才是他們拒絕的真正原因。"
 NSB_poland_communist_events.402.t: "[From.GetNameDefCap]拒絕"
 NSB_poland_communist_events.5.a: "獨立根本不是一個選項。"
 NSB_poland_communist_events.5.b: "我們眼光得放得更加長遠。"
 NSB_poland_communist_events.5.desc: "[From.GetNameDefCap]已不再是[Root.GetAdjective]的傀儡，這個蕞爾小邦已經宣佈成為獨立的社會主義共和國。目前局勢仍然保持平穩，[From.GetNameDef]仍然是[Root.GetFactionName]的成員國。"
 NSB_poland_communist_events.5.t: "[From.GetNameDefCap]宣佈獨立！"
 NSB_poland_communist_events.501.a: "那就開戰吧！"
 NSB_poland_communist_events.501.desc: "正如我們所料，[From.GetLeader]不承認[Root.GetAdjective]的獨立宣言，並公然對其宣佈戰爭。"
 NSB_poland_communist_events.501.t: "[From.GetNameDefCap]宣戰！"
 NSB_poland_communist_events.502.a: "我們應該留在[From.GetFactionName]。"
 NSB_poland_communist_events.502.b: "我們將宣佈完全獨立。"
 NSB_poland_communist_events.502.desc: "[From.GetNameDefCap]已經接受了我們的獨立要求，至少目前，兩國之間還處於和平狀態。雖然我們現在已經獨立了，但仍可以繼續維持與[From.GetNameDef]的關係。或者也可以離開其陣營，尋找其他選擇。"
 NSB_poland_communist_events.502.t: "[From.GetNameDef]接受了[Root.GetAdjective]的獨立請求"
 NSB_poland_communist_events.6.a: "讓他四百公里又何妨。"
 NSB_poland_communist_events.6.b: "我們的土地決不能拱手讓人。"
 NSB_poland_communist_events.6.desc: "雖然轉交東波蘭是將[From.GetNameDef]納入[Root.GetFactionName]的協議條款，但這個小國以其對國際主義事業的忠誠為由要求收回。他們聲稱，西白俄羅斯和西烏克蘭的人民數十年來一直是波蘭國家的一部分，況且當地亦是引發波蘭紅色起義的農民罷工始源地所在。"
 NSB_poland_communist_events.6.t: "[From.GetNameDefCap]索要東波蘭"
 NSB_poland_communist_events.601.a: "我國再度完整了。"
 NSB_poland_communist_events.601.desc: "東波蘭已經作為[Root.GetNameDef]的核心領土被歸還。該地區已被重新納入[Root.GetAdjective]的管轄之下，推翻舊制度的人們已經與其為之奮鬥的國家重為一體。"
 NSB_poland_communist_events.601.t: "[From.GetNameDefCap]歸還了東波蘭！"
 NSB_poland_communist_events.602.a: "好吧。"
 NSB_poland_communist_events.602.b: "那我們就只能獨立了！"
 NSB_poland_communist_events.602.desc: "[From.GetNameDefCap]拒絕將東波蘭歸還給[Root.GetNameDef]。雖然這個結果在預料之中，但許多波蘭人還是感到失望，當地在[From.GetNameDef]的分離主義情緒正在不斷滋長。"
 NSB_poland_communist_events.602.t: "[From.GetNameDefCap]拒絕"
 NSB_poland_monarchist_events.1.a: "我們必須抵抗。"
 NSB_poland_monarchist_events.1.desc: "隨著[From.GetLeader]加冕為[From.GetNonIdeologyName]國王，[From.GetAdjective]政府利用這一點來宣稱了[Root.GetNonIdeologyName]！通過宣傳和戰爭姿態，[From.GetNameDef]打算武裝反[Root.GetLeader]勢力並支持內部政變。\n如果這種宣傳行之有效，[Root.GetLeader]可能面臨政變威脅，[Root.GetNonIdeologyName]也將淪為[From.GetAdjective]的傀儡。"
 NSB_poland_royal_election.4.b: "也許我們把弗里德里希·克里斯蒂安否決的太早了……"
 NSB_polish_fascist_events.1.a: "都投降了，還入侵的話圖的是啥？"
 NSB_polish_fascist_events.1.b: "我們對波蘭另有打算。"
 NSB_polish_fascist_events.1.desc: "[From.GetAdjective]政府提出了一項支持我們實現全球霸權目標的條約。顯然，[From.GetLeader]知道[Root.GetLeader]對波德邊界的劃分不甚滿意，因此已派波蘭外交部長約瑟夫·貝克對該條約提出修正案。\n\n波蘭同意割讓波茲南、但澤和上西里西亞的剩餘領土，以換取互不侵犯條約和以及德國的保護指導，以防止任何[SOV.GetAdjective]的入侵企圖。該協議基本上將使波蘭成為德國的傀儡，同時割給我們邊境上的爭議領土。我們應該同意嗎？"
 NSB_polish_fascist_events.1.t: "貝克-裡賓特洛甫條約"
 NSB_polish_fascist_events.101.a: "但是安全的代價是什麼？"
 NSB_polish_fascist_events.101.desc: "[From.GetNameDefCap]已經同意我們的條件，[Root.GetNameDef]現在將正式受到[From.GetAdjective]的保護。與此同時，[From.GetAdjective]的士兵已經開始湧入[Root.GetAdjective]國內，我們的部長也在向柏林方面積極報告波蘭的情況。"
 NSB_polish_fascist_events.101.t: "[From.GetNameDefCap]簽署了條約"
 NSB_polish_fascist_events.102.a: "是時候調整航線了。"
 NSB_polish_fascist_events.102.desc: "儘管我們的提議無異於將國家的領導權拱手讓給[From.GetLeader]，但似乎[From.GetAdjective]政府有別的打算，竟然果斷地拒絕了我們的提議。"
 NSB_polish_fascist_events.102.t: "[From.GetNameDefCap]拒絕簽署條約"
 NSB_polish_fascist_events.2.a: "發出最後通牒。"
 NSB_polish_fascist_events.2.b: "非常好。"
 NSB_polish_fascist_events.2.c: "拒絕。"
 NSB_polish_fascist_events.2.desc: "儘管[From.GetNameDef]目前是[Root.GetAdjective]的附屬國，但似乎仍對聯邦野心念念不忘。在承認我們對梅梅爾地區領土主張的前提下，[From.GetLeader]建議我們肢解立陶宛：梅梅爾地區由[Root.GetAdjective]控制，其餘地區則成為[From.GetAdjective]的一部分。"
 NSB_polish_fascist_events.2.t: "[From.GetNameDefCap]尋求肢解立陶宛"
 NSB_polish_fascist_events.201.a: "我們別無選擇"
 NSB_polish_fascist_events.201.b: "我們拒絕！"
 NSB_polish_fascist_events.201.desc: "[POL.GetNameDef]和[GER.GetNameDef]這一未敢設想的同盟提出了吞併我國的聯合要求。他們要求我們將梅梅爾地區割讓給德國，而我國的其餘地區則將整個被波蘭吞併。"
 NSB_polish_fascist_events.201.t: "德國與波蘭要求吞併立陶宛"
 NSB_polish_fascist_events.202.a: "真不走運。"
 NSB_polish_fascist_events.202.desc: "看來德國人對立陶宛抱有其他打算，我們的吞併提案遭到了完全拒絕。"
 NSB_polish_fascist_events.202.t: "[From.GetNameDefCap]拒絕"
 NSB_polish_fascist_events.203.a: "好極了。"
 NSB_polish_fascist_events.203.desc: "[From.GetNameDefCap]同意了我們的要求，前立陶宛的領土已被波蘭和德國肢解。我們沒費一槍一彈，就將立陶宛納入了囊中。"
 NSB_polish_fascist_events.203.t: "[From.GetNameDefCap]同意了"
 NSB_polish_fascist_events.204.a: "我們將用武力來奪取。"
 NSB_polish_fascist_events.204.desc: "看來立陶宛拒絕了我們的合理要求。外交手段已經失敗，該試試軍事手段了。"
 NSB_polish_fascist_events.204.t: "[From.GetNameDefCap]拒絕了！"
 NSB_polish_fascist_events.3.a: "聽起來還不錯。"
 NSB_polish_fascist_events.3.b: "不行，波蘭是我們的。"
 NSB_polish_fascist_events.3.desc: "[From.GetNameDef]的部長們聲稱，我們對波蘭工廠的不當使用阻礙了戰爭進程，並要求放鬆對該國的控制。雖然這份協議將保持波蘭作為[Root.GetAdjective]保護國的地位，但同時也大大增加了其政治和經濟獨立性。"
 NSB_polish_fascist_events.3.t: "[From.GetNameDefCap]請求自治"
 NSB_polish_fascist_events.301.a: "非常好。"
 NSB_polish_fascist_events.301.desc: "[From.GetNameDefCap]已經同意提高我國的自治度。雖然仍舊是[From.GetAdjective]的附屬國，但我們現已在工業和外交上變得更加獨立。"
 NSB_polish_fascist_events.301.t: "[From.GetNameDefCap]授予自治權"
 NSB_polish_fascist_events.302.a: "唉。"
 NSB_polish_fascist_events.302.b: "之前應該選地下國來著……"
 NSB_polish_fascist_events.302.desc: "我們的自治請求被[From.GetNameDef]咄咄逼人地拒絕，[From.GetAdjective]的顧問甚至認為這一提議是個冒犯。他們聲稱，對我們的控制是推動戰爭進程的重要環節。在可預見的未來，我國仍將是他們的附屬國。"
 NSB_polish_fascist_events.302.t: "[From.GetNameDefCap]收緊了韁繩"
 NSB_polish_fascist_events.4.a: "我們應該分走波羅的海地區"
 NSB_polish_fascist_events.4.b: "白俄羅斯和烏克蘭得劃給我們。"
 NSB_polish_fascist_events.4.c: "我們必須實現海間理想。"
 NSB_polish_fascist_events.4.desc.first: "我們在消滅布爾什維主義的努力中付出了重大的犧牲：我們的西部領土，我們的獨立，以及無數士兵的生命。現在是索取回報的時候了，隨著我們對[SOV.GetNameDef]戰爭已經塵埃落定，在東方的勝利之中，我們看到了波蘭擴張的無數機會。"
 NSB_polish_fascist_events.4.desc.rejected: "[From.GetNameDefCap]拒絕了我們關於戰後邊界的建議，但看在我們手頭還有這麼多關於戰後波蘭國家設想的份上，這並沒有什麼影響。"
 NSB_polish_fascist_events.4.t: "戰後的波蘭"
 NSB_polish_fascist_events.401.a: "這份建議值得我們同意。"
 NSB_polish_fascist_events.401.b: "不行。"
 NSB_polish_fascist_events.401.desc.baltics: "波蘭已經向我們提出了關於戰後他們未來邊界的建議。以他們在《貝克-裡賓特洛甫條約》將一部分領土割讓給了[Root.GetNameDef]為由，[From.GetAdjective]政府認為他們在戰爭勝利後有權獲得一些領土。\n\n他們以庫爾蘭公國曾是聯邦屬國為依據，要求北進波羅的海國家。"
 NSB_polish_fascist_events.401.desc.ukraine: "波蘭已經向我們提出了關於戰後他們未來邊界的建議。以他們在《貝克-裡賓特洛甫條約》將一部分領土割讓給了[Root.GetNameDef]為由，[From.GetAdjective]政府認為他們在戰爭勝利後有權獲得一些領土。\n\n他們以聯邦舊邊界為依據，要求東進白俄羅斯和烏克蘭。"
 NSB_polish_fascist_events.401.desc.blacksea: "波蘭已經向我們提出了關於戰後他們未來邊界的建議。以他們在《貝克-裡賓特洛甫條約》將一部分領土割讓給了[Root.GetNameDef]為由，[From.GetAdjective]政府認為他們在戰爭勝利後有權獲得一些領土。\n\n他們以實現長期以來的海間波蘭雄心為依據，要求南進克里米亞。"
 NSB_polish_fascist_events.402.a: "波蘭的未來已經有了保證。"
 NSB_polish_fascist_events.402.desc: "我們對波蘭未來邊界的建議已經被[From.GetNameDef]所接受，而且所索取的地區已經開始向我國民政部門整合。雖然我們可能永遠看不到西方故土的迴歸，但這些新的領土在面積上已經遠遠超過了幾年前割出去的土地。"
 NSB_polish_fascist_events.5.a: "不錯的建議。"
 NSB_polish_fascist_events.5.b: "我覺得不太行。"
 NSB_polish_fascist_events.5.desc: "[From.GetNameDef]已經邀請我們加入長槍黨國際——一個很大程度上基於長槍黨和天主教意識形態的同盟。接受這個邀請意味著兩國在戰爭時期將並肩作戰，但同時也會使我們政府內部的長槍黨分子更加狂妄、勢力更大。我們應該接受嗎？"
 NSB_polish_fascist_events.5.t: "[From.GetNameDefCap]邀請我們加入長槍黨國際"
 NSB_polish_fascist_events.6.t: "華沙暴動"
 NSB_polish_fascist_events.6.desc: "長槍黨的不斷獲權和煽動，導致華沙街頭爆發了一系列的民族主義的暴亂。顯然，由於[Root.GetLeader]願意與右翼極端分子合作併為其背書，騷亂者在華沙的街道上游行，最後在華沙與城堡派對峙。事實證明，忠於政府的薩納齊亞派的軍官沒有能力阻止暴徒，他們衝進了首都，並將[Root.GetLeader]從建築中帶走。\n\n薩納齊亞領導層中所有的城堡派已經被清空，波列斯瓦夫-皮亞塞奇已經宣佈自己為新波蘭國家的領導人。"
 NSB_polish_fascist_events.6.a: "一切正照計劃進行。"
 NSB_polish_fascist_events.7.t: "波蘭的全國大選"
 NSB_polish_fascist_events.7.desc: "隨著薩納齊亞越來越多地採用民族民主黨的政策和思想，許多人認為共和國再次開放全國選舉只是一個時間問題。隨著波蘭第三部國家憲法的簽署，選舉再次被恢復，但條件是禁止“不愛國”政黨來執政。\n\n“不愛國”的政黨包括波蘭人民黨以及其他大多數主要的左翼和中間派政黨，也就是說選民們只能選擇民族民主黨。民族民主黨在選舉中取得了勝利，而像薩納齊亞這樣的競爭黨派只獲得了一小部分選票，這使得民族民主黨幾乎完全控制了共和國。"
 NSB_polish_fascist_events.7.a: "我愛民主。"
 nsb_news.1.a: "波蘭工人萬歲!"
 nsb_news.1.b: "我們將粉碎這些後起之秀!"
 nsb_news.1.c: "聖母瑪利亞，保護我們。"
 nsb_news.1.d: "看波蘭是怎麼被自己人瓜分的。"
 nsb_news.1.e: "這對波蘭來說意味著什麼呢？"
 nsb_news.1.desc: "年輕的波蘭國家爆發了內戰！幾十年的政府內鬥和波蘭東部農村地區基礎設施投資的匱乏，導致今年年初全國下層階級的大罷工，而警察和軍隊對罷工者的殘暴對待，使國家一分為二。\n\n以[peasant_poland_target.GetLeader]為首的農民政府得到了波蘭軍方的莫爾日陣線以及馬克思主義者、社會主義者和自由主義者組成的聯盟的支持。\n\n由於效忠者的力量主要集中在波蘭位於西邊的工業中心，而農民則在東部的農村地區，整個波蘭被農民的鮮血一分為二。"
 nsb_news.1.t: "[peasant_poland_target.Capital.GetName]發生農民起義。"
 nsb_news.2.a: "這簡直是侮辱！"
 nsb_news.2.b: "在下，以個人名義，歡迎新的波蘭統治者。"
 nsb_news.2.c: "利比里亞僅僅是個開始。"
 nsb_news.2.d: "波蘭跑到非洲去了？"
 nsb_news.2.f: "帝國主義又在發癲了。"
 nsb_news.2.e: "這……確實沾點帝國主義。"
 nsb_news.2.desc.dem: "波蘭今天佔領了利比里亞！自1932年以來，利比里亞一直將波蘭視為其首選的投資夥伴，原以為該國幾乎沒有殖民野心。然而，波蘭、利比里亞和國際聯盟之間簽署的協議現在使利比里亞論文波蘭的一介傀儡。\n\n美國官方譴責了這一決定，認為利比里亞獨立是該國建國原則的必要組成部分。\n\n波蘭海事和殖民聯盟認為這是波蘭殖民野心的巨大勝利，並聲稱這與波蘭在非洲的野心還差得很遠。"
 nsb_news.2.desc.com: "波蘭今天佔領了利比里亞！自1932年以來，利比里亞一直將波蘭視為其首選的投資夥伴，原以為該國幾乎沒有殖民野心。然而，這項協議現在使利比里亞淪為波蘭的一介傀儡。\n\n美國官方譴責了這一決定，認為利比里亞獨立是該國建國原則的必要組成部分。\n\n[POL.GetLeader]被其他波蘭共產黨成員指責從事殖民主義，儘管[POL.GetLeader.GetSheHe]發誓這只是為了保護利比里亞免受潛在殖民者的侵害，但許多人仍然不相信。"
 nsb_news.2.t: "宣佈成立[LIB.GetAdjective]保護國"
 nsb_news.3.t: "突厥斯坦統一！"
 nsb_news.3.desc: "隨著[From.GetOldAdjective]正式控制了中亞，突厥人民現已團結在了[From.GetLeader]的旗下。嶄新的突厥政權宣佈[From.GetOldNameDef]現在將改稱為[From.GetNameDef]，是為全世界突厥人民的祖國。\n\n即使在這個新生國家之外，也有許多突厥人開始承認[From.GetNameDef]是他們真正的祖國，[From.GetLeader]很可能會抓住這個機會來為這個蓬勃前進的國家開疆拓土。"
 nsb_news.3.a: "我們不再分裂。"
 nsb_news.3.b: "有意思"
 nsb_news.4.t: "[POL.GetNameDefCap]佔領但澤！"
 nsb_news.4.desc: "根據1920年凡爾賽條約建立的但澤自由市，到今天為止一直是個處在波蘭國家保護下的獨立國。然而，隨著德波邊界周圍緊張局勢的加劇，以及但澤政府禁止波蘭通過該市港口進行貿易，波蘭政府於今日宣佈取消但澤的自由市地位。\n\n但澤的街道上早已滿是了波蘭士兵，他們唯一的任務就是強化波蘭對但澤的控制力。阿爾伯特·福斯特和其他許多納粹黨員已經遁入地下，反抗的傳言風聲四起，他們最終還是倒向了[GER.GetNameDef]。"
 nsb_news.4.a: "“自由”市不復存在"
 nsb_news.4.b: "下一步是什麼？萊茵蘭地區的再軍事化？"
 nsb_news.4.c: "我們對波蘭抱有不切實際的期望。"
 nsb_news.4.d: "他們就快要把城池丟了。"
 nsb_news.4.e: "有意思"
 nsb_news.5.t: "[POL.GetNameDefCap]加冕了國王！"
 nsb_news.5.desc.saxon: "在1916年11月15日，德國的威廉二世和奧地利的弗朗茨·約瑟夫共同簽署了一項聲明，內容包括俄羅斯所佔據的波蘭土地上，一個新的王國將得以重生——波蘭王國。然而，這個年輕的國家沒能及時選出國王，緊接著總統就宣佈成立了波蘭第二共和國。\n\n然而，波蘭似乎最終將[POL.GetLeader]選為了國王！邁森的侯爵，現在是波蘭國王腓特烈一世了。儘管與德國的戰爭迫在眉睫，但由於波蘭與薩克森貴族之間長期存在的歷史聯繫，波蘭攝政委員會還是把王位交給了這位侯爵。"
 nsb_news.5.desc.romania: "在1916年11月15日，德國的威廉二世和奧地利的弗朗茨·約瑟夫共同簽署了一項聲明，內容包括俄羅斯所佔據的波蘭土地上，一個新的王國將得以重生——波蘭王國。然而，這個年輕的國家沒能及時選出國王，緊接著總統就宣佈成立了波蘭第二共和國。\n\n然而，波蘭似乎最終將[POL.GetLeader]選為了國王！考慮到兩國長期堅定的友誼以及現有的同盟關係，波蘭攝政委員會似乎有意與[ROM.GetNameDef]建立更密切的關係。作為羅馬尼亞王位的繼承人，兩國的命運將不可逆轉地交織在一起。"
 nsb_news.5.desc.cossack: "在1916年11月15日，德國的威廉二世和奧地利的弗朗茨·約瑟夫共同簽署了一項聲明，內容包括俄羅斯所佔據的波蘭土地上，一個新的王國將得以重生——波蘭王國。然而，這個年輕的國家沒能及時選出國王，緊接著總統就宣佈成立了波蘭第二共和國。\n\n然而，波蘭似乎最終將[POL.GetLeader]選為了國王！一位哥薩克人，一位貴族，還是一位軍閥——[POL.GetLeader]是波蘭王位不太可能的候選人，但無疑的是，他對在波羅的海擴張的不朽雄心對波蘭政府具有極大的吸引力，波蘭心中始終流淌著重建波蘭-立陶宛聯邦的熱血。"
 nsb_news.5.desc.romanov: "在1916年11月15日，德國的威廉二世和奧地利的弗朗茨·約瑟夫共同簽署了一項聲明，內容包括在俄羅斯所佔據的波蘭土地上，一個新的王國將得以重生——波蘭王國。然而，這個年輕的國家沒能及時選出國王，緊接著總統就宣佈成立了波蘭第二共和國。\n\n然而，波蘭似乎最終將[POL.GetLeader]選為了國王！如同她的前輩雅德維加一般，女王也選擇了“國王”作為自己的頭銜。儘管許多人對於她是否真的是沙皇尼古拉二世的女兒深表懷疑，但她還是在華沙加冕為波蘭國王阿納斯塔西婭·羅曼諾夫。"
 nsb_news.5.desc.habsburg: "在1916年11月15日，德國的威廉二世和奧地利的弗朗茨·約瑟夫共同簽署了一項聲明，內容包括俄羅斯所佔據的波蘭土地上，一個新的王國將得以重生——波蘭王國。然而，這個年輕的國家沒能及時選出國王，緊接著總統就宣佈成立了波蘭第二共和國。\n\n然而，波蘭似乎最終將[POL.GetLeader]選為了國王！生而為哈布斯堡貴族，卡爾·阿爾布雷希特幾乎自波蘭國家誕生以來就在波蘭軍隊中服役。而今，在歡呼的人群中，他被選為波蘭的第一位哈布斯堡國王。"
 nsb_news.5.a: "國王萬歲！"
 nsb_news.5.b: "世上多了一個王國。"
 nsb_news.5.c: "這是有多瘋？"
 nsb_news.6.t: "民族主義者篡取波蘭政府！"
 nsb_news.6.desc: "民族民主運動和長槍黨與波蘭政府的關係由來已久，但伊格內西-莫希奇與這些極右分子的持續合作終於成為他的敗筆。隨著他們在波蘭政府中的影響力越來越大，[POL.GetLeader]現在已經取代了莫希契奇成為波蘭的新總統。\n\n這個新的民族主義政府是否能以某種方式安撫覬覦波蘭領土的鄰國們，或者說波蘭是否會出現新盟友，我們拭目以待。"
 nsb_news.6.a: "波蘭在此重生，且更加強大。"
 nsb_news.6.b: "太可怕了。"
 nsb_news.7.t: "[POL.GetAdjective]和[From.GetAdjective]組建聯盟"
 nsb_news.7.desc: "在這奇怪的轉折中，[From.GetNameDef]和[POL.GetNameDef]都已經在[POL.GetLeader]的統治之下了。雖然這兩個國家目前仍然是獨立的，但共同的國家元首意味著它們在外交上有著不可分割的聯繫。\n\n這種共主邦聯似乎很快就會演變成[FROM.GetAdjective]和[POL.GetAdjective]國家的統一，但目前這種聯盟仍然是純粹的外交同步。"
 nsb_news.7.a: "很快，我們將成為一體。"
 nsb_news.7.b: "有意思"
 nsb_news.8.t: "立陶宛王國"
 nsb_news.8.desc: "1918年6月4日，威廉·卡爾·馮·烏拉赫經由民主選舉，以壓倒性支持被選為立陶宛國王，然而德意志帝國橫加干涉，公投結果終歸一場空，立陶宛未能如願加冕她的國王。然而時過境遷，時至今日，現任立陶宛總統辭去自己的職務，並宣佈國王米多加斯三世為立陶宛王國的國家元首。\n\n安塔納斯·斯梅托納現已擔任立陶宛首相，該國業已成為一個絕對君主制國家，而愛國主義和沙文主義的新浪潮似乎正在立陶宛蔓延。"
 nsb_news.8.a: "又一國家倒向了君主制。"
 nsb_news.8.b: "這對我們來說意味著什麼呢？"
 nsb_news.8.c: "王國重生！"
 nsb_news.8.d: "有意思"
 nsb_news.9.t: "[GetSovietCivilWarName]！"
 nsb_news.9.desc_left: "俄國再次爆發了內戰。大家對上一次內戰還記憶猶新，走到這一步仍然讓人感到驚訝。蘇維埃政府在斯大林派和托洛茨基派多年的政治內鬥之後終於分裂，現在兩派正在街頭爭奪國家的控制權。\n\n[SOV.GetLeader]宣佈[SOV.GetLeader.GetHerselfHimself]為[SOV.GetLeader.GetSheHe]所謂的[SOV.GetNameDef]的領導人，並從[SOV.GetLeader.GetHerHis]位於[SOV.Capital.GetName]根據地對[SOS.Getleader]發動戰爭。"
 nsb_news.9.desc_right: "蘇維埃俄國又發生了一起公開的鬥爭。然而，這次不是布爾什維克和白俄之間的戰爭，而是共產黨內敵對派別之間的戰爭。[SOS.GetLeader]掌握著首都，而由[SOV.GetLeader]領導的叛軍則以[SOV.Capital.GetName]為中心。有傳言說[SOV.GetLeader]的叛亂是由外國勢力贊助的，但這些傳言的真實性還有待觀察。"
 nsb_news.9.desc_exiles: "出乎意料的是，白軍再次起兵反抗布爾什維克。他們此前的戰爭似乎已經失敗了，然而在過去的幾個月裡，滿洲和西伯利亞傳出了一些軍力集結的報告。就在今天早些時候，白軍在[SOV.capital.GetName]宣佈成立俄羅斯臨時政府。\n\n[SOS.GetAdjective]政府立即動員了紅軍，俄國再次陷入內戰之中。西方大國至今沒有表現出介入衝突的興趣。然而，日本人將對這一事件的轉變作出怎樣的反應，還有待觀察。"
 nsb_news.9.a: "為了勝利！"
 nsb_news.9.b: "事情終會發展到這一步。"
 nsb_news.9.c: "共產黨人正在自我崩潰。"
 nsb_news.9.d: "[SOS.GetLeader]一定會取得勝利。"
 nsb_news.9.e: "這對共產主義事業來說意味著什麼？"
 nsb_news.9.f: "現如今我們體系中暗藏的暴政正在逐漸顯現。"
 nsb_news.9.g: "這次他們只能自生自滅了。"
 nsb_news.9.h: "他們已經敗過一次，這次要碾碎他們！"
 nsb_news.9.i: "他們真的能夠完成這崇高的事業嗎？"
 nsb_news.10.t: "[GetSovietCivilWarName]結束了！"
 nsb_news.10.desc_stalinist: "隨著最後的叛軍停止抵抗，[GetSovietCivilWarName]正式結束。在[SOS.GetLeader]對國民的演講中，他驕傲地宣稱自己是這次勝利的締造者，並讚揚了紅軍的勇氣與忠誠。\n\n現在國內的敵人已經被徹底消滅了，而[SOV.Getleader]可以放眼他處了。大規模的工業生產破壞和人員死傷的長期影響有待觀察。"
 nsb_news.10.desc_communist_opposition: "忠誠於[SOS.GetLeader]的僅存的武裝力量的繳械投降昭示著[GetSovietCivilWarName]的結束。[SOV.GetLeader]正式宣佈[SOV.GetLeader.GetHerselfHimself]是這場鬥爭的勝利者，並立誓要在內戰的廢墟中重建[SOV.GetNameDef]。這項任務艱難繁重，而國際局勢也撲朔迷離，但[SOV.GetNameDef]堅定地相信屬於[SOV.GetLeader.GetSheHe]和全世界的新時代才剛剛開始。[SOV.GetLeader.GetSheHe]能否完成這些雄心壯志，有待天人共鑑。"
 nsb_news.10.desc_exiles: "雖然看這起來是一項不可能的任務，流亡白軍在第二次內戰中排除萬難，最終擊敗了布爾什維克黨。[SOV.GetLeader]正式宣佈了[SOS.GetNameDef]的戰敗，並立誓要恢復俄羅斯舊日的榮光。這場戰爭摧毀了俄羅斯的大片地區，而國家也付出了巨大的代價。\n\n[SOS.GetLeader]現在何處仍然不為人知。有流言說[SOS.GetLeader.GetSheHe]在投降的幾天之前就逃出了國境，而[SOS.GetLeader.GetSheHe]現在就藏在南美洲的某處。"
 nsb_news.10.desc_exiles_puppet: "在日本人的幫助下，俄羅斯臨時政府成功擊敗了[SOS.GetLeader]並贏得了[GetSovietCivilWarName]的勝利，但它也付出了成為[JAP.GetNameDef]的附屬國的沉重代價，這讓許多民眾開始質疑這場戰爭的勝利究竟是否為白軍的事業做出了貢獻。"
 nsb_news.10.a: "我們勝利了！"
 nsb_news.10.b: "這是對共產主義革命的嚴重打擊。"
 nsb_news.10.c: "的確太驚人了。"
 nsb_news.10.d: "斯大林的俄羅斯如同紙牌屋一般崩潰。"
 nsb_news.10.e: "擺脫斯大林可能是最好的選擇。"
 nsb_news.10.f: "很難相信這些新的領導人。"
 nsb_news.10.g: "也許[SOV.GetLeader]更講道理。"
 nsb_news.11.t: "$SOV_iosif_stalin$遇刺"
 nsb_news.11.desc: "儘管[SOV.GetNameDef]的領導人$SOV_iosif_stalin$身邊的安全機構滴水不漏，他仍被發現死在自己的別墅內，疑似為謀殺。[SOV.GetAdjective]的首都被各種傳言搞得沸沸揚揚，似乎由$SOV_lavrenty_beriya$領導的三駕馬車至少暫時地掌握了權力。然而，這位新領導人並不受歡迎，因此，如果他的地位受到威脅，他是否能成功地守住手中的權力還有待觀察。據報道，內務部正在進行全方位的調查，貝里亞發誓要找到犯下罪行的兇手。"
 nsb_news.11.a: "也許內務人民委員部或多會少參與了此事？"
 nsb_news.11.b: "哦不！"
 nsb_news.12.t: "[SOV.GetAdjective]政變"
 nsb_news.12.desc: "在一次迅速的行動中，[SOV.GetAdjective]反對派已經逮捕並罷免了貝里亞領導的三駕馬車。紅軍部隊在黎明前後的幾個小時內包圍了首都，而特種部隊則秘密逮捕了$SOV_lavrenty_beriya$，並在他的私人保鏢反應過來之前將他偷運到一個安全的地方。一個新的政府已經宣佈成立，[SOV.GetLeader]是國家新的明面上的領導人，而$SOV_lavrenty_beriya$被指控對[SOV.GetNameDef]犯有叛國罪。"
 nsb_news.12.a: "真是有趣的時代。"
 nsb_news.12.b: "事態急轉直下。"
 pavel_events.3.a: "如果這能避免戰爭……"
 pavel_events.3.b: "這是某種笑話嗎？不！"
 pavel_events.3.desc: "來自[From.GetNameDef]的一份令人震驚的電報要求立即割讓“前波蘭領土”。他們所指的地區包括波美拉尼亞、普魯士和西里西亞。\n\n自從[From.GetLeader]奪取權力以來，波蘭國家一直有點難以捉摸，但很少有人能預料到[From.GetLeader.GetSheHe]會如此大膽地要求從[Root.GetNameDef]獲得領土。"
 pavel_events.3.t: "[From.GetNameDefCap]索要東德！"
 pavel_events.301.a: "等下，真的嗎？"
 pavel_events.301.desc: "在一系列令人難以預料的事件轉折中，[From.GetNameDef]屈服於[Root.GetLeader]的要求，將西里西亞、波美拉尼亞和普魯士地區割讓給了[Root.GetNameDef]。"
 pavel_events.301.t: "[From.GetNameDefCap]屈服了"
 pavel_events.302.a: "我們的訴求將會在戰場上得以實現。"
 pavel_events.302.desc: "如同預料之中的那樣，德國拒絕了[Root.GetLeader]的要求，認為這不過是某種精心炮製的惡作劇。隨著取得[From.GetNameDef]的外交行動的失敗，[Root.GetLeader]策馬來到邊境巡視，將其個人的注意力集中到軍事手段上。"
 pavel_events.302.t: "[From.GetNameCap]拒絕割讓領土"
 NSB_poland_monarchist_events.6.t: "[From.GetNameDefCap]要求合併"
 NSB_poland_monarchist_events.6.desc: "鑑於我們明顯缺乏防禦[Root.GetNameDef]的能力，[From.GetNameDef]的官員要求將整個[Root.GetNameDef]置於波蘭的直接佔領之下。顯然，在他們的國王“阿納斯塔西婭”愚蠢的鬼扯下，波蘭國家明確地產生了一統斯拉夫的妄想。他們毫不含糊地表態：如果我們不屈服，入侵將是不可避免的。我們該如何回應？"
 NSB_poland_monarchist_events.6.a: "我們必須投降。"
 NSB_poland_monarchist_events.6.b: "荒唐！我們拒絕！"
 NSB_poland_monarchist_events.601.desc: "[From.GetNameDefCap]已應我方近期的要求併入了[Root.GetNameDef]。[Root.GetAdjective]的軍隊早已如洪水般湧入這一地區，以在任何地方抵抗力量做大之前將其鎮壓。通過這場偉大的勝利，我們離一統斯拉夫的偉業又進了一步。"
 NSB_poland_monarchist_events.601.t: "[From.GetNameDefCap]同意！"
 NSB_poland_monarchist_events.602.desc: "令人震驚的是，[From.GetAdjective]政府拒絕了我方關於移交巴爾幹地區的控制權給[Root.GetNameDef]的要求。我方尋求外交解決的嘗試業已失敗，現在這將是一個軍事問題。"
 NSB_poland_monarchist_events.601.a: "這真的有用麼？"
 NSB_poland_monarchist_events.602.t: "[From.GetNameDefCap]拒絕了！"
 NSB_poland_monarchist_events.602.a: "那麼，只有戰爭了"
 POL_habsburg_events.1.t: "[From.GetNameDefCap]要求哈布斯堡統治！"
 POL_habsburg_events.1.desc: "登上波蘭王位的[From.GetLeader]今日向[Root.GetLeader]遞交了一份最後通牒，要求其辭去匈牙利統治者的職務並支持奧托·馮·哈布斯堡復辟。儘管這一決議可能會被視為是對《特里亞農條約》的違背，但[From.GetLeader]似乎並無意拒絕。"
 POL_habsburg_events.1.a: "我們將讓哈布斯堡的國王登基。"
 POL_habsburg_events.1.b: "我們拒絕。"
 POL_habsburg_events.101.t: "哈布斯堡家族成員在[From.GetNameDefCap]加冕。"
 POL_habsburg_events.101.desc: "我們的最後通牒終於說服了[From.GetNameDef]，讓他們加冕了奧托·馮·哈布斯堡作為匈牙利的國王！隨著哈布斯堡同時擁有了匈牙利和波蘭的王冠，我們迎來了一個哈布斯堡王朝統治歐洲的新時代。"
 POL_habsburg_events.101.a: "好哦，喜事連連。"
 POL_habsburg_events.102.t: "[From.GetNameDefCap]拒絕"
 POL_habsburg_events.102.desc: "匈牙利政府似乎對擁立奧托·馮·哈布斯堡為匈牙利國王的最後通牒完全無感。儘管我們的最後通牒可能已經失敗了，但這一問題現在可以通過軍事手段解決。"
 POL_habsburg_events.102.a: "是時候用武力談判了。"
 POL_habsburg_events.2.t: "[From.GetNameDefCap]提議結盟"
 POL_habsburg_events.2.desc: "鑑於我們兩國都被哈布斯堡家族統治，[From.GetLeader]提議[Root.GetNameDef]和[From.GetNameDef]同心協力保障哈布斯堡王朝在整個歐洲的利益。"
 POL_habsburg_events.2.a: "我們當然會加入。"
 POL_habsburg_events.2.b: "我們不感興趣。"
 POL_habsburg_events.201.t: "[From.GetLeader]拒絕簽署條約"
 POL_habsburg_events.201.desc: "除了我們彼此間的家族紐帶，[From.GetNameDef]似乎對和[Root.GetNameDef]組建同盟完全不感興趣。"
 POL_habsburg_events.201.a: "也許我們應該重回同盟國。"
 NSB_soviet_paranoia_system_events.01.t: "[Root.GetLeader]擔憂派系鬥爭"
 NSB_soviet_paranoia_system_events.01.desc: "在最近一次的中央委員會會議上，[Root.GetLeader]同志提到了黨內日漸緊張的派系鬥爭。儘管全體委員都一致表示絕對支持他的領導，但這並沒有打消他的疑慮。根據[Root.GetLeader]的指示，我們必須警惕一切圖謀損害國家利益的破壞分子，無論他們身居何等職位。\n\n這令部分黨員略為驚詫，他們以為黨內分裂早已隨著托洛茨基被流放而告一段落了。"
 NSB_soviet_paranoia_system_events.01.a: "真有什麼事能讓他老人家擔心的嗎？"
 SOV_paranoia_system_intro_tt: "£SOV_paranoia_text_icon 偏執度系統開始生效。"
 SOV_paranoia_system_nkvd_trait_tt: "擁有§Y$head_of_the_nkvd$§!特質的政治顧問將提高£SOV_paranoia_text_icon 的每週偏執度。"
 NSB_soviet_paranoia_system_events.11.t: "顧問被指控叛國"
 NSB_soviet_paranoia_system_events.11.desc: "在接到一封匿名線報後，內務人民委員部立刻以間諜罪、破壞罪及陰謀叛國罪的指控逮捕了[?ROOT.SOV_purged_character_for_loc.GetName]。儘管他堅稱清白無辜，調查員確信，幾週之內便可就其罪行立案。屆時，他不是在嚴刑拷打下吐露實情，就是在旁人指證下啞口無言。無論哪種情況，數罪併罰的判決不是死刑就是無期勞改。"
 NSB_soviet_paranoia_system_events.11.a: "心腹大患必須被無情剷除"
 NSB_soviet_paranoia_system_events.11.b: "我們不能沒有集齊證據就定罪！"
 NSB_soviet_paranoia_system_events.12.t: "文職幹部隊伍中的陰謀"
 NSB_soviet_paranoia_system_events.12.desc: "內務人民委員部破獲了一起潛伏於行政部門內部、牽涉範圍極廣的陰謀案。證據顯示，一小撮國家計劃委員會的幹部，利用他們與一些工廠領導的關係，暗中下調了五年計劃的工業產量數據。根據內務人民委員部的通報，這是一場赤裸裸的反蘇破壞行動，意圖損害蘇維埃政權。\n\n在嚴刑拷打之下，被逮捕的陰謀集團成員立即供出了更多的同夥。"
 NSB_soviet_paranoia_system_events.12.a: "這樣的貪汙腐敗必須被連根拔除。"
 NSB_soviet_paranoia_system_events.12.b: "這麼小題大做也太荒謬了。"
 NSB_soviet_paranoia_system_events.13.t: "內務人民委員部的背叛？"
 NSB_soviet_paranoia_system_events.13.desc: "一群內務人民委員部的下級軍官向[Root.GetLeader]彙報，有證據顯示，現任內務人民委員正圖謀在首都“陷入嚴重動亂”之時出面掌控局勢。他們認為，這種說法只是藉口，其真正意圖是在為武力奪權做準備。\n\n面對以上指控，內務人民委員試圖辯解說，這項方案只是例行公事，已經制定了有一段時間，只不過最近才剛更新而已。然而，經過後續的深入調查及審問，他承認內務人民委員部潛伏著一個由外國間諜組織，企圖與外國情報機關裡應外合顛覆政權。"
 NSB_soviet_paranoia_system_events.13.a: "罪行罄竹難書，必須嚴懲不貸。"
 NSB_soviet_paranoia_system_events.13.b: "這些指控肯定是憑空捏造的。"
 NSB_soviet_paranoia_system_events.19.t: "[GetMoscowTrialPurgeName]"
 NSB_soviet_paranoia_system_events.19.desc_1: "對1934年基洛夫同志遇刺案的調查顯示，不少線索都指向了季諾維也夫和托洛茨基兩人。隨著後續抓捕與審問的進行，這些證據顯得愈加確鑿。\n\n在與[Root.GetLeader]會面後，季諾維也夫與加米涅夫終於承認自己曾與托洛茨基合作，意圖顛覆政權、暗殺蘇維埃領導人，其最終目的是在蘇聯復辟資本主義。現在，此二人已與其十四名同謀一同受審。對該團伙的犯行將從重定罪——只能處以死刑。"
 NSB_soviet_paranoia_system_events.19.desc_2: "由內務人民委員部主持的調查取得了更多進展。經過逮捕並審問後，卡爾·拉狄克已經招供。他供認，蘇維埃政權存在一個巨大的陰謀集團。在政府內部的每一處，都有人或多或少與托洛茨基保持合作，甚至在軍隊中也是如此。該陰謀集團的首腦已被盡數逮捕並認罪。\n\n包括拉狄克在內的陰謀集團頭子正在受審。他們的罪行比上一批被告要略輕一些——但仍然極有可能被判死刑。"
 NSB_soviet_paranoia_system_events.19.desc_3: "在第二次莫斯科審判開庭之前展開的調查，揭露了又一個由布哈林領導的，潛伏于軍隊內部與黨的高層領導之間的託派集團。經過逮捕審訊，這些陰謀集團的成員已經承認犯下了令人髮指的重罪——策劃了一系列破壞和暗殺行動，與外國勢力合夥，甚至企圖往黃油裡摻鐵釘來傷害無辜的蘇維埃人民。\n\n一旦罪名成立，上述犯人極有可能被處以槍決。"
 NSB_soviet_paranoia_system_events.19.desc_4: "最近，內務人民委員部的特工又揭露了一起震驚世人、牽涉到一小撮黨員的陰謀。更令人擔憂的是，在逮捕、嚴刑審訊了一些嫌疑人後，幾個老布爾什維克的名字進入了我們的視線。進一步調查顯示，他們中的一部分人已經成為了陰謀集團的同夥，涉嫌實行破壞活動，煽動派系鬥爭，以及其他反蘇行為。這一夥人已經被提審，正在等待宣判。考慮到以上指控，犯人無疑將受到法律的嚴懲。"
 NSB_soviet_paranoia_system_events.19.a: "又一夥賣國賊受到了應有的制裁。"
 NSB_soviet_paranoia_system_events.19.b: "革命絕不能走上引火自焚的道路。"
 NSB_soviet_paranoia_system_events.21.t: "[?ROOT.SOV_purged_character_for_loc.GetName]將軍被指控叛國"
 NSB_soviet_paranoia_system_events.21.desc: "在甄別軍中託派分子的行動中，內務人民委員部發現，[?ROOT.SOV_purged_character_for_loc.GetName]將軍曾經發表過一些批判[Root.GetLeader]同志的言論，並大肆宣揚列夫·托洛茨基在內戰期間做出的“偉大”貢獻。在審訊中，[?ROOT.SOV_purged_character_for_loc.GetName]先是改口宣稱自己有多麼敬仰且無限忠誠於[ROOT.GetLeader]，但最終還是乖乖認罪，招供說他受到託派間諜的指示，在軍中建立反革命組織，意圖實施針對紅軍的破壞行動。"
 NSB_soviet_paranoia_system_events.21.a: "紅軍容不得他這樣的敗類。"
 NSB_soviet_paranoia_system_events.21.b: "這種調查明顯就是搞過火了。"
 NSB_soviet_paranoia_system_events.22.t: "軍校中的陰謀"
 NSB_soviet_paranoia_system_events.22.desc: "一份匿名線報顯示，我國最富盛名的軍校內部存在著一個學生團體。他們不僅學習未經審核過的課程，而且還在內部研討那些聲名狼藉的反動思想家的言論。眼下還不清楚這些學生是否私藏了相關的反動書籍，但只要逮捕這個學生團體的頭腦並加以審訊，很快就能問個水落石出。"
 NSB_soviet_paranoia_system_events.22.a: "我們必須確保每一位下一代領導人的忠誠。"
 NSB_soviet_paranoia_system_events.22.b: "學院就應該是讓學生來問問題的，我們不能阻塞言路。"
 NSB_soviet_paranoia_system_events.23.t: "反破壞分子運動"
 NSB_soviet_paranoia_system_events.23.desc: "最近幾次大型演訓後所提交的報告顯示，載具由於機械故障導致的損壞率已經高到了驚人的地步，同時還造成了不少新兵受傷。這些報告已經遞到了[Root.GetLeader]同志的桌上，他十分擔心軍隊中潛伏著破壞分子。他想知道這些新出廠的坦克為什麼故障頻發，幾天沒有維護就掉了鏈子。"
 NSB_soviet_paranoia_system_events.23.a: "為了抓住犯人，我們得展開一場全方位的調查！"
 NSB_soviet_paranoia_system_events.23.b: "這種事放在現代軍隊裡早就司空見慣了。"
 NSB_soviet_paranoia_system_events.24.t: "[?ROOT.SOV_accuser_character_for_loc.GetName]指控[?ROOT.SOV_accused_character_for_loc.GetName]"
 NSB_soviet_paranoia_system_events.24.desc: "紅軍最高統帥部收到了一封舉報信。在信中，[?ROOT.SOV_accuser_character_for_loc.GetName]指責他的同僚[?ROOT.SOV_accused_character_for_loc.GetName]將軍犯下了嚴重的瀆職罪行。根據[?ROOT.SOV_accuser_character_for_loc.GetName]的描述，[?ROOT.SOV_accused_character_for_loc.GetName]與境外反動勢力合謀，將情報洩露給外國情報機構。他進一步指出，有大量的訓練事故都是在[?ROOT.SOV_accused_character_for_loc.GetName]指揮的部隊裡發生的，他指稱，這些事故就是這個兩面派和他在軍中的同謀合夥犯下破壞罪的證據。在進一步的審問中，信中所指控的同謀已經承認犯行。"
 NSB_soviet_paranoia_system_events.24.a: "[?ROOT.SOV_accused_character_for_loc.GetName]必須受到嚴懲。"
 NSB_soviet_paranoia_system_events.24.b: "這分明就是[?ROOT.SOV_accuser_character_for_loc.GetName]想自保才栽贓別人。"
 NSB_soviet_paranoia_system_events.24.c: "不下任何定論就結束調查。"
 NSB_soviet_paranoia_system_events.28.t: "下級軍官大清洗"
 NSB_soviet_paranoia_system_events.28.desc: "報告如雪片般紛至沓來，情報顯示有一大批軍官組織了起來，強烈反對[Root.GetLeader]插手軍隊事務。所有嫌犯都被逮捕了，並被控以煽動罪、破壞罪及反蘇言論罪。經過審訊，他們很快就供出了他們的同夥。這段時間以來，將官的忠誠多多少少都受到了懷疑，而現在看來，哪怕連校級軍官都不再可信了。"
 NSB_soviet_paranoia_system_events.28.a: "我們決不能容忍蛀蟲紮根。"
 NSB_soviet_paranoia_system_events.28.b: "這種指控過於上綱上線了。"
 NSB_soviet_paranoia_system_events.29.t: "大清洗 - 審判紅軍將領"
 NSB_soviet_paranoia_system_events.29.desc: "有證據顯示，紅軍中的託派集團正迅速壯大。根據先前的招供，人民內務委員部每天都能抓到新的嫌犯，然後這些人又回過頭來供出更多的同謀。把所有捲入陰謀的將領都揪出來還要一點時間，不過很明顯，下面的名單已經證明我們抓到了大部分的陰謀分子，這些人都老實招供了自己所犯的罪行。"
 NSB_soviet_paranoia_system_events.29.a: "一切賣國賊都將付出最慘重的代價。"
 NSB_soviet_paranoia_system_events.29.b: "這明明是殺人殺瘋了吧！"
 NSB_soviet_paranoia_system_events.30.t: "紅海軍內的常規清洗"
 NSB_soviet_paranoia_system_events.31.t: "海軍將官[?ROOT.SOV_purged_character_for_loc.GetName]被指控叛國"
 NSB_soviet_paranoia_system_events.31.desc: "海軍將官[?ROOT.SOV_purged_character_for_loc.GetName]的一名部下日前向內務人民委員部舉報，聲稱他發現了其上司的一系列可疑行為。根據這名軍官的說法，在近期對國外港口的訪問中，[?ROOT.SOV_purged_character_for_loc.GetName]受到了其外國海軍同行的熱烈歡迎，他很有可能借這個機會向外國傳遞了機密情報。此外，有證據顯示，這名海軍將官訪問過的幾個港口都有託派組織在活動，也就是說，只要他願意，他就能和托洛茨基接上頭。"
 NSB_soviet_paranoia_system_events.31.a: "紅海軍容不得他這樣的敗類。"
 NSB_soviet_paranoia_system_events.33.desc: "從不同海軍基地傳來的報告看，最近申請備用零件的次數略微增多了，據稱是用於緊急修理我軍的受損艦艇。儘管這些報告宣稱艦艇所受的磨損不過是日常損耗和訓練所致，人民內務委員部仍然心存疑慮。[Root.GetLeader]親自過問了此事，他希望開展一次徹底搜查，探明是否存在蓄意破壞的跡象。"
 NSB_soviet_paranoia_system_events.38.t: "下級海軍軍官大清洗"
 NSB_soviet_paranoia_system_events.38.desc: "接到政工幹部舉報艦隊反常行為後，人民內務委員部展開了一次全面搜查，以探明海軍軍官中是否存在一個嚴重危害蘇維埃政權的秘密組織。雖然大多數軍官都聲稱對[Root.GetLeader]和蘇聯絕對忠誠，但很明顯，他們受到了外國情報機構的策反，隨時有可能充當外國間諜。事實上，對他們的審訊證明，有一小部分軍官已經在為資本主義國家刺探情報了，而這些人還在把更多人供認出來。"
 NSB_soviet_paranoia_system_events.39.t: "大清洗 - 審判紅海軍將領"
 NSB_soviet_paranoia_system_events.39.desc: "對軍隊內部託派另立中央的調查顯示，託派在紅海軍的勢力尤為牢固。幾乎絕大多數紅海軍將領都有託派分子嫌疑，當他們駐紮海外時，便是與外國敵特分子接頭的絕佳時機。目前，所有高階海軍將領都已被人民內務委員部逮捕。在短短幾天的審訊內，他們就已經對極其嚴重的罪行供認不諱，包括間諜罪和破壞罪。隨著越來越多的海軍軍官卷入這場陰謀中，看起來只有再進行一次全面清查，才能將整個陰謀集團連根拔除。"
 NSB_soviet_paranoia_system_events.42.desc: "最近對航空兵部隊的審查發現，在近期的訓練當中，竟然多次連續發生墜機事件。除此以外，一部分我軍最先進的戰機甚至還在等待檢修，根本不能維持戰備狀態。儘管還不清楚這種事是怎麼發生的，擔心蓄意破壞的[Root.GetLeader]已經下令徹查此事。"
 NSB_soviet_paranoia_system_events.48.t: "解散設計局"
 NSB_soviet_paranoia_system_events.48.desc: "人民內務委員部經過調查，掌握了某設計局高層領導人向國外情報機構傳遞情報的證據。更甚於此，近期的飛機設計藍圖錯漏百出，其原型機若不經過反覆迭代、重修，則根本不可能具備飛行能力，不得不令人懷疑這是蓄意破壞行為。目前，人民內務委員部正在審訊該設計局的科工人員。主管本次調查的偵察員確信，不出數日，疑犯就會吐露一切實情。"
 NSB_soviet_paranoia_system_events.48.a: "我們不能容忍顛覆分子以這種方式集結起來。"
 NSB_soviet_paranoia_system_events.48.b: "他們的工作還是太重要了。"
 NSB_soviet_paranoia_system_events.49.t: "航空兵將領被牽連"
 NSB_soviet_paranoia_system_events.49.desc: "針對航空兵部隊的密集審查終於得出了結論。人民內務委員部的偵察員拿到了部分下級軍官的供詞，他們一致指認高階將領屢次下令在惡劣天氣進行演習，蓄意致使飛機墜毀受損，以此削弱航空兵部隊的備戰狀態。他們的動機目前還有待查明，但偵察員胸有成竹，相信幾天之內就能得出結論。"
 NSB_soviet_paranoia_system_events.49.a: "他們必須為此負責。"
 NSB_soviet_paranoia_system_events.49.b: "他們只是執行了軍令而已。"
