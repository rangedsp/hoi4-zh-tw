 NSB_soviet_five_year_plan.01.t: "第三個五年計劃中斷"
 NSB_soviet_five_year_plan.01.desc: "祖國正遭受襲擊，我們先前制定的經濟增長計劃顯然已經不適用於時局了。一旦恢復和平，我們就會重啟經濟計劃，但眼下我們必須轉向軍工生產。"
 NSB_soviet_five_year_plan.01.a: "詛咒他們！"
 NSB_soviet_five_year_plan_tt: "§Y$SOV_third_five_year_plan$§!國策樹下的所有工業國策已不再可用。"
 NSB_soviet_great_patriotic_war.01.t: "尼古拉·伊萬諾維奇·庫茲涅佐夫請求任命"
 NSB_soviet_great_patriotic_war.01.desc: "在[?ROOT.SOV_invader_of_ukraine.GetAdjective]大舉入侵烏克蘭之時，為了保衛祖國，尼古拉·庫茲涅佐夫正式提交了加入內務人民委員部的申請。毫無疑問，他的過人天賦將助烏克蘭游擊隊一臂之力。"
 NSB_soviet_great_patriotic_war.01.a: "歡迎加入，同志！"
 NSB_soviet_propaganda_capmaign_events.1.t: "年輕的共產主義建設者"
 NSB_soviet_propaganda_capmaign_events.1.desc: "我們在[SOV.GetNameDef]的朋友和嚮導開展了一項計劃，確保我們的年輕一代能完全理解他們被寄予的厚望。要成為一名優秀的共產主義者，必須體格健壯，受過良好的教育；不然的話，他們就既不明白要做什麼，又沒力氣建設一個更美好的世界。\n\n我們熱血沸騰的年輕人已經意識到了這一點，正在努力迎頭趕上。"
 NSB_soviet_propaganda_capmaign_events.1.a: "他們將親手開創屬於自己的、更加光明的未來。"
 NSB_soviet_propaganda_capmaign_events.2.t: "和平承諾破產"
 NSB_soviet_propaganda_capmaign_events.2.desc: "儘管我們意在維護長久和平，我們未雨綢繆的舉動卻與我們之前的說法自相矛盾，弄得如今陷入了尷尬境地。大多數人民都沒有捅破這一層窗戶紙，但我們的秘密警察報告說，許多人正在私下裡議論為什麼我們一邊承諾和平，一邊還要積極備戰。\n\n雖說沒人有膽量管我們叫騙子，可我們顯然已經不得民心。"
 NSB_soviet_propaganda_capmaign_events.2.a: "屋漏偏逢連夜雨啊。"
 NSB_soviet_propaganda_capmaign_events.3.desc: "戰爭爆發使得我們的公眾形象一落千丈。雖然大多數人都認為我們是受侵略的一方，公共輿論也將怒火一致對外，但還是有人私下裡疑惑為何[THIS.GetLeader]沒有預見到會遭受襲擊。我們的秘密警察報告說，已經有一小撮人得寸進尺了，他們痛罵[THIS.GetLeader]“要麼是天真得要命，要麼就是蠢得跺腳”。"
 NSB_soviet_propaganda_capmaign_events.3.a: "又不是我們挑起的戰爭！"
 NSB_soviet_foreign_politics_events.1.t: "[FROM.GetAdjective]向政府施壓"
 NSB_soviet_foreign_politics_events.1.desc: "[FROM.GetAdjective]外長已經抵達首都，與[THIS.GetLeader]開展緊急磋商。[FROM.GetAdjective]的代表團羅列了一長串懸而未決的爭端，從邊境警備問題，到地方媒體醜化[FROM.GetLeader]形象的問題都有。在新聞發佈會上，該國外長著重強調了和平協商與合作的重要性。最後，他不忘指出，[FROM.GetLeader]“將很難與一個充斥敵意的[THIS.GetNameDef]共存”。"
 NSB_soviet_foreign_politics_events.1.a: "如果能保留我國憲法獨立的話，那我們願意加入他們的陣營。"
 NSB_soviet_foreign_politics_events.1.b: "我們必須與他們的政府結盟。"
 NSB_soviet_foreign_politics_events.1.c: "我們一步也不會退讓"
 NSB_soviet_foreign_politics_events.2.t: "[FROM.GetAdjective]資助在首都舉辦的集會"
 NSB_soviet_foreign_politics_events.2.desc: "數個政治團體宣佈將於本週在首都舉行集會。它們呼籲的不過是諸如增進與[FROM.GetNameDef]的關係這樣的套話，以及要求嚴懲任何批評[FROM.GetAdjective]政權的政客。除此以外，這些團體似乎並沒有什麼特定的訴求。\n\n儘管這一系列集會也許只是民眾的自發組織，但其中一些關鍵組織者最近到訪過[FROM.GetCapitalVictoryPointName]的記錄很難不引起懷疑。很有可能他們一回國就開始策劃煽動民意了。"
 NSB_soviet_foreign_politics_events.2.a: "呃，他們確實有權利這麼做嘛。"
 NSB_soviet_foreign_politics_events.2.b: "派警隊上街砸爛他們的狗頭！"
 NSB_soviet_foreign_politics_events.10.t: "[FROM.GetNameDefCap]希望投資我們的經濟"
 NSB_soviet_foreign_politics_events.10.desc: "[FROM.GetAdjective]政府啟動了一系列的經濟投資項目。作為該項目的一部分，他們為興建首都及全國各地的交通網撥出款項，用以建造橋梁、隧道及道路等基礎設施。另一方面，我國建築業因此增長的產能，無疑將在日後繼續產生效益。\n\n然而，政府內部不乏質疑的聲音說，引入[FROM.GetAdjective]的專家和資金，只會讓我們將來更加依賴他們的技術。"
 NSB_soviet_foreign_politics_events.10.a: "謝謝你，同志！"
 NSB_soviet_foreign_politics_events.10.b: "這隻會助長我們對[FROM.GetNameDef]的依賴。"
 NSB_soviet_foreign_politics_events.11.t: "[FROM.GetNameDefCap]要求加緊備戰"
 NSB_soviet_foreign_politics_events.11.desc: "隨著戰爭危機迫在眉睫，[FROM.GetAdjective]政府開始催促我們擴軍備戰，他們希望我們迅速擴充預備役、削減訓練時間，這樣我們才能投入更多師團到前線，將[FROM.GetAdjective]的部隊換下來。"
 NSB_soviet_foreign_politics_events.11.a: "他們說的確實有道理。"
 NSB_soviet_foreign_politics_events.11.b: "我們要自己決定怎樣佈置防線才對我們最有利。"
 NSB_soviet_foreign_politics_events.12.t: "[FROM.GetNameDefCap]希望鞏固邊防"
 NSB_soviet_foreign_politics_events.12.desc: "注意到最近來自[JAP.GetNameDef]的威脅，[FROM.GetAdjective]政府強烈建議我們應當立即在與[JAP.GetNameDef]接壤的邊境上築防。為了節省幫助我們協防的兵力，他們承諾為此方案提供後勤和物資保障。"
 NSB_soviet_foreign_politics_events.12.a: "我們對這一提議表示歡迎。"
 NSB_soviet_foreign_politics_events.12.b: "這會造成局勢不必要的升溫。"
 NSB_soviet_foreign_politics_events.13.t: "[FROM.GetNameDef]駁回[ROOT.GetAdjective]的指導方針"
 NSB_soviet_foreign_politics_events.13.desc: "[FROM.GetAdjective]政府出人意料地駁回了我們的指導方針，並拒絕遵循由我方官員提出的計劃。看起來，[FROM.GetLeader]已經對[ROOT.GetNameDef]展現出了敵意……"
 NSB_soviet_foreign_politics_events.13.a: "認真的，[FROM.GetLeader]到底在搞什麼鬼？"
 NSB_soviet_foreign_politics_events.20.t: "[FROM.GetNameDefCap]派出軍事顧問"
 NSB_soviet_foreign_politics_events.20.desc: "為了支援我們保衛民主的背水一戰，[FROM.GetLeader]向[FROM.GetAdjective]派遣了一支軍事顧問團。他們久經沙場的寶貴經驗將無疑為我們重建軍隊提供一大助力。憑藉著先進的裝備與戰術，就算是在戰場碰上了法西斯的什麼“志願軍”部隊，他們也肯定吃不了虧。"
 NSB_soviet_foreign_politics_events.20.a: "我們並肩作戰！"
 NSB_soviet_foreign_politics_events.30.t: "[FROM.GetNameDefCap]要求歸還阿拉斯加"
 NSB_soviet_foreign_politics_events.30.desc: "幾個星期前，[FROM.GetAdjective]的宣傳機構與部分受其操縱的媒體，共同策劃了一起赤裸裸的造勢行動，將阿拉斯加的領土爭端又擺到了檯面上。他們宣稱，1867年的阿拉斯加收購案本質上要麼是商業欺詐，要麼就是強買強賣。他們進一步聲稱，無論是阿拉斯加的原住民還是移民，都必然能在[FROM.GetNameDef]過上更好的日子。\n\n今天，[FROM.GetAdjective]大使遞交了一份正式照會，宣佈所謂的“阿拉斯加自治共和國流亡政府”正式請求併入[FROM.GetNameDef]，該請求已經獲得了[FROM.GetLeader]准許。大使聲稱，現在唯一要做的事，只剩下雙方敲定權力交接的細節。"
 NSB_soviet_foreign_politics_events.30.a: "讓他們拿走那片毛都不長的凍土好了。"
 NSB_soviet_foreign_politics_events.30.b: "他們還真幽默。"
 NSB_soviet_foreign_politics_events.31.t: "阿拉斯加回歸"
 NSB_soviet_foreign_politics_events.31.desc: "在錫特卡堡舉行的正式儀式上，[FROM.GetNameDef]將阿拉斯加的主權交還給了我們。儘管大多數阿拉斯加居民對此喜憂參半，國內的人民此刻正歡呼雀躍。"
 NSB_soviet_foreign_politics_events.31.a: "我們又糾正了一個沙皇犯下的錯誤。"
 NSB_soviet_foreign_politics_events.32.t: "[FROM.GetNameDefCap]拒絕"
 NSB_soviet_foreign_politics_events.32.desc: "[FROM.GetAdjective]國務卿根本懶得搭理我們的照會。唯一的回應只有一封寄到我們大使館的信，署名是文化交流協會的副會長。他在信中寫道，他們尊重我們撰寫架空歷史作品的抱負，只是如果能夠不再通過官方渠道投稿，他們將不勝感激。"
 NSB_soviet_foreign_politics_events.32.a: "哦，他們以為我們只是說說而已嗎？"
 NSB_soviet_foreign_politics_events.32.b: "我們手頭上最不缺的就是凍土了。"
 NSB_soviet_foreign_politics_events.150.t: "[FROM.GetNameDefCap]屈服"
 NSB_soviet_foreign_politics_events.150.desc: "經過內閣通宵開會討論，[FROM.GetLeader]終於正式接受了我們的要求。我們駐[FROM.GetNameDef]的大使將確保[FROM.GetAdjective]政府在一切國內外事務上與我們緊密合作。"
 NSB_soviet_foreign_politics_events.150.a: "非常明智。"
 NSB_soviet_foreign_politics_events.151.t: "[FROM.GetNameDefCap]加入我們的陣營"
 NSB_soviet_foreign_politics_events.151.desc: "在[FROM.GetAdjective]政府內部的談判陷入僵局之後，[FROM.GetLeader]提出了一個折中方案：儘管他們同意[THIS.GetAdjective]的部隊駐紮在[FROM.GetAdjective]的國土上，他們決不接受對其政府制度的任何干涉。\n\n此外，[FROM.GetAdjective]軍隊也不會解散，這支軍隊全部由[FROM.GetAdjective]國籍的官兵組成，並且只聽命於[FROM.GetAdjective]政府。不過，[FROM.GetLeader]很樂意與我們就共同防禦條款進行協商。"
 NSB_soviet_foreign_politics_events.151.a: "至少他們還會為正義一方而戰。"
 NSB_soviet_foreign_politics_events.152.t: "[FROM.GetNameDefCap]拒絕"
 NSB_soviet_foreign_politics_events.152.desc: "我們試圖通過外交手段解決與[FROM.GetNameDef]的突出問題似乎已經行不通了。當我們的大使向[FROM.GetLeader]呼籲另一輪談判時，他被直白地告知[FROM.GetAdjective]已經清楚表明了其立場，沒有繼續討論下去的必要了。"
 NSB_soviet_foreign_politics_events.152.a: "他們選擇了一條更糟的道路。"
 NSB_soviet_foreign_politics_events.152.b: "我們不會步步緊逼，至少不是現在。"
 NSB_soviet_foreign_politics_events.152.c: "準備入侵[FROM.GetNameDef]！"
 NSB_soviet_foreign_politics_events.152.d: "我們必須準備與[ENG.GetAdjective]一起發動聯合入侵行動"
 NSB_soviet_foreign_politics_events.153.t: "英國-[SOV.GetAdjective]入侵伊朗"
 NSB_soviet_foreign_politics_events.153.desc: "我們收到了來自[FROM.GetNameDef]的外交照會，提議針對[PER.GetNameDef]發起一場聯合軍事行動。[FROM.GetAdjective]指揮部確認這次行動將會使我們確保伊朗的油田以及通向[FROM.GetNameDef]的補給線，同時可以阻止任何潛在敵人從[TUR.GetNameDef]通過[PER.GetName]進軍巴庫油田和[RAJ.GetNameDef]。"
 NSB_soviet_foreign_politics_events.153.a: "我們必須保證波斯走廊安全無虞！"
 NSB_soviet_foreign_politics_events.153.b: "我們應當尊重[PER.GetAdjective]的獨立。"
 NSB_soviet_foreign_politics_events.153_soviets_alone_tt: "[FROM.GetAdjective]人只能自己處理[PER.GetNameDef]了。"
 NSB_soviet_foreign_politics_events.154.t: "英國-[SOV.GetAdjective]入侵伊朗"
 NSB_soviet_foreign_politics_events.154.desc: "[FROM.GetAdjective]大使已經遞交了一份照會，稱[FROM.GetNameDef]同意組織併發起一場針對[PER.GetNameDef]的聯合軍事行動。[ROOT.GetAdjective]和[FROM.GetAdjective]指揮部都有信心，這將會是面對數量不足且科技落後的敵人一次快速有效的行動，並能使我們確保伊朗油田以及[FROM.GetAdjective]到[ROOT.GetNameDef]的補給線，同時可以阻止任何潛在敵人從[TUR.GetNameDef]通過[PER.GetName]進軍巴庫油田和[RAJ.GetNameDef]。"
 NSB_soviet_foreign_politics_events.154.a: "開始準備工作！"
 NSB_soviet_foreign_politics_events.155.t: "[FROM.GetAdjective]政府拒絕。"
 NSB_soviet_foreign_politics_events.155.desc: "經過[ROOT.GetAdjective]與[FROM.GetAdjective]數場毫無營養的外交會議之後，[FROM.GetNameDef]決定不參與我們對[PER.GetNameDef]的計劃。[FROM.GetLeader]本人甚至暗示這項提議不過是為我們領土野心的辯護。\n看起來我們得自己處理[PER.GetNameDef]了。"
 NSB_soviet_foreign_politics_events.155.a: "他們總是這樣靠不住……"
 NSB_soviet_foreign_politics_events.200.t: "[FROM.GetNameDefCap]提出要求"
 NSB_soviet_foreign_politics_events.158.t: "一個新的[FROM.GetAdjective]政府"
 NSB_soviet_foreign_politics_events.158.desc: "經過與我們大使並不成功的談判之後，出於來自媒體和民眾的巨大壓力，[FROM.GetAdjective]政府的前任領導者已決定辭職並召開新的選舉。與預期一樣，這些選舉由更符合我們利益的黨派勝選，即[FROM.GetRulingParty]，由[FROM.GetLeader]掌舵。"
 NSB_soviet_foreign_politics_events.158.a: "終於，我們可以期待與[FROM.GetNameDef]更多的合作了。"
 NSB_soviet_foreign_politics_events.200.desc: "[FROM.GetAdjective]大使已經遞交了一份照會，要求與[THIS.GetLeader]立即進行磋商。按照這份照會，[FROM.GetAdjective]政府無法繼續容忍在我國存在的“不確定安全隱患”。雖然尚不清楚這指的是什麼，但很明顯我們有三種選擇：允許[FROM.GetAdjective]軍隊駐紮在我國領土；替換為更適合[FROM.GetNameDef]需求的政府；或者可能面對一場來自[FROM.GetNameDef]的進攻。"
 NSB_soviet_foreign_politics_events.200.a: "我們別無選擇"
 NSB_soviet_foreign_politics_events.200.b: "或許我們可以妥協？"
 NSB_soviet_foreign_politics_events.200.c: "我們將為自由而戰！"
 NSB_soviet_foreign_politics_events.210.t: "來自[FROM.GetNameDef]的施壓"
 NSB_soviet_foreign_politics_events.210.desc: "看起來[FROM.GetAdjective]政府對我方外交狀況愈發焦急。在上個星期裡，[FROM.GetAdjective]大使已經與[THIS.GetLeader]會晤了至少六次，並在最後一輪談判中實際遞交了一份最後通牒。\n\n要麼我們加入[FROM.GetNameDef]的防禦條約，並接受“就國內事務進行一定程度的磋商”，要麼[FROM.GetNameDef]很可能對我國訴諸武裝干涉。"
 NSB_soviet_foreign_politics_events.210.a: "抵抗是徒勞的。"
 NSB_soviet_foreign_politics_events.210.c: "讓他們放馬過來！"
 NSB_soviet_foreign_politics_events.211.t: "哈基莫夫提案"
 NSB_soviet_foreign_politics_events.211.desc: "蘇聯總領事卡里姆·哈基莫夫正在加倍努力發展蘇聯-阿拉伯友好關係。作為一位有韃靼血統的蘇聯穆斯林，哈基莫夫在1926年2月驅車從吉達一路橫穿戰火，趕往蘇丹在沙漠裡的寢宮傳遞一份正式文件承認其作為漢志國王與內志蘇丹的舉動，贏得了伊本·沙特的尊重和友誼。自那以後，他便成為了蘇聯-阿拉伯關係的主要推動者。是貨真價實的蘇聯版阿拉伯的勞倫斯。"
 NSB_soviet_foreign_politics_events.211.a: "哈基莫夫提案或許是友好的，但我們必須警惕蘇聯的野心。"
 NSB_soviet_foreign_politics_events.250.t: "[FROM.GetNameDefCap]送來了軍事援助"
 NSB_soviet_foreign_politics_events.250.desc: "一支來自[FROM.GetAdjective]的運輸隊抵達了我們的前線，為我們帶來了大量的武器及其他補給。我們尚未得知下一支運輸隊什麼時候會來，所以我們手頭上用著的傢伙還得再撐久點。"
 NSB_soviet_foreign_politics_events.251.t: "[FROM.GetNameDefCap]準備與[JAP.GetNameDef]開戰"
 NSB_soviet_foreign_politics_events.251.desc: "看起來[FROM.GetLeader]已經得出結論，短期內與[JAP.GetNameDef]開戰已經在所難免。因此，[FROM.GetAdjective]駐我國首都的代表敦促我們提高邊防部隊戒備、開始動員軍隊，以提防[JAP.GetAdjective]的突襲。"
 NSB_soviet_foreign_politics_events.251.a: "我們會做好準備的。"
 NSB_soviet_foreign_politics_events.252.t: "對[JAP.GetNameDef]宣戰"
 NSB_soviet_foreign_politics_events.252.desc: "早在意料之中、對抗[JAP.GetNameDef]的戰爭終於爆發了。今天早些時候，[FROM.GetAdjective]軍隊在中日邊境向[JAP.GetAdjective]的據點展開了全線進攻，現在是時候加入他們一邊了。我們會與[FROM.GetAdjective]盟友並肩作戰，將[JAP.GetAdjective]趕出我們的土地！"
 NSB_soviet_foreign_politics_events.252.a: "算總賬的這一天終於來了！"
 NSB_soviet_foreign_politics_events.260.t: "[FROM.GetNameDefCap]提議和談"
 NSB_soviet_foreign_politics_events.260.desc: "接連攻佔了千島群島和南薩哈林之後，[FROM.GetAdjective]軍隊的指揮官提議在當前戰線上全線停火，為簽署和約做準備。和約條款未曾挑明的是，儘管雙方很有可能承認至少以北方四島劃定新邊界，但千島群島與南薩哈林將在事實上被割讓給[FROM.GetNameDef]。"
 NSB_soviet_foreign_politics_events.260.a: "雖然無奈，但並非不可接受。"
 NSB_soviet_foreign_politics_events.260.b: "戰爭形勢也許還會向我方傾斜。"
 NSB_soviet_foreign_politics_events.261.desc: "在攻佔了千島群島和南薩哈林，並且成功登陸北海道之後，[FROM.GetAdjective]軍隊的指揮官提議在當前戰線上全線停火，為簽署和約做準備。看起來，和約將正式承認[FROM.GetAdjective]對千島群島與南薩哈林的所有權，並將北海道劃歸[FROM.GetAdjective]管理。"
 NSB_soviet_foreign_politics_events.262.b: "多麼荒謬的提議！"
 NSB_soviet_foreign_politics_events.263.t: "[FROM.GetNameDefCap]提議結盟"
 NSB_soviet_foreign_politics_events.263.desc: "來自[FROM.GetLeader]的特使已與我們接洽，他提出了一個大膽的建議——[FROM.GetAdjective]竟然願意與我們簽署盟約！雖然條約細節還有待商榷，但不難看出這一聯盟將著重削弱並最終消滅[USA.GetNameDef]在太平洋地區的影響力。我們將一舉移除在中國事務上針對我們的這一最大威脅，使我們得以換下大量兵力派遣到其他地方。\n\n雖然大多數海軍軍官都看好兩國的合作前景，但陸軍卻十分懷疑這份提議的動機，他們擔心只要我們一轉身，[FROM.GetNameDef]就會往我們背上捅刀。"
 NSB_soviet_foreign_politics_events.263.a: "這會徹底打破權力均勢的現狀。"
 NSB_soviet_foreign_politics_events.263.b: "我們不信他們會遵守承諾。"
 NSB_soviet_foreign_politics_events.264.t: "[FROM.GetNameDef]接受我方和約條款"
 NSB_soviet_foreign_politics_events.264.desc: "在[GetAppropriateSovietProgressInJapan]之後，[FROM.GetLeader]答應了我們的和談條件。為了立即終結兩國的敵對關係，他已經全盤接受我們的領土要求。\n他們將立刻向[ROOT.GetNameDef]移交[537.GetName]、[555.GetName]及[536.GetName]地區的行政權。"
 NSB_soviet_foreign_politics_events.264.desc_default: "[GetAppropriateRedArmyNsName]代表[ROOT.GetAdjective]出兵佔領[FROM.GetAdjective]的北方四島。"
 NSB_soviet_foreign_politics_events.264.desc_hokkaido: "[GetAppropriateRedArmyNsName]向包括[536.GetName]在內的[FROM.GetAdjective]屬北方四島進軍。"
 NSB_soviet_foreign_politics_events.264.a: "[FROM.GetLeader]做了個明智的決定。"
 NSB_soviet_foreign_politics_events.265.t: "[FROM.GetNameDef]拒絕我方和約條款"
 NSB_soviet_foreign_politics_events.265.desc: "[From.GetNameDef]拒絕了我們的和談提案，他們誓言繼續戰鬥，直到徹底將[ROOT.GetAdjective]部隊趕出[FROM.GetAdjective]領土，並叫囂要把戰火燒到我們的國土上。"
 NSB_soviet_foreign_politics_events.265.a: "難道[FROM.GetLeader]就不知道這會毀了他的國家嗎？"
 NSB_soviet_foreign_politics_events.266.t: "[ROOT.GetAdjective]與[FROM.GetAdjective]簽署友好條約"
 NSB_soviet_foreign_politics_events.266.desc: "[FROM.GetAdjective]政府對我們釋放的和解信號十分滿意，並接受了我們的提議。\n就在幾個小時之前，[FROM.GetAdjective]與[ROOT.GetAdjective]的外交官簽署了互不侵犯條約。據[FROM.GetAdjective]大使的說法，這一條約將開啟兩國在遠東合作的新時代。"
 NSB_soviet_foreign_politics_events.266.a: "眼下的一時妥協，將在未來收穫更大的回報。"
 NSB_soviet_foreign_politics_events.267.t: "[FROM.GetNameDef]拒絕簽署我方提出的防禦條約"
 NSB_soviet_foreign_politics_events.267.desc: "[FROM.GetAdjective]政府並未被我方釋放的和解信號所打動，斷然拒絕了我們的提議。\n看來，我們必須時時警惕[FROM.GetLeader]覬覦遠東的野心…"
 NSB_soviet_foreign_politics_events.267.a: "該重新修訂我們的計劃了…"
 NSB_soviet_foreign_politics_events.268.t: "[ROOT.GetAdjective]與[FROM.GetAdjective]簽署反[USA.GetNameDef]協定"
 NSB_soviet_foreign_politics_events.268.desc: "對於我們提出的針對[USA.GetNameDef]的進攻性條約，[FROM.GetAdjective]展現出了強烈的興趣，而就在剛才，[FROM.GetLeader]的外交官簽署了我方向他們遞交的協定。[FROM.GetAdjective]軍隊現在正向新防區調動，他們的最高統帥部認為，隨著兩國的聯合，擊敗[USA.GetNameDef]已經指日可待，其在國際社會的影響力也將被一舉掃空。"
 NSB_soviet_foreign_politics_events.268.a: "我們會給[USA.GetAdjective]帝國主義當頭一棒！"
 NSB_soviet_foreign_politics_events.269.t: "[FROM.GetNameDef]拒絕簽署我方提出的進攻性條約"
 NSB_soviet_foreign_politics_events.269.desc: "[FROM.GetAdjective]政府拒絕了我們的提案。看起來，[FROM.GetLeader]對我們提出的進攻性條約並沒有興趣，他不希望加入[ROOT.GetAdjective]，也沒有意願與[FROM.GetAdjective]軍隊攜手對抗[USA.GetNameDef]。"
 NSB_soviet_foreign_politics_events.269.a: "真是遺憾…"
 SOV_decision_will_be_locked_tt: "\n這項決議將不再可用。我們對每個國家僅能發送一次最終通牒。"
 SOV_decision_will_remain_available_tt: "\n這項決議仍將可用。"
 NSB_soviet_foreign_politics_events.270.t: "[FROM.GetAdjective]跨裡海鐵路擴張"
 NSB_soviet_foreign_politics_events.270.desc: "俄羅斯跨裡海鐵路從中亞穿越到東部終點塔什干。[FROM.GetAdjective]政府現在希望對其擴建，並希望連接到我們的首府，以此便利貿易。[FROM.GetAdjective]官員們似乎對於開拓新疆市場饒有興趣，聲稱這將成為走向發展交流、互助互利之路的敲門磚。"
 NSB_soviet_foreign_politics_events.270.a: "我們急需這一支持！"
 NSB_soviet_foreign_politics_events.270.b: "[SOV.GetAdjective]決不能拿貿易來干涉我國內政。"
 NSB_soviet_foreign_politics_events.271.t: "[FROM.GetNameDefCap]接受我方提案"
 NSB_soviet_foreign_politics_events.271.desc: "駐塞米巴拉金斯克的[SIK.GetAdjective]領事與我國外交官聯繫，傳達了[SIK.GetAdjective]政府願意接受[ROOT.GetAdjective]延長跨裡海鐵路連接迪化的倡議。他還表示，[SIK.GetNameDef]省政府對發展同我國的全新經濟和外交關係持開放態度。"
 NSB_soviet_foreign_politics_events.271.a: "嶄新經濟市場的大門被打開了！"
 NSB_soviet_foreign_politics_events.272.t: "[FROM.GetNameDefCap]拒絕了我們的提案"
 NSB_soviet_foreign_politics_events.272.desc: "駐塞米巴拉金斯克的[SIK.GetAdjective]領事與我國外交官聯繫，表示[SIK.GetAdjective]政府拒絕[ROOT.GetAdjective]擴大跨裡海線路以連接[SIK.GetAdjective]首府迪化的提案。"
 NSB_soviet_foreign_politics_events.272.a: "這是個出乎意料、十分不幸的轉折。"
 NSB_soviet_foreign_politics_events.272.b: "他們在玩火！"
 NSB_soviet_foreign_politics_events.273.t: "[FROM.GetAdjective]在[619.GetName]進行資源勘探"
 NSB_soviet_foreign_politics_events.273.desc: "[FROM.GetAdjective]駐迪化的代表向我方遞交了一份提議，希望勘探[619.GetName]地區的資源，改善該地的基礎設施為資源開採服務。作為交換，他們提議通過[FROM.GetAdjective]的貿易實體，向我方出口阿爾泰地區的黃金與稀有礦石等商品作為回報。"
 NSB_soviet_foreign_politics_events.273.a: "這份協議能讓雙方共贏。"
 NSB_soviet_foreign_politics_events.273.b: "他們只是想加強[FROM.GetAdjective]在我國的影響力而已。"
 NSB_soviet_foreign_politics_events.274.t: "[FROM.GetNameDefCap]接受我方提案"
 NSB_soviet_foreign_politics_events.274.desc: "在迪化的[ROOT.GetAdjective]代表已被[SIK.GetAdjective]外交官通知，他們接受了我們在[619.GetName]勘探戰略資源，且幫助其提高當地基礎設施以便更好開採的提議。作為交換，[SIK.GetAdjective]的阿爾泰黃金和稀有礦物之類的大宗商品將會以實物出口來回報我們。"
 NSB_soviet_foreign_politics_events.274.a: "這將為我們帶來新的商機！"
 NSB_soviet_foreign_politics_events.275.t: "[FROM.GetNameDefCap]拒絕了我們的提案"
 NSB_soviet_foreign_politics_events.275.desc: "[ROOT.GetAdjective]駐迪化的代表已接到[SIK.GetAdjective]外交官的通知，他們的政府已經拒絕了我們在該國投資的建議。看來[SIK.GetNameDef]對開放貿易和與[ROOT.GetNameDef]發展更進一步的商業和外交關係不再感興趣了。"
 NSB_soviet_foreign_politics_events.275.a: "真是個不明智的選擇…"
 NSB_soviet_foreign_politics_events.275.b: "我們並不是真的在請求許可。"
 NSB_soviet_foreign_politics_events.276.t: "[FROM.GetAdjective]要求在[618.GetName]進行資源勘探"
 NSB_soviet_foreign_politics_events.276.desc: "[FROM.GetAdjective]方面提交的一份新提案已經遞交給我國外交官。看來[FROM.GetNameDefCap]對在我國北部地區尋找礦產和石油資源產生了極大的興趣，他們提議在該地區進行礦產勘探和擴建基礎設施，以換取資源開採權。[FROM.GetAdjective]代表申明，這項工業投資將自然而然地提高我們國家在該地區的黃金和白銀產量。"
 NSB_soviet_foreign_politics_events.276.a: "這些資源對我們來說並不重要。我們需要的是黃金！"
 NSB_soviet_foreign_politics_events.276.b: "這些資源埋藏在[ROOT.GetAdjective]的地底下，它們理應屬於[ROOT.GetName]！"
 NSB_soviet_foreign_politics_events.277.t: "$NSB_soviet_foreign_politics_events.274.t$"
 NSB_soviet_foreign_politics_events.277.desc: "[ROOT.GetAdjective]駐[SIK.GetNameDef]的外交官報告說，我們在[SIK.GetNameDef]北部地區勘探礦藏和石油的提議已被接受。[SIK.GetName]的省政府渴望看到[618.GetName]基礎設施的擴展，這自然會促進其在該地區的黃金和白銀的產量，因此他們同意將我們在[618.GetName]可能發現的任何戰略資源的開採權讓給我們，以作為償還[ROOT.GetAdjective]投資的手段。"
 NSB_soviet_foreign_politics_events.277.a: "這個提議他們無法拒絕！"
 NSB_soviet_foreign_politics_events.278.t: "[FROM.GetAdjective]軍事援助"
 NSB_soviet_foreign_politics_events.278.desc: "一封來自[FROM.GetAdjective]大使的信已被送到我們的外交官手中，我們的鄰國在信中流露出了對[ROOT.GetName]的軍力的擔憂，並承諾將通過向我國派遣裝備和教官的方式，幫助建設[ROOT.GetAdjective]軍隊。我們將收到空軍的飛行器和裝備與陸軍的步槍和機槍，他們還將建造火炮車間和工事，並開設飛行學校以培訓本國飛行員。作為交換，[FROM.GetAdjective]政府要求減少貿易壁壘，增加[ROOT.GetAdjective]商品的出口，如羊毛、棉花、毛皮和皮革等。"
 NSB_soviet_foreign_politics_events.278.a: "這個提議還挺慷慨。"
 NSB_soviet_foreign_politics_events.278.b: "我們必須抵制[FROM.GetAdjective]的經濟侵略！"
 NSB_soviet_foreign_politics_events.279.t: "[FROM.GetNameDefCap]接受我國軍事援助"
 NSB_soviet_foreign_politics_events.279.desc: "我們在[SIK.GetNameDef]的外交官告訴我們，我們向[SIK.GetName]提供軍事援助的建議已經被[SIK.GetLeader]接受。顯然，中方領導人渴望強化其軍隊和軍事防禦，並相信在[ROOT.GetAdjective]的幫助下，[SIK.GetNameDef]能夠抵禦來自東方的敵對勢力。"
 NSB_soviet_foreign_politics_events.279.a: "一個明智的決定！"
 NSB_soviet_foreign_politics_events.280.t: "[FROM.GetAdjective]支持領土擴張"
 NSB_soviet_foreign_politics_events.280.desc: "在我們向東擴張領土後，[FROM.GetAdjective]政府表示有興趣支持我們的進一步行動，並承諾將協助我們在新獲得的領土上建設基礎設施和軍事防禦。[FROM.GetNameDefCap]對開發[756.GetName]的油田也很感興趣，他們說這可能是我們向東軍事擴張的關鍵。\n\n[FROM.GetAdjective]政府再次要求為他們在我國市場的貿易實體提供進一步的財政利益，並增加出口作為交換。"
 NSB_soviet_foreign_politics_events.280.a: "這很公平。"
 NSB_soviet_foreign_politics_events.280.b: "夠了，我們不需要他們！"
 NSB_soviet_foreign_politics_events.281.t: "[FROM.GetNameDefCap]接受我國援助"
 NSB_soviet_foreign_politics_events.281.desc: "[SIK.GetLeader]已接受我國提議，拿到了向東擴張的後勤和軍事援助。我國將被允許在其新領土上建設基礎設施和軍事防線，並在開發在[756.GetName]的油田。作為回報，[SIK.GetAdjective]政府將對我國貿易門戶開放，這樣以來我們獲得了經濟利益，而來還能擴大對我國的出口。"
 NSB_soviet_foreign_politics_events.281.a: "我們總是樂於助人的！"
 NSB_soviet_foreign_politics_events.282.t: "[SOV.GetNameDefCap]要求成立[ROOT.GetNameDef]蘇維埃共和國"
 NSB_soviet_foreign_politics_events.282.desc: "我們收到了一份來自[FROM.GetNameDef]的正式公報，要求將[ROOT.GetNameDef]改組為從屬於[FROM.GetNameDef]政府的獨立蘇維埃社會主義共和國。[FROM.GetLeader]許諾，我國將享有一定程度的自治，同時紅軍也將隨時準備好保衛新疆，如同蘇聯自己的領土一般。如他所說，這些措施是確保兩國在當前的艱難時代有效合作的必要措施。\n考慮到[FROM.GetNameDef]在當地的大量投資以及越來越多的[FROM.GetAdjective]經濟影響，最好在答覆之前仔細斟酌一下。"
 NSB_soviet_foreign_politics_events.282.a: "我們別無選擇。"
 NSB_soviet_foreign_politics_events.282.b: "不能再跟他們來往了，中國統一而不可分割！"
 NSB_soviet_foreign_politics_events.283.t: "[SIK.GetNameDefCap]"
 NSB_soviet_foreign_politics_events.283.desc: "我們收到了一份來自[FROM.GetLeader]的正式公報，同意將新疆地區改組為一個從屬於[ROOT.GetNameDef]政府的獨立蘇維埃社會主義共和國。我國在那裡投建的大型開發項目充分顯示了[ROOT.GetAdjective]同盟友建立良好關係並提供援助的意願。這些行動使[FROM.GetLeader]明白，我國的要求不過是確保我們兩國在當前艱難時期有效合作的必要措施。"
 NSB_soviet_foreign_politics_events.283.a: "歡迎加入蘇聯，同志。"
 NSB_soviet_foreign_politics_events.284.t: "[FROM.GetNameDefCap]拒絕了我國的要求"
 NSB_soviet_foreign_politics_events.284.desc: "我們收到了一份來自[FROM.GetLeader]的正式公報，他們拒絕將[FROM.GetNameDef]改組為獨立蘇維埃社會主義共和國。看來我國為發展該地區和援助鄰國所付出的大量投資對於[FROM.GetLeader]來說毫無意義，後者仍對[ROOT.GetNameDef]充滿了不信任。"
 NSB_soviet_foreign_politics_events.284.a: "他們阻礙了兩國間的合作。"
 NSB_soviet_foreign_politics_events.284.b: "這種冒犯可是逃不過報復的！"
 NSB_soviet_foreign_politics_events.285.t: "[SOV.GetName]處在崩潰的邊緣。"
 NSB_soviet_foreign_politics_events.285.desc: "在戰爭中遭受了巨大的損失之後，[SOV.GetNameDef]的潰敗可能比想像中的更接近。政府的一些成員肯定，我們不可避免地受到這種事態變化的威脅，並建議立即取消[SOV.GetAdjective]的一切協定，並開始努力加強與中國中央政府的關係。這些人聲稱，如果要確保[ROOT.GetNameDef]安全，就必須不惜一切代價找到能支持們的強大依靠。考慮到當前的事態，[SOV.GetNameDef]不太可能採取任何報復行動。"
 NSB_soviet_foreign_politics_events.285.a: "我們要與[SOV.GetAdjective]共進退！"
 NSB_soviet_foreign_politics_events.285.b: "該收拾收拾跑路了。"
 NSB_soviet_foreign_politics_events.286.t: "蘇聯屢戰戰敗，新疆屢告屢急"
 NSB_soviet_foreign_politics_events.286.desc: "昨日，在一份正式的聲明中，[SIK.GetLeader]重申了新疆地區對於[ROOT.GetNameDef]的忠誠及希望繼續與我等合作的個人意願。然而，於[SIK.GetNameDef]流傳的危言聳聽已經嚴重損害了[ROOT.GetNameDef]的形象，[SIK.GetLeader]在[SIK.GetRulingParty]內的支持度也一落千丈。"
 NSB_soviet_foreign_politics_events.286.a: "無可奈何……"
 NSB_soviet_foreign_politics_events.286.b: "我們必須處理掉這些叛徒！"
 NSB_soviet_foreign_politics_events.287.t: "[SIK.GetNameDefCap]退出[ROOT.GetFactionName]"
 NSB_soviet_foreign_politics_events.287.desc: "昨日，在一份正式的聲明中，[SIK.GetLeader]正式宣佈新疆地區將退出[ROOT.GetFactionName]，並當即撕毀了一切與[ROOT.GetAdjective]的協議。\n根據他的講話，[ROOT:GetName]處於崩潰邊緣，東西兩個方向都遭到了敵人的包圍。此種情況下，新疆理應加強與中國中央政府的聯繫，一致對抗外國侵略者。"
 NSB_soviet_foreign_politics_events.287.a: "讓他們趕緊滾，我們還有更緊要的事得去做。"
 NSB_soviet_foreign_politics_events.287.b: "我們必須讓這幫傢伙付出代價！"
 SOV_sinikiang_influence_cg_tt_sik: "若我們簽訂該條約，§Y[SOV.GetFlag][SOV.GetNameDefCap]§!將獲得額外§Y-1.0%§!的生活消費品減成。"
 SOV_sinikiang_influence_cg_tt_sov: "$SOV_modify_fyp_ns_intro$\n生活消費品工廠：§Y-1.0%§!"
 SOV_sinkiang_when_project_finishes_tt: "\n項目完成後的效果："
 NSB_soviet_soviet_german_trade_agreement.1.t: "蘇德貿易協定"
 NSB_soviet_soviet_german_trade_agreement.1.desc: "[FROM.GetAdjective]大使聯絡我們的外交官，提出了一項雙邊貿易協定。按照協定內容，[FROM.GetNameDef]會為我們提供原材料，如糧食、棉花、石油、礦石和橡膠，作為交換，[FROM.GetAdjective]要求我們提供一艘未完工的希佩爾級巡洋艦、其他軍艦的建造計劃、海軍重炮以及一些[ROOT.GetAdjective]飛機。\n這項協定毫無疑問會助力我們對抗歐洲的敵對國家，我們甚至能借此擺脫[GetTradeAgreementBlockadeWarPeace]的封鎖。"
 NSB_soviet_soviet_german_trade_agreement.1.desc_war_eng: "[ENG.GetAdjective]"
 NSB_soviet_soviet_german_trade_agreement.1.desc_war: "敵人"
 NSB_soviet_soviet_german_trade_agreement.1.desc_peace: "潛在敵人"
 NSB_soviet_soviet_german_trade_agreement.1.a: "我們需要原材料"
 NSB_soviet_soviet_german_trade_agreement.1.b: "我們不會把我們的海軍機密分享給他們的！"
 NSB_soviet_soviet_german_trade_agreement.2.t: "[GER.GetNameDefCap]簽署了$NSB_soviet_soviet_german_trade_agreement.1.t$"
 NSB_soviet_soviet_german_trade_agreement.2.desc: "[FROM.GetAdjective]的外交官通知我們，他們同意了我們的提議。我們國家會加入了一個貿易條約，由[ROOT.GetNameDef]輸送原材料如糧食，棉花，石油，鐵礦石和橡膠到[FROM.GetNameDef]。作為交換，我們會獲得一艘未完成的希佩爾級巡洋艦、其他軍艦的建造計劃、海軍重炮以及一些[FROM.GetAdjective]飛機。這個協議一定會幫助我們建立現代的軍事科技。\n"
 NSB_soviet_soviet_german_trade_agreement.2.a: "這對紅海軍大有裨益。"
 NSB_soviet_soviet_german_trade_agreement.3.t: "[GER.GetNameDefCap]拒絕了$NSB_soviet_soviet_german_trade_agreement.1.t$"
 NSB_soviet_soviet_german_trade_agreement.3.desc: "我們的大使經過數次嘗試，試圖以兩國之間的互惠互利的貿易條約說服[FROM.GetAdjective]的官員。但是[FROM.GetAdjective]的外交官通知我們，他們並沒有興趣和[ROOT.GetNameDef]簽署一個貿易協議。"
 NSB_soviet_soviet_german_trade_agreement.3.a: "固執的蠢貨！"
 NSB_soviet_policies_of_collective_security.1.t: "[FROM.GetNameDefCap]提議簽訂互助條約"
 NSB_soviet_policies_of_collective_security.1.desc: "注意到我們兩國所面臨的共同威脅之後，[FROM.GetAdjective]政府提出了一個互助的條約。根據該條約，我們將保持互不侵犯。\n\n一個懸而未決的問題是，[POL.GetNonIdeologyName]位於我們國家之間。任何一方試圖援助另一方，都必須通過波蘭。外交部的一些人強烈認為，我們應該將波蘭納入這一條約，以確保我們能夠真正直接支援對方。"
 NSB_soviet_policies_of_collective_security.1.a: "我們同意簽署該條約。"
 NSB_soviet_policies_of_collective_security.1.b: "我們應該向波蘭示好。"
 NSB_soviet_policies_of_collective_security.1.c: "這不符合我們的利益。"
 NSB_soviet_policies_of_collective_security.2.t: "[FROM.GetNameDefCap]同意簽署條約"
 NSB_soviet_policies_of_collective_security.2.desc: "[FROM.GetNameDef]政府已在原則上同意了我方提議的互助條約，並派遣一個外交代表團來決定詳細部分如何實行。"
 NSB_soviet_policies_of_collective_security.2.a: "我們將共同奮戰。"
 NSB_soviet_policies_of_collective_security.3.t: "[FROM.GetNameDefCap]拒絕了我們的提議"
 NSB_soviet_policies_of_collective_security.3.desc: "儘管經過幾個長夜的緊張談判，[FROM.GetAdjective]代表團還是一項條約也沒簽署就離開了。雖然外交部的一些人仍然對該協議抱有希望，[FROM.GetAdjective]政府似乎認為這件事已經結束了。"
 NSB_soviet_policies_of_collective_security.3.a: "短視的決定。"
 NSB_soviet_policies_of_collective_security.4.t: "[FROM.GetNameDefCap]推動[POL.GetAdjective]加入條約"
 NSB_soviet_policies_of_collective_security.4.desc: "雖然從根本上講，[FROM.GetAdjective]政府對互助條約持開放態度，但也對波蘭的立場有些擔憂。[FROM.GetAdjective]政府似乎認為波蘭必須被納入條約。\n\n在這個問題上，[FROM.GetAdjective]代表團不會讓步，並已要求我們正式邀請[POL.GetNonIdeologyName]加入條約。"
 NSB_soviet_policies_of_collective_security.4.a: "他們說的有道理。"
 NSB_soviet_policies_of_collective_security.4.b: "兩國關係不容外國插手。"
 NSB_soviet_policies_of_collective_security.5.t: "[FROM.GetNameDefCap]拒絕將[POL.GetNameDef]納入條約"
 NSB_soviet_policies_of_collective_security.5.desc: "我們試圖說服[FROM.GetAdjective]代表團，向他們表明將[POL.GetNonIdeologyName]納入條約的必要性，但並沒有取得進一步成果。\n\n據他們說，[POL.GetNonIdeologyName]的問題與當前的條約無關，並斷然拒絕進一步討論。我們現在需要決定是在這裡結束談判，還是繼續遵循當前的解決方案。"
 NSB_soviet_policies_of_collective_security.5.a: "這點小事影響不到條約的簽訂。"
 NSB_soviet_policies_of_collective_security.5.b: "那麼，這場協議就該取消了。"
 NSB_soviet_policies_of_collective_security.6.t: "[FROM.GetNameDefCap]同意將[POL.GetNameDef]納入條約"
 NSB_soviet_policies_of_collective_security.6.desc: "經過新一輪的談判，[FROM.GetAdjective]代表團已經同意將[POL.GetNonIdeologyName]納入條約。一旦確定了細節，我們將向[POL.GetAdjective]政府發出信息，提議他們以與我們相同的地位加入我們的聯盟之中。"
 NSB_soviet_policies_of_collective_security.6.a: "現在就看波蘭人的了。"
 NSB_soviet_policies_of_collective_security.7.t: "[SOV.GetAdjective]-[FROM.GetAdjective]互助條約"
 NSB_soviet_policies_of_collective_security.7.desc: "[FROM.GetAdjective]大使通知我們，他的國家剛剛與[SOV.GetNameDef]簽訂了互助條約。根據條約條款，他們雙方將保持互不侵犯，並在戰時盡一切努力支援對方。\n\n他進一步表示，他的政府只有在我們明確表示願意加入該條約的情況下才會與我們簽約。"
 NSB_soviet_policies_of_collective_security.7.a: "我們很高興能成為這一條約的第三方。"
 NSB_soviet_policies_of_collective_security.7.b: "他們就不知道蘇聯佬信不過嗎？"
 NSB_soviet_policies_of_collective_security.8.t: "[FROM.GetNameDefCap]拒絕簽署將[POL.GetNameDef]包括在內的條約"
 NSB_soviet_policies_of_collective_security.8.desc: "我們試圖與[FROM.GetNameDef]達成協議的努力以失敗告終。看起來[POL.GetNonIdeologyName]的問題和該國在條約中的存在不僅至關重要，而且沒有任何迴旋餘地。"
 NSB_soviet_policies_of_collective_security.8.a: "忠心錯付。"
 NSB_soviet_policies_of_collective_security.9.t: "[FROM.GetNameDefCap]同意簽署條約"
 NSB_soviet_policies_of_collective_security.9.desc: "經過進一步的談判，[FROM.GetAdjective]政府已經同意簽署條約，儘管他們早先對將波蘭排除在外感到疑慮。雖然[FROM.GetAdjective]代表團仍有一些怨言，但他們似乎願意繼續推進該條約的簽署。"
 NSB_soviet_policies_of_collective_security.9.a: "他們真是識時務。"
 NSB_soviet_policies_of_collective_security.10.t: "[FROM.GetNameDefCap]拒絕簽署條約"
 NSB_soviet_policies_of_collective_security.10.desc: "在一系列意想不到的轉折之後，[POL.GetLeader]政府拒絕加入我們提議的條約。雖然官方給出的理由是缺乏可靠的威脅，但私下裡，[POL.GetAdjective]政府指出，蘇聯人渴望進軍波蘭來“保衛”她，而且事後也可能不會離開。"
 NSB_soviet_policies_of_collective_security.10.a: "至少我們試過了。"
 NSB_soviet_policies_of_collective_security.11.t: "[POL.GetNameDefCap]拒絕加入我們的互助條約"
 NSB_soviet_policies_of_collective_security.11.desc: "[POL.GetAdjective]政府拒絕加入互助條約，理由是缺乏針對他們的可靠威脅，而且他們也不願意明確加入某個陣營。\n\n外交界普遍認為，他們給出的理由只是為了保面子而已，真正的原因是他們不願意信任我們。"
 NSB_soviet_policies_of_collective_security.11.a: "真是浪費時間。"
 NSB_soviet_policies_of_collective_security.12.t: "[FROM.GetNameDefCap]同意加入我們的互助條約"
 NSB_soviet_policies_of_collective_security.12.desc: "[FROM.GetAdjective]政府已同意加入該條約。雖然還有一些細節問題亟待解決，但這不會影響條約的生效。"
 NSB_soviet_policies_of_collective_security.12.a: "這會使我們的聯盟變得更加強大。"
 NSB_soviet_policies_of_collective_security.13.desc: "隨著[POL.GetNonIdeologyName]問題的解決，[FROM.GetAdjective]政府願意按照最初商定的條款，著手正式同意簽署該條約。"
 NSB_soviet_policies_of_collective_security.13.a: "是時候簽字了！"
 NSB_soviet_academy_of_sciences.1.t: "[THIS.GetAdjective]科學院的建立"
 NSB_soviet_academy_of_sciences.1.desc: "在於今天舉行的豪華儀式上，[THIS.GetLeader]和[SOV.GetAdjective]大使為[THIS.GetAdjective]科學院正式揭幕。這個新的科研部門將以[SOV.GetAdjective]科學院為藍本，使我們能夠在[SOV.GetNameDef]的專家指導下進行相當高水準的研究。"
 NSB_soviet_academy_of_sciences.1.a: "科學邊界擴張的一大步！"
 NSB_soviet_atomic_bomb_project.1.t: "特工帶著核機密回來了"
 NSB_soviet_atomic_bomb_project.1.desc: "我們的一名負責滲透外國核研究設施的特工攜帶了著大量科學家正在研究的各種不同項目的最高機密文件，從離心機設計到彈頭尺寸計算，回到了我們的大使館。這些數據對推進我們自己的核武製造計劃無疑是相當有價值的。"
 NSB_soviet_atomic_bomb_project.1.a: "和平的又一次勝利。"
 NSB_soviet_atomic_bomb_project.2.t: "我方特工在他國核設施被捕"
 NSB_soviet_atomic_bomb_project.2.desc: "今天，一名負責潛入核武研究設施的我方特工在試圖離開時被逮捕。逮捕人員在他的包中搜出了一些秘密文件。不幸的是，他已經承認他為我們工作，而我國大使已經被傳喚進行緊急磋商對質。"
 NSB_soviet_atomic_bomb_project.2.a: "真是荒謬！我們和這個人沒有任何關係！"
 NSB_soviet_atomic_bomb_project.3.t: "核研究設施的安全漏洞"
 NSB_soviet_atomic_bomb_project.3.desc: "今天早些時候，我國一座核研究設施的一名僱員在一次例行檢查中被攔下。在對他的物品進行徹底搜查時，搜查人員發現他的包裡有一個暗格。該夾層內藏了一些與核技術有關的高度機密文件。\n\n嫌疑人已被移交給反間諜部門，他已經對事實供認不諱。看來他與[SOV.GetAdjective]大使館有聯繫，任務是潛入我們的核研究項目並竊取藍圖和其他研究數據。"
 NSB_soviet_atomic_bomb_project.3.a: "至少我們沒丟東西。"
 NSB_soviet_policies_of_collective_security_agreed_effects_tt: "如果該條約得以簽署，我們將同意以下條件："
 NSB_soviet_policies_of_collective_security_condition_effects_tt: "如果[FROM.GetAdjective]和[POL.GetAdjective]政府都同意將[POL.GetNameDef]納入條約，那麼同樣的效果也將適用於[POL.GetNameDef]。"
 NSB_soviet_policies_of_collective_security_refusing_poland_inclusion_tt: "我們將拒絕[FROM.GetAdjective]將[POL.GetNameDef]納入公約的提議。[FROM.GetNameDefCap]將不得不選擇接受我們原來的提議，或者放棄達成集體互助協議的想法。"
 NSB_soviet_policies_of_collective_security_tt: "如果[POL.GetAdjective]政府同意，[POL.GetNameDef]將與[FROM.GetNameDef]和[ROOT.GetNameDef]一起被納入互助的集體協議。"
 NSB_soviet_policies_of_collective_security_poland_included_effects_from_tt: "[SOV.GetFlag]§Y[SOV.GetNameDefCap]§!，[ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§!和[FROM.GetFlag]§Y[FROM.GetNameDefCap]§!將放棄對彼此的任何領土要求或宣戰理由，簽署互不侵犯條約並保障彼此的獨立。"
 NSB_soviet_policies_of_collective_security_poland_included_effects_root_tt: "[SOV.GetFlag]§Y[SOV.GetNameDefCap]§!，[ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§!和[POL.GetFlag]§Y[POL.GetNameDefCap]§!將放棄對彼此的任何領土要求或宣戰理由，簽署互不侵犯條約並保障彼此的獨立。"
 NSB_soviet_comecon.1.t: "[FROM.GetAdjective]在[ROOT.GetNameDef]的工業化計劃"
 NSB_soviet_comecon.1.desc: "作為經互會經濟發展計劃的一部分，[FROM.GetAdjective]政府已經開始對我國經濟進行投資。這將使我們的經濟在未來幾個月內大幅增長。"
 NSB_soviet_comecon.1.a: "這就是互助的實踐！"
 NSB_soviet_comecon.2.t: "[FROM.GetAdjective]為經互會成員國提供軍事發展項目"
 NSB_soviet_comecon.2.desc: "[FROM.GetAdjective]政府已經決定進行一系列廣泛的演習和訓練。這將提高我們的軍事能力，並使我們能夠與其他盟友並肩作戰。我們應該利用從這些演習中獲得的經驗來進行任何必要的軍事改革。"
 NSB_soviet_comecon.2.a: "我們會準備好與你們一同戰鬥的，同志們！"
 NSB_soviet_comecon_effect_duration_tt: "此效果將持續§Y180§!日，在此之後，我們的民族精神的效果將與此效果被激活前一致。"
 NSB_soviet_spanish_civil_war.1.t: "[?SOV.SOV_spanish_general.GetName]加入[ROOT.GetNameDef]"
 NSB_soviet_spanish_civil_war.1.desc: "一艘輪船於昨天抵達了喀琅施塔得，帶來了那些因為他們的政府即將在內戰中垮臺而逃離西班牙的難民們。他們被我們由[ROOT.Capital.GetName]派來的代表團接納，並得到了來自代表團的關愛。這群人大部分是孩子，不過也有一些西班牙的政客與軍事人員。在這群人中。偉大的共產主義鬥士[?SOV.SOV_spanish_general.GetName]與我們的代表進行了一場談話。這位前西班牙軍官聲稱，這群西班牙人來到[ROOT.GetNameDef]以治癒內戰的傷痕，併為解放西班牙人民的事業尋求支持。與此同時，他請求[ROOT.GetAdjective]能夠承認他的軍銜，並讓他繼續服役。這樣，他就可以繼續與法西斯主義和帝國主義作鬥爭了。"
 NSB_soviet_spanish_civil_war.1.a: "我們歡迎所有來自西班牙的難民們。"
 NSB_soviet_spanish_civil_war.2.t: "國際馬克思主義縱隊抵達[ROOT.capital.GetName]"
 NSB_soviet_spanish_civil_war.2.desc: "來自蘇聯的支持者們已經在組織和動員數百名國際縱隊的成員。他們將會支持我們贏得戰爭的正義事業，確保革命事業不會屈服。這些勇敢的國際無產階級與農民階級的成員們已經準備好為這場對法西斯與資產階級的戰爭獻出生命了。"
 NSB_soviet_spanish_civil_war.2.a: "這就是世界革命的開始！"
 NSB_soviet_spanish_civil_war.3.t: "蘇聯突擊隊到達[ROOT.capital.GetName]"
 NSB_soviet_spanish_civil_war.3.desc: "蘇聯反斯大林突擊隊已經秘密抵達巴塞羅那，同時抵達還有一些訓練有素的特工和同情我們事業的幹員。據我們在蘇聯的聯繫人說，這些增援部隊使我們得以組建精銳部隊以用來突破敵人的防線或阻止敵人的進攻，並將熟練的特工和軍官納入我們的指揮系統。"
 NSB_soviet_spanish_civil_war.3.a: "我們會好好利用的。"
 NSB_soviet_spanish_civil_war.4.t: "蘇聯組織的群眾宣講"
 NSB_soviet_spanish_civil_war.4.desc: "蘇聯右翼反對派運動的富有魅力的成員與馬克思主義統一工人黨、全國勞工聯盟以及伊比利亞安那其聯合會的地方演說家一起開展了鼓動群眾的運動，以點燃[ROOT.GetNameDef]的無產者和農民群眾的革命熱情。在全國各地激情四射的演講中，群眾形成了強烈的階級意識，而且現在比以往任何時候都更願意投身於無產階級的革命事業。"
 NSB_soviet_spanish_civil_war.4.a: "團結起來，我們必勝！"
 NSB_soviet_spanish_civil_war.5.t: "蘇聯特工潛入斯大林派指揮部"
 NSB_soviet_spanish_civil_war.5.desc: "最近有一批新的蘇聯軍事參謀和顧問抵達西班牙，協助資產階級共和政府。\n在這批人中，有幾個蘇聯內部反斯大林派的特工作為[FROM.GetLeader]派來的軍事顧問的助手潛入了西班牙境內。\n這些特工聯繫並招募了許多官員、士兵、國際縱隊戰士和同情馬統工黨的民兵，他們目前正在資產階級共和軍的部隊中作戰，形成了一個令人印象深刻的線人網絡，使我們能夠掌握關於敵人指揮系統及其計劃的第一手資料。"
 NSB_soviet_spanish_civil_war.5.a: "最後的鬥爭來臨了！"
 NSB_soviet_spanish_civil_war.6.t: "西班牙革命大獲全勝"
 NSB_soviet_spanish_civil_war.6.desc_1: "一封[SPC.GetLeader]的親筆信在今早已送抵至我們組織。在信中，西班牙領導人稱西班牙人民將決不會忘記來自真正的蘇聯革命者們的支援，而且當我們不得不面對兇殘的斯大林主義怪獸時，我們明白馬統工黨將會傾其一切，幫助蘇聯人民為自由和真正的革命而戰。"
 NSB_soviet_spanish_civil_war.6.desc_2: "在擊敗西班牙法西斯和資產階級敵人並知道蘇聯人民與反革命的斯大林主義作鬥爭的情況後，馬統工黨組織了一起令人印象深刻的行動，派出大量志願軍部隊馳援我方總部。這些勇敢的男女戰士不僅來自西班牙，也來自世界各地，其中大多數是西班牙內戰的熟練老兵，他們的經驗和技能可讓蘇聯內戰勝利的天平向我方傾斜。"
 NSB_soviet_spanish_civil_war.6.a: "革命也將在俄羅斯成功！"
 NSB_soviet_spanish_civil_war.6.b: "不革命，毋寧死！"
 SOV_poum_aid_in_case_of_civil_War_tt: "西班牙馬統工黨將組織各種志願部隊，在對抗[ROOT.GetLeader]和斯大林教條的內戰爆發時支援我們。"
 NSB_soviet_planned_economy.1.t: "[SOV.GetAdjective]計劃經濟方案"
 NSB_soviet_planned_economy.1.desc: "[SOV.GetLeader]宣佈了他建立聯合計劃經濟體的方案。\n[FROM.GetAdjective]政府認為新經濟政策雖然略有瑕疵，但也同樣取得了許多成就。現在，它決心建立計劃經濟模式，在[FROM.GetNameDef]與其合作伙伴之間建立更緊密的經濟聯繫，為建立一個完全社會主義的社會鋪平道路。"
 NSB_soviet_planned_economy.1.a: "我們必須遵從。"
 nsb_news.100.desc: "曾經是弗拉基米爾·伊里奇·列寧的副手和繼承人的列夫·托洛茨基今天在家中遭到了一個武裝團伙的襲擊，他們對他的別墅進行了突襲。襲擊者衝進這位老布爾什維克所在的房間，立即開火，然後匆匆消失。他們留下了身負重傷的托洛茨基，幾小時後他在墨西哥城的一家醫院裡去世。\n\n\n托洛茨基在與$SOV_iosif_stalin$及其盟友爭奪蘇聯共產黨控制權的權力鬥爭中失敗後，於三十年代流亡國外，先後生活在土耳其、法國和挪威，最後定居在墨西哥。在此期間，他仍然長期批判斯大林並且認為蘇聯如今已經是個“墮落的‘工人’國家”。"
 nsb_news.101.desc: "老布爾什維克列夫·托洛茨基今天在家中遭到一夥武裝分子的襲擊，他們對他的別墅進行了搜查。襲擊者衝進他所在的房間，毫無目標地瘋狂射擊，然後匆匆消失，只留下設法與妻子和孫子躲在床後但毫髮無傷的托洛茨基。\n\n曾經是弗拉基米爾·伊里奇·列寧的頭號副手和假定繼承人，但在一場失敗的權力鬥爭後，他被迫被$SOV_iosif_stalin$驅逐出蘇聯。托洛茨基在接受媒體採訪時譴責了刺殺他的企圖，“這是斯大林策劃的又一個懦弱的陰謀，目的是讓批評他的人閉嘴。”"
 nsb_news.102.t: "[SOV.GetAdjective]-[SOV_collective_security_pact_integrant.GetAdjective][GetPolandIncludedOrNot]條約"
 nsb_news.102.desc_default: "一份[SOV.GetNameDef]和[SOV_collective_security_pact_integrant.GetNameDef]之間的互助條約，於[SOV.Capital.GetCapitalVictoryPointName]昨天被兩國外交官所簽署。\n\n該協議的集體安全部分由[SOV.GetAdjective]人民外交委員[SOV.SOV_maksim_litvinov.GetName]所提出。根據此條約，[SOV.GetNameDef]和[SOV_collective_security_pact_integrant.GetNameDef]已承諾在敵對勢力侵略時保護彼此。"
 nsb_news.102.desc_poland: "昨天，[SOV.GetNameDef]、[SOV_collective_security_pact_integrant.GetNameDef]和[POL.GetNameDef]三國的外交官在[SOV.Capital.GetCapitalVictoryPointName]簽署了一項互助協議。\n\n該協議是[SOV.GetAdjective]外交事務人民委員[SOV.SOV_maksim_litvinov.GetName]提議的集體安全政策的一部分。根據該條約，[SOV.GetNameDef]、[SOV_collective_security_pact_integrant.GetNameDef]和[POL.GetNameDef]已經放棄了它們之間的任何領土要求，並承諾在敵對勢力的侵略中相互保衛對方。"
 nsb_news.102.a: "真是個奇怪的同盟…"
 nsb_news.102.b: "為了我們共同的安全。"
 SOV_collective_security_news_poland_included: "-[POL.GetAdjective]"
 SOV_collective_security_news_poland_no: ""
 nsb_news.103.t: "[SOV.GetAdjective]-[GER.GetAdjective]貿易協定"
 nsb_news.103.desc: "[SOV.GetNameDef]和[GER.GetNameDef]之間簽署了一項商業協議。通過這項協議，[SOV.GetAdjective]方面尋求促進其工業發展和軍事研究水平，而[GER.GetAdjective]方面則尋求進口急需的原材料，如穀物、石油和鐵礦。"
 nsb_news.103.a: "這將對[ROOT.GetNameDef]大有益處。"
 nsb_news.103.b: "這又能持續多久？"
 nsb_news.104.t: "英國-[SOV.GetAdjective]入侵[PER.GetName]"
 nsb_news.104.desc: "經過數週的計劃之後，[ENG.GetNameDef]和[SOV.GetNameDef]在[PER.GetName]發起了一次聯合軍事行動，目的是迅速佔領寡不敵眾、技術落後的敵方。據[ENG.GetLeader]稱，這次行動將使他們能夠確保[PER.GetAdjective]油田和[ENG.GetAdjective]對[SOV.GetNameDef]的物資供應線，同時也能夠防止敵人從[TUR.GetNameDef]通過[PER.GetName]向巴庫油田和[RAJ.GetNameDef]進軍。"
 nsb_news.104.a: "一個必要的措施。"
 nsb_news.104.b: "[ENG.GetLeader]和[SOV.GetLeader]野心的又一個犧牲品。"
 nsb_news.104.c: "這不公平……"
 NSB_Soviet_fascist_civil_war.001.t: "[GetSovietCivilWarName]爆發！"
 NSB_Soviet_fascist_civil_war.001.desc: "紙上談兵的階段結束了。反對共產主義者的武裝鬥爭已經復興了。一個委員會已經成立，他們將在戰爭期間負責領導我們。這一次我們將戰至最後一人。俄羅斯帝國的復興已勝利在望！"
 NSB_Soviet_fascist_civil_war.001.a: "拿起武器！"
 NSB_Soviet_fascist_civil_war.002.t: "徵兵工作已準備就緒"
 NSB_Soviet_fascist_civil_war.002.desc: "松本師團已經就緒，隨時準備起兵反抗共產主義壓迫者。"
 NSB_Soviet_fascist_civil_war.002.a: "完美。"
 NSB_Soviet_fascist_civil_war.003.t: "$SOV_grigory_semyonov$離開了[ROOT.GetName]"
 NSB_Soviet_fascist_civil_war.003.desc: "俄國內戰再次爆發了。逃離蘇俄後一直居住在這裡的$SOV_grigory_semyonov$決定再次離開[ROOT.GetName]，投身[SOV.GetNameDef]的偉大反共鬥爭。"
 NSB_Soviet_fascist_civil_war.003.a: "我想，他不去不行啊…"
 NSB_soviet_communist_civil_war.001.t: "[GetSovietCivilWarName]"
 NSB_soviet_communist_civil_war.001.desc: "同志們，又到了我們扛起紅旗，為革命而戰的時候了。在解放全世界的無產階級之前，我們必須先奪回[ROOT.GetNameDef]。正如我們曾經擊敗過白匪軍那樣，就在祖國的大地上，我們現在要將所有擋在真正革命道路上的敵人統統消滅。\n我們必須決定由誰來領導我們進行這場鬥爭。"
 NSB_soviet_communist_civil_war.001.a: "托洛茨基一直都是斯大林的死對頭。"
 NSB_soviet_communist_civil_war.001.b: "斯米爾諾夫會領導人民走向勝利。"
 NSB_soviet_communist_civil_war.001.c: "我們得找個帶兵打過仗的當領導人。"
 NSB_soviet_communist_civil_war.001.d: "季諾維也夫是天生的領袖。"
 NSB_soviet_communist_civil_war.001.e: "加米涅夫當個名譽領袖挺合適的。"
 NSB_soviet_communist_civil_war.002.t: "紅軍逮捕貝利亞"
 NSB_soviet_communist_civil_war.002.desc: "$SOV_lavrenty_beriya$已經被紅軍軍官逮捕，目前正在監禁中等待審判。紅軍部隊開進了首都，鎮壓了其殘黨暴動，而對貝利亞心腹的抓捕也在進行當中。是時候為[ROOT.GetNameDef]選出一位新的領導人了。"
 NSB_soviet_communist_civil_war.002.a: "布哈林是最佳人選。"
 NSB_soviet_communist_civil_war.002.b: "應該讓李可夫來。"
 NSB_soviet_communist_civil_war.002.c: "誰能讓部隊聽命於他，這個位置就是誰的。"
 NSB_soviet_communist_civil_war.002.d: "季諾維也夫是天生的領袖。"
 NSB_soviet_communist_civil_war.002.e: "加米涅夫當個名譽領袖挺合適的。"
 NSB_soviet_communist_civil_war.003.t: "[GetSovietCivilWarName]"
 NSB_soviet_communist_civil_war.003.desc: "戰火又一次燒到了我們的頭上。我們必須拿起武器，反抗禍亂國家的獨裁者。斯大林已經在蘇聯倒行逆施太久了。落至這般境地實為下下之策，但我們已然別無選擇。"
 NSB_soviet_communist_civil_war.003.a: "布哈林將領導我們。"
 NSB_soviet_communist_civil_war.003.b: "人民會跟著李可夫走。"
 NSB_soviet_communist_civil_war.003.c: "我們得找個帶兵打過仗的當領導人。"
 NSB_soviet_communist_civil_war.003.d: "季諾維也夫是天生的領袖。"
 NSB_soviet_communist_civil_war.003.e: "加米涅夫當個名譽領袖挺合適的。"
 NSB_soviet_communist_civil_war.004.t: "號召國際革命縱隊"
 NSB_soviet_communist_civil_war.004.desc: "[FROM.GetLeader]號召志願者加入對抗[SOS.GetLeader]的鬥爭。這一號召已經得到了數個組織的響應，國際縱隊的成立也已在籌備當中。"
 NSB_soviet_communist_civil_war.004.a: "值得鼓勵。"
 NSB_soviet_communist_civil_war.004.b: "不能讓他們來！"
 NSB_soviet_communist_civil_war.004.c: "哦。"
 NSB_soviet_communist_civil_war.005.t: "國際縱隊抵達"
 NSB_soviet_communist_civil_war.005.desc: "世界各地的革命者紛紛趕來，對抗真正革命的敵人。由志願者組成的國際縱隊正在籌備當中，不久就能投入前線，與[ROOT.GetNameDef]的敵人作戰。"
 NSB_soviet_communist_civil_war.005.a: "濃墨重彩的一筆。"
 NSB_soviet_communist_civil_war.006.t: "[?SOV_uprising_state.GetName]的民眾抗議"
 NSB_soviet_communist_civil_war.006.desc: "[?SOV_uprising_state.GetName]的工人們紛紛走上街頭，聚集成了遊行示威。他們主要要求提高工會的影響力，但也夾雜了別的口號和標語來表達各樣訴求。甚至有報告說，他們公然喊出了反斯大林的口號。"
 NSB_soviet_communist_civil_war.006.a: "讓他們抗議去吧。"
 NSB_soviet_communist_civil_war.006.b: "必須在事態失控之前加以制止。"
 NSB_soviet_communist_civil_war.008.t: "斯大林躲過了暗殺"
 NSB_soviet_communist_civil_war.008.desc: "斯大林最近遭遇了一次未遂刺殺。一名槍手闖入了斯大林的鄉間別墅，但他還沒來得及進入總書記的房間就被發現了。這名刺客被斯大林的警衛當場擊斃。現在首都謠言四起，民眾紛紛議論究竟誰才是幕後黑手。"
 NSB_soviet_communist_civil_war.008.a: "接下來會很難收場的。"
 NSB_soviet_communist_civil_war.009.t: "斯大林之死"
 NSB_soviet_communist_civil_war.009.desc: "[SOV.GetNameDef]公認的領袖，$SOV_iosif_stalin$，被一名未知身份的刺客所殺。很顯然，當[SOV.GetNameDef]的領導人被暗殺時，他正孤身一人在他的鄉間別墅裡。\n由斯大林的繼承人，備受唾棄的$SOV_lavrenty_beriya$所領導的三駕馬車，已經接管了這個國家。然而，局勢仍未完全穩定，[SOV.GetNameDef]的前途命運也尚未可知。"
 NSB_soviet_communist_civil_war.009.a: "好戲還在後頭。"
 NSB_soviet_communist_civil_war.010.t: "[?SOS.SOV_general_to_desert.GetName]叛變"
 NSB_soviet_communist_civil_war.010.desc: "由於不滿斯大林對自己的待遇，[?SOS.SOV_general_to_desert.GetName]決定棄暗投明，加入我們正義的鬥爭。他麾下的一小部分部隊也拋棄了[SOS.GetLeader]，選擇追隨他們的將軍。"
 NSB_soviet_communist_civil_war.010.a: "熱烈歡迎！"
 NSB_soviet_civil_war_common.001.t: "內戰勝利"
 NSB_soviet_civil_war_common.001.desc_left: "反抗斯大林的戰爭終於結束了。在[ROOT.GetLeader]的英明領導下，我們成功推翻了獨裁者。\n是時候重新燃起革命的烈焰，啟程解放全世界的工人階級了。"
 NSB_soviet_civil_war_common.001.desc_right_concessions: "在[ROOT.GetLeader]的領導下，我們贏得了戰爭。現在該重建國家、重整制度了。我們為取得勝利不惜一切，而我們也確實大獲全勝，儘管傷亡慘重。不僅無數士兵英勇犧牲，而且我們還背下了一大筆債務。只有償還了我們欠下的債，歷史才能翻過這沉重的一頁。"
 NSB_soviet_civil_war_common.001.desc_right_no_concessions: "我們凱旋而歸的軍隊從克里姆林宮前列隊經過，勝利屬於我們！\n今天，[ROOT.GetNameDef]將迎來一個新的時代。在[ROOT.GetLeader]的領導下，我們不僅要重建國家，還要將它建設得比以往任何時候都更加強大。"
 NSB_soviet_civil_war_common.001.desc_exiles: "隨著我們的軍隊勝利開進首都，共產黨政權已經徹底崩潰。人民終於從紅色暴君的枷鎖中解放了出來。在經歷了兩次內戰和戰間期的多年亂政之後，一個嶄新的俄羅斯將會從廢墟中崛起。"
 NSB_soviet_civil_war_common.001.a: "是時候向前看了。"
 NSB_soviet_civil_war_common.002.t: "[ROOT.GetNameDef]的首都"
 NSB_soviet_civil_war_common.002.desc: "戰爭已經結束。是時候決定我國未來的首都了。"
 NSB_soviet_civil_war_common.002.a: "莫斯科一直是最重要的城市。"
 NSB_soviet_civil_war_common.002.b: "列寧格勒打響了革命第一槍。"
 NSB_soviet_civil_war_common.002.c: "那必須是彼得格勒。"
 NSB_soviet_civil_war_common.002.d: "還是[?SOV_civil_war_start_state.GetName]吧。"
 NSB_soviet_civil_war_common.002.e: "符拉迪沃斯托克將會是新的東方之都。"
 NSB_soviet_civil_war_common.002.f: "聖彼得堡曾是帝國的首都。"
 SOV_petrograd: "彼得格勒"
 SOV_StPetersburg: "聖彼得堡"
 NSB_soviet_civil_war_common.003.t: "[ROOT.GetLeader]動員軍隊"
 NSB_soviet_civil_war_common.003.desc: "我們的行動暴露了。[ROOT.GetLeader]動員了紅軍和內務人民委員部，開始抓捕任何他們懷疑陰謀顛覆國家的對象。如果我們再不行動起來，先前的一切努力都將付諸東流。"
 NSB_soviet_civil_war_common.003.a: "那麼，開戰吧。"
 NSB_soviet_civil_war_common.006.t: "游擊隊加入起義隊伍"
 NSB_soviet_civil_war_common.006.desc: "[SOS.GetLeader]對國家的掌控開始崩解。在[SOS.GetNameDef]境內各處，都有人民揭竿而起，反抗[SOS.GetLeader]的暴政。即將成立的游擊隊將會助我們一臂之力。"
 NSB_soviet_civil_war_common.006.a: "很好。"
 SOV_popular_uprising_units_tt: "游擊隊加入[ROOT.GetNameDef]"
 NSB_soviet_civil_war_common.010.t: "去斯大林化"
 NSB_soviet_civil_war_common.010_right_opposition: "獨裁者倒臺了。我們應當破除對斯大林的個人崇拜，摧毀他剩餘的追隨者所珍視的偶像，並向告訴人們，舊時代已不復存在。我們必須移除掉紀念碑並重命名各個城市。也許斯大林最珍重的掌上明珠是斯大林格勒城。"
 NSB_soviet_civil_war_common.010_left_opposition: "革命勝利了，獨裁者倒臺了，無產階級又一次統治了國家。斯大林的邪門歪道必須被終結，一切符號都必須去除。以斯大林及其追隨者命名的城市需要改為更合適的名稱，對於斯大林格勒來說尤其如此。"
 NSB_soviet_civil_war_common.010_exiles: "布爾什維克試圖將國教改宗為共產主義，並圍繞其領導人建立個人崇拜。他們甚至把俄羅斯的城市改了一遍名字。全帝國的秩序必須恢復，把斯大林格勒改回察裡津十分適合作為這一運動的起點。"
 NSB_soviet_civil_war_common.010.a: "伏爾加格勒是個合適的名字。"
 NSB_soviet_civil_war_common.010.b: "察裡津，必須是察裡津。"
 NSB_soviet_civil_war_common.010.c: "托洛茨基才是真正的革命英雄。"
 NSB_soviet_civil_war_common.010.d: "我們得紀念一下布哈林。"
