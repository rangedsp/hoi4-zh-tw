 RAJ_ammunition_factories_shortcut: "彈藥廠"
 RAJ_recruitment_shortcut: "徵募"
 RAJ_navy_shortcut: "印度海軍"
 RAJ_airforce_shortcut: "印度空軍"
 RAJ_constitution_for_the_masses: "大眾憲法"
 RAJ_constitution_for_the_masses_desc: "人民共和國不能依靠舊帝國的法律而存續。\n我們必須起草一部反映工人、農民和無地者意志的新憲法，而非君主或殖民官僚的傲慢。"
 RAJ_founding_of_the_peoples_republic: "人民共和國的建立"
 RAJ_founding_of_the_peoples_republic_desc: "我們已推翻舊秩序。\n現在，任務是建設新秩序——由人民締造，為人民服務，並由革命維繫。"
 RAJ_agrarian_socialism: "農業社會主義"
 RAJ_agrarian_socialism_desc: "革命從田野開始。\n把土地歸還耕作者，讓鄉村以平等與正義的名義實現自我治理。"
 RAJ_urban_industrialism: "城市工業化"
 RAJ_urban_industrialism_desc: "未來不在牧場，而在工廠。\n唯有快速推進工業發展，我們才能鞏固革命併為未來的戰鬥做好準備。"
 RAJ_urban_industrialism_tt: "這將使五年計劃更偏重於工業擴張，給予§G+10%§!建設速度。"
 RAJ_urban_industrialism_tt2: "這將使五年計劃更偏向農業社會主義，效果為："
 RAJ_land_of_the_tillers: "耕者之地"
 RAJ_land_of_the_tillers_desc: "地主雖已不復存在，但鬥爭仍在繼續。\n我們將重新分配土地，徹底剷除封建的最後枷鎖——一塊地、一座村，一步步地推進。"
 RAJ_focus_on_the_countryside: "聚焦鄉村"
 RAJ_focus_on_the_countryside_desc: "我們的力量在於數以百萬計居於土地之上的人民。\n我們要投資他們、武裝他們、組織他們——革命屬於鄉村。"
 RAJ_decentralize_the_party: "黨權下放"
 RAJ_decentralize_the_party_desc: "權力不應只流自因陀羅普羅斯陀辦公室。\n讓人民通過地方委員會和農村蘇維埃引導革命。"
 RAJ_industrialize_the_ganges: "恆河工業化"
 RAJ_industrialize_the_ganges_desc: "恆河養育了我們數百年。\n如今，它將為我們的機器提供動力、為爐火提供燃料、為軍隊提供武器。"
 RAJ_comrades_of_the_city: "城市裡的同志"
 RAJ_comrades_of_the_city_desc: "城市工人是革命的先鋒。\n通過教育、工具與團結，他們將引領共和國走向現代化。"
 RAJ_central_comittee_authority: "中央委員會權威"
 RAJ_central_comittee_authority_desc: "紀律即力量。\n中央委員會將監督治理的各個方面，確保革命不至於滑向混亂。"
 RAJ_reorganize_the_five_year_plan_towards_heavy_industry: "調整五年計劃方向"
 RAJ_reorganize_the_five_year_plan_towards_heavy_industry_desc: "當前的工業化進度不夠。\n若要保衛革命，我們必須優先發展重工業與鋼鐵生產。"
 RAJ_invite_soviet_industrial_experts: "邀請蘇聯工業專家"
 RAJ_invite_soviet_industrial_experts_desc: "蘇聯擁有從零建立工業基礎的經驗。\n讓我們學習他們的模式，加快自身的轉型進程。"
 RAJ_planned_economy2: "鞏固計劃經濟"
 RAJ_planned_economy2_desc: "革命中不容市場存在。\n每一項資源、每一位勞動者、每一家工廠都必須服務於五年計劃。"
 RAJ_the_red_curtain_falls_over_asia: "紅色的帷幕落在亞洲"
 RAJ_the_red_curtain_falls_over_asia_desc: "我們已確保祖國安寧，\n現在，是時候通過言語、傳單，或是槍炮，將革命的火種傳至鄰國。"
 RAJ_the_red_curtain_falls_over_asia_desc_tt: "解鎖決議在亞洲傳播共產主義革命"
 RAJ_red_punjab_operation: "紅色旁遮普行動"
 RAJ_red_punjab_operation_desc: "我們的首都容易受到外敵攻擊。我們必須擴大它的安全區"
 RAJ_secure_rajahsthan: "控制拉賈斯坦"
 RAJ_secure_rajahsthan_desc: "拉賈斯坦的沙漠絕不能成為反革命的基地。\n我們必須將此邦納入我們的掌控。"
 RAJ_strike_eastern_pakistan: "進攻東巴基斯坦"
 RAJ_strike_eastern_pakistan_desc: "[PAK.GetName]的東翼孤立且局勢不穩。\n趁他們尚未站穩腳跟，現在是發起打擊的最佳時機。"
 RAJ_mass_assault: "人海突擊"
 RAJ_defenders_of_the_revolution_idea_tt: "獲得科技：§Y革命人海突擊§!。"
 revolutionary_mass_assault: "革命人海突擊"
 RAJ_arm_the_peasantry: "武裝農民"
 RAJ_arm_the_peasantry_desc: "革命必須深入到每一塊田地。\n我們將向忠誠的農村民兵發放武器，確保沒有一個村莊在反動勢力面前手無寸鐵。"
 RAJ_every_man_a_gun: "全民皆兵"
 RAJ_every_man_a_gun_desc: "在人民共和國中，每位公民都是戰士。\n我們將統一訓練標準，全面武裝人民，使整個國家自身成為一座堡壘。"
 RAJ_every_man_a_leader: "人人都是領袖"
 RAJ_every_man_a_leader_desc: "真正的革命力量源於主動而非命令。\n我們將訓練地方指揮官和民兵領袖，使他們能夠果斷行動，無需等待批准。"
 RAJ_defenders_of_the_revolution: "革命的捍衛者"
 RAJ_defenders_of_the_revolution_desc: "他們不是普通士兵，而是理念的守護者。\n我們將從最有紀律、最忠誠的戰士中組建一支精英部隊，保衛祖國與革命信仰。"
 RAJ_education_for_the_masses: "大眾教育"
 RAJ_education_for_the_masses_desc: "沒有知識，革命將淪為暴政。\n掃盲、政治教育與科學培訓將走進每個村莊和工廠。"
 RAJ_break_the_zamindars: "打倒柴明達爾"
 RAJ_break_the_zamindars_desc: "地主是舊政權的骨架。\n我們將拆毀他們的莊園，沒收他們的土地，將他們的權力化為烏有。"
 RAJ_planned_but_decentralized: "計劃經濟，但分權化"
 RAJ_planned_but_decentralized_desc: "我們將保留經濟計劃，但賦予地方集體自治權。\n效率來自意識形態，而非繁冗官僚。"
 RAJ_socialist_self_reliance: "社會主義自力更生"
 RAJ_socialist_self_reliance_desc: "我們不會依賴資本主義進口，也不依賴帝國主義顧問。\n印度將自給自足，自我武裝，必要時獨自抗爭。"
 RAJ_quality_training: "高質量訓練"
 RAJ_quality_training_desc: "單靠數量無法贏得戰爭。\n我們將統一訓練體系，提升軍官教學質量，提升軍隊專業化水平。"
 RAJ_iron_will_indoctrination: "鋼鐵意志灌輸"
 RAJ_iron_will_indoctrination_desc: "力量不僅來自身體，更源於信念。\n我們將向每位士兵灌輸絕對紀律、清晰的意識形態信仰與不可動搖的戰鬥意志。"
 RAJ_purge_the_reactionaries: "清洗反革命分子"
 RAJ_purge_the_reactionaries_desc: "我們絕不與舊世界妥協。\n革命的敵人、破壞分子與反革命分子都將被徹底剷除。"
 RAJ_stopping_the_japanese_threat_into_central_asia: "阻止日本威脅中亞"
 RAJ_stopping_the_japanese_threat_into_central_asia_desc: "日本的野心不僅止步於中國的疆域。他們的目光已轉向中亞，這可能成為其帝國擴張的新跳板。\n我們必須迅速行動，通過加強東部邊防，阻止侵略戰爭蔓延至草原及更遠的地方。"


