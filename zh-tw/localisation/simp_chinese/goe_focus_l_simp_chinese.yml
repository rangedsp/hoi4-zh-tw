 ################
 PER_clergy_upset_tt: "§R選擇此國策可能會激怒宗教界。如果穩定性下降到危險水平，你的國家可能爆發革命、引起內戰！§!"
 PER_clergy_happy_tt: "§G選擇此國策將安撫宗教界，他們將不再認為有反抗你的必要。§!"
 PER_clergy_revolt_tt: "§R選擇此國策將導致針對你的革命，使你陷入內戰！§!"
 PER_profit_from_war_tt: "解鎖決議§Y$PER_profit_from_war_category$§!，允許[PER.GetNonIdeologyName]將資源開採權交給其他國家，同時獲得一個離岸工廠。"
 PER_add_panzer_leader_trait_tt: "§Y兩名§!隨機選擇的陸軍將領獲得特質裝甲指揮官。"
 PER_add_organizer_trait_tt: "§Y兩名§!隨機選擇的陸軍將領獲得特質組織者。"
 PER_expand_imperial_guard_tt: "解鎖師編制§Y伊朗帝國衛隊§!，並在§Y[ROOT.capital.GetCapitalVictoryPointName]§!招募§Y兩個§!單位。"
 PER_expand_immortal_legion_tt: "在§Y[ROOT.capital.GetCapitalVictoryPointName]§!招募§Y三§!支§Y不死軍§!單位。"
 PER_establish_immortal_legion_tt: "解鎖師編制§Y不死軍§!，並在§Y[ROOT.capital.GetCapitalVictoryPointName]§!招募§Y三個§!單位。"
 PER_naval_academy_random_admirals_tt: "最多§Y三名§!隨機選擇的海軍將領獲得§G+1§!協同技能。"
 PER_acceptance_tt: "§Y[SOU.GetNameDefCap]§!如果對我們有§G評價很高§!，更有可能接受我們的提議。"
 PER_acceptance_ger_tt: "§Y[GER.GetNameDefCap]§!如果對我們有§G評價很高§!，更有可能接受我們的提議。"
 PER_foothold_in_indus_tt: "將解鎖一個§Y事件鏈§!，§Y[PER.GetNameDefCap]§!和§Y[RAJ.GetNameDefCap]§!將就§Y俾路支斯坦§!的控制權進行談判。"
 PER_reintegrate_anatolia_tt: "解鎖決議§Y重新整合安納托利亞§!，允許我們將征服的領土整合到國家中。"
 PER_absorb_byzantines_tt: "解鎖決議§Y吸收拜占庭§!，允許我們將征服的領土整合到國家中。"
 PER_memphis_initiative_tt: "解鎖決議§Y孟斐斯計劃§!，允許我們將征服的領土整合到國家中。"
 PER_new_shah_tt: "§Y$PER_mohammed_reza_pahlavi$§!將成為§Y$PER_neutrality_party$§!的領導人。"
 PER_civil_unrest_tt: "§R選取該國策會開啟$PER_civil_unrest_category$的限時任務§!"
 PER_legacy_of_greatness_tt: "§Y$PER_legacy_of_greatness_modifier$§!追加效果："
 PER_shahbanu_tt: "觸發事件：§Y選擇沙阿巴努§!，允許你選擇一位可以作為§Y政治顧問§!的王后。"
 PER_imperial_excellency_tt: "完成國策§Y擴張帝國衛隊§!後，在§Y[ROOT.capital.GetCapitalVictoryPointName]§!招募§Y兩§!個§Y伊朗帝國衛隊§!單位。"
 PER_half_stability_tt: "§R我們的穩定度已降至50%以下！如果進一步降至20%以下，將面臨革命風險！§!"
 PER_address_the_issue_tt: "解鎖決議§Y伊斯蘭革命§!，你將有§R90天§!時間遏制革命勢力。"
 PER_rapid_appeasement_tt: "通過犧牲資源，我們暫時遏制了革命。"
 PER_islamic_revolution_tt: "觸發一場[PER.GetNameDef]與伊斯蘭革命者之間的§R內戰§!！"
 PER_trial_fifty_three_tt: "選擇此國策將導致任何§Y共產主義§!顧問被禁止進入政府。"
 PER_stand_with_giants_tt: "§Y$PER_stand_with_giants_modifier$§!追加效果："
 PER_negotiate_tt: "嘗試與敵人磋商§Y和平§!協議，這可能導致我們成為[ENG.GetFlag]§Y[ENG.GetNameDef]§!的§R傀儡§!；並失去部分領土，為[SOU.GetFlag]§Y[SOU.GetNameDef]§!所佔。"
 PER_treaty_of_tehran_tt: "將向[ENG.GetFlag]§Y[ENG.GetNameDef]§!和[SOV.GetFlag]§Y[SOV.GetNameDef]§!發送事件，要求他們撤軍並結束戰爭。"
 PER_strike_first_tt: "選擇此分支將§R阻止你§!採取更多§Y薩德阿巴德條約§!的相關國策。"
 PER_buffer_state_tt: "如果§Y和平§!被接受，[AZR.GetFlag]§Y[AZR.GetNameDef]§!、[GEO.GetFlag]§Y[GEO.GetNameDef]§!、[ARM.GetFlag]§Y[ARM.GetNameDef]§!和[TMS.GetFlag]§Y[TMS.GetNameDef]§!將作為[PER.GetFlag]§Y[PER.GetNameDef]§!的傀儡國被釋放。"
 PER_resistance_decisions_tt: "解鎖決議§Y種植抵抗§!，允許我們在鄰國製造不穩定因素，為入侵做準備。"
 PER_recruit_rebels_tt: "解鎖師編制§Y巴赫提亞里叛軍§!和§Y卡什加叛軍§!，並在§Y[ROOT.capital.GetCapitalVictoryPointName]§!分別招募§Y各兩個§!單位。"
 PER_white_peace_tt: "將向敵人發送§Y事件§!，要求§Y無條件和平§!，允許我們§Y保留先前擁有的領土§!。"
 PER_reparations_tt: "將向敵人發送§Y事件§!，要求§Y和平§!並支付§Y戰爭賠款§!，賠款形式包括§Y工廠§!和對侵略方施加§Y減益效果§!。如果敵國是§Y直接接壤的鄰國§!，他們將轉讓邊境領土給§Y我們§!。"
 PER_swear_fealty_tt: "將向敵人發送§Y事件§!，請求投降併成為他們的§Y傀儡國§!。此操作將解鎖一個§Y傀儡分支§!，讓我們決定接下來的行動"
 PER_push_negotiations_tt: "將向敵人發送§Y事件§!，提議向衝突發起方提供§Y資源開採權§!以換取§Y無條件和平§!。如果他們拒絕，我們將繼續戰爭。"
 PER_preemptive_invasion_of_iran_tt: "一旦[PER.GetNameDef]投降，我們將使該國成為傀儡國，整合邊境上的部分地區，並獲取[PER.GetAdjective]豐富石油資源的開採權。我們還可以請求[SOU.GetAdjective]的干預，以開展聯合行動。"
 PER_territory_demands_tt: "這將向目標國家發送要求，命令他們§Y交出§!邊境領土。如果我們的軍隊§Y更強大§!，他們更有可能接受我們的要求。"
 PER_reinstate_qajars_tt: "將觸發恢復卡扎爾王朝對[PER.GetNameDef]的統治的§Y事件§!鏈。"
 PER_republic_of_mahabad_tt: "會將[KUR.GetNameDef]釋放為§Y馬哈巴德共和國§!"
 ######################
 ##### INDUSTRIAL #####
 ######################
 PER_democratic_shortcut: "政治：\n民族陣線"
 PER_neutral_shortcut: "政治：\n巴列維王朝"
 PER_industry_shortcut: "經濟"
 PER_army_shortcut: "陸軍"
 PER_air_shortcut: "空軍"
 PER_navy_shortcut: "海軍"
 PER_fight_for_iran_shortcut: "爭奪伊朗"
 PER_modernizing_iran: "[ROOT.GetNonIdeologyName]現代化"
 PER_modernizing_iran_desc: "[ROOT.GetNonIdeologyName]長期以來被組織混亂和瑣碎的爭吵所阻礙。如果我們要建立一個經得起時間考驗的國家，我們必須學會自謀生路。讓我們在團結的基礎上創造未來，擁抱現代。"
 PER_adult_literacy: "成人掃盲運動"
 PER_adult_literacy_desc: "文盲問題嚴重困擾著我們的人民。讓人們能夠用自己的語言讀寫，將有助於賦權並解放他們。部長會議和教育部已聯合制定教育手冊，並承諾建立學校，為成人提供教育。"
 PER_national_museum: "開設國家博物館"
 PER_national_museum_desc: "記錄我們的歷史至關重要，特別是考慮到[ROOT.GetNonIdeologyName]在幾個世紀中編織出的豐富歷史畫卷。多年來一直有在德黑蘭建立博物館的計劃——現在是時候實現這一計劃了。"
 PER_foreign_schools: "接管外國人學校"
 PER_foreign_schools_desc: "在[PER.GetAdjective]土地上，散佈著大量外國擁有的學校。這些機構可能被視為我們領導層向外國勢力讓渡主權的象徵。我們應當將它們收歸國有，以促進國家發展。"
 PER_foreign_schools_bonus: "國有化外國人學校"
 PER_university_of_isfahan: "資助伊斯法罕大學"
 PER_university_of_isfahan_desc: "我們迫切需要新的教育機構，專注於培養新一代醫療專業人士。伊斯法罕大學有望成為[ROOT.GetNonIdeologyName]最先進的醫學院！"
 PER_university_of_isfahan_bonus: "已資助伊斯法罕大學"
 PER_shiraz_university: "資助設拉子大學"
 PER_shiraz_university_desc: "在資助新大學方面，我們的重點應是建立技術學校，希望其畢業生為一個現代化的[ROOT.GetNonIdeologyName]奠定基礎。"
 PER_shiraz_university_bonus: "已資助設拉子大學"
 PER_educational_reforms: "教育改革"
 PER_educational_reforms_desc: "我們已經啟動新的掃盲運動，建成了新的大學。我們實施新的教育改革的時機終於到來了，這些改革將有助於我們公民的社會進步和發展，並解決曾經教育機會不平等的問題。"
 PER_trans_iranian_railway: "伊朗縱貫鐵路"
 PER_trans_iranian_railway_desc: "1927年，我們開始建設一條全國性的鐵路網絡，即伊朗縱貫鐵路。如今，隨著[ROOT.GetNonIdeologyName]邁向現代化，我們必須加大投入，完成這一宏偉的工程。"
 PER_expand_tabriz_masshad: "塔布里茲-馬什哈德鐵路線"
 PER_expand_tabriz_masshad_desc: "我們必須繼續擴建伊朗縱貫鐵路，重點建設連接塔布里茲和馬什哈德的鐵路。"
 PER_expand_tehran_emam: "德黑蘭—沙赫普爾港鐵路線"
 PER_expand_tehran_emam_desc: "我們必須繼續擴建伊朗縱貫鐵路，重點建設連接德黑蘭和沙赫普爾港的鐵路。"
 PER_expand_tehran_abbas: "德黑蘭—阿巴斯港鐵路線"
 PER_expand_tehran_abbas_desc: "我們必須繼續擴建伊朗縱貫鐵路，重點建設連接德黑蘭和阿巴斯港的鐵路。"
 PER_trains_from_germany: "請求[GER.GetNonIdeologyName]提供火車"
 PER_trains_from_germany_desc: "在我們即將開通伊朗縱貫鐵路之際，我們需要火車來儘快使項目投入運營。我們在[GER.GetNonIdeologyName]有朋友，他們一定會很高興為我們的盛大開幕提供多餘的蒸汽機車。"
 PER_trains_from_britain: "請求[ENG.GetNonIdeologyName]提供火車"
 PER_trains_from_britain_desc: "在我們即將開通伊朗縱貫鐵路之際，我們需要火車來儘快使項目投入運營。由於[ENG.GetAdjective]在我們的原材料中有投資和股份，若他們提供蒸汽機車以支持鐵路開通，對兩國都有好處。"
 PER_feat_of_engineering: "工程壯舉"
 PER_feat_of_engineering_desc: "伊朗縱貫鐵路竣工的同時，我們也達成了特別的成就。我們的壯舉不僅因為其宏偉規模而令人讚歎，還歸功於克服[ROOT.GetNonIdeologyName]陡峭路線和山地地形的工程奇蹟。我們應該為政府和承包工程師共同完成的這一壯舉感到自豪。"
 PER_feat_of_engineering_bonus: "伊朗縱貫鐵路竣工"
 PER_white_revolution: "啟動白色革命"
 PER_white_revolution_desc: "[ROOT.GetNonIdeologyName]的現代化絕非易事。相反，這需要一系列大刀闊斧的改革來實現這一宏偉目標。我們將其稱為白色革命或國王與人民革命，它將使[PER.GetNameDef]躋身西方偉大國家之列。"
 PER_national_bank: "加強[ROOT.GetNonIdeologyName]國家銀行"
 PER_national_bank_desc: "在經濟上，我們相比西方競爭對手並不突出。雖然這是不幸的局面，但我們可以改變這一點。首先，我們必須加強[ROOT.GetNonIdeologyName]國家銀行，尤其使它覆蓋更多農村人口。"
 PER_price_stabilization: "價格穩定"
 PER_price_stabilization_desc: "隨著銀行的強化，我們現在必須開始一場反對不合理牟利的運動。我們可以對不遵守規定的工廠和連鎖企業的所有者進行罰款，並在[ROOT.GetNonIdeologyName]全國範圍內固定商品價格。"
 PER_abolish_feudalism: "廢除封建制度"
 PER_abolish_feudalism_desc: "多年來，[ROOT.GetNonIdeologyName]一直沿用封建制度，地主擁有大量土地，農村地區的農民在上面耕作。這是一種過時的制度，我們作為政府有責任從地主手中買下這些土地，並以更低的價格賣回給農民。這將有效地為我們相當一部分人口帶來自由。"
 PER_women_vote: "賦予女性投票權"
 PER_women_vote_desc: "目前，只有男性可以在政府事務中參與投票。由於女性約佔我們總人口的一半，我們應確保國家女性能夠發出自己的聲音。然而，我們應當謹慎行事，因為這可能導致宗教人士認為我們背棄了傳統。"
 PER_food_for_all: "確保每個[PER.GetAdjective]人的溫飽"
 PER_food_for_all_desc: "不幸的是，我們對饑荒並不陌生。隨著我們為改善經濟而進行的現代化努力，現在我們有機會改善糧食分配，確保每個[PER.GetAdjective]人的這一人類基本需求都能得到滿足。"
 PER_rapid_industrialization: "快速工業化"
 PER_rapid_industrialization_desc: "現代化等同於工業化。不可否認的是，我們必須迅速擴大工廠產量，才能達到當今世界其他強國的水準。"
 PER_tehran_power_plant: "在德黑蘭建立發電廠"
 PER_tehran_power_plant_desc: "隨著全國城市的不斷發展，我們必須確保它們能夠獲得足夠的電力供應。讓我們在德黑蘭建設一個新發電廠，將其作為發展我們最重要城市的關鍵一步。"
 PER_tehran_power_grid_bonus: "擴建德黑蘭電網"
 PER_develop_cities: "發展主要定居點"
 PER_develop_cities_desc: "目前，德黑蘭是[ROOT.GetNonIdeologyName]最發達的城市。如果我們要真正實現國家的現代化，就必須集中力量擴建主要城市的基礎設施。"
 PER_metropolitan_iran: "城市化的[ROOT.GetNonIdeologyName]"
 PER_metropolitan_iran_desc: "經過大規模的開發努力後，我們終於達到了一個里程碑，如今的[ROOT.GetNonIdeologyName]可以被認為是一個城市化的國家。我們的城市充滿了工業和生機，為未來的成功奠定了基礎。"
 PER_develop_oil_fields: "開發油田"
 PER_develop_oil_fields_desc: "為了進一步提升我們已經龐大的石油開採體系，我們最近發現了適合開採的新油源。工業部長認為，建設新的鑽井平臺有可能讓我們在這一珍貴資源上確立壟斷地位。"
 PER_form_oil_company: "成立我國自主的石油公司"
 PER_form_oil_company_desc: "長期以來，我國的油田被外部殖民勢力開採和控制。隨著我們獲得了新的石油儲備並擺脫外國影響，現在是時候成立[PER.GetAdjective]國家石油公司了。"
 PER_establish_opec: "成立石油輸出國組織"
 PER_establish_opec_desc: "隨著我們的石油工業全面建立，現在是時候與其他石油資源豐富的國家攜手合作，共同壟斷這一戰略資源了。與[IRQ.GetNameDef]、[SAU.GetNameDef]和[VEN.GetNameDef]洽談後，我們一致決定成立石油輸出國組織。"
 PER_opec: "石油輸出國組織"
 PER_oil_baron: "宣佈自己為石油大亨"
 PER_oil_baron_desc: "與其將我們的石油用於資助其他國家在全球範圍內發動的戰爭，不如將其留給我們自己使用。如果我們在[ROOT.GetNonIdeologyName]囤積石油，就能確保以高價出售給有需求的國家。"
 PER_profit_from_war: "從戰爭中獲利"
 PER_profit_from_war_desc: "戰爭意味著財富，而當前在全球範圍內肆虐的衝突是一個絕佳的賺錢機會。隨著技術的進步，參戰國需要更多石油來維持他們的戰爭機器。我們絕不能錯失這一良機。"
 PER_invite_oil_nations: "邀請產油國加入"
 PER_invite_oil_nations_desc: "石油輸出國組織迄今在全球石油市場創造利潤方面取得了成功，但我們有能力將組織規模進一步擴大。讓我們聯繫全球其他產油國，邀請他們加入石油輸出國組織，與我們攜手合作。"
 PER_deal_with_eitc: "與東印度公司達成協議"
 PER_deal_with_eitc_desc: "東邊的鄰國似乎忙得不可開交。[RAJ.GetNonIdeologyName]已重建東印度公司，成為一個覆蓋全國的超級公司。在石油壟斷問題上與他們及石油輸出國組織其他成員達成協議，將是明智之舉。"
 PER_a_modern_iran: "現代伊朗"
 PER_a_modern_iran_desc: "經過所有這些現代化努力之後，我們終於可以說，我們自豪而堅定地屹立在世界各國面前。"
 ################
 ##### ARMY #####
 ################
 PER_restructure_army: "重組軍隊"
 PER_restructure_army_desc: "經過與俄羅斯在卡扎爾王朝統治下的漫長戰爭，我們的軍隊已被削弱。在當今世界局勢下，讓我們的軍隊恢復昔日輝煌是明智之舉。"
 PER_expand_imperial_guard: "加強帝國衛隊"
 PER_expand_imperial_guard_desc: "作為[PER.GetNameDef]的新統治家族，沙阿家族需要最優秀的帝國衛隊。如果能妥善裝備並進行訓練，他們甚至可以加入前線作戰。"
 PER_expand_military_facilities: "擴建軍事設施"
 PER_expand_military_facilities_desc: "目前，我們生產武器的能力嚴重不足。我們應儘快擴建軍事設施，以確保重組後的軍隊能得到充分裝備並做好戰鬥準備。"
 PER_czech_tanks: "購買捷克坦克生產許可"
 PER_czech_tanks_desc: "在設計和生產自己的機械化部隊之前，我們應向以坦克生產聞名的國家取經。通過與[CZE.GetNameDef]洽談，我們可以獲得其著名的斯柯達工廠的坦克生產許可。"
 PER_german_tanks: "購買德國坦克生產許可"
 PER_german_tanks_desc: "在設計和生產自己的機械化部隊之前，我們應向以坦克生產聞名的國家取經。通過與[GER.GetNameDef]洽談，我們可以生產威力強大的坦克，這些坦克能如熱刀切黃油般衝破敵軍防線。"
 PER_reverse_engineer_tanks: "逆向工程外國坦克"
 PER_reverse_engineer_tanks_desc: "通過深入研究我們從外國力量處獲得並生產的坦克，我們可以瞭解它們的工作原理，併為未來設計自己的坦克鋪平道路。這是[PER.GetNonIdeologyName]自主研發坦克設計的第一步。"
 PER_establish_tehran_armor: "成立德黑蘭裝甲公司"
 PER_establish_tehran_armor_desc: "是時候建立我們自己的坦克製造公司了。德黑蘭裝甲公司正式成立，並宣佈由政府提供補貼以助其發展。"
 PER_expand_tehran_armor: "擴建德黑蘭裝甲公司設施"
 PER_expand_tehran_armor_desc: "隨著德黑蘭裝甲公司為我們的戰爭努力生產新型坦克設計，迅速擴展其生產設施將是明智之舉。通過為裝甲設備建設更多生產線，我們能夠更快地將坦克投入戰場。"
 PER_future_of_war: "戰爭的未來"
 PER_future_of_war_desc: "僅僅幾十年前，戰爭仍以步兵和騎兵為主，並依賴簡單的炮兵和老式戰術。而在現代，坦克的時代已經來臨。我們必須緊跟軍事技術的進步，才能抵禦威脅我們的敵對力量。"
 PER_train_tank_commanders: "訓練坦克指揮官"
 PER_train_tank_commanders_desc: "為了最大限度地發揮坦克師的效用，它們必須由能力出眾的指揮官領導。為此，我們必須準備將軍隊指揮官送回訓練營，學習如何有效整合坦克作戰策略。"
 PER_military_excellency: "[PER.GetAdjective]的卓越軍事"
 PER_military_excellency_desc: "優秀的軍隊必然由訓練有素的士兵組成。通過嚴格的學校教育、優良的裝備和無懈可擊的戰術，我們將向世界證明，[PER.GetAdjective]陸軍是一支不可忽視的力量。"
 PER_foreign_retraining: "外國再培訓計劃"
 PER_foreign_retraining_desc: "目前我們的軍隊訓練不足且組織混亂。為了提高軍隊的整體素質，邀請外國專家前來[PER.GetNonIdeologyName]訓練我們的士兵將是明智之舉。這將迅速使他們為戰鬥做好準備。"
 PER_bolster_infantry: "加強步兵"
 PER_bolster_infantry_desc: "作為軍隊的重要組成部分，普通步兵長期以來一直是軍隊的中流砥柱。我們應加強步兵，確保他們保持良好的狀態和自豪感。"
 PER_swedish_artillery: "從[SWE.GetNameDef]獲取火炮生產許可"
 PER_swedish_artillery_desc: "[SWE.GetAdjective]已開發出強大的火炮，我們若能將其納入軍隊將大有裨益。我們應聯繫這個北歐國家，嘗試達成許可協議，讓我們開始自行生產火炮裝備。"
 PER_establish_motor_arms: "建立機動武器工業"
 PER_establish_motor_arms_desc: "為了更好地支援步兵，我們應著手生產各類車輛，以確保他們能夠更高效地穿越戰場。通過建立此類裝備的工業，我們為武裝部隊的現代化做好了準備。"
 PER_motorize_infantry: "摩托化步兵"
 PER_motorize_infantry_desc: "為了跟上時代步伐，我們必須對常規部隊進行機械化改造，讓他們能與坦克協同作戰，同時得到保護並隨時準備打擊敵軍。"
 PER_increase_heavy_arms: "擴建重型武器設施"
 PER_increase_heavy_arms_desc: "隨著軍隊規模的擴大，我們對生產重型機械的設施需求也在增加。這不僅為我們研發自己的火炮設計提供了可能，也使我們無需依賴外國支持，從而根據火炮戰術調整戰鬥計劃。"
 PER_our_own_artillery: "研發自主火炮"
 PER_our_own_artillery_desc: "現在我們已具備足夠的設施來有效設計和製造各種支援火炮。這使我們不再需要依賴貿易來增強軍隊實力。我們的新型火炮將讓敵軍陷入火海，並確保我們在任何衝突中都能堅守陣地。"
 PER_develop_qorkhaneh: "開發戈爾哈內赫"
 PER_develop_qorkhaneh_desc: "戈爾哈內赫是我們在德黑蘭武器和彈藥生產的主要基地。投資資源開發戈爾哈內赫軍械庫將有助於確保我們的裝備生產能力始終處於最佳狀態，以應對任何潛在的衝突。"
 PER_desert_training: "特化沙漠訓練"
 PER_desert_training_desc: "[PER.GetNonIdeologyName]擁有豐富多樣的生態系統，但其大片土地為沙漠平原。面對如此艱難的地形，我們必須優化軍事行動。因此，我們應專注於沙漠生存與穿越的特化訓練。"
 PER_every_man_serves: "全民服役"
 PER_every_man_serves_desc: "軍事的未來將以數量取勝。我們擁有龐大的人口，在這樣的時代，任何能持槍的人都有義務保衛[PER.GetNameDef]免受外國入侵。儘管我們可能失去特化訓練的優勢，但希望數量可以壓倒敵人。"
 PER_special_units: "伊朗特種作戰部隊"
 PER_special_units_desc: "隨著軍事能力的提升，除了常規部隊外，我們還必須重視特種部隊。通過這一努力，我們將有更多機會開展情報行動、特種作戰，甚至研發實驗性武器。"
 PER_form_savak: "成立薩瓦克"
 PER_form_savak_desc: "間諜活動正成為戰爭努力中的關鍵因素。為了應對敵方的情報活動，我們應成立自己的機構來處理間諜和情報事務。即便對於國內，也能強化政府並監控潛在的反叛分子。"
 PER_transfer_officers_to_intelligence: "把軍官調入情報部門"
 PER_transfer_officers_to_intelligence_desc: "為了增強情報機構的行動能力，我們必須從軍隊中調派一些具有卓越智慧的軍官進入情報部門。"
 PER_fund_state_intelligence: "撥款給國家情報機構"
 PER_fund_state_intelligence_desc: "通過向國家情報計劃注入更多資金，我們將能夠更好地監控潛在的叛亂和反叛活動。將問題扼殺在萌芽狀態，能進一步保障國家的安全和穩定。"
 PER_special_forces_program: "特種部隊計劃"
 PER_special_forces_program_desc: "常規部隊無法到達的地方需要特種部隊填補空白。因此，創建特種部隊計劃是至關重要的。很快，我們將擁有能夠勝任任何艱鉅任務的專業化部隊。"
 PER_recruit_bakhtiari: "招募巴赫提亞里山地專家"
 PER_recruit_bakhtiari_desc: "巴赫提亞里人是[PER.GetNonIdeologyName]東部的一個盧爾人部落。雖然國內西部地區對他們的影響有所擔憂，但其游牧生活方式在軍事上極具價值。通過招募該部落成員，我們的山地部隊將在對抗敵人時佔據明顯優勢。"
 PER_expand_unique_unit: "加強不死軍"
 PER_expand_unique_unit_desc: "作為帝國遺產的一部分，不死軍已經成立。現在，我們可以向這支聲名卓著的軍團注入更多資源，吸引更多戰士肩並肩地捍衛[PER.GetAdjective]帝國的榮光！"
 PER_import_rocketry: "引進火箭技術設計"
 PER_import_rocketry_desc: "戰爭正在以驚人的速度演變。隨著其他國家開始開發戰場火箭技術，我們也應努力趕上潮流，通過引進設計來生產我們自己的奇蹟武器。"
 PER_cyrus_initiative: "居魯士計劃"
 PER_cyrus_initiative_desc: "居魯士計劃是我們最新的絕密項目，旨在開發威力強大的破壞性武器，用以徹底摧毀敵人。我們的科學家已經提出了一些獨特的設計，這些設計尚未被其他國家想到，這使我們在戰爭時期能出其不意地擊敗對手。"
 PER_modern_cataphract: "現代化鐵甲騎兵"
 PER_modern_cataphract_desc: "鐵甲騎兵在古代曾是我們土地上的一種重型甲冑騎兵，在阿契美尼德帝國亦或薩珊帝國時期都被廣泛運用。以此為靈感，我們可以開發出一種機械化巨獸，延續我們騎兵戰爭的歷史榮耀。"
 PER_war_elephant: "戰象"
 PER_war_elephant_desc: "雖然在古波斯帝國中使用並不廣泛，但戰象曾在古代征服中以小規模參戰而聞名。我們的科學家以印度大象的形狀為靈感，提出了一種超重型的坦克設計，必將像幾千年前一樣讓敵人聞風喪膽。"
 PER_negotiate_with_america: "與美國談判"
 PER_negotiate_with_america_desc: "[USA.GetNameDefCap]在原子技術發展方面已成為全球領先者。這些創新對於我們保持競爭力至關重要。我們應派遣外交使團，請求其協助開發我們自己的核計劃。"
 PER_establish_nuclear_program: "建立[PER.GetAdjective]核計劃"
 PER_establish_nuclear_program_desc: "[GER.GetNameDef]和[USA.GetNameDef]在原子秘密的探索上已持續多年。通過獲得[USA.GetAdjective]盟友的研究資料和技術支持，我們正式建立了自己的核計劃。"
 ####################
 ##### AIRFORCE #####
 ####################
 PER_establish_airforce: "建立空軍"
 PER_establish_airforce_desc: "[PER.Adjective]帝國空軍於1920年由禮薩沙阿·巴列維正式創立。如今，戰爭的陰雲籠罩全球，我們必須鞏固國家在天空中的作戰能力，以確保[PER.GetNameDef]在未來幾十年的安全。"
 PER_pilot_training: "飛行員訓練計劃"
 PER_pilot_training_desc: "飛行員需要的不僅是天賦，還需經過全面的培訓計劃，才能勝任作戰任務。給那些願意為[PER.GetNameDef]奮不顧身的人提供良好的培訓，將是確保其空中安全與作戰有效性的關鍵。"
 PER_raf_planes: "購買英國皇家空軍飛機"
 PER_raf_planes_desc: "[ENG.GetNameDefCap]皇家空軍因其飛行員的高超技術和飛機的卓越性能而聞名於世。我們應聯繫他們並下訂單採購他們的飛機，以增強我們的空軍。"
 PER_luftwaffe_planes: "購買德國空軍飛機"
 PER_luftwaffe_planes_desc: "提到卓越的飛機，[GER.GetNameDef]的德國空軍無疑是佼佼者。鑑於我們與[GET.GetNameDef]的密切關係，向他們購買多餘的戰機將是合乎情理的選擇。"
 PER_own_plane_designs: "研發自主設計"
 PER_own_plane_designs_desc: "在投入大量資源購買外國飛機後，現在是時候讓我們的工程師為空軍設計自主研發的機型了。"
 PER_establish_air_academy: "成立空軍學院"
 PER_establish_air_academy_desc: "儘管我們已初步建立了飛行員培訓機制，但若想真正掌控制空權，我們需要更專業的教育。在德黑蘭成立官方的空軍學院後，將大大加快這一進程，並確保飛行員的專業培訓質量。"
 PER_legacy_of_gilani: "奧茲拉·吉拉尼的遺產"
 PER_legacy_of_gilani_desc: "奧茲拉·吉拉尼是第一位加入[PER.GetAdjective]帝國空軍的女性，她為軍隊的未來包容性樹立了榜樣。我們應努力定義女性在軍隊中的角色，並允許她們作為飛行員加入軍隊，為國家效力。"
 PER_strategic_bombing: "戰略轟炸"
 PER_strategic_bombing_desc: "戰爭不僅在空中贏得，還通過摧毀敵人的經濟和工業能力獲勝。我們將專注於戰略轟炸，在敵人將設施用於對抗我們之前將其摧毀。"
 PER_battlefield_support: "戰場支援"
 PER_battlefield_support_desc: "為了確保部隊在向前線進軍時的安全，至關重要的是使用地面支援飛機來防止敵機對我軍進行空襲。"
 PER_air_superiority: "制空權"
 PER_air_superiority_desc: "我們空軍的最重要目標是控制天空。如果我們能夠取得制空權，就能在沒有敵方攔截的情況下執行更危險的行動。"
 PER_perfect_iranian_airforce: "完善[PER.GetAdjective]空軍"
 PER_perfect_iranian_airforce_desc: "在空軍能力的發展上投入了大量資源與時間，現在正是我們衝向巔峰的時候。我們將宣告自己擁有世界上最有效率的空軍。無論是飛行員的技術還是飛機的優越性，都無可匹敵。"
 PER_construct_air_bases: "建設空軍基地"
 PER_construct_air_bases_desc: "如果想讓飛機有效執行任務，我們必須為其提供部署基地。因此，投資[PER.GetNonIdeologyName]境內的新空軍基地建設、並擴大空軍數量上限，是至關重要的。"
 PER_construct_air_defenses: "建立防空御體系"
 PER_construct_air_defenses_desc: "我們需要在邊境部署更多防空炮，以保護前線部隊免遭敵方飛機的襲擊。"
 PER_anti_air_development: "撥款給防空領域"
 PER_anti_air_development_desc: "我們的城市工廠已成為敵方轟炸機的目標，他們試圖破壞我們的經濟和工業進步。我們應投入資源開發防空襲措施，保護關鍵設施。"
 PER_anti_air_research: "防空武器研究計劃"
 PER_anti_air_research_desc: "目前的防空武器已逐漸落後。我們需要加大研究力度，開發能夠更有效保護國家的新技術，抵禦空中威脅。"
 ################
 ##### NAVY #####
 ################
 PER_establish_the_navy: "建立海軍"
 PER_establish_the_navy_desc: "和空軍一樣，[PER_GetAdjective]帝國海軍是在禮薩·沙·巴列維推翻卡扎爾王朝後建立的。如今，我們已認識到加強海軍的重要性，以確保對北部和南部邊界海域有更好的控制。"
 PER_officers_to_italy: "派遣軍官赴意大利受訓"
 PER_officers_to_italy_desc: "[ITA.GetNameDefCap]是我們最初獲得艦船的來源地，因此在海軍發展方面，我們自然有一定的聯繫。我們應聯繫[ITA.GetAdjective]政府，請求他們允許我們派遣軍官前去接受海軍培訓。"
 PER_persian_gulf_fleet: "波斯灣艦隊"
 PER_persian_gulf_fleet_desc: "波斯灣是我們通往世界的唯一海上通道，因此不惜一切代價保護它是值得的。將訓練重點放在波斯灣活動上，可以確保任何來自南方的入侵者都難以通過海路登陸。"
 PER_construct_naval_bases: "建造新的海軍基地"
 PER_construct_naval_bases_desc: "當前的海軍容量遠低於我們的預期。為此，我們必須在兩個海岸線上建設更多船塢，以提升戰艦的部署能力。"
 PER_bolster_the_caspian: "加強裡海防禦"
 PER_bolster_the_caspian_desc: "儘管裡海是內陸海，但如果[SOV.GetNameDef]選擇入侵，它將為其提供進入我們領土的另一途徑。雖然有人認為防禦這片海域沒有必要，但面對北方鄰國的潛在威脅，我們寧可多加防範。"
 PER_coastal_defense_initiative: "海岸防禦計劃"
 PER_coastal_defense_initiative_desc: "儘管我們與全球海洋的互聯互通較為薄弱，但海上入侵的風險依然存在。為了確保[PER.GetNonIdeologyName]海岸線的安全，我們必須提出一項計劃，加強波斯灣和裡海沿岸的防禦工事。"
 PER_purchase_foreign_ships: "購買外國艦船"
 PER_purchase_foreign_ships_desc: "我們的海軍由數年前從[ITA.GetNameDef]購買的嶄新的武裝艦船組建。通過與其他外國勢力接洽併購買更多艦船，我們可以增強海軍能力，同時增進國家之間的關係。"
 PER_found_iranian_shipyards: "創立伊朗造船廠"
 PER_found_iranian_shipyards_desc: "儘管目前購買外國艦船尚可滿足需求，但如果想跟上地區內的海軍軍備競賽，就必須投資於自主造船能力。通過創建一家專注於造船的公司，將為我們的戰備工作奠定基礎——伊朗造船廠。"
 PER_expand_dockyards: "擴建船塢設施"
 PER_expand_dockyards_desc: "隨著海軍規模的擴大，我們需要相應地擴建海軍基礎設施。這將確保我們對海岸線的控制牢不可破。"
 PER_merchant_navy: "商船隊"
 PER_merchant_navy_desc: "海上資源運輸對[PER.GetNameDef]的生存至關重要。因此，建立一支專業的商船隊以支持我們的軍事活動顯得尤為重要。"
 PER_expert_raiders: "精銳突擊艦"
 PER_expert_raiders_desc: "確保己方海上貿易安全固然重要，但在戰爭時期，主動出擊破壞敵方補給線則是摧毀其經濟功能的關鍵。我們應專注於利用海軍力量襲擊敵方運輸船隊。"
 ##################
 #### IMPERIAL ####
 ##################
 PER_the_pahlavi_imperium: "巴列維帝國"
 PER_the_pahlavi_imperium_desc: "自1925年禮薩·沙·巴列維推翻卡扎爾王朝以來，他一直是[PER.GetNameDef]的掌舵者。在國家面臨另一場世界性衝突的十字路口時，這位偉大的沙阿必須做好準備，應對任何可能席捲我們榮耀的[PER.GetAdjective]大地的風暴。"
 PER_forced_secularization: "強制世俗化"
 PER_forced_secularization_desc: "自禮薩·沙·巴列維上臺以來，[PER.GetNameDef]的神職人員便不斷與政府對抗。儘管伊斯蘭教仍然是國教，但為了向西方世界證明我們具備與之比肩的能力，是時候讓宗教與國家分離，走上現代化之路。"
 PER_legacy_of_greatness: "偉業的遺產"
 PER_legacy_of_greatness_desc: "毫無疑問，巴列維王朝註定是一個世代相傳的王朝。儘管前方充滿波折，但顯然沙阿及其兒子準備帶領[PER.GetNameDef]進入繁榮的黃金時代。"
 PER_imperial_funded_universities: "受帝國資助的大學"
 PER_imperial_funded_universities_desc: "為了證明[PER.GetNameDef]有能力與當今世界的偉大強國比肩，沙阿慷慨捐贈了大量資金，資助本國的大學。有了這筆慷慨的贈款，人民將更容易獲得優質的高等教育。"
 PER_the_unification_initiative: "統一倡議"
 PER_the_unification_initiative_desc: "近年來，[PER.GetNameDefCap]一直在努力將人民團結在一面旗幟之下。庫爾德人和阿塞拜疆人反對派在西部造成問題，而神職人員反對宗教改革。若要實現[PER.GetNameDef]的真正統一，我們還有許多工作要做。"
 PER_clamp_kurdish_dissidence: "打擊庫爾德反對派"
 PER_clamp_kurdish_dissidence_desc: "[PER.GetNameDefCap]的部分領土曾屬於庫爾德人。因此，當地有大量對我們統治感到不滿的庫爾德人。現在是時候粉碎這些叛徒，確保該地區恢復穩定與繁榮了。"
 PER_clamp_azerbaijani_dissidence: "打擊阿塞拜疆反對派"
 PER_clamp_azerbaijani_dissidence_desc: "我們國家北部有大量阿塞拜疆族人，他們以[PER.GetNameDef]為家。然而，許多人對我們的統治感到不滿。現在是時候打擊這些叛徒，確保北部地區的穩定與繁榮了。"
 PER_venerate_islam: "崇敬伊斯蘭教"
 PER_venerate_islam_desc: "自古代帝國在穆斯林征服波斯時解體以來，伊斯蘭教一直是我們社會的基礎。自此，它在大多數公民的日常生活中扮演了重要角色。與其繼續反對神職人員，也許是時候表達對宗教的崇敬，向世界展示我們對伊斯蘭教的虔誠了。"
 PER_state_atheism: "完全世俗化"
 PER_state_atheism_desc: "在一個現代化的[PER.GetNameDef]，宗教不再需要像過去那樣佔據重要地位。我們應鼓勵民眾接受某種形式的無神論，使我們能夠專注於現代化舉措。然而，這必然會惹怒現有的神職人員。"
 PER_revive_old_ways: "復興古代信仰"
 PER_revive_old_ways_desc: "如果我們想在世界舞臺上脫穎而出，就必須繼續踐行前波斯帝國的理想。因此，我們應該努力重新將瑣羅亞斯德教確立為[PER.GetNameDef]的國教。我國東部的一些小部落仍然信奉這種宗教，復興這一古老信仰並非沒有可能。"
 PER_imperial_expansionism: "帝國擴張主義"
 PER_imperial_expansionism_desc: "我們擴張新帝國疆域的時刻來到了。我們必須準備戰爭機器，號召國民盡職盡責，並準備向世界展示[PER.GetAdjective]帝國如何收回理應屬於我們的領土。"
 PER_tehran_moscow_pact: "德黑蘭-莫斯科條約"
 PER_tehran_moscow_pact_desc: "[SOV.GetNameDef]像一頭巨熊般盤踞在北方，眾所周知它對我國虎視眈眈。如果我們要實施擴張主義的理想，必須儘快解決這個問題。我們可以儘早派遣外交使團前往莫斯科，希望[SOV.GetAdjective]願意簽署互不侵犯條約。"
 PER_establish_special_unit: "建立不死軍"
 PER_establish_special_unit_desc: "不死軍是古代波斯帝國最具標誌性的部隊之一。如今，我們正迎來一個帝國偉大的新時代，到了重新建立不死軍作為精英突擊軍團的時候了。"
 PER_demand_iraqi_territory: "索要伊拉克領土"
 PER_demand_iraqi_territory_desc: "[IRQ.GetNameDef]的北部領土將成為展示[PER.GetNameDef]成為區域唯一強國的絕佳平臺。這將是我們偉大征服行動的起點之一。"
 PER_demand_afghan_territory: "索要阿富汗領土"
 PER_demand_afghan_territory_desc: "[AFG.GetNameDefCap]地處蜿蜒的群山與河流之間，未來征服此地將相當複雜。如果我們能夠在這個國家站穩腳跟，就可以為向喀布爾推進奠定絕佳的基礎。"
 PER_currently_doing_war_plan: "目前正在執行一份§Y戰爭計劃§!。"
 PER_war_plan_darius: "大流士戰爭計劃"
 PER_war_plan_darius_desc: "大流士大帝是阿契美尼德王朝的萬王之王，他曾帶領波斯帝國達到版圖巔峰，甚至延伸至印度河流域。因此，我們以他的名字命名我們的計劃，讓我們擴張到印度次大陸，並將[ENG.GetAdjective]逐出這些土地。"
 PER_foothold_in_indus: "在印度河流域的立足點"
 PER_foothold_in_indus_desc: "[RAJ.GetNameDefCap]是[ENG.GetNameDef]殖民權力的象徵。然而，[ENG.GetAdjective]人不屬於這裡，他們應該明白按照大流士大帝的意志，這片土地是[PER.GetNameDef]與生俱來的領地。開始談判，並取得在印度的立足點。"
 PER_usurp_afghanistan: "接管[AFG.GetNameDef]"
 PER_usurp_afghanistan_desc: "是時候將喀布爾置於[PER.GetAdjective]的控制之下了。將我們的部隊推進到[AFG.GetNonIdeologyName]的群山深處，直到我們的旗幟飄揚在塔吉貝格宮殿上方，我們才會凱旋。"
 PER_invasion_of_india: "入侵印度次大陸"
 PER_invasion_of_india_desc: "入侵[RAJ.GetNameDef]的計劃可能是我們迄今為止最偉大的目標之一，但毫無疑問，這將是一項危險的行動。威脅印度意味著我們將面臨[ENG.GetAdjective]的憤怒。如果這無關緊要，那就讓我們繼續推進入侵印度的計劃。"
 PER_glory_of_cyrus: "居魯士大帝的榮耀"
 PER_glory_of_cyrus_desc: "隨著戰爭目標的完成和土地安全歸於[PER.GetAdjective]主權，我們通過武裝力量的辛勤努力與英勇表現，為[PER.GetNameDef]帶來了一個繁榮的新時代。[PER.GetNameDef]終於可以再一次實現其文明奠基者居魯士大帝的榮耀。榮耀歸於居魯士！榮耀歸於沙阿！"
 PER_war_plan_xerxes: "薛西斯戰爭計劃"
 PER_war_plan_xerxes_desc: "薛西斯是阿契美尼德帝國的第四位萬王之王，與大流士和居魯士大帝有血緣關係。薛西斯以公元前480年入侵希臘而聞名。為紀念他，我們將以他的名字命名我們入侵[PER.GetNameDef]西部地區的計劃。我們將彌補敗於希臘人的遺憾。"
 PER_reclaim_turkish_peninsula: "奪回土耳其半島"
 PER_reclaim_turkish_peninsula_desc: "[TUR.GetNameDefCap]是阻礙我們向西擴張的障礙。安納托利亞曾是波斯的領土，現在是時候重新奪回它了。調動我們的軍隊，準備入侵！"
 PER_reintegrate_anatolia: "重新整合安納托利亞領土"
 PER_reintegrate_anatolia_desc: "現在，我們已經在[TUR.GetNameDef]曾經的疆域內奪取了一些土地，現在是時候將這些領土整合為[PER.GetNameDef]的正式法理領土了。"
 PER_clash_of_titans: "諸神之戰"
 PER_clash_of_titans_desc: "[GRE.GetNameDef]的復興為我們帶來了一個意料之外的問題。我們無法容忍另一個帝國在我們的邊境積聚力量。我們必須立即宣戰，為了沙阿的榮耀保衛這片土地！"
 PER_absorb_byzantines: "吸收拜占庭帝國"
 PER_absorb_byzantines_desc: "通過擊敗[GRE.GetNameDef]，我們終於化解了與[GRE.GetAdjective]的數百年宿怨。這片領土現在可以被納入帝國，正式成為我們國家的一份子。"
 PER_war_plan_cambyses: "岡比西斯戰爭計劃"
 PER_war_plan_cambyses_desc: "作為居魯士大帝的直接繼任者，岡比西斯二世是阿契美尼德帝國的第二任萬王之王。他的統治以在北非和埃及的征服為標誌。為紀念他的榮耀，我們將該地區的戰爭計劃以他的名字命名。"
 PER_path_through_iraq: "開闢伊拉克通道"
 PER_path_through_iraq_desc: "[IRQ.GetNameDefCap]是我們征服北非的門戶，因此必須首先攻陷。巴格達如此靠近我們的邊境，我們應該順理成章地入侵這個國家，並宣示我們對其領土的所有權。"
 PER_demand_west_asia: "奪取法屬西亞"
 PER_demand_west_asia_desc: "[FRA.GetAdjective]是這些土地的非法侵略者，如果要推行我們自己帝國的政策，就必須將他們逐出。必須佔領[SYR.GetNameDef]和[LEB.GetNameDef]的領土後，方能進入北非對抗[ENG.GetAdjective]人。"
 PER_march_to_nile: "邁向尼羅河的長征"
 PER_march_to_nile_desc: "為了收復波斯帝國在北非的故土，我軍必須一路踏過[ENG.GetAdjective]屬北非，最終入侵埃及。這無疑會讓我們與[ENG.GetNameDef]開戰，但如果我們想在該區域確立自己的主導地位，這是我們必須冒的風險。"
 PER_the_memphis_initiative: "孟菲斯計劃"
 PER_the_memphis_initiative_desc: "將領土整合入我們的帝國，對於維持被征服領土的控制至關重要。特別是埃及，如果我們掉以輕心，將很難維持秩序，因此我們應優先關注他們。"
 PER_assassinate_reza_shah: "刺殺禮薩·沙"
 PER_assassinate_reza_shah_desc: "禮薩·沙·巴列維對[PER.GetNameDef]做出了巨大改變，但並非所有人都支持這些改變。多年來一直有關於暗殺陰謀的傳聞，但至今無人付諸行動……會有人真正開槍嗎？"
 PER_root_out_conspiracies: "根除陰謀"
 PER_root_out_conspiracies_desc: "多年來，一直有許多關於刺殺禮薩·沙·巴列維的潛在陰謀的傳聞。我們認為這個風險過於嚴重，因此，根除這些陰謀以確保沙阿的安全至關重要。"
 PER_his_fathers_footsteps: "追隨父親的腳步"
 PER_his_fathers_footsteps_desc: "禮薩·沙·巴列維不幸遇刺身亡後，他的兒子穆罕默德·禮薩·巴列維繼承了[PER.GetNameDef]的領導權。儘管這位年輕的國王並無統治的願望，但他必須站出來，追隨父親的腳步，為[PER.GetNameDef]帶來榮耀。"
 PER_third_persian_empire: "第三波斯帝國"
 PER_third_persian_empire_desc: "為了保障我們人民的未來，穆罕默德·禮薩·巴列維宣佈成立第三波斯帝國，其目標是效仿並尊重我們古代阿契美尼德先祖的歷史。這是[PER.GetNameDef]新的時代，一個將引領我們走向偉大的時代。"
 PER_choose_a_shahbanu: "選擇一位沙赫巴努"
 PER_choose_a_shahbanu_desc: "巴列維王朝的皇室血脈必須延續，但由於穆罕默德·禮薩·巴列維年輕，他尚未有機會選擇妻子。現在是時候讓他認真考慮，並選出一位能夠勝任沙赫巴努之位的女性了。"
 PER_embrace_opulence: "接受奢華文化"
 PER_embrace_opulence_desc: "對於一位至高無上的君主而言，向世界展示[PER.GetAdjective]的奢華至關重要。讓我們向渴望目睹這一輝煌的所有人展示我國的輝煌。"
 PER_emperor_for_people: "人民的皇帝"
 PER_emperor_for_people_desc: "穆罕默德·禮薩·沙阿希望他的統治成為皇帝與人民重新聯繫的標誌。他不願將財富自私地囤積在皇室手中，而是希望將其用於改善[PER.GetNameDef]普通公民的生活。"
 PER_fund_imperial_excellency: "撥款提升帝國的優越性"
 PER_fund_imperial_excellency_desc: "帝國已經開始通過炫耀我們的財富來震懾鄰國。現在是時候將一些資金用於改善皇宮，僱傭更多的護衛，似乎就能達到目的！"
 PER_uphold_civil_rights: "維護公民權利"
 PER_uphold_civil_rights_desc: "尊重[PER.GetNameDef]公民的公民權利是穆罕默德·禮薩·沙阿統治的重要部分。通過堅持這一社會的基本原則，我們鼓勵人民實現比以往更偉大的目標。"
 PER_absolute_monarchy: "絕對君主制"
 PER_absolute_monarchy_desc: "在禮薩·沙·巴列維對試圖推翻其統治的反對派進行鎮壓後，他宣佈實施絕對君主制，將更多的權力集中到皇權，確保沒有人能威脅他的王朝。這一進程還包括更具軍事化的外交政策以及[PER.GetNameDef]常備軍的擴張。"
 PER_first_iranian_empire: "第一伊朗帝國"
 PER_first_iranian_empire_desc: "禮薩·沙·巴列維一直偏愛將他的國家稱為[PER.GetNameDef]，並在1935年重新將其確立為國家的正式名稱。因此，他的新帝國抱負的基礎將是建立一個全新的伊朗帝國，而不是照搬古代的波斯。"
 PER_take_regional_tour: "開展區域訪問"
 PER_take_regional_tour_desc: "在新帝國成立後，禮薩·沙·巴列維希望訪問本區域的各個國家，包括[IRQ.GetNameDef]和[AFG.GetNameDef]，以改善與這兩國的領導人的關係。"
 PER_limit_foreign_influence: "限制外國影響力"
 PER_limit_foreign_influence_desc: "[PER.GetNameDef]長期以來一直受外國勢力擺佈。他們聲稱擁有我們的資源，要求分享我們的自然財富。現在是[PER.GetNameDef]自立的時候了，我們應當限制外來勢力對國家事務的影響。"
 PER_embrace_industrial_powers: "接納工業強國"
 PER_embrace_industrial_powers_desc: "與其孤立自己，不如利用我們與工業強國的聯繫，推動[PER.GetNameDef]的未來發展。"
 PER_subserviant_to_noone: "我們不服從任何人"
 PER_subserviant_to_noone_desc: "儘管我們曾經認為與[ENG.GetNameDef]當局及與英波石油公司的良好關係對於我國有利，但如今我們不再需要讓我們的資源被外國勢力掠奪。我們應解散這家公司，專注於獨立發展。"
 PER_modernize_iran_economy: "[PER.GetNameDef]經濟現代化"
 PER_modernize_iran_economy_desc: "在工業強國的幫助下，我們成功地實現了經濟現代化。隨著工廠車間的運轉和人民的辛勤工作，我們將很快成為工業強國，列於世界強國之林。"
 PER_last_thousand_years: "千年帝國"
 PER_last_thousand_years_desc: "歷經努力和奉獻，我國終於達到了一個新階段，[PER.GetNameDef]經受住時間考驗，並在世界舞臺上以現代而強大的國家身份傲然屹立。我們終於超越了阿契美尼德先祖的輝煌！"
 PER_shahanshah: "萬王之王"
 PER_shahanshah_desc: "萬王之王是[PER.GetNameDef]君主最高的稱號。這一稱號與我們當前的統治者完全相稱，也是一個值得再次被啟用的榮譽。"
 PER_rally_ancient_history: "復興歷史傳統"
 PER_rally_ancient_history_desc: "毫無疑問，巴列維王朝缺乏歷史底蘊的統治讓[PER.GetNameDef]的許多人對未來感到擔憂。傳播民族主義的自豪感和對沙阿的信任的最佳機會，就是提醒我們的人民以及世界古波斯歷史的輝煌。是時候頌揚阿契美尼德帝國了。"
 PER_rebuild_persepolis: "重建波斯波利斯"
 PER_rebuild_persepolis_desc: "禮儀上，波斯波利斯是阿契美尼德帝國的首都，其遺址位於馬爾夫達什特平原。作為一處文化遺產，讓它在未來幾十年裡成為我們帝國的象徵，將是一項強有力的舉措。"
 PER_stand_with_germany: "與[GER.GetNameDef]結盟"
 PER_stand_with_germany_desc: "多年來，[GER.GetNameDef]一直是我們最大的貿易伙伴之一。在他們推進自己的征服目標的同時，為了保護我國自己的前景，我們與他們達成協議並建立互不侵犯條約將是明智的。"
 PER_align_with_axis: "使[PER.GetNameDef]與軸心國結盟"
 PER_align_with_axis_desc: "隨著歐洲戰爭的持續，我們的[GER.GetAdjective]朋友需要盟友來支援他們的戰爭。是時候加入軸心國陣營並參與戰爭了。"
 PER_donate_oil_fields: "將油田捐贈給[GER.GetNameDef]"
 PER_donate_oil_fields_desc: "在長期為[ENG.GetNameDef]等國家提供石油後，為了更有利於我們雙方的長遠利益，我們應向[GER.GetNameDef]捐贈部分石油設施，助力他們的戰爭。"
 PER_spoils_of_war: "戰利品"
 PER_spoils_of_war_desc: "我們在戰爭中的努力沒有被盟友忽視，他們樂意接受[PER.GetNameDef]在戰後獲得周邊地區的領土。這是攫取戰利品的大好機會。"
 PER_middle_east_protectorate: "在中東建立保護國"
 PER_middle_east_protectorate_desc: "隨著戰爭結束，我們成功控制了環繞[PER.GetNameDef]的一些國家。作為宗主國，我們有責任保護這些國家免受其他侵略者的威脅。如果有人試圖奪走這些土地，就讓他們試試看吧。"
 ##################
 ### HISTORICAL ###
 ##################
 PER_stand_with_giants: "與巨人比肩"
 PER_stand_with_giants_desc: "世界正處於刀刃之上，歐洲的強國之間醞釀著衝突。在這桶火藥慢慢點燃時，我們必須準備好將[PER.GetNameDef]提升到可以與世界巨人比肩的高度，成為一個經得起時間考驗的現代化和進步的社會。"
 PER_saadabad_treaty: "薩德阿巴德條約"
 PER_saadabad_treaty_desc: "與鄰國保持友好，我們不會有什麼損失，反而會有所得。簽訂一項正式的友好條約的想法已被提出多次，現在是我們採取行動，確保這份友誼被寫入條約的時候了。"
 PER_increase_military_funding: "增加軍費"
 PER_increase_military_funding_desc: "我們的領導者禮薩·沙·巴列維出自著名的波斯哥薩克部隊。因此，他渴望提升[PER.GetNameDef]的陸軍實力。首先，我們必須加強現有的部隊，提高士兵的素質，並提升軍事裝備的生產。"
 PER_military_high_schools: "建立軍事高中"
 PER_military_high_schools_desc: "一支訓練有素的常備軍要從我們的青年抓起。通過在軍事卓越方面教育年輕人，我們為未來的成功奠定基礎。這可能需要幾年時間，但最終我們將擁有該地區最強大的陸軍。"
 PER_persian_german_trade: "波斯-德國貿易協會"
 PER_persian_german_trade_desc: "[GER.GetNameDefCap]在大戰後再次迅速實現工業化。這是我們在推進[PER.GetNameDef]現代化進程中可以效仿的優秀榜樣。看來他們的新領導人也尊重我們，這將使建立積極關係的過程更加順利。"
 PER_trial_fifty_three: "對五十三人的審判"
 PER_trial_fifty_three_desc: "共產主義政治組織在我們鞏固巴列維王朝對[PER.GetNameDef]統治的過程中製造了問題。我們不能允許這些反君主主義思潮發酵，這可能引發大規模示威活動。我們必須將這些反對派送上法庭，由法庭決定他們的命運。"
 PER_increase_education_funding: "增加教育經費"
 PER_increase_education_funding_desc: "作為禮薩·沙現代化規劃的一部分，我們已經強調提高國家教育質量的重要性。遠離我們的傳統過去，我們計劃為男性與女性建立免費義務教育體系，同時關閉私立宗教教育機構。"
 PER_open_abadan: "開設阿巴丹技術學校"
 PER_open_abadan_desc: "技術教育將幫助我們躋身世界工業強國之列。通過開設這所新技術學校，我們可以為那些希望從事相關領域工作的人提供教育機會。這將有助於推動我們的發展和現代化進程。"
 PER_royal_visit_germany: "國王訪問德國"
 PER_royal_visit_germany_desc: "在禮薩·沙的統治期間，我們與[GER.GetNameDef]的領導人保持了良好的關係。對方甚至表示希望接待我們的國王訪問他們的國家。如果我們接受這一邀請，肯定會繼續改善與[GER.GetNameDef]的關係，但這究竟是助力還是阻礙仍有待觀察！"
 PER_german_non_aggression: "討論與[GER.GetNonIdeologyName]簽署互不侵犯條約"
 PER_german_non_aggression_desc: "隨著歐洲局勢升溫，可能會有壓力要求我們選擇立場。然而，如果戰爭爆發，保持[PER.GetNameDef]的中立至關重要。鑑於其快速工業化，我們應向[GER.GetNameDef]提議簽署互不侵犯條約，以確保我們的安全。"
 PER_wether_the_storm: "風雨飄搖"
 PER_wether_the_storm_desc: "看來我們保護自己外交政策的努力適得其反，以往的朋友轉而覬覦我們的土地，意圖防止我們背叛他們。儘管我們無意如此，但我們必須為任何可能的事態做好準備。"
 PER_stand_our_ground: "堅守陣地"
 PER_stand_our_ground_desc: "政府中的恐懼和焦慮蔓延，因為來自鄰國及其他地區的威脅不斷加劇壓力。不論發生什麼，我們必須堅守陣地。是時候採取措施確保[PER.GetNameDef]能夠渡過接下來的十年了。"
 PER_bolster_civilian_industry: "加強民用工業"
 PER_bolster_civilian_industry_desc: "如果我們想要在即將到來的風暴中生存下來，就必須著力加強民用工業。投入更多資源將大大提高我們的經濟在未來戰爭中的生存能力。"
 PER_upscale_military_production: "擴大軍事生產"
 PER_upscale_military_production_desc: "如果我們想抵禦威脅我國的敵人，就必須準備加倍擴大軍事工業產能。通過建立新的工廠，我們將處於最有利的位置，為軍隊提供更多新式裝備。"
 PER_preparatory_mobilization: "動員準備"
 PER_preparatory_mobilization_desc: "如果準備工作失敗，我們就是在為失敗做準備。毫無疑問，外國勢力正對[PER.GetNonIdeologyName]的資源垂涎欲滴。如果他們想搶奪，我們就誓死抵抗。通過為軍隊動員，加強戰備，我們將為敵人可能發動的一切做好應對。"
 PER_we_will_survive: "我們將生存下去"
 PER_we_will_survive_desc: "戰爭終於降臨到我們家門口。毫無疑問，我們將盡最大努力抵禦入侵者，向全世界證明偉大的[PER.GetNameDef]能夠在任何情況下倖存。我們已經存續了數千年，並將繼續存續數千年。"
 PER_we_survived: "我們活下來了"
 PER_we_survived_desc: "我們成功地在逆境中生存下來！現在，是為我們的人民建立穩定的時候了。"
 PER_question_of_resources: "資源問題"
 PER_question_of_resources_desc: "我們發現潛在的入侵很可能是因為[PER.GetNameDef]豐富的資源。我們的油田價值連城，很可能有人想佔為己有。我們絕不能允許這種事情發生，因此，我們應該主動打擊潛在威脅，防止他們先發制人。"
 PER_plant_resistance_cells: "建立抵抗組織"
 PER_plant_resistance_cells_desc: "我們若要準備先發制人，我們應在鄰近地區煽動政治動盪。[IRQ.GetNameDef]以及[AZR.GetNameDef]、[GEO.GetNameDef]、[ARM.GetNameDef]和[TMS.GetNameDef]的被佔領地區是理想的選擇。"
 PER_preemptive_strike: "先發制人"
 PER_preemptive_strike_desc: "沒有人能威脅我們的主權。為了讓那些對我們虎視眈眈的勢力學到教訓，我們將向他們展示[PER.GetNameDef]軍隊的全部力量。如果我們率先攻擊，他們將無力應對迅猛的打擊。"
 PER_establish_northern_buffer_states: "建立北部緩衝國"
 PER_establish_northern_buffer_states_desc: "為了確保北方敵人無法輕易進犯[PER.GetNameDef]，我們必須解放這些土地上的被佔領國家，恢復其主權。希望這能防止未來的突然入侵。"
 PER_prepare_for_worst: "做最壞的打算"
 PER_prepare_for_worst_desc: "我們得知[PER.GetNameDef]很可能遭受入侵，因此必須開始未雨綢繆。雖然我們已經料到這一點，但我們不能輕易屈服，而是必須壯大軍隊，為最壞情況的到來做好準備。"
 PER_fight_for_iran: "保衛[PER.GetNonIdeologyName]"
 PER_fight_for_iran_desc: "我們最擔憂的事成為現實，敵軍突破防線，對[PER.GetNameDef]發動全面入侵。儘管局勢艱難，我們必須團結人民，集結軍隊，保衛我們偉大的國家免受任何外國勢力的威脅。"
 PER_force_them_back: "擊退敵人"
 PER_force_them_back_desc: "戰爭爆發後，我們清楚地知道要麼防守要麼反擊。如果我們採取進攻路線，將在衝突結束時處於更有利的位置提出要求。儘管存在風險，我們的部隊已做好應對的準備。"
 PER_push_to_deserts: "北方攻勢"
 PER_push_to_deserts_desc: "敵軍主要從[PER.GetNameDef]北部邊境發起攻擊。我們必須把部隊集中在這片地帶，阻止敵人進一步推進。然後，將戰火燒向他們，並將他們趕出國境。"
 PER_push_to_mountains: "南方戰線"
 PER_push_to_mountains_desc: "看來入侵者已經佔領了[PER.GetNonIdeologyName]的南部領土。若要擊退他們，我們必須集中力量將敵人趕回波斯灣。時不我待，我們不能讓他們進一步擴大佔領區。"
 PER_demand_war_reparations: "要求戰爭賠款"
 PER_demand_war_reparations_desc: "儘管入侵者盡了最大努力，但他們未能實現目標，反而我們開始贏得戰爭。我們必須立即提出要求，讓他們為所造成的破壞付出代價。"
 PER_force_white_peace: "強制達成無條件和平"
 PER_force_white_peace_desc: "敵軍的入侵計劃並未按預期進行。由於我們強烈的抵抗和不屈的意志，他們未能在[PER.GetNonIdeologyName]獲得多少進展。鑑於他們的困難，我們有條件向這些大膽的入侵者施壓，達成無條件和平。"
 PER_dig_and_defend: "掘壕固守"
 PER_dig_and_defend_desc: "隨著敵軍從四面八方湧入我國的邊境，我們必須迅速行動，拯救[PER.GetNameDef]。與其進攻，不如加強防禦，給入侵者製造麻煩。否則我們將面臨巨大的損失。"
 PER_capital_protect: "[PER.Capital.GetCapitalVictoryPointName]防務"
 PER_capital_protect_desc: "鑑於[PER.Capital.GetCapitalVictoryPointName]的位置，它是構建堅固防線的理想之地。通過在此建立碉堡和防禦據點，我們能夠成為[PER.GetNameDef]最後希望的堡壘。"
 PER_secure_coastline: "保衛海岸線"
 PER_secure_coastline_desc: "入侵預計將從波斯灣展開，讓我們直面敵人，阻止其在[PER.GetNonIdeologyName]獲得立足之地。如果我們能阻止他們建立灘頭陣地，就能牢牢掌控局勢，將敵人擊潰。"
 PER_swear_fealty: "向入侵者宣誓效忠"
 PER_swear_fealty_desc: "儘管我們盡力保護[PER.GetNameDef]，但未能阻止敵人的攻勢。當敵軍接近我們的首都時，我們應儘快結束戰爭，主動提出成為附庸國。這樣至少可以避免國家遭受進一步的破壞。"
 PER_push_negotiations: "推動談判"
 PER_push_negotiations_desc: "就目前的情況來看，我們已經儘可能地擊退了入侵者，但目前我們並不具備直接結束衝突的能力。然而，我們可以利用天然資源作為籌碼，爭取保持主權。"
 PER_rebuilding_iran: "重建[PER.GetNonIdeologyName]"
 PER_rebuilding_iran_desc: "遭受入侵導致我們的工業和基礎設施嚴重受損。我們應利用此時機，集中精力重建我們的國家，恢復昔日的輝煌，從廢墟中拾起希望並療愈創傷。"
 PER_declare_loyalty_to_britain: "向[ROOT.OVERLORD.GetNameDef]宣誓效忠"
 PER_declare_loyalty_to_britain_desc: "作為[ROOT.OVERLORD.GetNameDef]的新附庸，我們必須謹慎行事，順從宗主國的意願。這也許是我們完成現代化進程的機會。道路雖然曲折，但終點一致。"
 PER_invite_british_investors: "邀請[ROOT.OVERLORD.GetAdjective]投資者"
 PER_invite_british_investors_desc: "為了改善經濟並在遭受入侵後進行重建，我們可以嘗試遊說[ROOT.OVERLORD.GetNameDef]向我們提供投資，以幫助我們恢復工業生產。"
 PER_request_british_equipment: "請求[ROOT.OVERLORD.GetAdjective]裝備"
 PER_request_british_equipment_desc: "我們的軍隊在入侵中受到了嚴重損耗，急需補充物資。作為[ROOT.OVERLORD.GetNameDef]的新附庸，我們有充分理由請求支援，以恢復軍隊的戰鬥力。"
 PER_our_place_in_empire: "我們在[ROOT.OVERLORD.GetNameDef]的地位"
 PER_our_place_in_empire_desc: "與[ROOT.OVERLORD.GetAdjective]政府討論後，我們決定由[PER.GetLeader]擔任[PER.GetNonIdeologyName]的新任總督，同時保留其現有職位。這將賦予我們更大的靈活性，履行作為[ROOT.OVERLORD.GetNameDef]的一員的職責。"
 PER_retake_north_iran: "收復[PER.GetNonIdeologyName]的北方"
 PER_retake_north_iran_desc: "在我們最初投降並請求和平時，不得不將北方領土割讓給[SOU.GetNameDef]。現在，我們已積蓄力量，是時候對入侵者發動反擊，收復屬於我們的土地了。"
 PER_azadi: "阿扎迪"
 PER_azadi_desc: "阿扎迪是波斯語中“自由”的意思，也是我們準備對佔領者反抗的戰鬥口號。[ROOT.OVERLORD.GetNameDefCap]期望我們屈服，但我們始終以捍衛主權為目標。我們也許輸了這場戰役，但我們仍將繼續戰鬥。"
 PER_reinforce_iranian_identity: "強化[PER.GetAdjective]身份認同"
 PER_reinforce_iranian_identity_desc: "儘管我們不得不向敵人屈服，但我們仍然是[PER.GetAdjective]人，沒有人能夠奪走這一點。我們必須向人民強化這一身份認同，證明我們對自由的渴望仍然熾熱。"
 PER_rally_bakhtiari_and_qashqai: "團結巴赫提亞里族和卡什加族"
 PER_rally_bakhtiari_and_qashqai_desc: "對新政權不滿的巴赫提亞里族和卡什加族的部落民已經開始抵抗現行法律。我們可以利用這一點，將他們爭取到我們的陣營，為我們的獨立鬥爭提供更多支持。"
 PER_iran_for_iranians: "[PER.GetAdjective]人的[PER.GetNonIdeologyName]"
 PER_iran_for_iranians_desc: "向帝國主義宗主國投降並割讓領土是我們的恥辱，但有一點是毋庸置疑的：我們的自治願望永遠不會消亡。現在，是我們起義並宣告獨立的時刻！"
 PER_consolidate_british_territory: "清除[ENG.GetAdjective]的勢力"
 PER_consolidate_british_territory_desc: "[ENG.GetNameDef]在中東存在已久，但這片土地並不屬於他們。現在我們為獨立而戰，也應幫助該地區的其他國家擺脫[ENG.GetNameDef]的統治，轉而受到我們的保護。"
 PER_assessing_the_opposition: "評估反對派"
 PER_assessing_the_opposition_desc: "在考慮將版圖擴展到伊朗以外之前，我們必須首先審視內部問題。政府內的不少反對派對現狀越來越不滿。如果我們希望獲得人民的支持以重建帝國，就必須以任何必要手段確保政府內部的統一。"
 PER_assessing_the_opposition_tt: "在§Y內亂§!任務中從§Y偉業的遺產§!解鎖決議§Y政府鎮壓§!，使我們能夠控制威脅並防止內戰爆發。"
 PER_rally_the_reformers: "建立民族陣線"
 PER_rally_the_reformers_desc: "全國各地不乏希望推翻沙阿或君主制本身的派系。隨著世界局勢日益不穩定，某些機會的出現可能使這些派系蠢蠢欲動。"
 PER_lobby_military_dissidents: "伊朗人民黨軍事網絡"
 PER_lobby_military_dissidents_desc: "伊朗人民黨在軍隊中擁有許多有權勢的成員。或許我們可以將他們爭取到我們的陣營，在時機成熟時利用他們削弱沙阿的統治。"
 PER_promise_clergy_power: "向神職人員承諾權力"
 PER_promise_clergy_power_desc: "對許多人民來說，伊斯蘭教是社會的基石。如果我們開始貶低信仰實踐者，就不可能繼續獲得人民的支持。我們必須採取更多措施，爭取他們的支持。"
 PER_exclude_religion: "排除宗教影響"
 PER_exclude_religion_desc: "伊斯蘭教及宗教在更廣泛的意義上已經成為國家現代化進程中的政治與經濟障礙。我們必須明確表示，這些障礙將在新的[ROOT.GetNonIdeologyName]中被克服。"
 PER_stage_mass_protests: "組織抗議活動"
 PER_stage_mass_protests_desc: "人民已經受夠了沙阿的藉口和精英階層的既得利益。現在是我們走上街頭，要求立即變革的時候了。"
 PER_stage_mass_protests_tt: "解鎖決議§Y$PER_mass_protests$§!，允許我們降低沙阿的支持率。"
 PER_constitutional_monarchy: "恢復憲法對沙阿權力的限制"
 PER_constitutional_monarchy_desc: "沙阿的權力在國家政治中長期居於主導地位，但若直接廢除君主制將動搖許多仍然相信其神聖角色的人心。因此，我們將限制沙阿干涉政治事務的能力，並將這一職位降為禮儀性角色。"
 PER_strengthen_iranian_parliament: "加強伊朗議會"
 PER_strengthen_iranian_parliament_desc: "隨著沙阿權力受到制約，我們可以通過將權力交還給議會這一民選機構，改進我們的民主進程。"
 PER_strengthen_iranian_parliament_tt: "\n\n§R如果民主黨派支持率低於30%，沙阿將對我們發動內戰！§!\n\n§R如果內戰爆發，你將無法採取伊斯蘭革命線路的部分國策。§!"
 PER_continue_westernization: "繼續西化"
 PER_continue_westernization_desc: "西化一直是我們領導層潛在的目標之一。許多人渴望效仿西方主要國家，採納其意識形態和實踐。如果我們希望未來與這些國家接軌，現在就必須為這種整合做好準備。"
 PER_royal_college_funding: "建立德黑蘭大學"
 PER_royal_college_funding_desc: "保持智力發展的領先地位對我們至關重要。把我們從國王的錢袋裡拿出來的一部分資金投入教育機構，我們將能跟上迅速變化的技術發展潮流。"
 PER_expand_oil_production: "擴大石油生產"
 PER_expand_oil_production_desc: "[PER.GetNonIdeologyName]擁有豐富的石油資源，而我們若不加以利用，將是巨大的失策。讓我們擴大石油產量，以便在未來與西方進行談判時佔據有利地位。"
 PER_increase_oil_sales: "增加石油銷售"
 PER_increase_oil_sales_desc: "既然我們已與[ENG.GetNameDef]就石油儲備建立了合作關係，利用新開採的資源增加銷售量是合乎邏輯的。這畢竟是互惠互利的協議。"
 PER_request_membership_allies: "申請加入同盟國"
 PER_request_membership_allies_desc: "隨著全球緊張局勢的加劇，是時候選擇一方陣營了。鑑於我們與西方的關係日益密切，與他們結盟顯然是最合理的選擇。共同消滅法西斯主義的威脅，造福全世界。"
 PER_secure_iraq: "控制伊拉克"
 PER_secure_iraq_desc: "作為同盟國的責任之一，我們必須通過一切必要手段確保[IRQ.GetNameDef]的安全。這一重大舉措旨在保護[IRQ.GetAdjective]人民免受外部威脅，同時促進該地區的團結。"
 PER_secure_afghanistan: "控制阿富汗"
 PER_secure_afghanistan_desc: "[AFG.GetNameDefCap]是[PER.GetNameDef]通往東方的開放門戶之一。為盟友確保這條走廊至關重要，同時也能讓[AFG.GetNameDef]在我們的保護下更加安全。這無疑是為了[AFG.GetAdjective]人民的利益。"
 PER_post_war_spoils: "戰後戰利品"
 PER_post_war_spoils_desc: "戰爭結束後，我們需要決定如何處理對[IRQ.GetNonIdeologyName]和[AFG.GetNonIdeologyName]的保護性佔領。經過向盟友的請願，我們認為將這些領土整合到[PER.GetNameDef]的治理下是最好的選擇，以此確保中東的更強穩定與團結。"
 PER_follow_the_tudeh: "團結在伊朗人民黨周圍"
 PER_follow_the_tudeh_desc: "伊朗人民黨是唯一真正體現人民渴望徹底變革，而非當前政權裝點門面的民主表象的政黨。因此，我們必須團結在它周圍，使其成為這場激進運動的核心。"
 PER_rally_behind_mosaddegh: "支持穆罕默德·摩薩臺"
 PER_rally_behind_mosaddegh_desc: "自巴列維政權開始以來，穆罕默德·摩薩臺就以反對沙阿的許多政策而聞名。如果我們真心希望反對巴列維王朝並創建一個更民主的[PER.GetNonIdeologyName]，或許他正是我們需要爭取的領袖。"
 PER_reach_to_seperatists: "爭取分裂主義者"
 PER_reach_to_seperatists_desc: "工人階級尚未完全意識到自身的社會經濟狀況，因此缺乏推翻沙阿根深蒂固的政權的力量。然而，北部和東部地區許多人因阿塞拜疆或庫爾德民族主義而激憤不已，他們或許可以被爭取到我們的陣營。"
 PER_reach_to_seperatists_tt: "所有擁有§Y庫爾德斯坦§!或§Y阿塞拜疆§!的核心的地區將加入我們，並在即將到來的內戰中提供部隊。\n\n§R但作為補償，他們期望在完成此決議後的兩年內獲得獨立！§!"
 PER_embrace_national_front: "走向共和"
 PER_embrace_national_front_desc: "政治權力和決策不再能集中於未被選舉產生、未被問責的沙阿或其繼承人手中。我們必須廢除整個君主制度，朝著建立[ROOT.GetAdjective]共和國的方向邁進。"
 PER_force_abdication: "強迫退位"
 PER_force_abdication_desc: "面對人民的大規模反對，沙阿及其親信已經搖搖欲墜。現在正是我們利用優勢，迫使他退位的最佳時機，並徹底終結這一封建制度。"
 PER_force_abdication_tt: "\n§R如果在野黨派支持率高於50%，沙阿將對我們發動內戰！§!"
 PER_nationalize_oil_fields: "油田國有化"
 PER_nationalize_oil_fields_desc: "多年來，我們的石油一直被用來與貪婪的國家達成不公平的交易。現在是[PER.GetNameDef]將石油生產國有化的時候了，這意味著我們將終於完全掌控本國的自然資源。"
 PER_free_elections: "自由選舉"
 PER_free_elections_desc: "隨著我們新政府的逐步成型，現在是時候選出一位總理來引領[PER.GetNameDef]邁向民主的黃金時代了！"
 PER_free_elections_tt: "我們可以選擇哪位§Y候選人§!最適合領導§Y民主的[PER.GetNonIdeologyName]。§!"
 PER_united_progressive_parties: "統一進步黨"
 PER_united_progressive_parties_desc: "隨著沙阿的退位，我們有機會為[ROOT.GetNonIdeologyName]打造一個更加進步的未來。但要實現這一目標，我們必須團結所有進步黨派，形成一個強大的聯盟，以推進我們的議程。"
 PER_strengthen_the_tudeh: "加強伊朗人民黨"
 PER_strengthen_the_tudeh_desc: "伊朗人民黨已成為[ROOT.GetAdjective]工人階級的先鋒力量，帶領他們戰勝沙阿。現在，他們必須被賦予權力，實施社會主義政策，將人民從帝國主義和資本主義的束縛中解放出來。"
 PER_soviet_alignment: "與蘇聯結盟"
 PER_soviet_alignment_desc: "世界正在迅速變化，我們需要強大的盟友來威懾敵人。伊朗人民黨是唯一與[SOU.GetNameDef]建立聯繫的社會主義政黨，可以與他們建立牢固的關係。"
 PER_soviet_alignment_tt: "如果§Y[SOV.GetNameWithFlag]§!是共產主義，其將被邀請加入我們的陣營。"
 PER_industrial_aid: "工業援助"
 PER_industrial_aid_desc: "我們的[SOU.GetNameDef]同志已證明，通過精心計劃，主要依賴農業的經濟可以迅速實現工業化。我們應尋求他們的援助，看看他們是否願意分享這一方面的經驗。"
 PER_workers_army: "人民的軍隊"
 PER_workers_army_desc: "軍隊裡到處都是反革命的狂熱分子，等待著機會來恢復他們對這個國家的陳舊理念。我們必須改革軍隊，從驅逐反動派開始，防止這種情況發生。"
 PER_elevate_the_iran_party: "壯大伊朗黨"
 PER_elevate_the_iran_party_desc: "伊朗人民黨將使我們的國家被[SOU.GetNameDef]束縛，聽命於[SOU.Capital.GetCapitalVictoryPointName]。若我們希望建立一條伊朗特色的社會主義道路，所有進步人士都必須與伊朗黨站在一起。"
 PER_iranian_socialism: "伊朗社會主義"
 PER_iranian_socialism_desc: "為了確保國家的長期安全，我們必須與區域內志同道合的政權建立新的聯盟。"
 PER_iranian_industrialization: "工業化"
 PER_iranian_industrialization_desc: "我們不會依賴外國勢力來實現經濟現代化。相反，我們將利用人民未被開發的潛力，找到一條屬於自己的現代化道路。"
 PER_international_solidarity: "國際團結"
 PER_international_solidarity_desc: "儘管我們已擺脫國內的帝國主義枷鎖，但只有當帝國主義勢力從我們地區被連根拔起時，我們才能真正自由。然而，我們尚未做好與之全面對抗的準備。因此，我們將開始削弱他們的勢力範圍。"
 PER_appease_the_seperatists: "安撫分裂主義者"
 PER_appease_the_seperatists_desc: "履行我們對阿塞拜疆人和庫爾德人的義務，賦予他們更大的自治權，如今恰逢時機。然而，我們應努力將他們維繫在我們的勢力範圍內，以共同維護集體安全。"
 PER_appease_the_seperatists_tt: "§G完成此目標後，我們將不再面臨獨立戰爭的風險。§!"
 PER_communist_industrialization: "經濟規劃委員會"
 PER_communist_industrialization_desc: "我們將設立一個新部門，監督經濟的發展和現代化，擺脫以往經濟部門的偏見與惰性。"
 PER_communist_education_reform: "擴大教育體系"
 PER_communist_education_reform_desc: "我們現有的教育系統已經過時，無法滿足國家的需求。我們需要讓更多的兒童進入課堂，並讓他們在離開學校時掌握更多的實用技能，以便在工作中使用。"
 PER_reject_foreign_dominance: "拒絕受到外國支配"
 PER_reject_foreign_dominance_desc: "[SOU.GetNameDefCap]和[ENG.GetNameDef]都已逼近我們的國門。如果我們不立即採取行動，就很可能淪為他國的附庸。我們必須不再自欺欺人，開始反抗這場大博弈的操盤者。"
 PER_iranian_revolutionary_vanguard: "伊朗革命衛隊"
 PER_iranian_revolutionary_vanguard_desc: "為了在遠強於我們的超級大國面前站穩腳跟，我們必須擴充軍隊並動員全民。雖然這無法使我們與這些威脅對等，但足以讓我們不再是他們腳下的緩衝區。"
 PER_vanguard_template_tt: "創建一個§Y炮兵師編制§!。"
 PER_one_for_all_all_for_one: "人人為我，我為人人"
 PER_one_for_all_all_for_one_desc: "每一個[PER.GetAdjective]人都必須接受全面武裝訓練，時刻準備保衛人民。沒有人能逃避這一義務。我們在大博弈中唯一的生存機會，就是要把動員速度提升到讓[ENG.GetNameDefCap]和[SOU.GetNameDef]都望塵莫及的地步。"
 PER_comintern_research_collaboration: "共產國際科研合作"
 PER_comintern_research_collaboration_desc: "[SOU.GetNameDefCap]是全球科研的領先者之一。隨著與他們的同盟建立，我們獲得了一個難得的機會，派遣科學家前往學習[SOU.GetAdjective]的尖端技術與知識，並將[SOU.GetAdjective]的先進科技帶回國內。"
 PER_land_reform: "土地改革"
 PER_land_reform_desc: "隨著革命的勝利，我們將實施深遠的土地改革，將經濟從封建主義的枷鎖中解放出來。"
 PER_soviet_iranian_oil_collaboration: "蘇聯-伊朗石油合作"
 PER_soviet_iranian_oil_collaboration_desc: "[ROOT.GetNameDefCap]與我們在[SOU.GetNameDef]的邊境朋友擁有巨大的石油儲備。通過協調與擴大石油產出，我們可以牢牢掌控這一世界上最重要的資源。"
 PER_iranian_nuclear_program: "[ROOT.GetAdjective]核武器計劃"
 PER_iranian_nuclear_program_desc: "開啟我國原子武器研發計劃，是[ROOT.GetNameDef]從一個弱小無名國家邁向世界強國命運的關鍵一步。"
 PER_iranian_culture: "團結極端民族主義者"
 PER_iranian_culture_desc: "儘管政治家和沙阿不斷髮表豪言壯語，但沒有人願意採取必要的措施保護我們的文化遺產與領土完整。我們要把各執一詞的作家和民族主義者聯合起來，開展一場新的政治運動，重建國家的輝煌。"
 PER_ally_the_bazaari: "拉攏精英"
 PER_ally_the_bazaari_desc: "[PER.GetAdjective]的精英們對國家的未來走向愈發感到不安。許多人擔心自己的企業或資產的前景，或許他們願意支持我們的事業，以換取自身免受政治動盪影響的保障。"
 PER_brown_shirts: "衝鋒隊遊行"
 PER_brown_shirts_desc: "最近，我們黨的大量成員已經開始穿上歐洲法西斯運動的棕襯衫制服。也許我們可以將這些忠誠的成員組織起來，通過大規模遊行來為運動爭取支持。"
 PER_march_on_saadabad: "向薩德阿巴德宮進軍"
 PER_march_on_saadabad_desc: "現政權未能解決我們的不滿，因此我們將遊行至薩德阿巴德宮向沙阿遞交最後通牒。沙阿要麼順從改變路線並繼續擔任君主，要麼面臨我們運動的怒火。"
 PER_roll_back_reforms: "復興國家"
 PER_roll_back_reforms_desc: "雖然沙阿在現代化方面取得了一些進展，但改革遠遠不夠。我們將推動一項更深入、更激進的議程，使我們重返輝煌。"
 PER_fascist_secularism: "推行世俗主義"
 PER_fascist_secularism_desc: "波斯帝國被強制改宗為伊斯蘭教摧毀了我們曾經偉大的文化。我們必須迴歸真正的傳統，拒絕將這一外來宗教侵入公共生活的任何方面，並嚴格推行世俗主義。"
 PER_form_savama: "設立秘密警察"
 PER_form_savama_desc: "那些背棄我們文化或為外國勢力工作的叛徒必須儘快被清除。為此，我們將設立一支新的特別警察部隊。"
 PER_fascist_reach_out_to_germany: "向西方靠攏"
 PER_fascist_reach_out_to_germany_desc: "隨著我們捲入某種全球衝突的可能性日益增加，也許我們應該與[GER.GetNameDef]這樣的志同道合的政權結盟。"
 PER_fascist_reach_out_to_japan: "向東方靠攏"
 PER_fascist_reach_out_to_japan_desc: "[JAP.GetAdjective]人知道如何在保護文化免受西方化侵蝕的同時實現現代化的鬥爭。我們應該與他們結盟，以打破西方對全球權力的束縛。"
 PER_pan_iranianism: "泛伊朗主義"
 PER_pan_iranianism_desc: "我國境外，仍有許多伊朗民族的族群散落各地，這種情況不能繼續下去。現在是時候推動一個大伊朗民族認同，並開始促進我們民族的統一。"
 PER_anti_soviet_resistance_network: "反對[SOU.GetAdjective]的抵抗"
 PER_anti_soviet_resistance_network_desc: "無論他們如何粉飾，事實是[SOU.GetNameDef]不過是另一個俄羅斯帝國，而許多伊朗民族仍被困在他們專制的枷鎖之下。我們必須採取更多行動來削弱他們的權威，並促進我們人民的解放。"
 PER_intervene_in_central_asia: "保護大伊朗僑民"
 PER_intervene_in_central_asia_desc: "我們已經削弱了[SOU.GetAdjective]對中亞的控制。此外，他們正因全球衝突分散了注意力。因此，我們應利用這一時機，將他們徹底趕出該區域。"
 PER_proclaim_greater_iran: "宣佈大伊朗的誕生"
 PER_proclaim_greater_iran_desc: "我們的各處疆域已經恢復到應有的位置，我們的人民也已擺脫了外國統治的暴政。現在我們終於可以宣佈大伊朗的誕生，這將是一個經得起時間考驗的國家。"
 PER_fascist_attack_turkey: "遏制[TUR.GetAdjective]威脅"
 PER_fascist_attack_turkey_desc: "[TUR.GetAdjective]人及其前身奧斯曼帝國，長期以來不斷蠶食我們的邊界，腐化我們的文化，同時還佔據了本應屬於我們人民的土地。我們必須糾正這一歷史不公。"
 PER_intervention_in_iraq: "干涉[IRQ.GetNonIdeologyName]"
 PER_intervention_in_iraq_desc: "[IRQ.GetNonIdeologyName]不過是西方帝國主義者在地圖上隨意繪製邊界的構想。這種國家不可持續，理應歸還其合法的主人——我們。"
 PER_crush_saudi_arabia: "整合戰爭經濟"
 PER_crush_saudi_arabia_desc: "我們最近的征服為我們帶來了大量的工業設備和人員，這些資源可以運回國內加以利用。不過，這將需要大量的列車來完成運輸任務。"
 PER_fascist_attack_afghanistan: "對抗阿富汗"
 PER_fascist_attack_afghanistan_desc: "大量的伊朗族群被困在我們邊界之外，受制於[AFG.Capital.GetCapitalVictoryPointName]的普什圖人。這種對我們領土完整的侮辱不再能被容忍。"
 PER_modify_opposition_tt: "§Y$PER_opposition_modifier$§!追加效果："
 PER_communist_afghanistan_intervention: "擾亂大博弈"
 PER_communist_afghanistan_intervention_desc: "[ENG.GetAdjective]和[SOU.GetAdjective]已為[AFG.GetNonIdeologyName]的地位爭執了近一個世紀。我們將在那裡扶植一個共產主義政權，打破當前平衡，使局勢對我們有利。"
 PER_communist_liberate_pashtuns: "支持普什圖民族主義"
 PER_communist_liberate_pashtuns_desc: "將[AFG.GetNonIdeologyName]納入我們的勢力範圍後，我們可以通過促進大普什圖民族主義，去動搖[ENG.GetAdjective]邊境地區的穩定。"
 PER_communist_liberate_pashtuns_tt: "解鎖更多§Y$PER_gulf_decisions_cat$§!的決議，讓我們在阿富汗-伊朗邊境地區促進反殖民抵抗運動。"
 PER_communist_destabilize_iraq: "破壞北伊拉克的穩定"
 PER_communist_destabilize_iraq_desc: "[ENG.GetAdjective]十分依賴[IRQ.GetNonIdeologyName]的石油。我們可以在該國北部推動庫爾德人叛亂，並與他們結盟，來破壞英國對石油的獲取。"
 PER_communist_destabilize_iraq_tt: "解鎖§Y$PER_gulf_decisions_cat$§!決議，推動庫爾德叛亂。"
 PER_communist_kurdish_uprising: "準備庫爾德叛亂"
 PER_communist_kurdish_uprising_desc: "TODO"
 PER_revolution_in_the_gulf: "海灣革命"
 PER_revolution_in_the_gulf_desc: "該地區的權力平衡正朝有利於我們的方向移動。我們必須抓住機會，開始在這裡推動更大的反殖民運動。"
 PER_revolution_in_the_gulf_tt: "解鎖更多§Y$PER_gulf_decisions_cat$§!決議，推動被佔領的波斯灣地區的抵抗。"
 PER_hormuz_crisis: "霍爾木茲危機"
 PER_hormuz_crisis_desc: "帝國主義者已經陷入劣勢，現在是時候在所有戰線上對他們施壓，將他們徹底趕出該區域。首先，我們將封鎖霍爾木茲海峽，切斷帝國主義列強的航運路線。"
 PER_hormuz_crisis_tt: "§Y所有在阿拉伯或波斯灣地區擁有殖民地的列強將收到一項事件，要求他們撤出該區域。如果他們拒絕，我們將有機會向他們宣戰。§!"
 PER_communist_gulf_hegemony: "波斯灣霸權"
 PER_communist_gulf_hegemony_desc: "我們完成了曾被視為不可能的任務，徹底驅逐帝國勢力出波斯灣。如今，我們已成為該區域事實上的強權，並可以自由地施加我們的影響，而不受外部干涉。"
 PER_communist_propaganda: "伊朗國家廣播電臺"
 PER_communist_propaganda_desc: "將廣播電臺收歸國有，並整合為一個單一的公共廣播機構，使我們能夠快速引導公眾輿論，使其與國家政策保持一致。"
 PER_communist_propaganda_tt: "解鎖決議§Y$PER_national_iranian_radio$§!，以提高穩定度、戰爭支持度和政黨支持率。"
 PER_the_new_economy: "新經濟"
 PER_the_new_economy_desc: "隨著我們的改革推進，一個基於人民需求而非市場波動的新經濟體系終於開始成形。雖然仍有許多工作要做，但我們可以自豪地說，我們正在[ROOT.GetNameDef]建設社會主義。"
 PER_oil_and_rubber_industry: "產業多元化"
 PER_oil_and_rubber_industry_desc: "儘管我國擁有豐富的石油資源，但我們不應讓經濟完全依賴石油出口。因此，我們必須推動產業多元化，生產適應於國內消費的產品。"
 PER_the_peoples_airforce: "人民革命空軍"
 PER_the_peoples_airforce_desc: "如果我們要確立自己的地區強國地位，就必須控制波斯灣。為此，我們將建立一支人民空軍，以對抗帝國主義勢力的海上霸權。"
 PER_communist_air_defense: "防空計劃"
 PER_communist_air_defense_desc: "我們絕不能讓帝國主義列強通過空襲摧毀我們建立的一切。因此，我們將在全國範圍內打造一系列防空設施。"
 PER_communist_basic_plane_design: "空軍合作"
 PER_communist_basic_plane_design_desc: "我們的空軍改革已經初見成效，現在我們必須專注於開發專門打擊艦船的技術與戰術。也許，我們可以藉助海外同志的幫助來加快這一進程。"
 PER_communist_naval_bomber_design: "[SOU.GetAdjective]-[ROOT.GetAdjective]轟炸機設計"
 PER_communist_naval_bomber_design_desc: "在[SOU.GetAdjective]同志的幫助下，我們即將完成一支海軍轟炸機部隊，任何膽敢未經許可駛入波斯灣的海軍都將被徹底摧毀。"
 PER_challenge_the_royal_navy: "挑戰英國艦隊"
 PER_challenge_the_royal_navy_desc: "我們現在已經掌握了挑戰主要對手的技術與理論知識，但缺乏實際作戰經驗。也許，我們可以在波斯灣發起小規模挑釁行動，以獲取更多作戰經驗？"
 PER_the_peoples_navy: "人民革命海軍"
 PER_the_peoples_navy_desc: "我們無法在水面戰場上挑戰帝國主義列強的水面艦隊，但我們可以開發一種專門設計的潛艇來做到這一點。"
 PER_communist_shore_defense: "沿海防禦計劃"
 PER_communist_shore_defense_desc: "在我國沿海地區建立強大的海軍防禦體系，將極大地威懾任何膽敢登陸我國領土的侵略者。"
 PER_communist_naval_designs: "海軍合作"
 PER_communist_naval_designs_desc: "我們的海軍改革正在取得進展，但我們需要加倍努力，並開始發展潛艇技術。或許，我們的外國同志願意在這方面提供援助？"
 PER_communist_submarine_design: "[SOU.GetAdjective]-[ROOT.GetAdjective]潛艇研發"
 PER_communist_submarine_design_desc: "在與[SOU.GetAdjective]同志的合作下，我們即將完成最先進的潛艇研發工程，這將使我們主宰波斯灣海域。"
 PER_eastern_expansion: "向東擴張"
 PER_eastern_expansion_desc: "近年來，世界格局發生了巨大變化，而我們東方的政權卻依舊脆弱且容易崩潰。這種機會可能不會再來，我們必須趁此時機將他們納入我們的勢力範圍。"
 PER_curtail_pan_arabism: "遏制泛阿拉伯主義"
 PER_curtail_pan_arabism_desc: "中東與北非的阿拉伯民族正日益形成泛阿拉伯團結意識。我們不能允許他們在我們家門口成為一股統一的力量，因此必須先發制人，防止這一趨勢演變為現實。"
 PER_there_can_be_only_one: "唯我獨尊"
 PER_there_can_be_only_one_desc: "雖然我們與[GER.GetNameDef]有許多相同的價值觀，但他們越來越表現出自視甚高，認為自己凌駕於所有國家之上。這是對我們民族和文化的侮辱，我們必須用武力糾正他們的錯誤認知。"
 PER_iran_first: "[ROOT.GetNonIdeologyName]至上"
 PER_iran_first_desc: "唯有伊朗人民自己，才能真正保護我們的價值觀與文化。因此，我們將追求自己的目標，並讓全世界服從我們的意志。"
 PER_propagate_political_literature: "建立地方反對派團體"
 PER_propagate_political_literature_desc: "帝國的制度看似堅不可摧，但實際上，它的資源在整個國家的範圍內被分散得極為薄弱，難以應對分散式抵抗運動。為了推動變革，我們必須利用這一弱點。"
 PER_propagate_political_literature_tt: "解鎖決議§Y$PER_mass_protests$§!，允許我們在各地區建立反對派團體，使他們在未來可能的§R內戰§!中不會支持沙阿。"
 PER_brown_shirts_tt: "§Y在對抗沙阿的內戰或轉向法西斯主義時，我們將獲得[?ROOT.PER_fascist_militia_count]支民兵師。§!"
 PER_rally_the_reformers_tt: "解鎖決議§Y$PER_mass_protests$§!，建立我們反對派運動的據點。"
 PER_fascism_sway_the_rich_idea_tt: "內戰爆發或法西斯勢力掌權時，我們將獲得以下理念："
 PER_finding_a_shah: "尋找新的沙阿"
 PER_finding_a_shah_desc: "隨著巴列維王朝的覆滅，我們有機會在太陽王座上扶持一位更順從的沙阿，讓他聽從備受信任的顧問們的明智建議。"
 PER_finding_a_shah_tt: "後續事件中，我們將能夠選擇[ROOT.GetNameDef]的新任沙阿。"
 PER_form_sumka: "成立伊朗國家社會主義工人黨"
 PER_form_sumka_desc: "達烏德·蒙希扎德近期在[GER.GetNameDef]生活，深入瞭解了當地的國家社會主義運動。如今，他即將返回伊朗，藉助當下的民族主義浪潮，開創一個伊朗的新秩序。"
 PER_form_arya_party: "成立雅利安黨"
 PER_form_arya_party_desc: "哈桑·阿爾法一直是忠誠的軍官，並堅定地捍衛沙阿，視其為真主在世的反映。然而，他或許可以藉助日益高漲的民族主義情緒，推動國家進行激進改革，甚至超越沙阿最瘋狂的夢想。"
 PER_iranian_socialist_revolution: "伊朗社會主義革命"
 PER_iranian_socialist_revolution_desc: "工人階級終於迎來了起義的時刻！我們將徹底粉碎軟弱無能的沙阿政權及其資產階級爪牙，建立一個由人民當家作主的工農國家！"
 PER_iranian_socialist_revolution_tt: "\n§R如果共產黨支持率低於50%，沙阿將對我們發動內戰！§!"
 PER_islamic_restoration: "抵制西化"
 PER_islamic_restoration_desc: "近年來，西化狂潮正侵蝕著我們伊斯蘭文化的根基，並對整個伊朗社會造成影響。因此，政府必須採取更多措施，限制西方腐朽文化和無神論意識形態的傳播。"
 PER_ally_bazaari: "拉攏巴扎集市的商人"
 PER_ally_bazaari_desc: "巴扎集市及其商人，數個世紀以來一直是我們社區的支柱。然而，那些工業強國的跨國公司正日益對他們施加壓力。如果我們推行保護商人的政策，他們很可能會加入我們的保守主義陣營。"
 PER_islamic_solidarity: "伊斯蘭兄弟會"
 PER_islamic_solidarity_desc: "儘管我們未必能與遜尼派或其他伊斯蘭教派的教義完全一致，但我們必須承認，我們有著共同的敵人——那些來自西歐的帝國主義列強，他們仍在干涉我們的國家事務。但只要我們團結一致，必能將他們徹底趕出我們的土地！"
 PER_promote_resistance_levant: "反帝國主義抵抗"
 PER_promote_resistance_levant_desc: "我們在對抗帝國主義的鬥爭中，常常因敵方強大的軍事力量而嚴重受挫。然而，願意在敵後拿起武器的人不在少數。"
 PER_entice_foreign_investment: "吸引外國投資"
 PER_entice_foreign_investment_desc: "鑑於我國豐富的自然資源以及亟待就業、不斷增加的城市人口，我們的經濟有很大的增長潛力。然而，為了啟動那樣的經濟增長，我們需要大量來自海外的投資。"
 PER_increase_faculty_staffing_budget: "增加人員預算"
 PER_increase_faculty_staffing_budget_desc: "如果我們要保持技術優勢不落後，就必須確保吸引國內最優秀的人才。代價或許高昂，但技術停滯的代價將更為沉重。"
 PER_increase_faculty_staffing_budget_tt: "§Y$PER_technological_modifier$§!追加效果：\n"
 PER_invest_in_univerity_facilities: "投資大學設施"
 PER_invest_in_univerity_facilities_desc: "如果我們希望在科技領域保持競爭力，就必須確保學生、教授和科學家都能獲得良好的科研條件。我們絕不能讓自己最傑出的人才因缺乏合適的設備等無謂的障礙而受到限制。"
 PER_islamic_revolution: "伊斯蘭革命"
 PER_islamic_revolution_desc: "沙阿的統治時日已屈指可數。清真寺內迴響著變革的呼聲，街道不再順從他的指令。舊秩序即將崩潰。"
 PER_reinstate_qajars: "恢復卡扎爾王朝"
 PER_reinstate_qajars_desc: "卡扎爾王朝是[PER.GetNameDef]在巴列維家族統治前的最後一個王朝。1925年禮薩·沙·巴列維本人廢黜該王朝後，其王位繼承人穆罕默德·哈桑·米爾扎一直流亡於[ENG.GetNameDef]。由於巴列維家族無力維護好[ENG.GetAdjective]在[PER.GetNameDef]的利益，或許是時候恢復卡扎爾王朝，以期取悅我們的新宗主。"
 PER_secularize_the_state: "世俗化國家"
 PER_secularize_the_state_desc: "自我們開始推行西化以來，[PER.GetNameDef]的宗教人士便一直不斷抵制。伊斯蘭教仍是我們的國教，但為了向西方世界證明我們有能力與之比肩，現在是我們將宗教與國家分離、走上現代化道路的時候了。"
 ################
 ##### IRAQ #####
 ################
 IRQ_decouple_from_the_pound: "與英鎊脫鉤"
 IRQ_decouple_from_the_pound_desc: "我們的貨幣仍然與英鎊掛鉤，這嚴重限制了我們推行符合自身需求的經濟政策。我們必須打破這一束縛，建立自己的貨幣管理機構，確保我國自主控制第納爾。"
 IRQ_construct_the_kut_barrage: "修建庫特水壩"
 IRQ_construct_the_kut_barrage_desc: "庫特水壩的建設近期遭遇了一些挫折，但我們必須儘快克服困難，以確保底格里斯河沿岸的灌溉水源的充足供應。"
 IRQ_strengthen_mesopotamian_farming: "加強美索不達米亞農業"
 IRQ_strengthen_mesopotamian_farming_desc: "與前朝一樣，[ROOT.GetNonIdeologyName]的國家命脈依賴於底格里斯河與幼發拉底河之間的土地。這片土地極具農業價值，我們應當採用現代化的技術，提高農作物的產量。"
 IRQ_extensive_irrigation_projects: "大規模灌溉工程"
 IRQ_extensive_irrigation_projects_desc: "我國大部分土地乾旱貧瘠，無法用於農業生產。然而，若能實施大規模灌溉工程，我們或許能夠將這些荒地變為肥沃的農田。"
 IRQ_extensive_irrigation_projects_680_tt: "如果我們控制了§Y[680.GetName]§!，該地區將獲得§G1§!個額外建築位"
 IRQ_extensive_irrigation_projects_413_tt: "如果我們控制了§Y[413.GetName]§!，該地區將獲得§G2§!個額外建築位。"
 IRQ_rural_electrification: "農村電氣化"
 IRQ_rural_electrification_desc: "儘管城市電氣化進展順利，但農村人口仍未能享受到現代化電力設施。因此，我們應建立國家電力管理局，確保全國範圍內均衡地推廣電網基礎設施建設。"
 IRQ_found_the_iraqi_state_railways: "[IRQ_found_the_iraqi_state_railways_key]"
 IRQ_found_the_iraqi_state_railways_IRQ: "建立伊拉克國家鐵路"
 IRQ_found_the_iraqi_state_railways_KUR: "建立庫爾德國家鐵路"
 IRQ_found_the_iraqi_state_railways_desc: "[ENG.GetAdjective]仍然通過美索不達米亞鐵路公司控制著我們的鐵路基礎設施，儘管我們名義上已獨立。我們應與他們商議，提出收購該鐵路，並將其更名為伊拉克國家鐵路公司。"
 IRQ_finish_the_berlin_baghdad_railway: "建成柏林-巴格達鐵路"
 IRQ_finish_the_berlin_baghdad_railway_desc: "德意志帝國曾雄心勃勃地計劃修建柏林至巴格達鐵路，以支持他們在波斯灣的海軍存在。這條“金牛座快線”始終未能徹底完工，然而，如果我們可以自主完成該工程的建設，或許能利用這條鐵路帶來的經濟利益。"
 IRQ_purchase_foreign_equipment: "採購國外機械設備"
 IRQ_purchase_foreign_equipment_desc: "儘管我們擁有大片可耕種土地及充足的灌溉資源，但我們仍然缺乏現代化工業國家所使用的機械化農業設備。如果我們投資進口這些機器，我們的農產品產量和工業生產力都將顯著提高。"
 IRQ_found_southern_steel_plants: "成立南方鋼鐵廠"
 IRQ_found_southern_steel_plants_desc: "鋼鐵是經濟發展的關鍵，同時也是軍事裝備製造不可或缺的資源。然而，目前國內缺乏足夠的生產能力來滿足我們的需求，導致我們不得不依賴進口。在全球局勢日益動盪的當下，這種狀況必須改變。"
 IRQ_found_the_state_company_for_iron_and_steel: "國家鋼鐵公司"
 IRQ_found_the_state_company_for_iron_and_steel_desc: "近期的鋼鐵工業投資已帶動經濟增長，並減少了對進口的依賴。然而，我們可以更進一步，建立由國家控制的鋼鐵產業，以掌控這一關鍵原材料的供應。"
 IRQ_baghdad_colleges_of_engineering_and_education: "擴建巴格達的高校"
 IRQ_baghdad_colleges_of_engineering_and_education_desc: "巴格達自古以來便是學術中心，但近年來，隨著西方大學的崛起，它逐漸被忽視。現在是時候投資我們的教育機構，使巴格達再次成為學術中心。"
 IRQ_strengthen_the_iraqi_dinar: "[IRQ_strengthen_the_iraqi_dinar_key]"
 IRQ_strengthen_the_iraqi_dinar_IRQ: "加強伊拉克第納爾"
 IRQ_strengthen_the_iraqi_dinar_KUR: "加強庫爾德第納爾"
 IRQ_strengthen_the_iraqi_dinar_desc: "如今，我們終於從[ENG.GetAdjective]人手中奪回了貨幣控制權，我們可以自主制定有利於國內經濟的貨幣政策。"
 IRQ_heavy_industry_investments: "重工業投資"
 IRQ_heavy_industry_investments_desc: "我們在原材料供應方面取得了一定進展，但要想趕上世界列強，我們必須建立更多的國有重工業企業，或向現有企業提供更多補貼。"
 IRQ_found_company_for_cement: "建立水泥集團"
 IRQ_found_company_for_cement_desc: "為推進我們即將在全國範圍內開展的建設項目，我們必須成立一家國有企業，負責水泥的生產與分銷，這在現代設施中正變得越來越重要。"
 IRQ_expand_the_cotton_industries: "擴展棉花工業"
 IRQ_expand_the_cotton_industries_desc: "棉花產業作為我們經濟的重要組成部分，隨著需求的持續增長，我們必須給予更高關注。"
 IRQ_local_arms_industry: "本土軍工產業"
 IRQ_local_arms_industry_desc: "一旦戰爭爆發，我們將無法依賴外國提供軍事裝備。因此，我們必須迅速建立自己的軍工產業，以便在危機時刻支持軍隊作戰。"
 IRQ_invite_foreign_arms_corporations: "邀請外國公司"
 IRQ_invite_foreign_arms_corporations_desc: "發展本土軍工產業至關重要，但我們缺乏自主研發和生產先進裝備的專業知識。因此，我們應與外國公司合作，在本國建立工廠，實現互利共贏。"
 IRQ_construct_the_dukan_dam: "建設杜坎大壩"
 IRQ_construct_the_dukan_dam_desc: "我們國家的偉大河流不僅應當用於灌溉，還應當用於發電。我們將在小扎布河上修建一座水電站，並打造一個人工湖。"
 IRQ_forceful_industrialization: "強行工業化"
 IRQ_forceful_industrialization_desc: "[ROOT.GetNameDef]當前的工業化進程過於緩慢，若不加快步伐，我們將被敵人遠遠甩在身後。我們必須實施大規模工業化計劃，即便這可能會引起民眾的不滿。"
 IRQ_nationalize_the_anglo_iraqi_oil_company: "國有化英伊石油公司"
 IRQ_nationalize_the_anglo_iraqi_oil_company_desc: "英伊石油公司仍然主導著我們的經濟與外交事務，將我國財富輸送到[ENG.GetAdjective]海軍的軍艦上，而我們卻無法掌控自己的命運。是時候結束這場鬧劇，把公司收歸國有，造福我國的人民。"
 IRQ_anglo_iraqi_oil_expansion: "英伊石油公司擴張"
 IRQ_anglo_iraqi_oil_expansion_desc: "當前與英伊石油公司的合作可能會讓部分民眾不滿，但他們目光短淺，無法理解這種合作對我國經濟的巨大益處，也無法看到[ENG.GetAdjective]人對我們的保護可以帶來的長遠利益。"
 IRQ_form_opec: "成立石油輸出國組織"
 IRQ_form_opec_desc: "世界列強極度依賴石油來維持其工廠運轉和軍隊行動。如果全球產油國聯合起來，共同調控石油生產與安全，我們就可以讓那些列強為他們過去的所作所為付出代價。"
 IRQ_demand_greater_stake_in_the_company: "要求更多的公司股份"
 IRQ_demand_greater_stake_in_the_company_desc: "我們努力確保石油設施的正常運作，為[ENG.GetAdjective]提供了穩定的石油供應。因此，我們理應享有更大比例的石油收益分成，方才公平。"
 IRQ_expand_oil_production: "擴大石油生產"
 IRQ_expand_oil_production_desc: "地質學家認為我國的石油儲量極其豐富。這些資源可以為人民創造大量財富，必須儘快加以開發。"
 IRQ_export_infrastructure: "出口基礎設施"
 IRQ_export_infrastructure_desc: "石油對全球經濟至關重要。若我們加大對石油出口基礎設施的投資，不僅可以提升[ROOT.GetNameDef]在國際市場上的影響力，同時還能帶來豐厚的經濟收益。"
 IRQ_is_kurdistan: "§Y作為庫爾德斯坦遊玩§!"
 IRQ_royal_iraqi_army: "[IRQ_royal_iraqi_army_key]"
 IRQ_royal_iraqi_army_IRQ: "伊拉克皇家陸軍"
 IRQ_royal_iraqi_army_KUR: "庫爾德陸軍"
 IRQ_royal_iraqi_army_desc: "戰爭的威脅越來越近，威脅既來自鄰國也來自遙遠的國度。此外，國內也存在多個可能引發內亂的派系。唯一能夠震懾他們的，就是強大的武裝力量。"
 IRQ_approach_tribes_for_support: "爭取部落的支持"
 IRQ_approach_tribes_for_support_desc: "許多農村社區仍然維持著傳統的部落生活方式。自國家成立以來，他們基本上對我們的政權充滿敵意。也許，我們只是還未找到合適的手段來贏得他們的支持。"
 IRQ_establish_iraqi_coastal_defense_force: "[IRQ_establish_iraqi_coastal_defense_force_key]"
 IRQ_establish_iraqi_coastal_defense_force_IRQ: "建立伊拉克海防部隊"
 IRQ_establish_iraqi_coastal_defense_force_KUR: "建立庫爾德海防部隊"
 IRQ_establish_iraqi_coastal_defense_force_desc: "雖然我們的海岸線很短，但它坐落在全球最重要的石油供應航線之一。因此，我們必須建立一支海軍部隊，以保護我們在該地區的利益。"
 IRQ_invite_foreign_advisors: "邀請外國顧問"
 IRQ_invite_foreign_advisors_desc: "我們缺乏與區域海軍強國正面對抗的經驗。然而，如果能夠邀請外國專家來訓練我們的海軍軍官，我們或許能快速提升戰鬥力。"
 IRQ_purchase_small_ships: "採購小型艦船"
 IRQ_purchase_small_ships_desc: "$SMB_purchase_destroyers_and_subs_desc$"
 IRQ_create_repair_yards: "建立烏姆蓋斯爾深水港"
 IRQ_create_repair_yards_desc: "建設深水港不僅能極大提升我們的貨物出口能力，同時還能為軍艦提供補給和停泊的設施。"
 IRQ_navy_research_bonus: "海軍技術革新"
 IRQ_navy_research_bonus_desc: "迄今為止，我們一直依賴從國外購買的二手艦船，而這些艦船在我們接手之前就已經過時了。為了避免繼續落後，我們必須研究開發自己的海軍技術，並對艦隊進行現代化改造。"
 IRQ_infantry_focus: "加強步兵"
 IRQ_infantry_focus_desc: "列強可以繼續沉迷於他們的機械化怪物，但現實是，任何戰爭最終都要靠步兵來決定勝負。因此，我們必須大幅增加陸軍預算，以提升步兵的訓練水平。"
 IRQ_scavenging: "利用物資收集戰術"
 IRQ_scavenging_desc: "我們無法自主生產的裝備，常常被外國侵略者掌控。因此，我們應該訓練我們的部隊，辨認並奪取那些有價值的軍事裝備。"
 IRQ_cavalry_integration: "整合騎兵"
 IRQ_cavalry_integration_desc: "雖然摩托化部隊可能會成為未來的主流，但在當前階段，我們仍需要騎兵部隊來彌補機動部隊的不足。"
 IRQ_modernization: "努力實現現代化"
 IRQ_modernization_desc: "僅憑陳舊的武器裝備在街頭遊行，也許足以震懾國內不滿分子，但這對外國勢力毫無威懾力。我們必須加速現代化進程，建立一支真正有威懾力的軍隊。"
 IRQ_purchase_mechanized_equipment: "採購機械化裝備"
 IRQ_purchase_mechanized_equipment_desc: "步兵的緩慢行進速度已成為我軍的嚴重短板，尤其是在外國軍隊已經廣泛採用機械化步兵的情況下。我們必須儘快投資機械化裝備，以免被時代淘汰。"
 IRQ_purchase_armored_equipment: "採購裝甲裝備"
 IRQ_purchase_armored_equipment_desc: "由於我們過度依賴傳統步兵，我軍在戰場上的打擊能力明顯不足。坦克無疑是陸戰的未來，我們必須尋找願意向我們出售剩餘坦克的國家。"
 IRQ_training: "瓦什輕武器學校"
 IRQ_training_desc: "[IRQ.GetNonIdeologyName]的部隊訓練方式已經過時。我們需要引進更加先進的訓練制度，以提高士兵的戰鬥素養和作戰能力。因此，我們應在瓦什輕武器學校對士兵進行輕武器和步兵戰術的教育。"
 IRQ_army_research_bonus: "現代化軍事學說"
 IRQ_army_research_bonus_desc: "我軍的許多軍官要麼是前奧斯曼帝國的士兵，要麼接受過[ENG.GetAdjective]部隊的基礎訓練。但不論是哪種情況，他們的戰術思想都已經嚴重過時，必須立即更新。"
 IRQ_special_projects: "圖韋薩核研究中心"
 IRQ_special_projects_desc: "關於原子武器的秘密的傳聞已傳入我國科學家和工程師的耳中，他們迫切希望展示自己的能力。如果我們給予他們充足的資金支持，也許我們能夠開發出威力超出想像的武器。"
 IRQ_special_forces: "特種部隊"
 IRQ_special_forces_desc: "戰爭期間，在某些情況下，少量潛入敵後的特種部隊造成的打擊，甚至可以比正面戰場的整支軍隊還要致命。我們需要有自己的這種軍隊。"
 IRQ_expand_habbaniya_airbase: "擴建哈巴尼亞空軍基地"
 IRQ_expand_habbaniya_airbase_desc: "自[ENG.GetAdjective]建立哈巴尼亞空軍基地以來，這裡就成為了伊拉克空中作戰的心臟。為了容納我們不斷擴大的空軍，我們應該擴建那裡的設施。"
 IRQ_independent_flight_schools: "獨立飛行學校"
 IRQ_independent_flight_schools_desc: "我們的飛行員大多是在國外由[ENG.GetAdjective]培訓的，但隨著我們飛行員數量的大幅增加，我們現在可以開始在國內培訓我們的飛行員了。"
 IRQ_purchase_british_aircraft: "購買英國飛機"
 IRQ_purchase_british_aircraft_desc: "鑑於我們與[ENG.GetAdjective]皇家空軍的良好關係，從他們那裡購買更多飛機似乎非常合理。"
 IRQ_purchase_alternative_aricraft: "購買替代飛機"
 IRQ_purchase_alternative_aricraft_desc: "為了避免過度依賴單一供應方，我們為新興的空軍補充飛機時應該避開[ENG.GetAdjective]。許多軍官認為[ITA.GetAdjective]是合適的選擇。"
 IRQ_bomber_training: "轟炸機訓練"
 IRQ_bomber_training_desc: "我們的空軍缺乏可用於轟炸任務的大型飛機的經驗。必須儘快彌補這一能力差距。"
 IRQ_naval_air_support: "海軍空中支援"
 IRQ_naval_air_support_desc: "認為我們可以建立一支能夠與列強抗衡的海軍無疑是痴人說夢。然而，開發專門針對敵方海軍目標的攻擊機，可以以極低的成本對抗敵方艦隊，從而改變戰場平衡。"
 IRQ_fighter_training: "戰鬥機訓練"
 IRQ_fighter_training_desc: "我們的飛行員必須能在我們的空域對抗敵人的轟炸機，否則我們所有的軍事和經濟計劃都將付諸東流。"
 IRQ_air_research_bonus: "空氣動力學和航空電子學研究"
 IRQ_air_research_bonus_desc: "隨著全球衝突的爆發，航空技術正迅猛發展。我們必須建立一個專門的研究機構，讓我們的工程師開發最先進的空軍技術，否則我們將無望成為本區域的強權。"
 IRQ_project_babylon_focus: "巴比倫計劃"
 IRQ_project_babylon_focus_desc: "為了贏得未來的戰爭，無論敵人的數量勝過我軍多少，我們必須確保擁有重型武器壓制敵人。我們應當全力設立專門的設施，研究並開發實驗性武器。"
 IRQ_invest_in_ordnance_mountain_howitzers: "投資山地榴彈炮"
 IRQ_invest_in_ordnance_mountain_howitzers_desc: "我國北部和東部被群山環繞，而我們的軍隊缺乏適應此類地形的火力支援。我們應當投資開發專用的山地火炮，以備未來可能與鄰國爆發的衝突。"
 IRQ_basra_military_port_focus: "移交巴士拉軍港"
 IRQ_basra_military_port_focus_desc: "隨著我們對海洋及波斯灣的關注再度提升，我們應確保巴士拉軍港移交至我方管理，而非繼續由佔據我國國土的帝國主義勢力掌控。"
 IRQ_develop_the_kuwaiti_port: "開發科威特港"
 IRQ_develop_the_kuwaiti_port_desc: "隨著科威特被納入我們的版圖，我們的海岸線大幅延伸。我們將可以進一步擴建海軍設施，加強我們在波斯灣的軍事存在。"
 IRQ_develop_the_kuwaiti_port_tt: "在每個省份增加§G1§Y海軍基地§!§!。"
 IRQ_form_the_independent_mechanized_brigade: "組建獨立機械化旅"
 IRQ_form_the_independent_mechanized_brigade_desc: "在購買了適當的裝備並接受了大量訓練後，我們的軍隊認為他們已準備好部署並使用他們的第一支機械化單位。"
 IRQ_form_the_independent_mechanized_brigade_tt: "建立§Y機械化§!師編制並部署§Y1§!單位"
 IRQ_expand_camel_corps: "整合[ROOT.GetAdjective]警察"
 IRQ_expand_camel_corps_desc: "[ENG.GetAdjective]在上次大戰中於北非和東非部署的駱駝騎兵軍團展現了此兵種的多功能性。鑑於我國警察早已習慣使用牲畜進行巡邏，我們可以將其整合進軍隊並向他們學習。"
 IRQ_purchase_british_aircraft_AAT_tt: "§Y在$IRQ_anglo_iraqi_treaty$生效期間，我們將獲得更多的裝備補貼。§!"
 IRQ_purchase_british_aircraft_treaty_tt: "§Y在$IRQ_anglo_iraqi_treaty$生效期間，我們將獲得更多裝備。§!"
 IRQ_align_afghanistan_fasc: "邀請阿富汗"
 IRQ_align_afghanistan_fasc_desc: "[AFG.GetNameDef]長期以來被[SOU.GetAdjective]和[ENG.GetAdjective]夾在中間，充當緩衝國。或許通過合作，我們能夠讓他們更加適應該區域。"
 IRQ_ensure_sunni_dominance: "確保遜尼派主導權"
 IRQ_ensure_sunni_dominance_desc: "儘管遜尼派精英屬於少數群體，但他們長期統治著我們的國家，並得到了哈希姆王朝和阿拉伯民族主義者的支持。如果我們希望這些政黨繼續掌權，就必須確保遜尼派在我們政治中的主導地位得以延續。"
 IRQ_rally_behind_the_hashemite_dynasty: "集結在哈希姆王朝麾下"
 IRQ_rally_behind_the_hashemite_dynasty_desc: "必須讓哈希姆家族成為我們繼續建立伊拉克民族意識的核心。在執政多年後，我們即將真正鞏固對這裡的控制。"
 IRQ_align_afghanistan_fasc_tt: "§Y[AFG.GetNameWithFlag]§!被邀請加入我們的陣營"
 IRQ_anti_western_alliance_per_tt: "§Y[PER.GetNameWithFlag]§!被邀請加入我們的陣營"
 IRQ_anti_western_alliance_tur_tt: "§Y[TUR.GetNameWithFlag]§!被邀請加入我們的陣營"
 IRQ_refuge_for_the_grand_mufti: "庇護大穆夫提"
 IRQ_refuge_for_the_grand_mufti_desc: "巴勒斯坦最近發生動亂後，引起爭議的耶路撒冷大穆夫提阿明·侯賽因被英國人流放。為了安撫國內的反英情緒，也許我們可以暫時為他提供庇護。"
 IRQ_religious_resistance: "宗教抵抗"
 IRQ_religious_resistance_desc: "庇護大穆夫提後，我們可以與他展開合作，激發全阿拉伯世界的抵抗意識，對抗騎在我們頭上的西方政權。"
 IRQ_protector_of_the_gulf: "波斯灣守護者"
 IRQ_protector_of_the_gulf_desc: "我們已證明了自己是西方列強的可靠盟友。也許他們會願意從該區域撤軍，由我們來維持波斯灣的安全。"
 IRQ_restoration_of_hejaz: "收復漢志"
 IRQ_restoration_of_hejaz_desc: "不久前，[SAU.GetAdjective]滅亡了漢志王國。哈希姆王朝的影響力因而被削弱。是時候以同樣的方式予以回報了。"
 IRQ_reach_out_to_jordan: "接觸約旦"
 IRQ_reach_out_to_jordan_desc: "我們的同宗親戚仍在[ENG.GetAdjective]保護下統治著約旦。不過，也許我們可以說服他們和[ENG.GetAdjective]，讓我們接管約旦的防禦，以獲取更大的政治和經濟凝聚力。"
 IRQ_status_of_lebanon: "黎巴嫩的歸屬"
 IRQ_status_of_lebanon_desc: "敘利亞已被我們牢牢掌握在手中，接下來的關注點便是黎巴嫩的未來。也許，我們可以再試一次運氣，要求黎巴嫩歸入我們的控制範圍。"
 IRQ_regional_economic_integration: "區域經濟一體化"
 IRQ_regional_economic_integration_desc: "我們必須對該區域的基礎設施進行大規模投資，以實現長遠的經濟增長，讓所有成員國都能從中受益。"
 IRQ_regional_military_integration: "區域軍事一體化"
 IRQ_regional_military_integration_desc: "儘管我們缺乏與列強匹敵的軍事工業能力，但在本區域進行軍事投資後，我們或許能夠迎頭趕上。"
 IRQ_regional_military_integration_tt: "在約旦是我國附屬國或我國控制約旦時完成此國策將在約旦額外增加兩座軍用工廠。"
 IRQ_demand_palestine: "索要巴勒斯坦"
 IRQ_demand_palestine_desc: "事實證明，英國人無法保護委託管理地區的巴勒斯坦人們。全世界的目光聚焦於他們身上，也許我們可以要求他們將委託管理權轉交給我們，迫使他們放棄此地。"
 IRQ_hashemite_arab_federation: "阿拉伯哈希姆聯邦"
 IRQ_hashemite_arab_federation_desc: "隨著哈希姆家族的各個成員在各國建立起統治，我們有機會將各王國統一在一個更大的阿拉伯哈希姆聯邦下。"
 IRQ_fligerfuhrer_irak: "伊拉克空軍指揮官"
 IRQ_fligerfuhrer_irak_desc: "面對[ENG.GetAdjective]的強大軍力，我們的軍隊幾乎毫無勝算。然而，我們的盟友或許能夠提供先進的飛機和飛行員，讓我們扭轉戰局。"
 IRQ_commander_of_the_faithful: "信士的長官"
 IRQ_commander_of_the_faithful_desc: "既然我們已承擔起統一阿拉伯人民的使命，我們應該儘可能招募他們來支持我們的事業。阿卜德·伊拉赫認為自己有資格繼承侯賽因·本·阿里·哈希姆的頭銜，並任命自己為信士的長官。"
 #IRQ_retire_radical_officers: "Retire Radical Officers"
 #IRQ_retire_radical_officers_desc: "The armed forces are rife with anti-[ENG.GetAdjective] and pan-arab radicals who wish to force a confrontation. We must retire them from their roles before they find an opportunity to undermine our rule."
 IRQ_increase_anglo_iraqi_economic_ties: "強化英伊經濟聯繫"
 IRQ_increase_anglo_iraqi_economic_ties_desc: "如果我們不利用與[ENG.GetAdjective]建立的密切經濟聯繫就太蠢了。"
 IRQ_raf_levies_focus: "英國皇家空軍徵召"
 IRQ_raf_levies_focus_desc: "[ENG.GetAdjective]在我們領土內保持了若干徵召兵，保障他們的空軍基地安全。也許我們可以加強與這些部隊的合作，增強我們的防禦能力。"
 IRQ_increase_prime_ministers_powers: "加強首相權力"
 IRQ_increase_prime_ministers_powers_desc: "歷史已經證明伊拉克人民不希望在哈希姆王朝的絕對統治下生活，因此，現在我們正好有機會向他們的政權提供一份憲法性質的保障，徹底將伊拉克引向更西化的道路。"
 IRQ_party_of_national_brotherhood: "民族兄弟會黨"
 IRQ_party_of_national_brotherhood_desc: "政府屈從於[ENG.GetAdjective]的意志已經太久了。只有民族兄弟會黨有潛力鑄就[IRQ.GetNonIdeologyName]的輝煌。"
 IRQ_bakr_sidqi_coup: "巴克爾·西德基政變"
 IRQ_bakr_sidqi_coup_desc: "現政權無能且昏庸。我們將在巴克爾·西德基的領導下推翻它，還[ROOT.GetNonIdeologyName]人民一個獨立的未來。"
 IRQ_bakr_sidqi_tt: "§Y$IRQ_bakr_sidqi$被僱傭為不可移除的顧問。§!"
 IRQ_a_new_caliph: "新哈里發"
 IRQ_a_new_caliph_desc: "經過多年的鬥爭，我們已成為伊斯蘭世界的強大國家。是時候繼承侯賽因·本·阿里的遺產，建立哈希姆家族領導下的哈里發國了。"
 IRQ_demand_syria_hashemite: "提議統一敘利亞"
 IRQ_demand_syria_hashemite_desc: "1920年，敘利亞曾短暫處於費薩爾一世治下，但由於法國人的背叛而被奪走。現在，我們可以憑藉實力進行談判，要求歸還我們的法理領土。"
 IRQ_kurdish_outreach: "邊緣族群庫爾德人"
 IRQ_kurdish_outreach_desc: "伊拉克北部的庫爾德人一旦聯合起來，可能會對我們的統治造成極大威脅。因此，我們必須儘快採取措施，將他們整合進伊拉克國家體系之中，甚至願意為此給予他們一定的自治權。"
 IRQ_suppress_tribal_revolts: "鎮壓部落叛亂"
 IRQ_suppress_tribal_revolts_desc: "為了實現國家團結，確保我們在與鄰國對抗時不會從內部瓦解，我們必須鎮壓部落叛亂，併為願意合作者推動減貧，以此彌合我們民族靈魂中的裂痕。"
 IRQ_assasination_of_sidqi: "暗殺巴克爾·西德基"
 IRQ_assasination_of_sidqi_desc: "[IRQ_assassination_of_sidqi_desc_key]"
 IRQ_assassination_of_sidqi_desc_leader: "自推翻前政府以來，巴克爾·西德基一直未能團結這個國家。政治精英愈發不滿，伊拉克民眾則對庫爾德人過多幹涉國家事務的情況表示懷疑。如果時機來臨，勢必會有人企圖終結他的性命……"
 IRQ_assassination_of_sidqi_desc_not_leader: "巴克爾·西德基顯然在策劃針對我方政府的政變，許多我方軍官報告此人正在採取行動爭取軍官們的忠誠。如果我們要保住政權，必須除掉他。"
 IRQ_attempted_assasination_of_sidqi: "刺殺西德基未遂"
 IRQ_attempted_assasination_of_sidqi_desc: "儘管政治精英和民眾對巴克爾·西德基的反感日益加深，近期針對他的暗殺企圖仍然未能成功。然而，這表明我們必須加強安全措施和情報工作，以保護新政權免受反對派的威脅。"
 IRQ_increase_italian_business_relations: "從[ITA.GetNonIdeologyName]進口"
 IRQ_increase_italian_business_relations_desc: "我們不能完全依靠[ENG.GetAdjective]來滿足經濟需求。幸運的是，[ITA.GetAdjective]人非常樂意幫助我們。"
 IRQ_revoke_anglo_iraq_treaty: "廢除《英伊條約》"
 IRQ_revoke_anglo_iraq_treaty_desc: "不平等的《英伊條約》已經扼殺我國的發展太久了。現在，我們擁有足夠的意志抵抗[ENG.GetAdjective]，並最終廢除該條約。無論後果如何。"
 IRQ_revoke_anglo_iraq_treaty_tt: "§R廢除該條約後[ENG.GetNameDefCap]有可能對我們宣戰！§!"
 IRQ_restore_regent: "恢復攝政"
 IRQ_restore_regent_desc: "拉希德·阿里·蓋拉尼和金方陣愚蠢的機會主義只會為我們的國家帶來毀滅。我們必須徹底清除他們有毒的影響，恢復舊政府的權力。"
 IRQ_support_the_allied_war_effort: "支援同盟國戰事"
 IRQ_support_the_allied_war_effort_desc: "無論民眾是否願意，我們的未來都與同盟國息息相關。我們必須證明對他們的事業的奉獻，在新興的世界秩序中確立自己的地位。"
 IRQ_allied_training: "同盟國訓練"
 IRQ_allied_training_desc: "我們的盟友願意分享他們在近年衝突中積累的寶貴作戰經驗。我們應當接受這種援助，確保我們的軍隊能夠做好一切準備，在戰場上發揮最大戰鬥力。"
 IRQ_renegotiate_treaty: "重議《英伊條約》"
 IRQ_renegotiate_treaty_desc: "我們已經證明我們對[ENG.GetAdjective]在該地區的利益沒有威脅，並且可以在有需要時成為他們的盟友。因此，我們應該在平等的基礎上重新議定《英伊條約》。"
 IRQ_strengthen_the_golden_square: "加強金方陣"
 IRQ_strengthen_the_golden_square_desc: "由四名高級軍官組成的金方陣已成為泛阿拉伯主義和反[ENG.GetAdjective]情緒的核心。也許是時候讓他們完全進入政府，並開始實施強國所必需的改革了。"
 IRQ_iraqi_al_futuwwa: "成立伊拉克青年團"
 IRQ_iraqi_al_futuwwa_desc: "為了壯大我們的國家，我們必須創建青年組織，訓練人民為更加輝煌的未來而戰！"
 IRQ_seek_axis_investment: "尋求軸心國投資"
 IRQ_seek_axis_investment_desc: "我們的經濟如同一潭死水，若想抵抗外國的侵略，就必須讓經濟多元化。也許我們的海外朋友願意在這裡投資，以加深與我們的關係。"
 IRQ_axis_training: "勃蘭登堡訓練任務"
 IRQ_axis_training_desc: "$IRQ_allied_training_desc$"
 IRQ_eliminate_the_golden_square: "剷除金方陣"
 IRQ_eliminate_the_golden_square_desc: "妄圖統一阿拉伯世界的金方陣和他們的追隨者使我們面臨著區域衝突和內部分裂的風險。必須在他們摧毀我們的國家前將其剷除。"
 IRQ_embargo_the_axis_powers: "禁運軸心國"
 IRQ_embargo_the_axis_powers_desc: "軸心國是世界和平的威脅，必須限制其獲得發動戰爭所需的所有資源。"
 IRQ_al_muthanna_club: "穆薩納俱樂部"
 IRQ_al_muthanna_club_desc: "在我國不乏支持建立泛阿拉伯政權的俱樂部和群體。我們應該保障這些組織的資金，確保他們能為了這個目標繼續發展壯大並影響民眾。"
 IRQ_arab_free_legion: "自由阿拉伯軍團"
 IRQ_arab_free_legion_desc: "來自世界各地的阿拉伯人志願與數十年來阻礙我們的舊勢力作戰。也許我們在此基礎上從國外招募軍隊，與我們的部隊並肩作戰，對抗共同的敵人。"
 IRQ_arab_free_legion_tt: "解鎖§Y$IRQ_arab_free_legion_cat$§!決議，從阿拉伯世界招募軍隊。"
 IRQ_curtail_arabism: "遏制泛阿拉伯主義"
 IRQ_curtail_arabism_desc: "我們的人民對於泛阿拉伯主義的日益痴迷疏遠了國內的非阿拉伯群體，並讓我們走上了與列強對抗的道路。我們必須在這一意識形態摧毀我們之前遏制它。"
 IRQ_strengthen_relations_with_iran: "加強與伊朗的關係"
 IRQ_strengthen_relations_with_iran_desc: "儘管[IRQ.GetAdjective]和[PER.GetAdjective]的意見並不總是一致，但我們在國家現代化和抵抗西方統治上立場一致。是時候建立建設性的關係，共同實現目標了。"
 IRQ_strengthen_relations_with_turkey: "加強與土耳其的關係"
 IRQ_strengthen_relations_with_turkey_desc: "[TUR.GetAdjective]一直是對抗西方勢力的前線，儘管這最終讓他們失去了帝國。因此，我們是天然的盟友，我們應該努力改善與他們的關係。"
 IRQ_anti_western_alliance: "反西方聯盟"
 IRQ_anti_western_alliance_desc: "如果本地區的大國能彙集軍事力量共同防禦，我們將真正有機會對抗經常干涉我們事務的西方列強。"
 IRQ_carve_up_syria: "瓜分敘利亞"
 IRQ_carve_up_syria_desc: "敘利亞理應被納入我們的王國，但卻被法國人搶走了。此外，我們的[TUR.GetNonIdeologyName]朋友也宣稱了該地區的部分領土。也許是時候在全世界無暇他顧時，聯合起來索取這片領土了。"
 IRQ_encourage_federalism: "鼓勵聯邦制"
 IRQ_encourage_federalism_desc: "我們應該賦予庫爾德人和亞述人一定的自治權，並在全國範圍內合法化地方語言和習俗，以便使所有伊拉克公民團結在一面旗幟下。"
 IRQ_reapproachment_with_the_tribes: "安撫部落"
 IRQ_reapproachment_with_the_tribes_desc: "仍然有許多部落首領沒有完全信任我們的政府。我們應該安撫他們，投資他們的所在地，確保他們的忠誠只屬於我們。"
 IRQ_reapproachment_with_the_tribes_tt: "§Y艾哈邁德·巴爾扎尼§!和§Y穆斯塔法·巴爾扎尼§!將成為可用的3級§Y陸軍將領§!"
 IRQ_abd_al_illah_fm_tt: "§Y阿卜杜勒·伊拉§!將成為可用的3級§Y陸軍元帥§!"
 IRQ_greater_iraq: "大伊拉克"
 IRQ_greater_iraq_desc: "如今有越來越多的阿拉伯人安全地處於我們的統治下，宣佈建立更廣義的[IRQ.GetNonIdeologyName]來紀念這一刻似乎十分合適。"
 IRQ_greater_iraq_tt: "解鎖§Y$greater_iraq_decision_cat$§!決議，獲得我們擁有的中東地區的核心。"
 IRQ_arab_republic_core_tt: "解鎖§Y$united_arab_republic_cat$§!決議，獲得我們擁有的阿拉伯地區的核心。"
 IRQ_take_advantage_of_british_weakness: "利用形勢"
 IRQ_take_advantage_of_british_weakness_desc: "[ENG.GetAdjective]正分心於全球的衝突，如果我們想將他們逐出我們的土地，這將是一個不可多得的好機會。讓我們重拳出擊，打得他們永遠無法恢復。"
 IRQ_arab_dominance: "阿拉伯統治地位"
 IRQ_arab_dominance_desc: "[IRQ.GetNonIdeologyName]是個多元化的國家，但只有確立阿拉伯主體民族的政治統治地位，才有希望維持一個穩定的政府。"
 IRQ_rally_the_arab_world: "集結阿拉伯世界"
 IRQ_rally_the_arab_world_desc: "阿拉伯世界渴望擺脫西方列強的束縛。我們將齊心協力，團結阿拉伯人民，重新成為自己命運的主人。"
 IRQ_regime_change_in_arabia: "阿拉伯半島政權更迭"
 IRQ_regime_change_in_arabia_desc: "沙特家族已不再是對抗列強的潛在盟友。因此，必須在它成為威脅前就將其消滅。"
 IRQ_iran_ultimatum: "聲索阿拉伯斯坦"
 IRQ_iran_ultimatum_desc: "[PER.GetName]西部地區生活著大量阿拉伯人。也許是時候要求他們脫離[PER.GetAdjective]統治，統一在我國治下了。"
 IRQ_iran_ultimatum_tt2: ""
 IRQ_iran_ultimatum_tt: "§Y如果[PER.GetNameDef]拒絕割讓領土，我們可以選擇對他們宣戰。§!"
 IRQ_liberate_levant: "解放黎凡特"
 IRQ_liberate_levant_desc: "黎凡特被世界大戰的勝利者瓜分，而這只是給該地區的人民帶來了流血和苦難。我們不能再坐視我們的親人遭受如此命運了。"
 IRQ_liberate_north_africa: "解放北非"
 IRQ_liberate_north_africa_desc: "北非遭受歐洲帝國主義者的壓迫已經太久了。是時候解放他們，帶他們重回正軌了。"
 IRQ_proclaim_united_arab_republic: "成立阿拉伯聯合共和國"
 IRQ_proclaim_united_arab_republic_desc: "我們建立泛阿拉伯國家的夢想開始取得成果。我們必須抓住機會，宣佈建立阿拉伯聯合共和國，集結人民支持我們的事業。"
 IRQ_request_syria_from_vichy: "索取敘利亞"
 IRQ_request_syria_from_vichy_desc: "法國正處於前所未有的分裂和虛弱中。這是要求他們將敘利亞的領土轉交給我們的絕佳機會。"
 AT_PEACE_WITH_SYRIA_OWNER_TT_NOT: "與敘利亞不處於戰爭"
 IRQ_unite_mashriq: "統一馬什裡克"
 IRQ_unite_mashriq_desc: "馬什裡克是伊斯蘭世界跳動的心臟。在它完全處於哈里發控制下之前，我們不能休息。"
 IRQ_discuss_a_new_treaty: "商議新條約"
 IRQ_discuss_a_new_treaty_desc: "《英伊條約》簽訂時我們還只是個弱小而年輕的國家。現在，我們已經是伊斯蘭世界的強大國家，這樣一份條約是對我們領導人的侮辱。因此，是時候與[ENG.GetAdjective]議定一份新條約了。"
 IRQ_unite_maghreb: "統一馬格里布"
 IRQ_unite_maghreb_desc: "馬格里布是伊斯蘭世界不可分割的一部分，它淪落入西方的統治下已經太久了。有了我們新建立的力量，我們將統一馬格里布，徹底驅逐帝國主義者。"
 IRQ_unite_maghreb_tt: "針對所有佔領著該國策給予核心的地區的國家，獲得§Y收復核心地區§!戰爭目標"
 IRQ_arab_league: "成立阿拉伯聯盟"
 IRQ_arab_league_desc: "我們必須建立一個由志同道合的阿拉伯國家組成的聯盟，以保護阿拉伯國家的利益免受外部干涉，並解放境外那些被佔領的國家。"
 IRQ_arab_league_economic_cooperation: "阿拉伯聯盟經濟委員會"
 IRQ_arab_league_economic_cooperation_desc: "為了加強阿拉伯國家間的兄弟情誼，我們應該推動更緊密的經濟合作。"
 IRQ_arab_league_economic_cooperation_tt: "其他每個對我們的§Y評價§!高於§G85§!的§Y阿拉伯國家§!都會使我們獲得一座地圖外§Y民用工廠§!。這適用於§Y[KUW.GetNameWithFlag]§!、§Y[JOR.GetNameWithFlag]§!、§Y[SYR.GetNameWithFlag]§!、§Y[PAL.GetNameWithFlag]§!、§Y[BHR.GetNameWithFlag]§!、§Y[SAU.GetNameWithFlag]§!、§Y[QAT.GetNameWithFlag]§!、§Y[UAE.GetNameWithFlag]§!、§Y[OMA.GetNameWithFlag]§!、§Y[IMO.GetNameWithFlag]§!、§Y[YEM.GetNameWithFlag]§!、§Y[FSA.GetNameWithFlag]§!、§Y[EGY.GetNameWithFlag]§!、§Y[SUD.GetNameWithFlag]§!、§Y[LBA.GetNameWithFlag]§!、§Y[ALG.GetNameWithFlag]§!、§Y[TUN.GetNameWithFlag]§!、§Y[MOR.GetNameWithFlag]§!、§Y[RIF.GetNameWithFlag]§!、§Y[WES.GetNameWithFlag]§!、§Y[MRT.GetNameWithFlag]§!和§Y[LEB.GetNameWithFlag]§!。"
 IRQ_expand_membership: "擴充聯邦"
 IRQ_expand_membership_desc: "一些人嘲笑我們聯邦的概念，而另一些人則敬畏地看著我們的成就。也許是時候將那些足夠聰明，意識到合而更強的人納入聯邦了。"
 IRQ_expand_membership_tt: "解鎖§Y$hashemite_federation_cat$§!決議，邀請成員國成為你的傀儡。"
 IRQ_restore_al_andalus: "重建安達盧斯"
 IRQ_restore_al_andalus_desc: "西班牙人也許以為他們是伊比利亞的主人，但早在他們建國前，那裡叫做安達盧斯。讓其迴歸伊斯蘭世界，將是歐洲人永遠不會忘記的失敗。"
 IRQ_promote_kurdish_culture: "推動庫爾德身份認同"
 IRQ_promote_kurdish_culture_desc: "庫爾德人分散在多個國家，但我們的文化將我們聯繫在一起，無論我們身處何方。我們必須推廣並保護這一傳承，在統治我們的人將其消除之前。"
 IRQ_has_become_kurdistan_flag: "已成為庫爾德斯坦"
 IRQ_kurdish_democratic: "庫爾德斯坦民主黨"
 IRQ_kurdish_democratic_desc: "庫爾德人的權利時刻受到[IRQ.GetNameDef]的阿拉伯多數群體的踐踏。是時候建立我們自己的政治運動了，目標是為我們民族建立一個自由獨立的國家。"
 IRQ_kurdish_socialist: "尋求蘇聯援助"
 IRQ_kurdish_socialist_desc: "[SOU.GetNameDefCap]一直希望能破壞西方對中東的支配。也許他們會願意協助我們對抗[IRQ.GetAdjective]政府，進而打擊[ENG.GetAdjective]。"
 IRQ_kurdish_revolt: "發動起義"
 IRQ_kurdish_revolt_desc: "時候到了，我們要宣佈從[IRQ.GetNonIdeologyName]獨立，為庫爾德民族建立一個真正自由的國家。"
 IRQ_kurdish_revolt_tt: "我們會宣佈從§Y伊拉克§!獨立，發動對他們的§R獨立戰爭§!。"
 kurdistan_exists_tt: "庫爾德斯坦存在"
 IRQ_kurdish_language: "庫爾德語學校"
 IRQ_kurdish_language_desc: "獲得獨立後，我們終於可以開始建立以庫爾德文化和語言為核心的教育體系。"
 IRQ_kurdish_industry: "擴建工業基地"
 IRQ_kurdish_industry_desc: "我們必須開發自己的工業基地，以防被更強大的鄰國吞併。"
 IRQ_kurdish_oil: "庫爾德石油"
 IRQ_kurdish_oil_desc: "近些年來，我們領土上的石油得到了開採，但產生的財富卻被從這裡抽走了。現在我們終於可以建立自己的石油產業，並將這些財富用在我們自己的人民身上。"
 IRQ_kurdish_form_the_peshmerga: "成立自由鬥士"
 IRQ_kurdish_form_the_peshmerga_desc: "雖然我們的起義成功粉碎了伊拉克軍隊，但未來或許不會這麼幸運。因此，我們應當建立一支經過真正軍事訓練，擁有現代化裝備的國家軍隊，以阻止潛在的衝突發生。"
 IRQ_effectivize_the_production_line: "生產線優化"
 IRQ_effectivize_the_production_line_desc: "要確保我們未來的獨立，僅靠一次性的努力是不夠的。因此我們必須採取措施以確保我們能持續進步。"
 IRQ_kurdish_women_in_military: "女兵"
 IRQ_kurdish_women_in_military_desc: "想要建立一支足以與鄰國抗衡的強大軍隊，我們必須拋下讓女性遠離衝突的過時觀點。"
 IRQ_kurdish_support_resistance: "支持國外抵抗"
 IRQ_kurdish_support_resistance_desc: "儘管我們境內的人民獲得了真正的自由，但還有太多同胞被束縛在異族勢力的統治之下。我們必須支持他們掙脫束縛。"
 IRQ_kurdish_reject_ankara_treaty: "拒絕《安卡拉條約》"
 IRQ_kurdish_reject_ankara_treaty_desc: "《安卡拉條約》殺死了當年庫爾德民族建國的嘗試。我們必須向世界表明態度，我們拒絕該條約建立的邊界，在庫爾德民族統一之前，我們不會止步。"
 IRQ_further_ussr_support: "進一步的[SOV.GetAdjective]支持"
 IRQ_further_ussr_support_desc: "在我們邁向自由的初始征程中，我們曾依靠[SOV.GetAdjective]的援助才獲得成功。雖然依賴他人並非我們最初的理想，但若能說服他們視我們為平等的夥伴與同志，這種合作關係依然有可能結出豐碩成果。"
 IRQ_support_from_skies_above: "來自天空的支持"
 IRQ_support_from_skies_above_desc: "鑑於我們周圍的環境，僅僅依賴步兵和地面部隊是不明智的。儘管建立空軍可能會帶來巨大的成本，但這是我們必須要採取的措施。"
 IRQ_support_from_skies_above_tt: "若與§Y[SOV.GetNameWithFlag]§!處於同一陣營，且他們擁有§Y近距支援機§!，則§Y[ROOT.GetNameWithFlag]§!將獲得§Y100架近距支援機§!。"
 IRQ_support_from_the_mountains: "山地專長"
 IRQ_support_from_the_mountains_desc: "我們的周圍環繞著幾座險峻的山脈，針對這些地區作戰而量身定製的訓練和裝備將大有幫助。初始成本可能不會成為阻礙。"
 IRQ_kurdish_attack_turkey: "解放土耳其的庫爾德人"
 IRQ_kurdish_attack_turkey_desc: "[TUR.GetAdjective]殘酷壓迫他們境內的庫爾德人，剝奪他們的傳承。不能再容忍這種行徑了，即使這意味著武力解放我們的人民。"
 IRQ_kurdish_attack_iran: "解放伊朗的庫爾德人"
 IRQ_kurdish_attack_iran_desc: "[PER.GetAdjective]政權對我們民族是個威脅。只有通過武力解放他們境內的庫爾德人，親手擊敗[PER.GetAdjective]軍隊，我們才能確保民族的未來。"
 IRQ_kurdish_united: "統一庫爾德斯坦"
 IRQ_kurdish_united_desc: "經過極其艱苦的鬥爭，我們終於將庫爾德民族統一在我們統治下。無論現在發生什麼，我們都將作為一個民族團結一致。"
 IRQ_a_new_islamic_golden_age: "新伊斯蘭黃金時代"
 IRQ_a_new_islamic_golden_age_desc: "TODO"
 IRQ_put_down_tribal_revolts: "鎮壓部落叛亂"
 IRQ_put_down_tribal_revolts_desc: "TODO"
 IRQ_join_axis: "$TUR_join_the_axis$"
 IRQ_join_axis_desc: "$TUR_join_the_axis_desc$"
 RAJ_royal_indian_artillery_dlc: "$RAJ_royal_indian_artillery$"
 RAJ_royal_indian_artillery_dlc_desc: "$RAJ_royal_indian_artillery_desc$"
 RAJ_lions_of_the_great_war_dlc: "$RAJ_lions_of_the_great_war$"
 RAJ_lions_of_the_great_war_dlc_desc: "$RAJ_lions_of_the_great_war_desc$"
 RAJ_chindits_dlc: "$RAJ_chindits$"
 RAJ_chindits_dlc_desc: "$RAJ_chindits_desc$"
 RAJ_re_establish_the_khyber_rifles: "重建開伯爾步槍隊"
 RAJ_re_establish_the_khyber_rifles_desc: "我們應該重建民兵組織開伯爾步槍隊以保衛崎嶇地帶，也許我們可以從他們身上學到一些東西。"
 RAJ_expand_mazagon_dock_dlc: "$RAJ_expand_mazagon_dock$"
 RAJ_expand_mazagon_dock_dlc_desc: "$RAJ_expand_mazagon_dock_desc$"
 RAJ_found_scindia_shipyard_dlc: "$RAJ_found_scindia_shipyard$"
 RAJ_found_scindia_shipyard_dlc_desc: "$RAJ_found_scindia_shipyard_desc$"
 RAJ_royal_indian_navy_dlc: "$RAJ_royal_indian_navy$"
 RAJ_royal_indian_navy_dlc_desc: "$RAJ_royal_indian_navy_desc$"
 IRQ_invite_oil_mission: "邀請石油顧問團"
 IRQ_invite_oil_mission_desc: "我們的籌碼是黑色黃金——而我們新結識的朋友正急需這些資源。戰爭局勢朝有利的方向發展，現在的小小讓步可能在未來帶來更大的收益。"
 IRQ_invite_oil_mission_ctt: "我們將向§Y[GER.GetNameDef]§!提供§Y[676.GetName]§!地區的§Y石油§!開採權以換取："
 ###########################
 ##### SHARED SAADABAD #####
 ###########################
 SSB_the_saadabad_pact: "薩德阿巴德條約"
 SSB_the_saadabad_pact_desc: "與鄰國保持友好，我們不會有什麼損失，反而會有所得。簽訂一項正式的友好條約的想法已被提出多次，現在是我們採取行動，確保這份友誼被寫入條約的時候了。"
 SSB_military_cooperation: "軍事合作"
 SSB_military_cooperation_desc: "面對來自強權的全面威脅，我們被吞併只是時間問題。此時加強薩德阿巴德條約組織的軍事合作比以往任何時候都更為重要。若不能聯合防禦，我們將被逐一打敗。"
 SSB_economic_cooperation: "經濟合作"
 SSB_economic_cooperation_desc: "我國被全球的列強環伺，我們必須加強薩德阿巴德條約框架內的經濟合作，開放市場、降低關稅，減少對世界列強的依賴。"
 SSB_expand_road_and_rail_connections: "擴建公路與鐵路樞紐"
 SSB_expand_road_and_rail_connections_desc: "隨著薩德阿巴德條約組織的日益壯大，修建一條從伊斯坦布爾通往喀布爾的鐵路已是水到渠成。這將把我們各國的基礎設施緊密聯結。"
 SSB_integration_of_our_infrastructure: "整合基礎設施"
 SSB_integration_of_our_infrastructure_desc: "隨著全球局勢緊張，我們被超級大國包圍，單靠一個軍事經濟條約已無法應對局勢。我們必須實現完全的基礎設施整合，取消彼此之間的關稅，並整合資源。"
 SSB_joint_military_exercises: "聯合軍事演習"
 SSB_joint_military_exercises_desc: "我們將開始統一軍事訓練流程，攜手降低成員國軍隊之間的壁壘，逐步組建一支半統一的薩德阿巴德聯軍。"
 SSB_coordinate_military_production: "擴大我們的影響力"
 SSB_coordinate_military_production_desc: "帝國與霸權的時代已遠去，我們與世界相比顯得孱弱。然而我們已不再孤立，如今薩德阿巴德條約將我們團結在一起。我們可以再次崛起，重掌區域的主導權。"
 SSB_expand_turkeys_military_infrastructure: "[TUR.GetAdjective]山地部隊"
 SSB_expand_turkeys_military_infrastructure_desc: "[TUR.GetNameDefCap]境內有大量山脈，因此[TUR.GetAdjective]軍隊擁有豐富的山地戰經驗。將此經驗和技術分享給條約各國，將使所有成員受益。"
 SSB_expand_afghanistans_military_infrastructure: "[AFG.GetAdjective]沙漠訓練"
 SSB_expand_afghanistans_military_infrastructure_desc: "[AFG.GetNonIdeologyName]軍隊在沙漠作戰與複雜地形應對方面經驗豐富。成員國都能從中大大受益。"
 SSB_expand_iraqs_military_infrastructure: "[IRQ.GetAdjective]資源加工"
 SSB_expand_iraqs_military_infrastructure_desc: "為擺脫對那些強國的依賴，我們必須擴大資源加工能力，儘可能將貿易限制在條約組織內部，從而提升自給自足能力。"
 SSB_expand_irans_military_infrastructure: "擴建[PER.GetAdjective]軍工基礎設施"
 SSB_expand_irans_military_infrastructure_desc: "我們需要在聯盟範圍內擴大軍事工業產能，每個成員都應盡一份力。一家新的裝備工廠將在伊朗建成。"
 SSB_expand_turkish_chromium_deposits: "[TUR.GetAdjective]鉻礦出口"
 SSB_expand_turkish_chromium_deposits_desc: "我們對世界強國的依賴正在不斷加深，已構成嚴重風險。我們必須擴大本國的鉻礦產出，確保在該資源上實現自給自足。"
 SSB_expand_iranian_oil_fields: "[PER.GetAdjective]石油出口"
 SSB_expand_iranian_oil_fields_desc: "我們對世界強國的依賴正在不斷加深，已構成嚴重風險。我們必須擴建國內油田設施，實現能源獨立。"
 SSB_form_the_saadabad_alliance: "全面聯盟提議"
 SSB_form_the_saadabad_alliance_desc: "薩德阿巴德條約最初只是一項互不侵犯協議。如今，它已發展為軍事與經濟合作的共同體。隨著資源整合，我們終於應當正式成立薩德阿巴德聯盟。"
 SSB_combined_arms: "聯合作戰"
 SSB_combined_arms_desc: "隨著聯盟的正式建立，是時候完成軍事力量的最終整合，確保各國彼此能夠共同防禦。"
 SSB_saadabad_research_cooperation: "薩德阿巴德科研合作"
 SSB_saadabad_research_cooperation_desc: "聯盟建立之後，理所當然的下一步是整合科研力量，成立統一的科學委員會，推動集體技術進步。"
 SSB_is_leader_tt: "是薩德阿巴德條約的領導國"
 SSB_basic_available_trigger_tt: "與任何薩德阿巴德成員國未處於戰爭狀態"
 SSB_spirit_tooltip: "修正§Y薩德阿巴德條約§!："
 SSB_flags_tt: "[PER.GetFlag][TUR.GetFlag][IRQ.GetFlag][AFG.GetFlag]"
 SSB_resource_tt: "$SSB_flags_tt$$trade_cost_for_target_factor_tt$"
 SSB_is_in_faction_tt: "是薩德阿巴德聯盟的成員。"
 SSB_accept_tt: "我們將與所有接受薩德阿巴德條約的國家簽署互不侵犯條約。我們還將獲得一個與其他成員的共享國策樹，以實現共同目標。"
 SSB_savak_protect_us: "薩瓦克保護我們所有人"
 SSB_savak_protect_us_desc: "薩瓦克在反間諜工作中表現出色，成功守護了我們偉大的國家。我們有機會通過分享反情報知識，為整個條約成員提供安全保護，對我們自身幾乎沒有成本，同時大幅增強盟友安全。"
 SSB_berlin_baghdad_railway_into_iran_afghanistan: "通過柏林-巴格達鐵路開展聯合貿易"
 SSB_berlin_baghdad_railway_into_iran_afghanistan_desc: "柏林-巴格達鐵路是[IRQ.GetAdjective]貿易和經濟的核心支柱。我們有機會將這條鐵路與安卡拉-喀布爾鐵路接軌，使其他簽約國家也能通過它開展貿易。"
 SSB_baghlan_sugar_factory_branches: "為巴格蘭糖業公司設立新分部"
 SSB_baghlan_sugar_factory_branches_desc: "巴格蘭糖業公司目前僅在[AFG.GetNonIdeologyName]建設工廠。我們可以允許它在所有薩德阿巴德國家建設新工廠，而非侷限於[AFG.GetNonIdeologyName]，實現共同的經濟增長。"
 SSB_chromium_tt: "從[TUR.GetName]進口資源，在§Y首都§!添加§Y10§!£GFX_resources_strip|6 。"
 SSB_chromium_2_tt: "從其他條約成員國進口資源，在§Y首都§!直接添加：\n§Y4§!£GFX_resources_strip|1、§Y5§!£GFX_resources_strip|4、§Y6§!£GFX_resources_strip|2和§Y6§!£GFX_resources_strip|5"
 SSB_oil_tt: "從[PER.GetName]進口資源，在§Y首都§!添加§Y10§!£GFX_resources_strip|1 。"
 SSB_oil_2_tt: "從其他條約成員國進口資源，在§Y首都§!直接添加：\n§Y4§!£GFX_resources_strip|4、§Y5§!£GFX_resources_strip|2、§Y6§!£GFX_resources_strip|4和§Y6§!£GFX_resources_strip|6"
 SSB_faction_invite_tt: "我們會邀請§Y中立主義§!的薩德阿巴德條約簽署國加入我們的新陣營。"
