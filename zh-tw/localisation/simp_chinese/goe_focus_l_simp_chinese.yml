l_simp_chinese:
 ############
 #####RAJ####
 ############
 RAJ_take_over_administrative_rights: "接管行政權力"
 RAJ_take_over_administrative_rights_desc: "為了優雅地退出該地區，[ENG.GetAdjective]政府已開始將行政職務外包給我們的公司職員。"
 RAJ_the_return_of_the_east_india_company: "東印度公司歸來"
 RAJ_the_return_of_the_east_india_company_desc: "解散多年後，東印度公司將得到重建，以便以無情的效率充分壓榨印度次大陸。"
 RAJ_the_return_of_the_east_india_company_tt: "東印度投資計劃和賦稅現在激活。\n解鎖§Y決議§!向投資者支付分紅"
 RAJ_privatized_tutelage: "教育私有化"
 RAJ_privatized_tutelage_desc: "通過維持嚴格的私立學校和學院制度，將教育保留給那些值得受教育的人，絕不招收不三不四的人。"
 RAJ_vertical_integration: "縱向一體化"
 RAJ_vertical_integration_desc: "最近的避稅方案几乎沒有引起海外政府的注意。或許我們可以利用更多漏洞，進一步減少稅收負擔。"
 RAJ_acquire_new_resources: "獲取新資源"
 RAJ_acquire_new_resources_desc: "我們的工業需要不斷增加的資源供應，以滿足商品需求。因此，我們將在各地建設新的資源加工設施，讓失業人口投身工作。"
 RAJ_corporate_expansion: "企業擴張"
 RAJ_corporate_expansion_desc: "我們核心投資組合促成的經濟增長帶來了人口繁榮。為了確保持續增長，我們將擴大基礎設施，以容納未來的員工。"
 RAJ_trade_federation_of_india: "品牌重塑"
 RAJ_trade_federation_of_india_desc: "近年來我們實現了歷史性的增長，並獲得了許多企業夢寐以求的政治權力。然而，我們控制下的部分地區仍不服從公司統治，也許提供大量金錢補償能說服他們？"
 RAJ_trade_federation_of_india_tt: "解鎖決議，使用§Y生活消費品工廠係數§!和§Y政治點數§!核心化治下高順從度的地區。"
 RAJ_the_varuna_class: "伐樓拿級戰艦"
 RAJ_the_varuna_class_desc: "我們的最新主力艦是一項巨大的工程壯舉。因此，這艘艦艇唯有以神的名字命名才合適。"
 RAJ_purchase_destroyers_and_subs: "購買驅逐艦與潛艇"
 RAJ_purchase_destroyers_and_subs_desc: "$SMB_purchase_destroyers_and_subs_desc$"
 RAJ_purchase_cruisers_and_dreadnoughts: "購買巡洋艦與無畏艦"
 RAJ_purchase_cruisers_and_dreadnoughts_desc: "$SMB_purchase_cruisers_and_dreadnoughts_desc$"
 RAJ_mineral_exploitation_institute: "礦產開發研究所"
 RAJ_mineral_exploitation_institute_desc: "最近的採礦發展未能達到我們的預期產量。看來我們需要投資進行更高質量的地質調查項目，以更準確地評估自然資源的潛在收益。"
 RAJ_establish_the_reserve_bank_of_india: "建立印度儲備銀行"
 RAJ_establish_the_reserve_bank_of_india_desc: "為了保護我們的經濟免受衝擊，我們將建立一個儲備銀行，負責控制貨幣流通。"
 #RAJ_separate_electorates: "Separate Electorates"
 #RAJ_demand_free_votes: "Demand Free Votes"
 RAJ_all_india_kisan_sabha: "全印農民協會"
 RAJ_all_india_kisan_sabha_desc: "印度農村的農民和佃戶長期以來受到了剝削。是時候讓他們組織起來，集體表達自己的訴求了。"
 RAJ_haripura_session_of_the_indian_national_congress: "第二次哈里普拉會議"
 RAJ_haripura_session_of_the_indian_national_congress_desc: "隨著資本主義加劇全球緊張局勢，已經到了將獨立鬥爭轉變為工人和農民革命的關鍵時刻。第二次哈里普拉會議將把我們團結在革命的願景下，拒絕帝國主義聯盟，為一個無階級、自力更生的印度而戰。"
 RAJ_the_second_gorkha_war: "第二次廓爾喀戰爭"
 RAJ_the_second_gorkha_war_desc: "尼泊爾的獨立已成為過去的遺蹟，割裂了本應統一的次大陸。一次果斷的戰役將把廓爾喀人納入我們的版圖，鞏固喜馬拉雅地區的安全。"
 RAJ_guarantee_nepalese_independence: "保證尼泊爾獨立"
 RAJ_guarantee_nepalese_independence_desc: "尼泊爾的主權象徵著對帝國統治的抵抗精神。通過保證其獨立，我們保衛了喜馬拉雅地區，並確保在我們對抗該地區外國影響的鬥爭中有一個強大的盟友。"
 RAJ_ignite_the_sino_indian_war: "引發中印戰爭"
 RAJ_ignite_the_sino_indian_war_desc: "與中國的邊界爭端已不可忽視。通過果斷行動，我們可以在喜馬拉雅地區彰顯我們的主權，確保我們應得的領土。一場大膽的襲擊可能會重塑亞洲的力量平衡。"
 RAJ_national_planning_committee: "國家計劃委員會"
 RAJ_national_planning_committee_desc: "經濟自給自足是真正獨立的基礎。通過成立國家計劃委員會，我們能為工業化、農村發展和公平增長制定路線。一個統一的計劃將把印度轉變為現代化、自力更生的國家。"
 RAJ_promote_violence_against_the_british: "煽動對英國的暴力行動"
 RAJ_promote_violence_against_the_british_desc: "和平抗議的時代已經過去了。為了打破帝國壓迫的枷鎖，我們必須採取直接行動。協調一致的抵抗將削弱英國的控制，激發民眾奮起反抗暴政。"
 RAJ_rally_the_indian_left: "召集印度左翼"
 RAJ_rally_the_indian_left_desc: "分裂的左翼必須團結起來，為工人權利和真正的獨立而鬥爭。通過將社會主義和共產主義力量團結在一面旗幟下，我們可以形成一股強大的力量，向帝國主義和資本主義發起挑戰。"
 RAJ_forward_bloc: "前進聯盟"
 RAJ_forward_bloc_desc: "前進聯盟代表了印度未來的大膽願景——拒絕妥協、投身革命行動。通過團結所有反帝力量，我們可以加速爭取完全獨立的鬥爭，併為一個更強大、更激進的印度奠定基礎。"
 RAJ_give_me_blood_and_i_will_grant_you_freedom: "給我鮮血，我將予你自由"
 RAJ_give_me_blood_and_i_will_grant_you_freedom_desc: "通往獨立的道路是由鬥爭和犧牲鑄就的。通過召集勇士為我們的事業而戰，我們可以激發一場足以打破殖民統治枷鎖的運動。勝利屬於那些願意為之付出代價的人。"
 RAJ_rani_of_jhansi_regiment: "章西女王軍團"
 RAJ_rani_of_jhansi_regiment_desc: "受章西女王英勇精神的啟發，我們將組建一支全女性的軍團來反抗壓迫。通過武裝這些勇敢的戰士，我們將有力地打擊殖民統治，並重新定義女性在獨立鬥爭中的角色。"
 RAJ_azad_hind_dlc: "自由印度"
 RAJ_azad_hind_dlc_desc: "自由印度代表著我們解放鬥爭的巔峰——一個致力於結束英國統治的流亡政府。在它把軍事力量動員起來、願景明確的情況下，它隨時準備通過武力和決心領導印度走向自由。"
 RAJ_azad_hind_dlc_radio: "自由印度廣播電臺"
 RAJ_azad_hind_dlc_radio_desc: "為了傳播解放的聲音，我們必須建立自由印度廣播電臺。這一革命性的廣播將把我們的自由號召傳遍邊界，團結愛國者，點燃對殖民壓迫的鬥爭。這場鬥爭需要一個聲音，而這將是我們的聲音。"
 RAJ_azad_hind_dlc_bank: "自由印度銀行"
 RAJ_azad_hind_dlc_bank_desc: "革命需要資源。通過建立自由印度銀行，我們創建了一個致力於支持獨立鬥爭的金融機構。它將動員資金、賦能愛國者，併為一個自由的印度奠定經濟基礎。"
 RAJ_seek_japanese_support: "尋求日本支持"
 RAJ_seek_japanese_support_desc: "敵人的敵人可以成為我們最強大的盟友。通過尋求日本的支持，我們可能獲得挑戰英國統治所需的資源、訓練和人力。儘管這條道路充滿風險，但這種聯盟可能會扭轉局勢。"
 RAJ_the_enemy_of_my_enemy: "敵人的敵人"
 RAJ_the_enemy_of_my_enemy_desc: "在獨立鬥爭中，結盟是必要的。通過與反對英國的勢力合作，我們可以削弱他們對我們土地的控制。自由可能需要非同尋常的夥伴關係，但勝利是唯一的目標。"
 RAJ_shaheed_and_swaraj: "烈士與獨立"
 RAJ_shaheed_and_swaraj_desc: "烈士們的犧牲激勵著我們對獨立的執著追求。他們的鮮血燃起了我們的革命，提醒我們獨立不是恩賜——而是通過鬥爭奪取的。追憶他們，並增強我們的決心，爭取建立一個自由且有主權的印度。"
 RAJ_azad_hind_radio: "自由印度廣播電臺"
 RAJ_azad_hind_radio_desc: "$RAJ_azad_hind_dlc_radio_desc$"
 RAJ_seek_international_recognition: "尋求國際認可"
 RAJ_seek_international_recognition_desc: "為了使我們的鬥爭合法化，我們必須為我們的事業爭取國際認可。通過爭取全球支持，我們可以孤立[ENG.GetAdjective]，並在國際社會中加強我們對主權的主張。"
 RAJ_war_taxes: "戰爭稅"
 RAJ_war_taxes_desc: "戰爭的代價需要全民共同承擔。通過徵收戰爭稅，我們可以為軍事行動提供資金，確保取得勝利所需的資源。一個自由的印度值得每個盧比的付出。"
 RAJ_azad_hind_bank: "自由印度銀行"
 RAJ_azad_hind_bank_desc: "$RAJ_azad_hind_dlc_bank_desc$"
 RAJ_hindutva: "印度教特性運動"
 RAJ_hindutva_desc: "印度教特性運動旨在鞏固全國的印度教領導力量，促進團結與文化自豪感。通過將傳統與民族主義事業相結合，我們可以壯大我們的運動，為一個統一的印度奠定基礎。"
 RAJ_netaji: "內塔吉"
 RAJ_netaji_desc: "內塔吉·蘇巴斯·錢德拉·鮑斯象徵著對帝國統治的無畏抗爭精神。他的願景和領導力激勵了數百萬人加入爭取主權印度的鬥爭。在他的指引下，獨立的夢想離現實越來越近。"
 RAJ_hindu_mahasabha: "進步印度教國家"
 RAJ_hindu_mahasabha_desc: "印度教大齋會支持土邦獨立，並將其視為“印度教權力的基石”。授予這些土邦獨立，我們可以從他們那裡獲得更多資金，並鞏固國家的其餘地區。"
 RAJ_hindu_mahasabha_tt: "釋放土邦為傀儡國會使該精神的增益提高§G+4%§!，只要該國家仍是你的傀儡國，最高可達§Y32%§!。"
 RAJ_sanatani: "印度傳統法則"
 RAJ_sanatani_desc: "印度永恆的傳統法則為國家的團結與復興提供了永恆的基礎。接受這些價值觀，我們能夠可以在傳統的指引下，激發一個和諧而堅韌的國家。"
 RAJ_hindi_as_a_national_language: "印地語國語"
 RAJ_hindi_as_a_national_language_desc: "採用印地語作為官方語言，將使印度在共同的文化認同下團結起來。通過推廣它的使用，我們加強了交流，激發了民族自豪感，併為一個團結獨立的國家奠定了基礎。"
 RAJ_seven_shackles_desc: "廢除傳統職業束縛制度讓印度人擺脫對職業選擇的限制，打破了剝削性制度的束縛。通過廢除這種枷鎖，我們解放了工人，並讓他們有機會為真正獨立和公平的經濟做出貢獻。"
 RAJ_coal_fire_and_steel: "煤、火和鋼鐵"
 RAJ_coal_fire_and_steel_desc: "煤炭驅動機器，火焰錘鍊意志，鋼鐵建造未來。通過投資重工業，我們為一個自給自足的印度奠定基礎，使它能捍衛主權，並推動繁榮發展。"
 RAJ_extend_indian_security_zone: "擴張[GetRajName]安全區"
 RAJ_extend_indian_security_zone_desc: "擴張安全區將保護印度邊界，並增強我們在區域內的影響力。通過擴大勢力範圍，我們能夠確保穩定和保護，為一個安全、主權的國家奠定基礎。"
 RAJ_high_altitude_training: "高海拔訓練"
 RAJ_high_altitude_training_desc: "喜馬拉雅山的崎嶇峰巒需要力量與韌性。通過建立專門的高海拔訓練項目，我們的部隊將能夠在極端環境中佔據主導地位，保護我們的邊界並維護對戰略山區的控制。"
 RAJ_high_altitude_training_tt: "將獲得山地步兵模板"
 RAJ_demand_return_of_imperialist_colonies: "要求歸還帝國佔據的殖民地"
 RAJ_demand_return_of_imperialist_colonies_desc: "現在是時候要求他們歸還印度次大陸上的所有帝國佔據的殖民地了。將所有印度領土統一在一面旗幟下，結束殖民入侵的時代。"
 RAJ_planned_economy: "計劃經濟"
 RAJ_planned_economy_desc: "強大的國家需要有目標的、有遠見的強大經濟體系。通過採取計劃經濟模式，我們可以高效分配資源，優先發展工業，確保所有公民的公平發展。"
 RAJ_two_nation_theory_: "兩個民族理論"
 RAJ_two_nation_theory__desc: "兩個民族理論認為印度教徒和穆斯林是不同民族，每個民族都應擁有自己的國家。通過接受這一理論，我們承認兩族分治自決的必要性，進而塑造次大陸的未來。"
 RAJ_red_in_the_shadows: "陰影中的紅色力量"
 RAJ_red_in_the_shadows_desc: "在帝國衰落的混亂中，革命力量正在集結，暗中破壞舊秩序。紅旗的升起預示著即將到來的清算——這一清算將重塑印度及世界的未來。"
 RAJ_red_in_the_shadows_tt: "解鎖滲透英國政府並影響獨立運動轉向親共立場的決議，降低完成§Y$RAJ_royal_indian_navy$§!的條件"
 has_swayed_bose_to_communism: "斯威·博斯已轉向共產主義"
 #RAJ_red_in_the_shadows_tt: "We will turn Communist upon gaining independence and avoid Partition. Pakistan will be released, gaining [ENG.GetAdjective] support to counter further communist influence."
 RAJ_seek_domestic_allies: "尋求國內盟友"
 RAJ_seek_domestic_allies_desc: "前進聯盟無法單獨實現其願景。通過在各個政治派別中尋求盟友，我們可以團結革命思想家，動員更廣泛的支持，凝聚領導力量，將印度推向真正的獨立。"
 RAJ_protest_against_the_howell_monument: "抗議霍爾韋爾紀念碑"
 RAJ_protest_against_the_howell_monument_desc: "霍爾韋爾紀念碑是對殖民統治和不公正的美化。通過組織抗議活動，我們可以喚起全國拒絕帝國宣傳的意識，並要求移除侮辱我們自由鬥爭的遺蹟。"
 RAJ_the_indian_national_army: "印度國民軍"
 RAJ_the_indian_national_army_desc: "印度國民軍象徵著獨立鬥爭，將愛國者團結在一面旗幟下，拿起武器對抗殖民統治。憑藉其決心與犧牲，國民軍已準備好引領印度走向解放與主權。"
 RAJ_appoint_soviet_friendly_government: "任命親蘇政府"
 RAJ_appoint_soviet_friendly_government_desc: "為確保莫斯科的持久支持，我們將建立完全忠於蘇聯意識形態的政府。他們的忠誠將為我們的新國家贏得經濟援助、軍事合作和意識形態一致性。"
 RAJ_appoint_german_friendly_government: "任命親德政府"
 RAJ_appoint_german_friendly_government_desc: "將我們的政府與[GER.GetNameDef]結盟將加強與歐洲新興強權的聯繫。此類政府將優先推動工業增長、軍事現代化，並堅決反對布爾什維主義。"
 #RAJ_post_war_independence: "Post War Independence"
 #RAJ_post_war_independence_desc: ""
 RAJ_ban_untouchability_once_and_for_all: "徹底廢除達特利制度"
 RAJ_ban_untouchability_once_and_for_all_desc: "達特利制度是我們社會的汙點，在需要團結時卻造成分裂。通過廢除這種做法，我們肯定了每位印度人的尊嚴，並朝著建立一個公正、包容的國家邁出決定性的一步。"
 RAJ_a_tiger_unchained: "破鐐猛虎"
 RAJ_a_tiger_unchained_desc: "我們將組建能夠征服最嚴酷山地地形的精英部隊。這些山峰之虎將讓敵人聞風喪膽，並確保我們在山區的主導地位。"
 RAJ_to_shake_the_world: "震撼世界"
 RAJ_to_shake_the_world_desc: "印度擁有巨大的工業潛力，現在是釋放這一潛力的時候了。通過擴大工廠、現代化基礎設施以及充分利用資源，我們可以將印度轉變為能夠塑造世界命運的工業強國。"
 RAJ_east_india_railways_dlc: "東印度鐵路"
 RAJ_east_india_railways_dlc_desc: "通過擴展和現代化東印度鐵路，我們可以加強商業，改善交通網絡，為一個更加繁榮和一體化的國家奠定基礎。"
 RAJ_modify_indian_railways_tt: "$idea_RAJ_indian_railways$追加效果："
 RAJ_the_calcutta_line: "加爾各答線"
 RAJ_the_calcutta_line_desc: "隨著地區局勢緊張，確保東部邊境的安全勢在必行。對加爾各答的防線進行加固，將形成防禦堡壘，保護關鍵基礎設施，抵禦外來威脅。"
 RAJ_the_calcutta_line_tt: "在該地區的§Y每個§!省份添加§G2§!§Y陸上要塞§!。"
 RAJ_bombay_baroda_and_central_india_railway: "孟買、巴羅達和印度中部鐵路"
 RAJ_bombay_baroda_and_central_india_railway_desc: "擴展孟買、巴羅達和中印度鐵路將連接關鍵地區，推動經濟增長並團結各地社區。這些重要的鐵路線路將加強貿易網絡，為迎接未來挑戰強化印度的基礎設施。"
 RAJ_great_indian_peninsula_railway_dlc: "大印度半島鐵路"
 RAJ_great_indian_peninsula_railway_dlc_desc: "大印度半島鐵路是釋放中印和南印經濟潛力的關鍵。擴展這一網絡將促進貿易，增強工業能力，並確保整個次大陸無縫銜接。"
 RAJ_south_indian_railway_company: "南印度鐵路公司"
 RAJ_south_indian_railway_company_desc: "南印度鐵路公司連接了印度南部的活力地區與全國其他部分。強化並擴展這一網絡將推動地區發展，促進團結，並鞏固南部在印度走向經濟獨立的過程中的作用。"
 RAJ_supply_center_fortifications: "補給中心的防禦工事"
 RAJ_supply_center_fortifications_desc: "確保補給中心的安全對維持戰爭努力至關重要。通過加固這些樞紐，我們能夠確保資源輸送不間斷，並保護軍事行動的後盾免受敵人侵襲。"
 RAJ_supply_center_fortifications_tt: "在我們治下地區的每個§Y補給中心§!添加§G3§!§Y$bunker$§!"
 RAJ_north_western_state_railway: "西北國家鐵路"
 RAJ_north_western_state_railway_desc: "西北國家鐵路是連接印度腹地與戰略邊境的重要命脈。擴展和現代化這一網絡將加強地區貿易、提升流動性，並強化我們在關鍵邊境的存在。"
 RAJ_prioritize_army_cargo: "軍用貨物運輸優先"
 RAJ_prioritize_army_cargo_desc: "鐵路網絡是軍事物流的支柱。通過優先運輸軍用貨物，我們確保士兵得到武器、資源和增援，以迅速果斷地贏得勝利。"
 RAJ_prioritize_civilian_cargo: "民用貨物運輸優先"
 RAJ_prioritize_civilian_cargo_desc: "強大的國內戰線是勝利的關鍵。通過優先運輸民用貨物，我們得以確保及時運送食品、貨物和材料，以維持我們的人民和工業，讓國家在危機時期保持韌性。"
 RAJ_specialized_dietary_requirement: "特殊飲食需求"
 RAJ_specialized_dietary_requirement_desc: "為了維持士氣和凝聚力，我們必須尊重部隊的多樣化飲食需求。通過提供符合士兵宗教和文化信仰的膳食，我們確保每位士兵感到被尊重，並做好戰鬥準備。"
 RAJ_standardized_rations: "標準化口糧"
 RAJ_standardized_rations_desc: "效率和一致性是強大軍隊的關鍵。通過實施標準化口糧，我們簡化了物流，降低了成本，並確保每位士兵享有同樣的伙食，在全軍範圍內培養團結和紀律。"
 RAJ_royal_indian_artillery_: "印度皇家炮兵"
 RAJ_royal_indian_artillery__desc: "通過加強這支強大的部隊，我們確保能夠提供毀滅性的火力，突破敵人的防線，並在戰場上取得勝利。"
 RAJ_armoured_corps_center_and_school: "裝甲部隊中心"
 RAJ_armoured_corps_center_and_school_desc: "戰爭的未來在於機械化的威力。建立裝甲部隊中心，將使我們能夠訓練部隊掌握裝甲戰術，將坦克打造成現代軍事戰略的先鋒力量。"
 RAJ_indian_army_corps_of_engineers: "[ROOT.GetAdjective]陸軍工程兵部隊"
 RAJ_indian_army_corps_of_engineers_desc: "從防禦工事到橋梁，[ROOT.GetAdjective]陸軍工程兵部隊是作戰成功的關鍵。通過擴展和裝備這一重要部門，我們確保部隊能夠克服任何障礙，為每一條戰線的勝利鋪平道路。"
 RAJ_kingmaker: "擁王者"
 RAJ_kingmaker_desc: "通過派遣志願者參加國外衝突，我們擴大了影響力，獲得了寶貴的作戰經驗。這些努力不僅支持了我們的盟友，而且使我們成為塑造全球鬥爭結果的決定性力量。"
 RAJ_relax_agrarian_society_criteria: "工業化社會"
 RAJ_relax_agrarian_society_criteria_desc: "為了轉型為現代工業強國，我們必須使經濟擺脫傳統農業依賴。通過鼓勵農村人口加入工業勞動隊伍，我們為持續增長和技術進步奠定基礎。"
 RAJ_mechanization_of_the_cavalry: "騎兵機械化"
 RAJ_mechanization_of_the_cavalry_desc: "騎兵作戰的時代已經結束。通過實現騎兵機械化，我們將其轉變為現代化裝甲部隊，結合速度與火力，主宰戰場，引領印度邁向戰爭的未來。"
 RAJ_mountain_tanks: "山地坦克"
 RAJ_mountain_tanks_desc: "傳統坦克在崎嶇地形中表現欠佳，但專門設計的山地坦克將為我們在高海拔作戰中提供優勢。這些靈活的戰鬥機器將主宰山地，確保戰略要地，並在敵人面前佔據主動。"
 RAJ_siege_batteries: "攻城炮兵部隊"
 RAJ_siege_batteries_desc: "當防禦工事阻礙我們的進攻時，攻城炮兵部隊將摧毀它們。這些重型火炮部隊具有無與倫比的破壞力，確保任何堡壘或據點都無法阻擋我們的前進。"
 RAJ_mountain_guns: "山地火炮"
 RAJ_mountain_guns_desc: "高海拔戰爭需要適應性強的武器。專為崎嶇地形設計的山地火炮能為部隊提供至關重要的火力支持，即使在最嚴酷的戰鬥環境中也能確保優勢。"
 RAJ_regimental_loyalty: "軍團忠誠"
 RAJ_regimental_loyalty_desc: "軍團忠誠的紐帶在我們的部隊中鑄就了團結與紀律。通過培養對這些傳統的自豪感，我們創造了一支以榮譽、信任和堅定勝利決心為核心的軍隊。"
 RAJ_uplifting_the_people_of_india: "加強印度人民的福祉"
 RAJ_uplifting_the_people_of_india_desc: "印度人民必須堅定不移地走向獨立。為了實現這一點，需要首先滿足他們的基本需求；因此為了實現這一目標，我們將落實相關政策。"
 RAJ_gurkhas: "廓爾喀部隊"
 RAJ_gurkhas_desc: "以勇敢和頑強著稱的廓爾喀部隊是無可匹敵的精銳力量。通過擴大他們的作用並確保他們對我們的事業的忠誠，我們在戰場上佔據了關鍵優勢。"
 RAJ_lions_of_the_great_war_: "大戰之獅"
 RAJ_lions_of_the_great_war__desc: "印度士兵在世界大戰中的犧牲見證了他們的英勇。通過紀念他們的遺產，我們向他們的勇氣致敬，並激勵新一代傳承他們的精神，為印度的未來而戰。"
 RAJ_abolish_agrarian_society_criteria: "加速工業化"
 RAJ_abolish_agrarian_society_criteria_desc: "在現代社會，我們必須在經濟發展方面與其他國家保持同步。我們依賴農業的時間太久了。現在是時候為快速工業化鋪平道路，帶領[RAJ.GetNameDef]邁進一個進步的新時代了。"
 RAJ_abolish_agrarian_society_criteria_tt: "永久減少§Y3§!個月的§Y$idea_RAJ_agrarian_society$§!的影響時間"
 RAJ_womens_auxiliary_corps: "女子輔助部隊"
 RAJ_womens_auxiliary_corps_desc: "通過建立女子輔助部隊，我們賦予女性在關鍵支援角色中服務的能力，增強了我們的武裝力量。她們的貢獻將加強後勤、通信和行動，證明每位印度人都可以在確保國家未來中發揮作用。"
 RAJ_indian_territorial_force: "[ROOT.GetAdjective]領土部隊"
 RAJ_indian_territorial_force_desc: "[ROOT.GetAdjective]領土部隊將提供一支受過訓練的公民後備軍，隨時準備保衛祖國。"
 RAJ_military_engineer_services: "軍事工程服務部"
 RAJ_military_engineer_services_desc: "軍事工程服務部是軍事基礎設施的支柱，從防禦工事到補給線。通過強化這一關鍵部門，可以確保我們的部隊擁有道路、基地和防禦設施，在任何衝突中都能取得勝利。"
 RAJ_the_burma_rifles: "緬甸步兵團"
 RAJ_the_burma_rifles_desc: "緬甸步兵團是維護東部前線複雜地形安全的關鍵力量。通過加強和現代化這一團體，我們確保了穩定，捍衛了重要地區，併為未來的戰略挑戰做好準備。"
 RAJ_help_from_the_nagas: "那加人的支持"
 RAJ_help_from_the_nagas_desc: "那加人對地形的熟悉和無與倫比的游擊戰技能使他們成為寶貴的盟友。通過獲得他們的支持，我們鞏固了在東北地區的地位，使崎嶇的山丘成為抵抗與力量的堡壘。"
 RAJ_campaign_against_agrarian_societys: "工業化方案"
 RAJ_campaign_against_agrarian_societys_desc: "印度不能停留在上個世紀。我們需要集中力量提升人民的生活水平。"
 RAJ_indianize_the_army: "印度化軍隊"
 RAJ_indianize_the_army_desc: "是時候用印度人的領導來取代殖民影響了。通過提拔印度軍官並重組軍隊，我們建立了一支真正代表並服務於國家的軍事力量。"
 RAJ_keep_british_generals: "保留英國將領"
 RAJ_keep_british_generals_desc: "在這些不確定的時期，經驗豐富的領導力至關重要。保留英國將領確保軍隊從他們的專業知識和紀律中受益，在我們邁向獨立的道路上保持穩定和效率。"
 RAJ_keep_british_generals_tt: "即使我們與[ENG.GetName]交戰，我們也將保留所有英國將領"
 RAJ_chindits_: "欽迪特遣隊"
 RAJ_chindits__desc: "欽迪特遣隊是為遠程叢林作戰而訓練的精銳特種部隊。通過擴充他們的隊伍並完善戰術，我們就能得到一支能在計謀上勝過敵人，能在深入敵後擾亂敵人行動的部隊。"
 RAJ_viceroys_body_guard: "總督衛隊"
 RAJ_viceroys_body_guard_desc: "總督衛隊象徵著傳統、紀律和威望。通過維護並使這支著名的騎兵部隊現代化，我們得以保留權威的象徵，同時適應時代的挑戰。"
 RAJ_engineering_revolution: "工程革命"
 RAJ_engineering_revolution_desc: "印度的進步需要一場工程革命。通過投資基礎設施、工業發展和尖端技術，我們可以將印度轉變為一個在和平與戰爭中都具領導力的強國。"
 RAJ_ordnance_factory_kanpur_uttar_pradesh: "坎普爾兵工廠"
 RAJ_ordnance_factory_kanpur_uttar_pradesh_desc: "位於坎普爾的兵工廠是印度國防生產的基石。通過擴展其能力和現代化設施，我們確保了武器裝備的穩定供應，使部隊能夠保衛國家並維護安全。"
 RAJ_indian_air_force: "[ROOT.GetAdjective]空軍"
 RAJ_indian_air_force_desc: "天空是現代戰爭的新前沿。通過建立強大而獨立的印度空軍，我們捍衛主權，主宰天空，併為未來的衝突做好準備。"
 RAJ_the_burma_road: "緬甸公路"
 RAJ_the_burma_road_desc: "緬甸公路是一條關鍵的補給線，將印度與東南亞乃至更遠的地區連接起來。保護並擴展這一道路確保了資源和援軍的穩定流動，加強了我們在該地區的地位，並支持了盟友。"
 RAJ_womens_auxiliary_air_force: "女子輔助空軍"
 RAJ_womens_auxiliary_air_force_desc: "女子輔助空軍賦予女性支持航空行動的能力，從後勤到通信。通過整合她們的才能，我們增強了空軍的實力，並證明每個印度人都能為保衛國家的天空做出貢獻。"
 RAJ_trainer_planes: "教練機"
 RAJ_trainer_planes_desc: "熟練的飛行員是強大空軍的基石。通過投資教練機，我們確保飛行員接受最佳訓練，培養一支精英飛行員隊伍，隨時準備保衛印度的天空。"
 RAJ_spitfire: "噴火式戰鬥機"
 RAJ_spitfire_desc: "以速度和靈活著稱的噴火戰機將成為我們現代空軍的核心，確保我們的制空權，並能有效應對任何空中威脅。"
 RAJ_ground_pounder: "對岸炮擊者"
 RAJ_ground_pounder_desc: "印度崎嶇的地形使得坦克難以快速機動。近距離空中支援將是彌補缺乏重型地面支援的關鍵。"
 RAJ_douglas_dakota: "道格拉斯·達科他運輸機"
 RAJ_douglas_dakota_desc: "我們急需快速運輸部隊和物資。“達科他”運輸機非常適合執行這項任務。"
 RAJ_vultee_vengeance: "復仇者俯衝轟炸機"
 RAJ_vultee_vengeance_desc: "獲得美國的復仇者俯衝轟炸機後，我們能以非常合理的成本大幅加強我們的空軍實力。"
 RAJ_ordnance_factory_khamaria_jabalpur: "賈巴爾普爾卡馬利亞兵工廠"
 RAJ_ordnance_factory_khamaria_jabalpur_desc: "位於賈巴爾普爾的卡馬利亞兵工廠是彈藥和武器生產的關鍵基地。擴展其生產能力將加強我軍的火力，確保部隊在未來挑戰中保持裝備優勢。"
 RAJ_ordnance_factory_medak: "梅德格兵工廠"
 RAJ_ordnance_factory_medak_desc: "專門生產裝甲車輛的梅德格兵工廠是現代化軍隊的重要支柱。擴展其運營能力可以確保我們的部隊配備主導戰場所需的先進裝備。"
 RAJ_chariot_of_victory: "勝利戰車"
 RAJ_chariot_of_victory_desc: "戰場需要速度和力量。通過投資裝甲車輛和機械化部隊，我們打造出一支能夠迅速取得決定性勝利的現代化軍隊，確保印度在任何衝突中的主導地位。"
 RAJ_the_ledo_road: "中印公路"
 RAJ_the_ledo_road_desc: "穿越崎嶇地形的中印公路是連接印度與中國盟軍的重要補給線。完成並確保這一生命線的安全，保證了部隊、資源和裝備的流動，為扭轉東南亞局勢提供了支持。"
 RAJ_long_range_escorts: "遠程護航機"
 RAJ_long_range_escorts_desc: "為了保護重要補給線和任務，我們需要能夠遠距離護航轟炸機和運輸機的飛機。投資遠程護航機確保了我們的空中優勢以及遠程行動的安全性。"
 RAJ_british_air_experts: "英國空軍專家"
 RAJ_british_air_experts_desc: "利用經驗豐富的英國飛行員和工程師的專業知識，可以加速我們空軍的發展。他們在現代空戰中的經驗將為我們建設一支強大的空中力量提供寶貴見解。"
 RAJ_special_operations_executive: "特別行動執行處"
 RAJ_special_operations_executive_desc: "特別行動執行處專注於非常規戰爭，從破壞活動到情報收集。擴大其在印度的作用將為我們提供破壞敵人計劃的工具，並將秘密行動轉化為戰略優勢。"
 RAJ_the_ordnance_factories_board: "兵工廠委員會"
 RAJ_the_ordnance_factories_board_desc: "將印度龐大的兵工廠網絡整合到統一的委員會之下，將簡化生產、提高效率，並確保穩定的武器和彈藥供應。這一基礎將增強我們的軍隊實力，推動印度在國防制造業中的自力更生。"
 RAJ_smiling_buddah: "微笑的佛陀"
 RAJ_smiling_buddah_desc: "微笑的佛陀計劃標誌著印度進入核能力領域。通過掌握這一技術，我們在全球舞臺上宣示獨立，並建立起強大的威懾力量，以捍衛主權。"
 RAJ_royal_indian_air_force_dlc: "[ROOT.GetAdjective]皇家空軍"
 RAJ_royal_indian_air_force_dlc_desc: "印度皇家空軍代表著印度空中力量的巔峰。通過配備現代化飛機並加強訓練，我們確保在空中佔據主導地位，隨時準備保衛國家，並在整個區域投射力量。"
 RAJ_infiltrate_aden: "滲透亞丁"
 RAJ_infiltrate_aden_desc: "亞丁是英國勢力的戰略要地，也是削弱其區域控制的關鍵。通過滲透並組織當地抵抗力量，我們可以點燃反抗的火焰，削弱英國的控制，為獨立鬥爭創造混亂局面。"
 RAJ_go_into_hiding: "隱匿行蹤"
 RAJ_go_into_hiding_desc: "蘇巴斯·錢德拉·鮑斯必須避開英國的監視，繼續推動獨立鬥爭。通過進入隱匿狀態，他確保了運動領導層的完整，為適時出擊做好準備。"
 RAJ_trade_protection: "貿易保護"
 RAJ_trade_protection_desc: "為了確保經濟繁榮，我們必須保護重要的貿易路線和產業免受外國剝削。加強貿易保護將確保印度資源安全，促進國內增長，並保護我們的市場免受外部威脅。"
 RAJ_seek_japanese_support_tt: "當獨立戰爭開始時[JAP.GetNameDef]會給予我們：\n§Y120§!架B4Y海軍轟炸機\n§Y135§!架[Jap.GetAdjective]Ki-10戰鬥機\n它們的相應設計和\n"
 RAJ_the_enemy_of_my_enemy_tt: "§Y[JAP.GetAdjective]§!政府會向內戰的另一方宣戰並援助我們。"
 RAJ_the_enemy_of_my_enemy_tt_2: "§Y[JAP.GetAdjective]§!也會嘗試入侵§Y[733.GetName]§!並將其轉交我們。"
 RAJ_azad_hind_dlc_tt: "我們會獲得："
 RAJ_azad_hind_dlc_tt_2: "§R內戰§!的前§Y120§!天"
 RAJ_give_me_blood_and_i_will_grant_you_freedom_tt: "會發起民主主義支持者與我們之間的獨立內戰\n高於§Y65%§!或§Y85%抵抗度§!的所有地區會在內戰中支持我們，並根據最高抵抗度給予我們1或2個師。\n其他地區會支持民主派。"
 ###
 RAJ_infiltrate_aden_tt: "當獨立戰爭開始時在§Y[659.GetName]§!、§Y[906.GetName]§!、§Y[658.GetName]§!、§Y[765.GetName]§!、§Y[422.GetName]§!和§Y[656.GetName]§!徵召民兵攻擊[ENG.GetName]佔領區。"
 RAJ_go_into_hiding_tt: "鮑斯將逃離監禁，開始他的旅程，並在內戰開始時返回"
 RAJ_war_taxes_tt: "解鎖決議，交戰的每個國家都可以使我們提高戰爭稅。"
 RAJ_akhand_bharat: "大婆羅多"
 RAJ_akhand_bharat_desc: "大婆羅多必須保持統一。所有忠於印度民族和其國家的公民，無論種姓、派別或宗教，都將被平等對待，共同承擔責任。"
 RAJ_akhand_bharat_tt: "解鎖決議將[AFG.GetName]、[MLD.GetName]、[NEP.GetName]、[PAK.GetName]、[BAN.GetName]、[BHU.GetName]、[SRL.GetName]納為核心領土併成立大婆羅多。可以一次選擇一個目標國家，佔領其現有全部核心領土後，繼續宣稱更多核心。"
 RAJ_two_nation_theory_dlc: "$RAJ_two_nation_theory$"
 RAJ_two_nation_theory_dlc_desc: "$RAJ_two_nation_theory__desc$"
 RAJ_extended_franchise: "擴大權利"
 RAJ_extended_franchise_desc: "擴大普通[GetRajAdjective]人的權利是削弱[ENG.GetAdjective]人對國家控制的重要舉措。"
 RAJ_hand_over_aden_to_the_crown: "將亞丁交予英國"
 RAJ_hand_over_aden_to_the_crown_desc: "按照計劃，[ROOT.GetNameDef]將亞丁的統治權交予英國王室，以減少行政負擔。"
 RAJ_renegotiate_adens_control: "重新談判亞丁的控制權"
 RAJ_renegotiate_adens_control_desc: "儘管計劃是將亞丁交給[ENG.GetName]，但擁有紅海邊的一個貿易港口有巨大的潛在利益。我們需要重新談判這一政策，並保留對亞丁的控制權。"
 RAJ_renegotiate_adens_control_tt: "我們將保留[992.GetName]的控制權，而非將其移交給[ENG.GetName]"
 RAJ_cripps_mission_dlc: "$RAJ_cripps_mission$"
 RAJ_cripps_mission_dlc_desc: "$RAJ_cripps_mission_desc$"
 RAJ_trade_port: "貿易港"
 RAJ_trade_port_desc: "目前亞丁只是一個小港口，但通過投資，它可以轉變為一個繁榮的港口。"
 RAJ_fortify_aden: "強化亞丁"
 RAJ_fortify_aden_desc: "既然亞丁已成為重要港口，就需要加強其防禦以應對潛在攻擊。"
 RAJ_purna_swaraj: "自治——印度獨立宣言"
 RAJ_purna_swaraj_desc: "[ENG.GetAdjective]政府不僅剝奪了[RAJ.GetAdjective]人民的自由，還建立在對大眾的剝削之上，破壞了印度的經濟、政治、文化和精神。因此，印度必須切斷與[ENG.GetAdjective]的聯繫，實現完全獨立。"
 RAJ_the_second_duar_war: "第二次杜瓦爾戰爭"
 RAJ_the_second_duar_war_desc: "[BHU.GetAdjective]人民在當前國際局勢下已無法繼續作為一個獨立國家。我們需要將其納入印度版圖。"
 RAJ_bhutanese_protectorate: "不丹保護國"
 RAJ_bhutanese_protectorate_desc: "我們需要尊重[BHU.GetAdjective]人民的孤立傳統，但同時也不能否認，小國會被有帝國野心的強國吞併。我們應給予他們印度的保護。"
 RAJ_bhutanese_protectorate_tt: "§Y[BHU.GetName]§!將成為§Y[RAJ.GetNameDefCap]§!的自治領。\n\n他們更可能接受，若：\n\t-他們對我們的評價很高\n\t-我們的軍隊明顯強於他們"
 RAJ_give_sikkim_administrative_rights_for_bhutan: "將錫金的行政權移交不丹"
 RAJ_all_india_students_federation: "全印學生聯合會"
 RAJ_all_india_students_federation_desc: "動員學生反對[ENG.GetAdjective]的統治，確保我們的優秀年輕人致力於對抗現有的秩序。"
 RAJ_league_against_gandhism: "反甘地主義聯盟"
 RAJ_league_against_gandhism_desc: "聖雄甘地的非暴力政策令人欽佩。然而，[ENG.GetAdjective]已一次又一次地證明他們會用子彈回應抗議。因此，我們需要一種新策略，如果必要，可以訴諸流血的手段。"
 RAJ_league_against_gandhism_tt: "分治動亂事件現在觸發時會給予§G5%§!戰爭支持度，最高§Y+50%§!。"
 RAJ_league_against_gandhism_tt_event: "支持§Y$RAJ_league_against_gandhism$§!將增加§G+5%§!戰爭支持度"
 RAJ_mahatma: "聖雄"
 RAJ_mahatma_desc: "聖雄甘地無疑是獨立運動的象徵。有了他與賈瓦哈拉爾·尼赫魯並肩作戰，我們將打破束縛我們的英國枷鎖。"
 RAJ_swadeshi_movement: "抵制英貨運動"
 RAJ_swadeshi_movement_desc: "抵制英貨，自給自足，旨在擺脫對[ENG.GetAdjective]的依賴，激發獨立鬥爭，並將印度的財富留在印度。"
 RAJ_form_a_federal_court: "建立聯邦法院"
 RAJ_form_a_federal_court_desc: "任何形式的民主都需要一個聯邦法院來維護法治。我們必須確保由同胞而非[ENG.GetAdjective]的法律人士來裁判我們。"
 RAJ_defense_of_india_act: "印度國防法"
 RAJ_defense_of_india_act_desc: "[GetRajName]的安全受到外部侵略威脅。[ROOT.GetLeader]已通過宣言實施了一項法案，為保障公共安全和利益及捍衛[GetRajAdjective]採取特別措施。"
 RAJ_a_congress_resurgent: "國大黨復興"
 RAJ_a_congress_resurgent_desc: "國民大會黨在力量和聲望上都迅速崛起。它現已成為不可忽視的政治力量。"
 RAJ_khadi_movement: "卡迪運動"
 RAJ_khadi_movement_desc: "作為抵制英貨運動的一部分，卡迪布料已成為獨立的象徵。這種手工紡織品不僅象徵著抵抗，還為貧困者提供了大量經濟機會。"
 RAJ_boycott_british_made_goods: "抵制英國商品"
 RAJ_boycott_british_made_goods_desc: "長期以來，[ENG.GetAdjective]從[GetRajName]榨取原材料，並以高價將加工後的成品賣回給我們。[RAJ.GetRajAdjective]人應該為[RAJ.GetRajAdjective]人制造產品，而不是被殖民者剝削。"
 RAJ_litteracy_effort: "掃盲工作"
 RAJ_litteracy_effort_desc: "未受教育的民眾就像一扇敞開的門，毫無防備。識字是一項每個人都需要的關鍵技能。畢竟，如果有誰懼怕一個知情的大眾，那一定是控制他們的牧羊人。"
 RAJ_debt_relief: "債務減免"
 RAJ_debt_relief_desc: "長期以來，富裕的[ENG.GetAdjective]人與[GetRajAdjective]人通過債務陷阱欺騙普通人，導致這一問題已根深蒂固。我們將推動地方政府為這些人提供減免，以減輕被困在不公系統中的負擔。"
 RAJ_expand_healthcare_facilities: "增加醫療設施"
 RAJ_expand_healthcare_facilities_desc: "[GetRajName]的醫療設施嚴重不足。痢疾、霍亂和瘧疾在農村肆虐，阻礙了發展。增加各地的設施將有效應對這一局面。"
 RAJ_indo_centric_curriculum: "印度本位教育課程"
 RAJ_indo_centric_curriculum_desc: "[GetRajName]的教育體系長期以來以[ENG.GetAdjective]世界觀為中心，削弱了[GetRajAdjective]的身份認同，將我們的歷史簡化為屈從的歷史。我們需要基於[GetRajAdjective]身份建立教育體系，教導兒童我們的歷史。"
 RAJ_enrollment_of_dali_children: "招收達利特兒童"
 RAJ_enrollment_of_dali_children_desc: "達利特，即“不可接觸者”，他們是種姓制度中最低的階層，長期生活在貧困之中。要撼動這種體系的汙點，必須從將達利特兒童送入學校開始。"
 RAJ_local_resistance_to_land_taxes: "地方對土地稅的抵制"
 RAJ_local_resistance_to_land_taxes_desc: "德里政府的財政很大程度上依賴地方稅。如果我們鼓勵人民拒絕繳納這些稅款，將能扼殺政府的財政來源，同時讓百姓獲得更多的財富份額。"
 RAJ_tenancy_reforms: "租賃改革"
 RAJ_tenancy_reforms_desc: "富裕的“黑帽”們正在壟斷住房市場，抬高房價，壓低生活標準，侵害普通民眾利益。國大黨將強力推動租賃改革，為房東設置租金上限，保護普通人的居住權。"
 RAJ_quinine: "奎寧"
 RAJ_quinine_tt: "解鎖§Y額外補給§!能力的改進版本。\n\n指揮點數花費：§Y0.15§!（每個營）\n持續時間：§Y10天§!\n冷卻時間：§Y21天§!\n\n§Y激活後：§!\n陸軍師損耗：§G12.0%§!\n炎熱損耗：§G35.00%§!\n攜行補給：§G+240小時§!\n患病幾率：§G-100.00%§!\n交付部隊足夠消耗§Y240§!小時的補給"
 RAJ_quinine_desc: "為部隊提供奎寧及類似藥物，可以讓士兵在熱帶環境中作戰時免受瘧疾的侵害。"
 RAJ_temple_entry_movements: "入寺運動"
 RAJ_temple_entry_movements_desc: "不可接觸制度是這個國家的汙點，只會加深分裂。為反對這一現象，我們將允許所有種姓的人進入他們的禮拜場所。"
 RAJ_freedom_of_the_press: "新聞自由"
 RAJ_freedom_of_the_press_desc: "新聞自由是任何新生民主的必要條件，沒有它，威權主義便觸手可及。"
 RAJ_provincial_autonomy: "走向獨立之路"
 RAJ_provincial_autonomy_occupation_law_tt: "為土邦解鎖§Y$independent_rule$§!和§Y$princely_subjugation$§!佔領法案"
 RAJ_provincial_autonomy_desc: "從英國爭取更多的省份自治權是實現獨立最終目標的關鍵第一步。"
 RAJ_provincial_autonomy_tt: "\n通過§Y兩個民族理論§!完全擺脫束縛，我們需要完成§Y統一孟加拉§!或§Y東巴基斯坦§!。\n\n通過§Y統一印度§!完全擺脫束縛，我們需要完成§Y世俗國家§!\n\n§Y§!通過§Y反甘地主義聯盟§!完全擺脫束縛，我們需要完成§Y紅色陰影§!或§Y給我血，我將給你自由§!"
 RAJ_princely_states_policy: "土邦政策"
 RAJ_princely_states_policy_desc: "土邦的規模與影響力各不相同，從強大的海得拉巴到北部邊疆的小邦國。我們需要制定政策來應對這些土邦。"
 RAJ_indian_legion: "印度軍團"
 RAJ_indian_legion_desc: "由[GER.GetName]控制的外國印度流亡者組成的印度軍團在沙漠戰爭中接受了廣泛的訓練。我們可以利用他們的專業知識改進自己的部隊。"
 RAJ_the_pakistan_movement: "巴基斯坦運動"
 RAJ_the_pakistan_movement_desc: "要求建立穆斯林家園“巴基斯坦”的呼聲日益高漲。如果印度教徒與穆斯林之間的衝突持續下去，維持一個統一的印度可能難以實現。"
 RAJ_the_pakistan_movement_tt_1: "刷新直至以下任一條件達成：\n§Y[PAK.GetName]§!獨立\n§Y[PAK.GetName]§!投降\n-已重複§Y5§!次\n\n在持續§Y90天§!的影響結束時，我們將獲得："
 RAJ_the_pakistan_movement_tt_2: "為期§Y90§!天"
 RAJ_assam_oil_dlc: "阿薩姆石油"
 RAJ_assam_oil_dlc_desc: "我們最近在阿薩姆發現了大型油田。我們可以建立一家國有石油公司並在阿薩姆建造油井，大幅改善我們的經濟。"
 RAJ_tata_steel_dlc: "塔塔鋼鐵"
 RAJ_tata_steel_dlc_desc: "$RAJ_tata_steel_desc$"
 RAJ_incorporation_of_the_east_india_company: "吸收東印度公司"
 RAJ_incorporation_of_the_east_india_company_desc: "經過大蕭條的衝擊以及日益高漲的獨立呼聲，顯然，[ENG.GetAdjective]當局已無法繼續承擔治理印度的重擔。雖然這可能導致暫時的不穩定，但現狀已不可持續。"
 RAJ_incorporation_of_the_east_india_company_tt: "§Y英屬印度§!會被劃分為§Y東印度公司§!和§Y印度§!的剩餘部分"
 RAJ_special_economic_zones: "經濟特區"
 RAJ_special_economic_zones_desc: "我們將設立經濟特區，方便企業投資，同時減輕這些企業的稅收負擔。"
 RAJ_seek_intial_funding: "尋求啟動資金"
 RAJ_seek_intial_funding_desc: "為了給我們的宏偉藍圖打下基礎，我們必須爭取[ENG.GetAdjective]投資者的資本。他們帶來的啟動資金將成為點燃我國經濟引擎的火花。"
 RAJ_seek_intial_funding_tt: "增加§G3§!建築位\n§Y$RAJ_incorporation_of_the_east_india_company$§!完成時為首都增加§G3§!§Y民用工廠§!"
 RAJ_seek_intial_funding_unlock_tt: "解鎖§Y$RAJ_seek_intial_funding$§!國策\n\n"
 has_paid_initial_funding: "已支付投資者分紅"
 RAJ_princely_autonomy: "土邦自治"
 RAJ_princely_autonomy_tt: "釋放一個土邦為附庸後，附加："
 RAJ_princely_autonomy_desc: "次大陸正在緩慢走向不穩定。我們將利用當地的王公建立控制，他們表面上擁有地方權力，而我們則獲得回報，只要他們按時繳納貢金。"
 RAJ_funnel_british_investments_into_princely_states: "投資土邦"
 RAJ_funnel_british_investments_into_princely_states_tt: "位於次大陸的每個附庸將獲得§G1§!個§Y民用工廠§!和§G3§!個建築位。\n尚未釋放的附庸在釋放後也將獲得這一獎勵。"
 RAJ_funnel_british_investments_into_princely_states_desc: "帝國規定所有對公司的投資必須在印度境內進行，但並未明確這些資金必須用於公司本身。"
 RAJ_demobilize: "復員"
 RAJ_demobilize_desc: "政府的關鍵要求之一是我們必須解散軍隊，只保留一支象徵性的維和部隊。他們是在擔心我們的軍隊會超過他們自己的規模嗎？"
 RAJ_form_a_police_force: "組建安全部隊"
 RAJ_form_a_police_force_desc: "儘管受到限制無法組建正規軍，我們仍被授權在增強警力的名義下建立並武裝一支安全部隊。這是維護我們利益的關鍵一步。"
 RAJ_a_private_military: "私人軍事力量"
 RAJ_a_private_military_tt_1: "創建裝備齊全且滿員的非正規部隊。\n\n志願部隊送往未曾派遣的國家時，可獲得§G1§!個海外§Y民用工廠§!，持續§Y365§!天。\n§Y540§!天后向同一國家派遣新志願軍將再次獲得工廠。\n\n這些工廠不計入§Y稅收§!"
 RAJ_a_private_military_desc: "將地方警察轉變為私人軍事力量將是輕而易舉的事。從技術上講，他們不會隸屬於任何軍隊，而是由公司直接支付薪水，以符合政府的規定。"
 RAJ_headhunt_army_personell: "挖角軍隊人員"
 RAJ_headhunt_army_personell_desc: "有很多失業的前軍隊精英正在尋找工作，我們可以向他們提供比政府更優厚的待遇。"
 RAJ_lobby_for_increased_policing_responsibilities: "遊說增加警察職責"
 RAJ_lobby_for_increased_policing_responsibilities_desc: "如今世界不再如以往般平靜。內部與外部的緊張局勢讓我們獲得了更多保護公司財產的理由。我們將遊說增加私人軍事公司的開支，政府必然會接受，如果沒有，任何人都有其價碼。"
 RAJ_circuvment_demobilization_restrictions: "規避限制"
 RAJ_circuvment_demobilization_restrictions_desc: "政府仍對我們可以動員的人數保持嚴格限制。王室顯然對不受其控制的軍隊感到憂慮。但沒關係，總有辦法規避這些限制，比如通過賄賂或不將某些宗教僱員計入軍隊編制。"
 RAJ_manipulate_army_statistics: "操縱軍隊統計"
 RAJ_manipulate_army_statistics_tt: "創建裝備齊全的滿員非正規部隊。"
 RAJ_manipulate_army_statistics_desc: "帝國當局對我們的私人軍事承包商變得過於強大和有影響力表示擔憂，擔心它可能挑戰現有的正規軍。但我們總能用龐雜的數據和虛假報告讓政府檢查員頭昏眼花。"
 RAJ_just_good_business: "只是生意"
 RAJ_just_good_business_desc: "我們對東方的同僚沒有任何惡意，只是他們擁有我們所需的資源，這僅僅是生意而已。"
 RAJ_crush_the_anathema: "消滅禍害"
 RAJ_crush_the_anathema_desc: "共產主義是商業的禍害。金錢推動世界運轉，由共產主義統治的世界只會導致停滯。我們必須將腐朽的根源焚燒殆盡。"
 RAJ_nothing_personal: "無關私怨"
 RAJ_nothing_personal_tt: "創建針對§Y[ENG.GetNameDef]§!及§Y英聯邦國家§!的戰爭目標。"
 RAJ_nothing_personal_desc: "帝國長期以來將他們的意志強加於我們，通過古老的措施遏制我們的發展。這並非私人恩怨，但政府不能成為我們發展不佳的原因。"
 RAJ_bombay_trade_port: "孟買貿易港"
 RAJ_bombay_trade_port_desc: "孟買有潛力成為世界級的貿易港口，促進大規模商品的進出口。它所需要的只是擴大港口設施的投資。"
 RAJ_take_in_british_naval_experts: "吸納[ENG.GetAdjective]海軍專家"
 RAJ_take_in_british_naval_experts_desc: "英國擁有全球最優秀的海軍專家，將一些專家帶到這裡並不困難。"
 RAJ_the_need_for_a_mercantile_navy: "建立商貿海軍的需求"
 RAJ_the_need_for_a_mercantile_navy_desc: "海上貿易是全球貿易的最重要方式。我們需要一支海軍，不僅能運輸這些貨物，還能保護它們。"
 RAJ_trade_route_protection: "貿易航線保護"
 RAJ_trade_route_protection_desc: "東西兩側的敵對勢力正在成形。我們需要具備威懾能力，以防止任何試圖掠奪我們海上貨物的勢力得逞。"
 RAJ_procure_the_guns: "伐樓拿炮"
 RAJ_procure_the_guns_desc: "我們需要一個足夠強大的威懾來保護我們的航線，而這個威懾需要一門巨大的火炮，非常巨大的火炮。"
 RAJ_procure_the_task_force: "伐樓拿特遣艦隊"
 RAJ_procure_the_task_force_desc: "即使是最大的戰艦也需要護航艦隊來有效保護它們免受敵艦威脅。通過組建強大的海軍特遣隊，我們可以確保我們的主力艦完成其主要任務。"
 RAJ_procure_the_armor: "伐樓拿裝甲"
 RAJ_procure_the_armor_desc: "伐樓拿需要厚重的裝甲，非常厚重的裝甲。我們必須在較低成本的項目上進行原型開發以降低開支。"
 RAJ_institutional_money_laundering: "機構性洗錢"
 RAJ_institutional_money_laundering_desc: "投資者不需要知道資金的具體流向，對吧？我們最大化利潤的目標難道不是無可非議的嗎？即使這需要一些欺詐手段，他們也不會察覺。"
 RAJ_institutional_money_laundering_tt: ""
 RAJ_appoint_a_c_suite: "任命高管團隊"
 RAJ_appoint_a_c_suite_desc: "強有力的企業領導是我們成功的關鍵。通過組建一支有能力的執行團隊，我們將確保管理高效、戰略清晰、增長穩定。"
 RAJ_company_bonuses: "公司獎金"
 RAJ_company_bonuses_desc: "我們將績效與潛在獎金掛鉤，以提升公司整體效率。"
 RAJ_creative_accounting: "創造性會計手段"
 RAJ_creative_accounting_desc: "通過一些創造性會計技巧，我們可以將一部分利潤“消失”，或者至少讓稅務機關相信這一點。"
 RAJ_privatized_healthcare: "私有化醫療"
 RAJ_privatized_healthcare_desc: "必須遏制在我們領地內推廣共產主義醫療計劃的呼聲。醫療服務應由市場的看不見的手提供給那些付得起錢的人。"
 RAJ_arrest_congress_leaders: "逮捕國大黨領袖"
 RAJ_arrest_congress_leaders_desc: "國大黨領袖拒絕接受公司統治的新現實。他們仍然伺機抵抗，攪動風波。我們必須剷除這些麻煩製造者，以免事態蔓延。"
 RAJ_union_busting: "打擊工會"
 RAJ_union_busting_desc: "工會是創新和基於能力晉升的障礙，對工人毫無幫助，反而用繁文縟節拖累公司。必須摧毀這種共產主義的政策，防止其傳播。"
 RAJ_night_shifts: "夜班"
 RAJ_night_shifts_desc: "引入夜班制度將提高運營能力，加速生產。這筆額外成本是達成全天候生產效率的小小代價。"
 RAJ_legalize_the_opium_trade: "合法化鴉片貿易"
 RAJ_legalize_the_opium_trade_desc: "儘管具有爭議，但鴉片合法化必然會帶來巨大的經濟收益。通過對其貿易進行監管，我們可以將惡習轉化為我們財政戰略中極具價值的一個支柱。"
 RAJ_force_china_to_accept_opium_trade: "第三次鴉片戰爭"
 RAJ_force_china_to_accept_opium_trade_tt: "全球鴉片市場即將出現。一些將軍對此或許會過於熱衷……"
 RAJ_force_china_to_accept_opium_trade_desc: "[CHI.GetName]試圖控制其鴉片貿易，這與我們的增長目標有直接衝突。我們必須確保他們認識到自己的錯誤。"
 RAJ_new_economic_policy: "新經濟政策"
 RAJ_new_economic_policy_desc: "我們將堅持推行低稅率與親商政策相結合的發展模式，以此促進資本投入與企業成長。"
 RAJ_phantom_armies: "吃空餉"
 RAJ_phantom_armies_desc: "如果我們誇大資產負債表上僱傭的軍事人員數量，就可以欺騙稅務局。"
 RAJ_corporate_domination: "控制企業"
 RAJ_corporate_domination_desc: "我們逐漸鞏固了對次大陸的掌控，我們對私營和公共部門的影響力加強了。鑑於我們的目標是實現全面控制，我們得以直接或間接使所有企業提高生產力。"
 RAJ_restrictive_administration_budget: "嚴格的行政預算"
 RAJ_restrictive_administration_budget_desc: "為保持財政紀律，所有非必要支出必須削減。效率要求我們將資源集中在具有可觀收益的領域。"
 RAJ_open_up_new_markets: "開拓新市場"
 RAJ_open_up_new_markets_desc: "如果不採取激進行動來擴展市場，我們的現有市場將在未來幾年內達到飽和。因此，我們將通過侵略性收購鄰近領土來擴大市場。"
 RAJ_hostile_takeover: "惡意收購"
 RAJ_hostile_takeover_tt: "解鎖用§Y民用工廠§!購買地區的決議。購買我們開局擁有的地區會有折扣。"
 RAJ_hostile_takeover_desc: "一切都可以買到，一切都可以。這只是一個價格問題，以及一個人願意屈尊到什麼程度。"
 RAJ_shareholder_democracy: "股東民主"
 RAJ_shareholder_democracy_desc: "國家的立法權實際上掌握在公司手中。法官和立法者都在我們的工資單上，這讓我們能夠輕鬆通過有利的立法，並分化反對派。"
 RAJ_debt_manipulation: "債務操控"
 RAJ_debt_manipulation_desc: "我們可以利用現有的債務虛報虧損，這樣我們就能少交稅並儲備過剩利潤。"
 RAJ_productivity_mandate: "生產力任務"
 RAJ_productivity_mandate_desc: "由於我們對投資者做出了承諾，因此我們必須在所有領域最大限度提高產出。生產力不再是目標，而成了必須要不惜一切代價達成的強制性的要求。"
 RAJ_lowest_bigger_construction: "削減建設成本"
 RAJ_lowest_bigger_construction_desc: "我們應始終選擇出價最低的承包商以降低建設成本。"
 RAJ_water_privatization: "水資源私有化"
 RAJ_water_privatization_desc: "我們將與地方供水商建立公私合營夥伴關係，以提高效率和服務質量。"
 RAJ_expand_tax_loopholes: "利用稅收漏洞"
 RAJ_expand_tax_loopholes_desc: "通過利用稅法漏洞，我們可以合法降低稅負，將節省下來的資金再投資於進一步擴張。效率終究始於財務報表。"
 RAJ_land_grab: "土地收購"
 RAJ_land_grab_desc: "為滿足快速工業化的需求，我們必須在整個次大陸徵用並重新分配土地。國土擴張不能有所遲疑，因為國家的進步必須優先。"
 RAJ_deforestation: "燃料"
 RAJ_deforestation_desc: "工業需要燃料，燃料需要木材和煤炭，這些我們有的是，所以何不使用它們？"
 RAJ_agricultural_cooperatives: "農業合作社"
 RAJ_agricultural_cooperatives_tt: "在每個擁有至少4§Y民用工廠§!的地區中獲得§G1§!§Y基礎設施§!。\n每新增2§Y基礎設施§!，將額外獲得§G1§!§Y民用工廠§!。"
 RAJ_agricultural_cooperatives_desc: "由多名農民共同擁有的農業合作社是可持續發展、自力更生和賦權的關鍵。"
 RAJ_tea_exports: "茶葉出口"
 RAJ_tea_exports_tt: "§Y可最多擴展到5倍§!"
 RAJ_tea_exports_tt_2: "\n獨立後移除§Y$idea_RAJ_tea_exports$§!，"
 RAJ_tea_exports_desc: "茶葉已成為全球範圍內的主要出口商品，也是許多印度人生活的基石。"
 RAJ_cottage_industries: "家庭手工業"
 RAJ_cottage_industries_desc: "家庭手工業是重型製造業的可行替代方案，同時賦予人們獨立感。"
 RAJ_sikh_religious_guarantees: "錫克教宗教權利保障"
 RAJ_sikh_religious_guarantees_desc: "錫克教徒是重要的宗教少數群體，同時也是勇猛的戰士。我們需要通過保障他們的宗教權利來安撫他們的情緒。"
 RAJ_punjab_autonomy: "旁遮普自治"
 RAJ_punjab_autonomy_desc: "旁遮普對錫克教徒意義深遠，通過授予地方自治，我們可以贏得他們的信任。"
 RAJ_handloom_weaving: "手工織布"
 RAJ_handloom_weaving_desc: "手工織布已成為次大陸傳統與獨立的象徵，同時為當地製造業者提供了工作機會。"
 RAJ_lahore_resolution: "拉合爾決議"
 RAJ_lahore_resolution_desc: "國內的穆斯林少數群體通過了拉合爾決議，呼籲建立自己的家園——巴基斯坦。"
 RAJ_united_bengal: "統一孟加拉"
 RAJ_united_bengal_tt: "§Y[BAN.GetName]§!將在分治時獨立"
 RAJ_united_bengal_desc: "將巴基斯坦分為孟加拉和巴基斯坦兩個國家才是合理之舉。巴基斯坦政府無法有效治理遠在千里之外的孟加拉飛地。"
 RAJ_eastern_pakistan: "東巴基斯坦"
 RAJ_eastern_pakistan_tt: "§Y[BAN.GetName]§!將在分治時由§Y[PAK.GetName]§!擁有"
 RAJ_eastern_pakistan_desc: "孟加拉將成為東巴基斯坦，所有穆斯林將在一面旗幟下得到治理。"
 RAJ_partition_preparation: "分治準備"
 RAJ_partition_preparation_tt: "§Y將減少分治時的影響§!分治下我們將獲得：\n"
 RAJ_partition_preparation_tt_2: "若無此舉，我們將面臨：\n"
 RAJ_partition_preparation_desc: "我們需要為分治做好準備，否則將面臨數百萬人大規模遷徙所引發的混亂。"
 RAJ_indian_independence_act: "印度獨立法案"
 RAJ_indian_independence_act_desc: "歷史上罕見的時刻即將到來，當我們邁出舊時代，進入新時代；一個時代的結束，一個長期被壓抑的民族靈魂得以發聲。"
 RAJ_tryst_with_destiny: "命運的約定"
 RAJ_tryst_with_destiny_desc: "我們多年前與命運相約，如今兌現諾言之時已至。雖未十全十美、盡如人意，但已是實實在在的兌現了。在午夜鐘聲敲響之際，世界沉睡之時，印度將為獲得新生和自由徹夜不眠。"
 RAJ_india_united: "統一印度"
 RAJ_india_united_tt: "§Y印度將在分治期間保持統一，而不是分裂§!"
 RAJ_india_united_desc: "我們是穆斯林、印度教徒、基督徒、猶太人；我們都是印度的一部分。"
 RAJ_power_sharing_agreement: "權力分享協議"
 RAJ_power_sharing_agreement_desc: "穆斯林聯盟對我們充滿猜疑，他們擔心在一個以印度教為主的國家中，穆斯林的命運會如何脆弱。我們將與他們達成權力分享協議，平等分配權力。"
 RAJ_cabinet_mission_plan: "內閣使命計劃"
 RAJ_cabinet_mission_plan_desc: "在穆斯林和印度教徒的聯合陣線下，我們已準備好面對[ENG.GetAdjective]政府派出的代表團。"
 RAJ_inclusive_nationalism: "包容的民族主義"
 RAJ_inclusive_nationalism_desc: "對國家的民族主義和自豪感本質上並非壞事，只要我們能夠將其培養為包容性的情感。只要我們都對國家懷有共同的熱愛，紐帶就不會輕易斷裂。"
 RAJ_a_secular_state: "世俗國家"
 RAJ_a_secular_state_desc: "印度是一個宗教國家，但重要的是國家本身必須保持世俗性，以消除對少數群體潛在偏見的疑慮。"
 RAJ_a_permanent_muslim_governmental_seat: "穆斯林永久政府席位"
 RAJ_a_permanent_muslim_governmental_seat_desc: "穆斯林是我們國家中的重要少數群體，為了緩解他們對統一印度的擔憂，我們將為他們提供一個永久的政府席位。"
 RAJ_pledge_for_the_allies: "對同盟國的承諾"
 RAJ_pledge_for_the_allies_desc: "在全球法西斯主義和共產主義興起之際，印度不能孤立無援。[ENG.GetName]可能不是印度的朋友，但顯然其他人是我們的敵人。"
 RAJ_indian_prosperity_sphere: "印度共榮圈"
 RAJ_sideline_the_conflict: "置身衝突之外"
 RAJ_sideline_the_conflict_desc: "[ROOT.GetName]為何要因他人的錯誤判斷與領土侵略而受苦？我們需要專注於內部事務，而非外部問題。"
 RAJ_india_indivisible: "不可分割的印度"
 RAJ_india_indivisible_tt: "解鎖決議將§Y印度§!、§Y巴基斯坦§!和§Y孟加拉§!地區納為核心領土"
 RAJ_india_indivisible_desc: "我們的領土仍充滿不安與衝突。我們需要共同努力，讓[ROOT.GetName]實現完全統一。"
 RAJ_preamble_to_the_constitution_of_india: "[GetRajName]憲法序言"
 RAJ_preamble_to_the_constitution_of_india_desc: "我們，[GetRajName]的人民，莊嚴決定將[GetRajName]建成為一個擁有主權、社會主義、世俗、民主的共和國，並確保全體公民享有：正義、自由、平等，並在我們的制憲會議上促進他們之間的兄弟情誼。"
 RAJ_an_economy_unbound: "解放的經濟"
 RAJ_an_economy_unbound_desc: "擺脫了宗主國的束縛後，我們的經濟終於可以繁榮發展，不再受限於以往的義務。"
 RAJ_annex_goa: "吞併果阿"
 RAJ_annex_goa_desc: "果阿屬於印度，它曾被帝國勢力奪走，而[POR.GetName]顯然已無力保衛它。我們需要糾正這一歷史錯誤。"
 RAJ_a_tiger_uncained: "解放的猛虎"
 RAJ_a_tiger_uncained_desc: "長久以來，我們被不同的帝國所征服，被帝國統治的枷鎖所束縛。從此以後，像一隻從囚禁中解放的猛虎，我們再也不會心甘情願地被征服。"
 RAJ_suppress_paramilitary_organizations: "鎮壓準軍事組織"
 RAJ_suppress_paramilitary_organizations_desc: "[GetRajName]仍存在不同的準軍事組織。我們需要迅速將其剷除，因為一旦雜草紮根土壤，便難以拔除。"
 RAJ_defend_burma: "保衛緬甸"
 RAJ_defend_burma_desc: "[BRM.GetName]是抵禦[JAP.GetName]侵略的重要屏障。加強他們的地位對我們只有益處。"
 RAJ_mixed_economy: "混合經濟"
 RAJ_mixed_economy_tt: "每研究一個§Y開採技術§!，在每個擁有超過6種資源的初始地區獲得§G+3§!資源。"
 RAJ_mixed_economy_desc: "我們擁有豐富的自然資源，多元化的礦產開採將增強我們自力更生的能力。"
 RAJ_land_reforms: "土地改革"
 RAJ_land_reforms_desc: "賦予更多人使用土地的權利，將幫助他們擺脫貧困。"
 RAJ_education_efforts: "教育工作"
 RAJ_education_efforts_2: "$RAJ_education_efforts$"
 RAJ_education_efforts_desc: "[ROOT.GetName]的識字率依然低下。我們需要大幅增加教育支出以趕上列強的步伐。"
 RAJ_education_efforts_2_desc: "$RAJ_education_efforts_desc$"
 RAJ_fight_malnutrition: "對抗營養不良"
 RAJ_attract_scientists: "吸引科學家"
 RAJ_attract_scientists_desc: "有了我們的鉅額財富，現在我們可以吸引全世界最優秀的科學家。"
 RAJ_fight_malnutrition_desc: "我們需要實施大規模計劃，解決民眾的營養不良問題。"
 RAJ_import_substitution_industrialisation: "進口替代工業化"
 RAJ_import_substitution_industrialisation_desc: "只要有可能，我們就應該用國產商品代替進口商品，以抵消其製造成本。"
 RAJ_i_am_death: "吾即死神"
 RAJ_i_am_death_desc: "我們的領袖在經歷暗殺未遂後深陷沉思，如今已脫胎換骨。經歷了這一殘酷的考驗，他頓悟到：如果無法阻止人類的殘忍，那麼就應將人類置於他堅定的民主掌控之下。"
 RAJ_destroyer_of_worlds: "世界毀滅者"
 RAJ_destroyer_of_worlds_desc: "假以時日，我們將成長為強大的世界毀滅者，蓄勢待發以消滅我們的敵人。"
 RAJ_uranium_tipped_bullets: "鈾尖頭子彈"
 RAJ_uranium_tipped_bullets_desc: "用多餘的鈾做什麼呢？當然是將它裝在我們的子彈上。"
 RAJ_uranium_tipped_bullets_tt: "§Y$category_all_infantry$§!：\n  對裝甲攻擊：§G+25%§!\n  穿甲深度：§G+100%§!\n§Y$category_cavalry$§!：\n  對裝甲攻擊：§G+10%§!\n  穿甲深度：§G+40%§!\n§Y$category_artillery$§!：\n  穿甲深度：§G+100%§!\n§Y$category_tank_destroyers$§!\n  對裝甲攻擊：§G+15%§!\n  穿甲深度：§G+20%§!\n§Y$anti_tank$§!\n  對裝甲攻擊：§G+10%§!\n  穿甲深度：§G+20%§!\n§Y$mot_anti_tank_brigade$§!\n  對裝甲攻擊：§G+10%§!\n  穿甲深度：§G+20%§!\n§Y$anti_air$§!\n  防空攻擊：§G+10%§!\n§Y$mot_anti_air_brigade$§!\n  防空攻擊：§G+10%§!"
 RAJ_contamination_cleanup_crew: "汙染清理部隊"
 RAJ_contamination_cleanup_crew_desc: "我們的士兵必須準備好在最惡劣的條件下作戰，即使是在核輻射的廢墟中。"
 RAJ_rolling_nuke_barrages: "徐進核彈幕"
 RAJ_rolling_nuke_barrages_desc: "徐進彈幕曾是世界大戰中的常規戰術。新技術使破壞力更強的彈幕成為可能。"
 RAJ_bathe_in_hellfire: "沐浴地獄之火"
 RAJ_bathe_in_hellfire_desc: "我們的敵人將只有兩種選擇：乖乖就範，或者面對烈焰。"
 RAJ_bathe_in_hellfire_desc_tt: "§Y核武器§!現在永久摧毀目標地區§Y50%§!的§Y軍用工廠§!。\n§Y熱核武器§!現在永久摧毀目標地區§Y100%§!的§Y軍用工廠§!。"
 RAJ_jaguar: "美洲豹攻擊機"
 RAJ_jaguar_desc: "美洲豹攻擊機是從高空傳遞民主正義的最佳選項。"
 RAJ_ammunition_factory_khadki: "克德基彈藥廠"
 RAJ_ammunition_factory_khadki_desc: "為了有能力向現代作戰部隊提供武器，我們需要大規模擴建我國的兵工廠。"
 RAJ_rifle_factory_ishapore_west_bengal: "伊莎波爾步槍廠"
 RAJ_rifle_factory_ishapore_west_bengal_desc: "伊莎波爾步槍廠將與克德基彈藥廠合作，為軍隊提供小型武器。"
 RAJ_gun_and_shell_factory_cossipore: "槍械彈藥廠"
 RAJ_gun_and_shell_factory_cossipore_desc: "卡西奧波雷工廠將進一步提升我們在步兵裝備和彈藥生產方面的能力。"
 RAJ_cordite_factory_aruvankadu_tamil_nadu: "阿魯旺卡杜無煙火藥廠"
 RAJ_cordite_factory_aruvankadu_tamil_nadu_desc: "優質的火炮推進劑將賦予我們的重型火炮對敵優勢。"
 RAJ_local_recruitment_offices: "地方徵兵辦事處"
 RAJ_local_recruitment_offices_desc: "我們有著龐大的人口，其中許多人願意通過參軍改善經濟狀況，而無需我們進行全面徵兵。建立徵兵辦事處將為我們帶來充足的志願兵。"
 RAJ_local_recruitment_offices_tt: "每[?RAJ_recruitment_offices_timeout_max]個月降低§Y$idea_RAJ_agrarian_society$§!的懲罰\n\t 可徵募人口係數：§G+[?RAJ_agrarian_society_conscription_factor_penalty_reduction_display]%§!\n 動員速度：§G[?RAJ_agrarian_society_mobilization_speed_penalty_reduction_display]%§!\n 徵兵法案花費係數：§G[?RAJ_agrarian_society_mobilization_laws_cost_factor_penalty_reduction_display]%§!"
 RAJ_military_pensions: "軍人養老金"
 RAJ_military_pensions_desc: "將軍人養老金作為軍隊福利的一部分，將通過延長服役時間來加強軍隊的整體穩定性。"
 RAJ_legacy_of_military_service: "兵役傳承"
 RAJ_legacy_of_military_service_desc: "在[GetRajName]的許多村莊中，父輩曾經服役，子輩因而也會受到同樣的期許。這是傳統，我們可以利用這一點招募比平時更多的新兵。"
 RAJ_indian_states_force: "印度土邦部隊"
 RAJ_indian_states_force_desc: "土邦擁有自己的軍隊，可以被召集來保衛[GetRajName]。"
 RAJ_frontier_corps: "邊防軍"
 RAJ_frontier_corps_desc: "我國地貌多樣，其中包括東部崎嶇的邊疆地帶。吸納那裡的民兵，並吸收他們在嚴酷環境作戰的專業知識，將對我們大有裨益。"
 RAJ_seven_shackles: "七道枷鎖"
 RAJ_seven_shackles_2: "第四至第六道枷鎖"
 RAJ_release_subjects_hint_tt: "§Y由我們釋放的次大陸附庸更傾向於優先發展工業。§!"
 RAJ_famine_impact_reduction: "§Y這將減輕饑荒發生時的影響§!"
 has_arrested_bose: "英國政府逮捕了蘇巴斯·錢德拉·鮑斯"
 RAJ_heavy_industries: "重工業"
 RAJ_heavy_industries_desc: "快速工業化是保障[RAJ.GetName]未來的關鍵。通過發展強大的重工業部門，我們將為軍事力量和經濟獨立奠定基礎。"
 RAJ_strike_against_china: "對[CHI.GetName]發動打擊"
 RAJ_strike_against_china_desc: "如果[CHI.GetName]成為區域強權，他們遲早會對我們發動打擊，也許不是今天，但肯定是明天。我們必須先發制人。"
 RAJ_strike_burma: "打擊[BRM.GetNameDef]"
 RAJ_strike_burma_desc: "[BRM.GetName]的持續存在在我們東部邊境構成戰略威脅。將其納入我們控制之下，可以確保邊境安全，清除境外勢力的潛在立足點。"
 RAJ_cult_of_personality: "$GUAY_cult_of_personality$"
 RAJ_cult_of_personality_desc: "$GUAY_cult_of_personality_desc$"
 RAJ_seek_financial_aid_from_the_ussr: "向[SOU.GetNameDef]尋求財政援助"
 RAJ_seek_financial_aid_from_the_ussr_desc: "為推進我們的革命目標並加快國家發展，我們將向[SOU.GetNameDefCap]尋求財政援助。他們的支持將幫助我們建立基於團結與力量的新秩序。"
 RAJ_guided_democracy: "指導式民主"
 RAJ_guided_democracy_desc: "精心管理的民主進程將提供“選擇”的表象，同時確保結果牢牢掌握在我們手中。穩定需要引導，而我們準備好承擔這一角色。"
 RAJ_authoritarianship: "威權統治"
 RAJ_authoritarianship_desc: "強大的中央權力將為我們的新國家確保和平、公正與穩定。"
 RAJ_the_sun_sets: "日落"
 RAJ_the_sun_sets_desc: "帝國的時代正在終結。隨著[ENG.GetAdjective]控制力的減弱，我們將加速其衰落。帝國的太陽終將落山，而我們將從它的陰影中崛起。"
 ### Mughal Empire ###
 RAJ_great_depression_price_controls: "大蕭條時期的價格管制"
 RAJ_great_depression_price_controls_desc: "大蕭條對次大陸打擊沉重。我們將盧比與英鎊掛鉤並實施各種價格管制，有望穩定局勢。"
 RAJ_look_to_the_past: "回顧過去"
 RAJ_look_to_the_past_desc: "價格管制的成功減緩了大蕭條的影響，但目前這些措施同時有損經濟體系，進一步導致通貨膨脹失控。民眾對經濟的失望引發了不滿的情緒，越來越多的地方領導者通過講述過去的偉大歷史鼓動民眾，從而鞏固政治局勢。\n曾經的輝煌能否重現？"
 RAJ_secure_weapons: "取得武器"
 RAJ_secure_weapons_desc: "我們的軍事裝備是由來自不同國家的各種不匹配的型號組成。然而，藉助外國的小小援助，我們就可以為獨立做好準備。"
 RAJ_secure_weapons_tt: "完成§Y$RAJ_the_mughal_uprising$§!後將補充武器庫存。"
 RAJ_stir_unrest_in_the_north: "在北部挑起動亂"
 RAJ_stir_unrest_in_the_north_desc: "北印人民收到了價格管制的不成比例的影響。他們就如同乾草，我們所需要的只是一點火星。"
 RAJ_stir_unrest_in_the_north_focus_tt: "當我們脫離時會保留以下地區的控制權："
 MUGHAL_divisions_spawned: "§Y4§!個裝備齊整的效忠者師將在起義時加入我們。"
 RAJ_the_mughal_uprising: "莫臥兒起義"
 RAJ_the_mughal_uprising_desc: "北部的邊遠地區是擺脫英國人的絕佳位置。\n當地領袖在人們心中點燃了關於輝煌過去的火焰，那時莫臥兒王朝統治這片土地，人們可以自由追尋自己的命運。\n真主保佑，我們也將如此。"
 RAJ_the_mughal_uprising_tt: "我們會脫離§Y英屬印度§!，並§R發動獨立戰爭§!。"
 RAJ_the_mughal_uprising_tt2: "我們將擁有內戰結束時我們控制的所有地區" #separate into two if I need to remove it later
 6_month_timer_mughal_tt: "我們將有§Y255§!天時間贏得戰爭，否則下放政府會提出停火。"
 RAJ_reform_the_agricultural_system: "改革農業系統"
 RAJ_reform_the_agricultural_system_desc: "印度的糧食體系長期以來一直受到疏忽、管理不善和剝削的困擾。隨著莫臥兒帝國的復興，我們必須確保沒有任何一個臣民再次忍受飢餓。通過投資灌溉體系、將農業現代化、打破貪婪地主的把控，我們將把印度建設成一個豐饒的土地，使饑荒成為往昔的遺物。"
 RAJ_princley_state_breakaway_tt: "§Y [442.GetName] \n [987.GetName] \n [988.GetName] \n [444.GetName] \n [445.GetName] \n [1012.GetName] \n§!"
 RAJ_GOE_enforced_peace_decision: "停火將至"
 RAJ_GOE_enforced_peace_decision_desc_tt: "如果我們抵抗足夠久，[UK_INDIA.GetAdjective]政府會提議停火。"
 RAJ_GOE_enforced_peace_decision_desc_eng_tt: "如果[RAJ.GetName]抵抗足夠久，[UK_INDIA.GetAdjective]政府會提議停火併做出領土讓步。"
 RAJ_GOE_enforced_peace_decision_desc_2_tt: "§Y我們將保留對以下任何地區的控制權§!：§Y印度西部§!、§Y印度南部§!、§Y印度中部§!、§Y印度東部§!和§Y印度北部§!，前提是當停火生效時，我們控制該地區內的所有邦。"
 RAJ_secure_states: "控制"
 RAJ_defend_states: "防禦"
 RAJ_GOE_secure_western_india: "[GetMughalCivilWarStatus]西印度"
 RAJ_GOE_secure_southern_india: "[GetMughalCivilWarStatus]南印度"
 RAJ_GOE_secure_central_india: "[GetMughalCivilWarStatus]中印度"
 RAJ_GOE_secure_eastern_india: "[GetMughalCivilWarStatus]東印度"
 RAJ_GOE_secure_northern_india: "[GetMughalCivilWarStatus]北印度"
 RAJ_GOE_secure_northern_central_india: "[GetMughalCivilWarStatus]中北印度"
 RAJ_GOE_secure_western_central_india: "[GetMughalCivilWarStatus]中西印度"
 RAJ_GOE_enforced_peace_decision_desc_2_1_tt: "§Y如果我們控制了[443.GetName]、[989.GetName]、[433.GetName]、[428.GetName]和[437.GetName]，戰爭結束時將能獲得更大的領土讓步§!"
 RAJ_GOE_enforced_peace_decision_desc_2_2_tt: "§Y如果我們控制了[429.GetName]、[427.GetName]、[424.GetName]、[425.GetName]、[423.GetName]、[982.GetName]和[983.GetName]，戰爭結束時將能獲得更大的領土讓步§!"
 RAJ_GOE_enforced_peace_decision_desc_2_3_tt: "§Y如果我們控制了[436.GetName]、[984.GetName]、[426.GetName]、[438.GetName]和[435.GetName]，戰爭結束時將能獲得更大的領土讓步§!"
 RAJ_GOE_enforced_peace_decision_desc_2_4_tt: "§Y如果我們控制了[431.GetName]、[985.GetName]、[430.GetName]、[432.GetName]、[990.GetName]和[434.GetName]，戰爭結束時將能獲得更大的領土讓步§!"
 RAJ_GOE_mughal_independence_category: "莫臥兒獨立"
 RAJ_GOE_enforced_peace_decision_eng: "$RAJ_GOE_enforced_peace_decision$"
 RAJ_the_legacy_of_babur: "巴布爾的遺產"
 RAJ_the_legacy_of_babur_desc: "莫臥兒帝國曾經統一了次大陸的廣袤領土。現在，有人夢想著重現它的榮光，利用巴布爾的遺產激發新時代的帝國復興和統一。"
 RAJ_the_legacy_of_babur_tt: "被挑起動亂的所有地區將獲得："
 RAJ_a_peacock_prince: "孔雀王子"
 RAJ_a_peacock_prince_desc: "莫臥兒帝國的遺產需要一位值得其王座的領袖。在眾多土邦中，一個孔雀王子將崛起——他擁有高貴的血統、遠大的抱負和恢弘的願景，能夠重振帝國的輝煌並重新統一次大陸。"
 RAJ_halls_of_knowledge: "知識殿堂"
 RAJ_halls_of_knowledge_desc: "一個強大的國家建立在知識的基礎上。通過投資研究和教育，我們培養創新、賦權人民，並確保[ROOT.GetNameDef]在科學、工業和進步中的領導地位。"
 RAJ_sharpen_the_tulwar: "磨礪塔瓦彎刀"
 RAJ_sharpen_the_tulwar_desc: "塔瓦彎刀是力量與反抗的象徵，我們必須為即將到來的戰鬥磨礪它。通過現代化我們的部隊並完善戰略，確保[ROOT.GetNameDef]在需要時能果斷出擊。"
 RAJ_timurid_bureaucracy: "帖木兒官僚體制"
 RAJ_timurid_bureaucracy_desc: "根植於帖木兒遺產的官僚體制提供了高效治理與中央控制的模式。復興這一體系將加強帝國的行政管理，確保其廣袤領土的穩定與繁榮。"
 RAJ_conquer_afghanistan: "征服阿富汗"
 RAJ_conquer_afghanistan_desc: "阿富汗是帝國的祖先之地，必須被收復。通過恢復對這一歷史地區的控制，我們將向莫臥兒的遺產致敬，併為帝國復興建立重要據點。"
 RAJ_across_the_himalayas: "跨越喜馬拉雅"
 RAJ_across_the_himalayas_desc: "喜馬拉雅山脈以外的土地擁有無盡的財富與戰略價值。通過擴展莫臥兒帝國在這些巍峨山峰之外的影響力，我們鞏固統治併為帝國的榮耀開闢新邊疆。"
 RAJ_through_the_wakhan_corridor: "穿越瓦罕走廊"
 RAJ_through_the_wakhan_corridor_desc: "$RAJ_skibedi_san_ma_desc$"
 RAJ_skibedi_san_ma: "擊敗軍閥"
 RAJ_skibedi_san_ma_desc: "西北三馬的軍閥阻礙了莫臥兒帝國在中亞的統治。通過發起決定性戰役，我們可以瓦解他們的勢力，保障戰略貿易路線，並擴大帝國在該區域的影響力。"
 RAJ_conquerors_of_persia: "征服波斯"
 RAJ_conquerors_of_persia_desc: "[PER.GetNameDef]是一片擁有巨大財富與歷史悠久的土地，曾是帝國的競爭對手。將其納入莫臥兒統治，我們將重申我們的統治地位，保障西部的重要領土，並鞏固我們帝國作為帝國輝煌真正繼承者的地位。"
 RAJ_halls_of_knowledge_2: "帝國學院"
 RAJ_halls_of_knowledge_2_desc: "知識是持久權力的關鍵。通過在整個莫臥兒帝國建立帝國學院，我們得以培養學者、科學家和行政人員，他們將推動創新、加強治理，並確保帝國的智慧與先進能夠延續。"
 RAJ_halls_of_knowledge_3: "永恆知識之井"
 RAJ_halls_of_knowledge_3_desc: "知識或許會引導人類進入深淵般的混亂，但我們必須踏入其中。"
 RAJ_elephants_for_the_modern_age: "現代化戰象"
 RAJ_elephants_for_the_modern_age_desc: "莫臥兒帝國的強大戰象曾經主宰戰場。如今，我們讓這種傳統適應現代，通過投資裝甲車輛和機械化部隊，打造勢不可擋的戰爭機器，為帝國贏得勝利。"
 RAJ_unite_the_subcontinent: "統一次大陸"
 RAJ_unite_the_subcontinent_desc: "次大陸分裂的諸國只是昔日輝煌的影子。通過將這些土地重新統一在莫臥兒帝國的旗幟下，我們恢復了一個註定要統治山脈到大海的帝國的和諧、力量和偉大。"
 RAJ_the_true_mongols: "真正的蒙古人"
 RAJ_the_true_mongols_desc: "[Root.GetNameDef]是蒙古遺產的真正繼承者，將草原的力量與次大陸的文化融合在一起。通過擁抱我們的根源，我們將繼承真正蒙古人的精神，像我們的祖先一樣征服並統一世界。"
 RAJ_halls_of_knowlege_3: "帝國圖書館"
 RAJ_halls_of_knowlege_3_desc: "一個有學識的社會是繁榮帝國的基礎。通過在莫臥兒帝國內建造宏偉的圖書館，我們保護古代智慧，促進創新，並激勵後代引領帝國邁向無與倫比的豐功偉業。"
 RAJ_thunder_elephants: "雷霆戰象"
 RAJ_thunder_elephants_desc: "雄偉的戰象是莫臥兒力量的象徵，如今再次返回戰場，成為力量與傳統的化身。它們的強大和威嚴將激勵我們的軍隊，並讓敵人心生恐懼，為帝國的勝利鋪平道路。"
 RAJ_revolt_of_the_princes: "王公的反叛"
 RAJ_revolt_of_the_princes_desc: "長期被英國統治壓迫的土邦王公將起義，奪回他們的遺產。"
 RAJ_revolt_of_the_princes_tt: "當對英屬印度宣戰時，土邦將起義並加入我們，成為附屬國。"
 RAJ_secular_rule: "世俗化行政管理"
 RAJ_secular_rule_desc: "莫臥兒帝國因其多樣性而繁榮，而世俗化的行政管理確保了對所有臣民的公平治理，無論其信仰為何。通過優先考慮能力與平等，我們加強了帝國的統一，並在廣闊而多樣的領土獲得了忠誠。"
 RAJ_theocratic_rule: "重建齊米體系"
 RAJ_theocratic_rule_desc: "在莫臥兒王朝統治下，非穆斯林的權利受到嚴格規定。時至今日，我們應當順應時代潮流，調整這些陳規舊制，向全印度證明我們是一個開明進步的國度。"
 RAJ_mughal_court: "莫臥兒宮廷"
 RAJ_mughal_court_desc: "莫臥兒宮廷匯聚了帝國中最傑出的頭腦和最有影響力的領袖。通過賦權這些顧問，我們在他們的指導下加強了帝國，確保每一個決定都反映出我們統治的榮耀與雄心。"
 RAJ_mughal_court_tt: "所有土邦將獲得民族精神："
 RAJ_mughal_court_princely_states_tt: "所有王公將離開土邦，並作為可用的顧問或將領加入莫臥兒帝國。"
 RAJ_the_silk_road: "擴大絲綢之路"
 RAJ_the_silk_road_desc: "絲綢之路曾為帝國帶來財富與文化。通過恢復這一歷史貿易網絡，我們重拾在全球商業中心的地位，充盈帝國的財富，促進其廣闊疆域的繁榮。"
 RAJ_restore_the_timurid_empire: "重建帖木兒帝國"
 RAJ_restore_the_timurid_empire_desc: "帖木兒的旗幟再次飄揚，曾經讓蘇丹與國王感到畏懼的那個帝國從歷史的灰燼中重生了。我們的統治橫貫他曾經征服的土地，將東方與西方束縛在同一片國土之下。全世界當心了——帖木兒王朝回來了，這一次，我們不會再消逝在歷史中。"
 RAJ_peacock_throne_for_the_modern_age: "現代孔雀王座"
 RAJ_peacock_throne_for_the_modern_age_desc: "孔雀王座曾是莫臥兒權力與輝煌的終極象徵。通過在我們歷史上的權力中心打造一座新王座，我們宣示了統治力，激勵了忠誠，並宣告了我們對次大陸的繁榮願景。"
 RAJ_the_crown_and_the_world: "皇權與世界"
 RAJ_the_crown_and_the_world_desc: "莫臥兒帝國的命運是崛起為無可匹敵的全球超級大國。通過擴大我們的影響力，提升我們的實力，維護我們的主導地位，我們將確保我們作為現代世界最終統治者的地位。"
 RAJ_conquerors_of_iraq: "進軍美索不達米亞"
 RAJ_conquerors_of_iraq_desc: "伊拉克曾是帖木兒帝國內貿易和權力的重要十字路口，它的財富為我們過去的輝煌提供了燃料。現在，它被那些根本配不上它的傳承的弱小統治者握在手中。我們要再次君臨美索不達米亞，掌控這一戰略要地，控制東西方間的門戶，並提醒全世界，帖木兒王朝從不索取，他們只是搶奪。"
 RAJ_conquerors_of_turkey: "第二次安卡拉戰役"
 RAJ_conquerors_of_turkey_desc: "諸多帝國曾在安納托利亞鏖戰，帖木兒戰勝奧斯曼人的事蹟在歷史上聲名赫赫。蘇丹國的繼承者早已風雨飄搖，卻仍然頑固存在，佔據著本應屬於我們統治的土地。我們將再次向西進軍，摧毀他們的防禦工事，並奪回我們歷史上征服的土地。"
 RAJ_reviving_the_workshop_of_the_world: "復興世界工廠"
 RAJ_reviving_the_workshop_of_the_world_desc: "在英國統治前，印度曾是全球工業、紡織業和貿易的中心。現在帝國已經重生，是時候重拾這一傳承了。我們將現代化我們的工廠，並復興我們的貿易路線，使我們的經濟足以與世界上的強國抗衡。"
 RAJ_legacy_of_timur: "帖木兒的遺產"
 RAJ_legacy_of_timur_desc: "帖木兒帝國從未真正消失於歷史長河。我們將收復祖先的土地，將它們統一在一個政權下下，復興帖木兒的遺產，開創一個充滿力量和雄心的新時代。世界將再次在帖木兒的子嗣面前顫抖。"
 RAJ_forging_the_mughal_arsenal: "重建莫臥兒兵工廠"
 RAJ_forging_the_mughal_arsenal_desc: "曾經，戰爭是通過棍棒和石頭贏得的，那些日子已經過去了。帝國想要對抗現代世界的列強，我們就必須建立一個能夠維持龐大軍事機器的工業基地。裝配線將轟鳴作響，很快我們的軍隊將手持我們自己打造的武器進軍。"
 RAJ_rebuilding_the_empires_roads: "重建帝國道路"
 RAJ_rebuilding_the_empires_roads_desc: "沒有調動軍隊、商品和臣民的手段，帝國就無法運作。英國留下的破舊公路和鐵路必須擴建和現代化。"
 if_not_subcontinent_tt: "如果我們未完成§Y$RAJ_unite_the_subcontinent$§!："
 if_not_silk_road_tt: "如果我們未完成§Y$RAJ_the_silk_road$§!："
 also_on_vijay_tt: "獲得§Y南印度§!和§Y科羅曼德§!的核心"
 unlock_decisions_silk_road_tt: "解鎖決議核心化§Y絲綢之路§!領土"
 mughal_west_britain_company_dec: "合併西不列顛公司"
 allows_mughal_west_british_company_tt: "啟用一項行政決議。"
 create_mwbc_tt: "建立§Y$mughal_west_britain_company$§!，擁有英格蘭本土和威爾士的核心。"
 RAJ_hedgemony_of_the_subcontinent: "次大陸霸權"
 RAJ_hedgemony_of_the_subcontinent_desc: "我們已在次大陸實現了工業霸權，擊退了所有聲稱擁有此頭銜的對手。我們變得無懈可擊，將其他分裂勢力遠遠甩在身後。"
 RAJ_hedgemony_of_the_subcontinent_tt: "[ROOT.GetName]擁有所有起始地區"
 pak_factories_tt: "[RAJ.GetName]的工廠比§Y[PAK.GetName]§!多§Y150%§!\n我們的工廠：[?var:THIS.num_of_factories]\n需要：[?var:pak_factories]"
 pak_tech_tt: "[RAJ.GetName]的科技比§Y[PAK.GetName]§!多§Y30%§!\n我們的科技：[?var:THIS.num_researched_technologies]\n需要：[?var:pak_researched_techs]"
 RAJ_orchestrate_train_robberies_desc: "在工人主導的管理和更嚴格的監管下，鐵路建設速度有所放緩，但每條建成的線路都更充分地融入計劃經濟，從而實現更高的物流產量和效率。"
 RAJ_revisiting_inquities: "以眼還眼"
 RAJ_revisiting_inquities_desc: "昔日外國貿易公司的干涉加速了我們帝國的衰落。如今，在我們重獲實力之際，有人認為應當以彼之道還施彼身，讓昔日對手也嚐到他們曾施加於我們的不公。"
 RAJ_royal_indian_navy_mutiny: "皇家印度海軍兵變"
 RAJ_royal_indian_navy_mutiny_desc: "印度水手的不滿正在醞釀，他們表現出對我們事業的支持。我們可以利用這一點掌握權力，阻止英國增援，迫使他們無奈投降。"
 RAJ_royal_indian_navy_mutiny_tt: "§R完成該國策後將移除共產黨滲透決議§!"
 RAJ_royal_indian_navy_mutiny_tt2: "§R完成該國策後將移除共產黨滲透決議§!"
 RAJ_hide_communist_infiltration: "$RAJ_royal_indian_navy_mutiny_tt2$"
 RAJ_accept_russian_muhajir_money_desc: "外國黃金流入我們的手中，為革命的火焰提供燃料。"
 RAJ_jugantar_desc: "久甘塔爾的精神正在覺醒，抗爭蔓延全國。我們可以利用這一點重新掌控孟加拉。"
 RAJ_the_peoples_liberation_army_desc: "人民解放軍是一支紀律嚴明、意識形態堅定的力量，將引領民族解放的先鋒。由工人階級和農民組成的這支部隊已準備好保衛革命，建立新秩序。"
 RAJ_deathblow_to_imperial_remnants_desc: "[PAK.GetName]充當了英國人的代理人，後者向絕境中的他們輸送了大量資源，以抗衡不斷上升的共產主義浪潮。我們將最終結束這一爭鬥。"
 RAJ_the_revolutionary_army_marches_desc: "我們的軍隊懷揣著使命前進，為了革命，為了印度，為了普通百姓。"
 RAJ_threaten_princes_desc: "王公們要麼屈服於我們的要求，要麼面對他們反抗的後果。"
 #EIC feedback stuff
 RAJ_look_to_the_future: "展望未來"
 RAJ_look_to_the_future_desc: "要想控制價格混亂，我們需要展望未來，而不是回望過去。我們需要實施一系列穩定措施。"
 RAJ_lobby_parliment: "遊說議會"
 RAJ_lobby_parliment_desc: "在私營投資者的支持下，我們將遊說議會，宣稱私有化是防止全球經濟再次崩潰的唯一保障。出售英屬印度的部分資產不僅是戰略，更是帝國穩定的象徵。"
 RAJ_lobby_parliment_tt: "我們將開始建立東印度公司"
 #bye
 RAJ_orchestrate_train_robberies: "人民的鐵路"
 RAJ_orchestrate_train_robberies_tt: "鐵路國策現在將為§Y印度鐵路§!精神追加效果：\n每完成一個鐵路國策\n工廠產出：§G+[?RAJ_railway_default_increase_tt]%§!\n鐵路建設速度：§R[?RAJ_railway_default_decrease_tt]%§!\n補給中心建設速度：§R[?RAJ_railway_default_decrease_tt]%§!\n基礎設施建設速度：§R[?RAJ_railway_default_decrease_tt]%§!\n\n每個現有的已完成的鐵路國策將自動轉換以計入這一變化。"
 RAJ_accept_russian_muhajir_money: "接受俄羅斯穆哈吉爾資金"
 RAJ_jugantar: "久甘塔爾"
 RAJ_jugantar_tt: "在對[PAK.GetName]宣戰後，我們將在孟加拉周邊獲得部隊。"
 RAJ_bhoodan_movement: "獻地運動"
 RAJ_bhoodan_movement_desc: "通過自願土地再分配，我們將賦權於無地者，在鄉村重建正義。將土地歸還給耕作它的人，我們不僅贏得了他們的勞動力，也贏得了他們持久的忠誠。"
 RAJ_the_peoples_liberation_army: "組建人民解放軍"
 RAJ_deathblow_to_imperial_remnants: "給予帝國餘孽致命一擊"
 RAJ_the_revolutionary_army_marches: "革命軍前進"
 RAJ_nationalize_british_owned_factories: "國有化英資工廠"
 RAJ_nationalize_british_owned_factories_desc: "建立在[RAJ.GetAdjective]勞工汗水之上的工廠將不再為外國利益服務。通過將[ENG.GetAdjective]控制的工業國有化，我們將控制權歸還給人民，收回那些曾經被不公正地剝奪了的財富。"
 RAJ_threaten_princes: "威脅王公"
 RAJ_exile_princes: "流放王公"
 RAJ_exile_princes_desc: "土邦的時代已經結束。為了實現真正的國家統一，我們將清除這些封建權力的殘餘，將他們流放至遠離宮殿和人民的地方。"
 RAJ_integrate_the_princes: "整合王公"
 RAJ_integrate_the_princes_desc: "既然我們已經流放王公並逐漸將其整合進印度，是時候一勞永逸地整合土邦了。"
 RAJ_integrate_the_princes2: "降服土邦"
 RAJ_integrate_the_princes2_desc: "我們對維持土邦半自治的體系毫無興趣。這些土邦將被一勞永逸地徹底併入印度。"
 RAJ_exiled_princes_flag: "已流放王公"
 RAJ_join_the_co_prospherity_sphere: "加入共榮圈"
 RAJ_join_the_co_prospherity_sphere_desc: "日本是唯一願意對抗西方帝國主義的區域力量。我們需要加入他們，以實現更宏偉的目標。"
 RAJ_join_the_co_prospherity_sphere_tt: "（§Y[JAP.GetName]§!）觸發事件“§Y[RAJ.GetNameDefCap]尋求加入共榮圈§!”。"
 RAJ_cruiser_effort_dlc: "$RAJ_cruiser_effort$"
 RAJ_submarine_effort_dlc: "$RAJ_submarine_effort$"
 RAJ_capital_ship_effort_dlc: "$RAJ_capital_ship_effort$"
 RAJ_black_swan_sloops: "黑天鵝級護衛艦"
 RAJ_black_swan_sloops_desc: "通過採購和改裝成本效益高的黑天鵝級船體，我們可以迅速擴充輕型巡邏艦隊，它非常適合執行近岸防禦和護航任務。"
 RAJ_coastal_protection: "岸防"
 RAJ_coastal_protection_desc: "我們漫長的海岸線需要某種形式的保護，防範外來威脅。"
 RAJ_the_sword_and_the_saffron: "劍與藏紅花"
 RAJ_the_sword_and_the_saffron_desc: "我們的命運由力量與信仰鑄就。劍將捍衛我們的土地，而藏紅花旗幟將統一我們的人民，為同一個目標而奮鬥。"
 RAJ_burn_down_the_cellular_jail: "燒燬卡拉帕尼監獄"
 RAJ_burn_down_the_cellular_jail_desc: "卡拉帕尼監獄是對所有為印度獨立而戰鬥過的人的侮辱，它必須被摧毀。"
 RAJ_indian_marine_corps: "[ROOT.GetAdjective]海軍陸戰隊"
 RAJ_indian_marine_corps_desc: "我們將建立專門的海軍陸戰隊，接受兩棲作戰和特種突襲訓練。"
 RAJ_madras_ship_repair_factories: "馬德拉斯船舶修理廠"
 RAJ_madras_ship_repair_factories_desc: "將馬德拉斯發展為海軍支援重鎮，配備維修設施以維護和升級我們不斷擴張的艦隊，確保東海岸的全面作戰準備。"
 RAJ_obtain_british_naval_contracts: "獲取英國海軍合同"
 RAJ_obtain_british_naval_contracts_desc: "我們將與[ENG.GetNameDefCap]協商，爭取海軍艦船建造合同，利用他們的工業產能壯大我們的艦隊，同時加強戰略關係。"
 RAJ_purchase_decomissioned_british_ships: "購買退役艦船"
 RAJ_purchase_decomissioned_british_ships_desc: "我們還將與[ENG.GetNameDefCap]協商，收購已退役艦艇。雖然這些艦船已經過時，但可快速改裝以低成本擴軍。"
 RAJ_request_transfer_of_british_commanders: "請求調任英國指揮官"
 RAJ_request_transfer_of_british_commanders_desc: "我們會請求[ENG.GetNameDefCap]將一位海軍指揮官調任到我國，以協助訓練我們的新海軍。"
 RAJ_obtain_modern_ship_contracts: "獲取現代艦船合同"
 RAJ_obtain_modern_ship_contracts_desc: "為加快海軍現代化，我們將與[ENG.GetNameDefCap]談判引進最先進的巡洋艦，確保我們的艦隊在不斷演變的海上格局中保持競爭力。"
 RAJ_dominate_the_bay_of_bengal: "主宰孟加拉灣"
 RAJ_dominate_the_bay_of_bengal_desc: "確保孟加拉灣的海軍優勢是我們海上戰略的關鍵。通過擴大存在、投射力量，我們將保護貿易路線，確立區域主導地位。"
 RAJ_indian_cruiser_development: "[ROOT.GetAdjective]巡洋艦開發"
 RAJ_indian_cruiser_development_desc: "是時候繪製我們自己的海軍藍圖了。開發本土設計的巡洋艦不僅彰顯工業獨立，也為現代印度艦隊奠定基礎。"
 RAJ_increase_funding_for_the_GRSE: "增加加登裡奇造船工程公司的經費"
 RAJ_increase_funding_for_the_GRSE_desc: "我們將增加對加登裡奇造船工程公司的國家資助，以便建設新的船塢。"
 RAJ_womens_royal_indian_naval_service: "皇家[ROOT.GetAdjective]海軍女性服役"
 RAJ_womens_royal_indian_naval_service_desc: "我們會建立皇家[ROOT.GetAdjective]海軍女性服役制度，允許女性在海軍中擔任職位。"
 RAJ_modernizing_navy_dlc: "海軍現代化"
 RAJ_modernizing_navy_dlc_desc: "為了成為地區強權，我們必須現代化海軍，並且在先進艦船設計、更完善的基礎設施與戰略理論等方面進行投資，擴大在亞洲海域的影響力。"
 RAJ_rashtriya_swayamsevak_sangh: "國民志願服務團"
 RAJ_rashtriya_swayamsevak_sangh_desc: "我們將組織青年成為一支紀律嚴明的隊伍，準備捍衛我們的國家，並不惜一切代價維護印度教文化的價值。"
 RAJ_the_hindu_martial_tradition: "印度尚武傳統"
 RAJ_the_hindu_martial_tradition_desc: "從希瓦吉的戰士到捍衛正法者，我們將復興古老的尚武精神，為即將到來的戰鬥做好準備。"
 RAJ_cultural_reawekening: "文化復興"
 RAJ_cultural_reawekening_desc: "充滿藝術、語言和傳統的新黎明即將到來。以我們永恆的文明精神團結全國。"
 RAJ_mass_production: "大規模生產"
 RAJ_mass_production_desc: "我們將從價格最低的私營企業採購裝備。降低成本是發展的關鍵。"
 RAJ_deathknell_to_the_raj: "英屬印度的喪鐘"
 RAJ_deathknell_to_the_raj_desc: "我們已經逐步削弱了英屬印度的殘餘勢力，並進一步控制他們的土地。是時候結束這場鬧劇，並要求全面接管次大陸的控制。"
 RAJ_deathknell_to_the_raj_trigger: "存在§Y英國§!統治下的§Y印度§!"
 RAJ_deathknell_to_the_raj_trigger_tt: "吞併印度剩餘地區"
 RAJ_learn_from_the_crown: "向大英帝國學習"
 RAJ_learn_from_the_crown_desc: "我們必須從大英帝國的豐富軍事經驗中汲取教訓，採納他們成熟的軍事學說，為未來的挑戰做好準備。"
 RAJ_join_the_shadow_scheme: "加入影子計劃"
 RAJ_join_the_shadow_scheme_desc: "通過參與隱秘行動，我們可以加強我們的情報能力，並提升我們的戰略底蘊。"
 RAJ_colonial_cadet_exchange: "殖民地軍官交流"
 RAJ_colonial_cadet_exchange_desc: "我們將派遣最優秀的軍官學員與英國軍官一起訓練，確保我們的陸軍具備最先進的技術。"
 RAJ_learn_from_the_secret_intelligence_service: "向秘密情報局學習"
 RAJ_learn_from_the_secret_intelligence_service_desc: "通過與英國秘密情報局合作，我們可以建立一個強大的間諜網絡來保護我們的利益。"
 RAJ_purchase_british_supply_equipment: "購買英國的補給裝備"
 RAJ_purchase_british_supply_equipment_desc: "我們必須獲取英國先進的補給裝備，以增強我們的軍隊並改善戰場上的後勤狀況。"
 RAJ_forming_an_indian_doctrine: "制定印度方針"
 RAJ_forming_an_indian_doctrine_desc: "是時候開闢我們自己的道路了。我們將制定一套反映我們獨特優勢和雄心的印度方針。"
 RAJ_model_after_germany: "效仿德國"
 RAJ_model_after_germany_desc: "我們可以仿效德國紀律與效率的軍事學說，將我們的部隊打造成現代戰爭機器。"
 RAJ_model_after_usa: "效仿美國"
 RAJ_model_after_usa_desc: "通過學習美國軍事策略，我們可以使我們的軍隊現代化，並專注於靈活性和技術創新。"
 RAJ_model_after_soviet: "效仿蘇聯"
 RAJ_model_after_soviet_desc: "蘇聯對大規模動員和革命性戰術的注重為我們自己的軍事升級提供了藍圖。"
 RAJ_automating_the_army: "陸軍機動化"
 RAJ_automating_the_army_desc: "我們將優先考慮機械化和先進的裝甲部隊，為完全現代化的陸軍鋪平道路。"
 RAJ_for_the_people_by_the_people: "民享、民治"
 RAJ_for_the_people_by_the_people_desc: "我們的重點將放在加強步兵、炮兵和支援師的建設，打造一支真正根植於人民意志的陸軍。"
 RAJ_five_year_plan: "五年計劃"
 RAJ_five_year_plan_desc: "任何共產主義國家都需要五年計劃！我們必須開始我們自己的五年計劃，大力發展[RAJ.GetNameDefCap]的工業！"
 RAJ_five_year_plan_flag: "已完成國策§Y五年計劃§!"
 RAJ_five_year_plan_tt: "完成§Y農業社會主義§!或§Y城市工業化§!之一將改變五年計劃內容。"
 RAJ_five_year_plan_when_removed_tt: "當前天數為：[?RAJ_five_year_plan_flag:days|Y0]"
 RAJ_five_year_plan_modify_tt: "§Y五年計劃§!追加效果："
 RAJ_soviet_influence: "蘇聯影響"
 RAJ_soviet_influence_desc: "蘇聯是革命轉型的典範。通過採納其意識形態指導與制度架構，[RAJ.GetName]也可走上一條類似的發展道路。"
 RAJ_indian_socialism: "印度特色社會主義"
 RAJ_indian_socialism_desc: "我們將根據[RAJ.GetNameDefCap]的需要創建自己的社會主義學說，而不是從社會主義強國那裡尋找靈感。"
 RAJ_soviet_indian_industrial_cooperation: "蘇印工業合作"
 RAJ_soviet_indian_industrial_cooperation_desc: "為加速經濟轉型，我們將與[SOU.GetNameDefCap]建立工業合作關係。他們在中央規劃與技術開發方面的經驗將對我們量身打造社會主義經濟體系起到關鍵作用。"
 RAJ_indian_national_highways: "印度國家高速公路"
 RAJ_indian_national_highways_desc: "為了發展[RAJ.GetNameDefCap]工業，我們必須從我們的補給線開始。"
 RAJ_expand_industry_in_hyderabad: "發展海得拉巴工業"
 RAJ_expand_industry_in_hyderabad_desc: "擴建海得拉巴的工廠將大幅優化我們的工業產能，同時不會需要太多投資。"
 RAJ_continue_the_five_year_plan: "繼續五年計劃"
 RAJ_continue_the_five_year_plan_desc: "五年計劃的第一年已結束，是時候回顧我們取得了多少進展，並將我們所學到的經驗教訓應用到未來的四年。"
 RAJ_continue_the_five_year_plan_tt: "我們§Y五年計劃§!中的所有修正將獲得§G+30%§!的加成"
 RAJ_nationalize_tata_group: "國有化塔塔集團"
 RAJ_nationalize_tata_group_desc: "我們必須終止我們的經濟對塔塔集團的依賴。是時候接管並國有化這家公司了。"
 RAJ_focus_on_military_industry: "重視軍事工業"
 RAJ_focus_on_military_industry_desc: "我們必須將國家的安全放在首位，優先加強我們的軍事力量，確保生存。"
 RAJ_nationalize_gun_carriage_agency: "軍火運輸公司國有化"
 RAJ_nationalize_gun_carriage_agency_desc: "軍火運輸公司是我們武器的主要來源之一，這種權力不能交給私營公司，必須國有化。"
 RAJ_eastern_shipyard_construction: "建造東部造船廠"
 RAJ_eastern_shipyard_construction_desc: "為支撐現代海軍的發展，我們將在東海岸擴展造船能力。這些新船廠將成為我們海軍雄心的支柱。"
 RAJ_colonial_cadet_exchange_tt: "移除後："
 RAJ_form_ties_with_leftist_parties: "與左翼政黨建立聯繫"
 RAJ_form_ties_with_leftist_parties_desc: "我們需要爭取國內社會主義者和共產主義者的支持。"
 india: "印度"
 indian: "印度"
 pakistan: "巴基斯坦"
 pakistani: "巴基斯坦"
 bangladesh: "孟加拉國"
 bangladeshi: "孟加拉國"
 tech_recon_focus_bonus_tt: "£GFX_unit_recon_icon_small $category_recon$\n偵察：§G+200%§!"
 RAJ_relax_agrarian_society_criteria_tt: "將會修正§Y$idea_RAJ_agrarian_society$§!\n§Y效果變化：§!"
 mountain_tanks_tt: "啟用§Y山地坦克§!\n§Y所有坦克師（山地）§!：\n進攻：§G+15%§!\n移動：§G+15%§!"
 RAJ_secular_rule_alt: "帖木兒遺產"
 RAJ_secular_rule_alt_desc: "是時候重新奪回我們先祖的核心地區了，我們將在那些孕育了我們王朝的山脈中開創一個新時代。我們將帝國紮根在阿富汗崎嶇的腹地，鞏固了統治根基，並重建了帝國統治的基礎。"
 RAJ_theocratic_rule_alt: "蒙古遺產"
 RAJ_theocratic_rule_alt_desc: "我們是征服者的後繼者，曾經震撼世界的帝國的繼承人。為了榮耀蒙古傳承，我們必須以力量鑄就團結，在我們治下，印度次大陸將成為一個民族，不由信仰或起源約束，而是對王座的忠誠。在帝國的力量前，所有人都將拜倒。"
 RAJ_secret_weapons: "重建科研實力"
 RAJ_secret_weapons_desc: "我們應當再次成為火箭研領域發的世界領袖，並利用它們毀滅我們的敵人。"
 RAJ_his_majestys_loyal_government: "陛下忠誠的政府"
 RAJ_his_majestys_loyal_government_desc: "儘管街頭對獨立的呼聲日益高漲，[ROOT.GetName]的政府機器依舊穩固。由國王任命的總督治理，由印度文官體系維持運轉，我們將以紀律與決心捍衛王室的利益。"
 RAJ_the_government_of_india_act: "印度政府法案"
 RAJ_the_government_of_india_act_desc: "《印度政府法案》為地方自治提供了更大的空間。通過將更多權力下放到地方部門，不僅可以安撫溫和派的訴求，還能提升行政效率，同時確保帝國繼續穩固地掌控權力。"
 RAJ_work_with_local_leaders: "與地方領袖合作"
 RAJ_work_with_local_leaders_desc: "通過與有影響力的地方人物合作，我們可以擴展影響而無需過度消耗資源。這些領袖瞭解各自地區的需求，能在服務其民眾的同時推進王權的利益。"
 RAJ_concessions_to_the_industrialists: "向實業家作出讓步"
 RAJ_concessions_to_the_industrialists_desc: "為在不耗盡帝國財政的前提下刺激發展，我們將向願意投資地區增長的實業家提供優惠條件。作為交換，通過實現繁榮，地方領導人將以忠誠回報我們。"
 RAJ_empower_provincial_authorities: "賦權地方當局"
 RAJ_empower_provincial_authorities_desc: "與其依賴私人利益集團，不如加強地方政府的行政權力，直接監督發展事務。通過將投資決策委託給省級政權，我們確保忠誠者獲得相應責任。"
 RAJ_confer_with_the_congress: "與國大黨磋商"
 RAJ_confer_with_the_congress_desc: "儘管政府中許多人更願意對獨立運動保持沉默，但完全無視只會引發更大的動盪。通過滿足部分訴求，我們或許可以平息怒火，增強內部穩定。"
 RAJ_favor_the_muslim_league: "支持穆斯林聯盟"
 RAJ_favor_the_muslim_league_desc: "通過給予穆斯林聯盟更多的認可和政治支持，我們可以培養一個忠誠的制衡力量來對抗佔據主導地位的民族主義運動。賦予他們權力，讓他們在那些鼓吹統一全印度的人群中製造分裂。統一需要力量，政治分歧才能讓政局可控。"
 RAJ_the_indian_parliament: "印度議會"
 RAJ_the_indian_parliament_desc: "隨著對自治的呼聲日益高漲，我們將設立印度議會，從總督手中接管民政權力。這一過渡將給予本土領導人真正的自治權——當然，仍在帝國框架之內。"
 RAJ_court_the_princes: "籠絡土邦王公"
 RAJ_court_the_princes_desc: "各個土邦歷來是次大陸忠誠與秩序的支柱。通過重申其特權並讓他們更直接參與治理，我們將鞏固帝國在面對日益高漲的民粹主義中的統治基礎。"
 RAJ_the_integrity_of_india_act: "印度完整法案"
 RAJ_the_integrity_of_india_act_desc: "為對抗日益增長的煽動威脅並維護帝國權威，我們將實施《印度完整法案》。該法案授權我們拘留煽動分子、限制政治異議，並確保次大陸各地的忠誠治理。畢竟，團結有時也必須強制維持。"
 RAJ_princely_state_donations_GOE: "土邦捐款"
 RAJ_princely_state_donations_GOE_desc: "$RAJ_princely_state_donations_desc$"
 RAJ_the_jewel_becomes_the_crown: "寶石化為王冠"
 RAJ_the_jewel_becomes_the_crown_desc: "隨著本土的淪陷，如今由我們來承擔帝國家族的領導重任。我們將以煥然一新的決心，動用[ROOT.GetNameDef]的巨大資源，解放帝國之心，擊潰一切玷汙其綠野良田的敵人。"
 RAJ_the_punjab_accord: "旁遮普協議"
 RAJ_the_punjab_accord_desc: "通過承認錫克教社群的特殊地位並給予旁遮普地區有限自治，我們將強化彼此間源遠流長的忠誠與奉獻之約。作為回報，他們的持續支持將加強[ROOT.GetNameDef]在這一關鍵地區的權威，確保傳統與穩定並駕齊驅。"
 RAJ_the_dominion_of_india: "印度自治領"
 RAJ_the_dominion_of_india_desc: "隨著次大陸秩序的全面恢復，是時候在帝國的兄弟國家中確立我們作為忠誠且自治的自治領地的地位了。\n天佑國王！"
 RAJ_curtail_the_zamindars: "限制柴明達爾"
 RAJ_curtail_the_zamindars_desc: "根深蒂固的農村地主勢力長期阻礙治理現代化與[ROOT.GetNameDef]潛力的全面發揮。通過將行政權力與資源轉移至基於能力選拔的官員和更負責任的機構，我們可以削弱他們的影響，同時打造一套響應國家政策更積極的基層體系。"
 RAJ_raise_import_duties: "提高進口關稅"
 RAJ_raise_import_duties_desc: "為減少對外經濟依賴並促進本國產業發展，我們將對外國商品徵收更高的進口關稅。這一政策將保護本土工業，留住境內資本，並確保[ROOT.GetNameDef]的自立自強。"
 RAJ_imperial_industry_initiative: "帝國工業計劃"
 RAJ_imperial_industry_initiative_desc: "為確保[ROOT.GetNameDef]作為帝國支柱的地位，我們必須大力推進城市工業擴張。帝國工業計劃將資源注入重工業和技術工種，確保我們的城市成為次大陸復興與韌性的引擎。"
 RAJ_rural_development_plan: "農村發展計劃"
 RAJ_rural_development_plan_desc: "隨著農業改革的推進，我們必須將工業帶入鄉村。機械化、農村基礎設施建設和小規模製造業將把村莊轉變為生產力量的核心。"
 RAJ_the_great_recovery: "大復甦"
 RAJ_the_great_recovery_desc: "大蕭條在我們經濟上留下的傷痕仍未癒合，減緩了發展，削弱了信心。但如今，隨著穩定和願景的恢復，我們將擺脫停滯的重負。這不僅是迴歸常態的開始，更是[ROOT.GetNameDef]新篇章的開端。"
 RAJ_reform_the_agricultural_sector: "改革農業部門"
 RAJ_reform_the_agricultural_sector_desc: "數十年的土地濫用與落後耕作方式使[ROOT.GetNameDef]的農業部門易受衝擊。通過有針對性的改革、基礎設施投資與引入現代技術，我們可以提高產量，建立更具韌性的糧食體系。"
 RAJ_expand_the_zamindari_system: "加強柴明達爾制"
 RAJ_expand_the_zamindari_system_desc: "柴明達爾制長期以來為農村治理與財政徵收提供了可靠框架。通過擴展其覆蓋範圍並重申忠誠地主的特權，我們可以在不壓垮中央政權的前提下確保地方的秩序與行政的高效。"
 RAJ_crown_commodities: "帝國的商品"
 RAJ_crown_commodities_desc: "通過優先發展面向出口的經濟作物種植，我們可確保持續的財政收入，並強化我們在帝國經濟中的重要地位。茶葉、棉花、黃麻及其他殖民貿易支柱將成為農村繁榮的基石。"
 RAJ_rural_mechanization_program: "農村機械化計劃"
 RAJ_rural_mechanization_program_desc: "為提高農業產量並減少對落後勞作方式的依賴，我們將實施系統化計劃，在農村推廣機械化耕作。拖拉機、脫粒機與灌溉系統將改變農村生產力，為現代、自給自足的經濟奠定基礎。"
 RAJ_the_riches_of_the_raj: "英屬印度的寶藏"
 RAJ_the_riches_of_the_raj_desc: "在[ROOT.GetNameDef]遼闊的平原與崎嶇的山地之下，蘊藏著帝國戰時所需的資源。鋼鐵、石油及其他關鍵材料將被開採、提煉並用於保衛疆域。"
 RAJ_strengthen_ties_with_british_investors_GOE: "加強與英國投資者的紐帶"
 RAJ_strengthen_ties_with_british_investors_GOE_desc: "$RAJ_strengthen_ties_with_british_investors_desc$"
 RAJ_imperial_rail_renewal_act: "帝國鐵路更新法案"
 RAJ_imperial_rail_renewal_act_desc: "為確保物資、部隊與補給在次大陸上的迅速流通，我們將大規模重整[ROOT.GetNameDef]的鐵路基礎設施。《帝國鐵路更新法案》將使老化線路現代化，擴充後勤能力，並以鋼軌與蒸汽把廣袤疆土緊密相連。"
 RAJ_exploit_the_frontier: "開發邊疆"
 RAJ_exploit_the_frontier_desc: "在次大陸乃至周邊的偏遠地區蘊藏著大量尚未開發的資源。通過擴大運營並加強對[BRM.GetNonIdeologyName]等地區的控制，我們可以獲取鎢等關鍵物資，為不斷壯大的戰爭機器提供燃料。"
 RAJ_overlords_railway_investment: "[ROOT.OVERLORD.GetAdjective]鐵路投資"
 RAJ_overlords_railway_investment_desc: "在現代鐵路系統的基礎打好後，我們將邀請[ROOT.OVERLORD.GetAdjective]的工業與金融資本參與進一步擴建和優化網絡。這些資本資本與我們日益增長的基礎設施相結合之後，將打造出配得上帝國的鐵路體系。"
 RAJ_territorial_development_scheme: "領土開發計劃"
 RAJ_territorial_development_scheme_desc: "為了充分釋放[ROOT.GetNameDef]的經濟潛力，我們必須重新評估土地的分配與利用方式。領土開發計劃將篩選出欠發達地區、清除經濟增長的障礙，併為工業擴張準備新區域。"
 RAJ_the_empires_workshop: "帝國的工坊"
 RAJ_the_empires_workshop_desc: "為確保帝國在全球日益增長的需求面前保持實力，我們將深化[ROOT.GetNameDef]與[ROOT.OVERLORD.GetNameDef]之間的經濟聯繫。在兩地協調投資與工廠擴建，將使我們的工業基礎合二為一，成為統一高效的生產引擎。"
 RAJ_institute_of_fundamental_research_GOE: "基礎科學研究所"
 RAJ_institute_of_fundamental_research_GOE_desc: "在頂尖實業家和科學家的支持下，我們將成立基礎科學研究所，開展前沿理論研究。該研究所將成為尖端實驗的核心，包括對原子能的研究。"
 RAJ_keep_calm_and_carry_on: "保持冷靜，繼續前行"
 RAJ_keep_calm_and_carry_on_desc: "在這最艱難的時刻，我們絕不動搖。[ROOT.GetNameDefCap]將崛起為力量的堡壘，以不屈不撓的決心鍛造戰爭之器。讓爐火熊熊、鍛錘作響——勝利並非源自安逸，而是由勇氣、汗水與鋼鐵鑄就。"
 RAJ_indian_gentleman_officers: "印度紳士軍官"
 RAJ_indian_gentleman_officers_desc: "為了確保這顆帝國明珠的未來與安全，我們必須徵召忠誠之士領導新生的[RAJ.GetAdjective]軍隊。這些人長期與帝國當局緊密合作，為[RAJ.GetNameDef]效勞有功，值得信賴，足以擔任指揮重任。"
 RAJ_the_aden_protectorate: "亞丁保護國"
 RAJ_the_aden_protectorate_desc: "阿拉伯半島上的亞丁省屬於我們的轄區。因此，確保其安全至關重要，這將向[ENG.GetNameDef]證明[RAJ.GetNameDef]有能力捍衛[ENG.GetAdjective]帝國在中東附近海域的利益。"
 RAJ_linlithgows_declaration_of_war: "林利思戈的宣戰聲明"
 RAJ_linlithgows_declaration_of_war_desc: "作為[ENG.GetAdjective]帝國的一部分，我們有責任拿起武器加入他們的戰爭。沒有時間向國大黨領袖請示，我們必須果斷出擊。起草宣戰文書，為與[ENG.GetNameDef]的敵人作戰做好準備。"
 RAJ_consult_with_congress_leaders: "與國大黨領袖磋商"
 RAJ_consult_with_congress_leaders_desc: "我們不應強行加入[ENG.GetNameDef]的戰爭，而應通過正式渠道進行。讓我們與國大黨領袖協商，並請求他們允許[RAJ.GetNameDef]參戰。"
 RAJ_preemptive_invasion_of_iran: "針對伊朗的先發制人的入侵"
 RAJ_preemptive_invasion_of_iran_desc: "[PER.GetNameDef]位於我們西部邊境，若不迅速處理，他們可能為敵人提供通往[RAJ.GetNameDef]的波斯走廊。此舉或許會引來和平主義者的譴責，但若成功，[PER.GetNameDef]豐富的油田將為我們所用。"
 RAJ_mobilization_of_the_indian_army: "動員印度陸軍"
 RAJ_mobilization_of_the_indian_army_desc: "我們兵力雄厚，士氣高漲，決心保衛偉大的帝國。雖需時日調集次大陸各地部隊，但動員[RAJ.GetAdjective]軍隊刻不容緩。是時候為[RAJ.GetNameDef]與[ENG.GetNameDef]挺身而戰了。"
 RAJ_support_naval_invasions: "支援登陸作戰"
 RAJ_support_naval_invasions_desc: "這場戰爭不僅將在陸地和空中展開，也將在海上進行。正如陸軍動員至關重要，我們也必須整備海軍，支援盟友的登陸計劃。"
 RAJ_assume_eastern_naval_responsibilities: "承擔東部海軍職責"
 RAJ_assume_eastern_naval_responsibilities_desc: "眾所周知，[JAP.GetNameDef]在東方製造麻煩。隨著其計劃逐步展開，我們必須整備海軍，保衛[RAJ.GetAdjective]周邊的海域。我們應向帝國當局請求派遣[ENG.GetAdjective]海軍協助我們的防禦努力。"
 RAJ_south_east_asia_command: "東南亞指揮部"
 RAJ_south_east_asia_command_desc: "局勢逐漸緊張，東南亞地區亟需統一的指揮中心。我們可以率先推動這一倡議，建立作戰基地，為大陸上的軍事行動制定戰略。"
 RAJ_desert_training: "沙漠訓練"
 RAJ_desert_training_desc: "為提升我軍作戰技能和效能，我們將在塔爾沙漠及其周邊地區設立訓練機制，以幫助部隊適應乾旱環境。"
 RAJ_fortify_el_alamein: "加固阿拉曼防線"
 RAJ_fortify_el_alamein_desc: "阿拉曼是控制並保衛埃及的重要戰略要地。我們的防線加固措施將深受帝國當局的讚賞，並有助於阻止敵人在[ENG.GetAdjective]北非站穩腳跟。"
 RAJ_jungle_training_GOE: "叢林訓練"
 RAJ_jungle_training_GOE_desc: "我們領土廣闊，地形多樣，[RAJ.GetNonIdeologyName]、[BRM.GetNonIdeologyName]與印度支那佈滿叢林，訓練士兵在這種危險地形中有效作戰十分必要。"
 RAJ_defense_of_malaya: "保衛馬來亞"
 RAJ_defense_of_malaya_desc: "[MAL.GetNameDef]地處印度洋與太平洋之間，極易遭受入侵。我們與他們同為帝國的明珠，我們必須協助他們區域的防禦措施。我們必須維持在東南亞的控制權。"
 RAJ_hill_training: "山地訓練"
 RAJ_hill_training_desc: "作為戰鬥訓練多樣化的一部分，我們必須確保部隊不僅能適應叢林、沙漠和城市，還能在山地作戰。"
 RAJ_defense_of_burma: "保衛緬甸"
 RAJ_defense_of_burma_desc: "[BRM.GetNonIdeologyName]位於孟加拉以東，它的叢林是[RAJ.GetNonIdeologyName]邊境的最後一道天然屏障，防止東方威脅的滲透。我們必須在該地區動員防禦力量，與[BRM.GetAdjective]肩並肩作戰，並讓印度次大陸牢固地掌控在[ENG.GetAdjective]的手中。"
 RAJ_holding_the_gates_of_india: "守衛印度之門"
 RAJ_holding_the_gates_of_india_desc: "無論如何，我們必須保護[RAJ.GetNonIdeologyName]不受東部侵略者的蹂躪。他們或許來勢洶洶，但我們將把他們擋在[RAJ.GetNonIdeologyName]的門戶之外。他們絕不能通過！"
 RAJ_free_abyssinia: "解放阿比西尼亞"
 RAJ_free_abyssinia_desc: "阿比西尼亞地區被敵人佔據已久。我們將通過亞丁發動大規模登陸行動，展示我們對帝國當局的價值，解放該地人民。"
 RAJ_urban_training: "城市作戰訓練"
 RAJ_urban_training_desc: "儘管我們希望不必如此，但戰鬥或許會蔓延至我們偉大城市的街頭。我們必須通過專門的城市作戰訓練，做好應對準備。"
 RAJ_the_defense_of_hong_kong: "保衛香港"
 RAJ_the_defense_of_hong_kong_desc: "[CHI.GetNonIdeologyName]的緊張局勢加劇，[ENG.GetAdjective]當局擔憂他們在香港的權益。我們正處於最佳位置，有能力保衛這座城市，若能成功，將贏得[ENG.GetAdjective]政府的高度認可與支持。"
 RAJ_modify_a_loyal_government_tt: "§Y$RAJ_a_loyal_government$§!追加效果："
 RAJ_modify_south_east_asia_command_dm_tt: "§Y$RAJ_south_east_asia_command_dm$§!追加效果："
 RAJ_the_government_of_india_act_pp_bonus_tt: "每個順從度超過§Y74%§!的初始地區為§Y$RAJ_a_loyal_government$§!追加效果：[?RAJ_the_government_of_india_act_pp_bonus_based_on_compliance|+=%%0]$MODIFIER_POLITICAL_POWER_FACTOR$。"
 current_states_granting_bonus_tt: "當前地區給予增益："
 no_state_meet_requirements_tt: "（目前沒有地區滿足要求）"
 RAJ_stop_unrest_events_tt: "§G將不會有更多動亂事件。§!"
 character_becomes_leader_of_ideology_party: "§Y$CHARACTER$§!成為§Y$IDEOLOGY$§!領導人。"
 RAJ_the_dominion_of_india_every_owned_state_compliance_tt: "所有順從度低於§Y100%§!的擁有的地區"
 RAJ_crown_commodities_cg_to_the_empire_tt: "（§Y[ENG.GetFlag][ENG.GetName]§!和其§Y附屬國§!）："
 RAJ_the_empires_workshop_civs_to_the_empire_subjects_tt: "（§Y[ENG.GetFlag][ENG.GetName]§!隨機一個核心地區）：\n 添加§G2§!建築位。\n 添加§G2§!§Y$industrial_complex$§!\n\n（§Y每個[ENG.GetFlag][ENG.GetAdjective]附屬國§!隨機一個核心地區）：\n 添加§G1§!建築位。\n 添加§G1§!§Y$industrial_complex$§!"
 RAJ_the_riches_of_the_raj_targets_oil_tt: "每個擁有§Y$state_resource_oil$§!£resources_strip|1 的起始地區：\n 添加§Y+4§!£resources_strip|1 生產。\n 添加§G1§!§Y$infrastructure$§!。"
 RAJ_the_riches_of_the_raj_targets_tt: "每個擁有至少§Y20§!單位§Y$state_resource_aluminium$§!£resources_strip|2 、§Y$state_resource_rubber$§!£resources_strip|3 、§Y$state_resource_chromium$§!£resources_strip|6 、§Y$state_resource_tungsten$§!£resources_strip|4 、§Y$state_resource_coal$§!£resources_strip|0 或§Y$temporary_state_resource_steel$§!£resources_strip|5 的起始地區：\n 添加§Y+4§!單位該資源的生產。\n 添加§G1§!§Y$infrastructure$§!。"
 RAJ_imperial_rail_renewal_act_tt: "每完成一個工業分支的鐵路國策增加§G1§!個§Y$industrial_complex$§!。"
 RAJ_south_east_asia_command_rename_dm_tt: "民族精神§Y$RAJ_indian_gentlemen_officers_goe$§!更改為§Y$RAJ_south_east_asia_command_dm$§!。"
 generic_requires_divs_in_state_tt: "在§Y$STATE$§!地區擁有超過§Y$NUM_DIVISIONS$§!個師"
 RAJ_linlithgows_declaration_of_war_tt: "§Y[ROOT.GetNameWithFlag]§!會對其宗主國（§Y[ENG.GetNameWithFlag]§!）的所有敵人宣戰。"
 RAJ_linlithgows_declaration_of_war_current_effects_tt: "§Y[ROOT.GetNameWithFlag]§!對其宗主國當前的所有敵人宣戰"
 generic_enables_tech_tt: "啟用§Y$TECH_NAME$§!：\n$TECH_EFFECT$"
 generic_character_transferred_to_country_tt: "（$ORIGINAL_COUNTRY_FLAG$）§Y$CHARACTER$§!加入$TARGET_COUNTRY_FLAG$§Y$TARGET_COUNTRY$§!"
 generic_unlocks_decisions_explanation_tt: "啟用§Y$DECISIONS$§!決議，$EXPLANATION$"
 RAJ_exploit_the_frontier_decisions_tt: "允許開發我國的資源，並索取緬甸的資源開採權。"
 RAJ_concessions_to_the_industrialists_chances_tt: "§Y$RAJ_investments_from_local_leaders$§!將主要側重於§Y民用工業§!，較小程度上側重於§Y軍事工業§!。"
 RAJ_empower_provincial_authorities_chances_tt: "§Y$RAJ_investments_from_local_leaders$§!將均衡分配側重於§Y民用工業§!、§Y軍事工業§!與§Y防禦性基礎設施§!。"
 RAJ_his_majestys_loyal_government_break_free_tt: "要實現徹底獨立，我們必須完成三項核心國策：§Y$RAJ_the_dominion_of_india$§!、§Y$RAJ_keep_calm_and_carry_on$§!和§Y$RAJ_holding_the_gates_of_india$§!。"
 RAJ_loyalist_branch_capstone_focuses_become_free_tt: "完成三項核心國策§Y$RAJ_the_dominion_of_india$§!、§Y$RAJ_keep_calm_and_carry_on$§!和§Y$RAJ_holding_the_gates_of_india$§!後將§G不再限制變更自治等級為§!§Y自由§!。"
 ############
 #####RAJ####
 ############
 AFG_expand_telegraph_network: "擴展電報網絡"
 AFG_expand_telegraph_network_desc: "[ROOT.GetNonIdeologyName]在許多經濟指標上已經落後於鄰國。現代化經濟的第一步是通過擴展電報網絡，改善城市與鄰國之間的通信。"
 AFG_increase_agricultural_exports: "增加農業出口"
 AFG_increase_agricultural_exports_desc: ""
 AFG_sugar_processing: "巴格蘭糖廠"
 AFG_sugar_processing_desc: "糖的需求在我們的人民中穩步增長。我們應建立糖廠，將農產品加工成有價值的商品來滿足需求。這不僅能滿足市場需求，還能創造更多的工業就業機會。"
 AFG_fruit_packing: "水果加工"
 AFG_fruit_packing_desc: "[ROOT.GetNonIdeologyName]的人民是出色的農民，我們應利用他們生產的任何剩餘農產品，通過包裝出口獲利。為此，我們必須建立更多的工業加工設施。"
 AFG_clear_malarial_swamps: "清理瘧疾沼澤"
 AFG_clear_malarial_swamps_desc: "瘧疾仍是我國許多地區的禍患。通過清理滋生瘧疾寄生蟲的區域，我們可以消除農村人口長期以來的這一歷史性難題，並開闢新土地用於開發。"
 AFG_infrastructure_construction: "基礎設施投資"
 AFG_infrastructure_construction_desc: "全國基礎設施的匱乏阻礙了經濟發展，迫使人們甘於像祖先那樣生活。這種觀念不符合國家的長遠利益，必須通過投資基礎設施項目來糾正。"
 AFG_expand_karakul_lambskin_industry: "擴大卡拉庫爾綿羊皮產業"
 AFG_expand_karakul_lambskin_industry_desc: "卡拉庫爾綿羊皮製品是[ROOT.GetNonIdeologyName]目前少數大量出口的商品之一。我們可以利用這一機會，通過建立加工和出口這些商品的工廠，擴大我們剛剛起步的工業基礎。"
 AFG_spinzar_cotton_factory: "投資斯賓扎棉業工廠"
 AFG_spinzar_cotton_factory_desc: "昆都士的斯賓扎棉花廠目前是我們盈利最高的工廠之一，其所有者正尋求擴大業務。然而，如果沒有政府的支持，它將無法在現有規模的基礎上實現大幅增長。我們應努力建立新的子公司，並投資於我國棉花產業的未來。"
 AFG_forge_a_national_identity: "打造國家認同"
 AFG_forge_a_national_identity_desc: "我們的人民並不將自己視為阿富汗人，而是歸屬於各自的部落和民族。我們應當努力推動普什圖語和達里語成為國家通用語言，或許終有一日，能讓全體人民在統一的阿富汗國家認同下團結起來。"
 AFG_constructing_a_national_identity_tt: "民族精神§Y$AFG_constructing_a_national_identity_idea$§!被移除後：\n"
 AFG_look_to_other_partners: "尋找其他合作伙伴"
 AFG_look_to_other_partners_desc: "我們與蘇聯的貿易協議引發了關於其影響我國國內政治和外交政策的猜測。這些指控當然是錯誤的，但或許為了我們的利益，應考慮尋找其他貿易伙伴。"
 AFG_look_to_other_partners_tt: "列強將有機會向[ROOT.GetNameDef]投資，每個同意為我們提供§G一個地圖外民用工廠§!的國家，可以§R影響我們的政治為期一年§!。"
 generic_higher_opinion_tt: "\n§Y對[ROOT.GetNonIdeologyName]的好感越高，目標國家接受提議的可能性越大。§!"
 AFG_renew_soviet_trade_agreement: "續簽蘇聯貿易協議"
 AFG_renew_soviet_trade_agreement_desc: "儘管我們多年來在意識形態上有所分歧，[SOU.GetName]始終是我國良好的經濟夥伴。儘管有人擔心[SOU.Adjective]可能影響我們的內部事務，但我們認為續簽貿易協議並無問題。"
 AFG_salang_pass: "薩朗山口隧道"
 AFG_salang_pass_desc: "[ROOT.GetNonIdeologyName]的山區地形增加了全國範圍內的交通路線的開發難度。然而，[SOU.GetAdjective]工程師認為他們可以在薩朗山脈修建一條隧道。他們的政府已提議負責建設，以換取一些戰略讓步。"
 AFG_75_year_oil_concessions: "提供75年石油開採權"
 AFG_75_year_oil_concessions_desc: "近年來，地質學家在我國領土內發現了大量石油儲備。然而，我們缺乏自行開採這些資源的工業產能。如果我們能與某個列強達成互利協議，我們就可以共同開採石油。"
 AFG_75_year_oil_concessions_tt: "§Y解鎖決議與外國合作開發石油資源。§!"
 AFG_rail_construction: "建立阿富汗鐵路公司"
 AFG_rail_construction_desc: "對於大規模運輸資源或人員，鐵路是最有效的方式。因此，我們必須建立一家鐵路公司來開發並運營自己的鐵路網絡。"
 AFG_electrification: "電氣化計劃"
 AFG_electrification_desc: "工業、通信和軍事領域的創新越來越依賴電力。我們必須確保國家能夠通過擴大[ROOT.GetNonIdeologyName]的電氣化，來利用這些新技術。"
 AFG_electrification_tt: "\n§Y電氣化將從喀布爾開始逐步向外擴散，每兩個月會一個新核心地區獲得此修正。§!"
 AFG_establish_radio_networks: "現代化喀布爾廣播電臺"
 AFG_establish_radio_networks_desc: "喀布爾廣播電臺成立於20世紀20年代，使用的是如今已過時的設備。我們應投資改良廣播設備，以確保政府能夠與儘可能多的民眾直接溝通。"
 AFG_connect_the_cities: "[ROOT.GetNonIdeologyName]環城公路"
 AFG_connect_the_cities_desc: "雖然鐵路對我們的長期發展至關重要，但現代化高速公路系統連接主要城市的益處也不容忽視。通過修建連接城市的環城公路，我們可以最終削弱長期以來困擾經濟的地區主義。"
 AFG_expand_kabul_university: "擴建喀布爾大學"
 AFG_expand_kabul_university_desc: "通過送學生出國接受專業教育，已經無法滿足對於工程師、醫生和教師的需求。我們必須投資自己的教育機構，培養新一代本土專業人才。"
 AFG_expand_kabul_university_tt: "§R擴大高等教育可能導致畢業生變得激進，除非經濟增長足以為他們提供就業機會！§!"
 AFG_kajaki_dam: "建立赫爾曼德河谷管理局"
 AFG_kajaki_dam_desc: "我們應從[USA.GetNameDef]的田納西河谷管理局中汲取靈感，在赫爾曼德河谷建立一個類似機構。該組織將負責該地區的經濟開發以促進國家經濟發展。然而，如果我們開始改造這條河流，我們必須警惕，以免激怒我們的西部鄰國。"
 AFG_kajaki_dam_tt: "\n§R未能通過後續事件鏈與[414.OWNER.GetNameDef]達成條約可能導致戰爭！§!"
 AFG_qargha_dam: "建造卡爾加大壩"
 AFG_qargha_dam_desc: "國家中更乾旱的地區缺乏足夠的灌溉設施，導致收成風險增加，甚至可能引發饑荒。然而，我們可以建造大壩來增加灌溉用水，這甚至可能使農業產出盈餘。"
 AFG_chaki_dam: "查克大壩"
 AFG_chaki_dam_desc: "隨著電力需求的增加，我們需要確保穩定的供電來源。在外國專家的幫助下，我們或許可以在恰克河上修建一座水力發電大壩，為包括喀布爾在內的周邊地區長期供電。"
 AFG_chromite_mines: "建立鉻礦場"
 AFG_chromite_mines_desc: "在工業化世界中，鉻資源的需求日益增長。我們應開始開採本國的鉻礦資源用於出口，並利用產生的財富繼續推進工業化計劃。"
 AFG_iron_mines: "擴大銅礦與錫礦"
 AFG_iron_mines_desc: "錫、銅和鐵是生產許多現代必需品的關鍵資源。如果我們要發展為工業化國家，就需要開發並確保獲得這些資源的渠道。幸運的是，我們有大量未開發的資源等待開發。"
 AFG_truck_factory: "賈納加拉克卡車工廠"
 AFG_truck_factory_desc: "在我們的[SOU.GetAdjective]支持者的合作下，我們有機會開發第一座大型車輛生產工廠。這裡生產的卡車可以滿足國內工業和軍事對這類車輛的需求。"
 AFG_maintain_quami: "維護庫阿米制度"
 AFG_maintain_quami_desc: "數百年來，庫阿米徵兵制度已成為我們國防體系的基石。我們為何要拋棄這一植根於傳統的體系，而採用只對首都的城市精英有利的新改革？抵制這種最新改革浪潮是唯一合乎邏輯的選擇。"
 AFG_maintain_quami_tt: "§Y保留$AFG_quami_category$決議，以及招募更多非正規部隊的能力。§!"
 AFG_quami_intro_tt: "§Y$AFG_quami_modifier$§!追加效果："
 AFG_nufus_intro_tt: "§Y$AFG_nufus_modifier$§!追加效果："
 AFG_asymmetric_warfare: "非對稱作戰"
 AFG_asymmetric_warfare_desc: "當我們的鄰國甘願拋棄傳統，追求工業化和更強大的軍隊時，我們將通過非常規戰術以及對地形的優勢知識擊敗他們。再加上我們士兵的決心，我們將擊退任何入侵者。"
 AFG_khyber_pass_riflining: "開伯爾山口兵工產業"
 AFG_khyber_pass_riflining_desc: "開伯爾山口的小作坊幾十年來一直在製造外國武器的仿製品。儘管這些武器質量欠佳，但數量上彌補了不足。或許我們是時候投資這個地區，為我們的武裝力量開發本地武器生產商了。"
 AFG_encourage_jezail_production: "鼓勵本地傑撒伊步槍生產"
 AFG_encourage_jezail_production_desc: "傑撒伊火槍因其造價低廉，長期以來一直是普什圖部落的首選武器，在英阿戰爭期間為我們發揮了巨大作用。我們應當鼓勵各部落延續這一傳統，以便徵召更大規模的部落武裝。"
 AFG_scavenging: "物資收集戰術"
 AFG_scavenging_desc: "我們無法自行生產的裝備往往會出現在外國侵略者手中。因此，我們應訓練部隊識別並收繳任何可用的軍事裝備。"
 AFG_militia_cavalry: "卡特加尼騎兵"
 AFG_militia_cavalry_desc: "[ROOT.GetNameDefCap]擁有多個馬匹品種，特別適應本國的崎嶇地形。這些馬可以用於騎兵旅，而且不必投資昂貴的外國裝備，後者容易損壞且需要複雜的維護。"
 AFG_mountain_training: "山地訓練"
 AFG_mountain_training_desc: "新技術和戰術隨著時間而變化，但山地與峽谷始終如一。與其費力追趕鄰國的技術發展，不如專注於利用我們周圍的地形，獲得戰術優勢。"
 AFG_cross_border_ties: "跨境聯繫"
 AFG_cross_border_ties_desc: "由於地理特性，我們的邊界總是漏洞百出，民眾的家庭成員經常跨境往來，並在兩側定居。幾代人以來，這種情況在鄰國之間形成了牢固的個人聯繫。在危機時期，這種聯繫可能被我們加以利用。"
 AFG_cross_border_ties_tt: "解鎖決議§Y$AFG_cross_border_ties_category$§!以吞併宣稱的領土。"
 AFG_approach_foreign_inteligence_services: "接觸外國情報機構"
 AFG_approach_foreign_inteligence_services_desc: "我們地處列強交匯之地，長期受制於他們的博弈。如果我們能夠建立自己的情報機構，就可以利用這一獨特的地理位置，在鄰國之間玩弄手段，謀取利益。"
 AFG_expand_border_guards: "擴建邊防警衛隊"
 AFG_expand_border_guards_desc: "我們應對邊防警察進行基本的軍事訓練，使其在危機時能夠承擔更多職責，從而減輕正規武裝部隊的壓力。王室警衛是我們武裝部隊中的精英，其訓練和專業技能無可挑剔。然而，隨著鄰國陷入衝突，其人數不足的問題已被提上議程。"
 AFG_utilize_cameleers: "善用駝隊"
 AFG_utilize_cameleers_desc: "我們的駝隊遠銷海外，曾為大英帝國效力，在澳大利亞大沙漠的險惡地帶承擔運輸與補給任務。我們應當僱傭這些技術嫻熟的勞工，協助我軍在本土執行任務。"
 AFG_establish_camelry_regiments: "建立駱駝騎兵團"
 AFG_establish_camelry_regiments_desc: "駱駝是一種適應力極強的動物。為確保我軍能在沙漠與山地等環境中正常作戰，我們必須做出相應調整。藉助駱駝騎兵的力量，我軍將能在任何地形條件下投入戰鬥，甚至深入敵軍難以企及的區域。"
 AFG_adopt_nufus: "採納努富斯制度"
 AFG_adopt_nufus_desc: "這一歷史悠久的非正規武裝力量徵召制度早已完成了它的使命，並不可能在專業敵軍的入侵下繼續發揮作用。因此，我們必須用官方的徵兵和訓練制度取而代之。"
 AFG_adopt_nufus_tt: "§R此舉將移除決議$AFG_quami_category$，並禁止招募非正規部隊！§!"
 AFG_mohammed_daoud_khan_available_as_general_tt: "§Y穆罕默德·達烏德汗§!將成為可用的§Y2級§!陸軍將領"
 AFG_new_army: "常備軍"
 AFG_new_army_desc: "儘管農村人口仍然反對我們的軍事改革，但我們必須推動進程，為最新一批應徵入伍者制定大規模的訓練計劃。"
 AFG_expand_royal_guard: "擴充皇家衛隊"
 AFG_expand_royal_guard_desc: "皇家衛隊是我們武裝部隊中的精銳，其訓練和專業技能堪比最優秀的軍隊。然而，隨著鄰國陷入衝突，其人數不足的問題需要引起關注。"
 AFG_prussians_of_the_orient: "東方普魯士"
 AFG_prussians_of_the_orient_desc: "由於我們接受過外國軍官的訓練，並擁有大量剩餘的[GER.GetAdjective]裝備，[GER.GetNameDef]的官員們已經開始稱呼我們為“東方普魯士”。我們應該確保我們不辜負這個稱號，並挺身對抗任何膽敢反對我們的人。"
 AFG_establish_naval_bases: "建立新海軍基地"
 AFG_establish_naval_bases_desc: "隨著我們在新解放的海岸線上建立第一座海軍基地，我們可以開始艱難的任務，發展自己的海軍。"
 AFG_establish_naval_bases_tt: "在隨機一個沿海地區新增§G1§!個§Y海軍基地§!"
 AFG_standardize_equipment: "標準化裝備"
 AFG_standardize_equipment_desc: ""
 AFG_expand_academy: "擴建軍事學院"
 AFG_expand_academy_desc: "隨著職業化軍隊的規模擴張，對受過良好訓練的軍官的需求也在增加。建立一所國家軍事學院將是確保軍隊獲得保護邊境所需領導力和專業知識的明智之舉。"
 AFG_expand_academy_tt: "招募§Y兩名§!隨機§Y陸軍將領§!"
 AFG_foreign_military_advisors: "邀請外國軍事顧問"
 AFG_foreign_military_advisors_desc: "為了使我軍訓練達到現代標準，最快捷的方法是邀請西方國家的顧問。他們將幫助訓練下一代[ROOT.GetAdjective]軍人，使其能夠適應不斷變化的戰場。"
 AFG_expand_standing_army: "擴編常備軍"
 AFG_expand_standing_army_desc: "為了擊敗我們的敵人，確保我們的獨立，我們的軍隊不僅要精銳，還要規模龐大。因此，我們應該擴大徵兵範圍，招募更多的人加入我們的隊伍。"
 AFG_officialize_the_turkish_afghan_defense_treaty: "[TUR.GetAdjective]-[ROOT.GetAdjective]防禦條約"
 AFG_officialize_the_turkish_afghan_defense_treaty_desc: "自1933年以來，土耳其軍事人員一直協助培養阿富汗下一代士兵。現在是時候利用這些關係，請求締結一項防禦條約，據此我們雙方都有義務保護彼此免受外國侵略。"
 AFG_purchase_tanks: "購買外國坦克"
 AFG_purchase_tanks_desc: "我們的軍隊缺乏突破敵人堅固防線的火力，也缺乏推進速度。我們必須向世界其他國家尋求解決方案，投資建立裝甲部隊以彌補這些不足。"
 AFG_purchase_aircraft: "購買外國飛機"
 AFG_purchase_aircraft_desc: "我們的武裝力量在天空中對敵人幾乎沒有防禦能力。我們需要投資建設自己的空軍，以對抗敵方飛機。"
 AFG_expand_equipment_purchases: "擴大裝備採購"
 AFG_expand_equipment_purchases_desc: "我們的武裝力量越來越依賴於比步槍和彈藥更復雜的裝備。如果它們要保持威懾力，我們必須儘快採購更多支援裝備。"
 AFG_increase_air_purchases: "增加空軍採購"
 AFG_increase_air_purchases_desc: "我們的空軍正迅速發展出阻止或摧毀進入領空的外國飛機的能力。然而，我們缺乏用飛機對地面目標施加影響的手段。因此，我們應開始投資建設自己的轟炸機中隊。"
 AFG_naval_academy: "建立海軍學院"
 AFG_naval_academy_desc: "我們歷史上缺乏海岸線，導致完全沒有任何具備海軍專業知識的軍官。因此，我們必須建立一所海軍學院，並吸引外國教官前來培訓第一代[AFG.GetAdjective]水手。"
 AFG_naval_academy_tt: "招募§Y兩名§!隨機§Y海軍將官§!"
 AFG_shipyards: "建立[ROOT.GetAdjective]航運業"
 AFG_shipyards_desc: "即使我們還沒有準備好設計和製造自己的艦船，未來的艦船也需要維護和改裝設施。現在建立一個造船廠，我們可以確保未來的艦船擁有長期運行所需的設施。"
 AFG_shipyards_tt: "在一個沿海地區新增§G1§!個建築位和§G1§!個§Y海軍造船廠§!。"
 AFG_shipyards_tt_2: "§Y解鎖軍工機構：§!"
 AFG_research_bonus_1: "發展國內海軍工業"
 AFG_research_bonus_1_desc: "列強只會向我們出售他們認為過時且對地區利益沒有威脅的艦艇。如果我們要發展一支能威懾列強的現代海軍我們應該投資發展我們自己設計的艦船。"
 AFG_purchase_destroyers: "購買驅逐艦"
 AFG_purchase_destroyers_desc: "設計和建造現代戰艦的專業知識和基礎設施可能需要幾十年時間才能發展起來。一個更務實的做法是從其他國家採購封存艦船，並根據我們的需求進行改裝。"
 AFG_research_bonus_2: "投資海軍發展"
 AFG_research_bonus_2_desc: "我們在開發小型艦船方面的專業知識已經得到了回報，我們的工程師現在正在挑戰為海軍設計更大型艦船的任務。"
 AFG_purchase_capital_ships: "購買主力艦"
 AFG_purchase_capital_ships_desc: "隨著最近採購的小型艦船，我們的海軍開始具備雛形。然而，我們仍然缺乏大型艦船的火力支持，我們應該開始尋找可以購買的大型戰艦。"
 AFG_state_industries: "建立軍事工業"
 AFG_state_industries_desc: "由於缺乏適合他們技能的就業機會，大學畢業生正逐漸激進化。為避免這種情況，我們可以建立國營工業單位，不僅為他們提供就業，還能為武裝部隊生產國產裝備。"
 AFG_state_industries_tt: "解鎖決議建立§Y軍工機構§!，並延長畢業生激進化的時間限制。"
 AFG_ideology_on_the_rise_tt: "§R\n\n如果與[THIS.GetNameDef]意識形態不一致的主要強國對[ROOT.GetNameDef]的影響過高，他們可能會入侵我們！（如果[THIS.GetIdeologyNameWithCaps]大於40%，其他列強可能會攻擊我們！）§!"
 AFG_ideology_on_the_rise_flipped_tt: "§R\n\n如果其他國家對[ROOT.GetNameDef]的影響力過大，[THIS.GetNameDefCap]可能會入侵我們！（如果除了中立或[THIS.GetIdeologyNameWithCaps]之外的任何意識形態支持度超過40%，[THIS.GetNameDef]可能會對我們發動攻擊！）§!"
 AFG_foreign_influence_tt: "獲得§Y[PREV.GetIdeologyNameWithCaps]影響力提升§!，其效果為在§Y365§!天內（每日[PREV.GetIdeologyNameWithCaps]支持度：§G+0.02§!）"
 AFG_against_kabul: "反對喀布爾政權"
 AFG_against_kabul_desc: "國王查希爾及其叔父是篡位者，他們的非法政權必須被推翻，不惜一切代價。"
 AFG_contact_amanullah_loyalists: "聯繫阿曼努拉黨團"
 AFG_contact_amanullah_loyalists_desc: "前國王$AFG_amunullah_khan$在被民眾不公罷黜時，從未正式將王位讓位於繼任者。因此，我們必須團結那些遵從[AFG.GetNonIdeologyName]的人們，他們仍忠於國王，為他註定的重祚做好準備。"
 AFG_remember_the_khost_rebellion: "銘記霍斯特叛亂"
 AFG_remember_the_khost_rebellion_desc: "1924年，我們當中的正義之士奮起反抗阿曼努拉國王及其西方同黨，以挽救國家於喪失其驕傲傳統的邊緣。也許那次起義失敗了，但其精神永存，現在我們已經知道如何攻克喀布爾。重歸傳統的時候到了！"
 AFG_crown_the_golden_emir: "為黃金埃米爾戴上冠冕"
 AFG_crown_the_golden_emir_desc: "隨著領土得以穩固，必須有一位新統治者崛起以繼承埃米爾的頭銜。米爾扎裡·汗·維齊爾已在戰場上證明了自己的實力，他成為最受歡迎的候選人並不令人意外。他將幫助我們重新統一普什圖尼斯坦，並團結伊斯蘭世界。"
 AFG_crown_the_bukharan_emir: "為布哈拉埃米爾戴上冠冕"
 AFG_crown_the_bukharan_emir_desc: "隨著領土穩固，必須擁立一位新統治者來繼承埃米爾之位。布哈拉的賽義德·米爾·穆罕默德·阿利姆已在喀布爾駐留多年，若我們欲重振偉大的杜蘭尼帝國榮光，他實為完美人選。"
 AFG_invite_the_mughal_prince: "邀請莫臥兒王公"
 AFG_invite_the_mughal_prince_desc: "領土既定，必有新主崛起，繼承帖木兒之遺志。無論以血統、功績，抑或鐵腕強權，吾等之抉擇將塑造邦國之未來。故此，我等當邀居於印度的莫臥兒王公，承繼王位。"
 AFG_unify_the_islamic_world: "統一伊斯蘭世界"
 AFG_unify_the_islamic_world_desc: "長久以來，伊斯蘭國家一直為無足輕重的瑣事爭執不休，逃避合作的責任。如今，我們終於要向全世界的伊斯蘭國家發出邀請，共同締結一個偉大的聯盟。"
 AFG_unify_the_islamic_world_tt: "觸發事件§Y[ROOT.GetNameDefCap]邀請我們加入他們的陣營§!"
 AFG_united_islamic_world_faction: "伊斯蘭聯盟"
 AFG_extend_a_hand_to_tokyo: "向東京示好"
 AFG_extend_a_hand_to_tokyo_desc: "多虧了[JAP.GetAdjective]部隊的援助，我們才得以贏得阿富汗戰役。既然[JAP.GetNameDef]正尋求統一和解放亞洲，我們再次與他們接洽將是明智之舉。"
 AFG_extend_a_hand_to_tokyo_tt: "我們將尋求加入§Y[JAP.GetNameDef]§!的陣營。"
 AFG_expand_the_madrasas: "擴建經學院"
 AFG_expand_the_madrasas_desc: "為了更好地管控我國民眾並教導他們應遵循的生活方式，我們應增加對國內穆斯林教育機構的資金投入。"
 AFG_promote_muslim_work_ethic: "宣傳穆斯林工作準則"
 AFG_promote_muslim_work_ethic_desc: "西方人總愛吹噓他們的“新教工作準則”，卻對伊斯蘭世界的辛勤勞動視而不見。現在該讓他們明白，我們的專注與專業絲毫不遜於他們。"
 AFG_rehabilitate_the_saqqawists: "平反薩卡維派"
 AFG_rehabilitate_the_saqqawists_desc: "薩卡維派在1929年成功推翻了阿曼努拉·汗的腐朽統治，但時運不濟，幾年後他們幾乎全軍覆沒。也許現在是時候紀念這些為捍衛我們傳統價值觀而英勇奮戰的英雄們了。"
 AFG_ulugh_beg_academy: "兀魯伯學院"
 AFG_ulugh_beg_academy_desc: "兀魯伯曾以蘇丹身份統治強大的帖木兒帝國，同時仍致力於拓展天文學和數學知識。我們應當以他的名義建立一所新大學，以此紀念他的功績。"
 AFG_prepare_the_war_industries: "準備戰爭工業"
 AFG_prepare_the_war_industries_desc: "我們當前的工業體系缺乏軍工生產能力。為避免被鄰國壓制，我們必須調整工廠的生產方向以支持軍事需求，而非繼續滿足統治階層的奢靡要求。這一轉型關乎我們的存亡。"
 AFG_revive_the_workshop_of_the_world: "復興世界工廠"
 AFG_revive_the_workshop_of_the_world_desc: "我們將效仿先輩，通過工廠現代化和貿易路線復興來實現轉型。這一變革將使我們的經濟成為能與世界強國相抗衡的強大力量。"
 AFG_reorganize_the_royal_guard: "重組皇家衛隊"
 AFG_reorganize_the_royal_guard_desc: "皇家衛隊未能履行賦予他們的榮譽職責。我們將通過一系列改革和擴充兵力來重振衛隊。他們必須真正體現[ROOT.GetNameDef]的力量與決心。"
 AFG_reintroduce_heavy_cavalry: "重新引入重騎兵"
 AFG_reintroduce_heavy_cavalry_desc: "我們的祖先曾多次策馬闖入印度和中亞的平原，在當地統治者衰弱之時奪取土地和資源。如今，隨著我們的鄰國捲入衝突，或許這樣的時機又即將到來。"
 AFG_reintroduce_war_elephants: "重新引入戰象"
 AFG_reintroduce_war_elephants_desc: "當全世界都在爭先恐後地製造更復雜的機動怪物時，我們將採用久經考驗的可靠方法——重啟戰象的使用，以此作戰並在敵人心中播下恐懼。"
 AFG_timurid_bureaucracy: "帖木兒官僚體制"
 AFG_timurid_bureaucracy_desc: "帖木兒王朝的官僚體系根植於帖木兒的遺產，提供了高效治理與中央集權的典範。復興這一體系將強化埃米爾政府的行政能力，確保其廣闊領土的穩定與繁榮。"
 AFG_hone_the_shamshir: "磨礪舍施爾彎刀"
 AFG_hone_the_shamshir_desc: "舍施爾彎刀是力量與反抗的象徵，我們必須為即將到來的戰鬥磨礪它。通過現代化我們的部隊並完善戰略，確保[ROOT.GetNameDef]在需要時能果斷出擊。"
 AFG_restore_herat: "恢復赫拉特"
 AFG_restore_herat_desc: "為了對抗喀布爾的舊權力中心，是時候將首都遷至杜蘭尼帝國的主要駐地赫拉特。如此一來，我們便能將鞏固我們作為這個昔日偉大帝國繼承者的地位。"
 AFG_enforce_the_pashtunwali: "推廣普什圖法典"
 AFG_enforce_the_pashtunwali_desc: "儘管普什圖法典的條文可能已不合時宜，但仍需將其保留以確保普什圖人在國內政治中的主導地位。法律中最過時的部分可以進行調整，但這一制度將世代延續。"
 AFG_form_the_khuddamul_furqan: "建立古蘭經僕眾"
 AFG_form_the_khuddamul_furqan_desc: "為了鞏固我們新政府的合法性，我們必須在黃金埃米爾的領導下建立一個正式的政黨。古蘭經僕眾是唯一可接受的效忠對象，也只有這個政黨才能為人民帶來救贖。"
 AFG_instate_a_compulsory_jizya: "強制徵收吉茲亞稅"
 AFG_instate_a_compulsory_jizya_desc: "在舊政權統治下，非穆斯林的權利被施加了諸多限制。現在是時候根據現代標準調整這些政策，向所有臣民證明我們是個開明的國家。"
 AFG_raise_lashkar_regiments: "組建拉什卡爾軍"
 AFG_raise_lashkar_regiments_desc: "法基爾在英屬印度普什圖地區的抵抗戰友們自稱為拉什卡爾軍。現在他統治著[ROOT.GetNameDef]，或許是時候正式在政府軍體系下建立類似的軍團了。"
 AFG_support_nort_west_frontier_rebels: "支援西北邊境省起義軍"
 AFG_support_nort_west_frontier_rebels_desc: "儘管法基爾已前往[ROOT.GetNameDef]，但[RAJ.GetAdjective]西北邊境的普什圖族起義軍仍在英勇抗擊壓迫者。我們應當介入保護他們，即便這可能意味著與當前宣稱擁有該地區的勢力開戰。"
 AFG_occupy_peshawar_tt: "§R這可能會導致與[442.GetName]所有者的戰爭！§!"
 AFG_occupy_waziristan_tt: "§R這可能會導致與[987.GetName]所有者的戰爭！§!"
 AFG_appraoch_anti_communist_theologians: "接觸反蘇神學家"
 AFG_appraoch_anti_communist_theologians_desc: "許多穆斯林學者和神學家都認為共產主義是對我們文明社會的禍害。遺憾的是，[SOV.GetNameDef]目前正在將這種邪惡的意識形態強加給我們在中亞的兄弟，我們必須竭盡全力制止這種愚蠢的行為。"
 AFG_unite_pashtunistan: "統一普什圖斯坦"
 AFG_unite_pashtunistan_desc: "法基爾運動的最終目標始終是在英屬印度土地上建立一個獨立的普什圖人國家。然而現在，他有機會在國境之外建立一個普什圖國家，並征服剩餘的地區。普什圖斯坦萬歲，埃米爾萬歲！"
 AFG_form_the_turkestan_legion: "組建突厥斯坦軍團"
 AFG_form_the_turkestan_legion_desc: "有許多人願意在全球舞臺上與共產主義作鬥爭。我們應該組織突厥反共產主義志願部隊，讓他們與反對伊斯蘭的勢力戰鬥到底。"
 AFG_form_the_turkestan_legion_tt: "解鎖§Y$AFG_turkestan_legion_cat$§!決議，從突厥世界招募軍隊。"
 AFG_proclaim_a_new_caliphate: "宣告新的哈里發國"
 AFG_proclaim_a_new_caliphate_desc: "奧斯曼帝國解體後，再未出現過新的哈里發國。為了引領迷失與誤入歧途的人們，我們必須肩負起這一新的使命，繼承過去正統哈里發們的遺產。"
 AFG_proclaim_a_new_caliphate_tt: "針對所有佔領著該國策給予領土宣稱的地區的國家，獲得§Y奪取聲索地區§!戰爭目標"
 AFG_proclaim_a_new_caliphate_2_tt: "解鎖§Y整合§!我們所控制的聲索地區的決議"
 AFG_integrate_the_basmachi_movement: "整合巴斯瑪奇運動"
 AFG_integrate_the_basmachi_movement_desc: "直到1934年，巴斯瑪奇運動仍在與[SOV.GetAdjective]軍隊作戰，試圖將中亞從他們的暴政統治中解放出來。儘管他們的運動後來基本被鎮壓，但部分領導人還是設法逃脫了。我們應當努力與這些自由戰士取得聯繫，並邀請他們加入我們。"
 AFG_proclaim_the_second_afghan_empire: "宣告阿富汗第二帝國"
 AFG_proclaim_the_second_afghan_empire_desc: "1747年，艾哈邁德·沙阿·杜蘭尼統一了阿富汗各部族，並將其組織成一個帝國。在其鼎盛時期，帝國統治著中亞、東印度和伊朗的大片地區。它與奧斯曼帝國並列為18世紀下半葉最重要的伊斯蘭帝國，我們必須重振這一榮光！"
 AFG_can_core_once_controlled_tt: "解鎖在佔領後核心化聲索地區的決議"
 AFG_return_to_delhi: "迴歸德里"
 AFG_return_to_delhi_desc: "德里曾是蘇丹的統治中心，輝煌的孔雀王座和紅堡的所在。我們將向這座城市進軍，奪回我們失落已久的首都，決不辜負過去莫臥兒皇帝的期望。"
 AFG_reclaim_moghulistan: "宣告蒙兀兒斯坦"
 AFG_reclaim_moghulistan_desc: "察合臺汗國之一的蒙兀兒斯坦，曾是偉大蒙古帝國的繼承者之一。作為新興的國家，我們若想重現昔日榮光，奪取這些土地或許是明智之舉。"
 AFG_ally_the_sikhs: "與錫克教徒結盟"
 AFG_ally_the_sikhs_desc: "錫克教徒是印度次大陸上一個重要的宗教少數群體，也是勇猛的戰士。我們應該藉助他們的力量，為自己征服這片地區。"
 AFG_ally_the_brahui_khanate: "與布拉灰汗國結盟"
 AFG_ally_the_brahui_khanate_desc: "卡拉特汗國是杜蘭尼帝國後期的重要盟友，曾在我們對抗馬拉塔聯盟的勝利中給予極大幫助。我們應該再次與他們取得聯繫，共同對抗馬拉塔人的餘孽！"
 AFG_the_echoes_of_panipat: "伯尼巴德的迴響"
 AFG_the_echoes_of_panipat_desc: "第三次伯尼巴德戰役的記憶仍在印度次大陸的每個人心中迴響。彼時我們擊潰馬拉塔軍隊，確立了在印度西北部的霸權。現在，我們應當再次出擊，消滅那些狂妄的馬拉塔聯盟餘孽！"
 AFG_the_conquerors_of_persia: "征服波斯"
 AFG_the_conquerors_of_persia_desc: "[PER.GetNameDefCap]是一片擁有巨大財富與歷史悠久的土地，曾是帝國的競爭對手。將其納入我們的統治，我們將重申我們的統治地位，保障西部的重要領土，並鞏固我們帝國作為帝國輝煌真正繼承者的地位。"
 AFG_reclaim_transoxiana: "收復河中"
 AFG_reclaim_transoxiana_desc: "河中地區的古老土地曾屬於帖木兒帝國，而我們正是其繼承者。我們必須收復這些領土，以免我們的遺產因軟弱和優柔寡斷而蒙羞！"
 AFG_rebuild_the_silk_road: "重建絲綢之路"
 AFG_rebuild_the_silk_road_desc: "絲綢之路曾為帝國帶來財富與文化。通過重建這一歷史悠久的貿易網絡，我們將重新確立帝國在全球貿易的中心地位，使帝國更加富庶，並推動其廣袤領土的繁榮。"
 AFG_restore_the_timurid_empire: "重建帖木兒帝國"
 AFG_restore_the_timurid_empire_desc: "帖木兒的旗幟再次飄揚，那個曾令蘇丹與國王們膽寒的帝國已從歷史的灰燼中崛起。我們的統治延伸至他曾征服的土地，將東方與西方統一於一個政權下。讓世界明白——帖木兒帝國已經歸來，而這一次，我們絕不會再次消失在歷史。"
 AFG_the_crown_and_the_world: "皇權與世界"
 AFG_the_crown_and_the_world_desc: "帝國的天命是崛起為無可匹敵的全球超級大國。通過擴張影響力、增強實力並確立統治地位，我們將成為現代世界的終極主宰。"
 AFG_the_amu_darya_plan: "阿姆河計劃"
 AFG_the_amu_darya_plan_desc: "皇帝已制定計劃，並與故土那些希望擺脫[SOV.GetAdjective]統治的人取得了聯繫。首先，我們的解放行動必須經過精心策劃，之後才能對[SOV.GetNameDef]發起進攻。"
 AFG_reclaim_the_emperors_lost_domain: "收復皇帝的失地"
 AFG_reclaim_the_emperors_lost_domain_desc: "時機終於到了。鑑於當前的世界局勢，再沒有比這更好的機會來進攻[SOV.GetNameDef]。我們將一勞永逸地解放整個中亞！"
 AFG_secure_army_support: "爭取陸軍支持"
 AFG_secure_army_support_desc: "武裝部隊中仍有一些軍官是由$AFG_amunullah_khan$任命或在其領導下服役的。通過適當的激勵措施，我們可以說服他們支持國王重回王位。"
 AFG_secure_army_support_tt: "§Y在即將到來的內戰中將有更多陸軍師加入我們。§!"
 AFG_modifiy_amanullah_insurrection_modifier_tt: "§Y$AFG_amanullah_insurection_modifier$§!追加效果：\n"
 AFG_modifiy_look_to_the_past_modifier_tt: "§Y$AFG_look_to_the_past_modifier$§!追加效果：\n"
 AFG_contact_rural_loyalists: "聯繫農村馬利克"
 AFG_contact_rural_loyalists_desc: "[AFG.GetAdjective]精英容易通過賄賂或施加影響被爭取。而[AFG.GetAdjective]普通人對物質獎勵或政治承諾興趣不大。然而，通過訴諸他們的傳統價值觀和不滿情緒，我們仍然可以贏得他們的支持。"
 AFG_contact_rural_loyalists_tt: "§Y更多普什圖民兵師將在即將到來的內戰中加入我們。§!"
 AFG_request_german_support: "請求德國支持"
 AFG_request_german_support_desc: "$AFG_amunullah_khan$長期以來仰慕[GER.GetNonIdeologyName]，並在其政府中獲得了一些高級支持者。如果我們能爭取到他們的支持，德國可能會以一個友好的政權為條件支持國王重祚。"
 AFG_request_german_support_tt: "如果§Y[GER.GetNonIdeologyName]§!接受我們的提議，他們將在內戰開始時向我們提供武器並派遣志願軍。§Y[GER_oskar_von_nidermayer.GetName]§!將作為將軍加入我們。"
 AFG_request_japanese_support_tt: "如果§Y[JAP.GetNonIdeologyName]§!接受我們的提議，他們將在內戰開始時向我們提供武器並派遣志願軍。"
 AFG_political_events_53_tt: "§Y當內戰爆發，[GER.GetNonIdeologyName]會為我們提供武器，並派遣志願軍協助我們。§!"
 AFG_stir_unrest_in_the_east: "在東部挑起動亂"
 AFG_stir_unrest_in_the_east_desc: "瓦濟里斯坦與白沙瓦一直是反[RAJ.GetAdjective]和反[AFG.GetAdjective]活動的溫床。我們應當效仿他們，在開伯爾山口煽動叛亂，分散國王軍隊的注意力。"
 AFG_eastern_state_breakaway_tt: "§Y[1006.GetName]\n[1008.GetName]§!"
 AFG_fascist_cw_is_over: "阿曼努拉叛亂結束了。（法西斯分子推翻了政府，贏得了內戰。）"
 AFG_request_japanese_support: "爭取日本支持"
 AFG_request_japanese_support_desc: "[JAP.GetAdjective]企圖稱霸亞洲大陸，並可能正在尋找支持其宏偉目標的盟友。我們或許應當說服他們相信，我們的對手查希爾國王反對這一計劃，以尋求日本對我們即將發動的起義予以支持。"
 AFG_hold_a_loya_jirga: "召開支爾格大會"
 AFG_hold_a_loya_jirga_desc: "我們應當說服查希爾國王召開部落與宗教領袖會議，在會議中我們可以質疑他的合法性，併為我們日益壯大的起義爭取更多同情。"
 AFG_hold_a_loya_jirga_tt: "當§Y[ROOT.GetAdjective]內戰§!開始時，對立方將在§G180§!天內獲得以下效果："
 AFG_invite_waziristan_rebels: "邀請瓦濟里斯坦起義軍"
 AFG_invite_waziristan_rebels_desc: "法基爾·伊匹及其拉什卡爾民兵部隊正在西北省份與[RAJ.GetAdjective]當局交戰。我們應協助他們越境，並在東部地區為其建立勢力基地，以便他們有朝一日能以更強大的姿態返回瓦濟里斯坦。"
 AFG_invite_waziristan_rebels_tt: "當§Y[ROOT.GetAdjective]內戰§!開始時，我們會獲得額外§G+10000§!人力"
 AFG_the_faqirs_revolt: "法基爾起義"
 AFG_the_faqirs_revolt_desc: "時機終於到來。法基爾的軍隊已在東部集結，準備起來反抗喀布爾的腐敗官員，恢復我國曾賴以生存的伊斯蘭傳統。若真主應許，我們將拯救阿富汗！"
 AFG_return_of_the_emir: "國王歸來"
 AFG_return_of_the_emir_desc: "計劃已經就緒，聯繫人已建立，武器已分發。只要國王回到阿富汗我們這些烏合之眾就能推翻查希爾國王的非法政權。"
 AFG_revive_the_1923_constitution: "恢復1923年憲法"
 AFG_revive_the_1923_constitution_desc: "國王是一個遠見卓識的人，早在1923年，他就認識到國家需要被帶入20世紀。然而，他的改革幾乎被查希爾·沙阿粉碎。隨著國王重祚，我們可以重新拾起這些改革，並恢復1923年的憲法。"
 AFG_custail_pashtunwali_primacy: "削弱普什圖瓦利的主導地位"
 AFG_custail_pashtunwali_primacy_desc: "普什圖人的傳統道德準則——普什圖瓦利，在國王的新國家中沒有立足之地。我們將頒佈一系列新法律，在加強普什圖人權力的同時，也對這一過時的準則進行現代化改造。"
 AFG_education_for_women_and_girls: "婦女和女童教育"
 AFG_education_for_women_and_girls_desc: "國王與王后深知，讓婦女和女童接受教育的重要性，而不是將她們禁錮於家庭服務中。然而，國王被推翻後，其教育改革也被廢除。現在，我們將糾正這一不公。"
 AFG_enforce_western_attire: "強制穿西式服裝"
 AFG_enforce_western_attire_desc: "國王及其核心圈子對大多數民眾堅持的傳統服飾並不滿意，他們將其視為社會落後的象徵。因此，他們希望建造一家紡織廠並通過新法律推動西式服裝的普及。"
 AFG_crackdown_on_nomadic_practices: "打擊游牧的生活方式"
 AFG_crackdown_on_nomadic_practices_desc: "TODO"
 AFG_repaying_our_friends: "償還朋友的恩情"
 AFG_repaying_our_friends_desc: "TODO"
 AFG_expand_state_run_factories: "擴建國營工廠"
 AFG_expand_state_run_factories_desc: "經過前政權多年的忽視，現在是我們通過建立新的生產消費品和軍用產品的國營工廠來啟動國家經濟現代化的時候了。"
 AFG_reinforce_the_royal_guard: "國王的影子"
 AFG_reinforce_the_royal_guard_desc: "儘管國王具有合法性，但許多人對其重祚及激進改革感到不滿。絕不能允許這些叛徒破壞國王的事業。必須成立一個新的安全機構，在暗中執行國王的意志。"
 AFG_reinforce_the_royal_guard_tt: "解鎖決議§Y$AFG_shadows_of_the_emir_category$§!以鎮壓異見人士並提高穩定度。"
 AFG_increase_land_and_animal_taxes: "增加土地與牲畜稅"
 AFG_increase_land_and_animal_taxes_desc: "農村人口對國家經濟活力貢獻甚微，其自給農業使他們能夠避免大多數形式的稅收。為了鼓勵更現代化的農業實踐，我們將實施新的稅收政策，迫使他們在追求更高利潤的同時維持生計。"
 AFG_expand_state_education: "擴大公立教育"
 AFG_expand_state_education_desc: "TODO"
 AFG_establish_darulaman: "建設達魯拉曼"
 AFG_establish_darulaman_desc: "達魯拉曼原本是一座規劃中的新城市，旨在取代喀布爾成為[AFG.GetNonIdeologyName]的首都。國王被推翻後，城市建設被中止。現在，我們將完成這一項目，使其成為現代化的燈塔。"
 AFG_towards_an_amanullah_caliphate: "邁向阿曼努拉哈里發國"
 AFG_towards_an_amanullah_caliphate_desc: "在奧斯曼帝國解體後，$AFG_amunullah_khan$曾考慮過接受哈里發的頭銜，但最終選擇建立一個更加現代化的政權。這一次，他決定不再重複同樣的錯誤，而是確保自己成為伊斯蘭世界的領袖。"
 AFG_alternative_partnerships: "尋求替代夥伴"
 AFG_alternative_partnerships_desc: "多年來，我們通過在[ENG.GetAdjective]與[SOU.GetAdjective]之間遊刃有餘的平衡，成功維持了獨立。但現在，隨著新玩家加入大博弈，我們也應調整戰略。"
 AFG_officer_training: "軍官培訓"
 AFG_officer_training_desc: "[GER.GetAdjective]軍隊已證明自己遠勝於[ENG.GetAdjective]或[SOU.GetAdjective]的軍隊。我們應請求其軍官支持，幫助培訓下一代[ROOT.GetAdjective]士兵。"
 AFG_permit_axis_airbases: "允許軸心國建立空軍基地"
 AFG_permit_axis_airbases_desc: "我們的[GER.Capital.GetCapitalVictoryPointName]朋友在距離家園如此遙遠的地方部署空軍面臨困難。我們可以為他們緩解這一問題，同時為自己爭取寶貴的基礎設施與經驗。"
 AFG_join_axis: "加入軸心國"
 AFG_join_axis_desc: "儘管我們迄今為止避免捲入主要衝突，但如果我們完全投身軸心國事業，將有無數機會可供利用。因此，我們將申請成為這一聯盟的正式成員。"
 AFG_axis_airforce: "軸心國空軍"
 AFG_axis_airforce_desc: "與[GER.GetAdjective]空軍密切合作後，我們相信可以按照他們的模式組建一支功能完善的空軍。我們所需的僅是相關裝備。"
 AFG_axis_equipment: "軸心國裝備"
 AFG_axis_equipment_desc: "我們的軍事裝備是來自多個國家的各種型號的混亂組合。然而，藉助[GER.GetAdjective]的幫助，我們終於能夠在實現現代化的同時標準化所有裝備。"
 AFG_kabul_conference: "喀布爾會議"
 AFG_kabul_conference_desc: "經過數十年在[ENG.GetAdjective]與[SOU.GetAdjective]之間的掙扎，我們現在有機會與新世界秩序的統治者站在一起，並索取屬於我們的權利。"
 AFG_kabul_conference_tt: "解鎖決議§Y$AFG_kabul_conference_category$§!，在和平會議中，當我們所在的陣營獲勝時，可降低在§Y印度、中亞、伊朗和中東§!地區的目標地區的競標花費。"
 AFG_support_king_zahir: "支持查希爾國王"
 AFG_support_king_zahir_desc: "在經歷數十年的政治動盪之後，查希爾·沙阿的統治將標誌著這個飽受苦難的國家進入和平與經濟穩定的新時代。"
 AFG_support_king_zahir_tt: "§Y查希爾·沙阿§!獲得：\n政治點數獲得§G+5%§!  \n中立主義支持率每日§G+0.02§!"
 AFG_biding_our_time: "靜待時機"
 AFG_biding_our_time_desc: "在查希爾·沙阿作為國家象徵的情況下，只要政府能獲得保守派多數的支持，政府就可以處理自己的事務，而不必擔心激進的起義。然而，在不侵犯傳統活動的前提下實現國家現代化的機會，或許會有，但很小。"
 AFG_expand_the_kings_powerbase: "擴大國王的權力基礎"
 AFG_expand_the_kings_powerbase_desc: "年輕的查希爾·沙阿國王目前只是民眾心中的象徵，而國王的叔父們掌控著政府中最強大的職位。然而，國王對他們過時的思想越來越感到不滿，並希望為一個更進步的政權提供支持。"
 AFG_visit_foreign_capitals: "訪問外國首都"
 AFG_visit_foreign_capitals_desc: "我們的政權與全球列強之間缺乏強有力的聯繫。隨著地緣政治局勢變得越來越不穩定，與列強們建立更好的關係或許符合我們的最佳利益，以便抓住可能出現的機會。"
 AFG_retire_the_uncles: "罷免叔父們"
 AFG_retire_the_uncles_desc: "[ROOT.Capital.GetCapitalVictoryPointName]的政治局勢開始轉向對守舊派不利的方向。現在是國王解散現任內閣並建立更符合自己目標的內閣的時候了。"
 AFG_implement_currency_controls: "阿富汗中央銀行"
 AFG_implement_currency_controls_desc: "我們的經濟缺乏能夠支持國家經濟發展的強大金融部門。因此，我們應該與私營部門合作，建立一家合資銀行，為我們的新興產業和企業提供服務。"
 AFG_privatize_factories: "工廠私有化"
 AFG_privatize_factories_desc: "TODO"
 AFG_introduce_national_service: "實行兵役制度"
 AFG_introduce_national_service_desc: "我們周圍的國家紛紛陷入衝突，誰也無法保證我們不會被捲入其中。為了防備這種可能發生的情況，我們將實行一種兵役制度來加強武裝力量。"
 AFG_placeholder_1: "爭取德國投資"
 AFG_placeholder_1_desc: "在經歷了數個世紀的敵對與衝突後，我們對[ENG.GetAdjective]和[SOU.GetAdjective]毫無好感。然而，崛起中的[GER.GetName]為我們提供了一個獲得更為志同道合的國際夥伴的機會。"
 AFG_gain_religious_support_for_reforms: "信神者得其庇護"
 AFG_gain_religious_support_for_reforms_desc: "民眾越來越擔心年輕的國王查希爾·沙阿將利用他的新獲得的權力實施激烈的改革，擾亂他們的生活方式。為了平息這些擔憂，我們將爭取毛拉們的支持，並展示國王對伊斯蘭的承諾。"
 AFG_reform_1: "教育改革"
 AFG_reform_1_desc: "向議會制民主的過渡並不順利，我們必須更多地向下一代灌輸民主價值觀。因此，我們必須改革教育系統，使其更加開放，讓全國的所有孩子都能接受教育。"
 AFG_concessions_to_pashtuns: "對普什圖人作出讓步"
 AFG_concessions_to_pashtuns_desc: "普什圖人佔我國人口的大多數，幾個世紀以來，他們的大多數家庭都堅持普什圖瓦利的傳統習俗。現在，他們中的許多人擔心他們的生活方式正在被侵蝕。如果我們能讓更多的普什圖民族主義者和普什圖瓦利實踐者進入政府，這種擔憂可能會得到緩解。"
 AFG_reform_2: "建造查克大壩"
 AFG_reform_2_desc: "在外國夥伴的幫助下，我們具備了建造一座新的大型水力發電大壩的技術和財務手段，這座大壩將為首都及周邊地區提供電力，即便這肯定會激怒我們資助者的對手。"
 AFG_reform_3: "遏制反民主的影響"
 AFG_reform_3_desc: "儘管我們努力彌合新政府與反對派之間的裂痕，但許多人仍傾向於反動的、反民主的信念，他們若有機會，很可能會採取行動反對我們。因此，我們必須採取更多措施遏制此類活動。"
 AFG_reform_4: "經濟現代化"
 AFG_reform_4_desc: "隨著[ROOT.GetNonIdeologyName]的穩定恢復，投資和商業興趣隨之而來。為了搞活經濟，我們將對農業現代化和我國有限的工業展開投資。"
 AFG_parliamentary_democracy: "議會民主制"
 AFG_parliamentary_democracy_desc: "國王查希爾·沙阿經過多年在叔父們陰影下的統治後，他的政治信念開始顯現出來。顯然，如果民眾對變革的支持足夠強大，國王將支持向議會制民主的過渡。然而，這種激進的變化可能會導致首都之外佔多數的傳統人群的抵制，並將國家推向內戰。"
 AFG_parliamentary_democracy_tt: "§Y如果民主主義支持率高於50%，我們會免於觸發內戰。§!"
 AFG_secure_dynasty: "鞏固王朝"
 AFG_secure_dynasty_desc: "隨著經濟的穩定和民眾的安撫，我們可以通過驅逐政府中較不忠誠的成員並用忠於國王的其他家族的成員取而代之，從而鞏固巴拉克宰王朝。"
 AFG_maintain_neutrality: "保持中立"
 AFG_maintain_neutrality_desc: "儘管國內相對穩定，但全球局勢日益險惡。在我們被迫捲入任何衝突之前，我們必須向所有人明確表態，我們將保持中立。"
 AFG_expel_axis_nationals: "驅逐軸心國僑民"
 AFG_expel_axis_nationals_desc: "同盟國指責我們縱容他們的敵人，因為許多敵對國家的公民被允許在[ROOT.GetNonIdeologyName]自由活動。儘管沒有證據表明他們正在從事對我們不利的活動，但為了安撫盟軍，在當前全球衝突期間，我們應要求這些人離境。"
 AFG_expel_allied_nationals: "驅逐同盟國僑民"
 AFG_expel_allied_nationals_desc: "軸心國向我們提供了可疑的證據，聲稱我們的政權面臨同盟國的顛覆風險。他們認為，防止這一情況的唯一方法是驅逐所有同盟國僑民，以清除潛伏在境內的間諜。"
 AFG_pursue_our_own_agenda: "自主推行政策"
 AFG_pursue_our_own_agenda_desc: "隨著列強之間的衝突，國際秩序正在被改寫。與其將自己與任何一個陣營捆綁，不如利用混亂追求我們自己的外交政策目標。"
 AFG_align_with_the_allies: "與同盟國結盟"
 AFG_align_with_the_allies_desc: "儘管我們對英國有許多不滿，但現在我們必須擱置這些怨恨，與同盟國建立更緊密的合作。正如英國人所說，與其面對未知的夥伴，不如選擇熟悉的魔鬼。"
 AFG_demand_pashtunistan_referendum: "要求普什圖斯坦公投"
 AFG_demand_pashtunistan_referendum_desc: "普什圖人是我國的多數民族，但許多人仍然生活在鄰國境內。我們需要推動這些地區的普什圖人獨立，將他們納入我們的勢力範圍。"
 AFG_protector_of_the_tajiks: "塔吉克人的保護者"
 AFG_protector_of_the_tajiks_desc: "北方的普什圖人與大量塔吉克人之間常常出現緊張關係。然而，我們有機會通過解放那些遭受[742.OWNER.GetLeader]專制統治的境外的塔吉克人，來贏得他們的支持。"
 AFG_protector_of_the_tajiks_tt: "解鎖決議，可以在[742.GetName]被[ROOT.GetName]佔領時與[742.OWNER.GetNameDef]議和"
 AFG_anti_soviet_cooperation: "反蘇合作"
 AFG_anti_soviet_cooperation_desc: "有許多國家希望遏制[SOU.GetAdjective]的影響。我們應利用這一機會從這些國家獲取軍事專業知識，以充分準備應對未來的[SOU.GetAdjective]擴張。"
 AFG_sinkiang_intervention: "干預新疆"
 AFG_sinkiang_intervention_desc: "[SIK.GetNonIdeologyName]長期以來都是伊斯蘭世界的一部分。然而，前俄羅斯帝國和中國的共產主義興起正威脅著我們境外的穆斯林同胞。現在是時候徹底消除這一威脅了。"
 AFG_gant_refuge_to_jadidists: "給予賈迪德主義者庇護"
 AFG_gant_refuge_to_jadidists_desc: "在[SOV.GetNameDef]，隸屬於賈迪德運動的伊斯蘭現代主義者和改革人士正遭受政府的系統性迫害，眾多曾經活躍於青年布哈拉組織和青年希瓦組織的成員已經淪為[SOV.GetLeader]政治清洗的對象。如果我們能夠為這些人士提供安全庇護，同時鼓勵他們將民主理念引入我們的國家，這無疑將是一項富有遠見的明智決策。"
 AFG_ally_the_young_afghans: "與青年阿富汗結盟"
 AFG_ally_the_young_afghans_desc: "由知識分子馬哈茂德·塔爾齊領導的青年阿富汗運動，曾影響過前國王阿曼努拉·汗，並推動了一場主張君主立憲制的改革運動。我們應當與一些傾向民主的阿曼努拉忠實支持者重新建立聯繫，確保他們支持我們的新民主政府。"
 AFG_propose_confederation_with_pakistan: "提議與巴基斯坦建立聯邦"
 AFG_propose_confederation_with_pakistan_desc: "[PAK.GetNonIdeologyName]的人民在[ENG.GetAdjective]統治下受苦已久，他們理應為獨立而奮鬥。然而，我們的兩國在歷史和文化上有著深厚的聯繫。為了避免未來對立，我們兩國合併才是明智之舉。"
 AFG_afghan_pakistan_cold_War: "阿富汗-巴基斯坦冷戰"
 AFG_afghan_pakistan_cold_War_desc: "儘管與邊境另一側的親屬關係讓我們感到痛心，但我們必須承認他們現在對我們的威脅。因此，我們必須做好準備，以任何必要的手段牽制他們。"
 AFG_graveyard_of_empires: "帝國墳場"
 AFG_graveyard_of_empires_desc: "帝國來來去去，但我們的人民始終是這一地區無可爭議的主人。只要我們人民團結一致並保持傳統，任何侵略者都將發現[ROOT.GetNonIdeologyName]是他們真正的墳場。"
 AFG_prepare_for_operation_countenance: "準備“贊同行動”"
 AFG_prepare_for_operation_countenance_desc: "同盟國正準備干預鄰國[PER.GetName]以搶先佔據該國的石油供應。我們必須做好後勤安排，支持這場干預，併為即將到來的軍事行動盡我們的一份力。"
 AFG_invite_foreign_corporations: "邀請外國公司"
 AFG_invite_foreign_corporations_desc: "我們的工業能力仍然落後於其他國家，其連鎖反應導致國內武器生產稀少。為了扭轉局面並實現工業現代化，我們將邀請全球各地的公司前來開展業務。"
 AFG_secure_iran: "控制伊朗"
 AFG_secure_iran_desc: "現在是時候控制[PER.GetAdjective]油田了。與盟友協作，我們將採取必要行動，即便這會使[PER.Capital.GetCapitalVictoryPointName]政權更迭。"
 AFG_repeal_the_durand_line: "廢除杜蘭線"
 AFG_repeal_the_durand_line_desc: "我們已經證明自己是同盟國在該地區的可信夥伴。也許現在是重新談判杜蘭線的好機會，那是多年前強加給我們的殘酷遺產。"
 AFG_future_of_balochistan: "俾路支斯坦的未來"
 AFG_future_of_balochistan_desc: "儘管我們暫時與同盟國合作，但必須考慮我們地區的長期政治局勢。因此，我們應推動建立一個獨立的俾路支斯坦，使其受我們的影響，而不是被更強大的國家吞併。"
 AFG_linchpin_of_global_defense: "全球防禦的支柱"
 AFG_linchpin_of_global_defense_desc: "同盟國繼續將我們的忠誠視為地緣政治姿態中的一大資產。我們應利用這一點，為軍事基礎設施爭取更多投資，這將對我們雙方都有利。"
 AFG_promote_the_counter_elite: "提拔反主流精英"
 AFG_promote_the_counter_elite_desc: "政治精英中有許多人擁有激進的想法，希望通過現代化來改變國家，但由於保守的政治環境，他們無法付諸實踐。隨著舊政府的解散，現在或許是提拔這些激進者的時機。"
 AFG_promote_the_counter_elite_tt: "以下顧問將可供任命："
 AFG_support_warzistan_independence: "支持瓦濟里斯坦獨立"
 AFG_support_warzistan_independence_desc: "我們與印度[ENG.GetAdjective]的邊界是兩國間持續緊張的根源。儘管我們缺乏足夠力量將他們逐出該地區，但可以通過支持如瓦濟里斯坦這樣的獨立運動來削弱其統治。"
 AFG_socialist_coup: "社會主義政變"
 AFG_socialist_coup_desc: "隨著保守派對政治思想的限制被削弱，反君主制思潮如潮水般席捲全國。現在是清除這一陳舊王國，並迎接一個現代社會主義國家的時候了。"
 AFG_socialist_coup_tt: "§Y如果共產主義支持率高於60%，我們會免於觸發內戰。§!"
 AFG_state_atheism: "國家無神論"
 AFG_state_atheism_desc: "想要實現經濟和社會的現代化，我們就必須放棄普什圖瓦里、伊斯蘭教和其他所有大眾的傳統觀念。因此，我們必須限制這些過時的東西，以世俗方式教育人民。"
 AFG_soviet_research_cooperation: "蘇聯研究合作"
 AFG_soviet_research_cooperation_desc: "推翻舊政權後，曾經的對手[SOU.GetNameDef]迅速成為我們最親密的朋友。因此，我們有機會從他們那裡獲取技術見解，以推動[ROOT.GetNonIdeologyName]的轉型。"
 AFG_soviet_research_technology_exchange_tt: "§Y如果[SOU.GetNameDefCap]對我們的評價較高，他們會更有可能接受。§!\n如果[SOU.GetFlag]§Y[SOU.GetNameDef]§!同意提議，我們會加入與他們的科技共享組織。"
 AFG_communist_industrialization: "共產主義工業化"
 AFG_communist_industrialization_desc: "隨著帝國主義政權舊有治理機制的瓦解，我們現在可以啟動快速集體化和工業化的進程，使我們的經濟趕上20世紀的步伐。"
 AFG_support_soviets_in_asia: "支持蘇聯在亞洲的行動"
 AFG_support_soviets_in_asia_desc: "[SOU.GetNameDef]在中亞區域的各個共和國由於距離[SOU.Capital.GetCaptialVictoryPointName]較遠，已成為反革命活動的溫床。為防止反動勢力蔓延至我國，我們應支持[SOU.GetAdjective]在該區域維持秩序。"
 AFG_integrate_tajik_and_uzbek_republics: "中亞的捍衛者"
 AFG_integrate_tajik_and_uzbek_republics_desc: "我們已證明自己是[SOU.GetNameDef]不可或缺的資產。因此，我們理應請求因我們的努力而獲得領土讓步。這也將有助於安撫北方的非普什圖少數民族。"
 AFG_ally_basmachi_remnants: "拉攏巴斯瑪奇殘部"
 AFG_ally_basmachi_remnants_desc: "直到1934年，巴斯瑪奇運動仍在與[SOV.GetAdjective]勢力抗爭，試圖解放中亞。儘管他們的起義被鎮壓，一些領袖仍然逃脫。我們應努力與這些自由戰士建立聯繫，邀請他們前來效忠。雖然他們曾支持哈比卜拉·卡拉卡尼，但如今我們已掌權，動搖他們並不困難。"
 AFG_integrate_tajik_and_uzbek_republics_tt: "如果§Y[SOU.GetName]§!同意提議："
 AFG_republic_of_afghanistan: "宣佈成立共和國"
 AFG_republic_of_afghanistan_desc: "在建立君主立憲制的進程中間，採納民主制度是一項巨大的進步。然而，人們仍然擔心，除非廢除君主制的最後殘餘，宣佈成立共和國並選舉一位民主國家元首，我們的民主自由才能完全得到保障。"
 AFG_republic_of_afghanistan_tt: "§Y我們將能夠選擇一個新的國家身份，這可能會改變我們的核心地區，或增加新的理念。§!"
 AFG_hot_war_with_pakistan: "消滅巴基斯坦"
 AFG_hot_war_with_pakistan_desc: "[PAK.GetNonIdeologyName]的愚蠢政權試圖分裂我們的人民，讓我們內鬥不止，而[SOU.GetNameDef]和[RAJ.GetNameDef]的真正威脅卻在不斷壯大。在他們把我們的人民置於另一個強權的枷鎖下之前，我們必須消滅這個崛起的政權。"
 AFG_accelerate_integration: "加強邦聯"
 AFG_accelerate_integration_desc: "[ROOT.GetNonIdeologyName]最近與[PAK.GetNonIdeologyName]建立的邦聯取得了巨大成功。然而，我們應進一步加速整合進程，以確保為應對世界可能給我們帶來的任何挑戰做好準備。"
 AFG_seek_british_investment: "尋求英國投資"
 AFG_seek_british_investment_desc: "數十年來，[ENG.GetAdjective]擔心[SOV.GetNameDef]可能突然行軍通過我國，併吞並他們饞涎已久的印度領土。這種擔憂使我們獲取了津貼和投資，以確保我們支持他們的利益。隨著世界局勢愈加緊張，繼續這種策略可能帶來更多收益。"
 AFG_central_asian_unification: "中亞統一"
 AFG_central_asian_unification_desc: "通過我們的精心管理，中亞已從經濟落後地區轉型為迅速擴張的工業強國。我們將團結一致，為全國人民打造一個社會主義的新未來。"
 AFG_central_asian_unification_tt: "解鎖§Y$AFG_develop_central_asia_category$§!決議，可以獲得轉交給我們的前[SOU.GetAdjective]中亞地區的核心。"
 AFG_sov_iran_war: "推翻[PER.GetNonIdeologyName]的沙阿"
 AFG_sov_iran_war_desc: "我們的[SOU.GetNameDef]同志四面受敵，無法維持一支能夠對抗敵人的不凍港艦隊。佔領[PER.GetName]將為我們提供一個新的海軍作戰基地，同時擺脫一個潛在的敵人。"
 AFG_development_in_uzb: "開發烏茲別克斯坦"
 AFG_development_in_uzb_desc: "烏茲別克斯坦長期以來被各個佔據此地的政權忽視。如果我們要鞏固對它的控制，必須糾正這一不公，加大力度開發該區域，並將它整合到我們的經濟中。"
 AFG_development_in_taj: "開發塔吉克斯坦"
 AFG_development_in_taj_desc: "塔吉克斯坦的潛力尚未充分發揮。融入我們的經濟體系後，它可以成為鋁及其他現代化努力所需關鍵資源的重要來源。"
 AFG_development_in_tms: "開發土庫曼斯坦"
 AFG_development_in_tms_desc: "石油正在成為現代經濟或軍事的關鍵資源。幸運的是，勘探者已經確定土庫曼斯坦擁有豐富的石油資源，等待開發。"
 AFG_modern_economy: "現代經濟"
 AFG_modern_economy_desc: "我們終於擺脫了限制人民發展的落後經濟實踐的束縛。現在，我們可以真正與世界其他工業化國家並肩而立。"
 AFG_darulaman: "達魯拉曼"
 AFG_darulaman_university: "達魯拉曼大學"
 AFG_darulaman_university_desc: "隨著政府設施的遷移，我們的現代城市達魯拉曼正在迅速擴張。然而，國王希望通過創辦一所擁有世界級設施的新大學，使達魯拉曼成為一座學術名城。"
 AFG_modifiy_1923_constitution_modifier_tt: "§Y$AFG_1923_constitution_modifier$§!追加效果：\n"
 AFG_from_the_ashes: "浴火重生"
 AFG_from_the_ashes_desc: "自奧斯曼帝國解體以來，伊斯蘭世界出現了權力真空。現在，隨著列強再次因全球衝突分心，我們有機會確立自身作為伊斯蘭世界的卓越強權的地位。"
 AFG_exploit_turko_persian_heritage: "利用突厥-波斯遺產"
 AFG_exploit_turko_persian_heritage_desc: "幾個世紀以來，我們的國家深受[PER.GetAdjective]和[TUR.GetAdjective]文化的影響。我們應將其落實到具體政策，打造一種新的突厥-波斯身份，用於建立與鄰國的團結感。"
 AFG_exploit_turko_persian_heritage_tt: "解鎖§Y$AFG_turko_persian_heritage_category$§!決議，可以邀請國家加入我們的陣營或獲得對他們的戰爭目標。"
 AFG_protector_of_baghdad: "巴格達的保護者"
 AFG_protector_of_baghdad_desc: "TODO"
 AFG_savior_of_the_holy_lands: "聖地拯救者"
 AFG_savior_of_the_holy_lands_desc: "時機已至，我們將履行神聖職責，將聖地從外國壓迫者的枷鎖中解放出來。我們的勇士將在祖先的力量激勵下前進，為收復信仰的發源地而戰。這一神聖使命不僅將把伊斯蘭世界統一在我們的領導下，還將為我們的國家帶來名譽與榮耀。"
 AFG_recruit_experts_and_officers: "招募專家與軍官"
 AFG_recruit_experts_and_officers_desc: "曾為[PER.GetAdjective]或[TUR.GetAdjective]政權服務的科學家、工程師和軍官如今開始認識到我們國家的優越性。因此，我們或許能夠說服他們加入我們，在我們努力成為區域強權的過程中為我們服務。"
 AFG_turko_persian_empire: "突厥-波斯帝國"
 AFG_turko_persian_empire_desc: "隨著[TUR.GetAdjective]和[PER.GetAdjective]的大部分領土牢牢掌控在我們手中，現在是時候將我們的統治重組為一個新的突厥-波斯帝國，為我們的偉大社會提供安全與穩定。"
 AFG_eyes_on_the_north: "放眼北方"
 AFG_eyes_on_the_north_desc: "我們北方的區域資源豐富，我們的對手還沒有充分利用這些資源。我們必須開始為可能的擴張到這些地區做必要準備。加強我們的軍事存在和確保補給線的安全將是這一進程中的關鍵步驟。"
 AFG_alliance_with_turkik_peoples: "聯合突厥人民"
 AFG_alliance_with_turkik_peoples_desc: "作為我們北方戰略目標的一部分，必須通過激起突厥人民的不滿來削弱現有的權力結構。通過利用現存的怨恨和激發分裂，我們可以破壞當地政局的穩定，為我們的擴張創造更有利的環境。"
 AFG_alliance_with_turkik_peoples_tt: "解鎖決議§Y[AFG_get_turkik_people_name_key]§!，在[SOU.GetAdjective]中亞各地區扶持抵抗組織。我們干預過的地區將在與[SOU.GetNameDef]爆發戰爭時加入我們。"
 AFG_red_threat: "紅色威脅"
 AFG_red_threat_desc: "我們在中亞有了秘密盟友，如此就有一個削弱[SOU.GetAdjective]影響力並擴大自身勢力的獨特機會擺在我們面前。我們將與該地區的抵抗組織協調進攻，在敵人反應過來之前將其推翻。"
 AFG_fortify_pakistan: "加強邊防"
 AFG_fortify_pakistan_desc: "保衛我們新擴大的邊界是當務之急。建立一系列工事和防禦陣地，將保證我國領土的穩定和安全。此外，如果該地區發生衝突，這將使我們佔據強有力的軍事優勢來投射我們的軍事力量。"
 AFG_fortify_pakistan_tt: "與[RAJ.GetNameDef]接壤的、我們在之前的國策中獲得的地區將新增§G2§!個§Y陸上要塞§!。"
 AFG_into_the_plains_of_india: "進軍[RAJ.GetNameDef]平原"
 AFG_into_the_plains_of_india_desc: "現在是我國人民宣稱自己是印度次大陸主人的時候了。我們要像我們的祖先曾經做過的那樣，趁他們還虛弱的時候從山上衝下來，但這一次我們要留在那裡。"
 AFG_pashtun_empire: "普什圖斯坦的崛起"
 AFG_pashtun_empire_desc: "今天是我們國家歷史上的一個歷史性時刻。在[ROOT.GetLeader]的領導下，我們將自豪地宣佈普什圖斯坦至高國的建立，並迎來普什圖人民的新紀元。通過現代化的軍隊、戰略聯盟以及雄心勃勃的政策，我們已經鞏固了作為區域主導力量的地位。"
 AFG_work_with_gestapo: "與[GER.GetAdjective]情報部門合作"
 AFG_work_with_gestapo_desc: "在我們新獲得的領土上，不滿和動盪依然對我們的權威構成了重大挑戰。為了解決這些問題，我們與[GER.GetAdjective]情報部門建立了合作關係。他們在反叛亂和情報行動方面的專業知識將是識別和消滅叛亂勢力的重要助力。"
 AFG_secure_baghdad: "控制巴格達"
 AFG_secure_baghdad_desc: "隨著我們區域影響力的擴大，[IRQ.GetNameDef]的存在顯然可能破壞我們的努力。因此，我們必須要求其對外政策與我們保持一致，否則他們將面對我們武裝部隊的怒火。"
 AFG_agreement_with_germany: "與[GER.GetNameDef]達成協議"
 AFG_agreement_with_germany_desc: "在這些動盪的時代，我們必須尋求強大而可靠的盟友，以確保我們作為伊斯蘭世界主導力量的地位。因此，我們將聯繫[GER.GetNameDef]，探討建立共同防禦協定的可能性。"
 AFG_agreement_with_germany_tt: "\n\n§Y如果[GER.GetNameDefCap]對我們的評價高於50，他們會更有可能接受。§!"
 AFG_renounce_the_durand_line: "廢除杜蘭線"
 AFG_renounce_the_durand_line_desc: "杜蘭線是外國壓迫者強加給我們的界線，長期以來將我們普什圖家人分隔兩地。無論通過外交的巧妙手段還是武裝部隊的強大實力，我們必將結束這一不公。"
 AFG_renounce_the_durand_line_tt: "\n\n§Y如果目標地區的擁有者已經處於戰爭狀態或被正在進行的內戰削弱實力，他們更可能接受我們的提議。§!"
 AFG_topple_iran: "推翻伊朗政權"
 AFG_topple_iran_desc: "在[ROOT.GetLeader]的遠見卓識領導下，我們準備為長期遭受[PER.GetLeader]的暴政的[PER.GetAdjective]兄弟姐妹帶來自由與正義。我們不僅要鞏固我們的邊界，還要擴大我們在該區域的影響力。"
 AFG_sov_attack_bonus: "紅色威脅"
 AFG_raj_attack_bonus: "進軍印度"
 AFG_work_with_ger_intel_bonus: "游擊鎮壓技術"
 AFG_rapprochement_with_non_pashtuns: "與非普什圖人和解"
 AFG_rapprochement_with_non_pashtuns_desc: "長期以來，我國的非普什圖人被排除在政治邊緣之外。這不僅導致了對中央政府的不滿，還導致了1929年中央政府的徹底倒臺。因此，在新的民主制度下，我們必須確保所有人都感到自己得到了代表和傾聽。"
 AFG_khorasan_buffer_state: "建立呼羅珊緩衝國"
 AFG_khorasan_buffer_state_desc: "當前[PER.GetNonIdeologyName]對我們發動戰爭的威脅幾乎被完全消除，是時候著眼於未來了。鑑於我們與該國之間的歷史緊張關係以及我們在“贊同行動”中的介入，我們應採取措施建立一個緩衝國，以防未來可能復仇的[PER.GetAdjective]政權。"
 AFG_khorasan_buffer_state_tt: "§Y當佔領了以下地區，我們可以建立一個傀儡呼羅珊政府：\n[1004.GetName]\n[416.GetName]\n[1003.GetName]§!"
 AFG_emerging_economy: "新興經濟"
 AFG_mountain_training_2: "支配山地"
 AFG_mountain_training_2_desc: "在我們山地訓練計劃取得成功後，很明顯我們應繼續組建專門針對這種地形的戰鬥部隊。"
 AFG_expand_quami_template: "改革庫阿米制度"
 AFG_expand_quami_template_desc: "我國的庫阿米制度多年來確實效果良好，但仍有改進空間。通過在組建部隊時重新調整編制，他們將能夠更好地保衛[AFG.GetNonIdeologyName]。"
 AFG_expand_quami_template_tt: "對§Y普什圖徵兵§!模板添加§Y3§!個民兵營。"
 AFG_expand_quami_template_2_tt: "如果我們已研究§Y$tech_engineers$、$tech_military_police$或$tech_field_hospital$§!，這些技術也將添加到模板中。"
 AFG_request_soviet_support: "請求蘇聯援助"
 AFG_request_soviet_support_desc: "由於經濟資源和人力的有限性，我們的革命面臨失敗的危險。如果我們要成功，就必須儘快從[SOU.GetNameDef]獲得援助。"
 AFG_international_brigades: "國際縱隊"
 AFG_international_brigades_desc: "儘管我們軍隊做出了勇敢的犧牲，但戰爭似乎並未朝著對我們有利的方向發展。然而，我們或許可以通過向渴望與壓迫作鬥爭的國際志願者開放徵兵，從而扭轉局勢。"
 AFG_defending_democracy: "保衛國家"
 AFG_defending_democracy_desc: "儘管我們已經消除了對政府的內部威脅，但來自邊界之外的威脅將始終存在。我們必須竭盡所能確保我們的經濟能夠支持軍隊應對可能的戰爭。"
 AFG_islamic_republic_idea: "伊斯蘭民主"
 AFG_recruit_foreign_experts: "招募外國專家"
 AFG_recruit_foreign_experts_desc: "我們國內可能缺乏具備專業技能的人才，所以應尋求外國援助，並讓他們教授我們這些技能，以備未來之需。"
 AFG_seek_american_aid: "尋求美國援助"
 AFG_seek_american_aid_desc: "$PAR_accept_american_loans_desc$"
 AFG_bill_of_rights: "權利法案"
 AFG_bill_of_rights_desc: "我們的人民應當擁有一部明確其法律權利的成文法典。"
 AFG_follower_of_islam: "伊斯蘭信徒"
 AFG_follower_of_islam_desc: "伊斯蘭教千年以來一直是我們信仰的核心，我們應確保我們的領導人遵循其指導原則，從而帶領我們的國家進入一個新的黃金時代。"
 AFG_ministry_of_supply: "供應部"
 AFG_ministry_of_supply_desc: "軍事的供應線幾乎不存在。為了改善這種情況，我們將建立一個新部門，專門負責軍隊的所有供給以及關鍵基礎設施的管理。"
 AFG_communist_propaganda: "宣傳部"
 AFG_communist_propaganda_desc: "所有大眾傳播手段必須置於國家權威之下，並用於鼓舞人民投身我們光榮的工人共和國。"
 AFG_hold_elections: "舉行選舉"
 AFG_hold_elections_desc: "隨著國內局勢趨於平靜，我們終於有機會舉行[AFG.GetNonIdeologyName]的首次自由選舉。"
 AFG_hold_elections_tt: "§Y即將舉行的選舉事件將允許我們選擇新的國家領導人。§!"
