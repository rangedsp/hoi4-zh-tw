l_simp_chinese:
 #########
 #NORDIC SHARED #
 ########
 AAT_nordic_shared.1.t: "[FROM.GetName]邀請我們加入[NORDIC_get_alliance_name]"
 AAT_nordic_shared.1.desc_faction_member: "[FROM.GetNameDefCap]希望我們的聯盟更進一步，並在多個層面上深化合作。他們認為軍事聯盟只是邁向更強大、更統一的北歐地區的第一步。"
 AAT_nordic_shared.1.desc_non_faction_member: "[FROM.GetNameDefCap]正在努力在北歐所有國家之間建立深度合作。他們想要創建[NORDIC_get_alliance_name]並邀請我們加入他們的行列。"
 AAT_nordic_shared.1.a: "密切合作是生存之道。"
 AAT_nordic_shared.1.b: "這聽起來太危險了，我們最好別牽扯進去。"
 AAT_nordic_shared.2.t: "[FROM.GetName]提議相互保障"
 AAT_nordic_shared.2.desc: "隨著世界各地緊張局勢的加劇，尋找可信的盟友變得越來越困難。[FROM.GetAdjective]政府提議，同為北歐袍國，我們向世界宣佈，[ROOT.GetName]和[FROM.GetName]在面對外國入侵時將相互支持。我們願意許下承諾嗎？"
 AAT_nordic_shared.2.a: "這可能是生存下去的唯一方法"
 AAT_nordic_shared.2.b: "我們不會讓他們拖著我們"
 AAT_nordic_shared.3.t: "[FROM.GetName]會支持我們！"
 AAT_nordic_shared.3.desc: "我們已收到消息，[FROM.GetAdjective]人民會捍衛[ROOT.GetName]的獨立，反過來我們也會捍衛他們的獨立。北歐國家必須準備好作為一支團結的力量而不是一群小國來擊退任何入侵。"
 AAT_nordic_shared.3.a: "好消息！"
 AAT_nordic_shared.4.t: "我方提議遭[FROM.GetName]拒絕"
 AAT_nordic_shared.4.desc: "幾個世紀的歷史加在一起似乎也沒有對[FROM.GetAdjective]政府產生太大影響，我們的人民必須團結起來對抗外國的暴君。希望他們能在為時已晚之前改變主意。"
 AAT_nordic_shared.4.a: "悲傷的消息"
 AAT_nordic_cooperation.1.t: "[FROM.GetNameDef]越界了！"
 AAT_nordic_cooperation.1.desc: "接二連三的證據表明，我們針對[?GLOBAL.NORDIC_country_to_defend.GetName]所進行的戰備工作遭到了[FROM.GetName]的暗中阻礙。\n\n也許是時候給他們上一課，告訴他們真實的戰爭是怎麼被髮動的。"
 AAT_nordic_cooperation.1.a: "我們承擔不起讓衝突進一步升級的代價"
 AAT_nordic_cooperation.1.b: "他們死期將至，只是還未知覺"
 AAT_nordic_cooperation.2.t: "[FROM.GetName]援助我國戰備"
 AAT_nordic_cooperation.2.desc: "在這個背信棄義的時代，強化我們與[FROM.GetNonIdeologyName]間的紐帶價值非凡。我們與[?NORDIC_attacker.GetName]交戰時，他們伸出過援手，而如今願意更進一步，提議直接加入我們的衛國戰爭中來。畢竟，我們中間任一國遭到的攻擊，都將被視為對全體北歐國家的進攻。"
 AAT_nordic_cooperation.2.a: "我們歡迎他們的援助"
 AAT_nordic_cooperation.2.b: "沒有他們，我們自己也能搞定"
 AAT_nordic_cooperation.3.t: "[FROM.GetName]拒絕我方援助"
 AAT_nordic_cooperation.3.desc: "儘管我們心懷好意，但[FROM.GetNameDef]似乎不需要或不想要我方援助。這一費解決定背後的原因究竟為何，只有他們自己知道。\n\n這並不意味著我們無法以其他形式予之援助，也不意味著[?FROM.NORDIC_attacker.GetName]會將我們視為交戰方。"
 AAT_nordic_cooperation.3.a: "好吧……"
 AAT_nordic_cooperation.4.t: "[FROM.GetName]尋求投資"
 AAT_nordic_cooperation.4.desc: "我們的北歐鄰居派出了一個代表團，尋求投資以進一步發展他們的經濟。這肯定對我們的工業部門也有利，但我們應該確保我們支持的是友好的鄰居，而不是潛在的敵人。"
 AAT_nordic_cooperation.4.a: "這對我們雙方都有好處"
 AAT_nordic_cooperation.4.b: "不值得冒險"
 AAT_nordic_cooperation.5.t: "[FROM.GetName]投資滾滾而來"
 AAT_nordic_cooperation.5.desc: "北歐鄰國非常友好地接受了我國邀請，投資於我國經濟。他們的信任當然會得到回報，但更重要的是，這將使我國經濟增速大幅提升。"
 AAT_nordic_cooperation.5.a: "好消息！"
 AAT_nordic_cooperation.6.t: "[FROM.GetName]拒絕投資我國經濟"
 AAT_nordic_cooperation.6.desc: "儘管我們盡了最大努力，但我們還是沒能說服我們的北歐鄰居幫助我們進一步開發經濟。當然，我們總是能找另一個國家再試一次。"
 AAT_nordic_cooperation.6.a: "真遺憾。"
 AAT_nordic_cooperation.7.t: "[FROM.GetName]尋求經濟合作"
 AAT_nordic_cooperation.7.desc: "北歐鄰國希望求同存異，以此建立一個互惠互利的經濟和工業合作條約組織。如果合作得當，一如我等所盼，兩國經濟將在平等的意義上共同進步，畢竟雙方都是以平等的意義締結條約。\n\n鑑於本地區歷史上的敵意長期瀰漫，我們必須警惕：如果兩國關係最終破裂，我們將被親手養大的惡狼所屠戮。"
 AAT_nordic_cooperation.7.a: "公平的交易"
 AAT_nordic_cooperation.7.b: "看起來很可疑……"
 AAT_nordic_cooperation.8.t: "[FROM.GetName]接受交易"
 AAT_nordic_cooperation.8.desc: "我們剛剛獲悉，[FROM.GetAdjective]領導人已同意簽署互利協議，這將對兩國經濟乃至整個北歐做出巨大貢獻。"
 AAT_nordic_cooperation.8.a: "好消息！"
 AAT_nordic_cooperation.9.t: "[FROM.GetName]高層拒絕了我們的提議！"
 AAT_nordic_cooperation.9.desc: "儘管我們的目標是在平等的基礎上與[FROM.GetName]交易，但他們已經通知我們，他們對這樣的安排不感興趣。\n\n我們總是可以再試一次，或者尋找另一個北歐兄弟國家。"
 AAT_nordic_cooperation.9.a: "真是莫名其妙。"
 NORDIC_escalation_hostility_reason: "協防北歐諸國"
 #########
 #NORWAY #
 ########
 AAT_norway.1.t: "法西斯分子騷擾[NOR_lev_trotsky.GetName]"
 AAT_norway.1.desc: "在這位頗具爭議的革命家與他的房東外出去釣魚的時候，與民族統一黨關係密切的法西斯分子闖入了康拉德·克努森的家，這正是托洛茨基居住的地方。\n\n這些盜賊試圖尋找任何可以幫助除掉這位流亡的共產主義者的罪證，但幸運的是，在他們找到任何重要物品之前，克努森的女兒約迪斯嚇走了他們。"
 AAT_norway.1.a: "必須讓他遠離麻煩"
 AAT_norway.1.b: "也許可以一石二鳥"
 AAT_norway.1.c: "那就給他一間辦公室！"
 AAT_norway.1.d: "他的過去就是我們需要的證據，把他關進監獄！"
 AAT_norway.2.t: "托洛茨基被軟禁在農場"
 AAT_norway.2.desc: "由於[NOR_lev_trotsky.GetName]在流亡期間違反了不參與政治的協議，但同時法西斯分子也沒盜出什麼有用的證據，我們決定將他送往胡魯姆的一座農場，在那裡他將會受到警方的監視，並且與外界相隔。\n\n這種懲罰不可謂不嚴厲，但考慮到來自[SOU.GetNameDef]和國內法西斯主義的壓力，危險仍將伴其左右。"
 AAT_norway.2.a: "這是我們目前能做到最好結果"
 AAT_norway.3.t: "[ROOT.GetLeader.GetName]的將軍鎮壓異見者"
 AAT_norway.3.desc: "在克努森的別墅發生爭執後，由於共產主義者和法西斯主義者相互廝殺，政治局勢顯然充滿了危險。\n\n爭吵和政治動盪必須得到解決。托洛茨基的存在可能會給我們引來[SOU.GetNameDef]的怒火，同時，民族統一黨肯定會在第一時間把國家交給[FGR.GetLeader]，所以要不惜一切代價削弱他們的影響力。\n\n最好的辦法是把他送到墨西哥，[MEX.GetLeader]已經同意讓他入境。"
 AAT_norway.3.a: "這關係到挪威的生死存亡"
 AAT_norway.4.t: "托洛茨基加入我國政府！"
 AAT_norway.4.desc: "解決[NOR.GetAdjective]人民苦難的辦法其實就近在咫尺。[NOR_lev_trotsky.GetName]不僅是我們這個時代最偉大的馬克思主義作家之一，也是一位極具魅力的革命家和傑出的將領。\n\n這麼做肯定會讓我們與[SOV.GetNameDef]的關係變得緊張，但這是值得的。畢竟，他的經驗可以帶領我們年輕的國家以及斯堪的納維亞的工人走向強大。"
 AAT_norway.4.a: "一國之流寇，他國之救星！"
 AAT_norway.5.t: "[NOR_lev_trotsky.GetName]遭囚禁！"
 AAT_norway.5.desc: "其他人可能會認為在克努森家中找到的證據很薄弱、無關緊要、甚至是偽造的，他們也許是對的，但法官也會在某些情況下接受其有效性。此外，事實是我們不能冒險在這個時刻疏遠民族統一黨。這就是為什麼[NOR_lev_trotsky.GetName]立即遭到監禁。\n\n他將在什麼時候以何種形式重見天日，目前來說並不重要，但我們會確保他至少有比在西伯利亞時更好的住處。"
 AAT_norway.5.a: "一定要阻止他。"
 AAT_norway.6.t: "托洛茨基的命運"
 AAT_norway.6.desc: "我們將[NOR_lev_trotsky.GetName]軟禁在許呂姆的一座農場已經有一段時間了，但似乎這對涉事的任何一方都不是一個好的安排。[SOV.GetNameDefCap]想要引渡他，民族統一黨想要絞死他，而其他但凡不是鐵桿託派的人都想讓他滾蛋。我們需要決定如何處理這個麻煩的流亡者。\n\n墨西哥總統[MEX.GetLeader]已提議，如果我們決定讓他繼續流亡，該國可以接收他。但我們也可以直接把他送給[SOV.GetLeader]，作為兩國友好的象徵。"
 AAT_norway.6.a: "讓他享受墨西哥的陽光吧"
 AAT_norway.6.b: "斯大林怕是要樂壞了！"
 AAT_norway.7.t: "[get_trotsky_lastname]抵達墨西哥"
 AAT_norway.7.desc: "在我們國家尷尬地流亡多年之後，令人頭疼的流亡者[NOR_lev_trotsky]已經抵達墨西哥，在那裡他將受到畫家弗裡達·卡羅和迭戈·里維拉的款待。他們肯定會與他和他的妻子相處融洽。\n\n他可能會免於[SOV.GetNameDef]的追殺，但最重要的是，他不再是我們的麻煩了。"
 AAT_norway.7.a: "終於清靜了"
 AAT_norway.8.t: "[get_trotsky_lastname]押至莫斯科"
 AAT_norway.8.desc_SOV: "我們夢寐以求這一時刻很多年了。陰險卑鄙的[SOV_lev_trotsky.GetName]已經落入我們手中。他將為他的反革命罪行付出代價，最重要的是，他將為背叛斯大林同志而付出代價。在無產階級的眼裡，這兩者之間並沒有什麼區別。"
 AAT_norway.8.desc_NOR: "令人厭煩的前革命家[NOR_lev_trotsky.GetName]被帶到了莫斯科，在那裡他將被收監，也可能被處決，這取決於[SOU.GetLeader]的想法。\n\n不管他的命運如何，我們終於可以從這件又臭又長的麻煩事中抽身離場，還有一個好處就是我們與[SOU.GetNameDef]的關係越來越密切了。"
 AAT_norway.8.a: "終於！"
 AAT_norway.8.b: "終於擺脫了！"
 AAT_norway.9.t: "尼高斯沃爾內閣"
 AAT_norway.9.desc: "由[NOR_johan_nygaardsvold.GetName]領導的工黨政府是我們年輕國家有史以來第一個穩定的、擁有明確多數支持的政府。內閣在過去一年裡一直在努力工作，推動政策的實施——儘管進度緩慢，這些工作有助於[NOR.GetName]走出當前所處的經濟低谷，保障國民的福利待遇。\n\n當然，這些舉措對應的代價就是戰備支出的減少。一旦發現戰火即將燃燒到我國，我們就必須對戰爭進行充分準備，但現在我們只能希望這些準備將來不會派上用場。"
 AAT_norway.9.a: "未來只有和平和穩定！"
 AAT_norway.10.t: "搖搖欲墜的大議會"
 AAT_norway.10.desc: "隨著歐洲的戰爭逐步地逼近，[NOR.GetAdjective]議會（大議會）中充滿著混亂和不和的聲音。之前曾有跡象表明，尼高斯沃爾內閣將帶來一個穩定的時代，但現在早已沒有人顧及這些了，議會成員似乎無法就任何措施達成一致，來讓[NOR.GetName]安全度過即將到來的暴風雨。\n\n與此同時，人民的敵人磨刀霍霍，在衝突中大快朵頤，不斷壯大，直到[NOR.GetName]被戰爭的火焰吞噬。"
 AAT_norway.10.a: "我們會有多弱不禁風？"
 AAT_norway.11.t: "[ROOT.GetName]人民正在覺醒！"
 AAT_norway.11.desc: "幾個世紀以來，[ROOT.GetNonIdeologyName]人民一直遭受著斯堪的納維亞的其他強國奴役，任由其資本家擺佈。現在，他們自覺團結了起來，一起反抗壓迫者，抵制他們的霸權。\n\n現在，[ROOT.GetAdjective]人為了革命，正在尋找理論支撐！"
 AAT_norway.11.a: "這片古老土地上的人們將不再沉睡！"
 AAT_norway.12.t: "對約翰·尼高斯沃爾的不信任投票"
 AAT_norway.12.desc: "儘管約翰·尼高斯沃爾早早做出了承諾，但去年組建的政府似乎不僅沒有兌現承諾，還一心想要解除武裝。許多議員認為，[ROOT.GetName]應該發展工業，為新生的[NOR.GetAdjective]武裝力量投資，以阻止外國勢力入侵。\n\n於是，保守派右翼黨的成員們發起了不信任投票。雖然該黨主席兼企業家約翰·H·安德烈森已經考慮退休，但他還是抓住了這個機會，帶領挪威向新的方向發展；與尼高斯沃爾的社會進步大夢形成鮮明區別，他以務實、高效的形象示人。"
 AAT_norway.12.a: "尼高斯沃爾下臺，安德烈森上臺"
 AAT_norway.13.t: "吉斯林政變"
 AAT_norway.13.desc: "當我們忙於推動經濟發展並警惕境外法西斯主義勢力的滲透時，我們卻放任國內的法西斯主義在我們的眼皮底下滋長。儘管維德孔·吉斯林的支持率日益減少，而且他領導的政黨——民族統一黨——從未在議會中獲得一個席位，他還是組建了一個得到[?NOR.NOR_cw_fascist_attacker.GetAdjective]支持的政府，並聲稱已經掌握了[ROOT.GetNonIdeologyName]的權柄。"
 AAT_norway.13.a: "吉斯林時代可算來了！"
 AAT_norway.13.b: "[ROOT.GetNonIdeologyName]的人民永遠不會原諒你，叛徒。"
 AAT_norway.13.c: "我們必須盡一切所能來拖延他們！"
 AAT_norway.14.t: "此人大有所用"
 AAT_norway.14.desc: "維德孔·吉斯林多年來一直是[NOR.GetNonIdeologyName]法西斯主義的最大推崇者，他提出要在我們入侵他的祖國時提供幫助。\n\n他想在我們的支持下在奧斯陸發動政變，建立一個對[ROOT.GetNameDef]友好的政權。一旦將地位穩固，他將為我們的入侵鋪平道路，使[ROOT.GetAdjective]對[NOR.GetName]的佔領合法化。"
 AAT_norway.14.a: "他能派上大用場"
 AAT_norway.14.b: "這個小丑？我們自己會處理[NOR.GetNonIdeologyName]"
 AAT_norway.15.t: "吉斯林政變今乃天命所歸！"
 AAT_norway.15.desc: "儘管我們盡了最大的努力，但維德孔·吉斯林依然試圖在奧斯陸發動奪取權力的政變。在入侵的法西斯分子的支持下，他正在通過廣播宣佈成立他主導的新政府，後者致力於與我們的敵人合作。\n\n無論如何掩飾，我們之前已經處於劣勢，這次政變只會讓我們備戰的處境更加艱難。"
 AAT_norway.15.a: "[NOR.GetName]未來可能很不幸要進入吉斯林時代了。"
 AAT_norway.15.b: "我們會繼續戰鬥！"
 AAT_norway.16.t: "我們慘遭流放，但並非兩手空空。"
 AAT_norway.16.desc: "儘管天命難違，我們迫不得已揮淚告別[NOR.GetName]本土，但至少有一點可以感到欣慰：領導人的先見之明為最壞的情況做了準備，提前調配好了資源，為光復[NOR.GetAdjective]本土做好了準備。\n\n這是為了光復本土，這是屬於我們的奧德賽，我們終將回歸海的那邊。"
 AAT_norway.16.a: "我們一定會回來的！"
 AAT_norway.17.t: "[NOR.GetAdjective]索要領土"
 AAT_norway.17.desc_monarchist: "[FROM.GetAdjective]王室援引數百年前的文件，聲稱我國控制著挪威國王哈康七世擁有法理繼承權的王室領土的一部分。\n\n具體來說，他們指的是[GetNorwegianClaims]。"
 AAT_norway.17.desc_fascist: "[NOR.GetNameDef]領導人要求我國割讓部分領土，稱這是他們祖先的土地。不出所料，他們威脅稱若不屈從，就要迎接戰爭。\n\n所涉領土是[GetNorwegianClaims]。"
 AAT_norway.17.desc_denmark: "挪威國王哈康七世，舊稱丹麥王儲卡爾，的一位廷臣通過嚴肅的途徑遞交了一個要求。根據他們最後湊出來的說法以及一系列來歷不明的舊文件，他們得出瞭如此結論：丹麥不屬於丹麥，丹麥應屬於挪威王國。\n\n他們還暗示，如果我們拒絕，他們將用武力奪取丹麥，聲稱這是為了我們的安全。"
 AAT_norway.17.a: "我們別無選擇"
 AAT_norway.17.b: "荒唐！"
 GetNorwegianClaims_iceland: "冰島，他們堅稱現今的挪威王室建立之後，冰島仍歸丹麥王室一事是個徹頭徹尾的錯誤"
 GetNorwegianClaims_greenland: "格陵蘭島，也就是他們口中的埃裡克·勞德斯領地。據稱，早在哈康國王加冕為挪威國王時，我們就該把格陵蘭島一併交給他們"
 GetNorwegianClaims_faroes: "法羅群島，他們主張當地為其王室領地的一部分"
 GetNorwegianClaims_sweden: "布胡斯蘭、達拉納和耶姆特蘭地區，據稱，是遭瑞典王室入室盜竊才失去實控的"
 GetNorwegianClaims_bjarmeland: "白海附近的領土，他們稱之為比亞爾默蘭，並主張其維京先祖最早佔據該地"
 GetNorwegianClaims_ireland: "倫斯特郡，他們主張其維京先祖是當地最早的殖民者"
 GetNorwegianClaims_scotland: "設得蘭群島和蘇格蘭高地，他們宣稱其維京先祖最早政府當地，所以該歸他們"
 GetNorwegianClaims_vinland: "文蘭，即我國的紐芬蘭和拉布拉多，他們堅稱其維京先祖最早發現了這片土地，因此有權力提出領土主張"
 GetNorwegianClaims_denmark: "整個丹麥，有一說一，好大的胃口"
 AAT_norway.18.t: "[FROM.GetName]接受我方要求"
 AAT_norway.18.desc_monarchist: "我們成功地讓[FROM.GetAdjective]當局明白，我們的主張是正當的。因此，他們已經同意根據我們的聲索向國王陛下割讓領土。"
 AAT_norway.18.desc_fascist: "軟弱的[FROM.GetAdjective]政府已經退縮，同意讓我們接管這片領土。反正不管是通過武力還是法律途徑，我們都要奪得此地。"
 AAT_norway.18.a: "歡迎加入大家庭"
 AAT_norway.19.t: "[FROM.GetName]拒絕了我們的要求！"
 AAT_norway.19.desc_monarchist: "[FROM.GetName]拒絕了我們正當的領土要求，我國王室的威望受到了嚴重打擊，這無異於對[ROOT.GetAdjective]王室的侮辱，我們絕不能容忍。"
 AAT_norway.19.desc_fascist: "顯然，[FROM.GetAdjective]當局並不清楚他們拒絕的是誰。我們怎麼可能坐視合法領土被他們竊據？唯一的選擇就是武力征討了。"
 AAT_norway.19.a: "他們會為傲慢付出代價"
 AAT_norway.20.t: "我們的女王逝世！"
 AAT_norway.20.desc: "在英國探望家人時，她在睡眠中不幸死於心力衰竭。\n\n哈康國王和奧拉夫王子已經啟程前往英格蘭。這位挪威王后最初的頭銜是威爾士的莫德公主，她比自己的丈夫和兒子先一步離開人世。她受到所有挪威人的愛戴，在全國各地都受到擁護。"
 AAT_norway_news.1.desc: "經過多年艱苦的流亡生活，著名的革命家列夫·托洛茨基已經從[NOR.GetNonIdeologyName]抵達[MEX.GetNonIdeologyName]。他受到了著名畫家弗裡達·卡羅及其丈夫迭戈·里維拉的接待，他們將在墨西哥城的家中招待他，這對托洛茨基和他的妻子無疑是十分合適的。\n\n更值得一提的是，他將遠離[SOV.GetNameDef]的敵人帶來的任何危險，也許會在這個拉丁美洲國家享受寧靜的流亡生活。"
 AAT_norway_news.1.a: "有意思……"
 AAT_norway_news.1.sov: "他必須被正法！"
 AAT_norway_news.2.t: "挪威女王莫德去世了"
 AAT_norway_news.2.desc: "在訪問英國看望家人和她的哥哥英國國王喬治五世、挪威王后和威爾士王妃時，她在睡眠中死於心力衰竭。本週早些時候腹部手術後的併發症被認為是罪魁禍首。\n\n她在挪威是一個受人愛戴的人物，她的兒子奧拉夫王子和她的丈夫挪威國王哈康七世肯定會懷念她。"
 AAT_norway_news.2.a: "這是我們所有人的損失"
 AAT_norway_news.2.b: "又少了一個需要對付的王室成員！"
 AAT_norway_news.3.t: "挪威國王哈康七世去世"
 AAT_norway_news.3.desc: "在一次滑雪事故後，受人愛戴的挪威國王哈康七世因醫療併發症去世，手術表面上似乎很成功。\n\n挪威現在正在經歷其歷史上最黑暗的時期之一，希望奧拉夫王子儘快登上王位，引導它走向安全的港灣。"
 AAT_norway_news.99.t: "沃伊泰克國王將揚馬延納入麾下"
 AAT_norway_news.99.desc: "儘管被世界上大多數人忽視，但火炮以及王座的持有者，沃伊泰克國王，已經看到了這座北極島嶼的潛力。\n\n在當地和新來的北極熊的幫助下，揚馬延的居民開始恢復，並轉變為一個能夠應對任何挑戰的合格國家。這真是自維多利亞時代以來從未見過的景象。\n\n在其公民中，有一位極化的人物脫穎而出，其舊名字無關緊要，但從今以後將被稱為海軍大元帥約翰·馬延。"
 AAT_norway_news.99.a: "形勢有點失控了！"
 AAT_norway_rikstanken.1.t: "[ROOT.GetAdjective]坦克計劃"
 AAT_norway_rikstanken.1.desc: "坦克在過去從未是[ROOT.GetAdjective]武器庫的一部分，儘管我們靠自己追趕上來可能為時已晚，但這並不意味著我們應該放棄它們。\n\n第一步是找到一個合適的合作商，要麼通過採購，要麼通過聯合開發來發展我們的裝甲部隊。一個顯然的答案是找一個歐洲的軍事大國，但也許找一個地理位置近一些的供應商有更多的長期好處。"
 AAT_norway_rikstanken.1.a: "鄰國[?NOR_nordic_tank_seller.GetName]"
 AAT_norway_rikstanken.1.b: "[?NOR_communist_tank_seller.GetName]確實有方法"
 AAT_norway_rikstanken.1.c: "[?NOR_fascist_tank_seller.GetAdjective]的坦克十分先進"
 AAT_norway_rikstanken.2.t: "我們的[NOR.GetAdjective]裝甲項目計劃"
 AAT_norway_rikstanken.2.desc_NORDIC: "我們可以藉助鄰國兼北歐同胞[?NOR_nordic_tank_seller.GetName]發達的軍事工業，為我們的裝甲部隊提供裝備，但這對於我們這個小國來說成本很高。\n\n我們也可以只買一輛坦克，然後看看能做什麼改進。"
 AAT_norway_rikstanken.2.desc_SOV: "[?NOR_communist_tank_seller.GetName]掌握了生產資料，這意味著他們有能力製造大量的坦克，這將使我們有能力趕超我們的敵人。\n\n我們還可以利用這個機會向我們國家的工人展示共產主義政權的力量，並增加共產主義在[ROOT.GetName]的支持率。"
 AAT_norway_rikstanken.2.desc_GER: "[?NOR_fascist_tank_seller.GetAdjective]坦克的強大實力不容置疑，他們的工業實力能使我們建立匹敵任何對手的坦克部隊。我們還可以與他們合作，共同開發自己的坦克，並竭盡我們所能地幫助他們的工程師。\n\n當然，無論我們選擇何種方式，他們都會期望我們在意識形態上與他們保持一致。"
 AAT_norway_rikstanken.2.a: "我們先整一輛坦克試試水"
 AAT_norway_rikstanken.2.b: "為了達成均勢，我們需要大量的坦克"
 AAT_norway_rikstanken.2.c: "一份貿易協定可以使我們的國家在意識形態上變得更加緊密"
 AAT_norway_rikstanken.2.d: "尋求援助研發我們自己的坦克"
 AAT_norway_rikstanken.3.t: "[FROM.GetName]希望購買一輛[ROOT.GetAdjective]坦克"
 AAT_norway_rikstanken.3.desc: "[FROM.GetName]政府已經與我們取得聯繫，要求我們允許購買坦克。值得注意的是，由於預算原因，他們只能負擔得起一輛輕型坦克……還不帶炮塔。\n\n這當然是一個不尋常的請求，讓人不免心生懷疑，但他們聲稱在選擇如何建立裝甲部隊之前，想先試試水。"
 AAT_norway_rikstanken.3.a: "賣一輛坦克又沒啥損失"
 AAT_norway_rikstanken.3.b: "這不值得浪費我們的時間"
 AAT_norway_rikstanken.4.t: "[FROM.GetName]希望購買我國坦克"
 AAT_norway_rikstanken.4.desc: "[FROM.GetAdjective]政府想購買我們的坦克，以便涉足裝甲作戰。\n\n這對我們的經濟和軍火工業有好處，但我們必須首先考慮我們自己的坦克儲備，以及我們是否能信任他們組建裝甲部隊。"
 AAT_norway_rikstanken.4.a: "讓我們簽訂貿易協定"
 AAT_norway_rikstanken.4.b: "我們也需要這些坦克"
 AAT_norway_rikstanken.5.t: "[FROM.GetName]謀求更緊密的關係，以及更多坦克"
 AAT_norway_rikstanken.5.desc_SOV: "[FROM.GetAdjective]政府向我們提出了購買大量輕型坦克的請求，他們不僅希望達成貿易協議，還希望加強我們兩國人民之間的關係。\n\n這對於我們來說是一個機會，可以向[FROM.GetName]的民眾展示獲取生產資料後可以取得何等的成果，同時還能促成未來更加緊密的合作。"
 AAT_norway_rikstanken.5.desc_GER: "來自[FROM.GetAdjective]政府的代表想大量購買我們的先進輕型坦克。\n\n除此之外，他們對我們的意識形態原則表現出興趣，並希望向他們的民眾展示最高水平的[ROOT.GetRulingIdeologyNoun]是什麼樣子，以便在他們的國家進行推廣。"
 AAT_norway_rikstanken.5.a: "熱烈歡迎貴國前來考察！"
 AAT_norway_rikstanken.5.b: "這不值得浪費我們的時間"
 AAT_norway_rikstanken.6.t: "[FROM.GetName]希望在坦克研發上尋求合作"
 AAT_norway_rikstanken.6.desc: "[FROM.GetAdjective]政府正在立項謀求開發自己產的坦克，並向我們尋求幫助。他們聲稱，不僅他們可以獲得一些技術和意識形態方面的知識，我們自己的坦克項目也能從這次合作中受益。"
 AAT_norway_rikstanken.6.a: "他們的坦克將會所向披靡"
 AAT_norway_rikstanken.6.b: "謝謝，不需要"
 AAT_norway_rikstanken.7.t: "我們喜迎自己的全新國產坦克"
 AAT_norway_rikstanken.7.desc: "我們的鄰居[FROM.GetName]已經同意銷售給[ROOT.GetName]第一輛坦克。雖然作為一輛坦克它有的東西不多，甚至連炮塔都沒有，但通過一些改裝，它有可能成為[ROOT.GetAdjective]坦克部隊的開端。"
 AAT_norway_rikstanken.7.a: "這就是我國的最佳決策！"
 AAT_norway_rikstanken.8.t: "[FROM.GetNameDefCap]將為我國批量提供坦克"
 AAT_norway_rikstanken.8.desc: "[FROM.GetAdjective]政府批准了向我國大量出售坦克的協定。如此一來，我國軍隊將能擁有與列強正面相抗的能力。"
 AAT_norway_rikstanken.8.a: "終於！"
 AAT_norway_rikstanken.9.t: "執手言歡：[ROOT.GetAdjective]與[FROM.GetAdjective]的坦克外交"
 AAT_norway_rikstanken.9.desc: "[FROM.GetAdjective]領導人已經同意向我們出售他們的坦克，與此同時，還簽訂了一份正式條約，使[ROOT.GetName]與[FROM.GetAdjective][FROM.GetRulingIdeologyNoun]意識形態更加一致，雙方關係變得更加緊密。"
 AAT_norway_rikstanken.9.a: "[FROM.GetRulingIdeologyNoun]將奪得勝利"
 AAT_norway_rikstanken.10.t: "[FROM.GetNameDefCap]接受研究協定"
 AAT_norway_rikstanken.10.desc: "[FROM.GetAdjective]特使已經確認，只要我們的國家在意識形態上繼續保持一致，他們願意幫助我們開發自己的坦克。我們相信，我們的合作將帶來新的坦克發展方式，他們也將從中受益。"
 AAT_norway_rikstanken.10.a: "終於，挪威有坦克了！"
 AAT_norway_rikstanken.11.t: "國產坦克帶給我們的啟發"
 AAT_norway_rikstanken.11.desc: "距離我們的國家擁有第一輛坦克已經有一段時間了，我們親切地稱其為“挪為”坦克，意思是挪威的坦克。我們已經弄清楚了它的工作原理，以及我們能用它做什麼，所以也許我們可以更進一步嘗試剖析坦克，以便最終自主設計、自己製造坦克。畢竟，單單一輛坦克並不能帶來什麼戰鬥上的優勢。"
 AAT_norway_rikstanken.11.a: "坦克要多多！"
 AAT_norway_rikstanken.11.b: "坦克，不需要"
 AAT_norway_rikstanken.12.t: "[FROM.GetName]拒絕我方提案"
 AAT_norway_rikstanken.12.desc: "儘管我們熱切地希望在[FROM.GetNonIdeologyName]的幫助下啟動[ROOT.GetAdjective]坦克計劃，但他們拒絕了我們的請求。這對我們實現武裝部隊現代化的希望來說是一個打擊。"
 AAT_norway_rikstanken.12.a: "我們會找其它的法子"
 AAT_rikstanken_program_tech_bonus: "挪威坦克計劃"
 AAT_norway_allied.1.t: "[FROM.GetName]正在尋求投資"
 AAT_norway_allied.1.desc: "[NOR.GetAdjective]政府正在尋求我們的幫助以發展工業，這是我們賺取利益的大好機會，也是我們未來將他們培養為潛在盟友的契機，當然了，前提是戰爭爆發。"
 AAT_norway_allied.1.a: "幫助未來盟友也沒什麼不好的。"
 AAT_norway_allied.1.b: "這可能有點危險"
 AAT_norway_allied.2.t: "[FROM.GetNameDefCap]打算投資我國發展"
 AAT_norway_allied.2.desc: "我們對[FROM.GetAdjective]政府的提議已獲成功，他們同意投資於我國經濟。這也意味著我國將與他們更加親密，他們甚至可能在未來成為我國的盟友。"
 AAT_norway_allied.2.a: "進展不錯"
 AAT_norway_allied.3.t: "[FROM.GetName]不打算投資我國經濟"
 AAT_norway_allied.3.desc: "我們需要發展工業能力，加強國防，以防戰爭爆發。儘管我們付出了種種努力，[FROM.GetAdjective]當局還是不願意幫助我們發展工業能力。\n\n我們會將這件事謹記在心。"
 AAT_norway_allied.3.a: "我們只能另尋援手了"
 AAT_norway_allied.4.t: "拉克的替代人選"
 AAT_norway_allied.4.desc: "克里斯蒂安·拉克已在[NOR.GetAdjective]軍中服役多年，而且已經擔任總司令快十年了。他獲得委任時，世界還很太平，我國面臨的危機還未浮現。\n\n現在我們已經對他在戰時領導軍隊的能力失去了信心，必須替換掉他。但問題是，誰能帶領[NOR.GetName]的軍隊走向勝利呢？"
 AAT_norway_allied.4.a: "[NOR.NOR_carl_gustav_fleischer.GetName]是個大膽的選擇"
 AAT_norway_allied.4.b: "[NOR.NOR_wilhelm_von_tangen_hansteen.GetName]頗具潛力"
 AAT_norway_allied.4.c: "[NOR.NOR_otto_ruge.GetName]是個穩妥的選擇"
 AAT_norway_fascist.1.t: "[FROM.GetName]民族統一黨希望我們入侵他們的國家！"
 AAT_norway_fascist.1.desc: "一個與我們目的一致、由[FROM.GetAdjective]民族主義者和法西斯主義者組成的聯盟，願意幫助我們征服[NOR.GetName]。他們已經鋪好了路，隨時準備奪取政權並代表我們管理[FROM.GetAdjective]領土。\n\n如果這是真的，這真是個千載難逢的機會，但我們應該確保為出擊做好了所有準備。"
 AAT_norway_fascist.1.a: "[FROM.GetName]會加入我們！"
 AAT_norway_fascist.1.b: "我們才不會跟當地人合作"
 AAT_norway_fascist.2.t: "[FROM.GetNameDefCap]拒絕了我們！"
 AAT_norway_fascist.2.desc: "儘管我們提出了慷慨的提議，但[FROM.GetAdjective]已經表示，如果他們要入侵[ROOT.GetName]，不需要也不想要我們的幫助。這樣看來，我們只能依靠自己的力量奪取[ROOT.GetNameDef]政府。"
 AAT_norway_fascist.2.a: "他們會後悔的！"
 AAT_norway_fascist.3.t: "[FROM.GetNameDefCap]會幫助我們！"
 AAT_norway_fascist.3.desc: "[FROM.GetAdjective]法西斯黨派的代表已經與我們聯繫，並向我們保證[FROM.GetNameDef]將提供我們在奪取政權時所需的支持。\n\n這可能會讓我們從地下走到檯面上來，公開奪取[ROOT.GetName]的權力。"
 AAT_norway_fascist.3.a: "是時候了！"
 AAT_norway_fascist.5.a: "$AAT_norway_fascist.3.a$"
 AAT_norway_fascist.4.t: "我們的[NOR.GetAdjective]同僚請求我們提供支持"
 AAT_norway_fascist.4.desc: "法西斯主義在[NOR.GetName]的代表告訴我們，儘管他們的政府非常軟弱無能，但為了建立群眾的支持基礎和取得對[NOR.GetAdjective]政權的控制權，他們依然進行了艱苦的鬥爭。\n\n他們顯然需要我們的幫助來加強他們對國家的掌控，這樣在未來他們就可能成為我們有用盟友。"
 AAT_norway_fascist.4.a: "我們應該幫助我們的同僚法西斯。"
 AAT_norway_fascist.4.b: "我們得不到任何好處。"
 AAT_norway_fascist.6.t: "[FROM.GetNameDefCap]拒絕！"
 AAT_norway_fascist.6.desc: "[FROM.GetAdjective]法西斯主義黨派的代表給我們帶來了可怕的消息。[FROM.GetNameDefCap]拒絕了我們尋求援助的請求。\n\n這意味著我們必須靠自己的力量謀求在[ROOT.GetNonIdeologyName]建立一個由我們掌控的法西斯政權。"
 AAT_norway_fascist.6.a: "我們會找到出路！"
 AAT_norway_communist.1.t: "[FROM.GetName]希望重振波莫爾貿易！"
 AAT_norway_communist.1.desc: "早在我們實現革命的幾個世紀之前，俄羅斯北部的波莫爾人就在穿越巴倫支海，與坐落在極北的[NOR.GetAdjective]同志們進行重要的貿易往來。\n現在，該國建議我們恢復這一源遠流長的傳統。這必是互惠互利的，況且還能拉近共產主義國家之間的親密距離。"
 AAT_norway_communist.1.a: "巴倫支海這下可要航運繁忙了！"
 AAT_norway_communist.1.b: "貿易是資產階級觀念！"
 AAT_norway_communist.2.t: "新波莫爾貿易"
 AAT_norway_communist.2.desc: "一如祖先所為，[FROM.GetNameDef]的同志們渴望跨越極北的海洋與我國貿易。這個安排不可謂不互惠互利，況且還能向兩國工人階級展示，共產主義手足情能使堅冰消融。"
 AAT_norway_communist.2.a: "已經上路了！"
 AAT_norway_communist.3.t: "[FROM.GetName]拒絕我方貿易提案"
 AAT_norway_communist.3.desc: "儘管我們在巴倫支海上有著共同的貿易歷史，但[FROM.GetNameDef]認為這不值得恢復。我們應該嘗試其他途徑來開發兩國共享的極北汪洋。"
 AAT_norway_communist.3.a: "好吧……"
 AAT_norway_communist.4.t: "[FROM.GetName]希望我國協助其軍工建設"
 AAT_norway_communist.4.desc: "[FROM.GetName]同志需要我們的幫助。他們搞了革命，成了我們的戰友，因此我們支持他們努力實現軍隊現代化也是合情合理的。\n\n讓全世界人們看到，我國對共產主義同胞鼎力襄助，以[ROOT.GetNameDef]的建設經驗言傳身見，這也是一種政治勝利。"
 AAT_norway_communist.4.a: "武裝（他們）反抗（我們的）敵人！"
 AAT_norway_communist.4.b: "我們可不能犯險，讓我們以外的人得到武器"
 AAT_norway_communist.5.t: "[FROM.GetNameDefCap]接受了！"
 AAT_norway_communist.5.desc: "我們的同志接受了我方的卑微求助，現在他們要擴建我國軍工產業，以此來保衛我國的革命果實。"
 AAT_norway_communist.5.a: "用好我們的共同的武器，對付我們共同的敵人！"
 AAT_norway_communist.6.t: "[FROM.GetNameDefCap]拒絕我方求助！"
 AAT_norway_communist.6.desc: "看來他們對我們的信任被大大高估了。[FROM.GetName]不願幫助我們提高軍事生產。"
 AAT_norway_communist.6.a: "這些懦夫！"
 AAT_norway_communist.7.t: "挪威王室的隕落"
 AAT_norway_communist.7.desc: "[NOR.GetAdjective]王室曾是歐洲大陸最受敬仰的王室之一，但舊日風光已經一去不復返了。哈康國王從前堅持以全民公決的方式登上王位，並致力於善意的忽視——儘管這些都屬於高尚的追求，但君主制就是君主制，舊日王公在我們夢想的[ROOT.GetNonIdeologyName]平等社會中沒有一席之地。\n\n哈康七世國王、奧拉夫王儲以及其他王室成員已被逮捕，並被和平地送往國外。他們的財產被沒收後，將用於建設我們的共產主義藍圖。\n\n[NOR_GetExiledMonarchyLastParagraph]"
 NOR_exiled_monarchy_to_desc_DEN: "卡爾王儲將重新使用其丹麥名字，並由其兄長[DEN.GetName]國王弗雷德里克接收。在那裡，他將在丹麥社會中繼續履行王室成員職責。"
 NOR_exiled_monarchy_to_desc_ENG: "由於哈康前國王不再能返回故鄉[DEN.GetName]，他與其家人如今不得不流亡到[ENG.GetName]。這片土地上曾經舉辦過丹麥王儲卡爾和威爾士公主莫德的婚禮，這是國王與王后去往挪威前的名字。"
 NOR_exiled_monarchy_to_desc_SWE: "由於哈康國王和莫德王后的故鄉都遙遙無期，前王室被迫流亡到一個同情他們的君主制鄰國——挪威王室獲得獨立沒多久就要重新依附於瑞典王室，這對全世界而言都不失為一種諷刺。"
 NOR_exiled_monarchy_to_desc_NONE: "當今的世界已與1905年大相逕庭，尚且年輕的挪威君主制已經失去了可供統治的領土，亦無處可作流亡地i。舉目世界，已是君主制的黃昏。"
 AAT_norway_communist.7.a: "謝天謝地！"
 AAT_norway_communist.8.t: "挪威王室抵達"
 AAT_norway_communist.8.desc_DEN: "卡爾王儲，或者說哈康七世，離開故鄉經年，最後終於還是回到了[ROOT.GetName]。\n\n那是一場可怕的共產主義革命，他遭他的國家所廢黜並被流放，如今必須與其家人一同接受在我國的流亡生涯。"
 AAT_norway_communist.8.desc_ENG: "挪威王室一直與我們長期密切聯繫，彼時維多利亞女王陛下主持了其孫女莫德公主與丹麥王儲卡爾，即未來的哈康七世國王的婚禮。\n\n不幸的是，一場革命廢黜了他們。他們去不了丹麥，只能被迫在[ROOT.GetName]尋求庇護。"
 AAT_norway_communist.8.desc_SWE: "挪威王室無法前往其在丹麥和英國的親戚那裡避難，因此只能放棄自尊，來我們的屋簷下尋求庇護。\n\n儘管沒有血緣上的聯繫，但我們有責任捍衛斯堪的納維亞君主制免遭滅頂之災。"
 AAT_norway_communist.8.a: "歡迎他們來這裡！"
 AAT_norway_communist.8.b: "他們可以留下，但他們並不受歡迎。"
 AAT_norway_monarchist.1.t: "皇家內侍之諫"
 AAT_norway_monarchist.1.desc: "儘管哈康國王堅持維護大議會的獨立性，讓大議會自行解決內部問題，但其內侍彼澤·安克爾·韋德爾-亞爾斯貝格卻建議挪威王室介入這一危險的不穩定局勢。\n\n他以外國入侵的模糊威脅為由，呼籲全國各地的[ROOT.GetName]民眾用行動展現其對國王的信任，並要求旅行民眾對王上的效忠宣誓。\n\n他是國王最親密的心腹，也是[NOR.GetName]權貴中人脈最廣的大貴族，如此事態發展應引起我們的警惕。"
 AAT_norway_monarchist.1.a: "他的議程能是啥？"
 AAT_norway_monarchist.2.t: "國王已死！"
 AAT_norway_monarchist.2.desc: "難以想像的事情發生了。在一次滑雪事故後，我們親愛的國王哈康七世因醫療併發症去世，手術表面上似乎很成功。\n\n我們的國家正在經歷歷史上最黑暗的時期之一，讓我們希望奧拉夫王子儘快登上王位，帶領我們的國家走向安全的港灣。"
 AAT_norway_monarchist.2.a: "未來還會發生什麼悲劇？"
 AAT_norway_monarchist.3.t: "我們國家的繼承問題"
 AAT_norway_monarchist.3.desc: "我們的國家在哀悼敬愛的國王哈康七世，很明顯奧拉夫王子的注意力都集中在戰場上，即使不是，據報道他也心煩意亂，一心只想帶領我們的軍隊走向勝利。我們不禁要問，誰將帶領[NOR.GetNameDef]度過這個動盪的時代？至少我們可以感謝馬希斯·亞爾斯貝格的沉著手段。"
 AAT_norway_monarchist.3.a: "危急時刻需要非常規的措施"
 AAT_norway_monarchist.3.b: "我們不能惹事生非"
 AAT_norway_monarchist.4.t: "挪威女王瑪蒂爾德一世"
 AAT_norway_monarchist.4.desc: "我們可能永遠不會知道在皇宮裡發生了什麼，但挪威皇家政府宣佈，已故國王哈康的王后莫德王后將從現在起統治王國，取名瑪蒂爾德一世。這是特別不尋常的，因為奧拉夫王子是王位的下一任繼承人，但似乎他更喜歡這樣的安排，這樣他就可以繼續把注意力集中在戰爭上。此外，她畢竟是維多利亞女王的孫女，所以她只會跟隨那位女王的腳步，以及她祖國的繼承法。\n\n值得注意的是，在任何公開聲明中都沒有提到馬希斯·韋德-亞爾斯貝格的名字，他在新政權中的角色和下落都不得而知。"
 AAT_norway_monarchist.4.a: "瑪蒂爾德女王萬歲！"
 AAT_norway_monarchist.5.t: "攝政王的意圖"
 AAT_norway_monarchist.5.desc: "隨著新攝政王取代國王掌權，人們開始質疑他對國家的真正意圖。他是否希望長期取代哈康國王，還是隻是想幫助他進行統治？只有時間能揭示他的真正野心。"
 AAT_norway_monarchist.5.a: "亞爾斯貝格將作為真正的國王領導國家"
 AAT_norway_monarchist.5.b: "與鄰國保持良好關係必定是最好的選擇"
 AAT_norway_monarchist.5.c: "最終目標是恢復挪威昔日的榮耀！"
 illegitimate_norwegian_monarchy: "挪威王位上的非法君主"
 friendly_norwegian_monarchy: "我們的北歐兄弟"
 norwegian_imperial_ambitions: "挪威帝國的野心"
 Sweden_rearnament.1.t: "陸軍預算"
 Sweden_rearnament.1.desc: "地面部隊是我軍的主力，他們的任務是保護本國海岸、城市與邊疆不受侵犯。\n然而，維持陸軍所產生的高昂經濟成本，可能讓民眾不太能接受。"
 Sweden_rearnament.1.a: "裁軍"
 Sweden_rearnament.1.b: "削減預算"
 Sweden_rearnament.1.c: "維持預算"
 Sweden_rearnament.1.d: "提高預算"
 Sweden_rearnament.2.t: "空軍預算"
 Sweden_rearnament.2.desc: "專家和學者們認為，陸地、海洋和天空對於未來戰爭而言同等重要。這種新型戰爭已經得到了大國的越來越多的關注，並且肯定在任何未來的防禦中都至關重要。\n儘管這種戰爭形態是大勢所趨，但當面包變少時，在工廠裡幹活的普通工人會理解這一點嗎？"
 Sweden_rearnament.3.t: "海軍預算"
 Sweden_rearnament.3.desc: "幾個世紀以來，波羅的海沿岸諸國一直在爭奪海岸線的控制權，瑞典亦是如此。我國擁有綿延數千裡的海岸線，北起遙遠的極地，南至面向北大西洋的西部沿海。\n然而，我們目前正面臨雙重威脅：北方列寧格勒的紅軍海軍，以及南方納粹德國的海上力量。\n為了確保邊防安全，建立一支強大的海軍勢在必行。但打造大型金屬艦船所需的開支十分巨大，因此我們必須慎重規劃預算，統籌兼顧。"
 Sweden_rearnament.4.t: "軍備重整委員會目前正在開會"
 Sweden_rearnament.4.desc: "按照你的要求，我們將會提醒你下次軍備重整委員會開會的時間。這個時間就是現在，我們有機會制定明年的軍備政策。\n我們需要保持思路專注清晰，畢竟這將在可見的未來內鎖定我們的方案。同時世界也在走向一個轉折點。"
 Sweden_rearnament.4.desc.a: "的確很清晰"
 Sweden_rearnament_delta_low: "效果變化：[?folkhemmet_air_part_delta_low_tooltip]"
 Sweden_rearnament_delta_medium: "效果變化：[?folkhemmet_air_part_delta_medium_tooltip]"
 army_budget_event_active: "陸軍預算委員會已啟用"
 air_budget_event_active: "空軍預算委員會已啟用"
 navy_budget_event_active: "海軍預算委員會已啟用"
 AAT_Sweden.1.t: "政府委員會推薦重整軍備"
 AAT_Sweden.1.desc: "1930年，瑞典政府任命了一個議會調查委員會，以為未來的國防開支提供指導。農民黨與溫和派一起推動增加國防開支，而社會民主黨的首相佩爾·阿爾賓·漢森則強烈反對，稱此舉將破壞他對社會改革的願景。\n在來自鄰國越來越多的威脅性言論中，調查組現在堅定地站在右傾政黨一邊，指出“疏於國防將損害國家和人民的利益”。\n\n這造成了政府危機，佩爾·阿爾賓·漢森威脅要辭職，直到他在即將到來的1936年選舉中鞏固其主張。\n在此期間，我們應該任命領導者，直到即將到來的選舉。"
 AAT_Sweden.1.a: "農民黨是最好的選擇"
 AAT_Sweden.1.c: "顯然得讓右翼反對黨來"
 AAT_Sweden.1.b: "佩爾·阿爾賓沒有理由辭職"
 AAT_Sweden.1.b_tt: "§R這將產生負面的政治影響。§!"
 AAT_Sweden.2.t: "不信任投票"
 AAT_Sweden.2.desc: "佩爾·阿爾賓拒絕在預算問題上讓步，農民黨和溫和派組成的聯盟決定對首相進行不信任投票。\n\n隨著兩派結盟，佩爾·阿爾賓別無選擇，只能辭去首相一職。首相職位的空缺使得政府陷入危機，沒有一個政黨擁有足夠上臺的政治影響力。\n\n國王本人對接踵而來的混亂局面表態反對，這對一個沒有正式政治權力的君主來說實在是過於不同尋常。"
 AAT_Sweden.2.a: "這將如何收場？"
 AAT_Sweden.3.a: "佩爾·阿爾賓·漢森是受到了人民愛戴的首相"
 AAT_Sweden.3.b: "[AAT_Sweden_3_b_loc]"
 AAT_Sweden.3.axel_is_leader: "阿克塞爾一直都幹得不錯，讓他繼續幹吧"
 AAT_Sweden.3.axel_is_not_leader: "應該給農民黨一個機會"
 AAT_Sweden.3.c: "[AAT_Sweden_3_c_loc]"
 AAT_Sweden.3.bagge_is_leader: "顯然巴格將帶領我們走向未來"
 AAT_Sweden.3.bagge_is_not_leader: "還是溫和派吧，在這個艱難的時刻需要新的領導"
 AAT_Sweden.3.d: "佩爾·阿爾賓搞出的亂子，社民黨得用維格弗斯換掉他"
 AAT_Sweden.3.t: "1936年瑞典大選"
 AAT_Sweden.3.desc: "今天，[ROOT.GetNameDef]各地的民眾齊聚一堂，在全國選舉中投票。預計社會民主黨將捲土重來，因為預測表明，他們能在國會中拿到不少席位。\n然而，農民聯盟和右翼黨都希望爆出些意想不到的猛料，以使兩者之一能踏入權力中央。但是，在這樣一個如此不穩定的社會局勢中，任何邊緣派系都有可能分得一杯羹——一切皆有可能。"
 AAT_Sweden.4.t: "政客稱其對手“無能到令人尷尬”"
 AAT_Sweden.4.desc: "今天在國會的一場辯論因爭論的主題從誰該接任首相轉移到了人身攻擊而變得焦灼。在辯論中卡爾·舍布盧姆朝格倫·韋內喊道“你唯一擅長做的事就是遛你的狗”。\n\n韋內的一位發言人澄清說他從未養過狗。"
 AAT_Sweden.4.a: "希望我們可以儘快找到一名首相"
 AAT_Sweden.5.t: "被發現藏在灌木叢中的政客"
 AAT_Sweden.5.desc: "倫納特·揚松今天被發現藏在國會大廈附近的一簇灌木叢中。他在被發現時堅稱自己不是在躲藏，而是在欣賞一隻特別漂亮的瓢蟲，然後便匆匆曳步走進了國會大廈。\n有猜測稱他的確是藏在灌木叢中，試圖避開幾秒前剛進入大廈的政治對手，以免其又藉機對首相說長論短。"
 AAT_Sweden.5.a: "這太愚蠢了"
 AAT_Sweden.6.t: "嗦湯醜聞"
 AAT_Sweden.6.desc: "在其他政客就選舉新首相一事發言時，阿格達·索爾普“非常大聲”地啜飲湯汁，迫使議長呼籲制定限制在國會內進食的新規。議長稱此舉是在“故意分散注意力”，但索爾普夫人卻辯稱，由於近期辯論持續時間實在過長，正常時間內根本沒有足夠吃午飯的時間。"
 AAT_Sweden.6.a: "禁止索某人嗦湯！"
 AAT_Sweden.7.t: "十二人在國會前被逮捕"
 AAT_Sweden.7.desc: "今天有12人在國會外被捕，顯然是想強行進入國會。當警察逮捕他們時，他們說自己只是想迫使一個決議更快地通過，並聲稱他們所依賴的社會服務已經在政治動盪中消失了。\n他們在大廳裡被人攔住，因為其中的一位，裡卡德·佩爾松，因非法走私菸草而在被警方通緝。而佩爾松在使用公共廁所的時候，被一名警官認出隨後被逮捕。\n佩爾松預計將被判處2年監禁，其餘11人將被判處最多6個月監禁和輕度罰款。"
 AAT_Sweden.7.a: "天哪"
 AAT_Sweden.8.t: "在國會前遭逮捕的11人獲釋"
 AAT_Sweden.8.desc: "今天，一度試圖衝擊國會的11人從拘留中釋放，還有一人因為被控走私仍然在羈押中。"
 AAT_Sweden.8.a: "希望這些流浪漢能夠洗心革面"
 AAT_Sweden.9.t: "菸草走私犯重新做人"
 AAT_Sweden.9.desc: "裡卡德·佩爾松，在夥同另外十一人試圖衝擊國會時遭到逮捕，爾後因走私菸草被判處有期徒刑兩年。此前我們對他進行了追蹤報道，而現在令人高興的是，他在刑滿釋放之後決定洗心革面，並立即加入了海軍。\n司令部的高層發掘了這位年富力強、幹勁滿滿的年輕人。出於工作努力和富有才幹等原因，他榮獲了晉升。"
 AAT_Sweden.9.a: "真是令人鼓舞的故事"
 AAT_Sweden.10.t: "赫爾曼·埃裡克松遞交辭呈"
 AAT_Sweden.10.desc: "今日，赫爾曼·埃裡克松遞交了辭呈，表示希望在退休後出任紅酒與烈酒有限公司的首席執行官一職。\n儘管政府仍然用得著他，但轉任到國有酒類生產商的首席執行官或也能有其他的好處。"
 AAT_Sweden.10.a: "政府仍然需要他"
 AAT_Sweden.10.b: "讓他走吧"
 AAT_Sweden.11.t: "[GER.GetNameDef]工人奪取了蘭斯韋克工廠的控制權"
 AAT_Sweden.11.desc: "在[SWE.GetNameDef]和[GER.GetNameDef]之間爆發敵對行動後，德國人員成功地暫時奪取了蘭斯韋克工廠，將自己封鎖在綜合大樓內。雖然軍方預計會在適當的時候奪取綜合大樓的控制權，但預計在小規模衝突中會有一些損失，因此這些工廠在一段時間內不會完全投入運營。\n對於位於德國本土的蘭斯韋克工廠，人們知之甚少，但瑞典當局毫不懷疑它們會被[GER.GetNameDef]政府查封作為報復。"
 AAT_Sweden.11.a: "也許讓[GER.GetNameDef]擁有軍事基地並不是個好主意。"
 AAT_Sweden.12.t: "[?ROOT.GetLeader]死於心臟病發作"
 AAT_Sweden.12.desc: "今天，[?SWE.bus_capture_tag.GetAdjective]當局廣播了[?SWE.GetLeader]被捕後死亡的消息。他們聲稱，[?SWE.bus_capture_tag.GetAdjective]突擊隊已經成功地部分包圍了被困在前線附近的總理移動司令部。\n突擊隊員聲稱，接觸到[?SWE.GetLeader]和他的工作人員被困的巴士時，首相在離開車輛的時候似乎搖搖晃晃，跌倒在地上。儘管敵對行動持續不斷，[?SWE.bus_capture_tag.GetAdjective]當局還是慷慨地將已故首相的遺體送回以進行國葬。屍檢結果顯示首相是在心臟病發作後心髒驟停。\n儘管隨後出現了混亂，但在舉行適當的選舉之前，塔格·埃蘭德成為緊急總理接管了控制權。"
 AAT_Sweden.12.a: "真是悲劇"
 AAT_Sweden.13.t: "[SWE.GetNameDefCap]要求對北挪威的控制權"
 AAT_Sweden.13.desc: "瑞典政府已經要求對納爾維克周圍的地區的控制權。他們聲稱，這只是出於人道主義考慮，是為了保護挪威人民不受當前衝突的影響。作為安全保障，他們提出將該地區保持非軍事化，並在衝突結束前進行任何必要的治安活動。\n在瑞典的管轄裡，挪威人民可能會更高興，從而為我們在前線的部隊騰出更多資源。"
 AAT_Sweden.13.a: "聽起來是個不錯的方案"
 AAT_Sweden.13.b: "一切屬於[THIS.GetNameDef]"
 AAT_Sweden.13.tt: "§R[SWE.GetName]可能會升級為戰爭。§!"
 AAT_Sweden.14.t: "[FROM.GetNameDefCap]屈服了"
 AAT_Sweden.14.desc: "[FROM.GetNameDefCap]已經接受我方關於在納爾維克附近建立非軍事區的提議。該國部隊業已全部撤出當地，而我國現在宣佈該地區為非軍事區。我們希望[NOR.GetAdjective]政府能在戰後要求歸還這片領土，但當下得由我們來保證[NOR.GetAdjective]民眾的安全。"
 AAT_Sweden.14.a: "先從輸送救濟援助開始"
 AAT_Sweden.14.a_tt: "§Y[NOR.GetNameDefCap]將在戰後要求歸還領土。§!"
 AAT_Sweden.15.t: "[FROM.GetNameDefCap]拒絕了我方提議"
 AAT_Sweden.15.desc: "[FROM.GetNameDefCap]已經拒絕了我們關於在納爾維克附近建立非軍事區的提議。我們需要決定如何回應，要麼在堅持特區有利於北歐同胞一事上一路走到底，要麼忍痛將當地民眾拋棄於黑暗之中。"
 AAT_Sweden.15.a: "這件事不值得拿我們的國家去冒險"
 AAT_Sweden.15.b: "我們不能拋棄[NOR.GetName]"
 AAT_Sweden.15.a_tt: "§Y如果他們拒絕，將產生一個針對[FROM.GetNameDef]的戰爭目標§!"
 AAT_Sweden.16.t: "[SWE.GetNameDef]威脅要對納爾維克進行敵對行動"
 AAT_Sweden.16.desc: "在我們拒絕交出納爾維克附近區域後，[SWE.GetAdjective]政府毫不含糊地發出了威脅，稱如果我們拒絕交出[NOR.GetAdjective]北部領土，兩國間將爆發敵對行動。"
 AAT_Sweden.16.a: "我們擔不起更多敵人的風險。"
 AAT_Sweden.16.b: "讓他們放馬過來"
 AAT_Sweden.17.t: "[FROM.GetNameDefCap]堅持拒絕交出納爾維克"
 AAT_Sweden.17.desc: "儘管我們威脅要對納爾維克採取敵對行動，[FROM.GetName]仍然拒絕屈服於我們的要求。我們不能也不會讓[NOR.GetAdjective]人民在非人道的條件下被當作牲口對待。我們必須保護[NOR.GetAdjective]港口，切斷入侵軍隊的後路，解放[NOR.GetAdjective]人民。"
 AAT_Sweden.17.a: "[FROM.GetName]，現在你犯了個大錯。"
 AAT_Sweden.18.t: "[NOR.GetName]請求歸還納爾維克"
 AAT_Sweden.18.desc: "重建後的[NOR.GetAdjective]政府請求我方歸還納爾維克及其附近領土，我方在此前的戰爭期間保護了當地公民。他們在公報中對我國政府在戰時所為深表謝意，並期待著雙方的進一步合作。該國還打算舉行慶祝儀式，以表彰在戰爭的黑夜中守望[NOR.GetAdjective]獨立的人們。"
 AAT_Sweden.18.a: "當然，納爾維克屬於[NOR.GetName]"
 AAT_Sweden.18.b: "納爾維克應該作為我們努力付出的補償"
 AAT_Sweden.19.t: "[SWE.GetNameDefCap]歸還納爾維克"
 AAT_Sweden.19.desc: "這是陽光明媚的一天，[Nor.GetName]終於再次統一了。[SWE.GetName]慷慨地接受了我方請求，將戰時受[SWE.GetAdjective]保護的納爾維克歸還給我國。我國決定向[SWE.GetAdjective]政府表示最真摯的感激之情，這預示著兩國間更深層次的聯繫將持續一整個時代。"
 AAT_Sweden.19.a: "挪威再次完整了"
 AAT_Sweden.19_tt: "§Y[ROOT.GetNameDefCap]§!可以為§Y戰地軍官§!授予§Y挪威國防榮譽勳章§!"
 AAT_Sweden.20.t: "[SWE.GetNameDefCap]拒絕歸還納爾維克"
 AAT_Sweden.20.desc: "在戰爭期間，[SWE.GetNameDef]藉口“拯救挪威人民以免其領土受到更糟糕的佔領”，大膽地佔領了我們國家的部分領土。這被證明只是[SWE.GetAdjective]政府擴張自己領土野心的伎倆，因為他們拒絕歸還佔領的領土，理由是“戰後全球面臨的動盪和社會穩定問題”。我們看透了這一切，顯然這就是投機行為，是明目張膽地威脅我們國家自由和完整的行為。納爾維克是挪威的，如果需要，我們將用武力維護它。"
 AAT_Sweden.20.a: "那麼，只有戰爭了"
 AAT_Sweden.21.t: "[FROM.GetName]邀請我國加入$scandinavian_defense_union$"
 AAT_Sweden.21.desc: "鑑於戰後勝利國之間的緊張局勢，[FROM.GetName]認為我們不應該回到孤立中立的失敗政策，相反，我們應該協調整個地區的軍事和外交政策，以便更好地防範未來的侵略。"
 AAT_Sweden.21.a: "這份提案與我國利益不符"
 AAT_Sweden.21.b: "非常棒的提案"
 AAT_Sweden.22.t: "[FROM.GetName]拒絕防衛聯盟提案"
 AAT_Sweden.22.desc: "[FROM.GetAdjective]的外交官今天通知我們，他們的政府不希望繼續加入$scandinavian_defense_union$。他們認為，至少在目前，他們的利益在這樣的組織之外會得到更好的滿足。"
 AAT_Sweden.22.a: "令人失望"
 AAT_Sweden.23.t: "[FROM.GetName]請求加入同盟"
 AAT_Sweden.23.desc: "[FROM.GetName]對戰後戰勝國之間一觸即發的緊張局勢憂心忡忡，因而請求加入我們的聯盟。一旦事成，我們就可以擴大在[FROM.GetName]地區的影響力，但若地區衝突升級，我們也不得不去履行保衛該國的承諾。"
 AAT_Sweden.23.a: "他們對我們整體的安全會是個累贅"
 AAT_Sweden.23.b: "我們很樂意他們加入我們"
 AAT_Sweden.24.t: "[FROM.GetName]拒絕我方加入聯盟"
 AAT_Sweden.24.desc: "[FROM.GetName]暫時拒絕了我們加入他們聯盟的請求。他們表示出了擔憂，認為此時此刻擴大聯盟可能會捲入更多的衝突。目前看來，我們似乎只能靠自己了。"
 AAT_Sweden.24.a: "令人失望"
 AAT_Sweden.25.t: "投資特種部隊"
 AAT_Sweden.25.desc: "軍方高層就如何為新成立的特種部隊劃撥經費一事展開了無數次討論，此事的進展目前已經陷入停滯。打破僵局的唯一辦法是政府介入並對其中一項提議予以支持。"
 AAT_Sweden.25.a: "考慮到地形，遊騎兵最有效"
 AAT_Sweden.25.b: "海軍陸戰隊可以幫助我們掌控波羅的海"
 AAT_Sweden.25.c: "空降兵才是萬金油"
 AAT_Sweden.26.t: "[?195.GetName]失守"
 AAT_Sweden.26.desc: "難以想像的事情發生了。我們的部隊失去了對[195.GetnameDef]的控制，這是俄羅斯人民的一個重要的紀念地，現在落入了敵人手中。這不僅是戰略上的損失，而且是對我們民族驕傲和軍隊的士氣巨大的損失。普通士兵的士氣已經顯著下降，叛逃的聲音不絕於耳；如果我們繼續這場戰爭，我們就不得不用那些不再相信自己的生命值得浪費在一場徒勞的戰爭上的士兵來進行了。"
 AAT_Sweden.26.a: "我們必須求和"
 AAT_Sweden.26.b: "我們承受不了這樣尷尬的局面"
 AAT_Sweden.27.t: "[SOV.GetNameDefCap]放棄對[?146.GetName]的主張"
 AAT_Sweden.27.desc: "我們的聯盟佔領[?146.GetName]之後，對紅軍造成了巨大的打擊，以至於莫斯科不得不重新考慮他們的侵略行為。他們同意停戰並承諾不再進一步索取宣稱。在斯德哥爾摩和赫爾辛基，人們感到非常欣喜，誰能想到這隻紅色巨熊是紙糊的呢？"
 AAT_Sweden.27.a: "這必將提高軍隊的士氣。"
 AAT_Sweden.28.t: "[SWE.GetNameDefCap]要求歸還失地"
 AAT_Sweden.28.desc: "考慮到[SWE.GetLeader]的言論越來越具有帝國主義傾向，如今我們對[SWE.GetLeader.GetSheHe]開始索要往日殖民帝國的領土一事竟也不是那麼意外。這類主張顯然早就過了保質期，最多也只能算虛張聲勢——但在衝突時刻，我們承受不了失去盟友的後果——也許作出善意的姿態，會讓他們的領導人高興一下？"
 AAT_Sweden.28.a: "絕對不行"
 AAT_Sweden.28.b: "這就是為盟友付出的代價"
 AAT_Sweden.29.t: "[FROM.GetNameDefCap]拒絕交出領土"
 AAT_Sweden.29.desc: "[FROM.GetNameDefCap]拒絕我方有關交還舊殖民地的請求，他們認為這種主張與現代地緣政治過於脫節，並且除了這種直白的拒絕，其他的行為都會讓這場鬧劇僵持太久。"
 AAT_Sweden.29.a: "給他們點顏色看看"
 AAT_Sweden.30.t: "[FROM.GetNameDefCap]交出殖民地"
 AAT_Sweden.30.desc: "[FROM.GetNameDefCap]已經接受我方請求，現正在移交我們的舊殖民地。這讓我國政府感到非常驚訝，畢竟他們準備了好久的如何應對推辭。這在我國新獲領土上引起了不小的抗議，但隨著時間的推移，這肯定會平息下來。"
 AAT_Sweden.30.a: "這就是弄拙成巧吧"
 AAT_Sweden.31.t: "[FROM.GetNameDefCap]要求獲得博恩霍爾姆"
 AAT_Sweden.31.desc: "[FROM.GetAdjective]大使遞交了一份嚴肅的信息，要求我方把博恩霍爾姆島還給他們。對方聲稱，該島從未合法移交給[DEN.GetName]，因為這一事件發生於一場叛亂之中。由於他們說的是17世紀的事情，所以這顯然是[FROM.GetAdjective]擴張主義意圖打個幌子的小藉口罷了。"
 AAT_Sweden.31.a: "我們承擔不起與[FROM.GetName]開戰的後果"
 AAT_Sweden.31.a_tt: "§R這可能最終導致我國成為[FROM.GetName]的傀儡§!"
 AAT_Sweden.31.b: "笑死大牙了"
 AAT_Sweden.32.t: "[FROM.GetName]放棄博恩霍爾姆"
 AAT_Sweden.32.desc: "[FROM.GetNameDefCap]已經知會我方，稱其不會對我國針對博恩霍爾姆島的領土主張上提出異議。但他們也警告我們，這是一個前所未有的舉動，將威脅到北歐的穩定。"
 AAT_Sweden.32.a: "真他媽是史無前例"
 AAT_Sweden.33.t: "[FROM.GetName]拒絕放棄博恩霍爾姆"
 AAT_Sweden.33.desc: "[FROM.GetAdjective]政府知會我方，稱其不會接受我們對博恩霍爾姆島的領土主張，並表示我國假裝的主張在幾個世紀前就已經失效了。如果他們拒絕交出爭議地區，我們就不得不訴諸武力，正如我們幾個世紀前那樣。"
 AAT_Sweden.33.a: "我們將再一次穿越海峽"
 AAT_Sweden.34.t: "[FROM.GetName]要求自治領土"
 AAT_Sweden.34.desc: "[FROM.GetAdjective]大使告訴我們，[SWE.GetAdjective]政府認為，隨著國際秩序的重新定義，[THIS.GetAdjective]政府不再有能力完整地保護其海外領土。如果[THIS.GetName]無法妥善保衛其領土，其政府應該將其割讓給能夠保護的一方；而[FROM.GetAdjective]將是首選。"
 AAT_Sweden.34.a: "我們別無選擇"
 AAT_Sweden.34.a_tt: "§R這可能最終導致我國成為[FROM.GetName]的傀儡§!"
 AAT_Sweden.34.b: "這讓我們無法接受。"
 AAT_Sweden.35.t: "[FROM.GetName]交出了[DEN.GetAdjective]海外領土"
 AAT_Sweden.35.desc: "[FROM.GetName]已經勉強決定交出其自治領土。這無疑將損害我們與[FROM.GetName]的關係，但從長遠來看，這並不重要，因為他們很快就會被納入我們的勢力範圍。"
 AAT_Sweden.35.a: "太好了"
 AAT_Sweden.36.t: "[FROM.GetName]拒絕交出[DEN.GetAdjective]海外領土"
 AAT_Sweden.36.desc: "[FROM.GetName]已經通知我們，它不會接受我們對世界新秩序的設想。儘管我們堅持要求，但[FROM.GetAdjective]政府固執地拒絕歸還我們的合法領土。"
 AAT_Sweden.36.a: "那我們將用武力奪取它。"
 AAT_Sweden.37.t: "[DEN.GetName]的命運"
 AAT_Sweden.37.desc: "[DEN.GetAdjective]政府已經如此脆弱，以至於我們集中力量時，無法有效抵禦我國對其的掌控。曾經，我們被丹麥人騎在頭上，而如今風水輪流轉，他們成了我們的附屬國。在遞交最後通牒前，我們只需要決定如何處置該國。"
 AAT_Sweden.37.a: "他們要成為我國的緩衝區"
 AAT_Sweden.37.b: "$AAT_Sweden.37.a$"
 AAT_Sweden.38.t: "[FROM.GetName]準備傀儡[DEN.GetName]"
 AAT_Sweden.38.desc: "在一次史無前例的行動中，[FROM.GetName]要求我國政府將所有職能和機構移交給他們。我們的國家元首曾向他們的大使提出了強烈的抗議，結果[SWE.GetAdjective]的戰艦在離哥本哈根不遠的地方被目視到。[DEN.GetAdjective]政府無力應對這樣的威脅，6小時後正式簽署了投降書。"
 AAT_Sweden.38.a: "媽蛋。"
 AAT_Sweden.39.t: "$AAT_Sweden.38.t$"
 AAT_Sweden.39.desc: "在一次史無前例的行動中，[FROM.GetName]要求我們的政府將其所有的職能和機構都移交給他們。現在很清楚了，[FROM.GetAdjective]政府不是在試圖幫助我們，而是一直在削弱我們的領土的完整性，直到他們覺得可以對我們進行徹底的控制。"
 AAT_Sweden.39.a: "他們別想再次越過我們的冰封國界！"
 AAT_Sweden.39.b: "$AAT_Sweden.38.a$"
 AAT_Sweden.40.t: "[FROM.GetName]要求[145.GetName]"
 AAT_Sweden.40.desc: "正如他們在1919年所做的那樣，[FROM.GetAdjective]政府再次在奧蘭群島問題上大打出手。儘管國際聯盟裁定將該島的主權歸還給了我們，但[FROM.GetName]似乎無法放手不管。也許他們認為我們處於弱勢地位，而且隨著國際聯盟的瓦解，他們嗅到了其中的機會；他們是刻意的投機主義者。"
 AAT_Sweden.40.a: "我們無力抵抗[FROM.GetName]。"
 AAT_Sweden.40.b: "我們永遠不會割讓它們。"
 AAT_Sweden.41.t: "[FROM.GetName]屈服！"
 AAT_Sweden.41.desc: "[FROM.GetName]已經屈服，將奧蘭群島割讓給了我們。過去的不公終得匡正，它應有的狀態也得以恢復。"
 AAT_Sweden.41.a: "太好了"
 AAT_Sweden.42.t: "[FROM.GetName]拒絕割讓[145.GetName]"
 AAT_Sweden.42.desc: "[FROM.GetName]通知我們，它堅決拒絕割讓[145.GetName]，稱此事已由國際聯盟解決。顯然，[FROM.GetName]高估了他們擁有的影響力。我們應該讓[FROM.GetName]意識到他們的錯誤。"
 AAT_Sweden.42.a: "它將再次屬於我們。"
 AAT_Sweden.43.t: "[FROM.GetName]要求[148.GetName]去軍事化"
 AAT_Sweden.43.desc: "[FROM.GetName]要求我們在北部邊境進行非軍事化。他們擔心會對他們的採礦業造成威脅，同時強調任何可預見的威脅可能來自東方，而不是西方。這可能會降低[FROM.GetName]與我們之間自從奧蘭危機以來一直在上升的緊張關係。"
 AAT_Sweden.43.a: "一個小的舉動可能會緩解緊張的局勢。"
 AAT_Sweden.43.b: "這會侵犯我們的主權。"
 AAT_Sweden.44.t: "[FROM.GetName]同意[148.GetName]去軍事化"
 AAT_Sweden.44.desc: "作為友善的象徵，[FROM.GetName]同意對[148.GetName]進行非軍事化。這對我們恢復東方王國來說是一個巨大的里程碑，我們對[FROM.GetName]的影響力逐漸增長。"
 AAT_Sweden.44.a: "正如計劃的那樣。"
 AAT_Sweden.45.t: "[FROM.GetName]拒絕[148.GetName]去軍事化"
 AAT_Sweden.45.desc: "[FROM.GetName]拒絕將[148.GetName]去軍事化，稱我們沒有管轄權來決定[FROM.GetName]在其邊界內的行為。這意味著他們正在積極謀劃反對我們？當務之急是我們要先下手為強。"
 AAT_Sweden.45.a: "同謀？"
 AAT_Sweden.46.t: "[FIN.GetName]的問題"
 AAT_Sweden.46.desc: "很明顯，[FIN.GetName]無法抵擋[SOV.GetAdjective]的威脅。芬蘭人談論他們的主權，卻無法意識到他們所認為的獨立並非由任何政治或軍事力量賦予的，而是源於俄羅斯內戰的混亂的結果。自那一天起，時鐘就一直在倒計時，很快就會歸零，舊的敵人將再次起身。因此，我們必須在[SOV.GetAdjective]之前在[FIN.GetAdjective]事務上掌控權力。"
 AAT_Sweden.46.a: "操控他們。"
 AAT_Sweden.46.b: "$AAT_Sweden.46.a$"
 AAT_Sweden.47.t: "[FROM.GetName]決定傀儡我國"
 AAT_Sweden.47.desc: "很明顯，我們的鄰國對其安全的“擔憂”都是一種詭計。我們的軍隊失去意志和戰略優勢，沒有根據新的現實地理情況進行組織。我們的首都外出現了[FROM.GetAdjective]的戰艦被襲擊的情況，[FROM.GetAdjective]部隊已經越過了北部的非軍事區，而且我們還收到了投降的最後通牒。國際社會已經拋棄了我們。"
 AAT_Sweden.47.a: "希望我們的新統治者能夠寬宏大量。"
 AAT_Sweden.48.t: "$AAT_Sweden.47.t$"
 AAT_Sweden.48.desc: "很顯然我們鄰國“擔憂”他們的安全只是一個計謀。[FROM.GetName]政府現在要求我們與他們結盟，抵抗從東邊過來的敵人。我們拒絕他們的要求會再次被牢牢地置於[FROM.GetAdjective]的包圍之中，逐漸失去我們的獨立性。可問題是，替代方案是否更糟糕？"
 AAT_Sweden.48.a: "我們的命運再也不會由別人來決定了。"
 AAT_Sweden.48.b: "$AAT_Sweden.47.a$"
 AAT_Sweden.49.t: "[FROM.GetName]拒絕屈服"
 AAT_Sweden.49.desc: "[FROM.GetName]拒絕了我們的要求，完完全全地拒絕。這是公然無視我們的關切，同時威脅到我們的採礦業務。我們只能做出一個回應。"
 AAT_Sweden.49.a: "當外交手段失敗時……"
 AAT_Sweden.50.t: "[SWE.GetName]要求[144.GetName]"
 AAT_Sweden.50.desc: "[SWE.GetName]要求對港口或納爾維克進行全面控制。他們的政府之所以這樣說，是因為擔心對手會在納爾維克登陸並攻擊瑞典的鐵礦石礦山。分歧可能導致衝突的進一步升級。"
 AAT_Sweden.50.a: "這不值得為之戰鬥。"
 AAT_Sweden.50.b: "這太荒謬了。"
 AAT_Sweden.50.a_tt: "§R這可能最終導致我國成為[SWE.GetName]的傀儡§!"
 AAT_Sweden.51.t: "[FROM.GetName]屈服"
 AAT_Sweden.51.desc: "[FROM.GetName]已經屈服了，決定將納爾維克割讓給我們。這確保了來自耶利瓦勒和基律納的鐵礦石供應，同時也削弱了[FROM.GetName]的國力。"
 AAT_Sweden.51.a: "好極了。"
 AAT_Sweden.52.t: "$AAT_Sweden.49.t$"
 AAT_Sweden.52.desc: "$AAT_Sweden.49.desc$"
 AAT_Sweden.52.a: "$AAT_Sweden.49.a$"
 AAT_Sweden.53.t: "[NOR.GetName]的問題"
 AAT_Sweden.53.desc: "[SWE.GetAdjective]政府毫無理由地要求我們解散軍隊並與一個新的北歐國家結盟。雖然他們聲稱這是一個合作計劃，但很明顯誰是附屬國，誰是主權國。這實際上是回到了以前的聯盟時代。"
 AAT_Sweden.53.a: "絕不！武裝起來。"
 AAT_Sweden.53.b: "我們沒有力量去抵抗。"
 AAT_Sweden_ball_bearing.1.t: "為[FROM.FROM.GetName]設置滾珠軸承的交易條件"
 AAT_Sweden_ball_bearing.1.desc: "我們的滾珠軸承是頂級的，並且被全世界的大國強權爭相用於他們的戰爭機器。我們正在與[FROM.GetName]就交易這一寶貴的物資進行談判，但首先我們必須決定以什麼作為回報。"
 AAT_Sweden_ball_bearing.1.a: "我們需要保證充足的食物"
 AAT_Sweden_ball_bearing.1.a_tt: "\n$we_will_gain_tt$\n  穩定度：§G+2%§!\n  每週人力：§G+15§!。\n該修正可以疊加。"
 AAT_Sweden_ball_bearing.1.b: "我們需要他們的軍事專長"
 AAT_Sweden_ball_bearing.1.c: "要求知識共享"
 AAT_Sweden_ball_bearing.1.c_tt: "\n如果接受，[SWE.GetNameDef]將可以在用於§Y艦艇§!、§Y雷達§!、§Y合成資源§!或§Y支援科技§!的§G+25%§!研究加成中選擇一個。"
 AAT_Sweden_ball_bearing.1.d: "暫時停止談判"
 AAT_Sweden_ball_bearing.2.t: "[SWE.GetNameDefCap]要求用食品換滾珠軸承"
 AAT_Sweden_ball_bearing.2.desc: "[SWE.GetNameDefCap]請求用他們寶貴的滾珠軸承來換取糧食進口，這正好是我們進行戰爭所需的關鍵資源之一。[SWE.GetAdjective]政府似乎在尋求在未來可能發生的衝突中確保這一重要進口的方法，因為他們在世界大戰期間受到的封鎖曾造成嚴重問題。"
 AAT_Sweden_ball_bearing.2.a: "一個互惠貿易。"
 AAT_Sweden_ball_bearing.2.b: "我們承擔不起。"
 AAT_Sweden_ball_bearing.3.t: "[SWE.GetNameDefCap]要求用軍事專家換滾珠軸承"
 AAT_Sweden_ball_bearing.3.desc: "[SWE.GetNameDefCap]請求用他們寶貴的滾珠軸承換取我們的軍事知識，這正好是我們進行戰爭所需的關鍵資源之一。[SWE.GetAdjective]政府似乎在尋求在未來可能的衝突中與歐洲先進軍事大國公平對決的方法。"
 AAT_Sweden_ball_bearing.3.a: "$AAT_Sweden_ball_bearing.2.a$"
 AAT_Sweden_ball_bearing.3.b: "$AAT_Sweden_ball_bearing.2.b$"
 AAT_Sweden_ball_bearing.4.t: "[SWE.GetNameDefCap]要求用知識分享換滾珠軸承"
 AAT_Sweden_ball_bearing.4.desc: "[SWE.GetNameDefCap]請求用他們寶貴的滾珠軸承換取我們的科學知識與進展，這正好是我們進行戰爭所需的關鍵資源之一。[SWE.GetAdjective]政府似乎在尋求通過科學進步在潛在的衝突中佔上風的方法，而我們肯定有能力在這方面幫助他們。"
 AAT_Sweden_ball_bearing.4.a: "$AAT_Sweden_ball_bearing.2.a$"
 AAT_Sweden_ball_bearing.4.b: "$AAT_Sweden_ball_bearing.2.b$"
 AAT_Sweden_ball_bearing.5.t: "[FROM.GetNameDefCap]接受了滾珠軸承貿易"
 AAT_Sweden_ball_bearing.5.desc: "$AAT_Sweden.25.desc$\n我們現在需要決定增進對哪一類技術的瞭解，以平衡我們與其他大國之間的差異。"
 AAT_Sweden_ball_bearing.5.a: "支援科技"
 AAT_Sweden_ball_bearing.5.b: "雷達科技"
 AAT_Sweden_ball_bearing.5.c: "合成油科技"
 AAT_Sweden_ball_bearing.5.d: "艦艇科技"
 AAT_Sweden_ball_bearing.6.t: "[FROM.GetNameDefCap]接受了滾珠軸承貿易"
 AAT_Sweden_ball_bearing.6.desc: "[FROM.GetNameDefCap]已經慷慨地接受了我們的貿易提議。這個交易肯定會給雙方都帶來好處。在一個愈發動盪的世界裡，貿易已成為緩解主權國家間緊張關係的重要工具。"
 AAT_Sweden_ball_bearing.6.a: "好消息。"
 AAT_Sweden_ball_bearing.7.t: "[FROM.GetNameDefCap]拒絕了滾珠軸承貿易"
 AAT_Sweden_ball_bearing.7.desc: "[FROM.GetNameDefCap]拒絕了任何有關雙邊貿易協議的提議。他們聲稱，由於全球政治環境急速惡化，所有重大的軍事交易都必須推遲。"
 AAT_Sweden_ball_bearing.7.a: "真是遺憾"
 AAT_Sweden_ball_bearing.8.t: "滾珠軸承貿易在戰爭爆發後取消了"
 AAT_Sweden_ball_bearing.8.desc: "毫不意外的是，在我們兩國爆發戰爭後，滾珠軸承的貿易被兩國政府強制取消了。這項曾被譽為“延緩全球戰爭逼近的里程碑”的貿易協議無疑是失敗的。\n現在，這些關鍵工具將化作戰爭機器製造流血、痛苦和折磨。"
 AAT_Sweden_ball_bearing.8.a: "這是無法避免的嗎？"
 AAT_Sweden_flashpoints.10.t: "[SWE.GetName]北部遭到[SOV.GetAdjective]空襲"
 AAT_Sweden_flashpoints.10.desc: "靠近[FIN.GetAdjective]邊境的帕亞拉村今天發生了一連串的爆炸，導致多棟建築和不少車輛被毀。幸運的是，沒有人遭受重傷。證據表明，這一系列爆炸的罪魁禍首是[SOV.GetAdjective]軍隊，他們的轟炸機將該地區誤認作是[FIN.GetName]的目標而發動了打擊。\n\n我們需要在輿情失控前穩住局勢。然而，我們也應謹慎考慮與[SOV.GetNameDef]更大規模衝突的可能性。"
 AAT_Sweden_flashpoints.10.a: "世界必須瞭解這一侵略行徑"
 AAT_Sweden_flashpoints.10.b: "小心翼翼與[SOV.GetAdjective]大使館接洽，避免事態升級"
 AAT_Sweden_flashpoints.10.c: "與蘇聯人對峙沒有什麼好處"
 AAT_Sweden_flashpoints.11.t: "[SWE.GetName]對轟炸帕亞拉的行為感到憤怒"
 AAT_Sweden_flashpoints.11.desc: "[SOV.GetAdjective]飛行員誤將一個[SWE.GetAdjective]村莊認作[FIN.GetName]目標，對其發動了意外的空襲。[SWE.GetAdjective]政府當下正表示強烈憤慨，試圖就這一不幸的事件在全世界範圍內煽風點火。\n\n我們可以選擇承認，並提議賠償損失，但如此一來，我國公民對[FIN.GetName]特別軍事行動的質疑或將升級，其他國家也會認為我們這是在示弱。"
 AAT_Sweden_flashpoints.11.a: "我們不能冒險升級衝突規模，向[SWE.GetAdjective]政府致歉"
 AAT_Sweden_flashpoints.11.b: "否認參與，同時將其指控為[SWE.GetAdjective]自己策劃的行動"
 AAT_Sweden_flashpoints.12.t: "[SWE.GetAdjective]外交官要求對帕亞拉轟炸事件作出解釋"
 AAT_Sweden_flashpoints.12.desc: "[SOV.GetAdjective]飛行員誤將一個[SWE.GetAdjective]村莊認作[FIN.GetName]目標，對其發動了意外的空襲。[SWE.GetAdjective]大使館的外交官已經找上門來，要求我們對這次襲擊做出解釋，以及我們準備如何賠償。\n\n幸運的是，這一事故還沒有上新聞頭條，因此我們有機會在事態進一步升級之前迅速地解決掉這個問題。"
 AAT_Sweden_flashpoints.12.a: "我們應向[SWE.GetName]賠償損失。"
 AAT_Sweden_flashpoints.12.b: "否認參與，同時將其指控為[SWE.GetAdjective]自己策劃的行動"
 AAT_Sweden_flashpoints.13.t: "[SOV.GetNameDefCap]為帕亞拉轟炸事件致歉"
 AAT_Sweden_flashpoints.13.desc: "[SOV.GetNameDef]的官員為近期在帕亞拉發生的襲擊事件致歉，堅持這純粹是他們的飛行員犯的錯誤。他們還同意對我們造成的損失進行賠償。這樣看來[SOV.GetAdjective]正試圖在雙方關係中採取更合作的態度，希望避免事態進一步升級。"
 AAT_Sweden_flashpoints.13.a: "我們認為這個問題已經解決了。"
 AAT_Sweden_flashpoints.14.t: "[SOV.GetNameDefCap]拒絕承認參與帕亞拉事件"
 AAT_Sweden_flashpoints.14.desc: "我們的外交官試圖與[SOV.GetAdjective]官員追究帕亞拉事件，但得到否認參與的回應。此外，他們試圖以我們干涉他們在[FIN.GetName]的軍事行動為藉口，將爆炸事件歸咎於我們。"
 AAT_Sweden_flashpoints.14.a: "無恥至極，他們這是在自討苦吃"
 AAT_Sweden_flashpoints.14.b: "我們不能冒險採取會使局勢升級的行動。"
 AAT_Sweden_flashpoints.15.t: "[SWE.GetName]送來軍事援助"
 AAT_Sweden_flashpoints.15.desc: "[SOV.GetAdjective]轟炸機最近被發現越過我們的領空進入[SWE.GetName]並轟炸了一個村莊，因為這個村莊被認為是[FIN.GetAdjective]的目標。從那時起，[SOV.GetNameDef]和[SWE.GetName]之間爆發了一場外交危機，這場危機現在已經升級到[SWE.GetName]決定積極地向我們提供武器來打擊[SOV.GetAdjective]們。[SOV.GetAdjective]們將如何回應，還有待觀察。"
 AAT_Sweden_flashpoints.15.a: "真是個悲劇，我們對鄰國[SWE.GetAdjective]表示感激。"
 AAT_Sweden_flashpoints.16.t: "和[SWE.GetName]緊張關係得到緩解"
 AAT_Sweden_flashpoints.16.desc: "在[SWE.capital.GetCapitalVictoryPointName]和[SOV.capital.GetCapitalVictoryPointName]一系列緊張局勢升級之後，局勢似乎開始有所緩解。[SWE.GetAdjective]政府不再圍繞帕亞拉事件咄咄逼人，似乎已經接受了他們沒無法讓我們承認這一點。"
 AAT_Sweden_flashpoints.16.a: "他們是時候退讓了。"
 AAT_Sweden_flashpoints.17.t: "[SWE.GetName]通過武裝[FIN.GetName]使緊張局勢升級"
 AAT_Sweden_flashpoints.17.desc: "隨著[SWE.GetName]試圖用帕亞拉轟炸事件敗壞我們的聲譽的努力失敗，他們現在公然地用步兵裝備武裝[FIN.GetAdjective]軍隊。這顯然是企圖要挾我們接受攻擊的責任，否則就會有更多的蘇聯士兵死亡。\n\n我們必須仔細評估我們的下一步行動，以防止[SWE.GetAdjective]作為[FIN.GetAdjective]的盟友捲入戰爭之中。"
 AAT_Sweden_flashpoints.17.a: "如果他們不停止，我們將通過戰爭威脅升級局勢，以達到緩和的目的。"
 AAT_Sweden_flashpoints.17.b: "我們必須安撫[SWE.GetAdjective]。就目前而言。"
 AAT_Sweden_flashpoints.18.t: "[SOV.GetNameDefCap]要求停止輸送武器"
 AAT_Sweden_flashpoints.18.desc: "我們向[FIN.GetName]故意挑釁性地運送武器，引起了[SOV.GetNameDef]的注意。來自莫斯科的外交官告訴我們，[SOV.GetLeader]認為我們的行為等同於加入了針對[SOV.GetNameDef]的衝突，並將對我們採取一切必要的措施。"
 AAT_Sweden_flashpoints.18.a: "[SOV.GetLeader]在虛張聲勢，我們不會上當的。繼續運輸。"
 AAT_Sweden_flashpoints.18.b: "我們不能冒與蘇聯的緊張局勢進一步升級的風險。"
 AAT_Sweden_flashpoints.19.t: "[SWE.GetName]拒絕最後通牒"
 AAT_Sweden_flashpoints.19.desc: "[SWE.GetAdjective]外交官已經明確表示，在我們承認參與帕亞拉爆炸事件並支付賠償之前，他們不會停止武器運輸。如果我們不對對我們的威脅採取行動，該地區的其他大國可能會把我們看作是可以侵略的一個簡單目標。然而，在我們的[FIN.GetAdjective]軍事行動中牽扯多個國家，衝突可能會升級到全球規模。"
 AAT_Sweden_flashpoints.19.a: "他們讓我們別無選擇。"
 AAT_Sweden_flashpoints.19.b: "必須暫時安撫[SWE.GetAdjective]"
 AAT_Sweden_flashpoints.20.t: "[SWE.GetName]提議反[SOV.GetAdjective]聯盟"
 AAT_Sweden_flashpoints.20.desc: "隨著最近[SWE.GetName]和[SOV.GetNameDef]之間的緊張局勢升級，爆發了公開衝突，[SWE.GetAdjective]的大使們建議與他們更緊密地合作，建立軍事聯盟，對抗我們共同的敵人。"
 AAT_Sweden_flashpoints.20.a: "團結一致，[SOV.GetAdjective]威脅指日可克"
 AAT_Sweden_flashpoints.20.b: "我們要自力更生"
 SWE_nordic_defense_pact: "北歐防務條約"
 AAT_Sweden_flashpoints.21.t: "[SWE.GetAdjective]-[FIN.GetAdjective]同盟"
 AAT_Sweden_flashpoints.21.desc: "隨著最近[SWE.GetName]和[SOV.GetNameDef]之間的緊張局勢升級，爆發了公開衝突，外交官們建議我們與[FIN.GetAdjective]同行接觸，組成一個軍事聯盟來對付我們的共同敵人。"
 AAT_Sweden_flashpoints.21.a: "我們應該促進我們國家之間更多的合作。"
 AAT_Sweden_flashpoints.21.b: "我們可以在沒有[FIN.GetAdjective]的支持下擊敗[SOV.GetLeader]。"
 AAT_Sweden_flashpoints.22.t: "[FIN.GetName]拒絕聯盟提案"
 AAT_Sweden_flashpoints.22.desc: "[FIN.GetAdjective]的外交官告訴我們，儘管在[SOV.GetNameDef]有共同的敵人，但他們政府的戰略目標與我們的戰略目標太不一樣。因此，他們遺憾地拒絕了我們的結盟提議。"
 AAT_Sweden_flashpoints.22.a: "一個令人遺憾的決定。"
 AAT_Sweden_flashpoints.30.t: "在[SWE.GetName]的轉運權"
 AAT_Sweden_flashpoints.30.desc: "儘管我們已經成功地在斯堪的納維亞半島站穩了腳跟，但通過丹屬貝爾特海峽運輸部隊及其裝備可能是危險的。運輸船在公海上行駛時，往往會成為敵人空中和海上攻擊對象。因此，儘可能地減少對海上通道的使用將對我們的戰爭努力有益。\n\n因此，也許應該對鄰國[SWE.GetName]施加壓力，允許我們進入他們的火車和通信網絡。然而，如果我們要避免他們成為我們敵人的行動基地，我們將不得不採取策略，逐步削弱其中立性。"
 AAT_Sweden_flashpoints.30.a: "接觸[SWE.GetName]，請求通過其鐵路網絡進行人道主義轉運"
 AAT_Sweden_flashpoints.30.b: "我們不需要[SWE.GetAdjective]的基建。"
 AAT_Sweden_flashpoints.31.t: "[GER.GetName]申請轉運傷員"
 AAT_Sweden_flashpoints.31.desc: "[GER.GetAdjective]政府成員與我們聯繫，要求有限地使用我們的鐵路網絡，讓受傷的部隊和休假的人通過[SWE.GetName]和[DEN.GetName]往返於[GER.GetNameDef]。雖然他們堅稱這一要求純粹是出於人道主義原因，但不難想像，他們會利用這一點來逐步削弱我們的中立性。"
 AAT_Sweden_flashpoints.31.a: "生存比中立更重要"
 AAT_Sweden_flashpoints.31.b: "拒絕該請求，並提醒他們我們的中立性。"
 AAT_Sweden_flashpoints.32.t: "[SWE.GetName]拒絕請求"
 AAT_Sweden_flashpoints.32.desc: "[SWE.GetName]固執地拒絕讓我們使用他們的基建，同時指出了他們保持中立的承諾。也許他們需要一個更確切的行動來提醒他們，在我們重組歐洲的過程中，他們保持獨立只是我們對他們遵守的獎勵。"
 AAT_Sweden_flashpoints.32.a: "通知他們，[GER.GetLeader]開始懷疑他們的中立性。"
 AAT_Sweden_flashpoints.32.b: "撇開這個問題，我們不能冒著讓他們加入敵人的風險。"
 AAT_Sweden_flashpoints.33.t: "[GER.GetLeader]質疑[SWE.GetAdjective]的中立性"
 AAT_Sweden_flashpoints.33.desc: "我們收到了來自[GER.Capital.GetCapitalVictoryPointName]的嚴厲措辭的電報，通知我們[GER.GetLeader]對我們拒絕他們最近的請求感到沮喪。顯然，[GER.GetAdjective]領導人開始質疑我們的中立性，並認為我們最近的行動表明，我們正在逐步與[GER.GetName]的敵人站在一起。\n\n看來，如果有必要，他們可能願意將局勢升級為衝突。因此，現在可能是我們重新評估我們目前立場的時候了。"
 AAT_Sweden_flashpoints.33.a: "生存比中立更重要"
 AAT_Sweden_flashpoints.33.b: "我們不會被[GER.GetLeader]所脅迫，開始動員我們的力量。"
 AAT_Sweden_flashpoints.34.t: "[SWE.GetName]提高軍事準備狀態"
 AAT_Sweden_flashpoints.34.desc: "[SWE.GetAdjective]軍隊以一種故意挑釁的方式進入高度戒備狀態，可能是為了展示出他們抵制我們對其施加壓力的意願。我們必須謹慎行事，否則我們將有捲入斯堪的納維亞半島另一場衝突的風險。"
 AAT_Sweden_flashpoints.34.a: "開始準備攻擊[SWE.GetName]並向他們發出最後通牒。"
 AAT_Sweden_flashpoints.34.b: "這不值得冒險。"
 AAT_Sweden_flashpoints.35.t: "[GER.GetName]發出最後通牒"
 AAT_Sweden_flashpoints.35.desc: "[GER.GetNameDefCap]已經發出了嚴厲的最後通牒，他們要求我們對他們最近的要求做出讓步，讓他們進入我們的基礎設施。它聲稱，如果我們不這樣做，他們將把我們視為[GER.GetNameDef]的敵人，並使用一切必要的武力來確保他們在斯堪的納維亞的利益。"
 AAT_Sweden_flashpoints.35.a: "生存比中立更重要"
 AAT_Sweden_flashpoints.35.b: "如果戰爭不可避免，我們應該按照我們的條件去戰鬥。"
 AAT_Sweden_flashpoints.35.c: "我們不會動搖我們的中立立場"
 AAT_Sweden_flashpoints.36.t: "與[GER.GetNameDef]的緊張關係減少了"
 AAT_Sweden_flashpoints.36.desc: "最近與[GER.GetNameDef]的緊張關係開始消散，令人欣慰。儘管他們虛張聲勢，但我們似乎成功應付了一個非常困難的外交局面。然而，我們應該保持警惕，因為我們最近的行動很可能激起了[GER.Capital.GetCapitalVictoryPointName]對我們的極大反感。"
 AAT_Sweden_flashpoints.36.a: "希望我們能維持中立。"
 AAT_Sweden_flashpoints.37.t: "[SWE.GetName]拒絕最後通牒"
 AAT_Sweden_flashpoints.37.desc: "[SWE.GetAdjective]政府嚴厲拒絕了我們的最後通牒，表示我們不應該把他們的中立性誤解為承認軟弱或準備不足。他們繼續說，如果對[SWE.GetName]採取魯莽的行動，我們的軍隊做好生死搏鬥的準備。\n\n這可能只是一種軍事行動威懾力的虛張聲勢，但對瑞典軍隊的觀察表明他們願意為自己的獨立而戰。"
 AAT_Sweden_flashpoints.37.a: "我們不能冒險過度分散兵力"
 AAT_Sweden_flashpoints.37.b: "開始入侵[SWE.GetName]"
 AAT_Sweden_flashpoints.38.t: "[SWE.GetName]發起先發攻擊"
 AAT_Sweden_flashpoints.38.desc: "看來我們嚴重誤判了[SWE.GetAdjective]的戰鬥意願。儘管保持了一個多世紀的中立，[SWE.GetAdjective]武裝部隊今天對我們在挪威的部隊發起了先發制人的攻擊，讓他們措手不及。雖然衝突的結果遠未確定，但很難不讓我們對[SWE.GetAdjective]的同行的膽量表示敬意。"
 AAT_Sweden_flashpoints.38.a: "[SWE.GetName]將成為我們歷史上的一個註腳"
 AAT_Sweden_flashpoints.39.t: "[SWE.GetName]允許轉運傷員"
 AAT_Sweden_flashpoints.39.desc: "[SWE.GetName]已經允許我們的傷員和休假的士兵通過他們的鐵路網絡返回[GER.GetNameDef]。但是，他們堅持只有非武裝人員才能這樣，而且將有嚴格的配額，以確保在任何時候都不會有太多的部隊在瑞典。"
 AAT_Sweden_flashpoints.39.a: "很好，我們將避免讓他們再受挫。"
 AAT_Sweden_flashpoints.39.b: "繼續推進，我們也許能夠進入他們的通信網絡"
 AAT_Sweden_flashpoints.40.t: "[GER.GetName]請求接入電話和電報網絡"
 AAT_Sweden_flashpoints.40.desc: "正如我們擔心的那樣，德國近期提出使用我國鐵路網絡的要求已經不能滿足。[GER.Adjective]政府要求使用我們的電報和電話網絡，以便在[NOR.GetName]和[GER.GetNameDef]之間能直接溝通。\n\n屈服於這個要求將是對我們中立性的又一次打擊，但是我們可以調查竊聽通信線路，以便監視[GER.GetAdjective]軍隊的計劃。"
 AAT_Sweden_flashpoints.40.a: "生存比中立更重要"
 AAT_Sweden_flashpoints.40.b: "我們可以利用這一點為我們帶來好處"
 AAT_Sweden_flashpoints.40.c: "我們不能放棄我們的中立地位"
 SWE_spying_on_GER: "我們正通過我們的網絡對德國的通信進行監視"
 AAT_Sweden_flashpoints_tt_arne_beurling: "解鎖§Y阿爾內·伯伊林§!（$MODIFIER_DECRYPTION_POWER$：§G+15§!）成為一名顧問"
 AAT_Sweden_flashpoints.41.t: "[SWE.GetName]允許訪問電話和電報網絡"
 AAT_Sweden_flashpoints.41.desc: "由於瑞典政府的合作，[GER.Capital.GetCapitalVictoryPointName]和我們在[NOR.GetName]的部隊之間的溝通變得容易了很多。也許我們應該避免與他們進一步對立，這樣我們就不會有失去特權的風險。"
 AAT_Sweden_flashpoints.41.a: "非常好，我們已經從他們那裡獲得了儘可能多的東西。"
 AAT_Sweden_flashpoints.41.b: "我們應該為全面的軍事准入做最後一次努力。"
 AAT_Sweden_flashpoints.42.t: "[GER.GetName]要求軍事通行權"
 AAT_Sweden_flashpoints.42.desc: "[GER.GetNameDef]的政府並不滿足於之前我們的讓步，他們要求獲得軍事准入以緩解他們在斯堪的納維亞半島的軍事行動壓力。顯然，這一直是[GER.GetAdjective]的意圖，如果不承認我們最後的中立性，[GER.GetLeader]就會用它作為入侵[SWE.GetName]的理由。然而，如果我們真的允許開放准入，我們的鄰國和[GER.GetNameDef]的敵人很可能會認為我們是他們佔領[NOR.GetName]的同謀。"
 AAT_Sweden_flashpoints.42.a: "我們無力對抗[GER.GetName]。"
 AAT_Sweden_flashpoints.42.b: "我們不想被拖入戰爭就必須抵制這一要求。"
 AAT_Sweden_flashpoints.43.t: "[SWE.GetName]允許軍事通行"
 AAT_Sweden_flashpoints.43.desc: "[SWE.GetName]已經給了我們進入他們國家的所有軍事權限。這不僅有助於我們在斯堪的納維亞半島的行動，也增加了我們對[SWE.GetName]的影響力，防止他們輕易加入我們的敵人。"
 AAT_Sweden_flashpoints.43.a: "他們都在我們的控制之下，只是名義上的。"
 SWE_GER_military_access_tt: "§Y[GER.GetFlag][GER.GetNameDefCap]§!將獲得§Y[SWE.GetFlag][SWE.GetName]§!的§R軍事通行權§!"
 AAT_Sweden_flashpoints.50.t: "內部的敵人"
 AAT_Sweden_flashpoints.50.desc: "儘管我們一直關注著極左翼的活動，但我們可以預見到共產黨可能會破壞我們的軍事力量，或在關鍵行業中散佈不滿，以使[SOV.GetAdjective]入侵[SWE.GetName]更加容易。因此，我們應該通過拘留那些已知支持[SOV.GetNameDefCap]或持極左立場的人來預防此類活動。"
 AAT_Sweden_flashpoints.50.a: "我們不能冒險讓他們製造麻煩。把他們關起來。"
 AAT_Sweden_flashpoints.50.b: "這在民主社會中是不可接受的。"
 AAT_Sweden_flashpoints.51.t: "對拘禁決定的憤怒"
 AAT_Sweden_flashpoints.51.desc: "在我們決定開始對整個[SWE.GetName]的激進左派進行拘禁後，警方為實現這一目標而進行的突擊檢查和逮捕，遭到了勞動人民的強烈的反對。許多人甚至幫助激進分子逃脫抓捕或直接攻擊警察。他們聲稱，這種大規模監禁相當於建立一個警察國家。我們應該小心行事，否則事情可能很快就會失控。"
 AAT_Sweden_flashpoints.51.a: "派出軍隊支持警察。"
 AAT_Sweden_flashpoints.51.b: "這是一個錯誤，我們需要釋放那些我們已經逮捕的人。"
 AAT_Sweden_flashpoints.52.t: "因左翼被捕而爆發的大規模抗議和暴力事件"
 AAT_Sweden_flashpoints.52.desc: "我們決定讓軍隊支持警察逮捕激進的左翼分子，這引起了暴力的升級，有可能使國家陷入內戰。工人和警察之間的衝突已經導致了一些傷亡。我們沒能逮捕的激進分子正在召集工人反對我們，並要求徹底解散政府。此外，我們看到一些士兵拒絕執行命令，甚至完全拋棄了軍隊。這可能是一個多世紀以來國家所處的最嚴峻的形勢。"
 AAT_Sweden_flashpoints.52.a: "我們不能讓這些暴民毀掉我們的國家。"
 AAT_Sweden_flashpoints.52.b: "我們必須停止逮捕，我們正在摧毀這個國家。"
 AAT_Sweden_flashpoints.53.t: "[SWE.GetAdjective]內戰爆發"
 AAT_Sweden_flashpoints.53.desc: "最近幾週發生的零星的暴力事件現在正凝聚成全國各地有組織的運動。這些運動大多與$SWE_communism_party_long$保持一致，甚至可能與[SOV.GetNameDef]有關聯。\n\n共產黨民兵已經控制了一些城市地區，並開始逮捕任何與我們最近拘留左翼的計劃有關的人。同時，民族主義者也在組建民兵，往往得到當地警察的支持，以防止他們的城鎮也落入共產黨的手中。這兩個團體和我們的軍隊之間的暴力衝突已經升級到了不亞於內戰的地步。"
 AAT_Sweden_flashpoints.53.a: "這場革命早該開始了。"
 AAT_Sweden_flashpoints.53.b: "我們將粉碎這些[SOV.GetNameDef]的特工。"
 AAT_Sweden_flashpoints.54.t: "[SWE.GetName]的緊張局勢開始緩和"
 AAT_Sweden_flashpoints.54.desc: "最近，政府與反對我們拘押左翼活動的人之間的緊張關係已經開始緩解。雖然政府和他們之間已經失去了很多信任，但我們似乎不再有局勢演變成宗派衝突的危險。"
 AAT_Sweden_flashpoints.54.a: "險些釀成災難。"
 AAT_Sweden_flashpoints.56.t: "哥特蘭提案"
 AAT_Sweden_flashpoints.56.desc: "在一些高級軍官加入共產主義革命之後，除海軍之外的任何部門的信任都處於歷史最低點。由於最近的活動使得國王的安全處於危險之中，人們提出了嚴厲的措施以確保他的生存。海軍部提出了一個大膽的計劃，通過將國王轉移到哥特蘭島並建立一個由效忠者組成的軍事管理機構，在相對安全的情況下更有效地管理國家，重新控制局勢。"
 AAT_Sweden_flashpoints.56.a: "我們不能放棄大陸。"
 AAT_Sweden_flashpoints.56.b: "非常棒的提案"
 AAT_Sweden_flashpoints.57.t: "瑞典國王在試圖撤離時負傷"
 AAT_Sweden_flashpoints.57.desc: "清晨，瑞典政府決定將國王從首都轉移到哥特蘭島上的安全屋。途中，車隊遭游擊隊攔截，國王所在的車輛被擊中，擋風玻璃碎了一地。\n在隨後的交火中，國王罹受重傷，左眼永久受損。政府在最終轉進到島上後，發誓要以瑞典合法政府的身份光復大陸。但有傳言稱，國王本人已經實際控制了政府，並在負傷後榮獲了更多的擁護。"
 AAT_Sweden_flashpoints.57.a: "亂成一鍋粥了"
 AAT_Sweden_flashpoints_civil_war_tt: "§R如果共產主義者保持高支持率，減少[SWE.GetFlag][SWE.GetName]的穩定可能導致內戰§!"
 AAT_Sweden_flashpoints.60.t: "[SWE.GetName]奪取蘭斯韋克"
 AAT_Sweden_flashpoints.60.desc: "[SWE.GetName]已經奪取了蘭斯韋克的控制權，這是一家我們與[SWE.GetAdjective]合作運營用於開發裝甲車輛的公司。雖然近年來蘭斯韋克對我們的實用性有所減少，但這明確表明[SWE.GetName]希望與[GER.GetNameDef]保持距離。"
 AAT_Sweden_flashpoints.60.a: "作為對等行為，我們應該奪取在[THIS.GetNameDef]的[SWE.GetAdjective]資產。"
 AAT_Sweden_flashpoints.60.b: "無論如何，蘭斯韋克的目的已經過時了。"
 AAT_Sweden_flashpoints.61.t: "[FROM.GetName]奪取瑞典資產"
 AAT_Sweden_flashpoints.61.desc: "在我們奪取蘭斯韋克的控制權之後，[GER.GetNameDef]政府採取了使局勢升級的激烈行動，沒收了在他們國家與[SWE.GetAdjective]國民有關的多個資產。雖然我們本來希望逐漸與[GER.GetNameDef]疏遠，但這個決定引起了[SWE.GetAdjective]公眾的憤慨。"
 AAT_Sweden_flashpoints.61.a: "讓我們瞧瞧，他們不和我們做生意之後該怎麼辦。"
 AAT_Sweden_flashpoints.61.b: "不奇怪，但令人遺憾。"
 AAT_Sweden_flashpoints.62.t: "[FROM.GetName]對[GER.GetNameDef]實施貿易禁運"
 AAT_Sweden_flashpoints.62.desc: "[SWE.GetNameDef]今天發佈了對[GER.GetNameDef]的貿易禁令，將最近的緊張局勢推高到了一個新的高度。這個決定將顯著影響我們生產武器工業所需的鐵礦供給的能力。"
 AAT_Sweden_flashpoints.62.a: "如果他們不和我們貿易，那我們就沒必要尊重他們的邊界。"
 AAT_Sweden_flashpoints.62.b: "將這一事件升級只會顯得我們非常依賴小國。"
 AAT_Sweden_flashpoints.63.t: "[FROM.GetNameDefCap]威脅開戰"
 AAT_Sweden_flashpoints.63.desc: "我們最近決定對[GER.GetNameDef]實施禁運，在[GER.Capital.GetCapitalVictoryPointName]引起了憤怒。由於他們過去對[SWE.GetAdjective]鐵礦石的依賴，他們可能感到恐慌，因此發出了最後通牒。通牒稱，如果我們不立即解除禁運，他們將被迫採取包括戰爭在內的嚴厲行動來對付我們。"
 AAT_Sweden_flashpoints.63.a: "拒絕他們的最後通牒。"
 AAT_Sweden_flashpoints.63.b: "我們不能冒險引發衝突。"
 AAT_Sweden_flashpoints.64.t: "[FROM.GetNameDefCap]拒絕接受最後通牒"
 AAT_Sweden_flashpoints.64.desc: "[SWE.GetNameDef]強硬地拒絕了我們的最後通牒。他們表示，任何對他們的攻擊都不會改善進攻國對[SWE.GetAdjective]礦石儲備的獲取，因為在我們的軍隊佔領之前，他們將會摧毀礦井。"
 AAT_Sweden_flashpoints.64.a: "他們這是自找苦吃。"
 AAT_Sweden_flashpoints.64.b: "沒有他們我們也能處理好。"
 AAT_Sweden_flashpoints.65.t: "[FROM.GetNameDefCap]解除禁運"
 AAT_Sweden_flashpoints.65.desc: "[SWE.GetAdjective]政府終於明智地決定解除對我們的禁運。雖然貿易在我們兩國之間完全恢復正常可能需要一些時間，但我們已經向他們明確表示，如果必要的話，我們仍然有能力讓他們屈服。"
 AAT_Sweden_flashpoints.65.a: "現在他們明白自己在世界上的地位了。"
 AAT_Sweden_flashpoints.70.t: "所購軍艦駛離[ITA.GetAdjective]港口"
 AAT_Sweden_flashpoints.70.desc: "我們前段時間訂購自[ITA.GetName]的軍艦已經離港。由於需要在途中加油，它們大約一個月後才能抵達[SWE.GetNameDef]。"
 AAT_Sweden_flashpoints.70.a: "一路順風"
 AAT_Sweden_flashpoints.71.t: "前[ITA.GetAdjective]軍艦前往[SWE.GetName]"
 AAT_Sweden_flashpoints.71.desc: "四艘曾隸屬[ITA.GetAdjective]的驅逐艦於今日抵達我國的一個港口。這些艦隻由[SWE.GetAdjective]政府訂購，正在移交給[SWE.GetName]。在其加油補給時，我們可以扣押這批船，並將其用於本國戰略目標。當然，這可能會破壞我國與[SWE.GetName]的關係。"
 AAT_Sweden_flashpoints.71.a: "這些船在我軍服役才更能發光發熱"
 AAT_Sweden_flashpoints.71.b: "我們不想損害與[SWE.GetName]的關係"
 AAT_Sweden_flashpoints.72.t: "[ENG.GetName]扣押我國新軍艦"
 AAT_Sweden_flashpoints.72.desc: "在停靠一個[ENG.GetAdjective]控制的港口時，我們的四艘新艦艇被他們的海軍扣押。他們似乎在用“憤怒”權利作為扣押的藉口。如果我們想在不引起戰爭的情況下拿回這些船，我們必須小心謹慎地行事。"
 AAT_Sweden_flashpoints.72.a: "這是戰爭行徑。他們必須立即放行，否則會要承擔相應後果。"
 AAT_Sweden_flashpoints.72.b: "我們不能冒與[ENG.GetName]開戰的風險。"
 AAT_Sweden_flashpoints.73.t: "[SWE.GetName]要求釋放船隻"
 AAT_Sweden_flashpoints.73.desc: "[SWE.GetAdjective]政府明確表示，其將我方扣押該國船隻視作戰爭行為。如果我們不立即釋放這些船隻，他們將不得不予以報復。"
 AAT_Sweden_flashpoints.73.a: "我們沒打算放過這些船"
 AAT_Sweden_flashpoints.73.b: "扣船又沒啥好處"
 AAT_Sweden_flashpoints.74.t: "[SWE.GetName]接受船隻扣押"
 AAT_Sweden_flashpoints.74.desc: "[SWE.GetAdjective]政府似乎已經放棄奪回其船隻的努力。僅需稍作改裝，這些船現在就已準備好在我國海軍服役了。"
 AAT_Sweden_flashpoints.74.a: "他們沒有選擇。"
 AAT_Sweden_flashpoints.75.t: "[ENG.GetName]拒絕釋放船隻"
 AAT_Sweden_flashpoints.75.desc: "[ENG.GetAdjective]政府頑固地拒絕釋放我們被扣押的船隻。看來我們拿回這些船的唯一方法就是為它們而戰。"
 AAT_Sweden_flashpoints.75.a: "他們製造了一個新的敵人。"
 AAT_Sweden_flashpoints.75.b: "不值得為此開戰。"
 AAT_Sweden_flashpoints.76.t: "[ENG.GetName]釋放船隻"
 AAT_Sweden_flashpoints.76.desc: "[ENG.GetName]和[SWE.GetName]之間的緊張局勢隨著船隻得以釋放而塵埃落定。很明顯，[ENG.GetAdjective]不希望為了幾艘舊船就捲入與我國的戰爭中。"
 AAT_Sweden_flashpoints.76.a: "我們對船隻最終交付十分期待"
 AAT_Sweden_flashpoints.77.t: "新船安全抵達"
 AAT_Sweden_flashpoints.77.desc: "我國從[ITA.GetNameDef]購買的船隻無驚無險地抵達了。雖說如此，船員們確實報告說，他們在沿途港口加油時遭到了嚴格的檢查。"
 AAT_Sweden_flashpoints.77.a: "它們能派上大用場"
 FIN_agree_peace_with_SWE: "芬蘭已同意用奧蘭換和平"
 AAT_Sweden_flashpoints.78.t: "[SWE.GetName]索要奧蘭"
 AAT_Sweden_flashpoints.78.desc: "[SWE.GetName]越來越擔心戰略位置重要的奧蘭群島，這些島嶼可能被用來控制波羅的海。\n考慮到我們當前的情況以及島上大部分人口是[SWE.GetAdjective]，他們的政府正在詢問我們是否願意放棄這些島嶼，直到世界局勢恢復穩定。他們表示這樣做是為了防止島嶼落入敵對勢力手中，以及保護[SWE.GetAdjective]公民的需要。"
 AAT_Sweden_flashpoints.78.a: "奧蘭是我們的，並且將繼續如此"
 AAT_Sweden_flashpoints.78.b: "這是正確的選擇。"
 AAT_Sweden_flashpoints.78.c: "只要[SWE.GetName]補償我們"
 AAT_Sweden_flashpoints.79.t: "[FIN.GetName]拒絕"
 AAT_Sweden_flashpoints.79.desc: "[FIN.GetName]對於移交奧蘭群島控制權這一問題，給了我們毫不留情的“否”的答覆。"
 AAT_Sweden_flashpoints.79.a: "真是遺憾"
 AAT_Sweden_flashpoints.80.t: "[FIN.GetName]同意"
 AAT_Sweden_flashpoints.80.desc: "考慮到他們所處的局勢岌岌可危，他們寧願看到我們控制這片島嶼，而不是某個外國佔領者。當地會說[SWE.GetAdjective]語言的人佔多數，他們已經很好地接受了這一點，生活仍在正常進行。"
 AAT_Sweden_flashpoints.80.a: "太好了"
 AAT_Sweden_flashpoints.81.t: "[FIN.GetName]同意，但開了個價"
 AAT_Sweden_flashpoints.81.desc: "[FIN.GetName]承認它願意放棄奧蘭群島，但強調他們目前在資金方面相當緊張。\n他們願意讓我們控制該島，但前提是以我們的國家儲備金來補償他們的收入損失。"
 AAT_Sweden_flashpoints.81.a: "這筆買賣值得。"
 AAT_Sweden_flashpoints.81.b: "不。"
 AAT_Sweden_flashpoints.82.t: "[SWE.GetName]同意"
 AAT_Sweden_flashpoints.82.desc: "[SWE.GetName]已經同意就奧蘭問題對我們進行經濟補償。隨著交易的進行，我們也舉行了一個小型的儀式，儘管一些奧蘭當地人出於理解地擔心他們的未來，但[SWE.GetAdjective]當局已經表示，移交將盡可能地平穩過渡，當局也尊重他們的生活方式。"
 AAT_Sweden_flashpoints.82.a: "必要的花費。"
 AAT_Sweden_flashpoints.83.t: "[SWE.GetName]拒絕"
 AAT_Sweden_flashpoints.83.desc: "[SWE.GetName]作出決定，認為不值得花掉他們這麼多儲備金換取奧蘭的移交控制權。"
 AAT_Sweden_flashpoints.83.a: "然後他們就不想要它了"
 AAT_Sweden_BoP.10.t: "競選活動－經濟政策"
 AAT_Sweden_BoP.10.desc: "選舉季再次來臨，爭奪瑞典議會控制權的各黨派紛紛出動進行競選。引起選民注意的主要問題似乎是經濟問題。一些人主張繼續執行現行政策，另一些人則希望進行徹底的改革，但在這個問題上，似乎只有一種選擇獲得了支持。"
 AAT_Sweden_BoP.10.a: "經濟必須由工人階級來運作，併為其服務。"
 AAT_Sweden_BoP.10.b: "我們需要在資本主義和共產主義這兩個極端之間找到一箇中間點。"
 AAT_Sweden_BoP.10.c: "為什麼我們要通過如此過度的稅收壓制社會上最成功的人？"
 AAT_Sweden_BoP.10.d: "擴軍將降低失業率，提高國家安全。"
 AAT_Sweden_BoP.11.t: "競選活動 - 社會政策"
 AAT_Sweden_BoP.11.desc: "競選活動似乎已經轉移到社會政策上，各黨派現在宣稱他們計劃如何解決社會的困境。一些政黨主張徹底重塑政府以解決這些問題，而其他政黨則採取更為謹慎的方法，進行零星的改革。然而，似乎只有一個信息能引起選民的共鳴。"
 AAT_Sweden_BoP.11.a: "在資產階級被趕下臺之前，不可能有社會平等。"
 AAT_Sweden_BoP.11.b: "更好地獲得教育資源和醫療服務將幫助人們擺脫貧困。"
 AAT_Sweden_BoP.11.c: "我們需要多支持這些在大城市以外的人。"
 AAT_Sweden_BoP.11.d: "我們已經忘記了作為[ROOT.GetAdjective]的意義，需要更多的愛國主義教育。"
 AAT_Sweden_BoP.12.t: "競選活動 - 外交政策"
 AAT_Sweden_BoP.12.desc: "隨著選舉日越來越近，辯論已經轉移到國家安全和外交政策這一緊迫問題上。許多黨派主張中立和孤立主義，以維持國家安全，而其他黨派則推動更明確的外交政策方向。在世界處於如此危險的狀態下，似乎只有一個信息能給選民帶來希望。"
 AAT_Sweden_BoP.12.a: "世界上的工人必須團結起來，反對帝國的侵略戰爭。"
 AAT_Sweden_BoP.12.b: "我們必須在發展強大的軍事威懾力的同時保持我們的中立性。"
 AAT_Sweden_BoP.12.c: "我們弱小且脆弱，我們必須更好地為戰爭做準備。"
 AAT_Sweden_BoP.12.d: "確保該地區和平的唯一途徑是堅持我們對它的控制。"
 AAT_Sweden_BoP.14.t: "選舉結果"
 AAT_Sweden_BoP.14.d_socialist: "選舉日已經到來，選民們已經做出了選擇。在未來的日子裡，$SWE_communism_party_long$將組成一個多數政府。以此看來他們的國有化、階級團結和拒絕國外帝國糾纏的激進政策贏得了公眾的支持。現在需要觀察的是，他們承諾的有多少會兌現。"
 AAT_Sweden_BoP.14.d_democratic: "選舉日已經到來，選民們已經做出了選擇。在未來的日子裡，$SWE_democratic_party_long$將組建一個多數派政府。雖然有些人認為人民之家的承諾在選民中已經變味了，但這個結果證明他們錯了。剩下的就是讓他們完成自己的工作。"
 AAT_Sweden_BoP.14.d_non_aligned: "選舉日已經到來，選民們已經做出了選擇。在未來的幾天內，$SWE_neutrality_party_long$將組建一個多數派政府。他們通過鞏固國防和推出政策的方式來拉攏農村選民的計劃顯然已經成功。現在他們必須要負責將選舉期間宣傳的浪漫化的[ROOT.GetName]落實、實現。"
 AAT_Sweden_BoP.14.d_fascist: "選舉日已經到來，選民們做出了他們的選擇。在未來的幾天內，$SWE_fascism_party_long$組建一個多數派政府，似乎沒有人像他們那樣對這個結果感到驚訝。在新政權下，[ROOT.GetName]的民主機制能維持多久還不確定。"
 AAT_Sweden_BoP.14.d_left: "選舉日已經到來，儘管各黨派盡了最大努力，但沒有一個黨派能夠在國會中獲得多數席位。然而，社會黨和社會民主黨已經設法達成協議，組建了一個聯合政府。這個聯盟是否能持續整個任期還不確定，但也許對右派的恐懼會使其保持團結。"
 AAT_Sweden_BoP.14.d_right: "選舉日已經到來，儘管各黨派盡了最大努力，但沒有一個黨派能夠在國會中獲得多數席位。然而，保守黨和法西斯主義者已經設法達成協議，組建了一個聯合政府。這個聯盟是否能持續整個任期還不確定，但也許對左派的恐懼會使其保持團結。"
 AAT_Sweden_BoP.14.a: "選民已經表達了意見。"
 SWE_folkhemmet_event_result_tt: "在採用該政策後，人民之家精神有以下效果：\n"
 AAT_Sweden_strike.1.t: "[?SWE.GetNameDef]的動盪"
 AAT_Sweden_strike.1.desc: "類似世界大戰期間那樣面臨食品封鎖的潛在風險已經引發了[SWE.GetAdjective]勞工界的抗議。在當地煽動者的推動下，騷亂已經從工廠內部蔓延到全國範圍。我們需要穩定局勢，並確保政府在這個風雨飄搖的時期仍被視作強有力的領導者。"
 AAT_Sweden_strike.1.a: "我們除了靜候，其他做什麼都不對。"
 AAT_Sweden_strike.1.b: "我們需要投入精力，提高人民的士氣，使局勢冷靜下來。"
 AAT_Sweden_strike.2.t: "全國暴亂"
 AAT_Sweden_strike.2.desc: "不幸的是，我們阻止抗議活動的努力已經失敗。幾乎所有的工廠工人、女裁縫和木工都上街散步，抗議政府的政策。更糟糕的是，許多抗議活動演變為了暴力事件，平民和執法人員都受到了傷害。"
 AAT_Sweden_strike.2.a: "他們會回心轉意的。"
 AAT_Sweden_strike.2.b: "我們必須立即解決此事。"
 AAT_Sweden_nationalists.1.t: "[SWE.GetAdjective]民族社會主義者請求干涉"
 AAT_Sweden_nationalists.1.desc: "[SWE.GetName]民族社會主義事業的主使政黨與我國接洽，提議推翻其現任政府，呼籲我國武裝支持他們的事業。參與其軍事行動的報酬是，他們同意將該國牢牢地置於我國影響範圍內。"
 AAT_Sweden_nationalists.1.a: "我們騰不出部隊來，但些許支持還是會送到的"
 AAT_Sweden_nationalists.1.b: "我們會支援他們"
 AAT_Sweden_nationalists.2.t: "[FROM.GetNameDefCap]拒絕提案"
 AAT_Sweden_nationalists.2.desc: "[GER.GetAdjective]政府拒絕我方提案，理由是他們的軍隊已經捉襟見肘，不願再建立新一條前線。不過，他們運了一些步槍和志願軍來，以示善意。"
 AAT_Sweden_nationalists.2.a: "好過什麼都沒有"
 AAT_Sweden_nationalists.3.t: "[FROM.GetNameDefCap]同意提案"
 AAT_Sweden_nationalists.3.desc: "[GER.GetAdjective]高層同意在軍事上支持我們奪權。作為代價，我方同意融入其大陸勢力範圍。願終有一日，彼能以平等待我。"
 AAT_Sweden_nationalists.3.a: "終有一日，涅槃重生！"
 AAT_Sweden_nationalists.4.t: "團結民族社會主義運動"
 AAT_Sweden_nationalists.4.desc: "民族社會主義運動過於分散，無法奪取[SWE.GetName]政權。要改變這種狀況，就得停止零碎不堪的內訌，整個運動都應團結在一個真正的領導人身前。"
 AAT_Sweden_nationalists.4.a: "$SWE_sven_olov_lindholm$可以團結各路民族主義勢力"
 AAT_Sweden_nationalists.4.b: "$SWE_birger_furugard$註定要成為[SWE.GetName]的元首"
 AAT_Sweden_nationalists.5.t: "災難性的[FROM.FROM.GetName]衝鋒隊遊行"
 AAT_Sweden_nationalists.5.desc: "在[FROM.FROM.GetName]，人們擔心反對派的示威者會擾亂衝鋒隊的進軍，這導致今天兩個團體在街上發生激烈的衝突。雙方都有許多人受傷和被殺，但最終公眾輿論似乎站在反法西斯分子一邊，衝鋒隊被迫在當地一家商店裡避難，直到警察到來。"
 AAT_Sweden_nationalists.5.a: "他們的實力在衰敗。"
 AAT_Sweden_nationalists.6.t: "波折的[FROM.FROM.GetName]衝鋒隊遊行"
 AAT_Sweden_nationalists.6.desc: "今天在[FROM.FROM.GetName]舉行的衝鋒隊進軍沉悶得令人大跌眼鏡。組織者只能召集屈指可數的成員，帶領雜牌軍在主街上游行，市民們則繼續做自己的事情時。儘管呼聲不高，但衝鋒隊正在成為[SWE.GetAdjective]政治的一個重要部分。"
 AAT_Sweden_nationalists.6.a: "他們正在逐漸積攢實力。"
 AAT_Sweden_nationalists.7.t: "成功的[FROM.FROM.GetName]衝鋒隊遊行"
 AAT_Sweden_nationalists.7.desc: "在當地警察的支持下，衝鋒隊阻止了反對派的抗議者，成功地在[FROM.GetName]進行了大規模的進軍活動。遊行者穿過當地的大街，受到了街道兩旁熱情洋溢的公眾的歡呼。"
 AAT_Sweden_nationalists.7.a: "他們應當重建[SWE.GetName]。"
 AAT_Sweden_nationalists.8.t: "貴族成員提供支持"
 AAT_Sweden_nationalists.8.desc: "長期以來，貴族成員都感到不滿，因為現有體制傾向於民選官員，削弱了他們對國家事務的影響力。因此，許多人同意利用他們剩餘的資源來支持我們的民族主義運動。作為交換，一旦該運動獲得對國會的控制權，他們將期望得到一些政治上的妥協與回報。"
 AAT_Sweden_nationalists.8.a: "為了恢復祖國的偉大榮耀，這是微小的代價。"
 AAT_Sweden_nationalists.9.t: "企業家提供支持"
 AAT_Sweden_nationalists.9.desc: "由於社會民主黨和全國總工會的不斷干涉，[SWE.GetAdjective]的企業家與外國競爭對手的競爭越來越激烈。一些行業領跑企業家同意支持我們的民族主義運動，只要我們同意一勞永逸地解散工會。"
 AAT_Sweden_nationalists.9.a: "工會會被徹底消滅。"
 AAT_Sweden_nationalists.10.t: "軍官提供給支持"
 AAT_Sweden_nationalists.10.desc: "國內不乏對本屆政府下國家防務管理不善感到失望的軍官。因此，許多來自陸軍和海軍的高級軍官都願意協助我們的民族主義事業，作為交換，當我們上臺後，要加強國防預算方面的支持。"
 AAT_Sweden_nationalists.10.a: "[SWE.GetName]將再次躋身列強之位。"
 AAT_Sweden_nationalists.11.t: "農村支持壯大"
 AAT_Sweden_nationalists.11.desc: "許多在[SWE.GetName]城市中心以外生活的人感到被社會民主黨的政策拋在了一邊。此外，他們還感受到了工業化的威脅，擔心他們的傳統生活方式被侵蝕。通過在他們心中播下不滿的種子，我們成功地為民族主義運動創造了一股浪潮一般的支持者，這些運動承諾投資農村並恢復傳統價值觀。"
 AAT_Sweden_nationalists.11.a: "鄉村民眾才是國家的骨幹。"
 AAT_Sweden_nationalists.16.t: "王室巡幸[FROM.FROM.GetName]堪稱災難"
 AAT_Sweden_nationalists.16.desc: "一群反對君主主義的勢力今天成功地打亂了國王對[FROM.FROM.GetName]的訪問。儘管警方盡力遏制抗議者，但他們仍然設法封鎖了國王車隊的計劃路線，迫使他們取消行程，以免陷入更危險的局面。"
 AAT_Sweden_nationalists.16.a: "平民對上位者毫無尊重。"
 AAT_Sweden_nationalists.17.t: "王室巡幸[FROM.FROM.GetName]一波三折"
 AAT_Sweden_nationalists.17.desc: "王室對[FROM.FROM.GetName]的巡幸可謂是一場相當無聊的事情。國王原本希望人群會聚集起來迎接他，但現場只有少數支持者站在街道兩旁。據說，國王對這種情況感到非常不滿和尷尬，發誓將來不再參與這種輕浮的活動。"
 AAT_Sweden_nationalists.17.a: "他必須堅持這麼做以積累支持。"
 AAT_Sweden_nationalists.18.t: "王室巡幸[FROM.FROM.GetName]大獲成功"
 AAT_Sweden_nationalists.18.desc: "國王對[FROM.FROM.GetName]的巡幸顯著地提升了君主的人氣。歡欣鼓舞的支持者們排列在街道兩旁，揮舞著[SWE.GetAdjective]的旗幟，向國王前進的方向撒花。儘管有一些批評者存在，但當地警察部隊將他們遠遠地隔離在遊行隊伍之外。"
 AAT_Sweden_nationalists.18.a: "有此等支持，我們定能恢復王室的權威"
 AAT_Sweden_nationalists.19.t: "與國王的茶話會"
 AAT_Sweden_nationalists.19.desc: "在位於[SWE.Capital.GetCapitalVictoryPointName]的國王宮殿的一次秘密集會上，各個民族主義運動的領導人與君主會面，討論他們希望看到[SWE.GetName]恢復往日榮耀的願望。在一場決定如何將各種運動整合為團結一致的政治運動的討論後，他們一致同意，當時機成熟時古斯塔夫國王應該重新確立自己的統治地位，而不僅僅扮演名義上的君主。國王對於這樣的計劃有些猶豫，但同意在政治事務中扮演更積極的角色，首先進行一次全國巡迴，以評估人民的支持程度。"
 AAT_Sweden_nationalists.19.a: "我們必須展示給國王看，這麼做對國家不算太遲。"
 AAT_Sweden_nationalists.20.t: "[FROM.GetName]希望擴大控制範圍"
 AAT_Sweden_nationalists.20.desc: "[FROM.GetName]，我們忠實的屬國，請求我們再交給他們一些責任，即授予其[SOV.GetName]北部領土控制權，如此我們就能減少佔領區負擔，集中力量對付主要敵人。"
 AAT_Sweden_nationalists.20.a: "好主意。"
 AAT_Sweden_nationalists.20.b: "一切領土屬於德意志祖國！"
 AAT_Sweden_nationalists.21.t: "[FROM.GetName]交出當地控制權"
 AAT_Sweden_nationalists.21.desc: "柏林方面決定交予我們更多的責任，將北方大部領土轉交給我國。如此，北方專員轄區得以成立。"
 AAT_Sweden_nationalists.21.a: "我國的影響力增強了"
 AAT_Sweden_nationalists.22.t: "[FROM.GetName]拒絕我方提案"
 AAT_Sweden_nationalists.22.desc: "柏林方面決定拒絕我國請求，理由是我國尚未有承擔如此巨大領土交換所帶來的巨大責任。也許他們只是害怕專員轄區的權力過大？"
 AAT_Sweden_nationalists.22.a: "也許這是個錯誤……"
 AAT_Sweden_nationalists.23.t: "黑暗中的利刃"
 AAT_Sweden_nationalists.23.desc: "[GER.GetAdjective]的傀儡國[SWE.GetName]瞞著其宗主國向我們派遣了一名執行秘密任務的特使。[SWE.GetAdjective]已經看到了局勢的嚴重性，正尋求擺脫衝突的方法，並向我們遞交了一項提議。該國目前正在暗中準備大規模叛變，試圖趁[GER.GetAdjective]軍隊深陷海外時奪取其本土。他們也強調了無法與我方和宗主兩線作戰，因此建議我方暫時保持做戲，待其倒戈之時，雙方便籤訂無條件和平協議，然後並肩作戰。\n有時候，暗中捅刀子比光天化日下的攻城錘更有效。"
 AAT_Sweden_nationalists.23.a: "這真是一個好主意。"
 AAT_Sweden_nationalists.23.a_tt: "§Y[SWE.GetName]§!會在適當時間反抗宗主國並在戰鬥中加入我們"
 AAT_Sweden_nationalists.23.b: "一切法西斯主義者都該上絞架！"
 AAT_Sweden_nationalists.24.t: "[FROM.GetName]接受我方提案"
 AAT_Sweden_nationalists.24.desc: "[FROM.GetName]接受了我們的提議。一旦時機成熟，他們就同意兩國無條件和平，以便我們可以共同拿下[GER.GetName]。"
 AAT_Sweden_nationalists.24.a: "這肯定是權宜之計，但也是必要之計"
 AAT_Sweden_nationalists.25.t: "[FROM.GetName]拒絕我方提案"
 AAT_Sweden_nationalists.25.desc: "[FROM.GetName]拒絕了我們的提議。這本就是無可奈何之策，不過是絕望的環境造就了絕望的掙扎罷了。"
 AAT_Sweden_nationalists.25.a: "我等似是要踽踽獨行了"
 AAT_Sweden_nationalists.26.t: "[FROM.GetName]造反"
 AAT_Sweden_nationalists.26.desc: "上午早些時候，我們與駐[FROM.GetName]的外交大使失去了聯繫，執行駐守任務的幾個旅似乎全部投降了。我們試圖向[SWE.GetAdjective]政府致電以尋求解釋，可電話那頭始終保持沉默。太明顯了，我們這個不守規矩的傀儡國翅膀硬了，策劃了一個把我國排除在外的大戰略。"
 AAT_Sweden_nationalists.26.a: "見鬼。(Verdammt.)"
 AAT_Sweden_nationalists.27.t: "[FROM.GetName]聲索[FIN.GetAdjective]領土"
 AAT_Sweden_nationalists.27.desc: "[FROM.GetName]，我們忠實的屬國，請求我們再交給他們一些責任，即授予其[FIN.GetName]領土控制權，如此我們就能減少佔領區負擔，集中力量對付主要敵人。"
 AAT_Sweden_nationalists.27.a: "所見略同"
 AAT_Sweden_nationalists.28.t: "$AAT_Sweden_nationalists.21.t$"
 AAT_Sweden_nationalists.28.desc: "$AAT_Sweden_nationalists.21.desc$"
 AAT_Sweden_nationalists.28.a: "$AAT_Sweden_nationalists.21.a$"
 AAT_Sweden_nationalists.29.t: "$AAT_Sweden_nationalists.22.t$"
 AAT_Sweden_nationalists.29.desc: "$AAT_Sweden_nationalists.22.desc$"
 AAT_Sweden_nationalists.29.a: "$AAT_Sweden_nationalists.22.a$"
 AAT_Sweden_nationalists.30.t: "[FROM.GetName]聲索[FIN.GetAdjective]領土"
 AAT_Sweden_nationalists.30.desc: "[SWE.GetName]，[GER.GetAdjective]的傀儡國，先要求阿道夫·希特勒承認其對我國領土的主權要求。這種不作數的聲索助長雙方日益猖獗的擴張主義。"
 AAT_Sweden_nationalists.30.a: "卑劣的詭計"
 AAT_Sweden_nordic_defense_council.1.t: "瑞典邀請我國加入北歐防務理事會"
 AAT_Sweden_nordic_defense_council.1.desc: "隨著世界各國都在為幾個歐洲大國之間不可避免的衝突做好準備，北歐國家面臨著被捲入接踵而至的衝突中的風險。[FROM.GetAdjective]政府建議我們作為北歐國家組建一個統一的軍隊，以便我們能夠形成更加緊密的防禦。"
 AAT_Sweden_nordic_defense_council.1.a: "我們另有打算。"
 AAT_Sweden_nordic_defense_council.1.b: "我們會作為陣營成員加入。"
 AAT_Sweden_nordic_defense_council.1.c: "我們會作為一體化的成員國加入。"
 AAT_Sweden_nordic_defense_council.2.t: "[FROM.GetName]加入北歐防務聯盟"
 AAT_Sweden_nordic_defense_council.2.desc: "[FROM.GetName]決定加入我們的聯盟。至少現在，一旦不可想像的事情發生，我們不會孤軍作戰。"
 AAT_Sweden_nordic_defense_council.2.a: "太好了"
 AAT_Sweden_nordic_defense_council.3.t: "[FROM.GetName]拒絕北歐防務聯盟提案"
 AAT_Sweden_nordic_defense_council.3.desc: "[FROM.GetName]拒絕加入我們的聯盟，全然不顧日漸緊張的世界局勢。他們似乎對此另有政策導向，我們只能希望他們不會動搖我們在世界舞臺上的地位。"
 AAT_Sweden_nordic_defense_council.3.a: "真是遺憾"
 AAT_Sweden_nationalists.12.t: "貴族歡迎改革"
 AAT_Sweden_nationalists.12.desc: "除了法律專家之外，其他人都不知道我們最近的改革實質上等同於恢復了貴族特權。當然，由於媒體受我們控制，這些專家無法在公眾中傳播不滿情緒。與此同時，貴族成員對這些改革感到欣喜，並期待糾正近幾十年來的錯誤。"
 AAT_Sweden_nationalists.12.a: "希望他們不要擋我們的道。"
 AAT_Sweden_nationalists.13.t: "企業家受經濟改革鼓舞"
 AAT_Sweden_nationalists.13.desc: "企業龍頭對將工會活動定性為犯罪一事表示期待，認為如此一來在未來幾年中，創紀錄的利潤和股息將不難實現。工會遭查禁後，企業家們將能夠擺脫前幾年社民黨設置的重重繁文縟節，從而推動經濟增長。"
 AAT_Sweden_nationalists.13.a: "這樣的改革早該開始了。"
 AAT_Sweden_nationalists.14.t: "軍事計劃擴大化"
 AAT_Sweden_nationalists.14.desc: "負責戰事的大臣宣佈，在參考高級軍官關於該國裝備不足以自衛的建議之後，將進一步增加軍事預算。隨著預算的增加，我們確立了軍隊對新政權的忠誠不受侵蝕。"
 AAT_Sweden_nationalists.14.a: "讓軍隊站在我們這一邊永遠是優先事項。"
 AAT_Sweden_nationalists.15.t: "農村工人繼續支持"
 AAT_Sweden_nationalists.15.desc: "在大規模投資農村基礎建設之後，農村工人成為了對我們政府最為支持的群體之一。憑藉他們的支持和對國家食品供應鏈的影響力，我們現在擁有了一個堅實的支持陣營，可以在未來對城市工人進行控制。"
 AAT_Sweden_nationalists.15.a: "這樣的支持能夠鞏固我們的權力的掌控。"
 SWE_royal_visit_in_progress: "正在進行王室巡幸。"
 SWE_appeal_for_support_in_progress: "已經在謀求一個陣營的支持。"
 AAT_Sweden_communism.1.t: "法西斯反革命怨言"
 AAT_Sweden_communism.1.desc: "我們終於奪得了執政大權。雖然[ROOT.GetDemocraticParty]以民主應有的風度接受了選民的意願，但極右翼黨派幾乎無法接受這樣的流程，他們呼籲群眾質疑選舉的合法性。雖然其現在只是宣洩異議，但我們必須小心謹慎，以免事態進一步擴大。"
 AAT_Sweden_communism.1.a: "令人擔憂"
 AAT_Sweden_communism.2.t: "軍隊不滿"
 AAT_Sweden_communism.2.desc: "一項對軍方的政府調查總結的一份檔案表明，數名高級指揮官與一場意圖破壞民選政府的地下法西斯運動有所關聯。報告指出軍方對國家政治路線的言論正變得愈發大膽，並建議針對此類言論採取行動。"
 AAT_Sweden_communism.2.a: "更令人擔憂了"
 AAT_Sweden_communism.3.t: "武器庫存丟失"
 AAT_Sweden_communism.3.desc: "一項政府調查顯示，軍方庫存中少了一批先進軍用武器。報告指出，目前還無法確定這批武器庫存究竟去了哪裡，但在此事被察覺前，清單上已有高達60%的武器失蹤。"
 AAT_Sweden_communism.3.a: "高層裡鐵定有人做了內鬼。"
 AAT_Sweden_communism.4.t: "[ROOT.GetFascistParty]與軍方控制斯德哥爾摩"
 AAT_Sweden_communism.4.desc: "[?global.date.GetDateStringShortMonth]，隨著國會大廈中傳出幾聲巨響，大量身著棕衫的不明武裝人員現身於首都各地。政府隨即啟動疏散行動，並要求地方警察與國民警衛隊恢復秩序，但得到的回應唯有沉默。謠傳法西斯棕衫軍與高級將領結盟，試圖組建臨時政府。多虧了仍然忠於正統政府的個別軍人，全體幹部都得以逃離陷入戰火的首都。"
 AAT_Sweden_communism.4.a: "我們會回來的。"
 AAT_Sweden_communism.5.t: "元兇畢露"
 AAT_Sweden_communism.5.desc: "秘密的重型武器藏匿點被發現於[ROOT.GetName]各城市中心的倉庫中。記錄表明，為這些倉庫付款的人均與[ROOT.GetFascistParty]保持聯繫。與該黨有聯繫的準軍事組織，即褐衫軍的領導層已悉數被捕。\n於其中一間倉庫發現的信件同時披露了有將軍參與該陰謀，將槍支偷運出庫並篡改庫存記錄。這是此事件中最緊要的發現，因為這表明元兇可能已經控制了軍隊中不小的一部分。"
 AAT_Sweden_communism.5.a: "起訴他們。"
 AAT_Sweden_communism.5.b: "將這些元兇“提拔”到虛職去。"
 AAT_Sweden_communism.6.t: "貝爾納多特王室的命運"
 AAT_Sweden_communism.6.desc: "在這光明的時代依舊墨守君主制，甚至還是一個沒有實權的君主制，也算是奇葩了。即便如此，老國王還是忍不住打探政治活動，即使已經被多次警告這種行為不合適也不合憲法。更糟糕的是，為了追尋沙皇、德皇和列王的舊日輝煌，他正逐漸與政治光譜的最右翼結盟。這不是社會該有的未來，而且我們也早已不需要君主制。是時候為了人民的利益沒收他們的資產，讓他們像普通人一樣生活了——他們本來就是。"
 AAT_Sweden_communism.6.a: "沒收他們的資產，他們可以像其他人一樣工作。"
 AAT_Sweden_communism.7.t: "希爾布姆著手取代弗呂格"
 AAT_Sweden_communism.7.desc: "卡爾·希爾布姆正在著手奪取黨的控制權。黨因此分裂成兩方，一方支持弗呂格，另一方支持希爾布姆。這正使我們已取得的政治勝利面臨威脅。如果情況持續，我們還有可能完全失勢。我們必須決定誰將領導[SWE.GetName]走向光明的未來。"
 AAT_Sweden_communism.7.a: "希爾布姆會領導我們走向未來"
 AAT_Sweden_communism.7.b: "弗呂格就是答案"
 AAT_Sweden_communism__7_tt_1: "這會使我們與同盟國結盟。"
 AAT_Sweden_communism__7_tt_2: "這會使我們與德國人結盟。"
 AAT_Sweden_communism.7.c: "實際上，斯大林主義也許並不是一個壞主意"
 #### DENMARK ####
 denmark_political_events.1.t: "不信任動議"
 denmark_political_events.1.desc: "[Den.GetLeader]領導層最近受到了嚴厲的審查和批評。國會要求首相下臺。"
 denmark_political_events.1.a: "不信任投票"
 denmark_political_events.1.b: "要求提前選舉！"
 DEN_available_candidates_tt: "§Y可用的候選人：§!"
 denmark_political_events.2.t: "為新領導層投票"
 denmark_political_events.2.desc: "國會決定提出對[Den.GetLeader]首相不信任投票的請求。現在的問題是，誰來填補上他的位置？"
 denmark_political_events.2.a: "社民不上臺，國民大混亂！"
 denmark_political_events.2.b: "要自由派政府！"
 denmark_political_events.2.c: "不流血的人民革命！"
 denmark_political_events.2.d: "要傳統和穩定！"
 denmark_political_events.2.e: "得試點新東西了"
 DEN_prime_minister_resigns_tt: "§Y[DEN.GetLeader]§!辭任§Y首相§!"
 denmark_political_events.3.t: "籌備選舉活動"
 denmark_political_events.3.desc: "[GetElectionCampaignDesc]"
 denmark_political_events.3.desc_annual_election: "又是[DEN.GetNameDef]選舉時。各黨派正在制定即將到來的競選活動以召集追隨者並動員選民支持自己的事業。"
 denmark_political_events.3.desc_snap_election: "緊急選舉的呼聲讓[DEN.GetNameDef]的各黨派爭先恐後地組織競選活動，以此招徠選民對自家事業的支持。"
 denmark_political_events.3.a: "民主或混亂"
 denmark_political_events.3.b: "籌備共產黨競選"
 denmark_political_events.3.c: "籌備農民黨競選"
 denmark_political_events.3.d: "籌備法西斯競選"
 denmark_political_events.4.t: "發動民主派競選"
 denmark_political_events.4.desc: "不同的民主黨派似乎在如何組織他們的競選活動上存在著廣泛的爭議。有些人不想加劇已經十分緊張的局勢，並希望在整個競選過程中保持文明的姿態。其他人認為這正是他們需要採取攻勢以贏得壓倒性勝利的時機——遏制更黑暗的潛流。還有人認為他們應該積極攻擊對手，以阻止他們上臺執政。"
 denmark_political_events.4.a: "保持文明行為。"
 denmark_political_events.4.b: "在競選活動上主動出擊。"
 denmark_political_events.4.c: "攻擊我們的對手。"
 denmark_political_events.5.t: "發動$DEN_communism_party$競選"
 denmark_political_events.5.desc: "$DEN_communism_party_long$內部，關於即將到來的選舉活動，掀起了一場爭論。有些人不想加劇已經十分緊張的局勢，並希望在整個競選過程中保持文明的姿態。其他人認為這正是他們需要採取攻勢以贏得壓倒性勝利的時機——遏制更黑暗的潛流。還有人認為他們應該積極攻擊對手，以阻止他們上臺執政。"
 denmark_political_events.6.t: "發動$DEN_neutrality_party$競選"
 denmark_political_events.6.desc: "$DEN_neutrality_party_long$內部就即將到來的選舉活動掀起了一場爭論。有些人不想加劇已經十分緊張的局勢，並希望在整個競選過程中保持文明的姿態。另一些人則認為，為了實現我們關於[DEN.GetNameDef]的願景，我們必須轉向攻勢。還有人認為攻擊我們的對手是唯一能夠削弱對方同時鞏固我方的方法。"
 denmark_political_events.7.t: "發動$DEN_fascism_party$競選"
 denmark_political_events.7.desc: "$DEN_fascism_party_long$內部就即將到來的選舉活動掀起了一場爭論。有些人不想加劇已經十分緊張的局勢，並希望在整個競選過程中保持文明的姿態。另一些人則認為，為了實現我們關於[DEN.GetNameDef]的願景，我們必須轉向攻勢。還有人認為攻擊我們的對手是唯一能夠削弱對方同時鞏固我方的方法。"
 denmark_political_events.8.t: "成立新政府"
 denmark_political_events.8.desc: "丹麥的選舉已經結束。各政黨已經盡力說服人民為他們的事業投票。競選或許已經結束了——但有人會認為最艱難的部分現在才開始：組建一屆政府。首相的選舉將決定[DEN.GetNameDef]在可預見的未來內將朝哪個方向發展。"
 denmark_political_events.8.a: "選擇一名民主派首相。"
 denmark_political_events.8.b: "$DEN_aksel_larsen$將引領我們進入新時代！"
 denmark_political_events.8.c: "$DEN_knud_bach$會讓我們走正道。"
 denmark_political_events.8.d: "讓$DEN_frits_clausen$上臺。"
 denmark_political_events.9.t: "民主派首相"
 denmark_political_events.9.desc: "隨著丹麥的選舉結束，很明顯民主贏得了最終的勝利。與一心一意的共產主義者或步調統一的法西斯主義者不同，民主黨派並非一枝獨秀。不同的政黨對如何最好地引領[Den.GetNameDef]度過未來動盪時期有著自己的願景。問題是，誰應該被允許組建一個新政府？"
 denmark_political_events.9.a: "社會民主黨會讓我們遠離混亂"
 denmark_political_events.9.b: "左翼黨將使我們保持自由和理智"
 denmark_political_events.9.c: "保守人民黨會保護我們"
 denmark_political_events.10.t: "政治反對派"
 denmark_political_events.10.desc: "在我們於上次選舉中取得成功後，破壞我國政府的邪惡謊言便逐漸蔓延。這些謠言的幕後黑手很明顯，但我們對此無能為力。我們不應該對政敵們正利用這些謊言煽風點火而感到驚訝！"
 denmark_political_events.10.a: "法西斯在造謠！"
 denmark_political_events.10.b: "共產黨在造謠！"
 denmark_political_events.11.t: "君主派運動"
 denmark_political_events.11.desc: "[ROOT.GetNameDef]出現了一些腐朽的東西！好不容易有了一個人民執政、為人民服務的政府，但並不是所有人都滿意。一場自稱愛國者的運動如雨後春筍般湧現，團結在過時的君主制制度背後。他們正在獲得一些支持，但似乎並不構成威脅。至今還沒有。"
 denmark_political_events.11.a: "回到你來的陰影裡去!"
 #Occupation Events
 denmark_occupation_event.1.t: "戰或亡"
 denmark_occupation_event.1.desc: "儘管我們已經明確宣佈保持中立，但戰爭已經來到[DEN.GetNameDef]。如果我們及早屈服投降，也許還能保護人民免受戰爭的恐怖。這樣，我們就可以獲得有利的讓步，繼續半獨立地開展行動。"
 denmark_occupation_event.1.a: "我們贏不了這一戰"
 DEN_denmark_keeps_government_form_tt: "[DEN.GetFlag]§Y[DEN.GetNameDefCap]§!會保留當前的政府。\n\n"
 denmark_occupation_event.1.b: "我們必須堅持抵抗！"
 denmark_occupation_event.2.t: "[DEN.GetNameDefCap]投降"
 denmark_occupation_event.2.desc: "我們收到了丹麥政府和[DEN.GetLeader]的電報，其中概述了他們的投降條款。如果我們願意承認並尊重他們的主權和領土完整，他們就會同意放下武器，成為我們事實上的保護國。"
 denmark_occupation_event.2.a: "我們會保護他們"
 denmark_occupation_event.2.b: "不過是條減速帶罷了"
 denmark_occupation_event.3.t: "[FROM.GetNameDefCap]接受我方投降"
 denmark_occupation_event.3.desc: "通過在戰爭初期與[FROM.GetNameDef]簽署有利的和平協議，我們成功地保留了一些獨立性並保持了我們的統治形態。為了維護作為事實上的[FROM.GetAdjective]保護國的相對自由，我們被迫與他們合作並制定廣泛的政治合作政策。暫且如此。"
 denmark_occupation_event.3.a: "我們至少守住了部分獨立自主"
 denmark_occupation_event.5.t: "[FROM.GetNameDefCap]駁回我方提案"
 denmark_occupation_event.5.desc: "[FROM.GetNameDefCap]拒絕了我們慷慨的投降提議，並選擇了暴力和血腥。我們會榨乾[FROM.GetAdjective]軍隊的鮮血，讓他們知道我們不是那麼容易被征服的！"
 denmark_occupation_event.5.a: "為了抵抗，全體丹麥人！(Til modstand, alle danske!)"
 denmark_occupation_event.6.t: "[DEN.GetDanishIndependenceTitle]"
 denmark_occupation_event.6.t_declares_independence: "[DEN.GetNameDefCap]宣佈獨立！"
 denmark_occupation_event.6.t_asks_for_independence: "[DEN.GetNameDefCap]要求獨立"
 denmark_occupation_event.6.desc: "[DEN.GetDanishIndependenceDesc]"
 denmark_occupation_event.6.desc_declares_independence: "丹麥人顯然已經宣佈獨立，並表示他們不再承認我們對他們的霸權。我們給了他們在我們保護下的穩定和安全，這就是我們得到的感謝？"
 denmark_occupation_event.6.desc_asks_for_independence: "我們接待了來自我們忠實附屬國[FROM.GetNameDef]的代表團，由[FROM.GetLeader]本人率領。他們顯然是直接來找[ROOT.GetLeader]討論結束他們受壓迫的狀態，並要求恢復自由。"
 denmark_occupation_event.6.a: "忘恩負義，卑鄙小人！"
 denmark_occupation_event.6.b: "螻蟻何足道"
 denmark_occupation_event.7.t: "丹麥獨立戰爭"
 denmark_occupation_event.7.desc: "[FROM.GetLeader]再次拒絕理性，拒絕承認我們的獨立。我們必須爭取自由併為之奮鬥，因為似乎只有其他出路才能擺脫這種奴役。鮮血將會灑落，但[ROOT.GetNameDef]將再次自由！"
 denmark_occupation_event.7.a: "為了抵抗，全體丹麥人！(Til modstand, alle danske!)"
 denmark_occupation_event.7.b: "正義終將獲勝！"
 denmark_occupation_event.8.t: "丹麥獨立"
 denmark_occupation_event.8.desc: "[FROM.GetLeader]第一次有了理性認知並承認了我們的獨立。看來我們的農奴制已經結束了，沒有發生任何流血事件。"
 denmark_occupation_event.8.a: "真是……出乎預料地簡單"
 denmark_occupation_event.10.t: "反佔領罷工爆發"
 denmark_occupation_event.10.desc: "為表達對佔領時期的抗議，[DEN.GetNameDef]全國各地都爆發了罷工。這是一條和平表達不滿和抗拒的途徑，但如此一來定會傷害到我們同[?DEN.DEN_overlord_nation.GetNameDef]的關係。"
 denmark_occupation_event.10.a: "真是……出人意料"
 denmark_occupation_event.11.t: "反佔領罷工結束"
 denmark_occupation_event.11.desc: "抗議[?DEN.DEN_overlord_nation.GetAdjective]佔領的全國大罷工浪潮業已告一段落。丹麥人民已經用實際行動向佔領者展示了我們的決心，即我等對自由之嚮往同以往任何時候都一樣強烈。"
 denmark_occupation_event.11.a: "這只是個開始"
 denmark_occupation_event.20.t: "成功掠襲武器據點"
 denmark_occupation_event.20.desc: "經過周密規劃、大膽實施，我們的一隊抵抗組織成員成功地發動了一次奇襲，戰利品則是我們名義上宗主國發放的武器。這場行動將極大地鼓舞我們爭取自由而正在進行的鬥爭！"
 denmark_occupation_event.20.a: "這些武器遲早會派上用場。"
 denmark_occupation_event.30.t: "成功破壞民用工廠"
 denmark_occupation_event.30.desc: "這次行動經過了細緻策劃，但所付出的一切準備工作以及枯坐時機都得到了回報。我們成功破壞了向[?DEN.DEN_overlord_nation.GetNameDef]輸送丹麥商品的關鍵工業基礎設施，這大膽的一著限制了我們名義上的宗主國獲得我國產品。"
 denmark_occupation_event.30.a: "大獲成功！"
 denmark_occupation_event.40.t: "成功破壞軍用工廠"
 denmark_occupation_event.40.desc: "抵抗運動的成員花了幾個月的時間策劃了一系列破壞活動，如今計劃忠於付諸實施。破壞關鍵的軍工基礎設施，意味著[?DEN.DEN_overlord_nation.GetNameDef]將更少獲得丹麥造的武器。"
 denmark_occupation_event.40.a: "大獲成功！"
 denmark_occupation_event.100.t: "丹麥調整航線"
 denmark_occupation_event.100.desc: "丹麥政府似乎已經意識到了他們的最大利益所在，並調整了他們的政策以與我們的政策保持一致。我們收到了[FROM.GetLeader]的請求，要求允許他們提升軍事能力並與我們聯手。這將使他們能夠奉行更加激進的外交政策，並更加獨立於我們。"
 denmark_occupation_event.100.a: "歡迎同胞！"
 denmark_occupation_event.100.b: "就那點芝麻大小的軍隊，還好意思和我們貼貼？"
 denmark_occupation_event.101.t: "[FROM.GetNameDefCap]接受我方聯盟提案"
 denmark_occupation_event.101.desc: "明智的[FROM.GetLeader]慷慨地接受我們成為盟友，並認識到我們有能力為戰爭做出貢獻。我們還獲得了提升軍事實力的許可。所有這一切都將使我們能夠奉行更加積極的外交政策，併為我們的宗主國[FROM.GetAdjective]確保北歐的安全。"
 denmark_occupation_event.101.a: "真是榮耀的一天！"
 denmark_occupation_event.102.t: "[FROM.GetNameDefCap]拒絕我方聯盟提案"
 denmark_occupation_event.102.desc: "我們請求在我們兩國之間開展更深入的合作，我們可以向[FROM.GetNameDef]提供幫助，但是[FROM.GetLeader]愚蠢地拒絕了我們伸出的援助之手。看來他們更喜歡獨自行動，而不是依賴盟友。"
 denmark_occupation_event.102.a: "他們低估了我們的實力！"
 denmark_occupation_event.110.t: "[FROM.GetNameDefCap]宣誓效忠"
 denmark_occupation_event.110.desc: "由[FROM.GetLeader]本人率領的丹麥代表團已抵達我國首都，親自宣誓效忠[ROOT.GetLeadr]和[ROOT.GetAdjective]的事業。丹麥政府似乎決心完全接受我們的合作並盡其所能提供幫助。"
 denmark_occupation_event.110.a: "張開雙臂迎接他們"
 denmark_occupation_event.110.b: "我們不需要他們的忠誠。"
 denmark_occupation_event.111.t: "[FROM.GetNameDefCap]歡迎我們的忠誠"
 denmark_occupation_event.111.desc: "[FROM.GetLeader]張開雙臂歡迎[ROOT.GetLeader]，認可我們的價值以及我們為合作伙伴關係帶來的貢獻。這將使我們兩國更加緊密地聯繫在一起，使我們雙方變得更加強大。"
 denmark_occupation_event.111.a: "信任的偉大標誌。"
 denmark_occupation_event.112.t: "[FROM.GetNameDefCap]拒絕我們的忠誠"
 denmark_occupation_event.112.desc: "[FROM.GetLeader]不明智地拒絕了[ROOT.GetLeader]，拒絕了我們的忠誠，削弱了我們的能力和不斷增長的力量。如果我們想重新獲得自由，那麼就只剩下一個選擇：戰爭。"
 denmark_occupation_event.112.a: "我們會教會他們什麼是謙卑！"
 #Resistance Events
 denmark_resistance_event.1.t: "[DEN.GetNameDefCap]尋求我方支持"
 denmark_resistance_event.1.desc: "我們收到了[DEN.GetNameDef]發來的絕密消息，稱其正在暗中結交盟友，以便時機來臨時支持獨立，並從[?DEN.DEN_overlord_nation.GetNameDef]手中奪回主權。我們要在這場衝突中站隊嗎？"
 denmark_resistance_event.1.a: "為了自由的[DEN.GetNameDef]！"
 denmark_resistance_event.1.b: "他們是咎由自取。"
 DEN_supports_denmark_TT: "我們同意支持並與[DEN.GetFlag]§Y[FROM.GetNameDef]§!結盟，如果他們宣佈獨立。"
 denmark_resistance_event.2.t: "[FROM.GetNameDefCap]同意支持我方"
 denmark_resistance_event.2.desc: "[FROM.GetLeader]真是何等的英勇果決，決定在我們重獲自由的鬥爭中秘密給予[FROM.GetAdjective]支持！這對我們來說簡直是幫上了大忙！這一定會在我們從殘暴的宗主國那裡宣佈獨立時給予相當有力的幫助。"
 denmark_resistance_event.2.a: "英勇無畏！"
 denmark_resistance_event.3.t: "[FROM.GetNameDefCap]拒絕了我們的求助"
 denmark_resistance_event.3.desc: "[FROM.GetLeader]真是何等的懦弱不堪，決定不支持[FROM.GetAdjective]為重奪自由的鬥爭。我們必須轉覓他處以獲支持。"
 denmark_resistance_event.3.a: "鼠輩！(Fordømt!)"
 denmark_resistance_event.4.t: "[DEN.GetNameDefCap]要求武器"
 denmark_resistance_event.4.desc: "我們收到了[DEN.GetNameDef]的請求，要求為他們提供武器來武裝進行反抗運動，幫助他們重獲自由。"
 denmark_resistance_event.4.a: "向他們提供我們有的裝備。"
 denmark_resistance_event.4.b: "我們沒有多餘的裝備……"
 denmark_resistance_event.5.t: "[FROM.GetNameDefCap]同意輸送武器"
 denmark_resistance_event.5.desc: "[FROM.GetAdjective]現已決定回應我國對武器的要求，並計劃空投物資。抵抗組織的成員已與[FROM.GetAdjective]情報部門協調好了交貨的地點和時間。"
 denmark_resistance_event.6.t: "[FROM.GetNameDefCap]拒絕我國對武器的要求"
 denmark_resistance_event.6.desc: "我們向[FROM.GetAdjective]盟友要求武器，但慘遭拒絕。他們婉拒的理由是其自家庫存也不充裕。"
 denmark_resistance_event.7.t: "[DEN.GetNameDefCap]呼籲我國支持"
 denmark_resistance_event.7.desc: "[DEN.GetNameDefCap]宣佈從殘暴的宗主國手中獨立了。據報道，[?DEN.DEN_overlord_nation.GetAdjective]元首[?DEN.DEN_overlord_nation.GetLeader]在獲知此事後破口大罵，捶胸頓足。丹麥現呼籲我國履行盟約，允許其加入我國同盟。"
 denmark_resistance_event.7.a: "與他們聯合起來！"
 denmark_resistance_event.7.b: "時代變了……"
 denmark_resistance_event.7.c: "這由不得我們選"
 denmark_resistance_event.8.t: "[FROM.GetNameDefCap]邀請我們加入他們的陣營"
 denmark_resistance_event.8.desc: "[From.GetLeader]履行了協議，並邀請我們加入他們的陣營。"
 denmark_resistance_event.9.t: "[FROM.GetNameDefCap]撤回此前協議"
 denmark_resistance_event.9.desc: "[From.GetLeader]丟盡了臉，違背了協議，還拒絕邀請我們加入他們的陣營！"
 denmark_resistance_event.9.a: "背信棄義的叛徒！"
 denmark_resistance_event.10.t: "[FROM.GetNameDefCap]要求[DEN.GetNameDefCap]加入我方陣營"
 denmark_resistance_event.10.desc: "我們剛剛得知，[FROM.GetNameDef]顯然已經與[DEN.GetNameDef]簽署了一項協議，支持他們的宣佈獨立並共同聯合起來。[FROM.GetLeader]現在堅持要求我們遵守並維護與丹麥人的協議。"
 denmark_resistance_event.10.a: "這會強化整個聯盟。"
 denmark_resistance_event.10.b: "我們不會因為履行他們的協議而束手束腳。"
 denmark_resistance_event.11.t: "[DEN.GetNameDefCap]提議情報共享"
 denmark_resistance_event.11.desc: "我們情報部門的成員同他們的丹麥同行進行了接觸，他們希望在我們兩國之間分享情報。這無疑會有利於我們自己的秘密行動，並使兩國受益。"
 denmark_resistance_event.11.a: "俗話說，敵人的敵人就是……"
 denmark_resistance_event.11.b: "我們不需要他們的幫助"
 denmark_resistance_event.12.t: "[FROM.GetNameDefCap]同意與我方交換情報"
 denmark_resistance_event.12.desc: "[FROM.GetAdjective]的情報機構認識到了兩國交換情報的優勢所在，同意了我們的提議。"
 denmark_resistance_event.12.a: "明智的決定"
 denmark_resistance_event.13.t: "[FROM.GetNameDefCap]拒絕與我方交換情報"
 denmark_resistance_event.13.desc: "[FROM.GetNameDef]情報機構的鼠目寸光，堪比其腦瓜的不靈光程度。[FROM.GetAdjective]情報機構的主管沒能認識到兩國交換情報的優勢所在，拒絕了我們的提議。"
 denmark_resistance_event.13.a: "真是不明智的決定"
 denmark_resistance_event.20.t: "丹麥請求收容部隊"
 denmark_resistance_event.20.desc: "我們收到了來自[DEN.GetLeader]的秘密詢問，希望我們從利益出發在[ROOT.GetAdjective]的土地上收容丹麥軍隊，訓練和武裝他們，以備今後徹底解放[DEN.GetNameDef]。我們可以通過給他們貼上“憲兵”的標籤來隱藏他們的人數和真實目的。"
 denmark_resistance_event.20.a: "我們會收容他們"
 denmark_resistance_event.20.b: "我們承擔不起惹怒其宗主國的後果"
 denmark_resistance_event.21.t: "[FROM.GetNameDefCap]同意收容我方部隊"
 denmark_resistance_event.21.desc: "[FROM.GetNameDefCap]慷慨大方地同意收容我們流亡的丹麥旅，待時機成熟再準備恢復[DEN.GetNameDef]的自由。"
 denmark_resistance_event.22.t: "[FROM.GetNameDefCap]拒絕收容我方部隊"
 denmark_resistance_event.22.desc: "[FROM.GetNameDefCap]忘恩負義地拒絕收容我們流亡的丹麥旅，不允許我們待時機成熟再準備恢復[DEN.GetNameDef]的自由。我們必須令覓他處尋求我們需要的援助。"
 denmark_resistance_event.23.t: "[DEN.GetAdjective]請求購買我國舊船"
 denmark_resistance_event.23.desc: "一支丹麥代表團秘密訪問我國，詢問我們是否願意向他們出售一些我們的老舊驅逐艦。[DEN.GetNameDefCap]發現自己正附屬於[?DEN.DEN_overlord_nation.GetNameDef]的統治，而這可能是他們正在集結力量宣佈獨立的明確跡象。我們願意幫助他們恢復獨立嗎？"
 denmark_resistance_event.23.a: "給他們一些老舊的驅逐艦"
 denmark_resistance_event.23.b: "我們承擔不起惹怒他們宗主國的後果"
 denmark_resistance_event.24.t: "[FROM.GetNameDefCap]同意向我們出售驅逐艦"
 denmark_resistance_event.24.desc: "[FROM.GetNameDefCap]已經明智地同意把他們的一些老式驅逐艦賣給我們！我們必須把它們藏起來，不讓[?DEN.DEN_overlord_nation.GetNameDef]看到，只有當時機成熟發動進攻的時候才部署它們。"
 denmark_resistance_event.25.t: "[FROM.GetNameDefCap]拒絕向我們出售驅逐艦"
 denmark_resistance_event.25.desc: "[FROM.GetNameDefCap]非常不明智地回絕了我們請求他們出售一些老舊驅逐艦給我們一事。他們的愚蠢行為並不會妨礙我們建設自己的艦隊，以確保我們的水域。我們將在其他地方尋找更友好的國家。"
 denmark_resistance_event.30.t: "國王的每日騎行"
 denmark_resistance_event.30.desc: "國王已經養成了每天在沒有警衛的情況下騎馬穿過哥本哈根的習慣，這是對佔領國的無聲抗議，並已成為整個國家反對[?DEN.DEN_overlord_nation.GetAdjective]佔領行為的象徵。"
 denmark_resistance_event.30.a: "多勇敢啊！"
 denmark_overlord_events.1.t: "電報危機"
 denmark_overlord_events.1.desc: "我國與[?DEN.DEN_overlord_nation.GetNameDef]之間正在處於一場外交危機之中，起因是我們的國王發出的一封電報。據說，[?DEN.DEN_overlord_nation.GetAdjective]的領導人在國王誕辰之際發來祝壽，卻遭國王本人草草打發，這引起了[?DEN.DEN_overlord_nation.GetLeader]的反感。\n兩國之間關係緊張又不是一時半會的事情，如今狀況不排除是宗主國找的藉口，以便束緊我國獨立性的韁繩，對我國政府橫加干涉。"
 denmark_overlord_events.1.a: "道歉，並嘗試挽回局勢"
 denmark_overlord_events.1.b: "向[?DEN.DEN_overlord_nation.GetLeader]致以最誠摯的問候"
 denmark_overlord_events.2.desc: "偉大的領袖[ROOT.GetLeader]向[FROM.GetNameDef]國王致電祝壽，卻遭草草打發了事。丹麥人現在意識到了這種侮辱的嚴重性，建議派弗雷德里克王儲親自向[ROOT.GetLeader]致歉。\n不過，這也是加強對這個屬國控制力的好機會，此前他們寄居我國籬下卻享受著相當自由的特權。"
 denmark_overlord_events.2.a: "接受他們的致歉"
 denmark_overlord_events.2.b: "無禮，該罰"
 denmark_overlord_events.3.t: "[FROM.GetLeader]接受我方致歉"
 denmark_overlord_events.3.desc: "我們安撫[FROM.GetLeader]的努力似乎起到了作用——暫時如此。"
 denmark_overlord_events.3.a: "危機得以避免"
 denmark_overlord_events.4.t: "[FROM.GetLeader]拒絕我們的道歉"
 denmark_overlord_events.4.desc: "[FROM.GetLeader]簡直蠻不講理，國王陛下不過是在對祝壽的回電上少寫了幾個單詞，居然將其視為對他個人的侮辱，且似是鐵了心要拿這個不幸的誤會上綱上線，以儆效尤。"
 denmark_overlord_events.4.a: "令人遺憾"
 denmark_overlord_events.5.desc: "偉大的領袖[ROOT.GetLeader]向[FROM.GetNameDef]國王致電祝壽，卻遭草草打發了事。更糟糕的是，丹麥人乾脆拒絕承認這是他們國王的失職，也不打算好好道歉。\n這或許是個絕佳的機會，使我們有藉口好好敲打一番我們的屬國，提醒他們這個事實——在我國手底下還坐享特權，豈是理所當然之舉？"
 denmark_overlord_events.5.a: "我們還有更重要的事情要做……"
 denmark_overlord_events.5.b: "無禮，狠狠地罰！"
 denmark_overlord_events.6.t: "電報危機自行消解"
 denmark_overlord_events.6.desc: "[FROM.GetLeader]曾是打算把國王陛下一陣見血的批覆當作侮辱，但我們最終也不打算道歉。看來，這事兒不是沒人注意到，就是沒人願意上心了。"
 denmark_overlord_events.6.a: "承認吧，承認錯在是你們自己罷！"
 denmark_overlord_events.7.t: "[FROM.GetNameDefCap]施加嚴苛政策"
 denmark_overlord_events.7.desc: "作為“電報危機”和[FROM.GetLeader]處理不當的後果，我們慘被施加了嚴苛的政策。"
 denmark_overlord_events.7.a: "這種政策不過是一時的苦難——早晚要翻篇！"
 denmark_overlord_events.10.t: "[FROM.GetNameDefCap]要求[ROOT.GetLeader]辭職"
 denmark_overlord_events.10.desc: "我國與[FROM.GetAdjective]的兩國間關係日益惡化，致使該國外交部發來了正式文書，要求[ROOT.GetLeader]辭職。\n考慮到我們在[FROM.GetAdjective]的“庇護”下享有獨一無二的自治權，進一步惡化兩國間關係或為不明智之舉。"
 denmark_overlord_events.10.a: "我們必須遵從"
 denmark_overlord_events.10.b: "這幹他們什麼事！"
 denmark_overlord_events.11.t: "選舉新首相"
 denmark_overlord_events.11.desc: "是時候選擇一位不僅能治理[ROOT.GetNameDef]，還能應對[FROM.GetAdjective]佔領勢力的人物了。"
 denmark_overlord_events.11.a: "一位民主主義領袖"
 denmark_overlord_events.11.b: "$DEN_knud_bach$"
 denmark_overlord_events.11.c: "$DEN_aksel_larsen$"
 denmark_overlord_events.11.d: "一位法西斯主義領袖"
 denmark_overlord_events.12.desc: "民主的美妙之處，在於它為領導層提供了許多選擇。"
 denmark_overlord_events.12.a: "一位社會民主主義者"
 denmark_overlord_events.12.b: "一位自由主義者"
 denmark_overlord_events.12.c: "一位保守主義者"
 denmark_overlord_events.12.d: "找個局外人"
 denmark_overlord_events.13.desc: "只有鐵腕能引導[ROOT.GetNameDef]向前。"
 denmark_overlord_events.13.a: "$DEN_frits_clausen$"
 denmark_overlord_events.13.b: "$DEN_cay_lembcke$"
 denmark_overlord_events.14.t: "[FROM.GetNameDefCap]進行新首相選舉"
 denmark_overlord_events.14.desc: "丹麥政府遵照我們的要求開始選擇新首相。"
 denmark_overlord_events.14.a: "很好"
 denmark_overlord_events.15.t: "[FROM.GetLeader]拒絕辭職"
 denmark_overlord_events.15.desc: "丹麥政府似乎拒絕了我們的真誠請求，不打算讓[FROM.GetLeader]卸任首相，關上了了兩國間良性合作的大門。我國與丹麥關係惡化的原因，本質上就是這種傲慢無禮的態度！但我們還打算挽救兩國政府間的合作，因此考慮是否需要進行干涉。"
 denmark_overlord_events.15.a: "但現在時機還不成熟"
 denmark_overlord_events.15.b: "給他們一個教訓"
 denmark_overlord_events.15.c: "安排個忠心耿耿的合作者上去"
 denmark_overlord_events.16.desc: "由於我們拒絕屈服於[FROM.GetAdjective]有關[ROOT.GetLeader]辭職的要求，宗主國決定再加一套政策，給我們些敲打，期待我們能學會謙卑與服從。"
 denmark_overlord_events.16.a: "總有一天，輪到我們去教他們什麼是謙卑……"
 denmark_overlord_events.17.t: "[FROM.GetAdjective]疾患組建效忠派政府"
 denmark_overlord_events.17.desc: "[FROM.GetNameDefCap]明確表示，他們的目標是建立一個對[FROM.GetAdjective]更為親近的政府，以此作為[ROOT.GetLeader]拒絕卸任首相之回覆。這意味著，本國的獨立性將大打折扣，除非現在武裝起來反抗暴政——無論準備是否妥當，最後的機會已經擺到了我們面前……"
 denmark_overlord_events.17.a: "我們別無選擇……"
 denmark_overlord_events.17.b: "不自由，毋寧死！(Frihed eller død!)"
 denmark_overlord_events.20.t: "[FROM.GetnameDefCap]要求重組政府"
 denmark_overlord_events.20.desc: "[FROM.GetnameDef]奉[FROM.GetRulingIdeologyNoun]為圭臬，同時極度排斥[ROOT.GetRulingIdeologyNoun]意識形態，這並不是什麼秘密——因此，毫不意外，他們如今再無辦法容忍其屬國繼續照此運作。該國毫不含糊地表示，希望我們放棄[ROOT.GetRulingIdeologyNoun]之路。"
 denmark_overlord_events.20.a: "我們別無選擇——至少為了萬家燈火……"
 denmark_overlord_events.20.b: "我們決不屈服！"
 denmark_overlord_events.21.t: "新政府"
 denmark_overlord_events.21.desc: "我們別無選擇，只能遵從宗主國的意願，現在必須組建新政府。"
 denmark_overlord_events.21.a: "基層民主"
 denmark_overlord_events.21.b: "為了國王和國家。"
 denmark_overlord_events.21.c: "未經革命的共產主義"
 denmark_overlord_events.21.d: "未經流血的法西斯主義"
 denmark_overlord_events.22.t: "民主和自由意味著選擇的多樣化。"
 denmark_overlord_events.22.desc: "民主的美妙之處，在於它為領導層提供了許多選擇。"
 denmark_overlord_events.23.t: "[FROM.GetNameDefCap]屈服並改組政府"
 denmark_overlord_events.23.desc: "我們成功說服丹麥人摒棄錯誤之道，接受[FROM.GetRulingIdeologyNoun]。"
 denmark_overlord_events.23.a: "好的很，真是好得很！"
 denmark_overlord_events.24.t: "[FROM.GetLeader]拒絕放棄權力"
 denmark_overlord_events.24.desc: "[FROM.GetNameDef]的[FROM.GetRulingIdeology]領袖[FROM.GetLeader]拒絕聽從勸告做對國家最好的事。如此渴求權力正是[FROM.GetRulingIdeologyNoun]的行為，我們不應對丹麥人的回應過於驚訝。或許我們不得不拿他們殺雞儆猴……"
 denmark_overlord_events.24.a: "我們稍後就料理他們。"
 denmark_overlord_events.24.b: "那就只好霸王硬上弓了"
 denmark_overlord_events.25.t: "[FROM.GetNameDefCap]計劃組建[FROM.GetRulingIdeology]政府"
 denmark_overlord_events.25.desc: "我們堅定地拒絕了[FROM.GetAdjective]讓我們放棄[ROOT.GetRulingIdeologyNoun]的要求，但我們應該明白他們不會滿意我們的答覆的。[FROM.GetAdjective]的[FROM.GetRulingIdeologyNoun]沒有止境，總是試圖強行獲得權力。"
 denmark_overlord_events.25.a: "跪地求饒——免生靈塗炭之厄。"
 denmark_overlord_events.26.t: "[FROM.GetNameDefCap]要求查禁共產黨派"
 denmark_overlord_events.26.desc: "我們收到了[FROM.GetNameDef]的要求，主要內容是在全國範圍內禁止一切共產主義活動。他們稱，當我們的宗主[FROM.GetAdjective]正在堅決捍衛本國與自由世界，奮勇反抗一個從身體到內心都被共產主義浸透了顏色的國家時，依舊放任這種有害意識形態氾濫的行為與叛徒無異。"
 denmark_overlord_events.26.a: "查禁共產黨派"
 denmark_overlord_events.26.b: "自由意志有倒懸之急，永不屈服！"
 denmark_overlord_events.27.t: "[FROM.GetNameDefCap]查禁共產黨派"
 denmark_overlord_events.27.desc: "我們成功說服了丹麥政府查禁共產黨派，這種我們正與之進行殊死搏鬥的意識形態。勝利者只能有一個，為了[ROOT.GetAdjective]人民的繁榮，我們必須獲勝！"
 denmark_overlord_events.27.a: "向勝利前進！"
 denmark_overlord_events.28.t: "[FROM.GetNameDefCap]拒絕查禁共產黨派"
 denmark_overlord_events.28.desc: "儘管我們進行了懇求和勸說，但丹麥政府還是不明事理，拒絕查禁共產黨派。這種墮落的意識形態似乎已經深深地紮根于丹麥人民的心中，而我們正在與共產主義思想進行殊死搏鬥。勝利者只能有一個，為了[ROOT.GetAdjective]人民的繁榮，我們必須獲勝！"
 denmark_overlord_events.28.a: "我們能贏！贏贏贏！"
 denmark_overlord_events.29.t: "[FROM.GetNameDefCap]要求我國查禁法西斯黨派"
 denmark_overlord_events.29.desc: "我們收到了[FROM.GetNameDef]的要求，主要內容是在全國範圍內禁止一切法西斯主義活動。他們稱，當我們的宗主[FROM.GetAdjective]正在堅決捍衛本國與自由世界，奮勇反抗一個從身體到內心都被法西斯主義浸透了顏色的國家時，依舊放任這種有害意識形態氾濫的行為與叛徒無異。"
 denmark_overlord_events.29.a: "查禁法西斯黨派"
 denmark_overlord_events.30.t: "[FROM.GetNameDefCap]查禁法西斯黨派"
 denmark_overlord_events.30.desc: "我們成功說服了丹麥政府查禁法西斯黨派，這種我們正與之進行殊死搏鬥的意識形態。勝利者只能有一個，為了[ROOT.GetAdjective]人民的繁榮，我們必須獲勝！"
 denmark_overlord_events.31.t: "[FROM.GetNameDefCap]拒絕查禁法西斯黨派"
 denmark_overlord_events.31.desc: "儘管我們進行了懇求和勸說，但丹麥政府還是不明事理，拒絕查禁法西斯黨派。這種墮落的意識形態似乎已經深深地紮根于丹麥人民的心中，而我們正在與法西斯主義思想進行殊死搏鬥。勝利者只能有一個，為了[ROOT.GetAdjective]人民的繁榮，我們必須獲勝！"
 denmark_overlord_events.32.t: "[FROM.GetNameDefCap]要求武器輸送"
 denmark_overlord_events.32.desc: "[FROM.GetAdjective]的軍火儲備似乎要見底了，他們轉而要求我國為其當前的衝突提供武器。\n這也可能是解除我國武裝的詭計，用這種狡猾的方式來防止我們造反，擺脫[FROM.GetAdjective]的枷鎖。"
 denmark_overlord_events.32.a: "交付武器"
 denmark_overlord_events.32.b: "我們真沒剩多少，還得用來自保……"
 denmark_overlord_events.33.t: "[FROM.GetNameDefCap]提供武器"
 denmark_overlord_events.33.desc: "第一批丹麥武器已確認收貨，看來他們有在認真對待我們的要求。"
 denmark_overlord_events.34.t: "[FROM.GetNameDefCap]拒絕提供武器"
 denmark_overlord_events.34.desc: "丹麥政府拒絕了我們輸送武器的要求，給的還是個蹩腳的理由，稱其儲備本身就少，還得用來自保.他們還有臉說自己是中立國，稱什麼派遣軍隊會違反中立原則……"
 denmark_overlord_events.34.a: "這次我們就順其自然吧……"
 denmark_overlord_events.34.b: "他們別想這麼輕易愚弄我們！"
 denmark_overlord_events.35.desc: "[FROM.GetNameDefCap]直接越過了我們的含糊表示，並強加新法案，規定我國工廠必須為其持續供應武器。"
 denmark_overlord_events.35.a: "我們是真的只有這點武器自保吶……"
 denmark_overlord_events.36.t: "[FROM.GetNameDefCap]要求徵兵"
 denmark_overlord_events.36.desc: "看來[FROM.GetAdjective]的人力所剩無幾，他們轉而要求我國為其當前的衝突提供人力。\n這也可能是解除我國武裝的詭計，用這種狡猾的方式來防止我們造反，擺脫[FROM.GetAdjective]的枷鎖。"
 denmark_overlord_events.36.a: "主人的任務罷了……"
 denmark_overlord_events.36.b: "丹麥人決不去異國他鄉上送命！"
 denmark_overlord_events.37.t: "[FROM.GetNameDefCap]同意提供兵員"
 denmark_overlord_events.37.desc: "丹麥政府同意了我們徵兵的要求。該國已經派遣了第一批部隊，來幫助我國應對正在進行的衝突。"
 denmark_overlord_events.38.t: "[FROM.GetNameDefCap]拒絕提供兵員"
 denmark_overlord_events.38.desc: "丹麥政府拒絕了我們的徵兵要求，給的還是個蹩腳的理由，稱其拒絕讓本國公民為外國故慘死他鄉。他們還有臉說自己是中立國，稱什麼派遣軍隊會違反中立原則……"
 denmark_overlord_events.38.b: "那我們就動手來拿了！"
 denmark_overlord_events.39.desc: "在派遣丹麥人到異國參戰送命一事上，[FROM.GetNameDefCap]拒絕了我們的拒絕，並強行施加新法案，規定一定比例的成年男性必須去[FROM.GetAdjective]軍隊服役。"
 denmark_overlord_events.39.a: "豈有此理！"
 denmark_overlord_events.40.t: "[FROM.GetAdjective]全權代表"
 denmark_overlord_events.40.desc: "我們從一份來自[FROM.GetAdjective]外交部的指示得知，[FROM.GetAdjective]領導層已經厭倦了兩國間緊張的關係和脆弱的合作。他們因此決定將我們的合法政府替換為一個全權代表政府——由一位忠於[FROM.GetNameDef]的總督統治。\n這將嚴重限制我國僅有的自治權與主權，乃至造成無法挽回的損害。"
 denmark_overlord_events.40.a: "此間是[FROM.GetAdjective]政府——名義上的罷了"
 denmark_overlord_events.40.b: "[ROOT.GetAdjective]人民決不屈服於此！"
 denmark_overlord_events.41.t: "[ROOT.GetAdjective]全權代表奪權"
 denmark_overlord_events.41.desc: "與我們料想的一樣，丹麥政府向我們的壓力屈服了，我們成功建立了一個統治[FROM.GetNameDef]的全權代表政府。這將加強我國對該國的掌控並使其為我們的事業多出一份力。"
 denmark_overlord_events.41.a: "一切按計劃進行"
 denmark_overlord_events.42.t: "丹麥政府拒絕辭職"
 denmark_overlord_events.42.desc: "我們扶植一個忠誠的全權代表統治[FROM.GetNameDef]的計劃被冥頑不化的丹麥政府和人民搞砸了！建立一個忠於我們事業的政府本可加強我們對該國的掌控，同時讓兩國聯繫更加緊密。"
 denmark_overlord_events.42.a: "我們不會在這事上步步緊逼"
 denmark_overlord_events.42.b: "變革之風少有自願颳起。"
 denmark_overlord_events.43.t: "[FROM.GetNameDefCap]強迫成立全權代表政府"
 denmark_overlord_events.43.desc: "[FROM.GetNameDefCap]再次表明他們不值得信任，他們試圖結束丹麥的獨立。[FROM.GetLeader]無視我們不讓全權代表接管政府的要求，依然任命了一名全權代表。"
 denmark_overlord_events.43.a: "我們不敢在這事上步步緊逼。"
 denmark_overlord_events.43.b: "為自由而戰！"
 denmark_overlord_events.44.t: "[FROM.GetNameDefCap]試圖吞併日德蘭半島！"
 denmark_overlord_events.44.desc: "我們剛剛發現了[FROM.GetAdjective]企圖吞併整個日德蘭半島的無恥計劃。這是不能容忍的!"
 denmark_overlord_events.45.t: "[FROM.GetNameDefCap]割讓日德蘭半島"
 denmark_overlord_events.45.desc: "我們提議接管日德蘭半島的保衛工作，這顯然打破了[FROM.GetLeader]內心的某些東西，他在收到我們的請求後癱倒在椅子上，只是點了點頭。"
 denmark_overlord_events.46.t: "[FROM.GetNameDefCap]拒絕割讓日德蘭半島"
 denmark_overlord_events.46.desc: "我們請求接管日德蘭半島的保衛工作，顯然讓[FROM.GetLeader]大發雷霆，然後拒絕了我們慷慨的提議。"
 denmark_overlord_events.46.b: "無論如何都要接受"
 denmark_overlord_events.47.t: "[FROM.GetNameDefCap]宣稱對我們剩餘的國土擁有主權！"
 denmark_overlord_events.47.desc: "來自[FROM.GetCapitalVictoryPointName]的一個代表團已經抵達，遞交了一份正式聲明，即[ROOT.GetNameDef]全境將正式被納入更大的[FROM.GetNameDef]體系。"
 denmark_overlord_events.48.t: "[FROM.GetNameDefCap]拒絕被吞併"
 denmark_overlord_events.48.desc: "[FROM.GetLeader]給我們發了一封簡短的電報，裡面只有一個詞——“永不”。看來他們不需要我們的全力保護。"
 denmark_overlord_events.48.b: "他們力量微弱，不是我們的對手！"
 #Rearmament Events
 denmark_protection_event.1.t: "[FROM.GetNameDefCap]提出互不侵犯條約"
 denmark_protection_event.1.desc: "今天上午，我們接待了[FROM.GetAdjective]政府的特使，提出與他們簽訂互不侵犯條約。選擇簽署這項協議將意味著與[FROM.GetAdjective]發展更緊密的夥伴關係。"
 denmark_protection_event.1.a: "我們將簽署該項條約"
 denmark_protection_event.1.b: "現在這麼做對我們不利"
 denmark_protection_event.2.t: "[FROM.GetNameDefCap]簽署了互不侵犯條約"
 denmark_protection_event.2.desc: "我們派往[FROM.GetNameDef]的特使帶來了好消息！[FROM.GetAdjective]政府已決定在我們的條約上簽字，現在我們雙方已簽訂了互不侵犯條約。今天對我們兩國來說都是偉大的一天。"
 denmark_protection_event.2.a: "好極了！"
 denmark_protection_event.3.t: "[FROM.GetNameDefCap]拒絕了互不侵犯條約"
 denmark_protection_event.3.desc: "我們派往[FROM.GetNameDef]的特使帶回了壞消息。[FROM.GetAdjective]政府認為，目前簽訂互不侵犯條約不符合他們的最大利益。這很不幸，但我們無法說服他們。"
 denmark_protection_event.3.a: "浪費時間……"
 denmark_protection_event.4.t: "[FROM.GetNameDefCap]提出一項貿易協定"
 denmark_protection_event.4.desc: "我們從[FROM.GetNameDef]獲悉，他們希望增加我們兩國之間的貿易。如此，我們無疑將與[FROM.GetAdjective]建立更緊密的聯繫。"
 denmark_protection_event.4.a: "增進貿易對我們雙方都有利"
 denmark_protection_event.4.b: "我們不需要"
 denmark_protection_event.5.t: "[FROM.GetNameDefCap]接受了貿易協議"
 denmark_protection_event.5.desc: "我們遞交給[FROM.GetAdjective]政府的協議被接受了！我們現在將開始準備落實這項新的貿易協定。"
 denmark_protection_event.5.a: "開始起草條款吧！"
 denmark_protection_event.6.t: "[FROM.GetNameDefCap]拒絕了貿易協議"
 denmark_protection_event.6.desc: "不幸的是，儘管我們盡了最大努力，但我們增進貿易的提議被[FROM.GetNameDef]拒絕了。看來我們只好另尋他處了。"
 denmark_protection_event.6.a: "很不幸"
 denmark_protection_event.7.t: "[FROM.GetNameDefCap]提出一份科研協議"
 denmark_protection_event.7.desc: "[FROM.GetNameDef]提議讓我們兩國共同參與一項科研協議。這樣做將意味著我們彼此分享我們的技術進步。我們該怎麼做呢?"
 denmark_protection_event.7.a: "簽署條約！"
 denmark_protection_event.7.b: "我們沒時間"
 denmark_protection_event.8.t: "[FROM.GetNameDefCap]接受了科研協議"
 denmark_protection_event.8.desc: "今天早上我們收到來自[FROM.GetNameDef]的消息，他們決定接受我們的聯合科研協議。這是個好消息，意味著我們的技術進步只會從現在開始加速。"
 denmark_protection_event.8.a: "很好！"
 denmark_protection_event.9.t: "[FROM.GetNameDefCap]拒絕了科研協議"
 denmark_protection_event.9.desc: "今天上午我們收到[FROM.GetNameDef]方面的消息，他們決定拒絕我們的聯合科研協議。不幸的是，這意味著我們將無法從與[FROM.GetAdjective]政府的任何科技共享中受益。"
 denmark_protection_event.9.a: "令人失望"
 denmark_protection_event.10.t: "[FROM.GetNameDefCap]提議出售領土"
 denmark_protection_event.10.desc: "為了獲得保障，[FROM.GetNameDef]已提出把他們的一些領土賣給我們。這是相當不錯的提議，我們應該仔細考慮如何進行這筆交易。"
 denmark_protection_event.10.a: "成交"
 denmark_protection_event.10.b: "我們不需要"
 denmark_protection_event.11.t: "[FROM.GetNameDefCap]接受了我們出售領土的提議"
 denmark_protection_event.11.desc: "好消息！[FROM.GetNameDefCap]已經接受了我們以出售領土作為擔保的提議。我們必須盡力履行我們的諾言，並準備把相應地契的所有權轉到[FROM.GetAdjective]政府的名下。"
 denmark_protection_event.11.a: "很好！"
 denmark_protection_event.12.t: "[FROM.GetNameDefCap]拒絕了我們出售領土的提議"
 denmark_protection_event.12.desc: "看來我們向[FROM.GetNameDef]出售領土的提議被拒絕了。為了談判的成功，也許下次我們必須在交易中增加一些甜頭。"
 denmark_protection_event.12.a: "這是他們的損失"
 denmark_protection_event.100.t: "[FROM.GetNameDefCap]尋求結盟"
 denmark_protection_event.100.desc: "[FROM.GetNameDef]的[FROM.GetLeader]向我們提出要聯合起來，聲稱如果我們站在一起，我們甚至可以與世界上的強國相媲美。我們要同意嗎？"
 denmark_protection_event.100.a: "很好，我們接受。"
 denmark_protection_event.100.b: "這裡面有蹊蹺。"
 denmark_protection_event.101.t: "[FROM.GetNameDefCap]接受了我們的提議"
 denmark_protection_event.101.desc: "代表[FROM.GetLeader]的外交官向我們提交了[FROM.GetNameDef]對我們最近結盟提議的回應。他們說，很明顯，如果我們不加強我們的防禦和合作，等到戰爭的浪潮襲來，我們都將倒下。"
 denmark_protection_event.101.a: "他們做出了正確的選擇。"
 denmark_protection_event.102.t: "[FROM.GetNameDefCap]拒絕了我們的提議"
 denmark_protection_event.102.desc: "代表[FROM.GetLeader]的外交官向我們表明了[FROM.GetNameDef]對我們最近結盟提議的回應。他們說，很明顯，如果他們加入我們，我們將不公正地試圖影響他們的政策，他們不會從這份提議中得到任何好處，因此拒絕了我們的提議。"
 denmark_protection_event.102.a: "他們沒有意識到他們的行為會產生什麼後果。"
 denmark_protection_event.110.t: "[ROOT.GetAdjective]-[FROM.GetAdjective]聯合軍事演習"
 denmark_protection_event.110.desc: "[FROM.GetAdjective]外交官已經向我們提出了舉行[ROOT.GetAdjective]-[FROM.GetAdjective]聯合軍事演習的要求。以便[DEN.GetNameDef]更好地為未來做好準備，並加強我們兩國之間的合作。"
 denmark_protection_event.110.a: "這樣更好。"
 denmark_protection_event.110.b: "我們沒時間。"
 denmark_protection_event.111.t: "[ROOT.GetAdjective]-[FROM.GetAdjective]聯合軍事演習"
 denmark_protection_event.111.desc: "[FROM.GetNameDefCap]已經接受了我們舉行[ROOT.GetAdjective]-[FROM.GetAdjective]軍事演習的提議，之後，我們共同變強。"
 denmark_protection_event.111.a: "完美！"
 denmark_protection_event.112.t: "不會有[ROOT.GetAdjective]-[FROM.GetAdjective]演習"
 denmark_protection_event.112.desc: "[FROM.GetNameDefCap]粉碎了我們的希望，拒絕了我們的[ROOT.GetAdjective]-[FROM.GetAdjective]聯合軍演。他們認為我們不重要，不值得在……上花費更多的時間和精力。"
 denmark_protection_event.112.a: "這是他們的損失。"
 denmark_protection_event.120.t: "[FROM.GetLeader]希望科技共享"
 denmark_protection_event.120.desc: "[FROM.GetNameDefCap]可能在很多領域落後於其他國家，但在某些領域，他們是出類拔萃的。他們聲稱，兩國實驗室之間更具深度的合作可能會推動雙方都取得有益的突破。我們接受嗎？"
 denmark_protection_event.120.a: "這是個偉大的開端！"
 denmark_protection_event.120.b: "他們想從我們身上榨取錢財。"
 denmark_protection_event.121.t: "[FROM.GetName]接受科技共享"
 denmark_protection_event.121.desc: "[FROM.GetNameDef]的[FROM.GetLeader]心懷感激，欣然接受了我們科技共享的請求，我們的科學家已經開始協調他們的工作。"
 denmark_protection_event.121.a: "團結使我們更強大"
 denmark_protection_event.122.t: "[FROM.GetName]拒絕科技共享"
 denmark_protection_event.122.desc: "[FROM.GetNameDef]的[FROM.GetLeader]忘恩負義，拒絕了我們提議的科技共享，聲稱他們不會從交流中獲得任何好處，而我們只是想從他們的科學專業知識中吸取教訓。"
 denmark_protection_event.122.a: "好吧，那就好好守住你的秘密。"
 denmark_protection_event.130.t: "[FROM.GetNameDefCap]邀請我們加入他們的聯盟"
 denmark_protection_event.130.desc: "[FROM.GetAdjective]外交官向我們提出了一個誘人的提議。他們聲稱我們可以一起加入一個陣營，從而加強和平並相互保護，確保我們任何人都不會受到傷害。我們怎麼說？"
 denmark_protection_event.130.a: "我們將共進退。"
 denmark_protection_event.130.b: "我們奉行孤立。"
 denmark_protection_event.131.t: "[FROM.GetNameDefCap]加入我們的陣營"
 denmark_protection_event.131.desc: "[FROM.GetNameDef]的[FROM.GetLeader]已經接受了我們的請求，一起加入同一陣營，並隨時準備在我們需要的時候幫助我們，只要我們在他們需要的時候也為他們做同樣的事情。"
 denmark_protection_event.131.a: "完美！"
 denmark_protection_event.132.t: "[FROM.GetNameDefCap]不加入我們的陣營"
 denmark_protection_event.132.desc: "[FROM.GetNameDef]的[FROM.GetLeader]拒絕了我們加入我們陣營的提議，他說跟魔鬼打交道對他們沒什麼好處。他們破壞了該地區的穩定，必須迅速處理他們！"
 denmark_protection_event.132.a: "算了，這是他們的損失。"
 denmark_protection_event.200.t: "陸軍演習"
 denmark_protection_event.200.desc: "面對戰爭，重要的是讓陸軍做好應對可能發生的一切的準備。通過進行這些演習，我們的部隊將做好隨時保衛[DEN.GetNameDef]邊境的準備。"
 denmark_protection_event.200.a: "太好了！"
 denmark_protection_event.201.t: "海軍演習"
 denmark_protection_event.201.desc: "面對戰爭，重要的是讓海軍做好應對可能發生的一切的準備。通過進行這些演習，我們的水手將做好隨時保衛[DEN.GetNameDef]水域的準備。"
 denmark_protection_event.201.a: "太好了！"
 denmark_protection_event.202.t: "空軍演習"
 denmark_protection_event.202.desc: "面對戰爭，重要的是讓空軍做好應對可能發生的一切的準備。通過進行這些演習，我們的飛行員將做好充分準備，在需要時保衛[DEN.GetNameDef]的天空。"
 denmark_protection_event.202.a: "太好了！"
 #Conquest Events
 denmark_expansion_event.1.t: "[FROM.GetNameDefCap]要求合併"
 denmark_expansion_event.1.desc: "[DEN.GetAdjective]政府向我們發出最後通牒，要求[ICE.GetNameDef]屈服並納入他們的國家組織。我們必須小心，因為我們的反應可能決定[ICE.GetNameDefCap]作為一個主權國家的未來，或者在最壞的情況下，讓我們更接近戰爭。"
 denmark_expansion_event.1.a: "我們別無選擇，只能接受"
 denmark_expansion_event.1.b: "我們不能屈服於丹麥人！"
 denmark_expansion_event.2.t: "[FROM.GetNameDefCap]接受我國整合提案"
 denmark_expansion_event.2.desc: "今天早上我們收到消息稱，[ICE.GetAdjective]政府慷慨地接受了我們將其領土重新納入[DEN.GetNameDefCap]的提議。這將有助於我們兩國更加有力地共同對抗我們的敵人。"
 denmark_expansion_event.2.a: "很高興他們能明白道理"
 denmark_expansion_event.3.t: "[FROM.GetNameDefCap]拒絕我國整合提案"
 denmark_expansion_event.3.desc: "不幸的是，[ICE.GetAdjective]政府似乎拒絕了我們關於重新統一的建議。至少可以說，這是一個愚蠢的決定，但這不會阻止我們對該島行使我們的權利。"
 denmark_expansion_event.3.a: "開戰……"
 denmark_expansion_event.4.t: "[FROM.GetNameDefCap]索要[ICE.GetNameDef]"
 denmark_expansion_event.4.desc: "今天早上，我們收到消息，[DEN.GetAdjective]政府希望我們將[ICE.GetNameDef]的所有權轉讓給他們。按照他們的說法，這個島嶼領土理應屬於他們的疆域。"
 denmark_expansion_event.4.a: "樂於接受"
 denmark_expansion_event.4.b: "不可接受"
 denmark_expansion_event.5.t: "[FROM.GetNameDefCap]接受我國對[ICE.GetNameDef]的要求"
 denmark_expansion_event.5.desc: "[FROM.GetNameDefCap]似乎已經接受了我們控制[ICE.GetNameDef]的合理要求。看到我們的夥伴國家採取了合理行動，令人鼓舞。"
 denmark_expansion_event.5.a: "[DEN.GetAdjective]的宣稱是絕對的！"
 denmark_expansion_event.6.t: "[FROM.GetNameDefCap]拒絕我國對[ICE.GetNameDef]的要求"
 denmark_expansion_event.6.desc: "令人難以置信的是，[FROM.GetNameDef]竟然拒絕我們的要求！我們對該島擁有合法的主權，如果不和平地把它交給我們，那麼我們就必須用武力奪取它！"
 denmark_expansion_event.6.a: "集結部隊！"
 denmark_expansion_event.10.t: "[FROM.GetNameDefCap]要求我國臣服"
 denmark_expansion_event.10.desc: "看來，[DEN.GetAdjective]政府急於把他們的靴子踩在我們的脖子上。他們“建議”我們在獲取資源的基礎上完全服從他們的統治。如果我們想避免流血，也許我們應該服從，否則，他們可能會向我們宣戰。"
 denmark_expansion_event.10.a: "我們不應該被拖入與鄰國的戰爭"
 denmark_expansion_event.10.b: "[DEN.GetNameDefCap]無權擁有我們的土地"
 denmark_expansion_event.11.t: "[FROM.GetNameDefCap]接受我國傀附提案"
 denmark_expansion_event.11.desc: "好消息！[SWE.GetNameDef]似乎明白，他們最好與我們分享資源。至少現在，他們的國家可以得到我們現代新型軍事力量的保護！"
 denmark_expansion_event.11.a: "[DEN.GetNameDefCap]會越來越大！"
 denmark_expansion_event.12.t: "[FROM.GetNameDefCap]拒絕我國傀附提案"
 denmark_expansion_event.12.desc: "[SWE.GetAdjective]政府的那些蠢貨們決定拒絕我們合理的傀附建議！好吧，如果他們不把他們的資源給我們，那我們就只能自己拿了。"
 denmark_expansion_event.12.a: "準備跨越海峽！"
 denmark_expansion_event.13.t: "[FROM.GetNameDefCap]索要[SWE.GetNameDef]"
 denmark_expansion_event.13.desc: "今天早上我們收到了[DEN.GetAdjective]政府的要求，要求我們將[SWE.GetNameDef]移交給他們的控制。君主之間的家族關係使我們忠於[DEN.GetNameDef]，但我們必須考慮到，無論血緣關係如何，拒絕都可能導致與[DEN.GetNameDef]的戰爭。"
 denmark_expansion_event.13.a: "我們不要激怒他們。"
 denmark_expansion_event.13.b: "[SWE.GetNameDefCap]有我們罩著！"
 denmark_expansion_event.14.t: "[FROM.GetNameDefCap]接受我國對[SWE.GetNameDef]的要求"
 denmark_expansion_event.14.desc: "[NOR.GetAdjective]已經意識到了這一點，並且已經滿足了我們的要求。[SWE.GetNameDefCap]是我們的，現在可以利用他們的資源來為我們的新軍隊提供資金。"
 denmark_expansion_event.14.a: "用於[DEN.GetAdjective]鑄造廠的[SWE.GetAdjective]金屬"
 denmark_expansion_event.15.t: "[FROM.GetNameDefCap]拒絕我國對[SWE.GetNameDef]的要求"
 denmark_expansion_event.15.desc: "[NOR.GetNameDefCap]決定拒絕我們吞併[SWE.GetAdjective]的要求。這是最令人失望的，但是我們不能讓這阻礙我們正確地索取這些資源。"
 denmark_expansion_event.15.a: "那就開戰吧。"
 denmark_expansion_event.20.desc: "來自南方的嚴峻消息，[DEN.GetNameDef]要求[NOR.GetNameDefCap]臣服，並要求我們再次受到[DEN.GetAdjective]的統治，這是自1814年以來的第一次。我們可能為擺脫瑞典人以謀求獨立而進行了艱苦的鬥爭，但我們真的準備好站起來並戰鬥了嗎？丹麥人？"
 denmark_expansion_event.20.a: "我們別無選擇，只能屈膝。"
 denmark_expansion_event.20.b: "我們永遠不會再被另一個國家統治！"
 denmark_expansion_event.21.desc: "[NOR.GetNameDefCap]已經明智地接受了我軍的佔領。我們已經掌控了北方的土地，現在可以考慮在其他方向擴張邊境了。"
 denmark_expansion_event.21.a: "北方陣線已得到保障。"
 denmark_expansion_event.22.desc: "[NOR.GetAdjective]已經用維護其主權的託辭拒絕了我國的兼併提議。這樣的藉口不會阻止我們完成應盡之事。"
 denmark_expansion_event.22.a: "[NOR.GetNameDefCap]將再次屬於[DEN.GetAdjective]！"
 denmark_expansion_event.23.t: "[FROM.GetNameDefCap]索要[NOR.GetNameDef]"
 denmark_expansion_event.23.desc: "作為[NOR.GetNameDef]目前的佔領者，[DEN.GetNameDef]找上門來索要這片土地只是時間問題。其聲稱[NOR.GetNameDef]嚴格來說就是[DEN.GetAdjective]的領土。我們必須選擇：把[NOR.GetNameDef]交給丹麥，或是冒著開戰的風險拒絕他們的要求。"
 denmark_expansion_event.23.a: "我們和[DEN.GetNameDef]沒有矛盾。交給他們吧。"
 denmark_expansion_event.23.b: "[NOR.GetNameDefCap]屬於我們！"
 denmark_expansion_event.24.t: "[FROM.GetNameDefCap]接受我國對[NOR.GetNameDef]的要求"
 denmark_expansion_event.24.desc: "[SWE.GetAdjective]政府看來還是通情達理的！他們已經同意將[NOR.GetNameDef]的所有權移交給我們。很高興能得知他們認為我們是這片土地的合法統治者。"
 denmark_expansion_event.24.a: "好極了"
 denmark_expansion_event.25.t: "[FROM.GetNameDefCap]拒絕我國對[NOR.GetNameDef]的要求"
 denmark_expansion_event.25.desc: "很不幸，[SWE.GetNameDef]已回絕我們對[NOR.GetNameDef]所有權的要求。鑑於我們曾經將這個國家交給他們掌控過，我們本指望他們會知恩圖報，然而這個結果實在是令人失望。"
 denmark_expansion_event.25.a: "唉，那就只能開戰了。"
 denmark_expansion_event.100.t: "[FROM.GetNameDefCap]啟動整合進程"
 denmark_expansion_event.100.desc: "[DEN.GetLeader]已告知我們，其已啟動將我國真正融入大[DEN.GetAdjective]國家的進程。"
 denmark_expansion_event.100.a: "我們別無選擇只能同意。"
 denmark_expansion_event.200.t: "[FROM.GetNameDefCap]索要我國[ICE.GetAdjective]領土"
 denmark_expansion_event.200.desc: "[DEN.GetNameDefCap]似乎認為他們對我國的[ICE.GetAdjective]領土有歷史宣稱。如果我們對此表示同意，那麼我們就有可能因[DEN.GetAdjective]擴張主義而失去我國領土。如果拒絕，則會導致全面戰爭。"
 denmark_expansion_event.200.a: "我們必須接受他們的要求……"
 denmark_expansion_event.200.b: "[ROOT.GetNameDefCap]不會向丹麥人屈服！"
 denmark_expansion_event.201.t: "[FROM.GetNameDefCap]接受我國對[ICE.GetAdjective]的主張"
 denmark_expansion_event.201.desc: "[FROM.GetNameDefCap]做出了明智的選擇，接受了我們對他們領土的合法宣稱。毫無疑問，這是他們政府的明智之舉。"
 denmark_expansion_event.201.a: "談判都沒花多久時間。"
 denmark_expansion_event.202.t: "[FROM.GetNameDefCap]拒絕我國對[ICE.GetAdjective]的主張"
 denmark_expansion_event.202.desc: "不幸的是，[FROM.GetAdjective]政府駁斥了我們的說法。看來我們別無選擇，只能將戰爭引向他們的家門口，以確保[DEN.GetAdjective]的合法權利無虞。"
 denmark_expansion_event.202.a: "也許敵意會讓他們更有誠意。"
 denmark_expansion_event.210.t: "[FROM.GetNameDefCap]索要我國[SWE.GetAdjective]領土"
 denmark_expansion_event.210.desc: "[DEN.GetNameDefCap]似乎認為他們對我國的[SWE.GetAdjective]領土有歷史宣稱。如果我們對此表示同意，那麼我們就有可能因[DEN.GetAdjective]擴張主義而失去我國領土。如果拒絕，則會導致全面戰爭。"
 denmark_expansion_event.210.a: "我們必須接受他們的要求……"
 denmark_expansion_event.210.b: "[ROOT.GetNameDefCap]不會向丹麥人屈服！"
 denmark_expansion_event.211.t: "[FROM.GetNameDefCap]接受我國對[SWE.GetAdjective]的主張"
 denmark_expansion_event.211.desc: "[FROM.GetNameDefCap]做出了明智的選擇，接受了我們對他們領土的合法宣稱。毫無疑問，這是他們政府的明智之舉。"
 denmark_expansion_event.211.a: "談判都沒花多久時間。"
 denmark_expansion_event.212.t: "[FROM.GetNameDefCap]拒絕我國對[SWE.GetAdjective]的主張"
 denmark_expansion_event.212.desc: "不幸的是，[FROM.GetAdjective]政府駁斥了我們的說法。看來我們別無選擇，只能將戰爭引向他們的家門口，以確保[DEN.GetAdjective]的合法權利無虞。"
 denmark_expansion_event.212.a: "也許敵意會讓他們更有誠意。"
 denmark_expansion_event.220.t: "[FROM.GetNameDefCap]索要我國[FIN.GetAdjective]領土"
 denmark_expansion_event.220.desc: "[DEN.GetNameDefCap]似乎認為他們對我國的[FIN.GetAdjective]領土有歷史宣稱。如果我們對此表示同意，那麼我們就有可能因[DEN.GetAdjective]擴張主義而失去我國領土。如果拒絕，則會導致全面戰爭。"
 denmark_expansion_event.220.a: "我們必須接受他們的要求……"
 denmark_expansion_event.220.b: "[ROOT.GetNameDefCap]不會向丹麥人屈服！"
 denmark_expansion_event.221.t: "[FROM.GetNameDefCap]接受我國對[FIN.GetAdjective]的主張"
 denmark_expansion_event.221.desc: "[FROM.GetNameDefCap]做出了明智的決定，接受我們對其領土的合法要求。這無疑是他們政府的明智之舉。"
 denmark_expansion_event.221.a: "談判都沒花多久時間。"
 denmark_expansion_event.222.t: "[FROM.GetNameDefCap]拒絕我國對[FIN.GetAdjective]的主張"
 denmark_expansion_event.222.desc: "不幸的是，[FROM.GetAdjective]政府駁斥了我們的說法。看來我們別無選擇，只能將戰爭引向他們的家門口，以確保[DEN.GetAdjective]的合法權利無虞。"
 denmark_expansion_event.222.a: "也許敵意會讓他們更有誠意。"
 denmark_expansion_event.230.t: "[FROM.GetNameDefCap]索要我國[NOR.GetAdjective]領土"
 denmark_expansion_event.230.desc: "[DEN.GetNameDefCap]似乎認為他們對我國的[NOR.GetAdjective]領土有歷史宣稱。如果我們對此表示同意，那麼我們就有可能因[DEN.GetAdjective]擴張主義而失去我國領土。如果拒絕，則會導致全面戰爭。"
 denmark_expansion_event.230.a: "我們必須順著他們來……"
 denmark_expansion_event.230.b: "[ROOT.GetNameDefCap]不會向丹麥人屈服！"
 denmark_expansion_event.231.t: "[FROM.GetNameDefCap]接受我國對[NOR.GetAdjective]的主張"
 denmark_expansion_event.231.desc: "[FROM.GetNameDefCap]做出了明智的決定，接受我們對其領土的合法要求。這無疑是他們政府的明智之舉。"
 denmark_expansion_event.231.a: "談判都沒花多久時間。"
 denmark_expansion_event.232.t: "[FROM.GetNameDefCap]拒絕我國對[NOR.GetAdjective]的主張"
 denmark_expansion_event.232.desc: "不幸的是，[FROM.GetAdjective]政府駁斥了我們的說法。看來我們別無選擇，只能將戰爭引向他們的家門口，以確保[DEN.GetAdjective]的合法權利無虞。"
 denmark_expansion_event.232.a: "也許敵意會讓他們更有誠意。"
 denmark_expansion_event.300.t: "[FROM.GetNameDefCap]提供資源開採權"
 denmark_expansion_event.300.desc: "[DEN.GetAdjective]政府於今日聯絡我方，稱要提供他們新徵服的$STATE_666$地區的資源開採權。該地區擁有豐富的礦產資源，也許這個提議值得考慮？"
 denmark_expansion_event.300.a: "慷慨至極！簽了！"
 denmark_expansion_event.300.b: "抱歉，用不著"
 denmark_expansion_event.301.t: "[FROM.GetNameDefCap]接受我國提供資源開採權"
 denmark_expansion_event.301.desc: "[FROM.GetNameDefCap]慷慨地接受了我們關於新徵領土上[SWE.GetAdjective]資源權的提議。也許這意味著我們兩國今後可以建立積極的關係。"
 denmark_expansion_event.301.a: "好極了！"
 denmark_expansion_event.302.t: "[FROM.GetNameDefCap]拒絕我國提供資源開採權"
 denmark_expansion_event.302.desc: "不幸的是，[FROM.GetNameDef]拒絕了我們慷慨提供的[SWE.GetAdjective]資源。也許我們最好到別處去談判？"
 denmark_expansion_event.302.a: "多麼無禮"
 denmark_expansion_event.400.t: "中立問題"
 denmark_expansion_event.400.desc: "多年來，[ROOT.GetNameDef]在困擾全球的眾多衝突中總體上一直保持中立。然而，隨著歐洲的緊張局勢再次升級，我們最終必須對中立的含義提出質疑。在過去的幾個世紀裡，大斯堪的納維亞和波羅的海一直是我國的焦點，我們必須決定今後如何處理與它們的關係。"
 denmark_expansion_event.400.a: "現在他們不當法西斯了，我們可以考慮與[GER.GetNameDef]站同一邊"
 denmark_expansion_event.400.b: "不如另立中央，讓別人替我們打工"
 denmark_expansion_event.400.c: "也許我們現在最好不要插手此事……"
 denmark_expansion_event.401.t: "[FROM.GetNameDefCap]尋求結盟"
 denmark_expansion_event.401.desc: "[FROM.GetNameDefCap]曾在世界大戰期間保持中立並一直持續至今，但我們今早接待的[FROM.GetAdjective]代表團顯然表明他們正在考慮放棄這種立場。這可能是讓他們加入我方的好時機。"
 denmark_expansion_event.500.t: "一份盟約"
 denmark_expansion_event.500.desc: "[FROM.GetNameDef]為了聲援歐洲小國，併為它們提供一些安全保障，提議我們兩國結盟。我們應該與我們的[FROM.GetAdjective]朋友結盟嗎？還是我們最好自力更生？"
 denmark_expansion_event.500.a: "我們應該加入[FROM.GetNameDef]！"
 denmark_expansion_event.500.b: "眼下，我們用不上結盟"
 denmark_expansion_event.501.t: "[DEN.GetNameDefCap]爭取到一個盟國"
 denmark_expansion_event.501.desc: "[FROM.GetNameDefCap]已同意接受我們的結盟提議，並正式簽署了他們的宣言。讓我們在未來的歲月裡共同抵禦風暴，確保彼此的安全。"
 denmark_expansion_event.501.a: "好極了！"
 denmark_expansion_event.502.t: "[FROM.GetNameDefCap]拒絕結盟"
 denmark_expansion_event.502.desc: "不幸的是，[FROM.GetNameDef]拒絕了我們的結盟提議。看來，聯合保證安全終究不符合他們的最大利益。"
 denmark_expansion_event.502.a: "太不幸了"
 denmark_expansion_event.600.t: "[FROM.GetNameDefCap]請求科研協議"
 denmark_expansion_event.600.desc: "為了加強我們兩國之間的合作精神，[FROM.GetAdjective]政府要求我們簽署一項科研協議，以便我們能夠共享技術實力。"
 denmark_expansion_event.600.a: "接受，這隻會使我們都變得更強大。"
 denmark_expansion_event.600.b: "我們沒功夫管這個"
 denmark_expansion_event.601.t: "[FROM.GetNameDefCap]加入我方科研協議"
 denmark_expansion_event.601.desc: "好消息！[FROM.GetNameDefCap]已同意與我們開展技術共享合作計劃。這意味著我們將有機會使用他們的先進技術，這必將有助於我們為國家的未來制定計劃。"
 denmark_expansion_event.601.a: "團結一致，更加強大！"
 denmark_expansion_event.602.t: "[FROM.GetNameDefCap]拒絕我方提案"
 denmark_expansion_event.602.desc: "儘管我們盡了最大努力，[FROM.GetAdjective]政府還是決定將他們的技術留給自己。這是不幸的，因為如果我們共同努力，我們的技術能力本可以比現在更進一步。"
 denmark_expansion_event.602.a: "真不幸……"
 denmark_expansion_event.700.t: "[FROM.GetAdjective]的干涉"
 denmark_expansion_event.700.desc: "我們已經發現了[FROM.GetAdjective]在[ROOT.GetNameDef]使用詭計試圖影響公眾輿論的證據。允許丹麥人繼續進行這項活動將給我們帶來嚴重後果。"
 denmark_expansion_event.701.t: "[FROM.GetNameDefCap]阻撓我們的計劃"
 denmark_expansion_event.701.desc: "我們影響公眾輿論使其對我們的事業更加友好的計劃被[FROM.GetAdjective]挫敗了。"
 denmark_expansion_event.800.t: "[FROM.GetNameDefCap]提供保護"
 denmark_expansion_event.800.desc: "[FROM.GetAdjective]代表團已與我們接洽，提出要提供他們的全部軍事力量來保護我們。作為回報，他們只要求我們屈膝……"
 denmark_expansion_event.801.t: "[FROM.GetNameDefCap]接受我們的保護"
 denmark_expansion_event.801.desc: "我們已經收到了[FROM.GetAdjective]政府關於我們提供適當保護的答覆，他們高興地接受了我們的全面保護！"
 denmark_expansion_event.802.t: "[FROM.GetNameDefCap]拒絕我們的保護"
 denmark_expansion_event.802.desc: "我們已經收到了[FROM.GetAdjective]政府關於我們提供適當保護的答覆，遺憾的是，他們拒絕屈服。他們遲早會發現這是一個多麼愚蠢的錯誤。"
 #Fascist Events
 denmark_fascist_event.1.t: "[FROM.GetNameDefCap]尋求我們的支持"
 denmark_fascist_event.1.desc: "今天上午，我們迎來了一個來自[FROM.GetAdjective]法西斯黨的代表團，他們尋求我們的支持，試圖在他們的國家獲得權力。如果我們給予他們援助，那麼這將意味著又有一個國家可能會成為我們事業中值得尊敬的盟友。"
 denmark_fascist_event.1.a: "我們會支持他們掌權！"
 denmark_fascist_event.1.b: "我們現在有更重要的事。"
 denmark_fascist_event.2.t: "[FROM.GetNameDefCap]寄予支持"
 denmark_fascist_event.2.desc: "我們對外部支持的請求似乎得到了回應，[FROM.GetNameDef]已同意伸出援手，幫助我們在政府內部奪取權力。這是我們的政治運動朝著正確方向邁出的一步。"
 denmark_fascist_event.2.a: "太好了！"
 denmark_fascist_event.3.t: "[FROM.GetNameDefCap]拒絕我方請求"
 denmark_fascist_event.3.desc: "不幸的是，[FROM.GetAdjective]政府拒絕為我們推翻國會的企圖提供支持。目前的情況是，我們現在面臨著武裝抵抗政變的可能，這反過來又增加了我們上臺的難度。這令人非常失望。"
 denmark_fascist_event.3.a: "可惡！"
 denmark_fascist_event.3.b: "我們會追尋自己的道路！"
 denmark_fascist_event.20.t: "[FROM.GetNameDefCap]請求科研協議"
 denmark_fascist_event.20.desc: "為了加強我們兩國之間的合作精神，[FROM.GetAdjective]政府要求我們簽署一項科研協議，以便我們能夠共享技術實力。"
 denmark_fascist_event.20.a: "接受，這隻會使我們都變得更強大。"
 denmark_fascist_event.20.b: "我們沒功夫管這個。"
 denmark_fascist_event.21.t: "[FROM.GetNameDefCap]接受我方提案"
 denmark_fascist_event.21.desc: "好消息！[FROM.GetNameDefCap]已同意與我們開展技術共享合作計劃。這意味著我們將有機會使用他們的先進技術，這必將有助於我們為國家的未來制定計劃。"
 denmark_fascist_event.21.a: "我軍將成為北歐國家羨慕的對象！"
 denmark_fascist_event.22.t: "[FROM.GetNameDefCap]拒絕我方提案"
 denmark_fascist_event.22.desc: "儘管我們盡了最大的努力來表現禮貌，[FROM.GetAdjective]政府還是決定將他們的技術留給自己。這太不幸了，畢竟如果我等團結如一，聯合的技術能力本可以比現在更進一步。"
 denmark_fascist_event.22.a: "行吧，別到處亂說就成"
 #Trade Events
 denmark_trade_deal.1.t: "[FROM.GetNameDefCap]提出貿易協議"
 denmark_trade_deal.1.desc: "一個丹麥代表團同我方進行了會見，並提出一個貿易建議。丹麥生產大量的食品，而我們在過去食品需要大量依賴進口。他們最近將其國內貨幣克朗貶值，使他們的農產品更具競爭力。這項貿易協議可以證明對我們都有很大的好處，因為它可以保證我們人民的食品供給，並加強我們的軍隊補給鏈條。"
 denmark_trade_deal.1.a: "這能帶來好處。"
 denmark_trade_deal.1.b: "我們不需要丹麥的產品。"
 denmark_trade_deal.2.t: "[FROM.GetNameDefCap]同意我們的貿易提案"
 denmark_trade_deal.2.desc: "我們的貿易代表團已經從[FROM.GetName]回來了，並取得了積極的成果！[FROM.GetAdjective]已經簽署了擬議的貿易協定，這將增強我們的農業部門，並創造新的工作崗位和就業機會。"
 denmark_trade_deal.2.a: "雙邊共贏的偉大決定！"
 denmark_trade_deal.3.t: "[FROM.GetNameDefCap]拒絕我們的貿易提案"
 denmark_trade_deal.3.desc: "我們的貿易代表團已經從[FROM.GetName]失望地返回。似乎我們沒能讓[FROM.GetAdjective]看到我們的貿易提案有什麼好處——儘管事實上好處多了去了。這將是農業部門的一個挫折，但沒有什麼是我們不能處理的。"
 denmark_trade_deal.3.a: "讓他們餓肚子吧！"
 denmark_trade_deal.4.t: "詢問擴大貿易協定"
 denmark_trade_deal.4.desc: "[FROM.GetLeader]已經向我們派出了一個貿易代表團，要求擴大我們已有的農產品貿易協議。看來，他們對我們的農產品是求之不得的。擴大這一協議將創造更多的就業機會，並進一步鞏固我們農民的經濟基礎。"
 denmark_trade_deal.4.a: "這提議真妙！"
 denmark_trade_deal.4.b: "我們需要的都已經有了。"
 denmark_trade_deal.5.desc: "我們的貿易代表團已經從[FROM.DetName]回來了，還帶來了重大利好的消息！代表團團長向我們報告[FROM.GetLeader]非常希望簽署我們的貿易提案，以擴大協議。"
 denmark_trade_deal.6.desc: "我們的貿易代表團已經從[FROM.DetName]回來了，但帶來了令人沮喪的消息。代表團團長向我們報告，[FROM.GetLeader]對擴大現有貿易協定這一提議非常消極，因為他沒能看到加強我們國家之間的聯繫有什麼好處。"
 denmark_trade_deal.6.a: "真是浪費了好機會！"
 denmark_trade_deal.7.t: "[FROM.GetNameDefCap]取消貿易協定"
 denmark_trade_deal.7.desc: "[ROOT.GetLeader]收到[FROM.GetLeader]的個人電報，通知我們兩國農業貿易協議將停止。對方沒有提供任何解釋，只能讓大家猜測這個突然決定背後的寓意。"
 denmark_trade_deal.7.a: "這下我們能吃更飽了！"
 denmark_trade_deal.7.b: "沒有他們的產品，我們也能過得好。"
 denmark_trade_deal.8.t: "[GetCanceledTradeTitle]"
 denmark_trade_deal.8.t_subjugation_cancelation: "佔領中斷丹麥貿易"
 denmark_trade_deal.8.t_war_cancelation_partner: "戰爭中斷丹麥貿易"
 denmark_trade_deal.8.t_war_cancelation_denmark: "戰爭中斷[FROM.GetAdjective]貿易"
 denmark_trade_deal.8.desc: "[GetCanceledTradeDesc]"
 denmark_trade_deal.8.desc_subjugation_cancelation: "由於[?DEN.DEN_overlord_nation.GetAdjective]入侵併傀附了[DEN.GetNameDef]，所有與丹麥的貿易協議已告終結。"
 denmark_trade_deal.8.desc_war_cancelation_partner: "由於近來兩國間的敵對行動，與[DEN.GetNameDef]的貿易協議已告終結。"
 denmark_trade_deal.8.desc_war_cancelation_denmark: "由於近來兩國間的敵對行動，與[FROM.GetNameDef]的貿易協議已告終結。"
 denmark_trade_deal.8.a: "不幸的事件"
 denmark_trade_deal.8.b: "不管怎麼說，這筆交易到頭了"
 denmark_trade_deal.8.c: "他們不配交易我們的產品！"
 denmark_events.1.t: "危機歲月的終結"
 denmark_events.1.desc: "終於，在經歷了多年的經濟困難之後，大蕭條帶來的痛苦終於成為過去。在危機時期，我們努力穩定[DEN.GetAdjective]經濟，抵消危機給我國帶來的損失。"
 denmark_events.1.a: "一切欣欣向榮"
 DEN_end_of_crisis_consumer_goods_modifier_tt: "$DEN_modify_industrial_capability_dynamic_modifier$\n$MODIFIER_CONSUMER_GOODS_FACTOR$：§Y-10.0%§!\n\n"
 denmark_events.2.t: "人民安全感增加"
 denmark_events.2.desc: "自從我們努力籌集資金來加強邊境防禦以來，我們不斷收到公眾的報告，稱他們開始感到更安全，特別是關於歐洲日益嚴重的大動盪。望這些防禦工事能夠阻止未來任何可能計劃佔領[DEN.GetNameDef]的人。"
 denmark_events.2.a: "安全高於一切"
 denmark_events.100.t: "丹麥國王尋求庇護！"
 denmark_events.100.desc: "在全面革命席捲[DEN.GetNameDef]之後，我們收到消息，丹麥國王及其家人在我國尋求避難。接納一位流亡君主並非易事，因此，在做出如此重大的決定之前，我們應該權衡自己的選擇。我們會幫助丹麥國王嗎？還是將他送往別處？"
 denmark_events.100.a: "收留他，我們幫他復國"
 denmark_events.100.b: "丹麥國王？可算了吧"
 denmark_events.200.t: "索瓦爾德·斯陶寧逝世"
 denmark_events.200.desc: "著名政治家索瓦爾德·斯陶寧去世。他曾擔任過幾屆丹麥首相，受到許多人的欽佩。在他生命的最後階段，他越來越擔心歐洲社會民主主義的未來。"
 denmark_events.200.a: "讓他安息。"
 denmark_events.201.t: "國王克里斯蒂安十世逝世"
 denmark_events.201.desc: "國王克里斯蒂安十世昨晚悄然去世，他統治丹麥臣民三十五年，帶領這個國家度過了歐洲最動盪的時期。他的兒子腓特烈九世繼承了他的王位。"
 denmark_events.201.a: "國王萬歲！"
 denmark_events.300.t: "新公司成立"
 denmark_events.300.desc: "我們一磚一瓦地重建了我們的經濟，幾乎每天都有新公司成立，國家正在走向繁榮。隨著一些公司開始試驗如何利用塑料，技術上的騰飛也在發生。"
 denmark_events.300.a: "樂高！"
 denmark_events.666.t: "大丹麥崛起"
 denmark_events.666.desc: "長久以來，我國的存在感江河日下，我們都料想往日輝煌已是一去不還。我們打消了所有復興的夢想，未曾回心轉意——直到現在。我們正面臨一個嶄新的黃金時代！我們的實力和影響力與日俱增，是時候宣告大丹麥的成立了。"
 denmark_events.666.a: "讓我們的榮光照耀世界！"
 denmark_events.666.b: "這似乎有點多餘了……"
 #Iceland
 iceland_events.1.t: "丹麥遭到攻擊"
 iceland_events.1.desc: "[?ICE.overlord_attacker.GetAdjective]軍隊對丹麥發動了攻擊。[ROOT.getName]已經發表了一份中立聲明，並希望這能得到各方的尊重。\n由於國王缺席，$ICE_sveinn_bjornsson$被宣佈出任攝政，並迅速接管了[ROOT.GetName]的內政外交。當然，這是局勢穩定、世界和平前的臨時措施，但現如今，無論從哪個方面來講，[ROOT.GetName]都在履行都作為主權國家的職責了。"
 iceland_events.1.a: "我們將繼續關注這個臨時狀態"
 #News Events
 aat_news.1.t: "冰島宣佈中立"
 aat_news.1.desc: "冰島阿爾庭議會發表聲明，宣佈冰島在丹麥和[?ICE.overlord_attacker.GetName]之間的衝突中保持中立。\n議會同時宣佈，由於沒有國王，將由$ICE_sveinn_bjornsson$出任攝政；與此同時，$ICE_sveinn_bjornsson$還將負責冰島的外交政策。聲明指出，這項措施是臨時性的。一旦衝突結束，冰島將恢復與丹麥的戰前關係。不過，至少在那一天到來之前，冰島在事實上已經獨立了。"
 aat_news.1.a: "中立救不了丹麥"
 aat_news.2.t: "[ICE.GetAdjective]-[USA.GetAdjective]合作"
 aat_news.2.desc: "發生了一件令所有人吃驚的事件：[USA.GetAdjective]政府宣佈，[ICE.GetName]屬於該國利益範圍，並且在[ICE.GetAdjective]政府的請求下，同意部署軍隊保護[ICE.GetName]。從此，冰島的一切外交政策都將由[USA.GetAdjective]政府接管，[ICE.GetName]在事實上已經成為了[USA.GetAdjective]的傀儡。"
 aat_news.2.a: "這一著挺有意思"
 iceland_events.2.t: "[FROM.GetName]請求[ROOT.GetAdjective]庇護"
 iceland_events.2.desc: "駐[ROOT.Capital.GetCapitalVictoryPointName]的[ICE.GetAdjective]大使要求我國向[FROM.GetName]派遣部隊。換句話說，他們要求得到[ROOT.GetAdjective]的保護，以免遭受可能的入侵。該國提議，以其外交政策的把控大權為代價，換取我國保護。"
 iceland_events.2.a: "一個好機會"
 iceland_events.2.b: "不，他們必須自己解決問題"
 iceland_events.2.c: "我們不能損害[ROOT.GetAdjective]與[FROM.OVERLORD.GetAdjective]的關係"
 iceland_events.3.t: "[FROM.GetNameDefCap]同意"
 iceland_events.3.desc: "[FROM.GetAdjective]政府接受了我國的請求，由其接管[ROOT.GetName]防務。希望這種安排對我國有利，不僅是免於遭到入侵的風險，而且[FROm.GetAdjective]的承諾在經濟層面上也會對本島產生影響。"
 iceland_events.3.a: "至少現在安全了，大概"
 iceland_events.4.t: "[FROM.GetNameDefCap]拒絕"
 iceland_events.4.desc: "不幸的是，[FROM.GetLeader]並不想為[ROOT.GetName]站臺。[FROM.GetLeader]掰扯了一堆[FROM.GetNameDef]自身難保之類有的沒的裡有，到頭來還是不敢聲明[FROM.GetNameDef]會護著[ROOT.GetNameDef]。"
 iceland_events.4.a: "我們得找其他出路了"
 iceland_events.5.t: "西班牙的戰事"
 iceland_events.5.desc: "西班牙爆發了武裝叛亂，這使得冰島向該地區的出口額大幅下跌。該國曾是冰島乾魚的主要進口國。這不僅衝擊了我國漁業，而且擴散到了冰島的各行各業，畢竟這是世界大戰和大蕭條後少數幾個開始復甦的行業之一。"
 iceland_events.5.a: "這是一個預兆"
 iceland_events.5.b: "末日將近！"
 iceland_events.5.c: "笨蛋，問題是經濟！"
 iceland_events.5.d: "我希望生活在更開明的時代……"
 iceland_events.6.t: "對等夥伴"
 iceland_events.6.desc: "[FROM.GetLeader]發佈了一份正式聲明，稱由於[FROM.GetName]與丹麥一同參與戰爭並承擔了自己的責任，因此不再需要丹麥在外交政策或任何其他關於[FROM.GetAdjective]政治的事務上提供指導。這無疑是一種事實上的獨立宣言。"
 iceland_events.6.a: "說實話，我們對此無能為力"
 iceland_events.6.b: "這群傲慢的傢伙，戰爭結束以後我們再和他們算賬"
 iceland_events.7.t: "[FROM.GetName]接受我國獨立"
 iceland_events.7.desc: "除了丹麥議會多少有點牢騷外，並沒有多少人真正的反對我國享有與丹麥的對等地位的宣言。丹麥人理解我方立場，並考慮到兩國並肩作戰的現狀，最終認為面向未來的治理與合作，比起面向過去的封建制度和民族自豪，要更為重要。克里斯蒂安國王已按我方的要求放棄冰島王位，我們如今已經成為了是一個擁有完全主權的國家。然而，君主制問題仍然是件棘手的事，我國現在正躋身於沒有國王的王國之列……"
 iceland_events.7.a: "我們不需要國王"
 iceland_events.7.b: "丹麥王室的成員其實還有不少……"
 iceland_events.8.t: "來自冰島的請求"
 iceland_events.8.desc: "我們在海對面的小兄弟意識到，沒有國王的王國實在是過於弔詭。因此，他們現在又向我國提出要求，希望請一位丹麥王室的王儲前去加冕為冰島國王。他們稱，這是兩國未來友誼的象徵。"
 iceland_events.8.a: "又一次機會——對於克努特王儲來說"
 iceland_events.8.b: "我可不覺得那個是好主意"
 iceland_events.9.t: "丹族王再臨"
 iceland_events.9.desc: "我們同[FROM.GetAdjective]王室的磋商有了結果。克努特王儲接受了提議，加冕成為冰島國王。"
 iceland_events.9.a: "[ROOT.GetName]的統治者，克努特王萬歲！"
 iceland_events.9.b: "可以，不過我們仍需確保其權力受限"
 iceland_events.10.t: "磋商不利"
 iceland_events.10.desc: "我們與丹麥王室的磋商無果而終，那幫遺老仍對[ROOT.GetName]脫離[DEN.GetName]而自謀獨立一事心存不滿。也許是時候一刀兩斷，撇乾淨關係了。"
 iceland_events.10.a: "我宣佈個事，走向共和！"
 iceland_events.11.t: "[FROM.GetName]不悅"
 iceland_events.11.desc: "儘管我們聲嘶力竭的去勸導，但[FROM.GetName]仍拒絕接受[ROOT.GetName]脫離[FROM.Capital.GetCapitalVictoryPointName]方面管制而獨立這一事實，他們甚至還企圖用武力來威脅我們。然而，他們現在已經沒那麼多機會得逞了，因為[ROOT.GetName]已經著手於建設一支負責國防的武裝力量。"
 iceland_events.11.a: "我們要前進的方向，已經被決定好了"
 iceland_events.12.t: "[FROM.GetLeader]索要補償"
 iceland_events.12.desc: "[FROM.GetLeader]要求我們，對[FROM.GetAdjective]多年來協助[ROOT.GetName]——特別是近來的困難時期——的付出作出領土補償。[FROM.GetLeader]稱，這將有助於[FROM.GetNameDef]的發展，並保持其在未來繼續支持[ROOT.GetName]的能力；同時，比起我們，[FROM.GetName]自認為能更好地保衛這些島嶼。"
 iceland_events.12.a: "[101.GetName]和[337.GetName]都可以讓給他們"
 iceland_events.12.b: "不行，他們那點努力可不值得如此豐厚的回報"
 iceland_events.12.c: "給他們一座島嶼應該沒什麼損害"
 iceland_events.13.t: "[101.GetName]和[337.GetName]成為[ROOT.GetAdjective]領土"
 iceland_events.13.desc: "[FROM.GetLeader]完全理解並支持我們正當的補償要求。[FROM.GetName]已經決定將[101.GetName]和[337.GetName]都移交給[ROOT.GetName]。他們一致認為，我們在保衛這兩個島嶼方面處於更有利的地位，建立一個更強大的[ROOT.GetName]符合所有人的最佳利益。"
 iceland_events.13.a: "我們的帝國日漸強盛。"
 iceland_events.14.t: "[FROM.GetLeader]拒絕"
 iceland_events.14.desc: "不幸的是，我們要求對多年來給予[FROM.GetName]的所有幫助進行補償的正當而謙卑的請求被置若罔聞了。[FROM.GetLeader]拒絕給我們任何東西，儘管這樣做符合[FROM.GetName]的最佳利益。"
 iceland_events.14.a: "我們必須靠武力奪取我們應得的東西。"
 iceland_events.15.t: "[FROM.GetName]給予補償"
 iceland_events.15.desc: "幸運的是，[FROM.GetAdjective]政府理解我們的需求，並同意了我們的領土補償請求。[ROOT.GetName]當然需要支付一小筆錢來補償[FROM.GetName]，但目前來看，這只是一個小問題。"
 iceland_events.15.a: "[ROOT.GetName]驕傲的一天。"
 iceland_events.17.t: "[FROM.GetNameDefCap]宣佈獨立"
 iceland_events.17.desc_kingdom: "[FROM.getAdjective]國會已經宣佈它與克里斯蒂安十世的關係是空洞而無效的。他們不再認可丹麥的國王作為冰島的國王。因此，他們表示丹麥對[FROM.getName]的政治不再有任何影響，無論是內部事務還是外交政策。"
 iceland_events.17.desc_generic: "[FROM.getAdjective]國會已經宣佈[FROM.GetNameDef]是一個完全獨立的主權國家，與任何其他國家沒有任何聯繫。這意味著他們已經正式與我們決裂，單方面宣佈獨立。"
 iceland_events.17.a: "我們還有更加緊迫的問題。"
 iceland_events.17.b: "當時機成熟時，我們會處理此事。"
 iceland_events.18.t: "[FROM.GetNameDefCap]同意[ROOT.GetAdjective]獨立"
 iceland_events.18.desc: "[FROM.GetNameDefCap]只是對此表示了輕微的抗議。他們不敢進一步挑釁[ROOT.GetAdjective]人民。[ROOT.GetNameDefCap]現在可以專注於更加緊迫的問題，而不用再糾結與[FROM.GetName]的關係。"
 iceland_events.18.a: "好。"
 iceland_events.19.t: "[FROM.GetNameDefCap]拒絕接受[ROOT.GetAdjective]獨立"
 iceland_events.19.desc: "[FROM.GetNameDefCap]的好戰派已經決定不批准他們所提出的給予我們獨立的條約。相反，他們堅持認為[ROOT.GetName]是[FROM.GetName]的一部分，威脅要通過使用武力重新建立臣屬關係。我們現在必須為即將到來的風暴做準備。"
 iceland_events.19.a: "他們可以試試。"
 iceland_events.20.t: "[ICE.GetName]要求我們歸還格陵蘭"
 iceland_events.20.desc: "[ICE.GetNameDef]的[ICE.GetLeader]已經宣佈建立一個新的北海帝國，該帝國以古老的維京人帝國邊界為基礎。由於格陵蘭島是這種疆域的一部分，現在他們善意地要求我們將該島移交給他們。"
 iceland_events.20.a: "不值得為此開戰……"
 iceland_events.20.b: "他們沒有合適的論據去要求這個。"
 iceland_events.21.t: "格陵蘭島迴歸！"
 iceland_events.21.desc: "[FROM.GetNameDef]軟弱的領導人決定讓我們控制格陵蘭島，因為他們似乎不想冒險與我們發生衝突。這證明我們的榮耀時刻再次到來了！"
 iceland_events.21.a: "好消息"
 iceland_events.22.t: "[FROM.GetName]桀驁不屈"
 iceland_events.22.desc: "[FROM.GetNameDef]的[FROM.GetLeader]在格陵蘭島議題上始終冥頑不化。看上去他們很想被我們的刀劍摧毀，如果這就是他們想要的，那我們應該讓他們如願以償。"
 iceland_events.22.a: "他們定會滅亡！"
 iceland_events.23.t: "[ICE.GetName]自冠“北海航道的守護者”"
 iceland_events.23.desc: "[ICE.GetLeader]已公開宣佈[ICE.GetNameDef]為北海的守護者。[ICE.GetNameDefCap]屆時將成為北海諸島人民安全的保障者。\n因此，按照[ICE.GetLeader]的說法，[ROOT.GetNameDef]應該將我們北海領土的控制權割讓給[ICE.GetName]。"
 iceland_events.23.a: "不值得為豆大的幾座小島費勁出兵"
 iceland_events.23.b: "狂妄自此而終"
 iceland_events.24.t: "[FROM.GetNameDefCap]屈從於我國要求"
 iceland_events.24.desc: "[FROM.GetNameDef]軟弱的領導人決定將他們北海領土的控制權割讓給我們，因為他們似乎不想冒險與我們發生衝突。"
 iceland_events.24.a: "帝國再進一步"
 iceland_events.25.t: "[FROM.GetName]持續挑釁"
 iceland_events.25.desc: "[FROM.GetNameDef]的[FROM.GetLeader]拒絕將他們的北海領土交給我們。他們嘲笑了我們的要求，還說如果我們想要這些島嶼，就得通過武力奪取。"
 iceland_events.25.a: "該布武了"
 iceland_events.45.t: "總統選舉"
 iceland_events.45.desc: "是時候讓[ROOT.GetName]擺脫君主制的束縛了。前進的道路在於人民，以及他們選出來的總統。"
 iceland_events.45.a: "$ICE_sveinn_bjornsson$是完美的領導人"
 iceland_events.45.b: "$ICE_hermann_jonasson$曾為國家做出了巨大貢獻"
 iceland_events.45.c: "$ICE_olafur_thors$可以領導我們走向未來"
 iceland_events.45.d: "$ICE_brynjolfur_bjarnason$能夠團結人民"
 iceland_events.45.e: "$ICE_gisli_sigurbjornsson$會為[ROOT.GetName]帶來榮耀"
 iceland_events.26.t: "我國石油枯竭！"
 iceland_events.26.desc: "我們的海上煉油廠報告說，[ICE.GetName]附近已經找不到石油了。油田已經乾涸，預計今後不會再發現石油或天然氣區，繼續運行只會浪費資源。"
 iceland_events.26.a: "好吧，事實就是事實……"
 ###############
 ### FINLAND ###
 ###############
 AAT_finland_motti.01.t: "[FROM.GetAdjective]柴堆戰術"
 AAT_finland_motti.01.desc: "[FROM.GetAdjective]軍隊已開始在[FROM.FROM.GetName]地區實施柴堆戰術。柴堆戰術是一種極具破壞性的戰術，使用此戰術的[FROM.GetAdjective]軍隊將包圍敵軍並切斷其補給，使其無力迎擊。這使侵入部隊在面對[FROM.GetAdjective]的攻勢時十分脆弱，因此若要挺進芬蘭，我們必須迅速採取應對措施，以防敵人佔據上風。"
 AAT_finland_motti.01.a: "保持警惕，準備戰鬥！"
 AAT_finland_motti_tt: "\n§R從現在開始，[FROM.GetNameDefCap]將能夠在其他核心地區準備柴堆戰術。§!"
 AAT_finland_national_defense.01.t: "[?FIN_state_with_weapon_caches.GetName]的[FROM.FROM.GetAdjective]武器藏匿處"
 AAT_finland_national_defense.01.desc: "我方情報部門報告稱，發現了芬蘭設在[?FIN_state_with_weapon_caches.GetName]的武器藏匿處。預計我軍在當地的軍事行動將面臨嚴重阻礙，必須提防當地抵抗組織採取更激進的戰術。如果芬蘭其他地區的抵抗分子發覺這種戰術卓有成效，說不準會給我們派來一些類似的“驚喜”。"
 AAT_finland_national_defense.01.a: "蜉蝣撼樹"
 AAT_finland_national_defense.02.t: "收繳[FROM.FROM.GetName]的[FIN.GetAdjective]武器藏匿處"
 AAT_finland_national_defense.02.desc: "在接到[FROM.FROM.GetName]存在芬軍武器藏匿處的報告之後，我方部隊掃蕩了這一地區。來自部隊的報告稱，有的武器埋在建築物底下，有的藏在傾倒的樹木底下，甚至還有的則包上油紙沉在湖底。我們已經收繳了搜查到的武器，並確信當地不會再被投放更多武器了。至少剩餘的武器數量，肯定不值得擔心。"
 AAT_finland_national_defense.02.a: "不錯的消息"
 AAT_finland_national_defense.02.b: "很好，但以後別再拿藏匿處的事來煩我了"
 AAT_finland_national_defense.03.t: "[FROM.GetName]收繳[FROM.FROM.FROM.GetName]武器藏匿處"
 AAT_finland_national_defense.03.desc: "儘管我們在[FROM.FROM.GetName]用盡一切辦法藏匿武器，敵人還是發現並收繳了我們的武器。還有一些武器未被查獲，但其數量已不足以影響當地的局勢。"
 AAT_finland_national_defense.03.a: "壞消息！"
 AAT_finland_national_defense.03.b: "我方尚有其他要事需要處理"
 FIN_weapon_caches_in_state_tt: "\n武器藏匿處將於存在§Y4年§!後移除。\n解鎖§Y$FIN_finnish_resistance_category$§!系列決議，允許我們主動搜查並收繳武器藏匿處。"
 FIN_weapon_caches_seized_event_spam_tt: "\n我們將收到在芬蘭各地區查獲武器藏匿處的事件。"
 FIN_weapon_caches_seized_event_no_spam_tt: "\n我們將不會收到在芬蘭各地區查獲武器藏匿處的事件。"
 FIN_weapon_caches_seized_by_enemy_event_spam_tt: "\n我們將收到敵方在各地區查獲我方武器藏匿處的事件。"
 FIN_weapon_caches_seized_by_enemy_event_no_spam_tt: "\n我們將不會收到敵方在各地區查獲我方武器藏匿處的事件。"
 AAT_finland_misc_events.01.t: "撤離兒童"
 AAT_finland_misc_events.01.desc: "隨著[GetFinnishWinterWarOrNot]的爆發，[ROOT.GetAdjective]政府已經做出了艱難的決定，將我們國家的兒童疏散到[GetFinnishChildrenDestination]，以確保他們的安全。鑑於平民在衝突中面臨的持續危險，我們已經做出這個令人心碎的決定。\n\n疏散工作是一項龐大的任務，無數家庭被分離，孩子們離開了他們的家園。但是我們必須記住，他們的安全是至關重要的，我們必須竭盡全力保護他們免受傷害。\n\n在[ROOT.GetAdjective]人民忍受戰爭的嚴酷現實時，我們必須懷抱希望，並相信我們的孩子在這個艱難時期將會安全並得到照顧。前方的道路可能會漫長而充滿挑戰，但我們必須堅持下去，在逆境中保持堅強。"
 FIN_winter_war_name: "對[SOV.GetNameDef]冬季戰爭"
 FIN_normal_war: "戰爭"
 FIN_children_destination_sweden: "[SWE.GetNameDef]"
 FIN_children_destination_norway: "[NOR.GetNameDef]"
 FIN_children_destination_denmark: "[DEN.GetNameDef]"
 FIN_children_destination_iceland: "[ICE.GetNameDef]"
 FIN_children_destination_other: "未捲入軍事衝突的中立國家"
 AAT_finland_misc_events.01.a: "救救我們的孩子！"
 AAT_finland_misc_events.02.t: "舞蹈禁令"
 AAT_finland_misc_events.02.desc: "戰爭綿延不修，越來越多的政客及其他領導人物正在推動公開舞蹈禁令，以向在前線搏名的士兵們展現我們的尊重與團結。\n\n持這些觀點的人們認為，於此危殆之時實在不適合跳舞。他們認為，大後方有責任表態支持軍隊，要砍掉一些諸如此類的活動來彰顯我們的戰爭承諾，甚至說不照此行事就得處以罰款乃至拘禁。\n\n雖然但是，也有許多人對如此提議表示厭惡，並援引他國案例，稱鼓勵跳舞能幫助人們忍過戰時嚴苛的生活條件。"
 AAT_finland_misc_events.02.a: "時局且艱，無論多蠢，都得犧牲。"
 AAT_finland_misc_events.02.b: "但這的確挺蠢的"
 AAT_finland_misc_events.03.t: "[?FIN_faction_leader_recieving_resource_rights.GetAdjective]開發援助項目"
 AAT_finland_misc_events.03.desc: "我們對採礦基礎設施的持續投資帶來了與日俱增的產出，但我們不禁會想，若是引進大國的資源和技術，我們一定能取得更大成果。\n\n我們應當聯繫[?FIN_faction_leader_recieving_resource_rights.GetNameDef]，如果他們願意提供資金和專家，將我們的採礦作業提升至新的水平，那我們願意讓他們在開採出的資源中分一杯羹。這件事對雙方都有利可圖。"
 AAT_finland_misc_events.03.a: "對，我們應該聯繫[?FIN_faction_leader_recieving_resource_rights.GetNameDef]索要更多投資"
 AAT_finland_misc_events.03.b: "錯，我們不想受制於人"
 AAT_finland_misc_events.03_tt: "加+1"
 AAT_finland_misc_events.04.t: "償付援助"
 AAT_finland_misc_events.04.desc: "與[?FIN_faction_leader_recieving_resource_rights.GetNameDef]的前幾輪協商進展順利，但現在因為對方的一項重大關切，談判停滯不前。具體來說，就是他們能得到什麼回報。[?FIN_faction_leader_recieving_resource_rights.GetNameDef]看上了我國各地的一些企業，我們得選出幾家，然後向對方提議。\n\n我們可以分出一部分奧盧的馬科拉礦脈產出的礦石、提供佩察莫礦脈的鎳礦、轉運一些運往圖爾庫造船廠的原材料，或給予拉皮的勘探權。"
 AAT_finland_misc_events.04.a: "調配[929.GetName]採礦權"
 AAT_finland_misc_events.04.b: "提供[722.GetName]鎳礦開採權"
 AAT_finland_misc_events.04.c: "轉運[926.GetName]原材料"
 AAT_finland_misc_events.04.d: "給予[148.GetName]勘探權。"
 AAT_finland_misc_events.05.t: "[FROM.GetName]授予我國資源權"
 AAT_finland_misc_events.05.desc: "好消息！多家工業企業聯合起來為[FROM.GetAdjective]採礦業投入了資金、設備和專家，這筆投資已經開始收到開發權方面的回報。我們獲得了[?FROM.FIN_state_given_for_resource_rights.GetName]產出資源的部分權益。\n\n我們應該儘快善加利用這批新資源！"
 AAT_finland_misc_events.05.a: "很好"
 AAT_finland_misc_events.06.t: "[FROM.GetAdjective]在[ROOT.GetName]的軍事投資"
 AAT_finland_misc_events.06.desc: "[FROM.GetName]已經認識到，北歐地區越發達，我們的人民就越富足，共同防禦和貿易也就越對大家有利。為了實現這一夢想，我們首先要做的就是增強共同防禦能力，抵禦外國威脅。\n\n因此，[FROM.GetName]慷慨地為我們提供了工業設備和專家，以協助我們擴大軍事生產。"
 AAT_finland_misc_events.06.a: "我們將好好利用這一點！"
 AAT_finland_misc_events.07.t: "[FROM.GetAdjective]科研開發項目"
 AAT_finland_misc_events.07.desc: "我們的世界在黑暗和不確定之中越陷越深，[FROM.GetName]已經轉向科學和技術的燈塔，希望藉此照亮前路。這個小國近年來已經實現了跨越式的發展，我國亦是如此。他們建議兩國的科學社群聯合起來，分享知識，促進雙方的進步。讓我們點亮命運之光，成為他國的榜樣，引領他們走出黑暗。"
 AAT_finland_misc_events.07.a: "不錯的倡議！"
 AAT_finland_diplomacy.01.t: "[FROM.GetAdjective]提議統一"
 AAT_finland_diplomacy.01.desc: "[FROM.GetNameDef]外交官日前與我國接洽，出於互保和繁榮的目的提議兩國統一。這意味著兩國政府、軍隊和工業將合二為一，以更強大、更團結的陣線對抗那些可能威脅我等安全的敵人。\n\n在這個國際局勢不穩定的時刻，聯合起來或有一定的益處，但最終究竟如何，仍須我們來敲定。"
 AAT_finland_diplomacy.01.a: "聽起來真是個好主意！"
 AAT_finland_diplomacy.01.b: "合作不非得虧掉自治"
 #I couldn't get option b to appear in testing
 AAT_finland_diplomacy.01.c: "沒興趣"
 AAT_finland_diplomacy.02.t: "[FROM.GetAdjective]-[ROOT.GetAdjective]聯盟"
 AAT_finland_diplomacy.02.desc: "我國外交官從[FROM.capital.GetCapitalVictoryPointName]之行凱旋，帶來了一個好消息：[FROM.GetName]同意建立一個更統一的陣線來共抗大敵，因此接受了我方提出的結盟提議。\n\n該國政府官員已經在前往我國首都的路上，來為新領土的順利合併保駕護航。"
 AAT_finland_diplomacy.02.a: "團結使我們更強大！"
 AAT_finland_diplomacy.03.t: "[FROM.GetName]加入[ROOT.GetFactionName]"
 AAT_finland_diplomacy.03.desc: "我國外交官已自[FROM.GetName]訪問之旅歸來。該國雖然承認需要建立更統一的陣線，但並不願意為此放棄所有主權。討論起初十分順利，但考慮到[FROM.GetName]歷史上爭取獨立的鬥爭，[GetDiplomacyDescriptionNiceNotNice] \n\n他們不同意與我國合併，但願意以獨立國家的身份加入我方陣營。"
 FIN_not_nice_desc: "顯然，他們還沒從自己的錯誤中吸取教訓。"
 FIN_nice_desc: "他們的不情願是可以理解的。"
 AAT_finland_diplomacy.03.a: "好極了……"
 AAT_finland_diplomacy.04.t: "[FROM.GetName]拒絕我方提案"
 AAT_finland_diplomacy.04.desc: "我國外交官已自[FROM.GetName]訪問之旅歸來。[FROM.GetAdjective]政府似乎根本不理解團結一致的意義。他們的決策根本沒透露給我們任何理由，我方官員也不清楚如此一來後果將是什麼。\n\n考慮到該國打著什麼小算盤，也許我們應該開始考慮本國防衛措施，抑或是通過什麼別的方式來“確保”他們的……合作。"
 AAT_finland_diplomacy.04.a: "我們將尊重他們的選擇"
 AAT_finland_diplomacy.04.b: "他們這是自己糟蹋了命數"
 AAT_finland_diplomacy.05.t: "[FROM.GetAdjective]請願保護薩普米"
 AAT_finland_diplomacy.05.desc: "看來，[FROM.GetName]打算主動扛起保護北歐薩米土著所謂自由和文化之大旗。\n\n[FROM.GetNameDefCap]請求我國將薩米人傳統領土移交給他們，以便他們能夠統一併保護這個民族。"
 AAT_finland_diplomacy.05.a: "高貴的事業！呈上我們的奉獻！"
 AAT_finland_diplomacy.05.b: "[FROM.GetAdjective]高層拿不到這片領土"
 AAT_finland_diplomacy.06.t: "[FROM.GetAdjective]在薩米領土上作出讓步"
 AAT_finland_diplomacy.06.desc: "好消息！[FROM.GetNameDefCap]已同意將薩米人的文化本土轉交給我國。現在，我們肩負起了保護和傳承當地民族文化的責任。我們收到了薩米族領導人的賀信，他們也希望我國能夠繼續尊重他們的文化和習俗。"
 AAT_finland_diplomacy.06.a: "人民讚揚[FROM.GetLeader]的決定！"
 AAT_finland_diplomacy.07.t: "[FROM.GetName]拒絕我國請願"
 AAT_finland_diplomacy.07.desc: "[From.GetNameDef]拒絕了我們要求統一薩米人領土的開明請願，這簡直就是帝國主義行徑！他們給的官方答覆是對我方意維護當地居民的文化和尊嚴的意圖表示擔憂，但我們明白，這一拒絕背後的真正動機是使其國家在地圖上看起來更大而已。"
 AAT_finland_diplomacy.07.a: "我們對此無能為力"
 AAT_finland_diplomacy.07.b: "薩米人可缺不了我們的照護！"
 AAT_finland_diplomacy.08.t: "[FROM.GetAdjective]施壓要求掌控鐵礦石流動"
 AAT_finland_diplomacy.08.desc: "[FROM.GetNameDefCap]長期依賴我國鐵礦石生產。他們擔心，在全球緊張局勢加劇的狀況下，自恃坐擁北歐列國最強軍力，因而要求控制我國資源豐富的北部地區。他們在名義上的予以保護背後，深藏利用當地資源服務於戰爭的動機。"
 AAT_finland_diplomacy.08.a: "我們沒有辦法反對他們的要求"
 AAT_finland_diplomacy.08.b: "[ROOT.GetAdjective]主權在自家領土上神聖不可侵犯"
 AAT_finland_diplomacy.09.t: "[FROM.GetName]對領土要求退讓"
 AAT_finland_diplomacy.09.desc: "好消息：[From.GetName]明智地決定讓我們直接控制他們資源豐富的地區。我方軍隊正準備進駐當地，產業龍頭也已開始起草計劃，研究如何以最佳方式將該地區供應的原材料納入本國自己的生產體制。"
 AAT_finland_diplomacy.09.a: "[FROM.GetAdjective]為當地人盡到了東道主之誼"
 AAT_finland_diplomacy.10.t: "[FROM.GetName]拒絕我國要求"
 AAT_finland_diplomacy.10.desc: "不幸的是，[FROM.GetAdjective]領導人[FROM.GetLeader]似乎目光短淺，對那些在附近環繞的鯊魚密謀奪取斯堪的納維亞財富的行為漠不關心。我們從[FROM.GetLeader.GetHerHis]的政府那裡得到了明確的答覆，即我們的軍隊將留在我們這邊的邊境，並進一步警告不要在這個問題上繼續施加壓力。\n\n當然，我們自己的目標保持不變，無論他們如何聲稱，我們仍然需要現有的原材料來確保我們自己以及該地區每個人的安全。"
 AAT_finland_diplomacy.10.a: "封閉的思想讓他們無法認清犯下的嚴重錯誤。"
 AAT_finland_diplomacy.10.b: "必須霸王硬上弓了，動員軍隊！"
 AAT_finland_diplomacy.11.t: "[FROM.GetAdjective]提議整合科拉和卡累利阿"
 AAT_finland_diplomacy.11.desc: "[FIN.GetAdjective]，作為民族國家，尚且十分年輕，其民散居於不同國家之中。為了團結更多的芬族同胞，他們向我國提議，請求將東卡累利阿和科拉半島併入[FIN.GetAdjective]民族國家之中。"
 AAT_finland_diplomacy.11.a: "我們願為這個高貴的事業奉上[ROOT.GetAdjective]領土"
 AAT_finland_diplomacy.11.b: "[ROOT.GetAdjective]地盤歸[ROOT.GetAdjective]！"
 AAT_finland_diplomacy.12.t: "[FROM.GetName]接受我國領土要求"
 AAT_finland_diplomacy.12.desc: "偉大的[FROM.GetLeader]已經同意了我們與東卡累利阿統一的提議，並因此將其在該地區的領土移交給了我國。百年修來同船渡，而偉大的[FROM.GetAdjective]人民是芬蘭人民千世的摯友！"
 AAT_finland_diplomacy.12.a: "[FROM.GetLeader]為科拉和卡累利阿人盡到了東道主之誼"
 AAT_finland_diplomacy.13.t: "[FROM.GetLeader]拒絕我國要求"
 AAT_finland_diplomacy.13.desc: "[FROM.GetLeader]宣佈拒絕移交東卡累利阿領土，並稱我們對當地的主張一方面對其沒好處，另一方面會讓當地的[FROM.GetAdjective]蒙難。"
 AAT_finland_diplomacy.13.a: "眼下，我們還沒法在[FROM.GetLeader]面前蹬鼻子上臉……"
 AAT_finland_diplomacy.13.b: "小丑，吃我一記！"
 AAT_finland_diplomacy.14.t: "[FROM.GetAdjective]要求整合[ROOT.GetName]"
 AAT_finland_diplomacy.14.desc: "我們的宗主國[FIN.GetNameDef]要求完全整合我國，他們稱波羅的地區本身就在其影響範圍之內，並認為我們的地區主義最終會導致他們國家的不穩定。"
 AAT_finland_diplomacy.14.a: "非得這樣的話……"
 AAT_finland_diplomacy.14.b: "他們以為自己是誰？"
 AAT_finland_diplomacy.15.t: "[FROM.GetName]成為[ROOT.GetNameDef]的一部分"
 AAT_finland_diplomacy.15.desc: "[FROM.GetAdjective]政府已同意我們的整合提議，並開始重新立法，以適應自治區而非獨立國家的需要。"
 AAT_finland_diplomacy.15.a: "明智的決定"
 AAT_finland_diplomacy.16.t: "[FROM.GetAdjective]高層拒絕我國要求"
 AAT_finland_diplomacy.16.desc: "[FROM.GetAdjective]政府表示，我們的新建議侵犯了我們兩國之前簽署的協議，並援引國際法，稱我們的統一主張既非法又不公正。"
 AAT_finland_diplomacy.16.a: "我們將尊重他們的決定。"
 AAT_finland_diplomacy.16.b: "他們這是往自己臉上塗灰！"
 AAT_finland_diplomacy_nordic: "北歐"
 AAT_finland_diplomacy_baltic: "波羅的海"
 AAT_finland_diplomacy.17.t: "[FROM.GetAdjective]索要[GetBalticOrNordic]領土"
 AAT_finland_diplomacy.17.desc: "[FIN.GetNameDefCap]要求我國將現在控制的、但傳統意義上屬於[GetBalticOrNordic]諸國的一切領土移交給他們。這是他們最近新立的議程，即將[GetBalticOrNordic]地區作為大[FIN.GetAdjective]民族聯邦的一部分加以控制和保護。"
 AAT_finland_diplomacy.17.a: "怎麼樣都好"
 AAT_finland_diplomacy.17.b: "蹬鼻子上臉是吧"
 AAT_finland_diplomacy.18.t: "[FROM.GetName]移交[GetBalticOrNordic]領土"
 AAT_finland_diplomacy.18.desc: "[FROM.GetLeader]明智地同意將他們的[GetBalticOrNordic]領土交給我們，因為他們覺得不值得在這塊地上費心思與我們掰扯。"
 AAT_finland_diplomacy.18.a: "他們做出了正確的選擇"
 AAT_finland_diplomacy.19.t: "[FROM.GetAdjective]政府拒絕我國要求"
 AAT_finland_diplomacy.19.desc: "[FROM.GetLeader]拒絕將其[GetBalticOrNordic]領土移交給我們，稱我們對該地區的領土主張顯而易見的不靠譜。該如何回應這一辱沒我等臉面的決定？"
 AAT_finland_diplomacy.19.a: "沒辦法。"
 AAT_finland_diplomacy.19.b: "知會他們，就說我們直接來拿了"
 AAT_finland_diplomacy.20.t: "[FROM.GetAdjective]提議簽訂《芬蘭-[ROOT.GetAdjective]條約》"
 AAT_finland_diplomacy.20.desc: "[FIN.GetLeader]要求我們簽署我們兩國之間的互不侵犯和永久和平條約。這項提議是[FIN.GetAdjective]政府與鄰國和解並重新接近我們國家的新方向的一部分。"
 AAT_finland_diplomacy.20.a: "這不會有什麼壞處"
 AAT_finland_diplomacy.20.b: "他們不知道我們為他們計劃了什麼"
 AAT_finland_diplomacy.21.t: "[FROM.GetName]同意簽署《芬蘭-[FROM.GetAdjective]條約》"
 AAT_finland_diplomacy.21.desc: "[FROM.GetNameDef]的偉大[FROM.GetLeader]發誓要在未來的歲月裡為我們兩國之間的永久和長期和平而努力。他們確實是[FIN.GetAdjective]人民的好朋友。"
 AAT_finland_diplomacy.21.a: "更美好的未來等待著我們"
 AAT_finland_diplomacy.22.t: "[FROM.GetLeader]拒絕簽署《芬蘭-[FROM.GetAdjective]條約》"
 AAT_finland_diplomacy.22.desc: "不值得信任的[FROM.GetLeader]聲稱他們無法確保我們國家之間的和平，顯然他們正在計劃對我們國家進行某種攻擊，我們應該為此做好儘可能多的準備。"
 AAT_finland_diplomacy.22.a: "他們怎麼敢的！"
 AAT_finland_diplomacy.23.t: "[FROM.GetNameDefCap]尋求庇護以反抗[SOV.GetNameDef]"
 AAT_finland_diplomacy.23.desc: "[FROM.GetNameDef]的[FROM.GetLeader]請求我們幫助他們抵禦[SOV.GetNameDef]任何可能的侵略。他們表示，他們知道自己可能很快就會受到攻擊，如果這一天到來，我們是他們生存的唯一希望。"
 AAT_finland_diplomacy.23.a: "我們將把他們納入我們的保護之下"
 AAT_finland_diplomacy.23.b: "我們為什麼要這樣做？"
 AAT_finland_diplomacy.24.t: "[FROM.GetAdjective]政府發誓庇護[ROOT.GetNameDef]"
 AAT_finland_diplomacy.24.desc: "[FROM.GetAdjective]政府同意了我們的要求，併發誓在[SOV.GetAdjective]發動任何侵略時將保護我們。我們終於可以鬆一口氣了。"
 AAT_finland_diplomacy.24.a: "我們的救星！"
 AAT_finland_diplomacy.25.t: "[FROM.GetNameDef]拒絕我國庇護請求"
 AAT_finland_diplomacy.25.desc: "[FROM.GetAdjective]政府拒絕了我們要求[SOV.GetAdjective]提供保護的請求。既然我們擔心的情況已經發生，我們就必須做好防禦準備，儘可能堅決地防守。"
 AAT_finland_diplomacy.25.a: "我們被命運拋棄了！"
 AAT_finland_diplomacy.26.t: "[FROM.GetName]請求[ROOT.GetAdjective]庇護"
 AAT_finland_diplomacy.26.desc: "[FIN.GetNameDef]的[FIN.GetLeader]正在尋求[SOV.GetNameDef]的保護，後者最近再次開始關注他們的鄰居，這是自俄羅斯內戰以來第一次真正的關注。為了換取免受這種威脅的保護，他們提出向我們支付對各種[FIN.GetAdjective]自然資源的權利。"
 AAT_finland_diplomacy.26.a: "我們將援助他們！"
 AAT_finland_diplomacy.26.b: "和我們無關"
 AAT_finland_diplomacy.27.t: "[FROM.GetNameDefCap]將保護我們"
 AAT_finland_diplomacy.27.desc: "[GER.GetNameDefCap]接受了我們以資源換取保護的提議，並承諾如果戰爭選擇了我們，他將向我們提供援助。我們的人民終於可以鬆一口氣了，因為現在，他們的未來安全多了。"
 AAT_finland_diplomacy.27.a: "我們將共同奮戰！"
 AAT_finland_diplomacy.28.t: "[ROOT.GetName]無法指望[FROM.GetAdjective]的保護"
 AAT_finland_diplomacy.28.desc: "[GER.GetNameDef]奸詐的[GER.GetLeader]拒絕了我們以資源換取保護的提議，以其一時衝動毀滅了我們的未來。我們將見證他們自私自利的本性在未來如何為他們服務。"
 AAT_finland_diplomacy.28.a: "如此，我們只能靠自己了！"
 AAT_finland_winter_war.02.t: "[ROOT.GetAdjective]要求和平"
 AAT_finland_winter_war.02.desc: "前線捷報！我軍成功佔領並守住了[195.GetName]。有了這一對[SOV.GetNameDef]的決定性打擊，我們現在身處開啟和談的有利地位上了。\n\n[SOV.GetAdjective]入侵的既定目標之一是擴大[195.GetName]附近的緩衝區，但如今不僅未能達成目標，還失去了這座城市。因此，我們料想他們已是十分渴望擺脫這場衝突了。\n\n現在，我們要決定何時開始談判。我們可以繼續作戰來爭取更多補償，或是儘快實現無條件和平。"
 AAT_finland_winter_war.02.a: "和平之時已至……"
 AAT_finland_winter_war.03.t: "[FROM.GetAdjective]要求和平"
 AAT_finland_winter_war.03.desc: "我們剛剛收到來自敵國[FROM.GetNameDef]的消息。他們提議無條件和平，即要求我軍立即停止一切敵對行動並撤至我國邊界一側。在領土問題上，[FROM.GetNameDef]似乎滿足於將兩國邊界恢復到戰前位置，即雙方都沒有任何收穫。\n\n考慮到近期的損失，我們不確定本國民眾會在多大程度上支持繼續作戰。短期內，我們或許可以說服民眾相信勝利在望，但如果情況繼續惡化，我們可能會面臨日益高漲的反體制不滿情緒。"
 AAT_finland_winter_war.03.a: "除吞下敗果外，我等別無他選……"
 AAT_finland_winter_war.03.b: "我們還可以逆轉戰爭的天平！"
 AAT_finland_winter_war.04.t: "[FROM.GetNameDefCap]接受我方和平提議"
 AAT_finland_winter_war.04.desc: "俄國人接受了和平協議！我等大捷勝利的消息不脛而走，街頭巷尾間民眾歡呼喝彩。[FROM.GetAdjective]部隊已開始撤出我國領土，在消化敗果的痛楚中重返家園。\n\n這無疑是一個值得我們民族驕傲的日子，但我們決不能沾沾自喜，畢竟縱使芳草連天，尚不清楚其中藏了多少條垂涎飢渴的毒蛇。"
 AAT_finland_winter_war.04.a: "他們最好別再惹上我們。"
 AAT_finland_winter_war.05.t: "[FROM.GetNameDefCap]拒絕我方和平提議"
 AAT_finland_winter_war.05.desc: "[FROM.GetNameDef]那幫蠢貨拒絕了我們的和平提議。他們妄稱，最近的損失只是短期內的背運，所謂背運很快就會翻盤。我們知道，這中瞎猜完全是無中生有，不過是使其政府免遭民眾苛責，但真相很快就會大白於天下。\n\n我軍將士仍在前線戰壕，但他們鬥志昂揚，自信抗戰，已為未來的戰鬥做好了充分的準備。"
 AAT_finland_winter_war.05.a: "這幫蠢蛋得付出代價！"
 AAT_finland_winter_war.06.t: "[FROM.GetAdjective]要求以領土換和平"
 AAT_finland_winter_war.06.desc: "我們剛剛收到我們的對手[FROM.GetAdjective]的投降要求。作為和平條款的一部分，他們要求我們交出卡累利阿-科拉地區的數塊領土，而且他們堅持要我們儘快撤出這些區域。"
 AAT_finland_winter_war.06.a: "除吞下敗果外，我等別無他選……"
 AAT_finland_winter_war.06.b: "他們怎麼敢的！？"
 AAT_finland_winter_war.07.desc: "他們已經接受了和平協議！隨著我們勝利的消息傳開，街道上爆發了自發的慶祝活動。[FROM.GetAdjective]軍隊已經開始從我們的領土上撤出，痛苦地返回自己的家園。\n\n這無疑是我們國家值得驕傲的一天，因為我們不僅打敗了侵略者，而且通過打敗他們讓我們能夠以他們為代價來擴大我們自己的領土"
 AAT_finland_winter_war.07.a: "希望他們到底能學乖了。"
 AAT_finland_winter_war.08.desc: "[FROM.GetNameDef]的那些傻瓜拒絕了我們慷慨的和平提議。他們日益絕望的政府堅持認為他們仍然可以獲勝的幻想，他們明白如果戰爭狀況的真相被洩露，他們將不得不面對大規模起義，甚至可能是國內革命。\n\n我們的士兵仍然堅守在戰場上，他們堅韌不拔、精神昂揚，他們確信自己將繼續正義的鬥爭，為即將到來的更多戰鬥做好準備，他們相信勝利即將來臨。"
 AAT_finland_winter_war.08.a: "這幫蠢蛋得付出代價！"
 FIN_winter_war_push_back_tt: "\n反推[SOV.GetAdjective]並佔領§Y[195.GetName]§!能使我們強迫其和談。\n同時，如果我們控制§Y[213.GetName]§!、§Y[215.GetName]§!或§Y[216.GetName]§!，還可要求[SOV.GetNameDef]割讓這些地區。"
 AAT_finland_continuation_war.01.t: "[FROM.GetAdjective]提議進行繼續戰爭"
 AAT_finland_continuation_war.01.desc: "[FROM.GetName]高層的部分成員向我國致函，提議兩國間開展軍事合作，共同對抗[SOV.GetAdjective]這個東方威脅。他們將允許我國在[FROM.GetName]境內駐紮軍隊，條件是雙方必須保護彼此邊界安全，並在任何針對[SOV.GetAdjective]領土的衝突性行動中進行合作。"
 AAT_finland_continuation_war.01.a: "當然可以，只是得保證這個協議簽得不留痕跡就行！"
 AAT_finland_continuation_war.01.b: "[FROM.GetAdjective]的雜碎事與我等無關"
 AAT_finland_continuation_war.02.t: "芬蘭-[FROM.GetAdjective]繼續戰爭條約"
 AAT_finland_continuation_war.02.desc: "[FROM.GetLeader]已批准我方提出的反[SOV.GetNameDef]軍事合作提案。我國武裝部隊的軍官正應邀前往[FROM.Capital.GetCapitalVictoryPointName]，開始協調整合兩國聯合部隊。"
 AAT_finland_continuation_war.02.a: "保證這個協議簽得不留痕跡！"
 AAT_finland_continuation_war.03.t: "[FROM.GetName]拒絕我方提案"
 AAT_finland_continuation_war.03.desc: "[FROM.GetLeader]愚蠢地拒絕了兩國軍事合作提案，畢竟[FROM.GetAdjective]此前剛費了很大功夫才與[SOV.GetAdjective]達成了一紙脆弱協議，不想拿著它來冒險，但不排除該國另有什麼陰謀打算的可能。無論如何，我們都應該謹慎行事，並開始尋找其他的潛在支持方。"
 AAT_finland_continuation_war.03.a: "白白浪費掉的機會……"
 AAT_finland_continuation_war.04.t: "繼續戰爭條約破裂"
 AAT_finland_continuation_war.04.desc: "由於最近地緣政治的變化，我國與[FROM.GetNameDef]針對[SOV.GetNameDef]的合作計劃現已破滅。我等此前為制定聯合行動計劃付出了巨大努力，但現如今必須在軍事和外交上重擬大綱。"
 AAT_finland_continuation_war.04.a: "我們得克服時艱"
 AAT_finland_continuation_war.05.t: "[FIN.GetAdjective]繼續戰爭"
 AAT_finland_continuation_war.05.desc: "[GER.GetNameDef]終於啟動了入侵[SOV.GetNameDef]的巴巴羅薩行動，我們精心策劃的外交和軍事計劃終見成果。現在，我們必須履行承諾，執行計劃中由我們負責的那部分。"
 AAT_finland_continuation_war.05.a: "讓我們與袍澤並肩！"
 AAT_finland_continuation_war.06.desc: "依照雙方簽訂的合作協議，[FIN.GetAdjective]軍隊已對[SOV.GetAdjective]陣地發起預定進攻。在[FIN.GetAdjective]友軍的通力配合下，我方成功迫使[SOV.GetAdjective]軍隊延長防線，將其逼至崩潰邊緣。"
 AAT_finland_continuation_war.06.a: "勝利唾手可得！"
 AAT_finland_continuation_war.07.desc: "儘管我們盡了最大的外交努力來阻止[GER.GetNameDef]和[FIN.GetNameDef]兩國相互勾結，但現如今似乎都打了水漂。[FIN.GetAdjective]與[GER.GetAdjective]的軍隊對我國聯合發動了精確打擊，這背後肯定是早就開始協調的了。"
 AAT_finland_continuation_war.07.a: "一如我等所懼……"
 FIN_pact_for_continuation_war_ger_tt: "[ROOT.GetFlag]§Y[ROOT.GetNameDef]§!對[SOV.GetFlag]§Y[SOV.GetNameDef]§!宣戰後生效：\n[FROM.GetFlag]§Y[FROM.GetNameDefCap]§!將加入對[SOV.GetFlag]§Y[SOV.GetNameDef]§!的戰爭。"
 FIN_pact_for_continuation_war_fin_tt: "[FROM.GetFlag]§Y[FROM.GetNameDef]§!對[SOV.GetFlag]§Y[SOV.GetNameDef]§!宣戰後生效：\n[ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§!將加入對[SOV.GetFlag]§Y[SOV.GetNameDef]§!的戰爭。"
 FIN_pact_for_continuation_war_broken_tt: "條約已被撕毀，締約國不再有於[SOV.GetFlag]§Y[SOV.GetNameDef]§!戰爭中援助另一國之義務。"
 FIN_the_lone_wolf_no_faction_tt: "[FIN.GetFlag]§Y[FIN.GetNameDefCap]§!§R不能在擁有§!“§Y$FIN_the_lone_wolf$§!”§R民族精神時加入任何陣營§!。"
 AAT_finland_continuation_war.08.t: "[FROM.GetName]希望停戰"
 AAT_finland_continuation_war.08.desc: "[FROM.GetNameDef]政府向我國伸出了橄欖枝，請求兩國簽訂停戰協定，並許諾給我們更多的領土讓步，同時斷絕與[GER.GetNameDef]的一切關係。如果接受這個條件，我們就可以把注意力完全集中在[GER.GetAdjective]身上，爭取一口氣打進柏林。"
 AAT_finland_continuation_war.08.a: "籤吧，就用“莫斯科停戰協定”這個名字了"
 AAT_finland_continuation_war.08.b: "這回可別想矇混過關！"
 AAT_finland_continuation_war.09.t: "[FROM.GetNameDef]拒絕我方和平提議"
 AAT_finland_continuation_war.09.desc: "[FROM.GetNameDef]領袖[FROM.GetLeader]拒絕了我方請求，並稱要我們做好被毀滅的準備，因為[FROM.GetAdjective]軍隊這次不會輕易放過我們。這事兒簡直太糟糕了！"
 AAT_finland_continuation_war.09.a: "我們被命運拋棄了！"
 aat_news.120.t: "簽署《莫斯科停戰協定》"
 aat_news.120.desc: "經過長時間的談判，[FIN.GetLeader]和[SOV.GetLeader]雙方的軍官與政府官員代表在停戰協議草案上達成一致，簽署後立即生效。然而，[FIN.GetNameDef]要為這次停戰付出沉重的代價，畢竟[FIN.GetName]的盟友們肯定會感到被背叛了。"
 aat_news.120.a: "此乃必要之為……"
 aat_news.120.b: "我謝謝你嗷，酒肉兄弟！"
 aat_news.120.c: "我們，向前進！"
 aat_news.120.d: "事態發展真是太有趣了……"
 AAT_finland_continuation_war.10.t: "蘇聯軍隊強迫我方驅逐[GER.GetAdjective]部隊"
 AAT_finland_continuation_war.10.desc: "蘇聯代表已經注意到我們沒有遵守停戰協定，因為協定明確規定我們需要驅逐任何敵軍，而[GER.GetAdjective]眼下正在搶奪我們本該交給蘇聯的武器和資源。隨著我軍開始試圖解除[GER.GetAdjective]士兵的武裝，交火已經開始，[GER.GetAdjective]人正在我國領土上放火，在我國水域裡投雷。"
 AAT_finland_continuation_war.10.a: "跪地求饒——免再遭生靈塗炭之厄"
 AAT_finland_continuation_war.11.t: "我國軍官團開始撤離[FIN.GetNameDef]"
 AAT_finland_continuation_war.11.desc: "儘管起初猶豫不決，[FIN.GetAdjective]政府現在迫於蘇聯的壓力，已經開始驅逐駐紮在那裡的我軍士兵並解除他們的武裝。因此，我們的軍官已經開始啟動為這種情況而制定的計劃，但卻猶豫不決，不知道該進行哪種干預。所以哪種？"
 AAT_finland_continuation_war.11.a: "執行比爾克行動"
 AAT_finland_continuation_war.11.b: "執行北境之光行動"
 aat_news.121.t: "拉普蘭戰爭"
 aat_news.121.desc: "[FIN.GetNameDef]和[GER.GetNameDef]之間爆發了戰鬥，[FIN.GetAdjective]部隊試圖解除[GER.GetAdjective]士兵的武裝並將其驅逐出境，以遵守與[SOV.GetNameDef]簽署的《莫斯科停戰協定》。毫無疑問，[GER.GetAdjective]最終會被趕出[FIN.GetName]，但代價是什麼？"
 aat_news.121.a: "我們會把他們掃地出門！"
 aat_news.121.b: "與虎謀皮，終得反噬……"
 aat_news.121.c: "我們的又一次勝利"
 aat_news.121.d: "時運逆轉了"
 AAT_finland_continuation_war.12.t: "[FIN.GetName]希望跳槽"
 AAT_finland_continuation_war.12.desc: "[FIN.GetNameDef]領袖[FIN.GetLeader]今天向我們提出了一個非常有趣的提議。他聲稱[FIN.GetName]準備結束與[SOV.GetNameDef]的戰爭，因為戰爭已經越來越不利於他們。他提出讓我們在佩薩莫登陸，並加入我方陣營，共同將[GER.GetAdjective]勢力趕出斯堪的納維亞半島，一勞永逸地掐死[GER.GetNameDef]。我們怎麼回覆？"
 AAT_finland_continuation_war.12.a: "好事，但願[SOV.GetLeader]能夠配合……"
 AAT_finland_continuation_war.12.b: "我們不能冒險激怒蘇聯！"
 AAT_finland_continuation_war.13.t: "[FIN.GetName]尋求加入同盟國"
 AAT_finland_continuation_war.13.desc: "[FIN.GetNameDef]代表似是已經找上了民主列強，試圖通過提出加入他們對[GER.GetAdjective]的戰爭來擺脫對我們的戰爭，從本質上來說就是跳槽。如果同盟國同意這樣做，我們除了抱怨和要求賠償外，也沒有別的辦法，但至少這意味著我們在反法西斯鬥爭中又多了一個新夥伴。"
 AAT_finland_continuation_war.13.a: "好事，但一定得狠狠補償我們一筆"
 AAT_finland_political.01.t: "[ROOT.GetLeader]不信任動議"
 AAT_finland_political.01.desc: "今天發生的事情是，[Root.GetLeader]未能獲得[ROOT.GetLeader.GetSheHe]所需要的選票，以熬過芬蘭議會中對其發起的不信任投票，那是[ROOT.GetAdjective]的議會。\n\n儘管自1931年起就擔任總統，並享有大量的群眾治國履歷，但由於[ROOT.GetLeader.GetHerHis]拒絕將社會民主黨納入內閣，違反了的承諾，[ROOT.GetLeader.GetHerHis]地位顯著下降。有失檢點的政治汙點升級為了政治危機，[ROOT.GetLeader.GetSheHe]現在已成為這場危機的受害者。"
 AAT_finland_political.01.a: "卡利奧有的忙活了！"
 AAT_finland_political.02.t: "總統任期即將結束"
 AAT_finland_political.02.desc: "今天是陷入困境的[ROOT.GetLeader]必須再次確保總統職位的日子。\n\n儘管自1931年起就擔任總統，並享有廣泛的民眾統治記錄，但由於[ROOT.GetLeader.GetHerHis]拒絕將社會民主黨納入內閣，違反了承諾，[ROOT.GetLeader.GetHerHis]的地位顯著下降。有失檢點的政治汙點嚴重損害了[ROOT.GetLeader.GetHerHis]連任的機會，我們今天就會知道這是否足以推翻[GetPoliticsDescriptionOldManPete]"
 FIN_reelection_old_man_pete: "老皮特。"
 FIN_reelection_other_leader: "[ROOT.GetLeader]。"
 AAT_finland_political.02.a: "斯溫胡武德必須爭取大眾信任"
 AAT_finland_political.02.b: "任命屈厄斯蒂·卡利奧，他有中間派和民主派的支持！"
 AAT_finland_political.03.desc: "不幸的是，我們必須面對現實，[ROOT.GetLeader]的身體狀況並不好。[ROOT.GetLeader]已經中風，導致[ROOT.GetLeader.GetHerHis]的右臂癱瘓，醫生擔心，除非立即將[ROOT.GetLeader.GetSheHe]免職，否則[ROOT.GetLeader.GetHerHis]的健康狀況會迅速惡化。\n\n因此，芬蘭議會召開緊急會議，提出不信任動議，以總統的健康為由將其罷免。總理里斯托·呂蒂已經接管了總統的多項職責，並準備接任總統職務。"
 AAT_finland_political.03.a: "任命里斯托·呂蒂，他早已接過了卡里奧的擔子！"
 AAT_finland_political.04.t: "[ROOT.GetLeader]逝世"
 AAT_finland_political.04.desc: "我們遺憾的獲知，深受[ROOT.GetName]愛戴的總統[ROOT.GetLeader]不幸去世了。[ROOT.GetLeader.GetSheHeCap]長期身體欠佳，而中風則進一步導致[ROOT.GetLeader.GetHerHis]的右臂陷入癱瘓。\n\n[ROOT.GetLeader.GetSheHeCap]剛剛以健康為由向遞交辭呈，正在回家的路上時，卻因突發致命心臟病而死在了赫爾斯基中央車站。就在[ROOT.GetLeader.GetHerHis]離世的那個時刻，儀仗隊正好在[ROOT.GetLeader.GetSheHe]的辦公署演奏芬蘭愛國曲目《波里軍團總統進行曲》（Porilaisten marssi），為其踐行。"
 AAT_finland_political.04.a: "R. I. P."
 AAT_finland_political.05.t: "[ROOT.GetLeader]辭職"
 AAT_finland_political.05.desc: "今日，我們收到了[ROOT.GetLeader]的辭呈。[ROOT.GetLeader.GetSheHe]表示，[ROOT.GetLeader.GetHerHis]的健康狀況長期欠佳，因此[ROOT.GetLeader.GetSheHe]決定採取謹慎的決定，向[ROOT.GetLeader.GetHerHis]提出辭職。\n\n[GetPoliticsDescriptionKallioWinterWar]"
 FIN_politics_kallio_winter_war: "[ROOT.GetLeader]對戰爭已習以為常，[ROOT.GetLeader.GetSheHe]對日益加劇的全球緊張局勢感到擔憂。[ROOT.GetLeader.GetHerHis]的警告得到了公眾的認真對待，因為正是[ROOT.GetLeader.GetSheHe]領導我們國家度過了冬季戰爭最黑暗的時刻。"
 FIN_politics_no_kallio_winter_war: "[ROOT.GetLeader.GetSheHeCap]還關切地注意到世界各地緊張局勢不斷升級，並對[ROOT.GetAdjective]人民在當前困難時期的安全表示深切而真誠的祝願。"
 AAT_finland_political.05.a: "$FIN_risto_ryti$已經等不及接班了！"
 AAT_finland_political.06.desc: "令人驚訝的是，政府剛剛收到[ROOT.GetLeader]以健康原因提出的辭職信。然而，[ROOT.GetLeader.GetSheHe]一直表現得很健康，所以有人懷疑可能存在其他動機。\n\n總統捲入了最近的一場政治醜聞，人們發現[ROOT.GetLeader.GetSheHe]向[GER.GetLeader]發送了一封私人信件，其中[ROOT.GetLeader.GetSheHe]請求對我們的敵人（無論是真實的還是想像的）提供軍事援助。\n\n可以理解的是，內閣中一些比較具民族主義色彩的人士譴責這種對我們主權的明顯侵犯，他們可能會迫使[ROOT.GetLeader.GetHerHim]辭職。"
 AAT_finland_political.06.a: "這個國家已經不需要呂蒂這種人了"
 AAT_finland_political.07.t: "$FIN_carl_mannerheim$被任命為總統"
 AAT_finland_political.07.desc: "戰爭威脅到了[ROOT.GetName]的生死存亡，艱難的時代迫使我等作出艱難的決定，即以[ROOT.GetAdjective]獨立戰爭的英雄、陸軍元帥卡爾·曼納海姆領導的軍政府取代[ROOT.GetLeader]。我們需要他的軍事經驗，這樣才有希望擺脫侵略者的枷鎖，拯救我們的祖國。\n\n曼納海姆欣然接受了新的職責，他宣稱道，“這場戰爭只不過是獨立戰爭的延續與落幕。我們，是在為我們的家園、信仰和祖國而戰。”"
 AAT_finland_political.07.a: "曼納海姆能搞定局面"
 AAT_finland_political.08.t: "曼納海姆使命已畢"
 AAT_finland_political.08.desc: "我們對[ROOT.GetLeader]的奉獻心懷感激之情。可以肯定，如果沒有[ROOT.GetLeader.GetHerHis]的領導，我們就不可能經受住風暴的考驗，我們的國家如今就要迷失方向。\n\n然而，我們必須做出一個艱難的決定，是要求元帥繼續留任，順應民意請他下臺，恢復文官政府？"
 AAT_finland_political.08.a: "[ROOT.GetAdjective]人感謝您的服務，曼納海姆男爵元帥！"
 AAT_finland_political.08.b: "我們還需要曼納海姆在位！"
 AAT_finland_political.09.desc: "我們對[ROOT.GetLeader]的奉獻心懷感激之情。可以肯定，如果沒有[ROOT.GetLeader.GetHerHis]的領導，我們就不可能經受住風暴的考驗，我們的國家如今就要迷失方向。\n\n然而，如今戰爭時代已是過去，是時候展望和平與重建國家了。為了妥善治癒創傷和麵對未來，我們必須恢復文官政府。"
 AAT_finland_political.09.a: "[ROOT.GetAdjective]人感謝您的服務，曼納海姆男爵元帥！"
 AAT_finland_kinship_war.01.t: "[FROM.GetAdjective]在東卡累利阿進行煽動"
 AAT_finland_kinship_war.01.desc: "在卡累利阿反蘇情緒高漲之際，當地忠實公民表示擔心，認為我們可能會重蹈援助親屬民族戰爭（Heimosodat）和東卡累利阿起義的覆轍。如此伎倆目標，無論是卡累利阿獨立、芬蘭民族統一、抑或單純的部落主義、甚至芬蘭帝國主義之夢，芬蘭的鼓動者顯然是罪魁禍首。"
 AAT_finland_kinship_war.01.a: "敢造反就要準備好接受處分！"
 AAT_finland_kinship_war.02.t: "東卡累利阿起義！"
 AAT_finland_kinship_war.02.desc: "我們在[SOU.GetName]挑撥不滿情緒的努力成果赫然。曾經，在東卡累利阿起義期間，有兩萬名東卡累利阿人逃往芬蘭，如今他們一直在卡累利阿學術協會內努力工作，為的是永遠記住那些所失去的東西。援助親屬民族戰爭從未被遺忘，卡累利阿人在蘇聯當局的踐踏下所遭受的刻薄待遇也從未被遺忘。\n\n因此，東卡累利阿的人民站了起來，公開講了出來，對壓迫者舉起了叛旗。武器和物資的流入已有不少時日，如今他們在呼籲昔日亡國之民重返家園，拿起武器，反抗暴政。\n\n現在的問題是，[ROOT.GetName]會再次加入他們的鬥爭嗎？"
 AAT_finland_kinship_war.02.a: "全力支持卡累利阿同胞！"
 AAT_finland_kinship_war.02.b: "允許芬蘭鼓動者過境"
 AAT_finland_kinship_war.03.desc: "今日上午，在[FIN.GetAdjective]勢力的煽動下，東卡累利阿的叛軍採取了激烈行動，衝擊了政府駐地。當地的麻煩已經醞釀了不短的時間，畢竟有人暗中從想搞事的鄰國手中走私武器，以支持當地的叛亂勢力。[FIN.GetName]對1920年簽署的《塔爾圖和約》長期心存芥蒂，自那時起就一直在支持東卡累利阿的叛亂勢力。\n\n到今天之前，他們最多也就做到這種程度。不過，看起來[FIN.GetName]終於決定直接介入了。從[FIN.GetAdjective]軍隊越過邊境那一刻起，局勢已經進一步升級，衝突範圍已經進一步擴大，兩國現已進入了戰爭狀態。"
 AAT_finland_kinship_war.03.a: "他們根本不是我軍的對手！"
 AAT_finland_kinship_war.04.t: "東卡累利阿叛亂被擊潰！"
 AAT_finland_kinship_war.04.desc: "在過去的幾個月裡，[FROM.GetAdjective]軍隊一直在東卡累利阿城裡鄉間四處探查，試圖找到破壞該地區穩定並使當地駐軍陷入混亂的辦法，但遭到了駐守此地的[SOV.GetAdjective]軍隊的堅挺反擊。\n\n在真正的起義甚至尚未開始走策劃流程之前，許多芬蘭鼓動者和東卡累利阿叛軍就已經蹲了牢子、遭逐出境或自己夾著尾巴逃亡了。民眾紛紛表示擔憂，認為如今大勢已去不復還。"
 AAT_finland_kinship_war.04.a: "我們只好用別的手段解放東卡累利阿了"
 AAT_finland_kinship_war.05.desc: "在過去的幾個月裡，[FIN.GetAdjective]軍隊一直在東卡累利阿城裡鄉間四處探查，試圖找到破壞該地區穩定並使當地駐軍陷入混亂的辦法，但遭到了駐守此地的[SOV.Adjective]軍隊的堅挺反擊。\n\n在真正的起義甚至尚未開始走策劃流程之前，許多芬蘭鼓動者和東卡累利阿叛軍就已經蹲了牢子、遭逐出境或自己夾著尾巴逃亡了。民眾對此感到十分振奮，該地區終於恢復了和平！"
 AAT_finland_kinship_war.05.a: "但願這是最後一次手足相殘，這一次，真的該結束了……"
 AAT_finland_kinship_war_dynamic_modifier_tt: "§Y$FIN_anti_soviet_sentiment$§!地區修正在§Y[215.GetName]§!、§Y[216.GetName]§!、§Y[146.GetName]§!或§Y[147.GetName]§!存在時，[FROM.GetNameDef]可以策動卡累利阿起義。"
 AAT_finland_kinship_war_rebellion_crushed_fin_tt: "§R卡累利阿叛軍在組織起義之前就已被擊潰。§!"
 AAT_finland_kinship_war_rebellion_crushed_sov_tt: "§G卡累利阿叛軍在組織起義之前就已被擊潰。§!"
 AAT_finland_kinship_war.06.t: "第二次援助親屬民族戰爭"
 AAT_finland_kinship_war.06.desc: "由於蘇聯的民事機構正在瓦解，許多地方民族主義政府正在宣佈獨立，[KAR.GetNameDef]就是其中之一。卡累利阿民族統一主義者和軍國主義者稱我們正面臨第二次援親戰爭，而溫和派和社會主義者則聲稱我們不應捲入蘇聯事務。"
 AAT_finland_kinship_war.06.a: "我們應該輸送人員和物資。"
 AAT_finland_kinship_war.06.b: "不可喚醒沉睡的巨熊……"
 AAT_finland_the_white_death.1.t: "我軍狙擊手戰功赫赫"
 AAT_finland_the_white_death.1.desc: "報告顯示我軍狙擊手在打擊入侵我們森林的敵軍時表現出了極高的效率。這是一個很好的戰爭宣傳機會，因為“白色死神”一詞已經在敵軍士兵中流行開來，意指芬蘭的大自然和當地人所帶來的危險。如果有人正好嶄露頭角，我們也可以用這個詞指代之，從而鼓舞大眾。"
 AAT_finland_the_white_death.1.a: "漂亮！"
 AAT_finland_the_white_death.1.b: "我們應向獵人們分派更多的武器。"
 FIN_our_snipers_will_be_more_deadly_tt: "我方§Y狙擊手§!將更為致命"
 aat_news.105.t: "白色死神"
 aat_news.105.desc: "隨著戰爭將臨至[FIN.GetNameDef]，許多獵人、白衛軍民兵和射擊俱樂部的神槍手們都拿起了武器，去反抗壓迫者。他們身上流淌著[FIN.GetAdjective]那西蘇之魂，他們利用[FIN.GetAdjective]的自然優勢阻擋敵人的進攻，是為敵軍口中的“白色死神”。"
 aat_news.105.a: "搞宣傳的好機會！"
 aat_news.105.b: "死神已經帶走我們不少年輕的小夥子們了，可我等決不不戰自降！"
 aat_news.105.c: "他們確實知道如何戰鬥"
 AAT_finland_the_white_death.2.t: "[FIN.GetAdjective]狙擊手打擊我軍士氣"
 AAT_finland_the_white_death.2.desc: "士兵報告說，在[FIN.GetNameDef]的森林裡，有時整隊人被出其不意地射殺成碎片。他們開始談論白色死神——[FIN.GetNameDef]嚴寒的化身，以及[FIN.GetAdjective]軍隊的致命射手。如果我們願意，可以在這些障礙造成更大破壞之前，花大力氣將其清除。"
 AAT_finland_the_white_death.2.a: "無需擔心"
 AAT_finland_the_white_death.2.b: "獵殺時間到！"
 FIN_we_will_be_more_likely_to_put_down_the_finnish_snipers_tt: "我們將更有可能成功獵到§Y芬蘭狙擊手§!"
 AAT_finland_the_white_death.4.t: "西莫·海耶，白色死神"
 AAT_finland_the_white_death.4.desc: "維普里的狙擊手西莫·海耶因其出神入化的槍法經常被我們的其他士兵稱為“神槍手”（Taika-Ampuja）。如今，他也被稱為“白色死神”。我們的官方立場應該是什麼？"
 AAT_finland_the_white_death.4.a: "宣傳這位現代芬蘭英雄的事蹟"
 AAT_finland_the_white_death.4.b: "白色死神是芬蘭的化身，而不是某個人！"
 AAT_finland_the_white_death.5.t: "西莫·海耶，白色死神"
 AAT_finland_the_white_death.6.t: "西莫·海耶，白色死神"
 AAT_finland_the_white_death.7.t: "白色死神之擁"
 AAT_finland_the_white_death.7.desc: "儘管將士們盡了最大努力，但恐嚇我軍數週之久“白色死神”仍遠未被獵首，我軍軍官一無所獲。這樣下去，軍心就要動搖，士氣就要一落千丈……"
 AAT_finland_the_white_death.7.a: "太糟了……"
 AAT_finland_the_white_death.8.t: "損失慘重，但我軍成功擊傷白色死神"
 AAT_finland_the_white_death.8.desc: "我們在[FIN.GetNameDef]前線的軍官傳來了關於成功擊傷白色死神的報告。不過，這也付出了巨大的代價：許多士兵陣亡，更多士兵負傷。儘管如此，我們今後應該不會再在戰場上遇到他了。"
 AAT_finland_the_white_death.8.a: "可算擺脫了這隻煩人的蒼蠅！"
 AAT_finland_the_white_death.9.t: "損失慘重，但我軍成功擊斃白色死神！"
 AAT_finland_the_white_death.9.desc: "我們在[FIN.GetNameDef]前線的軍官報告稱，前線部隊成功擊斃了被稱為白色死神的[FIN.GetAdjective]狙擊手。儘管傷亡慘重，但[ROOT.GetNameDef]的一個大敵已被消滅，我軍將士現在可以高枕無憂了。"
 AAT_finland_the_white_death.9.a: "講真，他就是在蜉蝣撼樹"
 AAT_finland_the_white_death.10.t: "白色死神繼續獵殺"
 AAT_finland_the_white_death.10.desc: "儘管經歷無數次險情假報，西莫·海耶卻毫髮無損。在需要他的時候，他就會繼續戰鬥下去。我們的敵人要去面對白色死神之擁了。"
 AAT_finland_the_white_death.10.a: "他們將知曉恐懼，真正的恐懼"
 AAT_finland_the_white_death.11.t: "西莫·海耶負傷脫離戰場"
 AAT_finland_the_white_death.11.desc: "有報告稱，一名敵軍士兵發射的一顆爆炸性子彈擊中了海耶的左下顎，導致他身受重傷。雖然本以為他已經死亡，但他還是掙扎回到了附近的大本營報平安。不過，他已經無法再舉起槍了，但他所做的貢獻足以讓[FIN.GetAdjective]的人們感激不盡。"
 AAT_finland_the_white_death.11.a: "儘管如此，他仍是一位真正的芬蘭英雄！"
 AAT_finland_the_white_death.12.t: "西莫·海耶捐軀！"
 AAT_finland_the_white_death.12.desc: "有報告稱，海耶在戰鬥中被敵方士兵發射的爆炸性子彈擊中身亡。遺體已被我方獵兵成功回收，並已運回首都。[FIN.GetNameDef]人民將永遠懷念他。"
 AAT_finland_the_white_death.12.a: "願他的靈魂與古代英雄們同在"
 generic_could_lead_to_tt: "可能導致："
 ###################
 ### NEWS EVENTS ###
 ###################
 aat_news.100.t: "[FIN.GetAdjective]繼續戰爭"
 aat_news.100.desc: "在上次與[SOV.GetAdjective]政府的戰爭失敗後，[FIN.GetAdjective]人民如今已完成動員並準備收復失去的領土，同時將[FIN.GetAdjective]和[KAR.GetAdjective]族人從外國壓迫中解放出來，傳承[FIN.GetAdjective]獨立戰爭和援助親屬民族戰爭的精神。"
 aat_news.100.a: "向著最終的勝利，前進！"
 aat_news.100.b: "他們絕非孤軍奮戰！"
 aat_news.100.c: "芬蘭人得為此付出代價！"
 aat_news.100.d: "不過是又一條[GER.GetLeader]的哈巴狗參戰罷了……"
 aat_news.101.t: "奧蘭群島再軍事化"
 aat_news.101.desc: "俄羅斯在克里米亞戰爭中戰敗後，奧蘭群島實現了非軍事化，島上居民免於任何形式的徵兵。雖然這一地位曾多次受到爭議，但世界上許多大國仍在執行這一條款。然而現在，在[FIN.GetAdjective]執行“帆船比賽”行動之後，奧蘭群島再次被重新軍事化。"
 aat_news.101.a: "必要之舉"
 aat_news.101.b: "那是攔不住我們的"
 aat_news.101.c: "和平不可能持久……"
 aat_news.666.t: "重建北海帝國"
 aat_news.666.desc: "在重新奪回了曾經被克努特大帝統治的所有土地後，[From.GetOldAdjective]政府現在開始加大對新徵服領土的整合力度。結果，在政府的明確支持下，為了團結人民支持政府，泛民族主義的宣傳有所增強。\n\n[FROM.GetOldAdjective]領導人[FROM.GetLeader]宣佈，[DEN.GetOldNameDef]、[NOR.GetOldNameDef]和英格蘭的聯合王國從現在起將被稱為“[From.GetNameDef]”。"
 aat_news.666.a: "看來維京人回來了。"
 aat_news.777.t: "波羅的海帝國的成立"
 aat_news.777.desc: "在成功征服了波羅的海的大部分地區之後，[From.GetOldAdjective]政府現在開始加大對新徵服領土的整合力度。結果，在政府的明確支持下，為了團結人民支持政府，泛民族主義的宣傳有所增加。\n\n[FROM.GetOldAdjective]領導人[FROM.GetLeader]發表講話，講述[FROM.GetOldNameDef]如何做到了其他國家沒有做到的事情，並將波羅的海置於自己的統治之下。[FROM.GetSheHeCap]在演講結束時宣佈了“[From.GetNameDef]”的成立。"
 aat_news.777.a: "統御波羅的海！"
 #######################
 ###  NARVIK EVENTS  ###
 #######################
 AAT_britain_narvik.1.t: "[SWE.GetAdjective]礦場遭到炸燬"
 AAT_britain_narvik.1.desc: "我們成功把[SWE.GetAdjective]礦場炸上了天，打劫掉了[GER.GetNameDef]最重要的進口渠道之一。儘管這麼做的主要動機是履行援助[FIN.GetName]的承諾，但我們從沒想過直面[SOV.GetNameDef]的威光。這對我們的主要敵人而言無疑是天大的打擊，但[SWE.GetNameDefCap]從來都算不上我們真正的敵人，現在該想的是下一步如何操作。"
 AAT_britain_narvik.1.a: "金盆洗手，撒腿跑路"
 AAT_britain_narvik.1.b: "箭在弦上，不可不發"
 AAT_britain_narvik.2.t: "[ENG.GetName]入侵[SWE.GetName]"
 AAT_britain_narvik.2.desc: "[ENG.GetAdjective]部隊跨越邊境，開進了[SWE.GetName]。這是不宣而戰，[ENG.GetAdjective]政府對此一聲不吭，[SWE.GetAdjective]當局這對這一踐踏[SWE.GetAdjective]主權的行動怒不可遏。最可能的解釋是，[ENG.GetAdjective]部隊打算打劫耶利瓦勒和基律納的礦場，以此阻止高品味礦石運抵[GER.GeName]。這將對[GER.GetAdjective]和[SWE.GetAdjective]兩國經濟造成沉重打擊，但亦嚴重侵犯了[SWE.GetAdjective]的中立宣言。"
 AAT_britain_narvik.2.a: "他們怎麼敢的？！"
 AAT_britain_narvik.2.b: "必須馬上阻止他們！"
 AAT_britain_narvik.3.t: "[ENG.GetName]破壞[SWE.GetAdjective]礦場"
 AAT_britain_narvik.3.desc: "[ENG.GetNameDefCap]非法入侵了[SWE.GetName]，摧毀了當地礦場，甚至都不提前宣戰。曾是[SWE.GetAdjective]經濟引擎的，如今已是宛如採石場的廢墟。[ENG.GetAdjective]政府自我辯護稱，對[GER.GetNameDefCap]貿易等同於與之並肩，這一行動是正當的。但是，似乎連他們國內的輿論也對其政府的解釋表示反胃。"
 AAT_britain_narvik.3.a: "這簡直駭人聽聞！"
 AAT_britain_narvik.4.t: "[ENG.GetName]撤出[SWE.GetName]"
 AAT_britain_narvik.4.desc: "[ENG.GetName]宣佈其在[SWE.GetName]的戰略目標已經實現，現在正在撤出軍隊。該國政府反覆申明，其對[SWE.GetAdjective]國家不是真正的敵人，其在[SWE.GetName]的特別軍事行動純粹是為了捍衛民主事業。[GER.GetAdjective]和[SWE.GetAdjective]大使館都遞交了抗議信，[GER.GetAdjective]方面認為[ENG.GetName]在戰區侵略第三方國家的行徑有悖中立宣言，[SWE.GetAdjective]則直接抨擊[ENG.GetAdjective]政府打著援助[FIN.GetName]的旗號，背地裡做的是利己的勾當，唯一受傷的[SWE.GetAdjective]士兵的生命。"
 AAT_britain_narvik.4.a: "怎麼說都簡直駭人聽聞！"
