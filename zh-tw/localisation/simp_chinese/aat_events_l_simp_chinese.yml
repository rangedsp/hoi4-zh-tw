 ### MIO EVENTS ###
 AAT_MIO_events.2.t: "$CZE_skoda_works$投資"
 AAT_MIO_events.2.desc: "$CZE_skoda_works$的實業家們渴望投資，但他們的錢只夠投給公司內的三個分支之一。因此，他們得在艦船、坦克和火炮裝備間做出優先級選擇。"
 AAT_MIO_events.2.a: "投資$CZE_skoda_shipyards$"
 AAT_MIO_events.2.b: "投資$CZE_skoda_armor$"
 AAT_MIO_events.2.c: "投資$CZE_skoda_artillery$"
 ######################
 ### AMERICA EVENTS ###
 ######################
 AAT_USA_events.01.t: "[USA.GetNameDefCap]佔領格陵蘭"
 AAT_USA_events.01.desc: "作為[USA.GetAdjective]新的格陵蘭巡邏隊項目的一部分，[USA.GetLeader]政府宣佈佔領格陵蘭島。他們承諾，一旦世界局勢恢復平穩下來，就將格陵蘭島交還給我們。"
 AAT_USA_events.01.a: "至少有借有還……"
 AAT_USA_events.02.t: "[FROM.GetNameDefCap]佔據法羅群島"
 AAT_USA_events.02.desc: "[FROM.GetAdjective]已經聲明他們目前正在佔據法羅群島，該群島屬於丹麥，是一個非常重要的戰略要地。其聲稱將保護法羅群島不受一切戰爭的侵害，並順便在島上部署海空軍。等我們從因[?DEN.DEN_overlord_nation.GetAdjective]侵略而陷入的骯髒奴役中解放後，就會交還給我們。"
 AAT_USA_events.02.a: "至少我們的人民是安全的……"
 AAT_USA_events.03.t: "[FROM.GetName]希望要回法羅群島"
 AAT_USA_events.03.desc: "鑑於[FROM.GetNameDef]已經擺脫了壓迫，[FROM.GetLeader]呼籲我們履行承諾，如約將法羅群島歸還給他們。"
 AAT_USA_events.03.a: "我們確實答應過的。"
 AAT_USA_events.03.b: "事實上，我們改主意了。"
 AAT_USA_events.04.t: "[FROM.GetName]拒絕我們的要求"
 AAT_USA_events.04.desc: "[FROM.GetNameDef]的[FROM.GetLeader]拒絕了我們的要求，聲稱在全民公決之後，法羅群島的人民顯然不希望由[FROM.getAdjective]之外的國家統治。"
 AAT_USA_events.04.a: "反正我們也沒法挑戰他們。"
 AAT_USA_events.04.b: "他們自找的。"
 AAT_USA_events.05.t: "[FROM.GetName]想要格陵蘭迴歸"
 AAT_USA_events.05.desc: "鑑於[FROM.GetNameDef]已經擺脫了壓迫，[FROM.GetLeader]呼籲我們履行承諾，如約將格陵蘭歸還給他們。"
 AAT_USA_events.06.t: "[FROM.GetName]拒絕我國要求"
 AAT_USA_events.06.desc: "[FROM.GetNameDef]的[FROM.GetLeader]拒絕了我們的要求，聲稱在全民公決之後，格陵蘭的人民顯然不希望由[FROM.getAdjective]之外的國家統治。"
 AAT_USA_events.07.t: "[FROM.GetName]歸還領土"
 AAT_USA_events.07.desc: "鑑於我國已經擺脫了壓迫，[FROM.GetNameDef]的[FROM.GetLeader]履行了他們的承諾，同意歸還其因安保考慮而接管的領土。"
 AAT_USA_events.07.a: "格陵蘭迴歸！"
 AAT_USA_events.07.b: "法羅群島迴歸！"
 AAT_USA_events.08.t: "[FROM.GetNameDefCap]要求獲得丹麥領土"
 AAT_USA_events.08.desc: "[FROM.GetNameDef]的[FROM.GetLeader]已向我們發出一項請求，要求我們將非法佔有的丹麥領土歸還給其合法政府。"
 AAT_USA_events.08.a: "歸還領土"
 AAT_USA_events.08.b: "我們不會向壓迫者屈服！"
 AAT_USA_events.09.t: "[FROM.GetNameDefCap]歸還丹麥領土"
 AAT_USA_events.09.desc: "[FROM.GetNameDef]的[FROM.GetLeader]已同意將非法佔有的丹麥領土歸還給其合法政府。"
 AAT_USA_events.09.a: "真是貼心啊"


