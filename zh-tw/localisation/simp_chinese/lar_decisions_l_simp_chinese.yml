l_simp_chinese:
 SPR_the_inevitable_civil_war: "不可避免的內戰"
 SPR_the_inevitable_civil_war_desc: "在選舉後，內戰幾乎已成定局。[Root.GetSCWsideloc]我們必須抓住主動權，確保對全國駐軍的控制。"
 SPR_NATIONALISTS_INSTRUCTIONS: "我們絕不能拖延太久，以免給共和派準備防禦的時間。"
 SPR_REPUBLICANS_INSTRUCTIONS: "我們必須儘可能地推遲內戰，以獲得籌備國民軍起義的時間。"
 spa_civil_war_divisions_counter_full_breakdown: "如果現在爆發內戰，[SPA.GetNameDefCap]將馬上獲得[?SPR.spa_civil_war_divisions_counter_var|+0]§H師§!。\n"
 spa_civil_war_divisions_counter_icon_value: "[?SPR.spa_civil_war_divisions_counter_var|0H]"
 spr_civil_war_divisions_counter_full_breakdown: "如果現在爆發內戰，西班牙共和派將馬上獲得[?SPR.spr_civil_war_divisions_counter_var|+0]§H師§!。\n"
 spr_civil_war_divisions_counter_icon_value: "[?SPR.spr_civil_war_divisions_counter_var|0H]"
 SPR_the_inevitable_civil_war_map_category_name: "選擇一個地區來管控其駐軍影響。"
 SPR_opposition_civil_war_preparations: "反對派準備內戰"
 SPR_opposition_civil_war_preparations_desc: "當我們竭力阻撓他們的一舉一動時，敵人也不會閒著。我們得始終關注他們的舉動，為即將到來的衝突作準備。"
 SPR_civil_war_offensives: "內戰攻勢"
 SPR_civil_war_offensives_desc: "我們在補給前線部隊的能力上存在問題，這增加了對敵人的據點開展有效推進的難度。在預備執行大規模攻勢之前，我們必須提前計劃並充分補給前線的軍事儲備。"
 SPR_civil_war_offensives_map_category_name: "選擇一處地方來準備你的進攻。"
 SPA_military_plot_nationalists: "軍事密謀"
 SPA_military_plot_nationalists_desc: "我們正在準備推翻政府，但為了不重蹈1932年政變的覆轍，必須確保在發動政變之前有足夠的民意支持。時機必須完美！"
 SPR_military_plot_republicans: "軍事密謀"
 SPR_military_plot_republicans_desc: "陰謀推翻政府的傳言已經為我們所得知。儘管近來這類企圖不在少數，但這次我們沒有做好充分準備來應付新一輪政變。必須儘可能地阻撓、拖延他們的計劃，給我們留一些準備時間。"
 SPA_primo_de_rivera_speech: "普里莫·德·里維拉的演說"
 SPA_primo_de_rivera_speech_desc: "何塞·安東尼奧·普里莫·德·里維拉是西班牙長槍黨的創始人之一。作為一個批評民主的公眾演講家，也許應該鼓勵他發表更多的演講，以增加公眾的支持，並進一步破壞當前政權的穩定。"
 SPA_primo_de_rivera_imprisoned: "普里莫·德·里維拉被捕"
 SPR_inevitable_civil_war_in_progress_flag: "一項不可避免的內戰決議正取得進展"
 SPR_imprison_primo_de_rivera: "逮捕普里莫·德·里維拉"
 SPR_imprison_primo_de_rivera_desc: "這個國家已經受夠了何塞·安東尼奧·普里莫·德·里維拉沒完沒了的煽動性演講。我們要逮捕他，把他關在能夠監視的地方。長槍黨的宣傳必須被壓制。"
 SPR_imprison_primo_de_rivera_tt: "防止普里莫·德·里維拉進一步發表的煽動性演說。\n"
 SPR_primo_de_rivera_first_speech: "普里莫·德·里維拉發表了他的第一次演說"
 SPA_political_assassination: "政治刺殺"
 SPA_political_assassination_desc: "我們的政治對手使那些原本可能同我們站一邊的人搖擺不定。事實證明，這簡直是不可忍受。通過策略性地消滅一個主要對手，不僅可以減輕壓力，還能讓我們的意見與立場廣泛傳播。"
 SPR_political_arrest: "政治逮捕"
 SPR_political_arrest_desc: "我們的政敵以謀殺來傳播他們的意見與立場。這種情況決不能容忍，必須將肇事者繩之以法！"
 SPA_political_assassination_flag: "一場政治刺殺已經發生了"
 SPA_sway_leader_loyalty: "動搖軍官忠誠"
 SPA_sway_leader_loyalty_desc: "只要拉攏手段合適，我們很可能得到一些軍隊將領的支持。一旦內戰來臨，他們的支持將是無價之寶。"
 SPA_swayed_leader_loyalty_flag: "忠誠已經動搖。"
 SPR_secure_leader_loyalty: "確保軍官忠誠"
 SPR_secure_leader_loyalty_desc: "傳言說，有位從前忠心耿耿的將領現在面臨著忠誠危機。我們應該確保重新贏回他們的忠誠，即使拉回他們的代價可能相當高昂……"
 SPR_reassign_disloyal_leader: "重新分配不忠軍官"
 SPR_reassign_disloyal_leader_desc: "傳言說，我們某些將領的忠誠很有問題。我們最好把他們部署到遙遠的地方，不讓他們能夠輕易地繼續密謀。"
 SPR_reassign_disloyal_leader_tt: "在內戰開始後的兩個月內，對國民軍不可用。\n"
 SPA_suppress_the_strikes: "鎮壓罷工"
 SPA_suppress_the_strikes_desc: "罷工給我們國家造成了巨大的動盪和經濟損失。我們將派遣民兵去解散他們，確保人們回到工作崗位。"
 SPA_suppress_the_strikes_tt: "已完全鎮壓全國罷工"
 SPA_suppress_the_strikes_tt_NOT: "沒有：已完全鎮壓全國罷工"
 SPR_concessions_to_the_left: "向左派讓步"
 SPR_concessions_to_the_left_desc: "罷工維權的理由是正當的。我們將承諾解決這些問題，同時作出讓步，不再嚴打非法佔用土地以及輕微的社會犯罪和盜竊。這應該有助於在一定程度上減少社會動盪。"
 SPA_concessions_to_the_left_tt: "已經完全向左派讓步"
 SPR_primo_de_rivera_speech_mission: "普里莫·德·里維拉的演說"
 SPR_primo_de_rivera_speech_mission_desc: "何塞·安東尼奧·普里莫·德·里維拉，西班牙長槍黨的創始人之一，計劃發表一場煽動性的演說，將人們聚攏到國民軍一方，並煽動國內動亂。"
 SPA_imprison_primo_de_rivera_mission: "逮捕普里莫·德·里維拉"
 SPA_imprison_primo_de_rivera_mission_desc: "政府似乎認為普里莫·德·里維拉已經引起了夠多的騷亂，併發出了對他的逮捕令！"
 SPR_political_assassination_mission: "政治刺殺"
 SPR_political_assassination_mission_desc: "我們政敵的野蠻言論號召消滅我們事業的主幹……毫不意外，有些人絕對會按照這些話去行動。"
 SPA_political_arrest_mission: "政治逮捕"
 SPA_political_arrest_mission_desc: "由於一名支持者被殺害，政府正在藉機報復，大肆逮捕以殺雞儆猴。"
 SPR_sway_leader_loyalty_mission: "動搖軍官忠誠"
 SPR_sway_leader_loyalty_mission_desc: "國民軍正陰謀拉攏軍方領導層中的支持，據說已經向提出了優厚的條件……我們只能祈禱這些人不會被動搖。"
 SPA_reassign_disloyal_leader_mission: "重新分配不忠軍官"
 SPA_reassign_disloyal_leader_mission_desc: "政府越來越懷疑我們在軍隊裡的一些支持者，現在正計劃把我們的一個主要同謀調到遙遠的地方，這讓我們更難展開計劃和合作。"
 SPR_suppress_the_strikes_mission: "鎮壓罷工"
 SPR_suppress_the_strikes_mission_desc: "右翼民兵和罷工破壞者正在鎮壓我們不滿的工人，迫使他們回到工作崗位，加劇了社會動盪，人們對政府保護公民的能力感到幻滅。"
 SPA_concessions_to_the_left_mission: "向左派讓步"
 SPA_concessions_to_the_left_mission_desc: "政府對罷工工人做出了很大的讓步，讓他們不再關心我們還被監禁著的右翼兄弟姐妹們。儘管這些措施很卑鄙，但在罷工群體中似乎很受歡迎。"
