 POR_iberian_summit: "伊比利亞峰會"
 POR_iberian_summit_desc: "如果想克服困難，伊比利亞國家需要共同努力。在這個不確定的時代，必須敦促[GetIberianSummitReceiverName]討論我們應該支持衝突中的哪一方。"
 POR_iberian_summit_pro_axis: "提議加入[GER.GetFactionName]"
 POR_iberian_summit_pro_axis_desc: "[GER.GetFactionName]將會成為歐洲的主導力量。為防止他們決定直接佔領並控制我國領土和資源，我們必須與之結盟。\n我們將致函[GetIberianSummitReceiverName]，敦促他們討論一項聯合提案，要求[GER.GetNameDef]接納我們加入[GER.GetFactionName]。"
 POR_iberian_summit_pro_allies: "提議加入[ENG.GetFactionName]"
 POR_iberian_summit_pro_allies_desc: "我們必須站在[ENG.GetAdjective]這一邊，面對所有威脅我們自由並試圖支配我們的人。\n我們將致函[GetIberianSummitReceiverName]，敦促他們討論一項聯合提案，要求[ENG.GetNameDef]接納我們加入[ENG.GetFactionName]。"
 POR_iberian_summit_proposal_delayed: "討論加入[?global.POR_iberian_summit_target.GetFactionName]的提議"
 POR_iberian_summit_proposal_delayed_desc: "伊比利亞外交官正在接觸[?global.POR_iberian_summit_target.GetAdjective]政府官員並提出了一份充滿吸引力的協議，為我們共同加入[?global.POR_iberian_summit_target.GetFactionName]奠定基礎。"
 POR_iberian_summit_in_progress_flag: " 伊比利亞峰會正在進行"
