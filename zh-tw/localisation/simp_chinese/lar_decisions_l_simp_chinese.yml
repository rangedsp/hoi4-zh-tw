 form_andalusia_category: "摩爾人迴歸"
 form_andalusia_category_desc: "長久以來，摩爾人被拉丁強權征服和虐待。現在我們有能力恢復安達盧斯和所有前科爾多瓦哈里發國的領土。"
 form_andalusia: "重建安達盧西亞"
 form_andalusia_desc: "控制科爾多瓦、格拉納達埃米爾國和南伊比利亞大部地區後，我們就有了獨一無二的機會來恢復曾經的安達盧斯蘇丹國，並宣佈其曾經的疆域為我國的合法領土。"
 adu_restore_sultanate_of_africa: "重建阿非利加蘇丹國"
 adu_restore_sultanate_of_africa_desc: "很久以前，北非的摩爾人團結在統一的阿非利加蘇丹國之下，這是伍麥葉哈里發國的一個重要分支。隨著安達盧西亞的重生，現在全體摩爾人都生活在我國境內，我們能夠統一摩爾人的身份認同。"
 north_africa_needed_tooltip: "控制§Y摩洛哥，突尼斯，阿爾及利亞和利比亞§!的所有地區。"
 coring_north_africa_tt: "獲得§Y摩洛哥，突尼斯，阿爾及利亞，西撒哈拉和利比亞§!所有地區的核心。"
 adu_mediterrenean_emirates: "重建西西里酋長國"
 adu_mediterrenean_emirates_desc: "在摩爾人影響地中海的鼎盛時期，這些島嶼是許多伊斯蘭埃米爾國的所在地。現在西西里、克里特島和塞浦路斯都在安達盧西亞人的手中，我們可以再次把這些領土奪還給正統的摩爾人統治者。"
 adu_restore_umayyad_caliphate: "重建伍麥葉哈里發國"
 adu_restore_umayyad_caliphate_desc: "終於，巴格達、麥加和耶路撒冷這些聖城歸於一個國家。阿拉伯的中心地帶現在掌握在我們手中，我們可以宣稱我們不僅僅是摩爾人的聯盟，而是哈里發國的重建，亦所有伊斯蘭民族和文化的家園。"
 adu_recreate_rashid_expansion: "在拉希德的擴張"
 adu_recreate_rashid_expansion_desc: "在伍麥葉統治阿拉伯之前，拉希德人統治著阿拉伯世界，在他們的統治下，哈里發國擴展到了波斯和印度斯坦。通過重建這一古老的征服，可以使我們的國家與波斯和神話般的印度斯坦再次統一。"
 form_country_pakistani_required_states_tt: "控制§Y巴基斯坦§!除了§Y[430.GetName]§!以外的所有地區。"
 form_country_pakistan_coring_states_tt: "獲得除了§Y[430.GetName]§!以外§Y巴基斯坦§!所有地區的核心。"
 form_country_egypt_required_states_tt: "控制§Y埃及§!的所有地區。"
 middle_east_coring_states_tt: "獲得§Y中東§!所有地區的核心。"
 adu_northern_expansion: "向北擴張"
 adu_northern_expansion_desc: "哈里發國幅員遼闊，其疆域遠不止中東和伊比利亞半島。很久以前，格魯吉亞、阿塞拜疆和河中都稱哈里發國為他們的家園，現在是恢復我們失去的東西的時候了。"
 form_polynesia: "統一波利尼西亞"
 form_polynesia_desc: "隨著夏威夷群島、奧特亞羅瓦島、塔希提島和薩摩亞群島都在我們控制之下，我們能夠團結所有太平洋地區的人民。"
