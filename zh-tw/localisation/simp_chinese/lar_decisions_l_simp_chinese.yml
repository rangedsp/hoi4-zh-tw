 POR_stir_monarchist_sentiment_in_brazil_desc: "我們將煽動巴西君主派在巴西人民中傳播保皇主義熱情。"
 POR_portugal_promoting_monarchist_cause_in_brazil: "葡萄牙鼓動君主主義者"
 POR_portugal_promoting_monarchist_cause_in_brazil_desc: "葡萄牙政府正在鼓動我國人民擁護君主制，接受佩德羅·恩裡克親王為巴西的合法統治者。"
 POR_stir_monarchist_sentiment_in_brazil_tt: "§Y[BRA.GetFlag][BRA.GetNameDefCap]§!將獲得每日中立主義新增支持率：§G+0.10§!，§Y持續180日§!。"
 POR_promote_communism_in_latin_america_tt: "§Y[From.GetFlag][From.GetNameDefCap]§!§Y共產主義§!支持率將會每日增長：§G+0.10§!，§Y為期180日§!。"
 POR_portugal_stirring_brazilian_monarchists_flag: "葡萄牙目前正在煽動巴西的君主主義者"
 POR_repress_brazilian_monarchists: "鎮壓君主主義者"
 POR_repress_brazilian_monarchists_desc: "我們必須反對在國民中日益聲勢浩大的君主主義運動，必須找出傳播這種保皇派情緒的人，並公開予以懲罰。"
 POR_stir_monarchist_sentiment_in_portugal: "煽動葡萄牙的君主主義情緒"
 POR_stir_monarchist_sentiment_in_portugal_desc: "我們必須鼓動人們接受唐·杜阿爾特作為葡萄牙的合法國王。"
