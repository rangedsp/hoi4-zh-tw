 SPA_carlist_uprising_mission: "即將到來的卡洛斯派起義"
 SPA_carlist_uprising_mission_desc: "我方陣營中的卡洛斯派分子對我們的領導層和日益增長的影響力心存不滿。這一情緒非但沒有平息，反而同叛變風聲一起在呼嘯兵中蔓延開來。我們應該準備好對付卡洛斯派的起義，就像對付共和派敵人一樣。"
 SPR_anarchist_uprising_mission: "安那其暴動臨近"
 SPR_anarchist_uprising_mission_desc: "我們的安那其“盟友”繼續按照他們獨立自治的白日夢行事。我們越是為了作戰而去試圖組織那些安那其地區，他們就越是鼓動當地人反對合法的西班牙政府。如果事態進一步升級，我們應該準備好對付一場全面的安那其叛亂。"
 SPA_fascist_crackdown_mission: "即將到來的法西斯鎮壓"
 SPA_fascist_crackdown_mission_desc: "從內戰開始以來，我們一直被我們的“長槍黨”盟友排擠在外。這已充分表明，他們對西班牙未來的看法與一個正當的卡洛斯王國是不相容的，毫無疑問，他們正計劃用任何可能的手段完全扼殺我們的影響。如果他們讓我們別無選擇，我們應該準備好用武力捍衛我們的理想。"
 SPR_government_crackdown_mission: "即將到來的政府鎮壓"
 SPR_government_crackdown_mission_desc: "從內戰開始以來，斯大林主義者和共和軍對我們運動的鎮壓不斷加強。起初我們是為了阻止法西斯政變而去流血付出，但持續的安那其自治讓我們一直是政府的眼中釘。很明顯，他們寧願擺脫我們，也不願繼續並肩前行。如果被逼到別無選擇，我們就必須隨時準備以武力捍衛真正的自由。"
 SPA_negotiate_carlist_support_mission_tt: "在內戰開始時，國民軍獲得5支訓練有素的含§Y3個步兵營§!的部隊。\n"
 SPA_negotiate_carlist_support_mission_tt_2: "在內戰開始時，國民軍獲得10支訓練有素的含§Y3個步兵營§!的部隊。\n"
 SPA_the_army_of_africa_mission_tt: "在內戰開始時，國民軍獲得5個訓練有素的含§Y7個步兵營§!和§Y2個炮兵營§!的部隊，並帶有§Y偵查§!和§Y工兵§!支援連，並確保控制§Y[290.GetName]§!。\n"
 SPA_secure_the_northern_garrisons_mission_tt: "國民軍在§Y[171.GetName]§!、§Y[174.GetName]§!、§Y[788.GetName]§!、§Y[791.GetName]§!、§Y[176.GetName]§!、§Y[166.GetName]§!、§Y[172.GetName]§!的§Y駐軍控制§!增加到§R完全§!。\n\n\n內戰開始時國民軍將控制這些省份，只要他們在這些省份中的§Y駐軍控制§!至少是§Y微弱§!。"
 SPR_secure_the_guardia_de_asalto_mission_tt: "在內戰開始時，獲得5支缺乏訓練的含§Y3個步兵營§!的部隊。\n共和軍獲得3支訓練過的含§Y6個步兵營§!的部隊。"
 SPR_secure_the_guardia_de_asalto_mission_tt_2: "在內戰開始時，獲得10支缺乏訓練的含§Y3個步兵營§!的部隊。\n共和軍獲得5支訓練過的含§Y6個步兵營§!的部隊。"
 SPR_secure_the_guardia_civil_mission_tt: "在內戰開始時，獲得3支訓練過的含§Y6個步兵營§!的部隊。\n共和軍獲得6支缺乏訓練的含§Y3個步兵營§!的部隊。"
 SPR_secure_the_guardia_civil_mission_tt_2: "在內戰開始時，獲得5支訓練過的含§Y6個步兵營§!的部隊。\n共和軍獲得10支缺乏訓練的含§Y3個步兵營§!的部隊。"
 SPR_train_the_union_youth_mission_tt: "在內戰開始時，共和軍獲得5支訓練有素的含§Y3個步兵營§!的部隊。\n"
 SPR_train_the_union_youth_mission_tt_2: "在內戰開始時，共和軍獲得10支訓練有素的含§Y3個步兵營§!的部隊。\n"
 SPR_enlarge_the_weapon_caches_mission_tt: "在內戰開始時，我們分到的裝備數量將降低到§Y20%§!而不是§Y50%§!。\n"
 SPR_distribute_arms_to_the_people_mission_tt: "在內戰開始時，共和軍獲得10支未經訓練的含§Y3個步兵營§!的部隊。\n"
 SPR_disband_the_army_mission_tt: "§G解散軍隊會提升共和軍的支持度，從§Y50%§!升到§Y80%§!，並減少非洲軍團的師部隊數量，從§Y5§!個師降至§Y3§!個師。§!\n§Y80%§!份額的部隊將會被§R解散§!。\n\n\n§R這將會導致內戰立刻開啟！§!"
