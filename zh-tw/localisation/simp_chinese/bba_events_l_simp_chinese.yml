 ITA_release_colonies_north_africa_tt: "北非殖民地將被解放。"
 ITA_release_colonies_east_africa_tt: "東非殖民地將被解放。"
 ITA_release_colonies_west_africa_tt: "西非殖民地將被解放。"
 ITA_release_colonies_central_africa_tt: "中非殖民地將被解放。"
 ITA_release_colonies_south_africa_tt: "南部非洲殖民地將被解放。"
 BBA_italy_anti_colonialism_events.100.t: "[FROM.GetAdjective]官員對我方示好"
 BBA_italy_anti_colonialism_events.100.desc: "我們業已收到[FROM.GetName]關於尋求拉進與我們之間關係的談判請求。他們詳盡地回顧了兩國的共同歷史，並且談到如果我們兩國一旦聯合將變得多麼強大。毫無疑問的是，他們將自己看作是這一可能協議的主導者，雖然這個協議在某些方面是有益的，但是這會使我們失去所有的自主權。"
 BBA_italy_anti_colonialism_events.100.a: "阿爾巴尼亞與意大利人民將團結起來！"
 BBA_italy_anti_colonialism_events.100.b: "我們將追隨新的意大利政府"
 BBA_italy_anti_colonialism_events.100.c: "胡說八道！"
 BBA_italy_anti_colonialism_events.101.t: "[FROM.GetNameDefCap]被整合進[ROOT.GetNameDef]"
 BBA_italy_anti_colonialism_events.101.desc: "[FROM.GetAdjective]人民偉大且明智的領袖[FROM.GetLeader]業已同意加入我們並統一成一個國家！這對[ROOT.GetName]和[FROM.GetName]都是意義重大的一天！"
 BBA_italy_anti_colonialism_events.101.a: "好耶！"
 BBA_italy_anti_colonialism_events.102.t: "[FROM.GetAdjective]政府尋求合作"
 BBA_italy_anti_colonialism_events.102.desc: "[FROM.GetAdjective]政府非常明智地選擇加入我們。儘管兩個國家沒有完全合併，但他們還是願意接受[ROOT.GetAdjective]的領導和指引。可能結果遠遠沒有達到預期，不過我們還是在不費一兵一卒的情況下，鞏固了在地中海地區的地位。"
 BBA_italy_anti_colonialism_events.102.a: "工人階級的又一次勝利！"
 BBA_italy_anti_colonialism_events.103.t: "[FROM.GetLeader]拒絕我方領導"
 BBA_italy_anti_colonialism_events.103.desc: "顯而易見的是，[FROM.GetAdjective]人民的領袖是一個愚昧且自私的人。如果加入我們，不但兩國的實力都能得到極大地提升；兩國的人民更是能獲得長久的和平，但[FROM.GetLeader]卻毫無理性地拒絕了。"
 BBA_italy_anti_colonialism_events.103.a: "[FROM.GetAdjective]人民能接受嗎？"
 BBA_italy_anti_colonialism_events.103.b: "[FROM.GetLeader]的統治要到頭了。"
 bba_news.107.t: "教宗駕崩"
 bba_news.107.desc: "教宗庇護十一世在領導大公教會近20年後駕崩。他生前作為普世教會最高教長彌合了教廷與意大利政府之間的漫長分歧，而且在讓梵蒂岡再次成為獨立國家的過程中發揮了關鍵作用。"
 bba_news.107.a: "新教宗當登上聖座。"
 bba_news.107.b: "上主作為何等神秘。"
 ITA_pope_dies_tt: "§Y$ITA_papa_pio_xii$§!成為新教宗"
 bba_news.108.d: "意大利新成立的政府派遣了外交官與阿爾巴尼亞的統治者——索古一世國王進行了一系列談判，希望能增進兩國關係；並向索古施壓，以求社會主義傳播到阿爾巴尼亞的土地上。\n\n也許是感到阿爾巴尼亞君主制大限將至，亦或是單純厭惡社會主義——無論如何，索古一世拒絕了與意大利人員的會談，並號召所有的阿爾巴尼亞人民抵抗[ITA.GetNameDef]的壓迫。\n\n外國軍事專家坦言：就目前情況來看，一旦意大利政府發動任何軍事行動，[ALB.GetNameDef]毫無勝算。"
 bba_news.108.b: "君主制早過時了！"
 bba_news.109.t: "[?ITA.ITA_var_deposed_leader.GetName]被罷免"
 bba_news.109.desc: "令人意想不到的是，[FROM.GetName]法西斯大委員會成功奪權了。[?ITA.ITA_var_deposed_leader.GetName]被罷免並被軟禁。大委員會政變的動機是從因為領袖的軍事失利與執政無能在[FROM.GetName]導致的危局中拯救國家，一些人擔心如果不採取行動挽救局勢，內戰將指日可待。"
 bba_news.109.a: "太可怕了！"
 bba_news.109.b: "太好了！"
 bba_news.110.t: "[FROM.GetName]爆發內戰！"
 bba_news.110.desc: "最近，[FROM.GetName]的新任領導人[FROM.GetLeader]無力應對日益加劇的緊張局勢，導致[FROM.NetAdjective]分裂。內戰爆發，將這個國家從內部撕裂。不同的派別，包括共產黨、保皇黨，民主黨，都在爭奪權力，導致聯盟主導者不斷變化，與此同時，法西斯分子則決心維持其統治。\n\n雖然內戰的結果仍不明朗，但外界的幫助肯定會在未來的勝利中發揮重要作用。 "
 bba_news.110.a: "真是棘手的消息。"
 bba_news.110.b: "我們必須穩定局勢！"
 bba_news.110.c: "這是我們的機會！"
 bba_news.111.t: "安那其主義聯盟的聲明"
 bba_news.111.desc: "[GetAnarchistConfederationEventDesc]"
 bba_news.111.desc_joint_proclamation: "[From.GetName]和[SPC.GetName]發表了聯合聲明，宣佈成立安那其主義聯盟。他們承諾互相幫助，並在一國遭他國攻擊時共同抵抗。成百上千名安那其主義者湧入了意大利，聲援此聯合聲明。"
 bba_news.111.desc_single_proclamation: "政府宣佈成立安那其主義聯盟後，來自世界各地的成千上萬安那其主義者紛紛湧入[FROM.GetName]。在他們的宣言中，他們慷慨宣言要在世界上的每一個角落摧毀資本主義和擊敗法西斯主義。"
 bba_news.111.a: "我們會看看這會持續多久。"
 bba_news.666.t: "教宗上位掌權"
 bba_news.666.desc: "教宗[FROM.GetLeader]震驚了世界各國領袖。他罷黜了[FROM.GetName]的[?ITA.ITA_var_deposed_leader.GetName]國王並以天主旨意為名自行掌權。雖然相當多的意大利人也極其震驚，但教廷在意大利國內廣受支持，一些人則將這起政治劇變作為[FROM.GetNameDefCap]輝煌的新紀元開端而歡呼萬歲。"
 bba_news.666.a: "這真的是想不到。"
 bba_news.200.t: "希特勒之死"
 bba_news.200.desc: "[GER.GetAdjective]廣播播報了一則新聞，稱其元首阿道夫·希特勒已經逝世。這則新聞播報於同盟國和[SOV.GetAdjective]對[GER.Capital.GetCapitalVictoryPointName]發起猛烈進攻，並對[GER.GetAdjective]的腹地發起規模龐大的攻勢之後。[GER.GetLeader]宣佈了這則新聞，據稱，他是元首指定的繼承者。他先表達了國家對希特勒逝去的悲痛，並陳述了他在指揮國家進行這場防禦的指揮部中死去的細節。但是，無論是希特勒的死亡的事實，還是他死亡的方式，都無從考證。但是，這則宣告無疑打擊了[GER.GetAdjective]人民的士氣。 "
 bba_news.200.a: "[GER.GetAdjective]還會繼續作戰嗎？"
 bba_news.200.b: "所以這個雜種死了？我們沒能活捉他真是太可惜了！"
 bba_news.200.c: "我們能確定他已經死了嗎？"
 bba_news.200.d: "這不會改變什麼。我們會戰鬥至最後一人。"
 bba_news.201.t: "[POL.GetAdjective]與[SOV.GetNameDef]結盟"
 bba_news.201.desc: "儘管已有一個[POL.GetAdjective]政府在戰時流亡於倫敦，但是同盟國選擇了承認[SOV.GetAdjective]所扶持的[POL.GetName]共產主義政府為一個合法政府。外交資料顯示，同盟國和[SOV.GetName]間已就戰後對歐洲的勢力劃分達成了協議。而對在倫敦的[POL.GetAdjective]政府來說更不幸的是，對[SOV.GetAdjective]協議最主要的障礙，只是[SOV.GetLeader]將波蘭納入[SOV.GetAdjective]勢力範圍的意願，而不是他們。\n\n雖然很多人將其視為對[POL.GetName]的背叛，仍有很多人認為既然[SOV.GetAdjective]已經佔領了這個國家，拒絕他們的最後通牒並危害歐洲未來的穩定，則顯得沒有什麼必要了。"
 bba_news.201.a: "為未來的和平作出的不幸犧牲"
 bba_news.201.b: "同盟國不值得信任"
 bba_news.201.c: "我們再也不會向歐洲的法西斯侵略者露出弱點"
 ###ITALYS NEWS EVENTS####
 #PURGE THE PARTY
 bba_news.100.t: "[GetPurgeEventTitles]"
 bba_news.100.a: "[GetPurgeEventOptions]"
 bba_news.100.t_some_purged: "清洗國家法西斯黨"
 bba_news.100.desc_some_purged: "隨著[ROOT.GetLeader]在黨內地位進一步提升，一些墨索里尼的親信已經被開除出黨。這場清洗並不像有些人擔心的那樣嚴重，但是仍然讓[ROOT.GetLeader]的位置更加穩固，以在意大利推行他自己的政策。"
 bba_news.100.a_some_purged: "滾得好啊。"
 bba_news.100.t_many_purged: "國家法西斯黨的大清洗"
 bba_news.100.desc_many_purged: "隨著[Root.GetLeader]成為了[ROOT.GetNameDefCap]的絕對領導人，數位法西斯黨高層已經被剝奪了權力。這場清洗徹底清除了任何舊統帥——貝內托·墨索里尼——的潛在盟友，還有他那重回意大利領袖地位的幻想。"
 bba_news.100.a_many_purged: "展示力量"
 bba_news.100.t_none_purged: "沒有清洗的“清洗”"
 bba_news.100.desc_none_purged: "近日有傳言稱，國家法西斯黨內發生了一場清洗，所有忠於墨索里尼的成員都被逐出了黨外。但實際上黨內似乎並沒有發生清洗，取而代之的是一場大赦。這也許會讓國家法西斯黨更加強大，但確實削弱了[ROOT.GetLeader]作為黨魁的地位。"
 bba_news.100.a_none_purged: "大慈大悲的[ROOT.GetLeader]做事真是有一套。"
 #FATE OF MUSSOLINI
 bba_news.101.t: "意大利前領袖貝尼托·墨索里尼被處決"
 bba_news.101.desc: "貝尼托·墨索里尼失勢後，因其昏庸無能和其不作為的叛國行為而一直遭到軟禁。拘禁中的墨索里尼靜待著他的結局——它終於找上門來了。今日清早，這位意大利前任領導者在一群政府代表們的見證下被槍決。他的遺體於同日被安葬，只有他最親近的幾位家屬出席了這場非公開的葬禮。"
 bba_news.101.a: "墨索里尼的生命就這樣結束了。"
 bba_news.102.t: "[GetTrialOfMussoliniTitles]"
 bba_news.102.t_innocent: "墨索里尼被無罪釋放"
 bba_news.102.t_guilty: "墨索里尼被判入獄"
 bba_news.102.desc: "[GetTrialOfMussoliniDesc]"
 bba_news.102.desc_innocent: "令所有人都感到吃驚的事情發生了：對前領袖墨索里尼的審判駁回了他受到的所有指控，他現已被無罪釋放。墨索里尼將能夠以自由的[ROOT.GetNameDefCap]公民的身份度過餘生。他目前還沒有透露將來的計劃，但年邁的領袖在人們心中的影響力絕不可小覷。"
 bba_news.102.desc_guilty: "正如人們預料的那樣，所有針對這位意大利前領袖的指控都已被證實，他被正式宣判有罪。前領袖拒不認罪，但最終還是被判處終身監禁。人們無從得知新政權是否干預了這次審判——如果真是那樣，他們大抵會對其結果感到十分滿意。"
 bba_news.102.a: "假模假樣的審判。"
 bba_news.103.t: "[GetAssassinationOfMussoliniTitles]"
 bba_news.103.t_communists: "墨索里尼被共產黨殺害！"
 bba_news.103.t_coverstory: "墨索里尼逃亡未遂被殺！"
 bba_news.103.desc: "[GetAssassinationOfMussoliniDesc]"
 bba_news.103.desc_communists: "[FROM.GetNameDefCap]的前任領導人貝尼托·墨索里尼死亡，很可能是被共產黨所處決。[FROM.GetLeader]的新政權快速行動，逮捕了多名共產黨同情者。躁動不安的氛圍籠罩著整個國家，很多人呼籲要對他們眼中的敵人伸張正義、以眼還眼。"
 bba_news.103.desc_coverstory: "[FROM.GetNameDefCap]的前任領導人貝尼托·墨索里尼在大權旁落後試圖逃出軟禁他的住宅。一幫武裝分子衝入墨索里尼的住宅並爆發了一場槍戰。墨索里尼在混戰中中槍不治。"
 bba_news.103.a: "亂成了一鍋粥。"
 bba_news.104.t: "公佈新軍事項目"
 bba_news.104.desc: "為了加強兩國的軍事實力，[ROOT.GetNameDefCap]與[FROM.GetNameDefCap]簽署了一項聯合計劃。這項協議能夠讓兩國高效地分享科技工藝和研究成果；同時堅實地維繫兩國之間的紐帶。"
 bba_news.104.a: "一切按計劃進行"
 bba_news.105.t: "簽署新互不侵犯條約"
 bba_news.105.desc: "[ROOT.GetNameDefCap]與[FROM.GetNameDefCap]簽署了互不侵犯條約，保證了兩國之間的和平。兩國因此得以聚焦於其他地區的事務，但是所有人都好奇這份來之不易的條約可以維持多久。"
 bba_news.105.a: "一個明智的決定。"
 bba_news.106.t: "[GetVittorioDiesEventTitles]"
 bba_news.106.t_king: "意大利國王逝世"
 bba_news.106.t_emperor: "意大利皇帝逝世"
 bba_news.106.desc: "[GetVittorioDiesEventDesc]"
 bba_news.106.desc_king: "[FROM.GetName]老國王維托里奧·埃馬努埃萊三世駕崩了。他作為國家穩定的象徵帶領意大利度過了兩次世界大戰，在這些危機歲月中凝聚了[FROM.GetAdjective]的民心。悲傷的民眾走上街頭，向駕崩的國王致以感激與擁戴之心。\n\n全國上下希望老國王唯一的繼承人翁貝托親王可以為[FROM.GetAdjective]的人民擔當同樣堅實可靠的頂梁柱。親王很快將加冕成為國王翁貝托二世——萬歲萬歲萬萬歲！"
 bba_news.106.desc_emperor: "[FROM.GetName]老皇帝維托里奧·埃馬努埃萊三世駕崩了。他作為國家穩定的象徵帶領意大利度過了兩次世界大戰，在這些危機歲月中凝聚了[FROM.GetAdjective]的民心。悲傷的民眾走上街頭，向駕崩的皇帝致以感激與擁戴之心。\n\n全國上下希望老皇帝唯一的繼承人翁貝托親王可以為[FROM.GetAdjective]的人民擔當同樣堅實可靠的頂梁柱。親王很快將加冕成為[FROM.GetName]皇帝翁貝托一世——萬歲萬歲萬萬歲！"
 bba_news.106.a: "一個時代的終結。"
 bba_italian_formables_news.1.t: "意大利完成民族統一"
 bba_italian_formables_news.1.desc: "意大利領導人[ITA.GetLeader]今天宣佈開始將意大利民族統一分子聲索的領土併入版圖。他宣稱這將加強意大利作為世界列強的地位，而且最終將所有意大利人團結在一面國旗之下。很多人會捫心自問，一個如此廣闊的國家是否真能團結統一？只有時間才知道意大利的命運如何。"
 bba_italian_formables_news.1.a: "我們是歐洲的新霸主了！"
 bba_italian_formables_news.1.b: "這樣的國家肯定會崩潰。"
 ##########################################################################
 ###############       Switzerland       ##################################
 ##########################################################################
 #Triggered by focus "Swiss Guiding Principles"
 BBA_switzerland.1.t: "[ROOT.GetAdjective]指導原則"
 BBA_switzerland.1.desc: "[ROOT.GetNameDefCap]和周邊國家的政治局勢都在急轉直下。各種自認為可以在未來的風暴中將瑞士帶向正確方向的指導原則都在出現，而要求我們按照這些原則中的一種行事的呼聲也越來越高。但問題是，該遵循哪個呢？\n\n我們無法預料我們鄰國未來的舉動，但我們必須現在就判斷清楚，哪條路能讓[ROOT.GetName]生存下去。"
 BBA_switzerland.1.a: "我們必須保護我國的民主和中立價值觀。"
 BBA_switzerland.1.b: "也許我們應該更加積極地捍衛我國民主。"
 BBA_switzerland.1.c: "在這種情況下中立是根本不可能維持的。"
 ### David Frankfurter Case ###
 #Assassination
 BBA_switzerland.2.t: "納粹代表在瑞士遭暗殺"
 BBA_switzerland.2.desc: "達維徳·法蘭克福特，一位居住在伯爾尼的克羅地亞猶太人，向格勞賓登州警方自首了。他承認自己暗殺了納粹黨瑞士支部的領導人威廉·古斯特洛夫。\n\n他將自己槍殺古斯特洛夫的動機歸結於兩點。一是納粹黨極端排猶的理念，二是古斯特洛夫本人在納粹理念在[SWI.GetName]的散播中所處的地位。\n\n此次案件非同尋常，很很可能會變為長期要關照的事務。我們處理案件的方式很有可能被[GER.GetNameDef]以及整個世界用於評估我們保持中立和法治的決心。"
 BBA_switzerland.2.a: "他將經歷公正的審判。"
 BBA_switzerland.2.b: "掩蓋事實，把他招為特工！"
 BBA_switzerland.2.c: "他招供了，所以應該立刻將其處以最高刑罰。"
 #Trial Approaches
 BBA_switzerland.3.t: "達維德·法蘭克福特的審判臨近"
 BBA_switzerland.3.desc: "今年二月，達維德·法蘭克福特在達沃斯暗殺了一名納粹黨代表，而如今他的審判即將開始。我們承諾會對他進行中立且公平的審判，但顯然我們還有其他選擇。\n\n我們可以將他秘密釋放並招募他為我們情報系統的一分子，或取消審訊直接對其宣判以安撫[?SWI.SWI_fascist_germany.GetNameDef]。\n\n但很顯然，不論我們怎麼做，想同時討好每方面的人純粹是天方夜譚。"
 BBA_switzerland.3.a: "審判會照常進行。"
 BBA_switzerland.3.b: "他將成為我們情報工作不可多得的財富。"
 BBA_switzerland.3.c: "仔細想想，他顯然是有罪的。"
 #Germany thanks Switzerland for swift action
 BBA_switzerland.4.t: "[?SWI.SWI_fascist_germany.GetLeader]對[SWI.GetName]的決定感到滿意"
 BBA_switzerland.4.desc: "[?SWI.SWI_fascist_germany.GetNameDef]領導人，[?SWI.SWI_fascist_germany.Getleader]對[SWI.GetNameDef]迅速處理謀殺威廉·古斯特洛夫的罪魁禍首表達了[?SWI.SWI_fascist_germany.Getleader.GetHerHis]的感謝，所以[SWI.GetName]今後在此類事件上的立場已經不言而喻。這種對人權和民主價值觀念的忽視必將改善[?SWI.SWI_fascist_germany.GetName]對我們的態度。\n\n儘管[?SWI.SWI_fascist_germany.Getleader.GetHerHis]給出了積極評價，但很明顯，納粹黨期待的結果是將兇手引渡到[?SWI.SWI_fascist_germany.GetNameDef]，即使目前[SWI.GetNameDef]不可能這樣做。"
 BBA_switzerland.4.a: "現在搞定了。"
 #Germany is notified Switzerland decides to continue with the trial.
 BBA_switzerland.5.t: "[SWI.GetName]決定繼續古斯特洛夫事件刺客的審判工作"
 BBA_switzerland.5.desc: "[SWI.GetName]當局宣佈，對在達沃斯謀殺納粹黨外國組織成員供認不諱的達維德·法蘭克福特，將像其他謀殺案一樣，根據格勞賓登州法律接受公平、公正的審判。\n\n考慮到古斯特洛夫是納粹黨的一名官員，以及我們對我們那毫無防備的鄰居的影響，我們可以派一名律師代表古斯特洛夫的遺孀，爭取我們想要的結果。這樣，我們可以確保對他的懲罰與他的罪行相符。\n\n更務實地說，這也可能迫使[SWI.GetNameDef]選邊站，最終打破他們一直喜歡吹噓的脆弱表面中立。"
 BBA_switzerland.5.a: "她值得從這場令人髮指的犯罪中討回公道！"
 BBA_switzerland.5.b: "沒必要干涉[SWI.GetAdjective]內部事務。"
 #Germany INSISTS on harsher trial
 BBA_switzerland.6.t: "[GER.GetAdjective]推動重判達維德·法蘭克福特"
 BBA_switzerland.6.desc: "毫無疑問，古斯特洛夫遺孀的法定代表人是[?SWI.SWI_fascist_germany.GetNameDef]派來的，他正試圖推動聯邦委員會向法院傾斜，對達維德·法蘭克福特作出嚴厲的判決。這是一個非同尋常的要求，毫無疑問，這是[?SWI.SWI_fascist_germany.GetNameDef]試圖向我們施加影響的一種嘗試。\n\n接受這一要求可能會對我們的國際聲譽產生影響，但如果我們決定拒絕他們，我們應該確保我們是否能夠承擔這樣做的後果。"
 BBA_switzerland.6.a: "這是法庭的事兒。"
 BBA_switzerland.6.b: "我們會考慮考慮。"
 #Frankfurter "dies" under mysterious circumstances
 BBA_switzerland.7.t: "法蘭克福特在獄中神秘被殺"
 BBA_switzerland.7.desc: "格勞賓登州當局報告說達維德·法蘭克福特在承認謀殺納粹黨領導人威廉·古斯特洛夫後被正式羈押，然而今天早上他被發現死在牢房裡。關於是自殺還是被同監獄的納粹支持者所殺尚不清楚，但是聯邦警察業已聲明將查明事件真相。\n\n目前我們沒有關於這件離奇事情的任何證據，並且[SWI.GetAdjective]政府不允許[?SWI.SWI_fascist_germany.GetAdjective]代表查驗屍體以及犯罪現場的行為也十分令人生疑。"
 BBA_switzerland.7.a: "啊，好吧。"
 #Frankfurter Trial
 BBA_switzerland.8.t: "審判達維德·法蘭克福特。"
 BBA_switzerland.8.desc: "整個[SWI.GetName]及其鄰國都在關注對達維德·法蘭克福特的審判。這次審判的結果不僅將揭示認罪者的命運，還將揭示整個[SWI.GetNameDef]的命運，以及它究竟願意在其制度和傳統中妥協到什麼程度。\n\n來自法院的所有跡象都指向公正的監禁判決，但委員會的影響可能會改變審判結果，甚至或許還有這個國家的本質。"
 BBA_switzerland.8.a: "讓法庭自己做決定。"
 BBA_switzerland.8.b: "他為民主事業做出了貢獻。他應該被赦免！"
 BBA_switzerland.8.c: "我們擔不起疏遠[?SWI.SWI_fascist_germany.GetNameDef]的風險。他將被處以最高刑罰。"
 #To SWI: Germany is angry
 BBA_switzerland.9.t: "[SWI.GetName]徹底惹惱了我們！"
 BBA_switzerland.9.desc_default: "達維德·法蘭克福特——他不僅刺殺了一位納粹黨成員，更是妄自尊大的承認了一切！我們希望[SWI.GetNameDefCap]能給出一個公正的裁決。然而，一向以中立和法治標榜自己的他們，居然赦免了這樣一位殺人犯。\n\n他們已然表明了自己的立場，一旦開戰，他們也必然會成為我們打擊的對象。[?SWI.SWI_fascist_germany.GetNameDef]的立場不容受辱。"
 BBA_switzerland.9.desc_alt: "我們在[SWI.GetName]的特工報告稱：一向以中立和法治標榜自己的[SWI.GetNameDef]，居然秘密釋放了達維德·法蘭克福特——也就是那位自稱刺殺了威廉·古斯特洛夫的人，並且幫其偽造了死亡證明；他們甚至還將他收入麾下，成為其情報組織的一員。\n\n這表明他們不值得被信任。一旦時機成熟，必須予以剪滅。[?SWI.SWI_fascist_germany.GetNameDef]的立場不允許受到如此明目張膽的挑釁。"
 BBA_switzerland.9.a: "他們會付出代價！"
 #To SWI: Germany is pleased
 BBA_switzerland.10.t: "[?SWI.SWI_fascist_germany.GetNameDefCap]對於[SWI.GetNameDef]的判決感到滿意"
 BBA_switzerland.10.desc: "[?SWI.SWI_fascist_germany.GetNameDef]方面的代表與古斯特洛夫的遺孀對[SWI.GetNameDef]方面針對弗蘭克福特所做出的嚴厲判決表示感謝，這無疑會使他們更加相信[SWI.GetNameDef]在此類問題上的立場。毫無疑問，這將改善[?SWI.SWI_fascist_germany.GetName]對[SWI.GetName]的態度。\n\n雖然[?SWI.SWI_fascist_germany.Getleader.GetHerHis]對此做出了正面評價，但很明顯，納粹黨的理想結局是將犯人引渡到[?SWI.SWI_fascist_germany.GetNameDef]。"
 BBA_switzerland.10.a: "也許這將保障我國的安全。"
 #Trial Verdict
 BBA_switzerland.11.t: "達維德·法蘭克福特被判入獄"
 BBA_switzerland.11.desc_SWI: "由於委員會決定將此案留給格勞賓登州當地的法律與法院，大衛·弗蘭克福特，將因他暗殺威廉·古斯特洛夫的罪行而被判處18年監禁。\n\n我們明白[?SWI.SWI_fascist_germany.GetNameDef]方面會希望判決的力度更具懲罰性，所以我們的外交官將會嘗試著安撫他們，但我們不能在這種時候極為冒險的偏袒任何一方。只有我們的中立才能夠在即將到來得風暴之中保護[SWI.GetAdjective]人民的安全。"
 BBA_switzerland.11.desc_GER: "[SWI.GetNameDefCap]竟然只對殺害古斯特洛夫的兇手判處了微不足道的18年有期徒刑！雖然這令人失望，但我們不能再施壓爭取更嚴厲的懲罰了，因為這可能會激起抵制奧運會的呼聲。\n\n現在，我們至少可以讓古斯特洛夫成為[?SWI.SWI_fascist_germany.GetNameDef]的殉道者，並利用這一謀殺血案進行宣傳。也許在未來的入侵中，我們可以抓獲法蘭克福特，然後伸張正義。"
 BBA_switzerland.11.a: "目前我們只能做到這樣了。"
 BBA_switzerland.11.b: "我們不會忘記的！" #THE GALLLLL!!!!
 #After the war
 BBA_switzerland.12.t: "達維德·法蘭克福特請求赦免"
 BBA_switzerland.12.desc: "現在戰爭已經結束，$GER_fascism_DEF$已然覆滅，1936年殺害威廉·古斯特洛夫的兇手達維德·法蘭克福特在他的法律顧問喬治·布倫施維格的幫助下請求得到特赦。\n\n由於我們不再被法西斯政權所包圍，而且由於在整場戰爭中發現的納粹暴行，法蘭克福特的罪行被世人重新審視，所以對他寬大處理幾乎沒有風險，我們甚至可以禁止他再次前往[ROOT.GetName]，以防萬一。"
 BBA_switzerland.12.a: "他會被赦免。"
 BBA_switzerland.12.b: "他將經歷審判。"
 BBA_switzerland.13.t: "[SWI.GetNameDefCap]接受了我們的請求"
 BBA_switzerland.13.desc: "我們派去協助古斯特洛夫遺孀的代表帶著好消息回來了。[SWI.GetName]的法官對達維德·法蘭克福特作出了非常嚴厲的判決，這一判決與我們所要求的非常接近。"
 BBA_switzerland.13.a: "也許我們終究並不需要入侵了。"
 SWI_frankfurter_trial_will_continue_TT: "§Y達維德·法蘭克福特§!將受到審判，相關事件將隨時間逐漸展開。"
 SWI_frankfurter_immediate_harsh_sentence_TT: "§Y達維德·法蘭克福特§!將不經審判被處以最嚴厲的刑罰。"
 SWI_frankfurter_german_expectations_TT: "§Y[GER.GetNameDefCap]§!希望對§Y達維德·法蘭克福特§!作出更嚴厲的判決"
 #### Other Events ####
 BBA_switzerland.14.t: "200人請願書"
 BBA_switzerland.14.desc: "聯邦委員會收到了一份由200名來自若干右翼團體的成員簽署的請願書，他們希望說服[ROOT.GetNameDef]在保持相對中立的同時建立與[SWI_get_fascist_neighbor]更為友好的關係。為達成這一目標，他們希望對任何針對[SWI_get_fascist_neighbor]的負面新聞進行嚴格的審查，以避免使該國感到憤怒。"
 BBA_switzerland.14.a: "我們應該忽視他們的請求，同時安撫他們。"
 BBA_switzerland.14.b: "他們也有幾分道理。"
 BBA_switzerland.14.c: "這些人是瑞士的敵人，逮捕他們！"
 #Espionage stuff
 BBA_switzerland.15.t: "[FROM.GetName]借給我們一個特工"
 BBA_switzerland.15.desc: "儘管他們是中立地位，[FROM.GetNameDef]秘密給我們提供了一個機會僱傭他們的一個特工來完成我們的特種任務。\n\n這對我們特別有益，因為[SWI.GetNonIdeologyName]的人口基本會說[GER.GetNonIdeologyName]，[FRA.GetNonIdeologyName]和[ITA.GetNonIdeologyName]的語言，因此他們對於滲透這些國家擁有先天優勢。"
 BBA_switzerland.15.a: "我們可以選用一個[GER.GetAdjective]特工。"
 BBA_switzerland.15.b: "一個[ITA.GetAdjective]特工會很管用。"
 BBA_switzerland.15.c: "也許來一個[FRA.GetAdjective]特工會不錯吧。"
 BBA_switzerland_fra.15.tt: "將會獲得一個擁有§Y[FRA.GetAdjectiveCap]§!和§Y[SWI.GetAdjectiveCap]§!國籍的當地特工"
 BBA_switzerland_ita.15.tt: "將會獲得一個擁有§Y[ITA.GetAdjectiveCap]§!和§Y[SWI.GetAdjectiveCap]§!國籍的當地特工"
 BBA_switzerland_ger.15.tt: "將會獲得一個擁有§Y[GER.GetAdjectiveCap]§!和§Y[SWI.GetAdjectiveCap]§!國籍的當地特工"
 BBA_switzerland.16.t: "[FROM.GetNameDefCap]尋求秘密條約"
 BBA_switzerland.16.desc: "我國一名潛伏於[FROM.capital.GetCapitalVictoryPointName]的特工收到了來自[FROM.GetAdjective]政府的提議，提出在我們的陣營和[FROM.GetNameDef]間簽訂秘密條約，使他們在保持表面中立的同時幫助我們削弱歐洲的敵人，甚至在時機成熟時放棄中立並支持我們。\n\n這同時意味著如果他們有遭到入侵的風險，我們將和他們並肩作戰。"
 BBA_switzerland.16.a: "他們會非常有用。"
 BBA_switzerland.16.b: "我們不需要他們的幫助。"
 BBA_switzerland.17.t: "[FROM.GetNameDefCap]接受了我們的秘密條約"
 BBA_switzerland.17.desc: "通過與[FROM.GetNameDef]的秘密聯繫，我們確認他們已經同意了我們提議的秘密聯盟。從現在開始，在對抗敵人時，他們將得到我們的支持，而如果我們遭到入侵，他們也會保護我們。但這並不意味著我們是安全的，因為敵人可能會發現我們的行動，並將他們視為威脅，所以我們必須繼續保持與過去同樣的謹慎，同時為各種行動做好準備。"
 BBA_switzerland.17.a: "這是為了我們的民主！"
 BBA_switzerland.18.t: "[FROM.GetNameDefCap]拒絕了我們的提議！"
 BBA_switzerland.18.desc: "從我們位於[FROM.GetCapitalVictoryPointName]的聯絡人處傳來了壞消息，看起來[FROM.GetAdjective]政府拒絕了我們關於簽訂秘密條約的提議，使我們暴露在遭受鄰國入侵的風險之下。現在我們必須準備好自衛，或者尋求其他保持獨立和民主的途徑。"
 BBA_switzerland.18.a: "我們將獨自面對敵人。"
 ### Diplomatic Events ###
 BBA_switzerland.19.t: "[FROM.GetNameDefCap]邀請我們加入他們的協約"
 BBA_switzerland.19.desc: "歷史上，[FROM.GetName]一直嚴守中立，但似乎為了應對當前的世界形勢，他們決定打破這種中立，並要求其他中立國家同樣打破他們的中立。如果加入他們的陣營對於曾經的中立來說太過激進，我們至少可以保障彼此的獨立。"
 BBA_switzerland.19.a: "非常時刻需要非常手段。"
 BBA_switzerland.19.b: "保證必須充分可靠。"
 BBA_switzerland.19.c: "我們的中立地位或許是我們唯一的保護。"
 BBA_switzerland.20.t: "[FROM.GetName]不加入我們的協約但會提供保障"
 BBA_switzerland.20.desc: "在我們發出加入[ROOT.GetFactionName]的邀請之後，[FROM.GetNameDef]告知我們，雖然他們拒絕了這一建議，但是隻要我們保障他們的獨立，他們同樣將保障我們的獨立。做一下讓步這樣能夠維持他們的中立地位。"
 BBA_switzerland.20.a: "我們可以接受。"
 BBA_switzerland.21.t: "[FROM.GetName]絕望地尋求我們的保障"
 BBA_switzerland.21.desc: "[?FROM.SWI_angriest_country.GetNameDef]列出了一份清單，聲明瞭[FROM.GetName]正越發激進地不斷違反中立原則，威脅要對其發動戰爭，因此，[From.GetNameDef]請求我們保障[FROM.GetAdjective]的獨立，以保護他們對抗好戰的敵人。"
 BBA_switzerland.21.a: "他們需要我們的保護。"
 BBA_switzerland.21.b: "我們不能冒著與[?FROM.SWI_angriest_country.GetName]產生衝突的風險。"
 BBA_switzerland.22.t: "[FROM.GetNameDefCap]承諾保護我們！"
 BBA_switzerland.22.desc: "從[FROM.GetName]歸來的外交官帶來了極好的消息。他們同意保障我們的獨立，承諾一旦別國進攻將保護我們，包括[?SWI.SWI_angriest_country.GetName]。"
 BBA_switzerland.22.a: "或許我們得救了。"
 BBA_switzerland.23.t: "[FROM.GetNameDefCap]拒絕對我們事務做出任何承諾！"
 BBA_switzerland.23.desc: "不幸的是，[FROM.GetName]決定無視我們對抗[?SWI.SWI_angriest_country.GetNameDef]的困境。他們將不會與我們並肩對抗威脅。"
 BBA_switzerland.23.a: "我們只能靠自己了。"
 BBA_switzerland.24.t: "[?SWI.SWI_angriest_country.GetNameDefCap]認為我國違反了中立立場"
 BBA_switzerland.24.desc: "我國的中立性不僅通過對其他國家的平等態度來保持，也通過其他國家對我國態度的看法來保持。[?SWI.SWI_angriest_country.GetNameDef]聲稱我們違背了保持中立的承諾而偏向他們的敵人。他們提出，除非我國儘快對其進行安撫，否則他們將不再認為我們是中立國家，甚至會向我們宣戰。"
 BBA_switzerland.24.a: "令人擔憂！"
 BBA_switzerland.25.t: "[?SWI.SWI_angriest_country.GetNameDefCap]不再認為我國中立"
 BBA_switzerland.25.desc: "情況急轉直下，由於[?SWI.SWI_angriest_country.GetName]表達了對[ROOT.GetNameDef]的蔑視，該國宣佈將會在政治舞臺甚至戰場上和我們一決高下。"
 BBA_switzerland.25.a: "我們前路未卜！"
 ### [REDACTED] Events ###
 BBA_switzerland.97.t: "奧地利海軍老兵向我們拋出橄欖枝"
 BBA_switzerland.97.desc: "打著和家人環遊歐洲的幌子，一位前奧地利潛艇艇長跨過瑞奧邊界找到我們，表示願意效忠[ROOT.GetNameDef]，而條件是在我國獲得政治庇護。\n\n格奧爾格·馮·特拉普在奧匈帝國海軍中戰績出色，但自上次大戰結束之後，奧匈帝國解體，他也喪盡家財，不得不和自己的家人——一家子歌唱家和音樂家一同登臺演出。自從[GER.GetNameDef]吞併奧地利以來，德國政府就一直逼迫他為納粹服役，因此他選擇了逃亡。\n\n當然，他家人的音樂天賦和他的海軍經驗都很寶貴——尤其考慮到我們獲得了沿海領土，但無人知曉如何防守。"
 BBA_switzerland.97.a: "浪濤之下將有我們魚雷的轟鳴。"
 BBA_switzerland.97.b: "他和他的家人大可留在瑞士表演。"
 #### Election Stuff ###
 BBA_SWI_annual_election.1.t: "瑞士聯邦主席選舉"
 BBA_SWI_annual_election.1.desc: "每年，瑞士聯邦議會都會從聯邦委員會中選舉出一位聯邦主席。作為委員會集體領導的代表，[?ROOT.SWI_confederation_president.GetSheHe]將使用[?ROOT.SWI_confederation_president.GetSheHe]有限的權力打破議會中的所有僵局，將議會溫和地帶向安全與榮耀。\n\n[SWI_get_extra_election_paragraph]今年，聯邦議會應該選舉誰成為瑞士聯邦的代表呢？"
 BBA_SWI_annual_election.1.a: "選舉[SWI_GetCouncilor1name]。"
 BBA_SWI_annual_election.1.b: "選舉[SWI_GetCouncilor2name]。"
 BBA_SWI_annual_election.1.c: "選舉[SWI_GetCouncilor3name]。"
 SWI_first_election_text: "一旦一名委員成為聯邦主席，他們就不能再擔任政治顧問，但將會解鎖強大的決議供我們使用。若政治顧問空缺太久，國家會受到懲罰，因此你需要確保快速地填補空缺。\n\n"
 BBA_SWI_annual_election.2.t: "確定聯邦主席的緊急投票！"
 BBA_SWI_annual_election.2.desc: "在經歷了[?SWI_ousted_president.GetName]被史無前例的彈劾以及之後連帶的聯邦委員會執政不穩定期後，我們是應該選舉出新一任聯邦主席了。讓我們期待新主席能糾正[SWI.GetNameDef]的路線，也希望在他之後這個位子還能有後來之人吧。"
 BBA_SWI_annual_election.2.a: "選舉[SWI_GetCouncilor1name]。"
 BBA_SWI_annual_election.2.b: "選舉[SWI_GetCouncilor2name]。"
 BBA_SWI_annual_election.2.c: "選舉[SWI_GetCouncilor3name]。"
 ######## TRADE #######
 BBA_switzerland_trade.1.t: "[FROM.GetNameDefCap]尋求與[ROOT.GetName]建立貿易協定"
 BBA_switzerland_trade.1.desc: "儘管他們之前一直保持中立，但[FROM.GetNameDefCap]正在尋求與我們建立貿易協定。他們要麼是在尋求與我們結盟，要麼是比我們想得更加慌不擇路。\n\n不管如何，我們既能利用他們的工業能力和十字路口位置來獲益，也不用歷經入侵其磐石般國家的磨難。另一方面，這可能意味今後在來自[ROOT.GetNameDef]的入侵行動中將鞏固其陣地。"
 BBA_switzerland_trade.1.a: "他們的工業將為我們的戰爭機器提供燃料。"
 BBA_switzerland_trade.1.b: "我們在民用經濟上互相幫助。"
 BBA_switzerland_trade.1.c: "我們不需要一個懦弱中立國的幫助。"
 BBA_switzerland_trade.1.d: "我們無法信任[FROM.GetName]。"
 BBA_switzerland_trade.2.t: "[FROM.GetName]提前撕毀與我們的貿易協定"
 BBA_switzerland_trade.2.desc: "看來[FROM.GetName]拒絕繼續我們同他們的貿易協定，即便協定對雙方都有利。\n\n我們目前對此無能為力，但種背信棄義的行為肯定會被[ROOT.GetNameDef]所銘記。"
 BBA_switzerland_trade.2.a: "太糟糕了。"
 BBA_switzerland_trade.2.b: "決不讓他們再次欺騙我們。"
 BBA_switzerland_trade.3.t: "我們與[FROM.GetName]正在進行的貿易協定"
 BBA_switzerland_trade.3.desc: "過去一年我們與[FROM.GetNameDef]簽訂的貿易協定對[ROOT.GetName]來說收穫頗豐，現在是我們決定是否續簽的時候了。\n\n儘管這是一條多麼有利的雙邊協議，像我們這樣的國家又多麼的需要它，我們還是應該考慮這樣可能會被一些國家視為對我們中立性的進一步破壞。我們應該確保疏遠他們既可行又值得。"
 BBA_switzerland_trade.3.a: "好，我們需要這些物資以供我們繼續生存。"
 BBA_switzerland_trade.3.b: "不，那樣做太危險。"
 BBA_switzerland_trade.4.t: "[FROM.GetName]想要與我們續簽貿易協定"
 BBA_switzerland_trade.4.desc: "從他們願意冒著再次破壞中立的風險也要從我們這裡獲取物資來看，[FROM.GetName]與我們的貿易協定對他們來說至關重要。\n\n除開我們在為他們提供抵禦我們對[FROM.GetName]可能入侵的工具以外,此協定對我們壞處不算太多。"
 BBA_switzerland_trade.4.a: "讓我們續簽這份協定吧。"
 BBA_switzerland_trade.4.b: "轉焦於民用生產。"
 BBA_switzerland_trade.4.c: "轉焦于軍用生產。"
 BBA_switzerland_trade.4.d: "不再值得我們麻煩了"
 BBA_switzerland_trade.5.t: "[FROM.GetName]放棄了我們的貿易協定"
 BBA_switzerland_trade.5.desc: "儘管我們向[FROM.GetName]允以在雙邊貿易協定中的優厚條款，但他們孤芳自賞，決定拒絕續簽此協定。\n\n這大大超乎我們的預料，為什麼他們會決定這樣做，不過這麼著也許最好。"
 BBA_switzerland_trade.5.a: "這是他們的損失！"
 BBA_switzerland_trade.6.t: "[FROM.GetNameDefCap]接受了我們提出的貿易協定！"
 BBA_switzerland_trade.6.desc: "我國代表團從[FROM.GetName]帶回了一個大消息。這份貿易協定將確保我們獲得必要物資以供我們的工業與人口運存下去。\n\n它國可能將此舉視為對中立的破壞，但對[ROOT.GetName]來說這只是在動盪時期用以維繫我們的獨立所要付出的代價罷了。"
 BBA_switzerland_trade.6.a: "太好了！"
 BBA_switzerland_trade.7.t: "[FROM.GetNameDefCap]拒絕了我們提出的貿易協定"
 BBA_switzerland_trade.7.desc: "雖然我們盡了最大的努力，[FROM.GetAdjective]政府還是決定拒絕我們所提出的雙邊互惠貿易協定。\n\n由於歐洲的形勢，為工業運轉和養活人民所需的物資越來越難以獲取，此舉將可能使[ROOt.GetName]陷入危險境地。"
 BBA_switzerland_trade.7.a: "我們一定能找到其它辦法！"
 BBA_switzerland_trade.8.t: "[FROM.GetNameDefCap]可以幫我們交易黃金"
 BBA_switzerland_trade.8.desc: "隨著全世界各國家之間的緊張局勢加劇，貿易變得愈發困難，而且我們發現要是自己陷入戰爭狀態，那麼連買賣黃金這樣的選項也變得限制重重，[FROM.GetName]的中立也許是我們充實儲備與自由貿易的一個機會，其有利於我們的經濟並最終強化我們的戰爭機器。"
 BBA_switzerland_trade.8.a: "好注意。"
 BBA_switzerland_trade.8.b: "我們不知道他們站在哪一方。"
 BBA_switzerland_trade.9.t: "[FROM.GetNameDefCap]將通過我們來交易黃金"
 BBA_switzerland_trade.9.desc: "此舉意味著他們將自己的黃金儲備放在我們這，我們允許其自由地購買與出售黃金而不用擔心禁運之類的事情。他們並不是唯一以此受益的一方，因為大量湧入的金錢將同樣有助於我們那凋敝的經濟，甚至將來可以將其作為談判的籌碼。"
 BBA_switzerland_trade.9.a: "這會很有用"
 BBA_switzerland_trade.10.t: "[FROM.GetNameDefCap]拒絕使用我們的銀行系統"
 BBA_switzerland_trade.10.desc: "儘管明顯對雙方都有利，但[FROM.GetName]似乎對增加與世界其它地區的黃金貿易不感興趣。"
 BBA_switzerland_trade.10.a: "哦，好吧"
 BBA_switzerland_trade.11.t: "我們可以通過[FROM.GetAdjective]交易所進一步地交易黃金"
 BBA_switzerland_trade.11.desc: "我們已經在利用[FROM.GetName]市場來繞過因世界緊張局勢所設立的貿易壁壘。增加我們的儲備量將能更有益於我們的經濟，就算這樣同樣會有益於他們的經濟。"
 BBA_switzerland_trade.11.a: "他們已證明自己值得被信任"
 BBA_switzerland_trade.11.b: "我們不能冒會造成更大背叛的風險"
 BBA_switzerland_trade.12.t: "[FROM.GetNameDefCap]沒收了我們的黃金儲備！"
 BBA_switzerland_trade.12.desc: "正如我們覺得可能會發生的那樣，他們披著中立的外衣，在背後捅了我們一刀。這將對我們的經濟產生嚴重的後果，我們必須對他們進行報復。"
 BBA_switzerland_trade.12.a: "他們會付出代價的。"
 BBA_switzerland_trade.13.t: "[FROM.GetName]希望我們投資他們的國家"
 BBA_switzerland_trade.13.desc: "[FROM.GetNameDefCap]正在尋求我們的幫助以抵禦迫在眉睫的法西斯國家。我們可以投資他們的經濟，從而讓他們可以為最壞的情況做好準備，甚至可以在他們主動或被迫打破他們長期以來恪守中立的情況下直接幫助他們打擊法西斯主義。"
 BBA_switzerland_trade.13.a: "我們將幫助他們抵禦法西斯主義。"
 BBA_switzerland_trade.13.b: "這對我們根本沒好處。"
 BBA_switzerland_trade.14.t: "[FROM.GetNameDefCap]將投資[ROOT.GetName]"
 BBA_switzerland_trade.14.desc: "這些投資將幫助我們發展經濟並且讓我們能夠抵抗法西斯主義可能給[ROOT.GetName]帶來的困難。這些投資同樣可以讓我們聯繫更加緊密，或許甚至最終可以走向法西斯主義的對立面。"
 BBA_switzerland_trade.14.a: "這是個好消息！"
 BBA_switzerland_trade.15.t: "[FROM.GetNameDefCap]拒絕投資"
 BBA_switzerland_trade.15.desc: "很不幸，我們得知[FROM.GetName]將不會投資[ROOT.GetAdjective]經濟。由於考慮到法西斯主義日漸臨近的危險，我們的處境比我們想像的更加孤立。"
 BBA_switzerland_trade.15.a: "這是個問題。"
 ####### FASCIST EVENTS ###########
 BBA_switzerland_fascist.1.t: "[FROM.GetNameDefCap]希望我們的保護"
 BBA_switzerland_fascist.1.desc: "[FROM.GetName]這個曾經是犯罪天堂的弱小國家，正希望作為一個傀儡依附於[ROOT.GetNameDef]。這可以被視為我們對弱者的接納，或者對[ROOT.GetRulingParty]的忠誠的一種宣告。\n\n他們強大的防禦能力和訓練有素的公民或許能夠為我們未來的計劃服務。"
 BBA_switzerland_fascist.1.a: "他們會與我們同行。"
 BBA_switzerland_fascist.1.b: "我們不需要他們！"
 BBA_switzerland_fascist.2.t: "[FROM.GetNameDefCap]拒絕了我們"
 BBA_switzerland_fascist.2.desc: "儘管我們向[FROM.GetName]提出了各種建議，他們還是拒絕了我們向[FROM.GetAdjective]政權投降的請求。\n\n這使我們處於危險的境地，因為我們顯然失去了中立地位，而且我們必須獨自面對即將到來的任何災難。"
 BBA_switzerland_fascist.2.a: "地平線上的烏雲。"
 BBA_switzerland_fascist.3.t: "[SWI.GetName]要求控制[848.GetName]"
 BBA_switzerland_fascist.3.desc: "[FROM.GetNameDef]聲稱他們擁有對[848.GetName]的宣稱，在1919年的一次公投中，該地區的大多數人選擇加入當時的瑞士聯邦。儘管他們已放棄了民主，而且公投發生在幾十年前，但讓他們控制這一地區能夠節省我國的相關資源，並且可以作為對[FROM.GetName]的能力、或者說更重要的是忠誠度的考驗。"
 BBA_switzerland_fascist.3.a: "這塊地方理應是他們的。"
 BBA_switzerland_fascist.3.b: "我們不能放心地把這塊地交給他們。"
 BBA_switzerland_fascist.4.t: "[FROM.GetNameDefCap]拒絕了我們擴張的請求"
 BBA_switzerland_fascist.4.desc: "儘管我們的忠誠和能力盡顯，但[FROM.GetNameDef]選擇拒絕我們的請求。[ROOT.GetNameDef]向[?SWI.SWI_requested_territory.GetName]的擴張需要再等等，也許直到我們認為不再值得繼續從屬於[FROM.GetName]為止。"
 BBA_switzerland_fascist.4.a: "這塊地方理應是他們的。"
 BBA_switzerland_fascist.5.t: "[FROM.GetNameDefCap]同意了我們關於控制[?SWI.SWI_requested_territory.GetName]的要求"
 BBA_switzerland_fascist.5.desc: "雖然可能代價沉重，但我們對[FROM.GetNameDef]展示出的服從和尊重帶來了回報。[ROOT.GetNameDef]能夠立刻獲得[?SWI.SWI_requested_territory.GetName]的控制權，並能將其納入自身的領土。"
 BBA_switzerland_fascist.5.a: "非常好。"
 BBA_switzerland_fascist.5.b: "我們發誓會繼續前進。"
 BBA_switzerland_fascist.6.t: "[SWI.GetName]要求擴張他們的領土"
 BBA_switzerland_fascist.6.desc: "在[FROM.GetAdjective]十分成功地控制了[848.GetName]之後，[FROM.GetNameDef]建議代替我們防禦我們的[SWI_requested_territory.GetAdjective]。\n\n當然，這一建議意味著我們需要將地區的控制權交給他們，因此我們應當謹慎地評估一下他們的可靠程度。"
 BBA_switzerland_fascist.6.a: "他們已經證明了自己。"
 BBA_switzerland_fascist.6.b: "$BBA_switzerland_fascist.3.b$"
 BBA_switzerland_fascist.7.t: "[FROM.GetNameDefCap]歡迎我們的加入"
 BBA_switzerland_fascist.7.desc: "在一場[ROOT.GetCapitalVictoryPointName]的集會上，[ROOT.GetLeader]宣佈了[FROM.GetName]已經承諾要與我們國家緊密合作，並保護[ROOT.GetName]免受任何敵人侵擾。\n\n來自[FROM.GetNameDef]的友好的長官和工作人員，作為我們的朋友，正在我們在此集會時不斷湧入我們的國家，來幫助我們發展軍事力量，並將其整合到他們的軍事力量當中。"
 BBA_switzerland_fascist.7.a: "大有裨益！"
 ##########  SWISS EXPANSION EVENTS #######
 BBA_swiss_expansion.1.t: "我們還沒有對[SWI_influenced_state]施加足夠影響"
 BBA_swiss_expansion.1.desc: "儘管我們的宣傳人員已經用盡全力，但民主的浪潮並未如我們預期的在[?SWI.SWI_influence_target_state.GetName]各州傳播開來，很不幸，我們並不認為加入我們的全民公投會取得成功。\n\n當然這並不意味著我們就應該放棄，我們已經種下了一顆在未來將會生長壯大的種子，下次我們將更有可能獲得成功。"
 BBA_swiss_expansion.1.a: "我們絕不會放棄我們的使命。"
 BBA_swiss_expansion.2.t: "在我們的影響下，[SWI_influenced_state]希望加入"
 BBA_swiss_expansion.2.desc: "經過廣泛的宣傳活動，[?SWI.SWI_influence_target_state.GetName]人民壓倒性地支持加入[ROOT.GetNameDef]。\n\n民眾的支持意味著，如果[?SWI.SWI_influence_target_state.GetName]屬於一個與我國類似的民主國家，其將能通過民主程序加入我國。不幸的是，情況並非如此，所以他們需要我們的幫助，才能成為[SWI.GetName]的新成員。\n\n我們現在可以施壓，要求在該地區進行公投，以決定他們是否要繼續留在[ROOT.GetNameDef]。"
 BBA_swiss_expansion.2.a: "我們必須為他們帶去真正的民主。"
 BBA_swiss_expansion.3.t: "[FROM.GetNameDefCap]要求獲得[SWI_pressed_state]"
 BBA_swiss_expansion.3.desc: "那些據稱中立的[FROM.GetName]流氓居然膽敢宣稱[?SWI.SWI_state_being_claimed.GetName]屬於他們。他們聲稱，該地區要求加入[FROM.GetNameDef]的呼聲很高，就算進行公投結果也會是加入他們，因此他們認為該地是他們的合法領土。\n\n我們可以讓[?SWI.SWI_state_being_claimed.GetName]進行一場我們毫無懸念會輸掉的公投，或者冒著與他們開戰的風險拒絕。"
 BBA_swiss_expansion.3.a: "我們不吃這套！"
 BBA_swiss_expansion.3.b: "接下來開始公投吧。"
 BBA_swiss_expansion.4.t: "[FROM.GetName]接受公投！"
 BBA_swiss_expansion.4.desc: "在全[?SWI.SWI_state_being_claimed.GetName]各地進行了有利於我們的和平公投之後，[FROM.GetNameDef]接受了公投結果並將這一地區的控制權轉交給我們。我們將立刻將[?SWI.SWI_state_being_claimed.GetName]內領土轉換成聯邦各州，並且他們最終將沐浴在我們的民主制度之下。"
 BBA_swiss_expansion.4.a: "我們的聯邦擴張了！"
 BBA_swiss_expansion.5.t: "[FROM.GetNameDef]無視公投呼籲！"
 BBA_swiss_expansion.5.desc: "儘管有著對民主和[ROOT.GetNameDef]的廣泛支持，[FROM.GetName]仍決定忽視[?SWI.SWI_state_being_claimed.GetName]人民對於加入聯邦一事舉行全民公投的呼聲。\n\n這釋放了一個明確的信號，我們應當拿起武器，保衛我們被佔領的州，抵抗[FROM.GetNameDef]的暴政。"
 BBA_swiss_expansion.5.a: "我們發誓要實現它！"
 BBA_swiss_expansion.6.t: "[FROM.GetNameDefCap]索取[848.GetName]"
 BBA_swiss_expansion.6.desc: "似乎[FROM.GetName]正要求[848.GetName]地區併入他們的聯邦。該國引用了1919年的一次公投，該地區以壓倒性多數票要求成為[FROM.GetNameDef]的一個州，但是[FROM.GetAdjective]拒絕了。現在看來他們改變了主意。\n\n不管我們是否願意接受，很明顯，他們已經把目光放在了擴張上，所以我們應該謹慎行事，就算同意他們的要求，也必須做好保衛我國領土的準備。"
 BBA_swiss_expansion.6.a: "為這麼一個小地區不值得冒險。"
 BBA_swiss_expansion.6.b: "[ROOT.GetNameDefCap]絕不割讓任何領土！"
 BBA_swiss_expansion.6.c: "我們絕不會被這個歐洲大地上的膿包恐嚇。"
 BBA_swiss_expansion.6.d: "好，很好。"
 BBA_swiss_expansion.7.t: "[FROM.GetNameDefCap]拒絕了我們關於讓[848.GetName]加入[ROOT.GetName]的要求"
 BBA_swiss_expansion.7.desc: "儘管面對我們的強宣稱和[848.GetName]人民的民主意願，[FROM.GetAdjective]政府仍斷然拒絕了我們的請求。\n\n我們不能讓這個恥辱就這麼算了。"
 BBA_swiss_expansion.7.a: "總有一天[848.GetName]會自由！"
 BBA_swiss_expansion.8.t: "[FROM.GetAdjective]政府業已同意我們關於[848.GetName]自由的請求"
 BBA_swiss_expansion.8.desc: "[FROM.GetNameDefCap]業已收到並且同意我們關於將[848.GetName]合併入[ROOT.GetNameDef]成為一個州的要求。\n\n這只是[ROOT.GetName]為了建設一個更加民主的歐洲邁出的第一步！"
 BBA_swiss_expansion.8.a: "這是為了民主！"
 BBA_swiss_expansion.9.t: "[FROM.GetName]提供保護"
 BBA_swiss_expansion.9.desc: "在憑藉著脆弱的偽裝要求我們交出[848.GetName]之後，[FROM.GetNameDef]要求獲取我們所有的領土，據稱這是為了保護我們免於不久之後想試圖吞併[ROOT.GetNameDef]的[GER.GetNameDef]的侵略。\n\n雖然這個提議聽上去比較合理，而且我們團結一起能夠更好地抵禦入侵，但是拿我們的主權作交換可能代價過於高昂了。\n\n當然，一旦我們拒絕這一提議，他們有可能對我們發動攻擊。"
 BBA_swiss_expansion.9.a: "這或許是我們生存的唯一機會。"
 BBA_swiss_expansion.9.b: "那是我們不願付出的代價！"
 BBA_swiss_expansion.10.t: "[FROM.GetNameDefCap]將會加入瑞士！"
 BBA_swiss_expansion.10.desc: "阿爾卑斯山的人們將慶祝我們兩個阿爾卑斯國家的聯合！我們將能夠更好地抵禦那些環繞我們的大國。"
 BBA_swiss_expansion.10.a: "終於！"
 BBA_swiss_expansion.11.t: "[FROM.GetNameDefCap]拒絕了我們"
 BBA_swiss_expansion.11.desc: "儘管我們是試圖建立一個能夠抵禦歐洲強權的新國家，但是[FROM.GetLeader]依然針對我們的提議表達了[FROM.GetLeader.GetHerHis]反感。"
 BBA_swiss_expansion.11.a: "我們只剩一個選擇了。"
 BBA_swiss_expansion.12.t: "[FROM.GetName]宣稱我們的阿爾卑斯領地"
 BBA_swiss_expansion.12.desc: "在本次風波一次難以預料的轉折中，[FROM.GetNameDef]聲稱[ROOT.GetAdjective]阿爾卑斯地區是他們的固有領土。他們的說法完全是無理取鬧，但他們確實已經武裝了絕大部分人口，隨時準備入侵我們，只等我們拒絕。如果我們說不，充足的準備以及對他們有利的地形將使這場戰爭漫長而代價高昂，因此我們必須慎重考慮。"
 BBA_swiss_expansion.12.desc_FRA: "我們的友邦共和國，[FROM.GetNameDef]正在尋求將阿爾卑斯地區全部納入他們的勢力範圍，並對該地區提出了領土要求。\n\n我們的[ROOT.GetAdjective]阿爾卑斯地區已經屬於我國很長時間了，但讓它們成為[FROM.GetAdjective]領土的一部分可以獎勵它們的忠誠和幹勁，使它們成為更強大的盟友。"
 BBA_swiss_expansion.12.a: "把阿爾卑斯給他們。"
 BBA_swiss_expansion.12.b: "真是荒謬！"
 BBA_swiss_expansion.13.t: "[FROM.GetNameDefCap]接受了我們的要求！"
 BBA_swiss_expansion.13.desc: "[FROM.GetAdjective]政府做了正確的決定，並且稱他們的阿爾卑斯地區領土劃歸我們是理所應當的。這將保證我們的安全免受未來侵略者的侵犯。"
 BBA_swiss_expansion.13.a: "歡迎這些新加入的州！"
 BBA_swiss_expansion.14.t: "[FROM.GetName]拒絕了我們在阿爾卑斯地區的要求"
 BBA_swiss_expansion.14.desc: "儘管我們強力要求獲得[FROM.GetAdjective]阿爾卑斯地區，[FROM.GetNameDef]依然對於我們的宣稱表示了拒絕。如果我們選擇繼續與他們共進退，我們依然有其他方式來奪取這片領土。"
 BBA_swiss_expansion.14.a: "我們會得到它的，無論是什麼方式。"
 BBA_swiss_expansion.15.t: "[FROM.GetName]正試圖慫恿[AUS.GetName]反抗我們！"
 BBA_swiss_expansion.15.desc: "我們試圖將[AUS.GetNonIdeologyName]與[ROOT.GetNonIdeologyName]合併的做法被[FROM.GetName]攪黃了。他們大肆宣揚自己那套可鄙的政治體系，還順便貶低了我們。\n\n在敵人發動輿論誹謗攻勢的時候試圖推動兩國合併是不可能完成的事情，所以我們必須靜待時機，從而最終實現我國的光輝天命！"
 BBA_swiss_expansion.15.a: "他們只是在拖延不可避免的事情罷了！"
 BBA_swiss_expansion.16.t: "[FROM.GetNonIdeologyName]要求獨立"
 BBA_swiss_expansion.16.desc: "儘管我們給予了保護與支持，我們的附屬[FROM.GetName]如今要求我們釋放他們，解除對他們的特權和對於我們的責任，從而再次成為他們自己的獨立國家。\n\n[GetDemandingAlpsParagraph]"
 BBA_swiss_expansion.16.a: "[SWI_only_independence_response]"
 BBA_swiss_expansion.16.b: "他們將和我們阿爾卑斯地區一起，成為一個獨立的國家。"
 BBA_swiss_expansion.16.c: "他們必須為之而戰。"
 SWI_independence_demand_alps_paragraph: "除了獨立自主以外，他們更進一步要求我們交出部分阿爾卑斯地區，明擺著要建立一個包括整個阿爾卑斯山脈的國家。\n\n"
 SWI_no_alps_independence: "他們可以再次獲得獨立。"
 SWI_have_alps_but_only_independence: "我們可以允許獨立，到此為止。"
 BBA_swiss_expansion.17.t_alps: "[FROM.GetName]准許我們獨立但是不給予他們的阿爾卑斯領土。"
 BBA_swiss_expansion.17.t_no_alps: "[ROOT.GetName]再度獨立！"
 BBA_swiss_expansion.17.desc_alps: "即使我們沒有實現所有的目的，但這依然是意義重大的一天。[FROM.GetNameDefCap]勉為其難地同意我們與他們分道揚鑣，准許了我們期待已久的獨立。然而與此同時他們也無恥地宣佈他們不會放棄阿爾卑斯地區的領土。\n\n我們將不得不尋求其他可以讓阿爾卑斯地區歸附我們的方式。"
 BBA_swiss_expansion.17.desc_no_alps: "這是對[ROOT.GetNonIdeologyName]而言歡樂的一天，[FROM.GetNameDef]業已接受了我們的獨立請求。這意味著我們又可以自由地決定我們自己的政策，自由地選擇我們的外交政策立場。然而批判性地看，我們也將自己保護自己。"
 BBA_swiss_expansion.17.a: "[ROOT.GetNonIdeologyName]接下來是什麼呢？"
 BBA_swiss_expansion.18.t: "[FROM.GetNameDefCap]准許我們和阿爾卑斯地區的獨立與解放"
 BBA_swiss_expansion.18.desc: "我們的計劃終於要取得成功了。[ROOT.GetNonIdeologyName]馬上就將重得獨立地位，而作為我們的一部分，和我們一同獨立的還有先前[FROM.GetAdjective]的阿爾卑斯區。\n\n雖然我們不再接受先前宗主的保護，但新得到的土地會讓我們國家的生存得到進一步保障。"
 BBA_swiss_expansion.18.a: "[ROOT.GetNameDefCap]崛起！"
 BBA_swiss_expansion.19.t: "[FROM.GetName]將不會讓[ROOT.GetNonIdeologyName]獨立！"
 BBA_swiss_expansion.19.desc: "我們獨立的宣告並沒有被前宗主[FROM.GetNameDef]善意地接受。現在他們試圖通過對我們發動戰爭來拿下我們的國家，讓我們拿起武器給他們證明看看[ROOT.GetName]沒那麼容易屈服。"
 BBA_swiss_expansion.19.a: "拿起武器！"
 SWI_delayed_anschluss_TT: "在直到§Y[AUS.GetName]§!的民族精神§Y$SWI_swiss_democratic_propaganda$§!被移除的三個月內，§Y[GER.GetNameDefCap]§!將§R無法推進德奧合併§!。"
 SWI_expantion_state_loc: "[?SWI.SWI_influence_target_state.GetName]"
 SWI_expansion_no_state: "地區"
 SWI_claiming_state_loc: "[?SWI_state_being_claimed.GetName]"
 SWI_claiming_no_state_loc: "我們其中一個地區"
 SWI_press_for_future_canton_TT: "解鎖決議：§Y向外國施壓以吞併受我國影響的州§!"
