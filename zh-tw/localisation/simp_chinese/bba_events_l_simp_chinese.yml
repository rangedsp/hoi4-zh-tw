 bba_africa_news.1.t: "東非聯邦的建立"
 bba_africa_news.1.desc: "在二十世紀二十年代，殖民總管利奧·阿梅里曾試圖建立一個由肯尼亞，烏干達和坦噶尼喀組成的白人統治的東非聯合國家。當時這個計劃遭到了反對最終未能成功。但是現如今，東非當地人民開始應用這一概念作為建立他們自己國家的基礎，這使得他們變得前所未有地強大。他們正式宣告，歐洲統治非洲的時代到此為止了！"
 bba_africa_news.1.a: "終於，我們統一了！"
 bba_africa_news.1.b: "這是殖民時代的結束嗎？"
 bba_africa_news.2.t: "非洲之角統一"
 bba_africa_news.2.desc: "在經歷了幾個世紀的分裂與戰爭後，非洲之角的人民已經統一到了一個國家之下。在過去這幾乎就要成為現實，但是民族主義者的野心始終是一種阻礙，使得人們之間四分五裂。但是現在，這一地區的統治者[ROOT.GetLeader]已經宣稱這個國家將不會只對特定的群體有益，而是將成為所有人的統一體。他宣稱，這次統一之後，該地區將永遠保持和平、繁榮與團結，直到人類滅亡。"
 bba_africa_news.2.a: "讓我們期待和平與繁榮"
 bba_africa_news.2.b: "這對該地區將意味著什麼？"
 bba_africa_news.3.t: "非洲統一組織建立"
 bba_africa_news.3.desc: "非洲國家開始通過創建一個政府間組織來相互合作。這個新的非洲統一組織承諾將推進成員國的安全與經濟發展。他們能否貫徹他們高舉的那些理念還有待觀察。"
 bba_africa_news.3.a: "絕妙的提案！"
 bba_africa_news.3.b: "多麼蒼白的一個概念。"
 bba_africa_news.4.t: "非洲聯盟的建立"
 bba_africa_news.4.desc: "很多人懷疑非洲統一組織貫徹它所擁護的承諾與理念的能力。然而，組織各成員國業已堅定了通過建立一個更大的非洲聯盟國家來加深他們統一性的信念。儘管為了整合每一個成員國的政治系統依然有很大量的工作要做，但依然可以觀察到的是一個新的世界強權將開始塑造非洲。"
 bba_africa_news.4.a: "合則立，分則亡！"
 bba_africa_news.4.b: "這算不了什麼。"


