 BBA_italy_anti_colonialism_events.62.t: "中東公投加入[ROOT.GetNameDef]"
 BBA_italy_anti_colonialism_events.62.desc: "中東人民業已看到我們對他們家園的治理是如何的仁慈和高效，所以他們決定通過公投加入我們！如此看來，我們在他們地區的投資以及政策傾斜已經收到了回報。這將讓我們共同受益。"
