 #UGA Peace
 BBA_ethiopia_communist_events.51.t: "[ETH.GetNameDefCap]提議和談"
 BBA_ethiopia_communist_events.51.desc: "[ETH.GetAdjective]的外交官向我們提出了一份和平草議。而條件是：我們必須放棄所有在戰爭中已被[ETH.GetNameDef]佔領的所有[UGA.GetAdjective]領土。外交官同時也表示會在這些地區組建一個新的[UGA.GetAdjective]政府，當然，政府的獨立性也會酌情而定。 "
 BBA_ethiopia_communist_events.51.a: "我們決不會放棄我們的領土。"
 BBA_ethiopia_communist_events.51.b: "我們別無選擇，只能同意"
 BBA_ethiopia_communist_events.52.t: "[ETH.GetNameDefCap]與[SOV.GetNameDef]決裂"
 BBA_ethiopia_communist_events.52.desc: "[ETH.GetAdjective]政府精心策劃了一場巨大行動；剝奪了我們對整個國家的掌控權。[ETH.Getleader]向我們的外交大使表明，自此[ETH.GetLeader.GetSheHe]會接管[ETH.GetAdjective]的一切事務。而在[ETH.Capital.GetCapitalVictoryPointName]的所有[SOV.GetAdjective]人員也都早已被[ETH.GetAdjective]部隊轉移到同一地點集中看押。如果我們快速應對，情況本可以得到控制。然而，機會轉瞬即逝，我們已無翻盤可能。"
 BBA_ethiopia_communist_events.52.a: "我們有更重要的事要做。"
 BBA_ethiopia_communist_events.52.b: "他們會知道錯在哪的。"
 BBA_ethiopia_communist_events.53.t: "[SOV.GetNameDefCap]拒絕派遣顧問"
 BBA_ethiopia_communist_events.53.desc: "結果令人大失所望，[SOV.GetAdjective]外交官告知我們：此時此刻，他們不會向我們派遣任何軍事人員。他們表示自己國家邊境的安全問題才是重中之重。不過，為了以示友好，他們還是給了我們一船步兵裝備。"
 BBA_ethiopia_communist_events.53.a: "聊勝於無。"
 BBA_ethiopia_communist_events.54.t: "來自[JAP.GetNameDef]的秘密援助"
 BBA_ethiopia_communist_events.54.desc: "隨著近期[JAP.GetAdjective]志願者到來參加我們的鬥爭，[JAP.Capital.GetCapitalVictoryPointName]方面也通知我們，他們正準備提供步兵裝備作為物質援助。這些裝備將會極大幫助革命。然而，[JAP.GetAdjective]政府希望我們對他們的裝備援助嚴格保密，以免引發其與其他大國之間的外交問題。"
 BBA_ethiopia_communist_events.54.a: "同志，感謝你們！"
 BBA_ethiopia_communist_events.55.t: "顛覆分子逃離[JAP.GetAdjective]帝國"
 BBA_ethiopia_communist_events.55.desc: "憲兵隊報告稱諸多顛覆分子已經登上了前去東非的貨輪，逃出了帝國法網。傳言稱$IA_sakutaro_iwasa$和$IA_sanshiro_ishikawa$兩人也在其中。他們很有可能是去加入[ETH.GetNameDef]的革命運動。"
 BBA_ethiopia_communist_events.55.a: "行吧，問題把自己給解決了。"
 BBA_ethiopia_communist_events.55.b: "這些叛徒必須立刻引渡回[JAP.GetName]！"
 BBA_ethiopia_communist_events.56.t: "[JAP.GetAdjective]志願者前往東非"
 BBA_ethiopia_communist_events.56.desc: "情報機關報告稱他們已協助一批志願者通過安全的航路抵達東非，以支援東非的革命運動。$IA_sakutaro_iwasa$和$IA_sanshiro_ishikawa$也在志願者隊伍中。 "
 BBA_ethiopia_communist_events.56.a: "加油，同志們！"
 BBA_ethiopia_communist_events.56.b: "也許在支持[ETH.GetNameDef]的鬥爭方面我們已經沒什麼可做的了。"
 BBA_ethiopia_communist_events.57.t: "[JAP.GetNameDefCap]要求引渡$IA_sakutaro_iwasa$及$IA_sanshiro_ishikawa$"
 BBA_ethiopia_communist_events.57.desc: "我們收到了[JAP.GetName]政府的正式外交照會，要求引渡抵達我國希望參與革命的[JAP.GetAdjective]臣民。雖然我們並不清楚他們的目的為何，但照會也表明，如果我們拒絕要求，他們不會善罷甘休。"
 BBA_ethiopia_communist_events.57.a: "我們不會屈從於反動派的威脅。順便問候問候他們的天皇……"
 BBA_ethiopia_communist_events.58.t: "[ETH.GetNameDef]-[JAP.GetName]關係破裂"
 BBA_ethiopia_communist_events.58.desc: "正如我們所料，領導[ETH.GetNameDef]革命的暴民拒絕引渡其境內的[JAP.GetAdjective]的異見人士。在他們毫無外交辭令和格式的粗鄙文書中，他們甚至還膽敢多次侮辱威脅我們崇高的天皇！"
 BBA_ethiopia_communist_events.58.a: "我們對這些毀掉本國遺產的蠢貨本就沒什麼可期待的。"
 BBA_ethiopia_communist_events.58.b: "這樣的侮辱不可接受！"
 BBA_ethiopia_communist_events.59.t: "[JAP.GetAdjective]禁運"
 BBA_ethiopia_communist_events.59.desc: "我們對[JAP.GetAdjective]要求的拒絕似乎激怒了他們的政府。他們宣佈將在可見的未來對我們持續進行貿易禁運，而理由是我方在東非進行“危害極大的意識形態活動”。"
 BBA_ethiopia_communist_events.59.a: "反正我們也不需要和他們貿易。"
 BBA_ethiopia_communist_events.60.t: "[FROM.GetName]拒絕和平提議"
 BBA_ethiopia_communist_events.60.desc: "來自[FROM.GetNameDef]的大使拒絕了我們的和平請求。他們聲稱我們對他們所發起的進攻是完全沒有緣由的，因此，他們不接受來自已成為地區性威脅的我們的任何除無條件投降外的提議。"
 BBA_ethiopia_communist_events.60.a: "真是虛偽，對於他們的帝國主義暴行只能以暴制暴。"
 BBA_ethiopia_communist_events.61.t: "[FROM.GetNameDefCap]就[?ETH.ETH_disputed_colony.GetAdjective]獨立提出和平提議"
 BBA_ethiopia_communist_events.61.desc: "[FROM.GetAdjective]外交官向我們呈遞了一份和平協議。這項協議要求我們放棄對在與[FROM.GetNameDef]的衝突中所丟失的[?ETH.ETH_disputed_colony.GetAdjective]領土的宣稱。外交官同時提出，會在我們放棄的[?ETH.ETH_disputed_colony.GetAdjective]領土上舉行公投，以此選舉出新的政府，但選舉是否獨立公正卻沒人清楚。"
 BBA_ethiopia_communist_events.61.a: "我們決不會放棄我們的領土。"
 BBA_ethiopia_communist_events.61.b: "我們別無選擇，只能同意"
 BBA_ethiopia_communist_events.62.t: "[FROM.GetName]同意這個和平提議"
 BBA_ethiopia_communist_events.62.desc: "來自[FROM.GetNameDef]的外交官通知我們，他們願意放棄被我們解放的[?ETH.ETH_disputed_colony.GetAdjective]殖民地。現在他們正將部隊撤退到該地區新劃定的邊界處。"
 BBA_ethiopia_communist_events.62.a: "反對帝國主義的英勇勝利！"
 BBA_african_union_events.1.t: "非洲統一組織給予成員國資格"
 BBA_african_union_events.1.desc: "非洲統一組織已投票決定給予我們成員國身份。該組織為非洲國家在一起為共同利益討論與合作所設立。如果我們加入，可能會加入成員國間的共同防禦協定。不過我們也必須得遵守組織規則。"
 BBA_african_union_events.1.a: "成員國身份將有利於我們。"
 BBA_african_union_events.1.b: "我們對該組織毫無興趣。"
 BBA_african_union_events.2.t: "[FROM.GetNameDefCap]加入非洲統一組織"
 BBA_african_union_events.2.desc: "[FROM.GetNameDefCap]已接受非洲統一組織的成員國邀請。希望這一舉動會是國與國之間合作關係的開始。 "
 BBA_african_union_events.2.a: "我們攜手步入強大。"
 BBA_african_union_events.3.t: "[FROM.GetNameDefCap]拒絕非洲統一組織成員國資格"
 BBA_african_union_events.3.desc: "[FROM.GetNameDefCap]已拒絕我們的非洲統一組織成員國邀請。現不明這是否只是由於其內部政治鬥爭，或是他們在非洲的對外政策與我們不一的一個標誌。也許他們以後會樂意加入。"
 BBA_african_union_events.3.a: "那很遺憾。"
 BBA_african_union_events.4.t: "[ETH_GetCentralBankName]成員國"
 BBA_african_union_events.4.desc: "非洲統一組織創建了一個[ETH_GetCentralBankName]併為成長中的組織管理貨幣。目標讓所有成員國共同使用一種貨幣，並開始把我們的經濟整合在一起。此舉有望有利於日後的經濟發展，但加入將導致短時間內的大量交易問題，就像人們要習慣新貨幣一樣。"
 BBA_african_union_events.4.a: "短暫的痛苦是值得的。"
 BBA_african_union_events.4.b: "這將傷害我們的經濟。"
 BBA_african_union_events.5.t: "[FROM.GetNameDefCap]拒絕了[ETH_GetCentralBankName]的成員資格"
 BBA_african_union_events.5.desc: "[FROM.GetNameDefCap]的政府拒絕加入[ETH_GetCentralBankName]，相反，他們更願意在可預見的未來保持對本國貨幣和貿易關稅的控制。"
 BBA_african_union_events.5.a: "一個目光短淺的決定！"
 BBA_african_union_events.6.t: "[FROM.GetNameDefCap]加入[ETH_GetCentralBankName]"
 BBA_african_union_events.6.desc: "[FROM.GetNameDefCap]同意加入[ETH_GetCentralBankName]並已經開始調整他們的貨幣和我們的貨幣。很快，我們兩國之間的貿易將變得更加容易。"
 BBA_african_union_events.6.a: "明智之舉。"
 BBA_african_union_events.7.t: "非洲統一組織執行理事會"
 BBA_african_union_events.7.desc: "非洲統一組織成立了一個執行理事會以管理其成員國的政治事務。理事會包含了來自各成員國的代表，並試圖將各國對外與對內政策引導至同一方向。如果我們加入，這將是邁向與其它成員國政經完全一體化的一步。然而這將使我們的政治獨立性大大降低。"
 BBA_african_union_events.7.a: "我們致力於更深度的一體化。"
 BBA_african_union_events.7.b: "我們不會簽署這個的。"
 BBA_african_union_events.8.t: "[FROM.GetNameDefCap]加入執行理事會"
 BBA_african_union_events.8.desc: "[FROM.GetNameDef]政府已同意加入非洲統一組織執行理事會。他們現在正在簽署一些適當的條約來認可其在所有法律性事務中的權威性。"
 BBA_african_union_events.8.a: "離完全整合更近了一步。"
 BBA_african_union_events.9.t: "[FROM.GetNameDefCap]拒絕加入執行理事會"
 BBA_african_union_events.9.desc: "[FROM.GetNameDef]政府已拒絕加入非洲統一組織執行理事會。[FROM.GetLeader]引述[FROM.GetLeader.GetHerHis]有關主權的擔憂，同時渴望在沒有理事會許可的情況下與組織外的國家達成協議。"
 BBA_african_union_events.9.a: "為什麼連他們都是成員國？"
 BBA_african_union_events.10.t: "[FROM.GetNameDefCap]推傳非洲統一組織"
 BBA_african_union_events.10.desc: "[FROM.GetNameDefCap]在我國開展了一次宣傳活動，嘗試讓我們對非洲統一組織有所改觀。這一舉動無疑是向我們施加壓力，以此使我們更進一步融入此組織。"
 BBA_african_union_events.10.a: "他們不該干涉我國事務。"
 BBA_african_union_events.11.t: "[FROM.GetAdjective]施壓"
 BBA_african_union_events.11.desc: "[FROM.GetNameDefCap]稱如果我們不調整政策方針與他們一致，就要下場親自威脅我國要員了。這一舉動無疑是向我們施加壓力，以此使我們更進一步融入此組織。"
 BBA_african_union_events.11.a: "以後我們會加倍注意。"
 BBA_african_union_events.11.b: "我們不會被[ETH.GetLeader]所恐嚇。"
 BBA_african_union_events.12.t: "開始全面整合進程"
 BBA_african_union_events.12.desc: "非洲聯盟已開始將我們徹底整合進其聯盟的進程。希望此舉將成為我們人民的光明歷史篇章，但非洲聯盟的終點在哪仍未可知。"
 BBA_african_union_events.12.a: "我們知道這一天會來到。"
 BBA_african_union_events.13.t: "[FROM.GetNameDefCap]離開非洲統一組織"
 BBA_african_union_events.13.desc: "[FROM.GetLeader]宣佈[FROM.GetNameDef]退出了非洲統一組織。他們提及對組織方向上的擔憂，並指責我們背叛了其所建立的價值觀。"
 BBA_african_union_events.13.a: "我們求同存異。"
 BBA_african_union_events.14.t: "[FROM.GetNameDefCap]離開非洲統一組織"
 BBA_african_union_events.14.desc: "[FROM.GetLeader]宣佈[FROM.GetNameDef]退出了非洲統一組織。他們提及對組織方向上的擔憂，並指責我們背叛了其所建立的價值觀。"
 BBA_african_union_events.14.a: "我們求同存異。"
 BBA_african_union_events.14.b: "真是駭人聽聞！"
 BBA_african_union_events.15.t: "非洲統一組織的防禦協定"
 BBA_african_union_events.15.desc: "非洲統一組織提出了一個成員國間的共同防禦協定。這意味著對任一成員國的攻擊會被視作對所有成員國的攻擊。希望這能威懾域外的侵略者們不要進攻組織的成員國，並阻止成員國間的戰爭。"
 BBA_african_union_events.15.a: "這將阻卻衝突。"
 BBA_african_union_events.15.b: "我們對這樣的安排不感興趣。"
 BBA_african_union_events.16.t: "[FROM.GetNameDefCap]拒絕防禦協定"
 BBA_african_union_events.16.desc: "[FROM.GetNameDefCap]拒絕了非洲統一組織的共同防禦協定。這可能是由於他們對我們的組織的態度是否發生了轉變，或者是由於他們國內政策，使得這份協議不合時宜，這一切還有待觀察。"
 BBA_african_union_events.16.a: "真可疑。"
 BBA_african_union_events.17.t: "[FROM.GetNameDefCap]加入防禦條約"
 BBA_african_union_events.17.desc: "[FROM.GetNameDefCap]已同意加入非洲統一組織的防禦條約。現在我們有義務在任一方遭到攻擊時保護彼此。"
 BBA_african_union_events.17.a: "好消息。"
 BBA_african_union_events.18.t: "行使非洲統一組織的防禦協定"
 BBA_african_union_events.18.desc: "非洲統一組織防禦協定的一個簽署國遭到了攻擊。同為簽署國的我們有義務對他們展開軍事援助。如果我們袖手旁觀，我們肯定會被開除出協定，可能也會破壞我們與眾簽署國之間的外交關係。"
 BBA_african_union_events.18.a: "我們當然會保護他們。"
 BBA_african_union_events.18.b: "也許下筆簽字是個錯誤。"
 BBA_african_union_events.19.t: "[FROM.GetNameDefCap]來防"
 BBA_african_union_events.19.desc: "[FROM.GetName]作為非洲統一組織共同防禦協定的簽署國，已同意維持與他們的防禦承諾。"
 BBA_african_union_events.19.a: "齊心協力，我們將取得勝利。"
 BBA_african_union_events.20.t: "[FROM.GetNameDefCap]打破防禦協定"
 BBA_african_union_events.20.desc: "雖然[FROM.GetName]是非洲統一組織共同防禦協定的一員，但其拒絕維持他們的防禦承諾。我們正在將他們開除出協定。"
 BBA_african_union_events.20.a: "他把我們全出賣了。"
 BBA_african_union_events.21.t: "[THIS.GetAdjective]經濟增長"
 BBA_african_union_events.21.desc: "不久前我們的經濟產值為了適應[ETH_GetCentralBankName]的新貨幣而遭受打擊。然而我們的工業產出現在開始再次增長，甚至超過了之前的記錄。經濟學家將增長歸結於打通與眾[THIS.GetNameDef]的貿易壁壘，其他成員國使用共通貨幣也讓我們的經濟更為一體化。"
 BBA_african_union_events.21.a: "終於有所回報了。"
 BBA_african_union_events.22.t: "對[FROM.GetNameDef]的威脅嘗試失敗"
 BBA_african_union_events.22.desc: "[FROM.GetNameDef]的領導層回應稱，對我們威脅嘗試感到十分惱怒。看來他們在近期不大可能願意與我們合作了。"
 BBA_african_union_events.22.a: "他們不可能一直這樣下去。"
 BBA_african_union_events.23.t: "對[FROM.GetNameDef]的威脅嘗試成功"
 BBA_african_union_events.23.desc: "[FROM.GetNameDef]的領導層盡最大努力來緩解我們對共同在非洲統一組織里有關政策一致性的憂慮。他們是如此懂事，甚至保證在以後做出任何魯莽決定都要先諮詢我們的大使。"
 BBA_african_union_events.23.a: "好極了。"
 ####### ITALY ######
 BBA_italy_second_italo_ethiopian_war.1.t: "[FROM.GetAdjective]議和"
 BBA_italy_second_italo_ethiopian_war.1.desc: "[FROM.GetName]被我們打跑了！我們強大的軍隊讓[FROM.GetAdjective]軍隊損失慘重，讓他們不得不跪倒求和。我國戰火長久不熄，和平自然是民心所向，但是這也是我們爭取更大勝利的好機會——更大的勝利將保證沒有任何一個愚蠢的歐洲國家膽敢再次試圖征服不可戰勝的埃塞俄比亞！"
 BBA_italy_second_italo_ethiopian_war.1.a: "那就議和吧！"
 BBA_italy_second_italo_ethiopian_war.1.b: "絕不議和！窮追猛打！"
 BBA_italy_second_italo_ethiopian_war.2.t: "[FROM.GetName]接受[ROOT.GetAdjective]的和平提議"
 BBA_italy_second_italo_ethiopian_war.2.desc: "阿比西尼亞人接受了我們慷慨的和平提議。這與我們在戰爭爆發之初設想的光榮勝利相差甚遠，但我們也許從戰爭已經結束的事實中感到了一絲輕鬆。就像過去的很多時候那樣，我們要度過這段恥辱歲月後強勢崛起，而且比以往更加強大！"
 BBA_italy_second_italo_ethiopian_war.2.a: "太丟人了……"
 BBA_italy_second_italo_ethiopian_war.3.t: "[FROM.GetName]拒絕[ROOT.GetAdjective]的和平提議"
 BBA_italy_second_italo_ethiopian_war.3.desc: "如果他們真的想要戰爭，我們也不怕！阿比西尼亞拒絕了我們慷慨的和平提議，決定繼續打下去。我們會讓這些不知好歹的混蛋好好見識意大利人的勇武是什麼樣子的！這只是一次小敗，我們會將他們殺回群山，然後把他們打個片甲不留。"
 BBA_italy_second_italo_ethiopian_war.3.a: "我們將逆轉戰局！"
 #1st Missiolini localized at the beginning of the file along with Italo-Ethiopian War events
 BBA_italy_missiolinis.02_north.t: "北部戰線僵持不下"
 BBA_italy_missiolinis.02_north.desc: "我軍在阿比西尼亞北部的反擊並未取得預想之中的成功。領袖深信全世界不僅把他視為笑柄，還在嘲笑戰爭的僵局。領袖開始考慮是否需要親自接管北部戰線，以確保部隊調度有方。"
 BBA_italy_missiolinis.02_north.a: "我們將會凱旋——或早或晚。"
 BBA_italy_missiolinis.02_north.b: "領導層該換了！"
 BBA_italy_missiolinis.02_north.c: "奇恥大辱！"
 BBA_italy_missiolinis.04_south.t: "南部戰線僵持不下"
 BBA_italy_missiolinis.04_south.desc: "阿比西尼亞南部戰線展開的反擊並未取得領袖所預期的戰果，於是，他用了好幾個小時來埋怨他身邊都是怎樣的一群窩囊廢。看起來，領袖已經確信，整個軍隊指揮層都在故意和他作對。在他看來，連將軍們都巴不得輸掉整場戰爭。"
 BBA_italy_missiolinis.04_south.a: "我們將會凱旋——或早或晚。"
 BBA_italy_missiolinis.04_south.b: "領導層該換了！"
 BBA_italy_missiolinis.04_south.c: "奇恥大辱！"
 BBA_italy_missiolinis.03_north.t: "埃塞俄比亞北部的勝利"
 BBA_italy_missiolinis.03_north.desc: "阿比西尼亞北部戰線的部隊成功擊退了敵軍的兇猛攻勢。對於這樣的部隊和戰果，墨索里尼只有滿滿的欽佩之情。他從未懷疑過我軍的實力——只要他們能在領袖的激勵下拿出幹勁，運用好致勝的手段。"
 BBA_italy_missiolinis.03_north.a: "我們把敵軍打得屁滾尿流！"
 BBA_italy_missiolinis.05_south.t: "埃塞俄比亞南部的勝利"
 BBA_italy_missiolinis.05_south.desc: "阿比西尼亞南部戰線的進展讓墨索里尼喜出望外，他讚揚了意大利軍隊展現出的英勇，以及我軍為結束這場衝突所付出的犧牲。領袖從未有過半點疑慮，他完全相信，我軍在戰場上能夠取得勝利——只要他們能得到領袖的適當支持。"
 BBA_italy_missiolinis.05_south.a: "我們把敵軍打退了！"
 BBA_italy_missiolinis.11.t: "結束戰爭"
 BBA_italy_missiolinis.11.desc: "領袖現在希望快速贏得阿比西尼亞戰爭，從而讓意大利可以在其他地方建功立業。征服阿克蘇姆舊地必將鞏固意大利在世界各列強中的地位。\n\n阿比西尼亞人還剩多少堡壘都必須要被攻克，阿比西尼亞全部領土都必須要歸於意大利。"
 BBA_italy_missiolinis.11.a: "敵人必將落敗！"
 BBA_italy_missiolinis.12.t: "戰爭繼續"
 BBA_italy_missiolinis.12.desc: "阿比西尼亞仍在獨立且抵抗入侵的事實讓領袖發怒了好幾個小時。他稱之為他個人乃至整個意大利國家和民族的恥辱。領袖憤怒地和周邊所有人抱怨說，如果他可以在戰爭的最後階段親自督戰，也許戰爭現在已經結束了。"
 BBA_italy_missiolinis.12.a: "阿比西尼亞人還挺能打。"
 BBA_italy_missiolinis.13.t: "征服埃塞俄比亞"
 BBA_italy_missiolinis.13.desc: "墨索里尼欣喜若狂，向所有無論是否樂意傾聽的人不停誇耀我國最近的大勝。儘管先前困難重重，但是他從不懷疑意大利終將在阿比西尼亞大獲全勝。我們終於一雪第一次意埃戰爭失敗的前恥了！\n\n領袖將這次征服稱讚為法西斯體制和自己所領導的政府的勝利，並號召全體意大利人要比過去更加強大、更加團結。"
 BBA_italy_missiolinis.13.a: "唯有浴血方能驅動歷史的車輪。"
 BBA_italy_missiolinis.21.t: "平定埃塞俄比亞"
 BBA_italy_missiolinis.21.desc: "領袖在臺面上聲稱阿比西尼亞人在大敗之後已是潰不成軍、兵無鬥志，然而他私下在咒罵阿比西尼亞人對意大利的統治頑固剛硬、不服王化。為儘快平定阿比西尼亞並將其納入統治，領袖下令強力討滅當地叛軍並立法嚴管人民。"
 BBA_italy_missiolinis.21.a: "我們將會帶來長治久安。"
 BBA_italy_missiolinis.22.t: "埃塞俄比亞仍在抵抗"
 BBA_italy_missiolinis.22.desc: "阿比西尼亞不僅未被肅正平定，而且仍在反抗意大利的佔領。領袖對阿比西尼亞人和治安行動都牢騷滿腹，並將掃蕩作戰的失敗稱為國恥。他抱怨說意大利殖民者儀容儀表粗陋、言行舉止不雅，令當地人難以心生敬畏。"
 BBA_italy_missiolinis.22.a: "阿比西尼亞人比想像中的更頑固。"
 BBA_italy_missiolinis.23.t: "埃塞俄比亞已被平定"
 BBA_italy_missiolinis.23.desc: "我們終於鎮壓了阿比西尼亞的反抗。從高聳的山巒之巔到低窪的沙漠平原，當地人都盡在意大利掌控之下。欣喜若狂的墨索里尼宣佈他終於可以把精力集中在其他事務上了，這樣意大利勢必興旺發達，還能拿回本應屬於自己的一切。"
 BBA_italy_missiolinis.23.a: "意大利之治，至高無上。"
 BBA_italy_missiolinis.31.t: "工業化項目"
 BBA_italy_missiolinis.31.desc: "為了讓意大利實現真正的繁榮富強，領袖確立了提高生產能力的計劃。要實現成為富強國家的願景，我們需要更多工廠來維持帝國的蓬勃發展。"
 BBA_italy_missiolinis.31.a: "發展工業吧。"
 BBA_italy_missiolinis.32.t: "工業化進程滯後"
 BBA_italy_missiolinis.32.desc: "領袖對國家工業建設進度的滯後甚是不滿。領袖哀嘆自己沒有阻礙他人，反而是他自己被束手束腳，以致他的意大利富強偉業難以實現。"
 BBA_italy_missiolinis.32.a: "我們必須更加努力。"
 BBA_italy_missiolinis.33.t: "工業化項目成功"
 BBA_italy_missiolinis.33.desc: "墨索里尼稱讚新建的工廠為意大利工業現代化的基石。領袖非常高興，新工廠既提高了國家的生產能力，也對進一步實現他大意大利的願景有極大幫助。"
 BBA_italy_missiolinis.33.a: "邁向偉大的開端。"
 BBA_italy_missiolinis.41.t: "加強軍事建設"
 BBA_italy_missiolinis.41.desc: "就像古羅馬帝國一樣，我們新興的帝國幅員遼闊，需要強大的軍隊御蠻夷於國門之外。領袖相信意大利如要與其他列強一決高下，就需要有強大的力量支撐我們的豪言壯語——沒有強大的力量，就沒有國家會正眼看我們！"
 BBA_italy_missiolinis.41.a: "為了意大利！"
 BBA_italy_missiolinis.42.t: "擴軍失敗"
 BBA_italy_missiolinis.42.desc: "領袖視我國與敵國之間綿長的邊境線為弱點，而意大利無可用之兵也是他的心頭大患。領袖對我們最近失敗的擴軍非常失望，開始質疑人民對他的意大利偉大復興事業是否忠誠不二。"
 BBA_italy_missiolinis.42.a: "總該用什麼來捍衛意大利吧……"
 BBA_italy_missiolinis.43.t: "擴軍成功"
 BBA_italy_missiolinis.43.desc: "墨索里尼親自視察了幾支新組建的部隊，他們將保衛我們的邊境或是開疆擴土——如果領袖認為有必要的話。現在墨索里尼對軍隊的規模非常滿意，並且吹噓說正是因為他的真知灼見，意大利軍隊才成為了讓敵人為之側目的強大力量。"
 BBA_italy_missiolinis.43.a: "意大利安然自立。"
 BBA_italy_missiolinis.51.t: "增加補給卡車的數量"
 BBA_italy_missiolinis.51.desc: "我們最近遭遇的一場小型衝突暴露了我們軍隊後勤方面的缺點。我們的最高指揮部已經說服了我們的墨索里尼為我們的後勤部隊訂購更多的補給卡車。儘管墨索里尼最開始大手一揮決定為我們的後勤安排起碼5000輛補給卡車，但我們還是成功勸阻了他的這個念頭——畢竟數量合理即可。"
 BBA_italy_missiolinis.51.a: "……最起碼不用安排5000輛卡車了。"
 BBA_italy_missiolinis.52.t: "運輸卡車過少"
 BBA_italy_missiolinis.52.desc: "遺憾的是軍隊後勤所收到的卡車數量遠低於軍方的訂單需求，這使得領袖對目前落後的工業大感失望並大動肝火。領袖更確信只有自己才能看清楚意大利及其人民的巨大潛力。"
 BBA_italy_missiolinis.52.a: "我們的軍隊要忍耐。"
 BBA_italy_missiolinis.53.t: "運輸卡車充足"
 BBA_italy_missiolinis.53.desc: "墨索里尼親自為交付了軍方補給卡車訂單的工廠獻上了祝賀——並將那些辛勞工作的工人稱作為意大利的中流砥柱。現在墨索里尼暢想著我們的軍隊終成為一支機動性不俗，能在各式各樣的地形上閃電般突進的部隊，並且不會受到後勤滯後的限制。"
 BBA_italy_missiolinis.53.a: "那是當然，我們的軍隊銳不可當！"
 BBA_italy_missiolinis.61.t: "燃油儲備計劃"
 BBA_italy_missiolinis.61.desc: "現代軍隊需要同時用糧食和燃油來餵飽，不然整臺戰爭機器就將停轉。最高指揮部最終讓領袖意識到了這一點——缺少燃油會讓現代軍隊趴窩。各軍種都需要燃油，而我們如要決勝沙場，就必須有供給大量燃油的實力。"
 BBA_italy_missiolinis.61.a: "我們必須想辦法儲備燃油。"
 BBA_italy_missiolinis.62.t: "燃油儲備依然不足"
 BBA_italy_missiolinis.62.desc: "燃油儲備緊缺一直是軍方高層所擔心的問題——如果缺少燃油，那麼戰機將無法升空、戰艦將拋錨在港、戰車將無法開拔。墨索里尼確信意大利從上至下都會一如既往地堅定執行他的命令，但目前的狀況讓他感到非常的生氣。"
 BBA_italy_missiolinis.62.a: "我們必須處理好這件事。"
 BBA_italy_missiolinis.63.t: "燃油儲備成功增加"
 BBA_italy_missiolinis.63.desc: "墨索里尼對目前的狀況感到非常滿意，他非常確信意軍已經準備好發動或面對一場對敵國的全面戰爭了，因為燃油的儲備充足——至少不會開戰沒幾天就耗盡。軍隊最高指揮部並沒有像墨索里尼那樣就此放心，但燃油使用緊張的狀況畢竟還是緩解了。"
 BBA_italy_missiolinis.63.a: "我們的儲備終有一天會派上用場。"
 BBA_italy_missiolinis.71.t: "皇家空軍擴軍"
 BBA_italy_missiolinis.71.desc: "意大利皇家空軍自領袖下令組建以來一直代表著我國的榮耀，也是世界一流空軍。但問題是它的規模太小了，而現在領袖已經同意生產更多飛機來擴編它。"
 BBA_italy_missiolinis.71.a: "皇家空軍是我們的驕傲。"
 BBA_italy_missiolinis.72.t: "規模可悲的空軍"
 BBA_italy_missiolinis.72.desc: "新戰機的生產本應是領袖親選的絕妙宣傳素材，但現狀讓他不得不放棄。戰機產量的嚴重不足讓領袖怒火中燒，他正在尋找為這一切慘狀負責的替罪羊。"
 BBA_italy_missiolinis.72.a: "真是不幸"
 BBA_italy_missiolinis.73.t: "皇家空軍終展翅"
 BBA_italy_missiolinis.73.desc: "墨索里尼個人對加強皇家空軍的計劃十分感興趣，並試圖利用這個機會來展現意大利工業的強大之處。整個計劃已經變成了以皇家空軍為核心，展現意大利成熟航空業以及先進工程學的舞臺。"
 BBA_italy_missiolinis.73.a: "皇家空軍萬勝！"
 BBA_italy_missiolinis.81.t: "技術革新"
 BBA_italy_missiolinis.81.desc: "領袖決定展現法西斯體制的優越性，以及如何更高效地進行組織人力和資源調配。他接下來的目標是向意大利民族與全世界展示法西斯主義能夠飛速實現技術革新。領袖還希望藉此以徹底統合聚少離多的意大利人民。"
 BBA_italy_missiolinis.81.a: "整個世界都會為之側目。"
 BBA_italy_missiolinis.82.t: "技術迭代速度緩慢"
 BBA_italy_missiolinis.82.desc: "領袖試圖展現法西斯體制優越性的一系列舉措起到了完全相反的效果，這讓這位自認為是“偉大領袖”的傢伙不停咒罵著任何一個他所記得住的下屬。人們非但沒有牢牢團結在法西斯的旗幟之下，反而愈發覺得墨索里尼是一個跳梁小丑。至少領袖認為大家是這麼看待他的。"
 BBA_italy_missiolinis.82.a: "不過只是一小點挫折……"
 BBA_italy_missiolinis.83.t: "技術飛躍令人側目"
 BBA_italy_missiolinis.83.desc: "新型技術的快速迭代確實證明了法西斯體制的優越性，領袖毫不懷疑這是在他的領導下才能夠取得的巨大成功。因為這不僅關乎於證明法西斯體系的卓越，更關乎於墨索里尼自身以及他對意大利美好未來的願景。當然，這一切是否真的能讓意大利和他的人民緊緊團結在領袖周圍還有待觀察。"
 BBA_italy_missiolinis.83.a: "為了領袖和祖國！"
 BBA_italy_missiolinis.91.t: "擴張情報部門"
 BBA_italy_missiolinis.91.desc: "領袖已經決定給情報部門調撥更多的資源，併發誓要將其打造成世界一流情報機構。領袖又同時公開讚揚我國特工是如何巧妙地滲透到意大利社會的方方面面，讓共產主義者、犯罪分子和其他害群之馬無處遁形並被繩之以法，使意大利更加長治久安。"
 BBA_italy_missiolinis.91.a: "該擴張情報部門了。"
 BBA_italy_missiolinis.92.t: "情報部門運作失利"
 BBA_italy_missiolinis.92.desc: "情報部門不僅沒有如願想中的那樣得到加強，相反，數份機密文件被竊取——不僅如此，情報局特工的能力也遭受了懷疑。儘管失竊的文件並沒有想像中的那般重要，但這讓不久前還吹噓情報機構是如何能幹的領袖感到十分尷尬。這不僅會讓領袖大動肝火，甚至會讓我們的人民質疑我們的能力，敵人也會藉此嘲笑我們。"
 BBA_italy_missiolinis.92.a: "真是尷尬啊……"
 BBA_italy_missiolinis.93.t: "情報部門運作出色"
 BBA_italy_missiolinis.93.desc: "幾名持不同政見的意大利公民因密謀藉助他國援助破壞國家穩定、損害國家安全、破壞法西斯政府權利而被捕，這毫無疑問地證明了我們情報機構的能力。墨索里尼將這一事件大肆宣傳，並指出只有在他的領導下，意大利才能克服任何困難，迎來一個又一個勝利。"
 BBA_italy_missiolinis.93.a: "真正的偉績。"
 BBA_italy_missiolinis.101.t: "佔領阿爾巴尼亞"
 BBA_italy_missiolinis.101.desc: "意大利和阿爾巴尼亞之間的緊密聯繫可以追溯到幾千年以前的羅馬帝國。我們兩國曆史關係甚密，而領袖也決意加深這一紐帶。他需要立刻將阿爾巴尼亞納入意大利，要求軍隊迅速佔領該國，以便讓我們完全控制亞得里亞海的入海口。雖然長期以來，意大利總是被認為是列強之末——至少領袖是這樣認為的，但很快一切都將不一樣了！榮耀與光輝必將歸於意大利！"
 BBA_italy_missiolinis.101.a: "榮耀歸於意大利！"
 BBA_italy_missiolinis.102.t: "在阿爾巴尼亞的慘敗"
 BBA_italy_missiolinis.102.desc: "領袖對我軍在阿爾巴尼亞的毫無作為大感疑惑，他稱之為國恥。領袖在私下裡憤怒地咆哮，說這本該是意大利以及他本人的光耀之日，也本可以洗刷近20年前從此地羞辱撤軍的前恥，然而這一切都因為無能鼠輩們而功虧一簣。"
 BBA_italy_missiolinis.102.a: "真是恥辱。"
 BBA_italy_missiolinis.103.t: "佔領阿爾巴尼亞"
 BBA_italy_missiolinis.103.desc: "墨索里尼高興地向熱情的群眾宣佈，我們的軍隊在阿爾巴尼亞取得了勝利。他繼續說，現在該國完全處於我們的掌控之中，這將讓意大利更加偉大光榮。墨索里尼宣稱老牌帝國已時日無多，屬於意大利的時代即將到來。"
 BBA_italy_missiolinis.103.a: "為了未來的榮耀！"
 BBA_italy_missiolinis.111.t: "征服達爾馬提亞"
 BBA_italy_missiolinis.111.desc: "儘管我們是世界大戰的勝利者之一，並通過倫敦協定得到了獲得達爾馬提亞的承諾，但我們被所謂的盟友出賣了。“我們從來沒有得到承諾給我們的東西，所以現在我們必須用武力奪取它，”領袖進一步指出，意大利的命運就是無視舊勢力的阻撓，拿走理應屬於我們的東西。"
 BBA_italy_missiolinis.111.a: "達爾馬提亞當然是我們的！"
 BBA_italy_missiolinis.112.t: "入侵達爾馬提亞失利"
 BBA_italy_missiolinis.112.desc: "本該是對亞得里亞海海岸的快速入侵，卻變成了一場苦戰。我們的軍隊在達爾馬提亞陷入了困境，無法實現承諾給意大利人民帶來的偉大征服。領袖有幾次神經兮兮地嘀咕達爾馬提亞如何理所當然地屬於我們，而這並不是領袖所希望的展現武力的成果。"
 BBA_italy_missiolinis.112.a: "這隻會加深對我們的偏見。"
 BBA_italy_missiolinis.113.t: "征服達爾馬提亞"
 BBA_italy_missiolinis.113.desc: "昔日不公，今得平反！達爾馬提亞海岸是我們的了。墨索里尼興高采烈，稱這次勝利是意大利及其人民的偉大時刻。他宣稱曾經的沉冤已被昭雪。人們走上街頭慶祝這一重大時刻。"
 BBA_italy_missiolinis.113.a: "沉冤昭雪！"
 BBA_italy_missiolinis.121.t: "征服希臘"
 BBA_italy_missiolinis.121.desc: "在最近的一次演講中，領袖概述了他對大意大利的願景，其中一點是我們必須突破其他大國對我國的封鎖。他宣稱希臘是意大利及其擴張的一個關鍵點，是一個需要克服的障礙，這樣我們才能突破我們身上的束縛並開始擴張。"
 BBA_italy_missiolinis.121.a: "必須突破束縛！"
 BBA_italy_missiolinis.122.t: "折戟希臘"
 BBA_italy_missiolinis.122.desc: "希臘的多山地形對我們的部隊來說是一個不可逾越的障礙。部隊處處受阻、動彈不得。領袖仍然相信勝利將是而且必須是我們的，並且否認任何困難。他熱情地爭辯說我們最終會取得勝利。"
 BBA_italy_missiolinis.122.a: "這些刁民真能造反。"
 BBA_italy_missiolinis.123.t: "希臘臣服"
 BBA_italy_missiolinis.123.desc: "就像昔日的羅馬軍團一樣，我們現在已經擊敗了敵軍，征服了整個希臘。墨索里尼在帕臺農神廟的陰影下發表了激動人心的演講，宣稱意大利人和希臘人是兄弟民族，有著幾個世紀的共同歷史，他們現在可以自由地設定自己的歷史進程。"
 BBA_italy_missiolinis.123.a: "為了過去和未來的榮光！"
 BBA_italy_missiolinis.131.t: "解放提契諾"
 BBA_italy_missiolinis.131.desc: "自從漢尼拔帶著他的象兵翻越阿爾卑斯山以來，該山脈就成了蠻族直達意大利腹地的交通要道。領袖們長期以來一直希望確保北部山區的安全，並希望藉此機會讓講意大利語的提契諾人迴歸祖國——全天下的意大利人必歸於一國。"
 BBA_italy_missiolinis.131.a: "拯救提契諾的意大利人！"
 BBA_italy_missiolinis.132.t: "解放提契諾失敗"
 BBA_italy_missiolinis.132.desc: "領袖知道瑞士人會在提契諾苦戰一番，但是進展的失利讓他有些不知所措。在我們的進攻陷入僵局後不久，領袖們開始插手將軍們的計劃，並質疑他們的能力無法服眾。"
 BBA_italy_missiolinis.132.a: "進展的失利令人不安。"
 BBA_italy_missiolinis.133.t: "成功解放提契諾"
 BBA_italy_missiolinis.133.desc: "墨索里尼親自前往提契諾，歡迎那裡的意大利人加入更大的意大利祖國，他們與意大利必將共享美好的未來。他還表示北部邊境現在已經安全了，意大利可以擊退任何試圖翻越阿爾卑斯山的野蠻人。"
 BBA_italy_missiolinis.133.a: "一場偉大的勝利。"
 BBA_italy_missiolinis.201.t: "加強政府內閣"
 BBA_italy_missiolinis.201.desc: "如何人盡其才一直是個難題——更何況我們正缺乏合適的人才。但是墨索里尼相信，為了意大利——以及法西斯主義——的成功，他必須找到有合適能力的人來填補內閣，墨索里尼已經開始命人四處奔走尋找這些人才了。"
 BBA_italy_missiolinis.201.a: "不遺餘力！"
 BBA_italy_missiolinis.202.t: "政府內閣失職"
 BBA_italy_missiolinis.202.desc: "遺憾的是內閣未能如償所願地被加強，這讓墨索里尼勃然大怒，他斷言如今的內閣早已失職。他指責身邊的所有人，認為使他們的無能和愚蠢毀了一切，所有愚蠢者和無能者正阻撓他為意大利帶來偉大復興。"
 BBA_italy_missiolinis.202.a: "會被一群酒囊飯袋所包圍真的很難辦。"
 BBA_italy_missiolinis.203.t: "成功加強政府內閣"
 BBA_italy_missiolinis.203.desc: "墨索里尼在最近的一次政府內閣演講中講到，只有全意大利最優秀的人才適合在此處任職。隨後，他還自誇說道：他已不遺餘力地尋找合適的人來充實內閣，而他堅毅的精神將永遠服務於意大利。"
 BBA_italy_missiolinis.203.a: "只要最最精明強幹的才俊！"
 BBA_italy_missiolinis.211.t: "加強軍事最高指揮部"
 BBA_italy_missiolinis.211.desc: "自意大利-阿比西尼亞戰爭以來，墨索里尼就頻繁指出最高指揮部缺乏能力和實戰經驗。他希望通過提拔有能力的年輕軍官來來擔任軍隊高層，以強化我們在未來戰爭中的戰略戰術推演能力。"
 BBA_italy_missiolinis.211.a: "現狀必須被改變。"
 BBA_italy_missiolinis.212.t: "缺乏軍事人才"
 BBA_italy_missiolinis.212.desc: "墨索里尼非常擔心如若讓自己親自負責擬定並指揮軍事行動會分散他的注意力，所以他從不忌諱在人面前抱怨目前軍隊中缺乏有能力的人。墨索里尼確信如果這種情況持續下去，意大利將會萬劫不復。"
 BBA_italy_missiolinis.212.a: "現在想要找到有能力的人確實挺難的。"
 BBA_italy_missiolinis.213.t: "行事高效的最高指揮部"
 BBA_italy_missiolinis.213.desc: "墨索里尼在最近的一系列演講中表示，隨著最近有能之人在最高指揮部中的晉升，他對意大利軍隊能否打勝仗比以往都要有信心。墨索里尼對三軍都發表了演講，高度讚揚了士兵們的無畏勇氣和高超能力，並告訴士兵們，他堅信他們未來也能贏下任何可能的衝突或戰爭。"
 BBA_italy_missiolinis.213.a: "得力的領導是成功的關鍵。"
 BBA_italy_missiolinis.council: "大委員會有更多迫在眉睫的問題……"
 ITA_missiolinis_reroll_tt: "法西斯大委員會會確保墨索里尼改變他的主意並頒佈新的命令"
 BBA_italy_local_rulers.1.t: "$ETH_haile_selassie_gugsa$接觸意大利官員"
 BBA_italy_local_rulers.1.desc: "海爾·塞拉西·古薩，作為阿比西尼亞軍隊的總指揮以及最重要的皇室成員，近日和我們的官員進行了接觸，希望與我們做一筆交易。這對於我們來說是值得慶祝的時刻，對於阿比西尼亞人來說則是奇恥大辱。我們當然可以把握這次機會來謀求我們的利益，但是也要記住此人在許多阿比西尼亞人眼裡是賣國賊，如果要支持他就需要多加小心。"
 BBA_italy_local_rulers.1.a: "作出一些讓步或許能讓當地人默許。"
 BBA_italy_local_rulers.1.b: "讓$ETH_haile_selassie_gugsa$成為當地的總督。"
 BBA_italy_local_rulers.1.c: "$ETH_haile_selassie_gugsa$和他的追隨者必須下臺。"
 BBA_italy_local_rulers.1.d: "不會與任何當地領袖進行談判。"
 BBA_italy_local_rulers.2.t: "$ETH_abba_jofir$接觸意大利官員"
 BBA_italy_local_rulers.2.desc: "在我們於亞的斯亞貝巴征戰期間，我們釋放了阿巴·喬菲爾——前吉馬王國的國王，在戰爭爆發前，他就曾積極地尋求與我們的合作。他現在希望我們協助他恢復一些昔日的權力。這事對我們有利，因為喬菲爾在當地仍有一定的影響力。但要注意的是，他賣國求榮的事依舊被當地人所不恥。"
 BBA_italy_local_rulers.2.a: "作出一些讓步或許能讓當地人默許。"
 BBA_italy_local_rulers.2.b: "讓$ETH_abba_jofir$成為當地的總督。"
 BBA_italy_local_rulers.2.c: "$ETH_abba_jofir$和他的追隨者必須下臺。"
 BBA_italy_local_rulers.2.d: "不會與任何當地領袖進行談判。"
 BBA_italy_local_rulers.3.t: "$ETH_hailu_tekle_haymanot$接觸意大利官員"
 BBA_italy_local_rulers.3.desc: "海魯·特克利·哈伊馬諾特，一名被罷黜了的阿比西尼亞貴族，與我們的官員進行了接觸，並聲稱我們可以互利互惠。他希望通過效忠換取我們在阿比西尼亞的政府中的高位。作為前朝貴胄，吸納此人可能對我們有利，但是這樣也可能會令心生不滿的當地人反抗統治。"
 BBA_italy_local_rulers.3.a: "作出一些讓步或許能讓當地人默許。"
 BBA_italy_local_rulers.3.b: "讓$ETH_hailu_tekle_haymanot$成為當地的總督。"
 BBA_italy_local_rulers.3.c: "$ETH_hailu_tekle_haymanot$和他的追隨者必須下臺。"
 BBA_italy_local_rulers.3.d: "不會與任何當地領袖進行談判。"
 BBA_italy_local_rulers.4.t: "$ETH_seyoum_mengesha$接觸意大利官員"
 BBA_italy_local_rulers.4.desc: "隨著我們在阿比西尼亞大獲全勝，我們設法抓住了一名阿比西尼亞軍隊的指揮官，同時也是一名皇室成員：塞尤姆·馬加夏。我們發現阿比西尼亞的皇帝海爾·塞拉西非常器重他。我們或許可以利用這名俘虜來羞辱皇帝，還可能讓當地人以禮來降。當然，他作為傀儡是不會有任何實權的。"
 BBA_italy_local_rulers.4.a: "作出一些讓步或許能讓當地人默許。"
 BBA_italy_local_rulers.4.b: "讓$ETH_seyoum_mengesha$成為當地的總督。"
 BBA_italy_local_rulers.4.c: "$ETH_seyoum_mengesha$和他的追隨者必須下臺。"
 BBA_italy_local_rulers.4.d: "不會與任何當地領袖進行談判。"
 ITA_ends_event_chain_tt: "§R結束事件鏈§!"
 BBA_italy_air_accident.01.t: "$ITA_italo_balbo$溘然長逝"
 BBA_italy_air_accident.01.desc: "伊塔洛·巴爾博元帥的座機在利比亞上空被友軍防空火力擊落。由於對友軍軍機判別失誤，軍機在即將落地時被己方防空陣地的高射炮開火擊毀。慶幸的是中將朱塞佩·泰萊拉當時並未與元帥同乘一架飛機，從而倖免於難。但友軍的烏龍事件讓他感到各種意義上的不安。"
 BBA_italy_air_accident.01.a: "真是致命打擊……"
 BBA_italy_air_accident.02.t: "$ITA_giuseppe_tellera$溘然長逝"
 BBA_italy_air_accident.02.desc: "由於對友軍軍機判別失誤，伊塔洛·巴爾博元帥的座機遭到了友軍防空火炮的攻擊。幸運的是，元帥本人毫髮無傷，但不幸的是，他的參謀長也就是中將朱塞佩·泰萊拉當時身處另外一架軍機上，被友軍防空火炮擊毀。巴爾博元帥為這起烏龍事件大動肝火，他狠狠懲戒了負責的防空部隊——包括負責的軍官。"
 BBA_italy_air_accident.02.a: "真是悲劇啊……"
 BBA_italy_air_accident.03.t: "友軍誤擊得以避免"
 BBA_italy_air_accident.03.desc: "由於對友軍軍機判別失誤，伊塔洛·巴爾博元帥的座機遭到了友軍防空火炮的攻擊。巴爾博元帥成功與地面防空部隊取得了聯繫，在避開防空火炮的同時讓地面部隊停火，最終軍機安然降落。元帥因其勇敢果決且在危急時刻保持冷靜而飽受讚揚。"
 BBA_italy_air_accident.03.a: "巴爾博的英勇挽救了局面！"
 BBA_italy_air_accident.11.t: "空難悲劇"
 BBA_italy_air_accident.11.desc: "在前往視察法國邊境的途中，空軍參謀長阿爾多·佩萊格里尼和彼得羅·平托將軍的座機發生了引擎故障導致飛機墜毀，機上無人生還。"
 BBA_italy_air_accident.11.a: "[ROOT.GetNameDefCap]失去了兩名優秀的軍官。"
 BBA_italy_air_accident.12.t: "空難"
 BBA_italy_air_accident.12.desc: "在飛往意法邊境的途中，空軍參謀長阿爾多·佩萊格里尼和彼得羅·平托將軍的座機引擎發生了故障，飛機高度急劇下降。多虧佩萊格里尼對馬爾凱蒂產飛機的性能瞭如指掌，他在生死關頭成功駕機迫降。機上無人死亡，只有人受了皮外傷。"
 BBA_italy_air_accident.12.a: "命運眷顧著他們！"
 ITA_pellegrini_promotion_tt: "\n$air_chief$特質從§Y專家§!增強為§Y大師§!。"
 BBA_italy_naval_cooperation_programs.01.t: "意大利的海軍合作計劃"
 BBA_italy_naval_cooperation_programs.01.desc: "我們收到了一份來自[From.GetName]的邀請，請求我們加入海軍合作計劃。這項計劃雖然對我們十分有利，但同樣對[FROM.GetAdjective]的海軍也十分受用。"
 BBA_italy_naval_cooperation_programs.01.a: "不錯的交易！"
 BBA_italy_naval_cooperation_programs.01.b: "意大利人給不了我們什麼。"
 BBA_italy_naval_cooperation_programs.02.t: "[FROM.GetNameDefCap]加入了$ITA_naval_cooperation_program_research_group_name$"
 BBA_italy_naval_cooperation_programs.02.desc: "看來[From.GetName]做出了明智的決策，決定加入我們的海軍合作計劃。這對雙方都有著好處，並且能夠顯著增強我們的實力。"
 BBA_italy_naval_cooperation_programs.02.a: "讓專家們開始幹活！"
 BBA_italy_naval_cooperation_programs.03.t: "[FROM.GetNameDefCap]拒絕加入$ITA_naval_cooperation_program_research_group_name$"
 BBA_italy_naval_cooperation_programs.03.desc: "[FROM.GetName]愚蠢地拒絕加入我們的海軍合作計劃。只有莽夫才迷信自己的力量，而智者明白眾人拾柴火焰高。"
 BBA_italy_naval_cooperation_programs.03.a: "這個決定出人意料地蠢。"
 BBA_italy_naval_cooperation_programs.04.t: "和[FROM.GetAdjective]的海軍舉行聯合演習"
 BBA_italy_naval_cooperation_programs.04.desc: "[FROM.GetAdjective]邀請我們參加海軍聯合軍演，他說只有這樣我們才能為戰爭做好準備，將來犯之敵打的片甲不留。"
 BBA_italy_naval_cooperation_programs.04.a: "乘風破浪！"
 BBA_italy_naval_cooperation_programs.04.b: "意大利人給不了我們什麼。"
 BBA_italy_naval_cooperation_programs.05.t: "[ROOT.GetAdjective]-[FROM.GetAdjective]進行聯合軍演"
 BBA_italy_naval_cooperation_programs.05.desc: "[FROM.GetName]接受了我們海軍聯合軍演的提議，他們意識到了必須防患於未然，為未來可能發生的戰爭做好準備。"
 BBA_italy_naval_cooperation_programs.05.a: "好極了！"
 BBA_italy_naval_cooperation_programs.06.t: "[FROM.GetNameDefCap]拒絕了我們的提議"
 BBA_italy_naval_cooperation_programs.06.desc: "鼠目寸光的[FROM.GetName]拒絕了我們的提議！拒絕聯合軍演就是為了讓我們的艦隊難以全面的為未來的狀況做好準備……何等傲慢而又卑劣的想法！"
 BBA_italy_naval_cooperation_programs.06.a: "[FROM.GetLeader]還沒搞清楚狀況啊……"
 BBA_italy_naval_cooperation_programs.07.t: "[ROOT.GetAdjective]-[FROM.GetAdjective]聯合軍演"
 BBA_italy_naval_cooperation_programs.07.desc: "我們的海軍將領高興地報告稱最近的演習取得了巨大的成功！這次行動讓全軍上下有著巨大的收穫，在戰術上也有了新的見解。這為我們未來在公海上行動提供了有利保障。"
 BBA_italy_naval_cooperation_programs.07.a: "是時候把所學付諸實踐了！"
 ITA_joint_maneuvers_with_country_remove_effect_tt: "在§Y[?ITA.ITA_joint_maneuvers_with_country_days]§!天后完成聯合演習後時，將會獲得："
 BBA_italy_naval_cooperation_programs.08.t: "[FROM.GetAdjective]提供售賣護衛艦服務"
 BBA_italy_naval_cooperation_programs.08.desc: "[FROM.GetAdjective]找上門來並提議我們可以購買他們的一些護衛艦。儘管這些艦船有些老舊，但她們或許仍能在我們的艦隊中發揮作用。"
 BBA_italy_naval_cooperation_programs.08.a: "這將顯著增強[ROOT.GetAdjective]的艦隊！"
 BBA_italy_naval_cooperation_programs.08.b: "我們不需要來自[ITA.GetAdjective]的殘羹剩飯。"
 BBA_italy_naval_cooperation_programs.09.t: "[FROM.GetNameDefCap]同意購買我們的護衛艦"
 BBA_italy_naval_cooperation_programs.09.desc: "[FROM.GetName]接受我們的提議，決定購買我們老舊過時的護衛艦。如若他們真的將這些艦艇安排進他們的艦隊，那麼他們的海軍想必是已羸弱不堪，對未來憂心忡忡了。不過，售賣這些艦艇，將其剔除出我們的海軍體系，會讓我們艦隊現有艦船得到更好的包養，艦隊全員機動能力也將獲得顯著提升，未來能夠發揮出更強的戰力。"
 BBA_italy_naval_cooperation_programs.09.a: "不錯的買賣！"
 BBA_italy_naval_cooperation_programs.10.t: "[FROM.GetNameDefCap]婉拒購買我們的護衛艦"
 BBA_italy_naval_cooperation_programs.10.desc: "[FROM.GetName]並沒有像我們所希望的那樣容易被說服，購買我們陳舊的護衛艦。我們必須想點其他辦法處理這些過時的艦艇。"
 BBA_italy_naval_cooperation_programs.10.a: "我們會找到其他買家的。"
 ITA_cooperation_programs_deal_others_tt: "（[ROOT.GetEscortShipsSender]）：向[ROOT.GetEscortShipsReceiver]移交§Y2艘庫爾塔托內級驅逐艦§!和§Y2艘西北風級驅逐艦§!。"
 ITA_cooperation_programs_deal_root_tt: "[ROOT.GetFlag]§Y[ROOT.GetName]§!"
 ITA_cooperation_programs_deal_from_tt: "[FROM.GetFlag]§Y[FROM.GetName]§!"
 BBA_italy_naval_cooperation_programs.11.t: "[ITA.GetNameDefCap]提供驅逐艦"
 BBA_italy_naval_cooperation_programs.11.desc: "[FROM.GetAdjective]提議他們可以無償提供2艘較為老舊的驅逐艦給我們。雖然這些艦艇已經過時了，但將其翻新下仍能在我們的艦隊中找到一席之地。這確實是一份慷慨的禮物。 "
 BBA_italy_naval_cooperation_programs.11.a: "我們十分感謝這份援助！"
 BBA_italy_naval_cooperation_programs.12.t: "我們的鷲座級驅逐艦已抵達西班牙"
 BBA_italy_naval_cooperation_programs.12.desc: "[FROM.GetAdjective]海軍已經收到了我們慷慨饋贈的驅逐艦。希望她們能夠派上用場。"
 BBA_italy_naval_cooperation_programs.12.a: "再會了！"
 BBA_italy_naval_cooperation_programs.13.t: "[FROM.GetNameDefCap]拒絕了我們的驅逐艦"
 BBA_italy_naval_cooperation_programs.13.desc: "[FROM.GetAdjective]拒絕了我們無償提供的兩艘驅逐艦。他們的艦隊一定十分強大所以才拒絕了這項提議！"
 ITA_cede_aquila_class_destroyers_tt: "[ROOT.GetEscortShipsSender]：向[ROOT.GetEscortShipsReceiver]移交§Y2艘鷲座級驅逐艦§!。"
 BBA_italy_naval_cooperation_programs.14.t: "[ITA.GetName]出口袖珍潛艇"
 BBA_italy_naval_cooperation_programs.14.desc: "[FROM.GetAdjective]詢問我們是否有興趣購買五艘袖珍潛艇。她們的用途有限，但能滿足目前我們海軍的需求，加強我們海軍的能力。"
 BBA_italy_naval_cooperation_programs.14.a: "她們將在我們的海軍中表現優異。"
 BBA_italy_naval_cooperation_programs.14.b: "沒興趣，不如看看別的。"
 BBA_italy_naval_cooperation_programs.15.t: "[FROM.GetName]購買我們的袖珍潛艇"
 BBA_italy_naval_cooperation_programs.15.desc: "[FROM.GetAdjective]海軍相中了我們袖珍潛艇所具有的優勢，決定購買她們。這無疑是對我國工程師和海軍能力的一種肯定。"
 BBA_italy_naval_cooperation_programs.15.a: "好極了！"
 BBA_italy_naval_cooperation_programs.16.t: "[FROM.GetName]拒絕我方提案"
 BBA_italy_naval_cooperation_programs.16.desc: "[FROM.GetAdjective]海軍並沒有相中我們的袖珍潛艇，認為其難堪大用。這必定是因為他們心胸狹隘，而且坦白來說我們的潛艇這麼高，只有頭腦簡單的人才會看不出來她們的優點。"
 BBA_italy_naval_cooperation_programs.17.t: "[ITA.GetAdjective]袖珍潛艇到達[ROOT.GetName]"
 BBA_italy_naval_cooperation_programs.17.desc: "[FROM.GetAdjective]的袖珍潛艇終於抵達，加強了我們海軍的戰力！這必將顯著擴充我們的艦隊，我們會好好使用她們的。"
 BBA_italy_naval_cooperation_programs.17.a: "事不宜遲，讓她們直接上陣吧！"
 BBA_italy_human_torpedo_raid.1.t: "對[?ITA.ITA_raided_state_var.GetName]發動襲擊"
 BBA_italy_human_torpedo_raid.1.desc: "意大利人設法利用小型艦船避開了我們於[?ITA.ITA_raided_state_var.GetName]的港口防禦工事，潛入了我們的港口，並對港口內的我方戰艦進行了突襲。雖然這次襲擊並未擊沉任何一艘戰艦，但被擊傷的戰艦需要一些時間才能修復完畢。"
 BBA_italy_human_torpedo_raid.1.a: "太不幸了。"
 ITA_human_torpedo_raid_tt: "這項襲擊行動只能夠執行一次。"
 ITA_human_torpedo_effect_tt: "將損害停靠在該地區的海軍單位。"
 ITA_human_torpedo_target_effect_tt: "將損害於[?ITA.ITA_raided_state_var.GetName]的海軍單位。"
 BBA_italy_colonial_management.1.t: "殖民地警察"
 BBA_italy_colonial_management.1.desc: "自從建國以來，我們的殖民地在不到一個世紀的時間裡迅速擴張，然而這種擴張現在開始榨乾我國的人力。不過，我們可以通過招募例如駱駝騎兵、薩瓦里騎兵、西帕希騎兵等本地警備部隊來儘可能緩解人力問題。招募這些殖民地部隊可以減輕我軍的壓力，而他們對故土與周遭的一切的熟悉對我們來說大有裨益。"
 BBA_italy_colonial_management.1.a: "招他們進來！"
 BBA_italy_colonial_management.1.b: "我們另有打算。"
 BBA_italy_colonial_management.1_do_not_apply_tt: "在已控制的[GetAfricanStates][GetAndOrNothing][GetAlbanianStates]可以使用佔領法案§Y$colonial_police$§!。"
 BBA_italy_colonial_management_african_states: "非洲地區"
 BBA_italy_colonial_management_albanian_states: "阿爾巴尼亞地區"
 BBA_italy_colonial_management_and: " 與 "
 BBA_italy_bop.1.t: "[?ITA.ITA_lost_core.GetName]淪陷"
 BBA_italy_bop.1.desc: "我們的[?ITA.ITA_lost_core.GetName]落入了敵人手中！這一定會動搖意大利人民對我們戰爭的信心，甚至還會引發議和的輿論。事態的反轉少說也讓相當一部分民眾失望了，國民正在尋找任何該被譴責的對象。我們必須主動出擊，把敵人趕出意大利！"
 BBA_italy_bop.1.a: "真是糟透了！"
 ITA_losing_cores_tt: "每當[ROOT.GetName]失去一個§Y核心地區§!的控制時影響將會生效。"
 BBA_italy_bop.2.t: "[?ITA.ITA_lost_colony.GetName]淪陷"
 BBA_italy_bop.2.desc: "敵軍已經奪取[?ITA.ITA_lost_colony.GetName]的控制權，這震驚了全體意大利人！人民曾經以為這場戰爭優勢在我，或者戰局至少很快將利於我方。這誠然是一次失敗，但是隻要我們計劃出色、堅韌不拔，就一定可以奪回[?ITA.ITA_lost_colony.GetName]！"
 BBA_italy_bop.2.a: "我們必將再次崛起！"
 ITA_losing_colonies_tt: "每當[ROOT.GetName]失去一個§Y非核心地區§!的控制時，只要權力平衡傾向§Y$ITA_grand_council_side$§!小於§Y30%§!，影響就會生效。"
 BBA_italy_bop.3.t: "我們收復了[?ITA.ITA_reclaimed_core.GetName]"
 BBA_italy_bop.3.desc: "我們部隊成功收復了[?ITA.ITA_reclaimed_core.GetName]，鼓舞了所有意大利人的士氣！這一刻我們力挽狂瀾，誓將敵人逐出我們熱愛的[ITA.GetNameDef]。"
 BBA_italy_bop.3.a: "優勢在我！"
 ITA_reclaiming_cores_tt: "每當[ROOT.GetName]從敵人手中光復一個§Y核心地區§!時影響將會生效。"
 BBA_italy_council_deposes_duce.1.t: "廢黜[?ITA.ITA_var_deposed_leader.GetName]"
 BBA_italy_council_deposes_duce.1.desc: "為了救意大利於危難，同時拯救法西斯政體，我們必須做一件未敢設想的事情：把[?ITA.ITA_var_deposed_leader.GetName]趕下臺！他的無知無能拖累了我們的國計民生與發展大業。我們有義務去捍衛[FROM.GetAdjective]人民與他們的未來！"
 BBA_italy_council_deposes_duce.1.a: "大局為重。"
 BBA_italy_council_deposes_duce.2.t: "大委員會正在考慮直接干預"
 BBA_italy_council_deposes_duce.2.desc: "鑑於[ROOT.GetLeader]近期遭遇的變故，大委員會已經開始密謀奪權。這一不得人心的舉動最終甚至可能導致我們國家爆發內戰。我們必須盡一切努力來降低這種風險發生的可能性。"
 BBA_italy_council_deposes_duce.2.a: "我們必須採取嚴厲措施，確保這種情況不會發生！"
 ITA_grand_council_considers_intervention_tt: "如果權力進一步落入§Y大委員會§!手中，他們可能會完全§R奪取§!§Y[ROOT.GetLeader]§!的權力！"
 BBA_italy_civil_war.1.t: "意大利內戰"
 BBA_italy_civil_war.1.desc: "我們摯愛的意大利在戰爭的重壓下四分五裂！敵對各方正在招兵買馬，準備為了祖國所剩下的一切與意大利未來的信念而戰。我們所有人都面臨著艱難的抉擇，但是我們必須堅持不懈，方能浴火重生。 "
 BBA_italy_civil_war.1.a: "我們需要堅定有力的領導！"
 BBA_italy_civil_war.1.b: "我們需要穩定與傳統！"
 BBA_italy_civil_war.1.c: "走向人民的革命吧！"
 BBA_italy_civil_war.1.d: "讓自由統治一切！"
 BBA_italy_civil_war.2.t: "$ITA_fronte_militare_clandestino$"
 BBA_italy_civil_war.2.desc: "最近成立的抵抗組織看來正在我們後方搞破壞。我們對這個組織知之甚少，他們看起來主要是由叛逃的前陸軍軍官構成。我們正在準備引蛇出洞，不過目前我們缺少預判他們下一步行動的情報。"
 BBA_italy_civil_war.2.a: "他們躲不久了。"
 BBA_italy_civil_war.3.t: "$ITA_gappisti$"
 BBA_italy_civil_war.3.desc: "我們收到的情報顯示幾撮自稱“愛國行動小組”的共產黨游擊隊在我方領土內發動了幾次成功的襲擾行動。他們訓練有素、裝備精良，足以讓我們懷疑他們是受[FROM.GetName]資助的。"
 BBA_italy_civil_war.3.a: "狡詐的赤匪！"
 BBA_italy_civil_war.4.t: "[FROM.GetName]的反游擊掃蕩"
 BBA_italy_civil_war.4.desc: "[FROM.GetName]的反抗軍和游擊隊為解放意大利全境所做的不懈努力迎來了勝利！實際上，仍在掌權的邪惡當局不得不發動了新一輪殘酷的反游擊掃蕩。我方特工在[FROM.GetName]的任務變得更艱難了，但是我們仍將為了自由的意大利而戰！"
 BBA_italy_civil_war.4.a: "為自由而獻身！"
 BBA_italy_civil_war.5.t: "[FROM.GetAdjective]要求獨立"
 BBA_italy_civil_war.5.desc: "我們的盟友，同樣也是我們附屬國的意大利最近提出了脫離我方管制和獲得完全獨立的請求。我們首先要確保[FROM.GetName]的控制權，以免意大利前線土崩瓦解，不過也許是時候給予他們自由了。"
 BBA_italy_civil_war.5.a: "讓他們獨立。"
 BBA_italy_civil_war.5.b: "拒絕獨立申請。"
 BBA_italy_civil_war.6.t: "[ROOT.GetNameDef]獨立"
 BBA_italy_civil_war.6.desc: "我們的盟友，同樣也是暫時的宗主，[FROM.GetName]聽取了我們對自由的呼喚並同意讓我國恢復獨立！我們飽經戰爭摧殘的國家終於迎來了這個重要的時刻。現在我們終於可以開始專注於重建我們的祖國並走上重歸統一的道路。"
 BBA_italy_civil_war.6.a: "我們再一次主宰了自己的命運。"
 BBA_italy_civil_war.7.t: "[FROM.GetName]拒絕了我國的獨立請求"
 BBA_italy_civil_war.7.desc: "我們殘暴的宗主[FROM.Adjective]拒絕了我們誠懇的獨立請求！雖然他們為我們贏得內戰提供了很大的幫助，但他們仍無權支配我們的命運或干涉我們的內政。當時機成熟之時，我們有責任將他們從我們的家園裡趕走並爭取屬於我們自己的自由。"
 BBA_italy_civil_war.7.a: "他們會後悔的！"
 BBA_italy_civil_war.7.b: "我們只得如此……"
 ITA_we_will_transfer_the_following_states_tt: "這些地區將被轉交給§Y[RDS.GetFlag][RDS.GetNameDef]§!："
 ITA_we_keep_our_occupied_states_tt: "我們將繼續控制目前已經佔領的地區。"
 BBA_italy_civil_war_fascist_tt: "我們將繼續控制§Y[ROOT.GetFlag][ROOT.GetNameDefCap]§!。§Y[ROOT.GetFlag][ROOT.GetNameDefCap]§!將會成為§Y$RSI_DEF$§!。[GetRsiOverlord]"
 BBA_italy_civil_war_monarchist_tt: "我們將成為§Y$RDS_DEF$§!，以§Y$neutrality$§!反叛者的身份發動內戰。[GetRdsOverlord]"
 BBA_italy_civil_war_communist_tt: "我們將成為§Y$RDS_DEF$§!，以§Y$communism$§!反叛者的身份發動內戰。[GetRdsOverlord]"
 BBA_italy_civil_war_democratic_tt: "我們將成為§Y$RDS_DEF$§!，以§Y$democratic$§!反叛者的身份發動內戰。[GetRdsOverlord]"
 ITA_rsi_overlord_tt: "我們將成為§Y[?ITA_rsi_overlord.GetFlag][?ITA_rsi_overlord.GetNameDef]§!的附庸。"
 ITA_rds_overlord_tt: "我們將成為§Y[?ITA_rds_overlord.GetFlag][?ITA_rds_overlord.GetNameDef]§!的附庸。"
 BBA_italy_civil_war.100.t: "被佔領的意大利領土"
 BBA_italy_civil_war.100.desc: "我們意識到自己正控制著本屬於我們意大利盟友的土地。將這些領土轉交給[RDS.GetName]將允許我們解放出更多的部隊來支援別處的戰線。"
 BBA_italy_civil_war.100.a: "移交領土。"
 BBA_italy_civil_war.100.b: "保留已佔領土地。"
 BBA_italy_civil_war.101.t: "[FROM.GetName]轉交意大利領土"
 BBA_italy_civil_war.101.desc: "[FROM.GetName]英明神武的領袖[FROM.GetLeader]，已經慷慨的將意大利的領土轉交給了我們！這不僅極大的鼓舞了戰士們的時期，增強了我們的實力的同時還有助於我們投入更大的努力來解放整個意大利。"
 BBA_italy_civil_war.101.a: "前進！"
 BBA_italy_civil_war.300.desc: "我們團結[FROM.Adjective]人民對抗法西斯主義的努力即將取得勝利！我們不能再坐視美麗的祖國流血漂櫓了。憑藉我們團結起來的力量，我們將有能力一舉摧毀法西斯主義政權，將全意大利從暴政中解放！"
 BBA_italy_interaction_events.1.t: "[ITA.GetLeader]索要[846.GetName]"
 BBA_italy_interaction_events.1.desc: "意大利領導人[ITA.GetLeader]向我國提交了最後通牒，這種完全不可想像、令人惱怒的做法踐踏了我國長久以來的中立地位。我國要麼在兩週之內必須將[846.GetName]交給意大利人，要麼迎來戰爭。我們該怎麼做？"
 BBA_italy_interaction_events.1.a: "我們少了一處要防禦的弱點。"
 BBA_italy_interaction_events.1.b: "我們倒想看看他們怎麼辦！"
 BBA_italy_interaction_events.2.t: "軟弱的[SWI.GetName]屈服了"
 BBA_italy_interaction_events.2.desc: "[SWI.GetNameDef]聯邦主席今天宣佈了一個時代的終結。他們將會割讓意語地區[846.GetName]給我國，而且放棄他們對該地區任何意語城鎮的宣稱。今天標誌著[SWI.GetName]國土面積與多民族價值觀的衰落，因為他們之後就會將意大利語移出官方語言。"
 BBA_italy_interaction_events.2.a: "完美！"
 BBA_italy_interaction_events.3.t: "[SWI.GetNameDef]拒不退讓！"
 BBA_italy_interaction_events.3.desc: "[SWI.GetName]今天宣佈以拒絕我國要求[846.GetName]迴歸意大利民族國家的形式放棄中立地位。正因為這個愚蠢的決定，我們的選項只剩下將瑞士聯邦體系挫骨揚灰、化為烏有。"
 BBA_italy_interaction_events.3.a: "山地師！出動！"
 BBA_italy_interaction_events.4.t: "要求加冕意大利親王"
 BBA_italy_interaction_events.4.desc: "我們收到了[ITA.GetLeader]要求將名為艾莫內的意大利親王正式加冕為克羅地亞國王托米斯拉夫二世的提案。如果我們接受了這項要求，我們自然會失去一些獨立自主，不過有可能在不久的將來得以免於意大利入侵。"
 BBA_italy_interaction_events.4.a: "他應當成為托米斯拉夫國王！"
 BBA_italy_interaction_events.4.b: "意大利人將在達爾馬提亞海岸迎來死期。"
 BBA_italy_interaction_events.5.t: "艾莫內親王的加冕儀式"
 BBA_italy_interaction_events.5.desc: "薩格勒布的鐘聲在今天響起，被稱為艾蒙內的意大利王子加冕為克羅地亞的托米斯拉夫二世。我們的影響力正進一步擴散到巴爾幹地區，伴隨著的是我們即將來臨的輝煌時代。"
 BBA_italy_interaction_events.5.a: "乾的漂亮！"
 BBA_italy_interaction_events.6.t: "艾莫內被攔阻在克羅地亞國境外"
 BBA_italy_interaction_events.6.desc: "艾莫內親王回到了我國，報告說他在前往薩格勒布加冕的路上被攔阻在克羅地亞國境外。克羅地亞人明顯沒有什麼可以為我們提供的了，而軍事佔領他們就是未來的唯一做法。"
 BBA_italy_interaction_events.6.a: "那就開戰吧！"
 BBA_italy_interaction_events.7.t: "新任全國委員會主席誕生"
 BBA_italy_interaction_events.7.desc: "[MNT.GetLeader]已經被意大利任命為全國委員會的新任主席。這將有助於強化我們的政權。"
 BBA_italy_interaction_events.7.a: "就該這樣。"
 BBA_italy_interaction_events.8.t: "[ITA.GetName]要求佔領達爾馬提亞"
 BBA_italy_interaction_events.8.desc: "[ITA.GetLeader]的[ITA.GetNameDef]今天向我們發出了最後通牒，要求我們同意[ITA.GetName]佔領達爾馬提亞地區。如果我們不遵守[ITA.GetLeader]的要求將會面臨軍事衝突。"
 BBA_italy_interaction_events.8.a: "那就給他們吧。"
 BBA_italy_interaction_events.8.b: "他們以為自己是誰？"
 BBA_italy_interaction_events.9.t: "[FROM.GetName]接受我們的要求"
 BBA_italy_interaction_events.9.desc: "[FROM.GetLeader]的[FROM.GetNameDef]優雅地接受了我們關於佔領達爾馬提亞的要求，並在之將該領土割讓給我們。他們寧願安撫我們，也不願意站在我們的對立面，這隻會幫助意大利在巴爾幹地區進一步實現其目標。"
 BBA_italy_interaction_events.9.a: "一切正照計劃進行。"
 BBA_italy_interaction_events.10.t: "愚蠢的[FROM.GetLeader]拒絕我們的最後通牒"
 BBA_italy_interaction_events.10.desc: "愚蠢的[FROM.GetNameDef]領導人，[FROM.GetLeader]拒絕了我們應有的領土要求，是時候一擊打倒[FROM.GetName]了。這將在不久之後確保我們對達爾馬提亞的宣稱。"
 BBA_italy_interaction_events.10.a: "那就用武力說話吧。"
 BBA_italy_interaction_events.11.t: "[ITA.GetName]宣稱黑山王位"
 BBA_italy_interaction_events.11.desc: "[ITA.GetLeader]要求將黑山的王位移交給意大利，並讓王冠統一在同一面旗幟下。雖然這很荒唐，但考慮到意大利王后也是黑山人，這似乎又顯得不是那麼荒謬，我們應該作何回答？"
 BBA_italy_interaction_events.11.a: "那就給他們吧。"
 BBA_italy_interaction_events.11.b: "誰給他們的權利這麼做？"
 BBA_italy_interaction_events.12.t: "[FROM.GetName]獻上黑山的王冠"
 BBA_italy_interaction_events.12.desc: "[FROM.GetLeader]已經宣佈他們沒有任何理由反對我們的主張，黑山的領土將被立刻移交給我們。今天將是意大利民族偉大的一天！"
 BBA_italy_interaction_events.12.a: "完美！"
 BBA_italy_interaction_events.13.t: "[FROM.GetName]拒絕交出黑山王冠"
 BBA_italy_interaction_events.13.desc: "[FROM.GetLeader]聲稱他們不會再和我們有更進一步的外交關係了，而且要求我們立即撤銷對蒙特內哥羅地區的宣稱。不可饒恕，不可接受！"
 BBA_italy_interaction_events.13.a: "真可悲！"
 BBA_italy_interaction_events.14.t: "[ITA.GetName]要求安納托利亞西部徹底去軍事化"
 BBA_italy_interaction_events.14.desc: "[ITA.GetLeader]提出了保障兩國安全的公平要求，但是最令人震怒的是[ITA.GetLeader]還要求我國在[342.GetName]與[339.GetName]徹底去軍事化。此舉意味著如果[ITA.GetName]或者其盟國對我們發動進攻，我們將無法及時駐防，因此這將嚴重威脅我國安全。"
 BBA_italy_interaction_events.14.a: "反正那裡的駐軍也毫無用處。"
 BBA_italy_interaction_events.14.b: "這意味著我們將無法保護自己。"
 BBA_italy_interaction_events.15.t: "[FROM.GetName]屈服於我們的要求"
 BBA_italy_interaction_events.15.desc: "[FROM.GetName]已經接受了我們的要求，並將安納托利亞西部徹底去軍事化。這意味著他們將變得極為脆弱，且無法對我們的攻勢做出及時的抵抗。"
 BBA_italy_interaction_events.15.a: "倘若真有那麼一天，他們也怪不了別人。"
 BBA_italy_interaction_events.16.t: "[FROM.GetName]拒絕了我們免於恐懼的自由的權利！"
 BBA_italy_interaction_events.16.desc: "[FROM.GetName]拒絕了我們為安全保障所提出的友好請求，並拒絕在[342.GetName]和[339.GetName]實行去軍事化。這實在是太荒謬了，我們將用我們自己的方式來處理這件事。"
 BBA_italy_interaction_events.16.a: "他們讓我們別無選擇。"
 BBA_italy_interaction_events.17.t: "[ITA.GetName]向[HUN.GetName]移交[45.GetName]"
 BBA_italy_interaction_events.17.desc: "我們的宗主國[ITA.GetName]今天決定將[45.GetName]轉交給匈牙利人。此舉是為了強化意大利和匈牙利之間的關係，我們對此無能為力。即使如此，我們仍會提出一個小小的外交抗議，即使他們甚至根本懶得去讀。"
 BBA_italy_interaction_events.17.a: "我們對此無能為力……"
 BBA_italy_interaction_events.18.t: "意大利給我們的提議"
 BBA_italy_interaction_events.18.desc: "[ITA.GetNameDef]提出了一個充滿誘惑力的提議。他們將用羅德島與十二群島的所有權換取和我們的盟約。這項過於完美的議案讓人不得不懷疑是否另有所圖，但其實這也合情合理。我們該如何選擇？"
 BBA_italy_interaction_events.18.a: "我們離希臘再統一又近了一步。"
 BBA_italy_interaction_events.18.b: "無論怎樣，我們都不會向意大利人屈服！"
 BBA_italy_interaction_events.19.t: "[GRE.GetNameDef]接受我方提案"
 BBA_italy_interaction_events.19.desc: "希臘政府於今日宣佈，他們已經接受了我們島嶼換盟約的議案，並於近日開展軍事合作。我們期待著兩國合作的美好前景。"
 BBA_italy_interaction_events.19.a: "我們就此結成聯盟。"
 BBA_italy_interaction_events.20.t: "忘恩負義的[GRE.GetNameDef]拒絕了我們的提議"
 BBA_italy_interaction_events.20.desc: "希臘叛徒們拒絕了我們島嶼換盟約的提議。這證明了他們政府的無能與懦弱。"
 BBA_italy_interaction_events.20.a: "沒有他們對我們來說或許更好。"
 BBA_italy_interaction_events.21.t: "意大利給我們的提議"
 BBA_italy_interaction_events.21.desc: "[ITA.GetNameDef]提出了一個充滿誘惑力的提議。他們將用羅德島與十二群島的所有權換取和我們的盟約。這項過於完美的議案讓人不得不懷疑是否另有所圖，但其實這也合情合理。我們該如何選擇？"
 BBA_italy_interaction_events.21.a: "接招吧，希臘！我們先拿到手了！"
 BBA_italy_interaction_events.21.b: "無論怎樣，我們都不會向意大利人屈服！"
 BBA_italy_interaction_events.22.t: "[TUR.GetNameDef]接受我方提案"
 BBA_italy_interaction_events.22.desc: "土耳其政府於今日宣佈，他們已經接受了我們島嶼換盟約的議案，並於近日開展軍事合作。我們期待著兩國合作的美好前景。"
 BBA_italy_interaction_events.22.a: "我們就此結成聯盟。"
 BBA_italy_interaction_events.23.t: "忘恩負義的[TUR.GetNameDef]拒絕了我們的提議"
 BBA_italy_interaction_events.23.desc: "土耳其叛徒們拒絕了我們島嶼換盟約的提議。這證明了他們政府的無能與懦弱。"
 BBA_italy_interaction_events.23.a: "沒有他們對我們來說或許更好。"
 BBA_italy_interaction_events.24.t: "德國試圖吞併奧地利"
 BBA_italy_interaction_events.24.desc: "邪惡的德國政府正嘗試干預奧地利的內政並妄圖將這個國家納入他們的版圖。我們在之前曾給予了奧地利獨立保障，因此人民們希望我們能為了他們的獨立挺身而出對抗德國人。我們或許也能向英法尋求幫助。我們該作何選擇？"
 BBA_italy_interaction_events.24.a: "我們將獨自擊敗他們。"
 BBA_italy_interaction_events.24.b: "最好還是尋求一些幫助。"
 BBA_italy_interaction_events.24.c: "我們對此無能為力。撤銷獨立保障！"
 BBA_italy_interaction_events.25.t: "意大利試圖對抗我們"
 BBA_italy_interaction_events.25.desc: "意大利外交部已就我國試圖吞併奧地利的舉動發出嚴重警告。如果我們仍舊採取行動，那麼將會面對意大利軍隊的強力反制。我們應該如何回應這種挑釁行為？"
 BBA_italy_interaction_events.25.a: "他們過於自大了。"
 BBA_italy_interaction_events.25.b: "我們無法處理這樣的對抗行為。"
 BBA_italy_interaction_events_news.1.t: "德國退縮了"
 BBA_italy_interaction_events_news.1.desc: "世界各地的新聞媒體都收到了來自意大利國防部的報告，報告稱在對奧地利提出領土要求並受到意方警告之後，德國選擇了退縮。這對歐洲來說是歷史性的一天，而只有時間才能向我們展示這個支離破碎的德國會面臨什麼。"
 BBA_italy_interaction_events_news.1.a: "很遺憾，他們別無選擇。"
 BBA_italy_interaction_events_news.1.b: "這揭示了德國制度固有的缺陷。"
 BBA_italy_interaction_events.26.t: "[ITA.GetNameDef]退縮了"
 BBA_italy_interaction_events.26.desc: "意大利已經宣佈他們將不會阻撓我們，因為我們已經向他們闡明瞭一點：如果他們再不退縮，局勢就將急轉直下。今天是祖國的光榮一天！"
 BBA_italy_interaction_events.26.a: "這應該會促使[AUS.GetAdjective]人重新考慮"
 BBA_italy_interaction_events.27.t: "意大利邀請我們一同遏制德國"
 BBA_italy_interaction_events.27.desc: "[GetItalyAsksEngland]"
 BBA_italy_interaction_events.27.desc_hosting_ethiopia: "意大利請求我們協助他們遏制德國的擴張，還希望我國保證奧地利的獨立來捍衛他們。雖然我們兩國曾經並肩作戰，如今我們正在庇護埃塞俄比亞的流亡政府，而他們是被意大利驅趕到了這裡。如果[ITA.GetNameDef]希望我們幫助他們面對即將到來的戰爭，那麼他們就必須先議和。"
 BBA_italy_interaction_events.27.desc_standard: "就像過去的世界大戰那樣，意大利又一次請求我們幫助遏制德國的擴張。他們希望我們保障奧地利的獨立，以此確保奧地利安全無虞。我們要怎麼辦？"
 BBA_italy_interaction_events.27.a: "不錯，我們再當一回好盟友。"
 BBA_italy_interaction_events.27.b: "只要他們答應同[ETH.GetNameDef]議和。"
 BBA_italy_interaction_events.27.c: "當然不了，為什麼我們要關心歐洲大陸？"
 ITA_if_Italy_accepts_tt: "如果§Y[ITA.GetName]§!接受："
 BBA_italy_interaction_events_news.2.t: "聯合王國保障奧地利獨立"
 BBA_italy_interaction_events_news.2.desc: "英國政府今日宣佈支持奧地利獨立，與意大利並肩對抗任何威脅該國主權的外部勢力。"
 BBA_italy_interaction_events_news.2.a: "出其不意的一招。"
 BBA_italy_interaction_events.28.t: "意大利邀請我們一同遏制德國"
 BBA_italy_interaction_events.28.desc: "東南鄰國請我們協助抵制德國侵吞奧地利，後者的獨立性正由該國保護。他們請我們與之一道並行，我們該怎麼回應？"
 BBA_italy_interaction_events.28.a: "好，為了自由！"
 BBA_italy_interaction_events.28.b: "只要他們答應同[ETH.GetNameDefCap]議和。"
 BBA_italy_interaction_events_news.3.t: "法國保障奧地利獨立"
 BBA_italy_interaction_events_news.3.desc: "法國應意大利之請，決定支持奧地利為獨立而戰，並許諾將對任何干涉奧國內政的潛在威脅者宣戰。"
 BBA_italy_interaction_events_news.3.a: "這不太法國……"
 BBA_italy_interaction_events.29.t: "意大利奪取我國的[802.GetName]！"
 BBA_italy_interaction_events.29.desc: "意大利打算從我國領土中撈走[802.GetName]，然後鑲到他們自己的阿爾巴尼亞王國上。倘若我們啥也不做，我們就要永遠丟掉對當地的宣稱了。 "
 BBA_italy_interaction_events.29.a: "螳臂當車，量力而不行。"
 BBA_italy_interaction_events.29.b: "我們得和他們劃清界限了。"
 BBA_italy_interaction_events.30.t: "意大利提議以[45.GetName]換取相互保障"
 BBA_italy_interaction_events.30.desc: "[ITA.GetName]提出支持我國對[45.GetName]的領土宣稱，用以換取兩國的相互獨立保證和合作協議。這看起來是對我國有利的交易，我們是否接受？"
 BBA_italy_interaction_events.30.a: "不錯！"
 BBA_italy_interaction_events.30.b: "為什麼我們要相信意大利人？"
 BBA_italy_interaction_events.31.t: "[NegotiatingItalianClaimsTitle]"
 BBA_italy_interaction_events.31.t_negotiate_claims: "[ITA.GetNameDefCap]希望協商索馬裡宣稱"
 BBA_italy_interaction_events.31.t_refused_peace: "[ETH.GetNameDefCap]拒絕和談"
 BBA_italy_interaction_events.31.desc: "[GetRatifyStresaFrontEventDesc]"
 BBA_italy_interaction_events.31.desc_no_war: "意大利政府今天向我們提出了一個有趣的提議：他們希望批准斯特雷薩陣線，確保我們能在歐洲戰爭爆發時獲得他們的支持。不過，作為簽訂的條件，他們要求獲得[269.GetName]和[903.GetName]。我們該作何回應？如果接受的話，我們至少能獲得短期的補償。"
 BBA_italy_interaction_events.31.desc_peace_signed: "[ITA.GetNameDefCap]和[ETH.GetNameDefCap]已經擱置了他們的分歧並簽署了和平條約，這很大程度上歸功於我們嫻熟的外交手段。意大利政府還提醒我們先前達成的交易：他們獲得[269.GetName]和[903.GetName]，以換取斯特雷薩陣線的成立。"
 BBA_italy_interaction_events.31.desc_no_peace_deal: "忘恩負義的[ETH.GetLeader]不顧我們在此事上的堅決態度，以為自己佔據上風，拒絕與[ITA.GetAdjective]政府開展和平談判。這讓我們別無選擇，只能把埃塞俄比亞領導人驅逐出我國，這樣我們才能專注於更合我國利益的意大利的提議。"
 BBA_italy_interaction_events.31.a: "可以，拿去吧。"
 BBA_italy_interaction_events.31.b: "天，當然不行。"
 BBA_italy_interaction_events.32.t: "[ITA.GetName]希望協商吉布提宣稱"
 BBA_italy_interaction_events.32.desc: "意大利政府今天向我們提出了一個有趣的提議：他們希望批准斯特雷薩陣線，確保我們能在歐洲戰爭爆發時獲得他們的支持。不過，作為簽訂的條件，他們要求獲得[268.GetName]。我們該作何回應？如果接受的話，我們至少能獲得短期的補償。"
 BBA_italy_interaction_events.32.a: "為了和平。"
 BBA_italy_interaction_events.32.b: "不可能！"
 BBA_italy_interaction_events.33.t: "[ITA.GetName]希望協商[906.GetName]宣稱"
 BBA_italy_interaction_events.33.desc: "[GetItalyWantsSocotra]"
 BBA_italy_interaction_events.33.desc_first_negotiation: "意大利政府今天向我們提出了一個有趣的提議：他們希望批准斯特雷薩陣線，確保我們能在歐洲戰爭爆發時獲得他們的支持。不過，作為簽訂的條件，他們要求獲得[906.GetName]。我們該作何回應？如果接受的話，我們至少能獲得短期的補償。"
 BBA_italy_interaction_events.33.desc_continued_negotiation: "意大利人又向我們提出了一個要求。這回他們想獲得[906.GetName]島。他們聲稱這樣能更方便管理進出意屬東非的商品，同時像我們一樣控制紅海的其中一個出入口。我們應該把控制權交給他們嗎？他們表示將向我們支付短期的補償。"
 BBA_italy_interaction_events.33.a: "和平的一點價碼罷了。"
 BBA_italy_interaction_events.33.b: "他們為什麼必須要這塊地？"
 BBA_italy_interaction_events.34.t: "[ITA.GetName]希望協商突尼斯宣稱"
 BBA_italy_interaction_events.34.desc: "[GetItalyWantsTunisia]"
 BBA_italy_interaction_events.34.desc_first_negotiation: "意大利政府今天向我們提出了一個有趣的提議：他們希望批准斯特雷薩陣線，確保我們能在歐洲戰爭爆發時獲得他們的支持。不過，作為簽訂的條件，他們要求獲得[458.GetName]和[665.GetName]。我們該作何回應？如果接受的話，我們至少能獲得短期的補償。"
 BBA_italy_interaction_events.34.desc_continued_negotiation: "意大利人又向我們提出了一個要求。這回他們想獲得[458.GetName]和[665.GetName]。他們聲稱，和我們與英國比較後，這樣劃分北非才更公平。我們應該把控制權交給他們嗎？他們表示將向我們支付短期的補償。"
 BBA_italy_interaction_events.34.a: "可以。"
 BBA_italy_interaction_events.34.b: "真惱人。"
 BBA_italy_interaction_events.35.t: "[ITA.GetName]希望協商馬耳他宣稱"
 BBA_italy_interaction_events.35.desc: "[GetItalyWantsMalta]"
 BBA_italy_interaction_events.35.desc_first_negotiation: "意大利政府今天向我們提出了一個有趣的提議：他們希望批准斯特雷薩陣線，確保我們能在歐洲戰爭爆發時獲得他們的支持。不過，作為簽訂的條件，他們要求獲得[116.GetName]。我們該作何回應？如果接受的話，我們至少能獲得短期的補償。"
 BBA_italy_interaction_events.35.desc_continued_negotiation: "意大利人又向我們提出了一個要求。這回他們想獲得[116.GetName]島。他們聲稱這樣能更方便控制地中海。我們應該把控制權交給他們嗎？他們表示將向我們支付短期的補償。"
 BBA_italy_interaction_events.35.a: "給他們能有大用。"
 BBA_italy_interaction_events.35.b: "真是荒唐！"
 BBA_italy_interaction_events.36.t: "[ITA.GetName]希望協商巴爾幹宣稱"
 BBA_italy_interaction_events.36.desc: "[GetItalyClaimsBalkan]"
 BBA_italy_interaction_events.36.desc_first_negotiation: "意大利政府今天向我們提出了一個有趣的提議：他們希望批准斯特雷薩陣線，確保我們能在歐洲戰爭爆發時獲得他們的支持。同時，他們希望我們認可他們在巴爾幹的宣稱。我們對該地區確實沒有興趣，因此我國政府也不是特別熱衷於拒絕他們的要求。"
 BBA_italy_interaction_events.36.desc_continued_negotiation: "[ITA.GetName]現在只剩下最後一個需要我們在簽署條約之前回應的請求。他們希望我們認可他們在巴爾幹的宣稱。我們對該地區確實沒有興趣，因此我國政府也不是特別熱衷於拒絕他們的要求。"
 BBA_italy_interaction_events.36.a: "糾結這個沒啥意義。"
 BBA_italy_interaction_events.37.t: "領土協商全面結束"
 BBA_italy_interaction_events.37.desc: "我國外交官在過去數週內輾轉英法兩國，確保了意大利在未來能拿到的領土。如今，協商已經結束，文件也都已簽署完成。"
 BBA_italy_interaction_events.37.a: "並非我們的全部訴求，但我們選擇接受。"
 BBA_italy_interaction_events.37.b: "太好了！"
 BBA_italy_interaction_events.38.t: "教宗正位"
 BBA_italy_interaction_events.38.desc: "教宗的權力業已超過意大利的君主，於是大量天主教會的狂熱支持者在今天聚集起來，走上街頭，要求教宗統治國家。他接受了民眾呈獻的這份職位，並宣佈今天發生的一切確乎是天主的旨意。現如今國王已經沒有什麼攔阻他的手段了。"
 BBA_italy_interaction_events.38.a: "如神所願！"
 BBA_italy_interaction_events.39.t: "交付非洲殖民地"
 BBA_italy_interaction_events.39.desc: "我們終於為在非洲的新財產支付了最後一筆款項。該協議擴大、統一併鞏固了我們的殖民地領土，加強了我們在這一地區的地位。總而言之，這對所有參與方來說都是一項非常有益的安排。"
 BBA_italy_interaction_events.39.a: "新時代開始了!"
 BBA_italy_interaction_events.40.t: "斯特雷薩陣線被批准"
 BBA_italy_interaction_events.40.desc: "領土轉讓方案已經敲定，[ITA.GetName]也啟動了進程，將意大利和法國納入一個名為斯特雷薩陣線的軍事聯盟。現在不是袖手旁觀的時候，因為法國必須為自己的最大利益採取行動，同意大利一道對抗德國的威脅。"
 BBA_italy_interaction_events.40.a: "這個條件可以接受。"
 BBA_italy_interaction_events.40.b: "法國從來都不應該和意大利結成同盟。"
 stresa_front_ita: "斯特雷薩陣線"
 BBA_italy_interaction_events.41.t: "[FROM.GetName]為我們提供保護"
 BBA_italy_interaction_events.41.desc: "[FROM.GetLeader]找到我國政府，希望我國能去到他們的羽翼下接受保護，以免受他國勢力的入侵和經濟蕭條的影響。但[FROM.GetName]也很盛氣凌人，可以看出，如果我們拒絕，一場入侵就難以避免。"
 BBA_italy_interaction_events.41.a: "難以拒絕的好提議。"
 BBA_italy_interaction_events.41.b: "人民想要的是獨立自主！"
 BBA_italy_interaction_events.42.t: "[FROM.GetName]接受了我們的提議"
 BBA_italy_interaction_events.42.desc: "[FROM.GetName]謙卑地接受了我們的保護提議，向我們這地中海的合法統治者俯首稱臣。今天對伊比利亞和[ITA.GetNameDef]來說是無比光明的一天。"
 BBA_italy_interaction_events.42.a: "棒極了。"
 BBA_italy_interaction_events.43.t: "[FROM.GetName]拒絕我方提案"
 BBA_italy_interaction_events.43.desc: "[FROM.GetName]粗魯地拒絕了我們提供的保護，我們將告訴他們忤逆我們的真正代價。他們將對我們俯首稱臣！"
 BBA_italy_interaction_events.43.a: "他們會後悔的！"
 BBA_italy_interaction_events.44.t: "[FROM.GetName]邀請我們加入聯盟"
 BBA_italy_interaction_events.44.desc: "[FROM.GetLeader]提出與南美洲國家結盟，以將拉丁文化圈團結在一個領袖之下。這看上去是保護我們免受[USA.GetNameDef]威脅的好機會。我們該如何回應？"
 BBA_italy_interaction_events.44.a: "聽起來不錯。"
 BBA_italy_interaction_events.44.b: "為什麼我們要向帝國主義者低頭？"
 BBA_italy_interaction_events.45.t: "[FROM.GetName]接受我方提議"
 BBA_italy_interaction_events.45.desc: "[FROM.GetName]謙和地接受了我們的提議，將與我們團結一心抗擊我們共同的敵人。今天對於南美和[ITA.GetNameDef]來說是無比光輝的一天。"
 BBA_italy_interaction_events.45.a: "太好了"
 BBA_italy_interaction_events.46.t: "[FROM.GetName]拒絕我方提議"
 BBA_italy_interaction_events.46.desc: "[FROM.GetName]粗魯地拒絕了我們的同盟邀約，我們將就此分道揚鑣。他們將會成為美洲大陸上的孤島。"
 BBA_italy_interaction_events.46.a: "我們沒法改變他們的想法……"
 BBA_italy_interaction_events.50.t: "意大利的提議"
 BBA_italy_interaction_events.50.desc: "意大利政府今天向我們提出了一個有趣的提議：他們希望批准斯特雷薩陣線，確保我們能在歐洲戰爭爆發時獲得他們的支持。不過，作為簽訂的條件，他們要求獲得[269.GetName]和[903.GetName]。而且他們還與流亡於我國的[ETH.GetName]政府交戰中。我們該作何回應？如果接受的話，我們至少能獲得短期的補償。"
 BBA_italy_interaction_events.50.a: "他們得先簽署和平協議！"
 BBA_italy_interaction_events.50.b: "和這幫戰犯沒什麼好議的！"
 BBA_italy_interaction_events.51.t: "英國人拒絕談判"
 BBA_italy_interaction_events.51.desc: "對於我們以批准《斯特雷薩會議最終宣言》為條件換取英國的少量殖民領土的合理提議，英國顯得極為鄙夷和不屑一顧。他們一定是因為過於狂妄自大才膽敢拒絕我們。"
 BBA_italy_interaction_events.51.a: "他們會後悔的！"
 BBA_italy_interaction_events.60.t: "[ITA.GetName]簽署和平協議"
 BBA_italy_interaction_events.60.desc: "意大利與埃塞俄比亞簽訂了和平協議，並歸還了他們先前侵佔的部分領土。意大利政府現在要求我方遵守協定，並保障奧地利獨立以對抗德國的擴張。"
 BBA_italy_interaction_events.70.t: "等待回應"
 BBA_italy_interaction_events.70.desc: "我們已經向[GetAdjective]領導人派出特使，詢問他們是否願意拋開分歧，在意大利的監督下組建新政府。"
 BBA_italy_interaction_events.70.a: "我們將耐心等待。"
 BBA_italy_interaction_events.71.t: "意大利的提議"
 BBA_italy_interaction_events.71.desc: "[ITA.GetNameDef]特使已經聯繫我們，詢問我們是否願意拋開分歧，在意大利的監督下組建新政府。特使告知我們，無論我們是否合作，他們都將繼續在我們的家園組建新政權。如果我們拒絕這項提議，我們將會因這個新政權被全世界冷落。"
 BBA_italy_interaction_events.71.a: "我們已是無可奈何。"
 ITA_create_puppet_tt: "§Y[ROOT.GetNameWithFlag]§!將獲得新的§Y國策樹§!"
 BBA_italy_interaction_events.71.b: "我們還是有自尊的！"
 BBA_italy_interaction_events.72.t: "[FROM.GetAdjective]人離開了"
 BBA_italy_interaction_events.72.desc: "[FROM.GetAdjective]流亡政府的領導人[FROM.GetLeader]，昨夜謹慎地到訪了[ROOT.GetLeader]的私宅，秘密通告了他決定接受在意大利政權監督下組建新政府的提議。他對我們在這一動盪時刻提供的慷慨援助表示感謝，但表示他需要為其人民的利益著想。"
 BBA_italy_interaction_events.72.a: "他們已經抵抗太久了。"
 BBA_italy_interaction_events.666.t: "[454.GetName]或戰爭"
 BBA_italy_interaction_events.666.desc: "[From.GetLeader]教宗陛下要求我們交出[454.GetName]。教廷特使稱，如此聖地只能交由教廷親自治理，倘若拒絕即是異端行為。如若應允，我國與[FROM.GetName]的關係將極大改善，但[454.GetName]位於亞非歐三大洲十字路口，從古至今乃兵家必爭之地。"
 BBA_italy_interaction_events.666.a: "聖座的要求不可不從……"
 BBA_italy_interaction_events.666.b: "老東西活該下地獄了！"
 BBA_italy_interaction_events.667.t: "[FROM.GetName]轉交[454.GetName]"
 BBA_italy_interaction_events.667.desc: "今天是教廷與整個基督教世界的有福之日！[FROM.GetAdjective]領導人[FROM.GetLeader]明智地同意了我們的要求，將[454.GetName]轉移給我國治理。今後，當地將長治久安、繁榮昌樂；[ROOT.GetName]亦能享光明的未來。"
 BBA_italy_interaction_events.667.a: "[FROM.GetAdjective]的領導是應受稱頌的！"
 BBA_italy_interaction_events.668.t: "[FROM.GetName]拒絕聖座提議"
 BBA_italy_interaction_events.668.desc: "[FROM.GetLeader]不僅愚昧無知，還同樣非常傲慢無禮。他看不到移交[454.GetName]給我方能帶來的益處：區域的安全和穩定將得到保障。他愚蠢的行徑只會帶來戰爭和災難！"
 BBA_italy_interaction_events.668.a: "這是在冒犯天主！"
 BBA_italy_purge_the_party.1.t: "清洗國家法西斯黨"
 BBA_italy_purge_the_party.1.desc: "墨索里尼的重要盟友仍在暗中操作，想把前領袖匡扶歸位。如果我們還想繼續把持著政府，就必須殺雞儆猴，讓這些罪人滾出政府。"
 BBA_italy_purge_the_party.1.a: "清洗顧問。"
 BBA_italy_purge_the_party.1.b: "清洗將領。"
 BBA_italy_purge_the_party.1.c: "一個也不清洗。"
 BBA_italy_purge_the_party.1.d: "一個也別放過。"
 ITA_characters_will_be_spared_tt: "§Y以下角色將免於清洗：§!"
 BBA_italy_decide_the_fate_of_mussolini.1.t: "墨索里尼的命運"
 BBA_italy_decide_the_fate_of_mussolini.1.desc: "國內勢力鬥爭告一段落，我等業已鞏固了在國家法西斯黨中的權力根基，終於可以回過頭來處理前領袖——墨索里尼的問題了。他那愈加噁心的存在乃是我等立場的逆鱗，需要加以處理。"
 BBA_italy_decide_the_fate_of_mussolini.1.a: "把他公審了。"
 BBA_italy_decide_the_fate_of_mussolini.1.b: "把他處決了。"
 BBA_italy_decide_the_fate_of_mussolini.1.c: "把他暗殺了。"
 BBA_italy_decide_the_fate_of_mussolini.2.t: "審判墨索里尼"
 BBA_italy_decide_the_fate_of_mussolini.2.desc: "世紀級別的審判即將開始：貝尼托·墨索里尼被控多項腐敗罪、叛國罪等罪名。這場審判只不過是讓平頭百姓覺得我們還是個有法可依的政府。事實上，最終結果如何還是掌握在我們的手中。"
 BBA_italy_decide_the_fate_of_mussolini.2.a: "赦罪淨身。"
 BBA_italy_decide_the_fate_of_mussolini.2.b: "讓他爛在監牢裡吧。"
 BBA_italy_decide_the_fate_of_mussolini.3.t: "墨索里尼之死"
 BBA_italy_decide_the_fate_of_mussolini.3.desc: "暗中刺殺前領袖的計劃正如火如荼，但最後還是得考慮下意大利民眾的反應。我們該如何掩蓋此事？"
 BBA_italy_decide_the_fate_of_mussolini.3.a: "這全都是共匪幹的好事！"
 BBA_italy_decide_the_fate_of_mussolini.3.b: "娓娓道來一個官面故事。"
 ITA_mussolini_stands_trial_tt: "讓法院決定他的命運——雖然法院怎麼判還是得聽我們安排。"
 ITA_mussolini_is_assassinated_tt: "我們可以利用他的死亡。"
 ITA_mussolini_walks_free_tt: "往後餘生，墨索里尼都是個自由的公民。"
 BBA_italy_research_agreement.1.t: "[FROM.GetNameDefCap]提議進行聯合軍事合作項目"
 BBA_italy_research_agreement.1.desc: "[FROM.GetAdjective]提議進行一項聯合研究計劃，這不僅能夠加強我們的軍事能力，還能加強兩國之間的聯繫。同時，這還能使我們之間的技術與研究分享更為便捷，並使我們兩國更加緊密地聯繫在一起。"
 BBA_italy_research_agreement.1.a: "這可能對我們有好處。"
 BBA_italy_research_agreement.1.b: "我們不需要這樣的項目。"
 BBA_italy_research_agreement.2.t: "[FROM.GetNameDefCap]拒絕了我們的聯合軍事項目提議"
 BBA_italy_research_agreement.2.desc: "[FROM.GetNameDefCap]拒絕了我們的軍事提議，這是不明智的行為。聯合軍事項目本能夠加強我們雙方的軍事能力，但看起來[FROM.GetAdjective]對此毫無興趣。幸運的是，我們不需要他們的幫助也能夠達成目標！"
 BBA_italy_research_agreement.2.a: "糟糕的決定。"
 BBA_italy_pact.1.t: "[FROM.GetNameDefCap]提議簽署互不侵犯協定"
 BBA_italy_pact.1.desc: "[FROM.GetAdjective]準備好與我國發布共同發佈宣言，將兩國友誼與互助開誠佈公地講出來。與該國的互不侵犯條約可以確保兩國邊界安穩無爭，將用於這部分國防資源解放出來挪作他用。就算我們其實背地裡留了一手，這也能留給我們積攢力量的時間。"
 BBA_italy_pact.1.a: "對雙方都很合適。"
 BBA_italy_pact.1.b: "我們可信不過他們！"
 BBA_italy_pact.2.t: "[FROM.GetNameDefCap]對我們的橄欖枝嗤之以鼻"
 BBA_italy_pact.2.desc: "[FROM.GetNameDefCap]拒絕了我國有關兩國間互不侵犯協定的提議，還稱這份交易既心懷鬼胎又有違公平。這幫人腦子簡直進水了，居然連利害輕重都辨不明白。"
 BBA_italy_pact.2.a: "愚不可及！"
 BBA_italy_recognize_the_empire.1.t: "承認意大利帝國"
 BBA_italy_recognize_the_empire.1.desc: "[FROM.GetLeader]宣佈意大利成為帝國了！儘管我國駐羅馬大使館建議我們最好承認既成事實，讓[FROM.GetAdjective]自我陶醉一陣子，但也有觀點擔心事態會因此轉向惡化。後者認為，安撫[FROM.GetAdjective]僅會導致一步退、步步退的惡果，正確做法是打碎這個新帝國危險的迷夢。"
 BBA_italy_recognize_the_empire.1.a: "承認意大利帝國。"
 BBA_italy_recognize_the_empire.1.b: "忽略他們的宣言。"
 BBA_italy_recognize_the_empire.2.t: "承認帝國"
 BBA_italy_recognize_the_empire.2.desc: "[FROM.GetNameDefCap]明智地承認了我等之帝國偉業，視我們的皇帝與其平起平坐——理應如此！我國的威望與榮耀與日俱增。"
 BBA_italy_recognize_the_empire.2.a: "我們的力量正在增長！"
 BBA_italy_recognize_the_empire.3.t: "拒稱帝國"
 BBA_italy_recognize_the_empire.3.desc: "[FROM.GetNameDefCap]愚蠢地嘲笑我等之帝國野心，妄稱白日做夢無法建立帝國。這幫賊人必須為其無禮付出代價！我們應等待時機，日後向那幫根本看不見意大利帝國偉岸無邊的榆木腦袋展現我等真正的實力。"
 BBA_italy_recognize_the_empire.3.a: "連下輩子也後悔去吧……"
 BBA_italy_sends_military_support.1.t: "[FROM.GetNameDefCap]送出軍事援助"
 BBA_italy_sends_military_support.1.desc: "[FROM.GetAdjective]希望能在戰爭中幫助我們，並送來了一些裝備。儘管數量不多，但是任何援助我們來者不拒。"
 BBA_italy_sends_military_support.1.a: "這些裝備會有用武之地的。"
 BBA_italy_communist_events.01.t: "共和國的領袖"
 BBA_italy_communist_events.01.desc: "我們新生的共和國終於掙脫了法西斯的魔爪，現在是時候為祖國選擇航向了！現在需要的是一位投身於我們偉大事業的，堅定而英明的領袖。他將堅不可摧，帶領我們披荊斬棘，直達光明的未來。"
 BBA_italy_communist_events.01.a: "安東尼奧·葛蘭西是正統的領袖。"
 BBA_italy_communist_events.01.b: "我們應當追隨帕爾米羅·陶里亞蒂。"
 BBA_italy_communist_events.01.c: "山德羅·佩爾蒂尼將帶領我們前行。"
 BBA_italy_communist_events.02.t: "[FROM.GetAdjective]請求援助"
 BBA_italy_communist_events.02.desc: "在新生的[FROM.GetName]，我們的同志正在請求援助。[FROM.GetAdjective]的人民正在進行一場保衛共產主義的內戰，現在正向其他相近意識形態的政府求援，來重建和保衛他們的新共和國。"
 BBA_italy_communist_events.02.a: "我們會支援他們！"
 BBA_italy_communist_events.02.b: "這與[ROOT.GetAdjective]人民無關。"
 BBA_italy_communist_events.03.t: "支援[ROOT.GetNameDef]的國際援助"
 BBA_italy_communist_events.03.desc: "[FROM.GetName]的政府已經聽到了同志們的求助，並決定幫助我們！這不僅僅會增強我們之間的友誼，更是增強了我們的力量，來保衛我們親愛的共和國。"
 BBA_italy_communist_events.03.a: "團結起來的我們永遠不會被擊敗！"
 BBA_italy_communist_events.04.t: "沒有收到國際支援"
 BBA_italy_communist_events.04.desc: "沒人回應我們的求援！看來全世界的共產主義者們都拋棄了我們，無意於幫助他們的同志們。我們只能在這個殘酷的世界靠我們自己了——但是革命終將勝利！"
 BBA_italy_communist_events.04.a: "[ROOT.GetNameDefCap]無論如何都會取得勝利！"
 ITA_country_supports_new_italian_government_tt: "[FROM.GetNameDefCap]會以§Y裝備§!和少量的臨時§Y生活消費品§!工廠減少的形式收到我們給予的援助。"
 ITA_international_support_arrives_tt: "我們會從我們海外的同志那裡獲得以下好處： "
 ITA_international_support_consumer_goods_tt: "獲得為期§Y730§!日的“§Y$ITA_international_aid$§!”，其效果為（$MODIFIER_CONSUMER_GOODS_FACTOR$：§Y[?ITA_consumer_goods_from_leftist_aid|%]§!）。"
 BBA_italy_communist_events.05.t: "和[FROM.GetAdjective]的軍事合作"
 BBA_italy_communist_events.05.desc: "我們最近和[FROM.GetAdjective]軍方完成了一項聯合演習行動。我們陸海軍的將帥們很高興地報告了演習的巨大成功和我們軍隊的良好表現。這將增強我們與[FROM.GetName]的紐帶和我們的軍事實力。"
 BBA_italy_communist_events.05.a: "這大大強化了[ROOT.GetFactionName]的實力！"
 BBA_italy_communist_events.06.t: "[FROM.GetAdjective]的合作提議"
 BBA_italy_communist_events.06.desc: "來自[FROM.GetName]的同志們提出，我們應該成立一個大委員會，其成員將來自西班牙以及其他國家，以促進雙方間的合作。他們認為我們應該共同對抗資本主義和法西斯主義，直到我們有朝一日能夠粉碎他們。"
 BBA_italy_communist_events.06.a: "我們肩並肩！"
 BBA_italy_communist_events.06.b: "[FROM.GetAdjective]的事情和我們無關。"
 BBA_italy_communist_events.07.t: "[FROM.GetName]接受我方提案"
 BBA_italy_communist_events.07.desc: "[FROM.GetName]的同志們同意和我們聯手建立一個合作大委員會！只要我們通力合作，定能對抗來自資本主義和法西斯主義的進攻，並扭轉局勢，將光榮的革命傳播到世界上的每一個角落！"
 BBA_italy_communist_events.08.t: "[FROM.GetName]拒絕我方提案"
 BBA_italy_communist_events.08.desc: "[FROM.GetAdjective]的愚昧的傢伙如此短視，以至於不能發現什麼才是對他們最有利的！我們只要齊心協力，就能更容易地對抗資本主義和法西斯主義，但我們就算沒有他們也能成功！"
 BBA_italy_communist_events.08.a: "他們沒想清楚吧……"
 BBA_italy_communist_events.09.t: "安東尼奧·葛蘭西康復"
 BBA_italy_communist_events.09.desc: "安東尼奧·葛蘭西終於從在遭受不公正的監禁時染上的重病中康復了。他已經準備好竭盡所能，以從未有過的堅定信念和高漲的熱情投身於我們的事業。"
 BBA_italy_communist_events.09.a: "他意志中的樂觀主義治好了他。"
 BBA_italy_democratic_events.01.t: "$BBA_italy_communist_events.01.t$"
 BBA_italy_democratic_events.01.desc: "隨著內戰告一段落，是時候團結民眾、修補傷口，踏上重建之路了。我們的民主制仍然稚嫩脆弱，所以我們需要一副強壯而溫柔的雙手指引我們前行。"
 BBA_italy_democratic_events.01.a: "費盧西奧·帕裡是最合適的領導人。"
 BBA_italy_democratic_events.01.b: "伊瓦諾埃·博諾米的經驗最為有價值。"
 BBA_italy_democratic_events.02.t: "意大利科技合作項目"
 BBA_italy_democratic_events.02.desc: "[FROM.GetName]邀請我們加入一項新的科研合作項目。這將深化我們兩國之間的合作關係。"
 BBA_italy_democratic_events.02.a: "很好的倡議！"
 BBA_italy_democratic_events.03.t: "意大利黑手黨重出江湖"
 BBA_italy_democratic_events.03.desc: "內戰造成了許多令人悲痛的流血事件，動搖了[FROM.GetName]的社會根基。亂局還導致了權力真空，這導致[?ROOT.ITA_mafia_epicenter_state.GetName]死灰復燃的黑手黨掌控了局面。鎮壓黑手黨也許是法西斯分子唯一所能做的好事。"
 BBA_italy_democratic_events.03.a: "要對付的麻煩又多了一個。"
 BBA_italy_democratic_events.05.t: "意大利黑手黨翻江倒海"
 BBA_italy_democratic_events.05.desc: "黑手黨的影響正如瘟疫般擴散！[FROM.GetName]最近的亂局滋生了罪犯和其他渣滓，由於當地缺乏嚴格的法律，這些人渣的數量正在迅速增加。他們利用內戰留下的權力真空，再次在[FROM.GetName]各地建立了自己的統治。"
 BBA_italy_democratic_events.05.a: "他們就是一幫王八蛋！"
 generic_states_affected_tt: "\n受效果影響地區：\n"
 generic_states_affected_no_prev_line_tt: "受效果影響地區：\n"
 BBA_italy_anti_colonialism_events.01.t: "$ITA_the_ethiopian_question$"
 BBA_italy_anti_colonialism_events.01.desc: "隨著內部事務終於安定，我們可以再一次放眼海外了。我們從法西斯分子那裡接手了一大堆問題，現在必須解決。首要問題就是關於埃塞俄比亞。這是一場由好大喜功的墨索里尼所發動的，殘暴而非正義的戰爭。現在他已經死了，該讓我們決定埃塞俄比亞的命運了。"
 BBA_italy_anti_colonialism_events.01.a: "不要再打啞謎了！"
 BBA_italy_anti_colonialism_events.01.b: "我們將會解放埃塞俄比亞的工人們！"
 BBA_italy_anti_colonialism_events.01.c: "我們必須整合埃塞俄比亞的領土。"
 BBA_italy_anti_colonialism_events.01.d: "我們需要投資埃塞俄比亞和埃塞俄比亞人民。"
 BBA_italy_anti_colonialism_events.01.e: "我們先保持現狀吧。"
 BBA_italy_anti_colonialism_events.01.f: "我們必須終結[ETH.GetLeader]的反動統治！"
 BBA_italy_anti_colonialism_events.01.g: "我們將加強與埃塞俄比亞的紐帶關係。"
 BBA_italy_anti_colonialism_events.02.t: "在[FROM.GetName]的停火"
 BBA_italy_anti_colonialism_events.02.desc: "[FROM.GetName]的新政府找到我們，請求停火併終止敵對。看來在他們的內戰後，他們已經厭倦了流血與戰鬥了。"
 BBA_italy_anti_colonialism_events.02.a: "聽起來還行。"
 BBA_italy_anti_colonialism_events.02.b: "我們必須投降……"
 BBA_italy_anti_colonialism_events.02.c: "太晚了，他們必將屈膝臣服！"
 BBA_italy_anti_colonialism_events.03.t: "終止意-埃戰爭"
 BBA_italy_anti_colonialism_events.03.desc: "[FROM.GetName]的[FROM.GetLeader]已經同意了我們的停火請求，並且尋求和平共處的機遇。我們終於可以把墨索里尼最惡名昭著的暴政扔下，開始一個新的未來了。"
 BBA_italy_anti_colonialism_events.03.a: "和平了！"
 BBA_italy_anti_colonialism_events.04.t: "[FROM.GetLeader]拒絕了我們的提案"
 BBA_italy_anti_colonialism_events.04.desc: "嗜血的[FROM.GetLeader]顯然聞到了我們內戰的血腥，並且認為我們孱弱不堪。[FROM.GetSheHeCap]已經拒絕了我們慷慨的和平提議，並且執意持續戰鬥。我們會告訴[FROM.GetHerHim]，我們可沒那麼弱！"
 BBA_italy_anti_colonialism_events.04.a: "[FROM.GetLeader]會後悔的！"
 BBA_italy_anti_colonialism_events.05.t: "[FROM.GetAdjective]要求[ROOT.GetAdjective]整合"
 BBA_italy_anti_colonialism_events.05.desc: "[FROM.GetName]的政府正在準備直接控制我們的領土，並將我們整合進[FROM.GetAdjective]的管轄中。這會對我們的人民、文化和傳統帶來怎麼樣的影響，無人知曉。"
 BBA_italy_anti_colonialism_events.05.a: "我們欣然同意。"
 BBA_italy_anti_colonialism_events.05.b: "我們絕不放棄我們的自治權！"
 BBA_italy_anti_colonialism_events.06.t: "[FROM.GetAdjective]被整合進入[ROOT.GetNameDef]"
 BBA_italy_anti_colonialism_events.06.desc: "[FROM.GetAdjective]政府意識到，被整合進入[ROOT.GetAdjective]的管轄，將會使我們所有人都獲益，而且變得更為強大。"
 BBA_italy_anti_colonialism_events.06.a: "棒極了！"
 BBA_italy_anti_colonialism_events.07.t: "[FROM.GetName]拒絕了我們的提議"
 BBA_italy_anti_colonialism_events.07.desc: "看來[FROM.GetAdjective]認為他們還是更適合自治制度，並且拒絕了加入我們的管理。"
 BBA_italy_anti_colonialism_events.07.a: "太過分了……"
 BBA_italy_anti_colonialism_events.08.t: "關於[ROOT.GetAdjective]發展的[FROM.GetAdjective]投資"
 BBA_italy_anti_colonialism_events.08.desc: "看起來，[FROM.GetName]的新政府希望廢除前任政府對於[ROOT.GetAdjective]人民的一些壓迫性的政策，並決定對我國投資以求改變。"
 BBA_italy_anti_colonialism_events.08.a: "[ROOT.GetCapitalVictoryPointName]繁榮！"
 BBA_italy_anti_colonialism_events.09.t: "[FROM.GetAdjective]政府對[ROOT.GetName]施壓"
 BBA_italy_anti_colonialism_events.09.desc: "[FROM.GetAdjective]對外擴張的渴求無窮無盡！[FROM.GetName]代表團為我們帶來了一份附庸議案。他們稱這將不會改變現狀；我們依然可以按照自己希望的方式統治這片土地，同樣也可以從[FROM.GetAdjective]額外的保護中受益，只不過我們偶爾需要對宗主國更加的順從。"
 BBA_italy_anti_colonialism_events.09.a: "我們會響應意大利的同志們！"
 BBA_italy_anti_colonialism_events.09.b: "我們需要政府變革！"
 BBA_italy_anti_colonialism_events.09.c: "歐洲人真狂妄！"
 BBA_italy_anti_colonialism_events.10.t: "[FROM.GetAdjective]工人歡慶！"
 BBA_italy_anti_colonialism_events.10.desc: "[FROMGetAdjective]政府明智地決定接受了我們關於軍隊聯合的方案，目前他們處在我們的保護之下。這毫無疑問將加強兩國並讓兩國受益頗多！"
 BBA_italy_anti_colonialism_events.11.t: "[FROM.GetAdjective]工人奪權"
 BBA_italy_anti_colonialism_events.11.desc: "儘管[FROM.GetAdjective]的領導層沒有接受我們的保護和合作提議，但他們還是部分滿足了我們的要求：以一個與我們更為相似、對我們更為友善的政府替代了其原來的政府。"
 BBA_italy_anti_colonialism_events.11.a: "光明的未來在等待著[FROM.GetAdjective]人民！"
 BBA_italy_anti_colonialism_events.12.desc: "[FROM.GetName]的領導人[FROM.GetLeader]堅決反對我們的保護合作提案，並直言讓我國代表團趕快滾回去。"
 BBA_italy_anti_colonialism_events.12.a: "時間會讓他們知道他們錯的有多離譜。"
 BBA_italy_anti_colonialism_events.12.b: "這不是提議，而是要求。"
 BBA_italy_anti_colonialism_events.13.t: "[FROM.GetName]尋求強化聯繫"
 BBA_italy_anti_colonialism_events.13.desc: "看來，在與我們的交戰中，[FROM.GetAdjective]對我國的軍事和實力產生了極大的尊重。事實上，他們非常熱情地提出了互不侵犯和發生戰爭時互相保障獨立的雙邊提議。"
 BBA_italy_anti_colonialism_events.13.a: "聽起來很好！"
 BBA_italy_anti_colonialism_events.13.b: "不可能！"
 BBA_italy_anti_colonialism_events.14.desc: "[FROM.GetLeader]明智地同意簽署了關於在[FROM.GetName]和[ROOT.GetName]之間建立互不侵犯關係的協定，與此同時，兩個國家也將在任意一方面對侵略時提供相互保障。"
 BBA_italy_anti_colonialism_events.15.desc: "[FROM.GetLeader]不明智地拒絕了我們關於建立[FROM.GetName]與[ROOT.GetName]共同防禦協定的建議。這一提議本來可以給我們兩國帶來穩定與安全，但是現在我們只能獨自面對世界了。"
 BBA_italy_anti_colonialism_events.15.a: "這是他們的損失！"
 BBA_italy_anti_colonialism_events.15.b: "非友即敵！"
 BBA_italy_anti_colonialism_events_war_will_continue_tt: "戰爭將會繼續。"
 BBA_italy_anti_colonialism_events.20.t: "[FROM.GetNameDefCap]譴責殖民主義"
 BBA_italy_anti_colonialism_events.20.desc: "新成立的[FROM.GetName]似乎產生了新的道德感和使命感，並開始承擔起摧毀其他所有殖民帝國的責任。一個意大利代表團要求我們摒棄我們的帝國主義行徑，擁抱一個合作而自由的未來，而非壓迫與征服。"
 BBA_italy_anti_colonialism_events.20.a: "是時候撥亂反正了！"
 BBA_italy_anti_colonialism_events.20.b: "[FROM.GetAdjective]這些傢伙瘋了嗎？！"
 BBA_italy_anti_colonialism_events.21.t: "非洲去殖民化"
 BBA_italy_anti_colonialism_events.21.desc: "[GetDecolonizationEventDesc]"
 BBA_italy_anti_colonialism_events.21.desc_accepted: "當我們譴責殖民主義並投身於瓦解非洲舊殖民帝國的事業時，我們並不確定具體該怎麼做。考慮到現有的舊殖民帝國會堅定地抱殘守缺，堅持他們一貫所相信的舊事物，我們必須將每一次努力視為巨大的成功。哪怕是解放一個小小的國家也是偉大的成就！"
 BBA_italy_anti_colonialism_events.21.desc_rejected: "我們關於非洲去殖民化以及為被殖民的人民帶來自由的努力看來並沒有被當回事。這些舊殖民列強明確地否認對於殖民地的所作所為並且拒絕聽從去殖民化的建議。他們必須為此負責！"
 BBA_italy_anti_colonialism_events.21.a: "我們在這兒的任務告一段落了。"
 BBA_italy_anti_colonialism_events.21.b: "採取強硬手段！"
 BBA_italy_anti_colonialism_events.52.t: "北非公投加入[ROOT.GetNameDef]"
 BBA_italy_anti_colonialism_events.52.desc: "北非人民業已看到我們對他們家園的治理是如何的仁慈和高效，所以他們決定通過公投加入我們！如此看來，我們在他們地區的投資以及政策傾斜已經收到了回報。這將讓我們共同受益。"
 BBA_italy_anti_colonialism_events.52.a: "歡迎兄弟姐妹們！"
 BBA_italy_anti_colonialism_events.53.t: "北非公投脫離[ROOT.GetNameDef]"
 BBA_italy_anti_colonialism_events.53.desc: "雖然這一消息並不完全讓人吃驚，我們依然遺憾地得知，北非人民不再想成為我們統治下的一部分。他們在相當長的一段時間內覺得自己並沒有得到重視，以及感到被壓榨和利用，因此他們決定公投脫離我們的統治。"
 BBA_italy_anti_colonialism_events.53.a: "向他們道別。"
 BBA_italy_anti_colonialism_events.54.t: "東非公投加入[ROOT.GetNameDef]"
 BBA_italy_anti_colonialism_events.54.desc: "東部非洲人民業已看到我們對他們家園的治理是如何的仁慈和高效，所以他們決定通過公投加入我們！如此看來，我們在他們地區的投資以及政策傾斜已經收到了回報。這將讓我們共同受益。"
