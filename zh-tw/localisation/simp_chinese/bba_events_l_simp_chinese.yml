l_simp_chinese:
 #News events
 bba_news.0.t: "國際聯盟的終結"
 bba_news.0.desc: "隨著[?global.LoN_attacker_country.GetNameDef]向[?global.LoN_defender_country.GetNameDef]宣戰，國際聯盟爭取和平的嘗試終告失敗。[?global.LoN_attacker_country.GetLeader]公然嘲笑國際聯盟的無能為力，並宣佈[?global.LoN_attacker_country.GetHerHis]的國家退出國際聯盟。隨著各國領導人也開始相繼質疑國聯維和的能力，國際聯盟的時代事實上已經結束了。\n儘管會議照常召開，但是再也不會有人指望其能夠做成什麼事情了。國聯會議的一切權威已經蕩然無存。"
 bba_news.0.a: "並不完全出乎意料"
 #Italo-Ethiopian War events
 BBA_italo_ethiopian_war_events.01.t: "結束聖誕節攻勢"
 BBA_italo_ethiopian_war_events.01.desc: "我軍在阿比西尼亞戰場上停滯不前，個別地區甚至遭到了反攻。這場“聖誕節攻勢”使得墨索里尼怒斥最高軍事指揮部的無能。領袖想要的是成果，現在，立刻，馬上。\n\n鑑於如今態勢，墨索里尼授權軍方採取一切可能的手段以擊敗阿比西尼亞，必須迅速結束戰爭——不惜一切代價。"
 BBA_italo_ethiopian_war_events.01.a: "採取一切必要手段"
 BBA_italo_ethiopian_war_events.01.b: "我們需要步步為營、穩紮穩打。"
 BBA_italo_ethiopian_war_events.02.t: "意大利大舉進攻"
 BBA_italo_ethiopian_war_events.02.desc: "意大利人正試圖奪回戰爭的主動權。他們正在發動一場重大攻勢，企圖粉碎我們的防線並一擊擊潰[ROOT.GetAdjective]帝國。\n我們的部隊必須堅守並抵禦坦克和大炮的猛烈轟炸和襲擊足夠長的時間，這樣我們才有時間說服國際社會代表我們採取行動。"
 BBA_italo_ethiopian_war_events.02.a: "消滅侵略者！"
 BBA_italo_ethiopian_war_events.03.t: "意大利集結軍隊"
 BBA_italo_ethiopian_war_events.03.desc: "我們的攻勢雖然擊退了意大利人，但是並未達成預定戰術目標。我軍士兵已無力推進，而意大利人因我軍突襲而產生的恐慌卻在慢慢消退。\n情報表明，他們正在準備一場新的攻勢，且準備工作將比上次更加充分。我軍部隊必須轉入防禦。敵軍被拒之國門外越久，國際聯盟就越容易被說服和承認，這絕不是什麼微不足道的“殖民地衝突”，而是由一個成員國對另一個成員國發起的蠻不講理的入侵。"
 BBA_italo_ethiopian_war_events.03.a: "賭注正在增加"
 BBA_italo_ethiopian_war_events.10.t: "國際聯盟禁運決議"
 BBA_italo_ethiopian_war_events.10.desc: "國際聯盟理事會已決定對與[ITA.GetNameDef]的貿易實施全面禁運，以回應該國對[ETH.GetNameDef]的非法侵略。制裁包括可用於生產戰爭裝備的任何和所有資源。制裁將立即實施並持續，直到該國停止對[ETH.GetNameDef]的敵對行動。"
 BBA_italo_ethiopian_war_events.10.a: "這是正確的做法"
 BBA_italo_ethiopian_war_events.10.b: "我們不能拿我們的經濟冒險。"
 BBA_italo_ethiopian_war_events.10.c: "不行，[ITA.GetName]是我們的朋友。"
 leave_the_league_of_nations_tt: "§Y[ROOT.GetName]§!退出國際聯盟"
 BBA_italo_ethiopian_war_events.11.t: "國際聯盟要求關閉蘇伊士運河"
 BBA_italo_ethiopian_war_events.11.desc: "來自[ETH.GetName]的國際聯盟代表要求對[ITA.GetName]關閉蘇伊士運河以增加對[ITA.GetNameDef]的制裁。經過理事會長時間的辯論，理事會決定遵從這一要求。因此，由[ROOT.GetNameDef]需要負責阻止任何[ITA.GetAdjective]船隻通過運河。"
 BBA_italo_ethiopian_war_events.11.a: "這將削弱他們的戰爭實力"
 BBA_italo_ethiopian_war_events.11.b: "我們不會這麼做。"
 suez_blocked_sanctions_tt: "§Y[ITA.GetName]§!將被禁止使用蘇伊士運河。"
 BBA_italo_ethiopian_war_events.12.t: "[FROM.GetName]拒絕關閉蘇伊士運河"
 BBA_italo_ethiopian_war_events.12.desc: "[FROM.GetLeader]已通知國際聯盟理事會，[FROM.GetNameDef]不會對[ITA.GetName]關閉蘇伊士運河。這顯然違反了國際協議，當被敦促遵守協議時，[FROM.GetName]乾脆宣佈他們將退出國際聯盟。"
 BBA_italo_ethiopian_war_events.12.a: "你不能真正信任任何人，對吧？"
 BBA_italo_ethiopian_war_events.13.t: "[FROM.GetName]對[ITA.GetName]關閉蘇伊士運河"
 BBA_italo_ethiopian_war_events.13.desc: "根據國際聯盟的決議，[FROM.GetLeader]公開宣佈[ITA.GetAdjective]的船隻不再被允許通過蘇伊士運河。任何試圖通過運河的[ITA.GetAdjective]船隻都將被扣押，貨物將被沒收，直到[ITA.GetName]停止對[ETH.GetNameDef]的侵略。"
 BBA_italo_ethiopian_war_events.13.a: "這對他們是當頭一棒！"
 BBA_italo_ethiopian_war_events.14.t: "國際聯盟決議支持[ETH.GetName]"
 BBA_italo_ethiopian_war_events.14.desc: "國際聯盟理事會就[ETH.GetName]提出的對意大利軍事幹預的請求進行了辯論。最後，理事會並沒有呼籲進行全面干預，而是發表了一份聲明，建議成員國以任何可能的方式支持[ETH.GetName]，包括允許志願者在衝突中參與[ETH.GetName]的一方。"
 BBA_italo_ethiopian_war_events.14.a: "我們應該妥善安排"
 BBA_italo_ethiopian_war_events.14.b: "如果人們想去的話……"
 BBA_italo_ethiopian_war_events.14.c: "讓我們的公民死在別的國家毫無意義。"
 BBA_italo_ethiopian_war_events.14.d: "我們有自己的仗要打。"
 ETH_volunteers_leave_3000: "除了任何有組織的遠征外，3000名[ROOT.GetAdjective]公民加入[ETH.GetAdjective]部隊。"
 ETH_volunteers_leave_2000: "2000名[ROOT.GetAdjective]公民加入[ETH.GetAdjective]部隊。"
 ETH_volunteers_leave_200: "儘管有官方立場，仍有大約200名[ROOT.GetAdjective]公民加入[ETH.GetAdjective]部隊。"
 BBA_italo_ethiopian_war_events.15.t: "我們呼籲國際援助"
 BBA_italo_ethiopian_war_events.15.desc_a: "由於國際聯盟決定支持[ROOT.GetName]，志願者已經從世界各地趕來。這些志願者正在組建國際旅。希望他們的戰鬥能力跟他們的熱情一樣。"
 BBA_italo_ethiopian_war_events.15.desc_b: "即使在國際聯盟決議允許支持[ROOT.GetName]之後，前來幫助我們開展戰爭工作的志願者人數仍然很少。希望這些勇敢的自由戰士的戰鬥能力跟他們的熱情一樣。"
 BA_italo_ethiopian_war_events.15.desc_b: "不幸的是，國際聯盟不會同意派出軍隊來幫助我們。他們只是鼓勵成員國幫助我們，最終根本沒有得到任何大的支持。只有少數新志願者抵達。"
 BBA_italo_ethiopian_war_events.15.a: "好"
 BBA_italo_ethiopian_war_events.15.b: "太糟糕了。"
 BBA_italo_ethiopian_war_events.16.t: "援助在路上了？"
 BBA_italo_ethiopian_war_events.16.desc: "國際聯盟並沒有儘可能使用武力驅使[ITA.GetName]離開[ROOT.GetName]的打算。但是，他們還是鼓勵成員國動用力量去維持現狀。有跡象表明幾個國家正在組織遠征軍，其中就包括[FROM.GetName]。他們究竟是停留在口頭承諾還是真的會用實際行動來幫助我們，這一切還有待觀察。"
 BBA_italo_ethiopian_war_events.16.a: "我們等著瞧吧"
 BBA_italo_ethiopian_war_events.20.t: "[ETH.GetLeader]拒絕投降"
 BBA_italo_ethiopian_war_events.20.desc: "儘管[ETH.GetAdjective]已經停止抵抗，[ETH.GetLeader]仍不打算就此投降。有消息稱[ETH.GetLeader.GetSheHe]被允許在[?ETH.host_nation.GetNameDef]設立流亡政府。[?ETH.host_nation.GetAdjective]政府已經收到了正式抗議。"
 BBA_italo_ethiopian_war_events.20.a: "鬥爭仍在繼續"
 ITA_occupation_tt: "準確來說，[ITA.GetName]會繼續與[ETH.GetName]流亡政府進行戰爭，直到[ETH.GetName]從地圖上消失。"
 BBA_italo_ethiopian_war_events.100.t: "來自[FROM.GetNameDef]的請求"
 BBA_italo_ethiopian_war_events.100.desc: "[FROM.GetAdjective]大使帶著[FROM.GetLeader]的官方請求與我國政府進行了對話，他們希望當他們對抗[ITA.GetName]的戰爭形勢變得嚴峻時能在[ROOT.GetName]建立一個臨時流亡政府。但接受這個請求會肯定讓我們更難以和[ITA.GetName]保持良好關係。"
 BBA_italo_ethiopian_war_events.100.a: "這裡歡迎他們"
 BBA_italo_ethiopian_war_events.100.b: "我們不能容許這種事的發生。"
 BBA_italo_ethiopian_war_events.101.t: "[FROM.GetNameDefCap]同意接納我國政府"
 BBA_italo_ethiopian_war_events.101.desc: "[FROM.GetAdjective]政府已經熱情地同意了在必要時接納[ROOT.GetLeader]流亡政府的請求。"
 BBA_italo_ethiopian_war_events.101.a: "少了一個要擔心的問題"
 change_focus_to_from_tt: "當§Y[ROOT.GetNameDef]§!在§Y[FROM.GetNameDef]§!流亡時，添加新的可用國策。"
 BBA_italo_ethiopian_war_events.102.t: "[FROM.GetNameDefCap]拒絕了[ROOT.GetAdjective]的請求"
 BBA_italo_ethiopian_war_events.102.desc: "非常不幸，[FROM.GetAdjective]政府不敢招惹[ITA.GetLeader]。我們在[ETH.GetName]戰敗時在他們那兒建立臨時政府的請求被拒絕了。"
 BBA_italo_ethiopian_war_events.102.a: "我們該去別的地方碰碰運氣了"
 BBA_italo_ethiopian_war_events.110.t: "國聯要求和平"
 BBA_italo_ethiopian_war_events.110.desc: "國際聯盟已經要求[ROOT.GetName]和[FROM.GetName]立即終止敵對狀態。如果我們拒絕服從，國聯理事會將給予各成員國向[ROOT.GetDameDef]宣戰的權利。"
 BBA_italo_ethiopian_war_events.110.a: "我們必須接受，至少是現在"
 BBA_italo_ethiopian_war_events.110.b: "他們可什麼都不敢做。"
 BBA_italo_ethiopian_war_events.111.t: "[FROM.GetLeader]同意停戰"
 BBA_italo_ethiopian_war_events.111.desc: "在國際聯盟委員會通過決議後，[FROM.GetLeader]領導的[FROM.GetAdjective]政府終於清醒了點。國際聯盟頒佈的停火協議恢復了戰前國界。不幸的是，這份協議不包括任何為對[ROOT.GetName]造成的額外損失的賠償，但至少這給了我們重建國家的時間。"
 BBA_italo_ethiopian_war_events.111.a: "某種意義上的勝利"
 BBA_italo_ethiopian_war_events.112.t: "[FROM.GetName]藐視國際聯盟"
 BBA_italo_ethiopian_war_events.112.desc: "儘管受到國聯理事會的成員的戰爭威脅，[FRON.GetLeader]仍然意圖摧毀[ROOT.GetName]。理事會已經要求[FROM.GetName]立即終止與[ROOT.GetName]的敵對狀態，但[FROM.GetName]十分囂張，拒絕服從。"
 BBA_italo_ethiopian_war_events_wargoal_tt: "國際聯盟中的主要國家獲得對[ROOT.GetName]的戰爭目標"
 BBA_italo_ethiopian_war_events.112.a: "我們會更加奮勇抵抗"
 BBA_italo_ethiopian_war_events.113.t: "[FROM.GetName]拒絕服從國際聯盟決議"
 BBA_italo_ethiopian_war_events.113.desc: "國聯要求[FROM.GetNameDef]立刻停止對他們[ETH.GetName]的侵略行為。然而[FROM.GetLeader]表達了藐視並拒絕服從。這是對國際秩序的公然破壞。國聯理事會呼籲對[FROM.GetNameDef]採取國家行動。"
 BBA_italo_ethiopian_war_events.113.a: "如果他們只能聽懂武力的話"
 BBA_italo_ethiopian_war_events.113.b: "我們不能讓國聯左右我們的外交政策"
 BBA_italo_ethiopian_war_events.120.t: "在[FROM.GetName]的潰敗"
 BBA_italo_ethiopian_war_events.120.desc: "在[FROM.GetName]的戰爭並沒像預料中的那樣進行。我們引以為豪的祖國正在迅速淪為歐洲的笑柄。[ROOT.GetCapitalVictoryPointName]的人們正變得焦躁不安。革命可能已經迫在眉睫。現在[FROM.GetLeader]向我們提出了一份和平提議。"
 BBA_italo_ethiopian_war_events.120.a: "我們應該關注於一些更容易的事情"
 ETH_peace_treaty_tt: "\n§Y和平條約條款§!\n"
 ETH_peace_treaty_part_2_tt: "[ETH.GetFlag][ETH.GetName]："
 BBA_italo_ethiopian_war_events.120.b: "我們還能贏！"
 BBA_italo_ethiopian_war_events.121.t: "勝利了！"
 BBA_italo_ethiopian_war_events.121.desc: "一場漫長而艱苦的戰爭終於結束了。[FROM.GetLeader]接受了我們的要求並叫停了對[ROOT.GetName]的侵略。[ROOT.GetLeader]是這個時代的英雄。[ROOT.GetLeader.GetSheHeCap]領導下的[ROOT.GetNameDef]平穩地渡過了困難時期，併成功擊退了歐洲的殖民主義勢力。"
 BBA_italo_ethiopian_war_events.121.a: "這標誌著一個屬於非洲的全新開始"
 ETH_gets_the_following_states_tt: "[ETH.GetNameDefCap]將獲得下列地區："
 BBA_italo_ethiopian_war_events.122.t: "[FROM.GetLeader]頑固地拒絕了"
 BBA_italo_ethiopian_war_events.122.desc: "[ROOT.GetAdjective]在戰爭中贏得了勝利。儘管[FROM.GetAdjective]的領導者拒絕承認戰敗，但[ROOT.GetLeader]已經向全世界證明了一個非洲國家可以抵禦歐洲的侵略者，這本身就已經是一場勝利。現在，我們要將他們徹底擊垮。"
 BBA_italo_ethiopian_war_events.122.a: "戰爭進入了一個新階段"
 ethiopia_recognized_flag: "埃塞俄比亞可以召喚盟友加入戰爭"
 BBA_italo_ethiopian_war_events.200.t: "國際聲譽提升"
 BBA_italo_ethiopian_war_events.200.desc: "公眾一直都對[ROOT.GetName]的局勢十分同情。然而，沒有人真正相信這個國家能堅持一個月以上。我們對[ITA.GetAdjective]侵略者的頑強抵抗正在贏得全世界人民的心，各國領導人都開始對[ROOT.GetName]重視起來。"
 BBA_italo_ethiopian_war_events.200.a: "要是他們不是隻說不做就好了"
 BBA_italo_ethiopian_war_events.201.t: "部隊士氣提升"
 BBA_italo_ethiopian_war_events.201.desc: "經過漫長的堅持，我們排除了萬難，基層士兵的士氣開始重新高漲。最初，當參戰熱情消退時，許多人認為失敗已不可避免，但是現在，軍中再次開始討論勝利的可能。也有明顯的跡象表明部隊正在適應新的作戰方式。"
 BBA_italo_ethiopian_war_events.201.a: "我們必須在此基礎上把敵人趕出[ROOT.GetName]"
 ETH_morale_boost_tt: "§Y[GetEthiopianArmySpiritName]§!追加效果：\n$MODIFIERS_ARMY_DEFENCE_FACTOR$：§G+10%§!\n$MODIFIER_ARMY_ORG_FACTOR$：§G+5%§!"
 BBA_italo_ethiopian_war_events.202.t: "敵軍逃兵"
 BBA_italo_ethiopian_war_events.202.desc: "起初，像細流一樣，一些敵軍非正規部隊的信心開始動搖，其中一些士兵向我方投誠。現在，敵軍士兵正在集體逃竄，而且不僅僅是非正規部隊。一些逃兵甚至帶來了他們的重型裝備。"
 BBA_italo_ethiopian_war_events.202.a: "狂瀾既轉"
 BBA_italo_ethiopian_war_events.203.t: "歷萬艱而終得新生"
 BBA_italo_ethiopian_war_events.203.desc: "那些所謂的專家甚至在開戰時就斷定我們撐不過一個月。但是我們堅持抵抗所謂“現代陸軍”的時間已經遠超他們的預期。我們已經知曉並適應了敵人的作戰方式。人民心中的鬥志已被重新燃起，來自四面八方響應動員的人們緊緊地團結在旗幟之下。"
 BBA_italo_ethiopian_war_events.203.a: "我們要把入侵者趕下海！"
 ETH_for_the_duration_of_the_war_tt: "戰爭期間："
 BBA_italo_ethiopian_war_events.204.t: "人民戰爭"
 BBA_italo_ethiopian_war_events.204.desc: "我國的人民，不論身處何處，都參與到了抵抗侵略者的行動中來。老人和小孩們一起參與抵抗運動，迫使[ITA.GetName]為取得戰果付出更艱難的努力。而無法參與戰鬥的當地居民也在為我們的軍隊製造武器和裝備。"
 BBA_italo_ethiopian_war_events.204.a: "勝利近在眼前"
 BBA_italo_ethiopian_war_events.300.t: "意大利公眾擔憂"
 BBA_italo_ethiopian_war_events.300.desc: "我們的軍隊難以在[ETH.GetName]取得任何進展，戰局膠著即使在[ITA.GetName]國內也能感受得到。[ITA.GetAdjective]人開始失去繼續作戰的信念，甚至質疑我們領導層是否擁有確保最終勝利的能力。"
 BBA_italo_ethiopian_war_events.300.a: "他們真是缺乏信念！"
 BBA_italo_ethiopian_war_events.301.t: "非洲軍團心灰意冷"
 BBA_italo_ethiopian_war_events.301.desc: "我們在[ETH.GetName]的軍隊付出了巨大傷亡卻幾乎沒有取得任何進展。抵抗十分激烈，我們不得不為每一寸獲得的土地艱難戰鬥。全軍士氣空前低下，我們甚至收到了一些連隊拒絕執行上級命令的報告。"
 BBA_italo_ethiopian_war_events.301.a: "我們必須扭轉戰局！"
 BBA_italo_ethiopian_war_events.302.t: "殖民地動盪"
 BBA_italo_ethiopian_war_events.302.desc: "我們在[ETH.GetName]的苦戰在其他地方產生了連鎖反應：殖民地報告稱我們的屬民已經開始在大小事務上違背地方當局。他們顯然將我們在戰爭中的一事無成視為一個弱點，並正在試探我們的實力。"
 BBA_italo_ethiopian_war_events.302.a: "令人不安的消息！"
 ITA_colonial_unrest_tt: "殖民地動盪：§R+15%§!"
 BBA_italo_ethiopian_war_events.303.t: "意大利公眾質疑戰爭成果"
 BBA_italo_ethiopian_war_events.303.desc: "在[ETH.GetAdjevtive]的慘敗已經使[ITA.GetAdjective]人開始反對這場戰爭。越來越多的人公開批評我們的政府和領導層，甚至還有大量尋求政府更替的傳言。"
 BBA_italo_ethiopian_war_events.303.a: "叛徒！"
 BBA_italo_ethiopian_war_events.304.t: "大規模逃兵"
 BBA_italo_ethiopian_war_events.304.desc: "[ETH.GetName]的局勢十分糟糕，我軍士氣也正隨之一落千丈！我軍被牽制在數個位置，並出現了大量逃兵。即使沒有[ETH.GetAdjective]人作祟，我們的兵力也在不斷減少！我們甚至收到了一份軍官遭卡車碾壓的報告。但當然，我們只能將其標記為事故。"
 BBA_italo_ethiopian_war_events.304.a: "全是懦夫！"
 ITA_desertions_east_africa_tt: "東非的軍隊遭到了背棄。"
 BBA_italo_ethiopian_war_events.305.t: "殖民地騷亂"
 BBA_italo_ethiopian_war_events.305.desc: "殖民地的不服從運動如今已近乎升級為全面叛亂！我們在處理[ETH.GetName]殖民地衝突上的失敗已經向當地民眾證明了現任政府的無能，而一旦擺脫了我們的統治，民眾們將會過得更好。"
 BBA_italo_ethiopian_war_events.305.a: "真是無恥！"
 ITA_colonial_uproar_tt: "大規模殖民地騷亂：§R+80%§!"
 BBA_italo_ethiopian_war_events.400.t: "是時候處理[AFA.GetNameDef]了"
 BBA_italo_ethiopian_war_events.400.desc: "[AFA.GetNameDef]的蘇丹[AFA.GetLeader]已長期處於[ROOT.GetAdjective]的強烈影響之下，就像上次對埃戰爭一樣，名義上仍隸屬於[ETH.GetAdjective]帝國的他一直保持中立。實際上，這位蘇丹如今仍能掌權也只是因為[ROOT.GetAdjective]的善意。雖然該國沿海地區已被出賣給了[ROOT.GetName]，但其仍是我們征服大業的一個障礙，我軍對[?ITA.ITA_capture_state.GetName]的佔領或許足以說服蘇丹拱手讓出其剩餘國土。"
 BBA_italo_ethiopian_war_events.400.a: "發出最後通牒，要求完全臣服"
 BBA_italo_ethiopian_war_events.400.b: "現在還不是處理[AFA.GetNameDef]的時候"
 BBA_italo_ethiopian_war_events.401.t: "來自於[FROM.GetName]的最後通牒"
 BBA_italo_ethiopian_war_events.401.desc: "意大利人要求我們將整個國家都置於他們的控制之下，以便於他們的部隊通過並和[ETH.GetName]作戰。接受將意味著[ROOT.GetNAme]的亡國，但是拒絕自然意味著意大利人的入侵。"
 BBA_italo_ethiopian_war_events.401.a: "易幟而降"
 BBA_italo_ethiopian_war_events.401.b: "如果他們覬覦我們的土地，那麼不得不付諸武力奪取。"
 BBA_italo_ethiopian_war_events.402.t: "[FROM.GetLeader]屈服了"
 BBA_italo_ethiopian_war_events.402.desc: "[FROM.GetNameDefCap]同意了我們的要求，允許我們在[FROM.GetAdjective]的領土上開展一系列對抗[ETH.GetName]的行動。這樣[FROM.GetName]的獨立進程也能有效地被遏制。"
 BBA_italo_ethiopian_war_events.402.a: "很好，向前挺進"
 BBA_italo_ethiopian_war_events.403.t: "[FROM.GetNameDefCap]仍在負隅頑抗"
 BBA_italo_ethiopian_war_events.403.desc: "不幸的是，外交壓力還不足以確保意大利成為[FROM.GetNameDef]的宗主。[FROM.GetLeader]固執地認為他的國家可以抵抗[ROOT.GetName]的軍事力量。"
 BBA_italo_ethiopian_war_events.403.a: "是時候來點強硬的手段了"
 BBA_italo_ethiopian_war_events.500.t: "和平的代價"
 BBA_italo_ethiopian_war_events.500.desc: "[GetItaloEthiopianPeaceDemands]"
 BBA_italo_ethiopian_war_events.500.desc_guarantees: "[FROM.GetAdjective]要求如果我們想要他們幫忙對付德國人，我們就得和[ETH.GetName]談和。如果我們和埃塞俄比亞人簽訂條約，我們必須同意讓出一部分我們已經征服的土地，然後保留其餘的。這種和平當然對我們兩國都是一顆苦果，但我們可能會在面對德國人時認識到它的價值。"
 BBA_italo_ethiopian_war_events.500.desc_territories: "為了向我們提供一些他們的殖民地，英國人希望我們結束和埃塞俄比亞人的戰爭。如果我們和他們簽訂條約，我們必須同意讓出一部分我們已經征服的土地，然後保留其餘的。考慮到我們付出的鮮血、汗水和淚水，這種和平對我們兩國當然是一顆苦果。"
 BBA_italo_ethiopian_war_events.500.a: "確實是苦澀的和平"
 BBA_italo_ethiopian_war_events.500.b: "我們需要他們的支持。"
 BBA_italo_ethiopian_war_events.500.c: "我們打得太辛苦了!"
 BBA_italo_ethiopian_war_events.500_tt: "戰爭仍在繼續"
 BBA_italo_ethiopian_war_events.501.t: "被迫和談"
 BBA_italo_ethiopian_war_events.501.desc: "在我們的國家被[ITA.GetNameDefCap]侵佔之後，我們如今所在的國家慷慨地接納了我們，給了我們棲身之地。不過看樣子，他們的耐心也到達了極限。他們在背地裡幹著陰暗齟齬的勾當，想強迫我們和那些無恥的意大利入侵者簽訂所謂的平等條約。但可悲的是，我們根本沒有選擇。"
 BBA_italo_ethiopian_war_events.501.a: "我們別無選擇"
 BBA_italo_ethiopian_war_events.501.b: "我們將戰鬥到底！"
 BBA_ethiopia_is_expelled_tt: "§Y[ETH.GetNameWithFlag]§!政府被§Y[ENG.GetNameWithFlag]§!驅逐，可以在其他地方設立流亡政府。"
 BBA_italo_ethiopian_war_events.502.t: "拒絕和談"
 BBA_italo_ethiopian_war_events.502.desc: "[GetItalyRefusesPeaceTalks]"
 BBA_italo_ethiopian_war_events.502.desc_guarantees: "意大利政府希望尋求我們的幫助一同對抗德國。同時我們也提出了交換條件，那就是他們必須和[ETH.GetNameDefCap]達成和平，但他們拒絕了。那遺憾的是他們只能獨自面對德國人的進攻了。"
 BBA_italo_ethiopian_war_events.502.desc_territories: "意大利政府想要獲得一些我們的殖民地。作為交換，我們也提出了條件，那就是他們必須和[ETH.GetNameDefCap]達成和平，但他們拒絕了。確實，和這群惡棍是談不成買賣的！"
 BBA_italo_ethiopian_war_events.502.a: "真是可恥"
 BBA_italo_ethiopian_war_events.503.t: "[ETH.GetNameDefCap]拒絕和談"
 BBA_italo_ethiopian_war_events.503.desc: "埃塞俄比亞政府拒絕了英國提出的與我們簽訂和平條約的要求。[ENG.GetLeader]因此將埃塞俄比亞人驅逐出[ENG.GetNameDef]，向所有人表明了他們更看重與哪個國家的合作。這給了我們進一步鞏固非洲資產的機會！"
 BBA_italo_ethiopian_war_events.503.a: "我們會征服他們的"
 BBA_italo_ethiopian_war_events.510.t: "[ITA.GetNameDef]對埃塞俄比亞實行權力顛覆"
 BBA_italo_ethiopian_war_events.510.desc: "我們收到陸陸續續的報告表明意大利人在我們的大後方傳播不實言論，意在削弱我們的統治力和詆譭我們的正統性。這些惡毒的謊言可能會影響到我們的屬民，讓他們轉而投身[ITA.GetNameDef]一邊，王位的所有權更會遭到質疑。在他們造成進一步危害之前，恢復對埃塞俄比亞的絕對統治勢在必行。"
 BBA_italo_ethiopian_war_events.510.a: "他們會為謊言付出代價！"
 #Ethiopia - Balance of Power
 BBA_ethiopia_balance_of_power_events.01.t: "統治遭受挑戰"
 BBA_ethiopia_balance_of_power_events.01.desc_fascism: "[THIS.GetName]的分裂態勢愈加嚴峻，名義上的執政內閣缺乏強有力的支持，局部的動盪從而演變成了針對中央政府的大範圍叛亂。$haile_selassie_gugsa$的支持者也已經整裝待發，意在把他捧上[THIS.GetAdjective]的至高王座。"
 BBA_ethiopia_balance_of_power_events.01.desc_neutrality: "[THIS.GetName]的分裂態勢愈加嚴峻，名義上的執政內閣缺乏強有力的支持，局部的動盪從而演變成了針對中央政府的大範圍叛亂。"
 BBA_ethiopia_balance_of_power_events.01.desc_communism: "[THIS.GetName]的分裂態勢愈加嚴峻，名義上的執政內閣缺乏強有力的支持，局部的動盪從而演變成了針對中央政府的大範圍叛亂。安那其主義者揚言他們會從如今的政府手中解救這個千瘡百孔的國家。"
 BBA_ethiopia_balance_of_power_events.01.a: "我們會擊敗他們的"
 BBA_ethiopia_balance_of_power_events.01.b: "讓篡權者無法得逞。"
 BBA_ethiopia_balance_of_power_events.01.c: "消滅階級叛徒"
 ETH_alternate_fascist_party: "哈亞莫特信眾"
 ETH_alternate_fascist_party_long: "$ETH_hailu_tekle_haymanot$的支持者"
 ETH_alternate_neutrality_party: "塞拉西信眾"
 ETH_alternate_neutrality_party_long: "$ETH_haile_selassie$的支持者"
 BBA_ethiopia_balance_of_power_events.10.t: "[ROOT.GetName]分崩離析"
 BBA_ethiopia_balance_of_power_events.10.desc: "[THIS.GetNameDef]逐漸推進的地方分權，已經如預期一般導致中央政府失去了大量的威信。部分區域甚至宣佈從[THIS.GetNameDef]獨立。如果我們想要重新控制這些區域，就必須雷厲風行地採取行動。"
 BBA_ethiopia_balance_of_power_events.10.a: "我想，我們再也沒什麼事能做了"
 BBA_ethiopia_balance_of_power_events.10.b: "消滅他們。"
 ETH_breakup_tt: "§R從[ROOT.GetName]的殖民中獲得獨立§!"
 ETH_breakup_fight_tt: "§R從[ROOT.GetName]和[ROOT.GetName]的殖民中獲得獨立，並向他們宣戰。§!"
 #BBA_ethiopia_balance_of_power_events.20.t: "Education Reforms"
 #BBA_ethiopia_balance_of_power_events.20.desc: "As we begin to reform [ETH.GetNameDefCap], the issue of the education system has come to the forefront. Making sure the next generation are able to join the workforce is of course our priority. However, we have an opportunity to nudge that generation in a more acceptable moral direction."
 #BBA_ethiopia_balance_of_power_events.20.a: "Implementing [ETH.GetLeader]’s plans are their only concern."
 #BBA_ethiopia_balance_of_power_events.20.b: "Religion is the opiate of the masses."
 #BBA_ethiopia_balance_of_power_events.21.t: "[ETH.GetAdjective] Road Improvements"
 #BBA_ethiopia_balance_of_power_events.21.desc: "[ETH.GetNameDefCap]’s road network remains limited and hinders the economic development of the country. We now have the budget to implement improvements to the road network, but there is a split over whether we should prioritize expanding the existing network to the benefit of people in their local area, or create highways around the capital to concentrate economic development."
 #BBA_ethiopia_balance_of_power_events.21.a: "Prioritize local road expansion in the regions."
 #BBA_ethiopia_balance_of_power_events.21.b: "We need to concentrate economic development."
 BBA_ethiopia_balance_of_power_events.22.t: "軍官改革"
 BBA_ethiopia_balance_of_power_events.22.desc: "近期的實戰經歷透露出的是，我們多數的軍官對於現代戰爭根本一竅不通。造成這種情況的主要原因是，長久以來軍銜的高低往往和世襲的爵位和政治頭銜掛鉤，而不是個人能力。如今，在[ETH.GetNameDef]大刀闊斧的改革熱潮下，有必要對未來的軍級制度做出規劃。"
 BBA_ethiopia_balance_of_power_events.22.a: "這些流民不過是群無頭蒼蠅"
 BBA_ethiopia_balance_of_power_events.22.b: "選賢予能是軍隊必不可少的屬性"
 BBA_ethiopia_balance_of_power_events.23.t: "標準化教育改革"
 BBA_ethiopia_balance_of_power_events.23.desc: "最近的一連串教育改革可謂是非常成功。這些年輕人不僅更加忠於[ETH.GetLeader]，而且他們還向父輩們灌輸絕對服從的理念。"
 BBA_ethiopia_balance_of_power_events.23.a: "政權正在日益穩固"
 BBA_ethiopia_balance_of_power_events.24.t: "教育改革"
 BBA_ethiopia_balance_of_power_events.24.desc: "最近的一連串教育改革可謂是非常成功。隨著越來越多的年輕人們要求給予他們一個合法的地位認可，[ETH.GetNameDef]陳舊的等級制度觀念也開始遭到質疑。儘管這一連串事件導致了新老兩代人之間的矛盾衝突，但似乎輿論還是會站在我們這邊。"
 BBA_ethiopia_balance_of_power_events.24.a: "時間會證明我們的正確"
 BBA_ethiopia_balance_of_power_events.25.t: "政治軍官"
 BBA_ethiopia_balance_of_power_events.25.desc: "隨著我們對[ETH.GetName]的政治和經濟層面的控制愈發牢固，對軍隊的焦慮不可避免地日益增長。如果軍隊倒戈，我們甚至沒有一丁點機會抵抗他們。因此我們已開始將政治幹部塞入軍隊，以確保軍隊不會有什麼未經批准的想法。"
 BBA_ethiopia_balance_of_power_events.25.a: "這僅僅是為了他們自己的利益"
 BBA_ethiopia_balance_of_power_events.26.t: "唯才是舉的軍隊"
 BBA_ethiopia_balance_of_power_events.26.desc: "最近的經驗證明，我們的很多軍官沒有應對現代戰爭的能力。我們的軍官選拔制度依賴於政治頭銜和世襲的軍權而不是有關人員的能力，正是這種不合理的授銜制度造成了這些缺陷。隨著最近[ETH.GetName]的改革逐漸深入，我們應當確立恰當的以能力選拔軍隊領導的制度。"
 BBA_ethiopia_balance_of_power_events.26.a: "選賢予能是軍隊必不可少的屬性"
 BBA_ethiopia_balance_of_power_events.30.t: "$ETH_balcho_safo$歸來"
 BBA_ethiopia_balance_of_power_events.30.desc: "前錫達莫省長，曾經的[FROM.GetAdjective]德賈茲馬齊（武裝部隊中軍指揮官）接受了[FROM.GetLeader]的號召，拿起武器再一次為他的祖國而戰。和這位阿杜瓦的英雄一同歸來的還有他從個人領地徵募的軍隊。但願這能幫助我們抵抗[ITA.GetAdjective]入侵。"
 BBA_ethiopia_balance_of_power_events.30.a: "真英雄歸來"
 BBA_ethiopia_balance_of_power_events.51.t: "當地領主可提供僱傭軍"
 BBA_ethiopia_balance_of_power_events.51.desc: "一位[?ROOT.ETH_bop_state.GetName]的當地領主提出要組建一支僱傭軍加入帝國軍隊。這支軍隊將從當地強盜和外國志願者中徵募，因此他們將裝備齊全並可隨時投入戰鬥。當然，這要承擔權力被稀釋的風險，但擁有更多部隊顯然會提高我們在戰爭中的勝算。"
 BBA_ethiopia_balance_of_power_events.51.a: "這個國家需要任何她能得到的幫助"
 BBA_ethiopia_balance_of_power_events.51.b: "我們需要減少私軍的數量，而不是增加它們"
 BBA_ethiopia_balance_of_power_events.52.t: "王公希望擴大領地"
 BBA_ethiopia_balance_of_power_events.52.desc: "一位[?ROOT.ETH_bop_state.GetName]的當地領主正計劃著鞏固權力基石並擴大領地。他對當地生產能力進行了大量投資，因此在某種程度上這對整個國家有利，但這也意味著中央政府對[?ROOT.ETH_bop_state.GetName]的控制會被削弱。"
 BBA_ethiopia_balance_of_power_events.52.a: "那真是太棒了"
 BBA_ethiopia_balance_of_power_events.52.b: "我們得阻止他。"
 BBA_ethiopia_balance_of_power_events.53.t: "地區統治者希望生產軍備"
 BBA_ethiopia_balance_of_power_events.53.desc: "一位[?ROOT.ETH_bop_state.GetName]的領主希望在[?ROOT.ETH_bop_state.GetName]建立步槍與彈藥生產線。這將幫助我們的部隊獲得更優良的裝備，從而提升[ROOT.GetAdjective]軍隊戰鬥力。"
 BBA_ethiopia_balance_of_power_events.53.a: "和中央權力相比更多的步槍更重要"
 BBA_ethiopia_balance_of_power_events.53.b: "私人生產軍火聽起來也太危險了。"
 BBA_ethiopia_balance_of_power_events.54.t: "[?ROOT.ETH_bop_state.GetName]補給不足"
 BBA_ethiopia_balance_of_power_events.54.desc: "最近的一連串遭遇導致了物資供應短缺。為了解決當下的境況，[?ROOT.ETH_bop_state.GetName]的人民殷切的尋求中央政府的幫助，因為現在真的到了“火燒眉毛”的時候了。"
 BBA_ethiopia_balance_of_power_events.54.a: "我們需要做點什麼"
 ETH_investments_in_state_tt: "\n§Y$ETH_state_development_dynamic_modifier$§!追加效果：\n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$：§G+5%§!\n$MODIFIER_LOCAL_BUILDING_SLOTS$：§G+5%§!"
 BBA_ethiopia_balance_of_power_events.54.b: "不幸的是，我們目前能做的事有限。"
 ETH_decline_in_state_tt: "\n§Y$ETH_state_development_dynamic_modifier$§!追加效果：\n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$：§R-5%§!\n$MODIFIER_LOCAL_BUILDING_SLOTS$：§R-5%§!"
 BBA_ethiopia_balance_of_power_events.54.c: "在[?ROOT.ETH_bop_state.GetName]的地方官員會處理這些問題的。"
 BBA_ethiopia_balance_of_power_events.55.t: "地方民眾控訴受到不公待遇"
 BBA_ethiopia_balance_of_power_events.55.desc: "近期已經發生好幾起針對[?ROOT.ETH_bop_state.GetName]地方當局的控訴，當地民眾覺得他們受到了貴族們的不公待遇。對此事的初步調查證明，他們的申訴至少有一定程度上的合理性。不過，倘若中央政府貿然插手，也定會招致其他貴族反感。"
 BBA_ethiopia_balance_of_power_events.55.a: "我們應當以身作則"
 BBA_ethiopia_balance_of_power_events.55.b: "中央政府不應該插手地方事務"
 BBA_ethiopia_balance_of_power_events.56.t: "經濟在[?ROOT.ETH_bop_state.GetName]得到發展"
 BBA_ethiopia_balance_of_power_events.56.desc: "中央政府的一攬子計劃極大地改善了[ROOT.GetName]的管理機制；多片區域的高效整合促使了[?ROOT.ETH_bop_state.GetName]的經濟迅猛發展。現在這裡吸引了來自全國各地的國民，工業規模進一步擴大。"
 BBA_ethiopia_balance_of_power_events.56.a: "抓住機會、收緊權力"
 BBA_ethiopia_balance_of_power_events.56.b: "我們現在要做的是：為了該地區的繁榮加大投入。"
 #Imperial Ethiopia
 BBA_ethiopia_exile_events.01.t: "[FROM.GetLeader]準備好奪回[FROM.GetName]了"
 BBA_ethiopia_exile_events.01.desc: "[FROM.GetLeader]——[FROM.GetAdjective]的流亡領袖。早已蓄勢待發，意在發動一場大規模戰役來奪回[FROM.GetLeader.GetHerHis]的國家。民眾對於此舉更是無不拍手叫好，所以此時不做，更待何時。"
 BBA_ethiopia_exile_events.01.a: "[FROM.GetName]的事情就是我們的事情"
 ETH_can_call_allies_tt: "§Y[ETH.GetNameWithFlag]§!可以召集盟友參戰。"
 BBA_ethiopia_exile_events.02.t: "[ETH.GetName]北部的抵抗活動加劇"
 BBA_ethiopia_exile_events.02.desc: "雖然[ETH.GetLeader]已經逃往國外，但他仍舊慫恿支持者們襲擾大獲全勝的[ROOT.GetAdjective]軍隊。他的一系列講話更加劇了[ETH.GetName]中北部地區的抵抗活動。"
 BBA_ethiopia_exile_events.02.a: "我們必須保持警惕"
 BBA_ethiopia_exile_events.03.t: "在[ETH.GetName]南部發現共產主義游擊隊"
 BBA_ethiopia_exile_events.03.desc: "近期的報告顯示，發生了多起意在針對[ETH.GetName]南部的[ROOT.GetAdjective]部隊的襲擊。一個成員自稱“黑獅會”的組織被認為是這些襲擊的策劃者。"
 BBA_ethiopia_exile_events.03.a: "這群暴民！"
 BBA_ethiopia_exile_events.04.t: "召回$RAJ_orde_wingate$"
 BBA_ethiopia_exile_events.04.desc: "[ENG.GetNameDefCap]決定召回$RAJ_orde_wingate$。他們聲稱此舉是為了讓他建立一支新的部隊來幫助[ETH.GetName]。有跡象表明留給$RAJ_orde_wingate$的時間有限，且當該行動完成後他將被允許回到這裡。"
 BBA_ethiopia_exile_events.04.a: "希望他們搞快點"
 BBA_ethiopia_exile_events.05.t: "$RAJ_orde_wingate$被調往緬甸"
 BBA_ethiopia_exile_events.05.desc: "[ENG.GetAdjective]政府通知我們，$RAJ_orde_wingate$將立即被調往緬甸以執行籌建新部隊的任務。"
 BBA_ethiopia_exile_events.05.a: "這可太糟了"
 BBA_ethiopia_exile_events.06.t: "[FROM.GetName]索取[550.GetName]地區的宗主權"
 BBA_ethiopia_exile_events.06.desc: "[FROM.GetLeader]要求在我們佔領了[550.Owner.GetNameDef]的[550.GetName]地區後將該地宗主權移交給[FROM.GetName]。由於該地一直由[ETH.GetAdjective]控制，因此[FROM.GetName]的宣稱確實擁有歷史優先權。同時，[FROM.GetLeader]認為哈貝莎人民理應團結在一個領導人之下，而且自從[ITA.GetAdjective]佔領[550.GetName]以來，[FROM.GetNameDef]就不再擁有過出海口。"
 BBA_ethiopia_exile_events.06.a: "合理"
 BBA_ethiopia_exile_events.06.b: "現階段我們無法同意這項請求。"
 BBA_ethiopia_exile_events.07.t: "[FROM.GetNameDefCap]接受了我們的請求"
 BBA_ethiopia_exile_events.07.desc: "[FROM.GetAdjective]政府認為我們對所有哈貝莎領地的宣稱正當合法，並同意我們對[550.GetName]行使宗主權的要求。"
 BBA_ethiopia_exile_events.07.a: "好消息"
 BBA_ethiopia_exile_events.08.t: "[FROM.GetAdjective]政府拒絕了我們"
 BBA_ethiopia_exile_events.08.desc: "[FROM.GetAdjective]政府全然不顧我們對[550.GetName]地區擁有的合法宣稱，拒絕做出任何支持[ROOT.GetAdjective]宣稱的承諾或聲明。只有時間能證明他們最終會不會讓我們接管海岸線。"
 BBA_ethiopia_exile_events.08.a: "等我們贏下戰爭就不用等時間來證明了"
 BBA_ethiopia_exile_events.10.t: "[FROM.GetName]索取所有索馬裡地區的宗主權"
 BBA_ethiopia_exile_events.10.desc: "[FROM.GetLeader]在臨時官邸會見了[ROOT.GetAdjective]外交部長，提出[FROM.GetName]應獲得所有索馬裡地區的宗主權，因為埃塞俄比亞擁有大量的索馬里人口，而這些人口帶來的邊界糾紛將會是衝突的導火索。據[FROM.GetLeader]所說，將這些領土全部交給[FROM.GetNameDef]便會消除這些衝突隱患。"
 BBA_ethiopia_exile_events.10.a: "那樣確實會給為我們一個強力的盟友"
 BBA_ethiopia_exile_events.10.b: "他們可以獲得敵國的領土。"
 BBA_ethiopia_exile_events.10.c: "這些需求有點過分了。"
 BBA_ethiopia_exile_events.11.t: "索馬裡是我們的！"
 BBA_ethiopia_exile_events.11.desc: "[FROM.GetAdjective]政府同意將所有索馬裡地區控制權交給我們。這意味著[ROOT.GetName]很可能將在戰爭結束後控制非洲之角的大部分地區。"
 BBA_ethiopia_exile_events.11.a: "真是個好消息！"
 BBA_ethiopia_exile_events.12.t: "部分成功"
 BBA_ethiopia_exile_events.12.desc: "[FROM.GetAdjective]人告訴我們，我們可以獲得部分索馬裡土地。更確切地說，是我們和他們從敵國獲得的土地。他們拒絕將他們目前認為的帝國領土交給我們。"
 BBA_ethiopia_exile_events.12.a: "把別人的土地送出去來得更簡單些，不是嗎？"
 BBA_ethiopia_exile_events.13.t: "不走運"
 BBA_ethiopia_exile_events.13.desc: "[FROM.GetNameDef]人拒絕了我們對所有索馬裡地區未來的控制權主張。不幸的是，他們甚至拒絕承諾我們對從敵國獲取的土地行使制權。"
 BBA_ethiopia_exile_events.13.a: "讓人感嘆"
 BBA_ethiopia_exile_events.14.t: "[FROM.GetLeader]索要[454.GetName]"
 BBA_ethiopia_exile_events.14.desc: "近日，[FROM.GetLeader]在唐寧街會見了[ROOT.GetAdjective]首相，並討論了與[454.GetName]有關的事宜。[FROM.GetLeader]聲稱[FROM.GetLeader.GetSheHe]在前往[ROOT.GetNameDef]途中路過該地時受到了相當熱烈的歡迎。隨著會談的進行，[FROM.GetLeader]的真實意圖逐漸顯現出來——憑藉自稱的身為所羅門王直屬後裔的影響力，[FROM.GetLeader.GetHerHis]提出了將[454.GetName]作為基地，以此光復[ETH.GetNameDef]故土的請求。這實質上就是在要求首相將[454.GetName]割讓給[ETH.GetNameDef]。"
 BBA_ethiopia_exile_events.14.a: "這樣或許對我們也有些許好處"
 BBA_ethiopia_exile_events.14.b: "沒門！"
 BBA_ethiopia_exile_events.15.t: "[FROM.GetNameDefCap]同意了"
 BBA_ethiopia_exile_events.15.desc: "[FROM.GetAdjective]同意了我們將[454.GetName]作為一處基地使用的請求，這一結果即使對我們自己來說也是有些出乎意料的。我們應該儘快在那裡重建我們的行政機構。有朝一日，也許我們還會重建一座新的所羅門聖殿。"
 BBA_ethiopia_exile_events.15.a: "這是我們新時代的開始"
 BBA_ethiopia_exile_events.16.t: "[FROM.GetNameDefCap]拒絕了"
 BBA_ethiopia_exile_events.16.desc: "不幸的是，[FROM.GetAdjective]政府拒絕了我們將[454.GetName]作為一處基地使用的請求，並對我們對於該地區的宣稱之合法性提出了質疑。"
 BBA_ethiopia_exile_events.16.a: "真是奇恥大辱"
 BBA_ethiopia_exile_events.17.t: "[ROOT.GetLeader]向[FROM.GetLeader]承諾送出船隻援助"
 BBA_ethiopia_exile_events.17.desc: "在一次私下會面中，[ROOT.GetLeader]向[FROM.GetLeader]承諾稱，[ROOT.GetNameDef]會給[FROM.getNameDef]送去一些船隻作為援助。無論這話是有心還是無心，[ROOT.GetAdjective]海軍都應遵守諾言。"
 BBA_ethiopia_exile_events.17.a: "我們當然可以送出一些驅逐艦"
 ETH_destroyers_tt: "[ETH.GetName]收到5艘來自[JAP.GetName]的驅逐艦。"
 BBA_ethiopia_exile_events.17.b: "我們將送出一艘巡洋艦和一些護衛用船隻。"
 ETH_cruiser_tt: "[ETH.GetName]收到1艘來自[JAP.GetName]的重巡洋艦以及3艘來自[JAP.GetName]的驅逐艦。"
 BBA_ethiopia_exile_events.17.c: "[FROM.GetLeader]需要的正是一艘強大的旗艦。"
 ETH_battleship_tt: "[ETH.GetName]收到1艘[JAP.GetAdjective]戰列艦。"
 BBA_ethiopia_exile_events.17.d: "我們無法送出船隻，但至少可以傳授一些造船方面的技術。"
 BBA_ethiopia_exile_events.18.t: "[FROM.GetAdjective]驅逐艦"
 BBA_ethiopia_exile_events.18.desc: "[FROM.GetAdjective]海軍遵守了[FROM.GetLeader]協助[ROOT.GetName]建立海軍的諾言，並送來了一隊驅逐艦。"
 BBA_ethiopia_exile_events.18.a: "這些船至少還能派上點用場"
 BBA_ethiopia_exile_events.19.t: "[ROOT.GetAdjective]海軍的建立"
 BBA_ethiopia_exile_events.19.desc: "[FROM.GetAdjective]遵守了[FROM.GetLeader]為[ROOT.GetName]提供船隻援助的諾言，將一艘巡洋艦和幾艘驅逐艦轉交給了我們。我們也算有一支艦隊了，儘管它的規模並不大。這是[ROOT.GetName]宏偉新時代的開端。"
 BBA_ethiopia_exile_events.19.a: "這只是個開始"
 BBA_ethiopia_exile_events.20.t: "一艘[ROOT.GetAdjective]戰列艦"
 BBA_ethiopia_exile_events.20.desc: "在[ROOT.GetLeader]訪問[FROM.GetLeader]後，[FROM.GetName]決定將一艘戰列艦移交給[ROOT.GetName]。如此，[ROOT.GetNavy]現在有了一艘全新的旗艦。我們當然還需要為她建造護衛艦船，不過有了[FROM.GetAdjective]的援助，相信這項任務並不難完成。"
 BBA_ethiopia_exile_events.20.a: "令人滿意的消息！"
 BBA_ethiopia_exile_events.21.t: "沒有艦船援助"
 BBA_ethiopia_exile_events.21.desc: "雖然[FROM.GetLeader]對[ROOT.GetLeader]作出了艦船援助的承諾，但是[FROM.GetAdjective]海軍目前面臨的窘境意味著[FROM.GetName]現在無法向我們送出任何船隻。為了給我們一些相應的補償，[FROM.GetAdjective]海軍部特別允許[ROOT.GetName]研究[FROM.GetAdjective]艦船設計和生產方法，以期向[ROOT.GetName]傳授一些造船方面的知識。"
 BBA_ethiopia_exile_events.21.a: "總比什麼都沒有好吧"
 BBA_ethiopia_exile_events.22.t: "[ROOT.GetLeader]承諾將一座島嶼移交給[FROM.GetLeader]作為援助"
 BBA_ethiopia_exile_events.22.desc: "看起來[ROOT.GetLeader]承諾將[ROOT.GetName]的一座島嶼移交給[FROM.GetLeader]作為其政府的基地，並以此為起點，開始光復[FROM.GetName]故土。這也意味著[ROOT.GetLeader]正式承認了[FROM.GetLeader]作為[FROM.GetNameDef]統治者的合法地位。[ITA.getName]恐怕會將此行為視作對其的宣戰；但相對的，這也是[ROOT.GetNameDef]擴大其影響力範圍的一次機會。"
 BBA_ethiopia_exile_events.22.a: "[647.GetName]怎麼樣？"
 BBA_ethiopia_exile_events.22.b: "[524.GetName]應該是座不錯的基地。"
 BBA_ethiopia_exile_events.22.c: "我想，[543.GetName]也算是個島吧？"
 BBA_ethiopia_exile_events.22.d: "他們可以拿走[?ETH.japanese_island.GetName]。"
 BBA_ethiopia_exile_events.22.e: "他們可以拿走一座[ENG.GetAdjective]島嶼。"
 BBA_ethiopia_exile_events.23.t: "埃塞俄比亞流亡島嶼"
 BBA_ethiopia_exile_events.23.desc: "出於善意，也是出於對[ROOT.GetLeader]身為[ROOT.GetNameDef]合法統治者的認同，[FROM.GetLeader]同意將[?ETH.japanese_island.GetName]轉交給[ROOT.GetLeader]，作為用來光復[ROOT.GetName]故土的集結地。\n\n[FROM.GetNameDef]將幫助[ROOT.GetName]光復那些落入敵手的領土。作為回報，[ROOT.GetLeader]已經宣誓向[FROM.GetLeader]效忠。兩國在聯手對抗歐洲帝國主義的鬥爭中更加緊密地聯繫在了一起。"
 BBA_ethiopia_exile_events.23.a: "[?ETH.japanese_island.GetName]屬於我們了！"
 BBA_ethiopia_exile_events.24.t: "埃塞俄比亞行動基地"
 BBA_ethiopia_exile_events.24.desc: "在[ROOT.GetNameDef]和[FROM.GetNameDef]兩國首腦簽署的一項秘密協定中，雙方承諾一旦[ROOT.GetAdjective]取得阿拉伯半島某些區域的控制權，那它們會即刻轉交給[FROM.GetNameDef]。當然，現在還不是討論轉交事宜的時候，先拿下這些地方才是關鍵。"
 BBA_ethiopia_exile_events.24.a: "這將幫助我們的盟友變得更加強大"
 ETH_transfer_states_tt: "如果在§Y[ROOT.GetNameWithFlag]§!手中，會被轉交給§Y[ETH.GetNameWithFlag]§!"
 BBA_ethiopia_exile_events.30.t: "互助陣營申請"
 BBA_ethiopia_exile_events.30.desc: "[FROM.GetNameDefCap]建議我們向反[ITA.GetNameDef]陣營遞交一份加入申請。這與我們過去奉行的政策相違背，不過話說回來，讓[FROM.GetAdjective]領導人待在[ROOT.GetName]其實已經違背了政策。"
 BBA_ethiopia_exile_events.30.a: "加入不過是順其自然罷了"
 BBA_ethiopia_exile_events.30.b: "不行，這一步對我們來說還是太大了。"
 BBA_ethiopia_exile_events.31.t: "[FROM.GetName]拒絕了我們的提議"
 BBA_ethiopia_exile_events.31.desc: "非常不幸，[FROM.GetAdjective]拒絕了我們的入盟請求。這意味著我們將不得不在沒有更多盟友支援的情況下孤軍作戰了。"
 BBA_ethiopia_exile_events.31.a: "人事已盡"
 BBA_ethiopia_exile_events.32.t: "[FROM.GetName]和[FROM.FROM.GetName]遞交了入盟申請"
 BBA_ethiopia_exile_events.32.desc: "[FROM.GetLeader]和[FROM.FROM.GetLeader]向我們遞交了加入[ROOT.GetFactionName]的申請。這將讓[ROOT.GetFactionName]能在對抗[ITA.GetName]的戰爭中調動[FROM.GetNameDef]和[FROM.FROM.GetNameDef]的軍事力量。"
 BBA_ethiopia_exile_events.32.a: "聽起來是個好主意"
 BBA_ethiopia_exile_events.32.b: "沒有他們對我們來說或許更好。"
 BBA_ethiopia_exile_events.33.t: "[FROM.GetName]拒絕"
 BBA_ethiopia_exile_events.33.desc: "非常不幸，[FROM.GetName]拒絕了[SWE.GetAdjective]和[ETH.GetAdjective]加入[FROM.GetFactionName]的聯合請求。也不知道是為了什麼莫名其妙的考量，反正他們不願意接受聯合對抗[ITA.GetLeader]帶來的好處。"
 BBA_ethiopia_exile_events.33.a: "煩人"
 BBA_ethiopia_exile_events.34.t: "[FROM.GetNameDefCap]同意"
 BBA_ethiopia_exile_events.34.desc: "[FROM.GetNameDefCap]已經允許我們加入[FROM.GetFactionName]。現在我們擊敗[ITA.GetName]的可能性大大提升了。"
 BBA_ethiopia_exile_events.34.a: "喜訊"
 BBA_ethiopia_exile_events.40.t: "[FROM.GetName]請求調停"
 BBA_ethiopia_exile_events.40.desc: "日前，[FROM.GetName]的流亡皇帝[FROM.GetLeader]請求[ROOT.GetName]調停意埃戰爭。[GetGermanCountryLeaderTitle]已經充分表達了他關於解決這項國聯未能解決的衝突的個人意願。一旦這件事可以做成，[ROOT.GetName]在國際舞臺上的地位將有明顯提升。"
 BBA_ethiopia_exile_events.40.a: "[ITA.GetName]必須撤出[FROM.GetName]"
 BBA_ethiopia_exile_events.40.b: "[ITA.GetLeader]總要得到點什麼好處吧。"
 BBA_ethiopia_exile_events.40.c: "我們應該重新劃定一條更穩定的邊界。"
 BBA_ethiopia_exile_events.41.t: "[FROM.GetAdjective]調停"
 BBA_ethiopia_exile_events.41.desc_back_off: "[?global.ETH_peace_country.GetLeader]在[FROM.GetNameDef]的土地上獲得了居住權，在這期間，早已被人架空的他還故作姿態地發號施令。而這位[?global.ETH_peace_country.GetNameDef]前領袖的言辭也確確實實地迷惑了[FROM.GetLeader]，這讓[FROM.GetLeader.GetHerHis]對[ROOT.GetNameDef]頗具微詞。很顯然，[FROM.GetLeader]已然站在了敵人這邊。[FROM.GetNameDef]更是發出指令：要求我們即刻撤離[?global.ETH_peace_country.GetName]，讓我們兩國摒棄前嫌、罷兵言和。"
 BBA_ethiopia_exile_events.41.desc_offered_compensation: "自從敵國的流亡領導人[?global.ETH_peace_country.GetLeader]被准許在[FROM.GetNameDef]定居後，[FROM.GetLeader]自然而然想要調解[ROOT.GetName]與[?global.ETH_peace_country.GetName]的衝突。[FROM.GetLeader]稱，[FROM.GetLeader.GetSheHe]已設法說服[?global.ETH_peace_country.GetLeader]向[ROOT.GetName]做出一點讓步，從而換取兩國的和平以及未來合作的可能性。"
 BBA_ethiopia_exile_events.41.desc_redraw_map: "針對意埃戰爭，[FROM.GetAdjective]領導人[FROM.GetLeader]提出了他的調停方案。即作為和平的交換條件，[ROOT.GetName]會獲得[?global.ETH_peace_country.GetAdjective]的大部分領土，並在未來建立合作；共同抵禦第三方敵軍。如果[ROOT.GetName]接受了這項方案，[?global.ETH_peace_country.GetName]也不會一無所獲。作為補償，他們也會獲得[550.GetName]。雖然此舉讓[?global.ETH_peace_country.GetName]打通了海路，但毫無疑問，[ROOT.GetAdjective]在非洲的根基更加穩固了。"
 BBA_ethiopia_exile_events.41.a: "這也許是最好的"
 BBA_ethiopia_exile_events.41.b: "還不夠，[ROOT.GetAdjective]人民的付出理應獲得更多。"
 BBA_ethiopia_exile_events.41.c: "[FROM.GetLeader.GetSheHe]以為[FROM.GetLeader.GetSheHe]是誰？"
 BBA_ethiopia_exile_events.42.t: "[FROM.GetLeader]需要更多好處"
 BBA_ethiopia_exile_events.42.desc: "[FROM.GetLeader]沒有接受[GetGermanCountryLeaderTitle]提出的和平提案，但同時他也沒完全拒絕。[FROM.GetAdjective]政府認為他們需要在和平條款中獲得更多的利益，畢竟要是民眾覺得這條約讓他們徒勞少功鬧起來可就不大好了。"
 BBA_ethiopia_exile_events.42.a: "可以理解"
 BBA_ethiopia_exile_events.42.b: "他們居然敢質疑我們的命令？"
 BBA_ethiopia_exile_events.43.t: "[FROM.GetName]接受了我們的提案"
 BBA_ethiopia_exile_events.43.desc: "[FROM.GetLeader]對於我們通過[ETH.GetName]割讓土地來結束衝突的需求表示理解，畢竟咱還得在公眾面前挽回臉面。相信很快我們就能把這場混亂的入侵行動拋在腦後，像個沒事人一樣昂首挺胸繼續前進了。"
 BBA_ethiopia_exile_events.43.a: "很好"
 BBA_ethiopia_exile_events.44.t: "[FROM.GetLeader]被我們的請求激怒了"
 BBA_ethiopia_exile_events.44.desc: "[ROOT.GetLeader]提出的請求被當做了耳邊風。好吧也不算耳邊風，畢竟這請求成功地讓[FROM.GetLeader]大發雷霆，稱[ROOT.GetLeader]就是個廢物，畢竟[ROOT.GetLeader.GetHerHis]連個非洲國家都打不贏，且不論目前的提案正符合各方的最大利益。另外，[FROM.GetLeader]還感嘆道，[FROM.GetAdjective]人肯定能在幾週內就幹碎[ROOT.GetAdjective]軍隊。"
 BBA_ethiopia_exile_events.44.a: "他們總不可能因為這點小事就宣戰，對吧……"
 BBA_ethiopia_exile_events.45.t: "調停成功"
 BBA_ethiopia_exile_events.45.desc_white_peace: "事實證明，[FROM.GetAdjective]的調停非常成功。[FROM.FROM.GetLeader]已奉[FROM.GetLeader]之命將[FROM.FROM.GetLeader.GetHerHis]部隊撤出了[ROOT.GetAdjective]全境。\n和平條約並沒有向[ROOT.GetName]提供任何賠償，但我們可以指望我們的新盟友帶領這個國家走向現代。[FROM.GetAdjective][GetGermanCountryLeaderTitle][FROM.GetLeader]對恢復[ROOT.GetAdjective]帝國的榮耀做出了粗略的承諾。"
 BBA_ethiopia_exile_events.45.desc_redraw_map: "[FROM.GetLeader]已與[FROM.FROM.GetNameDef]達成了一項合約。[ROOT.GetNameDefCap]必須將整個南部割讓給[FROM.FROM.GetName]。而作為補償，[ROOT.GetName]會得到[550.GetName]以確保海路的暢通。據[FROM.GetLeader]的說法，將整片區域拆分成獨立區塊也是為了降低兩國之間的潛在衝突。"
 BBA_ethiopia_exile_events.45.desc_cede_territory: "[FROM.GetLeader]已與[FROM.FROM.GetNameDef]達成了一項合約。不幸的是，兩國領導人決定把[ROOT.GetName]的一部分轉讓給[FROM.FROM.GetName]。對此我們無能為力，因為在這件事上我們沒有商討權。"
 BBA_ethiopia_exile_events.45.a: "也算是和平"
 BBA_ethiopia_exile_events.46.t: "調停失敗"
 BBA_ethiopia_exile_events.46.desc: "不幸的是，[FROM.GetLeader]為[FROM.FROM.GetNameDef]調停戰爭的努力無果而終。[FROM.FROM.GetLeader]聽不進任何解釋。我們現在只能寄希望於[FROM.GetNameDef]可以親自下場，和我方並肩作戰了。"
 BBA_ethiopia_exile_events.46.a: "我們原本還對此寄予厚望呢……"
 BBA_ethiopia_exile_events.47.t: "[FROM.GetLeader]拒絕合作"
 BBA_ethiopia_exile_events.47.desc: "[FROM.GetAdjective]給出的回覆令人大失所望。簡單地說，[FROM.GetLeader]完全沒有絲毫改變主意的打算；[FROM.GetName]絕不會接受停戰，除非他們大獲全勝或遭完全毀滅。"
 BBA_ethiopia_exile_events.47.a: "我們得給[FROM.GetLeader.GetHerHim]個教訓"
 BBA_ethiopia_exile_events.48.t: "[FROM.GetLeader]接受了我們的調停"
 BBA_ethiopia_exile_events.48.desc: "正如我們所期待的那樣，[ROOT.GetNameDef]成功做到了這件前人沒法做到的事。[FROM.GetLeader]已經全盤接受[ROOT.GetLeader]提出的方案。終於，[FROM.GetNameDefCap]和[?global.ETH_peace_country.GetNameDef]將達成和平。現在我們得以騰出手來處理更重要的事務。"
 BBA_ethiopia_exile_events.48.a: "[ROOT.GetLeader]是我們時代和平的守護者"
 BBA_ethiopia_exile_events.50.t: "邊境事端"
 BBA_ethiopia_exile_events.50.desc: "近日，一處[ROOT.GetAdjective]邊防站遭到了[ITA.GetAdjective]的攻擊。[ROOT.GetAdjective]對[ITA.GetAdjective]狙擊手予以還擊。戰鬥持續了很長時間，雙方均有傷亡。我方對[ITA.GetAdjective]政府提出了正式的外交抗議，但對方不但不予承認，還反咬一口，堅稱事端是由我方部隊率先挑起的。"
 BBA_ethiopia_exile_events.50.a: "這種行為不可接受！"
 BBA_ethiopia_exile_events.51.t: "可疑的邊境事端"
 BBA_ethiopia_exile_events.51.desc: "[GER.GetAdjective]向我們遞交了一份外交抗議，怒斥我們在德意邊境挑起衝突的行徑。我們確信雙方部隊在邊境地區發生交火，但我們收到的幾份報告卻是自相矛盾的：有些報告稱意大利方首先開火，但是在這次衝突中倖存的邊防站衛兵們一口咬定他們沒有首先開火，只是在德軍開火後被迫進行還擊。何況衝突發生時，我方士兵們完全暴露在空曠地帶，很多士兵連掩體都找不到。這進一步印證了邊防站衛兵們的說法。"
 BBA_ethiopia_exile_events.51.a: "這明顯是[GER.GetAdjective]的陰謀"
 BBA_ethiopia_exile_events.52.t: "幕後外交"
 BBA_ethiopia_exile_events.52.desc: "近日於[ETH.GetLeader]陛下府邸召開的宴會是一次極大的成功。賓客們享用著來自世界各地的美味佳餚，推杯論盞，相談甚歡；與此同時，[?ETH.host_nation.GetAdjective]政客們則在聽取[ETH.GetAdjective]流亡者們對於[ITA.GetName]在其祖國施行的嚴酷統治的控訴。許多人被這些故事打動，並承諾會援助我們更多的[?ETH.host_nation.GetAdjective]資源，幫助我們在將來解放[ETH.GetNameDef]。"
 BBA_ethiopia_exile_events.52.a: "離光復又近了一步"
 BBA_ethiopia_exile_events.53.t: "遊說活動成功"
 BBA_ethiopia_exile_events.53.desc: "過去幾個月間，我們在東道主各地進行了遊說活動，以博取對我們解放[ETH.GetNameDef]的支持。國王陛下甚至親自向一些政府和軍隊成員寫信，宣傳我們的事業。與此同時，其餘流亡者們也忙於接受採訪以及在各大報紙上發表文章等活動，為贏得[?ETH.host_nation.GetAdjective]的支持馬不停蹄地奔波。在我們不懈的努力下，這個國家的輿論終於逐漸轉變，人們開始支持為[ETH.GetNameDef]的解放事業提供直接軍事援助。"
 BBA_ethiopia_exile_events.53.a: "我們的努力沒有白費！"
 BBA_ethiopia_exile_events.54.t: "籌款活動"
 BBA_ethiopia_exile_events.54.desc: "我們最近的籌款活動獲得了巨大成功。來自全球各地捐贈者的大筆資金陸續流入皇家財庫。看來，像我們一樣對[ETH.GetNameDef]遭到佔領而感到憤慨的人並不在少數。"
 BBA_ethiopia_exile_events.54.a: "我們不會忘記他們對解放事業的援助"
 BBA_ethiopia_exile_events.55.t: "[?ETH.host_nation.GetAdjective]傭兵招募"
 BBA_ethiopia_exile_events.55.desc: "[?ETH.host_nation.GetAdjective]僱傭兵陸續到來，改善了我們所致力於事業的環境，他們也會即將到來的戰鬥中為我們提供幫助。當然，這一切都是有代價的。"
 BBA_ethiopia_exile_events.55.a: "我們的力量與日俱增"
 BBA_ethiopia_exile_events.56.t: "[?ETH.host_nation.GetAdjective]飛行員響應召喚"
 BBA_ethiopia_exile_events.56.desc: "我們看到一些[?ETH.host_nation.GetAdjective]飛行員應召在我們即將到來的祖國解放行動中幫助我們。他們帶來了寶貴的經驗，可以分享給我們未來的飛行員。"
 BBA_ethiopia_exile_events.56.a: "我們對於一切幫助來者不拒"
 BBA_ethiopia_exile_events.57.t: "一支[ETH.GetName]輔助艦隊"
 BBA_ethiopia_exile_events.57.desc: "面對敵軍在水面上的大肆侵擾，我們也不得不號召[?ETH.host_nation.GetAdjective]各色海員及各類船隻挺身而出。振奮的是，有識之士也紛紛響應。其中包括海軍退役人員、平民水手以及青年志願者等等。我們能有的也只不過是從[?ETH.host_nation.GetNameDef]的破舊造船廠蒐集來的貨船，而他們甘冒風險，毅然成為了這樣一支拼湊艦隊的船員。"
 BBA_ethiopia_exile_events.57.a: "希望這些船還能開吧……"
 BBA_ethiopia_exile_events.58.t: "步槍運輸船抵達"
 BBA_ethiopia_exile_events.58.desc: "購自[?ETH.host_nation.GetAdjective]製造商的步槍現已被移交至我國駐紮在[?ETH.host_nation.GetName]的部隊。這些新裝備現在正在靶場接受測試並用於訓練。"
 BBA_ethiopia_exile_events.58.a: "這錢花得值"
 BBA_ethiopia_exile_events.59.t: "支援裝備運抵"
 BBA_ethiopia_exile_events.59.desc: "我們最近為部隊購買的支援裝備現已運抵。它們儘管不是世界上最前沿的裝備，但仍能為前線提供巨大的幫助。"
 BBA_ethiopia_exile_events.59.a: "蚊子腿也是肉"
 BBA_ethiopia_exile_events.60.t: "坦克運抵"
 BBA_ethiopia_exile_events.60.desc: "從[?ETH.host_nation.GetAdjective]陸軍購買的坦克現已移交我國陸軍。儘管這些坦克是前些年被退役封存的老舊型號，但他們仍然運轉良好。如今正在被用於訓練車組，準備前往前線服役。 "
 BBA_ethiopia_exile_events.60.a: "什麼樣的坦克都好於沒有坦克"
 #Imperial Events, non-exile stuff
 BBA_ethiopia_imperial_events.1.t: "[FROM.GetName]希望購買吉布提"
 BBA_ethiopia_imperial_events.1.desc: "[FROM.GetLeader]想要購買[ROOT.GetAdjective]的[268.GetName]殖民地。此舉將使得[FROM.GetNameDef]通過吉布提港獲得出海口，已有一條連接此地和亞的斯亞貝巴的鐵路。他們準備為這一不起眼的殖民地支付一筆鉅款。"
 BBA_ethiopia_imperial_events.1.a: "我們可以好好利用這筆錢"
 BBA_ethiopia_imperial_events.1.b: "它是[ROOT.GetAdjective]的，並將永遠屬於我們！"
 BBA_ethiopia_imperial_events.2.t: "[FROM.GetNameDefCap]同意出售吉布提"
 BBA_ethiopia_imperial_events.2.desc: "同[FROM.GetAdjective]政府關於購買[268.GetName]殖民地意向的磋商已經順利結束。[FROM.GetNameDefCap]已經同意立刻著手將吉布提港及其周邊地區移交給[ROOT.GetName]。此舉既能使我們獲得一個出海口，同時也將阿法爾人民團結在同一個統治者之下。"
 BBA_ethiopia_imperial_events.2.a: "好消息"
 BBA_ethiopia_imperial_events.3.t: "[FROM.GetName]拒絕出售吉布提"
 BBA_ethiopia_imperial_events.3.desc: "不幸的是，[FROM.GetAdjective]政府拒絕了我們從他們手中購買吉布提港的請求。他們不顧一切地維持著他們的殖民地，拒絕放棄他們佔據的每一寸土地，而對互惠之舉視而不見。"
 BBA_ethiopia_imperial_events.3.a: "我們將考慮其他辦法"
 BBA_ethiopia_imperial_events.4.t: "[FROM.GetNameDefCap]請求得到[689.GetName]。"
 BBA_ethiopia_imperial_events.4.desc: "[689.GetName]的拉斯塔法裡運動將$ETH_haile_selassie$稱為彌賽亞或耶和華（他們對上帝的稱呼）轉世。有點出乎意料的是，$ETH_haile_selassie$接納了這個榮譽，[FROM.GetAdjective]政府也提請將拉斯塔法裡教的故鄉[689.GetName]併入[FROM.GetAdjective]帝國。"
 BBA_ethiopia_imperial_events.4.a: "多麼奇怪的請求啊，但為何不呢？"
 BBA_ethiopia_imperial_events.4.b: "我們將成為錫安帝國的一部分。"
 BBA_ethiopia_imperial_events.4.c: "沒門！"
 BBA_ethiopia_imperial_events.5.t: "[FROM.GetNameDefCap]同意了我們的請求"
 BBA_ethiopia_imperial_events.5.desc: "我們關於移交[689.GetName]控制權的謙遜的請求以被[FROM.GetNameDef]同意。這標誌著一個新的時代的開啟。榮耀歸於$ETH_haile_selassie$。這很可能意味著我們可以從整個美洲吸納追隨者。"
 BBA_ethiopia_imperial_events.5.a: "他們有著光明的未來"
 BBA_ethiopia_imperial_events.6.t: "[FROM.GetNameDefCap]拒絕交出[689.GetName]"
 BBA_ethiopia_imperial_events.6.desc: "儘管我們盡了最大的努力，我們仍沒能讓[FROM.GetAdjective]政府相信[689.GetName]是[ROOT.GetAdjective]的一部分。他們盡情地嘲諷了我們的提議，甚至對我們偉大領袖的神性提出了質疑。"
 BBA_ethiopia_imperial_events.6.a: "他們怎麼敢的啊！"
 BBA_ethiopia_imperial_events.7.t: "[FROM.GetLeader]要求臣服"
 BBA_ethiopia_imperial_events.7.desc: "[689.GetName]的拉斯塔法裡運動將$ETH_haile_selassie$稱為彌賽亞或耶和華（他們對上帝的稱呼）轉世。有點出乎意料的是，$ETH_haile_selassie$接納了這個榮譽。結果是，[FROM.GetLeader.GetSheHe]現在提出讓[ROOT.GetNameDef]正式加入[FROM.GetAdjective]，以此在加勒比地區建立一個可以向全世界擴散影響力的新根據地。"
 BBA_ethiopia_imperial_events.7.a: "聽起來是個不錯的主意"
 BBA_ethiopia_imperial_events.7.b: "他們真是瘋了。"
 BBA_ethiopia_imperial_events.8.t: "[FROM.GetNameDefCap]臣服"
 BBA_ethiopia_imperial_events.8.desc: "[FROM.GetLeader]採取了一個明智的決定，即同意認我們為宗主。[FROM.GetName]將成為[ROOT.GetLeader]的一個忠誠的藩屬。 "
 BBA_ethiopia_imperial_events.8.a: "榮耀歸於[ROOT.GetLeader]"
 BBA_ethiopia_imperial_events.9.t: "[FROM.GetNameDefCap]拒絕臣服"
 BBA_ethiopia_imperial_events.9.desc: "不幸的是，[FROM.GetNameDef]拒絕了成為[ROOT.GetLeader]藩屬的慷慨提議。儘管我們盡了最大的努力，我們仍沒能讓[FROM.getName]相信這一提議實際上是對我們雙方都有好處的。"
 BBA_ethiopia_imperial_events.9.a: "現實常常不像計劃那樣一帆風順"
 BBA_ethiopia_imperial_events.10.t: "[FROM.GetNameDefCap]發出最後通牒"
 BBA_ethiopia_imperial_events.10.desc: "[FROM.GetNameDefCap]要求我們屈服並且併入他們的國家。如果我們服從，這無疑將是[THIS.GetName]作為一個獨立國家的終結。現在尚不清楚[FROM.GetLeader]為了實現吞併願意走多遠，但始終不能排除武裝衝突的可能性。"
 BBA_ethiopia_imperial_events.10.a: "我們別無選擇……"
 BBA_ethiopia_imperial_events.10.b: "我們不會被嚇倒"
 BBA_ethiopia_imperial_events.11.t: "[FROM.GetNameDefCap]拒絕最後通牒"
 BBA_ethiopia_imperial_events.11.desc: "[FROM.GetNameDefCap]拒絕同意我們的合併請求。[FROM.GetName]再一次為了自保而打算背叛我們，我們不能允許這一幕再次上演。"
 BBA_ethiopia_imperial_events.11.a: "我們將給這件事畫上一個句號"
 BBA_ethiopia_imperial_events.11.b: "我們有更重要的事情需要處理"
 BBA_ethiopia_imperial_events.12.t: "[FROM.GetNameDefCap]接受要求"
 BBA_ethiopia_imperial_events.12.desc: "[FROM.GetNameDefCap]接受了重新併入[THIS.GetName]的請求，[FROM.GetLeader]也向他的陛下——[THIS.GetLeader]宣誓效忠。"
 BBA_ethiopia_imperial_events.12.a: "可以不用再掛念這件事了"
 BBA_ethiopia_imperial_events.20.t: "$ETH_ras_imru_haile_selassie$發動的不流血政變"
 BBA_ethiopia_imperial_events.20.desc: "在獲取了[ETH.GetName]農民和中產階級的支持後，$ETH_ras_imru_haile_selassie$王公宣告正式罷黜$ETH_haile_selassie$，並將普選引入[ETH.GetNameDef]。被人民，以及在此時更重要的，[ETH.GetAdjective]軍隊普遍視為第二次意埃戰爭的真正英雄的他，已經設法確保了來自軍隊的忠誠，以及缺席皇帝未能獲得的支持。"
 BBA_ethiopia_imperial_events.20.a: "赤色王公將會統治[ETH.GetNameDef]"
 BBA_ethiopia_imperial_events.20.b: "讓王儲成為立憲君主會更穩妥一些。"
 BBA_ethiopia_imperial_events.21.t: "[ETH.GetName]的抵抗"
 BBA_ethiopia_imperial_events.21.desc: "我們的軍隊在和[ETH.GetAdjective]的敵軍作戰時勢如破竹,為我們在當地實行更好的統治提供了便利。但是，我們注意到這些新領土正在滋生抵抗運動。前任統治者$ETH_haile_selassie$對國聯說的那番話似乎讓許多我們新領土的平民陷入了狂熱。也許只要這位皇帝還活著，抵抗組織就會一直在我們的殖民政府眼皮底下蠢蠢欲動。"
 BBA_ethiopia_imperial_events.21.a: "不管怎樣，他們都會屈服我們的統治"
 ETH_imperial_event_21_tt: "所有控制的§Y[ETH.GetFlag][ETH.GetAdjective]§!地區：\n順從度：§R-10%§!"
 #Military and technology events
 BBA_ethiopia_military_and_tech_events.1.t: "[GetEthiopianMilitaryAcademyName]的第一批畢業生"
 BBA_ethiopia_military_and_tech_events.1_war.desc: "在[GetEthiopianMilitaryAcademyName]進修的第一批學生已經畢業了，他們在離開校園後會直接進入戰場。在進行戰爭的同時成功建造這所軍校，並完成一批學員的教育，真的是一項了不起的壯舉。\n這會是[ROOT.GetAdjective]軍隊嶄新時代的開始！"
 BBA_ethiopia_military_and_tech_events.1_peace.desc: "隨著戰爭的結束，我們現在有機會去完成軍事學院的建設了。第一批學員可以幫助我們國家贏得未來可能發生的戰爭，並確保我們可以最大化吸收利用與意大利人作戰時積累的經驗。"
 BBA_ethiopia_military_and_tech_events.1.a: "這所軍校將保持我軍對進攻的專注"
 ETH_ecole_attack_tt: "§Y[GetEthiopianArmySpiritName]§!追加效果：\n$modifier_army_sub_unit_infantry_attack_factor$：§G+10%§! \n$modifier_army_sub_unit_irregular_infantry_attack_factor$：§G+10%§! "
 BBA_ethiopia_military_and_tech_events.1.b: "這所軍校會幫助改變我們的觀念，從而更加傾向於防禦。"
 ETH_ecole_defense_tt: "§Y[GetEthiopianArmySpiritName]§!追加效果：\n$MODIFIERS_ARMY_DEFENCE_FACTOR$：§G+5%§!"
 BBA_ethiopia_military_and_tech_events.1.c: "這所軍校會確保我們永遠對戰爭有所準備。"
 ETH_ecole_learn_tt: "§Y[GetEthiopianArmySpiritName]§!追加效果：\n$MODIFIER_XP_GAIN_ARMY$：§G+5%§!"
 #Anti colonialism
 BBA_ethiopia_anti_colonialism_events.2.t: "[?global.african_supporting_country.GetNameDef]要求[?global.african_revolt_country.GetNameDef]的承認"
 BBA_ethiopia_anti_colonialism_events.2.desc: "[?global.african_supporting_country.GetLeader]，[?global.african_supporting_country.GetNameDef]的領導人要求與[?global.african_revolt_country.GetAdjective]叛軍立刻停戰。[?global.african_supporting_country.GetAdjective]的外交官鼓勵[ROOT.GetName]承認[?global.african_revolt_country.GetNameDef]的獨立。他們並未明確說明我們是否應當拒絕與[?global.african_supporting_country.GetNameDef]開戰，但他們顯然暗示這一可能。"
 BBA_ethiopia_anti_colonialism_events.2.a: "他們是對的，我們現在應該結束這場殖民地衝突"
 BBA_ethiopia_anti_colonialism_events.2.b: "只有當[?global.african_revolt_country.GetNameDef]被打敗時，戰爭才會結束。"
 BBA_ethiopia_anti_colonialism_events.3.t: "[?global.african_supporting_country.GetAdjective]調停成功！"
 BBA_ethiopia_anti_colonialism_events.3.desc: "[?global.african_supporting_country.GetNameDef]的領導人[?global.african_supporting_country.GetLeader]代表我方與[?global.african_colonial_country.GetLeader]進行了成功的磋商。[?global.african_colonial_country.GetLeader]業已承認[ROOT.GetAdjective]的獨立並且終止了[?global.african_colonial_country.GetNameDef]與[ROOT.GetNameDef]之間的敵對關係。[ROOT.GetNameDefCap]將永遠感激[?global.african_supporting_country.GetNameDef]在鬥爭中向我們提供的幫助。"
 BBA_ethiopia_anti_colonialism_events.3.a: "終於自由了"
 BBA_ethiopia_anti_colonialism_events.4.t: "[FROM.GetNameDefCap]拒絕承認[?global.african_revolt_country.GetAdjective]的獨立"
 BBA_ethiopia_anti_colonialism_events.4.desc: "儘管我們施壓，[?global.african_colonial_country.GetAdjective]政府仍然拒絕承認[?global.african_revolt_country.GetNameDef]的獨立並解除敵對關係。[?global.african_colonial_country.GetAdjective]似乎正致力於破壞獨立運動。看來目前我們可能無法僅僅通過外交手段解決。"
 BBA_ethiopia_anti_colonialism_events.4.a: "人事已盡"
 BBA_ethiopia_anti_colonialism_events.4.b: "那麼我們只能動手對付他們了。"
 BBA_ethiopia_anti_colonialism_events.5.t: "[FROM.GetName]加入了對抗[?global.african_colonial_country.GetName]的戰爭"
 BBA_ethiopia_anti_colonialism_events.5.desc: "在試圖調停我們與[?global.african_colonial_country.GetNameDef]的戰爭並失敗後，[?global.african_supporting_country.GetNameDef]決定對[ROOT.GetAdjective]的鬥爭積極地開始提供支持。[?global.african_colonial_country.GetAdjective]駐[?global.african_supporting_country.GetName]大使已經得到通知：[?global.african_supporting_country.GetNameDef]與[?global.african_colonial_country.GetName]從此刻起進入戰爭狀態，直到[?global.african_colonial_country.GetNameDef]放棄其在非洲和其他地方的帝國主義和殖民主義野心。"
 BBA_ethiopia_anti_colonialism_events.5.a: "[ROOT.GetName]和[?global.african_supporting_country.GetName]的力量站在了一起！"
 BBA_ethiopia_anti_colonialism_events.6.t: "[FROM.GetNameDef]的自由"
 BBA_ethiopia_anti_colonialism_events.6.desc: "在來自[ROOT.GetName]的強大外交壓力下，包括[ROOT.GetLeader]和[?global.african_colonial_country.GetLeader]的直接會談，[?global.african_colonial_country.GetAdjective]政府決定讓步，並承認[?global.african_revolt_country.GetAdjective]獨立。\n多虧了[ROOT.GetAdjective]的直接干預，[?global.african_revolt_country.GetAdjective]獨立戰爭終於結束了。[?global.african_revolt_country.GetNameDefCap]成為一個獨立自主的國家，而[ROOT.GetLeader]自然也會在[?global.african_revolt_country.GetNameDef]永遠成為英雄。"
 BBA_ethiopia_anti_colonialism_events.6.a: "又一個國家脫離了帝國主義的魔爪"
 #Industrial and Financial Events
 BBA_ethiopia_industrial_financial_events.2.t: "[FROM.GetNameDefCap]要求整合"
 BBA_ethiopia_industrial_financial_events.2.desc: "鑑於[FROM.GetName]已經掌控了[ROOT.GetName]的大部分工業來源，事實上兩國的經濟已經緊密的交織在了一起。[FROM.GetLeader]由此下令拆除兩國之間的邊境站。[FROM.Getname]更是完全接管了兩國所有外交政策的制定與實施，以此促進最強的保障、最深的合作以及最高的效率。當然，這也從根本上否定了[ROOT.GetAdjective]的主權獨立。\n[FROM.GetLeader]也擔保，這所有的一切都是為了兩國利益的最大化。"
 BBA_ethiopia_industrial_financial_events.2.a: "他們無權這麼做！"
 BBA_ethiopia_industrial_financial_events.2.b: "只要我們能保留一定的自治權。"
 BBA_ethiopia_industrial_financial_events.2.c: "這的確是兩國最好的選擇。 "
 BBA_ethiopia_industrial_financial_events.3.t: "[FROM.GetName]拒絕合作"
 BBA_ethiopia_industrial_financial_events.3.desc: "儘管我們費盡口舌解釋了當下的情形，但[FROM.GetLeader]依舊一口回絕了我們關於升級經濟一體化的提案。[FROM.GetLeader]指明：[FROM.GetName]的主權不容踐踏，這一點沒有商量的餘地。"
 BBA_ethiopia_industrial_financial_events.3.a: "我們有必要使用武力來維護自己的利益"
 BBA_ethiopia_industrial_financial_events.4.t: "[FROM.GetName]想保留部分控制權"
 BBA_ethiopia_industrial_financial_events.4.desc: "在當下的環境，[FROM.GetLeader]認為我們更有必要加深國際合作、提高外交政策和金融政策的協調性。不過，[FROM.GetLeader.GetSheHe]也希望[FROM.GetNAme]在新聯邦的帶領下能夠保留一定的自治權。"
 BBA_ethiopia_industrial_financial_events.4.a: "會習慣的"
 BBA_ethiopia_industrial_financial_events.5.t: "[FROM.GetLeader]同意了"
 BBA_ethiopia_industrial_financial_events.5.desc: "[FROM.GetLeader]簽署了一份文件，內容是關於[ROOT.GetName]和[FROM.GetName]的整合統一。兩國的外交部將會合二為一；經濟政策也會統一籌劃。司法系統的融合也更能促進協同合作。\n 從今以後，[FROM.GetNameDefCap]也成為了[ROOT.GetName]不可分割的一部分。"
 BBA_ethiopia_industrial_financial_events.5.a: "這是為了所有人的利益。"
 #Fascist Ethiopia
 BBA_ethiopia_fascist_events.01.t: "變革的契機"
 BBA_ethiopia_fascist_events.01.desc: "$ETH_haile_selassie$針對意大利人的態度始終帶有挑釁，而他信任的國際聯盟對此無動於衷。每個人心裡都清楚，[ROOT.GetName]將會萬劫不復。\n\n戰爭是變革的契機，變革更是戰爭的必然結果。當然，首先要做的是派遣一位外交大使和意大利人協商一份他們能夠接受的和約。"
 BBA_ethiopia_fascist_events.01.a: "$ETH_haile_selassie_gugsa$會是不二人選。"
 ETH_start_civil_war: "當國策§Y$ETH_declare_for_italy$§!完成時，§Y$ETH_haile_selassie_gugsa$§!將會對§Y$ETH_haile_selassie$§!發起一場§Y內戰§!。"
 ETH_cede_states_tt: "\n當戰爭結束，§Y[ITA.GetNameWithFlag]§!會獲得以下地區："
 ETH_cede_south_tt: "§Y[835.GetName]\n[836.GetName]\n[837.GetName]§!"
 ETH_ethiopia_italian_puppet_tt: "\n§Y[ETH.GetNameDef]§!將成為§Y[ITA.GetNameDef]§!的附屬國"
 ETH_italy_refuse_cooperation: "國策§Y$ETH_reach_out_to_the_italians$§!將會被取消，國策§Y$ETH_rally_around_the_emperor$§!將會自動完成。 "
 BBA_ethiopia_fascist_events.01.b: "派遣$gojjam$的$ETH_hailu_tekle_haymanot$。"
 ETH_start_civil_war_gojjam: "當國策§Y$ETH_declare_for_italy$§!完成時，$gojjam$的§Y$ETH_hailu_tekle_haymanot$§!將會對§Y$ETH_haile_selassie$§!發起一場§Y內戰§!。"
 ETH_gojjam_italian_puppet_tt: "\n§Y$gojjam$§!將成為§Y[ITA.GetNameWithFlag]§!的附屬國"
 ETH_cede_south_west_tt: "§Y[838.GetName]\n[836.GetName]\n[837.GetName]§!"
 BBA_ethiopia_fascist_events.01.c: "這可能是$ETH_abba_jofir$獲得成功的絕佳時機。"
 ETH_start_civil_war_jimma: "當國策§Y$ETH_declare_for_italy$§!完成時，$jimma$的§Y$ETH_abba_jofir$§!將會對§Y$ETH_haile_selassie$§!發起一場§Y內戰§!。"
 ETH_cede_north_tt: "§Y[841.GetName]\n[842.GetName]\n[843.GetName]§!"
 ETH_jimma_italian_puppet_tt: "\n§Y$jimma$§!將成為§Y[ITA.GetNameWithFlag]§!的附屬國"
 BBA_ethiopia_fascist_events.02.t: "王位宣稱者尋求和平"
 BBA_ethiopia_fascist_events.02.desc: "$ETH_haile_selassie_gugsa$是一位[ETH.GetAdjective]貴族，也是王位的宣稱者之一。近日，他接觸了在[ETH.GetName]的[ROOT.GetAdjective]最高統帥部。這位貴族主動提出可以幫助對抗[ETH.GetLeader]，以換取戰後對這個國家部分地區的統治權。當然，$ETH_haile_selassie_gugsa$將對$ITA_vittorio_emanuele_iii$宣誓效忠，並代替他成為[ETH.GetName]的新王。"
 BBA_ethiopia_fascist_events.02.a: "這一提議對我們來說頗為有利。"
 BBA_ethiopia_fascist_events.02.b: "謝謝了，但是我們不需要幫助。"
 BBA_ethiopia_fascist_events.03.t: "成立一個自治的$gojjam$？"
 BBA_ethiopia_fascist_events.03.desc: "$ETH_hailu_tekle_haymanot$是一位身陷囹圄的$gojjam$王位宣稱者。近日他的一位代表提議幫助[ROOT.GetName]征服[ETH.GetName]，條件是$ETH_hailu_tekle_haymanot$將成為半自治的$gojjam$的領導人。於其國土北部爆發的一場武裝起義想必會大幅削弱[ETH.GetAdjective]部隊，併為我們帶來一場迅速的勝利。"
 BBA_ethiopia_fascist_events.03.a: "這一提議對我們來說頗為有利。"
 BBA_ethiopia_fascist_events.03.b: "謝謝了，但是我們不需要幫助。"
 BBA_ethiopia_fascist_events.04.t: "遭廢黜的$jimma$領導人提供援助"
 BBA_ethiopia_fascist_events.04.desc: "$jimma$最後一任蘇丹的兒子，$ETH_abba_jofir$，主動提出與[ROOT.getName]合作，以換取[ROOT.getName]對$ETH_abba_jofir$重回$jimma$領導人之地位的認可。當然，如果[ROOT.getName]接受這一提議，$jimma$將成為[ROOT.GetAdjective]帝國的一部分，$ETH_abba_jofir$也將對[ROOT.GetAdjective]王位宣誓效忠。"
 BBA_ethiopia_fascist_events.04.a: "一個傀儡蘇丹對我們來說會很有用。"
 BBA_ethiopia_fascist_events.04.b: "謝謝了，但是我們不需要幫助。"
 BBA_ethiopia_fascist_events.05.t: "[FROM.GetName]接受了我們的提議"
 BBA_ethiopia_fascist_events.05.desc: "去往[FROM.GetAdjective]指揮部的任務大獲成功。[ITA.GetLeader]同意了我們進行起義的計劃，並且承諾我們作為半自治的國家延續到戰後。我們得趕快發動起義，以免他們改變主意。"
 BBA_ethiopia_fascist_events.05.a: "這是新時代的開始。"
 BBA_ethiopia_fascist_events.06.t: "意大利人拒絕合作"
 BBA_ethiopia_fascist_events.06.desc: "不幸的是，[FROM.GetLeader]似乎一心想要征服整個埃塞俄比亞。[FROM.GetNameDefCap]徹底地拒絕討論任何和平條約，這意味著所有想要和平解決這場衝突的努力都將付之東流。我們所剩的唯一的希望就是團結在皇帝身邊，爭取一場軍事上的勝利。"
 BBA_ethiopia_fascist_events.06.a: "太不幸了。"
 BBA_ethiopia_fascist_events.07.t: "埃塞俄比亞內戰"
 BBA_ethiopia_fascist_events.07.desc: "[ROOT.GetEthiopianCollaboratorName]公開宣佈將脫離皇帝的統治，並轉而與意大利人合作，還大言不慚地宣稱這是[ROOT.GetName]重獲新生。儘管情況危急，但$ETH_haile_selassie$並不打算就這樣放棄抵抗。戰鬥已經打響；雖然大部分老臣仍然站在皇帝一邊，但這場戰爭的結果恐怕難以因他們的忠誠而改變。"
 BBA_ethiopia_fascist_events.07.a: "邁向勝利！"
 BBA_ethiopia_fascist_events.50.t: "[ETH.GetAdjective]部隊佔領[ROOT.GetAdjective]索馬裡蘭"
 BBA_ethiopia_fascist_events.50.desc: "因我們專注於國內事務，[ETH.GetAdjective]政府抓住了這一時機並奪取了[ROOT.GetAdjective]索馬裡蘭。意識到自己的補給線已被切斷，反抗無望的當地[Root.GetAdjective]權力機構別無選擇，只得將這片領土拱手交出。擺在我們面前的選擇有兩種：要麼正式接受這份屈辱，要麼下定決心奪回屬於我們的領土。"
 BBA_ethiopia_fascist_events.50.a: "我們別無選擇，只能咬緊牙關接受失敗"
 BBA_ethiopia_fascist_events.50.b: "我們不會忍受這種屈辱！"
 BBA_ethiopia_fascist_events.51.t: "[FROM.GetName]接受[ETH.GetName]對索馬裡蘭的控制"
 BBA_ethiopia_fascist_events.51.desc: "意識到已經無力迴天的[FROM.GetName]殘部已經正式接受了我們對前[FROM.GetAdjective]索馬裡蘭領土的管轄。考慮到[FROM.GetName]幾乎沒有奪回這片領土的手段，他們似乎更願意將注意力放在國內事務上，而不是與我們英勇的部隊打個不可開交。"
 BBA_ethiopia_fascist_events.51.a: "[ETH.GetName]日益壯大！"
 BBA_ethiopia_fascist_events.52.t: "[FROM.GetName]拒絕[ETH.GetName]對索馬裡蘭的控制"
 BBA_ethiopia_fascist_events.52.desc: "出人意料地，已然無力迴天的[FROM.GetName]殘部已經拒絕了我們對前[FROM.GetAdjective]索馬裡蘭領土的管轄。儘管[FROM.GetName]幾乎沒有奪回這片領土的手段，他們似乎還是已經下定決心，讓當地的殘兵敗將們面對我們英勇的部隊戰至最後一人。"
 BBA_ethiopia_fascist_events.52.a: "他們最近已經輸了一場戰爭，看來很快又要再輸掉一場了"
 BBA_ethiopia_fascist_events.53.t: "向[ITA.GetAdjective]請求裝備援助"
 BBA_ethiopia_fascist_events.53.desc: "儘管我們在軍事實力和經濟改革方面均已實現了重大的突破，但更多的外來援助始終有益無害。鑑於我們和[ITA.GetAdjective]的緊密關係，他們或許非常樂意輸送一些盈餘的軍事裝備給我們，而我們要做的僅僅是列出“願望清單”。"
 BBA_ethiopia_fascist_events.53.a: "每個士兵都需要一支步槍"
 BBA_ethiopia_fascist_events.53.b: "火炮會威懾敵軍。"
 BBA_ethiopia_fascist_events.54.t: "[FROM.GetName]請求軍事裝備支援"
 BBA_ethiopia_fascist_events.54.desc: "[FROM.GetName]希望我們能夠支援一些軍事裝備，而我們也同意了他們的請求。這樣做能大幅度的推進[FROM.GetAdjective]軍隊的現代化進程，也能幫我們清理掉一些多餘的老舊裝備。"
 BBA_ethiopia_fascist_events.54.a: "我們非常樂意送出一些老舊軍事裝備。"
 BBA_ethiopia_fascist_events.54.b: "不，[FROM.GetName]不能夠變強大。"
 BBA_ethiopia_fascist_events.55.t: "[ITA.GetName]拒絕支援軍事裝備"
 BBA_ethiopia_fascist_events.55.desc: "在一份措辭異常生硬的回覆中，[ITA.GetAdjective]政府拒絕了我們的軍事裝備援助請求。這一決定背後的原因至今尚不清楚。我們只能單純地依靠自己的工業來繼續現代化計劃了。"
 BBA_ethiopia_fascist_events.55.a: "我們就知道他們靠不住。"
 BBA_ethiopia_fascist_events.56.t: "[ITA.GetName]同意支援軍事裝備"
 BBA_ethiopia_fascist_events.56.desc: "[ITA.GetAdjective]政府同意了我們軍事裝備的援助請求。儘管這些確實不是他們最好的裝備，但也無疑將促進我們的現代化計劃。"
 BBA_ethiopia_fascist_events.56.a: "我們從未懷疑他們。"
 BBA_ethiopia_fascist_events.10.t: "俘獲敵人"
 BBA_ethiopia_fascist_events.10.desc: "隨著敵軍的投降，一些高級軍官落入到了我們手中。他們將被暫時關押，但我們很有希望說服其中的一些人在之後加入到我們的事業中來。"
 BBA_ethiopia_fascist_events.10.a: "很好。"
 captured_ethiopian_commanders_tt: "$ETH_seyoum_mengesha$，$ETH_ayalew_birru$和$ETH_ras_kassa$將被關押"
 captured_ethiopian_commanders_jimma_tt: "$ETH_seyoum_mengesha$，$ETH_ayalew_birru$，$ETH_balcho_safo$，$ETH_tadesse_birru$和$ETH_ras_kassa$將被關押"
 BBA_ethiopia_fascist_events.20.t: "[FROM.GetNameDefCap]宣佈獨立"
 BBA_ethiopia_fascist_events.20.desc: "[FROM.GetLeader]宣佈[FROM.GetNameDef]不再承認[ROOT.GetAdjective]的宗主國地位。[FROM.GetNameDefCap]希望儘可能同[ROOT.GetNameDef]保持良好關係，但[FROM.GetLeader]也聲稱他們已準備好武裝起來，以在必要的時候捍衛他們的獨立。"
 BBA_ethiopia_fascist_events.20.a: "他們需要來點教訓。"
 BBA_ethiopia_fascist_events.20.b: "我們還有更重要的事情去關心"
 BBA_ethiopia_fascist_events.21.t: "[ETH.GetAdjective]榮光重現"
 BBA_ethiopia_fascist_events.21.desc: "作為一個令人驚訝的事態發展，[FROM.GetLeader]接受了[ROOT.GetAdjective]的獨立聲明。從此刻起，[FROM.GetNameDef]將不再對[ROOT.GetAdjective]的政治施加影響，無論是從內部還是外部。激動的人們聚集在[ROOT.Capital.GetCapitalVictoryPointName]的主要廣場上，慶祝[ROOT.GetLeader]的領導。"
 BBA_ethiopia_fascist_events.21.a: "掙脫枷鎖了"
 BBA_ethiopia_fascist_events.22.t: "恢復鬥爭"
 BBA_ethiopia_fascist_events.22.desc: "不出所料，[FROM.getLeader]拒絕了此前[ROOT.GetLeader]發出的獨立請求。按照計劃，[ROOT.GetAdjective]武裝力量已經控制了國家的戰略要點。這一次，國家做好了準備。"
 BBA_ethiopia_fascist_events.22.a: "我們將贏得屬於我們的自由"
 BBA_ethiopia_fascist_events.23.t: "抵抗戰士"
 BBA_ethiopia_fascist_events.23.desc: "有組織的抵抗戰士團體正在敵後戰線被建立起來。這些非正規軍同我們並肩對抗[ITA.GetAdjective]壓迫者。他們的戰果也許不是最多的，但他們無疑將導致敵軍混亂和分裂。"
 BBA_ethiopia_fascist_events.23.a: "一個最受歡迎的幫助。"
 BBA_ethiopia_fascist_events.57.t: "[FROM.GetName]請求外包武器生產許可"
 BBA_ethiopia_fascist_events.57.desc: "[FROM.GetName]請求了一個武器外包許可，以便[ITA.GetAdjective]公司能借此在該國建立工廠用於生產軍事裝備。中標的公司領導這無疑將感激這次擴張的機會。然而，一旦[FROM.GetName]反叛，我們將同一個知悉我們許多弱點的敵人作戰。"
 BBA_ethiopia_fascist_events.57.a: "強化[FROM.GetName]將解放我們在該地區的力量。"
 BBA_ethiopia_fascist_events.57.b: "我們承擔不起我們的設計落入敵人手中的風險。"
 BBA_ethiopia_fascist_events.58.t: "[ITA.GetName]同意了外包請求"
 BBA_ethiopia_fascist_events.58.desc: "多虧了我們的外交努力，[ITA.GetLeader]已允許[ITA.GetAdjective]公司在我國設立工廠。這將大幅提高我們的科研與裝備自給能力。"
 BBA_ethiopia_fascist_events.58.a: "[ETH.GetName]歷史上的偉大一天。"
 BBA_ethiopia_fascist_events.59.t: "[ITA.GetName]拒絕了我們的外包請求"
 BBA_ethiopia_fascist_events.59.desc: "我們可悲的外交官們未能說服[ITA.GetLeader]對我們發放武器外包許可，深深打擊了我國的軍事與工業發展。"
 BBA_ethiopia_fascist_events.59.a: "真是錯失良機。 "
 BBA_ethiopia_fascist_events.60.t: "外包武器生產"
 BBA_ethiopia_fascist_events.60.desc: "由於[ITA.GetAdjective]人擔心他們的工業機密落入敵人手中，因此不願與我們分享他們全部的設計圖紙。因此，我們需要謹慎評估索要[ITA.GetAdjective]哪方面的外包生產才能最大程度地提升我國的軍事水平。"
 BBA_ethiopia_fascist_events.60.a: "陸軍的現代化最為重要。"
 BBA_ethiopia_fascist_events.60.b: "空軍在之後的戰爭中將更加重要。"
 BBA_ethiopia_fascist_events.61.t: "[FROM.GetName]請求武器援助以推翻[ITA.GetAdjective]統治"
 BBA_ethiopia_fascist_events.61.desc: "[ETH.GetAdjective]外交官秘密向我們提出了武器援助請求。看起來[ITA.GetName]在治理他們最近獲得的自治領土上出師不利，當地政府正在尋求外國援助以伺機推翻他們的宗主統治。無論成功與否，這場叛亂無疑都將會分散[ITA.GetAdjective]軍隊的注意力並削弱他們的實力。不過，他們要是發現我們從中作梗，怕是少不了一些負面影響。"
 BBA_ethiopia_fascist_events.61.a: "讓那些[ITA.GetAdjective]人忙活去吧。"
 BBA_ethiopia_fascist_events.61.b: "我們不會幫助潛在的敵人。"
 BBA_ethiopia_fascist_events.62.t: "[FROM.GetName]同意向我們援助武器"
 BBA_ethiopia_fascist_events.62.desc: "[FROM.GetAdjective]外交官已表明他們願意援助我們武器推翻[ITA.GetAdjective]統治。當然，要是[ITA.GetAdjective]人發現了這些武器，我們要矢口否認他們的任何參與。"
 BBA_ethiopia_fascist_events.62.a: "勝利已然顯現。"
 BBA_ethiopia_fascist_events.63.t: "[FROM.GetName]拒絕向我們援助武器"
 BBA_ethiopia_fascist_events.63.desc: "[FROM.GetAdjective]外交官回絕了我們秘密獲取武器援助的嘗試。他們似乎不確定我們是否可信，畢竟我們還在[ITA.GetAdjective]人的影響之下。他們可能也不願在這個動盪的年代冒險激怒[ITA.GetAdjective]政府。"
 BBA_ethiopia_fascist_events.63.a: "一群鼠目寸光的傢伙。"
 BBA_ethiopia_fascist_events.64.t: "[FROM.GetName]索要[550.GetName]"
 BBA_ethiopia_fascist_events.64.desc: "作為對[ITA.GetName]保持忠誠的獎勵，或者換個角度說，作為補償，[ETH.GetLeader]希望能控制[550.GetName]地區。在入侵埃塞俄比亞時，[ETH.GetLeader]對打破僵局起到了至關重要的作用，而且此舉對維持雙方的良好關係有很大幫助。不過，[ITA.GetAdjective]人民可能不大能理解為什麼我們要把領土送給他們。"
 BBA_ethiopia_fascist_events.64.a: "我們應當獎勵他們的忠誠。 "
 BBA_ethiopia_fascist_events.64.b: "他們沒資格提出要求。"
 BBA_ethiopia_fascist_events.65.t: "[FROM.GetName]索要[559.GetName]和[844.GetName]"
 BBA_ethiopia_fascist_events.65.desc: "作為對[ITA.GetName]保持忠誠的獎勵，或者換個角度說，作為補償，[ETH.GetLeader]希望能控制[559.GetName]和[844.GetName]。在入侵埃塞俄比亞時，[ETH.GetLeader]對打破僵局起到了至關重要的作用，而且此舉對維持雙方的良好關係有很大幫助。不過，[ITA.GetAdjective]人民可能不大能理解為什麼我們要把領土送給他們。"
 BBA_ethiopia_fascist_events.65.a: "我們應當獎勵他們的忠誠"
 BBA_ethiopia_fascist_events.65.b: "他們沒資格提出要求。"
 BBA_ethiopia_fascist_events.66.t: "[ITA.GetName]同意領土補償"
 BBA_ethiopia_fascist_events.66.desc: "[ITA.GetName]已經欣然接受了我們對領土的控制權索取。這標誌著意[ETH.GetAdjective]關係翻開了新的篇章。"
 BBA_ethiopia_fascist_events.66.a: "未來屬於[ETH.GetAdjective]人民。"
 BBA_ethiopia_fascist_events.67.t: "[ITA.GetName]拒絕領土補償"
 BBA_ethiopia_fascist_events.67.desc: "[ITA.GetAdjective]外交官們憤慨地回應了我們提出的領土補償請求。他們聲稱，[ITA.GetAdjective]人民不可能同意交出用鮮血換來的領土，更別說是交給曾經的敵人了。"
 BBA_ethiopia_fascist_events.67.a: "他們這是在考驗我們的忠誠……"
 BBA_ethiopia_fascist_events.68.t: " [ITA.GetAdjective]軍械庫遭到襲擊"
 BBA_ethiopia_fascist_events.68.desc: "昨夜，[ITA.GetAdjective]的軍械庫遭到襲擊，大量的武器流失。雖然沒有什麼實質性證據，但意大利政府還是氣急敗壞的指責我們策劃並實施了整個事件。當然，我們士兵手裡那鋥光瓦亮、煥然一新的[ITA.GetAdjective]步槍還是讓他們覺得疑點重重……"
 BBA_ethiopia_fascist_events.68.a: "根本就是無的放矢。"
 BBA_ethiopia_fascist_events.69.t: "[FROM.GetName]請求派遣軍事顧問"
 BBA_ethiopia_fascist_events.69.desc: "[ETH.GetName]的領導人不得不承認他們軍隊的確羸弱不堪，因此希望我們派遣一些軍官入駐他們的總參謀部；教授關於現代戰爭的各項技藝。"
 BBA_ethiopia_fascist_events.69.a: "一個強大的[FROM.GetName]可以讓我們騰出手，把心思放在周邊地區。"
 BBA_ethiopia_fascist_events.69.b: "我們的軍官在其他地方有了用武之地。"
 ETH_send_ita_generals_tt: "\n§Y$ITA_giuseppe_tellera$§!、§Y$ITA_mario_berti$§!及§Y$ITA_alessandro_pirzio_biroli$§!將會被派往埃塞俄比亞。"
 BBA_ethiopia_fascist_events.70.t: "[FROM.GetName]同意派遣軍官"
 BBA_ethiopia_fascist_events.70.desc: "為了未來的長遠發展，[FROM.GetName]同意派遣一些軍官入住我們的總參謀部。我們也希望能學習到如何在現代戰場上利用好這些新式裝備。"
 BBA_ethiopia_fascist_events.70.a: "很好。"
 BBA_ethiopia_fascist_events.71.t: "[FROM.GetName]拒絕派遣軍官"
 BBA_ethiopia_fascist_events.71.desc: "[FROM.GetName]表示，由於目前他們的軍官們都有公務在身，因此無法向我們的總參謀部派遣軍官。不過，他們向我們運送了一批額外的步兵裝備以示支持。"
 BBA_ethiopia_fascist_events.71.a: "這總比什麼都沒有好。"
 #Communist Ethiopia
 BBA_ethiopia_communist_events.01.t: "[ETH.GetAdjective]共產主義者尋求援助"
 BBA_ethiopia_communist_events.01.desc: "[ETH.GetName]共產主義勢力的領導同志希望我們能向他們提供援助以打擊意大利法西斯勢力。目前，位於[ETH.Capital.GetCapitalVictoryPointName]的新政權並不穩定，如果我們向這些非洲同志提供幫助，那我們也許能獲得一個願意配合我們外交野心的盟友。不過，援助他們可能會使戰爭升級，而且肯定會惹惱[ITA.GetName]人。"
 BBA_ethiopia_communist_events.01.a: "我們會幫助這些困難中的共產主義同胞。"
 BBA_ethiopia_communist_events.01.b: "我們對非洲的殖民糾紛不感興趣。"
 BBA_ethiopia_communist_events.02.t: "[SOV.GetName]拒絕了援助請求"
 BBA_ethiopia_communist_events.02.desc: "儘管我們懇切地尋求[SOV.GetNameDef]的援手，但他們選擇了視而不見。然而，這些小小的挫折絲毫不會動搖我們對抗法西斯勢力的決心。我們應該另尋出路——從世界範圍內更多的反法西斯力量那裡汲取幫助。"
 BBA_ethiopia_communist_events.02.a: "再也沒有階級團結了。"
 BBA_ethiopia_communist_events.03.t: "[SOV.GetName]向[ETH.GetName]伸出援手"
 BBA_ethiopia_communist_events.03.desc: "近日，有報告稱：[ETH.GetAdjective]軍隊講起了俄語；而且用上了[SOV.GetAdjective]武器，這不由得讓我們緊張起來。可以想像到，[SOV.GetName]派遣這些所謂的“志願兵”來為[ETH.GetLeader]戰鬥，不僅是為了在非洲釋放自己的影響力；更是想削弱[ITA.GetLeader]的內閣在[ITA.GetName]的地位。"
 BBA_ethiopia_communist_events.03.a: "他們將為侵略付出代價。"
 BBA_ethiopia_communist_events.04.t: "[SOV.GetName]同意幫助我們"
 BBA_ethiopia_communist_events.04.desc: "[SOV.GetName]同意在將來的幾個月中給予我們物質幫助，並允許[SOV.GetAdjective]軍隊以“志願軍”的形式協助我們同[ITA.GetName]戰鬥。毫無疑問，這將會使戰爭的天平向我們傾斜，然而我們並不知道[ITA.GetAdjective]將對[SOV.GetAdjective]軍隊參戰作何反應。"
 BBA_ethiopia_communist_events.04.a: "我們將一同擊敗非洲的法西斯。"
 BBA_ethiopia_communist_events.05.t: "推翻[ROOT.GetLeader]"
 BBA_ethiopia_communist_events.05.desc: "今天，被稱為黑獅的反法西斯組織和軍隊一同策劃了一場針對[ROOT.GetLeader]政府的顛覆行動。皇帝本該視察軍隊，但一群不滿的士兵卻突然調轉槍口，逮捕了皇帝和他的軍官。\n\n與此同時，位於[ROOT.Capital.GetCapitalVictoryPointName]的黑獅佔領了該城市的關鍵基礎設施與皇帝的宮寢。許多軍隊、警察部隊內的效忠派在小規模軍事衝突中被殺害，[ETH.GetName]的其餘地區正由臨時政府掌控。大部分人已經在與[ITA.GetName]的戰爭中筋疲力竭，不得不屈服於新政府。現在，新政府的首要事項就是決定[ROOT.GetLeader]的命運。"
 BBA_ethiopia_communist_events.05.a: "我們不能冒著失去人民的支持的風險。流放他。"
 BBA_ethiopia_communist_events.05.b: "人民的所有敵人都必須為他們的罪行負責。把他關起來。"
 BBA_ethiopia_communist_events.06.t: "臨時政府解體"
 BBA_ethiopia_communist_events.06.desc: "支持[SOV.GetName]的軍官解散了[ETH.GetAdjective]臨時政府。這些軍官宣稱他們收到了來自[SOV.GetAdjective]情報機關的證據，證明[ROOT.GetLeader]領導的政府已經背叛了人民。證據表明，政府成員正在討論是否要允許[ITA.GetAdjective]軍隊佔領國家以換取海量個人財富。在與黑獅軍團槍戰後，前政府成員均已被逮捕或被宣佈死亡。\n\n軍隊現在已經接管了政府，正在恢復國家秩序並根除[ROOT.GetLeader]的黨羽。目前仍不清楚新成立的軍事行政委員會是否將永久存在。"
 BBA_ethiopia_communist_events.06.indy_desc: "在情報部門的協助下，軍官們聲稱他們擁有確鑿的證據證明：[ROOT.GetLeader]領導的內閣早已背叛了人民。內閣成員密謀討論關於放任[ITA.GetAdjective]軍隊佔領整個國家，以此來換取自己的榮華富貴。因此，軍官們立即解散了[ETH.GetAdjective]臨時政府。在與黑獅軍團發生大規模槍戰後，前政府成員均已被逮捕或被擊斃。\n\n軍隊現在已經接管了國家的領導權，在逐步恢復國家秩序的同時清除[ROOT.GetLeader]的黨羽。"
 BBA_ethiopia_communist_events.06.a: "這些叛徒不過是罪有應得。"
 BBA_ethiopia_communist_events.07.t: "[SOV.GetNameDefCap]要求與[ETH.GetName]停戰"
 BBA_ethiopia_communist_events.07.desc: "[SOV.GetNameDefCap]要求我們與[ETH.GetAdjective]必須立刻終止敵對關係。因為[SOV.GetAdjective]已經在[ETH.Capital.GetCapitalVictoryPointName]大力扶持共產主義政權，如今的[ETH.Capital.GetCapitalVictoryPointName]也已成為了他們的勢力範圍。蘇聯更是威脅稱：如果事態升級，便會訴諸武力。如果我們答應了他們的要求，那會使我們的祖國蒙羞。倘若不答應，那隻會是雪上加霜。"
 BBA_ethiopia_communist_events.07.a: "我們絕不與共產主義者談判。"
 BBA_ethiopia_communist_events.07.b: "我們現在不能冒險將衝突升級。"
 BBA_ethiopia_communist_events.08.t: "[ETH.GetName]請求提供步兵裝備"
 BBA_ethiopia_communist_events.08.desc: "由於缺乏基礎裝備供應，[ETH.GetAdjective]軍隊完全無法滿足他們士兵的裝備配置。因此，[ETH.GetName]希望我們提供一些步兵裝備，以此援助他們與意大利的戰鬥。但如果我們真的把裝備給他們，那和[ITA.GetName]之間的關係也恐怕會降至冰點。"
 BBA_ethiopia_communist_events.08.a: "我們不會提供任何裝備。"
 BBA_ethiopia_communist_events.08.b: "我們當然會幫助他們。"
 BBA_ethiopia_communist_events.09.t: "[SOV.GetNameDefCap]送來步兵裝備"
 BBA_ethiopia_communist_events.09.desc: "我們向[SOV.GetName]所請求的步兵裝備已經送出，這有助於我們進行對[ITA.GetName]的頑強鬥爭，進而幫助我們在對抗法西斯的戰爭中取得勝利。"
 BBA_ethiopia_communist_events.09.a: "戰爭正在向我們我們有利的方向傾斜。"
 BBA_ethiopia_communist_events.10.t: "[SOV.GetNameDefCap]拒絕送出裝備"
 BBA_ethiopia_communist_events.10.desc: "[SOV.GetName]拒絕向我們提供步兵裝備。儘管我們的代表團竭盡所能與[SOV.capital.GetCapitalVictoryPointName]交涉，但看起來他們正忙於解決自己的問題而沒有餘裕來幫助我們。"
 BBA_ethiopia_communist_events.10.a: "他們背叛了我們。"
 BBA_ethiopia_communist_events.11.t: "[ETH.GetName]請求派遣軍事顧問"
 BBA_ethiopia_communist_events.11.desc: "[ETH.GetNameDefCap]的新領導人不得不承認他們軍隊在應對現代戰爭時的孱弱。因此希望我們幫助他們改造軍隊。這不僅讓我們軍官擁有了不同環境下的作戰經驗，更是左右[ETH.GetName]內部權力平衡的天賜良機。"
 BBA_ethiopia_communist_events.11.a: "這是一個我們不能錯過的機會。"
 BBA_ethiopia_communist_events.11.b: "我們不能冒讓外國勢力得知我們戰術的風險。"
 BBA_ethiopia_communist_events.12.t: "[SOV.GetAdjective]裝備抵達"
 BBA_ethiopia_communist_events.12.desc: "[SOV.GetName]所承諾提供的裝備已經到達我們的軍用倉庫，並正在我們的隊伍中分發。"
 BBA_ethiopia_communist_events.12.a: "好極了！"
 BBA_ethiopia_communist_events.14.t: "[ETH.GetNameDefCap]請求協助建立空軍"
 BBA_ethiopia_communist_events.14.desc: "[ETH.GetNameDefCap]請求我們幫助其發展獨立的空軍部隊。他們希望我們能向他們提供我們庫存中盈餘的老式戰機，並由我們的志願者陪同訓練他們的飛行員。這是一個讓我們的飛行員獲得經驗並檢驗我們的裝備在對抗[ITA.GetAdjective]人時的是否有效的大好機會。"
 BBA_ethiopia_communist_events.14.a: "非常棒的提案。"
 BBA_ethiopia_communist_events.14.b: "我們需要保持我們的飛機儲備。"
 BBA_ethiopia_communist_events.15.t: "[SOV.GetNameDefCap]派出軍事顧問"
 BBA_ethiopia_communist_events.15.desc: "來自[SOV.GetNameDef]的將領們今天抵達[ROOT.Capital.GetCapitalVictoryPointName]。顧問們正在瞭解我們武裝部隊當前的架構以及目前與[ITA.GetName]的戰爭狀態。希望他們能夠幫助我們的部隊實現現代化。"
 BBA_ethiopia_communist_events.15.a: "正應如此。"
 BBA_ethiopia_communist_events_15_tt: "§Y$SOV_semyon_budyonny$§!與§Y$SOV_vasily_kuznetsov$§!將成為可用的將領。"
 BBA_ethiopia_communist_events.16.t: "[SOV.GetNameDefCap]拒絕派遣軍事顧問"
 BBA_ethiopia_communist_events.16.desc: "在[SOV.Capital.GetCapitalVictoryPointName]的我們所謂的朋友拒絕派遣軍事顧問來幫助我們進行軍隊現代化。儘管有這樣的挫折，我們仍將獨自戰勝法西斯並推進軍隊現代化。"
 BBA_ethiopia_communist_events.16.a: "[SOV.GetAdjective]並不可靠。"
 BBA_ethiopia_communist_events.17.t: "[ETH.GetNameDefCap]請求對抗[ITA.GetAdjective]裝甲部隊的援助"
 BBA_ethiopia_communist_events.17.desc: "一個來自[ETH.GetNameDef]的代表團要求我國政府和軍方提供盈餘的裝甲載具來幫助他們同[ITA.GetName]的戰爭。當與[ITA.GetAdjective]裝甲部隊交戰時，[ETH.GetAdjective]顯然處於下風。如果我方能提供我們的裝備，將無疑幫助他們擊退[ITA.GetAdjective]的裝甲部隊。然而，這也將導致[SOV.GetNameDef]和[ITA.GetName]的關係緊張。"
 BBA_ethiopia_communist_events.17.a: "一個測試我方裝備的絕佳機會。"
 BBA_ethiopia_communist_events.17.b: "我們不能冒戰爭升級的危險。"
 BBA_ethiopia_communist_events.18.t: "[SOV.GetNameDefCap]拒絕提供裝甲載具"
 BBA_ethiopia_communist_events.18.desc: "[SOV.GetNameDefCap]拒絕向我們提供裝甲載具以對抗[ITA.GetAdjective]。[SOV.GetAdjective]似乎正擔心這將導致他們與[ITA.GetAdjective]的緊張關係升級。 "
 BBA_ethiopia_communist_events.18.a: "我們必須另尋他法。"
 BBA_ethiopia_communist_events.19.t: "[SOV.GetNameDefCap]提供裝甲載具"
 BBA_ethiopia_communist_events.19.desc: "[SOV.GetNameDefCap]向我們提供了裝甲載具來幫助我們抵抗[ITA.GetAdjective]人。儘管這並非他們的最新設計，但這些載具在前線將無疑被證明是有價值的，哪怕只是提升士氣也好。"
 BBA_ethiopia_communist_events.19.a: "好極了！"
 BBA_ethiopia_communist_events.20.t: "[SOV.GetNameDefCap]拒絕訓練飛行員"
 BBA_ethiopia_communist_events.20.desc: "[SOV.GetNameDefCap]拒絕了為我方訓練飛行員的提議。我們本寄希望於此舉能加快我們空軍的擴充，但似乎這些社會主義現在優先事項。儘管如此，我們還是得到了自行生產飛機所需的設計圖。"
 BBA_ethiopia_communist_events.20.a: "顯然我們能自己解決問題。"
 BBA_ethiopia_communist_events.21.t: "[SOV.GetNameDefCap]同意訓練飛行員"
 BBA_ethiopia_communist_events.21.desc: "我們的[SOV.GetName]同志同意幫助我們訓練飛行員。他們還慷慨地提供了一批飛機供我們使用。這將極大地加快我們建立一支能夠對抗[ITA.GetAdjective]的空軍的計劃。"
 BBA_ethiopia_communist_events.21.a: "感謝[SOV.GetAdjective]同志！"
 BBA_ethiopia_communist_events.22.t: "[ITA.GetNameDefCap]拒絕與[ETH.GetNameDefCap]停戰"
 BBA_ethiopia_communist_events.22.desc: "[ITA.GetAdjective]人對我們讓他們和[ETH.GetName]停戰的要求置之不理。顯然他們唯一能理解的語言就是暴力。如果我們堅持當前的方針，那麼[SOV.GetName]和[ITA.GetName]的戰爭將是不可避免的。如果我們退讓，我們基本上將失去從支持[ETH.GetName]過程中獲得的一切，而我們在國際舞臺上的外交分量也將一落千丈。"
 BBA_ethiopia_communist_events.22.a: "他們會對此感到後悔的。"
 BBA_ethiopia_communist_events.22.b: "我們還沒準備好開戰。"
 BBA_ethiopia_communist_events.23.t: "[SOV.GetNameDefCap]讓步"
 BBA_ethiopia_communist_events.23.desc: "蘇聯撤回了他們的開戰說辭，轉而對我們在埃塞俄比亞的行動表達了強烈的抗議。似乎他們的戰爭威脅不過是虛張聲勢而已。"
 BBA_ethiopia_communist_events.23.a: "[ITA.GetName]的勝利！"
 BBA_ethiopia_communist_events.24.t: "[SOV.GetNameDefCap]掌控外交政策"
 BBA_ethiopia_communist_events.24.desc: "[ITA.GetName]與[SOV.GetNameDef]之間的外交對抗現已爆發公開衝突。[SOV.GetAdjective]保證了我們的獨立，現在將幫助我們在戰場上擊退[ITA.GetAdjective]。然而，這似乎是以我們國家的獨立為代價的。從現在開始，我們需要確保我們的外交政策與[SOV.Capital.GetCapitalVictoryPointName]完全一致。"
 BBA_ethiopia_communist_events.24.a: "這很有必要，目前來看。"
 BBA_ethiopia_communist_events.25.t: "[ETH.GetNameDefCap]請求調停"
 BBA_ethiopia_communist_events.25.desc: "[ETH.GetNameDefCap]向我們請求幫助，希望我們能夠在他們和[ITA.GetAdjective]之間進行調停。[ITA.GetAdjective]一直以來都不為國聯強烈的反對意見所動，因此我們若想進行調停很可能要訴諸武力威脅。在那之前，我們必須仔細思考為了[ETH.GetNameDef]我們願意冒多大的風險。 "
 BBA_ethiopia_communist_events.25.a: "我們會幫助他們結束這場戰爭。"
 BBA_ethiopia_communist_events.25.b: "我們會幫助他們，但是是有代價的。"
 BBA_ethiopia_communist_events.25.c: "這太冒險了。"
 BBA_ethiopia_communist_events.26.t: "[SOV.GetNameDefCap]拒絕調停衝突"
 BBA_ethiopia_communist_events.26.desc: "[SOV.GetNameDefCap]已經排除了在我們和[ITA.GetAdjective]之間進行調解的可能性。他們稱[ITA.GetName]不願聽取國際聯盟的意見，並因此威脅使用武力。[SOV.GetLeader]認為兩國之間的衝突升級為戰爭的風險難以承受。"
 BBA_ethiopia_communist_events.26.a: "他們在利用我們給[ITA.GetAdjective]人放血。"
 BBA_ethiopia_communist_events.27.t: "[SOV.GetNameDefCap]無法阻止[ITA.GetAdjective]侵略。"
 BBA_ethiopia_communist_events.27.desc: "[SOV.GetNameDefCap]已經背棄了幫助結束[ITA.GetName]侵略戰爭的承諾。看來他們的參戰意願不過是虛張聲勢罷了。現在我們面臨艱鉅的任務，要靠自己結束這場戰爭。"
 BBA_ethiopia_communist_events.27.a: "他們背叛了我們。"
 BBA_ethiopia_communist_events.28.t: "[SOV.GetNameDefCap]要求調整外交政策"
 BBA_ethiopia_communist_events.28.desc: "[ITA.GetName]和[SOV.GetNameDef]之間的外交對抗現已平息，[ITA.GetAdjective]同意結束對我們的戰爭。[SOV.GetAdjective]保證了我們的獨立性，並明確表示他們認為對我們的攻擊就是對他們的攻擊。然而，他們幫助結束這場戰爭的代價似乎是我們國家的獨立。從現在開始，我們需要確保我們的外交政策與[SOV.Capital.GetCapitalVictoryPointName]完全一致。"
 BBA_ethiopia_communist_events.28.a: "我們暫且同意。"
 BBA_ethiopia_communist_events.29.t: "[SOV.GetNameDefCap]成功調解爭端"
 BBA_ethiopia_communist_events.29.desc: "隨著[ITA.GetAdjective]同意停止對我們的侵略，[ITA.GetName]及[SOV.GetNameDef]兩方的外交爭端最終平息。這是對抗法西斯主義的一次偉大勝利，然而和平還遠遠沒有到來。我們更應該和[SOV.Capital.GetCapitalVictoryPointName]的朋友保持長期的通力合作。"
 BBA_ethiopia_communist_events.29.a: "我們對此感激不盡。"
 bba_news.1.t: "[SOV.GetName]要求意埃戰爭停戰"
 bba_news.1.desc: "世界各國的領導人在今天都被大國之間擦槍走火的事情嚇了一跳。蘇聯領導人[SOV.GetLeader]要求[ITA.GetLeader]停止[ITA.GetName]對[ETH.GetNameDef]發動的不義戰爭。[SOV.GetLeader]明確表示如果[ITA.GetName]拒絕接受要求，[SOV.GetLeader.GetSheHe]將動用武力迫使意大利停戰。近幾個月來，[SOV.GetAdjective]非常樂意為[ETH.GetNameDef]提供裝備與建議。很明顯，蘇聯已經將埃塞俄比亞當做了自己的勢力範圍。"
 bba_news.1.a: "他們是在虛張聲勢嗎？"
 bba_news.2.t: "[ITA.GetName]同意[ETH.GetNameDefCap]的和約"
 bba_news.2.desc: "\n事情發生了令人驚訝的轉折，[ITA.GetName]同意與[ETH.GetName]停火。[ITA.GetAdjective]軍隊開始後撤至意大利與[ETH.GetNameDef]的原有邊境，放棄了戰時奪取的領土。[SOV.GetNameDefCap]願意為埃塞俄比亞而開戰的堅定決心明顯影響了[ITA.GetLeader]的撤軍決定。[ITA.GetAdjective]社會對這場國恥的反應還有待觀察。"
 bba_news.2.a: "[ITA.GetLeader]能挺過去嗎？"
 bba_news.3.t: "意大利—[ETH.GetAdjective]停火協議"
 bba_news.3.desc: "隨著[ETH.GetName]的戰事變為消耗戰，[ITA.GetAdjective]人不得不開始停火談判。很多人以為[ETH.GetAdjective]軍隊在最近國內的共產主義起義後會分崩離析，但是[ETH.GetLeader]力圖扭轉戰局，讓大部分國土免於[ITA.GetAdjective]的侵佔。然而，因為東非大片領土仍然由[ITA.GetAdjective]統治，很難說這次來之不易的和平是否會持續下去。 "
 bba_news.3.a: "這持久不了的。 "
 bba_news.4.t: "埃塞俄比亞發生共產主義政變"
 bba_news.4.desc: "軍方和被稱為“黑獅”的反法西斯組織策劃了針對$ETH_haile_selassie$帝國政府的政變。皇帝在視察部隊的時候遭到了他們的襲擊並被逮捕。\n\n與此同時，黑獅組織佔領了[ROOT.Capital.GetCapitalVictoryPointName]的關鍵設施，包括皇帝的居所。許多忠於皇帝的軍警在小規模衝突中喪生，這個國家目前正處在具有共產主義傾向的臨時政府的控制之下。\n\n多數人民早已在與[ITA.GetName]的戰爭中筋疲力竭，只是簡單的接受了新政府的統治。 "
 bba_news.4.a: "革命之火開始燎原了！"
 bba_news.4.b: "共產主義威脅正在蔓延。"
 bba_news.5.t: "所羅門帝國成立"
 bba_news.5.desc_owns_454: "[ETH.GetLeader]基於自己據稱可追溯至《聖經》中所羅門王的皇室血統，宣佈自己是[454.GetName]的正統君王。他同時宣佈埃塞俄比亞將重建為所羅門帝國。在從列強手中奪取[454.GetName]之後，[ETH.GetLeader]計劃遷都於此地。至於埃塞俄比亞所羅門帝國的再興將如何衝擊地緣政治，仍然有待觀察。 "
 bba_news.5.desc_does_not_own_454: "[ETH.GetLeader]基於自己據稱可追溯至《聖經》中所羅門王的皇室血統，宣佈自己是[454.GetName]的正統君王。毫無疑問，接二連三的領土爭端會讓本地區內各國戰戰兢兢。不過至於埃塞俄比亞所羅門王朝的再興將如何衝擊地緣政治，仍然有待觀察。 "
 bba_news.5.a: "所羅門王真正的繼承者萬歲！"
 bba_news.5.b: "簡直是瘋了。"
 bba_news.6.t: "錫安帝國成立"
 bba_news.6.desc: "埃塞俄比亞皇帝[ETH.GetLeader]在一系列異想天開的事態轉折後改信了一個名為“拉斯塔法裡教”的加勒比小眾教派。[ETH.GetLeader]明顯不僅僅滿足於做皇帝，他現在被拉斯塔法裡教徒頂禮膜拜，後者視他為名為“耶和華”的上帝化身。埃塞俄比亞現在改稱為“錫安帝國”。至於這次宗教衝突將如何影響埃塞俄比亞外交政策與地緣穩定，還有待觀察。"
 bba_news.6.a: "讚美耶和華！"
 bba_news.6.b: "簡直是瘋了。"
 bba_news.7.t: "[ITA.GetName]試圖吞併[AFA.GetNameDef]"
 bba_news.7.desc: "有流言稱[ITA.GetAdjective]軍隊將很快強佔[AFA.GetNameDef]。有人目擊到[ITA.GetAdjective]部隊正在這個與世隔絕的國家的邊境線上集結，消息稱[AFA.Capital.GetCapitalVictoryPointName]受到了和平投降的外交施壓。[AFA.GetLeader]是否將頂住[ITA.GetAdjective]的壓力還有待觀察，不過情況不容樂觀。 "
 bba_news.7.a: "太可怕了。"
 bba_news.7.b: "我們需要準備不可避免之事。"
 bba_news.7.c: "不可避免。"
 bba_news.8.t: "[AFA.GetName]屈從於[ITA.GetAdjective]的要求"
 bba_news.8.desc: "不出大部分人意料，[AFA.GetNameDef]接受了向[ITA.GetAdjective]屈服的要求。[AFA.GetAdjective]政府堅持不懈地希望避免被佔領的命運，但是此區域的殖民勢力很明顯都不想出手相助，而相鄰的[ETH.GetName]也無法抽調部隊支援。該國政府在絕望的情景下，選擇屈從於[ITA.GetAdjective]的施壓，希望其民眾能夠免於兵災。\n\n[ITA.GetAdjective]軍隊現在正向這個小國進軍，準備佔據與[ETH.GetNameDef]接壤的陣位。目前還不清楚佔領是否是永久性的，也不知道這將如何影響[ITA.GetAdjective]與[ETH.GetName]的大戰。 "
 bba_news.8.a: "不出意料，何其不幸。"
 bba_news.8.b: "我們要部署更多部隊了。"
 bba_news.8.c: "他們做出了明智的選擇。"
 BBA_ethiopia_communist_events.30.t: "[ETH.GetNameDefCap]要求停火"
 BBA_ethiopia_communist_events.30.desc: "來自[ETH.GetNameDefCap]的代表請求在當下我們間的衝突中停火。戰爭沒有像我們所期望的那樣迅速結束，而停火將使我們有機會加強我們在該地區的地位或是處理其他緊迫的問題。"
 BBA_ethiopia_communist_events.30.a: "我們會停火的，至少是現在。 "
 BBA_ethiopia_communist_events.30.b: "勝利在握，我們現在不能停下。"
 BBA_ethiopia_communist_events.31.t: "[ITA.GetNameDefCap]同意停火"
 BBA_ethiopia_communist_events.31.desc: "[ITA.GetAdjective]已同意在當下我們間的衝突中停火。希望這可以讓我們有機會在兩國間建立長久的和平。然而，我們也應保持警惕，因為衝突隨時可能再度爆發。"
 BBA_ethiopia_communist_events.31.a: "終於，血腥的衝突結束了。"
 BBA_ethiopia_communist_events.32.t: "[ITA.GetNameDefCap]拒絕停火"
 BBA_ethiopia_communist_events.32.desc: "[ITA.GetAdjective]拒絕停火。看起來他們的意圖是徹底毀滅[ETH.GetNameDefCap]。我國人民將意識到和法西斯分子講道理是行不通的，我們的自由需要他們加倍的努力來換取。"
 BBA_ethiopia_communist_events.32.a: "我們將繼續讓他們品嚐苦果。"
 BBA_ethiopia_communist_events.33.t: "厄立特里亞的獨立"
 BBA_ethiopia_communist_events.33.desc: "在我們與[ITA.GetAdjective]的衝突過程中，我們成功地將厄立特里亞從法西斯分子的手中解放出來。現在我們有機會讓該地區的人民獲得獨立。然而由於[ITA.GetAdjective]肯定會對此舉感到懊惱，這可能會破壞我們之間脆弱的和平。"
 BBA_ethiopia_communist_events.33.a: "自由屬於全體人民！"
 BBA_ethiopia_communist_events.33.b: "這太冒險了。"
 BBA_ethiopia_communist_events.34.t: "索馬里人的獨立"
 BBA_ethiopia_communist_events.34.desc: "在我們與[ITA.GetAdjective]的衝突中，我們成功將索馬裡地區從法西斯主義中解放出來。我們現在有機會讓該地區人民重獲獨立。但[ITA.GetAdjective]毫無疑問會對此極為不滿，這將有可能會破壞我們之間脆弱的和平。"
 BBA_ethiopia_communist_events.34.a: "自由屬於全體人民！"
 BBA_ethiopia_communist_events.34.b: "這太冒險了。"
 BBA_ethiopia_communist_events.35.t: "[ETH.GetNameDefCap]請求我們從非洲撤軍"
 BBA_ethiopia_communist_events.35.desc: "在內戰中幫助過我們之後，來自[ETH.GetNameDef]的代表提出我們現在應該啟動去殖民化進程。他們表示，如果我們忠於在內戰中為之奮鬥的價值觀，則我們也應當支持非洲人民的自治。[ETH.GetLeader]提議與我們共同努力，在摩洛哥北部建立一個獨立的裡夫共和國。"
 BBA_ethiopia_communist_events.35.a: "我們和非洲人民站在一起。"
 BBA_ethiopia_communist_events.35.b: "他們沒權利對我們說三道四。"
 BBA_ethiopia_communist_events.36.t: "[SPC.GetNameDefCap]同意解放裡夫"
 BBA_ethiopia_communist_events.36.desc: "[SPC.GetNameDefCap]已經同意了我國提出的在摩洛哥北部建立獨立裡夫共和國的提案。這是解放非洲和更廣大世界的鬥爭中十分積極的一步。"
 BBA_ethiopia_communist_events.36.a: "對他們的支持得到了回報。 "
 BBA_ethiopia_communist_events.37.t: "[SPC.GetNameDefCap]拒絕去殖民化提案"
 BBA_ethiopia_communist_events.37.desc: "[SPC.GetNameDefCap]憤怒地回應了我們關於讓他們放棄在非洲領土的建議。他們的態度已經表明了，他們並不比他們公然反對的法西斯主義者或帝國主義者好到哪裡去。"
 BBA_ethiopia_communist_events.37.a: "那麼我們將用武力解放他們。"
 BBA_ethiopia_communist_events.37.b: "我們不應該強迫推行這一事務。"
 BBA_ethiopia_communist_events.38.t: "[ETH.GetNameDefCap]提供幫助"
 BBA_ethiopia_communist_events.38.desc: "最近開始與侵略他們祖國的法西斯鏖戰的同時，來自[ETH.GetNameDef]的志願者們業已到達西班牙以協助我們的戰鬥。[ETH.GetLeader]業已承諾[ETH.GetLeader.GetHerHis]對於我們所面臨的情勢的支持，並且承諾在未來的幾個月將提供進一步的物質支持。"
 BBA_ethiopia_communist_events.38.a: "謝謝你，同志。"
 BBA_ethiopia_communist_events.39.t: "裡夫已被解放"
 BBA_ethiopia_communist_events.39.desc: "隨著裡夫地區從[SPC.GetNameDef]解放，我們有機會迫使他們開啟和平談判。當[SPC.GetNameDef]在去殖民化問題上背叛了我們的信任之後，我們可以選擇將戰爭延續至其本土。"
 BBA_ethiopia_communist_events.39.a: "我們已經實現了目標。"
 BBA_ethiopia_communist_events.39.b: "我們必須確保他們不再是威脅。"
 BBA_ethiopia_communist_events.40.t: "[ETH.GetNameDefCap]要求停止敵對行動"
 BBA_ethiopia_communist_events.40.desc: "我們失去了對非洲領土的控制。[ETH.GetName]政府已經實現他們的目標，並與我方取得聯繫，希望進行和平談判。"
 BBA_ethiopia_communist_events.40.a: "我們別無選擇"
 BBA_ethiopia_communist_events.41.t: "[ETH.GetNameDefCap]要求撤回顧問"
 BBA_ethiopia_communist_events.41.desc: "[ETH.GetNameDefCap]已經通知我們，所有我方軍事顧問必須立刻撤離。看來[ETH.GetLeader]打算領導國家走向獨立。如果我們不迅速行動，就有可能失去對[ETH.Capital.GetCapitalVictoryPointName]的掌控。"
 BBA_ethiopia_communist_events.41.a: "畢竟我們為他們付出了這麼多。"
 #SUD Peace
 BBA_ethiopia_communist_events.46.t: "[ETH.GetNameDefCap]提議和談"
 BBA_ethiopia_communist_events.46.desc: "[ETH.GetAdjective]的外交官向我們提出了一份和平草議。而條件是：我們必須放棄所有在戰爭中已被[ETH.GetNameDef]佔領的所有[SUD.GetAdjective]領土。外交官同時也表示會在這些地區組建一個新的[SUD.GetAdjective]政府，當然，政府的獨立性也會酌情而定。 "
 BBA_ethiopia_communist_events.46.a: "我們決不會放棄我們的領土。"
 BBA_ethiopia_communist_events.46.b: "我們別無選擇，只能同意"
 #DJI Peace
