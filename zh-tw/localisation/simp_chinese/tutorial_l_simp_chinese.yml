 HINT_AIR_BASE: "提示：空軍基地"
 HINT_AIR_BASE_TEXT: "世界被劃分為事先定好的§Y空域§!。一支§Y空軍聯隊§!是一組同一類型的飛機 （例如：戰鬥機或轟炸機），他們能被分配到一個空域。\n\n當你點擊了地圖上的一個§Y空軍基地§!，該空軍基地會被打開並自動選中該基地的所有空軍聯隊。\n\n§G右鍵點擊§!空域或空軍基地可以把空軍聯隊分配至該空域或讓其轉場到另一個基地。\n\n你也可以指派空軍聯隊到集團軍，只要選中一支空軍聯隊然後§G右鍵點擊§!屏幕底部的集團軍。"
 HINT_CONSTRUCTIONS: "提示：建設"
 HINT_CONSTRUCTIONS_TEXT: "這是§Y建設§!界面，你可以在這裡建設你的地區和省份。在遊戲開始時，建議花幾年建設£GFX_civ_factory §Y民用工廠§!，隨後再開始建設£GFX_mil_factory §Y軍用工廠§!或其他更特殊的建築。修建民用工廠可以在長遠上讓你修建更多的工廠。\n\n所有空閒的民用工廠都會被用來建設建造隊列裡的新建築。£GFX_infrastructure_texticon §G80%§!§Y地區基礎設施§!等級越高，建造速度越快。\n\n為了方便你查看，民用工廠都被高亮顯示。§Y點擊進入建造模式§!。當處於建造模式時，點擊地圖來添加建設任務到隊列裡。§Y按住 shift 點擊將添加最大數量。§!"
 HINT_ARMY_PLANNER: "提示：招募與部署"
 HINT_ARMY_PLANNER_TEXT_1_1: "這是§Y招募與部署§!界面，你可以創建陸軍師訓練隊列，並在之後進行部署。我們建議你在隊列中添加一個§Y步兵師§!。\n\n訓練中的陸軍師首先會嘗試獲得所需的§Y裝備§!。當其獲得裝備後，將會開始訓練。訓練進度永遠無法超過裝備進度。\n\n點擊§Y訓練§!按鈕添加一個陸軍師進行訓練。"
 HINT_ARMY_PLANNER_TEXT_1_2: "當陸軍師完成訓練後，他們可被§Y部署§!至§Y你選擇的地點§!。你只能在你的核心領土部署陸軍師。"
 HINT_ARMY_PLANNER_TEXT_2: "部隊可以被順序或並列建造。\n\n被並列訓練的部隊會以同樣的速率獲得§Y裝備§!。所以他們都會在大致相同的時間完成。當一支部隊獲得了所有需要的裝備並完成了全部訓練，他們就會被部署到你選擇的位置。\n\n點擊§Y添加單位§!來增加並列訓練的部隊。\n\n當戰況不利於你的時候，也許在部隊§Y獲得所有裝備和訓練前§!就部署更為有利。當然如果可以，這應當被避免。\n\n你可以在《鋼鐵雄心IV》維基讀到更多關於應該招募什麼部隊的信息。"
 HINT_DIPLOMACY_SCREEN: "提示：外交"
 HINT_DIPLOMACY_TEXT: "這是§Y外交§!界面，在這裡你能看到其他國家對你的評價，以及他們是否被其他國家保障獨立。\n\n瞭解你的假想目標是否有可召喚的盟友大有益處。\n\n你可以§G右鍵點擊§!任意國家查看可用外交行動。"
 HINT_DIVISION_DESIGNER: "提示：單位編成界面"
 HINT_DIVISION_DESIGNER_NOXP_TEXT: "這是§Y單位編成界面§!，在這裡你可以新建或編輯§Y單位編制§!。新建或編輯單位編制需要消耗£army_experience §Y陸軍經驗§!。陸軍經驗可通過單位與敵軍交戰或陸軍演習獲得。經驗等級1-§Y烏合之眾§!的單位不產生£army_experience 陸軍經驗。\n\n在你能新建或編輯單位編制前你需要更多的£army_experience 陸軍經驗。"
 HINT_DIVISION_DESIGNER_XP_TEXT: "這是§Y單位編成界面§!，在這裡你可以新建或編輯§Y單位編制§!。新建或編輯單位編制需要消耗£army_experience §Y陸軍經驗§!。陸軍經驗可通過單位與敵軍交戰或陸軍演習獲得。經驗等級1-§Y烏合之眾§!的單位不產生£army_experience 陸軍經驗。\n\n對於你的第一次編制編輯，我們建議你點擊支援連那一列的空位，向你的師添加 £unit_artillery_icon_small §Y火炮支援連§!。完成添加後，點擊§Y保存§!。你所有使用該編制的部隊從現在起會需要火炮§Y裝備§!。"
 HINT_EDIT_TEMPLATE_TEXT: "你正在生產並沒有被任何§Y師編制§!用到的裝備。而你也擁有足夠的£army_experience §Y陸軍經驗§!來做點什麼。\n\n點擊§YDivisione di Fanteria§!或其他單位邊上的§Y編輯§!。"
 HINT_EXECUTE_ORDER_TEXT: "在肖像的下面，有一個小的進度條（3）顯示你和潛在敵人的相對力量。\n\n如果你還沒給這個集團軍指派指揮官，你現在應該指派一位。點擊左上方的空白肖像。\n\n如果所有事情看上去都對你有利，計劃預期指示燈（2）應該是綠色的。如果是這樣，點擊執行計劃按鈕（1）。"
 HINT_NAVAL_MISSIONS: "提示：海軍任務"
 HINT_NAVAL_MISSIONS_TEXT: "這是§Y艦隊§!界面，在這裡你可以給選擇的艦隊下達指令。你可以分配§Y海軍任務§!讓你的艦隊完成一些工作。\n\n一支艦隊通常被分為數只§Y特遣艦隊§!。艦隊可以同時活躍於數個海域，但特遣艦隊卻不行。當一支艦隊在執行海軍任務時，它將嘗試覆蓋所有所選海域，但這會使其力量過於分散以至於難以抵擋強勢敵軍勢力。\n\n為了讓艦隊執行§Y海軍任務§!，點擊高亮的任務按鈕然後§G右鍵點擊§!一個§Y海域§!。命令你的艦隊去一個區域§Y巡邏§!似乎是個好主意。"
 HINT_LOGISTICS: "提示：後勤和補給"
 HINT_LOGISTICS_TEXT: "這是§Y後勤§!界面。這個界面的目的是幫助你查看生產速度是否跟得上消耗。\n\n如果你認為某型§Y裝備§!生產過多，也許減少該型號裝備§Y生產線§!上的工廠數量會是一個好主意。\n\n你的陸軍師§Y補給§!是否充足對戰場勝利至關重要。你可以切換至§Y補給地圖模式§!£GFX_F4 查看補給狀態。"
 HINT_LOGISTICS_TEXT_2: "補給由£GFX_capital_hub_texticon §Y補給首都§!集散並通過£GFX_train_texticon §Y火車§!或£GFX_convoy_texticon §Y運輸船§!運輸至不同省份的£GFX_supply_hub_texticon §Y補給中心§!或£GFX_naval_supply_hub_texticon §Y海軍基地§!。\n\n隨後補給將分發至補給中心範圍內的野戰陸軍師。你可通過選中£GFX_supply_hub_texticon §Y補給中心§!並按住£GFX_shift 來查看補給距離。距離可被使用£GFX_unit_motorized_icon_small §Y卡車§!的摩托化程度影響。\n\n效率進一步受到£GFX_railways_texticon §Y鐵路§!和£GFX_naval_supply_hub_texticon §Y海軍基地§!等級，缺乏£GFX_train_texticon §Y火車§!及敵軍空襲影響。這會產生一些§R瓶頸§!。瓶頸可通過升級到補給首都的鐵路、提供戰鬥機防空及保證有足量火車來緩解。補給可用情況在§Y補給地圖模式§!£GFX_F4 中顯示。"
 HINT_OBJ_LOG_1: "切換至§L補給地圖模式§!£GFX_F4"
 HINT_OBJ_LOG_2: "切換回§L普通地圖模式§!£GFX_F1"
 HINT_NATIONAL_FOCUS: "提示：國策"
 HINT_NATIONAL_FOCUS_TEXT: "這是§Y國策§!界面。你的國家能在此選擇政治目標，這些政治目標能帶來一些加成，或是產生一些能推進遊戲進行的效果。\n\n為了方便你選擇，我們已經高亮了一些我們推薦的初始國策。推薦這條路線的理由是它能讓你儘快獲得另一個§Y科研槽§!，使你同時多研究一項£tech_mod §Y科技§!。"
 HINT_NATIONAL_FOCUS_RECOMMENDED_TEXT: "推薦國策"
 HINT_NO_TEMPLATE: "提示：沒有編制"
 HINT_NO_TEMPLATE_NO_XP_TEXT: "你點擊了§Y沒有編制警告§!。別緊張，點擊警告尋找答案是一件很好的事，他們在這裡就是為了幫你。\n\n最可能的情況是，你創建了一條火炮生產線，然而當前，你沒有一個§Y單位§!的§Y單位編制§!會使用這個裝備。\n\n當你獲得更多的£army_experience §Y陸軍經驗§!後，你可以修改你的單位編制來增加火炮。£army_experience 陸軍經驗可以通過戰鬥或演習來獲取。\n\n現在你可以忽略這個警告，教程會在你獲得更多的£army_experience 陸軍經驗後幫助你。"
 HINT_NO_TEMPLATE_HAVE_XP_TEXT: "你點擊了§Y沒有編制警告§!，這個警告告訴你，你正在生產沒被使用的裝備。\n\n為了讓你的單位使用新型裝備，你需要修改他們的§Y單位編制§!。編輯單位編制消耗 £army_experience  §Y陸軍經驗§!。\n\n前往§Y招募與部署§!界面選擇單位編制來§Y編輯§!。\n\n在這個警告上懸浮鼠標彈出說明框，你可以看到你正在生產哪些沒被用到的裝備。"
 HINT_POLITICS_SCREEN: "提示：政治"
 HINT_POLITICS_SCREEN_TEXT: "這是§Y政治界面§!，在這裡你可以查看國家的§Y國策§!，£pol_idea §Y法律§!，§Y僱員§!等。\n\n£pol_power §Y政治點數§!代表了你國家實現政治目標的能力。\n僱傭顧問，正當化宣稱或是保障獨立都需要 £pol_power 政治點數。\n\n£pol_idea 理念給你的國家在各個領域帶來加成，不過他們也需要用 £pol_power 政治點數來實施。"
 HINT_PRODUCTION_LINES: "提示：生產線"
 HINT_PRODUCTION_LINES_TEXT_1: "這是§Y生產線§!界面。生產線生產戰爭所需的裝備。建議你同時生產現在和未來所需的裝備。\n\n有兩種生產線：軍用和海軍。前者使用£factory_item §Y軍用工廠§!，後者使用£naval_factory_icon §Y海軍船塢§!。生產線中使用的工廠越多，裝備生產速度越快。\n\n可通過點擊四個高亮按鈕中的一個創建一條生產線。"
 HINT_PRODUCTION_LINES_TEXT_2: "選擇一種裝備型號後，將創建該型號裝備的生產線。\n\n閱讀§Y下一頁§!提示§Y查看建議§!，瞭解應該生產什麼，以及每條生產線分配多少工廠。"
 BUTTON_HINT_PAGE_1: "1"
 BUTTON_HINT_PAGE_2: "2"
 HINT_PRODUCTION_LINES_2_1: "在下面的圖片裡，你可以看到一條分配了§Y10§!座£factory_item §Y軍用工廠§!的生產線。"
 HINT_PRODUCTION_LINES_2_2: "我們推薦你同時新建以下生產線："
 HINT_RESEARCH_TREE: "提示：科研樹"
 HINT_RESEARCH_TREE_TEXT: "這是§Y科研樹§!。儘管一眼看上去鋪天蓋地，但實際上它並沒有那麼複雜。我們為你高亮了一些遊戲開局的推薦科技。\n\n提升國家的工業基礎和一些通用的軍事項目總是一個好主意，隨著遊戲的進展，也許應該開始研究一些更特別的科技，例如坦克或是飛機。這都取決於你打算做什麼。\n\n當你超前研究科技的時候，將會花費更多的時間。有一些§Y國策§!能夠降低某些科技的超前懲罰。"
 HINT_RESEARCH_SCREEN: "提示：科研"
 HINT_RESEARCH_SCREEN_TEXT: "這是§Y科研§!界面。你擁有一些科研槽，每個都可以研究一個£tech_mod  §Y科技§!。點擊空閒的§Y科研槽§!選擇一項研究。\n\n不同國家有不同的科研槽數量，主要國家通常會多一些。通過某些§Y國策§!可以解鎖額外的科研槽。國策會在另一個警告和提示中介紹。"
 HINT_DECISION_SCREEN: "提示：事件和決議"
 HINT_DECISION_SCREEN_TEXT: "§Y事件§!在遊戲過程中發生。遊戲中有大量事件，可對玩家的國家產生有利、不利或混合的結果。它們以彈出通知的形式出現在玩家屏幕上，可能給玩家提供選項，或僅僅通知玩家結果並要求玩家確認事件已發生。\n\n§Y決議§!是你可努力爭取的長期和/或短期目標。執行決議消耗£pol_power §Y政治點數§!。\n\n一些決議是限時的，需要在有限時間內達成特定條件。"
 HINT_INTELLIGENCEAGENCY_SCREEN: "提示：情報機構"
 HINT_INTELLIGENCEAGENCY_SCREEN_TEXT: "這是§Y情報機構§!界面。招募間諜、收集情報、建立間諜§Y情報網§!和執行§Y行動§!都需要§Y情報機構§!。§Y密碼學§!是戰爭的另一面，破解敵方密碼可在戰場帶來巨大優勢。\n\n你的情報等級越高，你對敵方軍隊部署、工業能力、研究焦點等知道得越多。\n\n你可以§G右鍵點擊§!一個國家顯示其§Y外交§!欄旁邊的§Y情報欄§!。"
 HINT_OFFICER_CORPS_SCREEN: "提示：軍官團"
 HINT_OFFICER_CORPS_SCREEN_TEXT_1: "這是§Y軍官團§!界面。在這裡可指派§Y總司令§!、§Y理論家§!以及§Y陸軍§!、§Y海軍§!和§Y空軍部長§!。\n\n總司令和部長提供每日£army_experience §Y陸軍經驗§!、£navy_experience §Y海軍經驗§!、£air_experience §Y空軍經驗§!以及下方所顯示的各軍種特定數值加成。"
 HINT_OFFICER_CORPS_SCREEN_TEXT_2: "理論家降低注重整體戰略的陸軍、海軍和空軍§Y學說§!花費。學說為各軍種設計，提供陸軍師、海軍艦隊和空軍聯隊提供加成。"
 HINT_OCCUPIED_TERRITORIES_SCREEN: "提示：佔領地區"
 HINT_OCCUPIED_TERRITORIES_SCREEN_TEXT: "為了鎮壓抵抗並監管人群，佔領地區需要軍隊駐紮進行管制。遊戲中的駐軍代表了這一點，駐軍可通過點擊左上角國旗打開的§Y政治界面§!中的§Y佔領地區§!標籤指派。\n\n駐軍部隊在地圖上不可見，且自動分配並獲得裝備。裝備的分配可通過§Y招募與部署§!標籤設置。"
 HINT_SELECT_UNIT_TEXT: "是時候向§Y埃塞俄比亞§!開戰了。你應該先創建一個帶進攻命令的作戰計劃來給你的部隊下達指令。\n\n在§Y厄立特里亞§!地區§Y選擇高亮部隊§!。"
 HINT_TRADE_SCREEN: "提示：貿易"
 HINT_TRADE_SCREEN_TEXT: "這是§Y貿易§!界面，在這裡你可以用你£GFX_civ_factory §Y民用工廠§!的產出來交換資源。\n\n§Y資源不足警告§!在你有生產線缺乏資源時就會顯示。缺乏資源的生產線會以較低的速率繼續生產。貿易是一個可行的解決方案。\n\n記住當你把民用工廠用來交易，他們就無法同時用來建造建築了。"
 HINT_WAR_SCREEN: "提示：戰爭"
 HINT_WAR_SCREEN_TEXT: "這是§Y戰爭§!界面，在這裡會顯示戰爭的進程。\n\n意大利正和埃塞俄比亞交戰，不過現在不用擔心。繼續查看其他的警告。"
 HINT_WORLD_TENSION: "提示：全球緊張度"
 HINT_WORLD_TENSION_TEXT: "這是£world_tension_icon  §Y全球緊張度§!界面。所有引起全球緊張度變化的事件都會在這裡列出。\n\n全球緊張度是一個用來描述這場遊戲熱度的度量。一些國家的§Y外交行動§!在全球緊張度沒有到達一定程度前無法執行。\n\n一般而言，軸心國家希望全球緊張度保持低點來阻止民主國家干涉，而民主國家則希望全球緊張度升高以便於干涉。\n\n宣戰，正當化宣稱，吞併領土，完成某些§Y國策§!都能升高全球緊張度。\n\n全球緊張度越高，你離一場世界大戰就越近。"
 HINT_WORLD_TENSION_TEXT_2: "£world_tension_icon  §Y全球緊張度§!是一個用來描述這場遊戲熱度的度量。一些國家的§Y外交行動§!在全球緊張度沒有到達一定程度前無法執行。\n\n一般而言，法西斯和共產主義勢力希望全球緊張度保持低點來阻止民主國家干涉，而民主國家則希望全球緊張度升高以便於干涉。\n\n宣戰，正當化宣稱，吞併領土，完成某些§Y國策§!都能升高全球緊張度。\n\n全球緊張度越高，你離一場世界大戰就越近。"
 HINT_LOW_SUPPLY: "提示：補給"
 HINT_LOW_SUPPLY_TEXT_1: "單位需要補給保持戰鬥力。補給從£GFX_capital_hub_texticon §Y補給首都§!出發，通過£GFX_train_texticon §Y火車§!或£GFX_convoy_texticon §Y運輸船§!運送至不同省份中的£GFX_supply_hub_texticon §Y補給中心§!或£GFX_naval_supply_hub_texticon §Y海軍基地§!。\n\n然後，補給中心將補給分配至補給範圍內的單位。你可以選中一個£GFX_supply_hub_texticon §Y補給中心§!並長按£GFX_shift來查看補給範圍。§Y摩托化優先度§!能提高補給中心的範圍，即你的單位能收到補給的範圍。這將使用£GFX_unit_motorized_icon_small §Y卡車§!。"
 HINT_LOW_SUPPLY_TEXT_2: "你可以通過點擊集團軍面板左上角的按鈕循環切換三個等級，來改變一個集團軍的§Y摩托化優先度§!。優先度默認設置為低，此時不會使用£GFX_unit_motorized_icon_small §Y卡車§!。\n\n§Y補給地圖模式§!£GFX_F4 展示了補給可用性。點擊£GFX_F1 回到§Y默認地圖模式§!。"
 HINT_4_FAC: "£factory_item §Yx4§!"
 HINT_3_FAC: "£factory_item §Yx2§!"
 HINT_2_FAC: "£factory_item §Yx2§!"
 HINT_13_FAC: "£factory_item §Yx1§!"
 HINT_11_FAC: "£naval_factory_icon   §Yx10§!"
 HINT_12_FAC: "£naval_factory_icon §Yx1§!"
 INTERNATIONAL_MARKET_HINT_SCREEN: "提示：國際市場"
 INTERNATIONAL_MARKET_HINT_SCREEN_TEXT: "這是§Y國際市場§!界面。在這裡，你可以從其他國家買進裝備，或者售出自己的裝備來換取£GFX_civ_factory_output $CIC_BANK_HIGHLIGHT$，後者能暫時提高你的建設速度。\n\n買進裝備時，你需要為合同分配£GFX_civ_factory §Y民用工廠§!，用以生產需要支付的£GFX_civ_factory_output $CIC_BANK_HIGHLIGHT$。分配工廠越多，交付次數就越少，裝備就能越早全額收貨。注意，用於支付合同的£GFX_civ_factory §Y民用工廠§!不能用來建設建築。\n\n當某個合同沒能交付或生產預期數額的裝備或£GFX_civ_factory_output $CIC_BANK_HIGHLIGHT$時，§Y國際市場§!按鈕上將顯示§Y低效合同警告§!。這時合同仍將繼續，但需更多交付次數才能完成。"
 BUTTON_WIKI_MARKET: "在HOI4維基上閱讀關於§H市場§!的條目！"
 MILITARY_INDUSTRIAL_ORG_HINT_SCREEN: "提示：軍工機構"
 MILITARY_INDUSTRIAL_ORG_HINT_SCREEN_TEXT: "你可以在生產、研發或設計裝備時分配$INDUSTRIAL_ORG_TOOLTIP_HEADER$。這些組織可改進其正在研發或設計的裝備。分配至生產線時則有助於生產速度、效率和資源需求。\n\n每完成一項任務，$INDUSTRIAL_ORG_TOOLTIP_HEADER$就會獲得可用於解鎖特質的經費。這些特質會改進$INDUSTRIAL_ORG_TOOLTIP_HEADER$對裝備或生產的加成。\n\n將$INDUSTRIAL_ORG_TOOLTIP_HEADER$分配至研究項目需要每天花費£pol_power §Y政治點數§!。"
 BUTTON_WIKI_MILITARY_INDUSTRIAL_ORG: "在HOI4維基上閱讀關於§H軍工機構§!的條目！"


